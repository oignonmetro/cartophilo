name: APK Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier en release (ex. 1.0.0) ; vide = simple build de test, sans release"
        required: false
        type: string
  push:
    tags: ['v*']

jobs:
  apk:
    name: Construire l'APK
    runs-on: ubuntu-latest
    # `contents: write` sert deux étapes ci-dessous : publier la release, et
    # republier `public/app-version.json` sur `main`.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Un tag `v*` publie toujours une release ; un déclenchement manuel ne
      # le fait que si une version a été renseignée. `softprops/action-gh-release`
      # sait créer le tag lui-même quand on le lance hors d'un push de tag.
      - name: Déterminer si cette exécution publie une release
        id: vars
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version_name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version_name=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag_name=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Le SDK Android est préinstallé sur les runners GitHub ; seul le JDK
      # doit être choisi explicitement.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # En release, l'APK embarque le numéro de version : c'est ce que
      # `src/content/appUpdate.ts` compare au contenu de `app-version.json`
      # pour savoir si une mise à jour existe.
      - name: Fixer la version de l'APK
        if: steps.vars.outputs.release == 'true'
        run: |
          sed -i "s/versionCode .*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"${{ steps.vars.outputs.version_name }}\"/" android/app/build.gradle

      # L'APK sert ses fichiers depuis la racine de la WebView : pas de préfixe.
      - name: Build web puis synchronisation Capacitor
        run: npm run android:sync

      # La release est signée par une clé dédiée, distincte de celle de debug :
      # sa compromission permettrait de publier un faux APK que les appareils
      # existants accepteraient comme mise à jour légitime (voir le commentaire
      # dans android/app/build.gradle). Elle n'est donc jamais versionnée ;
      # ces secrets doivent être créés une fois dans les réglages du dépôt.
      - name: Décoder la clé de signature de release
        if: steps.vars.outputs.release == 'true'
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "::error::Secrets de signature de release manquants (RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD) — voir README.md « Construire l'APK »."
            exit 1
          fi
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/android/release.keystore"

      - name: Assembler l'APK
        working-directory: android
        env:
          RELEASE_KEYSTORE_FILE: ${{ github.workspace }}/android/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon ${{ steps.vars.outputs.release == 'true' && 'assembleRelease' || 'assembleDebug' }}

      - uses: actions/upload-artifact@v4
        with:
          name: cartophilo-${{ steps.vars.outputs.release == 'true' && 'release' || 'debug' }}-apk
          path: android/app/build/outputs/apk/${{ steps.vars.outputs.release == 'true' && 'release' || 'debug' }}/*.apk
          if-no-files-found: error

      - name: Publier la release
        if: steps.vars.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          files: android/app/build/outputs/apk/release/*.apk

      # La bannière de mise à jour de l'app (voir `AppUpdateBanner.tsx`) lit ce
      # fichier sur GitHub Pages. On le republie sur `main`, ce qui redéploie
      # les Pages via `pages.yml` — même mécanisme que le contenu des cours.
      - name: Publier la version pour la bannière de mise à jour
        if: steps.vars.outputs.release == 'true'
        run: |
          git fetch origin main
          git checkout main
          cat > public/app-version.json <<JSON
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "${{ steps.vars.outputs.version_name }}",
            "url": "https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag_name }}/app-release.apk"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/app-version.json
          git diff --cached --quiet || git commit -m "Publier la version ${{ steps.vars.outputs.version_name }} pour la bannière de mise à jour de l'APK"
          git push origin main
