apply plugin: 'com.android.application'

android {
    namespace = "app.cartophilo"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.cartophilo"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Sans ceci, chaque exécution de CI (machine neuve à chaque fois) génère
    // sa propre clé de debug aléatoire : deux builds successifs sont alors
    // signés différemment, et Android refuse d'installer le second par-dessus
    // le premier (« Application non installée »). Une clé fixe, versionnée,
    // permet à chaque release de mettre à jour la précédente normalement.
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Même raisonnement que pour la clé de debug ci-dessus — les mises à
        // jour en place exigent une signature stable d'une release à l'autre
        // — mais ici la clé ne doit JAMAIS être versionnée : sa compromission
        // permettrait à quiconque de publier un faux APK que les appareils
        // existants accepteraient comme mise à jour légitime. Elle est fournie
        // par variables d'environnement (voir .github/workflows/android.yml,
        // qui les peuple depuis les secrets du dépôt), ou localement via
        // android/keystore.properties (gitignored — voir keystore.properties.example).
        release {
            def props = new Properties()
            def propsFile = rootProject.file('keystore.properties')
            if (propsFile.exists()) {
                propsFile.withInputStream { props.load(it) }
            }
            def resolvedStoreFile = System.getenv('RELEASE_KEYSTORE_FILE') ?: props.getProperty('storeFile')
            storePassword = System.getenv('RELEASE_KEYSTORE_PASSWORD') ?: props.getProperty('storePassword')
            keyAlias = System.getenv('RELEASE_KEY_ALIAS') ?: props.getProperty('keyAlias')
            keyPassword = System.getenv('RELEASE_KEY_PASSWORD') ?: props.getProperty('keyPassword')
            if (resolvedStoreFile) {
                // rootProject (android/), pas ce module (android/app/) : place
                // le chemin relatif de keystore.properties au même niveau que
                // debug.keystore, et fonctionne aussi bien avec un chemin
                // absolu (celui que fournit la CI).
                storeFile rootProject.file(resolvedStoreFile)
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Ne s'applique que si signingConfigs.release a bien trouvé une
            // clé (voir ci-dessus) ; sans ça, un `assembleRelease` local sans
            // secrets produit un APK release non signé plutôt que d'échouer.
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
