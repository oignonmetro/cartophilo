# Définitions du glossaire de Marx (voir src/content/definitions.ts) : une
# par entrée, sous l'identifiant de son unité. Chacune est un attribut, sans
# majuscule ni point final, qui complète « la notion est … » : elle s'affiche
# au survol d'un renvoi, se cite dans un rappel par [def] (ou [def:g-…]), sert
# de sous-titre à l'entrée et nourrit le grand exercice de révision du glossaire.
# La notion et le terme allemand se lisent dans le titre de l'entrée.
g-activite-vitale: 'la {green}vie même en tant qu''elle s''exerce{/green} : {amber}ce qu''un vivant fait pour vivre{/amber}, confondu avec lui chez l''__animal__, mais objet de sa conscience et de sa volonté chez l''__homme__, qui est par là libre'
g-besoin: 'le {green}rapport d''un être naturel à l''objet hors de lui dont il dépend{/green}, qui donne au travail sa fin et que la production {amber}transforme et multiplie en le satisfaisant{/amber}'
g-corps-non-organique: 'la {green}nature extérieure en tant qu''elle prolonge le corps de l''homme{/green} : ce dont il vit, ce sur quoi et avec quoi il agit, et avec quoi il doit {amber}maintenir un processus constant pour ne pas mourir{/amber}'
g-etre-generique: 'l''{green}homme en tant qu''il fait du genre son objet{/green} : un vivant qui se rapporte à lui-même comme à un {amber}être universel, donc libre{/amber}, et non le simple membre d''une espèce'
g-expression-de-la-vie: 'l''{green}activité par laquelle l''homme met ses forces au dehors, dans des objets{/green}, qui {amber}confirme sa vie au lieu de la lui retirer{/amber} tant que l''objet n''est pas pris par un autre, et qui s''oppose à l''{red}avoir{/red}'
g-etre-naturel: 'l''{green}homme en tant qu''il fait partie de la nature{/green} : un être {amber}actif par ses forces et passif par ses besoins{/amber}, qui a hors de lui les objets dont il vit et qui est lui-même objet pour d''autres êtres'
g-vie-materielle: 'la {green}production, par des hommes en rapports déterminés, de leurs moyens d''existence{/green}, premier fait historique et base qui {amber}conditionne la vie sociale, politique et intellectuelle{/amber}'
g-vie-accomplie: 'une {green}vie où ce qu''on fait pour vivre est aussi ce par quoi on se réalise{/green}, que la {red}division du travail mutile{/red} et qui n''est possible qu''{amber}avec le libre développement de tous{/amber}'
g-vie-generique: 'la {green}vie de l''espèce humaine en tant qu''elle se produit elle-même{/green}, dans le travail en 1844, dans la communauté politique en 1843, et que l''{red}aliénation et l''État séparent de la vie de l''individu{/red}'
g-metabolisme: 'l''{green}échange matériel continu entre l''homme et la nature{/green}, que le travail {amber}règle et contrôle{/amber}, et dont dépend la vie humaine'
g-survie: 'la {green}simple conservation de l''existence physique de l''ouvrier{/green}, que l''économie politique tient pour la mesure du salaire alors qu''elle n''est que la {amber}limite inférieure de la valeur de la force de travail{/amber}, et que le capital {red}use et rend précaire{/red}'
g-travail-aliene: 'l''{green}activité productive devenue étrangère à celui qui l''exerce{/green} : son produit, son acte, son genre et les autres hommes se dressent contre l''ouvrier comme {red}une puissance hostile{/red}'
