# Définitions du glossaire de Marx (voir src/content/definitions.ts) : une
# par entrée, sous l'identifiant de son unité. Chacune est un attribut, sans
# majuscule ni point final, qui complète « la notion est … » : elle s'affiche
# au survol d'un renvoi, se cite dans un rappel par [def] (ou [def:g-…]), sert
# de sous-titre à l'entrée et nourrit le grand exercice de révision du glossaire.
# La notion et le terme allemand se lisent dans le titre de l'entrée.
g-activite-vitale: 'la {green}vie même en tant qu''elle s''exerce{/green} : {amber}ce qu''un vivant fait pour vivre{/amber}, confondu avec lui chez l''__animal__, mais objet de sa conscience et de sa volonté chez l''__homme__, qui est par là libre'
g-etre-generique: 'l''{green}homme en tant qu''il fait du genre son objet{/green} : un vivant qui se rapporte à lui-même comme à un {amber}être universel, donc libre{/amber}, et non le simple membre d''une espèce'
g-travail-aliene: 'l''{green}activité productive devenue étrangère à celui qui l''exerce{/green} : son produit, son acte, son genre et les autres hommes se dressent contre l''ouvrier comme {red}une puissance hostile{/red}'
