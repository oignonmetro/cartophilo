- id: verite3-l4
  title: "Marx et Galilée : la lecture d'Althusser"
  notes: |-
    **Dans** {sky}***Lire le Capital***{/sky}**,** {sky}**Althusser**{/sky} **attribue à Marx le tracé d'une configuration de savoir qui rend l'histoire intelligible,** {amber}par analogie avec la physique mathématique de Galilée{/amber}. Une science y écrit ses lois sous trois conditions : une {violet}sémantique{/violet} (ce que désignent ses objets), une {violet}syntaxe{/violet} (les règles qui les lient), une {violet}expression{/violet} qui articule les deux.

    | Condition | Chez Galilée | Chez Marx |
    | sémantique | les corps comme grandeurs | la marchandise |
    | syntaxe | la causalité comme légalité | les cycles |
    | expression | la fonction mathématique | la composition du capital |

    **Galilée.** La sémantique interprète les phénomènes, les mouvements et les positions des corps, comme des {yellow}grandeurs{/yellow} et des {yellow}points de masse{/yellow} ; la syntaxe détermine la causalité comme {amber}forme de leur légalité{/amber} ; l'expression est la fonction mathématique comme {violet}co-variance{/violet} des grandeurs.

    **Marx.** La science historique concrète écrit les lois de la {amber}variation de la valeur marchande{/amber} : une sémantique (le concept de marchandise), une syntaxe (les cycles de la marchandise), une expression (les structures de la composition du capital). Celles-ci sont une {violet}co-variance{/violet} encore, exprimée en rapports qualitatifs entre des grandeurs telles que le {amber}capital constant{/amber} et le {amber}capital variable{/amber}, le {amber}taux de la survaleur{/amber} et le taux d'exploitation de la force de travail.

    **Reste à dire à quelle nécessité obéit ce geste savant.** Au-delà de la lecture d'Althusser, il appelle trois éclairages. **Le premier** : comme opération théorique immanente à la {blue}*praxis*{/blue}, il répond à une {coral}exigence d'objectivation scientifique{/coral} des structures concrètes, c'est-à-dire historiques, en raison de la {amber}puissance sociale de la science moderne{/amber}.

    **Marx combat donc sur le terrain de la scientificité abstraite** : à l'abstraction idéologique, {pink}non opérante{/pink}, de l'économie politique et de ses représentations générales, il oppose la {green}pertinence de concepts{/green} qui objectivent le travail comme puissance sociale à travers les variations de la valeur. Ces concepts sont {coral}mis à l'épreuve{/coral} et peuvent être rectifiés, purifiés, remaniés, comme ceux des sciences de la nature.
  points:
