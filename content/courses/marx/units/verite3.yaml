- id: verite3-l3
  title: "Une science de l'histoire contre la fermeture des sciences abstraites"
  notes: |-
    **Marx crayonne une** {violet}**science générale de l'histoire**{/violet}**, science du** {amber}fait social total{/amber} **mais aussi du** {amber}fait naturel total{/amber}**, en opposition à l'abstraction des sciences de la nature.** {sky}*L'Idéologie allemande*{/sky} va jusqu'à écrire : {teal}« {/teal}Nous ne connaissons {teal}qu'une seule science{/teal}, celle de l'{teal}__histoire__{/teal}.{teal} »{/teal}

    **« Abstraites » ne veut pas dire irrationnelles.** En qualifiant ainsi les sciences modernes, fondées sur la {violet}mathématisation{/violet} de la nature, Marx {red}ne conteste pas leur rationalité{/red} : {coral}pas de rationalité sans abstraction, pas de science sans rationalité, pas de liberté de la praxis sans science{/coral}.

    **Ce qui est visé, c'est leur** {red}__fermeture__{/red} dans l'abstraction, l'idéologie qu'elles renferment, ce qu'{sky}Althusser{/sky} a nommé la {violet}philosophie spontanée des savants{/violet}. Elle produit nécessairement des aberrations dans les disciplines qui prennent pour objet les faits humains et sociaux, de deux côtés :

    | Côté | L'aberration |
    | les conventions | on les oppose, arbitraires, aux lois naturelles |
    | la norme | on érige la loi de la nature en raison |

    **D'un côté**, elles opposent à la nécessité des lois de la nature l'{pink}arbitraire des conventions{/pink}, reconnaissable à la variabilité des faits humains. **De l'autre**, elles érigent la légalité du fait de nature en {red}norme de rationalité{/red} : l'alternative entre {amber}conformité et écart à la norme{/amber} devient le principe qui rend intelligibles les comportements, et la théorie se confond avec un jugement sur ce qui est adapté ou inadapté : {yellow}victoire des plus adaptés, défaite des moins adaptés{/yellow} dans le combat qu'est la vie.

    **La forme actuelle de ce naturalisme** est un {violet}paradigme évolutionniste{/violet}, accrédité en Occident depuis la fin du XXe siècle par l'autorité de {sky}Darwin{/sky}, où tout comportement s'évalue par un calcul {amber}coût-bénéfice{/amber}. Le fait humain y est à la fois reconnu dans sa portée institutionnelle et naturalisé.

    **Une science générale de l'histoire interrogerait autrement la climatologie** et ses modèles mathématiques : {amber}quelle trajectoire historique a rendu l'anthropocène possible ?{/amber} Et {amber}comment reconnaître, à travers les contraintes modélisées, la possibilité d'une praxis ?{/amber}

    **La conclusion est double.** La libre {blue}*praxis*{/blue} {green}__requiert__{/green} les modèles de la science comme projet de mathématisation de la nature ; mais sa rationalité interne {coral}prescrit une alternative à la philosophie spontanée des savants{/coral}, donc à l'idéologie : une {violet}fonction critique interne{/violet}, qui inscrit les opérations de la recherche dans le champ de la {blue}*praxis*{/blue} productive.
