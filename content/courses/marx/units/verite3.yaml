- id: verite3-l7
  title: "Le vrai est un événement, non une garantie"
  notes: |-
    **Avec Marx, le travail s'est laissé penser comme** {amber}**le sol, et aussi le plan, de tout dévoilement**{/amber}**, comme le dévoilement même.** La production s'y dévoile à elle-même sa réalité, ses modalités, son mouvement, en des {violet}entités catégoriales{/violet}, par une phénoménologie de {sky}Husserl{/sky} rectifiée, replacée sur le plan de la {blue}*praxis*{/blue}.

    **La pratique théorique qui produit ces entités prend parti** : elle oppose le {green}communisme{/green} au {red}mode de production capitaliste{/red}, le communisme à la {red}préhistoire de l'humanité aliénée{/red}, la rigueur théorique à la {red}violence sournoise de l'idéologie{/red}. Dire que le communisme est le mouvement réel de l'histoire, c'est dire qu'il en est la vérité. La formule de {sky}*L'Idéologie allemande*{/sky} est : {teal}« {/teal}Nous appelons communisme le {teal}__mouvement réel__{/teal} qui {teal}__abolit l'état actuel__{/teal}.{teal} »{/teal} Une formule prêtée à {sky}Lénine{/sky} la prolonge : la vérité est révolutionnaire.

    **Mais la pratique théorique, moment de la praxis, a ses propres intérêts** : intérêts théoriques, mais aussi sociaux, techniques et matériels de sa réalisation. D'où un {red}**double effet de voilement**{/red}.

    | Ce qui est exposé | Le risque |
    | la production théorique | se couper des intérêts de la pratique |
    | la praxis des luttes | des intérêts de groupe se déguisent |

    **Premier effet.** La production {amber}théorique{/amber} des entités catégoriales ({yellow}mode de production, rapports de production, forces productives{/yellow}) a son autonomie dans la pratique productive, et peut se couper de ses conditions : elle {red}n'embraye pas nécessairement sur les intérêts pratiques immédiats{/red}, même militants, et {red}n'échappe pas à la surdétermination idéologique{/red} liée à la sociabilité de l'activité théorique.

    **Second effet.** La praxis, même avec la compréhension qui l'habite dans les luttes, est {coral}intrinsèquement exposée à l'idéologie{/coral} : des intérêts de groupe, par exemple {yellow}bureaucratiques{/yellow}, peuvent se dissimuler sous un intérêt universel de classe.

    **Le communisme n'est donc pas une entité catégoriale** : il n'est {red}pas le nom d'une évidence{/red}, qui signifierait la transparence à soi de la praxis. Il est le nom d'une {green}libération{/green}, {red}exposée au risque constant d'une oppression{/red}. Le « mouvement réel » n'est pas un aller sans retour vers la vérité : c'est un mouvement porté par la tension, la {violet}co-originarité du voilement et du dévoilement{/violet}.

    **La leçon d'**{sky}**Althusser**{/sky} **est le caractère** {amber}**trans-historique**{/amber} **de l'idéologie.** Elle {red}ne se confond pas avec une « nature humaine »{/red}, et elle n'est {red}pas non plus un état transitoire{/red} dont le communisme délivrerait l'humanité à la « fin de l'histoire » : {coral}elle est l'ombre portée de tout effort théorique vers la vérité dans l'histoire même{/coral}. Au cœur du plus puissant effort théorique, l'idéologie et ses simulacres menacent. **Le vrai est un événement, pas une garantie** ; ce défaut de garantie, la pensée de {sky}Heidegger{/sky} le cherche dans le voile même, au cœur du dévoilement.
  points:
