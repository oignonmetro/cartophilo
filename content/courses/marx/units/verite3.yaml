- id: verite3-l2
  title: "Contre l'économie politique : le travail, activité libre"
  notes: |-
    **La science de l'unité de la société et de la nature rend à** {amber}l'animal non humain son instinct{/amber}**, et à** {amber}l'homme ce que sa praxis a de laborieux{/amber}**, mais aussi de** {violet}**praxéo-logique**{/violet} : en elle, les hommes {coral}déploient comme une activité les puissances qui leur sont pré-données{/coral} et qui sont leur {blue}*pathos*{/blue} même, ce qu'ils reçoivent et subissent.

    **L'économie politique ne voit dans ces puissances qu'une** {red}__condition subie__{/red}. Elle réduit l'histoire à une anthropologie, l'anthropologie à une psychologie, la psychologie à une théorie comportementaliste des réactions au {yellow}stress{/yellow}, entendu comme l'effet de la pression du réel sur l'homme.

    **Marx lui oppose la « psychologie » comme histoire.** {sky}*Manuscrits de 1844*{/sky} : {teal}« {/teal}l'{teal}histoire de l'industrie{/teal} et l'existence objective constituée de l'industrie sont le {teal}__livre ouvert des forces humaines essentielles__{/teal}, la {teal}__psychologie de l'homme concrètement présente__{/teal}{teal} »{/teal}. Pour savoir ce que peut un homme, on ne regarde pas d'abord au-dedans, on regarde ce que l'industrie a fait. L'histoire est la théorie de la {blue}*praxis*{/blue} productive, et celle-ci, comme travail, est ce que {sky}*Le Capital*{/sky} (livre I, chap. V) nomme le {violet}**métabolisme entre l'homme et la nature**{/violet}.

    **Deux visages du travail.**

    | Sous quelle théorie | Ce qu'est le travail |
    | la théorie abstraite | une condition subie, une malédiction |
    | la science concrète | une activité libre, créatrice |

    **Sous la théorie abstraite**, le travail subi garde son trait religieux de {red}malédiction{/red}. **Sous une science concrète**, où la {blue}*praxis*{/blue} se pense, il apparaît comme il est parfois vécu : {green}activité libre, puissance créatrice de structures d'existence{/green}. Il donne alors {coral}la même dignité à la fabrication d'objets utiles et à la réalisation d'œuvres d'art{/coral}. Sans se confondre, toutes deux sont libérées de l'opposition abstraite entre besoins matériels, les {pink}arts mécaniques{/pink}, et besoins spirituels, les {pink}beaux-arts{/pink}.

    **Le besoin doit être repensé**, peut-être renommé : il désigne {amber}l'impulsion, intérieure à l'humanité des hommes, vers le développement de la puissance productive{/amber}. Le besoin nomme alors le cheminement de l'humanité vers elle-même, à la fois la {red}privation{/red} d'une forme attirante, le {violet}communisme{/violet}, et le {green}chemin{/green} de la vie qui croît en direction de cette forme.

    **La théorie, comme alternative à l'idéologie, est donc** {coral}**l'auto-dévoilement du besoin**{/coral} : l'être en chemin de la {blue}*praxis*{/blue} productive et de ses forces en croissance.
