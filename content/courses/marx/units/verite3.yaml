lessons:
- id: verite3-l1
  title: "La théorie, reconnaissance de la praxis : nature et société"
  notes: |-
    **Si la théorie n'est pas l'acte d'une conscience abstraite, elle est une** {violet}**opération de dévoilement immanente à la praxis**{/violet} : en elle la {blue}*praxis*{/blue} productive {coral}se reconnaît comme telle{/coral}, et cette reconnaissance s'accomplit dans et comme le dévoilement des {amber}modes de production et de leurs structures{/amber}.

    **Les** {sky}***Manuscrits de 1844***{/sky} **dessinent une science inouïe**, où toutes choses sont reconnues comme des {amber}modalités de l'objectivation de la puissance productive des hommes{/amber}.
    - {green}La nature{/green} : la connaissance de la matière, ses usages sociaux dans toutes les cultures, et jusqu'aux lois de la science moderne, puisque c'est {coral}l'horizon de la production comme travail{/coral} qui explicite la matière sous les catégories de {yellow}force{/yellow} et d'{yellow}énergie{/yellow}, sous les lois de la mécanique et de la thermodynamique.
    - {green}La société{/green} : les formes d'organisation du travail y prescrivent des formes de gouvernement, avec leurs institutions.

    **La nature est un fait social.** L'industrie moderne transpose les lois de la science en inventions techniques, selon les schémas des sciences de l'ingénieur. Le concept d'{violet}anthropocène{/violet}, que Marx n'imagine pas, lui donnera raison : il explicite les interférences entre les cycles naturels et l'industrie humaine par le bilan des échanges d'énergie ({yellow}émissions{/yellow}, {yellow}prélèvements{/yellow}).

    **Mais la nature ne serait pas un fait social si la société n'était un fait naturel.** Les hommes travaillent socialement selon une nécessité {amber}antérieure à toute invention technique{/amber}, et d'avance impliquée en toute invention. Inventions, institutions, {blue}*praxis*{/blue} comme jeu ouvert des médiations entre {amber}vie, travail et langage{/amber} apparaissent alors comme le plan où {coral}s'explicitent les puissances de la nature{/coral}.

    **La société unit ainsi le naturel de l'homme et l'humanité de la nature.** {sky}*Manuscrits de 1844*{/sky}, troisième manuscrit : {teal}« {/teal}la {teal}société{/teal} est l'{teal}achèvement de l'unité essentielle{/teal} de l'homme avec la nature, la {teal}vraie résurrection de la nature{/teal}, le {teal}__naturalisme accompli de l'homme__{/teal} et l'{teal}__humanisme accompli de la nature__{/teal}{teal} »{/teal}. Cette unité n'est pas une harmonie donnée : c'est le {green}processus productif{/green} qui la réalise, comme {blue}*praxis*{/blue}.
