- id: verite3-l5
  title: "Des intuitions catégoriales sans ego transcendantal"
  notes: |-
    **Deuxième éclairage : en objectivant scientifiquement ses structures, la** {blue}***praxis***{/blue} **productive** {coral}**se rapporte à elle-même, c'est-à-dire se dévoile**{/coral}. Or une objectivation suppose, et c'est ici s'écarter de Marx comme d'{sky}Althusser{/sky}, que des {violet}catégories{/violet} aient révélé ou imposé leur évidence dans des {violet}intuitions donatrices{/violet}, des saisies où la chose se donne elle-même.

    **La méthode est celle de** {sky}**Husserl**{/sky}, qui écrit pour défendre la logique transcendantale : {teal}« {/teal}La {teal}nature existant vraiment{/teal}, la socialité ou la culture existant vraiment, etc., cela n'a absolument pas d'autre sens que celui d'une certaine {teal}__objectité catégoriale__{/teal} et c'est le {teal}dessein intégral de la science{/teal} que de {teal}pénétrer{/teal}, avec une {teal}méthode scientifique{/teal}, jusqu'à cette objectité, en l'{teal}__engendrant__{/teal} suivant cette méthode.{teal} »{/teal}

    ? Objectité catégoriale : un objet qui n'est pas perçu par les sens seuls, mais saisi à travers des formes de pensée, ainsi un rapport, une loi, une structure.

    **Chez Marx**, la nature, la socialité et la culture existant vraiment se sont révélées comme {green}histoire{/green} existant vraiment, {green}praxis productive{/green} existant vraiment, donc comme nature et société prises dans leur métabolisme. Ce métabolisme s'est explicité à travers les {amber}modes de production{/amber}, dont l'un, le capitalisme, a acquis l'évidence d'un mode existant vraiment, avec ses structures de production, de consommation et de reproduction du capital. Ces structures, mises en évidence par concepts, ont rang d'{violet}intuitions catégoriales{/violet} au sens husserlien.

    **Mais l'écart avec Husserl est double.**
    - Ces intuitions {red}ne se donnent pas sur le plan séparé{/red} d'une logique transcendantale, distincte des sciences de fait : {coral}leur consistance s'éprouve dans l'espace même de la science du mode de production capitaliste{/coral}. En objectivant les structures historiques, Marx, du moins peut-on le présumer, met intuitivement à l'épreuve la teneur de ses opérateurs théoriques et en communique l'évidence.
    - **Troisième éclairage** : le plan où se forment ces intuitions {red}n'a pas le caractère de l'ego transcendantal{/red}, il a {green}__le caractère de la praxis__{/green}.

    ? Ego transcendantal : chez Husserl, le moi pris non comme un homme parmi d'autres, mais comme la source à partir de laquelle tout objet reçoit son sens.

    | Question | Husserl | Marx ainsi lu |
    | où se forment les catégories ? | l'ego transcendantal | la praxis |
    | où s'éprouvent-elles ? | la logique transcendantale | la science du capital |

    **Le théoricien se rapporte à lui-même** comme constitué sous les conditions historiquement déterminées du mode de production. La réalité qu'il déchiffre dans ces intuitions, et reconnaît comme siennes, est la {amber}puissance sociale du travail{/amber}, prise dans son {red}antagonisme avec le capital{/red}, qui définit les conditions de sa révélation et de son évaluation.
  points:
