- id: verite3-l6
  title: "La poéticité du vrai : l'argent contre la fraternité ouvrière"
  notes: |-
    **Chez Marx, la** {violet}**poéticité du vrai**{/violet} **est** {amber}la formation d'un discours de vérité sous les conditions du travail comme praxis productive{/amber} : il faut y chercher la part de ruse, de calcul, de jeu, de désir et d'artifice qui se reconnaît dans les jeux du voilement et du dévoilement.

    **L'artifice de tous les voilements, c'est l'**{red}**argent**{/red}**.** {sky}*Manuscrits de 1844*{/sky}, troisième manuscrit : {teal}« {/teal}L'argent en possédant la {teal}qualité de tout acheter{/teal}, en possédant la qualité de {teal}s'approprier tous les objets{/teal} est donc l'objet comme {teal}__possession éminente__{/teal}. L'universalité de sa qualité est la {teal}__toute-puissance de son essence__{/teal}. Il passe donc pour tout-puissant… L'argent est l'{teal}__entremetteur__{/teal} entre le {teal}besoin et l'objet{/teal}, entre la vie et le moyen de subsistance de l'homme. Mais ce qui sert de moyen terme à ma vie, sert aussi de moyen terme à l'existence des autres hommes pour moi. C'est pour moi {teal}__l'autre homme__{/teal}.{teal} »{/teal}

    **Marx cite ensuite le** {sky}***Faust***{/sky} **de** {sky}**Goethe**{/sky}, par la voix de Méphistophélès : {teal}« {/teal}Si je puis payer {teal}six étalons{/teal}, / Leurs {teal}forces{/teal} ne sont-elles pas {teal}miennes{/teal} ? / Je mène bon train et suis un gros monsieur, / Tout comme si j'avais {teal}__vingt-quatre pattes__{/teal}.{teal} »{/teal}

    **L'argent métamorphose et corrompt tout** : la force de travail d'un autre que j'achète est à moi, et je peux l'employer à écrire un {yellow}éloge qui change mes vices en vertus{/yellow}, sans que nul objecte, si j'ai de quoi acheter le silence de ceux qui menacent d'objecter.

    **À cette puissance corruptrice, Marx oppose la** {green}**puissance du travail comme puissance sociale de la vérité**{/green}. {teal}« {/teal}Lorsque les {teal}ouvriers communistes{/teal} se réunissent, c'est d'abord la doctrine, la propagande, etc., qui est leur but. Mais en même temps ils s'approprient par là un {teal}besoin nouveau{/teal}, le {teal}__besoin de la société__{/teal}, et ce qui semble être le {teal}moyen est devenu le but{/teal}. On peut observer les plus brillants résultats de ce mouvement pratique, lorsque l'on voit réunis des {teal}ouvriers socialistes français{/teal}. Fumer, boire, manger, etc., ne sont plus là comme des prétextes à réunion ou des moyens d'union. L'assemblée, l'association, la conversation qui à son tour a la société pour but leur suffisent, la {teal}fraternité humaine{/teal} n'est pas chez eux une phrase vide, mais une {teal}__vérité__{/teal}, et la {teal}noblesse de l'humanité{/teal} brille sur ces figures {teal}endurcies par le travail{/teal}.{teal} »{/teal}

    **La poéticité du vrai, c'est l'**{amber}expédient du banquet ouvrier{/amber}, auto-dévoilement de la praxis productive {coral}__comme société__{/coral}. La société est la {violet}subjectivation{/violet} de la puissance dans le sentiment de son propre accroissement, qui s'appelle la {green}joie{/green}. Au rebours de tout mensonge, cette joie culmine dans la {blue}*philia*{/blue}, la {violet}fraternité humaine{/violet}.

    **La reconnaissance de cette joie dans un discours a besoin d'**{amber}**espièglerie**{/amber} : citer Goethe est l'artifice qui met les rieurs du côté de la fraternité, en faisant paraître celui que {sky}*Le Capital*{/sky} appellera {yellow}l'homme aux écus{/yellow} comme un gros monsieur à vingt-quatre pattes.
