lessons:
- id: ali2-l1
  title: "La conscience : se savoir partie de la nature"
  notes: |-
    **Pour Marx, l'homme n'est pas une exception dans la nature : il en est** {coral}**une partie qui se sait partie du tout**{/coral}**, et ce savoir lui donne prise sur la nature entière.** C'est par là que s'introduit la {violet}conscience{/violet} dans les *Manuscrits de 1844*, et c'est sur ce point que Marx se sépare de {sky}Feuerbach{/sky}, même quand les deux philosophes semblent dire la même chose.

    **L'homme n'est pas seulement son activité vitale : il l'a.** {teal}« {/teal}L'animal {teal}__se confond immédiatement avec son activité vitale__{/teal}. Il ne se distingue pas d'elle. Il est cette activité. L'homme {teal}__fait de son activité vitale elle-même l'objet de sa volonté et de sa conscience__{/teal}. Il a une activité vitale consciente ; elle n'est pas une détermination avec laquelle il se confond immédiatement{teal} »{/teal} (*Manuscrits de 1844*, premier manuscrit, « Travail aliéné et propriété privée », p. XXIV). Autrement dit, l'{violet}activité vitale{/violet} traverse l'homme comme elle traverse toutes les espèces vivantes, mais il peut la {amber}reprendre à son compte{/amber}, l'assumer, la posséder : d'où le verbe {amber}*avoir*{/amber}, et ce redoublement de l'activité par la conscience. {green}Cela ne fait pas de l'homme une exception à l'ordre commun de la nature{/green} : il reste un être naturel, qui a quelque chose de particulier.

    **La conscience rend possible l'**{violet}**auto-activation**{/violet}**.** En allemand {blue}*Selbstbetätigung*{/blue}, littéralement {amber}un devenir actif par soi{/amber} : l'activité naturelle, qui ne fait que passer par les autres vivants, peut devenir {coral}propre{/coral} à l'homme, activée volontairement par lui.

    **Être conscient, c'est se savoir partie de la nature, donc connaître le tout.** {red}La conscience n'est pas ce qui sépare l'homme de la nature{/red} : {green}c'est la connaissance de soi en tant que partie de la nature{/green}. Or se connaître comme partie, c'est connaître le tout dont on est la partie. D'où la conséquence : {coral}l'emprise de l'activité humaine s'étend au tout de la nature{/coral}. Être conscient, c'est {amber}devenir capable de faire de la nature elle-même l'objet de son activité{/amber}, d'y produire, par soi et à partir de soi, des effets voulus.

    **D'où la nature,** {violet}**corps non organique**{/violet} **de l'homme.** {teal}« {/teal}La {teal}nature{/teal}, c'est-à-dire la nature qui n'est pas elle-même le corps humain, {teal}__est le corps non organique de l'homme__ »{/teal}, et {teal}« __l'universalité de l'homme__{/teal} apparaît en pratique précisément dans l'universalité qui fait de {teal}__la nature entière son corps non organique__ »{/teal} (premier manuscrit, p. XXIV). La capacité d'agir sur toute la nature ne vient pas d'un pouvoir extraordinaire : elle vient de ce que l'homme {coral}se sait partie du tout{/coral}, et c'est ce savoir qui permet l'action sur le tout.

    **Le corps est ici le** {blue}*Leib*{/blue}**, non le** {blue}*Körper*{/blue}**.** Le {blue}*Leib*{/blue}, terme que reprendra bien plus tard la phénoménologie allemande, est le {amber}corps de chair{/amber}, le corps vivant, incarné ; le {blue}*Körper*{/blue} est un corps inerte parmi les autres. La phrase de Marx les oppose : {teal}« {/teal}Die Natur ist {teal}__der unorganische Leib__{/teal} des Menschen, nämlich die Natur, soweit sie nicht selbst {teal}__menschlicher Körper__{/teal} ist{teal} »{/teal} [la nature est le corps non organique de l'homme, à savoir la nature pour autant qu'elle n'est pas elle-même un corps humain]. La nature est donc le {coral}prolongement du corps charnel de chaque homme{/coral} au-delà de ses limites, d'où le « non organique ». Et il faut même inverser les choses : {green}le corps de chair de chaque individu est inscrit, comme une partie, dans un corps plus large qui n'est autre que la nature{/green}.

    ! « Corps non organique » ne veut pas dire que la nature serait une chose que l'homme possède ou domine de l'extérieur : c'est la part de son propre corps qui s'étend hors de lui.
