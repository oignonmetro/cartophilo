- id: ali2-l4
  title: "L'aliénation : être séparé des objets dont on vit"
  notes: |-
    **Marx rompt avec Hegel comme avec Feuerbach en partant de ce que les hommes sont des** {violet}**êtres objectifs**{/violet}**, parties de la nature : dès lors,** {green}**être aliéné, c'est être séparé des objets extérieurs dont on dépend vitalement**{/green}**.** Ce n'est ni être objectivé ({red}Hegel{/red}) ni avoir son essence hors de soi ({pink}Feuerbach{/pink}).

    **Contre Hegel, plus aucune raison de nier l'objectivité** : on ne nie pas l'objectivité d'êtres qu'on a posés comme objectifs. **Contre Feuerbach, plus aucune nécessité de supprimer l'extériorité de l'objet** : être un être objectif, c'est justement être, par nature, en relation avec des objets extérieurs, {amber}avoir sa nature en dehors de soi{/amber}. {teal}« {/teal}Un être qui {teal}__n'a pas sa nature en dehors de lui-même n'est pas un être naturel__{/teal}, il ne participe pas à l'être de la nature. Un être qui {teal}__n'a aucun objet en dehors de lui-même n'est pas un être objectif__ »{/teal} (*Manuscrits de 1844*, troisième manuscrit, p. XXVII). Et {coral}avoir sa nature hors de soi n'est pas aliénant{/coral} : c'est être, de façon vitale, dépendant de l'extériorité et affecté par elle.

    **Ce qui est aliénant, c'est d'être privé de ce rapport.**
    - {red}n'est pas aliéné{/red}, comme le pensait {sky}Hegel{/sky}, celui qui est objectivé alors que son essence serait la subjectivité, l'esprit ;
    - {red}n'est pas aliéné non plus{/red}, comme le pensait {sky}Feuerbach{/sky}, celui qui est en rapport avec son essence comme avec un objet différent de lui ;
    - {green}est aliéné l'être objectif qui se trouve séparé des objets extérieurs dont il dépend de façon vitale{/green}, qui voit rompu son rapport vital à l'objectivité.

    **D'où un renversement : le sujet est lui-même une figure de l'aliénation.** Rien n'atteste mieux l'aliénation des hommes que {red}la conception qu'ils se font d'eux-mêmes comme sujets{/red}, distincts par nature de l'objectivité : comme {yellow}« un empire dans un empire »{/yellow}, pour le dire avec {sky}Spinoza{/sky}. Cette conception naît d'une {coral}abstraction{/coral}, d'un isolement de soi hors du tout : {teal}« {/teal}L'homme est posé comme égal au Soi. Mais {teal}__le Soi n'est que l'homme saisi abstraitement et engendré par abstraction__ »{/teal} (troisième manuscrit, p. XXII). {coral}Se concevoir comme un pur soi est l'expression d'une amputation{/coral} : celle de la dimension objective de l'être des hommes.

    **Cette amputation a lieu dans l'activité productive.** Comme tous les vivants, les hommes ont une activité qui les caractérise : pour eux, c'est l'{violet}activité productive{/violet}. C'est donc là qu'il faut chercher la privation d'objectivité, dans une double séparation :
    - entre l'homme qui travaille et {amber}le produit de son travail{/amber} ;
    - entre l'homme qui travaille et {amber}les conditions objectives de son travail{/amber}, la matière et les outils.

    Or {teal}« {/teal}{teal}__le travail ne peut pas vivre sans objets sur lesquels il s'exerce__ »{/teal} (premier manuscrit, p. XXIII). Le {violet}travail aliéné{/violet} (Marx dira plus tard le {violet}travail salarié{/violet}) est donc contraint de se tenir dans une condition d'impossibilité : coupé de ses objets, {coral}il ne vaut plus que comme dépense d'une force purement subjective{/coral}. De cette amputation dans la pratique naît, dans la théorie, {red}l'illusion du sujet souverain et autonome{/red}, ontologiquement non objectif. Ce sujet est en réalité {coral}une figure de l'impuissance{/coral} : celle d'hommes dépossédés de leur propre objectivité, donc de toute maîtrise de l'objectivité en général.

    ! Le sujet pur n'est pas, pour Marx, ce que l'aliénation viendrait corrompre : c'est ce qu'elle produit.
  points:
