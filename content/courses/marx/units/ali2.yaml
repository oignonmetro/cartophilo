- id: ali2-l5
  title: "Les trois aspects de l'aliénation"
  notes: |-
    **Les phénomènes que Marx appelle aliénation apparaissent dès le premier manuscrit, quand il examine** {coral}**les conditions de l'enrichissement d'une société**{/coral}**.** Une seule phrase en donne {amber}les trois aspects fondamentaux et complémentaires{/amber} :

    {teal}« {/teal}Quand une société se trouve-t-elle dans un processus d'enrichissement croissant ? Quand les capitaux et les revenus augmentent. Mais ceci n'est possible que A) si beaucoup de travail est accumulé, car {teal}__le capital est du travail accumulé__{/teal} ; donc si {teal}__une partie toujours plus grande de ses produits est retirée à l'ouvrier__{/teal}, si {teal}__son propre travail s'oppose de plus en plus à lui en tant que propriété d'autrui__{/teal}, et si {teal}__ses moyens d'existence et d'activité sont de plus en plus concentrés entre les mains du capitaliste__ »{/teal} (*Manuscrits de 1844*, premier manuscrit, Salaire, p. III).

    L'aliénation est celle de l'être humain qui travaille, et elle est essentielle, car {coral}le travail est l'activité générique humaine{/coral}, l'activité typique de ces êtres naturels que sont les hommes.

    - {amber}__Les produits du travail__{/amber} sont retirés, pour la plupart, à celles et ceux qui les ont produits.
    - {amber}__L'activité elle-même__{/amber} devient autre et étrangère : le travailleur la vit {red}comme l'activité d'un autre et pour un autre{/red}. Il n'y a pas {green}auto-activité{/green}, activation par soi, mais l'inverse : une activation de soi par un autre, qu'on peut appeler, d'un mot qui n'est pas de Marx, une {violet}allo-activité{/violet}. Le ressort de mon activité me vient de l'extérieur.
    - {amber}__Les moyens de l'activité__{/amber}, ses conditions objectives, appartiennent à un autre et sont séparés de l'activité elle-même.

    | Ce qui m'est retiré | Comment |
    | le produit de mon travail | il revient à un autre |
    | mon activité | je la vis comme celle d'un autre |
    | les moyens de mon activité | ils appartiennent à un autre |

    ! Le deuxième aspect ne dit pas qu'on travaille pour un patron, ce qui serait le premier : il dit que l'acte même de travailler est vécu comme mû du dehors.
