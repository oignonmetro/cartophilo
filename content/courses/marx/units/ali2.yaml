- id: ali2-l2
  title: "Sortir de la philosophie de la conscience"
  notes: |-
    **Feuerbach et Marx disent tous deux que l'homme est un** {violet}**être objectif**{/violet}**, mais en deux sens tout différents :** {pink}**Feuerbach réforme la philosophie de la conscience**{/pink}**,** {green}**Marx entend en sortir**{/green}**.** Le cadre que Marx récuse est celui où {red}l'homme est défini par la conscience de soi{/red}.

    **Pour** {sky}**Feuerbach**{/sky}**, l'homme est objectif parce qu'il** {amber}**prend sa propre essence, son genre, pour objet**{/amber}**.** Il réforme ainsi la philosophie de la conscience : {coral}la conscience de soi a la même forme que la conscience d'objet{/coral}, puisque être conscient de soi, c'est se prendre soi-même pour objet. Il n'y a pas de différence de nature entre avoir conscience de quelque chose qui n'est pas nous et avoir conscience de soi : dans les deux cas, c'est une conscience d'objet.

    **Pour Marx, les hommes sont objectifs parce qu'ils** {amber}**se connaissent comme parties du tout objectif de la nature**{/amber}**.** La conscience est {green}la connaissance de soi comme objet, partie objective d'un tout lui-même objectif{/green} : c'est donc se reconnaître {coral}dépendant d'autres êtres également objectifs{/coral}. Ce n'est plus une réforme du cadre de la conscience, c'est sa sortie.

    | Philosophe | L'homme est objectif parce qu'il | La conscience |
    | Feuerbach | prend son genre pour objet | une réforme |
    | Marx | se sait partie de la nature | une sortie |

    **Marx récuse l'équation** {red}**« homme = conscience de soi »**{/red}**.** Dans le troisième manuscrit, il vise d'abord {sky}Hegel{/sky}, et plus indirectement {sky}Feuerbach{/sky} : {teal}« {/teal}Puisque Hegel {teal}__pose l'homme comme égal à la conscience de soi__{/teal}, l'objet devenu étranger, l'essence de l'homme aliénée ne sont pour lui rien d'autre que la conscience{teal} »{/teal} (*Manuscrits de 1844*, troisième manuscrit, p. XXXI). En allemand, la formule s'écrit « Setzen des Menschen = Selbstbewußtsein ».

    **Ce que l'équation présuppose : que l'homme n'est pas un être objectif.** Dans une philosophie de la conscience, {teal}« {/teal}{teal}__l'objectivité en tant que telle__{/teal} est conçue comme {teal}__une situation d'aliénation de l'homme__{/teal} qui ne correspond pas à l'essence humaine, à la conscience de soi{teal} »{/teal}. Par conséquent, {teal}« {/teal}la réappropriation de l'essence objective de l'homme [...] {teal}__ne signifie pas seulement la suppression de l'aliénation, elle signifie aussi la suppression de l'objectivité__{/teal}. C'est-à-dire que l'homme est considéré comme {teal}__un être non objectif, spiritualiste__ »{/teal} (troisième manuscrit, p. XXII). {coral}C'est ce présupposé que Marx attaque{/coral} : l'homme y est d'emblée posé comme non objectif.

    ! Marx ne reproche pas à Hegel d'avoir parlé d'aliénation, mais d'avoir confondu aliénation et objectivité : supprimer l'une revient alors à supprimer l'autre.
