- id: ali2-l2
  title: "Sortir de la philosophie de la conscience"
  notes: |-
    **Feuerbach et Marx disent tous deux que l'homme est un** {violet}**être objectif**{/violet}**, mais en deux sens tout différents :** {pink}**Feuerbach réforme la philosophie de la conscience**{/pink}**,** {green}**Marx entend en sortir**{/green}**.** Une {violet}philosophie de la conscience{/violet} est une philosophie qui pose {red}« homme = conscience de soi »{/red} : l'homme y est défini par la conscience de soi, il est d'abord un sujet qui se sait, et tout le reste (la nature, les choses, les autres hommes) est ce qui lui fait face, son objet. C'est l'équation que Marx récuse dans le troisième manuscrit, dans la critique de la dialectique hégélienne : il la lit d'abord chez {sky}Hegel{/sky}, plus indirectement chez {sky}Feuerbach{/sky}. En allemand, elle s'écrit « Setzen des Menschen = Selbstbewußtsein » [poser l'homme, c'est le poser égal à la conscience de soi].

    **Une philosophie de la conscience tient quatre choses ensemble.**
    - {amber}__L'homme est un sujet__{/amber} : son essence est la conscience de soi, ce que Hegel appelle le {violet}Soi{/violet}, un être qui se retrouve en lui-même ;
    - {amber}__L'objet est l'autre de ce sujet__{/amber} : ce qui lui fait face, extérieur à lui, et qui n'est pas lui ;
    - {amber}__L'objectivité est donc ce qui fait problème__{/amber} : un être dont l'essence est de se retrouver en lui-même se trouve {red}étranger à lui-même{/red} dès qu'il a devant lui un objet, donc {red}aliéné{/red} ;
    - {amber}__Se désaliéner, c'est reprendre l'objet en soi__{/amber} : montrer qu'il n'était que la conscience elle-même, sous une forme où elle ne se reconnaissait pas.

    {green}Marx rejette le premier point{/green}, et avec lui les trois autres, qui en découlent.

    **Pour** {sky}**Feuerbach**{/sky}**, l'homme est** {violet}**objectif**{/violet} **parce qu'il** {amber}**prend sa propre essence, son genre, pour objet**{/amber}**.** Il corrige {sky}Hegel{/sky} sans quitter son cadre : la conscience de soi ne vient pas avant la conscience d'objet, elle passe par elle, puisqu'être conscient de soi, c'est se prendre soi-même pour objet. {coral}La conscience de soi a donc la même forme que la conscience d'objet{/coral}, et il n'y a __pas de différence de nature entre avoir conscience de quelque chose qui n'est pas nous et avoir conscience de soi__ : dans les deux cas, c'est une conscience d'objet. Mais l'homme reste celui qui a des objets : {red}son objet est encore sa propre essence, posée en face de lui{/red}, et c'est la conscience qui reste le principe.

    **Pour Marx, l'homme est** {violet}**objectif**{/violet} **parce qu'il est lui-même un objet, et la conscience n'est que le savoir qu'il en a.** L'homme est d'abord un {violet}être naturel{/violet} : {amber}il a hors de lui les objets dont il dépend{/amber} ({yellow}le soleil est l'objet de la plante, l'aliment celui de la faim{/yellow}, voir [[g-etre-naturel|Être naturel, être objectif]]). Les hommes sont donc objectifs parce qu'{amber}__ils se connaissent comme parties du tout objectif de la nature__{/amber}. La conscience est {green}la connaissance de soi comme objet, partie objective d'un tout lui-même objectif{/green} : c'est se reconnaître {coral}dépendant d'autres êtres également objectifs{/coral}.

    **Pourquoi est-ce une sortie, et non une réforme ?** Parce que l'ordre est inversé. Chez {sky}Feuerbach{/sky}, {red}l'homme est encore un sujet qui se donne des objets{/red}, et la conscience le définit. Chez Marx, il n'est plus d'abord un sujet face à des objets : {coral}il est lui-même du côté des objets, un être objectif parmi d'autres, partie de la nature{/coral}, et la conscience n'est plus que le trait d'un tel être. L'opposition d'un sujet, défini par la conscience, et d'objets qui lui font face {coral}ne sépare plus l'homme de la nature{/coral} ; or cette opposition est le cadre même de la philosophie de la conscience. Marx n'améliore pas ce cadre : il le quitte.

    | | L'homme est objectif parce qu'il | Rapport à la philosophie de la conscience |
    | Feuerbach | prend son genre pour objet | une réforme |
    | Marx | se sait partie de la nature | une sortie |

    ! « Se prendre pour objet » ({sky}Feuerbach{/sky}) et « se savoir objet » (Marx) ne sont pas la même chose : le premier est un {red}retour de la conscience sur elle-même{/red}, le second la {green}découverte qu'on appartient soi-même au monde des objets{/green}.
