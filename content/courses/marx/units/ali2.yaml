- id: ali2-l4
  title: "L'aliénation : être séparé des objets dont on vit"
  notes: |-
    **Marx rompt avec Hegel comme avec Feuerbach en partant de ce que les hommes sont des** {violet}**êtres objectifs**{/violet}**, parties de la nature : dès lors,** {green}**être aliéné, c'est être séparé des objets extérieurs dont on dépend vitalement**{/green}**.** Ce n'est ni être objectivé ({red}Hegel{/red}) ni avoir son essence hors de soi ({pink}Feuerbach{/pink}).

    **Contre** {sky}**Hegel**{/sky}**, plus aucune raison de nier l'objectivité** : on ne nie pas l'objectivité d'êtres qu'on a posés comme objectifs. **Contre** {sky}**Feuerbach**{/sky}**, plus aucune nécessité de supprimer l'extériorité de l'objet** : être un être objectif, c'est justement être, par nature, en relation avec des objets extérieurs, {amber}avoir sa nature en dehors de soi{/amber}. {teal}« {/teal}Un être qui {teal}__n'a pas sa nature en dehors de lui-même n'est pas un être naturel__{/teal}, il ne participe pas à l'être de la nature. Un être qui {teal}__n'a aucun objet en dehors de lui-même n'est pas un être objectif__ »{/teal} (*Manuscrits de 1844*, troisième manuscrit, p. XXVII). Et {coral}avoir sa nature hors de soi n'est pas aliénant{/coral} : c'est être, de façon vitale, dépendant de l'extériorité et affecté par elle.

    **Ce qui est aliénant, c'est d'être privé de ce rapport.**
    - {red}n'est pas aliéné{/red}, comme le pensait {sky}Hegel{/sky}, celui qui est {red}objectivé{/red} alors que son essence serait la subjectivité, l'esprit ;
    - {red}n'est pas aliéné non plus{/red}, comme le pensait {sky}Feuerbach{/sky}, celui qui est en rapport avec son essence comme avec un {red}objet différent de lui{/red} ;
    - {green}est aliéné l'être objectif qui se trouve séparé des objets extérieurs dont il dépend de façon vitale{/green}, qui voit rompu son rapport vital à l'objectivité.

    **Cette privation est réelle et matérielle : elle a lieu dans l'activité productive.** Comme tous les vivants, les hommes ont une activité qui les caractérise : pour eux, c'est l'{violet}activité productive{/violet}. C'est donc là qu'il faut chercher la privation d'objectivité, dans une double séparation, qui n'a rien d'une opinion :
    - entre l'homme qui travaille et {amber}le produit de son travail{/amber} ;
    - entre l'homme qui travaille et {amber}les conditions objectives de son travail{/amber}, la matière et les outils.

    L'ouvrier ne possède ni la matière à travailler, ni les outils, ni ce qu'il produit : qu'il le sache ou non, il n'a plus que sa {violet}force de travail{/violet}. Or {teal}« {/teal}{teal}__le travail ne peut pas vivre sans objets sur lesquels il s'exerce__ »{/teal} (premier manuscrit, p. XXIII). Le {violet}travail aliéné{/violet} (Marx dira plus tard le {violet}travail salarié{/violet}) est donc contraint de se tenir dans {coral}une condition d'impossibilité{/coral} : coupé de ses objets, il ne vaut plus que comme dépense d'une force purement subjective.

    **Le sujet pur est ce que cette séparation fait de l'homme, puis la façon dont il se pense.** Un homme réduit à une force purement subjective, séparée de tout objet, est de fait {coral}un sujet pur, sans objectivité{/coral} : c'est ce que sa situation fait de lui. Et cette situation, les hommes, et les philosophes avec eux, la prennent pour leur nature : ils se conçoivent comme {red}des sujets, distincts par nature de l'objectivité{/red}, comme {yellow}« un empire dans un empire »{/yellow}, pour le dire avec {sky}Spinoza{/sky}. Cette conception naît d'une {coral}abstraction{/coral}, d'un isolement de soi hors du tout : {teal}« {/teal}L'homme est posé comme égal au Soi. Mais {teal}__le Soi n'est que l'homme saisi abstraitement et engendré par abstraction__ »{/teal} (troisième manuscrit, p. XXII). Se concevoir comme un pur soi {coral}exprime donc une amputation{/coral}, celle de la dimension objective de l'être des hommes : {amber}rien n'atteste mieux l'aliénation des hommes{/amber} que cette conception d'eux-mêmes.

    **Pourquoi cette conception relève-t-elle de l'aliénation, et n'est-elle pas seulement fausse ?**
    - {amber}__Elle exprime une situation réelle__{/amber}, et non une simple méprise : l'ouvrier est réellement réduit à une force sans objets. On ne la corrige donc pas en changeant d'idée, mais en changeant la situation dont elle est le signe ;
    - {amber}__Elle prend un résultat pour un point de départ__{/amber} : ce que la séparation a produit passe pour la nature de l'homme, et la perte ne se voit plus comme une perte ;
    - {amber}__Elle consacre l'impuissance__{/amber} : un sujet qui se croit pure activité souveraine est privé de ce sans quoi son activité ne s'exerce pas, la matière et les outils. {coral}Le sujet « souverain et autonome » est une figure de l'impuissance{/coral}, celle d'hommes dépossédés de leur propre objectivité, donc de toute maîtrise de l'objectivité en général.

    **Marx n'est pas ici du côté de Hegel.** {sky}Hegel{/sky} tient le sujet pur, le Soi, pour la vérité de l'homme, et la désaliénation pour son accomplissement. Marx y voit {red}ce que l'aliénation produit{/red}, et non ce qu'elle viendrait corrompre.

    ! L'aliénation ne réside pas dans une croyance : ce n'est pas parce qu'on se pense sujet pur qu'on est aliéné, c'est parce qu'on est réellement séparé de son produit et des conditions de son travail qu'on se pense ainsi.
