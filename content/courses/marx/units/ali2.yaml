- id: ali2-l2b
  title: "Contre l'équation « homme = conscience de soi »"
  notes: |-
    **Marx récuse l'équation** {red}**« homme = conscience de soi »**{/red} **parce qu'elle fait de l'homme un** {red}**être sans objectivité**{/red}**, et de l'**{red}**objectivité**{/red} **une** {red}**aliénation**{/red}**.** Elle pose que l'essence de l'homme est la conscience de soi, et c'est dans la critique de la dialectique hégélienne, au troisième manuscrit, que Marx en tire les conséquences.

    **Cette équation fait de l'homme un être sans objectivité.** Si l'{red}homme{/red} est égal à la {red}conscience de soi{/red}, {red}__rien de ce qui est objectif en lui ne fait partie de son essence__{/red} : ni son corps, ni ses besoins, ni sa dépendance à l'égard de choses extérieures. {sky}Hegel{/sky} va jusqu'à tenir chaque force de l'homme pour une qualité du Soi : {teal}« {/teal}Son œil, son oreille, etc., sont {teal}__de la nature du Soi__ »{/teal} (troisième manuscrit, p. XXII). Autrement dit, même ses sens sont tenus pour des formes de la conscience. L'homme est ainsi pensé comme {coral}un être non objectif{/coral}.

    **Dès lors, tout ce qui est objectif est du côté de ce qui n'est pas l'homme, donc étranger à son essence.** Marx décrit ce que la philosophie de la conscience fait de l'objectivité : {teal}« __l'objectivité en tant que telle__{/teal} est conçue comme {teal}__une situation d'aliénation de l'homme__{/teal} qui ne correspond pas à l'essence humaine, à la conscience de soi{teal} »{/teal} (troisième manuscrit, p. XXII). Autrement dit : si l'essence de l'homme est la conscience de soi, être un objet, c'est {red}être autre que cette essence{/red} ; {coral}l'objectivité est donc, de ce point de vue, une aliénation par définition{/coral}, quel que soit l'objet : une chose, un produit, ou l'essence même de l'homme lorsqu'elle se présente à lui comme un objet extérieur.

    **La** {violet}**désaliénation**{/violet} **ne peut alors consister qu'à** {red}**supprimer l'objectivité**{/red}**.** Si l'objet est étranger parce qu'il est objet, __se le réapproprier, c'est faire qu'il cesse d'en être un__ : {teal}« {/teal}la réappropriation de l'essence objective de l'homme [...] {teal}__ne signifie pas seulement la suppression de l'aliénation, elle signifie aussi la suppression de l'objectivité__{/teal}. C'est-à-dire que {teal}__l'homme est considéré comme un être non objectif, spiritualiste__ »{/teal} (troisième manuscrit, p. XXII). Le présupposé, c'est qu'on ne peut vouloir supprimer l'objectivité pour que l'homme redevienne lui-même qu'en le tenant déjà pour {coral}un être qui n'a rien d'objectif dans son essence{/coral}.

    **Ce que Marx reproche à** {sky}**Hegel**{/sky} **: avoir fait de l'**{violet}**aliénation**{/violet} **une affaire de** {red}**conscience**{/red}**.** {teal}« {/teal}Puisque Hegel {teal}__pose l'homme comme égal à la conscience de soi__{/teal}, l'objet devenu étranger, l'essence de l'homme aliénée ne sont pour lui {teal}__rien d'autre que la conscience__{/teal}, que {teal}__l'idée d'aliénation__ »{/teal} (troisième manuscrit, p. XXXI). Autrement dit : si l'homme n'est que conscience, ce qui lui devient étranger (un objet) et son essence lorsqu'elle est hors de lui ne peuvent être, eux aussi, que de la conscience, une manière dont la conscience se représente autre qu'elle-même. L'aliénation cesse alors d'être la {green}perte de choses réelles{/green} : elle devient {red}une idée{/red}, et sa suppression n'est plus qu'{red}une suppression abstraite et vide de cette abstraction vide : « {/red}{teal}la négation de la négation{/teal}{red} »{/red} (*ibid*.). Un exemple familier, qui n'est pas de Marx : {yellow}un ouvrier qui ne possède plus le produit de son travail a perdu quelque chose de réel ; dans le cadre hégélien, __ce qu'il y a à surmonter est seulement la façon dont la conscience se représente ce produit comme autre qu'elle__{/yellow}.

    ! Marx ne reproche pas à Hegel d'avoir pensé l'aliénation, ni qu'elle doive être surmontée : il lui reproche de l'avoir __confondue avec l'objectivité__, de sorte que, pour la supprimer, il faudrait supprimer l'objet lui-même.
