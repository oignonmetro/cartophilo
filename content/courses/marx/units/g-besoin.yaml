# Entrée du glossaire de Marx (skill glossaire-marx) : notion. Citations reprises de
# NotebookLM avec leur source (Manuscrits de 1844, Contribution, Grundrisse, Le Capital,
# Critique du programme de Gotha, éditions sociales), vérifiées par textes.py.

id: g-besoin
title: Besoin (`Bedürfnis`)
icon: book
color: coral
lessons:
- id: g-besoin-l1
  title: Besoin
  notes: |-
    Chez Marx, le {violet}**besoin**{/violet} ({violet}*Bedürfnis*{/violet}) est [def]. Ce n'est {pink}ni une simple pulsion biologique ni une préférence subjective{/pink} : il prolonge ce que Marx dit de l'[[g-etre-naturel|être naturel]], passif parce qu'il a hors de lui les objets de ses forces, et il a une histoire. La notion traverse toute l'œuvre : en 1844, elle sert à juger l'économie politique ; en 1857, à penser l'unité de la production et de la consommation ; dans *Le Capital*, à fixer la valeur de la force de travail. C'est par lui que le travail, qui règle le [[g-metabolisme|métabolisme]], a une fin, et par lui encore que Marx pense la richesse d'une [[g-vie-accomplie|vie accomplie]].

    __**Le**__ {violet}__**besoin**__{/violet} __**rapporte l'homme à un objet hors de lui, et donne au travail sa fin.**__ L'homme, [[g-etre-naturel|être naturel]], a hors de lui les objets dont il vit : la faim, dit Marx, est le besoin qu'a le corps d'un objet extérieur, nécessaire pour le compléter (*Manuscrits de 1844*, troisième manuscrit, critique de Hegel ; voir être naturel). {amber}Le besoin n'est donc pas un état intérieur, mais un rapport à un objet{/amber} : on n'a pas faim en général, on a faim de quelque chose. Or cet objet, puisqu'il est hors de moi, il faut aller le prendre ou le faire : c'est pourquoi le besoin devient la fin de l'activité qui produit. Dans l'échange entre les deux moments, {teal}« {/teal}la production crée la matière de la consommation en tant qu'objet extérieur; {teal}__la consommation crée pour la production le besoin en tant qu'objet interne, en tant que but__ »{/teal} (*Contribution*, Introduction de 1857). {coral}Le besoin est le « pour quoi » du travail{/coral} : ce que l'homme réalise dans la matière, c'est ce qu'il se proposait parce qu'il en avait besoin.

    __**La production produit le**__ {violet}__**besoin**__{/violet}__**, et la satisfaction d'un besoin en fait naître de nouveaux.**__ On croit d'ordinaire que le besoin précède la production, qui ne ferait que le servir. Marx renverse le rapport : {teal}« {/teal}{teal}__la production ne fournit donc pas seulement un objet matériel au besoin, elle fournit aussi un besoin à l'objet matériel__ »{/teal} (*Contribution*, Introduction de 1857). En effet, un objet nouveau apprend à s'en servir et à en jouir : {teal}« {/teal}L'objet d'art – comme tout autre produit – {teal}__crée un public apte à comprendre l'art et à jouir de la beauté__ »{/teal} (*ibid*.). Même le besoin le plus naturel prend la forme que lui donne la production : {teal}« {/teal}{teal}__La faim est la faim, mais la faim qui se satisfait avec de la viande cuite, mangée avec fourchette et couteau, est une autre faim__{/teal} que celle qui avale de la chair crue en se servant des mains, des ongles et des dents{teal} »{/teal} (*ibid*.). {amber}La production crée donc à la fois l'objet, la manière de le consommer et le consommateur{/amber}. Et comme la satisfaction d'un besoin apporte un instrument et une habitude, elle ne s'arrête pas là : les moyens de cette satisfaction {teal}« {/teal}poussent à de nouveaux besoins, et {teal}__cette production de nouveaux besoins est le premier fait historique__ »{/teal} (*L'Idéologie allemande*, I). {coral}Les besoins humains n'ont pas de limite fixe{/coral} : c'est ce qui fait que l'homme a une histoire, quand l'animal tourne dans le cercle des mêmes besoins.

    __**Les**__ {violet}__**besoins nécessaires**__{/violet} __**sont un produit historique, qui fixe la valeur de la force de travail.**__ Dans *Le Capital*, la valeur de la force de travail est celle des moyens de subsistance nécessaires à l'entretien de l'ouvrier. On pourrait croire ce minimum fixé par la nature. Mais si les {teal}« {/teal}{teal}__besoins naturels__{/teal} proprement dits, nourriture, vêtements, chauffage, logement, etc.{teal} »{/teal} varient déjà selon le climat, {teal}« {/teal}{teal}__l'ampleur des besoins dits nécessaires__{/teal}, ainsi que la manière de les satisfaire, {teal}__sont eux-mêmes un produit historique__{/teal} et, du coup, dépendent en grande partie du {teal}__degré de civilisation__{/teal} d'un pays{teal} »{/teal} (*Le Capital*, livre I, chap. IV). Donc, {teal}« {/teal}par opposition aux autres marchandises, {teal}__la détermination de la valeur de la force de travail contient donc un élément historique et moral__ »{/teal} (*ibid*.). {amber}Le salaire ne mesure pas ce qu'il faut à un corps pour survivre{/amber}, mais ce qu'une société tient pour nécessaire à une vie d'ouvrier : contre la « loi d'airain » des salaires, {coral}le minimum vital est une norme sociale et l'enjeu d'une lutte{/coral} (voir [[g-survie|survie]]).

    __**L'économie politique réduit l'ouvrier au**__ {red}__**besoin le plus misérable**__{/red} __**et ne produit que le**__ {red}__**besoin d'argent**__{/red}__**.**__ En 1844, Marx lit les économistes comme les théoriciens d'une privation. Pour faire de l'ouvrier une pure force de travail, l'économiste {teal}« {/teal}{teal}__réduit le besoin de l'ouvrier à l'entretien le plus indispensable et le plus misérable de la vie physique__{/teal} et son activité au mouvement mécanique le plus abstrait{teal} »{/teal} (*Manuscrits de 1844*, troisième manuscrit, besoins, production et division du travail). Sa morale est l'épargne : {teal}« {/teal}Cette science de la merveilleuse industrie est aussi {teal}__la science de l'ascétisme__{/teal} et son véritable idéal est {teal}__l'avare ascétique, mais usurier, et l'esclave ascétique, mais producteur__ »{/teal} (*ibid*.). Le riche, lui, a des besoins raffinés, mais ils ne sont pas plus humains, car {teal}« {/teal}{teal}__la propriété privée ne sait pas transformer le besoin grossier en besoin humain__ »{/teal} (*ibid*.) : le producteur flatte des appétits {teal}« {/teal}inhumains, raffinés, contre nature et imaginaires{teal} »{/teal} pour en tirer de l'argent. Or l'argent seul donne accès à tous les objets ; donc tous les besoins se ramènent à lui : {teal}« {/teal}{teal}__Le besoin d'argent est donc le vrai besoin produit par l'économie politique et l'unique besoin qu'elle produit__ »{/teal} (*ibid*.). {red}La misère du pauvre et le luxe du riche sont les deux faces d'une même réduction{/red} : le besoin y perd sa qualité au profit d'une quantité (voir [[g-argent|argent]]).

    __**En poussant le travail au-delà des**__ {violet}__**besoins naturels**__{/violet}__**, le capital prépare la**__ {green}__**richesse des besoins**__{/green}__**.**__ Le capital a pourtant un côté civilisateur, qui tient à une double logique. Comme acheteur de force de travail, il veut payer le moins possible : il comprime donc les besoins de l'ouvrier, qui sont pour lui un coût. Mais la survaleur n'est encore que contenue dans les marchandises : pour la réaliser, il faut les vendre, et des besoins déjà satisfaits n'achètent rien de plus. Le capital doit donc ouvrir de nouvelles branches, découvrir de nouveaux usages de la matière et susciter de nouveaux besoins, chez tous les acheteurs, ouvriers compris. Et comme il vise la richesse sous sa forme universelle, l'argent, ce mouvement n'a pas de borne : {teal}« {/teal}en aspirant sans trêve à la forme universelle de la richesse, {teal}__le capital pousse le travail au-delà des frontières de ses besoins naturels__{/teal} et crée ainsi {teal}__les éléments matériels du développement de cette riche individualité__{/teal} qui est aussi polyvalente dans sa production que dans sa consommation{teal} »{/teal}, là {teal}« {/teal}où la nécessité naturelle a disparu sous sa forme immédiate; parce qu'{teal}__un besoin produit par l'histoire est venu remplacer un besoin naturel__ »{/teal} (*Grundrisse*, chapitre du capital). En reliant chaque industrie au marché mondial, il {teal}« {/teal}{teal}__transforme ce qui apparaissait comme superflu en quelque chose de nécessaire, en nécessité produite historiquement__ »{/teal} (*ibid*.). {amber}Le capital développe les besoins qu'il ne satisfait pas{/amber} : il fait naître chez l'ouvrier des besoins que son salaire lui refuse, et c'est cette contradiction qui {green}prépare une richesse humaine{/green} au-delà de lui.

    __**L'**__{green}__**homme riche**__{/green} __**est l'homme qui a besoin d'une totalité de manifestation vitale.**__ Si les besoins se développent avec la production, la richesse ne se mesure plus en choses possédées, mais en besoins : {teal}« {/teal}On voit comment {teal}__l'homme riche et le besoin humain riche prennent la place de la richesse et de la misère de l'économie politique__{/teal}. {teal}__L'homme riche est en même temps l'homme qui a besoin d'une totalité de manifestation vitale humaine__{/teal}. L'homme chez qui {teal}__sa propre réalisation existe comme nécessité intérieure, comme besoin__ »{/teal} (*Manuscrits de 1844*, troisième manuscrit, propriété privée et communisme). {amber}Avoir beaucoup de besoins, c'est avoir beaucoup de façons de vivre{/amber} (voir [[g-expression-de-la-vie|expression de la vie]] et [[g-homme-total|homme total]]). Même la pauvreté change de sens : {teal}« {/teal}elle est {teal}__le lien passif qui fait ressentir aux hommes comme un besoin la richesse la plus grande, l'autre homme__ »{/teal} (*ibid*.). Marx en voit l'amorce chez les ouvriers communistes qui se réunissent pour la propagande : {teal}« {/teal}ils s'approprient par là {teal}__un besoin nouveau, le besoin de la société__{/teal}, et ce qui semble être le moyen est devenu le but{teal} »{/teal} (*Manuscrits de 1844*, troisième manuscrit, besoins). C'est pourquoi Marx rejette le {red}communisme grossier{/red}, qui prêche {teal}« {/teal}le retour à la simplicité contraire à la nature de l'homme pauvre et sans besoin{teal} »{/teal} (*ibid*.). Et le travail lui-même, quand il ne sera plus {teal}« {/teal}seulement un moyen de vivre{teal} »{/teal}, deviendra {teal}« {/teal}{teal}__lui-même le premier besoin vital__ »{/teal} (*Critique du programme de Gotha*, I).

    ! Marx n'oppose pas de vrais besoins naturels à de faux besoins artificiels : tous les besoins développés sont historiques, et ce qu'il critique, c'est leur réduction au minimum physique ou au besoin d'argent.

    ! Le besoin n'est pas une préférence psychologique ni la demande d'un acheteur : c'est le rapport d'un être naturel à des objets hors de lui, et une demande sans argent reste un besoin sans effet.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | *Manuscrits de 1844*, troisième manuscrit, propriété privée et communisme | l'homme riche, qui a besoin d'une totalité de manifestation vitale |
    | *Manuscrits de 1844*, troisième manuscrit, besoins, production et division du travail | la science de l'ascétisme et le besoin d'argent, seul besoin qu'elle produit |
    | *Manuscrits de 1844*, troisième manuscrit, critique de Hegel | la faim, besoin d'un objet hors du corps |
    | *L'Idéologie allemande*, I | la production de nouveaux besoins, premier fait historique |
    | *Contribution*, Introduction de 1857 | la production fournit un besoin à l'objet |
    | *Grundrisse*, chapitre du capital | le capital pousse le travail au-delà des besoins naturels |
    | *Le Capital*, livre I, chap. IV | l'élément historique et moral de la valeur de la force de travail |
    | *Critique du programme de Gotha*, I | le travail devenu premier besoin vital |

