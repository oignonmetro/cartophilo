# Entrée du glossaire de Marx (skill glossaire-marx) : notion. Citations reprises de
# NotebookLM avec leur source (Manuscrits de 1844, Contribution, Grundrisse, Le Capital,
# Critique du programme de Gotha, éditions sociales ), vérifiées par textes.py. Reprise
# le 2026-11-06 après deux relectures indépendantes.

id: g-besoin
title: Besoin (`Bedürfnis`)
icon: book
color: coral
lessons:
- id: g-besoin-l1
  title: Besoin
  notes: |-
    Chez Marx, le {violet}**besoin**{/violet} ({violet}*Bedürfnis*{/violet}) est [def]. Ce n'est {pink}ni une simple pulsion biologique ni une préférence subjective{/pink} : il prolonge ce que Marx dit de l'[[g-etre-naturel|être naturel]], passif parce qu'il a hors de lui les objets de ses forces, et il a une histoire. La notion traverse toute l'œuvre : en 1844, elle sert à juger l'économie politique ; en 1857, à penser l'unité de la production et de la consommation ; dans *Le Capital*, à fixer la valeur de la force de travail. Trois niveaux sont à distinguer. Les {violet}besoins naturels{/violet} sont ceux du corps : manger, se vêtir, se loger. Les {violet}besoins nécessaires{/violet} sont le seuil qu'une société tient pour indispensable à une vie, et ce seuil est déjà historique. Les {violet}besoins développés{/violet} vont au-delà : la production les fait naître, et certains finissent par passer dans le nécessaire.

    __**Le**__ {violet}__**besoin**__{/violet} __**rapporte l'homme à un objet hors de lui, et donne au travail sa fin.**__ L'homme, être naturel, a hors de lui les objets dont il vit : la faim, dit Marx, est le besoin qu'a le corps d'un objet extérieur (*Manuscrits de 1844*, troisième manuscrit, critique de Hegel ; voir être naturel). {amber}Le besoin n'est donc pas un sentiment, mais un rapport à un objet{/amber} : on n'a pas faim en général, on a faim de quelque chose. Or la nature ne livre presque rien tel quel. Le travail est l'acte par lequel l'homme met en mouvement ses forces {teal}« {/teal}pour {teal}__s'approprier la matière naturelle sous une forme utile à sa propre vie__ »{/teal} (*Le Capital*, livre I, chap. V) : la forme qu'il donne à la matière est réglée sur le besoin. Et cette forme, il se la représente avant de la produire : {teal}« {/teal}{teal}__Le résultat auquel aboutit le procès de travail était déjà au commencement dans l'imagination du travailleur__{/teal}, existait donc déjà en idée{teal} »{/teal}, si bien qu'il y réalise {teal}« {/teal}{teal}__son propre but__{/teal}, qu'il connaît, qui détermine comme une loi la modalité de son action{teal} »{/teal} (*ibid*.). Donc le besoin fixe le but du travail, par la représentation du produit utile. C'est ce que dit l'Introduction de 1857 sur les deux moments de l'économie : {teal}« {/teal}la production crée la matière de la consommation en tant qu'objet extérieur; {teal}__la consommation crée pour la production le besoin en tant qu'objet interne, en tant que but__ »{/teal} (*Contribution*, Introduction de 1857). « Interne » ne veut pas dire ressenti : l'objet interne est le produit tel qu'on se le propose. {coral}Le besoin est le « pour quoi » du travail{/coral} ; sous le salariat, ce but n'est plus celui de l'ouvrier, mais celui du capitaliste (voir [[g-travail-aliene|travail aliéné]]).

    __**La production produit le**__ {violet}__**besoin**__{/violet}__**, et la satisfaction d'un besoin en fait naître de nouveaux.**__ On croit d'ordinaire que le besoin précède la production, qui ne ferait que le servir. Marx renverse le rapport : {teal}« {/teal}{teal}__la production ne fournit donc pas seulement un objet matériel au besoin, elle fournit aussi un besoin à l'objet matériel__ »{/teal} (*Contribution*, Introduction de 1857). En effet, un objet nouveau apprend à s'en servir et à en jouir : {teal}« {/teal}L'objet d'art – comme tout autre produit – {teal}__crée un public apte à comprendre l'art et à jouir de la beauté__ »{/teal} (*ibid*.). Même le besoin le plus naturel prend la forme que lui donne la production : {teal}« {/teal}{teal}__La faim est la faim, mais la faim qui se satisfait avec de la viande cuite, mangée avec fourchette et couteau, est une autre faim__{/teal} que celle qui avale de la chair crue en se servant des mains, des ongles et des dents{teal} »{/teal} (*ibid*.). {amber}La production crée donc à la fois l'objet, la manière de le consommer et le consommateur{/amber}. Elle ne s'arrête pas là, car satisfaire un besoin, c'est déjà produire, et produire laisse derrière soi un instrument et un savoir-faire qui ouvrent des possibilités nouvelles. *L'Idéologie allemande* en fait le second point de sa conception de l'histoire, après la production des moyens d'existence : l'action de satisfaire le premier besoin et l'instrument acquis {teal}« {/teal}poussent à de nouveaux besoins, et {teal}__cette production de nouveaux besoins est le premier fait historique__ »{/teal} (*L'Idéologie allemande*, I, traduction des Éditions sociales ; {sky}Renault{/sky}, qui cite une autre traduction, lit « second acte historique » : c'est le second point de l'exposé, mais le premier qui fasse une histoire). {coral}Les besoins humains n'ont pas de limite fixe{/coral}, et c'est par là que l'homme a une histoire. L'animal, au contraire, ne produit que {teal}« {/teal}sous l'empire du besoin physique immédiat{teal} »{/teal} (*Manuscrits de 1844*, premier manuscrit ; voir [[g-activite-vitale|activité vitale]]).

    __**Les**__ {violet}__**besoins nécessaires**__{/violet} __**sont un produit historique, qui fixe la valeur de la force de travail.**__ Ce que l'ouvrier vend au capitaliste n'est pas son travail, mais sa {violet}force de travail{/violet}, sa capacité de travailler pendant un temps. Comme toute marchandise, elle vaut le temps de travail qu'il faut pour la produire : sa valeur est {teal}« {/teal}déterminée par le temps de travail nécessaire à la production {teal}__donc à la reproduction__{/teal} de tel article spécifique{teal} »{/teal} (*Le Capital*, livre I, chap. IV). Or reproduire une force de travail, c'est entretenir l'ouvrier : sa valeur est celle de ses moyens de subsistance. On pourrait croire ce minimum fixé par le corps. Mais si les {teal}« {/teal}{teal}__besoins naturels__{/teal} proprement dits, nourriture, vêtements, chauffage, logement, etc.{teal} »{/teal} varient déjà selon le climat, {teal}« {/teal}{teal}__l'ampleur des besoins dits nécessaires__{/teal}, ainsi que la manière de les satisfaire, {teal}__sont eux-mêmes un produit historique__{/teal} et, du coup, dépendent en grande partie du {teal}__degré de civilisation__{/teal} d'un pays{teal} »{/teal} (*ibid*.). Donc, {teal}« {/teal}par opposition aux autres marchandises, {teal}__la détermination de la valeur de la force de travail contient donc un élément historique et moral__ »{/teal} (*ibid*.). « Moral » veut dire ici : relatif aux mœurs, à ce qu'une société tient pour dû à une vie d'ouvrier. {amber}Le salaire ne mesure pas ce qu'il faut à un corps pour survivre{/amber}, {coral}mais une norme sociale{/coral}. Le salaire n'est donc pas un simple minimum de survie (voir [[g-survie|survie]]).

    __**L'économie politique réduit l'ouvrier au**__ {red}__**besoin le plus misérable**__{/red} __**et ne produit que le**__ {red}__**besoin d'argent**__{/red}__**.**__ En 1844, « économie politique » désigne à la fois la science des économistes et le système qu'elle décrit et justifie. Marx part d'un critère : dans une société humaine, un besoin nouveau serait {teal}« {/teal}{teal}__une manifestation nouvelle de la force essentielle de l'homme et un enrichissement nouveau de l'essence humaine__{/teal}{teal} »{/teal} ; mais {teal}« {/teal}dans le cadre de la propriété privée, {teal}__les choses prennent une signification inverse__ »{/teal} (*Manuscrits de 1844*, troisième manuscrit, besoins, production et division du travail). Car chacun ne produit que pour l'argent de l'autre, et doit donc lui faire désirer ce qu'il vend : {teal}« {/teal}{teal}__tout homme s'applique à créer pour l'autre un besoin nouveau pour le contraindre à un nouveau sacrifice__{/teal}, le placer dans une nouvelle dépendance et le pousser à un nouveau mode de jouissance et, par suite, de ruine économique{teal} »{/teal} (*ibid*.). Or tous ces besoins ne s'achètent qu'avec de l'argent ; donc ils se ramènent tous à un seul : {teal}« {/teal}{teal}__Le besoin d'argent est donc le vrai besoin produit par l'économie politique et l'unique besoin qu'elle produit__ »{/teal} (*ibid*.). La même cause produit deux effets opposés : {teal}« {/teal}d'un côté, {teal}__le raffinement des besoins__{/teal} et des moyens de les satisfaire, de l'autre le retour à une sauvagerie bestiale, {teal}__la simplicité complète, grossière et abstraite du besoin__ »{/teal} (*ibid*.). D'un côté le riche, chez qui le producteur, {teal}« {/teal}l'eunuque industriel{teal} »{/teal}, excite des appétits {teal}« {/teal}inhumains, raffinés, contre nature et imaginaires{teal} »{/teal} ; de l'autre l'ouvrier, dont l'économiste {teal}« {/teal}{teal}__réduit le besoin à l'entretien le plus indispensable et le plus misérable de la vie physique__ »{/teal}, parce qu'il est un coût. Et comme la richesse naît de l'accumulation, qui exige de ne pas dépenser, la morale de cette science est le renoncement : {teal}« {/teal}Cette science de la merveilleuse industrie est aussi {teal}__la science de l'ascétisme__{/teal} et son véritable idéal est {teal}__l'avare ascétique, mais usurier, et l'esclave ascétique, mais producteur__ »{/teal}, c'est-à-dire le capitaliste qui accumule et l'ouvrier qui épargne (*ibid*.). {amber}Ce que Marx condamne n'est donc pas l'origine imaginaire d'un besoin{/amber} (*Le Capital*, livre I, chap. I, peut dire qu'il importe peu qu'un besoin naisse de l'estomac ou de l'imagination, parce qu'il n'y juge pas les besoins : il analyse la valeur d'usage), {red}mais le besoin réduit à l'argent qu'il rapporte{/red} : {teal}« {/teal}la propriété privée ne sait pas transformer le besoin grossier en besoin humain{teal} »{/teal} (*Manuscrits de 1844*, *ibid*. ; voir [[g-argent|argent]]).

    __**En poussant le travail au-delà des**__ {violet}__**besoins naturels**__{/violet}__**, le capital prépare la**__ {green}__**richesse des besoins**__{/green}__**.**__ Le capital a pourtant un côté civilisateur, qui tient à une double logique. Il vit de la {violet}survaleur{/violet}, la valeur que l'ouvrier produit au-delà de celle de son salaire. Comme acheteur de force de travail, il veut donc payer le moins possible, et comprime les besoins de l'ouvrier, qui sont pour lui un coût. Mais la survaleur n'est encore que contenue dans les marchandises : pour la réaliser, c'est-à-dire la toucher en argent, il faut les vendre, et des besoins déjà satisfaits n'achètent rien de plus. Le capital doit donc ouvrir de nouvelles branches et susciter de nouveaux besoins, chez tous les acheteurs, ouvriers compris. Et comme il vise la richesse sous sa forme universelle, l'argent, ce mouvement n'a pas de borne : {teal}« {/teal}en aspirant sans trêve à la forme universelle de la richesse, {teal}__le capital pousse le travail au-delà des frontières de ses besoins naturels__{/teal} et crée ainsi {teal}__les éléments matériels du développement de cette riche individualité__{/teal} qui est aussi polyvalente dans sa production que dans sa consommation{teal} »{/teal}, là {teal}« {/teal}où la nécessité naturelle a disparu sous sa forme immédiate; parce qu'{teal}__un besoin produit par l'histoire est venu remplacer un besoin naturel__ »{/teal} (*Grundrisse*, chapitre du capital). En reliant chaque industrie au marché mondial, il {teal}« {/teal}transforme ce qui apparaissait comme superflu en quelque chose de nécessaire, en nécessité produite historiquement{teal} »{/teal} (*ibid*.). Il prépare ainsi ce qui le dépasse, parce qu'il continue de mesurer la richesse au temps de travail : {green}la richesse des besoins qu'il fait naître déborde cette mesure{/green} (voir [[g-vie-accomplie|vie accomplie]]).

    __**L'**__{green}__**homme riche**__{/green} __**est l'homme qui a besoin d'une totalité de manifestation vitale.**__ Qu'est-ce que la richesse, une fois ôtée sa forme marchande ? Les *Grundrisse* répondent : {teal}« {/teal}une fois que la forme bourgeoise bornée a disparu, {teal}__qu'est-ce que la richesse, sinon l'universalité des besoins, des capacités, des jouissances, des forces productives des individus__ »{/teal} (*Grundrisse*, chapitre du capital). La raison est qu'un besoin n'est pas un simple manque : chez l'être naturel, c'est une force tendue vers son objet, une passion (voir [[g-etre-naturel|être naturel]]). Avoir un besoin, c'est donc avoir un rapport actif au monde ; {amber}avoir beaucoup de besoins, c'est avoir beaucoup de façons de vivre{/amber}. D'où la formule de 1844 : {teal}« {/teal}On voit comment {teal}__l'homme riche et le besoin humain riche prennent la place de la richesse et de la misère de l'économie politique__{/teal}. {teal}__L'homme riche est en même temps l'homme qui a besoin d'une totalité de manifestation vitale humaine__{/teal}. L'homme chez qui {teal}__sa propre réalisation existe comme nécessité intérieure, comme besoin__ »{/teal} (*Manuscrits de 1844*, troisième manuscrit, propriété privée et communisme) : il ne se réalise pas par devoir, mais parce qu'il en a besoin (voir [[g-expression-de-la-vie|expression de la vie]] et [[g-homme-total|homme total]]). Dans une telle société, la pauvreté change elle aussi de sens. L'homme, être naturel, est passif : il a besoin d'objets hors de lui pour confirmer ses forces. Or ses forces les plus proprement humaines, celles de l'être générique, ne se confirment que dans un autre homme, qui les reconnaît et les partage (voir [[g-vie-generique|vie générique]]). L'autre homme est donc le plus riche des objets dont il a besoin ; en manquer, c'est sentir passivement ce lien. La pauvreté est alors {teal}« {/teal}{teal}__le lien passif qui fait ressentir aux hommes comme un besoin la richesse la plus grande, l'autre homme__ »{/teal} (*ibid*.). Marx en voit l'amorce chez les ouvriers communistes qui se réunissent pour la propagande : {teal}« {/teal}ils s'approprient par là {teal}__un besoin nouveau, le besoin de la société__{/teal}, et ce qui semble être le moyen est devenu le but{teal} »{/teal} (*Manuscrits de 1844*, troisième manuscrit, besoins). C'est pourquoi il rejette le {red}communisme grossier{/red}, qui se contente de partager également la propriété et nivelle tout par le bas : il prêche {teal}« {/teal}le retour à la simplicité contraire à la nature de l'homme pauvre et sans besoin{teal} »{/teal} (*Manuscrits de 1844*, troisième manuscrit, propriété privée et communisme). Le travail lui-même, qui sous le salariat n'est qu'un moyen de vivre, doit devenir {teal}« {/teal}le premier besoin vital{teal} »{/teal} (*Critique du programme de Gotha*, I ; voir [[g-vie-accomplie|vie accomplie]], qui dit aussi la limite que *Le Capital*, livre III, y met).

    ! Marx n'oppose pas de vrais besoins naturels à de faux besoins artificiels : tous les besoins développés sont historiques. Ce qu'il critique, c'est le besoin réduit au minimum physique, ou suscité pour l'argent.

    ! Le besoin n'est pas la demande d'un acheteur. Mais sous le règne de l'argent, un besoin sans argent ne compte pas : la différence entre la demande {teal}« {/teal}basée sur mon besoin{teal} »{/teal} et la demande effective, {teal}« {/teal}basée sur l'argent{teal} »{/teal}, est {teal}« {/teal}la différence entre l'être et la pensée{teal} »{/teal}, au point que {teal}« {/teal}si je n'ai pas d'argent pour voyager, je n'ai pas de besoin{teal} »{/teal} de voyager (*Manuscrits de 1844*, troisième manuscrit, pouvoir de l'argent).

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | *Manuscrits de 1844*, troisième manuscrit, propriété privée et communisme | l'homme riche, qui a besoin d'une totalité de manifestation vitale |
    | *Manuscrits de 1844*, troisième manuscrit, besoins, production et division du travail | la science de l'ascétisme et le besoin d'argent, seul besoin qu'elle produit |
    | *L'Idéologie allemande*, I | la production de nouveaux besoins, premier fait historique |
    | *Contribution*, Introduction de 1857 | la production fournit un besoin à l'objet |
    | *Grundrisse*, chapitre du capital | le capital pousse le travail au-delà des besoins naturels ; la richesse, universalité des besoins |
    | *Le Capital*, livre I, chap. IV | l'élément historique et moral de la valeur de la force de travail |

    **Voir aussi** : [[g-etre-naturel|Être naturel]] · [[g-metabolisme|Métabolisme]] · [[g-argent|Argent]] · [[g-survie|Survie]] · [[g-homme-total|Homme total]] · [[g-expression-de-la-vie|Expression de la vie]] · [[g-vie-accomplie|Vie accomplie]]
