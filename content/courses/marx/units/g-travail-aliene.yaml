id: g-travail-aliene
title: Travail aliéné (`entfremdete Arbeit`)
icon: book
color: coral
lessons:
- id: g-travail-aliene-l1
  title: Travail aliéné
  notes: |-
    Chez Marx, le {violet}**travail aliéné**{/violet} ({violet}*entfremdete Arbeit*{/violet}) est [def]. Il n'est {pink}ni un malaise vécu ni un salaire trop bas{/pink} : c'est la [[g-activite-vitale|vie]] même de l'ouvrier qui lui est prise. Il en est ainsi parce que l'activité vitale de l'homme, celle qui fait de lui un [[g-etre-generique|être générique]], se retourne contre lui. L'*entfremdete Arbeit* est le travail devenu {red}*fremd*{/red}, étranger.

    __**Le travail aliéné renverse l'**__{violet}__**objectivation**__{/violet} __**en**__ {red}__**perte de l'objet**__{/red}__**.**__ Tout travail se fixe dans un objet, et c'est sa réussite : {teal}« {/teal}Le produit du travail est le travail qui s'est fixé, concrétisé dans un objet, il est {teal}__l'objectivation du travail__ »{/teal} (*Manuscrits de 1844*, premier manuscrit, Le travail aliéné). {amber}Marx ne condamne donc pas l'objectivation{/amber}, condition de toute production : il condamne la forme qu'elle prend {teal}« {/teal}au stade de l'économie{teal} »{/teal}, où {teal}« {/teal}cette actualisation du travail apparaît comme {teal}__la perte pour l'ouvrier de sa réalité__{/teal}, l'objectivation comme {teal}__la perte de l'objet ou l'asservissement à celui-ci__ »{/teal} (*ibid*.). Pourquoi une perte ? Parce que l'ouvrier a dépensé dans l'objet ce qu'il est : {teal}« {/teal}L'ouvrier {teal}__met sa vie dans l'objet__{/teal}. Mais alors {teal}__celle-ci ne lui appartient plus, elle appartient à l'objet__ »{/teal} (*ibid*.). Or l'objet va au capitaliste : il s'accumule en face de lui, si bien que {teal}« {/teal}plus l'ouvrier produit d'objets [...] {teal}__plus il tombe sous la domination de son produit, le capital__ »{/teal} (*ibid*.). D'où le paradoxe : {teal}« {/teal}L'ouvrier devient {teal}__d'autant plus pauvre qu'il produit plus de richesse__{/teal}{teal} »{/teal} (*ibid*.). {coral}Le salaire n'y change rien, car il entretient l'ouvrier sans lui rendre ce qu'il a produit.{/coral}

    __**L'ouvrier est étranger à son**__ {violet}__**activité**__{/violet}__**, et non seulement à son produit.**__ Si le produit est étranger, c'est que l'acte qui le produit l'était déjà : {teal}« {/teal}l'aliénation n'apparaît pas seulement dans le résultat, mais {teal}__dans l'acte de la production__{/teal}, à l'intérieur de l'activité productive elle-même{teal} »{/teal} (*ibid*.). Le signe en est la contrainte : {teal}« {/teal}Son travail n'est donc pas volontaire, mais contraint, {teal}__c'est du travail forcé__ »{/teal} (*ibid*.), et {teal}« {/teal}dès qu'il n'existe pas de contrainte physique ou autre, {teal}__le travail est fui comme la peste__ »{/teal} (*ibid*.). {yellow}La peste{/yellow} dit littéralement qu'on fuit le travail comme une maladie mortelle : une activité qu'on fuit dès qu'on le peut n'est pas la sienne. Donc {teal}« {/teal}l'activité de l'ouvrier {teal}__n'est pas son activité propre__{/teal}. Elle appartient à un autre, {teal}__elle est la perte de soi-même__ »{/teal} (*ibid*.). Il en résulte une inversion : ce qui reste à l'ouvrier, hors du travail, ce sont les fonctions qu'il partage avec l'animal, si bien que {red}« le bestial devient l'humain et l'humain devient le bestial »{/red} (*ibid*.).

    __**Le travail aliéné rend l'homme étranger à son**__ {violet}__**genre**__{/violet} __**et aux**__ {violet}__**autres hommes**__{/violet}__**.**__ Ce que l'homme a de propre, c'est de produire librement, à la mesure de toute espèce. Or {teal}« {/teal}Le travail aliéné renverse le rapport de telle façon que l'homme, du fait qu'il est un être conscient, ne fait précisément de son activité vitale, de son essence {teal}__qu'un moyen de son existence__ »{/teal} (*ibid*.). La quatrième perte suit les trois autres : {teal}« {/teal}Une conséquence immédiate du fait que l'homme est rendu étranger au produit de son travail, à son activité vitale, à son être générique, est celle-ci : {teal}__l'homme est rendu étranger à l'homme__ »{/teal} (*ibid*.). Car le produit qui échappe à l'ouvrier appartient bien à quelqu'un, et Marx écarte les deux candidats que l'on pourrait invoquer : {teal}« {/teal}{red}Ce ne sont pas les dieux, ce n'est pas la nature{/red}, qui peuvent être cette puissance étrangère sur l'homme, {teal}__c'est seulement l'homme lui-même__ »{/teal} (*ibid*.). Les dieux ne reçoivent plus le produit du travail, et la nature en est la matière, non le maître : {coral}la puissance étrangère est un autre homme, celui qui ne travaille pas{/coral}.

    __**La**__ {violet}__**propriété privée**__{/violet} __**est la conséquence du travail aliéné, non sa cause.**__ Le rapport de l'ouvrier à son travail produit le maître de ce travail : {teal}« {/teal}Le rapport de l'ouvrier à l'égard du travail {teal}__engendre le rapport du capitaliste__{/teal}, du maître du travail, quel que soit le nom qu'on lui donne, à l'égard de celui-ci{teal} »{/teal} (*ibid*.). Donc {teal}« {/teal}La propriété privée est donc {teal}__le produit, le résultat, la conséquence nécessaire du travail aliéné__ »{/teal} (*ibid*.). L'objection vient d'elle-même : l'ouvrier ne travaille ainsi que parce qu'il est déjà sans propriété. Marx l'accorde en partie et la retourne : {teal}« {/teal}si la propriété privée {red}apparaît comme la raison, la cause{/red} du travail aliéné, elle est bien plutôt {green}une conséquence{/green} de celui-ci, de même que {yellow}__les dieux à l'origine ne sont pas la cause, mais l'effet de l'aberration de l'entendement humain__{/yellow}. {teal}Plus tard, ce rapport se change en action réciproque »{/teal} (*ibid*.). Terme à terme : comme les hommes ont fait leurs dieux avant de s'y soumettre, ils ont fait la propriété avant qu'elle les domine. Le cercle se dénoue ainsi : {coral}le travail aliéné produit d'abord la propriété, qui l'entretient ensuite{/coral}. C'est ce que {sky}l'économie politique{/sky} ne voit pas : elle part de la propriété comme d'un fait, au lieu d'en montrer la genèse.

    __**Égaliser les**__ {violet}__**salaires**__{/violet} __**ne supprime pas le travail aliéné.**__ Le salaire n'est pas la cause du mal, il en est l'expression : {teal}« {/teal}le salaire [...] {teal}__n'est qu'une conséquence nécessaire de l'aliénation du travail__{/teal}, et dans le salaire le travail n'apparaît pas non plus comme le but en soi, mais {teal}__comme le serviteur du salaire__ »{/teal} (*ibid*.). Le relever laisserait donc le travail tel qu'il est : ce {teal}« {/teal}ne serait donc rien d'autre qu'{teal}__une meilleure rétribution des esclaves__ »{/teal} (*ibid*.). Et l'égaliser l'étendrait à tous : {teal}« {/teal}L'égalité du salaire elle-même, telle que la revendique {sky}Proudhon{/sky}, ne fait que transformer le rapport de l'ouvrier actuel à son travail en le rapport de tous les hommes au travail. {teal}__La société est alors conçue comme un capitaliste abstrait__ »{/teal} (*ibid*.). En 1875, le vocabulaire a changé, de l'aliénation à l'exploitation, mais la conclusion reste la même. Contre {sky}Lassalle{/sky}, qui croit que le salaire paie le travail et qu'une loi d'airain le ramène au minimum, Marx rappelle que l'ouvrier vend sa {violet}force de travail{/violet}, sa capacité de travailler pendant un temps, et que le salaire n'est {teal}« {/teal}{teal}__qu'une forme déguisée de la valeur (ou du prix) de la force de travail__ »{/teal} (*Critique du programme de Gotha*, II). Or cette force produit plus qu'elle ne coûte : l'ouvrier travaille donc toujours une partie de sa journée gratuitement pour le capitaliste, si bien que {teal}« {/teal}le système du travail salarié est, par conséquent, un système d'esclavage [...] {teal}__quel que soit le salaire, bon ou mauvais, que reçoit l'ouvrier__ »{/teal} (*ibid*.). {coral}On ne guérit pas une aliénation en partageant mieux ce qu'elle rapporte{/coral} : il faudrait changer le travail lui-même.

    __**À la maturité, le renversement devient matériel : le**__ {violet}__**travail mort**__{/violet} __**domine le**__ {violet}__**travail vivant**__{/violet}__**.**__ Dans *Le Capital*, le vocabulaire de l'aliénation recule au profit de celui de l'exploitation, mais le renversement de 1844 reçoit un support matériel. Le {violet}travail vivant{/violet} est la force humaine en acte ; le {violet}travail mort{/violet}, le travail passé, fixé dans les machines et les matières. Or {teal}« {/teal}ce n'est pas le travailleur qui utilise la condition de travail, mais inversement {teal}__la condition de travail qui utilise le travailleur__{/teal} ; c'est seulement avec la machinerie que ce renversement acquiert {teal}__une réalité techniquement tangible__ »{/teal} (*Le Capital*, livre I, 4e section, chap. XIII). Dans la fabrique, {teal}« {/teal}il existe, indépendamment d'eux, {teal}__un mécanisme mort auquel on les incorpore comme des appendices vivants__ »{/teal} (*ibid*.). Marx le dit par {yellow}une image{/yellow} : {teal}« {/teal}Le capital est du travail mort, {yellow}__qui ne s'anime qu'en suçant tel un vampire du travail vivant__{/yellow}, et {teal}qui est d'autant plus vivant qu'il en suce davantage »{/teal} (livre I, 3e section, chap. VIII). Terme à terme : le vampire est un mort qui ne vit que du sang des vivants ; le capital est du travail passé qui ne s'accroît qu'en absorbant le travail présent. {coral}Ce que 1844 décrivait comme la perte de la vie de l'ouvrier dans l'objet devient la vie que la machine lui prend.{/coral}

    ! *Entfremdung* et *Entäußerung* se traduisent tous deux par « aliénation » : le premier dit que la chose devient étrangère (*fremd*), le second qu'on s'en dessaisit. Aucun des deux ne se confond avec l'{violet}objectivation{/violet} (*Vergegenständlichung*), que Marx tient pour la réussite normale du travail.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | *Manuscrits de 1844*, premier manuscrit | produit, acte, genre et autrui deviennent étrangers à l'ouvrier |
    | *Le Capital*, livre I, chap. VIII | le capital, travail mort qui suce le travail vivant |
    | *Le Capital*, livre I, chap. XIII | avec la machine, la condition de travail utilise le travailleur |
    | *Critique du programme de Gotha*, II | le salariat, système d'esclavage quel que soit le salaire |

    **Voir aussi** : [[g-activite-vitale|Activité vitale]] · [[g-etre-generique|Être générique]] · [[g-besoin|Besoin]] · [[g-subsomption|Subsomption formelle et réelle]] · [[g-abolition-du-travail|Abolition du travail]] · [[g-argent|Argent]]
