- id: sep-marx4-l6
  title: "Pourquoi ne pas dessiner l'avenir"
  notes: |-
    **Marx a trois raisons de fond de refuser les plans de l'avenir : ils seraient antidémocratiques, impossibles et superflus ; aucune n'est décisive.** On distingue d'abord deux sortes de critiques :
    - les critiques {violet}non fondamentales{/violet} rejettent des idées que les utopistes ont pu avoir, {red}sans rejeter l'utopisme comme tel{/red} ;
    - les critiques {violet}fondamentales{/violet} donnent une raison de {green}renoncer à l'utopisme lui-même{/green}, à toute description de la société future.

    **Une critique non fondamentale : l'**{violet}**anhistorisme**{/violet}**.** Le *Manifeste* reproche aux utopistes de croire que le socialisme pouvait advenir à n'importe quelle époque, pourvu qu'on ait {yellow}le bon plan et assez de volonté{/yellow}, sans voir qu'il dépend de conditions qui n'apparaissent qu'à un stade de l'histoire. Mais {coral}on peut vouloir un plan sans être anhistorique{/coral} : cette critique ne touche pas l'utopisme comme tel.

    **Les trois arguments fondamentaux.**

    | Argument | Thèse | Prémisse |
    | antidémocratique | normative | un plan limite l'autodétermination |
    | impossible | épistémologique | un plan utile doit prévoir tout l'avenir |
    | superflu | empirique | l'histoire produit seule la société future |

    **Antidémocratique.** « Démocratie » veut dire ici {amber}autodétermination{/amber} individuelle et collective. {amber}Limiter l'autodétermination est antidémocratique ; un plan de la société socialiste la limite ; donc fournir un plan est antidémocratique{/amber} ; et comme ce qui est antidémocratique est indésirable, fournir un plan est indésirable. Mais {red}on voit mal en quoi le seul fait de proposer un plan limiterait l'autodétermination{/red} : il aide plutôt à savoir {green}où l'on veut aller, et comment{/green}.

    **Impossible.** Un plan n'est utile que s'il aide à construire la société future ; il ne l'aide que s'il est {amber}parfaitement exact{/amber} ; il n'est exact que s'il {amber}prévoit toutes les circonstances{/amber} de cette société ; or la complexité du monde et les limites humaines l'interdisent ; donc les plans sont inutiles. Mais {red}il est douteux qu'un plan n'ait de valeur que s'il est exact{/red} :{green}un plan n'est pas une prédiction{/green}, et se donner des plans imparfaits fait partie de la façon dont nous déterminons notre avenir.

    **Superflu.** Un plan n'est nécessaire que si la structure de la société future doit être {amber}dessinée{/amber}. Or, pour Marx, {amber}elle se développe d'elle-même au sein du capitalisme{/amber}, et le rôle des hommes est de la {yellow}mettre au monde{/yellow}, non de la dessiner ; donc les plans sont superflus. Mais {red}Marx ne dit pas qui, ou quoi, dessine cette structure à notre place{/red}, et {red}l'histoire depuis Marx ne montre pas{/red} une société socialiste mûrissant d'elle-même dans le capitalisme.
