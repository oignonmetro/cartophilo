- id: sep-marx4-l5
  title: "Marx et les socialistes utopiques"
  notes: |-
    **Marx refuse délibérément de décrire la société communiste : il ne veut pas écrire de** {yellow}**« recettes »**{/yellow} **pour l'avenir.** Ce n'est pas un oubli, mais un principe, qu'il exprime par une image dans la postface à la deuxième édition du *Capital*, en rapportant le reproche qu'on lui fait de s'être {teal}« {/teal}borné à {teal}__un simple démontage critique du donné__{/teal}, au lieu de formuler {teal}__des recettes (comtistes ?) pour les gargotes de l'avenir__ »{/teal}. L'image de la {yellow}gargote{/yellow} dit le mépris : écrire le menu d'un restaurant qui n'existe pas encore, c'est perdre son temps.

    **Ce refus se comprend par sa critique du** {violet}**socialisme utopique**{/violet}**,** dont les trois fondateurs sont {sky}Charles Fourier{/sky}, {sky}Henri Saint-Simon{/sky} et {sky}Robert Owen{/sky}. Ce qui fait l'utopiste : {green}tenir pour légitime et nécessaire de fournir des{/green} {violet}plans{/violet} {green}détaillés de la société socialiste future{/green}, pour guider et motiver ceux qui veulent la faire. Pour l'utopiste, {amber}l'avenir doit être dessiné avant d'être réalisé{/amber}.

    ! Tout socialiste non marxien n'est pas utopique : le *Manifeste* critique aussi les « socialistes féodaux ».

    **Marx loue et blâme les utopistes sans se contredire : il ne loue et ne blâme pas les mêmes choses.** Deux distinctions le montrent :
    - {amber}chronologique{/amber} : les trois fondateurs, contre la deuxième génération et les suivantes (disciples fidèles, ou indépendants comme {sky}Étienne Cabet{/sky}) ;
    - {amber}de contenu{/amber} : la part {green}critique{/green} des écrits utopiques (les défauts de la société capitaliste), contre leur part {red}constructive{/red} (la description de l'avenir).

    Marx préfère {green}la première génération{/green} aux suivantes, et {green}la critique{/green} à {red}la construction{/red}.

    **Pourquoi épargner les fondateurs ? Une question de** {violet}**culpabilité**{/violet}**, non d'erreurs.** Toutes les générations ont, pour Marx, les mêmes idées et les mêmes torts. Mais les fondateurs se sont formés au tournant des XVIIIe et XIXe siècles, dans une société {amber}assez développée pour susciter la critique socialiste{/amber}, {red}pas assez pour qu'elle évite de graves erreurs{/red} : ni les conditions matérielles, ni l'agent historique du socialisme (le prolétariat) n'étaient mûrs. {coral}Leur erreur était historiquement inévitable{/coral}. Les suivants, qui la répètent quand tout a changé, {red}devraient savoir mieux{/red}.
