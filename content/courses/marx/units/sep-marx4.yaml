- id: sep-marx4-l2
  title: "Pourquoi les dominés consentent"
  notes: |-
    **L'idéologie explique une énigme des sociétés de classes : leur** {violet}**stabilité**{/violet}**.** Ces sociétés frustrent l'épanouissement humain et servent une minorité ; pourquoi la majorité dominée les tolère-t-elle, alors que la révolte servirait ses intérêts objectifs ? L'idéologie, en ce sens, n'appartient pas à toute société : on la trouve dans {amber}toutes les sociétés de classes{/amber}, {red}non dans le communisme{/red}.

    **Des sources de stabilité répressives, et non répressives.** Il y a la {red}répression{/red}, ou sa menace ; mais pas seulement. Parmi les sources {violet}non répressives{/violet}, l'idéologie : {coral}les idées sociales dominantes sont fausses ou trompeuses d'une façon qui sert la classe économiquement dominante{/coral}. L'idéologie n'est qu'une part de l'explication ; s'y ajoutent la {yellow}« sourde pression »{/yellow} économique (il faut gagner sa vie chaque jour), les doutes sur les alternatives, la crainte de ce que coûterait un changement radical, et les problèmes d'action collective (chacun attend que les autres se révoltent les premiers). Et {green}on n'est pas prisonnier de l'idéologie{/green} : elle cède aux raisons et aux faits, surtout quand les conditions du changement sont réunies.

    **Des croyances sociales, et dominantes.** Les croyances idéologiques sont si partagées qu'elles deviennent les idées « dominantes » : {teal}« {/teal}Les pensées de {teal}__la classe dominante__{/teal} sont aussi, à toutes les époques, {teal}__les pensées dominantes__{/teal}, autrement dit la classe qui est la puissance matérielle dominante de la société est aussi la puissance dominante spirituelle{teal} »{/teal} (*L'Idéologie allemande*). Ce sont les vues juridiques, politiques, religieuses et philosophiques d'une époque.

    **Trois traits de la croyance idéologique.**
    - {amber}__un contenu faux ou trompeur__{/amber}. {red}Toute erreur n'est pas idéologique{/red} ({yellow}l'erreur scientifique honnête{/yellow}), et une croyance peut tromper sans être fausse : les défenseurs du capitalisme présentent la {violet}forme salaire{/violet} (un salaire contre un travail, à valeur égale) comme {red}toute la vérité{/red} du rapport entre capital et travail, et taisent l'exploitation qui a lieu dans la production : ce qu'ils disent est vrai, mais partiel. Deux erreurs typiques : présenter {red}l'intérêt d'une classe{/red} comme {red}l'intérêt de tous{/red}, et ce qui est {red}historique ou artificiel{/red} comme {red}naturel ou nécessaire{/red} ;
    - {amber}__une origine sociale__{/amber} : la société de classes a {amber}une surface trompeuse, réglée par des rapports essentiels cachés{/amber}. Le capitalisme est la plus trompeuse : sous la féodalité, l'exploitation se voit (le serf travaille certains jours pour lui, d'autres sur la terre du seigneur, à la {yellow}corvée{/yellow}) ; sous le capitalisme, le salaire semble payer toute la journée, et cache la part du travail nécessaire et celle du surtravail. D'où la tâche de la science : {teal}« {/teal}Toute science serait superflue s'il y avait {teal}__coïncidence immédiate entre l'essence des choses et leur forme phénoménale__ »{/teal} (*Le Capital*, livre III). Marx oppose ainsi l'{violet}économie politique classique{/violet}, qui cherche l'essence sous les apparences, à l'{violet}économie vulgaire{/violet}, qui s'en tient aux apparences ;
    - {amber}__une fonction de classe__{/amber} : parmi toutes les idées qui naissent, celles qui « prennent » le font {red}non parce qu'elles sont vraies{/red}, mais {coral}parce qu'elles cachent ou justifient les défauts de la société au profit de la classe dominante{/coral}.

    **L'objection d'**{sky}**Elster**{/sky}**, et deux mécanismes.** Des critiques y voient encore une explication fonctionnelle {red}sans mécanisme{/red} : on affirme que les idées dominantes servent la classe dominante, sans dire ce qui fait qu'il en est ainsi. Les textes de Marx suggèrent pourtant deux mécanismes :
    - la classe dominante {green}dispose des moyens de la production intellectuelle{/green} (aujourd'hui la presse et l'audiovisuel, possédés par les plus riches) ;
    - les individus ont {green}besoin de récits qui légitiment leur position{/green}, ainsi du besoin de consolation religieuse, dans les sociétés où l'on souffre (l'« opium du peuple »).
