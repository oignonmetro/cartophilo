- id: sep-marx4-l4
  title: "L'État dans la société communiste"
  notes: |-
    **Marx dit peu de la société future, mais la** {sky}**Commune de Paris**{/sky} **(1871) lui en montre la forme politique : une démocratie sans professionnels, réduite aux tâches nécessaires.**

    **À ne pas confondre : la** {violet}**dictature du prolétariat**{/violet}**.** Marx emploie rarement l'expression, devenue tristement célèbre. {red}« Dictature » n'y a pas le sens moderne de totalitarisme{/red}, mais {green}le sens antique de gouvernement d'urgence{/green}. Ce gouvernement doit être {amber}démocratique{/amber} (soutenu par la majorité, respectant les libertés d'expression et d'association), mais il est {amber}extra-légal{/amber}, puisqu'il fonde un régime nouveau au lieu d'en préserver un ancien. Il appartient à la {amber}transition{/amber} vers le communisme, non au communisme lui-même : son caractère « dictatorial », c'est-à-dire temporaire et extra-légal, cesse avec l'établissement d'un régime stable.

    **La forme : participation et** {violet}**déprofessionnalisation**{/violet}**.**
    - une forte {amber}participation{/amber} : élections régulières, suffrage universel, {yellow}mandat impératif{/yellow}, révocabilité, séances de l'exécutif ouvertes au public, décentralisation ;
    - des fonctions publiques (législatives, exécutives, judiciaires) qui ne sont plus {red}le butin d'une caste politique{/red}, mais {green}des postes de travail{/green}, payés {amber}au salaire moyen de l'ouvrier{/amber}, et occupées tour à tour, par l'élection.

    {sky}Richard Hunt{/sky} l'appelle une {violet}« démocratie sans professionnels »{/violet}. Marx y reconnaît sa définition de la liberté :{teal}« {/teal}La liberté consiste à transformer l'État, {teal}__organisme qui est mis au-dessus de la société__{/teal}, en {teal}__un organisme entièrement subordonné à elle__ »{/teal} (*Critique du programme de Gotha*, IV). On y reconnaît une influence {violet}républicaine{/violet} sur Marx ({sky}Leipold{/sky}).

    **La fonction : seulement les tâches nécessaires.** Marx distingue :
    - les tâches {green}nécessaires{/green} à toute société développée : résoudre démocratiquement les {yellow}problèmes de coordination{/yellow} (de quel côté de la route rouler) et fournir les {yellow}biens publics{/yellow} (santé, protection sociale, éducation) ;
    - les tâches {red}inutiles{/red} hors des sociétés de classes : la {red}coercition organisée{/red} (armées permanentes, police), que le communisme pourrait réduire, voire supprimer, dans sa phase supérieure, et une fois disparue la menace des sociétés non communistes.

    **Une coercition réduite suppose-t-elle l'unanimité ?** On objecte que se passer de police supposerait que tous soient d'accord sur tout : un consensus {red}improbable{/red}, et même {red}indésirable{/red}, car le désaccord a sa valeur. Pas nécessairement : une communauté démocratique interdit de {yellow}fumer dans les lieux publics{/yellow} ; {yellow}Anne{/yellow}, fumeuse, a voté contre, mais obéit, {coral}non par peur de la police, mais par respect pour la majorité de la communauté dont elle fait partie{/coral}. Des engagements démocratiques assez forts permettent de réduire la coercition sans supposer l'accord de tous sur tout.
