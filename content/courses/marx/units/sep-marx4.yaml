- id: sep-marx4-l1
  title: "Une théorie critique de l'idéologie"
  notes: |-
    **On tient la théorie de l'**{violet}**idéologie**{/violet} **pour l'une des idées les plus fécondes de Marx ; pourtant, il en a peu écrit, et il emploie le mot en plusieurs sens.** {sky}Elster{/sky} la compte parmi ses idées les « plus influentes », {sky}Leiter{/sky} y voit la part « la plus fertile » de sa théorie sociale ; {sky}Paul Ricœur{/sky} range Marx, avec {sky}Nietzsche{/sky} et {sky}Freud{/sky}, parmi les {violet}« maîtres du soupçon »{/violet}, qui mettent en doute la transparence de ce que nous croyons savoir de nous-mêmes et du monde social.

    **Peu de textes, et obscurs.** Il y a des formules célèbres, surtout dans *L'Idéologie allemande*, où l'idéologie présente à l'envers le rapport des individus à leurs conditions de vie, comme une {yellow}chambre noire{/yellow} :{teal}« {/teal}Si, dans l'idéologie tout entière, les hommes et leurs rapports apparaissent {teal}__tête en bas comme dans une Camera obscura__{/teal}, ce phénomène résulte tout autant {teal}__du procès historique de leur vie__{/teal} que le renversement des objets sur la rétine d'un procès directement physique{teal} »{/teal}. L'image se comprend ainsi : la {yellow}camera obscura{/yellow}, une boîte percée d'un petit trou, projette sur sa paroi une image du dehors renversée, mais fidèle à la perspective. Elle dit que l'idéologie {coral}inverse sans inventer{/coral}, et que cette inversion a une cause matérielle, comme l'image renversée sur la rétine. Mais ces images ont plus fasciné les commentateurs qu'elles ne les ont éclairés :{red}il n'y a pas chez Marx d'exposé suivi de l'idéologie{/red}.

    **Trois façons de penser l'idéologie** ({sky}Raymond Geuss{/sky}) :
    - {amber}descriptive{/amber} : l'étude, d'allure anthropologique, des croyances et des rites d'un groupe ;
    - {amber}positive{/amber} : une {violet}vision du monde{/violet} qui donne aux membres d'un groupe sens et identité ;
    - {amber}critique{/amber} : un effort pour libérer les individus de formes de compréhension fausses ou trompeuses.

    **C'est la troisième, critique, qui compte dans la théorie de Marx.** Elle a deux formes : une forme étroite, dans *L'Idéologie allemande*, contre l'{red}« idéalisme sociologique »{/red} des Jeunes-Hégéliens, qui croyaient changer la société en changeant les idées ; et une forme large, qui critique {green}les erreurs largement partagées qui servent les intérêts des classes dominantes{/green}. Cette théorie relève de ce qu'on peut appeler la {violet}sociologie{/violet} de Marx (comment tiennent les sociétés), plutôt que de son anthropologie philosophique (ce qu'est l'homme) ou de sa théorie de l'histoire.
