- id: sep-marx4-l3
  title: "L'État dans la société capitaliste"
  notes: |-
    **Marx n'a pas de théorie unifiée de l'État, mais trois modèles du rapport entre l'État et la classe dominante, que distingue** {sky}**Jon Elster**{/sky}**.** Les remarques de Marx sur l'État sont dispersées dans des écrits de circonstance, sur les événements de son temps ; Elster y met de l'ordre.

    | Modèle | Ce qu'est l'État |
    | instrumental | l'outil de la classe dominante |
    | équilibre des classes | une puissance aux intérêts propres |
    | abdication | laissé par la bourgeoisie, dans son intérêt |

    **Le modèle** {violet}**instrumental**{/violet}**.** L'État est {amber}directement contrôlé{/amber} par la classe dominante, contre les autres classes. C'est celui du *Manifeste* : {teal}« {/teal}Le pouvoir étatique moderne n'est qu'{teal}__un comité chargé de gérer les affaires communes__{/teal} de la classe bourgeoise tout entière{teal} »{/teal}. Cet État peut agir contre tel capitaliste ou telle faction, pour l'intérêt à long terme de toute la bourgeoisie ; mais par quel mécanisme, Marx ne le dit pas.

    **Le modèle de l'**{violet}**équilibre des classes**{/violet}**.** Quand capitalistes et ouvriers ont des forces {amber}presque égales{/amber}, l'État, surtout l'exécutif, s'émancipe des deux et joue de leur conflit pour {amber}ses propres intérêts{/amber}, ceux de la caste politique : en promettant à chaque classe de la protéger de l'autre, il gouverne en toute autonomie. Ainsi des absolutismes survivants après 1848, et du {yellow}bonapartisme{/yellow} de {sky}Napoléon III{/sky} après le coup d'État de décembre 1851. Les intérêts capitalistes ne sont plus que l'{amber}une des limites{/amber} de son action.

    **Le modèle de l'**{violet}**abdication**{/violet}**.** La bourgeoisie {amber}se tient à l'écart du pouvoir politique{/amber}, parce que c'est {coral}son intérêt économique{/coral} : elle abdique un pouvoir qu'elle avait ({yellow}la France{/yellow}), ou s'abstient de le prendre ({yellow}l'Angleterre, l'Allemagne{/yellow}). Le *18 Brumaire* le dit en deux formules : {amber}pour sauver sa bourse, elle doit renoncer à sa couronne{/amber} ; elle cherche à {amber}se débarrasser de sa propre domination politique pour se débarrasser des soucis et des dangers du pouvoir{/amber}. Pourquoi ? Trois raisons possibles :
    - la bourgeoisie, qui ne voit que le profit immédiat, sait que ce {yellow}court-termisme{/yellow} lui serait fatal si elle gouvernait aussi ;
    - gouverner lui coûte trop de temps et d'efforts, et les profits continuent sans cela ;
    - l'abdication affaiblit ses adversaires : le prolétariat doit se battre {yellow}sur deux fronts{/yellow}, contre le capital et contre le gouvernement.

    **Lequel est la vue réfléchie de Marx ? L'abdication.** Il abandonne l'{red}instrumental{/red} au début des années 1850 : il ne rend pas compte d'États durables qui ne sont pas dirigés par les capitalistes et servent pourtant leurs intérêts. L'{red}équilibre{/red} n'est pour lui qu'une {red}solution temporaire de circonstances exceptionnelles{/red}. Reste l'{green}abdication{/green}, qui seule garde le lien que Marx veut entre la politique et l'économie :{coral}la vie politique s'explique par la structure économique{/coral}.

    **Quel modèle laisse le plus d'**{violet}**autonomie**{/violet} **à l'État ?**
    - en un sens faible, l'État est autonome s'il {amber}échappe au contrôle direct{/amber} de la classe dominante : c'est le cas dans l'équilibre et dans l'abdication ;
    - en un sens fort, l'{violet}autonomie explicative{/violet} (Elster), il l'est quand {amber}ses structures et ses politiques ne s'expliquent pas par l'intérêt de la classe dominante{/amber} : seul l'équilibre la donne. Dans l'abdication, {coral}l'indépendance même de l'État s'explique par l'intérêt capitaliste{/coral}.
