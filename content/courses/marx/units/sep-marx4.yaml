# Cours sur la philosophie sociale et politique de Marx, tiré de l'article
# « Karl Marx » de David Leopold, SEP (révision 2025) : sections 5 (idéologie),
# 6 (l'État) et 7 (utopisme). La section 8 (postérité) ne donne pas de leçon.
#
# Citations de Marx en français : L'Idéologie allemande (Écrits philosophiques,
# Sève, pour la camera obscura ; Éditions sociales pour les pensées dominantes,
# lues sur un OCR fautif et rétablies) ; Le Capital, livre III, cité par Sève
# (Écrits philosophiques, introduction) ; Manifeste et Critique du programme de
# Gotha, Éditions sociales ; postface du Capital, livre I, Éditions sociales.
#
# Provisoire : les deux formules du 18 Brumaire (« pour sauver sa bourse… »,
# « se débarrasser de sa propre domination politique… ») sont données en
# paraphrase, sans guillemets : le texte français n'est pas dans les PDF.
# La citation d'Elster (autonomie explicative) est traduite de l'anglais.

