lessons:
- id: g-etre-generique-l1
  title: Être générique
  notes: |-
    Chez Marx, l'{violet}**être générique**{/violet} ({violet}*Gattungswesen*{/violet}) est [def]. Il n'est {pink}ni une simple espèce biologique ni une essence logée en chaque individu{/pink}. Le concept dit ce que l'homme a de propre dans sa [[g-activite-vitale|vie]], et il fonde la critique de 1844 : sans lui, l'aliénation ne serait qu'{red}une privation matérielle{/red} ; avec lui, elle {red}dépossède l'homme de ce qu'il est{/red}.

    __**L'homme est un**__ {violet}__**être générique**__{/violet} __**parce qu'il fait du genre son objet.**__ *Gattung* veut dire genre ou espèce. Marx reprend à {sky}Feuerbach{/sky} l'idée que l'homme se définit par la conscience de son genre, mais il la déplace de la pensée vers la production : {teal}« {/teal}L'homme est un être générique. Non seulement parce que, {teal}__sur le plan pratique et théorique__{/teal}, il {teal}__fait du genre__{/teal}, tant du sien propre que de celui des autres choses, {teal}__son objet__ »{/teal} (*Manuscrits de 1844*, premier manuscrit, Le travail aliéné). Concrètement, {amber}l'homme ne vise pas seulement ce dont il a besoin{/amber} : il connaît et transforme les plantes, les bêtes, les pierres et lui-même comme des genres, y compris ce qu'il ne mangera jamais. Or il ne le peut que parce qu'il se distingue de ce qu'il fait : {teal}« {/teal}L'{teal}activité vitale consciente{/teal} distingue directement l'homme de l'activité vitale de l'animal. C'est précisément {teal}__par là, et par là seulement__{/teal}, qu'il est un être générique{teal} »{/teal} (*ibid*.). {coral}Être générique n'est donc pas appartenir à une espèce, ce que fait tout animal, mais **se rapporter à l'espèce**.{/coral}

    __**Être**__ {violet}__**universel**__{/violet}__**, c'est être libre, parce qu'on n'est rivé à aucune mesure.**__ L'homme, poursuit Marx, {teal}« {/teal}se comporte vis-à-vis de lui-même comme vis-à-vis d'un {teal}__être universel, donc libre__ »{/teal} (*ibid*.). Ce « donc » s'explique par la production : {teal}« {/teal}L'animal ne façonne {teal}__qu'à la mesure__{/teal} et selon les besoins {teal}de l'espèce à laquelle il appartient{/teal}, tandis que l'homme sait {teal}__produire à la mesure de toute espèce__{/teal} et sait appliquer partout à l'objet sa nature inhérente; l'homme façonne donc aussi {teal}d'après les lois de la beauté »{/teal} (*ibid*.). {yellow}L'abeille{/yellow} bâtit toujours la même cellule, parce que la mesure de son activité lui est donnée avec son espèce ; l'homme peut construire comme l'abeille, ou comme le demande le bois ou la pierre. Comme **aucune mesure ne lui est imposée d'avance**, il lui revient de choisir la sienne : c'est en cela que l'universel rend libre. Pour la même raison, {teal}« {/teal}l'homme produit même libéré du besoin physique et {teal}__ne produit vraiment que lorsqu'il en est libéré__ »{/teal} (*ibid*.). Cette liberté n'est pourtant pas une indépendance : {teal}« {/teal}L'{teal}universalité de l'homme{/teal} apparaît en pratique précisément dans l'universalité qui fait de {teal}la nature entière son corps non-organique »{/teal} (*ibid*.). L'homme est libre parce que sa vie s'étend à toute la nature, et non parce qu'il s'en passerait.

    __**Le**__ {violet}__**genre**__{/violet} __**s'atteste dans le monde que l'homme produit.**__ Une universalité seulement pensée ne prouverait rien, car elle resterait une représentation : {teal}« {/teal}C'est précisément dans le fait d'{teal}__élaborer le monde objectif__{/teal} que l'homme commence donc à faire réellement ses preuves d'être générique. {teal}Cette production est sa vie générique active »{/teal} (*ibid*.). Marx le dit par une image : {teal}« {/teal}L'objet du travail est donc l'{teal}__objectivation de la vie générique__{/teal} de l'homme : car celui-ci ne se double pas lui-même d'une façon seulement intellectuelle, comme c'est le cas dans la conscience, mais activement, réellement, et {teal}__il se contemple donc lui-même dans un monde qu'il a créé__ »{/teal} (*ibid*.). {yellow}Terme à terme : le monde transformé est un miroir, et ce qui s'y reflète, ce sont les puissances du genre humain.{/yellow} Marx choisit cette image parce que la conscience de soi ne suffit pas à l'homme : il voit ce qu'il peut dans ce qu'il a fait. D'où la portée critique du concept, car si l'objet lui est retiré, c'est ce miroir qu'il perd : {teal}« {/teal}Le {red}travail aliéné{/red} renverse le rapport de telle façon que l'homme, du fait qu'il est un être conscient, ne fait précisément de son activité vitale, de son essence {teal}__qu'un moyen de son existence__ »{/teal} (*ibid*.).

    __**La**__ {violet}__**vie individuelle**__{/violet} __**et la**__ {violet}__**vie générique**__{/violet} __**ne sont pas différentes, même devant la mort.**__ Le genre n'est pas une réalité à côté des individus, car, même seul, l'homme agit avec ce qu'il tient des autres, le langage et la pensée. Donc {teal}« {/teal}L'{teal}__individu est l'être social__{/teal}. La manifestation de sa vie [...] est donc une manifestation et une affirmation de la vie sociale{teal} »{/teal} (*Manuscrits de 1844*, troisième manuscrit, Propriété privée et communisme), et {teal}« {/teal}La vie individuelle et la vie générique de l'homme {teal}__ne sont pas différentes__ »{/teal} (*ibid*.). D'où la mise en garde : {teal}« {/teal}Il faut surtout éviter de fixer de nouveau la "société" {teal}__comme une abstraction en face de l'individu__ »{/teal} (*ibid*.). L'objection vient d'elle-même : l'individu meurt, et le genre continue. Marx la prend de front : {teal}« {/teal}La {teal}__mort apparaît__{/teal} comme une {yellow}dure victoire du genre sur l'individu déterminé{/yellow} et {teal}__semble__{/teal} contredire leur unité ; mais {teal}__l'individu déterminé n'est qu'un être générique déterminé, et à ce titre mortel__ »{/teal} (*ibid*.). Il n'y a donc pas deux vies dont l'une vaincrait l'autre : {coral}la mortalité est le prix de la forme finie sous laquelle le genre existe{/coral}, et ce qui meurt, c'est telle détermination de la vie générique.

    __**Après 1845, Marx récuse le genre comme**__ {red}__**essence muette**__{/red}__**.**__ Il reproche à {sky}Feuerbach{/sky} d'avoir à {teal}« {/teal}considérer, par conséquent, l'être humain uniquement en tant que "genre", en tant qu'{red}__universalité interne, muette__{/red}, liant d'une façon {red}purement naturelle{/red} les nombreux individus{teal} »{/teal} (*Thèses sur Feuerbach*, thèse 6). {amber}« Muette » est le mot décisif : un tel lien ne passe par aucune activité ni aucun échange{/amber}, puisque chacun le porte en lui comme une propriété commune. Or {teal}« {/teal}L'essence humaine n'est point chose abstraite, inhérente à l'individu isolé. Elle est dans sa réalité {teal}__l'ensemble des relations sociales__ »{/teal} (*ibid*.). Le mot lui-même devient suspect : {teal}« {/teal}les termes philosophiques traditionnels qui s'étaient glissés dans ces ouvrages, tels que "essence humaine", "genre", etc., {teal}__donnèrent aux théoriciens allemands l'occasion qu'ils souhaitaient de se méprendre__ »{/teal} (*L'Idéologie allemande*, partie III, Le concile de Leipzig). Quand il revient dans *Le Capital*, il ne nomme plus ce qu'est l'homme, mais un état passé : {teal}« {/teal}l'immaturité de l'homme individuel qui ne s'est pas encore détaché du {yellow}__cordon ombilical des liens génériques naturels__{/yellow} qu'il a avec les autres{teal} »{/teal} (livre I, 1re section, chap. I). L'image dit que, dans les communautés anciennes, l'individu n'existe pas encore à part de son groupe, comme l'enfant relié à la mère.

    __**La**__ {violet}__**rupture**__{/violet} __**est discutée, car l'activité générique survit peut-être dans le**__ {violet}__**métabolisme social**__{/violet}__**.**__ La thèse de 1845 vise un genre muet ; or celui de 1844 était déjà une activité. Il reste donc à savoir si Marx abandonne son propre concept ou seulement celui de Feuerbach :
    - Rupture : pour {sky}Louis Althusser{/sky} et {sky}Denis Collin{/sky}, l'être générique est un concept idéaliste et normatif, que Marx quitte en 1845 pour la science des rapports de production ; c'est ce qu'Althusser nomme {violet}coupure épistémologique{/violet}.
    - Continuité : pour {sky}Franck Fischbach{/sky} et {sky}Nicholas Shambaugh{/sky}, il définissait déjà une pratique vitale, qui se retrouve à la maturité : le travail y est {teal}« {/teal}une {teal}nécessité naturelle éternelle{/teal}, médiation indispensable au {teal}__métabolisme__{/teal} qui se produit entre l'homme et la nature, {teal}__et donc à la vie humaine__ »{/teal} (*Le Capital*, livre I, 1re section, chap. I).

    Les deux camps s'accordent sur un point : le mot perd sa fonction de norme ; ils divergent sur ce que devient ce qu'il désignait.

    ! « Générique » n'a pas ici le sens courant de banal ou de sans marque : l'adjectif vient de *Gattung*, le genre, et désigne le rapport de l'homme à son genre.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | *Manuscrits de 1844*, premier manuscrit | le genre pour objet : un être universel, donc libre |
    | *Manuscrits de 1844*, troisième manuscrit | vie individuelle et vie générique ne diffèrent pas |
    | *Thèses sur Feuerbach*, thèse 6 | contre le genre comme universalité muette |
    | *L'Idéologie allemande*, partie III | essence humaine et genre, des termes qui égarent |
    | *Le Capital*, livre I, chap. I | les liens génériques, cordon ombilical des communautés anciennes |

    **Voir aussi** : [[g-activite-vitale|Activité vitale]] · [[g-travail-aliene|Travail aliéné]] · [[g-corps-non-organique|Corps non-organique]] · [[g-etre-naturel|Être naturel, être objectif]] · [[g-homme-total|Homme total]]
