- id: ali12-l2
  title: "La réalisation comme déréalisation"
  notes: |-
    **La puissance de travail va vers le procès comme vers ce qui lui donnera accès aux conditions de sa réalisation ; elle y découvre que sa non-objectivité initiale en est le produit. Le procès de réalisation du travail est tout autant son procès de déréalisation.**

    **Elle savait.** La puissance de travail se savait séparée des conditions objectives de sa réalisation, et acceptait pour cela l'échange, seul moyen d'y accéder. Ce qu'elle découvre au terme du procès, c'est que ces conditions sont son propre produit : le travail objectivé lui apparaît comme « *son* propre *produit*, comme étant posé par elle-même, à la fois comme sa propre objectivation et comme son objectivation en tant que puissance indépendante d'elle-même » (IV-43), c'est-à-dire comme capital, « travail objectivé dominant et commandant le travail vivant ». Elle n'est séparée des conditions de son objectivation que parce qu'elle est aussi séparée des produits de sa propre objectivation.

    **Les mots de 1844.** Marx : {teal}« {/teal}Ce procès de {teal}réalisation du travail{/teal} est tout autant son procès de {teal}déréalisation »{/teal} (IV-43). L'allemand : {blue}*Verwirklichungsprozeß*{/blue}, {blue}*Entwirklichungsprozeß*{/blue}. Au terme du procès, le travail « se défait de sa réalisation de soi dans des conditions objectives comme d'une réalité étrangère ({blue}*fremd*{/blue}, le terme qui fait l'{blue}*Entfremdung*{/blue}, l'aliénation) et se pose donc lui-même comme puissance de travail sans substance, simplement indigente, face à cette réalité qui lui est rendue étrangère et qui n'appartient pas à lui, mais à d'autres ».

    **La pauvreté est rétablie.** La force de travail ne s'est pas enrichie pendant le procès : tout est fait pour cela. Seul le capital s'accumule. Les autres, ce sont ceux qui possédaient déjà les conditions du travail et qui possèdent maintenant le produit.

    **Son propre non-être.** Marx : le travail « pose son objectivité comme son propre non-être ou comme l'être de son non-être : du capital » (IV-43). Ce capital est une valeur d'échange autonome, capable d'acheter de nouveau l'usage de la puissance de travail.

    **La richesse d'autrui, sa propre pauvreté.** La force de travail produit la richesse, mais seulement comme richesse d'autrui ; et c'est en la produisant qu'elle engendre sa propre pauvreté, son dénuement, son indigence. Elle n'a fait que « s'approprier les conditions subjectives du travail nécessaire » (IV-43) : son aliénation est sa propre production de soi comme {coral}pure subjectivité{/coral}.

    ! Il ne s'agit pas d'une mauvaise surprise accidentelle : la déréalisation est le résultat régulier du procès, que la condition initiale de séparation rend inévitable.
