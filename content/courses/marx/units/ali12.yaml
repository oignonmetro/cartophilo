- id: ali12-l3
  title: "L'évidage et la réification"
  notes: |-
    **Dans l'économie bourgeoise, l'élaboration complète de l'intériorité humaine apparaît comme un complet évidage, et l'objectivation universelle comme totale aliénation. La réification concerne la richesse produite, non le sujet.**

    **Le paradoxe de la modernité capitaliste.** Marx (V-3) : {teal}« {/teal}Dans l'économie bourgeoise – et à l'époque de production à laquelle elle correspond – cette {teal}complète élaboration de l'intériorité humaine{/teal} apparaît au contraire comme un {teal}complet évidage{/teal}, cette objectivation universelle, comme {teal}totale aliénation »{/teal}. L'allemand : {blue}*als völlige Entleerung*{/blue}, {blue}*als totale Entfremdung*{/blue}. Jamais l'intériorité humaine n'a été autant cultivée, exprimée dans l'objectivité, ni l'objectivité autant formée par les hommes ; mais cette expression de soi s'est accomplie comme {blue}*Entäußerung*{/blue} : complète séparation entre ceux qui s'expriment et ce en quoi ils s'expriment.

    **Les renversements.** L'expression ({blue}*Äußerung*{/blue}) se renverse en {blue}*Entäußerung*{/blue}, perte de l'expression ; la réalisation ({blue}*Verwirklichung*{/blue}) en déréalisation ({blue}*Entwirklichung*{/blue}) ; l'objectivation ({blue}*Vergegenständlichung*{/blue}) en désobjectivation ({blue}*Entgegenständlichung*{/blue}). Ces termes sont déjà ceux des *Manuscrits de 1844*. Le sujet est replié sur une {coral}intériorité absolument vide{/coral}, séparé des résultats comme des conditions de son objectivation.

    **La richesse sous figure de chose.** La modernité bourgeoise ne connaît la richesse que « réalisée dans des choses, dans des produits matériels auxquels l'homme fait face en tant que sujet » : elle apparaît « comme figure réifiée, que ce soit comme chose ou comme rapport médiatisé par la chose » (V-3). L'allemand est {blue}*in dinglicher Gestalt*{/blue} : {blue}*Ding*{/blue}, la chose, le latin {blue}*res*{/blue}, non {blue}*Gegenstand*{/blue}.

    ? **Réification** : le fait, pour la richesse produite, de prendre {teal}forme de chose{/teal} ({blue}*Ding*{/blue}, latin {blue}*res*{/blue}) et de se dresser, accumulée et morte, face à ceux qui la produisent. Chez Marx, elle concerne la {amber}richesse, non la subjectivité des hommes{/amber}.

    **Du côté de l'objet.** Si réification il y a, c'est du côté de l'objet produit, des résultats de la production. On n'a pas un sujet qui deviendrait lui-même objet : c'est l'inverse. C'est parce que la richesse s'accumule sous forme de chose que les hommes sont posés comme subjectivité abstraite, vide, séparée des produits comme des conditions de leur réalisation. Plus le règne de la réification s'étend sur la richesse, plus l'empire de la subjectivité évidée s'étend sur les hommes. Le « rapport médiatisé par la chose » ouvre vers ce que Marx appellera le fétichisme, qu'on traitera plus tard.

    ! La réification n'est pas ici la transformation des hommes en choses : c'est la forme de chose que prend la richesse, et le sujet vide n'en est que le revers.
