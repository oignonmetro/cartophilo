lessons:
- id: ali12-l1
  title: "De la pauvreté absolue à la source de toute richesse"
  notes: |-
    **Le travail est pauvreté absolue du point de vue de l'objectivité, et possibilité universelle de la richesse du point de vue de l'activité. C'est sur cette seconde face que le capital met la main.**

    **Le renversement.** C'est l'usage même que le capital fait de la puissance de travail, une fois qu'il en dispose par l'échange, qui atteste qu'elle est aussi l'inverse de la pauvreté absolue : la source de toute richesse. Cela apparaît quand le capital réalise la valeur d'usage qu'il a achetée, c'est-à-dire met la puissance de travail au contact des conditions objectives : elle se révèle alors en acte comme travail vivant, manifestant le travail {coral}« non comme objet, mais comme activité »{/coral}.

    **Deux points de vue.** Marx : le travail apparaît alors comme « la *source vivante* de la valeur », et lui qui est « la *pauvreté absolue en tant qu'objet* » est aussi « la *possibilité universelle* de la richesse en tant que sujet et qu'activité » (III-9). Du point de vue de l'objectivité, le travail n'est rien : pure subjectivité abstraite, séparée de toutes les conditions de son actualisation. Du point de vue de l'activité, il est possibilité universelle de la richesse, mais toujours {teal}sous les conditions du capital{/teal}.

    **Ce dont le capital a besoin.** Il ne peut pas se valoriser tout seul, n'étant que du travail accumulé, de l'objectivité morte. Il lui faut cette source de vitalité, qui est pour lui la possibilité de son propre accroissement.

    **La richesse est du côté de l'activité.** Dans le capital, la richesse n'existe qu'à l'état de richesse objectivée, accumulée, donc morte, de produit ; c'est dans le travail seulement qu'elle existe comme productivité, mouvement producteur de richesse, {amber}comme vie{/amber}. Mais dans le cadre de l'opposition travail-capital, cette vie est empêchée de s'accomplir : elle reste séparée de ce qu'elle pourrait vivifier.

    ! « Pauvreté absolue en tant qu'objet » ne signifie pas que le travail soit sans valeur pour le capital : c'est du point de vue de l'objectivité qu'il n'est rien.
