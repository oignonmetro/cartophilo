- id: ali12-l4
  title: "Déplacer la richesse"
  notes: |-
    **La modernité fait de la production la fin de l'homme et de la richesse la fin de la production : un renversement de toutes les valeurs. Il s'agit de le défaire non en revenant à l'Antiquité, mais en cherchant une objectivation qui soit une réalisation : la richesse déplacée de la chose à l'activité.**

    **La richesse, dans l'activité.** La richesse est, aux yeux de Marx, dans l'activité de la force de travail. Mais cette activité ne se réalise que dans le procès de travail vivant, et la force de travail ne l'expérimente pas comme sa propre activité : elle en est déjà dépossédée, puisqu'elle a vendu l'usage. Le capitaliste n'a lui non plus de rapport qu'avec ses produits : le capital ne connaît que l'accumulation. Hors de cette séparation, la richesse serait vécue dans l'acte même de produire : {teal}l'expérience d'être actif par soi-même et pour soi-même{/teal}, s'éprouver vivant. C'est là qu'est la vie : « qu'est-ce que la vie sinon l'activité ? » (*Manuscrits de 1844*). La vraie subjectivité est le sujet actif par lui-même et pour lui-même, l'activité générique, non celle de l'individu esseulé.

    **Un renversement de toutes les valeurs.** La modernité fait de la richesse la fin de la production et de la production la fin des hommes. Marx : {amber}« l'opinion ancienne selon laquelle l'homme apparaît toujours comme la finalité de la production »{/amber}, malgré le caractère borné de ses déterminations nationales, religieuses, politiques, « semble d'une grande élévation en regard du monde moderne, où c'est la production qui apparaît comme la finalité de l'homme, et la richesse comme finalité de la production » (V-3). Marx et Nietzsche, deux penseurs du renversement.

    **Pas de nostalgie.** « Le monde antique est satisfaisant si l'on s'en tient à un point de vue borné » (V-3), et le « puéril monde antique » ({blue}*kindisch*{/blue}, péjoratif) ne vaut pas qu'on y revienne : la modernité a fait sauter les bornes nationales, religieuses, politiques. Il s'agit de porter au-delà d'elle-même la dynamique de la modernité. Mais elle a encore ses bornes ({blue}*Schranke*{/blue}), du côté de l'accomplissement des hommes : elle ne les accomplit qu'en les évidant.

    **Faire sauter la borne.** Chercher les voies d'une objectivation des hommes qui soit en même temps leur réalisation et leur accomplissement. Cela suppose de {coral}déplacer la richesse{/coral} : ne plus la placer dans les choses produites, mais dans la productivité, dans le déploiement de leur propre activité générique ; la faire passer de la forme de chose à la forme de l'activité. Et que ce déploiement des forces humaines soit lui-même la fin, non le moyen d'accumuler de la richesse objective.

    ! Marx ne regrette pas l'Antiquité : le monde antique n'est « élevé » que sous un point de vue borné.
