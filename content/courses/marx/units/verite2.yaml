id: verite2
title: "De l'idéologie"
subtitle: "Un rapport imaginaire aux conditions d'existence : propriété privée, théorie pure, fétiches, État et violence recouverte"
group: "Le travail comme expérience de la vérité"
icon: compass
color: sky
lessons:
- id: verite2-l1
  title: "Un rapport imaginaire aux conditions réelles"
  notes: |-
    **L'idéologie est le** {amber}**rapport imaginaire des hommes à leurs conditions réelles d'existence**{/amber}**.** La définition, au sens marxien du terme, revient à {sky}Louis Althusser{/sky} : ces conditions sont liées aux structures de la {blue}*praxis*{/blue} productive et à leur mouvement, qui est {coral}l'histoire même des hommes{/coral}.

    **« Imaginaire » qualifie le tout de la relation**, et non quelques idées fausses mêlées à d'autres vraies. C'est un {red}égarement{/red} qui porte les hommes à {amber}ne pas reconnaître la réalité de leurs conditions{/amber} et à {amber}donner de la réalité à ce qui n'en a pas{/amber} : des {violet}fantasmagories{/violet}.

    **À quoi les reconnaît-on ?** À une {red}__double impossibilité__{/red} :
    - leur attribuer une {amber}détermination{/amber} ;
    - attester leur existence par des {amber}données effectives, ostensibles{/amber}, que plusieurs pourraient valider ensemble et tenir pour des évidences communes.

    Ce sont des {violet}fantômes{/violet}, des {violet}fétiches{/violet} : des choses qu'on honore et qu'on craint, sans pouvoir dire ce qu'elles sont ni les montrer. Le critère du réel est ainsi {green}la donnée partageable{/green}, non la force de la croyance.

    **La structure générale de l'idéologie, Marx la désigne du terme d'**{violet}**aliénation**{/violet}. Trois figures en sont privilégiées : la {amber}religion{/amber}, l'{amber}économie politique{/amber} et la {amber}croyance en la légitimité de l'État{/amber}.

    **L'idéologie n'est pas une simple erreur.** Sous sa modalité, {coral}l'existence tout entière s'est rendue étrangère à soi{/coral}. Il faut la comprendre comme {red}__violence__{/red} et comme {red}__occultation de sa propre violence__{/red}, donc de la violence de l'histoire : elle ne trompe pas seulement sur le monde, elle cache qu'on y est contraint, et elle cache qu'elle le cache.

    ! « Imaginaire » ne veut pas dire sans effets : un rapport imaginaire organise réellement la conduite de ceux qui le vivent.
