- id: verite2-l2
  title: "Le sujet séparé de l'objet : la propriété privée"
  notes: |-
    **L'existence est aliénée quand les hommes** {red}**ne voient pas que c'est le travail qui la produit socialement**{/red}**.** L'aveuglement a une forme philosophique précise : l'{violet}opposition du sujet et de l'objet{/violet}, posés comme {pink}deux réalités qui subsisteraient en soi et par soi{/pink}.

    **Ce que cette opposition méconnaît tient en deux processus.**
    - Un sujet humain se constitue comme tel dans un {violet}processus de subjectivation{/violet}, lié à son {amber}opération de producteur{/amber}.
    - Symétriquement, les objets, naturels ou fabriqués, prennent figure dans un {violet}processus d'objectivation{/violet}, inséparable des {amber}opérations du travail{/amber}.

    **La forme supérieure de l'aliénation est la** {violet}**propriété privée**{/violet}**,** qui {coral}institue socialement la séparation du sujet et de l'objet{/coral} : __une chose est de produire l'objet, une autre de le posséder__. L'ouvrier qui fabrique une {yellow}table{/yellow} n'en dispose pas, celui qui en dispose ne l'a pas faite. Tout un ordre social, avec ses objets traités en marchandises, ses moyens de les produire et de les échanger, repose sur cette séparation comme sur son principe.

    **En quoi cette aliénation est-elle idéologique ?** En ce qu'elle s'explicite en une {violet}représentation abstraite{/violet}, qui {coral}sépare ce qui ne se laisse penser que comme un tout{/coral}.

    **Mais l'abstraction n'est pas disqualifiable en elle-même.** Elle devient idéologique quand elle {red}__se voile comme abstraction__{/red} : quand elle dissimule qu'elle dissimule l'unité des deux processus. Celui qui isole un objet pour l'étudier et le sait abstrait ne se trompe pas ; celui qui le tient pour subsistant par lui-même se trompe, et ne peut le savoir.

    **Cette unité est** {violet}**concrète**{/violet}**,** au sens du latin {blue}*concrescere*{/blue}, « croître ensemble » : sujet et objet {green}croissent ensemble{/green}, l'un en {amber}force productive{/amber}, l'autre en {amber}richesse humaine{/amber}.
  points:
