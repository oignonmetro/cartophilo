    answer: "M-A-M"
    alt: ["MAM", "M A M"]
  - id: verite2-l7-p8
    sentence: "__Le cycle d'accumulation et d'expansion capitaliste__, où l'argent investi revient accru, se note ___."
    answer: "A-M-A'"
