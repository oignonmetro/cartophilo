    answer: "objectivation"
    alt: []
  - id: verite2-l2-p5
    sentence: "__La forme supérieure de l'aliénation__ consiste dans la ___."
    answer: "propriété privée"
    alt: ["propriete privee"]
  - id: verite2-l2-p6
    sentence: "__La propriété privée institue socialement la **___** du sujet et de l'objet__."
    answer: "séparation"
    alt: ["separation"]
  - id: verite2-l2-p7
    sentence: "__Sous la propriété privée, une chose est de produire l'objet__, une autre de le ___."
    answer: "posséder"
