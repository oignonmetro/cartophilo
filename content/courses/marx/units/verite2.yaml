- id: verite2-l6
  title: "Le fétichisme de la marchandise"
  notes: |-
    **Le fétichisme de la marchandise consiste à** {red}**croire**{/red}**, pour les agents de l'échange, et à** {red}**faire croire**{/red}**, pour les théoriciens de l'économie,** que la réalité humaine, c'est la réalité effective de l'économie.

    **Et la réalité effective de l'économie serait le** {amber}**prix**{/amber} : il reflète une négociation entre des {pink}agents privés{/pink}, arbitrée par la qualité de l'{amber}information{/amber} dont ils disposent, là où ils compareraient les valeurs des produits par une opération de connaissance. Ces valeurs dépendraient à leur tour de l'{pink}agrégation des opérations productives d'agents individuels{/pink}.

    **Suivons la chaîne des identifications** : la {amber}marchandise{/amber} serait sa {amber}valeur{/amber}, sa valeur son {amber}prix{/amber}, son prix la {amber}représentation de son utilité{/amber} par les agents. Au bout de la chaîne, l'utilité ne serait même plus la {violet}valeur d'usage{/violet}, ce à quoi la chose sert réellement, mais {red}sa représentation dans l'espace de l'échange marchand{/red}. Un {yellow}manteau{/yellow} ne vaudrait plus parce qu'il protège du froid et parce qu'il a coûté un travail, mais pour ce que des acheteurs se représentent de lui.

    **La définition.** {coral}Le fétichisme de la marchandise est la **séparation abstraite** de la marchandise comme objet et du **procès de travail** comme processus social de subjectivation dont elle dépend{/coral}. On retrouve le sujet coupé de l'objet, au cœur de l'économie.

    **Ce qui est nié dans ce jeu de dupes**, intérieur à la conscience, n'est rien de moins que la {red}__violence de l'histoire__{/red}.

    ! Le fétichisme n'est pas l'amour des objets de consommation : c'est la croyance que la marchandise tient sa valeur d'elle-même et de l'échange, coupée du travail social.
  points:
  - id: verite2-l6-p1
    sentence: "__Le fétichisme de la marchandise sépare abstraitement__ la marchandise comme objet et le **___** comme processus social de subjectivation."
    answer: "procès de travail"
    alt: ["proces de travail", "processus de travail"]
  - id: verite2-l6-p2
    sentence: "__La séparation abstraite entre la marchandise comme objet et le procès de travail dont elle dépend__ définit le **___ de la marchandise**."
