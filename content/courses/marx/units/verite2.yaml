- id: verite2-l3
  title: "L'homme socialiste et l'homme qui meurt de faim"
  notes: |-
    **L'aliénation ne se dépasse que par l'**{violet}**abolition de la propriété privée**{/violet}**,** puisque c'est elle qui institue la séparation. Ce dépassement a la figure de l'{green}homme socialiste{/green} dans les {sky}*Manuscrits de 1844*{/sky} ; à partir de {sky}*L'Idéologie allemande*{/sky}, Marx parle de {violet}communisme{/violet}.

    **Dans l'existence aliénée**, le travailleur rencontre le produit de son travail, la richesse produite et les structures sociales mêmes {red}comme des puissances hostiles{/red}. Cela ne veut pas dire qu'il ne se rende compte de rien ni qu'il ne souffre pas : {coral}sa souffrance l'expose aux représentations idéologiques{/coral} qui le persuadent de renoncer à s'opposer à l'ordre de la propriété privée.

    **L'homme socialiste, lui, jouit** {green}__socialement__{/green} **d'un monde qu'il sait socialement produit.** {teal}« {/teal}L'{teal}abolition de la propriété privée{/teal} est donc l'{teal}__émancipation totale de tous les sens__{/teal} et de toutes les {teal}qualités humaines{/teal} ; mais elle est cette émancipation précisément parce que ces sens et ces qualités sont {teal}__devenus humains__{/teal}, {teal}tant subjectivement qu'objectivement{/teal}.{teal} »{/teal} ({sky}*Manuscrits de 1844*{/sky}, troisième manuscrit)

    **L'exemple de la musique.** {yellow}L'oreille musicienne ne jouit pas comme l'oreille non musicienne{/yellow} : la musique que j'écoute et que j'aime unit l'éducation de mes sens, la production artistique comme entreprise sociale, l'expérience partagée du plaisir, mon corps, mais comme corps humain, et le son, phénomène naturel, mais reçu à l'horizon de la vie pratique et productive. {coral}La musique n'a sa réalité effective que dans l'unité de tous ces moments{/coral}.

    **Le contre-exemple.** {teal}« {/teal}Pour l'{teal}homme qui meurt de faim{/teal}, la {teal}__forme humaine de l'aliment__{/teal} n'existe pas, mais seulement son {teal}__existence abstraite en tant qu'aliment__{/teal}{teal} »{/teal} (même manuscrit). L'affamé n'objective pas son essence humaine dans un repas produit et consommé socialement : la nourriture n'est pour lui qu'un moyen de soutenir son {red}indigence biologique{/red}, ce qu'elle est pour l'animal.

    **La faim n'est pas seule en cause.** Sous la propriété privée, même le {yellow}riche consommateur{/yellow} inquiet des effets de ses aliments sur son organisme est condamné à {red}se vivre comme un animal indigent{/red}, et à vivre le travail comme une torture à laquelle consentir pour survivre.

    **La vraie relation aux choses commence par une reconnaissance** : le travail est effort, mais aussi {green}force{/green}, puissance de {amber}figurer les choses en un monde{/amber}. Il faut reconnaître cette puissance sociale pour mieux la laisser s'affirmer, {coral}la reconnaissance étant le commencement même de l'affirmation{/coral}.
  points:
  - id: verite2-l3-p1
    sentence: "__Le dépassement de l'aliénation ne peut consister__ qu'en l'**abolition de la ___**."
    answer: "propriété privée"
    alt: ["propriete privee"]
  - id: verite2-l3-p2
    sentence: "__Dans les *Manuscrits de 1844*, le dépassement de l'aliénation__ s'explicite à travers la figure de l'**homme ___**."
