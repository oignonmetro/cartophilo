  - id: verite2-l7-n2
    sentence: "__Les économistes ont compris qu'il fallait contenir les **___ d'ouvriers**__ pour ne pas fausser le marché du travail."
    answer: "coalitions"
    alt: []
  - id: verite2-l7-p4
    sentence: "__Premier motif d'aveuglement des économistes__ : ils ne voient pas la spécificité de la **___ capitaliste**."
    answer: "propriété privée"
