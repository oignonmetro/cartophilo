- id: verite2-l5
  title: "Les fétiches : religion, économie, État"
  notes: |-
    **Dans l'aliénation, la conscience** {red}**se cherche où elle n'est pas**{/red}**, et ne se trouve pas où elle est** : un rapport à soi pervers et malheureux, un rapport de désir, qui produit des {violet}idoles érigées en fétiches{/violet}.

    **Deux modalités du fétiche.**
    - {amber}La religion{/amber} : la conscience {violet}hypostasie{/violet} ses fétiches, c'est-à-dire qu'elle en fait des êtres subsistants, projections spectrales d'{yellow}esprits{/yellow} et de {yellow}divinités{/yellow}.
    - {amber}L'économie{/amber} : vidée de ce qu'elle contenait de spirituel, la {violet}marchandise{/violet} vit sa vie de valeur marchande, dans la croyance des « agents économiques » et des économistes qui la soutiennent de leurs catégories. Elle passe pour le produit d'une négociation entre l'offre et la demande ; le {amber}prix de marché{/amber} dit sa vérité et s'impose comme principe de tout arbitrage des conflits.

    **L'économie requiert un troisième fétiche.** Il lui faut une {violet}gouvernementalité{/violet} et un ordre juridique : la {red}fiction de la souveraineté étatique{/red} au service de l'intérêt général. L'État se lie aux deux autres pour garantir le crédit des institutions qui dirigent l'exploitation du travail, et, par les programmes de recherche et d'enseignement, pour favoriser un enseignement qui rend méconnaissable la {blue}*praxis*{/blue} productive.

    **Religion et économie s'opposent, mais se** {coral}**médiatisent**{/coral}**.** {sky}*Le Capital*{/sky}, livre I, chap. I, 4 : pour une société de producteurs de marchandises, qui rapportent leurs travaux privés les uns aux autres comme autant de travail humain semblable, {teal}« {/teal}le {teal}__christianisme__{/teal} avec son {teal}__culte de l'homme abstrait__{/teal}, notamment dans son {teal}développement bourgeois{/teal}, dans le protestantisme, le déisme, etc., est la {teal}forme de religion la plus appropriée{/teal}.{teal} »{/teal} À des travaux comptés comme travail humain en général répond le culte de l'homme en général.

    **Aux sociétés peu développées répondent d'autres cultes.** Quand les forces productives sont basses et les rapports entre les hommes, comme avec la nature, bornés, {teal}« {/teal}cette {teal}inhibition réelle{/teal} {teal}__se reflète idéellement__{/teal} dans les {teal}vieilles religions de la nature{/teal} et les religions populaires{teal} »{/teal}. La société marchande se cherche dans l'{amber}homme universel abstrait{/amber} ; les sociétés proprement « économiques », reposant sur l'{blue}*oikos*{/blue}, le foyer domestique comme unité de production, dans des {amber}divinités tutélaires locales{/amber}.

    **La disparition a une condition réelle.** {teal}« {/teal}Le {teal}__reflet religieux du monde réel__{/teal} ne peut disparaître de manière générale qu'une fois que les rapports de la vie pratique des travaux et des jours représentent pour les hommes, de manière quotidienne et {teal}transparente{/teal}, des {teal}__relations rationnelles__{/teal} entre eux et avec la nature.{teal} »{/teal}

    **À l'économie du fait religieux répond la** {violet}**religiosité du fait économique**{/violet} : la marchandise a elle aussi ses croyants.
  points:
