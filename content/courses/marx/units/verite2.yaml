- id: verite2-l8
  title: "Le travail devenu social et la dissonance du capital"
  notes: |-
    **En concentrant les facteurs, capital et travail, le capitalisme** {coral}**change l'essence même du travail**{/coral} : sous les conditions d'une {violet}coopération forcée{/violet}, il cesse d'être une {pink}addition d'opérations privées{/pink} pour devenir la moyenne, la médiation des opérations individuelles : un {green}**travail social**{/green}. Dans une {yellow}manufacture{/yellow}, aucun ouvrier ne fait l'objet : ce que vaut un geste se mesure à ce qu'il apporte à l'ensemble, au rythme moyen de tous.

    **La conséquence est décisive** : l'échelle de l'individu et l'individualité de son opération {red}cessent de fonder la mesure de la valeur{/red} du travail.

    **Le capitalisme est donc affecté d'une** {violet}**dissonance affective et cognitive**{/violet}, et il s'aveugle scrupuleusement à son sujet.

    | Plan | Ce que fait le capitalisme |
    | cognitif | il mesure la valeur à l'échelle de l'individu |
    | affectif | il individualise contrats et évaluations |

    **Sur le plan cognitif**, prendre la {violet}survaleur{/violet} (ou plus-value) de l'individu pour fondement de la mesure de la valeur est une norme {red}irréelle, donc imaginaire{/red}, puisque {coral}la valeur est produite socialement{/coral}.

    **Sur le plan affectif**, le capitalisme oppose ses stratégies d'individualisation du contrat de travail et d'évaluation des performances, le {yellow}management{/yellow}, au {green}collectif de travail{/green}, où la puissance du travail social se fait sujet.

    **Il ne voit donc pas la** {violet}**lutte des classes**{/violet} **comme sa réalité même**, sociale aussi bien qu'historique. Pour Marx, en son temps, {coral}l'accumulation du capital a sa réalité dans l'accumulation des bases révolutionnaires de son propre dépassement{/coral} : plus le capital rassemble de travailleurs, plus il forme le collectif qui peut le renverser.
  points:
  - id: verite2-l8-p1
    sentence: "__Sous les conditions d'une coopération forcée, le travail__ cesse d'être une somme d'opérations privées pour devenir un **___**."
    answer: "travail social"
    alt: []
  - id: verite2-l8-p2
    sentence: "__La concentration du capital et du travail transforme le travail__ sous les conditions d'une **___ forcée**."
    answer: "coopération"
    alt: ["cooperation", "co-opération"]
  - id: verite2-l8-n1
    sentence: "__Devenu social, le travail cesse d'être une agrégation__ d'**opérations ___**."
    answer: "privées"
    alt: ["privees"]
  - id: verite2-l8-p3
    sentence: "__Le travail étant devenu social__, l'échelle de l'___ cesse d'être le fondement de la mesure de la valeur du travail."
    answer: "individu"
    alt: []
  - id: verite2-l8-p4
    sentence: "__Le mode de production capitaliste est affecté d'une ___ **affective et cognitive**__, au sujet de laquelle il s'aveugle."
    answer: "dissonance"
    alt: []
  - id: verite2-l8-n2
    sentence: "__La dissonance qui affecte le mode de production capitaliste__ est à la fois affective et ___."
    answer: "cognitive"
    alt: []
  - id: verite2-l8-p5
    sentence: "__Sur le plan cognitif, la mesure de la valeur par la survaleur de l'individu__ est irréelle, puisque la valeur est produite ___."
    answer: "socialement"
    alt: []
  - id: verite2-l8-p6
    sentence: "__Une norme qui prend l'individu pour mesure d'une valeur produite socialement__ est irréelle, donc ___."
    answer: "imaginaire"
    alt: []
  - id: verite2-l8-p7
    sentence: "__Sur le plan affectif, le capitalisme oppose au collectif de travail__ l'___ du contrat de travail et l'évaluation des performances."
    answer: "individualisation"
    alt: []
  - id: verite2-l8-p8
    sentence: "__Le nom de la stratégie qui individualise l'évaluation des performances__ contre le collectif de travail : le ___."
    answer: "management"
    alt: []
