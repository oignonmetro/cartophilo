    alt: []
  - id: verite2-l2-p9
    sentence: "__La représentation abstraite de l'aliénation sépare__ ce qui ne se laisse penser que comme un ___."
    answer: "tout"
    alt: []
  - id: verite2-l2-p10
    sentence: "__L'abstraction n'est pas disqualifiable en elle-même__ : elle devient idéologique quand elle **se ___ comme abstraction**."
