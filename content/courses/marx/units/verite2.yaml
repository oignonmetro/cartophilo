- id: verite2-l10
  title: "L'accumulation initiale : la violence recouverte"
  notes: |-
    **La gouvernementalité étatique de la** {blue}***praxis***{/blue} **productive se confond avec la** {red}**violence de l'histoire**{/red}, et cette violence est la réalité que l'économie, comme savoir académique et comme pratique sociale, recouvre et dissimule.

    **Sa présentation idéologique : l'**{violet}**accumulation primitive**{/violet} **de** {sky}**Smith**{/sky} (« accumulation initiale » dans la traduction Lefebvre du *Capital*). Censée expliquer d'où vient la première mise du cycle A-M-A', elle raconte une {pink}aimable histoire de réussites{/pink} : des entreprises menées par des agents qui auraient su, avec de la chance, du talent et du flair, changer en capital les bénéfices d'un patient travail, vertueusement accumulés et transmis. Les sentiments moraux aidant, le désir d'être envié de son semblable, le petit propriétaire devient entrepreneur {yellow}comme la chenille devient papillon{/yellow}.

    **Ce que le récit oublie.** Avec le capital, c'est un {amber}fonds de travail social disponible{/amber} qui est requis. D'où le lien entre la multiplicité des {violet}expropriations{/violet}, historiquement documentées, et la nécessité d'une {violet}armée de réserve{/violet} de prolétaires pour coopérer à la {yellow}mine{/yellow}, dans le {yellow}textile{/yellow}, la {yellow}sidérurgie{/yellow}.

    **La conclusion de Marx** ({sky}*Le Capital*{/sky}, livre I, chap. XXIV, 1) : {teal}« {/teal}Chacun sait que dans l'{teal}histoire réelle{/teal} le premier rôle est tenu par la {teal}__conquête__{/teal}, l'{teal}asservissement{/teal}, le crime et le pillage, en un mot, par la {teal}__violence__{/teal}. Dans la suave {teal}économie politique{/teal}, c'est l'{teal}__idylle__{/teal} qui a toujours régné.{teal} »{/teal}

    **La force se double d'un droit.** Sous couleur d'affranchir le serf attaché à la glèbe, un ordre juridique universalise la {violet}personnalité juridique{/violet}, sans laquelle le travailleur ne pourrait pas signer le contrat de travail. Désaffiliation sociale, production de masse, objet traité en marchandise, négociation érigée en lien social et marché du travail s'impliquent nécessairement : le travailleur « autonome » y vend sa force de travail par un contrat qui fonde sa rémunération sur la survaleur qu'il dégage.

    **La genèse des conditions de l'accumulation met donc au jour des dynamiques de** {red}__violence institutionnelle__{/red}, l'{violet}institution{/violet} s'entendant comme {amber}**l'ensemble des conditions de l'administration organisée de la violence**{/amber}.

    **La théorie s'oppose ici à l'idéologie** : elle rapporte les hommes à leurs conditions réelles d'existence, mais aussi au recouvrement idéologique de ces conditions, et elle le fait en créant un {green}savoir{/green}.
