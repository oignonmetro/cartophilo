    answer: "révolutionnaires"
    alt: ["revolutionnaires"]

- id: verite2-l9
  title: "La critique de l'État moderne"
  notes: |-
    **La critique marxienne de l'État moderne vise un** {violet}**dispositif idéologique**{/violet}, qui agence une autorité instituée en {amber}pouvoir souverain{/amber}.

    **Les pièces du dispositif** :
    - un pouvoir distinct de la {violet}société civile{/violet}, champ des interactions négociées entre individus et groupes ;
    - le principe d'un {amber}intérêt général{/amber} qui transcende les intérêts particuliers ;
    - la distinction des trois pouvoirs, législatif, exécutif et judiciaire ;
    - des {amber}droits opposables{/amber} reconnus aux individus comme hommes et comme citoyens, pour les garantir contre l'arbitraire de l'État.

    **{sky}*Sur la question juive*{/sky}** analyse la {sky}*Déclaration des droits de l'homme et du citoyen*{/sky} et rattache à l'institution du {violet}droit de propriété{/violet} tous les droits reconnus au citoyen comme individu humain : {coral}liberté et égalité sont surdéterminées par le principe « sacré » de la propriété{/coral}. Cette priorité éclate quand le parlementarisme bourgeois est exposé à la poussée des revendications ouvrières, c'est-à-dire à l'affirmation politiquement révolutionnaire du travail comme puissance sociale. {sky}*Le 18 Brumaire de Louis-Napoléon Bonaparte*{/sky} dénonce alors le {red}caractère cosmétique{/red} de la liberté et de l'égalité {violet}formelles{/violet}.

    **La réalité effective de l'État est la** {red}__**guerre sociale**__{/red}, condition réelle de l'existence des hommes en tant que puissance sociale de la {blue}*praxis*{/blue} productive. Le rapport imaginaire à cette condition est l'{amber}oscillation du citoyen{/amber} entre l'{pink}illusion parlementariste{/pink} et l'{pink}illusion césariste{/pink}, anti-parlementariste. C'est encore la croyance en une {violet}émancipation politique{/violet} dont l'État serait l'opérateur et le médiateur, là où {green}il n'y a d'émancipation qu'humaine{/green}, comme auto-affirmation de la *praxis* productive.

    **La portée de la thèse est précise.** Marx {red}ne dit pas{/red} que l'émancipation humaine exclut toute stratégie pour conquérir et exercer le pouvoir d'État, au besoin dans des {yellow}coalitions parlementaires{/yellow} ; il dit qu'{coral}une stratégie politique ne peut être jugée pertinente, au regard des conditions réelles, que dans un horizon d'émancipation humaine plutôt que politique{/coral}. L'horizon de cette émancipation est le {violet}**dépérissement de l'État**{/violet}.
