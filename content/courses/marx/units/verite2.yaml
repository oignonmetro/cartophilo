- id: verite2-l4
  title: "La théorie pure et sa triple relation à la production"
  notes: |-
    **La séparation du sujet et de l'objet s'explicite en une séparation de la théorie et de la réalité : l'existence d'une** {violet}**théorie pure**{/violet}**.** Pour qu'il y ait aliénation, {coral}la conscience doit s'être posée comme séparée de la pratique réelle{/coral}. Et cette séparation n'est possible qu'avec la {violet}division sociale du travail{/violet}, dès qu'elle oppose réellement le travail {amber}matériel{/amber} au travail {amber}intellectuel{/amber}.

    **Le moment de la rupture** ({sky}*L'Idéologie allemande*{/sky}, I) : {teal}« {/teal}A partir de ce moment, la conscience peut vraiment {teal}__s'imaginer__{/teal} qu'elle est {teal}autre chose que la conscience de la pratique existante{/teal}, qu'elle représente réellement quelque chose sans {teal}représenter quelque chose de réel{/teal}. A partir de ce moment, la conscience est en état de {teal}__s'émanciper du monde__{/teal} et de passer à la formation de la {teal}théorie « pure »{/teal}, théologie, philosophie, morale, etc.{teal} »{/teal}

    **La suite interdit de croire la théorie vraiment détachée.** {teal}« {/teal}Mais, même lorsque cette théorie […] {teal}entrent en contradiction avec les rapports existants{/teal}, cela ne peut se produire que du fait que les {teal}__rapports sociaux existants__{/teal} sont entrés en contradiction avec la {teal}__force productive existante__{/teal}{teal} »{/teal}. {coral}La théorie qui s'oppose au monde tient encore du monde son opposition{/coral}.

    **La théorie pure est la** {red}**forme accomplie du voilement**{/red}, parce qu'elle a sa possibilité dans l'abstraction idéologique qui sépare travail manuel et travail intellectuel. Son divorce d'avec la {blue}*praxis*{/blue} réelle ne la met pas hors du jeu : il la rapporte au mode de production de trois façons.

    | Rapport au mode de production | Figure |
    | elle le légitime | le commandement donné à ceux qui savent |
    | elle se marginalise en ce monde | Thalès l'astronome ridiculisé |
    | elle entre en conflit avec la domination | Socrate mis à mort |

    **Légitimer.** C'est, chez {sky}Aristote{/sky}, l'attribution du commandement à ceux qui savent, d'un savoir intellectuel s'entend.

    **Se marginaliser.** {sky}Thalès{/sky}, l'astronome, est raillé non seulement par les {yellow}servantes{/yellow}, mais par les {yellow}oligarques{/yellow}.

    **Entrer en conflit.** {sky}Socrate{/sky} est mis à mort pour avoir affirmé {green}la théorie comme puissance sociale{/green}, sur fond des conflits qui affectent alors la structure de la Cité : la {blue}*stasis*{/blue}, la guerre civile portée par l'antagonisme des riches et des pauvres.
  points:
  - id: verite2-l4-p1
    sentence: "__La forme accomplie du voilement__, née de la séparation de la théorie et de la réalité, est la **théorie ___**."
    answer: "pure"
    alt: []
