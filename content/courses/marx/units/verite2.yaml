- id: verite2-l7
  title: "Les économistes ont vu sans en croire leurs yeux"
  notes: |-
    **Marx** {red}**ne reproche pas**{/red} **aux économistes de ne pas voir le procès de travail** : il leur reproche de {amber}**ne pas en croire leurs yeux**{/amber}, de ne pas voir les conséquences de ce qu'ils ont eux-mêmes mis en évidence.

    **Ils ont à peu près tout vu** : les facteurs de production ({yellow}la terre{/yellow} avec ses minerais et ses énergies, {yellow}le capital{/yellow}, {yellow}le travail{/yellow}) ; le {green}travail comme fondement de la valeur{/green} ; le {green}surtravail{/green}, érigé en loi d'airain de l'économie ; la division internationale du travail ; les régulations convenables au capitalisme. Certains, comme {sky}Adam Smith{/sky}, ont admis qu'il fallait contenir la spéculation financière ; ils ont compris aussi qu'il fallait contenir les {yellow}coalitions d'ouvriers{/yellow}, les syndicats, pour ne pas fausser le marché du travail.

    **Leur discours contient deux motifs d'aveuglement**, dont la dissimulation est un {coral}impératif de système{/coral}, et qui tiennent tous deux à la propriété privée, celle du capital et celle du travail :
    - ils ne voient pas la {red}__spécificité de la propriété privée capitaliste__{/red} ;
    - ils ne voient pas l'évidence du {red}__caractère social du travail__{/red} dans le mode de production capitaliste.

    **Le premier point s'entend par deux cycles de la marchandise.**

    | Cycle | Ce qu'il figure |
    | M-A-M | vendre pour acheter |
    | A-M-A' | investir pour accroître la mise |

    **M-A-M** (marchandise, argent, marchandise) figure la condition d'un producteur qui peut acheter une marchandise parce qu'il en a vendu une autre. Ce cycle {pink}n'est pas capitaliste{/pink} : la monnaie n'y fait que {amber}médiatiser l'échange{/amber}, sans dynamique d'accroissement d'une mise de départ. Il règle l'expansion lente des {yellow}sociétés traditionnelles{/yellow}.

    **A-M-A'** (argent, marchandise, argent accru) règle l'{violet}accumulation{/violet} capitaliste : un capital initial achète de la marchandise et réalise un bénéfice en la revendant. {amber}__**À quelle condition ?**__{/amber} À la condition de {coral}ne rémunérer qu'une partie du temps de travail{/coral}, celle qui, établit Marx, suffit à {coral}reproduire la force de travail{/coral}. Or l'opération n'est bénéfique qu'à grande échelle : d'où la production en masse et le regroupement des artisans en {violet}manufacture{/violet}.
  points:
  - id: verite2-l7-p1
    sentence: "__Aux économistes, Marx ne reproche pas de ne pas voir le procès de travail__, mais de ne pas en croire leurs ___."
    answer: "yeux"
    alt: []
  - id: verite2-l7-p2
    sentence: "__Les économistes ont eux-mêmes vu__ que le travail est le fondement de la ___."
    answer: "valeur"
    alt: []
  - id: verite2-l7-p3
    sentence: "__Les économistes ont érigé en loi d'airain de l'économie__ le ___."
    answer: "surtravail"
    alt: []
