# Unité de texte (voir content/textes.md) : Marx, « Contribution à la critique de
# la philosophie du droit de Hegel. Introduction » (1844), §1 à §7, d'après la même
# traduction que n1844 (Annales franco-allemandes, Éditions sociales, GEME ; PDF
# Cairn fourni par l'utilisateur). Les italiques sont ceux de l'original ; appels de
# note, repères de page et astérisques de l'édition retirés. Sans commentaire écrit :
# les rappels reposent sur le texte lui-même, les notions sont définies en encadré à
# leur première apparition.

id: n1844b
title: "La critique de la religion (1844)"
subtitle: "Contribution à la critique de la philosophie du droit de Hegel, Introduction, §1 à §7"
icon: page
color: coral
intro: |-
  Ouverture de l'*Introduction* de 1844. La critique de la religion y est tenue pour achevée : Marx en rappelle le principe (c'est l'être humain qui fait la religion), le sens (la religion, soupir de la créature opprimée), et ce qu'elle appelle, la critique de la terre, du droit et de la politique.
lessons:
- id: n1844b-i1
  title: "Une critique de la religion qui sert de point de départ"
  notes: |-
    Ces sept paragraphes ouvrent l'*Introduction* à la *Contribution à la critique de la philosophie du droit de Hegel*, que {sky}Marx{/sky} écrit à Paris à la fin de 1843 pour l'unique numéro des *Annales franco-allemandes*, la revue qu'il fonde avec {sky}Ruge{/sky}. Le texte commence par un {amber}acquis{/amber} : {coral}la critique de la religion est pour l'essentiel terminée{/coral}. Ces paragraphes en rappellent le principe, en disent le sens, puis en tirent {coral}la tâche suivante : critiquer la terre{/coral}, c'est-à-dire le droit et la politique.

    **Le fil est le suivant : une fois la religion critiquée, on peut passer à ce qu'elle justifiait.** Marx montre d'abord que {violet}l'être humain fait la religion{/violet}, et que le monde qui la produit est un monde à l'envers (§3) ; puis que la religion exprime la misère réelle en l'apaisant (§4-5) ; puis que sa critique sert à agir (§6) ; enfin que la tâche passe du ciel à la terre (§7).

    | Mouvement | Lieu | Ce qui s'y joue |
    | poser que la critique de la religion est achevée et qu'elle est la présupposition de toute critique | §1-2 | Réfuter le plaidoyer céleste de l'erreur compromet son existence terrestre : l'être humain n'ira plus se chercher dans le ciel. |
    | établir que l'être humain fait la religion parce que le monde qui la produit est à l'envers | §3 | La religion est la conscience de soi d'un être humain qui ne s'est pas encore conquis lui-même, donc lutter contre elle, c'est lutter contre ce monde. |
    | dire ce qu'elle exprime et ce que sa critique exige | §4-5 | La religion exprime la misère réelle et en même temps l'apaise ; la supprimer, c'est exiger le bonheur effectif et donc critiquer la vallée de larmes. |
    | dire à quoi sert la critique de la religion | §6 | Elle arrache les fleurs imaginaires pour que l'être humain brise les chaînes et se tourne vers lui-même. |
    | en tirer la tâche suivante | §7 | Il reste à établir la vérité de l'ici-bas : critique du ciel en critique de la terre, de la religion en critique du droit, de la théologie en critique de la politique. |

    ! Ces paragraphes ne critiquent pas encore le droit ni la politique : ils expliquent pourquoi il faut passer à leur critique.
