id: n1844b
title: "La critique de la religion (1844)"
subtitle: "Contribution à la critique de la philosophie du droit de Hegel, Introduction, §1 à §7"
icon: page
color: coral
intro: |-
  Ouverture de l'*Introduction* de 1844. La critique de la religion y est tenue pour achevée : Marx en rappelle le principe (c'est l'être humain qui fait la religion), le sens (la religion, soupir de la créature opprimée), et ce qu'elle appelle, la critique de la terre, du droit et de la politique.
lessons:
- id: n1844b-p1
  title: "La critique de la religion est achevée et compromet l'existence séculière de l'erreur"
  passage:
    label: "§1-2"
    text: "En ce qui concerne l'Allemagne, la *critique de la religion* est pour l'essentiel terminée, et la critique de la religion est la présupposition de toute critique. L'existence *séculière* de l'erreur est compromise à partir du moment où son *oratio pro aris et focis céleste* a été réfutée. L'être humain qui, dans la réalité fantastique du ciel où il cherchait un être surhumain, n'a trouvé que le *reflet* de lui-même ne tendra plus à trouver seulement l'*apparence* de lui-même, le non-humain, là où il cherche sa vraie effectivité, au seul endroit où il peut la chercher."
  points: []
- id: n1844b-p2
  title: "C'est l'être humain qui fait la religion"
  passage:
    label: "§3"
    text: "Le fondement de la critique irréligieuse est le suivant : c'est l'être humain qui fait la religion, ce n'est pas la religion qui fait l'être humain. La religion est en effet la conscience de soi et le sentiment de soi de l'être humain qui ne s'est pas encore conquis lui-même, ou bien qui s'est déjà perdu à nouveau. Mais *l'être humain*, ce n'est pas une essence abstraite recroquevillée hors du monde. L'être humain, c'est *le monde de l'être humain*, l'État, la société. Cet État, cette société produisent la religion, une *conscience inversée du monde*, parce qu'elles sont un *monde à l'envers*. La religion est la théorie générale de ce monde, son compendium encyclopédique, sa logique présentée sous une forme populaire, son *point-d'honneur* spiritualiste, son enthousiasme, sa sanction morale, son complément solennel, le fondement général de sa consolation et de sa justification. Elle est l'*effectuation fantastique* de l'essence humaine, parce que l'*essence humaine* ne possède pas de vraie effectivité. Lutter contre la religion, c'est donc indirectement lutter contre *ce monde-là*, dont la religion est l'*arôme* spirituel."
  points: []
- id: n1844b-p3
  title: "La religion, opium du peuple, et la critique de la vallée de larmes"
  passage:
    label: "§4-5"
    text: "La misère *religieuse* est tout à la fois l'*expression* de la misère effective et la *protestation* contre la misère effective. La religion est le soupir de la créature oppressée, l'âme d'un monde sans cœur, de même qu'elle est l'esprit d'une situation désertée par l'esprit. Elle est l'*opium* du peuple. Supprimer la religion en tant que bonheur *illusoire* du peuple, c'est exiger son bonheur *effectif*. Exiger l'abandon des illusions que l'on entretient sur sa propre situation, c'est *exiger l'abandon d'une situation qui a besoin d'illusions*. La critique de la religion est donc en *germe* la critique de la vallée de larmes dont la religion est l'*auréole*."
  points: []
- id: n1844b-p4
  title: "Briser les chaînes et cueillir la fleur bien vivante"
  passage:
    label: "§6"
    text: "La critique a mis en pièces les fleurs imaginaires qui ornaient les chaînes, non pas pour que l'être humain porte des chaînes sinistres et dépourvues de fantaisie, mais pour qu'il brise les chaînes et cueille la fleur bien vivante. La critique de la religion désillusionne l'être humain afin qu'il pense, agisse, façonne sa réalité effective à la façon d'un être humain désillusionné, parvenu à la raison, afin qu'il gravite autour de lui-même, et par là autour de son soleil effectif. La religion n'est que le soleil illusoire qui gravite autour de l'être humain tant que ce dernier ne gravite pas autour de lui-même."
  points: []
- id: n1844b-p5
  title: "De la critique du ciel à la critique de la terre"
  passage:
    label: "§7"
    text: "Une fois disparu l'*au-delà de la vérité*, c'est donc la *tâche de l'histoire* que d'établir la *vérité de l'ici-bas*. Une fois démasquée cette auto-aliénation dans sa *figure sacrée*, c'est tout d'abord la *tâche de la philosophie*, qui est au service de l'histoire, que de démasquer l'auto-aliénation humaine dans ses *figures profanes*. La critique du ciel se change par là en critique de la terre, la *critique de la religion* en *critique du droit*, la *critique de la théologie* en *critique de la politique*."
  points: []
