- id: n1844b-p2
  title: "C'est l'être humain qui fait la religion"
  notes: |-
    **La religion n'est pas ce qui fait l'être humain : c'est l'être humain qui la fait, parce que le monde où il vit est un monde à l'envers.** La religion est {coral}la conscience de soi{/coral} d'un être humain {amber}qui ne s'est pas encore conquis lui-même{/amber}, ou qui s'est déjà reperdu. Mais cet être humain n'est pas {red}une essence abstraite hors du monde{/red} : c'est {coral}le monde de l'être humain, l'État, la société{/coral}.

    ? **Monde à l'envers, conscience inversée du monde** : le monde de l'État et de la société est « à l'envers » parce que l'être humain y est privé de sa vraie effectivité, comme le dit la fin du paragraphe, et il produit une conscience qui le représente elle aussi à l'envers : la religion.

    | | Ce que c'est | Rapport à la religion |
    | l'être humain | pas une essence abstraite hors du monde : le monde de l'être humain, l'État, la société | il la produit |
    | ce monde | un monde à l'envers | il en produit la conscience inversée |
    | la religion | la théorie générale de ce monde, son complément solennel, l'effectuation fantastique de l'essence humaine | l'arôme spirituel de ce monde |

    **La religion est la théorie générale de ce monde.** Marx énumère ce qu'elle lui apporte : un {violet}compendium encyclopédique{/violet} (un résumé complet), {violet}une logique sous forme populaire{/violet}, un point d'honneur spiritualiste, un enthousiasme, une sanction morale, {amber}un complément solennel{/amber}, et surtout {coral}le fondement général de sa consolation et de sa justification{/coral} : elle console de ce monde et le justifie.

    **Pourquoi l'appelle-t-il « effectuation fantastique de l'essence humaine » ?** Parce que {red}l'essence humaine ne possède pas de vraie effectivité{/red} dans ce monde : ce qu'il n'a pas dans la réalité, l'être humain se le donne en imagination, dans le ciel. D'où la conséquence : {coral}lutter contre la religion, c'est indirectement lutter contre ce monde-là{/coral}, dont elle est {amber}l'arôme spirituel{/amber}, c'est-à-dire l'émanation immatérielle par laquelle on le reconnaît.

    ! « L'être humain » n'est pas ici un individu isolé ni une essence abstraite : c'est le monde de l'être humain, et c'est pourquoi sa religion est une affaire de ce monde.
  passage:
    label: "§3"
    text: "Le fondement de la critique irréligieuse est le suivant : c'est l'être humain qui fait la religion, ce n'est pas la religion qui fait l'être humain. La religion est en effet la conscience de soi et le sentiment de soi de l'être humain qui ne s'est pas encore conquis lui-même, ou bien qui s'est déjà perdu à nouveau. Mais *l'être humain*, ce n'est pas une essence abstraite recroquevillée hors du monde. L'être humain, c'est *le monde de l'être humain*, l'État, la société. Cet État, cette société produisent la religion, une *conscience inversée du monde*, parce qu'elles sont un *monde à l'envers*. La religion est la théorie générale de ce monde, son compendium encyclopédique, sa logique présentée sous une forme populaire, son *point-d'honneur* spiritualiste, son enthousiasme, sa sanction morale, son complément solennel, le fondement général de sa consolation et de sa justification. Elle est l'*effectuation fantastique* de l'essence humaine, parce que l'*essence humaine* ne possède pas de vraie effectivité. Lutter contre la religion, c'est donc indirectement lutter contre *ce monde-là*, dont la religion est l'*arôme* spirituel."
