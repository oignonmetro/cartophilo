- id: n1844b-p5
  title: "De la critique du ciel à la critique de la terre"
  notes: |-
    **Une fois la religion critiquée, la tâche passe à ce qu'elle recouvrait : la vérité de l'ici-bas.** La {violet}tâche de l'histoire{/violet}, une fois disparu l'au-delà de la vérité, est d'{coral}établir la vérité de l'ici-bas{/coral}. Et la {violet}tâche de la philosophie{/violet}, qui est au service de l'histoire, est de démasquer l'auto-aliénation humaine dans ses figures profanes.

    ? **Auto-aliénation** : le fait que l'être humain se dépossède lui-même de son essence en la projetant hors de lui, dans le ciel. La religion en est la {amber}figure sacrée{/amber}. Le droit et la politique en sont, d'après la dernière phrase, des {amber}figures profanes{/amber}, c'est-à-dire terrestres.

    **La dernière phrase donne la série.** Chaque critique de la religion se change en une critique terrestre de même nature :

    | On critique | Pour passer à |
    | le ciel | la terre |
    | la religion | le droit |
    | la théologie | la politique |

    La critique de la religion n'est donc pas abandonnée : elle est {coral}la première étape{/coral} d'une critique qui descend vers les institutions. C'est ce que le §8 annonce : l'exposé qui suit se rapporte non à l'original, mais à {amber}une copie{/amber}, la philosophie allemande de l'État et du droit.

    ! La critique de la terre ne remplace pas celle du ciel : elle la suppose.
  passage:
    label: "§7"
    text: "Une fois disparu l'*au-delà de la vérité*, c'est donc la *tâche de l'histoire* que d'établir la *vérité de l'ici-bas*. Une fois démasquée cette auto-aliénation dans sa *figure sacrée*, c'est tout d'abord la *tâche de la philosophie*, qui est au service de l'histoire, que de démasquer l'auto-aliénation humaine dans ses *figures profanes*. La critique du ciel se change par là en critique de la terre, la *critique de la religion* en *critique du droit*, la *critique de la théologie* en *critique de la politique*."
