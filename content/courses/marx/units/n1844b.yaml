- id: n1844b-p1
  title: "La critique de la religion est achevée et compromet l'existence séculière de l'erreur"
  notes: |-
    **La critique de la religion est achevée, et c'est ce qui permet de s'en prendre à ce qu'elle protégeait : l'existence terrestre de l'erreur.** Marx distingue deux existences de {violet}l'erreur{/violet} : une existence {amber}céleste{/amber}, la religion, et une existence {amber}séculière{/amber}, le monde terrestre.

    ? **Oratio pro aris et focis** : expression latine, « discours pour les autels et les foyers », le plaidoyer de celui qui défend ce qu'il tient pour le plus sacré. Marx l'applique à la religion, {yellow}plaidoyer céleste{/yellow} de l'erreur.

    ? **Séculier** : du siècle, c'est-à-dire du monde terrestre, par opposition au ciel et à l'Église. L'existence séculière de l'erreur est son existence dans l'État et dans la société.

    Une fois le plaidoyer céleste {red}réfuté{/red}, {coral}l'existence séculière de l'erreur est compromise{/coral} : l'ordre terrestre ne peut plus se justifier en renvoyant au ciel, et c'est pourquoi la critique de la religion est {coral}la présupposition de toute critique{/coral}. Le §3 le précisera : la religion est « le fondement général de sa consolation et de sa justification ».

    **La seconde phrase dit ce que l'être humain a découvert.** Il cherchait un être surhumain dans le ciel et n'y a trouvé que {amber}le reflet de lui-même{/amber}. Il ne se contentera donc plus de trouver, là où il cherche sa vraie effectivité, {red}seulement l'apparence de lui-même, le non-humain{/red} : cette effectivité se cherche {coral}ici-bas{/coral}, le seul endroit où il peut la chercher.

    ! L'« erreur » n'est pas ici une simple idée fausse : c'est tout ce que la religion justifie, un ordre du monde, qui a une existence terrestre.
  passage:
    label: "§1-2"
    text: "En ce qui concerne l'Allemagne, la *critique de la religion* est pour l'essentiel terminée, et la critique de la religion est la présupposition de toute critique. L'existence *séculière* de l'erreur est compromise à partir du moment où son *oratio pro aris et focis céleste* a été réfutée. L'être humain qui, dans la réalité fantastique du ciel où il cherchait un être surhumain, n'a trouvé que le *reflet* de lui-même ne tendra plus à trouver seulement l'*apparence* de lui-même, le non-humain, là où il cherche sa vraie effectivité, au seul endroit où il peut la chercher."
