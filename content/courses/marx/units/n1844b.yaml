- id: n1844b-p4
  title: "Briser les chaînes et cueillir la fleur bien vivante"
  notes: |-
    **La critique de la religion n'est pas faite pour laisser l'être humain nu devant sa misère, mais pour qu'il agisse.** Le paragraphe dit la même chose par trois images.

    **Les chaînes et les fleurs.** Les {violet}chaînes{/violet} sont les rapports qui oppriment, la misère effective du §4 ; les {violet}fleurs imaginaires{/violet} qui les ornent sont les illusions religieuses, qui jouent le rôle de l'auréole du §5, une parure qui embellit la misère. La critique les arrache, {red}non pas pour que l'être humain porte des chaînes sinistres et dépourvues de fantaisie{/red}, mais {coral}pour qu'il brise les chaînes et cueille la fleur bien vivante{/coral}, le bonheur réel.

    **L'être humain désillusionné.** La critique le désillusionne {amber}afin qu'il pense, agisse, façonne sa réalité effective{/amber} comme un être humain {amber}parvenu à la raison{/amber} : elle est un {coral}moyen{/coral}, non une fin en soi.

    **Le soleil.** {violet}Gravite{/violet} dit tourner autour d'un centre. Tant que l'être humain ne tourne pas autour de lui-même, {yellow}la religion est le soleil illusoire{/yellow} autour duquel il tourne : il cherche son centre hors de lui. Quand il gravite autour de lui-même, il tourne autour de {coral}son soleil effectif{/coral}, c'est-à-dire de lui-même : l'être humain devient son propre centre.

    ! Marx ne dit pas qu'il faut priver les hommes de leurs consolations et les laisser sans rien : la critique arrache les fleurs pour qu'on brise les chaînes.
  passage:
    label: "§6"
    text: "La critique a mis en pièces les fleurs imaginaires qui ornaient les chaînes, non pas pour que l'être humain porte des chaînes sinistres et dépourvues de fantaisie, mais pour qu'il brise les chaînes et cueille la fleur bien vivante. La critique de la religion désillusionne l'être humain afin qu'il pense, agisse, façonne sa réalité effective à la façon d'un être humain désillusionné, parvenu à la raison, afin qu'il gravite autour de lui-même, et par là autour de son soleil effectif. La religion n'est que le soleil illusoire qui gravite autour de l'être humain tant que ce dernier ne gravite pas autour de lui-même."
