- id: n1844b-p3
  title: "La religion, opium du peuple, et la critique de la vallée de larmes"
  notes: |-
    **La religion n'est pas seulement une illusion : elle exprime une misère réelle, qu'elle apaise sans la supprimer, et c'est pourquoi la critiquer, c'est critiquer en germe cette misère.** Marx lui reconnaît deux faces : elle est {amber}l'expression{/amber} de la misère effective et {amber}la protestation{/amber} contre elle. Trois images le disent :

    | Image | Ce que Marx lui fait dire | Lecture |
    | le soupir de la créature oppressée | la religion est une plainte | elle dit la souffrance |
    | l'âme d'un monde sans cœur, l'esprit d'une situation désertée par l'esprit | elle est ce qui reste d'esprit dans un monde sans esprit | elle protège ce qui reste d'humain |
    | l'opium du peuple | elle apaise la douleur sans en ôter la cause | elle console sans guérir |

    ? **Opium** : stupéfiant qui calme la douleur sans guérir sa cause. L'appeler « opium du peuple », c'est dire que la religion apaise la misère sans la supprimer ; mais Marx l'appelle d'abord {amber}soupir{/amber}, donc plainte.

    **La critique de la religion exige donc plus que la suppression d'une illusion.** {coral}Supprimer la religion en tant que bonheur illusoire du peuple, c'est exiger son bonheur effectif{/coral}, et {coral}exiger l'abandon des illusions sur sa situation, c'est exiger l'abandon d'une situation qui a besoin d'illusions{/coral}. On ne retire pas la consolation en laissant la misère : on demande que la misère disparaisse, et la consolation avec elle.

    ? **Vallée de larmes** : expression de la langue religieuse pour la vie terrestre, lieu de souffrance où l'on attend la consolation d'un autre monde. L'**auréole** est le cercle lumineux dont on entoure la tête d'un saint : la religion est l'auréole de la vallée de larmes, elle la fait paraître sainte.

    La critique de la religion est ainsi {coral}en germe la critique de la vallée de larmes{/coral} : le §2 disait que l'erreur avait une existence terrestre, le §5 dit que c'est cette misère-là qu'il faut critiquer.

    ! L'« opium du peuple » n'est pas ici une injure : Marx écrit d'abord que la religion est un soupir, une plainte avant d'être un calmant.
  passage:
    label: "§4-5"
    text: "La misère *religieuse* est tout à la fois l'*expression* de la misère effective et la *protestation* contre la misère effective. La religion est le soupir de la créature oppressée, l'âme d'un monde sans cœur, de même qu'elle est l'esprit d'une situation désertée par l'esprit. Elle est l'*opium* du peuple. Supprimer la religion en tant que bonheur *illusoire* du peuple, c'est exiger son bonheur *effectif*. Exiger l'abandon des illusions que l'on entretient sur sa propre situation, c'est *exiger l'abandon d'une situation qui a besoin d'illusions*. La critique de la religion est donc en *germe* la critique de la vallée de larmes dont la religion est l'*auréole*."
