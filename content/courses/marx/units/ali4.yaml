lessons:
- id: ali4-l1
  title: "L'aliénation n'est pas la chosification"
  notes: |-
    **L'aliénation que décrit Marx dans les** *Manuscrits de 1844* **n'est pas une** {red}**chosification**{/red}**, et rien dans ce texte n'autorise à y lire la** {red}**réification**{/red}**.**

    **Un glissement que le texte ne fait pas.** Marx emploie {blue}*Vergegenständlichung*{/blue}, l'{violet}objectivation{/violet}. En faisant glisser, sans s'en apercevoir, l'objectivation vers la chosification, {blue}*Verdinglichung*{/blue}, ou vers la réification, {blue}*Versachlichung*{/blue}, on {red}plaque sur le texte une problématique extérieure à la sienne{/red} : on finit par se persuader de la voir à l'œuvre alors qu'elle n'y est pas. Ces deux termes sont absents du passage sur le travail aliéné ; la lecture qui les y met empêche de le lire correctement.

    **Ce que la réification veut dire chez Marx, plus tard.** La problématique existe chez Marx, mais dans {sky}*Le Capital*{/sky}, à la fin du chapitre 1 du livre I, sur le {violet}fétichisme de la marchandise{/violet}. Elle ne désigne pas {red}la réification de la subjectivité{/red}, le devenir chose d'un sujet. Elle désigne {green}le fait que des rapports entre des personnes se présentent comme des rapports entre des choses{/green}, phénomène indissociable de son contraire : des __rapports entre des choses (l'échange de marchandises)__ se donnent pour {amber}des rapports sociaux entre des personnes{/amber}. Les personnes ne cessent pas d'être des personnes ; {coral}ce sont leurs rapports qui sont chosifiés{/coral}, niés en tant que rapports sociaux. Ce n'est pas la transformation de sujets en choses.

    **Une lecture rétrospective.** Cette problématique est plus tardive que Marx : c'est parce qu'on la connaît qu'on la plaque en retour sur son texte. Elle se formule d'abord chez un non-marxiste, {sky}Georg Simmel{/sky}, l'un des premiers sociologues allemands, dans sa {sky}*Philosophie de l'argent*{/sky}. Elle est reprise par son élève, le philosophe marxiste {sky}Georg Lukács{/sky}, dans {sky}*Histoire et conscience de classe*{/sky} (début des années 1920), qui a longtemps cru y suivre un héritage de Marx. À la publication des *Manuscrits de 1844*, au début des années 1930, il constate que la réification n'y est pas ; il a l'honnêteté de le dire dans le chapitre qu'il consacre à Marx à la fin de son {sky}*Jeune Hegel*{/sky}, où il explique en quoi consiste l'aliénation chez Marx.

    | Mot allemand | Sens | Dans le passage sur le travail aliéné |
    | *Vergegenständlichung* | objectivation | employé |
    | *Verdinglichung* | chosification | absent |
    | *Versachlichung* | réification | absent |

    ! La réification est un thème précieux de la critique du capitalisme, mais ce n'est pas celui des *Manuscrits* : y lire la chosification d'un sujet, c'est y lire ce qui n'y est pas.
