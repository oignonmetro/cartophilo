- id: ali4-l2
  title: "Perdre les objets de la vie et ceux du travail"
  notes: |-
    **Ce que le travailleur aliéné perd est bien plus que son produit : ce sont les objets dont il vit et ceux dont il travaille, et jusqu'au travail lui-même, qui devient un objet dont il est séparé.**

    {teal}« {/teal}L'objectivation se révèle à tel point être la perte de l'objet que l'ouvrier est {teal}__spolié non seulement des objets les plus indispensables à la vie, mais encore des objets du travail__ »{/teal} (*Manuscrits de 1844*, premier manuscrit, p. XXII).

    **La perte de l'objet est plus grave que la perte du produit.** Que le produit soit approprié par un autre que celui qui l'a produit est un aspect essentiel, mais la perte d'objectivité subie par le travailleur aliéné est {coral}bien plus radicale{/coral}. Il perd deux sortes d'objets.
    - {amber}__Les objets nécessaires à la vie__{/amber} : ceux dont dépend la satisfaction des {yellow}besoins vitaux{/yellow} (se nourrir, se vêtir, se loger), sans lesquels on ne peut pas persévérer dans l'être. Le travailleur moderne n'y a {yellow}plus d'accès direct : il n'y accède qu'en travaillant{/yellow} ;
    - {amber}__Les objets du travail__{/amber} : ceux que requiert l'activité productive, {violet}la matière{/violet} à travailler et {violet}les outils{/violet}. Il n'a plus d'accès direct à {yellow}la matière, qu'on doit lui présenter{/yellow} ; les {yellow}outils ne sont plus les siens{/yellow}, quelqu'un d'autre en est propriétaire.

    **Le** {violet}**travail**{/violet} **lui-même devient un objet dont le travailleur est séparé.** {teal}« {/teal}Oui, {teal}__le travail lui-même devient un objet__ dont il ne peut s'emparer qu'en faisant le plus grand effort et avec les interruptions les plus irrégulières{teal} »{/teal} (*ibid*.). « S'emparer » rend {violet}*sich bemächtigen*{/violet}, littéralement mettre sous son pouvoir. Les « interruptions les plus irrégulières » sont les passages du travail à l'absence de travail. Il faut éviter un contresens massif : {red}que le travail devienne objet n'est pas ce qui est aliénant{/red}. Ce qui l'est, c'est qu'on soit {red}séparé de cet objet devenu essentiel{/red}.

    **Pourquoi le travail est l'objet essentiel.** Sans travail, pas de nourriture, de vêtements ni de logement, mais pas non plus d'accès aux outils et aux conditions objectives du travail lui-même. {coral}Accéder au travail est donc devenu la condition de l'accès aux objets de la vie et aux objets du travail{/coral} : c'est ce dont il faut s'emparer avant toute chose, puisqu'il ouvre l'accès à tout le reste. Or le travail est {violet}l'activité humaine essentielle{/violet}, ce sous la forme de quoi se manifeste l'essence humaine : il devrait y avoir {green}continuité, et même coextension{/green}, entre ce que nous sommes, êtres objectifs et naturels, et ce que nous faisons. Il y a aliénation parce que le travail est devenu un objet extérieur dont nous sommes séparés.

    | Objets perdus | Ce que c'est |
    | Objets de la vie | nourriture, vêtement, logement |
    | Objets du travail | matière à travailler, outils |
    | Le travail lui-même | condition d'accès aux deux autres |

    ! La perte de l'objet ne se réduit pas à l'expropriation du produit : elle prive aussi des moyens de vivre et des moyens de travailler.
