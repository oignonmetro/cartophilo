- id: ali4-l3
  title: "Être séparé de l'objectivité de son propre être"
  notes: |-
    **Pour être privé de tout cela, le travailleur doit d'abord avoir été réduit à n'être que le porteur d'une capacité de travail purement subjective ;** {coral}__**ce dont il est alors séparé, c'est de l'objectivité de son propre être**__{/coral} **: voilà le cœur de** {coral}__**l'aliénation**__{/coral}**.**

    **Ce que suppose la séparation.** Ne pouvoir accéder au travail, objet essentiel, qu'au prix des plus grands efforts suppose que les individus aient été au préalable réduits à n'être rien d'autre que les {violet}porteurs d'une pure capacité de travail{/violet}, {amber}purement subjective{/amber} puisqu'elle est séparée du travail réel comme de l'objet qu'elle convoite pour passer de la puissance à l'acte. Ce qui est aliénant, c'est précisément d'être réduit à cet état de support d'une capacité abstraite, séparée de tous les moyens de s'actualiser.

    **Ce dont il est privé : l'objectivité de son propre être.** Le travailleur aliéné est séparé de l'objectivité en général, mais plus profondément {coral}de l'objectivité de son propre être{/coral}. Les êtres humains sont, pour Marx, des {violet}êtres objectifs{/violet}, c'est-à-dire des êtres naturels, {amber}parties de la nature{/amber} parmi une infinité d'autres, comme les autres vivants. L'aliénation les prive de cette appartenance : transformé en {red}support subjectif d'une activité pure{/red}, séparé de tout moyen d'objectivation, __le travailleur est séparé de la nature__. Il devient un sujet séparé de son objet, abstrait de ce à quoi il appartient essentiellement. Cela se joue d'abord dans l'expérience du travail moderne, tel qu'il se réalise en plein XIXe siècle : c'est l'invention du {violet}travail salarié{/violet}, que Marx n'appelle pas encore ainsi en 1844.

    **Pourquoi cette perte n'est aliénante que pour un certain type d'être.** La perte de l'objet et de l'objectivité ne peut être aliénante que pour des êtres pour lesquels {amber}l'objectivité est essentielle{/amber} ; si elle ne l'était pas, la perdre ne serait pas aliénant. C'est pourquoi {coral}Marx doit d'abord envisager les travailleurs comme des êtres objectifs{/coral}. Les hommes ne sont pas des sujets en eux-mêmes, initialement : ils le deviennent du fait de l'aliénation. Ils sont, essentiellement, non des sujets auxquels la nature ferait face comme objet, mais des êtres eux-mêmes objectifs, existant en acte comme parties de la nature : des {blue}*Naturwesen*{/blue}, des {violet}êtres de la nature{/violet}. C'est son point de départ, qui s'impose à tout penseur qui prend au sérieux le {sky}tournant naturaliste{/sky} imprimé à la philosophie par {sky}Feuerbach{/sky}, et que Marx entend radicaliser. C'est sur cette base qu'on peut ensuite analyser l'aliénation.

    | Ce que le travailleur est | Ce que l'aliénation en fait |
    | un être objectif, partie de la nature | un support subjectif d'une activité pure |
    | membre d'un tout objectif | un « empire dans un empire » |

    ! Ce n'est pas parce qu'il serait un sujet qu'on peut dire de l'homme qu'il est aliéné : c'est parce qu'il est un être objectif que la perte de l'objectivité l'aliène.
