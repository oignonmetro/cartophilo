lessons:
- id: verite1-l1
  title: "La vérité est un combat"
  notes: |-
    **Dire le vrai relève d'une** {violet}**poétique du vrai**{/violet} **: le discours de vérité dépend d'une** {amber}**production**{/amber} **qui a le caractère d'un art, et dont le** {coral}**travail**{/coral} **est le sol.** Cet art inclut l'{amber}artifice{/amber}, comme {amber}ruse et calcul{/amber}.

    **Pourquoi faut-il un art pour dire le vrai ?** Parce que le __langage__ porte en lui {coral}la double possibilité d'éclairer et d'égarer, de dévoiler et de voiler{/coral}. Et il en va ainsi parce que la __chose__ elle-même, l'affaire dont il est question dans le discours, {coral}abrite la double possibilité de se manifester et de se dissimuler{/coral} : {amber}la chose ne s'ouvre pas sans se fermer, elle résiste{/amber}.

    **La poétique du vrai a donc trois pôles.**

    | Pôle | Du côté de | Ce qui s'y joue |
    | la persuasion ({blue}*pistis*{/blue}) | la pensée | éclairer ou égarer |
    | la résistance | la chose | s'ouvrir sans cesser de se fermer |
    | le calcul rhétorique | le langage | des stratagèmes |

    Les stratagèmes du langage vont dans les deux sens : {pink}dissimuler{/pink}, mais aussi {green}détecter la dissimulation{/green}, dire le vrai, l'accréditer et le légitimer. La logique s'est conquise contre les réfutations des {sky}sophistes{/sky} ; la poétique du vrai retrouve ces stratagèmes, qui, à leur plus haut point d'efficacité, disent crûment leur vérité : {red}la quête de la puissance pour la puissance{/red}, que {sky}Calliclès{/sky} dévoile et revendique. **La vérité est donc un** {coral}**combat**{/coral}**, et sa « production », l'art de diriger ce combat et d'en assurer la victoire.**

    **Où situer les enjeux de ce combat ?** Dans l'{violet}existence{/violet} même, entendue comme {amber}ouverture des modes d'apparaître de l'étant{/amber}, c'est-à-dire comme {violet}être-au-monde{/violet}, relation des hommes aux choses : le vrai ne serait l'enjeu d'aucune lutte si {coral}tout le rapport aux choses ne s'ouvrait sous la modalité de la résistance{/coral}, qui est le trait même du __produire__.

    ? Étant : tout ce qui est, chose, outil, vivant ou homme, considéré dans la manière dont il est et dont il apparaît ; ce qui s'y rapporte est dit ontologique.

    **Les choses se donnent d'abord comme** {violet}**choses à faire**{/violet}, dans des structures qui incluent des {yellow}outils{/yellow} et des {yellow}tâches{/yellow}. Ce qui est à faire s'ouvre comme un {green}possible{/green}, et le faire se déploie comme une {green}puissance{/green} ; mais l'affaire s'impose aussi comme une {red}__nécessité__{/red}, celle de la {amber}production de l'existence{/amber} : l'existence a à se soutenir dans l'être. Cela se dit : {coral}les hommes travaillent, ils se font hommes dans un rapport producteur à l'étant{/coral}.

    **Le travail se déploie comme** {violet}**peine**{/violet}, exposition à la résistance des choses, mais aussi comme effort, force et puissance, à travers des {amber}actes de fabrication{/amber} qui transforment le donné et le rapport au donné. Il est le {coral}sol de tout art de dire le vrai, théorie comprise{/coral}. Reste à comprendre comment ce sol est lui-même pris dans le jeu du voilement et du dévoilement : __reconnu__ dans une vue théorique, ou __évité__ dans une stratégie idéologique. **Là commence Marx.**
