- id: verite1-l7
  title: "La conscience, langage de la vie réelle"
  notes: |-
    **Ce que Marx nomme** {violet}**conscience**{/violet}**, ce sont les modes de dévoilement du monde, qui se révèle chaque fois comme un monde déterminé, avec ses conditions historiques.** La conscience est l'{amber}être-là de l'activité{/amber} : le commerce avec les choses, médiatisé par le commerce des hommes entre eux, que la division sociale du travail organise. La {blue}*praxis*{/blue} productive s'explicite, c'est-à-dire {coral}parle{/coral}, à travers des actes de conscience et leurs contenus, des représentations aux affects (les désirs, les passions) où s'esquisse déjà une compréhension du monde.

    **La conscience est d'abord mêlée à l'activité.** {sky}*L'Idéologie allemande*{/sky}, I : {teal}« {/teal}La {teal}production des idées{/teal}, des représentations et de la conscience est d'abord {teal}__directement et intimement mêlée__{/teal} à l'{teal}activité matérielle{/teal} et au {teal}commerce matériel{/teal} des hommes, elle est le {teal}__langage de la vie réelle__{/teal}.{teal} »{/teal} Un langage ne double pas du dehors ce qu'il dit : les idées sont la vie qui s'énonce.

    **Le langage donne le modèle.** {teal}« {/teal}Le langage est {teal}aussi vieux que la conscience{/teal} : le langage est la {teal}__conscience réelle, pratique__{/teal}, {teal}existant aussi pour d'autres hommes{/teal}, existant donc alors seulement pour moi-même aussi et, tout comme la conscience, le langage n'apparaît qu'avec le {teal}besoin{/teal}, la {teal}__nécessité du commerce avec d'autres hommes__{/teal}.{teal} »{/teal} L'ordre est remarquable : la conscience {amber}existe pour moi parce qu'elle existe d'abord pour autrui{/amber}. Je ne commence pas par un for intérieur que je communiquerais ensuite.

    **La vie qui détermine la conscience.** {teal}« {/teal}Ce n'est pas la {teal}conscience{/teal} qui détermine la vie, mais la {teal}__vie__{/teal} qui détermine la conscience.{teal} »{/teal} Cette vie n'est {red}pas un fait biologique muet{/red} : c'est l'{green}existence qui s'articule en une compréhension{/green}, elle-même explicitée en représentations, en structures symboliques, en discours.

    **La conscience est un** {amber}**produit social**{/amber}**, en un double sens** : elle est __produite__ socialement, et la __société__, comme division du travail en mouvement, __se rapporte à elle-même__ comme conscience.

    **Pourquoi passer de la conscience à la vérité ?** Parce que « conscience » nomme le plan où le {violet}voilement{/violet} et le {violet}dévoilement{/violet} sont {coral}co-originaires{/coral} : aucun des deux ne précède l'autre, et l'art de dire le vrai y joue entre des stratagèmes d'égarement et une production d'intelligibilité. Ses deux modalités sont {pink}__l'idéologie__{/pink} et {green}__la théorie__{/green}. Aussi une forme sociale {red}ne produit pas d'elle-même une conscience adéquatement remplie par sa réalité{/red}, ni un discours de vérité qui mettrait en évidence les structures de son mode de production.
  points:
