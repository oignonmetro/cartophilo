- id: verite1-l5
  title: "Le mode de production : quatre traits"
  notes: |-
    **Le travail ne peut pas valoir comme une généralité : il faut le concevoir comme un** {violet}**mode de production**{/violet}**.** Parler du travail en général, ce serait {red}le traiter comme une représentation{/red}, une idée qu'on contemple, et retomber dans le surplomb qu'on reprochait aux philosophes.

    **La production de l'existence est une dynamique qui conjoint** {amber}**quatre traits essentiels**{/amber}, tirés par induction des comportements humains, qui sont autant d'événements du dévoilement.

    | Trait | Ce que font les hommes dans le travail |
    | satisfaire les besoins | boire, manger, se vêtir, se loger |
    | renouveler les besoins | en faire naître de nouveaux |
    | former la famille | la reproduction impose des groupes |
    | étendre la division sociale | des formes sociales coexistent |

    **Satisfaire ses besoins.** Boire, manger, se vêtir, se loger, mais aussi {yellow}fabriquer des outils{/yellow}.

    **Renouveler ses besoins.** C'est {coral}un fait et une nécessité{/coral} : le besoin humain {red}n'est pas borné par l'instinct biologique{/red}, les {amber}facultés se développent{/amber}, les {amber}hommes se reproduisent{/amber}, et la pression du nombre entraîne celle des besoins. {sky}*L'Idéologie allemande*{/sky} dit de la satisfaction des premiers besoins qu'elle en pousse à de nouveaux, et que {teal}« {/teal}cette {teal}production de nouveaux besoins{/teal} est le {teal}__premier fait historique__{/teal}{teal} »{/teal} : l'animal recommence, l'homme a une histoire parce que ce qu'il satisfait change ce qu'il lui faut.

    **La famille et la société.** La reproduction impose des groupements qui constituent {amber}la première forme sociale, la famille{/amber}. Dès lors le travail se lie à la socialité : la {violet}division sociale du travail{/violet} est {coral}un trait d'essence{/coral}, et non un accident survenu à un travail d'abord solitaire.

    **L'extension du travail social.** La division du travail prescrit une {amber}variété de formes sociales{/amber} : les familles ont à coexister sous la modalité de cette division. Il en résulte que {coral}travail et société, division du travail et rapports de pouvoir s'impliquent nécessairement{/coral}.

    ! Les quatre traits ne sont pas quatre époques qui se succéderaient : ils jouent ensemble dans tout mode de production.
