- id: verite1-l4
  title: "La praxis productive et l'archi-fait du travail"
  notes: |-
    **Dire que l'homme produit son existence entraîne deux conséquences : il n'y a plus d'action séparée de la production, et** {coral}**le travail porte en lui toute possibilité de dévoiler les choses**{/coral}**.**

    **Première conséquence : la distinction aristotélicienne de la** {blue}***poièsis***{/blue} **et de la** {blue}***praxis***{/blue} **est dépassée.** {sky}Aristote{/sky} sépare la __production__, qui vise une œuvre extérieure à elle ({yellow}bâtir une maison{/yellow}), et l'__action__, qui a sa fin en elle-même et forme celui qui agit. Or l'existence humaine se donne forme {amber}dans les opérations mêmes du travail{/amber} : elle y est donc {violet}*praxis*{/violet}, action formatrice de soi ; et cette *praxis*, inséparable du travail, est {violet}productive{/violet}. D'où la notion de {violet}**praxis productive**{/violet}.

    **Il s'ensuit, comme une pierre d'attente, que** {coral}**tout discours de vérité se constitue, s'enlève sur le sol d'une praxis productive**{/coral}.

    **Seconde conséquence : le travail se rapporte à la nature comme telle.** Pour fabriquer un {yellow}outil{/yellow}, il faut qu'un donné qui n'a pas encore été fabriqué, le {violet}pré-donné{/violet}, apparaisse comme {amber}utilisable{/amber}. Et dans cet utilisable apparaît le __partage__ entre des {pink}états de choses naturels{/pink}, pré-techniques, et des {green}choses fabriquées{/green} : la fabrique d'outils suppose l'utilisabilité d'un pré-donné non fabriqué. Qui taille une pierre la distingue, par le fait même, de la hache qu'elle sera.

    **Le premier dévoilement des choses est donc laborieux.** À travers les gestes de la production, l'effort et les projets de transformation, l'étant prend figure d'abord sur un {violet}mode pré-ontologique{/violet}, qui précède toute théorie de ce que sont les choses et {amber}abrite la possibilité de toutes les explicitations théoriques{/amber}. Avec elles viennent, comme leurs corrélats, tous les {violet}comportements dévoilants{/violet} : {yellow}production, action, théorie{/yellow}.

    **L'**{violet}**archi-fait ontologique du travail**{/violet}**.** Un fait premier, antérieur à tous les autres parce qu'il les rend possibles : dans la langue de la plus haute spéculation, le travail contient {amber}formellement et éminemment{/amber} toute possibilité de {violet}dévoilement{/violet}, de {violet}véri-diction{/violet} (dire le vrai) et de stratégie rhétorique.

    ? Formellement et éminemment : dans la langue scolastique, une cause contient son effet formellement quand elle le possède sous la même forme, éminemment quand elle le possède sous une forme supérieure.

    **D'où le retour des stratagèmes.** Parce que tout comportement qui dévoile a le caractère du travail, d'un intérêt à la fois laborieux et productif, il est {coral}__nécessaire__, qu'on le reconnaisse ou qu'on l'oublie, qu'une stratégie rhétorique soit impliquée dans toutes les formes du dire vrai{/coral}.

    ! L'archi-fait n'est pas une cause matérielle qui expliquerait mécaniquement les idées : c'est l'ouverture première aux choses, dont la théorie elle-même est une modalité.
