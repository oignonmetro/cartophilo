- id: verite1-l6
  title: "Les modes de production et leur histoire"
  notes: |-
    **Le mode de production est à comprendre dans son** {amber}**historicité**{/amber} **: les contraintes de la division du travail changent d'une société à l'autre.** Des sociétés de {yellow}chasseurs-cueilleurs{/yellow} et des sociétés d'{yellow}agriculteurs{/yellow} ne connaissent pas les mêmes conflits ni les mêmes enjeux, les mêmes règles d'arbitrage et de répartition, les mêmes conditions pour attribuer la puissance ou pour la reconnaître comme pouvoir institué.

    **Une forme sociale, comme mode de production, coordonne deux choses.**

    | Terme | Ce qu'il comprend |
    | les rapports de production | la propriété des outils, le pouvoir par eux |
    | les forces productives | les compétences au travail et les outils |

    Le développement des {violet}forces productives{/violet} se lit dans la {amber}complexité et la productivité des systèmes d'outils{/amber}.

    **Quelques coupes d'essence dessinent les grands profils**, communisme et despotisme archaïques (qui ne reviennent pas au même), puis :
    - la {violet}féodalité{/violet} : l'exploitation du travail y est dominée par la {coral}conjonction des fonctions de la guerre et de la souveraineté{/coral} ;
    - le {violet}mode de production capitaliste{/violet} : {coral}le commerce des marchandises y domine l'exercice de la guerre et de la souveraineté{/coral}, sous des conditions définies par la {amber}propriété privée des moyens de production et d'échange{/amber}, la libre concurrence, la circulation et la spéculation monétaires comme sources de la richesse marchande.

    **Une formule en donne la frappe brutale** ({sky}*Misère de la philosophie*{/sky}, 1847) : {teal}« {/teal}Le {teal}__moulin à bras__{/teal} vous donnera la société avec le {teal}suzerain{/teal} ; le {teal}__moulin à vapeur__{/teal}, la société avec le {teal}capitaliste industriel{/teal}.{teal} »{/teal} L'image de l'outil vaut pour tout un mode de production : à tel degré des forces productives répond tel rapport de domination.

    **Chaque mode de production produit aussi ses modes de conscience et ses rhétoriques.** La féodalité et le capitalisme ne font pas seulement travailler autrement : ils font {coral}penser et parler autrement{/coral}.

    ! La formule du moulin ne dit pas qu'une machine fabrique à elle seule une société : forces productives et rapports de production sont coordonnés dans un même mode de production.
