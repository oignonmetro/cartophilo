- id: verite1-l8
  title: "Classes, communisme et lutte dans la théorie"
  notes: |-
    **Le travail ne peut dévoiler sa vérité dans des formes sociales divisées en** {violet}**classes**{/violet} **: la lutte qui les oppose se rejoue donc dans la théorie elle-même.** Dans le monde des hommes, le travail satisfait les besoins de la vie humaine ; toute la question est : {amber}__**les besoins de qui ?**__{/amber}

    | Mode | Le labeur satisfait d'abord les besoins | Ce qui est mis en valeur |
    | féodal | des guerriers | la sainteté de la guerre |
    | capitaliste | des marchands | la négociation |

    **Sous l'ordre féodal**, le labeur de ceux qui cultivent et fabriquent satisfait prioritairement les besoins des {violet}guerriers{/violet} et les enrichit. **Sous le capitalisme**, le labeur des mêmes satisfait prioritairement les besoins des {violet}marchands{/violet}, qui investissent des capitaux dans {amber}l'achat et la vente de la force de travail{/amber} pour produire et échanger des marchandises.

    **Dominer demande de se justifier.** Toute forme sociale __s'institue__, donc {coral}légitime ses rapports de pouvoir{/coral} : la domination guerrière suppose qu'on tienne la guerre pour sainte, la domination marchande qu'on tienne la négociation pour la source de {amber}toute légitimité et de toute valeur{/amber}. Mais les guerriers ont besoin d'argent, les marchands d'armes : {red}toute forme sociale développe en son sein les alliances qui menacent de la déstabiliser{/red}.

    **La condition de la vérité du travail.** Il ne peut la dévoiler là où une division de classe sépare {pink}__ceux qui travaillent__{/pink} de {red}__ceux qui vivent en exploitant le travail des autres__{/red}. La vie se rapporte et s'accorde à elle-même comme {violet}praxis productive auto-instituée{/violet} quand deux conditions sont réunies : le travail {green}satisfait le besoin de ceux qui travaillent{/green}, et sa forme sociale est {green}instituée par eux{/green}.

    **Marx nomme** {violet}**communisme**{/violet} **la forme sociale où le travail est l'**{coral}**affaire commune**{/coral}, en qualité d'activité auto-instituée de satisfaction des besoins.

    **La lutte des classes ne reste pas à la porte du savoir.** L'antagonisme des positions dans la production {coral}s'explicite dans l'ordre même de la théorie{/coral} : il y devient {amber}antagonisme de la théorie et de l'idéologie{/amber}, les deux modes {amber}co-originaires{/amber} du dévoilement et du voilement. Le combat pour la vérité, dont on partait, est ce combat-là.

    ! La lutte des classes dans la théorie n'oppose pas des savants riches à des savants pauvres : elle oppose deux manières de se rapporter au travail, le reconnaître ou le recouvrir.
  points:
