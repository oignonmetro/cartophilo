- id: verite1-l2
  title: "Les hommes travaillent, et vous l'oubliez"
  notes: |-
    **Le geste philosophique de Marx se rassemble en une interpellation qu'on peut lui prêter, fictivement : les hommes travaillent, et** {red}**vous l'oubliez**{/red}**, vous vous ingéniez à l'oublier.** Le travail n'est pas inconnu : il est {coral}activement recouvert{/coral}, et chacun, depuis sa position, y trouve son compte.

    **Qui est ce « vous » ?**

    | Qui | Son rapport au travail |
    | les pauvres | travaillent, craignent demain, se soumettent |
    | les riches | exploitent, et invoquent le combat de la vie |
    | les rhéteurs | arbitrent entre pauvres et riches |
    | les gouvernants | rusent entre le discours et la force |
    | les prêtres | tendent les écrans de fumée du mystère |

    Les riches {pink}font croire, et se font croire{/pink}, qu'il faut travailler parce que la vie est un {red}combat{/red} où les meilleurs gagnent et font travailler les autres à leur profit.

    **Ce que ce « vous » cache, et se cache.** Les hommes, {coral}parce qu'ils travaillent, sont responsables de leur condition{/coral} : elle {amber}dépend d'eux{/amber}, ils n'ont pas le choix de se soustraire à cette responsabilité, et ils ont à la reconnaître comme leur affaire. Un destin ou un mystère les en dispenserait ; le travail l'interdit, puisque ce qu'ils subissent est ce qu'ils produisent.

    **Les philosophes sont visés eux aussi.** Chercheurs de vérité, ils en instituent le critère depuis une {red}__position de surplomb__{/red} par rapport aux lignes du combat : l'{violet}attitude théorétique{/violet}, qui {amber}met hors circuit tout intérêt pratique{/amber}, et d'abord l'intérêt lié à la production. Ils se font croire que le vrai est l'objet d'une pensée qui se le propose comme prédicat d'un jugement.

    **Ce qu'ils ne voient pas : le** {coral}**travail porte tous les modes du dévoilement**{/coral}. Les hommes jugent du vrai __en tant qu'ils travaillent__. Les stratégies pour dire, juger, démontrer, formaliser ou fonder le vrai explicitent toutes le travail, {amber}jusqu'au geste de la logique transcendantale{/amber}, la logique qui prétend dégager les conditions de toute connaissance indépendamment de l'expérience.

    **Même reconnaître la technique ne suffit pas.** Avec {sky}Aristote{/sky}, les philosophes accordent que la production et la technique sont {violet}des modes du dévoilement{/violet} ; mais avec le même Aristote, ils méconnaissent que {coral}tout énoncé engage une position dans l'ordre de la production{/coral}. La technique n'est pas un mode parmi d'autres, à côté de la théorie : on ne pense et on ne parle jamais que {amber}depuis les conditions de l'existence laborieuse{/amber}.

    **Tout énoncé se profère depuis le milieu de l'étant**, jamais depuis un dehors : le travail est cet {violet}intérêt fondamental{/violet}, au sens du latin {blue}*inter-esse*{/blue}, « être au milieu de », qui s'explicite dans toutes les modalités du discours.

    ! Marx ne dit pas que la vérité n'est qu'un intérêt déguisé : il dit qu'aucun discours de vérité ne parle depuis un lieu sans intérêt, et que le premier intérêt est celui d'une existence qui doit produire.
