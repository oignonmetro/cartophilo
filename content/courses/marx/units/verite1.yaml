- id: verite1-l3
  title: "Partir de la vie : l'homme produit ses moyens d'existence"
  notes: |-
    **Contre les lectures idéalistes de l'histoire, Marx part du plus immédiat et du plus simple : la façon dont les hommes** {coral}**vivent**{/coral}**.** {sky}*L'Idéologie allemande*{/sky} (1845-1846) polémique contre des interprétations qui renvoient l'histoire humaine aux {pink}représentations{/pink} des hommes, ou même, sur un mode spéculatif, à l'{red}efficace de l'Idée{/red} dans l'histoire, et qui voient les pratiques et les usages comme des {pink}œuvres de l'esprit{/pink}.

    **La réponse prend l'adversaire sur sa propre prémisse.** Vous vivez parmi les fantômes : s'il y a une histoire, c'est celle des {amber}hommes{/amber}, vous l'accordez. Certes ils parlent et pensent, mais {coral}en tant qu'ils vivent{/coral}. Il faut donc demander d'abord : {amber}__**comment un homme vit-il ?**__{/amber}, et comment vivent les hommes, puisqu'une histoire est toujours celle de plus d'un.

    **La réponse se voit, par une induction.** On part de ce qu'on sait, en {yellow}ethnologie{/yellow} et en {yellow}éthologie{/yellow}, et l'on pratique l'induction au sens d'{sky}Aristote{/sky} : non la collection de cas, mais la saisie de {amber}la chose même à travers la donnée en personne des choses{/amber}.

    - {pink}__L'animal__{/pink} vit d'opérations {red}qu'il ne choisit pas{/red} ; il est dirigé sur les choses sur un mode instinctuel, qui exclut la réflexion ({blue}*noèsis*{/blue}), la considération ({blue}*théoria*{/blue}) et la conscience ({blue}*Bewusstsein*{/blue}).
    - {green}__L'homme__{/green}, animal pensant et parlant, vit {green}en tant qu'il travaille{/green}.

    L'ordre des termes importe : on ne commence pas par la pensée et la parole pour ajouter ensuite le travail ; c'est en travaillant que l'animal qui pense et parle mène sa vie.

    **Ce que l'on voit dans le travail est le trait de tout rapport aux choses.** {coral}Les hommes produisent, en travaillant, leurs moyens d'existence{/coral}, à travers {amber}l'invention et l'usage d'outils{/amber}. {sky}*L'Idéologie allemande*{/sky}, I, « Feuerbach », en fait la différence avec l'animal : les hommes {teal}« {/teal}commencent à {teal}se distinguer des animaux{/teal} dès qu'ils commencent à {teal}__produire leurs moyens d'existence__{/teal}{teal} »{/teal}. Et elle ajoute : {teal}« {/teal}En produisant leurs moyens d'existence, les hommes {teal}produisent indirectement leur vie matérielle{/teal} elle-même.{teal} »{/teal}

    **D'un moyen à l'existence entière.** Produire ses __moyens__ d'existence, c'est produire les __conditions__ de son existence ; c'est se faire exister, c'est {coral}__**produire son existence**__{/coral}. L'enchaînement ne laisse rien dehors : qui fabrique ce dont dépend sa vie fabrique la vie qu'il mène. L'existence humaine apparaît alors comme telle : une {violet}relation productive aux choses, médiatisée par le travail{/violet}. Les philosophes parlaient sans cesse d'ontologie ; c'est en regardant le travail qu'on y pénètre.

    ! « Produire son existence » ne veut pas dire que l'homme se crée à partir de rien : il produit à partir d'une nature déjà là, qu'il transforme.
