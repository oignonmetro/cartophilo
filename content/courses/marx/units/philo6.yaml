# Cours sur la dimension philosophique de l'œuvre de Marx, tiré de
# l'introduction de Lucien Sève aux Écrits philosophiques de Marx (Flammarion,
# « Champs classiques », 2011) : voir l'en-tête de philo1. Ici : suite de la
# partie 5, « La logique du Capital », les catégories à dominante ontologique
# de la matérialité (matière, forme, transformation) et de la dialecticité
# (le procès de la dialectique, le rapport, la contradiction).
#
# Citations : Postface du Capital et « sensible suprasensible » (livre I,
# chap. 1) dans la GEME (Lefebvre) ; Critique du droit politique hégélien
# dans la GEME (Kervégan) pour « contradiction irréconciliable » ; le reste
# (Introduction de 1844, Théories sur la plus-value, Grundrisse, Engels) dans
# la traduction de Sève.

id: philo6
title: "La logique du Capital : matière, forme, dialectique"
subtitle: "Une matière qui n'est pas inerte, une forme qui vit et se transforme, des rapports plus essentiels que les choses, et une contradiction qui ne se réconcilie pas"
group: "Le philosophique chez Marx"
icon: compass
color: coral
lessons:
- id: philo6-l1
  title: "La matière"
  notes: |-
    **Après les catégories de la connaissance viennent celles qui disent des rapports réels, à dominante ontologique : d'abord celles de la matérialité. Le noyau** {violet}**matière**{/violet} **(*Materie*) est chez Marx** {coral}**d'une complexité très sous-estimée**{/coral}**, d'abord par son vocabulaire.**

    **Un vocabulaire à ne pas écraser.**

    | Mot | Registre |
    | *Materie* | la catégorie philosophique de matière |
    | *Stoff* | la matière tangible, la substance |
    | *Gegenstand* | l'objet (*gegenständlich* : objectal) |
    | *Sache*, *Ding* | la chose, la pure chosalité |

    Traduire tout cela par le seul trio {red}matière, matériel, matérialisé{/red} fausse la représentation du matérialisme de Marx, jusqu'à lui prêter des absurdités. En particulier, {violet}*gegenständlich*{/violet} veut souvent dire non le passe-partout « objectif », mais le précis {green}objectal{/green} (qui consiste en un objet), et *vergegenständlicht*, {green}objectalisé{/green}.

    **Ni trop, ni trop peu de système.** Marx n'est pas un doctrinaire et ne fixe pas son vocabulaire de façon absolue : quand il écrit que {teal}« le travail s'incarne [*sich verkörpert*], se matérialise [*sich materialisiert*], se réalise [*sich realisiert*] dans son produit »{/teal}, « se matérialise » n'est qu'un {amber}synonyme{/amber} des deux autres verbes, non un terme catégoriel. Il faut donc éviter deux erreurs : {red}systématiser à l'excès sa terminologie{/red}, {red}méconnaître ses déterminations catégorielles majeures{/red}.

    **Une matière active.** La matière de Marx est aux antipodes de la {red}*res extensa*{/red} cartésienne, inerte. Nourri des matérialistes, d'{sky}Épicure{/sky} à {sky}Diderot{/sky}, et des pensées dynamiques de {sky}Spinoza{/sky} et {sky}Leibniz{/sky}, il met dans *Materie* la {green}productivité dialectique{/green} autant que la corporéité massive, et jusqu'à l'être pensant : {teal}« la théorie aussi, dès qu'elle s'empare des masses, devient __une puissance matérielle__ »{/teal}.

    **Une catégorie double**, comme l'avait vu {sky}Lénine{/sky} :
    - côté {amber}gnoséologique{/amber}, elle {pink}oppose{/pink} la matière à la conscience que nous en avons : l'objectif face au subjectif ;
    - côté {amber}ontologique{/amber}, elle {green}efface cette opposition{/green} : tout ce qui existe est matériel, le subjectif lui-même ; et la matière objective est apte à devenir sujet, comme dans l'homme.
