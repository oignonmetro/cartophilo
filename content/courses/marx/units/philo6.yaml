- id: philo6-l6
  title: "Le monde des rapports"
  notes: |-
    **Les rapports, qui sous-tendent tout ce qui existe, forment tout un monde catégoriel, en trois rubriques ; et leur ensemble est une** {violet}**unité structurée**{/violet}**,** {coral}**non la Totalité de Hegel**{/coral}**.**

    | Rapports d'ordre | Dialectique | Catégories |
    | spatial | de l'interne et de l'externe | aliénation, appropriation |
    | temporel | de l'antérieur et de l'ultérieur | procès, présupposition |
    | de la complexité | de l'inférieur et du supérieur | seuil, saut qualitatif |

    **1. L'espace : l'interne et l'externe.** Cette dialectique est omniprésente dans la production, qui {amber}objectalise{/amber}, et dans l'appropriation, qui {amber}subjectalise{/amber}. Elle est au cœur de l'{violet}aliénation{/violet} (*Entfremdung*), où le préfixe *Ent-* dit l'{red}extériorisation dépossédante{/red}, et de son opposé, l'{violet}appropriation{/violet} (*Aneignung*).

    **2. Le temps : l'antérieur et l'ultérieur.** Ce sont les {violet}procès{/violet}, mot que Marx a beaucoup contribué à réintroduire en français par la traduction du *Capital*. Le procès est le mode d'être de la plupart des rapports : tout rapport est {amber}produit autant que producteur{/amber}, donc évolutif, mais {red}sans téléologie{/red}.
    - l'ultérieur ne se produit et ne se comprend qu'à partir de ses {violet}présuppositions{/violet} (*Voraussetzungen*) : il y a une logique réelle des procès ;
    - mais l'antérieur ne menait pas nécessairement à l'ultérieur : entre les deux interviennent des {coral}hasards{/coral} et s'actualisent imprévisiblement des possibles. {teal}« L'anatomie de l'homme est __la clef de l'anatomie du singe__ »{/teal} (Introduction de 1857) ; mais l'homme n'est pas un avenir déjà écrit dans le singe.

    Marx pense aux antipodes de la *Philosophie de l'histoire* de Hegel : il ne rabat rien sur la {green}nécessité du nécessaire{/green} (le capitalisme est bel et bien mortel), mais la façon dont le nécessaire s'accomplira {red}n'a rien de fatal{/red}.

    **3. La complexité : l'inférieur et le supérieur.** Seuils, {violet}sauts qualitatifs{/violet}, irréductibilité des logiques du complexe à celles du simple. C'est l'un des très rares points où Marx reprend {amber}sans renversement{/amber} la catégorisation de Hegel : un des rares moments de la *Logique* où un matérialiste exigeant ne trouve guère à redire.

    **Le tout.** L'ensemble des rapports forme une {violet}unité structurée{/violet} ; {sky}Althusser{/sky} a justement montré qu'elle diffère foncièrement de la {red}Totalité{/red} hégélienne (*Totalität*), où tout exprime un même principe intérieur. Elle renvoie à une vision matérialiste du {green}tout organique{/green} (*organisches Ganze*).
