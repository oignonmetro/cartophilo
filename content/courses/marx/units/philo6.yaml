- id: philo6-l2
  title: "La forme"
  notes: |-
    **Lié à la matière, le noyau de la** {violet}**forme**{/violet} **(*Form*) est chez Marx d'une richesse et d'une nouveauté stupéfiantes, et presque pas étudié : selon** {sky}**Sève**{/sky}**,** {coral}**Marx est le grand penseur moderne de la forme**{/coral}**.**

    **Au-delà d'Aristote.** Le couple matière-forme montre ce que Marx doit, par-delà Hegel, à {sky}Aristote{/sky}, qu'il admire. Mais pour Aristote, la forme est l'{red}autre de la matière{/red} : qu'elle soit de marbre ou d'airain, la {yellow}sphère{/yellow} reste la sphère. Elle est donc immatérielle ; comment alors peut-elle se composer avec la matière ? Il faut penser autrement : {green}la forme est la matière considérée sous le seul rapport de sa détermination spatio-temporelle{/green}. Ce mode de rapport à la matière en fait une catégorie philosophique.

    **Un vocabulaire foisonnant.** *Form*, *Gestalt*, *Figur*, *Struktur*, *Organisation*, *Gliederung* : de l'{amber}allure externe{/amber} (*Gestalt*) à la {amber}membrure interne{/amber} (*Gliederung*).

    **Les formes d'une même chose.** Une chose admet une pluralité de formes : la {violet}forme naturelle{/violet}, inhérente à sa matière ; la {violet}forme contingente{/violet}, due aux circonstances ; entre les deux, la {violet}forme essentielle{/violet}, liée à son contenu (*Inhalt*). La dialectique {amber}forme-contenu{/amber} passe chez Marx au premier plan.
    - Une forme essentielle, comme la {yellow}forme-marchandise{/yellow} des produits sociaux, ne se pense pas hors de sa {violet}formation{/violet} (*Formation*), l'ensemble organique de formes dont elle est membre : « la forme » prise en soi est une mauvaise abstraction.
    - La forme essentielle impose sa logique jusqu'à {coral}élire, voire produire, sa matière{/coral} : la {yellow}forme-argent{/yellow} s'est incarnée de préférence dans les métaux précieux, divisibles, inaltérables, de grande valeur sous un petit volume. En ce sens, l'adage idéaliste {teal}« la forme crée »{/teal} a une vérité matérialiste.

    **Une forme qui vit.** La forme essentielle n'est pas qu'une figure spatiale, c'est une {green}logique temporelle{/green} : non seulement forme d'apparition du contenu ({violet}*Erscheinungsform*{/violet}), mais forme de son mouvement et de son développement ({violet}*Bewegungsform*{/violet}, {violet}*Entwicklungsform*{/violet}). C'est une nouveauté capitale par rapport au {red}fixisme{/red} de la forme chez Aristote ou Kant : il y a une {coral}vie des formes{/coral}.
    - Sa prise sur le contenu a des degrés : {amber}externe{/amber}, elle n'est que formelle ; {amber}intériorisée{/amber}, elle devient réelle.
    - Entre forme et contenu, la dualité peut s'accuser : la forme {red}travestit l'essence{/red}, porte l'{red}illusion fétichiste{/red}, s'aliène, entre en crise ; s'ouvre alors une période de transformation.

    La méconnaissance de cet apport est au principe des difficultés du {sky}gestaltisme{/sky}, puis du {sky}structuralisme{/sky}, à penser ensemble {amber}structure{/amber} et {amber}histoire{/amber}.
  points:
