- id: philo6-l5
  title: "Le rapport, plus essentiel que la chose"
  notes: |-
    **Les catégories de la dialecticité disent le rationnellement nécessaire dans tout ce qui est ; on y retrouve l'essence, donc le** {violet}**rapport**{/violet} **(*Verhältnis*), catégorie aussi centrale chez Marx que la forme :** {coral}**le rapport est plus essentiel que la chose**{/coral}**.**

    **Le rapport, unité de multiples.** En son sens fort, le rapport est l'{violet}unité logique de multiples{/violet} :
    - unité {amber}symétrique{/amber} : l'{yellow}achat{/yellow} et la {yellow}vente{/yellow} dans l'échange marchand ;
    - unité {amber}dissymétrique{/amber} : le {yellow}capitaliste{/yellow} et le {yellow}salarié{/yellow} dans la production capitaliste.

    L'analyse de Marx cherche partout les rapports structurants et générateurs sous les formes phénoménales et les événements : c'est une conviction de base pour qui a compris ce qu'il entend par essence.

    **Abstrait, et pourtant réel.** Étranger à la choséité, le rapport ne peut être « individualisé que par une abstraction » : toute pensée des rapports est des plus abstraites. Mais, comme l'universel dans un particulier, un rapport peut {coral}s'incarner dans une chose{/coral} : le rapport de valeur dans l'{yellow}argent{/yellow}, chose paradoxale, {teal}« __sensible suprasensible__ »{/teal}, qui signale un rapport sous-jacent en le masquant. Le monde des rapports est donc aussi bien {green}réel{/green} qu'{green}idéel{/green}.

    **Rapport et relation : un contresens à éviter.**

    | Mot | Allemand | Registre |
    | rapport | *Verhältnis* | l'essentiel, le social, l'objectif |
    | relation | *Beziehung* | le phénoménal, l'interpersonnel, le subjectif |

    On parle de « {pink}relations humaines{/pink} », mais de « {green}rapports sociaux{/green} », rapports « nécessaires, indépendants de [notre] volonté ». D'où un contresens toujours observable : lire la {sky}6e thèse sur Feuerbach{/sky} comme si elle identifiait l'essence humaine aux {red}relations sociales de l'individu{/red} (ses amis, sa famille, ses collègues), au lieu des {green}rapports objectifs du monde social{/green} existant.
