- id: philo6-l7
  title: "La contradiction, de l'antagonisme au non-antagonique"
  notes: |-
    **Avec le rapport, unité de multiples, on est déjà dans la** {violet}**contradiction dialectique**{/violet}**, le noyau le plus central du philosophique marxien. Marx y rompt tôt avec Hegel,** {coral}**puis découvre une complexité qu'il ne nommera jamais nettement**{/coral}**.**

    **Ce qui reste de Hegel.** Son élaboration est si profonde que plusieurs de ses déterminations gardent sens après le renversement : ainsi l'idée de l'{violet}opposition{/violet} (*Gegensatz*) des {violet}contraires{/violet} (*Gegenteile*) comme {violet}contradiction{/violet} (*Widerspruch*), qui déborde d'emblée la logique classique. D'où la conviction tenace que Marx « ne se libéra jamais totalement de Hegel ».

    **Mais la rupture date de 1843.** À la contradiction qui, selon Hegel, se dépasse dans l'{red}État{/red}, Marx oppose la {teal}« __contradiction irréconciliable__ »{/teal}, qui ne peut finir qu'avec l'{green}extinction de l'État{/green}. Si la contradiction est irréconciliable, il faut repenser ou mettre au rancart identité des contraires, médiation, dépassement conservateur, négation de la négation. Pour nommer cette contradiction non hégélienne, Marx emploie dans les années 1850 le mot {violet}antagonisme{/violet} (*Antagonismus*) : ainsi *Klassengegensatz*, l'antagonisme de classes. La Postface du *Capital* garde l'opposition entre les deux dialectiques :

    | Dialectique | Ce qu'elle fait |
    | mystifiée | « semblait glorifier l'état de choses existant » |
    | rationnelle | inclut « l'intelligence de sa négation, de sa destruction nécessaire » |

    Rationnelle, la dialectique {teal}« est, dans son essence, __critique et révolutionnaire__ »{/teal}.

    **La complication de l'économie.** Pour penser le dépassement du capitalisme, il faut d'abord comprendre sa structure et son fonctionnement. Or l'échange marchand, la circulation monétaire, la rotation du capital semblent relever de la dialectique de Hegel : partout l'{amber}identité médiatisée des contraires{/amber}, la {amber}réunification des opposés{/amber}, la {amber}négation de la négation cyclique{/amber}. Au même moment, {sky}Engels{/sky}, réfléchissant sur la nature, trouve partout, à côté du {pink}« ou bien… ou bien »{/pink}, l'{green}« aussi bien ceci… que cela »{/green}. Conclusion : à la dialectique de l'{violet}antagonique{/violet} doit se lier une dialectique du {violet}non-antagonique{/violet}, à celle de l'{violet}évolutif{/violet} une dialectique du {violet}stationnaire{/violet}.

    **Un continent exploré sans être nommé.** Marx élabore des sens post-hégéliens :
    - de la {violet}*Vermittlung*{/violet} : la {green}médiation objectalisée{/green} de l'activité productive ;
    - de l'{violet}*Aufhebung*{/violet} : un dépassement {green}révolutionnaire plus que conservateur{/green} ;
    - de la {violet}*Negation der Negation*{/violet} : une logique des procès {green}en spirale, sans téléologie{/green}.

    Mais il ne marque pas leur place dans une vision d'ensemble. Cette incomplétude explique sans doute qu'il n'ait jamais écrit ses « deux ou trois feuilles d'imprimerie » sur la dialectique, et la sous-estimation de son apport. Les logiques de la contradiction n'en sont pas moins à l'œuvre de bout en bout du *Capital*.
  points:
