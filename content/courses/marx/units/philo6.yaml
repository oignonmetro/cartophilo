- id: philo6-l4
  title: "Rouvrir le dossier de la dialectique"
  notes: |-
    **La dialectique, point focal de l'apport de Hegel, l'est aussi chez Marx ; or les verdicts du milieu du XXe siècle l'ont condamnée, et la recherche s'est tarie.** {sky}Sève{/sky} soutient que {coral}ce décret d'invalidation est lui-même invalide{/coral}.

    **Les verdicts.** Deux grands exemples : {sky}Althusser{/sky}, *Pour Marx* (1965), et {sky}Adorno{/sky}, *Dialectique négative* (1966). L'optimisme d'une {red}dialectique positive{/red}, où les contraires se réconcilient, n'aurait pas seulement marqué le {red}téléologisme{/red} de Hegel : il aurait contaminé sans remède la dialectique de Marx. Devenu vérité dominante, ce verdict a tari la recherche depuis les années 1970 ; la dialectique a sombré dans l'oubli.

    **Pourquoi le réexaminer.** La crise présente du capitalisme oblige à se réapproprier Marx avec une exigence neuve, ce qui est impossible si l'on laisse la dialectique en l'état. Et à reconsidérer ces verdicts, on voit qu'ils dépendaient d'une situation révolue :
    - {amber}__l'état des lieux__{/amber} : la dialectique dominante était celle du {red}scientisme stalinien{/red}, qu'on avait raison de récuser ;
    - {amber}__la connaissance des textes__{/amber} : Althusser a construit sa critique sur un corpus où manquait la plus grande partie du *Capital*, des *Grundrisse* au livre IV ; la méditation d'Adorno se tient plus loin encore du texte ;
    - {amber}__la conjoncture__{/amber} : les crimes staliniens, {yellow}Auschwitz{/yellow}, la crise communiste après 1956 semblaient condamner la « dialectique hégélo-marxiste » pour son assurance mortifère.

    **Ce qui faisait leur force la leur ôte.** Les « lois » de la dialectique ont disparu jusqu'au souvenir ; on juge sévèrement aujourd'hui un procès instruit sans examiner les pièces ; et dans un siècle où se mondialise l'écrasement par la finance, {teal}« ce n'est pas la dialectique, c'est __l'absence de dialectique__ qui tue »{/teal}. Le dossier est donc {green}à rouvrir de fond en comble{/green}.
  points:
  - id: philo6-l4-p1
    sentence: "__Les verdicts du milieu du XXe siècle contre la dialectique de Marx__ : selon Sève, ce décret d'invalidation est lui-même ___."
    answer: "invalide"
