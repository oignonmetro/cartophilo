- id: philo6-l3
  title: "Métamorphose et transformation"
  notes: |-
    **La pensée de la forme se redouble à propos du changement de forme, où Marx distingue** {coral}**deux modes**{/coral} **: la métamorphose, qui fait fonctionner une formation, et la transformation, qui la développe.**

    | Mode | Allemand | Passage | Rôle |
    | métamorphose | *Formwechsel* | à une forme équivalente | fonctionnement |
    | transformation | *Formverwandlung* | à une forme d'un autre niveau | développement |

    - La {violet}métamorphose{/violet} est le passage d'une forme à une autre {amber}équivalente{/amber}, de même niveau : la marchandise devient argent, l'argent redevient marchandise. C'est le changement de forme comme {green}fonctionnement{/green} de la formation (*Funktionsform*).
    - La {violet}transformation{/violet} est le passage à une forme {amber}essentiellement différente{/amber}, d'un autre niveau : l'argent devient capital. C'est le changement de forme comme {green}développement{/green} (*Entwicklungsform*).

    Le développement des formes a lui-même des formes de développement. En s'objectivant, les formes s'incrustent dans des supports et se {red}sclérosent{/red} dans des logiques plus ou moins autonomes ; leur stabilisation en une figure annonce souvent leur {red}entrée en crise{/red}.

    **Deux sortes de crise.**
    - la {violet}crise de fonctionnement{/violet} : l'unité de la forme et du contenu, disjointe, se rétablit plus ou moins violemment (une crise de surproduction, après laquelle le système repart) ;
    - la {violet}crise de développement{/violet} : un contenu fait éclater sa forme ancienne, ou une forme nouvelle fait muter son contenu ; s'ouvre alors dans l'histoire de la chose une phase de {coral}révolution{/coral} (*Revolution*, *Umstülpung*).

    **Vers la dialecticité.** Avec la transformation, on passe des catégories de la matérialité à celles de la {violet}dialecticité{/violet}, mot qui, à la différence de « matérialité », n'est pas de Marx : premier indice d'un problème.
  points:
