- id: sep-marx1-l2
  title: "Le travail aliéné"
  notes: |-
    **Marx consacre bien plus d'attention à l'aliénation dans le** {violet}**travail**{/violet} **qu'à l'aliénation religieuse.** Dans un passage très discuté des *Manuscrits de 1844*, il distingue quatre dimensions du [[g-travail-aliene|travail aliéné]]. Elles ne reprochent pas au travail d'être mal payé : {coral}elles reposent sur une thèse sur la nature humaine{/coral}, qui fait toute la force et toute la fragilité de la critique.

    **Les quatre séparations de l'ouvrier.**

    | L'ouvrier est séparé | Concrètement |
    | de son produit | ce qu'il fabrique **ne lui appartient pas**, lui échappe et finit par le dominer |
    | de son activité | il travaille sous la contrainte, et **son travail l'épuise** au lieu de l'épanouir |
    | des autres hommes | il ne traite plus **les autres que comme des moyens** au service de ses propres fins |
    | de sa nature humaine | il ne peut plus être ce que l'homme est fait pour être : un producteur **libre**, **vivant en communauté** |

    ! Le {violet}fétichisme{/violet} du *Capital* (__nos créations nous échappent, prennent l'apparence de l'indépendance et nous oppriment__) {red}ne se confond pas avec l'aliénation{/red} : il en est {green}une forme{/green}.

    **L'aliénation n'est pas la plainte ordinaire contre le travail.** Un __travail aliéné__ pourrait être {yellow}bien payé{/yellow}, {yellow}de courte durée{/yellow} et {yellow}sûr{/yellow}, même si d'ordinaire il ne l'est pas. Ce que Marx dénonce n'est {pink}pas ce que l'ouvrier reçoit{/pink}, mais {green}__ce que le travail fait de lui__{/green} (le salaire n'y est qu'une conséquence de l'aliénation).

    **Le travail n'est pas un mal nécessaire.** Marx {red}refuse de voir dans la __**pénibilité du travail**__ une fatalité de la condition humaine{/red}, qu'aucun changement social ne guérirait. Au contraire, {green}l'activité productive est un élément central de ce qu'est un homme{/green}, et {coral}se réaliser par le travail est une part essentielle de l'épanouissement humain{/coral}. C'est parce que le travail *pourrait* être créateur que sa forme présente est si violemment condamnée : la production fait de l'ouvrier {teal}« __un être déshumanisé__{/teal} aussi bien intellectuellement que physiquement{teal} »{/teal} (*Manuscrits de 1844*, premier manuscrit).

    **Le travail non aliéné, tel qu'on peut le reconstruire** (avec {sky}Kandiyali{/sky}), aurait quatre traits. Il serait :
    - {amber}librement choisi{/amber}
    - {amber}une réalisation de soi{/amber}, qui développe et exerce les puissances essentielles de l'homme
    - {amber}destiné à satisfaire les besoins d'autrui{/amber}
    - {amber}reconnu comme il convient par autrui{/amber}

    **Pourquoi ces séparations sont-elles des maux ? À cause de la quatrième.** Une séparation n'est aliénation que si elle rompt une unité de référence ; chez Marx, cette référence est {violet}l'épanouissement humain{/violet}, donc une certaine idée de la {violet}nature humaine{/violet} : l'homme est fait pour produire librement et pour vivre en communauté. Être séparé de son produit, de son activité et des autres hommes n'est un mal que parce que cela l'empêche d'être ce qu'il est. Le travail capitaliste est aliéné parce qu'{coral}il sépare l'homme de ce qui lui permettrait de s'épanouir{/coral}.

    **La contre-épreuve : changez de conception de l'homme, et l'aliénation disparaît.** Imaginons un théoricien qui accepte la même définition (une séparation est une aliénation si elle contrarie la nature humaine), mais qui tient l'homme pour {yellow}un être solitaire et égoïste par nature{/yellow}. Il accorderait que le travail capitaliste isole et rend égoïste ; il nierait que ce soit une aliénation, car {coral}cela ne frustre en rien sa conception de l'homme{/coral}, et la favorise plutôt. Toute la critique de Marx tient donc à {green}sa conception de l'homme comme être communautaire et créateur{/green} (voir [[g-etre-generique|Être générique]]).
