# Cours sur la philosophie sociale et politique de Marx (voir
# content/philosophie.md et la skill cours-sep), tiré de l'article « Karl Marx »
# de David Leopold, Stanford Encyclopedia of Philosophy (première publication
# 2003, révision substantielle 2025) : introduction et section 1 (aliénation et
# épanouissement humain, 1.1 à 1.5).
#
# Citations de Marx reprises du texte français, non retraduites de l'anglais :
# Introduction à la Critique de la philosophie du droit de Hegel et Sainte
# Famille dans les Écrits philosophiques (Sève, Éditions sociales), Manuscrits de
# 1844 (Bottigelli, Éditions sociales), Sur la question juive dans les Œuvres III
# de la Pléiade (Rubel), à défaut d'édition sociale sous la main. Vocabulaire :
# « aliénation », « être générique » (Bottigelli), comme dans le Glossaire.
#
# Les quatre dimensions du travail aliéné sont résumées ici sans leurs
# citations : elles se lisent, citées, dans l'entrée [[g-travail-aliene]] du
# Glossaire, à laquelle le rappel renvoie (pas de répétition entre pistes).

id: sep-marx1
title: "L'aliénation"
subtitle: "Une séparation qui empêche l'épanouissement humain, de la religion au travail et au droit"
group: "Idées générales"
icon: compass
color: violet
lessons:
- id: sep-marx1-l1
  title: "Qu'est-ce que l'aliénation ? La leçon de la religion"
  notes: |-
    **L'**{violet}**aliénation**{/violet} **est un mal social d'un genre propre : une** {coral}**séparation problématique entre un** __**sujet**__ **et un** __**objet**__ **qui vont ensemble**{/coral}**.** Elle est le premier grand thème de Marx, et le fil de ses écrits de jeunesse : {pink}avant de critiquer l'économie{/pink}, il critique {amber}ce qui sépare l'homme de ce qui lui appartient{/amber}.

    **Deux éléments dans la définition, et tous deux comptent.**
    - {amber}__Un sujet et un objet.__{/amber} Le sujet est un individu ou un groupe ; l'objet peut être une chose, un autre sujet, ou le sujet lui-même (l'ouvrier séparé de sa propre nature) ;
    - {amber}__Une séparation problématique__{/amber}. {red}Tout mal social n'est pas une séparation{/red} : être trop pris dans un groupe peut être un mal, ce n'est pas une aliénation. Et {red}toute séparation n'est pas un mal{/red} : quitter sa famille pour vivre sa vie n'aliène personne. Une séparation n'est aliénation que si elle rompt une {violet}unité de référence{/violet} : un accord qui devrait exister entre le sujet et l'objet, et que la séparation défait.

    Une théorie de l'aliénation fait donc trois choses : elle dit {amber}quelles séparations comptent{/amber} ; elle donne, souvent sans le dire, la raison qui {amber}les rend problématiques{/amber} ; elle dit {amber}jusqu'où elles s'étendent et comment on en sortira{/amber}.

    **Marx reprend à** {sky}**Feuerbach**{/sky} **le renversement de la théologie.** La {violet}théologie{/violet} dit que {pink}Dieu a créé l'homme à son image{/pink} ; {sky}Feuerbach{/sky}, dans *L'Essence du christianisme* (1841), répond que {green}les hommes ont inventé Dieu à leur image{/green}. Avec l'aide de leur imagination, ils portent leurs propres puissances (savoir, aimer, créer) à l'infini et les projettent sur un être abstrait, qu'ils adorent ensuite. Adorer Dieu, c'est donc se détourner de ses propres puissances : {coral}la religion sépare les hommes de leur{/coral} {violet}essence générique{/violet}{coral}, elle est une aliénation{/coral}. L'essence générique, ce sont les puissances propres à l'espèce humaine, ce qui fait d'un homme un homme : la religion les attribue à Dieu, et les retire ainsi à l'homme.

    **Mais** {sky}**Feuerbach**{/sky} **ne dit pas pourquoi les hommes tombent dans la religion, donc pas comment en sortir.** Pour lui, {red}croire est une erreur intellectuelle, que l'instruction corrigera{/red}. Pour Marx, {green}la religion répond à une aliénation de la vie matérielle{/green}, une souffrance réelle, née de la façon dont les hommes vivent et travaillent :elle ne disparaîtra donc pas sous la critique, mais {coral}quand la vie matérielle sera émancipée, elle dépérira d'elle-même{/coral}. C'est le sens de la formule célèbre de l'*Introduction à la Critique de la philosophie du droit de Hegel* (1843) : {teal}« {/teal}La religion est {teal}__le soupir de la créature accablée__{/teal}, {teal}__la chaleur d'un monde sans cœur__{/teal} comme l'esprit d'un état de choses sans esprit. Elle est {teal}__l'opium du peuple__ »{/teal}. Autrement dit : {yellow}un calmant{/yellow}, qui soulage une douleur réelle en produisant une illusion. D'où la conséquence : {teal}« {/teal}Revendiquer que cessent les illusions sur sa situation, c'est revendiquer {teal}__que cesse une situation qui a besoin d'illusions__ »{/teal} (*ibid*.). Pour faire tomber l'illusion, il faut donc changer la situation qui la rend nécessaire.

    **Ce que la religion compense : le travail aliéné, et le besoin d'affirmer notre** {violet}**essence communautaire**{/violet}**.** Qu'on le reconnaisse explicitement ou non, __les êtres humains existent en tant que communauté__, et ce qui rend la vie humaine possible, c'est la dépendance mutuelle où l'on se trouve à l'égard du vaste réseau de relations sociales et économiques qui nous engage toutes et tous. Selon Marx, nos institutions doivent reconnaître, d'une façon ou d'une autre, cette existence commune ; elles l'ont d'abord fait {amber}« de biais »{/amber}, par des substituts :
    - la {yellow}religion{/yellow} crée une {red}fausse communauté{/red}, où tous sont égaux __aux yeux de Dieu__ ;
    - après l'éclatement de la religion par la Réforme, l'{yellow}État moderne{/yellow} prend le relais : {red}l'illusion d'une communauté de citoyens{/red}, tous égaux __aux yeux de la loi__ ;
    - l'une et l'autre seront dépassés par {green}une véritable communauté d'égaux sociaux et économiques{/green} (voir [[g-communaute|Communauté]]).

    ! Marx ne dit pas que la religion est une simple tromperie des puissants : {teal}« {/teal}La détresse religieuse est pour une part {teal}__l'expression de la détresse réelle__{/teal} et pour une autre {teal}__la protestation contre la détresse réelle__ »{/teal} (*ibid*.). Combattre la religion sans changer la vie qui la produit, c'est donc soigner le symptôme et laisser le mal.
