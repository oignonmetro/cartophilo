- id: sep-marx1-l4
  title: "Trois questions sur l'aliénation"
  notes: |-
    **Trois questions restent ouvertes, et chacune touche à la cohérence de la théorie : sa place dans l'œuvre, la nature humaine qu'elle suppose, et le rapport entre aliénation vécue et aliénation réelle.**

    **L'aliénation n'est pas qu'un thème de jeunesse.** On a longtemps soutenu que Marx n'en parlait que dans les écrits du début des années 1840 ; {red}les textes ne le confirment pas{/red}. Mais son rôle a pu changer : selon {sky}Allen Wood{/sky}, l'aliénation a dans les premiers écrits un rôle {amber}explicatif{/amber} (le travail aliéné y explique la propriété privée), dans les derniers une fonction {amber}descriptive ou diagnostique{/amber} (elle nomme un mal, sans en être la cause).

    **Une nature humaine, en partie constante, en partie variable.** On a dit aussi que le Marx de la maturité, attentif à ce qui change d'une époque à l'autre, ne pouvait plus admettre de nature humaine universelle ;{red}les textes ne le confirment pas davantage{/red} ({sky}Geras{/sky}). Le Marx « mûr » affirme que la nature humaine a {green}des éléments constants{/green}, communs à toutes les époques et cultures, {green}et des éléments variables{/green}, qui reflètent la diversité historique ({sky}McMurtry{/sky}). {sky}Rahel Jaeggi{/sky} propose de rejeter les théories de l'aliénation qui reposent sur une conception {violet}« épaisse »{/violet} de la nature humaine, c'est-à-dire riche en contenu (elle dit en détail ce dont l'homme a besoin), et pour cela contestable. Quoi qu'on en pense, celle de Marx est épaisse : une société épanouissante doit satisfaire
    - des {amber}besoins élémentaires{/amber} : nourriture, chaleur et abri, conditions climatiques, exercice physique, hygiène, procréation et sexualité ;
    - des besoins moins élémentaires, qu'on oublie souvent chez lui :{amber}loisir, culture, stimulation intellectuelle, expression artistique, satisfaction affective, plaisir esthétique{/amber} ;
    - et ceux qu'on lui associe d'ordinaire : {amber}un travail épanouissant et une communauté qui ait un sens{/amber} (voir [[g-besoin|Besoin]]).

    **Aliénation subjective et aliénation objective.**
    - l'aliénation est {violet}subjective{/violet} quand elle se définit par des croyances ou des sentiments : on est aliéné parce qu'{yellow}on se sent étranger au monde{/yellow} ;
    - elle est {violet}objective{/violet} quand elle se définit sans eux : on est aliéné parce qu'{yellow}on ne développe ni n'exerce ses facultés humaines essentielles{/yellow}, qu'on le vive comme une perte ou non.

    Marx les tient pour {amber}distinctes en concept{/amber}, mais {amber}d'ordinaire réunies sous le capitalisme{/amber}, la subjective suivant l'objective. Elles peuvent pourtant se séparer, comme le montre *La Sainte Famille* : le capitaliste ne se réalise pas plus que l'ouvrier (il est objectivement aliéné), mais il se plaît dans cette situation (il n'est pas subjectivement aliéné). {teal}« {/teal}La classe possédante et la classe prolétaire représentent {teal}__la même autoaliénation humaine__{/teal}. Mais dans cette auto-aliénation {green}__la première se sent à l'aise et s'y satisfait__{/green}, parce que cette aliénation est sa propre puissance où elle trouve {teal}le semblant d'une existence humaine{/teal} ; {red}__la seconde se sent anéantie dans cette aliénation__{/red}{teal} »{/teal} (*La Sainte Famille*, 1845). Autrement dit, la même aliénation fait la puissance du possédant, qui y trouve l'apparence d'une vie humaine, et l'impuissance de l'ouvrier.
