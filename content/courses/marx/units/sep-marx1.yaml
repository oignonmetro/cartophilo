- id: sep-marx1-l3
  title: "Capitalisme, technique et émancipation"
  notes: |-
    **L'aliénation a une histoire : elle tient aux sociétés de classes, culmine sous le capitalisme, et doit disparaître avec lui.** Mais ce qui aliène, ce n'est {red}pas la technique{/red}, ce sont {green}les rapports sociaux{/green} ; et ce qui en libère, ce n'est {red}pas l'émancipation politique{/red}, mais {green}l'émancipation humaine{/green}.

    **Où et quand y a-t-il aliénation ?** Marx semble tenir ensemble quatre thèses :
    - des formes systématiques d'aliénation (l'aliénation religieuse, au moins) existaient {amber}avant le capitalisme{/amber} ;
    - ces formes (dont l'aliénation au travail) n'appartiennent qu'aux {amber}sociétés divisées en classes{/amber} ;
    - elles sont {amber}plus grandes sous le capitalisme{/amber} qu'avant ;
    - une société sans classes, le {violet}communisme{/violet}, {amber}n'en connaîtra plus{/amber}.

    **Les rapports sociaux, non la technique.** {green}L'aliénation découle des rapports sociaux capitalistes{/green}, {red}non des progrès techniques que contient la société capitaliste{/red}. Marx n'a que mépris pour la {violet}critique romantique du capitalisme{/violet}, qui accuse l'industrie et la machine d'avoir détruit une {pink}idylle communautaire précapitaliste{/pink}. Lui {coral}célèbre la destruction des rapports féodaux par la bourgeoisie{/coral}, et voit croissance technique et libération humaine avancer ensemble : {green}l'industrie fait partie de la solution, non du problème{/green}.

    ! Une objection s'impose : le communisme, censé être plus productif que le capitalisme, aura lui aussi sa grande industrie ; comment le travail y échapperait-il à l'aliénation ? Marx n'y répond pas, puisqu'il s'interdit de décrire en détail la société future ; les réponses viennent de ses commentateurs ({sky}Kandiyali{/sky}).

    **L'émancipation politique ne suffit pas.** Dans *Sur la question juive* (1843), Marx se sépare des Jeunes-Hégéliens libéraux, et d'abord de {sky}Bruno Bauer{/sky}. Bauer, athée, s'opposait à l'émancipation civique des juifs : selon lui, la religion, juive comme chrétienne, empêche l'homme de s'émanciper, et c'est d'elle qu'il faut d'abord se libérer. Marx répond par une distinction :
    - l'{violet}émancipation politique{/violet} : l'octroi des droits et libertés libéraux ;
    - l'{violet}émancipation humaine{/violet} : la libération de l'homme lui-même, dans son travail et dans ses rapports aux autres.

    La première est {coral}parfaitement compatible avec la religion{/coral}, comme le montrent les {yellow}États-Unis{/yellow}, État sans religion officielle, et pourtant très religieux.

    **Plus profondément, l'émancipation politique fait obstacle à l'émancipation humaine.** Les droits libéraux supposent que {amber}chacun a besoin d'être protégé des autres{/amber}, qui menacent sa liberté et sa sûreté. Ce sont donc des {violet}droits de séparation{/violet} : {teal}« {/teal}le droit humain de la liberté n'est pas fondé sur {teal}__l'union de l'homme avec l'homme__{/teal}, mais au contraire sur {teal}__la séparation de l'homme d'avec l'homme__ »{/teal} (*Sur la question juive*). La liberté y est l'{red}absence d'interférence{/red} : être libre, c'est ne pas être gêné par les autres. Ce que cette conception manque, c'est que {green}la vraie liberté se trouve positivement dans nos relations avec autrui, dans la communauté, non dans l'isolement{/green}. Un régime de droits libéraux nous habitue à nous voir les uns les autres comme des menaces, et {coral}mine ainsi la liberté que donnerait l'émancipation humaine{/coral}.

    ! Marx {red}ne s'oppose pas à l'émancipation politique{/red} : le libéralisme est un {green}grand progrès{/green} sur la féodalité et les discriminations religieuses de l'Allemagne de son temps. Il faut seulement le {green}dépasser{/green}. Marx ne dit jamais précisément ce que serait l'émancipation humaine ; on sait seulement qu'elle irait avec un travail non aliéné, un riche épanouissement individuel et une communauté qui ait un sens.
  points:
