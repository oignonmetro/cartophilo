# Entrée du glossaire de Marx (skill glossaire-marx) : notion. Citations reprises de
# NotebookLM avec leur source (Manuscrits de 1844, éditions sociales ; À propos de la
# question juive et L'Idéologie allemande, Pléiade, Œuvres III), vérifiées
# par textes.py. Angle choisi pour ne pas redire Être générique (demande de
# l'utilisateur, 2026-11-06) : ce que « générique » veut dire concrètement, où se passe
# la vie du genre (dans le travail, dans l'État) et comment elle est séparée de la vie
# de l'individu.

id: g-vie-generique
title: Vie générique (`Gattungsleben`)
icon: book
color: coral
lessons:
- id: g-vie-generique-l1
  title: Vie générique
  notes: |-
    Chez Marx, la {violet}**vie générique**{/violet} ({violet}*Gattungsleben*{/violet}) est [def]. *Gattung* veut dire le genre ou l'espèce : la vie générique est donc {amber}la vie de l'espèce humaine{/amber}. Concrètement, c'est ce qui, dans la vie d'un homme, n'est pas réduit à sa subsistance d'individu isolé, mais le rapporte à l'espèce entière : ce qu'il fait avec et pour les autres, à l'opposé de son intérêt privé. Ce n'est {pink}ni la vie biologique de l'espèce, ni une essence cachée en chacun{/pink} : c'est une activité qui a un lieu. Que l'homme se rapporte à son genre, et soit par là universel et libre, c'est ce qu'établit l'[[g-etre-generique|être générique]] ; la question est ici de savoir **où** se passe la vie du genre. Marx donne deux réponses, à un an d'écart : dans l'{violet}État{/violet}, en 1843, et dans le {violet}travail{/violet}, en 1844. Dans les deux cas, la vie générique est séparée de la vie de l'individu, et le problème est de l'y faire rentrer : en 1843, par l'émancipation humaine ; en 1844, en abolissant le travail aliéné, pour que la vie individuelle et la vie générique ne soient plus différentes.

    __**La vie générique est la vie qui produit la vie : par son**__ {violet}__**travail**__{/violet}__**, l'humanité se produit elle-même.**__ Une espèce se définit par sa manière de vivre : {teal}« {/teal}le mode d'activité vitale renferme tout le caractère d'une espèce, son caractère générique, et {teal}__l'activité libre, consciente, est le caractère générique de l'homme__ »{/teal} (*Manuscrits de 1844*, premier manuscrit, travail aliéné). Or produire pour le besoin immédiat est commun à l'animal ; l'homme, lui, produit même libéré du besoin, et pour toute l'espèce (voir être générique). Son activité libre et consciente est donc la production elle-même, et {teal}« {/teal}{teal}__la vie productive est la vie générique. C'est la vie engendrant la vie__ »{/teal} (*ibid*.). Terme à terme : la vie qui engendre, c'est l'activité productive ; ce qu'elle engendre, c'est la vie de l'espèce, ses moyens d'existence et l'espèce elle-même, qui se transforme en transformant la nature. Concrètement, ce sont les outils, les maisons, les savoirs, tout ce que les générations transmettent aux suivantes. {coral}L'humanité ne reçoit pas sa vie, elle la produit{/coral} : la production est, selon {sky}Fischbach{/sky}, « une production de soi par soi ». Ce n'est donc pas d'abord la procréation. Marx ne la méprise pas pour autant : manger, boire et procréer {teal}« {/teal}{teal}__sont certes aussi des fonctions authentiquement humaines__{/teal}. Mais, séparées abstraitement du reste du champ des activités humaines et devenues ainsi la fin dernière et unique, {teal}__elles sont bestiales__ »{/teal} (*ibid*.) : c'est le sort de l'ouvrier aliéné, qui ne se sent plus libre que dans ces fonctions. La procréation n'entre dans la production de la vie qu'en 1845 : {teal}« {/teal}{teal}__la production de la vie, qu'il s'agisse de sa propre vie par le travail ou de la vie d'autrui par la procréation__{/teal}, apparaît donc dès à présent comme une relation double, tant naturelle que sociale{teal} »{/teal}, sociale {teal}« {/teal}en ce qu'il est question de {teal}__la coopération de plusieurs individus__{/teal}{teal} »{/teal} (*L'Idéologie allemande*, I, traduction de la Pléiade). La vie générique est alors, très concrètement, ce que les hommes produisent ensemble.

    __**La**__ {violet}__**vie individuelle**__{/violet} __**et la**__ {violet}__**vie générique**__{/violet} __**ne sont pas différentes, même devant la mort.**__ Le genre n'est pas une réalité à côté des individus, car, même seul, l'homme agit avec ce qu'il tient des autres, le langage et la pensée. Donc {teal}« {/teal}L'{teal}__individu est l'être social__{/teal}. La manifestation de sa vie [...] est donc une manifestation et une affirmation de la vie sociale{teal} »{/teal} (*Manuscrits de 1844*, troisième manuscrit, Propriété privée et communisme), et {teal}« {/teal}La vie individuelle et la vie générique de l'homme {teal}__ne sont pas différentes__ »{/teal} (*ibid*.). D'où la mise en garde : {teal}« {/teal}Il faut surtout éviter de fixer de nouveau la "société" {teal}__comme une abstraction en face de l'individu__ »{/teal} (*ibid*.). L'objection vient d'elle-même : l'individu meurt, et le genre continue. Marx la prend de front : {teal}« {/teal}La {teal}__mort apparaît__{/teal} comme une {yellow}dure victoire du genre sur l'individu déterminé{/yellow} et {teal}__semble__{/teal} contredire leur unité ; mais {teal}__l'individu déterminé n'est qu'un être générique déterminé, et à ce titre mortel__ »{/teal} (*ibid*.). Il n'y a donc pas deux vies dont l'une vaincrait l'autre : {coral}la mortalité est le prix de la forme finie sous laquelle le genre existe{/coral}, et ce qui meurt, c'est telle détermination de la vie générique.

    __**Le**__ {red}__**travail aliéné**__{/red} __**fait de la vie générique un moyen de la vie individuelle.**__ Cette unité est ce que l'aliénation défait. Si la vie générique est la production, elle se passe dans le travail de chaque ouvrier. Or, sous le travail aliéné, le produit appartient à un autre : l'ouvrier ne peut se servir de son activité que pour gagner de quoi subsister. Donc {teal}« {/teal}le travail, l'activité vitale, la vie productive {teal}__n'apparaissent eux-mêmes à l'homme que comme un moyen de satisfaire un besoin, le besoin de conservation de l'existence physique__ »{/teal} (*Manuscrits de 1844*, premier manuscrit, travail aliéné). Marx en tire un double renversement : le travail aliéné {teal}« {/teal}{teal}__fait pour lui de la vie générique le moyen de la vie individuelle__{/teal}. Premièrement, il {teal}__rend étrangères la vie générique et la vie individuelle__{/teal}, et deuxièmement il fait de cette dernière, réduite à l'abstraction, le but de la première, qui est également prise sous sa forme abstraite et aliénée{teal} »{/teal} (*ibid*.). D'abord, les deux vies se séparent : ce que l'ouvrier fait pour l'espèce et ce qu'il vit pour lui ne coïncident plus. Ensuite, le rapport s'inverse : {red}la simple survie, vie individuelle « réduite à l'abstraction », devient le but{/red}, et la production, vie générique réduite à un travail quelconque contre salaire, n'en est plus que le moyen. {amber}L'ouvrier qui tisse le drap de milliers d'hommes n'y voit que son salaire{/amber} (voir [[g-travail-aliene|travail aliéné]]).

    __**L'**__{violet}__**État politique**__{/violet} __**est la vie générique de l'homme, séparée de sa vie matérielle.**__ Un an plus tôt, *Sur la question juive* plaçait la vie générique ailleurs, en prenant « générique » au sens de communautaire : est générique la vie où l'homme se rapporte à l'intérêt général, et non à son intérêt privé. Or l'État moderne annule politiquement les distinctions privées : en abolissant le cens, il fait voter et élire le riche comme le pauvre. Le citoyen, égal devant la loi, électeur et souverain, se rapporte alors aux autres comme membre de la communauté, et non comme propriétaire ou marchand. Donc {teal}« {/teal}{teal}__l'État politique achevé est essentiellement la vie générique de l'homme par opposition à sa vie matérielle__{/teal}. Toutes les conditions de cette vie égoïste continuent à subsister, en dehors de la sphère de l'État, dans la société civile{teal} »{/teal} (*Sur la question juive*, I). Or ces deux vies sont celles du même homme, qui vit donc deux fois : {teal}« {/teal}l'homme mène, non seulement dans la pensée, dans la conscience, mais dans la réalité, dans la vie, {teal}__une vie double, une vie céleste et terrestre__{/teal} : la vie dans la communauté politique où il s'affirme comme un être communautaire et la vie dans la société civile, où il agit en homme privé, considère les autres comme des moyens, se ravale lui-même au rang de moyen{teal} »{/teal} (*ibid*.). {amber}Le citoyen et le bourgeois sont le même homme coupé en deux{/amber} : la vie générique monte au ciel de l'État, la vie matérielle reste sur terre (voir [[g-vie-materielle|vie matérielle]]).

    __**Dans l'État, la vie générique n'est qu'**__{red}__**imaginaire**__{/red}__**, et l'émancipation humaine la fait rentrer dans la vie de l'individu.**__ La communauté politique n'est pas fausse, mais elle est sans prise sur ce que l'homme fait réellement : il vote en membre du genre, mais il travaille, achète et vend en individu privé. Son universalité n'existe donc que dans le droit et le vote, et {teal}« {/teal}dans l'État, où il est considéré comme un être générique, {teal}__l'homme est le membre imaginaire d'une souveraineté illusoire__{/teal}, dépouillé de sa vie réelle d'individu et empli d'une universalité irréelle{teal} »{/teal} (*ibid*.). D'où la différence entre deux émancipations. L'{violet}émancipation politique{/violet}, celle des droits de l'homme, laisse intacte cette coupure, parce que ces droits sont ceux de l'homme privé : la liberté y est {teal}« {/teal}{teal}__le droit de cette séparation, le droit de l'individu borné, enfermé en lui-même__{/teal}{teal} »{/teal} (*ibid*.), et son application est le droit de propriété. L'{violet}émancipation humaine{/violet} la supprime, en faisant passer la vie générique dans la vie de chacun : {teal}« {/teal}C'est seulement lorsque l'homme individuel, réel, aura recouvré en lui-même le citoyen abstrait et qu'il sera devenu, lui, homme individuel, {teal}__un être générique dans sa vie empirique, dans son travail individuel, dans ses rapports individuels__{/teal} ; lorsque l'homme aura reconnu et organisé {teal}__ses forces propres comme forces sociales__{/teal} [...] c'est alors seulement que l'émancipation humaine sera accomplie{teal} »{/teal} (*ibid*.). {coral}La vie générique doit passer dans la vie quotidienne de chacun, son travail et ses rapports avec les autres{/coral}. Ce qui reste commun aux deux sens du mot est là : est générique l'universel et le lien social, contre l'isolement égoïste. Et puisque la citation demande que l'homme soit générique {teal}« {/teal}dans son travail individuel{teal} »{/teal}, c'est dans le travail qu'il faut chercher ce lien : en 1843, l'universel est projeté dans le ciel de l'État ; en 1844, Marx le cherche sur la terre de la production.

    ! « Générique » désigne, en 1843 comme en 1844, ce qui rapporte l'homme à l'espèce entière et au lien commun, contre l'individu isolé : la communauté politique d'abord, la production ensuite.

    ! La procréation n'est pas pour Marx une fonction animale : elle ne devient bestiale que séparée du reste des activités humaines. Mais en 1844 « la vie engendrant la vie » désigne la production, et la procréation n'entre dans la production de la vie qu'en 1845.

    ! L'État n'est pas pour Marx la vraie vie générique : il en est la forme séparée, donc imaginaire.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | *Sur la question juive*, I | l'État, vie générique opposée à la vie matérielle ; la vie double ; l'émancipation humaine |
    | *Manuscrits de 1844*, premier manuscrit, travail aliéné | la vie productive, vie engendrant la vie ; le double renversement de la vie générique et de la vie individuelle |
    | *Manuscrits de 1844*, troisième manuscrit, propriété privée et communisme | vie individuelle et vie générique ne diffèrent pas, même devant la mort |
    | *L'Idéologie allemande*, I | la production de la vie, par le travail et par la procréation |

    **Voir aussi** : [[g-etre-generique|Être générique]] · [[g-travail-aliene|Travail aliéné]] · [[g-vie-materielle|Vie matérielle]] · [[g-activite-vitale|Activité vitale]] · [[g-etre-naturel|Être naturel]] · [[g-communaute|Communauté]]
