# Cours sur la dimension philosophique de l'œuvre de Marx, tiré de
# l'introduction de Lucien Sève aux Écrits philosophiques de Marx (Flammarion,
# « Champs classiques », 2011) : voir l'en-tête de philo1. Ici : partie 4,
# « Un philosophique de nouvelle sorte » (ce qu'est une catégorie
# philosophique, d'après Lénine ; puis les trois opérations du renversement de
# la logique hégélienne : fin de la forme-système, nouveau rapport de
# l'objectif et du subjectif, irruption de l'espace-temps réel).
#
# Citations : 1re thèse sur Feuerbach dans les Éditions sociales (volume de
# L'Idéologie allemande) ; Lénine (Matérialisme et empiriocriticisme), Hegel,
# Feuerbach et l'Introduction de 1844 (« l'homme, c'est le monde de
# l'homme ») dans la traduction de Sève. L'exemple de la symétrie et de la
# brisure de symétrie, que Sève développe dans d'autres ouvrages, est
# seulement mentionné.

id: philo4
title: "Un philosophique de nouvelle sorte"
subtitle: "La catégorie, rapport universel entre nous et les choses ; ce que le renversement matérialiste change à la logique : ni système, ni objectif sans subjectif, ni logique hors de l'espace et du temps"
group: "Le philosophique chez Marx"
icon: compass
color: coral
lessons:
- id: philo4-l1
  title: "Ce qu'est une catégorie philosophique : la leçon de Lénine"
  notes: |-
    **Pour savoir ce que sont les catégories chez Marx, le détour par** {sky}**Lénine**{/sky} **est décisif : il montre qu'une catégorie philosophique** {coral}**ne dit pas les propriétés d'un objet, mais notre rapport universel à lui**{/coral}**.** L'œuvre philosophique de Lénine (*Matérialisme et empiriocriticisme*, *Cahiers philosophiques*), recouverte par le mépris, avait été redécouverte en 1968 par {sky}Althusser{/sky}, devant la Société française de philosophie ; l'effort est à reprendre.

    **Le débat : « la matière disparaît ».** Vers 1900, la « nouvelle physique » de l'électron résout la matière en particules qu'on croit alors sans masse mécanique : on en conclut que {red}« la matière disparaît »{/red}, donc que le matérialisme est périmé. Sottise philosophique, répond Lénine dans *Matérialisme et empiriocriticisme* : {teal}« {/teal}"La matière disparaît", cela veut dire que disparaît {teal}__la limite jusqu'à laquelle nous connaissions la matière__{/teal}, que notre connaissance s'approfondit ; […] Car l'unique "propriété" de la matière dont la reconnaissance est inséparable du matérialisme philosophique, c'est d'{teal}__être une réalité objective__{/teal}, d'{teal}__exister en dehors de notre conscience__{/teal}.{teal} »{/teal}

    **D'où la distinction décisive.**

    | Matière | Concept scientifique | Catégorie philosophique |
    | dit | les propriétés de l'objet | notre rapport à l'objet |
    | change | avec nos connaissances | non, ou en temps long |
    | exemple | impénétrabilité, inertie, masse | ce qui existe hors de la conscience |

    Le {pink}concept scientifique{/pink} de matière change avec la physique ; la {green}catégorie philosophique{/green} demeure, parce qu'elle n'énonce pas une propriété de l'objet mais {coral}la propriété de notre rapport cognitif le plus général avec lui{/coral} : il existe en dehors de la conscience que nous en avons, ou non. L'électron existe-t-il ? Les physiciens répondent oui : c'est tout ce que demande le matérialisme.

    **Une définition généralisable.** Toute catégorie philosophique est un {violet}concept de rapport universel entre nous et les choses{/violet}, où l'objectif et le subjectif sont indissociables. Exemples :
    - {yellow}contradiction dialectique{/yellow} : tout rapport que seuls définissent ses contraires ;
    - {yellow}quantité{/yellow} : ce qui, dans les choses, se prête à une activité de mesure ;
    - {yellow}base{/yellow} : l'aspect d'une réalité qui seul permet d'en rendre raison.

    Tout concept vise un objet et est visé par un sujet ; le propre de la catégorie est que {amber}sa dimension subjective entre dans sa définition objective{/amber} : la conscience du physicien n'entre pas dans le concept physique de matière ; la conscience humaine entre dans la catégorie de matière. Toute catégorie est donc {violet}gnoséologique{/violet} (elle concerne la connaissance) en même temps qu'{violet}ontologique{/violet} (elle concerne l'être). Elles sont les {green}déterminations-de-sens universelles de nos rapports cognitifs ou actifs avec le monde{/green} ; d'où leur importance cardinale pour toute pensée et toute action.
