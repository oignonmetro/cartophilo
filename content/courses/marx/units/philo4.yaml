- id: philo4-l5
  title: "L'espace et le temps réels dans le logique"
  notes: |-
    **Troisième opération, méconnue : être matérialiste, c'est reconnaître que les catégories renvoient non seulement à des « essentialités pures », comme dit Hegel, mais à des matérialités impures ; or** {coral}**qui dit matérialité dit espace et temps réels**{/coral}**.**

    **Chez Hegel, un espace et un temps de pure logique.** Ses catégories semblent faire place à l'espace et au temps : l'{blue}*Entäusserung*{/blue}, sortie objectivante de soi (interne / externe), la {blue}*Voraussetzung*{/blue}, présupposition (antérieur / ultérieur). Mais ce serait un contresens que de les rapporter au monde réel. Hegel le dit dès la Logique de l'être : {teal}« {/teal}Une existence telle que la matière sensible {teal}__n'a pas encore sa place ici__{/teal}, pas plus que l'espace et les déterminations spatiales.{teal} »{/teal} La *Logique* expose l'essence de Dieu « avant la création de la nature » : elle ne peut contenir que du {red}pseudo-spatial{/red} et du {red}pseudo-temporel{/red}.

    **Chez Marx, les catégories en prise sur le monde.**
    - L'{blue}*Entfremdung*{/blue}, aliénation du travail salarié, repose sur une {green}séparation spatio-temporelle radicale{/green} entre les producteurs directs et les moyens de production : l'ouvrier n'a pas d'usine, l'usine n'est pas à lui. C'est la base du capitalisme.
    - La {blue}*Voraussetzung*{/blue}, sans cesser d'être présupposition logique, renvoie aux {green}préconditions sociales{/green} qui jouent un rôle cardinal dans les logiques de l'histoire.

    **Une autre dialectique.** La dialectique de Hegel donne toujours l'{amber}un comme vérité du multiple{/amber}, l'{amber}interne comme vérité de l'externe{/amber} : « un se divise en deux » pour retourner en Un, d'où un fond théologique, téléologique, et un {red}conservatisme ultime{/red}. Le renversement matérialiste ne la prive pas de sens, mais lui accorde autant son opposé :

    | Dialectique | Formule | Exemple |
    | nécessitante, orientée | un se divise en deux | l'embryogenèse |
    | féconde en contingence | deux fusionnent en un | la planétogenèse |

    Dans la première, l'embryon se différencie selon un ordre qui va vers une fin ; dans la seconde, des corps distincts s'agrègent sans que rien n'y tende, et pourraient se séparer de nouveau : {green}fécondité du multiple, productivité de l'externe{/green}, et donc {coral}contingence dans les processus{/coral}. De même, à quitter la logique « pure », on découvre que les contraires d'une contradiction peuvent être placés de façon {yellow}symétrique{/yellow} ou {yellow}dissymétrique{/yellow}, dans l'espace comme dans le temps, avec des propriétés logiques toutes différentes ; Marx y a été attentif sans en tirer la théorie.

    **Bilan.** Marx n'a pas mené à bien en tous points la refonte matérialiste de la logique de Hegel. Mais sa catégorisation rompt avec l'assurance du système clos, fait constamment place au {green}possible{/green} et à la {green}pratique humaine{/green} dans la manifestation du nécessaire. Seuls ceux qui l'ont peu lu peuvent lui imputer une mythologie du {red}« Grand Récit »{/red} historique : son œuvre est aux antipodes de la pensée doctrinaire.
