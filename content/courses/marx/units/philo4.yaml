- id: philo4-l4
  title: "L'objectif et le subjectif"
  notes: |-
    **Hegel et Feuerbach pensent l'objectif et le subjectif chacun d'un côté ; Marx noue entre eux une** {coral}**connexion dialectique tout à fait neuve**{/coral} **: un** {violet}**matérialisme de l'activité**{/violet}**.**

    **Deux positions renversées l'une par l'autre.**
    - {sky}**Hegel**{/sky} : la *Logique* semble aller de l'objectif (l'être, l'essence) au subjectif (le concept) ; en réalité elle chemine vers l'objectivité, la plénitude de l'« être en et pour soi du concept ». L'{sky}*Encyclopédie*{/sky} part de Dieu « dans son essence éternelle, avant la création de la nature » et passe « du concept de Dieu à son existence » : c'est un {red}idéalisme objectif{/red}.
    - {sky}**Feuerbach**{/sky} renverse les deux termes. La vraie objectivité n'est pas Dieu mais la {green}nature{/green} : {teal}« {/teal}seul est objet ce qui existe {teal}à l'extérieur de la tête »{/teal} ; le vrai sujet n'est pas la substance mais {green}l'homme concret{/green} : {teal}« {/teal}c'est {teal}l'homme qui pense{/teal}, non […] {teal}la raison »{/teal}. L'homme en son individualité sensible est la mesure de toute chose : un {red}matérialisme subjectif{/red}.

    **La 1re thèse sur Feuerbach.** {teal}« {/teal}Le principal défaut, jusqu'ici, du matérialisme de tous les philosophes, y compris celui de Feuerbach, est que l'objet, la réalité, le monde sensible n'y sont saisis que {teal}__sous la forme d'objet ou d'intuition__{/teal}, mais non {teal}__en tant qu'activité humaine concrète, non en tant que pratique__{/teal}, de façon subjective.{teal} »{/teal} Autrement dit : l'objectif reste ce qui est {amber}à l'extérieur de la tête{/amber}, et subsiste en son autonomie hors du cerveau, Marx y insiste encore en 1857 ; mais cette extériorité ne nous apparaît jamais qu'{amber}à l'intérieur de notre rapport avec elle{/amber}, qui est d'une façon ou d'une autre pratique. Notre connaissance n'atteint l'objectivité de l'objet {coral}qu'en étant activement subjective{/coral} : on connaît le fer en le forgeant. D'où une position que personne n'avait occupée : un {violet}matérialisme de l'activité{/violet} ({blue}*Tätigkeit*{/blue}).

    **Objectivité et objectalité.** L'objectivité a un double sens matérialiste, à ne pas confondre :

    | Terme | Allemand | Sens |
    | objectivité | {blue}*Objektivität*{/blue} | justesse d'un savoir par rapport à l'objet |
    | objectalité | {blue}*Gegenständlichkeit*{/blue} | concrétisation d'une activité dans un objet |

    L'{violet}objectalisation{/violet} ({blue}*Vergegenständlichung*{/blue}) de l'activité est la dimension fondamentale de tout agir productif : le travail se dépose dans son produit.

    **Côté subjectif, tout un monde.** Au concept hégélien, riche et objectif, Feuerbach n'opposait qu'un homme abstrait ; Marx oppose le {green}monde historico-social tout entier{/green} : forces productives, rapports de classe, institutions, formes de conscience. {teal}« {/teal}L'homme, c'est {teal}__le monde de l'homme__ »{/teal}, dit l'*Introduction* de 1844. C'est un {violet}matérialisme objectif de la subjectivité{/violet}, qui dépasse le dilemme du {red}kantisme{/red} (la critique) et de l'{red}hégélianisme{/red} (l'assurance ontologique) : une subjectivité active de l'objectif, une objectivité sociale du subjectif.

    **Conséquence pour les catégories.** Plus de partage entre « logique objective » et « logique subjective » : toutes sont à la fois gnoséologiques et ontologiques, avec des pôles.
    - catégories {amber}gnoséologiques à portée ontologique{/amber} : {yellow}abstraction{/yellow} ;
    - catégories {amber}ontologiques à portée gnoséologique{/amber} : {yellow}base{/yellow} ;
    - {amber}catégories de la pratique{/amber}, où domine la dimension active : {yellow}liberté{/yellow}.
