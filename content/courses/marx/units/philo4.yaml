- id: philo4-l2
  title: "D'où viennent les catégories ?"
  notes: |-
    **La définition des catégories comme rapports entre nous et les choses éclaire le choix de Marx : il reprend le mot de Kant contre Hegel, pour** {coral}**rouvrir une perspective critique**{/coral}**, mais va bien au-delà de Kant en posant la question décisive : d'où viennent nos catégories ?**

    **Contre Hegel : rouvrir la critique.** Parlant le langage du {violet}concept{/violet}, Hegel s'émancipe de la perspective critique au sens de Kant : sa *Logique* s'installe d'emblée dans l'être, c'est un {red}dogmatisme du concept{/red}. {sky}Feuerbach{/sky} le refusait déjà : ce n'est pas le concept qui pense dans la tête de l'homme, c'est {green}l'homme qui pense le concept{/green}. En reprenant le mot de {violet}catégorie{/violet}, Marx rouvre consciemment une perspective critique : les concepts ne sont rien d'autre qu'une {coral}transposition du réel dans nos têtes{/coral}.

    **Au-delà de Kant : la genèse des catégories.** Kant se contente d'un {red}sujet transcendantal{/red}, plus abstrait encore que « l'homme » de Feuerbach. Et comme ses catégories ne sont pas des transformées mentales du réel, elles nous {red}enferment dans notre subjectivité{/red} : nous ne connaissons que les phénomènes, jamais les choses. À ce prétendu fait transcendantal inexpliqué, il faut opposer la question : {amber}__d'où proviennent les catégories dans lesquelles nous pensons ?__{/amber}

    **La réponse du matérialisme historique.** C'est ici qu'il révèle sa {violet}portée gnoséologique{/violet} : il n'y a d'attitude vraiment critique que fondée sur une {green}élucidation historico-matérialiste de la genèse de nos catégories{/green}. Elle seule fait comprendre que {coral}si le monde est concevable, c'est que notre conceptualisation est d'origine mondaine{/coral} : nos catégories viennent du monde, de notre activité en lui, et c'est pourquoi elles le saisissent. Marx n'a pas écrit cette histoire immense, mais il en a versé des acomptes, notamment dans l'{sky}Introduction de 1857{/sky}.

    **Le philosophique marxien et ses trois opérations.** Dans l'œuvre de maturité se trouve donc, souvent sans être thématisée, une {violet}élaboration catégorielle{/violet} novatrice : ce que {sky}Sève{/sky} appelle le {green}philosophique marxien{/green}. Passer d'un système idéaliste de logique à une catégorisation émancipée de tout caractère spéculatif, idéaliste et systématique exige trois opérations :
    - l'{amber}éradication de la forme-système{/amber} ;
    - la {amber}transmutation du rapport objectif-subjectif{/amber} ;
    - l'{amber}irruption de la spatio-temporalité réelle dans le logique{/amber}.
