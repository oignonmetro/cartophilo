- id: philo4-l3
  title: "La fin de la forme-système"
  notes: |-
    **Pour Hegel, la logique ne peut s'exposer qu'en système ; le renversement matérialiste commence par** {coral}**liquider cette forme-système**{/coral}**, close et réductrice, pour un** {violet}**réseau ouvert**{/violet} **de catégories.**

    **La forme-système selon Hegel.** {teal}« {/teal}Une démarche philosophique {teal}sans système{/teal} ne peut {teal}rien être de scientifique. »{/teal} Le vrai n'est pas dans une proposition isolée, mais dans le tout de la pensée, et ce tout n'est vrai que si ses moments s'enchaînent par une nécessité interne. La forme-système traduit l'{violet}autodéveloppement du concept{/violet} : c'est de lui-même que l'{yellow}être{/yellow} passe au {yellow}néant{/yellow}, et leur rapport au {yellow}devenir{/yellow}. Supprimer le système, ce serait détruire le logique.

    **Trois raisons de la rejeter.**
    - {red}__Elle est idéaliste.__{/red} L'autodéveloppement du concept, c'est la {violet}métamorphose acritique de l'abstraction en sujet{/violet} : exactement ce que Marx a rejeté avec « la philosophie ». À l'illusion théologique d'un système logique autonome doit succéder l'attention à la {green}genèse profane{/green} de nos catégories.
    - {red}__Elle est close.__{/red} La liste des catégories y est étrangère au temps des savoirs et des pratiques. Or si les catégories ne changent pas au rythme des concepts scientifiques, elles ont, en temps long, une {green}histoire ouverte{/green}, que Marx a beaucoup élargie.
    - {red}__Elle est réductrice.__{/red} D'où l'omniprésence de la {violet}triade{/violet} chez Hegel, qui sent le formalisme ; lui disait n'y voir qu'une « table des matières », alors qu'on la retrouve sans cesse dans le contenu. La raison est profonde : dans la série linéaire du système, chaque catégorie a une {amber}place marquée{/amber}, un seul contraire, donc un seul troisième terme. Ainsi la {yellow}forme{/yellow} n'est traitée qu'une fois, dans la Logique de l'essence, alors qu'elle a trois contraires et aurait sa place partout : forme et matière (Logique de l'être), forme et essence (Logique de l'essence), forme et contenu (Logique du concept). Le système l'{red}assigne à résidence{/red}.

    **Ce qui le remplace : non un catalogue, un réseau.** Il ne s'agit pas de retomber dans l'{red}empirisme{/red} d'une collection contingente. Marx ne recense nulle part ses catégories, mais veille à leur cohérence : chaque catégorie, étant universelle, {coral}affecte toutes les autres{/coral}. Si essence change de sens, toutes les catégories changent en leur essence ; si l'abstraction est repensée, toutes deviennent des abstractions d'une autre sorte.
    - plus de {red}système de places{/red} : chaque catégorie se développe dans toutes ses directions (d'où des sens non hégéliens d'{blue}*Entfremdung*{/blue}, {blue}*Grundlage*{/blue}, {blue}*Vergegenständlichung*{/blue}) ;
    - la triade devient {amber}exceptionnelle{/amber} ; une catégorie vit en {green}groupe{/green}, avec des partenaires dérivés autant qu'opposés : {yellow}objectif{/yellow} fait corps avec subjectif, mais aussi avec objectal, avec fétichisé.

    D'après le {blue}*rationeller Kern*{/blue} (« noyau rationnel ») de Marx, on peut parler de {violet}noyaux catégoriels{/violet} plutôt que de catégories.
  points:
