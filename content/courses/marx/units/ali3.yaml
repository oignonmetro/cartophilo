id: ali3
title: "Objectivation et aliénation"
subtitle: "Hegel et Feuerbach ; l'aliénation comme séparation, le sujet pur et les trois aspects ; l'objectivation accomplit le travail, l'aliénation est la perte de l'objet"
icon: compass
color: teal
group: "L'aliénation dans les Manuscrits de 1844"
lessons:
- id: ali2-l3
  title: "Hegel et Feuerbach : deux façons de supprimer l'aliénation"
  notes: |-
    {sky}**Hegel**{/sky} **et** {sky}**Feuerbach**{/sky} **ne mettent pas l'aliénation au même endroit :** {red}**Hegel se scandalise de l'objectivité en tant que telle**{/red}**,** {pink}**Feuerbach seulement de l'extériorité de l'objet**{/pink}**.** D'où deux conceptions de la {violet}désaliénation{/violet}, que Marx rejette l'une et l'autre.

    **Pour une philosophie de la conscience (comme celle de** {sky}**Hegel**{/sky}**), l'objectivité est l'autre de la conscience, à surmonter.** Quand la conscience est en rapport avec un objet, elle peut se croire aliénée, parce qu'elle pense être en relation avec quelque chose d'autre qu'elle. Le philosophe doit montrer qu'il n'en est rien : {coral}l'objectivité n'est qu'une détermination interne à la conscience{/coral}, qui, {amber}__en rapport avec l'objet, est encore en rapport avec elle-même__{/amber}. C'est tout l'objet de la {sky}*Phénoménologie de l'esprit*{/sky}, à laquelle Marx se rapporte explicitement dans le troisième manuscrit, pour en faire l'éloge sur bien des points, mais {red}pas sur celui-là{/red}.

    {sky}**Feuerbach**{/sky} **échappe en partie à cette démarche.** Contre {pink}Hegel{/pink}, il soutient qu'il n'y a pas de conscience immédiate de soi : {coral}toute conscience de soi passe d'abord par la conscience d'objet{/coral}, c'est-à-dire par la conscience de soi sous forme objective. Mais il faut ensuite {amber}reprendre en soi ce qu'on a d'abord mis de soi dans l'objet{/amber}. Pour __sortir de l'aliénation religieuse__, l'homme doit __se réapproprier__ {yellow}les prédicats humains qu'il a d'abord objectivés en Dieu{/yellow}, et reconnaître qu'ils sont les siens. Feuerbach ne nie donc plus l'objectivité elle-même, mais il veut encore {coral}dépouiller un contenu de la forme objective qu'il a d'abord dû prendre{/coral}.

    **La différence : l'objectivité comme telle, ou l'extériorité de l'objet.**
    - {sky}Hegel{/sky} pointe {red}__l'objectivité en tant que telle__{/red} : la {violet}désaliénation{/violet} est {amber}la négation de l'objectivité elle-même{/amber}. L'objet n'est qu'une détermination interne au sujet, le {violet}négatif{/violet} que le sujet doit nier pour se poser, et qui n'est pas extérieur à lui. Il y a donc chez Hegel {coral}une sorte d'annihilation de l'objectivité{/coral}, entièrement reprise et digérée par le sujet, qui n'est désaliéné que lorsqu'il tient toute objectivité pour un moment interne de lui-même.
    - {sky}Feuerbach{/sky} pointe {pink}__l'objectivité aliénée__{/pink} : la {violet}désaliénation{/violet} est {amber}la négation de l'extériorité de l'objet{/amber}, non de l'{red}objectivité{/red} ; il s'agit de {amber}réintérioriser ce qui a été posé au dehors{/amber}.

    | Philosophe | Ce qui aliène | La désaliénation |
    | Hegel | l'objectivité comme telle | nier l'objectivité |
    | Feuerbach | l'extériorité de l'objet | réintérioriser l'essence |

    ! Feuerbach n'est pas du côté de Marx contre Hegel : il garde l'objectivité, mais seulement pour la reprendre en soi, comme si avoir son essence au dehors était en soi un mal.
  points:
  - id: ali2-l3-p1
    sentence: "**Hegel** se scandalise de l'objectivité en tant que telle ; __Feuerbach se scandalise seulement de l'__ ___ **de l'objet**."
    answer: "extériorité"
