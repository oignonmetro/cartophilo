- id: ali3-l2
  title: "Le produit étranger : l'ouvrier dominé par son œuvre"
  notes: |-
    **Premier aspect de l'aliénation : l'objet que le travailleur produit lui devient** {red}**étranger**{/red}**, et plus il produit, plus cet objet l'emporte sur lui.** En produisant, le travailleur extrait de lui-même quelque chose qui, une fois déposé dans le produit, lui devient {coral}méconnaissable{/coral} : il ne peut plus reconnaître l'objet comme le sien.

    **Une puissance qui grandit contre lui.** {teal}« {/teal}Par définition, l'ouvrier se trouve devant le produit de son propre travail {teal}__dans le même rapport qu'à l'égard d'un objet étranger__{/teal}. S'il en est ainsi, il est évident que, plus l'ouvrier se dépense au travail, plus le monde étranger, objectif, qu'il crée en face de lui {teal}__devient puissant__{/teal}, plus il s'appauvrit lui-même et plus son monde intérieur devient pauvre, moins il possède en propre{teal} »{/teal} (*Manuscrits de 1844*, premier manuscrit, p. XXII). Autrement dit : les objets que le producteur engendre s'accumulent et forment {coral}une puissance étrangère supérieure à la sienne{/coral}. Dans ce premier temps, l'aliénation est {amber}la domination du producteur par l'objet produit{/amber}.

    **La dette envers Feuerbach.** Marx l'avoue lui-même : {teal}« {/teal}C'est la même chose avec la religion. {teal}__Plus l'homme projette de choses en Dieu, moins il en garde en lui-même__{/teal}. L'ouvrier place sa vie dans l'objet. Mais alors celle-ci ne lui appartient plus, elle appartient à l'objet{teal} »{/teal} (*ibid*.), en reprenant presque littéralement {sky}*L'Essence du christianisme*{/sky} de {sky}Feuerbach{/sky}. Dans la religion, l'homme extrait de lui des qualités qu'il objective sous la forme de Dieu ; plus il enrichit Dieu, plus il s'appauvrit. De même, {coral}plus le travailleur se vide de sa substance en l'objectivant dans ses produits, plus l'objet s'enrichit en déterminations{/coral} et gagne en puissance, puissance qu'il exerce en retour sur lui : {teal}« {/teal}Il n'est pas ce qu'il produit par son travail. {teal}__Plus ce produit gagne en substance, moins l'ouvrier est lui-même__ »{/teal}.

    | Chez Feuerbach (la religion) | Chez Marx (le travail) |
    | l'homme met ses qualités en Dieu | l'ouvrier met sa vie dans l'objet |
    | Dieu s'enrichit, l'homme s'appauvrit | le produit gagne en substance |
    | Dieu est une puissance étrangère | l'objet est une puissance autonome |

    **Ce que la conclusion du passage semble confirmer.** {teal}« {/teal}L'aliénation de l'ouvrier dans son produit signifie non seulement que son travail devient un objet, une réalité extérieure, mais que son travail existe en dehors de lui, indépendamment de lui, {teal}__étranger à lui__{/teal}, et devient {teal}__une puissance autonome face à lui__{/teal}, que la vie qu'il a prêtée à l'objet s'oppose à lui, hostile et étrangère{teal} »{/teal} (*ibid*.). On croit alors avoir compris l'essentiel : l'aliénation serait {amber}la perte de soi dans l'objet{/amber}, le devenir étranger à soi dans l'objet et l'emprise qu'il exerce en retour sur un soi vidé de sa substance, comme l'essence humaine passe en Dieu chez Feuerbach alors qu'elle n'est que la leur. Marx n'aurait fait que transférer l'aliénation religieuse à l'aliénation du travail.

    ! Cette lecture est la plus évidente, et elle est incomplète : si l'ouvrier avait seulement tout versé dans l'objet, il serait difficile de dire qu'il est « privé d'objets ».
