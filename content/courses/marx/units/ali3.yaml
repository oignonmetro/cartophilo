    sentence: "« L'homme est posé comme égal au Soi. Mais __le Soi n'est que l'homme saisi__ ___ et engendré par abstraction. »"
    answer: "abstraitement"
    alt: []
  - id: ali2-l4-p17
    sentence: "__L'aliénation n'est pas une simple croyance__ : la conception de soi comme sujet pur est le ___ d'une séparation réelle de l'ouvrier d'avec son travail, et on ne la corrige pas en changeant d'idée."
    answer: "symptôme"
    alt: ["signe", "effet", "produit", "expression"]
  - id: ali2-l4-p18
