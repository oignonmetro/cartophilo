- id: ali2-l4b
  title: "Le sujet pur : ce que la séparation fait de l'homme"
  notes: |-
    **Le** {violet}**sujet pur**{/violet} **est ce que cette séparation fait de l'homme, puis la façon dont il se pense.** Un homme réduit à une __force purement subjective__, séparée de tout objet, est de fait {coral}un sujet pur, sans objectivité{/coral} : c'est ce que sa situation fait de lui. Et cette situation, les hommes, et les philosophes avec eux, la prennent pour leur nature : ils se conçoivent comme {red}des sujets, distincts par nature de l'objectivité{/red}, comme {yellow}« un empire dans un empire »{/yellow} pour le dire avec {sky}Spinoza{/sky}. Cette conception naît d'une {coral}abstraction{/coral}, d'un isolement de soi hors du tout : {teal}« {/teal}L'homme est posé comme égal au Soi. Mais {teal}__le Soi n'est que l'homme saisi abstraitement et engendré par abstraction__ »{/teal} (troisième manuscrit, p. XXII). Se concevoir comme un pur soi {coral}exprime donc une amputation{/coral}, celle de la dimension objective de l'être des hommes : {amber}rien n'atteste mieux l'aliénation des hommes{/amber} que cette conception d'eux-mêmes.

    **Pourquoi cette conception relève-t-elle de l'**__**aliénation**__**, et n'est-elle pas seulement fausse ?**
    - {amber}__Elle exprime une situation réelle__{/amber}, et non une simple méprise : {coral}l'ouvrier est réellement réduit à une force sans objets (purement subjective){/coral}. On ne la corrige donc pas en changeant d'idée, mais en changeant la situation dont elle est le signe ;
    - {amber}__Elle prend un résultat pour un point de départ__{/amber} : ce que la séparation a produit passe pour la nature de l'homme, et la perte ne se voit plus comme une perte ;
    - {amber}__Elle consacre l'impuissance__{/amber} : un sujet qui se croit pure activité souveraine est privé de ce sans quoi son activité ne s'exerce pas, la matière et les outils. {coral}Le sujet « souverain et autonome » est une figure de l'impuissance{/coral}, celle d'__hommes dépossédés de leur propre objectivité__, donc de toute maîtrise de l'objectivité en général.

    **Marx n'est pas ici du côté de Hegel.** {sky}Hegel{/sky} tient le sujet pur, le Soi, pour la vérité de l'homme, et la désaliénation pour son accomplissement. Marx y voit {red}ce que l'aliénation produit{/red}, et non ce qu'elle viendrait corrompre.

    ! L'aliénation n'est pas une croyance mais l'origine matérielle d'une croyance : ce n'est pas parce qu'on se pense sujet pur qu'on est aliéné, c'est parce qu'on est réellement séparé de son produit et des conditions de son travail qu'on se pense ainsi.
  points:
  - id: ali2-l4-p7
    sentence: "**Rien n'atteste mieux l'aliénation des hommes**, selon Marx, __que la conception qu'ils se font d'eux-mêmes comme__ ___, distincts par nature de l'objectivité."
    answer: "sujets"
    alt: []
  - id: ali2-l4-p8
    sentence: "Se concevoir comme sujet séparé du reste de la nature, c'est se penser, avec **Spinoza**, comme « __un__ ___ __dans un empire__ »."
    answer: "empire"
    alt: []
