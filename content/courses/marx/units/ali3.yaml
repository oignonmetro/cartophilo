- id: ali3-l3
  title: "Produire sans objet : le paradoxe de l'ouvrier « privé d'objets »"
  notes: |-
    **Pour Marx, l'aliénation est une objectivation qui s'effectue comme perte de l'objet : plus l'activité du travailleur est grande, plus il est** {red}**privé d'objets**{/red}**.** C'est ce que dit la phrase qui, au milieu de l'analyse précédente, la met en défaut :

    {teal}« {/teal}L'ouvrier place sa vie dans l'objet. Mais alors celle-ci ne lui appartient plus, elle appartient à l'objet. {teal}__Plus cette activité est grande, plus l'ouvrier est privé d'objets__ »{/teal} (*Manuscrits de 1844*, premier manuscrit, p. XXII). « Privé d'objets » rend l'allemand {violet}*gegenstandslos*{/violet}, littéralement « sans objet ».

    **Pourquoi la phrase fait problème.** Si l'aliénation était le transfert de la vie de l'ouvrier dans l'objet, il aurait tout donné à l'objet ou aux objets, jusqu'à leur donner vie en leur donnant la sienne : loin d'être sans objet, il serait écrasé par eux. Comment dire d'un homme tombé sous la dépendance de ce qu'il a produit qu'il est « sans objet » ?

    **Le cadre qui interdit de comprendre.** On ne comprend pas cette phrase tant qu'on reste dans l'opposition entre {violet}sujet{/violet} et {violet}objet{/violet} (ou entre activité et passivité, subjectivité et objectivité). Dans ce cadre, on tient l'aliénation pour la perte, dans l'objet, de quelque chose qui n'est pas objectif, donc subjectif : on {red}confond l'aliénation avec l'objectivation{/red} (*Vergegenständlichung*), on prend la production de l'objet pour la négation de soi d'un être qui serait, en lui-même, sujet et non objet.

    **Un modèle qui présuppose ce qu'il veut expliquer.** Ce modèle part d'un sujet actif et productif et conçoit l'aliénation comme la fixation de cette activité dans l'objet produit. Pour Marx, il {coral}admet déjà le fait de l'aliénation{/coral} : il part, comme d'un fait, de ce que l'aliénation produit, un sujet qui se conçoit comme essentiellement actif, donc coupé de l'objectivité, et qui peut d'autant mieux se concevoir comme purement actif que tous ses objets lui ont été soustraits. Il pense comme un point de départ un sujet qui est {coral}un résultat{/coral}.

    **Ce que dit Marx à la place.** Le travail est naturellement un processus d'objectivation, et {green}s'objectiver n'est pas aliénant{/green}. Il est normal, presque tautologique, que le travail devienne objet au terme de l'activité de produire, et que l'objet y trouve son accomplissement. L'aliénation est autre chose : {red}l'objet produit se met à mener sa vie de façon autonome{/red}, indépendamment de celui qui l'a produit, et se détache de l'activité dont il est pourtant l'accomplissement. L'objet existe, mais il n'est plus l'accomplissement du travailleur : {coral}son activité aboutit pour lui à une absence d'objet{/coral}, et c'est cette privation d'accomplissement qui est l'aliénation. C'est la production d'un objet {amber}toujours déjà perdu{/amber}, une activité productive toujours déjà sans objet. Un exemple familier, qui n'est pas de Marx : {yellow}le tisserand qui fabrique de la toile voit la toile exister, en entrepôt et en vitrine, sans qu'elle lui revienne : son travail a bien un résultat, mais pas pour lui{/yellow}.

    | Lecture | L'aliénation est |
    | Dans le cadre sujet/objet | la perte de soi dans l'objet |
    | Chez Marx | une objectivation qui est perte de l'objet |

    ! Le travailleur aliéné n'est pas « sans objet » parce qu'il ne produirait rien, mais parce que ce qu'il produit ne lui revient pas.
