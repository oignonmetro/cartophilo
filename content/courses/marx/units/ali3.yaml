# Cours sur Marx (piste Idées), tiré d'un cours magistral d'agrégation sur
# Marx, séance du 20 octobre 2026 (« CM 4 »), première moitié : l'objectivation
# comme accomplissement du travail, le produit étranger, le paradoxe de
# l'ouvrier « privé d'objets » (voir content/philosophie.md, « Un cours sur un
# auteur, tiré d'un commentaire »). Transcription corrigée : D:\Downloads\cours
# fischbach\transcriptions\ (« Manuscrits de 1844, le travail aliéné comme perte
# de l'objet et de l'objectivité »).
#
# Citations des Manuscrits de 1844 dans la traduction GF (Jacques-Pierre
# Gougeon), choisie par l'utilisateur ; le cours lit sa propre traduction.
# Repères : manuscrit et page de Marx (chiffres romains imprimés dans GF). Allemand
# vérifié sur marxists.org (MEW 40). La lecture de *Entäußerung* comme « perte de
# l'expression » est celle du cours, non une glose de Marx. L'exemple du tisserand
# et la distinction « l'objet existe, mais pas pour lui » sont de l'unité.

id: ali3
title: "Objectivation et aliénation"
subtitle: "L'objectivation accomplit le travail ; l'aliénation est la perte de l'objet, non la chute d'un sujet dans la chose"
icon: compass
color: teal
lessons:
- id: ali3-l1
  title: "L'objectivation est l'accomplissement du travail"
  notes: |-
    **Pour Marx, travailler, c'est** {violet}**s'objectiver**{/violet}**, et s'objectiver est** {green}**l'accomplissement du travail**{/green}**.** L'{violet}aliénation{/violet} ne commence pas avec l'objet produit : elle commence lorsque cet accomplissement tourne en {red}perte{/red}.

    **Le produit est le travail devenu objet.** {teal}« {/teal}Le produit du travail est {teal}__le travail qui s'est fixé, matérialisé dans un objet__{/teal}, il est {teal}__l'objectivation du travail__{/teal}. {teal}__La réalisation du travail est son objectivation__ »{/teal} (*Manuscrits de 1844*, premier manuscrit, p. XXII). {violet}Réalisation{/violet} se dit {violet}*Verwirklichung*{/violet}, {violet}objectivation{/violet} se dit {violet}*Vergegenständlichung*{/violet}. Autrement dit, {coral}il n'y a pas de travail qui ne produise un objet{/coral} : l'activité est faite pour se fixer dans la chose produite, et ce passage de l'acte à l'objet lui est nécessaire.

    **Se fixer dans l'objet n'est donc pas déchoir.** {red}Comprendre l'objectivation comme une chute dans l'inertie{/red}, contraire à la vitalité de l'activité productive, serait un contresens. Pour Marx, c'est l'inverse : {teal}« {/teal}L'acte de poser ne signifie pas {teal}__une dégradation de son activité pure, une chute dans la création de l'objet__{/teal}, bien au contraire, son produit objectif ne fait que {teal}__confirmer son activité objective__{/teal}, son activité en tant qu'être objectif naturel{teal} »{/teal} (troisième manuscrit, p. XXVII). L'homme dont il parle est l'homme réel, en chair et en os : ce n'est pas une activité pure qui tomberait dans une chose, c'est un {violet}être objectif{/violet}, et son produit l'atteste. Marx se place là dans une perspective qui a peut-être des sources aristotéliciennes : l'objet produit est {amber}le parachèvement de l'activité productive{/amber}, non sa négation.

    **L'aliénation naît lorsque la réalisation devient perte.** Le passage de l'acte à l'objet n'a rien d'aliénant en lui-même ; ce qui l'est, c'est qu'il tourne, {red}pour celui qui travaille, en déréalisation de lui-même{/red} :

    {teal}« {/teal}Dans le monde de l'économie politique, cette réalisation du travail apparaît comme {teal}__la perte pour l'ouvrier de sa réalité__{/teal}, l'objectivation comme {teal}__la perte de l'objet ou l'asservissement à celui-ci__{/teal}, l'appropriation comme {teal}__l'aliénation, le dessaisissement__ »{/teal} (*ibid*.). « Le monde de l'économie politique » est l'économie réelle telle que la décrivent les économistes, même quand ils ne la décrivent pas en ces termes.

    | Le travail | Normalement | Dans l'économie politique |
    | Réalisation (*Verwirklichung*) | accomplit l'ouvrier | déréalisation (*Entwirklichung*) |
    | Objectivation | donne un objet | perte de l'objet, asservissement |
    | Appropriation | fait sien l'objet | aliénation, dessaisissement |

    **Le dessaisissement est une perte d'expression.** *Entäußerung* est souvent traduit comme un synonyme d'*Entfremdung* (l'aliénation), mais il signifie littéralement une {violet}perte{/violet} : le préfixe *ent-* dit toujours une séparation, une perte, ou les deux (on est séparé de quelque chose qu'on nous prend, donc qu'on perd), et *Äußerung* est l'{violet}expression{/violet}. L'objet produit est, pour celui qui l'a produit, {amber}une expression de soi{/amber} ; l'aliénation est la perte de ce dans quoi on s'est exprimé.

    ! L'aliénation n'est donc pas dans l'objectivation, mais dans ce qu'elle devient : le produit qui devait confirmer le travailleur le dépossède.
