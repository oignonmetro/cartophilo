- id: philo5-l2
  title: "L'abstrait et le concret"
  notes: |-
    **Connexe à l'essence, l'**{violet}**abstraction**{/violet} **(*Abstraktion*), bien plus étudiée : Marx la pense à partir d'un double héritage, et y apporte une distinction lumineuse,** {coral}**concret réel et concret de pensée**{/coral}**.**

    **Le double héritage.**
    - {sky}**Hegel**{/sky} renverse l'idée classique, où le {pink}concret{/pink} est la particularité du sensible et l'{pink}abstrait{/pink} la généralité que l'entendement en détache. Pour lui, la pensée part d'une abstraction {amber}pauvre et unilatérale{/amber} et s'élève vers le concret, {amber}riche de déterminations{/amber} qu'il concentre : le concret est un résultat.
    - {sky}**Feuerbach**{/sky} objecte que ce concret-là est l'abstraction spéculative même, où se perdent les vrais rapports : {green}il n'est de concret que la nature et l'homme{/green}.

    **Le concret réel et le concret de pensée** (Introduction de 1857).

    | Concret | Ce que c'est | Comment il se forme |
    | réel | la chose dans la multitude de ses déterminations | par sa propre histoire |
    | de pensée | ces déterminations recomposées en un tout logique | par l'analyse, puis la synthèse |

    Le {violet}concret de pensée{/violet} (*Gedankenkonkretum*) se forme ainsi : on part d'une représentation confuse (la {yellow}population{/yellow} d'un pays), on l'analyse en déterminations abstraites (classes, travail salarié, capital, valeur), puis la pensée recompose à partir d'elles un tout articulé. Mais ce chemin est celui par lequel l'esprit {green}reproduit{/green} le concret, non celui par lequel le concret {red}se produit{/red}.

    **L'illusion de l'idéalisme s'éclaire alors** : elle consiste à attribuer à la formation du concret réel {red}la même logique{/red} qu'à la production du concret de pensée à partir de l'abstrait. Comme la science du capital part de la valeur et arrive au capital, on croit que la valeur a engendré le capital ; or la genèse réelle est toute autre.

    ! « Partir de l'abstrait pour aller au concret » est chez Marx une méthode d'exposition, juste dans son ordre ; elle devient idéaliste quand on la prend pour l'histoire des choses.
  points:
