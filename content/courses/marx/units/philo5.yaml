- id: philo5-l4
  title: "L'universel, le particulier, le singulier"
  notes: |-
    **L'**{violet}**universalité**{/violet} **(*Allgemeinheit*) est l'un des rares noyaux catégoriels qui prennent chez Marx la forme d'une triade, universel, particulier, singulier ; mais sa façon de penser l'universel** {coral}**rompt avec Hegel**{/coral}**.**

    **La triade** {violet}*Allgemeines*{/violet} / {violet}*Besonderes*{/violet} / {violet}*Einzelnes*{/violet} semble venir tout droit de Hegel ; elle remonte en fait à {sky}Kant{/sky}, qui justifie la distinction de l'universel et du singulier.

    **Première rupture : l'universel a une histoire.**
    - Pour {sky}Hegel{/sky}, l'universel, étranger au devenir, se signale par {teal}« une autoconservation invariable »{/teal}.
    - Pour Marx, il appartient à la vie des choses et de l'histoire : à côté du fait statique de l'universalité logique, il y a le processus de l'{green}universalisation{/green}, comme la tendance du capitalisme à développer le {yellow}marché mondial{/yellow}.

    **Seconde rupture, plus essentielle : l'universel peut exister comme une chose particulière.** Hegel a vu que l'universalité est elle-même une catégorie particulière. Marx montre bien davantage : dans des processus réels d'universalisation, comme la généralisation des échanges, un élément universel, la {yellow}valeur{/yellow}, vient à exister sous la forme d'une réalité particulière, l'{yellow}argent{/yellow}, forme universelle de la richesse sociale. On tient l'universel dans sa main. De même le {yellow}« capital en général »{/yellow}, dont disposent les banques, est la plus tangible des réalités. D'où la formule des *Grundrisse* : si d'un côté l'universel relève de la pensée, {teal}« il est en même temps __une forme réelle particulière__ à côté de la forme du particulier »{/teal}.

    | Hegel | Marx |
    | « l'universel, on ne l'entend et on ne le voit pas, mais il n'est que pour l'esprit » | l'universel fait partie de notre univers quotidien |

    Cette émergence d'{violet}universels particuliers{/violet} comme l'argent est d'une portée historique énorme : l'emballement de l'accumulation financière montre la puissance pratique que peuvent prendre ces singularités logiques. Dans le même esprit, Marx pense le singulier comme processus réel de {violet}singularisation{/violet} (*Vereinzelnung*) : l'individu se singularise dans et par l'histoire, éclairage capital pour l'anthropologie.

    **La cohérence des quatre catégories de la connaissance.** Essence, abstraction, universalité, objectivité sont toutes pensées comme des {coral}rapports évolutifs{/coral}, à la fois procès idéels (une théorie dialectique) et procès réels :

    | Catégorie | Procès réel |
    | essence | essences génératrices |
    | abstraction | abstractions réelles |
    | universalité | universels particuliers |
    | objectivité | objectalisations chosales |

    S'y ajoute une pensée neuve de la {violet}représentation{/violet} (*Vorstellung*), tirée de l'analyse de la monnaie : à la fois façon dont un sujet {amber}se représente{/amber} et façon dont une réalité historique {amber}se présente{/amber}, avec les {red}illusions objectives{/red} qu'elle porte. Marx dépasse ainsi la « théorie de la connaissance » de {sky}Kant{/sky} comme la « phénoménologie de la conscience » de {sky}Hegel{/sky}, vers une connaissance pensée de façon matérialiste, critique et historico-sociale.
