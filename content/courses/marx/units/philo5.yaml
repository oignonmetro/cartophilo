- id: philo5-l3
  title: "Bonne et mauvaise abstraction ; l'abstraction réelle"
  notes: |-
    **Marx est à la fois le plus féroce critique de l'abstraction et un grand penseur de l'abstraction : il faut** {coral}**distinguer les modalités de l'abstraction**{/coral}**, puis découvrir qu'il en existe aussi dans les choses.**

    **Trois sortes d'abstraction.**

    | Abstraction | Exemple | Valeur |
    | d'entendement | « la population » | utile dans d'étroites limites |
    | mauvaise | « l'homme » | pense par entités : « la philosophie » |
    | rationnelle | le rapport générateur | autorise la théorie |

    - L'{violet}abstraction d'entendement{/violet} (*verständige Abstraktion*) : « la population » est utile dans d'étroites limites, au-delà desquelles elle nourrit la {red}généralité creuse{/red}.
    - Pire, la {violet}mauvaise abstraction{/violet}, qui pense par {red}entités{/red} (« l'homme ») et dont la forme générique est {red}« la philosophie »{/red} : en ce sens, Marx est le plus féroce critique de l'abstraction.
    - À l'opposé, l'{violet}abstraction rationnelle{/violet}, scientifique, saisit dans des concepts l'{green}essence dialectique de son objet{/green}, le rapport générateur, et autorise l'authentique théorie : en ce sens, Marx est {green}au premier chef un penseur de l'abstraction{/green}. Tout concept a une double relation, à son référent objectif et à ses déterminants sociaux : toute abstraction conceptuelle est un {coral}concret historique{/coral}.

    **L'abstraction réelle.** Plus originale encore : Marx montre une {violet}conaturalité{/violet} entre le processus idéel et le processus réel d'abstraction, sans laquelle on comprendrait mal que le monde soit concevable. Nature et histoire abondent en processus spontanés d'{amber}isolement relatif{/amber}, de {amber}chosification partielle{/amber}, d'{amber}universalisation tendancielle{/amber} : Marx n'hésite pas à parler d'{violet}abstraction réelle{/violet} (*reale Abstraktion*).
    - Les rapports marchands liquident les vieux liens de dépendance personnelle : surgit l'{yellow}« individu abstrait »{/yellow} de la société bourgeoise, détaché de toute communauté, comme le pense l'économiste.
    - Le capitalisme rend indifférente la sorte particulière de travail : on passe d'un emploi à l'autre, et l'abstraction du {yellow}« travail en général »{/yellow} devient, dit l'Introduction de 1857, {teal}« __vérité pratique__ »{/teal} : ce que l'économiste abstrait, la société l'a d'abord abstrait dans les faits.

    Le renversement matérialiste donne à voir {coral}ce qui attendait dans l'invisible{/coral} : l'abstraction n'est pas seulement dans nos têtes.
  points:
  - id: philo5-l3-p1
    sentence: "__Marx est à la fois le plus féroce critique de l'abstraction et un penseur de l'abstraction__ : il faut en distinguer les ___."
    answer: "modalités"
    alt: ["modalites", "sortes"]
  - id: philo5-l3-p2
    sentence: "__Abstraction utile dans d'étroites limites, au-delà desquelles elle nourrit la généralité creuse__ : l'abstraction d'___ (*verständige Abstraktion*), comme « la population »."
