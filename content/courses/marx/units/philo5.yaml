# Cours sur la dimension philosophique de l'œuvre de Marx, tiré de
# l'introduction de Lucien Sève aux Écrits philosophiques de Marx (Flammarion,
# « Champs classiques », 2011) : voir l'en-tête de philo1. Ici : début de la
# partie 5, « La logique du Capital », les catégories à dominante
# gnoséologique : essence, abstraction, universalité, représentation. La
# suite de la partie 5 est dans philo6 (matérialité, dialectique) et philo7
# (histoire, pratique, conclusion).
#
# Citations : Introduction de 1857 dans les Éditions sociales (Contribution à
# la critique de l'économie politique) pour « vérité pratique » ; Le Capital,
# livre III (« Toute science serait superflue… »), 6e thèse sur Feuerbach,
# Grundrisse (l'universel « forme réelle particulière ») et Hegel dans la
# traduction de Sève.

id: philo5
title: "La logique du Capital : les catégories de la connaissance"
subtitle: "Essence, abstraction, universalité : des rapports qui produisent les choses, des abstractions réelles, des universels qu'on tient dans la main"
group: "Le philosophique chez Marx"
icon: compass
color: coral
lessons:
- id: philo5-l1
  title: "L'essence, rapport qui produit la chose"
  notes: |-
    **Lénine l'a dit : « Si Marx n'a pas laissé de Logique (avec un grand L), il nous a laissé la logique du Capital ».** Le premier noyau catégoriel qu'on y rencontre est l'{violet}essence{/violet} (*Wesen*). On y voit souvent un reste d'essentialisme hégélien ; c'est un contresens : {coral}l'essence est la catégorie dont le renversement matérialiste est exemplaire{/coral}.

    **Le vocabulaire.** Autour de *Wesen* : {violet}*Erscheinung*{/violet}, le {violet}phénomène{/violet}, au sens fort de manifestation ou au sens faible d'apparence, et ses composés comme {violet}*Erscheinungsform*{/violet} (forme phénoménale) ; {violet}*Schein*{/violet}, le semblant, le faux-semblant. Énoncé caractéristique, au livre III du *Capital* : {teal}« Toute science serait __superflue__ s'il y avait __coïncidence immédiate__ entre l'essence des choses et leur forme phénoménale. »{/teal} S'il suffisait de regarder pour savoir, on n'aurait pas besoin de science ; mais le salaire, par exemple, paraît payer tout le travail, alors qu'il n'en paie qu'une partie.

    **Un renversement précoce, dès la 6e thèse sur Feuerbach** (1845) : {teal}« l'essence humaine n'est pas __une abstraction__ [*kein Abstraktum*] inhérente à l'individu pris à part. Dans sa réalité, c'est __l'ensemble des rapports sociaux__ »{/teal}.

    **Hegel contre Marx.**
    - {sky}Hegel{/sky} a fait un grand pas en pensant l'essence comme {green}nœud de rapports{/green} ; mais il l'enferme dans l'idéalisme le plus essentialiste en en faisant un {red}« arrière-fond »{/red}, « la vérité de l'être ».
    - Marx {coral}congédie l'arrière-fond{/coral} et prend l'idée de rapports au sens le plus matérialiste : l'essence, ce sont {green}les rapports qui produisent la chose{/green}, et qui expliquent donc ses propriétés à travers l'histoire singulière de sa production.

    L'essence n'a donc plus rien ni de l'{red}abstraction spéculative{/red} ni de la {red}naturalité immuable{/red} : c'est la {violet}matrice évolutive{/violet}, concrète mais rarement visible, du phénomène dans sa façon propre d'apparaître. Marx sort ainsi du vieux dilemme entre l'{pink}essentialisme métaphysique{/pink} (les choses ont une nature éternelle cachée) et le {pink}phénoménisme empiriste{/pink} (il n'y a que ce qui apparaît).

    **Vérifiable chez tout lecteur de Marx** : les réalités y sont définies non par une entité ou une nature, mais par leurs {coral}rapports producteurs{/coral}.
    - le {yellow}capitalisme{/yellow} : la séparation des moyens de production d'avec les producteurs directs ;
    - le {yellow}communisme{/yellow} : leur appropriation par les travailleurs associés ;
    - l'{yellow}histoire{/yellow} : la lutte de classes ;
    - la {yellow}conscience{/yellow} : un rapport pratico-théorique au monde ;
    - la {yellow}liberté{/yellow} : la maîtrise des nécessités.

    Ce sens neuf de l'essence vaut pour toutes les catégories : toutes sont des {violet}concepts de rapport générateur{/violet}.
