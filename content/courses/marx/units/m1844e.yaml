- id: m1844-p18
  title: "En façonnant le monde, la nature devient son œuvre"
  notes: |-
    **Marx tire la conséquence de la description : c'est en façonnant le monde que l'homme est {coral}réellement{/coral} générique, et cette production est {coral}sa vie générique en acte{/coral}. La nature transformée devient son œuvre et sa réalité.**

    **Pourquoi « précisément » ?** L'allemand dit *Eben* avec *daher*, « c'est justement donc » : {amber}la phrase est déduite{/amber} de la comparaison avec l'animal. Puisque la production humaine est universelle, libre, à la mesure de toute espèce, c'est en elle que l'homme se montre générique.

    **Pourquoi « s'affirme réellement » ?** *Bewährt sich… erst wirklich* : se vérifie {violet}seulement alors effectivement{/violet}. Avant de produire, l'homme n'est générique qu'en puissance ; {coral}c'est dans l'œuvre qu'il le devient effectivement{/coral}.

    **Pourquoi « sa vie générique active » ?** *Werktätiges Gattungsleben* : {violet}la vie générique en œuvre, au travail{/violet}. La vie de l'espèce n'est pas une idée qui planerait au-dessus des hommes : {amber}elle existe dans l'activité qui façonne le monde{/amber}.

    **Pourquoi « son œuvre et sa réalité » ?** *Werk*, l'ouvrage ; *Wirklichkeit*, l'effectivité, de *wirken*, agir. La nature transformée est {coral}la réalité de l'homme{/coral}, au sens où elle est {amber}son effet{/amber} : en elle, son activité est devenue visible et durable. {yellow}Le paysan qui regarde ses champs, ses haies et ses chemins voit dans le paysage ce que lui et les siens ont fait de la terre.{/yellow}

    **Que prépare cette phrase ?** Si la nature façonnée est la réalité de l'homme, {red}lui en retirer l'accès, c'est lui retirer sa réalité{/red}. On retrouve la « perte de réalité » du premier texte, maintenant comprise : ce que l'ouvrier perd, c'est le monde où son activité devient réelle.

    **Un écho de Hegel.** Le troisième manuscrit loue la *Phénoménologie* d'avoir conçu {teal}« l'homme objectif, véritable parce que réel, comme le résultat de son propre travail »{/teal}. Marx en garde l'idée, mais la rapporte à {green}un être naturel qui façonne la matière{/green}, non à l'esprit.

    ! La « réalité » de l'homme n'est pas {red}une possession{/red} : c'est {green}ce que son activité a produit et où elle demeure{/green}.
  passage:
