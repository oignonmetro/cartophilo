- id: m1844e-i2
  title: "La question, la thèse, la problématique"
  notes: |-
    **Le texte se demande en quoi l'homme s'affirme comme être générique dans ce qu'il produit, et {coral}ce que le travail aliéné, en lui retirant ce produit, lui fait perdre jusque dans son rapport aux autres hommes{/coral}.**

    **Le débat.** Celui de la différence entre l'homme et l'animal. On la place d'ordinaire {red}dans la raison ou la conscience{/red} ; Marx la place {green}dans la manière de produire{/green}, et en tire que la perte du produit est la perte de cette différence même, et, au-delà, celle du lien entre les hommes.

    **Sa thèse :** c'est {coral}en façonnant le monde objectif{/coral} que l'homme s'affirme réellement comme être générique : à la différence de l'animal, il produit {amber}universellement, même libre du besoin, à la mesure de toute espèce et d'après les lois de la beauté{/amber}, et il {violet}se contemple dans un monde qu'il a lui-même créé{/violet}. En lui arrachant l'objet de sa production, le travail aliéné lui arrache donc sa vie générique, {coral}change sa supériorité sur l'animal en infériorité{/coral}, et fait de son être générique un moyen de son existence individuelle ; et, parce que le rapport de l'homme à lui-même se réalise dans son rapport aux autres, {coral}l'homme devient étranger à l'homme{/coral}.

    **Sa problématique :** comment la perte d'un objet, le produit du travail, peut-elle retirer à l'homme sa supériorité sur l'animal et le rendre étranger aux autres hommes, alors que {amber}la supériorité humaine semble tenir à ce que l'homme est, non à ce qu'il possède{/amber} ?

    **Pourquoi est-ce difficile ?** Il y a {red}une disproportion entre la cause et l'effet{/red}.
    - On admet que l'ouvrier dépossédé de son produit soit appauvri ; on comprend moins qu'il perde par là {amber}ce qui fait de lui un homme{/amber}, {red}comme si l'humanité était une affaire d'objets{/red}.
    - On comprend moins encore qu'une perte subie par chacun dans son rapport à son produit {amber}devienne un rapport entre les hommes{/amber}.

    | Difficulté | Où elle se trouve | Réponse du texte |
    | l'humanité perdue avec un objet | « transforme sa supériorité sur l'animal en infériorité » | pour un être naturel, l'humanité n'est pas une qualité intérieure : elle passe par les objets qu'il façonne |
    | une supériorité changée en infériorité, non en égalité | même phrase | plus le corps non organique est vaste, plus sa perte laisse l'homme démuni |
    | une perte individuelle devenue rapport entre les hommes | le résultat 4) | l'être générique est d'emblée social : le rapport à soi se réalise dans le rapport aux autres |

    **L'hypothèse de lecture :** le texte répond en deux temps. D'abord, l'homme {amber}se dédouble et se contemple dans le monde qu'il produit{/amber} : perdre ce monde, c'est perdre le miroir où il se voit. Ensuite, s'il se rapporte à lui-même comme à l'espèce, {amber}son rapport à lui-même est déjà un rapport aux autres{/amber} : l'aliénation de l'un est immédiatement celle de l'autre.

    **Un fil que la traduction efface.** La {violet}« mesure »{/violet} (*Maß*) de toute espèce, propre à la production libre, se rétrécit à la fin en un seul {violet}« étalon »{/violet} (*Maßstab*), celui de la condition d'ouvrier, à travers lequel chacun regarde les autres.

    ! L'humanité n'est pas {red}une affaire d'objets{/red} ; mais pour un être naturel, {green}elle passe par eux{/green}.
