- id: m1844-p18c
  title: "La supériorité changée en infériorité"
  notes: |-
    **Puisque l'objet produit est la vie générique de l'homme devenue objet, {coral}le lui prendre, c'est lui prendre sa vie générique{/coral}. Et ce qui faisait sa supériorité sur l'animal, faire de toute la nature son corps, {coral}devient une infériorité{/coral}, puisque ce corps lui est retiré.** La première moitié de la problématique est résolue.

    **Pourquoi « ainsi tandis que » ?** L'allemand dit *Indem daher*, {violet}« en ce que donc »{/violet} : comme dans le texte précédent, la traduction {red}efface une construction causale{/red}, et le *daher* fait de la phrase une conséquence de la précédente. C'est {amber}en arrachant l'objet{/amber} que le travail aliéné arrache la vie générique.

    **Pourquoi « arrache » ?** *Entreißt* : le mot est violent, et il est {amber}répété{/amber}. Ce qu'on arrache à l'homme avec l'objet, c'est sa vie générique.

    **Pourquoi « sa véritable objectivité générique » ?** *Seine wirkliche Gattungsgegenständlichkeit* : {violet}la forme objective que prend sa vie générique dans le monde{/violet}. L'homme ne perd pas un objet parmi d'autres, il perd {coral}l'existence objective de ce qu'il est{/coral}.

    **Pourquoi une infériorité, et non une simple égalité avec l'animal ?** L'allemand dit *in den Nachteil, daß*, {amber}« en ce désavantage que »{/amber} : l'infériorité consiste précisément en ceci que son corps non organique lui est retiré. Le raisonnement implicite tient à l'étendue même de ce que l'homme a de plus.
    - L'animal ne vit que d'{amber}une petite part de nature{/amber}, mais {green}il la garde{/green} : son nid, son terrier font partie de son corps, personne ne les lui prend.
    - L'homme vit de {amber}la nature entière{/amber}, qui est son corps ; si ce corps lui est retiré, il est dépossédé de tout ce dont il vit, et {red}plus démuni que l'animal{/red}, qui a au moins son terrier.

    {coral}Plus le corps est grand, plus la perte est grande.{/coral} {yellow}Le maçon qui bâtit des immeubles pour toute une ville est moins bien logé que l'oiseau dans son nid.{/yellow}

    **La première difficulté est résolue.** La supériorité de l'homme ne tient pas {red}à ce qu'il possède{/red}, mais {green}à la manière dont il se rapporte à la nature et s'y réalise{/green}. Mais cette manière {amber}passe par des objets{/amber} : si les objets lui sont retirés, la supériorité n'a plus où s'exercer.

    **La propriété, privation de la nature.** Là est la racine d'une critique écologique : la propriété privée, d'abord celle de la terre, est {red}une privation de la nature{/red} ; l'ouvrier n'a plus de rapport direct à son corps non organique, et ne l'atteint qu'en travaillant pour un autre. Si la nature est le corps de l'homme, la {violet}rupture du métabolisme{/violet} dont parlera *Le Capital* est {coral}l'aliénation fondamentale{/coral}, déjà là en germe (voir le prolongement).

    ! Marx ne {red}confond pas l'être et l'avoir{/red} : il dit que, pour un être naturel, {green}être suppose d'avoir accès à la nature{/green}, et que le travail aliéné coupe cet accès.
  passage:
