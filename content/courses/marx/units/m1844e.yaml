- id: m1844-p19d
  title: "Autrui mesuré à la condition d'ouvrier"
  notes: |-
    **Le rapport de l'homme à lui-même {coral}se réalise et se reflète{/coral} dans son rapport aux autres ; donc chacun juge l'autre {coral}d'après ce qu'il est lui-même devenu, un ouvrier{/coral}.** L'aliénation de chacun devient la forme même du rapport entre tous.

    **Pourquoi « se réalise et se reflète » ?** Le rapport à autrui n'est {red}pas un rapport de plus{/red}, à côté du rapport à soi : c'est {green}le lieu où le rapport à soi devient effectif et visible{/green}. On ne sait ce qu'est un homme pour lui-même qu'en voyant comment il traite les autres.

    **Pourquoi « donc » ?** *Also*, en tête de phrase : {amber}une conclusion{/amber}. Le raisonnement implicite tient en deux étapes.
    - Chacun ne peut regarder autrui {amber}qu'à partir de ce qu'il est{/amber} : son rapport aux autres prolonge son rapport à lui-même.
    - Ce que l'ouvrier est devenu, c'est {amber}un être dont l'activité n'est qu'un moyen de survivre et dont le produit appartient à un autre{/amber}.

    Il ne peut donc voir l'autre homme que selon cette même mesure : {coral}comme un moyen, un concurrent ou un maître{/coral}, jamais comme un être générique avec qui il partage une espèce. Au lieu d'une coopération consciente, le travail aliéné installe {red}la concurrence entre des individus séparés{/red}. {yellow}Le mineur qui craint que l'embauche d'un nouveau venu fasse baisser son salaire le voit d'abord comme une menace.{/yellow}

    **Pourquoi « pris dans le rapport du travail aliéné » ?** *In dem Verhältnis der entfremdeten Arbeit* : le travail aliéné est {violet}un rapport{/violet}, dans lequel les hommes sont pris, non une simple manière de travailler. C'est le rapport qui façonne leur manière de se voir.

    **Pourquoi « les critères et les conditions » ?** L'allemand dit *nach dem Maßstab und dem Verhältnis*, {violet}« selon l'étalon et le rapport »{/violet}. Le mot *Maßstab*, l'étalon, {coral}fait écho à la « mesure » (*Maß*) du premier paragraphe{/coral}. L'homme non aliéné savait produire « à la mesure de toute espèce » ; l'homme aliéné n'a plus {red}qu'une mesure{/red}, celle de sa condition d'ouvrier, et il l'applique à tout, y compris aux autres hommes. {amber}L'universalité s'est rétrécie en un seul étalon{/amber}, comme celle de l'animal qui ne façonne que « selon la mesure de son espèce ».

    **Pourquoi « chaque homme » ?** *Jeder Mensch*, {amber}sans exception{/amber} : y compris celui qui fait travailler, que la suite du manuscrit va considérer. Marx demandera aussitôt à qui appartient le produit, et répondra : à {teal}« un autre homme que l'ouvrier »{/teal}. La propriété privée en sera {teal}« la conséquence nécessaire »{/teal}.

    ! Ce n'est pas {red}une observation morale sur l'égoïsme des ouvriers{/red} : c'est {green}une structure{/green}, où chacun est contraint de mesurer l'autre à la mesure de sa propre condition.
