    sentence: "« Le travail aliéné conduit donc aux résultats suivants : 3) L'être générique de l'homme, sa nature, aussi bien que ses facultés intellectuelles génériques, sont transformés en un être qui lui est étranger, en moyen de son existence individuelle. Le travail aliéné rend l'homme ___, au monde extérieur aussi bien qu'à son essence spirituelle, à son essence humaine. »"
