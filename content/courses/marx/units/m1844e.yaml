# Unité de texte (voir content/textes.md) : Marx, *Manuscrits de 1844*, premier
# manuscrit, « Le travail aliéné », la production universelle,
# ce que le travail aliéné arrache à l'homme, les résultats 3) et 4)
# (§17 à §19 de l'ancienne unité).
# d'après la traduction GF (Jacques-Pierre Gougeon), choisie par l'utilisateur.
# Les appels de note et les marques de page sont retirés ; le texte est celui de
# l'extraction du PDF de l'utilisateur. Commentaire : les séances de Fischbach
# des 13 et 20 octobre et du 3 novembre 2026 (voir les unités ali1 à ali6) ;
# allemand d'après le texte allemand de marxists.org (MEW 40). Le passage
# (p. XXII à XXIV du manuscrit de Marx) était une seule unité jusqu'au
# 2026-11-21 ; il est réparti en cinq unités (m1844, m1844b à m1844e), qui
# gardent les identifiants des leçons et des cartes (m1844-p…), donc leur
# révision, avec des § renumérotés dans chaque unité.
# Refondu le 2026-11-23 : une leçon par phrase ou segment (m1844-p17, p17b…),
# deux leçons d'introduction ; le prolongement (m1844e-o1) gardé tel quel ; les
# cartes-citation et les cartes-explication reprises gardent leurs identifiants.
# La dernière phrase du §2 (« La conscience que l'homme a de son genre… »)
# manquait à l'extraction du PDF GF : elle est reprise des Éditions sociales
# (Bottigelli), faute du texte GF, à remplacer par lui dès qu'on l'a (2026-11-22).

id: m1844e
title: "L'homme étranger à l'homme (1844)"
subtitle: "Manuscrits de 1844, premier manuscrit, « Le travail aliéné », 5 / 5"
group: "Le travail aliéné (Manuscrits de 1844)"
depth: normale
icon: page
color: coral
intro: |-
  La fin du passage sur le travail aliéné : l'homme s'affirme comme être générique en façonnant le monde objectif, à la mesure de toute espèce et d'après les lois de la beauté ; en lui arrachant l'objet de sa production, le travail aliéné lui arrache sa vie générique, et le rend étranger aux autres hommes.
lessons:
- id: m1844e-i1
  title: "Le texte, sa place et son plan"
  notes: |-
    **Le texte est le dernier des cinq moments du passage sur le travail aliéné : il achève la preuve de la troisième détermination, puis tire {coral}les deux derniers résultats{/coral}, l'être générique devenu étranger à l'homme, et {coral}l'homme étranger à l'homme{/coral}.** Il se trouve aux pages XXIV et XXV du manuscrit, de « Par la production pratique d'un monde objectif » à la phrase où chaque homme considère autrui « selon les critères et les conditions de sa propre situation en tant qu'ouvrier ».

    **Où en est l'argument.** Le texte précédent a posé que l'homme est un être générique, qui vit de la nature entière comme de son corps non organique et {amber}a{/amber} son activité vitale au lieu de l'{amber}être{/amber}. Il a commencé de prouver la troisième détermination, {violet}la vie générique devenue moyen de la vie individuelle{/violet}, par un « premièrement » : le travail n'apparaît à l'homme que comme moyen de survivre. Il manquait {red}le second volet{/red} de la preuve.

    **Ce que ce texte apporte.** Le second volet, {coral}la production d'un monde objectif{/coral} : ce que l'homme perd quand on lui prend non plus son activité, mais l'objet qu'il produit. Puis les deux résultats. Après lui, Marx demandera à qui appartiennent le produit et l'activité de l'ouvrier, et déduira la propriété privée du travail aliéné.

    **Deux éléments de cadre.**
    - **Le dédoublement hégélien.** Chez Hegel, l'esprit se dédouble et se reconnaît dans ce qu'il produit. Marx reprend l'idée en la rendant {amber}pratique et matérielle{/amber} : l'homme se dédouble non dans la conscience, mais dans un monde qu'il façonne.
    - **L'homme et l'animal.** La comparaison classique de la production humaine et de la production animale (l'abeille, le castor, la fourmi), que Marx retourne : {coral}la supériorité de l'homme peut devenir une infériorité{/coral}.

    **Une remarque sur le texte.** La phrase « La conscience que l'homme a de son genre se transforme donc… » manquait à l'extraction de la traduction GF ; elle est reprise des Éditions sociales, à sa place, à la fin du deuxième paragraphe.

    | Mouvement | Lieu | Ce qui s'y joue |
    | l'homme s'affirme dans sa production | §1 | Par contraste avec l'animal, la production humaine est universelle, libre du besoin, à la mesure de toute espèce, jusqu'à la beauté. |
    | ce que le travail aliéné arrache | §2 | L'homme se contemple dans le monde qu'il crée ; lui arracher son produit, c'est lui arracher sa vie générique, et changer sa supériorité sur l'animal en infériorité. |
    | les deux derniers résultats | §3 | L'être générique devient étranger à l'homme ; et, conséquence immédiate, l'homme devient étranger à l'homme. |

    ! Le passage, parti du rapport d'un ouvrier à son produit, aboutit {green}au rapport des hommes entre eux{/green}, sans quitter le terrain de la production : l'étrangeté entre les hommes n'est {red}pas d'abord morale ou politique{/red}, elle naît de la manière dont ils produisent.
