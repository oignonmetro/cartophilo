- id: m1844-p17
  title: "Produire un monde objectif"
  notes: |-
    **Marx dit où l'homme fait la preuve de ce qu'il est : {coral}dans la production d'un monde d'objets{/coral}, la transformation de la nature. C'est là qu'il se montre être générique, un être pour qui l'espèce humaine n'est pas une idée lointaine, mais sa propre essence.** Le second volet de la preuve commence ici.

    **Pourquoi « production pratique d'un monde objectif » ?** L'allemand dit *das praktische Erzeugen einer gegenständlichen Welt*, {violet}l'engendrement pratique d'un monde d'objets{/violet} : le mot *erzeugen* est celui de « la vie engendrant la vie » du texte précédent. « Le façonnement de la nature non organique » (*Bearbeitung*, le travail de la matière) définit la production comme {amber}transformation de la nature{/amber}.

    ? **Monde objectif** : l'ensemble des objets que l'homme produit et qui forment son milieu : {yellow}maisons, outils, champs, routes, villes, œuvres{/yellow}. Un monde, non un tas d'objets : un ensemble durable et commun, où les hommes vivent ensemble.

    **Pourquoi « s'affirme » ?** L'allemand dit *ist die Bewährung* : {violet}la mise à l'épreuve, la confirmation{/violet}. L'homme {amber}fait ses preuves{/amber}, il se vérifie comme être générique, comme on dit d'une qualité qu'elle s'avère. Une essence ne se possède pas comme une qualité cachée : {coral}elle se vérifie dans ce qu'on fait{/coral}. Traduire *Bewährung* par « conservation », comme on l'a fait, serait {red}le confondre avec *Bewahrung*{/red}, qui veut dire conservation.

    **Pourquoi dans la production plutôt que dans la pensée ?** Le raisonnement implicite reprend le texte précédent.
    - L'être générique a été défini par {amber}l'activité vitale consciente{/amber}.
    - L'activité vitale de l'homme est {amber}la vie productive{/amber}.
    - C'est donc {coral}dans la production qu'il doit faire la preuve de ce qu'il est{/coral}.

    **Pourquoi la production montre-t-elle que l'homme agit pour l'espèce ?** Parce qu'{amber}un objet produit sert à d'autres que son producteur, et lui survit{/amber}. {yellow}Le bâtisseur d'un pont travaille pour des passants qu'il ne connaîtra pas : il agit pour l'espèce comme pour lui-même.{/yellow} Le monde objectif est le lieu où l'homme montre qu'il se rapporte à l'espèce « comme à sa propre essence ».

    **Pourquoi la fin de la phrase ?** « Qui se comporte à l'égard de l'espèce humaine comme… à l'égard de sa propre essence, ou à l'égard de soi en tant qu'être générique » : les deux formules sont {violet}réciproques{/violet}. L'espèce est pour l'homme ce qu'il est lui-même ; et se rapporter à soi, c'est se rapporter à l'espèce. On retrouve l'équivalence posée au début du texte précédent.

    ! « Production » ne désigne pas ici {red}la seule production économique{/red} : la suite l'étend à la production d'après les lois de la beauté. C'est {green}toute transformation de la nature par l'homme{/green}.
