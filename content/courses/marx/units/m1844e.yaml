- id: m1844-p18d
  title: "La vie générique, moyen de l'existence physique"
  notes: |-
    **Marx réunit les deux volets de la preuve : en dégradant l'activité libre au rang de moyen, {coral}le travail aliéné fait de la vie générique un moyen de survivre{/coral}. Et il en tire la conséquence pour la conscience même : {coral}l'espèce n'est plus pour l'homme qu'un moyen{/coral}.**

    **Pourquoi « de même » ?** *Ebenso* : le second argument est {amber}mis en parallèle{/amber} avec le premier. Le travail aliéné prend à l'homme son objet (ce texte) et dégrade son activité (le texte précédent) : {coral}des deux côtés, il lui ôte sa vie générique{/coral}. La troisième détermination est ainsi établie.

    **Pourquoi « l'activité propre, la libre activité » ?** *Die Selbsttätigkeit, die freie Tätigkeit* : {violet}l'auto-activité{/violet} du troisième texte, l'activité qui part de soi. « Dégrader au rang de moyen » (*zum Mittel herabsetzt*) : abaisser.

    **Une phrase rétablie.** La seconde phrase manquait à l'extraction GF ; elle est reprise des Éditions sociales. Elle a une portée qu'il faut mesurer.

    **Pourquoi « la conscience que l'homme a de son genre » ?** *Das Bewußtsein, welches der Mensch von seiner Gattung hat* : c'est {violet}le vocabulaire de Feuerbach{/violet}, pour qui l'homme se définit par la conscience de son genre. La phrase porte {coral}une pointe contre lui{/coral}.
    - Pour Feuerbach, la conscience du genre est {red}une faculté théorique{/red} qui fait l'homme.
    - Marx montre qu'{green}elle dépend de la pratique{/green} : si la vie générique est réduite à un moyen dans le travail, la conscience que l'homme a de son espèce se transforme en conséquence.

    {coral}La conscience suit la pratique, au lieu de la fonder.{/coral} Elle n'est que le redoublement de la pratique, et elle se dégrade quand la pratique est réduite à la survie. {yellow}L'ouvrier qui ne travaille que pour son salaire finit par ne plus voir dans la société des hommes qu'une machine à fournir des salaires.{/yellow}

    **Pourquoi « donc » ?** *Also* : la transformation de la conscience est {amber}une conséquence{/amber} de la dégradation de l'activité. La phrase sert de {violet}pivot{/violet} entre la démonstration et les résultats.

    ! La première phrase ne fait pas que {red}répéter{/red} le texte précédent : elle {green}réunit les deux volets{/green} de la preuve avant les résultats, et la seconde ajoute l'effet de l'aliénation sur la conscience elle-même.
  passage:
    label: "§2"
    part: "2. Ce que le travail aliéné arrache"
    text: "De même, en dégradant au rang de moyen l'activité propre, la libre activité, le travail aliéné fait de la vie générique de l'homme le moyen de son existence physique. La conscience que l'homme a de son genre se transforme donc du fait de l'aliénation de telle façon que la vie générique devient pour lui un moyen."
  points:
