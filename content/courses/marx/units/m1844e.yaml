- id: m1844-p19b
  title: "Le résultat 4) : l'homme étranger à l'homme"
  notes: |-
    **Marx tire la quatrième détermination : l'homme devenu étranger à son produit, à son activité et à son espèce {coral}devient étranger aux autres hommes{/coral}. Et il la donne pour {coral}une conséquence immédiate{/coral}.**

    **Pourquoi « une conséquence immédiate » ?** *Unmittelbare Konsequenz* : {violet}sans moyen terme{/violet}. Le raisonnement implicite tient à la définition de l'être générique.
    - L'homme {amber}se rapporte à lui-même comme à l'espèce{/amber} : c'est ce qui le fait générique.
    - Son rapport à lui-même est donc {amber}déjà un rapport aux autres{/amber}, qui sont l'espèce présente.
    - Perdre son être générique, c'est donc, sans étape intermédiaire, {coral}perdre le lien aux autres{/coral}.

    L'être générique est {coral}d'emblée social{/coral}. La déduction est bien immédiate, {amber}à condition d'admettre la définition{/amber} posée dans le texte précédent.

    **Pourquoi l'énumération « au produit, à son activité vitale, à son être générique » ?** Ce sont {violet}les trois déterminations{/violet} acquises, rappelées dans l'ordre. La quatrième les suppose toutes.

    **Pourquoi « l'homme s'oppose à lui-même, il s'oppose aussi à autrui » ?** L'allemand dit : si l'homme se fait face à lui-même, {violet}alors l'autre homme lui fait face{/violet} (*so steht ihm der andre Mensch gegenüber*). C'est {coral}le verbe de l'objet étranger du premier texte{/coral}, *gegenübertreten* : le produit « se dressait devant » l'ouvrier ; c'est maintenant l'autre homme qui se dresse devant lui. {yellow}Deux ouvriers qui se disputent la même place à l'embauche se voient l'un l'autre comme des concurrents, non comme des membres d'une même espèce.{/yellow}

    **Pourquoi le passage à autrui est-il si important ?** Parce qu'il fait passer l'aliénation {amber}du rapport d'un homme à ses choses au rapport des hommes entre eux{/amber}. C'est ce qui permettra, aussitôt après, de demander à qui appartient le produit, et de répondre : à {teal}« un autre homme que l'ouvrier »{/teal}.

    ! Ce n'est pas {red}une morale de la fraternité perdue{/red} : c'est {green}une déduction à partir de la définition de l'homme{/green}, et c'est pourquoi elle peut être « immédiate ».
  passage:
    label: "§3"
    part: "3. Les deux derniers résultats"
    text: "4) L'aliénation de l'homme par rapport à l'homme apparaît comme une conséquence immédiate du fait que l'homme est rendu étranger au produit de son travail, à son activité vitale, à son être générique. L'homme s'oppose à lui-même, il s'oppose aussi à autrui."
