# Unité de texte (voir content/textes.md) : Marx, *Manuscrits de 1844*, premier
# manuscrit, « Le travail aliéné », la production universelle,
# ce que le travail aliéné arrache à l'homme, les résultats 3) et 4)
# (§17 à §19 de l'ancienne unité).
# d'après la traduction GF (Jacques-Pierre Gougeon), choisie par l'utilisateur.
# Les appels de note et les marques de page sont retirés ; le texte est celui de
# l'extraction du PDF de l'utilisateur. Commentaire : les séances de Fischbach
# des 13 et 20 octobre et du 3 novembre 2026 (voir les unités ali1 à ali6) ;
# allemand d'après le texte allemand de marxists.org (MEW 40). Le passage
# (p. XXII à XXIV du manuscrit de Marx) était une seule unité jusqu'au
# 2026-11-21 ; il est réparti en cinq unités (m1844, m1844b à m1844e), qui
# gardent les identifiants des leçons et des cartes (m1844-p…), donc leur
# révision, avec des § renumérotés dans chaque unité.
# La dernière phrase du §2 (« La conscience que l'homme a de son genre… »)
# manquait à l'extraction du PDF GF : elle est reprise des Éditions sociales
# (Bottigelli), faute du texte GF, à remplacer par lui dès qu'on l'a (2026-11-22).

id: m1844e
title: "L'homme étranger à l'homme (1844)"
subtitle: "Manuscrits de 1844, premier manuscrit, « Le travail aliéné », 5 / 5"
group: "Le travail aliéné (Manuscrits de 1844)"
icon: page
color: coral
intro: |-
  La fin du passage sur le travail aliéné : l'homme s'affirme comme être générique en façonnant le monde objectif, à la mesure de toute espèce et d'après les lois de la beauté ; en lui arrachant l'objet de sa production, le travail aliéné lui arrache sa vie générique, et le rend étranger aux autres hommes.
lessons:
- id: m1844e-i1
  title: "Où en est l'argument : la production et l'autre homme"
  notes: |-
    **Ce texte achève la preuve de la troisième détermination et en tire la quatrième : {coral}l'homme rendu étranger à l'homme{/coral}.**

    Le texte précédent a posé que l'homme est un être générique et donné un premier argument (« premièrement ») : le travail aliéné fait de la vie générique un moyen de survivre. Celui-ci donne le second, la production d'un monde objectif, puis les résultats 3) et 4).

    **Sa question :** en quoi l'homme s'affirme-t-il comme être générique dans ce qu'il produit, et que lui fait perdre le travail aliéné, jusque dans son rapport aux autres ? **Sa thèse :** c'est en façonnant le monde objectif, {amber}universellement, libre du besoin, à la mesure de toute espèce et d'après les lois de la beauté{/amber}, que l'homme s'affirme et {violet}se contemple dans un monde qu'il a créé{/violet} ; en lui arrachant ce produit, le travail aliéné lui arrache sa vie générique et {coral}change sa supériorité sur l'animal en infériorité{/coral} ; et, parce que son rapport à lui-même se réalise dans son rapport aux autres, {coral}il le rend étranger aux autres hommes{/coral}. **Sa difficulté :** comment la perte d'un objet peut-elle retirer à l'homme sa supériorité sur l'animal, et le rendre étranger aux autres ?

    Trois mouvements : l'homme s'affirme dans sa production (§1), ce que le travail aliéné arrache (§2), les deux derniers résultats (§3).
  passage:
    label: "Introduction"
  points:
  - id: m1844e-i1-e1
    sentence: "Thèse du cinquième texte : en arrachant à l'homme son produit, le travail aliéné __change sa supériorité sur l'animal en ___.__"
    answer: "infériorité"
    alt: []
  - id: m1844e-i1-e2
    sentence: "Le quatrième résultat découle du troisième parce que __le rapport de l'homme à lui-même se réalise dans son rapport ___.__"
    answer: "aux autres"
    alt: ["à autrui"]
- id: m1844-p17
  title: "1.1 à 1.3 Produire universellement, d'après les lois de la beauté"
  notes: |-
    **Par contraste avec l'animal, Marx décrit ce qu'a de générique la production humaine : {coral}universelle, libre du besoin, à la mesure de toute espèce, jusqu'à la beauté{/coral}.**

    **1.1 Produire un monde objectif.** La production d'un monde objectif est la {violet}*Bewährung*{/violet} de l'homme, sa mise à l'épreuve, sa confirmation : une essence {amber}se vérifie dans ce qu'on fait{/amber}. Le second volet de la preuve commence ici : l'homme est générique par son activité vitale, et l'activité vitale humaine est la production.

    Traduire *Bewährung* par « conservation », c'est {red}le confondre avec *Bewahrung*{/red}, qui veut dire conservation ; *Bewährung* est l'épreuve réussie, l'attestation (GF « s'affirme », on peut dire aussi « s'atteste »). Le monde produit {violet}représente l'activité humaine{/violet} : dans la nature travaillée, l'homme trouve sa propre marque.

    **1.2 L'unilatéral et l'universel.** L'animal produit aussi (l'abeille, le castor, la fourmi), mais {red}pour son besoin immédiat, sous la domination du besoin{/red} (*Herrschaft*), ne produit que lui-même, et son produit fait partie de son corps. L'homme produit {green}universellement{/green}, reproduit la nature entière, fait {green}librement face{/green} à son produit, et ne produit {coral}« vraiment »{/coral} (*erst wahrhaft*) que libéré du besoin : ce qu'on produit sous la contrainte montre le besoin, non ce qu'on est. La production animale est engluée dans l'instinct, la production humaine est libre.

    **Ce que la comparaison rend inévitable :** l'ouvrier aliéné, qui ne travaille que pour survivre, sous la contrainte du besoin, {amber}produit sur le mode animal{/amber}. C'est ce que dira le paragraphe suivant.

    **1.3 La mesure et la beauté.** L'animal façonne selon la mesure de son espèce ; l'homme sait produire {violet}« à la mesure de toute espèce »{/violet} et appliquer à l'objet {violet}« la mesure inhérente »{/violet} (*das inhärente Maß* ; GF dit « sa nature inhérente ») ; {amber}donc{/amber} (*daher*) il façonne aussi {coral}« d'après les lois de la beauté »{/coral}. La fréquentation des belles formes éduque les facultés génériques. La beauté est {violet}l'accord de la forme et de la mesure de l'objet{/violet} : créant selon les lois des choses et de leur genre, l'homme {violet}fait apparaître ces lois dans l'objet{/violet}, et y manifeste sa relation au genre. On peut y voir aussi un Marx « grec », pour qui l'art grec garde une valeur éternelle.

    Des exemples : l'homme ne bâtit pas que des cabanes pour lui, mais {amber}des étables et des bergeries{/amber} ; il cultive chaque plante selon le terrain qui lui convient, en l'améliorant. Produire à la mesure de chaque espèce, c'est {green}servir la mesure d'un autre que soi{/green}.

    ! La beauté n'est pas {red}un luxe réservé à l'art{/red} : c'est {green}une dimension de toute production libre{/green}, celle de l'ébéniste comme celle du peintre.
  passage:
    label: "§1"
    part: "1. L'homme s'affirme dans sa production"
    text: "Par la production pratique d'un monde objectif, le façonnement de la nature non organique, l'homme s'affirme comme un être générique conscient, c'est-à-dire comme un être qui se comporte à l'égard de l'espèce humaine comme il se comporte à l'égard de sa propre essence, ou à l'égard de soi en tant qu'être générique. Certes, l'animal aussi produit. Il se construit un nid, des habitations, comme l'abeille, le castor, la fourmi, etc. Mais il ne produit que ce dont il a immédiatement besoin pour lui ou pour son petit ; il produit d'une façon unilatérale, tandis que l'homme produit d'une façon universelle ; il ne produit que sous l'emprise du besoin physique immédiat, tandis que l'homme produit même lorsqu'il est libéré de tout besoin physique et ne produit vraiment que lorsqu'il en est vraiment libéré. L'animal ne produit que lui-même, tandis que l'homme reproduit la nature tout entière ; le produit de l'animal fait directement partie de son corps physique, tandis que l'homme affronte librement son produit. L'animal ne façonne que selon la mesure et selon les besoins de l'espèce à laquelle il appartient, tandis que l'homme sait produire à la mesure de toute espèce et sait appliquer partout à l'objet sa nature inhérente. C'est pourquoi l'homme façonne aussi d'après les lois de la beauté."
