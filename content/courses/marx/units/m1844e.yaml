- id: m1844e-o1
  title: "La rupture du métabolisme"
  notes: |-
    **Ce que le texte pose en 1844, que la nature est le corps non organique de l'homme et que le travail aliéné le lui arrache, *Le Capital* le retrouve sous un autre nom : {coral}la rupture du métabolisme{/coral} entre l'homme et la terre.**

    **Du « procès constant » au métabolisme.** Le premier manuscrit disait que l'homme doit rester avec la nature « en procès constant » pour ne pas mourir. *Le Capital* définit le travail comme {teal}« un processus dans lequel l'homme règle et contrôle son métabolisme avec la nature par la médiation de sa propre action »{/teal}. *Stoffwechsel*, littéralement {violet}échange de matières{/violet} : comme tout vivant, l'homme fait siens des corps extérieurs et rejette ce dont il doit se débarrasser ; ce qui lui est propre, c'est de {amber}régler{/amber} cet échange. Le mot d'être générique a disparu, l'idée demeure.

    ? **Métabolisme** (*Stoffwechsel*) : l'échange de matières entre l'homme et la nature, que le travail règle ; sa {violet}rupture{/violet} est l'interruption du retour à la terre de ce qui en a été tiré.

    **La perturbation.** En entassant la population dans de grands centres, la production capitaliste {red}« perturbe […] le métabolisme entre l'homme et la terre »{/red}, c'est-à-dire « le retour au sol des composantes de celui-ci usées par l'homme sous forme de nourriture et de vêtements », donc {amber}« l'éternelle condition naturelle d'une fertilité durable du sol »{/amber}. Les produits de la campagne partent vers les villes, qui en rejettent les restes dans les fleuves au lieu de les rendre à la terre : Marx s'appuie ici sur la chimie agricole de Liebig.

    **Une seule ruine.** Tout progrès de l'agriculture capitaliste est un progrès {coral}« dans l'art de piller le travailleur, mais aussi dans l'art de piller le sol »{/coral} ; la production capitaliste ne développe la technique {teal}« qu'en ruinant dans le même temps les sources vives de toute richesse : la terre et le travailleur »{/teal}. C'est la double perte du texte, devenue un processus historique : l'homme privé de son corps non organique, et privé de son activité.

    **Pourquoi la nature compte.** Le travail {red}n'est pas la source unique{/red} de la richesse matérielle : comme le dit Petty, {teal}« celle-ci a pour père le travail et pour mère la terre »{/teal}. La *Critique du programme de Gotha* le redira : « Le travail n'est pas la source de toute richesse. » Si la nature est source de richesse et corps de l'homme, l'épuiser, c'est {amber}mutiler l'homme lui-même{/amber}.

    **Le remède : régler l'échange.** Dans le livre III, la liberté, dans le domaine de la nécessité, ne peut consister qu'en ceci : que {green}« les producteurs associés règlent de façon rationnelle leurs échanges avec la nature »{/green}, qu'ils les contrôlent ensemble au lieu d'être dominés par leur puissance aveugle. Ce n'est pas {red}une domination illimitée de la nature{/red}, l'image prométhéenne qu'on prête souvent à Marx, mais {green}un métabolisme rétabli{/green}.

    ! La rupture du métabolisme n'est pas {red}un thème ajouté sur le tard{/red} à une pensée productiviste : elle prolonge la thèse de 1844, que {green}la nature est le corps de l'homme{/green}.
  passage:
    label: "Prolongement"
