    sentence: "« Ce qui est vrai du rapport de l'homme à son travail, au produit de son travail et à lui-même, est vrai du rapport de l'homme à l'autre ainsi qu'au travail et ___. D'une manière générale, dire que l'homme est étranger à son être générique, c'est dire que les hommes sont devenus étrangers les uns aux autres et que chacun d'eux est devenu étranger à l'essence humaine. »"
    answer: "à l'objet du travail de l'autre"
    alt: []
