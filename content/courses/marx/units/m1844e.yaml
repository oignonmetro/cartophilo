- id: m1844-p17d
  title: "À la mesure de toute espèce, d'après les lois de la beauté"
  notes: |-
    **L'animal façonne selon le modèle et les besoins de sa propre espèce ; l'homme sait produire {coral}selon le modèle de n'importe quelle espèce{/coral}, et donner à chaque objet la forme qui lui convient. {coral}C'est pourquoi il façonne aussi d'après les lois de la beauté.{/coral}** La description de la production humaine s'achève sur sa forme la plus haute.

    ? **Mesure** (*Maß*) : la norme qui règle la forme d'une chose, {violet}le patron d'après lequel elle est faite{/violet}, ou la proportion qui lui convient. L'animal n'en connaît qu'une, celle de son espèce.

    **Pourquoi « à la mesure de toute espèce » ?** *Nach dem Maß jeder species* : l'homme ne façonne pas seulement pour lui, selon ses besoins, mais {amber}selon ce qui convient à chaque chose{/amber}. {yellow}Il ne construit pas que des maisons pour lui : il construit des étables et des bergeries, et cultive chaque plante selon le terrain qui lui convient.{/yellow} Produire à la mesure de chaque espèce, c'est {green}servir la mesure d'un autre que soi{/green}. Et « sait produire » : savoir est ici {violet}un savoir-faire{/violet}.

    **Pourquoi « sa nature inhérente » ?** L'allemand dit *das inhärente Maß dem Gegenstand anzulegen*, {violet}« appliquer à l'objet la mesure inhérente »{/violet}. La traduction « nature » {red}affaiblit le mot de mesure{/red}, qui fait le lien avec ce qui précède : l'homme donne à chaque objet la mesure qui lui est propre.

    **Pourquoi « c'est pourquoi » ?** *Daher* : {coral}la beauté est déduite{/coral}. Le *daher* suppose deux prémisses.
    - L'homme, {amber}libre du besoin{/amber}, n'est pas contraint d'imposer à la matière la forme qu'exige son besoin : il peut lui donner celle qui lui convient à elle.
    - La beauté consiste dans {amber}l'accord d'une forme avec la mesure propre de son objet{/amber}, ce que la tradition classique appelait proportion ou convenance.

    Si on admet les deux, la conclusion suit : un être qui sait produire selon la mesure de chaque chose, et qui n'en est pas empêché par l'urgence du besoin, {coral}peut produire de belles choses{/coral}. Créant selon les lois des choses et de leur genre, l'homme {violet}fait apparaître ces lois dans l'objet{/violet}, et y manifeste sa relation au genre. {yellow}Le jardinier qui taille un rosier selon la croissance propre du rosier, l'ébéniste qui suit le fil du bois au lieu de le forcer, produisent selon la mesure de l'objet ; et c'est de cet accord que naît la beauté de la rose taillée ou du meuble.{/yellow}

    **Pourquoi « aussi » et « les lois » ?** *Auch* : la beauté {amber}s'ajoute à l'utilité, elle ne la remplace pas{/amber}. Et la beauté a {violet}des lois{/violet} : elle n'est pas un caprice. Marx ne dit pas lesquelles ; la définition de la beauté reste une reconstruction. La fréquentation des belles formes, d'ailleurs, éduque les facultés de l'espèce et forme des sens capables de jouissances humaines.

    ! La beauté n'est pas {red}un luxe réservé à l'art{/red}, ni une théorie de l'art pour l'art : c'est {green}une dimension de toute production libre{/green}, celle de l'ébéniste comme celle du peintre.
  passage:
    label: "§1"
    part: "1. L'homme s'affirme dans sa production"
    text: "L'animal ne façonne que selon la mesure et selon les besoins de l'espèce à laquelle il appartient, tandis que l'homme sait produire à la mesure de toute espèce et sait appliquer partout à l'objet sa nature inhérente. C'est pourquoi l'homme façonne aussi d'après les lois de la beauté."
