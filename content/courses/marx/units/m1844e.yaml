id: m1844e
title: "L'homme étranger à l'homme (1844)"
subtitle: "Manuscrits de 1844, premier manuscrit, « Le travail aliéné », 5 / 5"
group: "Le travail aliéné (Manuscrits de 1844)"
icon: page
color: coral
intro: |-
  La fin du passage sur le travail aliéné : l'homme s'affirme comme être générique en façonnant le monde objectif, à la mesure de toute espèce et d'après les lois de la beauté ; en lui arrachant l'objet de sa production, le travail aliéné lui arrache sa vie générique, et le rend étranger aux autres hommes.
lessons:
- id: m1844e-i1
  title: "Où en est l'argument : la production et l'autre homme"
  notes: |-
    **Ce texte achève la troisième détermination et en tire la quatrième : l'homme rendu étranger à l'homme.**

    Le texte précédent a posé que l'homme est {violet}un être générique{/violet}, qui vit de la nature comme de son corps non organique et fait de son activité vitale l'objet de sa conscience, et que {coral}le travail aliéné renverse ce rapport{/coral} : la vie générique devient le moyen de la vie individuelle.

    Ce texte montre où s'affirme l'être générique : {amber}dans la production pratique d'un monde objectif{/amber}. À la différence de l'animal, qui ne produit que sous l'emprise du besoin immédiat, l'homme produit {teal}« d'une façon universelle »{/teal}, même libéré du besoin, et d'après les lois de la beauté. En lui arrachant l'objet de sa production, le travail aliéné lui arrache donc sa vie générique. Marx en tire les deux derniers résultats : l'homme étranger à son être générique, et {coral}l'homme étranger à l'homme{/coral}.
  passage:
    label: "Introduction"
  points: []
- id: m1844-p17
  title: "Produire universellement, même libéré du besoin"
  notes: |-
    **L'homme s'affirme comme être générique par la production pratique d'un monde objectif ; il produit {green}universellement{/green}, là où l'animal produit {red}unilatéralement{/red}.**

    L'animal produit : le nid, la ruche, la fourmilière. Mais il produit {red}ce dont il a immédiatement besoin{/red}, pour lui ou son petit, sous l'emprise du besoin physique immédiat, et il ne produit que lui-même ; son produit fait partie de son corps. L'homme produit {green}même libéré de tout besoin{/green}, et ne produit vraiment que lorsqu'il l'est ; il reproduit la nature entière ; il affronte librement son produit ; il produit à la mesure de toute espèce, appliquant partout à l'objet sa nature inhérente. {coral}C'est pourquoi il façonne aussi d'après les lois de la beauté.{/coral}
  passage:
    label: "§1"
    text: "Par la production pratique d'un monde objectif, le façonnement de la nature non organique, l'homme s'affirme comme un être générique conscient, c'est-à-dire comme un être qui se comporte à l'égard de l'espèce humaine comme il se comporte à l'égard de sa propre essence, ou à l'égard de soi en tant qu'être générique. Certes, l'animal aussi produit. Il se construit un nid, des habitations, comme l'abeille, le castor, la fourmi, etc. Mais il ne produit que ce dont il a immédiatement besoin pour lui ou pour son petit ; il produit d'une façon unilatérale, tandis que l'homme produit d'une façon universelle ; il ne produit que sous l'emprise du besoin physique immédiat, tandis que l'homme produit même lorsqu'il est libéré de tout besoin physique et ne produit vraiment que lorsqu'il en est vraiment libéré. L'animal ne produit que lui-même, tandis que l'homme reproduit la nature tout entière ; le produit de l'animal fait directement partie de son corps physique, tandis que l'homme affronte librement son produit. L'animal ne façonne que selon la mesure et selon les besoins de l'espèce à laquelle il appartient, tandis que l'homme sait produire à la mesure de toute espèce et sait appliquer partout à l'objet sa nature inhérente. C'est pourquoi l'homme façonne aussi d'après les lois de la beauté."
