- id: m1844-p17b
  title: "L'animal et l'homme : l'unilatéral et l'universel"
  notes: |-
    **Marx concède que l'animal produit, puis distingue sa production de celle de l'homme : l'animal produit {red}pour son besoin immédiat, de façon unilatérale, sous l'emprise du besoin{/red} ; l'homme produit {green}universellement, même libre du besoin{/green}, et ne produit vraiment que libéré de lui.**

    **Pourquoi « certes, l'animal aussi produit » ?** La concession {amber}écarte l'idée que produire suffirait à définir l'homme{/amber} : la différence n'est pas dans le fait de produire, mais dans la manière. Et Marx choisit {violet}les exemples les plus favorables à l'animal{/violet} : l'abeille, le castor, la fourmi, trois bâtisseurs.

    **Pourquoi « ce dont il a immédiatement besoin pour lui ou pour son petit » ?** C'est {amber}le cercle du besoin propre et de la reproduction{/amber}. L'animal ne produit rien au-delà.

    **Pourquoi « unilatérale » et « universelle » ?** *Einseitig* : {violet}d'un seul côté{/violet}, selon une seule ligne ; universelle, selon toutes les directions. {yellow}Le castor bâtit toujours le même barrage, pour s'abriter ; l'homme construit des maisons, mais aussi des observatoires, des jardins et des cathédrales.{/yellow}

    **Pourquoi « sous l'emprise » ?** L'allemand dit *unter der Herrschaft*, {red}sous la domination{/red} : le mot même de la domination du capital, au premier texte. L'animal est dominé par son besoin comme l'ouvrier par son produit.

    **Pourquoi l'homme ne produit-il « vraiment » que libéré du besoin ?** *Erst wahrhaft*, « seulement alors vraiment » : {coral}la production vraie commence où finit la contrainte{/coral}. Le raisonnement implicite est le suivant. Ce qu'un être produit sous la contrainte d'un besoin {amber}révèle ce besoin, non ce qu'il est{/amber} ; ce qu'il produit sans y être contraint {amber}révèle ce qu'il est{/amber}. L'animal ne produit que sous le besoin, et sa production ne montre que son espèce ; l'homme, qui peut produire libre du besoin, montre dans cette production libre ce qui le caractérise, l'universalité. Tant qu'il produit sous la seule nécessité biologique, il ne fait que reproduire sa subsistance {red}sur un mode animal{/red}.

    **Ce que la comparaison rend inévitable.** L'ouvrier aliéné, d'après les textes précédents, ne travaille que pour survivre, sous la contrainte du besoin physique : {coral}il produit donc sur le mode animal{/coral}. Les traits de la production animale sont ceux du travail aliéné : produire pour son seul besoin, sous la domination du besoin. La comparaison n'est pas {red}une digression sur les animaux{/red} : elle est {green}la mesure de ce que l'ouvrier perd{/green}. C'est ce que dira le paragraphe suivant.

    **La preuve qui manquait au troisième texte.** La fuite du travail « comme la peste » ne prouvait l'aliénation qu'à condition qu'un autre travail soit possible ; la voici affirmée : {green}l'homme produit même libéré de tout besoin physique{/green}.

    ! Marx ne {red}méprise pas le travail de subsistance{/red} : il dit seulement que la production humaine {green}ne s'y réduit pas{/green}, et que l'homme ne s'y montre pas tel qu'il est.
  passage:
    label: "§1"
    part: "1. L'homme s'affirme dans sa production"
    text: "Certes, l'animal aussi produit. Il se construit un nid, des habitations, comme l'abeille, le castor, la fourmi, etc. Mais il ne produit que ce dont il a immédiatement besoin pour lui ou pour son petit ; il produit d'une façon unilatérale, tandis que l'homme produit d'une façon universelle ; il ne produit que sous l'emprise du besoin physique immédiat, tandis que l'homme produit même lorsqu'il est libéré de tout besoin physique et ne produit vraiment que lorsqu'il en est vraiment libéré."
