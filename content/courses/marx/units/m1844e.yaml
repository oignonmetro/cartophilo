- id: m1844-p18
  title: "2.1 à 2.3 Se contempler dans son monde, la supériorité changée en infériorité"
  notes: |-
    **L'objet produit est {coral}la vie générique de l'homme devenue objet{/coral} ; le lui arracher, c'est lui arracher sa vie générique, et {coral}changer sa supériorité sur l'animal en infériorité{/coral}.**

    **2.1 Se contempler dans un monde qu'il a créé.** « Précisément » (*Eben … daher*) : la phrase est déduite. La nature façonnée devient {violet}« son œuvre et sa réalité »{/violet} (*Werk*, *Wirklichkeit*). L'homme se {violet}dédouble{/violet} (*verdoppelt*), non seulement en pensée, comme la conscience de soi chez Hegel, mais {amber}« activement, réellement »{/amber}, et {coral}« se contemple dans un monde qu'il a lui-même créé »{/coral}. C'est le redoublement par lequel l'homme reprend à son compte l'activité vitale. Conséquence implicite : {amber}le rapport à soi passe par le monde produit{/amber}, et celui qui en est privé perd le moyen de se reconnaître.

    On y entend un écho de la *Phénoménologie* que loue le troisième manuscrit : Hegel conçoit {teal}« l'homme objectif, véritable parce que réel, comme le résultat de son propre travail »{/teal}, et le rapport actif de l'homme à lui-même comme être générique n'est possible que s'il {amber}« extériorise réellement par la création toutes ses forces génériques »{/amber}. Le travail, médiation entre l'homme et la nature, est aussi {green}la médiation entre l'homme et lui-même{/green}.

    **2.2 La supériorité changée en infériorité.** « Tandis que » traduit encore *Indem daher*. Le travail aliéné lui arrache sa vie générique, son {violet}« objectivité générique »{/violet}, et change son avantage en désavantage, l'allemand dit {amber}« en ce désavantage que »{/amber} sa nature, son corps non organique, lui est soustraite. Pourquoi une infériorité ? L'animal ne vit que d'une petite part de nature, mais {green}il la garde{/green} : son nid fait partie de son corps. L'homme vit de la nature entière ; si ce corps lui est retiré, {red}il est plus démuni que l'animal{/red}. Plus le corps est grand, plus la perte est grande.

    **La propriété, privation de la nature.** Là est la racine d'une critique écologique : la propriété privée, d'abord celle de la terre, est {red}une privation de la nature{/red} ; l'ouvrier n'a plus de rapport direct à son corps non organique et ne l'atteint qu'en travaillant pour un autre. Si la nature est le corps de l'homme, la {violet}rupture du métabolisme{/violet} dont parlera *Le Capital* est {coral}l'aliénation fondamentale{/coral}, déjà là en germe.

    **2.3 La vie générique, moyen de l'existence physique.** « De même » (*Ebenso*) : le premier volet, en faisant de l'activité libre un moyen, rejoint le second. Puis une phrase longtemps absente du texte de l'unité : {teal}« La conscience que l'homme a de son genre se transforme donc du fait de l'aliénation de telle façon que la vie générique devient pour lui un moyen »{/teal}. Pointe contre Feuerbach : la {violet}« conscience du genre »{/violet} n'est pas une faculté autonome, mais {coral}le redoublement de la pratique{/coral}, et elle se dégrade quand la pratique est réduite à la survie.

    ! L'humanité n'est pas {red}une affaire d'objets{/red} ; mais pour un être naturel, {green}elle passe par eux{/green}.
  passage:
    label: "§2"
    part: "2. Ce que le travail aliéné arrache"
    text: "C'est précisément en façonnant le monde objectif que l'homme s'affirme réellement comme un être générique. Cette production est sa vie générique active. Grâce à cette production, la nature apparaît comme son œuvre et sa réalité. L'objet du travail est donc l'objectivation de la vie générique de l'homme, car il ne se dédouble pas lui-même de façon seulement intellectuelle, comme c'est le cas dans la conscience, mais activement, réellement, et il se contemple ainsi dans un monde qu'il a lui-même créé. Ainsi tandis que le travail aliéné arrache à l'homme l'objet de sa production, il lui arrache sa vie générique, sa véritable objectivité générique, et transforme sa supériorité sur l'animal en infériorité, puisque son corps non organique, la nature, lui est dérobé. De même, en dégradant au rang de moyen l'activité propre, la libre activité, le travail aliéné fait de la vie générique de l'homme le moyen de son existence physique. La conscience que l'homme a de son genre se transforme donc du fait de l'aliénation de telle façon que la vie générique devient pour lui un moyen."
