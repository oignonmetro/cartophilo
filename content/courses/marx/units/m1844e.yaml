- id: m1844-p19c
  title: "Ce qui est vrai du rapport à soi est vrai du rapport à l'autre"
  notes: |-
    **Marx étend aux rapports entre les hommes tout ce qu'il a dit du rapport de l'homme à lui-même : {coral}ce qui vaut de l'un vaut de l'autre{/coral}. Et il donne la formule générale : être étranger à son être générique, {coral}c'est être étranger aux autres{/coral}.**

    **Pourquoi « ce qui est vrai… est vrai » ?** La phrase pose {amber}une correspondance terme à terme{/amber}.

    | Rapport à soi | Rapport à l'autre |
    | à son travail | au travail de l'autre |
    | au produit de son travail | à l'objet du travail de l'autre |
    | à lui-même | à l'autre homme |

    Le travail et le produit de l'autre sont {amber}aussi étrangers à l'ouvrier que les siens{/amber}. {yellow}Le tisserand ne voit pas dans le pain qu'il achète le travail d'un boulanger, son semblable, mais une marchandise dont le prix pèse sur son salaire.{/yellow}

    **Pourquoi « d'une manière générale, dire que… c'est dire que » ?** La formule est {violet}une équivalence{/violet}, non une inférence : être étranger à son être générique et être étranger aux autres hommes, {coral}c'est la même chose dite de deux façons{/coral}. On retrouve la structure des équivalences du texte précédent : les deux définitions de l'être générique, la conscience et l'espèce.

    **Pourquoi « chacun d'eux est devenu étranger à l'essence humaine » ?** L'essence humaine n'est pas {red}une idée{/red} que chacun porterait en soi : elle existe {green}dans les rapports entre les hommes{/green}. Si ces rapports se défont, chacun perd ce qui faisait de lui un homme. La séparation des hommes entre eux et la perte de leur humanité sont {coral}un seul et même événement{/coral}.

    **Ce que la phrase annonce.** Un an plus tard, la sixième des *Thèses sur Feuerbach* dira que l'essence humaine est {teal}« l'ensemble des rapports sociaux »{/teal}. La formule est déjà en germe ici : on ne peut être étranger à l'essence humaine qu'en étant étranger aux autres.

    ! L'étrangeté entre les hommes n'est pas {red}un sentiment{/red} d'éloignement : c'est {green}un rapport réel{/green}, celui où le travail et le produit de chacun sont étrangers à tous.
  passage:
    label: "§3"
    part: "3. Les deux derniers résultats"
    text: "Ce qui est vrai du rapport de l'homme à son travail, au produit de son travail et à lui-même, est vrai du rapport de l'homme à l'autre ainsi qu'au travail et à l'objet du travail de l'autre. D'une manière générale, dire que l'homme est étranger à son être générique, c'est dire que les hommes sont devenus étrangers les uns aux autres et que chacun d'eux est devenu étranger à l'essence humaine."
  points:
