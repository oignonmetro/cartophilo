- id: m1844-p19
  title: "3.1 à 3.3 L'être générique étranger, l'homme étranger à l'homme"
  notes: |-
    **Les deux derniers résultats : l'être générique devient étranger à l'homme ; et, {coral}conséquence immédiate{/coral}, l'homme devient étranger à l'homme.**

    **3.1 Le résultat 3).** « Conduit donc » : *macht also*. L'être générique, « aussi bien la nature » (l'allemand dit *die Natur*, la nature extérieure ; GF « sa nature » prête à confusion) que ses facultés spirituelles, devient un être étranger, {amber}un moyen de son existence individuelle{/amber}. L'énumération (corps, monde extérieur, essence spirituelle, essence humaine) montre que {coral}rien de l'homme n'est épargné{/coral}.

    **3.2 Le résultat 4) : l'homme étranger à l'homme.** {teal}« Une conséquence immédiate »{/teal} (*unmittelbare Konsequenz*). Pourquoi immédiate ? Parce que l'être générique est {amber}d'emblée social{/amber} : se rapporter à soi comme à l'espèce, c'est déjà se rapporter aux autres, et l'aliénation de soi « se réalise et se reflète » dans le rapport à autrui. L'allemand le dit avec le verbe du premier texte : si l'homme se fait face à lui-même, {violet}l'autre homme lui fait face{/violet} (*steht ihm gegenüber*). Le travail est d'ailleurs une activité coopérative.

    **3.3 Autrui mesuré à la condition d'ouvrier.** *Also* : chacun considère l'autre {coral}« selon les critères et les conditions de sa propre situation en tant qu'ouvrier »{/coral}, comme un rival pour sa subsistance ou comme un moyen. L'allemand dit *Maßstab*, l'étalon : on peut y entendre un écho à la « mesure de toute espèce » du premier paragraphe, l'universalité réduite à {amber}un seul étalon{/amber}.

    ! Pas de {red}morale de la fraternité perdue{/red} : une déduction à partir de la définition de l'homme, qui prépare la question suivante, {green}« à qui appartient le produit ? »{/green}, à « un autre homme que l'ouvrier ».
  passage:
    label: "§3"
    part: "3. Les deux derniers résultats"
    text: "Le travail aliéné conduit donc aux résultats suivants : 3) L'être générique de l'homme, sa nature, aussi bien que ses facultés intellectuelles génériques, sont transformés en un être qui lui est étranger, en moyen de son existence individuelle. Le travail aliéné rend l'homme étranger à son propre corps, au monde extérieur aussi bien qu'à son essence spirituelle, à son essence humaine. 4) L'aliénation de l'homme par rapport à l'homme apparaît comme une conséquence immédiate du fait que l'homme est rendu étranger au produit de son travail, à son activité vitale, à son être générique. L'homme s'oppose à lui-même, il s'oppose aussi à autrui. Ce qui est vrai du rapport de l'homme à son travail, au produit de son travail et à lui-même, est vrai du rapport de l'homme à l'autre ainsi qu'au travail et à l'objet du travail de l'autre. D'une manière générale, dire que l'homme est étranger à son être générique, c'est dire que les hommes sont devenus étrangers les uns aux autres et que chacun d'eux est devenu étranger à l'essence humaine. L'aliénation de l'homme, plus généralement son rapport à lui-même, se réalise et se reflète dans son rapport à autrui. Donc, pris dans le rapport du travail aliéné, chaque homme considère autrui selon les critères et les conditions de sa propre situation en tant qu'ouvrier."
  points:
