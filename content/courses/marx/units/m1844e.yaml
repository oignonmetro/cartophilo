- id: m1844-p18b
  title: "Se contempler dans un monde qu'il a créé"
  notes: |-
    **L'objet produit est {coral}la vie générique de l'homme devenue objet{/coral} : l'homme s'y dédouble, non en pensée, mais en réalité, et {coral}il se voit lui-même dans le monde qu'il a fait{/coral}.**

    **Pourquoi « l'objectivation de la vie générique » ?** *Vergegenständlichung des Gattungslebens* : le mot du premier texte, où « la réalisation du travail est son objectivation », appliqué maintenant {amber}à l'espèce{/amber}. Ce que l'objet fixe, ce n'est pas seulement le travail d'un ouvrier, c'est la vie de l'espèce en lui.

    **Que veut dire « se dédoubler » ?** *Sich verdoppeln* : le mot de Hegel, pour qui {violet}la conscience de soi est un dédoublement{/violet} : l'esprit se pose comme objet pour lui-même et se reconnaît dans cet objet.

    ? **Dédoublement** (*Verdopplung*) : le mouvement par lequel un être {amber}se pose hors de lui pour se rapporter à lui-même{/amber}. C'est aussi le redoublement par lequel l'activité vitale, qui traverse tout vivant, est reprise par l'homme et devient la sienne.

    **Pourquoi « non seulement intellectuellement, mais activement, réellement » ?** Marx {coral}garde la structure hégélienne et change le lieu{/coral}. L'homme ne se dédouble pas d'abord dans la pensée, mais {amber}dans la matière qu'il transforme{/amber} (*werktätig*, *wirklich*, par l'œuvre, effectivement). C'est dans le monde façonné qu'il se voit, {yellow}comme dans un miroir que son activité a fabriqué{/yellow}.

    **Pourquoi « il se contemple » ?** *Anschaut* : il se voit, il s'intuitionne. Ce n'est pas {red}une jouissance narcissique{/red} : c'est {green}la confirmation de soi que procure l'œuvre{/green}. {yellow}L'artisan qui reconnaît sa main dans le meuble qu'il a fait sait, en le regardant, ce qu'il est capable de faire.{/yellow}

    **La prémisse décisive.** Il en résulte que {coral}le rapport à soi de l'homme passe par le monde qu'il produit{/coral}. Celui qui en est privé {red}perd aussi le moyen de se reconnaître{/red}. C'est ce que la phrase suivante va tirer.

    **Le travail comme double médiation.** Le travail est la médiation entre l'homme et la nature ; par là, il est aussi {coral}la médiation entre l'homme et lui-même{/coral}. Le troisième manuscrit le dit : le rapport actif de l'homme à lui-même comme être générique n'est possible que s'il {teal}« extériorise réellement par la création toutes ses forces génériques »{/teal}.

    ! Se contempler dans son œuvre n'est pas {red}une affaire de conscience{/red}, qui pourrait se faire sans objet : c'est {green}une affaire de monde{/green}, qui suppose l'objet.
  passage:
    label: "§2"
    part: "2. Ce que le travail aliéné arrache"
    text: "L'objet du travail est donc l'objectivation de la vie générique de l'homme, car il ne se dédouble pas lui-même de façon seulement intellectuelle, comme c'est le cas dans la conscience, mais activement, réellement, et il se contemple ainsi dans un monde qu'il a lui-même créé."
