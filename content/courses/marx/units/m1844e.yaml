- id: m1844-p19
  title: "Le résultat 3) : l'être générique devenu étranger"
  notes: |-
    **Marx énonce le troisième résultat : ce qui fait de l'homme un être générique, son rapport à la nature et ses facultés spirituelles, {coral}lui devient étranger et ne sert plus qu'à sa survie{/coral}. Puis il en détaille l'étendue : rien de l'homme n'est épargné.**

    **Pourquoi « conduit donc » ?** L'allemand dit *macht also*, « fait donc » : c'est {amber}la conclusion de toute la démonstration{/amber}. Et « 3) » reprend la numérotation du début du texte précédent, « 1) la nature et 2) lui-même ».

    **Pourquoi « sa nature » ?** L'allemand dit *sowohl die Natur als sein geistiges Gattungsvermögen*, « aussi bien {violet}la nature{/violet} que sa faculté générique spirituelle ». Il s'agit de {amber}la nature extérieure{/amber}, le corps non organique ; la traduction « sa nature » {red}prête à confusion{/red}, comme s'il s'agissait de la nature intérieure de l'homme.

    **Que résume la phrase ?** Ce que le passage a démontré en trois temps : l'homme perd {amber}la nature{/amber}, son corps non organique ; {amber}son activité{/amber}, sa fonction proprement humaine ; et par là {amber}son espèce{/amber}, puisqu'il était générique par l'une et l'autre. Ce qui était sa vie générique devient {coral}« un moyen de son existence individuelle »{/coral}, la formule de l'inversion.

    **Pourquoi l'énumération finale ?** « Son propre corps, le monde extérieur, son essence spirituelle, son essence humaine » : {coral}rien de ce qui constitue l'homme n'est épargné{/coral}. L'aliénation n'est {red}pas une perte partielle{/red}, elle touche l'homme {green}en tous ses rapports{/green}. « Son propre corps » traduit *seinen eignen Leib*, le corps de chair. {yellow}L'ouvrier dont le corps est usé par la chaîne, qui ne voit de la nature que l'atelier et dont l'esprit n'a plus d'emploi, est étranger à tout ce qui fait de lui un homme.{/yellow}

    **Pourquoi l'esprit est-il sur le même plan que le corps ?** On serait tenté de croire que l'aliénation de l'esprit est {red}d'un autre ordre{/red}. Le texte les met {green}sur le même plan{/green}, parce que l'homme est un être naturel dont l'esprit aussi vit de la nature : le texte précédent parlait de sa {violet}« nature spirituelle non organique »{/violet}. Perdre la nature, c'est aussi perdre ce dont l'esprit se nourrit.

    ! Le passage {red}ne démontre rien de nouveau{/red} : il récapitule la troisième détermination dans {green}une formule à retenir{/green}.
  passage:
    label: "§3"
    part: "3. Les deux derniers résultats"
    text: "Le travail aliéné conduit donc aux résultats suivants : 3) L'être générique de l'homme, sa nature, aussi bien que ses facultés intellectuelles génériques, sont transformés en un être qui lui est étranger, en moyen de son existence individuelle. Le travail aliéné rend l'homme étranger à son propre corps, au monde extérieur aussi bien qu'à son essence spirituelle, à son essence humaine."
  points:
