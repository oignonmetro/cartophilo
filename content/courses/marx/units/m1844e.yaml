    fragment: "3/3"
    sentence: "« D'une manière générale, dire que l'homme est étranger à son être générique, c'est dire que ___ et que chacun d'eux est devenu étranger à l'essence humaine. L'aliénation de l'homme, plus généralement son rapport à lui-même, se réalise et se reflète dans son rapport à autrui. Donc, pris dans le rapport du travail aliéné, chaque homme considère autrui selon les critères et les conditions de sa propre situation en tant qu'ouvrier. »"
    answer: "les hommes sont devenus étrangers les uns aux autres"
