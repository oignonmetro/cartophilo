- id: m1844-p19
  title: "Étranger à l'être générique, étranger aux autres hommes"
  notes: |-
    **Résultats : l'homme est étranger à son être générique, donc {red}étranger à autrui{/red}.**

    3) L'être générique de l'homme est transformé en {violet}moyen de son existence individuelle{/violet} : il est rendu étranger à son corps, au monde extérieur, à son essence humaine. 4) L'aliénation de l'homme par rapport à l'homme en découle {coral}immédiatement{/coral} : ce qui est vrai de son rapport à son travail, à son produit, à lui-même, est vrai de son rapport à l'autre et au travail de l'autre. Être étranger à son être générique, c'est que les hommes sont devenus étrangers les uns aux autres et à l'essence humaine. Son rapport à lui-même se réalise et se reflète dans son rapport à autrui, qu'il considère selon sa propre situation d'ouvrier.
  passage:
    label: "§3"
    text: "Le travail aliéné conduit donc aux résultats suivants : 3) L'être générique de l'homme, sa nature, aussi bien que ses facultés intellectuelles génériques, sont transformés en un être qui lui est étranger, en moyen de son existence individuelle. Le travail aliéné rend l'homme étranger à son propre corps, au monde extérieur aussi bien qu'à son essence spirituelle, à son essence humaine. 4) L'aliénation de l'homme par rapport à l'homme apparaît comme une conséquence immédiate du fait que l'homme est rendu étranger au produit de son travail, à son activité vitale, à son être générique. L'homme s'oppose à lui-même, il s'oppose aussi à autrui. Ce qui est vrai du rapport de l'homme à son travail, au produit de son travail et à lui-même, est vrai du rapport de l'homme à l'autre ainsi qu'au travail et à l'objet du travail de l'autre. D'une manière générale, dire que l'homme est étranger à son être générique, c'est dire que les hommes sont devenus étrangers les uns aux autres et que chacun d'eux est devenu étranger à l'essence humaine. L'aliénation de l'homme, plus généralement son rapport à lui-même, se réalise et se reflète dans son rapport à autrui. Donc, pris dans le rapport du travail aliéné, chaque homme considère autrui selon les critères et les conditions de sa propre situation en tant qu'ouvrier."
  points:
  - id: m1844-p19-1
    fragment: "1/3"
    sentence: "« Le travail aliéné conduit donc aux résultats suivants : 3) L'être générique de l'homme, sa nature, aussi bien que ses facultés intellectuelles génériques, sont transformés en ___, en moyen de son existence individuelle. Le travail aliéné rend l'homme étranger à son propre corps, au monde extérieur aussi bien qu'à son essence spirituelle, à son essence humaine. »"
    answer: "un être qui lui est étranger"
