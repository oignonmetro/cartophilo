- id: m1844-p17c
  title: "Reproduire la nature entière, faire librement face à son produit"
  notes: |-
    **Deux oppositions encore : l'animal {red}ne produit que lui-même{/red}, l'homme {green}reproduit la nature tout entière{/green} ; le produit de l'animal {red}fait partie de son corps{/red}, l'homme {green}fait librement face à son produit{/green}.**

    **Que veut dire « l'animal ne produit que lui-même » ?** *Nur sich selbst* : l'animal {amber}reproduit son espèce et son mode de vie{/amber}, toujours les mêmes. Ce qu'il produit le refait tel qu'il était. {yellow}La ruche d'aujourd'hui est celle d'il y a dix mille ans.{/yellow}

    **Que veut dire « l'homme reproduit la nature tout entière » ?** *Die ganze Natur reproduziert* : l'homme produit {amber}selon toutes les espèces{/amber}, il refait la nature à sa manière, la cultive, l'élève, la bâtit. C'est la forme pratique de l'universalité : le corps non organique du texte précédent devient {coral}un monde transformé{/coral}. Dans la nature travaillée, l'homme trouve sa propre marque : le monde produit {violet}représente l'activité humaine{/violet}.

    **Pourquoi « fait directement partie de son corps physique » ?** L'allemand dit *Leib* : {amber}le nid prolonge l'animal{/amber}, comme un organe de plus. L'animal ne peut pas s'en détacher pour le regarder.

    **Pourquoi « affronte librement son produit » ?** *Tritt frei seinem Produkt gegenüber* : c'est {coral}le verbe du premier texte{/coral}, *gegenübertreten*, où le produit « se dresse devant » l'ouvrier comme un être étranger. Ici, le même verbe est pris {green}dans son sens normal{/green} : l'homme se tient librement en face de ce qu'il a fait, il peut le regarder, le juger, le refaire autrement. Le travail aliéné ne crée pas la position en face, il {red}la rend hostile{/red}.

    **Pourquoi cette distance est-elle une liberté ?** Parce que celui qui fait face à son produit {amber}n'est pas confondu avec lui{/amber}, comme l'animal avec son activité : il peut le vouloir autre. C'est la même distance que celle du texte précédent, où l'homme {amber}a{/amber} son activité au lieu de l'{amber}être{/amber}. {yellow}Le peintre recule pour juger son tableau ; l'oiseau ne recule pas pour juger son nid.{/yellow}

    ! « Affronter » n'a pas ici {red}le sens d'un combat{/red} : c'est {green}se tenir en face{/green}, librement, ce que le travail aliéné va retourner en hostilité.
