    sentence: "« 4) L'aliénation de l'homme par rapport à l'homme apparaît comme ___ du fait que l'homme est rendu étranger au produit de son travail, à son activité vitale, à son être générique. L'homme s'oppose à lui-même, il s'oppose aussi à autrui. Ce qui est vrai du rapport de l'homme à son travail, au produit de son travail et à lui-même, est vrai du rapport de l'homme à l'autre ainsi qu'au travail et à l'objet du travail de l'autre. »"
    answer: "une conséquence immédiate"
