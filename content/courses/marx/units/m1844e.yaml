    sentence: "« De même, en dégradant au rang de moyen l'activité propre, la libre activité, le travail aliéné fait de la vie générique de l'homme ___. La conscience que l'homme a de son genre se transforme donc du fait de l'aliénation de telle façon que la vie générique devient pour lui un moyen. »"
    answer: "le moyen de son existence physique"
