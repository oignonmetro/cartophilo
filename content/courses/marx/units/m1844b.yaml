- id: m1844-p5b
  title: "La nature, matière de tout travail"
  notes: |-
    **Marx rappelle une condition de tout travail : {coral}on ne produit rien sans la nature{/coral}. Elle est la matière que le travail transforme, le lieu où il s'exerce, le point de départ et l'instrument de la production.**

    **Pourquoi « créer » ?** Le mot (*schaffen*) est fort : il prête au travail une puissance de création. Mais la phrase en {amber}limite aussitôt la portée{/amber} : la création humaine suppose une matière qu'elle ne crée pas. L'homme ne crée pas {red}à partir de rien{/red}, il {green}transforme ce qui lui est donné{/green}.

    **Pourquoi « ne peut plus » ?** L'allemand dit seulement *kann nichts schaffen*, « ne peut rien créer », sans « plus ». La phrase énonce {amber}une condition de tout travail{/amber}, non une situation nouvelle, comme la traduction pourrait le laisser croire.

    **Pourquoi « le monde extérieur sensible » ?** *Die sinnliche Außenwelt.* {violet}Extérieur{/violet}, parce qu'il est hors de l'ouvrier ; {violet}sensible{/violet}, parce qu'il s'offre aux sens, par opposition à ce qui n'existe que dans la pensée. Le mot est celui de Feuerbach, qui oppose à l'idéalisme la réalité de ce qu'on touche et voit. Marx ne parle pas d'une Nature métaphysique, mais de la terre, du bois, des métaux, de l'eau.

    **Pourquoi quatre relatifs ?** « Dans laquelle », « au sein de laquelle », « à partir de laquelle », « au moyen de laquelle » : la phrase énumère {coral}quatre rôles de la nature{/coral}, et aucun aspect du travail ne lui échappe.

    | Relatif | Rôle de la nature | Pour le menuisier |
    | dans laquelle | ce en quoi le travail prend forme | la table achevée, faite de bois |
    | au sein de laquelle | le milieu où il agit | l'atelier, la lumière, l'air |
    | à partir de laquelle | la matière première d'où il part | la planche, venue de l'arbre |
    | au moyen de laquelle | l'instrument dont il se sert | le rabot, fait d'acier et de bois |

    **Pourquoi Marx commence-t-il par la nature, pour examiner la perte de l'objet ?** Le raisonnement implicite tient en deux étapes.
    - Si tout produit est fait de nature transformée, {amber}perdre ses produits, c'est perdre la part de nature{/amber} que son travail a faite sienne.
    - Si le travail ne peut s'exercer que sur la nature, {amber}perdre l'accès à la nature, c'est perdre la possibilité même de travailler{/amber}.

    La perte de l'objet devient ainsi {coral}une perte de la nature{/coral}, et l'ouvrier « privé d'objets » reçoit son contenu.

    **Ce que ce raisonnement suppose.** Une thèse que le paragraphe ne formule pas, mais qu'il rend nécessaire : l'homme {red}n'est pas un esprit qui ferait face à la nature{/red}, il {green}en est une partie{/green}, qui ne vit et n'agit qu'en rapport avec elle. Pour un tel être, ce qui aliène n'est pas d'avoir la nature hors de soi, mais {coral}d'être privé de ce rapport{/coral}. Le texte sur l'être générique dira que la nature est le {violet}« corps non organique »{/violet} de l'homme. Et Marx maintiendra la thèse toute sa vie : en 1875 encore, il objectera au parti ouvrier allemand que {teal}« le travail n'est pas la source de toute richesse »{/teal}, la nature l'étant {teal}« tout autant »{/teal} (*Critique du programme de Gotha*).

    ! On serait tenté d'y voir {red}une banalité{/red}, qu'on ne fait pas de table sans bois. Mais la banalité a {green}une fonction critique{/green} : elle rappelle que le travail dépend de conditions qui ne sont pas en lui, et donc {amber}qu'on peut en être séparé{/amber}. {yellow}Un ébéniste qui aurait toute l'habileté du monde ne produirait rien s'il n'avait accès à aucun bois.{/yellow}
