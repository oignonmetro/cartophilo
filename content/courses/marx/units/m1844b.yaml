- id: m1844-p8c
  title: "Le rapport du riche, conséquence du rapport de l'ouvrier"
  notes: |-
    **Marx établit {coral}un ordre entre deux rapports{/coral} : le rapport immédiat, celui de l'ouvrier à ce qu'il produit, est premier ; celui du riche à la production en découle, et le confirme.** C'est l'inverse de l'ordre de l'économie politique.

    **Pourquoi identifier « le travail » et « l'ouvrier » ?** La première phrase reprend la parenthèse précédente : parler du rapport du travail à ses produits, {amber}c'est parler d'hommes qui travaillent{/amber}. Le travail n'est pas une abstraction, c'est l'activité d'un ouvrier devant des objets.

    **Pourquoi « l'homme qui a de la fortune » ?** L'allemand dit *der Vermögende*, de *Vermögen*, qui signifie à la fois {violet}la fortune et le pouvoir, la faculté{/violet}. Le riche est {amber}celui qui peut{/amber} ; l'ouvrier, celui dont la puissance est passée dans l'objet. Et le riche se rapporte aux produits et à la production {red}du dehors{/red}, comme propriétaire, non comme producteur.

    **Pourquoi le rapport du riche serait-il la conséquence de celui de l'ouvrier, et non l'inverse ?** C'est la thèse la plus lourde du paragraphe, et le texte la pose sans la démontrer. On peut reconstruire le raisonnement.
    - Le riche {amber}ne produit pas{/amber} les objets qu'il possède.
    - Il ne peut donc les avoir que si {amber}ceux qui les produisent ne les ont pas{/amber} : sa possession suppose la dépossession de l'ouvrier.
    - La dépossession de l'ouvrier, elle, ne suppose rien d'autre que le rapport aliéné de l'ouvrier à son produit, décrit depuis le début.

    Le rapport du riche est donc {coral}second, comme l'envers d'une chose est second par rapport à la chose{/coral}. {yellow}Le propriétaire d'une filature ne possède les étoffes que parce que les tisserands ne les possèdent pas ; sa fortune est l'envers de leur dépouillement.{/yellow}

    **Pourquoi « et il le confirme » ?** La phrase est brève, isolée, et c'est la plus dense du paragraphe : {coral}la richesse des uns devient la preuve de l'aliénation des autres{/coral}. Une conséquence atteste son principe, comme un effet atteste sa cause : le palais habité par un autre atteste que le travail qui l'a bâti a été aliéné. La fin du premier manuscrit le précisera : {teal}« le non-ouvrier fait contre l'ouvrier tout ce que l'ouvrier fait contre lui-même »{/teal}. Ce que l'ouvrier vit comme un acte qui le dépouille, le riche le détient comme un état.

    **Pourquoi cet ordre est-il décisif ?** Parce qu'il {coral}renverse celui de l'économie politique{/coral}, qui part de la propriété privée, c'est-à-dire du rapport du possesseur, et en déduit les salaires. Marx part du rapport de l'ouvrier, et en déduira, à la fin du passage, la propriété privée elle-même, {teal}« la conséquence nécessaire du travail aliéné »{/teal}, alors qu'elle en paraît la cause.

    **Pourquoi « plus tard » ?** Marx {amber}remet à plus tard{/amber} l'analyse du rapport du non-ouvrier ; il ne fera que l'aborder à la toute fin du premier manuscrit, interrompu peu après. Le maître, différé depuis le début du texte, est désormais nommé, mais pas encore examiné.

    ! Dire que le rapport du riche n'est « qu'une conséquence », ce n'est pas {red}l'absoudre{/red} : c'est dire qu'il n'est {green}pas premier dans l'ordre de l'explication{/green}.
  passage:
    label: "§4"
    part: "3. Ce que l'économie politique dissimule"
    text: "Le rapport immédiat du travail à ses produits est le rapport de l'ouvrier aux objets de sa production. Le rapport de l'homme qui a de la fortune aux objets de la production et à la production elle-même n'est qu'une conséquence de ce premier rapport. Et il le confirme. Nous examinerons cet autre aspect plus tard."
