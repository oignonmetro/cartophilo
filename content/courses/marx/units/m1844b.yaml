- id: m1844-p6b
  title: "Plus il s'approprie la nature, plus il en est privé"
  notes: |-
    **La proportion inverse du texte précédent revient, appliquée à la nature : {coral}plus l'ouvrier fait sienne la nature en la travaillant, plus elle lui échappe{/coral}, sous les deux rapports qu'on vient de distinguer.** Elle cesse d'être la matière de son travail à lui, et elle cesse d'être ce dont il vit.

    **Pourquoi « plus… plus » ?** L'allemand ajoute *also*, {violet}« donc »{/violet}, que la traduction omet : la phrase se donne comme {amber}la conséquence{/amber} des deux précédentes.

    **Pourquoi « s'approprie » ?** *Sich aneignen*, faire sien, rendre propre. Le mot reprend l'« appropriation » du texte précédent, devenue aliénation. Et « par son travail » insiste : {amber}c'est bien l'ouvrier qui s'approprie{/amber}, par son activité propre.

    **Pourquoi « il se prive » ?** L'allemand dit qu'il se soustrait à lui-même des moyens de vivre : le pronominal fait de l'ouvrier {coral}l'agent de sa propre privation{/coral}. Ce n'est pas un voleur qui le dépouille, {red}c'est son travail{/red}.

    **Pourquoi « doublement » ?** Selon les deux sens distingués à la phrase précédente.
    - **Premièrement**, la nature cesse d'être {violet}« un objet appartenant à son travail »{/violet} : l'appartenance est attribuée au travail, non à l'ouvrier. La matière devrait être celle de son activité ; elle devient celle d'un autre.
    - **Deuxièmement**, elle cesse d'être un moyen de subsistance {violet}« au sens immédiat »{/violet}, le sens premier, élémentaire : ce dont son corps vit.

    « Cesse de plus en plus » : le processus est {amber}progressif{/amber}, une dépossession qui avance à mesure que le travail avance.

    **Le « donc » tient-il ?** Non, pas à lui seul. De ce que la nature nourrit le travail et l'ouvrier, on conclurait plutôt {red}l'inverse{/red} : plus l'ouvrier se l'approprie, plus il devrait en disposer. Pour que la conséquence tienne, il faut distinguer {coral}deux sens de l'appropriation{/coral}.

    | L'acte de s'approprier | La propriété de ce qui est approprié |
    | le travail, transformer la nature (*Aneignung*) | le résultat, la nature transformée (*Eigentum*) |
    | il est à l'ouvrier | il est à un autre |

    Chaque morceau de nature que l'ouvrier transforme devient un produit qui ne lui appartient pas, et qui s'ajoute à ce qui lui fait face. {coral}Plus il travaille, plus la nature transformée passe du côté du capital{/coral}, et moins il en reste à sa portée. {yellow}Le paysan devenu ouvrier agricole laboure chaque année plus de terre, mais aucune de ces terres n'est à lui, et le blé qu'il fait pousser, il doit l'acheter.{/yellow} Le texte ne nomme pas cette distinction ; l'expression « un objet appartenant à son travail » la fait sentir, puisque c'est cette appartenance qui se perd.

    **Le travail présent fait-il tout ?** Non. Cette dépossession suppose que {amber}la terre, les matières et les instruments soient déjà propriété d'autrui{/amber}, ce que les colonnes sur la rente et le profit ont décrit. Le « de plus en plus » dit que le travail de l'ouvrier {coral}aggrave une séparation qu'il trouve déjà en place{/coral}. Résultat : l'ouvrier n'a plus d'accès direct à la matière, il faut qu'on la lui présente ; et il n'accède aux vivres qu'en accédant d'abord au travail.

    ! Marx ne décrit pas {red}un épuisement de la nature{/red}, comme si l'ouvrier la détruisait en la transformant : il décrit {green}une dépossession{/green}. La nature transformée existe bel et bien ; elle n'est simplement plus à lui.
  passage:
    label: "§2"
    part: "1. La nature perdue deux fois"
    text: "Plus l'ouvrier s'approprie par son travail le monde extérieur, la nature sensible, plus il se prive de moyens de subsistance et cela doublement : premièrement, le monde extérieur sensible cesse de plus en plus d'être un objet appartenant à son travail, un moyen de subsistance de son travail ; deuxièmement, il cesse de plus en plus d'être un moyen de subsistance au sens immédiat, c'est-à-dire il cesse d'être un moyen pour la subsistance physique de l'ouvrier."
