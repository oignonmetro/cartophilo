# manuscrit, « Le travail aliéné », la nature, double moyen de
# subsistance, l'ouvrier esclave de son objet, les six inversions, la
# dissimulation par l'économie politique (§5 à §8 de l'ancienne unité).
# d'après la traduction GF (Jacques-Pierre Gougeon), choisie par l'utilisateur.
