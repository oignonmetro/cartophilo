- id: m1844-p7
  title: "2.1 et 2.2 Le serviteur de son objet, le comble de la servitude"
  notes: |-
    **De la double privation, Marx déduit une double dépendance : l'ouvrier devient {coral}le serviteur de son objet{/coral}, et le comble de cette servitude est {coral}un cercle{/coral}.**

    **2.1 Recevoir du travail, recevoir de quoi vivre.** « Esclave » traduit *Knecht*, {amber}le serviteur de Hegel{/amber}, non *Sklave*. Le verbe dit le renversement : celui qui produit {violet}« reçoit »{/violet}, un objet de travail, « c'est-à-dire du travail », et des vivres ; il lui doit d'exister comme ouvrier et comme sujet physique.

    **Pourquoi une servitude, et non une simple dépendance ?** On dépend du pain sans en être le serviteur. Une dépendance devient servitude quand {amber}l'accès à ce dont on dépend passe par un autre{/amber} : l'ouvrier ne peut plus atteindre la nature, et c'est de son objet devenu capital qu'il reçoit le droit de travailler. Chez Hegel, le serviteur se libère par le travail, parce qu'il forme la chose ; ici, {red}la chose formée ne lui reste pas{/red}, et le travail asservit.

    **2.2 Le comble : un cercle.** *Spitze*, la pointe. Seule sa qualité d'ouvrier le conserve comme sujet physique (il ne vit que de son salaire), et il n'est plus ouvrier qu'en tant que sujet physique : son travail n'emploie plus que {amber}sa force{/amber} et ne sert plus qu'{amber}à entretenir son corps{/amber}, les deux sens que retiennent les commentateurs (Fischbach). L'allemand dit deux fois *nur mehr*, « ne… plus que » : il n'y a plus que cela.

    Le cercle {coral}n'a pas d'issue intérieure{/coral} : il travaille pour vivre et ne vit que pour travailler. C'est une {green}réduction{/green} de l'homme à deux fonctions qui n'existent plus que l'une pour l'autre, {red}plus qu'une pauvreté{/red}.

    ! « Esclave » n'est pas une hyperbole morale : c'est {green}un rapport de dépendance personnelle transposé à un rapport aux choses{/green}.
  passage:
    label: "§3 (1)"
    part: "2. Le serviteur de son objet"
    text: "De ce double point de vue, l'ouvrier devient donc un esclave de son objet : premièrement, il reçoit un objet de travail, c'est-à-dire du travail, et, deuxièmement, il reçoit des moyens de subsistance. Il lui doit donc la possibilité d'exister premièrement en tant qu'ouvrier et deuxièmement en tant que sujet physique. Le comble de cette servitude est que seule sa qualité d'ouvrier lui permet de se conserver encore en tant que sujet physique, et que ce n'est plus qu'en tant que sujet physique qu'il est ouvrier."
  points:
