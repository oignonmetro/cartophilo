- id: m1844-p8
  title: "L'économie politique dissimule l'aliénation"
  notes: |-
    **Après avoir montré l'aliénation dans les faits mêmes de l'économie, Marx explique pourquoi les économistes ne la voient pas : {coral}ils ne regardent pas ce qui se passe entre l'ouvrier et ce qu'il produit{/coral}.** La critique passe des faits au savoir qui les décrit.

    **Pourquoi « dissimule » ?** *Verbirgt* : cacher, mettre à l'abri des regards. Le mot est {amber}plus fort que méconnaître{/amber} : il dit qu'un savoir peut recouvrir ce qu'il touche. Mais il a pour sujet {violet}une science{/violet}, non des personnes : ce n'est {red}ni un mensonge ni une erreur de calcul{/red}, c'est un regard qui se porte ailleurs.

    **Pourquoi « l'aliénation dans l'essence du travail » ?** L'aliénation {red}n'est pas un accident extérieur{/red} au travail : elle est inscrite dans ce qu'est le travail dans ces conditions. La cacher, c'est donc {coral}cacher l'essence même de ce que l'économie étudie{/coral}.

    **Pourquoi « par le fait que » ?** *Dadurch, daß* : la dissimulation a {amber}une cause précise{/amber}, un choix d'objet. « Ne considère pas » : ce que l'économie ne regarde pas, elle ne peut le voir.

    **Pourquoi « le rapport direct » ?** *Das unmittelbare Verhältnis*, le rapport {violet}immédiat{/violet}, sans intermédiaire. L'économie considère l'ouvrier à travers des médiations, le marché, le salaire, le prix ; jamais dans son rapport sans médiation à ce qu'il fait. {yellow}Le comptable d'une fabrique voit les salaires comme une dépense parmi d'autres, à côté du charbon et de la laine ; il ne voit jamais l'ouvrier devant l'étoffe qu'il a tissée et qui part sans lui.{/yellow}

    **Pourquoi « l'ouvrier (le travail) » ?** La parenthèse {amber}identifie l'ouvrier et le travail{/amber}, comme le fait l'économie, pour qui l'ouvrier n'est que du travail. Mais elle dit aussi l'inverse : {green}le rapport du travail à la production est un rapport humain{/green}, celui d'un ouvrier. Le Chapitre VI du *Capital* fera de cette équivalence le résultat du rapport capitaliste : le travailleur y devient {teal}« simple personnification du travail pour le capital »{/teal}.

    **Comment une science peut-elle cacher ce qu'elle décrit ?** Le texte ne le dit pas ; le raisonnement tient au {coral}point de vue{/coral}.
    - L'économie politique, Marx l'a dit avant le passage, {amber}part du fait de la propriété privée{/amber} sans l'expliquer.
    - Elle considère donc la production {amber}depuis la place de celui qui possède{/amber}, pour qui le travail est un facteur de production parmi d'autres, et le salaire un coût.
    - De cette place, le rapport de l'ouvrier à son produit {red}n'apparaît pas{/red} : l'ouvrier n'y figure que comme vendeur de travail, son produit comme marchandise appartenant à un autre.

    La misère ouvrière apparaît bien, mais comme {amber}un effet des lois du salaire{/amber}, non comme l'expression d'un rapport entre un homme et son œuvre. {coral}Les faits sont vus, leur sens est caché{/coral} : c'est en ce sens précis qu'il y a dissimulation, et non ignorance.

    ! Marx n'accuse pas les économistes de {red}mauvaise foi{/red} : il accuse {green}leur point de vue{/green}, qui rend invisible ce qu'ils décrivent.
  passage:
    label: "§4"
    part: "3. Ce que l'économie politique dissimule"
    text: "L'économie politique dissimule l'aliénation dans l'essence du travail par le fait qu'elle ne considère pas le rapport direct entre l'ouvrier (le travail) et la production."
  points:
