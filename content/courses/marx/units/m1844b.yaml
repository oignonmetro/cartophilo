- id: m1844-p8d
  title: "La question du rapport essentiel de l'ouvrier à la production"
  notes: |-
    **La dernière phrase tire {coral}une règle de méthode{/coral} de ce qui précède : la question de l'essence du travail est celle du rapport de l'ouvrier à la production.** Elle fixe la direction de toute la suite du passage.

    **Pourquoi « si donc » ?** *Wenn wir also fragen* : la conclusion {amber}se tire de la priorité{/amber} qui vient d'être posée. Si le rapport de l'ouvrier est premier et celui du riche second, c'est le premier qu'il faut interroger pour comprendre le travail.

    **Pourquoi « le rapport essentiel » ?** *Das wesentliche Verhältnis* : {violet}le rapport qui fait l'essence du travail{/violet}, celui sans lequel le travail ne serait pas ce qu'il est. Ce n'est pas un rapport parmi d'autres, c'est celui dont les autres dérivent. Dans la seconde moitié, l'allemand dit seulement « le rapport de l'ouvrier à la production » : la traduction répète « essentiel ».

    **Pourquoi ce déplacement compte-t-il ?** Parce qu'il change {coral}la place d'où l'on regarde{/coral}. L'économie politique interroge le travail depuis le possesseur : combien il coûte, combien il rapporte. Marx l'interroge {green}depuis celui qui travaille{/green}. {yellow}Demander ce qu'est le travail au propriétaire de la filature, c'est obtenir un prix de revient ; le demander au tisserand, c'est apprendre ce qu'il vit au métier.{/yellow}

    **Qu'est-ce que la phrase annonce ?** Si l'essence du travail est dans le rapport de l'ouvrier à la production, il faut examiner ce rapport {amber}non seulement dans le produit{/amber}, ce que Marx a fait jusqu'ici, {amber}mais dans l'acte même de produire{/amber}. Le texte suivant le fera : « la production » désigne à la fois ce qui est produit et l'acte de produire, et Marx va passer de l'un à l'autre. Le produit, dira-t-il, n'est que {teal}« le résumé de l'activité »{/teal}.

    **Quelle est la force du paragraphe ?** Celle d'{amber}une thèse de méthode{/amber}, posée plus que démontrée, mais que toute la suite va mettre en œuvre. Le troisième mouvement a déplacé la critique des faits vers le savoir qui les décrit : pour voir l'aliénation, {coral}il faut se placer là où elle se produit{/coral}, dans le rapport immédiat de l'ouvrier à la production.

    ! La question n'est pas {red}une question morale{/red} sur la condition ouvrière : c'est {green}une question d'essence{/green}, ce qu'est le travail.
  passage:
    label: "§4"
    part: "3. Ce que l'économie politique dissimule"
    text: "Si donc nous posons la question : quel est le rapport essentiel du travail, nous posons la question du rapport essentiel de l'ouvrier à la production."
  points:
  - id: m1844-p8-11
    sentence: "« Si donc nous posons la question : quel est le rapport essentiel du travail, nous posons ___. »"
    answer: "la question du rapport essentiel de l'ouvrier à la production"
