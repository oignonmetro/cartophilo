- id: m1844-p5
  title: "Examiner de plus près l'objectivation"
  notes: |-
    **Marx annonce qu'il va regarder {coral}de plus près{/coral} ce que le texte précédent a décrit : l'objectivation, et la perte de l'objet qui s'y loge.** Ce n'est pas un nouveau sujet, c'est un approfondissement.

    **Pourquoi « de plus près » ?** L'allemand *Betrachten wir nun näher* dit « examinons maintenant de plus près » : le *nun* marque {amber}une étape{/amber}, le comparatif un resserrement du regard. Le texte précédent avait établi le renversement à grands traits ; il avait laissé une formule sans contenu, l'ouvrier « privé d'objets ». Il faut maintenant dire {coral}quels objets{/coral}, et comment leur perte se produit.

    **Pourquoi « l'objectivation, la production de l'ouvrier » ?** L'apposition {amber}identifie{/amber} l'objectivation et l'acte de produire : s'objectiver, pour l'ouvrier, c'est produire, et produire, c'est mettre son travail dans un objet. Le texte précédent l'avait posé : {teal}« la réalisation du travail est son objectivation »{/teal}.

    **Pourquoi « et, en elle, l'aliénation » ?** C'est le mot le plus important de la phrase. L'aliénation est {coral}dans{/coral} l'objectivation, {red}non après elle{/red}. Marx ne dit pas que l'ouvrier produit d'abord, puis perd ce qu'il a produit, comme on perd un bien qu'on a possédé ; il dit que {green}produire, dans ces conditions, est déjà perdre{/green}. {yellow}L'ouvrier de la fabrique de meubles ne possède jamais, fût-ce un instant, la table qu'il fait : elle est à un autre dès le premier coup de rabot.{/yellow} L'aliénation est une objectivation qui est en même temps une perte.

    **Pourquoi « la perte de l'objet, de son produit » ?** La seconde apposition semble {amber}restreindre{/amber} l'objet au produit : ce que l'ouvrier perd, ce serait ce qu'il a fait. La suite va l'{amber}élargir{/amber} : l'objet perdu sera la nature entière, dont tout produit est fait et sans laquelle aucun travail n'est possible. Le texte part de la formule acquise et va lui donner sa portée.

    ! « Examinons de plus près » n'annonce pas {red}une preuve nouvelle{/red} du renversement : il annonce {green}son contenu{/green}, ce qu'est au juste l'objet perdu.
