# Unité de texte (voir content/textes.md) : Marx, *Manuscrits de 1844*, premier
# manuscrit, « Le travail aliéné », la nature, double moyen de
# subsistance, l'ouvrier esclave de son objet, les six inversions, la
# dissimulation par l'économie politique (§5 à §8 de l'ancienne unité).
# d'après la traduction GF (Jacques-Pierre Gougeon), choisie par l'utilisateur.
# Les appels de note et les marques de page sont retirés ; le texte est celui de
# l'extraction du PDF de l'utilisateur. Commentaire : les séances de Fischbach
# des 13 et 20 octobre et du 3 novembre 2026 (voir les unités ali1 à ali6) ;
# allemand d'après le texte allemand de marxists.org (MEW 40). Le passage
# (p. XXII à XXIV du manuscrit de Marx) était une seule unité jusqu'au
# 2026-11-21 ; il est réparti en cinq unités (m1844, m1844b à m1844e), qui
# gardent les identifiants des leçons et des cartes (m1844-p…), donc leur
# révision, avec des § renumérotés dans chaque unité.

id: m1844b
title: "L'ouvrier, esclave de son objet (1844)"
subtitle: "Manuscrits de 1844, premier manuscrit, « Le travail aliéné », 2 / 5"
group: "Le travail aliéné (Manuscrits de 1844)"
icon: page
color: coral
intro: |-
  La perte de l'objet examinée de plus près : la nature fournit au travail sa matière et à l'ouvrier ses moyens de subsistance, et l'ouvrier, qui s'en approprie toujours plus par son travail, en est doublement privé ; il devient l'esclave de son objet, ce que l'économie politique dissimule.
lessons:
- id: m1844b-i1
  title: "Où en est l'argument : la perte de l'objet"
  notes: |-
    **Ce texte reprend l'aliénation du produit pour la creuser : il montre ce que l'ouvrier perd quand il perd l'objet.**

    Le texte précédent est parti d'{violet}un fait économique actuel{/violet}, l'appauvrissement de l'ouvrier à mesure qu'il produit, et en a dégagé le sens : {coral}l'objectivation du travail devient pour l'ouvrier la perte de l'objet{/coral}, et le produit se dresse devant lui comme une puissance étrangère, comme Dieu devant l'homme chez Feuerbach. Il laissait une formule déroutante : plus l'activité de l'ouvrier est grande, plus il est {teal}« privé d'objets »{/teal}.

    Ce texte l'explique par {amber}la nature{/amber}, sans laquelle l'ouvrier ne peut rien créer, et qui lui fournit deux choses : la matière de son travail et ses moyens de subsistance. Plus il s'approprie la nature par son travail, plus il perd l'une et l'autre, et il devient {coral}l'esclave de son objet{/coral}. La parenthèse des six inversions le dit {teal}« selon les lois de l'économie »{/teal}, puis Marx montre que l'économie politique dissimule ce rapport.

    ! Le texte ne passe pas encore à l'activité : il reste dans la première détermination, le rapport de l'ouvrier au produit, qu'il approfondit.
  passage:
    label: "Introduction"
  points: []
- id: m1844-p5
  title: "La nature, matière du travail"
  notes: |-
    **Pour examiner l'objectivation, Marx rappelle d'abord que l'ouvrier ne crée rien {red}sans la nature{/red}.**

    La nature, le {violet}monde extérieur sensible{/violet}, est {amber}la matière dans laquelle le travail se réalise{/amber}, au sein de laquelle il s'exerce, à partir de laquelle et au moyen de laquelle il produit. Le travail a donc une condition qui n'est pas lui : un monde d'objets. Marx annonce l'enjeu : l'aliénation est {coral}la perte de l'objet, de son produit{/coral}, mais aussi celle des objets sans lesquels il ne produit rien.
  passage:
    label: "§1"
    text: "Examinons de plus près l'objectivation, la production de l'ouvrier et, en elle, l'aliénation, la perte de l'objet, de son produit. L'ouvrier ne peut plus rien créer sans la nature, sans le monde extérieur sensible. Elle est la matière dans laquelle son travail se réalise, au sein de laquelle il s'exerce, à partir de laquelle et au moyen de laquelle il produit."
