- id: m1844b-i2
  title: "La question, la thèse, la problématique"
  notes: |-
    **Le texte se demande ce que perd exactement l'ouvrier quand son objectivation devient une perte de l'objet, et {coral}pourquoi l'économie politique, qui décrit pourtant sa misère, ne le voit pas{/coral}.**

    **Une question en deux temps.** Elle porte d'abord sur {amber}le contenu de la perte{/amber}, et sur la forme de dépendance qu'elle engendre. Elle porte ensuite sur {amber}un savoir{/amber}. Les économistes ne nient pas la misère ouvrière : Smith reconnaissait que le salaire tend vers le minimum et que la division du travail abrutit l'ouvrier. Si l'aliénation n'est pas vue, ce n'est donc {red}pas faute de faits{/red}. Qu'est-ce que l'économie politique manque, dans des faits qu'elle a sous les yeux ?

    **Sa thèse :** le travail ne peut rien créer sans la nature, qui lui fournit sa matière et fournit à l'ouvrier ses moyens de vivre. Or, dans le travail aliéné, {coral}l'acte de s'approprier la nature est à l'ouvrier, mais la nature appropriée ne l'est pas{/coral} : plus il travaille, plus il en est privé, sous ce double rapport. Il doit alors {amber}recevoir{/amber} de son objet de quoi travailler et de quoi vivre, et devient {violet}le serviteur (*Knecht*) de ce qu'il produit{/violet}, enfermé dans le cercle d'un homme qui ne vit que pour travailler et ne travaille que pour vivre. L'économie politique dissimule cette aliénation parce qu'elle {red}ne considère pas le rapport immédiat de l'ouvrier à la production{/red}, dont le rapport du riche n'est que la conséquence.

    **Sa problématique :** comment l'appropriation de la nature par le travail, l'acte même par lequel l'homme se rend maître de son monde, peut-elle faire de l'ouvrier un serviteur, et {coral}le serviteur non d'un maître, mais de son propre objet{/coral} ?

    **Pourquoi est-ce difficile ?** Pour deux raisons.
    - Travailler, c'est s'approprier : transformer la matière pour la faire sienne. On s'attend donc à ce que {green}plus l'ouvrier travaille, plus la nature lui appartienne{/green} ; le texte affirme l'inverse, et en fait une loi.
    - La servitude suppose d'ordinaire {amber}un maître{/amber}, quelqu'un qui commande. Or Marx parle d'un serviteur {red}« de son objet »{/red}, d'une chose, et d'une chose qu'il a lui-même produite.

    | Difficulté | Où elle se trouve | Réponse du texte |
    | l'appropriation prive au lieu d'enrichir | « plus l'ouvrier s'approprie… plus il se prive » | l'acte d'approprier est à l'ouvrier, la nature appropriée à un autre |
    | le serviteur d'une chose, sans maître | « un esclave de son objet » | le texte ne considère encore que le rapport de l'ouvrier à son objet : le maître est différé |
    | l'ouvrier « esclave de la nature », alors que le travail devait l'en affranchir | la sixième inversion | le travail le ramène à la nécessité la plus élémentaire, survivre |
    | une science qui cache ce qu'elle décrit | « l'économie politique dissimule » | elle voit les faits depuis la place du possesseur, non depuis le rapport de l'ouvrier |

    **L'hypothèse de lecture :** tout repose sur une distinction que le texte {amber}suppose plus qu'il ne la formule{/amber}, celle de {violet}l'acte de s'approprier{/violet} et de {violet}la propriété de ce qui est approprié{/violet}. Elle affleure dans « un objet appartenant à son travail », puis dans l'opposition de ce que le travail produit « pour les riches » et « pour l'ouvrier ».

    ! Le maître n'est pas {red}absent{/red} du texte : il est {green}différé{/green}. Il s'annonce à la fin, avec « l'homme qui a de la fortune », dont Marx dit qu'il examinera le rapport « plus tard ».
