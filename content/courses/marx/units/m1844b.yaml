id: m1844b
title: "L'ouvrier, esclave de son objet (1844)"
subtitle: "Manuscrits de 1844, premier manuscrit, « Le travail aliéné », 2 / 5"
group: "Le travail aliéné (Manuscrits de 1844)"
depth: normale
icon: page
color: coral
intro: |-
  La perte de l'objet examinée de plus près : la nature fournit au travail sa matière et à l'ouvrier ses moyens de subsistance, et l'ouvrier, qui s'en approprie toujours plus par son travail, en est doublement privé ; il devient l'esclave de son objet, ce que l'économie politique dissimule.
lessons:
- id: m1844b-i1
  title: "Le texte, sa place et son plan"
  notes: |-
    **Le texte est le deuxième des cinq moments du passage sur le travail aliéné : il reprend {coral}« de plus près »{/coral} la perte de l'objet, et dit ce que l'ouvrier perd au juste.** Il commence à la page XXIII du manuscrit, par « Examinons de plus près l'objectivation », et s'arrête sur la question du rapport essentiel de l'ouvrier à la production. Il compte quatre paragraphes ; le troisième se prolonge par une parenthèse, les six inversions « selon les lois de l'économie ».

    **Où en est l'argument.** Le texte précédent est parti d'un fait, l'ouvrier s'appauvrit à mesure qu'il produit, et en a dégagé le sens : dans le monde de l'économie politique, {amber}l'objectivation devient pour l'ouvrier une perte de l'objet{/amber}, et son produit lui fait face comme une puissance étrangère, le capital. Il s'achevait sur une formule déroutante : plus l'ouvrier est actif, plus il est {teal}« privé d'objets »{/teal}.

    **Pourquoi un deuxième texte était-il nécessaire ?** Parce que cette formule restait {red}sans contenu{/red} : privé de quels objets ? et pourquoi cette privation ferait-elle de lui un homme dépendant, et non seulement un homme démuni ? Celui-ci répond en désignant {coral}l'objet de tout travail, la nature{/coral}, et en montrant ce que sa perte fait de l'ouvrier : {violet}un serviteur de ce qu'il produit{/violet}. Le texte suivant remontera du produit à l'activité qui le produit.

    **Trois éléments de cadre.**
    - **L'homme, être naturel.** Pour Marx, l'homme est une partie de la nature : il ne vit et n'agit qu'en rapport avec elle. Ce qui l'aliène n'est donc pas d'avoir la nature hors de lui, mais {amber}d'être séparé d'elle{/amber}.
    - **Le maître et le serviteur.** Dans la *Phénoménologie de l'esprit*, Hegel montre un serviteur (*Knecht*) qui, en travaillant la chose pour son maître, finit par s'en rendre maître et par se libérer. Marx reprend le mot de *Knecht* pour dire l'ouvrier « esclave de son objet », et {coral}renverse le schéma{/coral} : ici, le travail asservit.
    - **L'économie politique**, de Smith à Ricardo, dont Marx prend les lois au mot dans la parenthèse, et qu'il accuse, à la fin, de dissimuler l'aliénation.

    ? **Moyens de subsistance** : l'allemand *Lebensmittel*, littéralement {violet}« moyens de vivre »{/violet}, désigne couramment les vivres. Marx joue sur le mot tout au long du texte : ce dont {amber}le travail{/amber} vit, la matière sur laquelle il s'exerce, et ce dont {amber}l'ouvrier{/amber} vit, sa nourriture.

    | Mouvement | Lieu | Ce qui s'y joue |
    | la nature perdue deux fois | §1 et §2 | La nature fournit au travail sa matière et à l'ouvrier ses vivres ; plus il se l'approprie par son travail, plus il en est privé, sous ces deux rapports. |
    | le serviteur de son objet | §3 et sa parenthèse | Privé de la nature, l'ouvrier doit recevoir de son objet du travail et de quoi vivre : il en devient le serviteur, enfermé dans un cercle ; les lois de l'économie le disent en six inversions. |
    | ce que l'économie politique dissimule | §4 | Elle ne considère pas le rapport direct de l'ouvrier à la production, dont le rapport du riche n'est que la conséquence. |

    ! Le texte va {green}des choses à l'homme, puis de l'homme au savoir{/green} : d'abord ce que l'ouvrier perd, puis ce qu'il devient, enfin pourquoi la science qui décrit sa misère ne voit pas son aliénation.
