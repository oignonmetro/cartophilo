id: m1844b
title: "L'ouvrier, esclave de son objet (1844)"
subtitle: "Manuscrits de 1844, premier manuscrit, « Le travail aliéné », 2 / 5"
group: "Le travail aliéné (Manuscrits de 1844)"
icon: page
color: coral
intro: |-
  La perte de l'objet examinée de plus près : la nature fournit au travail sa matière et à l'ouvrier ses moyens de subsistance, et l'ouvrier, qui s'en approprie toujours plus par son travail, en est doublement privé ; il devient l'esclave de son objet, ce que l'économie politique dissimule.
lessons:
- id: m1844b-i1
  title: "Où en est l'argument : la perte de l'objet"
  notes: |-
    **Ce texte reprend l'aliénation du produit pour la creuser : il montre ce que l'ouvrier perd quand il perd l'objet, et pourquoi l'économie politique ne le voit pas.**

    Le texte précédent a établi que {coral}l'objectivation devient pour l'ouvrier la perte de l'objet{/coral}, et laissé une formule déroutante : plus il est actif, plus il est {teal}« privé d'objets »{/teal}. Celui-ci dit quels objets : {amber}la nature{/amber}, matière de son travail et source de sa subsistance.

    **Sa question :** que perd exactement l'ouvrier, et pourquoi l'économie politique, qui décrit sa misère, ne le voit-elle pas ? **Sa thèse :** l'acte de s'approprier la nature est à l'ouvrier, mais {coral}la nature appropriée ne l'est pas{/coral} ; plus il travaille, plus il en est doublement privé, si bien qu'il doit recevoir de son objet de quoi travailler et de quoi vivre, et devient {violet}le serviteur de son objet{/violet} ; l'économie politique {amber}dissimule{/amber} cette aliénation en ne considérant pas le rapport immédiat de l'ouvrier à la production. **Sa difficulté :** comment l'appropriation de la nature, par laquelle l'homme se rend maître de son monde, peut-elle faire de lui un serviteur, et le serviteur {red}non d'un maître{/red} mais {green}de son propre objet{/green} ?

    Trois mouvements : la nature perdue deux fois (§1, §2), le serviteur de son objet (§3 et la parenthèse des six inversions), ce que l'économie politique dissimule (§4).
  passage:
    label: "Introduction"
  points:
  - id: m1844b-i1-e1
    sentence: "Thèse du deuxième texte : l'acte de s'approprier la nature est à l'ouvrier, mais __la nature ___ ne l'est pas__."
    answer: "appropriée"
    alt: []
  - id: m1844b-i1-e2
    sentence: "Problématique : comment l'appropriation de la nature peut-elle faire de l'ouvrier __le serviteur, non d'un maître, mais ___ ?__"
    answer: "de son propre objet"
    alt: ["de son objet"]
- id: m1844-p5
  title: "1.1 La nature, matière de tout travail"
  notes: |-
    **Pour examiner de près la perte de l'objet, Marx rappelle que {coral}l'ouvrier ne peut rien créer sans la nature{/coral}, le monde extérieur sensible.**

    **« Et, en elle, l'aliénation ».** L'aliénation est {amber}dans{/amber} l'objectivation, {red}non après elle{/red} : c'est une objectivation qui est en même temps une perte, comme le dit Fischbach.

    **Quatre rôles de la nature.** Elle est la matière « dans laquelle » le travail se réalise, « au sein de laquelle » il s'exerce, « à partir de laquelle » (matière première) et « au moyen de laquelle » (instrument) il produit : {amber}rien de ce qui fait le travail n'échappe à la nature{/amber}. L'allemand dit seulement « ne peut rien créer » (*kann nichts schaffen*), sans le « plus » de la traduction : c'est une condition de tout travail, non une situation nouvelle.

    ? **Monde extérieur sensible** : *sinnliche Außenwelt*, l'ensemble des choses matérielles hors de l'homme, qui s'offrent aux sens ; le mot est celui de Feuerbach contre l'idéalisme. Le texte suivant du passage dira que cette nature est le {violet}« corps non organique »{/violet} de l'homme.

    **Pourquoi partir de la nature ?** Si tout produit est de la nature transformée, perdre ses produits, c'est perdre la nature qu'on a faite sienne ; et si le travail ne s'exerce que sur la nature, perdre l'accès à la nature, c'est {coral}perdre la possibilité de travailler{/coral}. Prémisse : l'homme est {violet}une partie de la nature{/violet} ; pour un tel être, dit Fischbach, ce qui aliène n'est pas d'avoir la nature hors de soi, mais {green}d'être privé de ce rapport{/green}.

    Marx le maintiendra en 1875 : {teal}« le travail n'est pas la source de toute richesse. La nature est tout autant la source des valeurs d'usage »{/teal} (*Critique du programme de Gotha*).

    ! La banalité (pas de table sans bois) a une fonction critique : le travail dépend de conditions qui ne sont pas en lui, et {amber}on peut en être séparé{/amber}.
