- id: m1844-p7c
  title: "Le comble de la servitude : un cercle"
  notes: |-
    **La phrase referme les deux dépendances l'une sur l'autre : l'ouvrier ne peut rester en vie qu'en travaillant, et il n'est ouvrier que comme corps. {coral}Il travaille pour vivre et ne vit que pour travailler.{/coral}** La servitude atteint sa forme achevée : non plus une dépendance, mais une existence réduite à deux fonctions qui se commandent l'une l'autre.

    **Pourquoi « le comble » ?** L'allemand dit *Spitze*, la pointe, le sommet : {amber}le degré extrême{/amber}, au-delà duquel la servitude ne peut aller. « De cette servitude » : *Knechtschaft*, la condition du *Knecht*.

    **Pourquoi « seule » et « ne… plus que » ?** L'allemand dit deux fois *nur mehr*, « ne… plus que », qui marque à la fois {amber}une restriction{/amber} et {amber}une perte{/amber} : il n'y a plus que cela, alors qu'il y avait autre chose. « Se conserver encore » : survivre, et « encore » dit {red}une survie précaire{/red}.

    **Pourquoi « sujet physique » ?** L'homme pris comme corps vivant, organisme à nourrir. Le mot {violet}« sujet »{/violet} est presque ironique : ce sujet n'a plus que la vie du corps.

    **Pourquoi un chiasme ?** Ouvrier, sujet physique ; sujet physique, ouvrier. {coral}La construction en miroir dit l'enfermement qu'elle décrit{/coral} : on sort de chaque terme pour retomber dans l'autre. {yellow}Le manutentionnaire qui porte des sacs dix heures par jour pour gagner de quoi manger, et qui mange juste assez pour porter des sacs le lendemain, n'a pas d'autre existence que ce cercle.{/yellow}

    **La première moitié se comprend d'elle-même :** le salaire est {amber}le seul accès aux vivres{/amber}, donc seule sa qualité d'ouvrier conserve l'ouvrier en vie.

    **Mais pourquoi ne serait-il ouvrier « qu'en tant que sujet physique » ?** C'est la moitié difficile, et le texte ne la justifie pas. On peut l'entendre de deux manières, qui se complètent.
    - **Ce que le travail emploie.** Dans la fabrique et sous la division du travail, l'ouvrier n'est plus requis que comme {amber}dépense de force{/amber} : ses capacités d'invention et de jugement n'y ont plus d'usage. La parenthèse qui suit le dira : plus le travail est riche d'esprit, plus l'ouvrier en est dépourvu.
    - **Ce que le travail vise.** Son travail ne sert plus qu'{amber}à entretenir son corps{/amber}, puisque le salaire tend vers le minimum nécessaire à la survie.

    Dans les deux cas, ce qui disparaît, c'est {coral}tout ce que l'homme est au-delà du corps et du travail{/coral}. Les textes suivants le nommeront : l'ouvrier qui ne se sent libre que dans ses fonctions animales, puis la vie générique devenue simple moyen de l'existence physique.

    **Pourquoi un cercle est-il pire qu'une dépendance ?** Parce que {coral}la servitude se reproduit d'elle-même{/coral}. L'ouvrier ne peut sortir de sa condition par son travail, puisque son travail ne lui rapporte que de quoi continuer à travailler ; et il ne peut sortir de son travail, puisque sans lui il ne vit pas. {red}Le cercle n'a pas d'issue intérieure.{/red}

    ! La phrase ne décrit pas {red}une pauvreté extrême{/red}, mais {green}une réduction{/green} : celle d'un homme ramené à deux fonctions, survivre et travailler, dont chacune n'existe plus que pour l'autre.
  passage:
    label: "§3 (1)"
    part: "2. Le serviteur de son objet"
    text: "Le comble de cette servitude est que seule sa qualité d'ouvrier lui permet de se conserver encore en tant que sujet physique, et que ce n'est plus qu'en tant que sujet physique qu'il est ouvrier."
