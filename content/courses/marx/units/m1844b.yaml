- id: m1844-p6
  title: "1.2 et 1.3 Les deux sens des moyens de vivre, la double privation"
  notes: |-
    **La nature nourrit le travail et l'ouvrier ; or plus l'ouvrier se l'approprie par son travail, {coral}plus il en est privé, et doublement{/coral}.**

    **1.2 Deux sens des moyens de vivre.** *Lebensmittel*, « moyens de vivre », les vivres. Au sens large, la nature nourrit {amber}le travail{/amber}, qui « ne peut pas vivre sans objets sur lesquels il s'exerce » ; au sens restreint, elle nourrit {amber}l'ouvrier{/amber}, sa subsistance physique. Ce qui justifie le parallèle : l'homme vit comme organisme, qui se nourrit, et comme activité, qui s'exerce sur des objets ; pour un être naturel, {coral}travailler, c'est vivre autant que manger{/coral}.

    **1.3 La double privation.** L'allemand ajoute un *also*, « donc », que la traduction omet. « Il se prive » : l'ouvrier est l'agent de sa propre privation ; c'est son travail qui le dépouille. « De plus en plus » : une dépossession qui avance avec le travail.

    **Le « donc » ne tient qu'à une prémisse implicite.** De ce que la nature nourrit l'ouvrier, on conclurait plutôt qu'il s'enrichit en se l'appropriant. Il faut distinguer {violet}l'acte de s'approprier{/violet} (*Aneignung*), qui est à l'ouvrier, et {violet}la propriété{/violet} de ce qui est approprié (*Eigentum*), qui est à un autre : chaque morceau de nature qu'il transforme passe du côté du capital. Le *Dictionnaire Marx* et Allen Wood font expressément cette distinction ; Fischbach : l'appropriation s'effectue {amber}sous le régime de la propriété privée{/amber}.

    Résultat, selon Fischbach : l'ouvrier n'a plus d'accès direct à la matière, {teal}« il faut qu'on la lui présente »{/teal}, ni aux vivres, qu'il n'atteint qu'en accédant d'abord au travail.

    ! Il ne s'agit pas d'{red}un épuisement de la nature{/red} par le travail, mais d'{green}une dépossession{/green} : la nature transformée existe, elle n'est simplement plus à lui.
  passage:
    label: "§2"
    part: "1. La nature perdue deux fois"
    text: "Mais, de même que la nature offre au travail les moyens de subsistance, dans ce sens que le travail ne peut pas vivre sans objets sur lesquels il s'exerce, de même elle fournit des moyens de subsistance au sens restreint, c'est-à-dire les moyens de subsistance physique de l'ouvrier lui-même. Plus l'ouvrier s'approprie par son travail le monde extérieur, la nature sensible, plus il se prive de moyens de subsistance et cela doublement : premièrement, le monde extérieur sensible cesse de plus en plus d'être un objet appartenant à son travail, un moyen de subsistance de son travail ; deuxièmement, il cesse de plus en plus d'être un moyen de subsistance au sens immédiat, c'est-à-dire il cesse d'être un moyen pour la subsistance physique de l'ouvrier."
