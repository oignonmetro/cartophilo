- id: m1844-p7
  title: "L'ouvrier, esclave de son objet"
  notes: |-
    **De ce double point de vue, l'ouvrier devient {red}l'esclave de son objet{/red} : il lui doit l'existence comme ouvrier et comme sujet physique.**

    La nature lui fournissait deux choses (§2) : {amber}la matière de son travail{/amber} et {amber}ses moyens de subsistance{/amber}. Mais cette nature, devenue propriété d'un autre, ne lui est plus accessible qu'à une condition : obtenir du travail, donc un salaire. D'où une dépendance à double titre. Il lui faut d'abord recevoir {violet}un objet de travail{/violet}, c'est-à-dire un emploi, puis {violet}des moyens de subsistance{/violet}, que ce travail seul lui procure. Ce que le travail aurait dû maîtriser, il en reçoit désormais tout.

    Le comble de cette servitude est un cercle : {coral}seule sa qualité d'ouvrier lui permet de se conserver comme sujet physique, et il n'est ouvrier que comme sujet physique{/coral}. Il ne peut exister comme ouvrier que par la nature, et ne peut exister physiquement qu'en tant qu'ouvrier : sa vie se réduit à la force de travail qu'il vend pour la conserver.

    ! L'esclavage n'est pas une image du manque : l'ouvrier dépend de l'objet pour être ouvrier et pour vivre, et chacune de ces dépendances commande l'autre.
  passage:
    label: "§3 (1)"
    text: "De ce double point de vue, l'ouvrier devient donc un esclave de son objet : premièrement, il reçoit un objet de travail, c'est-à-dire du travail, et, deuxièmement, il reçoit des moyens de subsistance. Il lui doit donc la possibilité d'exister premièrement en tant qu'ouvrier et deuxièmement en tant que sujet physique. Le comble de cette servitude est que seule sa qualité d'ouvrier lui permet de se conserver encore en tant que sujet physique, et que ce n'est plus qu'en tant que sujet physique qu'il est ouvrier."
  points:
