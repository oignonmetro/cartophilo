- id: m1844-p8
  title: "3.1 à 3.3 Ce que l'économie politique dissimule"
  notes: |-
    **L'économie politique {coral}dissimule{/coral} l'aliénation parce qu'elle ne considère pas {amber}le rapport immédiat de l'ouvrier à la production{/amber}, dont le rapport du riche n'est que la conséquence.**

    **3.1 Dissimuler.** *Verbirgt* : cacher, plus fort que méconnaître. L'aliénation est {violet}« dans l'essence du travail »{/violet}, non un accident extérieur. Pourquoi une science cacherait-elle ce qu'elle décrit ? Les commentateurs (Renault, Fischbach) répondent : elle adopte {amber}le point de vue du possesseur{/amber} et prend la propriété privée pour un dogme de départ ; le travail y est un coût, l'ouvrier un vendeur de travail. {coral}Les faits sont vus, leur sens est caché{/coral} : dissimulation, non ignorance. La parenthèse « l'ouvrier (le travail) » dit la réduction que l'économiste opère sans la voir.

    **3.2 Pour les riches, pour l'ouvrier.** « Certes » (*Allerdings*) concède ce que voient les économistes. Le même sujet, {amber}le travail{/amber}, produit les deux membres de chaque couple : merveilles et dénuement (*Entblößung*, mise à nu), palais et taudis, beauté et infirmité, machines et ouvriers rejetés dans un travail barbare ou faits machines, esprit et crétinisme. Implicite : le produit passe d'un côté, {coral}le coût reste de l'autre{/coral}. Les riches n'apparaissent qu'au datif, « pour les riches » : bénéficiaires, non encore agents.

    **3.3 Le rapport immédiat, et celui du riche comme sa conséquence.** « L'homme qui a de la fortune » : *der Vermögende*, de *Vermögen*, fortune et pouvoir. Son rapport n'est {coral}« qu'une conséquence »{/coral} de celui de l'ouvrier : il ne possède que ce dont l'ouvrier est dépossédé. « Et il le confirme » : à la fin du manuscrit, ce qui est chez l'ouvrier activité de dessaisissement apparaît chez le non-ouvrier {teal}« comme état de dessaisissement, d'aliénation »{/teal}. Marx renverse l'ordre de l'économie politique, et en tire la méthode de la suite : examiner le rapport de l'ouvrier {green}dans l'acte même de produire{/green}.

    ! Le riche n'est {red}pas absous{/red} : son rapport n'est pas premier {green}dans l'ordre de l'explication{/green}, et Marx le réserve « pour plus tard ».
  passage:
    label: "§4"
    part: "3. Ce que l'économie politique dissimule"
    text: "L'économie politique dissimule l'aliénation dans l'essence du travail par le fait qu'elle ne considère pas le rapport direct entre l'ouvrier (le travail) et la production. Certes, le travail produit des merveilles pour les riches, mais il produit le dénuement pour l'ouvrier. Il produit des palais, mais des taudis pour l'ouvrier. Il produit la beauté, mais l'infirmité pour l'ouvrier. Il remplace le travail par des machines, mais il rejette une partie des ouvriers dans un travail barbare et transforme l'autre partie en machines. Il produit l'esprit, mais, pour l'ouvrier, il produit l'abêtissement, le crétinisme. Le rapport immédiat du travail à ses produits est le rapport de l'ouvrier aux objets de sa production. Le rapport de l'homme qui a de la fortune aux objets de la production et à la production elle-même n'est qu'une conséquence de ce premier rapport. Et il le confirme. Nous examinerons cet autre aspect plus tard. Si donc nous posons la question : quel est le rapport essentiel du travail, nous posons la question du rapport essentiel de l'ouvrier à la production."
