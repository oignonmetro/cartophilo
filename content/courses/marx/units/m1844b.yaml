- id: m1844-p8
  title: "L'économie politique dissimule l'aliénation"
  notes: |-
    **L'économie politique {red}dissimule{/red} l'aliénation parce qu'elle ne considère pas {amber}le rapport direct de l'ouvrier à la production{/amber}.**

    Elle voit que le travail produit des merveilles pour les riches. Elle ne voit pas que, pour l'ouvrier, il produit {coral}le dénuement{/coral} : des palais, mais des taudis ; la beauté, mais l'infirmité ; des machines, mais une partie des ouvriers rejetée dans un travail barbare et l'autre transformée en machines ; l'esprit, mais l'abêtissement. Le rapport de l'ouvrier à ses produits est {violet}le rapport immédiat{/violet}, dont celui du riche n'est qu'une conséquence qui le confirme. Questionner le rapport essentiel du travail, c'est donc questionner celui de l'ouvrier à la production.
  passage:
    label: "§4"
    text: "L'économie politique dissimule l'aliénation dans l'essence du travail par le fait qu'elle ne considère pas le rapport direct entre l'ouvrier (le travail) et la production. Certes, le travail produit des merveilles pour les riches, mais il produit le dénuement pour l'ouvrier. Il produit des palais, mais des taudis pour l'ouvrier. Il produit la beauté, mais l'infirmité pour l'ouvrier. Il remplace le travail par des machines, mais il rejette une partie des ouvriers dans un travail barbare et transforme l'autre partie en machines. Il produit l'esprit, mais, pour l'ouvrier, il produit l'abêtissement, le crétinisme. Le rapport immédiat du travail à ses produits est le rapport de l'ouvrier aux objets de sa production. Le rapport de l'homme qui a de la fortune aux objets de la production et à la production elle-même n'est qu'une conséquence de ce premier rapport. Et il le confirme. Nous examinerons cet autre aspect plus tard. Si donc nous posons la question : quel est le rapport essentiel du travail, nous posons la question du rapport essentiel de l'ouvrier à la production."
  points:
