- id: m1844-p6
  title: "Les deux sens des moyens de vivre"
  notes: |-
    **La nature nourrit deux choses : {coral}le travail{/coral}, qui a besoin de matières sur lesquelles s'exercer, et {coral}l'ouvrier{/coral}, qui a besoin de manger, de se vêtir, de se loger.** La phrase dédouble le rapport de l'ouvrier à la nature, pour que la privation qui suit puisse être double.

    **Pourquoi « mais » ?** L'allemand *Wie aber* marque moins une opposition {amber}qu'une progression{/amber} : après la nature comme matière, voici la nature comme subsistance.

    **Pourquoi « le travail ne peut pas vivre » ?** Marx {violet}prête une vie au travail{/violet}. Le travail est une activité vivante, qui s'éteint si elle n'a rien à quoi s'appliquer, {yellow}comme un corps s'éteint s'il n'a rien à manger{/yellow}. Les « objets sur lesquels il s'exerce » sont ses vivres : la matière et les outils.

    **Pourquoi « au sens restreint » ?** *In dem engern Sinn* : le sens courant, étroit, de *Lebensmittel*, {amber}les vivres{/amber}. Et « l'ouvrier lui-même » distingue l'ouvrier de son travail, {violet}comme deux êtres qui ont chacun leur vie et leurs vivres{/violet}. {yellow}Le tisserand a besoin de laine pour tisser et de pain pour vivre, et la laine comme le blé viennent de la terre.{/yellow}

    **Qu'est-ce qui justifie le parallèle ?** Le texte ne le dit pas, et il porte pourtant toute la suite. Le travail et l'ouvrier ont chacun besoin de la nature parce qu'ils sont {coral}deux faces d'un même être vivant{/coral} : l'homme vit comme {amber}organisme{/amber}, qui se nourrit, et comme {amber}activité{/amber}, qui s'exerce sur des objets. Pour un être naturel, ces deux vies sont également des rapports à la nature : {green}travailler, c'est vivre autant que manger{/green}.

    Le parallèle n'est donc {red}pas une métaphore ornementale{/red} : il dit que l'activité de l'homme dépend de la nature comme son corps en dépend, et que l'en priver, {coral}c'est l'affamer{/coral}. Or le travail aliéné est précisément contraint de vivre à cette condition d'impossibilité : un travail qui n'a pas ses objets à lui.

    **Pourquoi le travail d'abord, l'ouvrier ensuite ?** L'ordre suggère que {amber}la vie active est aussi essentielle que la vie physique{/amber}. Ce n'est pas le pain qui vient en premier, c'est la matière à travailler : un homme qui mangerait à sa faim sans pouvoir rien faire serait, lui aussi, privé de vie.

    ! On serait tenté de prendre le premier sens pour {red}une simple image{/red}, seul le second, la nourriture, comptant vraiment. Le texte les met {green}sur le même plan{/green}, et cette distinction commande les deux « premièrement » et « deuxièmement » qui vont suivre.
  passage:
    label: "§2"
    part: "1. La nature perdue deux fois"
