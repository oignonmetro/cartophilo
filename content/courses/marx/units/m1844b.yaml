- id: m1844-p8b
  title: "Pour les riches, pour l'ouvrier"
  notes: |-
    **Marx montre ce que l'économie politique voit et ce qu'elle cache, en cinq oppositions construites de la même façon : {coral}ce que le travail produit pour les riches, et ce qu'il produit pour l'ouvrier{/coral}.**

    | Pour les riches | Pour l'ouvrier |
    | des merveilles | le dénuement |
    | des palais | des taudis |
    | la beauté | l'infirmité |
    | des machines | un travail barbare, ou l'ouvrier devenu machine |
    | l'esprit | l'abêtissement, le crétinisme |

    **Pourquoi « certes… mais » ?** La concession {amber}accorde aux économistes ce qu'ils disent{/amber}, la puissance productive du travail, pour lui opposer ce qu'ils ne disent pas.

    **Pourquoi le même sujet, « le travail », dans les deux membres ?** C'est le point décisif. Ce n'est pas le travail qui produit les palais et autre chose qui produit les taudis : {coral}c'est le même travail{/coral}, et le dénuement est {violet}un produit au même titre que les merveilles{/violet}.

    **Pourquoi le même travail produirait-il le palais et le taudis ?** Parce que {coral}le produit passe d'un côté et que le coût reste de l'autre{/coral}. Ce que l'ouvrier met de lui-même dans le travail, sa force, sa santé, son temps, passe dans le palais, qui va au riche ; il ne lui reste que {amber}ce que le travail lui a coûté{/amber} : l'usure de son corps, et un salaire minimal qui lui paie un taudis. {yellow}L'ouvrier qui sculpte les ornements d'un hôtel particulier rentre le soir dans une mansarde, les poumons pris par la poussière de pierre.{/yellow} C'est la structure des six inversions, avec {amber}un personnage de plus{/amber} : ce que l'objet gagnait, ce sont maintenant les riches qui en jouissent.

    **Pourquoi « pour les riches » ?** Un second personnage apparaît, absent jusque-là. Le texte cesse de mettre l'ouvrier seul face à son objet. Mais les riches n'apparaissent {violet}qu'au datif{/violet}, « pour les riches », comme {green}bénéficiaires{/green}, {red}non comme agents{/red} : le texte oppose deux destinations d'un même produit, non deux camps.

    **Pourquoi « le dénuement » ?** L'allemand dit *Entblößung*, le fait d'être mis à nu, dépouillé : {amber}non une simple pauvreté, un dépouillement{/amber}.

    **Pourquoi la phrase sur les machines rompt-elle le parallélisme ?** Parce que la machine est un produit qui {coral}frappe le travail lui-même{/coral}. Elle a deux effets : rejeter une partie des ouvriers en arrière (*zurückwerfen*), vers un travail plus grossier, et faire de l'autre partie {violet}des machines{/violet}, des rouages qui répètent un geste. *Le Capital* développera longuement cette figure de l'ouvrier devenu appendice de la machine.

    **Pourquoi « le crétinisme » ?** Le mot (*Kretinismus*) est {amber}médical{/amber} : il désignait une dégénérescence physique et mentale. Marx le prend au sens fort, celui d'un esprit détruit par les conditions de vie ; Smith lui-même concédait que l'homme qui passe sa vie à répéter quelques opérations simples devient aussi stupide et ignorant qu'une créature humaine peut l'être.

    **Qu'est-ce que l'économie politique ne voit pas ?** Elle voit {amber}les deux côtés{/amber}, mais {red}séparément{/red} : la richesse nationale d'une part, la question des salaires de l'autre. Elle ne voit pas qu'{green}ils sont les deux faces d'un seul rapport{/green}, ce que la phrase suivante va dire.

    ! Ces phrases ne sont pas {red}une simple dénonciation des inégalités{/red} : elles montrent qu'{green}un même travail produit les deux membres{/green} de chaque couple.
  passage:
    label: "§4"
    part: "3. Ce que l'économie politique dissimule"
    text: "Certes, le travail produit des merveilles pour les riches, mais il produit le dénuement pour l'ouvrier. Il produit des palais, mais des taudis pour l'ouvrier. Il produit la beauté, mais l'infirmité pour l'ouvrier. Il remplace le travail par des machines, mais il rejette une partie des ouvriers dans un travail barbare et transforme l'autre partie en machines. Il produit l'esprit, mais, pour l'ouvrier, il produit l'abêtissement, le crétinisme."
