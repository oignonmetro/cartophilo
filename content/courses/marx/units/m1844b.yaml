- id: m1844-p7
  title: "Recevoir du travail, recevoir de quoi vivre"
  notes: |-
    **Puisque l'ouvrier est privé de la nature sous ses deux faces, il ne peut plus y accéder par lui-même : {coral}il doit la recevoir{/coral}. Il en devient le serviteur.** La double privation se convertit en double dépendance, et la dépendance en servitude.

    **Pourquoi « donc » ?** *Also* : la servitude est {amber}déduite{/amber} de la double privation. « De ce double point de vue » tient jusqu'au bout les deux sens des moyens de vivre.

    **Pourquoi « esclave » ?** L'allemand dit *Knecht*, {violet}serviteur, valet{/violet}, non *Sklave*. C'est le mot de Hegel, et c'est dans la langue de la dialectique du maître et du serviteur qu'il faut l'entendre. Ce n'est pas {red}une hyperbole morale{/red} : c'est {green}un terme technique{/green}, celui d'une dépendance personnelle transposée à un rapport aux choses.

    **Pourquoi « de son objet » ?** Le maître {coral}n'est pas un homme, c'est une chose{/coral}, et une chose qui est « son » objet, celui qu'il a produit ou devrait avoir.

    **Pourquoi « il reçoit » ?** *Erhält* : celui qui produit est réduit à recevoir. {coral}Le renversement est dans le verbe{/coral}. Ce qu'il devrait se donner par son activité, il doit l'attendre d'un autre.

    **Pourquoi « un objet de travail, c'est-à-dire du travail » ?** L'équivalence est capitale : recevoir une matière à travailler, {amber}c'est recevoir le droit de travailler{/amber}. Le travail lui-même devient quelque chose qu'on reçoit, comme le disait le texte précédent : un objet {teal}« dont il ne peut s'emparer qu'en faisant le plus grand effort »{/teal}.

    **Pourquoi « il lui doit » ?** La dépendance prend {violet}la forme d'une dette{/violet}, comme celle du serviteur envers celui qui le nourrit. Et ce qu'il doit n'est pas tel bien, mais {coral}« la possibilité d'exister »{/coral}, sous deux formes qui répondent aux deux sens des moyens de vivre : en tant qu'ouvrier, et en tant que sujet physique, c'est-à-dire comme corps vivant. {yellow}L'ouvrier d'une cité minière, logé par la compagnie, nourri par le magasin de la compagnie, employé par elle, ne tient son métier et sa vie que de la mine.{/yellow}

    **Pourquoi la dépendance envers un objet serait-elle une servitude ?** On dépend du pain sans en être le serviteur. Le raisonnement implicite passe par deux étapes.
    - L'ouvrier ne dépend pas de la nature comme tout vivant en dépend : il dépend d'{amber}une nature qu'il ne peut plus atteindre lui-même{/amber} et qu'on doit lui donner. {coral}Une dépendance naturelle devient servitude quand l'accès à ce dont on dépend passe par la volonté d'un autre.{/coral}
    - Ce qui lui donne ou lui refuse l'accès, c'est {amber}son objet devenu capital{/amber} : la matière, les outils et les vivres sont concentrés de ce côté, et c'est de ce côté qu'on décide s'il travaille et ce qu'il reçoit.

    **L'écart avec Hegel.** Dans la *Phénoménologie de l'esprit*, le serviteur, parce qu'il travaille la chose et lui donne forme, découvre en elle sa propre puissance, et {green}se libère{/green} ; le maître, qui ne fait que jouir, reste dépendant. Chez Marx, le travail {red}ne libère pas{/red}, puisque la chose formée ne reste pas à l'ouvrier : {coral}la voie hégélienne de l'émancipation par le travail est barrée par la séparation{/coral}.

    ! Le texte ne dit pas encore {red}qui se tient derrière la chose{/red} : il garde le régime impersonnel d'un ouvrier face à un objet. Le serviteur d'une chose est déjà, sans le savoir, {green}le serviteur de celui qui la possède{/green}.
  passage:
    label: "§3 (1)"
    part: "2. Le serviteur de son objet"
    text: "De ce double point de vue, l'ouvrier devient donc un esclave de son objet : premièrement, il reçoit un objet de travail, c'est-à-dire du travail, et, deuxièmement, il reçoit des moyens de subsistance. Il lui doit donc la possibilité d'exister premièrement en tant qu'ouvrier et deuxièmement en tant que sujet physique."
  points:
