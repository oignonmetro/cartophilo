- id: ali9-l2
  title: "Le capital ne chosifie pas le travailleur"
  notes: |-
    **L'échange du salaire contre la faculté de travail suppose que le travailleur soit un vivant, reconnu comme tel : l'analyser en termes de chosification est une erreur.**

    **L'erreur.** Le travailleur moderne ne se vend pas lui-même et est totalement dévalorisé : il vend {amber}l'usage de sa faculté de travail pour un temps déterminé{/amber}. Le travail capitaliste suppose {red}la non-chosification{/red} du travailleur, car il suppose qu'il soit reconnu comme sujet libre.

    **Une objection.** Assimiler le fait d'être vivant à une quantité de travail mort, de travail accumulé, paraît éminemment réifiant. Marx exclut que l'échange ait ces caractères : {teal}« Le capital a consommé ce quantum de travail et, comme ce dernier n'existait pas comme chose mais comme faculté dans un être vivant, le travailleur peut, de par la nature spécifique de sa marchandise – de par la nature spécifique du processus vital – procéder de nouveau à l'échange »{/teal} (III-22).

    **Ce que suppose le salaire.** Il équivaut à ce que le travailleur doit consommer pour reproduire ses forces. Cela n'a de sens que si le travailleur est un vivant dont les forces, vendues et consumées en une journée, sont {violet}reproductibles à l'identique indéfiniment{/violet} : le vivant se restaure, il lutte contre sa propre usure, ce que ne fait pas la machine. Il peut donc se représenter le lendemain pour échanger de nouveau force de travail et salaire. La marchandise doit être de la vie, faculté d'un vivant, et non une simple chose. L'échange repose sur une spécificité du vivant : se reconstituer et se reproduire. Loin de le chosifier, le capitaliste reconnaît pleinement le travailleur comme vivant.

    **Ce dont le capital a besoin.** Il a déjà les choses : outils, instruments, matière. Toutes ces choses accumulées sont du {coral}travail mort{/coral}, des choses inertes. Il lui faut {green}la vie{/green}, seule capable de les vivifier.

    **L'apparence de réification.** Elle vient de ce que le capitaliste paie une quantité de travail objectivé et mort contre du travail vivant : il donne une partie du capital en salaire, et ce capital, comme le reste, est du travail mort. Cela ne veut pas dire qu'il transforme le travail vivant en travail mort ou qu'il le chosifie : il a besoin de ce procès comme procès vivant.

    ! Le travailleur est dévalorisé, mais jamais chosifié : c'est parce qu'il est un vivant, capable de se reproduire, que l'échange peut se répéter.
