- id: ali9-l3
  title: "Les trois composantes du capital et la non-proportionnalité"
  notes: |-
    **Le capitaliste rend vivant un travail qu'il achète à l'état de simple capacité, et occulte ainsi la séparation ; l'échange est inégal en nature, non en degré.**

    **Rendre vivant, et occulter la séparation.** Le capitaliste met la capacité de travail en contact avec la matière et les instruments, et c'est ainsi que le travail devient acte vivant : sans eux, il resterait capacité subjective ineffective, {coral}impuissante à réaliser la vie qui est en elle{/coral}. Il peut le faire parce que le travailleur a d'abord été séparé de l'acte du travail vivant, réduit à possesseur d'une capacité. Cela ne fait qu'{red}occulter la séparation essentielle{/red} entre le travailleur et les moyens du travail : sans elle, le travail serait immédiatement travail vivant, en contact direct avec les moyens de son objectivation.

    **Une non-proportionnalité fondamentale.** En échange des facultés vitales du travailleur, le capitaliste ne donne rien de vivant : seulement, en salaire, l'équivalent d'une quantité de travail objectivé, que le travailleur doit s'approprier pour renouveler sa force. L'échange a du sens pour lui : il obtient des facultés vitales avec lesquelles vivifier le travail objectivé et mort qu'est le capital.

    **Les trois composantes.** Le capital est du travail objectivé : {teal}« Le temps de travail objectivé dans le capital apparaît comme une somme faite de 3 parties : a) le temps de travail objectivé dans la matière première ; b) le temps de travail objectivé dans l'instrument ; c) le temps de travail objectivé dans le prix du travail »{/teal} (III-21). Les parties a) et b) {amber}demeurent objectivées{/amber} : leur valeur reste la même, même si la matière change de forme et que les instruments s'usent, au sens où la quantité de travail initiale reste la même. Il n'en va pas ainsi de c) : « Il n'y a que c) que le capital échange contre quelque chose de qualitativement autre ; un quantum donné de travail objectivé contre un quantum de travail vivant » (III-21).

    **Renversement de la perspective.** Marx disait le travail non-valeur, non-richesse ; il dit maintenant que la seule composante du capital où il y ait {violet}valorisation{/violet} est le temps de travail objectivé dans le prix du travail. On croit y voir le début d'un exposé de la survaleur (une moitié de la journée reproduit les forces, l'autre est travaillée gratuitement). Mais la survaleur ne naît pas de l'échange, seulement du procès de production, et Marx s'en tient ici à l'échange : ce qui compte est {green}la différence qualitative{/green} entre ce que paie le capital et ce qu'il obtient, de nature, non de degré.

    **Valeur d'usage pour la valeur.** Ce qui constitue le capital et le travail salarié n'est pas un simple échange de travail objectivé contre du travail vivant, mais « l'échange du travail objectivé en tant que valeur (valeur qui tient à soi-même) contre du travail vivant en tant que valeur d'usage de celui-ci, non pas valeur d'usage destinée à un usage ou une consommation déterminés et particuliers, mais valeur d'usage pour la valeur » (IV-49). C'est là qu'apparaît la non-proportionnalité.

    ! Les composantes a) et b) du capital ne se valorisent pas dans le procès : seule la troisième s'échange contre du vivant.
