lessons:
- id: ali9-l1
  title: "Mettre au travail un sujet libre : la valeur de la faculté de travail"
  notes: |-
    **Le travailleur n'est pas une marchandise : il est possesseur d'une marchandise, sa faculté de travail, dont la valeur se détermine comme celle de toute marchandise.**

    **Une dévalorisation qui n'est pas une régression.** Marx critique {sky}Linguet{/sky}, économiste français de l'époque, pour y avoir vu {red}une régression{/red} : par cette dévalorisation, qui porte sur l'être même du travailleur, celui-ci est posé autrement, {amber}comme personne{/amber}. Marx veut penser ces formes d'aliénation dans leur nouveauté, non comme identiques aux précédentes.

    **Possesseur de marchandise, non marchandise.** Le rapport du travailleur à la marchandise est passé de l'identification (l'esclave est une marchandise) à la possession : la marchandise possédée est {violet}sa propre faculté de travail{/violet}. Il ne faut pas croire que Marx parle d'esclavage, au sens aristotélicien par exemple : il distingue ce rapport de celui-là.

    **Le problème.** Le travailleur est reconnu comme sujet disposant librement de sa faculté de travail. Mais cette faculté est l'ensemble de ses forces psychiques, physiques, mentales. Comment le mettre au travail, s'approprier sa force de travail, en faire un instrument parmi d'autres, {coral}sans retomber dans l'appropriation de son corps vivant{/coral} ni détruire son statut de sujet libre ? Le mettre au travail, c'est lui faire vendre sa marchandise, et il n'a pas le choix : il est séparé de tous les moyens d'objectiver par lui-même sa faculté de travail. Mais cette faculté n'existe que dans son corps vivant.

    **La solution.** La faculté de travail est, pour le travailleur, une marchandise, déterminée comme toute autre par {green}la quantité de travail nécessaire à la produire{/green} : la valeur d'une marchandise est égale à la quantité de travail objectivée en elle. En travaillant, le travailleur dépense et consume ses forces ; pour continuer il doit les restaurer, donc consommer certaines denrées. Son salaire équivaut à la quantité de travail objectivée dans ces denrées nécessaires au renouvellement de ses forces vitales.

    **Acheter les forces d'un vivant sans acheter le vivant.** Ce qui s'achète n'est pas l'individu vivant, mais {violet}le simple fait d'être vivant{/violet}, dont on peut déterminer la valeur : il vaut ce que valent les conditions qui permettent de vivre et de continuer à vivre. Marx écrit : « Le quantum de travail objectivé contenu dans sa qualité d'être vivant lui a été payé par le capital. […] le temps de travail objectivé dans le fait qu'il soit vivant – c'est-à-dire le temps de travail qui était nécessaire pour payer les produits nécessaires à la conservation de cette vie » (III-22). Être vivant et se maintenir en vie correspond donc à une quantité de {red}travail mort{/red} : du travail antérieur accumulé dans des produits.

    ! Le capitaliste n'achète ni l'individu ni sa vie : il achète, pour un temps, l'usage de forces dont la valeur est celle de leur reproduction.
