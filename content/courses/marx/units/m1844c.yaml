- id: m1844-p10
  title: "Un travail extérieur, où l'ouvrier se nie"
  notes: |-
    **Marx pose sa question et donne le premier caractère de l'activité aliénée : {coral}le travail est extérieur à l'ouvrier{/coral}, il ne fait pas partie de ce qu'il est.** Il en tire aussitôt les conséquences : au lieu de s'y affirmer, l'ouvrier s'y nie ; au lieu de s'y sentir bien, il y est malheureux ; au lieu d'y déployer ses forces, il y use son corps et son esprit. Le paragraphe entier va dérouler les conséquences de ce principe.

    **Pourquoi « extérieur » ?** La question porte sur l'*Entäußerung* du travail, le dessaisissement, et la réponse joue sur le mot : le travail est *äußerlich*, extérieur, de {violet}la même racine{/violet} (*äußer-*, le dehors). {coral}Le dessaisissement consiste en une extériorité.{/coral}

    **Extérieur à quoi ?** « C'est-à-dire qu'il n'appartient pas à son essence » (*nicht zu seinem Wesen gehört*). Extérieur ne veut pas dire {red}hors de son corps{/red}, mais {green}hors de ce qu'il est essentiellement{/green} : l'extériorité est {amber}ontologique, non spatiale{/amber}. L'ouvrier est bien là, à l'établi ; mais ce qu'il fait n'est pas lui.

    **Pourquoi « d'abord » ?** *Erstens* : c'est {amber}le premier de trois caractères{/amber} ; le troisième viendra avec « enfin ». Et « que donc » (*daher*) ouvre {violet}une chaîne de conséquences{/violet} : l'allemand enchaîne quatre *daher* dans le paragraphe.

    **Pourquoi « ne s'affirme pas, mais se nie » ?** *Nicht bejaht, sondern verneint* : le vocabulaire est celui de Hegel, {amber}affirmation et négation{/amber}. Dans son activité, l'homme devrait poser ce qu'il est ; il le défait. Puis le texte passe {violet}de l'être au sentir{/violet} : « ne se sent pas à l'aise, mais malheureux ». L'aliénation est décrite telle que l'ouvrier l'éprouve.

    **Pourquoi « une libre activité physique et intellectuelle » ?** C'est {green}ce que le travail devrait être{/green} : le déploiement libre des forces du corps et de l'esprit ensemble. À la place : il « mortifie son corps et ruine son esprit ». La mortification est {violet}un mot religieux{/violet}, celui de l'ascète qui se fait souffrir ; il reviendra deux phrases plus loin. {yellow}L'employé qui tape toute la journée des chiffres qui ne signifient rien pour lui, pour une affaire qui ne le concerne pas, ne met rien de lui-même dans ce qu'il fait ; il en sort vidé.{/yellow}

    **Pourquoi le travail serait-il extérieur à l'essence de l'ouvrier ?** Toute la chaîne repose sur cette affirmation, et le texte {red}ne la démontre pas{/red}. On peut reconstruire deux raisons.
    - **Par ce qui précède.** L'ouvrier, séparé de la matière et des outils, ne travaille que lorsqu'un autre lui fournit de quoi travailler : {amber}ce qu'il fait, quand, comment et pour quoi, ne part pas de lui{/amber}.
    - **Par ce qui suit.** Le texte suivant dira que l'essence de l'homme est {amber}une activité libre et consciente{/amber}. Un travail dont l'ouvrier ne décide ni le but ni la manière ne peut être l'expression de cette essence.

    Le « donc » suit alors : {coral}si ce que je fais n'est pas ce que je suis, en le faisant je ne me pose pas, je me retire de moi-même, et j'en souffre{/coral}.

    **Un présupposé.** Sous ce raisonnement, il y a un présupposé normatif, hérité de Hess et de Feuerbach : le travail {violet}doit être{/violet} une expression de la vie (*Lebensäußerung*) et une activité propre. Marx ne le démontre pas ; il le confronte à l'expérience vécue de l'ouvrier, et c'est {amber}l'écart entre les deux{/amber} qui fait dire que le travail est « extérieur ». Le travail aliéné est l'inverse de l'activité propre : {violet}une allo-activité{/violet}, une activité qu'un autre déclenche en moi.

    ! « Extérieur » ne veut pas dire {red}pénible{/red}. Un travail peut être épuisant et pleinement le sien, comme celui d'un artiste ou d'un chercheur. L'extériorité n'est pas l'effort : {green}c'est le fait que l'activité ne parte pas de soi{/green}.
  passage:
    label: "§2"
    part: "2. En quoi consiste l'aliénation du travail"
    text: "En quoi consiste l'aliénation du travail ? D'abord dans le fait que le travail est extérieur à l'ouvrier, c'est-à-dire qu'il n'appartient pas à son essence, que donc, dans son travail, l'ouvrier ne s'affirme pas, mais se nie, ne se sent pas à l'aise, mais malheureux ; il n'y déploie pas une libre activité physique et intellectuelle, mais mortifie son corps et ruine son esprit."
