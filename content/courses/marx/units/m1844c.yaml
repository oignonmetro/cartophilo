- id: m1844-p9b
  title: "Le produit, résumé de l'activité"
  notes: |-
    **Marx donne la raison de sa question : {coral}le produit n'est que l'activité condensée{/coral} ; s'il est perte, l'activité qui l'a fait est déjà une perte, en train de se faire.** L'aliénation du produit n'est que le résultat résumé de celle de l'activité.

    **Pourquoi « n'est que le résumé » ?** L'allemand dit *ist ja nur das Resümee* : le *ja* marque {amber}une évidence partagée{/amber}, « n'est bien que », et le *Resümee* est {violet}le condensé d'un déroulement{/violet}. Le produit est l'activité arrêtée, ramassée en une chose. {yellow}Une fausse note dans un enregistrement ne fait que conserver une fausse note jouée : le défaut du résultat est celui de l'exécution.{/yellow}

    **Pourquoi « doit être » ?** L'allemand ajoute *also*, « donc », et *muß*, « doit » : c'est {amber}une nécessité d'inférence{/amber}, {red}non un devoir{/red}. Si le produit est dessaisissement, la production ne peut pas ne pas l'être.

    **Que veut dire « le dépouillement en acte » ?** *Tätige Entäußerung*, un dessaisissement {violet}actif{/violet}, en train de se faire. Le dessaisissement n'est pas un état où l'on tombe après coup : il a lieu {coral}dans l'agir même{/coral}.

    **Pourquoi le chiasme « le dépouillement de l'activité, l'activité du dépouillement » ?** Il dit deux choses à la fois.
    - **Le dépouillement de l'activité** : l'activité est {amber}dépouillée{/amber}, elle est ôtée à l'ouvrier.
    - **L'activité du dépouillement** : l'activité {amber}consiste à dépouiller{/amber}, c'est en agissant que l'ouvrier se défait de lui-même.

    L'ouvrier {coral}perd en agissant, et son agir est cette perte même{/coral}.

    **Pourquoi la dernière phrase ?** Elle reprend la première et l'applique à l'aliénation : l'aliénation de l'objet n'est que {coral}le résumé de l'aliénation dans l'activité{/coral}. L'ordre des raisons est fixé : l'activité d'abord, le produit ensuite.

    **Le raisonnement est-il valide ?** Oui, mais il repose entièrement sur sa première phrase, {amber}qui n'est pas démontrée ici{/amber} : que le produit ne soit que le résumé de l'activité. C'est la définition posée au début du passage, {teal}« le produit du travail est le travail qui s'est fixé, matérialisé dans un objet »{/teal}. Et elle a une conséquence qu'il faut voir : si le produit n'est que l'activité condensée, {coral}tout ce qu'on a dit de lui, puissance étrangère, perte, servitude, doit déjà se trouver dans l'activité{/coral}. C'est ce que le paragraphe suivant va chercher.

    ! « Résumé » ne veut pas dire {red}un résumé fidèle qui en dirait moins{/red} : le produit garde {green}la marque{/green} de l'activité, et c'est pourquoi on peut remonter de l'un à l'autre.
  passage:
    label: "§1"
    part: "1. Du produit à l'acte"
    text: "Le produit n'est que le résumé de l'activité, de la production. Si le produit du travail est le dépouillement, la production elle-même doit être le dépouillement en acte, le dépouillement de l'activité, l'activité du dépouillement. L'aliénation de l'objet du travail n'est que le résumé de l'aliénation, du dépouillement, dans l'activité du travail elle-même."
  points:
