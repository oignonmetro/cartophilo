  - id: m1844-p12-4
    fragment: "2/2"
    sentence: "« 2) Le rapport entre le travail et l'acte de production ___. Ce rapport est le rapport de l'ouvrier à sa propre activité en tant qu'activité étrangère qui ne lui appartient pas, c'est l'activité qui est passivité, la force qui est impuissance, la procréation qui est castration. C'est l'énergie physique et intellectuelle de l'ouvrier, sa vie personnelle – car qu'est-ce que la vie sinon l'activité ? – qui est transformée en activité dirigée contre lui-même, indépendante de lui, ne lui appartenant pas. C'est l'aliénation de soi comme, plus haut, l'aliénation de la chose. »"
    answer: "à l'intérieur du travail"
