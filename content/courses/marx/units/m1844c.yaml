- id: m1844-p9
  title: "1.1 et 1.2 Dans l'acte même de produire"
  notes: |-
    **L'aliénation n'est pas seulement dans le résultat, elle est {coral}dans l'acte même de la production{/coral}, et c'est elle qui fonde celle du produit.**

    **1.1 Un argument par la condition.** L'allemand juxtapose *Entfremdung* et *Entäußerung*, devenir étranger et se dessaisir. La question « comment le produit ne serait-il pas étranger à l'ouvrier si celui-ci… ne devenait pas étranger à lui-même ? » est rhétorique, mais elle contient un argument : le produit n'est que le travail fixé dans un objet ; si l'activité était vraiment la sienne, son produit le serait aussi ; s'il lui est étranger, {amber}c'est que l'activité l'était déjà{/amber}. Le verbe est réfléchi (*sich selbst entfremdete*) : l'ouvrier est à la fois l'agent et l'objet de son aliénation.

    **1.2 Le produit, résumé de l'activité.** *Ist ja nur das Resümee* : le produit n'est {coral}que le condensé{/coral} de l'activité. Le *also* et le *muß* (« donc », « doit ») marquent une nécessité d'inférence : si le produit est dessaisissement, la production est {violet}« dessaisissement en acte »{/violet} (*tätige Entäußerung*), « le dépouillement de l'activité, l'activité du dépouillement » : l'ouvrier perd en agissant, et son agir est cette perte même.

    **L'ordre des raisons s'inverse.** Ce qui avait été exposé en premier, l'aliénation du produit, {coral}dépend{/coral} de ce qui vient maintenant. Fischbach résume cet aspect : l'ouvrier vit son activité {teal}« comme activité d'un autre et pour un autre »{/teal}.

    ! On serait tenté de croire que l'ouvrier travaille mal parce qu'il sait que son produit lui sera pris ; Marx dit l'inverse : {red}le produit ne fait que garder la marque{/red} d'une activité {green}déjà aliénée{/green}.
  passage:
    label: "§1"
    part: "1. Du produit à l'acte"
    text: "Nous n'avons considéré jusqu'ici l'aliénation, le dépouillement de l'ouvrier, que sous un seul aspect, celui de son rapport aux produits de son travail. Or, l'aliénation n'apparaît pas seulement dans le résultat, mais aussi dans l'acte même de la production, à l'intérieur de l'activité productive elle-même. Comment le produit ne serait-il pas étranger à l'ouvrier si celui-ci, dans l'acte même de la production, ne devenait pas étranger à lui-même ? Le produit n'est que le résumé de l'activité, de la production. Si le produit du travail est le dépouillement, la production elle-même doit être le dépouillement en acte, le dépouillement de l'activité, l'activité du dépouillement. L'aliénation de l'objet du travail n'est que le résumé de l'aliénation, du dépouillement, dans l'activité du travail elle-même."
