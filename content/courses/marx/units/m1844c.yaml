- id: m1844-p12
  title: "Premier aspect : le rapport au produit et à la nature"
  notes: |-
    **Marx récapitule les deux déterminations acquises, avant d'en tirer, dans le texte suivant, une troisième. La première est {coral}le rapport de l'ouvrier à son produit, qui est aussi son rapport à la nature{/coral}.**

    **Pourquoi « l'activité humaine pratique » ?** *Der praktischen menschlichen Tätigkeit* : le travail est {violet}l'activité pratique par excellence{/violet}, celle qui transforme le monde, par opposition à l'activité théorique. Et Marx parle de « l'acte d'aliénation » : même le bilan du produit est pris du côté de l'acte, conformément à l'ordre des raisons que le §1 a fixé.

    **Que résume « qui le tient sous sa domination » ?** Le premier texte : le produit se dresse devant l'ouvrier comme {amber}une puissance indépendante{/amber}, et plus l'ouvrier produit, plus il tombe sous la domination de son propre produit, {teal}« le capital »{/teal}.

    **Que résume « en même temps le rapport au monde extérieur sensible » ?** Le deuxième texte : la nature, matière du travail et source des vivres, a cessé d'être à l'ouvrier, et il en est devenu {amber}le serviteur{/amber}. {coral}Le produit et la nature ne font qu'un objet{/coral} : tout produit est nature transformée, et toute la nature à laquelle l'ouvrier a affaire passe par des produits qui ne sont pas à lui.

    **Pourquoi « étranger et hostile » ?** L'hostilité {amber}s'ajoute{/amber} à l'étrangeté : la nature n'est pas seulement hors de la portée de l'ouvrier, elle se dresse contre lui, sous la forme du capital qui la possède. {yellow}La forêt que le bûcheron abat pour un marchand de bois est à la fois ce qu'il ne possède pas et ce qui décide de son embauche.{/yellow}

    **Pourquoi un bilan ici ?** Pour {amber}rassembler{/amber} ce qui a été établi, et préparer la phrase qui ouvre le texte suivant : {teal}« de ces deux déterminations du travail aliéné, nous devons en tirer une troisième »{/teal}. La troisième, l'être générique, se tirera précisément de ces deux rapports, à la nature et à l'activité.

    ! Le bilan suit l'ordre d'{red}exposition{/red} (le produit, puis l'activité) ; il ne doit pas faire oublier l'ordre des {green}raisons{/green}, que le §1 a fixé : l'aliénation de l'activité fonde celle du produit.
  passage:
    label: "§4"
    part: "3. Le résultat et le bilan"
    text: "Nous avons considéré l'acte d'aliénation de l'activité humaine pratique, le travail, sous deux aspects. 1) Le rapport de l'ouvrier au produit du travail en tant qu'objet étranger qui le tient sous sa domination. Ce rapport est en même temps le rapport au monde extérieur sensible, aux objets de la nature, monde qui lui est à la fois étranger et hostile."
  points:
