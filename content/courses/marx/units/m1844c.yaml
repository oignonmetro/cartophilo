id: m1844c
title: "L'activité étrangère à l'ouvrier (1844)"
subtitle: "Manuscrits de 1844, premier manuscrit, « Le travail aliéné », 3 / 5"
group: "Le travail aliéné (Manuscrits de 1844)"
icon: page
color: coral
intro: |-
  La deuxième détermination du travail aliéné : l'aliénation n'est pas seulement dans le produit, mais dans l'acte même de produire ; le travail est extérieur à l'ouvrier, forcé, il appartient à un autre, et l'ouvrier ne se sent libre que dans ses fonctions animales.
lessons:
- id: m1844c-i1
  title: "Où en est l'argument : du produit à l'activité"
  notes: |-
    **Ce texte remonte du produit à l'acte qui le produit : c'est la deuxième détermination du travail aliéné.**

    Les deux textes précédents n'ont considéré l'aliénation que sous un aspect, {amber}le rapport de l'ouvrier aux produits de son travail{/amber}. Marx examine maintenant l'activité elle-même.

    **Sa question :** en quoi consiste l'aliénation dans l'acte même de travailler ? Elle s'inscrit dans le débat sur la peine du travail : la malédiction de la Genèse, et Smith, à qui Marx reprochera d'envisager le travail {teal}« comme malédiction »{/teal} (*Grundrisse*). **Sa thèse :** l'aliénation est {coral}d'abord dans l'activité{/coral}, dont le produit n'est que le résumé ; le travail est {violet}extérieur{/violet} à l'ouvrier, {violet}forcé{/violet}, et {violet}appartient à un autre{/violet}, si bien qu'il éprouve son activité comme {coral}une passion subie{/coral} et ne se sent libre que dans ses fonctions animales. **Sa difficulté :** comment l'activité par laquelle l'homme devrait s'affirmer peut-elle être vécue comme la perte de soi, au point qu'il ne se sente libre que hors d'elle ?

    Trois mouvements : du produit à l'acte (§1), en quoi consiste l'aliénation du travail (§2), le résultat et le bilan (§3, §4).
  passage:
    label: "Introduction"
  points:
