- id: m1844-p11
  title: "L'animal devient humain, l'humain devient animal"
  notes: |-
    **Marx tire le résultat de ce qui précède : puisque l'ouvrier ne se sent lui-même qu'en dehors du travail, {coral}il ne se sent libre que dans ses fonctions animales{/coral} ; et dans le travail, qui devrait être son activité la plus humaine, il se sent une bête de somme.** L'aliénation de l'activité reçoit sa formule la plus frappante, un chiasme.

    **Pourquoi « donc » et « résultat » ?** *Es kömmt daher zu dem Resultat* : c'est {amber}le dernier *daher*{/amber} du texte, la conséquence de toute la chaîne.

    **Pourquoi « l'homme (l'ouvrier) » ?** La parenthèse {coral}renverse celle du texte précédent{/coral}, « l'ouvrier (le travail) ». Là, l'économie réduisait l'ouvrier à du travail ; ici, l'ouvrier est un homme, et {amber}ce qui lui arrive arrive à l'homme{/amber}.

    **Pourquoi « se sent agir librement » ?** *Sich als freitätig fühlt*, se sent librement actif : c'est encore {violet}l'épreuve vécue{/violet}. Et « seulement » traduit *nur mehr*, « ne… plus que », comme dans le comble de la servitude du texte précédent : il y avait autre chose, il n'y a plus que cela.

    **Quelles fonctions ?**
    - {amber}Manger, boire et procréer{/amber} : les fonctions du vivant, que l'homme partage avec l'animal.
    - {amber}« Tout au plus », le logement et la parure{/amber} (l'allemand dit *Wohnung*, *Schmuck*) : une petite liberté de consommation, la seule qui reste.
    - {amber}Les fonctions « proprement humaines »{/amber} : celles qui distinguent l'homme, au premier rang desquelles le travail, l'activité consciente et productive.

    {yellow}L'ouvrier qui attend toute la semaine le repas du dimanche comme le seul moment qui soit à lui vit ce renversement.{/yellow}

    **Pourquoi le chiasme ?** « Ce qui est animal devient humain, et ce qui est humain devient animal » : la construction en miroir dit {coral}l'inversion complète des valeurs de la vie{/coral}. Ce n'est pas seulement que l'ouvrier perd sa part humaine : c'est que {amber}la liberté change de place{/amber}, et se réfugie là où l'homme est le moins homme.

    **Le raisonnement implicite.** Il tient en deux prémisses.
    - La première est {green}acquise{/green} : l'ouvrier ne se sent libre qu'en dehors du travail.
    - La seconde {red}ne l'est pas encore{/red} : le travail est la fonction proprement humaine, celle qui distingue l'homme de l'animal. Le texte suivant l'établira, avec {violet}l'activité vitale consciente{/violet}.

    Si on admet les deux, le résultat suit : {coral}la liberté se réfugie dans ce que l'homme a de commun avec l'animal, et ce qu'il a de propre devient une servitude animale{/coral}.

    ! On serait tenté d'y lire {red}un mépris pour le corps et ses plaisirs{/red} ; la phrase suivante prévient le contresens.
  passage:
    label: "§3"
    part: "3. Le résultat et le bilan"
    text: "On en vient donc à ce résultat que l'homme (l'ouvrier) se sent agir librement seulement dans ses fonctions animales : manger, boire et procréer, ou encore, tout au plus, dans le choix de sa maison, de son habillement, etc. ; en revanche, il se sent animal dans ses fonctions proprement humaines. Ce qui est animal devient humain, et ce qui est humain devient animal."
