- id: m1844-p12c
  title: "La vie retournée contre l'ouvrier, l'aliénation de soi"
  notes: |-
    **Ce qui est retourné contre l'ouvrier, c'est {coral}sa vie personnelle{/coral}, puisque la vie n'est rien d'autre que l'activité. Marx nomme pour finir les deux déterminations en une formule symétrique : {coral}l'aliénation de soi, comme l'aliénation de la chose{/coral}.**

    **Pourquoi « l'énergie physique et intellectuelle » ?** C'est ce que le §2 appelait {amber}« une libre activité physique et intellectuelle »{/amber} : le corps et l'esprit ensemble. Ce qui devait se déployer librement est {red}retourné contre lui{/red}.

    **Pourquoi l'incise « qu'est-ce que la vie sinon l'activité ? » ?** Elle porte une thèse qui fonde tout le paragraphe : {coral}la vie est l'activité{/coral}. Si c'est vrai, l'activité aliénée est {amber}une vie aliénée{/amber}, et l'ouvrier ne perd pas seulement son travail, il perd sa « vie personnelle ». {yellow}Les dix heures passées à l'usine ne sont pas un temps pris à côté de la vie de l'ouvrier : elles sont sa vie, la plus grande part de ses journées éveillées.{/yellow} Le texte suivant tirera de cette identité la notion d'{violet}activité vitale{/violet}.

    **Pourquoi « dirigée contre lui-même, indépendante de lui, ne lui appartenant pas » ?** *Wider ihn selbst gewendete* : {amber}retournée contre lui{/amber}. La gradation reprend dans l'ordre inverse ce que le premier texte disait du produit, « indépendant », « étranger », « hostile » : l'activité subit le même sort que l'objet.

    **Pourquoi « l'aliénation de soi comme, plus haut, l'aliénation de la chose » ?** *Selbstentfremdung* et *Entfremdung der Sache* : la phrase nomme {coral}les deux déterminations{/coral} en une formule symétrique.

    | Aliénation de la chose | Aliénation de soi |
    | le rapport au produit et à la nature | le rapport à sa propre activité |
    | ce que l'ouvrier perd | ce que l'ouvrier devient |
    | exposée dans les deux premiers textes | exposée dans celui-ci |
    | conséquence | fondement |

    **Deux aliénations parallèles ?** On serait tenté de le croire, puisque la formule les met en regard. Mais le §1 a montré que {coral}la seconde fonde la première{/coral} : le produit n'est que le résumé de l'activité. La symétrie de la formule est celle de l'exposition ; {amber}l'ordre des raisons{/amber} va de soi à la chose.

    **Qu'est-ce que le bilan prépare ?** La phrase qui ouvre le texte suivant : {teal}« de ces deux déterminations du travail aliéné, nous devons en tirer une troisième »{/teal}. Si l'homme est aliéné dans son rapport à la nature et dans son rapport à son activité, et si c'est par ces deux rapports qu'il est un être générique, alors il est aliéné de son être générique.

    ! « Aliénation de soi » ne veut pas dire {red}un trouble intérieur{/red}, une conscience malheureuse : c'est {green}la perte réelle de sa propre activité{/green}, donc de sa propre vie.
  passage:
    label: "§4"
    part: "3. Le résultat et le bilan"
    text: "C'est l'énergie physique et intellectuelle de l'ouvrier, sa vie personnelle – car qu'est-ce que la vie sinon l'activité ? – qui est transformée en activité dirigée contre lui-même, indépendante de lui, ne lui appartenant pas. C'est l'aliénation de soi comme, plus haut, l'aliénation de la chose."
