- id: m1844-p10
  title: "2.1 à 2.4 Un travail extérieur, forcé, qui appartient à un autre"
  notes: |-
    **L'aliénation du travail consiste en ce que le travail est {coral}extérieur{/coral} à l'ouvrier, {coral}forcé{/coral}, et {coral}appartient à un autre{/coral} : son activité est la perte de lui-même.**

    **2.1 Un travail extérieur.** La question dit *Entäußerung*, et la réponse joue sur la racine : le dessaisissement consiste en une extériorité (*äußerlich*). Extérieur veut dire qu'il {amber}« n'appartient pas à son essence »{/amber} : {red}non pénible{/red}, mais {green}qui ne part pas de soi{/green}. Cette prémisse n'est pas démontrée ; le notebook la rapporte à un présupposé normatif hérité de Hess et de Feuerbach : le travail doit être une {violet}expression vitale{/violet} (*Lebensäußerung*) et une auto-activité. Fischbach parle d'une {violet}« allo-activité »{/violet}, une activité qu'un autre déclenche en soi.

    **2.2 Un travail forcé, simple moyen.** Une chaîne de {amber}quatre *daher*{/amber} : l'ouvrier ne se sent chez lui (*bei sich*, *zu Hause*) qu'en dehors du travail ; son travail est {violet}forcé{/violet} (*Zwangsarbeit*) ; il n'est pas la satisfaction d'un besoin, mais {coral}un moyen{/coral} de satisfaire des besoins hors de lui. Fischbach : l'ouvrier est séparé du besoin, la part passive qui devrait le mettre au travail.

    **2.3 La preuve.** Dès que cesse la contrainte, physique ou autre (la faim), le travail est {teal}« fui comme la peste »{/teal}. La preuve est limitée : elle suppose qu'{amber}un autre travail soit possible{/amber}, sinon elle donnerait raison à Smith. Les *Grundrisse* répondent que surmonter les obstacles du travail est {green}« l'exercice même de la liberté »{/green}, la composition musicale demandant {teal}« l'effort le plus intense »{/teal}. *Selbstaufopferung*, *Kasteiung* : le vocabulaire de l'ascèse.

    **2.4 L'activité d'un autre, comme dans la religion.** Pendant le temps vendu, {coral}l'ouvrier ne s'appartient pas{/coral}. Comme l'imagination du croyant agit sur lui comme une activité divine ou diabolique, son activité n'est pas sa *Selbsttätigkeit* : {coral}« elle est la perte de soi-même »{/coral}. Mais ce qui est illusion dans la religion est {green}rapport effectif{/green} dans le travail : un autre dispose réellement de son activité.

    ! La contradiction apparente (agir sans que son activité soit la sienne) se lève : {green}il en a vendu la disposition{/green}.
  passage:
    label: "§2"
    part: "2. En quoi consiste l'aliénation du travail"
    text: "En quoi consiste l'aliénation du travail ? D'abord dans le fait que le travail est extérieur à l'ouvrier, c'est-à-dire qu'il n'appartient pas à son essence, que donc, dans son travail, l'ouvrier ne s'affirme pas, mais se nie, ne se sent pas à l'aise, mais malheureux ; il n'y déploie pas une libre activité physique et intellectuelle, mais mortifie son corps et ruine son esprit. En conséquence, l'ouvrier ne se sent lui-même qu'en dehors du travail et dans le travail il se sent extérieur à lui-même. Il est à l'aise quand il ne travaille pas et, quand il travaille, il ne se sent pas à l'aise. Son travail n'est donc pas volontaire, mais contraint, c'est du travail forcé. Il n'est donc pas la satisfaction d'un besoin, mais seulement un moyen de satisfaire des besoins en dehors du travail. Le caractère du travail apparaît nettement dans le fait que, dès qu'il n'existe pas de contrainte physique ou autre, le travail est fui comme la peste. Le travail extérieur à l'homme, dans lequel il se dépouille, est un travail de sacrifice de soi, de mortification. Enfin le caractère extérieur à l'ouvrier du travail apparaît dans le fait qu'il n'est pas son bien propre, mais celui d'un autre, qu'il ne lui appartient pas, que dans le travail l'ouvrier ne s'appartient pas lui-même, mais appartient à un autre. De même que, dans la religion, l'activité propre de l'imagination humaine, du cerveau humain et du cœur humain, agit sur l'individu indépendamment de lui, c'est-à-dire comme une activité étrangère, divine ou diabolique, de même l'activité de l'ouvrier n'est pas son activité propre. Elle appartient à un autre, elle est la perte de soi-même."
  points:
  - id: m1844-p10-1
    fragment: "1/4"
    sentence: "« En quoi consiste l'aliénation du travail ? D'abord dans le fait que ___, c'est-à-dire qu'il n'appartient pas à son essence, que donc, dans son travail, l'ouvrier ne s'affirme pas, mais se nie, ne se sent pas à l'aise, mais malheureux ; il n'y déploie pas une libre activité physique et intellectuelle, mais mortifie son corps et ruine son esprit. »"
