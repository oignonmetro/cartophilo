    sentence: "« Nous avons considéré l'acte d'aliénation de l'activité humaine pratique, le travail, sous deux aspects. 1) Le rapport de l'ouvrier au produit du travail ___. Ce rapport est en même temps le rapport au monde extérieur sensible, aux objets de la nature, monde qui lui est à la fois étranger et hostile. »"
    answer: "en tant qu'objet étranger qui le tient sous sa domination"
