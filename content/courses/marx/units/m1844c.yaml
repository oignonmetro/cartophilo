- id: m1844-p11b
  title: "Des fonctions humaines séparées abstraitement"
  notes: |-
    **Marx précise sa formule pour qu'on ne la prenne pas pour un mépris du corps : manger, boire, aimer sont {green}pleinement humains{/green}. Ce qui les rend animales, c'est d'être {coral}coupées du reste de la vie humaine et de devenir le seul but de l'existence{/coral}.** L'homme devient animal non par ce qu'il fait, mais par la place que ce qu'il fait occupe dans sa vie.

    **Pourquoi « certes aussi » ?** *Zwar auch* : la concession est {amber}réelle{/amber}. Marx ne retire rien à la dignité du corps. « Authentiquement humaines » (*echt menschliche*) : chez l'homme, ces fonctions sont prises dans la culture, le goût, le lien aux autres.

    **Pourquoi « séparées abstraitement » ?** L'allemand dit « dans l'abstraction qui les sépare » (*In der Abstraktion aber, die sie… trennt*). {coral}Abstraire, c'est ici séparer{/coral}, isoler une partie du tout.

    ? **Abstrait** : chez Marx, formé à l'école de Hegel, {violet}ce qui est séparé{/violet}, isolé, privé de ses rapports avec autre chose que soi ; le {violet}concret{/violet} est ce qui est complet, pris dans la multiplicité de ses rapports. Le mot ne désigne pas {red}une idée générale{/red}, mais {green}une partie coupée de son tout{/green}.

    **Pourquoi « du reste du champ des activités humaines » ?** *Umkreis*, le cercle, le pourtour : ces fonctions {amber}avaient leur place dans un ensemble{/amber}. On mange pour vivre, mais aussi pour travailler, penser, aimer ; un repas est pris dans une journée, une famille, une fête.

    **Pourquoi « la fin dernière et unique » ?** *Zu letzten und alleinigen Endzwecken* : ce qui devait être {amber}une part de la vie{/amber} en devient {coral}le but{/coral}. Et « ne sont plus que » dit une perte.

    **Comment une fonction humaine devient-elle animale ?** Le raisonnement tient à la conception de l'abstrait.
    - Une fonction humaine {amber}est humaine par ses rapports{/amber} aux autres activités.
    - Isolée de ce tout et devenue fin unique, elle {amber}perd ce qui la rendait humaine{/amber}.
    - Elle retombe au rang de la fonction animale, qui chez l'animal est en effet {coral}le tout de la vie{/coral}.

    {yellow}Un repas partagé, préparé avec soin, où l'on parle et où l'on fête quelque chose, est une activité humaine ; le même repas avalé seul, comme l'unique récompense d'une journée vide, n'est plus que nourriture.{/yellow}

    **Qui produit cette abstraction ?** {coral}Le travail aliéné{/coral}, qui chasse hors du travail tout ce que l'ouvrier peut éprouver comme sien. Puisque le travail n'est plus qu'un moyen, la vie hors du travail devient la seule fin ; et puisque l'ouvrier, épuisé, n'a guère d'autre vie que celle du corps, ce sont les fonctions du corps qui deviennent fins dernières. La seconde difficulté est résolue : {green}ce n'est pas le corps qui animalise l'homme, c'est l'abstraction qui coupe le corps du reste de la vie{/green}.

    ! Le texte n'exprime pas {red}un idéal ascétique{/red} : il reproche au contraire au travail aliéné d'avoir {green}appauvri jusqu'aux plaisirs du corps{/green}.
  passage:
    label: "§3"
    part: "3. Le résultat et le bilan"
    text: "Manger, boire, procréer, etc., sont certes aussi des fonctions authentiquement humaines. Mais séparées abstraitement du reste du champ des activités humaines et devenues ainsi la fin dernière et unique, elles ne sont plus que des fonctions animales."
