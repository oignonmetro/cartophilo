- id: m1844-p10c
  title: "Un travail forcé, simple moyen"
  notes: |-
    **Puisqu'il ne s'y sent pas chez lui, l'ouvrier ne va au travail que contraint ; et puisqu'il y est contraint, {coral}ce travail ne répond à aucun de ses besoins : il n'est qu'un moyen{/coral}.** L'extériorité passe de l'épreuve intérieure à sa forme objective : la contrainte, et le rapport de moyen à fin.

    **Pourquoi deux « donc » ?** Ce sont les deux derniers *daher* de la chaîne. Le texte se présente comme {amber}une déduction en cascade{/amber} : extérieur, donc malheureux ; donc hors de lui dans le travail ; donc contraint ; donc simple moyen.

    **Pourquoi « travail forcé » ?** *Zwangsarbeit*, {violet}le mot qui désigne le travail des bagnards{/violet}. La gradation va de l'absence de volonté (« pas volontaire ») à la contrainte (« contraint »), puis à la peine (« forcé »).

    **Mais le salarié n'a-t-il pas signé librement son contrat ?** Si. La contrainte n'est pas {red}celle d'un maître qui fouette{/red} : c'est {green}celle du besoin{/green}. L'ouvrier, séparé de tout moyen de vivre, n'a pas d'autre choix que de travailler. {yellow}Personne ne force le journalier à se présenter à l'usine ; mais s'il ne s'y présente pas, il n'a rien à manger.{/yellow}

    **Pourquoi « pas la satisfaction d'un besoin » ?** C'est le maillon le plus riche, et il faut déplier ce qu'il suppose.
    - **Normalement**, le travail {amber}répond à un besoin{/amber} : on a faim, on cultive ; on a froid, on bâtit. Le besoin est au principe de l'activité, et l'activité est la satisfaction du besoin, puisqu'elle en est la réponse directe.
    - **Dans le travail aliéné**, ce lien est {red}rompu{/red} : l'ouvrier ne tisse pas parce qu'il a besoin d'étoffe, il tisse pour un salaire, avec lequel il achètera du pain. Son activité n'a plus de rapport avec ce dont il a besoin.

    Le travail n'est donc plus qu'{coral}un moyen{/coral}, et les besoins qu'il sert sont {coral}« en dehors du travail »{/coral}. Le texte suivant en tirera la formule la plus générale : le travail aliéné fait {violet}de la vie générique un moyen de la vie individuelle{/violet}.

    **Ce que l'ouvrier perd avec le besoin.** Le besoin est {amber}la part passive{/amber} de notre être : ce que nous subissons, et qui nous met en mouvement. Privé de ce principe passif, puisque ce n'est plus son besoin qui le fait travailler, l'ouvrier est réduit à {violet}une pure capacité d'agir{/violet}, qui attend qu'on lui fournisse de quoi s'exercer. La passivité qu'il aurait dû éprouver au départ lui manque ; il la retrouvera au moment où il agit, sous la forme de la contrainte. Le bilan du §4 le dira : {coral}« l'activité qui est passivité »{/coral}.

    ! La chaîne de « donc » est {green}rigoureuse à partir de sa première prémisse{/green} ; c'est cette prémisse, l'extériorité du travail, qui porte {amber}tout le poids{/amber}.
  passage:
    label: "§2"
    part: "2. En quoi consiste l'aliénation du travail"
    text: "Son travail n'est donc pas volontaire, mais contraint, c'est du travail forcé. Il n'est donc pas la satisfaction d'un besoin, mais seulement un moyen de satisfaire des besoins en dehors du travail."
