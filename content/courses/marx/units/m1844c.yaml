id: m1844c
title: "L'activité étrangère à l'ouvrier (1844)"
subtitle: "Manuscrits de 1844, premier manuscrit, « Le travail aliéné », 3 / 5"
group: "Le travail aliéné (Manuscrits de 1844)"
depth: normale
icon: page
color: coral
intro: |-
  La deuxième détermination du travail aliéné : l'aliénation n'est pas seulement dans le produit, mais dans l'acte même de produire ; le travail est extérieur à l'ouvrier, forcé, il appartient à un autre, et l'ouvrier ne se sent libre que dans ses fonctions animales.
lessons:
- id: m1844c-i1
  title: "Le texte, sa place et son plan"
  notes: |-
    **Le texte est le troisième des cinq moments du passage sur le travail aliéné : il {coral}remonte du produit à l'acte de produire{/coral}, et dégage la deuxième détermination, l'aliénation de l'activité.** Il se trouve à la page XXIII du manuscrit, de « Nous n'avons considéré jusqu'ici l'aliénation… que sous un seul aspect » à « l'aliénation de soi comme, plus haut, l'aliénation de la chose ».

    **Où en est l'argument.** Les deux textes précédents ont dégagé {amber}la première détermination{/amber} : le rapport de l'ouvrier à son produit. Le produit lui fait face comme une puissance étrangère, le capital ; l'ouvrier est privé de la nature et devient le serviteur de son objet ; l'économie politique dissimule ce rapport. Le texte précédent concluait : la question de l'essence du travail est celle du {teal}« rapport essentiel de l'ouvrier à la production »{/teal}.

    **Pourquoi fallait-il passer à l'activité ?** Parce que la « production » désigne à la fois {violet}ce qui est produit{/violet} et {violet}l'acte de produire{/violet}. Jusqu'ici, Marx n'a regardé que le premier sens. Or c'est dans l'acte que le rapport de l'ouvrier à la production se noue : il faut dire non plus seulement ce que l'ouvrier perd quand son produit lui est pris, mais {coral}ce qu'il éprouve et ce qu'il devient pendant qu'il travaille{/coral}. Le texte suivant tirera une troisième détermination, l'aliénation de l'être générique.

    **Deux éléments de cadre.**
    - **La religion selon Feuerbach**, convoquée une seconde fois, sous un autre angle : non plus la richesse que l'homme place en Dieu, mais {amber}l'activité de son imagination qui agit sur lui comme une activité étrangère{/amber}.
    - **L'homme, être naturel, actif et passif à la fois** : un être qui a des besoins, qui pâtit de ce qui l'affecte, et qui agit pour y répondre.

    ? **Dessaisissement** (*Entäußerung*) : le fait de se mettre hors de soi, de se défaire de soi. C'est le mot central du texte, que la traduction rend tantôt par « aliénation », tantôt par « dépouillement » : la question du deuxième paragraphe est « en quoi consiste l'*Entäußerung* du travail ? ».

    ? **Activité propre** (*Selbsttätigkeit*) : l'activité qui part de soi. Son contraire, l'activité qu'un autre déclenche en moi, on peut l'appeler une {violet}allo-activité{/violet}.

    | Mouvement | Lieu | Ce qui s'y joue |
    | du produit à l'acte | §1 | L'aliénation du produit suppose celle de l'activité, dont le produit n'est que le résumé : l'ordre suivi jusqu'ici s'inverse. |
    | en quoi consiste l'aliénation du travail | §2 | Trois caractères qui n'en font qu'un : le travail est extérieur à l'ouvrier, forcé, et appartient à un autre ; il est fui comme la peste ; il est la perte de soi. |
    | le résultat et le bilan | §3 et §4 | L'ouvrier ne se sent libre que dans ses fonctions animales ; récapitulation des deux aspects, l'aliénation de la chose et l'aliénation de soi. |

    ! Le texte décrit l'aliénation {green}telle que l'ouvrier l'éprouve{/green} : se sentir chez soi ou hors de soi, à l'aise ou malheureux, libre ou animal. Ce n'est pas {red}une psychologie{/red} : l'épreuve vécue est le signe d'un rapport réel.
