- id: m1844c-i2
  title: "La question, la thèse, la problématique"
  notes: |-
    **Le texte se demande {coral}en quoi consiste l'aliénation du travail dans l'acte même de travailler{/coral}, et non plus seulement dans ce que le travail produit.**

    **Contre quelle réponse ordinaire ?** Une longue tradition tient le travail pour {red}une peine par nature{/red}, depuis la malédiction de la Genèse, « tu travailleras à la sueur de ton front ». L'économie politique la reprend : Smith conçoit le travail comme un sacrifice du repos et de la liberté. La question de Marx est donc de savoir si la peine que l'ouvrier éprouve tient {amber}à l'essence du travail{/amber}, ou {amber}à la forme qu'il prend quand il est aliéné{/amber}.

    **Sa thèse :** l'aliénation n'est pas seulement dans le produit, elle est {coral}d'abord dans l'acte de produire{/coral}, dont le produit n'est que le résumé. Le travail aliéné est {violet}extérieur{/violet} à l'ouvrier, il n'appartient pas à son essence et appartient à un autre : l'ouvrier ne s'y affirme pas mais s'y nie, ne le fait que contraint et comme simple moyen de satisfaire des besoins qui lui sont extérieurs, et éprouve sa propre activité {violet}comme une passion subie{/violet}, la perte de lui-même. Il en résulte que l'ouvrier {coral}ne se sent libre que dans ses fonctions animales{/coral}, et animal dans le travail, sa fonction la plus humaine.

    **Sa problématique :** comment l'activité par laquelle l'homme devrait s'affirmer peut-elle être vécue par l'ouvrier comme la perte de lui-même, au point que ce soit {coral}hors d'elle, dans ses fonctions animales, qu'il se sente libre{/coral} ?

    **Pourquoi est-ce difficile ?**
    - L'activité semble {amber}ce qu'il y a de plus propre à chacun{/amber}. On peut perdre un produit, qu'un autre emporte ; on ne voit pas comment on perdrait son activité au moment même où on l'exerce, puisque c'est soi qui agit. Dire que l'activité de l'ouvrier « appartient à un autre », c'est dire qu'{red}il agit sans que ce soit lui qui agisse{/red}. Le texte aggrave la difficulté avec « l'activité qui est passivité », « la force qui est impuissance ».
    - Si le travail aliéné rend l'ouvrier « animal », Marx semble {red}mépriser les fonctions du corps{/red} ; or il les dit lui-même « authentiquement humaines ».

    | Difficulté | Où elle se trouve | Réponse du texte |
    | on agit sans que l'activité soit sienne | « elle appartient à un autre » | l'ouvrier a vendu la disposition de son activité : elle est déclenchée et dirigée par un autre |
    | une activité qui est passivité | le bilan, §4 | séparé du besoin qui devait le mettre en mouvement, l'ouvrier retrouve la passivité dans son agir même |
    | l'homme devenu animal par son corps | « ses fonctions animales » | ce n'est pas le corps qui animalise, c'est l'abstraction qui le coupe du reste de la vie |

    **L'hypothèse de lecture :** le texte répond par deux distinctions. L'une, qu'il {amber}suppose{/amber}, oppose l'activité qui part de soi et l'activité qui appartient à un autre ; l'autre, qu'il {amber}formule{/amber}, oppose une fonction prise dans l'ensemble de la vie et la même fonction isolée, devenue fin unique.

    ! La thèse est forte sur l'ordre des raisons : l'aliénation de l'activité {green}fonde{/green} celle du produit, {red}non l'inverse{/red}. Elle est limitée sur un point : l'extériorité du travail, dont tout découle, est {amber}décrite plutôt que déduite{/amber}.
