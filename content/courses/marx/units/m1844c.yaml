- id: m1844-p10e
  title: "Le travail qui appartient à un autre"
  notes: |-
    **Le troisième caractère est l'appartenance : le travail de l'ouvrier {coral}est à un autre{/coral}, et, pendant qu'il travaille, {coral}l'ouvrier lui-même est à un autre{/coral}.** L'extériorité reçoit sa forme la plus nette.

    **Pourquoi « enfin » et « le caractère extérieur » ?** *Endlich* répond au « d'abord » : c'est le troisième caractère. Et le mot *Äußerlichkeit*, l'extériorité, {amber}reprend le premier{/amber}. Les trois caractères ne sont donc pas trois choses : {coral}ils n'en font qu'un, vu sous trois angles{/coral}, l'extériorité éprouvée (le malheur), l'extériorité imposée (la contrainte), l'extériorité possédée (l'appartenance).

    **Pourquoi le vocabulaire de la propriété ?** *Nicht sein eigen, sondern eines andern* : « non son bien propre, mais celui d'un autre ». L'extériorité, jusqu'ici décrite comme une épreuve, est maintenant dite {violet}en termes de propriété{/violet}. Ce qui est extérieur à l'ouvrier, c'est {amber}ce qui appartient à un autre{/amber}.

    **Pourquoi la phrase passe-t-elle du travail à l'homme ?** « Il ne lui appartient pas » porte sur le travail ; « l'ouvrier ne s'appartient pas lui-même » porte sur l'ouvrier. {coral}L'appartenance passe du travail à la personne{/coral} : pendant le temps vendu, c'est l'ouvrier lui-même qui est à un autre. Comment est-ce possible ? Parce que l'activité ne se détache pas de celui qui l'exerce : {amber}vendre son activité, c'est vendre l'usage de soi{/amber} pendant qu'on l'exerce. {yellow}L'ouvrier qui a vendu ses journées ne s'appartient plus de huit heures à dix-huit heures : on lui dit où se tenir, quoi faire et à quel rythme.{/yellow}

    **Qui est « un autre » ?** *Eines andern*, au masculin ou au neutre : le texte {red}ne dit pas encore qui{/red}. Mais c'est la première fois que l'autre n'est plus seulement un objet. Marx ne posera la question « à qui appartient-elle ? » qu'après avoir dégagé les quatre déterminations, et y répondra : {teal}« un autre homme que l'ouvrier »{/teal}.

    **Qu'est-ce que la phrase suppose ?** Que l'ouvrier ait {amber}vendu la disposition de son activité{/amber} : c'est ce que les colonnes sur le salaire ont décrit. Sans cette vente, on ne comprendrait pas que l'activité la plus propre puisse être la propriété d'un autre.

    ! « Un autre » ne désigne pas encore {red}le capitaliste{/red} : le texte se garde de le nommer, pour {green}le déduire{/green} plus tard du travail aliéné.
  passage:
