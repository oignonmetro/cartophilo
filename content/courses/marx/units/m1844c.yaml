- id: m1844-p9
  title: "L'aliénation dans l'acte même de produire"
  notes: |-
    **Marx fait le point : jusqu'ici, il n'a regardé l'aliénation que du côté du produit. Il annonce qu'elle est aussi {coral}dans l'acte de produire{/coral}, et le justifie par une question : un produit ne peut devenir étranger à celui qui le fait que si celui-ci, en le faisant, est déjà étranger à lui-même.**

    **Pourquoi « jusqu'ici » et « sous un seul aspect » ?** Marx regarde le chemin parcouru, ce que font les deux textes précédents. « Sous un seul aspect » {amber}annonce qu'il y en a d'autres{/amber}. Et « or » (*Aber*, mais) corrige une vue partielle : ce qui a été dit n'est pas faux, il est incomplet.

    **Pourquoi « l'aliénation, le dépouillement » ?** L'allemand juxtapose *Entfremdung* et *Entäußerung*, {violet}devenir étranger{/violet} et {violet}se dessaisir{/violet}. Les deux mots disent les deux faces d'une même perte : ce qui était à soi devient étranger, et l'on s'en est soi-même défait.

    **Pourquoi « dans le résultat… dans l'acte même » ?** L'opposition est celle du {amber}produit fini{/amber} et de {amber}l'activité qui se déroule{/amber}. « À l'intérieur de l'activité productive elle-même » insiste : il s'agit de ce qui se passe {coral}pendant{/coral} le travail. Et « n'apparaît pas seulement » traduit *zeigt sich*, « se montre » : l'aliénation est visible aussi dans l'acte, pour qui sait regarder.

    **Pourquoi une question ?** « Comment… ne serait-il pas… si… ne devenait pas » : la question est {amber}rhétorique{/amber}, et elle a la forme d'un raisonnement {violet}par la condition nécessaire{/violet}. Une question rhétorique n'est pas une démonstration ; mais celle-ci contient un argument qu'on peut déplier.
    - Ce qui devient étranger à l'ouvrier, c'est un produit qui, d'après le premier texte, {amber}n'est que son travail fixé dans un objet{/amber}.
    - Si l'activité était vraiment la sienne, le produit, qui n'en est que la forme fixe, {amber}le serait aussi{/amber}.
    - Si le produit lui est étranger, {coral}c'est donc que l'activité l'était déjà{/coral}.

    {yellow}Un écrivain qui ne se reconnaît pas dans le livre qu'il a écrit l'a sans doute écrit sous la dictée d'un autre.{/yellow}

    **Pourquoi « devenait étranger à lui-même » ?** L'allemand dit *sich nicht sich selbst entfremdete*, « ne s'aliénait pas lui-même à lui-même ». Le verbe est {violet}réfléchi{/violet} : l'ouvrier est à la fois {coral}l'agent et l'objet de son aliénation{/coral}. Ce n'est pas seulement qu'on lui prend quelque chose : c'est lui qui, en agissant, se rend étranger à lui-même.

    **Qu'est-ce que la phrase change ?** On serait tenté de croire que Marx {red}ajoute un second aspect au premier{/red}, comme on ajoute une remarque. En réalité, il en fait {green}la condition du premier{/green}, et {coral}renverse l'ordre suivi jusqu'ici{/coral} : ce qui avait été exposé en premier, l'aliénation du produit, dépend de ce qui vient maintenant. L'ouvrier vit son activité {amber}comme activité d'un autre et pour un autre{/amber}.

    ! L'aliénation de l'activité n'est pas {red}la conséquence{/red} de celle du produit, comme si l'ouvrier, sachant qu'on lui prendra son produit, travaillait sans cœur : elle en est {green}la condition{/green}.
  passage:
    label: "§1"
    part: "1. Du produit à l'acte"
    text: "Nous n'avons considéré jusqu'ici l'aliénation, le dépouillement de l'ouvrier, que sous un seul aspect, celui de son rapport aux produits de son travail. Or, l'aliénation n'apparaît pas seulement dans le résultat, mais aussi dans l'acte même de la production, à l'intérieur de l'activité productive elle-même. Comment le produit ne serait-il pas étranger à l'ouvrier si celui-ci, dans l'acte même de la production, ne devenait pas étranger à lui-même ?"
  points:
