- id: m1844-p12
  title: "3.3 Les deux aspects : l'aliénation de la chose et l'aliénation de soi"
  notes: |-
    **Bilan : le travail aliéné a deux aspects, {coral}l'aliénation de la chose{/coral} (le produit, et avec lui la nature) et {coral}l'aliénation de soi{/coral} (l'activité, vécue comme passion).**

    **Le premier aspect** est le rapport de l'ouvrier au produit, {amber}objet étranger qui le domine{/amber}, qui est « en même temps » son rapport au monde extérieur sensible : la synthèse des deux textes précédents.

    **Le second** est le rapport à sa propre activité comme activité étrangère : {teal}« l'activité qui est passivité, la force qui est impuissance, la procréation qui est castration »{/teal}. L'allemand dit *die Tätigkeit als Leiden* : {violet}*Leiden*{/violet}, souffrance et passion, le fait de subir.

    **Comment une activité peut-elle être une passivité ?** Raisonnement que Fischbach déplie (séance du 3 novembre) : un être naturel est à la fois passif et actif, il pâtit du besoin et agit pour y répondre. L'ouvrier aliéné est séparé de ce principe passif : ce n'est pas son besoin qui le met au travail, il n'est plus qu'{amber}une pure capacité d'agir{/amber} qu'un autre met en œuvre. Alors, {teal}« au moment où il devrait y avoir une expérience d'activation, il y a expérience de passivité »{/teal}, {coral}une passivité qui n'est pas la sienne{/coral}.

    « Car qu'est-ce que la vie sinon l'activité ? » : l'activité aliénée est {amber}une vie aliénée{/amber}, la « vie personnelle » de l'ouvrier retournée contre lui (*wider ihn selbst gewendete*). D'où la formule finale : {violet}*Selbstentfremdung*{/violet}, l'aliénation de soi, comme plus haut l'*Entfremdung der Sache*.

    ! Le bilan suit l'ordre de l'exposition, mais {red}l'ordre des raisons{/red} est l'inverse : {green}l'aliénation de soi fonde celle de la chose{/green}.
  passage:
    label: "§4"
    part: "3. Le résultat et le bilan"
    text: "Nous avons considéré l'acte d'aliénation de l'activité humaine pratique, le travail, sous deux aspects. 1) Le rapport de l'ouvrier au produit du travail en tant qu'objet étranger qui le tient sous sa domination. Ce rapport est en même temps le rapport au monde extérieur sensible, aux objets de la nature, monde qui lui est à la fois étranger et hostile. 2) Le rapport entre le travail et l'acte de production à l'intérieur du travail. Ce rapport est le rapport de l'ouvrier à sa propre activité en tant qu'activité étrangère qui ne lui appartient pas, c'est l'activité qui est passivité, la force qui est impuissance, la procréation qui est castration. C'est l'énergie physique et intellectuelle de l'ouvrier, sa vie personnelle – car qu'est-ce que la vie sinon l'activité ? – qui est transformée en activité dirigée contre lui-même, indépendante de lui, ne lui appartenant pas. C'est l'aliénation de soi comme, plus haut, l'aliénation de la chose."
