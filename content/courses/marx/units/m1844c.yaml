- id: m1844-p10b
  title: "Chez soi hors du travail, hors de soi dans le travail"
  notes: |-
    **La chaîne de conséquences continue : puisque le travail n'est pas à lui, {coral}l'ouvrier n'est lui-même que quand il ne travaille pas{/coral}.** La vie de l'ouvrier se coupe en deux : le temps où il est lui, le temps où il est hors de lui.

    **Pourquoi « en conséquence » ?** L'allemand dit encore *daher* : c'est {amber}le deuxième maillon{/amber} de la chaîne. Si le travail n'appartient pas à l'essence de l'ouvrier, l'ouvrier ne peut se retrouver lui-même que là où le travail n'est pas.

    **Pourquoi « ne se sent lui-même » et « se sent extérieur à lui-même » ?** L'allemand oppose {violet}*bei sich*{/violet}, « auprès de soi », chez soi, et {violet}*außer sich*{/violet}, « hors de soi ». L'expression *außer sich* veut dire aussi, en allemand courant, {amber}être hors de soi, perdre la maîtrise de soi{/amber}. Le travail n'est pas seulement un lieu où l'ouvrier n'est pas lui-même : c'est un lieu où il ne se possède plus.

    **Pourquoi « à l'aise » ?** L'allemand dit *zu Hause*, {coral}« chez soi »{/coral}, que la traduction affaiblit. Le travail est {amber}le lieu où l'ouvrier n'est pas chez lui{/amber}. L'image est forte : l'endroit où il passe la plus grande partie de ses journées est une terre étrangère.

    **Pourquoi la seconde phrase répète-t-elle la première ?** Elle la redit sous forme de {violet}chiasme{/violet} : à l'aise quand il ne travaille pas, pas à l'aise quand il travaille. La répétition n'est pas une négligence : elle {coral}enferme l'ouvrier dans une alternative{/coral}, qui recouvre toute sa vie. {yellow}Le salarié qui compte les heures jusqu'au soir et les jours jusqu'au dimanche ne vit vraiment qu'en dehors de son travail.{/yellow}

    **Qu'est-ce que la phrase suppose ?** Que le soi de l'ouvrier soit {amber}ailleurs que dans son activité principale{/amber}. Or, chez un être dont l'essence est l'activité, ce partage est une mutilation : le temps « à soi » est le temps où l'on ne fait rien de ce qui fait l'homme. C'est ce que le troisième paragraphe tirera : {coral}l'ouvrier ne se sent libre que dans ses fonctions animales{/coral}.

    ! La phrase ne décrit pas {red}une humeur{/red}, une lassitude passagère : elle décrit {green}une coupure de la vie{/green}, que le texte va donner pour nécessaire.
  passage:
    label: "§2"
    part: "2. En quoi consiste l'aliénation du travail"
    text: "En conséquence, l'ouvrier ne se sent lui-même qu'en dehors du travail et dans le travail il se sent extérieur à lui-même. Il est à l'aise quand il ne travaille pas et, quand il travaille, il ne se sent pas à l'aise."
