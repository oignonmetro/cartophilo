- id: m1844-p10d
  title: "La preuve : fui comme la peste"
  notes: |-
    **Marx donne une preuve tirée de l'expérience : {coral}on fuit le travail dès qu'on le peut{/coral}, ce qui montre qu'on ne le fait que contraint. Et il qualifie ce travail d'un mot religieux : sacrifice de soi et mortification.**

    **Pourquoi « le caractère du travail » ?** L'allemand dit *ihre Fremdheit*, {violet}« son caractère étranger »{/violet} : la traduction perd le mot étranger. « Apparaît nettement » traduit *tritt rein hervor*, {amber}« se montre à l'état pur »{/amber}, sans mélange : quand la contrainte cesse, on voit ce que le travail est pour l'ouvrier.

    **Quelles contraintes ?** « Physique ou autre » : la contrainte physique est celle {amber}du fouet, de la prison, de la maison de travail{/amber} ; l'« autre » est {amber}la faim, la nécessité de gagner sa vie{/amber}. Ôtez l'une et l'autre, et le travail est fui {violet}« comme la peste »{/violet}, comme une épidémie qu'on fuit pour sauver sa vie. {yellow}La foule qui quitte l'usine à la sirène du soir dit la même chose.{/yellow}

    **La preuve suffit-elle ?** Non, et il faut en mesurer la portée. Qu'on fuie le travail dès que la contrainte cesse prouve qu'{amber}on ne le veut pas pour lui-même{/amber}. Cela {red}ne prouve pas, à soi seul, qu'il soit extérieur à l'essence de l'homme{/red} : on pourrait y voir, avec Smith, la preuve que tout travail est une peine. Pour que la preuve vaille, il faut admettre qu'{green}un autre travail est possible{/green}, que l'homme ferait sans y être contraint. C'est ce que le texte suivant affirmera : l'homme {teal}« produit même lorsqu'il est libéré de tout besoin physique et ne produit vraiment que lorsqu'il en est vraiment libéré »{/teal}. L'expérience {amber}atteste{/amber} la thèse plus qu'elle ne la démontre.

    **La réponse à Smith.** Smith prend la forme particulière du travail aliéné pour {red}une fatalité de la condition humaine{/red}. Marx le lui reprochera dans les *Grundrisse* : Smith envisage le travail {teal}« comme malédiction »{/teal}, alors qu'il peut devenir {teal}« travail attractif, autoeffectuation de l'individu »{/teal}. Ce qui ne veut pas dire {red}un amusement{/red} : un travail libre, comme la composition musicale, demande le plus grand sérieux et l'effort le plus intense. La fuite du travail ne prouve donc pas que le travail soit une peine par nature, mais {coral}qu'il l'est devenu sous la contrainte{/coral}.

    **Pourquoi « sacrifice de soi, mortification » ?** *Selbstaufopferung*, *Kasteiung* : {violet}le vocabulaire de l'ascèse chrétienne{/violet}. Dans l'ascèse, l'homme se mortifie pour un dieu, et sacrifie sa vie présente à une fin qui le dépasse ; dans le travail aliéné, l'ouvrier {coral}se sacrifie pour une fin qui n'est pas la sienne{/coral}. Et « extérieur à l'homme » : le sujet n'est plus l'ouvrier, mais l'homme ; ce qui est atteint, c'est {amber}l'humanité de l'ouvrier{/amber}.

    ! Le sacrifice suppose {green}quelqu'un à qui l'on sacrifie{/green} : la phrase prépare le troisième caractère, le travail qui appartient à un autre.
