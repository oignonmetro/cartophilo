    part: "2. En quoi consiste l'aliénation du travail"
    text: "Enfin le caractère extérieur à l'ouvrier du travail apparaît dans le fait qu'il n'est pas son bien propre, mais celui d'un autre, qu'il ne lui appartient pas, que dans le travail l'ouvrier ne s'appartient pas lui-même, mais appartient à un autre."
