- id: m1844-p10f
  title: "L'activité d'un autre, comme dans la religion"
  notes: |-
    **Marx compare l'ouvrier au croyant, qui éprouve l'activité de sa propre imagination {coral}comme l'action d'un dieu ou d'un démon{/coral}.** De même, l'activité de l'ouvrier n'est pas la sienne : elle est la perte de soi.

    **Pourquoi « l'activité propre » ?** *Die Selbsttätigkeit*, {violet}l'activité qui part de soi{/violet}. Le mot n'est pas appliqué à l'ouvrier, mais à l'imagination du croyant : dans la religion, c'est bien {amber}l'homme qui agit{/amber}, même s'il croit subir.

    **Pourquoi « de l'imagination, du cerveau et du cœur » ?** *Phantasie*, *Hirn*, *Herz* : la triade désigne {amber}les facultés qui produisent la religion{/amber}, la fantaisie, la pensée et le sentiment. Le triple « humain » insiste sur leur origine : ce qui agit sur le croyant vient de lui.

    **Pourquoi « divine ou diabolique » ?** Bienveillante ou malveillante, l'inspiration ou la tentation, {red}peu importe{/red} : dans les deux cas, {coral}ce n'est plus moi qui agis{/coral}. Ce que l'homme produit en lui-même se retourne sur lui comme une force venue d'ailleurs.

    **En quoi cette comparaison diffère-t-elle de celle du premier texte ?** Là, Marx comparait {amber}le produit à Dieu{/amber} : la richesse que l'homme place hors de lui. Ici, il compare {amber}l'activité à l'activité religieuse{/amber} : non plus ce que l'homme a produit, mais la manière dont il éprouve ce qu'il fait. C'est la même inversion, {coral}portée à l'intérieur de l'activité{/coral}.

    **Qu'est-ce qui justifie le parallèle ?** Une structure commune en trois points.
    - Une {amber}activité humaine réelle{/amber}, l'imagination du croyant ou le travail de l'ouvrier, se déroule en l'homme lui-même.
    - Elle est {amber}vécue comme l'activité d'un autre{/amber}, qui agit en lui et sur lui.
    - L'homme est {amber}dépossédé de ce qui est le plus intime{/amber}, son propre agir.

    **Où le parallèle s'arrête-t-il ?** Chez le croyant, l'activité est sienne et seulement {red}vécue{/red} comme étrangère : l'étrangeté est une illusion, que la critique de Feuerbach dissipe. Chez l'ouvrier, l'activité appartient à un autre {green}réellement{/green}, puisque celui qui a acheté son temps en dispose. {coral}Ce qui est illusion dans la religion est rapport effectif dans le travail.{/coral}

    **La première difficulté est résolue.** Comment un homme peut-il agir sans que son activité soit la sienne ? L'ouvrier agit, mais son activité {red}n'est pas une activité propre{/red} : elle est {green}déclenchée, dirigée et possédée par un autre{/green}. Il n'y a pas de contradiction, dès lors qu'il a vendu la disposition de cette activité. {yellow}L'ouvrier à la chaîne fait bien chaque geste lui-même ; mais le rythme, l'ordre et le but de ses gestes lui sont imposés.{/yellow}

    ! « La perte de soi-même » (*der Verlust seiner selbst*) est {green}la formule ultime de l'extériorité{/green} : ce n'est plus un bien, ni même un produit, que l'ouvrier perd, c'est lui-même.
  passage:
    label: "§2"
    part: "2. En quoi consiste l'aliénation du travail"
    text: "De même que, dans la religion, l'activité propre de l'imagination humaine, du cerveau humain et du cœur humain, agit sur l'individu indépendamment de lui, c'est-à-dire comme une activité étrangère, divine ou diabolique, de même l'activité de l'ouvrier n'est pas son activité propre. Elle appartient à un autre, elle est la perte de soi-même."
  points:
