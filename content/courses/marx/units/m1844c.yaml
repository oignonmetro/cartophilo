- id: m1844-p12b
  title: "Second aspect : l'activité qui est passivité"
  notes: |-
    **Le second aspect est le rapport de l'ouvrier à sa propre activité, devenue étrangère, au point que {coral}son agir est un subir, sa force une impuissance, sa fécondité une stérilité{/coral}.** Trois formules unissent les contraires, et la première est la plus difficile du texte.

    **Pourquoi « à l'intérieur du travail » ?** C'est le second aspect annoncé au §1 : non plus le résultat, mais {amber}l'acte de production tel qu'il se déroule{/amber}. « Activité étrangère qui ne lui appartient pas » résume le §2.

    **Que veut dire « l'activité qui est passivité » ?** L'allemand dit *die Tätigkeit als Leiden* : l'activité {violet}comme souffrance, comme passion{/violet}. *Leiden* désigne le fait de pâtir, de subir ; la traduction choisit l'un de ses sens.

    **Comment une activité peut-elle être une passivité ?** Le raisonnement implicite passe par trois étapes.
    - **Un être naturel est actif et passif à la fois** : il {amber}pâtit du besoin{/amber}, qui l'affecte, et il {amber}agit pour y répondre{/amber}. La passivité du besoin est au principe de son activité.
    - **L'ouvrier aliéné est séparé de ce principe** : ce n'est pas son besoin qui le met au travail, et il n'est plus qu'{amber}une pure capacité d'agir{/amber}, qui attend qu'un autre lui fournisse de quoi s'exercer.
    - **Quand cette capacité est mise en œuvre**, elle l'est par un autre et pour un autre : l'ouvrier {coral}éprouve son propre agir comme quelque chose qu'il subit{/coral}.

    Là où il devrait faire l'expérience de son activité, il fait l'expérience d'une passivité, mais {red}d'une passivité qui n'est pas la sienne{/red}, qui lui vient du dehors. L'aliénation n'est pas qu'{red}une chose agisse à la place de l'ouvrier{/red} : c'est que {green}l'ouvrier soit séparé de sa propre passivité, et la retrouve, retournée contre lui, dans son activité{/green}. {yellow}L'ouvrier à la chaîne dépense toute son énergie, et n'éprouve le soir que la fatigue d'avoir été mené par la machine : il a agi toute la journée, et il a vécu cette journée comme une chose subie.{/yellow}

    **Pourquoi « la force qui est impuissance » ?** *Die Kraft als Ohnmacht* : la formule reprend {amber}le cinquième couple des six inversions{/amber}, « plus le travail est puissant, plus l'ouvrier est impuissant ». La force de l'ouvrier passe dans ce qui le domine.

    **Pourquoi « la procréation qui est castration » ?** *Die Zeugung als Entmannung* : l'image sexuelle dit que {coral}la puissance d'engendrer, de produire du nouveau, est retranchée à celui qui l'exerce{/coral}. Produire, c'est mettre au monde ; l'ouvrier met au monde ce qui ne sera pas à lui, et en sort diminué.

    ! Les trois formules ne sont pas {red}des paradoxes rhétoriques{/red} : chacune dit {green}un rapport réel{/green}, où ce que l'ouvrier exerce se retourne contre lui.
  passage:
    label: "§4"
    part: "3. Le résultat et le bilan"
    text: "2) Le rapport entre le travail et l'acte de production à l'intérieur du travail. Ce rapport est le rapport de l'ouvrier à sa propre activité en tant qu'activité étrangère qui ne lui appartient pas, c'est l'activité qui est passivité, la force qui est impuissance, la procréation qui est castration."
