- id: m1844-p10
  title: "L'aliénation du travail : un travail extérieur, forcé"
  notes: |-
    **L'aliénation du travail consiste d'abord en ce que le travail est {red}extérieur à l'ouvrier{/red} : il n'y affirme pas son essence, il s'y nie.**

    Dans son travail, l'ouvrier {coral}ne s'affirme pas, mais se nie{/coral} ; il est malheureux, mortifie son corps et ruine son esprit. Il ne se sent lui-même qu'{amber}en dehors du travail{/amber}, et extérieur à lui-même dans le travail. Le travail n'est donc pas volontaire mais {violet}forcé{/violet} ; il n'est pas la satisfaction d'un besoin, seulement {violet}un moyen de satisfaire des besoins{/violet} hors de lui. Preuve : dès qu'aucune contrainte ne s'exerce, il est fui comme la peste. Enfin il n'est pas le bien de l'ouvrier mais celui {red}d'un autre{/red}. Marx le compare de nouveau à la religion : l'activité de l'ouvrier n'est pas son activité propre, elle est {coral}la perte de soi-même{/coral}.

    ! « Extérieur » ne veut pas dire pénible : le travail est extérieur parce qu'il n'appartient pas à l'essence de l'ouvrier, ni à lui-même.
  passage:
    label: "§2"
    text: "En quoi consiste l'aliénation du travail ? D'abord dans le fait que le travail est extérieur à l'ouvrier, c'est-à-dire qu'il n'appartient pas à son essence, que donc, dans son travail, l'ouvrier ne s'affirme pas, mais se nie, ne se sent pas à l'aise, mais malheureux ; il n'y déploie pas une libre activité physique et intellectuelle, mais mortifie son corps et ruine son esprit. En conséquence, l'ouvrier ne se sent lui-même qu'en dehors du travail et dans le travail il se sent extérieur à lui-même. Il est à l'aise quand il ne travaille pas et, quand il travaille, il ne se sent pas à l'aise. Son travail n'est donc pas volontaire, mais contraint, c'est du travail forcé. Il n'est donc pas la satisfaction d'un besoin, mais seulement un moyen de satisfaire des besoins en dehors du travail. Le caractère du travail apparaît nettement dans le fait que, dès qu'il n'existe pas de contrainte physique ou autre, le travail est fui comme la peste. Le travail extérieur à l'homme, dans lequel il se dépouille, est un travail de sacrifice de soi, de mortification. Enfin le caractère extérieur à l'ouvrier du travail apparaît dans le fait qu'il n'est pas son bien propre, mais celui d'un autre, qu'il ne lui appartient pas, que dans le travail l'ouvrier ne s'appartient pas lui-même, mais appartient à un autre. De même que, dans la religion, l'activité propre de l'imagination humaine, du cerveau humain et du cœur humain, agit sur l'individu indépendamment de lui, c'est-à-dire comme une activité étrangère, divine ou diabolique, de même l'activité de l'ouvrier n'est pas son activité propre. Elle appartient à un autre, elle est la perte de soi-même."
  points:
