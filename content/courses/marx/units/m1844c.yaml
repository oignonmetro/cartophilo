- id: m1844-p11
  title: "3.1 et 3.2 L'animal devient humain, l'humain devient animal"
  notes: |-
    **L'ouvrier ne se sent libre que dans ses fonctions animales, et animal dans le travail : {coral}« ce qui est animal devient humain, et ce qui est humain devient animal »{/coral}.**

    **3.1 Le résultat.** *Es kömmt daher* : le dernier *daher* de la chaîne. « L'homme (l'ouvrier) » : ce qui arrive à l'ouvrier arrive à l'homme. Il ne se sent libre (*freitätig*) {amber}« plus que »{/amber} (*nur mehr*) en mangeant, buvant, procréant, et tout au plus dans le choix de son logis et de sa parure (*Schmuck*). Le chiasme dit {coral}l'inversion complète{/coral} des valeurs de la vie. Prémisse implicite, établie dans le texte suivant : le travail est {violet}la fonction proprement humaine{/violet}.

    **3.2 Des fonctions humaines séparées abstraitement.** La concession (*zwar auch*) est réelle : manger, boire, procréer sont {green}« authentiquement humaines »{/green}. Elles deviennent animales {amber}« séparées abstraitement »{/amber} du reste des activités et devenues {coral}« la fin dernière et unique »{/coral}.

    ? **Abstrait** : chez Marx, formé à l'école de Hegel, ce qui est {violet}séparé{/violet}, isolé, privé de ses rapports ; le concret est ce qui est complet, pris dans tous ses rapports (Fischbach).

    Une fonction humaine l'est par ses rapports au reste de la vie : on mange pour vivre, mais aussi pour travailler, penser, aimer. Coupée de ce tout, elle retombe à ce qu'elle est chez l'animal, {amber}le tout de la vie{/amber}. Ce n'est donc pas le corps qui animalise l'homme, c'est {coral}l'abstraction{/coral} produite par le travail aliéné, qui chasse hors du travail tout ce qu'il peut éprouver comme sien.

    ! Marx ne prône pas {red}un idéal ascétique{/red} : il reproche au travail aliéné d'avoir {green}appauvri jusqu'aux plaisirs du corps{/green}.
  passage:
    label: "§3"
    part: "3. Le résultat et le bilan"
    text: "On en vient donc à ce résultat que l'homme (l'ouvrier) se sent agir librement seulement dans ses fonctions animales : manger, boire et procréer, ou encore, tout au plus, dans le choix de sa maison, de son habillement, etc. ; en revanche, il se sent animal dans ses fonctions proprement humaines. Ce qui est animal devient humain, et ce qui est humain devient animal. Manger, boire, procréer, etc., sont certes aussi des fonctions authentiquement humaines. Mais séparées abstraitement du reste du champ des activités humaines et devenues ainsi la fin dernière et unique, elles ne sont plus que des fonctions animales."
