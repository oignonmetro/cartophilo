- id: g1857-p2
  title: "Le travail en général, indifférent à toute déterminité"
  notes: |-
    **Face au capital, le travail n'est pas tel ou tel travail mais {violet}du travail en général{/violet}, abstrait, {amber}absolument indifférent à sa déterminité{/amber} : cette indifférence fait le caractère économique du travailleur.**

    Le capital, en tant que tel, est {amber}indifférent à toute particularité de sa substance{/amber} ; le travail qui lui fait face possède en soi {coral}la même totalité et la même abstraction{/coral}. Dans l'organisation corporative, le capital est encore plongé dans une substance déterminée (il n'est pas encore capital en tant que tel), et le travail dans sa déterminité particulière. Face au capital, au contraire, toutes les sortes de travail lui font face {violet}en puissance{/violet} (*dynámei*), et c'est le hasard qui met l'une d'elles en face de lui. Le travailleur est lui aussi indifférent à la déterminité de son travail, qui ne l'intéresse que comme {coral}valeur d'usage pour le capital{/coral} : être porteur du travail en tant que tel est son {amber}caractère économique{/amber}. L'artisan, lui, se définit par la déterminité de son travail.

    Ce rapport est d'autant plus pur que le travail devient {red}activité purement abstraite, mécanique{/red}, indifférente à sa forme. Il ne devient donc vrai qu'avec {green}un mode de production matériel particulier et une étape du développement des forces productives{/green} : c'est une détermination historique.

    ! L'abstraction du travail n'est pas une simple vue de l'esprit : elle suppose un développement réel du mode de production.
  passage:
    label: "§2"
    text: "Le dernier point sur lequel il faut encore attirer l'attention dans le travail qui fait face au capital est le suivant : en tant qu'il est la valeur d'usage faisant face à l'argent posé comme capital, il n'est pas tel ou tel travail, mais du travail en général, du travail abstrait ; absolument indifférent à sa déterminité particulière, mais susceptible de prendre n'importe quelle déterminité. A la substance particulière qui constitue un capital déterminé, doit naturellement correspondre un travail particulier ; mais, comme le capital en tant que tel est indifférent à toute particularité de sa substance, et ceci aussi bien en tant que totalité de cette substance qu'en tant qu'abstraction de toutes les particularités de celle-ci, le travail qui lui fait face possède en soi subjectivement la même totalité et la même abstraction. Dans l'organisation corporative, artisanale, du travail, par exemple, où le capital lui-même a encore une forme bornée, est encore entièrement plongé dans une substance déterminée, et, partant, n'est pas encore capital en tant que tel, le travail apparaît également comme encore plongé dans sa déterminité particulière ; il n'est pas encore dans sa totalité et son abstraction, pas encore le travail en tant qu'il fait face au capital. C'est-à-dire que le travail est bien dans chaque cas singulier un travail, mais le capital peut se présenter face à tout travail déterminé ; toutes les sortes de travail dans leur totalité lui font face δυνάμει et c'est le hasard qui fait que telle ou telle d'entre elles se trouve précisément en face de lui. D'un autre côté, le travailleur lui-même est absolument indifférent à la déterminité de son travail ; celui-ci ne présente pour lui aucun intérêt en tant que tel, mais seulement dans la mesure où il est du travail tout court, et, en tant que tel, valeur d'usage pour le capital. Etre porteur du travail en tant que tel – c'est-à-dire du travail comme valeur d'usage pour le capital – constitue donc son caractère économique ; il est travailleur par opposition au capitaliste. Il n'en est pas de même des artisans et des compagnons des corporations, etc., dont le caractère économique réside précisément dans la déterminité de leur travail et dans le rapport à un maître déterminé, etc. Ce rapport économique – ce caractère dont le capitaliste et le travailleur, considérés comme les extrêmes d'un rapport de production, sont porteurs – est donc développé de façon d'autant plus pure et adéquate que le travail perd tout caractère d'art, que l'habileté technique particulière qu'il requiert devient toujours davantage quelque chose d'abstrait, d'indifférent et qu'il devient toujours davantage activité purement abstraite, purement mécanique, partant, indifférente, activité indifférente à sa forme particulière ; activité simplement formelle ou, ce qui revient au même, simplement matérielle, activité en général, indifférente à sa forme. Ici encore se révèle donc que la déterminité particulière du rapport de production, de sa catégorie – ici, capital et travail – ne devient vraie qu'avec le développement d'un mode de production matériel particulier et d'une étape particulière du développement des forces productives industrielles. (Point à développer particulièrement à l'occasion de ce rapport, ultérieurement ; car ici il est déjà posé dans le rapport lui-même, alors que, dans les déterminations abstraites : valeur d'échange, circulation, argent, il tombe encore davantage dans le champ de notre réflexion subjective.)"
