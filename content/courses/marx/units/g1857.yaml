- id: g1857-p3
  title: "Amené au contact du capital : vie fécondante et ferment"
  notes: |-
    **Le travail n'est pas seulement la valeur d'usage qui fait face au capital : il est la valeur d'usage {coral}même{/coral} du capital. Séparé de lui, simple possibilité ; amené à son contact, il devient activité effective posant de la valeur.**

    Après l'échange, Marx passe à la {violet}relation du capital au travail comme valeur d'usage{/violet}. Le travail est le {red}non-être des valeurs{/red} en tant qu'elles sont objectivées, leur être en tant qu'elles sont non objectivées : {coral}la possibilité des valeurs{/coral}, qui en tant qu'activité pose de la valeur. Face au capital, il n'est que la simple forme abstraite, la simple possibilité de l'activité, faculté dans la corporéité du travailleur. {amber}Amené par le contact avec le capital à l'activité effective{/amber} (il ne peut y parvenir de lui-même, étant sans objet), il devient une activité effective posant de la valeur.

    Par l'échange, le capital s'est approprié le travail ; celui-ci, devenu un de ses moments, agit comme {green}vie fécondante{/green} sur l'objectivité du capital, {red}objectivité morte{/red}. Le capital, argent existant dans toutes les formes du travail objectivé, entre en procès avec le travail vivant : il est alors une différence qualitative entre sa substance et sa forme, et c'est dans la différenciation et l'abolition de cette différence qu'il {amber}devient lui-même procès{/amber}. Le travail est le {violet}ferment{/violet} jeté dans le capital : il faut que l'objectivité du capital soit consommée par le travail, et que la simple subjectivité du travail soit abolie, objectivée dans le matériau du capital.

    ! Le travail ne s'objective pas dans un matériau qui lui appartienne : c'est le matériau du capital.
  passage:
    label: "§3"
    text: "2) Nous en venons maintenant à la deuxième face du procès. L'échange entre le capital, ou le capitaliste, et le travailleur est maintenant terminé dans la mesure où il s'agit bien du procès d'échange. On passe à présent à la relation du capital au travail considéré comme sa valeur d'usage. Le travail n'est pas seulement la valeur d'usage qui fait face au capital, mais il est la valeur d'usage même du capital. Non-être des valeurs en tant qu'elles sont objectivées, le travail est leur être en tant qu'elles sont non objectivées, leur être idéel ; il est la possibilité des valeurs et, en tant qu'activité, il pose de la valeur. Face au capital, il est la simple forme abstraite, la simple possibilité de l'activité qui pose de la valeur, celle-ci existant seulement en tant que faculté, que puissance dans la corporéité du travailleur. Mais, amené par le contact avec le capital à l'activité effective – il ne peut y parvenir de lui-même puisqu'il est dépourvu d'objet – il devient une activité effective posant de la valeur, une activité productive. En ce qui concerne le capital, l'activité ne peut de toute façon consister que dans la reproduction de soi-même – la conservation et l'accroissement de soi comme la valeur effective et efficace, non de la valeur simplement imaginée, comme c'est le cas dans l'argent en tant que tel. Par l'échange avec le travailleur, le capital s'est approprié le travail lui-même ; celui-ci est devenu un de ses moments, qui agit alors comme vie fécondante sur l'objectivité du capital qui ne fait qu'exister et qui est donc une objectivité morte. Le capital est argent (valeur d'échange posée pour soi), mais il n'est plus argent en tant qu'existant dans une substance particulière, exclu par conséquent des autres substances des valeurs d'usage et existant à côté d'elles, mais en tant qu'il acquiert sa détermination idéale dans toutes les substances, dans les valeurs d'échange de toute forme et de tout mode d'existence du travail objectivé. Dans la mesure où le capital, comme argent existant dans toutes les formes particulières du travail objectivé, s'engage maintenant dans un procès avec le travail non plus objectivé, mais vivant, existant comme procès et comme acte, il est tout d'abord cette différence qualitative entre la substance, en quoi il consiste, et la forme, dans laquelle il existe désormais aussi en tant que travail. Et c'est au cours du procès de cette différenciation et de l'abolition de celle-ci que le capital devient lui-même procès. Le travail est le ferment qui, projeté dans le capital, provoque maintenant sa fermentation. D'un côté, il faut que l'objectivité en quoi le capital consiste soit travaillée, c'est-à-dire consommée par le travail, d'un autre côté que soit abolie la simple subjectivité du travail comme simple forme et qu'elle soit objectivée dans le matériau du capital."
