    answer: "activité"
    alt: ["sujet"]
- id: g1857-p1
  title: "Le travail posé comme non-capital : pauvreté absolue et source de la valeur"
  notes: |-
    **Posé comme le non-capital, le travail est à la fois {red}pauvreté absolue{/red} comme objet et {green}source vivante de la valeur{/green} comme sujet : deux thèses contradictoires qui sont la condition l'une de l'autre.**

    La séparation de la propriété et du travail est la {amber}loi nécessaire{/amber} de l'échange entre capital et travail. Le travail, tel que le capital le pose en face de lui, est d'abord {violet}travail non objectivé{/violet}, saisi négativement : {coral}le non-objectif sous forme objective{/coral}. Il n'est ni matière première, ni instrument, ni produit brut ; il est séparé de tous moyens et objets de travail, de toute son objectivité, une {violet}pure existence subjective{/violet}, dépouillée de tout : la {red}pauvreté absolue{/red}, non comme manque mais comme {red}exclusion totale de la richesse objective{/red}. Il est la non-valeur existante, valeur d'usage purement objective qui ne peut coïncider qu'avec la corporéité immédiate du travailleur.

    Saisi {green}positivement{/green}, ce même travail non objectivé est une négativité se rapportant à soi : le travail {amber}non comme objet mais comme activité{/amber}, non comme valeur mais comme {green}source vivante de la valeur{/green}, la possibilité universelle de la richesse. Les deux thèses ne se contredisent pas : elles découlent de l'essence du travail, tel que le capital le présuppose comme son opposé et tel qu'il présuppose à son tour le capital.

    ! La pauvreté absolue n'est pas la misère : c'est l'absence de tout rapport objectif, qui fait du travail la possibilité de toute richesse.
  passage:
    label: "§1"
    text: "La séparation de la propriété et du travail apparaît comme loi nécessaire de cet échange entre capital et travail. Posé comme le non-capital en tant que tel, le travail est : 1) Travail non objectivé, saisi négativement (lui-même encore objectif ; le non-objectif lui-même sous forme objective). En tant que tel, il est non-matière première, non-instrument de travail, non-produit brut ; le travail séparé de tous moyens et objets de travail, de toute son objectivité. Le travail vivant, existant comme abstraction des moments cités de son effectivité réelle (également non-valeur) ; ce complet dépouillement, c'est l'existence purement subjective du travail, démunie de toute objectivité. Le travail comme la pauvreté absolue : la pauvreté non comme manque, mais comme exclusion totale de la richesse objective. Ou bien encore, en tant qu'elle est la non-valeur existante et donc la valeur d'usage purement objective, existant sans médiation, cette objectivité ne peut être qu'une objectivité coïncidant avec la corporéité immédiate de celle-ci. Etant purement immédiate, l'objectivité est, de façon tout aussi immédiate, non-objectivité. En d'autres termes, elle n'est pas une objectivité qui tombe en dehors de l'existence immédiate de l'individu lui-même. 2) Travail non-objectivé, non-valeur, saisi positivement, ou négativité se rapportant à soi, il est l'existence non objectivée, donc inobjective, c'est-à-dire subjective, du travail lui-même. Le travail, non comme objet, mais comme activité ; non pas comme étant lui-même valeur, mais comme la source vivante de la valeur. La richesse universelle face au capital dans lequel elle existe objectivement, en tant que réalité effective, comme possibilité universelle de celui-ci, se vérifiant comme telle dans l'action. Il n'y a donc à aucun égard contradiction à dire, ou plutôt, les thèses à tous égards contradictoires disant que le travail est, d'un côté, la pauvreté absolue en tant qu'objet, de l'autre, la possibilité universelle de la richesse en tant que sujet et qu'activité, sont la condition l'une de l'autre et découlent de l'essence du travail, tel qu'il est présupposé par le capital comme son opposé, comme existence opposée au capital et tel que, d'autre part, il présuppose de son côté le capital."
