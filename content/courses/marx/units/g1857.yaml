# Unité de texte (voir content/textes.md) : Marx, *Grundrisse* (*Rohentwurf*,
# 1857-1858), cahier III, pages 9 et 10 du manuscrit de Marx : le travail posé
# comme non-capital (traduction de l'édition de l'utilisateur, Françoise
# Willmann). Trois paragraphes : le travail comme non-capital, comme travail en
# général, puis comme valeur d'usage du capital (ce dernier paragraphe est pris
# jusqu'à « soit objectivée dans le matériau du capital », la suite portant sur
# la matière première, l'instrument et le produit). Les appels de note et les
# marques de page sont retirés ; les italiques de l'original sont perdus par
# l'extraction. Commentaire : les séances de Fischbach des 5 et 12 novembre 2026
# (unités ali7, ali8 et ali10) ; allemand (Nicht-Kapital, absolute Armut,
# Nicht-Wert, Ferment, aufgehoben) vérifié sur l'édition allemande fournie
# (Rohentwurf, Dietz).

id: g1857
title: "Le travail comme non-capital (1857)"
subtitle: "Grundrisse, cahier III, pages 9 et 10 : le travail face au capital"
icon: page
color: coral
intro: |-
  Le texte des *Grundrisse* où Marx pose le travail comme le non-capital : pauvreté absolue et source vivante de la valeur, travail en général, abstrait, puis valeur d'usage du capital et ferment qui le fait entrer en procès.
lessons:
- id: g1857-i1
  title: "Le travail face au capital"
  notes: |-
    **Le passage décrit le travail tel que le capital le présuppose : d'abord comme non-capital, pauvreté absolue et source de la valeur ; puis comme travail en général, abstrait ; enfin comme activité qui, au contact du capital, le fait fermenter.**

    Il se situe au {violet}chapitre du capital{/violet} des *Grundrisse*, dans l'analyse du premier procès, l'échange du capital contre le travail. Marx vient de montrer que l'ouvrier échange sa marchandise, dont il reçoit la valeur d'échange, tandis que le capitaliste obtient la valeur d'usage. Le texte s'attache alors au {amber}travail qui fait face au capital{/amber} : une pauvreté absolue, un travail abstrait, mais aussi la possibilité universelle de la richesse.

    | Moment | Lieu | Ce qui s'y joue |
    | --- | --- | --- |
    | Le travail comme non-capital | §1 | le travail est pauvreté absolue comme objet et source vivante de la valeur comme activité, les deux thèses se conditionnant |
    | Le travail en général | §2 | le travail est abstrait, indifférent à toute déterminité, ce qui fait le caractère économique du travailleur et suppose un développement historique |
    | Le travail dans la relation au capital | §3 | amené au contact du capital, le travail devient activité posant de la valeur et ferment qui fait du capital un procès |

    ! Les passages sont tirés du cahier III du manuscrit de Marx (pages 9 et 10), sans les remarques de l'éditeur.
  passage:
    label: "Introduction"
  points:
