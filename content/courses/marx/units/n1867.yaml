- id: n1867-p2
  title: "La forme-marchandise renvoie aux hommes leur travail comme caractère des choses"
  notes: |-
    **Le caractère énigmatique du produit du travail vient {coral}de la forme-marchandise elle-même{/coral}.** Marx montre trois correspondances entre le social et le matériel : {amber}l'égalité des travaux humains{/amber} prend la forme de {violet}l'objectalité de valeur égale{/violet} des produits ; {amber}la mesure de la dépense de travail par sa durée{/amber} prend la forme de {violet}grandeur de valeur{/violet} ; et {amber}les rapports des producteurs{/amber} prennent la forme d'{violet}un rapport social entre les produits du travail{/violet}.

    **Le mystère de la forme-marchandise tient à ce qu'elle {coral}renvoie aux hommes{/coral} le caractère social de leur propre travail {coral}comme un caractère objectif des produits{/coral}**, comme des qualités que ces choses posséderaient par nature, et le rapport social des producteurs au travail global comme un rapport existant en dehors d'eux, entre des objets. C'est ce {violet}quiproquo{/violet} qui fait des produits des marchandises.

    **L'analogie avec la vision éclaire la différence.** L'impression lumineuse d'une chose sur le nerf optique se donne comme forme objective d'une chose hors de l'œil, et il y a là {yellow}un rapport physique entre des choses physiques{/yellow}. Mais le rapport de valeur {red}n'a rien à voir avec la nature physique des marchandises{/red} : {coral}c'est seulement le rapport social déterminé des hommes eux-mêmes qui prend ici pour eux la forme fantasmagorique d'un rapport entre choses{/coral}. Pour trouver une analogie, il faut aller du côté du monde religieux, où les produits du cerveau semblent des figures autonomes douées d'une vie propre. Marx l'appelle {violet}le fétichisme{/violet}, qui {amber}adhère aux produits du travail dès qu'ils sont produits comme marchandises{/amber} et est donc {coral}inséparable de la production marchande{/coral}.

    Fischbach insiste sur ce que le texte ne dit pas : le fétichisme n'est pas la {red}réification{/red}, car ce ne sont pas les personnes qui deviennent des choses ; ce sont {coral}des relations entre personnes qui prennent la forme de relations entre choses{/coral}, et c'est aux choses que revient l'initiative : ce sont elles qui {yellow}mènent la danse{/yellow}.

    ! Le fétichisme ne consiste pas à traiter les personnes comme des choses : c'est un rapport entre personnes qui prend la forme d'un rapport entre choses.
  passage:
    label: "§116-117"
    text: "D'où provient donc le caractère énigmatique du produit du travail dès qu'il prend la forme-marchandise ? Manifestement de cette forme même. L'égalité des travaux humains prend la forme matérielle de l'objectalité de valeur égale des produits du travail. La mesure de la dépense de force de travail humaine par sa durée prend la forme de grandeur de valeur des produits du travail. Enfin les rapports des producteurs dans lesquels sont pratiquées ces déterminations sociales de leurs travaux prennent la forme d'un rapport social entre les produits du travail. Ce qu'il y a de mystérieux dans la forme-marchandise consiste donc simplement en ceci qu'elle renvoie aux hommes l'image des caractères sociaux de leur propre travail comme des caractères objectifs des produits du travail eux-mêmes, comme des qualités sociales que ces choses posséderaient par nature : elle leur renvoie ainsi l'image du rapport social des producteurs au travail global, comme un rapport social existant en dehors d'eux, entre des objets. C'est ce quiproquo qui fait que les produits du travail deviennent des marchandises, des choses sensibles suprasensibles, des choses sociales. De la même façon, l'impression lumineuse d'une chose sur le nerf optique ne se donne pas comme l'excitation du nerf optique proprement dit, mais comme forme objective d'une chose à l'extérieur de l'œil. Simplement, dans la vision il y a effectivement de la lumière qui est projetée d'une chose, l'objet extérieur, vers une autre, l'œil. C'est un rapport physique entre des choses physiques. Tandis que la forme-marchandise et le rapport de valeur des produits du travail dans lequel elle s'expose n'ont absolument rien à voir ni avec sa nature physique ni avec les relations matérielles qui en résultent. C'est seulement le rapport social déterminé des hommes eux-mêmes qui prend ici pour eux la forme fantasmagorique d'un rapport entre choses. Si bien que pour trouver une analogie nous devons nous échapper vers les zones nébuleuses du monde religieux. Dans ce monde-là, les produits du cerveau humain semblent être des figures autonomes, douées d'une vie propre, entretenant des rapports les unes avec les autres et avec les humains. Ainsi en va-t-il dans le monde marchand des produits de la main humaine. J'appelle cela le fétichisme, fétichisme qui adhère aux produits du travail dès lors qu'ils sont produits comme marchandises, et qui, partant, est inséparable de la production marchande."
  points:
