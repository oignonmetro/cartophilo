- id: n1867-p3
  title: "Les travaux privés ne se socialisent que par l'échange"
  notes: |-
    **Le caractère fétiche du monde des marchandises provient du {coral}caractère social propre du travail qui produit des marchandises{/coral}.** Des objets d'usage deviennent marchandises {amber}parce qu'ils sont les produits de {violet}travaux privés{/violet} menés indépendamment les uns des autres{/amber}, et l'ensemble de ces travaux privés forme le {violet}travail social global{/violet}.

    **Comme les producteurs ne sont pas en contact social avant l'échange**, le caractère social de leurs travaux privés n'apparaît que dans l'échange : c'est {coral}à travers les relations que l'échange instaure entre les produits{/coral}, puis entre les producteurs, que les travaux privés deviennent des {amber}membres du travail social global{/amber}. La socialisation vient donc {red}après coup{/red}, par les choses échangées, jamais en amont. Fischbach en tire que toute coordination préalable de la production (une planification) est exclue sous le capitalisme.

    **C'est pourquoi les relations sociales entre les travaux privés apparaissent {coral}aux producteurs pour ce qu'elles sont{/coral}** : non comme {red}rapports immédiatement sociaux entre les personnes dans leur travail même{/red}, mais comme {coral}rapports impersonnels entre des personnes et rapports sociaux entre des choses impersonnelles{/coral}. Fischbach en conclut que le fétichisme n'est pas une affaire d'illusion : ce que les producteurs voient est vrai, leurs rapports sociaux sont bien des rapports entre choses.

    ! Le fétichisme n'est pas une erreur de perception : c'est la forme réelle de la socialisation par l'échange.
  passage:
    label: "§118-119"
    text: "Ce caractère fétiche du monde des marchandises, notre précédente analyse vient de nous le montrer, provient du caractère social propre du travail qui produit des marchandises. Des objets d'usage deviennent uniquement marchandises parce qu'ils sont les produits de travaux privés menés indépendamment les uns des autres. Le complexe de tous les travaux privés constitue le travail social global. Étant donné que les producteurs n'entrent en contact social que parce que et à partir du moment où ils échangent les produits de leur travail, les caractères spécifiquement sociaux de leurs travaux privés n'apparaissent eux-mêmes également que dans cet échange. Autrement dit : c'est seulement à travers les relations que l'échange instaure entre les produits du travail, et, par leur entremise, entre les producteurs, que les travaux privés deviennent effectivement, en acte, des membres du travail social global. C'est pourquoi les relations sociales qu'entretiennent leurs travaux privés apparaissent aux producteurs pour ce qu'elles sont, c'est-à-dire non pas comme des rapports immédiatement sociaux entre les personnes dans leur travail même, mais au contraire comme rapports impersonnels entre des personnes et rapports sociaux entre des choses impersonnelles."
