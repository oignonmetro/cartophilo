- id: n1867-p5
  title: "Le Moyen Âge : des rapports personnels transparents"
  notes: |-
    **Au Moyen Âge européen, il n'y a pas de fétichisme, parce que les rapports sociaux sont des {coral}rapports personnels de dépendance{/coral}.** À l'homme indépendant de Robinson succède {amber}la dépendance généralisée{/amber} : serfs et seigneurs, vassaux et suzerains, laïcs et clercs. Comme ce sont ces rapports personnels qui forment {amber}la base sociale existante{/amber}, les travaux et les produits {red}n'ont pas besoin de prendre une figure fantastique{/red} distincte de leur réalité : ils entrent comme services et prestations en nature dans les rouages sociaux.

    **La forme sociale du travail est ici sa {violet}particularité{/violet}**, la forme de service « en nature », {red}et non son universalité{/red} comme dans la production marchande. Le travail de la corvée se mesure par le temps comme celui qui produit des marchandises, mais {yellow}tout serf sait{/yellow} que c'est une quantité déterminée de sa force de travail personnelle qu'il dépense pour son seigneur, et {yellow}la dîme est plus claire que la bénédiction{/yellow} du curé.

    **Quel que soit le jugement sur les « masques » que les hommes y portent**, les rapports sociaux qu'ils ont entre eux dans leurs travaux {coral}apparaissent comme leurs propres rapports personnels{/coral}, et ne sont pas déguisés en rapports sociaux entre des choses. Fischbach précise que le rapport de dépendance se traduit tel quel dans la corvée, et que la corvée est comprise comme une prestation due au seigneur en raison du rapport de subordination du serf.

    ! La transparence féodale ne signifie pas que le rapport est juste ou libre : elle signifie seulement que le rapport social n'est pas déguisé en rapport entre choses.
  passage:
    label: "§126"
    text: "Quittons maintenant la lumineuse clarté de l'île de Robinson pour nous transporter dans les ténèbres obscures du Moyen Âge européen. Au lieu de cet homme indépendant nous y trouvons la dépendance généralisée : des serfs et des seigneurs, des vassaux et des suzerains, les laïcs et des clercs. La dépendance personnelle caractérise aussi bien les rapports sociaux de la production matérielle que les autres sphères de la vie qui s'édifient sur sa base. Mais précisément, comme ce sont ces rapports personnels de dépendance qui constituent la base sociale existante, les travaux et les produits n'ont pas besoin de prendre une figure fantastique distincte de leur réalité. Ils entrent comme autant de services en nature et de prestations en nature dans les rouages sociaux. C'est la forme de service « en nature » du travail, c'est donc sa particularité et non son universalité, comme c'est le cas sur la base de la production marchande, qui en est ici la forme immédiatement sociale. On mesure aussi bien par le temps le travail de la corvée que le travail qui produit les marchandises, mais tout serf sait que c'est une quantité déterminée de sa propre force de travail personnelle qu'il dépense au service de son seigneur. La dîme qu'il faut fournir au curé est plus claire que sa bénédiction. Quel que soit donc le jugement qu'on porte sur les masques sous lesquels les hommes ici se font face, les rapports sociaux que les personnes ont entre elles dans leurs travaux y apparaissent du moins comme leurs propres rapports personnels, et ne sont pas déguisés en rapports sociaux des choses, des produits du travail."
