- id: n1867-p6
  title: "L'association d'hommes libres : une transparence planifiée"
  notes: |-
    **Dans une association d'hommes libres, les rapports sont transparents, mais pour une autre raison que dans la féodalité.** Marx la fait suivre de Robinson : {amber}toutes les déterminations du travail de Robinson se répètent{/amber}, de manière {coral}sociale et non plus individuelle{/coral}. Les producteurs travaillent avec des {violet}moyens de production collectifs{/violet} et dépensent {amber}consciemment{/amber} leurs forces de travail individuelles comme {coral}une seule force de travail sociale{/coral}. Le produit global est un produit social, dont une partie sert de moyen de production et dont l'autre est partagée selon une modalité qui change avec l'organisme de production et son développement historique.

    **Pour le parallèle avec la production marchande**, Marx suppose que la part de chacun soit déterminée par son temps de travail. Ce temps joue alors {violet}un rôle double{/violet} : sa répartition {coral}socialement planifiée{/coral} règle la proportion des fonctions de travail sur les besoins, et il mesure la participation individuelle au travail commun et à la part consommable du produit.

    **Les relations sociales des hommes avec leurs travaux et leurs produits demeurent ainsi {coral}d'une simplicité transparente{/coral}**, dans la production comme dans la distribution. Fischbach souligne la différence avec la féodalité : ici les hommes décident librement et collectivement de l'organisation de leur travail, et c'est pourquoi son caractère social leur est immédiatement accessible, par un accès directement politique, que le capitalisme rend impossible.

    ! La transparence de l'association ne tient pas à la dépendance personnelle, mais à un contrôle conscient et collectif de la production.
  passage:
    label: "§128"
    text: "Représentons-nous enfin, pour changer, une association d'hommes libres, travaillant avec des moyens de production collectifs et dépensant consciemment leurs nombreuses forces de travail individuelles comme une seule force de travail sociale. Toutes les déterminations du travail de Robinson se répètent ici, mais de manière sociale et non plus individuelle. Tous les produits de Robinson étaient son produit personnel exclusif, et donc immédiatement pour lui des objets d'usage. Le produit global de l'association est un produit social. Une partie de ce produit ressert comme moyen de production. Elle demeure sociale. Mais une autre partie est consommée comme moyen d'existence par les membres de l'association. Elle doit être partagée entre eux. Ce partage se fera selon une modalité qui change avec chaque modalité particulière de l'organisme de production sociale lui-même, et avec le niveau de développement historique correspondant atteint par les producteurs. Supposons, simplement pour établir le parallèle avec la production marchande, que la part de moyens d'existence qui revient à chaque producteur soit déterminée par son temps de travail. Le temps de travail jouerait alors un rôle double. D'un côté, sa répartition socialement planifiée règle la juste proportion des diverses fonctions de travail sur les différents besoins. D'autre part, le temps de travail sert en même temps à mesurer la participation individuelle du producteur au travail commun, et aussi, par voie de conséquence, à la part individuellement consommable du produit commun. Les relations sociales existant entre les hommes et leurs travaux, entre les hommes et les produits de leurs travaux, demeurent ici d'une simplicité transparente tant dans la production que dans la distribution."
  points:
