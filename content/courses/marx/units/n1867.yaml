- id: n1867-i2
  title: "Singularité, particularité, universalité : féodalité et capitalisme"
  notes: |-
    **Fischbach lit la section avec trois concepts hégéliens : {violet}la singularité{/violet}, {violet}la particularité{/violet} et {violet}l'universalité{/violet}.** Il part de l'exemple de la féodalité, puis de la *Contribution à la critique de l'économie politique* (1859), où Marx est, dit-il, plus clair qu'en 1867. Dans une communauté, comme la famille paysanne, le travail est {amber}singulier{/amber} (celui de tel homme, de telle femme), mais n'est {red}pas privé{/red} : les travaux, qualitativement distincts et complémentaires, {coral}relient entre eux{/coral} ceux qui les accomplissent. C'est la {violet}particularité{/violet} du travail qui y fait le lien social.

    **Sous le capitalisme, deux transformations changent tout** : {coral}les communautés naturelles sont dissoutes{/coral}, et {coral}on fait systématiquement abstraction de la particularité qualitative des travaux{/coral}. Reste alors le travail de l'individu isolé, {amber}singularisé{/amber}, et ce que tous les travaux ont de commun : une quantité de force de travail humaine abstraite. C'est cette {violet}universalité abstraite{/violet} qui socialise, par le produit en tant que porteur de valeur.

    | | Féodalité, famille paysanne | Capitalisme |
    | Ce qui lie les travaux | leur particularité, qualitative et complémentaire | l'universalité abstraite de la valeur, quantitative |
    | Statut du travail | singulier, mais non privé : fonction d'un membre de la communauté | singulier et privé : travail d'un individu isolé |
    | Socialisation | directe, par la communauté | indirecte, par l'échange des produits |
    | Rapports sociaux | transparents | cachés sous des rapports entre choses |

    **Le capitalisme garde donc le singulier (l'isolement) et l'universel (l'abstraction), et {red}supprime la particularité{/red}**, donc le plan qualitatif. Pour Fischbach, c'est ce plan que Marx veut retrouver, dans son unité avec le singulier et l'universel.

    ! La socialisation indirecte n'est pas une illusion : les producteurs voient leurs rapports sociaux pour ce qu'ils sont, des rapports entre choses.
