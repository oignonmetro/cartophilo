    fragment: "1/4"
    sentence: "« Représentons-nous enfin, pour changer, ___, travaillant avec ___ et dépensant consciemment leurs nombreuses forces de travail individuelles comme une seule force de travail sociale. Toutes les déterminations du travail de Robinson se répètent ici, mais de manière sociale et non plus individuelle. Tous les produits de Robinson étaient son produit personnel exclusif, et donc immédiatement pour lui des objets d'usage. Le produit global de l'association est un produit social. »"
