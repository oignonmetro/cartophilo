# Unité de texte (voir content/textes.md) : Marx, *Le Capital*, livre I,
# chapitre 1, section 4, « Le caractère fétiche de la marchandise et son
# secret » (§114 à §128), d'après la traduction de Jean-Pierre Lefebvre (PUF)
# que cite Fischbach (PDF Cairn fourni par l'utilisateur ; les repères de page
# [83-84] et [89] du PDF sont ceux que Fischbach donne pour « travaux privés »
# et pour le serf et la dîme). Les numéros de paragraphe sont ceux du PDF ; les
# appels de note et les repères de page sont retirés. Le commentaire est celui
# de Fischbach dans la conférence « Philosophies de Marx ».

id: n1867
title: "Le caractère fétiche de la marchandise et son secret"
subtitle: "Le Capital, livre I, chapitre 1, section 4"
icon: page
color: coral
intro: |-
  Dernière section du premier chapitre du livre I du *Capital*. Marx y répond à la question : d'où vient le caractère énigmatique du produit du travail dès qu'il prend la forme de marchandise ? Il l'explique par la **forme-marchandise** elle-même, qui fait apparaître le rapport social des producteurs comme un rapport entre choses, puis l'oppose aux formes de production **transparentes** (la féodalité, l'association d'hommes libres). Fischbach y voit un exemple de l'usage critique de la dialectique contre l'économie politique.
lessons:
- id: n1867-i1
  title: "Le fétichisme de la marchandise : l'enjeu et le plan"
  notes: |-
    La section 4 du chapitre 1 du livre I du *Capital*, {violet}« Le caractère fétiche de la marchandise et son secret »{/violet}, est la dernière du chapitre, et une des plus difficiles. {sky}Fischbach{/sky} la prend pour exemple de l'usage que {sky}Marx{/sky} fait de la philosophie : d'une {violet}dialectique{/violet} d'origine hégélienne, employée comme outil critique contre l'économie politique, c'est-à-dire pour « révolutionner une science » (lettre à Kugelmann du 28 décembre 1862, citée par Fischbach).

    **Le texte répond à une question : d'où vient le {amber}caractère énigmatique du produit du travail{/amber} dès qu'il prend la forme-marchandise ?** Il écarte deux réponses (ni la valeur d'usage, ni le contenu des déterminations de valeur) et répond : {coral}de la forme-marchandise elle-même{/coral}, qui fait apparaître {coral}le caractère social du travail comme un caractère objectif des produits{/coral}. Voici le plan de la section :

    | Mouvement | Lieu | Ce qui s'y joue |
    | montrer que la marchandise est une chose sensible suprasensible | §114-115 | Le mystère de la marchandise ne vient ni de sa valeur d'usage ni du contenu des déterminations de valeur. |
    | le rapporter à la forme-marchandise et nommer le fétichisme | §116-118 | La forme-marchandise renvoie aux hommes le caractère social de leur travail comme caractère des choses : c'est le fétichisme, inséparable de la production marchande. |
    | l'expliquer par les travaux privés indépendants | §119-122 | Les producteurs n'entrent en contact social que par l'échange : leurs rapports sociaux leur apparaissent comme des rapports entre choses, et la valeur est un hiéroglyphe social. |
    | l'opposer aux formes de production transparentes | §123-129 | Robinson, le Moyen Âge, la famille paysanne et l'association d'hommes libres n'ont pas de fétichisme, car les rapports y sont transparents. |
    | en tirer les conséquences pour l'économie politique | §130-136 | L'économie politique prend les formes de la valeur pour des nécessités naturelles et reste prise dans le fétichisme. |

    L'unité cite six passages : le début (§114), le cœur de la thèse (§116-117, §118-119, §121), et les deux modèles de transparence, la féodalité (§126) et l'association d'hommes libres (§128).

    ! Le mystère de la marchandise ne vient pas de ce qu'elle est utile, ni du travail qu'elle contient : il vient de la forme sociale que prennent les produits du travail.
