- id: n1867-o1
  title: "Fétichisme, économie politique et religion"
  notes: |-
    **Les formes du fétichisme sont celles de l'économie bourgeoise.** Marx dit des catégories de l'économie politique que ce sont des formes de pensée qui ont {coral}une validité sociale, donc une objectivité{/coral}, pour les rapports de production de la production marchande, mode de production historiquement déterminé (§124). L'{violet}économie politique{/violet} a analysé la valeur et sa grandeur, mais {red}n'a jamais demandé pourquoi ce contenu prend cette forme{/red} (§130). Elle traite les formes prébourgeoises comme les Pères de l'Église traitent les religions préchrétiennes (§131), et reste prise dans le fétichisme : le {violet}monétarisme{/violet} n'a pas vu que l'or et l'argent représentent {amber}un rapport social de production{/amber} sous la forme de choses naturelles, et l'économie moderne retrouve son propre fétichisme dès qu'elle traite du capital (§133).

    **La religion offre l'analogie, et pas seulement l'image.** Pour une société de producteurs de marchandises, le {violet}christianisme{/violet}, avec son culte de l'homme abstrait, est « la forme de religion la plus appropriée » (§129). Le reflet religieux du monde réel ne disparaîtra que lorsque les rapports de la vie pratique représenteront pour les hommes des relations rationnelles entre eux et avec la nature, et que la production sera soumise à leur contrôle conscient.

    **Chez Fischbach, tout cela sert un propos de méthode** : c'est l'usage philosophique de la dialectique, ici de la singularité, de la particularité et de l'universalité, qui rend possible la critique de l'économie politique. Sous le capitalisme, {coral}la valeur d'usage régresse et la valeur d'échange devient dominante{/coral}, parce que la production vise l'accumulation de la valeur, non la satisfaction des besoins.

    ! Le fétichisme ne disparaît pas avec sa découverte : il tient aux rapports de production, et pas seulement à la façon dont on les pense.
  passage:
    label: "Prolongement"
  points:
  - id: n1867-o1-1
