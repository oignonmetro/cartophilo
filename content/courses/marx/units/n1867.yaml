- id: n1867-p1
  title: "La marchandise, une chose sensible suprasensible"
  notes: |-
    **Une marchandise paraît une chose ordinaire, mais elle est {coral}pleine de subtilités métaphysiques et de lubies théologiques{/coral}.** {sky}Marx{/sky} distingue deux moments de la même chose. Tant qu'elle est {violet}valeur d'usage{/violet}, qu'on la considère par ses propriétés utiles ou par le travail qui les lui donne, elle ne comporte {green}rien de mystérieux{/green} : l'homme modifie la forme des matières naturelles d'une façon utile, et {yellow}la table reste du bois{/yellow}. Mais {amber}dès qu'elle entre en scène comme marchandise{/amber}, elle devient {violet}une chose sensible suprasensible{/violet}.

    **L'image est celle d'une table qui prend vie** : elle ne tient plus debout sur ses pieds, elle {yellow}se met sur la tête{/yellow}, face aux autres marchandises, et en sort {yellow}des chimères{/yellow} plus surprenantes que si elle se mettait à danser. Marx ne dit pas encore d'où vient ce changement : il pose seulement qu'il n'est pas dans la chose (la table reste du bois), mais dans le fait qu'elle soit une marchandise.

    ! Le mystère n'est pas dans la matière de la table, ni dans son utilité : il naît de sa forme de marchandise.
  passage:
    label: "§114"
    text: "À première vue, une marchandise semble une chose tout ordinaire qui se comprend d'elle-même. On constate en l'analysant que c'est une chose extrêmement embrouillée, pleine de subtilités métaphysiques et de lubies théologiques. Tant qu'elle est valeur d'usage, elle ne comporte rien de mystérieux, soit que je la considère du point de vue des propriétés par où elle satisfait des besoins humains, ou du point de vue du travail humain qui la produit et lui confère ainsi ces propriétés. Il tombe sous le sens que l'homme modifie par son activité les formes des matières naturelles d'une façon qui lui est utile. La forme du bois, par exemple, est modifiée quand on en fait une table. La table n'en reste pas moins du bois, chose sensible ordinaire. Mais, dès qu'elle entre en scène comme marchandise, elle se transforme en une chose sensible suprasensible. Elle ne tient plus seulement debout en ayant les pieds sur terre, mais elle se met sur la tête, face à toutes les autres marchandises, et sort de sa petite tête de bois toute une série de chimères qui nous surprennent plus encore que si, sans rien demander à personne, elle se mettait soudain à danser."
