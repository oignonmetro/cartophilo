- id: n1867-p4
  title: "La valeur, un hiéroglyphe social"
  notes: |-
    **Ce n'est pas parce que les produits ne vaudraient que comme enveloppes d'un travail humain que les hommes les posent comme valeurs : {coral}c'est l'inverse{/coral}.** C'est en posant dans l'échange leurs produits comme égaux à titre de valeurs qu'ils posent leurs travaux différents comme égaux à titre de travail humain, et {amber}ils ne le savent pas, mais ils le font pratiquement{/amber}. L'abstraction du travail humain n'est pas une opération de la conscience : elle est faite dans la pratique de l'échange.

    **La valeur n'a donc pas écrit sur le front ce qu'elle est : elle fait de tout produit du travail {violet}un hiéroglyphe social{/violet}.** Les hommes cherchent ensuite à le déchiffrer, à percer le secret de leur propre produit social, qui est leur production sociale {yellow}au même titre que le langage{/yellow}.

    **Même la découverte scientifique que la valeur exprime un travail humain n'en dissipe pas l'apparence.** Elle a fait date dans l'histoire de l'humanité, mais l'apparence d'objet des caractères sociaux du travail demeure, comme {yellow}la forme-air subsiste malgré la décomposition scientifique de l'air{/yellow}. Pour les gens prisonniers des rapports de la production marchande, cette forme paraît {coral}indépassable{/coral}, alors qu'elle ne vaut que {red}relativement{/red}, pour cette forme de production particulière.

    ! Comprendre le secret de la valeur ne suffit pas à supprimer le fétichisme : il demeure aussi longtemps que subsistent les rapports de production qui le produisent.
  passage:
    label: "§121"
    text: "Ce n'est donc pas parce que les produits de leur travail ne vaudraient pour eux que comme enveloppes matérielles d'un travail humain indifférencié que les hommes établissent des relations mutuelles de valeur entre ces choses. C'est l'inverse. C'est en posant dans l'échange leurs divers produits comme égaux à titre de valeurs qu'ils posent leurs travaux différents comme égaux entre eux à titre de travail humain. Ils ne le savent pas, mais ils le font pratiquement. La valeur ne porte donc pas écrit sur le front ce qu'elle est. La valeur transforme au contraire tout produit du travail en hiéroglyphe social. Par la suite, les hommes cherchent à déchiffrer le sens du hiéroglyphe, à percer le secret de leur propre produit social, car la détermination des objets d'usage comme valeurs est leur propre production sociale, au même titre que le langage. Certes, la découverte tardive par la science que les produits du travail, dans la mesure où ils sont valeurs, ne font qu'exprimer sous forme de choses un travail humain dépensé à les produire est une découverte qui a fait date dans l'histoire du développement de l'humanité, mais elle n'a dissipé en rien l'apparence d'objet qu'ont les caractères sociaux du travail. Le fait que le caractère spécifiquement social de travaux privés indépendants les uns des autres consiste en leur égalité en tant que travail humain, et prenne la forme du caractère de valeur des produits du travail, ne vaut que relativement, pour cette forme de production particulière qu'est la production marchande. Mais, aussi bien après qu'avant cette découverte, il apparaît à des gens qui sont prisonniers des rapports de la production marchande comme quelque chose d'indépassable, exactement comme la décomposition scientifique de l'air en ses éléments n'a pas empêché la forme-air de subsister comme forme d'un corps physique."
