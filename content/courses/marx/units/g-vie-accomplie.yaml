  points:
  - id: g-vie-accomplie-l1-q1
    sentence: "__L'activité par laquelle un individu exerce et développe ses propres facultés__, Marx l'appelle en 1845 la **manifestation de soi**, en allemand ___."
    answer: Selbstbetätigung
    alt: ["Selbstbetatigung", "selbstbetätigung"]
  - id: g-vie-accomplie-l1-a1
    sentence: "__Pourquoi chacun ne peut-il sortir de son cercle d'activités ?__ Parce que, sous la **division du travail**, il ne vit que de sa ___."
    answer: fonction
    alt: ["profession", "spécialité"]
  - id: g-vie-accomplie-l1-a2
    sentence: "__« Chasser le matin, pêcher l'après-midi » n'est pas un programme champêtre__ : la phrase dit qu'une activité n'a pas à devenir une ___."
    answer: identité
    alt: ["identite"]
  - id: g-vie-accomplie-l1-q4
    sentence: "__Sous le capital, les moyens de développer la production__ « mutilent le **travailleur** jusqu'à en faire un homme ___, le dégradent au rang d'accessoire annexe de la machine » (Le Capital, livre I, chap. XXIII)."
    answer: partiel
    alt: []
  - id: g-vie-accomplie-l1-b2
    sentence: "__Pourquoi s'approprier les **forces productives** développe-t-il les individus ?__ Parce que « l'appropriation d'une totalité d'instruments de production est déjà le développement d'une totalité de ___ »."
    answer: facultés
    alt: ["facultes"]
  - id: g-vie-accomplie-l1-a4
    sentence: "__Pourquoi seuls des individus unis peuvent-ils s'approprier les **forces productives** ?__ Parce qu'elles sont le travail combiné de tous, donc des forces ___."
    answer: sociales
    alt: []
  - id: g-vie-accomplie-l1-q5
    sentence: "__Quand ils s'approprient ensemble les forces productives__, « la manifestation de soi coïncide avec la vie matérielle, ce qui correspond à la transformation des **individus** en individus ___ »."
    answer: complets
    alt: []
  - id: g-vie-accomplie-l1-b3
    sentence: "__Une **vie accomplie** n'est pas une vie qui s'évade du travail__, mais une vie dont le travail même est l'___ de soi."
    answer: exercice
    alt: []
  - id: g-vie-accomplie-l1-a5
    sentence: "Contre Smith : __surmonter des obstacles est une **activité de la liberté**__ quand les buts sont posés comme des buts que ___ lui-même fixe."
    answer: l'individu
    alt: ["individu"]
  - id: g-vie-accomplie-l1-a6
    sentence: "Contre Fourier, pour qui le **travail libéré** deviendrait un jeu : __les travaux effectivement libres requièrent__ « un sacré ___ et l'effort le plus intense » (Grundrisse)."
    answer: sérieux
    alt: ["serieux"]
  - id: g-vie-accomplie-l1-a7
    sentence: "__Un **travail scientifique**, selon les Grundrisse, est l'effort de l'homme__ non en tant que force de la nature ___, mais comme activité qui règle toutes les forces de la nature."
    answer: dressée
    alt: ["dressee"]
  - id: g-vie-accomplie-l1-b4
    sentence: "__La **vie accomplie** a deux lieux, selon le Capital, livre III__ : le temps libéré, et le ___ transformé."
    answer: travail
    alt: []
  - id: g-vie-accomplie-l1-q6
    sentence: "__Marx ne dessine pas une société idéale__ : « nous appelons **communisme** le mouvement ___ qui abolit l'état actuel » (L'Idéologie allemande)."
    answer: réel
    alt: ["reel"]
  - id: g-vie-accomplie-l1-a8
    sentence: "__Pourquoi la grande industrie rend-elle nécessaire l'**individu complet** ?__ Parce qu'elle change sans cesse sa base ___ et rejette les ouvriers d'une branche dans l'autre."
    answer: technique
    alt: []
  - id: g-vie-accomplie-l1-a9
    sentence: "__Ce qui distingue la polyvalence de l'**individu complet** de la mobilité subie sous le capital__ : la ___ du passage d'une activité à l'autre."
    answer: maîtrise
    alt: ["maitrise"]
  - id: g-vie-accomplie-l1-b5
    sentence: "__Le capital se contredit__ : il rend nécessaire le travailleur polyvalent, et continue de le ___."
    answer: mutiler
    alt: []
  - id: g-vie-accomplie-l1-b6
    sentence: "__La société accomplie ne vise pas l'égalité uniforme__, parce qu'un droit égal applique une même ___ à des individus inégaux."
    answer: mesure
    alt: []
  - id: g-vie-accomplie-l1-c1
    sentence: "__Première condition du **travail libre** selon les Grundrisse__ : que son caractère ___ soit posé, et non que ses buts soient fixés par celui qui paie le salaire."
    answer: social
    alt: []
