id: ali7
title: "Le travail pour le capital"
subtitle: "L'abolition de la séparation n'a lieu que pour le capital ; le travailleur et le travail, séparés avant le procès"
icon: compass
color: teal
group: "Le travail et le capital dans les Grundrisse"
lessons:
- id: ali7-l1
  title: "Une abolition qui a lieu pour le capital"
  notes: |-
    **L'abolition de la séparation entre la capacité de travail et ses conditions n'a pas lieu pour le travailleur, mais pour le capital : l'usage que celui-ci fait de la capacité qu'il a achetée.**

    **Une apparence trompeuse.** On est d'abord porté à croire que le travailleur, dans l'acte de travail vivant, {red}éprouve{/red} la suppression de la séparation entre sa force abstraite et les conditions de sa mise en œuvre. C'est ignorer que le procès de production est toujours en même temps {violet}le procès de valorisation du capital{/violet}.

    **Le travail est une valeur d'usage pour le capital.** Marx le dit : {teal}« {/teal}En tant que valeur d'usage, le travail {teal}appartient au capitaliste »{/teal} (III-40), et {teal}« {/teal}Le travail n'existe {teal}pas comme valeur d'usage pour le travailleur{/teal} ; il n'existe, par conséquent, pas pour lui comme {teal}force productrice de richesse{/teal}, comme moyen ou comme {teal}activité d'enrichissement »{/teal} (III-14).

    **Pourquoi.** Le capital a déjà acheté la capacité de travail, le travail comme capacité abstraite et subjective. Il l'a ainsi incorporée à lui-même, comme {amber}une composante parmi d'autres{/amber}, à côté de la matière et des instruments. En l'achetant, il a aussi acheté {amber}l'usage futur{/amber} de cette capacité. Si la séparation est ensuite abolie dans l'acte de travail, cette abolition s'identifie à l'usage même que le capital fait de la capacité de travail : le travail est une valeur d'usage pour lui, {coral}au même titre que la matière et les instruments{/coral}.

    **La relation « naturelle » est déjà un moment du capital.** Dans le procès de production simple, dit Marx, « le travail vivant y est posé dans sa relation naturelle à ses moments d'existence matériels » (III-40) [le mot est entre guillemets chez Marx : {blue}*naturgemäße Beziehung*{/blue}, relation conforme à la nature]. Utiliser des instruments pour donner forme à une matière, et faire de ce matériau le mode d'existence objectif du travail vivant, est bien conforme à la nature du travail. Mais « pour autant que le travail vivant entre dans cette relation, celle-ci n'existe pas pour lui-même, mais pour le capital ; elle est elle-même déjà un moment du capital » (III-40).

    **La dénaturation a lieu en amont.** Même quand l'acte de travail paraît conforme à la nature, la {red}dénaturation{/red} a déjà eu lieu avant le procès de production. Les conditions du procès capitaliste défont, au moment même où il le fait, ce qu'accomplit le travail vivant ; elles l'ont même défait par avance.

    ! L'acte de travail vivant reste conforme à la nature du travail : ce qui le dénature, c'est qu'il n'existe pas pour le travailleur.
