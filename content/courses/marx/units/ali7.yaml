- id: ali7-l2
  title: "Le travailleur et le travail : la séparation préalable"
  notes: |-
    **Le capital détermine à l'avance le rapport du travailleur à sa propre activité : il le sépare de son travail avant même le procès de production.**

    **Un rapport qui n'est pas naturel.** Marx écrit : {teal}« {/teal}Le simple fait que, face au capital, {teal}le travail apparaisse comme sujet{/teal}, c'est-à-dire que le travailleur n'apparaisse que dans la détermination du travail – celui-ci n'étant pas le travailleur lui-même – devrait ouvrir les yeux. Il y a déjà là, abstraction faite du capital, une relation, un rapport du travailleur à {teal}sa propre activité{/teal} qui n'est {teal}pas du tout le rapport “naturel”{/teal}, mais contient déjà lui-même une {teal}détermination économique spécifique. »{/teal} (III-16). Face au capital n'apparaît pas {violet}le travailleur{/violet}, individu vivant, doté de forces physiques et mentales réelles, mais {violet}le travail{/violet}, capacité abstraite : voilà ce qui est socialement construit. Le rapport naturel serait de se rapporter à son activité {amber}dans l'acte même de la mettre en œuvre{/amber}, non comme à une pure puissance en amont de l'actualisation.

    **Un rapport social, historique.** Que le sujet soit le travail et que l'individu n'en soit que le support : c'est {coral}le capital lui-même, en tant que rapport social{/coral}. Ce rapport se réalise comme {violet}séparation, abstraction et renversement{/violet}. Cette leçon traite le premier aspect, l'unité suivante le deuxième ; le troisième viendra ensuite.

    **La séparation.** Le lien de continuité entre le travailleur et son activité est rompu : ni affirmation, ni confirmation, ni activation, ni expression de soi, comme disaient déjà les *Manuscrits de 1844*. Le travailleur ne va pas au procès de production comme vers le lieu de son autoréalisation, mais {red}en simple possesseur d'une capacité abstraite de travail{/red}, qu'il a mais qu'il n'est pas. Il faut que cette séparation soit déjà accomplie pour qu'il puisse y entrer : « ce procès nécessaire consistant à poser les propres forces du travail comme étrangères au travailleur » (III-16) [{blue}*fremde*{/blue}].

    **Une scission intime.** Le travailleur est séparé de lui-même : d'un côté son existence individuelle, objective, concrète, d'être vivant et incarné ; de l'autre son essence interne, subjective et abstraite, le {violet}travail{/violet}, pure aptitude à travailler. Ce vocabulaire est feuerbachien : pour {sky}Feuerbach{/sky}, la séparation de l'existence individuelle et de l'essence générique, qui compense la finitude individuelle, est un ressort de l'aliénation religieuse.

    **Ce que le capital achète.** Il n'achète pas le travailleur, l'individu réellement existant : ce serait {red}l'esclavage{/red}, un autre mode de production. Il achète {amber}l'actualisation d'une puissance{/amber}, la réalisation d'une essence : la mise en œuvre de la capacité qui caractérise essentiellement tout travailleur.

    ! Les *Grundrisse* sont un texte plus philosophique que le livre I du *Capital* : Marx a travaillé pendant dix ans à en réduire l'aspect philosophique pour être lu du plus grand nombre.
