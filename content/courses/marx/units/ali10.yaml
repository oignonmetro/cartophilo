- id: ali10-l4
  title: "Le travail, ferment du capital"
  notes: |-
    **Contre du travail mort, le capital capte une source de vie : le travail, non-valeur tant qu'il est séparé, devient, mis en contact avec le capital, la source de toute valeur.**

    **Une vie contre du mort.** Le capital n'est rien d'autre que du travail objectivé, accumulé. Il cherche une source de mouvement, de vie, et la trouve dans le travail vivant, qu'il capte {amber}contre du travail mort{/amber}, c'est-à-dire contre quelque chose qui, comparé à lui, est en un sens philosophique, presque métaphysique, sans grande valeur. Marx dit du travail qu'il est à la fois la non-valeur et la source de toute valeur.

    **Avant le contact : simple possibilité.** Aussi longtemps qu'il fait face au capital, séparé de lui, y compris au moment de l'échange, le travail est « la simple forme abstraite, la simple possibilité de l'activité qui pose de la valeur, celle-ci existant seulement en tant que faculté, que puissance dans la corporéité du travailleur » (III-10) : du travail en général, la possibilité de tout travail particulier.

    **Après : activité posant de la valeur.** {teal}« Mais, amené par le contact avec le capital à l'activité effective – il ne peut y parvenir de lui-même puisqu'il est dépourvu d'objet – il devient une activité effective posant de la valeur, une activité productive »{/teal} (III-10) [*gegenstandslos*]. Placé par le capital en contact avec les matériaux et les instruments, il retrouve les conditions qui font de lui une activité objectivante, mais elles ne sont pas à lui. Il agit alors, dit Marx, « comme vie fécondante sur l'objectivité du capital qui ne fait qu'exister » et qui est donc {coral}une objectivité morte{/coral}.

    **Le ferment.** Le travail redevient ce qu'il est en lui-même : vie, mouvement, procès, productivité, activité créatrice. {violet}« Le travail est le ferment qui, projeté dans le capital, provoque maintenant sa fermentation »{/violet} (III-10) [*Ferment*]. Il faut pour cela qu'il se nourrisse de l'objectivité du capital, et que « soit abolie la simple subjectivité du travail comme simple forme » (*aufgehoben*) pour qu'elle soit « objectivée dans le matériau du capital ».

    **Aux conditions du capital.** Cette abolition est passagère et momentanée : elle supprime les conditions initiales (la séparation d'avec les conditions objectives), qui sont aussi celles de l'échange. Mais elle a lieu {red}aux conditions du capital et sous sa conduite{/red}, le travail étant déjà intégré à lui puisque l'appropriation a eu lieu. D'où le procès de production qui est aussitôt procès de valorisation, c'est-à-dire d'accroissement du capital.

    **L'expropriation originaire.** Instituer le travail comme simple capacité subjective est l'institution inaugurale de la modernité capitaliste : l'expropriation originaire dont parle le livre I, qui a produit une main-d'œuvre sans autre propriété que sa force de travail. L'accumulation initiale ne vient pas de l'épargne de gens vertueux, mais du vol et de l'expropriation.

    ! Dire que le travail « redevient ce qu'il est » ne veut pas dire qu'il retrouve son autonomie : c'est le capital qui le fait fermenter.
