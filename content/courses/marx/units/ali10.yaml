- id: ali10-l3
  title: "Le travail devenu étranger"
  notes: |-
    **Par l'échange, le travailleur a d'avance renoncé à la productivité de son travail : quand elle s'actualise, elle est celle du capital, et son travail lui est aussi étranger que la matière et l'instrument.**

    **La productivité du capital.** Dans le procès de production, la capacité de travail s'exprime en acte comme force effectivement productrice. Le travailleur a alors par avance renoncé non seulement aux produits, mais {red}à la productivité même de son travail{/red} : elle s'actualise comme productivité du capital. C'est ce qui fait que le procès de production est en même temps un procès de valorisation.

    **Un étranger.** Marx : l'existence de la puissance de travail vivante « comme existence seulement subjective, séparée des moments de sa réalité objective » est la condition primordiale, sans laquelle il n'y aurait pas de capitalisme. Alors « la puissance de travail se comporte à l'égard du travail vivant comme à l'égard d'un étranger, et, si le capital voulait la payer sans la faire travailler, elle accepterait parfaitement ce marché » (IV-47). Sa propre actualisation est devenue étrangère à celui qui n'est plus que propriétaire d'une faculté : elle ne le concerne plus. Seul le capitaliste y a intérêt : il a la matière, les outils, les usines, et il lui manquait seulement l'actualisation de la force de travail.

    **Tout dépend de l'échange.** La séparation d'avec les conditions objectives, puis d'avec le produit, dépend de ce qui se joue avant le procès, dans l'échange. Marx y a consacré beaucoup plus d'énergie dans les *Grundrisse* que dans *Le Capital*, qui dit la même chose plus vite. Il faut obtenir que le travailleur soit empêché de considérer l'actualisation de sa capacité comme sa propre réalisation : {teal}« Son propre travail lui est donc aussi étranger – et cela vaut également pour l'orientation de ce travail – tout aussi étranger que le matériau et l'instrument. En conséquence, le produit lui apparaît comme une combinaison de matériau d'autrui, d'instrument d'autrui et de travail d'autrui – comme propriété d'autrui »{/teal} (IV-47).

    **La problématique de 1844 est présente.** Que son propre travail lui soit étranger, comme l'instrument et le matériau, c'est la problématique de l'aliénation des *Manuscrits de 1844*, reprise et développée. Au moment où il est effectif comme travail vivant, le travail {coral}n'est plus le travail du travailleur : il est déjà celui du capital{/coral}.

    **Trois moments.** Le possible, l'être, l'activité (*Tätigkeit*, aussi *Bewegung*, mouvement). Le travailleur apporte une possibilité ; le capitaliste la traduit en être, en quelque chose de quantifiable ; ce qu'il obtient, c'est du mouvement, de l'activité, de la vie. Marx : « Face au travailleur, la productivité de son propre travail devient donc un pouvoir d'autrui, son travail en général le devient, pour autant qu'il n'est pas puissance, mais mouvement, travail effectif » (III-15) [*Vermögen*, la puissance séparée de l'actualisation ; *Bewegung*, mouvement].

    ! Que la capacité « accepterait » d'être payée sans travailler ne veut pas dire que le travailleur n'a pas envie de vivre : cela montre à quel point l'actualisation de sa force a cessé d'être la sienne.
