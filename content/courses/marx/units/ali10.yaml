id: ali10
title: "La non-proportionnalité de l'échange"
subtitle: "Valeur d'échange et valeur d'usage ; un produit contre une productivité ; le travail devenu étranger ; le travail, ferment du capital"
icon: compass
color: teal
group: "Le travail et le capital dans les Grundrisse"
lessons:
- id: ali10-l1
  title: "Un échange entre des termes qui ne se correspondent pas"
  notes: |-
    **L'échange du travailleur et du capitaliste n'est pas proportionnel : ce n'est ni un échange de deux valeurs d'échange, ni un échange de deux valeurs d'usage.**

    **Deux échanges proportionnels possibles, qu'on n'a pas ici.** Un échange proportionnel serait un échange entre deux choses équivalentes : soit deux marchandises de valeur équivalente, soit deux valeurs d'usage directes, deux choses utiles dont chacun a besoin chez l'autre. Dans le cas du travail et du capital, {red}ni l'un ni l'autre{/red}.

    **Le terme apporté et le terme obtenu.** Marx : l'échange constitutif du capital est celui « du travail objectivé en tant que valeur […] contre du travail vivant en tant que valeur d'usage de celui-ci, non pas valeur d'usage destinée à un usage ou une consommation déterminés et particuliers, mais valeur d'usage pour la valeur » (IV-49). Le travailleur apporte une marchandise ; le capitaliste obtient du travail vivant, une valeur d'usage {coral}dont l'utilité est d'augmenter la valeur{/coral}.

    **Le travail, pour le travailleur.** Dépossédé des outils, il ne peut plus mettre sa force de travail en œuvre : elle n'a plus pour lui de valeur d'usage, seulement une {violet}valeur d'échange{/violet}. Il doit la vendre, sinon il ne travaille pas : c'est la condition sans laquelle il n'y a pas de rapport capitaliste. Il reçoit un salaire, qui est une quantité de valeur lui permettant d'acquérir les valeurs d'usage nécessaires au renouvellement de sa force. Marx : {teal}« Pour le travailleur lui-même, son travail n'a de valeur d'usage que dans la mesure où il *est* valeur d'échange »{/teal} (III-15).

    **Le travail, pour le capital.** Le travail comme travail vivant n'a de valeur d'usage que pour le capital, qui le rend vivant en le mettant en contact avec la matière et les outils, et l'utilise pour {amber}valoriser le travail objectivé{/amber} qui s'y trouve, donc pour se valoriser lui-même. Il cède une valeur d'échange (une partie de lui-même, du travail mort) et obtient ce qui n'a de valeur d'usage que pour lui. D'où l'inversion : la valeur d'échange du travail est la détermination essentielle pour le travailleur, sa valeur d'usage un attribut accidentel ; pour le capital, la valeur d'usage est essentielle, la valeur d'échange accidentelle. Marx : « Pour le capital, il n'a de valeur d'échange que dans la mesure où il est valeur d'usage » (III-15).

    ! Dire que le travail est pour le travailleur une valeur d'échange ne veut pas dire qu'il vaut beaucoup : c'est qu'il ne lui sert qu'à être vendu.
