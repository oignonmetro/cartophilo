- id: ali10-l2
  title: "Un produit contre une productivité"
  notes: |-
    **Le travailleur est payé pour un travail passé, objectivé en ses facultés ; le capital acquiert, par le même échange, un travail à venir : sa force créatrice. L'échange passe du possible au réel, du quantitatif au qualitatif, du passé à l'avenir.**

    **Ce que le travailleur vend : du travail déjà objectivé.** Sa force de travail est un produit, dont la valeur d'échange est déterminée par la quantité de travail qu'il a fallu pour l'engendrer. Marx : {teal}« Le travailleur échange donc le travail comme simple valeur d'échange déterminée antérieurement, déterminée par un procès passé – il échange le travail lui-même comme travail objectivé »{/teal} (III-15). Ce travail passé est celui qui a entretenu le corps, formé, appris, familiarisé avec les outils, discipliné à l'usine.

    **Du possible au réel.** Le travailleur se présente avec « la simple forme abstraite, la simple possibilité de l'activité qui pose de la valeur, celle-ci existant seulement en tant que faculté, que puissance dans la corporéité du travailleur » (III-10). Du possible, de la potentialité, qui ne vaut pas grand-chose. Le capitaliste peut présenter l'affaire comme excellente : {amber}il achète ce pur subjectif en le traitant comme de l'objectif{/amber}, en le mesurant à la quantité de travail passé qui l'a produit.

    **Ce que le capital acquiert : la force créatrice.** « le capital l'acquiert par échange comme travail vivant, comme force productive universelle de la richesse ; activité qui augmente la richesse » (III-15). L'ambiguïté du possible est là : il achète un possible mesuré par le passé, mais il comprend ce possible comme {violet}puissance productive{/violet}, ce que Marx appelle *schöpferische Kraft*, force créatrice. On passe du possible au réel, du subjectif à l'objectif, et du quantitatif au qualitatif : l'échange quantitatif est ce par quoi le capital met la main sur du qualitatif, une puissance tournée vers l'avenir.

    **Un produit, une productivité.** Le capital paie la capacité de travail comme {coral}produit d'un travail passé{/coral}, mais il acquiert, et prive le travailleur de, la force de travail comme {coral}productivité{/coral}. Marx : « Il aliène son travail comme force productrice de la richesse ; c'est en tant que telle que le capital se l'approprie » (III-15). Le verbe allemand est *entäußert sich* : on retrouve le vocabulaire de l'aliénation, l'*Äußerung*, l'expression, des *Manuscrits de 1844*.

    ! Le capital n'achète pas du travail à venir : il paie du travail passé, et c'est l'échange lui-même qui lui livre la productivité future.
