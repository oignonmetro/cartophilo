- id: n1867m-p2c
  title: "Détruire le métabolisme spontané oblige à l'instituer"
  notes: |-
    **La phrase retourne le réquisitoire :** {coral}**en détruisant les circonstances qui assuraient d'elles-mêmes le métabolisme, la production capitaliste oblige à l'instituer consciemment, sous une forme plus haute.**{/coral}

    **Pourquoi « mais » et « en même temps » ?** C'est {amber}le même tour que pour l'agriculture et la manufacture{/amber} : la rupture qui détruit prépare ce qui la dépasse.

    ? **D'origine simplement naturelle** (*naturwüchsig*) : ce qui a {violet}poussé de soi-même, sans que personne l'ait décidé ni pensé{/violet}.

    **Qu'est-ce qui est détruit ?** {red}Non pas le métabolisme{/red}, condition éternelle qu'on ne supprime pas sans mourir, mais {green}les facteurs qui l'assuraient sans qu'on y pense{/green} : {yellow}quand ceux qui consomment vivent sur la terre qui les nourrit, le fumier et les restes retournent au champ d'eux-mêmes{/yellow}. Le chimiste n'est nécessaire que lorsque ce retour ne va plus de soi.

    **Pourquoi la destruction « oblige »-t-elle ?** Une fois le retour spontané supprimé, il ne reste que deux issues : {green}l'organiser{/green}, ou {red}laisser dépérir le sol et les hommes{/red}. La contrainte n'est {pink}pas un vœu moral{/pink} : elle vient de la condition naturelle elle-même.

    **Pourquoi « systématiquement » et « loi régulatrice » ?** Il ne suffit pas de réparer ici ou là : l'échange avec la terre doit {coral}commander ce qu'on produit et comment{/coral}, à la place que tient aujourd'hui {red}le profit{/red}. L'allemand dit *herstellen* [établir, et aussi rétablir].

    **Pourquoi « adéquate au plein développement de l'homme » ?** La nouvelle forme {red}ne restaure pas l'ancienne{/red} : elle doit servir {green}la santé, la liberté, les facultés{/green} que la phrase précédente montrait détruites.

    **Le capitalisme peut-il le faire ?** La phrase dit seulement qu'il {amber}oblige{/amber}. Qu'il ne puisse l'accomplir lui-même suit du reste du paragraphe, où chaque progrès ruine les sources ; le {sky}livre III{/sky} confiera cette tâche aux {violet}producteurs associés{/violet}.

    ! Sans cette phrase, on lit {red}une simple plainte écologique{/red} ; avec elle, {green}la destruction devient le point de départ d'une régulation{/green}.
