- id: n1867m-p4b
  title: "Les deux sources de toute richesse"
  notes: |-
    **La conclusion, du paragraphe comme du chapitre :** {coral}**la production capitaliste ne développe la technique et la coopération qu'en ruinant les deux sources de toute richesse, la terre et le travailleur.**{/coral}

    **Pourquoi « si bien que » ?** La phrase {amber}ramasse tout ce qui précède{/amber} : le métabolisme perturbé, la force de travail minée, la double spoliation.

    **Pourquoi « la technique et la combinaison » ?** Ce sont {green}les deux progrès{/green} que le texte a reconnus : la science appliquée et le travail coopératif. {red}Marx ne les retire pas.{/red}

    **Pourquoi « ne… qu'en » ?** La ruine {red}n'est ni un accident ni un excès{/red} : elle est {coral}la condition sous laquelle ce développement a lieu{/coral}. La raison tient au capital, qui cherche la survaleur : il traite le travailleur et le sol comme des {amber}moyens à tirer au plus vite{/amber}, sans compter le temps qu'il leur faut pour se refaire.

    ? **Richesse et valeur** : la richesse matérielle est l'ensemble des {violet}valeurs d'usage{/violet}, des choses utiles ; la {violet}valeur{/violet} est la forme sociale que le travail humain donne aux marchandises.

    **Pourquoi la terre est-elle une source,** si seul le travail crée la valeur ? Parce que la phrase parle de {green}richesse{/green}, {red}non de valeur{/red} : la terre fournit la matière et les forces sans lesquelles rien d'utile ne se produit. N'étant pas un produit du travail, elle n'a {pink}pas de valeur{/pink} ; on peut tirer de là (c'est une lecture) qu'un mode de production réglé sur la valeur {amber}tient peu compte de ce qu'il lui prend{/amber}.

    **Pourquoi « sources vives » ?** L'allemand dit *Springquellen* [sources jaillissantes] : elles {green}donnent sans cesse{/green} tant qu'elles vivent, et peuvent {red}tarir{/red}.

    **Où cela laisse-t-il le chapitre ?** Il s'ouvrait sur la machine, qui multiplie les forces productives ; il se ferme sur {coral}les sources de ces forces mêmes{/coral}. Le mode de production {amber}sape ses propres conditions{/amber}.

    ! La grande industrie reste {green}la plus révolutionnaire{/green} : la dernière phrase {red}ne dément pas la première{/red}, elle en dit le prix.
  passage:
    label: "§296"
    part: "4. Une double spoliation"
    text: "Si bien que la production capitaliste ne développe la technique et la combinaison du processus social de production qu'en ruinant dans le même temps les sources vives de toute richesse : la terre et le travailleur."
