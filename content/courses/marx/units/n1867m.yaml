- id: n1867m-p1
  title: "La grande industrie abat le paysan"
  notes: |-
    **La première phrase pose** {coral}**le lieu où la grande industrie révolutionne le plus**{/coral} **: l'agriculture, parce qu'elle y supprime une figure sociale, le paysan, au profit du salarié.**

    ? **Grande industrie** : la production par un {violet}système de machines{/violet}, où la science appliquée et la coopération remplacent l'habileté de l'ouvrier à manier son outil.

    **Pourquoi « le plus révolutionnaire » à la campagne,** alors que le paragraphe précédent disait que la machine y abîme moins les corps ? Parce que la révolution {red}ne se mesure pas aux dommages{/red}, mais {green}à la transformation des rapports sociaux{/green}. Dans les villes, l'artisan avait déjà largement cédé la place à l'ouvrier ; à la campagne subsistait une forme entière de société, que la machine {amber}atteint d'un seul coup{/amber}.

    **Pourquoi « dans la mesure où » ?** La formule {amber}donne la raison et la mesure{/amber} : ce qui est révolutionnaire n'est pas la machine comme objet, c'est qu'elle {coral}anéantit un bastion{/coral}.

    **Pourquoi le paysan est-il un « bastion de l'ancienne société » ?** L'allemand dit *Bollwerk* [rempart]. Le paysan qui dispose de sa terre et de ses instruments {green}produit avec les siens{/green} et {red}n'est pas contraint de vendre sa force de travail{/red} : il résiste, par sa seule existence, à la généralisation du salariat. Le chapitre sur l'accumulation le dira : ce petit mode de production {pink}exclut la concentration des moyens de production, la coopération et le libre développement des forces productives{/pink}. Vouloir le perpétuer serait, selon le mot de {sky}Pecqueur{/sky} que Marx approuve, {teal}« décréter la médiocrité générale »{/teal}.

    **Pourquoi « paysan » entre guillemets ?** Ils désignent moins des individus qu'une {violet}figure sociale{/violet}, avec la stabilité qu'on lui prête (lecture que les guillemets permettent, sans l'imposer).

    **Par quoi est-il remplacé ?** Par {green}__l'ouvrier salarié__{/green} : celui qui travaille la terre n'en dispose plus et vend à un autre sa capacité de travail. {coral}La campagne reçoit ainsi le rapport capitaliste lui-même.{/coral}

    ! « Révolutionnaire » {red}ne veut pas dire bienfaisant{/red} : le mot dit que {green}tout est transformé de fond en comble{/green}, pour le meilleur et pour le pire.
