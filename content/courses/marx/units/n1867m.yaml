- id: n1867m-i2
  title: "La question, la thèse, la problématique"
  notes: |-
    **La question est :** {amber}**la grande industrie, en gagnant la campagne, est-elle un progrès ?**{/amber}

    **La réponse ordinaire, des deux côtés.** Les uns célèbrent le progrès : des machines, de la chimie, des rendements. Les autres regrettent {pink}la vieille campagne{/pink} et dénoncent la ville. Marx cite en note, à propos de ce passage, un tel critique, {sky}David Urquhart{/sky}, qui s'indigne de voir la nation coupée en deux camps hostiles, rustres d'un côté, nains débilités de l'autre. Il relève {amber}la force et la faiblesse{/amber} de cette critique : elle sait {green}juger et condamner{/green} le présent, {red}non le comprendre{/red}.

    **La thèse.** **C'est à la campagne que la grande industrie est** {violet}**la plus révolutionnaire**{/violet} **: elle y abat le paysan et la routine, mais** {coral}**ne développe la technique qu'en ruinant la terre et le travailleur**{/coral} **; et cette ruine** {green}**oblige à régler consciemment l'échange avec la nature**{/green}**.**

    **Pourquoi la thèse est-elle difficile à tenir ?** Parce qu'elle affirme {amber}à la fois{/amber} un progrès et une destruction, et que le second n'est {red}pas un accident{/red} du premier. La problématique : {coral}**comment un même mouvement peut-il être le plus révolutionnaire, préparer une société supérieure et ruiner les sources de toute richesse ?**{/coral}

    | Difficulté | Où elle se trouve | Réponse du texte |
    | un progrès qui détruit | phrases 1-5 et 12-14 | La même science qui remplace la routine devient, sous sa forme capitaliste, un art de piller. |
    | une séparation qui prépare une union | phrases 4-5 | Chaque terme se développe contre l'autre, ce qui rend possible une synthèse plus haute. |
    | une destruction qui oblige à construire | phrases 6-8 | Quand l'échange avec la terre ne se fait plus de lui-même, il faut l'organiser. |
    | deux victimes pour un seul créateur de valeur | phrases 12-14 | La richesse a deux sources, la terre et le travailleur, même si seul le travail crée la valeur. |

    ! Le texte n'est {red}ni un éloge du progrès, ni une nostalgie de la campagne{/red} : il cherche {green}ce que la destruction rend possible et nécessaire{/green}.
  passage:
    label: "Introduction"
  points:
  - id: n1867m-i2-1
    sentence: "__Le critique de la séparation ville-campagne que Marx cite en note__ est David ___."
    answer: "Urquhart"
    alt: []
  - id: n1867m-i2-2
    sentence: "La faiblesse de cette critique, selon Marx : elle sait juger et condamner le présent, __mais non le ___.__"
    answer: "comprendre"
    alt: []
  - id: n1867m-i2-3
    sentence: "__La thèse du passage__ : la grande industrie ne développe la technique qu'en ruinant __la terre et le ___.__"
    answer: "travailleur"
    alt: []
  - id: n1867m-i2-4
    sentence: "La problématique : comment un même mouvement peut-il être **le plus ___**, préparer une société supérieure et ruiner les sources de toute richesse ?"
    answer: "révolutionnaire"
    alt: []
  - id: n1867m-i2-5
    sentence: "Le texte n'est ni un éloge du progrès ni __une ___ de la campagne__ : il cherche ce que la destruction rend possible."
    answer: "nostalgie"
    alt: []

- id: n1867m-i3
  title: "Avant le texte : le travail comme métabolisme, et Liebig"
  notes: |-
    **Pourquoi remonter au chapitre V ?** Le texte parlera d'un échange « entre l'homme et la terre » comme d'une chose connue. {sky}*Le Capital*{/sky} l'a posée en définissant le travail : {teal}« {/teal}un processus dans lequel {teal}l'homme règle et contrôle son métabolisme avec la nature{/teal} par la médiation de {teal}sa propre action »{/teal}.

    **Pourquoi « régler » ?** Tout vivant échange des matières avec son milieu. L'homme ne se distingue {red}pas en échappant à cet échange{/red}, mais en le {green}conduisant par son travail{/green}, selon un but.

    **Pourquoi cet échange ne dépend-il d'aucune société ?** On ne peut {red}cesser d'échanger avec la nature sans mourir{/red}. Le travail est donc {teal}« {/teal}la condition générale du métabolisme entre l'homme et la nature, {teal}la condition naturelle éternelle de la vie des hommes »{/teal}. {coral}Les sociétés changent la forme de l'échange, non sa nécessité.{/coral}

    **Et la terre ?** Le chapitre I avait déjà dit que le travail {red}n'est pas la source unique{/red} de la richesse matérielle : {teal}« {/teal}Comme le dit {sky}Petty{/sky}, celle-ci {teal}a pour père le travail et pour mère la terre »{/teal}.

    **Ce que Liebig apporte.** {sky}Justus von Liebig{/sky} (1803-1873), chimiste, fondateur de la chimie agricole, établit que les plantes tirent du sol des {violet}éléments minéraux{/violet} (phosphore, potasse) et que la fertilité ne dure que si ces éléments y {green}retournent{/green}. Or l'agriculture moderne {red}expédie les récoltes vers les villes{/red}, qui rejettent leurs déchets {yellow}dans les fleuves : la puanteur de la Tamise, à Londres, était célèbre{/yellow}. Pour compenser, l'Angleterre {yellow}importe du guano et des os du monde entier{/yellow}. Liebig parle d'une {violet}agriculture de spoliation{/violet} (*Raubbau*).

    **Ce que Marx lui doit.** Il lit la septième édition de sa chimie agricole (1862) et la cite en note dans ce paragraphe : {teal}« {/teal}L'un des {teal}immortels mérites de Liebig{/teal} est d'avoir développé {teal}le côté négatif de l'agriculture moderne{/teal}, {teal}du point de vue des sciences naturelles »{/teal}. {amber}« Du point de vue des sciences naturelles »{/amber} marque la limite : Liebig montre l'épuisement des sols ; Marx demande {coral}quel mode de production le produit{/coral}, et y joint le travailleur.
  passage:
    label: "Introduction"
