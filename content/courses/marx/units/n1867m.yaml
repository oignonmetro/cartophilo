- id: n1867m-p1b
  title: "La campagne alignée sur la ville, la science contre la routine"
  notes: |-
    **Deux conséquences suivent :** {coral}**une conséquence sociale**{/coral} **(la campagne prend les oppositions de la ville) et** {coral}**une conséquence technique**{/coral} **(la science y remplace la routine).**

    **Pourquoi « ainsi » ?** Parce que le salarié a pris la place du paysan. Là où l'on trouve désormais, comme en ville, {violet}des capitalistes et des salariés{/violet}, on trouve {amber}les mêmes oppositions{/amber}, et donc le même besoin de les renverser.

    **Pourquoi « besoins de bouleversement » ?** L'allemand parle d'*Umwälzungsbedürfnisse* [besoins de révolution] : la campagne, longtemps {pink}tenue pour le lieu de l'immobilité{/pink}, {green}a désormais besoin, elle aussi, d'une transformation de la société{/green}. L'opposition entre ville et campagne ne disparaît pas, mais {coral}la campagne cesse d'être un abri hors du conflit{/coral}.

    ? **Mode d'exploitation** : ici, la {violet}manière de cultiver la terre{/violet} (*Betrieb*), et non l'exploitation du travailleur.

    **Pourquoi « le plus routinier et le plus irrationnel » ?** L'allemand dit *gewohnheitsfaul*, [engourdi par l'habitude] : on cultivait {red}comme on avait toujours fait{/red}, sans connaître les raisons de ce qu'on faisait.

    **Pourquoi « consciente » ?** La science appliquée {green}sait pourquoi elle agit{/green}, à la différence de la coutume : {yellow}on ne laisse plus la terre se reposer parce que les pères le faisaient, on analyse le sol et l'on choisit l'engrais{/yellow}. Marx accorde donc à la grande industrie {coral}un progrès réel{/coral}.

    **Pourquoi ce mot compte-t-il pour la suite ?** Le paragraphe réclamera que l'échange avec la terre soit institué {amber}« systématiquement »{/amber}. La science capitaliste est consciente de ses moyens ; elle {red}ne l'est pas encore{/red} de ce qu'elle détruit.

    ! Marx ne regrette {red}pas la vieille agriculture{/red} : il la dit {pink}la plus irrationnelle{/pink}.
  passage:
