- id: n1867m-p2b
  title: "La santé des uns, la vie intellectuelle des autres"
  notes: |-
    **La phrase tire** {coral}**la conséquence humaine**{/coral} **de la perturbation : elle atteint la santé physique en ville et la vie intellectuelle à la campagne.**

    **Pourquoi « par là même » ?** Parce que c'est {amber}la même concentration{/amber} qui agit. En ville, les hommes et leurs déchets s'accumulent : ce qui {red}manque au champ empoisonne la cité{/red}. À la campagne, les travailleurs restent {pink}clairsemés et isolés{/pink}, loin de ce que la ville rassemble. {coral}Une seule séparation fait un trop-plein d'un côté, un vide de l'autre.{/coral}

    **Pourquoi « détruit », après « perturbe » ?** Le verbe est {amber}plus fort{/amber} : un cycle dérangé peut être rétabli ; une santé ruinée, une intelligence laissée sans exercice {red}ne se réparent pas aussi aisément{/red}.

    **Pourquoi deux biens différents ?** La phrase nomme {violet}le corps{/violet} d'un côté, {violet}l'esprit{/violet} de l'autre : chacune des deux populations est mutilée {amber}d'une moitié d'elle-même{/amber}. Ce que le premier manuscrit de 1844 appelait la vie physique et spirituelle liée à la nature est atteint {coral}dans ses deux dimensions{/coral}.

    **Le Manifeste disait-il le contraire ?** Il créditait les grandes cités d'avoir arraché {teal}« une partie importante de la population à l'abrutissement de la vie des champs »{/teal}. Les deux textes se concilient (c'est une lecture) : {green}ceux qui partent sont arrachés à cet isolement{/green}, {pink}ceux qui restent{/pink} sont privés de la vie de l'esprit dans une campagne vidée.

    **Ce que Marx ajoute en note.** Il cite ici {sky}Urquhart{/sky} : la séparation de la ville et de la campagne coupe un peuple {red}en deux moitiés mutilées{/red}.

    ! La destruction ne frappe {red}pas les seuls ouvriers d'usine{/red} : les travailleurs des champs perdent eux aussi, {green}autre chose{/green}.
