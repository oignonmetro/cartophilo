- id: n1867m-p2
  title: "La concentration urbaine perturbe le métabolisme"
  notes: |-
    **Le texte passe des rapports entre les hommes à leur échange avec la terre :** {coral}**la même concentration urbaine rassemble la force qui fait l'histoire et interrompt le retour au sol de ce qui en a été tiré.**{/coral}

    **Pourquoi partir de la population des villes ?** Parce que le sort du sol dépend de {amber}l'endroit où vivent ceux qui en consomment les produits{/amber}. Le capital {violet}entasse{/violet} les hommes dans de grands centres : il les y attire et les chasse des campagnes.

    **Pourquoi « d'un côté », « d'un autre côté » ?** Une seule cause, deux effets de signe contraire.

    **Que veut dire « la force motrice historique de la société » ?** {green}Les travailleurs rassemblés{/green} : réunis, ils coopèrent, s'organisent, résistent, et portent la transformation de la société. La grande ville est {coral}un lieu d'avenir{/coral}, et non seulement de misère.

    ? **Métabolisme** (*Stoffwechsel*, littéralement « échange de matières ») : l'ensemble des échanges de matières par lesquels les hommes {violet}tirent de la terre de quoi vivre et lui rendent ce qu'ils ne gardent pas{/violet}.

    **Pourquoi « c'est-à-dire le retour au sol » ?** Marx donne à la notion {amber}un contenu précis{/amber} : {yellow}le blé et la laine partent pour Londres ; les éléments qu'ils ont pris au sol, mangés ou usés, finissent dans la Tamise au lieu de retourner au champ{/yellow}. La nourriture {amber}et les vêtements{/amber} : tout ce que les hommes consomment du sol.

    **Pourquoi « perturbe » ?** L'allemand dit *stört* [dérange] : un cycle est rompu en un point, le retour. Le prélèvement continue ; {red}la restitution cesse{/red}.

    **Pourquoi « l'éternelle condition naturelle d'une fertilité durable » ?** « Éternelle » : elle vaut {green}pour toute société{/green}, comme le travail du chapitre V ; aucune forme sociale n'en dispense. « Durable » : un sol {amber}peut encore donner beaucoup pendant qu'il s'épuise{/amber} ; ce qui est atteint, c'est sa capacité de continuer.

    ! Le métabolisme {red}n'est pas l'équilibre d'une nature sans hommes{/red} : c'est {green}un échange avec les hommes, que le travail règle{/green}.
  passage:
    label: "§296"
    part: "2. Le métabolisme perturbé, et obligé de se refaire"
    text: "Avec la prépondérance toujours croissante de la population urbaine qu'elle entasse dans de grands centres, la production capitaliste amasse d'un côté la force motrice historique de la société et perturbe d'un autre côté le métabolisme entre l'homme et la terre, c'est-à-dire le retour au sol des composantes de celui-ci usées par l'homme sous forme de nourriture et de vêtements, donc l'éternelle condition naturelle d'une fertilité durable du sol."
