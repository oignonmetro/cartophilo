    text: "Le mode de production capitaliste consomme la rupture du lien de parenté qui unissait initialement l'agriculture et la manufacture au stade infantile et non développé de l'une et de l'autre. Mais cette rupture crée en même temps les présupposés matériels d'une nouvelle synthèse à un niveau supérieur, de l'association de l'agriculture et de l'industrie sur la base des configurations propres qu'elles se sont élaborées en opposition l'une à l'autre."
