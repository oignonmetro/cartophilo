- id: n1867m-o2
  title: "Après 1867 : de Liebig à Fraas"
  notes: |-
    **La question ne s'arrête pas au livre I :** {coral}**Marx l'approfondit dans ses lectures d'agronomie, et le dernier Marx en tire des conséquences que ce texte ne tirait pas encore.**{/coral}

    **Un débat entre agronomes.** {sky}Liebig{/sky} proposait de rendre aux sols leurs éléments par des {violet}engrais minéraux{/violet}. D'autres jugeaient le remède limité. {sky}Carl Fraas{/sky} (1810-1875) insiste sur le {amber}climat{/amber} et imagine une agriculture qui régénère les sols.

    **Que montre Fraas ?** Dans *Climat et monde végétal dans le temps* (1847), que climat et végétation {green}changent à l'échelle de l'histoire{/green} sous l'effet de la culture : {yellow}le déboisement excessif a contribué à faire des déserts de régions jadis fertiles, en Perse, en Mésopotamie, et à appauvrir la Grèce{/yellow}.

    **Ce que Marx en retient.** Il écrit à Engels, le 25 mars 1868, un an après le livre I, que la culture, quand elle avance *naturwüchsig vorschreitend und nicht bewußt beherrscht* [en progressant spontanément et sans maîtrise consciente], laisse derrière elle des déserts ; et il voit là {amber}une tendance socialiste inconsciente{/amber}.

    **Pourquoi ces mots importent-ils pour notre texte ?** Ce sont les siens : au spontané (*naturwüchsig*), qui détruit, s'oppose le {green}conscient{/green}. {coral}L'institution systématique du métabolisme que la phrase 8 exigeait trouve là un appui d'agronome.{/coral} Une différence : en 1867, le spontané désignait ce que le capital détruit ; dans la lettre, il désigne une culture {red}qui détruit faute d'être maîtrisée{/red}.

    **Le tournant discuté.** {sky}Kohei Saito{/sky} soutient qu'après ces lectures Marx abandonne l'idée d'un {red}développement illimité des forces productives{/red}. Marx étudie aussi les communautés agraires à propriété commune et, en 1881, répond à {sky}Vera Zassoulitch{/sky} sur la commune paysanne russe. La thèse de Saito est {amber}une interprétation disputée{/amber}, qui dépasse ce que le paragraphe affirme.

    ! Le texte de 1867 {red}n'annonce pas la décroissance{/red} : il dit que le développement capitaliste {green}ruine ses sources{/green}, ce qui est autre chose.
  passage:
    label: "Prolongement"
