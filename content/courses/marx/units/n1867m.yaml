- id: n1867m-p1c
  title: "La rupture de l'agriculture et de la manufacture, condition d'une synthèse"
  notes: |-
    **Le mouvement s'achève sur** {coral}**une dialectique**{/coral} **: le capitalisme achève de séparer l'agriculture de la manufacture, et cette séparation crée les conditions de leur union à un niveau supérieur.**

    ? **Manufacture** : ici, le travail de transformation, d'abord artisanal et domestique ({yellow}filer, tisser{/yellow}), qui s'ajoutait au travail des champs.

    **Pourquoi « lien de parenté » ?** L'allemand parle d'un *Familienband* [lien de famille] : dans la famille paysanne, {violet}les mêmes personnes cultivaient et fabriquaient{/violet}. **Pourquoi « au stade infantile » ?** Cette unité tenait à {red}la faiblesse des deux activités{/red}, trop peu développées pour exiger chacune ses hommes et ses savoirs.

    **Pourquoi « consomme » ?** Le verbe veut dire {amber}achever{/amber} (*vollenden*). La séparation est ancienne : {teal}« {/teal}le fondement de toute division du travail évoluée {teal}[…] est la séparation entre la ville et la campagne{/teal}{teal} »{/teal} (chapitre XII). La grande industrie l'achève en {teal}« extirpant ses racines, le filage et le tissage »{/teal} (chapitre XXIV).

    **Pourquoi « mais » et « en même temps » ?** Parce que la rupture {red}n'est pas seulement une perte{/red} : elle est {green}la condition d'un progrès{/green}. Séparées, chaque activité a pu développer ses machines, ses sciences et sa coopération. Une synthèse n'unit que des termes développés ; réunir deux activités enfantines {pink}ne donnerait que l'ancienne médiocrité{/pink}.

    **Pourquoi des « présupposés matériels » ?** La synthèse {red}n'est pas réalisée{/red} : le capitalisme en fournit seulement {amber}les conditions{/amber}, les forces dont une autre société pourra disposer.

    **Pourquoi « sur la base des configurations propres qu'elles se sont élaborées en opposition l'une à l'autre » ?** L'union future ne rétablira pas la famille paysanne : elle partira {coral}des formes que chacune a prises contre l'autre{/coral}, la grande industrie mécanisée et la grande culture scientifique. Le {sky}*Manifeste*{/sky} en faisait déjà un programme : {teal}« Coordination de l'activité agricole et industrielle ; mesures tendant à supprimer progressivement l'opposition ville-campagne. »{/teal}

    | Moment | Agriculture et manufacture |
    | l'union ancienne | liées dans la famille paysanne, l'une et l'autre peu développées |
    | la rupture | séparées et opposées, chacune développant ses propres formes |
    | la synthèse à venir | associées à un niveau supérieur, sur la base de ces formes |

    ! La synthèse n'est {red}pas un retour à la terre{/red} : elle est {green}plus haute{/green} que les deux états qui la précèdent.
