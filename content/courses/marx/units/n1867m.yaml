- id: n1867m-p4
  title: "Piller le travailleur, piller le sol"
  notes: |-
    **Les deux fils se nouent :** {coral}**tout progrès de l'agriculture capitaliste est un progrès dans la spoliation du travailleur et du sol à la fois, et il va d'autant plus vite que la grande industrie est la base du pays.**{/coral}

    **Pourquoi « piller » ?** L'allemand dit *berauben* [dépouiller, voler] : le mot renvoie à l'{violet}agriculture de spoliation{/violet} (*Raubbau*) de {sky}Liebig{/sky}. Piller, c'est {red}prendre sans rendre{/red}.

    **Pourquoi « un progrès dans l'art » ?** Marx garde le mot que ses adversaires emploient : il y a bien {green}progrès, savoir-faire, rendement accru{/green} ; mais ce que l'on sait mieux faire, c'est {red}dépouiller{/red}.

    **Pourquoi « non seulement… mais aussi » ?** La spoliation du travailleur était connue par l'analyse de la fabrique ; Marx y {amber}joint le sol{/amber}, au même titre.

    **Comment un accroissement de fertilité peut-il être une ruine ?** Tout tient au {violet}temps{/violet}. La fertilité s'accroît {teal}« pour un laps de temps donné »{/teal} ; ce qui est ruiné, ce sont les {teal}« sources durables de cette fertilité »{/teal}. {yellow}Un engrais ou un labour plus profond arrache davantage au champ cette année, en puisant dans la réserve des années à venir.{/yellow} {coral}Le gain présent est emprunté à l'avenir.{/coral}

    **Pourquoi les États-Unis ?** Ils servent d'{amber}épreuve{/amber} : un pays qui {green}part de la grande industrie{/green}, sans longue tradition agricole pour freiner, doit montrer la destruction {coral}plus rapide{/coral}. Elle est donc proportionnée à la base industrielle capitaliste : {red}ce n'est pas un reste d'arriération{/red}.

    **Que dit « comme arrière-plan » ?** La grande industrie n'agit pas seulement dans les champs : elle est {amber}le fond sur lequel tout le pays se développe{/amber}, avec ses villes, ses transports et son marché.

    ! Marx ne dit {red}pas que la fertilité baisse toujours{/red} : elle peut {green}monter un temps{/green}, et c'est ce qui cache la ruine.
  passage:
    label: "§296"
    part: "4. Une double spoliation"
    text: "Et tout progrès de l'agriculture capitaliste est non seulement un progrès dans l'art de piller le travailleur, mais aussi dans l'art de piller le sol ; tout progrès dans l'accroissement de sa fertilité pour un laps de temps donné est en même temps un progrès de la ruine des sources durables de cette fertilité. Plus un pays, comme, par exemple, les États-Unis d'Amérique, part de la grande industrie comme arrière-plan de son développement et plus ce processus de destruction est rapide."
