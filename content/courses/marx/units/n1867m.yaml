- id: n1867m-o3
  title: "Rétablir le métabolisme : les producteurs associés"
  notes: |-
    **Qui instituera le métabolisme en loi ?** Le livre III répond : {coral}**les producteurs associés, qui règlent en commun leurs échanges avec la nature.**{/coral}

    **La réponse.** {teal}« {/teal}En ce domaine, la liberté ne peut consister qu'en ceci : que l'être humain socialisé, que {teal}les producteurs associés règlent de façon rationnelle leurs échanges avec la nature{/teal}, qu'ils la {teal}contrôlent ensemble{/teal} au lieu d'être {teal}dominés par sa puissance aveugle{/teal} ; qu'ils procèdent à ces échanges avec {teal}la plus petite dépense d'énergie{/teal} et dans les conditions correspondant {teal}de la façon la plus digne à leur nature d'êtres humains »{/teal}.

    **« En ce domaine » ?** Celui de la production matérielle, que Marx appelle le {violet}royaume de la nécessité{/violet}. L'association ne supprime pas la contrainte de produire ; elle {green}change qui la conduit et comment{/green}. Le {violet}royaume de la liberté{/violet} commence au-delà, et la réduction de la journée de travail en est la condition.

    **Pourquoi « rationnelle » et « ensemble » ?** Un producteur privé, tenu par la concurrence, {red}ne règle que son entreprise{/red} ; le métabolisme, qui passe à travers toute la société, {green}ne se règle qu'en commun{/green}.

    **La propriété de la terre.** Le chapitre sur l'accumulation nomme le renversement : {teal}« C'est la négation de la négation. »{/teal} Elle ne rétablit pas la propriété privée, mais {teal}« {/teal}la {teal}propriété individuelle{/teal} fondée sur les conquêtes mêmes de l'ère capitaliste : sur {teal}la coopération et la propriété commune de la terre{/teal} et des moyens de production produits par le travail lui-même{teal} »{/teal}.

    **Le même mouvement que dans notre texte.** Union ancienne, rupture, synthèse supérieure : pour {violet}l'agriculture et la manufacture{/violet} comme pour {violet}le producteur et sa terre{/violet}, {coral}Marx ne revient pas au point de départ{/coral} ; il garde ce que la rupture a développé.

    ! La régulation rationnelle {red}n'est pas une domination sans mesure{/red} de la nature : sa règle est {green}la moindre dépense{/green} et la dignité de ceux qui produisent.
