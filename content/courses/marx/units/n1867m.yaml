    text: "Dans l'agriculture comme dans la manufacture, la mutation capitaliste du processus de production apparaît en même temps comme le martyrologue des producteurs, le moyen de travail apparaît comme le moyen d'assujettir, d'exploiter et d'appauvrir le travailleur, la combinaison sociale du processus de travail comme répression organisée de sa vitalité, de sa liberté, et de son autonomie d'individu."
