- id: n1867m-o1
  title: "Portées : la vie, la nature, une seule ruine"
  notes: |-
    **Ce que le texte permet de penser de la vie :** {coral}**elle tient à un échange avec la terre qu'un mode de production peut dérégler, et dont la rupture atteint ensemble le sol, le corps et l'esprit.**{/coral}

    **La vie comme échange.** Vivre n'est {red}pas une propriété qu'un être aurait par lui seul{/red} : c'est {green}prendre dans la terre et lui rendre{/green}. La vie humaine a donc une condition qui ne dépend d'aucune société, et des formes qui en dépendent toutes.

    **Une condition naturelle sous une forme historique.** Le métabolisme est {violet}éternel{/violet} ; sa perturbation est {violet}historique{/violet}. {amber}Une société ne peut abolir cette condition, mais elle peut la compromettre{/amber}, et elle est seule à pouvoir l'organiser.

    **Toute la vie est atteinte.** Le texte nomme la santé physique, la vie intellectuelle, la vitalité, la liberté, la force de travail comme personnalité vivante : {coral}la vie dont il s'agit n'est pas la seule survie{/coral}.

    **De 1844 à 1867.** Le premier manuscrit posait que {teal}« {/teal}la nature, c'est-à-dire la nature qui n'est pas elle-même le corps humain, est {teal}le corps non organique de l'homme »{/teal}, et que le travail aliéné le lui arrache. Ici, plus de {pink}corps non organique{/pink} ni d'{pink}être générique{/pink}, mais un {green}métabolisme perturbé{/green} : ce qui se disait comme une perte de l'essence humaine se montre comme {coral}un processus matériel, daté, observable{/coral}.

    **Une seule ruine.** La terre et le travailleur ne sont {red}pas deux dossiers séparés{/red}, l'un écologique et l'autre social : {green}le même processus les épuise{/green}, par les mêmes moyens. On peut soutenir contre qui les sépare que l'exploitation de l'homme et celle de la nature sont deux faces d'une même chose.

    **Un Marx prométhéen ?** On lui a prêté l'idéal d'une {red}domination sans limite de la nature{/red}. Ce texte reconnaît le progrès technique, mais en {amber}mesure la valeur à ce qu'il laisse subsister{/amber} : une fertilité {green}durable{/green} et un homme {green}pleinement développé{/green}.

    ? **Rupture du métabolisme** : l'expression, d'après la « faille » dont parle le livre III, a été popularisée par {sky}John Bellamy Foster{/sky} ; notre texte, lui, écrit que la production capitaliste {violet}perturbe{/violet} le métabolisme.

    ! Faire de Marx un écologiste d'aujourd'hui serait {red}forcer le texte{/red} : son objet reste {green}le mode de production{/green}, et la nature y compte comme condition de la vie humaine.
  passage:
    label: "Prolongement"
  points:
  - id: n1867m-o1-1
    sentence: "__Le métabolisme est une condition éternelle, mais sa perturbation__ est **___**."
    answer: "historique"
    alt: []
