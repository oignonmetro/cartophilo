# Unité de texte (voir content/textes.md) : Marx, *Le Capital*, livre I,
# chapitre XIII « La machinerie et la grande industrie », section 10
# « Grande industrie et agriculture », §296, d'après la traduction de
# référence (GEME, Jean-Pierre Lefebvre). Les appels de note et les repères de
# page sont retirés. Le §295, préliminaire et statistique, est résumé en
# introduction. Pas de commentaire suivi : analyse propre, recoupée sur le
# notebook « Marx » et sur l'allemand de la première édition (1867, notes sur
# Urquhart et sur Liebig) ; contexte (Liebig, Londres, guano, Fraas) d'après un
# chapitre de Denis Collin sur Marx et la nature ; lettre à Engels du 25 mars
# 1868 sur Fraas. La citation de la note sur Liebig est celle de la traduction
# PUF de Lefebvre (les notes de Marx manquent au PDF de la GEME).

id: n1867m
title: "La rupture du métabolisme (1867)"
subtitle: "Le Capital, livre I, chapitre XIII, section 10"
icon: page
color: coral
depth: normale
intro: |-
  La dernière page du chapitre sur la machinerie et la grande industrie : ce que celle-ci fait à la campagne. Elle y abat le paysan, perturbe le métabolisme entre l'homme et la terre, et ne développe la technique qu'en ruinant la terre et le travailleur.
lessons:
- id: n1867m-i1
  title: "Le texte, sa place et son plan"
  notes: |-
    **Le texte demande ce que la** {violet}**grande industrie**{/violet} **fait à la campagne, et répond :** {coral}**elle y révolutionne tout, mais ne développe la technique qu'en ruinant la terre et le travailleur**{/coral}**.**

    **Où est-il dans** {sky}*Le Capital*{/sky} **?** Au livre I (1867), chapitre XIII, « La machinerie et la grande industrie », {amber}dixième et dernière section{/amber}, « Grande industrie et agriculture ». Le chapitre a montré, sur la fabrique, ce que la machine fait au travail et à l'ouvrier ; cette dernière section {amber}transporte l'examen à la campagne{/amber}.

    **Ce qui précède immédiatement.** La section 9, sur la législation de fabrique, conclut que le développement capitaliste fait mûrir à la fois {teal}« les contradictions et les antagonismes de sa forme capitaliste »{/teal} et {teal}« les éléments constitutifs d'une nouvelle société »{/teal}. Le texte sur l'agriculture suit {coral}la même double lecture{/coral} : destruction et préparation.

    **Le paragraphe qui l'ouvre.** Marx annonce qu'il ne traitera la question qu'{amber}« brièvement et par anticipation »{/amber}. La machine n'inflige pas aux travailleurs des champs les mêmes dommages physiques qu'à ceux des fabriques, mais elle les rend plus vite superflus : {yellow}dans les comtés de Cambridge et de Suffolk, la surface cultivée a beaucoup augmenté en vingt ans, tandis que la population rurale diminuait, même en chiffres absolus{/yellow}. Le paragraphe étudié ici est le suivant, le dernier de la section et du chapitre.

    **La progression.** **Les phrases 1 à 5 décrivent la révolution que la grande industrie opère** dans les rapports sociaux et la technique des campagnes. **Les phrases 6 à 8 passent à l'échange avec la terre**, que la concentration urbaine perturbe. **Les phrases 9 à 11 reviennent aux producteurs**, agricoles comme industriels. **Les phrases 12 à 14 réunissent la terre et le travailleur** dans une même spoliation.

    | Mouvement | Lieu | Ce qui s'y joue |
    | montrer ce que la grande industrie révolutionne à la campagne | phrases 1-5 | Elle abat le paysan, remplace la routine par la science et achève de séparer agriculture et manufacture, ce qui prépare leur synthèse. |
    | montrer que le métabolisme entre l'homme et la terre est perturbé | phrases 6-8 | La concentration urbaine empêche le retour au sol de ce qui en a été tiré, ce qui oblige à instituer consciemment ce retour. |
    | décrire le sort des producteurs sous la forme capitaliste | phrases 9-11 | Comme dans la manufacture, le progrès des moyens de travail se paie d'une oppression et d'un épuisement du travailleur. |
    | conclure sur la double ruine | phrases 12-14 | Chaque progrès pille à la fois le travailleur et le sol, les deux sources de toute richesse. |
