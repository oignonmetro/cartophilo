- id: n1867m-p3
  title: "Le martyrologe des producteurs"
  notes: |-
    **Le texte revient du sol aux hommes qui produisent :** {coral}**la transformation capitaliste, à la campagne comme à l'usine, retourne contre eux le processus, les moyens et la coopération.**{/coral}

    **Pourquoi « dans l'agriculture comme dans la manufacture » ?** Le chapitre l'a montré pour l'industrie ; Marx étend le verdict : {amber}la campagne n'échappe pas{/amber} à ce que la fabrique fait à l'ouvrier.

    **Pourquoi préciser « la mutation capitaliste » ?** Marx n'accuse {red}pas la technique comme telle{/red}, mais {green}la forme sous laquelle elle se transforme{/green}.

    ? **Martyrologe** : à l'origine la {violet}liste des martyrs{/violet} ; ici, l'histoire des souffrances des producteurs. La traduction écrit « martyrologue ».

    **Pourquoi « apparaît en même temps comme » ?** « En même temps » : la même transformation qui accroît les forces productives {amber}est aussi{/amber} cette souffrance ; ce ne sont pas deux histoires. « Apparaît » ne désigne {red}pas une illusion{/red} : c'est {green}la figure réelle{/green} qu'elle prend pour eux.

    **Pourquoi trois membres ?** Marx reprend {amber}tout ce qui compose la production{/amber} et montre chaque terme retourné contre le travailleur.

    | Ce qui devrait servir | Comment il apparaît |
    | la transformation du processus de production | comme le martyrologe des producteurs |
    | le moyen de travail | comme le moyen d'assujettir, d'exploiter et d'appauvrir le travailleur |
    | la combinaison sociale du processus de travail | comme la répression organisée de sa vitalité, de sa liberté et de son autonomie |

    **Le moyen de travail.** La machine prolonge la main ; sous le capital, {red}elle commande l'ouvrier et le rend superflu{/red}. Le premier manuscrit de 1844 voyait le produit se dresser contre le producteur ; {coral}c'est maintenant l'instrument{/coral}.

    ? **Combinaison sociale du travail** : la {violet}coopération organisée{/violet} de nombreux travailleurs, qui multiplie leurs forces.

    **Pourquoi « répression organisée » ?** Ce qui multiplie les forces de tous {red}étouffe celles de chacun{/red}, et méthodiquement. Vitalité, liberté, autonomie : l'allemand de 1867 parle de la *Lebendigkeit* [la vitalité, le caractère vivant] de l'individu. {coral}Ce qui est atteint, c'est le travailleur comme vivant.{/coral}

    ! Marx ne demande {red}pas de renoncer aux machines ni à la coopération{/red} : il montre {green}sous quelle forme elles se retournent{/green} contre ceux qui produisent.
  passage:
