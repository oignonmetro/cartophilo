- id: n1867m-p3b
  title: "La résistance brisée, la force de travail dévastée"
  notes: |-
    **Marx compare ensuite les deux populations :** {coral}**à la campagne la dispersion affaiblit la résistance, et le progrès s'y paie, comme en ville, de la ruine de la force de travail.**{/coral}

    **Pourquoi la résistance diffère-t-elle ?** Parce qu'elle suppose {amber}d'être ensemble{/amber}. {yellow}Mille ouvriers d'une même usine peuvent s'entendre et cesser le travail ; quelques journaliers épars sur de grands domaines le peuvent à peine.{/yellow} Voilà pourquoi la ville amassait {violet}la force motrice historique{/violet}.

    **Pourquoi « comme dans l'industrie urbaine » ?** La différence de résistance {red}ne change pas le mécanisme{/red} : des deux côtés, {green}le progrès a le même prix{/green}.

    ? **Fluidité du travail** (*Flüssigmachung*) : un travail {violet}mis en mouvement plus vite, en plus grande quantité, et déplaçable{/violet} d'une tâche à l'autre.

    ? **Force de travail** : {teal}« {/teal}le résumé de {teal}toutes les aptitudes physiques et intellectuelles{/teal} qui existent dans la corporéité, {teal}la personnalité vivante d'un être humain »{/teal} (chapitre IV), que le salarié vend pour un temps.

    **Pourquoi « payés au prix » ?** Le gain {red}n'est pas gratuit{/red} : ce qu'on obtient en rendement est {amber}prélevé sur celui qui le produit{/amber}. Le délabrement n'atteint pas un accessoire mais {coral}la force de travail elle-même{/coral}, la source qu'on exploite.

    **Pourquoi les mots allemands comptent-ils ?** Marx écrit *Verwüstung und Versiechung* [dévastation, changement en désert, et dépérissement]. {coral}La force de travail est décrite avec les mots d'une terre ravagée{/coral} : la phrase suivante pourra réunir le travailleur et le sol.

    | | Industrie urbaine | Agriculture moderne |
    | les travailleurs | concentrés | dispersés |
    | leur résistance | accrue | brisée |
    | le prix du progrès | délabrement et maladies | délabrement et maladies |

    ! La concentration {red}ne protège pas la santé{/red} des ouvriers des villes : elle {green}accroît leur force de résistance{/green}, ce qui est autre chose.
  passage:
    label: "§296"
    part: "3. Le martyrologe des producteurs"
    text: "La dispersion des travailleurs agricoles sur de plus grandes surfaces brise en même temps leur force de résistance, tandis que la concentration accroît celle des travailleurs des villes. Comme dans l'industrie urbaine, l'augmentation de la force productive et le plus grand degré de fluidité du travail sont payés dans l'agriculture moderne au prix du délabrement et des maladies qui minent la force de travail elle-même."
