- id: ali6-l3
  title: "Pour qui la séparation est-elle abolie ?"
  notes: |-
    **L'abolition de la séparation n'a lieu que pour le capital : la contradiction entre séparation et abolition n'est qu'apparente. Cette leçon montre pourquoi, et ce que cela dit du mode de production capitaliste.**

    **Le problème.** La leçon précédente a montré que l'acte de travail abolit la séparation. Mais l'appropriation qui fait des conditions le corps de l'âme du travail « est effectivement contradictoire avec le fait que, dans l'ouvrier, le travail est sans objet ou n'est réalité effective que dans son caractère immédiat d'être vivant » (III-40). {blue}*Die Arbeit ist gegenstandslos*{/blue} : Marx reprend en 1857 l'expression de 1844. Le travail entre dans le procès de production comme travail sans objet, réduit à une capacité subjective ; or le même procès semble lui permettre de se réobjectiver. Comment les deux peuvent-ils être vrais ? Marx ajoute : {teal}« {/teal}c'est sur {teal}cette séparation{/teal} que repose l'existence {teal}du capital et du travail salarié »{/teal} (III-40).

    **Pourquoi cela compte.** La séparation entre l'activité pure et les conditions de son objectivation est {amber}centrale pour comprendre le capital et le travail salarié{/amber}, et leur opposition. C'est pour cela que le cours a tant insisté sur l'aliénation.

    **La solution : deux niveaux.** La contradiction serait réelle si la séparation et son abolition se situaient au même niveau. Ce n'est pas le cas :

    | Point de vue | La séparation | Son abolition |
    | --- | --- | --- |
    | Statut | condition de possibilité | phénomène interne |
    | Durée | fondamentale | momentanée |
    | Rapport au capital | sa condition | son profit |

    La séparation entre la pure capacité de travail et les conditions objectives de son actualisation est une {red}condition de possibilité du mode de production capitaliste{/red} : sans elle, pas de mise en rapport du travail et du capital, donc pas de rapport de production capitaliste. L'abolition, elle, n'est pas une condition de possibilité du procès de production : elle se produit {coral}à l'intérieur{/coral} de celui-ci, et momentanément.

    **Pour qui ?** La question décisive est de savoir pour lequel des deux, le travail ou le capital, l'abolition a lieu. Réponse : {red}pour le capital seulement{/red}. Si elle avait lieu pour le travail, elle signifierait son émancipation ; mais on est au cœur du mode de production capitaliste, au niveau de sa condition fondamentale de possibilité. Il ne s'agit pas de l'abolir, mais de {green}réaliser ses conditions de possibilité{/green}.

    **À retenir.** La séparation est la base permanente du rapport entre capital et travail salarié ; son abolition dans l'acte de travail est un fait interne et passager, dont le capital profite.

    ! Que le travail vivant anime la matière et les outils ne veut pas dire que le travailleur s'en trouve réconcilié avec ses conditions : c'est le capital qui en profite (la suite : séance du 5 novembre).
