id: ali6
title: "La séparation du travail et du capital"
subtitle: "Entrée dans les Grundrisse : la capacité de travail vivante, l'abolition de la séparation dans le procès de production, et pour qui elle a lieu"
icon: compass
color: teal
lessons:
- id: ali6-l1
  title: "La capacité de travail vivante et ses conditions objectives"
  notes: |-
    **Dans les** *Grundrisse***, Marx ne laisse pas l'aliénation de côté : il la reprend sous le nom de séparation entre la capacité de travail et ses conditions objectives.**

    **Un fil conducteur.** Les manuscrits de 1857-1858, les {violet}*Grundrisse*{/violet}, précèdent de dix ans la publication du livre I du *Capital* : ce sont ses premiers manuscrits préparatoires. Le cours y suit l'aliénation pour montrer que Marx {amber}y poursuit et y approfondit{/amber} ce qu'il avait acquis dans les manuscrits parisiens : l'aliénation est non la perte du sujet dans l'objet, mais {coral}la constitution du sujet par perte et soustraction de ses objets propres{/coral} et de l'objectivité en général, y compris de la sienne propre, celle d'un être passif, sensible, affecté.

    **Le moyen du travail.** La matière et l'instrument du travail forment {violet}le moyen du travail vivant{/violet}. Ils sont pour lui, dit Marx, « moyen du travail vivant, […] moment d'existence objectif de sa vie » (III-40) [*ein gegenständliches Daseinsmoment ihrer Lebendigkeit*, un moment d'existence objectif de sa vitalité]. Ils apparaissent au travailleur, c'est-à-dire au travail vivant (car « c'est seulement dans le procès de valorisation que l'ouvrier existe comme travail vivant »), non comme des valeurs mais comme de simples moments du procès de production : {teal}« comme valeurs d'usage pour le travail, comme les conditions objectives de l'efficacité du travail, ou encore comme ses moments objectifs »{/teal} (III-40).

    **Rien de nouveau.** La {violet}valeur d'usage{/violet}, expression absente des manuscrits de 1844, ne désigne ici qu'{green}une chose utile{/green} : la matière à transformer et les outils sont utiles à l'activité de travail, qui ne peut se déployer sans eux. « Conditions objectives de l'efficacité du travail » dit la même chose.

    **La séparation de départ.** La situation du travailleur est celle d'une séparation entre {red}sa capacité de travail vivante{/red}, *das lebendige Arbeitsvermögen*, et {red}les conditions objectives de sa mise en œuvre{/red}, la matière et les instruments. Cette capacité n'est autre que l'{violet}activité pure{/violet} des *Manuscrits de 1844*. Elle est dite vivante parce qu'elle a un support, le corps du travailleur : l'ensemble de ses capacités physiques, psychiques et mentales. Elle est pourtant {coral}abstraite{/coral}, séparée de tout ce qui permettrait de l'effectuer.

    ! La capacité de travail vivante n'est pas le travail en acte : c'est une aptitude, que son support rend vivante et que sa séparation rend abstraite.
