- id: ali6-l2
  title: "L'abolition de la séparation : le corps de son âme"
  notes: |-
    **Dans le procès de production, le travail vivant abolit la séparation : il s'approprie la matière et l'instrument et leur communique sa vie. Cette leçon dit ce que Marx entend par cette abolition, pourquoi elle a lieu, et ce qu'elle n'est pas.**

    **Le point de départ.** La leçon précédente a posé une séparation entre la capacité de travail vivante et ses conditions objectives. Marx affirme aussitôt qu'elle est levée dans l'acte de travail.

    **L'abolition dans l'acte de travail.** Quand l'activité se déploie, c'est-à-dire dans l'{violet}acte du travail vivant{/violet}, la mise en œuvre effective de la capacité de travail, la séparation est abolie. {teal}« {/teal}Dans le procès de production, {teal}la séparation entre le travail{/teal} et ses moments d'existence objectifs – instrument et matériau – {teal}est abolie »{/teal} (III-40) [{blue}*aufgehoben*{/blue}, l'{blue}*Aufhebung*{/blue}].

    **Pourquoi elle a lieu.** Sans le travail, la matière est inerte et les outils sont inertes. Travailler, c'est {amber}s'approprier ses propres conditions objectives{/amber} : leur ôter leur mode d'existence extérieur et objectif, se les assimiler et leur communiquer sa propre vie. Le travail vivant insuffle la vie à des choses qui, sans lui, seraient mortes.

    **Le corps de son âme.** Marx le dit par une métaphore religieuse, fréquente chez lui : le travail vivant fait de l'instrument et du matériau {teal}« {/teal}{teal}le corps de son âme{/teal}, {teal}les ressuscitant ainsi d'entre les morts »{/teal} (III-40) [{blue}*zum Leibe ihrer Seele*{/blue}, avec {blue}*Leib*{/blue}, le corps de chair, comme dans les *Manuscrits* ; {blue}*von den Toten auferweckt*{/blue}]. La capacité de travail, pure activité abstraite, trouve dans la matière et les outils un corps, comme l'âme dans le corps. C'est la même idée qu'en 1844 : l'activité a besoin d'un côté objectif pour exister.

    **Ce que cette abolition n'est pas.** Elle a lieu {coral}à l'intérieur du procès de production{/coral}, et seulement le temps de l'acte de travail : elle est momentanée. Marx ajoute qu'elle « ressortit purement et simplement au rôle matériel que le travail, de par sa nature, joue dans le procès de production » (III-40). Elle ne tient donc ni à une décision, ni à un rapport social particulier, mais à ce qu'est le travail vivant.

    **À retenir.** Le travail vivant, par nature, anime ses conditions et lève la séparation, mais seulement dans l'acte et de façon passagère. La leçon suivante demande ce que cela change vraiment : pour qui cette abolition a-t-elle lieu ?

    ! Le « corps de son âme » ne veut pas dire que le travailleur possède sa matière et ses outils : le travail les anime, il ne les possède pas.
