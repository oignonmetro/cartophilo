lessons:
- id: ali6-l1
  title: "La capacité de travail vivante et ses conditions objectives"
  notes: |-
    **Dans les** *Grundrisse***, Marx ne laisse pas l'aliénation de côté : il la reprend sous le nom de** {amber}**séparation entre la capacité de travail et ses conditions objectives**{/amber}**. Cette leçon dit ce que sont les deux termes séparés, et pourquoi Marx décrit les conditions du travail comme le « moyen du travail vivant ».**

    **D'où l'on part.** Les manuscrits de 1857-1858, les {violet}*Grundrisse*{/violet}, précèdent de dix ans la publication du livre I du *Capital* : ce sont ses premiers manuscrits préparatoires. Marx {amber}y poursuit et y approfondit{/amber} ce qu'il avait acquis dans les manuscrits parisiens : l'{violet}aliénation{/violet} est non pas la perte du sujet dans l'objet, mais {coral}la constitution du sujet par __perte et soustraction de ses objets propres__ et de l'objectivité en général{/coral}, y compris de la sienne propre, celle d'{yellow}un être passif, sensible, affecté{/yellow}. Il faut donc retrouver, dans le vocabulaire de 1857, ce que les *Manuscrits* appelaient l'activité pure et ses objets.

    **Premier terme : la** {violet}**capacité de travail vivante**{/violet}**.** Marx l'appelle {blue}*das lebendige Arbeitsvermögen*{/blue}. C'est l'{violet}activité pure{/violet} des *Manuscrits de 1844*, vue comme une aptitude à travailler.

    ? **Capacité de travail vivante** : l'{teal}aptitude à travailler{/teal} dont le travailleur est le porteur. Elle est {amber}vivante{/amber} parce qu'elle a un support, le {amber}corps du travailleur{/amber} : l'ensemble de ses capacités physiques, psychiques et mentales. Ce n'est pas le travail en acte, mais ce qui le rend possible.

    **Second terme : les conditions objectives.** Pour que cette capacité s'exerce, il faut de quoi travailler : la {amber}matière{/amber} à transformer et l'{amber}instrument du travail{/amber}. Ce sont les conditions objectives de sa mise en œuvre.

    **La séparation de départ.** Le travailleur se trouve dans la situation d'une séparation entre {red}sa capacité de travail vivante{/red} et {red}les conditions objectives de sa mise en œuvre{/red}. La capacité reste {coral}abstraite{/coral} : séparée de tout ce qui permettrait de l'effectuer, elle n'est qu'une activité sans objet, comme en 1844.

    **Pourquoi parler du « moyen du travail vivant ».** C'est la façon dont Marx dit {amber}ce dont le travailleur est séparé{/amber}. Vues du côté du travail vivant, la matière et l'instrument ne sont pas des richesses ni des valeurs : ils forment le {teal}« {/teal}{teal}moyen du travail vivant{/teal}, […] {teal}moment d'existence objectif{/teal} de sa vie{teal} »{/teal} (III-40) [{blue}*ein gegenständliches Daseinsmoment ihrer Lebendigkeit*{/blue}, un moment d'existence objectif de sa vitalité]. Autrement dit, ils sont {coral}le côté objectif de la vie même du travail{/coral}, comme les objets propres de l'être actif des *Manuscrits*. Être séparé de ses conditions, c'est donc être privé de l'objectivité de sa propre vie, non de simples outils extérieurs. Cela vaut pour le travail vivant, qui n'existe comme tel que dans l'acte de travailler : {teal}« {/teal}c'est seulement dans le {teal}procès de valorisation{/teal} que l'ouvrier existe {teal}comme travail vivant »{/teal}.

    **Comment le travail les voit.** Dans le procès de production, ces conditions n'apparaissent pas comme des valeurs, mais comme {amber}de simples moments du procès de production{/amber} : {teal}« {/teal}comme {teal}valeurs d'usage pour le travail{/teal}, comme les {teal}conditions objectives{/teal} de l'efficacité du travail, ou encore comme ses {teal}moments objectifs »{/teal} (III-40).

    ? **Valeur d'usage** : une {green}chose utile{/green}, utile à l'activité de travail ou apte à satisfaire des besoins. L'expression est absente des manuscrits de 1844. Elle s'oppose à la valeur d'échange, que le travail, lui, ne voit pas ici dans ses conditions.

    Dire que la matière et les outils sont des valeurs d'usage pour le travail, c'est donc dire {green}une chose simple{/green} : __ils sont utiles à l'activité de travail__, qui ne peut se déployer sans eux. {teal}« {/teal}{teal}Conditions objectives{/teal} de l'efficacité {teal}du travail »{/teal} dit la même chose. Marx ne dit rien de nouveau ici sur l'aliénation, il la redécrit.

    **À retenir.** En 1857, l'aliénation devient la séparation entre une capacité de travail vivante, abstraite, et les conditions objectives qui sont le côté objectif de sa vie. La leçon suivante montre comment l'acte de travail abolit cette séparation, la dernière demande pour qui elle a lieu.

    ! La capacité de travail vivante n'est pas le travail en acte : c'est une aptitude, que son support rend vivante et que sa séparation rend abstraite.
