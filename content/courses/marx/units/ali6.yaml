- id: ali6-l2
  title: "L'abolition de la séparation : le corps de son âme"
  notes: |-
    **Dans le procès de production, le travail vivant abolit la séparation : il s'approprie la matière et l'instrument et leur communique sa vie.**

    **L'abolition dans l'acte de travail.** Quand l'activité de travail se déploie, c'est-à-dire dans l'{violet}acte du travail vivant{/violet}, la mise en œuvre effective de la capacité de travail, la séparation précédente est abolie. {teal}« Dans le procès de production, la séparation entre le travail et ses moments d'existence objectifs – instrument et matériau – est abolie »{/teal} (III-40) [*aufgehoben*, l'*Aufhebung*].

    **Pourquoi : la nature du travail vivant.** L'acte de travailler est {amber}un acte d'appropriation de ses propres conditions objectives{/amber}. Le travail vivant peut ôter aux conditions leur mode d'existence extérieur et objectif, se les assimiler et leur communiquer sa propre vie. Sans lui, la matière est inerte, les outils sont inertes ; il faut une force vitale, et c'est ce que fait l'acte de travail vivant : il insuffle la vie à des choses qui, sans lui, seraient mortes.

    **Le corps de son âme.** Marx le dit avec une métaphore religieuse, fréquente chez lui : l'appropriation est celle {teal}« par laquelle, dans le procès de production lui-même, le travail vivant fait de l'instrument et du matériau le corps de son âme, les ressuscitant ainsi d'entre les morts »{/teal} (III-40) [*zum Leibe ihrer Seele*, avec *Leib*, le corps de chair, comme dans les *Manuscrits* ; *von den Toten auferweckt*]. La capacité de travail, pure activité abstraite, trouve dans la matière et les outils un corps, comme l'âme dans le corps.

    **Une abolition momentanée.** Elle a lieu {coral}à l'intérieur du procès de production{/coral}, et seulement le temps de l'acte de travail. Marx ajoute qu'elle « ressortit purement et simplement au rôle matériel que le travail, de par sa nature, joue dans le procès de production » (III-40). Elle ne tient donc ni à une décision, ni à un rapport social particulier, mais à ce qu'est le travail vivant.

    ! Le « corps de son âme » ne veut pas dire que le travailleur possède sa matière et ses outils : le travail les anime, il ne les possède pas.
