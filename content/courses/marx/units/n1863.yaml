- id: n1863-p16
  title: "« Le renversement du sujet dans l'objet et inversement »"
  notes: |-
    **L'apposition finale nomme le rapport commun :** {coral}**le renversement du sujet dans l'objet et inversement**{/coral}**.**

    ? **Sujet, objet** : le sujet est celui qui agit et se donne des fins ; l'objet, ce sur quoi on agit, ce qui sert ou ce qui est produit.

    Dans l'ordre normal du travail, l'homme est sujet, ses outils et ses produits sont objets : {yellow}le menuisier se sert de son rabot pour faire une table{/yellow}.

    **Le renversement consiste en deux mouvements simultanés.** __Le sujet passe dans l'objet__ : l'ouvrier devient {red}une chose parmi les choses{/red}, un « facteur » du capital, incorporé à lui, employé par les moyens de production au lieu de les employer. __Et « inversement », l'objet passe dans le sujet__ : le capital, qui n'est que du travail passé sous forme de choses, devient {green}ce qui agit et poursuit une fin{/green}, la valorisation ; il {teal}« se présente ici comme une substance automatique, douée d'une vie propre »{/teal} (*Capital*, livre I, chapitre 4), et il emprunte au capitaliste la conscience et la volonté qui lui manquent. {amber}Les deux personnifications du début sont les deux faces de ce renversement{/amber} : {coral}le capitaliste est une chose devenue personne, le travailleur une personne réduite à sa fonction de chose{/coral}. Dans la religion, le même double mouvement se produit en pensée : Dieu, objet produit par l'esprit humain, devient le sujet créateur, et l'homme devient sa créature.

    **Pourquoi ce renversement a-t-il lieu ?** La phrase précédente en a donné la raison : le produit du travail ne revient pas au producteur, il est approprié par un autre et fonctionne comme capital. Dès lors que le travail passé a pour fonction de commander au travail présent pour s'accroître, {coral}c'est lui qui agit, et l'homme qui est agi{/coral}. Le renversement n'est donc {red}pas une erreur de perception{/red}, qu'il suffirait de corriger : {green}il est inscrit dans la forme sociale de la production{/green}, et ne peut être défait que par la transformation de cette forme.

    **Pourquoi ce vocabulaire ?** Les mots « sujet », « objet » et « renversement » viennent de la philosophie allemande : {sky}Feuerbach{/sky} présentait sa critique de {sky}Hegel{/sky} comme un retournement, qui remet les hommes à la place du sujet là où Hegel faisait de l'Idée le sujet et des hommes ses manifestations, et Marx avait repris le geste en 1843 contre la philosophie hégélienne du droit. Le vocabulaire ajoute quatre choses à « la domination de la chose sur l'homme » :

    | Apport | Ce qu'il dit de plus |
    | les places sont échangées | celui qui commande est ce qui devrait obéir : cela suppose un ordre normal, où l'homme est sujet de ce qu'il produit |
    | la chose reçoit les attributs du sujet | des fins, une volonté, un mouvement propre |
    | ce qui est renversé peut être remis à l'endroit | le mot annonce le point de vue historique de la phrase suivante |
    | le mot vaut pour la religion comme pour la production | il nomme la structure commune et prépare le mot « aliénation » |

    Le Chapitre VI force l'image quelques pages plus haut : les conditions du travail {teal}« apparaissent comme des fétiches doués d'une volonté et d'une âme propres »{/teal}, et {teal}« ce sont les moyens de subsistance qui achètent le travailleur afin de l'incorporer aux moyens de production »{/teal}.

    **Ce qu'établit le premier mouvement.** Il dit {coral}qui est le véritable sujet du rapport capitaliste{/coral} : le capitaliste a bien la conscience et la volonté, mais il ne les exerce que pour une fin qui n'est pas la sienne ; le travailleur n'est plus, dans la production, qu'un facteur du capital ; et ce qui domine, à travers le premier, est le travail mort devenu capital. Le mouvement s'achève en donnant à ce rapport son nom et son modèle. {yellow}Quand un patron licencie pour maintenir sa marge, il le fait sciemment, mais ce qu'il exécute est une exigence du capital, et un autre à sa place ferait de même.{/yellow} La première apparence de liberté, celle du capitaliste comme sujet, est renversée. {amber}Il reste à comprendre pourquoi l'histoire a dû passer par un tel renversement.{/amber}

    ! « Et inversement » n'est pas {red}une redite{/red} : le renversement va {green}dans les deux sens à la fois{/green}, l'homme devient chose et la chose devient sujet.
