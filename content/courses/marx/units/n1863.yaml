- id: n1863-p13
  title: "« Exactement le même rapport » : le modèle religieux"
  notes: |-
    **La quatrième phrase affirme une identité :** {coral}**le rapport de domination qu'on vient de décrire est exactement celui que la religion représente**{/coral}**.** Le {violet}« rapport »{/violet} dont il s'agit est celui de la phrase précédente : la domination de la chose sur l'homme, du produit sur le producteur. La {teal}« production matérielle »{/teal} est la production des choses dont les hommes vivent, par opposition aux productions de l'esprit.

    ? **Critique de la religion (Feuerbach)** : dans *L'Essence du christianisme* (1841), {sky}Feuerbach{/sky} montre que l'homme attribue à Dieu ses propres qualités portées à l'infini (la bonté, la sagesse, la puissance), puis se prosterne devant cet être qui n'est que son reflet agrandi : {coral}le créateur devient la créature de sa créature{/coral}.

    **Les deux rapports ont alors quatre traits en commun, qui font leur identité de structure :**

    | Trait | Dans la religion | Dans la production capitaliste |
    | ce qui domine est un produit de l'homme | Dieu, produit de l'esprit humain | le capital, produit du travail humain |
    | ce produit fait face à son producteur comme un être indépendant | Dieu existe hors de l'homme | le capital appartient à un autre |
    | il commande à son producteur | Dieu prescrit | le capital emploie |
    | sa puissance grandit à mesure que le producteur s'appauvrit | plus l'homme met en Dieu, moins il garde en lui | plus l'ouvrier produit de capital, plus le capital qui le domine est grand |

    Marx décrit le deuxième trait au chapitre sur le fétichisme : dans {teal}« la région nuageuse du monde religieux »{/teal}, {teal}« les produits du cerveau humain ont l'aspect d'êtres indépendants »{/teal} (*Capital*, livre I, chapitre 1). **« Exactement »** affirme que ces quatre traits se retrouvent tels quels, {amber}la différence ne portant que sur le domaine où le rapport se joue{/amber} : la représentation pour la religion, la vie matérielle pour le capital. {coral}Le capital fait donc réellement ce que la religion fait en pensée.{/coral}

    **L'analogie a une longue histoire chez Marx**, et la suivre montre qu'elle n'est {red}pas un ornement{/red} mais {green}un fil continu de sa pensée{/green}. Dès 1844, au cœur du passage des *Manuscrits* sur le travail aliéné : {teal}« {/teal}C'est la même chose avec la religion. {teal}Plus l'homme projette de choses en Dieu, moins il en garde en lui-même. L'ouvrier place sa vie dans l'objet.{/teal} Mais alors {teal}celle-ci ne lui appartient plus, elle appartient à l'objet »{/teal} (premier manuscrit, traduction GF). Puis dans le *Capital* : {teal}« Ainsi que, dans le monde religieux, l'homme est dominé par l'œuvre de son cerveau, il l'est, dans le monde capitaliste, par l'œuvre de sa main »{/teal} (livre I, chapitre 25 ; 23 dans l'édition allemande). Le texte étudié se tient entre ces deux formules : des *Manuscrits*, il garde {amber}l'idée d'une perte{/amber} ; du *Capital*, il annonce {amber}l'opposition du cerveau et de la main{/amber}, de la pensée et de la pratique, qui est celle du « domaine idéologique » et de la « production matérielle ».

    ! L'analogie religieuse n'est pas {red}une survivance des écrits de jeunesse{/red} que le Marx de la maturité aurait abandonnée : {green}elle traverse l'œuvre jusqu'au Capital{/green}.
