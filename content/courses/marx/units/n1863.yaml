- id: n1863-p39
  title: "« De l'autre côté, sur le pôle opposé »"
  notes: |-
    **La précision finale corrige aussitôt l'égalité :** {coral}**les deux asservissements sont égaux, mais opposés**{/coral}**.** {teal}« Même si »{/teal} est concessif : au moment où il affirme l'égalité des deux asservissements, Marx rappelle qu'ils ne sont pas symétriques.

    **L'image du pôle est précise.** {yellow}Les deux pôles d'un aimant sont opposés, mais inséparables{/yellow} : chacun n'existe que par l'autre, et aucun ne peut être supprimé sans que l'autre disparaisse. Le Chapitre VI avait préparé l'image quelques lignes plus haut, dans le même paragraphe, en parlant de {teal}« la nature spécifiquement polarisée des sortes de marchandises »{/teal} que capitaliste et travailleur se vendent l'un à l'autre, l'argent d'un côté, la capacité de travail de l'autre (édition citée). {coral}Le capitaliste et le travailleur sont les deux pôles d'un seul rapport : il n'y a pas de capitaliste sans salarié, ni de salarié sans capitaliste.{/coral}

    **« De l'autre côté » dit que chacun est asservi depuis sa place, et sous des formes opposées.**

    | Pôle | Comment il est asservi |
    | le capitaliste | en agent, en bénéficiaire, en satisfait : asservi à sa propre fin |
    | le travailleur | en instrument, en victime, en révolté : asservi à la fin d'un autre |

    **Les Manuscrits de 1844 avaient déjà formulé cette différence**, à la fin du passage sur le travail aliéné : {teal}« ce qui apparaît chez l'ouvrier comme activité de dessaisissement, d'aliénation, apparaît chez le non-ouvrier comme état de dessaisissement, d'aliénation »{/teal} (premier manuscrit). La distinction de l'{violet}activité{/violet} et de l'{violet}état{/violet} éclaire le mot « enraciné » : l'ouvrier fait l'aliénation, chaque jour, par son travail, et c'est pourquoi il l'éprouve comme une peine ; le capitaliste n'a rien à faire pour être aliéné, il l'est par sa situation, {yellow}comme une plante tient à son sol{/yellow}, et c'est pourquoi il ne l'éprouve pas. Le Chapitre VI donne à cet état un contenu qu'il n'avait pas en 1844 : {amber}l'asservissement de toute l'activité du capitaliste à l'impulsion du thésauriseur{/amber}.

    **La précision assure la cohérence du troisième mouvement.** {coral}C'est parce que les deux pôles sont asservis au même rapport qu'on peut comparer leurs manières de l'être, et c'est parce qu'ils le sont en sens opposés que l'un peut être dit au-dessus de l'autre.{/coral} La dernière phrase répond ainsi terme à terme à « le travailleur se tient d'emblée au-dessus » : c'est la structure de *La Sainte Famille*, une seule aliénation pour deux classes, vécue en sens contraires.

    **Ce qu'établit le troisième mouvement.** Il achève de renverser les apparences de liberté, en deux temps. D'abord, celui qui n'est qu'un objet pour le capital se tient au-dessus de celui qui en est le sujet apparent, parce qu'il éprouve le rapport comme un asservissement là où l'autre y trouve sa satisfaction. Ensuite, le texte affronte l'objection la plus forte contre le premier mouvement, l'activité réelle du capitaliste, et montre qu'elle n'est que le moyen d'une fin misérable et abstraite. {yellow}Le patron qui passe sa vie à surveiller ses marges en est satisfait et ne voit pas ce qu'il y perd ; l'ouvrier qui y passe la sienne en souffre et sait qu'il est asservi.{/yellow} {amber}Le texte se referme ainsi sur sa première phrase : la conscience et la volonté qu'il accordait au capitaliste n'avaient pour contenu que l'impulsion du thésauriseur.{/amber}

    ! « Sur le pôle opposé » ne {red}retire{/red} rien à l'asservissement du capitaliste : il en dit {green}la forme{/green}, celle d'un asservissement satisfait.
  passage:
