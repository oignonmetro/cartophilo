- id: n1863-p1
  title: "Les fonctions du capitaliste ne sont que les fonctions du capital"
  notes: |-
    **La première phrase réduit** {violet}**le capitaliste**{/violet} **à** {coral}**une fonction du capital**{/coral}**.** Tout ce qu'il fait, il le fait {amber}« avec conscience et volonté »{/amber}, mais ce qu'il fait appartient au capital : la restriction {teal}« ne sont que »{/teal} retire au capitaliste la propriété de ses propres actes, sans lui retirer la conscience qu'il en a.

    **Pourquoi ces fonctions sont-elles exercées « avec conscience et volonté » ?** __Parce que le capital, à lui seul, ne peut rien faire.__ Il est une somme de valeur dont tout le mouvement consiste à s'accroître ; mais une somme de valeur {red}n'achète rien, n'embauche personne{/red}, ne décide ni de ce qu'il faut produire ni du moment où il faut vendre. Pour que ce mouvement ait lieu, il faut que quelqu'un le veuille et le conduise : qu'il achète les machines et la force de travail, fasse travailler, vende le produit, puis relance l'argent obtenu dans un nouveau cycle. Le capitaliste est ce quelqu'un. {coral}La conscience et la volonté sont donc ce que le capital emprunte à un homme pour se mouvoir{/coral}, et non une liberté que cet homme exercerait pour son propre compte.

    **Le Capital dit exactement cela**, au chapitre sur la transformation de l'argent en capital : {teal}« {/teal}Ce n'est qu'autant que {teal}l'appropriation toujours croissante de la richesse abstraite{/teal} est le seul motif déterminant de ses opérations, qu'il fonctionne comme capitaliste, ou, si l'on veut, comme {teal}capital personnifié, doué de conscience et de volonté »{/teal} (livre I, chapitre 4). Le capitaliste {red}n'est pas un rouage dépourvu d'esprit{/red} : il calcule, prévoit, décide. Mais tout ce calcul a {amber}un seul motif{/amber}, l'enrichissement abstrait, qui n'est pas un choix de sa part : c'est {coral}la condition pour qu'il reste capitaliste{/coral}. Un patron qui cesserait de viser l'accroissement de son capital, pour fabriquer de beaux objets à perte, {yellow}cesserait bientôt d'être capitaliste{/yellow}, la concurrence le faisant disparaître (ce que le texte ne dit pas ici, mais que Marx développe ailleurs).

    ? **Fonction** : un rôle défini par ce qu'il accomplit dans un ensemble, indépendamment de celui qui le remplit, comme la fonction de {yellow}trésorier{/yellow} dans une association.

    **Pourquoi « les fonctions du capital » ?** Les opérations du capitaliste ({yellow}acheter, faire produire, vendre, réinvestir{/yellow}) sont {coral}les moments par lesquels la valeur avancée revient augmentée{/coral} : elles appartiennent au mouvement du capital, et le capitaliste ne fait que leur prêter sa tête et ses mains. Qu'on pense à un {yellow}arbitre de football{/yellow} : il décide en conscience et siffle quand il veut, mais ce qu'il fait appliquer, ce sont les règles du jeu, et un autre arbitre ferait la même chose à sa place. De même, {coral}ce que le capitaliste veut, c'est ce que le capital exige{/coral} : sa conscience est le lieu où une fin qui n'est pas la sienne devient une intention.

    **La phrase commence par une concession**, qui semble jouer contre la thèse : Marx accorde au capitaliste ce qui fait ordinairement un sujet. C'est ce qui donne sa force à la réduction : {amber}même conscient et voulant{/amber}, le capitaliste n'est que l'agent d'un autre. La fin du texte refermera la boucle, en montrant que cette conscience n'a pour contenu que l'impulsion du thésauriseur.

    ! Le texte ne dit pas que le capitaliste {red}agit sans conscience, mécaniquement{/red} : il dit que {green}sa conscience et sa volonté servent une fin qui n'est pas la sienne{/green}.
