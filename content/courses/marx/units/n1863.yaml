- id: n1863-p29
  title: "Le capitaliste « surveillant et directeur »"
  notes: |-
    **Le capitaliste doit** {coral}**surveiller et diriger le travail**{/coral}**, mais dans une mesure qui varie et qu'il peut déléguer.**

    **Pourquoi « surveillant » et « directeur » ? Les deux rôles ont deux sources différentes.**

    | Rôle | D'où il vient | Ce qu'il fait |
    | directeur | de la nature du travail combiné, qui existerait dans toute production collective | coordonner les gestes de nombreux ouvriers |
    | surveillant | du rapport capitaliste, parce que l'ouvrier travaille pour un autre | contraindre : empêcher le gaspillage, imposer l'exécution correcte et l'intensité |

    Le rôle de {violet}directeur{/violet} : {teal}« Un musicien exécutant un solo se dirige lui-même, mais un orchestre a besoin d'un chef »{/teal} (*Capital*, livre I, chapitre 13). Le rôle de {violet}surveillant{/violet} : le capitaliste a acheté la force de travail, c'est donc lui qui la consomme, et le Chapitre VI en tire la conséquence, un {teal}« rapport économique de domination et subordination, dès lors que la consommation de la capacité de travail est le fait du capitaliste, et donc qu'il la surveille et la dirige »{/teal}. Il doit veiller à ce que les moyens de production ne soient pas gaspillés, {teal}« et c'est ici que commence la surveillance du capitaliste »{/teal}, puis à ce que le travail soit exécuté correctement, où {teal}« c'est de nouveau la surveillance et la discipline du capitaliste qui entrent en jeu »{/teal} (édition citée). {coral}Cette surveillance n'est nécessaire que parce que l'ouvrier travaille pour un autre{/coral} : {yellow}celui qui travaille pour lui-même n'a pas besoin qu'on surveille son zèle{/yellow}.

    Le *Capital* résume cette double origine : {teal}« la direction capitaliste, quant à son contenu, a une double face »{/teal}, parce que ce qu'il s'agit de diriger est à la fois {teal}« procès de production coopératif »{/teal} et {teal}« procès d'extraction de plus-value »{/teal} ; c'est pourquoi {teal}« la forme de cette direction devient nécessairement despotique »{/teal} (chapitre 13). {amber}Le directeur coordonne, le surveillant contraint ; et c'est la seconde fonction qui donne à la première sa forme autoritaire.{/amber}

    **Pourquoi « doit »-il le faire, et dans quelle mesure ?** Il le doit parce que __la valorisation passe par le procès de travail effectif__ : sans travail organisé et surveillé, la valeur avancée ne se conserve pas et la survaleur ne se produit pas. Mais la mesure varie. {yellow}Le petit capitaliste travaille encore lui-même{/yellow} ; ce n'est {teal}« qu'à partir d'un certain minimum de capital que le capitaliste cesse d'être lui-même un travailleur pour commencer à ne plus se réserver que la direction du procès de travail et la commercialisation des marchandises produites »{/teal} ; il remplit alors {teal}« la fonction douée de volonté et de conscience du capital »{/teal} (Chapitre VI, édition citée), formule qui reprend presque mot pour mot la première phrase du texte. Au-delà encore, il {amber}délègue{/amber} cette fonction : il {teal}« se démet de sa fonction de surveillance immédiate et assidue »{/teal}, et, à la tête d'une {teal}« armée industrielle »{/teal}, {teal}« il lui faut des officiers supérieurs (directeurs, gérants) et des officiers inférieurs (surveillants, inspecteurs, contremaîtres) »{/teal} (*Capital*, chapitre 13). D'où la formule : {teal}« Le capitaliste n'est point capitaliste parce qu'il est directeur industriel ; il devient au contraire chef d'industrie parce qu'il est capitaliste »{/teal}. {coral}La fonction dans la production réelle ne lui est donc pas essentielle{/coral} : il l'exerce dans la mesure exacte où le capital l'exige, et peut la remettre à d'autres sans cesser d'être capitaliste.

    ! La fonction de direction n'est pas {red}ce qui fait le capitaliste{/red} : {green}c'est parce qu'il est capitaliste qu'il dirige{/green}, et il peut cesser de diriger sans cesser d'être capitaliste.
  passage:
