- id: n1863-p4
  title: "Le travailleur, « travail personnifié » : la souffrance et l'effort"
  notes: |-
    **Symétriquement,** {violet}**le travailleur**{/violet} **est** {coral}**« travail personnifié »**{/coral}**, et son travail ne lui appartient plus que comme souffrance et effort.** Le {teal}« de même que »{/teal} annonce un parallèle : {teal}« les siennes »{/teal} désigne les fonctions du travailleur, qui n'agit, lui aussi, qu'{amber}en tant que{/amber} personnification d'une catégorie économique. La relative {teal}« qui lui appartient »{/teal} se rapporte au travail : elle dit {amber}sous quel rapport{/amber} ce travail est encore à lui.

    **Dans quelle mesure le travail appartient-il au travailleur ? Il faut partir de ce que l'ouvrier vend :** {green}sa force de travail{/green}, sa capacité de travailler pendant un temps donné, et {red}non son travail{/red}. Comme tout acheteur d'une marchandise, le capitaliste acquiert le droit d'en user. Le *Capital* le dit sans détour : {teal}« {/teal}Dès son entrée dans l'atelier, {teal}l'utilité de sa force, le travail, appartenait au capitaliste »{/teal} (livre I, chapitre 7). Le travail, qui est {violet}l'usage{/violet} de la force de travail, n'appartient donc plus à l'ouvrier : {pink}ni ce qu'il produit, ni la manière de le produire, ni la valeur créée{/pink}.

    **Mais une chose ne peut pas passer à l'acheteur.** La force de travail réside {teal}« dans le corps d'un homme »{/teal}, dans sa {teal}« personnalité vivante »{/teal} (chapitre 6), de sorte que __son usage ne peut avoir lieu que dans ce corps__ : la dépense des muscles, des nerfs, de l'attention, la fatigue et la peine se font en lui et ne peuvent se faire qu'en lui. Le paragraphe 102 du Chapitre VI, juste avant le passage, le dit en propres termes : {teal}« {/teal}En tant qu'effort, {teal}dépense de force vitale, le travail est l'activité personnelle du travailleur »{/teal}. C'est pourquoi le travail ne lui appartient plus que {teal}« pour ce qui est de la souffrance, de l'effort »{/teal} : {coral}il en garde le coût, inséparable de sa personne, et en perd le fruit{/coral}, qui passe à l'acheteur. Qu'on pense à {yellow}un déménageur loué à l'heure{/yellow} : les meubles déplacés, le temps de travail et ce qu'il rapporte sont à l'entreprise ; {yellow}le mal de dos est à lui{/yellow}.

    **La symétrie avec le capitaliste n'est pas parfaite**, et c'est le point important. Le capitaliste personnifie le capital, qui lui reste ; le travailleur personnifie {amber}un travail qui ne lui appartient déjà plus{/amber}. L'un est le visage d'une puissance, l'autre le visage d'une perte.

    ! « Qui lui appartient pour ce qui est de la souffrance » n'est pas {red}une consolation{/red} (il garderait au moins cela) : c'est {green}la marque de sa dépossession{/green}, puisqu'il ne garde de son travail que ce qui ne se vend pas.
