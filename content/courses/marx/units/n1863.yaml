- id: n1863-p23
  title: "« Le procès d'aliénation de son propre travail »"
  notes: |-
    **Le deuxième mouvement se clôt sur une phrase brève qui nomme ce qui a été décrit :** {coral}**le renversement est l'aliénation du travail humain**{/coral}**.** Ce n'est pas un argument nouveau, mais une dénomination qui rassemble tout ce qui précède.

    ? **Aliénation** : au sens littéral, le fait de rendre étranger (latin *alienus*) ce qui est à soi ; dans la tradition de Hegel et de Feuerbach que Marx reprend, le processus par lequel un produit de l'homme devient une puissance indépendante qui le domine.

    **Qu'est-ce qui autorise Marx à employer ce mot ?** Pour qu'il y ait aliénation au sens où la tradition l'entend depuis Hegel et Feuerbach, cinq conditions doivent être réunies, et le texte les a établies une à une :

    | Condition | Où le texte l'établit |
    | ce qui domine doit venir de l'homme | les moyens de domination sont « de simples résultats du procès de production », du travail mort |
    | ce qui vient de l'homme doit lui devenir étranger | le produit passe au capitaliste, et le travail lui appartient « en tant que substance » |
    | la chose étrangère doit devenir indépendante | le renversement de l'objet en sujet, la valeur « qui se valorise » |
    | elle doit se tourner contre son producteur | la domination du travail mort sur le travail vivant |
    | la structure doit être celle de la religion | « exactement le même rapport » |

    Le paragraphe 102 du Chapitre VI, juste avant le passage, l'avait dit : le travailleur, {teal}« en même temps qu'il crée de la valeur, la crée comme une valeur qui lui est étrangère »{/teal}. {coral}Le mot « aliénation » ne vient donc pas de l'extérieur, comme un jugement moral plaqué sur une description économique : il est le nom exact de ce que la description a trouvé.{/coral}

    **Pourquoi « de son propre travail », et non de son produit ?** Parce que l'aliénation porte {amber}sur l'activité elle-même{/amber}, qui appartient à un autre dès l'entrée dans l'atelier et y est incorporée au capital. Les *Manuscrits de 1844* le disaient déjà : {teal}« l'aliénation n'apparaît pas seulement dans le résultat, mais dans l'acte de la production, à l'intérieur de l'activité productive elle-même »{/teal} (premier manuscrit, traduction GF). {teal}« Propre »{/teal} insiste sur le paradoxe : {coral}ce qui est le plus intimement à l'homme, son activité, est ce qui lui devient le plus étranger{/coral}. Le possessif {teal}« son »{/teal} renvoie à {teal}« l'être humain »{/teal} de la phrase précédente : l'aliénation est {green}celle de l'humanité tout entière{/green}, et {red}non seulement celle de l'ouvrier{/red}, ce qui permettra, dans la partie suivante, de dire que le capitaliste y est pris lui aussi.

    **Pourquoi « procès » ?** Le mot a deux sens, que le texte tient ensemble. Au sens économique, l'aliénation n'est pas un état donné une fois pour toutes, mais elle {amber}se refait à chaque journée de travail{/amber} : c'est le procès de production lui-même, vu du côté de ce qu'il fait au travailleur. Au sens historique, l'aliénation est {amber}un mouvement qui a un commencement et peut avoir une fin{/amber}, le « point de passage » dont il vient d'être question. La phrase brève unit ainsi les deux points de vue, celui de la structure et celui de l'histoire.

    **Ce qu'établit le deuxième mouvement.** {coral}La servitude décrite dans le premier mouvement a été le passage historiquement nécessaire à la formation de la base matérielle de la liberté{/coral}, parce que c'est elle qui a imposé le développement des forces productives. Cette nécessité {red}n'est pas une justification{/red} : elle est conditionnelle, provisoire, et payée par le plus grand nombre. {yellow}Les usines du XIXe siècle ont produit en quelques décennies plus de richesses que les siècles antérieurs, mais en épuisant les ouvriers qui les faisaient tourner{/yellow} : le texte tient ensemble ces deux faits. La religion y sert une seconde fois, pour penser non plus la structure du renversement, mais sa nécessité.

    ! L'aliénation n'est pas {red}un sentiment{/red} de malaise ou d'étrangeté : c'est {green}un rapport objectif{/green}, où le produit de l'homme devient une puissance indépendante qui le domine.
  passage:
