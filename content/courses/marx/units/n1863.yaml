- id: n1863-p17
  title: "« D'un point de vue historique » : le point de passage nécessaire"
  notes: |-
    **Le deuxième mouvement change de point de vue :** {coral}**le renversement, considéré dans l'histoire, est un passage nécessaire**{/coral}**.** Le texte marque lui-même la coupure : {teal}« Considéré d'un point de vue historique »{/teal}. Et il reprend {teal}« ce renversement »{/teal} comme l'objet de sa nouvelle question : après avoir dit ce qu'il est, il demande d'où il vient et à quoi il mène.

    **Pourquoi ce changement de point de vue ?** Jusqu'ici, le texte a analysé le rapport tel qu'il se joue {amber}dans chaque procès de production, chaque jour, dans chaque atelier{/amber} : c'est un point de vue de {violet}structure{/violet}. Il le replace maintenant dans {amber}la succession des formes de production{/amber} : c'est un point de vue d'{violet}histoire{/violet}. Ce changement est commandé par la méthode même de Marx, pour qui {coral}aucune forme sociale n'est naturelle ni éternelle{/coral} : chacune naît de conditions déterminées et en produit d'autres. {red}Considéré du point de vue de la structure, le renversement n'est que domination et perte{/red} ; {green}considéré du point de vue de l'histoire, il a une fonction{/green}.

    **La fin du Chapitre VI dit ce que ce point de vue fait voir**, et que les économistes, {teal}« prisonniers eux-mêmes des représentations capitalistes »{/teal}, ne voient pas : ils voient {teal}« comment se déroule la production au sein du rapport capitaliste, mais non pas comment ce rapport se produit lui-même et simultanément produit en lui les conditions matérielles de sa dissolution, par quoi est liquidée sa justification historique en tant que forme nécessaire du développement économique »{/teal} (édition citée). Le point de vue historique donne donc {amber}à la fois une justification et sa limite{/amber} : le capitalisme est justifié comme forme nécessaire, mais seulement historiquement, c'est-à-dire pour un temps, et cette justification se liquide d'elle-même à mesure qu'il produit les conditions de sa propre dissolution.

    ? **Nécessité conditionnelle** : la nécessité d'un moyen par rapport à une fin (« si l'on veut ceci, il faut cela »), par opposition à une nécessité absolue, qui vaudrait en toute circonstance.

    **Chaque mot du groupe compte.** {teal}« Apparaît »{/teal} dit que c'est ainsi que le renversement se montre à ce regard rétrospectif sur l'histoire, non une vérité déduite a priori. {teal}« Point de passage »{/teal} désigne {green}une étape qu'on traverse{/green}, non {red}un terme où on s'arrête{/red} : le renversement est le chemin vers autre chose. {teal}« Nécessaire »{/teal}, que la suite complète par {teal}« pour »{/teal}, désigne une nécessité conditionnelle : si l'humanité doit développer ses forces productives jusqu'au point où une société libre devient possible, c'est par là qu'elle a dû passer. {coral}Marx ne dit pas que le capitalisme est bon, ni qu'il est fatal en toute circonstance ; il constate, en regardant l'histoire après coup, que c'est par lui que ces forces se sont effectivement développées.{/coral}

    ! « Nécessaire » ne veut pas dire {red}légitime{/red} : une nécessité historique explique un passage, {green}elle ne le justifie pas moralement{/green}.
