- id: n1863-p37
  title: "« Un contenu totalement misérable et abstrait »"
  notes: |-
    **Le texte qualifie la fin du capitaliste :** {coral}**un contenu sans aucune chose déterminée, et une vie appauvrie**{/coral}**.** L'apposition, introduite par un tiret, porte sur tout ce qui précède : l'autovalorisation, devenue impulsion du thésauriseur.

    **Les deux adjectifs ont chacun deux sens.**

    | Adjectif | Premier sens | Second sens |
    | abstrait | qui ne vise aucune chose déterminée (ni un objet, ni une jouissance, ni une œuvre), mais une pure quantité de valeur, la même quelle que soit la marchandise | séparé (sens premier du latin *abstrahere*, tirer hors de) : coupé de tout besoin et de toute vie concrète |
    | misérable | pauvre, indigent : une vie consacrée à faire grossir un nombre est une vie appauvrie | digne de pitié, et en écho à la « misère » du travailleur |

    **« Abstrait ».** Le contenu est le pendant, du côté du capitaliste, du {violet}travail « indifférencié »{/violet} qui fait la valeur : {amber}une quantité sans qualité{/amber}. Et il pourrait être poursuivi par n'importe qui, dans n'importe quelle branche, {coral}sans que rien de la personne y entre{/coral}.

    **« Misérable ».** {yellow}Une vie entière consacrée à faire grossir un nombre est une vie appauvrie{/yellow}, dépourvue de tout contenu humain : {coral}l'homme le plus riche a la fin la plus pauvre{/coral}. Le mot fait aussi écho à la {teal}« subjective indigence, misère et dépendance »{/teal} du travailleur, que le Chapitre VI décrit vers sa fin : {amber}chacun des deux pôles a sa misère, l'un matérielle, l'autre de contenu{/amber}.

    **« Totalement »** interdit de chercher un reste : une fois ôté ce qui relève du simple moyen, {coral}il ne demeure dans l'action du capitaliste aucun contenu qui lui soit propre{/coral}. Le contraste avec le contenu « spécifique et varié » de la phrase précédente est ainsi complet.

    ! « Misérable » n'est pas {red}une injure morale{/red} lancée au capitaliste : c'est {green}un jugement sur le contenu de sa fin{/green}, pauvre en dépit de sa richesse.
