- id: n1863-p20
  title: "« Qui seules peuvent former la base matérielle d'une libre société humaine »"
  notes: |-
    **Les forces productives sont** {coral}**la seule base possible d'une société libre**{/coral}**.** La relative dit la fin à laquelle le renversement est nécessaire, et c'est par elle que le passage reçoit sa justification historique.

    **Qu'est-ce que la base matérielle d'une libre société humaine ?** Une {violet}base{/violet} est ce sur quoi une construction repose sans la constituer : la base matérielle n'est {red}pas la liberté elle-même{/red}, mais {green}ce sans quoi elle ne peut exister{/green}. Elle comprend quatre éléments :

    | Élément | Ce qu'il donne à la liberté |
    | une productivité assez haute | le travail nécessaire à la subsistance de tous n'occupe plus qu'une petite part de la vie, et du temps disponible se libère |
    | l'abondance | la fin de la lutte pour le nécessaire |
    | une production déjà socialisée, appuyée sur la science | une production qui peut être réglée en commun au lieu d'être subie |
    | les capacités des individus | les facultés et les besoins que le développement des forces productives a fait naître en eux |

    ? **Royaume de la liberté** : chez Marx, la part de la vie où l'on ne travaille plus par nécessité ; il commence {teal}« là seulement où l'on cesse de travailler par nécessité ou finalité extérieure »{/teal}, et a pour condition {teal}« la réduction de la journée de travail »{/teal} (*Capital*, livre III, chapitre 48).

    Le mot « libre » a le sens que lui donne le *Manifeste* : une association {teal}« dans laquelle le libre développement de chacun est la condition du libre développement de tous »{/teal} (chapitre II). Et la fin du Chapitre VI reprend presque mot pour mot la formule du texte : la production capitaliste crée {teal}« la base matérielle d'un procès de vie sociale structuré à neuf »{/teal}. {coral}La base matérielle est l'ensemble des conditions de production qu'hérite la société nouvelle, et qu'elle n'a pas à créer.{/coral}

    **Pourquoi « seules » ?** Le mot exclut d'autres candidats : {red}la bonne volonté morale, un décret politique, une révolution des institutions qui laisserait la production en l'état{/red}. La liberté suppose {amber}du temps et de l'abondance{/amber}, et rien d'autre que la productivité du travail ne les donne. {yellow}Une société pauvre peut partager équitablement sa pauvreté ; elle ne peut pas libérer ses membres du travail nécessaire, puisque ce travail absorbe toute leur vie.{/yellow}

    **Marx développe cette thèse en plusieurs lieux.**
    - *L'Idéologie allemande* (1845) : le développement des forces productives est {teal}« une condition pratique préalable absolument indispensable, car, sans lui, c'est la pénurie qui deviendrait générale, et, avec le besoin, c'est aussi la lutte pour le nécessaire qui recommencerait et l'on retomberait fatalement dans la même vieille gadoue »{/teal}.
    - Les *Grundrisse*, fragment sur les machines : la grande industrie fait dépendre la richesse de la science et des machines plutôt que du temps de travail, de sorte que {teal}« le vol de temps de travail d'autrui sur quoi repose aujourd'hui la richesse apparaît comme une base misérable »{/teal}.
    - La préface de 1859 : {teal}« les rapports de production bourgeois sont la dernière forme contradictoire du processus de production sociale »{/teal}.
    - Le *Capital*, livre III : la réduction de la journée de travail, condition du royaume de la liberté.

    **Le Capital rassemble enfin tous ces éléments**, en des termes si proches qu'ils permettent de lire le passage comme son brouillon : le capitaliste n'a {teal}« aucune valeur historique »{/teal} qu'autant qu'il {teal}« fonctionne comme capital personnifié »{/teal} ; c'est à ce titre qu'{teal}« il force les hommes, sans merci ni trêve, à produire pour produire »{/teal}, et qu'il crée {teal}« les conditions matérielles qui seules peuvent former la base d'une société nouvelle et supérieure »{/teal} (livre I, chapitre 24). {coral}La seule justification que Marx accorde au capitaliste est historique et provisoire{/coral} : elle ne vaut que pour la tâche qu'il accomplit sans le vouloir, préparer les conditions de son propre dépassement.

    ! La société libre ne naît pas {red}automatiquement{/red} de l'abondance : l'abondance en est {green}la base, non la cause suffisante{/green}.

    ! « Seules » porte sur {green}les forces productives{/green}, non sur {red}le capitalisme{/red} : Marx ne dit pas que le capitalisme est le seul chemin vers la liberté, mais que la liberté suppose le développement des forces productives, que le capitalisme a historiquement imposé.
