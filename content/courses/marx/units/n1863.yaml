- id: n1863-p38
  title: "« Tout aussi asservi au rapport capitaliste », « sous un certain angle »"
  notes: |-
    **La conclusion de l'argument :** {coral}**le capitaliste est, sous un certain angle, tout aussi asservi que le travailleur**{/coral}**.** Le relatif {teal}« qui »{/teal} a pour antécédent tout ce qui précède : c'est ce contenu misérable et abstrait qui {teal}« fait apparaître »{/teal} le capitaliste comme asservi.

    ? **Asservissement** : la soumission à une fin qui n'est pas la sienne, qu'on n'a pas choisie et qu'on ne peut pas quitter.

    **Pourquoi « tout aussi asservi » ?** Les trois conditions de l'asservissement sont réunies chez le capitaliste :

    | Condition | Chez le capitaliste |
    | la fin n'est pas la sienne | c'est celle du capital, dont il n'est que la personnification |
    | il ne l'a pas choisie | elle lui est imposée par la concurrence, comme une loi coercitive |
    | il ne peut pas la quitter | il cesserait d'être ce qu'il est |

    Le *Capital* le dit en comparant encore le capitaliste et le thésauriseur : {teal}« ce qui chez l'un parait être une manie individuelle est chez l'autre l'effet du mécanisme social dont il n'est qu'un rouage »{/teal} (livre I, chapitre 24). {yellow}La passion de l'avare est sa folie propre ; celle du capitaliste est le rouage d'une machine qui le dépasse.{/yellow} C'est ici que se referme la boucle ouverte par la première phrase : la conscience et la volonté du capitaliste, accordées d'emblée, sont réelles, mais leur contenu leur est imposé, et {coral}il veut librement ce qu'il ne peut pas ne pas vouloir{/coral}. {teal}« Tout aussi »{/teal} dit que, sous ce rapport, la soumission est égale : l'un et l'autre ne sont que des personnifications, l'un du capital, l'autre du travail.

    **Pourquoi « sous un certain angle » seulement ?** Parce que, sous d'autres angles, {red}l'égalité est fausse{/red}. Du point de vue du pouvoir, de la richesse et des conditions de vie, {amber}l'asymétrie demeure entière{/amber} : le capitaliste commande et s'enrichit, le travailleur obéit et s'appauvrit. Du point de vue de l'expérience, elle est même {amber}inversée{/amber} : le capitaliste ne se sent pas asservi, il trouve dans le rapport son « absolue satisfaction ». {green}L'angle qui fait apparaître l'égalité est celui du rapport de chacun à sa fin{/green} : aucun des deux n'agit pour une fin qui soit la sienne. Le verbe {teal}« fait apparaître »{/teal} garde la même prudence : c'est ce que l'analyse fait voir, non ce que chacun vit.

    ! Le texte ne dit pas que capitaliste et travailleur {red}souffrent également{/red} : il dit qu'{green}ils sont également soumis au rapport{/green}, ce qui est tout autre chose.
  passage:
