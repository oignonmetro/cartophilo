- id: n1863-p14
  title: "« Le procès réel de la vie sociale »"
  notes: |-
    **La production est** {coral}**le procès réel de la vie sociale**{/coral}**, et l'incise en donne la raison.** La phrase situe le rapport {teal}« dans la production matérielle »{/teal}, puis précise par une apposition : {teal}« dans le procès réel de la vie sociale »{/teal}. L'incise entre tirets, {teal}« car c'est bien ce qu'est le procès de production »{/teal}, justifie cette appellation.

    **Qu'est-ce que ce procès, concrètement ?** C'est {amber}le mouvement continu par lequel une société produit ce dont elle vit{/amber} : chaque jour, des hommes {yellow}labourent, filent, construisent, transportent{/yellow}, et produisent ainsi leur nourriture, leurs vêtements, leurs logements, leurs outils. Marx y voit, dès *L'Idéologie allemande* (1845), le fondement de toute histoire : {teal}« Le premier fait historique est donc la production des moyens permettant de satisfaire ces besoins, la production de la vie matérielle elle-même »{/teal}.

    **Pourquoi « sociale » ?** Parce que personne ne produit seul : les hommes y entrent dans des rapports déterminés, ici le rapport du capitaliste et du salarié, et __le procès reproduit ces rapports en même temps que les choses__. Le Chapitre VI le dira dans ses dernières pages : {teal}« les rapports de production eux-mêmes sont produits, sont le résultat constamment renouvelé du procès »{/teal}. {yellow}Au sortir de chaque journée, l'ouvrier est aussi démuni qu'en y entrant, tandis que le capital s'est accru{/yellow} : la production fabrique des chaussures, et du même coup la séparation qui oblige l'ouvrier à revenir le lendemain.

    **Pourquoi « réel » ?** Par opposition au {teal}« domaine idéologique »{/teal} de la fin de la phrase, celui des représentations que les hommes se font de leur vie. La préface de la *Contribution à la critique de l'économie politique* (1859) fixe le rapport entre les deux : {teal}« Le mode de production de la vie matérielle conditionne le processus de vie social, politique et intellectuel en général »{/teal}, et {teal}« ce n'est pas la conscience des hommes qui détermine leur être ; c'est inversement leur être social qui détermine leur conscience »{/teal}. Parmi les {teal}« formes idéologiques »{/teal} que la même préface énumère figurent les formes religieuses. {coral}La production est le lieu où la vie sociale se fait, la religion celui où elle se représente.{/coral}

    ? **Thèse matérialiste** : chez Marx, la thèse selon laquelle la production de la vie matérielle conditionne la vie sociale, politique et intellectuelle : la conscience que les hommes ont d'eux-mêmes dépend de leur être social, et non l'inverse.

    **L'incise ne démontre rien.** Le {teal}« car »{/teal} renvoie à une thèse que le texte tient pour acquise, la {violet}thèse matérialiste{/violet} de *L'Idéologie allemande* et de la préface de 1859, et le {teal}« bien »{/teal} marque cette assurance.

    ! « Réel » ne veut pas dire que la religion est {red}une illusion sans effet{/red} : elle est réelle comme représentation, mais {green}elle tient sa forme du procès de production{/green}.
  passage:
    label: "1er mouvement"
    part: "Le rapport capitaliste comme renversement du sujet et de l'objet"
    text: "dans le procès réel de la vie sociale – car c'est bien ce qu'est le procès de production –"
