- id: n1863-p19
  title: "La richesse comme telle, c'est-à-dire les forces productives du travail social"
  notes: |-
    **Ce que le capitalisme impose par force,** {coral}**c'est la création sans limite de la richesse, c'est-à-dire le développement sans limite des forces productives**{/coral}**.**

    **Que veut dire « la richesse comme telle » ?** C'est {violet}la richesse en général{/violet}, sans objet déterminé : {red}non pas tant de blé ou de drap pour tant de besoins{/red}, mais {green}la richesse abstraite, la valeur{/green}, qui n'a pas de limite, puisqu'une somme peut toujours être plus grande. Une société qui produit pour des besoins déterminés n'a pas de raison d'accroître sans cesse sa capacité de produire ; une société qui produit la richesse comme telle en a une, et même une obligation.

    ? **Forces productives** : tout ce qui fait la capacité d'une société à produire : outils, machines, techniques, savoir-faire, organisation du travail, science appliquée, et les travailleurs eux-mêmes.

    ? **Productivité** : la quantité de produit obtenue en un temps de travail donné ; l'accroître, c'est produire plus en moins de temps.

    **Pourquoi le « c'est-à-dire » ?** Le lien passe par la productivité. Pour accroître la survaleur au-delà de ce que permet l'allongement de la journée, le capital doit rendre le travail plus productif : produire plus en moins de temps, par la coopération, la division du travail, les machines, la science appliquée. Le Chapitre VI en fait une loi : {teal}« productivité du travail = maximum de produit avec le minimum de travail »{/teal}, ce qui {teal}« devient une loi dans le mode de production capitaliste »{/teal} (édition citée). {coral}Créer la richesse sans limite et développer sans limite les forces productives sont une seule et même chose vue de deux côtés{/coral} : du côté du but (la valeur) et du côté du moyen (la capacité de produire). Les *Grundrisse* disent ce qu'est la richesse une fois ôtée sa forme capitaliste : {teal}« qu'est-ce que la richesse, sinon l'universalité des besoins, des capacités, des jouissances, des forces productives des individus »{/teal} (chapitre du capital). {amber}Sous la forme de la valeur, le capital poursuit sans le savoir la richesse véritable{/amber}, le développement des forces humaines. {teal}« Impitoyable »{/teal} en dit le prix : ce développement se fait sans égard pour ceux qui l'accomplissent.

    **Pourquoi « forces productives du travail social » ?** Le Chapitre VI définit l'expression quelques pages plus loin : ce sont {teal}« les puissances productives sociales du travail, ou les puissances productives du travail directement social, socialisé (commun) par le moyen de la coopération, la division du travail à l'intérieur de l'atelier, la mise en œuvre de la machinerie, et de façon générale la transformation du procès de production en application consciente des sciences de la nature »{/teal} (édition citée). Ces forces ne sont pas celles d'un individu isolé : {yellow}cent ouvriers qui coopèrent dans une fabrique, avec des machines conçues par des ingénieurs, produisent infiniment plus que cent artisans séparés{/yellow}, et ce surcroît ne vient d'aucun d'eux en particulier, mais de leur combinaison.

    **La désignation a deux raisons.** La première est de dire __à qui ces forces appartiennent en vérité__. Dans le capitalisme, poursuit le même passage, {teal}« tout cela se présente comme puissance productive du capital, et non pas comme puissance productive du travail »{/teal} : puisque c'est le capitaliste qui réunit les ouvriers et achète les machines, la productivité de leur coopération semble venir de lui. {coral}Dire « forces productives du travail social », c'est rendre au travail ce que le renversement attribue au capital.{/coral} La seconde raison tient __à l'avenir__ : des forces qui sont celles du travail combiné ne peuvent être appropriées que par les travailleurs associés, non par chacun séparément. {amber}Le mot « social » annonce la forme de la société libre{/amber} : une société où la production déjà sociale serait aussi réglée en commun.

    ! « Forces productives » ne désigne pas {red}seulement les machines{/red} : ce sont {green}toutes les capacités de produire{/green}, dont la coopération des hommes et la science font partie.
