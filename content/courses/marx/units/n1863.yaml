- id: n1863-p34
  title: "« La finalité déterminante, dominante et générale du capitaliste »"
  notes: |-
    **La valorisation est** {coral}**la fin de toute l'activité du capitaliste**{/coral}**, et le « donc » le conclut de ce qui précède.**

    **Les trois adjectifs disent trois choses différentes.**

    | Adjectif | Ce qu'il dit de la valorisation |
    | déterminante | elle décide de tout le reste : de ce qu'on produit, de la manière de le produire, de la branche où le capitaliste investit, puisque le capital est indifférent à la nature de ce qu'il fabrique |
    | dominante | les autres fins du capitaliste (son goût pour un métier, le contenu « spécifique et varié » de sa fonction de directeur, sa consommation personnelle) lui sont subordonnées et cèdent devant elle |
    | générale | elle vaut pour toutes ses opérations et pour tous les capitalistes, quelle que soit la branche |

    Le *Capital* en donne la raison : {teal}« la concurrence impose les lois immanentes de la production capitaliste comme lois coercitives externes à chaque capitaliste individuel »{/teal} (livre I, chapitre 24). {yellow}Celui qui ne vise pas la valorisation est éliminé par ceux qui la visent.{/yellow}

    **En quoi ce qui précède le démontre-t-il ?** Le {teal}« donc »{/teal} tire la conclusion de deux prémisses établies plus haut :
    - __première prémisse__, posée dès la première phrase : les fonctions du capitaliste ne sont que celles du capital, de la valeur qui se valorise ;
    - __seconde prémisse__, établie juste avant : le procès de travail, seul lieu où son activité a un contenu propre, n'est qu'un moyen de la valorisation.

    {coral}Si tout ce que fait le capitaliste est soit fonction du capital, soit moyen de la valorisation, alors la valorisation est la fin de toute son activité.{/coral} La conclusion est rigoureuse, mais {amber}seulement à partir de ces prémisses{/amber}, dont la première repose sur l'analyse du capital menée ailleurs. Le *Capital* avait énoncé la même thèse en termes presque identiques : le capitaliste ne fonctionne comme tel qu'autant que {teal}« l'appropriation toujours croissante de la richesse abstraite est le seul motif déterminant de ses opérations »{/teal} (livre I, chapitre 4).

    ! « Finalité du capitaliste » ne veut pas dire {red}un but qu'il se choisit{/red} : c'est {green}la fin que lui impose le rapport{/green}, et qu'il fait sienne.
