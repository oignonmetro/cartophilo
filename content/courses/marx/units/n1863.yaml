- id: n1863-o1
  title: "Ce que le texte démontre, et ce qu'il laisse sans preuve"
  notes: |-
    **Chaque mouvement a sa manière d'établir ses thèses, et son point faible.** Une explication de texte doit dire non seulement ce que le texte affirme, mais {amber}la force exacte de ce qui l'appuie{/amber} : une déduction, une analogie, une thèse supposée.

    | Partie | Ce qui appuie la thèse | Ce qui reste sans preuve |
    | 1er mouvement | une déduction (« par conséquent ») complétée par une prémisse (« puisque »), puis une identification avec la religion | que le capitaliste ne soit que du capital personnifié : posé, non démontré ; l'identité avec la religion repose sur la thèse matérialiste, supposée par l'incise |
    | 2e mouvement | un raisonnement (liberté, abondance, développement sans limite, capital), puis une analogie religieuse | la prémisse qu'une société libre suppose une base matérielle développée reste implicite ; l'analogie rend la nécessité plausible sans la prouver |
    | 3e mouvement | une objection concédée, une réponse par subordination, un « donc » rigoureux à partir de ses prémisses | le passage de la souffrance à la rébellion est affirmé « d'emblée », alors que la souffrance peut aussi bien produire la résignation |

    **Le premier mouvement est un moment de structure.** Les deux premières phrases réduisent les protagonistes à des fonctions ; la troisième en tire la conséquence. {pink}La dépendance est réelle mais incomplète{/pink} : la réduction des personnes à leurs fonctions ne suffit pas à faire de leur rapport la domination d'une chose ; il faut la prémisse ajoutée par « puisque », et la parenthèse. La quatrième phrase ne prouve pas davantage : {amber}elle nomme et elle situe{/amber}.

    **Le deuxième mouvement change de point de vue**, et le texte le marque lui-même. Seule la première phrase y contient un raisonnement propre ; la deuxième appuie la nécessité sur une analogie ; la troisième ne prouve rien, elle nomme. Mais en nommant l'aliénation et en la rapportant à l'être humain plutôt qu'au seul ouvrier, {coral}elle rend possible le troisième mouvement{/coral}.

    **Le troisième mouvement est le plus argumenté**, mais {amber}l'ordre de présentation n'y suit pas l'ordre des raisons{/amber} : la supériorité du travailleur suppose que le capitaliste soit lui aussi pris dans l'aliénation, ce que seule la dernière phrase établit pleinement. Le texte affirme donc d'abord la supériorité du travailleur, et justifie ensuite ce qui la rend pensable.

    **Un dernier point peut être discuté :** on serait tenté de considérer que {red}la souffrance suffit à éclairer{/red} ; le texte le pose « d'emblée », alors que Marx lui-même, dans le *Capital*, note qu'il a fallu {teal}« du temps et de l'expérience »{/teal} aux ouvriers pour distinguer la machine de son emploi capitaliste. {green}La lucidité que donne la position n'est donc qu'une disposition{/green}, que l'histoire doit encore former.

    ! Relever qu'un argument est {red}posé et non démontré{/red} n'est pas réfuter le texte : c'est {green}mesurer exactement ce qu'il établit{/green}, ce qu'attend une explication de concours.
  passage:
    label: "Prolongement"
  points:
  - id: n1863-o1-1
