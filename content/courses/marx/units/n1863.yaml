- id: n1863-p24
  title: "« Dans cette mesure », le travailleur au-dessus du capitaliste"
  notes: |-
    **Le troisième mouvement compare les deux pôles de l'aliénation, et commence par un paradoxe :** {coral}**le travailleur, qui subit, se tient au-dessus du capitaliste, qui commande**{/coral}**.** Il procède en deux temps : l'{amber}asymétrie vécue{/amber} des deux pôles (cette phrase), puis l'{amber}asservissement commun{/amber}, établi en répondant à une objection (les trois phrases suivantes).

    **Dans quelle mesure faut-il l'entendre ?** La phrase s'ouvre sur une restriction, {teal}« dans cette mesure »{/teal}, c'est-à-dire __en tant que le rapport est un procès d'aliénation, et seulement sous ce rapport__. Le travailleur n'est supérieur {red}ni en pouvoir, ni en richesse, ni en bien-être, ni en culture{/red}, domaines où le capitaliste l'emporte évidemment. Il l'est {green}dans son rapport à l'aliénation elle-même{/green}, et cette supériorité a trois aspects :

    | Aspect | En quoi le travailleur est au-dessus |
    | la lucidité | il perçoit le rapport pour ce qu'il est, un asservissement, là où le capitaliste n'y voit que l'ordre normal des choses |
    | la position historique | celui qui ne trouve pas sa satisfaction dans le rapport est celui qui peut le dépasser : le « point de passage » ne sera franchi que par lui |
    | l'humanité | il n'a pas lié sa vie au contenu « totalement misérable et abstrait » que le texte reconnaîtra comme celui du capitaliste |

    **« D'emblée »**, répété deux fois dans la phrase, dit d'où vient cette supériorité : {red}non d'un mérite, d'une éducation ou d'une prise de conscience politique{/red}, mais {green}de la seule position de chacun dans le procès{/green}, avant toute réflexion. Elle est donnée avec la place occupée. Qu'on pense à {yellow}un homme bien installé dans une institution injuste : c'est souvent celui qui en pâtit, non celui qui en profite, qui voit d'abord qu'elle est injuste{/yellow}, et il n'a pas besoin pour cela d'être plus intelligent que l'autre.

    **L'ordre de présentation ne suit pas l'ordre des raisons.** Pour que le travailleur soit « au-dessus », il faut que le capitaliste soit lui aussi pris dans l'aliénation : le texte l'affirme ici, mais ne l'établira pleinement qu'à la dernière phrase. {amber}Il pose d'abord la supériorité, et justifie ensuite ce qui la rend pensable.{/amber}

    ! « Au-dessus » n'est pas {red}une supériorité morale{/red} : le travailleur n'est pas meilleur que le capitaliste, {green}il est mieux placé pour voir le rapport{/green}.
