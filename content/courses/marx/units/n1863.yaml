- id: n1863-p12
  title: "« De simples résultats du procès de production »"
  notes: |-
    **Ce qui domine les travailleurs n'est rien d'autre que** {coral}**ce que le procès de production a lui-même produit**{/coral}**.**

    **La fin de la phrase demande une lecture exacte.** Ce ne sont {red}pas les travailleurs{/red} qui sont « de simples résultats du procès de production », mais {green}les marchandises qui deviennent des moyens de domination sur eux{/green} : le sujet de {teal}« sont »{/teal} est {teal}« les marchandises »{/teal}, et {teal}« sur les travailleurs »{/teal} complète {teal}« moyens de domination »{/teal}, la parenthèse s'intercalant entre les deux. Le dernier membre, {teal}« les produits de ce dernier »{/teal}, redit la même chose en termes plus simples : {teal}« ce dernier »{/teal} est le procès de production.

    **Le mot « simples » porte l'argument.** Ces choses n'ont {pink}aucune puissance propre{/pink} et {pink}aucune origine extérieure{/pink} : elles sortent du procès même où travaillent ceux qu'elles dominent. Ce n'est {red}ni une nature hostile, ni une force surnaturelle{/red} qui domine les travailleurs, mais {green}leur propre travail{/green}, sous la forme de ses résultats.

    **C'est ce membre de phrase qui justifie le « puisque ».** On peut décomposer le raisonnement en trois étapes :

    | Étape | Ce qui est posé |
    | premièrement | les travailleurs sont dominés par des marchandises, moyens de production et de subsistance |
    | deuxièmement | ces marchandises sont des résultats du procès de production, c'est-à-dire du travail passé |
    | troisièmement | la domination est donc celle de leur propre produit, du travail mort sur le travail vivant |

    Et ce produit ne tient pas sa domination de lui-même, mais {coral}de sa fonction de capital{/coral}, comme l'a précisé la parenthèse. La phrase boucle ainsi sur les trois couples qu'elle avait posés : le « puisque » ne fait pas que confirmer le « par conséquent », {amber}il dit d'où la chose tient le pouvoir qu'elle exerce{/amber}.

    ! On ne lira pas « les travailleurs [...] sont de simples résultats » : la parenthèse coupe la phrase, et {green}le sujet de « sont » est « les marchandises »{/green}.
