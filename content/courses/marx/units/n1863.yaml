- id: n1863-p18
  title: "« Imposer par force, aux dépens du plus grand nombre »"
  notes: |-
    **Le développement de la richesse** {coral}**s'impose contre ceux qui le produisent**{/coral}**.** Les deux compléments disent comment le passage s'accomplit : {teal}« par force »{/teal}, et {teal}« aux dépens du plus grand nombre »{/teal}.

    ? **Surtravail** : le travail que l'ouvrier fournit au-delà du temps nécessaire pour reproduire la valeur de son salaire ; la survaleur en est le produit.

    ? **Production pour la production** : une production qui {teal}« ne se lie pas à une limite prédéterminante et prédéterminée des besoins »{/teal}, une {teal}« production comme fin en soi »{/teal} (Chapitre VI, édition citée).

    **Pourquoi « par force » ?** Parce que {amber}personne ne choisirait librement ce que le capital impose{/amber} : travailler au-delà de ce qu'exigent ses propres besoins, pour accroître une richesse qui ne lui revient pas. Les sociétés antérieures produisaient pour des besoins déterminés, et s'arrêtaient quand ils étaient satisfaits. Le capital, lui, est une production pour la production, dit le Chapitre VI plus loin ; et cette production suppose une {teal}« contrainte au surtravail »{/teal}, qui pousse à un {teal}« volume de production excédant la mesure des besoins traditionnels du travailleur »{/teal} (édition citée). La force {red}n'est pas d'abord la violence d'un homme{/red} : elle s'exerce, précise le même passage, {teal}« indépendamment de la volonté du capitaliste individuel »{/teal}, {green}comme une loi que la concurrence impose à tous{/green}. {coral}Le capitaliste force l'ouvrier parce que le capital le force lui-même{/coral}, ce qui rejoint les deux personnifications du premier mouvement.

    **Pourquoi « aux dépens du plus grand nombre » ?** Le {violet}plus grand nombre{/violet}, ce sont les producteurs, les travailleurs, face au petit nombre de ceux qui possèdent les moyens de production. Le Chapitre VI décrit plus loin ce qu'ils paient : une {teal}« production en opposition aux producteurs, et sans égard pour eux »{/teal}, où {teal}« le producteur effectif »{/teal} n'est qu'un {teal}« pur moyen de production »{/teal}, et où la richesse matérielle se développe {teal}« en opposition à l'individu humain et à ses dépens »{/teal}. Le coût est triple :

    | Coût | En quoi il consiste |
    | le surtravail | des journées prolongées et intensifiées au-delà de ce que demandent les besoins de l'ouvrier |
    | la mutilation | la division manufacturière « fait du travailleur un infirme et une monstruosité » (*Capital*, livre I, chapitre 12) |
    | l'appauvrissement | « L'ouvrier devient d'autant plus pauvre qu'il produit plus de richesse » (*Manuscrits de 1844*) |

    {coral}La richesse se développe donc par le plus grand nombre, mais contre lui.{/coral}

    **La formule écarte deux lectures opposées.** On serait tenté de considérer que Marx, en déclarant ce renversement nécessaire, {red}en fait l'éloge{/red} ; mais il en nomme aussitôt les victimes. On serait tenté à l'inverse de n'y voir {red}qu'une dénonciation{/red} ; mais le coût est payé pour une fin, la base d'une société libre, {green}qui profitera précisément au plus grand nombre{/green}. On peut entendre enfin, ce que le texte ne dit pas, une ironie à l'égard de la formule utilitariste du « plus grand bonheur du plus grand nombre ».

    **Cette thèse prolonge le Manifeste du parti communiste** (1848), où {sky}Marx et Engels{/sky} affirment que {teal}« la bourgeoisie a joué dans l'histoire un rôle éminemment révolutionnaire »{/teal} et qu'elle a créé, en un siècle à peine, des forces productives {teal}« plus colossales que l'avaient fait toutes les générations passées prises ensemble »{/teal}. Le *Manifeste* constate le fait et en célèbre presque la puissance ; {coral}le texte étudié en donne la raison et le prix{/coral}.

    ! « Par force » ne désigne pas {red}seulement la violence directe{/red} : c'est {green}la contrainte d'un rapport{/green}, que la concurrence impose au capitaliste lui-même.
