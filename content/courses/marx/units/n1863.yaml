# Unité de texte (voir content/textes.md, « Un paragraphe en parties ») :
# Marx, Résultats du procès de production immédiat (« Chapitre VI » du
# Capital, livre I), fin du paragraphe 103, « Les fonctions qu'exerce le
# capitaliste… » à « … sur le pôle opposé, que le travailleur. », dans la
# traduction de Gérard Cornillet, Laurent Prost et Lucien Sève (Éditions
# sociales, 2010 ; PDF Cairn de l'utilisateur, texte d'entraînement fourni en
# ODT). Repères de page du manuscrit retirés. Le paragraphe est découpé en
# trois mouvements (1er à 3e mouvement), chacun en plusieurs leçons qui en citent une
# portion à la suite. Sans commentaire fourni : l'unité suit l'explication
# écrite dans le Claude Doc de l'utilisateur, vérifiée point par point.

id: n1863
title: "Le capitaliste, capital personnifié"
subtitle: "Chapitre VI. Résultats du procès de production immédiat, §103"
icon: page
color: coral
intro: |-
  Fin du paragraphe 103 des *Résultats du procès de production immédiat* (le « Chapitre VI » du *Capital*, rédigé vers 1863-1864). Marx y montre que la domination du capitaliste sur le travailleur est en vérité **la domination de la chose sur l'homme**, un renversement du sujet et de l'objet, le même que celui que la religion représente ; qu'il est **le passage historiquement nécessaire** au développement des forces productives, base d'une société libre ; et qu'il asservit, sous un certain angle, **le capitaliste autant que le travailleur**, qui se tient pourtant au-dessus de lui.
lessons:
- id: n1863-i1
  title: "Le texte, sa place et son plan"
  notes: |-
    **Le texte est la fin du paragraphe 103 du** {sky}**« Chapitre VI »**{/sky} **du Capital.** Ce chapitre, les {sky}*Résultats du procès de production immédiat*{/sky}, est un manuscrit que {sky}Marx{/sky} rédige vers {amber}1863-1864{/amber} pour clore le livre I du *Capital*, et qu'il écarte finalement de l'ouvrage publié en 1867 ; d'où son autre nom, « Chapitre VI inédit ». Il est cité ici dans la traduction de {sky}Cornillet, Prost et Sève{/sky} (Éditions sociales, 2010), qui rend l'allemand *Mehrwert* par {violet}« survaleur »{/violet}, là où les traductions plus anciennes disent « plus-value ».

    **La production produit la domination.** Quelques lignes plus haut, dans le même paragraphe, Marx écrit : {teal}« {/teal}En réalité, {teal}la domination des capitalistes sur les travailleurs n'est rien d'autre que la domination des conditions du travail autonomisées »{/teal}, c'est-à-dire des {violet}moyens de production{/violet} (machines, bâtiments, matières) et des {violet}moyens de subsistance{/violet} (ce dont l'ouvrier vit), devenus indépendants de celui qui travaille. Il ajoute que, dans l'échange, capitaliste et travailleur ne {amber}se font face que comme deux vendeurs de marchandises{/amber} (l'un vend de l'argent, l'autre sa capacité de travail) ; c'est seulement __dans la production que le rapport devient__ {coral}__un rapport de domination__{/coral}. Le passage étudié tire les conséquences de ce constat.

    **Le passage se lit en trois mouvements** : **le premier mouvement** {coral}**décrit le rapport capitaliste**{/coral}, **le deuxième mouvement** {coral}**en montre la nécessité historique**{/coral}, **le troisième mouvement** {coral}**en compare les deux pôles**{/coral}.

    | Mouvement | Lieu | Ce qui s'y joue |
    | réduire capitaliste et travailleur à des fonctions, puis nommer leur rapport | 1er mouvement | La domination du capitaliste est celle de la chose sur l'homme : un renversement du sujet et de l'objet, le même que celui que la religion représente. |
    | situer ce renversement dans l'histoire, puis le nommer aliénation | 2e mouvement | Le renversement est le passage nécessaire au développement des forces productives, seule base d'une société libre : c'est le procès d'aliénation du travail humain. |
    | comparer les deux pôles de l'aliénation | 3e mouvement | Le travailleur, qui souffre du rapport, se tient au-dessus du capitaliste, qui s'y satisfait ; et le capitaliste, dont l'activité réelle n'est qu'un moyen de la valorisation, est tout aussi asservi. |

    ! Le texte ne fait pas du capitaliste {red}un innocent{/red} : il déplace la critique {green}de l'individu vers le rapport social{/green} dont l'individu n'est que le support.
