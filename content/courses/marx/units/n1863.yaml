- id: n1863-p9
  title: "Le travail mort sur le travail vivant, le produit sur le producteur"
  notes: |-
    **La domination de la chose se redit en deux autres couples :** {coral}**le travail mort domine le travail vivant, le produit domine le producteur**{/coral}**.** Les accolades de {teal}« le {travail} vivant »{/teal} signalent un mot que l'édition ajoute pour la clarté de la phrase.

    **Pourquoi parler de « travail mort » ?** Parce que les choses qui dominent ne sont pas des choses naturelles : machines, bâtiments, matières transformées, subsistances sont tous {amber}des produits du travail{/amber}. Un travail a été dépensé pour les faire ; il est désormais achevé, fixé dans un objet qui le conserve sous forme de valeur, {yellow}comme une photographie conserve un geste terminé{/yellow}. Il est {violet}« mort »{/violet} en ce sens précis : {coral}il n'agit plus, il ne peut plus créer de valeur nouvelle{/coral}, il ne fait que transmettre au produit la valeur qu'il contient. Le {violet}travail « vivant »{/violet} est au contraire le travail en train de se faire, l'activité présente d'un homme dans l'atelier.

    **Pourquoi le premier domine-t-il le second ?** Parce que, __devenu capital, le travail passé ne sert plus qu'à absorber du travail présent__ : la machine n'a de valeur pour le capitaliste que si des ouvriers la font tourner, et elle impose à ces ouvriers {yellow}son rythme, sa durée, ses gestes{/yellow}. Le *Capital* le dit au chapitre sur la fabrique : le moyen de travail devenu automate {teal}« se dresse devant l'ouvrier pendant le procès de travail même sous forme de capital, de travail mort qui domine et pompe sa force vivante »{/teal}, et il résume : {teal}« Dans la manufacture et le métier, l'ouvrier se sert de son outil ; dans la fabrique il sert la machine »{/teal} (livre I, chapitre 15). {coral}Le travail d'hier commande au travail d'aujourd'hui{/coral}, non par une propriété de la matière, mais parce qu'il a pris la forme du capital.

    **Le produit domine le producteur parce qu'il ne lui revient pas.** Le {violet}producteur{/violet} est l'ensemble des travailleurs ; le {violet}produit{/violet}, ce qu'ils ont fait, y compris les machines et les matières qui servent ensuite à les faire travailler. Sorti de leurs mains, le produit appartient au capitaliste, qui a acheté le travail, et __il revient vers les travailleurs sous la forme du capital qui les emploie__. Le cercle se referme : {amber}ce que les ouvriers produisent aujourd'hui deviendra demain le capital qui commandera leur travail{/amber}. Qu'on pense à {yellow}la chaîne de montage{/yellow} : sa vitesse fixe les gestes de l'ouvrier, et elle a été construite par des travailleurs. La domination n'est donc pas celle d'une puissance venue d'ailleurs, mais {coral}celle des propres produits du travail{/coral}, ce qui la rend plus intime et plus paradoxale qu'une oppression ordinaire.

    **La formule prolonge les Manuscrits de 1844**, où Marx partait d'un fait de l'économie : {teal}« l'objet que le travail produit, son produit, l'affronte comme un être étranger, comme une puissance indépendante du producteur »{/teal} (premier manuscrit). En 1844, Marx constatait que le produit se dresse contre l'ouvrier ; vingt ans plus tard, il dispose d'une théorie du capital qui dit {amber}comment{/amber} le produit domine : le travail passé, devenu capital constant, ne domine que parce qu'il sert à absorber du travail vivant et à en extraire de la survaleur.

    **Les trois couples ne disent pas trois choses différentes :** ils redisent {coral}le même renversement sous trois angles{/coral} (ce qui domine est une chose, cette chose est du travail passé, ce travail est le produit de ceux qu'il domine), et préparent le mot « renversement » de la phrase suivante.

    ! Le travail mort n'est pas {red}un travail sans valeur{/red} : il garde sa valeur, mais {green}il ne peut plus en créer de nouvelle{/green}.
