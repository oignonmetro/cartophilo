- id: n1863-p5
  title: "Le travail, « substance qui crée et multiplie la valeur »"
  notes: |-
    **Le travail appartient au capitaliste** {coral}**en tant que substance de la valeur**{/coral}**.** Le sujet de {teal}« il appartient »{/teal} est encore le travail : {teal}« alors que »{/teal} oppose les deux propriétaires du même travail, l'ouvrier, qui en a la peine, et le capitaliste, qui en a {amber}la substance{/amber}.

    ? **Substance (de la valeur)** : {coral}ce dont la valeur est faite{/coral}, {yellow}comme le bois est la matière d'une table{/yellow}. Pour Marx, c'est le travail : {teal}« Nous connaissons maintenant la substance de la valeur : c'est le travail »{/teal}, les marchandises n'étant que des {teal}« cristaux de cette substance sociale commune »{/teal} (*Capital*, livre I, chapitre 1). Il s'agit {red}non du travail concret{/red} (tisser, forger), mais {green}du travail pris comme simple dépense de temps humain{/green}, mesurable et comparable d'un métier à l'autre.

    **Le travail appartient donc au capitaliste sous un troisième aspect.** Il ne lui appartient {pink}ni comme activité concrète{/pink}, qui ne l'intéresse pas pour elle-même, {pink}ni comme peine{/pink}, qui reste à l'ouvrier, mais {green}comme ce qui fait la valeur{/green} : dans le travail de l'ouvrier, le capitaliste possède la matière même de sa richesse. Le même travail se trouve ainsi __partagé entre deux propriétaires selon deux de ses aspects__ : la peine pour l'un, la substance pour l'autre.

    **Il faut lire la phrase avec exactitude :** {red}ce n'est pas le capitaliste{/red} qui « crée et multiplie la valeur », {green}c'est le travail{/green}, en tant que substance ; le capitaliste ne fait que se l'approprier. Les deux verbes désignent deux opérations distinctes :

    | Verbe | Ce qu'il désigne | Exemple |
    | créer | ajouter au produit une valeur nouvelle, proportionnelle au temps de travail dépensé | en changeant du fil en tissu pendant dix heures, l'ouvrier ajoute la valeur de dix heures |
    | multiplier | produire plus de valeur qu'il n'en a coûté pour acheter la force de travail | payé six heures, il en travaille dix : quatre heures de survaleur |

    Le premier verbe dit que le travail est {coral}source de valeur{/coral}, le second qu'il est {coral}source de plus de valeur qu'il n'en coûte{/coral} ; c'est par le second que l'argent avancé revient accru. {amber}Le travail est donc la seule source de l'accroissement que le capitaliste attribue à son capital.{/amber}

    ! « Substance » n'a pas ici {red}le sens métaphysique{/red} d'un être qui existe par soi : il désigne {green}la matière dont la valeur est faite{/green}, le travail humain dépensé.
