- id: n1863-p30
  title: "« Un contenu spécifique et varié »"
  notes: |-
    **La concession s'achève :** {coral}**l'activité du capitaliste a un contenu concret**{/coral}**, qui lui vient du procès de travail.**

    **Pourquoi ce contenu ?** Parce que __le procès de travail, à la différence du procès de valorisation, est toujours concret__. {yellow}Diriger une filature n'est pas diriger une brasserie{/yellow} : il faut connaître des matières, des machines, des délais, des qualités, propres à chaque branche.

    **Chaque mot pèse.**
    - {teal}« Spécifique »{/teal} : le contenu dépend de {amber}la valeur d'usage produite{/amber}, du fil ou de la bière.
    - {teal}« Varié »{/teal} : la fonction comprend des tâches multiples, {yellow}acheter les moyens de production de bonne qualité, organiser les postes, contrôler l'exécution, assurer la continuité du travail{/yellow}, dont le Chapitre VI donne le détail quelques pages plus haut.
    - {teal}« Reçoit »{/teal} : ce contenu {red}ne vient pas du capitaliste en tant que tel{/red}, il {green}lui est donné de l'extérieur, par le procès de travail{/green}.
    - {teal}« En fait »{/teal} : une {violet}concession{/violet} sincère ; Marx ne nie pas que cette activité soit réelle et parfois exigeante.

    **Le contraste avec la phrase suivante est voulu.** Le contenu {green}« spécifique et varié »{/green} vient du côté du travail, le seul côté où l'activité du capitaliste ressemble à celle d'un chef d'orchestre, et que toute production collective connaîtrait. Du côté de la valorisation, au contraire, le contenu sera dit {pink}« totalement misérable et abstrait »{/pink}, toujours le même quelle que soit la branche : faire plus d'argent.

    | Côté | Contenu de l'activité | Propre au capitaliste ? |
    | le procès de travail | spécifique et varié | non : toute production collective le connaîtrait |
    | le procès de valorisation | misérable et abstrait | oui : c'est ce qui fait de lui un capitaliste |

    {coral}L'objection concédée prépare ainsi sa propre réponse : le contenu riche de l'activité du capitaliste n'appartient pas à ce qui fait de lui un capitaliste, et ce qui le fait capitaliste n'a aucun contenu.{/coral}

    ! La concession n'est pas {red}une contradiction{/red} dans le texte : {green}elle situe le contenu concret du côté du travail{/green}, pour mieux montrer que la fin du capitaliste en est dépourvue.
  passage:
    label: "3e mouvement"
    part: "Les deux pôles de l'aliénation"
