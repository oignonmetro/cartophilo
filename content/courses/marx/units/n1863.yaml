- id: n1863-p32
  title: "La valeur d'usage, « simple porteur de sa valeur d'échange »"
  notes: |-
    **La subordination du travail se comprend par celle du produit :** {coral}**l'utilité d'une marchandise n'est que le support de sa valeur**{/coral}**.**

    ? **Valeur d'usage, valeur d'échange** : la valeur d'usage est l'utilité concrète d'une chose ({yellow}un manteau tient chaud{/yellow}) ; la valeur d'échange, ce qu'elle vaut contre d'autres marchandises.

    **Pourquoi la valeur d'usage n'est-elle qu'un « porteur » ?** Pour le marchand, {red}l'utilité n'est pas le but{/red} : {yellow}il ne vend des manteaux que parce qu'ils se vendent{/yellow}. Mais {green}elle reste indispensable{/green}, car une chose inutile ne trouve pas d'acheteur, et sa valeur ne se réalise jamais. L'utilité est donc ce qui porte la valeur, {yellow}comme un camion porte une marchandise sans être ce qu'on veut livrer{/yellow}. Le *Capital* le dit du capitaliste : {teal}« La valeur d'usage ne doit donc jamais être considérée comme le but immédiat du capitaliste, pas plus que le gain isolé ; mais bien le mouvement incessant du gain toujours renouvelé »{/teal} (livre I, chapitre 4). Le Chapitre VI ajoute que, dans la production de masse, la relation du produit {teal}« à la satisfaction des besoins du producteur »{/teal} apparaît {teal}« comme quelque chose de tout à fait contingent, indifférent et inessentiel »{/teal} (édition citée).

    **La comparaison, introduite par « exactement comme »**, met en regard deux subordinations de même forme, l'une dans la production, l'autre dans le produit :

    | Ce qui est subordonné | Ce à quoi il est subordonné | Ce qu'il en est |
    | le procès de travail | le procès de valorisation | un moyen |
    | la valeur d'usage | la valeur d'échange | un porteur |

    Le rapprochement est {green}plus qu'une analogie{/green}, car les deux couples se correspondent terme à terme : __le procès de travail produit des valeurs d'usage, le procès de valorisation produit de la valeur__. {coral}Le procès de travail est au procès de valorisation ce que la valeur d'usage est à la valeur d'échange : un support concret indispensable, mais qui n'est pas la fin.{/coral} L'argument s'appuie sur la distinction que Marx a établie dès le début du *Capital*, entre les deux faces de la marchandise.

    ! La valeur d'usage n'est pas {red}supprimée{/red} par le capital : elle est {green}conservée comme support{/green}, puisque sans elle la valeur ne se réaliserait pas.
