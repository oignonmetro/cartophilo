- id: n1863-p21
  title: "« Cette forme antagonique » : pourquoi il faut en passer par elle"
  notes: |-
    **La nécessité du renversement se redit en d'autres termes :** {coral}**il faut traverser la forme antagonique**{/coral}**.** Le démonstratif {teal}« cette »{/teal} renvoie au renversement qui vient d'être décrit : {amber}la forme antagonique est le renversement considéré comme rapport entre deux classes{/amber}. {teal}« En passer par »{/teal} dit encore le passage, la traversée.

    ? **Forme antagonique** : une organisation de la production fondée sur l'opposition des intérêts des deux pôles qu'elle met en rapport : ce que gagne l'un, l'autre le perd.

    **Pourquoi le capitalisme en est une.** __Ce que gagne le capital, le travail le perd__, puisque la survaleur est le travail que l'ouvrier fournit au-delà de ce qui lui est payé. {yellow}Chaque heure de plus que l'ouvrier travaille sans être payé est une heure de plus pour le capital.{/yellow}

    **Pourquoi est-il nécessaire d'en passer par elle ?** Le texte {pink}le suppose plus qu'il ne le démontre{/pink}, mais les raisons se reconstituent à partir de ce qui précède :

    | Raison | Ce qu'elle établit |
    | la fin poursuivie | un développement sans limite exige une production dont la fin ne soit pas les besoins des producteurs, faute de quoi ils s'arrêteraient une fois ces besoins satisfaits ; or une production dont le produit va à d'autres que les producteurs est antagonique par définition |
    | le moteur | c'est l'antagonisme même, la course à la survaleur et la concurrence entre capitalistes, qui pousse à accroître sans cesse la productivité |
    | l'issue | cette forme produit elle-même les conditions de son dépassement |

    La fin du Chapitre VI dit cette issue : la production capitaliste, {teal}« dans les forces productives du travail qu'elle développe en contradiction au travailleur »{/teal}, crée {teal}« les conditions réelles d'un mode de production nouveau, qui dépasse la forme antagonique du mode de production capitaliste »{/teal} (édition citée). La préface de 1859 en fait une loi de l'histoire : les forces productives qui se développent au sein de la société bourgeoise {teal}« créent en même temps les conditions matérielles pour résoudre cette contradiction »{/teal}.

    {coral}La nécessité est donc, une fois encore, conditionnelle et provisoire : nécessaire pour une fin, et seulement jusqu'à ce qu'elle soit atteinte.{/coral}

    ! « Antagonique » ne veut pas dire {red}conflictuel par accident{/red}, du fait de patrons durs ou d'ouvriers revendicatifs : {green}l'opposition est inscrite dans la forme même{/green} de la production.
