- id: n1863-p25
  title: "Le capitaliste « enraciné » dans l'aliénation, et satisfait"
  notes: |-
    **La justification porte d'abord sur le capitaliste :** {coral}**il ne voit pas l'aliénation, parce qu'il y est enraciné et qu'elle le satisfait**{/coral}**.**

    **« Enraciné »** dit que __toute son existence tient à ce procès__ : son revenu, sa position sociale, son pouvoir, et jusqu'à son identité, puisqu'il n'est capitaliste qu'en tant que le capital se valorise par lui. Il ne peut pas en sortir sans cesser d'être ce qu'il est, {yellow}comme une plante qu'on arrache meurt{/yellow}. {coral}Il n'a donc aucun point de vue extérieur d'où juger le procès.{/coral}

    **« Trouve en lui son absolue satisfaction »** dit que __le procès accomplit exactement ce qu'il veut__ : sa fin est la valorisation, et le procès est la valorisation, de sorte qu'il n'y a {amber}aucun écart entre son désir et la réalité{/amber}, aucune expérience qui puisse l'inciter à douter. La satisfaction est {teal}« absolue »{/teal} comme la fin qu'elle comble, celle que le texte appellera plus loin {teal}« l'impulsion et le contenu absolus de son action »{/teal} : {yellow}une impulsion sans limite trouve dans un procès sans fin une satisfaction sans reste{/yellow}.

    **Pourquoi cette satisfaction le place-t-elle au-dessous ?** Parce qu'{coral}être satisfait dans l'aliénation, c'est ne pas la reconnaître comme telle{/coral} : celui qui s'y trouve bien la prend pour la vie normale. {sky}La Sainte Famille{/sky} (1845, avec Engels) le disait déjà de la classe possédante, qui {teal}« se sent à son aise dans cette aliénation »{/teal} et {teal}« y trouve une confirmation »{/teal}. Le paradoxe est ironique : la satisfaction du capitaliste est {green}réelle{/green}, mais elle porte sur un contenu que le texte qualifiera de {pink}« totalement misérable et abstrait »{/pink}. {amber}Être pleinement satisfait d'une fin misérable, c'est la marque d'un asservissement qui ne se sait pas.{/amber}

    ! La satisfaction du capitaliste n'est pas {red}feinte{/red} ni {red}coupable{/red} : elle est sincère, et {green}c'est précisément ce qui l'aveugle{/green}.
