- id: n1863-p15
  title: "« Représenté par la religion » : le raisonnement de la phrase"
  notes: |-
    **Le même rapport existe sous deux modes :** {coral}**réellement dans la production, en représentation dans la religion**{/coral}**.** Le verbe {teal}« est représenté »{/teal} compte : {red}la religion ne produit pas le renversement{/red}, {green}elle le figure{/green}.

    ? **Idéologie** : l'ensemble des représentations (religion, morale, droit, philosophie) par lesquelles une société se figure ses rapports matériels ; le {violet}domaine idéologique{/violet} est celui de ces représentations.

    **La phrase entière a une construction serrée.** Sa proposition principale affirme une identité : {teal}« C'est exactement le même rapport dans la production matérielle [...] que celui qui, dans le domaine idéologique, est représenté par la religion »{/teal}. Deux éléments s'y greffent : l'incise, qui justifie l'appellation « procès réel de la vie sociale », et l'apposition finale, qui donne son nom au rapport commun. Le raisonnement se reconstitue en quatre étapes, chacune fondant la suivante :

    | Étape | Ce qui est posé |
    | 1. l'incise | la production est le procès réel de la vie sociale (thèse matérialiste, supposée) |
    | 2. la portée | la domination de la chose n'est donc pas un fait local, propre à l'atelier, mais la forme de la vie sociale elle-même |
    | 3. la hiérarchie | la production est le réel, la religion ce qui, dans l'idéologie, le représente |
    | 4. l'identité | si la religion représente ce qui a lieu réellement, le rapport qu'elle figure est « exactement le même » |

    {coral}L'identité n'est donc pas une coïncidence entre deux domaines étrangers, mais le rapport d'une réalité à sa représentation.{/coral}

    ? **Heuristique, explicatif** : un raisonnement heuristique aide à trouver, à comprendre ce qu'on ne voyait pas ; un raisonnement explicatif rend raison d'un fait par sa cause.

    **Le raisonnement fonctionne dans deux directions.** Il est {violet}heuristique{/violet} : on connaît bien, depuis Feuerbach, le renversement religieux, et ce modèle connu fait comprendre le renversement économique, que l'économie politique ne voit pas. Il est {violet}explicatif{/violet} : c'est la production qui rend raison de la religion, et non l'inverse.

    **Un contresens à éviter.** Le texte ne dit {red}pas que la religion représente la production capitaliste en particulier{/red}, ce qui serait absurde puisque la religion lui est bien antérieure ; il dit qu'elle représente {green}« le même rapport »{/green}, le renversement du sujet et de l'objet, dont la production capitaliste est la forme réelle la plus achevée. {amber}L'identité affirmée est une identité de structure, non une dérivation historique du christianisme à partir du capital.{/amber}

    **Cette hiérarchie sépare Marx de Feuerbach**, et la quatrième des *Thèses sur Feuerbach* (1845) le dit en termes que l'incise reprend. Feuerbach a eu raison de ramener la religion à sa base terrestre ; mais il s'en est tenu là, alors que {teal}« il faut donc d'abord comprendre celle-ci dans sa contradiction »{/teal}, c'est-à-dire cette base terrestre elle-même, avant de la transformer en pratique. Autrement dit, {coral}si l'homme se dédouble en un ciel qui le domine, c'est que sa vie terrestre est elle-même déchirée{/coral}. Le texte étudié accomplit ce programme : il trouve dans le procès de production la contradiction terrestre dont la religion n'était que le reflet, la domination du travail mort sur le travail vivant. La critique de la religion devient critique de l'économie.

    **Il faut mesurer la force de cette identification.** Une analogie {pink}ne prouve pas{/pink} : elle montre que deux rapports ont la même structure, et rend l'un intelligible par l'autre. Marx la donne pour une identité, mais ce qu'elle apporte au raisonnement est surtout {amber}un modèle{/amber}, et elle repose sur la thèse matérialiste que l'incise suppose sans la défendre.

    ! La religion n'est pas {red}la cause{/red} du renversement économique, ni {red}son effet direct{/red} : elle en est {green}la représentation dans l'idéologie{/green}.
  passage:
    label: "1er mouvement"
    part: "Le rapport capitaliste comme renversement du sujet et de l'objet"
    text: "que celui qui, dans le domaine idéologique, est représenté par la religion,"
