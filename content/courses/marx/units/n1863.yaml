- id: n1863-p28
  title: "L'objection : le procès de production est aussi « procès de travail effectif »"
  notes: |-
    **Le second temps du troisième mouvement s'ouvre sur l'objection la plus forte contre la thèse :** {coral}**le capitaliste fait un vrai travail, parce que la production est aussi un travail réel**{/coral}**.**

    **Le texte formule lui-même l'objection.** On serait tenté de considérer que {red}le capitaliste n'est pas une simple fonction du capital{/red}, puisqu'il fait un vrai travail : il organise l'atelier, décide de ce qu'on fabrique, coordonne les ouvriers. Son activité aurait alors un contenu concret, {yellow}comme celle d'un chef d'orchestre{/yellow}, et sa domination pourrait même passer pour {red}la rémunération légitime de ce travail{/red}. {teal}« Dans la mesure où »{/teal} introduit une concession : Marx accorde le fait, ce qui donne plus de force à sa réponse.

    **Pourquoi le procès de production est-il « en même temps procès de travail effectif » ?** Parce que __la valeur n'existe que portée par des choses utiles__ : {yellow}on ne peut pas produire de la valeur en général, il faut produire du fil, des chaussures ou de l'acier{/yellow}, et c'est en les vendant que la valeur se réalise. {coral}Le capital, qui ne vise que la valorisation, est donc obligé de passer par la fabrication réelle d'objets utiles.{/coral} Le Chapitre VI le pose juste après le passage : {teal}« Le procès de production est l'unité immédiate du procès de travail et du procès de valorisation, de même que son résultat immédiat, la marchandise, est l'unité immédiate de valeur d'usage et de valeur d'échange »{/teal} ; et il précise : {teal}« il n'y a en réalité qu'un seul et unique procès de travail indivisible. On ne travaille pas doublement »{/teal} (édition citée). Le même filage produit à la fois du fil et de la survaleur.

    **« Effectif »** dit cette réalité matérielle : {amber}de vrais gestes transforment une vraie matière avec de vrais outils{/amber}, et c'est à ce niveau que quelqu'un doit organiser le travail.

    ! Le texte ne nie pas {red}que le capitaliste travaille{/red} : il va montrer que {green}ce travail n'est que le moyen d'une fin qui n'est pas la sienne{/green}.
  passage:
    label: "3e mouvement"
