- id: n1863-p6
  title: "Le travail « incorporé au capital dans le procès de production »"
  notes: |-
    **Dans la production, le travail** {coral}**fait partie du capital**{/coral}**.** {teal}« En tant que tel »{/teal} renvoie au travail pris comme substance créatrice de valeur : c'est sous ce rapport, et {red}non comme peine{/red}, qu'il entre dans le capital. Le second {teal}« de même que »{/teal} ajoute un troisième aspect aux deux précédents : après le travail-peine et le travail-substance, {amber}le travail-élément du capital{/amber}.

    ? **Procès** : un déroulement, un mouvement continu dans le temps (allemand *Prozess*), non un état ou un lieu.

    ? **Procès de travail** : l'opération par laquelle l'homme transforme une matière à l'aide d'instruments en vue d'une fin, {yellow}le menuisier qui façonne une planche avec un rabot{/yellow}. Elle existe dans toute société, et se décompose en trois {teal}« éléments simples »{/teal} : {teal}« 1° activité personnelle de l'homme, ou travail proprement dit ; 2° objet sur lequel le travail agit ; 3° moyen par lequel il agit »{/teal} (*Capital*, livre I, chapitre 7).

    ? **Procès de valorisation** : la même production considérée comme création de survaleur. Dans la société marchande, la production de la marchandise {teal}« doit être à la fois formation de valeurs d'usage et formation de valeur »{/teal} (même chapitre) ; dans la production capitaliste, cette formation de valeur est prolongée au-delà de ce que coûte la force de travail, et devient valorisation.

    **Le procès de production capitaliste est l'unité de ces deux procès** : dans le même atelier, par les mêmes gestes, {yellow}on fabrique des chaussures et on fait grossir un capital{/yellow}. Le texte dira plus loin laquelle des deux faces commande l'autre.

    **« Incorporé » au sens propre.** Une fois la force de travail achetée, le capitaliste réunit dans son atelier des choses qui lui appartiennent toutes, les machines, les matières et le travail : {teal}« Le procès de travail est une opération entre choses qu'il a achetées, qui lui appartiennent »{/teal} (chapitre 7). Le travail de l'ouvrier devient ainsi {coral}l'une des parties du capital{/coral}, {yellow}au même titre que le métier à tisser{/yellow} : il fait corps avec le capital. Le paragraphe 102 du Chapitre VI l'avait dit : le travail du travailleur, dès qu'il entre dans le procès de production, {teal}« est lui-même un mode d'existence de la valeur du capital, il lui est incorporé »{/teal}.

    **« Apparaît » et « en fait » se prennent ensemble.** {teal}« Apparaît »{/teal} dit comment les choses se montrent : {amber}la force productive du travail se présente comme une force productive du capital{/amber}, comme si c'était l'argent investi qui produisait, et on dit couramment qu'un capital {yellow}« rapporte »{/yellow}. {teal}« En fait »{/teal} dit que cette apparence {red}n'est pas une simple illusion{/red}, qu'il suffirait de dissiper en réfléchissant : dans la réalité du procès, le travail est effectivement devenu une partie du capital, puisqu'il a été acheté et qu'il est employé à le faire croître. {coral}L'apparence est vraie : elle est la forme réelle que prend le rapport.{/coral} C'est pourquoi le texte pourra parler d'un renversement réel, et non d'une erreur de perspective.

    ! « Incorporé » ne veut pas dire que {red}l'ouvrier{/red} appartient au capitaliste comme un esclave : c'est {green}son travail{/green}, acheté pour un temps, qui fait corps avec le capital.
