- id: n1863-p35
  title: "« L'impulsion et le contenu absolus de son action »"
  notes: |-
    **La valorisation n'est pas seulement le but du capitaliste :** {coral}**elle est la force qui le pousse et tout ce que contient son action, sans limite**{/coral}**.**

    **La formule ajoute deux choses à la précédente.** D'abord, elle passe de la fin à la force qui meut : une {violet}finalité{/violet} est un but, une {violet}impulsion{/violet} est {amber}une poussée intérieure, du côté du désir{/amber}. Ce que le capital exige devient ce que le capitaliste désire : {coral}la personnification de la première phrase s'achève ici, le mouvement du capital est devenu sa passion{/coral}. Ensuite, elle dit que cette fin est aussi le {violet}contenu{/violet} de son action, c'est-à-dire tout ce sur quoi elle porte : quand on retire de son activité ce qui relève du simple moyen, {amber}il ne reste rien d'autre{/amber}.

    **L'adjectif « absolus » a trois sens, que ce qui précède justifie.**

    | Sens | Ce qu'il dit | Appui |
    | sans limite | une somme d'argent peut toujours être plus grande | « Le mouvement du capital n'a donc pas de limite » (*Capital*, livre I, chapitre 4) |
    | non relatif à autre chose | la valorisation n'est pas un moyen en vue d'une fin ultérieure, comme la jouissance | la circulation de l'argent comme capital « possède au contraire son but en elle-même » (ibid.) ; « production pour la production », « production comme fin en soi » (Chapitre VI) |
    | exclusif | rien dans l'action du capitaliste n'échappe à cette fin | le « donc » de la phrase |

    **Le texte le démontre par le même raisonnement que pour la finalité :** si tout le reste est moyen de la valorisation, {coral}la valorisation n'est moyen de rien, elle est la fin dernière{/coral}. Et on comprend rétrospectivement l'{teal}« absolue satisfaction »{/teal} du troisième mouvement : {yellow}une impulsion absolue trouve dans un procès sans fin une satisfaction sans reste{/yellow}.

    ! « Absolu » ne veut pas dire {red}parfait{/red} ni {red}divin{/red} : il veut dire {green}sans limite, sans fin ultérieure et sans exception{/green}.
