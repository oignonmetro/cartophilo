- id: n1863-p31
  title: "Le procès de travail, « simple moyen du procès de valorisation »"
  notes: |-
    **La réponse à l'objection commence par « Mais » :** {coral}**le travail concret que dirige le capitaliste n'est qu'un moyen de la valorisation**{/coral}**.** La réponse ne nie pas le contenu concret de son activité : elle le subordonne. {teal}« Lui-même »{/teal} insiste : même le procès de travail, le seul lieu où l'activité du capitaliste a un contenu propre, n'est qu'un moyen.

    **La distinction des deux procès.** Ce ne sont {red}pas deux activités distinctes{/red}, puisque « on ne travaille pas doublement » : c'est {green}la même journée de filage considérée sous deux aspects{/green}. Comme {violet}procès de travail{/violet}, elle est la transformation du coton en fil par un travail concret ; ce qui compte est la qualité du geste et du produit. Comme {violet}procès de valorisation{/violet}, elle est création de valeur : le travail n'y compte plus par ce qu'il fait, mais par le temps qu'il dure. Le Chapitre VI décrit ce passage : sous le premier aspect, {teal}« tout dépend de sa valeur d'usage particulière »{/teal} ; sous le second, {teal}« on fait entièrement abstraction de son utilité particulière »{/teal}, et le travail est {teal}« du travail indifférencié, socialement nécessaire, général, entièrement indifférent à l'égard de tout contenu particulier »{/teal} (édition citée).

    **La valorisation n'est pas n'importe quelle création de valeur** : c'est la création d'une valeur supérieure à celle qui a été avancée. Le *Capital* la définit comme {teal}« la production de valeur, prolongée au delà d'un certain point »{/teal} (livre I, chapitre 7), et le Chapitre VI précise ce point : {teal}« si le procès de travail s'arrêtait au moment où le quantum de travail ajouté sous forme de filage, etc., = le quantum du travail contenu dans le salaire, aucune survaleur ne serait produite »{/teal}.

    | Point | Procès de travail | Procès de valorisation |
    | ce qu'il produit | des valeurs d'usage (du fil) | de la survaleur |
    | comment le travail y compte | par sa qualité | par sa durée |
    | rapport aux moyens de production | le travailleur les utilise | ils utilisent le travailleur |

    Sur le dernier point, le Chapitre VI est formel : {teal}« Dans le procès de travail considéré pour lui-même, le travailleur utilise les moyens de production. Dans le procès de travail qui est en même temps procès de production capitaliste, ce sont les moyens de production qui utilisent le travailleur »{/teal}.

    ? **Moyen** : {coral}ce qu'on choisit pour une fin, et qu'on remplacerait par un autre s'il servait mieux cette fin{/coral}.

    **Pourquoi le procès de travail n'est-il qu'un moyen ?** Parce que, pour le capital, {amber}ce qui est fabriqué n'importe pas{/amber} : seule importe la survaleur qu'on en tire. {yellow}Le capitaliste organise bien la fabrication de chaussures, mais il ne la veut pas pour les chaussures : il fabriquerait aussi bien des armes ou des jouets si la marge était meilleure.{/yellow} Le Chapitre VI le dit en termes généraux : {teal}« le capital est en lui-même indifférent à la particularité de chacune des sphères de la production »{/teal}, et, en tant que valeur qui se valorise, il est {teal}« indifférent à la forme matérielle particulière sous laquelle il apparaît dans le procès de travail, que ce soit comme machine à vapeur, fumier ou soie »{/teal}. {coral}Le procès de travail a donc, pour le capital, le statut exact d'un moyen.{/coral}

    **« Apparaît » ne signifie pas illusion.** Le verbe dit la manière dont le procès se présente du point de vue qui le commande, celui du capital ; le Chapitre VI l'affirme d'ailleurs sans modalisation juste après le passage : {teal}« le procès de travail n'est que le moyen du procès de valorisation »{/teal}.

    ! Le capitaliste ne {red}méprise{/red} pas forcément ce qu'il fabrique : il peut aimer son métier, mais {green}ce goût est subordonné{/green}, et cède dès que la valorisation l'exige.
