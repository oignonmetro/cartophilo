- id: n1863-p27
  title: "« Il le perçoit comme un procès d'asservissement »"
  notes: |-
    **Le travailleur** {coral}**perçoit le rapport comme un asservissement**{/coral}**, là où le capitaliste n'y voit que l'ordre normal des choses.**

    **Le verbe et le nom.** {teal}« Perçoit »{/teal} est modeste : il ne s'agit {red}pas d'une théorie{/red}, mais {green}de ce que le travailleur éprouve{/green}. {teal}« Asservissement »{/teal} est fort, puisque le salarié est {amber}juridiquement libre{/amber}, qu'il vend sa force de travail par contrat et peut changer de patron. Mais ce qu'il éprouve est plus vrai que la forme juridique. Le Chapitre VI le dit vers sa fin : le salariat {teal}« ne se distingue pas uniquement par sa forme des autres formes plus directes de l'asservissement du travail »{/teal}, et il {teal}« camoufle en tant que simple rapport d'argent la transaction réelle et la dépendance perpétuelle »{/teal} (édition citée). {coral}Le travailleur perçoit donc, depuis sa place, ce que la forme du contrat dissimule : derrière l'échange libre, une servitude.{/coral}

    **« Procès »** reprend celui de « procès d'aliénation » : __c'est le même procès, nommé du point de vue de celui qui le subit__. {amber}Ce que le capitaliste vit comme valorisation, le travailleur le vit comme asservissement.{/amber}

    **On peut alors résumer la phrase en trois étapes.** D'abord, le rapport est une aliénation pour les deux pôles, ce que le deuxième mouvement a préparé. Ensuite, chacun le vit selon sa position : satisfaction d'un côté, souffrance de l'autre. Enfin, la souffrance place le travailleur dans un rapport de rébellion, qui le dispose à rompre avec le rapport, tandis que la satisfaction attache le capitaliste à ce qui l'aliène. On retrouve ainsi, ramenées à leur ressort, la lucidité et la position historique qui font la supériorité du travailleur.

    **Ce raisonnement reprend presque terme à terme une page de La Sainte Famille** (1845), écrite avec Engels, dans la glose sur Proudhon (chapitre IV) : {teal}« La classe possédante et la classe prolétaire représentent la même aliénation humaine »{/teal} ; mais la première {teal}« se sent à son aise dans cette aliénation »{/teal}, tandis que {teal}« la seconde se sent anéantie dans cette aliénation »{/teal}, et se trouve, {teal}« pour employer une expression de Hegel, dans l'avilissement, la révolte contre cet avilissement »{/teal}. La comparaison fait apparaître deux déplacements :

    | Point | *La Sainte Famille* (1845) | Le Chapitre VI |
    | le fondement de l'asymétrie | un sentiment de classe (« à son aise », « anéantie ») | la place de chacun dans le procès de production (« enraciné », « victime ») |
    | la conclusion | le prolétariat doit abolir ce rapport | le travailleur « se tient au-dessus », dans une histoire où le renversement est d'abord nécessaire |

    {coral}La thèse de jeunesse est conservée, mais adossée désormais à l'analyse du capital.{/coral}

    **Un dernier rapprochement s'impose au lecteur**, celui de la dialectique hégélienne du maître et de l'esclave, où c'est l'esclave qui progresse ; mais il est {pink}une glose{/pink}. Le texte ne le fait pas, et *La Sainte Famille*, qui invoque Hegel à cet endroit, ne lui emprunte qu'une expression, l'avilissement et la révolte contre l'avilissement. Le ressort n'est d'ailleurs pas le même : {yellow}chez Hegel, l'esclave s'élève par le travail et la peur ; ici, le travailleur par la souffrance et la rébellion{/yellow}.

    ! « Asservissement » n'est pas {red}une exagération polémique{/red} : le mot dit {green}la vérité du rapport que la forme du contrat camoufle{/green}.
