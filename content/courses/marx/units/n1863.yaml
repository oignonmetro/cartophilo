- id: n1863-p11
  title: "La parenthèse : « seulement en tant que moyens de la domination du capital lui-même »"
  notes: |-
    **La parenthèse limite aussitôt ce qui vient d'être dit :** {coral}**les choses ne dominent qu'en tant que capital**{/coral}**.** Elle écarte deux lectures, dans deux directions opposées.

    **Elle écarte d'abord une lecture matérielle de la domination.** On serait tenté de considérer que {red}ce sont les machines, en tant que choses de fer et d'acier, qui oppriment{/red}, et que la solution serait de les briser. Marx rappelle dans le *Capital* que les ouvriers anglais l'ont cru : au début du XIXe siècle, le mouvement des {sky}Luddites{/sky} détruisit de nombreuses machines, et {teal}« il faut du temps et de l'expérience avant que les ouvriers, ayant appris à distinguer entre la machine et son emploi capitaliste, dirigent leurs attaques non contre le moyen matériel de production, mais contre son mode social d'exploitation »{/teal} (livre I, chapitre 15). {green}Une machine n'opprime qu'en tant qu'elle est capital{/green}, c'est-à-dire qu'elle sert à extraire de la survaleur. {yellow}La même machine, possédée en commun par ceux qui la font tourner, serait un simple moyen de travail à leur service.{/yellow}

    **Elle écarte ensuite une lecture personnelle de la domination.** Les marchandises ne sont {red}pas des moyens de domination du capitaliste{/red}, mais {green}« du capital lui-même »{/green}. Le capitaliste n'en dispose qu'en tant qu'il personnifie le capital, et il est lui-même, la fin du texte le montrera, soumis à la fin qu'elles servent. {coral}Les marchandises ne sont donc pas les instruments d'un homme qui s'en servirait à son gré, mais les organes d'un processus qui se sert aussi de lui.{/coral}

    **Ce qui justifie la précision**, c'est la définition du capital posée dans la première phrase : {teal}« de la valeur qui se valorise par l'absorption du travail vivant »{/teal}. Une chose ne domine que si elle est prise dans ce mouvement : {amber}la domination n'est pas une propriété des choses, mais du rapport social qui en fait du capital{/amber}. Sans la parenthèse, le texte tomberait dans ce que Marx appelle le {violet}fétichisme{/violet} : attribuer aux choses, comme une qualité naturelle, une puissance qui leur vient du rapport entre les hommes.

    **C'est ce que les Manuscrits de 1844 ne pouvaient pas encore écrire.** Ils constataient que le produit se dresse contre le producteur ; la parenthèse en donne {coral}la raison économique{/coral} : le produit ne domine que comme capital, c'est-à-dire comme valeur qui absorbe du travail vivant pour s'accroître.

    ! « Seulement » ne {red}minimise{/red} pas la domination : il en {green}situe la source{/green}, qui est le rapport capitaliste et non les objets.
