- id: n1863-p2
  title: "Le capital, valeur qui se valorise par l'absorption du travail vivant"
  notes: |-
    **L'incise définit** {violet}**le capital**{/violet} **:** {coral}**de la valeur qui s'accroît en absorbant du travail vivant**{/coral}**.** Placée entre tirets, elle interrompt la phrase pour dire ce qu'est ce capital dont le capitaliste exerce les fonctions ; le {teal}« lui-même »{/teal} final insiste : ce sont les fonctions {amber}du capital lui-même{/amber}, et non de la personne qui les exerce. Trois questions s'y posent : de quelle valeur il s'agit, comment elle peut s'accroître, et pourquoi seul le travail {amber}vivant{/amber} l'accroît.

    ? **Valeur** : ce que vaut une marchandise à l'échange, mesuré par le temps de travail socialement nécessaire à la produire. Elle n'est {red}ni le prix ni l'utilité{/red} : une chose très utile, comme l'air, peut n'avoir aucune valeur ; ce qui fait la valeur est {green}le travail humain dépensé{/green}, compté par sa durée : {yellow}une table qui demande deux fois plus de travail qu'une chaise vaut deux fois plus{/yellow}.

    ? **Capital** : une somme de valeur avancée pour revenir accrue, dont Marx écrit le mouvement {violet}A-M-A'{/violet} : l'argent (A) achète des marchandises (M), moyens de production et force de travail, qui, mises en œuvre, donnent un produit vendu contre une somme plus grande (A') : {yellow}un industriel avance 100, il récupère 120{/yellow}. Le capital n'est donc {red}pas une chose{/red}, des machines ou un coffre, mais {green}ce mouvement même{/green} : un coffre plein d'or qui dort n'est pas du capital.

    ? **Survaleur** : l'{teal}« excédent »{/teal} de A' sur A (*Capital*, livre I, chapitre 4), que les traductions plus anciennes appellent plus-value : le travail fourni par l'ouvrier au-delà de ce que vaut son salaire.

    **De quelle valeur s'agit-il ?** Non de la valeur d'une marchandise particulière, mais d'{amber}une somme de valeur que le capitaliste avance{/amber}, d'abord sous forme d'argent. {coral}Se valoriser, pour la valeur, c'est accomplir le cycle A-M-A' et revenir accrue.{/coral}

    **Le pronom réfléchi décrit une apparence.** Dans A-M-A', {yellow}l'argent semble faire de l'argent{/yellow}, comme un arbre porte des fruits ; le *Capital* dit que la valeur {teal}« se présente ici comme une substance automatique, douée d'une vie propre »{/teal} (même chapitre). Mais __une somme de valeur n'a aucune puissance propre de croître__ : échangée contre son équivalent, elle reste égale à elle-même. Le complément {teal}« par l'absorption du travail vivant »{/teal} corrige donc aussitôt ce que le réfléchi suggère : {coral}la valeur ne s'accroît qu'en absorbant ce qui n'est pas elle, le travail{/coral}.

    ? **Travail mort, travail vivant** : le travail passé, fixé dans des produits (une machine est du travail déjà fait), et le travail en train de se faire, l'activité présente d'un homme. Le travail mort {red}n'est pas un travail sans valeur{/red} : il garde sa valeur, mais {green}il ne peut plus en créer de nouvelle{/green}.

    ? **Force de travail** : {teal}« l'ensemble des facultés physiques et intellectuelles qui existent dans le corps d'un homme »{/teal} (*Capital*, livre I, chapitre 6), qu'il vend pour un temps contre un salaire. Le salarié ne vend {red}pas son travail{/red}, qui n'existe pas encore au moment du contrat, mais {green}sa force de travail{/green} : {yellow}l'ouvrier vend sa journée, non tel objet fabriqué{/yellow}, et le travail en est l'usage, qui appartient dès lors à l'acheteur.

    **Pourquoi le travail « vivant » ?** Il faut distinguer deux sortes de travail. __Le travail passé, fixé dans les machines et les matières, ne fait que transmettre sa valeur__ : une {yellow}machine qui a coûté mille et s'use en mille journées ajoute un à la valeur produite chaque jour, jamais plus{/yellow}. __Seul le travail en train de se faire ajoute une valeur nouvelle__, et il peut en ajouter plus que ne coûte la force de travail qui l'accomplit. Le capitaliste achète en effet, pour un salaire, une marchandise singulière, la force de travail, dont {teal}« l'utilité spécifique »{/teal} est d'{teal}« être source de valeur et de plus de valeur qu'elle n'en possède elle-même »{/teal} (chapitre 7). {yellow}L'ouvrier payé l'équivalent de six heures de travail en travaille dix : les quatre heures restantes forment la survaleur.{/yellow} {coral}C'est là tout le secret de l'accroissement du capital.{/coral}

    **Le mot « absorption » le dit avec force**, et le *Capital* en donne l'image : {teal}« Le capital est du travail mort, qui, semblable au vampire, ne s'anime qu'en suçant le travail vivant »{/teal} (chapitre 10). Le capital se nourrit de la vie dépensée par l'ouvrier {yellow}comme le vampire du sang de sa victime{/yellow} : sans cette absorption, il resterait une somme morte. {coral}La définition contient déjà la suite du texte{/coral} : la domination du capital sur le travailleur sera celle d'une chose qui vit d'hommes.

    ! Ce premier argument est {pink}posé, non démontré{/pink} : la réduction du capitaliste à sa fonction repose sur l'analyse du capital menée ailleurs dans l'œuvre, que le texte {amber}tient pour acquise{/amber}.
