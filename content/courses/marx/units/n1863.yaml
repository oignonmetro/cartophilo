- id: n1863-i2
  title: "La question, la thèse, la problématique"
  notes: |-
    **Dans cet extrait, Marx, s'interroge sur qui domine dans le rapport capitaliste, et de quelle nature est cette domination.** La réponse ordinaire est simple : {red}le patron commande, l'ouvrier obéit{/red}, et la domination est celle d'une personne sur une autre, comme celle du maître sur l'esclave. Mais pour Marx, cette lecture laisse croire qu'un patron plus humain l'abolirait la domination.

    **Tout au contraire, Marx défend que** {violet}**le rapport capitaliste**{/violet} **est** {coral}**un renversement réel du sujet et de l'objet**{/coral}**, le même que celui que la religion représente.** À travers le capitaliste, qui n'en est que la {violet}personnification{/violet}, c'est {coral}le travail mort devenu capital qui domine le travail vivant{/coral}. Ce {violet}procès d'aliénation{/violet} du travail humain est {amber}le passage historiquement nécessaire{/amber} au développement des forces productives, __seule base possible d'une société libre__. {amber}Sous un certain angle{/amber}, il asservit {coral}le capitaliste autant que le travailleur{/coral}, mais celui-ci, qui en souffre et s'y oppose, {green}se tient au-dessus de lui{/green}.

    **Comment le rapport capitaliste peut-il être une servitude pour tous, et pourtant le passage par lequel se forme la base d'une société libre ?** Tout y a l'apparence de la liberté : le capitaliste a tous les signes du sujet libre (la {yellow}conscience{/yellow}, la {yellow}volonté{/yellow}, la {yellow}direction du travail{/yellow}, la {yellow}satisfaction{/yellow}), et le salarié est juridiquement libre. Le texte doit donc surmonter trois difficultés, une par partie :

    | Partie | Difficulté | Réponse du texte |
    | 1er mouvement | le capitaliste agit « avec conscience et volonté » | ce sujet apparent n'est que l'agent d'une chose, le capital |
    | 2e mouvement | le renversement est dit « nécessaire » | c'est la nécessité d'un passage vers la liberté, pas une justification |
    | 3e mouvement | le capitaliste commande et jouit, le travailleur obéit | le premier est asservi, le second se tient au-dessus de lui |

    **L'hypothèse de lecture :** le texte {coral}applique à ses propres objets le concept qu'il dégage{/coral}. Il renverse les apparences du sujet et de l'objet comme le capital les renverse dans la réalité : le vrai sujet n'est pas le capitaliste mais le capital ; la base de la liberté s'est formée dans la servitude ; la supériorité revient à celui qui n'est qu'un objet pour le capital.

    ! La domination n'est pas dissoute : elle est {green}dépersonnalisée{/green} sans être {red}niée{/red}. Le capitaliste commande bien, mais il n'est ni la source ni le but du commandement.
