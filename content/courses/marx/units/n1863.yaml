- id: n1863-p7
  title: "Le « facteur vivant, variable » du capital"
  notes: |-
    **Marx précise la place du travail dans le capital :** {coral}**c'est son facteur vivant, variable**{/coral}**, la seule partie qui le fasse croître.** Les deux adjectifs ne sont pas juxtaposés au hasard : ils disent la même chose sous deux angles.

    ? **Facteur** : chacun des éléments qui concourent à la production ; les moyens de production et la force de travail en sont les {teal}« facteurs objectifs et subjectifs »{/teal} (*Capital*, livre I, chapitre 8). Le travail est un facteur parmi d'autres, mais d'une espèce unique.

    | Adjectif | Ce qui distingue le travail des autres facteurs | Ce qui lui est opposé |
    | vivant | ce qu'il est : une activité en train de se faire, dans un corps vivant | le travail mort, déjà fait et figé dans les machines et les matières |
    | variable | ce qu'il fait à la valeur : il reproduit sa valeur et y ajoute un excédent | le capital constant, dont la valeur passe dans le produit sans grandir |

    ? **Capital constant, capital variable** : la partie du capital qui achète les moyens de production {teal}« ne modifie donc pas la grandeur de sa valeur »{/teal}, et Marx la nomme capital constant ; celle qui achète la force de travail {teal}« reproduit son propre équivalent et de plus un excédent »{/teal}, et il la nomme capital variable (*Capital*, livre I, chapitre 8). Le capital constant est fait de travail mort ; le capital variable achète du travail vivant, et c'est la seule part du capital qui fasse varier la valeur.

    **Pourquoi les deux adjectifs vont ensemble.** Les deux couples de notions qui organisent ce passage, capital constant et capital variable, travail mort et travail vivant, opposent chacun {amber}ce qui reste figé à ce qui agit{/amber}, et le second explique le premier : {coral}le travail est variable parce qu'il est vivant{/coral} : seul ce qui agit au présent peut produire plus qu'il n'a coûté. La précision désigne ainsi, dans le capital, {amber}la seule partie qui le fasse croître, et par conséquent celle dont il dépend tout entier{/amber} ; elle prépare la phrase suivante, où cette dépendance se renverse en domination du travail mort sur le travail vivant.

    **Ce qu'ont établi les deux premières phrases.** Les deux protagonistes sont réduits à des fonctions, mais pas de la même manière. Le capitaliste personnifie le capital ; le travailleur personnifie un travail qui ne lui appartient déjà plus et qui est lui-même incorporé au capital. {coral}Le capital englobe ainsi les deux pôles, l'un comme sa conscience, l'autre comme sa matière vivante.{/coral}

    ! Le capital dépend du travail vivant, mais {red}cette dépendance ne donne aucun pouvoir au travailleur{/red} : {green}c'est le capital qui l'absorbe{/green}, et la phrase suivante en tire la domination.
