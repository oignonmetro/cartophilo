- id: n1863-p3
  title: "Le capitaliste, « capital personnifié »"
  notes: |-
    **La deuxième phrase reprend la première sous une forme plus forte :** {violet}**le capitaliste**{/violet} **est** {coral}**« capital personnifié »**{/coral}**.** La première disait que ses fonctions sont celles du capital ; celle-ci dit qu'il n'agit qu'{amber}« en tant que »{/amber} capital, c'est-à-dire sous ce seul titre, et non comme l'individu qu'il est par ailleurs (père, croyant, amateur de peinture).

    ? **Personnification** : {coral}une catégorie économique qui a pris figure humaine{/coral}, {yellow}comme un rôle prend le visage de l'acteur qui le joue{/yellow}.

    **Que veut dire « capital personnifié » ?** Le capital, rapport social et mouvement de valeur, n'a pas de visage : il en reçoit un en la personne du capitaliste. Ce qui compte n'est donc pas qui est le capitaliste, mais {coral}la place qu'il occupe dans le rapport{/coral}.

    **Le second membre retourne le premier.** {teal}« Le capital en tant que personne »{/teal} ne répète pas {teal}« capital personnifié »{/teal} : il en inverse les termes. Le premier membre dit qu'{amber}une personne représente une chose{/amber} ; le second, qu'{amber}une chose devient une personne{/amber}. Ce petit chiasme prépare {coral}le renversement du sujet et de l'objet{/coral} que le texte nommera plus loin : la chose (le capital) prend la place du sujet, et l'homme ne lui sert que de masque.

    ? **Chiasme** : une figure qui croise deux termes, A-B puis B-A : « {yellow}capital{/yellow} {yellow}personnifié{/yellow} », puis « le {yellow}capital{/yellow} en tant que {yellow}personne{/yellow} ».

    **Ce déplacement est la règle de méthode du Capital.** Dans la préface de la première édition (1867), Marx prévient qu'il n'a {teal}« pas peint en rose le capitaliste et le propriétaire foncier »{/teal}, et ajoute aussitôt qu'il ne s'agit des personnes {teal}« qu'autant qu'elles sont la personnification de catégories économiques, les supports d'intérêts et de rapports de classes déterminés »{/teal}. Dire que le capitaliste est du capital personnifié n'est {red}ni l'excuser ni le blanchir{/red}, puisque Marx maintient la dureté du portrait : c'est {green}déplacer l'objet de la critique, de l'individu vers le rapport social{/green} dont il est le support. Le texte étudié fait, à propos de la domination dans l'atelier, ce que la préface pose comme principe pour l'ouvrage entier : {coral}on ne comprend pas le capitalisme en jugeant les capitalistes, mais en analysant la fonction qu'ils remplissent{/coral}.

    ! « Personnifié » ne veut pas dire {red}représenté par métaphore{/red}, comme une vertu sur une fresque : le capital agit {green}réellement{/green} par la personne du capitaliste.
