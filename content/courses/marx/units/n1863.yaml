- id: n1863-p8
  title: "« Par conséquent » : la domination de la chose sur l'homme"
  notes: |-
    **La troisième phrase tire la conclusion des deux premières :** {violet}**la domination du capitaliste**{/violet} **est** {coral}**la domination de la chose sur l'homme**{/coral}**.**

    **Pourquoi « par conséquent » ?** La conséquence se déduit en trois étapes. __Si le capitaliste n'agit qu'en tant que capital personnifié__, __et le travailleur qu'en tant que travail personnifié__, le rapport entre ces deux hommes n'est que le rapport entre ce qu'ils personnifient : {amber}le capital et le travail{/amber}. Or le capital, dans le procès de production, existe sous la forme de {yellow}choses{/yellow} (machines, bâtiments, matières, stocks, argent), alors que le travail n'existe que comme l'activité d'un {yellow}homme vivant{/yellow}. {coral}Le rapport du capitaliste au travailleur est donc, sous l'apparence d'un rapport entre deux personnes, le rapport d'une chose à un homme.{/coral} Le « par conséquent » ne découvre pas un fait nouveau : il explicite ce que la double personnification impliquait, à savoir que, quand le capitaliste commande, {amber}c'est le capital qui commande à travers lui{/amber}.

    ? **Fétichisme de la marchandise** : le fait que, dans l'échange, {teal}« un rapport social déterminé des hommes entre eux »{/teal} {teal}« revêt ici pour eux la forme fantastique d'un rapport des choses entre elles »{/teal} (*Capital*, livre I, chapitre 1) : on attribue aux choses, comme une qualité naturelle, une puissance qui leur vient du rapport entre les hommes.

    **En quel sens faut-il l'entendre ?** Il ne s'agit {red}ni de nier que le capitaliste commande, ni de le déclarer innocent{/red} : le commandement est bien le sien, mais {green}il n'en est ni la source ni le but{/green}. La source du pouvoir (la propriété des moyens de production), son contenu (faire produire plus de valeur) et sa mesure (ce qu'exige la valorisation) viennent de la chose : le capitaliste domine {coral}en porte-parole d'une chose{/coral}. Le fétichisme de la marchandise permet de mesurer le geste. On peut lire le texte étudié comme {amber}l'envers de ce phénomène{/amber} : dans l'atelier, ce qui est en vérité la domination d'une chose sur des hommes se présente comme un rapport entre personnes, le patron et l'ouvrier.

    ? **Moyens de production, moyens de subsistance** : les premiers sont ce avec quoi on produit (machines, bâtiments, matières premières) ; les seconds, ce dont l'ouvrier vit (nourriture, logement, vêtements), qu'il n'obtient qu'avec son salaire.

    ? **Singulier générique** : un singulier qui désigne toute une classe et non un individu, comme « l'homme » dans « l'homme est mortel ».

    **Que désigne exactement « la chose » ?** Le singulier est {violet}générique{/violet}, comme celui de « l'homme » qui lui répond : il ne vise {red}pas un objet particulier{/red}, telle machine ou tel stock, mais {green}tout ce qui, dans la production, existe sous forme de choses{/green}, par opposition aux personnes. Ce générique a pourtant un référent précis, que la suite de la phrase donne (« les marchandises qui deviennent des moyens de domination ») et que le Chapitre VI a donné quelques lignes plus haut : {teal}« la domination des conditions du travail autonomisées »{/teal}, c'est-à-dire les {yellow}moyens de production{/yellow} et les {yellow}moyens de subsistance{/yellow}, en tant qu'ils appartiennent au capitaliste et fonctionnent comme capital. « La chose » est donc {coral}le capital dans son existence matérielle{/coral}. Une machine ne domine pas en tant que {red}masse de fer{/red}, mais en tant que {green}chose sociale{/green}, en tant que capital : la parenthèse de la même phrase le précisera. En opposant « la chose » à « l'homme », Marx donne enfin au rapport la forme d'une opposition de principe, celle qui deviendra, à la fin du mouvement, l'opposition de l'objet et du sujet.

    ! « La chose » ne désigne pas {red}la technique{/red} ni {red}la matière en général{/red} : elle désigne {green}les conditions du travail devenues capital{/green}, séparées du travailleur et tournées contre lui.
