- id: n1863-p33
  title: "L'autovalorisation du capital, « la création de survaleur »"
  notes: |-
    **La dernière phrase s'ouvre sur le nom de la fin du capitaliste :** {coral}**l'autovalorisation du capital, c'est-à-dire la création de survaleur**{/coral}**.**

    **Qu'est-ce que l'autovalorisation ?** Le préfixe {teal}« auto »{/teal} dit que la valeur s'accroît {amber}elle-même{/amber}, {yellow}comme si l'argent faisait des petits{/yellow} : c'est ainsi que le mouvement se présente, et c'est ainsi que le capitaliste le vit. Le Chapitre VI en donne le contenu réel : {teal}« dans la mesure où le travail passé met en mouvement du travail vivant, il devient lui-même un procès, il se valorise »{/teal}, et {teal}« cette absorption de travail vivant additionnel est son procès d'autovalorisation, sa véritable transformation en capital, en valeur se valorisant elle-même »{/teal} (édition citée). {coral}L'autovalorisation est donc le mouvement par lequel une somme de valeur avancée revient accrue, et cet accroissement n'est rien d'autre que le travail vivant qu'elle a absorbé.{/coral}

    **Pourquoi consiste-t-elle dans « la création de survaleur », que le texte place en apposition entre tirets ?** Parce que la survaleur est __le seul accroissement de valeur possible dans la production__. La valeur des machines et des matières {pink}ne fait que passer dans le produit sans grandir{/pink} ; la valeur avancée pour les salaires {pink}est seulement reproduite{/pink} par une partie de la journée de travail. Ce qui dépasse la valeur avancée ne peut donc venir que {green}du travail fourni au-delà de cette reproduction{/green} : la {violet}survaleur{/violet}, que le Chapitre VI définit juste après le passage comme {teal}« procès d'objectalisation de travail impayé »{/teal} (édition citée).

    ? **Objectalisation** : le fait que le travail se fixe dans un objet, où il demeure sous forme de valeur ; c'est le mot de la traduction des Éditions sociales.

    **L'apposition dit ce que le mot cache.** {red}Ce qui paraît un accroissement spontané du capital{/red} est {green}en réalité du travail d'autrui non payé{/green}. La première phrase l'avait posé, en définissant le capital comme valeur qui se valorise {teal}« par l'absorption du travail vivant »{/teal}.

    ! « Autovalorisation » ne veut pas dire que {red}le capital produit vraiment de la valeur tout seul{/red} : le mot nomme {green}une apparence réelle{/green}, que l'apposition rapporte aussitôt à sa source, le surtravail.
