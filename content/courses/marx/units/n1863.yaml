- id: n1863-p36
  title: "« L'impulsion et l'objectif rationalisés du thésauriseur »"
  notes: |-
    **Le texte ramène aussitôt cette fin absolue à sa vérité :** {coral}**ce n'est que la passion de l'avare, rendue méthodique**{/coral}**.**

    **« C'est en fait seulement » est une déflation** : ce que le texte vient d'élever au rang de finalité absolue n'est, ramené à sa vérité, que la passion de l'avare.

    ? **Thésauriseur** : celui qui accumule l'argent pour lui-même et le retire de la circulation, {yellow}l'avare qui entasse l'or{/yellow}.

    **La formule condense une analyse du Capital**, au chapitre sur la transformation de l'argent en capital. Marx y montre que le capitaliste partage avec le thésauriseur la même {teal}« tendance absolue à l'enrichissement »{/teal}, et conclut : {teal}« tandis que celui-ci n'est qu'un capitaliste maniaque, le capitaliste est un thésauriseur rationnel »{/teal} (livre I, chapitre 4). {yellow}L'avare croit assurer à son trésor une vie éternelle en le soustrayant à la circulation ; le capitaliste obtient ce que l'avare cherche en le relançant sans cesse dans la circulation.{/yellow}

    | Figure | Méthode | Passion |
    | le thésauriseur | il retire l'argent de la circulation et l'entasse | l'enrichissement sans limite |
    | le capitaliste | il relance sans cesse l'argent dans la circulation | la même |

    **« Rationalisés » ne porte que sur le moyen.** Le capitaliste a trouvé {green}la bonne méthode{/green}, celle qui fait croître l'argent au lieu de l'enterrer ; mais {red}la fin, elle, n'a rien de rationnel{/red}, puisqu'elle n'a ni terme ni raison hors d'elle-même. {coral}C'est ce qui permet au texte de dire à la fois que cette fin est « rationalisée » et qu'elle est « misérable ».{/coral} Le *Capital* donne à cette passion sa devise ironique : {teal}« Accumulez, accumulez ! C'est la loi et les prophètes ! »{/teal} (livre I, chapitre 24), parodie de l'Évangile qui montre que {amber}l'accumulation tient lieu de religion au capitaliste{/amber}.

    ! « Rationalisés » ne veut pas dire {red}justifiés par la raison{/red} : le mot dit seulement que {green}la méthode est devenue efficace{/green}, non que la fin est raisonnable.
  passage:
