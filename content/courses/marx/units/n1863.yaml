- id: n1863-p26
  title: "Le travailleur, victime, « dans un rapport de rébellion »"
  notes: |-
    **La justification porte ensuite sur le travailleur :** {coral}**parce qu'il est la victime du procès, il s'y oppose**{/coral}**.**

    **En quoi est-il victime ?** Il porte tout le coût du procès : la souffrance et l'effort qui lui restent, le surtravail, la dépendance. Le Chapitre VI décrit, vers sa fin, ce qui s'accumule en face de lui : à mesure que la force productive sociale du travail se développe, {teal}« s'enfle à son encontre le monde de la richesse, comme monde pour lui étranger et dominateur »{/teal}, {teal}« tandis que dans le même rapport se développe par contraste sa subjective indigence, misère et dépendance »{/teal} (édition citée).

    **Pourquoi cette position produit-elle la rébellion ?** Parce que __le procès contrarie tout ce qu'il vise__ : {yellow}il travaille pour vivre, et son travail le vide ; il produit la richesse, et elle se dresse contre lui{/yellow}. Il y a donc chez lui {amber}un écart constant entre ce qu'il vit et ce qu'il voudrait{/amber}, l'écart même qui manque au capitaliste. Les *Manuscrits de 1844* en décrivaient le signe : son travail {teal}« n'est donc pas volontaire, mais contraint, c'est du travail forcé »{/teal}, et {teal}« dès qu'il n'existe pas de contrainte physique ou autre, le travail est fui comme la peste »{/teal} (premier manuscrit, traduction GF). Le {teal}« parce que »{/teal} affirme ainsi une {violet}causalité de position{/violet} : {red}ce n'est pas la conscience du travailleur qui fait sa situation{/red}, {green}c'est sa situation qui fait sa conscience{/green}, selon le principe de la préface de 1859, {teal}« c'est inversement leur être social qui détermine leur conscience »{/teal}.

    **Que signifie exactement la formule ?**
    - {teal}« Se trouve »{/teal} dit {amber}une situation et non un choix{/amber} : le travailleur est placé dans ce rapport avant d'avoir rien décidé.
    - {teal}« Rapport de rébellion »{/teal} ne désigne {red}pas encore une révolte en acte{/red}, une grève ou une insurrection, mais {green}une orientation{/green} : une relation d'opposition au procès, qui peut rester sourde, se marquer par la résistance quotidienne, le travail fui dès qu'on le peut, avant de prendre une forme organisée.
    - {teal}« À l'inverse »{/teal} fait du travailleur {amber}le symétrique exact du capitaliste{/amber} : à l'enracinement répond l'arrachement, à la satisfaction la rébellion.

    **La rébellion reste prise dans une contrainte**, que le Chapitre VI souligne ailleurs : à la différence de l'esclave, {teal}« maintenu par contrainte directe »{/teal}, le travailleur libre {teal}« doit au contraire le maintenir lui-même »{/teal}, ce rapport, parce que son existence dépend de la vente renouvelée de sa capacité de travail (édition citée). {coral}Il se révolte contre un rapport qu'il est obligé de reconduire chaque jour.{/coral}

    ! Le texte n'affirme pas que {red}tout travailleur se révolte effectivement{/red} : il dit qu'il {green}se trouve dans un rapport de rébellion{/green}, une disposition que sa position lui donne.
