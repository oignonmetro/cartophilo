- id: n1863-p22
  title: "Les forces spirituelles d'abord figurées sous une forme religieuse"
  notes: |-
    **L'analogie religieuse revient, mais pour une autre fonction :** {coral}**elle porte sur la nécessité du renversement, non plus sur sa structure**{/coral}**.** De même qu'il faut passer par la forme antagonique, il faut que l'homme se figure d'abord ses forces sous une forme religieuse.

    **Pourquoi est-ce nécessaire ?** La thèse vient de {sky}Feuerbach{/sky}, pour qui {teal}« la religion est la première conscience de soi de l'homme, mais indirecte »{/teal} (*L'Essence du christianisme*, introduction, traduit ici de l'anglais). __L'homme ne se connaît pas d'emblée__ : il ne peut découvrir ce qu'il est qu'en le voyant hors de lui, {yellow}comme on ne voit son propre visage que dans un miroir{/yellow}. Il contemple donc d'abord ses propres perfections dans un autre être, Dieu, et ce n'est qu'ensuite, par la critique, qu'il reconnaît que cet être n'était que lui-même.

    **Chaque mot de la comparaison compte.**
    - {teal}« Se figure »{/teal} dit la manière de ce premier savoir : une {violet}représentation en images{/violet} ({yellow}un Dieu tout-puissant, un juge, un père{/yellow}), non un concept.
    - {teal}« D'abord »{/teal} dit qu'il n'est qu'un premier moment, {amber}appelé à être suivi d'une réappropriation{/amber}.
    - {teal}« Comme des puissances indépendantes »{/teal} dit la forme de l'aliénation : ce qui est à l'homme lui apparaît comme existant par soi, hors de lui.

    **Que désignent « ses propres forces spirituelles » ?** Les facultés de l'esprit humain, celles qui font l'homme homme. Feuerbach les nomme au début de son livre : ce qui constitue l'humanité de l'homme, ce sont {teal}« la raison, la volonté et le cœur »{/teal}, {teal}« perfections de l'homme »{/teal} et {teal}« ses plus hautes puissances »{/teal}. Ce sont exactement les attributs que la religion prête à Dieu, portés à l'infini :

    | Force humaine | Attribut divin |
    | la raison | l'omniscience |
    | la volonté | la toute-puissance |
    | le cœur | l'amour divin |

    {teal}« Propres »{/teal} dit que ces forces {red}n'appartiennent pas à Dieu{/red}, mais {green}à l'espèce humaine{/green}, Dieu ne les possédant que parce que l'homme les lui a prêtées. {teal}« Spirituelles »{/teal} (*geistig*, de l'esprit) les distingue des forces matérielles dont il vient d'être question : la phrase met en regard {coral}deux sortes de forces humaines, les forces productives du travail, qui deviennent le capital, et les forces de l'esprit, qui deviennent Dieu{/coral}.

    **Le parallèle avec la production se précise alors :** les forces productives du travail social se développent d'abord sous la forme d'une puissance étrangère, le capital, avant que les travailleurs puissent les reconnaître comme leurs. Marx ajoute pourtant à Feuerbach un point qui lie les deux nécessités. Pour Feuerbach, l'homme se projette en Dieu par une sorte de loi de la conscience ; pour Marx, depuis la quatrième des *Thèses sur Feuerbach*, il le fait parce que sa vie terrestre est elle-même déchirée. {amber}Les hommes se figurent leurs forces comme des puissances étrangères parce que, dans leur vie réelle, leurs forces leur sont réellement étrangères.{/amber} Le « de même que » unit ainsi deux nécessités dont la seconde, religieuse, reflète la première.

    ! L'analogie {pink}éclaire plus qu'elle ne démontre{/pink} : elle rend plausible qu'une puissance humaine doive passer par une forme étrangère avant d'être reconnue, {red}sans prouver{/red} que ce soit le cas pour le capital.
