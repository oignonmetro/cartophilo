- id: n1863-o2
  title: "La liberté et l'originalité du passage"
  notes: |-
    **La tension de la problématique se résout sans qu'aucun de ses termes soit nié :** {coral}**les signes de la liberté ne sont pas des illusions, mais des formes du renversement**{/coral}**.**

    | Signe de liberté | Ce qu'il est réellement | Ce qu'il cache |
    | la conscience et la volonté du capitaliste | réelles | elles n'ont pour contenu que la fin du capital, l'impulsion abstraite et misérable du thésauriseur |
    | la liberté juridique du salarié | réelle | elle couvre une dépendance perpétuelle, que le contrat « camoufle en tant que simple rapport d'argent » |
    | la satisfaction du capitaliste | réelle | elle est celle d'un asservissement qui ne se sait pas |

    **La servitude commune a pourtant préparé la liberté**, parce que c'est elle qui a imposé le développement des forces productives, seules capables d'en former la base ; et la nécessité {red}n'innocente pas{/red} le renversement, puisqu'elle est celle d'un passage payé par le plus grand nombre. {coral}La liberté véritable n'est donc pas dans le rapport capitaliste, ni d'un côté ni de l'autre : elle est dans la société que ce rapport rend possible, et dont le travailleur, parce qu'il éprouve la servitude comme telle, est le porteur.{/coral}

    **L'originalité du passage tient à trois déplacements.**
    - **Un vocabulaire de jeunesse fondé sur la théorie du capital.** Le texte reprend, dans un manuscrit d'économie de la maturité, le vocabulaire de l'{violet}aliénation{/violet} et le modèle religieux des écrits de jeunesse, mais en les fondant sur la théorie du capital : la parenthèse sur {teal}« la domination du capital lui-même »{/teal} est ce que les *Manuscrits de 1844* ne pouvaient pas encore écrire. {amber}L'aliénation n'est pas abandonnée par le Marx de la maturité : elle reçoit sa raison économique.{/amber}
    - **La domination retournée contre le dominant.** Le capitaliste n'y est {red}ni un ennemi moral ni un maître libre{/red}, mais {green}un homme asservi à une passion misérable{/green}, et la supériorité revient à celui qui, parce qu'il souffre, voit le rapport tel qu'il est.
    - **La condamnation et la nécessité tenues ensemble.** Le même rapport est une servitude et le passage par lequel s'est formée la base de la liberté, sans que l'un de ces deux jugements annule l'autre : ni éloge du capitalisme, ni pure dénonciation.

    ! On ne conclura pas que Marx {red}absout le capitaliste{/red} parce qu'il le dit asservi : {green}l'asservissement du dominant ne diminue pas la domination qu'il exerce{/green}, il en montre la vraie source.
