- id: n1863-p10
  title: "Les marchandises qui « deviennent des moyens de domination »"
  notes: |-
    **Le « puisque » justifie la conséquence :** {coral}**ce qui domine les travailleurs, ce sont des marchandises**{/coral}**.** {teal}« En fait »{/teal} insiste : ce n'est pas une image, c'est ainsi que les choses se passent réellement.

    **Pourquoi des « marchandises » ?** Parce que, dans la société capitaliste, les {yellow}moyens de production{/yellow} (machines, matières) et les {yellow}moyens de subsistance{/yellow} (ce dont l'ouvrier vit) {amber}s'achètent et se vendent{/amber}. Le verbe {teal}« deviennent »{/teal} compte : ces marchandises ne sont pas moyens de domination {red}par nature{/red}, elles le {green}deviennent{/green} par la place qu'elles prennent dans le rapport capitaliste. Elles le deviennent par deux voies.

    ? **Travailleur libre** : chez Marx, le salarié est libre {teal}« à un double point de vue »{/teal} : libre de sa personne, {teal}« disposant à son gré de sa force de travail »{/teal}, et {teal}« libre de tout, complètement dépourvu des choses nécessaires à la réalisation de sa puissance travailleuse »{/teal} (*Capital*, livre I, chapitre 6).

    **La première voie est la séparation.** L'ouvrier ne possède aucun moyen de production, et ne peut donc vivre qu'en vendant sa force de travail à celui qui les possède. C'est le travailleur libre, au double sens de Marx. __Les moyens de production, parce qu'ils sont dans d'autres mains, le contraignent__ à accepter les conditions de ceux qui les possèdent ; et __les subsistances, qu'il ne peut acheter qu'avec un salaire, le ramènent chaque jour à l'atelier__.

    **La seconde voie est l'emploi.** Une fois l'ouvrier dans l'atelier, les moyens de production fixent ce qu'il fait, combien de temps et à quel rythme. Le *Capital* le dit en une formule qui renverse l'ordre attendu : les moyens de production {teal}« se sont transformés immédiatement en moyens d'absorption du travail d'autrui. Ce n'est plus le travailleur qui les emploie, mais ce sont au contraire eux qui emploient le travailleur »{/teal} (livre I, chapitre 11). Le Chapitre VI va plus loin encore, quelques pages plus haut : dans le rapport capitaliste, {teal}« des marchandises figurent comme des acheteurs de personnes »{/teal}.

    | Voie | Quand | Comment les marchandises dominent |
    | la séparation | avant le travail | en manquant à l'ouvrier, qui doit se vendre pour vivre |
    | l'emploi | pendant le travail | en commandant ce qu'il fait, combien de temps, à quel rythme |

    {coral}Les marchandises dominent donc deux fois : avant le travail, en manquant à l'ouvrier, et pendant le travail, en le commandant.{/coral}

    ! La liberté juridique du salarié {red}n'empêche pas{/red} la domination : elle en est {green}la condition{/green}, puisque seul un homme libre de tout peut être contraint de vendre sa force de travail.
