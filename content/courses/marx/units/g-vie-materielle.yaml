lessons:
- id: g-vie-materielle-l1
  title: Vie matérielle
  notes: |-
    Chez Marx, la {violet}**vie matérielle**{/violet} ({violet}*materielles Leben*{/violet}) est [def]. « Matériel » ne veut dire {pink}ni la matière physique ni les biens de consommation{/pink}. Pas la matière physique, car Marx reproche au matérialisme ancien, celui de {sky}Feuerbach{/sky} compris, de ne saisir le monde sensible {teal}« {/teal}que sous la forme d'objet ou d'intuition, mais non en tant qu'activité humaine concrète, en tant que pratique{teal} »{/teal} (*Thèses sur Feuerbach*, 1, citées par {sky}Ducange{/sky}) : le matériel, chez lui, est une activité. « Matériel » désigne donc la production, par des hommes en rapports déterminés, de ce qu'il leur faut pour vivre, et s'oppose d'abord au politique (en 1843), puis à l'intellectuel (en 1846 et 1859). Concrètement, se nourrir, se loger, se vêtir, avec les outils qu'on a, et dans les rapports où cela se fait : coopération, division du travail, échange. Plusieurs thèses voisines sont établies ailleurs : que les individus soient ce que sont leurs manières de manifester leur vie ([[g-activite-vitale|activité vitale]]) ; que la conscience soit le langage de la vie réelle ([[g-expression-de-la-vie|expression de la vie]]) ; qu'en 1843 l'État s'oppose à la vie matérielle ([[g-vie-generique|vie générique]]) ; que la satisfaction d'un besoin en fasse naître d'autres ([[g-besoin|besoin]]). Le propre de la notion est d'être, à partir de 1845, ce dont part toute l'histoire, et ce qui « conditionne » le reste de la vie sociale.

    __**Produire sa**__ {violet}__**vie matérielle**__{/violet}__**, c'est produire chaque jour ses moyens d'existence, et c'est le premier fait historique.**__ Les historiens allemands racontent l'histoire comme une suite d'idées, de religions et d'États, en la coupant de sa base terrestre. Or, avant de faire de la politique, de la religion ou de la philosophie, les hommes doivent vivre, c'est-à-dire manger, boire, se loger, se vêtir. Or rien de cela ne leur est donné tout fait : il faut le produire. Donc {teal}« {/teal}{teal}__en produisant leurs moyens d'existence les hommes produisent indirectement leur vie matérielle elle-même__{/teal}{teal} »{/teal} (*L'Idéologie allemande*, I, traduction de la Pléiade). « Indirectement » veut dire qu'ils ne fabriquent pas leur vie comme on fabrique une table : ils produisent du pain, des maisons, des outils, et c'est par là qu'ils vivent, et qu'ils vivent de telle manière. Cette production n'est pas faite une fois pour toutes : il faut la recommencer sans cesse. C'est pourquoi elle est {teal}« {/teal}{teal}__une condition fondamentale de toute histoire__{/teal} que l'on doit, aujourd'hui encore comme il y a des milliers d'années, {teal}__remplir jour par jour, heure par heure__{/teal}, simplement pour maintenir les hommes en vie{teal} »{/teal} (*L'Idéologie allemande*, I). {coral}La production de la vie matérielle est le premier fait historique, non parce qu'elle serait la plus noble, mais parce qu'aucun autre ne peut se faire sans elle.{/coral} Le second, c'est que la satisfaction d'un besoin en fait naître de nouveaux (voir besoin) : c'est ce qui fait de cette répétition quotidienne une histoire.

    __**La**__ {violet}__**vie matérielle**__{/violet}__**, sphère de l'égoïsme privé en 1843, devient en 1846 la base de l'histoire.**__ Le mot change de valeur en trois ans. En 1843, la vie matérielle est celle de la {red}société civile{/red}, où chacun poursuit son intérêt privé, par opposition à la vie générique du citoyen (voir vie générique) : son homme est, selon Marx, {teal}« {/teal}l'homme qui n'est pas encore réellement un être générique{teal} »{/teal} (*Sur la question juive*, cité par {sky}Renault{/sky}). Elle est alors jugée d'après une norme, le genre, qu'elle manque. Or, en 1845-1846, Marx renonce à mesurer le réel à une essence humaine, parce qu'une essence qui ne passe par aucune activité est une abstraction (voir [[g-etre-generique|être générique]]) ; il décide de partir de ce que les hommes font réellement pour vivre. Et la {violet}société civile{/violet}, au sens de {sky}Hegel{/sky}, est justement le « système des besoins » (*Principes de la philosophie du droit*, § 189), la sphère du travail et de l'échange : c'est là que la vie matérielle se produit. Marx le dira en 1859 : les rapports juridiques et les formes de l'État ont {teal}« {/teal}leurs racines dans les conditions d'existence matérielles dont Hegel, à l'exemple des Anglais et des Français du XVIIIe siècle, comprend l'ensemble sous le nom de société civile{teal} »{/teal}, et {teal}« {/teal}{teal}__l'anatomie de la société civile doit être cherchée à son tour dans l'économie politique__{/teal}{teal} »{/teal} (*Contribution*, Préface). Donc la sphère qu'il jugeait comme une chute devient le point de départ. Il faut, écrit-il, partir de la production matérielle de la vie immédiate et {teal}« {/teal}saisir les formes de relation qui font corps avec ce mode de production et en résultent, [...] {teal}__la société civile à ses différentes phases, comme constituant la base de toute l'histoire__ »{/teal} (*L'Idéologie allemande*, I, dans les *Écrits philosophiques*) ; les « formes de relation » (*Verkehrsformen*) sont les formes d'échange, de commerce et de coopération que nouent les hommes à un stade donné de leurs forces productives. {amber}La même société civile que 1843 condamnait comme égoïsme, 1846 l'étudie comme fondement.{/amber}

    __**Le**__ {violet}__**mode de production**__{/violet} __**de la vie matérielle conditionne la vie sociale, politique et intellectuelle.**__ La Préface de 1859 donne la formule, avec quatre termes. Les {violet}forces productives{/violet} sont ce dont une société dispose pour produire : outils, machines, savoirs, travailleurs. Les {violet}rapports de production{/violet} sont les rapports où les hommes produisent : qui possède les moyens de production, qui travaille pour qui. Leur unité est un {violet}mode de production{/violet} ; l'État, le droit, la religion forment la {violet}superstructure{/violet}. Que toute vie sociale suppose la production ne montre encore qu'une condition préalable. Mais la production n'est pas un acte biologique : {teal}« {/teal}dans la production sociale de leur existence, {teal}__les hommes entrent en des rapports déterminés, nécessaires, indépendants de leur volonté__ »{/teal} (*Contribution*, Préface). Ces rapports donnent à chacun une place : qui possède, qui travaille. Or celui qui tient les moyens de produire tient aussi ceux de penser et de faire penser : {teal}« {/teal}la classe qui dispose des moyens de la production matérielle dispose en même temps, de ce fait, {teal}__des moyens de la production intellectuelle__ »{/teal} (*L'Idéologie allemande*, I, traduction de la Pléiade). Les idées qui règnent sont donc celles qui expriment ces rapports : {teal}« {/teal}les pensées dominantes ne sont pas autre chose que {teal}__l'expression idéale des rapports matériels dominants__ »{/teal} (*ibid*., cité par {sky}Renault{/sky}). Marx en donne un exemple : là où la royauté, l'aristocratie et la bourgeoisie se disputent le pouvoir, la doctrine de la division des pouvoirs devient la pensée dominante, énoncée comme une « loi éternelle » (*ibid*., d'après {sky}Ducange{/sky}). C'est ce que dit « être social » : non l'existence biologique, mais la place qu'on occupe dans ces rapports. Donc {teal}« {/teal}{teal}__le mode de production de la vie matérielle conditionne le processus de vie social, politique et intellectuel en général__{/teal}. Ce n'est pas la conscience des hommes qui détermine leur être; c'est inversement {teal}__leur être social qui détermine leur conscience__ »{/teal} (*Contribution*, Préface). Les deux verbes ne disent pas pour autant une causalité mécanique ({sky}Renault{/sky}). « Conditionner », c'est fixer le cadre des possibles : on ne pense pas le crédit dans une société sans monnaie. « Déterminer », c'est dire où les idées prennent racine : dans les rapports réels, non dans le ciel des idées. Ce qui reste aux hommes se voit quand les forces productives entrent en contradiction avec les rapports de production : il faut alors distinguer le bouleversement matériel et {teal}« {/teal}les formes juridiques, politiques, religieuses, artistiques ou philosophiques, bref, les formes idéologiques sous lesquelles {teal}__les hommes prennent conscience de ce conflit et le mènent jusqu'au bout__ »{/teal} (*ibid*.). {coral}La vie matérielle crée le conflit ; ce sont les hommes qui le livrent.{/coral}

    __**La façon dont les hommes**__ {violet}__**gagnent leur vie**__{/violet} __**explique quelle sphère domine leur société.**__ Une objection vient d'elle-même, et Marx la rapporte dans une note du *Capital* : sa thèse serait vraie pour le monde moderne, dominé par les intérêts matériels, mais non pour le Moyen Âge, {teal}« {/teal}où dominait le catholicisme, ni pour Athènes et Rome, où dominait la politique{teal} »{/teal} (*Le Capital*, livre I, chap. I, 4, note). Marx répond qu'{teal}« {/teal}{teal}__il est aussi clair que ni le Moyen Âge, ni l'Antiquité ne pouvaient vivre l'un du catholicisme, l'autre de la politique__{/teal}{teal} »{/teal} (*ibid*.). Il faut donc expliquer pourquoi la religion ici, la politique là, tenaient la première place, et c'est {teal}« {/teal}inversement la façon dont ils gagnaient leur vie{teal} »{/teal} qui l'explique : à Rome, {teal}« {/teal}{teal}__l'histoire de la propriété foncière constitue son histoire secrète__{/teal}{teal} »{/teal} (*ibid*.). Concrètement, derrière les luttes politiques de la République, entre patriciens et plébéiens, l'enjeu était l'appropriation des terres publiques et les lois agraires. La politique dominait parce que, dans une communauté de citoyens propriétaires qui vivait du travail des esclaves, la cité était l'organe qui conservait ces conditions d'existence ; au Moyen Âge, la dépendance féodale et la production des domaines faisaient de l'Église le lien social majeur. {amber}La thèse ne dit pas que l'économie domine partout, mais que la vie matérielle décide de ce qui domine{/amber}. L'Introduction de 1857 donne une image voisine, à propos d'une production qui fixe le rang des autres productions, et qu'on peut étendre aux autres sphères : la production dominante est {teal}« {/teal}un éclairage général où sont plongées toutes les couleurs et qui en modifie les tonalités particulières{teal} »{/teal} (*Contribution*, Introduction de 1857).

    __**Le procès de la vie matérielle reste**__ {red}__**voilé**__{/red} __**tant qu'il n'est pas l'œuvre d'hommes librement associés.**__ Sous la production marchande, chacun travaille pour soi, et le caractère social de son travail n'apparaît que lorsque les produits s'échangent. Le rapport entre les producteurs se présente donc comme un rapport entre les choses qu'ils échangent : {teal}« {/teal}c'est seulement le rapport social déterminé des hommes eux-mêmes qui {teal}__prend ici pour eux la forme phantasmagorique d'un rapport entre choses__ »{/teal} (*Le Capital*, livre I, chap. I, 4). Ce que les hommes font ensemble pour vivre leur échappe ainsi : les prix montent et baissent comme un temps qu'il fait. Le voile ne tombera que lorsqu'ils organiseront eux-mêmes leur production : {teal}« {/teal}La configuration du procès social d'existence, c'est-à-dire du procès de production matérielle, {teal}__ne se débarrasse de son nébuleux voile mystique__{/teal}, qu'une fois qu'elle est là comme {teal}__produit d'hommes qui se sont librement mis en société, sous leur propre contrôle conscient et selon leur plan délibéré__ »{/teal} (*ibid*.). {green}La vie matérielle deviendra transparente quand elle sera voulue en commun{/green} (voir [[g-communaute|communauté]]).

    ! « Matériel » ne veut dire ni la matière physique ni les biens de consommation : c'est la production, par des hommes en rapports déterminés, de leurs moyens d'existence.

    ! Conditionner n'est pas causer mécaniquement : la vie matérielle fixe le cadre des possibles et décide quelle sphère domine ; les hommes prennent conscience des conflits qu'elle crée et les mènent jusqu'au bout.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | *Sur la question juive* | la vie matérielle, sphère de l'homme qui n'est pas encore un être générique |
    | *L'Idéologie allemande*, I | la production de la vie matérielle, premier fait historique et base de toute l'histoire |
    | *Contribution*, Introduction de 1857 | la production dominante, éclairage général |
    | *Contribution*, Préface | le mode de production de la vie matérielle conditionne la vie sociale, politique et intellectuelle |
    | *Le Capital*, livre I, chap. I, 4 | la façon de gagner sa vie explique ce qui domine ; le voile mystique du procès de production matérielle |

