# Entrée du glossaire de Marx (skill glossaire-marx) : notion. Citations reprises de
# NotebookLM avec leur source (L'Idéologie allemande, Contribution, Le Capital, éditions
# sociales ; L'Idéologie allemande aussi dans la Pléiade, Œuvres III ; Sur la question
# juive et L'Idéologie allemande citées par Renault et Collin), vérifiées par textes.py.
# Angle choisi pour ne pas redire Activité vitale, Expression de la vie, Vie générique
# et Besoin : ce que « matériel » veut dire, la production de la vie matérielle comme
# premier fait historique, son passage de la société civile à la base, et ce que veut
# dire « conditionner ».

