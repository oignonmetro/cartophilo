- id: m1844-p11
  title: "L'animal devient humain, l'humain devient animal"
  notes: |-
    **Résultat : l'ouvrier ne se sent libre que dans ses fonctions {red}animales{/red}, et animal dans ses fonctions proprement humaines.**

    Manger, boire, procréer, choisir sa maison : voilà où il se sent libre ; dans {violet}ses fonctions proprement humaines{/violet}, il se sent animal. {coral}Ce qui est animal devient humain, et ce qui est humain devient animal.{/coral} Marx précise : manger, boire, procréer sont {amber}de vraies fonctions humaines{/amber}, mais {red}séparées abstraitement{/red} du reste des activités humaines et devenues la fin dernière et unique, elles ne sont plus que des fonctions animales.

    ! Marx ne méprise pas ces fonctions : c'est leur séparation qui les ravale.
  passage:
    label: "§11"
    text: "On en vient donc à ce résultat que l'homme (l'ouvrier) se sent agir librement seulement dans ses fonctions animales : manger, boire et procréer, ou encore, tout au plus, dans le choix de sa maison, de son habillement, etc. ; en revanche, il se sent animal dans ses fonctions proprement humaines. Ce qui est animal devient humain, et ce qui est humain devient animal. Manger, boire, procréer, etc., sont certes aussi des fonctions authentiquement humaines. Mais séparées abstraitement du reste du champ des activités humaines et devenues ainsi la fin dernière et unique, elles ne sont plus que des fonctions animales."
  points:
