# Unité de texte (voir content/textes.md) : Marx, *Manuscrits de 1844*, premier
# manuscrit, « Le travail aliéné », du « fait économique actuel » à la vie
# prêtée à l'objet (§1 à §4 de l'ancienne unité).
# d'après la traduction GF (Jacques-Pierre Gougeon), choisie par l'utilisateur.
# Les appels de note et les marques de page sont retirés ; le texte est celui de
# l'extraction du PDF de l'utilisateur. Commentaire : les séances de Fischbach
# des 13 et 20 octobre et du 3 novembre 2026 (voir les unités ali1 à ali6) ;
# allemand d'après le texte allemand de marxists.org (MEW 40). Le passage
# (p. XXII à XXIV du manuscrit de Marx) était une seule unité jusqu'au
# 2026-11-21 ; il est réparti en cinq unités (m1844, m1844b à m1844e), qui
# gardent les identifiants des leçons et des cartes (m1844-p…), donc leur
# révision, avec des § renumérotés dans chaque unité.

id: m1844
title: "Le produit, puissance étrangère (1844)"
subtitle: "Manuscrits de 1844, premier manuscrit, « Le travail aliéné », 1 / 5"
group: "Le travail aliéné (Manuscrits de 1844)"
icon: page
color: coral
intro: |-
  Le début du passage sur le travail aliéné : du fait économique (l'ouvrier s'appauvrit à mesure qu'il produit) à ce qu'il exprime, l'objectivation devenue perte de l'objet ; le produit se dresse devant l'ouvrier comme une puissance étrangère, comme Dieu devant l'homme.
lessons:
- id: m1844-i1
  title: "Le fait économique et le plan"
  notes: |-
    **Le premier manuscrit part du travail aliéné comme d'un fait économique, et en tire quatre déterminations : le produit, l'activité, l'être générique, autrui.**

    Marx reproche à l'économie politique de partir du fait de {amber}la propriété privée{/amber} sans l'expliquer : elle présuppose ce qu'elle devrait déduire, et se transporte dans {red}un état originel fictif{/red}, comme le théologien qui explique le mal par le péché originel. Lui part d'{violet}un fait économique actuel{/violet} : l'appauvrissement de l'ouvrier à mesure qu'il produit. Le texte découvre ce que ce fait exprime, par un rapprochement de l'objet puis de l'activité, jusqu'à l'être générique.

    | Moment | Lieu | Ce qui s'y joue |
    | Le produit du travail | ce texte et « L'ouvrier, esclave de son objet » | le produit se dresse comme un être étranger, et l'ouvrier est coupé de la nature qui fournit matière et moyens de vivre |
    | L'activité du travail | « L'activité étrangère à l'ouvrier » | le travail est extérieur à l'ouvrier, forcé, perte de soi : son activité est celle d'un autre |
    | L'être générique | « L'être générique renversé » et le début de « L'homme étranger à l'homme » | le travail aliéné fait de la vie générique un moyen de la vie individuelle |
    | Les autres hommes | la fin de « L'homme étranger à l'homme » | étranger à son être générique, l'homme est étranger aux autres hommes |

    ! Ce texte ne couvre que le début du passage, le fait de départ et l'aliénation du produit ; les quatre suivants le continuent. La suite du manuscrit (à qui appartient le produit ?) n'est dans aucun.
  passage:
    label: "Introduction"
  points: []
- id: m1844-p1
  title: "Un fait économique : l'appauvrissement de l'ouvrier"
  notes: |-
    **Marx part d'{amber}un fait économique actuel{/amber} : plus l'ouvrier produit de richesse, plus il s'appauvrit.**

    Ce fait est un {red}paradoxe{/red} : {violet}la richesse produite{/violet} croît, et avec elle {coral}la pauvreté de celui qui la produit{/coral}. L'ouvrier devient une marchandise {red}d'autant moins chère{/red} qu'il en crée davantage : {violet}la dévalorisation du monde humain{/violet} va de pair avec {violet}la mise en valeur du monde matériel{/violet}. Le travail ne produit pas seulement des marchandises : il produit aussi {coral}l'ouvrier lui-même comme une marchandise{/coral}.

    ! Marx ne part ni d'un état originel fictif ni d'une définition de l'homme : le reste du passage cherche ce que ce fait exprime.
  passage:
    label: "§1"
    text: |-
      Nous partons d'un fait économique actuel.
      L'ouvrier devient d'autant plus pauvre qu'il produit plus de richesse, que sa production croît en puissance et en volume. L'ouvrier devient une marchandise au prix d'autant plus bas qu'il crée plus de marchandises. La dévalorisation du monde humain va de pair avec la mise en valeur du monde matériel. Le travail ne produit pas seulement des marchandises ; il se produit lui-même ainsi que l'ouvrier comme une marchandise dans la mesure où il produit des marchandises en général.
