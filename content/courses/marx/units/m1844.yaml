- id: m1844-p13
  title: "L'homme est un être générique"
  notes: |-
    **À ces deux déterminations Marx en ajoute une troisième : {amber}l'homme est un être générique{/amber}.**

    Un être générique, au sens de Marx, est {coral}un être pour qui l'espèce est un objet{/coral}, la sienne comme celle de toute chose, et qui se comporte envers lui-même comme envers {violet}une espèce réelle, vivante{/violet}, donc {violet}un être universel et libre{/violet}. Les deux façons de le dire expriment la même chose.

    ! « Générique » ne veut pas dire « commun à tous » : c'est le rapport de l'homme à son espèce, c'est-à-dire à lui-même comme universel.
  passage:
    label: "§13"
    text: "De ces deux déterminations du travail aliéné, nous devons en tirer une troisième. L'homme est un être générique. Non seulement parce que, sur le plan pratique et théorique, il fait de l'espèce, la sienne propre aussi bien que celle de toute chose, son objet, mais encore – et ceci n'est qu'une autre façon d'exprimer la même chose – parce qu'il se comporte vis-à-vis de lui-même comme vis-à-vis d'une espèce réelle, vivante, parce qu'il se comporte vis-à-vis de lui-même comme vis-à-vis d'un être universel, donc libre."
  points:
  - id: m1844-p13-1
    fragment: "1/2"
    sentence: "« De ces deux déterminations du travail aliéné, nous devons ___. L'homme est un être générique. »"
    answer: "en tirer une troisième"
    alt: []
