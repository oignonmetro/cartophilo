- id: m1844-p2b
  title: "La réalisation du travail est son objectivation"
  notes: |-
    **Avant de dire ce que le produit devient pour l'ouvrier, Marx dit ce qu'il est en lui-même : {coral}le travail même, passé de l'état d'activité à l'état d'objet{/coral}.** Et ce passage n'est pas un accident du travail, c'est {coral}sa réalisation{/coral}.

    **Pourquoi « le produit du travail est le travail » ?** L'énoncé identifie deux choses qu'on distingue d'ordinaire, l'acte et son résultat. Le produit {red}n'est pas autre chose{/red} que le travail : il est le travail {green}sous une autre forme{/green}. « Qui s'est fixé » : le verbe pronominal fait du travail le sujet de sa propre fixation ; l'activité, qui passe, se donne une forme qui demeure. {yellow}Le menuisier ne réalise son travail que dans la table : son adresse, son temps, son attention y sont désormais présents sous la forme d'un objet.{/yellow}

    ? **Objectivation** (*Vergegenständlichung*) : le fait de devenir objet, de passer dans un *Gegenstand*, littéralement « ce qui se tient en face ». L'objet est ce qui fait face au sujet, et cette position en face {green}n'a encore rien d'hostile{/green}.

    ? **Réalisation** (*Verwirklichung*) : le fait de devenir effectif, *wirklich*, mot qui vient de *wirken*, agir, produire un effet. Est réel ce qui agit et a des effets.

    **Pourquoi la réalisation « est » l'objectivation ?** La seconde phrase est une définition par identité : pour le travail, {coral}devenir réel et devenir objet sont une seule et même chose{/coral}. Un travail qui ne se fixerait dans aucun objet ne serait pas un travail achevé, {red}mais un effort sans résultat{/red}. Et les deux phrases ne contiennent ni « mais » ni « cependant » : elles décrivent l'ordre normal, et le renversement ne viendra qu'avec la phrase suivante.

    **« Matérialisé » est-il péjoratif ?** L'allemand dit *sachlich gemacht*, « rendu chose ». Le mot dit seulement que le travail prend la forme d'une chose, {green}sans rien de péjoratif{/green}, puisque la phrase en fait la réalisation du travail.

    **Pourquoi Marx place-t-il ce rappel ici, entre la puissance étrangère et sa description ?** Pour deux raisons, que le texte ne dit pas.
    - {amber}Fixer l'étalon.{/amber} Pour que le produit puisse être dit « étranger », il faut qu'il ait dû ne pas l'être : on ne dit pas étranger ce qui n'a jamais été à soi. Or le produit est le travail même de l'ouvrier sous forme d'objet ; s'il lui devient étranger, c'est donc l'ouvrier qui devient étranger {coral}à sa propre activité réalisée, à une part de lui-même{/coral}. L'identité du travail et du produit transforme ainsi la perte d'un bien en perte de soi : {yellow}un voleur qui prend une table prend un bien ; le rapport qui retire au menuisier toutes les tables qu'il fait lui retire la réalité de son travail.{/yellow}
    - {amber}Écarter une fausse cause.{/amber} En posant que l'objectivation est la réalisation du travail, Marx s'interdit de faire de l'objectivation la cause de la perte : si l'ouvrier perd sa réalité, {coral}ce ne peut être parce qu'il s'objective{/coral}, puisque c'est en s'objectivant qu'il se réalise. Il faudra chercher la cause dans les conditions où l'objectivation s'accomplit.

    **D'où vient cette conception ?** De Hegel, dont Marx loue, dans le troisième manuscrit, d'avoir {teal}« saisi l'essence du travail »{/teal} et conçu l'homme comme le résultat de son propre travail. Mais Marx rapporte l'objectivation à {green}un être naturel et corporel{/green}, non à l'esprit : le produit {teal}« ne fait que confirmer son activité objective »{/teal}, il en est l'achèvement, non la chute.

    ! Le contresens à éviter : croire que l'aliénation consiste, pour l'activité vivante, à {red}se figer dans une chose{/red}. C'est glisser de l'objectivation à la réification, mot absent du passage. Ces deux phrases disent le contraire : {green}s'objectiver, c'est se réaliser{/green}.
