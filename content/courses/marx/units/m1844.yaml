- id: m1844-p12
  title: "Les deux aspects du travail aliéné"
  notes: |-
    **Bilan : le travail aliéné a {amber}deux aspects{/amber}, le rapport au produit et le rapport à l'activité.**

    1) Le rapport de l'ouvrier au produit, {red}objet étranger qui le domine{/red}, est aussi son rapport au monde extérieur sensible, étranger et hostile. 2) Le rapport du travail à l'acte de production, à l'intérieur du travail : c'est le rapport de l'ouvrier à sa propre activité comme {red}activité étrangère{/red} qui ne lui appartient pas, {coral}l'activité qui est passivité, la force qui est impuissance, la procréation qui est castration{/coral}. Son énergie, sa vie personnelle, car la vie est l'activité, est transformée en activité dirigée contre lui. C'est {violet}l'aliénation de soi{/violet}, comme la première était l'aliénation de la chose.
  passage:
    label: "§12"
    text: "Nous avons considéré l'acte d'aliénation de l'activité humaine pratique, le travail, sous deux aspects. 1) Le rapport de l'ouvrier au produit du travail en tant qu'objet étranger qui le tient sous sa domination. Ce rapport est en même temps le rapport au monde extérieur sensible, aux objets de la nature, monde qui lui est à la fois étranger et hostile. 2) Le rapport entre le travail et l'acte de production à l'intérieur du travail. Ce rapport est le rapport de l'ouvrier à sa propre activité en tant qu'activité étrangère qui ne lui appartient pas, c'est l'activité qui est passivité, la force qui est impuissance, la procréation qui est castration. C'est l'énergie physique et intellectuelle de l'ouvrier, sa vie personnelle – car qu'est-ce que la vie sinon l'activité ? – qui est transformée en activité dirigée contre lui-même, indépendante de lui, ne lui appartenant pas. C'est l'aliénation de soi comme, plus haut, l'aliénation de la chose."
