- id: m1844-p4
  title: "3.1 à 3.4 Le principe, la religion, l'ouvrier privé d'objets"
  notes: |-
    **Toutes les conséquences résident dans {coral}une seule détermination{/coral} ; et cette détermination laisse l'ouvrier {coral}« privé d'objets »{/coral} à mesure qu'il produit.**

    **3.1 Une seule détermination.** L'allemand ne dit pas « par définition » mais *in der Bestimmung* : les conséquences {amber}résident dans la détermination{/amber} selon laquelle l'ouvrier se rapporte à son produit comme à un objet étranger, puis il l'appelle une {violet}présupposition{/violet} (*Voraussetzung*). L'ordre d'exposition, des faits au principe, est {red}l'inverse de l'ordre des raisons{/red}. Implicite du passage d'« étranger » à « puissant » : ce qu'il produit {amber}s'accumule{/amber} au lieu de disparaître, et ce qui s'accumule agit sur lui (prémisse sous-jacente : le travail comme {violet}expression vitale{/violet}, *Lebensäußerung*).

    **3.2 Comme dans la religion.** L'allemand dit seulement « il en va de même » et « place » (*setzt*), non « projette ». Feuerbach : {teal}« Pour enrichir Dieu, l'homme doit se faire pauvre ; pour que Dieu soit tout, l'homme doit n'être rien »{/teal}. Ce qui justifie le parallèle : dans les deux cas, l'objet est fait de la substance de son producteur, celui-ci ne s'y reconnaît pas, et l'objet a sur lui une puissance qu'il tient de lui. Limite : Dieu est {red}imaginaire{/red}, le produit {green}réel{/green}.

    **3.3 L'ouvrier privé d'objets.** Deux « donc » (*also*) que la traduction efface. « Plus cette activité est grande, plus l'ouvrier est privé d'objets » : *gegenstandsloser*, {coral}sans objet{/coral}. Implicite : sa vie mise dans l'objet appartient au capital ; plus il est actif, plus il est séparé des objets de la vie et du travail ; il ne lui reste qu'une capacité sans objet. L'aliénation est donc {green}une perte d'objectivité{/green}, {red}non un excès d'objet{/red} ; et parce que l'homme est un être naturel, cette perte est {amber}une perte de soi{/amber} : « moins l'ouvrier est lui-même ».

    **3.4 Ce que signifie l'aliénation dans le produit.** *Entäußerung* : « non seulement » le travail devient objet, réalité extérieure, ce qui arrive à tout travail, « mais » il {coral}existe hors de lui, indépendant, hostile{/coral}. Deux extériorités : celle de tout produit, et celle d'un produit séparé de son producteur.

    ! Lire l'analogie religieuse comme la clé du texte masque son point le plus original : {red}le croyant n'est pas privé de Dieu{/red}, {green}l'ouvrier est privé d'objets{/green}.
  passage:
    label: "§4"
    part: "3. Le principe et son sens"
    text: "Toutes ces conséquences découlent du fait que, par définition, l'ouvrier se trouve devant le produit de son propre travail dans le même rapport qu'à l'égard d'un objet étranger. S'il en est ainsi, il est évident que, plus l'ouvrier se dépense au travail, plus le monde étranger, objectif, qu'il crée en face de lui devient puissant, plus il s'appauvrit lui-même et plus son monde intérieur devient pauvre, moins il possède en propre. C'est la même chose avec la religion. Plus l'homme projette de choses en Dieu, moins il en garde en lui-même. L'ouvrier place sa vie dans l'objet. Mais alors celle-ci ne lui appartient plus, elle appartient à l'objet. Plus cette activité est grande, plus l'ouvrier est privé d'objets. Il n'est pas ce qu'il produit par son travail. Plus ce produit gagne en substance, moins l'ouvrier est lui-même. L'aliénation de l'ouvrier dans son produit signifie non seulement que son travail devient un objet, une réalité extérieure, mais que son travail existe en dehors de lui, indépendamment de lui, étranger à lui, et devient une puissance autonome face à lui, que la vie qu'il a prêtée à l'objet s'oppose à lui, hostile et étrangère."
