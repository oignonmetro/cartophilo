    fragment: "1/4"
    sentence: "« En quoi consiste l'aliénation du travail ? D'abord dans le fait que ___, c'est-à-dire qu'il n'appartient pas à son essence, que donc, dans son travail, l'ouvrier ne s'affirme pas, mais se nie, ne se sent pas à l'aise, mais malheureux ; il n'y déploie pas une libre activité physique et intellectuelle, mais mortifie son corps et ruine son esprit. »"
    answer: "le travail est extérieur à l'ouvrier"
