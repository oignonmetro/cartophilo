- id: m1844-p3d
  title: "Sous la domination de son propre produit, le capital"
  notes: |-
    **Le troisième renversement, celui de l'appropriation en aliénation, est porté à sa limite, et le texte revient à la proportion inverse du début : plus l'ouvrier produit, moins il possède, et {coral}plus ce qu'il a produit le domine{/coral}.** Pour la première fois, la puissance étrangère reçoit son nom économique : {violet}le capital{/violet}.

    **Pourquoi l'appropriation devient-elle une aliénation ?** S'approprier, c'est faire sien ; travailler, c'est s'approprier la nature en lui donnant une forme. L'aliénation en est {amber}l'inverse exact{/amber} : rendre étranger ce qui devait devenir sien. {yellow}Le mineur arrache le charbon à la terre, il le fait passer de la nature au monde humain ; mais ce charbon, dès qu'il est extrait, appartient à la compagnie.{/yellow}

    **Pourquoi « moins il peut posséder » ?** La proportion inverse revient, appliquée cette fois à {amber}la possession{/amber}. Le verbe « pouvoir » dit {red}une impossibilité, non un choix{/red} : l'ouvrier ne renonce pas à posséder, il en est empêché, et d'autant plus qu'il produit.

    **Pourquoi « tomber sous la domination » ?** L'allemand dit *Herrschaft*, la domination du maître, qui répond à la *Knechtschaft*, la servitude, de la fin du paragraphe précédent : {violet}l'ouvrier est le serviteur, son produit le maître{/violet}. Et le verbe « tomber » dit une chute progressive, d'autant plus profonde que l'ouvrier produit davantage.

    **Pourquoi « son propre produit, le capital » ?** Le possessif, renforcé par « propre », rend le paradoxe aussi aigu que possible : {coral}ce qui domine l'ouvrier vient de lui{/coral}. Et l'apposition {amber}identifie le produit et le capital{/amber} : le capital n'est rien d'autre que le produit de l'ouvrier, accumulé hors de ses mains.

    **Comment ce que l'ouvrier produit pourrait-il le dominer ?** Sans le raisonnement implicite, la phrase serait obscure.
    - Le capital, pour les économistes, est {teal}« du travail accumulé »{/teal} : des produits du travail passé, mis en réserve pour produire davantage.
    - Ce sont {amber}les produits de l'ouvrier, retirés de ses mains{/amber}, qui forment cette réserve.
    - Et c'est elle qui {amber}achète le travail, fournit la matière et les outils, fixe le salaire{/amber}.

    Plus l'ouvrier produit, plus elle grossit, et plus il dépend d'elle pour vivre et pour travailler. La domination du capital n'est donc {red}pas celle d'une force venue d'ailleurs{/red} : {green}c'est le travail de l'ouvrier lui-même, accumulé contre lui{/green}. {yellow}Les mineurs qui ont extrait pendant des années le charbon dont la vente a payé de nouveaux puits et de nouvelles machines se retrouvent face à une compagnie plus puissante que jamais, qui fixe seule leur salaire.{/yellow}

    **Le cercle du paragraphe se ferme.** La « puissance indépendante » du deuxième paragraphe, annoncée dans les termes de la philosophie, est maintenant {coral}identifiée dans ceux de l'économie{/coral}. Le deuxième mouvement n'a rien démontré de plus que le premier ; mais il a montré que les trois renversements ne sont pas des formules, et il a déplacé la question : ce que l'ouvrier perd n'est plus seulement le produit qu'il a fait, c'est {amber}l'accès à tous les objets dans lesquels il pourrait se réaliser{/amber}.

    ! La domination du capital n'est pas {red}celle des capitalistes{/red} : le texte décrit un rapport entre l'ouvrier et {green}son propre produit{/green}, dont les personnes ne seront que les porteurs. Le capitaliste ne sera nommé qu'au terme du passage.
