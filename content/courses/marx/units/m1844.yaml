- id: m1844-p2
  title: "Le produit se dresse devant l'ouvrier comme un être étranger"
  notes: |-
    **Marx traduit le fait économique en {coral}un rapport{/coral} : ce que l'ouvrier produit lui fait face comme quelque chose d'autre que lui, qui ne dépend plus de lui et qui a sur lui une force propre.** On passe du constat économique, prix et salaires, à l'analyse philosophique, le rapport d'un homme à son œuvre.

    **Pourquoi « n'exprime rien d'autre que » ?** La formule est à la fois restrictive et forte. Le fait économique n'est que {amber}l'expression{/amber}, la manifestation visible, d'un rapport qui n'est pas lui-même économique ; et ce rapport l'épuise, il n'y a rien d'autre à chercher derrière lui. Le deux-points annonce {violet}une équivalence, non une cause{/violet} : Marx ne dit pas que le rapport produit le fait, il dit que le fait est ce rapport vu du dehors, {yellow}comme une fièvre n'est pas causée par l'infection, mais en est la manifestation{/yellow}.

    **Pourquoi le fait exprime-t-il ce rapport ?** Marx ne déroule pas le raisonnement ; on peut le reconstruire en trois étapes. D'abord, la richesse dont parlait le premier paragraphe n'est rien d'autre que {amber}l'ensemble des produits du travail{/amber} : c'est la thèse des économistes eux-mêmes, pour qui le travail est la source de la richesse. Ensuite, si l'ouvrier s'appauvrit à mesure que cette richesse croît, c'est que {coral}ses produits ne lui reviennent pas{/coral} ; sinon, plus il produirait, plus il serait riche. Enfin, s'il s'appauvrit en proportion de ce qu'il produit, c'est que ses produits, une fois sortis de ses mains, {coral}ne restent pas neutres{/coral} : ils s'ajoutent à ce qui lui fait face, ce capital qui fixe son salaire. Un produit qui ne revient pas à son auteur et qui grossit ce qui le domine, voilà ce que Marx appelle un « être étranger » et une « puissance indépendante ».

    **Pourquoi « son produit » ?** La répétition insiste sur l'appartenance : ce qui va se dresser contre l'ouvrier est {amber}« son »{/amber} produit, sorti de son propre travail. Toute la force du paradoxe tient à ce possessif. {yellow}Le maçon qui bâtit l'immeuble d'où il sera expulsé faute de payer le loyer voit se dresser devant lui ce qu'il a fait de ses mains.{/yellow}

    **Pourquoi « se dresse devant lui » ?** L'allemand *gegenübertreten* veut dire venir se placer en face, s'opposer. Le produit ne reste pas à côté de l'ouvrier comme une chose inerte : il lui fait face {red}comme un adversaire{/red}.

    ? **Être étranger** (*fremdes Wesen*) : *fremd*, étranger, est la racine d'*Entfremdung*, l'{violet}aliénation{/violet}, qui se lit dès ici sans être nommée : le fait que ce qui vient de soi devienne étranger à soi et se tourne contre soi. Marx dit {amber}« être »{/amber}, et non chose : le mot prête au produit une sorte d'existence propre, comme s'il était quelqu'un.

    **Pourquoi « puissance indépendante du producteur » ?** La seconde apposition précise la première : le produit est étranger {amber}en ce qu'il ne dépend plus{/amber} de celui qui l'a fait, et il est puissance {amber}en ce qu'il agit sur lui{/amber}. Et l'ouvrier est désigné comme « producteur », ce qui rend l'inversion plus nette : c'est de celui qui le produit que le produit devient indépendant.

    **Une question laissée en suspens.** S'il n'appartient pas à l'ouvrier, à qui le produit appartient-il ? Marx ne la pose pas ici, et ce silence est méthodique : il veut {green}déduire{/green} la propriété privée du rapport de l'ouvrier à son produit, et ne peut la nommer dès le départ sans retomber dans le défaut des économistes.

    ! La puissance du produit n'est pas {red}une image{/red}, ni une animation mystérieuse des choses : elle est {green}réelle{/green}, puisque le produit, devenu capital, décide si l'ouvrier travaille et à quel prix.
