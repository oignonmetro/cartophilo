- id: m1844-p3
  title: "Perdre sa réalité jusqu'à mourir de faim"
  notes: |-
    **Le premier renversement est porté à sa limite : la perte de réalité, qui pouvait sembler une formule abstraite, {coral}va jusqu'à la mort physique de l'ouvrier{/coral}.** La déréalisation n'est pas une métaphore.

    **Pourquoi « à tel point… que » ?** La construction consécutive {amber}mesure l'intensité{/amber}. Elle ne déduit pas : elle montre jusqu'où va ce qui a déjà été dit. Elle reviendra, identique, pour les deux autres couples, et c'est elle qui donne au paragraphe son unité : {violet}les trois renversements de la phrase précédente, repris un à un, dans le même ordre{/violet}. Le verbe « se révèle » reprend d'ailleurs, en allemand, le *erscheint*, « apparaît », de la phrase précédente : l'apparence {green}se vérifie{/green}.

    **Que veut dire « perdre sa réalité » ?** L'allemand dit que l'ouvrier est déréalisé « jusqu'à la mort par la faim ». Le terme abstrait (déréaliser) et le terme concret (la faim) sont posés dans la même phrase comme {amber}les deux bouts d'une seule échelle{/amber}. La réalité de l'ouvrier, c'est donc d'abord {coral}son existence de vivant{/coral} ; la perdre tout à fait, c'est mourir. Marx tire ici une conséquence de sa définition : si la réalité de l'ouvrier est dans son travail réalisé, et que ce travail lui échappe, il ne lui reste plus de quoi exister.

    **Comment le fait de travailler peut-il conduire à mourir de faim ?** La phrase ne le dit pas, et le raisonnement passe par deux prémisses.
    - L'ouvrier {amber}n'a pas d'autre accès aux moyens de vivre que son salaire{/amber}, c'est-à-dire que son travail : il ne possède ni terre ni outil qui lui permettraient de se nourrir lui-même.
    - Son travail {amber}ne dépend pas de lui{/amber}, mais de la demande. La colonne du salaire l'a dit : quand l'offre de bras dépasse la demande, une partie des ouvriers {teal}« tombe dans la mendicité ou la mort par inanition »{/teal}.

    Il suit que l'ouvrier peut avoir enrichi la société entière par son travail, et {coral}mourir de faim dès que ce travail n'est plus demandé{/coral} : sa réalité tient tout entière à un travail qui ne lui appartient pas. {yellow}Le tisserand qui a fait la fortune d'une manufacture peut, quand la mode change et que la manufacture ferme, n'avoir plus de quoi manger, alors que les étoffes qu'il a tissées remplissent les magasins.{/yellow}

    **Est-ce une hyperbole ?** Non. Dans les années 1840, la mort par la faim est un fait que Marx a sous les yeux, et c'est {green}sa littéralité{/green} qui donne au mot de « déréalisation » son poids. Smith lui-même, dans la colonne du salaire, tenait le salaire ordinaire pour le plus bas qui soit compatible avec {teal}« la simple humanité »{/teal}.

    ! La phrase {red}ne prouve pas{/red} le renversement : elle en {green}mesure la portée{/green}, en le prenant au pied de la lettre. Tout le paragraphe fait de même.
