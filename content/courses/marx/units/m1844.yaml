- id: m1844-p2
  title: "1.2 à 1.4 Le produit étranger, l'objectivation, le triple renversement"
  notes: |-
    **Le fait exprime un rapport : {coral}le produit fait face à l'ouvrier comme un être étranger{/coral}, parce que l'objectivation, qui est la réalisation du travail, devient pour lui une perte.**

    **1.2 Ce que le fait exprime.** « N'exprime rien d'autre que » : le fait économique {amber}n'est que la manifestation{/amber} d'un rapport, et ce rapport l'épuise. Le produit se dresse devant l'ouvrier (*gegenübertreten*) comme {violet}un être étranger{/violet} (*fremd*, racine d'*Entfremdung*), une puissance indépendante du producteur. Raison implicite : la richesse n'est que l'ensemble des produits du travail ; si l'ouvrier s'appauvrit à mesure qu'elle croît, c'est que ses produits {coral}ne lui reviennent pas{/coral} et grossissent ce qui lui fait face.

    **1.3 Le produit, travail fixé.** Le produit est {amber}le travail même{/amber}, « fixé, matérialisé dans un objet » (l'allemand dit *sachlich gemacht*, rendu chose, sans rien de péjoratif).

    ? **Objectivation, réalisation** : *Vergegenständlichung*, le fait que le travail passe dans un objet ; *Verwirklichung*, le fait de devenir effectif. Pour le travail, devenir objet et devenir réel sont {coral}une seule et même chose{/coral} : le menuisier ne réalise son travail que dans la table.

    Ce rappel fixe l'étalon : on ne dit pas étranger ce qui n'a jamais été à soi. Et il interdit de faire de l'objectivation la cause de la perte, puisque c'est en s'objectivant que l'ouvrier se réalise.

    **1.4 Le triple renversement.** « Dans le monde de l'économie politique » (*Zustand*, l'état décrit par les économistes), la réalisation {amber}« apparaît »{/amber} comme perte de réalité (*Entwirklichung*), l'objectivation comme {coral}perte de l'objet et servitude{/coral} envers lui (l'allemand dit « et », *Knechtschaft*, le mot du serviteur chez Hegel), l'appropriation comme aliénation et dessaisissement (*Entäußerung*, la perte de ce dans quoi on s'est exprimé). Ce n'est pas une perte {red}après{/red} l'objectivation : l'objet est {green}toujours déjà perdu{/green}.

    ! Contresens à éviter : l'aliénation {red}n'est pas l'objectivation{/red}, la fixation de l'activité dans une chose ; glisser vers la réification, mot absent du passage, serait un contresens complet. C'est {green}ce que devient l'objectivation dans un état déterminé{/green}.
  passage:
    label: "§2"
    part: "1. Du fait à ce qu'il exprime"
    text: "Ce fait n'exprime rien d'autre que ceci : l'objet que le travail produit, son produit, se dresse devant lui comme un être étranger, comme une puissance indépendante du producteur. Le produit du travail est le travail qui s'est fixé, matérialisé dans un objet, il est l'objectivation du travail. La réalisation du travail est son objectivation. Dans le monde de l'économie politique, cette réalisation du travail apparaît comme la perte pour l'ouvrier de sa réalité, l'objectivation comme la perte de l'objet ou l'asservissement à celui-ci, l'appropriation comme l'aliénation, le dessaisissement."
