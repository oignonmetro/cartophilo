- id: m1844-p3c
  title: "Le travail lui-même devenu un objet"
  notes: |-
    **La gradation atteint son sommet : après les objets de la vie et ceux du travail, c'est {coral}le travail lui-même{/coral} qui devient un objet hors de portée de l'ouvrier.** La perte de l'objet atteint jusqu'à l'activité par laquelle l'ouvrier pourrait se donner des objets.

    **Pourquoi « oui » ?** L'adverbe (*ja*) {amber}enchérit{/amber} : on va plus loin encore que ce qui vient d'être dit. « Le travail lui-même » : le pronom insiste, ce n'est plus le produit ni les conditions du travail, {coral}c'est l'activité même{/coral}.

    **Que veut dire « devenir un objet » pour le travail ?** Le travail est l'activité par laquelle on produit des objets ; il devient lui-même {amber}quelque chose qu'on doit obtenir{/amber}, comme une chose qu'on n'a pas. « S'emparer » traduit *sich bemächtigen*, faire passer sous son pouvoir : le travail est {violet}un butin{/violet}, dont il faut se rendre maître.

    **Pourquoi « le plus grand effort » et « les interruptions les plus irrégulières » ?** Avant même de travailler, {amber}il faut peiner pour avoir le droit de travailler{/amber}. Et le travail ne se possède jamais durablement : il est repris aussitôt que donné. Les interruptions sont les passages du travail à l'absence de travail, {violet}ce qu'on appellera le chômage{/violet}. {yellow}Qu'on pense au journalier qui attend chaque matin devant la porte de l'usine qu'on veuille bien l'employer, et qui reste certains jours sans ouvrage.{/yellow}

    **Pourquoi le travail devient-il un objet dont il faut s'emparer ?** Le raisonnement part de la phrase précédente.
    - Si l'ouvrier est privé des objets de la vie et des objets du travail, {amber}le seul moyen d'accéder aux uns et aux autres est d'obtenir du travail{/amber} : sans travail, ni pain ni outils.
    - Le travail devient ainsi {coral}l'objet essentiel, qui donne accès à tous les autres{/coral}, ce qu'il faut obtenir avant toute autre chose.
    - Mais cela suppose que l'ouvrier ait été réduit à {violet}une pure capacité de travailler{/violet}, séparée de tous les moyens de passer à l'acte. Il n'a plus que la puissance de travailler ; l'acte de travailler est hors de lui.

    **Le mot décisif est celui de séparation**, qui n'est pas dans le texte mais qu'il impose. Il devrait y avoir {green}continuité{/green} entre l'être naturel qu'est l'homme et son activité : {yellow}l'artisan qui a son atelier et ses outils n'a pas à « trouver du travail », il se met à l'ouvrage{/yellow}. L'aliénation commence quand il faut accéder au travail {red}comme à une réalité extérieure{/red}. L'homme est alors réduit à une capacité sans objet, un pur sujet séparé de la nature dont il fait partie.

    ? **Pure capacité de travail** : la puissance de travailler, détachée des moyens de l'exercer. Marx la nommera plus tard {violet}force de travail{/violet} ; en 1844, il parle encore du travail que l'ouvrier vend.

    **La phrase prépare la suite du passage.** C'est le point où la perte des objets se révèle {coral}perte de l'activité elle-même{/coral} : elle annonce la deuxième détermination du travail aliéné, l'activité étrangère à l'ouvrier.

    ! Le contresens à éviter : croire que l'aliénation consiste dans cette transformation du travail en objet. Le problème n'est pas {red}que le travail devienne objet{/red}, ce qui est normal pour une activité qui s'objective, mais {green}que l'ouvrier soit séparé de cet objet devenu essentiel{/green}.
