- id: m1844-p1c
  title: "Le monde humain dévalorisé, l'ouvrier produit comme marchandise"
  notes: |-
    **Le fait est élargi deux fois : de l'ouvrier au {coral}monde humain{/coral}, et du produit au travail qui {coral}produit l'ouvrier lui-même comme marchandise{/coral}.**

    **Pourquoi « dévalorisation » et « mise en valeur » ?** L'allemand oppose *Entwertung* et *Verwertung*, la perte de valeur et la mise en valeur, sur la même racine, *Wert*, la valeur. Le jeu de mots fait voir {amber}un transfert{/amber} : la valeur que gagne le monde des choses est celle que perd le monde des hommes. Et l'allemand dit plus que « va de pair » : la dévalorisation croît {amber}« en raison directe »{/amber} de la mise en valeur. C'est encore une proportion, non une simple simultanéité.

    ? **Valeur** : ce que vaut une chose à l'échange. Marx étend ici le mot au « monde humain », de sorte qu'il touche aussi {violet}ce que valent les hommes{/violet}, leur dignité. {yellow}Un quartier ouvrier peut se vider de ses habitants pendant que les entrepôts du port se remplissent.{/yellow}

    **Pourquoi « le monde » ?** La phrase généralise : ce n'est plus tel ouvrier qui s'appauvrit, c'est le monde des hommes (*Menschenwelt*) qui perd ce que gagne le monde des choses (*Sachenwelt*). Le rapport n'est pas un accident individuel, il est {coral}la structure d'une société{/coral}.

    **Que produit le travail ?** La dernière phrase lui donne trois produits : des marchandises, {amber}lui-même comme marchandise{/amber}, et {amber}l'ouvrier comme marchandise{/amber}. Le travail devient une chose qui se vend, et l'ouvrier avec lui. Mais comment le travail produirait-il l'ouvrier ? On peut le comprendre ainsi : chaque journée de travail, en ajoutant au capital, {coral}refait l'ouvrier tel qu'il était{/coral}, sans rien d'autre que sa capacité de travailler à vendre le lendemain. {yellow}Le journalier rentre le soir avec un salaire qui suffit tout juste à revenir le lendemain : son travail a reproduit sa condition.{/yellow} Le texte ne le démontre pas encore ; il pose le fait, et la suite en donnera la raison.

    **Pourquoi « en général » ?** La proportion revient une dernière fois, et « en général » l'étend à {green}toute production marchande{/green}, non à une branche particulière. Ce n'est pas le malheur des tisserands ou des mineurs : c'est la loi de toute production où l'on produit pour vendre.

    **Une loi, non un coupable.** Le paragraphe se garde de toute explication morale : il ne dit pas que les maîtres sont cupides ni que les ouvriers sont paresseux. Le fait est donné comme {amber}une loi impersonnelle{/amber}, et c'est pourquoi Marx peut demander ensuite ce qu'il exprime : une loi appelle une raison, non un coupable. Le fait, enfin, est pris aux économistes eux-mêmes : Smith tenait le salaire ordinaire pour {teal}« le plus bas qui soit compatible avec la simple humanité »{/teal}. Marx ne leur oppose pas une indignation, il leur retourne leurs propres résultats.

    ! « Le travail produit l'ouvrier » ne veut pas dire que {red}le travail fait l'homme{/red}, qu'il le forme et l'accomplit : il le produit {green}« comme une marchandise »{/green}, ce qui est l'inverse d'une formation de soi.
  passage:
    label: "§1"
    part: "1. Du fait à ce qu'il exprime"
    text: "La dévalorisation du monde humain va de pair avec la mise en valeur du monde matériel. Le travail ne produit pas seulement des marchandises ; il se produit lui-même ainsi que l'ouvrier comme une marchandise dans la mesure où il produit des marchandises en général."
