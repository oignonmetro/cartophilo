- id: m1844-p1b
  title: "L'ouvrier d'autant plus pauvre qu'il produit plus"
  notes: |-
    **Le fait est énoncé sous la forme d'{coral}une proportion inverse{/coral} : plus l'ouvrier produit, plus il est pauvre, et moins il vaut lui-même comme marchandise.**

    **Pourquoi « d'autant plus… que » ?** La construction marque {amber}une proportion{/amber}, non une simple coïncidence. Marx ne dit pas que l'ouvrier est pauvre {red}bien qu'{/red}il produise, ni {red}en même temps qu'{/red}il produit : il dit que sa pauvreté {green}croît avec{/green} sa production. La pauvreté ne coexiste pas avec la richesse, elle grandit à mesure qu'elle grandit. {yellow}Qu'on pense à une filature où des machines nouvelles permettent de tisser en un jour ce qui en demandait dix : l'étoffe abonde, mais les ouvriers, devenus trop nombreux pour les places, se disputent l'embauche et voient leur salaire baisser.{/yellow}

    **Pourquoi « en puissance et en volume » ?** La production grandit en efficacité et en quantité. Le mot de {violet}puissance{/violet} n'est pas indifférent : le paragraphe suivant fera du produit {amber}« une puissance indépendante »{/amber}. Ce qui croît en puissance, ce n'est pas l'ouvrier, c'est sa production.

    **Pourquoi l'ouvrier est-il une marchandise ?** La deuxième phrase change d'angle : elle ne parle plus de ce que l'ouvrier a, mais de ce qu'il {amber}vaut{/amber}. Pour qu'il ait un prix, il faut qu'il se vende, et que ce prix, le salaire, obéisse aux mêmes lois que celui des choses. Marx l'a établi dans la colonne du salaire, avec les économistes : {teal}« la demande d'hommes règle nécessairement la production des hommes comme de toute autre marchandise »{/teal}. Quand il y a plus de bras que d'emplois, le prix des bras baisse, comme celui de toute marchandise trop abondante.

    ? **Marchandise** : une chose produite pour être vendue, dont le prix se règle sur le marché par l'offre et la demande. Dire que l'ouvrier en devient une, c'est dire qu'il ne vit qu'en se vendant, et que {coral}son salaire est un prix{/coral}.

    **Mais pourquoi un prix d'autant plus bas qu'il crée plus de marchandises ?** Le texte ne le dit pas, parce que Marx l'a montré plus haut. Il faut une seconde prémisse : que la richesse produite {red}ne revienne pas à l'ouvrier{/red}, mais s'accumule ailleurs. Le début du manuscrit le disait : une société ne s'enrichit que {teal}« si beaucoup de travail est accumulé, car le capital est du travail accumulé ; donc si une partie toujours plus grande de ses produits est retirée à l'ouvrier »{/teal}. Des deux prémisses, l'ouvrier marchandise et la richesse retirée à l'ouvrier, suit la proportion inverse : plus il produit, plus grossit le capital qui achète son travail, et {coral}moins il vaut face à lui{/coral}.

    **L'allemand dit plus sobrement** que l'ouvrier devient une marchandise « d'autant meilleur marché » (*wohlfeiler*). D'autres traductions disent « d'autant plus vile », mot qui ajoute une nuance de mépris absente de l'allemand.

    ! Marx ne décrit pas {red}une pauvreté absolue{/red}, comme si l'ouvrier vivait forcément plus mal que ses pères : il décrit {green}une proportion{/green}, ce que l'ouvrier est relativement à ce qu'il produit.
