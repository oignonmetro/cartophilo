id: m1844
title: "Le produit, puissance étrangère (1844)"
subtitle: "Manuscrits de 1844, premier manuscrit, « Le travail aliéné », 1 / 5"
group: "Le travail aliéné (Manuscrits de 1844)"
depth: normale
icon: page
color: coral
intro: |-
  Le début du passage sur le travail aliéné : du fait économique (l'ouvrier s'appauvrit à mesure qu'il produit) à ce qu'il exprime, l'objectivation devenue perte de l'objet ; le produit se dresse devant l'ouvrier comme une puissance étrangère, comme Dieu devant l'homme.
lessons:
- id: m1844-i1
  title: "Le texte, sa place et son plan"
  notes: |-
    **Le texte est le début du passage que les éditeurs intitulent** {coral}**« Travail aliéné et propriété privée »**{/coral}**, dans le premier des *Manuscrits de 1844*.** Marx les rédige à Paris, au printemps et à l'été 1844, sans les destiner à la publication : ils ne paraîtront qu'en 1932. Il est cité dans la traduction GF de Jacques-Pierre Gougeon.

    **Où il se trouve dans le manuscrit.** Marx a d'abord partagé ses pages en {violet}trois colonnes{/violet}, le salaire, le profit du capital, la rente foncière, où il recopie et commente les économistes. À la page XXII, les colonnes cessent et un texte continu commence : c'est notre extrait, les quatre premiers paragraphes, de « Nous partons d'un fait économique actuel » à « hostile et étrangère ». Quatre autres unités en expliquent la suite.

    **Ce qui précède : un reproche adressé à l'économie politique.** Marx vient de faire le bilan des colonnes : en parlant la langue des économistes, il a montré avec leurs propres termes que l'ouvrier est ravalé au rang de marchandise, et que sa misère croît avec la puissance de sa production. Puis il se retourne contre eux : l'économie politique {red}part du fait de la propriété privée sans l'expliquer{/red}. Quand elle veut expliquer, elle se transporte dans {red}un état originel imaginaire{/red}, comme le théologien qui « explique l'origine du mal par le péché originel ».

    **Pourquoi ce reproche commande-t-il tout le texte ?** Parce qu'expliquer par une origine racontée, c'est supposer sous la forme d'une histoire ce qu'il faudrait comprendre. {yellow}Dire que les uns sont riches parce que leurs ancêtres étaient économes, et les autres pauvres parce que les leurs étaient paresseux{/yellow}, ce n'est pas expliquer la richesse et la pauvreté : c'est les supposer déjà là. Marx s'interdit ce détour. Il part {green}d'un fait présent{/green}, et cherchera à en {amber}déduire{/amber} la propriété privée, au lieu de la présupposer.

    ? **Économie politique** : la science de la production et de l'échange des richesses telle que la constituent Smith, Say et Ricardo, c'est-à-dire la description des lois du salaire, du profit et de la rente dans une société où tout se vend. L'allemand dit *Nationalökonomie*, « économie nationale ».

    **Ce qui suit.** Marx examine d'abord la perte de la nature, puis remonte du produit à l'activité qui le produit, à l'être générique de l'homme et aux rapports entre les hommes. Au terme du passage, il demande à qui appartiennent le produit et l'activité de l'ouvrier, s'ils ne sont pas à lui : ni aux dieux, ni à la nature, mais à {coral}« un autre homme que l'ouvrier »{/coral}. La propriété privée apparaît alors comme {amber}la conséquence{/amber} du travail aliéné, alors qu'elle en paraissait la cause. Notre texte est le point de départ de cette construction.

    | Mouvement | Lieu | Ce qui s'y joue |
    | poser le fait, le traduire en un rapport, distinguer l'objectivation de ce qu'elle devient | §1 et §2 | L'appauvrissement de l'ouvrier exprime que son produit lui fait face comme une puissance étrangère ; l'objectivation, réalisation du travail, devient dans le monde de l'économie politique une perte. |
    | pousser les trois renversements à l'extrême | §3 | L'ouvrier perd sa réalité jusqu'à la faim, les objets de la vie et du travail, le travail lui-même, et tombe sous la domination de son produit, le capital. |
    | remonter au principe et en dire le sens | §4 | Tout découle d'un seul rapport ; comme le croyant, l'ouvrier s'appauvrit de ce qu'il met hors de lui, mais, à la différence du croyant, il est privé d'objets. |

    ! Le texte ne dit pas encore {red}qui{/red} s'approprie le produit : il décrit un rapport entre l'ouvrier et ce qu'il produit, et ne nommera le capitaliste qu'au terme du passage. Ce silence est {green}une méthode{/green}, non un oubli.
