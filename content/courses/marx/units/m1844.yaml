- id: m1844-p4e
  title: "Plus l'ouvrier est actif, plus il est privé d'objets"
  notes: |-
    **Voici la formule la plus déroutante du texte, et sa réponse à la problématique : {coral}plus l'ouvrier est actif, plus il est sans objet{/coral}.** Il n'est pas ce qu'il produit, et plus son produit est grand, moins il est lui-même.

    **Pourquoi la formule est-elle déroutante ?** Si l'aliénation était la perte de soi dans l'objet, comme dans la religion, l'ouvrier qui a tout donné à l'objet serait {red}écrasé par les objets{/red}, non {green}privé d'objets{/green}. Celui qui produit sans cesse des objets devrait en être entouré. La phrase semble contredire ce qui précède.

    **Comment lire « privé d'objets » ?** L'allemand dit *gegenstandslos*, « sans objet ». Le mot est fort : non pas {red}pauvre en objets{/red}, mais {coral}dépourvu de tout rapport à l'objectivité{/coral}. Et l'allemand dit *Je größer also diese Tätigkeit* : la traduction omet le {violet}« donc »{/violet} (*also*), qui fait de la phrase une conséquence. Le même « donc » revient dans la dernière phrase, et la traduction l'efface encore.

    **D'où vient ce « donc » ?** Il ne se comprend qu'à partir du deuxième mouvement. On peut le déplier en trois étapes.
    - La vie que l'ouvrier met dans l'objet {amber}appartient à l'objet{/amber}, c'est-à-dire, puisque l'objet est capital, à ce qui lui fait face.
    - Plus il est actif, plus il grossit ce capital, et plus il est {amber}séparé des objets de la vie et du travail{/amber}, qui sont concentrés de l'autre côté.
    - Il ne lui reste alors que {amber}sa capacité de travailler{/amber}, une activité sans objet.

    L'aliénation n'est donc pas {red}un excès d'objectivité{/red}, la chute d'un sujet dans les choses : c'est {green}une perte d'objectivité{/green}. L'ouvrier est réduit à un sujet sans monde. {yellow}Le maçon qui a passé trente ans à bâtir des immeubles n'a, à la fin, ni maison, ni outils, ni rien qui témoigne de ce qu'il a fait : toute sa vie est dans des murs où il n'habite pas.{/yellow}

    **Pourquoi « il n'est pas ce qu'il produit » ?** L'allemand dit : « ce qu'est le produit de son travail, il ne l'est pas ». Normalement, {green}l'homme est ce qu'il fait{/green} : *L'Idéologie allemande* le dira en clair, ce que sont les individus {teal}« coïncide donc avec leur production, aussi bien avec ce qu'ils produisent qu'avec la façon dont ils le produisent »{/teal}. C'est cette identité qui est rompue.

    **Pourquoi « moins l'ouvrier est lui-même » ?** C'est la prémisse implicite du dernier « donc ». Si l'homme est ce qu'il produit, l'ouvrier dont le produit n'est pas le sien {coral}cesse d'être lui-même{/coral}. Et si cette perte d'objectivité est une perte de soi, c'est que l'homme est, pour Marx, {violet}un être naturel et objectif{/violet}, une partie de la nature, qui n'existe qu'en rapport avec des objets : le réduire à une pure subjectivité, c'est lui retirer son être même. Le texte le suppose sans l'énoncer ; la suite du passage le dira, avec la nature comme « corps non organique » de l'homme.

    **« Gagne en substance » ?** L'allemand dit seulement « plus ce produit est grand » (*je größer*). La traduction prête à Marx un vocabulaire de la substance qui n'est pas dans le texte.

    ! Le contresens à éviter : penser l'aliénation comme {red}la chute d'un sujet actif dans la fixité d'une chose{/red}. Le sujet pur, séparé de tout objet, n'est pas le point de départ de l'aliénation : {green}il en est le résultat{/green}.
  passage:
    label: "§4"
    part: "3. Le principe et son sens"
    text: "Plus cette activité est grande, plus l'ouvrier est privé d'objets. Il n'est pas ce qu'il produit par son travail. Plus ce produit gagne en substance, moins l'ouvrier est lui-même."
  points:
