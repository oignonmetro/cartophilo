- id: m1844-p2c
  title: "Le triple renversement dans le monde de l'économie politique"
  notes: |-
    **La phrase reprend terme à terme ce que le travail est en lui-même et dit ce qu'il devient dans la société que décrivent les économistes : {coral}trois couples, chacun formé d'un accomplissement et de son exact inverse{/coral}.**

    | Ce qu'est le travail | Ce qu'il devient pour l'ouvrier |
    | réalisation | perte de réalité |
    | objectivation | perte de l'objet et asservissement à lui |
    | appropriation | aliénation, dessaisissement |

    **Pourquoi « dans le monde de l'économie politique » ?** L'allemand dit *in dem nationalökonomischen Zustand*, « dans l'état économique » : la situation réelle que décrivent les économistes. Le complément est {coral}décisif{/coral} : il restreint le renversement {amber}à un état de la société{/amber}, et laisse ouverte la possibilité d'un autre. C'est la première réponse à la problématique : ce n'est pas l'objectivation qui aliène, c'est ce qu'elle devient {green}dans un monde déterminé{/green}.

    **Pourquoi « cette » réalisation ?** Le démonstratif reprend exactement le terme de la phrase précédente : c'est {amber}la même réalisation{/amber}, non une autre, qui se retourne. {yellow}En lui-même, le travail du menuisier se réalise dans la table ; dans une fabrique de meubles, il fait des tables qui partent aussitôt à la vente, n'en garde aucune, et dépend pour manger de la place qu'on veut bien lui laisser à l'établi.{/yellow}

    **Pourquoi « apparaît » ?** *Erscheint* dit la manière dont la réalisation {amber}se présente{/amber} dans cet état, {red}non une illusion{/red}. Le paragraphe suivant montrera que cette apparition se vérifie « à tel point » que l'ouvrier en meurt de faim.

    **Comment les mots sont-ils construits ?** L'allemand forge *Entwirklichung*, la déréalisation, en remplaçant le préfixe *ver-* de *Verwirklichung* par *ent-*, qui marque la séparation ou la perte : le mot est fait pour être {coral}l'exact inverse{/coral} de la réalisation. Et pour l'objet, il dit « perte {amber}et{/amber} servitude » (*Verlust und Knechtschaft*), non « ou » : l'ouvrier perd l'objet et en dépend à la fois. *Knechtschaft* est le mot de la servitude chez Hegel, dans la dialectique du maître et du serviteur : l'ouvrier devient {violet}le serviteur de sa propre œuvre{/violet}.

    ? **Appropriation** (*Aneignung*) : le fait de faire sien. Travailler, c'est s'approprier la nature en la transformant. Son inverse a deux noms : l'**aliénation** (*Entfremdung*), devenir étranger, et le **dessaisissement** (*Entäußerung*), se défaire de ce dans quoi on s'était exprimé. Le mot d'aliénation, jusque-là présent par le seul adjectif « étranger », est ici {amber}nommé pour la première fois{/amber}.

    **Qu'est-ce que la phrase suppose ?** Elle affirme le renversement sans dire ce qui le produit, et chaque couple repose sur une prémisse.
    - Pour que l'objectivation soit une **perte de l'objet**, il faut que l'objet produit {amber}ne reste pas à l'ouvrier{/amber} : c'est ce que les colonnes ont établi.
    - Pour qu'elle soit aussi une **servitude**, il faut de plus que l'ouvrier {amber}ait besoin de cet objet qu'il n'a plus{/amber}, pour vivre et pour travailler : on ne dépend pas de ce qu'on a perdu si l'on peut s'en passer. Le paragraphe suivant le montrera.
    - Pour que la réalisation soit une **perte de réalité**, il faut que la réalité de l'ouvrier soit dans son travail réalisé : c'est ce que la définition précédente a posé. Si son travail effectif est ailleurs, {coral}son effectivité est ailleurs{/coral}.

    **Une perte après coup ?** Marx ne dit pas que l'objectivation est {red}suivie{/red} d'une perte, comme si l'ouvrier produisait d'abord un objet et se le voyait ensuite retirer : l'objectivation {green}« apparaît comme »{/green} la perte. L'objet est {coral}toujours déjà perdu{/coral} : {yellow}l'ouvrier de la fabrique ne possède jamais, fût-ce un instant, la table qu'il fait ; elle appartient dès le premier coup de rabot à celui qui a acheté le bois et le temps du menuisier.{/yellow}

    ! Les trois couples ne sont pas {red}trois aliénations distinctes{/red} : ce sont {green}trois aspects d'un même renversement{/green}, et le paragraphe suivant les reprend dans le même ordre, chacun avec la même formule « à tel point ».
