- id: m1844-p9
  title: "Dans l'acte même de produire"
  notes: |-
    **L'aliénation n'est pas seulement dans le résultat : elle est {amber}dans l'acte même de la production{/amber}, dans l'activité productive.**

    Marx n'a considéré jusqu'ici qu'{red}un seul aspect{/red} : le rapport de l'ouvrier au produit. Mais le produit étranger suppose une activité étrangère : {coral}comment le produit ne serait-il pas étranger à l'ouvrier, si celui-ci ne devenait pas étranger à lui-même dans l'acte de produire ?{/coral} Le produit n'est que {violet}le résumé de l'activité{/violet} : si le produit est dépouillement, la production est {violet}dépouillement en acte{/violet}. L'aliénation de l'objet du travail est le résumé de l'aliénation dans l'activité même.

    ! C'est le passage du produit à l'activité, c'est-à-dire de la seconde à la première des déterminations.
  passage:
    label: "§9"
    text: "Nous n'avons considéré jusqu'ici l'aliénation, le dépouillement de l'ouvrier, que sous un seul aspect, celui de son rapport aux produits de son travail. Or, l'aliénation n'apparaît pas seulement dans le résultat, mais aussi dans l'acte même de la production, à l'intérieur de l'activité productive elle-même. Comment le produit ne serait-il pas étranger à l'ouvrier si celui-ci, dans l'acte même de la production, ne devenait pas étranger à lui-même ? Le produit n'est que le résumé de l'activité, de la production. Si le produit du travail est le dépouillement, la production elle-même doit être le dépouillement en acte, le dépouillement de l'activité, l'activité du dépouillement. L'aliénation de l'objet du travail n'est que le résumé de l'aliénation, du dépouillement, dans l'activité du travail elle-même."
  points:
  - id: m1844-p9-1
    fragment: "1/2"
    sentence: "« Nous n'avons considéré jusqu'ici l'aliénation, le dépouillement de l'ouvrier, que ___, celui de son rapport aux produits de son travail. Or, l'aliénation n'apparaît pas seulement dans le résultat, mais aussi dans l'acte même de la production, à l'intérieur de l'activité productive elle-même. Comment le produit ne serait-il pas étranger à l'ouvrier si celui-ci, dans l'acte même de la production, ne devenait pas étranger à lui-même ? »"
