- id: m1844-p4f
  title: "Ce que signifie l'aliénation dans le produit"
  notes: |-
    **La dernière phrase définit l'aliénation dans le produit en traçant {coral}la ligne qui la sépare de l'objectivation{/coral} : que le travail devienne un objet arrive à tout travail ; l'aliénation commence quand ce travail objectivé existe hors de l'ouvrier, sans lui et contre lui.**

    **Pourquoi « signifie » ?** L'allemand dit *hat die Bedeutung*, « a pour signification » : la phrase est {amber}une définition{/amber}, qui explicite le sens d'un mot. Et le mot est ici *Entäußerung*, le dessaisissement, la perte de ce dans quoi l'ouvrier s'est exprimé.

    **Pourquoi « non seulement… mais » ?** La construction sépare {coral}deux niveaux{/coral}. Le premier n'est pas nié, il est dépassé : le travail devient bien un objet, une réalité extérieure (*eine äußere Existenz*), {green}ce qui est le propre de tout objet{/green}. Le second ajoute ce qui fait l'aliénation.

    | Ce qui arrive à tout travail | Ce qui fait l'aliénation |
    | devenir un objet | exister en dehors de l'ouvrier, indépendamment de lui |
    | une réalité extérieure | une puissance autonome face à lui |
    | la vie mise dans l'objet | la vie prêtée qui s'oppose à lui, hostile |

    **Quelle différence entre « extérieur » et « en dehors de lui » ?** Les deux mots sont voisins et disent deux choses. *Äußere Existenz*, l'existence au-dehors, est celle de tout objet, qui existe dans le monde. *Außer ihm*, hors de lui, dit une existence {amber}séparée de l'ouvrier{/amber}. {yellow}Un peintre dont le tableau est accroché dans un musée voit son travail devenu objet, extérieur ; un ouvrier dont le travail, devenu machine, sert à le remplacer voit son travail devenu puissance hostile.{/yellow}

    **Pourquoi cette gradation ?** « Indépendamment de lui, étranger à lui » va de {amber}la séparation{/amber} à {amber}l'étrangeté{/amber}. « Une puissance autonome » (*selbständig*, qui se tient par soi) reprend la « puissance indépendante » du deuxième paragraphe. « Hostile et étrangère » ajoute {red}l'hostilité{/red} à l'étrangeté : ce qui est étranger à l'ouvrier lui est aussi contraire.

    **Pourquoi « la vie qu'il a prêtée » ?** *Verliehen*, prêté, conféré : le mot laisse entendre qu'elle {amber}aurait dû lui revenir{/amber}, comme un prêt qu'on rembourse. La puissance du produit n'est pas une volonté propre des choses : c'est {coral}la puissance du travail vivant qui s'y est fixé{/coral}, et qui ne revient pas à l'ouvrier.

    **Pourquoi « s'oppose à lui » ?** L'allemand reprend *gegenübertreten*, le verbe du deuxième paragraphe, où le produit « se dresse devant » l'ouvrier. {coral}Le texte se boucle sur sa première affirmation{/coral} : il est parti du produit qui fait face, il y revient, mais en sachant maintenant pourquoi.

    **La phrase répond-elle à la problématique ?** Oui, mais {amber}par une définition plutôt que par une preuve{/amber}. Elle dit où passe la ligne entre objectivation et aliénation, non pourquoi, dans le monde de l'économie politique, l'une se change en l'autre. Ce qui fait passer de l'une à l'autre, tout ce qui précède l'a montré : le produit est retiré à l'ouvrier, s'accumule comme capital et commande à son travail. La cause dernière, Marx la cherchera dans la suite du passage, du côté de l'activité, puis de l'être générique, et la trouvera dans le rapport à {teal}« un autre homme que l'ouvrier »{/teal}.

    ! La phrase écarte en toutes lettres la lecture par la chosification : l'aliénation, dit-elle, n'est {red}pas seulement que le travail devienne un objet{/red}. Elle est {green}l'existence séparée et hostile{/green} de ce travail devenu objet.
