- id: m1844-p4c
  title: "Comme dans la religion"
  notes: |-
    **Marx rapproche le rapport de l'ouvrier à son produit de celui du croyant à son Dieu : dans les deux cas, {coral}ce que l'homme met hors de lui ne lui revient pas et l'appauvrit d'autant{/coral}.** La comparaison rend saisissable la proportion qu'on vient de déduire.

    **Pourquoi « c'est la même chose » ?** L'allemand dit *Es ist ebenso*, « il en va de même » : c'est {amber}une analogie{/amber}, qui affirme une identité de structure, {red}non une identité de nature{/red}. Et c'est par la forme « plus… moins » que l'analogie s'impose : la phrase reprend exactement la proportion inverse qui court depuis le début.

    **Pourquoi « l'homme » ?** Le sujet n'est plus « l'ouvrier », mais {amber}l'homme en général{/amber} : la comparaison élargit la question du travail à celle de l'homme, ce que la suite du passage fera avec l'être générique.

    **Pourquoi « projette » ?** L'allemand dit seulement *setzt*, « place, pose ». La traduction introduit le vocabulaire de la projection, qui est celui de Feuerbach : juste sur le fond, il n'est pas dans le mot de Marx. « De choses » : il s'agit {violet}des qualités et des puissances humaines{/violet}, non d'objets matériels. {yellow}Plus le fidèle attribue à Dieu la bonté, la sagesse et la puissance, plus il se tient lui-même pour mauvais, ignorant et faible.{/yellow}

    ? **Aliénation religieuse** : chez Feuerbach (*L'Essence du christianisme*, 1841), le mouvement par lequel l'homme attribue à un être imaginaire ses propres qualités portées à l'infini, puis s'incline devant lui comme devant un autre. {teal}« Pour enrichir Dieu, l'homme doit se faire pauvre ; pour que Dieu soit tout, l'homme doit n'être rien »{/teal} : la phrase de Marx le cite presque mot pour mot.

    **Qu'est-ce qui justifie le parallèle, au-delà de la ressemblance des formules ?** Une structure commune en trois points, que Marx ne détaille pas.
    - L'objet est fait {amber}de la substance même de celui qui le produit{/amber} : Dieu n'est que l'essence humaine portée à l'infini, comme le produit n'est que le travail de l'ouvrier fixé dans un objet.
    - Le producteur {amber}ne se reconnaît pas{/amber} dans cet objet et ne le possède pas comme sien : le croyant adore en Dieu un autre que lui, l'ouvrier fait face à un produit qui ne lui appartient pas.
    - L'objet acquiert sur son producteur {amber}une puissance qu'il tient de lui{/amber} : Dieu commande à l'homme, le capital domine l'ouvrier.

    C'est {coral}la première de ces conditions qui fonde l'analogie{/coral} : parce que l'objet est fait de ce qu'est l'homme, tout ce que l'objet gagne, l'homme le perd.

    **Où l'analogie s'arrête-t-elle ?** Dieu est {red}un être de l'imagination{/red} : il suffirait que l'homme reconnaisse en lui sa propre essence pour la reprendre. Le produit du travail, lui, est {green}un objet réel{/green}, et le capital ne disparaît pas quand l'ouvrier comprend qu'il est son œuvre. La dépossession religieuse se fait {amber}dans la conscience{/amber}, la dépossession ouvrière {amber}dans la production{/amber}. C'est pourquoi Marx tenait déjà, dans l'*Introduction* de 1843-1844, la critique de la religion pour achevée, et appelait à critiquer les conditions qui rendent l'illusion nécessaire.

    ! L'analogie {red}ne démontre pas{/red} : elle rend la thèse {green}plausible et frappante{/green}. Elle risque même d'en masquer le point le plus original, que la phrase suivante va dire : le croyant n'est pas privé de Dieu, l'ouvrier est privé d'objets.
  passage:
    label: "§4"
    part: "3. Le principe et son sens"
    text: "C'est la même chose avec la religion. Plus l'homme projette de choses en Dieu, moins il en garde en lui-même."
  points:
