- id: m1844-p3
  title: "Une perte de réalité jusqu'à la mort"
  notes: |-
    **La perte est radicale : l'ouvrier perd sa réalité jusqu'à en mourir de faim, et jusqu'à l'objet de son travail lui-même.**

    Le dessaisissement porte sur {red}deux sortes d'objets{/red} : {amber}les objets les plus indispensables à la vie{/amber} et {amber}les objets du travail{/amber}. Le travail lui-même devient un objet dont l'ouvrier ne s'empare que par un grand effort et irrégulièrement. Et {coral}plus il produit d'objets, moins il possède{/coral} : il tombe sous la domination de son propre produit, {violet}le capital{/violet}.

    ! Marx ne dit pas que l'ouvrier produit trop peu : il dit que son produit se retourne contre lui.
  passage:
    label: "§3"
    text: "La réalisation du travail se révèle être à tel point une perte de réalité que l'ouvrier perd sa réalité jusqu'à en mourir de faim. L'objectivation se révèle à tel point être la perte de l'objet que l'ouvrier est spolié non seulement des objets les plus indispensables à la vie, mais encore des objets du travail. Oui, le travail lui-même devient un objet dont il ne peut s'emparer qu'en faisant le plus grand effort et avec les interruptions les plus irrégulières. L'appropriation de l'objet se révèle à tel point être une aliénation que, plus l'ouvrier produit d'objets, moins il peut posséder et plus il tombe sous la domination de son propre produit, le capital."
  points:
  - id: m1844-p3-1
    fragment: "1/2"
    sentence: "« La réalisation du travail se révèle être à tel point ___ que l'ouvrier perd sa réalité jusqu'à en mourir de faim. L'objectivation se révèle à tel point être la perte de l'objet que l'ouvrier est spolié non seulement des objets les plus indispensables à la vie, mais encore des objets du travail. Oui, le travail lui-même devient un objet dont il ne peut s'emparer qu'en faisant le plus grand effort et avec les interruptions les plus irrégulières. »"
