    sentence: "« Tandis que le travail aliéné rend étrangers à l'homme 1) la nature et 2) lui-même, ___, il rend aussi l'espèce humaine étrangère à l'homme : il fait pour lui de la vie générique le moyen de la vie individuelle. »"
    answer: "sa propre fonction active, son activité vitale"
    alt: []
