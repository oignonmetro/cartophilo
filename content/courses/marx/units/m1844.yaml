- id: m1844-p4d
  title: "L'ouvrier place sa vie dans l'objet"
  notes: |-
    **Marx revient de la religion au travail et dit ce que l'ouvrier met dans son produit : {coral}sa vie{/coral}. Une fois dans l'objet, cette vie {coral}appartient à l'objet{/coral}.**

    **Que veut dire « sa vie » ?** L'allemand dit *legt sein Leben in den Gegenstand*, « pose sa vie dans l'objet ». La vie est ici {amber}l'activité vivante{/amber}, les forces et le temps de l'ouvrier : le passage le dira plus loin, en demandant {teal}« qu'est-ce que la vie sinon l'activité ? »{/teal}. Le mot est plus fort que « travail » : il dit que ce qui passe dans l'objet, ce n'est pas une part extérieure de l'ouvrier, c'est {coral}ce qui le fait vivre et ce qu'il est{/coral}. {yellow}Les heures passées à l'établi ne sont pas prises sur la vie du menuisier : elles sont sa vie.{/yellow}

    **Pourquoi la première phrase ne fait-elle pas problème ?** Mettre sa vie dans l'objet est {green}normal{/green} : c'est l'objectivation même, que le deuxième paragraphe a définie comme la réalisation du travail. Ici encore, Marx prend soin de ne pas accuser le fait de s'objectiver.

    **Où est le renversement ?** Dans « mais alors ». La conjonction marque le passage de l'ordre normal à l'ordre aliéné : ce n'est pas le fait de mettre sa vie dans l'objet qui fait problème, c'est qu'{coral}elle cesse ensuite de lui appartenir{/coral}. La vie de l'ouvrier {amber}change de propriétaire{/amber}, et c'est l'objet qui la possède.

    **Pourquoi l'objet, et non un autre homme ?** Marx garde le régime impersonnel : il ne dit pas que la vie de l'ouvrier appartient au capitaliste, mais {violet}à l'objet{/violet}. Or l'objet, on le sait depuis le paragraphe précédent, est capital. Dire que la vie de l'ouvrier appartient à l'objet, c'est donc dire qu'{amber}elle appartient à ce qui lui fait face{/amber}, et qu'elle sert à le dominer. {yellow}Les années de travail d'un tisserand sont dans les métiers et les entrepôts de la manufacture, qui décident maintenant de son embauche.{/yellow}

    **Pourquoi la perte est-elle si grave ?** Parce que l'ouvrier ne perd pas un bien qu'il aurait possédé à côté de lui-même : il perd {coral}ce qu'il a été pendant qu'il travaillait{/coral}. Si sa vie est son activité, et que son activité passe dans un objet qui ne lui appartient pas, c'est une part de sa vie qui lui est prise, sans retour possible : le temps passé ne se rend pas.

    ! « Elle appartient à l'objet » n'est pas {red}une personnification poétique{/red} : c'est {green}un rapport de propriété réel{/green}, puisque l'objet est le capital et que le capital dispose de ce que l'ouvrier y a mis.
  passage:
    label: "§4"
    part: "3. Le principe et son sens"
    text: "L'ouvrier place sa vie dans l'objet. Mais alors celle-ci ne lui appartient plus, elle appartient à l'objet."
