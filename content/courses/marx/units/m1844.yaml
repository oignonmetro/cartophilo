- id: m1844-p5
  title: "La nature, matière du travail"
  notes: |-
    **Pour examiner l'objectivation, Marx rappelle d'abord que l'ouvrier ne crée rien {red}sans la nature{/red}.**

    La nature, le {violet}monde extérieur sensible{/violet}, est {amber}la matière dans laquelle le travail se réalise{/amber}, au sein de laquelle il s'exerce, à partir de laquelle et au moyen de laquelle il produit. Le travail a donc une condition qui n'est pas lui : un monde d'objets. Marx annonce l'enjeu : l'aliénation est {coral}la perte de l'objet, de son produit{/coral}, mais aussi celle des objets sans lesquels il ne produit rien.
  passage:
    label: "§5"
    text: "Examinons de plus près l'objectivation, la production de l'ouvrier et, en elle, l'aliénation, la perte de l'objet, de son produit. L'ouvrier ne peut plus rien créer sans la nature, sans le monde extérieur sensible. Elle est la matière dans laquelle son travail se réalise, au sein de laquelle il s'exerce, à partir de laquelle et au moyen de laquelle il produit."
