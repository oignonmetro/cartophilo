    sentence: "« C'est la même chose avec la religion. Plus l'homme projette de choses en Dieu, moins il en garde en lui-même. L'ouvrier place sa vie dans l'objet. Mais alors celle-ci ne lui appartient plus, elle appartient à l'objet. Plus cette activité est grande, plus l'ouvrier est privé d'objets. Il n'est pas ce qu'il produit par son travail. Plus ce produit gagne en substance, ___. »"
    answer: "moins l'ouvrier est lui-même"
    alt: []
  - id: m1844-p4-9
    fragment: "3/3"
    sentence: "« L'aliénation de l'ouvrier dans son produit signifie non seulement que ___, mais que son travail existe en dehors de lui, indépendamment de lui, étranger à lui, et devient une puissance autonome face à lui, que la vie qu'il a prêtée à l'objet s'oppose à lui, hostile et étrangère. »"
    answer: "son travail devient un objet, une réalité extérieure"
    alt: []
