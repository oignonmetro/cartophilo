- id: m1844-p3
  title: "2.1 à 2.4 Le renversement poussé à l'extrême"
  notes: |-
    **Les trois renversements se vérifient {amber}« à tel point »{/amber} que l'ouvrier perd sa réalité jusqu'à la faim, ses objets jusqu'au travail lui-même, et tombe sous la domination de son produit, {coral}le capital{/coral}.**

    **2.1 Jusqu'à mourir de faim.** La déréalisation n'est pas une métaphore : la réalité de l'ouvrier, c'est d'abord son existence de vivant. Implicite : il n'a {amber}pas d'autre accès aux vivres que son salaire{/amber}, et son travail dépend de la demande ; dès qu'elle manque, il tombe « dans la mendicité ou la mort par inanition » (colonne du salaire).

    **2.2 Les objets de la vie et les objets du travail.** « Spolié » : vocabulaire du vol, sans voleur nommé. Il perd les vivres, et {coral}la matière et les outils{/coral} de son travail. Implicite : ces outils sont eux-mêmes du travail accumulé, retiré de ses mains ; son objectivation forme le stock d'objets dont il est privé. Une perte {green}bien plus radicale{/green} que celle du seul produit, une perte d'objectivité.

    **2.3 Le travail lui-même devenu objet.** « Oui » enchérit. L'ouvrier doit s'emparer (*sich bemächtigen*) du travail « en faisant le plus grand effort et avec les interruptions les plus irrégulières » : l'embauche et le chômage. Raison : sans travail, ni pain ni outils ; le travail devient {amber}l'objet essentiel{/amber} qui donne accès à tous les autres, et l'ouvrier est réduit à une {violet}pure capacité de travail{/violet}, séparée des moyens de passer à l'acte.

    **2.4 La domination du capital.** Plus il produit, {coral}moins il peut posséder{/coral}, et plus il tombe sous la domination (*Herrschaft*, qui répond à la *Knechtschaft*) de {amber}« son propre produit, le capital »{/amber} : le capital n'est que ses produits accumulés contre lui. Marx ne nomme pas encore {red}le capitaliste{/red} : la question « à qui appartient le produit ? » viendra au terme du passage.

    ! Contresens massif : croire que l'aliénation est que {red}le travail devienne objet{/red}. Le problème est que l'ouvrier soit {green}séparé{/green} de cet objet devenu essentiel. Ce mouvement ne prouve rien de plus que le §2 : il en {amber}mesure l'ampleur{/amber}.
  passage:
    label: "§3"
    part: "2. Le renversement poussé à l'extrême"
    text: "La réalisation du travail se révèle être à tel point une perte de réalité que l'ouvrier perd sa réalité jusqu'à en mourir de faim. L'objectivation se révèle à tel point être la perte de l'objet que l'ouvrier est spolié non seulement des objets les plus indispensables à la vie, mais encore des objets du travail. Oui, le travail lui-même devient un objet dont il ne peut s'emparer qu'en faisant le plus grand effort et avec les interruptions les plus irrégulières. L'appropriation de l'objet se révèle à tel point être une aliénation que, plus l'ouvrier produit d'objets, moins il peut posséder et plus il tombe sous la domination de son propre produit, le capital."
