- id: m1844-p18
  title: "Ce que le travail aliéné arrache à l'homme"
  notes: |-
    **En façonnant le monde objectif, l'homme s'affirme réellement comme être générique ; le travail aliéné lui arrache {red}cet objet{/red}, et avec lui sa vie générique.**

    La production est {violet}la vie générique active{/violet} : la nature y apparaît comme son œuvre et sa réalité. L'objet du travail est {coral}l'objectivation de la vie générique{/coral} : l'homme ne se dédouble pas seulement intellectuellement, comme dans la conscience, mais {amber}activement, réellement{/amber}, et se contemple dans un monde qu'il a créé. Le travail aliéné arrache à l'homme l'objet de sa production, donc sa véritable objectivité générique, et transforme {red}sa supériorité sur l'animal en infériorité{/red}, puisque son corps non organique lui est dérobé. Il dégrade ainsi en moyen la libre activité.
  passage:
    label: "§18"
    text: "C'est précisément en façonnant le monde objectif que l'homme s'affirme réellement comme un être générique. Cette production est sa vie générique active. Grâce à cette production, la nature apparaît comme son œuvre et sa réalité. L'objet du travail est donc l'objectivation de la vie générique de l'homme, car il ne se dédouble pas lui-même de façon seulement intellectuelle, comme c'est le cas dans la conscience, mais activement, réellement, et il se contemple ainsi dans un monde qu'il a lui-même créé. Ainsi tandis que le travail aliéné arrache à l'homme l'objet de sa production, il lui arrache sa vie générique, sa véritable objectivité générique, et transforme sa supériorité sur l'animal en infériorité, puisque son corps non organique, la nature, lui est dérobé. De même, en dégradant au rang de moyen l'activité propre, la libre activité, le travail aliéné fait de la vie générique de l'homme le moyen de son existence physique."
  points:
  - id: m1844-p18-1
    fragment: "1/2"
    sentence: "« C'est précisément en façonnant le monde objectif que l'homme ___. Cette production est sa vie générique active. Grâce à cette production, la nature apparaît comme son œuvre et sa réalité. L'objet du travail est donc l'objectivation de la vie générique de l'homme, car il ne se dédouble pas lui-même de façon seulement intellectuelle, comme c'est le cas dans la conscience, mais activement, réellement, et il se contemple ainsi dans un monde qu'il a lui-même créé. »"
