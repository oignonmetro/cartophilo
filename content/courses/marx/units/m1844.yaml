- id: m1844-p1
  title: "« Nous partons d'un fait économique actuel »"
  notes: |-
    **La première phrase annonce une méthode : partir {coral}d'un fait{/coral}, et d'un fait présent, au lieu d'une origine racontée.** Chacun de ses mots répond au paragraphe qui précède, où l'économiste « part » de la propriété privée sans l'expliquer.

    **Pourquoi « nous partons » ?** Le verbe désigne un point de départ de méthode, et il fait écho au reproche qui précède : l'économie politique {red}part{/red} du fait de la propriété privée et le laisse inexpliqué. Marx part d'un autre fait, et c'est {amber}de ce fait qu'il déduira la propriété privée{/amber}. Le point de départ décide de tout : partir de la propriété, c'est la supposer ; partir du fait de la misère ouvrière, c'est se donner les moyens de la comprendre.

    **Pourquoi « un fait » ?** Un fait (*Faktum*) est ce qui est donné et constatable, non une hypothèse ni un jugement de valeur. Marx ne dénonce pas encore : {green}il constate{/green}. C'est une prudence : une indignation se discute, un fait s'impose à quiconque le regarde.

    **Pourquoi « économique » ?** L'allemand dit *nationalökonomisch* : le fait {amber}tel que l'économie politique le décrit{/amber}, dans ses propres termes. Ce n'est pas Marx qui l'invente, ce sont les économistes qui le reconnaissent. Il en tire sa force : on ne pourra pas lui objecter qu'il part d'un préjugé, puisqu'il part des résultats mêmes de ses adversaires.

    **Pourquoi « actuel » ?** *Gegenwärtig*, présent. Le mot s'oppose à {red}l'état originel imaginaire{/red} où se transporte l'économiste. Marx s'interdit le récit des origines : il cherchera le sens du fait {green}dans le fait présent lui-même{/green}, dans ce qui se passe chaque fois qu'un ouvrier travaille. {yellow}Au lieu de se demander comment, autrefois, les uns sont devenus riches et les autres pauvres, on se demande ce qui, aujourd'hui, dans chaque journée de travail, appauvrit celui qui travaille.{/yellow}

    ! « Partir d'un fait » ne veut pas dire {red}s'en tenir au fait{/red} : tout le texte consistera à dire ce que ce fait {green}« exprime »{/green}.
