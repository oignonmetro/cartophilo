- id: m1844-p4
  title: "Toutes les conséquences dans une seule détermination"
  notes: |-
    **Après avoir montré jusqu'où vont les trois renversements, Marx remonte à leur principe : tous découlent d'{coral}une seule détermination{/coral}, le fait que l'ouvrier se rapporte à ce qu'il produit comme à un objet étranger.** Le texte passe des faits à leur raison.

    **Pourquoi « toutes ces conséquences » ?** Le pluriel rassemble tout ce qui précède : la mort de faim, la perte des objets de la vie et du travail, le travail devenu butin, la domination du capital. Ce qui était présenté comme {amber}des faits{/amber} est désormais requalifié en {amber}conséquences{/amber}. Le mot change le statut de tout le paragraphe précédent : ce n'était pas une série de malheurs juxtaposés, c'était le déploiement d'un seul principe.

    **Pourquoi « par définition » ?** L'allemand dit que toutes ces conséquences {violet}« résident dans la détermination »{/violet} (*in der Bestimmung … liegen*). Une détermination est ce qui caractérise une chose ; les conséquences y sont {amber}contenues{/amber}, {yellow}comme les propriétés du triangle sont contenues dans sa définition et s'en tirent sans rien ajouter{/yellow}. La traduction « par définition » rend bien ce caractère de contenu, mais elle peut faire croire que Marx {red}part d'une définition posée d'avance{/red} ; il part d'un rapport {green}tiré du fait{/green}.

    **Pourquoi « dans le même rapport qu'à l'égard d'un objet étranger » ?** L'allemand *sich verhalten zu … als*, « se rapporter à… comme à », désigne {amber}la manière dont l'ouvrier se comporte{/amber} envers son produit. Ce n'est pas seulement que le produit est étranger : c'est que l'ouvrier {coral}se tient devant lui comme devant un objet étranger{/coral}, qu'il ne peut ni posséder, ni reconnaître comme sien.

    ? **Rapport** (*Verhältnis*, *sich verhalten*) : la manière dont un être se comporte envers un autre, et se définit par là. Parler du rapport de l'ouvrier à son produit, c'est dire que l'ouvrier {violet}est ce qu'il est dans la manière dont il se tient devant ce qu'il fait{/violet}. Le mot deviendra central dans tout le passage.

    **Le texte n'expose-t-il pas les choses à l'envers ?** Oui, et c'est voulu. Les conséquences ont été exposées avant leur principe, alors que, dans l'ordre des raisons, le principe vient d'abord. Marx procède {amber}par analyse, puis par synthèse{/amber} : il est parti du fait, en a dégagé le rapport qui l'explique, et montre maintenant que ce rapport contient tout ce qu'on avait constaté. {coral}L'ordre d'exposition est l'inverse de l'ordre des raisons{/coral} : ce paragraphe, quoique placé en dernier, fonde tous les autres.

    **Le raisonnement n'est-il pas circulaire ?** Le rapport a été tiré du fait, et le fait est maintenant déduit du rapport. Mais le cercle {green}n'est pas vicieux{/green}, car le rapport {amber}dit plus que le fait{/amber} : il en donne la forme générale, qui vaut pour toute production dans ces conditions. C'est pourquoi la proportion inverse, simplement constatée au début, va devenir « évidente » dans la phrase suivante.

    ! Marx ne tire pas la misère ouvrière {red}d'une définition de l'homme{/red} posée a priori : il remonte d'un fait au rapport qu'il contient, puis {green}redescend de ce rapport aux faits{/green} pour les rendre nécessaires.
  passage:
    label: "§4"
    part: "3. Le principe et son sens"
    text: "Toutes ces conséquences découlent du fait que, par définition, l'ouvrier se trouve devant le produit de son propre travail dans le même rapport qu'à l'égard d'un objet étranger."
