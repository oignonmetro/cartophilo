- id: m1844-p3b
  title: "Spolié des objets de la vie et des objets du travail"
  notes: |-
    **Le deuxième renversement est poussé à sa limite : l'ouvrier ne perd pas seulement l'objet qu'il a produit, il manque {coral}des objets dont il a besoin pour vivre, et même de ceux dont il a besoin pour travailler{/coral}.** La perte de l'objet devient perte des objets en général.

    **Pourquoi « spolié » ?** L'allemand dit que l'ouvrier est dépouillé (*beraubt*, de la famille de *Raub*, le vol). Le mot emprunte {amber}au vocabulaire du vol{/amber}, mais {red}sans voleur nommé{/red} : la dépossession est décrite comme un état, non encore comme l'acte de quelqu'un. Marx garde le régime impersonnel qu'il a choisi depuis le début.

    **Pourquoi « non seulement… mais encore » ?** La gradation va du plus attendu au plus grave.
    - **Les objets les plus indispensables à la vie** : la nourriture, le vêtement, le logement, sans lesquels on ne peut pas continuer à vivre.
    - **Les objets du travail** : {violet}la matière qu'on travaille et les instruments avec lesquels on la travaille{/violet}. Ce sont les objets dans lesquels le travail doit s'objectiver ; leur perte touche donc l'objectivation {coral}à sa racine{/coral}. Sans eux, l'ouvrier ne peut même plus produire.

    {yellow}Le tisserand n'a ni assez de pain ni métier à tisser : la laine qu'il travaille et le métier qu'il manie appartiennent à un autre.{/yellow} Et le pluriel « objets », après le singulier « l'objet », marque l'élargissement.

    **Pourquoi l'objectivation priverait-elle l'ouvrier des objets du travail ?** C'est le point le plus étrange : comment le fait de produire des objets pourrait-il priver des instruments de production ? On peut reconstruire le lien en deux étapes.
    - La matière et les outils avec lesquels l'ouvrier travaille sont {amber}eux-mêmes des produits du travail{/amber}, du travail passé, accumulé : c'est ce que les économistes appellent le capital, « du travail accumulé ».
    - Ces produits {amber}ne sont pas à lui{/amber}, puisque ses produits lui sont retirés.

    Il suit que l'objectivation du travail, en s'accumulant hors des mains de l'ouvrier, {coral}forme elle-même le stock d'objets dont il est privé{/coral} : les métiers à tisser qui manquent au tisserand sont faits du travail des ouvriers. La perte de l'objet n'est donc pas seulement la perte du produit d'hier : {green}elle est la cause de la dépossession de demain{/green}.

    **Une perte bien plus radicale que celle du produit.** Si l'ouvrier perdait seulement l'objet produit, on pourrait l'expliquer par le fait qu'un autre se l'approprie. Mais il perd les objets de la vie, auxquels il n'a plus accès qu'en travaillant, et les objets du travail, qu'il ne possède pas : il n'a plus d'accès direct à la matière, {amber}il faut qu'on la lui présente{/amber}. C'est une {violet}perte d'objectivité{/violet} : l'ouvrier est séparé non d'un objet, mais de tout ce dans quoi son activité pourrait se réaliser. Le début du manuscrit le notait : les {teal}« moyens d'existence et d'activité »{/teal} de l'ouvrier sont {teal}« de plus en plus concentrés entre les mains du capitaliste »{/teal}.

    ! Marx ne juxtapose pas {red}deux misères{/red}, la faim et le chômage : les deux pertes ont {green}une seule source{/green}, la séparation de l'ouvrier d'avec les objets ; et la seconde aggrave la première, puisque sans objets du travail il n'a plus accès aux objets de la vie.
