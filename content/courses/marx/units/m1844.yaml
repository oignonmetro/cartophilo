- id: m1844-p2
  title: "Le produit se dresse comme un être étranger"
  notes: |-
    **Le fait s'explique ainsi : le produit du travail se dresse devant l'ouvrier comme {red}un être étranger{/red}, et la réalisation du travail apparaît comme la perte de l'objet.**

    Le produit est {violet}l'objectivation{/violet} du travail : du travail {amber}fixé, matérialisé dans un objet{/amber}. La réalisation du travail est son objectivation. Mais {coral}dans le monde de l'économie politique{/coral}, cette réalisation apparaît comme {red}perte de sa réalité{/red} pour l'ouvrier, l'objectivation comme perte de l'objet ou asservissement à lui, l'appropriation comme {violet}aliénation{/violet} et dessaisissement.

    ! Marx ne dit pas que l'objectivation est aliénante en soi : il décrit ce qu'elle devient dans le monde de l'économie politique.
  passage:
    label: "§2"
    text: "Ce fait n'exprime rien d'autre que ceci : l'objet que le travail produit, son produit, se dresse devant lui comme un être étranger, comme une puissance indépendante du producteur. Le produit du travail est le travail qui s'est fixé, matérialisé dans un objet, il est l'objectivation du travail. La réalisation du travail est son objectivation. Dans le monde de l'économie politique, cette réalisation du travail apparaît comme la perte pour l'ouvrier de sa réalité, l'objectivation comme la perte de l'objet ou l'asservissement à celui-ci, l'appropriation comme l'aliénation, le dessaisissement."
  points:
  - id: m1844-p2-1
    fragment: "1/2"
    sentence: "« Ce fait n'exprime rien d'autre que ceci : l'objet que le travail produit, son produit, se dresse devant lui comme ___, comme une puissance indépendante du producteur. Le produit du travail est le travail qui s'est fixé, matérialisé dans un objet, il est l'objectivation du travail. »"
    answer: "un être étranger"
