- id: m1844-p7b
  title: "Six inversions selon les lois de l'économie"
  notes: |-
    **La parenthèse traduit dans {amber}le langage des économistes{/amber} ce que Marx vient d'établir en philosophe : {red}ce qui est gagné du côté de l'objet est perdu du côté de l'ouvrier{/red}.**

    On serait tenté d'y lire six constats juxtaposés, six coïncidences malheureuses. Mais la série applique {violet}un seul mécanisme{/violet}, posé au §4 : l'ouvrier place sa vie dans l'objet, et cet objet appartient à un autre. Plus il met de lui-même dans le produit, plus il nourrit {coral}une puissance étrangère qui lui fait face{/coral}, et moins il lui reste, comme l'homme qui projette tout en Dieu. Ce n'est donc pas qu'il produise trop peu : {red}c'est le fait même de produire, dans ces conditions, qui l'appauvrit{/red}. Et la série monte {amber}du plus matériel au plus spirituel{/amber}.

    ? **Lois de l'économie** : les régularités que décrit l'économie politique classique (Smith, Say, Ricardo) dans une société de propriété privée et de salariat. Marx ne les tient pas pour naturelles, mais les prend pour données : sa critique prend l'économie politique {teal}au mot{/teal}.

    | Plan | Du côté de l'objet | Du côté de l'ouvrier |
    | les biens | plus l'ouvrier produit | moins il a à consommer |
    | la valeur | plus il crée de valeurs | plus il se déprécie et perd en dignité |
    | le corps | plus son produit a de forme | plus l'ouvrier est difforme |
    | la culture | plus son objet est civilisé | plus l'ouvrier est barbare |
    | la puissance | plus le travail est puissant | plus l'ouvrier est impuissant |
    | l'esprit | plus le travail est riche d'esprit | plus l'ouvrier s'est abruti et est devenu un esclave de la nature |

    **Les biens.** Le produit revient au capitaliste, l'ouvrier ne reçoit qu'un salaire, qui tend, pour les économistes eux-mêmes, vers {amber}le minimum{/amber} nécessaire à sa survie. La formule s'entend en un sens {violet}relatif{/violet} (la part qui lui revient diminue à mesure que la richesse croît) et {violet}dynamique{/violet} : l'accumulation met les ouvriers en concurrence et pèse sur les salaires. C'est le fait du §1 : il « devient d'autant plus pauvre qu'il produit plus de richesse ».

    **La valeur.** Marx joue sur {coral}le double sens du mot{/coral} : la valeur économique que l'ouvrier crée, et la dignité qu'il perd. Il est lui-même devenu une marchandise, « au prix d'autant plus bas qu'il crée plus de marchandises » (§1) ; et « perd en dignité » fait passer de l'économie à la morale.

    **Le corps.** Celui qui donne forme à la matière se déforme, au sens propre : {amber}la division du travail{/amber} le réduit à répéter le même geste. Smith lui-même concédait que l'ouvrier attaché toute sa vie à une opération simple devient aussi stupide et ignorant qu'une créature humaine peut l'être (*Richesse des nations*, V, 1). Le §8 le dira : le travail produit « la beauté, mais l'infirmité pour l'ouvrier ».

    **La culture.** « Barbare » au sens fort : {red}hors de la civilisation{/red}, que l'ouvrier produit pourtant sans avoir le temps, l'éducation ni les moyens d'en jouir. Le §8 : des palais, « mais des taudis pour l'ouvrier » ; une partie des ouvriers rejetée « dans un travail barbare ».

    **La puissance.** Le sujet change : non plus « son produit », mais {violet}« le travail »{/violet}, accumulé en produits, machines et argent, c'est-à-dire en capital. Cette puissance sociale décide s'il travaille, à quel prix et à quelles conditions. Il n'est pas faible malgré elle : {coral}il est faible parce qu'elle vient de lui et existe hors de lui{/coral}. *Le Capital* dira que le travail mort domine le travail vivant.

    **L'esprit.** Le travail incorpore science et technique, et l'ouvrier, appendice de la machine, n'en a plus besoin : « il produit l'esprit, mais, pour l'ouvrier, il produit l'abêtissement » (§8). « Esclave de la nature » semble contredire le travail, qui devait l'en affranchir : c'est {red}la double dépendance du §7{/red} (un emploi, puis une subsistance) et, on le verra au §11, un homme qui ne se sent libre que dans ses fonctions animales. Le travail le renvoie à la nécessité la plus élémentaire : survivre.

    ! Le texte cité omet le premier membre du dernier couple ; l'allemand dit *je geistreicher die Arbeit, um so mehr geistloser und Naturknecht der Arbeiter wird* [plus le travail est riche d'esprit, plus l'ouvrier en est dépourvu et devient esclave de la nature].

    ! Le glissement du produit vers « le travail » prépare la suite : si le produit est étranger à l'ouvrier, c'est que l'activité qui le produit l'est déjà (§9).
  passage:
    label: "§7 (2)"
    text: "(L'aliénation de l'ouvrier dans son objet s'exprime, selon les lois de l'économie, de la façon suivante : plus l'ouvrier produit, moins il a à consommer ; plus il crée de valeurs, plus il se déprécie et perd en dignité ; plus son produit a de forme, plus l'ouvrier est difforme ; plus son objet est civilisé, plus l'ouvrier est barbare ; plus le travail est puissant, plus l'ouvrier est impuissant ; plus l'ouvrier s'est abruti et est devenu un esclave de la nature.)"
