- id: m1844-p1
  title: "1.1 Le fait : l'ouvrier s'appauvrit à mesure qu'il produit"
  notes: |-
    **Marx part d'{amber}un fait économique actuel{/amber} : plus l'ouvrier produit de richesse, plus il s'appauvrit.**

    **Un point de départ de méthode.** « Nous partons » répond à l'économiste qui « part » de la propriété privée sans l'expliquer. Le fait est {violet}actuel{/violet} (*gegenwärtig*), présent, {red}non une origine racontée{/red} ; il est {violet}économique{/violet}, décrit dans les termes des économistes eux-mêmes : Marx ne leur oppose pas une indignation morale, il leur retourne leurs propres résultats.

    **Une proportion, non une coïncidence.** « D'autant plus pauvre qu'il produit plus » : la pauvreté {coral}croît avec{/coral} la richesse. L'allemand dit que la dévalorisation (*Entwertung*) du monde humain augmente {amber}en raison directe{/amber} de la mise en valeur (*Verwertung*) du monde des choses ; la traduction « va de pair » l'affaiblit. Le travail produit des marchandises, et {coral}l'ouvrier lui-même comme une marchandise{/coral}.

    ? **Marchandise** : chose produite pour être vendue, dont le prix se règle sur le marché ; dire que l'ouvrier en devient une, c'est dire qu'il se vend et que son salaire obéit aux lois du prix des choses.

    **Deux prémisses absentes du texte**, établies dans les colonnes qui précèdent : l'ouvrier est une marchandise (« la demande d'hommes règle nécessairement la production des hommes comme de toute autre marchandise ») ; et la richesse produite {amber}ne revient pas à l'ouvrier{/amber}, elle s'accumule ailleurs, en capital, « du travail accumulé ». D'où la proportion inverse : plus la richesse croît, plus elle grossit ce qui fait face à l'ouvrier.

    ! Marx ne décrit pas {red}une pauvreté absolue{/red} mais une proportion ; et « le travail produit l'ouvrier » ne veut pas dire que le travail fait l'homme : il le produit {green}comme marchandise{/green}, l'inverse d'une formation de soi.
  passage:
    label: "§1"
    part: "1. Du fait à ce qu'il exprime"
    text: |-
      Nous partons d'un fait économique actuel.
      L'ouvrier devient d'autant plus pauvre qu'il produit plus de richesse, que sa production croît en puissance et en volume. L'ouvrier devient une marchandise au prix d'autant plus bas qu'il crée plus de marchandises. La dévalorisation du monde humain va de pair avec la mise en valeur du monde matériel. Le travail ne produit pas seulement des marchandises ; il se produit lui-même ainsi que l'ouvrier comme une marchandise dans la mesure où il produit des marchandises en général.
