- id: m1844-p4b
  title: "Plus l'ouvrier se dépense, plus le monde étranger devient puissant"
  notes: |-
    **Le principe admis, la proportion inverse du début n'est plus un simple constat : {coral}elle devient évidente{/coral}.** Plus l'ouvrier met de lui-même dans son travail, plus le monde qu'il crée en face de lui est puissant, et plus il est pauvre, au-dehors comme au-dedans.

    **Pourquoi « il est évident » ?** L'allemand dit : « car, d'après cette {violet}présupposition{/violet} (*Voraussetzung*), il est clair ». Marx nomme lui-même son principe une présupposition, et ce qui suit en est {amber}la conséquence{/amber}. Ce qui était, au premier paragraphe, un fait pris aux économistes, devient ici {coral}une nécessité{/coral}.

    **Pourquoi « se dépense au travail » ?** *Sich ausarbeiten*, littéralement s'épuiser à travailler, se vider de soi dans le travail : le préfixe *aus-* dit la sortie, {amber}ce que l'ouvrier met hors de lui{/amber}. L'ouvrier ne fait pas seulement des choses : il y met ses forces, son adresse, son temps.

    **Pourquoi « étranger, objectif » ?** Les deux adjectifs sont juxtaposés sans être confondus. Le monde que l'ouvrier crée est {green}objectif{/green}, ce qui est normal, c'est l'objectivation ; et il est {red}étranger{/red}, ce qui est l'aliénation. La virgule entre les deux contient toute la distinction du texte. « Qu'il crée en face de lui » : c'est l'ouvrier lui-même qui {coral}dresse ce monde contre lui{/coral}.

    **L'évidence est-elle vraiment évidente ?** Pas tout à fait. Que l'ouvrier se rapporte à son produit comme à un objet étranger ne suffit pas, à soi seul, à ce que le monde étranger devienne {amber}d'autant plus puissant{/amber} qu'il produit davantage. Il faut deux prémisses de plus.
    - Que ce qu'il produit {amber}s'accumule{/amber} au lieu de disparaître : c'est la définition du capital comme travail accumulé.
    - Que ce qui s'accumule {amber}agisse sur lui{/amber} : c'est la domination du capital, nommée à la fin du paragraphe précédent.

    L'évidence tient donc au principe {green}enrichi de ce que le deuxième mouvement a établi{/green}. Et sous ces prémisses, il y en a une plus profonde : le travail est pour Marx {violet}une expression de la vie{/violet} (*Lebensäußerung*), le passage dans l'objet des forces physiques et intellectuelles de l'ouvrier. Si l'objet contient la vie de l'ouvrier, et s'accumule hors de lui, chaque effort fortifie la puissance qui lui fait face et le vide d'autant.

    **Pourquoi « son monde intérieur devient pauvre » ?** La pauvreté n'est plus seulement celle du salaire : {coral}elle touche l'intériorité{/coral}. Ce que l'ouvrier a mis dehors ne lui revient pas et ne le nourrit plus. Cela suppose que l'homme soit fait de ce qu'il met dans ses œuvres, et qu'il ne se retrouve pas en elles quand elles lui sont prises. {yellow}Une ouvrière passe ses journées à assembler des montres de précision : toute son adresse et toute son attention passent dans des objets qui partent ailleurs, et il ne lui reste, le soir, que la fatigue et un salaire qui ne lui permet d'acheter aucune de ces montres.{/yellow}

    **Pourquoi « moins il possède en propre » ?** L'allemand dit que moins de choses {amber}« lui appartiennent en propre »{/amber} (*gehört ihm zu eigen*) : la possession se dit ici au sens le plus large, {coral}y compris de soi{/coral}. C'est ce que la suite dira : « moins l'ouvrier est lui-même ».

    ! « Évident » ne veut pas dire {red}démontré sans prémisses{/red} : l'évidence vient du principe, mais aussi de ce que {green}les paragraphes précédents ont établi{/green}.
  passage:
    label: "§4"
    part: "3. Le principe et son sens"
    text: "S'il en est ainsi, il est évident que, plus l'ouvrier se dépense au travail, plus le monde étranger, objectif, qu'il crée en face de lui devient puissant, plus il s'appauvrit lui-même et plus son monde intérieur devient pauvre, moins il possède en propre."
