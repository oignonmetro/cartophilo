- id: m1844-i2
  title: "La question, la thèse, la problématique"
  notes: |-
    **Le texte se demande ce que signifie le fait que {coral}l'ouvrier s'appauvrisse d'autant plus qu'il produit davantage de richesse{/coral}.** Autrement dit : comment le travail peut-il appauvrir celui qui l'accomplit, au lieu de l'enrichir ?

    **Pourquoi est-ce une question ?** Parce que, à première vue, produire, c'est faire exister ce qui n'existait pas, et l'on s'attendrait à ce que celui qui produit davantage dispose de davantage. Or le fait a la forme d'{amber}une proportion inverse{/amber} : la richesse produite et la pauvreté du producteur croissent ensemble, {yellow}comme si un boulanger avait d'autant moins de pain qu'il en cuit davantage{/yellow}.

    **Les réponses ordinaires.** Les économistes constatent eux-mêmes que le salaire tend vers le minimum nécessaire à la survie, mais ils rapportent ce fait à {red}des lois, celles du salaire et de la concurrence{/red}, qui supposent la propriété privée sans l'expliquer. La morale, elle, cherche {red}un coupable{/red} : la cupidité des maîtres. Marx ne demande ni quelle loi produit la misère, ni qui en est responsable, mais {green}quel rapport entre l'ouvrier et ce qu'il produit se cache derrière la loi{/green}.

    **Sa thèse :** l'appauvrissement de l'ouvrier {coral}n'exprime rien d'autre qu'un rapport{/coral} : le produit de son travail lui fait face comme un être étranger, une puissance indépendante, que le texte nomme pour finir {violet}le capital{/violet}. Dans le monde de l'économie politique, l'objectivation, qui est en elle-même la réalisation du travail, devient pour l'ouvrier une perte de l'objet ; si bien que, plus il produit, plus il grossit la puissance qui le domine, et plus il est lui-même {coral}privé d'objets{/coral}.

    **Sa problématique :** comment l'objectivation, réalisation même du travail, peut-elle devenir pour l'ouvrier la perte de sa réalité et de ses objets, {amber}sans que ce soit le fait de s'objectiver qui l'aliène{/amber} ? La thèse doit tenir ensemble deux affirmations qui semblent s'exclure. Si la perte venait de l'objectivation elle-même, {red}tout travail serait aliénant{/red}, et l'aliénation serait la condition de tout homme qui travaille. Si elle venait d'une cause extérieure au travail, une violence ou une injustice de la répartition, on ne comprendrait pas qu'elle {red}grandisse à proportion de ce que l'ouvrier produit{/red}.

    | Difficulté | Où elle se trouve | Réponse du texte |
    | c'est l'activité même de l'ouvrier, et non son insuffisance, qui l'appauvrit | la proportion inverse, répétée de phrase en phrase | le produit s'accumule hors de lui comme capital et se retourne contre lui |
    | celui qui produit sans cesse des objets en est dépourvu | « plus l'ouvrier est privé d'objets » | l'aliénation est une perte d'objectivité, non un excès d'objet |
    | le croyant pourrait reprendre ce qu'il a mis en Dieu en dissipant l'illusion | l'analogie religieuse | le produit est réel, et sa puissance ne se dissipe pas par une prise de conscience |

    **L'hypothèse de lecture :** le texte répond {coral}par une distinction{/coral}, qu'il formule deux fois. Au début, par le complément « dans le monde de l'économie politique », qui fait du renversement la forme que prend l'objectivation dans un état déterminé, non sa nature. À la fin, par le « non seulement… mais » de la dernière phrase, qui sépare l'extériorité normale de tout produit et l'existence hostile du produit aliéné.

    ! Le texte dit {green}en quoi consiste{/green} l'aliénation dans le produit, non encore {red}ce qui la produit{/red} : la suite du passage le cherchera dans l'activité, puis dans le rapport à un autre homme.
