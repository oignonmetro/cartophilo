- id: m1844-p16d
  title: "Conscient parce que générique : une activité libre"
  notes: |-
    **Marx retourne la formule : l'homme est conscient {coral}parce qu'il{/coral} est générique, et c'est pour cela que son activité est libre.** On semble tourner en rond ; il n'en est rien.

    **Pourquoi « ou bien » ?** *Oder* annonce {amber}une autre formulation{/amber}, presque une correction. La phrase précédente disait : l'homme est générique {violet}parce qu'il{/violet} a une activité consciente (« c'est seulement par là »). Celle-ci dit : il est conscient {violet}parce qu'il{/violet} est générique (« précisément parce que »).

    **Y a-t-il un cercle ?** On le croirait : chaque terme fonde l'autre. Mais {green}la question de la priorité est ici un faux problème{/green}. La conscience et l'être générique sont {coral}les deux faces, théorique et pratique, d'une même réalité{/coral} : c'est l'élaboration du monde objectif qui fait de l'homme, d'un même acte, un être conscient et un être générique. Le « ou bien » {red}ne corrige pas{/red} la première formule, il {green}en donne l'autre face{/green}, comme le §1 disait déjà que les deux définitions de l'être générique ne sont qu'« une autre façon d'exprimer la même chose ».

    **Que veut dire « sa vie propre est pour lui un objet » ?** C'est {amber}la définition de la conscience{/amber} : avoir sa propre activité vitale devant soi, pouvoir la vouloir et la connaître. {yellow}Celui qui se demande ce qu'il fera de sa vie a sa vie pour objet ; le chat qui chasse ne se le demande pas.{/yellow}

    **Pourquoi « c'est pour cela seulement que son activité est activité libre » ?** *Nur darum* : une nouvelle déduction de la liberté. Celui qui {amber}a{/amber} son activité peut {coral}s'en distancier{/coral}, la vouloir ou non, la diriger vers telle fin plutôt que telle autre ; celui qui {amber}l'est{/amber}, comme l'animal, ne peut que l'accomplir. Pouvoir prendre son activité pour objet {green}affranchit l'homme de la contrainte biologique immédiate{/green}, et fait de son travail une activité autodéterminée.

    **La liberté repose donc sur une distance.** C'est le point que la phrase suivante va retourner : la distance qui permet à l'homme de vouloir son activité pour elle-même lui permet aussi, si le travail lui est imposé du dehors, {red}de ne la vouloir que pour ce qu'elle rapporte{/red}.

    ! Le « ou bien » n'est pas {red}une contradiction{/red} : c'est {green}une équivalence{/green}, la même que celle du début du texte.
