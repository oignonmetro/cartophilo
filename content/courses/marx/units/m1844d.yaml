- id: m1844-p14f
  title: "La nature liée à elle-même"
  notes: |-
    **La dernière phrase renverse la perspective : si l'homme est lié à la nature, c'est qu'{coral}il en est une partie{/coral}, et ce lien n'est qu'{coral}un rapport de la nature à elle-même{/coral}.**

    **Pourquoi « physique et intellectuelle » ?** La phrase reprend {amber}les deux points de vue{/amber} du paragraphe, le pratique et le théorique : le corps et l'esprit sont également liés à la nature.

    **Pourquoi « indissolublement liée » ?** *Zusammenhängt*, tient ensemble : {amber}on ne peut pas les séparer sans les détruire{/amber}.

    **Pourquoi « ne signifie pas autre chose sinon » ?** Une nouvelle équivalence, qui {coral}écarte toute lecture dualiste{/coral}. Marx ne dit pas qu'il y a deux choses, l'homme et la nature, qui seraient liées ; il dit que ce lien n'est rien d'autre que la nature liée à elle-même.

    **Que veut dire « la nature est liée à elle-même » ?** Il n'y a pas {red}deux substances{/red}, l'homme et la nature, mais {green}une seule, la nature{/green}, qui se rapporte à elle-même à travers l'une de ses parties. L'homme {red}n'est pas « un empire dans un empire »{/red}, selon le mot de Spinoza : il n'est pas un esprit tombé dans le monde, mais un morceau du monde qui se rapporte au reste.

    **Pourquoi « car » en dernière position ?** La raison, donnée à la fin, {coral}fonde tout le paragraphe{/coral} : c'est parce que l'homme est une partie de la nature que la nature peut être son corps.

    **La troisième difficulté est résolue.** Comment l'homme peut-il être universel et pourtant partie de la nature ? Son universalité {red}n'est pas une exception à la nature{/red} : {green}c'est la nature qui se rapporte à elle-même, à travers l'une de ses parties, sous une forme universelle{/green}. {yellow}Comme l'œil, qui fait partie du corps, peut voir tout le corps, l'homme, partie de la nature, peut se rapporter à la nature entière.{/yellow}

    **Pourquoi cette phrase rend-elle l'aliénation si grave ?** Si l'homme est une partie de la nature, la séparation de l'homme d'avec la nature, que les textes précédents ont décrite, {coral}coupe une partie de son tout, un membre de son corps{/coral}. Ce que le travail aliéné va retirer à l'homme, c'est ce corps, et avec lui son universalité.

    ! Faire de la nature le corps de l'homme, ce n'est pas {red}justifier une domination sans limite{/red} de la nature par l'homme : l'homme n'y est {green}qu'une partie{/green}, et son rapport à elle un rapport de la nature à elle-même.
