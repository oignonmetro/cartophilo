- id: m1844-p15
  title: "2.1 et 2.2 L'espèce étrangère, la vie générique devenue moyen"
  notes: |-
    **En rendant étrangères la nature et l'activité, le travail aliéné rend étrangère l'espèce : {coral}il fait de la vie générique le moyen de la vie individuelle{/coral}.**

    **2.1 Une dérivation que la traduction efface.** « Tandis que » traduit *Indem … so*, « en ce que…, par là » : {amber}c'est en rendant étrangères la nature et l'activité{/amber} que le travail aliéné rend étrangère l'espèce. Syllogisme : l'homme est générique par son rapport à la nature et par son activité vitale consciente ; le travail aliéné lui retire l'une et l'autre ; il lui retire donc ce par quoi il est générique.

    **2.2 L'inversion de la fin et du moyen.** {violet}La vie générique{/violet} (*Gattungsleben*) est l'activité libre et consciente par laquelle les hommes transforment ensemble le monde ; {violet}la vie individuelle{/violet}, la simple subsistance de chacun. Deux temps : elles sont d'abord {amber}rendues étrangères l'une à l'autre{/amber}, puis la seconde, « réduite à l'abstraction », devient {coral}le but de la première{/coral}, elle aussi abstraite. Une fois séparées, l'activité n'est plus vécue que pour ce qu'elle rapporte, la survie.

    ? **Abstraction** : séparation d'avec les rapports. La vie individuelle isolée devient un « égoïsme abstrait » ; la vie générique coupée des individus, {amber}une contrainte qui ne vit en personne{/amber}.

    *Sur la question juive* le disait déjà de la société civile, où l'homme {teal}« considère les autres comme des moyens, se ravale lui-même au rang de moyen »{/teal} ; le travail aliéné en donne la racine {green}dans la production{/green}.

    ! Il ne s'agit pas de {red}morale{/red}, comme si l'ouvrier préférait son intérêt : c'est {green}la structure de l'activité{/green} qui renverse la fin et le moyen.

    ! On pourrait lire que Marx veut l'inverse, {red}la vie individuelle sacrifiée à l'espèce{/red}. Non : la vie générique n'est pas celle d'un collectif au-dessus des individus, mais {green}la vie de chacun en tant qu'être universel{/green}. Que l'essence devienne le moyen de l'existence, telle est précisément l'aliénation.
  passage:
    label: "§3"
    part: "2. Le travail aliéné rend l'espèce étrangère"
    text: "Tandis que le travail aliéné rend étrangers à l'homme 1) la nature et 2) lui-même, sa propre fonction active, son activité vitale, il rend aussi l'espèce humaine étrangère à l'homme : il fait pour lui de la vie générique le moyen de la vie individuelle. Premièrement, il rend étrangères la vie générique et la vie individuelle et, deuxièmement, il fait de cette dernière, réduite à l'abstraction, le but de la première, qui est également prise sous sa forme abstraite et aliénée."
