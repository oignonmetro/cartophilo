- id: m1844-p14c
  title: "La nature dans la vie pratique"
  notes: |-
    **Ce que la nature est pour l'esprit, elle l'est pour l'action : {coral}une part de la vie et de l'activité humaines{/coral}. Et physiquement, l'homme ne vit que de ses produits.**

    **Pourquoi « de même » ?** Le parallèle de la théorie et de la pratique est {amber}strict{/amber} : la nature entre dans la conscience comme objet de science et d'art, et dans l'activité comme matière de la vie. Les deux rapports sont deux faces d'un même rapport vital.

    **Pourquoi « une part de la vie et de l'activité » ?** La nature n'est pas {red}un décor{/red} où l'homme agirait : elle est {green}une part de son activité même{/green}. On ne peut pas décrire ce que fait l'homme sans décrire les choses sur lesquelles il le fait. {yellow}Le travail du forgeron, c'est le fer, le feu, l'eau de la trempe : retirez-les, il ne reste rien de son métier.{/yellow}

    **Pourquoi « ne vit que » ?** La restriction est forte : {coral}physiquement, rien d'autre que la nature ne fait vivre l'homme{/coral}. Il n'a pas d'autre source de vie que ce qu'il tire du monde extérieur.

    **Pourquoi « nourriture, chauffage, vêtements, habitation » ?** Ce sont {amber}les besoins élémentaires{/amber}, ceux de tout homme. Ce sont aussi, exactement, {red}ceux dont l'ouvrier est privé{/red} : le deuxième texte a montré que la nature cesse d'être pour lui un moyen de subsistance immédiat. L'énumération prépare ce que le travail aliéné va retirer. Et « qu'ils apparaissent sous forme de » : les produits naturels ne se présentent jamais bruts, ils prennent la forme que le travail leur a donnée, {yellow}le blé sous forme de pain, la laine sous forme d'habit, l'argile sous forme de brique{/yellow}.

    **Qu'est-ce que la phrase prépare ?** La formule qui suit : si l'homme ne vit que de la nature, et si la nature est une part de son activité, alors elle est {coral}comme son corps{/coral}.

    ! La phrase ne dit pas que l'homme vit {red}seulement pour{/red} ces besoins élémentaires : elle dit qu'il {green}en vit{/green}, comme tout vivant, et que même ses besoins les plus simples passent par la nature transformée.
  passage:
    label: "§2"
    part: "1. Ce qu'est l'homme : un être générique"
    text: "De même, au point de vue pratique, ils constituent une part de la vie et de l'activité humaines. Physiquement, l'homme ne vit que de ces produits naturels, qu'ils apparaissent sous forme de nourriture, de chauffage, de vêtements, d'habitation, etc."
