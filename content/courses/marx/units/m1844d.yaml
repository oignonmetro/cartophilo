- id: m1844-p16e
  title: "Le renversement"
  notes: |-
    **La phrase conclut le texte en retournant ce qui vient d'être établi : la distance qui permettait à l'homme d'avoir son activité, et par là d'être libre, est {coral}celle qui lui permet, dans le travail aliéné, de la traiter comme un simple instrument pour survivre{/coral}.** La conscience est la condition commune de la liberté et de l'aliénation.

    **Pourquoi « renverse ce rapport » ?** *Kehrt das Verhältnis um* : le rapport renversé est {amber}celui de l'homme à son activité{/amber}, décrit dans les phrases précédentes. L'homme avait son activité pour la vouloir ; il l'a maintenant pour s'en servir.

    **Pourquoi « du fait qu'il est un être conscient » ?** L'allemand dit *eben, weil er ein bewußtes Wesen ist* : {coral}« précisément parce qu'il est un être conscient »{/coral}. Le *eben* insiste : c'est {green}la conscience même{/green}, et {red}non une défaillance de la conscience{/red}, qui rend le renversement possible.

    **Pourquoi « son activité vitale, son essence » ?** L'apposition {amber}identifie l'activité vitale et l'essence{/amber} (*Wesen*) : ce qui est dégradé, c'est ce que l'homme est.

    ? **Essence, existence** : l'essence est {violet}ce qu'est une chose{/violet}, ce qui la définit ; l'existence, {violet}le simple fait qu'elle soit{/violet}, qu'elle subsiste. Le renversement {coral}subordonne ce qu'on est au fait d'être là{/coral} : l'homme sacrifie son essence, l'activité libre, à sa simple subsistance.

    **Pourquoi est-ce précisément parce qu'il est conscient que l'homme peut faire de son activité un moyen ?** Le raisonnement implicite tient en trois étapes.
    - **Faire de quelque chose un moyen suppose de s'en distinguer** : on ne peut se servir que de ce qu'on n'est pas, et qu'on tient à distance comme un instrument.
    - **L'animal, qui est son activité, ne peut pas s'en distinguer**, donc ne peut pas en faire un moyen : {amber}il ne peut pas être aliéné de cette manière{/amber}.
    - **L'homme, qui a son activité, peut s'en distinguer** : cette distance, condition de sa liberté, est aussi {coral}la condition de son aliénation{/coral}.

    {yellow}Celui qui a choisi un métier par goût et ne l'exerce plus que pour son salaire a gardé la distance qui lui permettait de choisir ; mais elle ne lui sert plus qu'à calculer ce que son travail lui rapporte.{/yellow}

    **La problématique est résolue.** Ce n'est pas la conscience qui aliène ; c'est {coral}le travail aliéné qui se sert d'elle{/coral}. Mais ce qui aliène ne pourrait pas aliéner un être qui n'aurait pas cette distance : {green}l'aliénation est un malheur propre à un être libre{/green}. Le travail aliéné ne l'invente pas, {amber}il retourne cette distance{/amber}.

    **Ce qui reste à prouver.** La preuve, annoncée par « premièrement », s'achève dans le texte suivant, avec la production d'un monde objectif ; il en tirera que le travail aliéné {teal}change sa supériorité sur l'animal en infériorité{/teal}.

    ! Marx {red}n'accuse pas la conscience{/red}, comme si penser rendait malheureux ; et le sujet grammatical est l'homme, mais {green}le sujet réel est le travail aliéné{/green}, qui « renverse ce rapport ». L'ouvrier n'y commet aucune faute.
