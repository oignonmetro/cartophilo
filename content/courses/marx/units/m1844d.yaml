    text: "La vie générique, aussi bien chez l'homme que chez l'animal, consiste d'abord, au point de vue physique, dans le fait que l'homme (comme l'animal) vit de la nature non organique ; et plus l'homme est universel comparé à l'animal, plus est universel le champ de la nature non organique dont il vit."
