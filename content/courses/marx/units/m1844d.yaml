- id: m1844-p15
  title: "Le travail aliéné rend étrangère l'espèce humaine"
  notes: |-
    **Le travail aliéné rend étrangers à l'homme la nature, lui-même et {amber}l'espèce humaine{/amber} : il fait de la vie générique {coral}le moyen de la vie individuelle{/coral}.**

    Il y a deux temps : {red}premièrement{/red}, il rend étrangères l'une à l'autre la vie générique et la vie individuelle ; {red}deuxièmement{/red}, il fait de la seconde, {violet}réduite à l'abstraction{/violet}, le but de la première, elle aussi prise sous sa forme abstraite et aliénée. Ce qui devrait être la fin (la vie générique) devient un moyen, et ce qui devrait être un moyen (la vie individuelle) devient la fin.
  passage:
    label: "§3"
    text: "Tandis que le travail aliéné rend étrangers à l'homme 1) la nature et 2) lui-même, sa propre fonction active, son activité vitale, il rend aussi l'espèce humaine étrangère à l'homme : il fait pour lui de la vie générique le moyen de la vie individuelle. Premièrement, il rend étrangères la vie générique et la vie individuelle et, deuxièmement, il fait de cette dernière, réduite à l'abstraction, le but de la première, qui est également prise sous sa forme abstraite et aliénée."
  points:
