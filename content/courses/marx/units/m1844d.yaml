- id: m1844-p14b
  title: "La nature, nourriture de l'esprit"
  notes: |-
    **L'homme vit de la nature aussi en théorie : plantes, bêtes, pierres, air et lumière sont {coral}une nourriture pour l'esprit{/coral}, qu'il doit préparer avant d'en jouir.**

    **Pourquoi cette énumération ?** « Les plantes, les animaux, les pierres, l'air, la lumière » : elle couvre {amber}les trois règnes et les éléments{/amber}. Rien n'est exclu : l'universalité théorique est aussi large que l'universalité pratique.

    **Pourquoi « une partie de la conscience humaine » ?** La nature {amber}entre dans la conscience{/amber}, elle en est un contenu. Ce n'est pas une conscience vide qui ferait face à un monde extérieur : {coral}la conscience est faite de ce qu'elle connaît{/coral}.

    **Pourquoi la science et l'art ?** Ce sont {violet}les deux manières de se rapporter théoriquement à la nature{/violet} : la connaître et la figurer. {yellow}L'astronome qui étudie les étoiles et le peintre qui peint la mer vivent tous deux de la nature, l'un en la comprenant, l'autre en la représentant.{/yellow}

    **Pourquoi « nature spirituelle non organique » et « moyens spirituels de subsistance » ?** *Geistige unorganische Natur*, *geistige Lebensmittel* : {coral}l'esprit aussi a son dehors, dont il vit{/coral}, comme le corps a ses vivres. Marx étend à la conscience le vocabulaire de la nutrition.

    **Pourquoi « préparer pour en jouir et les assimiler » ?** L'allemand dit *zubereiten muss zum Genuss und zur Verdauung* : {violet}préparer pour la jouissance et la digestion{/violet}. La métaphore alimentaire est suivie jusqu'au bout : {yellow}la science est une cuisine de l'esprit, qui apprête la nature brute avant qu'on puisse la goûter et l'assimiler.{/yellow}

    **Que refuse Marx par cette métaphore ?** De {red}séparer la conscience du rapport naturel{/red}. Connaître la nature n'est pas s'en extraire, c'est encore {green}s'en nourrir{/green}. La conscience n'est pas ce qui arrache l'homme à la nature, elle est {coral}une forme de son rapport à elle{/coral} : la connaissance de soi comme partie d'un tout. On peut y voir un parallélisme d'allure spinoziste, plutôt qu'un reflet : {green}l'esprit se nourrit des idées des choses dont le corps se nourrit{/green}.

    **Pourquoi « d'abord préparer » ?** L'incise dit que la nature {amber}n'est pas immédiatement à la mesure de l'homme{/amber} : il doit la transformer pour en vivre, en théorie comme en pratique. {yellow}L'animal mange ce qu'il trouve ; l'homme cuit, construit, étudie.{/yellow} Cette préparation est déjà {coral}le travail{/coral}, et l'incise annonce ce que le dernier paragraphe dira : « la vie productive est la vie générique ».

    ! La métaphore de la digestion n'est pas {red}une image décorative{/red} : elle dit que {green}la conscience est un rapport vital à la nature{/green}, non une contemplation détachée.
