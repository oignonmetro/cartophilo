id: m1844d
title: "L'être générique renversé (1844)"
subtitle: "Manuscrits de 1844, premier manuscrit, « Le travail aliéné », 4 / 5"
group: "Le travail aliéné (Manuscrits de 1844)"
icon: page
color: coral
intro: |-
  La troisième détermination du travail aliéné : l'homme est un être générique, qui vit de la nature comme de son corps non organique et fait de son activité vitale l'objet de sa conscience ; le travail aliéné renverse ce rapport et fait de la vie générique le moyen de la vie individuelle.
lessons:
- id: m1844d-i1
  title: "Où en est l'argument : la troisième détermination"
  notes: |-
    **De l'aliénation du produit et de celle de l'activité, Marx tire une troisième détermination : le travail aliéné rend l'homme étranger à son espèce.**

    Les textes précédents ont établi deux aspects du travail aliéné : {amber}l'aliénation de la chose{/amber}, l'ouvrier dépossédé de son produit et de la nature, et {amber}l'aliénation de soi{/amber}, son activité devenue celle d'un autre. Pour en tirer la troisième, Marx doit d'abord dire ce qu'est l'homme.

    Le texte pose donc que l'homme est {violet}un être générique{/violet} : il fait de l'espèce son objet, et se rapporte à lui-même comme à un être universel, donc libre ; il vit de la nature comme de {violet}son corps non organique{/violet}. Puis il montre le renversement : {coral}le travail aliéné fait de la vie générique le moyen de la vie individuelle{/coral}, parce que l'activité vitale consciente, qui distingue l'homme de l'animal, n'est plus pour lui qu'un moyen de subsister.

    ! Le texte suivant achève la démonstration (la production d'un monde objectif) et en tire les résultats 3) et 4).
  passage:
    label: "Introduction"
  points: []
- id: m1844-p13
  title: "L'homme est un être générique"
  notes: |-
    **À ces deux déterminations Marx en ajoute une troisième : {amber}l'homme est un être générique{/amber}.**

    Un être générique, au sens de Marx, est {coral}un être pour qui l'espèce est un objet{/coral}, la sienne comme celle de toute chose, et qui se comporte envers lui-même comme envers {violet}une espèce réelle, vivante{/violet}, donc {violet}un être universel et libre{/violet}. Les deux façons de le dire expriment la même chose.

    ! « Générique » ne veut pas dire « commun à tous » : c'est le rapport de l'homme à son espèce, c'est-à-dire à lui-même comme universel.
  passage:
    label: "§1"
    text: "De ces deux déterminations du travail aliéné, nous devons en tirer une troisième. L'homme est un être générique. Non seulement parce que, sur le plan pratique et théorique, il fait de l'espèce, la sienne propre aussi bien que celle de toute chose, son objet, mais encore – et ceci n'est qu'une autre façon d'exprimer la même chose – parce qu'il se comporte vis-à-vis de lui-même comme vis-à-vis d'une espèce réelle, vivante, parce qu'il se comporte vis-à-vis de lui-même comme vis-à-vis d'un être universel, donc libre."
