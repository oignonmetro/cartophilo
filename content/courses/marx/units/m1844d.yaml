    label: "§2"
    part: "1. Ce qu'est l'homme : un être générique"
    text: "Les plantes, les animaux, les pierres, l'air, la lumière, etc., constituent du point de vue théorique une partie de la conscience humaine, soit en tant qu'objets de la science de la nature, soit en tant qu'objets de l'art : ils constituent sa nature spirituelle non organique et sont les moyens spirituels de subsistance que l'homme doit d'abord préparer pour en jouir et les assimiler."
