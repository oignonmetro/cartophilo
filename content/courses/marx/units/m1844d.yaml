# manuscrit, « Le travail aliéné », l'être générique, la nature
# corps non organique, la vie générique devenue moyen, l'activité vitale
# consciente (§13 à §16 de l'ancienne unité).
# d'après la traduction GF (Jacques-Pierre Gougeon), choisie par l'utilisateur.
