- id: m1844d-i2
  title: "La question, la thèse, la problématique"
  notes: |-
    **Le texte se demande ce qu'est l'homme, pour que le travail aliéné puisse lui rendre étrangère {coral}non seulement sa production et son activité, mais son espèce elle-même{/coral}.**

    **Pourquoi cette question ?** Pour comprendre ce que l'aliénation fait perdre à l'homme, il faut dire {amber}ce qu'il est{/amber} ; et pour comprendre qu'elle touche l'espèce, il faut montrer que l'homme est, en lui-même, {amber}un rapport à son espèce{/amber}.

    **Les réponses ordinaires.** La tradition définit l'homme par {red}la raison ou la conscience{/red} ; Feuerbach, par {red}la conscience de son genre{/red}. Marx demande à quoi se reconnaît réellement ce rapport de l'homme à son espèce : dans la pensée seulement, ou {green}d'abord dans la manière dont il vit de la nature et la transforme{/green} ?

    **Sa thèse :** l'homme est {violet}un être générique{/violet} : il fait de toutes les espèces son objet et se rapporte à lui-même comme à l'espèce présente en lui, donc comme à {amber}un être universel et libre{/amber} ; cette universalité consiste en pratique à faire de {violet}la nature entière son corps non organique{/violet}, et elle tient à son activité vitale consciente, qu'il {amber}a{/amber} au lieu de l'{amber}être{/amber}. C'est en lui rendant étrangères la nature et son activité que le travail aliéné lui rend étrangère son espèce : il fait de la vie générique, qui est la vie productive, {coral}un simple moyen de la survie individuelle{/coral}, et il le peut {coral}précisément parce que l'homme est conscient{/coral}.

    **Sa problématique :** comment la conscience, qui fait de l'homme un être générique et libre, peut-elle être aussi {coral}ce qui lui permet de réduire son activité vitale à un simple moyen de survivre{/coral} ?

    **Pourquoi est-ce difficile ?** Ce qui distingue l'homme de l'animal, avoir son activité au lieu de l'être, serait aussi ce qui rend possible sa dégradation : l'animal, qui se confond avec son activité, {red}ne peut pas en faire un moyen{/red}. {coral}La liberté de l'homme serait la condition même de son aliénation.{/coral}

    | Difficulté | Où elle se trouve | Réponse du texte |
    | la conscience, condition de la liberté et de l'aliénation | la dernière phrase | la conscience donne la distance à l'égard de l'activité ; le travail aliéné la retourne |
    | deux définitions de l'être générique déclarées « la même chose » | §1 | le rapport à soi passe par le rapport aux choses : se rapporter aux espèces et se rapporter à soi comme espèce sont un seul acte |
    | l'homme universel, et pourtant « partie de la nature » | fin du §2 | l'universalité n'est pas une exception à la nature : c'est la nature qui se rapporte à elle-même par l'une de ses parties |
    | conscient parce que générique, ou générique parce que conscient | §4, le « ou bien » | les deux ne sont que deux faces d'un même rapport |

    **L'hypothèse de lecture :** Marx reprend le mot de Feuerbach pour en {coral}changer le sens{/coral}. L'être générique n'est plus d'abord la conscience que l'homme a de son genre, mais {green}son rapport pratique à la nature entière{/green}, dont il est une partie et qu'il travaille ; et la conscience n'est plus une intériorité, mais {green}une prise sur sa propre activité{/green}.

    ! La thèse est forte : elle donne enfin la définition de l'homme {green}que tout le passage supposait{/green}. Elle est limitée : cette définition est {amber}posée, décrite et illustrée, non démontrée{/amber}, et la preuve de la troisième détermination, annoncée par « premièrement », ne s'achève que dans le texte suivant.
