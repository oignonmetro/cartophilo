- id: m1844-p16
  title: "3.1 à 3.4 La vie productive, l'animal et l'homme, le renversement"
  notes: |-
    **Première preuve : la vie productive est la vie générique ; or le travail aliéné n'en fait qu'un moyen de survivre ; et il le peut {coral}parce que l'homme est conscient{/coral}.**

    **3.1 et 3.2 Un syllogisme.** Majeure : le travail n'apparaît à l'homme {amber}« que comme un moyen »{/amber} de conserver son existence physique. Mineure (« mais ») : {coral}« la vie productive est la vie générique »{/coral}, {teal}« la vie engendrant la vie »{/teal}. Il faut y lire un redoublement : l'homme produit les conditions de vie de toute son espèce, une histoire et une culture. Principe posé : {violet}une espèce se définit par son mode d'activité vitale{/violet} (*species*), et celui de l'homme est l'activité libre et consciente.

    **3.3 L'animal est son activité, l'homme l'a.** L'animal {amber}« est »{/amber} son activité (*Es ist sie*), sans distance ; l'homme l'{amber}« a »{/amber} (*Er hat*) : il en fait l'objet de sa volonté et de sa conscience. Le « ou bien » qui semble renverser la dépendance (conscient parce que générique) n'est pas une contradiction : la priorité est {green}un faux problème{/green}, conscience et être générique sont les deux faces d'un même rapport.

    ? **Conscience** : chez Marx, le fait que « sa vie propre est pour lui un objet » ; non une intériorité, mais {amber}une prise sur sa propre activité{/amber}, se savoir partie de la nature.

    *Le Capital* garde l'idée sans le mot : ce qui distingue {teal}« le plus mauvais architecte de la meilleure abeille »{/teal}, c'est qu'il a construit la cellule dans sa tête avant de la construire dans la cire ; le résultat {amber}« existait donc déjà en idée »{/amber}. Avoir son activité, c'est pouvoir s'en proposer la fin.

    **3.4 Le renversement.** *Eben, weil er ein bewußtes Wesen ist* : {coral}précisément parce qu'il est conscient{/coral}, l'homme fait de son essence un moyen de son existence. Faire de quelque chose un moyen suppose de s'en distinguer : l'animal ne le peut pas, l'homme le peut. La conscience est {coral}la condition commune de la liberté et de l'aliénation{/coral} : le travail aliéné ne l'invente pas, {green}il retourne cette distance{/green}.

    ! Marx {red}n'accuse pas la conscience{/red} : l'aliénation est {green}un malheur propre à un être libre{/green}. La preuve, annoncée par « premièrement », s'achève dans le texte suivant.
  passage:
    label: "§4"
    part: "3. La première preuve : l'activité vitale réduite à un moyen"
    text: "Car, premièrement, le travail, l'activité vitale, la vie productive n'apparaissent eux-mêmes à l'homme que comme un moyen de satisfaire un besoin, le besoin de conservation de l'existence physique. Mais la vie productive est la vie générique. C'est la vie engendrant la vie. Le mode d'activité vitale renferme tout le caractère d'une espèce, son caractère générique, et l'activité libre, consciente, est le caractère générique de l'homme. La vie elle-même n'apparaît que comme moyen de subsistance. L'animal se confond immédiatement avec son activité vitale. Il ne se distingue pas d'elle. Il est cette activité. L'homme fait de son activité vitale elle-même l'objet de sa volonté et de sa conscience. Il a une activité vitale consciente ; elle n'est pas une détermination avec laquelle il se confond immédiatement. L'activité vitale consciente distingue directement l'homme de l'activité vitale de l'animal. C'est seulement par là qu'il est un être générique. Ou bien il est seulement un être conscient, autrement dit sa vie propre est pour lui un objet, précisément parce qu'il est un être générique. C'est pour cela seulement que son activité est activité libre. Le travail aliéné renverse ce rapport en ce sens que l'homme, du fait qu'il est un être conscient, ne fait de son activité vitale, de son essence, qu'un moyen de son existence."
