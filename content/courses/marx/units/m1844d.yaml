    sentence: "« Car, premièrement, le travail, l'activité vitale, la vie productive n'apparaissent eux-mêmes à l'homme que comme un moyen de satisfaire un besoin, le besoin de conservation de l'existence physique. Mais la vie productive est la vie générique. C'est la vie engendrant la vie. Le mode d'activité vitale renferme tout le caractère d'une espèce, son caractère générique, et l'activité libre, consciente, est le caractère générique de l'homme. La vie elle-même n'apparaît ___. »"
    answer: "que comme moyen de subsistance"
    alt: []
  - id: m1844-p16-6
    fragment: "2/3"
    sentence: "« ___. Il ne se distingue pas d'elle. Il est cette activité. L'homme fait de son activité vitale elle-même l'objet de sa volonté et de sa conscience. Il a une activité vitale consciente ; elle n'est pas une détermination avec laquelle il se confond immédiatement. L'activité vitale consciente distingue directement l'homme de l'activité vitale de l'animal. C'est seulement par là qu'il est un être générique. »"
    answer: "L'animal se confond immédiatement avec son activité vitale"
    alt: []
