    text: "L'universalité de l'homme apparaît en pratique précisément dans l'universalité qui fait de la nature entière son corps non organique, dans la mesure où elle est : 1) un moyen de subsistance immédiat, et 2) la matière, l'objet et l'outil de son activité vitale."
