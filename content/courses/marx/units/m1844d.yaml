- id: m1844-p16c
  title: "L'animal est son activité, l'homme l'a"
  notes: |-
    **Marx explique ce que veut dire « activité libre et consciente » en comparant l'homme et l'animal : {coral}l'animal est son activité, l'homme l'a{/coral}. C'est cela qui fait de lui un être générique.**

    **Pourquoi trois phrases brèves pour l'animal ?** « Se confond immédiatement avec », « ne se distingue pas d'elle », « est cette activité » : {amber}de plus en plus fortes, jusqu'à l'identité{/amber} (*Es ist sie*). « Immédiatement » (*unmittelbar*) veut dire {violet}sans médiation, sans distance{/violet} entre l'animal et ce qu'il fait. {yellow}L'abeille butine ; elle ne décide pas de butiner, et ne peut pas faire autre chose.{/yellow}

    **Pourquoi « l'objet de sa volonté et de sa conscience » ?** *Zum Gegenstand seines Wollens und seines Bewußtseins* : l'homme {amber}met son activité devant lui{/amber}, il peut la regarder, la vouloir, la changer. Et {coral}la volonté vient avant la conscience{/coral} : la prise sur l'activité est pratique autant que théorique.

    **Pourquoi « il a » ?** *Er hat* : le verbe avoir {coral}s'oppose au verbe être{/coral} de l'animal. Avoir son activité, c'est {amber}en prendre possession{/amber}, reprendre à son compte l'activité naturelle qui nous traverse. {yellow}Le maraudeur qui cueille des fruits pour se nourrir et le jardinier qui décide de planter un verger, choisit les espèces et prévoit les récoltes font tous deux quelque chose pour vivre ; seul le second a son activité.{/yellow}

    **Pourquoi « une détermination avec laquelle il se confond » ?** *Eine Bestimmtheit* : {violet}un caractère fixé{/violet}, qui définirait l'homme sans qu'il y soit pour rien, comme l'instinct définit l'animal. L'activité de l'homme n'est pas fixée d'avance : elle est {green}ce qu'il en fait{/green}.

    **Pourquoi « c'est seulement par là » ?** *Eben nur dadurch* : l'insistance (*eben*) et la restriction (*nur*) ensemble. {coral}C'est la conscience de son activité, et rien d'autre, qui fait de l'homme un être générique.{/coral} Pourquoi ? Parce que celui qui a son activité devant lui peut la rapporter à toutes les espèces, et se rapporter à soi comme à l'espèce : l'universalité du §1 suppose cette distance.

    ? **Conscience** : chez Marx, le fait que {amber}« sa vie propre est pour lui un objet »{/amber} ; non {red}une intériorité séparée du monde{/red}, mais {green}une prise sur sa propre activité{/green}, et la connaissance de soi comme partie de la nature.

    **Ce que dira *Le Capital*.** L'idée y demeure, sans le mot : ce qui distingue {teal}« le plus mauvais architecte de la meilleure abeille »{/teal}, c'est qu'il a construit la cellule dans sa tête avant de la construire dans la cire ; le résultat {teal}« existait donc déjà en idée »{/teal}. Avoir son activité, c'est pouvoir s'en proposer la fin.

    ! Marx ne place pas la différence de l'homme {red}dans la pensée{/red}, comme la tradition qui le définit par la raison : ce que l'homme a pour objet, c'est {green}son activité vitale{/green}, et la conscience est une prise pratique sur ce qu'il fait.
  passage:
    label: "§4"
    part: "3. La première preuve : l'activité vitale réduite à un moyen"
    text: "L'animal se confond immédiatement avec son activité vitale. Il ne se distingue pas d'elle. Il est cette activité. L'homme fait de son activité vitale elle-même l'objet de sa volonté et de sa conscience. Il a une activité vitale consciente ; elle n'est pas une détermination avec laquelle il se confond immédiatement. L'activité vitale consciente distingue directement l'homme de l'activité vitale de l'animal. C'est seulement par là qu'il est un être générique."
