- id: m1844-p14d
  title: "La nature entière, corps non organique de l'homme"
  notes: |-
    **Marx tire la conclusion de ce qui précède : si l'homme vit de toute la nature, {coral}la nature entière est comme son corps{/coral}, un corps qui n'est pas fait d'organes, mais qui le prolonge au-dehors.** Elle l'est de deux façons : comme ce dont il se nourrit, et comme ce sur quoi et avec quoi il travaille.

    **Pourquoi « apparaît en pratique précisément » ?** L'allemand dit *erscheint praktisch eben*, « apparaît pratiquement, justement » : l'universalité, posée au §1, {amber}se montre là et pas ailleurs{/amber}. Ce n'est pas dans sa pensée que l'homme prouve qu'il est universel, c'est dans l'étendue de ce dont il vit.

    **Pourquoi « corps » ?** Ici, l'allemand dit *unorganischer Körper*, {violet}le corps comme masse physique{/violet}. Le mot changera deux phrases plus loin.

    **À quels titres la nature est-elle ce corps ?** « Dans la mesure où » donne {amber}deux titres{/amber}, qui reprennent les deux sens des moyens de vivre du deuxième texte.
    - **Un moyen de subsistance immédiat** : ce dont l'homme vit sans médiation, les vivres.
    - **La matière, l'objet et l'outil de son activité vitale** : ce que le travail transforme, ce sur quoi il porte, ce avec quoi il opère.

    {yellow}Pour le paysan, le champ, les bêtes, la rivière et les outils prolongent les mains et l'estomac : la ferme est comme un grand corps dont son propre corps n'est qu'une partie.{/yellow}

    **Pourquoi « l'outil » ?** C'est le point le plus fort : l'outil, fait de nature, {coral}prolonge l'organe{/coral}. *Le Capital* le reprendra : dans le procès de travail, l'élément naturel devient {teal}« un organe qu'il ajoute à ceux de son propre corps »{/teal}, et la terre est à la fois son « garde-manger originel » et son « arsenal originel ».

    ? **Activité vitale** (*Lebenstätigkeit*) : le mode d'activité par lequel un vivant entretient sa vie ; {yellow}brouter pour la vache, bâtir des alvéoles pour l'abeille{/yellow}, travailler pour l'homme. Le dernier paragraphe en fera ce qui définit chaque espèce.

    **Pourquoi l'universalité fait-elle de la nature un corps ?** Parce que le corps d'un vivant est {amber}l'étendue de son rapport au monde{/amber}. Un vivant dont le rapport au monde se limite à un secteur a un corps limité à ses organes ; un vivant universel, qui vit de tout et travaille tout, a pour corps {coral}tout ce dont il vit{/coral}.

    ! « Corps non organique » ne veut pas dire que la nature soit {red}la propriété{/red} de l'homme : c'est dire qu'{green}il ne survit pas séparé d'elle{/green}, comme il ne survit pas séparé de ses membres.
