- id: m1844-p15b
  title: "La vie générique, moyen de la vie individuelle"
  notes: |-
    **L'aliénation de l'espèce est {coral}un renversement de la fin et du moyen{/coral}, en deux temps : d'abord, les deux vies sont séparées ; ensuite, la vie individuelle, appauvrie, devient le but de la vie générique, elle-même appauvrie.**

    **Que sont les deux vies ?**
    - {violet}La vie générique{/violet} (*Gattungsleben*) : l'activité libre et consciente par laquelle les hommes {amber}transforment ensemble le monde{/amber} et déploient leurs puissances.
    - {violet}La vie individuelle{/violet} : {amber}la simple subsistance{/amber} de chacun, manger, boire, s'abriter, entretenir sa force.

    Dans un rapport non aliéné, les deux {green}ne s'opposent pas{/green} : l'individu vit en participant à la vie de l'espèce, et sa subsistance est une condition de cette participation.

    **Pourquoi « premièrement… deuxièmement » ?** Deux {amber}temps{/amber}, non deux causes.
    - **Il les rend étrangères** : il les {coral}sépare{/coral}. Normalement, elles ne font qu'une, puisque l'individu vit en vivant la vie de son espèce.
    - **Il fait de la seconde le but de la première** : *zum Zweck*, le but, la fin. {coral}Le moyen et la fin sont échangés.{/coral}

    **Pourquoi la séparation produit-elle l'inversion ?** Une fois les deux vies séparées, l'activité productive n'est plus vécue par l'ouvrier {red}ni comme la sienne ni comme celle de l'espèce{/red}, mais comme une contrainte extérieure ; et sa seule fin, pour lui, devient {amber}ce qu'elle lui rapporte{/amber} : la survie. Le texte précédent l'a montré : le travail n'y est « qu'un moyen de satisfaire des besoins en dehors du travail ». {yellow}Le médecin qui ne soigne plus que pour gagner sa vie fait de la médecine, œuvre de l'espèce pour l'espèce, un moyen de payer son loyer.{/yellow}

    ? **Abstraction** : chez Marx, {violet}la séparation d'avec les rapports{/violet}, non l'idée générale. La vie individuelle « réduite à l'abstraction » est celle d'un individu coupé de l'espèce, {amber}un égoïsme abstrait{/amber} ; la vie générique « également prise sous sa forme abstraite » est une activité coupée des individus, {amber}une contrainte qui ne vit en personne{/amber}.

    **Pourquoi les deux vies sont-elles dégradées ?** Parce que chacune, séparée de l'autre, {coral}perd ce qui la faisait vivre{/coral}. La vie individuelle n'est plus que survie ; la vie générique n'est plus que la marche d'une production qui n'est celle de personne.

    **Un écho de *Sur la question juive*.** Marx y décrivait la société civile, où l'homme {teal}« considère les autres comme des moyens, se ravale lui-même au rang de moyen »{/teal}, tandis que la vie générique n'existait plus que dans l'abstraction de l'État. Le travail aliéné en donne ici {green}la racine, dans la production elle-même{/green}.

    ! On pourrait lire que Marx veut l'inverse, {red}la vie individuelle sacrifiée à l'espèce{/red}. Non : la vie générique n'est pas celle d'un collectif au-dessus des individus, mais {green}la vie de chacun en tant qu'être universel{/green}. Et il ne s'agit pas de morale, comme si l'ouvrier préférait son intérêt : c'est {green}la structure de l'activité{/green} qui renverse la fin et le moyen.
  passage:
    label: "§3"
    part: "2. Le travail aliéné rend l'espèce étrangère"
    text: "Premièrement, il rend étrangères la vie générique et la vie individuelle et, deuxièmement, il fait de cette dernière, réduite à l'abstraction, le but de la première, qui est également prise sous sa forme abstraite et aliénée."
