- id: m1844-p16b
  title: "La vie productive, la vie engendrant la vie"
  notes: |-
    **Marx pose la mineure qui manquait : {coral}la vie productive est la vie même de l'espèce{/coral}, une vie qui produit de la vie. Chaque espèce se reconnaît à sa manière d'agir pour vivre, et celle de l'homme est l'activité libre et consciente. La conclusion tombe : c'est la vie elle-même qui n'est plus qu'un moyen.**

    **Pourquoi « mais » ?** *Aber* : la mineure {amber}s'oppose{/amber} à ce qui vient d'être dit. Le travail n'apparaît que comme moyen, {coral}mais il est en réalité la vie générique{/coral}.

    **Pourquoi « la vie engendrant la vie » ?** *Das Leben erzeugende Leben*. Le verbe *erzeugen*, engendrer, produire, s'applique aussi à la génération. On pourrait l'entendre au sens {red}biologique{/red}, la reproduction de l'espèce, ou {red}économique{/red}, la production des moyens de subsistance. Il faut y lire davantage, {green}un redoublement{/green} : par le travail, l'homme ne se contente pas d'entretenir son organisme, il produit volontairement {amber}les conditions d'existence et le mode de vie de toute son espèce{/amber}, ce qui fait de la vie humaine une histoire et une culture. {yellow}Ce que l'homme produit, maisons, outils, champs cultivés, savoirs, devient la condition de vie des autres hommes et des générations suivantes.{/yellow} C'est pourquoi produire, c'est vivre la vie de l'espèce.

    **Pourquoi « le mode d'activité vitale renferme tout le caractère d'une espèce » ?** C'est {violet}un principe général{/violet}, que Marx pose pour toute espèce (l'allemand dit *species*, en latin, le mot de la classification naturelle) : {coral}une espèce se définit par sa manière de vivre{/coral}, non par sa forme ou sa substance. {yellow}Le castor se reconnaît à ses barrages, l'abeille à ses alvéoles ; l'homme, à ce qu'il produit en le voulant et en le sachant.{/yellow}

    ? **Caractère générique** (*Gattungscharakter*) : ce qui distingue une espèce des autres, et qui se lit dans sa manière de vivre. Pour l'homme, {amber}l'activité libre et consciente{/amber} : une activité qu'il veut et qu'il sait, et {red}non une activité qui le traverse comme un instinct{/red}. « Libre » et « consciente » vont ensemble : la liberté tient à la conscience.

    **Pourquoi « la vie elle-même » ?** C'est la conclusion du syllogisme, énoncée sans « donc » : {coral}ce n'est plus seulement le travail, c'est « la vie elle-même » qui n'est plus qu'un moyen de subsistance{/coral}. Si la vie productive est la vie générique, et que le travail aliéné en fait un moyen de survivre, alors la vie tout entière est réduite à un moyen de vivre.

    **Ce que dira *L'Idéologie allemande*.** La même idée, sans le vocabulaire de l'espèce : les hommes se distinguent des animaux {teal}« dès qu'ils commencent à produire leurs moyens d'existence »{/teal}.

    ! Marx ne réduit pas l'homme à {red}un producteur économique{/red} : la production dont il parle est {green}la vie générique tout entière{/green}, qui comprend la science et l'art, et que le texte suivant étendra à la production « d'après les lois de la beauté ».
