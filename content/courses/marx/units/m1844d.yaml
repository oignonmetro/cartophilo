- id: m1844-p16
  title: "Le travail, simple moyen de la conservation physique"
  notes: |-
    **Marx commence la preuve de ce qu'il vient d'énoncer : dans le travail aliéné, l'activité productive, qui est la vie même de l'homme, {coral}ne lui apparaît plus que comme un moyen de se maintenir en vie{/coral}.**

    **Pourquoi « car » ?** *Denn* : la phrase {amber}justifie{/amber} ce qui précède. La troisième détermination a été énoncée ; elle va être prouvée.

    **Pourquoi « premièrement » ?** *Erstens* : le premier d'une série dont {amber}le second terme ne viendra que dans le texte suivant{/amber}, avec la production d'un monde objectif. La preuve est donc incomplète dans ce texte.

    **Pourquoi trois noms, « le travail, l'activité vitale, la vie productive » ?** Trois noms pour {violet}une même chose{/violet}, du plus courant au plus philosophique. La gradation prépare l'identification de la phrase suivante : la vie productive est la vie générique.

    **Pourquoi « n'apparaissent à l'homme » ?** *Erscheint dem Menschen* : c'est {amber}la manière dont il vit son propre travail{/amber}. Et « que comme un moyen » : la restriction est le cœur de la phrase.

    **Quel besoin ?** Un besoin {amber}unique et le plus bas{/amber} : survivre, « la conservation de l'existence physique ». On retrouve le « sujet physique » du deuxième texte et la « satisfaction d'un besoin » du troisième. {yellow}L'ouvrier qui répond à la question « pourquoi travailles-tu ? » par « pour manger » dit exactement cela.{/yellow}

    **La phrase prouve-t-elle quelque chose ?** {red}Pas à elle seule.{/red} Que le travail n'apparaisse que comme un moyen de survivre ne montre pas que la vie générique soit dégradée, {amber}tant qu'on n'a pas établi que le travail est la vie générique{/amber}. Le raisonnement complet a la forme d'un syllogisme.
    - **Majeure** (cette phrase) : le travail n'apparaît que comme moyen de la survie individuelle.
    - **Mineure** (la phrase suivante) : or le travail est la vie générique.
    - **Conclusion** : donc la vie générique n'apparaît que comme moyen de la vie individuelle.

    La majeure reprend ce que le texte précédent a établi : un travail extérieur, forcé, {teal}« seulement un moyen de satisfaire des besoins en dehors du travail »{/teal}.

    ! Marx ne reproche pas à l'homme de {red}travailler pour vivre{/red}, ce que tout homme fait : « que comme » est décisif. Ce qui est dénoncé, c'est que le travail {green}ne serve plus qu'à cela{/green}.
  passage:
    label: "§4"
    part: "3. La première preuve : l'activité vitale réduite à un moyen"
    text: "Car, premièrement, le travail, l'activité vitale, la vie productive n'apparaissent eux-mêmes à l'homme que comme un moyen de satisfaire un besoin, le besoin de conservation de l'existence physique."
  points:
  - id: m1844-p16-1
    sentence: "« Car, premièrement, le travail, l'activité vitale, la vie productive n'apparaissent eux-mêmes à l'homme que comme ___, le besoin de conservation de l'existence physique. »"
    answer: "un moyen de satisfaire un besoin"
    alt: []
