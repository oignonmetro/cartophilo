- id: m1844-p14
  title: "1.3 et 1.4 Vivre de la nature, la nature corps non organique"
  notes: |-
    **L'universalité de l'homme se montre en pratique dans le fait que {coral}la nature entière est son corps non organique{/coral}.**

    **1.3 Vivre de la nature.** Comme l'animal, l'homme vit de la {violet}nature non organique{/violet}, tout ce qui n'est pas un organe de son corps ; mais {amber}plus il est universel, plus le champ dont il vit est universel{/amber}. Prémisse implicite : un vivant se définit par ses objets. En théorie, plantes, pierres, air, lumière sont objets de science et d'art, sa {violet}« nature spirituelle non organique »{/violet}, ses « moyens de subsistance spirituels » (*geistige Lebensmittel*) qu'il doit d'abord préparer {teal}« pour la jouissance et la digestion »{/teal} : la conscience est {green}une manière de se nourrir de la nature{/green}, non de s'en arracher. L'incise « d'abord préparer » annonce que ce rapport passe par le travail.

    Ce qui fait ici l'universalité n'est plus la conscience, comme chez Feuerbach, mais {amber}l'étendue de nature dont on vit{/amber} : aucun animal ne se nourrit d'autant d'espèces, terrestres, aquatiques ou volantes. « Non organique » ne veut pas dire {red}inerte{/red} : les plantes et le gibier dont il se nourrit sont des vivants, mais non ses organes. Pour la nature spirituelle, un parallélisme d'allure spinoziste, non un reflet : {green}l'esprit se nourrit des idées des choses dont le corps se nourrit{/green}.

    **1.4 La nature, corps non organique.** Elle l'est {amber}comme moyen de subsistance{/amber} et {amber}comme matière, objet et outil{/amber} de l'activité vitale. Marx écrit d'abord *unorganischer Körper*, puis *Leib*, {violet}le corps de chair{/violet} : la nature prolonge un corps vécu. L'homme doit rester avec elle {teal}« en procès constant »{/teal} (*in beständigem Prozeß*) pour ne pas mourir : la première forme du métabolisme (*Stoffwechsel*) du *Capital*.

    **Pourquoi un « corps » ?** Un corps est ce dont un vivant ne peut être séparé sans mourir ; l'homme ne peut pas plus vivre sans air, eau, terre et outils que sans ses organes. Et la dernière phrase renverse la perspective : le lien de l'homme à la nature est {coral}« la nature liée à elle-même, car l'homme est une partie de la nature »{/coral}. Monisme d'inspiration spinoziste : l'homme {red}n'est pas « un empire dans un empire »{/red}.

    **Le corps prolongé.** Ce monisme se précise par Spinoza : un individu est un corps composé qui ne persévère dans son être qu'en {amber}empruntant sans cesse des corps extérieurs{/amber} pour remplacer ceux qu'il perd ; il n'y a donc pas de frontière nette entre l'individu et son milieu. Le corps propre, organique, a le sentiment de soi ; il {violet}se prolonge dans la nature extérieure{/violet}, son corps non organique. *Le Capital* reprendra l'« outil » : dans le procès de travail, l'élément naturel devient {teal}« un organe qu'il ajoute à ceux de son propre corps »{/teal}, et la terre est à la fois son « garde-manger originel » et son « arsenal originel ».

    ! Faire de la nature le corps de l'homme, ce n'est pas en faire {red}sa propriété{/red} : c'est dire qu'{green}il ne survit pas séparé d'elle{/green}.
  passage:
    label: "§2"
    part: "1. Ce qu'est l'homme : un être générique"
    text: "La vie générique, aussi bien chez l'homme que chez l'animal, consiste d'abord, au point de vue physique, dans le fait que l'homme (comme l'animal) vit de la nature non organique ; et plus l'homme est universel comparé à l'animal, plus est universel le champ de la nature non organique dont il vit. Les plantes, les animaux, les pierres, l'air, la lumière, etc., constituent du point de vue théorique une partie de la conscience humaine, soit en tant qu'objets de la science de la nature, soit en tant qu'objets de l'art : ils constituent sa nature spirituelle non organique et sont les moyens spirituels de subsistance que l'homme doit d'abord préparer pour en jouir et les assimiler. De même, au point de vue pratique, ils constituent une part de la vie et de l'activité humaines. Physiquement, l'homme ne vit que de ces produits naturels, qu'ils apparaissent sous forme de nourriture, de chauffage, de vêtements, d'habitation, etc. L'universalité de l'homme apparaît en pratique précisément dans l'universalité qui fait de la nature entière son corps non organique, dans la mesure où elle est : 1) un moyen de subsistance immédiat, et 2) la matière, l'objet et l'outil de son activité vitale. La nature, c'est-à-dire la nature qui n'est pas elle-même le corps humain, est le corps non organique de l'homme. L'homme vit de la nature signifie : la nature est son corps avec lequel il doit rester constamment en contact pour ne pas mourir. Dire que la vie physique et intellectuelle de l'homme est indissolublement liée à la nature ne signifie pas autre chose sinon que la nature est liée à elle-même, car l'homme est une partie de la nature."
