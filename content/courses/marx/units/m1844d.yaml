- id: m1844-p14e
  title: "Le corps de chair, en procès constant"
  notes: |-
    **Marx précise et durcit la formule : la nature, {coral}hors du corps humain{/coral}, est le corps de l'homme, et vivre de la nature, c'est {coral}être en échange continuel avec elle, faute de quoi on meurt{/coral}.**

    **Pourquoi « la nature qui n'est pas elle-même le corps humain » ?** La précision {amber}écarte une confusion{/amber} : le corps organique, fait d'organes, est une chose ; le corps non organique, toute la nature au-dehors, en est une autre.

    **Pourquoi le mot change-t-il ?** Cette fois, l'allemand dit *der unorganische Leib* : {violet}le corps vivant, le corps de chair{/violet}, et non plus *Körper*, la masse physique. Le passage d'un mot à l'autre fait de la nature {coral}non plus seulement une masse extérieure, mais le prolongement d'un corps vécu{/coral}. Il faut même inverser les choses : le corps de chaque individu est inscrit comme une partie au sein d'un corps plus large, qui n'est autre que la nature elle-même.

    **Pourquoi « signifie » ?** Marx {amber}définit une expression courante{/amber}, « l'homme vit de la nature », en lui donnant un sens fort. Ce que tout le monde dit sans y penser, il le prend au pied de la lettre.

    **Pourquoi « constamment en contact » ?** L'allemand dit *in beständigem Prozeß bleiben*, {violet}« rester en procès constant »{/violet} : non un simple contact, mais {amber}un échange continu{/amber}. {yellow}On respire, on mange, on rejette, on se chauffe, à chaque instant : un homme qui cesserait d'échanger avec la nature mourrait en quelques minutes.{/yellow} C'est la première forme de ce que *Le Capital* appellera le {violet}métabolisme{/violet} (*Stoffwechsel*), le procès par lequel l'homme règle ses échanges de matière avec la nature.

    **Pourquoi un « corps », et non seulement un milieu ?** Le raisonnement implicite passe par une définition du corps que le texte ne donne pas. {coral}Un corps, c'est ce dont un vivant ne peut être séparé sans mourir{/coral} : la main, l'estomac, les poumons. Or l'homme ne peut pas plus vivre sans l'air, l'eau, les plantes et la terre qu'il travaille que sans ses poumons ou ses mains ; et son activité vitale s'étend à travers les outils et les matières comme à travers des organes extérieurs. La nature remplit donc la fonction d'un corps ; elle n'en diffère qu'en ce qu'elle n'est pas faite d'organes, d'où « non organique ».

    **Le corps prolongé.** On peut préciser ce rapport par Spinoza : un individu est un corps composé qui ne persévère dans son être qu'en {amber}empruntant sans cesse des corps extérieurs{/amber} pour remplacer ceux qu'il perd. Il n'y a donc {red}pas de frontière nette{/red} entre l'individu et son milieu : le corps propre, qui a le sentiment de soi, {green}se prolonge dans la nature extérieure{/green}.

    ! « Corps non organique » n'est pas {red}une métaphore{/red} : c'est {green}une thèse{/green}, qui dit que l'homme ne peut pas plus survivre séparé de la nature que privé de ses organes.
  passage:
    label: "§2"
    part: "1. Ce qu'est l'homme : un être générique"
    text: "La nature, c'est-à-dire la nature qui n'est pas elle-même le corps humain, est le corps non organique de l'homme. L'homme vit de la nature signifie : la nature est son corps avec lequel il doit rester constamment en contact pour ne pas mourir."
  points:
