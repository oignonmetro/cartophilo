- id: m1844-p15
  title: "Après la nature et l'activité, l'espèce"
  notes: |-
    **Marx énonce la troisième détermination en la rattachant aux deux premières : {coral}en rendant à l'homme la nature et sa propre activité étrangères, le travail aliéné lui rend du même coup étrangère son espèce{/coral}, et fait de la vie de l'espèce le moyen de sa vie individuelle.**

    **Pourquoi « tandis que » ?** C'est le point décisif, et la traduction l'efface. L'allemand dit *Indem … so*, {violet}« en ce que…, par là »{/violet}, « du fait que…, de ce fait » : la construction est {amber}causale et instrumentale{/amber}, {red}non temporelle ni concessive{/red}. {coral}C'est en rendant étrangères la nature et l'activité que le travail aliéné rend étrangère l'espèce.{/coral} « Tandis que », qui juxtapose, efface cette dérivation ; et « aussi » ajoute une troisième aliénation, là où l'allemand en fait une conséquence.

    **Pourquoi « 1) la nature et 2) lui-même » ?** La numérotation reprend les deux déterminations, mais la première est désormais désignée {amber}par la nature, non plus par le produit{/amber} : le bilan du texte précédent avait dit que le rapport au produit est « en même temps le rapport au monde extérieur sensible ». La seconde est nommée par le mot que le dernier paragraphe va développer, {violet}l'activité vitale{/violet}.

    **Pourquoi l'aliénation de la nature et de l'activité entraîne-t-elle celle de l'espèce ?** Le raisonnement est un syllogisme dont le premier mouvement a fourni la majeure.
    - L'homme est générique {amber}par deux choses{/amber} : son rapport à la nature entière, qui est son corps non organique, et son activité vitale consciente, par laquelle il fait de toutes les espèces son objet.
    - Or le travail aliéné {amber}lui retire l'une et l'autre{/amber} : la nature devient la propriété d'un autre, l'activité devient une contrainte.
    - Il lui retire donc {coral}ce par quoi il est générique{/coral}, et l'espèce lui devient étrangère.

    {yellow}Un musicien privé de son instrument et obligé de jouer sur commande une musique qu'il n'a pas choisie n'est pas seulement privé d'un objet et d'un plaisir : il est coupé de ce qui faisait de lui un musicien parmi les musiciens.{/yellow}

    **Pourquoi Marx devait-il poser la définition avant ?** Parce que la dérivation n'est rigoureuse {green}qu'à condition d'admettre la définition de l'homme{/green}. Sans elle, perdre la nature et son activité serait perdre deux choses ; avec elle, c'est perdre son appartenance à l'espèce.

    **En quoi consiste cette perte ?** La fin de la phrase le dit : le travail aliéné fait {coral}« de la vie générique le moyen de la vie individuelle »{/coral}. « Pour lui » (*sie macht ihm*) : le renversement est vécu par l'homme lui-même. La phrase suivante en détaille les deux temps.

    ! L'aliénation de l'espèce ne s'ajoute pas aux deux autres {red}comme un troisième mal indépendant{/red} : {green}elle en est la conséquence{/green}, et c'est ce qui donne à la phrase sa force, celle d'une déduction.
