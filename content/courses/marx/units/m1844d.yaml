id: m1844d
title: "L'être générique renversé (1844)"
subtitle: "Manuscrits de 1844, premier manuscrit, « Le travail aliéné », 4 / 5"
group: "Le travail aliéné (Manuscrits de 1844)"
depth: normale
icon: page
color: coral
intro: |-
  La troisième détermination du travail aliéné : l'homme est un être générique, qui vit de la nature comme de son corps non organique et fait de son activité vitale l'objet de sa conscience ; le travail aliéné renverse ce rapport et fait de la vie générique le moyen de la vie individuelle.
lessons:
- id: m1844d-i1
  title: "Le texte, sa place et son plan"
  notes: |-
    **Le texte est le quatrième des cinq moments du passage sur le travail aliéné : il énonce enfin {coral}ce qu'est l'homme{/coral}, sous le nom d'être générique, pour en tirer une troisième détermination, {coral}l'homme rendu étranger à son espèce{/coral}.** Il se trouve aux pages XXIII et XXIV du manuscrit, de « De ces deux déterminations du travail aliéné, nous devons en tirer une troisième » à la phrase où le travail aliéné « renverse ce rapport ».

    **Où en est l'argument.** Les trois textes précédents ont dégagé {amber}l'aliénation de la chose{/amber} (l'ouvrier dépossédé de son produit et de la nature, serviteur de son objet) et {amber}l'aliénation de soi{/amber} (son activité vécue comme celle d'un autre). Ils s'appuyaient sur une conception de l'homme {red}qu'ils supposaient sans l'énoncer{/red} : ils parlaient de son « essence », de ses « fonctions proprement humaines », sans dire ce qu'elles sont.

    **Pourquoi la définition de l'homme vient-elle si tard ?** Parce que Marx est parti {green}d'un fait économique{/green}, non d'une définition de l'homme posée d'avance, pour ne pas faire comme l'économiste qui se transporte dans un état originel imaginaire. {coral}La définition vient quand l'analyse du fait la rend nécessaire.{/coral} Le texte suivant achèvera la démonstration et en tirera une quatrième détermination, l'homme étranger à l'homme.

    **D'où vient le mot.** *Gattungswesen*, « être générique », est un mot de Feuerbach. Dans *L'Essence du christianisme* (1841), la conscience au sens strict n'existe que là où un être a pour objet {violet}son genre{/violet} : l'animal a le {amber}sentiment de soi{/amber}, il est objet pour lui-même comme individu, non comme genre ; la conscience est science, et il n'y a de science que du général. Marx avait d'abord employé le mot contre l'État : dans *Sur la question juive*, là où il est « considéré comme un être générique », l'homme est {teal}« le membre imaginaire d'une souveraineté illusoire »{/teal}, empli d'une universalité irréelle. En 1844, il le ramène {green}de l'État et de la science à la production{/green}.

    ? **Genre, espèce** (*Gattung*) : l'ensemble des êtres d'une même sorte. **Vie générique** (*Gattungsleben*) : la vie de l'espèce en tant qu'espèce, ce qui en chaque individu relève de ce qu'il a en commun avec les autres. **Activité vitale** (*Lebenstätigkeit*) : le mode d'activité par lequel un vivant entretient sa vie ; chez l'homme, le travail.

    | Mouvement | Lieu | Ce qui s'y joue |
    | ce qu'est l'homme : un être générique | §1 et §2 | L'homme fait de toutes les espèces son objet et se rapporte à lui-même comme à l'espèce, donc comme à un être universel et libre ; cette universalité fait de la nature entière son corps non organique. |
    | le travail aliéné rend l'espèce étrangère | §3 | En lui rendant étrangères la nature et son activité, il lui rend étrangère son espèce, et fait de la vie générique le moyen de la vie individuelle. |
    | la première preuve | §4 | La vie productive est la vie générique ; l'animal est son activité, l'homme l'a ; le travail aliéné retourne cette distance, et fait de l'essence un moyen de l'existence. |

    **Un mot bientôt abandonné.** Dès 1845, la sixième des *Thèses sur Feuerbach* reprochera au genre feuerbachien d'être une {red}« universalité interne, muette »{/red}, liant naturellement les individus : l'essence humaine sera « l'ensemble des rapports sociaux ». Le mot disparaîtra ; le contenu demeurera (le travail conscient, le rapport universel à la nature), sous le nom de {violet}métabolisme{/violet}.

    ! Marx ne juge pas le travail aliéné au nom d'{red}une essence éternelle{/red}, d'un âge d'or perdu : il dégage {green}ce qui, dans l'activité humaine présente, la distingue de celle de l'animal{/green}, et que le travail aliéné retourne.
