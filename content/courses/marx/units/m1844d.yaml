- id: m1844-p13b
  title: "Faire de l'espèce son objet, se rapporter à soi comme à un être universel, donc libre"
  notes: |-
    **Marx donne deux raisons pour lesquelles l'homme est un être générique, et dit qu'{coral}elles reviennent au même{/coral} : il fait des espèces son objet, et il se rapporte à lui-même comme à l'espèce présente en lui, donc comme à un être universel, et par là libre.**

    **Pourquoi « non seulement parce que… mais encore » ?** L'allemand dit *indem*, « en ce que » : ce ne sont pas {red}des causes{/red}, mais {green}des manières d'être générique{/green}.

    **Pourquoi « sur le plan pratique et théorique » ?** Par l'action et par la connaissance ; et Marx met {amber}la pratique en premier{/amber}.

    **Pourquoi « la sienne propre aussi bien que celle de toute chose » ?** L'élargissement est décisif : l'homme ne connaît et ne travaille pas seulement l'espèce humaine, mais {coral}toutes les espèces{/coral} ; il traite chaque chose selon ce qu'elle est en général. {yellow}Le botaniste qui classe les plantes fait des espèces son objet ; l'éleveur qui sait ce qu'il faut à chaque bête la traite selon son espèce.{/yellow}

    **Pourquoi « une espèce réelle, vivante » ?** L'allemand dit *der gegenwärtigen, lebendigen Gattung*, {violet}« l'espèce présente, vivante »{/violet}, avec l'article défini : l'homme se rapporte à lui-même comme à l'espèce {amber}en tant qu'elle est là, présente en lui{/amber}, {red}non comme à une idée générale{/red}. Ce n'est pas le genre pensé par la science, comme chez Feuerbach, mais {green}des individus réels, vivants, en relation{/green}. Le troisième manuscrit en tirera la conséquence : {teal}« L'individu est l'être social »{/teal}, et « la vie individuelle et la vie générique de l'homme ne sont pas différentes ». Mais ici, Marx définit l'être générique {amber}d'abord par le rapport à la nature et l'activité libre{/amber}, sans thématiser encore les autres : l'identité avec l'être social est l'aboutissement des *Manuscrits*, non le point de départ de ce paragraphe.

    **Pourquoi les deux définitions disent-elles « la même chose » ?** L'incise l'affirme, et ce n'est pas évident. On peut le reconstruire.
    - Un vivant {amber}enfermé dans sa particularité{/amber} ne rencontre les choses qu'en fonction de son besoin propre : {yellow}l'abeille ne connaît de la fleur que le nectar{/yellow}.
    - Pour rencontrer chaque chose {amber}selon son espèce{/amber}, selon ce qu'elle est en général, il faut ne pas être enfermé dans un besoin particulier : se rapporter à soi non comme à cet individu-ci, mais comme à un être capable de tout connaître et de tout travailler, {coral}l'espèce en sa généralité{/coral}.
    - Réciproquement, celui qui se sait l'espèce présente en lui ne se limite à aucun objet.

    Les deux formules décrivent {coral}une même libération à l'égard de la particularité{/coral}, vue du côté des objets, puis du côté de soi. La raison profonde : chez Marx, la conscience de soi {green}passe par l'action objective dans le monde{/green} ; le rapport à soi se fait par le rapport aux choses.

    **Pourquoi « donc libre » ?** *Darum freien* : la liberté est {violet}déduite{/violet} de l'universalité. Un être qui se rapporte à l'universel {amber}n'est rivé à rien{/amber} : il peut choisir son objet, et même produire sans y être poussé par le besoin, ce que le texte suivant dira. La prémisse implicite est une définition de la liberté comme {coral}autodétermination{/coral} : être la cause de sa propre action, au lieu d'être mû par un besoin particulier ; c'est l'auto-activité (*Selbstbetätigung*). Sa face concrète : l'homme {amber}n'est fixé à aucun mode de vie{/amber}, {yellow}il habite cavernes, cabanes ou palais, mange racines, gibier ou mets raffinés{/yellow}. La non-fixité est la manifestation de l'autodétermination.

    ? **Universel, libre** : universel, ce dont le rapport au monde {amber}ne se limite à aucun secteur{/amber}, comme celui de l'abeille aux fleurs ; libre, ce qui {amber}n'est déterminé par aucune particularité qui s'imposerait{/amber}, un besoin, un instinct, un objet unique. {red}Non le libre arbitre{/red}, le pouvoir de choisir entre deux actions ; ni le sens abstrait d'{red}être doué de raison{/red}.

    **L'écart avec Feuerbach.** La première définition est proche de lui, pour qui l'homme est l'être qui a pour objet son genre ; la seconde s'en écarte. Feuerbach plaçait l'essence générique dans {red}la conscience théorique, la raison et l'amour{/red} ; Marx {green}la rend pratique{/green} : se rapporter à soi comme à l'espèce présente, c'est se savoir partie de la nature et agir en conséquence.

    ! « Se rapporter à soi comme à une espèce » n'est pas {red}une opération de pure pensée{/red}, l'idée générale d'homme qu'on aurait en tête : l'espèce est « présente, vivante », et le mot « pratique », placé en premier, {green}interdit cette lecture{/green}.
