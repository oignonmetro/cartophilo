- id: m1844-p13
  title: "Une troisième détermination : l'homme est un être générique"
  notes: |-
    **Marx annonce qu'une troisième détermination du travail aliéné va se déduire des deux premières, et pose aussitôt la prémisse dont il a besoin : {coral}l'homme est un être générique{/coral}, un être qui se rapporte à son espèce.** Le texte s'ouvre par un programme et une définition.

    **Pourquoi « déterminations » ?** *Bestimmung*, le mot qui disait, dans le premier texte, {amber}la détermination dont découlent les conséquences{/amber} : un caractère qui définit la chose. Les deux premières sont l'aliénation du produit (et de la nature) et l'aliénation de l'activité.

    **Pourquoi « nous devons en tirer » ?** *Zu ziehn*, tirer, extraire : le verbe annonce {violet}une déduction{/violet}, non une observation nouvelle, et « devons » marque l'obligation du raisonnement. La numérotation (1, 2, puis 3) organise le passage en déterminations successives.

    **La déduction se fait-elle des deux déterminations seules ?** Non. Il faut leur ajouter {amber}une prémisse{/amber}, la définition de l'homme, que Marx pose aussitôt sans la démontrer. Le schéma implicite est celui d'un syllogisme.
    - Le travail aliéné rend étrangers à l'homme {amber}son produit et son activité{/amber} : c'est acquis.
    - Or l'homme est un être qui {amber}se rapporte à son espèce par son activité et par la nature qu'il transforme{/amber} : c'est ce qui va être posé.
    - Donc {coral}le travail aliéné lui rend son espèce étrangère{/coral}.

    {yellow}Un professeur qui a montré qu'un élève a perdu son cahier et sa plume, puis qu'il ne sait plus écrire, ajoute : or écrire est ce qui fait de lui un écolier ; et il en tire que l'élève a perdu jusqu'à sa qualité d'écolier.{/yellow}

    **Pourquoi « l'homme » ?** Non plus {red}« l'ouvrier »{/red} : la définition porte sur {green}l'homme en général{/green}, et c'est à partir d'elle qu'on mesurera ce qui arrive à l'ouvrier. « Est » : un énoncé de définition, au présent, sans modalisateur.

    ? **Être générique** (*Gattungswesen*) : un être (*Wesen*, qui veut dire aussi essence) du genre (*Gattung*). Non pas simplement un individu qui appartient à une espèce, {red}ce que fait tout vivant{/red}, mais un être qui {amber}se rapporte à son espèce{/amber}, qui la connaît, agit en elle et pour elle, et met en jeu, en chacun de ses actes, ce qu'il a en commun avec tous les hommes. Chez Marx, ce rapport est {green}d'abord pratique{/green}. {yellow}Le chien appartient à l'espèce canine sans le savoir ; l'homme qui apprend une langue, invente un outil ou écrit une loi agit en membre de l'espèce humaine, et pour elle.{/yellow}

    **Les textes précédents ne supposaient-ils pas déjà cette définition ?** Si : quand ils parlaient de l'« essence » de l'ouvrier, à laquelle le travail est extérieur, et de ses « fonctions proprement humaines ». {coral}Ce texte rend explicite ce qui était implicite.{/coral}

    ! Ces deux phrases {red}ne démontrent rien{/red} : elles posent un programme et une prémisse, et {green}toute la valeur de la déduction à venir dépendra de cette prémisse{/green}.
  passage:
    label: "§1"
    part: "1. Ce qu'est l'homme : un être générique"
    text: "De ces deux déterminations du travail aliéné, nous devons en tirer une troisième. L'homme est un être générique."
