- id: m1844-p13
  title: "1.1 et 1.2 L'homme est un être générique, universel, donc libre"
  notes: |-
    **Marx pose la prémisse de la troisième détermination : {coral}l'homme est un être générique{/coral}, en deux sens qui n'en font qu'un.**

    **1.1 Un syllogisme.** « Nous devons en tirer » annonce une déduction : le travail aliéné rend étrangers le produit et l'activité ; {amber}or l'homme se rapporte à son espèce par la nature et par son activité{/amber} ; donc il lui rend son espèce étrangère. La définition vient tard parce que Marx est parti d'un fait, non d'une essence posée d'avance.

    **1.2 Deux définitions, « la même chose ».** L'homme fait de l'espèce, la sienne et celle de toute chose, son objet ; et il se rapporte à lui-même comme à {violet}« l'espèce présente, vivante »{/violet} (*der gegenwärtigen, lebendigen Gattung*), comme à un être universel, {coral}« donc libre »{/coral} (*darum*).

    **Pourquoi la même chose ?** Pour rencontrer chaque chose selon son espèce, il faut ne pas être enfermé dans un besoin particulier, comme l'abeille qui ne connaît de la fleur que le nectar ; c'est se rapporter à soi comme à l'espèce en sa généralité. La raison : la conscience de soi {amber}passe par l'action objective dans le monde{/amber} ; le rapport à soi se fait par le rapport aux choses.

    **Pourquoi « donc libre » ?** La liberté est ici {violet}l'autodétermination{/violet}, être la cause de sa propre action, non pas être mû par un besoin particulier ; c'est l'auto-activité (*Selbstbetätigung*).

    Concrètement, l'homme {amber}n'est fixé à aucun mode de vie{/amber} : il habite cavernes, cabanes ou palais, mange racines, gibier ou mets raffinés. {green}La non-fixité est la manifestation de l'autodétermination{/green}. Ce n'est pas le sens abstrait d'{red}être doué de raison{/red} : Hume prêtait déjà une raison aux animaux.

    **« Vivante ».** L'espèce dont il s'agit n'est pas le genre pensé par la science, comme chez Feuerbach, mais {green}des individus réels, vivants, en relation{/green}. Le troisième manuscrit en tirera la conséquence : {teal}« L'individu est l'être social »{/teal}, et « la vie individuelle et la vie générique de l'homme ne sont pas différentes » ; la lettre à Feuerbach du 11 août 1844 demande ce qu'est le genre humain ramené sur terre, « sinon le concept de société ». Mais ici, Marx définit l'être générique {amber}d'abord par le rapport à la nature et l'activité libre{/amber}, sans thématiser encore les autres : l'identité avec l'être social est {red}l'aboutissement des *Manuscrits*{/red}, non le point de départ de ce paragraphe.

    ? **Universel, libre** : universel, ce dont le rapport au monde ne se limite à aucun secteur ; libre, ce qui n'est déterminé par aucune particularité qui s'imposerait. {red}Non le libre arbitre{/red}, le choix entre deux actions.

    Feuerbach plaçait l'essence générique dans la conscience théorique, la raison et l'amour ; Marx {green}la rend pratique{/green}.

    ! Marx ne juge pas au nom d'{red}une essence éternelle{/red} : il dégage ce qui, dans l'activité présente, distingue l'homme de l'animal.
