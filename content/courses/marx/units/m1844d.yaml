- id: m1844-p14
  title: "La nature, corps non organique de l'homme"
  notes: |-
    **La vie générique consiste d'abord à vivre {amber}de la nature non organique{/amber} : la nature est le {coral}corps non organique de l'homme{/coral}.**

    Plus l'homme est universel comparé à l'animal, plus est universel {violet}le champ de la nature non organique dont il vit{/violet}. Théoriquement, plantes, animaux, pierres, air, lumière sont une partie de la conscience (objets de la science, de l'art) : sa nature spirituelle non organique. Pratiquement, ils sont une part de la vie et de l'activité humaines : nourriture, chauffage, vêtements, habitation. La nature entière est ainsi le corps de l'homme sous deux rapports : {green}moyen de subsistance immédiat{/green} et {green}matière, objet et outil de son activité vitale{/green}. Dire que l'homme vit de la nature, c'est dire qu'il doit {amber}rester en contact avec son corps{/amber} pour ne pas mourir, et que la nature est liée à elle-même, car il en fait partie.

    ! Le corps non organique n'est pas le corps humain : c'est la nature en tant qu'elle n'est pas le corps humain.
  passage:
    label: "§2"
    text: "La vie générique, aussi bien chez l'homme que chez l'animal, consiste d'abord, au point de vue physique, dans le fait que l'homme (comme l'animal) vit de la nature non organique ; et plus l'homme est universel comparé à l'animal, plus est universel le champ de la nature non organique dont il vit. Les plantes, les animaux, les pierres, l'air, la lumière, etc., constituent du point de vue théorique une partie de la conscience humaine, soit en tant qu'objets de la science de la nature, soit en tant qu'objets de l'art : ils constituent sa nature spirituelle non organique et sont les moyens spirituels de subsistance que l'homme doit d'abord préparer pour en jouir et les assimiler. De même, au point de vue pratique, ils constituent une part de la vie et de l'activité humaines. Physiquement, l'homme ne vit que de ces produits naturels, qu'ils apparaissent sous forme de nourriture, de chauffage, de vêtements, d'habitation, etc. L'universalité de l'homme apparaît en pratique précisément dans l'universalité qui fait de la nature entière son corps non organique, dans la mesure où elle est : 1) un moyen de subsistance immédiat, et 2) la matière, l'objet et l'outil de son activité vitale. La nature, c'est-à-dire la nature qui n'est pas elle-même le corps humain, est le corps non organique de l'homme. L'homme vit de la nature signifie : la nature est son corps avec lequel il doit rester constamment en contact pour ne pas mourir. Dire que la vie physique et intellectuelle de l'homme est indissolublement liée à la nature ne signifie pas autre chose sinon que la nature est liée à elle-même, car l'homme est une partie de la nature."
