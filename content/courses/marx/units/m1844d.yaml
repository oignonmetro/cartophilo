- id: m1844-p14
  title: "Vivre de la nature non organique"
  notes: |-
    **Marx passe de la définition à la vie concrète de l'espèce : comme tout animal, l'homme vit de ce qui n'est pas vivant en lui, la nature qui l'entoure ; mais il en vit {coral}plus largement que l'animal, à la mesure de son universalité{/coral}.** L'universalité de l'homme n'est pas d'abord une affaire de pensée : c'est l'étendue de son rapport à la nature.

    **Pourquoi « aussi bien chez l'homme que chez l'animal » ?** L'animal a lui aussi une vie générique : {amber}la différence ne sera pas de nature, mais d'étendue{/amber}. Marx part de ce que l'homme partage avec tout vivant, pour situer ensuite ce qui le distingue.

    **Pourquoi « d'abord, au point de vue physique » ?** *Physisch einmal* : le premier aspect, {amber}le plus élémentaire{/amber}. L'esprit viendra ensuite, comme une autre manière de vivre de la même nature.

    ? **Nature non organique** (*unorganische Natur*) : non pas {red}la nature minérale ou sans vie{/red}, au sens de la chimie, mais {green}tout ce qui n'est pas un organe du corps vivant{/green}, tout ce qui est hors de lui et dont il vit. Les plantes et le gibier dont l'homme se nourrit sont des vivants, mais non ses organes : ils sont, pour lui, nature non organique.

    **Pourquoi « plus… plus » ?** La proportion, cette fois, est {green}directe, et positive{/green}, à l'inverse de toutes celles du passage : {coral}plus l'homme est universel, plus est universel le champ dont il vit{/coral}. {yellow}La vache broute l'herbe de son pré ; l'homme mange le blé des plaines et le poisson des mers, se chauffe au charbon et s'éclaire à l'huile de baleine.{/yellow}

    **Pourquoi l'universalité se mesurerait-elle à l'étendue de la nature dont on vit ?** C'est la prémisse implicite du paragraphe : {amber}un vivant se définit par ses objets{/amber}, par ce à quoi il se rapporte pour vivre. L'abeille est ce qu'elle est par les fleurs dont elle vit, l'homme par la nature entière. Dire que l'homme est universel et dire qu'il vit de toute la nature, {coral}c'est dire la même chose sous deux angles{/coral}. C'est une thèse de Feuerbach, que Marx radicalise : l'objet d'un être est son essence devenue objective ; le troisième manuscrit dira : {teal}« un être qui n'a pas sa nature en dehors de lui n'est pas un être naturel »{/teal}.

    **Ce qui fait ici l'universalité n'est plus la conscience**, comme chez Feuerbach, mais {amber}l'étendue de nature dont on vit{/amber} : aucun animal ne se nourrit d'autant d'espèces, terrestres, aquatiques ou volantes.

    ! L'homme n'est pas universel {red}malgré{/red} sa dépendance à la nature : il l'est {green}par{/green} elle, par l'étendue de ce dont il dépend.
