id: m1844d
title: "L'être générique renversé (1844)"
subtitle: "Manuscrits de 1844, premier manuscrit, « Le travail aliéné », 4 / 5"
group: "Le travail aliéné (Manuscrits de 1844)"
icon: page
color: coral
intro: |-
  La troisième détermination du travail aliéné : l'homme est un être générique, qui vit de la nature comme de son corps non organique et fait de son activité vitale l'objet de sa conscience ; le travail aliéné renverse ce rapport et fait de la vie générique le moyen de la vie individuelle.
lessons:
- id: m1844d-i1
  title: "Où en est l'argument : la troisième détermination"
  notes: |-
    **De l'aliénation du produit et de celle de l'activité, Marx tire une troisième détermination : le travail aliéné rend l'homme étranger à son espèce.**

    Pour la tirer, il doit dire ce qu'est l'homme, que les textes précédents supposaient (son « essence », ses « fonctions proprement humaines »).

    **Sa question :** qu'est-ce que l'homme, pour que le travail aliéné puisse lui rendre étrangère son espèce elle-même ? **Sa thèse :** l'homme est {violet}un être générique{/violet}, qui fait de toutes les espèces son objet, vit de la nature entière comme de {violet}son corps non organique{/violet} et {amber}a{/amber} son activité vitale au lieu de l'être ; c'est en lui rendant étrangères la nature et son activité que le travail aliéné lui rend étrangère son espèce, en faisant {coral}de la vie générique un moyen de la vie individuelle{/coral}, et il le peut {coral}parce que l'homme est conscient{/coral}. **Sa difficulté :** comment la conscience, qui fait de l'homme un être libre, peut-elle être aussi ce qui lui permet de réduire son activité à un moyen de survivre ?

    Trois mouvements : ce qu'est l'homme (§1, §2), le travail aliéné rend l'espèce étrangère (§3), la première preuve (§4).

    ? **Être générique** : *Gattungswesen*, mot de Feuerbach ; un être qui ne fait pas seulement partie d'une espèce, mais {amber}se rapporte à elle{/amber}, et agit en chacun de ses actes en membre de l'espèce. Chez Marx, ce rapport est d'abord {green}pratique{/green} : il passe par la production.

    **D'où vient le mot.** Chez Feuerbach (*L'Essence du christianisme*), la conscience au sens strict n'existe que là où un être a pour objet {violet}son genre{/violet} : l'animal a le {amber}sentiment de soi{/amber}, il est objet pour lui-même comme individu, non comme genre ; la conscience est science, et il n'y a de science que du général. Marx avait d'abord employé le mot contre l'État : dans *Sur la question juive*, là où il est « considéré comme un être générique », l'homme est {teal}« le membre imaginaire d'une souveraineté illusoire »{/teal}, empli d'une universalité irréelle. En 1844, il le ramène {green}de l'État et de la science à la production{/green}.

    **Un mot bientôt abandonné.** Dès 1845, la sixième des *Thèses sur Feuerbach* reproche au genre feuerbachien d'être une {red}« universalité interne, muette »{/red}, liant naturellement les individus : l'essence humaine sera « l'ensemble des rapports sociaux ». Le mot disparaît, le contenu demeure (travail conscient, rapport universel à la nature), sous le nom de {violet}métabolisme{/violet}.
