lessons:
- id: g-animal-homme-l1
  title: Animal / homme
  notes: |-
    Chez Marx, la différence de l'{violet}**animal**{/violet} et de l'{violet}**homme**{/violet} est [def]. Ce n'est {pink}ni une coupure entre la nature et l'esprit, ni une essence humaine fixée une fois pour toutes{/pink}. Le critère se déplace d'une œuvre à l'autre, et c'est ce déplacement qu'il faut savoir dire. Ce que l'animal produit et ce qui lui manque est traité à [[g-vie-animale|vie animale]] ; ici, la question est ce qui fait la différence, et si elle est acquise.

    __**L'homme reste un animal : la différence passe à l'intérieur de la**__ {violet}__**nature**__{/violet}__**.**__ Marx ne commence pas par opposer l'homme à l'animal, parce que l'homme est d'abord un vivant de chair : en tant qu'être naturel, {teal}« {/teal}en chair et en os, sensible, objectif, il est un être souffrant, dépendant et borné, {teal}__tout comme le sont aussi l'animal et la plante__ »{/teal} (*Manuscrits de 1844*, troisième manuscrit, critique de la dialectique hégélienne ; voir [[g-etre-naturel|être naturel]]). Son travail même est un échange avec la nature, dans lequel {teal}« {/teal}il se présente lui-même face à la matière naturelle {teal}__comme une puissance naturelle__ »{/teal} (*Le Capital*, livre I, chap. V ; voir [[g-metabolisme|métabolisme]]). La différence ne peut donc pas être celle d'un esprit qui viendrait s'ajouter à un corps : elle est une manière d'être naturel. C'est pourquoi *L'Idéologie allemande* part du corps : {teal}« {/teal}Le premier état de fait à constater est donc {teal}__la complexion corporelle de ces individus__{/teal} et les rapports qu'elle leur crée avec le reste de la nature{teal} »{/teal} (*L'Idéologie allemande*, I). {coral}Marx cherche la différence dans ce que fait un vivant naturel, non dans ce qui l'arracherait à la nature.{/coral}

    __**Le critère se déplace de la**__ {violet}__**conscience**__{/violet}__**, en 1844, à la**__ {violet}__**production**__{/violet}__**, en 1845.**__ En 1844, la différence tient à un écart entre le vivant et ce qu'il fait : {teal}« {/teal}{teal}__L'animal se confond immédiatement avec son activité vitale__{/teal}. Il ne se distingue pas d'elle. Il est cette activité. L'homme fait de son activité vitale elle-même {teal}__l'objet de sa volonté et de sa conscience__ »{/teal} (*Manuscrits de 1844*, premier manuscrit, travail aliéné ; voir [[g-activite-vitale|activité vitale]]). En 1845, Marx tient ce critère pour insuffisant, parce qu'une conscience prise à part peut servir à tout distinguer, sans rien expliquer : {teal}« {/teal}On peut distinguer les hommes des animaux par la conscience, par la religion et par tout ce que l'on voudra. Eux-mêmes {teal}__commencent à se distinguer des animaux dès qu'ils commencent à produire leurs moyens d'existence__{/teal}, pas en avant qui est {teal}__la conséquence même de leur organisation corporelle__ »{/teal} (*L'Idéologie allemande*, I). « Eux-mêmes » oppose ce que font les hommes à ce qu'on dit d'eux. Pourquoi la production, puisque l'animal produit aussi ? Parce qu'il s'agit ici des **moyens d'existence** : l'animal prend dans la nature ce qui le fait vivre, ou se construit un nid, alors que l'homme produit les moyens qui produisent sa vie, si bien qu'{teal}« {/teal}en produisant leurs moyens d'existence, {teal}__les hommes produisent indirectement leur vie matérielle elle-même__ »{/teal} (*ibid*. ; voir [[g-vie-materielle|vie matérielle]]). Et ce pas en avant prolonge l'organisation du corps au lieu de s'y ajouter du dehors. La conscience n'est pas abandonnée pour autant, mais elle vient après : {teal}« {/teal}{teal}__la conscience ne peut jamais être autre chose que l'être conscient__ »{/teal} (*ibid*.). {coral}La conscience n'est plus la cause de la différence, elle en est l'effet.{/coral}

    __**Dans Le Capital, l'homme se distingue par un travail qui conçoit sa**__ {violet}__**fin**__{/violet} __**et fabrique ses**__ {violet}__**outils**__{/violet}__**.**__ La fin d'abord : {teal}« {/teal}Le résultat auquel aboutit le processus de travail {teal}__était déjà au commencement dans l'imagination du travailleur__{/teal}, existait donc déjà en idée{teal} »{/teal} (*Le Capital*, livre I, chap. V ; l'abeille et l'architecte sont à [[g-activite-vitale|activité vitale]]). L'outil ensuite : {teal}« {/teal}Le moyen de travail est {teal}__une chose ou un complexe de choses que le travailleur insère entre son objet de travail et lui__{/teal}, et qui lui servent de guide dans son action sur cet objet{teal} »{/teal} (*ibid*.). Les deux vont ensemble, parce que réaliser une fin qu'on s'est donnée demande des organes que le corps ne fournit pas : {teal}« {/teal}Ainsi l'élément naturel devient-il lui-même un organe de son activité, {teal}__un organe qu'il ajoute à ceux de son propre corps__{/teal} et qui prolonge sa conformation naturelle{teal} »{/teal} (*ibid*. ; voir [[g-corps-non-organique|corps non-organique]]). La continuité demeure : ces moyens, {teal}« {/teal}{teal}__bien qu'en germe ils soient déjà le propre de certaines espèces animales__{/teal}, caractérisent spécifiquement le processus de travail humain{teal} »{/teal} (*ibid*.). Mais un outil détaché du corps se garde, se transmet et se perfectionne ; c'est donc par ses moyens de travail qu'une époque se reconnaît : {teal}« {/teal}Les vestiges d'anciens moyens de travail ont pour l'étude des formations sociales économiques disparues {yellow}__la même importance que la structure des ossements fossiles__{/yellow} pour la connaissance de l'organisation des lignées animales disparues. {teal}__Ce qui distingue les époques économiques entre elles, ce n'est pas ce que l'on y fabrique, mais la manière dont on fabrique__{/teal}, les moyens de travail dont on se sert{teal} »{/teal} (*ibid*.). Terme à terme, l'outil est à l'histoire des sociétés ce que le squelette est à l'histoire des espèces. {coral}Parce qu'il fabrique ses organes, l'homme a une histoire, qui se lit dans ses outils.{/coral}

    __**La différence n'est pas**__ {red}__**acquise**__{/red} __**: l'homme naît animal de troupeau, et la société peut le ramener à l'animalité.**__ L'individu humain n'est pas donné au départ, parce qu'il ne se détache de son groupe qu'à mesure que se développent les échanges : {teal}« {/teal}{teal}__L'homme commence seulement à s'individualiser par le procès historique__{/teal}. Il apparaît à l'origine comme être générique, être tribal, {teal}__animal de troupeau__{/teal} – mais nullement comme ζῷον πολιτικόν au sens politique{teal} »{/teal} (*Grundrisse*, chapitre du capital, cité par {sky}Fischbach{/sky}). Contre {sky}Aristote{/sky}, l'homme ne naît donc pas animal politique : il le devient. Inversement, une forme sociale peut faire régresser l'homme vers l'animal. En 1843, Marx le dit de l'ordre féodal des *états* (*Stände*), où chacun est ce que sa naissance et son rang le font être : {teal}« {/teal}L'état ne se contente pas de s'appuyer sur la séparation de la société en tant que loi dominante, il sépare l'être humain de son essence universelle, {teal}__il fait de lui un animal qui coïncide immédiatement avec sa déterminité__{/teal}. {red}__Le Moyen Âge est l'histoire animalière de l'humanité, sa zoologie__{/red}{teal} »{/teal} (*Contribution à la critique de la philosophie hégélienne du droit*, sur le § 303). *Coïncider immédiatement* avec ce qu'on est, c'est précisément ce que 1844 dira de l'animal, qui se confond avec son activité vitale. En 1844, c'est le travail aliéné qui produit la même régression : l'ouvrier ne se sent libre que dans ses fonctions animales (voir [[g-travail-aliene|travail aliéné]]). {amber}« Animal » ne nomme donc pas d'abord une espèce, mais une manière d'exister sans écart avec sa détermination{/amber}, que ce soit son groupe, son état ou ses fonctions physiques. {coral}C'est une forme sociale, non la nature, qui produit cette coïncidence.{/coral}

    ! Marx ne méprise pas l'animal et ne coupe pas l'homme de la nature : la différence se fait dans un corps naturel, et l'homme reste « dépendant et borné », comme l'animal et la plante.

    ! Le critère de 1845 ne supprime pas la conscience : il en fait l'effet de la production, non sa cause.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | *Contribution à la critique de la philosophie hégélienne du droit*, sur le § 303 | l'état féodal fait de l'homme un animal ; le Moyen Âge, zoologie de l'humanité |
    | *Manuscrits de 1844*, premier manuscrit | l'homme fait de son activité vitale l'objet de sa conscience |
    | *L'Idéologie allemande*, I | les hommes se distinguent dès qu'ils produisent leurs moyens d'existence |
    | *Grundrisse*, chapitre du capital | l'homme naît animal de troupeau et s'individualise par l'histoire |
    | *Le Capital*, livre I, chap. V | la fin conçue d'avance et l'outil ; les époques distinguées par leurs moyens de travail |

    **Voir aussi** : [[g-vie-animale|Vie animale]] · [[g-activite-vitale|Activité vitale]] · [[g-etre-naturel|Être naturel]] · [[g-corps-non-organique|Corps non-organique]] · [[g-vie-materielle|Vie matérielle]] · [[g-travail-aliene|Travail aliéné]] · [[g-etre-generique|Être générique]]
