# Entrée du glossaire de Marx (skill glossaire-marx) : notion, entrée générale
# sur la vie (elle absorbe « vie comme activité »). Citations reprises de
# NotebookLM avec leur source. De seconde main, le texte manquant au notebook :
# L'Idéologie allemande (Collin, Comprendre Marx ; Fischbach, La production des
# hommes) ; Le Capital, livre III (Collin ; Ducange, Marx de A à Z). Travail
# salarié et capital : Œuvres I, sauf « à table, à l'auberge, au lit » (Ducange).

id: g-activite-vitale
title: Activité vitale (`Lebenstätigkeit`)
icon: book
color: coral
lessons:
- id: g-activite-vitale-l1
  title: Activité vitale
  notes: |-
    Chez Marx, l'{violet}**activité vitale**{/violet} ({violet}*Lebenstätigkeit*{/violet}) est [def]. Elle n'est {pink}ni une simple fonction de conservation biologique ni le travail salarié{/pink}, qui en est la mutilation. Le concept porte la critique de Marx : sans lui, le {red}capitalisme{/red} ne serait qu'une répartition injuste ; avec lui, il {red}atteint la vie même{/red} de celui qui travaille.

    __**La vie est**__ {violet}__**activité**__{/violet}__**, et non une substance ou un état.**__ Marx le pose en incise, au moment de décrire {yellow}ce que perd l'ouvrier{/yellow} : {teal}« {/teal}l'énergie physique et intellectuelle propre de l'ouvrier, sa vie personnelle – __car__ {teal}__qu'est-ce que la vie sinon l'activité__{/teal} – qui est activité dirigée contre lui-même{teal} »{/teal} (*Manuscrits de 1844*, premier manuscrit, Le travail aliéné). La raison en est qu'{amber}un vivant ne subsiste pas comme une chose déjà là{/amber} : {teal}« {/teal}la nature est son corps avec lequel il doit {teal}__maintenir un processus constant pour ne pas mourir__ »{/teal} (*ibid*.). Si le processus s'arrête, le vivant meurt ; {coral}vivre n'est donc pas un état qu'on possède, mais ce qu'on ne cesse de faire{/coral}. Marx trouve cette idée chez {sky}Moses Hess{/sky}, pour qui la __vie__ est l'__échange d'activités vitales productives__. D'où la portée de l'incise : {coral}**perdre la maîtrise de son activité, c'est perdre sa vie**{/coral}, et non seulement une part de son revenu.

    __**L'homme se distingue de l'animal parce qu'il fait de son**__ {violet}__**activité vitale**__{/violet} __**l'objet de sa conscience.**__ L'animal a lui aussi une activité vitale, et il produit ; mais {teal}« l'animal s'identifie directement avec son activité vitale{/teal}. Il ne se distingue pas d'elle. __Il__ {teal}__est cette activité__ »{/teal} (premier manuscrit). Au contraire, {teal}« l'homme{/teal} fait de son activité vitale elle-même {teal}__l'objet de sa volonté et de sa conscience__ »{/teal}, et {teal}« {/teal}c'est pour cela seulement que {teal}son activité{/teal} est activité {teal}libre »{/teal} (*ibid*.). Pourquoi la conscience rend-elle libre ? Parce que {amber}**ce dont je me distingue, je peux le vouloir ou le changer**{/amber}, alors que {pink}je ne peux rien décider de ce que je suis sans écart{/pink}.

    Il en résulte que {teal}« __l'animal__{/teal} ne produit que {teal}sous l'empire du besoin physique immédiat{/teal}, tandis que {teal}__l'homme__{/teal} {teal}produit même libéré du besoin physique »{/teal} (*ibid*.). {yellow}L'exemple de l'abeille{/yellow} le montre, plus tard, sur le travail : {teal}« {/teal}ce qui distingue dès l'abord {teal}le plus mauvais architecte{/teal} de l'abeille la plus experte, c'est qu'{teal}il a __construit la cellule dans sa tête__ avant{/teal} de la construire dans la ruche{teal} »{/teal} (*Le Capital*, livre I, 3e section, chap. VII). L'abeille fait mieux, mais sans fin qu'elle se soit donnée ; l'architecte fait moins bien, mais il exécute ce qu'il a d'abord conçu. __Être conscient de son activité__ n'est donc pas l'observer : c'est {green}en fixer la fin{/green}.

    __**L'activité vitale est une**__ {green}__**activité objective**__{/green}__**, ni**__ {red}__**pure**__{/red} __**ni**__ {red}__**contemplative.**__{/red} Une activité libre n'est pas une activité sans objet, car {coral}l'homme est un être naturel{/coral}, qui {coral}dépend de ce sur quoi il agit{/coral} : {teal}« {/teal}l'être objectif agit d'une manière objective{teal} »{/teal} et {teal}« {/teal}il ne crée, il ne pose que des objets, __parce qu'__{teal}__il est posé lui-même par des objets__{/teal}{teal} »{/teal} (troisième manuscrit, Critique de la dialectique de Hegel). Marx en tire deux refus :
    - Contre l'{red}activité pure{/red} : {sky}Karl Grün{/sky} et {red}le socialisme vrai{/red} veulent {red}une liberté qui ne doive rien à ses objets{/red}. Marx raille cette {teal}« {/teal}activité pure, absolue{teal} »{/teal} qui serait {teal}« {/teal}fortement salie quand elle a __un substrat et un résultat matériels__{teal} »{/teal} (*L'Idéologie allemande*, partie III, Le socialisme vrai) : sans substrat ni résultat, il n'y a simplement plus d'activité.
    - Contre la {red}contemplation{/red} : {sky}Feuerbach{/sky} part bien du monde sensible, mais comme d'un spectacle. Son défaut est que {teal}« {/teal}{teal}l'objet, la réalité, le monde sensible{/teal} n'y sont saisis que sous la forme d'objet ou d'intuition, mais non __en tant qu'__{teal}__activité humaine concrète__{/teal}__, en tant que__ {teal}__pratique__{/teal}{teal} »{/teal} (*Thèses sur Feuerbach*, thèse 1).

    C'est donc {amber}en transformant le monde que l'homme atteste ce qu'il est{/amber} : {teal}« {/teal}c'est précisément dans le fait d'{teal}__élaborer le monde objectif__{/teal} que l'homme commence donc à faire réellement ses preuves d'être générique{teal} »{/teal} (premier manuscrit).

    __**Les**__ {violet}__**individus**__{/violet} __**sont ce que sont leurs manières de**__ {violet}__**manifester leur vie**__{/violet}__**.**__ Si vivre, c'est agir, être tel vivant, c'est agir de telle façon : il ne reste pas, derrière l'activité, un homme déjà fait qui s'y livrerait. La {amber}production{/amber} n'est donc pas seulement ce qui entretient la survie ; il s'agit {teal}« {/teal}d'une manière déterminée de manifester leur vie, __d'__{teal}__un certain mode de vie__ »{/teal}, et {teal}« {/teal}ainsi {teal}les individus manifestent{/teal}-ils {teal}leur vie{/teal}, ainsi sont-ils{teal} »{/teal} (*L'Idéologie allemande*, partie I, Feuerbach). Marx précise : {teal}« {/teal}ce qu'ils sont {teal}coïncide{/teal} donc {teal}avec leur production{/teal}, avec ce qu'ils produisent aussi bien qu'avec la façon dont ils le produisent{teal} »{/teal} (*ibid*.). Comme cette {teal}activité{/teal} se mène toujours {teal}avec d'autres{/teal}, __l'essence de l'homme__ n'est pas en chacun : « elle est dans sa réalité __l'ensemble des relations sociales__ » (*Thèses sur Feuerbach*, thèse 6).

    __**Sous le salariat, l'activité vitale est**__ {red}__**vendue**__{/red} __**et devient un**__ {red}__**moyen de vivre**__{/red}__**.**__ Le {violet}travail{/violet} reste {teal}« l'activité vitale propre à l'ouvrier, sa façon à lui de manifester sa vie »{/teal} (*Travail salarié et capital*, section I). Or, privé des moyens de production, l'ouvrier n'a rien d'autre à vendre : {teal}« {/teal}c'est cette activité vitale qu'il __vend à un tiers__ pour s'assurer les moyens de subsistance nécessaires{teal} »{/teal} (*ibid*.). Donc {amber}ce qui devrait être sa vie n'en est plus que la condition{/amber} : {teal}« {/teal}son activité vitale n'est donc pour lui qu'__un moyen de pouvoir exister__. Il travaille pour vivre. Pour lui-même, le travail n'est pas une partie de sa vie, il est plutôt {teal}__un sacrifice de sa vie__ »{/teal} (*ibid*.). Et sa vie passe ailleurs : {teal}« la vie commence pour lui où cesse l'activité{/teal}, à table, à l'auberge, au lit{teal} »{/teal} (*ibid*.). Le mot « vie » change ainsi de sens : ce qui reste à l'ouvrier, hors du travail, ce sont les fonctions qu'il partage avec l'animal, si bien que {teal}« {/teal}{red}le bestial devient l'humain et l'humain devient le bestial{/red}{teal} »{/teal} (*Manuscrits de 1844*, premier manuscrit).

    __**Dans *Le Capital*, la liberté se déplace au-delà du**__ {violet}__**travail nécessaire**__{/violet}__**.**__ Car le {amber}travail{/amber}, quelle que soit la société, reste {teal}« {/teal}une {teal}nécessité éternelle{/teal}, le {teal}médiateur des échanges organiques entre la nature et l'homme »{/teal} (*Le Capital*, livre I, 1re section, chap. I). Ce qu'aucune société ne peut supprimer ne peut devenir pure liberté : là, {teal}« {/teal}la {teal}seule liberté possible{/teal} est que {teal}l'homme social{/teal}, les producteurs associés {teal}__règlent rationnellement__ leurs échanges avec la nature »{/teal} (livre III). Donc {teal}« {/teal}c'est __au-delà__ que commence le développement des forces humaines comme fin en soi{teal} »{/teal}, et {teal}« {/teal}la réduction de la journée de travail est la condition fondamentale de cette libération{teal} »{/teal} (*ibid*.). La thèse ne referme pourtant pas la question : en 1875, Marx annonce encore le temps où le travail {teal}« {/teal}ne sera pas seulement un moyen de vivre, mais sera devenu {coral}le premier besoin de la vie{/coral}{teal} »{/teal} (*Critique du programme de Gotha*, I). Denis Collin y voit une réminiscence de 1844, en tension avec le *Capital*. Ce qui ne varie pas, c'est le refus d'une vie réduite à un moyen de vivre.

    ! Activité vitale n'est pas un mot du seul jeune Marx : il revient en 1849 dans *Travail salarié et capital*. Ce qui change ensuite, c'est le lieu de la liberté, non l'idée que vivre, c'est agir.

    ! « Mode de vie » ne désigne pas ici des habitudes ou un niveau de consommation, mais la manière dont des individus produisent, et par laquelle ils sont ce qu'ils sont.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | *Manuscrits de 1844*, premier manuscrit | la vie est activité, et l'homme fait de la sienne un objet |
    | *Manuscrits de 1844*, troisième manuscrit | l'être objectif n'agit que sur des objets |
    | *Thèses sur Feuerbach*, thèse 1 | le sensible saisi comme pratique, non comme intuition |
    | *L'Idéologie allemande*, partie I | les individus sont leur manière de manifester leur vie |
    | *Travail salarié et capital*, section I | l'activité vitale vendue, simple moyen d'exister |
    | *Le Capital*, livre I, chap. VII | l'architecte et l'abeille : la fin conçue d'abord |
    | *Le Capital*, livre III | la liberté au-delà du royaume de la nécessité |
    | *Critique du programme de Gotha*, I | le travail devenu premier besoin de la vie |
