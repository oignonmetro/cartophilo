- id: n1843-i2
  title: "Les deux partis jeunes-hégéliens et leurs positions"
  notes: |-
    **Marx parle ici de son propre camp** : les {violet}jeunes-hégéliens{/violet}, dont il fait partie, se partagent en {violet}deux partis{/violet}, le {violet}parti politique pratique{/violet} et le {violet}parti politique théorique{/violet}. Marx ne nomme personne (les identifications sont celles de {sky}Fischbach{/sky}, qui les donne avec prudence (« certainement », « sans doute »)).

    | Parti | Représentants, selon Fischbach | Ce qu'il veut | Ce que lui reproche Marx |
    | le parti politique pratique | Bakounine, Edgar Bauer, Ruge, sans doute Engels | abandonner la théorie pour la pratique politique, donc nier la philosophie | croire la nier en lui tournant le dos |
    | le parti politique théorique | Bruno Bauer, sans doute surtout Feuerbach | partir de la philosophie et la réaliser par la pratique politique | croire l'effectuer sans la supprimer |

    **Ce que chaque parti soutient, d'après Marx et Fischbach.** Le {violet}parti pratique{/violet} demande {amber}la négation de la philosophie{/amber} (§23) : il veut {amber}se raccrocher à des germes de vie effectifs{/amber} plutôt qu'à des idées, et tient la philosophie pour {red}étrangère à la réalité allemande{/red}, voire {red}« en dessous de la pratique allemande et des théories qui la servent »{/red}. Selon {sky}Fischbach{/sky}, ses membres veulent passer de la théorie à {amber}une pratique politique orientée vers la démocratie et le socialisme{/amber}, que les autorités jugent subversive. Le {violet}parti théorique{/violet} part de la philosophie : il voit dans le combat présent {amber}la lutte critique de la philosophie contre le monde allemand{/amber} (§25), maintient selon Fischbach {amber}le primat de la théorie sur la pratique{/amber}, et pose qu'il revient à la pratique politique de {amber}réaliser la théorie{/amber}, c'est-à-dire de la rendre réelle.

    **Quels arguments peuvent soutenir ces positions ?** Marx ne cite aucun texte de ces deux partis et n'expose pas leurs arguments : il promet seulement une description plus détaillée du parti théorique (§25). Ce qui suit est une reconstruction, extérieure au texte, à partir de ce qu'il en dit et de ce que Fischbach en rapporte. Le parti pratique peut dire que {amber}la philosophie hégélienne est spéculative et abstraite{/amber}, et qu'elle n'a rien changé à l'Allemagne (censure, absolutisme) ; que ce qui manque est {amber}une action politique{/amber} que les idées ne produisent pas ; et que s'attarder en théorie, c'est se détourner des problèmes réels. Le parti théorique peut dire que {amber}les maux de l'Allemagne tiennent d'abord à des illusions{/amber}, religieuses et spéculatives, que seule la critique dissout ; que {amber}la philosophie contient déjà les principes{/amber} auxquels la réalité doit se conformer ; et qu'une pratique que la théorie ne guiderait pas serait aveugle.

    Le cœur de la difficulté est que, pour Marx, {coral}en Allemagne, la philosophie est la réalité historique du pays{/coral}, plus que sa politique ou son économie.

    **Pourquoi la philosophie fait-elle partie de la réalité allemande ?** Parce que, pour Marx, les Allemands ont réalisé depuis Kant plus de choses dans la philosophie que sous d'autres formes : ils n'ont pas fait de révolution et leur pratique politique est beaucoup moins intense que celle des Français, comme leur pratique économique et industrielle l'est moins que celle des Anglais.

    ! Marx ne reproche pas au parti pratique de vouloir nier la philosophie, ni au parti théorique de vouloir l'effectuer : __il leur reproche de croire qu'on peut faire l'un sans l'autre__.
