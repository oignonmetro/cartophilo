- id: n1843-p4
  title: "Critiquer la philosophie du droit, c'est analyser l'État moderne"
  notes: |-
    **La critique de la philosophie allemande de l'État et du droit, dont {sky}Hegel{/sky} a donné « la version ultime, la plus conséquente et la plus riche », a {coral}deux faces à la fois{/coral}** : elle est {amber}l'analyse critique de l'État moderne{/amber} et {amber}la négation résolue de toute l'ancienne conscience politique et juridique allemande{/amber}, dont la {violet}philosophie spéculative du droit{/violet} est l'expression la plus élevée, « jusqu'à la science ». C'est ce qui justifie, d'après les paragraphes précédents, de la critiquer : en critiquant la pensée allemande de l'État, on critique l'État moderne lui-même.

    **Pourquoi la philosophie allemande peut-elle dire quelque chose de l'État moderne ?** Parce que le rapport est réciproque. {coral}La philosophie spéculative du droit n'était possible qu'en Allemagne{/coral}, où l'État moderne n'existe encore que comme {yellow}un au-delà{/yellow}, {teal}« même si cet au-delà ne se trouve qu'au-delà du Rhin »{/teal} : on le pense abstraitement faute de le vivre. Mais {coral}inversement{/coral}, cette image qui {red}fait abstraction de l'être humain effectif{/red} n'est possible que {amber}parce que l'État moderne lui-même fait abstraction de l'homme effectif{/amber}, ou ne le satisfait {red}que sur un mode imaginaire{/red}. L'abstraction de la pensée allemande n'est donc pas une erreur étrangère à son objet : elle en exprime la nature.

    **D'où la conclusion : les Allemands ont {coral}pensé ce que les autres peuples ont fait{/coral}, et l'Allemagne a été leur {violet}conscience théorique{/violet}.** Deux statu quo s'expriment, qu'il ne faut pas confondre :

    | | Ce qu'il exprime | L'image de Marx |
    | le status quo de l'État allemand | l'ancien régime dans sa perfection | le pal planté dans la chair de l'État moderne |
    | le status quo de la science allemande de l'État | l'imperfection de l'État moderne | la défectuosité de sa chair elle-même |

    L'État allemand, c'est l'ancien régime à son achèvement, qui est le défaut caché de l'État moderne ; la science allemande de l'État, elle, **révèle ce que l'État moderne a d'inachevé**.

    **Deux images à comprendre.** Un {violet}pal{/violet} est un pieu qu'on plante dans le corps : l'État allemand, Ancien régime à son comble, est comme un pieu enfoncé dans la chair de l'État moderne, un morceau de passé qui le blesse. Et l'État moderne qui ne satisfait l'homme que « sur un mode imaginaire » ne le satisfait qu'en idée, dans une figure abstraite, et non dans sa vie réelle : c'est pourquoi la pensée abstraite de l'État qu'est la philosophie du droit est fidèle à son objet.

    ! La philosophie du droit ne manque pas son objet en étant abstraite : elle l'exprime exactement, parce que l'État moderne lui-même fait abstraction de l'homme effectif.
  passage:
    label: "§26"
    text: "La critique de la *philosophie allemande de l'État et du droit*, dont *Hegel* a proposé la version ultime, la plus conséquente et la plus riche, est les deux à la fois : aussi bien l'analyse critique de l'État moderne et de l'effectivité qui lui est connectée, que la négation résolue de toute l'ancienne *modalité* de la *conscience politique et juridique allemande*, dont l'expression la plus éminente, la plus universelle, celle qui s'est élevée jusqu'à la *science*, est justement la *philosophie spéculative du droit* elle-même. Si la philosophie spéculative du droit, cette *pensée* débordante et abstraite de l'État moderne, dont l'effectivité demeure un au-delà – même si cet au-delà ne se trouve qu'au-delà du Rhin –, n'était possible qu'en Allemagne, à l'inverse, l'image intellectuelle que les *Allemands* ont de l'État moderne, image qui fait abstraction de l'être humain effectif, était elle aussi possible seulement parce que et dans la mesure où l'État moderne lui-même fait abstraction de l'*homme effectif* ou ne satisfait l'homme *pris dans sa totalité* que sur un mode *imaginaire*. En politique, les Allemands ont *pensé* ce que les autres peuples ont *fait*. L'Allemagne était leur *conscience théorique*. L'abstraction et l'arrogance de sa pensée sont toujours allées de pair avec l'unilatéralité et la médiocrité de son effectivité. Si le *status quo* de l'État *allemand* exprime l'*Ancien régime dans sa perfection*, la perfection du pal planté dans la chair de l'État moderne, le *status quo* de la *science allemande de l'État* exprime l'*imperfection de l'État moderne*, la défectuosité de sa chair elle-même."
