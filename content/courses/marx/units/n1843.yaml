- id: n1843-p3
  title: "Le parti théorique croit effectuer la philosophie sans la supprimer"
  notes: |-
    **Le parti théorique commet {coral}la même erreur{/coral} que le parti pratique, {coral}à partir de facteurs inverses{/coral} : il croit pouvoir {amber}effectuer la philosophie sans la supprimer{/amber}.** Les deux partis se répondent terme à terme :

    | | Parti politique pratique | Parti politique théorique |
    | Point de départ | la pratique politique | la philosophie |
    | Ce qu'il demande | la négation de la philosophie | la réalisation de la philosophie |
    | Son erreur | nier la philosophie sans l'effectuer | l'effectuer sans la supprimer |
    | Ce qu'il oublie | que la philosophie fait partie de la réalité allemande | que la philosophie passée fait partie du monde qu'il combat |

    **Il lutte** {violet}**contre le monde allemand**{/violet} **avec une arme qui en fait partie.** Il n'a vu que {red}« la lutte critique de la philosophie contre le monde allemand »{/red}, sans penser que la philosophie passée « faisait elle-même partie de ce monde » et en était {coral}le complément, fût-il idéel{/coral}. Si c'est par sa philosophie, et non par ses institutions, que l'Allemagne est la contemporaine de la France et de l'Angleterre, on ne peut pas dépasser cette réalité avec ce qui en est l'incarnation suprême. Pour {amber}en finir avec l'État allemand{/amber}, il faut donc aussi {amber}en finir avec la philosophie qui le pense{/amber}, la {yellow}philosophie hégélienne du droit et de l'État{/yellow}.

    **Ce parti est** {red}**critique envers son adversaire**{/red} **mais** {red}**acritique envers lui-même**{/red}**.** Parti des présuppositions de la philosophie, il en prend les résultats tels quels, ou bien il {amber}donne pour des résultats immédiats de la philosophie{/amber} des exigences {red}puisées ailleurs{/red}. Or ces exigences, à les supposer légitimes, {coral}ne s'obtiennent que par la négation de la philosophie passée, de la philosophie en tant que philosophie{/coral}. Marx se réserve une description plus détaillée de ce parti, que d'autres textes développeront.

    ! Réaliser la philosophie n'est pas la prendre telle qu'elle est pour l'appliquer : cela exige de la nier en tant que philosophie.
  passage:
    label: "§24-25"
    text: |-
      Le parti politique *théorique*, qui trouve son origine dans la philosophie, a commis la même erreur, simplement à partir de facteurs *inverses*.

      Il n'a vu dans la lutte actuelle *que* la *lutte critique de la philosophie contre le monde allemand*, il n'a pas pensé que la *philosophie passée* faisait elle-même partie de ce monde et qu'elle en était le *complément*, fût-il idéel. Bien que critique envers sa contrepartie, il s'est comporté de manière acritique envers lui-même : il est parti des *présuppositions* de la philosophie et, ou bien il s'en est tenu aux résultats déjà donnés par la philosophie, ou bien il a fait passer pour des revendications et des résultats immédiats de la philosophie des revendications et des résultats qu'il avait puisés ailleurs ; alors que – leur légitimité étant présupposée – on ne peut au contraire les obtenir que par la *négation de la philosophie passée*, de la philosophie en tant que philosophie. Nous nous réservons la possibilité d'offrir de ce parti une description plus détaillée. Sa lacune fondamentale se réduit à ceci : *il a cru pouvoir effectuer la philosophie sans la supprimer*.
