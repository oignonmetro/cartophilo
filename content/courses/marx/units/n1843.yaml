- id: n1843-i1b
  title: "La situation allemande : un anachronisme à combattre"
  notes: |-
    **Que veut dire « nier la situation allemande » ?** La {violet}situation allemande{/violet}, ou {violet}*status quo*{/violet} allemand, est l'état politique de l'Allemagne en 1843, un régime d'Ancien régime avec sa censure et ses privilèges. La nier, c'est la {amber}critiquer négativement{/amber} : la refuser et demander qu'elle soit supprimée, comme le ferait une revendication de liberté ou de constitution. Marx dit que c'est la seule façon appropriée de prendre appui sur ce status quo, et que cela mène pourtant à {red}un anachronisme{/red}.

    **Pourquoi cette négation est-elle un anachronisme ?** Parce qu'elle a déjà été faite ailleurs : les peuples modernes ont déjà nié leur Ancien régime, et ce geste est devenu {amber}« un fait empoussiéré »{/amber} qui a rejoint {amber}« le débarras historique »{/amber} des peuples modernes, la remise où l'on range ce qui ne sert plus. Marx affirme que cela revient à {yellow}nier les perruques poudrées{/yellow}, qui laisse {yellow}des perruques sans poudre{/yellow}, c'est-à-dire __un régime toujours d'Ancien régime, simplement dépouillé de ses apparats__ : {teal}« je peux bien nier la situation allemande de 1843, si l'on suit la chronologie française, je me trouve tout juste en l'an 1789 »{/teal}. En niant son Ancien régime en 1843, l'Allemagne ne fait que ce que la France a fait en 1789 : elle a cinquante-quatre ans de retard, et reste {coral}« plus loin encore des feux brûlants de l'actualité »{/coral}, qui sont ailleurs.

    **Pourquoi la critiquer quand même ?** Parce que la situation allemande, bien qu'{red}en dessous du niveau de l'histoire{/red} et {red}en dessous de toute critique{/red} (elle n'est pas digne d'être discutée, puisque son esprit est déjà réfuté), {coral}reste un objet pour la critique{/coral}. Marx la compare à un criminel : {yellow}un criminel est en dessous du niveau de l'humanité{/yellow}, on ne discute pas avec lui, et pourtant il reste {yellow}un objet pour le bourreau{/yellow}, qui l'exécute. De même, on ne discute pas la situation allemande, on la combat.

    **La** {amber}**critique**{/amber} **comme arme et comme moyen.** Elle {red}n'est pas un instrument de dissection{/red}, qui sert à analyser et à comprendre un objet : elle n'a pas à le comprendre, puisqu'**elle est déjà au clair avec lui**, et elle ne veut pas le réfuter mais {coral}l'anéantir{/coral}. C'est {amber}une arme{/amber}. Et elle ne se donne plus {red}comme fin en soi{/red}, mais {amber}comme moyen{/amber}, un moyen pour trois choses : {coral}anéantir la situation allemande{/coral} ; {coral}ôter aux Allemands toute occasion de se faire des illusions{/coral}, en rendant l'oppression plus oppressante par la conscience qu'on en prend, et en leur apprenant à s'effrayer devant eux-mêmes pour leur donner du courage (§16) ; et {coral}déboucher sur la pratique{/coral}, comme le dira le §27.

    **Le retard allemand se voit aussi dans les problèmes modernes eux-mêmes** (§10, §17-19). Les Allemands ont {yellow}partagé les restaurations des peuples modernes sans partager leurs révolutions{/yellow}, et l'Ancien régime, qui a vécu sa tragédie chez les autres, leur joue en Allemagne sa {yellow}comédie{/yellow}. Le rapport entre l'industrie et le monde politique y apparaît sous la forme des barrières douanières : en France et en Angleterre, il s'agit d'{coral}abolir un monopole{/coral} qui a atteint ses ultimes conséquences, en Allemagne de {coral}le pousser jusqu'à ses ultimes conséquences{/coral}. Ce qu'on termine là-bas, on le commence ici.

    **Mais si l'Allemagne n'a pas d'actualité historique, elle en a une par sa philosophie** (§20-22).

    ! Marx ne dit pas que critiquer l'Allemagne est inutile : il dit que la nier ne suffit pas à rejoindre le présent, et que la critique doit être une arme, non un examen.
