# Unité de texte (voir content/textes.md) : Marx, « Contribution à la critique de
# la philosophie du droit de Hegel. Introduction » (1843), d'après la
# traduction de la GEME (Grande Édition Marx-Engels), Éditions sociales, 2018,
# p. 285-297 (PDF Cairn fourni par l'utilisateur) : celle que cite Fischbach
# (« al pari », « à raison », « survécu », « situation idéelle »). Les
# astérisques de l'édition (mots français de l'original) et les appels de note
# sont retirés. Les paragraphes §22 à §29 portent la discussion avec les
# partis jeunes-hégéliens, que commente Fischbach (conférence « Philosophies
# de Marx ») ; le début et la fin du texte vont en introduction et en ouverture.

id: n1843
title: "L'Introduction de 1843 : la philosophie et sa réalisation"
subtitle: "Contribution à la critique de la philosophie du droit de Hegel, Introduction, §22 à §29"
icon: page
color: coral
intro: |-
  Texte rédigé à Paris à la fin de 1843 pour les *Annales franco-allemandes*. Après avoir tenu pour acquise la critique de la religion, Marx s'en prend à la situation allemande, qui n'a d'actualité que par sa **philosophie**, et distingue **deux partis jeunes-hégéliens** : l'un veut nier la philosophie sans l'effectuer, l'autre la rendre effective sans la supprimer. Il conclut qu'on ne peut supprimer la philosophie sans la réaliser, et que la critique doit déboucher sur la pratique.
lessons:
- id: n1843-i1
  title: "Du ciel à la terre : la critique de la religion"
  notes: |-
    L'*Introduction* ouvre la *Contribution à la critique de la philosophie du droit de Hegel*. {sky}Marx{/sky} la rédige à Paris à la fin de 1843, pour l'unique numéro des *Annales franco-allemandes*, la revue qu'il fonde avec {sky}Ruge{/sky}. Elle fait suite au commentaire ligne à ligne que Marx avait écrit à Kreuznach, de mai à octobre 1843, des §261 à 313 des *Principes de la philosophie du droit* de {sky}Hegel{/sky}.

    **Le point de départ est un acquis :** {violet}**la critique de la religion**{/violet} **est** {coral}**pour l'essentiel terminée**{/coral}**, et elle est** {coral}**la présupposition de toute critique**{/coral}**.** C'est __l'être humain qui fait la religion__, et non l'inverse : elle est la conscience d'un monde « à l'envers », {teal}« le soupir de la créature oppressée »{/teal}, {teal}« l'opium du peuple »{/teal}. Reste alors à établir la vérité de l'ici-bas : {teal}« {/teal}la critique du ciel se change par là en {coral}critique de la terre{/coral}, la critique de la religion en {coral}critique du droit{/coral}, la critique de la théologie en {coral}critique de la politique{/coral}{teal} »{/teal}.

    **Pourquoi la critique de la religion est-elle la présupposition de toute critique ?** Parce que la religion est la défense céleste du monde terrestre : elle en est {teal}« le fondement général de sa consolation et de sa justification »{/teal}. Une fois cette défense réfutée, {coral}l'existence séculière de l'erreur est compromise{/coral} : l'État, le droit, la société ne peuvent plus se justifier en renvoyant au ciel. La critique de la religion établit en outre deux acquis dont toute critique ultérieure part : {amber}ce sont les hommes qui produisent leurs représentations{/amber}, et le monde qui produit la religion est {amber}un monde à l'envers{/amber}, que lutter contre elle revient donc à combattre indirectement. Il ne reste alors qu'à porter la critique sur ce monde lui-même.

    Voici le plan de l'*Introduction* :

    | Mouvement | Lieu | Ce qui s'y joue |
    | passer de la critique de la religion à la critique de la terre, du droit et de la politique | §1-8 | La critique de la religion est achevée et doit se prolonger en critique du droit, d'abord de la philosophie allemande du droit, qui est la copie d'un original. |
    | combattre la situation allemande bien qu'elle soit un anachronisme | §9-19 | Le status quo allemand est en deçà de l'histoire mais reste un objet pour la critique, qui y est une arme et non un instrument de dissection. |
    | établir que l'Allemagne n'est contemporaine du présent que par sa philosophie | §20-22 | La philosophie du droit est sa seule histoire à la hauteur du présent : la critiquer, c'est critiquer le reflet philosophique de l'État moderne. |
    | écarter les deux partis jeunes-hégéliens, qui se trompent chacun sur la philosophie | §23-25 | Le parti pratique veut nier la philosophie sans l'effectuer, le parti théorique l'effectuer sans la supprimer. |
    | faire de la critique de la philosophie du droit l'analyse de l'État moderne | §26 | La philosophie spéculative du droit exprime l'imperfection de l'État moderne, qui fait abstraction de l'homme effectif. |
    | faire passer la critique à la pratique | §27-29 | La critique débouche sur la pratique, et la théorie devient un pouvoir matériel quand elle s'empare des masses. |
    | chercher la possibilité positive de la révolution allemande | §30-51 | Elle tient à une classe aux chaînes radicales, le prolétariat, dont la philosophie est le cerveau. |

    ! L'*Introduction* ne refait pas la critique de la religion : elle la tient pour acquise, et s'en sert pour passer à la critique du droit.
