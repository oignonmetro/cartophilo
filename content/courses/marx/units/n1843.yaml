- id: n1843-p6
  title: "La théorie devient un pouvoir matériel"
  notes: |-
    **La théorie, comme la philosophie, n'est pas impuissante : {coral}elle devient un pouvoir matériel dès lors qu'elle s'empare des masses{/coral}.** Marx concède d'abord que {red}l'arme de la critique ne remplace pas la critique des armes{/red} : un pouvoir matériel ne se renverse que par un pouvoir matériel. Mais cela ne fait pas de la théorie un simple commentaire, puisque, en s'emparant des masses, elle en devient un.

    **Elle s'en empare à une condition : qu'elle soit {violet}radicale{/violet}.** Une théorie qui {amber}démontre ad hominem{/amber} atteint chacun là où il est ; et elle le fait dès qu'elle est radicale, car **être radical, c'est saisir la chose à la racine, et la racine de l'être humain, c'est l'être humain lui-même**. La preuve en est que la théorie allemande part de {coral}l'abolition positive de la religion{/coral}, que la critique de la religion a conduit à la doctrine {teal}« {/teal}que l'être humain est pour l'être humain {coral}l'être suprême »{/coral}. De là {coral}l'impératif catégorique{/coral}, que Marx emprunte à {sky}Kant{/sky}, {coral}de renverser tous les rapports{/coral} qui font de l'homme un être diminué, asservi, abandonné, méprisable. L'exclamation de ce Français à propos de l'impôt sur les chiens ({yellow}« pauvres chiens ! on veut vous traiter comme des êtres humains ! »{/yellow}) dit mieux que tout cette humiliation.

    Ce paragraphe achève ce que préparait la critique de la religion : la théorie allemande a un contenu pratique, parce que la critique de la religion débouche sur l'exigence de transformer les rapports sociaux, et non sur une simple doctrine.

    **Que veut dire « démontrer ad hominem » ?** S'adresser à l'être humain lui-même, et non à des considérations abstraites : une théorie qui démontre ad hominem touche chacun là où il est, et c'est ce qui lui permet de s'emparer des masses. Pour Marx, elle le fait dès qu'elle est radicale, c'est-à-dire dès qu'elle saisit l'être humain à sa racine, qui est l'être humain lui-même.

    ! Marx ne prétend pas que la théorie suffise : il dit qu'elle devient pouvoir matériel en s'emparant des masses, et non avant.
  passage:
    label: "§29"
    text: "Il est vrai que l'arme de la critique ne peut pas remplacer la critique des armes, que le pouvoir matériel ne peut être renversé que par un pouvoir matériel, mais la théorie devient elle aussi un pouvoir matériel dès lors qu'elle s'empare des masses. La théorie est capable de s'emparer des masses dès lors qu'elle démontre *ad hominem*, et elle démontre *ad hominem* dès qu'elle devient radicale. Être radical, c'est saisir la chose à la racine. Mais la racine de l'être humain, c'est l'être humain lui-même. La preuve évidente du radicalisme de la théorie allemande, la preuve donc de son énergie pratique, c'est qu'elle prend pour point de départ l'abolition *positive* et résolue de la religion. La critique de la religion s'achève par la doctrine d'après laquelle l'être humain est *pour l'être humain l'être suprême*, donc par l'*impératif catégorique de renverser tous les rapports existants*, dans lesquels l'être humain est un être diminué, asservi, abandonné, méprisable – des rapports qu'on ne saurait mieux décrire qu'en reprenant l'exclamation d'un Français à propos d'un projet d'impôt sur les chiens : pauvres chiens ! On veut vous traiter comme des êtres humains !"
