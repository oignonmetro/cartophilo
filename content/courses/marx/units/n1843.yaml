- id: n1843-i3
  title: "Pourquoi ne peut-on pas effectuer la philosophie sans la supprimer ?"
  notes: |-
    **Pourquoi ne peut-on pas supprimer la philosophie sans l'effectuer, ni l'effectuer sans la supprimer ?** {sky}Marx{/sky} pose une formule à double face, {green}on ne peut pas supprimer la philosophie sans l'effectuer{/green} (contre le parti pratique), {green}on ne peut pas l'effectuer sans la supprimer{/green} (contre le parti théorique), mais {red}il ne la démontre pas{/red} : il la prononce comme une conclusion, et le texte n'en donne que des éléments. Le verbe allemand est {blue}*aufheben*{/blue}, qui dit à la fois supprimer et dépasser ; {sky}Fischbach{/sky}, qui cite d'autres traductions, dit « réaliser » là où celle-ci dit « effectuer ».

    **Ce que le texte dit.** La philosophie {coral}fait partie du monde allemand{/coral}, dont elle est {coral}le complément, fût-il idéel{/coral} (§25), et elle est {coral}sa seule histoire à la hauteur du présent{/coral} (§23). Mais la philosophie du droit {coral}fait abstraction de l'être humain effectif{/coral}, comme l'État moderne qu'elle exprime, et sa réalité {coral}demeure un au-delà{/coral} (§26). Enfin, l'Allemagne doit viser {coral}la hauteur humaine{/coral}, non seulement {coral}le niveau officiel{/coral} des peuples modernes (§28), dont elle a presque déjà survécu à l'accomplissement (§23).

    **Contre le parti théorique : pourquoi l'effectuer sans la supprimer ne suffit pas.** Effectuer telle quelle la philosophie hégélienne du droit, c'est construire l'État moderne qu'elle pense, avec son abstraction de l'homme effectif : on atteindrait {amber}le niveau officiel{/amber}, que les peuples voisins ont déjà presque dépassé, et non la hauteur humaine. Il faut donc changer la philosophie qu'on effectue, c'est-à-dire la supprimer {amber}en tant que philosophie{/amber}, en tant que pensée abstraite séparée de la réalité (§25). Fischbach ajoute que la philosophie existe réellement et qu'on ne combat une philosophie qu'avec une autre : la supprimer, c'est en élaborer une nouvelle.

    **Contre le parti pratique : pourquoi la supprimer sans l'effectuer ne suffit pas.** Tourner le dos à la philosophie la laisse en place, puisqu'elle est {amber}la réalité allemande{/amber} : les Allemands ont vécu leur histoire {amber}en pensée{/amber} (§22). La nier sans l'effectuer, c'est nier la pensée sans faire en réalité ce qu'elle pense.

    **Un rapprochement avec la religion, que le texte permet mais que Marx ne fait pas ici.** La religion est {teal}« l'effectuation fantastique de l'essence humaine »{/teal}, un substitut de ce que le monde n'effectue pas, et supprimer la religion, c'est {teal}« exiger son bonheur effectif »{/teal} (§3, §5). Si la philosophie allemande est de même une histoire vécue en pensée à la place d'une histoire réelle, {coral}la supprimer revient à effectuer ce qu'elle pense{/coral}, et {coral}l'effectuer revient à la supprimer comme pensée séparée{/coral} : deux faces d'un même acte.

    ! Ce raisonnement est une lecture du texte, non une démonstration de Marx : il donne la formule, pas la preuve.
  passage:
    label: "Introduction"
