- id: n1843-p1
  title: "Contemporains philosophiques, non historiques"
  notes: |-
    **Les Allemands ont vécu par la pensée ce que les autres peuples vivent par l'histoire : leur {violet}post-histoire{/violet}, c'est {violet}la philosophie{/violet}.** Les peuples anciens ont vécu leur {violet}préhistoire{/violet} {yellow}en imagination, dans la mythologie{/yellow}, c'est-à-dire avant l'histoire réelle ; les Allemands vivent la leur {yellow}en pensée{/yellow}, après l'histoire que les autres ont faite. D'où la formule : {teal}« Nous sommes{/teal} {coral}les contemporains philosophiques du présent{/coral} {teal}sans en être les contemporains historiques »{/teal}. L'Allemagne n'est donc au niveau de son temps que par sa philosophie, non par ses institutions ni par son économie, et {coral}la philosophie allemande est le prolongement idéal de l'histoire allemande{/coral}.

    **Il en résulte que critiquer la philosophie est une tâche réelle, non un détour.** Au lieu de critiquer {red}les œuvres incomplètes{/red} de l'histoire réelle de l'Allemagne, qui n'a pas fait sa révolution, on critique {amber}les œuvres posthumes{/amber} de son {amber}histoire idéelle{/amber}, la {amber}philosophie{/amber}. Cette critique se trouve alors {coral}au milieu des questions du présent{/coral}, dont Marx fait la question de l'heure par une citation shakespearienne laissée en anglais dans le texte. La raison : {coral}chez les peuples avancés{/coral}, le conflit avec l'État moderne est {violet}**pratique**{/violet} ; {coral}en Allemagne{/coral}, où cet État n'existe pas encore, il est d'abord {violet}**critique**{/violet}, puisqu'il porte sur son **reflet philosophique**.

    **Pourquoi des œuvres « incomplètes » et « posthumes » ?** Les œuvres de l'histoire réelle de l'Allemagne sont {amber}incomplètes{/amber}, parce que cette histoire n'a pas fait ce que les autres peuples ont fait, à commencer par leur révolution. Celles de son histoire idéelle sont {amber}posthumes{/amber} : comme des écrits publiés après la mort de leur auteur, la philosophie allemande vient après une histoire qui n'a pas eu lieu, et en dit la pensée.

    ! La **philosophie allemande** n'est pas ici célébrée : elle n'est __que le prolongement idéal d'une histoire réelle restée incomplète__.
  passage:
    label: "§22"
    text: "Tout comme les peuples anciens vivaient leur préhistoire par l'imagination, par la *mythologie*, nous les Allemands avons vécu notre post-histoire par la pensée, par la *philosophie*. Nous sommes les contemporains *philosophiques* du présent sans en être les contemporains *historiques*. La philosophie allemande est le *prolongement idéal* de l'histoire allemande. Donc, si au lieu de critiquer les œuvres incomplètes de notre histoire réelle, nous critiquons les œuvres posthumes de notre histoire idéelle, si nous critiquons la *philosophie*, alors notre critique se trouve au milieu des questions dont le présent dit : *that is the Question*. Alors que, chez les peuples avancés, on assiste à la rupture *pratique* avec la situation propre à l'État moderne, en Allemagne en revanche, où cette situation elle-même n'existe pas encore, on a d'abord affaire à la rupture *critique* avec le reflet philosophique de cette situation."
