- id: n1843-p5
  title: "La critique débouche sur la pratique"
  notes: |-
    **La** {violet}**critique de la philosophie spéculative du droit**{/violet} {coral}**ne débouche pas sur elle-même**{/coral}**, mais sur des** {amber}**tâches**{/amber} **pour lesquelles il n'y a** {amber}**qu'un seul moyen de résoudre :**{/amber} {violet}**la pratique**{/violet}**.** Elle reprend ce que Marx disait de la critique en général : elle n'est plus une fin en soi, mais un moyen. Être l'adversaire résolu de l'ancienne conscience allemande oblige à passer à ce qui peut la changer effectivement.

    **La question qui s'ouvre porte sur le niveau de la pratique à atteindre** : l'Allemagne peut-elle parvenir à {violet}une pratique à la hauteur de principes{/violet}, c'est-à-dire à {coral}une révolution{/coral} qui ne s'élève pas seulement au {amber}niveau officiel{/amber} des peuples modernes, mais à {amber}la hauteur humaine{/amber} qui sera leur avenir prochain ? Deux hauteurs sont donc distinguées :

    | Niveau | Ce que c'est | Qui l'a atteint |
    | le niveau officiel des peuples modernes | l'État moderne, la situation politique officielle du présent | les peuples modernes (la France et l'Angleterre) |
    | la hauteur humaine | l'avenir prochain de ces peuples | personne encore, y compris eux |

    Cela rejoint le constat précédent : réaliser seulement la philosophie de Hegel mettrait l'Allemagne au niveau officiel, que les peuples voisins ont déjà presque dépassé. La révolution à viser doit aller plus haut. Le §50 la dira : {coral}l'émancipation de l'Allemand est l'émancipation de l'être humain{/coral}.

    **Qu'est-ce qu'une pratique « à la hauteur de principes » ?** Une pratique qui égale les principes que la théorie a déjà atteints. L'Allemagne a pensé plus haut qu'elle n'a agi : la question est de savoir si sa pratique peut rejoindre sa théorie, et même la dépasser, en s'élevant à la hauteur humaine.

    ! La question de §28 ne demande pas si l'Allemagne peut faire une révolution comme les autres peuples, mais si elle peut aller au-delà de ce niveau.
  passage:
    label: "§27-28"
    text: |-
      Déjà en tant que contrepartie résolue de la modalité qui a jusqu'ici été celle de la conscience politique *allemande*, la critique de la philosophie spéculative du droit ne débouche pas sur elle-même mais sur des *tâches* qu'il n'y a qu'un moyen de résoudre : la *pratique*.

      La question est : l'Allemagne peut-elle parvenir à une pratique à la hauteur de principes, c'est-à-dire à une *révolution* qui ne s'élève pas simplement au *niveau officiel* qu'ont atteint les peuples modernes, mais à la *hauteur humaine* qui constituera l'avenir prochain de ces peuples ?
