- id: n1843-ouverture
  title: "La philosophie et le prolétariat"
  notes: |-
    **La fin de l'*Introduction* retourne la question du début : la philosophie n'est pas seulement à supprimer en étant effectuée, elle a besoin d'un support matériel, et ce support est le prolétariat.** Marx écrit qu'« à l'inverse » la philosophie trouve dans le prolétariat ses armes matérielles, et le prolétariat dans la philosophie ses armes intellectuelles (§48). Le §50 donne la formule finale : {coral}le cerveau de l'émancipation est la philosophie, son cœur, le prolétariat{/coral}, et chacun ne peut se rendre effectif ou s'abolir que par l'autre.

    Ce que le début de l'unité posait en termes de philosophie seulement (« vous ne pouvez pas supprimer la philosophie sans l'effectuer ») est ainsi complété par son corrélat : {amber}le prolétariat ne peut se supprimer sans l'effectuation de la philosophie{/amber}.
  passage:
    label: "Ouverture"
    text: "L'émancipation de l'Allemand est l'émancipation de l'être humain. Le *cerveau* de cette émancipation est la *philosophie*, son *cœur*, le *prolétariat*. La philosophie ne peut s'effectuer sans la suppression du prolétariat, le prolétariat ne peut pas se supprimer sans l'effectuation de la philosophie."
