- id: n1843-p2
  title: "Le parti pratique a raison de nier la philosophie, tort de croire la nier"
  notes: |-
    **La philosophie du droit et de l'État est** {coral}**la seule histoire allemande**{/coral} **qui soit** ***al pari*** **(au niveau)** {coral}**du présent moderne officiel**{/coral} **: le** {violet}**parti pratique**{/violet}**, qui la juge inférieure à la pratique, se trompe donc sur elle.** Marx en tire que le peuple allemand doit soumettre à la critique, non seulement sa situation existante, mais aussi {amber}son prolongement abstrait{/amber}, sa philosophie. Il écarte ensuite deux voies :

    | Voie | Pourquoi elle ne suffit pas |
    | nier immédiatement la situation réelle | Cette négation est déjà faite dans la situation idéelle, c'est-à-dire par la philosophie, qui exige un État moderne. |
    | accomplir immédiatement la situation idéelle | Le peuple allemand a presque déjà survécu à cet accomplissement, en observant les peuples voisins, déjà au-delà. |

    La France et l'Angleterre sont déjà plus loin que ne le serait l'Allemagne si elle réalisait la philosophie de Hegel. {yellow}Le libéralisme économique anglais{/yellow} est plus développé que Hegel ne le pensait, et {yellow}les Français songent déjà à des formes de démocratie sociale{/yellow}, qu'ils expérimenteront en 1848. Il ne suffit donc pas de réaliser la philosophie allemande : il faut {coral}la supprimer{/coral}, mais pas toute philosophie, car {coral}il en faut une nouvelle, à la hauteur de l'avenir que portent les réalités française et anglaise{/coral}.

    **Le parti politique pratique « a raison » de demander la négation de la philosophie, mais son erreur est de s'en tenir à cette demande.** Il croit la réaliser {red}en lui tournant le dos{/red} et en {red}marmonnant quelques formules grincheuses{/red} : on peut y voir déjà l'attitude que prendront {yellow}plus tard les marxistes scientistes de la Seconde Internationale{/yellow}, que Marx dénonce par avance. La raison de l'erreur est {amber}l'horizon borné{/amber} du parti, qui croit la philosophie {red}en dessous de la pratique allemande{/red}. C'est l'inverse : {coral}en Allemagne, c'est la pratique qui est en dessous de tout{/coral}, et le seul véritable {violet}germe de vie{/violet} du peuple allemand n'a poussé {yellow}que dans sa boîte crânienne{/yellow}. D'où la formule : {green}« vous ne pouvez pas supprimer la philosophie sans l'effectuer »{/green}.

    **Que veut dire « le germe de vie effectif n'a proliféré que dans sa boîte crânienne » ?** Que ce qu'il y a de vivant et de réel en Allemagne s'est développé en pensée, dans la philosophie, et non dans les institutions ni dans la pratique. Le parti pratique veut partir de germes de vie effectifs : le seul qui existe est philosophique, et c'est pourquoi on ne peut pas le supprimer sans l'effectuer.

    ! Nier la philosophie ne consiste pas à lui tourner le dos : tant qu'on s'en tient là, on la laisse intacte, et c'est elle qui reste la réalité allemande.
  passage:
    label: "§23"
    text: "La *philosophie allemande du droit et de l'État* est la seule *histoire allemande* qui se tienne *al pari* avec le présent moderne *officiel*. Il faut donc que le peuple allemand ajoute cette histoire rêvée à la situation existante qui est la sienne et qu'il ne se contente pas de soumettre à la critique cette situation existante, mais qu'il y soumette également son prolongement abstrait. En matière de droit et d'État, l'avenir du peuple allemand ne peut se *borner* ni à la négation immédiate de sa situation réelle ni à l'accomplissement immédiat de sa situation idéelle. En effet, le peuple allemand dispose, par sa situation idéelle, de la négation immédiate de sa situation réelle, et en observant les peuples voisins, il a presque déjà *survécu* à l'accomplissement immédiat de sa situation idéelle. C'est donc à raison que le parti politique *pratique* en Allemagne exige la *négation de la philosophie*. Son erreur ne consiste pas à formuler cette revendication, mais à s'en tenir à cette revendication qu'il n'accomplit ni ne peut accomplir sérieusement. Il croit mettre en œuvre cette négation en tournant le dos à la philosophie et en marmonnant quelques formules grincheuses et banales à son encontre après avoir détourné la tête. L'horizon borné de ce parti le conduit à exclure la philosophie du domaine de l'effectivité *allemande* ou même à croire qu'elle se situe *en dessous* de la pratique allemande et des théories qui la servent. Vous exigez que l'on se raccroche à des *germes de vie effectifs*, mais vous oubliez que le germe de vie effectif du peuple allemand n'a jusqu'ici proliféré que dans sa *boîte crânienne*. En un mot : *vous ne pouvez pas supprimer la philosophie sans l'effectuer*."
