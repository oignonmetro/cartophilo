- id: n1843-o1
  title: "Supprimer la philosophie sans la réaliser : l'extinction de la philosophie"
  notes: |-
    **Que veut dire « réaliser la philosophie » ? Fischbach distingue deux sens.** Premièrement, comprendre que {violet}la philosophie existe réellement{/violet}, dans le monde social et historique, comme existent l'État et les classes sociales : son lieu est l'idéalité, donc aussi {violet}l'idéologie{/violet}, mais l'idéologie est une composante essentielle du monde réel et {amber}produit des effets{/amber}. Deuxièmement, comprendre qu'{coral}une philosophie réellement existante ne se combat qu'au moyen d'une autre philosophie tout aussi réellement existante{/coral}.

    **Il faut donc continuer à faire de la philosophie jusqu'à son extinction**, comme on continue à faire de la politique jusqu'à l'extinction de la politique : l'État dépérira, mais d'ici là il faut s'opposer à l'État existant. C'est pourquoi {sky}Marx{/sky} n'a cessé de faire de la philosophie, et en même temps de la politique. {sky}Korsch{/sky} le dit dans *Marxisme et philosophie* (Minuit) : un {amber}dépassement du point de vue philosophique{/amber} qui garde pourtant {amber}un caractère philosophique{/amber}.

    **La philosophie à élaborer est nouvelle** : Marx s'y consacre à partir des *Thèses sur Feuerbach* et de *L'Idéologie allemande*, qui en jettent les bases sous le nom de {violet}matérialisme de la pratique{/violet}. Elle vise une révolution dont l'*Introduction* dit les conditions : une classe aux {violet}chaînes radicales{/violet}, le {violet}prolétariat{/violet} (§45), et des {violet}besoins radicaux{/violet} (§37).

    ! L'« extinction » de la philosophie n'est pas un mot d'ordre actuel : c'est un horizon, qui n'autorise pas, d'ici là, à tourner le dos à la philosophie.
  passage:
    label: "Prolongement"
