  points:
  - id: g-survie-l1-c1
    sentence: "__En 1844, le capitaliste gagne la lutte qui fixe le **salaire**, parce qu'il peut vivre plus__ ___ sans l'ouvrier que l'ouvrier sans lui."
    answer: longtemps
    alt: []
  - id: g-survie-l1-q1
    sentence: "__Le **salaire minimum** assure la subsistance de l'ouvrier et l'excédent nécessaire__ « pour que la ___ des ouvriers ne s'éteigne pas » (Manuscrits de 1844)."
    answer: race
    alt: []
  - id: g-survie-l1-q2
    sentence: "__Pour l'**économie politique**,__ « tout comme n'importe quel ___, il doit gagner assez pour pouvoir travailler » (Manuscrits de 1844)."
    answer: cheval
    alt: []
  - id: g-survie-l1-c2
    sentence: "__Ce que l'ouvrier vend au capitaliste n'est pas son travail__, mais sa **force de travail**, sa ___ de travailler pendant un temps."
    answer: capacité
    alt: ["capacite"]
  - id: g-survie-l1-a3
    sentence: "__Quand le salaire tombe au seuil de la **survie**, la force de travail ne peut plus se conserver que__ « sous une forme ___ » (Le Capital, livre I, chap. IV)."
    answer: étiolée
    alt: ["etiolee"]
  - id: g-survie-l1-c3
    sentence: "__Contre la loi d'airain de **Lassalle**, première raison__ : fondée sur la loi de population de ___, elle vaudrait pour tout système social, et ne s'abolirait pas avec le salariat."
    answer: Malthus
    alt: []
  - id: g-survie-l1-c4
    sentence: "__Contre la loi d'airain, seconde raison__ : le salariat est un système d'___, quel que soit le salaire, bon ou mauvais."
    answer: esclavage
    alt: []
  - id: g-survie-l1-c5
    sentence: "__La partie de la journée qui produit au-delà de l'équivalent du salaire__, et dont le capitaliste garde le produit, s'appelle le ___."
    answer: surtravail
    alt: []
  - id: g-survie-l1-c6
    sentence: "__Pourquoi « trois jours » ?__ Une **force de travail** faite pour durer trente ans, épuisée en ___ ans, perd chaque jour trois fois ce que paie le salaire."
    answer: dix
    alt: ["10"]
  - id: g-survie-l1-a5
    sentence: "__Le capitaliste use l'ouvrier sans souci de sa durée de vie__, d'abord parce que la ___ ouvrière fournit aussitôt de quoi remplacer les morts."
    answer: surpopulation
    alt: ["réserve", "reserve"]
  - id: g-survie-l1-a6
    sentence: "__Chaque capitaliste use l'ouvrier, même s'il le voulait autrement__, parce que la ___ lui impose les lois de la production capitaliste comme une contrainte extérieure."
    answer: concurrence
    alt: []
  - id: g-survie-l1-d1
    sentence: "__Ce qui arrête l'usure de la vie ouvrière__ : la loi qui fixe une journée de travail ___, arrachée par une longue guerre civile."
    answer: normale
    alt: []
  - id: g-survie-l1-b1
    sentence: "__Même hors du travail, la **survie** de l'ouvrier reproduit le capital__ : l'esclave était attaché par des chaînes, « l'ouvrier salarié l'est par des fils ___ » (Le Capital, livre I, chap. XXI)."
    answer: invisibles
    alt: []
  - id: g-survie-l1-c7
    sentence: "__Pourquoi l'accumulation fait-elle grandir la part des **machines** ?__ Parce que chaque capitaliste doit rendre le travail plus ___ pour produire moins cher."
    answer: productif
    alt: []
  - id: g-survie-l1-c8
    sentence: "__La **surpopulation** est dite relative parce qu'elle est en trop, non par rapport aux subsistances, mais par rapport aux besoins du__ ___."
    answer: capital
    alt: []
  - id: g-survie-l1-c9
    sentence: "__Les chômeurs, disponibles pour le capital et qui pèsent sur les salaires des autres__, forment l'**armée industrielle** de ___."
    answer: réserve
    alt: ["reserve"]
  - id: g-survie-l1-d2
    sentence: "__Contre **Malthus**, Marx soutient qu'il n'y a de loi de population abstraite que pour__ les plantes et les animaux : chez les hommes, chaque ___ de production a la sienne."
    answer: mode
    alt: []
  - id: g-survie-l1-a9
    sentence: "__Ce qui croît avec l'accumulation, selon Marx, ce n'est pas nécessairement la pauvreté des ouvriers__, mais la ___ de leur **survie**."
    answer: précarité
    alt: ["precarite", "incertitude"]
