id: ali1
title: "La révolution allemande et l'homme réel"
subtitle: "Réaliser la philosophie en la critiquant ; le bourgeois, le citoyen et l'ensemble des rapports sociaux"
icon: compass
color: teal
lessons:
- id: ali1-l1
  title: "L'exception allemande : réaliser la philosophie, c'est la critiquer"
  notes: |-
    **En Allemagne, selon Marx en 1843, réaliser la philosophie politique de** {sky}**Hegel**{/sky} **et la critiquer ne font qu'un : c'est pourquoi l'Allemagne peut** {coral}**sauter la révolution politique et passer d'emblée à la révolution sociale**{/coral}**.** La thèse est celle de l'*Introduction à la Critique de la philosophie du droit de Hegel*, écrite en 1843 et publiée en 1844 dans les {sky}*Annales franco-allemandes*{/sky}.

    **La difficulté : réaliser une philosophie, puis devoir la critiquer.** {amber}Réaliser{/amber} la {amber}philosophie hégélienne du droit{/amber}, c'est la faire passer dans l'{coral}histoire réelle de l'Allemagne{/coral} : y obtenir un {violet}État constitutionnel{/violet} et une {violet}société civile{/violet} moderne et développée, ce que Hegel appelait l'État rationnel. Mais une fois ces institutions devenues réelles, faudra-t-il les critiquer à leur tour ? Pour la plupart des nations, oui, et en deux temps : d'abord une révolution, ensuite sa critique. {green}Pas pour l'Allemagne.{/green}

    **Deux révolutions s'opposent.**
    - {pink}La révolution politique{/pink} : la {violet}révolution bourgeoise{/violet}, celle que la {yellow}France{/yellow} a accomplie. Elle est {red}partielle{/red} : elle change l'État, pas la société.
    - {green}La révolution sociale{/green}, que Marx appelle aussi {violet}révolution humaine{/violet} : elle est {green}complète, universelle{/green}.

    Pour Marx, {amber}social, humain et universel sont équivalents{/amber}, et s'opposent tous à {red}politique{/red}, qui veut dire {red}abstrait et partiel{/red}.

    **Le paradoxe : un pays en retard se trouve en avance.** Le {violet}retard de l'Allemagne{/violet} est presque __un lieu commun__ de la pensée sociale et politique allemande des trois premières décennies du XIXe siècle. On le trouve chez le poète {sky}Heinrich Heine{/sky} (Henri Heine, quasiment devenu français), qui fut l'élève de Hegel et devint un ami proche de Marx. Marx reprend le constat, et le retourne : {coral}__l'Allemagne va pouvoir passer directement à ce qui a demandé aux autres nations une étape préalable__{/coral}.

    **Premier atout : la philosophie.** En Allemagne, {coral}l'universel a été pensé{/coral}, sous la forme de l'{violet}hégélianisme{/violet} : une philosophie qui a su saisir conceptuellement la nature du présent (c'était le projet de Hegel, et selon Marx il y est parvenu). Le {red}handicap{/red} était que {red}l'Allemagne n'avait fait qu'en pensée ce que les autres avaient fait dans la réalité{/red} ; il devient {green}un avantage{/green}, puisque {green}l'universel{/green} qu'il s'agit d'atteindre y est {green}déjà pensé{/green}.

    **Second atout, qu'on oublie souvent : le prolétariat.** Contre toute attente, l'Allemagne en possède un, alors que le {pink}pays est à peine industrialisé{/pink} ({yellow}ce n'est ni Manchester ni Liverpool{/yellow}). Et contre toute attente encore, {coral}ce __prolétariat__ est __à la hauteur__ de la philosophie allemande{/coral}. Marx le défend contre le pessimisme d'{sky}Arnold Ruge{/sky} dès leur {sky}correspondance de 1843{/sky}, publiée dans les *Annales franco-allemandes* avec l'article sur la question juive.

    La preuve vient en {yellow}juin 1844{/yellow} : la {yellow}__révolte des tisserands de Silésie__{/yellow}, que Marx commente contre Ruge dans les {sky}*Gloses critiques en marge de l'article « Le roi de Prusse et la réforme sociale. Par un Prussien »*{/sky} (*Vorwärts!*, août 1844). Les tisserands ne s'en sont pas pris seulement aux machines, comme les ouvriers anglais qui {pink}brisaient leur outil de travail{/pink} : ils ont détruit aussi {yellow}les livres de comptes et les titres de propriété{/yellow}. Ils sont donc allés droit à la question essentielle, {coral}la propriété privée des moyens de production{/coral}. C'est cette maturité qu'aucun autre prolétariat n'avait encore montrée.

    **Ce qui manque à l'Allemagne : une bourgeoisie.** Ce qui est arriéré en Allemagne, {red}ce n'est pas le prolétariat, c'est la bourgeoisie{/red} : petite, faible, {amber}soumise à l'aristocratie et à la religion{/amber}, elle n'a pas conquis son autonomie, à la différence de l'Angleterre et de la France. {coral}C'est pourquoi il n'y a pas eu de __révolution politique__ en Allemagne.{/coral}

    | Élément | En Allemagne | Ce qui le montre |
    | Philosophie | la plus avancée | l'hégélianisme a pensé le présent |
    | Prolétariat | le plus avancé | la révolte des tisserands de Silésie |
    | Bourgeoisie | arriérée | sa soumission à l'aristocratie |

    **Donc** __**réaliser l'État bourgeois y sera en même temps le critiquer**__**.** Les limites de l'État rationnel bourgeois seront critiquées aussitôt, parce que {coral}l'__agent__ de cette critique existe déjà : les prolétaires allemands{/coral}. Et la critique est même déjà amorcée, en théorie, par {sky}Hegel{/sky} lui-même : les paragraphes fameux des {sky}*Principes de la philosophie du droit*{/sky} sur la {violet}plèbe{/violet} (§244-245), sur l'{amber}accroissement des inégalités{/amber} et sur les {amber}contradictions de la société civile moderne{/amber}. La révolution qui aura lieu d'emblée en Allemagne sera donc {green}sociale, universelle, humaine{/green}, et non {red}partielle et politique{/red} : on y réalisera la philosophie et on la critiquera en acte.

    ! Marx ne dit pas que l'Allemagne est en avance en tout : elle est en retard, et c'est ce retard même (une bourgeoisie trop faible pour faire sa révolution) qui ouvre la voie à la révolution sociale.
