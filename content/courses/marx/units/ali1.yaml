- id: ali1-l2
  title: "Le bourgeois, le citoyen et l'homme réel"
  notes: |-
    **Dans la société moderne, chaque individu mène une double vie, de** {pink}**bourgeois**{/pink} **et de** {pink}**citoyen**{/pink}**, et ces deux figures sont** {coral}**également abstraites**{/coral} **: l'**{violet}**homme réel**{/violet} **n'est ni l'une ni l'autre, mais l'individu pris dans l'**{green}**ensemble des rapports sociaux**{/green}**.** Le problème est posé dans {sky}*La Question juive*{/sky}, texte court, publié en 1844 dans les *Annales franco-allemandes*, réplique de Marx à un texte de {sky}Bruno Bauer{/sky} sur la même question.

    **Le** {violet}**bourgeois**{/violet} **est l'homme de la** {violet}**société civile**{/violet}**.** Le mot, que {sky}Hegel{/sky} employait déjà, ne désigne pas encore forcément une classe sociale, mais {yellow}un type d'activité{/yellow} : celui des habitants du bourg, de la ville, qui {yellow}se consacrent au commerce, à la banque et à la manufacture{/yellow}. Chez Hegel, il s'oppose à la {pink}paysannerie{/pink}, la {violet}classe substantielle{/violet}, celle qui a un {pink}rapport à la terre{/pink}.

    **L'**{violet}**émancipation politique**{/violet} **opère une** {pink}**double réduction de l'homme :**{/pink}
    - en {pink}__individu égoïste__{/pink} (bourgeois) : le membre de la __société civile__, d'abord préoccupé de son {amber}intérêt propre{/amber}, de celui de ses proches et de sa famille ;
    - en {pink}__citoyen__{/pink} : une {violet}personne morale{/violet}, donc {amber}abstraite{/amber}, membre de __l'État__ et censée se préoccuper de l'{amber}intérêt général{/amber}.

    Ce sont souvent les mêmes individus : chacun est {coral}scindé en lui-même{/coral}, égoïste dans la société civile, citoyen dans l'État. L'{violet}être générique{/violet} dont parle Marx est destiné à supplanter les deux, en dépassant ce dualisme.

    **Ce qu'**{violet}**« abstrait »**{/violet} **veut dire pour un hégélien.** On croit à première lecture que {red}seul le citoyen est abstrait, et que le bourgeois (l'individu égoïste) est réel{/red}. En réalité, {green}l'un est aussi abstrait que l'autre{/green}, car pour un hégélien, même peu orthodoxe comme Marx, {violet}**abstrait**{/violet} ne veut pas dire {red}irréel{/red} ou idéal : abstrait veut dire {amber}isolé, coupé des rapports{/amber}, des __rapports sans lesquels la chose ne pourrait pas être ce qu'elle est__. Inversement, {violet}concret{/violet} veut dire {amber}complet{/amber} : considéré dans la multiplicité des rapports qui permettent à la chose d'exister.

    **Le** {violet}**citoyen**{/violet} **est la** {red}**compensation illusoire**{/red} **de l'isolement du** {violet}**bourgeois**{/violet}**.** Le bourgeois se sait occupé de son intérêt particulier et se vit comme un individu isolé ; il __compense cet isolement__ dans la sphère politique {yellow}(« certes, en tant que bourgeois, je suis égoïste, mais heureusement, je suis citoyen »){/yellow}. La compensation est illusoire, puisque {coral}le citoyen, coupé de la vie réelle, est __aussi abstrait que l'individu isolé de la société civile__{/coral} : il est préoccupé d'un universel lui-même séparé de la réalité.

    | Figure | Sphère | Préoccupé par | Abstraction |
    | Bourgeois | société civile | son intérêt propre | isolé de l'intérêt général |
    | Citoyen | État | l'intérêt général | coupé de la vie réelle |

    **L'**{violet}**homme réel**{/violet} **est l'**{amber}**individu qui existe socialement**{/amber}**.** C'est l'individu inscrit dans la {violet}division du travail social{/violet}, qui {amber}a besoin des produits du travail des autres pour vivre{/amber}, et {amber}dont les autres ont besoin{/amber}. C'est l'individu qui ne peut pas vivre sans ce que Marx appelle le {violet}commerce{/violet} avec autrui, en allemand {violet}*Verkehr*{/violet} (le terme est dans {sky}*L'Idéologie allemande*{/sky}) : non pas vendre et acheter, mais le commerce au sens du XVIIIe siècle, {amber}les échanges, les rapports, les relations de toutes sortes{/amber}. Ce qu'ignorent le {pink}bourgeois{/pink} comme le {pink}citoyen{/pink}, c'est donc {coral}la réalité des rapports sociaux{/coral}.

    **Or c'est dans les rapports sociaux qu'est l'essence humaine.** Marx le dit de façon concise dans les {sky}*Thèses sur Feuerbach*{/sky} (1845) : l'essence humaine est {teal}« __das ensemble der gesellschaftlichen Verhältnisse__ »{/teal}, {teal}l'ensemble des rapports sociaux{/teal}, avec un mot français, *ensemble*, au milieu d'une phrase allemande. {coral}L'essence humaine peut donc s'accomplir là où elle est{/coral} : dans les rapports sociaux, dès lors qu'ils seront eux-mêmes {green}humainement organisés{/green}.

    ! « Abstrait » n'est pas « irréel » : l'égoïsme du bourgeois est bien réel, mais c'est l'égoïsme d'un individu considéré à part de tout ce qui le fait vivre.
