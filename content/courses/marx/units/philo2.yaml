- id: philo2-l2
  title: "Le basculement de 1844-1845"
  notes: |-
    **En quelques mois, l'attitude de Marx envers la philosophie se renverse ; ce qui déclenche la rupture, c'est la** {coral}**critique de Feuerbach**{/coral}**, qui était comme la dernière chance de la philosophie.**

    **Paris, 1844 : des expériences neuves.** Marx y découvre avec enthousiasme le {violet}prolétariat{/violet}, y scelle son amitié avec {sky}Engels{/sky}, entre dans la politique concrète avec la {sky}Ligue des Justes{/sky}, devenue en juin 1847 la {sky}Ligue des Communistes{/sky}, qui lui commandera le *Manifeste*. Sa position bouge :

    | Domaine | À Cologne (1842-1843) | À partir de 1844 |
    | en philosophie | idéaliste | matérialiste |
    | en politique | démocrate | communiste |

    **Le renversement, daté.** En {amber}août 1844{/amber}, Feuerbach a encore donné un fondement philosophique au socialisme ; au {amber}printemps 1845{/amber}, la {sky}11e thèse sur Feuerbach{/sky} oppose aux philosophes en général, qui n'ont fait qu'{red}« interpréter »{/red} le monde, qu'il importe de le {green}« transformer »{/green}.

    **Pourquoi Feuerbach était la dernière chance de la philosophie.** Le raisonnement tient en trois temps.
    - {amber}__La prémisse__{/amber} : l'idéalisme de Hegel est la forme extrême de l'abstraction spéculative ; son renversement matérialiste, celui de {sky}Feuerbach{/sky}, devait donc nous faire accéder enfin à une pensée {green}concrète{/green}.
    - {amber}__Le constat__{/amber} : il n'en est rien. Mesuré à la révolution sociale qui s'annonce, {red}« l'homme sensible »{/red} de Feuerbach est encore une creuse abstraction : un homme sans histoire ni classe.
    - {amber}__La conclusion__{/amber} : si même le renversement de la philosophie la plus abstraite laisse dans l'abstraction, c'est que {coral}l'abstraction ne tient pas à tel système, mais à l'attitude philosophique en général{/coral}. {red}La fallacieuse abstraction à répudier, c'est la philosophie même{/red} : c'est ce qu'énonce crûment *L'Idéologie allemande*.

    Reste à dire où est le « péché originel » de l'activité philosophante. Marx en donne trois diagnostics successifs, qu'il gardera tous : l'{violet}inversion{/violet}, la {violet}mauvaise abstraction{/violet}, la {violet}fonction conservatrice{/violet}.
