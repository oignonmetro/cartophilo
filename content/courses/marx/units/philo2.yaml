- id: philo2-l7
  title: "La Logique refeuilletée : une rechute hégélienne ?"
  notes: |-
    **En 1858, Marx dit avoir tiré grand profit de la *Logique* de Hegel ; on en conclut d'ordinaire que les** ***Grundrisse*** **retombent dans l'hégélianisme.** {sky}Sève{/sky} soutient {coral}l'exact contraire{/coral} : l'épisode est important, mais il ouvre le renversement de Hegel, non une rechute.

    **La lettre de janvier 1858.** À {sky}Engels{/sky} : {teal}« Dans la méthode d'élaboration m'a rendu grand service le fait que par pur hasard, Freiligrath a trouvé quelques volumes de Hegel qui d'origine étaient à Bakounine et me les a envoyés en cadeau, j'avais __refeuilleté la Logique de Hegel__. Si un jour j'ai de nouveau du temps pour ce genre de travaux, j'aurais grande envie, en __deux ou trois feuilles d'imprimerie__, de rendre accessible à l'entendement commun __ce qu'a de rationnel la méthode__ que H[egel] a découverte mais en même temps mystifiée. »{/teal}

    **Premier point : le fait est de grand sens.** On l'a traité en anecdote, ou en tournant « hégélianisant ». Il compte, car si la réception des livres est {yellow}fortuite{/yellow}, le refeuilletage ne l'est pas : Marx s'y livre au moment d'engager le grand œuvre de sa vie. Les preuves en sont nombreuses : sa correspondance ; {amber}trois prises de position sur Hegel{/amber} dans l'Introduction de 1857 ; {amber}quatre références explicites{/amber} à Hegel dans les cinquante premières pages des *Grundrisse*. Et, fait jamais remarqué, la relecture recommence, délibérément cette fois, deux ans plus tard : en commençant les {sky}*Manuscrits de 1861-1863*{/sky}, Marx résume pour lui-même le livre premier de la *Logique*, la {violet}logique de l'être{/violet}.

    **Second point : en quel sens ?** La réponse presque unanime est ravageuse : dans les *Grundrisse*, Marx retomberait sous l'emprise de Hegel. À première vue, tout y porte :
    - un vocabulaire typiquement hégélien : {violet}*an und für sich*{/violet} (en et pour soi), {violet}*Vermittlung*{/violet} (médiation), {violet}*Entäusserung*{/violet} (aliénation, extériorisation), {violet}*Voraussetzung*{/violet} (présupposition), {violet}*Aufhebung*{/violet} (dépassement) ;
    - un plan du capital qui semble calqué sur le {red}syllogisme hégélien{/red} de l'{amber}universel{/amber}, du {amber}particulier{/amber} et du {amber}singulier{/amber}, où l'idéel dicterait sa loi au matériel.

    Les *Grundrisse* marqueraient alors un retour en deçà de *L'Idéologie allemande*, une rechute dans « la philosophie ». C'est cette lecture que la suite renverse.
