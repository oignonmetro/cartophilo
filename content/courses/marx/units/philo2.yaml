# Cours sur la dimension philosophique de l'œuvre de Marx, tiré de
# l'introduction de Lucien Sève aux Écrits philosophiques de Marx (Flammarion,
# « Champs classiques », 2011) : voir l'en-tête de philo1. Ici : partie 2,
# « L'adieu définitif de Marx à "la philosophie" » (les trois diagnostics de la
# philosophie, puis le retour du questionnement philosophique avec les
# Grundrisse).
#
# Citations : Critique du droit politique hégélien (1843) dans la traduction
# de référence (GEME, Kervégan) : « critique véritablement philosophique »,
# « le vrai chemin est mis sur la tête », « mysticisme logique », « Hegel n'est
# pas à blâmer… », « logique propre de l'objet propre » ; Manuscrits de 1844
# (Bottigelli) pour « la logique c'est l'argent de l'esprit » ; Postface du
# Capital dans la GEME (Lefebvre). Introduction de 1844, lettres à Feuerbach et
# à Engels, Grundrisse (« Genèse et essence de l'argent ») : traduction de
# Sève. « Hegel inverse tout » (Sève) n'est pas repris : le volume de référence
# le rend autrement, et le passage n'est pas situé.

id: philo2
title: "L'adieu de Marx à « la philosophie »"
subtitle: "Pourquoi sortir de la philosophie : l'inversion, la mauvaise abstraction, l'apologie de l'existant ; puis la critique de l'économie politique, qui ramène aux catégories"
group: "Le philosophique chez Marx"
icon: compass
color: coral
lessons:
- id: philo2-l1
  title: "Un jeune critique, encore attaché à la philosophie"
  notes: |-
    **Le jeune Marx est un critique fougueux de bien des philosophies, mais jusqu'en 1844** {coral}**il ne met pas en cause la philosophie comme telle**{/coral} **: il veut la remettre sur ses pieds, pour qu'elle prenne la tête de l'émancipation.** Pour comprendre l'adieu, il faut d'abord mesurer cet attachement.

    **Une pensée propulsée par la critique.** Étudiant, il défend {sky}Épicure{/sky} contre {sky}Démocrite{/sky}, contre l'avis de Leibniz et de Hegel. Écarté de l'enseignement, il dirige en 1842 la {sky}*Rheinische Zeitung*{/sky} (*Gazette rhénane*), contre le conservatisme et ses justificatifs philosophiques. En 1843, il critique la philosophie politique de {sky}Hegel{/sky} ; dans le troisième des *Manuscrits de 1844*, le cœur de sa pensée, la {violet}dialectique spéculative{/violet}. Puis viennent coup sur coup :

    | Critique de | Œuvre | Date |
    | Feuerbach, Bauer, Stirner | *L'Idéologie allemande* | 1845-1846 |
    | Proudhon | *Misère de la philosophie* | 1847 |
    | le socialisme à l'allemande | *Manifeste du parti communiste* | 1848 |

    **Mais ce sont des philosophies qu'il critique, non la philosophie.**
    - Dans la *Critique du droit politique hégélien* (1843), à la critique pauvre qui se contente d'exhiber des contradictions, il oppose la {green}critique véritablement philosophique{/green} : celle-ci {teal}« ne s'arrête pas à mettre en lumière des contradictions en tant qu'elles existent, __elle les explique__, elle conçoit __leur genèse, leur nécessité__ »{/teal}.
    - L'*Introduction* à cette critique (début 1844) fait une place centrale à un thème neuf, l'{violet}abolition-réalisation{/violet}. La philosophie annonce dans l'abstrait la fin de l'aliénation ; l'émancipation humaine concrète va donc à la fois l'{red}infirmer{/red}, {teal}« on ne peut __réaliser__ la philosophie sans l'abolir »{/teal}, et la {green}confirmer{/green}, {teal}« on ne peut l'__abolir__ sans la réaliser »{/teal}. D'où l'alliance : {teal}« La philosophie trouve dans le prolétariat ses __armes matérielles__ comme le prolétariat trouve dans la philosophie ses __armes intellectuelles__. »{/teal}
    - En août 1844 encore, Marx écrit à {sky}Feuerbach{/sky} qu'il a {teal}« donné un __fondement philosophique__ au socialisme »{/teal}.

    ! Ne pas projeter l'adieu de 1846 sur tout le jeune Marx : jusqu'à l'été 1844, la philosophie est pour lui l'arme intellectuelle de l'émancipation.
