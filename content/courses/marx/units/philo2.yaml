- id: philo2-l3
  title: "Premier diagnostic : l'inversion"
  notes: |-
    **Dès 1843, Marx donne son nom au vice de la philosophie spéculative : l'**{violet}**inversion**{/violet} **(**{violet}***Umkehrung***{/violet}**), qui** {coral}**met les rapports réels sur la tête**{/coral}**.** On en sort par l'opération inverse, le {violet}renversement matérialiste{/violet}.

    **Ce que fait Hegel.** Dans la {sky}*Philosophie du droit*{/sky}, il fait de l'{red}État{/red} le vrai présupposé de la {green}société civile{/green}, de l'{red}Idée{/red} le réel effectif à la place du {green}peuple{/green}, et ainsi de suite. Or l'expérience de journaliste de Marx lui a appris l'inverse : c'est la société civile, avec ses intérêts, qui fait l'État. Les catégories abstraites passent pour le moteur des développements concrets ; la *Critique du droit politique hégélien* le dit : {teal}« Le vrai chemin est __mis sur la tête__. Le plus simple est le plus compliqué et le plus compliqué le plus simple. »{/teal} Nous sommes en plein {teal}« __mysticisme logique__ »{/teal}.

    **Une découverte définitive, qui revient partout.**
    - dans *La Sainte Famille*, avec l'apologue du {yellow}« Fruit »{/yellow} : le « mystère de la construction spéculative » ;
    - au cœur de l'{sky}Introduction de 1857{/sky} ;
    - dans sa forme classique, la {sky}Postface du *Capital*{/sky} : chez Hegel la dialectique {teal}« est sur la tête. Il faut la retourner pour découvrir le noyau rationnel sous l'enveloppe mystique »{/teal}.

    **Pas seulement Hegel.** L'inversion spéculative se retrouve, profondeur en moins, dans bien des façons communes de penser : chez {sky}Bruno Bauer{/sky}, {sky}Malthus{/sky}, {sky}Adolph Wagner{/sky}. Partout, c'est l'{coral}inversion du rapport entre la chose et le concept{/coral} : on croit que le concept produit la chose, alors que la chose produit le concept. Tel est le ressort de l'idéalisme, savant ou trivial.

    **La sortie.** La philosophie dont il faut sortir, c'est donc l'{red}inversion idéaliste des rapports effectifs{/red} ; on en sort par le {green}renversement matérialiste{/green} ({violet}*materialistische Umstülpung*{/violet}).
