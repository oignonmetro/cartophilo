- id: philo2-l5
  title: "Troisième diagnostic : l'apologie de l'existant"
  notes: |-
    **Dénoncer l'illusion philosophique ne suffit pas : il faut expliquer pourquoi elle dure depuis deux millénaires. C'est qu'elle a une** {coral}**fonction historique**{/coral} **: elle légitime le monde existant.**

    **L'illusion a des racines sociales.** Que la philosophie ait partie liée, dès ses débuts, avec l'essor des {yellow}échanges marchands{/yellow} et plus encore avec l'institution du {yellow}droit{/yellow} et de l'{yellow}État{/yellow} n'a rien de contingent : la mauvaise abstraction s'ancre dans de puissantes réalités, le {violet}fétichisme de la marchandise{/violet}, les autorités théologico-politiques, la transcendance des valeurs. Les *Manuscrits de 1844* le disent d'un mot : {teal}« la logique c'est l'__argent de l'esprit__ »{/teal}. Comme l'argent fait abstraction de toutes les qualités des marchandises pour n'en garder que la valeur, la logique spéculative fait abstraction de toute détermination réelle.

    **Le cas de Hegel : le réel donné pour rationnel.** La *Critique du droit politique hégélien* le formule : {teal}« Hegel n'est pas à blâmer pour avoir dépeint __l'essence de l'État moderne telle qu'elle est__, mais pour avoir fait passer __ce qui est pour l'essence de l'État__. »{/teal} Autrement dit : décrire l'État prussien tel qu'il est, c'est légitime ; présenter cet État comme ce que l'État doit être par essence, c'est déclarer qu'il n'y a {red}rien d'essentiel à changer{/red}. L'idéalisme spéculatif n'est donc pas seulement mystificateur, il est {coral}conservateur{/coral} : en changeant le concret actuel en abstraction éternelle, il le légitime.

    **Ce qui vaut de Hegel vaut de toute « philosophie ».** Spéculation interprétative, elle est plus encore {violet}idéologie justificative{/violet} du monde existant, ou du retour à ce qu'il devrait être, même à l'insu du philosophe.

    **Deux sens du mot, à distinguer.**
    - La {green}philosophie sans guillemets{/green}, réflexion rationnelle sur nos rapports cognitifs et actifs avec le monde, a tiré la question au clair avec le dépassement de l'hégélianisme : en ce sens elle est {amber}terminée{/amber}, thèse d'{sky}Engels{/sky} que Marx partageait sans doute.
    - {red}« La philosophie »{/red}, discours qui légitime la mauvaise abstraction, est {amber}intarissable{/amber} dans le monde tel qu'il va. Une fois compris ce qu'elle est, on ne peut qu'« en sortir d'un bond ».

    C'est ce que fait Marx en 1846 ; après quoi il n'y aura plus jamais de « philosophie de Marx ». Le titre de son premier ouvrage ensuite, *Misère de la philosophie* (1847), est emblématique.
