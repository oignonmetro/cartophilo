- id: philo2-l4
  title: "Deuxième diagnostic : la mauvaise abstraction"
  notes: |-
    **Renverser l'inversion ne suffit pas : le cas de Feuerbach montre qu'on peut être matérialiste et rester spéculatif.** Le vice de la philosophie est plus profond : un {coral}usage acritique de l'abstraction{/coral}, qui change l'universel pensé en entité réelle.

    **L'insuffisance du simple renversement.** Feuerbach, penseur du renversement matérialiste, reste pris dans l'abstraction de {red}« l'homme »{/red}, être naturel étranger à toute histoire et à toute classe. Une pensée spéculative simplement retournée {red}ne fait donc pas sortir de la spéculation{/red}.

    **L'hypostase.** L'abstraction est {green}constitutive de la pensée rationnelle{/green} : penser, c'est saisir l'universel dans les choses (le cheval en général à travers les chevaux). Mais elle égare quand l'universel pensé est {red}hypostasié{/red}, c'est-à-dire changé inconsidérément en {violet}entité réelle{/violet}. Toute spéculation est faite de telles hypostases : de la {violet}mauvaise abstraction{/violet}. C'est par elle que {yellow}« l'Idée »{/yellow}, {yellow}« la matière »{/yellow}, {yellow}« l'homme »{/yellow} passent pour les démiurges d'un réel dont ils ne sont que des expressions mentales.

    **D'où la limite du matérialisme comme doctrine.** Le renversement matérialiste a une portée {amber}forte mais limitée{/amber} : il remet sur ses pieds le rapport le plus général entre être et pensée, et vaut comme {green}principe méthodologique{/green}. Érigé en {red}« conception du monde »{/red}, il peut virer à la mystification autant que l'idéalisme : « la matière » devient à son tour une entité démiurge. D'où la réticence de Marx à s'en réclamer ; remise sur ses pieds, la dialectique de Hegel vaut mieux que {teal}« toute la __niaiserie matérialiste__ prise en bloc »{/teal}.

    **Ce qu'il faut à la place : un matérialisme historique, en deux dimensions.**
    - {amber}objective{/amber} : une pensée de l'historico-social ;
    - {amber}subjective{/amber}, perdue de vue par le marxisme scolaire : une {violet}critique des activités cognitives{/violet} en général, une critique de nos façons de penser.

    **« La philosophie », désormais entre guillemets**, nomme ce {red}discours de la mauvaise abstraction{/red}, idéaliste même sous des dehors matérialistes, et stérile. On en sort pour un mode de pensée dont le maître mot est {violet}critique{/violet} : non le rejet polémique, mais l'{green}élucidation généalogique{/green}, qui fait comprendre ce qu'on critique pour en dépasser les limites.

    ! Marx ne condamne pas l'abstraction, sans laquelle il n'y a pas de pensée : il condamne l'abstraction qu'on prend pour une chose.
  points:
  - id: philo2-l4-p1
    sentence: "__Le cas de Feuerbach le montre__ : on peut être matérialiste et rester ___ ; renverser l'inversion ne suffit pas."
    answer: "spéculatif"
    alt: ["speculatif"]
  - id: philo2-l4-p2
    sentence: "__Le vice plus profond de la philosophie__ : un usage ___ de l'abstraction, qui change l'universel pensé en entité réelle."
    answer: "acritique"
