- id: philo2-l6
  title: "Sortir de la philosophie, aller au fond de la chose"
  notes: |-
    **Sortir de la philosophie n'affaiblit pas l'exigence théorique : c'est l'inverse.** Il s'agit de passer des facilités d'un discours abstrait sur toute chose aux exigences d'une {green}intelligence précise du monde réel{/green}. Et ce travail précis ramène Marx, {coral}par une autre porte, sur le terrain philosophique{/coral}.

    **De la révolution à l'économie politique.** En 1848-1849, Marx anime les luttes, organise le mouvement communiste, écrit dans la *Nouvelle Gazette rhénane*, puis *Les Luttes de classes en France* et *Le 18 Brumaire de Louis Bonaparte*. Fixé à {sky}Londres{/sky} à partir de 1850, dans la misère, il reprend l'étude de l'économie commencée en 1843. Au milieu de {amber}1857{/amber}, il entreprend la {violet}critique de l'économie politique{/violet}, tâche essentielle à trois titres :
    - pour la {amber}classe ouvrière{/amber}, à qui il faut donner les moyens de comprendre son sort et les voies de son émancipation ;
    - pour la {amber}stratégie communiste{/amber} : Marx croit encore, après 1846-1848, à un lien de cause à effet entre {red}crise économique et révolution politique{/red}, conviction trop simple dont il devra se défaire ;
    - pour {amber}lui-même{/amber} : {teal}« Il est absolument nécessaire d'__aller au fond de la chose__ »{/teal}, écrit-il à Engels le 18 décembre 1857, alors qu'il travaille « comme un fou » aux *Grundrisse*.

    **La méthode, d'abord.** Il ne s'agit plus de polémiquer, comme dans le chapitre « La méthode de l'économie politique » de *Misère de la philosophie*, mais d'exposer de façon critique une science entière, dominée par {sky}Adam Smith{/sky} et {sky}David Ricardo{/sky}. D'où une {sky}Introduction{/sky} méthodologique, où sont en jeu des {violet}catégories logiques{/violet} : essence et phénomène, abstrait et concret, universel et particulier, objectif et subjectif.

    **L'exemple de l'argent.** Au début des *Grundrisse*, partant d'un livre du proudhonien {sky}Darimon{/sky}, Marx écrit une dizaine de pages sur « Genèse et essence de l'argent » : la « différence » entre aspects concrets et abstraits de la marchandise s'accentue en {violet}opposition et contradiction{/violet}, d'où déjà la possibilité des crises ; l'argent, simple représentant des valeurs, se pose comme valeur par excellence. Et il conclut : {teal}« Nous voyons donc comment il est immanent à l'argent d'__accomplir ses finalités__ bien qu'en même temps __il les nie__ ; de s'autonomiser face aux marchandises ; __étant moyen, de devenir fin__ ; […] »{/teal} Une simple analyse économique se présente comme un bouquet de {coral}processus dialectiques et de catégories logiques{/coral}.

    ! L'argent qui, « étant moyen », devient fin est un exemple de l'inversion que Marx dénonçait en philosophie, mais cette fois réelle : elle a lieu dans les choses, non dans la tête du philosophe.
