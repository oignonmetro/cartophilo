  - id: g-etre-naturel-l1-q1
    sentence: "L'homme comme vivant de chair et d'os, actif par ses forces, passif par ses besoins, qui a hors de lui les objets dont il vit, Marx l'appelle un être ___ (en allemand Naturwesen)."
    answer: naturel
    alt: []
  - id: g-etre-naturel-l1-q2
    sentence: "L'être qui a hors de lui des objets essentiels et qui est lui-même objet pour un autre, Marx l'appelle un être ___ (gegenständliches Wesen)."
    answer: objectif
    alt: []
  - id: g-etre-naturel-l1-q3
    sentence: "Marx forge la notion d'être naturel dans le troisième manuscrit de 1844, dans sa critique de ___."
    answer: Hegel
    alt: []
  - id: g-etre-naturel-l1-q4
    sentence: "« L'homme est immédiatement être de la ___ » (Manuscrits de 1844, troisième manuscrit)."
    answer: nature
    alt: []
  - id: g-etre-naturel-l1-q5
    sentence: "Pourvu de forces naturelles, de forces vitales, l'homme « est un être naturel ___ » (Manuscrits de 1844, troisième manuscrit)."
    answer: actif
    alt: []
  - id: g-etre-naturel-l1-q6
    sentence: "En qualité d'être naturel, en chair et en os, l'homme est, « pareillement aux animaux et aux plantes, un être ___, dépendant et limité » (Manuscrits de 1844, troisième manuscrit)."
    answer: passif
    alt: []
  - id: g-etre-naturel-l1-q7
    sentence: "Les forces de l'homme existent en lui « sous la forme de dispositions et de capacités, sous la forme d'___ » (Manuscrits de 1844, troisième manuscrit)."
    answer: inclinations
    alt: []
  - id: g-etre-naturel-l1-q8
    sentence: "« Être objectif, naturel, sensible, c'est la même chose qu'avoir en dehors de soi objet, nature, sens ou qu'être soi-même objet, nature, sens pour un ___ » (Manuscrits de 1844, troisième manuscrit)."
    answer: tiers
    alt: []
  - id: g-etre-naturel-l1-q9
    sentence: "« Le soleil est l'objet de la ___, un objet qui lui est indispensable et qui confirme sa vie » (Manuscrits de 1844, troisième manuscrit)."
    answer: plante
    alt: []
  - id: g-etre-naturel-l1-q10
    sentence: "La ___ est « le besoin avoué qu'a mon corps d'un objet qui se trouve en dehors de lui » (Manuscrits de 1844, troisième manuscrit)."
    answer: faim
    alt: []
  - id: g-etre-naturel-l1-q11
    sentence: "« Un être non-objectif est un ___ » (Manuscrits de 1844, troisième manuscrit)."
    answer: non-être
    alt: ["non être", "non-etre", "unwesen"]
  - id: g-etre-naturel-l1-q12
    sentence: "Un être non objectif est « un être non réel, non sensible, mais seulement pensé, c'est-à-dire seulement imaginé, un être d'___ » (Manuscrits de 1844, troisième manuscrit)."
    answer: abstraction
    alt: []
  - id: g-etre-naturel-l1-q13
    sentence: "« Avoir des sens signifie ___ » (Manuscrits de 1844, troisième manuscrit)."
    answer: souffrir
    alt: []
  - id: g-etre-naturel-l1-q14
    sentence: "Comme il est un être qui ressent sa souffrance, l'homme « est un être ___ » (Manuscrits de 1844, troisième manuscrit)."
    answer: passionné
    alt: ["passionne"]
  - id: g-etre-naturel-l1-q15
    sentence: "« La passion est la force essentielle de l'homme qui tend énergiquement vers son ___ » (Manuscrits de 1844, troisième manuscrit)."
    answer: objet
    alt: []
  - id: g-etre-naturel-l1-q16
    sentence: "« Souffrir » traduit le verbe allemand ___, qui veut d'abord dire pâtir, subir."
