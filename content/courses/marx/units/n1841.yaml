  - id: n1841-p9-4
    sentence: "Le premier type d'épigone, celui qui s'abrite derrière une grande figure du passé sans avoir de voix propre, redouble le défaut de la philosophie positive : de même que celle-ci retient le non-concept, cet épigone se contente d'emprunter, sans l'engendrer lui-même, la voix déjà constituée d'un système ___."
    answer: "passé"
    alt: []
  - id: n1841-p9-6
    sentence: "L'image du lilliputien, empruntée aux Voyages de Gulliver, désigne un être minuscule comparé à la stature du géant sur lequel il se tient : elle traduit la disproportion entre le point de vue infime de l'épigone et sa prétention à formuler une vérité ___."
    answer: "universelle"
    alt: []
  - id: n1841-p9-7
    sentence: "Le second type, le lilliputien juché sur le corps du géant, redouble le défaut du parti libéral : celui-ci croyait s'opposer au système hégélien depuis l'extérieur, alors qu'il n'en réalisait, sans le savoir, que les éléments ___."
    answer: "constitutifs"
    alt: []
  - id: n1841-p9-10
    sentence: "Installer le lilliputien dans « un tout petit coin de postérieur du géant », une partie du corps aussi éloignée que possible de la tête, siège de la raison et de la vision, alors même qu'il prétend avoir trouvé le point de vue universel, constitue un ___ organique volontairement souligné par Marx."
    answer: "contresens"
    alt: []
  - id: n1841-p9-12
    sentence: "Les cheveux et les ongles désignent, par métonymie, les parties du corps humain les plus périphériques et précisément non ___ : une matière que le corps produit et rejette continuellement à sa surface sans qu'elle participe à sa vie intérieure."
    answer: "vivantes"
    alt: []
  - id: n1841-p9-13
    sentence: "Les philosophes-excréments portent la logique de la satire à son terme radical : ils ne sont même plus une partie du corps, fût-elle morte ou périphérique, mais ce que le corps ___ hors de lui-même."
    answer: "expulse"
    alt: []
  - id: n1841-p9-16
    sentence: "Ce que la satire finale permet de conclure, rétrospectivement, sur l'accommodement des §1-§2 : l'insuffisance du principe n'était pas un défaut ponctuel affectant tel philosophe pris à part, mais la condition ___ de toute réalisation historique de la philosophie."
    answer: "structurelle"
    alt: []
