# Unité de texte (voir content/textes.md) : la note de la thèse de doctorat
# de 1841 sur les disciples de Hegel, importée depuis un jeu de cartes Quizlet
# puis structurée par paragraphe. Pas de §3 : écarté volontairement (sa phrase
# est citée dans le rappel du §4). Rappels, leçon d'introduction et
# cartes-explication ajoutées d'après l'explication linéaire fournie par
# l'utilisateur (2026-11-16) ; les citations de l'Introduction de 1844 suivent
# la traduction de l'unité n1844 (GEME).

id: n1841
title: Note sur les disciples de Hegel (1841)
subtitle: Thèse de doctorat, Ire partie, chapitre 4, note 2
icon: page
color: coral
intro: |-
  Note de la thèse de doctorat de 1841, la note 2 du chapitre 4 de la Ire partie,
  intitulé « Différence générale de principe entre la philosophie naturelle de
  Démocrite et celle d'Épicure ». Formellement rattachée à la comparaison entre
  Démocrite et Épicure, elle s'en écarte pour **régler ses comptes avec l'école
  hégélienne**, au moment où celle-ci se divise entre une droite et une gauche
  (division que Strauss a nommée en 1837) : Marx y prend position, en critique
  de son propre camp.
lessons:
- id: n1841-i1
  title: "Après Hegel : que devient une philosophie achevée ?"
  notes: |-
    **La note répond à une question : que devient** {violet}**la philosophie**{/violet} **quand** {amber}**un système total**{/amber} **semble l'avoir achevée ?** {sky}Hegel{/sky} meurt en 1831 ; dix ans plus tard, son école se divise, et {sky}Marx{/sky}, dans une note d'une thèse consacrée à {sky}Démocrite{/sky} et à {sky}Épicure{/sky}, règle ses comptes avec elle. Le détour n'est pas arbitraire : {yellow}Épicure vient après Aristote{/yellow}, c'est-à-dire après un grand système, comme {yellow}les jeunes-hégéliens viennent après Hegel{/yellow}.

    **La thèse :** {green}une philosophie achevée ne peut pas rester une pure théorie{/green}. Elle doit se tourner vers le monde, et {coral}elle ne s'y réalise qu'en perdant la forme de système{/coral} qui faisait sa force.

    **Les §1 et §2 critiquent une manière de lire Hegel** et lui substituent une méthode ; **le §4 énonce la loi** du passage de la théorie à la pratique ; **les §5 à §7 en suivent les conséquences**, dans le rapport de la philosophie au monde, dans les disciples, puis dans l'école ; **le §8 récapitule**, et **le §9 tourne à la satire**.

    | Mouvement | Lieu | Ce qui s'y joue |
    | écarter l'explication des thèses de Hegel par l'accommodement | §1 | Les disciples qui soupçonnent Hegel se contredisent, et oublient qu'il avait à son système un rapport vivant, eux un rapport de reflet. |
    | faire de l'accommodement le symptôme d'un principe insuffisant | §2 | Le disciple doit construire la forme essentielle de la conscience du maître, ce qui le conduit au-delà du système. |
    | lire cette mauvaise explication comme le signe d'une école qui s'émancipe | §3 | Soupçonner le maître marque le passage de la discipline à la liberté. |
    | énoncer la loi du passage de la théorie à la pratique | §4 | L'esprit théorique devenu libre se tourne en volonté contre le monde, mais sa pratique reste théorique : c'est la critique. |
    | décrire ce passage du côté de la philosophie et du monde | §5 | Le système devient un côté du monde, et la philosophie se réalise en perdant sa forme. |
    | décrire ce passage du côté des disciples | §6 | Leur exigence a deux tranchants, contre le monde et contre la philosophie, et ils réalisent le système en croyant le combattre. |
    | suivre ce passage dans l'école, qui se scinde en deux partis | §7 | Le parti libéral critique le monde, la philosophie positive veut corriger la philosophie, et seul le premier progresse. |
    | récapituler les trois ruptures | §8 | La rupture avec le monde devient rupture de la conscience avec elle-même, puis séparation en deux tendances. |
    | caricaturer les épigones | §9 | Les figures subalternes poussent au grotesque les défauts des deux partis, où elles rentrent toutes. |

    **Le fil : une seule idée, à des échelles de plus en plus larges.** {amber}Une limite visible renvoie toujours à une insuffisance du principe{/amber}. Chez un philosophe, cette insuffisance apparaît comme {violet}accommodement{/violet} (§1-2) ; dans le système face au monde, comme le fait que la philosophie combat au-dehors son propre défaut (§4-5) ; chez les disciples, comme une exigence contradictoire (§6) ; dans l'école, comme la scission en deux partis (§7), puis la prolifération des épigones (§9). Passer de l'accommodement au rapport de la philosophie et du monde, ce n'est donc {red}pas changer de sujet{/red}, mais {green}changer d'échelle{/green}. La note, qui commence par défendre Hegel contre ses disciples, finit par expliquer pourquoi {coral}la dissolution de son école était nécessaire{/coral}, sans que ni Hegel ni ses disciples en soient moralement responsables.

    ! La note ne porte ni sur Démocrite ni sur Épicure : elle parle de Hegel et de son école, et à travers eux du destin de tout système achevé.
