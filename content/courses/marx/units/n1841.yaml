- id: n1841-p7
  title: "La scission en deux partis"
  passage:
    label: "§7"
    text: "Finalement, ce dédoublement de la conscience philosophique se manifeste sous l'aspect d'une double tendance marquée d'un antagonisme extrême ; l'une, que nous pouvons désigner d'une façon générale comme le parti libéral, s'attache au concept et au principe de la philosophie ; l'autre en retient comme caractère déterminant le non-concept, l'élément de la réalité. Cette seconde tendance est la philosophie positive. La première a pour activité la critique, donc précisément le mouvement de la philosophie vers l'extérieur ; la seconde agit en essayant de philosopher, donc d'intérioriser la philosophie, sachant que l'insuffisance est inhérente à la philosophie, tandis que la première tendance la conçoit comme insuffisance du monde qu'il convient de rendre philosophique. Chacun de ces partis fait exactement ce que l'autre voudrait faire et ce qu'il refuse de faire lui-même. Mais le premier, malgré sa contradiction interne, a, d'une façon générale, conscience du principe et il connaît son but. Dans le second, l'absurdité — on pourrait dire la folie — se manifeste en tant que telle. Fondamentalement, seul le parti libéral, parce que parti du concept, aboutit à des progrès réels, tandis que la philosophie positive ne parvient qu'à des revendications et des tendances dont la forme contredit la signification."
  points:
  - id: n1841-p7-1
    fragment: "1/2"
    sentence: "« Finalement, ce dédoublement de la conscience philosophique se manifeste sous l'aspect d'une double tendance marquée d'un antagonisme extrême ; l'une, que nous pouvons désigner d'une façon générale comme le parti libéral, s'attache au ___ ; l'autre en retient comme caractère déterminant le ___, l'élément de la réalité. Cette seconde tendance est la philosophie positive. »"
