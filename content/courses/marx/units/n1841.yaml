- id: n1841-p9
  title: "La satire des épigones"
  notes: |-
    **Après l'analyse, la satire : elle n'ajoute aucune catégorie, elle pousse à la caricature les défauts des deux partis.** Marx le dit lui-même à la fin : {teal}« Tous ces mollusques vont cependant rentrer dans les deux tendances indiquées ci-dessus »{/teal}. Le paragraphe donne {amber}deux portraits{/amber}, puis {amber}une anatomie burlesque{/amber} du système.

    === 1 L'emprunteur de voix

    **Le premier épigone** {teal}**« s'abrite derrière une gigantesque figure philosophique du passé »**{/teal}**.** {yellow}L'âne sous la peau du lion{/yellow} vient de la fable d'{sky}Ésope{/sky}, reprise par {sky}La Fontaine{/sky} : l'âne qui s'est revêtu d'une peau de lion fait illusion jusqu'au moment où il se met à braire. De même l'épigone se pare d'un grand nom, mais sa {teal}« voix pleurarde »{/teal} le trahit, en {teal}« contraste comique »{/teal} avec la voix puissante d'Aristote. Le {yellow}« mannequin d'aujourd'hui et de naguère »{/yellow} est une figure sans vie propre, qui parle par la bouche d'un autre, et datée : elle appartient au présent, quand la voix d'Aristote traverse les siècles. Il est comme {yellow}un muet armé d'un énorme porte-voix{/yellow} : un porte-voix amplifie une voix, il n'en donne pas à qui n'en a pas.

    On peut y voir, sans que Marx le dise, une caricature de {coral}la philosophie positive{/coral} : comme elle prend la réalité donnée pour norme au lieu de la penser, l'épigone prend une pensée déjà constituée pour la sienne au lieu de penser lui-même. Il pousse aussi à l'extrême {pink}le rapport de reflet{/pink} du §1 : il n'a même plus un rapport extérieur à une pensée vivante, il n'en est que l'écho vide.

    === 2 Le lilliputien sur le géant

    **Le second épigone est** {yellow}**un lilliputien**{/yellow}**,** d'après les *Voyages de Gulliver* de {sky}Swift{/sky}, où les habitants de Lilliput sont minuscules à côté du géant Gulliver. Ici, {amber}le géant est le système hégélien{/amber}. {yellow}Les doubles lunettes{/yellow} disent la myopie, qui ne voit que le détail tout proche. Depuis son {blue}*punctum visus*{/blue}, son « point de vue », le lilliputien prétend avoir trouvé {yellow}le point d'Archimède{/yellow}, {blue}*pou stô*{/blue}, d'après le mot attribué à Archimède : « donne-moi un point où me tenir et je soulèverai la terre ». Le ridicule tient à {coral}la disproportion{/coral} entre ce point de vue infime et dérivé, qui n'existe que posé sur le géant, et la prétention de fonder l'univers.

    Il cherche ce point fixe non {teal}« dans les flots du cœur »{/teal}, mais {teal}« sur le terrain ferme et solide où il s'est posté »{/teal}. On peut y lire un écho du §1 : la vie du système était le sang qui affluait jusqu'à ses confins ; le lilliputien cherche la vérité non au cœur, d'où part ce sang, mais sur la surface inerte où il s'est installé. Le lilliputien reproduit {coral}l'illusion des disciples du §6{/coral} : il croit dominer le géant alors qu'il est assis sur lui, comme eux croient s'opposer au système de l'extérieur alors qu'ils n'en réalisent que les éléments.

    === 3 Le corps du système, du vivant au déchet

    **Marx loge chaque épigone dans le corps du système.** {sky}Swedenborg{/sky}, mystique suédois du XVIIIe siècle, se représentait le monde spirituel comme un grand homme, dont chaque région correspond à une partie du corps humain ; Marx applique ironiquement l'image au système hégélien. {yellow}Les cheveux et les ongles{/yellow} sont des parties périphériques et non vivantes, que le corps produit et rejette à sa surface : des penseurs qui ne gardent du système qu'un résidu mort. {yellow}Les orteils{/yellow} sont la partie la plus éloignée de la tête, pour qui prétend au point de vue universel. {yellow}Les excréments{/yellow} ne sont même plus une partie du corps, mais ce qu'il expulse. {yellow}« Mollusques »{/yellow} achève le portrait : des êtres sans squelette, sans structure propre, qui ne tiennent que par le corps auquel ils s'attachent.

    **La gradation prolonge jusqu'au grotesque la logique de l'accommodement.** Les deux partis du §7 amputaient chacun le mouvement d'une de ses faces ; les épigones ne retiennent plus du système qu'un fragment détaché, puis un déchet. Elle confirme le §2 : l'insuffisance qui se montre dans l'accommodement n'était pas le défaut d'un individu, mais {coral}la condition structurelle de toute réalisation historique d'une philosophie{/coral}, que des consciences finies ne portent qu'en la mutilant. Marx annonce enfin, sur les deux tendances et leur rapport à Hegel, une explication complète que la thèse ne donne pas.

    ! La satire n'est pas une digression : tous les épigones rentrent dans les deux tendances du §7. Mais Marx ne range pas lui-même chaque portrait dans un parti.
  passage:
    label: "§9"
    text: "Il va de soi que, de surcroît, émergent en foule des figures subalternes, grincheuses, dépourvues d'individualité, qui, ou bien s'abritent derrière une gigantesque figure philosophique du passé (mais l'on découvre bientôt l'âne sous la peau du lion, la voix pleurarde d'un mannequin d'aujourd'hui et de naguère se lamente, contraste comique avec la voix puissante qui traverse les siècles, celle d'Aristote, par exemple, dont elle s'est faite l'organe mal venu : imaginons un muet s'efforçant de retrouver la parole en s'aidant d'un énorme porte-voix) ; ou bien, armé de doubles lunettes, quelque lilliputien, installé dans un tout petit coin de postérieur du géant, annonce tout émerveillé au monde quelle nouvelle et surprenante perspective s'offre de son *punctum visus*, s'évertuant, non sans ridicule, à démontrer que ce n'est point dans les flots du cœur, mais sur le terrain ferme et solide où il s'est posté, que se trouve le point d'Archimède, ποῦ στῶ, où l'univers est suspendu à des gonds. Et c'est ainsi que naissent des philosophes-cheveux, des philosophes-ongles, des philosophes-orteils, des philosophes-excréments et d'autres qui doivent représenter un lieu pire encore dans le mystique homme-univers de Swedenborg. Tous ces mollusques vont cependant rentrer dans les deux tendances indiquées ci-dessus, qui sont leur élément."
