- id: n1841-p2
  title: "La véritable nature de l'accommodement"
  notes: |-
    **Marx ne nie pas l'accommodement : il en change le sens.** Un philosophe peut commettre une {teal}« inconséquence apparente »{/teal} par accommodement, et même le savoir. Mais ce qui importe n'est pas ce dont il a conscience : c'est {amber}ce dont il n'a pas conscience{/amber}. Le paragraphe a deux temps : l'accommodement devient {coral}le symptôme d'un principe insuffisant{/coral}, puis {coral}la tâche du disciple{/coral} est redéfinie.

    === 1 L'accommodement, symptôme d'un principe insuffisant

    **Si un philosophe peut s'accommoder sur un point, c'est que son principe le lui permet.** __Un principe parfaitement développé et parfaitement compris ne laisserait aucune place à la transaction__. La {amber}possibilité{/amber} même de l'accommodement est donc le symptôme d'une faille : {teal}« une insuffisance de son principe même »{/teal}, ou {teal}« la compréhension insuffisante de ce principe »{/teal}. L'accommodement n'est {red}jamais un accident psychologique{/red} : c'est {green}l'endroit où un système laisse voir sa propre limite{/green}. Ce que les disciples prennent pour {pink}un défaut de caractère{/pink} est {coral}un défaut de doctrine{/coral}, et ce défaut est philosophiquement instructif.

    D'où deux niveaux dans la pensée d'un philosophe. Sa {violet}conscience « exotérique »{/violet} est celle qu'il exprime et destine au public, tournée vers l'extérieur, avec ses simplifications, ses prudences et ses formules de circonstance. Sa {violet}conscience « intime et essentielle »{/violet} est la logique profonde de son principe, qu'il n'aperçoit pas toujours lui-même entièrement.

    ! La « conscience intime et essentielle » n'est pas {red}une intention secrète{/red} que le philosophe cacherait : c'est {green}la logique de son principe{/green}, dont il n'a pas pleinement conscience. Marx reprend le vocabulaire de l'ésotérique et de l'exotérique, mais le retourne contre la lecture du soupçon.

    === 2 La tâche du disciple : construire, donc dépasser

    **Le bon disciple ne suspecte pas** {red}**la « conscience particulière »**{/red} **du philosophe** (ses motifs, sa prudence) **: il construit** {green}**« la forme essentielle de sa conscience »**{/green}**.** Il part de la conscience exotérique pour reconstruire la conscience essentielle, et il lui donne {teal}« une figure et une signification déterminées »{/teal}, plus nettes que celles que le maître avait pu lui donner.

    Ce travail n'est pas une simple exégèse : ce qui semble n'être qu'{amber}un progrès de la conscience{/amber} des disciples, devenus plus lucides que le maître, est {teal}« en même temps un progrès du savoir »{/teal}, un progrès de la science elle-même, puisqu'il met au jour ce que le système contenait sans le savoir, ses insuffisances comprises. Et {teal}« ce faisant, on va au-delà de ce que l'on a construit »{/teal} : expliciter entièrement un système, c'est rendre visible la limite de son principe, et {coral}on ne voit une limite qu'en se plaçant déjà au-delà d'elle{/coral}.

    **Ce que la suite de la note permet d'ajouter** (une lecture, que le §2 ne formule pas lui-même). L'insuffisance du principe hégélien tient à ce qu'il se donne pour {amber}une totalité close{/amber} (§5) : un système achevé exige, pour se réaliser, d'être porté tout entier, avec ses deux faces : le mouvement critique vers l'extérieur et la mondanisation de son contenu. Or il n'est porté que par {amber}des consciences finies{/amber} (le philosophe, puis ses disciples), qui ne peuvent en assumer toutes les exigences à la fois : chacune en retient une part et abandonne l'autre. Accommoder, en ce sens, ce n'est {red}pas transiger par calcul{/red} : c'est {coral}amputer le système d'une de ses dimensions pour pouvoir le porter{/coral}. Toute l'histoire de l'école hégélienne (§7, §9) se lit comme une suite de telles amputations, de plus en plus graves.

    ! La question n'est plus de savoir ce que Hegel pensait en secret, mais ce qui arrive à un système quand ses disciples le poussent jusqu'à ses limites.
  passage:
    label: "§2"
    text: "On peut concevoir qu'un philosophe commette telle ou telle inconséquence apparente en raison de tel accommodement ; il se peut qu'il en ait lui-même conscience. Toutefois, ce dont il n'a pas conscience, c'est que la possibilité de cet accommodement apparent ait sa racine la plus intime dans une insuffisance de son principe même ou dans la compréhension insuffisante de ce principe. Et quand même un philosophe se serait réellement accommodé, il incombe à ses disciples d'expliquer, *en scrutant sa conscience intime et essentielle*, ce qui n'avait *pour lui-même* que la forme d'une *conscience exotérique*. De cette façon, ce qui apparaît comme un progrès de la conscience devient en même temps un progrès du savoir. Ce n'est pas la conscience particulière du philosophe que l'on suspecte alors ; c'est la forme essentielle de sa conscience que l'on construit, en l'élevant à une figure et à une signification déterminées ; ce faisant, on va au-delà de ce que l'on a construit."
