- id: n1841-p6
  title: "La double exigence des consciences individuelles"
  passage:
    label: "§6"
    text: "Voilà l'un des côtés, si nous considérons le problème de manière purement objective, comme une réalisation immédiate de la philosophie. Mais il a aussi — et ce n'en est qu'un autre aspect — un côté subjectif. C'est le rapport du système philosophique, qui se réalise, à ses représentants intellectuels, avec les consciences individuelles qui font apparaître son progrès. De ce rapport qu'implique cette réalisation de la philosophie en face du monde, il résulte que ces consciences individuelles ont toujours une exigence à deux tranchants, dont l'un se tourne contre le monde et l'autre contre la philosophie elle-même. En effet, ce qui, dans l'objet, apparaît comme un rapport en soi renversé, se manifeste en ces représentants comme une double exigence et action contradictoire en soi-même. En libérant le monde de la non-philosophie, ils se libèrent eux-mêmes de la philosophie qui, comme système déterminé, les avaient chargés de fers. Étant encore eux-mêmes engagés dans l'acte et dans l'énergie immédiate de l'évolution ; donc, n'ayant pas dépassé ce système sous le rapport de la théorie, ils éprouvent seulement ce qui les oppose au système, à son intégrité sculpturale, sans s'apercevoir qu'en se tournant contre lui, ils ne font qu'en réaliser les divers éléments."
