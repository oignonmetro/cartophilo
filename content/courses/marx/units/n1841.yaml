- id: n1841-p9
  title: "La satire des épigones"
  passage:
    label: "§9"
    text: "Il va de soi que, de surcroît, émergent en foule des figures subalternes, grincheuses, dépourvues d'individualité, qui, ou bien s'abritent derrière une gigantesque figure philosophique du passé (mais l'on découvre bientôt l'âne sous la peau du lion, la voix pleurarde d'un mannequin d'aujourd'hui et de naguère se lamente, contraste comique avec la voix puissante qui traverse les siècles, celle d'Aristote, par exemple, dont elle s'est faite l'organe mal venu : imaginons un muet s'efforçant de retrouver la parole en s'aidant d'un énorme porte-voix) ; ou bien, armé de doubles lunettes, quelque lilliputien, installé dans un tout petit coin de postérieur du géant, annonce tout émerveillé au monde quelle nouvelle et surprenante perspective s'offre de son punctum visus, s'évertuant, non sans ridicule, à démontrer que ce n'est point dans les flots du cœur, mais sur le terrain ferme et solide où il s'est posté, que se trouve le point d'Archimède, ποῦ στῶ, où l'univers est suspendu à des gonds. Et c'est ainsi que naissent des philosophes-cheveux, des philosophes-ongles, des philosophes-orteils, des philosophes-excréments et d'autres qui doivent représenter un lieu pire encore dans le mystique homme-univers de Swedenborg. Tous ces mollusques vont cependant rentrer dans les deux tendances indiquées ci-dessus, qui sont leur élément."
