- id: n1841-p5
  title: "La dialectique de la réalisation et de la perte de la philosophie"
  notes: |-
    **Le paragraphe décrit ce qui arrive au système au moment où il se tourne contre le monde,** {amber}**du côté objectif**{/amber}**, indépendamment des individus qui le portent.** Il a deux temps : {amber}la déchéance du système{/amber}, qui n'est plus qu'un côté du monde ; puis {amber}la série de formules paradoxales{/amber} qui en tire les conséquences.

    === 1 Le système devenu un côté du monde

    **En s'opposant au monde, le système cesse d'être** {pink}**le tout**{/pink} **pour devenir** {coral}**une partie**{/coral}**.** Tant qu'il restait en lui-même, il prétendait dire la vérité de tout le réel, sans rien hors de lui. Opposé au monde, il n'est plus qu'un {teal}« côté »{/teal}, face à un autre côté qui ne se laisse pas absorber. Il est {teal}« ravalé »{/teal}, et le mot dit une déchéance : il reste une {violet}totalité{/violet}, puisqu'il garde sa cohérence interne, mais une totalité {violet}« abstraite »{/violet}, séparée de ce qu'elle prétendait englober. Son rapport au monde devient un {violet}« rapport de réflexion »{/violet} : une opposition entre deux termes extérieurs l'un à l'autre, qui se mesurent l'un à l'autre, au lieu d'une unité immédiate. Le mot fait écho au §1, où les disciples n'avaient au système qu'un rapport « de reflet » : l'original emploie le même mot, *Reflexion*. Dans les deux cas, {pink}une unité immédiate est perdue{/pink} (le philosophe vivant dans son système, le système embrassant le monde) au profit d'{coral}un rapport extérieur{/coral}. C'est la différence entre {yellow}savoir nager en théorie{/yellow} et {yellow}se jeter dans une eau réelle{/yellow}, qui a ses propres courants.

    Le système {teal}« entre en conflit avec autrui »{/teal} : {violet}autrui{/violet} ne désigne pas d'autres personnes, mais {amber}l'autre du système{/amber}, le monde qui lui fait face. La rupture se dit en termes presque affectifs : {teal}« le contentement de soi et l'harmonie sont rompus »{/teal}. Puis en une image : {yellow}« ce qui fut lumière intérieure devient flamme dévorante »{/yellow}. La même énergie change de nature selon sa direction : tournée vers l'intérieur, elle éclairait (la philosophie se comprenait elle-même) ; tournée vers l'extérieur, elle brûle (elle attaque ce qui lui résiste).

    === 2 Les formules du paradoxe

    **Première formule : les deux devenirs sont un seul mouvement.** {amber}Le monde devient philosophique{/amber} : critiqué, il doit se justifier devant la raison, et ce qui ne le peut pas perd sa légitimité. C'est, dans l'Allemagne des années 1830 et 1840, le travail de la critique jeune-hégélienne, qui confronte la religion établie et l'État prussien aux principes hérités de Hegel ({sky}Bruno Bauer{/sky} contre la théologie, {sky}Feuerbach{/sky} contre la religion). {amber}La philosophie devient monde{/amber} : appliquée à des objets concrets et contingents, elle cesse d'être une pensée pure pour devenir une force parmi d'autres dans le débat public, avec ses articles de presse, ses polémiques, ses partis pris. Elle s'incarne, se particularise, se {violet}mondanise{/violet}.

    **Deuxième formule :** {green}**« la réalisation de la philosophie est en même temps sa perte »**{/green}**.** Ce qui se perd est une forme précise, celle {pink}du système clos{/pink}, total, séparé du monde ; ce qui se réalise est {coral}l'effectivité{/coral} : une vérité qui n'était que pensée devient agissante. Le gain et la perte sont {amber}un seul mouvement, vu de deux côtés{/amber}. Ce qui subsiste est une forme intermédiaire, dispersée et partisane, qui garde quelque chose du contenu rationnel sans plus le porter dans sa totalité.

    **Troisième formule : la philosophie combat au-dehors son propre défaut.** La clé est dans {violet}les « facteurs inversés »{/violet}, image d'un rapport dont on intervertit les termes : __la philosophie est de la raison sans réalité, le monde de la réalité sans raison__. Chacun manque de ce que l'autre possède, et le défaut est le même, {coral}une séparation entre raison et réalité{/coral}, vue d'un côté ou de l'autre. Quant aux {yellow}« tares »{/yellow}, l'image est celle de la contamination : en combattant un monde partiel, borné, partisan, la philosophie, qui n'est plus qu'un côté du monde, devient elle-même partielle, bornée, partisane. Elle ne peut pas faire autrement : c'est seulement en entrant dans le monde qu'elle peut le transformer, et elle n'efface donc ces tares {teal}« qu'en les contractant »{/teal}.

    ! « Autrui » ne désigne pas d'autres hommes : c'est l'autre du système, le monde.

    ! La « perte » n'est ni la disparition de toute philosophie ni une simple image : c'est la perte de la forme du système clos.

    ! « Transformer » le monde n'a pas encore le sens de la XIe thèse sur Feuerbach (1845) : en 1841, la philosophie le transforme par la critique, en changeant la manière dont il est jugé et contraint de se justifier.
  passage:
    label: "§5"
    text: "Puisque la philosophie se dresse en tant que volonté contre le monde des phénomènes, le système est ravalé à une totalité abstraite ; autrement dit, il est devenu un côté du monde, auquel s'oppose un autre côté. Son rapport au monde est un rapport de réflexion. Animé du désir de se réaliser, le système entre en conflit avec autrui. Le contentement de soi et l'harmonie sont rompus. Ce qui fut lumière intérieure devient flamme dévorante qui se tourne vers l'extérieur. La conséquence en est que le devenir-philosophique du monde est en même temps un devenir-monde de la philosophie ; que la réalisation de la philosophie est en même temps sa perte ; que ce qu'elle combat à l'extérieur, c'est son propre défaut intérieur ; que c'est précisément en luttant qu'elle contracte elle-même les tares qu'elle combat chez son adversaire, et qu'elle ne peut effacer ces tares qu'en les contractant. Ce qui l'affronte et ce qu'elle combat, c'est toujours ce qu'elle est elle-même, seulement avec des facteurs inversés."
