- id: n1841-p2
  title: "La véritable nature de l'accommodement"
  passage:
    label: "§2"
    text: "On peut concevoir qu'un philosophe commette telle ou telle inconséquence apparente en raison de tel accommodement ; il se peut qu'il en ait lui-même conscience. Toutefois, ce dont il n'a pas conscience, c'est que la possibilité de cet accommodement apparent ait sa racine la plus intime dans une insuffisance de son principe même ou dans la compréhension insuffisante de ce principe. Et quand même un philosophe se serait réellement accommodé, il incombe à ses disciples d'expliquer, en scrutant sa conscience intime et essentielle, ce qui n'avait pour lui-même que la forme d'une conscience exotérique. De cette façon, ce qui apparaît comme un progrès de la conscience devient en même temps un progrès du savoir. Ce n'est pas la conscience particulière du philosophe que l'on suspecte alors ; c'est la forme essentielle de sa conscience que l'on construit, en l'élevant à une figure et à une signification déterminées ; ce faisant, on va au-delà de ce que l'on a construit."
