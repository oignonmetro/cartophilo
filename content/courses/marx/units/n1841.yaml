- id: n1841-p6
  title: "La double exigence des consciences individuelles"
  notes: |-
    **Marx passe du système aux personnes : c'est le même processus,** {amber}**vu du côté subjectif**{/amber}**.** Le processus du §5 passe par des {teal}« représentants intellectuels »{/teal}, les consciences individuelles qui portent le progrès du système : les disciples, et Marx parmi eux. Ce n'est {red}pas un second phénomène{/red}, mais {teal}« un autre aspect »{/teal} du même : ce qui, dans l'objet, est {amber}un rapport renversé{/amber} (la philosophie et le monde, chacun le défaut inversé de l'autre) devient, dans les sujets, {amber}une double exigence{/amber}. Trois temps : l'exigence à deux tranchants ; la double libération ; l'illusion des disciples.

    === 1 Une exigence à deux tranchants

    **L'exigence des disciples coupe des deux côtés à la fois.** Le premier tranchant est {coral}la critique du monde{/coral} : soumettre les croyances et les institutions à l'examen rationnel. Le second est {coral}la critique de la philosophie elle-même{/coral}, plus exactement de sa forme de système clos : exiger qu'elle cesse d'être une doctrine achevée, repliée sur soi, pour devenir une activité engagée dans le monde. Les deux exigences ne sont pas indépendantes : __on ne peut critiquer effectivement le monde sans faire éclater la clôture du système__, et faire éclater cette clôture, c'est déjà se tourner vers le monde.

    === 2 Libérer le monde, se libérer du système

    **En libérant le monde de** {violet}**la non-philosophie**{/violet}**, les disciples se libèrent de la philosophie comme système.** La non-philosophie est l'état de ce qui subsiste sans justification rationnelle, simplement parce que cela existe : {yellow}une croyance tenue pour vraie par habitude, une institution acceptée comme allant de soi{/yellow}. Si la philosophie se prétend vraie universellement, tout ce qui lui échappe devient injustifiable : le monde doit s'en libérer, {red}non par un devoir moral imposé du dehors{/red}, mais {green}par la logique même de la prétention philosophique à l'universalité{/green}.

    Or, en libérant le monde, les disciples se libèrent eux-mêmes. Le système les avait {yellow}« chargés de fers »{/yellow} : l'image renvoie à la discipline du §3, l'école tient ses élèves comme des prisonniers. Il cesse de les enchaîner dès qu'ils {coral}s'en servent comme d'une arme{/coral} au lieu de le révérer comme une doctrine.

    === 3 L'illusion : réaliser le système en croyant le combattre

    **Cette libération est illusoire en un point : les disciples n'ont pas dépassé le système** {amber}**« sous le rapport de la théorie »**{/amber}**.** Encore pris {teal}« dans l'acte et dans l'énergie immédiate de l'évolution »{/teal}, ils agissent et combattent sans le recul qui leur ferait voir ce qu'ils font. Ce qu'ils rejettent, c'est {yellow}l'« intégrité sculpturale »{/yellow} du système : une statue, œuvre achevée, d'un seul bloc, figée, par opposition à la pensée en devenir qu'il était pour Hegel (§1). Ils croient ainsi le combattre de l'extérieur. Or leurs armes (les concepts de {violet}raison{/violet}, de {violet}liberté{/violet}, d'{violet}esprit{/violet}, de {violet}critique{/violet}) viennent du système lui-même : en le brisant, ils dispersent ses éléments dans le monde, c'est-à-dire {coral}réalisent ce qu'il contenait déjà{/coral}. Leur opposition est réelle sous le rapport pratique, mais elle reste {coral}immanente au système{/coral} sous le rapport théorique.

    ! Marx décrit ici l'illusion de son propre camp : solidaire du combat jeune-hégélien, il en est déjà le critique, ce qui annonce ses ruptures avec ses anciens compagnons.
  passage:
    label: "§6"
    text: "Voilà l'un des côtés, si nous considérons le problème *de manière purement objective*, comme une réalisation immédiate de la philosophie. Mais il a aussi — et ce n'en est qu'un autre aspect — un côté *subjectif*. C'est *le rapport du système philosophique, qui se réalise, à ses représentants intellectuels*, avec les consciences individuelles qui font apparaître son progrès. De ce rapport qu'implique cette réalisation de la philosophie en face du monde, il résulte que ces consciences individuelles ont toujours une *exigence à deux tranchants*, dont l'un se tourne contre le monde et l'autre contre la philosophie elle-même. En effet, ce qui, dans l'objet, apparaît comme un rapport en soi renversé, se manifeste en ces représentants comme une double exigence et action contradictoire en soi-même. En libérant le monde de la non-philosophie, ils se libèrent eux-mêmes de la philosophie qui, comme système déterminé, les avaient chargés de fers. Étant encore eux-mêmes engagés dans l'acte et dans l'énergie immédiate de l'évolution ; donc, n'ayant pas dépassé ce système sous le rapport de la théorie, ils éprouvent seulement ce qui les oppose au système, à son intégrité sculpturale, sans s'apercevoir qu'en se tournant contre lui, ils ne font qu'en réaliser les divers éléments."
