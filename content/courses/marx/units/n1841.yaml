- id: n1841-p7
  title: "La scission en deux partis"
  notes: |-
    **La double exigence, qui était une tension dans chaque conscience, devient une division entre deux partis.** Le devenir-philosophique du monde et le devenir-monde de la philosophie sont un seul mouvement, mais son unité ne se maintient pas quand il passe à l'existence : {amber}des consciences finies ne peuvent en assumer toutes les exigences à la fois{/amber}, et chacune en privilégie une. L'accommodement, au sens du §2, prend ici une forme historique : {coral}chaque parti ampute le mouvement d'une de ses deux faces{/coral}. La scission ne rompt donc pas le processus dialectique : elle en est la forme historique nécessaire, l'unité ne passant à l'existence que par des moments partiels et opposés.

    | Trait | Parti libéral | Philosophie positive |
    | ce qu'il retient | le concept | le non-concept |
    | son activité | la critique | philosopher |
    | son mouvement | vers l'extérieur | intérioriser |
    | où est l'insuffisance | dans le monde | dans la philosophie |
    | ce qu'il accomplit sans le vouloir | montrer l'insuffisance de la philosophie | rendre le monde philosophique |
    | le verdict de Marx | des progrès réels | la folie |

    === 1 Deux partis, deux noms à ne pas mal entendre

    **Le** {violet}**parti libéral**{/violet} **n'est ni une doctrine économique ni un parti politique au sens moderne :** c'est le parti de la liberté et de la critique, en gros les jeunes-hégéliens ({sky}Bruno Bauer{/sky} et son entourage berlinois, que Marx fréquente alors). Il s'attache au {violet}concept{/violet} : non une simple idée générale, mais ce qui est compris et justifié par la raison, ce dont on peut rendre compte.

    **La** {violet}**philosophie positive**{/violet} **a un sens historique précis :** c'est le nom que le dernier {sky}Schelling{/sky} donne à sa propre philosophie, opposée à la philosophie « négative », purement rationnelle, de Hegel, et défendue avec lui par des théistes spéculatifs. Schelling est d'ailleurs appelé à Berlin en 1841 pour y combattre l'influence hégélienne. Contre le primat du concept, elle part du {violet}non-concept{/violet} : la réalité donnée, positive (la révélation, l'existence, le fait), que la raison ne peut pas produire.

    ! « Libéral » ne désigne pas ici le libéralisme économique, et la philosophie positive ne se confond pas sans nuance avec les « vieux-hégéliens ».

    === 2 Où chacun situe l'insuffisance

    **Les deux partis se répartissent les deux tranchants de l'exigence du §6.** Le parti libéral situe l'insuffisance {amber}dans le monde{/amber}, qu'il faut rendre philosophique : son activité est {coral}la critique{/coral}, {teal}« le mouvement de la philosophie vers l'extérieur »{/teal}. La philosophie positive la situe {amber}dans la philosophie{/amber}, qui ne contient pas la réalité donnée : son activité est de {teal}« philosopher »{/teal}, c'est-à-dire de {teal}« intérioriser la philosophie »{/teal}, de la corriger du dedans en y faisant entrer ce qu'elle ne produit pas. On retrouve les {violet}« facteurs inversés »{/violet} du §5 : chacun voit le défaut d'un seul côté du rapport entre raison et réalité.

    === 3 Le chiasme : chacun fait ce que veut l'autre

    **Chaque parti accomplit, sans le vouloir, le programme de l'autre.** Le parti libéral {red}refuse de tenir la philosophie pour insuffisante{/red} : il la croit vraie et veut seulement la réaliser. Mais en critiquant le monde, il fait éclater la forme du système (§5-6), et {coral}montre ainsi l'insuffisance de la philosophie{/coral}, ce que soutenait la philosophie positive. Celle-ci {pink}refuse de soumettre le monde au concept{/pink}. Mais en voulant faire entrer dans la philosophie la réalité donnée (la révélation, l'existence), elle en fait un objet de philosophie : {coral}elle rend le monde philosophique{/coral}, ce que voulait le parti libéral. D'où la formule : chacun {teal}« fait exactement ce que l'autre voudrait faire et ce qu'il refuse de faire lui-même »{/teal}.

    ! Ce chiasme est une interprétation : Marx l'énonce sans le détailler.

    === 4 Le verdict : deux contradictions inégales

    **Marx ne renvoie pourtant pas les deux partis dos à dos.** Le parti libéral a sa {teal}« contradiction interne »{/teal}, celle des §5 et §6 : {amber}en voulant réaliser la philosophie, il la perd comme système{/amber}, et il croit s'opposer au système de l'extérieur alors qu'il en déploie les éléments. Réduit à la critique, il s'en tient aussi à {pink}un rapport négatif au monde{/pink}, qui juge et dénonce sans accomplir l'autre moitié du mouvement. Mais il a {green}conscience du principe et connaît son but{/green} : parti du concept, il est le seul à faire {coral}des progrès réels{/coral}.

    Dans la philosophie positive, au contraire, {teal}« l'absurdité »{/teal}, {red}« la folie »{/red}, {teal}« se manifeste en tant que telle »{/teal} : sa contradiction est à découvert. Elle garde {red}la forme du discours philosophique{/red} (raisonner, démontrer, fonder) en abandonnant son contenu, l'exigence critique de rendre raison : elle parle le langage du concept pour justifier ce qui, par définition, échappe au concept. C'est en ce sens que {teal}« la forme contredit la signification »{/teal}.

    La différence entre les deux contradictions est donc que celle du parti libéral est {green}consciente d'elle-même et orientée{/green}, tandis que celle de la philosophie positive {red}s'ignore{/red}.
  passage:
    label: "§7"
    text: "Finalement, ce dédoublement de la conscience philosophique se manifeste sous l'aspect d'une double tendance marquée d'un antagonisme extrême ; l'une, que nous pouvons désigner d'une façon générale comme le *parti libéral*, s'attache au concept et au principe de la philosophie ; l'autre en retient comme caractère déterminant le *non-concept*, l'élément de la réalité. Cette seconde tendance est la *philosophie positive*. La première a pour activité la critique, donc précisément le mouvement de la philosophie vers l'extérieur ; la seconde agit en essayant de philosopher, donc d'intérioriser la philosophie, sachant que l'insuffisance est inhérente à la philosophie, tandis que la première tendance la conçoit comme insuffisance du monde qu'il convient de rendre philosophique. Chacun de ces partis fait exactement ce que l'autre voudrait faire et ce qu'il refuse de faire lui-même. Mais le premier, malgré sa contradiction interne, a, d'une façon générale, conscience du principe et il connaît son but. Dans le second, l'absurdité — on pourrait dire la folie — se manifeste en tant que telle. Fondamentalement, seul le parti libéral, parce que parti du concept, aboutit à des progrès réels, tandis que la philosophie positive ne parvient qu'à des revendications et des tendances dont la forme contredit la signification."
