  passage:
    label: "Ouverture"
    text: "Les philosophes n'ont fait qu'interpréter le monde de différentes manières, ce qui importe, c'est de le transformer."
  points:
  - id: n1841-ouverture-1
    sentence: "Marx, XIe thèse sur Feuerbach (1845) : « Les philosophes n'ont fait qu'interpréter le monde de différentes manières, ce qui importe, c'est de ___. », formule vers laquelle tend déjà, dans un vocabulaire encore hégélien, l'idée de la note de 1841 selon laquelle la philosophie ne peut s'accomplir qu'en cessant d'être une pure théorie séparée du monde."
    answer: "le transformer"
