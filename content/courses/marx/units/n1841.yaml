- id: n1841-p1
  title: "Contre l'explication morale du système hégélien"
  notes: |-
    **Marx disqualifie une manière de lire Hegel :** {red}**l'explication par l'accommodement**{/red}**.** Certaines thèses du maître embarrassent ses anciens disciples, surtout ses positions conservatrices en politique ({yellow}l'éloge de l'État prussien, la monarchie constitutionnelle{/yellow}) et en religion ({yellow}l'accord affiché entre philosophie et christianisme{/yellow}). Pour sauver le reste du système, ils disent que Hegel les aurait adaptées aux circonstances, par prudence ou par intérêt, et qu'il cachait derrière elles une pensée plus radicale.

    **Qui sont ces disciples ?** Ceux qui rejettent les thèses conservatrices du maître tout en voulant garder son système : les disciples conservateurs, eux, n'ont rien à expliquer, puisqu'ils approuvent ces thèses. La critique vise donc {amber}le camp critique de l'école{/amber}, les jeunes-hégéliens, auquel {sky}Marx{/sky} appartient lui-même.

    Le paragraphe avance en {amber}trois temps{/amber} : il {amber}nomme la méthode{/amber} qu'il refuse et lui oppose le passé des disciples ; il oppose {amber}la science reçue{/amber} à {amber}la science en devenir{/amber} ; il {amber}retourne le soupçon{/amber} contre les disciples et donne l'argument décisif, la différence entre {green}le rapport substantiel{/green} de Hegel à son système et {pink}le rapport de reflet{/pink} de ses disciples.

    === 1 Expliquer « moralement » : une méthode, et ceux qui l'emploient

    **Expliquer une thèse** {violet}**« moralement »**{/violet}**, c'est l'expliquer par** {red}**les motifs personnels**{/red} **de celui qui la soutient** (ses intentions, sa prudence, son intérêt) plutôt que par {green}la logique interne de la pensée{/green} qui la produit. Marx refuse donc une méthode : celle qui substitue {red}la psychologie de l'auteur{/red} à l'analyse de son système.

    Son premier argument est *ad hominem*. Ces mêmes disciples adhéraient hier {teal}« avec enthousiasme »{/teal} à tous les partis pris de Hegel, et {coral}leurs propres écrits en témoignent{/coral} : ils dénoncent aujourd'hui ce qu'ils approuvaient sans réserve.

    ! « Moralement » ne veut pas dire que les disciples font la morale à Hegel, ni que Marx juge la moralité de Hegel : le mot qualifie une façon d'expliquer.

    === 2 La science reçue et la science en devenir

    **Les disciples ont reçu le système tout fait ; Hegel l'a produit.** Ils se sont adonnés à {pink}la « science reçue toute prête »{/pink} {teal}« avec une conscience naïve et sans esprit critique »{/teal} : il est donc {coral}sans scrupule{/coral} de soupçonner aujourd'hui chez le maître une duplicité qu'ils n'avaient pas aperçue hier, et qu'ils étaient incapables d'apercevoir. Pour Hegel, au contraire, la science n'était {pink}pas « chose reçue »{/pink} mais {green}« chose en devenir »{/green} : il ne l'a pas apprise, il l'a cherchée et produite.

    L'image est organique : {yellow}le « sang spirituel le plus intime »{/yellow} de Hegel {teal}« affluait jusqu'aux extrêmes confins de la science »{/teal}. Sa pensée irriguait le système jusque dans ses parties les plus éloignées, comme le sang irrigue un corps jusqu'aux extrémités : le système n'était pas pour lui un objet extérieur, mais {coral}la vie même de sa pensée{/coral}.

    ! L'image du corps irrigué par le sang n'est pas un ornement : elle revient au §9, retournée en satire, quand les épigones sont logés dans les parties mortes ou extrêmes de ce corps.

    === 3 Le soupçon retourné, et les deux rapports au système

    **En accusant Hegel de cacher une intention secrète, c'est eux-mêmes que les disciples rendent suspects.** S'ils combattent aujourd'hui ce qu'ils ont accepté hier, c'est qu'hier ils ne l'avaient pas pris {teal}« au sérieux »{/teal} : {coral}c'est leur propre adhésion non critique qu'ils combattent{/coral}, en l'attribuant à Hegel.

    **L'argument décisif commande toute la suite de la note.** Hegel avait à son système {green}un rapport « immédiat, substantiel »{/green} : il le produisait en le vivant de l'intérieur. Ses disciples n'en ont qu'{pink}un rapport « de reflet »{/pink} : ils le reçoivent déjà constitué, de l'extérieur, comme un reflet reçoit une image qu'il n'a pas produite. On peut penser à {yellow}un compositeur{/yellow}, qui invente sa musique note après note, et à {yellow}un interprète{/yellow}, qui la joue plus tard d'après une partition déjà écrite : l'interprète peut avoir du talent, il n'a pas vécu de l'intérieur la naissance de l'œuvre.

    L'explication par l'accommodement est ainsi écartée deux fois : ceux qui l'emploient {coral}se contredisent{/coral}, et elle {coral}méconnaît la différence entre les deux rapports au système{/coral}. D'où le passage au §2 : chez un philosophe dont le système est la vie même de la pensée, une inconséquence n'est pas {red}un masque{/red} posé sur d'autres convictions ; {coral}elle ne peut venir que du système lui-même{/coral}.

    ! Défendre Hegel contre le soupçon n'est pas l'absoudre : Marx place son défaut plus profond, dans le principe (§2), ce qui est une critique plus radicale que celle des disciples.
  passage:
    label: "§1"
    text: "C'est par pure ignorance que les disciples de Hegel s'avisent d'expliquer telle ou telle thèse de son système par l'accommodement et autres choses semblables, en un mot : *moralement*. Ils oublient que, hier encore, comme on pourrait le leur démontrer à l'évidence à l'aide de leurs propres écrits, ils adhéraient avec enthousiasme à tous ses partis pris. S'ils étaient réellement impressionnés par la science reçue toute prête, au point qu'ils s'y sont adonnés avec une conscience naïve et sans esprit critique : combien sont-ils dépourvus de scrupules quand ils reprochent au maître de cacher une intention secrète derrière son jugement, à lui pour qui la science n'était pas chose reçue, mais chose en devenir, dont le sang spirituel le plus intime affluait jusqu'aux extrêmes confins de la science. C'est sur eux-mêmes qu'en vérité ils jettent ainsi la suspicion, comme pour montrer qu'hier ils n'ont pas pris tout cela au sérieux, et c'est leur propre état d'hier qu'ils combattent en l'attribuant à Hegel, mais en oubliant qu'il avait, lui, un rapport immédiat, substantiel, à son système, et eux, un rapport de reflet."
