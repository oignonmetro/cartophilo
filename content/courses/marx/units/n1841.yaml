- id: n1841-ouverture
  title: "Vers la XIe thèse sur Feuerbach (1845)"
  notes: |-
    **La note de 1841 formule, dans un vocabulaire encore hégélien, une idée qui ne quittera plus Marx :** {green}**la philosophie ne s'accomplit qu'en cessant d'être une théorie séparée du monde**{/green}**.**

    **Fin 1843, l'*Introduction* reprend le schéma pour l'Allemagne.** Dans l'*Introduction* à la *Contribution à la critique de la philosophie du droit de Hegel* (parue en 1844), deux partis reçoivent deux reproches symétriques. Au {violet}parti pratique{/violet}, qui tourne le dos à la philosophie, Marx répond : {teal}« vous ne pouvez pas supprimer la philosophie sans l'effectuer »{/teal}. Le {violet}parti théorique{/violet}, lui, a cru pouvoir l'effectuer sans la supprimer. On reconnaît la réalisation qui est en même temps une perte (§5) et le chiasme des deux partis, dont chacun manque ce que l'autre possède (§7). La nouveauté décisive : la philosophie trouve désormais {coral}son agent de réalisation dans une classe sociale{/coral}. {teal}« Le cerveau de cette émancipation est la philosophie, son cœur, le prolétariat. »{/teal}

    **En 1845, la XIe thèse sur Feuerbach donne à l'intuition sa forme la plus célèbre.** De la note à cette thèse, le chemin est réel, mais il n'est pas court : il faut que la praxis cesse d'être {teal}« elle-même théorique »{/teal}, c'est-à-dire que {coral}la critique devienne transformation effective des rapports sociaux{/coral}.

    ! En 1841, il n'y a encore ni prolétariat ni révolution : la philosophie se réalise par la critique, et par ses seuls disciples.
