- id: n1841-p4
  title: "La loi psychologique du passage à la praxis"
  notes: |-
    **Le paragraphe énonce la thèse qui organise le reste de la note :** {green}**une pensée achevée se retourne contre le monde**{/green}**.** Une phrase de transition (§3) y conduit. Marx voit dans l'{teal}« orientation peu philosophique »{/teal} d'une grande partie de l'école hégélienne, celle qui explique le maître par ses motifs, {teal}« un phénomène qui marquera toujours le passage de la discipline à la liberté »{/teal}. Tant qu'ils restent à l'école du maître, les disciples sont sous sa {violet}discipline{/violet} : ils apprennent, ils reçoivent, ils répètent. Quand ils veulent penser par eux-mêmes, leur premier mouvement est maladroit : {amber}faute de pouvoir encore dépasser le système par la théorie, ils s'en libèrent en le soupçonnant{/amber}. La mauvaise explication des §1 et §2 n'est donc plus seulement une erreur de méthode : c'est le symptôme d'un moment historique, dont le §4 donne la loi.

    Le paragraphe a {amber}trois temps{/amber} : {amber}la loi{/amber} du retournement ; {amber}la parenthèse{/amber}, qui interdit d'en faire un mécanisme ; {amber}la précision{/amber} que cette pratique reste théorique.

    === 1 La loi : l'esprit théorique devient volonté

    **Une pensée parvenue à son plein développement, qui n'a plus rien à conquérir en elle-même,** {coral}**se change en énergie pratique**{/coral} **et se tourne contre le monde.**

    {yellow}L'Amenti{/yellow} est, dans la mythologie égyptienne, le séjour des morts, à l'Occident, là où le soleil disparaît. Une philosophie purement théorique lui ressemble : elle est complète, mais {pink}séparée de la vie effective{/pink}, comme les ombres des morts le sont du monde des vivants. En sortir, c'est se rapporter au monde réel, qui existe {teal}« indépendamment »{/teal} de la pensée et ne se plie pas à elle. Le mot {violet}« volonté »{/violet} est précis : chez {sky}Hegel{/sky}, la volonté est l'esprit qui se rapporte {amber}pratiquement{/amber} à son objet, pour le transformer, et non plus théoriquement, pour le connaître.

    **Pourquoi ce retournement est-il nécessaire ?** Trois raisons se renforcent.

    - raison dialectique : une détermination qui a atteint sa pleine cohérence ne reste pas refermée sur elle-même, elle passe à son autre, et l'autre de la pensée pure, c'est le monde ;
    - raison normative : un système achevé prétend avoir saisi la structure rationnelle du réel lui-même ; une vérité du réel qui ne se rapporterait jamais au réel se contredirait, comme {yellow}une clé{/yellow} qu'on dirait capable d'ouvrir toutes les portes sans jamais l'essayer sur aucune ;
    - raison psychologique et historique, celle que Marx nomme : une philosophie ne se réalise qu'à travers ses disciples, qui, une fois épuisé ce que le système avait à leur apprendre, tournent leur liberté vers le seul objet qui leur reste, le monde.

    === 2 La parenthèse : chaque philosophie se retourne à sa manière

    **La loi dit que toute philosophie achevée se retourne vers le monde ; elle ne dit pas comment.** Or c'est {amber}le mode déterminé de ce retournement{/amber} (ce qu'une philosophie critique, ce qu'elle épargne, le genre de partis qu'elle engendre) qui révèle {coral}ce qu'elle est en propre{/coral} : sa {teal}« détermination immanente »{/teal}, son {teal}« caractère universel et historique »{/teal}. Ce retournement est son {yellow}*curriculum vitae*{/yellow} : comme un curriculum résume une vie en quelques lignes, il résume le destin historique d'une philosophie, au point où ce destin se joue dans des sujets, {teal}« à sa pointe de subjectivité »{/teal}.

    ! Le passage de la théorie à la pratique n'est pas un mécanisme automatique, identique pour tous les systèmes.

    === 3 Une pratique encore théorique : la critique

    **La** {violet}**praxis**{/violet} **de la philosophie n'est pas encore l'action politique ou révolutionnaire :** {green}**c'est la critique**{/green}**.** Critiquer, c'est {amber}mesurer ce qui existe à ce qui devrait être selon la raison{/amber} : l'existence individuelle à l'essence, la réalité particulière à l'idée. {yellow}Un État qui pratique la censure{/yellow} se dit État ; on peut le mesurer à l'idée de l'État, une communauté rationnelle où la liberté se réalise, et montrer qu'il ne lui est pas conforme. La critique est bien une action, puisqu'elle s'en prend au monde, mais son instrument reste théorique : {coral}elle juge{/coral}.

    La dernière phrase annonce le §5 : cette {teal}« réalisation immédiate »{/teal} de la philosophie est {red}« affligée de contradictions »{/red}, et sa nature contradictoire {teal}« prend forme dans le phénomène »{/teal}, c'est-à-dire devient visible dans l'histoire réelle de l'école.

    ! Ne pas lire ce texte avec le Marx ultérieur : en 1841, la praxis de la philosophie est « elle-même théorique ».
  passage:
    label: "§4"
    text: "Une loi psychologique veut que, après avoir conquis sa liberté intérieure, l'esprit théorique se change en énergie pratique et, sortant du royaume des ombres de l'Amenti, se tourne, comme *volonté*, contre le monde réel qui existe indépendamment de lui. (Il importe cependant, par intérêt philosophique, de mieux spécifier ces aspects ; en effet, c'est du mode déterminé de ce retournement que l'on peut conclure à la détermination immanente et au caractère universel et historique d'une philosophie. Nous tenons ici, pour ainsi dire, son *curriculum vitae* réduit à son expression la plus étroite, à sa pointe de subjectivité.) Mais la *praxis* de la philosophie est elle-même *théorique*. C'est la *critique*, qui mesure l'existence individuelle à l'aune de l'essence, la réalité particulière à l'aune de l'idée. Toutefois, cette *réalisation immédiate* de la philosophie est, par sa nature intime, affligée de contradictions, et cette nature prend forme dans le phénomène et le marque de son sceau."
