# Unité de texte (voir content/textes.md) : la note de la thèse de doctorat
# de 1841 sur les disciples de Hegel, importée depuis un jeu de cartes Quizlet
# puis structurée par paragraphe. Pas de §3 : écarté volontairement.

id: n1841
title: Note sur les disciples de Hegel (1841)
subtitle: Thèse de doctorat, Ire partie, chapitre 4, note 2
icon: page
color: coral
intro: |-
  Note de la thèse de doctorat de 1841, la note 2 du chapitre 4 de la Ire partie,
  intitulé « Différence générale de principe entre la philosophie naturelle de
  Démocrite et celle d'Épicure ». Formellement rattachée à la comparaison entre
  Démocrite et Épicure, elle s'en écarte pour **régler ses comptes avec l'école
  hégélienne**, et pose les bases de ce qui deviendra la distinction entre
  jeunes-hégéliens et vieux-hégéliens.
lessons:
- id: n1841-p1
  title: "Contre l'explication morale du système hégélien"
  passage:
    label: "§1"
    text: "C'est par pure ignorance que les disciples de Hegel s'avisent d'expliquer telle ou telle thèse de son système par l'accommodement et autres choses semblables, en un mot : moralement. Ils oublient que, hier encore, comme on pourrait le leur démontrer à l'évidence à l'aide de leurs propres écrits, ils adhéraient avec enthousiasme à tous ses partis pris. S'ils étaient réellement impressionnés par la science reçue toute prête, au point qu'ils s'y sont adonnés avec une conscience naïve et sans esprit critique : combien sont-ils dépourvus de scrupules quand ils reprochent au maître de cacher une intention secrète derrière son jugement, à lui pour qui la science n'était pas chose reçue, mais chose en devenir, dont le sang spirituel le plus intime affluait jusqu'aux extrêmes confins de la science. C'est sur eux-mêmes qu'en vérité ils jettent ainsi la suspicion, comme pour montrer qu'hier ils n'ont pas pris tout cela au sérieux, et c'est leur propre état d'hier qu'ils combattent en l'attribuant à Hegel, mais en oubliant qu'il avait, lui, un rapport immédiat, substantiel, à son système, et eux, un rapport de reflet."
