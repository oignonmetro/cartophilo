- id: n1841-p4
  title: "La loi psychologique du passage à la praxis"
  passage:
    label: "§4"
    text: "Une loi psychologique veut que, après avoir conquis sa liberté intérieure, l'esprit théorique se change en énergie pratique et, sortant du royaume des ombres de l'Amenti, se tourne, comme volonté, contre le monde réel qui existe indépendamment de lui. (Il importe cependant, par intérêt philosophique, de mieux spécifier ces aspects ; en effet, c'est du mode déterminé de ce retournement que l'on peut conclure à la détermination immanente et au caractère universel et historique d'une philosophie. Nous tenons ici, pour ainsi dire, son curriculum vitae réduit à son expression la plus étroite, à sa pointe de subjectivité.) Mais la praxis de la philosophie est elle-même théorique. C'est la critique, qui mesure l'existence individuelle à l'aune de l'essence, la réalité particulière à l'aune de l'idée. Toutefois, cette réalisation immédiate de la philosophie est, par sa nature intime, affligée de contradictions, et cette nature prend forme dans le phénomène et le marque de son sceau."
  points:
