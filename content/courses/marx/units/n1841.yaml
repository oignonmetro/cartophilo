- id: n1841-p8
  title: "Bilan du mouvement dialectique en trois étapes"
  notes: |-
    **Une seule phrase récapitule les §5 à §7 en** {amber}**trois ruptures**{/amber}**.**

    | Rupture | Entre quoi | Lieu |
    | la première | la philosophie et le monde | §5 |
    | la deuxième | la conscience individuelle et elle-même | §6 |
    | la troisième | deux tendances philosophiques | §7 |

    La première est {teal}« une fausse relation »{/teal}, un rapport qui n'est pas celui de l'unité vraie, et {teal}« une rupture hostile »{/teal}, un conflit : la philosophie, devenue un côté, s'oppose à l'autre côté. La deuxième réfléchit cette opposition dans chaque disciple, sous la forme de l'exigence à deux tranchants. La troisième la projette dans l'histoire, sous la forme de deux partis.

    **Le mouvement va** {coral}**de l'extérieur à l'intérieur, puis de nouveau à l'extérieur**{/coral} **:** la rupture avec le monde est intériorisée dans les sujets, puis extériorisée dans l'école. Chaque étape reprend la précédente en la déplaçant, à la manière dont {sky}Hegel{/sky} décrit le développement d'une contradiction. Les §5 à §7 décrivent donc un seul processus, observé successivement dans le rapport de la philosophie au monde, dans les consciences, puis dans l'école. Il reste à montrer ce qu'il devient quand il est porté par des esprits médiocres (§9).
  passage:
    label: "§8"
    text: "Par conséquent, ce qui apparaît en premier lieu comme une fausse relation et une rupture hostile de la philosophie avec le monde devient en second lieu une rupture de la conscience philosophique individuelle avec elle-même, pour se manifester finalement comme une séparation extérieure et un dédoublement de la philosophie, comme deux tendances philosophiques opposées."
  points:
