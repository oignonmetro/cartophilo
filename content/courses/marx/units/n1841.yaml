- id: n1841-p5
  title: "La dialectique de la réalisation et de la perte de la philosophie"
  passage:
    label: "§5"
    text: "Puisque la philosophie se dresse en tant que volonté contre le monde des phénomènes, le système est ravalé à une totalité abstraite ; autrement dit, il est devenu un côté du monde, auquel s'oppose un autre côté. Son rapport au monde est un rapport de réflexion. Animé du désir de se réaliser, le système entre en conflit avec autrui. Le contentement de soi et l'harmonie sont rompus. Ce qui fut lumière intérieure devient flamme dévorante qui se tourne vers l'extérieur. La conséquence en est que le devenir-philosophique du monde est en même temps un devenir-monde de la philosophie ; que la réalisation de la philosophie est en même temps sa perte ; que ce qu'elle combat à l'extérieur, c'est son propre défaut intérieur ; que c'est précisément en luttant qu'elle contracte elle-même les tares qu'elle combat chez son adversaire, et qu'elle ne peut effacer ces tares qu'en les contractant. Ce qui l'affronte et ce qu'elle combat, c'est toujours ce qu'elle est elle-même, seulement avec des facteurs inversés."
  points:
