- id: philo7-l5
  title: "L'activité, non la praxis"
  notes: |-
    **Viennent enfin les** {violet}**catégories de la pratique**{/violet}**, où le subjectif inscrit dans l'objectif devient agissant : activité, liberté, finalité. Contre toute une tradition,** {coral}**la pensée de Marx n'est pas une philosophie de la *Praxis*, mais un matérialisme de la *Tätigkeit***{/coral}**.**

    **La gloire de la praxis.** Le mot {violet}*Praxis*{/violet} fait une irruption spectaculaire dans les *Thèses sur Feuerbach* (1845) : il marque le passage à un matérialisme qui envisage toute chose du point de vue de la pratique. {sky}Gramsci{/sky}, par raison profonde autant que par contrainte policière, prit l'habitude dans ses écrits de prison de nommer la pensée de Marx {yellow}« philosophie de la praxis »{/yellow} : la formule a fait fortune.

    **Un fait masqué : Marx abandonne le mot.** Après 1846, *Praxis* ne fait plus que de rares apparitions, au sens courant de « pratique ». Pourquoi ? Parce qu'il ne marque pas assez le point décisif : ce qui caractérise l'humanité n'est pas n'importe quelle pratique, mais l'{green}activité sociale productive{/green}. Elle a créé au fil des millénaires, et continue de créer, un {violet}monde humain objectif{/violet} (forces productives, rapports sociaux, savoirs, institutions, valeurs), dont chaque petit d'*Homo sapiens* s'approprie une part pour devenir à sa façon un être humain historiquement développé. Or la tradition issue d'{sky}Aristote{/sky} oppose :

    | Terme grec | Sens | Rang |
    | *praxis* | l'action qui a sa fin en elle-même | noble |
    | *poièsis* | l'activité qui fabrique | subalterne |

    Ainsi entendu, {red}*praxis* dit le contraire de ce que Marx a en vue{/red} : c'est justement la production qu'il met au centre.

    **Le mot que Marx garde : *Tätigkeit*.** Omniprésent aussi dans les *Thèses*, il traverse toute son œuvre : concept clef de l'idéalisme allemand, reconverti en {violet}catégorie matérialiste de l'activité{/violet}, qui {green}produit quelque chose et produit du même coup son producteur{/green}. La *Tätigkeit* est aussi une {violet}*Betätigung*{/violet}, une {violet}*Selbstbetätigung*{/violet} : une {amber}mise en action de soi{/amber}, où se forment les {violet}capacités{/violet} (*Fähigkeiten*) et se développe la {violet}personnalité{/violet} (*Persönlichkeit*). Le forgeron forge le fer, et se forme en forgeant.
