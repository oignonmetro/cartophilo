# Cours sur la dimension philosophique de l'œuvre de Marx, tiré de
# l'introduction de Lucien Sève aux Écrits philosophiques de Marx (Flammarion,
# « Champs classiques », 2011) : voir l'en-tête de philo1. Ici : fin de la
# partie 5, « La logique du Capital » (l'histoire, la base, la conscience,
# l'aliénation, puis les catégories de la pratique : activité, liberté,
# finalité), et la conclusion de l'introduction.
#
# Citations : Manuscrits de 1844 dans les Éditions sociales (Bottigelli) ;
# L'Idéologie allemande dans les Éditions sociales pour « la conscience ne
# peut jamais être autre chose que l'Être conscient » et « jouir de la
# contingence » ; le reste (note de L'Idéologie allemande sur la liberté,
# Grundrisse, Spinoza, Garo) dans la traduction de Sève. Vadée (Marx penseur
# du possible) n'est que nommé, comme dans l'introduction.

id: philo7
title: "La logique du Capital : histoire, pratique, liberté"
subtitle: "Une histoire nécessaire sans être fatale, une conscience qui est l'être conscient, une aliénation devenue sociale, et un matérialisme de l'activité qui vise la liberté"
group: "Le philosophique chez Marx"
icon: compass
color: coral
lessons:
- id: philo7-l1
  title: "L'histoire : détermination, loi, possible"
  notes: |-
    **Les développements de la dialectique nourrissent une catégorie ultime, l'**{violet}**histoire**{/violet}**, où l'on peut voir avec Althusser le nom de tout un continent théorique.** Au-delà de la théorie des formations sociales, trois déterminations y montrent {coral}une nécessité qui inclut la contingence{/coral}.

    **La détermination.** La {violet}détermination{/violet} (*Bestimmung*) ne se rabat pas sur la simple {pink}condition{/pink} (*Bedingung*) : une condition rend possible, une détermination fait être ce qu'une chose est, en excluant ce qu'elle n'est pas. S'y manifeste la vérité dialectique de la formule de {sky}Spinoza{/sky} : {teal}« __omnis determinatio negatio__ »{/teal} (toute détermination est négation).

    **La légalité.** La {violet}légalité{/violet} (*Gesetzmässigkeit*, conformité à des lois), et surtout la {violet}loi tendancielle{/violet}, qui {green}inclut la contingence dans la nécessité{/green}, la contrariété dans la rationalité : la baisse tendancielle du taux de profit est une loi, mais des causes contraires la freinent, et elle ne se lit qu'en moyenne et sur la durée.

    **Nécessité, possibilité, réalité.** Un des apports majeurs de Marx (que {sky}Michel Vadée{/sky} a étudié dans *Marx penseur du possible*) est d'approfondir la distinction :

    | Possibilité | Définie par | Relève de |
    | formelle | la non-contradiction | la logique formelle |
    | réelle | la contradiction réelle | la logique dialectique |

    Sous la non-contradiction formelle se trouve la {coral}contradiction réelle{/coral}, qui provoque les {violet}bifurcations{/violet} par où doit passer la réalisation d'un possible. Marx emploie souvent le grec {blue}*dunamei*{/blue} (« en puissance »), signe de sa proximité avec {sky}Aristote{/sky} : un possible inscrit dans la structure même du réel. Mais bien plus souvent il s'attache aux {violet}présupposés externes{/violet} sans lesquels une possibilité formelle ne devient pas réelle : le propre du {red}possible seulement formel{/red} est de ne pas contenir les conditions décisives de son actualisation. Nouvel effet du renversement matérialiste.

    ! Une loi tendancielle n'est pas une loi approximative : sa contingence fait partie de sa nécessité.
  points:
  - id: philo7-l1-p1
    sentence: "__Dans l'histoire selon Marx__, la nécessité inclut la ___ : le nécessaire n'y est jamais fatal."
    answer: "contingence"
    alt: []
  - id: philo7-l1-p2
    sentence: "__La détermination (*Bestimmung*) ne se rabat pas sur la simple__ ___ (*Bedingung*), qui rend seulement possible."
    answer: "condition"
    alt: []
  - id: philo7-l1-p3
    sentence: "__La formule de Spinoza où se manifeste la vérité dialectique de la détermination__ : « omnis determinatio ___ »."
    answer: "negatio"
    alt: []
  - id: philo7-l1-p4
    sentence: "__La légalité__ (conformité à des lois), en allemand : ___."
    answer: "Gesetzmässigkeit"
    alt: ["Gesetzmäßigkeit", "Gesetzmassigkeit"]
  - id: philo7-l1-p5
    sentence: "__La loi qui inclut la contingence dans la nécessité, la contrariété dans la rationalité__ : la **loi ___**."
    answer: "tendancielle"
    alt: []
  - id: philo7-l1-p6
    sentence: "__L'ouvrage de Michel Vadée sur Marx et le possible__ : *Marx penseur du ___*."
    answer: "possible"
    alt: []
  - id: philo7-l1-p7
    sentence: "__La possibilité formelle se définit par__ la ___, au sens de la logique formelle."
    answer: "non-contradiction"
    alt: ["non contradiction"]
  - id: philo7-l1-p8
    sentence: "__Sous la non-contradiction formelle se trouve la contradiction réelle__, qui provoque les ___ par où doit passer la réalisation d'un possible."
    answer: "bifurcations"
    alt: []
  - id: philo7-l1-p9
    sentence: "__Le mot grec fréquent chez Marx, qui dit sa proximité avec Aristote sur le possible__ : *___*, « en puissance »."
    answer: "dunamei"
    alt: ["δυνάμει"]
  - id: philo7-l1-p10
    sentence: "__Le plus souvent, Marx s'attache aux présupposés__ ___ sans lesquels une possibilité formelle ne devient pas réelle."
    answer: "externes"
    alt: []
- id: philo7-l2
  title: "La base"
  notes: |-
    **Entre catégories philosophiques et concepts scientifiques de l'histoire, la frontière n'est pas nette : rapport est une catégorie, rapport social l'est-il encore ? Trois termes de la théorie de l'histoire ont en tout cas une dimension philosophique : base, conscience, aliénation. La** {violet}**base**{/violet} **(*Grundlage*, *Basis*) est** {coral}**ce à partir de quoi l'on peut rendre raison**{/coral} **des réalités sociales.**

    **Un transfert sémantique exemplaire.** La {violet}*Grundlage*{/violet} (base explicative) est à la pensée de Marx ce que le {violet}*Grund*{/violet} (fondement idéel) est à celle de Hegel : l'idéel s'ouvre à la spatio-temporalité du matériel.

    **La base dans l'espace : base et support.** Spatialement, la base est ce sur quoi se fonde le tout ; mais elle ne se confond pas avec le {violet}support{/violet} (*Träger*). Une {yellow}nation{/yellow} a une {yellow}géographie{/yellow} pour support ; sa base explicative est à chercher dans les logiques fondamentales de son {green}histoire{/green}, qui vont jusqu'à modeler en retour le support géographique (on draine, on irrigue, on perce des canaux). Et ce qui fut d'abord base au sens fort n'est souvent plus ensuite que support : {coral}renversement clef de bien des développements{/coral}.

    **La base dans le temps : présupposition et essence.** Temporellement, la base apparaît d'abord comme {violet}présupposition de départ{/violet} (*Voraussetzung*), voire simple préalable empirique ; mais en tant que {green}condition nécessaire dans la durée{/green}, elle est {violet}essence{/violet}, rapport générateur : c'est là le sens matérialiste fort de *Grundlage*.

    **Un schéma qui n'est pas de Marx.** La mise en doctrine du marxisme a ancré le couple potentiellement {red}mécaniste{/red} base-superstructure. Or :
    - le mot {violet}superstructure{/violet} (*Überbau*) ne se rencontre guère qu'{amber}une dizaine de fois{/amber} dans l'œuvre immense de Marx, en des sens très variés ;
    - {violet}base{/violet} y figure constamment ;
    - {red}infrastructure{/red} ne s'y trouve pas du tout.

    C'est que Marx ne cherche pas un {red}schéma passe-partout{/red} de « la » formation sociale, mais les {green}questions universelles à poser devant chaque cas singulier{/green}. Et la question clef est justement celle de la base d'un tout social : quels sont les rapports essentiels qui engendrent ses structures et ses logiques ?
  points:
  - id: philo7-l2-p1
    sentence: "__La base, chez Marx__, est ce à partir de quoi l'on peut ___ des réalités sociales et des événements historiques."
    answer: "rendre raison"
    alt: []
  - id: philo7-l2-p2
    sentence: "__La base explicative__, en allemand : ___ (à rapprocher du *Grund* de Hegel)."
    answer: "Grundlage"
    alt: []
  - id: philo7-l2-p3
    sentence: "__La *Grundlage* (base explicative) est à la pensée de Marx ce que le__ ___ (fondement idéel) est à celle de Hegel."
    answer: "Grund"
    alt: []
  - id: philo7-l2-p4
    sentence: "__Spatialement, la base ne se confond pas avec le__ ___ (*Träger*) : une nation a une géographie pour support, mais sa base est dans son histoire."
    answer: "support"
    alt: []
  - id: philo7-l2-p5
    sentence: "__Renversement clef de bien des développements__ : ce qui fut d'abord base au sens fort n'est souvent plus ensuite que ___."
    answer: "support"
    alt: []
  - id: philo7-l2-p6
    sentence: "__Temporellement, la base est d'abord présupposition de départ ; en tant que condition nécessaire dans la durée__, elle est ___, rapport générateur."
    answer: "essence"
    alt: []
  - id: philo7-l2-p7
    sentence: "__Le mot « superstructure »__ (*Überbau*) ne se rencontre guère qu'une ___ de fois dans l'œuvre de Marx."
    answer: "dizaine"
    alt: []
  - id: philo7-l2-p8
    sentence: "__Le mot qui ne se trouve pas du tout chez Marx__, malgré la doctrine marxiste : ___."
    answer: "infrastructure"
    alt: []
  - id: philo7-l2-p9
    sentence: "__Marx ne cherche pas un schéma passe-partout de « la » formation sociale__, mais les questions ___ à poser devant chaque cas singulier."
    answer: "universelles"
    alt: []
- id: philo7-l3
  title: "La conscience"
  notes: |-
    **On croit que Marx, penseur de l'objectivité sociale, n'a rien à dire de la** {violet}**conscience**{/violet} **(*Bewusstsein*). C'est l'inverse : parce qu'il la pense de façon matérialiste et historique, il en dit des choses très pénétrantes, et** {coral}**fait de la prise de conscience un moment capital de la transformation du monde**{/coral}**.**

    **La thèse de *L'Idéologie allemande*.** {teal}« La conscience [*das Bewusstsein*] ne peut jamais être autre chose que __l'Être conscient__ [*das bewusste Sein*] et l'Être des hommes est leur __processus de vie réel__. »{/teal} Le jeu de mots allemand dit la thèse : {red}la conscience n'est pas un être{/red}, une chose à part ; {green}ce sont des êtres qui sont conscients{/green}. Toute la tradition idéaliste est niée.

    **Conséquences.**
    - Aucune étude de « la conscience » ne vaut si elle fait abstraction des {amber}processus de vie réels{/amber}. Ainsi, on ne comprend pas comment la conscience peut s'imaginer {teal}« qu'elle représente réellement quelque chose sans représenter quelque chose de réel »{/teal} sans la {violet}division sociale entre travail matériel et travail intellectuel{/violet} : dès qu'une classe pense sans produire, ses idées semblent tenir debout toutes seules.
    - Dans l'humanité développée, la conscience est d'emblée un {violet}produit social{/violet}, comme le langage.

    **La prise de conscience, force historique.** Loin de minorer la conscience, cette conception fait de la {violet}prise de conscience{/violet}, présupposé de toute volonté d'agir, un moment capital. Les *Grundrisse* : pour le salarié, {teal}« reconnaître les produits comme étant __ses propres produits__ »{/teal}, et juger inacceptable de n'avoir aucun pouvoir sur leur production, est {teal}« une __immense conscience__ »{/teal}, qui {teal}« sonne le glas »{/teal} du capital ; de même, quand l'{yellow}esclave{/yellow} prit conscience d'être « une personne », qui ne peut appartenir à un tiers, l'esclavagisme reçut un coup mortel.

    **D'où la politique de Marx.** Un parti de transformation sociale ne se substitue pas aux acteurs (« l'émancipation des travailleurs sera l'œuvre des travailleurs eux-mêmes ») : il les aide à prendre pleine conscience de ce pour quoi ils luttent. D'où l'importance de la {violet}critique de l'idéologie{/violet} dominante. On dit que le mot « idéologie » disparaît après *L'Idéologie allemande* ; mais, comme l'a montré {sky}Isabelle Garo{/sky}, le mot se raréfie parce que son objet s'approfondit et finit par « faire corps avec la critique de l'économie politique elle-même » : tout le livre IV du *Capital* pourrait s'intituler {yellow}*L'Idéologie anglaise*{/yellow}.
  points:
  - id: philo7-l3-p1
    sentence: "__Pensant la conscience de façon matérialiste et historique__, Marx fait de la prise de conscience un moment capital de la ___ du monde."
    answer: "transformation"
    alt: []
  - id: philo7-l3-p2
    sentence: "*L'Idéologie allemande* : « La conscience ne peut jamais être autre chose que l'Être ___ et l'Être des hommes est leur processus de vie réel. »"
    answer: "conscient"
    alt: []
  - id: philo7-l3-p3
    sentence: "*L'Idéologie allemande* : « La conscience ne peut jamais être autre chose que l'Être conscient et l'Être des hommes est leur ___ de vie réel. »"
    answer: "processus"
    alt: []
  - id: philo7-l3-p4
    sentence: "__Le jeu de mots allemand de *L'Idéologie allemande*__ : *das Bewusstsein* n'est rien d'autre que *das bewusste* ___."
    answer: "Sein"
    alt: []
  - id: philo7-l3-p5
