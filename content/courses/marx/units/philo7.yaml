- id: philo7-l7
  title: "Fins et moyens : une politique sans utopie"
  notes: |-
    **Marx, grand penseur moderne de la pratique, a joint à la profondeur philosophique une expérience responsable des luttes ; d'où son apport méconnu sur la** {violet}**finalité**{/violet} **(*Zweck*) :** {coral}**chercher dans le présent les conditions de son dépassement**{/coral}**, plutôt qu'un idéal à lui imposer.**

    **Le moyen qui devient fin.** Par une dialectique constante, le {violet}moyen{/violet} terme (*Mittel*) acquiert une puissance déterminante qui le fait se poser en {violet}fin{/violet} (*Zweck*) : exemple type, l'{yellow}argent{/yellow}, qui devait servir l'échange et devient le but de la production. C'est l'inversion caractéristique du capitalisme, liée à celle des rapports entre personne et chose. Mais ce risque guette {amber}toute pratique{/amber}, l'action politique comprise : c'est pourquoi Marx, que son expérience n'inclinait pas à la naïveté, attachait une haute importance à la {green}moralité en politique{/green}, pour ne jamais perdre le cap de l'émancipation et de la {green}fin en soi ultime{/green} : le {coral}libre développement de l'humanité en tous les humains{/coral}.

    **La vraie difficulté : la ligne politique.** Identifier la fin éthique n'est pas le plus dur ; le plus dur est de déterminer la ligne politique appropriée.

    | Démarche | Part de | Puis |
    | utopiste | la condamnation morale du réel | un idéal sur lequel l'histoire devrait se régler |
    | de Marx | l'examen le plus décapant de la situation | ses présupposés objectifs de dépassement |

    - La démarche {pink}utopiste{/pink} va de la condamnation morale de la réalité à son dépassement {red}en imagination{/red} : elle joint l'{red}inconsistance idéaliste{/red} de la pensée au {red}subjectivisme volontariste{/red} de l'action. Sympathique comme foi dans le possible, l'utopie risque d'être terriblement contre-productive.
    - Marx part de l'{green}examen le plus décapant de la situation réelle{/green}, pour y déceler les {violet}présupposés objectifs{/violet} (*Voraussetzungen*) de son dépassement, que ses contradictions comportent toujours, et identifier le {green}futur réaliste{/green}, en un sens déjà là, qu'il s'agit de faire advenir par-delà notre préhistoire.

    Les *Grundrisse* le disent : {teal}« Si dans la société telle qu'elle est nous ne trouvions pas sous le masque __les conditions matérielles de production d'une société sans classes__ et les rapports d'échange correspondants, toutes les tentatives de la faire sauter ne seraient que __don quichottisme__. »{/teal} De quoi réfléchir sur l'échec des révolutions socialistes dans des pays peu développés, comme sur les possibles neufs d'un dépassement du capitalisme.
  points:
  - id: philo7-l7-p1
    sentence: "__La démarche politique de Marx__ : chercher dans le présent les ___ objectifs de son dépassement, plutôt qu'un idéal à lui imposer."
    answer: "présupposés"
    alt: ["presupposes"]
  - id: philo7-l7-p2
    sentence: "__Par une dialectique constante, le moyen terme acquiert une puissance qui le fait se poser en__ ___ : exemple type, l'argent."
    answer: "fin"
    alt: []
  - id: philo7-l7-p3
    sentence: "__Parce que l'inversion du moyen en fin guette toute pratique__, Marx attachait une haute importance à la ___ en politique."
    answer: "moralité"
    alt: ["moralite"]
  - id: philo7-l7-p4
    sentence: "__La fin en soi ultime, selon Marx__ : le libre ___ de l'humanité en tous les humains."
    answer: "développement"
    alt: ["developpement"]
  - id: philo7-l7-p5
    sentence: "__La démarche qui va de la condamnation morale du réel à son dépassement en imagination__ : la démarche ___."
    answer: "utopiste"
    alt: []
  - id: philo7-l7-p6
    sentence: "__L'utopisme joint l'inconsistance idéaliste de la pensée__ au subjectivisme ___ de l'action."
    answer: "volontariste"
    alt: []
