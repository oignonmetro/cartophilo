- id: philo7-l6
  title: "La liberté et l'émancipation"
  notes: |-
    **L'imagerie vulgaire croit que Marx n'a rien à dire de la** {violet}**liberté**{/violet} **(*Freiheit*) : profonde erreur. Il la pense comme** {coral}**puissance sur les circonstances**{/coral}**, et met au jour une dialectique singulière de la liberté bourgeoise.**

    **Deux définitions de la liberté.** Une note de *L'Idéologie allemande* : {teal}« la liberté a été définie jusqu'ici par les philosophes de deux manières : d'un côté, par tous les matérialistes, comme __puissance__, comme __maîtrise sur les circonstances__ et situations où se trouve vivre un individu ; d'un autre côté, par les idéalistes, et spécialement les Allemands, comme __autodétermination__, détachement du monde réel, comme pure liberté imaginaire de l'esprit »{/teal}.

    | Liberté | Chez | Définie comme |
    | matérialiste | Épicure, Spinoza, Marx | maîtrise sur les circonstances |
    | idéaliste | les Allemands | autodétermination de l'esprit |

    Marx se range dans la première lignée, celle d'{sky}Épicure{/sky} et de {sky}Spinoza{/sky}. La liberté est bien {violet}autonomie{/violet} (*Selbstständigkeit*), mais {green}autonomie pratique{/green}, qui naît chez les individus comme chez les peuples quand ils {amber}prennent conscience de la nécessité{/amber} tout en se représentant avec quelque justesse les {amber}possibles{/amber}. Elle est donc d'essence {violet}historico-sociale{/violet}.

    **La dialectique de la liberté bourgeoise.**
    - D'un côté, l'essor des rapports marchands, qui culmine dans le capitalisme, est {green}intensément libérateur{/green} : il rompt les vieux liens de {violet}dépendance personnelle{/violet} (*Abhängigkeit*) des sociétés esclavagistes et féodales. Le salarié n'appartient à personne.
    - De l'autre, cette liberté individuelle n'est que la faculté de {teal}« jouir de la contingence »{/teal} (*Zufälligkeit*), à l'intérieur d'un {red}asservissement aux gigantesques puissances sociales aliénées{/red} du capitalisme : libre de changer de patron, non de ne pas avoir de patron.

    **D'où l'émancipation.** Le souci de l'{violet}émancipation{/violet} est aussi vif dans *Le Capital* que dans *La Question juive*, et plus consistant : elle doit aller jusqu'à la racine de la dépendance moderne, l'{coral}aliénation économique{/coral}. Et le prétendu fanatique de la production et apologiste du travail est en vérité un inconditionnel de l'essor du {green}temps libre{/green}, condition *sine qua non* de tout épanouissement humain supérieur et de toute liberté concrète.
  points:
  - id: philo7-l6-p1
    sentence: "__Marx pense la liberté comme__ ___ sur les circonstances, contre la liberté imaginaire de l'esprit."
    answer: "maîtrise"
    alt: ["maitrise", "puissance"]
  - id: philo7-l6-p2
    sentence: "*L'Idéologie allemande* : la liberté a été définie par tous les matérialistes « comme ___, comme maîtrise sur les circonstances » de la vie d'un individu."
    answer: "puissance"
    alt: []
  - id: philo7-l6-p3
