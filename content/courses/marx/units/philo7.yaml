    answer: "autodétermination"
    alt: ["autodetermination"]
  - id: philo7-l6-p4
    sentence: "__Les deux penseurs de la lignée matérialiste de la liberté où se range Marx__ : Épicure et ___."
    answer: "Spinoza"
    alt: []
  - id: philo7-l6-p5
    sentence: "__La liberté est autonomie pratique__ : elle naît quand individus et peuples prennent conscience de la ___ tout en se représentant justement les possibles."
    answer: "nécessité"
