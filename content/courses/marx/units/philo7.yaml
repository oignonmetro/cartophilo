- id: philo7-l8
  title: "Une fin libératoire de « la philosophie »"
  notes: |-
    **Marx ne fut ni le premier ni le seul à juger close l'histoire de la philosophie ; mais il est** {coral}**le premier penseur d'une fin authentique et libératoire de « la philosophie »**{/coral}**, parce qu'il la pense comme une** {violet}***Aufhebung***{/violet}**.**

    **L'autre fin de la philosophie : l'agnosticisme.** Bien plus que la critique de Marx, restée confidentielle de son vivant, c'est une autre critique qui a dominé son époque et marque la nôtre. Le {sky}scepticisme de Hume{/sky}, le {sky}criticisme de Kant{/sky}, le {sky}positivisme de Comte{/sky} ont concouru à un {red}agnosticisme philosophique{/red} aux traits communs :
    - renoncer à jamais connaître la {amber}cause profonde{/amber}, la chose en soi, l'essence réelle ;
    - limiter le savoir légitime au {amber}constat du fait{/amber}, à la loi du phénomène, et de là à la technique efficace ;
    - par cette limitation même, faire {amber}place libre{/amber} au choix des valeurs, à la croyance, voire à l'évasion mystique.

    Effet paradoxal : déclarer close la métaphysique offre une {red}vie nouvelle au spéculatif débridé{/red}, dans un monde où font bon ménage scientisme phénoméniste, logicisme formel et irrationalisme conservateur.

    **La fin selon Marx : une *Aufhebung*.** Il pense la fin de la philosophie au double sens du dépassement :
    - {red}__ce qui est aboli__{/red} : « la philosophie » comme discours de la mauvaise abstraction sur le monde et « l'homme » ; la perpétuer ne relève à ses yeux que du {red}sarcasme{/red} ;
    - {green}__ce qui est conservé__{/green} : l'acquis catégoriel de deux mille ans de réflexion logico-philosophique ; l'abandonner par cécité dialectique n'appelle que la pitié.

    Marx est ainsi le pionnier de l'alternative au couple improductif de l'{pink}infatuation philosophique{/pink} et de la {pink}résignation positiviste{/pink} : au-delà du formalisme logique, le {green}travail catégoriel, critique et heuristique, à même les savoirs et les pratiques{/green}. Ce que Marx offre n'est {coral}aucunement une philosophie, mais une façon neuve de pratiquer en toute chose l'indispensable travail philosophique{/coral}.

    **Un enjeu politique.** Faire du philosophique un moment non prétentieux, mais peu remplaçable, de la pensée instruite et de la décision responsable est un présupposé direct du communisme de Marx. L'avoir méconnu a coûté cher aux marxistes : ressaisir le philosophique de Marx est un préalable pour que redevienne crédible sa visée de changer le monde.
  points:
  - id: philo7-l8-p1
    sentence: "__Marx est le premier penseur d'une fin authentique et libératoire de « la philosophie »__, parce qu'il la pense comme une ___."
    answer: "Aufhebung"
    alt: []
  - id: philo7-l8-p2
    sentence: "__Le scepticisme de Hume, le criticisme de Kant, le positivisme de Comte ont concouru à un__ **___ philosophique**."
    answer: "agnosticisme"
    alt: []
  - id: philo7-l8-p3
    sentence: "__L'agnosticisme philosophique limite le savoir légitime au constat du fait__, et de là à la ___ efficace."
    answer: "technique"
    alt: []
  - id: philo7-l8-p4
    sentence: "__Effet paradoxal de l'agnosticisme qui déclare close la métaphysique__ : il offre une vie nouvelle au ___ débridé."
    answer: "spéculatif"
    alt: ["speculatif"]
  - id: philo7-l8-p5
    sentence: "__Ce que l'*Aufhebung* marxienne de la philosophie conserve__ : l'acquis ___ de deux mille ans de réflexion logico-philosophique."
    answer: "catégoriel"
