- id: philo7-l4
  title: "L'aliénation, de 1844 au Capital"
  notes: |-
    **On répète, après Althusser (1965), que l'aliénation, catégorie feuerbachienne des** ***Manuscrits de 1844*****, disparaît « complètement » ensuite. Or le vocabulaire de l'aliénation est partout dans** ***Le Capital*** **; mais** {coral}**il y a pris un sens nouveau, par un renversement matérialiste**{/coral}**.**

    **Une contre-vérité, et une vérité.** Que le vocabulaire de l'aliénation ({violet}*Entäusserung*{/violet}, plus souvent {violet}*Entfremdung*{/violet}) soit absent du *Capital* est une {red}contre-vérité flagrante{/red}. Mais Althusser a raison sur un point : dans le texte de 1844 sur le [[g-travail-aliene|travail aliéné]], l'aliénation relève par bien des côtés de l'{violet}humanisme feuerbachien{/violet}.

    **L'aliénation en 1844 : le drame d'un sujet.** Cette quinzaine de pages est une saisissante {violet}phénoménologie du travail aliéné{/violet}, qui renvoie à l'expérience d'un sujet : le travailleur s'aliène dans son travail {yellow}comme le croyant s'aliène en Dieu{/yellow}. L'aliénation y est un {amber}acte du travailleur{/amber} ({violet}*Tat der Entäusserung*{/violet}), dont le travail devient {teal}« une puissance autonome vis-à-vis de lui »{/teal} : c'est « l'homme » qui s'aliène ({violet}*Selbstentfremdung*{/violet}). Le jeune Marx va jusqu'à dire que la propriété privée « résulte par analyse » du concept d'« homme aliéné » : nous sommes encore dans un {red}monde à l'envers{/red}. D'où la question qu'il laisse irrésolue : {teal}« comment cette aliénation est-elle __fondée dans l'essence du développement humain__ ? »{/teal} Faute d'une vision claire du rapport de production capitaliste (il parle du {teal}« système de l'argent »{/teal}), il ne peut y répondre.

    **L'aliénation dans *Le Capital* : l'antagonisme d'un monde social.**

    | Qui aliène ? | 1844 | *Le Capital* |
    | le sujet de l'aliénation | « l'homme » qui s'aliène | un mode de production qui contraint |
    | sa nature | drame d'un sujet | antagonisme d'un monde social |

    Ce n'est pas « l'homme » qui s'aliène, {red}vue spéculative{/red}, mais {green}un mode de production défini qui contraint les individus à produire et vivre en des conditions aliénées{/green}. L'aliénation devient l'{coral}ensemble des processus historico-sociaux par lesquels, sur la base des clivages de classe, les forces matérielles et mentales des humains se détachent d'eux pour se constituer en puissances dominatrices{/coral} ({violet}*beherrschende Mächte*{/violet}) qui les écrasent : avoirs privés, raisons d'État, évidences fallacieuses, crises, guerres.

    **Un dépassement au sens de l'*Aufhebung*.** Quelque chose est {red}récusé{/red} (l'homme qui s'aliène), quelque chose {green}conservé sur une autre base{/green} : la phénoménologie du travail aliéné reste vraie, mais ne se comprend sans erreur qu'à partir des rapports historiques qui la sous-tendent. Et une fois sa matrice identifiée, on voit l'immense diversité de l'aliénation : dans le monde du capital, ne sont pas aliénés que le travail, mais la politique, la science, l'amour, le rapport à la nature. Notre histoire n'est encore que {teal}« préhistoire »{/teal}. Le {violet}communisme{/violet} se définit alors comme {green}mouvement d'appropriation{/green} (*Aneignung*), où doivent se dépasser longuement toutes les grandes aliénations de l'humanité.
  points:
  - id: philo7-l4-p1
    sentence: "__Le vocabulaire de l'aliénation est partout dans *Le Capital*__, mais il y a pris un sens nouveau, par un ___ matérialiste."
    answer: "renversement"
    alt: []
  - id: philo7-l4-p2
    sentence: "__La thèse de 1965 selon laquelle l'aliénation, catégorie feuerbachienne, disparaîtrait « complètement » après 1844__ est celle d'___."
    answer: "Althusser"
    alt: []
  - id: philo7-l4-p3
    sentence: "__Sur quoi Althusser a raison__ : dans le texte de 1844 sur le travail aliéné, l'aliénation relève par bien des côtés de l'**humanisme ___**."
    answer: "feuerbachien"
    alt: []
  - id: philo7-l4-p4
    sentence: "__Le texte de 1844 sur le travail aliéné est une__ ___ du travail aliéné, qui renvoie à l'expérience d'un sujet."
    answer: "phénoménologie"
    alt: ["phenomenologie"]
  - id: philo7-l4-p5
