- id: n1844a-p2
  title: "L'apparition du prolétariat en Allemagne"
  notes: |-
    **Le prolétariat n'est pas défini par la pauvreté, mais par la façon dont elle est produite : il naît de l'industrialisation et de la dissolution violente de la société.** Marx le dit par deux oppositions.

    ? **Pauvreté naturelle-spontanée** : la misère qui existe depuis toujours, que causent par exemple les mauvaises récoltes ; elle s'oppose à la pauvreté {coral}produite artificiellement{/coral}, c'est-à-dire fabriquée par l'organisation même de la société.

    ? **État intermédiaire** : ici, les couches moyennes situées entre les grands et les plus pauvres, comme les artisans. L'industrie les ruine, et c'est de leur dissolution que surgit une partie du prolétariat.

    | | Ce que le prolétariat est | Ce qu'il n'est pas |
    | la pauvreté | produite artificiellement | naissant de façon naturelle-spontanée |
    | la masse humaine | surgissant de la dissolution violente de la société | mécaniquement accablée par le poids de la société |

    **Pourquoi cette distinction compte-t-elle ?** Une pauvreté naturelle appelle de la charité ; une pauvreté produite par la société appelle un remède social, et celui qui la subit est le résultat d'une dissolution, donc le signe que l'ordre ancien se défait. C'est aussi ce qui explique le moment : {amber}le prolétariat n'est présent en Allemagne que depuis le mouvement industriel qui s'y introduit{/amber}. Marx ajoute que {yellow}la pauvreté naturelle et le servage chrétien germanique{/yellow}, la dépendance héritée du Moyen Âge, viennent peu à peu grossir ses rangs, mais ce n'est pas ce qui le constitue.

    ! Le prolétariat n'est pas la masse des pauvres : c'est celle que la dissolution de la société fabrique.
  passage:
    label: "§46"
    text: "Le prolétariat commence seulement à être présent en Allemagne suite au mouvement *industriel* qui s'y introduit, car ce qui constitue le prolétariat, ce n'est pas la pauvreté *naissant de façon naturelle-spontanée* mais la pauvreté *produite artificiellement*, ce n'est pas la masse humaine mécaniquement accablée par le poids de la société mais la masse humaine surgissant de la *dissolution violente* de la société, particulièrement de la dissolution de l'état intermédiaire, même si peu à peu, comme cela se comprend de soi-même, la pauvreté naturelle-spontanée et le servage chrétien germanique viennent aussi grossir ses rangs."
