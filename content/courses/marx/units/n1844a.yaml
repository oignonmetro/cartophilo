- id: n1844a-p4
  title: "La philosophie et le prolétariat, armes l'un de l'autre"
  notes: |-
    **La philosophie et le prolétariat s'arment mutuellement.** La philosophie trouve dans le prolétariat {amber}ses armes matérielles{/amber}, le prolétariat trouve dans la philosophie {amber}ses armes intellectuelles{/amber}. Ce paragraphe reprend le §29 : l'arme de la critique ne remplace pas la critique des armes, un pouvoir matériel ne se renverse que par un pouvoir matériel, et la théorie ne devient pouvoir matériel qu'en s'emparant des masses. Le prolétariat est cette force matérielle.

    | | Ce que chacun apporte |
    | la philosophie | des armes intellectuelles : la théorie qui dit au prolétariat ce que sa condition a d'indigne d'un être humain |
    | le prolétariat | des armes matérielles : la force de masse sans laquelle la théorie ne renverse rien |

    **L'image de l'éclair.** {violet}L'éclair de la pensée{/violet} est une lumière soudaine et violente qui frappe {violet}ce naïf sol populaire{/violet} : un peuple « naïf », qui n'a pas encore pensé sa condition, est frappé par la pensée comme la terre par la foudre. Quand elle l'aura frappé {amber}en profondeur{/amber}, c'est-à-dire pas seulement en surface, {coral}s'accomplira l'émancipation qui des Allemands fera des êtres humains{/coral}.

    ! Ce n'est pas la philosophie qui s'émancipe seule, ni le prolétariat seul : l'émancipation vient de leur rencontre.
  passage:
    label: "§48"
    text: "De même que la philosophie trouve dans le prolétariat ses armes matérielles, le prolétariat trouve dans la philosophie ses armes intellectuelles, et dès que l'éclair de la pensée aura frappé en profondeur ce naïf sol populaire, s'accomplira l'émancipation qui des Allemands fera des êtres humains."
