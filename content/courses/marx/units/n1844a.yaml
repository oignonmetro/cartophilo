- id: n1844a-p6
  title: "Le chant du coq gaulois"
  notes: |-
    **L'*Introduction* se termine sur une promesse : l'Allemagne ressuscitera quand ses conditions internes seront réunies, et le signal viendra de France.** Les {violet}conditions internes{/violet} sont celles que le texte vient de nommer : une théorie radicale, et une classe aux chaînes radicales.

    ? **Coq gaulois** : le coq est l'emblème de la France, que les Latins appelaient la Gaule, et son chant annonce l'aube. Marx s'en sert pour dire que l'impulsion viendra du côté français, celui de la Révolution de 1789, dont l'Allemagne était « tout juste » au niveau (§9).

    La phrase répond au début de l'*Introduction*, où l'Allemagne n'avait que sa philosophie pour être la contemporaine du présent. Elle dit que la résurrection allemande, {amber}le jour où elle quittera ce retard{/amber}, ne viendra pas d'elle seule : il faut {coral}que les conditions internes soient réunies{/coral}, et {coral}qu'un signal extérieur l'annonce{/coral}. Marx écrit cette phrase à Paris, dans une revue franco-allemande, et elle s'adresse aux lecteurs des deux pays.

    ! Le coq gaulois n'est pas la cause de la résurrection allemande : il l'annonce, quand les conditions internes sont réunies.
  passage:
    label: "§51"
    text: "Quand toutes les conditions internes seront réunies, le *jour de la résurrection allemande* sera annoncé par le *chant du coq gaulois*."
