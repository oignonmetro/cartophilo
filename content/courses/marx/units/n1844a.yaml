id: n1844a
title: "Émancipation humaine et prolétariat (1844)"
subtitle: "Contribution à la critique de la philosophie du droit de Hegel, Introduction, §44 à §51"
icon: page
color: coral
intro: |-
  Fin de l'*Introduction* de 1844. Marx y répond à la question de la possibilité positive de l'émancipation allemande : une classe aux chaînes radicales, le prolétariat, dont la philosophie est le cerveau, et le résumé du résultat.
lessons:
- id: n1844a-i1
  title: "Où trouver la force de la révolution radicale ?"
  notes: |-
    Ces paragraphes terminent l'*Introduction* de {sky}Marx{/sky}. Ils répondent à une difficulté posée juste avant (§34-43) : la révolution radicale que l'Allemagne doit faire semble manquer de {amber}base matérielle{/amber}. La théorie ne devient effective, disait Marx, que si elle est l'effectuation des besoins d'un peuple (§35), et une révolution radicale suppose {amber}des besoins radicaux{/amber} qui semblent faire défaut (§37). Une simple révolution politique, où {amber}une partie de la société{/amber} s'émancipe au nom de toute la société, est impossible en Allemagne, parce qu'aucune classe n'y a la grandeur d'âme de s'identifier à tout le peuple (§42-43).

    **§44 pose alors la question, et la suite y répond : la possibilité positive de l'émancipation allemande est dans une classe aux chaînes radicales, le prolétariat, qui s'unit à la philosophie.**

    | Mouvement | Lieu | Ce qui s'y joue |
    | poser la question de la possibilité positive de l'émancipation et y répondre par une classe aux chaînes radicales | §44-45 | Cette classe souffre d'une injustice universelle, ne réclame aucun droit particulier et ne peut s'émanciper sans émanciper toute la société : c'est le prolétariat. |
    | dire d'où vient le prolétariat en Allemagne | §46 | Il naît de l'industrialisation et de la dissolution violente de la société, non d'une pauvreté naturelle. |
    | dire ce que le prolétariat exprime quand il annonce la dissolution de l'ordre du monde | §47 | Il exprime le secret de sa propre existence : il est cette dissolution, et sa demande de négation de la propriété privée dit ce que la société a fait de lui. |
    | unir la philosophie et le prolétariat | §48 | La philosophie lui donne ses armes intellectuelles, il lui donne ses armes matérielles, et l'émancipation s'accomplit quand la pensée frappe le peuple. |
    | résumer le résultat | §49-50 | La seule libération pratique possible est celle de la théorie qui fait de l'être humain l'être suprême : la philosophie en est le cerveau, le prolétariat le cœur. |
    | annoncer le jour de la résurrection allemande | §51 | Il sera annoncé par le chant du coq gaulois, quand les conditions internes seront réunies. |

    ! Marx ne dit pas que la philosophie fait la révolution : il dit que la révolution se fait quand la théorie rencontre une classe qui en a besoin.
