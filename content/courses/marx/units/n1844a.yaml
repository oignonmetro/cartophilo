- id: n1844a-p3
  title: "Le prolétariat exprime le secret de sa propre existence"
  notes: |-
    **Quand le prolétariat annonce la dissolution de l'ordre du monde, il ne propose pas une doctrine venue d'ailleurs : il dit ce qu'il est.** Il {amber}est, dans les faits{/amber}, cette dissolution, et ce qu'il exprime est {coral}le secret de sa propre existence{/coral}.

    ? **Propriété privée** : la possession exclusive d'un bien, avec le droit d'en disposer et d'en exclure les autres ; Marx pense surtout à celle des moyens de production.

    **Même logique pour sa demande de négation de la propriété privée.** Il ne fait qu'ériger en principe de la société {coral}ce que la société a érigé comme son principe à lui{/coral}, ce qui est déjà incarné en lui, sans qu'il y soit pour quelque chose, {amber}en tant qu'il est le résultat négatif de la société{/amber} : le prolétaire est ce que la propriété privée produit comme manque, celui qui en est privé. Sa demande ne vient pas d'une théorie, mais de sa condition.

    **La comparaison avec le roi le montre.** Le roi allemand qui appelle le peuple « son » peuple, comme il appelle le cheval « son » cheval, n'a aucun droit particulier à le faire : il énonce seulement ce que la société existante tient pour vrai, que {red}le propriétaire privé est roi{/red}. Le prolétaire a, par rapport au monde à venir, {coral}le même droit{/coral} : il énonce le principe de ce monde, comme le roi énonce celui du monde présent.

    | | Le roi allemand | Le prolétaire |
    | ce qu'il énonce | le peuple est sa propriété privée | la propriété privée doit être niée |
    | ce que cela dit | que le propriétaire privé est roi | ce que la société a fait de lui |
    | le monde dont il énonce le principe | le monde présent | le monde à venir |

    ! Le prolétariat n'invente pas son exigence : il énonce ce que sa propre situation enseigne.
