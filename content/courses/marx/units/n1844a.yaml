- id: n1844a-p1
  title: "La possibilité positive de l'émancipation : une classe aux chaînes radicales"
  notes: |-
    **La possibilité positive de l'émancipation allemande est dans une classe dont la souffrance est universelle, et qui ne peut donc s'émanciper qu'en émancipant toute la société : le prolétariat.** Marx la décrit par une longue suite de traits, qu'on peut grouper.

    ? **Société civile** : l'ensemble des rapports de la vie économique et privée, distincts de l'État ; les classes, les professions, la propriété en font partie.

    ? **État** (au sens d'ordre ou de condition) : un groupe social défini par sa place dans la société, comme la noblesse, le clergé ou le tiers état. « Un état qui est la dissolution de tous les états » n'est pas un rang parmi d'autres : c'est ce qui dissout l'ordre des rangs.

    | Trait de la classe | Ce qu'il veut dire |
    | une classe de la société civile qui n'est pas une classe de la société civile | elle fait partie de la société sans y avoir de place reconnue |
    | des souffrances universelles, aucun droit particulier | ce n'est pas une injustice particulière qui lui est faite, mais l'injustice tout court : elle ne réclame pas un privilège |
    | un titre humain, non historique | elle ne se fonde pas sur la tradition, comme la noblesse, mais sur ce qu'est un être humain |
    | une opposition globale aux présuppositions de l'État allemand | elle s'oppose au principe même du régime, non à ses seules conséquences |
    | la perte complète de l'être humain | elle a tout perdu de ce qui fait l'humain, donc ne peut se conquérir qu'en le reconquérant en entier |

    **Pourquoi cette classe peut-elle émanciper toute la société ?** Parce qu'elle {coral}ne peut s'émanciper sans s'émanciper de toutes les autres sphères{/coral} : n'ayant aucun intérêt particulier à défendre, elle ne peut se libérer qu'en libérant tous les autres. C'est l'inverse de la révolution partielle du §40, où une partie de la société s'émancipe au nom de toute la société. Et {coral}elle ne peut se conquérir elle-même que par la reconquête complète de l'être humain{/coral}, parce qu'elle en est {amber}la perte complète{/amber}. Marx lui donne enfin son nom : cette dissolution de la société, prise comme état particulier, c'est {violet}le prolétariat{/violet}.

    ! « Prolétariat » ne désigne pas ici la pauvreté en général : c'est la classe dont la perte est complète, et dont la libération est celle de tous.
  passage:
    label: "§44-45"
    text: "Où se trouve alors la possibilité *positive* de l'émancipation allemande ? *Réponse* : dans la formation d'une classe aux *chaînes radicales*, d'une classe de la société civile qui n'est pas une classe de la société civile, d'un état qui est la dissolution de tous les états, d'une sphère à laquelle ses souffrances universelles confèrent un caractère universel et qui ne revendique aucun *droit particulier*, parce que ce n'est pas une *injustice particulière*, mais bien l'*injustice tout court* qui est commise à son encontre, qui ne peut plus se parer d'un titre *historique*, mais seulement encore d'un titre *humain*, qui ne soit pas dans une opposition unilatérale aux conséquences de l'essence de l'État allemand, mais dans une opposition globale à ses présuppositions, d'une sphère, enfin, qui ne peut s'émanciper [elle-même] sans s'émanciper de toutes les autres sphères de la société et, ce faisant, émanciper toutes les autres sphères de la société, qui est en un mot la *perte complète* de l'être humain, et ne peut donc se conquérir elle-même que par la *reconquête complète de l'être humain*. Cette dissolution de la société, en tant qu'elle prend la forme d'un état particulier, c'est le *prolétariat*."
