id: n1844a
title: "Émancipation humaine et prolétariat (1844)"
subtitle: "Contribution à la critique de la philosophie du droit de Hegel, Introduction, §44 à §51"
icon: page
color: coral
intro: |-
  Fin de l'*Introduction* de 1844. Marx y répond à la question de la possibilité positive de l'émancipation allemande : une classe aux chaînes radicales, le prolétariat, dont la philosophie est le cerveau, et le résumé du résultat.
lessons:
- id: n1844a-p1
  title: "La possibilité positive de l'émancipation : une classe aux chaînes radicales"
  passage:
    label: "§44-45"
    text: "Où se trouve alors la possibilité *positive* de l'émancipation allemande ? *Réponse* : dans la formation d'une classe aux *chaînes radicales*, d'une classe de la société civile qui n'est pas une classe de la société civile, d'un état qui est la dissolution de tous les états, d'une sphère à laquelle ses souffrances universelles confèrent un caractère universel et qui ne revendique aucun *droit particulier*, parce que ce n'est pas une *injustice particulière*, mais bien l'*injustice tout court* qui est commise à son encontre, qui ne peut plus se parer d'un titre *historique*, mais seulement encore d'un titre *humain*, qui ne soit pas dans une opposition unilatérale aux conséquences de l'essence de l'État allemand, mais dans une opposition globale à ses présuppositions, d'une sphère, enfin, qui ne peut s'émanciper [elle-même] sans s'émanciper de toutes les autres sphères de la société et, ce faisant, émanciper toutes les autres sphères de la société, qui est en un mot la *perte complète* de l'être humain, et ne peut donc se conquérir elle-même que par la *reconquête complète de l'être humain*. Cette dissolution de la société, en tant qu'elle prend la forme d'un état particulier, c'est le *prolétariat*."
  points: []
- id: n1844a-p2
  title: "L'apparition du prolétariat en Allemagne"
  passage:
    label: "§46"
    text: "Le prolétariat commence seulement à être présent en Allemagne suite au mouvement *industriel* qui s'y introduit, car ce qui constitue le prolétariat, ce n'est pas la pauvreté *naissant de façon naturelle-spontanée* mais la pauvreté *produite artificiellement*, ce n'est pas la masse humaine mécaniquement accablée par le poids de la société mais la masse humaine surgissant de la *dissolution violente* de la société, particulièrement de la dissolution de l'état intermédiaire, même si peu à peu, comme cela se comprend de soi-même, la pauvreté naturelle-spontanée et le servage chrétien germanique viennent aussi grossir ses rangs."
  points: []
- id: n1844a-p3
  title: "Le prolétariat exprime le secret de sa propre existence"
  passage:
    label: "§47"
    text: "Quand le prolétariat annonce la *dissolution de ce qui a été jusqu'à présent l'ordre du monde*, ce n'est que le *secret de sa propre existence* qu'il exprime ainsi, car il *est, dans les faits*, la dissolution de cet ordre du monde. Quand le prolétariat exige la *négation de la propriété privée*, il érige seulement en *principe de la société* ce que la société a érigé comme *son* principe à lui, ce qui est déjà, sans qu'il y soit pour quelque chose, incarné en *lui*, en tant qu'il est le résultat négatif de la société. Le prolétaire a alors, par rapport au monde à venir, le même droit que le *roi allemand* par rapport au monde présent quand ce dernier appelle le peuple *son* peuple, exactement de la même manière qu'il appelle le cheval *son* cheval. Le roi, en proclamant que le peuple est sa propriété privée, se contente d'énoncer que le propriétaire privé est roi."
  points: []
- id: n1844a-p4
  title: "La philosophie et le prolétariat, armes l'un de l'autre"
  passage:
    label: "§48"
    text: "De même que la philosophie trouve dans le prolétariat ses armes matérielles, le prolétariat trouve dans la philosophie ses armes intellectuelles, et dès que l'éclair de la pensée aura frappé en profondeur ce naïf sol populaire, s'accomplira l'émancipation qui des Allemands fera des êtres humains."
  points: []
- id: n1844a-p5
  title: "Le résultat : l'émancipation de l'Allemand est l'émancipation de l'être humain"
  passage:
    label: "§49-50"
    text: "Résumons le résultat : L'unique libération *pratique* qui soit possible en Allemagne est la libération du point de vue *de la* théorie qui proclame que l'être humain est pour l'être humain l'être suprême. En Allemagne, s'émanciper du *Moyen Âge* n'est possible qu'en s'émancipant en même temps des dépassements *partiels* du Moyen Âge. En Allemagne, *aucune* forme de servitude ne peut être brisée sans briser *toute* forme de servitude. L'Allemagne, *qui va au fond des choses*, ne peut faire la révolution sans la faire *de fond en comble*. L'émancipation de l'Allemand est l'émancipation de l'être humain. Le *cerveau* de cette émancipation est la *philosophie*, son *cœur*, le *prolétariat*. La philosophie ne peut s'effectuer sans la suppression du prolétariat, le prolétariat ne peut pas se supprimer sans l'effectuation de la philosophie."
  points: []
- id: n1844a-p6
  title: "Le chant du coq gaulois"
  passage:
    label: "§51"
    text: "Quand toutes les conditions internes seront réunies, le *jour de la résurrection allemande* sera annoncé par le *chant du coq gaulois*."
  points: []
