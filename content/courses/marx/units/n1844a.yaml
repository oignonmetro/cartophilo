- id: n1844a-p5
  title: "Le résultat : l'émancipation de l'Allemand est l'émancipation de l'être humain"
  notes: |-
    **Marx résume : la seule libération pratique possible en Allemagne est celle qui part de la théorie faisant de l'être humain l'être suprême, et elle doit être totale.** La première phrase dit {coral}d'où elle part{/coral} : de la théorie que le §29 a introduite, qui proclame que l'être humain est pour l'être humain l'être suprême.

    ? **Dépassements partiels du Moyen Âge** : les solutions à moitié modernes qui sortent du Moyen Âge sans l'abolir complètement, comme une émancipation seulement politique (§40). Pour Marx, l'Allemagne ne peut pas procéder par étapes, comme la France : il lui faut dépasser en même temps le Moyen Âge et ces dépassements partiels.

    **Pourquoi une révolution « de fond en comble » ?** Parce que {coral}aucune forme de servitude ne peut être brisée en Allemagne sans briser toute forme de servitude{/coral} : une servitude brisée à moitié, comme celle du Moyen Âge, laisserait en place celle de l'ordre moderne, et inversement. L'Allemagne « va au fond des choses » : elle ne peut pas faire une demi-révolution, et c'est ce qui rend son émancipation universelle.

    **Puis la formule finale.** {coral}L'émancipation de l'Allemand est l'émancipation de l'être humain{/coral} : en libérant l'Allemand, on libère l'être humain, puisque la classe qui émancipe est celle qui a perdu l'être humain tout entier (§45). {amber}Le cerveau{/amber} de cette émancipation est la philosophie, {amber}son cœur{/amber} le prolétariat : l'un pense, l'autre porte. Et chacun a besoin de l'autre : {coral}la philosophie ne peut s'effectuer sans la suppression du prolétariat{/coral}, car l'effectuer, c'est faire cesser la condition de ceux qui sont réduits à la perte complète de l'être humain ; {coral}le prolétariat ne peut se supprimer sans l'effectuation de la philosophie{/coral}, car il ne se supprime qu'en reconquérant l'être humain, ce que la philosophie pense.

    ! « Unique » ne veut pas dire que la théorie suffit : la seule libération pratique possible est celle qui part de la théorie, mais elle se fait par le prolétariat.
  passage:
    label: "§49-50"
    text: "Résumons le résultat : L'unique libération *pratique* qui soit possible en Allemagne est la libération du point de vue *de la* théorie qui proclame que l'être humain est pour l'être humain l'être suprême. En Allemagne, s'émanciper du *Moyen Âge* n'est possible qu'en s'émancipant en même temps des dépassements *partiels* du Moyen Âge. En Allemagne, *aucune* forme de servitude ne peut être brisée sans briser *toute* forme de servitude. L'Allemagne, *qui va au fond des choses*, ne peut faire la révolution sans la faire *de fond en comble*. L'émancipation de l'Allemand est l'émancipation de l'être humain. Le *cerveau* de cette émancipation est la *philosophie*, son *cœur*, le *prolétariat*. La philosophie ne peut s'effectuer sans la suppression du prolétariat, le prolétariat ne peut pas se supprimer sans l'effectuation de la philosophie."
