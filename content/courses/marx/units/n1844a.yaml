  - id: n1844a-p4-1
    sentence: "« De même que la philosophie trouve dans le prolétariat ___, le prolétariat trouve dans la philosophie ses armes intellectuelles, et dès que l'éclair de la pensée aura frappé en profondeur ce naïf sol populaire, s'accomplira l'émancipation qui des Allemands fera des êtres humains. »"
