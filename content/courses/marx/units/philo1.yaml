- id: philo1-l2
  title: "Deux lectures opposées, un dilemme trop simple"
  notes: |-
    **L'adieu à la philosophie a reçu deux lectures inverses, qui s'accordent sur un point : après 1846, il n'y aurait plus de philosophie chez Marx.** L'une s'en félicite, l'autre le déplore ; {coral}toutes deux se trompent{/coral}, et pour la même raison.

    **Les deux lectures.**
    - {pink}__La science contre la philosophie__{/pink}. Au début du XXe siècle, il est classique chez les marxistes, par exemple {sky}Boukharine{/sky}, de faire commencer la vraie pensée de Marx à *Misère de la philosophie* (1847) : il aurait opposé aux mystifications de la philosophie la rigueur de la science, et le marxisme serait une {violet}sociologie critique{/violet}.
    - {red}__L'humanisme de jeunesse contre le scientisme__{/red}. Quelques décennies plus tard, à l'opposé, des jésuites comme {sky}Jean-Yves Calvez{/sky} ou des penseurs contestataires des pays socialistes réhabilitent l'{violet}humanisme philosophique{/violet} des œuvres de jeunesse, où {amber}« l'homme »{/amber} tient la place centrale, pour mieux déplorer qu'il ait été répudié par le scientisme du {blue}*diamat*{/blue}, le « matérialisme dialectique » devenu doctrine officielle des pays socialistes.

    D'où l'embarras : parler de « la philosophie de Marx » peut passer pour un {yellow}constat élémentaire{/yellow} ou pour un {yellow}contresens fondamental{/yellow}.

    **Le dilemme est trop simple, et se défait en deux temps.**
    - {green}**Oui**{/green}, il y a chez Marx une riche philosophie de jeunesse, **mais il en est sorti pour de bonnes raisons** : {amber}« l'homme »{/amber} est une abstraction qui désigne dans la confusion l'espèce biologique {blue}*Homo sapiens*{/blue}, le genre humain historiquement évolué et l'individu pris dans l'abstrait. Qui pense avec un tel mot {coral}se condamne à ne rien penser avec rigueur{/coral} : cette pensée de jeunesse ne peut donc pas passer pour « la philosophie de Marx ».
    - {green}**Oui**{/green}, la pensée mûrie de Marx rompt avec ce qu'on appelait jusque-là philosophie, **mais cela ne fait pas disparaître toute dimension philosophique** : les {sky}*Grundrisse*{/sky}, premier brouillon du *Capital*, et *Le Capital* lui-même ne relèvent pas du {red}positivisme{/red}.

    **D'où la distinction qui commande tout le reste, selon** {sky}**Sève**{/sky} : Marx a rompu avec {red}__la philosophie__{/red}, au sens qu'il donnait à ce mot (reste à le préciser), mais ses travaux ultérieurs ne sont pas étrangers au {green}__philosophique__{/green} (reste à dire ce que ce mot veut dire).

    ! « Sortir de la philosophie » ne veut pas dire passer de la philosophie à une science positive : c'est précisément ce que l'œuvre de maturité dément.
