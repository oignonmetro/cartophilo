- id: philo1-l4
  title: "Engels : une fin de la philosophie trop positiviste"
  notes: |-
    **On pourrait se tourner vers le meilleur connaisseur de Marx,** {sky}**Engels**{/sky}**, mais son** {sky}***Ludwig Feuerbach***{/sky} **(1888) ne répond pas mieux : il pense la fin de la philosophie à la manière des positivistes.** C'est pourquoi, pour savoir ce que Marx a d'original en philosophie, {coral}il faut lire Marx, nul autre{/coral}.

    **Première thèse d'Engels : la philosophie est devenue superflue.** La {blue}*philosophia perennis*{/blue} aurait servi de {yellow}bouche-trou{/yellow} à des sciences trop lacunaires pour donner une vue d'ensemble du monde ; au XIXe siècle, les savoirs positifs ont comblé leurs manques et rendu cet adjuvant {teal}« superflu »{/teal}. Difficile de ne pas penser au dédain de {sky}Comte{/sky} pour toute métaphysique « oiseuse ». Or ce n'est pas la critique de 1846 :

    | La philosophie est | Pour Engels en 1888 | Pour *L'Idéologie allemande* |
    | critiquée comme | un savoir immature | une entreprise mystificatrice |
    | sur le plan | intellectuel | politique |
    | et l'on veut | en pallier les lacunes | en subvertir la démarche |

    **Seconde thèse : il en reste la logique formelle et la dialectique.** Engels refuse pourtant la proscription totale de la philosophie : il en subsiste {teal}« à l'état indépendant » {teal}« {/teal}la doctrine de {teal}la pensée et de ses lois{/teal}, {teal}la logique formelle et la dialectique »{/teal}{/teal}. Deux difficultés.
    - {red}La logique formelle{/red} se constitue au même moment, avec {sky}Peano{/sky} et {sky}Frege{/sky}, en discipline scientifique rigoureuse, proche parente de l'{amber}arithmétique{/amber} et non de la philosophie.
    - {red}La dialectique{/red} réduite à une « doctrine de la pensée », c'est la seule {violet}dialectique subjective{/violet} ; or chez Hegel elle est {green}inséparablement objective et subjective{/green}, logique de l'être et de l'essence autant que du concept, et à plus forte raison dans une dialectique matérialiste. On est plus près du {red}néokantisme{/red} fin de siècle que de Marx.

    **Engels n'est pas pour autant le mauvais génie de Marx.** La légende qui fait de lui le vrai père du « marxisme » dogmatique est fausse : d'une culture encyclopédique, il fut un {green}partenaire de pensée à part entière{/green}, qui a parfois ouvert la voie commune (ses {yellow}*Umrisse*{/yellow} de 1844, première critique profonde du capitalisme ; ses travaux sur l'État) ; dans ses lettres des années 1890 à Schmidt, Bloch, Mehring ou Borgius, il met en garde contre le schématisme marxiste qu'on l'accuse d'avoir instauré. Mais en philosophie, son apport n'égale pas celui de Marx : il n'en a {red}ni la profondeur de formation ni la sûreté de vue{/red}. C'est pourquoi un choix de textes philosophiques ne peut puiser indifféremment chez l'un et l'autre.

    ! Rejeter l'interprétation d'Engels en philosophie n'est pas rejeter Engels : sur la dialectique de la nature ou sur la pensée de son ami, il a des vues pénétrantes.
