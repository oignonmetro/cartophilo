# Cours sur la dimension philosophique de l'œuvre de Marx (voir
# content/philosophie.md, § « Un cours sur un auteur, tiré d'un commentaire »,
# et la conduite de la skill cours-sep), tiré de l'introduction de Lucien Sève,
# « De "la philosophie" au philosophique » (janvier 2011), à Karl Marx, Écrits
# philosophiques, cent textes choisis, traduits et présentés par L. Sève,
# Flammarion, « Champs classiques », 2011. Unités philo1 à philo7, une par
# grande partie de l'introduction (la cinquième, très longue, en trois unités).
# Ici : partie 1, « Y a-t-il une philosophie de Marx ? ».
#
# Citations : celles de Marx adoptent la traduction de référence quand elle
# existe (content/courses/marx/traductions.md) ou les Éditions sociales ; les
# autres (Althusser, Engels, Lénine, et les passages de Marx que les volumes de
# référence ne donnent pas lisiblement) sont reprises de la traduction de Sève.
# L'Idéologie allemande et la 11e thèse sur Feuerbach : Éditions sociales.

id: philo1
title: "Y a-t-il une philosophie de Marx ?"
subtitle: "Un philosophe de jeunesse qui dit adieu à la philosophie ; les réponses d'Althusser et d'Engels, et pourquoi elles ne suffisent pas"
group: "Le philosophique chez Marx"
icon: compass
color: coral
lessons:
- id: philo1-l1
  title: "Une œuvre philosophique de jeunesse, puis l'adieu"
  notes: |-
    **La question « y a-t-il une philosophie de Marx ? » est plus difficile qu'elle n'en a l'air : Marx a été philosophe, puis il a** {coral}**rompu avec « la philosophie »**{/coral}**, en des termes qui semblent définitifs.** Tout le problème est de savoir ce que devient, après cette rupture, la dimension philosophique de son œuvre.

    **Jusqu'en 1848, Marx est clairement un philosophe.** Il fait ses études à {sky}Berlin{/sky} au tournant des années 1830-1840, au moment où l'on fait l'inventaire critique de la plus grande philosophie moderne, celle de {sky}Hegel{/sky}. Il soutient en 1841 une thèse : *Sur la différence de la philosophie naturelle chez Démocrite et chez Épicure*. Empêché d'enseigner pour raisons politiques (sous {sky}Frédéric-Guillaume IV{/sky}), devenu journaliste d'opposition, il poursuit sa critique de Hegel et de {sky}Feuerbach{/sky}, puis s'oppose à des philosophes contemporains comme {sky}Ruge{/sky} ou {sky}Stirner{/sky}. Ses écrits jusqu'à trente ans relèvent de la philosophie :

    | Œuvre | Date |
    | *Critique du droit politique hégélien* | 1843 |
    | *Manuscrits de 1844* | 1844 |
    | *La Sainte Famille*, avec Engels | 1844-1845 |
    | *Thèses sur Feuerbach* | 1845 |
    | *L'Idéologie allemande*, avec Engels | 1845-1846 |

    **Mais** {sky}***L'Idéologie allemande***{/sky} **semble y mettre un point final.** Elle reproche à la critique allemande de n'avoir {teal}« {/teal}pas quitté {teal}le terrain de la philosophie »{/teal}, au lieu de s'interroger sur la {amber}connexion entre la philosophie allemande et la réalité allemande{/amber}. Elle déclare ruinée l'idée d'une {red}« philosophie autonome »{/red} : {teal}« {/teal}{teal}détachées de l'histoire réelle »{/teal}, les abstractions philosophiques {teal}« {/teal}n'ont absolument {teal}aucune valeur »{/teal}. La {sky}11e thèse sur Feuerbach{/sky} donne la formule de ce congé : {teal}« {/teal}Les philosophes n'ont fait qu'{teal}__interpréter__{/teal} le monde de différentes manières, ce qui importe, c'est de le {teal}__transformer__{/teal}.{teal} »{/teal}

    **L'adieu vise aussi l'œuvre de jeunesse de Marx lui-même.** Ce que ses écrits de 1844-1845 avaient de juste restait recouvert par {red}« le vocabulaire philosophique traditionnel »{/red}, et laissait croire que pouvaient encore servir les {yellow}« vieilles vestes théoriques »{/yellow} : des habits usés qu'on ne raccommode pas, qu'on jette. On ne pactise pas avec l'abstraction philosophante : {teal}« {/teal}il faut laisser de côté la philosophie, il faut en {teal}__sortir d'un bond__{/teal} et se mettre à l'étude de la réalité en tant qu'homme ordinaire{teal} »{/teal}. Autrement dit : ni réforme ni transition, une rupture.

    ! L'adieu n'est pas un abandon de la pensée pour l'action : il vise une manière de penser, l'abstraction coupée de l'histoire réelle, et ouvre sur l'étude de la réalité.
  points:
