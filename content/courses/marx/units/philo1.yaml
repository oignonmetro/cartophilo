- id: philo1-l3
  title: "Althusser : une philosophie « imaginaire »"
  notes: |-
    **Les grands penseurs marxistes ne tranchent pas la question ; le plus prestigieux,** {sky}**Louis Althusser**{/sky} **(1918-1990), finit par prêter à Marx une philosophie qui n'est pas la sienne.** On pourrait interroger {sky}Korsch{/sky}, {sky}Lukács{/sky}, {sky}Gramsci{/sky} ou {sky}Bloch{/sky} ; leur réponse laisse perplexe. Celle d'Althusser, dominante jusqu'à nous, change en deux temps.

    **Deux définitions successives.**

    | Temps | Œuvres | La philosophie de Marx serait |
    | premier | *Pour Marx*, *Lire Le Capital* (1965) | « la Théorie de la pratique théorique » |
    | second | *Lénine et la philosophie* (1968), *Éléments d'autocritique* (1974) | « la lutte de classes dans la théorie » |

    - Le {amber}premier temps{/amber} critique les lectures {red}empiristes{/red} et {red}humanistes{/red} : la philosophie de Marx serait une connaissance non des choses, mais d'une abstraite {violet}« production de connaissance »{/violet}.
    - Le {amber}second temps{/amber} rejette ce {red}« théoricisme »{/red} : la philosophie ne ferait que tracer, dans les savoirs, des {violet}« démarcations »{/violet} entre des {violet}« positions »{/violet} indémontrables (matérialisme, idéalisme), toujours les mêmes, lourdes d'enjeux politiques. Le mérite de Marx serait d'avoir inauguré {teal}« {/teal}non pas une (nouvelle) {teal}__philosophie de la praxis__{/teal} mais une {teal}__pratique (nouvelle) de la philosophie__ »{/teal}. Une telle philosophie {coral}n'a plus d'objet, et il ne s'y passe rien{/coral} : elle se réduit à intervenir politiquement dans le savoir.

    **Le prix de cette lecture.** Elle a un mérite : elle respecte l'adieu à toute abstraction philosophante, contre le dogmatisme fruste du {blue}*diamat*{/blue} stalinien. Mais elle le paie cher.
    - {red}__Une cécité de principe__{/red} devant les objets philosophiques qui peuplent l'œuvre d'après 1846 : les {violet}catégories logiques{/violet}, essence, abstraction, universalité, forme, rapport, aliénation. Pour Althusser, la logique est devenue une science formelle (« elle est une science ») : il exclut sans examen le sens neuf que {sky}Hegel{/sky} avait donné au logique, et donc sa refonte par Marx.
    - {red}__Un Marx qui ne se comprend pas lui-même__{/red}. Ces catégories ne devraient pas s'y trouver ; or elles y sont : Althusser conclut que {teal}« {/teal}Marx {teal}ne se libéra jamais totalement{/teal} de {teal}Hegel »{/teal}. Par une {violet}« lecture symptomale »{/violet}, qui prétend déceler dans le texte les retombées de la pensée, il écarte de vastes pans de l'œuvre : le {yellow}« matérialisme de l'essence »{/yellow} devient une dérive idéaliste, la {yellow}négation de la négation{/yellow} une téléologie, voire une « horreur ».

    **Althusser l'a lui-même reconnu.** {sky}Raymond Aron{/sky} parlait d'un {red}« marxisme imaginaire »{/red} ; Althusser concède qu'Aron « avait un peu raison » : {teal}« {/teal}Nous avons fabriqué une philosophie "{teal}__imaginaire__{/teal}" pour Marx, une philosophie qui {teal}__n'existait pas dans son œuvre__{/teal}, si l'on s'en tient strictement à la lecture de ses textes.{teal} »{/teal} La tentative la plus savante pour situer Marx en philosophie lui a donc imputé une {red}« philosophie improbable »{/red}.
  points:
