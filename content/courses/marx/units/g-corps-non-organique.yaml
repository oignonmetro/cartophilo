  points:
  - id: g-corps-non-organique-l1-q1
    sentence: "La nature extérieure, en tant qu'elle prolonge le corps de l'homme qui en vit et agit sur elle, Marx l'appelle en 1844 son corps ___."
    answer: non-organique
    alt: ["non organique", "inorganique"]
  - id: g-corps-non-organique-l1-q2
    sentence: "Le corps non-organique de l'homme se dit en allemand unorganischer ___."
    answer: Leib
    alt: []
  - id: g-corps-non-organique-l1-q3
    sentence: "« La nature, c'est-à-dire la nature qui n'est pas elle-même le corps humain, est le corps ___ de l'homme » (Manuscrits de 1844, premier manuscrit)."
    answer: non-organique
    alt: ["non organique"]
  - id: g-corps-non-organique-l1-q4
    sentence: "« L'homme vit de la nature signifie : la nature est son corps avec lequel il doit maintenir un ___ pour ne pas mourir » (Manuscrits de 1844, premier manuscrit)."
    answer: processus constant
    alt: []
  - id: g-corps-non-organique-l1-q6
    sentence: "La nature est un corps, et non un simple milieu, car ce dont un vivant ne peut se séparer sans ___ n'est pas hors de lui."
    answer: mourir
    alt: []
  - id: g-corps-non-organique-l1-q7
    sentence: "Les plantes, les animaux, les pierres, l'air, la lumière « constituent du point de vue théorique une partie de la ___ humaine, soit en tant qu'objets des sciences de la nature, soit en tant qu'objets de l'art » (Manuscrits de 1844, premier manuscrit)."
    answer: conscience
    alt: []
  - id: g-corps-non-organique-l1-q8
    sentence: "Le corps non-organique n'est pas une métaphore : « la nature est indissolublement liée avec elle-même, car l'homme est une ___ de la nature » (Manuscrits de 1844, premier manuscrit)."
    answer: partie
    alt: []
  - id: g-corps-non-organique-l1-q9
    sentence: "L'animal aussi vit de la nature non-organique, mais, dit Marx, « plus l'homme est ___ par rapport à l'animal », plus vaste est le champ de la nature dont il vit (Manuscrits de 1844, premier manuscrit)."
    answer: universel
    alt: []
  - id: g-corps-non-organique-l1-q10
    sentence: "« L'universalité de l'homme apparaît en pratique précisément dans l'universalité qui fait de la nature ___ son corps non-organique » (Manuscrits de 1844, premier manuscrit)."
    answer: entière
    alt: ["entiere"]
  - id: g-corps-non-organique-l1-q11
    sentence: "La nature est le corps non-organique de l'homme dans la mesure où elle est un moyen de subsistance immédiat, et dans celle où « elle est la matière, l'objet et l'___ de son activité vitale » (Manuscrits de 1844, premier manuscrit)."
    answer: outil
    alt: []
  - id: g-corps-non-organique-l1-q12
    sentence: "L'homme produisant à la mesure de toute espèce, son corps non-organique s'étend aussi loin que son ___."
    answer: activité
    alt: ["activite"]
  - id: g-corps-non-organique-l1-q13
    sentence: "« L'ouvrier est spolié non seulement des objets les plus nécessaires à la vie, mais encore des objets du ___ » (Manuscrits de 1844, premier manuscrit)."
    answer: travail
    alt: []
  - id: g-corps-non-organique-l1-q14
    sentence: "Le travail aliéné « transforme l'___ que l'homme a sur l'animal en ce désavantage que son corps non-organique, la nature, lui est dérobé » (Manuscrits de 1844, premier manuscrit)."
    answer: avantage
    alt: []
  - id: g-corps-non-organique-l1-q16
    sentence: "Plus le corps non-organique de l'homme est vaste, plus il perd : l'universalité qui faisait sa supériorité sur l'animal devient l'étendue de sa ___."
    answer: dépossession
    alt: ["depossession"]
  - id: g-corps-non-organique-l1-q17
    sentence: "« Le comble de cette servitude est que seule sa qualité d'ouvrier lui permet de se conserver encore en tant que sujet ___ » (Manuscrits de 1844, premier manuscrit)."
    answer: physique
    alt: []
  - id: g-corps-non-organique-l1-q18
    sentence: "Dans les Grundrisse, pour le travailleur des communautés anciennes, « la première condition objective de son travail apparaît comme nature, comme ___, comme son corps inorganique » (chapitre du capital)."
    answer: terre
    alt: []
  - id: g-corps-non-organique-l1-q19
    sentence: "La relation du travailleur ancien à la terre « est médiatisée par le fait qu'il est lui-même membre naturel d'une ___ » (Grundrisse, chapitre du capital)."
    answer: communauté
    alt: ["communaute"]
  - id: g-corps-non-organique-l1-q20
    sentence: "Selon les Grundrisse, ce n'est pas l'unité des hommes avec leurs conditions inorganiques « qui demande à être expliquée [...], mais la ___ entre ces conditions inorganiques de l'existence humaine et cette existence active »."
    answer: séparation
    alt: ["separation"]
  - id: g-corps-non-organique-l1-q21
    sentence: "La séparation du travailleur et de ses conditions inorganiques « n'a été posée comme séparation totale que dans le rapport du travail ___ et du capital » (Grundrisse)."
    answer: salarié
    alt: ["salarie"]
  - id: g-corps-non-organique-l1-q22
    sentence: "Séparé de la terre et de la communauté, le travailleur n'est plus qu'une « puissance de travail sans objectivité, purement ___ » (Grundrisse)."
    answer: subjective
    alt: []
  - id: g-corps-non-organique-l1-q23
    sentence: "Contre les économistes, le rapport du travailleur séparé de ses conditions « ne relève pas de l'histoire ___ » : il est le résultat d'une évolution historique passée (Le Capital, livre I, chap. IV)."
    answer: naturelle
    alt: []
  - id: g-corps-non-organique-l1-q24
    sentence: "« Le moyen de travail est une chose ou un complexe de choses que le travailleur ___ entre son objet de travail et lui » (Le Capital, livre I, chap. V)."
    answer: insère
    alt: ["insere"]
  - id: g-corps-non-organique-l1-q25
    sentence: "« De même que la terre est son garde-manger originel, elle est l'___ originel de ses moyens de travail » (Le Capital, livre I, chap. V)."
    answer: arsenal
    alt: []
  - id: g-corps-non-organique-l1-q26
    sentence: "« Ainsi l'élément naturel devient-il lui-même un ___ de son activité » (Le Capital, livre I, chap. V)."
    answer: organe
    alt: []
  - id: g-corps-non-organique-l1-q27
    sentence: "« Non-organique » ne veut pas dire sans vie, puisque plantes et animaux en font partie : le mot désigne ce qui n'est pas un ___ du corps propre, mais en tient lieu."
    answer: organe
    alt: []
  - id: g-corps-non-organique-l1-a1
    sentence: "__Pourquoi le **corps non-organique** de l'homme est-il plus vaste que celui de l'animal ?__ Parce que l'animal ne prend dans la nature que ce dont son ___ a besoin."
    answer: espèce
    alt: ["espece"]
  - id: g-corps-non-organique-l1-a2
    sentence: "__Le travailleur des communautés anciennes trouve la **terre**__ sans la produire, et il ne la tient qu'en tant que ___ d'une communauté."
    answer: membre
    alt: []
  - id: g-corps-non-organique-l1-a3
    sentence: "Pour que la nature soit son **corps**, __il faut que l'homme soit lui-même un être__ ___, posé par les objets sur lesquels il agit."
    answer: naturel
    alt: []
  - id: g-corps-non-organique-l1-a4
    sentence: "__Ce que 1844 disait de la nature entière, le **Capital** le montre, dans le travail même,__ sur l'___."
    answer: outil
    alt: []
