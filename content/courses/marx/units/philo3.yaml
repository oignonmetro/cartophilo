- id: philo3-l3
  title: "Le laboratoire des Grundrisse"
  notes: |-
    **Inventer une** {violet}**logique matérialiste-historique**{/violet} **exige, paradoxe, une confrontation serrée avec Hegel : sa logique viciée par l'idéalisme** {coral}**porte des vérités insoupçonnées**{/coral}**, que l'économie fait retrouver.**

    **Deux exemples de vérités hégéliennes retrouvées dans les choses.**
    - {amber}__La contradiction qui se réconcilie.__{/amber} En 1843, contre la contradiction hégélienne qui fait toujours retour à l'Un, Marx défendait la {green}contradiction irréconciliable{/green}, révolutionnaire. Mais le simple {yellow}cycle de l'échange marchand{/yellow} est une contradiction qui {amber}se réconcilie sans cesse{/amber} entre forme-marchandise et forme-argent : on vend pour acheter, on achète pour vendre. Ce n'est pas la contradiction idéelle de la *Logique*, mais elle en a plusieurs traits.
    - {amber}__L'autodéveloppement du concept.__{/amber} Ce qu'il y a de plus idéaliste chez Hegel, le concept qui se développe de lui-même, trouve un {green}sens matérialiste réel{/green} dans l'inversion des rapports entre personne et chose que produit le capitalisme : le {yellow}capital{/yellow} y devient, fantasmagoriquement, un {violet}sujet actif{/violet}, qui se valorise comme de lui-même. Hegel décrivait sans le savoir une illusion que la société capitaliste rend réelle.

    **Un brouillon où l'on voit penser un grand auteur.** Marx écrit les *Grundrisse* pour lui seul, « sans filet » : on l'y voit faire des trouvailles, douter de leur pertinence, tenter l'intentable, réussir le mémorable. Il y invente ce qu'il appelait déjà en 1843 la {teal}« logique propre de l'objet propre »{/teal}, à l'opposé d'une science passe-partout de la logique : chaque objet (l'argent, le capital) a sa logique, qu'on ne trouve pas en appliquant des catégories toutes faites. D'où un texte qui bouscule les classifications, et sur lequel des lecteurs avertis passent sans voir des trésors de pensée.

    **Althusser avait touché juste, tout en manquant la chose.** Sans avoir lu les *Grundrisse*, il disait que Marx avait apporté {teal}« non pas une (nouvelle) philosophie de la praxis mais une (nouvelle) pratique de la philosophie »{/teal}. {sky}Sève{/sky} propose, dans le même esprit mais bien autrement : une nouvelle pratique non pas {red}« de la philosophie »{/red}, surtout pas, mais {green}du philosophique{/green}.
