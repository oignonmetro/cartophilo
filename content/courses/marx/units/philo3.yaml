- id: philo3-l4
  title: "Pourquoi parler du « philosophique »"
  notes: |-
    **Marx n'a jamais nommé philosophique son travail d'après 1846 : il parle de** {violet}**logique**{/violet}**, de catégories logiques.** Parler du « philosophique » demande donc une raison probante ; elle existe, et {coral}ce mot est même devenu indispensable{/coral}.

    **Pourquoi « logique » désigne bien de la philosophie.** C'est {sky}Hegel{/sky} qui, dès la Préface de la {sky}*Science de la logique*{/sky}, prenant acte de l'abandon de la métaphysique, identifie la {violet}« philosophie spéculative »{/violet} à la {violet}« science logique »{/violet}, en un sens non simplement formel. Quand Marx dit s'occuper de logique, il va de soi, pour lui comme pour nous, qu'il s'occupe de questions ci-devant philosophiques, à traduire en termes non spéculatifs.

    **Pourquoi il ne prononce jamais le mot.** Jeune, Marx fut philosophe dans l'âme, voulut enseigner la philosophie, crut qu'elle pouvait être autre chose qu'une mystification conservatrice ; et {red}elle l'a radicalement trahi{/red} : l'objet de sa passion adolescente s'est révélé solidaire de tout ce qu'il se mettait à détester. Le mot est devenu {amber}imprononçable{/amber}, irrémédiablement dépréciatif. {sky}Engels{/sky}, qui a vécu la même rupture sans déchirement comparable, pourra ranger calmement « la logique et la dialectique » sous la rubrique du philosophique ; Marx non. C'est une {violet}allergie{/violet} définitive, que nous devons comprendre, mais pas partager.

    **Pourquoi le mot est aujourd'hui indispensable.** Entre Marx et nous, la {red}logique formelle{/red} s'est constituée, puis s'est fait passer pour la seule logique digne de ce nom ; la logique au sens de Hegel est traitée en vieillerie métaphysique, ou passée sous silence. Dire aujourd'hui que le travail de Marx est « logique » ne produirait que des malentendus. Il faut donc lui rendre sa dimension {green}pleinement philosophique{/green}, dont le centre est l'élaboration critique des {violet}catégories logiques{/violet}.

    **Car la logique catégorielle demeure.** Rappel têtu : l'{sky}*Organon*{/sky} d'Aristote comprend les *Catégories* aussi bien que les *Premiers* et *Seconds Analytiques*. D'Aristote aux catégories de l'entendement de {sky}Kant{/sky}, au système des essentialités logiques de Hegel, puis à l'élaboration de Marx, ce travail est au cœur de toute culture théorique : {coral}même un logicien formel pense son objet dans des catégories, à commencer par celle du formel{/coral}.

    **D'où la forme adjectivée.** On dira le {green}philosophique{/green} marxien, en maintenant qu'il n'y a pas de {red}« philosophie de Marx »{/red}.
