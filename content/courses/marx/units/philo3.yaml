# Cours sur la dimension philosophique de l'œuvre de Marx, tiré de
# l'introduction de Lucien Sève aux Écrits philosophiques de Marx (Flammarion,
# « Champs classiques », 2011) : voir l'en-tête de philo1. Ici : partie 3,
# « Le "renversement matérialiste" de la logique hégélienne à l'œuvre » (les
# Grundrisse, le renversement à double détente, pourquoi parler du
# « philosophique », ce qu'est une catégorie).
#
# Citations : Introduction de 1857 dans les Éditions sociales (Contribution à
# la critique de l'économie politique) ; Postface du Capital dans la GEME
# (Lefebvre) ; Critique du droit politique hégélien dans la GEME (Kervégan) ;
# la parenthèse des Grundrisse (« corriger la manière idéaliste de
# l'exposé ») dans la traduction de Sève.

id: philo3
title: "Le renversement de la logique de Hegel"
subtitle: "Les Grundrisse, laboratoire du renversement matérialiste ; pourquoi parler du « philosophique » de Marx, et ce qu'est une catégorie"
group: "Le philosophique chez Marx"
icon: compass
color: coral
lessons:
- id: philo3-l1
  title: "Trois références critiques à Hegel"
  notes: |-
    **Que les** ***Grundrisse*** **ne soient pas une rechute hégélienne se constate dès l'Introduction de 1857 : ses trois références à Hegel sont** {coral}**trois critiques, sur un plan fondamental**{/coral}**.** Chaque fois, la démarche de Hegel relève de l'inversion spéculative.

    **Les trois références.**

    | Sujet | Ce que ferait Hegel | La critique de Marx |
    | production et consommation | les poser comme identiques | point de vue faux, spéculatif : la consommation est un moment de la production |
    | le concret | le concevoir comme résultat de la pensée | le concret pensé n'est pas la genèse du concret réel |
    | la possession | en faire la catégorie première du droit | elle suppose des rapports plus concrets, la famille |

    - {amber}__Production et consommation.__{/amber} Après avoir recensé leurs « identités » (produire, c'est consommer des matières ; consommer, c'est produire sa propre force), Marx note : {teal}« Rien de plus simple alors, pour un hégélien, que de poser la production et la consommation comme __identiques__. »{/teal} Erreur : la consommation est en fin de compte un {green}moment de la production{/green}.
    - {amber}__Le concret.__{/amber} La pensée ramène le concret de la représentation à des déterminations abstraites, puis reproduit le concret à partir d'elles. {teal}« C'est pourquoi Hegel est tombé dans l'__illusion__ de concevoir __le réel comme le résultat de la pensée__ »{/teal} : il confond le chemin par lequel l'esprit {green}reproduit{/green} le concret avec la genèse du concret lui-même.
    - {amber}__La possession.__{/amber} Les catégories les plus simples ne sont pas toujours les plus tardives : {teal}« Hegel, par exemple, a raison de commencer la philosophie du droit par la __possession__, celle-ci constituant le rapport juridique le plus simple du sujet. Mais il n'existe pas de possession avant que n'existe __la famille__, ou les rapports entre maîtres et esclaves, qui sont des rapports beaucoup plus concrets. »{/teal} La possession n'est donc pas une catégorie absolument première.

    **La parenthèse décisive.** Au terme de son analyse de la monnaie (« il est immanent à l'argent d'accomplir ses finalités bien qu'en même temps il les nie… »), Marx ajoute : {teal}« Ultérieurement, avant d'abandonner cette question, il sera nécessaire de __corriger la manière idéaliste__ de l'exposé, suscitant le __faux-semblant__ [*den Schein*] qu'il s'agit uniquement de déterminations conceptuelles et de la dialectique de ces concepts. »{/teal} Ce que montrent les *Grundrisse*, c'est donc le {coral}début, tâtonnant, du renversement matérialiste{/coral} de la méthode et de la logique hégéliennes.

    ! Le ton hégélien d'une page des *Grundrisse* n'est pas une adhésion : Marx le signale lui-même comme un défaut d'exposition à corriger.
  points:
