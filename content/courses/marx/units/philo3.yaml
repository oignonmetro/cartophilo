- id: philo3-l5
  title: "Qu'est-ce qu'une catégorie ?"
  notes: |-
    **Marx reprend à Hegel l'identification du philosophique au logique et du logique au dialectique, mais il** {coral}**revient au vocabulaire apparemment kantien des catégories**{/coral}**, plutôt qu'au concept hégélien.** Pour comprendre ce choix surprenant, il faut savoir ce qu'est une catégorie selon chacun.

    | Auteur | Nombre | Les catégories sont |
    | Aristote | dix | les genres les plus élevés de l'être |
    | Kant | douze | les concepts purs de l'entendement |
    | Hegel | un système | des déterminations-de-pensée à élever au concept |

    - {sky}**Aristote**{/sky}, dans l'*Organon* : les catégories sont les {violet}genres les plus élevés{/violet} selon lesquels on peut énoncer les prédicats de l'être. Leur portée est donc {amber}ontologique{/amber} aussi bien que {amber}logique{/amber} : elles disent comment l'être se dit, et comment il est.
    - {sky}**Kant**{/sky} : douze, en {amber}quatre triades{/amber} (quantité, qualité, relation, modalité), ce sont les {violet}concepts purs de l'entendement{/violet}, déduits des fonctions logiques du jugement. Elles sont donc {red}propres au sujet pensant{/red}.
    - {sky}**Hegel**{/sky} bouleverse la question : gardant le sens kantien du mot, il voit dans les catégories des {violet}déterminations-de-pensée{/violet} (*Denkbestimmungen*) prises à la façon abstraite et subjective de l'entendement, qu'il faut élever au {green}concept{/green}, moment d'un système rationnel à la fois objectif et subjectif, {yellow}âme vivante de tout contenu{/yellow}.
    - **Marx** rompt avec Hegel sur ce point : il ne reprend pas le concept hégélien et parle de nouveau de {violet}catégories{/violet}.

    **Une difficulté : Marx ne commente presque jamais son travail catégoriel.** Il ne « philosophe » à peu près jamais sur son travail implicitement philosophique. Le passage de *Misère de la philosophie* où il parle des catégories ne dit rien de plus qu'une idée simple : à force d'abstraction, on ne trouve au fond de toute chose qu'une catégorie logique, la {yellow}« quantité toute pure »{/yellow}. Ce n'est guère plus que la formule d'Aristote : cela ne tranche ni le litige entre Kant et Hegel (les catégories ont-elles une {amber}portée objective{/amber}, ou seulement {amber}subjective{/amber} ?), ni l'énigme de la préférence de Marx pour le mot kantien.

    ! Le retour au mot « catégorie » n'est pas un retour à Kant : la suite montre qu'il rouvre une perspective critique, mais sur une base matérialiste et historique.
  points:
