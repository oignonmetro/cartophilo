- id: philo3-l2
  title: "Un renversement à double détente"
  notes: |-
    **Le renversement matérialiste proclamé en 1846 est une** {coral}**opération à double détente**{/coral} **: un premier acte bref, sur la forme du rapport ; un second, immense, sur le contenu de la logique.** C'est le second qui commence dans les *Grundrisse*.

    | Acte | Ce qu'on renverse | Durée |
    | formel | la forme du rapport entre l'idéel et le réel | d'un geste |
    | réel | le contenu de la logique hégélienne | d'un long travail |

    **Premier acte : une prise de conscience critique.** Non, l'idéel n'est pas le démiurge du réel ; la Postface du *Capital* le dit : {teal}« chez moi, à l'inverse, l'idéel n'est rien d'autre que __le matériel transposé et traduit__ dans la tête de l'homme »{/teal}. Remettre sur ses pieds le rapport entre matière et idée est un acte {amber}bref{/amber}, accompli dès qu'il est conçu, même s'il suppose une longue maturation.

    **Second acte : renverser le contenu.** À l'intérieur de sa conception inversée, Hegel a élaboré une logique {green}exceptionnellement riche{/green} et {red}intimement idéaliste{/red} : il n'est pas plus question de la laisser perdre que de la reprendre telle quelle. Il faut donc renverser, d'un long travail, le {violet}contenu{/violet} de cette logique : c'est ce {green}renversement réel{/green} qui seul mettra fin au discours de la mauvaise abstraction.

    **Le premier acte est la clef du second** : il faut retourner la dialectique {teal}« pour découvrir le noyau rationnel sous l'enveloppe mystique »{/teal}. Mais le second est d'une complexité sans commune mesure : c'est toute la substance de la {sky}*Science de la logique*{/sky}, qui condense des siècles de réflexion sur la méthode et les catégories, qu'il faut réélaborer de façon matérialiste et critique. Quand Marx s'y met, ce travail reste à faire.

    **D'où le renversement du préjugé.** Dans les *Grundrisse*, Marx n'est {red}pas « hégélianisant »{/red} : {green}il s'attaque au noyau dur du renversement matérialiste réel{/green}. La présence de Hegel y est forte, mais comme celle d'un adversaire qu'on démonte pièce à pièce.

    ! Croire que tout est dit quand on a remis Hegel sur ses pieds, c'est s'arrêter au premier acte : le renversement formel ne livre aucune catégorie neuve.
