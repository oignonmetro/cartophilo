- id: sep-marx2-l3
  title: "L'explication fonctionnelle"
  notes: |-
    **Pour rendre la théorie cohérente, Cohen en fait une** {violet}**explication fonctionnelle**{/violet} **; reste à savoir si cette explication tient sans supposer que l'histoire poursuit un dessein.** Avant lui, la philosophie anglophone ne prenait pas le matérialisme historique au sérieux : {sky}H. B. Acton{/sky} concluait que {red}« le marxisme est un fatras philosophique »{/red} (*The Illusion of the Epoch*, 1955).

    **La contradiction apparente.** La thèse de la primauté dit que {amber}les forces productives expliquent la structure économique{/amber}. Or le *Manifeste* dit l'inverse : {teal}« {/teal}La bourgeoisie {teal}__ne peut exister sans révolutionner constamment les instruments de production__{/teal} et donc les rapports de production{teal} »{/teal}. Ici, {amber}c'est la structure (le capitalisme) qui développe les forces productives{/amber}. Forces productives et structure économique semblent ainsi s'expliquer l'une l'autre. {sky}Cohen{/sky} refuse les solutions vagues, la {pink}« détermination en dernière instance »{/pink} ou les {pink}liens « dialectiques »{/pink}, et cherche une solution aussi claire et rigoureuse que l'exige la philosophie analytique.

    **La solution : la structure existe *parce qu'*elle développe les forces productives.** On accorde sans peine que le capitalisme développe les forces productives ; mais {coral}c'est justement pour cela qu'il y a du capitalisme (quand il y en a){/coral}. S'il cessait de les développer, il disparaîtrait. C'est une {violet}explication fonctionnelle{/violet}, ou {violet}« explication par les conséquences »{/violet} : la chose s'explique par ses effets. La notion d'{violet}entrave{/violet} trouve alors sa place : {coral}une structure entrave les forces productives quand elle a cessé de remplir sa fonction{/coral}, et c'est pourquoi elle tombe. Les deux textes ne se contredisent plus : le capitalisme développe les forces productives (le *Manifeste*), et c'est ce qui explique qu'il existe (la *Préface*).

    **L'objection d'**{sky}**Elster**{/sky} **: des fins dans l'histoire, mais les fins de personne.** Qu'est-ce qui fait qu'une structure ne dure qu'autant qu'elle développe les forces productives ? {pink}Si un agent guidait l'histoire{/pink} avec ce but, on comprendrait : il choisirait les structures les plus efficaces ;mais Marx ne fait {red}aucune hypothèse métaphysique de ce genre{/red}. {sky}Jon Elster{/sky} attaque durement ces {red}« fins » qui ne sont celles de personne{/red}. {sky}Simone Weil{/sky} l'avait anticipé (*Oppression et liberté*) : pour {sky}Hegel{/sky}, un esprit caché mène l'histoire vers la perfection ; Marx a prétendu remettre cette dialectique sur ses pieds en mettant la matière à la place de l'esprit ; mais, paradoxe, {coral}il a prêté à la matière ce qui est l'essence même de l'esprit, une aspiration incessante au mieux{/coral}. Autrement dit, la finalité chassée avec l'esprit revient dans la matière.

    **La réponse de Cohen : la biologie.** On explique les {yellow}rayures du tigre{/yellow} ou les {yellow}os creux de l'oiseau{/yellow} par leur fonction : voilà des fins qui ne sont celles de personne. On objecte qu'en biologie, ces explications reposent sur un mécanisme causal :{amber}variation au hasard et survie du plus apte{/amber}, une boucle qui élimine ce qui fonctionne mal. Cohen appelle ce mécanisme une {violet}élaboration{/violet}, et répond :
    - toute explication causale en demande une aussi : {yellow}« le vase s'est brisé parce qu'il est tombé »{/yellow} n'explique rien sans bien d'autres faits (la fragilité de la porcelaine, la dureté du sol), qu'on ne précise pas ;
    - on peut donc avancer une explication fonctionnelle sans connaître son élaboration, {coral}pourvu que les preuves inductives soient assez fortes{/coral}. Avant {sky}Darwin{/sky}, un athée avait le droit de dire que les oiseaux ont des os creux pour voler, tant l'adaptation des organismes est manifeste.

    **La défense de Cohen laisse deux questions.** La question {amber}empirique{/amber} : les sociétés durent-elles tant qu'elles développent la puissance productive ? Les faits répondent mal : {red}l'histoire connaît de longues stagnations, et même des régressions{/red}, sans que les structures qui en sont responsables soient renversées. La question {amber}théorique{/amber}, un {violet}dilemme{/violet} :
    - première branche, imiter Darwin : les hommes essaient au hasard de nouveaux rapports économiques, et le plus « apte » (le meilleur pour développer les forces productives) survit. Mais {red}cela introduit une contingence{/red} que Marx refuse : le darwinisme ne permet aucune prédiction à long terme, or {coral}l'arrivée du communisme doit pouvoir se prédire{/coral} ;
    - seconde branche : chercher une autre élaboration, qui ne soit pas darwinienne, ou renoncer à prédire.
