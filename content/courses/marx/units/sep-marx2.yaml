- id: sep-marx2-l2
  title: "La Préface de 1859, lue par Cohen"
  notes: |-
    **La** {sky}***Préface* de 1859**{/sky} **ramasse en une page la théorie de l'histoire ; G. A.** {sky}**Cohen**{/sky} **en tire deux thèses, qui suffisent à expliquer les révolutions.** {sky}Cohen{/sky} (*Karl Marx's Theory of History*, 1978) est l'interprète philosophique de Marx le plus influent :sa reconstruction est la plus rigoureuse, mais elle est contestée.

    **Le texte.** {teal}« {/teal}Dans la production sociale de leur existence, les hommes entrent en des rapports déterminés, nécessaires, indépendants de leur volonté, {teal}__rapports de production__{/teal} qui correspondent à un degré de développement déterminé de leurs {teal}__forces productives matérielles__{/teal}. L'ensemble de ces rapports de production constitue {teal}__la structure économique de la société__{/teal}, la base concrète sur laquelle s'élève {teal}__une superstructure juridique et politique__{/teal} et à laquelle correspondent des formes de conscience sociales déterminées. Le mode de production de la vie matérielle {teal}conditionne{/teal} le processus de vie social, politique et intellectuel en général. {red}Ce n'est pas la conscience des hommes qui détermine leur être{/red} ; {green}c'est inversement leur être social qui détermine leur conscience{/green}. À un certain stade de leur développement, les forces productives matérielles de la société {teal}__entrent en contradiction__{/teal} avec les rapports de production existants [...]. De formes de développement des forces productives qu'ils étaient ces rapports en deviennent {teal}__des entraves__{/teal}. Alors s'ouvre {teal}__une époque de révolution sociale__ »{/teal} (*Contribution à la critique de l'économie politique*, Préface). Autrement dit : les {violet}rapports de production{/violet} sont les rapports entre les hommes dans la production ({yellow}maître et esclave, seigneur et serf, capitaliste et salarié{/yellow}) ; leur ensemble forme la {violet}structure économique{/violet}, la base ; au-dessus s'élève la {violet}superstructure{/violet}, le droit et l'État, et avec elle les idées d'une époque.

    **La** {violet}**thèse du développement**{/violet}**, que la *Préface* suppose sans l'écrire :** {coral}les forces productives tendent à se développer, à devenir plus puissantes, avec le temps{/coral}. Les {violet}forces productives{/violet}, ce sont {amber}les moyens de production{/amber} (terre, technique…) et {amber}la force de travail{/amber} (force et savoir). La thèse dit une {amber}tendance{/amber}, non qu'elles se développent toujours.

    **La** {violet}**thèse de la primauté**{/violet}**, en deux temps.**
    - {amber}la nature de la structure économique{/amber} s'explique par {amber}le degré de développement des forces productives{/amber} ;
    - {amber}la nature de la superstructure{/amber}, les institutions juridiques et politiques, s'explique par {amber}la nature de la structure économique{/amber}. L'{violet}idéologie{/violet} (croyances religieuses, artistiques, morales, philosophiques) s'explique elle aussi par la structure économique, bien que Cohen s'y attarde moins ; une religion, à la fois institution (une Église) et ensemble de croyances, relève de la superstructure comme de l'idéologie.

    **La révolution : quand la structure** {violet}**entrave**{/violet} **les forces productives.** Une structure économique qui ne peut plus développer les forces productives les {violet}entrave{/violet} ; elle est alors renversée et remplacée par une structure mieux faite pour les développer. Le *Manifeste* le dit de la féodalité : les rapports féodaux de propriété {teal}« {/teal}entravaient la production au lieu de la stimuler. Ils se transformèrent en {teal}__autant de chaînes__{/teal}. Il fallait {teal}__briser ces chaînes__{/teal}. Elles furent brisées{teal} »{/teal}. La théorie a une {coral}belle simplicité{/coral} : il est plausible que la puissance productive croisse, et que les structures durent tant qu'elles la font croître. Les difficultés viennent quand on cherche à préciser ce mécanisme.

    **Où est passée la lutte des classes ?** On reproche à Cohen de lui faire une place étonnamment petite, alors qu'elle semble centrale chez Marx. Il répond que la *Préface* ne la nomme pas. Mais Marx écrivait {yellow}sous l'œil de la censure{/yellow}, et le texte y fait allusion : {teal}« {/teal}{teal}une époque de révolution sociale »{/teal}, et {teal}« {/teal}les formes idéologiques sous lesquelles les hommes {teal}__prennent conscience de ce conflit et le mènent jusqu'au bout__ »{/teal} (*ibid*.). {coral}Que la *Préface* ne la nomme pas ne prouve donc pas que Marx la tenait pour secondaire.{/coral}

    ! Cohen a voulu une lecture claire, contre le flou des lectures hégéliennes dites « dialectiques » et contre le structuralisme de {sky}Louis Althusser{/sky} ; on lui reproche en retour un modèle {red}mécanique{/red}, qui néglige la {violet}dialectique{/violet}.
