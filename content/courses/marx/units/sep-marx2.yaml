- id: sep-marx2-l4
  title: "Ce qui pousse l'histoire, et d'autres lectures"
  notes: |-
    **Chez Cohen, le moteur dernier de l'histoire est la** {violet}**rationalité humaine**{/violet} **; c'est là que la théorie est la plus fragile.** Les forces productives, d'abord la technique, font l'histoire ; mais qu'est-ce qui les développe ? {green}L'ingéniosité des hommes, qui inventent de quoi répondre à la{/green} {violet}rareté{/violet}. C'est raisonnable, mais :
    - {red}une société ne fait pas toujours ce qui serait rationnel pour un individu{/red} : des problèmes de coordination (chacun gagnerait à l'innovation, mais personne n'a intérêt à commencer) ou des obstacles structurels l'en empêchent ;
    - {red}ceux qui introduisent une technique nouvelle visent rarement la rareté{/red} : sous le capitalisme, c'est le {violet}profit{/violet} (on peut répondre que le profit est la forme que prend, sous le capitalisme, le besoin de répondre à la rareté) ;
    - {red}le besoin de vaincre la rareté n'a pas toujours eu ce poids{/red} : une classe dirigeante décidée à garder le pouvoir, ou une société qui fait passer {yellow}la religion{/yellow} ou {yellow}la tradition{/yellow} avant l'économie, peuvent stagner longtemps.

    {coral}Ces objections touchent au cœur de la thèse de Marx{/coral} : l'homme serait un être essentiellement producteur, dont le rapport au monde passe d'abord par l'industrie. {sky}Cohen{/sky} lui-même reconnaîtra que l'accent sur la production {red}paraît unilatéral{/red} (« Reconsidering Historical Materialism », 1988).

    **D'autres lectures : ces difficultés seraient celles de Cohen, non de Marx.**
    - Marx n'aurait {amber}pas de théorie générale de l'histoire{/amber}, mais observerait et favoriserait un événement singulier, le passage du capitalisme au communisme. Quand il analyse un épisode, comme dans {sky}*Le 18 Brumaire de Louis Bonaparte*{/sky} (1852), il ne fait entrer les faits dans {red}aucun schéma fixe{/red} ;
    - il aurait une théorie générale, mais {amber}bien plus souple{/amber} que ne le veut Cohen ({sky}Miller{/sky}) ;
    - la lecture de Cohen serait {amber}fausse de part en part{/amber}, faute de dialectique ({sky}Sayers{/sky}).

    **Un Marx moins prométhéen ?** La lecture de Cohen suppose un {violet}prométhéisme{/violet} : la terre comme simple moyen des fins humaines, la production à développer sans fin. {sky}Kohei Saito{/sky} accorde que ce prométhéisme est bien celui de la *Préface* de 1859, mais soutient que Marx l'a abandonné en deux temps :
    - après le livre I du *Capital* (1867), il pense le communisme en termes {violet}écosocialistes{/violet}, comme une croissance soutenable ;
    - dans ses dernières années (ainsi dans sa correspondance avec {sky}Vera Zassoulitch{/sky}, en 1881), il embrasserait un {violet}communisme de décroissance{/violet}.
  points:
