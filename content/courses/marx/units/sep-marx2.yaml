# Cours sur la philosophie sociale et politique de Marx, tiré de l'article
# « Karl Marx » de David Leopold, SEP (révision 2025) : section 2 (théorie de
# l'histoire, 2.1 à 2.6), lue à travers la reconstruction de G. A. Cohen.
#
# Citations de Marx en français : Thèses sur Feuerbach et L'Idéologie allemande
# dans les Écrits philosophiques (Sève, Éditions sociales ; l'OCR du volume des
# Éditions sociales de L'Idéologie allemande est trop fautif) ; Manuscrits de
# 1844 (Bottigelli) ; Préface de 1859 dans la Contribution (Éditions sociales) ;
# Manifeste (Éditions sociales).
#
# Provisoire : le passage de Simone Weil (Oppression et liberté, 1955) est cité
