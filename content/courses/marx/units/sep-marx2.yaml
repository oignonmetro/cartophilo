lessons:
- id: sep-marx2-l1
  title: "Un matérialisme de l'activité"
  notes: |-
    **Marx fonde sa théorie de l'histoire sur une thèse : les hommes transforment le monde, non en pensée, mais par leur activité matérielle.** Il ne l'a jamais exposée en détail : on la reconstruit à partir de deux textes surtout, les manuscrits de {sky}*L'Idéologie allemande*{/sky} (1845-1846, avec {sky}Engels{/sky}), et la {sky}*Préface* de 1859{/sky} à la *Contribution à la critique de l'économie politique*, devenue canonique.

    **Les** {sky}***Thèses sur Feuerbach***{/sky} **(1845) renvoient dos à dos matérialisme et idéalisme.**
    - le {violet}matérialisme{/violet} a raison de saisir la réalité physique du monde, {red}mais oublie que le sujet humain est actif{/red} : c'est lui qui façonne le monde qu'il perçoit ;
    - l'{violet}idéalisme{/violet}, chez {sky}Hegel{/sky} surtout, saisit cette activité, {red}mais la confine à la pensée{/red} : le monde est créé par les catégories qu'on lui impose.

    D'où la première thèse : {teal}« {/teal}La principale lacune de {red}tout matérialisme jusqu'ici{/red} (y compris celui de Feuerbach) est que ce qui nous fait face, la réalité, le sensible n'est saisi que {teal}__sous la forme de l'objet ou de l'intuition__{/teal} ; et non pas en tant qu'{teal}__activité humaine sensible, que pratique__{/teal} ; pas de façon subjective{teal} »{/teal} (*Thèses sur Feuerbach*, I). Autrement dit, l'ancien matérialisme regarde le monde comme un spectacle donné d'avance, qu'on contemple (« l'objet », « l'intuition »), sans voir qu'il est pour une grande part le produit de l'activité humaine (« la pratique »). Marx réunit les deux héritages : {green}les hommes transforment bien le monde où ils se trouvent, mais par leur activité matérielle{/green}, {pink}non par l'imposition de concepts sublimes{/pink}, {green}à la sueur de leur front, par leur force et leur habileté{/green}.

    **Ce matérialisme, historique parce qu'il pense l'activité humaine dans le temps, entend dépasser toute la philosophie antérieure.** Les *Manuscrits de 1844* en donnent déjà la formule : {teal}« {/teal}L'industrie est {teal}__le rapport historique réel de la nature__{/teal}, et par suite des sciences de la nature, {teal}avec l'homme »{/teal}. Autrement dit, la nature n'est pas pour l'homme un spectacle, mais ce qu'il travaille ; et c'est dans l'{yellow}industrie{/yellow} que ce rapport a une histoire.

    **L'Idéologie allemande pose les** {violet}**prémisses**{/violet} **de la méthode matérialiste.** On part des {violet}individus réels{/violet}, et d'abord de ceci : {amber}ils doivent produire leurs moyens de subsistance pour satisfaire leurs besoins matériels{/amber}. L'homme est essentiellement producteur. Or la satisfaction des besoins en fait naître de nouveaux, matériels et sociaux, et {coral}les formes de société correspondent au degré de développement des forces productives{/coral}. D'où l'ordre de l'explication :{amber}de la production matérielle{/amber} aux {amber}formes sociales{/amber}, et de là aux {amber}formes de conscience{/amber}. {teal}« {/teal}La conscience ne peut jamais être rien d'autre que {teal}__l'être conscient__{/teal}, et l'être des hommes est {teal}__leur procès de vie réel__ »{/teal} (*L'Idéologie allemande*). À mesure que les moyens de production se développent, les {violet}modes de coopération{/violet}, c'est-à-dire les structures économiques, naissent puis disparaissent, jusqu'au jour où le communisme devient possible, quand la condition des ouvriers et la conscience d'une autre voie en font des révolutionnaires.
