lessons:
- id: ali11-l1
  title: "Deux figures de l'objectivité"
  notes: |-
    **Quand le procès de travail vivant a lieu, le sujet et l'objet se réunissent. Mais cette réunion se fait sous la puissance de l'objectivité morte : le travail vivant ne se déploie que pour le capital.**

    **Une réunion du sujet et de l'objet.** Dans le procès de travail vivant, est surmontée la séparation du sujet à l'égard des objets qui sont les conditions de la réalisation de son activité : le propriétaire de la force de travail est mis en contact avec une matière, des outils.

    **Deux figures de l'objectivité.** Il y a, pour Marx, toujours deux objectivités très différentes.

    ? **Objectivité vivante** : l'objectivité conçue comme un {teal}processus{/teal}, comme une {teal}activité d'objectivation{/teal}, qui est toujours en même temps un processus de réalisation et d'accomplissement. À l'opposé, l'**objectivité morte** est celle de l'activité {coral}coagulée{/coral}, accumulée : le résultat d'une activité qui n'en est plus une.

    **Tout dans le capital est du travail mort.** Le matériau, les instruments (produits d'un travail antérieur), et même la force de travail, que le capital considère comme le produit d'un travail antérieur, donc comme du travail accumulé et rien de vivant. {red}Tout dans le capital est produit, rien n'est productivité{/red} : pris tout seul, il est inerte. Seul le travail vivant est productivité.

    **La vie subordonnée à ce qui est mort.** Sous le capital, le travail vivant, qui est productivité en soi, n'a pas l'occasion de s'affirmer pour lui-même : il ne se déploie que sous le commandement du capital, et son activité objectivante ne sert qu'à {amber}valoriser le travail mort{/amber}. Le capital a donc mis la main sur la seule source de vie et de productivité, et parvient grâce à elle à donner vie à ce qui ne l'a pas ou ne l'a plus.

    ! La réunion du subjectif et de l'objectif n'est pas ici une réconciliation : elle se fait sous la puissance de l'objectivité morte.
