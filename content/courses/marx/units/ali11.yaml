- id: ali11-l3
  title: "Une séparation reproduite au terme du procès"
  notes: |-
    **Le procès de travail commence et finit par la séparation : la condition initiale n'est pas abolie, elle est reproduite, et d'autant plus accentuée que le travail vivant a accru la valeur du capital.**

    **Deux extrémités.** Le procès qui réunit sujet et objet, force de travail et conditions objectives, se déroule avec, à ses deux extrémités, la séparation. La condition présupposée au départ, celle qui préside à l'échange, est celle de la séparation d'une force seulement subjective de travail et de conditions objectives entre les mains d'autrui, le capitaliste. Marx : {teal}« Les conditions objectives du travail vivant apparaissent comme des valeurs séparées de lui, devenues autonomes par rapport à la puissance de travail vivante dans son existence subjective »{/teal} (IV-47).

    **À aucun moment, ni avant, ni pendant, ni après.** Les conditions objectives ne sont jamais réalisées comme conditions de la réalisation de la puissance de travail : au contraire, elle « sort de ce procès comme une simple condition de *leur* valorisation et de *leur* conservation en tant que valeur pour soi en face d'elle » (IV-47). Le feu du travail vivant ne sert qu'à accroître ces conditions en valeur, donc à reproduire la condition initiale.

    **Un caractère reproduit et accentué.** Le caractère fondamental de la puissance de travail, être {coral}sans objectivité{/coral} (*gegenstandslos*), est reproduit au terme du procès, d'autant plus accusé que la puissance de travail, en s'exerçant, a accru la valeur de l'ensemble des conditions objectives où consiste le capital. Elle a accumulé du travail sous forme de capital et en est, à la fin comme au début, séparée.

    **Retour à la pauvreté absolue.** On revient là d'où l'on est parti : au travail « séparé de toute son objectivité », à « l'existence purement subjective du travail démunie de toute objectivité » (III-9), à l'idée du travail comme {amber}pauvreté absolue{/amber}. Marx : la séparation absolue entre propriété et travail, entre la puissance de travail vivant et les conditions de sa réalisation, entre travail objectivé et travail vivant, entre la valeur et l'activité créatrice de valeur, est la condition sine qua non du capital comme rapport social historique spécifique, et doit être constamment reproduite (IV-43).

    ! Que la puissance de travail soit unie à ses conditions pendant le procès ne la rapproche pas d'elles : cette union dure le temps du travail, et la séparation est rétablie à la fin.
