- id: ali11-l2
  title: "Réanimer les conditions du travail"
  notes: |-
    **Dans le procès de travail vivant, le matériau et l'instrument reprennent vie : le travail objectivé en eux est de nouveau posé comme moment du travail vivant. Mais cette renaissance n'a lieu que pour le capital.**

    **Une force du capital.** Marx : cette « force naturelle vivifiante du travail », qui en utilisant le matériau et l'instrument les conserve, avec le travail objectivé en eux, « devient une force du capital, non du travail » (III-39). Les composantes du capital cessent de n'être que du travail objectivé, accumulé, et redeviennent des objets du travail.

    **Le métier à tisser, le fil.** Le travail objectivé dans le métier à tisser, instrument de travail, reprend vie en étant utilisé par l'ouvrier ; le fil, matière du travail, reprend vie en cessant d'être du fil et en étant tissé. Marx : {teal}« posées comme conditions du travail vivant, elles sont elles-mêmes réanimées. Le travail objectivé cesse d'être mort dans la matière, d'y exister comme forme externe, indifférente, puisqu'il est posé lui-même à nouveau comme moment du travail vivant »{/teal} (III-40).

    **Un processus qui défait le lien de la matière et de la forme.** Comme résultat d'un travail antérieur, la forme que le travail avait donnée à la matière se sépare d'elle : la matière redevient matière, de plus en plus {violet}indifférente à la forme{/violet}. Le « feu vivant » du travail, au contact de ces produits morts, restaure le lien de la matière et de la forme : les conditions entrent de nouveau dans ce que Marx appelle le « temps vivant » (III-40/41).

    **Le travail est le feu vivant, qui donne forme.** Le caractère périssable des choses, leur temporalité, est leur mise en forme par le temps vivant. Le travail vivant, en modifiant le matériau, le conserve dans une forme déterminée : la forme n'est plus extérieure à la matière.

    **Mais pour le capital.** Ce retour à la vie des conditions objectives n'existe que {coral}pour le capital, non pour le travail lui-même{/coral}. Le processus se déroule sous la condition de la séparation entre le travail dans son existence seulement subjective et les conditions objectives de sa réalisation.

    ! Le travail objectivé qui « reprend vie » ne redevient pas la propriété du travailleur : ce qui se réanime, c'est le capital.
