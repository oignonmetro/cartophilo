- id: sep-marx3-l2
  title: "La plus-value et ses difficultés"
  notes: |-
    **D'où vient le profit, si toutes les marchandises s'échangent à leur valeur ? De la** {violet}**force de travail**{/violet}**, seule marchandise qui produise plus de valeur qu'elle n'en coûte.** C'est la {violet}théorie de la plus-value{/violet}, cœur de l'analyse du capitalisme.

    **Le capitalisme n'est pas seulement l'échange de marchandises.** Le capitaliste {amber}avance de l'argent{/amber} pour {amber}acheter des marchandises{/amber}, les {amber}transformer en d'autres{/amber}, et les {amber}vendre plus cher{/amber}. Mais comment l'ensemble des capitalistes peut-il gagner, si chacun achète et vend à la valeur ? Aucun théoricien, selon Marx, ne l'a expliqué ; sa réponse est l'{violet}exploitation{/violet}.

    **Ce que le capitaliste achète : non le travail, mais la force de travail**, la capacité de travailler, pour une journée. Elle vaut ce que toute marchandise vaut : le travail nécessaire pour la produire ; pour une force de travail, c'est {amber}la valeur des biens qui gardent l'ouvrier en vie un jour{/amber} (nourriture, logement, vêtements). Supposons qu'ils demandent {yellow}quatre heures{/yellow} de travail :
    - les quatre premières heures produisent l'équivalent du salaire : c'est le {violet}travail nécessaire{/violet} ;
    - tout ce qui suit est {violet}surtravail{/violet}, et produit la {violet}plus-value{/violet} (*survaleur*, dans la traduction des Éditions sociales), que le capitaliste garde.

    {coral}La plus-value est la source de tout profit.{/coral} La part du capital qui achète la force de travail s'appelle {violet}capital variable{/violet}, car elle seule change de grandeur dans la production : elle crée plus de valeur qu'elle n'en coûte. Celle qui achète machines et matières, le {violet}capital constant{/violet}, ne fait que transmettre sa valeur au produit.

    **Deux difficultés que Marx affronte dans le livre III.**
    - la {violet}baisse tendancielle du taux de profit{/violet} : si seul le travail crée de la valeur, plus l'industrie se mécanise (plus de capital constant, moins de variable), plus le taux de profit doit baisser, puisque la part du capital qui crée de la plus-value diminue par rapport au capital total ;Marx y voit une cause de la chute du capitalisme, mais l'analyse est problématique ({sky}Paul Sweezy{/sky}) ;
    - le {violet}problème de la transformation{/violet} : si seul le travail crée de la valeur, les industries qui emploient beaucoup de travail (et peu de machines) devraient faire plus de profit que les autres, ce qui est {red}faux dans les faits{/red} et {red}intenable en théorie{/red}. Marx répond que les prix réels s'écartent systématiquement des valeurs ; le calcul qui passe des valeurs aux prix est le problème de la transformation. Mais si la valeur ne se retrouve dans le prix qu'après tant de détours, {coral}l'intuition qui motivait la théorie (expliquer les prix) s'évanouit{/coral}. D'autres répondent que Marx ne cherchait pas d'abord à expliquer les prix : il voulait voir, sous les apparences du capitalisme, une réalité qui ne leur ressemble pas ({sky}Heinrich{/sky}).

    **L'objection du blé : pourquoi le travail plutôt qu'autre chose ?** Que seul le travail crée de la plus-value n'est {red}jamais démontré{/red} : on pourrait choisir n'importe quelle marchandise. {sky}John Roemer{/sky} montre qu'une {yellow}théorie de la valeur-blé{/yellow}, où le blé crée plus de valeur qu'il ne coûte, serait formellement identique. L'idée que le travail fait la valeur, et le profit l'exploitation, garde pourtant {green}une force intuitive{/green}.

    **Ce qui reste, même la valeur-travail tombée** ({sky}Joan Robinson{/sky}, 1942) :
    - {green}le refus d'une harmonie des intérêts{/green} entre ouvrier et capitaliste, remplacée par une analyse de {amber}classes{/amber} ;
    - {green}le refus de toute tendance à l'équilibre{/green} du marché, et la description du {amber}cycle d'expansion et de crise{/amber}.
