    alt: ["inférieur"]
  - id: sep-marx3-l3-p4
    sentence: "Je travaille huit heures pour acheter **un manteau qui a demandé quatre heures** : __au sens de Roemer, je suis__ ___."
    answer: "exploité"
    alt: []
  - id: sep-marx3-l3-p5
    sentence: "__Défaut de la définition de Roemer__ : celui qui est ___ au profit de ceux qui ne peuvent travailler serait « exploité »."
    answer: "imposé"
    alt: ["taxé"]
  - id: sep-marx3-l3-p6
