- id: sep-marx3-l5
  title: "Le communisme, au-delà de la justice"
  notes: |-
    **Le communisme serait-il juste ? Plus probablement, il dépasserait la justice ; mais il resterait, pour Marx, une bonne société.** Deux possibilités seulement : {pink}le communisme est une société juste{/pink}, ou {green}le concept de justice ne s'y applique plus{/green}.

    **La formule de Gotha.** Dans la phase supérieure du communisme, quand {teal}« {/teal}toutes les sources de la richesse collective jailliront avec abondance, alors seulement {teal}__l'horizon borné du droit bourgeois__{/teal} pourra être définitivement dépassé et la société pourra écrire sur ses drapeaux {teal}"__De chacun selon ses capacités, à chacun selon ses besoins__" »{/teal} (*Critique du programme de Gotha*, I). Cela ressemble à une théorie de la justice, et peut être reprise comme telle ({sky}Gilabert{/sky}) ; mais il est plus fidèle à Marx d'y lire un {green}dépassement de la justice{/green} ({sky}Lukes{/sky}) : la formule décrit comment vivra une société d'abondance, non un droit que chacun pourrait faire valoir contre les autres.

    **Pourquoi la justice deviendrait sans objet : les circonstances de la justice de** {sky}**Hume**{/sky}**.** Si la justice sert à {amber}régler des conflits{/amber}, une société sans conflits n'en a pas besoin. Or {sky}Hume{/sky} montre deux circonstances où l'on n'aurait jamais inventé de règles de justice :
    - l'{amber}abondance{/amber} : si chacun pouvait avoir tout ce qu'il veut sans empiéter sur la part d'autrui ;
    - une {amber}bienveillance{/amber} complète entre les hommes : si chacun voulait le bien des autres comme le sien, il n'y aurait pas de conflit.

    Marx laisse entendre que le communisme serait une société d'abondance. On peut douter qu'une telle abondance, ou une telle fraternité, soient possibles ; mais {coral}l'une et l'autre disent clairement en quel sens le communisme dépasse la justice{/coral}.

    **Le communisme reste une bonne société.** Si l'on entend par morale, ou mieux par {violet}éthique{/violet}, la réflexion sur la {amber}vie bonne{/amber}, le communisme est une bonne société :{coral}il favorise l'épanouissement humain{/coral} ({sky}Wills{/sky}), et la carrière de Marx n'a pas de sens sans cette conviction. On ne pourrait le nier qu'au nom de l'{red}aversion théorique de Marx pour le mot « bon »{/red}. Elle tient à ce que, pour lui, {red}le communisme ne viendrait pas de nobles bienfaiteurs de l'humanité{/red} qui veulent le bien, mais du mouvement de l'histoire. Pour garder ce trait qui le distinguait des autres socialistes, Marx a sans doute {coral}déprécié la morale plus que sa théorie ne l'exigeait{/coral}.
  points:
