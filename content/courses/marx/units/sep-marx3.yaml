- id: sep-marx3-l1
  title: "La théorie de la valeur-travail"
  notes: |-
    **Le livre I du** {sky}***Capital***{/sky} **(1867) explique pourquoi les marchandises s'échangent dans telle proportion : par le travail qu'elles coûtent.** On l'a lu comme un traité d'économie, fondé sur une {violet}théorie de la valeur-travail{/violet} remaniée ; d'autres, comme {sky}William Clare Roberts{/sky}, y voient d'abord une œuvre de théorie politique. Quoi qu'il en soit, il contient une analyse économique du capitalisme, qui commence par la marchandise.

    **La** {violet}**marchandise**{/violet} **: un objet extérieur utile, produit pour être échangé sur un marché.** Pour qu'il y ait des marchandises, il faut deux conditions :
    - {amber}un marché{/amber}, où l'échange puisse avoir lieu ;
    - {amber}une division sociale du travail{/amber} : chacun produit autre chose que les autres, sans quoi personne n'aurait de raison d'échanger.

    **Deux valeurs dans une marchandise.**
    - la {violet}valeur d'usage{/violet} : son utilité, qui se comprend sans peine ;
    - la {violet}valeur d'échange{/violet} : ce contre quoi elle s'échange, en première approche son prix. Elle est {amber}énigmatique{/amber} : pourquoi {yellow}tant de blé s'échange-t-il contre tant de fer{/yellow} ?

    **La réponse : le** {violet}**travail socialement nécessaire**{/violet}**.** {green}La valeur d'une marchandise est déterminée par la quantité de travail socialement nécessaire à sa production{/green}, c'est-à-dire par le temps qu'il faut pour la produire {amber}avec l'intensité et la productivité moyennes{/amber} de la branche. {yellow}Un artisan lent{/yellow} ne rend pas sa table plus précieuse : ce qui compte n'est pas son temps à lui, mais le temps qu'il faut d'ordinaire.

    **Un argument en deux temps.**
    - {amber}__deux choses égales ont quelque chose en commun__{/amber} :deux choses qu'on peut poser de part et d'autre d'un signe égal sont réductibles à une troisième, de même grandeur dans les deux. {teal}« {/teal}Prenons encore deux marchandises, disons {yellow}du blé et du fer{/yellow}. [...] Que dit cette équation ? Qu'il existe {teal}__quelque chose de commun et de même dimension__{/teal} dans deux choses différentes, dans 1 quarter de blé tout comme dans a quintal de fer. Les deux choses sont donc {teal}__égales à une troisième__ »{/teal} (*Le Capital*, livre I, chap. 1) ;
    - {amber}__ce commun est le travail__{/amber} : on cherche cette troisième chose, et le travail est, pour Marx, le seul élément commun plausible. Ce ne peut être une propriété naturelle de la chose (son poids, sa couleur) : elle fait seulement son utilité, et l'utilité du blé n'a rien de commun avec celle du fer. Reste qu'ils sont tous deux des produits du travail.

    ! Les deux temps de l'argument sont très contestables : rien ne prouve que deux choses échangées aient une grandeur commune, ni que cette grandeur soit le travail.
  points:
