- id: sep-marx3-l4
  title: "Le capitalisme est-il injuste ?"
  notes: |-
    **Marx déteste le capitalisme, mais ne dit jamais qu'il est injuste ; il prend même ses distances avec ceux qui parlent de justice.** D'où une énigme, puisque ses textes sont pleins de jugements moraux indirects. On la décompose en quatre questions : (a) le capitalisme est-il {amber}injuste{/amber} ? (b) peut-il être critiqué moralement {amber}pour d'autres raisons{/amber} ? (c) le communisme serait-il {amber}juste{/amber} ? (d) peut-il être approuvé moralement {amber}pour d'autres raisons{/amber} ?

    **L'argument évident : un système qui vit de l'exploitation ne peut qu'être injuste.** Le secret du capitalisme est qu'il n'est {red}pas un règne d'harmonie et d'avantage mutuel{/red}, mais {green}un système où une classe tire systématiquement son profit d'une autre{/green}. Or Marx écrit lui-même, du fait que l'ouvrier produit en une journée le double de ce que vaut sa force de travail :{teal}« {/teal}cette réalité est {teal}__une chance toute particulière pour l'acheteur__{/teal}, mais {teal}__ne constitue en aucune façon un tort causé au vendeur__ »{/teal} (*Le Capital*, livre I, chap. 5). Autrement dit, l'achat de la force de travail est un échange d'équivalents : le capitaliste paie ce qu'elle vaut, et c'est en l'utilisant ensuite qu'il gagne. Au regard des règles de l'échange, rien n'est volé.

    **Pour** {sky}**Allen Wood**{/sky}**, Marx ne tient pas le capitalisme pour injuste.** Pour Marx, il n'existe pas de point de vue {violet}trans-historique{/violet}, extérieur à toute époque, d'où juger un système économique entier :
    - les institutions juridiques font partie de la {violet}superstructure{/violet}, et les idées de justice sont {violet}idéologiques{/violet} ;
    - or les unes et les autres ont pour fonction de {amber}stabiliser la structure économique{/amber} ;
    - donc dire qu'une chose est juste sous le capitalisme, c'est seulement juger qu'{coral}elle sert le bon fonctionnement du capitalisme{/coral}.

    On peut donc juger injuste un acte commis *dans* le système ({yellow}le vol{/yellow}, qui viole ses règles), non le système lui-même, qui fixe les règles.

    **Pour** {sky}**Ziyad Husami**{/sky}**, Wood oublie que les idées sont déterminées deux fois** : par le système économique, {amber}mais aussi par la classe{/amber}. La classe dominante impose ses idées de justice, mais le prolétariat a les siennes, qui sont déjà celles du communisme ;de ce point de vue, qui est celui de Marx, {green}le capitalisme est injuste{/green}.

    Mais Husami n'explique pas {red}pourquoi Marx ne dit jamais le capitalisme injuste{/red}, ni {red}pourquoi il oppose son {violet}socialisme scientifique{/violet} aux socialistes qui plaidaient l'injustice{/red}. La vue « officielle » de Marx est donc que {coral}le capitalisme n'est pas injuste{/coral}.

    **L'énigme demeure : Marx parle de** {yellow}**« détournement »**{/yellow}**, de** {yellow}**« vol »**{/yellow}**, d'**{yellow}**« exploitation »**{/yellow}**.** La solution la plus satisfaisante est sans doute celle de {sky}Cohen{/sky} : {green}Marx croyait que le capitalisme était injuste, mais ne croyait pas qu'il le croyait{/green}. Il n'avait pas une connaissance parfaite de son propre esprit : quand il réfléchit explicitement à la justice, il s'en tient à sa vue officielle ; quand il décrit le capitalisme sans y prendre garde, sa vraie conviction perce.

    **La critique morale, elle, est évidente.** L'ouvrier vit son travail comme un tourment ; il souffre de la misère, le surmenage, le manque d'épanouissement et de liberté ; les hommes ne se rapportent pas les uns aux autres comme ils le devraient. {coral}Le capitalisme empêche l'épanouissement humain{/coral} : c'est une critique morale. Pourquoi Marx ne la présente-t-il pas comme telle ? Pour deux raisons :
    - du point de vue de l'histoire du monde, {green}le capitalisme a aussi beaucoup de bon{/green}, car sans lui pas de communisme : il faut le {amber}dépasser, non l'abolir{/amber} (aller au-delà en gardant ce qu'il a produit), nuance que le langage de la condamnation morale rend mal ;
    - surtout, {red}les socialistes non marxiens en appelaient à la vérité et à la justice universelles{/red} pour faire advenir la société nouvelle ; Marx s'en distingue : {green}c'est l'analyse des forces historiques et sociales, non la morale, qui montre les voies de l'émancipation{/green}. {coral}Tout appel à la morale était pour lui un recul théorique.{/coral}
  points:
  - id: sep-marx3-l4-p1
    sentence: "__L'énigme de Marx et de la morale__ : il condamne le capitalisme, mais ne dit jamais directement qu'il est ___."
    answer: "injuste"
    alt: []
  - id: sep-marx3-l4-p2
    sentence: "*Le Capital*, livre I : que la force de travail crée plus de valeur qu'elle n'en vaut est « une chance toute particulière pour l'___, mais ne constitue en aucune façon un tort causé au vendeur »."
    answer: "acheteur"
