- id: sep-marx3-l3
  title: "L'exploitation sans la valeur-travail"
  notes: |-
    **Si l'exploitation ne se définissait que par la plus-value, elle tomberait avec la valeur-travail ; on peut pourtant en sauver le noyau.** C'est l'objection de {sky}Robert Nozick{/sky} (*Anarchie, État et utopie*, 1974) : {red}que la théorie de la valeur-travail soit fausse, et la théorie marxiste de l'exploitation s'effondre{/red}. D'autres répondent qu'{green}on peut définir l'exploitation sans elle{/green} ({sky}Cohen{/sky}, {sky}Wolff{/sky}, {sky}Vrousalis{/sky}).

    **La définition de** {sky}**Roemer**{/sky} **: un** {violet}**échange inégal**{/violet} **de travail contre des biens.** L'exploitation a lieu quand {amber}le travail contenu dans les biens que l'ouvrier peut acheter avec son revenu{/amber} est {amber}moindre que le travail qu'il a fourni pour gagner ce revenu{/amber}. Exemple : je travaille {yellow}huit heures{/yellow} pour mon salaire, et le mieux que je puisse acheter est {yellow}un manteau{/yellow} ; si ce manteau a demandé {yellow}quatre heures{/yellow} de travail en tout, j'ai échangé huit heures de mon travail contre quatre du travail d'autrui : {coral}je suis exploité, sans qu'on ait parlé de valeur{/coral}.

    **La définition demande des retouches.**
    - si je suis {yellow}imposé au profit de ceux qui ne peuvent travailler{/yellow}, je suis « exploité », {red}ce que la définition ne voulait pas dire{/red} ;
    - si une seule personne est très gravement exploitée, le travail qu'on lui prend peut suffire pour que tous les autres reçoivent plus de travail qu'ils n'en fournissent : {red}personne d'autre ne serait alors exploité{/red}, pas même ceux qui triment pour un maigre salaire.

    Ces défauts se corrigent en ajustant la définition.

    **Ce qu'on ajoute : la** {violet}**domination**{/violet}**.** Beaucoup de définitions joignent à l'échange inégal une {violet}contrainte{/violet} ({sky}Vrousalis{/sky}) : l'exploité est {amber}forcé d'accepter{/amber} une situation où il ne récupère jamais ce qu'il a mis dans le travail. À première vue, {coral}une telle exploitation paraît injuste{/coral} ; mais attribuer ce jugement à Marx lui-même est très difficile.
  points:
