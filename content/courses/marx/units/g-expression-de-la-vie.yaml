  - id: g-expression-de-la-vie-l1-q1
    sentence: "__L'activité par laquelle l'homme met ses forces au dehors, dans des objets,__ Marx l'appelle l'**expression de la vie**, en allemand ___."
    answer: Lebensäußerung
    alt: ["Lebensausserung", "Lebensäusserung", "Lebensaeusserung"]
  - id: g-expression-de-la-vie-l1-q2
    sentence: "__Marx reprend la notion d'**expression de la vie** à__ Moses ___, pour qui « la vie est échange d'activité vitale productrice »."
    answer: Hess
    alt: []
  - id: g-expression-de-la-vie-l1-b1
    sentence: "__L'**expression de la vie** n'est pas l'expression de sentiments ou d'idées__ : c'est la production d'___."
    answer: objets
    alt: []
  - id: g-expression-de-la-vie-l1-b2
    sentence: "__Ce que le préfixe Ent- ajoute à l'**Äußerung**__ (mettre au dehors), dans Entäußerung : l'éloignement, la ___."
    answer: perte
    alt: ["séparation", "separation"]
  - id: g-expression-de-la-vie-l1-b3
    sentence: "__Ce qui fait de l'**expression de la vie** une aliénation de la vie__, ce n'est pas l'acte, mais ses ___ : le produit revient à un autre."
    answer: conditions
    alt: []
  - id: g-expression-de-la-vie-l1-q3
    sentence: "__La **propriété privée** exprime le fait__ « que la manifestation de sa vie est l'aliénation de sa vie, que sa réalisation est sa privation de ___ » (Manuscrits de 1844)."
    answer: réalité
    alt: ["realite"]
  - id: g-expression-de-la-vie-l1-b4
    sentence: "**Exprimer sa vie**, c'est exercer ses forces sur un objet ; ___, __c'est seulement disposer de l'objet, sans rien y exercer__."
    answer: posséder
    alt: ["posseder", "avoir"]
  - id: g-expression-de-la-vie-l1-q5
    sentence: "« __À la place de tous les **sens** physiques et intellectuels__ est donc apparue la simple aliénation de tous ces sens, le sens de l'___ » (Manuscrits de 1844, troisième manuscrit)."
    answer: avoir
    alt: []
  - id: g-expression-de-la-vie-l1-b5
    sentence: "L'abolition de la **propriété privée** n'est pas un partage des biens, car __un partage laisserait intact__ le ___ de l'avoir."
    answer: sens
    alt: []
  - id: g-expression-de-la-vie-l1-b6
    sentence: "__Mon **expression** confirme aussi la vie d'autrui__, parce que son ___ est une force tendue vers un objet, que mon produit lui donne de quoi exercer."
    answer: besoin
    alt: []
  - id: g-expression-de-la-vie-l1-b7
    sentence: "Selon les Notes sur James Mill, __l'**expression** de ma vie appelle la__ ___ __d'autrui__, qui l'achève en usant de mon produit (Genuß)."
    answer: jouissance
    alt: []
  - id: g-expression-de-la-vie-l1-b8
    sentence: "__Dans l'**échange marchand**, le lien entre producteurs est confié à une chose__ : « le médiateur se change en un vrai ___ » (Notes sur James Mill, cité par Collin)."
    answer: dieu
    alt: ["Dieu"]
  - id: g-expression-de-la-vie-l1-b9
    sentence: "La **conscience** (Bewusstsein) n'est que l'être devenu conscient : « __ce n'est pas la conscience qui détermine la__ ___, mais l'inverse » (L'Idéologie allemande)."
    answer: vie
    alt: []
  - id: g-expression-de-la-vie-l1-b10
    sentence: "__La division du travail, d'où naît l'**idéologie**, sépare__ le travail intellectuel du travail ___."
    answer: matériel
    alt: ["materiel", "manuel"]
  - id: g-expression-de-la-vie-l1-b11
    sentence: "__L'**idéologie** n'est pas une simple ignorance, mais une image__ ___ de la vie réelle, telle qu'une activité séparée la voit."
    answer: inversée
    alt: ["inversee", "à l'envers", "renversée", "renversee"]
  - id: g-expression-de-la-vie-l1-b12
    sentence: "__L'**expression de la vie** a pour double l'aliénation de la vie, et pour contraire__ l'___."
    answer: avoir
    alt: ["possession"]
  - id: g-expression-de-la-vie-l1-b13
    sentence: "__Sous la **propriété privée**, un objet n'est nôtre que possédé__, parce que l'activité n'y est plus qu'un moyen de gagner sa vie, et l'objet qu'un moyen de ___."
    answer: jouir
    alt: []
