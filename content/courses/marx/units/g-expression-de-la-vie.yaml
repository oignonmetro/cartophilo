id: g-expression-de-la-vie
title: Expression de la vie (`Lebensäußerung`)
icon: book
color: coral
lessons:
- id: g-expression-de-la-vie-l1
  title: Expression de la vie
  notes: |-
    Chez Marx, l'{violet}**expression de la vie**{/violet} ({violet}*Lebensäußerung*{/violet}), que les Éditions sociales rendent aussi par « manifestation de la vie », est [def]. Le verbe *äußern* veut dire mettre au dehors : {pink}il ne s'agit pas d'exprimer des sentiments ou des idées{/pink}, mais de faire passer ses forces dans des objets. Marx reprend le mot à {sky}Moses Hess{/sky}, pour qui {teal}« {/teal}la vie est échange d'activité vitale productrice{teal} »{/teal} (cité par {sky}Wittmann{/sky}), et l'oppose à son double, la {red}*Lebensentäußerung*{/red}, l'aliénation de la vie. Là où l'[[g-activite-vitale|activité vitale]] dit ce que le vivant fait pour vivre, l'expression dit que ce faire {amber}montre et réalise ce qu'il est{/amber}.

    __**L'homme ne peut**__ {violet}__**manifester sa vie**__{/violet} __**qu'à l'aide d'objets réels, sensibles.**__ La manifestation n'est pas un débordement d'une intériorité qui existerait d'abord seule. Car l'homme est un [[g-etre-naturel|être naturel]] : {teal}« {/teal}Dire que l'homme est un être en chair et en os, doué de forces naturelles, vivant, réel, sensible, objectif, c'est dire qu'{teal}__il a pour objet de son être, de la manifestation de sa vie, des objets réels, sensibles__{/teal}, et qu'{teal}__il ne peut manifester sa vie qu'à l'aide d'objets réels, sensibles__ »{/teal} (*Manuscrits de 1844*, troisième manuscrit, critique de Hegel). Ses forces ont leurs objets hors de lui, comme la faim, qui {teal}« {/teal}pour la satisfaire, pour la calmer, {teal}__il lui faut une nature, un objet en dehors d'elle__ »{/teal} (*ibid*.). Donc {amber}une vie qui ne passerait dans aucun objet ne serait pas exprimée, elle ne serait pas du tout{/amber}. C'est le point contre {sky}Hegel{/sky} : pour lui, l'objet est la conscience devenue étrangère à elle-même ; pour Marx, {coral}l'objet est le lieu même où la vie se manifeste{/coral}. Le modèle en est le travail, où l'homme {teal}« {/teal}{teal}__se contemple donc lui-même dans un monde qu'il a créé__ »{/teal} (*Manuscrits de 1844*, premier manuscrit, [[g-travail-aliene|travail aliéné]]).

    __**La**__ {violet}__**manifestation de la vie**__{/violet} __**de chacun est une manifestation de la vie sociale.**__ On croit que l'individu s'exprime d'abord seul, puis entre en société. Mais même l'activité solitaire du savant use d'une langue et de matériaux qu'il tient des autres. Donc, {teal}« {/teal}{teal}__la manifestation de sa vie__{/teal} – même si elle n'apparaît pas sous la forme immédiate d'une manifestation collective de la vie, accomplie avec d'autres et en même temps qu'eux – {teal}__est donc une manifestation et une affirmation de la vie sociale__ »{/teal} (*Manuscrits de 1844*, troisième manuscrit, propriété privée et communisme). En effet, {teal}« {/teal}{teal}__la vie individuelle et la vie générique de l'homme ne sont pas différentes__{/teal}{teal} »{/teal} (*ibid*.) : {amber}la société n'est pas une abstraction en face de l'individu{/amber}. Les *Notes sur James Mill*, la même année, en tirent ce que serait une production humaine : {teal}« {/teal}{teal}__dans l'expression individuelle de ma vie j'aurais directement créé l'expression de ta vie__{/teal}{teal} »{/teal}, et {teal}« {/teal}{teal}__nos produits seraient autant de miroirs__{/teal} où nous verrions se refléter notre essence{teal} »{/teal} (cités par {sky}Shambaugh{/sky}). L'expression appelle ainsi la {violet}jouissance{/violet} (*Genuß*) qui la reçoit : en usant de mon produit, l'autre confirme mon activité, comme je confirme la sienne en usant du sien. {coral}Produire pour un autre, c'est alors satisfaire son besoin et confirmer à la fois sa vie et la mienne{/coral} (voir [[g-etre-generique|être générique]]).

    __**Sous la propriété privée, l'**__{violet}__**expression de la vie**__{/violet} __**devient**__ {red}__**perte de la vie**__{/red}__**.**__ Le travail objective la vie du producteur ; or, sous la propriété privée, le produit appartient à un autre et se dresse contre lui, si bien que {teal}« {/teal}{teal}__la vie qu'il a prêtée à l'objet s'oppose à lui, hostile et étrangère__ »{/teal} (*Manuscrits de 1844*, premier manuscrit, travail aliéné). Le même acte qui devait réaliser sa vie la lui retire. La propriété privée est l'expression sensible du fait {teal}« {/teal}que {teal}__la manifestation de sa vie est l'aliénation de sa vie__{/teal}, que {teal}__sa réalisation est sa privation de réalité__{/teal}, une réalité étrangère{teal} »{/teal} (*Manuscrits de 1844*, troisième manuscrit, propriété privée et communisme) : en allemand, un simple préfixe sépare les deux, {red}*Lebensäußerung*{/red} devenue {red}*Lebensentäußerung*{/red}. L'économie politique en fait une règle de conduite, car elle prêche l'épargne : {teal}« {/teal}{teal}__moins tu es, moins tu manifestes ta vie__{/teal}, plus tu possèdes, plus ta vie aliénée grandit{teal} »{/teal} (*Manuscrits de 1844*, troisième manuscrit, besoins). {coral}L'avoir prend la place de l'expression{/coral} : ce qu'on ne vit plus, on l'accumule en argent (voir [[g-besoin|besoin]]).

    __**Pour le**__ {red}__**salarié**__{/red}__**, la vie commence où cesse l'activité.**__ En 1849, Marx reprend la question sans le vocabulaire de 1844 : l'ouvrier qui tisse ou file douze heures regarde-t-il ce travail {teal}« {/teal}{teal}__comme une manifestation de sa vie, comme sa vie__{/teal} ? Bien au contraire. {teal}__La vie commence pour lui où cesse l'activité__{/teal}, à table, à l'auberge, au lit{teal} »{/teal} (*Travail salarié et capital*, section I). La raison est que ce qu'il fait ne compte pas pour lui, puisque seul le salaire en compte : les douze heures {teal}« {/teal}{teal}__n'ont nullement pour lui le sens de tisser, de filer, de percer__{/teal}, etc., mais celui de gagner ce qui lui permet d'aller à table, à l'auberge, au lit{teal} »{/teal} (*ibid*.). {amber}Le contenu de l'activité, qui devait exprimer l'ouvrier, lui devient indifférent{/amber} (voir [[g-activite-vitale|activité vitale]], pour le sacrifice de la vie). Les *Grundrisse* en donnent le mécanisme : le travailleur ne vend {teal}« {/teal}qu'une disposition temporaire de sa capacité de travail{teal} »{/teal}, qu'il recommence à vendre dès qu'il a ingéré de quoi {teal}« {/teal}{teal}__reproduire ses manifestations d'être vivant__ »{/teal} (*Grundrisse*, chapitre du capital). {red}Ses manifestations de vie sont devenues une marchandise louée à l'heure{/red}.

    __**Ce que sont les individus coïncide avec la manière dont ils**__ {violet}__**manifestent leur vie**__{/violet}__**.**__ En 1845, la notion sert à fonder la conception matérialiste de l'histoire. Les hommes {teal}« {/teal}commencent à se distinguer des animaux dès qu'ils se mettent à produire leurs moyens d'existence{teal} »{/teal} (*L'Idéologie allemande*, I). Or cette production n'est pas une simple reproduction de leur existence physique : c'est déjà {teal}« {/teal}{teal}__une façon déterminée de manifester leur vie, un mode de vie déterminé__{/teal}{teal} »{/teal}. Donc {teal}« {/teal}{teal}__la façon dont les individus manifestent leur vie reflète très exactement ce qu'ils sont__{/teal}. {teal}__Ce qu'ils sont coïncide donc avec leur production__{/teal}, aussi bien avec ce qu'ils produisent qu'avec la façon dont ils le produisent{teal} »{/teal} (*ibid*.). {amber}Il n'y a pas d'essence humaine derrière la manifestation{/amber} : l'homme est ce qu'il fait, et ce qu'il fait dépend des conditions matérielles de sa production. La conscience elle-même suit, puisque {teal}« {/teal}{teal}__ce n'est pas la conscience qui détermine la vie, mais la vie qui détermine la conscience__ »{/teal} (*ibid*.). Même l'illusion s'explique ainsi : si leurs représentations mettent la réalité la tête en bas, {teal}« {/teal}ce phénomène est encore une conséquence de leur {teal}__mode d'activité matériel borné__{/teal} et des rapports sociaux étriqués qui en résultent{teal} »{/teal} (*ibid*., cité par {sky}Fischbach{/sky}). {coral}L'expression de la vie devient ainsi le mode de vie d'une époque{/coral} (voir [[g-vie-materielle|vie matérielle]]).

    ! L'expression de la vie n'est pas l'expression d'une intériorité, sentiments ou idées : c'est la production d'objets, et ce que l'individu est ne précède pas ce qu'il manifeste.

    ! *Lebensäußerung* (expression de la vie) et *Lebensentäußerung* (aliénation de la vie) désignent le même acte : selon les conditions où il s'accomplit, il réalise la vie ou la fait perdre.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | *Manuscrits de 1844*, premier manuscrit | la vie prêtée à l'objet s'oppose à l'ouvrier |
    | *Manuscrits de 1844*, troisième manuscrit, propriété privée et communisme | la manifestation de la vie, affirmation de la vie sociale, et sous la propriété privée aliénation de la vie |
    | *Manuscrits de 1844*, troisième manuscrit, besoins | moins tu es, plus tu possèdes |
    | *Manuscrits de 1844*, troisième manuscrit, critique de Hegel | l'homme ne manifeste sa vie qu'à l'aide d'objets sensibles |
    | *Notes sur James Mill* | nos produits, miroirs où se reflète notre essence |
    | *L'Idéologie allemande*, I | ce que sont les individus coïncide avec leur production |
    | *Travail salarié et capital*, section I | la vie commence où cesse l'activité |
    | *Grundrisse*, chapitre du capital | les manifestations d'être vivant vendues pour un temps |

