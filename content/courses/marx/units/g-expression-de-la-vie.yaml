id: g-expression-de-la-vie
title: Expression de la vie (`Lebensäußerung`)
icon: book
color: coral
lessons:
- id: g-expression-de-la-vie-l1
  title: Expression de la vie
  notes: |-
    Chez Marx, l'{violet}**expression de la vie**{/violet} ({violet}*Lebensäußerung*{/violet}), que les Éditions sociales rendent aussi par « manifestation de la vie », est [def]. Le verbe *äußern* veut dire mettre au dehors : {pink}il ne s'agit pas d'exprimer des sentiments ou des idées{/pink}, mais de faire passer ses forces dans des objets. Marx reprend le mot à {sky}Moses Hess{/sky}, pour qui « la vie est échange d'activité vitale productrice » (cité par {sky}Wittmann{/sky}). Trois thèses voisines sont établies ailleurs : que travailler soit pour l'homme sa façon de manifester sa vie, et que le salarié ne vive plus que hors de son travail ([[g-activite-vitale|activité vitale]]) ; que la manifestation de la vie de chacun soit sociale ([[g-etre-generique|être générique]]) ; que l'objet produit confirme la vie d'un être naturel au lieu de la lui retirer ([[g-etre-naturel|être naturel]]). Le propre de la notion est ailleurs : elle a pour double l'{red}aliénation de la vie{/red}, pour contraire l'{red}avoir{/red}, et elle s'étend aux idées.

    __**Exprimer sa vie, c'est faire passer ses forces dans un**__ {violet}__**objet**__{/violet}__**, ce qui n'est pas en soi s'aliéner.**__ Contre {sky}Hegel{/sky}, qui confond l'objectivation et l'aliénation, Marx tient que produire un objet confirme la vie du producteur (voir être naturel et [[g-travail-aliene|travail aliéné]]). Si produire un objet n'est pas en soi se perdre, ce qui fait d'une expression une perte n'est donc pas l'acte, mais ses conditions. La langue allemande le marque d'un préfixe : *Äußerung* met au dehors, *Ent-äußerung* met au dehors en séparant, et {red}*Ent-*{/red} dit l'éloignement, la perte ({sky}Fischbach{/sky}). Ces conditions sont celles-ci : quand l'homme produit séparé de ses moyens de production, et que le produit revient à un autre, il ne garde rien de ce qu'il a mis au dehors. La propriété privée exprime alors le fait {teal}« {/teal}que {teal}__la manifestation de sa vie est l'aliénation de sa vie__{/teal}, que {teal}__sa réalisation est sa privation de réalité__{/teal}, une réalité étrangère{teal} »{/teal} (*Manuscrits de 1844*, troisième manuscrit, propriété privée et communisme). {coral}*Lebensäußerung* et *Lebensentäußerung* nomment le même acte, dans deux conditions différentes{/coral} : le second n'est pas un autre acte, c'est le premier quand on en perd le fruit.

    __**La propriété privée met le**__ {red}__**sens de l'avoir**__{/red} __**à la place de l'expression de la vie.**__ Exprimer sa vie, c'est exercer ses forces sur un objet ; posséder, c'est seulement disposer de l'objet, sans rien y exercer. Or, sous la propriété privée, qui résulte elle-même du travail aliéné (voir travail aliéné), l'activité n'est plus qu'un moyen de gagner de quoi vivre, et l'objet n'est plus rien d'autre qu'un moyen de jouir. D'où un seul rapport aux choses, les avoir : {teal}« {/teal}La propriété privée nous a rendus si sots et si bornés qu'{teal}__un objet n'est nôtre que lorsque nous l'avons__{/teal}, qu'il existe donc pour nous comme capital ou qu'il est immédiatement possédé, mangé, bu, porté sur notre corps, habité par nous{teal} »{/teal} (*ibid*.). Le rapport sensible et multiple aux objets, voir, entendre, aimer, se réduit donc à un seul : {teal}« {/teal}{teal}__à la place de tous les sens physiques et intellectuels est donc apparue la simple aliénation de tous ces sens, le sens de l'avoir__ »{/teal} (*ibid*.), catégorie que Marx dit tenir de {sky}Hess{/sky}. L'économie politique en fait une morale, où ce qu'on ne vit pas s'accumule : {teal}« {/teal}moins tu es, moins tu manifestes ta vie, plus tu possèdes, plus ta vie aliénée grandit{teal} »{/teal} (*Manuscrits de 1844*, troisième manuscrit, besoins). {amber}L'avoir croît à mesure que l'expression décroît{/amber}. C'est pourquoi l'abolition de la propriété privée n'est pas un partage des biens, qui laisserait intact le sens de l'avoir : en rendant les objets à un usage social, elle libère les sens de la possession, si bien qu'ils {teal}« {/teal}{teal}__se rapportent à la chose pour la chose__{/teal}{teal} »{/teal} ; elle est donc {teal}« {/teal}l'émancipation totale de tous les sens et de toutes les qualités humaines{teal} »{/teal} (*Manuscrits de 1844*, troisième manuscrit, propriété privée et communisme). {coral}On retrouve l'expression quand on cesse de vouloir avoir.{/coral}

    __**Dans une production humaine, l'expression de ma vie satisferait le**__ {violet}__**besoin d'autrui**__{/violet} __**et confirmerait sa vie.**__ La même année, dans ses *Notes de lecture sur James Mill*, que le notebook ne contient pas, Marx décrit ce que serait une production qui ne passerait pas par l'argent. {sky}Wittmann{/sky} en résume l'argument : produisant librement, {coral}j'affirme mon individualité en l'objectivant{/coral} ; je jouis de ma production, qui est alors « une véritable *Lebensäusserung* et non une activité contrainte » ; en procurant à l'autre la jouissance de mon produit, je prends plaisir, « car j'ai satisfait un besoin humain et ainsi objectivé l'essence humaine ». Mon expression confirme aussi la vie de l'autre, parce que son [[g-besoin|besoin]] n'est pas un simple manque : c'est une force tendue vers un objet. En lui donnant cet objet, je donne à cette force de quoi s'exercer ; sa jouissance est donc sa propre manifestation de vie, si bien que, selon Wittmann, « dans ma *Lebensäusserung* individuelle, je suis à l'origine de la *Lebensäusserung* de l'autre personne ». L'expression appelle ainsi la {violet}jouissance{/violet} (*Genuß*) d'autrui, qui l'achève. Marx en tire que l'échange des activités dans la production équivaut à l'activité par laquelle l'homme se rapporte à son genre (voir [[g-etre-generique|être générique]]). Dans l'échange marchand, au contraire, chacun ne produit que pour avoir le produit de l'autre, et le lien entre eux est confié à une chose, l'argent. Or ce qui fait le lien règne sur ce qu'il relie : {teal}« {/teal}Rien d'étonnant à ce que {teal}__le médiateur se change en un vrai dieu__{/teal}, car le médiateur règne en vraie puissance sur les choses pour lesquelles il me sert d'intermédiaire. Son culte devient une fin en soi{teal} »{/teal} (cité par {sky}Collin{/sky}). {red}L'argent prend la place de l'expression réciproque.{/red}

    __**La**__ {violet}__**conscience**__{/violet} __**est l'expression de la vie réelle, et l'**__{red}__**idéologie**__{/red} __**celle d'une vie bornée.**__ En 1845, l'expression s'étend aux idées. Les individus sont ce que sont leurs manières de manifester leur vie (voir activité vitale) ; or leurs idées font partie de cette vie, car {teal}« {/teal}la production des idées, des représentations et de la conscience est d'abord directement et intimement mêlée à l'activité matérielle et au commerce matériel des hommes, {teal}__elle est le langage de la vie réelle__ »{/teal} (*L'Idéologie allemande*, I). La conscience, *Bewusstsein*, est l'être devenu conscient, *das bewusste Sein* : {teal}« {/teal}{teal}__la conscience ne peut jamais être autre chose que l'être conscient__{/teal}, et l'être des hommes est leur processus de vie réel{teal} »{/teal} (*ibid*.). Donc {teal}« {/teal}{teal}__ce n'est pas la conscience qui détermine la vie, mais la vie qui détermine la conscience__ »{/teal} (*ibid*.). D'où l'explication de l'{red}idéologie{/red}. La {violet}division du travail{/violet} sépare le travail matériel du travail intellectuel : ceux qui produisent les idées sont détachés de la production, et leurs idées paraissent sortir d'elles-mêmes et diriger le monde. Ce n'est pas une ignorance, qui serait un simple manque, mais une image inversée : la vie réelle s'y exprime bien, mais telle qu'une activité séparée la voit. {teal}« {/teal}Si l'expression consciente des conditions de vie réelles des individus est imaginaire, si, dans leurs représentations, ils mettent la réalité la tête en bas, ce phénomène est encore une conséquence de {teal}__leur mode d'activité matériel borné__{/teal} et des rapports sociaux étriqués qui en résultent{teal} »{/teal} (*ibid*., cité par {sky}Fischbach{/sky}). {amber}L'illusion est l'expression exacte d'une vie mutilée.{/amber} Le vocabulaire a changé depuis 1844 : il n'est plus question d'une essence humaine que la production objectiverait, mais de la vie réelle d'individus déterminés (voir être générique, pour cette rupture).

    ! L'expression de la vie n'est pas l'expression d'une intériorité, sentiments ou idées : c'est la production d'objets, et les idées elles-mêmes expriment cette vie réelle.

    ! *Lebensentäußerung* n'est pas un autre acte que *Lebensäußerung* : c'est la même expression de la vie, dans des conditions où l'on en perd le fruit.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | *Manuscrits de 1844*, troisième manuscrit, propriété privée et communisme | le sens de l'avoir à la place de tous les sens ; la manifestation de la vie devenue aliénation de la vie |
    | *Manuscrits de 1844*, troisième manuscrit, besoins | moins tu es, plus tu possèdes |
    | *Notes sur James Mill* | une production humaine, expression réciproque de la vie ; l'argent, médiateur devenu dieu |
    | *L'Idéologie allemande*, I | la conscience, langage de la vie réelle ; l'idéologie, expression d'une vie bornée |

    **Voir aussi** : [[g-activite-vitale|Activité vitale]] · [[g-etre-naturel|Être naturel]] · [[g-etre-generique|Être générique]] · [[g-travail-aliene|Travail aliéné]] · [[g-besoin|Besoin]] · [[g-argent|Argent]] · [[g-vie-materielle|Vie matérielle]]
