lessons:
- id: ali5-l1
  title: "L'homme, être de chair : activité et passivité"
  notes: |-
    **L'homme est un** {violet}**être naturel**{/violet} **: à la fois** {amber}**actif**{/amber} **et** {amber}**passif**{/amber}**, et le** {violet}**travail**{/violet} **atteste que ces deux dimensions sont inséparables.**

    **Un être de chair, doué de forces et pourtant dépendant.** Marx le dit à la fin du troisième manuscrit : l'homme est un être {blue}*leiblich*{/blue}, adjectif qui renvoie au {blue}*Leib*{/blue}, le corps de chair, et non au {blue}*Körper*{/blue}. {teal}« En tant qu'être naturel et être naturel vivant, il est d'une part __doué de forces naturelles, de forces vitales__ ; il est __un être naturel actif__ ; ces forces existent en lui sous la forme de dispositions et d'aptitudes, d'impulsions. D'autre part, en tant qu'être naturel, en chair et en os, sensible, objectif, il est __un être souffrant, dépendant et limité__, tout comme la plante et l'animal. Autrement dit, les objets de ses impulsions existent en dehors de lui comme objets indépendants de lui »{/teal} (troisième manuscrit, p. XXVII) [en allemand, {blue}*leidendes*{/blue}, {blue}*bedingtes und beschränktes Wesen*{/blue}, un être souffrant, conditionné et borné].

    **Le besoin est l'épreuve d'une passivité originelle.** Parce qu'il est une {coral}partie de la nature{/coral}, l'homme, comme tout vivant, ne peut pas ne pas être {amber}affecté par les autres parties de la nature{/amber}, comme Spinoza le disait déjà. C'est cette dimension que le besoin exprime. {red}Cette épreuve n'a, en elle-même, rien d'aliénant{/red} : elle renvoie seulement l'homme à sa __condition d'être naturel et vivant, affecté__.

    **L'existence indépendante des objets n'est pas non plus aliénante.** Les objets du besoin existent hors de l'homme et avant son activité ; mais, dans cette indépendance même, ce sont {green}les objets de ses besoins{/green}, des objets essentiels, indispensables à {violet}l'activation et à la confirmation{/violet} de ses forces essentielles. Marx joue en allemand sur {blue}*Betätigung*{/blue} (l'activation) et {blue}*Bestätigung*{/blue} (la confirmation) : il n'y a qu'une lettre de différence.

    **Du besoin au travail.** L'{amber}épreuve passive du besoin{/amber} n'annule pas l'{coral}activité de l'homme{/coral} : elle {coral}la suscite{/coral}. C'est en s'éprouvant comme être naturel, donc affecté, que les hommes s'affirment en s'activant, dans {amber}l'appropriation en acte des objets de leur besoin{/amber}, c'est-à-dire en les transformant de façon à les rendre aptes à satisfaire des besoins humains. Cette appropriation est le {yellow}travail{/yellow}.

    **Ce que le travail atteste.** Par le {coral}travail{/coral}, les hommes expriment à eux-mêmes l'objectivité de leur être en l'objectivant extérieurement, et donc la {amber}double dimension, passive et active{/amber}, de cet être : {coral}activité et passivité sont inextricablement liées{/coral}. Cette unité est {violet}constitutive d'un être naturel{/violet}.

    ! La passivité n'est pas ici un défaut : elle est le principe du travail, puisqu'on ne se met à travailler que parce qu'on éprouve un besoin.
  points:
