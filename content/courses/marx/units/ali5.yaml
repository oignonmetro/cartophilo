- id: ali5-l3
  title: "L'activité pure et la passivité d'un autre"
  notes: |-
    **Réduit à une activité pure, le travailleur éprouve, quand il travaille, une passivité qui n'est pas la sienne : l'aliénation est la séparation d'avec sa propre passivité.**

    **Ce qui reste.** Au terme de l'aliénation, il ne reste au travailleur qu'{violet}une pure activité{/violet}, c'est-à-dire une pure {violet}puissance de travail{/violet}, privée de toute condition objective de sa mise en œuvre. Ce dont il est dépossédé, ce n'est pas seulement de l'outil ou du produit, mais {red}du besoin{/red}, ce qui est au principe du travail comme appropriation de l'objet. Cette capacité abstraite doit alors {amber}attendre que les conditions objectives de son actualisation lui soient fournies du dehors{/amber}, par celui qui les possède.

    **Une double inversion.** Quand cette puissance est mise en œuvre, on attendrait une expérience d'activité. Or le travailleur éprouve {coral}une passivité{/coral} : son activité lui apparaît comme l'activité d'un autre en lui, pour celui qui possède les conditions du travail et possédera le produit. À l'origine, là où il aurait fallu l'épreuve passive du besoin, il y avait une réduction à la pure activité ; au moment du travail, là où il faudrait de l'activité, il y a de la passivité.

    **Marx le dit au premier manuscrit** : le rapport de l'ouvrier à sa propre activité est celui d'une {teal}« activité étrangère qui ne lui appartient pas, c'est l'activité qui est passivité, la force qui est impuissance, la procréation qui est castration. C'est l'énergie physique et intellectuelle de l'ouvrier, sa vie personnelle – car qu'est-ce que la vie sinon l'activité ? – qui est transformée en activité dirigée contre lui-même, indépendante de lui, ne lui appartenant pas »{/teal} (premier manuscrit, p. XXIII).

    **Une passivité qui n'est pas la sienne.** Ce n'est pas que l'objet viendrait limiter de l'extérieur l'activité du travailleur. Le processus est plus complexe : le travailleur est {red}d'abord désobjectivé{/red}, réduit à l'activité abstraite ; l'objectivité et la passivité sont hors de lui, de sorte qu'elles peuvent faire retour contre lui, comme la puissance d'une objectivité qui n'est plus la sienne.

    **Le sujet aliéné.** Privé de sa passivité, le travailleur peut se concevoir comme un être purement actif, saisir l'activité comme l'essence de son être. Mais cette activité pure signe son {coral}impuissance{/coral}, puisqu'elle est privée des rapports à l'objectivité indispensables à sa mise en œuvre. Comme tout sujet s'attribue l'activité (jusqu'à l'auto-position du moi chez {sky}Fichte{/sky}), se concevoir comme sujet est, du point de vue de Marx, le plus sûr indice de l'aliénation (voir le sujet pur, dans l'unité précédente).

    **La perte du besoin, du désir.** {teal}« L'aliénation transparaît tout autant à travers le fait que mes moyens de subsistance appartiennent à un autre, que ce qui est mon désir est la possession inaccessible d'un autre »{/teal} (troisième manuscrit, p. XX) [*Wunsch*, souhait ou désir ; *Lebensmittel*, moyens de vivre]. Ce dont on est privé est d'abord le besoin, le désir, la part passive de notre être. L'aliénation ne consiste pas en ce qu'un autre soit actif à ma place, mais {amber}en ce que je sois séparé de ma propre passivité{/amber} : mes affects ne sont plus les miens, ils me deviennent non seulement extérieurs, mais étrangers.

    ! La passivité qu'éprouve l'ouvrier au travail n'est pas la passivité naturelle du besoin : c'est la passivité de qui exécute l'activité d'un autre.
