- id: ali5-l2
  title: "Être privé du besoin : le cœur de l'aliénation"
  notes: |-
    **L'aliénation n'est pas l'objectivation : c'en est la version pathologique, et son symptôme est que le travailleur est privé du besoin même.**

    **Un phénomène interne à l'objectivation.** Marx se propose d'examiner de plus près {violet}l'objectivation, la production de l'ouvrier{/violet} « et, en elle, l'aliénation, la perte de l'objet, de son produit » (premier manuscrit, p. XXIII). L'aliénation naît donc {coral}à l'intérieur même de la production{/coral} : c'est {amber}une objectivation qui tourne mal, qui échoue{/amber}. Le symptôme de cet échec est que le travailleur est privé de la dimension objective de son être {red}dans l'activité même par laquelle il devrait l'affirmer{/red}.

    **Le cœur de l'aliénation : être privé de l'épreuve du besoin.** Ce n'est pas seulement que les moyens de satisfaire les besoins manquent : {amber}on retire au travailleur{/amber} {amber}jusqu'à la capacité d'éprouver ses besoins{/amber} les plus élémentaires, ceux d'un vivant, non d'un être spécifiquement humain : air, mouvement, lumière, propreté, alimentation saine. {teal}« __Même le besoin de grand air cesse d'être un besoin pour l'ouvrier__. L'homme retourne à sa caverne, mais elle est maintenant empestée par le souffle pestilentiel et méphitique de la civilisation, si bien qu'__il ne l'habite plus que d'une façon précaire, comme une puissance étrangère qui peut chaque jour se dérober à lui__, dont il peut chaque jour être expulsé s'il ne paie pas. […] La lumière, l'air, etc., la propreté animale la plus élémentaire cessent d'être un besoin pour l'homme. […] Aucun de ses sens n'existe plus, non seulement sous son aspect humain, mais aussi sous son aspect inhumain, c'est-à-dire pire qu'animal. »{/teal} (troisième manuscrit, p. XIV) [Marx écrit *das Bedürfnis der freien Luft*, le besoin de l'air libre]. Marx donne aussi l'exemple de {yellow}l'ouvrier irlandais, qui ne connaît plus que le besoin de manger, et de manger des pommes de terre à cochon{/yellow}.

    **Ce qui est nié, c'est l'être naturel.** Ce {yellow}vol des besoins de tout vivant{/yellow} nie {red}l'objectivité de l'être des hommes comme êtres naturels{/red} : leur sensibilité, leur passivité primaire. Les conditions du travail ne sont pas seulement inhumaines, elles sont contraires à l'existence même d'un vivant.

    **Conséquence : une activité abstraite.** L'économiste politique {teal}« fait donc de l'ouvrier un être dépourvu de sens et de besoins, comme il fait de son activité une pure abstraction de toute activité »{/teal} (troisième manuscrit, p. XV). Priver le travailleur de sa passivité, c'est le réduire à {violet}une pure activité{/violet}, non à une activité particulière mais à de l'{coral}activité en général{/coral}.

    **Ce que cela prépare.** Cette réduction annonce le travailleur salarié moderne, dont l'activité sera non qualitative mais quantifiable : il faut d'abord l'abstraire pour pouvoir la quantifier. Ces termes ne sont pas encore dans les *Manuscrits de 1844*. L'aliénation y est déjà le processus par lequel le travail, d'{green}activité d'auto-objectivation{/green}, devient {red}activité de désobjectivation{/red}.

    ! Ce dont le travailleur est d'abord privé n'est pas l'outil ni le produit, mais ce qui est au principe du travail : le {amber}besoin{/amber}, l'épreuve passive de ce qui lui manque.
  points:
