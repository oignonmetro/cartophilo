lessons:
- id: ali5-l1
  title: "L'homme, être de chair : activité et passivité"
  notes: |-
    **L'homme est un être naturel : à la fois actif et passif, et le** {violet}**travail**{/violet} **atteste que ces deux dimensions sont inséparables.**

    **Un être de chair, doué de forces et pourtant dépendant.** Marx le dit à la fin du troisième manuscrit : l'homme est un être {violet}*leiblich*{/violet}, adjectif qui renvoie au {violet}*Leib*{/violet}, le corps de chair, et non au *Körper*. {teal}« En tant qu'être naturel et être naturel vivant, il est d'une part doué de forces naturelles, de forces vitales ; il est un être naturel actif ; ces forces existent en lui sous la forme de dispositions et d'aptitudes, d'impulsions. D'autre part, en tant qu'être naturel, en chair et en os, sensible, objectif, il est un être souffrant, dépendant et limité, tout comme la plante et l'animal. Autrement dit, les objets de ses impulsions existent en dehors de lui comme objets indépendants de lui »{/teal} (troisième manuscrit, p. XXVII) [en allemand, *leidendes, bedingtes und beschränktes Wesen*, un être souffrant, conditionné et borné].

    **Le besoin est l'épreuve d'une passivité originelle.** Parce qu'il est une partie de la nature, l'homme, comme tout vivant, ne peut pas ne pas être {amber}affecté par les autres parties de la nature{/amber}, comme Spinoza le disait déjà. C'est cette dimension que le besoin exprime. {red}Cette épreuve n'a, en elle-même, rien d'aliénant{/red} : elle renvoie seulement l'homme à sa condition d'être naturel et vivant, affecté.

    **L'existence indépendante des objets n'est pas non plus aliénante.** Les objets du besoin existent hors de l'homme et avant son activité ; mais, dans cette indépendance même, ce sont {green}les objets de ses besoins{/green}, des objets essentiels, indispensables à {violet}l'activation et à la confirmation{/violet} de ses forces essentielles. Marx joue en allemand sur {violet}*Betätigung*{/violet} (l'activation) et {violet}*Bestätigung*{/violet} (la confirmation) : il n'y a qu'une lettre de différence.

    **Du besoin au travail.** L'épreuve passive du besoin n'annule pas l'activité de l'homme : elle {coral}la suscite{/coral}. C'est en s'éprouvant comme être naturel, donc affecté, que les hommes s'affirment en s'activant, dans {amber}l'appropriation en acte des objets de leur besoin{/amber}, c'est-à-dire en les transformant de façon à les rendre aptes à satisfaire des besoins humains. Cette appropriation est le travail.

    **Ce que le travail atteste.** Par le travail, les hommes expriment à eux-mêmes l'objectivité de leur être en l'objectivant extérieurement, et donc la double dimension, passive et active, de cet être : {red}activité et passivité sont inextricablement liées{/red}. Cette unité est {violet}constitutive d'un être naturel{/violet}.

    ! La passivité n'est pas ici un défaut : elle est le principe du travail, puisqu'on ne se met à travailler que parce qu'on éprouve un besoin.
