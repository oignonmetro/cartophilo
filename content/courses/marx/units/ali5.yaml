- id: ali5-l3
  title: "L'activité pure et la passivité d'un autre"
  notes: |-
    **Réduit à une activité pure, le travailleur éprouve, quand il travaille, une passivité qui n'est pas la sienne : l'aliénation est la séparation d'avec sa propre passivité.**

    **Ce qui reste.** Au terme de l'aliénation, il ne reste au travailleur qu'{violet}une pure activité{/violet}, c'est-à-dire une pure {violet}puissance de travail{/violet}, privée de toute condition objective de sa mise en œuvre. Ce dont il est dépossédé, ce n'est pas seulement de l'outil ou du produit, mais {red}du besoin{/red}, ce qui est au {amber}principe du travail comme appropriation de l'objet{/amber}. Cette capacité abstraite doit alors {amber}attendre que les conditions objectives de son actualisation lui soient fournies du dehors{/amber}, par celui qui les possède.

    **Une double inversion.** __Quand cette puissance est mise en œuvre, on attendrait une expérience d'activité.__ Or le travailleur éprouve {coral}une passivité{/coral} : {amber}son activité lui apparaît comme l'activité d'un autre en lui{/amber}, pour celui qui possède les conditions du travail et possédera le produit. À l'origine, __là où il aurait fallu l'épreuve passive du besoin, il y avait une réduction à la pure activité__ ; au moment du travail, là où il faudrait de l'activité, il y a de la passivité. Autrement dit, {coral}à cause de l'aliénation, le travailleur est réduit à une pure activité là où il devrait ressentir la passivité inhérente à sa vie et à une pure passivité dans son activité même{/coral}.

    **Marx le dit au premier manuscrit** : le rapport de l'ouvrier à sa propre activité est celui d'une {teal}« activité étrangère qui ne lui appartient pas, __c'est l'activité qui est passivité, la force qui est impuissance__, la procréation qui est castration. C'est l'énergie physique et intellectuelle de l'ouvrier, sa vie personnelle – car __qu'est-ce que la vie sinon l'activité ?__ – qui est transformée en __activité dirigée contre lui-même__, indépendante de lui, ne lui appartenant pas »{/teal} (premier manuscrit, p. XXIII).

    **Une passivité qui n'est pas la sienne.** Ce n'est pas que {pink}l'objet viendrait limiter de l'extérieur l'activité du travailleur{/pink}. Le processus est plus complexe : {amber}le travailleur est d'abord désobjectivé, réduit à l'activité abstraite{/amber} ; {coral}l'objectivité et la passivité sont hors de lui{/coral}, de sorte qu'elles peuvent faire retour contre lui, comme la puissance d'une objectivité qui n'est plus la sienne.

    **Le sujet aliéné.** Privé de sa passivité, le travailleur peut se concevoir comme __un être purement actif__, saisir {pink}l'activité comme l'essence de son être{/pink}. Mais cette {coral}activité pure{/coral} signe son {amber}impuissance{/amber}, puisqu'elle est {coral}privée des rapports à l'objectivité indispensables à sa mise en œuvre{/coral}. Comme tout sujet s'attribue l'activité (jusqu'à l'auto-position du moi chez {sky}Fichte{/sky}), se concevoir comme sujet est, du point de vue de Marx, le plus sûr indice de l'aliénation.

    **La perte du besoin, du désir.** {teal}« L'__aliénation__ transparaît tout autant à travers le fait que mes moyens de subsistance appartiennent à un autre, que __ce qui est mon désir est la possession inaccessible d'un autre__ »{/teal} (troisième manuscrit, p. XX) [{blue}*Wunsch*{/blue}, souhait ou désir ; {blue}*Lebensmittel*{/blue}, moyens de vivre]. __Ce dont on est__ {coral}__privé__{/coral} __est d'abord le besoin, le__ {coral}__désir__{/coral}__, la__ {coral}__part passive de notre être__{/coral}__.__ L'aliénation ne consiste pas en ce qu'{pink}un autre soit actif à ma place{/pink}, mais {amber}en ce que je sois séparé de ma propre passivité{/amber} : __mes affects ne sont plus les miens, ils me deviennent non seulement extérieurs, mais étrangers__.

    ! La passivité qu'éprouve l'ouvrier au travail n'est pas la passivité naturelle du besoin : c'est la passivité de qui exécute l'activité d'un autre.
