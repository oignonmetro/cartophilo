- id: ali8-l3
  title: "Le travailleur libre"
  notes: |-
    **{green}La dévalorisation du travailleur est le présupposé du capital{/green} : le travailleur est libre parce qu'il n'a plus aucune valeur d'échange, et il vend l'usage de capacités dont il est juridiquement le propriétaire.**

    **La dévalorisation, condition du capital.** {teal}« {/teal}Aussi longtemps que le travailleur en tant que tel {teal}a une valeur d'échange{/teal}, {teal}le capital industriel ne peut exister en tant que tel{/teal}, et donc encore moins a fortiori le capital développé{teal} »{/teal} (II-28). Et : {teal}« {/teal}{teal}Son absence de valeur{/teal} et sa dévalorisation sont le {teal}présupposé du capital{/teal} et la {teal}condition sine qua non du travail libre »{/teal} (II-28). Ce qui est utile au capitaliste, ce n'est pas le travailleur lui-même, mais ses capacités : le capitaliste achète {amber}le droit de les utiliser{/amber} sur une durée.

    **Libre, et pourtant forcé.** Le travailleur est libre dans la mesure même où il est dévalorisé : ne représentant plus en lui-même aucune richesse, il ne peut plus être acheté. Ce qui est vendu, c'est l'usage de ses capacités, ce qui suppose qu'il en dispose : il est libre {violet}au sens juridique{/violet}. {amber}Cette liberté est réelle et apparente à la fois{/amber} : il est réellement propriétaire de ses capacités, mais il est forcé de les vendre, sans quoi il ne peut pas vivre, étant {red}séparé{/red} de toutes les conditions de leur actualisation (séparation que l'on peut prendre comme une expropriation).

    **Une personne juridique.** Marx note, à propos de {sky}Linguet{/sky} : {teal}« {/teal}le travailleur se trouve {teal}posé formellement comme personne{/teal}, qu'{teal}en dehors de son travail{/teal}, il est encore quelque chose pour lui-même et que l'aliénation des manifestations extérieures de son être vivant n'est qu'un moyen de sa vie propre{teal} »{/teal} (II-28) [{blue}*veräußern*{/blue}, aliéner au sens de vendre ; {blue}*Lebensäußerung*{/blue}, expression vitale]. Cela suppose la différence entre la réalité physique du travailleur, individu vivant et incarné, et le {coral}sujet qui dispose librement de ses capacités{/coral}. Ce sujet n'a rien de naturel : c'est une institution sociale, juridique, historique.

    **Pas une {red}marchandisation des travailleurs{/red}.** Pour qu'il y ait marchandisation, il faudrait que les travailleurs aient une valeur d'échange, {yellow}comme les esclaves{/yellow}. Au contraire, le capitalisme suppose qu'ils n'en aient plus : ce qui est marchandise, ce sont leurs capacités. Le cours rapproche cette réduction à un sujet employable de {violet}l'« employabilité »{/violet} contemporaine.

    **L'esclavage n'est pas aboli.** Sans lui, il n'y a pas de rapport capitaliste, mais Marx sait que, dans un pays où se développent des rapports capitalistes ({yellow}les États-Unis{/yellow}), des rapports précapitalistes comme l'esclavage subsistent ou sont réinstitués. Ce qu'il cherche à comprendre, ici, est la spécificité du rapport capitaliste, qui apparaît dans l'échange entre celui qui vend une capacité de travail et celui qui l'achète.

    ! Être dévalorisé ne veut pas dire valoir peu : le travailleur n'a pas de valeur d'échange du tout, et ce sont ses capacités qui s'échangent.
