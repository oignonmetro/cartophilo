- id: ali8-l2
  title: "La non-valeur existante"
  notes: |-
    **{green}Le travail est une pauvreté absolue parce qu'il est non-valeur{/green} : il n'est aucune des réalités qui possèdent de la valeur, et le capitaliste n'en achète que l'usage.**

    **L'équivalence.** Marx établit une équivalence entre le travail abstrait des moments de son effectivité réelle (coupé de la matière, de l'instrument et du produit) et le travail comme {violet}« non-valeur existante »{/violet} [{blue}*Nicht-Wert*{/blue}]. Il multiplie les formules négatives, les « non-quelque chose » : le travail est purement négatif. Ce qui possède de la valeur, ce sont {green}la matière première, les instruments et le produit{/green} : c'est la richesse. Or le travail n'en est aucun. {coral}Il n'est donc pas seulement privé des conditions de son objectivation, il n'est lui-même rien de ce qui a de la valeur.{/coral} Il est {coral}l'exclusion en acte de la richesse{/coral}, non son simple manque.

    **Une objection : la valeur d'usage.** {pink}Le travail est utile, donc a une valeur d'usage.{/pink} Ce n'est pas une objection, c'est ce que veut dire Marx. Le capitaliste donne de l'argent contre du travail comme valeur d'usage : cela ne fait que lui {red}coûter{/red}, d'où sa volonté de payer le moins possible l'usage de la force de travail. Le travailleur ne se présente pas devant lui comme {amber}marchandise{/amber}, comme valeur d'échange. {yellow}Il n'est pas comme l'esclave, que l'on achèterait pour le revendre plus cher.{/yellow}

    **L'échange.** Il ne produit aucune richesse, ni pour le capitaliste, ni pour le travailleur, qui reçoit un salaire, équivalent dans une autre valeur d'usage qu'il consomme pour restaurer à l'identique sa propre valeur d'usage pour le capitaliste. Le travailleur ne vend rien qui ait une valeur d'échange : seulement, dit Marx, {amber}une disposition temporaire de sa capacité de travail{/amber}. Le capitaliste n'achète que de la valeur d'usage, pour une durée.

    **Matière, outils, travail.** L'achat de la matière et des outils coûte aussi au capitaliste, mais ce sont des richesses : le produit, issu de leur mise en œuvre, aura une valeur d'échange plus grande qu'au départ ({yellow}le fil est une richesse pour qui veut faire de la toile, la toile pour qui veut faire des habits{/yellow}). La capacité de travail, elle, reste identique à elle-même du début à la fin du procès, sans ajout de valeur, et coûte au capitaliste le lendemain autant que la veille.

    ! {amber}Dire que le travail est une non-valeur ne veut pas dire qu'il est inutile : il est utile, mais cette utilité n'est pas une valeur d'échange.{/amber}
