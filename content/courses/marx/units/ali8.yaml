lessons:
- id: ali8-l1
  title: "Le travail comme abstraction : la pauvreté absolue"
  notes: |-
    **Deuxième aspect du rapport du travailleur à son activité : l'**{violet}**abstraction**{/violet}**. Considéré du point de vue de son objectivité, le travail est {red}ce qui est privé de toute objectivité{/red}, et Marx retrouve ici, presque mot pour mot, {red}la perte d'objectivité de 1844{/red}.**

    **Le non-objectif sous forme objective.** Marx écrit : {teal}« {/teal}{teal}Travail non objectivé{/teal}, saisi {teal}négativement{/teal} (lui-même encore objectif ; {teal}le non-objectif lui-même sous forme objective{/teal}){teal} »{/teal} (III-9) [{blue}*Nicht-vergegenständlichte Arbeit*{/blue}, … {blue}*das Nichtgegenständliche selbst in objektiver Form*{/blue}]. Le travail n'existe dans rien d'objectif : il est {red}non-matière première, non-instrument de travail, non-produit{/red}. C'est {teal}« {/teal}le travail {teal}séparé de tous moyens et objets de travail{/teal}, {teal}de toute son objectivité »{/teal} (III-9), le travail existant comme abstraction des moments de son effectivité réelle, c'est-à-dire de la matière, des outils et du produit : en somme la {violet}capacité abstraite de travail{/violet}, que Marx appelle ici « travail ».

    **Un complet dépouillement.** Marx parle d'un « complet dépouillement », de l'existence purement subjective du travail, démunie de toute objectivité (III-9). C'est {violet}la pauvreté absolue{/violet} [{blue}*absolute Armut*{/blue}] : non la pauvreté comme manque, mais {coral}comme exclusion totale de la richesse objective{/coral}. Le travail est privé de tous les moyens objectifs de s'actualiser par lui-même.

    **Aucune rupture avec 1844.** On retrouve la thématique de la non-objectivité, de la perte d'objectivité, où se trouvait le sens proprement marxien de l'aliénation. Il y a {amber}une continuité complète{/amber} jusque dans le vocabulaire : celui de la privation d'objectivité, d'une subjectivité purement subjective au sens négatif, obtenue par privation. Le terme {blue}*Entfremdung*{/blue} n'est pas utilisé ici, mais l'adjectif {blue}*fremd*{/blue} l'est à de nombreuses reprises ; le concept d'aliénation défini en 1844 est parfaitement présent. Ce qui est nouveau, c'est la formule : la perte d'objectivité comme complet dépouillement, pauvreté absolue.

    **Un texte philosophique.** Les {sky}*Grundrisse*{/sky} sont un texte où abondent les concepts philosophiques ; en rédigeant le livre I du *Capital*, Marx a travaillé à en réduire l'aspect philosophique pour que son texte soit lisible du plus grand nombre.

    ! {amber}La pauvreté absolue n'est pas un niveau de misère : c'est la forme d'un travail séparé de tout objet et de tout moyen, et qui n'est que capacité.{/amber}
