- id: ideo-l5
  title: "Contre Hegel et Feuerbach : partir de ce que les hommes ont de commun avec la nature"
  notes: |-
    **Marx refuse de définir l'homme par la conscience de soi, parce que c'est faire de la conscience une faculté séparée et de l'homme une exception dans la nature, ce qui conduit à l'impuissance.**

    **Les termes du problème viennent de Feuerbach.** Il ouvre *L'essence du christianisme* ainsi : {teal}« la religion repose sur cette différence essentielle qui distingue l'homme de l'animal, les animaux n'ont pas de religion »{/teal}. Et cette différence repose elle-même sur une autre, plus fondamentale : ce qui distingue l'homme de l'animal, c'est {violet}la conscience{/violet} (*das Bewusstsein*). Quand Marx récuse, dans les *Manuscrits de 1844*, que {teal}« l'homme = la conscience de soi »{/teal} et que {teal}« l'homme soit posé [comme] = le soi »{/teal}, il ne rompt donc pas seulement avec {sky}Hegel{/sky}, mais aussi avec {sky}Feuerbach{/sky}, qui commençait par la conscience de soi comme spécificité essentiellement humaine.

    **Marx commence par le commun.** Il ne commence jamais par ce qui distingue spécifiquement les hommes, mais par ce qu'ils ont en commun avec tous les êtres naturels : ils sont d'abord {coral}des « parties de la nature » parmi les autres{/coral}, dotés comme tous les vivants d'une activité vitale qu'il caractérise comme {violet}productive{/violet}. Parmi les forces naturelles dont ils sont équipés, il y a la conscience. Voir [[g-activite-vitale|Activité vitale]].

    **L'activité vitale consciente.** {teal}« L'animal est immédiatement uni à son activité vitale, il ne s'en différencie pas, il l'est »{/teal} ; l'homme {teal}« fait de son activité vitale elle-même l'objet de sa volonté et de sa conscience ; il a de l'activité vitale consciente »{/teal}. Mais Marx refuse d'en conclure qu'une essence irréductiblement humaine s'exprime dans une faculté de conscience.

    **Pourquoi il refuse ce pas.** Le franchir oblige à {red}autonomiser la faculté de conscience{/red}, à la considérer comme séparée, et finalement à faire des hommes {red}une exception à l'ordre commun de la nature{/red}. Marx y voit {amber}l'origine des illusions idéalistes{/amber}, dont la critique est à faire non pour des raisons dogmatiques mais pour des raisons {coral}pratiques{/coral} : ces illusions conduisent les hommes à l'impuissance, à l'incapacité d'agir et de maîtriser tant leur monde que leur propre vie.

    ! Marx ne nie pas que la conscience soit proprement humaine : il nie qu'elle soit une faculté séparée qui ferait de l'homme un être à part dans la nature.
  points:
