- id: ideo-l15
  title: "Le fétichisme de la marchandise : la genèse d'une représentation nécessaire et imaginaire"
  notes: |-
    **Le fétichisme de la marchandise est l'exemple d'une représentation à la fois nécessaire et imaginaire, dont la critique se fait par sa genèse et non depuis l'extérieur d'une « science ».**

    **Le texte.** Marx écrit des producteurs : {teal}« les relations sociales qu'entretiennent leurs travaux privés apparaissent aux producteurs pour ce qu'elles sont, c'est-à-dire, {/teal}{teal}non pas comme des rapports immédiatement sociaux entre les personnes dans leur travail même{/teal}{teal}, mais au contraire comme {/teal}{teal}rapports impersonnels entre des personnes et rapports sociaux entre des choses{/teal}{teal} impersonnelles »{/teal}.

    **Pourquoi cette apparence est nécessaire.** Dans une production marchande, la production se répartit en une multiplicité de {violet}travaux privés{/violet}, effectués séparément les uns des autres, {amber}sans organisation consciente{/amber}. Leurs rapports sociaux apparaissent donc nécessairement aux producteurs sous la forme du rapport social d'{violet}échangeabilité{/violet} des produits de leurs travaux, en tant que marchandises. On a ici la genèse d'une représentation à la fois {coral}nécessaire et imaginaire{/coral}, qui accompagne un processus social certes réel, la production marchande, mais imparfait et inaccompli, dont la maîtrise échappe à ses acteurs.

    **Une critique par la genèse.** La critique de cette représentation ne se fait pas depuis le point de vue extérieur d'une supposée « science » : elle se fait à partir de la genèse de la représentation, de la {green}mise au jour et de la compréhension des causes qui ne peuvent pas ne pas la produire{/green}.

    **La tâche du concept d'idéologie.** Elle est de comprendre la genèse nécessaire des représentations imaginaires, en tant qu'elle accompagne, dans l'idéalité, le déploiement de processus sociaux que l'on peut dire « manqués » ou inaboutis, selon une catégorie d'Axel Honneth (*soziale Fehlentwicklungen*). Ils conduisent à des formes de vie humaines mutilées et inaccomplies. Et cela, {coral}pour qu'une transformation réelle de ces processus permette en même temps de s'émanciper des idéalités imaginaires et de libérer la puissance de comprendre{/coral}.

    ! L'émancipation à l'égard de l'idéologie est une transformation réelle de la vie sociale, et la compréhension de la genèse en est la condition, non le substitut.
