- id: ideo-l12
  title: "L'idéologie des dominants : l'universalité des penseurs de la classe dominante"
  notes: |-
    **Les pensées de la classe dominante sont imaginaires non parce que cette classe manipulerait sciemment, mais parce que la position de ses penseurs, la plus éloignée de la production, les porte à produire les idées les plus abstraites et les plus universelles.**

    **Le problème.** Comment les pensées dominantes, expression idéelle de la domination matérielle, peuvent-elles être imaginaires ? Il est inséparable d'une thèse propre à Marx : les pensées de la classe dominante se présentent comme universelles, et cette classe présente nécessairement ses intérêts particuliers comme {violet}l'intérêt commun de tous les membres de la société{/violet}. Marx : chaque nouvelle classe dominante est contrainte, {teal}« ne serait-ce déjà que pour parvenir à ses fins »{/teal}, de présenter son intérêt comme l'intérêt communautaire de tous, c'est-à-dire de donner à ses pensées {teal}« la forme de l'universalité »{/teal}.

    **Une lecture à écarter.** On a l'impression que l'idéologie serait sciemment constituée et utilisée par la classe dominante pour légitimer sa domination. Si c'était le cas, elle ne serait plus l'ensemble des idées imaginaires qui accompagnent une vie inaccomplie. Mais ce passage de Marx commence par un rappel de la {amber}division du travail{/amber}, {teal}« l'une des puissances majeures de l'histoire jusqu'à maintenant »{/teal}, et elle n'est effective qu'avec la division du travail matériel et du travail intellectuel.

    **La division jusque dans la classe dominante.** Elle s'y manifeste aussi : il faut distinguer les {violet}penseurs de la classe{/violet}, et ses membres {violet}actifs{/violet}, engagés dans la production réelle, ne serait-ce que pour la faire tourner à leur avantage. Or les penseurs de la classe dominante sont, dans une société, {coral}les individus les plus éloignés de la production matérielle{/coral} : ils sont donc les plus portés à autonomiser la conscience théorique. Aucune idée n'est plus autonome, donc plus abstraite, plus générale et plus universelle que les leurs.

    **Conclusion.** Ils ne veulent pas consciemment produire des idées présentant comme universel l'intérêt de leur classe : {coral}en vertu de leur position sociale, ils ne peuvent pas ne pas produire des idées prétendant au maximum d'universalité{/coral}. La domination sociale d'une classe s'exprime par la production d'idées dominantes ; ces idées doivent être d'un haut degré de généralité, très abstraites, parce que leur lieu de production est très éloigné de la production matérielle.

    ! Le cours ne nie pas que l'idéologie serve la domination : il nie qu'elle soit d'abord un mensonge forgé pour elle.
