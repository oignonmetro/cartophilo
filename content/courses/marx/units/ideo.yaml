- id: ideo-l8
  title: "Le « langage de la vie réelle »"
  notes: |-
    **Dans la conscience, les hommes expriment, dans l'élément de la représentation, le contenu même de leur vie réelle : la production des idées est le langage de la vie réelle, et ce langage peut être exact ou fautif.**

    **L'idéologie allemande maintient-elle la théorie de 1844 ?** Le concept d'idéologie est-il introduit dans le cadre de cette conception de la conscience, ou au prix d'un renversement ? Marx écrit : {teal}« les représentations que se font les individus sont des idées soit sur leurs rapports avec la nature, soit sur leurs rapports entre eux, soit sur leur propre nature ; il est évident que, dans tous ces cas, ces représentations sont {/teal}{teal}l'expression consciente{/teal}{teal}, {/teal}{teal}réelle ou imaginaire{/teal}{teal}, de leurs rapports et de leurs activités réels »{/teal}.

    **Le contenu réel et son expression.** Ce contenu, c'est une activité de production, des rapports avec la nature ou le monde objectif, un commerce des hommes entre eux. C'est lui qui est exprimé dans l'élément idéel. Marx va jusqu'à dire que les représentations, la pensée, le commerce intellectuel des hommes sont {teal}« l'émanation directe »{/teal} [*direkter Ausfluss*] de leur comportement matériel, d'où la thèse : {teal}« la production des idées, des représentations et de la conscience (…) est {/teal}{teal}le langage de la vie réelle{/teal}{teal} »{/teal} [*die Sprache des wirklichen Lebens*]. C'est bien un redoublement de ce contenu réel dans l'élément idéel de la représentation.

    **Ce langage n'est pas encore l'idéologie.** L'expression peut être {green}« réelle »{/green} ou {red}« imaginaire »{/red}. Que les représentations soient le langage de la vie réelle laisse ouvert qu'il l'exprime correctement ou faussement. En termes spinozistes, qui sont aussi ceux de Marx : les représentations peuvent être {green}adéquates{/green} ou {red}inadéquates et imaginaires{/red}. L'expression est dite {violet}idéologique{/violet} quand elle est fautive, c'est-à-dire non conforme au contenu de la vie réelle. C'est là que le concept d'idéologie apparaît, et là que les problèmes commencent.

    ! Toute représentation n'est pas idéologique : l'idéologie est le cas où le langage de la vie réelle l'exprime de façon inadéquate.
  points:
  - id: ideo-l8-p1
    sentence: "L'idéologie allemande : les représentations sont l'expression consciente, ___, de leurs rapports et de leurs activités réels."
    answer: "réelle ou imaginaire"
    alt: []
  - id: ideo-l8-p2
    sentence: "L'idéologie allemande : les représentations, la pensée, le commerce intellectuel des hommes sont l'___ de leur comportement matériel."
    answer: "émanation directe"
    alt: ["direkter Ausfluss"]
