- id: ideo-l9
  title: "Une vie bornée, étriquée, mutilée : d'où vient l'inadéquation"
  notes: |-
    **Si les représentations sont l'émanation directe de la vie réelle, une représentation ne peut être fautive que si la vie réelle est elle-même inadéquate à elle-même : l'idéologie est l'expression exacte d'une vie inaccomplie.**

    **Le paradoxe.** Si les représentations accompagnent comme une série le déploiement de la vie réelle, comment peut-il y en avoir de fautives ? L'inadéquation supposerait une extériorité entre le contenu matériel et ses représentations, que tout ce qui précède exclut. Marx le dit lui-même : {teal}« la conscience ne peut jamais être autre chose que {/teal}{teal}l'être conscient{/teal}{teal} »{/teal} [*das bewusste Sein*]. Comment la conscience serait-elle fautive par rapport à l'être, puisqu'elle n'est rien d'autre que l'être, comme être idéel ? Il faut donc comprendre l'adéquation autrement que comme la congruence de deux termes extérieurs l'un à l'autre.

    **La solution de Marx.** {coral}L'inadéquation de l'expression idéelle renvoie à une inadéquation inhérente à la vie réelle elle-même.{/coral} Marx l'écrit : {teal}« si l'expression consciente des conditions de vie réelles des individus est imaginaire, si, dans leurs représentations, ils mettent la réalité la tête en bas, ce phénomène est encore une conséquence de leur {/teal}{teal}mode d'activité matériel borné{/teal}{teal} et des {/teal}{teal}rapports sociaux étriqués{/teal}{teal} qui en résultent »{/teal}.

    **Des représentations qui expriment parfaitement une vie mutilée.** Des individus ne se font des représentations idéologiques que s'ils mènent une vie {violet}bornée et étriquée{/violet}, qu'Adorno dira plus tard {violet}« mutilée »{/violet} : une vie dont les conditions ne permettent pas le développement, la réalisation et l'épanouissement. Ces représentations ne sont donc pas inadéquates à la vie réelle, comme si elles l'exprimaient mal ; au contraire, {coral}elles l'expriment parfaitement, la reflètent fidèlement et l'accompagnent nécessairement{/coral}, cette vie étant elle-même inaccomplie. Si la production des idées est le langage de la vie réelle, {green}la production des idéologies est le langage d'une vie réelle inachevée, inaccomplie et mutilée{/green}. Voir [[g-vie-accomplie|Vie accomplie]].

    **Pas de coupure avec 1844.** Cette conception prolonge la critique de la religion de 1844 : la religion y est la conscience de soi de l'homme qui ou bien ne s'est pas encore conquis, ou bien s'est déjà de nouveau perdu, la « réalisation chimérique » d'une essence non réalisée ici et maintenant. Ce qui change, c'est le concept d'essence : Marx parle désormais des {amber}conditions réelles de l'accomplissement d'une vie{/amber}, non d'une essence non réalisée.

    ! L'idéologie n'est pas une mauvaise copie d'une vie bien portante : c'est la copie fidèle d'une vie qui ne s'est pas accomplie.
  points:
  - id: ideo-l9-p1
    sentence: "L'idéologie allemande : « la conscience ne peut jamais être autre chose que l'___ »."
    answer: "être conscient"
    alt: ["das bewusste Sein"]
  - id: ideo-l9-p2
    sentence: "L'inadéquation d'une expression idéelle renvoie à une inadéquation inhérente à la ___ elle-même."
    answer: "vie réelle"
    alt: ["vie"]
