- id: ideo-l10
  title: "Mettre la réalité la tête en bas : l'illusion de l'autonomie des idées"
  notes: |-
    **« Mettre la réalité la tête en bas », c'est commencer par la conscience et lui conférer une existence indépendante, et une vie mutilée y porte nécessairement.**

    **Une vie qui n'est pas active par elle-même.** Une vie étriquée est une vie qui n'a ni les moyens ni les conditions de se déterminer et de se développer à partir d'elle-même. Elle n'est pas, selon le mot de Marx, {violet}*selbsttätig*{/violet}, {violet}active par elle-même{/violet}. Elle est donc toujours activée par autre chose, par des circonstances, des événements, des causes qu'elle ignore ou ne comprend pas.

    **L'ignorance des causes.** Ignorants des causes qui les déterminent à agir, les individus peuvent se figurer qu'ils agissent à partir des représentations qu'ils se font des choses et de leurs fins, et donc que {red}ces représentations sont premières et déterminantes{/red}. C'est, dit le cours, une inadéquation de type spinoziste : on se croit libre parce qu'on ignore les causes.

    **La division du travail l'aggrave.** Si la division est assez avancée pour que règne la division du {amber}travail matériel{/amber} et du {amber}travail intellectuel{/amber}, entre la production des choses et la production des idées, les individus se figurent d'autant plus aisément que le monde idéel est séparé de la vie matérielle, indépendant d'elle et premier. Marx : {teal}« la conscience peut vraiment s'imaginer qu'elle est autre chose que la conscience de la pratique existante, qu'elle représente réellement quelque chose sans représenter quelque chose de réel »{/teal}, et elle {teal}« est en état de s'émanciper du monde et de passer à la formation de la théorie “pure”, théologie, philosophie, morale, etc. »{/teal}.

    **Le noyau de toutes les idéologies.** Pour Marx, cette division est {coral}une, si ce n'est pas la mutilation fondamentale de la vie humaine{/coral}, puisque, dans une vie accomplie, tout homme doit pouvoir se consacrer aussi bien à la production matérielle des choses qu'à la production intellectuelle des idées. Il est donc compréhensible que cette mutilation s'exprime, du côté de la conscience, en donnant naissance au noyau de toutes les formes d'idéologies : {green}la conception imaginaire de l'autonomie et du caractère déterminant des idées et des représentations par rapport à la vie réelle{/green}.

    ! La tête en bas ne veut pas dire que les idées soient sans rapport avec le réel : elles l'expriment, mais elles se croient premières.
