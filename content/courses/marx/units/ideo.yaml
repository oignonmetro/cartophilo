# Cours sur Marx (piste Idées), tiré du cours écrit de Franck Fischbach pour
# l'agrégation 2027, « Qu'est-ce que l'idéologie chez Marx ? » (voir
# content/philosophie.md, « Un cours sur un auteur, tiré d'un commentaire »).
# Source : D:\Downloads\Cours sur Marx - QUEST-CE QUE lIDEOLOGIE.pdf
#
# Les citations de Marx sont reprises du cours, avec ses traductions : Manuscrits
# de 1844 dans la traduction de Fischbach (Vrin, 2007), L'idéologie allemande
# retraduite par lui d'après l'édition du MEGA (2003-2004), Le Capital dans la
# traduction dirigée par Lefebvre (PUF). Elles font foi telles que le cours les
# donne ; seule leur copie se contrôle. Un mot biffé par Marx, que le cours
# donne entre parenthèses, n'est pas repris.
#
# Les rappels reprennent le cours sans le nommer à chaque phrase. Ce qu'il
# rapporte de Balibar (l'abandon du concept d'idéologie) et de Honneth (les
# « processus sociaux manqués ») est dit dans le rappel, sans carte.

id: ideo
title: "Qu'est-ce que l'idéologie ?"
subtitle: "Une expression nécessaire et inadéquate d'une vie inaccomplie, des Manuscrits de 1844 à L'idéologie allemande"
icon: compass
color: violet
lessons:
- id: ideo-l1
  title: "Le problème : l'idéalité, et l'origine du concept"
  notes: |-
    **Le concept d'idéologie répond à une question : pourquoi, dès qu'il y va de la vie humaine, y a-t-il non seulement** {violet}**la vie**{/violet}**, mais aussi** {violet}**la conscience et ses représentations**{/violet}**, et quel rapport entretiennent-elles ?**

    **Une conception matérialiste et pratique de l'idéalité.** Marx veut {coral}comprendre l'idéalité comme telle{/coral}, c'est-à-dire le fait que la vie humaine comporte, avec la vie, {teal}« la conscience »{/teal} et ses {teal}« représentations »{/teal}. Et il veut penser le rapport de la conscience et de ses produits à {amber}la vie pratique des hommes{/amber}, cette vie qui est {violet}essentiellement relationnelle et productive{/violet}, {violet}faite ou tissée de rapports pratiques{/violet}.

    **Où chercher l'origine du concept.** Ce que L'idéologie allemande appellera idéologie désigne un problème que Marx avait déjà rencontré et déjà élaboré. Son origine est à chercher du côté d'une {violet}théorie de la conscience{/violet}, dont Marx jette les bases dès les *Manuscrits de 1844*, {coral}sous la forme d'une critique de toute théorie qui commencerait par la « conscience de soi »{/coral}. Le cours suit donc deux temps : d'abord cette théorie de la conscience de 1844, puis le concept d'idéologie lui-même.

    ! L'idéologie n'est pas une invention tardive de Marx : le problème est déjà posé en 1844, avant le mot.
  points:
  - id: ideo-l1-p1
    sentence: "Chez Marx, le concept d'idéologie s'inscrit dans une conception à la fois ___ et pratique de l'idéalité."
    answer: "matérialiste"
    alt: []
  - id: ideo-l1-p2
    sentence: "Avec le concept d'idéologie, Marx veut rendre compte de l'___ comme telle : le fait que, dès qu'il y va de la vie humaine, il n'y a pas seulement la vie, mais aussi la conscience et ses représentations."
    answer: "idéalité"
    alt: []
  - id: ideo-l1-p3
    sentence: "Marx veut penser les rapports de la conscience et de ses produits avec la ___ pratique des hommes."
    answer: "vie"
    alt: ["vie pratique", "activité pratique"]
  - id: ideo-l1-p4
    sentence: "La vie humaine est essentiellement relationnelle et productive : elle est faite ou tissée de ___ pratiques."
    answer: "rapports"
    alt: []
  - id: ideo-l1-p5
    sentence: "Le problème que L'idéologie allemande nomme idéologie, Marx l'avait déjà rencontré ___."
    answer: "avant L'idéologie allemande"
    alt: ["dès les Manuscrits de 1844", "en 1844"]
  - id: ideo-l1-p6
    sentence: "L'origine du concept d'idéologie se cherche du côté d'une théorie de la ___, dont Marx jette les bases dès les Manuscrits de 1844."
    answer: "conscience"
    alt: []
  - id: ideo-l1-p7
    sentence: "La théorie de la conscience des Manuscrits de 1844 est une critique de toute théorie de la conscience qui commencerait par la « ___ »."
    answer: "conscience de soi"
    alt: []

- id: ideo-l2
  title: "La conscience universelle et l'être social : une séparation qui a ses causes"
  notes: |-
    **Dans la société actuelle, la conscience du genre humain se présente comme séparée de la vie sociale réelle et hostile à elle, mais cette séparation s'explique par la vie sociale elle-même.**

    **Le texte de départ** (*Manuscrits de 1844*, trad. Fischbach) : {teal}« Ma {/teal}{teal}conscience universelle{/teal}{teal} est seulement {/teal}{teal}la figure théorique{/teal}{teal} de ce dont la communauté réelle, l'être social est {/teal}{teal}la figure vivante{/teal}{teal}, alors qu'aujourd'hui la conscience universelle est {/teal}{teal}une abstraction de la vie réelle{/teal}{teal} qui se présente à cette dernière {/teal}{teal}comme son ennemie{/teal}{teal}. Par suite, l'activité de ma conscience universelle, en tant qu'activité, est aussi mon existence théorique en tant qu'être social »{/teal}.

    **La contradiction vécue.** Dans la pratique, les hommes vivent une existence sociale faite de {red}opposition, de division, de concurrence et de domination{/red} ; mais, dans la théorie, ils ont conscience de {green}leur unité, de leur appartenance à un même genre{/green}. Ils ne peuvent donc réaliser le contenu de leur conscience théorique que contre leur existence sociale réelle, et la vie sociale s'accomplit contre la conscience théorique. Pour vivre et survivre, il leur faut ne songer qu'à leur vie {pink}individuelle et égoïste{/pink}.

    **La cause de la séparation est dans la vie réelle.** La conscience universelle apparaît abstraite, séparée de l'existence sociale, mais {coral}c'est une existence sociale divisée qui l'engendre comme abstraction{/coral}. Cela ne veut pas dire qu'aucune forme de conscience ne soit immanente à cette réalité : il y en a une, {violet}la conscience que les individus prennent d'eux-mêmes comme de Soi individuels, isolés les uns des autres{/violet}. C'est la conscience {violet}de soi{/violet} et non du genre. Mais elle est à son tour une abstraction : {teal}« Le soi qui a été abstrait et fixé pour soi est l'homme en tant qu'égoïste abstrait, c'est l'égoïsme en sa pure abstraction élevé à la pensée »{/teal}.

    **Le résultat.** La vie sociale divisée a son expression dans la conscience : {coral}la conscience de soi, comme individu séparé et sujet autonome, est la forme régnante de la conscience{/coral}, et ce règne a pour conséquence que la conscience du genre paraît extérieure à la vie sociale et opposée à elle. Sur l'être générique, voir [[g-etre-generique|Être générique]].

    ! « Abstrait » ne veut pas dire « irréel » : la conscience de soi de l'individu isolé est bien l'expression réelle d'une société divisée, mais elle est abstraite au sens où elle sépare l'individu de tout ce qui le fait vivre.
  points:
  - id: ideo-l2-p1
    sentence: "Manuscrits de 1844 : « Ma conscience universelle est seulement ___ de ce dont la communauté réelle, l'être social est la figure vivante »."
    answer: "la figure théorique"
    alt: []
  - id: ideo-l2-p2
    sentence: "Manuscrits de 1844 : « Ma conscience universelle est seulement la figure théorique de ce dont la communauté réelle, l'être social est ___ »."
    answer: "la figure vivante"
    alt: []
  - id: ideo-l2-p3
    sentence: "Manuscrits de 1844 : « ... alors qu'aujourd'hui la conscience universelle est ___ qui se présente à cette dernière comme son ennemie »."
    answer: "une abstraction de la vie réelle"
    alt: []
  - id: ideo-l2-p4
    sentence: "Manuscrits de 1844 : « ... une abstraction de la vie réelle qui se présente à cette dernière ___ »."
    answer: "comme son ennemie"
    alt: []
  - id: ideo-l2-p5
    sentence: "Manuscrits de 1844 : « Par suite, l'activité de ma conscience universelle, en tant qu'activité, est aussi mon ___ en tant qu'être social »."
    answer: "existence théorique"
    alt: []
  - id: ideo-l2-p6
