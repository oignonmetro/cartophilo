- id: ideo-l3
  title: "Une seule réalité, deux figures : le parallélisme"
  notes: |-
    **Marx ne dit pas que la conscience exprime l'être social, ni qu'elle en est déterminée : il dit que l'être social et la conscience sont deux figures d'une seule et même réalité.**

    **Ce que la formule dit de plus qu'une correspondance.** On pourrait comprendre : à une forme d'être social correspond une forme de conscience théorique. Ce n'est pas faux, mais Marx dit davantage, ou le dit plus précisément. {red}Il ne dit pas que l'être social se traduit dans une forme de conscience, ni qu'il la détermine{/red}. Il dit qu'{coral}une unique réalité est donnée, dont l'être social est la figure vivante et la conscience la figure théorique{/coral} : c'est {violet}une forme de spinozisme{/violet}, deux expressions d'une même réalité.

    **Le texte qui le confirme** : {teal}« En tant que conscience générique, l'homme {/teal}{teal}confirme sa vie sociale réelle{/teal}{teal} et il {/teal}{teal}répète seulement dans la pensée son existence réelle{/teal}{teal}, de même qu'inversement l'être générique se confirme dans la conscience générique et est pour soi dans son universalité en tant qu'être pensant »{/teal}. C'est ce qu'on peut appeler un {violet}parallélisme{/violet} : la vie sociale réelle se confirme en étant répétée, redoublée par la conscience, et inversement.

    **Une seule et même chose dans deux éléments.** Ce qui se passe dans la réalité sociale et ce qui se passe dans la conscience est la même chose, sous deux figures : celle de la {amber}réalité{/amber} et celle de l'{amber}idéalité{/amber} (la conscience et ses représentations).

    **Conséquence : deux thèses qui ne se contredisent pas.** Marx peut dire à la fois que la réalité sociale détermine les idées et que les idées déterminent en retour la réalité sociale : les deux thèses découlent d'une même thèse, celle qui voit une seule réalité s'exprimer {green}dans l'être réel de la société{/green} comme {green}dans l'être idéel des consciences, des représentations et des idées{/green}. Voir [[g-expression-de-la-vie|Expression de la vie]].

    ! Il ne s'agit pas d'un reflet qui suivrait l'original à distance : la conscience n'est pas extérieure à ce qu'elle exprime, elle en est l'autre figure.
  points:
  - id: ideo-l3-p1
    sentence: "L'être social et la conscience sont, pour Marx, deux ___ d'une seule et même réalité."
    answer: "figures"
    alt: ["expressions"]
  - id: ideo-l3-p2
    sentence: "Cette façon de rapporter la conscience à l'être social relève, dit le cours, d'une forme de ___."
    answer: "spinozisme"
    alt: []
  - id: ideo-l3-p3
    sentence: "Manuscrits de 1844 : « En tant que conscience générique, l'homme confirme sa vie sociale réelle et il ___ seulement dans la pensée son existence réelle »."
    answer: "répète"
    alt: []
  - id: ideo-l3-p4
    sentence: "Manuscrits de 1844 : « ... de même qu'inversement l'être générique se confirme dans la conscience générique et est pour soi dans son universalité en tant qu'___ »."
    answer: "être pensant"
    alt: []
  - id: ideo-l3-p5
    sentence: "Le rapport que Marx établit entre l'être social et la conscience est un ___ : la même chose se passe dans la réalité et dans l'idéalité."
    answer: "parallélisme"
    alt: []
  - id: ideo-l3-p6
    sentence: "Si l'être social et la conscience sont deux figures d'une même réalité, la réalité sociale détermine les idées et les idées déterminent en retour la réalité sociale : les deux thèses ne se ___ pas."
    answer: "contredisent"
    alt: ["contredisent"]
  - id: ideo-l3-p7
    sentence: "Marx ne dit pas que l'être social s'exprime ou se traduit dans la conscience, mais qu'une unique ___ se donne sous deux figures."
    answer: "réalité"
    alt: []

- id: ideo-l4
  title: "La conscience n'est pas une faculté : avoir de la conscience, c'est avoir des rapports"
  notes: |-
    **Marx ne commence jamais par la conscience comme faculté spécifiquement humaine : il y arrive, comme à l'un des aspects de l'activité humaine réelle, et ce qu'il y trouve est un fait, celui d'avoir des rapports.**

    **Comme Spinoza, il n'y commence pas.** Dans L'idéologie allemande, Marx examine d'abord {amber}quatre aspects des rapports historiques originels{/amber} : 1) les hommes produisent les moyens de satisfaire leurs besoins ; 2) les premiers moyens engendrent de nouveaux besoins ; 3) les hommes se reproduisent et entrent dans des relations naturelles (la famille) ; 4) en produisant et reproduisant leur vie, ils entrent dans des rapports sociaux, nés de {violet}l'action conjuguée{/violet} d'une multiplicité d'individus (*das Zusammenwirken*). {teal}« C'est maintenant seulement, après avoir déjà examiné quatre moments, quatre aspects des rapports historiques originels, que nous trouvons que l'homme a {/teal}{teal}aussi{/teal}{teal} de la “conscience” »{/teal}.

    **Ce qu'on trouve est un fait, non une faculté.** On ne trouve pas la conscience tout de suite ; et ce qu'on trouve n'est pas la faculté de conscience, mais {coral}le fait d'avoir de la conscience{/coral}. Ce fait, on peut dire en quoi il consiste : {coral}avoir de la conscience, c'est avoir des rapports{/coral}. {teal}« Là où existe un rapport, il existe pour moi ; l'animal ne “se rapporte” à rien et ne “se rapporte” absolument pas »{/teal}, et {teal}« ma conscience, c'est mon rapport avec ce qui m'entoure »{/teal} [en allemand, *Mein Verhältnis zu meiner Umgebung ist mein Bewusstsein*].

    **Être en rapports, avoir ses rapports.** Tous les vivants sont en rapports avec le monde et avec les autres vivants. L'homme seul {violet}a ses rapports{/violet} : pour l'animal, son rapport aux autres n'existe pas en tant que rapport. Le savoir de ces rapports double chez l'homme les rapports en quoi consiste la vie. Les faits n'attestent pas une faculté de savoir, mais seulement {amber}l'existence d'un savoir des rapports en plus de l'existence des rapports eux-mêmes{/amber} ; chercher une faculté, ce serait déjà aller au-delà des faits.

    ! Dire que l'homme a de la conscience ne revient pas à lui attribuer un pouvoir que les autres vivants n'auraient pas : cela revient à dire que ses rapports existent aussi pour lui.
  points:
  - id: ideo-l4-p1
    sentence: "Chez Marx, la conscience n'est pas le point de départ : on la trouve seulement après avoir examiné ___ aspects des rapports historiques originels."
    answer: "quatre"
    alt: ["4"]
  - id: ideo-l4-p2
    sentence: "Premier aspect des rapports historiques originels : les hommes ___ les moyens de satisfaire leurs besoins."
    answer: "produisent"
    alt: []
  - id: ideo-l4-p3
