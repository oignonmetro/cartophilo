- id: ideo-l14
  title: "Ni illusion ni manipulation : une expression inadéquate, mais objective"
  notes: |-
    **Le concept marxien d'idéologie ne relève ni d'une problématique de l'illusion ni de la manipulation, mais de l'expression inadéquate et imaginaire du réel, et il engage une conception de la vérité.**

    **La thèse d'ensemble.** Marx forge un concept d'idéologie pour rendre compte de la production des idéalités comme d'un processus qui accompagne nécessairement la production matérielle des conditions de la vie réelle et se déroule en parallèle. Deux cas : lorsque la vie est {coral}limitée, bornée dans son développement{/coral}, elle s'accompagne de pensées et de représentations {violet}tronquées{/violet} ; lorsqu'elle est {coral}séparée des conditions matérielles de sa propre reproduction{/coral}, elle s'accompagne de pensées {violet}abstraites et générales{/violet}. Dans les deux cas, elles sont inadéquates.

    **Il s'agit bien de vérité.** Le chapitre du *Capital* sur le fétichisme de la marchandise le confirme. Des catégories de l'économie bourgeoise, Marx dit : {teal}« ce sont des formes de pensée qui ont une {/teal}{teal}validité sociale{/teal}{teal}, et donc une {/teal}{teal}objectivité{/teal}{teal}, pour les rapports de production de ce mode de production social historiquement déterminé qu'est la production marchande »{/teal}. Ces catégories sont donc {green}vraies, puisqu'elles ont une objectivité{/green}, et pourtant {red}idéologiques{/red}.

    **Pourquoi elles restent idéologiques.** Il serait faux de croire que ces catégories sont vraies et que seul l'usage qu'en font les économistes bourgeois est faux. Vraies et objectives, elles le sont dans la mesure où elles sont l'expression, dans l'idéalité, du processus réel de la production marchande : ce processus les confirme à chaque instant. Mais elles restent idéologiques parce que {coral}ceux qui les forment ne produisent pas en même temps l'effort critique{/coral} qui permet de comprendre le rapport de nécessité entre un processus social réel et son expression dans l'idéalité.

    **La tâche.** Il s'agit de comprendre à chaque fois {amber}en vertu de quelles causes un processus réel ne peut pas ne pas apparaître idéellement dans telles représentations et telles formes de conscience{/amber}.

    ! « Idéologique » n'est pas synonyme de « faux dans son contenu » : une catégorie peut avoir une objectivité sociale et rester idéologique, faute de comprendre la nécessité qui la produit.
