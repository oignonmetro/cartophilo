- id: ideo-l7
  title: "Le soi comme homme abstrait : tout en l'homme se répète dans l'idéalité"
  notes: |-
    **Quand Marx dit que l'homme est « de la nature du soi », il veut dire que tout aspect de l'existence humaine se répète dans l'élément du savoir, non que chaque homme posséderait un Soi comme faculté.**

    **Le passage.** À l'endroit où il s'oppose à ce que l'homme soit posé égal au soi, Marx ajoute : {teal}« le soi n'est que l'homme saisi abstraitement et engendré par abstraction »{/teal}, puis : {teal}« l'homme est de la nature du soi ; son œil, son oreille, etc., sont de la nature du soi ; chacune de ses forces essentielles a en lui la propriété de la soi-ïté »{/teal} [*Selbstheit*].

    **La première affirmation est claire.** Le soi, c'est {violet}la conscience comprise comme faculté individuelle{/violet}, à laquelle on aboutit nécessairement quand on saisit l'homme abstraitement : quand on le sépare du reste de la nature, qu'on néglige les rapports qu'il entretient avec elle et ceux que les hommes nouent entre eux.

    **La seconde est plus délicate.** Le soi, c'est la conscience, donc la connaissance ou la pensée, donc l'idéalité ; et la conscience n'est pas une faculté subjective et individuelle. Dire que l'homme est de la nature du soi ne peut alors signifier que ceci : {coral}tous les aspects de l'existence humaine se répètent dans l'élément du savoir{/coral}.

    **Les exemples de Marx.** {yellow}L'œil humain{/yellow} n'est pas seulement un œil voyant : il est toujours en même temps un œil sachant, un œil qui sait qu'il voit. {yellow}L'oreille humaine{/yellow} n'est pas seulement entendante : elle est aussi une oreille qui sait qu'elle entend. Il ne faut donc pas dire que chaque homme a un Soi, mais que {amber}chaque aspect de l'être d'un homme relève en même temps du Soi, du *Ich*, c'est-à-dire de l'idéalité{/amber} : rien dans la réalité sensible humaine qui ne se répète et ne se réaffirme dans l'idéalité, comme réalité sensible (œil, oreille, forces physiques) et comme idéalité (vue consciente, ouïe consciente, force physique consciente).

    ! La « soi-ïté » des forces essentielles n'est pas une conscience de soi réflexive ajoutée à chaque force : c'est le fait que chaque force humaine existe aussi dans l'élément du savoir.
