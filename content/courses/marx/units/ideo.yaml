- id: ideo-l6
  title: "Le redoublement : l'homme, être objectif qui se sait tel"
  notes: |-
    **L'activité vitale consciente ne soustrait pas l'homme à la nature : elle l'y enfonce davantage, puisque l'homme est un être objectif qui sait qu'il l'est, et c'est ce savoir qui redouble son activité.**

    **Deux sens d'« être objectif ».** L'expression vient de Feuerbach, mais elle change de sens. Pour {sky}Feuerbach{/sky}, les hommes sont les êtres qui prennent leur essence, leur genre, pour objet : ils prennent conscience d'eux-mêmes en prenant leur genre pour objet de leur conscience dans la religion. Pour {sky}Marx{/sky}, ils sont {coral}les êtres qui se connaissent en tant qu'êtres objectifs, c'est-à-dire comme parties de la nature{/coral}.

    **Ce qu'est la conscience pour Marx.** C'est {violet}la connaissance de soi comme objet{/violet}, ce qui ne veut pas dire se prendre soi-même pour objet, mais {amber}se connaître comme un être existant objectivement parmi d'autres dans le tout de la nature{/amber}.

    **Les hommes en rajoutent dans l'objectivité.** Avoir de l'activité vitale consciente ne signifie pas échapper à la condition générale des êtres naturels, mais au contraire {coral}en rajouter dans l'objectivité{/coral} : les hommes dépendent du reste de la nature comme tous les êtres de la nature, et {green}ils savent qu'ils en dépendent{/green}.

    **Le redoublement.** Le déploiement naturel de leur activité vitale, l'activité productive, {violet}se redouble{/violet} d'un savoir de ce déploiement, et donc d'une volonté de manifester cette activité par eux-mêmes, c'est-à-dire, en termes spinozistes, d'{amber}être la cause adéquate de leur propre activité{/amber}. L'activité humaine peut ainsi devenir ce que Marx appelle une *Selbstbetätigung*, une {violet}« autoactivation »{/violet}. Le concept central de la théorie de la conscience de 1844 est donc celui de {violet}*Verdopplung*{/violet}, de « redoublement » : le déploiement de l'activité vitale se redouble, chez les hommes, d'un déploiement de cette même activité dans {coral}l'élément du savoir, c'est-à-dire de l'idéalité{/coral}.

    ! Se connaître comme objet n'est pas se faire son propre objet de contemplation : c'est savoir qu'on est une partie de la nature, parmi d'autres.
