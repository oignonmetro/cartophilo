- id: ideo-l13
  title: "L'idéologie la mieux partagée : dominés, dominants, et la place de Marx"
  notes: |-
    **L'idéologie est la chose socialement la mieux partagée, par les dominés comme par les dominants, mais pour des raisons différentes, et personne ne se tient hors d'elle, Marx pas plus qu'un autre.**

    **Les dominés** pensent idéologiquement parce qu'ils vivent dans des conditions qui ne leur permettent pas une vie accomplie : {coral}une vie bornée, étriquée, mutilée s'accompagne d'idées imaginaires et inadéquates{/coral}. Leur impuissance est celle d'une pensée {violet}ignorante des causes{/violet}, qui accompagne une vie déterminée par autre chose qu'elle-même.

    **Les dominants** pensent aussi idéologiquement, pour d'autres raisons. Satisfaits de leurs conditions, ils devraient produire des idées adéquates, mais ils vivent {violet}séparés des tâches de la production matérielle{/violet} : ils sont portés à croire à l'existence autonome de la conscience, et à produire des pensées d'un très haut degré d'abstraction. Leur impuissance est celle d'une pensée abstraite et générale, qui ne permet aucune connaissance précise, mais qui a pour eux l'avantage d'engendrer des concepts universels {amber}fort utiles à la perpétuation de leur situation dominante{/amber}.

    **La faiblesse des dominants.** Elle est d'abord celle de leur pensée : socialement utile, mais impuissante à produire une connaissance adéquate de la réalité sociale. La critique de l'économie politique, qui soumet à la critique la « science » produite par la classe dominante, vise à {green}faire apparaître aux dominés la faiblesse de la pensée des dominants{/green}, leur impuissance à comprendre par les causes la réalité économique dont ils bénéficient.

    **Pas de position hors-idéologie.** Ni les dominants ni les dominés n'échappent à l'idéologie : il n'y a pas de point de vue de « la science » séparé de toute idéologie. Marx n'a pas prétendu l'occuper ; il a voulu l'effort possible dans un univers saturé d'idéologie : {coral}comprendre les choses par leurs causes, atteindre les rapports essentiels sous les formes de l'apparaître{/coral}. L'autre part de sa vie a servi à organiser la pratique révolutionnaire du prolétariat, la seule par laquelle celui-ci peut conquérir {amber}les conditions d'une activité par soi{/amber}, condition de la production d'idées adéquates et d'une sortie de l'idéologie.

    **Le prolétariat n'est pas la classe sans idéologie.** Marx a semblé un moment le penser, le prolétariat étant la classe qui n'a plus d'intérêt de classe particulier à faire prévaloir ; Balibar a pu dire qu'il abandonne le concept d'idéologie quand il renonce à cette idée. Elle n'est pas tenable : sa vie actuellement inaccomplie l'expose à une connaissance imaginaire de lui-même. D'où la nécessité d'une révolution du prolétariat par lui-même : {teal}« la classe qui renverse l'autre ne peut parvenir que dans une révolution à balayer toute la vieille saloperie qu'elle trimbale et à se rendre capable d'une nouvelle fondation de la société »{/teal}.

    ! Sortir de l'idéologie n'est pas une affaire de savoir seulement : c'est une affaire de pratique, puisque la production d'idées adéquates suppose des conditions de vie qui permettent une activité par soi.
