- id: ideo-l11
  title: "La vie détermine la conscience : une formule à ne pas séparer du parallélisme"
  notes: |-
    **Marx concentre ses attaques sur l'illusion de l'autonomie des idées, au point de sembler renverser le rapport de détermination ; mais la formule « la vie détermine la conscience » doit se lire avec le parallélisme qu'elle suppose.**

    **La thèse fameuse.** Marx écrit : {teal}« ce n'est pas la conscience qui détermine la vie, mais la vie qui détermine la conscience »{/teal}. Elle suit immédiatement une autre proposition : {teal}« ce sont les hommes qui, en développant leur production matérielle et leur commerce matériel, transforment, avec cette réalité qui leur est propre, également leur pensée et les produits de leur pensée »{/teal}. La transformation de la réalité humaine et celle de la pensée sont {coral}deux processus strictement concomitants{/coral}, le second n'étant pas autre chose que le premier, exprimé dans l'élément de l'idéalité.

    **Pourquoi la formule reste préférable.** À la rigueur, c'est un peu approximatif, mais il vaut mieux dire que la vie détermine la conscience plutôt que l'inverse, parce que cela permet de {amber}lutter directement contre la plus fondamentale des illusions{/amber} : celle qui voit la conscience et le développement des idées premiers et autonomes.

    **Le parallélisme confirmé.** Marx ne manque pas une occasion de rappeler que la vie matérielle et la vie idéelle se déploient en parallèle. {teal}« L'existence de pensées révolutionnaires dans une époque déterminée présuppose l'existence d'une classe révolutionnaire »{/teal} : des idées révolutionnaires signifient nécessairement une pratique révolutionnaire dans la vie matérielle et sociale. De même : {teal}« les pensées de la classe dominante sont, à chaque époque, les pensées dominantes »{/teal}, c'est-à-dire que la domination matérielle d'une classe s'accompagne de la domination de ses idées.

    **La formule la plus claire.** {teal}« Les pensées dominantes ne sont pas autre chose que {/teal}{teal}l'expression idéelle des rapports matériels dominants{/teal}{teal}, elles sont ces rapports matériels dominants saisis en tant que pensées »{/teal} [*der ideelle Ausdruck*]. Le même rapport de domination s'exprime comme domination sociale dans la pratique et, en même temps, comme domination idéelle dans la théorie : {teal}« la classe qui est la puissance matérielle dominante de la société est en même temps la puissance spirituelle dominante de cette société »{/teal}. Voir [[g-vie-materielle|Vie matérielle]].

    ! Le sens de la formule n'est pas que les idées soient un simple effet inerte : la même chose s'exprime des deux côtés, et la formule sert surtout à dénoncer l'illusion contraire.
  points:
  - id: ideo-l11-p1
