  points:
  - id: g-metabolisme-l1-q1
    sentence: "L'échange matériel continu entre l'homme et la nature, que le travail règle et dont dépend la vie humaine, Marx l'appelle le ___."
    answer: métabolisme
    alt: ["metabolisme"]
  - id: g-metabolisme-l1-q2
    sentence: "Le métabolisme, littéralement « échange de matière », se dit en allemand ___."
    answer: Stoffwechsel
    alt: []
  - id: g-metabolisme-l1-q3
    sentence: "Marx emprunte la notion de métabolisme à la chimie et à la physiologie de son temps, notamment à Justus von ___."
    answer: Liebig
    alt: []
  - id: g-metabolisme-l1-q4
    sentence: "Le travail utile est pour l'homme « une condition d'existence indépendante de toutes les formes de ___, une nécessité naturelle éternelle » (Le Capital, livre I, chap. I)."
    answer: société
    alt: ["societe"]
  - id: g-metabolisme-l1-q5
    sentence: "Le travail est la « médiation indispensable au métabolisme qui se produit entre l'homme et la nature, et donc à la ___ humaine » (Le Capital, livre I, chap. I)."
    answer: vie
    alt: []
  - id: g-metabolisme-l1-q6
    sentence: "Le travail est « un procès dans lequel l'homme règle et ___ son métabolisme avec la nature par la médiation de sa propre action » (Le Capital, livre I, chap. V)."
    answer: contrôle
    alt: ["controle"]
  - id: g-metabolisme-l1-q7
    sentence: "Dans le travail, l'homme « se présente face à la matière naturelle comme une puissance ___ lui-même » (Le Capital, livre I, chap. V)."
    answer: naturelle
    alt: []
  - id: g-metabolisme-l1-q8
    sentence: "« En agissant sur la nature extérieure et en la modifiant par ce mouvement, il modifie aussi sa propre ___ » (Le Capital, livre I, chap. V)."
    answer: nature
    alt: []
  - id: g-metabolisme-l1-q9
    sentence: "La définition du travail comme procès entre l'homme et la nature, où il règle son métabolisme, se trouve dans Le Capital, livre I, au chapitre ___."
    answer: V
    alt: ["5"]
  - id: g-metabolisme-l1-q10
    sentence: "Le procès d'échange fait passer des marchandises « de mains où elles sont non-valeurs d'usage en des mains où elles sont valeurs d'usage » : il s'agit du métabolisme ___ (Le Capital, livre I, chap. III)."
    answer: social
    alt: []
  - id: g-metabolisme-l1-q11
    sentence: "Dans la circulation, Marx distingue le métabolisme (Stoffwechsel), qui déplace des choses utiles, du changement de forme de la valeur, en allemand ___."
    answer: Formwechsel
    alt: []
  - id: g-metabolisme-l1-q12
    sentence: "La production capitaliste « perturbe d'un autre côté le métabolisme entre l'homme et la ___ » (Le Capital, livre I, chap. XIII)."
    answer: terre
    alt: []
  - id: g-metabolisme-l1-q13
    sentence: "Le métabolisme entre l'homme et la terre, c'est « le retour au ___ des composantes de celui-ci usées par l'homme sous forme de nourriture et de vêtements » (Le Capital, livre I, chap. XIII)."
    answer: sol
    alt: []
  - id: g-metabolisme-l1-q14
    sentence: "La rupture du métabolisme tient à la population entassée dans les grands centres : les déchets qui devraient retourner aux champs restent dans les ___."
    answer: villes
    alt: ["ville"]
  - id: g-metabolisme-l1-q15
    sentence: "« Tout progrès de l'agriculture capitaliste est non seulement un progrès dans l'art de piller le ___, mais aussi dans l'art de piller le sol » (Le Capital, livre I, chap. XIII)."
    answer: travailleur
    alt: []
  - id: g-metabolisme-l1-q16
    sentence: "La production capitaliste ne développe la technique « qu'en ruinant dans le même temps les sources vives de toute ___ : la terre et le travailleur » (Le Capital, livre I, chap. XIII)."
    answer: richesse
    alt: []
  - id: g-metabolisme-l1-q17
    sentence: "La production capitaliste ruine dans le même temps les sources vives de toute richesse : « la terre et le ___ » (Le Capital, livre I, chap. XIII)."
    answer: travailleur
    alt: []
  - id: g-metabolisme-l1-q18
    sentence: "En détruisant les facteurs naturels du métabolisme, la production capitaliste « oblige en même temps à instituer systématiquement celui-ci en loi ___ de la production sociale » (Le Capital, livre I, chap. XIII)."
    answer: régulatrice
    alt: ["regulatrice"]
  - id: g-metabolisme-l1-q19
    sentence: "Le métabolisme doit devenir la loi régulatrice de la production sociale « sous une forme adéquate au plein développement de l'___ » (Le Capital, livre I, chap. XIII)."
    answer: homme
    alt: []
  - id: g-metabolisme-l1-q20
    sentence: "Selon le livre III du Capital, la liberté consiste en ce que les producteurs ___ règlent de façon rationnelle leurs échanges avec la nature."
    answer: associés
    alt: ["associes"]
  - id: g-metabolisme-l1-q21
    sentence: "Contre la lecture écologiste, le remède de Marx à la rupture du métabolisme n'est pas le retour à une nature ___, mais sa régulation consciente par la société."
    answer: intacte
    alt: ["vierge"]
  - id: g-metabolisme-l1-q22
    sentence: "Les producteurs associés contrôlent ensemble leurs échanges avec la nature « au lieu d'être dominés par sa puissance ___ » (Le Capital, livre III)."
    answer: aveugle
    alt: []
  - id: g-metabolisme-l1-q23
    sentence: "Même réglé rationnellement par les producteurs associés, le métabolisme avec la nature « constituera toujours un royaume de ___ » (Le Capital, livre III)."
    answer: nécessité
    alt: ["necessite"]
  - id: g-metabolisme-l1-q24
    sentence: "« Ce qui requiert explication [...] ce n'est pas l'unité des êtres humains vivants et actifs avec les conditions naturelles, inorganiques de leur métabolisme avec la nature », mais bien leur ___ (Grundrisse)."
    answer: séparation
    alt: ["separation"]
  - id: g-metabolisme-l1-q25
    sentence: "La séparation entre les conditions inorganiques de l'existence humaine et cette existence active n'a été poussée à son extrémité que dans le rapport du travail ___ et du capital (Grundrisse)."
    answer: salarié
    alt: ["salarie"]
