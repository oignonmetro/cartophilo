  points:
  - id: g-vie-animale-l1-a0
    sentence: "__Marx accorde à l'**animal** la production__ (nids, habitations de l'abeille, du castor), mais une production ___, quand celle de l'homme est universelle."
    answer: unilatérale
    alt: ["unilaterale"]
  - id: g-vie-animale-l1-a1
    sentence: "__Pourquoi la production animale est-elle unilatérale ?__ Parce qu'elle a un seul côté, celui que fixent l'instinct et le besoin de son ___."
    answer: espèce
    alt: ["espece"]
  - id: g-vie-animale-l1-a2
    sentence: "__Marx admet une première forme instinctuelle du travail humain__, mais il l'écarte pour ne considérer que le **travail** sous une forme qui appartient ___ à l'homme."
    answer: exclusivement
    alt: []
  - id: g-vie-animale-l1-a4
    sentence: "__Pourquoi l'animal n'a-t-il pas de rapports ?__ Parce que le **langage** et la conscience n'apparaissent qu'avec la nécessité du ___ avec d'autres hommes."
    answer: commerce
    alt: []
  - id: g-vie-animale-l1-a5
    sentence: "__Les hommes commencent à se distinguer des **animaux**, non par la conscience ou la religion, mais dès qu'ils se mettent à__ ___ leurs moyens d'existence."
    answer: produire
    alt: []
  - id: g-vie-animale-l1-q4
    sentence: "__Darwin a fait l'histoire de la ___ naturelle__, c'est-à-dire de la formation des **organes** des plantes et des animaux en tant qu'instruments de production de la vie (Le Capital, livre I, chap. XIII)."
    answer: technologie
    alt: []
  - id: g-vie-animale-l1-a7
    sentence: "__Pourquoi la société bourgeoise ressemble-t-elle à un **règne animal** ?__ Parce que, sans plan, la division sociale du travail n'y reconnaît d'autre autorité que la ___."
    answer: concurrence
    alt: []
  - id: g-vie-animale-l1-c4
    sentence: "__Pourquoi cette anarchie n'est-elle pas naturelle ?__ Parce que la même **bourgeoisie** qui célèbre le plan dans l'atelier dénonce tout ___ social conscient de la production."
    answer: contrôle
    alt: ["controle"]
  - id: g-vie-animale-l1-c5
    sentence: "__Pourquoi, sous l'argent, la **nature** devient-elle propriété ?__ Parce que l'argent, « valeur universelle de toutes choses », l'a dépouillée de sa valeur ___."
    answer: originelle
    alt: []
  - id: g-vie-animale-l1-d1
    sentence: "__Ce que l'animal produit ne sert qu'à maintenir sa vie et celle de son espèce__ : c'est pourquoi Marx dit qu'il ne se produit que ___."
    answer: lui-même
    alt: ["lui meme", "lui-meme"]
  - id: g-vie-animale-l1-d2
    sentence: "__L'abeille vit en essaim, mais n'a pas de **rapports** avec les autres__ : pour Marx, ce qui fait d'un lien un rapport, c'est la ___."
    answer: conscience
    alt: []
  - id: g-vie-animale-l1-d4
    sentence: "__Pourquoi l'histoire des **organes productifs** de l'homme serait-elle plus facile à écrire que celle de Darwin ?__ Parce que, selon ___, nous avons fait l'histoire des hommes et pas celle de la nature."
    answer: Vico
    alt: ["vico"]
  - id: g-vie-animale-l1-d5
    sentence: "__La société bourgeoise **ressemble** au règne animal, elle n'en suit pas une loi__ : son anarchie tient à la production ___."
    answer: marchande
    alt: []
  - id: g-vie-animale-l1-d6
    sentence: "__Pourquoi les Anciens rangent-ils l'**animal** entre l'esclave et l'outil ?__ Parce que dans la production fondée sur l'___, tous trois sont des instruments."
    answer: esclavage
    alt: []
  - id: g-vie-animale-l1-d7
    sentence: "__Descartes croyait que la production avait changé par un changement dans la méthode de penser__ ; Marx montre que sa vision de l'**animal-machine** vient au contraire de la période ___."
    answer: manufacturière
    alt: ["manufacturiere"]
