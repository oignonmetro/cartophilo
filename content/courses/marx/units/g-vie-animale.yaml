# Entrée du glossaire de Marx (skill glossaire-marx) : notion. Citations reprises de
# NotebookLM avec leur source et vérifiées par textes.py (Manuscrits de 1844, Le
# Capital, livre I, L'Idéologie allemande, éditions sociales ; Sur la question juive
# et deux passages de L'Idéologie allemande et du Capital, Pléiade ; Fischbach pour
# les Notes sur Wagner). Angle choisi pour ne pas redire
# Activité vitale (l'animal s'identifie avec son activité vitale ; l'abeille et
# l'architecte), Être générique (la mesure de l'espèce), Besoin (le besoin immédiat),
# Corps non-organique (l'outil, organe ajouté) et Survie (la loi de population) : ce
# que Marx accorde et refuse aux animaux, la technologie naturelle, la société
# bourgeoise comme règne animal, l'animal devenu moyen de travail et propriété.

id: g-vie-animale
title: Vie animale
icon: book
color: coral
lessons:
- id: g-vie-animale-l1
  title: Vie animale
  notes: |-
    Chez Marx, la {violet}**vie animale**{/violet} est [def]. Marx {pink}ne méprise pas l'animal et ne sépare pas l'homme de la nature{/pink} : l'homme est lui-même un être naturel, {teal}« {/teal}pareillement aux animaux et aux plantes{teal} »{/teal} (*Manuscrits de 1844*, troisième manuscrit ; voir [[g-etre-naturel|être naturel]]), et {teal}« {/teal}les hommes commencent, comme tout animal, par manger, boire, etc.{teal} »{/teal} (*Notes sur Wagner*, citées par {sky}Fischbach{/sky}). Plusieurs thèses sont établies ailleurs : que l'animal s'identifie avec son activité vitale, et ce que l'abeille fait sans plan ([[g-activite-vitale|activité vitale]]) ; qu'il façonne à la mesure de son espèce ([[g-etre-generique|être générique]]) ; qu'il produit sous l'empire du besoin immédiat ([[g-besoin|besoin]]) ; qu'il vit lui aussi de la nature non-organique, et que l'outil est un organe ajouté au corps ([[g-corps-non-organique|corps non-organique]]). Ici, la question est ce que Marx accorde aux animaux et ce qu'il leur refuse, et ce que devient la vie animale entre les mains des hommes.

    __**L'**__{violet}__**animal**__{/violet} __**produit lui aussi, mais il ne produit que lui-même.**__ Marx accorde d'abord à l'animal ce qu'on lui refuse souvent : {teal}« {/teal}{teal}__Certes, l'animal aussi produit. Il se construit un nid, des habitations, comme l'abeille, le castor, la fourmi__{/teal}, etc.{teal} »{/teal} (*Manuscrits de 1844*, premier manuscrit, travail aliéné). Mais sa production est {violet}unilatérale{/violet}, celle de l'homme {violet}universelle{/violet} : l'animal {teal}« {/teal}produit seulement ce dont il a immédiatement besoin pour lui ou pour son petit ; {teal}__il produit d'une façon unilatérale, tandis que l'homme produit d'une façon universelle__ »{/teal} (*ibid*.). Unilatérale veut dire : d'un seul côté, celui que fixent l'instinct et le besoin de son espèce ; le castor ne fera jamais que des barrages. Donc {teal}« {/teal}{teal}__l'animal ne se produit que lui-même, tandis que l'homme reproduit toute la nature__ »{/teal} (*ibid*.) : ce que fait l'animal sert à maintenir sa propre vie et celle de son espèce, alors que l'homme fait de n'importe quelle partie de la nature l'objet de son travail (voir être générique). Marx ne tient pas pour autant cette différence pour donnée d'emblée : celui qui vend aujourd'hui sa force de travail {teal}« {/teal}a laissé derrière lui dans un passé archaïque {teal}__l'époque où le travail humain n'avait pas encore dépouillé sa première forme instinctuelle__ »{/teal} (*Le Capital*, livre I, chap. V). Il écarte aussitôt cette forme pour ne considérer que {teal}« {/teal}le travail sous une forme qui appartient exclusivement à l'homme{teal} »{/teal} (*ibid*.), celle de l'architecte qui a construit la cellule dans sa tête (voir [[g-activite-vitale|activité vitale]]). {coral}La différence entre l'animal et l'homme s'est faite avec le travail ; une fois faite, elle est réelle.{/coral}

    __**L'animal vit avec d'autres, mais il n'est**__ {violet}__**en rapport**__{/violet} __**avec rien.**__ L'abeille vit en essaim, le mouton en troupeau ; pourtant, {teal}« {/teal}{teal}__l'animal n'est en rapport avec rien__{/teal}, ne connaît somme toute aucun rapport. Pour l'animal, ses rapports avec les autres n'existent pas en tant que rapports{teal} »{/teal} (*L'Idéologie allemande*, I). Car avoir un rapport, ce n'est pas seulement être lié à d'autres : c'est que ce lien existe pour soi, consciemment, {teal}« {/teal}{teal}__là où existe un rapport, il existe pour moi__ »{/teal} (*ibid*.). Or cette conscience ne vient pas d'abord, elle naît du {violet}commerce{/violet} au sens large de *L'Idéologie allemande* (*Verkehr*), c'est-à-dire des relations que les hommes ont entre eux : {teal}« {/teal}le langage est la conscience réelle, pratique [...] et, tout comme la conscience, {teal}__le langage n'apparaît qu'avec le besoin, la nécessité du commerce avec d'autres hommes__ »{/teal} (*ibid*.). L'échange des produits n'est qu'une part de ce commerce, mais elle montre ce qui manque à l'animal ; {sky}Smith{/sky}, que Marx cite dans le troisième manuscrit de 1844, le remarque : comme les animaux {teal}« {/teal}ne peuvent pas échanger{teal} »{/teal}, {teal}« {/teal}les animaux ne peuvent pas additionner les qualités différentes de leur espèce{teal} »{/teal}, alors que chez l'homme les talents les plus disparates servent les uns aux autres, parce qu'ils peuvent rassembler leurs produits en une masse commune (*Manuscrits de 1844*, troisième manuscrit, besoins). Mais ces relations entre les hommes dépendent elles-mêmes de leur manière de produire : {teal}« {/teal}{teal}__un mode de production ou un stade industriel déterminés sont constamment liés à un mode de coopération ou à un stade social déterminés__{/teal}{teal} »{/teal} (*L'Idéologie allemande*, I). C'est pourquoi la différence première tient à la production, non à une conscience qui viendrait d'ailleurs : {teal}« {/teal}on peut distinguer les hommes des animaux par la conscience, par la religion ou par tout ce que l'on voudra. Eux-mêmes {teal}__commencent à se distinguer des animaux dès qu'ils se mettent à produire leurs moyens d'existence__ »{/teal} (*L'Idéologie allemande*, I, traduction de la Pléiade). {amber}L'animal vit des liens qu'il n'a pas ; l'homme a des rapports parce qu'il produit avec d'autres et entre en commerce avec eux.{/amber}

    __**Les organes de l'animal sont une**__ {violet}__**technologie naturelle**__{/violet}__**, dont Darwin fait l'histoire.**__ L'animal a lui aussi des instruments : ses organes. Marx salue {sky}Darwin{/sky} de l'avoir vu : {teal}« {/teal}Darwin a attiré l'attention sur l'histoire de la technologie naturelle, c'est-à-dire {teal}__sur la formation des organes des plantes et des animaux en tant qu'instruments de production de la vie__{/teal} des plantes et des animaux{teal} »{/teal} (*Le Capital*, livre I, chap. XIII, note). La griffe, le bec, la trompe sont des outils que l'espèce a reçus de son évolution. L'homme, lui, ajoute à ses organes des choses extérieures, dont il fait des organes de son activité (voir corps non-organique) ; les moyens de travail, {teal}« {/teal}{teal}__bien qu'ils soient déjà en germe le propre de certaines espèces animales__{/teal}, caractérisent spécifiquement le procès de travail humain, ce qui amène {sky}Franklin{/sky} à définir l'homme comme "a toolmaking animal", un animal qui fabrique des outils{teal} »{/teal} (*Le Capital*, livre I, chap. V). Et Marx tire de Darwin une tâche : {teal}« {/teal}l'histoire de la formation des organes productifs de l'homme social, de la base matérielle de toute organisation particulière de la société, ne mérite-t-elle pas la même attention et ne serait-elle pas plus facile à exposer puisque, comme le dit {sky}Vico{/sky}, {teal}__l'histoire des hommes se distingue de l'histoire de la nature en ce que nous avons fait l'une et pas l'autre__ »{/teal} (*Le Capital*, livre I, chap. XIII, note). Les organes de l'animal, l'espèce les a reçus d'une histoire que personne n'a faite ; ceux de l'homme, la société les a produits. {coral}L'animal a une histoire naturelle de ses organes ; l'homme, une histoire de ses organes productifs qu'il a faite lui-même, et qui est sociale.{/coral}

    __**La société bourgeoise ressemble au**__ {red}__**règne animal**__{/red}__**, mais elle n'obéit pas à une loi de la vie animale.**__ Dans l'atelier, le capitaliste divise le travail selon un plan, d'avance ; dans la société, des producteurs indépendants ne sont reliés que par l'échange, et l'équilibre entre les branches ne se rétablit qu'après coup, par les crises et les variations de prix : la règle {teal}« {/teal}respectée a priori et de façon planifiée dans la division du travail au sein de l'atelier, {teal}__ne fonctionne, dans la division du travail au sein de la société, qu'a posteriori__{/teal}, comme une nécessité naturelle interne, muette{teal} »{/teal} (*Le Capital*, livre I, chap. XII, 4). D'où la comparaison : la division sociale du travail {teal}« {/teal}met face à face des producteurs de marchandises indépendants, {teal}__qui ne reconnaissent d'autre autorité que celle de la concurrence__{/teal} [...], de la même manière que {teal}__dans le monde animal la "guerre de tous contre tous" maintient plus ou moins en vie les conditions d'existence de toutes les espèces__ »{/teal} (*ibid*.). {red}Une société sans plan vit comme un règne animal.{/red} Mais ce n'est qu'une ressemblance, car cette anarchie n'est pas dans la nature des choses : elle tient à la production marchande, et la même bourgeoisie qui célèbre le plan dans l'atelier {teal}« {/teal}dénonce tout aussi fortement le moindre contrôle social conscient et la moindre régulation du procès social de production{teal} »{/teal} (*ibid*.). Ce qu'on organise dans l'atelier pourrait donc l'être dans la société. De même, la misère n'obéit pas à une loi naturelle de population : {teal}« {/teal}chaque mode de production historique particulier a effectivement ses lois de populations particulières [...]. {teal}__Il n'y a de loi de population abstraite que pour les plantes et les animaux__{/teal}, et encore, pour autant que l'homme n'intervienne pas historiquement{teal} »{/teal} (*ibid*., chap. XXIII ; voir [[g-survie|survie]]).

    __**Dans l'histoire humaine, l'animal devient**__ {violet}__**moyen de travail**__{/violet} __**et**__ {red}__**propriété**__{/red}__**.**__ L'animal entre dans l'histoire humaine comme instrument : {teal}« {/teal}À côté de la pierre, du bois, de l'os et des coquillages travaillés, c'est {teal}__l'animal domestiqué, donc déjà transformé par le travail, sélectionné__{/teal}, qui joue le rôle de principal moyen de travail{teal} »{/teal} (*Le Capital*, livre I, chap. V). Ce qu'on croit naturel est déjà un produit : les animaux et les plantes sont {teal}« {/teal}{teal}__les produits d'une transformation poursuivie à travers de nombreuses générations__{/teal}, sous le contrôle de l'homme et grâce à la médiation du travail humain{teal} »{/teal} (*ibid*.). La manière de penser l'animal suit alors la manière de produire, car {teal}« {/teal}{teal}__la technologie révèle le comportement actif de l'homme envers la nature, le procès immédiat de production de sa vie__, donc aussi des conditions sociales de son existence et des conceptions intellectuelles qui en découlent »{/teal} (*Le Capital*, livre I, chap. XIII, note). Dans la production fondée sur l'esclavage, le travailleur est lui-même un instrument : les Anciens le distinguent seulement, comme instrument parlant (*instrumentum vocale*), de l'animal, instrument à demi parlant (*semi-vocale*), et de l'outil, instrument muet (*ibid*., chap. V, note, traduction de la Pléiade) ; l'animal se range entre l'esclave et l'outil parce que tous trois sont des moyens de production. De même, {sky}Descartes{/sky}, {teal}« {/teal}{teal}__avec sa définition des animaux comme simples machines, voit les choses avec les yeux de la période manufacturière__{/teal}, par opposition au Moyen Âge, où l'animal passait pour l'auxiliaire de l'homme{teal} »{/teal} (*ibid*., chap. XIII, note) ; Marx retourne ainsi Descartes, qui croyait que le changement de la production et la domination de la nature résultaient {teal}« {/teal}d'un changement dans la méthode de penser{teal} »{/teal} (*ibid*.). Sous la propriété privée et l'argent, enfin, et non sous l'homme comme tel, l'animal devient propriété. Car l'argent est la mesure commune de tout : {teal}« {/teal}{teal}__L'argent est la valeur universelle de toutes choses__{/teal}, constituée pour soi-même. C'est pourquoi {teal}__il a dépouillé le monde entier, le monde des hommes ainsi que la nature, de leur valeur originelle__ »{/teal} (*Sur la question juive*, II) : la valeur propre de chaque être, ce qu'il est et ce à quoi il sert, cède devant une seule mesure, le prix. Propriété privée et argent vont ensemble, et Marx les nomme d'un même trait : {teal}« {/teal}l'idée qu'on se fait de la nature, sous le règne de la propriété privée et de l'argent, c'est {teal}__le mépris réel, l'avilissement pratique de la nature__ »{/teal}, et Marx reprend l'indignation de {sky}Thomas Münzer{/sky}, qui trouve intolérable {teal}« {/teal}que toute créature ait été proclamée propriété, les poissons dans l'eau, les oiseaux dans l'air, les plantes sur la terre : {teal}__il faut que la créature devienne, elle aussi, libre__ »{/teal} (*ibid*.).

    ! Marx ne méprise pas la vie animale : il reconnaît que l'animal produit et a des instruments en germe, et l'homme reste un animal qui doit manger, boire et se loger.

    ! Marx admet que le travail humain a eu une première forme instinctuelle, mais il n'en tire pas une continuité entre l'animal et l'homme : il l'écarte, pour n'étudier que le travail sous une forme qui appartient exclusivement à l'homme.

    ! Quand Marx compare la société bourgeoise au règne animal, il ne dit pas qu'elle obéit à des lois naturelles : il dit qu'une société sans plan ressemble à un règne animal, alors que son anarchie tient à la production marchande.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | *Manuscrits de 1844*, premier manuscrit, travail aliéné | l'animal produit aussi, mais de façon unilatérale, et ne se produit que lui-même |
    | *Manuscrits de 1844*, troisième manuscrit, besoins | les animaux ne peuvent pas additionner les qualités de leur espèce |
    | *Sur la question juive*, II | l'argent dépouille la nature de sa valeur ; toute créature proclamée propriété |
    | *L'Idéologie allemande*, I | l'animal n'est en rapport avec rien ; le langage né du commerce avec d'autres hommes |
    | *Le Capital*, livre I, chap. V | les moyens de travail en germe chez l'animal ; l'animal domestiqué, produit du travail |
    | *Le Capital*, livre I, chap. XII et XIII | la concurrence comme guerre de tous contre tous du monde animal ; Darwin et la technologie naturelle ; Descartes et l'animal-machine |

    **Voir aussi** : [[g-activite-vitale|Activité vitale]] · [[g-etre-generique|Être générique]] · [[g-etre-naturel|Être naturel]] · [[g-corps-non-organique|Corps non-organique]] · [[g-survie|Survie]] · [[g-milieu|Milieu]]
