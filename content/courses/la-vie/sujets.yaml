# Liste des sujets de la piste Sujets de La vie (voir `subjectGroupSchema`),
# rangés par type d'intitulé. Un sujet traité s'écrit `{ title: …, unit: … }`,
# l'unité étant rangée dans les units de la piste.

- group: "Questions fermées"
  note: "Appellent une réponse qui tranche ; la question fermée cache souvent une question ouverte, à expliciter d'abord."
  subjects:
    - "Peut-on définir la vie ?"
    - "Vie et matière : une distinction périmée ?"
    - "La vie est-elle une notion métaphysique ?"
    - "La biologie étudie-t-elle la vie ou les êtres vivants ?"
    - "Les sciences de la vie visent-elles un objet irréductible à la matière ?"
    - "Comment justifier l'autonomie des sciences de la vie ?"
    - "La biologie doit-elle nécessairement récuser la notion d'élan vital ?"
    - "Une philosophie de la vie a-t-elle un monde propre ?"
    - "Un organisme n'est-il qu'un objet ?"
    - "Peut-on justifier le recours à l'idée de finalité ?"
    - "Peut-on se passer de l'idée de finalité dans les sciences du vivant ?"
    - "La biologie peut-elle se passer de causes finales ?"
    - "Le monde de l'animal nous est-il étranger ?"
    - "L'animal peut-il être un sujet moral ?"
    - "Les animaux sont-ils nos amis ?"
    - "Avons-nous des devoirs envers les animaux ?"
    - "Y a-t-il des espèces naturelles ?"
    - "La nature a-t-elle une histoire ?"
    - "Une machine peut-elle être naturelle ?"
    - "L'intelligence peut-elle être artificielle ?"
    - "Faut-il redouter les machines ?"
    - "La technique nous prive-t-elle du monde ?"
    - "Le progrès technique nous rend-il moins humain ?"
    - "Faut-il imposer des limites à l'expérimentation sur le vivant ?"
    - "Peut-on penser la mort ?"
    - "La mort fait-elle partie de la vie ?"
    - "La mort donne-t-elle un sens à l'existence ?"
    - "Peut-on apprendre à mourir ?"
    - "Peut-on apprivoiser la mort ?"
    - "La mort est-elle un problème philosophique ?"
    - "La mort est-elle concevable ?"
    - "Faut-il ne pas craindre la mort pour être heureux ?"
    - "Faut-il vivre comme si l'on ne devait jamais mourir ?"
    - "La vie peut-elle être éternelle ?"
    - "Peut-on définir la santé ?"
    - "La vertu est-elle une forme de santé ?"
    - "Peut-on parler d'une santé de l'âme ?"
    - "Y a-t-il des normes de la vie ?"
    - "Que peuvent partager le philosophe et le médecin ?"
    - "La souffrance a-t-elle quelque chose à nous apprendre ?"
    - "Ne plus souffrir est-il un idéal ?"
    - "L'existence est-elle pensable ?"
    - "Exister, est-ce simplement vivre ?"
    - "Y a-t-il une vie de l'esprit ?"
    - "La vie est-elle un songe ?"
    - "Peut-on recommencer sa vie ?"
    - "Choisit-on ce que l'on vit ?"
    - "Un corps n'est-il qu'un objet ?"
    - "Notre corps pense-t-il ?"
    - "Suis-je mon corps ?"
    - "Choisit-on son corps ?"
    - "Penser requiert-il un corps ?"
    - "La vie est-elle une valeur ?"
    - "La vie est-elle le bien suprême ?"
    - "La vie est-elle la valeur suprême ?"
    - "Le fait de vivre est-il un bien en soi ?"
    - "La vie suffit-elle à créer des valeurs ?"
    - "Faut-il aimer la vie ?"
    - "Y a-t-il des raisons de vivre ?"
    - "L'existence a-t-elle un sens ?"
    - "Faut-il vivre conformément à la nature ?"
    - "Vivons-nous pour être heureux ?"
    - "Qu'est-ce qu'une vie réussie ?"
    - "Pourrait-on vivre sans idéal ?"
    - "Peut-on vivre sans valeurs ?"
    - "La morale est-elle un art de vivre ?"
    - "La morale est-elle l'ennemie de la vie ?"
    - "Philosopher, est-ce apprendre à vivre ?"
    - "Peut-on apprendre à vivre ?"
    - "L'art de vivre est-il un art ?"
    - "Mon corps m'appartient-il ?"
    - "Mon corps est-il ma propriété ?"
    - "Est-on propriétaire de son corps ?"
    - "Peut-on disposer de son corps ?"
    - "Le vivant est-il l'affaire du politique ?"
    - "Avons-nous des devoirs envers le vivant ?"
    - "Peut-on dire que la vie imite l'art ?"

- group: "Questions ouvertes"
  note: "Appellent une élaboration conceptuelle par distinctions successives, sans céder à la paraphrase."
