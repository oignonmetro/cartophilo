- id: jonas2-l4
  title: "La dimension globale"
  notes: |-
    Avec le génie génétique, l'application inévitable rejoint la thèse du texte : la **dimension globale dans l'espace et le temps** des effets de la technique.

    **Les conséquences sont déjà dans le travail.** Dès l'abord du travail scientifique, ses conséquences les plus graves sont virtuellement contenues. Jonas le montre dans l'article {sky}« Microbes, gamètes et zygotes : informations supplémentaires sur le nouveau rôle de créateur de l'homme »{/sky}, sur la manipulation génétique : {teal}« on introduit là dans le paysage de la vie, d'un coup et dès la première étape, dans l'ensemble des chromosomes d'une cellule reproductive, toute une descendance d'organismes modifiés, enrichis d'une nouvelle propriété »{/teal}. Modifier l'information génétique d'une **cellule reproductive**, c'est créer d'un coup une {red}lignée héréditaire inédite{/red} : l'acte ponctuel engage toute une descendance.

    **Une éthique nouvelle.** La dimension globale conduit à une nouveauté éthique et à une catégorie originale, la **responsabilité**, qui redéfinit l'éthique. Cette éthique se manifeste par la **régulation du pouvoir de l'homme**, de son développement technique incessant, et des conditions de vie à préserver contre leur dévoiement progressif. Elle ne consiste {red}pas seulement à répondre de nos actes proches{/red} et des infractions qu'ils constituent, mais à garder à l'esprit {green}une plus vaste responsabilité{/green}, qui gouverne nos choix en vue de la **préservation de la vie** au nom de l'humanité et des générations à venir, auxquelles nous devons accorder les mêmes chances.

    **D'où une thèse :** la bioéthique se confondrait avec ce souci de la responsabilité, qui fournit le cadre même où il est possible de la penser.

    ! Le nouveau rôle de l'homme est celui de « créateur » : il ne modifie plus un individu, mais une descendance.
