# Cours sur Jonas, suite (voir l'en-tête de jonas1.yaml) : les points par
# lesquels Jonas, dans « En quel sens la technique moderne est un objet pour
# l'éthique », fait de la technique un objet pour l'éthique (Bies, p. 458-464).
# Bies annonce « cinq points essentiels » sans les numéroter tous : il nomme le
# premier (ambivalence des effets) et le deuxième (caractère inévitable de
# l'application), puis la dimension globale, la rupture avec
# l'anthropocentrisme (jonas3) et, « enfin », la question métaphysique.
#
# Citations datées par Bies sans titre d'œuvre : [Jonas, 2005, p. 90] et
# [1990, p. 83] (vraisemblablement Le Principe responsabilité, Cerf, 1990) ;
# l'œuvre n'est pas nommée dans les cartes.

id: jonas2
title: "La technique moderne, objet pour l'éthique"
subtitle: "Ambivalence des effets, application inévitable, dimension globale : la responsabilité à la mesure du pouvoir"
icon: compass
color: green
group: "Jonas : la responsabilité face au vivant"
lessons:
- id: jonas2-l1
  title: "L'ambivalence des effets"
  notes: |-
    Dans l'article dont le texte est extrait, Jonas souligne **cinq points** qui font de la technique moderne un objet pour l'éthique. Le premier est {violet}l'ambivalence des effets{/violet} : il ruine le partage traditionnel entre bon et mauvais usage.

    **La conception traditionnelle.** Une chose est bonne, et ne devient mauvaise qu'en raison d'un {red}emploi abusif{/red} : le couteau sert à couper le pain, le meurtrier en abuse. Le mal est dans l'intention, et il suffit de vouloir le bien pour bien faire.

    **La technique moderne.** On a affaire, dit Jonas, à {teal}« un rapport à l'acte où chaque usage à grande échelle d'une aptitude, fût-il même entrepris dans une bonne intention, provoque des effets en fin de compte négatifs, qui s'accumulent et sont inséparables des effets visés les plus manifestement "bons", peut-être au point de les surpasser de beaucoup »{/teal}. Exemple familier : un engrais nourrit des millions d'hommes et, à la même échelle et du même geste, épuise les sols ; on ne peut pas garder l'un en retirant l'autre.

    **D'où trois conséquences.**
    - Le partage du bien et du mal selon {red}l'intention à l'origine d'une innovation{/red} ne tient plus : la meilleure volonté ne prémunit pas contre des conséquences négatives, produites par un simple **effet quantitatif**.
    - Les « bonnes techniques » peuvent se révéler mauvaises **à long terme**, ce dont on ne peut se rendre compte immédiatement : la recherche met en place des dispositifs dont elle ignore le terme ultime, qui peuvent contredire ses ambitions de départ.
    - Les catastrophes possibles ne sont plus circonscrites à un événement localisable dans l'espace ou le temps : elles affectent **l'intégralité de la nature et de l'environnement** (la question écologique) ou **de la nature humaine** (la médecine et la génétique).

    **Le paradoxe de la technique.** C'est la {green}volonté du bien{/green}, ou du moins de l'utile, qui porte en réalité les {red}germes du nuisible{/red} ; et ces germes ne peuvent être entièrement enrayés, puisque ce sont des **besoins humains** qui motivent le progrès.

    ! L'ambivalence ne vient pas d'un mauvais usage : elle se produit dans l'usage le mieux intentionné, du seul fait de l'échelle.
