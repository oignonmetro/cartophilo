- id: jonas2-l5
  title: "Responsabilité et pouvoir"
  notes: |-
    La dernière phrase du texte posait que la responsabilité croît avec le pouvoir. Jonas en fait un rapport **de proportion** et un **fondement** : c'est parce que l'homme peut qu'il doit.

    **Le revers du pouvoir.** Responsabilité et pouvoir sont {coral}le revers l'un de l'autre{/coral} : plus notre pouvoir est grand (et il est devenu considérable avec l'accélération du progrès au XXe siècle), plus la responsabilité qu'il implique est grande. D'où : {teal}« le simple exercice quotidien de notre pouvoir, qui constitue la routine de la civilisation moderne, et dont nous vivons tous, devient un problème éthique »{/teal}.

    **Le savoir en retard sur la puissance.** L'augmentation de la puissance va avec un progrès du savoir qui améliore la portée de la **préscience**, sans permettre une connaissance parfaite de l'avenir. Or la préscience est toujours {red}en retard sur le rayon d'action de la puissance{/red} : il reste toujours un {red}excédent d'imprévisible{/red}, d'autant plus grand que la puissance est considérable.

    **Une dette envers ceux qui n'existent pas.** L'{violet}équité{/violet} du texte prépare la responsabilité : agir comme si nous étions **liés par une dette** envers notre descendance, sans compromettre la possibilité d'existence d'une humanité qui nous sera postérieure. Obligation {red}paradoxale{/red} : elle est contractée envers un acteur **qui n'existe pas encore**, qui ne peut exercer sur nous aucune contrainte, et dont nous pourrions donc nous affranchir. La responsabilité n'est plus de répondre d'un acte précis, déterminé dans l'espace et le temps, mais un {green}engagement global{/green} qui ne se relie pas à l'immédiateté de l'action.

    **Élargir le champ des conséquences.** Je peux me soucier des conséquences de mes actes sur mon entourage ; je peux aussi les considérer **au regard des générations futures** : la société industrielle qui exploite les ressources de la planète pourrait mettre en péril la nature qui assure nos conditions d'existence. Jamais aucune époque n'a disposé d'une telle *puissance*, donc d'une telle *responsabilité*, qui ne peut s'exercer sans un *savoir*.

    **Le fondement : pouvoir, c'est devoir.** {teal}« L'homme est le seul être connu de nous qui puisse avoir une responsabilité. En pouvant l'avoir, il l'a. »{/teal} {teal}« Le pouvoir même entraîne avec lui le devoir. »{/teal} La capacité de responsabilité, {violet}d'ordre éthique{/violet}, repose sur une faculté {violet}d'ordre ontologique{/violet} : celle de {teal}« choisir, sciemment et délibérément, entre des alternatives de l'action »{/teal}. La responsabilité est donc {coral}complémentaire de la liberté{/coral} : c'est {teal}« le fardeau de la liberté propre à un sujet actif »{/teal}. Elle ne dépend d'aucun juge : je suis responsable de mon acte (et de mon omission), {teal}« et peu importe en l'occurrence qu'il y ait là quelqu'un pour me demander d'en répondre »{/teal} ; elle existe {teal}« avec ou sans Dieu, et à plus forte raison, naturellement, avec ou sans tribunal terrestre »{/teal}.

    ! « En pouvant l'avoir, il l'a » : la responsabilité n'est pas d'abord un sentiment ni une convention ; elle découle de ce que l'homme est, un être capable de choisir.
