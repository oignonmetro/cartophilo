- id: jonas2-l2
  title: "La fin de la neutralité éthique"
  notes: |-
    Si les meilleures intentions produisent des maux, la science ne peut plus se dire **neutre** : c'est la conséquence que Jonas tire de l'ambivalence des effets.

    **Plus de neutralité.** {teal}« On refuse à la technique l'espace de liberté de la neutralité éthique, où l'on doit seulement se soucier d'efficacité. »{/teal} La neutralité du savoir n'est qu'une {red}illusion{/red}, ou une naïveté : celle d'une connaissance volontairement ignorante de ses conséquences. Le scientifique doit en avoir conscience **dès l'abord de son travail**, sans se contenter du déni, et assumer la responsabilité qui incombe à sa position. Jonas consacre un article du recueil à la question : {sky}« L'indifférence aux valeurs de la science et la responsabilité : l'autocensure de la recherche ? »{/sky}, où il refuse à la science et à la technique {teal}« le lieu d'asile de la neutralité éthique »{/teal}.

    **L'exemple de l'atome.** Des travaux qui ne visaient qu'à atteindre la vérité ont contribué, par l'application qu'ils ont rendue possible, aux pires atrocités : la recherche sur la {red}fission de l'atome{/red}, qui libère une quantité phénoménale d'énergie, a servi à fabriquer l'**arme atomique**. Leçon : la nature des travaux ne définit pas à l'avance l'emploi qui en sera fait, et cet emploi n'est pas limité par le cadre des travaux scientifiques.

    **Des technosciences.** Autrefois la technique dérivait de la science comme l'une de ses expressions ; elle s'en affranchit et s'empare même de la science dans une perspective qui lui est propre. C'est l'avènement, au {sky}XXe siècle{/sky}, des {violet}technosciences{/violet} : la science n'y procède plus de la seule exigence de vérité, mais voit son orientation déterminée par des **buts techniques** ou par sa **rentabilité économique**.

    **Juger par les conséquences, et ensemble.** Puisque les effets sont ambivalents, on ne peut juger la science et la technique selon l'intention de leur auteur, mais {green}selon leurs conséquences possibles{/green}. Cela met en question le **monopole du monde scientifique** et justifie l'existence de {violet}comités d'éthique{/violet}, chargés d'une décision élaborée collectivement : des commissions où siègent des **profanes** de tous les domaines de la vie, échantillon représentatif de la société, puisque les conséquences dépassent les compétences strictement scientifiques et que chacun doit pouvoir se prononcer sur son propre destin.

    ! Refuser la neutralité éthique ne revient pas à accuser les savants d'intentions mauvaises : c'est dire qu'une bonne intention ne suffit plus à décharger de la responsabilité.
