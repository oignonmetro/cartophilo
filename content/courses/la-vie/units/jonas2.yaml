- id: jonas2-l3
  title: "L'application inévitable"
  notes: |-
    Le deuxième point de Jonas est le {violet}caractère inévitable de l'application{/violet} : ce qui peut techniquement se faire se fera.

    **Pour un savoir ordinaire, pouvoir n'est pas faire.** La possession d'une aptitude n'implique pas son utilisation : son emploi peut être suspendu en attendant le moment opportun. {yellow}Celui qui maîtrise plusieurs langues peut rester muet{/yellow} ; chaque savoir peut se réserver la possibilité de son application. Ce rapport vaut {red}« entre le pouvoir et l'agir, le savoir et l'application, la possession et l'exercice d'un pouvoir »{/red}.

    **Pour la technique, c'est autre chose.** Nos sociétés sont fondées sur {teal}« l'actualisation incessante de son potentiel technique »{/teal}. Le bon rapport n'est donc {red}pas celui qui relie la capacité de parler à l'expression effective du discours{/red} (on peut se taire), mais {green}la capacité associée à la nécessité de respirer{/green} (on ne peut pas s'en abstenir). Chaque nouvelle possibilité passe à l'acte, d'abord à petite échelle, puis selon des dimensions toujours plus grandes, jusqu'à s'imposer comme un {teal}« besoin vital durable »{/teal}.

    **Deux lois l'illustrent.**
    - La **loi de Gabor** : {teal}« tout ce qui est possible sera nécessairement réalisé »{/teal}, une sorte de fatalité du progrès, dont certaines inventions irréversibles nous rendent responsables d'un destin qui nous échappe.
    - La **loi de Moore**, sur les « puces » : leur capacité double tous les ans, selon un **rythme exponentiel**, qui exprime le progrès scientifique lui-même et les développements liés aux NBIC.

    **Un exemple : le Projet Génome Humain**, lancé en {sky}1990{/sky}, alors que dix ans plus tôt les généticiens s'accordaient à dire qu'on ne pourrait jamais séquencer tout notre ADN. Les plus optimistes prévoyaient 15 ans, les sceptiques 3 à 5 siècles. Avec 3 milliards de dollars et des milliers d'experts, il aboutit dès {sky}2000{/sky} à une version ébauchée, non brevetée, puis en {sky}2003{/sky} à une version définitive qui détaille les quelque **vingt-cinq mille gènes** de l'ADN. Le coût du séquençage, de plus d'un million et demi de dollars en 2007, tombe à environ **1 000 dollars** en 2013 : divisé **par un million** en dix ans, ce qui démocratise la technomédecine.

    ! Le caractère inévitable de l'application n'est pas une loi de la nature : il tient à des sociétés qui vivent de l'actualisation de leur potentiel technique, d'où l'urgence d'une éthique qui la limite.
