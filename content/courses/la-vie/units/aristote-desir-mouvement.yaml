- id: aristote-desir-mouvement-i3
  title: "La nature et le changement"
  notes: |-
    La *Physique* définit la **nature** comme « un certain principe, à savoir une cause du
    fait d'être mû et d'être en repos pour ce à quoi elle appartient immédiatement par soi
    et non par accident » (*Phys.* II, 1, 192b20) : le principe de changement inhérent à
    une chose, qui guide son devenir vers sa fin. Elle est à la fois cause formelle et
    cause finale.

    Tout changement se fait « de quelque chose vers quelque chose » et se dénomme par sa
    fin. Dans tout ce qui naît et meurt, il en existe quatre espèces.

    | Espèce                  | Catégorie | Bucéphale                              |
    | Génération, corruption  | substance | naître cheval, devenir cadavre         |
    | Changement qualitatif   | qualité   | passer d'un blanc clair à un gris foncé |
    | Changement quantitatif  | quantité  | croître                                |
    | Changement local        | lieu      | traverser au galop un champ de bataille |

    Les trois changements accidentels s'opèrent entre des termes contraires d'un même
    genre (le blanc et le gris, deux couleurs) : Bucéphale reste « la même chose ». La
    génération et la corruption, seules à toucher la substance, s'opèrent entre termes
    contradictoires : le cadavre d'un cheval n'est plus un cheval, sinon par homonymie.

    Le mouvement local est donc un changement accidentel selon le lieu. Les corps
    inanimés ont un lieu naturel (le feu et l'air en haut, l'eau et la terre en bas) ; est
    violent le changement qu'un principe extérieur impose contre cette tendance. Le vivant,
    lui, a en lui le principe de son changement : l'animal qui se déplace mû par une fin
    qu'il se représente accomplit un mouvement naturel, non contraint.

    ! Contraires et contradictoires ne se confondent pas : les premiers appartiennent au
    même genre (deux couleurs), les seconds s'excluent entièrement (cheval, non-cheval).
