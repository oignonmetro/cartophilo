    text: "Mais ce n'est même pas l'appétit qui décide souverainement de ce mouvement, car les gens maîtres d'eux-mêmes, malgré leur appétit et leur désir, n'accomplissent pas les actions dont ils ont l'appétit, mais obéissent à l'intelligence ! Cependant il est au moins manifeste qu'il y a là deux principes qui, alternativement, sont à l'origine du mouvement : l'appétit et l'intelligence, si l'on veut bien poser la représentation comme une sorte d'intellection. Car bien des démarches qui dérogent à la science obéissent aux ordres de la représentation et, chez les autres animaux, il n'est pas question d'intellection, ni de raisonnement, mais de représentation. Ce sont donc là ensemble les deux principes de nature à imprimer le mouvement local : l'intelligence et l'appétit."
