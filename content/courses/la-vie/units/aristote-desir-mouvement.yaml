- id: aristote-desir-mouvement-p3
  title: "Deux principes qui alternent"
  notes: |-
    Symétriquement, l'appétit seul ne décide pas non plus souverainement du mouvement :
    les gens maîtres d'eux-mêmes n'accomplissent pas toujours ce dont ils ont l'appétit,
    mais obéissent à l'intelligence. Conclusion : deux principes, alternativement, sont à
    l'origine du mouvement local, l'**appétit** et l'**intelligence**.

    Ce texte, qui pouvait sembler s'achever sur une aporie (ni l'intelligence ni le désir,
    pris séparément, ne suffisent), trouve en réalité sa réponse dès sa troisième ligne :
    les deux causes agissent de concert. Pour que la conclusion tienne, il faut « poser la
    représentation comme une sorte d'intellection », ce qui permet d'inclure, sous le même
    terme d'intelligence pris au sens large, la simple représentation sensible que
    possèdent aussi les animaux non humains, chez qui il n'est jamais question
    d'intellection ni de raisonnement, mais seulement de représentation.

    Le principe du mouvement humain est donc, comme celui du mouvement animal en général,
    d'une nature doublement duelle : du côté de la représentation, l'homme possède, comme
    les autres animaux, la faculté représentative, mais aussi l'intelligence ; du côté de
    l'appétit, celui-ci se divise en trois espèces, dont deux, l'ardeur et le souhait, sont
    susceptibles d'obéir au jugement de la raison.

    ! Ne pas lire cette conclusion comme un aveu d'échec : le texte ne s'achève pas sur une
    aporie, mais sur l'affirmation que deux causes agissent de concert, exactement ce
    qu'annonçaient ses toutes premières lignes.
  passage:
    label: "Fragment 3"
    text: "Mais ce n'est même pas l'appétit qui décide souverainement de ce mouvement, car les gens maîtres d'eux-mêmes, malgré leur appétit et leur désir, n'accomplissent pas les actions dont ils ont l'appétit, mais obéissent à l'intelligence ! Cependant il est au moins manifeste qu'il y a là deux principes qui, alternativement, sont à l'origine du mouvement : l'appétit et l'intelligence, si l'on veut bien poser la représentation comme une sorte d'intellection. Car bien des démarches qui dérogent à la science obéissent aux ordres de la représentation et, chez les autres animaux, il n'est pas question d'intellection, ni de raisonnement, mais de représentation. Ce sont donc là ensemble les deux principes de nature à imprimer le mouvement local : l'intelligence et l'appétit."
