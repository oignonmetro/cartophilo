- id: aristote-desir-mouvement-i2
  title: "Désir et représentation"
  notes: |-
    Notre texte affirme que le mouvement animal « s'accompagne, soit de représentation,
    soit d'appétit » : il faut donc définir ces deux notions avant de le lire.

    La **représentation** (*phantasia*) est définie ailleurs dans le traité comme « le
    mouvement qui se produit sous l'effet du sens en activité » (*DA* III, 3, 429a1) : une
    image intérieure produite par l'acte de percevoir, qui persiste au-delà de la seule
    perception.

    L'**appétit** (*orexis*) se divise en trois espèces. Le désir (*epithumia*), commun à
    l'homme et aux autres animaux, est une tendance vers l'agréable. L'ardeur (*thumos*)
    est un « irrationnel rationnel », capable d'obéir à la raison ou de lui résister. Le
    souhait (*boulêsis*), enfin, est un désir proprement rationnel, que les latins
    traduiront par *voluntas*. Ces deux dernières espèces sont propres à l'être humain.

    Enfin, notre texte formule pour la première fois l'un des principes les plus
    importants de la physique aristotélicienne : « la nature ne fait rien en vain » et ne
    néglige rien de ce qui est nécessaire, sauf chez les êtres atrophiés ou incomplets.

    ! Ne pas confondre le désir (*epithumia*), commun aux animaux, avec le souhait
    (*boulêsis*), rationnel et propre à l'homme : notre texte suppose implicitement cette
    distinction en montrant que l'intelligence peut, chez l'homme, s'opposer au désir
    immédiat.
  passage:
    label: "Introduction"
  points:
