# Unité de texte (voir content/textes.md) : Aristote, De l'âme, III, 9-10,
# 432b15-433a15, trad. Bodéüs, GF-Flammarion, 1993, p. 281-284.
# Cartes-explication tirées du commentaire de Pierre-Luc Desjardins,
# « Désir, mouvement et action dans le Traité de l'âme d'Aristote »
# (scan agrégation).

id: aristote-desir-mouvement
title: "Désir, mouvement et action"
subtitle: "De l'âme, III, 9-10, 432b15-433a15"
icon: page
color: teal
intro: |-
  Un extrait du *Traité de l'âme* où Aristote cherche ce qui, dans l'animal, cause le
  mouvement local : ni la faculté nutritive, ni la faculté sensitive, ni même
  l'intelligence spéculative seule ne suffisent. Le texte conclut que deux principes
  agissent de concert, alternativement : l'appétit et l'intelligence.
lessons:
- id: aristote-desir-mouvement-i1
  title: "Qu'est-ce que l'âme ?"
  notes: |-
    *Davantage qu'un traité de psychologie, De l'âme est un traité de physique
    « locale »* : Aristote y définit l'âme comme « la réalisation première d'un corps
    naturel qui a potentiellement la vie » (*DA* II, 1, 412a25). L'âme est l'acte premier,
    la première perfection d'un vivant ; elle s'oppose à sa perfection dernière, sa plus
    complète réalisation, qui, chez l'être humain, est le bonheur.

    Cette thèse s'oppose, d'un côté, au matérialisme des présocratiques, pour qui l'âme
    est une chose physique (le feu, chez Démocrite), et, de l'autre, à un dualisme qui
    réifierait l'âme et le corps pour les opposer. Aristote défend un hylémorphisme, union
    de la matière et de la forme, qu'on peut qualifier de « monisme subtil » : on
    distingue logiquement l'âme du corps, tout en posant qu'aucun des deux principes
    n'existe sans l'autre.

    Trois types d'âme, hiérarchisés, correspondent aux trois types de vivants : la
    végétative (nutrition, croissance, reproduction), commune à tous ; la sensitive
    (perception), commune à tous les animaux ; l'intellective (raisonnement), propre à
    l'être humain. Les espèces les plus complexes accomplissent ce que peuvent accomplir
    les espèces plus simples, mais l'inverse n'est pas vrai.

    ! Aristote pense les différentes « parties » de l'âme moins comme des substances
    distinctes (trois âmes séparées) que comme des facultés et des opérations d'une seule
    et même forme : son rejet de la division locale de l'âme proposée par Platon va dans
    le sens d'une unité de la forme.
