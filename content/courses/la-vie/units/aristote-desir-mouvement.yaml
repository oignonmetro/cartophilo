# Unité de texte (voir content/textes.md) : Aristote, De l'âme, III, 9-10,
# 432b15-433a15, trad. Bodéüs, GF-Flammarion, 1993, p. 281-284.
# Cartes-explication tirées du commentaire de Pierre-Luc Desjardins,
# « Désir, mouvement et action dans le Traité de l'âme d'Aristote »
# (scan agrégation), digressions comprises, dans l'ordre du commentaire.
# La leçon i3 est placée entre i1 et i2 : elle suit l'ordre du commentaire.

id: aristote-desir-mouvement
title: "Désir, mouvement et action"
subtitle: "De l'âme, III, 9-10, 432b15-433a15"
icon: page
color: teal
intro: |-
  Un extrait du *Traité de l'âme* où Aristote cherche ce qui, dans l'animal, cause le
  mouvement local : ni la faculté nutritive, ni la faculté sensitive, ni même
  l'intelligence spéculative seule ne suffisent. Le texte conclut que deux principes
  agissent de concert, alternativement : l'appétit et l'intelligence.
lessons:
- id: aristote-desir-mouvement-i1
  title: "Qu'est-ce que l'âme ?"
  notes: |-
    Au livre III, chapitre 9, Aristote cherche ce qui distingue le mouvement des animaux
    du changement des non-vivants, mus par un principe extérieur, et de celui des
    végétaux, qui se nourrissent et croissent sans pouvoir changer de lieu par eux-mêmes.
    Dès le livre I, le traité dialogue avec Platon et avec le matérialisme des
    présocratiques, selon une approche dialectique qui étudie et réfute les opinions
    répandues : pour Démocrite, par exemple, l'âme est matérielle, faite de feu.

    Aristote leur oppose un hylémorphisme, union de la matière et de la forme, qu'on peut
    qualifier de « monisme subtil » : on distingue logiquement l'âme du corps, tout en
    posant qu'aucun des deux principes n'existe sans l'autre. Il évite ainsi à la fois le
    réductionnisme matérialiste et un dualisme qui, en réifiant l'âme, postule souvent son
    immortalité après la mort du corps. L'âme est « la réalisation première d'un corps
    naturel qui a potentiellement la vie » (*DA* II, 1, 412a25) : l'acte premier d'un
    vivant, qui s'oppose à sa perfection dernière, le bonheur chez l'homme, accessible par
    la vie active et la vie contemplative.

    *De l'âme* est ainsi moins un traité de psychologie qu'un traité de physique
    « locale », à l'intersection de la physique, de la biologie, de la psychologie et de
    l'éthique. Il s'inscrit dans une théorie unifiée du mouvement, où le désir est le
    principe moteur universel qui meut tout mobile vers sa fin ; en filigrane se dessine la
    question de la naturalité de l'action humaine.

    Trois âmes, hiérarchisées, correspondent aux trois types de vivants : végétative
    (nutrition, croissance, reproduction), sensitive (perception), intellective
    (raisonnement, qui rapproche l'homme du divin). Sont-elles les puissances d'une seule
    âme, ou trois formes substantielles distinctes ? Aristote suggère que seul l'intellect
    pourrait être séparé, sans trancher ; les médiévaux en tireront le débat sur l'unité
    ou la pluralité des formes substantielles, pour fonder l'immortalité de la seule âme
    intellective.

    ! Aristote pense les « parties » de l'âme moins comme des substances distinctes que
    comme des facultés d'une seule et même forme : son rejet de la division locale de
    l'âme proposée par Platon va dans le sens d'une unité de la forme.
