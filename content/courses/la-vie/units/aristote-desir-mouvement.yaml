- id: aristote-desir-mouvement-p2
  title: "L'intelligence spéculative ne commande pas"
  notes: |-
    Ni la partie intellective, l'intelligence, n'imprime le mouvement : du moins pas
    l'**intelligence spéculative**, qui ne considère jamais d'action à accomplir.

    Aristote quitte ici le mouvement animal en général pour l'action humaine, dont les
    deux *Éthiques* disent qu'elle diffère du mouvement des autres animaux par son
    principe. L'intelligence dont il s'agit contemple les réalités universelles (les
    latins y distingueront l'intellect possible et l'intellect agent) : son acte est à
    lui-même sa propre fin, et elle ne formule aucun jugement normatif sur ce qu'il faut
    faire. L'action, elle, porte sur le singulier et vise une fin extérieure ; même l'acte
    vertueux, qui procure du plaisir, reste ordonné au bonheur, qualité d'une vie entière.

    Même quand l'intelligence spéculative réfléchit à une chose effrayante ou plaisante,
    elle ne commande pas la peur ou le plaisir correspondant : pour se mouvoir, il faut
    s'émouvoir, et c'est le cœur, ou un autre organe, qui s'émeut. Là où Platon logeait le
    *thumos* dans le cœur, Aristote affirme une diffusion corporelle du désir, qui reste
    pourtant un acte de l'âme.

    La preuve la plus frappante en est que même lorsque l'intelligence ordonne quelque
    chose, il arrive qu'on ne bouge pas, parce que l'action s'aligne sur le désir : c'est
    ce qui arrive aux gens qui ne sont pas « maîtres d'eux-mêmes » (l'*akrasia*). De même,
    celui qui détient la science médicale ne se soigne pas forcément lui-même comme elle le
    prescrit : ce n'est donc pas la science, l'intelligence spéculative, qui décide
    souverainement d'agir, mais « autre chose ».

    ! La simple contemplation théorique d'une essence ne suffit jamais, par elle-même, à
    déclencher une action : savoir en théorie qu'un loup est dangereux ne fait pas fuir
    « ce loup-ci » qui poursuit.
  passage:
    label: "Fragment 2"
    text: "Mais ce n'est pas non plus la partie intellective ou ce qu'on appelle l'intelligence, qui imprime le mouvement. L'intelligence spéculative, en effet, ne considère aucune action à accomplir et ne dit rien de ce qui est à fuir ou à poursuivre, alors que l'action implique toujours la fuite ou la poursuite de quelque chose. Mais, lors même qu'elle considère une chose de cette sorte, elle ne commande pas, pour autant, de la fuir ou de la poursuivre. Ainsi, souvent réfléchit-elle à quelque chose d'effrayant ou de plaisant, mais ne commande pas d'avoir peur ; c'est le cœur qui est agité ou, dans le cas d'une chose plaisante, un autre organe. En outre, quand bien même l'intelligence ordonne et la réflexion dit de fuir ou de poursuivre quelque chose, on ne bouge pas ; et l'action, au contraire, s'aligne sur le désir. Ainsi font les gens qui ne sont pas maîtres d'eux-mêmes. Et, généralement, nous voyons d'ailleurs que celui qui détient la science médicale ne prodigue pas de soin, comme quoi c'est autre chose qui décide souverainement de le faire selon la science, et non la science."
