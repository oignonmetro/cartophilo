- id: aristote-desir-mouvement-p1
  title: "Ni la faculté nutritive, ni la faculté sensitive"
  notes: |-
    Aristote rejette d'abord la faculté nutritive, puis la faculté sensitive, comme
    principe du mouvement local animal.

    Première raison, contre la faculté nutritive : tout mouvement local vise un but, et
    s'accompagne donc nécessairement de représentation ou d'appétit, sans quoi rien ne se
    meut, sauf par violence. Or les plantes possèdent bien la faculté nutritive, et
    pourtant ne se déplacent pas ; si cette faculté suffisait à causer le mouvement, les
    plantes en seraient donc, elles aussi, capables.

    Seconde raison, contre la faculté sensitive : beaucoup d'animaux possèdent le sens
    mais restent immobiles toute leur existence. Cet argument mobilise le principe le plus
    important de la physique aristotélicienne, formulé ici pour la première fois : « la
    nature ne fait rien en vain » et ne néglige rien de nécessaire, sauf chez les êtres
    atrophiés ou incomplets. Or ces animaux immobiles ne sont ni atrophiés ni incomplets :
    ils se reproduisent, arrivent à maturité et dépérissent normalement, comme n'importe
    quel autre animal complet de leur espèce. La sensation, à elle seule, n'est donc pas ce
    qui rend nécessaire la locomotion.

    | Faculté rejetée | Argument                                    | Contre-exemple                                  |
    | Nutritive        | tout mouvement vise un but                  | les plantes, nutritives, ne se meuvent pas      |
    | Sensitive        | la nature ne néglige rien de nécessaire     | des animaux complets, sentants, restent immobiles |

    ! « Atrophié » et « incomplet » ne désignent pas ici un défaut esthétique, mais
    l'absence contingente, chez un individu, d'une propriété que les autres membres de son
    espèce possèdent normalement.
  passage:
    label: "Fragment 1"
    text: "Mais il faut considérer la question du mouvement local : qu'est-ce qui imprime à l'animal le mouvement de locomotion ? Or donc, ce n'est pas la capacité nutritive, évidemment, parce que le mouvement en question, qui vise toujours un but, s'accompagne, soit de représentation, soit d'appétit. S'il ne manifeste pas, en effet, d'appétit ou d'aversion, nul ne se met en mouvement, sauf contraint par violence. En outre, même les plantes, alors, seraient aptes au mouvement et posséderaient quelque partie susceptible de servir d'organe à ce type de mouvement. De même, ce n'est pas non plus la partie sensitive, parce qu'il est beaucoup d'animaux qui possèdent bel et bien le sens, mais restent sur place, sans être doués de mouvement, tout au long de l'existence. Si donc la nature ne fait rien en vain, ni ne néglige quoi que ce soit de nécessaire, sauf dans le cas des êtres atrophiés et celui des êtres incomplets ; et si, d'autre part, ces sortes d'animaux sont complètes et ne montrent pas d'atrophie (or c'est ce qu'indique le fait qu'ils sont aptes à se reproduire, arrivent à maturité, puis dépérissent), il en résulte qu'ils devraient également posséder les parties susceptibles de servir d'organe à la marche."
