- id: "pascal-nous-esperons-de-vivre-l3"
  title: "Que chacun examine ses pensées"
  notes: |-
    Pascal invite alors le lecteur à **faire appel à son expérience** pour confirmer sa pensée sur notre rapport au présent. Or cette vérification ne confirme pas seulement le constat initial, elle le précise sur un point que rien, jusque-là, n'avait établi : {coral}la valeur du présent est purement instrumentale, et donc extérieure à lui{/coral}.

    **Pourquoi « Que chacun examine ses pensées » ?** Pascal ne démontre pas, il {amber}fait vérifier{/amber} : chacun peut faire l'expérience sur soi. {yellow}Qu'on se demande à quoi l'on pensait il y a une minute : presque toujours à ce qu'on va faire, ou à ce qui s'est passé.{/yellow} L'argument tient à ce que nul ne peut le récuser sans s'examiner.

    **Pourquoi « presque point » ?** La nuance est importante : il arrive qu'on pense au présent. Mais {red}jamais pour lui-même{/red} : seulement {teal}« pour en prendre la lumière pour disposer de l'avenir »{/teal}. Le présent n'est qu'{amber}une source d'informations{/amber}, comme {yellow}le pilote regarde la mer seulement pour régler sa route{/yellow}.

    ! Penser au présent ne suffit pas à {red}le vivre{/red} : on peut y penser {green}comme à un moyen{/green}, et c'est encore le fuir.
  passage:
    label: "§2"
    text: "Que chacun examine ses pensées, il les trouvera toutes occupées au passé ou à l'avenir. Nous ne pensons presque point au présent, et si nous y pensons, ce n'est que pour en prendre la lumière pour disposer de l'avenir."
