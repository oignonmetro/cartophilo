- id: "pascal-nous-esperons-de-vivre-l2b"
  title: "Le présent nous blesse"
  notes: |-
    Pascal explique ensuite cette fuite par **une cause unique qui tient à la nature même du présent** : {coral}douloureux, on le cache à sa vue ; agréable, on en regrette par avance la perte{/coral}. Le présent est donc paradoxalement le seul temps qui est et qu'on fuit.

    **Pourquoi « d'ordinaire » ?** Pascal ne dit pas que le présent blesse toujours, mais {amber}le plus souvent{/amber} : la règle souffre des exceptions, qu'il traite aussitôt.

    **Pourquoi « nous le cachons à notre vue » ?** Le présent pénible, on {red}refuse de le regarder{/red} : on pense à autre chose, comme on détourne les yeux d'une plaie. C'est le mécanisme du {violet}divertissement{/violet}, que les *Pensées* décrivent ailleurs.

    **Pourquoi « s'il nous est agréable nous regrettons de le voir échapper » ?** Même le présent heureux est {red}gâché{/red} : {yellow}au milieu d'une fête, on pense déjà qu'elle va finir{/yellow}. Le bonheur présent porte en lui l'inquiétude de sa perte. Il n'y a donc {coral}aucun présent qu'on puisse habiter tranquillement{/coral}.

    **Pourquoi « nous tâchons de le soutenir par l'avenir » ?** Faute de pouvoir rester dans le présent, on l'{amber}étaie{/amber} par des projets : on organise {red}des choses qui ne sont pas en notre puissance{/red}, pour un temps qu'on n'est {red}pas sûr d'atteindre{/red}. La vanité revient sous une autre forme : on s'appuie sur ce qui n'est pas.

    ! La cause de la fuite n'est pas {red}une erreur de calcul{/red}, mais {green}la souffrance{/green} : c'est parce que le présent fait mal qu'on le fuit.
  passage:
    label: "§1"
    text: "C'est que le présent d'ordinaire nous blesse. Nous le cachons à notre vue parce qu'il nous afflige, et s'il nous est agréable nous regrettons de le voir échapper. Nous tâchons de le soutenir par l'avenir et pensons à disposer les choses qui ne sont pas en notre puissance pour un temps où nous n'avons aucune assurance d'arriver."
