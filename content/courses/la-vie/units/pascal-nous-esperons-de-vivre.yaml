id: pascal-nous-esperons-de-vivre
title: "Pascal : \"nous espérons de vivre\""
subtitle: "Pensées, 172 B"
icon: page
color: teal
lessons:
- id: pascal-nous-esperons-de-vivre-l2
  title: "Nous ne profitons jamais de l'instant présent"
  notes: ""
  passage:
    label: "§1"
    text: "Nous ne nous tenons jamais au temps présent. Nous anticipons l’avenir comme trop lent à venir, comme pour hâter son cours, ou nous rappelons le passé pour l’arrêter comme trop prompt, si imprudents que nous errons dans les temps qui ne sont point nôtres et ne pensons point au seul qui nous appartient, et si vains que nous songeons à ceux qui ne sont rien, et échappons sans réflexion le seul qui subsiste. C’est que le présent d’ordinaire nous blesse. Nous le cachons à notre vue parce qu’il nous afflige, et s’il nous est agréable nous regrettons de le voir échapper. Nous tâchons de le soutenir par l’avenir et pensons à disposer les choses qui ne sont pas en notre puissance pour un temps où nous n’avons aucune assurance d’arriver."
