- id: "pascal-nous-esperons-de-vivre-l3b"
  title: "Nous ne vivons jamais, mais nous espérons de vivre"
  notes: |-
    Dès lors, **si l'avenir est structurellement posé comme fin, alors on ne vit jamais, on « espère » seulement de vivre**. Pascal en tire une conséquence sur l'accessibilité du bonheur humain : puisque nous ne cherchons à vivre que pour un temps qui n'est pas, notre quête du bonheur est donc vaine et imprudente.

    ? **Fin et moyen** : une {violet}fin{/violet} est ce qu'on veut pour soi-même ; un {violet}moyen{/violet}, ce qu'on ne veut qu'en vue d'autre chose. Pascal distribue les trois temps : {red}le passé et le présent sont nos moyens{/red}, {amber}le seul avenir est notre fin{/amber}.

    **Pourquoi « nous ne vivons jamais » ?** Vivre, c'est exister {amber}au présent{/amber}, seul temps où l'on est. Si le présent n'est jamais fin, on n'y est jamais vraiment : {coral}la vie est toujours remise à plus tard{/coral}. « Espérer de vivre », c'est {red}attendre une vie qui n'arrive pas{/red}.

    **Pourquoi « il est inévitable que nous ne le soyons jamais » ?** Le bonheur projeté dans l'avenir, une fois l'avenir atteint, devient à son tour un présent, qu'on instrumentalise pour un autre avenir : {coral}un cercle sans fin{/coral}. {yellow}On se promet d'être heureux après l'examen, puis après le mariage, puis à la retraite.{/yellow} Le bonheur est donc inaccessible ; et s'il l'est, ce n'est pas par accident, mais de façon essentielle, en raison même de la misérable nature humaine.

    ! « Inévitable » ne veut pas dire que le bonheur {red}n'existe pas{/red} : il dit qu'il ne peut {green}pas être atteint par la voie où nous le cherchons{/green}.
