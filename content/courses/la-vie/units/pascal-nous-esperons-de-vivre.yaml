  - id: pascal-nous-esperons-de-vivre-l2-p13
    sentence: "Nous avons tendance à fuir le présent en pensant soit au passé, soit à l'avenir ; le présent est pourtant le seul moment qui nous appartient vraiment, mais nous préférons ne pas y prêter attention, si bien que, selon la formule de Pascal, « ___ »."
    answer: "nous errons dans les temps qui ne sont point nôtres et ne pensons point au seul qui nous appartient"
    alt: []
  - id: pascal-nous-esperons-de-vivre-l2-p14
    sentence: "Le problème de l'ennui, c'est qu'il nous pousse à nous abstraire du moment présent pour nous projeter dans l'avenir ; on veut que le temps passe, que le présent ne soit pas vécu, et on s'imagine déjà ce qu'on fera ensuite, au point que Pascal écrit que « ___ »."
    answer: "nous anticipons l'avenir comme trop lent à venir, comme pour hâter son cours"
    alt: []
  - id: pascal-nous-esperons-de-vivre-l2-p15
    sentence: "Le problème de la nostalgie, c'est qu'elle nous pousse elle aussi à nous abstraire du moment présent, mais pour nous projeter cette fois dans le passé ; regrettant qu'un moment soit fini, on en ressasse le souvenir, si bien que « ___ »."
    answer: "nous rappelons le passé pour l'arrêter comme trop prompt"
    alt: []
  - id: pascal-nous-esperons-de-vivre-l2-p16
    sentence: "Cette double fuite hors du présent, vers l'avenir qu'on voudrait précipiter par impatience et vers le passé qu'on voudrait retenir par nostalgie, Pascal la résume en une seule formule : « ___ »."
    answer: "nous anticipons l'avenir comme trop lent à venir, comme pour hâter son cours, ou nous rappelons le passé pour l'arrêter comme trop prompt"
    alt: []
  - id: pascal-nous-esperons-de-vivre-l2-p17
    sentence: "Si on évite de se concentrer sur le présent, c'est qu'il est le plus souvent source de douleur ; et même lorsqu'il est agréable, on s'attriste d'avance de le voir passer, ce que Pascal formule ainsi : « ___ »."
    answer: "C'est que le présent d'ordinaire nous blesse. Nous le cachons à notre vue parce qu'il nous afflige, et s'il nous est agréable nous regrettons de le voir échapper."
    alt: []
  - id: pascal-nous-esperons-de-vivre-l2-p18
    sentence: "Pascal critique enfin la vanité qui consiste à organiser un futur incertain, sur lequel on n'a aucune prise, au détriment de l'instant présent que l'on néglige : « ___ »."
    answer: "Nous tâchons de le soutenir par l'avenir et pensons à disposer les choses qui ne sont pas en notre puissance pour un temps où nous n'avons aucune assurance d'arriver."
    alt: []
  - id: pascal-nous-esperons-de-vivre-l2-p19
    sentence: "S'il est si difficile de vivre le moment présent, c'est qu'il est toujours synonyme de peine, désagréable ou agréable : dans un cas on cherche à l'abréger, dans l'autre on redoute déjà qu'il cesse, ce que Pascal exprime par : « ___ »."
    answer: "C'est que le présent d'ordinaire nous blesse. Nous le cachons à notre vue parce qu'il nous afflige, et s'il nous est agréable nous regrettons de le voir échapper."
    alt: []
  - id: pascal-nous-esperons-de-vivre-l2-p20
    sentence: "Même la joie d'un instant se trouve gâchée par l'inquiétude de la voir nécessairement disparaître, si bien que Pascal note que « ___ »."
    answer: "s'il nous est agréable nous regrettons de le voir échapper"
