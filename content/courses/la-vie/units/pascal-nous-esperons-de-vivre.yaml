id: "pascal-nous-esperons-de-vivre"
title: "Pascal : « nous espérons de vivre »"
subtitle: "Pensées, 172 B (80 S)"
icon: "page"
color: "teal"
depth: "normale"
intro: |-
  Un fragment des *Pensées* sur notre rapport au temps : nous fuyons le présent, seul temps qui nous appartienne, vers un avenir qui n'est pas ; d'où la conclusion que nous ne vivons jamais, mais espérons de vivre, et ne sommes jamais heureux.
lessons:
- id: "pascal-nous-esperons-de-vivre-i1"
  title: "Le fragment, sa question et son plan"
  notes: |-
    **Le fragment appartient aux {sky}*Pensées*{/sky} de Pascal (172 dans l'édition Brunschvicg, 80 dans l'édition Sellier)**, notes d'une apologie de la religion chrétienne qui commence par décrire la {violet}misère{/violet} de l'homme sans Dieu.

    **La question :** {amber}pourquoi ne vivons-nous jamais dans le présent ?{/amber} Elle touche directement {violet}la vie{/violet} : non la vie biologique, mais {amber}la vie vécue{/amber}, le temps où l'on existe effectivement. Pascal soutient que nous passons notre existence à côté de notre vie.

    **La thèse :** {coral}le présent, seul temps réel et seul temps à nous, n'est jamais notre fin{/coral} ; nous le fuyons parce qu'il nous blesse, et ne le pensons que comme moyen de l'avenir. D'où la conclusion : {red}« nous ne vivons jamais, mais nous espérons de vivre »{/red}, et le bonheur, toujours préparé, n'arrive jamais.

    **Le plan.**

    | Mouvement | Lieu | Ce qui s'y joue |
    | constater la fuite hors du présent et la juger | §1, début | Nous errons dans le passé et l'avenir, temps qui ne sont pas à nous et ne sont rien : c'est imprudence et vanité. |
    | en donner la cause | §1, fin | Le présent nous blesse : pénible, on le fuit ; agréable, on craint de le perdre ; on le soutient alors par un avenir incertain. |
    | vérifier par l'examen de soi et préciser | §2, début | Chacun trouve ses pensées occupées du passé et de l'avenir ; le présent n'est pensé que pour disposer de l'avenir. |
    | conclure sur la vie et le bonheur | §2, fin | L'avenir seul étant notre fin, nous ne vivons jamais, et, nous disposant toujours à être heureux, nous ne le sommes jamais. |

    ! Pascal ne donne pas {red}un conseil{/red} (« vivez l'instant ») : il {green}décrit une condition{/green}, dont l'homme seul ne peut sortir.
