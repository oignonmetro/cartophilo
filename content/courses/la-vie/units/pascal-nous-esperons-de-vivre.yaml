- id: pascal-nous-esperons-de-vivre-l3
  title: "Nous ne vivons jamais notre vie"
  notes: ""
  passage:
    label: "§2"
    text: "Que chacun examine ses pensées, il les trouvera toutes occupées au passé ou à l'avenir. Nous ne pensons presque point au présent, et si nous y pensons, ce n'est que pour en prendre la lumière pour disposer de l'avenir. Le présent n'est jamais notre fin. Le passé et le présent sont nos moyens, le seul avenir est notre fin. Ainsi nous ne vivons jamais, mais nous espérons de vivre, et nous disposant toujours à être heureux, il est inévitable que nous ne le soyons jamais."
