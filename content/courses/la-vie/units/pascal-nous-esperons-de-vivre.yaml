- id: "pascal-nous-esperons-de-vivre-o1"
  title: "Vivre et espérer de vivre"
  notes: |-
    **Le fragment dit quelque chose de la vie que l'on n'aurait pas cherché dans un texte sur le temps : {coral}la vie humaine n'est pas seulement une durée, c'est une présence, et elle peut manquer à celui qui dure{/coral}.**

    **Exister sans vivre.** On peut subsister des années sans vivre au sens de Pascal : {red}l'existence se poursuit, la vie est différée{/red}. Le fragment distingue ainsi {amber}la vie comme durée{/amber}, qui passe d'elle-même, et {amber}la vie comme présence à soi{/amber}, qui demande d'habiter le présent.

    **Une misère de l'homme seul.** Le fragment n'appelle pas à « vivre l'instant » : il montre que {red}l'homme ne le peut pas par lui-même{/red}, parce que le présent le blesse. Dans l'apologie, cette misère prépare la recherche d'un bien qui ne serait pas à venir mais présent, et que Pascal trouve en Dieu.

    **Confrontations.** {sky}Sénèque{/sky} disait déjà, dans la première des *Lettres à Lucilius*, que {teal}« pendant qu'on la diffère, la vie passe »{/teal}, mais il en tirait un précepte : se ressaisir de chaque jour. {sky}Montaigne{/sky}, dans le chapitre I, 3 des *Essais*, décrivait déjà l'homme toujours porté au-delà de lui-même, par la crainte, le désir et l'espérance, et jamais chez lui. Pascal reprend le constat, mais {coral}n'en tire aucune sagesse humaine{/coral} : la fuite du présent est inscrite dans notre condition.

    ! Pascal ne condamne pas {red}l'espérance{/red} en général : il condamne l'espérance qui {green}remplace la vie{/green}, en la renvoyant toujours à demain.
