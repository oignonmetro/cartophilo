- id: "pascal-nous-esperons-de-vivre-l2"
  title: "Nous ne profitons jamais de l'instant présent"
  notes: |-
    **Pascal avance, dès l'ouverture, la thèse selon laquelle** {coral}**on n'accorde aucune valeur au présent**{/coral}**.** Il la justifie en décomposant l'errance temporelle en deux mouvements symétriques : on désire l'avenir et le passé, et on délaisse le présent.

    **Pourquoi « nous ne nous tenons jamais » ?** Se tenir, c'est {amber}demeurer, se fixer{/amber}. Le « nous » est universel et le « jamais » sans exception : Pascal ne décrit pas un travers de quelques-uns, mais {coral}la condition de tous{/coral}.

    **Pourquoi « comme trop lent » et « comme trop prompt » ?** Les deux fuites sont {amber}symétriques{/amber}. {yellow}L'ennui{/yellow} nous projette dans l'avenir, qu'on voudrait hâter ; {yellow}la nostalgie{/yellow} nous ramène au passé, qu'on voudrait arrêter. Dans les deux cas, {red}on voudrait commander au temps{/red}, ce qui est impossible.

    Pascal en tire deux qualifications morales : l'imprudence et la vanité.

    - L'**imprudence** sanctionne d'abord un mauvais calcul : on dépense son attention sur des temps dont on n'a par définition aucune maîtrise (l'avenir échappe à notre pouvoir, le passé ne peut plus être changé) tout en désertant le seul temps sur lequel on pourrait effectivement agir. L'imprudence désigne ainsi une __faute d'orientation pratique__, comparable à celle qu'on commettrait en __négligeant le seul outil__ dont on dispose au profit d'instruments qu'on ne possède pas.

    - La **vanité** de l'homme par rapport au temps tient au fait que l'objet même vers lequel on se tourne est, à proprement parler, sans être.

    ? **Vanité** : chez Pascal, le caractère de ce qui est vide, sans consistance, et de l'homme qui s'y attache. Le passé n'est plus, l'avenir n'est pas encore : ce sont des temps {teal}« qui ne sont rien »{/teal}.

    Alors que l'imprudence portait sur l'usage qu'on fait de son attention (on la place mal), la vanité porte sur la nature de ce à quoi cette attention s'applique (on la place sur du néant). C'est pourquoi les deux qualifications se complètent sans se recouvrir : le même geste, qui consiste à déserter le présent pour l'avenir ou le passé, est **imprudent** en tant qu'__il prive l'homme du seul temps sur lequel son pouvoir pourrait s'exercer__, et il est **vain** en tant qu'__il occupe ce pouvoir à des objets qui n'ont aucune réalité__.

    ! Le présent n'est pas dit {red}agréable{/red} : il est dit {green}le seul qui nous appartienne et le seul qui subsiste{/green}, ce qui est autre chose.
