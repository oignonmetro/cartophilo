- id: jonas1-l4
  title: "Le transhumanisme"
  notes: |-
    La forme extrême de la technique qui se retourne sur l'homme est l'idéologie {violet}transhumaniste{/violet}. Jonas cherche une voie entre ses partisans et ses adversaires.

    **La mort, une maladie à guérir.** Le transhumanisme considère {red}la vieillesse et la mort comme de simples maladies{/red} : {teal}« l'idée que la mort est un problème à résoudre et non une réalité imposée par la Nature ou par la volonté divine va s'imposer »{/teal} ; {teal}« l'euthanasie de la mort va devenir l'ultime frontière pour l'Humanité »{/teal} (Laurent Alexandre, 2011). La science n'aurait plus d'autres limites que celles de la connaissance, que l'on repousserait sans cesse.

    **Une responsabilité inédite.** D'où le sentiment, dit **Dominique Lecourt**, que {teal}« nous avons confusément conscience de vivre l'un de ces moments périlleux où la responsabilité nous incombe d'avoir à inventer une nouvelle conception, une nouvelle pratique de la vie humaine »{/teal} ; et le souci, dit **Anne Fagot-Largeault** à propos des travaux de **Gilbert Hottois**, de prendre en compte {teal}« les conséquences anthropologiques de la nouvelle civilisation technoscientifique »{/teal}.

    **Comment anticiper un progrès qui semble inéluctable ?** Trois attitudes :
    - organiser la résistance : les {pink}bioconservateurs{/pink} ;
    - préparer l'arrivée des nouvelles avancées : les {red}technoprophètes{/red} ou transhumanistes ;
    - {green}accompagner{/green} au mieux leur apparition, voie moyenne : c'est celle de Jonas.

    **La voie de Jonas.** Il pense le rapport entre **le pouvoir et la morale** : {green}ne pas abandonner la technique à son libre cours{/green}, mais donner un **cadre éthique** à l'agir humain, pour le réguler et en éviter les dérives, qui, encore inaperçues aujourd'hui, en seraient les conséquences et sont déjà **contenues dans nos décisions actuelles**. L'homme ne peut renoncer à la technique ; il doit donc se limiter pour que ses effets puissent être corrigés.

    **L'échelle, encore.** Ce qui change, c'est que l'aspect {violet}quantitatif{/violet} de l'action technique et de ses effets acquiert une **signification morale**. Il ne s'agit plus d'un effet d'accumulation qui deviendrait mauvais à la fin : aujourd'hui *chaque* application d'une aptitude technique tend à se faire à {coral}« grande échelle »{/coral}.

    ! Jonas n'est pas un bioconservateur : il ne demande pas d'arrêter la technique, mais de la soumettre à une éthique qui la limite.
  points:
  - id: jonas1-l4-p1
    sentence: "L'idéologie ___ considère la vieillesse et la mort comme de simples maladies, que la technique pourra guérir."
    answer: "transhumaniste"
    alt: ["transhumanisme"]
