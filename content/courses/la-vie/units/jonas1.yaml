- id: jonas1-l3
  title: "Une technique qui se retourne sur l'homme"
  notes: |-
    Pourquoi la technique devient-elle, avec Jonas, un objet pour l'éthique ? Parce qu'elle a **changé d'objet** : elle ne transforme plus seulement le milieu de l'homme, mais **l'homme lui-même**.

    **Une accélération sans arrêt.** L'invention d'outils est très ancienne, mais depuis le {sky}XIXe siècle{/sky} et la révolution industrielle le progrès technique s'accélère : en une courte période, l'homme a évolué autant, voire plus, que dans l'ensemble des siècles précédents, et {red}le rythme des innovations s'accélère toujours plus{/red}.

    **De la nature extérieure à la vie humaine.** La technique apparaît d'abord comme un moyen d'agir sur le milieu extérieur : soumettre la nature, aménager l'environnement (avec la violence qu'interroge l'écologie). Elle devient un {red}pouvoir d'intervenir sur l'homme lui-même{/red}, de **modifier le vivant**, jusqu'à transformer sa propre nature. Les progrès de la biologie et de la médecine sont portés par les {violet}NBIC{/violet} (nanotechnologies, biotechnologies, informatique, sciences cognitives), forces convergentes ; le plus spectaculaire concerne les **cellules souches**, qui pourraient révolutionner la médecine. S'y ajoutent ingénierie génétique, médecine régénérative, biologie synthétique, médecine d'amélioration, hybridation homme-machine.

    **La question de la bioéthique.** Dans quelle mesure la technique pourrait-elle **changer l'humain**, au point de le {red}dénaturer{/red}, de sorte qu'il ne soit plus humain ? Mais la question a deux faces :
    - d'un côté, la crainte qu'une modification fasse perdre à l'homme ce qui le fait homme ;
    - de l'autre, {pink}l'homme se définit essentiellement par la technique{/pink} et ne cesse de se transformer dans son histoire, sans référence à une nature permanente : ces changements s'inscrivent dans un long projet d'**émancipation** à l'égard des déterminismes.

    La crainte reste fondée, parce que la technique s'est substituée à ces déterminismes comme **une contrainte nouvelle**, obéissant de plus en plus à sa propre logique.

    ! L'objection selon laquelle l'homme a toujours été technicien ne règle rien : ce qui inquiète n'est pas la technique en général, mais une technique qui prend pour matériau la nature humaine.
  points:
  - id: jonas1-l3-p1
    sentence: "Le progrès technique, très ancien, connaît une incroyable accélération depuis le ___ siècle et la révolution industrielle."
    answer: "XIXe"
    alt: ["19e", "XIX", "19ème", "XIXème"]
