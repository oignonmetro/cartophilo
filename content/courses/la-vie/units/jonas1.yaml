- id: jonas1-l5
  title: "Hypothéquer ou sacrifier l'avenir"
  notes: |-
    L'hypothèque du texte de Jonas se comprend mieux par contraste : la recherche **mise** sur l'avenir ; Jonas soutient qu'en réalité nous le **sacrifions**.

    **La recherche mise sur l'avenir.** Elle s'inscrit dans le temps long et se fonde sur l'intention louable d'**améliorer le sort de l'humanité**. Mais elle ne saurait {red}anticiper l'ensemble des conséquences{/red} de ses découvertes.

    **Pour Jonas, nous sacrifions l'avenir.** Plutôt que de l'hypothéquer au sens de *formuler des hypothèses* à son sujet, nous le sacrifions tout simplement : le progrès, loin d'assurer un avenir plus heureux, risque de {red}le faire perdre entièrement{/red}. L'avenir devient {violet}hypothétique{/violet} en un autre sens : plus rien ne garantit sa réalité, tant elle est mise en péril par des avancées programmées depuis le présent. Car le **centre de gravité** de la recherche n'est pas dans l'avenir, mais dans le présent, dans ses avantages et ses besoins à court terme.

    **Une illustration : Kurzweil.** Ray **Kurzweil**, l'un des meilleurs représentants du transhumanisme, se donne pour projet {red}la négation de l'animalité de l'homme et de la mort{/red} (*Humanité 2.0*, 2007) : {teal}« Nos corps biologiques version 1.0 sont fragiles »{/teal} ; {teal}« La Singularité va nous permettre de transcender ces limitations physiques et cérébrales »{/teal} ; {teal}« Nous allons prendre notre mortalité en main »{/teal}. Le corps y est traité comme {yellow}un logiciel à mettre à jour{/yellow}.

    **La réponse d'Arendt.** Dans *La condition de l'homme moderne*, **Hannah Arendt** part de la mise en orbite du premier {yellow}satellite{/yellow} : un artefact humain dans le champ des astres éternels, qui fait rêver de s'évader de la condition humaine (par l'exploration de l'univers ou la modification du code génétique). Mais {teal}« la Terre est la quintessence même de la condition humaine »{/teal}, la seule peut-être {teal}« à procurer aux humains un habitat où ils puissent se mouvoir et respirer sans effort et sans artifice »{/teal}. Comme la Terre, **le corps est l'habitat de l'homme**, son lieu naturel : vouloir s'en évader, c'est {red}risquer de perdre ce qui fait son humanité{/red}, une condition qu'on pourrait dire **inhumaine**.

    **La technique en tension.** Elle émancipe l'homme, mais inspire la méfiance quand elle nourrit des **ambitions illimitées** : l'homme se pense alors comme une machine décomposable, aux composants substituables, et rabaisse sa **dignité** au niveau d'un simple objet technique.

    ! Pour Jonas, le danger n'est pas seulement de mal prévoir l'avenir, mais de le rendre impossible : c'est pourquoi l'hypothèque devient un sacrifice.
  points:
  - id: jonas1-l5-p1
    sentence: "La recherche scientifique mise sur l'avenir, fondée sur l'intention louable d'améliorer le sort de l'humanité ; mais elle ne saurait ___ l'ensemble des conséquences de ses découvertes."
    answer: "anticiper"
