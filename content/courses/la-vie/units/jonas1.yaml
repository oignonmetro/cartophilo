- id: jonas1-l6
  title: "Des besoins produits par nous-mêmes"
  notes: |-
    Le texte de Jonas précise que nous hypothéquons l'avenir pour des besoins {teal}« produits par nous-mêmes »{/teal}. Le détail aggrave la faute, sans permettre pour autant de renoncer à la technique.

    **Des besoins artificiels.** Ce sont les besoins que suscitent certaines découvertes dont on voudrait jouir immédiatement, sans mesurer les conséquences à long terme. Dans *Pour une éthique du futur* (1998), Jonas évoque de **nouveaux besoins**, {red}ni naturels ni vitaux{/red}, produits par un développement historique et culturel. Nous risquons l'avenir non pour survivre, mais pour satisfaire ce que nous avons nous-mêmes rendu désirable.

    **Mais on ne peut pas renoncer à la technique.** Elle est **indissociable de l'homme**, de son évolution et de son histoire. Il ne s'agit donc pas de s'abstenir, mais d'{green}en limiter les effets négatifs{/green}. D'où la question : qu'est-ce qui est admissible dans nos paris techniques ? quels risques sommes-nous autorisés à prendre ? En un mot, quels sont les {violet}risques raisonnables{/violet} ?

    **La responsabilité comme anticipation.** Entre l'ambition scientifique et la nécessité d'en limiter la portée, Jonas introduit la responsabilité, qui peut d'abord se définir comme une {coral}forme d'anticipation des risques à long terme{/coral}. Il parle en ce sens de {teal}« la futurologie de l'avertissement »{/teal} : la mise en garde contre les dangers que nous pouvons faire courir à l'avenir, {teal}« il nous faut commencer par l'apprendre pour parvenir à l'autorégulation de notre pouvoir déchaîné »{/teal}.

    ! La futurologie de l'avertissement ne prédit pas l'avenir : elle se représente le pire possible pour apprendre à limiter un pouvoir qui ne se limite plus de lui-même.
  points:
  - id: jonas1-l6-p1
    sentence: "Les besoins pour lesquels nous hypothéquons l'avenir sont, pour Jonas, « produits par nous-mêmes » : dans *Pour une éthique du futur*, il évoque de nouveaux besoins qui ne seraient pas naturels et ___, mais le fait d'un développement historique et culturel."
    answer: "vitaux"
    alt: []
  - id: jonas1-l6-p2
    sentence: "Jonas évoque de nouveaux besoins, qui ne seraient pas naturels et vitaux, dans *Pour une éthique du ___* (1998)."
    answer: "futur"
    alt: []
  - id: jonas1-l6-p3
    sentence: "Même si nous mettons l'avenir en danger, nous ne pourrions, selon Jonas, entièrement renoncer à la technique, qui est ___ de l'homme, de son évolution et de son histoire : il s'agit d'en limiter les effets négatifs."
    answer: "indissociable"
    alt: []
  - id: jonas1-l6-p4
    sentence: "Puisqu'on ne peut renoncer à la technique, Jonas demande ce qui est admissible dans nos paris techniques, quels risques nous sommes autorisés à prendre, autrement dit quels sont les risques ___."
    answer: "raisonnables"
    alt: []
  - id: jonas1-l6-p5
    sentence: "Entre l'ambition scientifique et la nécessité d'en limiter la portée, la responsabilité peut d'abord se définir, chez Jonas, comme une forme d'___ des risques à long terme."
    answer: "anticipation"
    alt: []
  - id: jonas1-l6-p6
    sentence: "Dans *Pour une éthique du futur*, Jonas parle de « la futurologie de l'___ », la mise en garde contre les dangers que nous pouvons faire courir à l'avenir."
    answer: "avertissement"
    alt: []
  - id: jonas1-l6-p7
    sentence: "La futurologie de l'avertissement, dit Jonas, « il nous faut commencer par l'apprendre pour parvenir à l'___ de notre pouvoir déchaîné »."
    answer: "autorégulation"
    alt: []
  - id: jonas1-l6-p8
    sentence: "La futurologie de l'avertissement doit nous apprendre, selon Jonas, à parvenir à l'autorégulation de notre pouvoir ___."
    answer: "déchaîné"
