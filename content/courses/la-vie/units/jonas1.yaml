- id: jonas1-l2
  title: "Naissance de la bioéthique"
  notes: |-
    Jonas pense la responsabilité devant le vivant, objet de la {violet}bioéthique{/violet} : il faut d'abord savoir ce que ce mot désigne, et d'où vient la chose.

    **Le mot.** « Bioéthique » combine deux termes grecs : {violet}`bios`{/violet}, la vie, et {violet}`êthos`{/violet}, les mœurs, d'où l'éthique. Elle désigne les **réflexions éthiques et les cadres juridiques** que suscitent les avancées techniques et les nouvelles pratiques médicales. Le mot apparaît en {sky}1970{/sky} chez le cancérologue américain **Van Rensselaer Potter**, dans un article de *Perspectives in Biology and Medicine* intitulé {teal}« Bioethics, the Science of Survival »{/teal}.

    **La chose naît d'un crime.** Elle serait née au lendemain des **procès de Nuremberg** (1946-1947) et de la condamnation des nazis pour {red}« crimes de guerre médicaux »{/red}, qui donne lieu à une codification de l'expérimentation sur l'homme. Les médecins, conscients du risque d'un crime contre l'humanité, se dotent de codes de bonne conduite :
    - le **Serment de Genève** (1948) ;
    - le **Code international d'éthique médicale** (1949) ;
    - la **Déclaration d'Helsinki** (1964), plus décisive encore ;
    - en **1975**, une nouvelle déclaration : {green}pas de recherche sur l'homme sans le consentement du sujet{/green}.

    **Son objet.** La bioéthique {teal}« a pour objet initial les découvertes technoscientifiques dans le champ biomédical et leurs conséquences éthiques, sociales, légales, économiques, politiques »{/teal} (Boladeras, 2017). Elle porte sur l'avortement, la contraception, le diagnostic prénatal, la procréation médicalement assistée, les greffes, les soins palliatifs et l'euthanasie ; aujourd'hui, sur la recherche sur l'embryon, les cellules souches, la modification du génome, le clonage, les nanotechnologies : autant de problèmes qui {teal}« modifient en profondeur notre façon de concevoir la vie, la santé, la souffrance, le vieillissement, la mort »{/teal}.

    **En France.** Le **Comité consultatif national d'éthique** (CCNE) est créé en {sky}1983{/sky}, pour {teal}« donner des avis sur les problèmes éthiques et les questions de société soulevées par les progrès de la connaissance dans les domaines de la biologie, de la médecine et de la santé »{/teal}. En {sky}1994{/sky}, le législateur donne un cadre juridique : une **loi de bioéthique**, appelée à être {coral}révisée régulièrement{/coral} pour suivre l'évolution des connaissances et de la société.

    ! La bioéthique n'est pas une branche de la biologie : c'est l'éthique (et le droit) appliquée à ce que la biologie et la médecine rendent possible.
