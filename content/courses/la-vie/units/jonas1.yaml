    answer: "problème"
    alt: []
  - id: jonas1-l4-p3
    sentence: "Pour le transhumanisme, la mort n'est pas « une réalité ___ par la Nature ou par la volonté divine », mais un problème à résoudre (Laurent Alexandre)."
