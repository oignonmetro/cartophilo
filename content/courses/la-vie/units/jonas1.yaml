# Cours sur Jonas (voir content/philosophie.md, § « Un cours sur un auteur,
# tiré d'un commentaire »), tiré d'Alexandre Bies, « La bioéthique : Hans
# Jonas ou la responsabilité face au vivant » (scan agrégation, chapitre
# « la morale », p. 451-469), qui commente un passage de Jonas, « En quel sens
# la technique moderne est un objet pour l'éthique », dans L'art médical et la
# responsabilité humaine, trad. É. Pommier, Cerf, 2012, p. 26. Citations et
# repères tels que Bies les donne. Le passage lui-même fait l'unité de texte
# jonas-hypotheques (piste Textes).
#
# Corrigé : Bies fait renvoyer « éthos » au vivant ; le grec êthos désigne les
# mœurs (c'est bios qui dit la vie). Le scan s'arrête p. 469, au milieu des
# perspectives critiques (Simondon) : la fin du chapitre manque.

id: jonas1
title: "Une nouveauté éthique"
subtitle: "Hypothéquer la vie future : la bioéthique et la technique qui se retourne sur le vivant"
