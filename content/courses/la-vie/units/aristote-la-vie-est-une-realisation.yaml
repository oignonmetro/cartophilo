- id: "aristote-la-vie-est-une-realisation-l1"
  title: "Les trois sens de « substance » et les deux degrés de réalisation"
  notes: |-
    **Le paragraphe pose les instruments de la définition :** {violet}**trois sens de la substance**{/violet}**, et deux façons d'être forme.** Rien n'y est encore dit de l'âme ; tout y prépare l'élimination qui suivra.

    **Trois sens.** La {violet}matière{/violet} est ce qui, {teal}« par soi, ne constitue pas une réalité singulière »{/teal} : du bronze n'est pas encore une statue. La {violet}forme{/violet} est ce {teal}« en vertu de quoi, précisément, on peut parler d'une réalité singulière »{/teal} : la figure fait du bronze une statue. Le {violet}composé{/violet} est les deux ensemble, la statue.

    | Sens de « substance » | Ce que c'est | Dans la statue | Dans le vivant |
    | la matière | ce qui n'est pas par soi une réalité singulière : une puissance | le bronze | le corps |
    | la forme | ce qui en fait une réalité singulière : une réalisation | la figure | l'âme |
    | le composé | les deux ensemble | la statue | l'animal, la plante |

    La dernière colonne {amber}anticipe la conclusion{/amber} : le texte ne la remplit qu'en 412a21.

    **Deux façons d'être réalisation.** {green}__La matière est puissance, la forme réalisation__{/green}, mais la réalisation se dit {yellow}« comme la science »{/yellow}, qu'on possède sans l'exercer, ou {yellow}« comme l'acte de spéculer »{/yellow}, qui l'exerce. La distinction est posée ici **en réserve** : elle décidera en 412a22-23 de quelle sorte de réalisation est l'âme.

    **Pour la vie,** le paragraphe fixe d'avance la place qu'elle occupera : {red}ni la matière{/red}, {red}ni un quatrième terme{/red}, mais {green}ce qui fait du composé un vivant{/green}.

    ! La matière n'est pas « rien » : elle est puissance, ce qui peut devenir telle chose.
