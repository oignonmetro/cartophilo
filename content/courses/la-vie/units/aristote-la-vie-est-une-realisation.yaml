- id: "aristote-la-vie-est-une-realisation-l3"
  title: "L'âme n'est pas réductible au corps"
  notes: |-
    **Le paragraphe écarte le corps :** {red}**le corps ne saurait être l'âme**{/red}**, parce que le corps est** {pink}**ce qui a la vie**{/pink}**, sujet ou matière, et que l'âme est ce qu'il a.** C'est le pivot du texte, et il est très bref.

    **Deux arguments en un.** {sky}Shields{/sky} y lit deux éliminations successives, qui laissent à l'âme le seul sens restant :

    | Argument | Prémisses | Conclusion |
    | contre le composé | le corps vivant est une substance composée ; l'âme n'est pas un composé | l'âme n'est pas le corps vivant |
    | contre la matière | le corps est sujet et ne se dit pas d'un sujet ; l'âme se dit du corps | l'âme n'est pas le corps-matière |

    {sky}Polansky{/sky} le dit autrement : le corps pris {pink}comme simple corps{/pink} n'explique pas la vie, puisque d'autres corps ne vivent pas ; le corps pris {pink}comme corps vivant{/pink} l'expliquerait par une {red}tautologie{/red}, « un corps vivant vit parce qu'il est un corps vivant ». {green}__Il faut un principe qui ne soit ni l'un ni l'autre__{/green}.

    **La prémisse implicite.** Tout repose sur une donnée qu'Aristote ne discute pas : {amber}l'âme est ce qui confère la vie au corps{/amber}. Polansky remarque que, s'il l'avait explicitée, l'argument aurait l'air d'une {red}pétition de principe{/red}, ce qui expliquerait sa brièveté ; Shields juge qu'il ne suffit pas à lui seul, parce qu'en un sens le corps aussi « appartient » au composé.

    **Pour la vie,** le statut se précise : la vie est {pink}attribuée au corps{/pink} (« le corps a la vie »), donc {green}__son principe n'est pas du côté de ce qui la reçoit__{/green}.

    ! Le texte ne dit pas que l'âme est une réalité incorporelle séparée : il dit seulement qu'elle n'est pas le corps, comme la figure n'est pas le bronze.
  tables:
  - table: "argument-premisses-conclusion"
    exercises:
    - { kind: "bank", column: "Conclusion" }
