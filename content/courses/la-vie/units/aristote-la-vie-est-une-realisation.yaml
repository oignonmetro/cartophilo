id: aristote-la-vie-est-une-realisation
title: "Aristote : le principe de la vie n'est pas le corps"
subtitle: "De l'âme, II, 1"
icon: page
color: coral
lessons:
- id: aristote-la-vie-est-une-realisation-l1
  title: "Les trois sens de « substance » et les deux degrés de réalisation"
  notes: ""
  passage:
    label: ""
    text: "Nous exprimons bien un genre particulier de réalités en parlant de substance. Mais celle-ci s'entend, soit comme matière (chose qui, par soi, ne constitue pas une réalité singulière), soit comme aspect ou forme (en vertu de quoi, précisément, on peut parler d'une réalité singulière), soit, troisièmement, comme le composé des deux. Par ailleurs, la matière est puissance, alors que la forme est réalisation ; et ce, de deux manières, soit, comme la science, soit, comme l'acte de spéculer."
  points: [{id: aristote-la-vie-est-une-realisation-l1-p1, sentence: "« Nous exprimons bien un genre particulier de réalités en parlant de ___. »", answer: "substance", alt: []}, {id: aristote-la-vie-est-une-realisation-l1-p2, sentence: "« Mais celle-ci s'entend, soit comme matière (chose qui, par soi, ne constitue pas une ___), soit comme aspect ou forme (en vertu de quoi, précisément, on peut parler d'une réalité singulière), soit, troisièmement, comme le composé des deux. »", answer: "réalité singulière", alt: []}, {id: aristote-la-vie-est-une-realisation-l1-p3, sentence: "« Mais celle-ci s'entend, soit comme matière (chose qui, par soi, ne constitue pas une réalité singulière), soit comme aspect ou forme (en vertu de quoi, précisément, on peut parler d'une réalité singulière), soit, troisièmement, comme ___. »", answer: "le composé des deux", alt: []}, {id: aristote-la-vie-est-une-realisation-l1-p4, sentence: "« Nous exprimons bien un genre particulier de réalités en parlant de substance. Mais celle-ci s'entend, soit comme matière (chose qui, par soi, ne constitue pas une réalité singulière), soit comme aspect ou forme (en vertu de quoi, précisément, on peut parler d'une réalité singulière), soit, troisièmement, comme le composé des deux. Par ailleurs, la matière est ___, alors que la forme est réalisation ; et ce, de deux manières, soit, comme la science, soit, comme l'acte de spéculer. »", answer: "puissance", alt: []}, {id: aristote-la-vie-est-une-realisation-l1-p5, sentence: "« Nous exprimons bien un genre particulier de réalités en parlant de substance. Mais celle-ci s'entend, soit comme matière (chose qui, par soi, ne constitue pas une réalité singulière), soit comme aspect ou forme (en vertu de quoi, précisément, on peut parler d'une réalité singulière), soit, troisièmement, comme le composé des deux. Par ailleurs, la matière est puissance, alors que la forme est ___ ; et ce, de deux manières, soit, comme la science, soit, comme l'acte de spéculer. »", answer: "réalisation", alt: []}, {id: aristote-la-vie-est-une-realisation-l1-p6, sentence: "« Nous exprimons bien un genre particulier de réalités en parlant de substance. Mais celle-ci s'entend, soit comme matière (chose qui, par soi, ne constitue pas une réalité singulière), soit comme aspect ou forme (en vertu de quoi, précisément, on peut parler d'une réalité singulière), soit, troisièmement, comme le composé des deux. Par ailleurs, la matière est puissance, alors que la forme est réalisation ; et ce, de deux manières, soit, comme la ___, soit, comme l'acte de spéculer. »", answer: "science", alt: []}, {id: aristote-la-vie-est-une-realisation-l1-p7, sentence: "« Nous exprimons bien un genre particulier de réalités en parlant de substance. Mais celle-ci s'entend, soit comme matière (chose qui, par soi, ne constitue pas une réalité singulière), soit comme aspect ou forme (en vertu de quoi, précisément, on peut parler d'une réalité singulière), soit, troisièmement, comme le composé des deux. Par ailleurs, la matière est puissance, alors que la forme est réalisation ; et ce, de deux manières, soit, comme la science, soit, comme ___. »", answer: "l'acte de spéculer", alt: []}]
- id: aristote-la-vie-est-une-realisation-l2
  title: "Les corps vivants sont des substances"
  notes: ""
  passage:
    label: ""
    text: "Or, les substances, dans l'opinion, ce sont surtout les corps et, parmi eux, les corps naturels, car ils sont principes des autres. Mais, parmi les corps naturels, les uns ont la vie, cependant que les autres ne l'ont pas ; et par vie, nous voulons dire la propriété de par soi-même se nourrir, croître et dépérir. Si bien que tout corps naturel, ayant la vie en partage, peut être substance, une substance, cependant, comme on l'a dit, composée."
  points: [{id: aristote-la-vie-est-une-realisation-l2-p1, sentence: "« Or, les substances, dans l'opinion, ___ et, parmi eux, les corps naturels, car ils sont principes des autres. »", answer: "ce sont surtout les corps", alt: []}, {id: aristote-la-vie-est-une-realisation-l2-p2, sentence: "« Mais, parmi les corps naturels, les uns ont la vie, cependant que les autres ne l'ont pas ; et par vie, nous voulons dire ___. »", answer: "la propriété de par soi-même se nourrir, croître et dépérir", alt: []}, {id: aristote-la-vie-est-une-realisation-l2-p3, sentence: "« Si bien que tout corps naturel, ayant la vie en partage, peut être substance, une substance, cependant, comme on l'a dit, ___. »", answer: "composée", alt: []}, {id: aristote-la-vie-est-une-realisation-l2-p4, sentence: "« Or, les substances, ___, ce sont surtout les corps et, parmi eux, les corps naturels, car ils sont principes des autres. »", answer: "dans l'opinion", alt: []}]
- id: aristote-la-vie-est-une-realisation-l3
  title: "L'âme n'est pas réductible au corps"
  notes: ""
  passage:
    label: ""
    text: "Mais, puisque c'est précisément un corps qui a cette propriété, c'est-à-dire, possède la vie, le corps ne saurait être l'âme. Le corps, en effet, ne se range pas dans les réalités qui se disent d'un sujet, mais se présente plutôt comme sujet ou matière."
  points: [{id: aristote-la-vie-est-une-realisation-l3-p1, sentence: "« Mais, puisque c'est précisément un corps qui ___, c'est-à-dire, possède la vie, le corps ne saurait être l'âme. Le corps, en effet, ne se range pas dans les réalités qui se disent d'un sujet, mais se présente plutôt comme sujet ou matière. »", answer: "a cette propriété", alt: []}, {id: aristote-la-vie-est-une-realisation-l3-p2, sentence: "« Mais, puisque c'est précisément un corps qui a cette propriété, c'est-à-dire, ___, le corps ne saurait être l'âme. Le corps, en effet, ne se range pas dans les réalités qui se disent d'un sujet, mais se présente plutôt comme sujet ou matière. »", answer: "possède la vie", alt: []}, {id: aristote-la-vie-est-une-realisation-l3-p3, sentence: "« Mais, puisque c'est précisément un corps qui a cette propriété, c'est-à-dire, possède la vie, ___. Le corps, en effet, ne se range pas dans les réalités qui se disent d'un sujet, mais se présente plutôt comme sujet ou matière. »", answer: "le corps ne saurait être l'âme", alt: []}, {id: aristote-la-vie-est-une-realisation-l3-p4, sentence: "« Mais, ___ qui a cette propriété, c'est-à-dire, possède la vie, le corps ne saurait être l'âme. Le corps, en effet, ne se range pas dans les réalités qui se disent d'un sujet, mais se présente plutôt comme sujet ou matière. »", answer: "puisque c'est précisément un corps", alt: []}, {id: aristote-la-vie-est-une-realisation-l3-p5, sentence: "« Mais, puisque c'est précisément un corps qui a cette propriété, c'est-à-dire, possède la vie, le corps ne saurait être l'âme. Le corps, en effet, ne se range pas dans ___, mais se présente plutôt comme sujet ou matière. »", answer: "les réalités qui se disent d'un sujet", alt: []}, {id: aristote-la-vie-est-une-realisation-l3-p6, sentence: "« Mais, puisque c'est précisément un corps qui a cette propriété, c'est-à-dire, possède la vie, le corps ne saurait être l'âme. Le corps, en effet, ne se range pas dans les réalités qui se disent d'un sujet, mais se présente plutôt comme ___. »", answer: "sujet ou matière", alt: []}, {id: aristote-la-vie-est-une-realisation-l3-p7, sentence: "« Mais, ___. Le corps, en effet, ne se range pas dans les réalités qui se disent d'un sujet, mais se présente plutôt comme sujet ou matière. »", answer: "puisque c'est précisément un corps qui a cette propriété, c'est-à-dire, possède la vie, le corps ne saurait être l'âme", alt: []}]
- id: aristote-la-vie-est-une-realisation-l4
  title: "L'âme est la forme du corps"
  notes: ""
  passage:
    label: ""
    text: "Il faut donc nécessairement que l'âme soit substance comme forme d'un corps naturel qui a potentiellement la vie. Or cette substance est réalisation (entéléchie). Donc, elle est la réalisation d'un tel corps."
  points: [{id: aristote-la-vie-est-une-realisation-l4-p1, sentence: "« Il faut donc nécessairement que l'âme soit substance comme ___ qui a potentiellement la vie. Or cette substance est réalisation (entéléchie). Donc, elle est la réalisation d'un tel corps. »", answer: "forme d'un corps naturel", alt: []}, {id: aristote-la-vie-est-une-realisation-l4-p2, sentence: "« Il faut donc nécessairement que l'âme soit substance comme forme d'un corps naturel ___. Or cette substance est réalisation (entéléchie). Donc, elle est la réalisation d'un tel corps. »", answer: "qui a potentiellement la vie", alt: []}, {id: aristote-la-vie-est-une-realisation-l4-p3, sentence: "« Il faut donc nécessairement que l'âme soit substance comme forme d'un corps naturel qui a potentiellement la vie. Or cette substance est ___. Donc, elle est la réalisation d'un tel corps. »", answer: "réalisation (entéléchie)", alt: []}, {id: aristote-la-vie-est-une-realisation-l4-p4, sentence: "« Il faut donc nécessairement que l'âme soit substance comme forme d'un corps naturel qui a potentiellement la vie. Or cette substance est réalisation (entéléchie). Donc, elle est ___. »", answer: "la réalisation d'un tel corps", alt: []}, {id: aristote-la-vie-est-une-realisation-l4-p5, sentence: "« Il faut donc nécessairement ___. Or cette substance est réalisation (entéléchie). Donc, elle est la réalisation d'un tel corps. »", answer: "que l'âme soit substance comme forme d'un corps naturel qui a potentiellement la vie", alt: []}, {id: aristote-la-vie-est-une-realisation-l4-p6, sentence: "« Il faut donc nécessairement que l'âme soit substance comme forme d'un corps naturel qui a potentiellement la vie. Or cette substance est réalisation (entéléchie). Donc, ___. »", answer: "elle est la réalisation d'un tel corps", alt: []}]
