- id: "aristote-la-vie-est-une-realisation-l2"
  title: "Les corps vivants sont des substances"
  notes: |-
    **Le paragraphe établit que** {violet}**le corps vivant**{/violet} **est une substance, et une substance** {coral}**composée**{/coral}**.** Il le fait en trois pas, et donne au passage la seule définition de la vie que contienne le chapitre.

    **Premier pas : l'opinion.** {teal}« Les substances, dans l'opinion, ce sont surtout les corps »{/teal} : Aristote part de ce qu'on accorde, non d'une thèse à lui. La *Métaphysique* dit de même : {teal}« Selon l'opinion commune, la substance appartient le plus manifestement aux corps ; c'est pourquoi nous affirmons que les animaux, les plantes et leurs parties sont des substances »{/teal} (Z, 2, 1028b8-10). Parmi les corps, les {violet}corps naturels{/violet} passent avant, {teal}« car ils sont principes des autres »{/teal} : les objets de l'art sont faits d'eux.

    **Deuxième pas : certains vivent.** Et {teal}« par vie, nous voulons dire la propriété de par soi-même se nourrir, croître et dépérir »{/teal}. La définition est {amber}minimale{/amber} : elle ne retient que les {green}__fonctions nutritives__{/green}, communes à la plante et à l'animal, et elle {amber}comprend le dépérissement{/amber}. « De par soi-même » écarte ce qui grandit par apport du dehors : {yellow}le tas qui s'accroît{/yellow} ne se nourrit pas.

    **Troisième pas : la conclusion.** {coral}__Tout corps naturel qui a la vie est une substance composée__{/coral}, au sens posé en 412a8-9.

    **Pour la vie,** c'est sa {violet}définition{/violet} et son {violet}statut{/violet} : elle est {pink}une propriété qu'un corps a{/pink}, ce qui prépare le paragraphe suivant ; et elle se reconnaît à une {green}__activité qui part du vivant lui-même__{/green}.

    ! « Peut être substance » rend un optatif grec (`ousia an eiê`) : ce n'est pas une simple possibilité, c'est la conclusion, dite avec prudence.
  passage:
    label: "412a11-16"
    text: "Or, les substances, dans l'opinion, ce sont surtout les corps et, parmi eux, les corps naturels, car ils sont principes des autres. Mais, parmi les corps naturels, les uns ont la vie, cependant que les autres ne l'ont pas ; et par vie, nous voulons dire la propriété de par soi-même se nourrir, croître et dépérir. Si bien que tout corps naturel, ayant la vie en partage, peut être substance, une substance, cependant, comme on l'a dit, composée."
