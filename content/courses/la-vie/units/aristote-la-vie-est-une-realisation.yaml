- id: "aristote-la-vie-est-une-realisation-i2"
  title: "Les mots du texte : substance, matière, forme, réalisation"
  notes: |-
    **Le texte est écrit dans le vocabulaire de l'hylémorphisme, que la traduction de Bodéüs rend par des périphrases.** Les retrouver, c'est voir que chaque phrase met en place une pièce de la définition.

    | Dans le texte | Grec | Sens |
    | substance | `ousia` | ce qui est au premier sens, ce qui existe par soi |
    | matière | `hulê` | ce dont une chose est faite ; par soi, rien de déterminé |
    | aspect ou forme | `eidos` | ce qui fait d'une matière une chose déterminée |
    | réalité singulière | `tode ti` | un « ceci », une chose qu'on peut montrer |
    | puissance | `dunamis` | ce qui peut être ou faire, sans l'être encore |
    | réalisation | `entelecheia` | l'acte, la forme atteinte |
    | sujet | `hupokeimenon` | ce dont on dit quelque chose, ce qui est « dessous » |

    **« Se dire d'un sujet. »** La formule vient des *Catégories* : {teal}« Parmi les étants, les uns se disent d'un certain sujet, mais ne sont dans aucun sujet ; par exemple, homme se dit d'un sujet, tel homme »{/teal} (2, 1a20-22). Le *De l'âme* l'emploie plus largement : ce qui {violet}se dit d'un sujet{/violet}, c'est ce qu'on attribue à quelque chose, et {green}__le sujet dernier est la matière__{/green}. D'où l'opposition du paragraphe 412a16-19 : le corps est {pink}ce dont on dit qu'il vit{/pink}, l'âme {green}ce qu'on en dit{/green}.

    **Puissance et réalisation se répondent.** La matière n'est pas « rien » : elle {amber}peut devenir{/amber} telle chose, et la forme est ce qu'elle devient. Mais la réalisation a elle-même deux degrés, que le texte nomme sans encore s'en servir : {yellow}la science qu'on possède{/yellow}, {yellow}l'acte de spéculer{/yellow}. L'unité suivante (412a22-28) en tirera que l'âme est réalisation {coral}« première »{/coral}.

    ! « Forme » ne veut pas dire figure visible : c'est ce qui fait qu'une chose est ce qu'elle est.
