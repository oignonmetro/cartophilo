- id: "aristote-la-vie-est-une-realisation-o1"
  title: "Ce que le texte dit de la vie : une propriété du corps, un principe qui n'est pas lui"
  notes: |-
    **Le texte parle de l'âme, mais il donne sa seule définition de la vie, et il en fixe le statut.** Domaine par domaine :

    **La définition.** {teal}« Par vie, nous voulons dire la propriété de par soi-même se nourrir, croître et dépérir »{/teal} : {green}__vivre, c'est d'abord se nourrir__{/green}. C'est la {violet}vie nutritive{/violet}, celle {teal}« en vertu de laquelle la vie appartient à tous »{/teal} (II, 4, 415a25). La plante en est le cas le plus simple. II, 2 élargira : {teal}« le fait de vivre s'entend de plusieurs façons »{/teal} (413a22). La définition de 412a14 est donc {amber}un plancher, non une essence{/amber}.

    **Le statut ontologique.** La vie est {pink}une propriété qu'un corps a{/pink}, mais {green}__ce qui la lui donne n'est pas un corps__{/green}. Et le vivant est une {violet}substance{/violet}, au plein sens : la *Métaphysique* donne pour exemple de substances {teal}« un humain ou une plante ou autre chose de cette sorte que justement nous disons être au plus haut point des substances »{/teal} (Z, 7, 1032a18-19). {coral}__Le vivant n'est pas un agrégat de matière : il est l'exemple même de ce qui est.__{/coral}

    **Le statut épistémologique.** Aristote ne part pas d'une observation de la vie, mais de {amber}l'opinion{/amber} (« dans l'opinion ») et d'une {amber}division{/amber} : il atteint le principe de la vie {green}par élimination{/green}, non en le montrant.

    **Le vivant et l'inerte.** {teal}« Parmi les corps naturels, les uns ont la vie, cependant que les autres ne l'ont pas »{/teal} : {red}la vie n'est pas une propriété de tout corps{/red}. C'est ce qui interdit de la rapporter au corps comme tel.

    **La mort.** La définition {amber}contient le dépérissement{/amber} : {green}__décliner fait partie de la vie__{/green}, et c'est encore {teal}« de par soi-même »{/teal} que le vivant dépérit.

    | Question | Réponse du texte |
    | qu'est-ce que vivre ? | se nourrir, croître et dépérir de par soi-même |
    | qui vit ? | un corps naturel, substance composée |
    | qu'est-ce qui fait vivre ? | la forme de ce corps, non ce corps |
    | comment le sait-on ? | par élimination, à partir de l'opinion |

    ! La définition de 412a14 n'est pas celle de toute vie : elle ne retient que la vie nutritive, commune à tout vivant.
