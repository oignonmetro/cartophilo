- id: "aristote-la-vie-est-une-realisation-o2"
  title: "Le principe de la vie : Aristote face à Démocrite, Platon et Descartes"
  notes: |-
    **Dire que le principe de la vie n'est pas le corps, c'est prendre position entre deux camps** : ceux qui font de l'âme un corps, et ceux qui en font une chose séparée.

    **Démocrite : l'âme est un corps.** Pour lui, elle est {teal}« une sorte de feu et d'élément chaud »{/teal} : {teal}« Dans l'infinité des figures et des atomes, en effet, il parle de ceux qui sont sphériques en termes de feu et d'âme »{/teal} (I, 2, 404a1-3). Le texte lui répond : {red}__un corps ne peut pas être ce qui fait vivre un corps__{/red}.

    **Platon : l'âme apporte la vie.** Dans le *Phédon* (105c-d), l'âme est ce qui, présent dans un corps, le rend vivant ; Socrate en tire qu'elle {pink}ne peut recevoir la mort{/pink}, donc qu'elle est immortelle. Aristote garde {green}l'âme principe de la vie{/green}, mais {red}refuse qu'elle soit une chose qui entre dans un corps{/red} : elle en est la forme.

    **Descartes : la vie revient au corps.** L'article 4 des *Passions de l'âme* a pour titre : {teal}« Que la chaleur et le mouvement des membres procèdent du corps, et les pensées de l'âme »{/teal}. {pink}__Le principe de la vie est rendu au corps__{/pink}, et l'âme réduite à la pensée : c'est l'exact renversement du texte, où {green}l'âme est d'abord ce par quoi un corps se nourrit{/green}.

    | Auteur | L'âme | Le principe de la vie |
    | Démocrite | un corps, des atomes de feu | un corps |
    | Platon (*Phédon*) | une chose distincte qui entre dans le corps | l'âme |
    | Aristote | la forme du corps | l'âme, comme forme |
    | Descartes | la pensée | le corps |

    ! Aristote n'est pas pour autant du côté de Descartes : refuser que l'âme soit une chose ne revient pas à rendre la vie au corps.
