# Unité de texte (voir content/textes.md) : Aristote, De l'âme, II, 1,
# 412a6-22, trad. Bodéüs (Œuvres complètes, Flammarion). Titres et cartes-citation
# de l'utilisateur ; rappels, introductions, cartes-explication et prolongements
# écrits sans commentaire suivi, d'après l'édition et le notebook « Aristote :
# la vie » (Shields, Polansky, Bermúdez). Suite : -premiere (412a22-b9), puis
# aristote-ame-vue-oeil (412b10-413a3).

id: aristote-la-vie-est-une-realisation
title: "Aristote : le principe de la vie n'est pas le corps"
subtitle: "De l'âme, II, 1"
icon: page
color: coral
intro: |-
  L'ouverture de la définition de l'âme (II, 1, 412a6-22). Aristote part des sens de « substance », pose que les corps vivants sont des substances composées, et en conclut que ce qui les fait vivre ne peut pas être leur corps : c'est leur forme, c'est-à-dire leur réalisation.
lessons:
- id: "aristote-la-vie-est-une-realisation-i1"
  title: "Ce qui fait vivre un corps ne peut pas être ce corps : la thèse et le plan"
  notes: |-
    **Le texte répond à la question** {amber}**« qu'est-ce que l'âme ? »**{/amber}**, posée ici pour la première fois en propre :** {violet}**l'âme**{/violet} **est** {coral}**la substance comme forme d'un corps naturel qui a potentiellement la vie**{/coral}**, donc sa réalisation.** Après un livre entier consacré à « la tradition de nos devanciers », Aristote revient {teal}« au point de départ, pour tâcher de définir ce qu'est l'âme et ce que peut être sa formule la plus commune »{/teal} (412a3-6). Il ne cherche pas l'âme directement : il part des {yellow}corps vivants{/yellow}, que tout le monde tient pour des substances, et demande ce qui, en eux, fait qu'ils vivent.

    La thèse réunit deux affirmations. L'une est **négative** : {red}__le corps ne saurait être l'âme__{/red}, parce que le corps est {pink}ce qui a la vie{/pink}, non {green}ce par quoi il l'a{/green}. L'autre est **positive** : l'âme est {green}__la forme__{/green}, et la forme est {violet}réalisation{/violet} (`entelecheia`). La première ne suffit pas à la seconde : écarter le corps ne dit pas encore ce qu'est l'âme. Il faut la division de la substance, posée en tête, pour que l'élimination conclue.

    Le texte va donc des instruments à la conclusion. **Les lignes** {teal}**412a6-10**{/teal} **posent** {violet}**les sens de « substance »**{/violet}. **Les lignes** {teal}**412a11-16**{/teal} **font du** {violet}**corps vivant**{/violet} **une substance composée**, et donnent au passage une définition de la vie. **Les lignes** {teal}**412a16-19**{/teal} **écartent le corps**, et **les lignes** {teal}**412a19-22**{/teal} **concluent sur la forme**.

    | Mouvement | Lieu | Ce qui s'y joue |
    | distinguer les trois sens de « substance » et les deux sens de « réalisation » | 412a6-10 | la substance est matière, forme ou composé ; la matière est puissance, la forme réalisation, à la manière de la science ou de l'acte de spéculer |
    | établir que le corps vivant est une substance, et une substance composée | 412a11-16 | les corps naturels sont les substances les plus manifestes ; certains ont la vie, c'est-à-dire se nourrissent, croissent et dépérissent par eux-mêmes : ce sont des composés |
    | écarter le corps comme principe de la vie | 412a16-19 | le corps est ce qui a la vie, sujet ou matière : il ne peut donc pas être ce qui la lui donne |
    | conclure que l'âme est forme, donc réalisation | 412a19-22 | reste le troisième sens : l'âme est la substance comme forme d'un corps naturel qui a potentiellement la vie, et la forme étant réalisation, elle est la réalisation de ce corps |

    **Contre qui ?** Le livre I a passé en revue ceux qui font de l'âme {red}un corps{/red} : pour {sky}**Démocrite**{/sky}, elle est {teal}« une sorte de feu et d'élément chaud »{/teal}, faite des atomes sphériques (I, 2, 403b31-404a2) ; d'autres l'ont faite air, eau ou sang. C'est ce matérialisme que le texte écarte. Il prépare aussi la réponse à {sky}**Platon**{/sky} : une forme est forme {green}de ce corps{/green}, et la suite du chapitre dira l'âme {teal}« non séparable du corps »{/teal} (413a4).

    ! « Le corps ne saurait être l'âme » ne fait pas de l'âme une seconde chose logée dans le corps : elle en est la forme, comme la figure n'est pas le bronze sans être une chose à côté de lui.
