- id: "aristote-la-vie-est-une-realisation-l4"
  title: "L'âme est la forme du corps"
  notes: |-
    **Le paragraphe conclut :** {violet}**l'âme**{/violet} **est** {coral}**substance comme forme**{/coral} **d'un corps naturel qui a potentiellement la vie, et donc sa** {coral}**réalisation**{/coral}**.**

    **Un syllogisme en trois temps.**

    | Étape | Énoncé |
    | conclusion de l'élimination | l'âme est substance comme forme d'un corps naturel qui a potentiellement la vie |
    | prémisse posée en 412a10 | la substance comme forme est réalisation |
    | conclusion | l'âme est la réalisation d'un tel corps |

    **« Il faut donc nécessairement. »** La nécessité vient de l'{amber}exhaustivité{/amber} de la division : la substance n'ayant que trois sens, et l'âme n'étant ni la matière ni le composé, {green}__il ne lui reste que la forme__{/green}.

    **« Qui a potentiellement la vie. »** La formule apparaît ici pour la première fois. Le corps est la matière, donc {violet}puissance{/violet} : ce qui peut vivre, et vit par l'âme. Ce que veut dire au juste ce « potentiellement » ne sera précisé qu'à la fin du chapitre (412b25-26).

    **Pour la vie,** la conclusion lui donne son principe : {coral}__ce qui fait vivre un corps est sa forme, non sa matière__{/coral}. Le titre de l'unité le dit : {green}le principe de la vie n'est pas le corps{/green}.

    ! « Qui a potentiellement la vie » ne désigne pas un corps sans âme qui attendrait de vivre : la fin du chapitre précisera que la puissance de vivre suppose l'âme.
