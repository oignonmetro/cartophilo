- id: jonas-hypotheques-p1
  title: "De l'hypothèque à la responsabilité"
  notes: |-
    **Le paragraphe va d'un constat sur ce que nous faisons à une refonte de l'éthique : nous engageons la vie de ceux qui viendront, il faut donc le faire avec équité, et cette échelle nouvelle de nos actes met la responsabilité au centre de la morale.**

    | Extrait | Ce qu'il fait |
    | Nous posons des hypothèques | constate : l'avenir engagé pour le présent |
    | Peut-être ne pouvons-nous pas | concède, puis exige : soin et équité |
    | L'essentiel ici | nomme la nouveauté et sa catégorie |
    | Que celle-ci soit | conclut : un nouveau chapitre, à la mesure du pouvoir |

    === 1 L'avenir engagé pour des besoins présents

    **Nous engageons l'avenir pour le présent, et pour un présent que nous avons nous-mêmes fabriqué.** Une {yellow}hypothèque{/yellow} grève un bien en garantie d'un emprunt : on jouit aujourd'hui, et le bien répond de la dette. L'image dit que __d'autres paieront__ : ceux qui viendront.

    Hypothéquer la vie future signifie d'abord **miser sur l'avenir** : la recherche s'inscrit dans le temps long de son développement et se fonde sur l'intention louable d'améliorer le sort de l'humanité. Mais elle {red}ne saurait anticiper l'ensemble des conséquences{/red} de ses découvertes. D'où le durcissement : bien plutôt que d'hypothéquer l'avenir, c'est-à-dire de formuler des hypothèses à son sujet, nous le {red}sacrifions{/red} tout simplement, car le progrès risque de nous le faire perdre entièrement. L'avenir devient {violet}hypothétique{/violet} en un autre sens : plus rien ne peut garantir sa réalité. Et le **centre de gravité** de la recherche n'est pas dans l'avenir : il s'ancre dans le présent, dans les avantages et besoins à court terme qui le définissent.

    **La précision « produits par nous-mêmes » aggrave le constat.** Elle désigne la séduction de certaines découvertes dont nous voudrions jouir immédiatement, sans mesurer les conséquences à long terme : ces besoins, dit *Pour une éthique du futur*, ne sont {red}pas naturels et vitaux{/red}, mais le fait d'un développement historique et culturel. Nous risquons l'avenir non pour survivre, mais pour ce que nous avons nous-mêmes rendu désirable.

    ! L'hypothèque n'est pas la simple prévision d'un risque : elle est un engagement de l'avenir, déjà contracté dans nos décisions présentes.

    === 2 On ne peut s'en abstenir, mais on doit le faire avec équité

    **La concession est décisive : Jonas ne demande pas de renoncer à la technique, mais de garder ouverte la possibilité de lever la dette.** La technique est {green}indissociable de l'homme{/green}, de son évolution et de son histoire ; il s'agit donc d'en limiter les effets négatifs. D'où sa question dans le même article : qu'est-ce qui est admissible dans nos paris techniques, quels sont les {violet}risques raisonnables{/violet} ?

    **L'équité ne défend pas d'emprunter ; elle défend de rendre la dette impossible à rembourser.** Le critère est précis : que la {coral}chance de lever l'hypothèque{/coral} ne soit pas d'avance compromise, autrement dit que la situation ne devienne pas {red}irréversible{/red}.

    **L'équité prépare la responsabilité.** Elle consiste à agir comme si nous étions {violet}liés par une dette{/violet} envers notre descendance. Obligation {red}paradoxale{/red} : elle est contractée à l'égard d'un acteur qui n'existe pas encore et ne peut exercer aucune contrainte sur nous, de sorte que nous pourrions nous en affranchir. Les soins extrêmes prennent alors une forme concrète : une responsabilité qui anticipe les risques à long terme, ce que Jonas appelle {teal}« la futurologie de l'avertissement »{/teal}.

    ! « Peut-être » n'affaiblit pas l'exigence : même si l'on ne peut éviter d'hypothéquer, l'obligation demeure, et c'est précisément ce cas qu'elle vise.

    === 3 La nouveauté : l'échelle de nos décisions quotidiennes

    **Ce qui est nouveau n'est pas l'acte, mais son échelle : l'aspect purement quantitatif de l'action technique et de ses effets acquiert une signification morale.** Il ne s'agit plus d'un effet d'accumulation qui deviendrait mauvais à la fin : aujourd'hui *chaque* application d'une aptitude technique tend à se faire à {coral}« grande échelle »{/coral}.

    **« Quotidiennes » compte autant que « globale ».** Le problème n'est pas réservé aux décisions exceptionnelles ; c'est, écrit Jonas ailleurs, {teal}« le simple exercice quotidien de notre pouvoir »{/teal} qui {teal}« devient un problème éthique »{/teal}. **Dans l'espace**, la société industrielle qui exploite massivement les ressources de la planète met en péril la nature où nous vivons. **Dans le temps**, la manipulation génétique introduit {teal}« d'un coup et dès la première étape »{/teal}, dans une cellule reproductive, {teal}« toute une descendance d'organismes modifiés »{/teal}.

    **La responsabilité est appelée en premier lieu, parce que l'éthique des actes proches ne suffit plus.** Il ne s'agit pas seulement de répondre de nos actes proches et des infractions qu'ils constituent, mais de garder à l'esprit une plus vaste responsabilité, qui gouverne nos choix en vue de la {green}préservation de la vie{/green} au nom de l'humanité et des générations à venir. La bioéthique se confondrait ainsi avec ce souci de la responsabilité.

    ! La nouveauté tient à l'échelle, non à l'intention : une décision ordinaire et bien intentionnée reste engagée par la dimension globale de ses effets.

    === 4 Un nouveau chapitre : la responsabilité à la mesure du pouvoir

    **La responsabilité n'est pas inventée, mais elle devient le centre : « comme jamais auparavant ».** Jonas repense la notion : non plus devoir répondre d'un acte précis, déterminé dans l'espace et le temps, mais un {green}engagement plus global{/green} qui ne se relie pas à l'immédiateté de l'action. C'est une catégorie éthique originale, qui redéfinit l'éthique.

    **La dernière phrase donne la loi de cette éthique.** Responsabilité et pouvoir sont {coral}le revers l'un de l'autre{/coral} : plus le pouvoir est grand, plus la responsabilité qu'il implique est grande. Jamais aucune époque n'a disposé d'une telle *puissance*, donc d'une telle *responsabilité*, qui ne peut s'exercer sans un *savoir*. Or la **préscience** reste toujours {red}en retard sur le rayon d'action de la puissance{/red} : il subsiste un excédent d'imprévisible, d'autant plus important que la puissance est considérable. L'exigence croît donc avec le pouvoir, alors même que le savoir ne suit pas.

    ! La responsabilité croît avec « les actions du pouvoir », non avec notre connaissance de leurs effets : elle porte aussi sur ce que nous n'en prévoyons pas.
  passage:
    label: "§1"
    text: "Nous posons des hypothèques sur la vie future au nom d'avantages et de besoins présents à court terme – et en l'occurrence des besoins produits par nous-mêmes. Peut-être ne pouvons-nous pas entièrement éviter d'agir de cette façon-là. Mais si c'est le cas, alors nous devons déployer des soins extrêmes pour le faire avec équité pour notre descendance, c'est-à-dire de façon que leur chance de lever l'hypothèque ne soit pas d'avance compromise. L'essentiel ici est que l'introduction d'une dimension globale dans l'espace et dans le temps au sein de nos décisions pratiques quotidiennes est une nouveauté éthique, que la technique nous a imposée ; et la catégorie éthique appelée en premier lieu par ce nouveau fait est la responsabilité. Que celle-ci soit le point de mire de la scène éthique, comme jamais auparavant, ouvre un nouveau chapitre dans l'histoire de l'éthique, reflétant les nouveaux ordres de grandeur du pouvoir, que l'éthique doit dès maintenant prendre en compte. Les exigences demandées à notre responsabilité croissent proportionnellement avec les actions du pouvoir."
