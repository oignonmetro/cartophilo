# Unité de texte (voir content/textes.md) : Jonas, « En quel sens la technique
# moderne est un objet pour l'éthique », passage transcrit du scan d'Alexandre
# Bies, « La bioéthique : Hans Jonas ou la responsabilité face au vivant ».
# Cartes-explication tirées de ce commentaire, là où il porte sur le passage.
# Le reste du chapitre (les autres points de l'article, la naissance de la
# bioéthique, les auteurs convoqués) fait le cours jonas1 à jonas3, piste Idées ;
# la citation « L'homme est le seul être connu de nous… » y est dans jonas2-l5.

id: jonas-hypotheques
title: "Jonas : des hypothèques sur la vie future"
subtitle: "Jonas, « En quel sens la technique moderne est un objet pour l'éthique »"
icon: page
color: coral
intro: |-
  Un paragraphe où Jonas dit pourquoi la technique moderne oblige à refaire l'éthique : nous engageons la vie future pour des besoins présents, cette dimension globale de nos décisions quotidiennes est une nouveauté éthique, et elle appelle en premier lieu la responsabilité, qui croît avec le pouvoir.
lessons:
- id: jonas-hypotheques-i1
  title: "La thèse, la question, la place du texte"
  notes: |-
    **Le texte répond à la question : pourquoi la technique moderne est-elle un objet pour l'éthique ?** Parce qu'elle donne à nos décisions les plus ordinaires une {violet}dimension globale{/violet} dans l'espace et dans le temps, ce qui appelle une catégorie morale première, {green}la responsabilité{/green}.

    Le paragraphe avance en trois temps, de statut différent. Il pose un **diagnostic** : le progrès perpétuel de la technique revient à {red}hypothéquer l'avenir{/red} pour satisfaire des besoins présents. Il en tire une **exigence** : puisqu'on ne peut renoncer à la technique, il faut la limiter pour que ses effets puissent être corrigés, avec soin et équité envers les générations futures. Il en donne enfin **la raison** et la portée : l'échelle de nos actes est une nouveauté éthique, qui ouvre un {coral}nouveau chapitre{/coral} de la morale. Le diagnostic ne suffit pas à fonder l'exigence : un mal qu'on ne pourrait ni éviter ni limiter ne donnerait lieu à aucun devoir. D'où la dernière phrase, qui mesure la responsabilité au pouvoir.

    **Sa place dans l'article.** Jonas y souligne cinq points qui font de la technique moderne un objet pour l'éthique, et le passage évoque principalement la dimension globale :

    | Point de l'article | Ce qu'il établit |
    | Ambivalence des effets | le bon et le mauvais sont inséparables |
    | Application inévitable | ce qui est possible passe à l'acte |
    | Dimension globale | l'espace et le temps entrent dans nos décisions |
    | Rupture avec l'anthropocentrisme | l'homme devient objet de la technique |
    | Question métaphysique | pourquoi doit-il y avoir une humanité ? |

    **Contre qui ?** Jonas vise une éthique qui se bornerait à {red}répondre d'un acte précis, déterminé dans l'espace et le temps{/red}. Et il dessine une voie moyenne dans l'opposition entre {pink}bioconservateurs{/pink}, qui organisent la résistance, et {pink}technoprophètes{/pink} ou transhumanistes, qui préparent l'arrivée des nouvelles avancées : {green}ne pas abandonner la technique à son libre cours, mais donner un cadre éthique à l'agir humain{/green}.

    ! Le texte ne condamne pas la technique : il tient pour acquis qu'on ne pourra pas y renoncer, et demande à quelles conditions s'en servir.
