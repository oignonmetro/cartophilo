- id: bichat-vie-mort-p3
  title: "Les âges de la vie et la mort naturelle"
  notes: |-
    **Le paragraphe développe la variation annoncée : les** {violet}**trois âges**{/violet} **sont** {amber}__**trois proportions**__{/amber} __**de l'**__{amber}__**action**__{/amber} __**et de la**__ {amber}__**réaction**__{/amber}**, et la mort naturelle est le moment où toute proportion cesse.** Il vérifie ainsi la définition sur l'histoire entière d'une vie, et résout la difficulté laissée par le §2 : comment un principe « permanent » de réaction peut-il laisser le vivant mourir ? Réponse : il demeure, mais décroît.

    | Âge | Rapport | Ce qu'on en voit |
    | l'enfant | la réaction surpasse l'action | surabondance de vie |
    | l'adulte | équilibre | la turgescence vitale disparaît |
    | le vieillard | la réaction diminue, l'action reste la même | la vie languit, jusqu'au terme naturel |

    === 1 L'enfant et l'adulte

    **La croissance s'explique par un excès de la réaction sur l'action.** Chez l'{yellow}__enfant__{/yellow}, le vivant fait plus que se maintenir : il y a {yellow}« surabondance de vie »{/yellow}, dont la {yellow}croissance{/yellow} est le signe. La {violet}« turgescence vitale »{/violet} (le gonflement, la plénitude d'un corps qui croît) en est l'image physiologique. Chez l'{yellow}adulte{/yellow}, action et réaction s'équilibrent : {yellow}le corps se conserve sans croître{/yellow}, et cette turgescence disparaît « par là même », c'est-à-dire par l'effet même de l'{yellow}__équilibre__{/yellow}.

    Aristote définissait déjà la vie par le fait de se nourrir, de croître et de dépérir par soi-même (*De l'âme*, II, 1, 412a14) ; Bichat donne à cette courbe une explication : __croître et dépérir sont les deux pentes d'un même rapport de forces__.

    ! L'{yellow}équilibre de l'adulte{/yellow} n'est pas un repos : c'est {amber}une lutte où les forces se compensent{/amber}.

    === 2 Le vieillard et la mort naturelle

    **Chez le** {yellow}**vieillard**{/yellow}**,** {amber}**seule la réaction diminue**{/amber} **: l'histoire de la vie est celle de son principe interne.** L'incise « l'action des corps extérieurs restant la même » est décisive : __le dehors ne devient pas plus hostile avec l'âge, c'est__ {yellow}__le dedans qui faiblit__{/yellow}. La {violet}mort naturelle{/violet} ne vient donc pas d'{pink}un accident extérieur{/pink} ; elle sort de la vie même, de {amber}l'épuisement de sa force de résistance{/amber}. Bichat le dira ailleurs : « Il est de la nature des propriétés vitales de s'épuiser » (*Anatomie générale*, discours préliminaire, § 3).

    « Insensiblement » fait de la {violet}mort{/violet} un {amber}**processus**{/amber}, non un {pink}instant{/pink}. Bichat s'inscrit dans une tradition que Huneman fait remonter à Haller et à Buffon (« De la vieillesse et de la mort », *Histoire naturelle de l'homme*) : __la mort commence presque avec la vie, vient du dedans__, et {amber}la mort proprement dite n'est que le terme de ce travail{/amber} ; Buffon écrit que {teal}« {/teal}nous commençons de {teal}vivre par degrés{/teal} et {teal}nous finissons de mourir comme nous commençons de vivre »{/teal}. Plus loin dans la première partie (art. 10), Bichat décrit cette « fin naturelle » : la {yellow}vie animale{/yellow} (sensation, mouvement) meurt la première, la {yellow}vie organique{/yellow} ensuite.

    Le terme arrive « lorsque toute proportion cesse » : il n'y a plus de rapport, parce qu'il n'y a plus de réaction. __Le corps n'est plus qu'exposé à l'action des forces extérieures__ ; il redevient {violet}un corps brut{/violet}. Le « terme naturel » distingue enfin cette mort de la mort accidentelle, dont la seconde partie des *Recherches* étudiera la forme violente.

    Synthèse du paragraphe : la définition rend compte de toute la durée d'une vie. La mort n'est pas seulement l'adversaire extérieur de la vie ; __la vie elle-même, par le déclin de sa réaction, s'achemine vers elle__.

    ! Bichat ne dit pas ici pourquoi la réaction décroît : il le constate, comme il constate le principe sans en connaître la nature.
  passage:
    label: "§3"
    text: "Il y a surabondance de vie dans l'enfant, parce que la réaction surpasse l'action. L'adulte voit l'équilibre s'établir entre elles, et par là même cette turgescence vitale disparaître. La réaction du principe interne diminue chez le vieillard, l'action des corps extérieurs restant la même ; alors la vie languit et s'avance insensiblement vers son terme naturel, qui arrive lorsque toute proportion cesse."
