- id: bichat-vie-mort-p2
  title: "Le milieu hostile et le principe de réaction"
  notes: |-
    **Le « en effet » annonce la justification de la définition : si la vie est résistance, c'est que le vivant est sans cesse menacé de destruction.** Le paragraphe procède en trois temps : il décrit le {amber}mode d'existence du vivant{/amber}, en infère {amber}un principe de réaction{/amber}, puis dit {coral}comment ce principe se connaît{/coral}.

    | Fragment | Ce qu'il fait |
    | 1 | poser le mode d'existence du vivant : tout ce qui l'entoure tend à le détruire |
    | 2 | nommer les sources de destruction, et inférer un principe permanent de réaction |
    | 3 | identifier ce principe à la vie, inconnu en nature, connu par l'alternative d'action et de réaction |

    === 1 Le mode d'existence du vivant

    **Être vivant, c'est exister au milieu de ce qui tend à vous détruire.** Bichat ne dit pas que le {amber}vivant{/amber} rencontre {pink}parfois{/pink} des {amber}dangers{/amber}, mais que telle est {green}sa manière même d'exister{/green} : __la menace est universelle__ (« tout ce qui les entoure ») et __constante__. Le {coral}vivant{/coral} se {coral}définit{/coral} ainsi par une {coral}**relation** à ce qui l'entoure{/coral}, et {pink}non par ce qu'il est en lui-même{/pink} ; Huneman voit, dans cette attention au rapport du vivant au monde, une perspective parente du concept de {violet}**milieu**{/violet}, dont on trouve à la même époque des linéaments chez Lamarck.

    « Tend » est décisif : __les forces extérieures ne détruisent pas le vivant, elles y tendent__. La destruction est une tendance toujours à l'œuvre, que quelque chose contrarie.

    ! Le milieu n'est pas hostile par accident : c'est le « mode d'existence » des vivants que d'y être exposés.

    === 2 Deux sources de destruction, un principe de réaction

    **La** {violet}**menace**{/violet} **a** __**deux sources**__**, et la persistance du vivant suppose en lui une force contraire.** D'abord les {red}**corps inorganiques**{/red}, c'est-à-dire les forces physiques et chimiques, qui agissent « sans cesse » ; ensuite les {red}**vivants**{/red} eux-mêmes, qui agissent « les uns sur les autres » d'une action continuelle ({yellow}l'un se nourrit de l'autre, l'un blesse ou infecte l'autre{/yellow}).

    L'argument est un **contrefactuel** : {teal}« {/teal}bientôt {teal}ils succomberaient{/teal} s'ils n'avaient en eux {teal}un principe permanent de réaction »{/teal}. Or __ils ne succombent pas__, ou pas aussitôt ; il y a donc en eux un tel principe. La prémisse implicite est le cœur du vitalisme : {coral}**les forces physiques ne peuvent rendre raison de la conservation du vivant**, __puisqu'elles tendent toujours à le dégrader__{/coral}. Il faut {amber}une force d'une autre nature{/amber}, et qui soit « en eux » : la résistance vient du dedans.

    Soumis à l'{pink}action perpétuellement dégradante des forces physiques{/pink}, __le corps vivant doit avoir__ {green}un « principe permanent de réaction »{/green} ; ainsi la {violet}vie{/violet} se caractérise par un principe de résistance aux forces physiques, qui tendent à la détruire.

    ! « Permanent » veut dire présent tant que le corps vit, non invariable : la fin du paragraphe annonce que ses proportions varient.

    === 3 Un principe connu par ses phénomènes

    **Le principe de réaction est le** {coral}**principe de la vie**{/coral}**, mais Bichat refuse d'en dire la nature :** {amber}**on ne le connaît que par ses effets**{/amber}**.** C'est la thèse épistémologique du texte. Bichat n'avance {pink}aucune thèse sur la nature de la force vitale{/pink} ; il constate la dualité des forces à partir de phénomènes qui sont « d'action et de réaction ». La démarche est celle de {coral}la science moderne, qui connaît une force par les phénomènes{/coral} qu'elle produit {pink}sans prétendre en saisir l'essence{/pink}.

    Le plus général de ces phénomènes est l'{coral}« alternative habituelle »{/coral} (au sens d'alternance) d'{coral}action{/coral} des corps extérieurs et de {coral}réaction{/coral} du corps vivant. La vie n'est donc pas un état stable, mais un **va-et-vient** continuel entre {red}ce que le dehors fait au vivant{/red} et {green}ce que le vivant lui oppose{/green}. La dernière proposition sert de transition : les proportions de cette alternative « varient suivant l'âge », ce que le §3 va développer.

    Synthèse du paragraphe : la définition est fondée. La {violet}vie{/violet} est {coral}résistance{/coral} parce que le vivant est exposé à une destruction constante, et {amber}cette résistance, inconnue dans sa nature, se donne à connaître comme un rapport d'action et de réaction{/amber}.

    ! Le « principe de la vie » n'est pas une âme ni une substance : Bichat le pose comme ce que supposent les phénomènes, sans rien affirmer de sa nature.
  passage:
    label: "§2"
    text: "Tel est en effet le mode d'existence des corps vivants, que tout ce qui les entoure tend à les détruire. Les corps inorganiques agissent sans cesse sur eux ; eux-mêmes exercent les uns sur les autres une action continuelle ; bientôt ils succomberaient s'ils n'avaient en eux un principe permanent de réaction. Ce principe est celui de la vie ; inconnu dans sa nature, il ne peut être apprécié que par ses phénomènes ; or le plus général de ces phénomènes est cette alternative habituelle d'action de la part des corps extérieurs, et de réaction de la part du corps vivant, alternative dont les proportions varient suivant l'âge."
