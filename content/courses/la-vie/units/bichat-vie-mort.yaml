- id: bichat-vie-mort-p1
  title: "La définition : un aperçu général, non des considérations abstraites"
  notes: |-
    **Bichat oppose deux manières de définir la vie : par des** {red}**« considérations abstraites »**{/red}**, ou par un** {green}**« aperçu général »**{/green}**.** Le second recueille {green}ce que tous les phénomènes de la vie ont de commun{/green}. La définition ne prétend donc pas atteindre {red}l'essence{/red} : elle généralise ce qu'on observe. Le « je crois » marque la {amber}prudence{/amber} de cette méthode, qui propose plus qu'elle ne démontre.

    **Que visent les « considérations abstraites » ?** Trois pistes, de la plus sûre à la plus fragile :

    | Piste | Ce qui l'appuie | Sa limite |
    | la recherche des causes premières | Bichat refuse un « principe de vie », contre Barthez, car les « causes premières » sont inaccessibles et inutiles (I, art. 7, § 1) | ces textes ne portent pas sur cette phrase |
    | ce qui ne repose sur rien d'observable | *Anatomie générale* : une division qui repose « non sur des abstractions mais des différences de structure intime » | le mot y vise les tissus, non la définition de la vie |
    | l'âme comme explication | Stahl pose une âme « d'ordre spirituel » et réclame de la vie « une définition logique » | la formule de Stahl est identique à celle de Bichat dans la lettre : Bichat écarterait l'âme, non la formule |

    Le {red}mécanisme{/red} n'entre pas dans cette liste : ce que Bichat lui reproche est d'avoir importé en physiologie l'attraction et l'impulsion, propriétés de la physique. L'abstraction n'est pas non plus une faute en soi : __l'anatomie générale elle-même « une abstraction », puisque « aucun tissu n'existe isolément »__. Et le reproche peut se retourner : pour Claude **Bernard** (*Introduction à l'étude de la médecine expérimentale*, 1865), parler seulement de la vie est « une abstraction : une force qui apparaît comme étant en dehors de la matière », ce qui atteint la force vitale de Bichat.

    La définition tient en trois termes, qui annoncent toute la suite :

    | Terme | Ce qu'il engage |
    | « ensemble » | la vie est plurielle : une somme d'activités, non un principe unique (la division en deux vies suit aussitôt) |
    | « fonctions » | la vie est ce que fait le corps, non une chose qu'il contient : on la saisit dans son exercice |
    | « qui résistent à la mort » | la vie se définit par son contraire : elle n'est pas un état, mais une lutte |

    **La mort entre ainsi dans la définition même de la vie.** C'est l'étrangeté que relève Huneman : la physiologie classique, depuis **Fernel** (1645), étudiait positivement « la nature de l'homme sain » ; Bichat la rapporte à ce qui la menace. La mort désigne ici la destruction du corps vivant par ce qui l'entoure ; le paragraphe suivant devra montrer que cette menace est constante.

    ! « Résister à la mort » ne veut pas dire la vaincre : la résistance est temporaire, et le §3 montrera qu'elle s'épuise.
