- id: bichat-vie-mort-o2
  title: "La vie, détour vers la mort ou somme de forces"
  notes: |-
    **Deux prolongements font voir ce que la** {violet}**définition**{/violet} **engage pour** {coral}**la conduite d'une vie**{/coral} **et pour** {coral}**le sens même du vivre**{/coral}**.**

    **La vie comme** {violet}**somme de forces**{/violet}**.** Plus loin dans la première partie, Bichat pose qu'{teal}« {/teal} une {teal}somme déterminée de force{/teal} {teal} »{/teal} a été répartie à la {violet}vie animale{/violet}, qui doit « rester toujours la même » : __l'activité d'un organe suppose l'inaction des autres__. La {red}société{/red}, qui nous fait vivre hors de nous-mêmes et abuse ainsi de la vie animale, {coral}**raccourcit la durée de la vie**{/coral} : la vie animale dépensée avec excès rétrécit d'autant la {violet}vie organique{/violet} (*Recherches*, I, art. 8 et 10). {amber}La réaction du vivant n'est donc pas inépuisable{/amber} : la manière de conduire sa vie en règle la durée.

    **Freud : la vie comme** {violet}**détour vers la mort**{/violet}**.** {sky}Huneman{/sky} place en exergue de son livre un passage d'*Au-delà du principe de plaisir* : la substance vivante aurait d'abord été {teal}« recréée sans cesse »{/teal} et serait « morte facilement », jusqu'à ce que des {red}influences externes{/red} l'obligent à faire {teal}« des détours toujours plus compliqués »{/teal} pour atteindre son but, la mort ; ces détours seraient {coral}ce qui nous apparaît comme phénomènes vitaux{/coral}. Chez Bichat, {green}la vie résiste à la mort qui vient du dehors{/green} ; chez {sky}Freud{/sky}, {pink}elle tend d'elle-même vers la mort{/pink}, et ce sont les influences externes qui l'en détournent. Huneman y voit la transformation opérée par Bichat poussée « à ses limites extrêmes ».

    | | Bichat | Freud |
    | la mort vient | du dehors (forces physiques) | du dedans (le but de la vie) |
    | la vie est | résistance à la mort | détour vers la mort |
    | les influences externes | menacent la vie | allongent le chemin vers la mort |

    ! Freud ne contredit pas simplement Bichat : il garde le lien de la vie et de la mort, mais {yellow}en retourne le sens{/yellow}.
