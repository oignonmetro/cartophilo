- id: bichat-vie-mort-i2
  title: "Le savoir sur le vivant vers 1800"
  notes: |-
    **À la fin du XVIIIe siècle, la** {violet}**physiologie**{/violet} **n'est** {pink}**pas une science reconnue**{/pink}**.** L'{yellow}anatomie{/yellow}, depuis Vésale, décrit les structures du corps ; la physiologie, malgré la découverte de la circulation par Harvey, paraît confuse, et d'aucuns la tiennent pour un « roman » : en 1795, l'Institut n'a pas de classe de physiologie. Deux voies se disputent l'explication du vivant :

    | Position | La vie, c'est… | Représentants |
    | mécanisme | un fonctionnement soumis aux seules lois physiques | Descartes, les iatromécaniciens |
    | animisme | l'œuvre d'une âme qui conserve le corps | Stahl |
    | vitalisme | des forces ou propriétés propres au vivant | Bordeu, Barthez, Bichat |

    **Bichat est vitaliste, mais d'**{coral}**un vitalisme sans métaphysique**{/coral}**.** Les {violet}corps bruts{/violet} sont régis par {pink}__des lois fixes qui entraînent toujours leur dégradation__{/pink} ; les {violet}corps vivants{/violet}, par des lois plus variables, qui leur donnent la conservation d'eux-mêmes. Les **forces vitales** __varient__, les **forces physiques** produisent des phénomènes __« toujours uniformes »__ : c'est pourquoi Bichat refuse le {red}**calcul**{/red} en {red}physiologie{/red}, et conclut que la science des corps organisés doit être traitée « d'une manière toute différente » de celle des corps inorganiques.

    **La définition n'est pas neuve dans sa lettre.** **Stahl**, l'animiste, écrivait déjà (*Vraie théorie médicale*) : {teal}« {/teal} On doit entendre par ce mot {violet}Vie{/violet} : {teal}la conservation même d'un corps éminemment corruptible{/teal}, la Faculté ou force par laquelle ce corps est mis à l'abri de l'acte corrupteur. {teal} »{/teal} **Cuvier**, au début de ses *Leçons d'anatomie comparée* (an VIII), personnifie la vie en une jeune fille en bonne santé, étonnante parce qu'elle se conserve contre toutes les agressions du dehors, quand dès sa mort celles-ci l'emportent. Pour Philippe **Huneman** (*Bichat, la vie et la mort*, 1998), l'originalité de Bichat est ailleurs : __sa définition ouvre l'accès à la vie par la mort, et par là la physiologie expérimentale__.

    ! Identique à celle de Stahl dans la lettre, la définition de Bichat n'en a pas le sens : elle ne suppose aucune âme.
