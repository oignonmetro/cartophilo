- id: bichat-vie-mort-o1
  title: "Les objections : Magendie et Claude Bernard"
  notes: |-
    **La définition a été critiquée par les deux grands héritiers de Bichat en physiologie, pour deux raisons : elle tournerait en rond, et elle ferait de la vie et de la mort deux puissances.**

    {sky}**Magendie**{/sky}, dans les notes de son édition des *Recherches*, distingue __deux sens__ du mot {violet}« vie »{/violet} chez les physiologistes : {violet}un principe imaginé{/violet}, cause de toutes les fonctions vitales, ou simplement {violet}l'ensemble de ces fonctions{/violet}. Bichat l'entend au second sens, comme un résultat et non comme une cause. Mais, objecte Magendie, il y a un **cercle vicieux** dans la définition : {red}__l'idée de mort suppose celle de vie, et l'on ne peut définir la vie par ce qui la présuppose__{/red}.

    {sky}**Claude Bernard**{/sky} ouvre ses *Leçons sur les phénomènes de la vie communs aux animaux et aux végétaux* (1878) par l'examen des {violet}définitions de la vie{/violet}. Il reconnaît d'abord la justesse de celle de Bichat : elle « comprend deux termes qui s'opposent l'un à l'autre : la vie, la mort », et il est impossible de séparer ces deux idées : « ce qui est vivant mourra, ce qui est mort a vécu ». Mais Bichat, en voulant être plus clair, « y a rencontré l'erreur » : il a fait de la vie et de la mort « deux êtres, deux principes continuellement présents et luttant dans l'organisme ». Il a beau répudier le principe vital en tant que principe unique, il en donne l'équivalent dans ses **propriétés vitales**.

    | Critique | Ce qu'elle reproche | Ce qu'elle garde |
    | Magendie | un cercle : la mort suppose la vie | la vie comme ensemble de fonctions, non comme cause |
    | Bernard | la lutte de deux principes, un vitalisme déguisé | l'union indissociable de la vie et de la mort |

    **Bernard reste pourtant fidèle à Bichat.** Pour lui, toute manifestation vitale s'accompagne d'une destruction organique : « La vie, c'est la mort. » Canguilhem le notait : « Claude Bernard est resté bien plus fidèle qu'on ne le dit à l'enseignement et à l'esprit de Xavier Bichat. » La mort n'est plus une force extérieure contre laquelle la vie lutte, mais l'envers de chaque fonction vitale.

    ! Bernard ne rejette pas le lien de la vie et de la mort : il rejette leur personnification en deux principes rivaux.
