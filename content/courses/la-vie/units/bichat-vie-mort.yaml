# Unité de texte (voir content/textes.md) : Bichat, Recherches physiologiques
# sur la vie et la mort (an VIII, 1800), Ire partie, art. 1, § 1, texte fourni
# par l'utilisateur. Sans commentaire suivi du passage : l'unité repose sur une
# analyse écrite pour elle, à partir de Philippe Huneman, Bichat, la vie et la
# mort (PUF, 1998 : introduction, ch. II « La définition vitaliste de la vie »,
# ch. III, conclusion, notes), de la note de Magendie à son édition des
# Recherches, et des Leçons sur les phénomènes de la vie de Claude Bernard
# (1878, 1re leçon). Les unités bichat1 à bichat4 (piste Idées) donnent le
# cours d'ensemble sur Bichat.

id: bichat-vie-mort
title: "Bichat : la vie, ensemble des fonctions qui résistent à la mort"
subtitle: "Bichat, Recherches physiologiques sur la vie et la mort, I, art. 1"
icon: page
color: coral
intro: |-
  L'ouverture des *Recherches physiologiques sur la vie et la mort* (1800) : Bichat définit la vie par la résistance qu'elle oppose à la destruction, fonde cette définition sur l'action incessante du dehors et la réaction du vivant, la vérifie sur les âges de la vie jusqu'à la mort naturelle, et en tire une mesure de la vie.
lessons:
- id: bichat-vie-mort-i1
  title: "La thèse, la question, les mouvements"
  notes: |-
    **Le texte répond à la question** {amber}**« qu'est-ce que la vie ? »**{/amber} **par une définition :** {violet}**la vie**{/violet} **est** {coral}**l'ensemble des fonctions qui résistent à la mort**{/coral}**.** C'est la première phrase des *Recherches physiologiques sur la vie et la mort*, publiées par **Marie-François Xavier Bichat** (1771-1802) en l'an VIII (1800) ; elle ouvre la première partie, consacrée à la vie (article 1, « Division générale de la vie »), la seconde l'étant à la mort.

    La définition réunit deux affirmations de statut différent. L'une est **ontologique** : la vie n'est pas une {red}chose{/red} ni une {red}substance{/red}, mais {green}__une activité, un ensemble de fonctions__{/green}, définie par son rapport à son contraire. L'autre est **épistémologique** : le {pink}principe{/pink} de cette résistance est {pink}__« inconnu dans sa nature »__{/pink} et {amber}ne se connaît que par ses phénomènes{/amber}. La seconde est la condition de la première : {amber}on peut définir la vie sans en connaître l'essence, à partir d'un « aperçu général »{/amber} de ce qu'elle fait.

    Mais la définition ne se suffit pas. Il faut montrer que __le vivant est réellement entouré d'__{red}__une destruction permanente__{/red} (sinon « résister » ne veut rien dire), puis expliquer pourquoi un principe de résistance « permanent » finit par céder (sinon le vivant ne mourrait pas). D'où les quatre mouvements :

    | Paragraphe | Ce qu'il fait |
    | §1 | poser la définition, contre les « considérations abstraites » |
    | §2 | la fonder : le milieu hostile, le principe de réaction, connu par ses phénomènes |
    | §3 | la vérifier sur les âges, jusqu'à la mort naturelle |
    | §4 | conclure : la mesure de la vie est une différence |

    **Contre qui ?** Bichat ne nomme personne dans ce passage ; on peut comprendre qu'il vise les définitions par l'essence ou la cause première : l'âme des animistes, le « principe vital » de **Barthez**. Ailleurs, il refuse de chercher un « centre unique de tous les actes qui portent le caractère de la vitalité » (*Recherches*, I, art. 7, § 1) : les causes premières sont inaccessibles, et d'ailleurs inutiles à la connaissance.

    ! Bichat ne dit pas ce qu'est le principe de la vie : sa définition porte sur des fonctions, non sur une substance.
