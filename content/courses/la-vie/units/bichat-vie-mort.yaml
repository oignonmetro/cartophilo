- id: bichat-vie-mort-p4
  title: "La mesure de la vie : une différence"
  notes: |-
    **Le « donc » tire la conclusion : puisque** {amber}**la vie est un rapport d'action et de réaction**{/amber}**, sa** {violet}**mesure**{/violet} **est la** {coral}**différence entre l'effort du dehors et la résistance du dedans**{/coral}**.** La vie n'est pas une {pink}quantité absolue{/pink} que l'on posséderait, mais un {amber}**rapport**{/amber} : on n'est pas vivant tout court, on l'est plus ou moins, selon que la résistance l'emporte ou cède. L'excès des puissances extérieures « annonce » la faiblesse de la vie ; la prédominance de la résistance intérieure en est « l'indice » de force : des signes qui se lisent, conformément à la thèse épistémologique du §2.

    | Rapport | Ce qu'il indique | Âge du §3 |
    | la résistance intérieure prédomine | la force de la vie | l'enfant |
    | les deux efforts s'équilibrent | la vie qui se maintient | l'adulte |
    | les puissances extérieures l'emportent | la faiblesse de la vie | le vieillard |

    **« Mesure » ne veut pas dire calcul.** Bichat refuse ailleurs d'appliquer le {red}calcul{/red} à la {red}physiologie{/red}, parce que {amber}les forces vitales sont variables{/amber} ({yellow}une même « faculté vitale de sentir » varie pour un même organe{/yellow}, quand la « faculté physique d'attirer » reste constante). La mesure dont il parle est une évaluation comparative, un degré, que précise le « en général ».

    **Ce que la conclusion fait comprendre de la santé et de la mort.** Si la vie a des degrés, la {violet}santé{/violet} est une force de {amber}résistance{/amber}, et la {violet}maladie{/violet} un {amber}affaiblissement{/amber} : Bichat la dira « un état intermédiaire à la santé et à la mort » (*Recherches*, II). Seul un vivant peut être malade ; il n'y a pas de pathologie des corps bruts : « dans les sciences physiques il n'y a que la première histoire » (celle des phénomènes où les forces ont leur type naturel), écrit-il dans l'*Anatomie générale*. Pour {sky}Huneman{/sky}, c'est là l'implication extrême de la définition : « Poussée à l'extrême de ses implications, {coral}__la définition vitaliste inscrit la mort dans l'essence même de la vie__{/coral} » ; parce qu'elle est {amber}résistance{/amber}, {coral}la vie a la mort pour condition{/coral}, et __le propre du vivant est de mourir__.

    **Confrontation : Canguilhem.** La vie, écrit Canguilhem (*Le normal et le pathologique*), « est polarité et par là même position inconsciente de valeur » : elle n'est pas indifférente aux conditions de son existence. La résistance de Bichat en est une forme : __le vivant n'est pas neutre devant ce qui le détruit, il s'y oppose__. Mais {sky}Canguilhem{/sky} en tire que {sky}chaque vivant institue ses propres normes{/sky} ; {yellow}un pouls de 40 n'a pas la même signification pour un fonctionnaire et pour un marathonien{/yellow}, et que __le refus bichatien de la mesure numérique reconnaît, à sa manière, cette singularité des phénomènes vitaux__.

    ! La « mesure de la vie » n'est pas une grandeur, mais un rapport : elle ne dit pas combien de vie on a, mais si la résistance l'emporte.
  passage:
    label: "§4"
    text: "La mesure de la vie est donc, en général, la différence qui existe entre l'effort des puissances extérieures, et celui de la résistance intérieure. L'excès des unes annonce sa faiblesse ; la prédominance de l'autre est l'indice de sa force."
