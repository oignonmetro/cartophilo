    answer: "hairesis"
    alt: []
- id: vies3-l4
  title: "Choisir en connaissance, ou refaire la même vie"
  notes: |-
    **Puisque l'âme choisit sa destinée, l'homme doit consacrer sa vie à l'étude du modèle de vie qu'il choisira** (*République*, X, 618b-c) : {teal}« C'est là précisément [...] que réside pour l'homme, semble-t-il, le risque total{/teal} ; et voilà les raisons d'avoir le plus grand souci de faire que chacun de nous, {teal}sans se soucier des autres objets d'étude{/teal}, soit à l'égard de cet objet-là, et chercheur et étudiant pour savoir si de quelque part il ne sera pas à même d'apprendre d'un autre ou de découvrir par lui-même l'homme qui lui donnera capacité et instruction, {teal}discernement du bien comme du mal de la vie »{/teal}. Toute la philosophie se ramène ici à une seule étude : {coral}apprendre à bien choisir sa vie{/coral}.

    **Mais on choisit d'ordinaire d'après la vie antérieure** (619d-620a) : {teal}« {/teal}C'était en effet, disait Er, {teal}un spectacle qui assurément valait la peine d'être vu{/teal}, la façon dont les âmes choisissaient chacune leur vie ; spectacle dont en fait la vue inspirait la pitié, et {teal}risiblement absurde{/teal} ; car c'était le plus souvent {teal}en rapport avec les conditions concrètes de leur vie antérieure{/teal} qu'elles faisaient leur choix. » {red}Même libres de choisir, les hommes reprennent la vie déjà vécue, et perpétuent ainsi leur malheur.{/red}

    **Une lecture par l'éternel retour.** On peut comprendre le mythe comme {sky}Gilles Deleuze{/sky} interprète l'éternel retour de {sky}Nietzsche{/sky} : {amber}un instrument de sélection{/amber}. {teal}« {/teal}Le secret de Nietzsche, c'est que {teal}l'éternel Retour est sélectif{/teal}. [...] Car il nous donne une loi pour l'autonomie de la volonté dégagée de toute morale : {teal}quoi que je veuille{/teal} (ma paresse, ma gourmandise, ma lâcheté, mon vice comme ma vertu), {teal}je "dois" le vouloir de telle manière que j'en veuille aussi l'éternel Retour »{/teal}.

    **La question que pose le mythe.** De même qu'il s'agit chez Nietzsche de savoir si l'on supporte de revivre exactement tel aspect de sa vie, il s'agit avec Er de savoir si l'on supporterait de revivre {red}une même vie injuste, dont la conséquence implacable est le malheur{/red}. D'où la question : {coral}tandis que le sort t'offre la possibilité de choisir une autre vie, es-tu capable de te donner une autre destinée que celle qui fut la tienne jusqu'à présent ?{/coral}

    **La multiplicité des vies possibles oblige ainsi à choisir entre des modes de vie** : comment sont-ils conçus, selon quelles fins ? C'est l'objet des unités suivantes.
  points:
  - id: vies3-l4-p1
    sentence: "Platon, *République*, X : c'est dans le choix de sa vie « que réside pour l'homme, semble-t-il, le risque ___ »."
    answer: "total"
    alt: []
  - id: vies3-l4-p2
    sentence: "Platon, *République*, X : il faut chercher l'homme qui nous donnera « capacité et instruction, ___ du bien comme du mal de la vie »."
    answer: "discernement"
    alt: []
  - id: vies3-l4-p3
    sentence: "Platon, *République*, X : la façon dont les âmes choisissaient leur vie était un spectacle qui inspirait la pitié, et « ___ absurde »."
    answer: "risiblement"
    alt: []
  - id: vies3-l4-p4
    sentence: "Dans le mythe d'Er, les âmes font le plus souvent leur choix en rapport avec les conditions concrètes de leur vie ___, et perpétuent ainsi leur malheur."
    answer: "antérieure"
    alt: []
  - id: vies3-l4-p5
    sentence: "Que les âmes choisissent le plus souvent d'après leur vie antérieure, Er le raconte dans la *République*, en 619d-___."
    answer: "620a"
    alt: []
  - id: vies3-l4-p6
    sentence: "On peut comprendre le mythe d'Er comme Gilles ___ interprète l'éternel retour de Nietzsche : un instrument de sélection."
    answer: "Deleuze"
    alt: []
  - id: vies3-l4-p7
    sentence: "Deleuze : « Le secret de Nietzsche, c'est que l'éternel Retour est ___ »."
    answer: "sélectif"
    alt: []
  - id: vies3-l4-p8
    sentence: "Deleuze : quoi que je veuille, « je \"dois\" le vouloir de telle manière que j'en veuille aussi l'éternel ___ »."
    answer: "Retour"
    alt: ["retour"]
  - id: vies3-l4-p9
    sentence: "Si les âmes reprennent d'ordinaire la vie déjà vécue, le mythe d'Er demande : tandis que le sort t'offre de choisir une autre vie, es-tu capable de te donner une autre ___ que celle qui fut la tienne ?"
    answer: "destinée"
