# Chapitre de Maxime Chapuis, « Vraie vie et modes de vie dans la philosophie
# antique » (voir vies1 pour la source et la méthode) : « À la croisée des
# chemins : choisir sa vie, choisir sa mort ». Citations de la République
# (618b-c, 619d-620a) et de Deleuze relues sur l'image (p. 52). Le chapitre
# écrit « 619d4-620a » ; l'image donne « 619d-620a ».

id: vies3
title: "Choisir sa vie"
subtitle: "Les deux chemins d'Hésiode et de Prodicos, et le choix des vies dans le mythe d'Er"
icon: compass
color: coral
group: "Vraie vie et modes de vie dans l'Antiquité"
lessons:
- id: vies3-l1
  title: "Les deux chemins : Hésiode"
  notes: |-
    **Le choix d'une vie se représente par la métaphore des deux chemins.** L'image est classique ; on la trouve déjà chez {sky}Hésiode{/sky}, cité par Platon (*Lois*, IV, 718d-e) comme par Xénophon (*Mémorables*, II, 1, 20) :

    {teal}« De la misère, on en gagne tant qu'on veut, / et sans peine :{/teal} la route est plane{teal}, et elle loge tout près de nous, / mais, devant le mérite{/teal} [{blue}*tês d'aretês*{/blue}], {teal}les dieux immortels ont mis la sueur. / Long, ardu est le sentier qui y mène{/teal}, / et âpre tout d'abord. Mais atteins seulement la cime, / et le voici dès lors aisé, pour difficile qu'il soit. » (*Les travaux et les jours*, 287-292)

    **Ce que dit l'image** :
    - {red}la route du vice{/red} est {yellow}plane{/yellow}, {yellow}toute proche{/yellow}, sans peine : on y va sans le vouloir ;
    - {green}le sentier de la vertu{/green} est {yellow}long, ardu, âpre{/yellow} au début : {amber}les dieux ont mis la sueur devant le mérite{/amber} ;
    - mais {coral}une fois la cime atteinte, il devient aisé{/coral} : la difficulté est celle du commencement, non de la vertu elle-même.

    **Le contexte.** Socrate mobilise ces vers contre {sky}Aristippe{/sky}, le philosophe {violet}cyrénaïque{/violet} qui soutient que la vertu réside dans les plaisirs.
  points:
  - id: vies3-l1-p1
    sentence: "Le choix d'une vie se représente classiquement par la métaphore des deux ___."
    answer: "chemins"
    alt: []
  - id: vies3-l1-p2
    sentence: "Hésiode, *Les travaux et les jours* : « devant le mérite, les dieux immortels ont mis la ___ »."
    answer: "sueur"
    alt: []
  - id: vies3-l1-p3
    sentence: "Hésiode : « Long, ___ est le sentier qui y mène, et âpre tout d'abord. Mais atteins seulement la cime, et le voici dès lors aisé »."
    answer: "ardu"
    alt: []
  - id: vies3-l1-p4
    sentence: "Hésiode : la route de la misère « est ___, et elle loge tout près de nous »."
    answer: "plane"
    alt: []
  - id: vies3-l1-p5
    sentence: "Les vers d'Hésiode sur les deux chemins sont cités par Platon dans les *Lois* et par Xénophon dans les *___*, II, 1, 20."
    answer: "Mémorables"
    alt: []
  - id: vies3-l1-p6
    sentence: "Chez Xénophon, Socrate oppose les vers d'Hésiode sur les deux chemins à ___, le cyrénaïque pour qui la vertu réside dans les plaisirs."
    answer: "Aristippe"
    alt: []
  - id: vies3-l1-p7
    sentence: "Le sentier de la vertu est âpre au début, mais une fois la ___ atteinte, il devient aisé : la difficulté est celle du commencement."
    answer: "cime"
    alt: []
- id: vies3-l2
  title: "Héraklès entre le Vice et la Vertu"
  notes: |-
    **Contre Aristippe, Socrate mobilise aussi un écrit du sophiste Prodicos sur Héraklès** (Xénophon, *Mémorables*, II, 1). À l'entrée de l'adolescence, {sky}Héraklès{/sky} doit choisir entre deux chemins, chacun représenté par {yellow}une femme{/yellow} :
    - {red}le Vice{/red} : la soumission aux plaisirs, la voie de la facilité ;
    - {green}la Vertu{/green} : la maîtrise de soi, la supériorité de l'intelligence sur le corps.

    **Le Vice promet le court chemin** : {teal}« {/teal}Vois-tu, Héraklès, comme il est {teal}ardu et long le chemin{/teal} que cette femme te trace pour arriver aux plaisirs ? Moi, c'est {teal}par un chemin facile et court{/teal} que je te conduirai au bonheur. »

    **La Vertu promet l'honneur** : {teal}« {/teal}Moi, au contraire, je suis {teal}en compagnie des dieux et des honnêtes hommes{/teal}. {teal}Aucune belle action{/teal}, de la part des dieux ou des hommes, {teal}ne se fait sans moi{/teal}. [...] Voilà, Héraklès, fils de parents vertueux, {teal}les efforts auxquels tu dois consentir{/teal} pour accéder à la félicité suprême. »

    **Deux types de bonheur.**
    - {red}Un bonheur hédoniste{/red} : la satisfaction des désirs rend la vie heureuse.
    - {green}Un bonheur digne de l'estime des dieux, de la cité et des hommes{/green}, qui repose sur la maîtrise de soi.

    Le choix est donc entre {red}le chemin de la facilité{/red} et {green}celui de la difficulté et de l'effort{/green}. {coral}Reformulé en termes platoniciens, c'est choisir entre la vie du corps et la vie de l'âme.{/coral}
  points:
  - id: vies3-l2-p1
    sentence: "Contre Aristippe, Socrate mobilise un écrit du sophiste ___ consacré à Héraklès, sommé de choisir entre le chemin du vice et celui de la vertu."
    answer: "Prodicos"
    alt: ["Prodicus"]
  - id: vies3-l2-p2
    sentence: "Dans l'apologue de Prodicos, c'est ___ qui, à l'entrée de l'adolescence, doit choisir entre le Vice et la Vertu."
    answer: "Héraklès"
    alt: ["Hercule", "Héraclès"]
  - id: vies3-l2-p3
    sentence: "Le Vice à Héraklès : « Moi, c'est par un chemin facile et ___ que je te conduirai au bonheur. »"
    answer: "court"
    alt: []
  - id: vies3-l2-p4
    sentence: "La Vertu à Héraklès : « Aucune belle ___, de la part des dieux ou des hommes, ne se fait sans moi. »"
    answer: "action"
    alt: []
  - id: vies3-l2-p5
    sentence: "La Vertu à Héraklès : « Voilà les ___ auxquels tu dois consentir pour accéder à la félicité suprême. »"
    answer: "efforts"
    alt: []
  - id: vies3-l2-p6
    sentence: "Le Vice promet un bonheur ___, par la satisfaction des désirs ; la Vertu, un bonheur digne de l'estime des dieux, fondé sur la maîtrise de soi."
    answer: "hédoniste"
    alt: []
  - id: vies3-l2-p7
    sentence: "Reformulé en termes platoniciens, le choix d'Héraklès entre facilité et effort est un choix entre la vie du corps et la vie de l'___."
    answer: "âme"
    alt: []
- id: vies3-l3
  title: "Le mythe d'Er : l'édit de Lachésis"
  notes: |-
    **Tout choix de ce type engage la vie et la mort de chacun : c'est ce que montre le mythe d'Er le Pamphylien**, qui conclut la *République* en évoquant la destinée des âmes après la mort.

    **Pourquoi un mythe, et pourquoi à la fin.** Pour définir la justice, Platon a dû {amber}suspendre la question de la récompense ou du châtiment{/amber} : la réflexion politico-morale (qu'est-ce que la justice ?) a requis de mettre entre parenthèses la réflexion éthique (qu'est-ce que le bonheur, et la justice rend-elle heureux ?). C'est seulement au terme que la question du bonheur revient ; or {coral}le bonheur ne peut s'y envisager que de manière posthume{/coral}, comme l'accomplissement de la vie menée jusqu'à la mort. En promettant récompenses et peines, {coral}le mythe a pour fonction d'inciter à un changement immédiat de vie{/coral}.

    **Le récit.** À la mort, les âmes arrivent en un {violet}lieu démonique{/violet} ({blue}*topon daimonion*{/blue}), où deux routes sont gardées par des juges : les justes prennent {green}le chemin de droite, qui monte au ciel{/green}, les injustes {red}celui de gauche, qui descend sous terre{/red}. La plupart doivent se réincarner, et se rendre auprès de {sky}Lachésis{/sky}, l'une des Parques, fille de Nécessité, {amber}qui chante le passé{/amber} : {coral}le choix d'une vie future est lié au passé de l'âme{/coral}.

    **L'édit** (*République*, X, 617d-e). Un hiérophante prend sur les genoux de Lachésis des billets de loterie, qui correspondent à des {violet}types d'existence{/violet} ({blue}*biôn paradeigmata*{/blue}), et proclame : {teal}« {/teal}Âmes éphémères ! [...] {teal}Ce n'est pas vous qui serez reçues en partage par un Démon, mais c'est vous qui choisirez un Démon{/teal} [...]. {teal}La vertu ne connaît pas de maître{/teal} ; en possédera plus ou moins quiconque l'honore ou se refuse à l'honorer. {teal}La responsabilité du choix est pour celui qui l'a fait : la Divinité en est irresponsable ! »{/teal}

    **Nécessité, hasard, choix.** La vie humaine est un entrelacs de trois choses :
    - {amber}la nécessité{/amber} : Lachésis est fille de Nécessité ;
    - {amber}le hasard{/amber} : le {blue}*klèros*{/blue}, que Robin traduit « billet de loterie », tout objet servant à un tirage au sort ; l'ordre de passage est tiré au sort ;
    - {amber}le choix{/amber} ({blue}*hairesis*{/blue}) : l'âme choisit son {violet}démon{/violet} ({blue}*daimôn*{/blue}), c'est-à-dire sa destinée.
  points:
  - id: vies3-l3-p1
    sentence: "Le mythe qui conclut la *République* en évoquant la destinée des âmes après la mort est celui d'___ le Pamphylien."
    answer: "Er"
    alt: []
  - id: vies3-l3-p2
    sentence: "Pour définir la justice, Platon a suspendu la question de la récompense ; à la fin de la *République*, le bonheur ne peut s'envisager que de manière ___."
    answer: "posthume"
    alt: []
  - id: vies3-l3-p3
    sentence: "En promettant récompenses et peines après la mort, le mythe d'Er a pour fonction d'inciter à un ___ immédiat de vie."
    answer: "changement"
    alt: []
  - id: vies3-l3-p4
    sentence: "Dans le mythe d'Er, les âmes qui doivent se réincarner se rendent auprès de ___, l'une des Parques, fille de Nécessité, qui chante le passé."
    answer: "Lachésis"
    alt: []
  - id: vies3-l3-p5
    sentence: "Édit de Lachésis : « Ce n'est pas vous qui serez reçues en partage par un Démon, mais c'est vous qui ___ un Démon »."
    answer: "choisirez"
    alt: []
  - id: vies3-l3-p6
    sentence: "Édit de Lachésis : « La vertu ne connaît pas de ___ »."
    answer: "maître"
    alt: []
  - id: vies3-l3-p7
    sentence: "Édit de Lachésis : « La responsabilité du choix est pour celui qui l'a fait : la Divinité en est ___ ! »"
    answer: "irresponsable"
    alt: []
  - id: vies3-l3-p8
    sentence: "L'édit de Lachésis, qui rend chaque âme responsable du choix de sa vie, se lit dans la *République*, livre X, en 617___."
    answer: "d-e"
    alt: ["d"]
  - id: vies3-l3-p9
    sentence: "Dans le mythe d'Er, les billets de loterie correspondent à des types d'existence, en grec *biôn ___*."
    answer: "paradeigmata"
    alt: []
  - id: vies3-l3-p10
