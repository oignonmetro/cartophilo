- id: kant-cfj-methodologie-l8
  title: "La fin finale : l'homme comme être moral (§ 84)"
  notes: |-
    Le § 84 franchit le pas que le § 83 préparait : de la **fin dernière de la nature** à la {violet}**fin finale**{/violet} de la création elle-même. {teal}« Fin finale est la fin qui n'a besoin d'aucune autre comme condition de sa possibilité. »{/teal} Sa réponse : {green}__l'homme, mais seulement comme noumène, sujet de la moralité__{/green}.

    **La question n'a de sens que si l'on admet une cause intentionnelle.** Si l'on explique la finalité par le seul mécanisme, au hasard ou par une nécessité aveugle, demander pourquoi les choses existent est {red}une question vide{/red}. Mais si l'on admet que la liaison finale est réelle et qu'un **entendement** est cause des formes, on ne peut s'arrêter à la question de leur forme : il faut demander quel fondement a déterminé cet entendement à produire, c'est-à-dire chercher la fin finale.

    **Rien dans la nature ne peut être fin finale.** Elle est **inconditionnée**, alors que dans la nature tout ce qui détermine est à son tour conditionné, {coral}hors de nous comme en nous{/coral} : la nature pensante, ce que je suis comme être naturel, n'y échappe pas plus que la matière. Une fin finale ne peut dépendre, dans l'ordre des fins, d'aucune autre condition que de sa propre Idée.

    **Un seul être y satisfait : l'homme comme noumène.** Il est le seul dont la causalité soit orientée vers des fins, et selon une loi qu'il se représente comme **inconditionnée** et indépendante de la nature : la loi morale. En lui seul nous reconnaissons {coral}un pouvoir suprasensible, la **liberté**{/coral}, et l'objet qu'il peut se proposer comme fin suprême, le **souverain bien** dans le monde.

    **De lui, on ne peut plus demander pourquoi il existe.** {teal}« Son existence contient en soi la fin suprême »{/teal} à laquelle il peut soumettre la nature entière. Sans lui, la chaîne des fins subordonnées ne serait pas complètement fondée : {green}« c'est l'homme qui est la fin finale de la création »{/green}, mais {teal}« même en lui seulement comme sujet de la moralité »{/teal}, seul capable d'une législation inconditionnée à l'égard des fins.

    **La note : le bonheur n'est qu'une fin conditionnée.** Le bonheur pourrait être une fin de la nature, rien ne l'interdit a priori, mais le § 83 a montré qu'il ne l'est même pas. Surtout, si l'on répondait que les hommes existent pour que la cause suprême les comble de bienfaits, on {red}contredirait la condition à laquelle notre raison soumet elle-même son désir le plus intime de bonheur{/red} : l'accord avec notre propre législation morale. Le bonheur n'est donc qu'une **conséquence**, mesurée à notre accord avec cette fin.

    ! Fin dernière et fin finale ne s'opposent pas comme deux termes techniques figés (Alain Renaut juge qu'une opposition rigide relève d'« un kantisme scolaire, voire scholastique ») : c'est la différence entre l'homme comme terme de la nature et l'homme comme être libre qui compte.
    ! L'homme n'est pas fin finale par ce qu'il est naturellement, ni par son bonheur, mais comme sujet de la loi morale.
