- id: kant-cfj-methodologie-l11
  title: "La preuve morale et l'honnête homme sans Dieu (§ 87)"
  notes: |-
    Le § 87 formule la **preuve morale** de l'existence de Dieu. Elle ne part pas de la nature, mais de la loi morale en nous : {green}__la loi nous commande de viser une fin finale, le souverain bien, que nous ne pouvons penser possible sans admettre un auteur moral du monde__{/green}.

    **La téléologie morale est en nous.** Nous trouvons en nous-mêmes, comme êtres libres, une **téléologie morale** déterminée a priori, qui n'a besoin d'aucune cause intelligente hors de nous pour sa légalité intérieure, pas plus que les propriétés des figures géométriques n'ont besoin d'un entendement suprême. Mais elle nous concerne comme êtres du monde, liés aux autres choses : elle pose donc la question de l'accord du monde avec la fin morale.

    **Le raisonnement.** La loi morale nous prescrit une fin finale : le **souverain bien**, le bonheur des êtres raisonnables sous la condition de leur accord avec la loi, qui les rend **dignes d'être heureux**. Or nous ne pouvons nous représenter cette fin comme possible par les seules forces de la nature, qui ne règle pas le bonheur sur le mérite. {coral}Il faut donc admettre une cause morale du monde{/coral} ; et {teal}« dans la mesure où cette loi est nécessaire, dans la même mesure [...] il est nécessaire d'admettre aussi la première proposition - savoir qu'il y a un Dieu »{/teal}. Une note précise : l'argument ne prouve pas Dieu au sceptique, il lui montre que, {coral}s'il veut penser de façon moralement conséquente{/coral}, il doit l'admettre.

    **La morale ne dépend pas de Dieu.** Celui qui se persuade que Dieu n'existe pas et en conclut que le devoir est imaginaire serait {red}« un vaurien »{/red}, et le resterait s'il obéissait par crainte ou par intérêt. Les lois morales commandent inconditionnellement ; ce qu'on abandonnerait sans Dieu, ce n'est pas le devoir, mais **l'espoir de réaliser la fin finale**.

    **L'honnête homme sans Dieu.** Kant imagine {yellow}« un honnête homme (par exemple, Spinoza) qui est fermement persuadé qu'il n'y a pas de Dieu et [...] qu'il n'y a pas non plus de vie future »{/yellow}. Il fait le bien sans rien demander. Mais son effort est limité, et la nature ne s'accorde qu'au hasard avec sa fin : la tromperie, la violence et la jalousie l'entourent, et les gens intègres restent {red}« soumis par la nature, qui ne prête pas attention à cette dignité, à tous les maux de la misère, des maladies et de la mort prématurée, comme c'est le cas des autres animaux de la terre »{/red}, jusqu'à ce qu'{red}« une vaste tombe les engloutisse tous ensemble »{/red}, honnêtes ou non, dans {red}« le gouffre du chaos dépourvu de toute fin qui est celui de la matière d'où ils étaient tirés »{/red}.

    **L'alternative.** Ou bien il abandonne comme impossible la fin que la loi morale lui faisait viser, ce qui affaiblirait le respect qu'elle lui inspire ; ou bien, pour rester fidèle à sa destination morale, il admet, {coral}d'un point de vue pratique{/coral}, ce qui n'a rien de contradictoire : {green}« l'existence d'un auteur moral du monde, c'est-à-dire de Dieu »{/green}.

    ! La preuve morale ne fonde pas le devoir sur Dieu : elle va du devoir à Dieu, et le devoir resterait obligatoire sans lui.
    ! Kant ne fait pas le procès de Spinoza : il en fait au contraire l'exemple d'un homme moralement irréprochable.
