- id: kant-cfj-methodologie-l6
  title: "L'homme, fin dernière de la nature sur terre (§ 82)"
  notes: |-
    Le § 82 passe de l'organisme aux **relations extérieures** entre les êtres organisés : la nature forme-t-elle un système de fins, et quelle en est la fin dernière ? Sa réponse : {green}__l'homme, parce qu'il est le seul être sur terre à pouvoir se forger un concept des fins__{/green}, bien que l'expérience semble démentir toute fin dans la nature.

    **La finalité externe suppose des êtres organisés.** Une chose sert à une autre de moyen : la terre, l'air, l'eau peuvent être finalisés extérieurement, mais seulement par rapport à des **êtres organisés**, car {coral}une chose n'est moyen que pour une fin{/coral}. L'eau et la terre ne sont pas des moyens pour l'amoncellement des montagnes, qui n'ont rien de finalisé.

    **Une seule finalité externe tient à l'organisation même : les deux sexes.** Pour l'organisation des sexes en vue de la reproduction, on ne peut demander pourquoi ce couple existe : {teal}« Celui-ci constitue d'emblée un tout organisateur, bien qu'il ne soit pas un tout organisé dans un seul corps. »{/teal}

    **Devant un être organisé, on demande : pourquoi existe-t-il ?** Ce n'est guère possible pour ce que produit le seul mécanisme. Mais pour un être organisé, dont nous pensons la possibilité par une intention, nous ne pouvons penser **son existence même** autrement que comme une fin : ou bien sa fin est en lui (il est **fin finale**), ou bien elle est en d'autres êtres (il est aussi **moyen**). Or {red}aucun être de la nature, comme être de la nature, ne peut être fin finale de la création{/red}.

    **La chaîne des fins conduit à l'homme.** Pourquoi les plantes ? Pour les herbivores. Pourquoi les herbivores ? Pour les bêtes de proie. À quoi servent tous ces règnes ? {coral}À l'homme{/coral}, {green}« la fin dernière de la création sur terre, parce qu'il est le seul être sur cette terre qui peut se forger un concept des fins et peut par sa raison, à partir d'un agrégat de choses formées de manière finalisée, construire un système des fins »{/green}. Avec {sky}Linné{/sky}, on peut parcourir la chaîne en sens inverse : les herbivores modèrent les plantes, les carnassiers les herbivores, l'homme les carnassiers, pour l'équilibre des forces productrices et destructrices ; l'homme n'y est plus qu'**un moyen**.

    **L'expérience semble démentir le système des fins.** Le premier objet d'une organisation intentionnelle devrait être le **séjour** des vivants : or la terre et la mer portent les traces de {red}destructions anciennes et puissantes{/red}, {red}« de forces sauvages et omnipotentes d'une nature œuvrant dans un état chaotique »{/red}. La forme même des terres et le cours des fleuves sont l'effet d'éruptions et d'inondations. Si le sol qui porte les vivants ne montre qu'un mécanisme sans intention, de quel droit réclamer une autre origine pour les vivants eux-mêmes ? L'homme, qui selon {sky}Camper{/sky} n'a pas été pris dans ces révolutions, dépend trop des autres créatures pour échapper à leur sort.

    **La réponse : ce sont des principes de la réflexion.** L'argument prouverait trop : que même les êtres organisés n'ont d'autre origine que le mécanisme. Mais la solution de l'antinomie l'a montré : nous ne pouvons penser l'origine des êtres organisés que par des fins, sans rien affirmer de cette origine. D'où {coral}le devoir de tenter, et même avec témérité, de les expliquer mécaniquement{/coral}, tout en sachant n'y jamais parvenir, et la compatibilité des deux points de vue dans le suprasensible.

    ! L'homme fin dernière n'est pas un utilitarisme : sous un autre rapport, la nature le traite comme une espèce parmi d'autres, et Linné en fait un moyen.
    ! Le désordre géologique ne réfute pas la téléologie, puisqu'elle n'a jamais prétendu dire comment les choses sont produites.
