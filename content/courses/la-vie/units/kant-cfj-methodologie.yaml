- id: kant-cfj-methodologie-l3
  title: "La place de la téléologie : ni physique ni théologie (§ 79)"
  notes: |-
    Le § 79 ouvre la Méthodologie par une question de classement : {teal}« Chaque science doit avoir sa place déterminée dans l'encyclopédie de toutes les sciences. »{/teal} Où mettre la téléologie ? Sa réponse : {green}__ni dans la science de la nature, ni dans la théologie, mais dans la critique__{/green}, ce qui lui laisse pourtant un rôle dans les deux.

    **Elle n'appartient pas à la théologie.** Elle porte sur {teal}« les productions de la nature et leur cause »{/teal}. Si elle renvoie cette cause à un fondement hors de la nature, un auteur divin, ce n'est pas pour le connaître, mais seulement pour la faculté de juger **réfléchissante**, pour guider l'appréciation des choses du monde par une Idée conforme à notre entendement.

    **Elle n'appartient pas non plus à la science de la nature.** Celle-ci a besoin de principes **déterminants**, qui indiquent les causes objectives des effets ; or, pour l'explication mécanique des phénomènes, {coral}on ne gagne rien à considérer la nature selon le rapport réciproque des fins{/coral}. Poser des fins de la nature {teal}« n'appartient proprement qu'à la description de la nature »{/teal} : {yellow}« une grandiose entreprise »{/yellow}, utile à bien des égards, mais qui n'apporte {teal}« absolument aucun éclairage sur la genèse et sur la possibilité interne de ces formes »{/teal}, ce qui est pourtant l'affaire de la science théorique. Décrire un organe par sa fonction, ce n'est pas expliquer comment il se forme.

    **Elle relève donc de la critique, et sa méthodologie a une influence négative.** {teal}« La téléologie comme science n'appartient donc à aucune doctrine, mais seulement à la critique »{/teal}, celle de la faculté de juger. Mais, parce qu'elle contient des principes a priori, elle peut indiquer la **méthode** selon laquelle juger la nature d'après des fins, et exercer ainsi une influence négative : elle empêche la physique de se perdre dans la théologie, et la théologie de se fonder sur la physique.

    ! Une influence « négative » n'est pas une influence nulle : c'est celle d'une règle qui interdit des confusions, ici entre l'explication physique et la considération de Dieu.
