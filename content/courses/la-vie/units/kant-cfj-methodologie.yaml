- id: kant-cfj-methodologie-l9
  title: "La théologie physique, une téléologie mal comprise (§ 85)"
  notes: |-
    Le § 85 examine si l'on peut conclure des fins de la nature à leur cause suprême, comme le veut la {violet}**théologie physique**{/violet}. Sa réponse : {red}__elle ne peut rien nous apprendre d'une fin finale__{/red} ; elle n'est qu'une **propédeutique** à la théologie, qui ne s'achève que par la morale.

    **Deux théologies.** La théologie physique conclut à la cause suprême **à partir des fins de la nature**, connues empiriquement ; la {violet}théologie morale{/violet}, à partir de **la fin morale** des êtres raisonnables, connue a priori. La première vient naturellement avant la seconde.

    **Elle n'accède même pas à la question de la fin finale.** Elle peut justifier le concept d'une **cause intelligente** du monde, seul approprié à notre pouvoir de connaître quand il s'agit de choses compréhensibles par des fins ; mais comme elle considère toujours des relations **conditionnées** dans la nature, {coral}elle ne peut même pas soulever la question de la fin pour laquelle la nature elle-même existe{/coral}, dont le fondement est hors de la nature.

    **Elle n'obtient qu'un entendement artiste, non une sagesse.** Ses données étant empiriques, elle ne peut attribuer à la cause que ce que montrent ses effets ; or l'expérience n'embrasse jamais la nature comme système, et rencontre autant de désordre que d'ordre. Elle obtient donc {coral}« un entendement artiste pour des fins dispersées, mais nullement d'une sagesse pour une fin finale »{/coral}. Pour conclure à un être sage et infini, il faudrait l'omniscience, et pouvoir comparer ce plan à tous les plans possibles. Les **Anciens** étaient conséquents : voyant le bien et le mal mêlés dans le monde, ils pensaient des dieux puissants mais limités.

    **D'où son verdict.** {coral}« La théologie physique est donc une téléologie physique mal comprise »{/coral}, qui ne peut servir que de **propédeutique** à la théologie. Livrée à elle-même, sans les emprunts inaperçus qu'elle fait à la morale, elle ne fonderait qu'{red}« une démonologie »{/red}, au § 86 : des puissances surhumaines, non un Dieu.

    ! Kant ne méprise pas la théologie physique : elle tourne utilement le regard vers une cause intelligente, mais elle ne peut à elle seule en déterminer le concept.
