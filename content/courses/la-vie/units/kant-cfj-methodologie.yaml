- id: kant-cfj-methodologie-l10
  title: "Ce qui donne sa valeur à l'existence : la volonté bonne (§ 86)"
  notes: |-
    Le § 86 fonde la **théologie morale** sur un jugement que fait même l'entendement le plus commun : {green}__sans les hommes, le monde n'aurait pas de fin, et ce qui donne sa valeur à l'existence de l'homme n'est ni sa connaissance ni son bonheur, mais sa volonté bonne__{/green}.

    **Sans les hommes, un désert.** Toutes les créatures, si admirable que soit leur organisation, {teal}« n'existeraient pour rien s'il n'y avait en eux des hommes (des êtres raisonnables en général) : autrement dit, sans les hommes, la création entière serait un simple désert, inutile et dépourvu de fin finale »{/teal}. Une valeur n'existe que pour un être capable de se représenter des fins : un monde de pierres et de bêtes serait un spectacle sans spectateur et sans raison d'être.

    **Ce n'est pas la contemplation qui donne sa valeur au monde.** On pourrait croire que le monde vaut parce qu'il y a quelqu'un pour le **contempler**. Mais si cette contemplation ne lui montrait que des choses sans fin finale, {coral}le fait que le monde soit connu ne saurait donner à son existence une valeur{/coral} : il faut déjà lui supposer une fin finale pour que la contemplation elle-même en prenne une.

    **Ni le bonheur.** Ce n'est pas non plus {red}le bien-être, la jouissance, corporelle ou spirituelle, bref le bonheur{/red}, qui mesure cette valeur absolue. Que l'homme fasse de son bonheur son but ne dit pas pourquoi il existe, ni {coral}quelle valeur il a lui-même pour rendre son existence agréable{/coral}.

    **La volonté bonne : la valeur que seul il peut se donner.** Reste {green}« la valeur que seul il peut se donner lui-même, et qui consiste dans ce qu'il fait »{/green}, dans les principes d'après lesquels il agit, {coral}non comme membre de la nature, mais dans la liberté de son pouvoir de désirer{/coral}, c'est-à-dire une **volonté bonne**, {teal}« ce par quoi seulement son existence peut avoir une valeur absolue »{/teal}. Le jugement commun le confirme : à quoi sert qu'un homme ait du talent, l'exerce avec ardeur et soit utile à tous, s'il n'a pas de volonté bonne ? Il est, dans son intériorité, {red}« un objet de mépris »{/red}.

    **D'où le concept de Dieu.** Puisque l'homme n'est fin finale que comme être moral, la raison peut déterminer le concept de la cause du monde : législatrice dans un règne moral des fins, {coral}omnisciente{/coral} pour voir les intentions, {coral}toute-puissante{/coral} pour accorder la nature à la moralité, {coral}bonne et juste{/coral}. Ainsi {teal}« la téléologie morale comble les lacunes de la téléologie physique »{/teal}.

    ! Ce n'est pas l'homme comme espèce naturelle qui donne au monde sa valeur, mais l'homme comme volonté libre et bonne.
