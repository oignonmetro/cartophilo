- id: kant-cfj-methodologie-l2
  title: "Repérage : la Méthodologie paragraphe par paragraphe (§ 79-91)"
  notes: |-
    La Méthodologie suit une progression continue : après avoir situé la téléologie parmi les sciences (§ 79), elle en règle l'usage dans l'étude du vivant (§ 80-81), passe des relations entre les êtres organisés à la fin dernière de la nature (§ 82-83), puis à la fin finale de la création (§ 84), qu'aucune théologie physique ne peut atteindre (§ 85) et que seule la théologie morale pense (§ 86-87) ; elle termine en fixant la valeur de la preuve morale (§ 88-91).

    | Paragraphe | Lieu | Ce qui s'y joue |
    | la place de la téléologie | § 79 | ni doctrine de la nature ni théologie : elle relève de la critique |
    | la subordination du mécanisme | § 80 | droit illimité d'expliquer mécaniquement, pouvoir limité ; la mère primitive commune |
    | mécanisme et téléologie associés | § 81 | ni occasionnalisme ni préformation individuelle : l'épigenèse de Blumenbach |
    | le système des relations extérieures | § 82 | l'homme, fin dernière sur terre, seul à se forger un concept des fins |
    | la fin dernière de la nature | § 83 | la culture, non le bonheur ; la valeur de la vie |
    | la fin finale de la création | § 84 | l'homme comme noumène, sujet de la moralité |
    | la théologie physique | § 85 | elle n'atteint pas la fin finale : une téléologie mal comprise |
    | la théologie morale | § 86 | sans les hommes, la création serait un désert ; la volonté bonne donne sa valeur à l'existence |
    | la preuve morale | § 87 | l'honnête homme sans Dieu ni vie future |
    | la limitation de la preuve | § 88 | une réalité subjectivement pratique |
    | l'utilité de l'argument moral | § 89 | contre la théosophie et la démonologie ; l'âme connue dans cette vie |
    | la modalité de l'adhésion | § 90 | une preuve pour nous, hommes, non sur l'objet en soi |
    | la croyance pratique | § 91 | opinion, savoir, croyance |
