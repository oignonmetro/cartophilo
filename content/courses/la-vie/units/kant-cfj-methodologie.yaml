- id: kant-cfj-methodologie-l7
  title: "La culture, non le bonheur : la valeur de la vie (§ 83)"
  notes: |-
    Le § 83 cherche ce qui, en l'homme, peut être la **fin dernière de la nature**, c'est-à-dire ce que la nature peut faire pour lui. Deux candidats : son **bonheur**, ou son **aptitude** à se proposer des fins. Réponse : {red}__pas le bonheur__{/red}, que la nature ne peut ni ne veut lui donner, mais {green}__la culture__{/green}. Une note en tire une conclusion sur la valeur de la vie.

    **Le bonheur ne peut être la fin dernière de la nature.**
    - **Son concept est fluctuant.** Ce n'est pas un instinct, mais {teal}« une simple Idée d'un état »{/teal}, que chacun forge à sa manière avec son imagination et modifie sans cesse : aucune nature, même entièrement soumise à l'arbitre humain, ne pourrait suivre une loi fixe pour la satisfaire.
    - **La nature humaine ne s'y arrête pas.** Même réduit au besoin naturel ou porté au plus haut degré d'habileté, le bonheur ne serait jamais atteint, car la nature de l'homme {coral}« n'est pas telle qu'elle puisse s'arrêter et trouver sa satisfaction dans la possession et la jouissance »{/coral}.
    - **La nature ne le ménage pas.** Elle ne l'a pas {red}élu pour son favori{/red} : la peste, la faim, l'eau, le froid, les bêtes l'atteignent comme les autres espèces. Et ce qu'il y a d'incohérent dans ses dispositions le fait se tourmenter lui-même, par la tyrannie et la guerre, jusqu'à travailler à la destruction de son espèce.

    **L'homme n'est fin dernière que sous condition.** Il n'est jamais qu'{red}« un membre dans la chaîne des fins naturelles »{/red}, principe de bien des fins, mais aussi moyen pour d'autres. Seul être doué d'entendement, il est le {yellow}« seigneur de la nature »{/yellow} et sa fin dernière, mais {coral}« de façon conditionnelle »{/coral} : à condition de vouloir établir avec la nature un rapport de fins qui se suffise à lui-même, indépendamment d'elle.

    **Ce que la nature peut faire : la culture.** Il reste ce que la nature peut préparer en vue de ce que l'homme doit faire lui-même : {green}« La production de l'aptitude d'un être raisonnable à de quelconques fins en général (résidant par conséquent dans sa liberté) est la culture. »{/green} La nature ne peut rendre l'homme moral, puisque la moralité est l'œuvre de la liberté ; elle peut développer en lui l'aptitude à se donner des fins.

    **Deux cultures.** La {violet}**culture de l'habileté**{/violet} développe les talents : condition principale de l'aptitude à des fins, elle ne suffit pas à diriger la volonté dans le choix des fins. La {violet}**culture de la discipline**{/violet}, négative, consiste dans {coral}« la libération de la volonté à l'égard du despotisme des désirs »{/coral} : des penchants que la nature nous avait donnés comme {yellow}« fils conducteurs »{/yellow}, nous faisons des chaînes, et la discipline nous en délivre.

    **Comment la nature y parvient : par les maux mêmes.** L'habileté ne se développe que par l'**inégalité**, où le grand nombre peine pour le loisir de quelques-uns qui cultivent la science et l'art ; le luxe accroît la misère des deux côtés, mais développe les dispositions de l'espèce. La condition de ce développement est la **société civile**, puissance légale opposée aux libertés en conflit, et au-delà un **tout cosmopolite** d'États. À défaut, la **guerre** est inévitable : une {red}épreuve effroyable{/red}, mais peut-être une tentative de la sagesse suprême pour préparer une légalité entre les États, et un mobile pour développer tous les talents. De même, les **beaux-arts et les sciences** rendent l'homme, {teal}« sinon moralement meilleur, du moins plus civilisé »{/teal}, et le préparent à une maîtrise où seule la raison doit commander.

    **La note : la valeur de la vie.** Kant y distingue trois manières de l'estimer.
    - **D'après ce dont on jouit** : sa valeur {red}« tombe au-dessous de zéro »{/red} ; {teal}« car qui voudrait vraiment recommencer sa vie sous les mêmes conditions ou même selon un plan nouveau élaboré par lui [...] mais qui ne serait disposé que pour la jouissance ? »{/teal}
    - **D'après ce que l'on fait** en suivant les fins que la nature nous assigne : nous n'y sommes toujours que des **moyens** en vue de fins indéterminées.
    - Il ne reste donc que {green}« la valeur que nous donnons nous-mêmes à notre vie »{/green}, par ce que nous faisons conformément à une fin, {coral}d'une manière si indépendante de la nature que même l'existence de la nature ne puisse être fin qu'à cette condition{/coral}.

    ! Kant ne fait pas l'éloge de la guerre ni de l'inégalité : il les juge comme des moyens par lesquels la nature développe nos dispositions malgré nous, à titre de jugement réfléchissant.
    ! La note ne dit pas que la vie ne vaut rien : elle dit que la jouissance ne lui donne aucune valeur, et que seule l'action libre lui en donne une.
