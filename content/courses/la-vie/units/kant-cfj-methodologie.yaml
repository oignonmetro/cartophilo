- id: kant-cfj-methodologie-l4
  title: "La mère primitive commune : jusqu'où va le mécanisme (§ 80)"
  notes: |-
    Le § 80 tire les conséquences méthodiques de la Dialectique pour l'étude du vivant. {green}__Le droit d'expliquer mécaniquement est illimité, le pouvoir de le faire est borné__{/green} : il faut donc pousser l'explication mécanique aussi loin que possible, jusqu'à imaginer une parenté de toutes les espèces, sans jamais se dispenser d'une organisation originaire.

    **Un droit illimité, un pouvoir limité.** {teal}« Le droit d'aller à la recherche d'un mode d'explication simplement mécanique pour tous les produits de la nature est en soi totalement illimité »{/teal} ; mais le **pouvoir** d'y parvenir, face aux fins naturelles, est {coral}« non seulement très borné, mais aussi clairement limité »{/coral}. La limite ne vient pas des choses, mais de nous : il faudrait, pour tout expliquer mécaniquement, une autre intuition que la nôtre et une connaissance du substrat intelligible de la nature. Il est donc {coral}« raisonnable, et même méritoire »{/coral} de suivre le mécanisme aussi loin qu'on le peut, en plaçant toujours au fondement {green}une **organisation originaire**{/green} qui se sert du mécanisme pour produire d'autres formes organisées ou développer la sienne.

    **L'anatomie comparée fait espérer une parenté réelle des espèces.** Tant d'espèces animales s'accordent dans {yellow}« un certain schéma commun »{/yellow}, celui du squelette et de l'agencement des parties, où {teal}« une simplicité admirable du plan »{/teal} a produit une grande diversité par l'allongement d'une partie et le raccourcissement d'une autre. Cette analogie des formes fait naître {coral}« un rayon d'espoir, certes faible »{/coral} de réussir avec le mécanisme, et {teal}« fortifie la présomption d'une parenté réelle qui existerait entre elles dans la production par une mère primitive commune »{/teal}, de l'homme au polype, jusqu'aux mousses et aux lichens, et enfin à la matière brute.

    **L'archéologue de la nature peut tout faire naître, sauf l'organisation.** {yellow}L'« archéologue de la nature »{/yellow} peut, à partir des traces des anciennes révolutions du globe, faire sortir de la terre encore chaotique, {yellow}« semblable à un grand animal »{/yellow}, des créatures d'abord peu finalisées, puis d'autres mieux adaptées, jusqu'à ce que cette matrice, {teal}« comme raidie »{/teal}, se limite à des espèces fixées. Mais il doit attribuer à cette **mère universelle** {coral}une organisation finalisée{/coral}, sans laquelle la forme finalisée de ses produits serait impensable. Reculer l'origine dans le temps ne supprime pas la question : il n'a {teal}« fait que situer plus loin le fondement de l'explication »{/teal}.

    **L'« aventure audacieuse de la raison ».** Une note qualifie ainsi cette hypothèse, que bien des chercheurs ont eue. Elle n'est pas aussi absurde que la {red}*generatio aequivoca*{/red}, production d'un être organisé à partir de la matière brute ; elle resterait une *generatio univoca* au sens large, de l'organique par de l'organique, comme si des animaux aquatiques devenaient peu à peu des animaux de marécages, puis terrestres. Elle n'est **pas contradictoire**, mais {coral}l'expérience n'en fournit aucun exemple{/coral} : toute génération connue est *homonyma* (le produit ressemble à son producteur), jamais *heteronyma*.

    **Les variations héréditaires développent des dispositions de l'espèce.** Quand une transformation accidentelle devient héréditaire, il faut y voir {coral}le développement d'une disposition originellement inscrite dans l'espèce{/coral} en vue de sa conservation. Sinon, on ne pourrait plus dire si une partie conservée dans la reproduction a une fin, et le principe de la téléologie ({teal}« dans un être organisé, n'apprécier comme dépourvu de finalité rien de ce qui se conserve dans sa reproduction »{/teal}) perdrait toute fiabilité.

    **L'objection de Hume est nulle.** Hume demandait comment un entendement architecte est lui-même possible, avec tant de pouvoirs réunis. Mais la difficulté téléologique est de trouver une **unité de fondement** pour des parties extérieures les unes aux autres : un entendement, substance simple, la fournit ; la matière, agrégat de substances, ne le peut pas, et {red}l'« autocratie de la matière »{/red} est {teal}« un mot sans signification »{/teal}. Le panthéisme et le spinozisme assurent bien l'unité du fondement, mais non sa relation à des fins : ils laissent la question sans réponse.

    ! Kant n'est pas darwinien : il juge l'hypothèse de la parenté des espèces non contradictoire, mais sans exemple dans l'expérience, et elle ne dispense jamais d'une organisation originaire.
    ! L'« aventure audacieuse » est la parenté des espèces, non la génération spontanée, que Kant juge bien plus absurde.
