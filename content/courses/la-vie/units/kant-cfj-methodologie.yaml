group: "Kant : Critique de la faculté de juger"
lessons:
- id: kant-cfj-methodologie-l1
  title: "Repérage : le plan de la Méthodologie"
  notes: |-
    La Méthodologie part d'une question (__comment juger la nature d'après des fins, et jusqu'où ce jugement nous mène-t-il ?__) et monte par degrés : de la méthode des sciences du vivant à la place de l'homme dans la nature, puis à la fin de la création tout entière. Sa réponse : {green}__seul l'homme comme être moral donne à l'existence du monde une fin et une valeur__{/green}, et {coral}c'est de là, non de la nature observée, que l'on peut penser un Dieu{/coral}.

    **Les § 79 à 81** {sky}**règlent l'usage de la téléologie dans l'étude du vivant**{/sky} : ni physique ni théologie, elle subordonne le mécanisme à une organisation originaire, et préfère l'{green}épigenèse{/green} à la {red}préformation{/red}. **Les § 82 et 83** {sky}**cherchent la fin dernière de la nature**{/sky} : l'homme, non par son {red}bonheur{/red}, mais par la {green}culture{/green}. **Les § 84 à 87** {sky}**s'élèvent à la fin finale de la création**{/sky} : l'homme comme être moral, seul capable de donner à son existence une valeur absolue, d'où la {coral}preuve morale{/coral} de l'existence de Dieu. **Les § 88 à 91** {sky}**en fixent la portée**{/sky} : une croyance pratique, non un savoir.

    | Mouvement | Lieu | Ce qui s'y joue |
    | régler l'usage de la téléologie dans l'étude du vivant | § 79-81 | le mécanisme, à pousser aussi loin que possible, reste subordonné à une organisation originaire : l'épigenèse plutôt que la préformation |
    | chercher la fin dernière de la nature | § 82-83 | l'homme est la fin dernière de la nature, non par le bonheur, que la nature ne lui garantit pas, mais par la culture |
    | s'élever à la fin finale de la création | § 84-87 | seul l'homme comme être moral est une fin inconditionnée et donne au monde sa valeur ; d'où la preuve morale de Dieu |
    | fixer la portée de la preuve morale | § 88-91 | la preuve vaut pour nous, pratiquement : Dieu et la vie future sont objets de croyance, non de savoir |

    ! La Méthodologie ne quitte pas le point de vue critique : la fin finale n'est pas observée dans la nature, elle est pensée par la raison pratique.
