- id: kant-cfj-methodologie-l5
  title: "Épigenèse ou préformation : la tendance formatrice (§ 81)"
  notes: |-
    Le § 81 fait l'inverse du § 80 : de même que le mécanisme ne suffit pas à penser un être organisé, {green}__le seul principe téléologique ne suffit pas à le juger comme un produit de la nature__{/green}. Il faut les associer, et c'est ce que fait le mieux l'**épigenèse**, que Kant préfère à toutes les théories de la génération de son temps.

    **Sans mécanisme, plus de produit de la nature.** Si l'on ne pensait l'organisme que par une intention, sans le mécanisme comme **instrument** de cette intention, on en ferait une œuvre surnaturelle. Comment deux causalités si différentes s'unissent, la loi universelle de la nature et une Idée qui la restreint à une forme particulière, notre raison ne le comprend pas : cela réside dans le substrat suprasensible. Mais {coral}sans cette sorte de causalité, des êtres organisés comme fins de la nature ne seraient pas des produits de la nature{/coral}.

    **Deux manières de penser l'origine des formes.** L'{red}**occasionnalisme**{/red} fait intervenir la cause suprême à chaque accouplement pour former la matière ; le {pink}**praestabilisme**{/pink} veut qu'elle ait seulement inscrit au commencement la disposition par laquelle un être organique produit son semblable. L'occasionnalisme conduit {red}« la nature tout entière [...] à sa perte »{/red}, et avec elle tout usage de la raison : aucun philosophe ne l'acceptera.

    **Le praestabilisme se divise à son tour.**

    | Système | Ce qu'est la génération |
    | préformation individuelle | une simple éduction, le développement d'un germe déjà formé |
    | épigenèse | une production, par le pouvoir producteur des géniteurs |

    La préformation individuelle, ou **théorie de l'évolution** (on dirait mieux : de l'**emboîtement**), fait de chaque individu un germe formé de la main du Créateur et seulement développé. L'épigenèse, que Kant appelle aussi **préformation générique**, ne préforme que le **pouvoir producteur** de l'espèce, ses dispositions, et laisse la nature produire chaque individu.

    **Pourquoi la raison est prévenue en faveur de l'épigenèse.** La préformation individuelle n'échappe pas au surnaturel : former tous les germes au commencement du monde, puis les préserver jusqu'à leur développement, en exige même davantage que l'occasionnalisme. Elle bute sur les {yellow}**bâtards**{/yellow} : pour expliquer qu'un hybride tienne aussi du père, il faut accorder à la semence du mâle une force formatrice qu'on refusait aux deux parents. Elle trouve même aux {yellow}monstruosités{/yellow} une finalité « digne d'étonnement ». L'épigenèse, au contraire, pense la reproduction {coral}« comme autoproduction, et non pas simplement comme développement »{/coral} : {green}« avec un investissement le plus limité possible de surnaturel »{/green}, elle abandonne à la nature tout ce qui suit le premier commencement, sur lequel la physique échoue de toute façon.

    **Blumenbach : la tendance formatrice.** Personne n'a fait plus pour l'épigenèse que {sky}Blumenbach{/sky}. Il fait commencer toute explication physique à la **matière organisée** : que la vie ait surgi d'elle-même de l'inanimé, il le déclare {red}« contraire à toute raison »{/red}. Sous le principe insondable d'une {coral}organisation originaire{/coral}, il laisse au mécanisme une part indéterminable mais indéniable, et nomme le pouvoir de la matière dans un corps organisé {violet}**tendance formatrice**{/violet} (*Bildungstrieb*), qui se tient {teal}« en quelque sorte sous la direction supérieure »{/teal} de cette organisation.

    ! L'épigenèse kantienne n'est pas la génération spontanée : elle part toujours d'une matière déjà organisée, transmise par les géniteurs.
    ! La « préformation générique » n'est pas la préformation individuelle : seul le pouvoir producteur de l'espèce est préformé, non chaque individu.
