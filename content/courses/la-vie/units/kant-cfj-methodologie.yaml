- id: kant-cfj-methodologie-l12
  title: "La portée de la preuve morale : croire, non savoir (§ 88-91)"
  notes: |-
    Les § 88 à 91 fixent la **portée** de la preuve morale. Elle ne donne {red}aucun savoir{/red} de Dieu ni de l'âme : {green}__elle a une réalité pratique, pour nous, et fonde une croyance, non une connaissance__{/green}. Cette limitation, loin d'être une perte, protège la religion de ses dérives.

    **Une réalité subjectivement pratique (§ 88).** La loi morale ne règle pas seulement nos actions, elle nous fait penser un objet à réaliser : {teal}« L'Idée d'une fin finale dans l'usage de la liberté d'après des lois morales a ainsi une réalité subjectivement pratique. »{/teal} Nous devons promouvoir le Bien du monde, l'union du bonheur universel et de la moralité ; la moralité dépend de nous, mais le bonheur dépend de la nature. D'où l'admission d'un auteur moral du monde, **pour nous**, non comme une détermination de l'objet.

    **L'utilité de cette limitation (§ 89).** Restreindre les Idées du suprasensible à l'usage pratique empêche la théologie de se perdre dans la {red}**théosophie**{/red} ou la {red}**démonologie**{/red}, et la religion de sombrer dans la {red}**théurgie**{/red} ou l'{red}**idolâtrie**{/red}. Il en va de même de l'âme : la psychologie rationnelle ne peut devenir une pneumatologie, une science des esprits ; elle est {coral}« une simple anthropologie du sens interne, c'est-à-dire connaissance de notre moi pensant dans la vie »{/coral}, et notre survie n'est admise que comme condition de la fin finale que nous impose la raison.

    **Une preuve pour nous, non sur l'objet en soi (§ 90).** Une preuve doit **convaincre**, non seulement persuader. Elle peut établir ce que l'objet est en soi (*kat' alêtheian*), ou ce qu'il est {teal}« pour nous (pour nous, hommes en général) »{/teal} (*kat' anthrôpon*) : la preuve morale est de la seconde sorte.

    **Opinion, savoir, croyance (§ 91).** Les choses connaissables sont de trois sortes : celles qui donnent matière à **opinion**, les **faits**, et les objets de **croyance**. Dieu et l'immortalité ne sont ni des faits démontrables ni des opinions, puisqu'on ne peut avoir d'opinion sur ce qu'aucune expérience ne peut présenter ; ils sont objets d'une croyance que la raison pratique rend nécessaire.

    ! La limitation de la preuve n'est pas un scepticisme : elle donne une certitude pratique pleine à ce dont il n'y a pas de savoir théorique.
