    sentence: "De manière générale, le vitalisme est tendanciellement ___, l'hylozoïsme tendanciellement moniste."
    answer: "dualiste"
    alt: []
  - id: intro3-l2-p3
    sentence: "De manière générale, le vitalisme est tendanciellement dualiste, l'hylozoïsme tendanciellement ___."
    answer: "moniste"
    alt: []
