    alt: []
  - id: intro3-l3-p2
    sentence: "Le vitalisme admet deux types de causalité : l'une, descendante, propre aux vivants ; l'autre, ___, réservée aux corps inertes."
    answer: "horizontale"
    alt: []
  - id: intro3-l3-p3
    sentence: "Parce qu'une causalité descendante organise les vivants, le vitalisme tient que leur connaissance est ___ aux lois de la mécanique, qui ne valent que pour les corps inertes."
