- id: intro3-l4
  title: "Le mécanisme : le vivant comme machine"
  notes: |-
    **La différence entre vitalisme et {violet}mécanisme{/violet} est plus profonde : elle porte à la fois sur le critère (a), la différence entre le vivant et l'inerte, et sur le critère (b), l'existence de principes vitaux.** Le mécanisme a une histoire sinueuse, et recouvre au XVIIe siècle des positions différentes, voire concurrentes ({sky}Roux{/sky}, 2022) : on s'en tient ici à un aperçu général.

    **Le mécanisme, ou « philosophie mécanique », s'enracine dans une analogie entre la nature et une machine.** {sky}Descartes{/sky} l'écrit du corps de l'homme (*L'Homme*) :

    {teal}« {/teal}Je désire que vous considériez que ces fonctions [telles que {yellow}la digestion, la croissance, le mouvement{/yellow}] suivent toutes naturellement, en cette machine, {teal}de la seule disposition de ses organes{/teal}, ne plus ne moins que font les mouvements {teal}d'une horloge ou autre automate{/teal}, de celle de ses contrepoids et de ses roues ; en sorte qu'il ne faut point à leur occasion concevoir en elle {teal}aucune autre âme végétative ni sensitive{/teal}, ni aucun autre principe de mouvement et de vie, que {teal}son sang et ses esprits{/teal} agités par la chaleur du feu qui brûle continuellement dans son cœur et qui n'est point d'autre nature que {teal}tous les feux qui sont dans les corps inanimés »{/teal}.

    Autrement dit : on n'a pas besoin d'une âme pour expliquer qu'une {yellow}horloge{/yellow} sonne l'heure, il suffit de ses roues ; de même pour la digestion. Et le feu du cœur est le même que celui de la cheminée : {coral}rien, dans le corps, n'est d'une autre nature que dans l'inanimé{/coral}.

    **Des mécanismes invisibles au lieu de principes vitaux.** La nutrition, la croissance, le mouvement s'expliquent par des {amber}particules matérielles de très petite taille{/amber} (comme les {violet}esprits animaux{/violet}, « parties les plus subtiles du sang »), avec certaines figures et certains mouvements. À la {red}causalité descendante{/red} du vitalisme, il est donc recommandable de substituer une {green}causalité horizontale{/green} : les mouvements et les chocs des particules produisent des agencements plus ou moins stables, des organes et leurs dispositions, qui donnent aux vivants leur structure et expliquent leur comportement.

    **On peut s'en tenir là : c'est la version faible.** Certains mécanistes du XVIIe siècle jugent seulement {coral}préférable{/coral} de recourir à des mécanismes invisibles plutôt qu'à des principes vitaux au pouvoir explicatif nul, ou quasi nul ; mais cela {red}n'implique pas l'inexistence de ces principes{/red} ({sky}Lenoble{/sky}, *Mersenne ou la naissance du mécanisme*). On renonce à s'en servir, sans les nier.
