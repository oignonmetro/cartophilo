- id: intro3-l2
  title: "Vitalisme et hylozoïsme : le plan ontologique"
  notes: |-
    **Le vitalisme se distingue de l'{violet}hylozoïsme{/violet} par la plus petite différence : leur divergence ne porte que sur le critère (a)**, la différence de nature entre vivant et non-vivant. L'hylozoïsme (du grec *hulè*, la matière, et *zôè*, la vie) attribue la vie à la matière elle-même.

    **Dualisme contre monisme.** De manière générale, {green}le vitalisme est tendanciellement *dualiste*{/green}, {pink}l'hylozoïsme tendanciellement *moniste*{/pink} (pour un panorama plus nuancé, voir {sky}Sartenaer{/sky}, 2013). Il s'ensuit des conséquences sur des plans qu'il faut distinguer ; d'abord le plan **ontologique** :
    - {green}le vitalisme fait de la distinction entre vivants et matière inerte une différence *ontologique*{/green} : les vivants possèdent {amber}un principe interne de mouvement{/amber} dont la matière inerte est entièrement dépourvue ;
    - {pink}l'hylozoïsme, en attribuant la vie à toute la matière, semble abolir de fait la distinction entre le vivant et l'inerte.{/pink}

    **La première définition de l'hylozoïsme est polémique, et explicitement moniste.** Le philosophe anglais {sky}Ralph Cudworth{/sky} (1617-1688) la forge pour le combattre (*The True Intellectual System of the Universe*, 1678) : {teal}« {/teal}Mais l'hylozoïste admet {teal}une certaine nature ou vie plastique{/teal}, essentielle et substantielle, ingénérée et incorruptible, tout en {teal}ne l'attribuant qu'à la matière{/teal}, puisqu'il ne suppose {teal}aucune autre substance au monde en dehors d'elle »{/teal}.

    **D'où, selon Cudworth, le lien entre hylozoïsme et {violet}athéisme{/violet}.** {amber}Si la matière a une activité propre{/amber}, elle n'a pas besoin d'un autre principe pour s'organiser ; {amber}et s'il n'existe aucune autre substance qu'elle{/amber}, il n'y en a pas pour l'organiser. Donc {coral}c'est anéantir l'idée même d'un principe immatériel donnant au monde son architecture{/coral}, c'est-à-dire Dieu.
  points:
  - id: intro3-l2-p1
    sentence: "Le vitalisme se distingue de l'___ par la plus petite différence : leur divergence ne porte que sur la différence de nature entre vivant et non-vivant."
    answer: "hylozoïsme"
    alt: []
