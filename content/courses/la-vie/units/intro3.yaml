- id: intro3-l7
  title: "Diderot et Engels : deux matérialismes contre le mécanisme"
  notes: |-
    **Sur le plan philosophique, les options matérialistes diffèrent profondément : deux d'entre elles rejettent le mécanisme, pour aboutir à des conclusions opposées sur le vitalisme.**

    **Diderot : une matière active et sensible.** {sky}Diderot{/sky} rejette les explications mécanistes, incapables selon lui de rendre compte du fonctionnement des organismes. Il en conclut que {green}la matière est intrinsèquement active et sensible{/green}. Ce n'est plus l'ordre qui produit le sensible à partir de l'insensible, comme chez Lucrèce : la sensibilité est déjà dans la matière.

    **Engels : une nature historique.** {sky}Engels{/sky} rejette aussi le mécanisme, qu'il croit, à tort, commun à tous les matérialistes du XVIIIe siècle ({sky}Wolfe{/sky}, *Lire le matérialisme*, 2020). Pour lui, les sciences de son temps appellent un matérialisme renouvelé, grâce à trois {teal}« découvertes décisives »{/teal} du XIXe siècle : {teal}« {/teal}celles {teal}de la cellule{/teal}, {teal}de la transformation de l'énergie{/teal} et {teal}de la théorie de l'évolution{/teal} à laquelle Darwin a donné son nom » (*Ludwig Feuerbach et la fin de la philosophie allemande classique*, 1888). Elles permettent d'expliquer la formation des vivants par {coral}une conception historique de la nature{/coral}, qui se développe et se complexifie par dépassements successifs. Elles articulent aussi, dans les sciences de la vie, l'étude des propriétés {amber}physico-chimiques{/amber} de la matière et une méthode {amber}holiste{/amber}, qui retrace l'histoire des structures visibles et leur génération par {violet}sélection naturelle{/violet}.

    **Une même critique, deux issues.**
    - {green}Chez Diderot, la critique du mécanisme promeut une nouvelle forme de vitalisme{/green} : si la matière sent, la vie est partout en germe.
    - {red}Chez Engels, elle en enterre définitivement les prétentions{/red} : si l'histoire de la nature explique la formation des vivants, plus besoin de principe vital.
