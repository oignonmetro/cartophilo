lessons:
- id: intro3-l1
  title: "Ce qu'admet le vitalisme"
  notes: |-
    **Le {violet}vitalisme{/violet} est l'option théorique qui épouse le mieux les contours du concept ordinaire de vie** ; ou plutôt, il en reprend certains éléments pour élaborer **un discours rigoureux**. C'est qu'il le faut : le sens commun use du mot sans savoir ce qu'il dit, comme le remarque {sky}Locke{/sky} (*Essai philosophique concernant l'entendement humain*, III, 10, §22) :

    {teal}« Il n'y a point de terme plus commun que celui de vie{/teal}, et il se trouverait peu de gens qui ne prissent pour un affront qu'on leur demandât ce qu'ils entendent par ce mot. Cependant, s'il est vrai qu'on mette en question, si {teal}une plante qui est déjà formée dans la semence{/teal} a la vie, si {teal}le poulet dans un œuf{/teal} qui n'a pas encore été couvé, ou {teal}un homme en défaillance{/teal} sans sentiment ni mouvement, est en vie ou non ; il est aisé de voir qu'{teal}une idée claire, distincte et déterminée n'accompagne pas toujours l'usage{/teal} d'un mot aussi connu que celui de vie. »

    Autrement dit : chacun croit savoir ce qu'est la vie, mais trois cas limites, {yellow}la graine{/yellow}, {yellow}l'œuf non couvé{/yellow}, {yellow}l'évanoui{/yellow}, suffisent à montrer que le mot n'a pas d'idée claire derrière lui. Le vitalisme veut lui en donner une.

    **Le vitalisme admet trois thèses**, qui serviront de critères pour le comparer à ses concurrents :
    - (a) {amber}une différence de nature entre le vivant et le non-vivant{/amber}, et par suite l'irréductibilité du premier au second ;
    - (b) {amber}un certain « principe vital »{/amber}, source des phénomènes caractéristiques du vivant (respiration, mouvement) ;
    - (c) {amber}le recours à des explications finalistes{/amber} pour connaître les vivants.

    **Mais il ne se contente pas de reprendre le concept ordinaire** : il occupe une place singulière parmi d'autres options, l'{violet}hylozoïsme{/violet}, le {violet}mécanisme{/violet}, le {violet}matérialisme{/violet}. Les leçons suivantes les exposent schématiquement, c'est-à-dire sans les circonstances historiques de leur apparition, ni l'extrême complexité des positions réellement tenues par tel ou tel « vitaliste » (voir *Les vitalismes. Histoire d'une équivoque*, dir. Nouailles, 2024).
