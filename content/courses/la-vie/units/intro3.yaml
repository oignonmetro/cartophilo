    answer: "reconduit"
    alt: ["reporte"]
- id: intro3-l6
  title: "Le matérialisme : la vie sans spécificité"
  notes: |-
    **Le mécanisme est compatible aussi bien avec le dualisme, chez {sky}Descartes{/sky}, qu'avec le {violet}matérialisme{/violet}, chez {sky}Hobbes{/sky}.** Qu'en est-il du matérialisme lui-même ?

    **Il semble d'abord écarter radicalement la possibilité même du vitalisme**, par trois thèses :
    - {amber}seule existe la matière{/amber} (et, éventuellement, le vide) ;
    - {amber}cette matière est essentiellement inerte{/amber} ;
    - {amber}ses agencements{/amber}, organes des vivants compris, {amber}sont le produit du hasard ou de la nécessité{/amber}, d'une combinaison aveugle de particules ou d'atomes.

    En supprimant, sinon le « mystère » de la vie, du moins {coral}sa spécificité{/coral}, il va à rebours du concept ordinaire, et suscite l'incrédulité du sens commun. {sky}Lucrèce{/sky} l'affronte (*De natura rerum*, II) : {teal}« {/teal}Ainsi la nature {teal}convertit en corps vivants toute espèce de nourriture{/teal}, elle en forme tous les sens des êtres animés, à peu près comme elle fait jaillir {teal}la flamme du bois sec{/teal} [...]. Vois-tu maintenant l'importance que prennent pour les atomes, et {teal}l'ordre dans lequel ils sont rangés{/teal}, et leurs mélanges, et les mouvements qu'ils s'impriment réciproquement ? [...] t'empêchent de croire que de {teal}l'insensible le sensible puisse naître ? »{/teal} Autrement dit : le vivant et le sensible ne sont que des atomes insensibles {yellow}autrement rangés{/yellow}, comme le bois devient flamme ; c'est l'ordre qui fait la différence, non une autre matière.

    **Mais le matérialisme est, lui aussi, difficile à caractériser d'un mot.** On peut d'abord le concevoir de manière {violet}déflationniste{/violet}, comme **la position par défaut du scientifique** qui étudie le vivant : il examine des agencements de la matière, à différents {violet}niveaux d'organisation{/violet}, {yellow}la structure visible{/yellow}, {yellow}la structure cellulaire{/yellow}, {yellow}la structure génétique{/yellow}, {yellow}la molécule d'ADN{/yellow}. Aucune {teal}« entité métaphysique »{/teal} ne se cache alors {teal}« derrière le mot vie »{/teal} ; seulement, à chaque {teal}« {/teal}niveau d'organisation [...] des {teal}nouveautés, tant de propriétés que de logique »{/teal}, dont le scientifique doit rendre compte ({sky}François Jacob{/sky}, *La logique du vivant*, 1970).

    ! Déflationniste ne veut pas dire réductionniste au sens naïf : chaque niveau d'organisation apporte du nouveau, que le niveau inférieur ne laissait pas prévoir.
