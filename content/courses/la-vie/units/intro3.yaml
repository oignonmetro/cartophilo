- id: intro3-l5
  title: "Le mécanisme fort, et la finalité reconduite"
  notes: |-
    **Dans sa version forte, le mécanisme s'oppose frontalement au vitalisme : il ne se contente plus d'en condamner la stérilité.**
    - **Sur le critère (a)** : {red}il nie toute différence de nature entre un corps mort et un corps vivant{/red}. Le premier est au second comme {yellow}une montre cassée{/yellow} à {yellow}une montre remontée{/yellow} ({sky}Descartes{/sky}, *Passions de l'âme*, art. 6) : la mort n'est pas le départ d'un principe, c'est une panne de la machine.
    - **Sur le critère (b)** : {red}il rejette le principe vital comme une chimère sans aucune réalité{/red}, par exemple, selon Descartes, parce qu'il repose sur {coral}une confusion entre des propriétés de la substance étendue et d'autres de la substance pensante{/coral} : on prête au corps ce qui n'appartient qu'à l'âme.

    **Sur le critère (c), le finalisme, les choses se compliquent** ({sky}Andrault{/sky}, *La raison des corps*, 2016). D'un côté, {green}l'analogie avec la machine exclut la cause finale de l'explication{/green} : il suffit d'invoquer la figure et le mouvement de particules qui s'entrechoquent, selon une causalité purement efficiente. Mais de l'autre, {coral}elle reconduit la finalité à un niveau supérieur{/coral}, en vertu du principe : {amber}pas de machine sans machiniste{/amber} ({sky}Canguilhem{/sky}, *La connaissance de la vie*). Une horloge s'explique par ses roues ; mais qu'il y ait une horloge suppose un horloger qui l'a faite pour marquer l'heure. La fin chassée des organes revient dans l'auteur de la machine.

    **Les trois options, sur les trois critères :**

    | Option | Différence de nature | Principes vitaux | Finalité |
    | vitalisme | oui | oui | pour les seuls vivants |
    | hylozoïsme | non, toute la matière vit | oui | pour toute la matière |
    | mécanisme fort | non, une montre cassée | non, une chimère | reconduite au machiniste |
  points:
  - id: intro3-l5-p1
    sentence: "Le mécanisme fort nie toute différence de nature entre un corps mort et un corps vivant : le premier est au second comme une montre ___ à une montre remontée."
    answer: "cassée"
    alt: []
