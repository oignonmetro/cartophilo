- id: intro3-l3
  title: "Vitalisme et hylozoïsme : causalité et nuances"
  notes: |-
    **La différence ontologique a des répercussions sur le plan causal.**
    - {green}Le vitalisme admet au moins deux types de causalité{/green} : l'une, {amber}descendante{/amber}, par laquelle le ou les principes vitaux exercent sur la matière une force d'organisation ; l'autre, {amber}horizontale{/amber}, réservée aux corps inertes. Il s'ensuit que {coral}la connaissance des vivants est *irréductible* aux lois de la mécanique{/coral}, qui ne valent que pour les corps inertes.
    - {pink}Pour l'hylozoïste, l'idée d'une causalité mécanique paraît devoir être bannie{/pink}, puisqu'elle suppose une matière purement passive : or pour lui la matière vit.

    **D'où le verdict de Kant.** L'hylozoïsme refuse de concéder {teal}« le manque de vie de la matière{/teal} par elle-même comme matière » ; il conduit donc à {teal}« la mort de toute philosophie de la nature »{/teal} (*Premiers principes métaphysiques de la science de la nature*). Le paradoxe est voulu : la physique repose sur l'inertie de la matière, qui ne change d'état que sous l'effet d'une cause extérieure ; une matière vivante, qui se mouvrait d'elle-même, rendrait toute loi du mouvement impossible.

    **Au-delà, bien des nuances.** L'hylozoïsme peut concevoir {amber}des principes vitaux inhérents à la matière{/amber}, ou {amber}un principe vital unique dont toute la matière participe{/amber} (l'hypothèse de l'{violet}âme du monde{/violet}) ; ces principes prennent des formes très diverses ({yellow}antipathies{/yellow}, {yellow}sympathies{/yellow}, {yellow}dynamisme interne{/yellow}, {yellow}natures « plastiques »{/yellow}). D'où des positions hybrides : {coral}le vitalisme matérialiste est moniste{/coral} ; et Cudworth lui-même admet des {violet}natures plastiques{/violet}, entités intermédiaires entre Dieu et la nature. Cette malléabilité explique qu'on ait parlé d'hylozoïsme pour le système, pourtant complexe et à étudier pour lui-même, de {sky}Spinoza{/sky}.

    **Ce qui les accorde.** Vitalisme et hylozoïsme admettent tous deux {green}des principes vitaux{/green} et {green}le recours aux causes finales{/green}, que le vitalisme restreint aux seuls vivants. Étendus à toute la matière, ils font de l'hylozoïsme un {violet}panvitalisme{/violet}.
  points:
  - id: intro3-l3-p1
    sentence: "Le vitalisme admet deux types de causalité : l'une, ___, par laquelle les principes vitaux exercent sur la matière une force d'organisation ; l'autre, horizontale, réservée aux corps inertes."
