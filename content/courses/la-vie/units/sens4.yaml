- id: sens4-l5
  title: "La sensation commune : la conscience de sentir"
  notes: |
    Seconde fonction, connexe : la sensation commune assure une {violet}« **conscience de sentir** »{/violet} ; c'est par elle que l'on *sent que* l'on voit, goûte ou touche. *De l'âme*, III, 2 {amber}est embarrassé sur ce point{/amber}, mais le traité *Du sommeil et de la veille*, l'un des *Parva naturalia*, l'établit clairement, comme l'a montré {sky}Jacques Brunschwig{/sky} dans un article fameux (« Les multiples chemins aristotéliciens de la sensation commune », 1991) : {teal}« Posons par ailleurs{/teal} que chaque sens en particulier possède d'une part {teal}quelque chose de propre{/teal}, d'autre part {teal}quelque chose de commun{/teal} (ainsi la vue possède-t-elle en propre le voir, l'ouïe l'entendre et chaque sens les autres facultés de la même manière) ; posons d'autre part qu'il y a aussi {teal}une faculté commune qui les accompagne{/teal} (`akolouthein`) tous, et par laquelle {teal}on sent que l'on voit et que l'on entend. »{/teal}

    La sensation commune est une opération distincte des sens, {amber}qui ne va pas sans l'un d'eux{/amber}. Aristote se démarque encore de la conception intellectualiste (Platon, puis le cartésianisme), selon laquelle on ne *sent* pas que l'on sent, {red}on *juge* que l'on sent{/red} : il maintient {green}la conscience de sentir **à même la sensation**{/green}. {coral}La sensation commune **parachève** les sens particuliers{/coral} : chacun ne s'exerce pleinement que si elle s'exerce en même temps.

    Aristote tient ainsi ensemble le {amber}**pluralisme**{/amber} de la sensibilité, dont il veut rendre la richesse et la variété sans la réduire, et son {amber}**unification immanente et organique**{/amber} : une faculté, et une pluralité plus ou moins unifiée, sans opération mentale extérieure.

    ! La conscience de sentir n'est pas un jugement ajouté à la sensation : elle est sentie.
  points:
