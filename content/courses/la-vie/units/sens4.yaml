- id: sens4-l2
  title: "Les sensibles propres, ou la diversité des sens"
  notes: |
    Les **sensibles propres** sont perçus en propre par un seul sens ; les **sensibles communs**, par plusieurs. Cette distinction, objet de *De l'âme*, II, 6 et reprise en de nombreux lieux du corpus, est fondamentale pour articuler la pluralité et l'unité de la sensibilité.

    Les sensibles propres sont « ceux qui ne se laissent pas sentir par un autre sens » : « ainsi, la vue sent la couleur, l'ouïe, le son, et le goût, la saveur ». La saveur ne peut être vue, ni la couleur entendue. « Le toucher, lui, comporte effectivement un plus grand nombre de différences, mais il n'en reste pas moins que chaque sens est juge de ses différences » : on touche en propre le rugueux et le lisse, le froid et le chaud.

    Chaque sensible propre est structuré par un **couple de contraires** : la couleur par le blanc et le noir, le son par l'aigu et le grave. Ce sont ces contraires que chaque sens est « en puissance », et dont la sensation est l'activité.

    Chaque sens « juge » ou « distingue » (`krinein`) les « différences » (`diaphorai`) de ses sensibles. La sensation n'est pas pour autant un **jugement**, la prédication d'un attribut à un sujet, du moins pas immédiatement : elle est une faculté « **critique** » au sens de `krinein`, qui constate et établit des différences. L'acte du sensible, c'est sa différence ; et cette différence est aussi l'acte de la sensibilité qui la sent : d'où leur acte commun.

    ! « Critique » ne veut pas dire ici « qui juge », mais « qui distingue ».
