- id: sens4-l4
  title: "La sensation commune : comparer les sens"
  notes: |
    Aristote accorde à la {violet}**sensation commune**{/violet}, outre la perception des sensibles communs, deux fonctions qui établissent la véritable unité de la sensibilité.

    D'abord, la {amber}**commensurabilité**{/amber} des sens : sentir les différences *entre* les sensibles propres. {teal}« Si, par exemple, la vue distingue le blanc du noir{/teal}, {teal}le goût, par contre, distingue le doux de l'amer{/teal}, et il en va de même pour les autres sens. Toutefois, dès lors que {teal}nous discernons aussi le blanc du doux{/teal} et chacun des sensibles par rapport à chaque autre, c'est qu'{teal}un certain moyen nous permet de sentir cette différence »{/teal} (*De l'âme*, III, 2). Ce « moyen », c'est la sensation du sensible commun : {green}la sensibilité compare **par une sensation** les sensibles des différents sens{/green}, et les subsume sans les réduire à un seul.

    Le sens commun n'est donc pas {red}une opération judicative{/red} : il s'agit de {teal}« sentir une certaine différence »{/teal} (`tini aisthanometha diapherei`). {coral}La sensibilité est **autonome**{/coral} : nul besoin de la raison ni d'une faculté de juger pour établir identités et différences entre les contenus des sens.

    Aristote prend ainsi ses distances avec {sky}Platon{/sky}, pour qui, dans le {sky}*Théétète*{/sky}, c'est {red}**l'âme et non la sensation**{/red} qui connaît la différence entre les sensations des différents sens. Le même reproche vaudrait contre toute {red}approche **intellectualiste**{/red} de la perception, comme celle de {sky}Descartes{/sky} : dans {yellow}le « morceau de cire »{/yellow} des *Méditations métaphysiques* (II), les qualités senties sont unifiées par {red}un **jugement** de l'entendement{/red}. Dans ces cadres, la différence entre sensibles n'est pas *sentie*, et l'unité vient d'{red}une opération **extérieure** à la sensibilité{/red}.

    ! Aristote rend les sens commensurables sans les réduire à un seul, comme le faisait Démocrite.
  points:
  - id: sens4-l4-p1
    sentence: "__Outre sentir les sensibles communs, la sensation commune a deux__ ___ qui établissent le fait que la sensibilité est une faculté dotée d'**une véritable unité**."
    answer: "fonctions"
    alt: []
  - id: sens4-l4-p2
    sentence: "__La sensation du sensible commun assure une forme de__ ___ des sens entre eux, en rendant possible **la sensation des différences entre les sensibles propres**."
    answer: "commensurabilité"
    alt: []
  - id: sens4-l4-p4
