lessons:
- id: sens4-l1
  title: "Contre la réduction de tous les sens au toucher"
  notes: |
    Si le fonctionnement unique des sens donne à la sensibilité une unité {amber}**analogique**{/amber}, Aristote fait aussi droit à {amber}la **pluralité** des sens, irréductibles les uns aux autres{/amber}. La sensibilité n'est pourtant pas {pink}une simple collection de facultés{/pink} : son unité supérieure a pour principe la {violet}« **sensation commune** »{/violet}.

    La théorie de l'intermédiaire s'oppose de front à la manière démocritéenne, et plus largement matérialiste, de {red}faire de la sensation un **contact**{/red} de l'objet ou de ses « effluves » avec l'organe. Paradoxalement, c'est elle qui permet la pluralité des sens : {coral}si tout était contact, tous les sens seraient du toucher{/coral}. {teal}« Démocrite et la plupart des physiciens{/teal} qui traitent de la sensation font {teal}quelque chose de tout à fait absurde{/teal}. {teal}Ils font en effet de tous les sensibles les objets du toucher{/teal}. Pourtant s'il en allait ainsi, il est évident que {teal}chacun des autres sens serait une sorte de toucher{/teal}. Or il n'est pas difficile de s'apercevoir que {teal}c'est impossible. »{/teal} (*De la sensation et des sensibles*, 4)

    Pour {sky}Démocrite{/sky}, les qualités sensibles sont transmises par les {red}**simulacres**{/red} des objets et, selon un témoignage de {sky}Théophraste{/sky}, par les {red}**figures**{/red} des atomes qui heurtent les organes. Il {teal}« {/teal}dit en effet du blanc et du noir que {teal}ce dernier est rugueux et l'autre lisse{/teal}, et {teal}rapporte les saveurs aux figures »{/teal} : couleurs et saveurs deviennent des qualités tactiles. Contre ce {red}**réductionnisme**{/red}, chaque sens possède des qualités qu'il sent en propre, étrangères aux autres : les {violet}« sensibles propres »{/violet}.

    ! La théorie du contact n'unifie pas les sens : elle les supprime tous au profit du toucher.
  points:
  - id: sens4-l1-p1
    sentence: "__Si la sensibilité possède un unique modèle de fonctionnement__, Aristote fait en même temps droit à la ___ des sens."
    answer: "pluralité"
    alt: []
  - id: sens4-l1-p2
    sentence: "__L'intérêt d'Aristote pour la diversité des sens n'implique pas__ que la sensibilité soit **une somme de facultés** dont l'unité ne serait qu'___."
    answer: "analogique"
    alt: []
  - id: sens4-l1-p3
