- id: sens4-l5
  title: "La sensation commune : la conscience de sentir"
  notes: |
    Seconde fonction, connexe : la sensation commune assure une « **conscience de sentir** » ; c'est par elle que l'on *sent que* l'on voit, goûte ou touche. *De l'âme*, III, 2 est embarrassé sur ce point, mais le traité *Du sommeil et de la veille*, l'un des *Parva naturalia*, l'établit clairement, comme l'a montré Jacques Brunschwig dans un article fameux (« Les multiples chemins aristotéliciens de la sensation commune », 1991) : « Posons par ailleurs que chaque sens en particulier possède d'une part quelque chose de propre, d'autre part quelque chose de commun (ainsi la vue possède-t-elle en propre le voir, l'ouïe l'entendre et chaque sens les autres facultés de la même manière) ; posons d'autre part qu'il y a aussi une faculté commune qui les accompagne (`akolouthein`) tous, et par laquelle on sent que l'on voit et que l'on entend. »

    La sensation commune est une opération distincte des sens, qui ne va pas sans l'un d'eux. Aristote se démarque encore de la conception intellectualiste (Platon, puis le cartésianisme), selon laquelle on ne *sent* pas que l'on sent, on *juge* que l'on sent : il maintient la conscience de sentir **à même la sensation**. La sensation commune **parachève** les sens particuliers : chacun ne s'exerce pleinement que si elle s'exerce en même temps.

    Aristote tient ainsi ensemble le **pluralisme** de la sensibilité, dont il veut rendre la richesse et la variété sans la réduire, et son **unification immanente et organique** : une faculté, et une pluralité plus ou moins unifiée, sans opération mentale extérieure.

    ! La conscience de sentir n'est pas un jugement ajouté à la sensation : elle est sentie.
  points:
