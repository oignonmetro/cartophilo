- id: sens4-l7
  title: "Les sens à distance et la vie bonne"
  notes: |
    Les sens qui perçoivent **à distance**, au contraire, « ont pour but le bien-être et sont donnés, non d'emblée à n'importe quel genre d'animal au hasard, mais à certains, comme le genre capable de locomotion, qui les possèdent nécessairement » (*De l'âme*, III, 12 ; argument voisin en *De la sensation et des sensibles*, 1). La sensibilité de chaque animal répond à son **mode de vie** : les huîtres, immobiles, n'ont pas besoin de sentir ce qui se passe loin d'elles ; les animaux qui se déplacent ont besoin des sens à distance pour s'**orienter**. La bipartition correspond à deux manières de vivre.

    Un passage « fascinant » du *De la sensation et des sensibles* (1) va plus loin : « pour les animaux qui possèdent l'intelligence (`phronèsis`), ces sensations », l'ouïe, la vue et l'odorat, « existent en vue du bien. Elles annoncent en effet un grand nombre de différences d'où proviennent à la fois l'intelligence des intelligibles et celle des actions à accomplir. » Les sens ont part à la **vie bonne** de l'être humain, dont l'excellence (prudence et sagesse) est l'exercice de l'intelligence, qui consiste elle aussi à établir des différences. L'intelligence ne se réduit pas aux sens ; mais ceux-ci ne sont pas exclus de son exercice.

    | Sens qui a le plus part à la vie bonne | Pourquoi |
    | Par elle-même : la **vue** | « tous les corps ont part à la couleur », et c'est par elle qu'on perçoit le mieux les sensibles communs |
    | Par accident : l'**ouïe** | le discours (`logos`) est audible et « est cause du savoir » |

    Les Grecs ne pratiquaient pas, ou très peu, la **lecture silencieuse** : on lisait ou se faisait lire les textes à voix haute. La sensibilité n'est pas en vase clos : **il y a autant de types de sensibilité que d'espèces animales**.

    ! Chez l'homme, les sens ne servent pas seulement la survie : ils existent aussi en vue du bien.
