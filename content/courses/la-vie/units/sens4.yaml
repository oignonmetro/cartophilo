- id: sens4-l3
  title: "Les sensibles communs, ou l'unité de la sensibilité"
  notes: |
    Les sens ne sont pas absolument imperméables : certains sensibles sont **communs** à plusieurs. « Quant aux sensibles qu'on appelle communs, ce sont le mouvement, le repos, le nombre, la figure, la grandeur, vu que pareils objets ne sont propres à aucun sens, mais sont communs à tous ; en effet, un mouvement sensible au toucher l'est aussi à la vue » (*De l'âme*, II, 6). Je peux voir et toucher du mouvement, non voir du chaud ni toucher une couleur.

    Il n'y a pour autant que **cinq sens** : les sensibles communs n'ont pas de sens particulier (*De l'âme*, III, 1). « Mais il ne saurait y avoir non plus, pour les sensibles communs, quelque organe sensoriel propre. Ce sont des déterminations que chaque sens nous permet de percevoir par coïncidence, comme le mouvement, la stabilité, la figure, la grandeur, le nombre et l'unité. »

    Ils sont sentis « **par coïncidence** » (`kata sumbebèkos`) : chaque sens les perçoit **au travers** de ses sensibles propres. Quand une mouche marche sur mon bras, son mouvement est « touché » par coïncidence avec le rugueux de ses pattes et « vu » par coïncidence avec la couleur noire qui se déplace.

    Ce n'est pas un acte **prédicatif** : je ne prédique pas le mouvement de la couleur, je le **sens** immédiatement avec elle ; le mouvement est littéralement vu et touché. Il y a du sensible commun dès qu'il y a un sens, jamais sans un sens. Le sensible commun est une **passerelle** entre les sens : la sensibilité est proprement **une** faculté, dont les sens sont les instances.

    ! Sentir « par coïncidence » n'est pas inférer : le mouvement de la mouche est bel et bien senti.
