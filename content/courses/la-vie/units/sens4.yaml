- id: sens4-l3
  title: "Les sensibles communs, ou l'unité de la sensibilité"
  notes: |
    Les sens ne sont pas absolument imperméables : {violet}certains sensibles sont **communs**{/violet} à plusieurs. {teal}« Quant aux sensibles qu'on appelle communs{/teal}, ce sont {teal}le mouvement, le repos, le nombre, la figure, la grandeur{/teal}, vu que pareils objets {teal}ne sont propres à aucun sens, mais sont communs à tous{/teal} ; en effet, {teal}un mouvement sensible au toucher l'est aussi à la vue »{/teal} (*De l'âme*, II, 6). {yellow}Je peux voir et toucher du mouvement, non voir du chaud ni toucher une couleur{/yellow}.

    {coral}Il n'y a pour autant que **cinq sens**{/coral} : les sensibles communs n'ont pas de sens particulier (*De l'âme*, III, 1). {teal}« Mais il ne saurait y avoir non plus{/teal}, pour les sensibles communs, {teal}quelque organe sensoriel propre{/teal}. Ce sont des déterminations que chaque sens nous permet de percevoir {teal}par coïncidence, comme{/teal} le mouvement, la stabilité, la figure, la grandeur, {teal}le nombre et l'unité. »{/teal}

    Ils sont sentis {violet}« **par coïncidence** »{/violet} (`kata sumbebèkos`) : chaque sens les perçoit {green}**au travers** de ses sensibles propres{/green}. {yellow}Quand une mouche marche sur mon bras{/yellow}, son mouvement est « touché » par coïncidence avec le rugueux de ses pattes et « vu » par coïncidence avec la couleur noire qui se déplace.

    Ce n'est pas {red}un acte **prédicatif**{/red} : je ne prédique pas le mouvement de la couleur, {green}je le **sens** immédiatement avec elle{/green} ; le mouvement est littéralement vu et touché. Il y a du sensible commun dès qu'il y a un sens, jamais sans un sens. {coral}Le sensible commun est une **passerelle** entre les sens{/coral} : {coral}la sensibilité est proprement **une** faculté{/coral}, dont les sens sont les instances.

    ! Sentir « par coïncidence » n'est pas inférer : le mouvement de la mouche est bel et bien senti.
  points:
