- id: sens4-l6
  title: "Toucher et goût, sens de la vie"
  notes: |
    L'unité sans réduction n'empêche pas une **hiérarchie** des sens. Le **toucher** est commun à tous les animaux : « Sans le toucher, aucun autre sens ne saurait être attribué » (*De l'âme*, III, 13 ; ce dernier chapitre du traité est une sorte d'appendice sur ce sens). Deux raisons à sa particularité : on sent les qualités tactiles à travers le **corps entier**, non à travers une région spécifique ; et perdre le toucher, c'est **mourir**. Un animal peut devenir aveugle, sourd, perdre le goût, mais « il est clair qu'il s'agit du seul sens dont la privation entraîne nécessairement la mort des animaux ». Être un animal, c'est posséder au moins le toucher.

    Le **goût**, commun lui aussi à tous les animaux, peut être perdu sans mourir. Il est nécessaire « à cause de la nutrition. C'est en effet le sens qui distingue entre le plaisant et le désagréable dans la nourriture, de sorte que l'on se détourne de l'un et que l'on recherche l'autre et, d'une manière générale, la saveur est une propriété de ce qui est nutritif » (*De la sensation et des sensibles*, 1). Certains animaux immobiles, comme les **huîtres**, n'ont que le toucher et le goût : « S'il n'a pas de sensation quand il est touché, l'animal sera incapable de fuir ceci et de prendre cela. Or, dans ces conditions, il lui sera impossible d'assurer sa conservation. C'est pourquoi le goût, lui aussi, se présente comme une sorte de toucher » (*De l'âme*, III, 12).

    La remarque a troublé les commentateurs : si la gustation est « la sensation du tangible qui fait office d'aliment », le goût ne serait qu'un cas du toucher, contre l'irréductibilité des sens. G. Romeyer Dherbey y voit une **évolution** : une bipartition platonicienne (le *Philèbe*) entre sens du contact et sens à distance aurait précédé la division en cinq sens, proprement aristotélicienne. Ulysse Chaintreuil juge l'hypothèse inutile : Aristote rapproche toucher et goût parce qu'ils servent la **nutrition**, nécessaire à tout animal, même le plus simple.

    ! Le goût est « une sorte de toucher » par sa fonction nutritive, non parce qu'il se confondrait avec le toucher.
