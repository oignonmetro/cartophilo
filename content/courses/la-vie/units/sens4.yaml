    answer: "doux"
    alt: []
  - id: sens4-l4-p5
    sentence: "« Si, par exemple, la vue distingue le blanc du noir, le goût, par contre, distingue le doux de l'amer, et il en va de même pour les autres sens. Toutefois, dès lors que nous discernons aussi le blanc du doux et chacun des sensibles par rapport à chaque autre, **c'est qu'un certain** ___ nous permet de sentir cette différence. »"
