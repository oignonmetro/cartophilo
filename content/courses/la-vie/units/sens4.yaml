- id: sens4-l1
  title: "Contre la réduction de tous les sens au toucher"
  notes: |
    Si le fonctionnement unique des sens donne à la sensibilité une unité **analogique**, Aristote fait aussi droit à la **pluralité** des sens, irréductibles les uns aux autres. La sensibilité n'est pourtant pas une simple collection de facultés : son unité supérieure a pour principe la « **sensation commune** ».

    La théorie de l'intermédiaire s'oppose de front à la manière démocritéenne, et plus largement matérialiste, de faire de la sensation un **contact** de l'objet ou de ses « effluves » avec l'organe. Paradoxalement, c'est elle qui permet la pluralité des sens : si tout était contact, tous les sens seraient du toucher. « Démocrite et la plupart des physiciens qui traitent de la sensation font quelque chose de tout à fait absurde. Ils font en effet de tous les sensibles les objets du toucher. Pourtant s'il en allait ainsi, il est évident que chacun des autres sens serait une sorte de toucher. Or il n'est pas difficile de s'apercevoir que c'est impossible. » (*De la sensation et des sensibles*, 4)

    Pour Démocrite, les qualités sensibles sont transmises par les **simulacres** des objets et, selon un témoignage de Théophraste, par les **figures** des atomes qui heurtent les organes. Il « dit en effet du blanc et du noir que ce dernier est rugueux et l'autre lisse, et rapporte les saveurs aux figures » : couleurs et saveurs deviennent des qualités tactiles. Contre ce **réductionnisme**, chaque sens possède des qualités qu'il sent en propre, étrangères aux autres : les « sensibles propres ».

    ! La théorie du contact n'unifie pas les sens : elle les supprime tous au profit du toucher.
