- id: sens4-l2
  title: "Les sensibles propres, ou la diversité des sens"
  notes: |
    Les {violet}**sensibles propres**{/violet} sont perçus en propre par un seul sens ; les {violet}**sensibles communs**{/violet}, par plusieurs. Cette distinction, objet de *De l'âme*, II, 6 et reprise en de nombreux lieux du corpus, est fondamentale pour articuler la pluralité et l'unité de la sensibilité.

    Les sensibles propres sont {teal}« ceux qui ne se laissent pas sentir par un autre sens »{/teal} : {teal}« ainsi, la vue sent la couleur, l'ouïe, le son, et le goût, la saveur »{/teal}. {yellow}La saveur ne peut être vue, ni la couleur entendue{/yellow}. {teal}« Le toucher, lui, comporte effectivement un plus grand nombre de différences{/teal}, mais il n'en reste pas moins que {teal}chaque sens est juge de ses différences »{/teal} : on touche en propre {yellow}le rugueux et le lisse, le froid et le chaud{/yellow}.

    Chaque sensible propre est structuré par un {coral}**couple de contraires**{/coral} : {yellow}la couleur par le blanc et le noir, le son par l'aigu et le grave{/yellow}. Ce sont ces contraires que chaque sens est « en puissance », et dont la sensation est l'activité.

    Chaque sens {violet}« juge » ou « distingue »{/violet} (`krinein`) les « différences » (`diaphorai`) de ses sensibles. La sensation n'est pas pour autant {red}un **jugement**, la prédication d'un attribut à un sujet{/red}, du moins pas immédiatement : elle est {green}une faculté « **critique** »{/green} au sens de `krinein`, {amber}qui constate et établit des différences{/amber}. {coral}L'acte du sensible, c'est sa différence{/coral} ; et cette différence est aussi l'acte de la sensibilité qui la sent : d'où leur acte commun.

    ! « Critique » ne veut pas dire ici « qui juge », mais « qui distingue ».
  points:
