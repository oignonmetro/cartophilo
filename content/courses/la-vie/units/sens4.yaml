- id: sens4-l6
  title: "Toucher et goût, sens de la vie"
  notes: |
    L'unité sans réduction n'empêche pas {amber}une **hiérarchie** des sens{/amber}. Le {violet}**toucher**{/violet} est commun à tous les animaux : {teal}« Sans le toucher, aucun autre sens ne saurait être attribué »{/teal} (*De l'âme*, III, 13 ; ce dernier chapitre du traité est une sorte d'appendice sur ce sens). Deux raisons à sa particularité : on sent les qualités tactiles à travers le {coral}**corps entier**{/coral}, non à travers une région spécifique ; et {coral}perdre le toucher, c'est **mourir**{/coral}. Un animal peut devenir {yellow}aveugle, sourd, perdre le goût{/yellow}, mais {teal}« il est clair qu'il s'agit du seul sens{/teal} dont la privation {teal}entraîne nécessairement la mort des animaux »{/teal}. {coral}Être un animal, c'est posséder au moins le toucher{/coral}.

    Le {violet}**goût**{/violet}, commun lui aussi à tous les animaux, peut être perdu sans mourir. Il est nécessaire {teal}« à cause de la nutrition{/teal}. C'est en effet {teal}le sens qui distingue entre le plaisant et le désagréable dans la nourriture{/teal}, de sorte que l'on se détourne de l'un et que l'on recherche l'autre et, d'une manière générale, {teal}la saveur est une propriété de ce qui est nutritif »{/teal} (*De la sensation et des sensibles*, 1). Certains animaux immobiles, comme les {yellow}**huîtres**{/yellow}, n'ont que le toucher et le goût : {teal}« S'il n'a pas de sensation quand il est touché{/teal}, l'animal sera {teal}incapable de fuir ceci et de prendre cela{/teal}. Or, dans ces conditions, il lui sera impossible d'{teal}assurer sa conservation{/teal}. C'est pourquoi le goût, lui aussi, se présente comme {teal}une sorte de toucher »{/teal} (*De l'âme*, III, 12).

    La remarque a troublé les commentateurs : si la gustation est {teal}« la sensation du tangible qui fait office d'aliment »{/teal}, le goût ne serait qu'un cas du toucher, contre l'irréductibilité des sens. {sky}G. Romeyer Dherbey{/sky} y voit {red}une **évolution**{/red} : une bipartition platonicienne (le *Philèbe*) entre sens du contact et sens à distance aurait précédé la division en cinq sens, proprement aristotélicienne. {sky}Ulysse Chaintreuil{/sky} juge l'hypothèse inutile : Aristote rapproche toucher et goût {green}parce qu'ils servent la **nutrition**{/green}, nécessaire à tout animal, même le plus simple.

    ! Le goût est « une sorte de toucher » par sa fonction nutritive, non parce qu'il se confondrait avec le toucher.
