- id: sens4-l4
  title: "La sensation commune : comparer les sens"
  notes: |
    Aristote accorde à la **sensation commune**, outre la perception des sensibles communs, deux fonctions qui établissent la véritable unité de la sensibilité.

    D'abord, la **commensurabilité** des sens : sentir les différences *entre* les sensibles propres. « Si, par exemple, la vue distingue le blanc du noir, le goût, par contre, distingue le doux de l'amer, et il en va de même pour les autres sens. Toutefois, dès lors que nous discernons aussi le blanc du doux et chacun des sensibles par rapport à chaque autre, c'est qu'un certain moyen nous permet de sentir cette différence » (*De l'âme*, III, 2). Ce « moyen », c'est la sensation du sensible commun : la sensibilité compare **par une sensation** les sensibles des différents sens, et les subsume sans les réduire à un seul.

    Le sens commun n'est donc pas une opération judicative : il s'agit de « sentir une certaine différence » (`tini aisthanometha diapherei`). La sensibilité est **autonome** : nul besoin de la raison ni d'une faculté de juger pour établir identités et différences entre les contenus des sens.

    Aristote prend ainsi ses distances avec Platon, pour qui, dans le *Théétète*, c'est **l'âme et non la sensation** qui connaît la différence entre les sensations des différents sens. Le même reproche vaudrait contre toute approche **intellectualiste** de la perception, comme celle de Descartes : dans le « morceau de cire » des *Méditations métaphysiques* (II), les qualités senties sont unifiées par un **jugement** de l'entendement. Dans ces cadres, la différence entre sensibles n'est pas *sentie*, et l'unité vient d'une opération **extérieure** à la sensibilité.

    ! Aristote rend les sens commensurables sans les réduire à un seul, comme le faisait Démocrite.
