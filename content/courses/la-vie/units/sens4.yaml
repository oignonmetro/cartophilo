- id: sens4-l7
  title: "Les sens à distance et la vie bonne"
  notes: |
    {amber}Les sens qui perçoivent **à distance**{/amber}, au contraire, {teal}« {/teal}ont pour but le bien-être et sont donnés, non d'emblée à n'importe quel genre d'animal au hasard, mais à certains, comme {teal}le genre capable de locomotion{/teal}, qui {teal}les possèdent nécessairement »{/teal} (*De l'âme*, III, 12 ; argument voisin en *De la sensation et des sensibles*, 1). La sensibilité de chaque animal {coral}répond à son **mode de vie**{/coral} : {yellow}les huîtres, immobiles, n'ont pas besoin de sentir ce qui se passe loin d'elles{/yellow} ; les animaux qui se déplacent ont besoin des sens à distance pour s'**orienter**. La bipartition correspond à deux manières de vivre.

    Un passage « fascinant » du *De la sensation et des sensibles* (1) va plus loin : {teal}« {/teal}pour les animaux qui possèdent l'intelligence (`phronèsis`), {teal}ces sensations »{/teal}, l'ouïe, la vue et l'odorat, {teal}« existent en vue du bien{/teal}. Elles annoncent en effet {teal}un grand nombre de différences{/teal} d'où proviennent à la fois {teal}l'intelligence des intelligibles et celle des actions à accomplir. »{/teal} {green}Les sens ont part à la **vie bonne** de l'être humain{/green}, dont l'excellence (prudence et sagesse) est l'exercice de l'intelligence, qui consiste elle aussi à établir des différences. {amber}L'intelligence ne se réduit pas aux sens ; mais ceux-ci ne sont pas exclus de son exercice{/amber}.

    | Sens qui a le plus part à la vie bonne | Pourquoi |
    | Par elle-même : la **vue** | « tous les corps ont part à la couleur », et c'est par elle qu'on perçoit le mieux les sensibles communs |
    | Par accident : l'**ouïe** | le discours (`logos`) est audible et « est cause du savoir » |

    Les Grecs ne pratiquaient pas, ou très peu, la {yellow}**lecture silencieuse**{/yellow} : on lisait ou se faisait lire les textes à voix haute. La sensibilité n'est pas en vase clos : {coral}**il y a autant de types de sensibilité que d'espèces animales**{/coral}.

    ! Chez l'homme, les sens ne servent pas seulement la survie : ils existent aussi en vue du bien.
