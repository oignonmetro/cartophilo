- id: vies4-l3
  title: "Jamblique : le nom de philosophe"
  notes: |-
    **Jamblique, dans *La vie de Pythagore*, précise ces distinctions.** Il rappelle d'abord que Pythagore aurait inventé le nom de {violet}philosophe{/violet} pour désigner son propre mode de vie (58) : {teal}« {/teal}On dit que {teal}Pythagore est le premier à s'être appelé lui-même "philosophe"{/teal} : non seulement il fut à l'origine d'un nom nouveau, mais encore il a donné à l'avance une démonstration profitable de cette chose [*pragma*], {teal}qui lui était propre{/teal} [*oikeion*]. » Il y aurait donc eu {amber}d'abord un mode de vie propre à Pythagore{/amber}, qu'il aurait ensuite nommé par un néologisme et justifié par une explication : la panégyrie.

    **La panégyrie selon Jamblique** (58) : les hommes {teal}« {/teal}venaient au monde [*tèn eis ton bion anthrôpôn parodon*] {teal}comme une troupe se rendant à des panégyries{/teal} », chacun pour {teal}« un besoin [*chreian*] différent »{/teal} :
    - l'un, {yellow}en vue du commerce et du gain{/yellow}, vient décharger sa marchandise ;
    - l'autre, {yellow}en vue de la gloire{/yellow}, faire une démonstration de la force de son corps ;
    - une troisième sorte, {teal}« {/teal}{teal}la plus libérale{/teal} [*to eleutheriôtaton*] », {yellow}vient pour voir{/yellow} des lieux, de belles réalisations, des actes d'excellence et des discours.

    De même dans la vie : les uns sont mus par {red}le désir de richesses et de plaisir{/red}, d'autres par {red}le désir du pouvoir et de la puissance{/red} et de folles rivalités ; {teal}« {/teal}Mais {teal}la sorte d'hommes la plus pure{/teal}, c'est l'homme qui a choisi [*apodexamenon*] {teal}la contemplation{/teal} [*theôrian*] {teal}des choses les plus belles{/teal}, celui que l'on dénomme précisément "philosophe". »

    **L'analogie est-elle de Pythagore ?** {sky}Joly{/sky} estime qu'elle a été élaborée par des disciples, pour préciser le sens du mot « philosophe ». Peu importe : {coral}elle distingue des modes de vie pour en justifier un{/coral}, la vie philosophique comme contemplation, en lui donnant un objet et en en faisant {coral}le seul mode de vie libre{/coral}.

    **Trois mots du texte.**
    - {violet}*Parodon*{/violet} : la naissance est un passage, un défilé, un chemin qui mène au même lieu des hommes de toutes sortes ; la vie se caractérise donc par la multiplicité des modes de vie.
    - {violet}*Chreia*{/violet} : à la fois l'usage, le profit, le besoin. {coral}Le manque désigne à chacun la fin qu'il doit viser{/coral}, et détermine l'activité qu'il déploie pour le combler.
    - {violet}*Apodexamenon*{/violet} : Hasnaoui traduit « qui a choisi », mais *apodechomai* signifie {amber}« recevoir, accepter, admettre »{/amber}. Il s'agit d'{amber}assumer un mode de vie qui nous est donné{/amber} ; et comme le verbe n'est employé que pour la vie philosophique, peut-être est-elle {coral}la seule à devoir être assumée comme un véritable mode de vie{/coral}.
