lessons:
- id: vies4-l1
  title: "La panégyrie selon Diogène Laërce"
  notes: |-
    **Comment les Anciens conçoivent-ils les modes de vie entre lesquels il faut choisir ?** {sky}Robert Joly{/sky}, dans un ouvrage précurseur sur les « genres de vie » dans l'Antiquité (1956), distingue trois aspects du thème : {teal}« {/teal}1) {teal}l'énumération de diverses fins{/teal} auxquelles se rattache l'activité humaine ; 2) {teal}un jugement qui choisit l'une d'entre elles comme la meilleure{/teal}, qui précise des oppositions, des exclusives, d'après une norme qui varie selon les individus ; 3) {teal}l'idée d'une existence concrète{/teal} vécue sous le signe de chacune des valeurs distinguées ». Le chapitre en retient quelques étapes : la fin visée, les moyens, la modalité de l'objet, la hiérarchie.

    **Première étape : Pythagore compare la vie à une panégyrie**, l'une de ces fêtes religieuses qui rassemblaient le peuple dans un sanctuaire, avec des concours. Selon {sky}Diogène Laërce{/sky} (VIII, 8) : {teal}« {/teal}Et il disait que {teal}la vie{/teal} [*ton bion*] {teal}ressemble à une panégyrie{/teal} : de même que certains s'y rendent {teal}pour concourir{/teal}, d'autres {teal}pour faire du commerce{/teal}, alors que {teal}les meilleurs sont ceux qui viennent en spectateurs{/teal} [*theatai*], de même dans la vie [*en tô biô*], {teal}les uns naissent esclaves{/teal} et chassent gloire [*doxès*] et richesses [*pleonexias*], {teal}les autres naissent philosophes{/teal} et chassent la vérité. »

    | À la fête | Dans la vie |
    | concourir | chasser la gloire |
    | faire du commerce | chasser les richesses |
    | venir en spectateur | chasser la vérité |

    ! Le spectateur est le meilleur parce qu'il ne veut rien de la fête : il ne lutte pas, ne vend rien, il regarde.
