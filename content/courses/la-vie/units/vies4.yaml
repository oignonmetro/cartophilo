- id: vies4-l2
  title: "Deux classifications des modes de vie"
  notes: |-
    **Le texte de Diogène Laërce contient deux classifications, qui ne se recouvrent pas.**

    **La première distingue les fins : trois modes de vie**, pas encore nommés, mais désignés par leur objet et leur activité :
    - celui qui vise {yellow}la gloire{/yellow} : la lutte pour un prix ; il est {amber}actif{/amber}, il prend part au concours ;
    - celui qui profite du concours pour {yellow}faire du commerce{/yellow}, en marge : il cherche l'accumulation des richesses, et relève de la {violet}pléonexie{/violet}, la cupidité ;
    - celui qui se tient en {yellow}spectateur{/yellow} et vise la vérité par la {violet}contemplation{/violet} (*theôria*, qui désigne d'abord la contemplation d'un spectacle au théâtre).

    **La seconde oppose les modes de vie serviles au mode de vie philosophique** : trois se ramènent à deux.
    - {red}Gloire et richesse sont serviles{/red}, parce qu'elles {coral}placent l'individu sous la dépendance d'autrui{/coral} : la gloire dépend du regard de l'autre, de l'opinion ; le commerçant ne vend que s'il y a un acheteur.
    - {green}Le mode de vie philosophique est libre{/green}, même si le mot n'apparaît pas : se soutenant de la seule recherche de la vérité, {coral}il ne fait dépendre le sujet que de lui-même{/coral}.

    **Mais cette opposition paraît innée** : les uns « *naissent* esclaves », les autres « *naissent* philosophes ». {amber}On ne choisirait ni l'une ni l'autre : ces modes de vie sont des natures.{/amber}
  points:
  - id: vies4-l2-p1
    sentence: "Dans la panégyrie, celui qui vise les richesses par le commerce relève de la ___, c'est-à-dire de la cupidité."
    answer: "pléonexie"
    alt: []
  - id: vies4-l2-p2
    sentence: "Le spectateur de la panégyrie vise la vérité par la contemplation, en grec *___*, qui désigne d'abord la contemplation d'un spectacle au théâtre."
    answer: "theôria"
    alt: ["theoria", "théôria"]
  - id: vies4-l2-p3
    sentence: "La seconde classification pythagoricienne ramène trois modes de vie à deux : les modes de vie ___, gloire et richesse, et le mode de vie philosophique."
    answer: "serviles"
    alt: []
  - id: vies4-l2-p4
    sentence: "La gloire dépend du regard d'autrui, le commerçant ne vend que s'il y a un acheteur : ces modes de vie sont serviles parce qu'ils placent l'individu sous la ___ d'autrui."
