- id: vies4-l4
  title: "Les trois vies, et la contemplation du kosmos"
  notes: |-
    **Les trois modes de vie de la panégyrie se laissent maintenant nommer.**

    | Mode de vie | Ce qu'il recherche |
    | chrématistique | l'enrichissement et les plaisirs |
    | politique | la gloire, le pouvoir |
    | philosophique | l'excellence des discours et des actes |

    - {violet}Chrématistique{/violet} : il recherche l'enrichissement et les plaisirs par le commerce.
    - {violet}Politique{/violet} : il recherche la gloire, fondée sur l'exhibition de la puissance physique, et correspond au désir de pouvoir (*archè* et *hègemonia*, l'autorité suprême de celui qui conduit) ; il aime {amber}le rapport de force{/amber}, il cherche à l'emporter (le texte parle d'amour de la victoire, *philonikeô*).
    - {violet}Philosophique{/violet} : il recherche l'*aretè*, l'excellence, des discours et des actes, et se veut contemplation des belles choses ; il est dit {green}*eleutheriôtaton*{/green}, superlatif absolu : {coral}« le plus libre », « entièrement libre »{/coral}.

    **Quelles belles choses contemple-t-il ?** Jamblique le précise (59) : {teal}« {/teal}Belle est, assurément, {teal}la vision du ciel tout entier et des astres{/teal} qui s'y déplacent, {teal}à condition d'en saisir l'ordre{/teal} ; [...] Et ce Premier, c'est, on le sait, {teal}les nombres et les rapports{/teal} qui s'étendent à travers toutes choses, selon lesquels tout ce qui existe est mis en ordre harmonieusement [...] ; et {teal}la sagesse{/teal} [*sophia*], c'est {teal}la véritable science{/teal} [*épistèmè*], celle qui s'occupe {teal}des choses premières, belles et divines{/teal} [...] ; et {teal}la philosophie, c'est la poursuite de cette contemplation »{/teal}.

    **La vie philosophique est donc contemplation du {violet}*kosmos*{/violet}**, l'ordre harmonieux et immuable du monde réglé selon des rapports mathématiques. La vérité qu'elle cherche porte sur {coral}ce qui est premier, toujours identique à soi et divin{/coral}, et la sagesse est la science de ces réalités éternelles. {sky}Joly{/sky} conclut : {teal}« La principale nouveauté{/teal} qu'y introduisent les Pythagoriciens {teal}est la constitution d'un genre de vie philosophique, celui du contemplatif{/teal}. Ils entendaient par contemplation {teal}l'étude des sciences et avant tout des nombres et de l'astronomie{/teal}, étude qui a une haute valeur religieuse et morale. » On conçoit comment cette conception a pu influencer Platon.
