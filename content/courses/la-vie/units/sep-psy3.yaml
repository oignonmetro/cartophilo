- id: sep-psy3-l1
  title: "La sensation définit l'animal"
  notes: |-
    **La** {violet}**sensation**{/violet} **est la faculté qui sépare l'animal de la plante.** Le *De la sensation* le dit sans détour : {teal}« {/teal}Chaque animal, en tant qu'animal, {teal}possède nécessairement la sensation{/teal}. C'est par cela en effet que {teal}nous distinguons entre ce qui est animal et ce qui ne l'est pas. »{/teal} (1, 436b10-12) Le *De l'âme* précise que cela vaut même des animaux immobiles, et qu'{teal}« le fondement de la sensation, dévolu à tous, est le toucher »{/teal} (II, 2, 413b4-5) : tout animal a au moins le toucher, la plupart ont aussi les autres sens.

    **La raison en est téléologique.** Pour grandir jusqu'à la maturité et se reproduire, __un animal doit prendre sa nourriture et se diriger dans le monde : c'est à quoi sert la sensation__. La {pink}plante{/pink}, {pink}fixée{/pink}, {pink}a son aliment là où elle est{/pink}. Mais un corps qui se déplace et ne sent pas ne le trouverait pas : {teal}« {/teal}Si donc tout corps capable de locomotion n'est pas un corps doué du sens, {teal}il va périr sans parvenir à sa fin »{/teal} (III, 12, 434a30-b1). L'argument est conditionnel : __**si** l'animal doit vivre en se déplaçant, **alors** il doit sentir__.

    ! Cela n'explique encore que le pourquoi de la sensation, non son comment : c'est l'objet de la leçon suivante.
  points:
