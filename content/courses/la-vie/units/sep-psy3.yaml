- id: sep-psy3-l2
  title: "Une altération : l'ail et le tofu"
  notes: |-
    **Comment la sensation se produit-elle ? Sur le modèle du changement hylémorphique.** De même qu'{yellow}une maison passe du bleu au blanc sous l'action du peintre{/yellow}, {teal}« {/teal}la sensation réside dans le fait de {teal}recevoir un mouvement et d'être affecté{/teal}, comme on l'a dit, puisqu'elle passe pour être {teal}une sorte d'altération »{/teal} (II, 5, 416b33-34). Elle est donc une interaction entre deux termes appropriés : un objet capable d'agir, une capacité capable d'être affectée.

    **Tout est dans « appropriés ».** {yellow}Une gousse d'ail placée près d'un bloc de tofu peut lui donner son odeur. Personne ne dira que le tofu perçoit l'ail.{/yellow} Un animal, sous l'action de la même gousse, en perçoit l'odeur. {green}__L'ail étant le même dans les deux cas, la différence doit tenir à ce qui est affecté.__{/green} Quand un animal reçoit une forme, il y a perception ; quand un corps sans vie est affecté par ce qui semble la même forme, il n'y a qu'une altération sans perception.

    **Aristote pose lui-même la question.** {teal}« {/teal}Qu'est-ce donc que saisir une odeur, {teal}en dehors du fait de subir quelque effet{/teal} ? Eh bien, saisir une odeur, {teal}c'est aussi avoir une sensation{/teal}, tandis que l'air, lui, s'il a subi un effet, {teal}a tôt fait d'être sensible. »{/teal} (II, 12, 424b16-18) L'air affecté par une odeur devient lui-même odorant, il ne sent rien. Le cas des plantes le confirme : elles subissent le froid et le chaud, mais {teal}« {/teal}elles ne présentent {teal}pas d'état moyen{/teal}, ni le genre de principe capable de {teal}recevoir les formes des objets sensibles{/teal}, mais {teal}subissent matériellement leurs effets »{/teal} (424a32-b3).

    **Ce qui s'ensuit.** Tout changement d'un certain genre suppose un sujet capable de ce changement. {coral}Ce n'est pas la trivialité selon laquelle ce qui devient F devait pouvoir l'être{/coral} : c'est dire que les formes spécifiques de changement exigent des capacités propres, qu'il faut étudier avec elles. {yellow}Aucune guimauve ne peut recevoir la forme d'une automobile{/yellow} ; seuls des êtres capables de percevoir reçoivent les formes perceptibles.
  points:
