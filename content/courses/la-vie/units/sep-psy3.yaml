- id: sep-psy3-l4
  title: "Le schéma de la perception et ses difficultés"
  notes: |-
    **Le minimum qu'Aristote soutient tient en un schéma.** Pour un sujet S et un objet sensible O, S perçoit O si et seulement si :
    - (i) S a la **capacité** requise pour recevoir la forme sensible de O ;
    - (ii) O **agit** sur cette capacité en lui donnant forme ;
    - (iii) par là, la capacité de S devient {violet}isomorphe{/violet} à cette forme.

    **La clause (i) : une capacité active.** Elle sert à distinguer les capacités des animaux des capacités purement passives des corps sans vie, y compris les milieux que traversent les formes sensibles. On ne veut pas dire que le tofu perçoit l'ail, ni que {yellow}l'air perçoit le bleu quand la couleur d'une voiture l'affecte{/yellow}. Mais la clause ne dit pas encore en quoi consistent ces capacités.

    **La clause (iii) : que veut dire isomorphe ?** C'est de là que dépend la plausibilité de l'analyse hylémorphique de la perception, et les interprétations s'étendent entre deux pôles :

    | Lecture de l'isomorphisme | Ce qu'elle dit | Exemple |
    | directe et littérale | l'organe prend la qualité | l'œil moucheté par l'œuf |
    | atténuée | une correspondance de structure | le plan et la maison |

    {pink}Dans la lecture littérale{/pink}, {yellow}les yeux deviennent mouchetés quand ils regardent un œuf de merle{/yellow} : c'est clair, mais difficile à soutenir. {pink}Dans la lecture atténuée{/pink}, l'isomorphisme ressemble à celui {yellow}d'une maison et de son plan{/yellow} : c'est plus défendable, mais on demande alors ce qui reste de la thèse que le sens devient tel que son objet. {red}La question n'est pas réglée, et c'est elle qui décide de la valeur de la théorie.{/red}

    ! La clause (iii) ne se réduit pas au « devenir semblable » de toute altération : elle doit dire ce qui fait de cette assimilation-là une perception, sans quoi l'air sentirait.
