- id: sep-psy3-l3
  title: "Recevoir la forme sans la matière"
  notes: |-
    **Quelle est donc cette réception ? Celle d'une forme, à l'exclusion de la matière.** La formule et son image sont célèbres (II, 12, 424a17-21) :

    {teal}« {/teal}le sens constitue ce qui est propre à {teal}recevoir les formes sensibles sans la matière{/teal}. Ainsi, {teal}la cire reçoit la marque de la bague sans le fer et l'or »{/teal}

    **Ce que montre l'image.** La cire prend la marque de l'or, {teal}« mais pas en tant qu'or ou bronze »{/teal} : la bague n'y laisse aucune parcelle d'elle-même, et une bague de fer laisserait la même marque. De même, l'œil qui voit une rose reçoit sa couleur, non ses pétales. **Où s'arrête l'image** : la cire est marquée, elle ne sent rien. Il ne suffit pas de recevoir une forme, il faut être le genre de chose pour qui recevoir est sentir.

    **« Devenir semblable ».** Le sens n'est pas d'abord pareil à son objet, il le devient : {teal}« Le sensitif, par ailleurs, est potentiellement tel que le sensible déjà réalisé »{/teal}, et {teal}« {/teal}au moment où il est affecté, {teal}il n'est pas semblable à celui-ci{/teal}, mais une fois qu'il a été affecté, {teal}il se trouve assimilé{/teal} et est tel que lui{teal} »{/teal} (II, 5, 418a3-6). {green}__L'œil, en puissance, est rouge d'une certaine façon ; le rouge est déjà rouge en acte, et le rend tel.__{/green} Il en va ainsi dans toute altération : ce qui est affecté reçoit la forme de l'agent.

    ! Recevoir la forme « sans la matière » ne veut pas dire que rien ne se passe dans le corps : le sens a un organe, et, si l'objet est trop violent, sa proportion se dissipe, comme {yellow}« l'accord et le ton d'un instrument dont les cordes seraient heurtées violemment »{/yellow} (424a31-32).
