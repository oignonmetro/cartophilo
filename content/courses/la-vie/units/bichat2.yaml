lessons:
- id: bichat2-l1
  title: "La définition vitaliste de la vie"
  notes: |-
    **Bichat est connu pour trois choses**, dont aucune n'est entièrement neuve : son originalité tient à leur **articulation**.
    - en **anatomie**, considérer le corps selon la texture de chaque {violet}tissu{/violet}, et non selon la distribution spatiale et les voisinages des organes, d'où l'{violet}anatomie pathologique{/violet} : tout trouble renvoie à la lésion déterminée d'un tissu ;
    - en **physiologie**, la définition {teal}« La vie, c'est l'ensemble des fonctions qui résistent à la mort »{/teal} (*Recherches*, p. 3) ;
    - la division des fonctions en {violet}vie organique{/violet}, centrée sur soi (respiration, digestion), et {violet}vie animale{/violet}, en relation avec le milieu (sensation, locomotion), à laquelle se réfèrent Hegel, Ravaisson, Comte et surtout Schopenhauer.

    **La définition prolonge Stahl.** Il écrivait déjà : {teal}« On doit entendre par ce mot Vie : la conservation même d'un corps éminemment corruptible, la Faculté ou force par laquelle ce corps est mis à l'abri de l'acte corrupteur. »{/teal} Bichat la développe de façon typiquement vitaliste : {pink}les corps bruts sont régis par des lois fixes, qui entraînent toujours leur dégradation{/pink} ; {green}les corps vivants s'en distinguent par des lois plus variables, qui leur donnent une évolution propre et la conservation d'eux-mêmes{/green}. Soumis à l'action perpétuellement dégradante des forces physiques, le vivant doit avoir {teal}« un principe permanent de réaction »{/teal} (*R*, I, art. 1, §1). **La vie est un principe de résistance aux forces physiques qui tendent à la détruire.** Cuvier, au début de l'*Anatomie comparée*, la personnifie en {yellow}une jeune fille en bonne santé{/yellow}, étonnante parce qu'elle se conserve contre toutes les agressions du dehors, alors que dès sa mort celles-ci l'emportent.

    **Bichat ne dit rien de la nature de la force vitale.** Elle est {teal}« inconnue dans sa nature »{/teal} ; il constate seulement la dualité des forces à partir des phénomènes, qui sont {teal}« d'action et de réaction »{/teal}. Contre **Barthez**, disciple de Bordeu, il refuse de chercher un {red}« principe de vie »{/red}, un {teal}« centre unique de tous les actes qui portent le caractère de la vitalité »{/teal} : les causes premières sont inaccessibles, et d'ailleurs inutiles. {teal}« Ne peut-on sans connaître le principe de la vie, analyser les propriétés des organes qu'elle anime ? »{/teal} (*R*, I, art. 7, §1).

    **Action et réaction sont dans une proportion qui change avec l'âge.** Les forces physiques agissent continûment, en lui et hors de lui ; le vivant réagit ; et la proportion décroît, avec le temps, en faveur des forces physiques.

    ! La définition de Bichat est identique dans sa lettre à celle de Stahl ou de Barthez, mais elle n'aura pas le même sens : chez Bichat, elle donnera accès à la vie par la mort (voir la troisième unité).
