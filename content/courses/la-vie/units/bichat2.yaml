- id: bichat2-l3
  title: "La division des vies"
  notes: |-
    **Bichat ne veut pas d'une médecine seulement conjecturale**, pourvue d'une {pink}« certitude pratique »{/pink} comme l'enseignait Cabanis. Deux thèses servent cette ambition ; la première est la **division des fonctions**, longuement étudiée dans les *Recherches*.

    **L'idée de diviser les fonctions n'est pas neuve.** Le médecin A. **Louis** distinguait fonctions naturelles (nutrition, génération), vitales (cœur, poumon, cerveau : quand elles cessent, la vie cesse) et animales (sensibilité, locomotion) ; **Cuvier** oppose les caractères communs à tous les corps organisés (génération, nutrition, mort) aux facultés de sentir et de se mouvoir, propres aux animaux.

    **Mais Bichat veut la division « la seule réelle »** (*R*, I, art. 1, §1), et son principe est neuf.
    - Les autres fondent la division sur {pink}l'importance des organes qui exécutent les fonctions{/pink} (les végétaux peuvent vivre sans système digestif).
    - Bichat divise {green}__les fonctions elles-mêmes, et non les organes, selon le type de rapport qu'elles établissent__{/green} : rapport à soi, rapport au monde. Le principe est {coral}plus authentiquement physiologique{/coral}, et parent du concept de {violet}milieu{/violet} dont Lamarck esquisse alors les linéaments.

    **Les deux vies.**
    - Une vie « au-dedans de soi », que vit le végétal : la {violet}vie organique{/violet}.
    - Une « vie extérieure », propre à l'animal : la {violet}vie animale{/violet}. {teal}« Il rapporte tout à son existence, il existe hors de lui, il est l'habitant du monde. »{/teal}

    **Les fonctions se subdivisent alors d'elles-mêmes.**

    | Vie | Ordre | Fonctions |
    | organique | assimilation | nutrition, digestion |
    | organique | désassimilation | absorption, sécrétion |
    | animale | ordre actif | cerveau vers les sens : motricité |
    | animale | ordre passif | sens vers le cerveau : sensibilité |

    **Pourquoi c'est la « division la plus naturelle ».** Précisément parce que les fonctions sont divisées à partir d'elles-mêmes, non des organes qui les supportent, la physiologie devient un discours {coral}en complète adéquation avec son objet, les fonctions du vivant{/coral}.

    ! La vie organique n'est pas réservée aux plantes : l'animal vit les deux vies. Le végétal est seulement l'exemple d'un vivant qui n'a que la première.
