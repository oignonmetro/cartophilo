- id: bichat2-l8
  title: "Les difficultés de Bichat"
  notes: |-
    **Rien de ce qui précède ne lève la difficulté du vitalisme.** Les thèses de Bichat fondent la physiologie sur de nouvelles bases ; mais deux problèmes demeurent.

    **D'abord, la variabilité des forces vitales** reste entière : elle est même au cœur de la théorie des propriétés.

    **Ensuite, le passage au tout.** Chaque tissu, chaque organe est étudié pour lui-même. {red}Qu'en est-il du fonctionnement de la totalité du vivant ?{/red} Bichat sait que les classifications anatomiques sont {teal}« imparfaites »{/teal} (un même organe peut servir à plusieurs fonctions), de simples {teal}« guides »{/teal}, et que le but est la physiologie. Or {teal}« chaque ordre de fonctions s'enchaîne avec les autres d'une manière plus ou moins rigoureuse »{/teal}, et {teal}« quoique les fonctions soient étudiées séparément, il faut toujours avoir en vue leur enchaînement »{/teal} (*AG*, préface). __Comment passer de l'histologie au tout des {violet}enchaînements{/violet}, c'est-à-dire à l'économie animale comme telle ?__ Et cette considération est-elle scientifiquement possible, vu le {red}« plus ou moins »{/red} qui caractérise le fonctionnement vital ?

    **La sensibilité ouvre une voie, mais ne suffit pas.** Elle règle sélectivement les rapports d'un tissu avec les autres ; mais étant une propriété vitale, {red}elle est imprévisiblement variable{/red} : aucune science n'en résulte.

    **D'où le fil conducteur de la suite** : comment Bichat saute-t-il de l'histologie à la physiologie, dans son traité de physiologie pure, les *Recherches sur la vie et la mort* ? Autrement dit, {green}__pourquoi Bichat y interroge-t-il la mort ?__{/green}
  points:
  - id: bichat2-l8-p1
    sentence: "Pour Bichat, les classifications anatomiques sont par essence « ___ » dans l'économie animale, puisqu'un même organe peut servir à plusieurs fonctions : elles ne sont que des guides."
    answer: "imparfaites"
    alt: []
  - id: bichat2-l8-p2
    sentence: "« Quoique les fonctions soient étudiées séparément, il faut toujours avoir en vue leur ___ » (Bichat, *Anatomie générale*)."
    answer: "enchaînement"
