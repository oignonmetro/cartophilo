- id: bichat2-l5
  title: "Sensibilité et contractilité : les propriétés vitales"
  notes: |-
    **Bichat se réfère à Newton pour faire du vivant l'objet d'une science des phénomènes.** {pink}L'anatomie, la zoologie{/pink} sont, comme la minéralogie, des **sciences des formes** : elles classent. {green}La physique et la physiologie{/green} sont des **sciences des phénomènes**. Le vivant n'a pas encore accédé au statut d'objet d'une science des phénomènes ; or pour Bichat {coral}la vie n'est pas tant une forme qu'un fonctionnement{/coral}, une économie animale, dont il faut trouver l'intelligibilité.

    **L'axiome commun des sciences, et leur hétérogénéité.** Comme en physique et en chimie, l'axiome de la physiologie est {teal}« le rapport des propriétés comme causes avec les phénomènes comme effets »{/teal} (*AG*, préface). Mais si chaque science a ses propriétés cardinales, {red}on ne peut transporter celles de l'une dans l'autre{/red} : le mécanisme a fait fausse route en important attraction et impulsion en physiologie. Si la physiologie emprunte parfois des lois physiques, c'est une **contingence historique** : la physique a été cultivée la première.

    **Les propriétés des tissus tiennent à l'« arrangement » des molécules.** Le vitalisme de Bichat est donc loin de l'animisme et du principe vital de Barthez : il signifie seulement que {coral}cet arrangement ne s'engendre pas par les lois physiques ordinaires{/coral}.

    **Deux propriétés, dédoublées par la division des vies.** {teal}« Sensibilité et contractilité, voilà les propriétés vitales »{/teal}.

    | Propriété | animale | organique |
    | sensibilité | rapportée au cerveau par les nerfs | localisée dans l'organe, sans conscience |
    | contractilité | muscles volontaires | principe dans l'organe qui se meut |

    **La sensibilité règle les échanges.** Chaque organe a une {violet}somme initiale de sensibilité{/violet} autour de laquelle sa sensibilité actuelle oscille. Elle fixe ses relations : {coral}seuls deux organes de sensibilités voisines peuvent s'affecter{/coral}, même voisins dans l'espace. D'où la sélectivité des organes de passage (larynx, membranes, lymphatiques), et l'intelligibilité des échanges de l'économie animale.

    **Une continuité, et une épuration.** Une **inflammation** transforme la sensibilité organique d'un organe en sensibilité animale : on sent alors son membre douloureux. Bichat épure le concept flou d'{violet}irritabilité{/violet}, réduit à une contractilité organique ; sa sensibilité évacue l'âme sensitive sans devenir, comme chez les disciples de Bordeu, le principe de la vie. L'originalité n'est pas dans les termes, mais dans le **principe de distinction** (vie animale, vie organique) et la **localisation dans les tissus**.

    **Physiologie et pathologie ont la même source.** {teal}« tout phénomène physiologique se rapporte en dernière instance à ces propriétés (vitales) considérées dans leur état naturel, que tout phénomène pathologique dérive de leur augmentation, diminution ou altération »{/teal}. D'où {teal}« chaque maladie a son remède approprié »{/teal}, contre la médecine purement empirique.

    **Le vivant est décentralisé.** La vie appartient à chaque tissu : chacun {teal}« a son organisation particulière comme il a sa vie propre »{/teal}. La « vie propre » de Bordeu descend au niveau des tissus, et {green}la métaphore de l'essaim d'abeilles n'a plus lieu d'être{/green} : un animal n'est plus fait d'animaux élémentaires.
