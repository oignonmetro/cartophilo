# tiré d'un commentaire »), tiré de Philippe Huneman, Bichat, la vie et la
# mort, PUF, « Philosophies », 1998 : chapitre II, « Les thèses de Bichat et
# leur généalogie ». Citations et repères tels que Huneman les donne
# (R = Recherches physiologiques sur la vie et la mort ; AG = Anatomie
# générale ; AD = Anatomie descriptive).

