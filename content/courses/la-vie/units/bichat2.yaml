- id: bichat2-l7
  title: "Bichat et Pinel : intégrer le négatif au savoir"
  notes: |-
    **L'analyse de Condillac.** Charles **Rosen** (1946) liait l'anatomie pathologique de Pinel et de Bichat à la philosophie de **Condillac** et des {violet}Idéologues{/violet}. Le projet condillacien d'{violet}analyse{/violet}, remonter aux propriétés ultimes observables sans en demander la cause et rendre compte du donné par leur agencement, dérivé de Locke et de Newton, a inspiré la plupart des contemporains de Bichat (et Lavoisier). Classer les maladies d'après les affections de tissus élémentaires relève de cette ascendance, même si Pinel a en fait emprunté l'idée à Smyth. Les titres de Pinel le disent : *Nosographie philosophique ou la méthode de l'analyse appliquée à la médecine*.

    **Une coïncidence de dates.** En octobre 1800, peu avant les *Recherches*, paraît le *Traité médico-philosophique sur l'aliénation mentale ou la manie* de **Pinel**, qui ouvre l'ère de la psychiatrie. Il classe les formes élémentaires de l'aliénation, à reconnaître sous les variations de la folie d'un aliéné, et même quand elle ne donne aucun signe (manie intermittente) : {coral}de même que chez Bichat les tissus se distinguent sous leur apparition mêlée dans les organes{/coral}.

    **Bichat décentralise la vie, Pinel délocalise la folie.** Dans la folie, ce n'est pas tout l'entendement qui est lésé, mais selon les espèces sa mémoire, ses facultés cognitives ou volitives ; l'attention peut même être « exaltée » dans la manie. Comme l'a montré **Gladys Swain**, {green}la folie n'est jamais complète{/green}. Il n'y a donc pas de principe unique de l'entendement à localiser : {teal}« Que deviennent alors des milliers de volumes de métaphysique ? »{/teal}

    **Traiter le négatif selon les mêmes principes que le positif.**
    - Chez **Bichat**, la science des tissus fonde à la fois la physiologie normale et la connaissance des maladies : {coral}la maladie est réintégrée dans l'immanence de l'activité vitale{/coral}, altération des propriétés usuelles des tissus et non entité autonome.
    - Chez **Pinel**, le traitement moral repose sur la coexistence d'une partie saine de la raison avec sa partie aliénée : {coral}la folie n'est plus l'autre de la raison, mais son altération partielle{/coral}.

    Les deux œuvres se rejoignent dans {green}__une même intégration du négatif dans l'espace du savoir__{/green}. Broussais formulera clairement l'unité de la physiologie et de la pathologie.
