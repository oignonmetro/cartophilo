- id: bichat2-l2
  title: "Forces vitales et forces physiques : l'écueil de la variabilité"
  notes: |-
    **Les deux types de forces sont hétérogènes**, et c'est là la difficulté de tout vitalisme, que Bichat voit clairement.

    **Les forces physiques sont invariables, les forces vitales varient.** Les premières produisent des phénomènes {teal}« toujours uniformes »{/teal} (*R*, I, art. 7, §1). Ainsi {pink}la « faculté physique d'attirer » reste constante pour un même corps{/pink}, tandis que {green}la « faculté vitale de sentir » est variable pour un même organe{/green}.

    **D'où trois conséquences.**
    - {red}Cette variabilité empêche d'user du calcul en médecine{/red}, à la différence de la physique.
    - Les méthodes des autres sciences, appliquées au vivant, en masquent l'originalité : la chimie des fluides vitaux n'est qu'une {teal}« chimie cadavérique des fluides »{/teal}, puisqu'elle analyse des liquides sortis du corps, donc morts.
    - Cette irrégularité est {teal}« l'écueil »{/teal} des {violet}iatrochimistes{/violet} comme Van Helmont et des plus récents {violet}iatromécaniciens{/violet}, qui ont voulu réduire le corps à la chimie ou à la mécanique.

    **Bichat n'abandonne pas pour autant le dessein d'une science.** Sa conclusion : {teal}« La science des corps organisés doit être traitée d'une manière toute différente de celles qui ont les corps inorganiques pour objet. »{/teal} Tout son travail peut se lire comme {green}__une tentative réussie pour contourner la difficulté du vitalisme en sauvegardant l'ambition d'une science autonome du vivant__{/green}.

    **Une ironie le montre.** Si la physiologie avait été cultivée avant la physique, les hommes, pense Bichat, auraient appliqué la première à la seconde : ils auraient vu {yellow}les fleuves couler par l'action tonique de leurs rivages, les cristaux se réunir par l'excitation de leur sensibilité réciproque, les planètes se mouvoir parce qu'elles s'irritent à distance{/yellow}. L'importation de la physique en physiologie est aussi absurde que serait l'inverse.

    ! La variabilité n'est pas, pour Bichat, un défaut de nos instruments : elle tient à la nature même des propriétés vitales. La question est donc de trouver, dans le vivant, quelque chose qui ne varie pas.
