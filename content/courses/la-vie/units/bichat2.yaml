- id: bichat2-l4
  title: "La vie localisée dans les tissus"
  notes: |-
    **La théorie des tissus doit donner des bases fermes à la science nouvelle** et clore la querelle de l'irritabilité entre Haller et Bordeu. Elle y réussit : elle restera l'élément incontesté du savoir sur le vivant jusqu'à Claude Bernard et la théorie cellulaire.

    **Une histoire de la localisation de la vie.** Rétrospectivement :

    | Époque | Siège de la vie |
    | science galénique | une âme dont on cherche le siège |
    | vitalistes | les organes |
    | Bichat | les tissus |
    | Schwann, Schleiden, Virchow | la cellule |

    **La généalogie de l'idée.** Haller différenciait déjà les parties par leurs propriétés. Bichat relie cette étude à la médecine : {green}__chaque tissu ayant sa manière propre d'être affecté, on connaît les maladies par l'altération des tissus__{/green}, ce qui constitue l'{violet}anatomie pathologique{/violet}. **Pinel**, dont Bichat suivit les cours, en avait esquissé l'idée dans sa *Nosographie philosophique* (1797), classant les inflammations, ou {violet}phlegmasies{/violet}, d'après les caractères des affections organiques, mais dans un projet encore nosologique. L'ancêtre le plus lointain, retrouvé par Othmar **Keel**, est l'Écossais **Smyth** (1788), qui distinguait les phlegmasies selon la structure des membranes affectées : {coral}l'inflammation est un seul processus qui se diversifie selon les tissus{/coral}. Et c'est **William Hunter** qui le premier a situé le siège de la maladie au niveau du tissu et non de l'organe : la généalogie renvoie à l'{sky}école d'Édimbourg{/sky}, et à travers elle à Locke et Hume.

    **Le *Traité des membranes* ouvre la voie.** La différence entre deux membranes éloignées est {teal}« dans la forme plutôt que dans le fond de leur organisation »{/teal} : il faut donc classer les parties {green}selon leur nature propre, indépendamment du lieu où elles se trouvent{/green}. Deux membranes sont d'une même classe si elles ont même {teal}« conformation extérieure, de structure, de propriétés et de fonctions »{/teal}. Les membranes simples sont muqueuses, séreuses ou fibreuses ; Bichat range parmi les séreuses les {violet}synoviales{/violet}, jusque-là traitées à part. Haller, lui, les confondait toutes comme {pink}« modifications de l'organe cellulaire »{/pink}.

    **Les niveaux d'organisation.** Quelques tissus simples, partout les mêmes, sont les {teal}« éléments organisés de l'économie vivante »{/teal}. La totalité d'un tissu dans le corps est un {violet}système{/violet} (osseux) ; l'union d'éléments de plusieurs systèmes, un {violet}organe{/violet} ; l'union d'organes concourant à une fonction, un {violet}appareil{/violet} (digestif). Le premier niveau est fondamental et invisible, le dernier est celui où se voient les manifestations vitales ; chaque niveau a des propriétés et un usage irréductibles au précédent.

    **Deux anatomies.** Bichat compte {coral}21 tissus{/coral}, qui {teal}« sont le sujet de l'anatomie générale ; leurs combinaisons diverses sont celui de l'anatomie descriptive »{/teal}. Mais {teal}« aucun tissu n'existe isolément »{/teal} : l'anatomie générale est une abstraction, science introductive comparable à la {yellow}chimie de Lavoisier, qui recense les corps simples{/yellow}.

    ! Le « tissu cellulaire » de Bichat n'a pas le sens de la théorie cellulaire : c'est un des 21 tissus, non l'élément de tous.
