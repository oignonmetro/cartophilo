- id: bichat2-l6
  title: "La méthode anatomique"
  notes: |-
    **Quatre critères fondent l'identité de deux tissus**, et donnent le plan de l'étude de chaque membrane dans le *Traité* :
    - la **conformation extérieure** et la **texture**, structure intérieure, qui relèvent de l'observation anatomique ;
    - les **propriétés vitales** : on teste par des expériences le degré de {violet}tonicité{/violet}, d'irritabilité et de sensibilité de chaque tissu ;
    - les **fonctions** (le degré de force vitale de la membrane, puisque la vie est répartie dans tous les éléments du corps) et les {violet}sympathies{/violet}, son rapport à l'économie animale entière ;
    - enfin les **affections** qui lui sont propres.

    L'*Anatomie générale* suit le même plan, en y ajoutant ce qui est nouveau : le {coral}développement{/coral} de chaque système.

    **Une pluralité de moyens.** {teal}« Les expériences sur les animaux vivants, l'essai avec divers réactifs sur les tissus organisés, la dissection, l'ouverture cadavérique, l'observation de l'homme en bonne santé et malade »{/teal}. On y note {green}__l'union de la vision et de l'action sur le corps__{/green}, et l'appel à la chimie : {teal}« Les divers réactifs que j'ai employés n'ont été pour moi qu'un supplément à l'insuffisance du scalpel. »{/teal}

    **La chimie a pris la place de la mécanique.** Depuis les travaux de **Lavoisier** sur la respiration, elle est la science modèle de la physiologie, comme la mécanique l'était au XVIIe siècle ; beaucoup de médecins se sont faits chimistes (Chaptal, Berthollet, Fourcroy). Bichat le remarque dans son *Discours sur l'étude de la physiologie* (1798), mais pour {red}limiter cet annexionnisme chimique{/red} : la chimie n'est qu'un supplément.
