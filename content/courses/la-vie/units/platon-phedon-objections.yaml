- id: platon-phedon-objections-l5
  title: "La misologie : ne pas haïr les raisonnements (88c-91c)"
  notes: |-
    Les deux objections plongent tout le monde dans le trouble, jusqu'à Échécrate qui interrompt le récit. Avant de répondre, Socrate soigne le mal le plus dangereux qu'elles peuvent faire naître : {red}__la haine des raisonnements__{/red}.

    **L'effondrement.** Les auditeurs se sentent rejetés {teal}« dans l'impossibilité d'adhérer non seulement aux raisonnements précédents, mais à tous ceux qu'on pourrait tenir par la suite »{/teal}. Échécrate avoue que la thèse de l'âme-harmonie l'a toujours séduit, et demande comment Socrate a réagi. Phédon ne l'a jamais tant admiré : il accueillit les objections avec bienveillance, vit leur effet sur eux, et sut {teal}« nous guérir »{/teal}, comme on rallie des troupes en déroute.

    **Les cheveux de Phédon.** Socrate joue avec les cheveux de Phédon : demain, il les coupera en signe de deuil. Non, aujourd'hui, et lui aussi, {yellow}si notre raisonnement meurt{/yellow} et qu'ils ne peuvent le faire revivre. Le deuil qui compte n'est pas celui de Socrate, mais celui du **raisonnement**.

    **Misanthropie et misologie.** {coral}« il n'existe pas de plus grand mal [...] que d'être en proie à cette haine des raisonnements »{/coral}. Elle naît comme la haine des hommes. Le misanthrope a accordé sa confiance sans rien connaître des hommes, a été déçu, puis encore, et finit par les détester tous. Il prouve seulement son incompétence : qui connaîtrait les hommes saurait que {yellow}les très bons et les très mauvais sont rares, comme les très grands et les très petits{/yellow}, et que la plupart sont entre les deux.

    **Où la comparaison s'arrête.** Pour les raisonnements, la ressemblance tient en un seul point : qui accorde sa confiance à un raisonnement sans compétence le trouvera bientôt faux, puis un autre, et ainsi de suite. Ce sont surtout les {pink}spécialistes des discours contradictoires{/pink} qui en viennent à tenir toute chose et tout raisonnement pour malsains, que tout est emporté {yellow}« dans une sorte d'Euripe »{/yellow}, ce détroit aux courants changeants. Le misologue ne juge pas tous les raisonnements faux : il les tient tous pour équivalents.

    **Accuser son incompétence, non les raisonnements.** Ce serait lamentable, alors qu'il existe un raisonnement vrai et solide, d'en rejeter la faute sur les raisonnements au lieu de {green}soi-même et de sa propre incompétence{/green}, et de se priver ainsi de la vérité. Il faut donc soupçonner non que les raisonnements n'ont rien de sain, mais que **nous** ne sommes pas encore sains, et y mettre tout son courage.

    **Le pari de Socrate.** Socrate avoue le risque qui le guette : vouloir **triompher** plutôt que chercher le vrai. Il veut que ses paroles lui paraissent vraies à lui-même, non aux autres. Et il fait un pari : {green}si ce qu'il dit est vrai, il est bon de le croire{/green} ; {pink}si après la mort il n'y a rien{/pink}, au moins n'aura-t-il pas importuné ses amis de lamentations. D'où la consigne : {amber}« ne vous occupez pas de Socrate, occupez-vous plutôt de la vérité »{/amber}, et prenez garde qu'il ne s'en aille {yellow}comme une abeille{/yellow} en laissant en eux l'aiguillon.

    ! La misologie ne consiste pas à juger tous les raisonnements faux, mais à les tenir tous pour équivalents, en deçà du vrai et du faux.
    ! Le pari de Socrate ne remplace pas la démonstration : il dit seulement qu'en attendant, croire le vrai probable ne coûte rien.
