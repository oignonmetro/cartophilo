- id: platon-phedon-objections-l2
  title: "Le silence et le chant des cygnes ; le radeau de Simmias (84b-85d)"
  notes: |-
    Un long silence suit l'argument de l'affinité. Ce moment de suspension fait le pont entre les premiers arguments et la crise : Socrate y dit l'esprit dans lequel il parle, et Simmias, l'esprit dans lequel il objecte.

    **Le silence.** Socrate reste longtemps absorbé ; Simmias et Cébès chuchotent. Socrate reconnaît que ce qui a été dit {teal}« peut donner prise encore à pas mal de doutes et d'objections »{/teal}, pour qui veut une analyse rigoureuse, et les invite à parler. Ils n'osaient pas, de peur de l'importuner dans son malheur.

    **Les cygnes d'Apollon.** Socrate en rit : comment persuader les autres qu'il ne tient pas son sort pour un malheur, s'il ne persuade même pas ses amis ? Les hommes, par peur de la mort, {red}calomnient même les cygnes{/red}, en disant que leur dernier chant est une lamentation. Mais {coral}« aucun oiseau ne chante quand il a faim, quand il a froid, quand il souffre d'une peine quelconque »{/coral}. Les {yellow}cygnes{/yellow}, oiseaux d'{sky}Apollon{/sky} et devins, chantent ce jour-là plus que jamais par {teal}« la prescience des biens qu'ils trouveront chez Hadès »{/teal}. Socrate, consacré au même dieu, n'est pas plus mauvais devin qu'eux. Le chant n'est pas la plainte d'un manque, c'est la joie d'une pensée qui pressent ce qui l'attend : ce que Socrate dit de la mort doit s'entendre ainsi.

    **Le radeau de Simmias.** Simmias pose alors sa méthode. Savoir clairement ces choses en cette vie est {red}impossible ou extrêmement difficile{/red} ; mais renoncer à tout examiner serait lâche. Il faut donc soit apprendre ce qu'il en est, soit le découvrir, soit, à défaut, choisir parmi les discours humains {teal}« ce qui s'y trouve de meilleur et de moins contestable »{/teal} et s'y tenir {yellow}« comme si on s'agrippait à un radeau »{/yellow} pour traverser la vie, faute d'une embarcation plus solide, {pink}« une parole divine »{/pink}. Pour Simmias, l'immortalité est une question de fait, que seuls les faits ou une révélation trancheraient ; la raison ne peut que choisir l'opinion la plus solide. C'est dans cet esprit qu'il objecte.

    ! Le chant des cygnes n'est pas une plainte : il exprime la joie et la prescience, et c'est ainsi que Socrate veut qu'on entende sa sérénité.
    ! Le radeau n'est pas une défaite de la raison : c'est le meilleur parti quand on ne peut ni apprendre ni découvrir, en attendant mieux.
