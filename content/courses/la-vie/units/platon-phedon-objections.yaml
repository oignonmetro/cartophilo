- id: platon-phedon-objections-l6
  title: "L'âme-harmonie contredit la réminiscence (91c-92e)"
  notes: |-
    La réfutation de Simmias commence par une contradiction interne : on ne peut pas tenir à la fois la réminiscence et l'âme-harmonie. {green}__Une harmonie vient après ce qu'elle accorde ; l'âme existait avant le corps__{/green}.

    **Ce qui reste acquis.** Socrate résume les deux objections, puis demande si Simmias et Cébès rejettent tous les raisonnements précédents. Non : ils tiennent tous deux, plus que jamais, à celui de la **réminiscence**, qui établit que l'âme existait avant d'être enchaînée dans le corps.

    **La contradiction.** Or une harmonie est une chose composée. Simmias n'acceptera pas qu'{red}« une harmonie, résultat d'une constitution, préexistait aux facteurs dont elle a besoin pour se composer »{/red}. C'est pourtant ce qu'il soutient en disant à la fois que l'âme existe avant d'entrer dans un corps et qu'elle est faite d'éléments du corps, qui n'existent pas encore. Dans la lyre, il y a d'abord le bois, les cordes, les sons non accordés ; {coral}« celle-ci se forme en dernier, et elle périt la première »{/coral}. Socrate s'en amuse : s'il y a un discours qui doit être à l'unisson avec lui-même, c'est bien celui qui parle d'harmonie.

    **Le choix de Simmias, et sa raison.** Entre « apprendre, c'est se ressouvenir » et « l'âme est une harmonie », Simmias préfère de beaucoup la première. L'autre lui est venue {red}« sans démonstration »{/red}, par simple **vraisemblance** : elle lui semblait convenir à la chose, comme la plupart des hommes se font une opinion. Or {teal}« les raisonnements qui élaborent leurs démonstrations en s'appuyant seulement sur des vraisemblances sont de la poudre aux yeux »{/teal}, en géométrie comme ailleurs. La réminiscence, elle, repose sur {green}« une hypothèse qui mérite d'être reçue »{/green} : que notre âme existe avant le corps {teal}« au même titre qu'existe ce mode d'être essentiel dont le nom signifie "ce que c'est" »{/teal}.

    **Ce que le choix enseigne.** Simmias ne cède pas par attachement : il distingue deux sortes de raisonnements, ceux qui séduisent par leur vraisemblance et ceux qui reposent sur une hypothèse solide. C'est la première apparition de la **méthode par hypothèse**, que Socrate exposera dans l'autobiographie (99d-101e).

    ! La contradiction n'est pas que l'harmonie soit incorporelle, mais qu'elle soit postérieure à ce qu'elle harmonise, alors que l'âme est antérieure au corps.
    ! Simmias abandonne l'âme-harmonie non par sentiment, mais parce qu'elle ne reposait que sur une vraisemblance.
