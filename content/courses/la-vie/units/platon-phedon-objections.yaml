- id: platon-phedon-objections-l1
  title: "Repérage : les objections, la misologie et l'âme-harmonie (84b-95a)"
  notes: |-
    Au moment où la démonstration paraît achevée, tout vacille : Simmias et Cébès opposent deux objections qui semblent ruiner les trois arguments. Avant de répondre, Socrate prévient le danger que cette crise fait courir : **haïr les raisonnements**. Puis il réfute la première objection ; la seconde, plus profonde, exigera tout le reste du dialogue.

    | Moment | Lieu | Ce qui s'y joue |
    | le chant des cygnes | 84b-85b | Socrate chante comme les cygnes d'Apollon, par joie et non par douleur |
    | l'objection de Simmias | 85b-86d | l'âme pourrait être l'harmonie du corps, qui périt avant lui comme celle d'une lyre brisée |
    | l'objection de Cébès | 86e-88b | l'âme pourrait durer plus que le corps et s'user pourtant, comme un tisserand qui use ses manteaux |
    | la misologie | 88c-91c | il ne faut pas haïr les raisonnements, mais accuser notre manque de compétence |
    | la réfutation de Simmias | 91c-95a | l'âme-harmonie contredit la réminiscence, et une harmonie ne peut ni varier comme l'âme ni la commander |
