- id: platon-phedon-objections-l4
  title: "L'objection de Cébès : le tisserand et ses manteaux (86e-88b)"
  notes: |-
    L'objection de Cébès est plus redoutable que celle de Simmias : elle accorde à l'âme d'être plus forte et plus durable que le corps, et montre que {red}__cela ne suffit pas à prouver qu'elle ne périra jamais__{/red}.

    **Ce que Cébès accorde.** La préexistence de l'âme a été démontrée de façon {teal}« vraiment parfaite »{/teal}. Il n'est pas d'accord avec Simmias : l'âme est bien plus vigoureuse et plus durable que le corps. Mais qu'elle existe encore après la mort, cela n'est pas démontré.

    **L'image du tisserand.** Raisonner comme Socrate, c'est comme si, à la mort d'un {yellow}vieux tisserand{/yellow}, on disait qu'il subsiste, preuve que le manteau qu'il avait tissé et portait subsiste encore, et qu'un homme dure plus longtemps qu'un manteau. L'argument est {red}« simplette »{/red} : le tisserand a usé et tissé une foule de manteaux, et c'est après en avoir usé une longue série qu'il meurt, avant le dernier seulement.

    **L'application à l'âme.** De même, {coral}« chaque âme use un bon nombre de corps »{/coral}, d'autant que le corps {teal}« ne cesse de s'écouler et de périr du vivant même de l'homme »{/teal}, tandis que l'âme répare sans cesse ce qui s'use. L'âme dure plus que chaque corps, mais rien n'empêche qu'à la fin, usée, elle périsse revêtue de son dernier corps, qui pourrit alors à son tour. Que le cadavre dure ne prouve donc rien.

    **La concession maximale, et ce qu'elle laisse ouvert.** On peut accorder plus encore : que l'âme existait avant la naissance, et que certaines âmes, après la mort, existent et renaîtront maintes fois, car l'âme est assez forte pour supporter de nombreuses naissances. Mais on ne peut pas accorder {amber}qu'elle ne s'épuise pas au fil de ces naissances et ne finisse pas, lors de l'une de ses morts, par périr totalement{/amber}. Or personne ne peut savoir laquelle de ses morts sera la dernière. Dès lors, toute sérénité devant la mort est {red}« une forme d'inconscience »{/red}, à moins de démontrer que l'âme est {green}« chose absolument immortelle et indestructible »{/green}.

    **Pourquoi c'est plus grave que Simmias.** Simmias niait que l'âme fût plus durable ; Cébès l'accorde et montre que la durée ne suffit pas : il faut prouver non qu'elle dure longtemps, mais qu'**elle ne peut pas périr**. C'est ce que fera le dernier argument, en remontant à la cause de toute naissance et de toute corruption (95e-107a).

    ! Cébès ne nie pas la préexistence ni même les renaissances : il nie que la durée prouve l'indestructibilité.
    ! L'objection porte sur la différence entre durer longtemps et ne pas pouvoir périr.
