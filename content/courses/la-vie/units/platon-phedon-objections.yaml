- id: platon-phedon-objections-l8
  title: "L'âme commande au corps : « Endure, mon cœur » (94b-95a)"
  notes: |-
    Le dernier argument contre Simmias est le plus intuitif : {green}__l'âme ne suit pas les affections du corps, elle s'y oppose et les gouverne__{/green}, ce qu'une harmonie ne saurait faire.

    **L'âme commande.** De tout ce qui est en l'homme, rien ne commande sinon l'âme, surtout quand elle est sensée. Le fait-elle en cédant au corps, ou en lui résistant ? Ses exemples sont simples : {yellow}« on a la fièvre, on a soif, l'âme tire en sens opposé, elle interdit de boire ; ou on a faim, et elle interdit de manger »{/yellow}. Il y a des milliers de cas où l'âme s'oppose au corps.

    **Une harmonie ne le pourrait pas.** Or on a accordé qu'il était impossible qu'une âme-harmonie {red}« chante jamais un air opposé aux tensions »{/red} de ses éléments, qu'elle devrait les suivre sans jamais les diriger. En réalité, l'âme fait tout le contraire : elle dirige ses prétendus éléments, s'oppose à eux presque en tout, toute sa vie, tantôt durement, {yellow}par la gymnastique et la médecine{/yellow}, tantôt doucement, par menaces et rappels à l'ordre. {coral}« quand elle s'adresse aux appétits, aux colères, aux peurs, c'est comme si un dialogue s'établissait entre deux choses différentes »{/coral}.

    **Le témoignage d'Homère.** {sky}Homère{/sky} l'a représenté dans l'*Odyssée*, quand {yellow}Ulysse{/yellow} {teal}« Se frappant la poitrine, [...] apostrophait son cœur, lui disant : " Endure, mon cœur ; tu sus bien, jadis, endurer pire chiennerie " »{/teal}. Le poète ne concevait pas l'âme comme une harmonie menée par les affections du corps, mais comme ce qui les mène, une chose {green}« bien trop divine pour n'être qu'une harmonie »{/green}. La prémisse implicite qui rend l'argument contraignant : **ce qui maîtrise et réprime doit être autre que ce qui est maîtrisé** ; un accord des tensions du corps ne peut se retourner contre elles.

    **Harmonie apaisée.** Affirmer que l'âme est une harmonie, ce serait n'être d'accord {red}« ni avec Homère, poète divin, ni avec nous-mêmes »{/red}. Socrate plaisante : {yellow}Harmonie la Thébaine{/yellow} (la déesse, épouse de Cadmos, fondateur de Thèbes, patrie de Simmias) leur est devenue propice ; reste à apaiser {yellow}Cadmos{/yellow}, c'est-à-dire Cébès.

    ! L'argument ne prouve pas l'immortalité : il prouve seulement que l'âme n'est pas l'harmonie du corps.
    ! Le conflit intérieur montre une dualité réelle entre ce qui commande et ce qui est commandé, que la thèse de l'âme-harmonie ne peut pas expliquer.
