- id: platon-phedon-objections-l7
  title: "Une harmonie ne varie pas comme l'âme : la vertu et le vice (92e-94b)"
  notes: |-
    Socrate examine ensuite la thèse en elle-même, par ses conséquences. Deux propriétés d'une harmonie suffisent à montrer que {green}__l'âme ne peut pas en être une__{/green} : elle suit ses éléments, et elle admet des degrés.

    **Une harmonie suit ses éléments.** Un composé ne peut ni agir ni pâtir autrement que ses éléments ; une harmonie ne peut donc {teal}« avoir préséance »{/teal} sur eux, elle {coral}« doit plutôt être leur suivante »{/coral}, incapable {teal}« de s'opposer en quoi que ce soit aux parties qui la constituent »{/teal}. Simmias l'accorde. Cette première conséquence servira au dernier argument (94b-95a).

    **Une harmonie admet des degrés.** Une harmonie dépend de la manière dont on harmonise : plus parfaitement et plus largement on accorde, plus l'harmonie est parfaite et étendue. Or {red}une âme n'est pas plus ou moins âme qu'une autre{/red} : un corps n'est pas plus ou moins vivant qu'un autre. Il faudrait donc que toutes les âmes soient des harmonies exactement égales.

    **Le problème de la vertu et du vice.** On dit pourtant des âmes, et avec raison, que les unes ont de l'intelligence, de la vertu, sont bonnes, et que les autres sont insensées et mauvaises. Que dira le partisan de l'âme-harmonie ? Que la vertu est une harmonie et le vice une désharmonie, et donc que l'âme bonne, qui est déjà une harmonie, {red}contient en elle une autre harmonie{/red} ? La thèse devient obscure dès qu'il faut loger la vertu dans l'âme.

    **La conclusion absurde : toutes les âmes également bonnes.** Si aucune âme n'est plus ou moins harmonie qu'une autre, aucune n'est plus ou moins harmonisée ; aucune ne participe donc plus qu'une autre à l'harmonie ni à la désharmonie, c'est-à-dire à la vertu ni au vice. Bien plus, une harmonie qui est pleinement harmonie ne participe jamais à la désharmonie : {red}aucune âme n'aura part au vice{/red}, et {red}« toutes les âmes de tous les vivants seront semblablement bonnes »{/red}. Le raisonnement n'aboutirait pas à cette absurdité si la thèse était juste. La prémisse implicite est que **la différence morale entre les âmes est réelle** : il y a des âmes bonnes et des âmes mauvaises ; une théorie qui l'efface se réfute elle-même.

    ! L'argument ne nie pas que la vertu admette des degrés : il dit que l'âme, en tant qu'âme, n'en admet pas, alors que l'harmonie en admettrait.
    ! Ce n'est pas un jeu de mots : si l'âme n'était qu'un accord du corps, la vertu, le vice et la purification n'auraient plus de sens.
