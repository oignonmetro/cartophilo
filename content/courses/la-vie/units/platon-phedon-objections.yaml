- id: platon-phedon-objections-l3
  title: "L'objection de Simmias : l'âme, harmonie du corps (85e-86d)"
  notes: |-
    L'objection de Simmias retourne contre Socrate son propre argument de l'affinité. Elle montre qu'{red}__on peut être invisible, incorporel et divin, et périr pourtant avant ce qui est corporel__{/red}.

    **L'image de la lyre.** Selon Simmias, {teal}« on pourrait [...] tenir exactement le même raisonnement à propos d'une harmonie musicale et d'une lyre avec ses cordes »{/teal}. L'harmonie {teal}« est une chose qu'on ne voit pas et qui n'a pas de corps, qui est très belle, divine »{/teal} quand la lyre est accordée ; la lyre et ses cordes, elles, sont des corps, {teal}« composées, terreuses, apparentées à ce qui est mortel »{/teal}. Si l'on brise la lyre ou coupe ses cordes, faudra-t-il dire, comme Socrate, que l'harmonie, parente du divin, subsiste encore et que le bois et les cordes pourriront avant qu'il lui arrive rien ? Évidemment non : {red}l'harmonie périt la première{/red}.

    **Pourquoi c'est redoutable.** L'harmonie possède exactement les traits que l'argument de l'affinité prêtait à l'âme : invisible, incorporelle, belle, divine. Et pourtant elle n'a aucune existence hors de la lyre. L'objection sépare donc deux choses que Socrate confondait : la **valeur** (l'harmonie est plus belle et plus divine que les cordes) et l'**être** (elle dépend entièrement d'elles). La prémisse implicite qui la rend contraignante : {amber}ce qui résulte de l'agencement d'éléments n'existe pas sans eux{/amber}.

    **L'âme, mélange du corps.** Simmias l'applique à l'âme, selon une thèse que {teal}« nous soutenons, nous »{/teal}, sans doute les pythagoriciens de son temps, familiers de {sky}Philolaos{/sky}, et d'inspiration médicale : notre corps est {teal}« comme en état de tension interne »{/teal}, tenu par {yellow}le chaud et le froid, le sec et l'humide{/yellow}, et l'âme est {red}« une combinaison et une harmonie de ces opposés lorsqu'ils se combinent selon une proportion convenable »{/red}. Ce qu'on appelle âme, c'est donc la **vie**, le bon dosage des qualités du corps. Dès que le corps se relâche ou se tend à l'excès, par maladie ou accident, l'âme, si divine soit-elle, périt aussitôt, comme toute harmonie ; les restes du corps, eux, durent longtemps, {teal}« jusqu'à ce qu'on les brûle ou qu'ils pourrissent »{/teal}.

    **La réponse différée.** Socrate trouve l'objection sérieuse ({teal}« il y a des choses justes dans ce que dit Simmias »{/teal}) et veut entendre d'abord celle de Cébès, pour décider ensuite des réponses.

    ! Simmias ne confond pas l'harmonie avec un son : il la dit incorporelle, mais inséparable des cordes qu'elle accorde.
    ! L'objection vise précisément l'affinité : invisible et divin ne veulent pas dire indépendant.
