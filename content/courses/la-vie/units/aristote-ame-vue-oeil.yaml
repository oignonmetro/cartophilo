- id: aristote-ame-vue-oeil-p1
  title: "La hache : la vie n'est pas une chose ajoutée au corps"
  notes: |-
    **Le premier mouvement dit ce qu'est l'âme** {amber}**« en termes généraux »**{/amber} **:** {violet}**la forme**{/violet} **d'un corps de telle sorte.** Une fiction le fait voir, celle de la hache vivante, que le paragraphe retire aussitôt. Il réunit donc une affirmation, une image et une rectification.

    **Pour la vie, le paragraphe établit un statut :** {green}__vivre est ce qu'est ce corps__{/green}, et {red}non quelque chose qu'il aurait en plus{/red}. Il en fixe aussi la condition : {coral}seul vit un corps qui a en lui-même son principe{/coral}.

    | Moment | Fragment | Ce qui s'y joue |
    | redire la définition en termes de substance | 1 | l'âme n'est pas une autre chose que le corps : elle est ce qui fait que ce corps-ci est ce qu'il est |
    | imaginer une hache vivante pour faire voir ce qu'est une forme | 2 | ce qui fait la hache n'est pas sa figure, mais ce qu'elle peut faire : ôté, il ne reste qu'un nom |
    | retirer la fiction et limiter la thèse | 3 | l'âme n'est forme que d'un corps naturel et organisé, qui a son principe de mouvement en lui-même |

    === 1 Ce qui fait vivre est ce qui fait que ce corps est ce qu'il est

    **La question n'est plus « de quoi est fait le vivant ? », mais « qu'est-ce qui fait que ce corps est ce qu'il est ? ».** {teal}« {/teal}La substance {teal}qui correspond à la raison »{/teal} répond à la seconde : l'{violet}âme{/violet} n'est {red}pas une autre chose à côté du corps{/red}, elle est {green}__ce qu'on nomme quand on définit ce corps__{/green}.

    **« De telle sorte de corps » est décisif.** La forme n'est pas celle d'un corps quelconque. Aristote le reprochait à ses prédécesseurs, qui parlent de l'âme {pink}sans dire un mot du corps qui la reçoit{/pink} : {teal}« l'art, en effet, doit disposer de ses instruments et l'âme de son corps »{/teal} (I, 3, 407b25-26).

    === 2 Si la hache vivait : sa forme ôtée, il reste un nom

    **Pourquoi un outil ?** Parce que chez lui la chose se voit sans peine : {green}__ce qui fait une hache n'est pas sa matière, mais ce qu'elle peut faire__{/green}, couper. Le texte ne le dit qu'à la fin, en parlant de {teal}« l'action de couper »{/teal} et de {teal}« la puissance de l'outil »{/teal}. Il retire par la pensée cette détermination : {amber}il reste du métal{/amber}, qui s'appelle encore hache, {teal}« sauf de façon purement nominale »{/teal}.

    L'argument établit deux choses : la forme {red}n'est pas la figure{/red}, puisqu'une hache hors d'usage peut garder sa figure ; et la forme {green}est une condition d'identité{/green}, puisqu'en la perdant la chose cesse d'être ce qu'elle était. __Prémisse implicite : un outil se définit par sa fonction.__

    Mais il ne suffit pas : une hache n'est pas vivante. {yellow}« C'est comme si »{/yellow} est un **irréel**, qui emprunte à l'outil la seule relation de la forme et de la matière.

    === 3 Seul vit ce qui a son principe en lui-même

    **La fiction se défait d'elle-même :** {amber}« Mais voilà, c'est une hache »{/amber}. Il n'y a pas d'âme dans une hache, parce que {coral}__l'âme n'est forme que d'un corps qui a en lui-même son principe de mouvement__{/coral}. C'est la définition même de la nature : chacune des choses naturelles {teal}« possède en elle-même un principe de mouvement et d'arrêt »{/teal}, alors qu'{yellow}un lit, un manteau{/yellow}, produits d'un art, {teal}« ne possèdent aucune impulsion innée au changement »{/teal} (*Physique*, II, 1, 192b13-19).

    **« D'un genre précis »** : {amber}être naturel ne suffit pas{/amber}. Le feu et la terre ont aussi leur principe de mouvement ; il faut un corps organisé.

    **Vivre, c'est donc vivre de soi.** {teal}« En lui-même »{/teal} répond à la définition de la vie donnée plus haut, {teal}« la propriété de par soi-même se nourrir, croître et dépérir »{/teal} (412a14-15) : {coral}__la vie est une autonomie de fonctionnement__{/coral}, et elle comprend {amber}le dépérissement{/amber} lui-même, qui n'est pas pour le vivant un accident venu du dehors.

    **« Et de stabilité »** n'est pas une clause de style. Le vivant ne se contente pas de se mouvoir, il {green}__se limite__{/green} : {teal}« la croissance du feu s'étend à l'infini, tant que le combustible est disponible, alors que les systèmes que forme la nature ont tous une limite et un ordre de grandeur ainsi que de croissance. Or cela tient à l'âme »{/teal} (II, 4, 416a15-18).

    ! « Son âme s'identifierait à cela » ne prête aucune âme à la hache : tout le passage est à l'irréel, et la phrase suivante le rappelle.
  passage:
    label: "412b10-17"
    text: "En termes généraux, voilà donc ce qu'est l'âme : c'est la substance, en effet, qui correspond à la raison. Ce qui veut dire : la détermination qui fait essentiellement de telle sorte de corps ce qu'il est. C'est comme si un quelconque des outils était un corps naturel, par exemple une hache. La détermination qui fait essentielle la hache serait sa substance et son âme s'identifierait à cela. Et si l'on mettait cette détermination à part, il n'y aurait plus de hache, sauf de façon purement nominale. Mais voilà, c'est une hache et ce n'est pas, en réalité, de cette sorte de corps que l'âme représente la détermination essentielle et la raison, mais d'un corps naturel, d'un genre précis, qui possède un principe de mouvement et de stabilité en lui-même."
