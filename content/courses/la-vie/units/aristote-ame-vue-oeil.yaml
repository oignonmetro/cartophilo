# Unité de texte (voir content/textes.md) : Aristote, De l'âme, II, 1,
# 412b10-413a3, trad. Bodéüs (Œuvres complètes, Flammarion), texte fourni par
# l'utilisateur. Sans commentaire : l'unité repose sur une analyse écrite pour
# elle. Renvois à Aristote cités dans les Œuvres complètes ; positions des
# commentateurs d'après le notebook « Aristote : la vie ». Suite des unités
# aristote-la-vie-est-une-realisation et -premiere (412a6-412b9).

id: aristote-ame-vue-oeil
title: "Aristote : le corps vit comme l'œil voit"
subtitle: "De l'âme, II, 1, 412b10-413a3"
icon: page
color: coral
intro: |-
  Un texte sur l'âme, et par là sur ce que c'est que vivre. Aristote prend une hache, puis un œil, comme si l'une était un corps naturel et l'autre un animal, pour faire voir que la vie n'est pas une chose ajoutée au corps, mais ce qu'il est et ce qu'il peut, que le vivant le perd en mourant, et que ce qui vit, c'est l'âme et le corps ensemble.
lessons:
- id: aristote-ame-vue-oeil-i1
  title: "Un texte sur l'âme, donc sur la vie"
  notes: |-
    **Le texte répond à la question** {amber}**« que veut dire la définition de l'âme ? »**{/amber} **:** {violet}**l'âme**{/violet} **est** {coral}**ce qui fait d'un corps ce qu'il est**{/coral}**, comme** {yellow}**la vue**{/yellow} **fait d'un œil un œil.** Aristote vient de poser (II, 1, 412a6-412b9) que l'âme est {teal}« la réalisation première d'un corps naturel qui a potentiellement la vie »{/teal} ; la formule est abstraite, et elle prête à deux malentendus. Le texte la rend visible sur deux cas, puis lève les malentendus.

    **Il répond par là à une autre question :** {amber}**« qu'est-ce que vivre ? »**{/amber} Le mot n'y revient qu'en passant ({teal}« corps vivant »{/teal}, {teal}« puissance de vivre »{/teal}), parce que le texte parle de ce qui fait vivre. Mais l'{violet}âme{/violet} n'a pas d'autre définition que par la vie : {teal}« l'animé se distingue de l'inanimé par le fait qu'il est en vie »{/teal} (II, 2, 413a20-22), et {teal}« l'être, pour les vivants, c'est la vie. Et ce qui en est responsable, leur principe, c'est l'âme »{/teal} (II, 4, 415b13-14). {coral}__Chaque thèse sur l'âme est donc une thèse sur la vie__{/coral} : il suffit de demander ce qu'elle entraîne pour ce qui vit.

    | Ce que le texte dit de l'âme | Ce qui en suit pour la vie |
    | elle est la substance selon la raison | la vie est l'être du vivant, non un attribut |
    | elle est forme d'un corps de telle sorte | la vie n'est pas une propriété de toute matière |
    | ôtée, il ne reste qu'un nom | perdre la vie, c'est cesser d'être ce corps |
    | elle est comme la vue, non comme voir | vivre, c'est pouvoir avant d'exercer |
    | elle forme l'animal avec le corps | ce qui vit, c'est le composé |

    La thèse réunit deux affirmations. L'une est **ontologique** : l'âme est la {violet}forme{/violet} du corps, {red}non une chose logée en lui{/red}, {red}ni sa figure{/red}. L'autre porte sur le **mode** de cette forme : elle est {green}__une capacité__{/green}, {pink}non une activité{/pink}, comme la vue et non comme l'acte de voir. La seconde précise la première : __si l'âme était l'exercice, celui qui dort n'aurait plus d'âme__. D'où le corollaire : {coral}l'animal est le composé{/coral}.

    Le texte va de la formule abstraite ({amber}__« que veut dire la définition ? »__{/amber}) à sa conséquence ({green}__l'animal est l'âme et le corps ensemble__{/green}) par deux comparaisons, dont chacune corrige la précédente. **Les lignes** {teal}**412b10-17**{/teal} **font voir** {violet}**l'âme comme forme**{/violet} sur une hache, puis retirent la fiction. **Les lignes** {teal}**412b17-25**{/teal} **refont l'expérience sur** {violet}**l'œil**{/violet} et reportent le résultat sur le corps entier. **Les lignes** {teal}**412b25-413a3**{/teal} **lèvent le malentendu sur** {violet}**« potentiellement »**{/violet}, répartissent tous les termes et concluent sur le composé.

    | Mouvement | Lieu | Ce qui s'y joue |
    | faire voir ce qu'est une forme sur un outil, puis réserver la thèse au corps naturel | 412b10-17 | l'âme est ce qui fait qu'un corps est ce qu'il est, comme la hache est ce qu'elle peut faire : ôtée, il ne reste qu'un nom ; mais seul un corps qui a en lui-même son principe de mouvement a une âme |
    | vérifier la thèse sur un organe naturel, puis l'étendre au vivant entier | 412b17-25 | la vue est à l'œil ce que l'âme est au corps : sans elle, il n'y a plus d'œil que de nom, et le rapport de la vue à l'œil est celui de la sensation au corps sensible |
    | écarter les mauvaises lectures de « potentiellement », puis distinguer la capacité de l'exercice | 412b25-413a3 | la puissance de vivre suppose l'âme, ce qui exclut le cadavre et la semence ; l'âme est comme la vue, l'éveil comme l'acte de voir, le corps ce qui est en puissance : ensemble, ils forment l'animal |

    **Contre qui ?** Aristote ne nomme personne ici, mais ses cas visent deux adversaires qu'il nomme ailleurs. {sky}**Démocrite**{/sky} réduit l'être humain à {red}sa figure et sa couleur{/red} (*Parties des animaux*, I, 1) : l'œil en pierre a la figure de l'œil. Les {sky}**pythagoriciens**{/sky} racontent que {teal}« {/teal}{red}n'importe quelle âme{/red} s'insinue en {red}n'importe quel corps{/red}{teal} »{/teal} (*De l'âme*, I, 3, 407b22-23) : or l'âme est celle {green}__« de telle sorte de corps »__{/green}.

    ! Le texte n'ajoute pas une seconde définition à la première : il dit ce qu'elle veut dire, et l'étend au corps entier.
