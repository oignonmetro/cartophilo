- id: aristote-ame-vue-oeil-o2
  title: "La vie selon Aristote face à Descartes, Kant, Bichat, Plotin"
  notes: |-
    **La définition d'Aristote se mesure à ceux qui ont pensé la vie autrement, et ses commentateurs en discutent la cohérence.**

    **Descartes : le corps mort est le même corps.** Le corps vivant diffère du mort comme {yellow}une montre{/yellow} {teal}« lorsqu'elle est montée et qu'elle a en soi le principe corporel des mouvements pour lesquels elle est instituée »{/teal} diffère de {teal}« la même montre »{/teal} {teal}« lorsqu'elle est rompue »{/teal} (*Les Passions de l'âme*, art. 6). **« La même » est l'exact contraire de l'homonymie**, et {red}la mort n'arrive jamais « par la faute de l'âme »{/red} (art. 5). Descartes rend à la machine ce qu'Aristote lui refusait, le principe {teal}« en soi »{/teal}, et ôte à l'âme ce qu'Aristote lui donnait, la vie.

    **Kant : la même frontière, un autre statut.** Le §65 de la *Critique de la faculté de juger* retrouve la frontière de la hache sur {yellow}la montre{/yellow} : {teal}« une partie existe certes pour l'autre, mais elle n'existe pas par elle »{/teal}. La machine n'a qu'une {pink}force motrice{/pink}, l'être organisé une {green}force formatrice{/green}. Mais ce qui est chez Aristote la {coral}définition de ce qui est{/coral} n'est plus chez Kant qu'un {amber}concept régulateur{/amber}, un principe pour la réflexion.

    **Bichat : des fonctions, mais contre la mort.** {teal}« L'ensemble des fonctions qui résistent à la mort »{/teal} définit aussi la vie par des fonctions, {red}non par une chose{/red}. Mais Bichat parle de {pink}fonctions exercées{/pink}, et par leur rapport à leur contraire ; Aristote, d'{green}une capacité{/green}, qui n'a pas besoin de la mort pour se définir. Et {pink}le principe que Bichat déclare inconnu{/pink}, Aristote {green}le définit par ses actes{/green}.

    **Canguilhem : la fonction comme valeur.** Si un organe se mesure à ce qu'il doit pouvoir faire, le texte rend pensable le **pathologique** : la vie {teal}« est polarité et par là même position inconsciente de valeur »{/teal} (*Le normal et le pathologique*).

    **Driesch : ni vitalisme ni mécanisme.** {sky}Driesch{/sky} reprendra au XXe siècle le mot d'{violet}entéléchie{/violet} pour un facteur vital distinct de la matière : le texte l'exclut, {red}l'âme n'étant pas une seconde chose à côté du corps{/red}. Mais il exclut aussi qu'on rende compte de la vie par {pink}la seule matière et sa disposition{/pink}, puisque {green}la forme est ce que ce corps peut faire{/green}.

    **Plotin : l'objection du sommeil.** Contre l'âme-entéléchie, le traité 2 (IV, 7, chap. 8⁵) objecte qu'une âme collée au corps ne pourrait {teal}« faire retraite dans le sommeil »{/teal}, et qu'{red}« il n'y aura même plus de sommeil »{/red}. La répartition d'Aristote répond d'avance : {green}__dans le sommeil, rien ne se retire__{/green}, c'est l'exercice qui cesse et la capacité qui demeure.

    **Un débat moderne : la matière importe-t-elle ?** Si la forme est la fonction, un œil artificiel qui verrait serait-il un œil ? {sky}Nussbaum et Putnam{/sky} rapprochent Aristote du **fonctionnalisme** ; {sky}Burnyeat{/sky} le leur refuse (*Essays on Aristotle's De Anima*, 1992). Aristote dit seulement qu'{teal}« une main ne peut être composée de n'importe quoi, par exemple d'airain ou de bois »{/teal} : {amber}la matière doit être capable de la fonction{/amber}.

    **La difficulté d'**{sky}**Ackrill**{/sky} (article de 1972-73). {yellow}Le bronze{/yellow} existe avant la statue et après elle : {amber}il n'est statue que par accident{/amber}. {green}Le corps{/green}, lui, __n'est ce corps que s'il a l'âme__ : l'homonymie lui interdit de survivre comme corps. {red}Comment serait-il alors la matière de l'âme, au sens où le bronze est celle de la statue ?{/red} {sky}Whiting{/sky} assume la conséquence : {teal}« only a body that is actually alive is potentially alive »{/teal} (« Living Bodies », 1992). Elle distingue le {green}corps fonctionnel{/green}, défini par ses capacités vitales et indissociable de l'âme, du {amber}corps de composition{/amber}, matière homéomère et éléments, qui n'est lié à l'âme que de façon contingente ; {sky}Frey{/sky} (2007) critique cette distinction. Elle s'appuie aussi sur ce que vivre est une `energeia` : {coral}__l'acte y coexiste avec la puissance__{/coral}, si bien que le corps reste potentiellement vivant en vivant.

    ! Aristote n'a répondu à aucun de ces auteurs : ces rapprochements éclairent la définition, sans lui prêter une réplique.
