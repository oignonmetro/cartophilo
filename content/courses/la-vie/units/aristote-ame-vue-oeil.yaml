- id: aristote-ame-vue-oeil-ouverture
  title: "Ce que la définition laisse ouvert : une vie sans corps ?"
  notes: |-
    **Aussitôt après le texte, Aristote tire la conséquence :** {green}**l'âme n'est pas séparable du corps**{/green}**, et il la nuance sur-le-champ.** Si l'âme est au corps ce que la vue est à l'œil, elle ne peut pas lui survivre, {amber}du moins dans celles de ses parties qui sont réalisations de parties du corps{/amber}. Mais {pink}rien n'empêche la séparation{/pink} de celles qui ne le sont d'aucun corps.

    **Une question reste expressément ouverte :** {teal}« on ne voit pas encore si l'âme est réalisation du corps, en ayant avec lui la relation du navigateur à son navire »{/teal}. {yellow}Le navigateur{/yellow} commande son navire et peut le quitter : ce serait une réalisation {red}sans l'inséparabilité{/red} que le texte venait de faire voir. Aristote n'écarte pas l'image, il dit **ne pas voir encore**, et donne le tout pour {amber}une « ébauche »{/amber}.

    **Y a-t-il donc une vie sans corps ?** C'est ce que la définition laisse ouvert pour le concept de vie. {coral}Toute vie que le texte décrit est celle d'un corps{/coral}. Mais {teal}« le fait de vivre s'entend de plusieurs façons »{/teal}, et l'une d'elles est l'intelligence. Or la *Métaphysique* attribue la vie à un être qui n'est réalisation d'aucun corps : {teal}« la vie aussi, certes, lui appartient, car l'acte de l'intellect est vie et l'acte est le dieu »{/teal} (Λ, 7, 1072b26-27). {amber}__La définition ne couvre donc pas toute vie : elle dit celle des corps naturels, et elle se donne pour une « ébauche ».__{/amber}

    ! Le texte précédent ne prouve donc pas que l'âme entière est mortelle : il le prouve de ce qui, en elle, est réalisation d'une partie du corps.
  passage:
    label: "Ouverture"
    text: "On voit donc sans peine que l'âme n'est pas séparable du corps ou qu'elle a des parties qui ne le sont pas, si tant est que la nature l'ait faite morcelable. Car, en certaines parties, elle est réalisation des parties mêmes du corps. Mais, bien évidemment, en certaines autres parties, rien n'empêche la séparation, parce qu'elles ne sont réalisations d'aucun corps. – Cependant, on ne voit pas encore si l'âme est réalisation du corps, en ayant avec lui la relation du navigateur à son navire. À titre d'ébauche, on s'en tiendra donc à cette définition et à cette esquisse de l'âme."
    source: "De l'âme, II, 1, 413a4-10"
  points:
  - id: aristote-ame-vue-oeil-ouverture-1
    sentence: "*De l'âme*, II, 1 : « On voit donc sans peine que l'âme ___ ou qu'elle a des parties qui ne le sont pas, si tant est que la nature l'ait faite morcelable. »"
    answer: "n'est pas séparable du corps"
    alt: []
  - id: aristote-ame-vue-oeil-ouverture-2
    sentence: "*De l'âme*, II, 1 : « en certaines autres parties, rien n'empêche la séparation, parce qu'elles ne sont ___ »."
    answer: "réalisations d'aucun corps"
    alt: []
