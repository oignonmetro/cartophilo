- id: aristote-ame-vue-oeil-p2
  title: "L'œil : sans la vie, il n'y a plus de corps que de nom"
  notes: |-
    **Le deuxième mouvement refait l'expérience sur une partie du vivant :** {yellow}**la vue**{/yellow} **est la substance de l'œil, et sans elle** {coral}**il n'y a plus d'œil que de nom**{/coral}**.** Puis il reporte ce résultat sur le corps entier. Les deux cas sont à l'irréel, chacun pour une raison opposée : ils se corrigent l'un l'autre.

    **Pour la vie, le paragraphe établit deux choses :** {green}__elle se mesure à une capacité, non à une apparence__{/green}, et {coral}la mort est la perte de ce qu'était le corps{/coral}. Il indique aussi, en passant par la sensation, que {amber}vivre ne se dit pas d'une seule façon{/amber}.

    | Le cas | Ce qu'il fait voir | Ce qui lui manque |
    | la hache | la forme est ce que la chose peut faire | un principe en elle-même |
    | l'œil | une capacité naturelle, propre à l'organe | d'être un tout |

    === 1 Si l'œil était un animal

    **L'œil corrige la hache :** {green}__il est naturel, et sa capacité lui appartient__{/green}. Personne ne le manie. La phrase distribue les termes de l'hylémorphisme : {yellow}la vue{/yellow} est {teal}« la substance de l'œil qui correspond à sa raison »{/teal}, et {violet}l'œil{/violet}, pris comme organe, est {teal}« matière de la vue »{/teal}.

    **Ce qu'il faut entendre par « la vue » :** {green}__la faculté__{/green} (`opsis`), {pink}non l'acte de voir{/pink}. Un œil fermé reste un œil, et la dernière partie du texte classera le voir du côté de l'exercice. {coral}La forme de l'œil est donc ce qu'il peut, non ce qu'il fait à l'instant.{/coral}

    === 2 Sauf de façon nominale

    **La vue disparue, l'œil n'est plus qu'un nom.** {yellow}L'œil en pierre et l'œil dessiné{/yellow} ont {red}la figure{/red} sans {green}la fonction{/green}. La thèse revient dans tout le corpus, et elle y vise d'abord le cadavre.

    | Lieu | L'exemple |
    | *Parties des animaux*, I, 1 | le médecin en peinture, la main d'airain ou de bois |
    | *Météorologiques*, IV, 12 | l'œil mort, l'œil en pierre, la scie en bois |
    | *Génération des animaux*, II, 1 | l'œil d'un mort |
    | *Politiques*, I, 2 | la main de pierre |

    **Contre** {sky}**Démocrite**{/sky} : {teal}« quand bien même la configuration du cadavre garde même figure, ce n'est pourtant pas un être humain »{/teal} ; et {teal}« aucune des parties du cadavre n'est plus telle qu'elle était, je veux dire par exemple n'est plus un œil ou une main »{/teal} (*Parties des animaux*, I, 1, 640b34-641a5). La règle générale : {teal}« toutes les choses se définissent par leur fonction et leur capacité, de sorte que quand elles ne les ont plus il ne faut pas dire qu'elles sont les mêmes, mais qu'elles ont même nom »{/teal} (*Politiques*, I, 2, 1253a23-25).

    **Vie et corps, vie et mort.** Si ce qui reste n'est corps que de nom, il faut en tirer trois thèses. {coral}__La mort n'est pas l'altération d'un corps qui resterait le même__{/coral} : il n'y a pas {red}un même corps, tantôt vivant, tantôt mort{/red}, et {green}« corps vivant » est presque un pléonasme{/green}. Elle n'est pas davantage {pink}le départ de quelque chose qui continuerait ailleurs{/pink} : le texte n'en dit rien de tel, et {yellow}la vue ne va nulle part{/yellow} quand l'œil cesse de voir. Enfin, {amber}elle ne se confond pas avec le sommeil{/amber}, où la capacité demeure.

    **Ce que cela implique pour la connaissance de la vie.** {teal}« La configuration du cadavre garde même figure »{/teal} : {red}__l'anatomie seule ne dit pas si un corps vit__{/red}. {green}La vie ne se lit pas sur une forme visible{/green}, elle se reconnaît à ce que le corps peut faire.

    **Confrontation :** {sky}**Descartes**{/sky}**.** Le corps vivant diffère du mort comme {yellow}une montre{/yellow} {teal}« lorsqu'elle est montée et qu'elle a en soi le principe corporel des mouvements pour lesquels elle est instituée »{/teal} diffère de {teal}« la même montre »{/teal} {teal}« lorsqu'elle est rompue »{/teal} (*Les Passions de l'âme*, art. 6). **« La même » est l'exact contraire de l'homonymie**, et {red}la mort n'arrive jamais « par la faute de l'âme »{/red} (art. 5). Descartes rend à la machine ce qu'Aristote lui refusait, le principe {teal}« en soi »{/teal}, et ôte à l'âme ce qu'Aristote lui donnait, la vie.

    **La fonction est une norme.** Dire d'un œil qu'il n'en est plus un, c'est le mesurer à ce qu'il doit pouvoir faire. {amber}Mais où passe la frontière ?{/amber} Les *Catégories* disent que {teal}« la vue et la cécité se disent de l'œil »{/teal} (10, 12a27) : l'aveugle a un œil {pink}privé{/pink} de ce qu'il devrait avoir, ce qui n'est pas le sort de l'œil en pierre. Le texte ne trace pas cette frontière, mais il rend pensable le **pathologique** : {sky}Canguilhem{/sky} dira que la vie {teal}« est polarité et par là même position inconsciente de valeur »{/teal} (*Le normal et le pathologique*).

    **L'œil aveugle est-il encore un œil ?** Pour {sky}Shields{/sky}, {sky}Polansky{/sky} et {sky}Bermúdez{/sky}, la lettre du texte répond {pink}non{/pink} : c'est ce que Shields appelle la {violet}thèse de la détermination fonctionnelle{/violet}, une chose n'appartient à une classe que si elle {green}__peut en accomplir la fonction__{/green}. La difficulté subsiste pour ce que les *Catégories* appellent une privation.

    **Un débat moderne : la matière importe-t-elle ?** Si la forme est la fonction, un œil artificiel qui verrait serait-il un œil ? {sky}Nussbaum et Putnam{/sky} rapprochent Aristote du **fonctionnalisme** ; {sky}Burnyeat{/sky} le leur refuse (*Essays on Aristotle's De Anima*, 1992). Aristote dit seulement qu'{teal}« une main ne peut être composée de n'importe quoi, par exemple d'airain ou de bois »{/teal} : {amber}la matière doit être capable de la fonction{/amber}.

    === 3 De la partie au tout

    **Le transfert repose sur une proportion :** {yellow}la vue{/yellow} est à {yellow}l'œil{/yellow} ce que {green}la sensation entière{/green} est au {green}corps entier doué de sensation{/green}. Ce n'est pas qu'une image : {amber}c'est le tout qui donne aux parties leur fonction{/amber}, {teal}« une fois que le corps entier a péri, il n'y a plus ni pied ni main, sinon par homonymie »{/teal} (*Politiques*, I, 2).

    **« En tant que tel »** précise sous quel rapport : {pink}non le corps comme lourd ou comme chaud{/pink}, mais {green}__le corps en tant qu'il sent__{/green}.

    **Pourquoi la sensation, et non la vie ?** Parce que la proportion part de l'œil et ne mène qu'à l'animal, qui est {teal}« fondamentalement identifiable grâce au critère de la sensation »{/teal} (II, 2, 413b2). {amber}Le texte s'en tient donc à l'animal ; la plante n'y entre que par la formule commune donnée plus haut.{/amber}

    {sky}Polansky{/sky}, dans son commentaire, ajoute une raison : ici {green}un organe précis est associé de façon univoque à une capacité précise{/green}, quand {pink}la vie en général est trop vaste{/pink} pour marquer cette corrélation. {sky}Bolton{/sky} note de même que le passage restreint l'âme et le corps à {amber}l'âme et au corps de l'animal{/amber}.

    **Vivre ne se dit donc pas d'une seule façon.** Le texte le suppose en passant de la vie à la sensation : {teal}« le fait de vivre s'entend de plusieurs façons »{/teal}, et {teal}« il y a vie là où se trouve ne serait-ce qu'une seule »{/teal} des manifestations que sont {yellow}l'intelligence, la sensation, le mouvement local et le mouvement nutritif{/yellow} (II, 2, 413a22-25). Une définition unique manquerait la chose : {teal}« la vie ne se dit pas selon une forme unique : autre est celle qui est le cas pour les animaux, autre pour les végétaux »{/teal} (*Topiques*, VI, 10), et il serait {red}« ridicule »{/red} de chercher {teal}« la formule commune qui ne serait celle, en propre, d'aucune réalité »{/teal} (II, 3, 414b25-26). {sky}Shields{/sky} parle d'une {violet}homonymie reliée à un foyer{/violet}, {sky}Pellegrin{/sky} de {violet}« catégories de la vie »{/violet}. {coral}__Le statut de la définition s'en trouve fixé : elle vaut pour tout vivant, mais elle ne dit en propre la vie d'aucun.__{/coral}

    ! La vue n'est pas une petite âme de l'œil, ni l'âme une somme de facultés logées dans les organes : la phrase pose une proportion, non une addition.
  passage:
    label: "412b17-25"
    text: "On doit voir, au reste, ce qu'on a voulu dire, en prenant le cas des parties du corps. Si l'œil, en effet, était un animal, la vue en serait l'âme, car c'est elle la substance de l'œil qui correspond à sa raison, tandis que l'œil, lui, est matière de la vue. Et, quand cette dernière disparaît, il n'y a plus d'œil, sauf de façon nominale, comme l'œil en pierre ou celui qui est dessiné. On doit donc transférer ce qui est vrai de la partie sur la totalité du corps vivant. Car le rapport de partie à partie est celui de la sensation entière au corps entier doué de sensation, en tant que tel."
