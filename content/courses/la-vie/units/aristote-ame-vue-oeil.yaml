- id: aristote-ame-vue-oeil-i2
  title: "Les mots du texte : la vie, l'âme, vivre"
  notes: |-
    **Le texte tient sur quelques termes techniques que la traduction française rend par des périphrases.** Les retrouver, c'est voir que la hache, l'œil et l'animal disent la même chose.

    | Dans le texte | Grec | Sens |
    | la substance qui correspond à la raison | `ousia kata ton logon` | la forme, ce que dit la définition |
    | la détermination qui fait essentiellement | `to ti ên einai` | l'essence, ce que c'est pour la chose que d'être |
    | de façon nominale | `homônumôs` | par homonymie : le nom seul est commun |
    | réalisation | `entelecheia` | l'acte, la forme atteinte |
    | outil | `organon` | l'instrument ; le même mot que pour l'organe |
    | l'âme | `psuchê` | le principe de la vie, chez tout vivant |
    | vivre | `zên` | l'être du vivant, son exercice |

    {violet}**« Raison »**{/violet} **ne désigne pas ici la faculté de raisonner**, que l'on n'attend pas chez la plante : `logos` veut dire ici la {coral}formule qui définit{/coral}. La substance {teal}« qui correspond à la raison »{/teal} est donc la substance au sens où l'on répond à la question : __qu'est-ce que c'est ?__ Des trois sens de « substance » distingués plus haut, matière, forme et composé, c'est le deuxième.

    **L'**{violet}**homonymie**{/violet} **est le ressort du texte.** Les *Catégories* s'ouvrent sur elle : {teal}« Sont dits homonymes les objets dont le nom seul est commun, alors que l'énonciation correspondant à ce nom est différente. C'est ainsi que l'homme et la figure dessinée sont animal »{/teal} (1, 1a1-3). Le mot peut survivre à la chose : {yellow}la figure dessinée{/yellow} s'appelle encore animal, comme {yellow}l'œil dessiné{/yellow} s'appelle encore œil. __Dire qu'une chose ne l'est plus que de façon nominale__, c'est dire qu'{red}on ne peut plus lui appliquer la définition{/red}.

    **Le même mot `organon`** désigne l'outil et l'organe : le corps {teal}« pourvu d'organes »{/teal} de la définition est un corps {amber}pourvu d'outils{/amber}. C'est ce qui rend naturelle la comparaison avec la hache, et ce qui fait la {pink}limite{/pink} qu'Aristote va devoir marquer.

    **Vie, âme, vivre : le texte permet de les distinguer.** Les mots vont ensemble, mais chacun occupe {amber}sa place dans le même schéma{/amber}, celui que la dernière partie du texte met en place :

    | Terme | Son statut | Son modèle |
    | le corps | la matière, la réalité potentielle | la pupille |
    | l'âme | la forme, réalisation première : une capacité | la vue |
    | vivre | la réalisation seconde : l'exercice | l'acte de voir |
    | le vivant | le composé : ce qui vit | l'œil |

    {violet}**La vie**{/violet} **n'a pas sa case, parce qu'elle les traverse** : {sky}Polansky{/sky} y voit la réalité qui unit capacité et exercice, l'être même de l'organisme. {red}Ne pas dire « la vie, c'est l'âme »{/red} : l'âme est {green}le principe qui fait vivre{/green}, {pink}pas le fait de vivre{/pink}.

    ! « Forme » et « essence » ne désignent pas ici une figure visible, mais ce que la chose peut faire.
