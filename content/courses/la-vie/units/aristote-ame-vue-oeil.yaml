- id: aristote-ame-vue-oeil-o1
  title: "Vivre selon ce texte : définition, statut, mort, santé, conduite de la vie"
  notes: |-
    **Le texte parlait de l'âme : voici, domaine par domaine, ce qu'il dit, suppose ou permet de penser de la vie.** Tout n'y est pas affirmé en toutes lettres : les passages parallèles le confirment ou le prolongent.

    **Définir la vie.** {green}__Vivre se dit de la capacité et de l'exercice__{/green}. Et l'exercice n'est {red}pas un processus qui tendrait vers un résultat{/red}, comme maigrir ou apprendre : {teal}« On vit bien en même temps qu'on a bien vécu »{/teal} (*Métaphysique*, Θ, 6, 1048b25-26). Vivre est une `energeia`, {green}__achevée à chaque instant__{/green} ; {sky}Polansky{/sky} la décrit comme une activité de {violet}conservation de soi{/violet}.

    **Une seule définition ne suffit pas.** Le texte passe de la vie à la sensation, parce que {teal}« le fait de vivre s'entend de plusieurs façons »{/teal} : {teal}« il y a vie là où se trouve ne serait-ce qu'une seule »{/teal} des manifestations que sont {yellow}l'intelligence, la sensation, le mouvement local et le mouvement nutritif{/yellow} (II, 2, 413a22-25). {teal}« La vie ne se dit pas selon une forme unique : autre est celle qui est le cas pour les animaux, autre pour les végétaux »{/teal} (*Topiques*, VI, 10), et il serait {red}« ridicule »{/red} de chercher {teal}« la formule commune qui ne serait celle, en propre, d'aucune réalité »{/teal} (II, 3, 414b25-26). {sky}Shields{/sky} parle d'une {violet}homonymie reliée à un foyer{/violet}, {sky}Pellegrin{/sky} de {violet}« catégories de la vie »{/violet}. {coral}__La définition vaut pour tout vivant, mais ne dit en propre la vie d'aucun.__{/coral}

    **Le statut ontologique.** Si l'âme dit ce qu'est ce corps, {coral}__vivre n'est pas une propriété que le vivant aurait en plus__{/coral} : un corps peut perdre sa blancheur et rester ce corps, {pink}il ne peut pas perdre la vie et rester ce corps{/pink}. {teal}« L'être, pour les vivants, c'est la vie »{/teal} (II, 4, 415b13). {sky}Shields{/sky} en tire que tout vivant est {violet}essentiellement vivant{/violet} ; pour {sky}Pellegrin{/sky}, la vie n'est donc {red}pas un caractère taxonomique parmi d'autres{/red}.

    | La vie n'est pas | Parce que |
    | une chose logée dans le corps | l'âme est la forme de ce corps, non un second corps |
    | un accident du corps | sans elle, ce corps n'est plus |
    | une figure | le cadavre a la même figure |
    | une propriété de la matière | seul vit un corps de telle sorte |

    **Le statut épistémologique.** La vie est {amber}évidente et obscure à la fois{/amber} : on sait ce qui vit, sans savoir dire ce que c'est. Or {teal}« la clarté qui satisfait à la connaissance rationnelle procède de données obscures quoique évidentes »{/teal} (II, 2, 413a11-12), et la fonction se voit mieux chez {teal}« toutes celles qui sont comme des instruments et en vue de quelque chose »{/teal} (*Météorologiques*, IV, 12, 389b31-32) : {coral}__d'où l'ordre du texte, de la hache à l'œil et de l'œil au vivant__{/coral}. Ensuite, {red}__l'anatomie seule ne dit pas si un corps vit__{/red}, puisque le cadavre garde la figure. Enfin, {teal}« les facultés sont précédées par les actes et les actions, selon l'ordre logique »{/teal} (II, 4, 415a18-20) : {coral}__on ne définit le pouvoir de vivre que par ce qu'il fait__{/coral}, ce que {sky}Shields{/sky} et {sky}Polansky{/sky} nomment une priorité selon la définition.

    **La frontière du vivant.** Ce qui ne vit pas ne vit pas pour la même raison :

    | Ce qui ne vit pas | Ce qui lui manque |
    | la hache | un principe de mouvement en elle-même |
    | le feu | une limite, des organes |
    | l'œil en pierre | la capacité : il n'a que la figure |
    | le cadavre | l'âme : il l'a perdue, et le corps avec elle |
    | la semence | le corps formé : elle ne l'est qu'en puissance |

    **La biologie.** La hache du texte est aussi celle des *Parties des animaux* : {teal}« puisqu'il faut fendre avec la hache, il est nécessaire qu'elle soit dure »{/teal}, et de même, {teal}« puisque le corps est un instrument (en effet chacune de ses parties est en vue de quelque chose et de même pour le tout) »{/teal}, il doit être de telle sorte (I, 1, 642a9-13). {green}__Le biologiste va donc de la vie au corps, non du corps à la vie.__{/green} Il identifie les organes de même : {teal}« ce qui correspond à la tête des animaux, ce sont les racines des plantes, s'il faut exprimer la différence et l'identité des organes d'après leurs fonctions »{/teal} (II, 4, 416a4-5).

    **Où commence et où finit un vivant ?** Le texte fait du tout l'unité de la vie, mais {amber}cette unité a des degrés{/amber} : chez les plantes, {teal}« certaines parties segmentées ont manifestement la vie, même lorsqu'on les sépare »{/teal}, et chez les insectes sectionnés, {teal}« chacun des segments est, en effet, doué de sensation ainsi que de mouvement local »{/teal} (II, 2, 413b16-22). Quant au début, l'embryon a l'âme nutritive en puissance et {teal}« ne la possède pas en acte avant de tirer la nourriture de sa mère »{/teal}, et tous {teal}« ont l'air de mener la vie de la plante »{/teal} (*Génération des animaux*, II, 3).

    **Qui vit ?** {red}L'âme ne vit pas à la place de l'animal{/red} : {teal}« dire que l'âme est en colère, c'est comme si l'on disait que l'âme est en train de tisser ou de bâtir. Il vaudrait mieux, en effet, ne pas dire que c'est l'âme qui a pitié, apprend ou réfléchit, mais que c'est l'homme qui le fait, par son âme »{/teal} (I, 4, 408b11-15). {red}Le corps seul ne vit pas non plus{/red}. {coral}__Ce qui vit, c'est le composé, par son âme.__{/coral} Le corps a beau être un instrument, {teal}« tous les corps naturels constituent des instruments de l'âme »{/teal} (II, 4, 415b18-19), {amber}aucun utilisateur ne se tient à côté de lui{/amber}.

    **La mort.** Elle se déduit du texte, et le corpus le répète : {teal}« quand bien même la configuration du cadavre garde même figure, ce n'est pourtant pas un être humain »{/teal}, contre {sky}Démocrite{/sky}, et {teal}« aucune des parties du cadavre n'est plus telle qu'elle était, je veux dire par exemple n'est plus un œil ou une main »{/teal} (*Parties des animaux*, I, 1, 640b34-641a5), lui qui parle {teal}« à la façon dont un menuisier parlerait d'une main de bois »{/teal}. La règle : {teal}« toutes les choses se définissent par leur fonction et leur capacité, de sorte que quand elles ne les ont plus il ne faut pas dire qu'elles sont les mêmes, mais qu'elles ont même nom »{/teal} (*Politiques*, I, 2, 1253a23-25) ; {teal}« ce qui ne le peut pas n'est que par homonymie, par exemple un œil mort ou un œil en pierre »{/teal} (*Météorologiques*, IV, 12, 390a10-13).

    {coral}__La mort n'est donc pas l'altération d'un corps qui resterait le même__{/coral} : pour {sky}Whiting{/sky}, c'est une {violet}destruction pure et simple{/violet} du composé, dont seule la matière élémentaire demeure. Elle n'est pas {pink}le départ de quelque chose qui continuerait ailleurs{/pink} ({yellow}la vue ne va nulle part{/yellow} quand l'œil cesse de voir), ni {amber}un sommeil{/amber}, où la capacité demeure. {teal}« Le plus redoutable, c'est la mort, parce qu'elle constitue une limite et qu'il n'y a, semble-t-il, plus rien, quand on est mort, qui soit ni bon ni mauvais »{/teal} (*Éthique à Nicomaque*, III, 6, 1115a26-27).

    **Le vivant est-il mortel par sa forme ?** Non, dit la *Métaphysique* : {teal}« pourquoi le vivant n'est pas un cadavre en puissance ; n'est-ce pas plutôt que les destructions sont par coïncidence ? »{/teal}, et {teal}« si un animal provient d'un cadavre, il lui faut d'abord retourner à la matière et ainsi redevenir animal »{/teal} (H, 5, 1044b34-1045a6). Pour {sky}Gotthelf{/sky} et {sky}Lennox{/sky}, {green}__la mortalité vient de la matière, non de la forme__{/green}. {amber}Une tension demeure{/amber} : la définition de la vie contient {teal}« dépérir »{/teal} : décliner appartiendrait au vivant, mourir lui arriverait. Et le moment n'est pas toujours net : la chair a une définition qui {teal}« n'est pas précise, de sorte qu'il n'est pas facile de distinguer quand ils existent et quand ils n'existent pas »{/teal} (*Météorologiques*, IV, 12, 390a19-21).

    **La santé, la maladie, la vieillesse.** La thèse de la {violet}détermination fonctionnelle{/violet} ({sky}Shields{/sky}) fait de la fonction une **norme** : on mesure l'œil à ce qu'il doit pouvoir faire. Mais perdre la capacité n'est pas la voir empêchée : {teal}« Que le vieillard, en effet, reçoive un œil du genre que voici, et il aura exactement la vue du jeune sujet. De telle sorte que la vieillesse ne tient pas à une quelconque affection de l'âme, mais du sujet où elle se trouve. C'est comme dans les cas d'ivresse et de maladie »{/teal} (I, 4, 408b20-24). Pour {sky}Polansky{/sky} et {sky}Shields{/sky}, {green}__la capacité n'est pas perdue, elle est empêchée__{/green} : l'organe âgé est comme {yellow}une hache émoussée{/yellow}, non comme un œil de pierre.

    | État | La capacité de vivre |
    | le sommeil | intacte ; l'exercice est suspendu |
    | l'ivresse, la maladie | intacte ; l'exercice est empêché |
    | la vieillesse | intacte ; l'organe s'affaiblit |
    | la cécité | perdue pour cet organe : une privation |
    | la mort | perdue, et le corps avec elle |

    {amber}La cécité reste le cas difficile{/amber} : pour les commentateurs, un œil qui a perdu la vue n'est plus un œil que de nom ; mais {teal}« la vue et la cécité se disent de l'œil »{/teal} (*Catégories*, 10, 12a27), comme une privation de ce qu'il devrait avoir, ce qui n'est pas le sort de l'œil en pierre. Le texte ne tranche pas.

    **Le sens de la vie.** La hache sert à autre chose qu'elle-même ; {green}__le corps, lui, sert à sa propre vie__{/green} : les corps {teal}« existent aux fins de l'âme »{/teal} (II, 4, 415b20). {amber}Mais l'individu n'est pas le dernier mot{/amber}. Produire un autre vivant, c'est {teal}« participer à l'éternel et au divin autant que possible »{/teal}, et {teal}« ce qui se conserve, ce n'est pas lui-même, mais une réalité qui lui ressemble, l'unité, non pas numérique, mais spécifique »{/teal} (II, 4, 415a26-b7). C'est aussi ce qui donne son rôle à {yellow}la semence{/yellow} du texte.

    **La conduite de sa vie.** La distinction du texte passe telle quelle dans l'éthique. {teal}« Vivre, en effet, constitue manifestement un office qu'il a en commun même avec les plantes »{/teal} ; une fois écartées la vie nutritive et la vie sensitive, reste la vie rationnelle, et {teal}« vu qu'il y a deux façons d'entendre cette vie aussi, il faut poser que c'est la vie en acte »{/teal} (*Éthique à Nicomaque*, I, 6, 1097b33-1098a7). {coral}__Être en vie n'est pas encore vivre bien__{/coral} : {teal}« la capacité reconduit à l'activité »{/teal}, et {teal}« vivre, c'est fondamentalement sentir ou penser »{/teal} (IX, 9, 1170a16-19). L'œil y revient : {teal}« la vertu de l'œil fait que nous voyons bien »{/teal} (II, 6, 1106a17-19). Et le sommeil égalise : {yellow}les vertueux ne valent pas mieux que les médiocres{/yellow} {teal}« pendant la moitié de leur vie »{/teal}, parce qu'{teal}« ils sont tous semblables dans le sommeil »{/teal}, {teal}« une sorte d'inaction et un repos »{/teal} (*Éthique à Eudème*, II, 1, 1219a25, 1219b18-19). {amber}Le dormeur exerce pourtant une part de son âme{/amber} : {teal}« pendant le sommeil, la partie nutritive est plus active »{/teal} (1219b22-23).

    ! Ces portées ne sont pas toutes dans la lettre du texte : il parle de l'âme et de l'animal, et ce sont les parallèles qui l'étendent à la mort, à la santé et à la conduite de la vie.
