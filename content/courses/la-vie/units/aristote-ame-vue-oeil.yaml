- id: aristote-ame-vue-oeil-p3
  title: "Le corps qui a la puissance de vivre est celui qui a l'âme"
  notes: |-
    **Le dernier mouvement lève le malentendu de la définition :** {teal}**« qui a potentiellement la vie »**{/teal} **ne désigne** {red}**ni le cadavre ni la semence**{/red}**, mais** {green}**le corps qui a déjà l'âme**{/green}**.** Puis il range ensemble tout ce que le texte a fait voir, et conclut sur l'animal.

    | Fragment | Ce qu'il fait |
    | 1 | préciser la puissance : ni le cadavre, ni la semence |
    | 2 | répartir : l'exercice, la capacité, le corps |
    | 3 | conclure : l'âme et le corps forment l'animal |

    === 1 Dépouillé de son âme

    **Pourquoi le préciser ?** Parce qu'{pink}on lirait volontiers{/pink} « potentiellement » comme {pink}ce qui n'a pas encore ou n'a plus{/pink}, un corps en attente de vie. C'est l'inverse : {green}__la puissance de vivre suppose l'âme__{/green}, puisque l'âme est cette puissance. {yellow}Le cadavre{/yellow} n'a pas la vie en puissance : il a {red}tout perdu{/red}.

    **La semence n'est pas potentiellement vivante, mais** {teal}**« potentiellement le corps »**{/teal}**.** Elle est à deux pas de l'exercice, ce que le savant fait comprendre :

    | Degré | Le savant (II, 5) | Le vivant |
    | puissance lointaine | l'homme, capable d'apprendre | la semence, le fruit |
    | réalisation première | celui qui a la science sans l'exercer | le corps animé, endormi |
    | réalisation seconde | celui qui spécule | l'éveillé |

    La *Génération des animaux* le dit : {teal}« en puissance une chose peut être plus proche ou plus loin qu'elle-même, comme le géomètre qui dort est plus loin que le géomètre éveillé et celui-ci plus loin que celui qui étudie »{/teal} (II, 1, 735a9-11). Et même : {teal}« la semence n'est pas encore un être humain (il faut en effet qu'elle soit dans un autre et se transforme) »{/teal} (*Métaphysique*, Θ, 7, 1049a14-15).

    Les commentateurs marquent le même écart. Pour {sky}Polansky{/sky}, la semence et le fruit ne sont {pink}qu'en puissance un corps ayant la vie en puissance{/pink} : il leur faut d'abord une transformation substantielle. {sky}Freeland{/sky} oppose la capacité de {pink}devenir{/pink}, celle de la semence, à la capacité d'{green}être{/green}, celle du corps formé.

    **La difficulté d'**{sky}**Ackrill**{/sky} (article de 1972-73). {yellow}Le bronze{/yellow} existe avant la statue et après elle : {amber}il n'est statue que par accident{/amber}. {green}Le corps{/green}, lui, __n'est ce corps que s'il a l'âme__ : l'homonymie lui interdit de survivre comme corps. {red}Comment serait-il alors la matière de l'âme, au sens où le bronze est celle de la statue ?{/red} {sky}Whiting{/sky} assume la conséquence : {teal}« only a body that is actually alive is potentially alive »{/teal} (« Living Bodies », 1992). {coral}La matière du vivant n'est pas une matière neutre qui recevrait la vie.{/coral}

    **Les réponses.** {sky}Whiting{/sky} distingue le {green}corps fonctionnel{/green}, défini par ses capacités vitales et indissociable de l'âme, du {amber}corps de composition{/amber}, matière homéomère et éléments, qui n'est lié à l'âme que de façon contingente ; {sky}Frey{/sky} (2007) critique cette distinction. Elle s'appuie aussi sur ce que vivre est une `energeia` : {coral}__l'acte y coexiste avec la puissance__{/coral}, si bien que le corps reste potentiellement vivant en vivant. {sky}Polansky{/sky} parle d'une puissance de {green}sauvegarde{/green} : le corps maintient la vie qu'il exerce.

    === 2 Couper et voir, la vue et la puissance de l'outil

    **La phrase décisive du texte reprend les deux cas sur trois lignes.** L'{violet}âme{/violet} est comparée à la capacité, et l'{yellow}éveil{/yellow} à son exercice :

    | Plan | La hache | L'œil | Le vivant |
    | l'exercice | l'action de couper | l'acte de voir | l'acte d'être éveillé |
    | la capacité | la puissance de l'outil | la vue | l'âme |
    | la réalité potentielle | l'outil comme matière | la pupille | le corps |

    **« La puissance de l'outil »** est {yellow}l'aptitude de la hache à couper{/yellow}, son tranchant, qui demeure quand elle ne coupe pas : {sky}Polansky{/sky} y voit une {violet}disposition fonctionnelle{/violet}, ce que la tradition nomme première actualité.

    **« Réalisation » se dit donc à deux niveaux**, et {amber}la même chose est acte ou puissance selon ce à quoi on la rapporte{/amber} : l'âme est {green}__réalisation du corps__{/green} et {green}__puissance des activités__{/green}. {coral}Vivre se dit donc de deux façons{/coral}, avoir la capacité et l'exercer ; c'est pourquoi {yellow}le dormeur{/yellow} vit.

    **Confrontation :** {sky}**Plotin**{/sky}**.** Contre l'âme-entéléchie, le traité 2 (IV, 7, chap. 8⁵) objecte qu'une âme collée au corps ne pourrait {teal}« faire retraite dans le sommeil »{/teal}, et qu'{red}« il n'y aura même plus de sommeil »{/red}. La répartition d'Aristote répond d'avance : {green}__dans le sommeil, rien ne se retire__{/green}, c'est l'exercice qui cesse et la capacité qui demeure. L'objection ne porte que si l'on tient le sommeil pour une absence de l'âme.

    **Portée sur la conduite de sa vie.** Être en vie n'est pas encore bien vivre. L'*Éthique à Eudème* compte le sommeil comme {teal}« une sorte d'inaction et un repos »{/teal} (II, 1, 1219a25), et s'en sert pour répondre à la question : {yellow}pourquoi les gens vertueux ne valent-ils pas mieux que les médiocres {teal}« pendant la moitié de leur vie »{/teal} ?{/yellow} Parce que {teal}« ils sont tous semblables dans le sommeil »{/teal} (1219b18-19). {coral}__La valeur d'une vie se joue dans l'exercice__{/coral}, que la seule capacité ne garantit pas.

    **Une limite de la comparaison.** {amber}L'éveil n'est pas le seul exercice{/amber} : {teal}« pendant le sommeil, la partie nutritive est plus active »{/teal} (1219b22-23). Le dormeur exerce donc une part de son âme.

    **Confrontation :** {sky}**Bichat**{/sky}**.** {teal}« L'ensemble des fonctions qui résistent à la mort »{/teal} définit aussi la vie par des fonctions, {red}non par une chose{/red}. Mais Bichat parle de {pink}fonctions exercées{/pink}, et par leur rapport à leur contraire ; Aristote, d'{green}une capacité{/green}, qui n'a pas besoin de la mort pour se définir.

    === 3 L'âme et le corps forment l'animal

    **Le mot « œil » a changé de sens, et c'est l'argument.** Plus haut {pink}l'œil{/pink} était {teal}« matière de la vue »{/teal} ; ici {green}l'œil{/green} est {teal}« la pupille et la vue »{/teal}, le composé. De même {violet}« corps »{/violet} désigne la matière, et {coral}__l'animal, le composé__{/coral}.

    C'est pourquoi {yellow}la pupille{/yellow} (`korê`) n'entre qu'ici : {sky}Polansky{/sky} et {sky}Shields{/sky} le notent, le mot « œil » étant réservé au composé, il faut un autre mot pour la matière.

    **Le texte revient à son point de départ :** si l'âme est au corps ce que la vue est à la pupille, {red}il n'y a pas deux choses à réunir{/red}, et l'on {teal}« n'a même pas besoin de chercher si le corps et l'âme font un »{/teal} (412b6). Il écarte en même temps le {pink}dualisme{/pink}, puisqu'{green}on ne voit pas sans pupille{/green}, et le {pink}matérialisme de la figure{/pink}, puisqu'{green}on ne voit pas avec une pupille de pierre{/green}.

    ! L'animal n'est pas l'âme se servant d'un corps : ce qui vit, sent et dort, c'est le composé, comme c'est l'œil qui voit, et non la pupille seule.
  passage:
    label: "412b25-413a3"
    text: "Par ailleurs, ce n'est pas lorsqu'il se trouve dépouillé de son âme que le corps a la puissance de vivre, mais lorsqu'il la possède. Quant à la semence ou au fruit, ils constituent potentiellement le corps de ce genre précis. Donc, si c'est à la manière de l'action de couper ou de voir que l'acte d'être éveillé constitue une réalisation, néanmoins, c'est à la vue ou à la puissance de l'outil que l'âme est comparable, tandis que le corps est la réalité potentielle. Mais, tout comme l'œil comprend la pupille et la vue, dans ce cas-là aussi, c'est l'âme et le corps qui forment l'animal."
