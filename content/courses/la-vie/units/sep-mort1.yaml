- id: sep-mort1-l5
  title: "Ce que nous sommes décide de quand nous mourons"
  notes: |-
    **Nous ne gardons aucune capacité si nous ne persistons pas.** Notre mort dépend donc de **ce que nous sommes** et des conditions de notre persistance, question disputée. Trois vues principales :
    - l'{violet}animalisme{/violet} : nous sommes des animaux humains (Snowdon, Olson), et persistons tant que nous restons le même animal ;
    - le {violet}personnisme{/violet} : nous sommes des créatures capables de conscience de soi, et notre persistance tient à nos traits psychologiques et à leurs relations (Locke, Parfit) ;
    - le {violet}mentalisme{/violet} : nous sommes des esprits (McMahan), et persistons tant que nous restons le même esprit.

    **Trois morts qui ne coïncident pas.**
    - Une **démence sévère** peut détruire beaucoup de traits psychologiques sans détruire l'esprit : {coral}mort pour le personniste, pas pour le mentaliste{/coral}.
    - L'animal humain survit parfois à la destruction de l'esprit : le cerveau meurt, mais non le tronc cérébral, et l'individu est en **état végétatif persistant** : {coral}mort pour le mentaliste, pas pour l'animaliste{/coral}.
    - À l'inverse, l'esprit pourrait survivre à l'animal, si un cerveau était maintenu en vie artificiellement et le reste du corps détruit.

    | Vue | Nous sommes | Exemple de divergence |
    | animalisme | des animaux humains | survit à l'état végétatif |
    | personnisme | des êtres conscients de soi | meurt dans la démence |
    | mentalisme | des esprits | meurt dans l'état végétatif |
