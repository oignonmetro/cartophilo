- id: sep-mort1-l6
  title: "Exister après sa mort, cesser d'exister sans mourir"
  notes: |-
    **Peut-on exister après sa mort ?** Feldman nomme {violet}thèse de la terminaison{/violet} l'idée que {teal}« quand une personne meurt, elle cesse d'exister ; il n'y a plus ensuite rien qui soit cette personne »{/teal}. On peut appeler {violet}terminateurs{/violet} ceux qui l'acceptent, et {violet}anti-terminateurs{/violet} ceux qui la rejettent.
    - Les anti-terminateurs (Feldman lui-même) font valoir qu'on appelle les cadavres des **animaux morts** ou des **personnes mortes** : un animal resterait le même animal tant qu'assez de ses composants demeurent dans le même ordre. Si nous sommes des animaux, nous pourrions survivre un temps comme cadavres, et indéfiniment en les faisant conserver.
    - Mais l'argument n'est pas décisif : {red}« personne morte » est ambigu{/red}. D'ordinaire, il désigne une personne qui a vécu : Socrate est une « personne morte », quoique son cadavre n'existe plus. À la morgue, il veut dire « restes de ce qui fut une personne ». Le débat ne se tranchera pas par l'usage : des raisons métaphysiques doivent peser (rien n'est une personne sans traits psychologiques, disent certains).

    **Peut-on cesser d'exister sans mourir ?** Les choses qui n'ont jamais vécu, bulles ou statues, sont anéanties sans mort. Mais aussi, peut-être, des vivants : {yellow}une amibe qui se divise en deux{/yellow}, des chlamydomonas qui fusionnent en un zygote cessent d'exister **sans que leurs activités vitales cessent**. Si de telles {violet}« sorties sans mort »{/violet} existent, la conception de la mort comme perte de la vie doit être modifiée.

    **La réponse des partisans de la perte de la vie.**
    - Division et fusion sont des **façons inhabituelles de mourir**, non des façons d'échapper à la mort.
    - Et l'on peut retourner l'objection : {green}__rien n'est vivant sans exister ; donc ce qui cesse d'exister cesse d'être vivant ; or cesser d'être vivant, c'est mourir. Il n'y a donc pas de sortie sans mort.__{/green}
  points:
