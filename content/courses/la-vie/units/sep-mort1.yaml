- id: sep-mort1-l3
  title: "Mourir : perdre une capacité"
  notes: |-
    **Les {violet}activités vitales{/violet}** sont les activités d'auto-modification, intégrées selon l'information que portent les constituants, par lesquelles un vivant maîtrise sa composition.

    **Avoir une capacité n'est pas l'exercer**, comme {yellow}pouvoir courir n'est pas courir{/yellow}. {green}__Être vivant, c'est avoir la capacité d'exercer des activités vitales ; mourir, c'est perdre cette capacité__{/green} : c'est la {violet}conception de la mort comme perte de la vie{/violet}.

    **« Mort » a deux sens** : l'**événement** par lequel la capacité se perd, et l'**état** où elle est perdue. Comme la capacité peut se perdre peu à peu, on parle d'un **processus** de mourir. Chez les organismes complexes, les activités vitales construisent des systèmes physiologiques qui doivent rester intacts : certains (Belshaw, DeGrazia) définissent alors la mort comme le moment où ces systèmes ne peuvent plus fonctionner comme un tout intégré, ou où cette perte devient irréversible.

    **L'objection de la vie suspendue.** Les embryons congelés pour la fécondation *in vitro*, les {yellow}tardigrades déshydratés{/yellow}, les graines et les spores ont des activités vitales arrêtées, ou presque. {coral}Ils ne sont pas morts, puisqu'on peut les relancer{/coral} (en réchauffant l'embryon, en mouillant le tardigrade). Mais sont-ils vivants ? Si l'on dit que non, la vie peut finir sans qu'il y ait mort, et la conception de la mort comme perte de la vie tombe.

    **La réponse : deux paires de termes.**
    - {violet}viable{/violet} / {violet}non viable{/violet} : avoir ou avoir perdu la *capacité* d'activités vitales ;
    - {violet}vital{/violet} / {violet}non vital{/violet} : *exercer* ou non cette capacité.

    Être mort, c'est être non viable : cela, peu le contestent. Pour garder la conception de la mort comme perte de la vie, il suffit d'ajouter qu'**être vivant, c'est être viable** : {green}l'embryon congelé est viable, donc vivant, quoique non vital{/green}. Qui abandonne cette conception dira plutôt qu'être vivant, c'est être viable *et* vital : l'embryon congelé n'est alors ni vivant ni mort.

    | Cas | viable | vital |
    | chien qui court | oui | oui |
    | embryon congelé | oui | non |
    | cadavre | non | non |
