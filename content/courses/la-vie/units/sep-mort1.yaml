- id: sep-mort1-l4
  title: "Être mort, et revenir de la mort"
  notes: |-
    **Être mort, un état ?** On parle de la mort comme d'un état où l'organisme entre en mourant. C'est déroutant si ce qui meurt cesse d'exister : {red}comment être dans un état quand on n'existe plus ?{/red} Dire que c'est le **cadavre** qui est mort ne marche pas : certains organismes n'en laissent pas, et les cadavres se décomposent ; or l'organisme mort au temps *t* reste mort après *t*.

    **La solution de Rosenberg : « mort » est une relation.** Dire à l'instant *t* « Socrate est mort », c'est dire à peu près que {green}Socrate est mort avant *t*{/green}. On ne prête alors aucun état à qui n'existe plus. Ceux qui tiennent que l'organisme et son cadavre sont deux objets diront que « mort » est **ambigu** : il ne veut pas dire la même chose de l'organisme et du cadavre, qui, lui, n'a jamais vécu.

    **Raviver n'est pas restaurer.** Un être congelé est {violet}ravivé{/violet} quand il retrouve sa vitalité : il était vivant, car viable. Une vie est {violet}restaurée{/violet} quand on retrouve une capacité **perdue** : c'est revenir de la mort.
    - Le {yellow}« Désassembleur-Réassembleur »{/yellow} me découpe en atomes, les stocke, puis me réassemble à l'identique. Même si j'existais de nouveau après, je ne vivrais pas, je n'existerais même pas, pendant le stockage : ma vie serait **restaurée**, non ravivée.
    - Le {yellow}« Réanimateur de cadavres »{/yellow} replace les molécules d'un cadavre et relance ses activités vitales. Pour qui pense que je continue d'exister comme cadavre, il me rend ma vie.

    **La définition affinée.** {green}« Mourir, c'est la perte de la vie d'un objet, la perte de sa capacité de se perpétuer par des activités vitales. Un objet meurt au moment où il perd cette capacité. Il est mort à tous les moments qui suivent, sauf tant que cette capacité est retrouvée. »{/green}
