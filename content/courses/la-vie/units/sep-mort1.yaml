- id: sep-mort1-l7
  title: "Critères de la mort, et sens de la mortalité"
  notes: |-
    **Définir la mort n'est pas en donner un critère.** Une {violet}définition{/violet} dit ce qu'est la mort : quand elle est remplie, il y a nécessairement mort. Un {violet}critère{/violet} donne des conditions par lesquelles toutes les morts réelles, et elles seules, se reconnaissent facilement : il ne définit pas, mais sert aux médecins et aux juristes.

    **Deux critères en vigueur.**
    - Aux **États-Unis**, l'« Uniform Determination of Death Act » (1981) : est mort l'individu qui a subi {teal}« soit (1) l'arrêt irréversible des fonctions circulatoires et respiratoires, soit (2) l'arrêt irréversible de toutes les fonctions du cerveau entier, y compris le tronc cérébral »{/teal}.
    - Au **Royaume-Uni** : la **mort du tronc cérébral**, {teal}« mort fonctionnelle permanente du tronc cérébral »{/teal}.

    **Ces critères sont critiqués des deux côtés.** Les {pink}animalistes{/pink} : les activités vitales d'un être dont le cerveau entier a cessé de fonctionner peuvent être entretenues artificiellement, l'animal vit donc encore. Les {pink}mentalistes et personnistes{/pink} : esprit et traits psychologiques peuvent être détruits alors que le tronc cérébral est intact ; la mort du cerveau laisse un être sans esprit ni conscience de soi.

    **Que veut dire « mortel » ?** Trois idées :
    - est mortel ce dont la vie **finira** ;
    - ce dont la vie **peut** finir ;
    - ce dont la vie **doit** finir.

    Les deux dernières captent mal la distinction. Selon la deuxième, {red}un être qui ne meurt jamais serait mortel{/red}, s'il *pouvait* mourir ({yellow}en mangeant un certain cactus du Texas{/yellow}). Selon la troisième, {red}un être qui finit par mourir serait immortel{/red}, s'il n'aurait pas *dû* mourir sans ce cactus. Les combiner (mortel si sa vie doit finir, immortel si elle ne peut finir) laisse sans statut ce qui peut mais ne doit pas mourir. D'où le choix : {green}__est mortel ce dont la vie finira__{/green}. Ce qui n'a jamais vécu n'est ni mortel ni immortel.
  points:
  - id: sep-mort1-l7-p1
    sentence: "Une ___ de la mort dit ce qu'est la mort ; un critère donne des conditions par lesquelles les morts réelles se reconnaissent facilement."
