# Cours sur la mort (voir content/philosophie.md), tiré de l'article
# « Death » de Steven Luper, Stanford Encyclopedia of Philosophy (première
# publication 2002, révision substantielle 2026) : introduction, sections 1
# (« Life ») et 2 (« Death »). Citations traduites de l'anglais.

id: sep-mort1
title: "Ce qu'est mourir"
subtitle: "La vie comme maîtrise de sa composition ; la mort comme perte de cette capacité"
icon: clock
color: blue
group: "La mort (SEP)"
lessons:
- id: sep-mort1-l1
  title: "La vie : ni substance, ni simple événement"
  notes: |-
    **Mourir, c'est à peu près cesser d'être en vie** : pour dire ce qu'est la mort, il faut d'abord dire ce qu'est la vie. L'article parcourt huit questions : la vie, la mort, la thèse selon laquelle la mort peut nuire à qui meurt et l'objection d'Épicure, le moment de ce préjudice, d'autres doutes (la privation, l'argument de symétrie), le préjudice posthume, le désir de ne jamais mourir (Nagel contre Williams), et la possibilité de rendre la mort moins nuisible.

    **Trois façons de concevoir la vie** : une substance, un événement, une propriété.

    **La vie comme substance : le vitalisme.** Le {violet}vitalisme{/violet} (Hans **Driesch**) tient qu'être vivant, c'est contenir une substance spéciale, « la vie ». C'est {red}une position sans avenir{/red} : on ne voit pas quelle sorte de matière ce serait, et l'on n'a trouvé aucune substance présente dans tous les vivants et en eux seuls. S'y ajoute le {yellow}« problème de Jonas »{/yellow} (Fred **Feldman**) : une chose morte, une baleine, peut contenir un vivant, Jonas ; si Jonas contient de « la vie », la baleine aussi, et pourtant elle n'est pas vivante. Dire que la vie doit être *dans les cellules* ne suffit pas : des agents infectieux peuvent survivre un temps dans les cellules mortes d'une baleine morte.

    **La vie comme événement.**
    - Pour Jay **Rosenberg**, « une vie » désigne parfois les événements qui font l'**histoire** d'une chose (la publication des *Problèmes de philosophie* fait partie de la vie de Russell). Mais {red}un rocher et un cadavre ont une histoire, et pas de vie{/red} : « une vie » est donc l'histoire de quelque chose de *vivant*, et c'est la propriété d'être vivant qu'il faut éclaircir.
    - Pour Peter **van Inwagen**, une vie est un événement, mais **purement biologique** : {teal}« un événement qui s'est déroulé entièrement sous la peau de Russell, et qui a duré quatre-vingt-dix-sept ans »{/teal}, comprenant l'oxygénation de son hémoglobine, non la publication de ses livres. Cet événement est constitué par certaines activités auto-organisatrices de molécules, comme {yellow}un défilé{/yellow} par les activités de marche de certaines personnes. Des choses composent un organisme si et seulement si leur activité constitue une vie.

    ! Van Inwagen prend la notion de vie pour acquise, sans dire comment individuer ces événements : c'est la limite de sa conception.
