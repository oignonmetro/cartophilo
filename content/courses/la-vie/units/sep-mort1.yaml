- id: sep-mort1-l2
  title: "La vie comme propriété : la conception compositionnelle"
  notes: |-
    **Si la vie est une propriété, laquelle ?** Deux familles de réponses dominent.

    **Le fonctionnalisme de la vie**, introduit par **Aristote**, analyse la vie par une ou plusieurs fonctions que les vivants peuvent typiquement accomplir : nutrition, reproduction, sensation, mouvement autonome, pensée. Mais {red}il serait absurde d'exiger toutes ces fonctions{/red}, et les fonctionnalistes ne s'accordent pas sur celles qui comptent.

    **La vie par l'information génétique ou l'évolution.**
    - Définir la vie par l'ADN fait retomber dans le problème de Jonas : {red}les organismes morts contiennent de l'ADN{/red} ; et une vie extraterrestre pourrait ne pas reposer sur l'information génétique.
    - Définir la vie par la capacité d'**évolution darwinienne** évite ce second défaut, mais en crée un autre : {red}__l'évolution par sélection naturelle est une capacité des espèces, non des individus__{/red}. Un chien particulier ne peut subir ce processus, et pourtant il est vivant.

    Feldman en conclut que {teal}« la vie est un mystère »{/teal}.

    **La conception compositionnelle.** Luper défend pourtant ceci : {green}__un vivant a une maîtrise propre de ce qui le compose, que n'ont pas les choses non vivantes__{/green}. Ce qui compose une **voiture** est fixé *pour elle*, par le mécanicien qui change des pièces ou par l'accident qui lui en arrache. {yellow}Imaginons une voiture dont les pièces se remplaceraient elles-mêmes par des pièces neuves, sans aide extérieure : elle serait très semblable à un vivant.{/yellow} Les molécules d'un vivant peuvent :
    - agir de façon **intégrée**, conformément à l'**information** que portent certaines d'entre elles, comme des soldats suivent les plans de leurs officiers ;
    - **se modifier elles-mêmes** : s'adjoindre de nouvelles molécules, en élaguer, construire des cellules, en puisant l'énergie au-dehors ou dans des réserves ;
    - **transmettre** cette capacité aux molécules qui leur succèdent, si bien que l'objet garde une forme (celle d'un chien) alors que ce qui le compose change.

    {coral}Un objet est vivant si et seulement s'il est composé de choses capables de ces activités.{/coral}

    **Ce que cette conception permet.** Un vivant peut être {coral}stérile{/coral} (la mule), vivre sur ses réserves (le bombyx), voire manquer d'acides nucléiques. Aucune fonction de la liste d'Aristote n'est nécessaire ni suffisante. La vie est une propriété qu'un **individu** peut avoir seul (le dernier dodo), sans pouvoir évoluer ; et pourtant la conception explique comment des collections d'individus évoluent : l'information qui gouverne la composition se modifie avec le temps, par des mutations.
  points:
