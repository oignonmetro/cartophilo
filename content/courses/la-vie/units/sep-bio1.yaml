- id: sep-bio1-l2
  title: "L'émergence du champ"
  notes: |-
    **Le champ naît de la rencontre de biologistes et de philosophes, et il s'installe en une dizaine d'années.** Il a fallu que les biologistes appellent les philosophes, et que ceux-ci aillent apprendre la biologie.

    **Deux facteurs.**
    - **L'encouragement de biologistes éminents** : {violet}Mayr{/violet} et {violet}F. J. Ayala{/violet}, qui défend la biologie comme science autonome (Ayala 1976, Mayr 1982).
    - **La formation sur place** : plusieurs philosophes des sciences (Robert Brandon, Philip Kitcher, Elisabeth Lloyd, Sahotra Sarkar, Elliott Sober, William Wimsatt) font de la recherche à {sky}Harvard{/sky} auprès de {violet}Stephen Jay Gould, Richard Lewontin et Richard Levins{/violet}. C'est ce qui explique le ton du champ : ces philosophes connaissent la science de l'intérieur.

    **La date d'entrée dans le courant principal : 1974.** {violet}David Hull{/violet} publie *Philosophy of Biological Science* dans une collection en vue, les Foundations of Philosophy de Prentice-Hall : {coral}la philosophie de la biologie devient une partie reconnue de la philosophie des sciences{/coral}.

    **La croissance se mesure à une boutade.** Robert Brandon peut dire de la fin des années 1970 : {teal}« Je connaissais cinq philosophes de la biologie : Marjorie Grene, David Hull, Michael Ruse, Mary Williams et William Wimsatt. »{/teal} Or dès **1986**, ils sont assez nombreux pour remplir la nouvelle revue de {violet}Michael Ruse{/violet}, *Biology and Philosophy*, que d'autres rejoindront (*Biological Theory* ; *Philosophy, Theory, and Practice of Biology* ; *History and Philosophy of the Life Sciences*).
