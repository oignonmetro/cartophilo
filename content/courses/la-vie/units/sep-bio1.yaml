    answer: "populations"
    alt: []
- id: sep-bio1-l7
  title: "Des concepts à la société"
  notes: |-
    **« Problème conceptuel » s'entend très largement, et c'est ce qui fait l'originalité du champ : la philosophie s'y fond dans la biologie.**

    **Elle se confond avec la biologie théorique.** Le travail conceptuel des philosophes de la biologie {coral}se fond souvent sans couture dans la {violet}biologie théorique{/violet}{/coral}. Il les conduit à examiner les chaînes d'arguments des biologistes, donc à **entrer directement dans des débats biologiques en cours**. Ainsi du {violet}concept d'espèce{/violet} : que sont les espèces, si elles existent ? Y a-t-il un seul concept d'espèce ou plusieurs ? Philosophes et biologistes y travaillent côte à côte.

    **Une circulation dans les deux sens.** Même le premier type de travail (éprouver une thèse générale sur des exemples biologiques) revient parfois vers la biologie sous forme de recommandations pour améliorer sa méthode. {green}__Trait frappant : les philosophes publient souvent dans des revues de biologie, et les biologistes dans des revues de philosophie de la biologie.__{/green}

    **Un rôle de médiateur entre biologie et société.** Les représentations populaires de la biologie tirent de grandes leçons de vastes ensembles de résultats expérimentaux et de travaux théoriques. Or, entre le résultat de laboratoire et la leçon sur l'homme, il y a une interprétation, et {coral}évaluer ces interprétations est une tâche toute désignée pour le philosophe des sciences{/coral}. Deux exemples majeurs où il a apporté beaucoup de clarté :
    - {sky}le créationnisme et le dessein intelligent{/sky} (Kitcher 1982, Ruse 1982, Pennock 2000, Sober 2007) ;
    - {sky}la sociobiologie et la psychologie évolutionniste{/sky} (Kitcher 1985, Buller 2006, Richardson 2010).
  points:
  - id: sep-bio1-l7-p1
    sentence: "Le travail conceptuel des philosophes de la biologie se fond souvent sans couture dans la biologie ___, si bien qu'ils entrent directement dans des débats biologiques en cours."
    answer: "théorique"
