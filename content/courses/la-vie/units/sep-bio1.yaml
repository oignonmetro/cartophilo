- id: sep-bio1-l8
  title: "Troisième type : la fonction biologique"
  notes: |-
    **La troisième forme de philosophie de la biologie part d'une question plus large et demande à la biologie son appui.** Son cas d'école est la {violet}téléologie biologique{/violet} : le cœur est *pour* pomper le sang, mais comment une science sans finalité peut-elle dire « pour » ?

    **Une affaire réglée pour les biologistes.** Après la {sky}« synthèse moderne »{/sky}, un bref regain d'intérêt introduit le terme de {violet}téléonomie{/violet} (Pittendrigh 1958) pour désigner l'interprétation proprement évolutionniste du langage téléologique. Dès lors, les idées de fonction et d'orientation vers un but passent pour relativement peu problématiques aux yeux des biologistes de l'évolution.

    **Les philosophes la rouvrent pour une autre raison.** Dans les années 1970, ils se tournent vers la biologie pour donner une base solide, scientifique, à des {violet}concepts normatifs{/violet} : la **maladie**, le **trouble**, le **dysfonctionnement** (Wimsatt 1972, Wright 1973, Boorse 1976). L'enjeu : dire qu'un organe fonctionne *mal*, c'est porter une norme ; d'où vient-elle, si la nature n'en a pas ?

    **La théorie des effets sélectionnés.** Le débat aboutit à une analyse au fond semblable à la vue associée à la synthèse moderne (Millikan 1984, Neander 1991, Godfrey-Smith 1994). {green}__Selon la théorie des {violet}effets sélectionnés{/violet}, les fonctions d'un trait sont les activités en vertu desquelles ce trait a été sélectionné.__{/green} Le cœur fait du bruit et pompe le sang (exemple familier), mais il a été retenu parce qu'il pompe : pomper est sa fonction, le bruit un simple effet. On comprend alors le dysfonctionnement : {coral}un cœur malade qui ne pompe plus a encore pour fonction de pomper{/coral}, puisque la fonction se fixe par l'histoire, non par l'état présent.

    **Un outil pour toute la philosophie.** L'idée de {violet}fonction propre{/violet} entre dans la boîte à outils de la philosophie en général, de la philosophie du langage et de la philosophie de l'esprit (Dretske, Millikan, Papineau, Neander).

    ! La fonction au sens des effets sélectionnés n'est pas un dessein : aucune intention n'y est supposée, seulement une histoire causale de sélection.
