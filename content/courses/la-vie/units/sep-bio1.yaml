    answer: "Andromède"
    alt: []
  - id: sep-bio1-l5-p5
    sentence: "Smart, sur la fitness : « supposons que nous disions que même dans Andromède \"les plus aptes survivront\" : nous ne disons rien, car \"les plus aptes\" doit se définir en termes de \"___\" »."
    answer: "survie"
    alt: []
  - id: sep-bio1-l5-p6
