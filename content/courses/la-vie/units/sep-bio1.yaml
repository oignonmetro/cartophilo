- id: sep-bio1-l5
  title: "Deuxième grand débat : le problème de la tautologie"
  notes: |-
    **Un concept au cœur de la théorie de l'évolution, et pourtant suspect : la {violet}fitness{/violet} (aptitude, ou valeur sélective), le succès reproductif.** Ici le problème vient de la biologie elle-même, et la philosophie travaille à le résoudre.

    **L'objection.** Smart la formule en 1959 : {teal}« Si nous essayons de faire des lois de l'évolution au sens strict, nous semblons nous réduire à des tautologies. Ainsi, supposons que nous disions que même dans Andromède "les plus aptes survivront" : nous ne disons rien, car "les plus aptes" doit se définir en termes de "survie". »{/teal} Le raisonnement : si les plus aptes sont **par définition** ceux qui survivent et se reproduisent, alors « les plus aptes survivent » revient à dire « ceux qui survivent survivent ». {red}__La proposition centrale du darwinisme ne dirait plus rien du monde.__{/red} On l'appelle le {violet}problème de la tautologie{/violet}.

    **Une première réponse : assumer le statut de terme primitif.** {violet}Alexander Rosenberg et Mary B. Williams{/violet} soutiennent que la fitness est un {violet}terme primitif irréductible{/violet}, qui tire son sens de sa place dans une {violet}formulation axiomatique{/violet} de la théorie de l'évolution. Si c'est juste, le problème est dissous : on tient souvent les axiomes pour tautologiques, ou du moins leurs termes pour indéfinissables. De même que la « force » n'a pas à se définir hors de la mécanique, la fitness n'a pas à se définir hors de la théorie.

    ! La tautologie n'est pas une objection venue des créationnistes : c'est une difficulté interne, que les biologistes eux-mêmes ont eu du mal à écarter.
  points:
  - id: sep-bio1-l5-p1
    sentence: "Si les plus aptes sont par définition ceux qui survivent, alors « les plus aptes survivent » ne dit rien : c'est le problème de la ___."
    answer: "tautologie"
    alt: []
  - id: sep-bio1-l5-p2
    sentence: "L'objection de la tautologie contre la théorie de l'évolution porte sur le concept de ___ reproductive."
    answer: "fitness"
    alt: ["aptitude", "valeur sélective"]
  - id: sep-bio1-l5-p3
