- id: sep-bio1-l4
  title: "Premier grand débat : réduire la génétique de Mendel ?"
  notes: |-
    **Le premier grand débat du champ prend la génétique comme terrain d'essai pour une thèse générale : les sciences se réduisent-elles les unes aux autres ?** La question n'est pas de savoir si les gènes sont faits de molécules, ce que personne ne conteste, mais si la théorie du gène se laisse **déduire** de la chimie.

    **Schaffner applique le modèle classique.** {violet}Kenneth Schaffner{/violet} (1967, 1969) transporte le {violet}modèle de la réduction de théories{/violet} de l'{sky}empirisme logique{/sky} à la relation entre {pink}génétique mendélienne (classique){/pink} et {green}génétique moléculaire{/green}. Dans ce modèle, réduire une théorie, c'est en dériver les lois d'une théorie plus fondamentale.

    **Hull en tire la leçon inverse.** {violet}David Hull{/violet} (1974, 1975) soutient que {red}__la génétique mendélienne est irréductible à la génétique moléculaire__{/red}. La raison, chez Hull : un même type de gène mendélien peut se réaliser par des mécanismes moléculaires différents, et un même mécanisme produire des effets mendéliens différents. Les catégories des deux théories ne se correspondent donc pas terme à terme, et il n'y a rien à déduire proprement.

    **Un consensus, puis son embarras.** Ce débat conforte le quasi-consensus des années 1970 et 1980 : les {violet}sciences spéciales{/violet} sont **autonomes** par rapport aux sciences plus fondamentales (Fodor 1974, Kitcher 1984). Mais une conclusion semble absurde : {red}dire que la révolution moléculaire en biologie n'est pas un cas réussi de réduction{/red}, alors qu'elle est l'exemple même d'une explication par le niveau inférieur. Dilemme : ou bien la révolution moléculaire n'est pas une réduction, ou bien le modèle est mauvais. {coral}__On a donc changé le modèle__{/coral} : on formule des modèles de la réduction de plus en plus adéquats (Wimsatt, Schaffner 1993, Waters, Rosenberg, Sarkar).

    ! Être antiréductionniste, ici, ne veut pas dire croire à une force vitale : c'est une thèse sur le rapport entre deux **théories**, non sur ce dont le vivant est fait.
  points:
  - id: sep-bio1-l4-p1
    sentence: "Kenneth ___ (1967, 1969) applique le modèle de la réduction de théories de l'empirisme logique à la relation entre génétique mendélienne et génétique moléculaire."
    answer: "Schaffner"
    alt: []
  - id: sep-bio1-l4-p2
    sentence: "Schaffner applique à la génétique le modèle de la réduction de théories issu de l'empirisme ___, où réduire, c'est dériver les lois d'une théorie d'une théorie plus fondamentale."
    answer: "logique"
    alt: []
  - id: sep-bio1-l4-p3
    sentence: "Contre Schaffner, David ___ (1974, 1975) soutient que la génétique mendélienne est irréductible à la génétique moléculaire."
    answer: "Hull"
    alt: []
  - id: sep-bio1-l4-p4
    sentence: "Hull tire de la tentative de Schaffner la leçon que la génétique ___ est irréductible à la génétique moléculaire."
    answer: "mendélienne"
    alt: ["classique"]
  - id: sep-bio1-l4-p5
    sentence: "Un même type de gène mendélien peut se réaliser par des mécanismes moléculaires différents, et un même mécanisme produire des effets mendéliens différents : les catégories des deux théories ne se correspondent donc pas terme à terme, et il n'y a rien à ___ proprement."
    answer: "déduire"
    alt: ["dériver"]
  - id: sep-bio1-l4-p6
    sentence: "Le débat sur la génétique conforte le quasi-consensus des années 1970 et 1980 : les sciences ___ sont autonomes par rapport aux sciences plus fondamentales (Fodor 1974, Kitcher 1984)."
    answer: "spéciales"
    alt: []
  - id: sep-bio1-l4-p7
    sentence: "Il paraît absurde de nier que la révolution ___ en biologie soit un cas réussi de réduction : c'est pourquoi on a formulé des modèles de la réduction plus adéquats."
    answer: "moléculaire"
