- id: sep-bio1-l6
  title: "La fitness comme propension"
  notes: |-
    **La nouvelle génération de philosophes de la biologie résout autrement le problème de la tautologie, en deux temps.** Elle ne fait plus de la fitness un terme indéfini : elle en dit la nature.

    **Une propriété survenante.** La fitness est une {violet}propriété survenante{/violet} des organismes (Rosenberg 1978) : celle d'un organisme donné dépend nécessairement d'un certain ensemble de ses caractères physiques et de son environnement particulier, mais {green}__deux organismes de même fitness peuvent l'avoir en vertu de caractères physiques très différents__{/green}. Une gazelle rapide et un papillon camouflé peuvent être également aptes (exemple familier) : il n'y a pas de trait physique qui soit « la fitness ». Elle est fixée par le bas, sans s'y ramener.

    **Une propension.** Cette propriété survenante est une {violet}propension{/violet} : une disposition probabiliste, représentée par une {violet}distribution de probabilité sur les nombres possibles de descendants{/violet} (Mills et Beatty 1979).

    **Pourquoi la tautologie disparaît.** La fitness se définit certes par le succès reproductif, mais par le succès **attendu**, non par le succès **réalisé**. Il n'est donc pas plus tautologique que les plus aptes aient le plus de descendants {yellow}qu'il n'est tautologique que des dés donnent des nombres pairs plus souvent que des six{/yellow}. Dans les deux cas :
    - la propension permet une **prédiction faillible** : le dé peut sortir trois six de suite ;
    - la prédiction devient **plus fiable à mesure que l'échantillon grandit**.

    Prenons deux jumeaux identiques, dont l'un est foudroyé avant d'avoir des enfants (exemple familier) : ils ont eu la même fitness et des descendances différentes. {coral}« Le plus apte a plus de descendants » est donc une proposition qui peut être fausse, c'est-à-dire qui dit quelque chose.{/coral}

    **La difficulté restante.** On ne sait pas encore si une distribution de probabilité, ou un ensemble de distributions, peut jouer {red}tous les rôles que tient effectivement la fitness en biologie des populations{/red} (Beatty et Finsen 1989, Sober 2001, Ariew et Ernst 2009, Pence et Ramsey).

    ! La propension ne dit pas ce qui arrivera à cet individu : elle n'autorise aucune prédiction certaine, seulement une attente qui se vérifie sur de grands nombres.
  points:
  - id: sep-bio1-l6-p1
    sentence: "Premier temps de la solution au problème de la tautologie : la fitness est une propriété ___ des organismes, dépendant de leurs caractères physiques et de leur environnement sans s'y ramener (Rosenberg 1978)."
    answer: "survenante"
    alt: []
  - id: sep-bio1-l6-p2
