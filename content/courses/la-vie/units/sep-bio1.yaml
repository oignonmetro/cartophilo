- id: sep-bio1-l3
  title: "Trois sortes de philosophie de la biologie"
  notes: |-
    **Sous un même titre, trois enquêtes de nature différente.** La distinction sert de fil à tout ce cours : devant chaque débat, on peut demander à laquelle des trois il appartient, et ce que la philosophie y apporte.

    | Type | Ce qu'on y fait | Exemple |
    | thèses générales | éprouver sur la biologie une thèse de philosophie des sciences | la réduction |
    | problèmes conceptuels | analyser un concept de la biologie même | la fitness |
    | questions traditionnelles | invoquer la biologie en éthique, en épistémologie | la fonction |

    **La biologie sert d'épreuve, d'objet, ou d'argument.** Dans le premier type, elle met à l'épreuve une thèse générale sur la science. Dans le deuxième, elle pose elle-même le problème, et le philosophe travaille au même étage que le biologiste théoricien. Dans le troisième, le philosophe part d'une question plus large et demande à la biologie un appui.

    **On peut aussi découper selon les disciplines.** La biologie est un ensemble très divers, qui va de {sky}sciences historiques comme la paléontologie{/sky} à {sky}des sciences de l'ingénieur comme la biotechnologie{/sky}, et chacune pose ses questions propres : évolution, systématique, biologie moléculaire, développement, écologie. Ce second découpage ordonne la suite du cours.

    ! Les trois types ne s'excluent pas : le premier, parti d'une question générale, revient parfois vers la biologie sous forme de recommandations de méthode.
