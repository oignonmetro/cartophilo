- id: sep-bio1-l1
  title: "Une préhistoire : la biologie vue depuis la physique"
  notes: |-
    **Avant d'être une discipline, la philosophie de la biologie a une préhistoire, faite de travaux sans postérité et d'un soupçon : la biologie serait-elle une vraie science ?** Comprendre ce soupçon, c'est comprendre contre quoi le champ s'est constitué.

    **Des livres isolés.** Dans les années 1950, le biologiste {violet}J. H. Woodger{/violet} (1952) et le philosophe {violet}Morton Beckner{/violet} (1959) publient des ouvrages majeurs. {red}Ils ne suscitent pas de littérature philosophique à leur suite{/red} : il y a des œuvres, pas encore de champ.

    **Le défi de Smart : la biologie n'a pas de lois propres.** Pour {violet}J. J. C. Smart{/violet} (1959), la biologie n'est pas une science autonome, mais l'application technologique de sciences plus fondamentales, à la manière de l'{yellow}« ingénierie radio »{/yellow}. L'image se comprend ainsi : qui construit un poste de radio ne découvre aucune loi nouvelle de la nature, il exploite celles de la physique dans un montage particulier. {red}__De même, la biologie n'ajoute rien aux lois de la nature__{/red} : elle montre seulement comment les lois de la physique et de la chimie jouent sous certaines {violet}conditions initiales et aux limites{/violet}, celles qui se trouvent réalisées sur notre planète.

    **La philosophie des sciences n'est alors, en fait, que celle de la physique.** En 1969 encore, le zoologiste {violet}Ernst Mayr{/violet} peut se plaindre que les livres qui portent « philosophie des sciences » dans leur titre trompent leur lecteur : il faudrait les rebaptiser {teal}« philosophie de la physique »{/teal}.

    ! Tout n'était pas silence : {violet}Hempel{/violet} (1965) et {violet}Nagel{/violet} (1961) proposent déjà des analyses de l'**explication téléologique** en biologie. Mais c'est un cas traité depuis une théorie générale de l'explication, non une enquête née de la biologie.
