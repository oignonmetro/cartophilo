- id: sep-bio1-l9
  title: "L'évolution contre la morale ?"
  notes: |-
    **Autre appel à la biologie sur une question traditionnelle : la théorie de l'évolution discréditerait certaines conceptions de la morale.** Le terme anglais est {violet}debunking{/violet} : démystifier une croyance en montrant d'où elle vient.

    **L'argument.** {green}__La valeur adaptative de nos croyances éthiques, ou des capacités d'en former, ne suit pas leur vérité morale objective__{/green} (Joyce 2006, Street 2006, Griffiths et Wilkins 2015). Autrement dit : la sélection retient ce qui fait laisser des descendants, non ce qui est vrai. Croire qu'il faut protéger ses enfants aurait été favorisé par la sélection, qu'il existe ou non une vérité morale en ce sens (exemple familier). Dès lors, {red}l'origine de nos convictions ne nous donne aucune raison de penser qu'elles atteignent une telle vérité{/red}.

    ! L'argument vise des **conceptions** de la morale (celles qui supposent une vérité morale objective), non les jugements moraux eux-mêmes : il ne conclut pas que tout est permis.
  points:
  - id: sep-bio1-l9-p1
    sentence: "Selon certains philosophes moraux, la théorie de l'évolution discrédite (en anglais, ___) certaines conceptions de la morale."
    answer: "debunks"
    alt: ["debunk", "debunking"]
  - id: sep-bio1-l9-p2
    sentence: "La sélection retient ce qui fait laisser des descendants, non ce qui est vrai : la valeur adaptative de nos croyances éthiques ne suit donc pas leur ___ morale objective."
    answer: "vérité"
    alt: []
