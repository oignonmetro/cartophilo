- id: platon-phedon-causes-l7
  title: "Les contraires s'excluent : la grandeur en nous (102a-103c)"
  notes: |-
    Le dernier argument commence par un principe : {green}__un contraire ne reçoit jamais son contraire__{/green}. Quand le contraire s'approche, il se retire ou il périt.

    **Simmias grand et petit.** Simmias est plus grand que Socrate et plus petit que Phédon : il y a donc en lui grandeur et petitesse. Mais ce n'est pas parce qu'il est Simmias qu'il dépasse Socrate : c'est par {teal}« la grandeur qui se trouve être la sienne »{/teal} (102c) relativement à la petitesse de Socrate. Un même sujet peut recevoir deux contraires, parce qu'aucun ne lui est essentiel. Socrate s'amuse de ces formules : il a l'air de {yellow}« rédiger un contrat »{/yellow} (102d).

    **La grandeur en nous ne devient pas petite.** Non seulement {violet}la grandeur en soi{/violet} ne consent jamais à être à la fois grande et petite, mais {violet}la grandeur qui est en nous{/violet} non plus : {coral}« jamais elle n'accueille en elle le petit »{/coral} (102d). À l'approche de la petitesse, {amber}« ou bien elle s'enfuit et se retire quand s'avance sur elle son contraire, le petit, ou bien, du fait de l'arrivée de ce contraire, elle périt complètement »{/amber} (102d-e). Socrate, lui, peut recevoir la petitesse et rester Socrate ; mais la grandeur qui est en lui n'a pas {teal}« l'audace, étant grande, d'être petite »{/teal} (102e). Il en va de même de tout contraire.

    ? **La grandeur en nous** : la présence en une chose de la Forme à laquelle elle participe ; ce n'est pas une troisième réalité entre la chose et la Forme.

    **L'objection de l'auditeur.** Quelqu'un, dont Phédon ne se rappelle pas le nom, objecte : n'avait-on pas dit que les contraires naissent des contraires (70c-72e) ? Socrate distingue : on parlait alors {pink}des choses qui ont des propriétés contraires{/pink} (le sujet passe du petit au grand) ; on parle maintenant {green}des contraires eux-mêmes{/green}, qui ne deviennent jamais leur contraire. Le sujet change ; la propriété, elle, ne change pas en son contraire : elle cède la place. La prémisse implicite qui rend l'argument contraignant : **une propriété est ce qu'elle est**, et ne peut devenir son contraire sans cesser d'être elle-même.

    ! Les deux formules ne se contredisent pas : les choses deviennent leur contraire, les contraires eux-mêmes jamais.
    ! La grandeur en nous n'est pas une troisième réalité entre Simmias et la grandeur en soi : elle est la présence en lui de la Forme.
