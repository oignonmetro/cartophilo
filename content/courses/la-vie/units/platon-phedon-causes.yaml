- id: platon-phedon-causes-l8
  title: "Ce qui apporte un contraire : la neige, le feu, le trois (103c-105c)"
  notes: |-
    Socrate étend le principe à des choses qui ne sont pas des contraires, mais qui **apportent toujours un contraire**. C'est cette extension qui permettra de l'appliquer à l'âme.

    **La neige et le feu.** Le chaud n'est pas le feu, le froid n'est pas la neige. Pourtant, {yellow}la neige{/yellow}, tant qu'elle est neige, ne recevra jamais le chaud : à son approche, {coral}elle se retirera ou périra{/coral}, elle ne restera pas de la neige chaude. De même {yellow}le feu{/yellow}, à l'approche du froid, se dérobe ou s'éteint. Il y a donc des choses qui, sans être la Forme, possèdent toujours son caractère.

    **Le trois et l'impair.** {yellow}Le trois{/yellow} n'est pas l'impair, mais il est toujours impair : il {teal}« préférerait périr et subir n'importe quoi plutôt que de rester là, et, tout en restant trois, de devenir pair »{/teal} (104c). Or le deux n'est pas le contraire du trois. Ce ne sont donc pas seulement les contraires qui s'excluent, mais aussi ce qui **porte** toujours l'un d'eux.

    **La règle générale.** Certaines Formes obligent ce dont elles s'emparent à avoir non seulement leur caractère propre, mais toujours aussi celui d'un contraire. {amber}« Ce n'est pas seulement le contraire qui ne peut recevoir son contraire, mais il y a aussi le cas de ce qui apporte un contraire déterminé »{/amber} (105a) : celui-là n'admettra jamais le contraire de ce qu'il apporte. Le cinq n'admet pas le pair, le dix n'admet pas l'impair.

    **La réponse plus raffinée.** D'où une nouvelle manière de répondre, aussi sûre que la première mais plus fine. À la question {teal}« Qu'est-ce qui, en entrant dans une chose, [...] la rendra chaude ? »{/teal} (105b), on ne répondra plus naïvement {pink}« c'est la chaleur »{/pink} (105c), mais {green}« c'est le feu »{/green} ; ce qui rend un corps malade, ce sont {green}« les fièvres »{/green} ; ce qui rend un nombre impair, {green}« la monade »{/green}. On désigne ainsi l'intermédiaire qui apporte la Forme, et dont il faut une connaissance (de physicien, de médecin, de mathématicien).

    ! Ce qui apporte un contraire n'est pas lui-même ce contraire : la fièvre rend malade sans être malade, la monade rend impair sans être un nombre impair.
    ! La réponse raffinée ne remplace pas la participation : elle y ajoute le terme qui apporte la Forme.
