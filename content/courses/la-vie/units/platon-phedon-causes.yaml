- id: platon-phedon-causes-l5
  title: "La seconde navigation : se réfugier dans les raisonnements (99c-100c)"
  notes: |-
    Faute d'avoir trouvé ou appris la cause par le meilleur, Socrate change de route : c'est la **seconde navigation**. Il ne regarde plus les choses en face, il les examine {green}__dans les raisonnements__{/green}, en posant les Formes comme causes.

    ? **Seconde navigation** (*deuteros plous*) : chez les marins, le recours aux rames quand le vent tombe ; chez Socrate, le recours aux raisonnements pour chercher la cause.

    **Pourquoi « seconde navigation » : deux lectures.** L'expression vient des marins : quand le vent tombe, on prend les rames. Deux lectures s'opposent.
    - {pink}Le pis-aller.{/pink} Pour {sky}Hackforth{/sky}, et une bonne part des commentateurs, Socrate voulait une explication par le meilleur, celle qu'Anaxagore promettait ; faute de l'avoir trouvée ou apprise, il se rabat sur une méthode inférieure. Les rames remplacent les voiles : on avance, mais moins bien. Quel que soit le sens exact de l'expression, ce serait toujours un pis-aller.
    - {green}Le changement de cap.{/green} Pour {sky}Monique Dixsaut{/sky}, l'expression ne désigne pas un moindre moyen pour la même fin, mais un retournement. Elle s'appuie sur le {sky}*Philèbe*{/sky} (19c), où la « seconde navigation » (99c-d) consiste, pour le sage, à ne pas ignorer ce qu'il est lui-même : une voie *première en droit, sinon en fait*. Une intelligence qui ordonne en vue du meilleur resterait une intelligence d'artisan ; seule une Forme rend vraiment intelligible.

    Le texte penche vers la seconde lecture : Socrate refuse aussitôt l'idée que les raisonnements ne livreraient que des images des choses, ce qu'un pis-aller impliquerait.

    **L'image de l'éclipse.** Ceux qui observent une {yellow}éclipse de soleil{/yellow} s'abîment parfois les yeux s'ils ne regardent pas son image dans l'eau. Socrate craignit que son âme ne devienne {red}« totalement aveugle »{/red} (99e) en ne regardant les choses qu'avec les yeux et de les atteindre par les sens. Il décida donc de {green}« me réfugier du côté des raisonnements, et, à l'intérieur de ces raisonnements, examiner la vérité des êtres »{/green} (99e).

    **L'image ne vaut pas jusqu'au bout.** Socrate la corrige aussitôt : il n'accorde pas qu'examiner les êtres dans les raisonnements, ce soit avoir affaire à leurs images plus que lorsqu'on les examine dans l'expérience directe. C'est même l'inverse : l'expérience ne livre que des images, la réflexion atteint la réalité.

    **La méthode : poser, puis juger par l'accord.** {coral}« En chaque cas, je pose un raisonnement que je juge avoir une très grande force, et tout ce qui me paraît consoner avec lui, je le pose comme étant vrai »{/coral} (100a), le reste comme n'étant pas vrai. C'est la méthode par {violet}hypothèse{/violet} : on part d'une proposition solide et l'on examine ce qui s'accorde avec elle.

    **Le point de départ : les Formes.** Cébès ne comprend pas ; Socrate revient aux {teal}« formules cent fois ressassées »{/teal} (100b) : {amber}« je commence par poser qu'il existe un beau en soi et par soi, un bon, un grand, et ainsi pour tout le reste »{/amber} (100b). Si Cébès les lui accorde, il espère à partir d'eux montrer {teal}« la cause en raison de laquelle l'âme est une chose immortelle »{/teal} (100b). Cébès accorde, et le presse d'en venir au fait.

    ! « Seconde navigation » (99c-d) se lit comme un pis-aller (Hackforth) ou comme un changement de cap (Dixsaut) ; le texte, qui refuse de voir dans les raisonnements de simples images, va plutôt dans le sens du second.
    ! Examiner les choses dans les raisonnements n'est pas se contenter d'images : c'est l'expérience sensible qui n'en livre que des images.
