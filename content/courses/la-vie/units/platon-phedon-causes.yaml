- id: platon-phedon-causes-l2
  title: "Durer n'est pas être immortel : la question de Cébès reformulée (95a-96a)"
  notes: |-
    Avant de répondre, Socrate reformule longuement l'objection de Cébès. Il en dégage ce qu'il faudra prouver : {green}__non que l'âme dure, mais qu'elle est indestructible__{/green} ; et ce qu'il faudra examiner pour le prouver : {amber}la cause de toute génération et de toute corruption{/amber}.

    **Cadmos après Harmonie.** Cébès s'émerveille de la réfutation de Simmias et s'attend à voir tomber de même la sienne. Socrate le fait taire : {teal}« Baisse le ton, mon très cher ! dit Socrate, de peur que le mauvais œil ne mette en déroute le raisonnement à venir »{/teal} (95b) ; c'est l'affaire du dieu, la leur est d'aller {yellow}« comme dans Homère, au corps à corps avec l'adversaire »{/yellow} (95b).

    **Ce que Cébès demande.** Il faut démontrer que notre âme {coral}« est une chose indestructible et immortelle »{/coral} (95c), sans quoi la confiance du philosophe mourant serait {red}« insensée et imbécile »{/red} (95c). Montrer qu'elle est vigoureuse, divine, qu'elle existait avant nous et savait beaucoup de choses, cela prouve seulement qu'elle **dure** longtemps. Son entrée dans un corps pourrait être pour elle {red}« le commencement de sa destruction, une espèce de maladie »{/red} (95d), et elle finirait par périr, épuisée, lors d'une de ses morts. Qu'elle entre une ou plusieurs fois dans un corps n'y change rien : à moins de savoir qu'elle est immortelle, il est normal d'avoir peur.

    **Ce que la réponse exige.** Socrate reste longtemps silencieux, puis répond que ce n'est pas peu de chose : {amber}« cela exige qu'on étudie à fond la cause qui, d'une manière générale, préside à la génération et à la corruption »{/amber} (95e). Pour savoir si l'âme peut périr, il faut savoir pourquoi, en général, les choses naissent et périssent. D'où le récit de ses propres recherches.

    ! L'objection de Cébès redouble la peur : peur que l'âme périsse cette fois-ci, et peur que le discours soit impuissant à prouver qu'elle ne le peut pas.
    ! Le détour par la cause de la génération n'est pas une digression de physicien : c'est la seule manière de répondre à la question de l'indestructibilité.
