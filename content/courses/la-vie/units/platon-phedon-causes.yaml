- id: platon-phedon-causes-l9
  title: "L'âme apporte la vie : immortelle et indestructible (105c-107a)"
  notes: |-
    Socrate applique enfin la réponse raffinée à l'âme. Le raisonnement tient en peu de mots : {green}__l'âme apporte la vie, elle ne peut donc pas recevoir la mort, elle est donc immortelle__{/green} ; et parce qu'elle est immortelle, elle est indestructible.

    **L'âme apporte la vie.** {teal}« qu'est-ce qui, en entrant dans un corps, le rendra vivant ? »{/teal} (105c) {coral}« Une âme »{/coral}, répond Cébès, et toujours. L'âme, {teal}« quelle que soit la chose dont elle s'empare, vient toujours vers elle en lui apportant la vie »{/teal} (105d). Elle est donc, pour la vie, ce que le feu est pour le chaud et le trois pour l'impair.

    **Elle ne reçoit pas la mort : elle est immortelle.** La vie a un contraire, la mort. Or ce qui apporte toujours un caractère ne reçoit jamais son contraire : l'âme {red}ne recevra jamais la mort{/red}. Et comme ce qui ne reçoit pas le pair s'appelle impair, ce qui ne reçoit pas le juste injuste, ce qui ne reçoit pas la mort s'appelle {violet}**immortel**{/violet}. Donc {green}« c'est une chose immortelle qu'une âme »{/green} (105e). Cébès juge la démonstration suffisante.

    **D'immortel à indestructible.** Il reste une difficulté, et Socrate la soulève lui-même. Le trois ne devient jamais pair ; mais qu'est-ce qui l'empêche, à l'approche du pair, de **périr** plutôt que de se retirer ? Rien, car l'impair n'est pas indestructible. Si la neige était indestructible, elle se retirerait intacte devant le chaud ; mais elle fond. De même, ne pas recevoir la mort ne suffit pas : il faut encore que ce qui est immortel soit **indestructible**, sinon l'âme pourrait périr à l'approche de la mort au lieu de se retirer. Cébès l'accorde sans peine : si ce qui est immortel, donc éternel, se corrompait, quelle réalité y échapperait ? Socrate ajoute que {teal}« le dieu, la forme même de la vie »{/teal} (106d) et tout ce qui est immortel ne périssent jamais, de l'aveu de tous. Donc {coral}« quand la mort approche l'homme, c'est vraisemblablement ce qu'il y a de mortel en lui qui meurt, mais ce qu'il y a d'immortel s'éloigne et s'en va, intact et non corrompu »{/coral} (106e). Et nos âmes existeront dans l'Hadès.

    ? **Immortel** et **indestructible** (*athanatos*, *anôlethros*) : est immortel ce qui ne reçoit pas la mort, comme est impair ce qui ne reçoit pas le pair ; est indestructible ce qui ne peut pas périr. Le dernier argument doit passer du premier au second.

    **La réticence de Simmias.** Cébès n'a plus rien à objecter. Simmias non plus, mais la grandeur du sujet et {red}« le peu de considération »{/red} (107b) qu'il a pour la faiblesse humaine lui laissent une réticence. Socrate l'approuve, et va plus loin : il faut aussi réexaminer {amber}les « hypothèses qui nous ont servi de point de départ »{/amber}, et, si elles deviennent tout à fait claires, on suivra le raisonnement aussi loin qu'un homme le peut.

    **Les faiblesses relevées.** Dès l'Antiquité ({sky}Straton de Lampsaque{/sky}), on a objecté que l'argument joue sur « immortel » : ne pas pouvoir être une âme morte n'est pas ne pas pouvoir cesser d'exister ; le passage à l'indestructible repose sur un accord plus que sur une preuve. Platon en a conscience, puisqu'il fait lui-même soulever la difficulté et renvoie à l'examen des hypothèses.

    ! *Immortel* veut d'abord dire ici *qui ne reçoit pas la mort*, comme *impair* veut dire *qui ne reçoit pas le pair* ; il faut un pas de plus pour conclure à l'indestructible.
    ! Platon ne cache pas la fragilité du passage : c'est Socrate qui pose l'objection de l'impair qui pourrait périr, et qui invite à réexaminer les hypothèses.
