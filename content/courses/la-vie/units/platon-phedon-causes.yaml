- id: platon-phedon-causes-l6
  title: "Par le beau, les belles choses sont belles : la cause sûre (100c-102a)"
  notes: |-
    Les Formes posées, Socrate en tire la seule cause qu'il accepte désormais : {green}__une chose est belle parce qu'elle participe au beau__{/green}. La réponse paraît naïve ; elle a l'avantage décisif d'être sûre.

    **La participation.** {coral}« si, en dehors du beau en soi, il existe une chose belle, la seule raison pour laquelle cette chose est belle est qu'elle participe à ce beau en soi »{/coral} (100c). Socrate tourne poliment le dos aux {red}« causes savantes »{/red} (100c) : la couleur éclatante, la forme. Il s'en tient, {teal}« avec naïveté sans doute »{/teal} (100d), à ceci : {amber}« c'est par le beau que toutes les belles choses deviennent belles »{/amber} (100d), que ce soit par présence, communauté ou autrement, peu importe le comment.

    ? **Participation** (*methexis*) : la relation par laquelle une chose reçoit d'une Forme son nom et son caractère ; une chose belle est belle parce qu'elle participe au beau en soi.

    **Pourquoi c'est sûr.** Cette réponse évite les contradictions qui aveuglaient le jeune Socrate. Dire que l'un est plus grand que l'autre « de la tête », c'est expliquer par une seule et même chose la supériorité de l'un et l'infériorité de l'autre, et, pire, qu'on est grand {red}« en raison de quelque chose de petit »{/red} (101b), une tête : un prodige. Il faut dire que le plus grand est plus grand par la **grandeur**, et le plus petit plus petit par la **petitesse**. De même, dix est plus que huit par une **quantité**, et le deux vient de la participation à la **dyade**, non de l'addition ou de la division. Chaque effet a sa cause, et aucune cause ne produit deux effets contraires.

    **La méthode de l'hypothèse.** Il faut s'en tenir à {teal}« cette fameuse sécurité qui est le propre de cette hypothèse »{/teal} (101d). Si quelqu'un l'attaque, on ne répond pas avant d'avoir examiné si ses conséquences {teal}« sont mutuellement consonantes ou dissonantes »{/teal} (101d). Et s'il faut rendre compte de l'hypothèse elle-même, on en pose une autre, plus haute, {teal}« jusqu'à ce que tu atteignes quelque chose de satisfaisant »{/teal} (101e). Il ne faut pas mêler, comme les {pink}controversistes{/pink}, la discussion du principe et celle de ses conséquences. Simmias et Cébès approuvent en chœur, et Échécrate interrompt pour dire combien tout est lumineux.

    ! La réponse « par le beau » n'est pas une tautologie vide : elle désigne la cause qui rend la chose intelligible, et elle protège des contradictions des causes matérielles.
    ! Socrate ne prétend pas savoir comment se fait la participation : il affirme seulement que la beauté des choses belles vient du beau.
