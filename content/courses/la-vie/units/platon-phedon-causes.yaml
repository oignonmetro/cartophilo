- id: platon-phedon-causes-l4
  title: "Anaxagore : la vraie cause et ses conditions (97b-99c)"
  notes: |-
    Un livre d'Anaxagore promet ce que Socrate cherchait ; sa lecture le déçoit. La déception enseigne une distinction décisive : {green}__la cause véritable n'est pas la condition matérielle sans laquelle elle ne pourrait agir__{/green}.

    **L'espoir.** Socrate entend lire un livre d'{sky}Anaxagore{/sky} affirmant que {teal}« c'est l'intelligence qui est cause ordonnatrice et universelle »{/teal} (97c). Il en conclut aussitôt : si c'est l'intelligence qui ordonne, elle doit disposer chaque chose {coral}« de la meilleure manière possible »{/coral} (97c). Expliquer une chose, ce serait donc dire pourquoi il est **meilleur** pour elle d'être ce qu'elle est : si la Terre est plate ou ronde, et pourquoi c'est mieux ainsi ; de même pour le soleil, la lune, les astres. La prémisse est que **qui pose une intelligence comme cause pose du même coup le meilleur comme raison**.

    **La déception.** Il tombe {red}« de [s]on haut »{/red} : Anaxagore ne fait aucun usage de l'intelligence, et invoque comme causes {red}« les actions des airs, des éthers, des eaux »{/red} (98c).

    **L'exemple de Socrate en prison.** C'est comme si l'on disait que Socrate fait tout ce qu'il fait par intelligence, puis qu'on expliquait qu'il est assis là parce que {yellow}son corps est fait d'os et de muscles{/yellow}, que les os jouent dans leurs jointures et que les muscles se tendent et se relâchent ; ou qu'on expliquait leur dialogue par les sons, l'air et l'audition. La vraie cause est tout autre : {coral}les Athéniens ont jugé meilleur de le condamner, et lui a jugé meilleur et plus juste de rester et de subir sa peine{/coral}. Car, {teal}« par le Chien »{/teal}, il y a longtemps que ces os et ces muscles se trouveraient {yellow}« du côté de Mégare ou de la Béotie »{/yellow} (99a), emportés par une autre opinion du meilleur, s'il n'avait pas jugé plus juste de se soumettre à la Cité que de fuir.

    **La distinction.** Certes, sans os ni muscles, Socrate ne pourrait pas faire ce qu'il juge bon. Mais il y a {amber}« deux choses bien distinctes : ce qui, réellement, est cause ; et ce sans quoi la cause ne pourrait jamais être cause »{/amber} (99b). Les physiciens, {red}tâtonnant dans le noir{/red}, donnent le nom de cause à la seconde : l'un entoure la Terre d'un tourbillon, l'autre la pose sur l'air comme une huche, sans voir que c'est {green}« le bien »{/green} qui lie et tient ensemble ; ils croient avoir trouvé {yellow}« un nouvel Atlas »{/yellow} (99c) plus fort que le premier.

    ? **Cause** (*aitia*) : ce qui rend raison qu'une chose soit, devienne ou périsse ; Socrate la distingue de la condition matérielle sans laquelle elle ne pourrait agir.

    ! Platon ne nie pas le rôle des os et des muscles : il en fait des conditions nécessaires, non la cause.
    ! La déception porte sur Anaxagore, non sur l'idée d'une cause par le meilleur ; mais faute de la trouver, Socrate prend un autre chemin.
