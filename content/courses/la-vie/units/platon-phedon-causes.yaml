- id: platon-phedon-causes-l3
  title: "La science de la nature rend aveugle (96a-97b)"
  notes: |-
    Socrate raconte sa jeunesse : il s'est passionné pour la science de la nature, et elle l'a rendu **aveugle**. L'échec n'est pas un manque de talent : {red}__une explication par la matière rend raison des mêmes effets par des causes contraires__{/red}, et donc n'explique rien.

    **L'appétit de la jeunesse.** Jeune, Socrate fut pris {teal}« d'un appétit extraordinaire »{/teal} (96a) pour la {violet}« science de la nature »{/violet} (96a), capable de savoir {teal}« pourquoi elle advient, pourquoi elle périt et pourquoi elle existe »{/teal} (96a). Il se demandait si les vivants naissent quand {yellow}le chaud et le froid s'emparent d'une putréfaction{/yellow}, si l'on pense par le sang, l'air, le feu, ou par le cerveau, qui fournit les sensations d'où naissent mémoire, opinion et savoir. C'est la méthode des savants de son temps : expliquer le supérieur par l'inférieur, la pensée par le corps.

    **Désapprendre ce qu'on croyait savoir.** Résultat : il fut rendu {red}« si profondément aveugle »{/red} (96c) qu'il désapprit même ce qu'il croyait savoir. Il croyait savoir {yellow}pourquoi un homme grandit{/yellow} : en mangeant et en buvant, la chair s'ajoute à la chair, l'os aux os. Il croyait qu'un homme est plus grand qu'un autre {yellow}« de la tête »{/yellow}, que {teal}« dix est plus que huit parce que deux viennent s'adjoindre à huit »{/teal} (96e), qu'une double coudée dépasse la coudée de sa moitié.

    **Pourquoi ces explications ne tiennent pas.** Quand on ajoute une chose à une chose, qu'est-ce qui est devenu deux ? Chacune était une ; c'est leur rapprochement qui les ferait deux. Mais si l'on coupe une chose en deux, c'est cette fois la séparation qui fait deux. {red}Deux opérations contraires produisent le même effet{/red} : le rapprochement et la séparation ne peuvent être, l'un et l'autre, la cause du deux. De même, la tête qui rend l'un plus grand rend l'autre plus petit : une même cause produirait deux effets contraires. La prémisse implicite qui rend l'argument contraignant est qu'**une cause véritable ne peut pas produire des effets contraires, ni un effet venir de causes contraires**. Avec cette méthode, Socrate ne peut savoir pourquoi rien naît, périt ou est.

    ! L'échec n'est pas celui d'un esprit peu doué : la méthode elle-même confond les causes avec des opérations matérielles qui peuvent produire des effets contraires.
    ! Les exemples mêlent à dessein croissance physique et rapports mathématiques : la méthode rend obscur jusqu'à ce qui était clair.
