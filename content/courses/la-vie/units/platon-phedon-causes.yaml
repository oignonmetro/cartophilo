- id: platon-phedon-causes-l1
  title: "Repérage : l'autobiographie et le dernier argument (95a-107a)"
  notes: |-
    Pour répondre à Cébès, il ne suffit plus de montrer que l'âme dure : il faut savoir **ce qui fait naître et périr les choses**. Socrate raconte donc comment il a cherché les causes, de la science de la nature à Anaxagore, puis par la « seconde navigation » (99c-d) qui pose les Formes comme causes. Sur ce fondement, le **dernier argument** montre que l'âme, qui apporte la vie, ne peut pas recevoir la mort.

    | Moment | Lieu | Ce qui s'y joue |
    | la question reformulée | 95a-e | durer longtemps n'est pas être immortel : il faut savoir pourquoi les choses naissent et périssent |
    | la science de la nature | 95e-97b | expliquer par la matière rend aveugle : la même cause produit des effets contraires |
    | Anaxagore | 97b-99c | l'Intelligence promettait le meilleur ; elle ne donne que des conditions, os et tendons |
    | la seconde navigation | 99c-102a | se réfugier dans les raisonnements : les Formes sont les seules causes sûres |
    | l'exclusion des contraires | 102a-105b | un contraire, ou ce qui l'apporte toujours, ne reçoit jamais son contraire |
    | l'âme immortelle et indestructible | 105b-107a | l'âme apporte la vie, ne reçoit donc pas la mort, et se retire intacte |
