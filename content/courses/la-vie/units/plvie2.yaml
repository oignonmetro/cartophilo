lessons:
- id: plvie2-l1
  title: "L'âme vit-elle par elle-même ?"
  notes: |-
    **Si l'Intellect est le foyer véritable de la vie, en quel sens l'âme est-elle encore un principe de vie**, {red}et non un simple réceptacle passif{/red} qui redistribuerait vers le bas ce qu'il reçoit d'en haut ?

    **L'immortalité de l'âme est en jeu.** {red}Si l'âme ne possède la vie que d'une manière empruntée et extérieure{/red}, {coral}rien ne garantit qu'elle la conserve après la dissolution du corps{/coral} : ce qu'on tient d'un autre, on peut le perdre. C'est ce que Plotin veut réfuter : l'âme n'est pas vivante parce qu'elle est associée à un corps ou à un principe supérieur, mais {green}parce qu'elle est essentiellement vie{/green} (IV, 7 [2], 9).

    ? Principe : ce qui caractérise un principe est {amber}sa capacité à se donner à lui-même ce qu'il reçoit du niveau supérieur{/amber}.

    **La dérivation n'ôte donc rien à l'âme : elle est la condition même de sa causalité propre.** La réceptivité de l'âme {coral}n'est jamais passive{/coral} : tout ce qu'elle possède, elle le tire de l'Intellect {amber}en se le réappropriant dans un mouvement d'auto-constitution{/amber}. Recevoir et se constituer sont un seul geste. Comparons {yellow}une cire qui garde l'empreinte qu'on lui impose{/yellow} à {yellow}un élève qui ne sait un théorème qu'en le refaisant lui-même{/yellow} : la première subit, le second reçoit en agissant.

    **L'être de l'âme est la vie** : {teal}« {/teal}vie et être {teal}ne faisant qu'un »{/teal} (VI, 2 [43], 6). Par là se résout le paradoxe d'un principe qui reçoit : l'âme tient la vie de l'Intellect, mais elle ne la porte pas comme un accident qu'elle pourrait perdre.

    ! Dérivé ne veut pas dire emprunté : la vie de l'âme dérive de l'Intellect et lui appartient en propre.
  points:
  - id: plvie2-l1-p1
    sentence: "__La dérivation est pour l'âme la condition de sa causalité propre__ : sa réceptivité n'est jamais ___."
    answer: "passive"
