- id: plvie2-l3
  title: "L'homonymie de la vie"
  notes: |-
    **Il y a chez Plotin deux types d'homonymie de la vie.**
    - La première est {amber}interne à la hiérarchie des principes incorporels{/amber} : la vie de l'Intellect et celle de l'âme sont homonymes, car l'une est {green}immobile{/green} et l'autre {red}en mouvement{/red}, l'une {green}parfaitement unifiée{/green} et l'autre {red}dispersée dans le temps{/red}.
    - La seconde est {amber}verticale{/amber}, entre les principes incorporels et le monde corporel : les corps sont vivants de manière homonyme par rapport aux âmes, car leur vie est empruntée, {coral}ils sont incapables de se la donner à eux-mêmes{/coral}.

    **Homonymie ne veut pas dire équivocité verbale.** Les sens forment {violet}une série hiérarchique{/violet} où chaque niveau dépend du précédent sans partager avec lui la même définition. Deux positions sont ainsi écartées :
    - la {violet}synonymie{/violet}, qui supposerait {red}une définition commune à tous les vivants{/red} ;
    - l'{violet}équivocité pure{/violet}, qui rendrait les sens de « vie » {red}totalement indépendants{/red} les uns des autres.

    Les niveaux de vie ne forment donc pas un genre assoupli : ce sont des {violet}totalités{/violet} distinctes, dont le supérieur est le {green}modèle{/green} et l'inférieur l'{red}image{/red}. I, 4 [46], 3 : {teal}« [...]{/teal} la vie {teal}se dit en plusieurs sens{/teal}, différenciée {teal}en premier et second selon l'ordre{/teal}, et [...] le fait de vivre {teal}se dit de manière homonyme{/teal}, d'une façon pour la {teal}vie végétale{/teal}, d'une autre pour la {teal}vie irrationnelle{/teal}, différenciées par {teal}leur clarté et leur obscurité »{/teal}.

    **Une remarque d'Aristote réappropriée et renversée.** {sky}*De l'âme*, II, 2{/sky} (413a22-25) : le fait de vivre ({blue}*to zèn*{/blue}) se dit en plusieurs sens, car {yellow}nutrition, sensation, locomotion, pensée{/yellow} suffisent chacune à constituer un vivant. Plotin y trouve le cadre d'une hiérarchie sans définition commune, mais {coral}il l'inverse{/coral} : {red}on ne monte pas des fonctions biologiques inférieures vers la pensée{/red} ; {green}c'est depuis la vie parfaite de l'Intellect que les formes inférieures se comprennent et se justifient{/green}.

    | Niveau de vie | Clarté | Acte de pensée |
    | vie intellectuelle | la plus claire | pensée la plus intense |
    | vie sensible | intermédiaire | intellection obscure |
    | vie végétative | la plus obscure | dernier reflet de l'intelligible |

    **La clarté mesure l'intensité de la pensée** : {coral}plus un être est vivant, plus il pense ; plus il pense, plus il est{/coral}. Les {amber}sensations{/amber} sont des {amber}intellections obscures{/amber}, et les intellections de là-haut des perceptions claires (VI, 7 [38], 7). Même l'{yellow}âme végétative{/yellow} est une forme de pensée, dernier reflet de la puissance de l'intelligible.
