- id: plvie2-l5
  title: "Quelle vie choisir ?"
  notes: |-
    **Le sens ontologique et le sens éthique de la vie s'articulent ici**, et c'est l'un des enjeux les plus profonds de la pensée de Plotin. Le raisonnement tient en deux prémisses :
    - {amber}la vie véritable est celle de l'Intellect{/amber} ;
    - {amber}l'âme humaine est capable, par sa dimension intellective, d'atteindre ce niveau{/amber}.

    Alors se pose avec une force particulière la question : {amber}__**comment choisir notre vie ?**__{/amber} La question de la vie bonne {red}n'est pas seulement éthique{/red} : {green}elle est ontologique{/green}. {coral}Choisir sa vie, c'est décider à quel niveau de l'être on veut appartenir.{/coral}

    **La remontée est possible parce que l'âme humaine rationnelle peut mener une double vie** : elle est {violet}amphibie{/violet} ({blue}*amphibios*{/blue} ; IV, 8 [6], 4, 32).
    - Par sa dimension intellective, elle {green}reste toujours dans le monde intelligible{/green}, sans jamais descendre entièrement dans le corps.
    - Son autre partie, liée à la vie du corps, vit à la fois {amber}de la vie d'ici-bas et de celle de là-haut{/amber}, davantage de l'une ou de l'autre selon les circonstances.

    {yellow}Comme l'animal qu'on dit amphibie vit sur terre et dans l'eau{/yellow}, l'âme a deux milieux : elle n'a pas à quitter l'un pour exister dans l'autre, mais l'un des deux peut l'occuper davantage.

    **Vivant entre deux mondes, elle est traversée par une tension** : {coral}il lui appartient d'orienter convenablement son activité principale{/coral} si elle souhaite mener une vie plus réelle et plus accomplie que la seule vie biologique. Cette réflexion est au cœur du traité I, 4 [46], consacré à la vie bonne et au bonheur.

    **Le bonheur d'Aristote, radicalisé.** Dans la tradition aristotélicienne, le bonheur est {amber}l'activité conforme à la meilleure disposition de l'homme{/amber}, sa nature intellectuelle. Plotin l'infléchit : la vraie vie bonne {red}n'est pas seulement la vie intellectuelle au sens d'Aristote{/red} ; elle est {green}la vie entièrement orientée vers le monde intelligible, qui dans ses meilleurs moments coïncide avec l'Intellect lui-même{/green}.

    ! La non-descente ne rend pas le choix inutile : que l'Intellect reste là-haut ne dit pas de quel côté l'homme dirige son activité.
