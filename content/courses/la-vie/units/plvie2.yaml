- id: plvie2-l6
  title: "Trois modes de vie et la vie bonne"
  notes: |-
    **Il n'y a que deux modes de vie fondamentaux pour l'individu incarné, entre lesquels s'en loge un troisième** (II, 9 [33], 9).

    | Mode de vie | Ce vers quoi il se tourne |
    | les sages | le bien suprême |
    | la forme intermédiaire | le bien, par mémoire de la vertu |
    | la multitude | les réalités sensibles |

    - La vie des {violet}sages{/violet} ({blue}*spoudaioi*{/blue}) {green}se dirige vers le bien suprême{/green}.
    - La vie de la {violet}multitude{/violet} ({blue}*polloi*{/blue}) {red}se laisse fasciner par les réalités sensibles{/red}.
    - Entre les deux, une forme intermédiaire {amber}participe encore au bien par une certaine mémoire de la vertu{/amber}.

    **Ce partage en trois n'est pas un pluralisme** : les modes de vie {red}ne sont pas trois chemins équivalents{/red}, mais {green}trois degrés de réalisation de la nature humaine{/green}.

    **La vie n'est pas en elle-même un bien : elle ne l'est que pour celui qui la mène bien.** Plotin affirme ainsi que {coral}la vie dans un corps est, en un sens relatif, un mal{/coral}, dont la {violet}mort{/violet}, comprise comme {amber}séparation de l'âme et du corps{/amber}, peut être une libération (I, 7 [54], 3). La thèse paraît étrange dans une philosophie de la vie ; elle ne l'est plus si « vie » a plusieurs sens : ce que la mort défait, c'est un degré inférieur de vie.

    **Ce qui est précieux, c'est la** {violet}vie bonne{/violet} ({blue}*zôè agathè*{/blue}), entendue comme {coral}activité intellectuelle pure, par laquelle nous participons à la vie même de l'Intellect divin{/coral}.

    **Les deux dimensions de la vie convergent ainsi** : biologique et éthique, elles se rapportent à un même foyer. {green}La vie véritable est pensée{/green}, et {red}la vie sensible n'est qu'une image plus ou moins dégradée{/red} de cette pensée vivante.

    ! La mort n'est pas recherchée contre la vie : elle libère d'une image de la vie au profit de la vie véritable.
