- id: plvie2-l4
  title: "L'éternité et le temps, deux manières de vivre"
  notes: |-
    **L'homonymie hiérarchique semblait suffire à rendre compte des niveaux d'existence ; Plotin va plus loin et introduit un sens inédit de la vie** dans le traité *Sur l'éternité et le temps* (III, 7 [45]) : la vie {red}non plus seulement comme propriété ou activité d'un vivant{/red}, mais comme {green}mode d'être{/green}, la manière qu'a une réalité de se manifester et d'exister. Ce *comment* de l'existence des principes, la manière dont ils sont actifs, le traité l'appelle leur {violet}disposition{/violet} ({blue}*diathesis*{/blue}). L'homonymie entre l'âme et l'Intellect permet ce nouveau sens.

    | Vie | Principe | Manière d'exister | Unité |
    | éternité | l'Intellect | totalité présente, sans écoulement | multiplicité contenue |
    | temps | l'Âme | passage d'un état à un autre | unité qui se déploie |

    **L'éternité n'est pas une durée infinie.** Elle exprime {amber}l'unité absolue et immédiatement présente à elle-même{/amber} qui caractérise l'activité de l'Intellect en tant qu'il demeure dans la proximité de l'Un. Elle est {teal}« {/teal}l'acte {teal}d'une vie permanente{/teal} qui {teal}se dirige d'elle-même vers l'Un »{/teal} (III, 7 [45], 6, 10-11). {red}Ce n'est pas une propriété que l'Intellect __aurait__{/red} : {green}c'est ce qu'est l'Intellect dans sa manière d'exister{/green}, sa plénitude sans transition ni écoulement.

    **Le temps appartient à un niveau inférieur.** Plotin suit {sky}Platon{/sky}, pour qui le temps est {teal}« l'image mobile de l'éternité »{/teal} ({sky}*Timée*, 37d{/sky}), et le définit au chapitre 11 comme {teal}« {/teal}la vie ({blue}*zôè*{/blue}) {teal}de l'âme{/teal} consistant dans {teal}le mouvement{/teal} par lequel l'âme {teal}passe d'un état de vie{/teal} ({blue}*bios*{/blue}) {teal}à un autre »{/teal} (III, 7 [45], 11, 44-45). La définition joint les deux mots : {blue}*zôè*{/blue}, la vie générale de l'âme qu'est le temps ; {blue}*bios*{/blue}, chacun de ses états.

    **Le temps n'est donc plus fabriqué.** Chez {red}Platon{/red}, il est une fabrication de l'Intellect démiurgique ; chez {green}Plotin{/green}, il est la vie même de l'âme, sa manière de se mouvoir et de se déployer. L'âme produit et organise le monde pour autant qu'elle s'est elle-même {teal}« faite temps »{/teal}.

    **L'enquête n'est pas seulement théorique** : le lecteur doit prendre conscience que, {coral}si son âme peut vivre d'une vie temporelle, elle peut aussi faire l'expérience de l'éternité dès la vie incarnée{/coral}, en remontant jusqu'au monde intelligible.

    ! Opposer éternité et temps, ce n'est pas opposer une durée sans fin à une durée finie : l'éternité ne dure pas, elle est présente tout entière.
