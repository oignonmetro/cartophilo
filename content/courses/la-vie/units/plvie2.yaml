- id: plvie2-l2
  title: "La vie des corps, une vie d'emprunt"
  notes: |-
    **L'âme, essentiellement vivante et** {violet}auto-motrice{/violet}**, est à son tour principe de vie et de mouvement pour les corps** qui dépendent d'elle. Ceux-ci, {coral}par nature inertes, n'ont qu'une vie d'emprunt{/coral} (IV, 7 [2], 9 ; V, 1 [10], 2).

    **L'âme n'est pas cause de la vie à la manière d'Aristote.** Pour {sky}Aristote{/sky}, elle est cause parce qu'elle {red}permet l'actualisation des fonctions corporelles{/red} ; pour Plotin, parce qu'elle {green}possède une forme supérieure de vie{/green}.

    **Comment les corps y participent-ils ?** En communiquant la vie, {amber}l'âme ne se mêle pas aux corps et ne perd rien{/amber} : elle leur reste toujours transcendante. Elle leur est présente comme {yellow}la lumière est présente dans l'air, sans s'y mélanger{/yellow} (IV, 3 [27], 22, 1-7). L'air est éclairé de part en part, la lumière n'est pas pour autant une propriété de l'air : {coral}qu'elle se retire, il n'en garde rien en propre{/coral}.

    **D'où le refus explicite de l'**{violet}hylémorphisme{/violet} aristotélicien, qui pense le vivant comme un composé d'une matière et d'une forme inséparables : {green}l'âme confère la vie au corps tout en demeurant ontologiquement séparée de lui{/green}. Le traité I, 1 [53] l'indique : {amber}c'est parce que l'âme a une vie propre qu'il peut y avoir un corps vivant{/amber}.

    **La cause ne transmet pas à l'effet la propriété qu'elle possède.** La vie que l'âme transmet {red}n'est pas celle dont elle vit elle-même{/red} : la vie des corps est homonyme à celle de l'âme au sens où elle en est {red}une image affaiblie{/red}, une {teal}« imitation de la vie »{/teal} (III, 6 [26], 6, 49-51). {coral}La cause donne à l'effet une propriété inférieure et dérivée{/coral}.

    ! Un corps vivant n'est pas un corps qui contiendrait de la vie : il reçoit un reflet d'une vie qui reste hors de lui.
