lessons:
- id: sep-bio4-l1
  title: "La réduction après le consensus"
  notes: |-
    **La biologie moléculaire reprend le premier débat du champ, celui de la réduction de la génétique mendélienne, mais la question ne se pose plus dans les mêmes termes.**

    **D'un consensus à sa contestation.** Au débat entre Schaffner et Hull succède le {violet}« consensus antiréductionniste »{/violet} (Kitcher 1984). {violet}Kenneth Waters{/violet} ranime la position réductionniste dans une série d'articles importants (1990, 1994), et le débat sur le rapport cognitif entre les deux disciplines se poursuit.

    **Une alternative dépassée.** {coral}__La question ne se formule plus comme un simple choix entre réduction et irréductibilité.__{/coral} On emploie désormais une variété de concepts : la {violet}réalisabilité multiple{/violet}, la {violet}réalisation{/violet}, le {violet}mécanisme{/violet} (Wilson 2005, Craver 2007, Polger et Shapiro 2016). Ils comptent en génétique, mais aussi en neurosciences et en biologie cellulaire. La réalisabilité multiple dit qu'une même propriété de niveau supérieur peut se réaliser dans des bases différentes : une même fonction, plusieurs chimies.

    **Le modèle classique n'est pas applicable.** {violet}Lindley Darden{/violet}, Schaffner et d'autres soutiennent que {red}__les explications de la biologie moléculaire ne se confinent pas proprement à un seul niveau ontologique__{/red} (Darden et Maull 1977, Schaffner 1993). Une explication y mêle molécules, membranes et cellules. {red}Le modèle de réduction tiré d'exemples classiques{/red}, comme la {sky}réduction des lois phénoménologiques des gaz à la cinétique moléculaire dans la physique du XIXe siècle{/sky}, où un niveau se déduit d'un autre, {red}est donc simplement inapplicable{/red}.
  points:
  - id: sep-bio4-l1-p1
    sentence: "Au débat entre Schaffner et Hull sur la génétique succède le consensus ___ (Kitcher 1984)."
    answer: "antiréductionniste"
    alt: ["anti-réductionniste"]
  - id: sep-bio4-l1-p2
    sentence: "La position réductionniste sur la génétique, après le consensus contraire, est ranimée par Kenneth ___ (1990, 1994)."
    answer: "Waters"
    alt: []
  - id: sep-bio4-l1-p3
    sentence: "La question du rapport entre génétiques mendélienne et moléculaire ne se pose plus comme un choix entre réduction et ___."
    answer: "irréductibilité"
    alt: []
  - id: sep-bio4-l1-p4
    sentence: "Pour penser le rapport entre génétiques mendélienne et moléculaire, on emploie des concepts comme la réalisation, le mécanisme et la réalisabilité ___."
    answer: "multiple"
    alt: []
  - id: sep-bio4-l1-p5
    sentence: "Pour Lindley ___, Schaffner et d'autres, les explications de la biologie moléculaire ne se confinent pas à un seul niveau ontologique."
    answer: "Darden"
    alt: []
  - id: sep-bio4-l1-p6
    sentence: "Les explications de la biologie moléculaire ne se confinent pas à un seul ___ ontologique : une explication y mêle molécules, membranes et cellules."
    answer: "niveau"
    alt: []
  - id: sep-bio4-l1-p7
    sentence: "Exemple classique de réduction, jugé inapplicable à la biologie moléculaire : la réduction des lois phénoménologiques des ___ à la cinétique moléculaire, dans la physique du XIXe siècle."
    answer: "gaz"
    alt: []
- id: sep-bio4-l2
  title: "Des mécanismes plutôt que des lois"
  notes: |-
    **La biologie moléculaire ne ressemble pas à la physique, et c'est peut-être la physique qui n'est pas le bon modèle de la science.**

    **Pas de grande théorie.** Elle n'a pas le genre de {red}grande théorie fondée sur un ensemble de lois ou de modèles mathématiques{/red} qu'on connaît dans les sciences physiques (voir pourtant Rosenberg 2008).

    **Des exemplaires.** À la place, {green}__des mécanismes très spécifiques, découverts en détail dans un {violet}organisme modèle{/violet}, semblent servir d'« exemplaires »__{/green} : ils permettent d'étudier des mécanismes semblables, mais pas forcément identiques, chez d'autres organismes qui emploient les mêmes molécules ou des molécules apparentées. On ne déduit pas d'une loi ce qui se passe chez la souris : on part de ce qu'on a vu chez la mouche, et on cherche ce qui s'y conserve (exemple familier).

    **La thèse des nouveaux mécanistes.** Darden et d'autres soutiennent que ces {violet}« mécanismes »{/violet}, {teal}« des ensembles spécifiques d'entités, avec leurs organisations et leurs activités distinctives »{/teal}, {coral}__sont l'unité fondamentale de la découverte et de l'explication scientifiques__{/coral}, non seulement en biologie moléculaire, mais dans un large éventail de sciences spéciales (Machamer, Darden et al. 2000 ; Craver et Darden 2013 ; Bechtel et Richardson 1993).

    **Jusqu'où va le concept ?** On peut se demander si la notion de mécanisme convient à d'autres domaines de la biologie : la sélection naturelle est-elle un mécanisme (Skipper et Millstein 2005, Havstad 2011) ? Elle est bien plus lâche, dans son organisation, qu'une chaîne de réactions moléculaires.

    ! « Mécanisme » n'a pas ici le sens de Descartes : ce n'est pas la thèse que le vivant est une machine, mais une thèse sur la **forme des explications** : on décrit des entités, leur organisation et leurs activités.
  points:
  - id: sep-bio4-l2-p1
    sentence: "La biologie moléculaire n'a pas de grande théorie fondée sur un ensemble de ___ ou de modèles mathématiques, comme en ont les sciences physiques."
    answer: "lois"
    alt: []
  - id: sep-bio4-l2-p2
    sentence: "En biologie moléculaire, des mécanismes découverts en détail dans un organisme ___ permettent d'étudier des mécanismes semblables chez d'autres organismes."
    answer: "modèle"
    alt: []
  - id: sep-bio4-l2-p3
    sentence: "En biologie moléculaire, des mécanismes découverts en détail dans un organisme modèle servent d'« ___ » pour étudier des mécanismes semblables, pas forcément identiques, chez d'autres organismes."
    answer: "exemplaires"
    alt: []
  - id: sep-bio4-l2-p4
    sentence: "Pour Darden et d'autres, les mécanismes sont « des ensembles spécifiques d'___, avec leurs organisations et leurs activités distinctives »."
    answer: "entités"
    alt: []
  - id: sep-bio4-l2-p5
    sentence: "Pour Darden et d'autres, les mécanismes sont « des ensembles spécifiques d'entités, avec leurs organisations et leurs ___ distinctives »."
    answer: "activités"
    alt: []
  - id: sep-bio4-l2-p6
    sentence: "Pour Darden et d'autres, les mécanismes sont l'___ fondamentale de la découverte et de l'explication scientifiques, dans un large éventail de sciences spéciales."
    answer: "unité"
    alt: []
  - id: sep-bio4-l2-p7
    sentence: "Une question sur l'extension du concept de mécanisme en biologie : la ___ naturelle est-elle un mécanisme ?"
    answer: "sélection"
    alt: []
- id: sep-bio4-l3
  title: "Le gène et l'information génétique"
  notes: |-
    **Autre sujet majeur de la philosophie de la biologie moléculaire : le {violet}concept de gène{/violet}** (Beurton, Falk et Rheinberger 2000 ; Waters 2000, 2004 ; Griffiths et Stotz 2007).

    **L'information génétique.** Les philosophes ont aussi beaucoup écrit sur le concept d'{violet}information génétique{/violet}. La tonalité générale : {red}__il est difficile de reconstruire cette idée précisément d'une manière qui rende justice au poids que semblent lui donner les biologistes moléculaires__{/red} (Sarkar 1996, Maynard Smith 2000, Godfrey-Smith 2001, Griffiths 2001, Jablonka 2002, Rosenberg 2006). Le titre de Griffiths le dit à lui seul : {yellow}« une métaphore en quête d'une théorie »{/yellow}.

    **Le cœur de la question.** L'ADN porte-t-il une {violet}information sémantique{/violet} (Shea 2007) ? La différence est celle-ci : la fumée « informe » du feu parce qu'elle covarie avec lui, sans rien vouloir dire (exemple familier) ; une phrase signifie quelque chose, et peut être fausse. Quand on dit que le génome « code » ou qu'il est un « programme », veut-on dire la première chose, qui est vraie mais banale, ou la seconde, qui est forte mais à démontrer ?

    **Si ce n'est pas le cas**, deux réponses sont possibles : cette information est-elle une {violet}fiction utile{/violet} (Levy 2011), ou {red}gêne-t-elle la biologie moléculaire{/red} ?

    ! Le débat ne nie pas la découverte du code génétique : il porte sur ce que le mot « information » ajoute à la description causale.
  points:
  - id: sep-bio4-l3-p1
    sentence: "La tonalité générale de la littérature sur l'information ___ : il est difficile de reconstruire cette idée d'une manière qui rende justice au poids que lui donnent les biologistes moléculaires."
    answer: "génétique"
    alt: []
  - id: sep-bio4-l3-p2
    sentence: "Griffiths (2001) appelle l'information génétique « une ___ en quête d'une théorie »."
    answer: "métaphore"
    alt: []
  - id: sep-bio4-l3-p3
    sentence: "Question centrale sur le génome : l'ADN porte-t-il une information ___ (Shea 2007), comme une phrase qui signifie quelque chose et peut être fausse ?"
    answer: "sémantique"
    alt: []
  - id: sep-bio4-l3-p4
    sentence: "La fumée « informe » du feu parce qu'elle ___ avec lui, sans rien vouloir dire : est-ce là tout ce que veut dire le mot information à propos de l'ADN ?"
    answer: "covarie"
    alt: []
  - id: sep-bio4-l3-p5
    sentence: "Si l'ADN ne porte pas d'information sémantique, cette information est-elle une ___ utile, ou gêne-t-elle la biologie moléculaire (Levy 2011) ?"
    answer: "fiction"
    alt: []
- id: sep-bio4-l4
  title: "Les contraintes développementales et l'évo-dévo"
  notes: |-
    **Les débats sur l'adaptationnisme des années 1980 familiarisent les philosophes avec un fait : les explications d'un trait par l'évolution et par le développement interagissent de façon complexe.**

    **Ce que le développement apporte à l'évolution.** La {violet}biologie du développement{/violet} éclaire les sortes de variations susceptibles de s'offrir à la sélection. La sélection ne peut trier que ce que le développement produit : il n'y a pas de cochons ailés à sélectionner (exemple familier). D'où la question : {green}__jusqu'où comprendre les résultats de l'évolution par les options disponibles (les {violet}« contraintes développementales »{/violet}), plutôt que par la sélection naturelle de ces options__{/green} (Maynard Smith, Burian et al. 1985 ; Brigandt 2014) ?

    **La critique d'Amundson.** Ce débat ne regarde le développement que pour ce qu'il peut répondre aux questions de l'évolution. Or, fait remarquer {violet}Ron Amundson{/violet} (1994), {red}les biologistes du développement traitent de questions qui leur sont propres{/red}, et {coral}__il faut un autre concept de contrainte pour y répondre__{/coral}. Une contrainte, pour l'évolutionniste, limite l'adaptation qu'on pouvait attendre ; pour le biologiste du développement, elle explique pourquoi les formes sont ce qu'elles sont.

    **Un champ qui promet d'unir les deux.** Dans les années 1990 émerge la {violet}biologie évolutive du développement{/violet} (évo-dévo), qui suscite une importante littérature philosophique visant à caractériser ce champ du point de vue de sa méthode (Love 2003, Maienschein et Laubichler 2004, Robert 2004, Amundson 2005, Brandon et Sansom 2007).
  points:
  - id: sep-bio4-l4-p1
    sentence: "La biologie du développement éclaire les variations susceptibles de s'offrir à la sélection, d'où le débat sur les ___ développementales : jusqu'où expliquer l'évolution par les options disponibles ?"
    answer: "contraintes"
    alt: []
  - id: sep-bio4-l4-p2
    sentence: "Le débat sur les contraintes développementales demande jusqu'où expliquer l'évolution par les ___ disponibles, plutôt que par leur sélection naturelle."
    answer: "options"
    alt: []
  - id: sep-bio4-l4-p3
    sentence: "Ron ___ (1994) fait remarquer que les biologistes du développement ont leurs propres questions, et qu'il leur faut un autre concept de contrainte."
    answer: "Amundson"
    alt: []
  - id: sep-bio4-l4-p4
    sentence: "« Two concepts of constraint » (1994) : Amundson soutient qu'il faut un autre concept de contrainte pour les biologistes du ___, qui ont leurs propres questions."
    answer: "développement"
    alt: []
  - id: sep-bio4-l4-p5
    sentence: "Dans les années 1990 émerge un champ qui promet d'unir les explications par l'évolution et par le développement : la biologie ___ du développement."
    answer: "évolutive"
    alt: []
- id: sep-bio4-l5
  title: "Les systèmes développementaux et l'inné"
  notes: |-
    **Les théoriciens des {violet}systèmes développementaux{/violet} (Gray, Griffiths, Oyama) contestent le privilège accordé aux gènes.** Leur thèse est celle de la {violet}« parité »{/violet} entre gènes et facteurs non génétiques.

    **Deux arguments pour la parité.**
    - **Ce qu'on hérite** : {green}__les organismes héritent d'une {violet}« matrice développementale »{/violet}, et non seulement de gènes__{/green} (ainsi l'{violet}hérédité épigénétique{/violet}).
    - **Ce que font les gènes** : leur rôle dans le développement des traits {red}n'est pas causalement unique{/red}. Dans la mesure où les gènes « portent de l'information » ou sont « copiés », {coral}on peut en dire autant d'autres facteurs{/coral}. Gènes et facteurs de développement **covarient causalement** avec les traits phénotypiques. Si on appelle information la covariation, alors la température du nid « informe » du sexe du crocodile (exemple familier).

    **La riposte.** Les défenseurs des {violet}« réplicateurs étendus »{/violet} (Sterelny, Smith et Dickison 1996) soutiennent que {pink}les gènes portent uniquement l'information au sens {violet}téléosémantique{/violet}{/pink}. La téléosémantique rattache la signification à la fonction, au sens de ce pour quoi une chose a été sélectionnée : le gène n'est pas seulement corrélé au trait, il a été sélectionné pour le produire. C'est donc la théorie des effets sélectionnés qui revient ici.

    **L'inné.** Autre source de controverse philosophique : y a-t-il des traits {violet}innés{/violet}, et qu'est-ce que l'innéité (Ariew 1999, Griffiths 2002, Mameli et Bateson 2006, Linquist) ? On mêle sous ce mot plusieurs idées, et {coral}les philosophes ont aidé à clarifier les concepts en jeu{/coral}. Ariew, par exemple, identifie l'innéité à la {violet}canalisation{/violet} : un trait inné est un trait que le développement produit de façon stable malgré la variation de l'environnement.

    ! La parité n'est pas l'idée que l'environnement compte autant que les gènes dans chaque trait : elle nie seulement qu'il y ait une **différence de nature** entre le rôle causal des gènes et celui des autres facteurs.
  points:
  - id: sep-bio4-l5-p1
    sentence: "Les théoriciens des systèmes développementaux défendent la ___ entre gènes et facteurs non génétiques."
    answer: "parité"
    alt: []
  - id: sep-bio4-l5-p2
    sentence: "Premier des deux arguments pour la parité entre gènes et facteurs non génétiques : les organismes héritent d'une ___ développementale, et non seulement de gènes."
    answer: "matrice"
    alt: []
  - id: sep-bio4-l5-p3
    sentence: "Exemple d'héritage non génétique invoqué par les théoriciens des systèmes développementaux : l'hérédité ___."
    answer: "épigénétique"
    alt: []
  - id: sep-bio4-l5-p4
    sentence: "Second des deux arguments pour la parité entre gènes et facteurs non génétiques : le rôle des gènes n'est pas causalement ___, ce qu'on dit de leur information valant aussi d'autres facteurs."
    answer: "unique"
    alt: []
  - id: sep-bio4-l5-p5
    sentence: "Si on appelle information une simple covariation causale avec un trait, alors la température du nid « informe » du ___ du crocodile : argument pour la parité entre gènes et autres facteurs."
    answer: "sexe"
    alt: []
  - id: sep-bio4-l5-p6
    sentence: "Contre la parité entre gènes et facteurs non génétiques, les défenseurs des réplicateurs ___ (Sterelny, Smith et Dickison 1996) tiennent que seuls les gènes portent une information téléosémantique."
    answer: "étendus"
    alt: []
  - id: sep-bio4-l5-p7
    sentence: "Les défenseurs des réplicateurs étendus tiennent que les gènes seuls portent une information au sens ___ : ils ont été sélectionnés pour produire le trait."
    answer: "téléosémantique"
    alt: []
  - id: sep-bio4-l5-p8
    sentence: "Ariew (1999) identifie l'innéité d'un trait à sa ___ : le développement le produit de façon stable malgré la variation de l'environnement."
    answer: "canalisation"
    alt: []
- id: sep-bio4-l6
  title: "Une philosophie de l'écologie tardive"
  notes: |-
    **Jusqu'à récemment, la philosophie de l'écologie et de la biologie de la conservation était très peu développée, ce qui étonne.** Les trois approches de la philosophie de la biologie y trouvaient pourtant un terrain évident, et l'{violet}éthique environnementale{/violet}, abondante, exigeait qu'on examine de façon critique l'écologie et la biologie de la conservation : pour dire ce qu'il faut protéger, encore faut-il savoir ce que sont un écosystème et une diversité. Depuis une vingtaine d'années, le champ se développe rapidement (Colyvan et al. 2009).

    **Ses principaux sujets.**
    - le **rapport compliqué entre modèles mathématiques et données empiriques** en écologie ;
    - l'existence de {violet}lois écologiques{/violet} propres ;
    - la nature et la réalité des {violet}communautés écologiques et des écosystèmes{/violet} : y a-t-il là une chose, ou une simple coprésence d'espèces ?
    - la {violet}robustesse{/violet} des principes écologiques ;
    - l'idée de {violet}stabilité écologique{/violet} et d'{yellow}« équilibre de la nature »{/yellow} ;
    - la **définition de la {violet}biodiversité{/violet}** ;
    - le rapport entre écologie et biologie de la conservation ;
    - le **rôle des valeurs** dans l'écologie et la biologie de la conservation.

    **Fonctions écologiques : une difficulté nouvelle.** Des travaux récents portent sur les fonctions en écologie (Jax 2005, Odenbaugh 2010, Nunes-Neto et al. 2014, Dussault et Bouchard 2017). {red}__La plupart des écologues et des biologistes de l'évolution ne tiennent pas les communautés ou les écosystèmes pour des unités de sélection : la théorie des effets sélectionnés ne s'y applique donc pas aisément.__{/red} Le raisonnement est simple : si la fonction d'un trait est ce pour quoi il a été sélectionné, ce qui n'est pas sélectionné n'a pas de fonction en ce sens. Or les écologues parlent couramment de la fonction d'un décomposeur dans un écosystème. {coral}Les philosophes de l'écologie explorent donc d'autres conceptions{/coral}, comme l'approche organisationnelle (Nunes-Neto et al.) ou la propension à favoriser la persistance (Dussault et Bouchard).
  points:
  - id: sep-bio4-l6-p1
    sentence: "L'absence longtemps constatée d'une philosophie de l'écologie étonne, car l'éthique ___, abondante, exige un examen critique de l'écologie et de la biologie de la conservation."
    answer: "environnementale"
    alt: []
  - id: sep-bio4-l6-p2
    sentence: "Parmi les sujets de la philosophie de l'écologie : l'idée de stabilité écologique et d'« ___ de la nature »."
    answer: "équilibre"
    alt: []
  - id: sep-bio4-l6-p3
    sentence: "Parmi les sujets de la philosophie de l'écologie : la réalité des communautés écologiques et des ___ ; y a-t-il là une chose, ou une simple coprésence d'espèces ?"
    answer: "écosystèmes"
    alt: []
  - id: sep-bio4-l6-p4
    sentence: "Parmi les sujets de la philosophie de la biologie de la conservation : la définition de la ___, et le rôle des valeurs."
    answer: "biodiversité"
    alt: []
  - id: sep-bio4-l6-p5
    sentence: "Les communautés et les écosystèmes ne passent pas pour des unités de sélection : la théorie des effets ___ des fonctions ne s'y applique donc pas aisément."
    answer: "sélectionnés"
    alt: []
  - id: sep-bio4-l6-p6
    sentence: "La théorie des effets sélectionnés des fonctions ne s'applique pas aisément en écologie, parce que les communautés et les écosystèmes ne passent pas pour des ___ de sélection."
    answer: "unités"
    alt: []
  - id: sep-bio4-l6-p7
    sentence: "Pour rendre compte des fonctions écologiques sans sélection, Dussault et Bouchard (2017) proposent une propension à favoriser la ___."
    answer: "persistance"
    alt: []
- id: sep-bio4-l7
  title: "Une philosophie naturaliste"
  notes: |-
    **La plupart des travaux de philosophie de la biologie sont délibérément {violet}naturalistes{/violet} : ils ne reconnaissent aucune discontinuité profonde, ni de méthode ni de contenu, entre philosophie et science.**

    **Ce qui distingue le philosophe du biologiste.** {green}__Idéalement, la philosophie de la biologie ne diffère pas de la biologie par ses connaissances, mais seulement par les questions qu'elle pose.__{/green} Le philosophe vise à maîtriser le contenu de la biologie au niveau professionnel, d'ordinaire avec {pink}une plus grande connaissance de son histoire, et moins de savoir-faire pratique{/pink}, que les biologistes. Il est courant qu'il ait des diplômes dans le domaine de sa recherche et travaille avec des scientifiques. Ce naturalisme se retrouve ailleurs, notamment en philosophie des neurosciences (Craver 2007).

    **Même la frontière des questions est floue.** Sur le deuxième type de questions (les problèmes conceptuels internes), {red}il n'y a pas de distinction nette entre philosophie de la biologie et biologie théorique{/red}. D'où l'accusation : les philosophes de la biologie auraient abandonné leur vocation pour le {red}« reportage scientifique »{/red}.

    **La réponse à l'accusation.** On peut retourner le propos : {coral}__un livre comme *Le Gène égoïste* de Dawkins est avant tout une contribution à la discussion philosophique de la biologie__{/coral}. Il n'y expose pas une nouvelle découverte, il change la façon de décrire l'évolution. Et les compétences professionnelles du philosophe servent ces problèmes internes autant que les autres. Enfin, {coral}les trois types de questions ne se relient aux résultats de la biologie que par de **longues chaînes d'arguments**{/coral} : c'est là que le philosophe a son métier.

    ! Le naturalisme n'interdit pas les questions de droit : il nie seulement qu'elles se posent depuis un lieu extérieur à la science.
  points:
  - id: sep-bio4-l7-p1
    sentence: "La plupart des travaux de philosophie de la biologie sont délibérément ___ : ils ne reconnaissent aucune discontinuité profonde de méthode ni de contenu entre philosophie et science."
    answer: "naturalistes"
    alt: []
  - id: sep-bio4-l7-p2
    sentence: "Idéalement, la philosophie de la biologie ne diffère pas de la biologie par ses connaissances, mais seulement par les ___ qu'elle pose."
    answer: "questions"
    alt: []
  - id: sep-bio4-l7-p3
    sentence: "Par rapport aux biologistes, le philosophe de la biologie a d'ordinaire une plus grande connaissance de l'___ de la discipline, et moins de savoir-faire pratique."
    answer: "histoire"
