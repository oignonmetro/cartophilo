- id: sep-bio4-l8
  title: "Les nouveaux terrains"
  notes: |-
    **La philosophie de la biologie reste un domaine parmi les plus dynamiques de la philosophie des sciences.** Une riche littérature émerge sur de nouveaux terrains, chacun associé ici à quelques noms.

    | Terrain | Quelques auteurs |
    | le cancer | Plutynski |
    | l'évolution culturelle | Sterelny, Lewens, O'Connor |
    | la nature humaine | Machery, Ramsey, Kronfeldner |
    | la microbiologie | O'Malley |
    | la paléobiologie | Turner, Currie |
    | la race | Andreasen, Spencer |

    **Ce qui les unit.** Ils reprennent les questions du champ sur de nouveaux objets : qu'est-ce qu'un individu, si le cancer est une lignée de cellules qui évolue ? Que devient l'{violet}espèce{/violet} chez des microbes qui échangent leurs gènes ? Que reste-t-il de la {violet}nature humaine{/violet} si les espèces n'ont pas d'essence ? Comment connaître un passé dont il ne reste que des traces ?
