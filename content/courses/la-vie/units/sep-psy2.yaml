- id: sep-psy2-l6
  title: "La nutrition, première des facultés"
  notes: |-
    **Aristote commence par la** {violet}**nutrition**{/violet}**, pour deux raisons liées.** La psychologie porte sur tout ce qui est animé, et l'âme nutritive se trouve partout : elle est {teal}« la première faculté de l'âme et la plus commune{/teal}, celle en vertu de laquelle {teal}la vie appartient à tous »{/teal} (II, 4, 415a24-25). Et, les formes supérieures la supposant, son explication passe avant dans l'ordre de l'exposé.

    **Un précepte de méthode :** __**une faculté se définit par ses objets**__**.** On distingue la {violet}sensation{/violet} de l'{violet}intelligence{/violet} parce que l'une vise les __qualités sensibles__, l'autre les __formes intelligibles__. L'ordre va donc des objets aux actes, et des actes aux facultés : {teal}« les facultés sont précédées par les actes et les actions, selon l'ordre logique »{/teal} (415a18-20), et les actes par leurs objets, {teal}« de la nourriture, du sensible et de l'intelligible »{/teal} (415a22).

    **Une distinction en apparence banale.** Dans la nutrition, il y a trois choses (II, 4, 416b20-23) :

    | Terme | Ce que c'est |
    | ce qui fait qu'on s'alimente | l'âme primordiale |
    | ce qui s'alimente | le corps pourvu de cette âme |
    | ce dont on s'alimente | la nourriture |

    **Son intérêt : seul un vivant peut se nourrir.** {teal}« Or nul ne se nourrit qui n'ait point part à la vie. »{/teal} (415b27-28) La conséquence est tirée plus loin : {teal}« {/teal}puisque {teal}rien ne se nourrit qui n'ait point part à la vie{/teal}, {teal}c'est le corps animé qui s'alimente{/teal}, en tant qu'il est animé, de telle sorte que la nourriture a une relation au sujet animé qui {teal}n'est pas accidentelle »{/teal} (416b9-11). Une chose n'est donc pas d'abord nourriture, puis, par chance, utile aux vivants : {coral}ce qui est __aliment__, en tant qu'aliment, se définit par rapport à la vie{/coral}.

    ! La thèse ne porte pas sur la composition de l'aliment : elle dit que rien n'est aliment, en tant qu'aliment, hors de sa relation à un être animé.
