- id: sep-psy2-l5
  title: "Représentation et appétit : deux facultés à part ?"
  notes: |-
    **Quelles capacités comptent comme des facultés à part entière ? Le point est disputé.** Aristote tient à l'évidence pour centrales la nutrition, la sensation et l'intelligence, qui lui servent à tracer la {amber}hiérarchie de la vie{/amber}. Mais il traite aussi de deux autres, qu'il emploie dans sa __théorie de la pensée et dans celle de l'action__, sans guère les caractériser en elles-mêmes.

    - La {violet}représentation{/violet} (`phantasia`, l'imagination, __III, 3__) : une {pink}faculté subordonnée{/pink}, semble-t-il, intégrée de diverses façons à la nutrition, à la sensation et à la pensée.
    - L'{violet}appétit{/violet} (`orexis`, {violet}« désir »{/violet} dans bien des traductions, __III, 9-10__) : plus complexe. Il ne se trouve pas sans la sensation, mais finit élevé au rang de {green}faculté à part entière{/green}, surtout à cause de son rôle dans l'explication de la conduite orientée vers un but.

    Sur ce dernier point, le lien est démontré dès II, 3 : {teal}« qui se trouve doué de __sensation__, est aussi accessible au plaisir et à la peine »{/teal} (414b4), et donc au {violet}désir{/violet}, {teal}« puisque ce dernier est __l'appétit de l'agréable__ »{/teal} (414b6).

    **Une difficulté qu'Aristote voit lui-même.** Découper l'âme selon ses capacités fait surgir des parties sans fin : {teal}« elles sont manifestement en nombre infini »{/teal} (III, 9, 432a24), et le découpage du calcul, de l'ardeur et du désir, en particulier, ne convient pas à l'appétit, qui se trouverait dans chacune : {teal}« il est déplacé de la mettre en morceaux »{/teal} (432b5). {coral}C'est le même souci de l'unité de l'âme : comment ses capacités s'intègrent-elles en une seule forme ?{/coral}

    ! « Représentation » traduit ici `phantasia` : cela ne veut pas dire une image intentionnellement produite, ni une fiction.
