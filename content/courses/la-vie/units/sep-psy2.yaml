- id: sep-psy2-l3
  title: "L'âme est-elle séparable ?"
  notes: |-
    **Seconde leçon de l'hylémorphisme : la** {violet}**séparabilité**{/violet} **de l'âme**, que les dualistes admettent depuis Platon. L'argument est une analogie : {amber}__si nous ne pensons pas que la figure d'Hermès persiste une fois le bronze fondu, nous n'avons pas à penser que l'âme survit à la disparition du corps.__{/amber} À moins d'admettre que les formes en général existent sans leur matière, il n'y a pas à faire des âmes un cas d'exception.

    {teal}« On voit donc sans peine que l'âme n'est pas séparable du corps ou qu'elle a des parties qui ne le sont pas, si tant est que la nature l'ait faite morcelable. »{/teal} (II, 1, 413a3-5)

    **Mais la phrase a une réserve.** L'hylémorphisme ne réfute pas toute forme de dualisme : la raison de l'inséparabilité est que l'âme est réalisation de parties du corps, donc là où ce n'est pas le cas, la raison ne vaut plus.

    {teal}« Mais, bien évidemment, en certaines autres parties, rien n'empêche la séparation, parce qu'elles ne sont réalisations d'aucun corps. »{/teal} (413a6-7)

    {coral}Aristote annonce ainsi sa position complexe sur l'intelligence{/coral}, qu'il présente toujours comme une exception parmi les facultés. Il le redit en II, 2 : {teal}« il y a apparence que ce soit un genre d'âme différent. Et il se peut que lui seul soit séparé, comme l'éternel du périssable »{/teal} (413b25-27).

    **Une voie moyenne.** L'âme explique que cette matière soit celle d'un homme, comme la forme fait que ces briques et ce mortier soient {yellow}une maison, plutôt qu'un mur ou un four{/yellow}, en remplissant la fonction de la maison, l'abri. Aristote donne donc à la fois raison et tort aux dualistes :
    - **Platon et les dualistes ont raison** : on ne peut expliquer un vivant sans parler de son âme.
    - **Ils ont tort** de conclure de là à la séparabilité, puisque l'appel à la cause formelle ne l'établit pas : l'âme peut être distincte du corps, et en être la réalisation, sans pouvoir exister sans lui.

    {green}__L'hylémorphisme n'embrasse donc ni le matérialisme réducteur ni le dualisme platonicien__{/green} : il montre, implicitement, que ce ne sont pas les seules options. Le mot juste est ici : {teal}« Elle n'est pas un corps, en effet, mais quelque chose du corps. »{/teal} (II, 2, 414a20-21)

    ! Le *De l'âme* ne dit pas que l'âme meurt tout entière : le passage laisse ouverte la question d'une partie qui ne serait réalisation d'aucun corps.
