- id: sep-psy2-l7
  title: "Pas de définition réductive de la vie"
  notes: |-
    **L'observation sur la nourriture porte loin : elle barre la route à une définition réductive de la vie.**

    **La circularité.** Toute explication adéquate de la nutrition doit mentionner la vie. Essayons donc de définir la vie par la nutrition :
    - un système vivant est ce qui peut se nourrir ;
    - or la nourriture est ce qui peut entretenir un système vivant.

    {red}__Le cercle est vicieux__{/red} : chaque terme sert à définir l'autre. Si l'on ne peut définir autrement les systèmes vivants, on n'aura pas de définition réductive de la vie. {coral}Aristote résistera donc à toute définition de la vie en des termes qui ne la supposent pas déjà.{/coral}

    **Contre les explications mécaniques de la croissance** (415b27-416a20). Aristote rejette ceux qui expliquent la croissance par les seules tendances des éléments. Empédocle fait croître les plantes vers le bas par la terre, vers le haut par le feu ; mais {teal}« qu'est-ce qui assure la cohésion du feu et de la terre qui se portent en sens opposés ? »{/teal} (416a6-7) D'autres font du feu la cause de la croissance, puisqu'il semble seul à s'alimenter et à croître. Or :

    {teal}« la croissance du feu s'étend à l'infini, tant que le combustible est disponible, alors que les systèmes que forme la nature ont tous une limite et un ordre de grandeur ainsi que de croissance »{/teal} (416a15-17)

    **L'argument est celui de la limite.** Le feu croît au hasard, sans direction, vers tout ce qui brûle, jusqu'à être arrêté du dehors, par un obstacle ou le manque de combustible. {green}__Un vivant, lui, cesse de croître de lui-même, une fois atteinte la structure de son espèce__{/green} : un chêne ne devient pas indéfiniment plus grand parce qu'il a de la terre. Sa croissance suit des voies structurées vers une fin, et ce fait {teal}« manifeste une proportion plutôt qu'une matière »{/teal} (416a17-18).

    **Une portée encore actuelle ?** Les matérialismes visés sont primitifs. On peut donc se demander si la croissance limitée est incompatible avec un matérialisme plus avancé, et s'il serait réducteur au sens d'éviter toute référence à la vie. Jusqu'ici, rien ne prouve qu'Aristote se trompe : {coral}il n'existe pas de définition réductive de la vie qui fasse l'accord général.{/coral} Son approche se retrouve dans toutes les facultés : il rend compte des phénomènes, et il éprouve en même temps la plausibilité d'une réduction.

    ! Refuser la réduction n'est pas revenir au vitalisme : Aristote n'ajoute aucune force au corps, il dit que la vie ne se définit pas sans la vie.
