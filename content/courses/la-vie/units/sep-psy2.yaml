- id: sep-psy2-l3
  title: "L'âme est-elle séparable ?"
  notes: |-
    **Seconde leçon de l'hylémorphisme : la** {violet}**séparabilité**{/violet} **de l'âme**, que les dualistes admettent depuis Platon. L'argument est une analogie : {yellow}__si nous ne pensons pas que la figure d'Hermès persiste une fois le bronze fondu__{/yellow}{amber}__, nous n'avons pas à penser que l'âme survit à la disparition du corps.__{/amber} À moins d'admettre que les formes en général existent sans leur matière, il n'y a pas à faire des âmes un cas d'exception.

    {teal}« {/teal}On voit donc sans peine que {teal}l'âme n'est pas séparable du corps{/teal} ou qu'{teal}elle a des parties qui ne le sont pas{/teal}, si tant est que la nature l'ait faite morcelable.{teal} »{/teal} (II, 1, 413a3-5)

    **Mais la phrase a une réserve.** L'hylémorphisme ne réfute pas toute forme de dualisme : la raison de {amber}l'inséparabilité{/amber} est que l'âme est {amber}réalisation{/amber} de parties du corps, donc {pink}là où ce n'est pas le cas, la raison ne vaut plus{/pink}. Elle est donc potentiellement séparable dans les parties du corps qu'elle n'anime pas : {teal}« {/teal}en certaines autres parties, {teal}rien n'empêche la séparation{/teal}, parce qu'{teal}elles ne sont réalisations d'aucun corps. »{/teal} (413a6-7)

    {coral}Aristote{/coral} annonce ainsi sa {coral}position complexe sur l'intelligence{/coral}, qu'il présente toujours comme une exception parmi les facultés. Il le redit en II, 2 : {teal}« {/teal}il y a apparence que ce soit {teal}un genre d'âme différent{/teal}. Et il se peut que {teal}lui seul soit séparé{/teal}, {teal}comme l'éternel du périssable »{/teal} (413b25-27).

    **Une voie moyenne.** L'âme explique que cette matière soit celle d'un homme, comme la forme fait que ces briques et ce mortier soient une maison, plutôt qu'un mur ou un four, en {coral}remplissant la fonction de{/coral} la maison, l'abri. Aristote donne donc à la fois raison et tort aux dualistes :
    - {sky}**Platon**{/sky} **et les** {sky}**dualistes**{/sky} **ont raison** : {green}on ne peut expliquer un vivant sans parler de son âme{/green}.
    - **Ils ont tort** de conclure de là à la {red}séparabilité{/red}, puisque l'appel à la cause formelle ne l'établit pas : {red}l'âme peut être distincte du corps, et en être la réalisation, sans pouvoir exister sans lui{/red}.

    __L'__{violet}__hylémorphisme__{/violet} __n'embrasse donc ni le__ {pink}__matérialisme réducteur__{/pink} __ni le__ {pink}__dualisme platonicien__{/pink} : il montre, implicitement, que ce ne sont pas les seules options. Le mot juste est ici : {teal}« Elle n'est pas un corps, en effet, mais quelque chose du corps. »{/teal} (II, 2, 414a20-21)

    ! Le *De l'âme* ne dit pas que l'âme meurt tout entière : le passage laisse ouverte la question d'une partie qui ne serait réalisation d'aucun corps.
