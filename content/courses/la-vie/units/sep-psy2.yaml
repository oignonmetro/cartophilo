# Cours sur la psychologie d'Aristote (voir content/philosophie.md), tiré de
# l'article « Aristotle's Psychology » de Christopher Shields, Stanford
# Encyclopedia of Philosophy : sections 3, 4 et 5. Citations du De l'âme dans la
# traduction de Bodéüs (Œuvres complètes, Flammarion). Certains passages cités
# ici (la hache, l'œil, la science et l'acte de spéculer, les figures) viennent
# directement du De l'âme, pour expliquer ce que l'article résume. Les
# suppléments sur l'hylémorphisme, simples renvois, ne figurent pas dans le PDF
# fourni. Le renvoi de l'article à « iii 7, 412a12-14 » pour l'appétit paraît
# fautif et n'est pas repris.

