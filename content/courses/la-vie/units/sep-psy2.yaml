- id: sep-psy2-l7
  title: "Pas de définition réductive de la vie"
  notes: |-
    **L'observation sur la nourriture porte loin : elle barre la route à une** {pink}**définition réductive**{/pink} **de la vie.**

    **Ce qu'est une définition réductive.** Réduire une notion, c'est la ramener à d'autres, jugées plus fondamentales. Une {violet}définition réductive de la vie{/violet} dirait ce qu'est un vivant {amber}sans employer la vie{/amber}, {amber}ni rien qui la suppose{/amber} (âme, nutrition, organisme), {amber}en termes seulement physiques{/amber} : éléments, mouvements, combinaisons. « Le vivant est un corps de terre et de feu où chaque élément suit sa tendance » serait réductif ; « le vivant est ce qui se nourrit » ne l'est que si l'on sait dire ce qu'est la nourriture sans parler du vivant.

    ! « Réductive » traduit *reductive* (Shields), le terme de la philosophie de l'esprit quand elle demande si le mental se réduit au physique. Ne pas dire « réductrice » : le mot n'a rien de péjoratif, il ne dit pas que la définition appauvrit la vie.

    **La circularité.** Toute explication adéquate de la nutrition doit mentionner la vie. Essayons donc de définir la vie par la nutrition : un système vivant est ce qui peut se nourrir ; or la nourriture est ce qui peut entretenir un système vivant.

    {red}__Le cercle est vicieux__{/red} : chaque terme sert à définir l'autre. Si l'on ne peut définir autrement les systèmes vivants, on n'aura pas de définition réductive de la vie. {coral}Aristote résistera donc à toute définition de la vie en des termes qui ne la supposent pas déjà.{/coral}

    **Pourquoi la croissance vient ici.** Les explications que vise Aristote sont justement des {pink}tentatives de réduction{/pink}. Croître est une fonction vitale ; or elles l'expliquent par les {amber}tendances naturelles des éléments{/amber}, qui ne doivent rien à la vie : la terre va vers le bas, le feu vers le haut, dans un corps vivant comme dans une pierre ou une flamme. Si elles réussissaient, la croissance s'expliquerait {pink}sans la vie{/pink}, et l'on tiendrait le début d'une définition réductive. {coral}Les réfuter, c'est montrer sur un cas que la réduction échoue.{/coral}

    **Contre les** {red}**explications mécaniques de la** __**croissance**__{/red} (415b27-416a20). Aristote rejette ceux qui expliquent la croissance par les seules tendances des éléments. {sky}Empédocle{/sky} fait croître les plantes {pink}vers le bas par la terre{/pink}, {pink}vers le haut par le feu{/pink} ; mais {teal}« {/teal}qu'est-ce qui assure {teal}la cohésion du feu et de la terre{/teal} qui se portent {teal}en sens opposés ? »{/teal} (416a6-7) D'autres font du {pink}feu la cause de la croissance{/pink}, puisqu'il semble seul à s'alimenter et à croître. Or : {teal}« la croissance du feu s'étend à l'infini{/teal}, tant que le combustible est disponible, alors que les systèmes que forme la nature ont tous {teal}une limite et un ordre de grandeur{/teal} ainsi que de croissance{teal} »{/teal} (416a15-17).

    **L'argument est celui de la** {violet}**limite**{/violet}**.** Le {pink}feu{/pink} {pink}croît au hasard{/pink}, sans direction, vers tout ce qui brûle, jusqu'à être arrêté du dehors, par un obstacle ou le manque de combustible. {green}__Un vivant, lui, cesse de croître de lui-même, une fois atteinte la structure de son espèce__{/green} : un chêne ne devient pas indéfiniment plus grand parce qu'il a de la terre. Sa croissance suit des voies structurées vers {violet}une fin{/violet}, et ce fait {teal}« manifeste une proportion plutôt qu'une matière »{/teal} (416a17-18).

    **La conclusion : la limite vient de l'âme.** {teal}« Or cela tient à l'âme »{/teal} (416a18). Ce qui fixe la limite n'est pas la matière du vivant, qui pousserait aussi loin que le feu, mais sa {violet}forme{/violet}, c'est-à-dire son âme. De même pour la cohésion : si quelque chose tient ensemble la terre et le feu, c'est l'âme, cause de la croissance et de la nutrition (416a8-9). {coral}L'élément n'explique pas la croissance : la vie l'explique.{/coral}

    {amber}__**« Ce qui croît jusqu'à une limite » ne serait-il pas une définition non circulaire ?**__{/amber} La formule ne nomme pas la vie. **Non, pour deux raisons.**
    - **Toute limite ne convient pas.** Le feu aussi s'arrête, faute de combustible ; un cristal cesse de grossir quand la solution s'épuise. La limite qui distingue le vivant vient {green}du dedans{/green}, non {red}du dehors{/red} : c'est la taille propre à l'espèce, l'{teal}« ordre de grandeur »{/teal} du chêne ou du cheval. Or dire « la taille du chêne adulte », c'est déjà parler du vivant et de sa forme. {coral}La clause paraît neutre ; ce qu'elle désigne ne l'est pas : elle réintroduit l'âme.{/coral}
    - **Aristote ne s'en sert pas pour définir, mais pour expliquer.** La limite est un fait que la matière seule ne produit pas ; il en conclut à une cause qui n'est pas la matière. L'argument montre qu'une explication réductive de la croissance échoue ; il ne propose pas de définition de rechange.

    **Une portée encore actuelle ?** Les matérialismes visés sont primitifs. Tout repose donc sur la première raison : un matérialisme plus avancé, la génétique par exemple, qui règle la taille adulte par des mécanismes chimiques, pourrait-il produire la limite interne sans faire référence à la vie ? Si oui, la croissance limitée deviendrait l'amorce d'une définition réductive. La question reste ouverte, et jusqu'ici rien ne prouve qu'Aristote se trompe : {coral}il n'existe pas de définition réductive de la vie qui fasse l'accord général.{/coral} Son approche se retrouve dans toutes les facultés : il rend compte des phénomènes, et il éprouve en même temps la plausibilité d'une réduction.

    ! Refuser la réduction n'est pas revenir au vitalisme : Aristote n'ajoute aucune force au corps, il dit que la vie ne se définit pas sans la vie.
