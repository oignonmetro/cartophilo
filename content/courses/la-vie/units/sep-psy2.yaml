- id: sep-psy2-l2
  title: "L'âme et le corps font-ils un ?"
  notes: |-
    **Le rapport de l'âme et du corps se ramène à une analogie générale.**

    | Terme | Sa contrepartie |
    | l'âme | le corps |
    | la forme | la matière |
    | la figure d'Hermès | le bronze |

    **Une querelle court-circuitée.** Le {pink}matérialiste{/pink} tient que tous les états mentaux sont aussi des états physiques. Le {pink}dualiste des substances{/pink} le nie, parce que l'âme est pour lui un sujet qui peut exister seul, séparé du corps. Or, __si nous ne voyons pas de question importante à demander si la figure d'Hermès et son bronze sont un, nous n'avons pas de raison d'en voir une pour l'âme et le corps__. Autrement dit, la question de l'union de l'âme et du corps est considérée comme un **faux problème** par Aristote :

    {teal}« {/teal}C'est pourquoi l'{teal}__on n'a même pas besoin de chercher__ si le corps et l'âme font un, exactement comme on ne le demande non plus de la cire et de la figure{/teal}, ni, globalement, de la matière de chaque chose et de ce qui a cette matière. Car l'un et l'être, dont on parle effectivement en plusieurs sens, c'est, souverainement, {teal}la réalisation{/teal}.{teal} »{/teal} (II, 1, 412b6-9)

    **Ce que la phrase ne dit pas.** Aristote ne déclare pas la question dépourvue de sens : il la dégonfle, comme une question facile ou sans importance. __Il ne tranche pas non plus en disant que l'âme et le corps sont identiques__, ce qu'il nie ailleurs (412a17 ; 414a1-20). De la cire d'une bougie et de sa figure, on peut soutenir qu'elles sont distinctes : {yellow}la cire peut exister quand la figure n'est plus, et la figure peut survivre au remplacement de sa matière{/yellow}. De même, on peut nier l'identité de l'âme et du corps.

    **Ce qui lui ôte sa force.** La {pink}question de l'unité{/pink} perd son poids dès lors qu'{pink}__elle n'implique rien de plus que pour un autre composé__{/pink}, une maison ou un objet fabriqué : elle n'a plus l'air de contenir le secret de ce que nous sommes.
