lessons:
- id: sep-psy2-l1
  title: "Les définitions de l'âme"
  notes: |-
    **Le *De l'âme* donne de l'âme trois formules, qui valent pour les plantes, les animaux et les hommes.** Elles emploient le vocabulaire de l'hylémorphisme, et leur enchaînement est le suivant (__II, 1__).

    {teal}« Il faut donc nécessairement que l'âme soit substance comme __forme d'un corps naturel qui a potentiellement la vie__. »{/teal} (412a19-21)

    {teal}« l'âme est la __réalisation première__ d'un corps naturel qui a potentiellement la vie »{/teal} (412a27-28)

    {teal}« la réalisation première d'un corps naturel __pourvu d'organes__ »{/teal} (412b5-6)

    **Pourquoi « première » ?** La réalisation s'entend de deux façons, {yellow}« comme la science »{/yellow} et {yellow}« comme l'acte de spéculer »{/yellow}. Celui qui sait la géométrie la possède même quand il n'y pense pas ; celui qui la pratique l'exerce. Or {green}__l'âme est présente aussi dans le sommeil__{/green}, où le vivant n'exerce rien : elle est donc comme la science possédée, non comme son exercice. Elle est une capacité en place, non une activité en cours.

    **« Qui a potentiellement la vie ».** Le piège est de lire là un corps mort qui attendrait la vie. C'est le contraire : {teal}« ce n'est pas lorsqu'il se trouve dépouillé de son âme que le corps a la puissance de vivre, mais lorsqu'il la possède »{/teal} (412b25-26).

    **Deux images d'Aristote.** Si un outil était un corps naturel, {yellow}l'âme de la hache{/yellow} serait ce qui la fait hache : ôtez-le, {teal}« il n'y aurait plus de hache, sauf de façon purement nominale »{/teal} (412b14-15). Plus près du vivant : {teal}« Si l'œil, en effet, était un animal, la vue en serait l'âme »{/teal} (412b18-19). L'œil sans vue n'est plus un œil que de nom, {yellow}comme l'œil en pierre ou celui qui est dessiné{/yellow}. La hache a une limite : elle n'a pas en elle-même le principe de son mouvement, ce qui est le propre du corps naturel.

    ! L'âme n'est pas une chose logée dans un corps : elle est ce qui fait de ce corps un vivant qui peut exercer ses fonctions, comme la vue fait d'un œil un œil.
