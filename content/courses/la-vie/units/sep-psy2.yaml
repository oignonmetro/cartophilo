- id: sep-psy2-l4
  title: "La hiérarchie des facultés"
  notes: |-
    **Aristote consacre l'essentiel de son effort non à la formule générale de l'âme, mais à ses facultés.** Il énumère d'abord la {amber}nutrition{/amber}, la {amber}sensation{/amber} et l'{amber}intelligence{/amber}, la sensation recevant la part du lion ; plus tard, il ajoute l'appétit.

    | Vivant | Nutrition | Sensation | Intelligence |
    | plante | oui | non | non |
    | animal | oui | oui | non |
    | homme | oui | oui | oui |

    **Ce n'est pas une simple liste, c'est une série.** Qui a la raison a la sensation ; qui a la sensation a la nutrition et la reproduction ; l'inverse n'est pas vrai. {teal}« {/teal}Car {teal}sans le nutritif, le sensitif n'existe pas{/teal}, mais {teal}le nutritif se détache du sensitif{/teal} chez les plantes.{teal} »{/teal} (II, 3, 415a1-2)

    **Les raisons sont téléologiques.** Tout vivant, en tant que tel, croît, atteint la maturité, décline. __Sans faculté nutritive, ces activités seraient impossibles__ (III, 12, 434a22-b18) : {teal}« {/teal}L'être qui est né exige, en effet, nécessairement {teal}croissance, maturité et dépérissement{/teal}. Or {teal}cela ne se peut sans nutrition. »{/teal} Voilà pourquoi la psychologie doit traiter de la nutrition, et non de la seule perception ou de la seule pensée.

    **L'unité de l'âme : l'image des figures.** Une âme est-elle la somme de ses facultés ? Certains interprètes s'en contentent ; Aristote exige une unité non agrégative (II, 3, 414b28-32). Il compare les âmes aux figures : {teal}« le quadrilatère implique le triangle et le sensitif, le nutritif »{/teal}. Un carré n'est pas un triangle plus un autre élément posé à côté : il contient le triangle en puissance. De même, {coral}l'âme d'un homme n'est pas une âme de plante à laquelle s'ajouterait une âme de bête{/coral}. Aussi est-il {red}« ridicule »{/red} de chercher {red}une seule formule commune, sans chercher celle de l'âme de chaque vivant{/red} : {teal}« {/teal}comme le fait de vivre {teal}s'entend de plusieurs façons{/teal}, nous prétendons qu'il y a {teal}vie{/teal} là où se trouve ne serait-ce qu'une seule quelconque des manifestations telles que l'{teal}intelligence{/teal}, la {teal}sensation{/teal}, {teal}le mouvement local et le repos{/teal}, ou encore le {teal}mouvement nutritif{/teal}, {teal}dépérissement et croissance »{/teal} (II, 2).

    ! Il ne faut pas lire la hiérarchie comme un empilement de trois âmes logées en nous : l'homme a une seule âme, de même qu'un quadrilatère n'est pas plusieurs figures.
