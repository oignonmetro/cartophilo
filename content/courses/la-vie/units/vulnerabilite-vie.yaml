- id: vulnerabilite-vie-l3
  title: "I. Descartes : la montre rompue"
  notes: |-
    Descartes répond à la question laissée par Aristote, **comment une activité peut défaillir**, au prix d'un geste qui semble d'abord réduire la vie à l'inerte : le corps vivant est une machine, et {green}ce qui fait que la machine se meut est exactement ce qui fait qu'elle peut se rompre{/green}.

    **L'âme retirée de l'explication.** Pour Descartes, {red}c'est une erreur de croire que l'âme donne au corps le mouvement et la chaleur{/red} : la mort n'arrive jamais par la faute de l'âme, mais **seulement parce que quelqu'une des principales parties du corps se corrompt**. Le corps vivant diffère du corps mort comme une {yellow}montre{/yellow} ou un autre {violet}automate{/violet} diffère d'elle-même, selon qu'elle est {teal}« montée et qu'elle a en soi le principe corporel des mouvements pour lesquels elle est instituée »{/teal}, ou qu'elle est {teal}« rompue et que le principe de son mouvement cesse d'agir »{/teal} ({sky}*Les Passions de l'âme*, art. 5 et 6{/sky}).

    **L'argument en trois temps.**
    - __Vivre, c'est être un automate__ au sens propre : une machine qui a en elle le principe de son mouvement, une chose qui se meut d'elle-même.
    - __Ce qui distingue le vivant de l'inerte est donc une organisation__ : des parties qui concourent à un même mouvement, comme les roues d'une horloge concourent à marquer l'heure.
    - __Cette organisation est aussi ce qui le rend vulnérable__ : un ensemble de parties qui concourent peut se rompre là où une masse inerte ne le peut pas, et **plus le concours est complexe, plus nombreux sont les points où il peut céder**.

    **Rompre n'est pas briser.** Une pierre brisée donne deux pierres ; {red}une montre rompue n'est plus une montre{/red}, et pourtant sa matière est intacte, chaque roue est encore là. De même, **le cadavre a la même matière que le corps vivant** quelques instants plus tôt. La rupture ne concerne pas la matière mais le {violet}fonctionnement{/violet} : {coral}l'inerte peut être fragmenté, il ne peut pas être rompu{/coral}.

    **Le dérèglement vient du fonctionnement même.** Dans la {sky}*Sixième Méditation*{/sky}, Descartes compare le corps de l'{violet}hydropique{/violet}, qui a soif alors que boire lui nuit, à {yellow}une horloge mal réglée{/yellow} qui n'en suit pas moins exactement les lois de son mécanisme. Le dérèglement n'est pas introduit du dehors : le fonctionnement, dans des circonstances anormales, __se retourne contre ce qu'il servait à conserver__. {coral}La vulnérabilité est intérieure au mécanisme.{/coral}

    **Objection et réponse.** {red}Descartes n'efface-t-il pas la différence du vivant et de l'inerte, puisqu'une montre ne meurt pas, elle s'arrête ?{/red} Mais chez lui la distinction qui compte ne passe pas entre la vie et la machine : elle passe **entre la machine montée et la machine rompue**, entre ce qui fonctionne et ce qui ne fonctionne plus. Or c'est celle qui intéresse la vulnérabilité : {green}est vulnérable ce qui fonctionne, parce que seul ce qui fonctionne peut cesser de fonctionner{/green}. Le mécanisme ne contredit donc pas Aristote, **il en donne la raison** : la mort est l'arrêt d'une activité, non la destruction d'une matière.

    **Bilan de la première partie.** Aristote pose que seul le vivant dépérit par lui-même ; Descartes l'explique, puisque seul ce qui fonctionne peut se rompre. La bulle de David Vetter apparaît alors comme {red}une protection impossible{/red} : ce qui rendait l'enfant vulnérable, c'était sa vie elle-même.

    **La montre est « montée ».** La montre ne fonctionne que si elle est {teal}« montée »{/teal} : son mouvement vient d'une force donnée du dehors, et elle s'arrête si on ne la remonte pas ; de même, le corps ne se meut que s'il est nourri. __La vulnérabilité tient-elle à l'activité, ou à ce dont l'activité dépend ?__
