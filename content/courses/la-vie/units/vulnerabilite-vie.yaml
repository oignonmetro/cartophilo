    sentence: "Pour ___, parmi les corps naturels, les uns ont la vie et les autres ne l'ont pas, et vivre, c'est « se nourrir, croître et dépérir par soi-même » : premier appui de la thèse d'une vulnérabilité constitutive de la vie."
    answer: "Aristote"
    alt: []
