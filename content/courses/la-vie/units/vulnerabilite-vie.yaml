- id: vulnerabilite-vie-l6
  title: "II. La vie au singulier : Aristote, Jonas"
  notes: |-
    Dernier temps de la deuxième partie : si le vivant est vulnérable parce qu'il dépend, **la vie au singulier**, que le sujet invite à considérer, semble y échapper, puisqu'elle se renouvelle. Jonas montre qu'elle n'est devenue vulnérable que **du dehors**, et cet argument prépare le renversement de la troisième partie.

    **La vie se maintient par l'espèce.** Aristote observe que la fonction la plus naturelle des vivants est {teal}d'engendrer un autre être semblable à eux{/teal}, afin de **participer à l'éternel et au divin dans la mesure où ils le peuvent** : ne pouvant demeurer les mêmes {pink}en nombre{/pink}, ils demeurent les mêmes {green}en espèce{/green} ({sky}*De l'âme*, II, 4, 415a26-b7{/sky}). Chaque vivant meurt, mais la vie se maintient à travers la mort des individus, par le **renouvellement des générations**. À cette échelle, la vulnérabilité de chaque vivant est compensée : la vie a traversé {yellow}les épidémies, les famines et les extinctions{/yellow}, et s'est chaque fois renouvelée.

    **Ce qui a changé : la technique.** Pour Jonas, la technique moderne a modifié **la nature même de l'agir humain** : pour la première fois, l'action humaine peut atteindre {red}la biosphère dans son ensemble et les conditions d'existence des générations futures{/red} ({sky}*Le Principe responsabilité*, ch. I{/sky}). L'{yellow}arme nucléaire{/yellow} en est l'exemple le plus net : __aucun processus vital ne la produit__, et la vie ne pourrait s'en relever par la reproduction, puisqu'elle __détruirait les conditions mêmes de toute reproduction__.

    **L'argument tiré de Jonas.**
    - La vie en général ne porte pas en elle ce qui la rendrait vulnérable, puisqu'elle se renouvelle.
    - Si elle est devenue vulnérable, c'est sous l'effet d'une cause qui excède ce renouvellement : une action technique qui ne fait plus partie du cycle par lequel la vie se reproduit.
    - Que cette vulnérabilité soit apparue **tardivement**, avec **un agent déterminé**, {coral}montre qu'elle n'appartenait pas à la vie elle-même{/coral}.

    {green}La vulnérabilité de la vie, c'est une exposition qui lui vient d'ailleurs{/green} : à l'échelle de la vie elle-même, elle n'apparaît que lorsqu'un agent extérieur au renouvellement peut l'atteindre.

    **Bilan de la deuxième partie.** La deuxième partie a établi que la vulnérabilité naît de l'ouverture à un dehors dont le vivant dépend : il ne peut se fermer ; seule une vie sans dépendance serait invulnérable ; la vie en général n'est devenue vulnérable que du dehors. Mais Jonas fait apparaître une distinction : **ce qui appartient en propre à la vie, ce n'est pas la vulnérabilité, c'est le renouvellement par lequel elle résiste** ; de même, la montre de Descartes se rompt, mais ce qui lui appartient, c'est le mouvement, {red}la rupture lui arrive{/red}. D'où la question : __la vulnérabilité ne viendrait-elle pas du dehors, ce qui est interne à la vie étant la résistance qu'elle lui oppose ?__
  points:
  - id: vulnerabilite-vie-l6-p1
    sentence: "Pour Aristote, la fonction la plus naturelle des vivants est d'engendrer un autre être semblable à eux, afin de participer à l'éternel et au ___ dans la mesure où ils le peuvent."
    answer: "divin"
    alt: []
  - id: vulnerabilite-vie-l6-p2
