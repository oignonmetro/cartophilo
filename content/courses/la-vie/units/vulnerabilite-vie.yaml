- id: vulnerabilite-vie-l7
  title: "III. Spinoza, Bichat : la mort vient du dehors"
  notes: |-
    La troisième partie dénoue le problème : {green}la vulnérabilité vient du dehors, et ce qui appartient en propre à la vie, c'est la résistance qu'elle lui oppose{/green}. Premier temps : Spinoza et Bichat posent la thèse, qui permet de relire la première partie sans la renier.

    **Ce que la première partie avait vraiment montré.** Que seul le vivant peut périr, parce qu'il agit. Or Plotin a montré que l'activité comme telle n'est pas vulnérable. {red}On croyait avoir trouvé la vulnérabilité au cœur de la vie{/red} ; {green}on y avait trouvé ce qui lui résiste{/green}, considéré **depuis le moment où il cède**.

    **Spinoza : nulle chose ne se détruit elle-même.** {teal}« Nulle chose ne peut être détruite, sinon par une cause extérieure »{/teal} ({sky}*Éthique*, III, prop. 4{/sky}). La démonstration : __la définition d'une chose affirme ce qu'elle est et ne le nie pas__, de sorte qu'on ne peut trouver dans la chose elle-même rien qui puisse la détruire. Il s'ensuit que chaque chose, {teal}« autant qu'il est en elle, s'efforce de persévérer dans son être »{/teal} ({sky}III, prop. 6{/sky}). Cet effort est le {violet}`conatus`{/violet} (terme latin : la tendance de chaque chose à se maintenir) : chez un {yellow}animal blessé{/yellow}, ce qui le fait se débattre, fuir, puis lécher sa plaie.

    **Bichat : la version biologique.** {teal}« La vie est l'ensemble des fonctions qui résistent à la mort »{/teal}, car {teal}« tel est en effet le mode d'existence des corps vivants, que tout ce qui les entoure tend à les détruire »{/teal} ({sky}*Recherches physiologiques sur la vie et la mort*, première partie, art. 1{/sky}). {coral}La mort vient du dehors, et la vie est la résistance qui lui est opposée.{/coral}

    **La première partie relue.**
    - Le « dépérir par soi-même » d'Aristote n'est pas une opération que la vie accomplirait comme elle se nourrit : c'est __la défaillance de sa résistance__, le moment où l'activité qui se maintenait cède devant ce qui la surpasse.
    - Descartes disait lui-même que la mort survient parce qu'une partie {teal}« se corrompt »{/teal} : __la rupture arrive au fonctionnement__, le fonctionnement ne tend pas de lui-même à sa rupture.
    - L'{violet}hydropique{/violet} ne veut pas sa perte : il est **trompé**, dans une circonstance anormale, par un mécanisme qui sert d'ordinaire à le conserver.
  points:
  - id: vulnerabilite-vie-l7-p1
    sentence: "La troisième partie reprend la première : on croyait y avoir trouvé la vulnérabilité au cœur de la vie ; on y avait trouvé ce qui lui ___, considéré depuis le moment où il cède."
    answer: "résiste"
    alt: ["resiste"]
  - id: vulnerabilite-vie-l7-p2
    sentence: "Pour ___, « nulle chose ne peut être détruite, sinon par une cause extérieure » : premier appui de la thèse que la vulnérabilité vient du dehors."
    answer: "Spinoza"
    alt: []
