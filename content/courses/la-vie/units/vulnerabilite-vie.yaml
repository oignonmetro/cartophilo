- id: vulnerabilite-vie-l5
  title: "II. Plotin : la vie qui ne manque de rien"
  notes: |-
    Pour trancher entre l'activité comme telle (I) et l'activité dépendante (II), il faudrait **concevoir une vie pleinement active qui ne dépende de rien** et voir si elle reste vulnérable. Plotin conçoit une telle vie, et l'argument qu'on en tire montre que {green}ce n'est pas l'activité qui rend vulnérable, c'est la dépendance{/green}.

    **La vie de l'Intellect.** Pour Plotin, la vie véritable et parfaite n'est pas celle des corps, c'est celle de l'{violet}Intellect{/violet}, dont les autres vies ne sont que **des images affaiblies** ({sky}*Ennéades*, I, 4 [46], *Sur le bonheur*{/sky}). Cette vie est {violet}éternelle{/violet}, et l'éternité {red}n'est pas une durée sans fin{/red} : {green}c'est une vie qui demeure tout entière présente à elle-même, à laquelle rien ne manque et qui n'a rien à attendre de l'avenir{/green}, alors que les choses engendrées ont besoin de l'avenir et doivent sans cesse acquérir ce qu'elles n'ont pas encore pour continuer d'être ({sky}III, 7 [45], *Sur l'éternité et le temps*{/sky}). Au sommet, le Principe d'où tout procède est **ce qu'il y a de plus autosuffisant**, puisqu'il n'a besoin de rien ({sky}VI, 9 [9], *Sur le Bien ou l'Un*{/sky}).

    **Ce que montre la vie de l'Intellect, opposé de la vie biologique.**
    - __La vie de l'Intellect est invulnérable__ : on ne peut rien lui retirer, puisqu'elle ne reçoit rien.
    - __Elle se caractérise par l'autarcie__ ({violet}autarcie{/violet}, terme grec : le fait de se suffire à soi-même) : elle ne manque de rien et ne dépend de rien d'extérieur.
    - __Point décisif : elle n'est pas inactive__, elle est au contraire, pour Plotin, **l'activité la plus pleine qui soit**.

    **Conclusion** : {coral}ce n'est pas l'activité comme telle qui rend vulnérable, c'est l'activité dépendante{/coral}. La première partie s'en trouve corrigée : la {yellow}montre{/yellow} de Descartes n'était pas vulnérable parce qu'elle fonctionnait, mais **parce qu'elle fonctionnait grâce à ce qu'on lui donnait**, et elle s'arrêtait dès qu'on cessait de la remonter.

    **Objection et réponse.** {red}La vie de l'Intellect n'est pas une vie biologique ; on ne compare pas un organisme à un principe métaphysique.{/red} C'est pourtant ce qui fait la force de l'argument : Plotin montre **le seul trait qu'il faudrait retirer à la vie pour la rendre invulnérable, la dépendance**. Or une vie sans dépendance ne se nourrirait pas, ne croîtrait pas, ne dépérirait pas : __la définition d'Aristote disparaîtrait tout entière__. Une vie invulnérable cesserait d'être biologique, et {coral}la dépendance n'est pas un défaut accidentel de la vie des corps, elle la constitue{/coral}.

    {green}La vulnérabilité de la vie, c'est le manque{/green} : le vivant est vulnérable parce qu'il a besoin de ce qu'il n'est pas ; seule la vie que Plotin réserve à l'Intellect échapperait à la blessure.
  points:
  - id: vulnerabilite-vie-l5-p1
    sentence: "Pour ___, la vie véritable et parfaite n'est pas celle des corps mais celle de l'Intellect, dont les autres vies ne sont que des images affaiblies : modèle d'une vie pleinement active qui ne dépend de rien."
    answer: "Plotin"
