- id: vulnerabilite-vie-l4
  title: "II. Se nourrir : la bulle n'était qu'un filtre"
  notes: |-
    La deuxième partie garde l'acquis de la première, **seul ce qui fonctionne peut se rompre**, et demande d'où vient la rupture : {green}la vulnérabilité naît de ce que le vivant n'existe qu'ouvert à ce qui n'est pas lui{/green}. Premier temps : la nutrition, puis la bulle relue.

    **La définition d'Aristote contenait déjà ce dehors.** Se nourrir, c'est __prendre hors de soi ce dont on est fait__ : la nourriture conserve le vivant, qui ne peut subsister s'il en est privé ({sky}*De l'âme*, II, 4{/sky}). Le « par soi-même » de la première partie {coral}enveloppe donc une dépendance{/coral} : le vivant agit de lui-même, mais sur une matière qu'il reçoit d'ailleurs. Son autonomie est celle d'**une activité qui a sans cesse besoin d'autre chose qu'elle pour s'exercer**.

    **D'où l'exposition.** L'activité qui distingue le vivant de l'inerte est aussi ce qui l'ouvre à ce qui peut lui manquer ou lui nuire :
    - l'air qu'il respire peut être vicié ;
    - la nourriture peut faire défaut, ou l'empoisonner ;
    - le milieu peut changer plus vite qu'il ne s'y accorde.

    **Conclusion** : {green}le vivant est vulnérable non seulement parce qu'il fonctionne, mais parce qu'il fonctionne grâce à ce qu'il reçoit{/green}.

    **La bulle relue.** On a voulu protéger David Vetter en l'enfermant : la menace venant du dehors, il fallait l'en séparer. Mais {red}la clôture n'a jamais pu être totale{/red} : l'enfant respirait un air **filtré**, mangeait des aliments **stérilisés**, buvait une eau **purifiée**. On n'avait pas supprimé l'échange avec le milieu, __on l'avait seulement filtré__. La plus grande clôture possible n'est jamais qu'{coral}un échange contrôlé{/coral}.

    **La limite est le lieu de l'échange.** Ce qui sépare le vivant de son milieu est aussi ce par quoi il échange avec lui : {green}ce par quoi la vie est blessée est ce par quoi elle vit{/green}.

    La vulnérabilité de la vie, c'est **l'exposition qu'impose la dépendance** : le vivant ne peut pas se protéger du dehors en se fermant, puisqu'il vit de ce dehors.
  points:
