- id: vulnerabilite-vie-l2
  title: "I. Aristote : dépérir par soi-même"
  notes: |-
    La première partie soutient que **la vulnérabilité appartient à la définition même de la vie**. Elle part de ce qui sépare le vivant de l'inerte, et Aristote lui donne son premier appui : {green}seul le vivant dépérit par lui-même{/green}.

    **Le point de départ : une manière de parler.** On dit d'un vivant qu'il est blessé, qu'il tombe malade, qu'on le tue : {red}comme si la vie était d'elle-même intacte et que la blessure lui venait toujours d'ailleurs{/red}. On se demande au contraire si la vie ne porte pas en elle ce qui la rend vulnérable.

    **La définition d'Aristote.** Parmi les corps naturels, les uns ont la vie, les autres ne l'ont pas, et vivre, c'est {teal}« se nourrir, croître et dépérir par soi-même »{/teal} ({sky}*De l'âme*, II, 1, 412a13-15{/sky}). Ce qui frappe : le **dépérissement** y figure __au même titre que la nutrition et la croissance__, et il est accompli, comme elles, __« par soi-même »__. Il n'est pas un accident qui interromprait la vie du dehors.

    **Trois comparaisons font voir ce « par soi-même ».**
    - Le vivant se nourrit : ce n'est pas la nourriture qui le nourrit {yellow}comme on remplit un vase{/yellow}, c'est lui qui transforme ce qu'il absorbe en sa propre substance.
    - Il dépérit de même : ce n'est pas une force extérieure qui le défait {yellow}comme on démolit un mur{/yellow}, c'est sa propre activité qui s'épuise.
    - La pierre, elle, peut être brisée, usée par l'eau, réduite en poussière, mais toujours sous l'action de ce qui n'est pas elle ; elle ne dépérit pas, **elle change seulement de forme**, et ses fragments sont encore des pierres.

    **Conclusion : le pouvoir de périr définit la vie.** On ne peut retirer au vivant la capacité de dépérir __sans lui retirer en même temps la nutrition et la croissance__, c'est-à-dire sans en faire {coral}une chose{/coral}.

    **L'exemple de la plante et de la pierre** (exemple de la dissertation, non d'Aristote). Dans un lieu sec, {pink}la pierre demeure telle qu'elle était{/pink}, {green}la plante se flétrit{/green}. Ce n'est pas que la sécheresse soit plus violente pour la plante : c'est que **la plante fait quelque chose, se nourrir, qu'elle ne peut plus faire**, alors que la pierre ne fait rien. La sécheresse ne tombe pas sur elle comme un coup sur une matière ; elle l'atteint __dans une activité empêchée__. {coral}Périr, c'est l'échec d'une activité{/coral}, et l'inerte n'a aucune activité qui puisse échouer.

    Loin d'être une faiblesse que le vivant partagerait avec les choses fragiles, la vulnérabilité est ce qui l'en sépare : {green}la vulnérabilité de la vie, c'est d'abord le pouvoir de périr par soi-même{/green}.

    **Ce qui reste ouvert.** Aristote rapporte ces opérations à l'{violet}âme{/violet}, forme du corps vivant, et dit que le vivant dépérit **sans montrer comment une activité peut défaillir**. Pourquoi ce qui agit de soi-même peut-il cesser d'agir ? C'est la question posée à Descartes.

    ! « Dépérir par soi-même » ne veut pas dire que la vie veut sa mort : la première partie en tire seulement que périr suppose une activité. La troisième relira ce dépérissement comme la défaillance d'une résistance.
  points:
