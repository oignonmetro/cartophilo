- id: vulnerabilite-vie-l11
  title: "Conclusion : un critère pour les protections"
  notes: |-
    La conclusion **dénoue la contradiction par une distinction**, puis en tire deux conséquences : un critère pour juger les protections, et le sens précis de la responsabilité envers la vie.

    **Le chemin parcouru.** La vulnérabilité a d'abord paru constitutive (seul ce qui agit de soi-même peut défaillir), puis née de la dépendance (une vie sans dépendance serait invulnérable, et la vie en général n'est devenue vulnérable que du dehors). La contradiction se dénoue : {green}ce qui est constitutif de la vie, c'est la résistance{/green} ; {pink}ce qui lui est extérieur, c'est ce qui la menace{/pink}. **La vulnérabilité naît de leur rencontre**, dans l'ouverture par laquelle le vivant dépend de ce qu'il n'est pas. Le vivant n'a donc pas à se clore : {red}la clôture supprimerait ce dont il vit et ce par quoi il se renforce{/red}.

    **La formule finale.** {green}La vulnérabilité de la vie, c'est l'exposition au dehors d'une puissance qui résiste, qui y trouve son enjeu et l'occasion de sa croissance, et qui ne peut être vaincue que par ce qui détruit cette puissance même.{/green}

    **Un critère pour les protections.** {coral}Une protection n'est pas bonne parce qu'elle réduit l'exposition, mais parce qu'elle renforce la résistance au lieu de s'y substituer{/coral} : la bulle de David Vetter suppléait à une résistance absente sans pouvoir la faire naître, le vaccin la fait naître en exposant.

    **Le sens de la responsabilité.** Si la vie n'est menacée comme telle que depuis qu'un vivant peut détruire les conditions de son renouvellement (Jonas), la responsabilité qui en découle {red}ne consiste pas à mettre la vie à l'abri{/red}, ce qui n'aurait pas de sens, mais {green}à ne pas détruire la puissance par laquelle elle se renouvelle{/green}.

    **Les références dans l'ordre de la copie.**

    | Référence | Partie | Ce qu'elle établit |
    | Aristote, De l'âme, II, 1 | I | Seul le vivant dépérit par soi-même |
    | Descartes, Passions de l'âme, art. 5-6 | I | Seul ce qui fonctionne peut se rompre |
    | Descartes, Sixième Méditation | I | Le dérèglement naît du fonctionnement |
    | Aristote, De l'âme, II, 4 (nutrition) | II | Le vivant vit de ce qu'il reçoit |
    | Plotin, Ennéades (l'Intellect) | II | Seule une vie sans manque est invulnérable |
    | Aristote, De l'âme, II, 4 (génération) | II | La vie demeure la même en espèce |
    | Jonas, Le Principe responsabilité | II | La vie en général menacée du dehors |
    | Spinoza, Éthique, III, prop. 4 et 6 | III | Nulle chose ne se détruit elle-même |
    | Bichat, Recherches physiologiques | III | La vie résiste à la mort |
