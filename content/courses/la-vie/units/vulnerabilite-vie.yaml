- id: vulnerabilite-vie-l10
  title: "III. Nietzsche, le vaccin, Améry"
  notes: |-
    Dernier temps : **la résistance n'est-elle qu'une défense ?** Nietzsche répond qu'elle est une puissance qui croît de ce qu'elle surmonte, et le vaccin en donne la preuve médicale, face à la bulle. Améry oblige à borner cette thèse.

    **Le risque d'un retour à la clôture.** La conception de Bichat oppose la vie à {red}un milieu hostile{/red} : prise seule, elle ferait de la résistance une simple défense, et __ramènerait à la clôture dont on est parti__.

    **Nietzsche : la résistance croît.** {teal}« Ce qui ne me tue pas me rend plus fort »{/teal} ({sky}*Crépuscule des idoles*, « Maximes et traits », 8{/sky}). Ailleurs, Nietzsche {red}refuse de faire de la conservation de soi l'instinct premier du vivant{/red} : un être vivant veut **avant tout déployer sa force**, et la conservation de soi n'est qu'une conséquence indirecte de cette volonté ({sky}*Par-delà bien et mal*, § 13{/sky}). {green}La résistance n'est pas une simple défense, c'est une puissance qui croît de ce qu'elle surmonte{/green}. Le vivant ne se protège donc pas en se fermant, ce qui le priverait de ce qui le renforce, mais **en s'exposant et en surmontant**.

    **Le vaccin contre la bulle** (il répond terme à terme à la bulle de David Vetter). La {violet}vaccination{/violet} protège un organisme **en l'exposant à une forme atténuée** de ce qui le menace : il en sort plus résistant, parce qu'il a appris à surmonter ce qu'il rencontrait.

    | Protection | Moyen | Effet sur la résistance |
    | Bulle | Clôture | Y supplée sans la faire naître |
    | Vaccin | Exposition | La fait naître |

    {coral}La solution du problème est biologique avant d'être morale{/coral} : le vivant n'a pas à choisir entre se clore et être exposé, puisque **sa manière propre de se protéger passe par l'exposition**.

    **L'objection d'Améry.** Certaines blessures ne tuent pas et ne rendent pas plus fort. Torturé par la {sky}Gestapo{/sky}, Améry témoigne que la torture ne cesse pas avec les coups : dès le premier coup, la victime perd la {teal}« confiance dans le monde »{/teal}, c'est-à-dire __la certitude qu'autrui respectera les limites de son corps et qu'on lui portera secours__, et celui qui a été torturé ne la retrouve jamais ({sky}*Par-delà le crime et le châtiment*, « La torture »{/sky}). {red}Son corps a guéri, sa vie ne s'est pas relevée.{/red}

    **La maxime précisée, non abandonnée.** Elle vaut **tant que ce qui atteint la vie ne détruit pas sa puissance même de résister**. {coral}La blessure la plus grave n'est pas celle qui tue, c'est celle qui laisse vivre en détruisant la résistance.{/coral}

    {green}La vulnérabilité de la vie, c'est l'occasion de sa croissance{/green} : exposée du dehors, la vie se protège en se renforçant de ce qu'elle surmonte, tant que ce qui l'atteint ne détruit pas sa puissance de résister.

    **Bilan de la troisième partie.** La vulnérabilité vient du dehors, la résistance appartient à la vie : la mort n'en fait pas partie (Spinoza, Bichat, contre Montaigne), la finitude lui donne un enjeu (Canguilhem, Borges), la résistance croît de ce qu'elle surmonte (Nietzsche, le vaccin, borné par Améry). Le vivant se distingue de l'inerte **parce qu'il résiste** (ce que la première partie avait vu depuis le moment où la résistance cède) ; il est exposé **parce qu'il dépend** (deuxième partie). {coral}La contradiction tenait à ce qu'on attribuait à la vie une vulnérabilité qui était l'envers de sa résistance.{/coral}
  points:
  - id: vulnerabilite-vie-l10-p1
    sentence: "La conception de Bichat, qui oppose la vie à un milieu hostile, ferait de la résistance une simple ___, et ramènerait ainsi à la clôture dont la dissertation est partie."
