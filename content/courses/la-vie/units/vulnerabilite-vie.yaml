# Sujet traité de la piste Sujets : « La vulnérabilité de la vie »,
# dissertation fournie par l'utilisateur (« La vulnérabilité de la vie »,
# 31 octobre 2026). Le cours suit la progression de la copie, introduction,
# trois parties, conclusion, une leçon par moment, et fait retenir chaque
# référence, chaque exemple et l'usage que l'argument en fait. Citations et
# repères tels que la dissertation les donne (voir content/philosophie.md,
# § « Un cours sur un auteur, tiré d'un commentaire », appliqué ici à une
# copie) ; les références ont été recoupées sur les œuvres, sans écart.
#
# L'exemple de la plante et de la pierre (I), celui de la vaccination (III) et
# la lecture a contrario de Plotin (II) sont de la dissertation, non des
# auteurs cités : les rappels le disent.

id: vulnerabilite-vie
title: "La vulnérabilité de la vie"
subtitle: "Extérieure ou constitutive ? La résistance, propre de la vie, exposée au dehors"
icon: magnify
color: teal
lessons:
- id: vulnerabilite-vie-l1
  title: "Introduction : la bulle et le problème"
  notes: |-
    L'introduction part d'un **cas limite**, celui de l'enfant dans la bulle, puis tire du mot « vulnérable » **deux conceptions qui s'excluent** : la vulnérabilité vient du dehors, ou elle est constitutive de la vie. Le problème naît de leur conflit, et le plan le dénoue en trois temps.

    **Le cas de David Vetter.** Né en {sky}1971 au Texas{/sky} avec un {violet}déficit immunitaire sévère{/violet}, David Vetter a passé presque toute sa vie, qui dura **douze ans**, dans une {yellow}bulle de plastique stérile{/yellow} : l'air, la nourriture, les jouets, tout était filtré ou désinfecté, et il ne touchait les siens qu'à travers des gants fixés à la paroi. Le cas illustre une réponse qui semble aller de soi : __puisque la menace vient du dehors, il faut en séparer la vie__. Mais il en montre aussitôt le prix : {red}la bulle qui préservait la vie de l'enfant le retranchait aussi de presque tout ce qui fait une vie{/red}.

    **Première conception : une vulnérabilité extérieure.** « Vulnérable » vient du latin {violet}`vulnus`{/violet}, la blessure : est vulnérable **ce qui peut être blessé**. D'où deux traits :
    - c'est une __possibilité__, non un fait, puisqu'elle précède toute blessure effective ;
    - elle __regarde vers le dehors__, car une blessure est infligée : elle entame une intégrité à partir de ce qui n'est pas elle.

    D'où la distinction avec la {violet}mortalité{/violet}, avec laquelle on la confond : tout vivant mourra, {pink}par nécessité{/pink}, alors que la vulnérabilité est une {green}exposition contingente{/green} à ce qui peut arriver, ici et maintenant, du fait d'autre chose que soi ; on peut d'ailleurs être blessé sans mourir. **A priori, la vulnérabilité est donc extérieure à la vie, et la seule protection est de se clore**, à la manière de la bulle.

    **Seconde conception : une vulnérabilité constitutive.** Une pierre peut être brisée, elle ne peut pas être blessée ; une table peut être endommagée, elle ne tombe pas malade. La vulnérabilité se distingue donc de la {violet}fragilité{/violet} (de {violet}`frangere`{/violet}, briser), qui concerne la solidité d'une structure : on ne parle de vulnérabilité que **là où il y a quelque chose à perdre**, c'est-à-dire là où il y a de la vie. Elle est alors {coral}un des traits par lesquels la vie se distingue de l'inerte{/coral}, et ne peut plus être seulement extérieure au vivant. Le __singulier__ du sujet va dans le même sens : « la vie », non les vivants vulnérables, comme si la vulnérabilité tenait à la vie elle-même plutôt qu'aux accidents de tel vivant.

    **Le problème.** Si la vulnérabilité vient du dehors, {green}la clôture est la meilleure protection{/green} ; si elle est constitutive, s'en garder reviendrait à cesser de vivre, et {red}la bulle devient une manière d'étouffer ce qu'elle protège{/red}. D'où la question : __comment la vulnérabilité de la vie peut-elle être extérieure au vivant, qui doit alors se clore, alors qu'elle est en même temps constitutive de la vie en tant que distincte de l'inerte ?__

    **Le plan.**

    | Partie | Thèse | Auteurs |
    | I | Constitutive, envers de l'activité | Aristote, Descartes |
    | II | Née de l'ouverture au milieu | Aristote, Plotin, Jonas |
    | III | Extérieure ; la résistance est interne | Spinoza, Bichat, Nietzsche |

    En III, aux trois auteurs du tableau s'ajoutent Montaigne (objection), Canguilhem, Borges et Améry (objection).
