- id: vulnerabilite-vie-l8
  title: "III. Montaigne : la vie bâtit-elle la mort ?"
  notes: |-
    Objection à la thèse que la mort vient du dehors : {red}la mort serait présente dans la vie dès son commencement{/red}. Spinoza permet d'y répondre : {green}ce qui use la vie s'accumule sur elle ; l'effort de vivre, lui, ne tend jamais vers sa propre perte{/green}.

    **L'objection de Montaigne.** {teal}« Le continuel ouvrage de votre vie, c'est bâtir la mort »{/teal} ({sky}*Essais*, I, 20{/sky}, « Que philosopher, c'est apprendre à mourir »). Le {violet}vieillissement{/violet} semble lui donner raison : __l'organisme s'use sans qu'aucun coup ne lui soit porté__.

    **La réponse de Spinoza : une puissance finie.** La force par laquelle l'homme persévère dans l'existence est **limitée**, et la puissance des causes extérieures **la surpasse infiniment** ({sky}*Éthique*, IV, prop. 3{/sky}). L'usure {red}n'est pas l'œuvre de la vie contre elle-même{/red} : {green}c'est l'accumulation, sur une puissance finie, de causes qui l'emportent peu à peu{/green}.

    **Le poète espagnol.** Spinoza va jusqu'à admettre qu'un corps peut **changer de nature sans devenir cadavre**, comme {yellow}ce poète espagnol qui, après une maladie, ne reconnaissait plus ses propres œuvres{/yellow} ({sky}IV, prop. 39, scolie{/sky}). Même ce changement radical a une cause, la maladie : __ce qui use la vie s'accumule sur elle__.

    **Ce que Montaigne décrit, et ce qu'il ne montre pas.** Montaigne décrit {pink}le temps vécu qui s'écoule vers sa fin{/pink} ; il ne montre pas {red}que la vie veut sa mort{/red}.

    {green}La vulnérabilité de la vie, c'est l'exposition d'un effort qui ne tend jamais de lui-même à sa perte{/green} : la mort vient au vivant du dehors, et ce qui lui appartient en propre est la résistance.

    ! Que la vie aille vers la mort (un fait de durée) ne prouve pas qu'elle y tende (un effort orienté) : la réponse à Montaigne repose sur cette distinction.
