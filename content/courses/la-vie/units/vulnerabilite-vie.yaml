  - id: vulnerabilite-vie-l11-p1
    sentence: "La contradiction du problème de la vulnérabilité de la vie se dénoue dans une distinction : ce qui est constitutif de la vie, c'est la ___, et ce qui lui est extérieur, c'est ce qui la menace."
    answer: "résistance"
    alt: ["resistance"]
  - id: vulnerabilite-vie-l11-p2
    sentence: "La vulnérabilité naît de la rencontre de la résistance interne et de la menace extérieure, dans l'___ par laquelle le vivant dépend de ce qu'il n'est pas."
    answer: "ouverture"
    alt: []
  - id: vulnerabilite-vie-l11-p3
    sentence: "Formule finale : la vulnérabilité de la vie, c'est l'exposition au dehors d'une ___ qui résiste, qui y trouve son enjeu et l'occasion de sa croissance, et qui ne peut être vaincue que par ce qui la détruit elle-même."
    answer: "puissance"
    alt: []
  - id: vulnerabilite-vie-l11-p4
    sentence: "Critère tiré de la dissertation : une protection n'est pas bonne parce qu'elle réduit l'exposition, mais parce qu'elle renforce la résistance au lieu de s'y ___."
    answer: "substituer"
    alt: []
  - id: vulnerabilite-vie-l11-p5
    sentence: "Selon le critère des protections tiré de la dissertation, la bulle de David Vetter suppléait à une résistance absente sans pouvoir la faire naître, alors que le ___ la fait naître en exposant."
    answer: "vaccin"
    alt: []
  - id: vulnerabilite-vie-l11-p6
    sentence: "Si la vie n'est menacée comme telle que depuis qu'un vivant peut détruire les conditions de son renouvellement, la responsabilité ne consiste pas à mettre la vie à l'___, mais à ne pas détruire la puissance par laquelle elle se renouvelle."
    answer: "abri"
