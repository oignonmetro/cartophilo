- id: vulnerabilite-vie-l9
  title: "III. Canguilhem, Borges : ce qui peut être perdu importe"
  notes: |-
    Si la vulnérabilité est extérieure à la vie, **faut-il souhaiter en être délivré ?** Une vie qui ne pourrait plus être blessée aurait-elle encore un sens ? Canguilhem et Borges répondent : {green}la vulnérabilité donne à la vie un enjeu{/green}.

    **Canguilhem : vivre, c'est préférer.** Pour Canguilhem, {teal}la vie n'est pas indifférente aux conditions dans lesquelles elle est possible{/teal} : vivre, même pour l'organisme le plus simple, c'est déjà **préférer certaines conditions et en exclure d'autres** ({sky}*Le Normal et le pathologique*, deuxième partie{/sky}).

    **Deux sens du mot « sens ».**
    - {violet}Orientation{/violet} : la résistance à ce qui menace donne à la vie une direction. __Parce qu'il peut être blessé__, le vivant recherche ce qui le conserve et fuit ce qui le détruit ; cette {violet}polarité{/violet} fait de son comportement autre chose qu'un simple mouvement.
    - {violet}Valeur{/violet} : la finitude biologique de l'homme (la mort, la maladie, la blessure) donne à ses actes leur poids. **Ce qui peut être perdu importe, ce qui ne peut pas l'être est indifférent.**

    {coral}La vulnérabilité extérieure est ce qui fait que la résistance interne devient orientation, puis valeur.{/coral}

    **Borges : les immortels indifférents.** Dans {sky}« L'immortel » (*L'Aleph*){/sky}, les immortels qu'y rencontre le narrateur ne peuvent plus mourir et {red}sont devenus indifférents à tout{/red}, puisque dans un temps infini tout finira par leur arriver ; l'un d'eux, qui fut {yellow}Homère{/yellow}, se souvient à peine de l'*Odyssée*. Par contraste, le narrateur comprend que {green}chez les mortels chaque acte a le prix de ce qui ne se reproduira pas{/green}.

    **Sans vulnérabilité, l'indifférence.** Supprimer la blessure possible ne libère pas la vie, cela lui retire l'enjeu qui orientait sa résistance. La vie immortelle se défait en une indifférence qui ressemble moins à {pink}la plénitude de l'Intellect plotinien{/pink} qu'à {red}l'inertie de la pierre{/red}.

    {green}La vulnérabilité de la vie, c'est ce qui donne à la vie un enjeu{/green} : parce qu'elle peut être perdue, la vie préfère et exclut, et pour l'homme chaque acte prend la valeur de l'irrécupérable.

    ! L'invulnérabilité acquise par un vivant ne l'élève pas à l'autarcie de l'Intellect, elle le ramène à l'indifférence de l'inerte, à la pierre.
  points:
