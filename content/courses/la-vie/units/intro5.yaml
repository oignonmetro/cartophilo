lessons:
- id: intro5-l1
  title: "Bios et zôè : la question des genres de vie"
  notes: |-
    **Le mot « vie » est équivoque en français, et le grec permet de démêler cette équivoque, en distinguant {blue}*bios*{/blue} et {blue}*zôè*{/blue}.**
    - {blue}*Zôè*{/blue} est un terme relativement {amber}univoque{/amber} : il désigne {amber}la vie biologique, le fait d'être en vie{/amber}.
    - {blue}*Bios*{/blue} a une signification beaucoup plus large : il a aussi ce sens, mais peut désigner un {violet}« genre de vie »{/violet}, c'est-à-dire {amber}le type d'existence dans lequel choisissent de s'engager les êtres humains{/amber}.

    **Le thème des genres de vie est central dans la littérature antique**, depuis une anecdote célèbre qui en attribue la paternité à {sky}Pythagore{/sky} (voir {sky}Cicéron{/sky}, *Tusculanes*, V, 3), et il structure la manière dont les Anciens abordent l'éthique.

    **Le problème des éthiques grecques : quel genre de vie apporte le bonheur ?** Un genre de vie est {coral}structuré autour de la recherche d'un bien{/coral} :

    | Bien recherché | Chez qui |
    | le plaisir | les hédonistes |
    | la vertu | les éthiques stoïciennes ou socratiques |
    | le savoir désintéressé | *Éthique à Nicomaque*, X, 6-8 |
    | la richesse | la vie chrématistique |

    (et les honneurs, etc. ; sur les conceptions communes des genres de vie, *Éthique à Nicomaque*, I, 3). Une fois ce bien déterminé, il s'agit de {amber}coordonner toute l'existence autour de lui{/amber} : il agit comme {coral}une cause finale pour l'ensemble de la vie de l'individu{/coral}. Choisir son {blue}*bios*{/blue}, c'est donc choisir la fin qui ordonne tout le reste.

    **D'où la philosophie conçue comme un art de vivre** : une {blue}*technè peri ton bion*{/blue}, un art de (bien) vivre, parce qu'elle vise à rendre heureux, chaque école proposant sa propre {violet}« voie »{/violet} ({blue}*hodos*{/blue}) vers le bonheur.

    **Le {blue}*bios*{/blue} est habité par la mort.** La vie ne s'y limite pas à sa dimension biologique : elle prend le sens de {amber}l'existence d'un individu et des choix qu'il fait pour la mener{/amber}, un ensemble de choix habité par {coral}la perspective d'une mort certaine{/coral}, où ils trouvent leur achèvement, mais aussi une épreuve ultime. Ces questions se prolongent en contexte chrétien ({sky}Augustin{/sky}), et cet usage se retrouve dans notre langage, quand on parle de {yellow}« choix de vie »{/yellow} : la carrière poursuivie, le lieu où l'on habite, le fait d'avoir ou non des enfants.
  tables:
  - table: bien-recherche-chez-qui
    exercises:
    - {kind: bank, column: Bien recherché}
    - {kind: cell, column: Bien recherché}
  points:
  - id: intro5-l1-p1
    sentence: "__Le grec démêle l'équivoque du mot « vie »__ : *___*, relativement **univoque**, désigne la vie biologique, le fait d'être en vie."
    answer: "zôè"
    alt: ["zoè", "zôê", "zoe"]
  - id: intro5-l1-p2
    sentence: "__Le grec démêle l'équivoque du mot « vie »__ : *___*, plus large, peut désigner un « **genre de vie** », le type d'existence dans lequel s'engagent les êtres humains."
    answer: "bios"
    alt: []
  - id: intro5-l1-p3
    sentence: "Une anecdote célèbre attribue à ___ la paternité du **thème des genres de vie** (Cicéron, *Tusculanes*, V, 3)."
    answer: "Pythagore"
    alt: []
  - id: intro5-l1-p4
    sentence: "L'anecdote qui attribue à Pythagore **le thème des genres de vie** se lit chez Cicéron, dans les *___*, V, 3."
    answer: "Tusculanes"
    alt: []
  - id: intro5-l1-p12
    sentence: "__Le problème des éthiques grecques__ : quel **genre de vie** apporte le ___ ?"
    answer: "bonheur"
    alt: []
  - id: intro5-l1-p5
    sentence: "Le genre de vie consacré à **la richesse** se dit vie ___."
    answer: "chrématistique"
    alt: []
  - id: intro5-l1-p6
    sentence: "Le genre de vie voué à **la recherche désintéressée du savoir** est traité dans l'*Éthique à Nicomaque*, ___."
    answer: "X, 6-8"
    alt: ["X 6-8", "X, 6 à 8"]
  - id: intro5-l1-p7
    sentence: "__Un genre de vie se structure autour de la recherche d'un bien__, qui agit comme une cause ___ pour **l'ensemble de la vie** de l'individu."
    answer: "finale"
    alt: []
  - id: intro5-l1-p8
    sentence: "__Parce qu'elle vise à rendre heureux__, la philosophie a pu être conçue par les Anciens comme une *___ peri ton bion*, **un art de bien vivre**."
    answer: "technè"
    alt: ["technê", "techne"]
  - id: intro5-l1-p9
    sentence: "Chaque école philosophique antique propose sa propre « **voie** » vers le bonheur, en grec *___*."
    answer: "hodos"
    alt: ["odos"]
  - id: intro5-l1-p10
    sentence: "__Le *bios* ne se limite pas à la vie biologique__ : ensemble des choix d'un individu, il est habité par **la perspective d'une** ___ **certaine**, où ces choix trouvent leur achèvement."
    answer: "mort"
    alt: []
  - id: intro5-l1-p11
    sentence: "Les questions du *bios*, des choix de vie habités par la mort, se prolongent **en contexte chrétien**, chez ___."
    answer: "Augustin"
    alt: ["saint Augustin"]
- id: intro5-l2
  title: "Vie de l'esprit, des sociétés, de la Terre"
  notes: |-
    **Le mot « vie » connaît enfin des usages variés et étendus, dans le langage ordinaire comme chez les philosophes** : {yellow}la « vie de l'esprit »{/yellow}, {yellow}la « vie des sociétés »{/yellow} ou {yellow}des civilisations{/yellow}, {yellow}la « vie de la Terre »{/yellow} (dans l'{violet}hypothèse Gaïa{/violet}). Sont-ils légitimes ?

    **Sous un premier rapport, la comparaison avec les vivants est justifiée.** Parler ainsi, c'est d'abord constater que l'esprit, les sociétés, les civilisations ou la Terre {green}sont mortels{/green} : ils ont {amber}une naissance, une période de croissance puis de déclin{/amber}, avant de disparaître.

    **Tout se complique avec la finalité.**
    - Pour {yellow}la vie spirituelle{/yellow}, interpréter toutes ses manifestations par une cause finale est déjà {pink}discutable{/pink} ; on parle alors de {violet}motif{/violet} ou de {violet}projet{/violet}.
    - Pour {yellow}les sociétés et les civilisations{/yellow}, {red}il faut y renoncer{/red}, à moins d'une conception {violet}organiciste{/violet} forte, doublée d'une philosophie de l'histoire très coûteuse, comme chez {sky}Herbert Spencer{/sky} (1820-1903). Car {coral}il leur manque le type d'unité et de continuité qu'on trouve chez les vivants{/coral}.
    - Pour {yellow}la Terre{/yellow}, lui attribuer des {red}intentions{/red} reviendrait à se la représenter comme {yellow}une déesse{/yellow} ; lui attribuer, {blue}*a minima*{/blue}, une {red}finalité interne{/red}, ramène à la difficulté précédente : {coral}ni l'unité ni la continuité d'un vivant ne se retrouvent à une échelle aussi vaste{/coral}.

    **La question est donc celle de la légitimité des {violet}métaphores biologiques{/violet}**, à examiner au cas par cas : l'analogie vaut pour la naissance et la mort, elle cesse dès qu'on y met une fin.
  points:
  - id: intro5-l2-p1
    sentence: "Parler de « **vie de la Terre** » se fait notamment dans le cadre de l'hypothèse ___."
    answer: "Gaïa"
    alt: ["Gaia"]
  - id: intro5-l2-p2
    sentence: "__Parler de la vie des sociétés ou des civilisations est justifié sous un premier rapport__ : comme les vivants, elles sont ___, avec **une naissance, une croissance, un déclin**."
    answer: "mortelles"
    alt: []
  - id: intro5-l2-p3
    sentence: "__Interpréter la vie spirituelle par une cause finale est déjà discutable__ : on parle alors de **motif**, ou de ___."
    answer: "projet"
    alt: []
  - id: intro5-l2-p4
    sentence: "__Prêter une finalité aux sociétés suppose__ une conception ___ forte, doublée d'une **philosophie de l'histoire très coûteuse**, comme chez Spencer."
    answer: "organiciste"
    alt: []
  - id: intro5-l2-p5
    sentence: "La **conception organiciste forte des sociétés**, doublée d'une philosophie de l'histoire très coûteuse, se rencontre chez Herbert ___ (1820-1903)."
    answer: "Spencer"
    alt: []
  - id: intro5-l2-p6
    sentence: "__On ne peut prêter de finalité aux sociétés ni à la Terre__, parce qu'il leur manque le type d'**unité** et de ___ qu'on rencontre chez les êtres vivants."
    answer: "continuité"
    alt: []
  - id: intro5-l2-p7
    sentence: "Attribuer des **intentions** à la Terre reviendrait à se la représenter comme une ___."
    answer: "déesse"
    alt: []
  - id: intro5-l2-p8
    sentence: "Les **usages étendus** du mot vie posent la question de la légitimité des ___ biologiques, à examiner au cas par cas."
    answer: "métaphores"
    alt: []
  - id: intro5-l2-p9
    sentence: "__La métaphore biologique vaut pour la naissance et la mort__ des sociétés ou de la Terre ; elle cesse dès qu'on y met une ___."
    answer: "fin"
    alt: ["finalité"]
