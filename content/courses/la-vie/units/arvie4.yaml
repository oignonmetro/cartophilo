    answer: "active"
    alt: []
  - id: arvie4-l5-p3
    sentence: "Le bonheur est une activité, en grec *___*, et non un état de latence, comme un état végétatif d'inaction."
    answer: "energeia"
    alt: ["énergeia"]
  - id: arvie4-l5-p4
    sentence: "*Éthique à Nicomaque*, I, 6 : le bien humain devient « un acte de l'âme qui traduit la ___ »."
    answer: "vertu"
    alt: []
  - id: arvie4-l5-p5
    sentence: "On peut être heureux, comme ___, en menant la vie du prudent tournée vers l'action."
    answer: "Périclès"
    alt: []
  - id: arvie4-l5-p6
    sentence: "On peut être heureux, comme ___, en menant la vie du sage, qui est affaire de contemplation."
    answer: "Thalès"
    alt: []
  - id: arvie4-l5-p7
    sentence: "La prudence, *phronèsis*, est l'excellence de la partie délibérative de l'âme, le *logistikon*, qui porte sur le ___."
    answer: "contingent"
    alt: []
