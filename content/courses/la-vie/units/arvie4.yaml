- id: arvie4-l2
  title: "Vie animale, vie humaine : l'abeille et la technique"
  notes: |-
    **En *Métaphysique*, A, 1, Aristote distingue les formes d'animalité selon les facultés qui permettent à chacune de vivre.** Pour les animaux non humains, vivre consiste à faire plein usage des capacités dont la nature les a dotés :
    - certains vivent selon {amber}la sensation{/amber} ;
    - d'autres selon {amber}la mémoire et l'imagination{/amber} ;
    - certains, plus intelligents, sont capables {amber}d'apprendre et d'agir en conséquence{/amber}.

    **Les espèces « industrieuses » ({blue}*ergastikai*{/blue})** déploient leur {blue}*phronèsis*{/blue} en activités conformes à leur nature : {yellow}l'araignée{/yellow} chasse, sans constituer de réserves ; {yellow}la fourmi{/yellow} rassemble et conserve une nourriture qu'elle trouve ; {yellow}l'abeille{/yellow} produit elle-même sa nourriture et la conserve (*HA*, IX, 40).

    **L'abeille mène une vie sociale, et pas seulement grégaire.** Son intelligence pratique lui permet d'accomplir {teal}« {/teal}une {teal}œuvre une et commune »{/teal} (*HA*, I, 1) : la construction et l'approvisionnement de la ruche. Le terme {blue}*politikos*{/blue} rend cette vie sociale. {green}Elle vise un résultat collectif par sa conduite{/green}, {red}à la différence du troupeau, où les individus accomplissent les mêmes actions en parallèle{/red}. Les fourmis et les grues sont aussi de ces espèces.

    **L'homme seul vit par l'art et le raisonnement.** Il possède la raison, qui lui donne un mode de vie singulier : lui seul vit {teal}« au moyen de la technique{/teal} [{blue}*technèi*{/blue}] {teal}et des raisonnements »{/teal} [{blue}*logismois*{/blue}] (*Métaphysique*, A, 1). Comme dans le mythe de Prométhée du *Protagoras*, {coral}l'art est le moyen de vivre en homme{/coral} : l'homme ne se contente pas des produits de la nature ; il les transforme pour satisfaire besoins et désirs, vivre plus plaisamment, comme quand il fabrique {yellow}du vin ou des chaussures{/yellow}. Ses instruments ({blue}*organon*{/blue}) ne sont pas seulement les organes de son corps, mais ceux qu'il façonne : {coral}les inventions techniques sont des prolongements de l'activité vitale{/coral}.
  points:
  - id: arvie4-l2-p1
    sentence: "En *Métaphysique*, A, 1, Aristote __distingue les formes d'animalité__ selon les ___ qui permettent à chacune de vivre."
    answer: "facultés"
    alt: []
