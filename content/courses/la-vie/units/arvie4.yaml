- id: arvie4-l4
  title: "Une esquisse du bonheur, et la discorde des vies"
  notes: |-
    **Désirer le bonheur ne suffit pas : il faut savoir comment l'atteindre.** Le but de l'*Éthique à Nicomaque* n'est pas théorique mais pratique : {coral}non pas définir le bonheur, mais le réaliser{/coral}, en examinant comment tendre vers lui (*EN*, II, 2). Mais comment l'atteindre sans avoir idée de ce à quoi il ressemble ?

    **Une esquisse, comme une cible.** Aristote en propose une {violet}esquisse{/violet} (*tupos*), pour se le figurer et tendre vers lui, comme {yellow}il suffit à l'archer de se figurer à gros traits sa cible{/yellow} (*skopos*) pour la viser (*EN*, I, 2).

    **Il y a urgence, car tous s'accordent sur le nom, non sur la chose.** Tous désirent le bonheur et le souverain bien, mais {red}la discorde (*diaphonia*){/red} règne sur sa nature et le mode de vie qui le procure (*EN*, I, 4). L'opinion commune connaît trois vies heureuses :
    - {pink}une vie de plaisir{/pink} ;
    - {pink}une vie de gloire{/pink}, qui offre la reconnaissance, et l'espoir de surmonter la mort en laissant une trace dans les mémoires ;
    - {green}une vie de vertu{/green}, selon les sages.

    **Le problème biologique devient éthique.** Il s'agit désormais de déterminer {amber}le meilleur mode de vie (*bios*){/amber} pour l'homme, et non plus seulement ce qu'est la vie (*zôè*). Car l'homme, capable de choisir ses moyens, adopte parfois {red}des modes de vie moralement discutables{/red} : {yellow}Philoctète{/yellow}, réduit à l'état de bête sur l'île de Lemnos, ou l'homme qui ne recherche que les plaisirs du corps. {coral}L'homme ne doit pas seulement vivre, il doit bien vivre{/coral} : rechercher le mode de vie où il accomplira toutes les potentialités que la nature a mises en lui.
  points:
  - id: arvie4-l4-p1
    sentence: "Le but de l'*Éthique à Nicomaque* n'est pas théorique mais ___ : non pas définir le bonheur, mais le réaliser."
    answer: "pratique"
    alt: []
  - id: arvie4-l4-p2
    sentence: "Aristote propose du bonheur une esquisse, en grec *___*, pour se le figurer et tendre vers lui."
    answer: "tupos"
    alt: ["typos"]
  - id: arvie4-l4-p3
    sentence: "Il suffit à l'___ de se figurer à gros traits sa cible, *skopos*, pour la viser : ainsi de l'esquisse du bonheur."
    answer: "archer"
    alt: []
  - id: arvie4-l4-p4
    sentence: "Tous désirent le bonheur, mais la discorde, en grec *___*, règne sur sa nature et le mode de vie qui le procure."
    answer: "diaphonia"
    alt: []
  - id: arvie4-l4-p5
