- id: arvie4-l3
  title: "L'animal politique"
  notes: |-
    **L'homme se démarque encore comme « animal politique » (*politikon zôon*, *Politique*, I, 2).** Ceux qui choisissent une vie solitaire ont {red}oublié leur nature et leur place au sein du cosmos{/red}. L'homme, qui n'est ni une bête ni un dieu capable d'autarcie, doit vivre dans une cité pour atteindre l'autosuffisance qui permet de vivre bien : {teal}« {/teal}Celui qui n'est pas capable d'appartenir à une communauté ou qui n'en a pas besoin parce qu'il se suffit à lui-même {teal}n'est en rien une partie d'une cité{/teal}, si bien que {teal}c'est soit une bête, soit un dieu »{/teal} (*Politique*, I, 2).

    **La cité, née pour vivre, existe pour bien vivre** : {teal}« {/teal}La communauté achevée formée de plusieurs villages est une cité, dès lors qu'elle atteint pour ainsi dire {teal}le niveau de l'autarcie complète{/teal} : {teal}née en vue de vivre, elle existe en vue du bien vivre »{/teal} (*Politique*, I, 2). {coral}Un mode de vie solitaire interdit donc la fin proprement humaine.{/coral}

    **Politique, et pas seulement social.** L'homme n'est pas animal politique au même titre que l'abeille : il est fait pour vivre dans une {violet}*polis*{/violet}, une communauté politique, {coral}où il vit selon des valeurs{/coral}. Par la raison, faculté de penser et de parler, il vit selon des normes qui ne sont pas exclusivement biologiques : {amber}les normes morales et politiques qu'il choisit{/amber}.

    **Au nom de ses principes, l'homme peut préférer la mort à la vie** : {yellow}les Spartiates{/yellow} estiment, jusqu'à la bataille de {yellow}Sphactérie{/yellow} (425 av. J.-C.), qu'il vaut mieux mourir en homme libre que vivre misérablement, vaincu et soumis. La cité qui permet le mieux de réaliser sa nature rationnelle et de décider de sa vie est la *polis*, *a fortiori* démocratique : les citoyens y délibèrent sur les valeurs de la communauté et les lois qui les expriment, et peuvent y philosopher avec des amis sur ses principes.
  points:
  - id: arvie4-l3-p1
    sentence: "L'homme est un « animal politique », en grec *___ zôon* (*Politique*, I, 2)."
    answer: "politikon"
    alt: []
  - id: arvie4-l3-p2
    sentence: "*Politique*, I, 2 : celui qui n'a pas besoin de communauté parce qu'il se suffit à lui-même n'est en rien une partie d'une cité, « si bien que c'est soit une bête, soit un ___ »."
    answer: "dieu"
    alt: []
  - id: arvie4-l3-p3
