    answer: "vertu"
    alt: []
  - id: arvie4-l4-p6
    sentence: "Exemple d'un mode de vie moralement discutable : ___, réduit à l'état de bête sur l'île de Lemnos."
    answer: "Philoctète"
    alt: []
- id: arvie4-l5
  title: "La fonction propre, et deux vies heureuses"
  notes: |-
    **Pour savoir quel mode de vie rend heureux, Aristote repart de la fonction propre (*ergon*) de l'homme** (*EN*, I, 6), par comparaison avec les arts : {yellow}chaque art a une fonction propre{/yellow} ; comment la nature aurait-elle dispensé l'homme de toute fonction ? {teal}« La vie paraît manifestement commune même aux végétaux{/teal} ; or nous cherchons ce qui est propre à l'homme. Il faut donc écarter la vie de nutrition et de croissance. Viendrait ensuite une vie sensitive, mais celle-ci apparaît également commune au cheval, au bœuf et à tout animal. {teal}Reste donc une certaine vie active de la partie qui possède la raison. »{/teal}

    **Une activité, et une excellence.** La vie heureuse est menée par la partie rationnelle de l'âme, comme {violet}activité{/violet} ou acte (*energeia*) : {red}non un état de latence, comme un état végétatif d'inaction{/red}, mais {green}une manière d'agir{/green}. Et ce qu'on vise n'est pas une simple compétence, mais une {violet}excellence{/violet} (*aretè*), l'excellence ou la vertu : {teal}« {/teal}le bien humain devient {teal}un acte de l'âme qui traduit la vertu{/teal} et, s'il y a plusieurs vertus, {teal}l'acte qui traduit la plus parfaite et la plus complète »{/teal} (*EN*, I, 6).

    **Deux formes de vie heureuse, selon deux usages de la raison.** Aristote résout la tension que certains croient voir entre vie active et vie contemplative :

    | Modèle | Vertu | Partie de l'âme | Objet |
    | Périclès | phronèsis | délibérative | le contingent |
    | Thalès | sophia | scientifique | le nécessaire |

    - {yellow}Périclès{/yellow} : la vie du {violet}prudent{/violet}, tournée vers l'action. La {violet}prudence{/violet} (*phronèsis*) est l'excellence de la raison pratique, de la partie délibérative (*logistikon*), qui porte sur le contingent.
    - {yellow}Thalès{/yellow} : la vie du {violet}sage{/violet} (*sophos*), affaire de contemplation. La {violet}sagesse{/violet} (*sophia*) est l'excellence de la partie scientifique (*épistémonikon*), qui porte sur le nécessaire.

    **La prudence n'est pas une vertu secondaire** : sans elle on ne peut être bon au sens fort (*EN*, VI, 13). Le prudent exécute ce qu'il pense être le mieux, et parce qu'il est {violet}vertueux{/violet} (*spoudaios*), {coral}ce qu'il pense être le mieux l'est vraiment{/coral} ; c'est parce qu'il est prudent qu'il trouve les bons moyens de réaliser une fin vertueuse.
  points:
  - id: arvie4-l5-p1
    sentence: "Aristote soulève la question de la fonction propre de l'homme par comparaison avec les ___ : chacun a une fonction propre, l'homme en aurait-il été dispensé ?"
    answer: "arts"
    alt: []
  - id: arvie4-l5-p2
