    alt: []
  - id: arvie4-l3-p3
    sentence: "*Politique*, I, 2 : la cité, « **née en vue de vivre**, elle existe en vue du bien ___ »."
    answer: "vivre"
    alt: []
  - id: arvie4-l3-p7
    sentence: "__Parce que la cité existe en vue du bien vivre__, un mode de vie ___ interdit **la fin proprement humaine**."
    answer: "solitaire"
    alt: []
  - id: arvie4-l3-p5
    sentence: "__L'homme n'est pas un animal politique au même titre que l'abeille__ : il vit dans une *polis*, où il vit selon des ___ **qu'il choisit**."
    answer: "valeurs"
    alt: ["normes"]
