    answer: "Philoctète"
    alt: []
- id: arvie4-l5
  title: "La fonction propre, et deux vies heureuses"
  notes: |-
    **Pour savoir quel mode de vie rend heureux, Aristote repart de la fonction propre ({blue}*ergon*{/blue}) de l'homme** (*EN*, I, 6), par comparaison avec les arts : {yellow}chaque art a une fonction propre{/yellow} ; comment la nature aurait-elle dispensé l'homme de toute fonction ? {teal}« La vie paraît manifestement commune même aux végétaux{/teal} ; or nous cherchons ce qui est propre à l'homme. Il faut donc écarter la vie de nutrition et de croissance. Viendrait ensuite une vie sensitive, mais celle-ci apparaît également commune au cheval, au bœuf et à tout animal. {teal}Reste donc une certaine vie active de la partie qui possède la raison. »{/teal}

    **Une activité, et une excellence.** La vie heureuse est menée par la partie rationnelle de l'âme, comme {violet}activité{/violet} ou acte ({blue}*energeia*{/blue}) : {red}non un état de latence, comme un état végétatif d'inaction{/red}, mais {green}une manière d'agir{/green}. Et ce qu'on vise n'est pas une simple compétence, mais une {violet}excellence{/violet} ({blue}*aretè*{/blue}), l'excellence ou la vertu : {teal}« {/teal}le bien humain devient {teal}un acte de l'âme qui traduit la vertu{/teal} et, s'il y a plusieurs vertus, {teal}l'acte qui traduit la plus parfaite et la plus complète »{/teal} (*EN*, I, 6).

    **Deux formes de vie heureuse, selon deux usages de la raison.** Aristote résout la tension que certains croient voir entre vie active et vie contemplative :

    | Modèle | Vertu | Partie de l'âme | Objet |
    | Périclès | phronèsis | délibérative | le contingent |
    | Thalès | sophia | scientifique | le nécessaire |

    - {yellow}Périclès{/yellow} : la vie du {violet}prudent{/violet}, tournée vers l'action. La {violet}prudence{/violet} ({blue}*phronèsis*{/blue}) est l'excellence de la raison pratique, de la partie délibérative ({blue}*logistikon*{/blue}), qui porte sur le contingent.
    - {yellow}Thalès{/yellow} : la vie du {violet}sage{/violet} ({blue}*sophos*{/blue}), affaire de contemplation. La {violet}sagesse{/violet} ({blue}*sophia*{/blue}) est l'excellence de la partie scientifique ({blue}*épistémonikon*{/blue}), qui porte sur le nécessaire.

    **La prudence n'est pas une vertu secondaire** : sans elle on ne peut être bon au sens fort (*EN*, VI, 13). Le prudent exécute ce qu'il pense être le mieux, et parce qu'il est {violet}vertueux{/violet} ({blue}*spoudaios*{/blue}), {coral}ce qu'il pense être le mieux l'est vraiment{/coral} ; c'est parce qu'il est prudent qu'il trouve les bons moyens de réaliser une fin vertueuse.
  points:
  - id: arvie4-l5-p1
    sentence: "Aristote soulève la question de **la fonction propre de l'homme** par comparaison avec les ___ : chacun a une fonction propre, l'homme en aurait-il été dispensé ?"
    answer: "arts"
    alt: []
  - id: arvie4-l5-p9
    sentence: "__La vie heureuse est une activité de la partie rationnelle de l'âme__ : une manière d'agir, et non **un état de** ___, comme un état végétatif d'inaction."
    answer: "latence"
    alt: []
  - id: arvie4-l5-p10
    sentence: "__Ce qu'on vise dans la vie heureuse__ n'est pas une simple compétence, mais **une excellence**, en grec *___*, l'excellence ou la vertu."
    answer: "aretè"
    alt: ["arétè", "arete", "aretê"]
  - id: arvie4-l5-p4
    sentence: "*Éthique à Nicomaque*, I, 6 : __le bien humain__ devient « **un acte de l'âme** qui traduit la ___ »."
    answer: "vertu"
    alt: []
  - id: arvie4-l5-p11
    sentence: "La prudence n'est pas une vertu ___ : **sans elle on ne peut être bon au sens fort** (*EN*, VI, 13)."
    answer: "secondaire"
    alt: []
  - id: arvie4-l5-p12
    sentence: "__Deux formes de vie heureuse__, selon deux usages de la ___ : **la vie du prudent**, comme Périclès, et **celle du sage**, comme Thalès."
    answer: "raison"
    alt: []
  - id: arvie4-l5-p8
    sentence: "Le prudent exécute ce qu'il pense être le mieux, et __parce qu'il est vertueux__, en grec *___*, **ce qu'il pense être le mieux l'est vraiment**."
    answer: "spoudaios"
    alt: []
- id: arvie4-l6
  title: "S'immortaliser, et vivre en homme"
  notes: |-
    **Deux vies heureuses, mais une primauté : la vie contemplative** ({blue}*bios theôrètikos*{/blue}). La vie conforme aux vertus morales et à la prudence n'est qu'un bonheur humain {teal}« à titre second »{/teal} (*EN*, X, 8). Si le bonheur est une activité conforme à la vertu, il s'accomplit selon {teal}« la vertu de ce qu'il y a de meilleur en nous »{/teal}, l'{violet}intellect{/violet} ({blue}*nous*{/blue}), dans la contemplation (*EN*, X, 7). La {blue}*theôria*{/blue} est supérieure parce qu'elle est {amber}l'activité la plus continue{/amber}, qui {amber}trouve sa fin en elle-même{/amber}, et procure {amber}les plaisirs les plus purs et les plus stables{/amber}. En exerçant ce qu'il y a de divin en lui, {coral}l'homme qui contemple participe à sa mesure de l'immortalité{/coral}, s'abstrayant, le temps de la pensée, des vicissitudes du corps (*EN*, X, 7). {coral}Le sage vit autant que faire se peut la vie d'un dieu.{/coral}

    **S'immortaliser, à sa mesure.** La raison nous oblige à ne pas nous ravaler au rang de bête, et peut nous élever au-delà de notre condition. Mais l'homme qui veut {teal}« s'immortaliser »{/teal} {red}ne recherchera ni la gloire, ni l'abolition de sa mortalité biologique{/red}, désir aussi vain qu'impossible. {green}La mort est naturelle{/green}, et n'est pas à craindre : sans douleur quand elle vient dans la vieillesse sans cause qui la provoque. Il s'immortalisera {amber}en faisant de la contemplation le principe de son existence{/amber}.

    **Aristote est-il vitaliste ?** À l'origine du vitalisme, l'intuition que la vie est un phénomène si original qu'on ne peut l'expliquer par des causes matérielles, et qu'il faut un principe vital immatériel. Aristote, qui pose une âme, forme et fin du vivant, {pink}ouvre la voie à ce type d'analyse{/pink}. Mais {red}on ne saurait le dire vitaliste{/red}, si cela suppose un principe transcendant et mystérieux. {green}Son analyse est résolument scientifique{/green} : vivre, ce n'est pas réagir à son environnement, c'est {coral}déployer une activité qui trouve son origine dans le vivant lui-même et sa fin dans l'accomplissement d'une nature{/coral}. Et l'éminence de l'homme ne tient pas à un principe transcendant, comme {sky}l'élan vital de Bergson{/sky}.

    **Le message est clair** : {teal}« immortalisons-nous en philosophant pour nous rapprocher des dieux, mais vivons en homme{/teal}, ici et maintenant, {teal}dans cette vie et dans la cité{/teal}, pour goûter au bonheur humain dans l'échange avec nos semblables ».
  points:
  - id: arvie4-l6-p11
    sentence: "__Deux vies heureuses, mais une primauté__ : celle de la vie ___ (*bios theôrètikos*), la vie conforme aux vertus morales n'étant qu'**un bonheur « à titre second »**."
    answer: "contemplative"
    alt: []
  - id: arvie4-l6-p1
    sentence: "Aristote qualifie **la vie conforme aux vertus morales et à la prudence** de bonheur humain « à titre ___ » (*EN*, X, 8)."
    answer: "second"
    alt: []
  - id: arvie4-l6-p3
    sentence: "__La contemplation est supérieure__ parce qu'elle est l'activité la plus ___, qui **trouve sa fin en elle-même** et procure les plaisirs les plus purs."
    answer: "continue"
    alt: []
