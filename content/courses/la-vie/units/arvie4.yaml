lessons:
- id: arvie4-l1
  title: "Bien vivre, et le prix d'une vie choisie"
  notes: |-
    **Tous les animaux recherchent leur bien et désirent naturellement vivre ; mais l'homme ne travaille pas seulement à conserver sa vie.** Il recherche {violet}le bien vivre{/violet} (*eu zèn*), {amber}une vie accomplie et heureuse{/amber}. La philosophie naturelle rejoint ici la philosophie pratique, éthique et politique, qui la prolonge : qu'est-ce que vivre en homme, si cela signifie vivre heureux ? {coral}« Vivre en homme » prend une dimension morale et politique : on cherche le mode de vie *digne* d'un homme, celui qui lui permet d'accomplir sa nature.{/coral}

    **Rien n'empêche un homme de vivre comme une bête.** On peut y être ravalé {red}sous la contrainte{/red}, comme l'{yellow}esclave{/yellow}, ou {red}par choix{/red}, tel {yellow}Diogène le cynique{/yellow}, qui pense vivre selon la nature en prenant modèle sur {yellow}une souris{/yellow}. C'est biologiquement possible, puisque l'homme a toutes les facultés des autres animaux. {amber}Mais est-ce souhaitable ?{/amber} C'est là que se pose la question morale et politique du mode de vie qu'on *doit* mener.

    **Elle se pose nécessairement, parce que l'homme peut choisir sa vie** : {coral}tel est son privilège autant que son fardeau{/coral}. Agent libre de délibérer et de choisir la fin qu'il vise et les moyens de l'atteindre, {amber}il est responsable de sa vie{/amber}. Quelle est la fin de la vie proprement humaine, et comment l'accomplir ? C'est le problème de l'*Éthique à Eudème*, de l'*Éthique à Nicomaque* et de la *Politique*.
  points:
  - id: arvie4-l1-p1
    sentence: "L'homme ne travaille pas seulement à conserver sa vie : il recherche le bien vivre, en grec *___ zèn*, une vie accomplie et heureuse."
    answer: "eu"
