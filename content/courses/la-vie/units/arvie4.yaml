    answer: "grégaire"
    alt: []
  - id: arvie4-l2-p6
    sentence: "*Métaphysique*, A, 1 : __l'homme seul vit__ « au moyen de la **technique** et des ___ »."
    answer: "raisonnements"
    alt: []
  - id: arvie4-l2-p9
