    answer: "spoudaios"
    alt: []
- id: arvie4-l6
  title: "S'immortaliser, et vivre en homme"
  notes: |-
    **Deux vies heureuses, mais une primauté : la vie contemplative** (*bios theôrètikos*). La vie conforme aux vertus morales et à la prudence n'est qu'un bonheur humain {teal}« à titre second »{/teal} (*EN*, X, 8). Si le bonheur est une activité conforme à la vertu, il s'accomplit selon {teal}« la vertu de ce qu'il y a de meilleur en nous »{/teal}, l'{violet}intellect{/violet} (*nous*), dans la contemplation (*EN*, X, 7). La {violet}*theôria*{/violet} est supérieure parce qu'elle est {amber}l'activité la plus continue{/amber}, qui {amber}trouve sa fin en elle-même{/amber}, et procure {amber}les plaisirs les plus purs et les plus stables{/amber}. En exerçant ce qu'il y a de divin en lui, {coral}l'homme qui contemple participe à sa mesure de l'immortalité{/coral}, s'abstrayant, le temps de la pensée, des vicissitudes du corps (*EN*, X, 7). {coral}Le sage vit autant que faire se peut la vie d'un dieu.{/coral}

    **S'immortaliser, à sa mesure.** La raison nous oblige à ne pas nous ravaler au rang de bête, et peut nous élever au-delà de notre condition. Mais l'homme qui veut {teal}« s'immortaliser »{/teal} {red}ne recherchera ni la gloire, ni l'abolition de sa mortalité biologique{/red}, désir aussi vain qu'impossible. {green}La mort est naturelle{/green}, et n'est pas à craindre : sans douleur quand elle vient dans la vieillesse sans cause qui la provoque. Il s'immortalisera {amber}en faisant de la contemplation le principe de son existence{/amber}.

    **Aristote est-il vitaliste ?** À l'origine du vitalisme, l'intuition que la vie est un phénomène si original qu'on ne peut l'expliquer par des causes matérielles, et qu'il faut un principe vital immatériel. Aristote, qui pose une âme, forme et fin du vivant, {pink}ouvre la voie à ce type d'analyse{/pink}. Mais {red}on ne saurait le dire vitaliste{/red}, si cela suppose un principe transcendant et mystérieux. {green}Son analyse est résolument scientifique{/green} : vivre, ce n'est pas réagir à son environnement, c'est {coral}déployer une activité qui trouve son origine dans le vivant lui-même et sa fin dans l'accomplissement d'une nature{/coral}. Et l'éminence de l'homme ne tient pas à un principe transcendant, comme {sky}l'élan vital de Bergson{/sky}.

    **Le message est clair** : {teal}« immortalisons-nous en philosophant pour nous rapprocher des dieux, mais vivons en homme{/teal}, ici et maintenant, {teal}dans cette vie et dans la cité{/teal}, pour goûter au bonheur humain dans l'échange avec nos semblables ».
  points:
  - id: arvie4-l6-p1
    sentence: "Aristote qualifie la vie conforme aux vertus morales et à la prudence de bonheur humain « à titre ___ » (*EN*, X, 8)."
    answer: "second"
    alt: []
  - id: arvie4-l6-p2
    sentence: "Le bonheur s'accomplit selon « la vertu de ce qu'il y a de meilleur en nous », l'intellect, en grec *___*."
    answer: "nous"
    alt: ["noûs"]
  - id: arvie4-l6-p3
    sentence: "La contemplation est supérieure parce qu'elle est l'activité la plus ___, qui trouve sa fin en elle-même et procure les plaisirs les plus purs."
    answer: "continue"
    alt: []
  - id: arvie4-l6-p4
    sentence: "En exerçant ce qu'il y a de divin en lui, l'homme qui contemple participe à sa mesure de l'___."
    answer: "immortalité"
    alt: []
  - id: arvie4-l6-p5
    sentence: "L'homme qui veut « s'immortaliser » ne recherchera ni la ___, ni l'abolition de sa mortalité biologique."
    answer: "gloire"
    alt: []
  - id: arvie4-l6-p6
    sentence: "On ne saurait dire Aristote ___, si cela suppose un principe transcendant et mystérieux qui serait la vie."
    answer: "vitaliste"
    alt: []
  - id: arvie4-l6-p7
