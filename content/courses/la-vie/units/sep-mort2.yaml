lessons:
- id: sep-mort2-l1
  title: "La thèse du préjudice et ce qu'elle coûte"
  notes: |-
    **La mort est-elle mauvaise pour certains de ceux qui meurent ? Bonne pour d'autres ?** Selon la {violet}thèse du préjudice{/violet}, {green}la mort est, au moins parfois, mauvaise pour ceux qui meurent{/green}, et en ce sens leur « nuit ».

    **Pourquoi la question compte : notre réponse peut elle-même nous nuire.** Nous aimons la vie ; elle est bonne, donc davantage serait mieux ; donc la mort est mauvaise : {red}plus la vie est bonne, pire est la mort{/red}. Nous risquons alors de condamner la condition humaine, qui embrasse vie et mort, pour son côté tragique. On peut se rappeler qu'elle a aussi un bon côté : c'est même parce que la vie est bonne que nous condamnons la mort. Mais la consolation n'est pas pour tous :
    - qui désire l'immortalité, parce que seuls des projets sans fin lui paraissent valoir, condamnera la condition mortelle comme tragique de part en part, et pourra, comme le remarque **Unamuno** (1913), finir {red}suicidaire{/red}, craignant que la seule vie disponible ne vaille pas d'être vécue ;
    - et le mal peut annuler une grande part du bien dans le bilan d'ensemble.

    De toute façon, il est assez sombre de conclure, avec la thèse du préjudice, que **la condition humaine a un côté tragique**. Rien d'étonnant à ce que, depuis des millénaires, on ait cherché à la réfuter, à commencer par **Épicure**.

    ! La thèse du préjudice ne dit pas que la mort est toujours un mal : seulement qu'elle l'est parfois. Elle peut même être un bien pour certains.
