    answer: "neutre"
    alt: []
- id: sep-mort2-l5
  title: "Le privationnisme : Hilda à vingt-cinq ans"
  notes: |-
    **Appliqué à la mort, le comparativisme donne ceci** : pour savoir si la mort d'une personne est globalement mauvaise pour elle, on compare son bien-être de toute une vie **réel** à celui qu'elle aurait eu **si elle n'était pas morte**.

    **L'exemple d'Hilda.** Hilda meurt sans douleur le 1er décembre 2008, à 25 ans.
    - Si elle avait dû prospérer encore 25 ans, puis souffrir ses cinq dernières années, son bien-être sur ces 30 ans aurait été élevé : {red}mourir à 25 ans est globalement mauvais pour elle{/red}.
    - Si elle avait dû vivre 25 ans de malheur, même avec cinq dernières années positives, son bien-être de toute une vie aurait été plus bas : {green}mourir à 25 ans est globalement bon pour elle{/green}.

    **La mort nuit par ce qu'elle retire.** Selon le comparativisme, quand une mort est mauvaise sans faire subir de maux comme la douleur, c'est qu'{green}__elle empêche d'avoir des biens qu'on aurait eus sans elle__{/green}. La mort nous nuit par les biens dont elle nous **prive**, non (du moins pas toujours) par des maux qu'elle causerait. C'est le {violet}privationnisme{/violet}.

    **D'où la réponse à Épicure.** Que la mort ne soit pas une expérience n'empêche pas qu'elle nuise : il suffit qu'elle retranche d'une vie des biens à venir. Reste un doute sérieux : **à quel moment** la mort nous rend-elle plus mal lotis ? C'est l'objet de l'unité suivante.

    ! Le privationnisme ne dit pas que toute mort est un mal : la même mort peut être un mal ou un bien selon ce qu'aurait été la suite de la vie.
  points:
  - id: sep-mort2-l5-p1
    sentence: "Pour savoir si une mort est globalement mauvaise pour quelqu'un, on compare son bien-être de toute une vie réel à celui qu'il aurait eu s'il n'était pas ___."
    answer: "mort"
    alt: []
  - id: sep-mort2-l5-p2
    sentence: "Si Hilda, morte à 25 ans, avait dû prospérer encore 25 ans puis souffrir cinq ans, mourir à 25 ans est globalement ___ pour elle."
    answer: "mauvais"
    alt: []
  - id: sep-mort2-l5-p3
    sentence: "Si Hilda, morte à 25 ans, avait dû vivre 25 ans de malheur, mourir à 25 ans est globalement ___ pour elle."
    answer: "bon"
    alt: []
  - id: sep-mort2-l5-p4
    sentence: "Selon le ___, la mort nous nuit par les biens dont elle nous prive, non (du moins pas toujours) par des maux qu'elle causerait."
    answer: "privationnisme"
    alt: []
  - id: sep-mort2-l5-p5
    sentence: "Que la mort ne soit pas une expérience n'empêche pas qu'elle nuise, pour le privationniste : il suffit qu'elle ___ d'une vie des biens à venir."
    answer: "retranche"
    alt: []
  - id: sep-mort2-l5-p6
    sentence: "Le doute qui reste au privationnisme : à quel ___ la mort nous rend-elle plus mal lotis qu'autrement ?"
    answer: "moment"
    alt: []
