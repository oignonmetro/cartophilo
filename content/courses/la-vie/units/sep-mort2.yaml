- id: sep-mort2-l3
  title: "Trois failles de l'argument"
  notes: |-
    **Première faille : « mort » a deux sens.** L'argument vaut pour **être mort**, non pour **mourir**. Être mort n'est pas une expérience et n'en cause aucune ; mais {red}on peut faire l'expérience de mourir{/red}, et cette expérience peut être douloureuse, donc mauvaise même pour un hédoniste. L'argument ne montre pas que mourir dans la douleur n'est pas un mal. Il établit encore beaucoup : être mort n'est ni bon ni mauvais, et mourir n'est mauvais qu'autant que cela fait souffrir ; {coral}mourir dans son sommeil serait parfaitement indifférent{/coral}.

    **Deuxième faille : l'hédonisme intrinsèque est contestable.** Beaucoup refusent de limiter les biens intrinsèques au plaisir et à la douleur. Le {violet}préférentialisme{/violet} (théorie de la satisfaction des désirs) tient qu'il est bon en soi qu'un de nos désirs soit satisfait, mauvais qu'il soit contrarié. Or {green}__un désir peut être satisfait ou contrarié sans que je le remarque__{/green} : {yellow}si je veux que ma fille soit heureuse, et qu'elle l'est, mon désir est satisfait, même si elle est partie si loin que je ne la reverrai jamais{/yellow}. Le préférentialisme bloque donc le passage de (1) à (2), et celui vers (7) : la mort peut nous nuire en contrariant nos désirs, sans rien nous faire éprouver.

    **Troisième faille : l'instrumentalisme extrinsèque oublie la privation.** Thomas **Nagel**, dans son essai « Death » (1970), l'a vu : {green}__une chose peut être bonne ou mauvaise pour nous en nous *empêchant d'avoir* des choses intrinsèquement mauvaises ou bonnes__{/green}, pas seulement en nous en faisant avoir. {yellow}L'anesthésie avant une opération{/yellow} est bonne pour le patient parce qu'elle lui épargne une grande souffrance, non parce qu'elle lui procure un plaisir. Inversement, être rendu inconscient pendant une **fête joyeuse** est mauvais, parce que cela prive de la joie qu'on y aurait prise. La mort pourrait nous nuire de cette façon.
  points:
  - id: sep-mort2-l3-p1
    sentence: "L'argument d'Épicure vaut pour le fait d'être mort, non pour le fait de ___ : on peut faire l'expérience de mourir, et elle peut être douloureuse."
    answer: "mourir"
    alt: []
  - id: sep-mort2-l3-p2
    sentence: "Même restreint, l'argument d'Épicure établit beaucoup : mourir dans son ___ serait parfaitement indifférent."
    answer: "sommeil"
    alt: []
  - id: sep-mort2-l3-p3
    sentence: "Le ___, ou théorie de la satisfaction des désirs, tient qu'il est bon en soi qu'un de nos désirs soit satisfait, mauvais qu'il soit contrarié."
    answer: "préférentialisme"
    alt: []
  - id: sep-mort2-l3-p4
    sentence: "Un désir peut être satisfait ou contrarié sans que je le ___ : si je veux que ma fille soit heureuse et qu'elle l'est, mon désir est satisfait même si je ne la revois jamais."
    answer: "remarque"
    alt: []
  - id: sep-mort2-l3-p5
    sentence: "Si un désir peut être contrarié sans rien nous faire éprouver, la mort peut nous nuire en ___ nos désirs, même sans être une expérience."
    answer: "contrariant"
    alt: []
  - id: sep-mort2-l3-p6
    sentence: "Dans son essai « Death » (1970), Thomas ___ note qu'une chose peut être mauvaise pour nous en nous empêchant d'avoir des biens."
