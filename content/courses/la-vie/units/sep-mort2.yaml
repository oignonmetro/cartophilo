- id: sep-mort2-l4
  title: "Le comparativisme : mesurer une vie entière"
  notes: |-
    **Pour défendre la thèse du préjudice, on recourt au {violet}comparativisme{/violet}** (Nagel 1970, Quinn 1984, Feldman 1991) : {green}__nous subissons un tort de ce qui rend notre vie, prise comme un tout, pire qu'elle n'aurait été, et un bienfait de ce qui la rend meilleure__{/green}.

    **Le niveau de bien-être.** Notre bien-être monte et descend au fil du temps, selon les biens intrinsèques (le plaisir) et les maux intrinsèques (la douleur) que nous recevons alors. Il est positif si les biens l'emportent, nul si les uns compensent exactement les autres, **pourvu qu'on soit capable de bien-être** ({yellow}une chaussure n'en a aucun, pas même nul{/yellow}). Le bilan de toute une vie est le {violet}niveau de bien-être de toute une vie{/violet}.

    **La définition.** Un événement est globalement bon (mauvais) pour nous *simpliciter* si et seulement s'il rend notre bien-être de toute une vie plus élevé (plus bas) qu'il n'aurait été.

    **L'exemple du dentiste.** Il soigne une carie qui, sinon, vous aurait fait souffrir des mois : le soin est **globalement bon** pour vous. Pourtant, si la roulette vous fait mal et que vous auriez sinon regardé la télévision, il est **mauvais pendant le temps du soin**. D'où une notion relative au temps : un événement est globalement bon (mauvais) pour nous **à un moment *t*** s'il rend notre bien-être plus élevé (plus bas) à *t* qu'il n'aurait été.

    **Le comparativisme est neutre sur les biens.** Il peut s'allier à l'hédonisme comme au préférentialisme : il dit seulement comment comparer, non quoi compter.

    ! « Globalement bon » n'exclut pas la douleur : une chose globalement bonne peut apporter des maux, si elle en épargne davantage.
  points:
  - id: sep-mort2-l4-p1
    sentence: "Selon le ___, nous subissons un tort de ce qui rend notre vie, prise comme un tout, pire qu'elle n'aurait été."
    answer: "comparativisme"
    alt: []
  - id: sep-mort2-l4-p2
