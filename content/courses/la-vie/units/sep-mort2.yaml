- id: sep-mort2-l2
  title: "L'argument d'Épicure, pas à pas"
  notes: |-
    **Épicure (341-270) est hédoniste.** Le plaisir est la seule chose bonne pour nous en elle-même, la douleur la seule mauvaise en elle-même : c'est l'{violet}hédonisme intrinsèque{/violet}. D'où, dans la *Lettre à Ménécée*, {teal}« tout bien et tout mal résident dans la sensation »{/teal}, et {teal}« quand nous sommes, la mort n'est pas, et quand la mort est là, nous ne sommes pas »{/teal} : la mort d'une personne et son existence ne se recouvrent pas dans le temps.

    {teal}« Habitue-toi à penser que la mort n'est rien pour nous, puisque tout bien et tout mal résident dans la sensation, et que la mort est privation de sensation. […] Ainsi le plus effrayant des maux, la mort, n'est rien pour nous, puisque, quand nous sommes, la mort n'est pas, et quand la mort est là, nous ne sommes pas. »{/teal}

    **L'argument reconstruit.** Épicure ne donne pas tout ; Luper complète :
    - **(1) L'hédonisme intrinsèque est vrai.** **(2)** Donc rien n'est bon ou mauvais *en soi* pour quelqu'un sans être une **expérience**. **(3)** Or la mort d'une personne n'est pas une expérience ({yellow}je peux faire l'expérience d'une tasse, la tasse n'est pas une expérience{/yellow}). **(4)** Donc la mort n'est pas intrinsèquement bonne ou mauvaise pour elle.
    - Mais ce qui n'est pas mauvais en soi peut l'être **extrinsèquement**, par ses effets (voir quelqu'un se casser le bras cause une tristesse douloureuse). Épicure semble admettre l'{violet}instrumentalisme extrinsèque{/violet} : **(5)** une chose n'est extrinsèquement bonne ou mauvaise pour quelqu'un que si elle *lui fait avoir* des choses intrinsèquement bonnes ou mauvaises. **(6)** Or, mort et existence ne se recouvrant pas, la mort ne fait avoir **aucune expérience**. **(7)** Donc la mort n'est pas extrinsèquement bonne ou mauvaise.
    - **(8)** Une chose n'est bonne ou mauvaise pour quelqu'un que si elle l'est intrinsèquement ou extrinsèquement. **(9)** Donc {red}la mort d'une personne n'est ni bonne ni mauvaise pour elle{/red} : la thèse du préjudice est fausse.
