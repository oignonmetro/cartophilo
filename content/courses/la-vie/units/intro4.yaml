- id: intro4-l4
  title: "La vie, donnée et norme"
  notes: |-
    **La vie semble d'abord une donnée naturelle** : elle recouvre un type déterminé de phénomènes, les phénomènes biologiques. **Mais elle peut aussi être présentée, ou constituée, comme une norme.**

    **L'argument part de la finalité.** Puisque le règne du vivant porte la trace d'une {violet}finalité{/violet} (voir l'unité sur la conception ordinaire), {amber}les phénomènes vitaux peuvent être dysfonctionnels{/amber} : ne pas réaliser correctement leur fin. {yellow}Un être vivant se reproduit mal, se nourrit mal{/yellow}, voire ne se reproduit ou ne se nourrit pas du tout. Or on ne peut dire qu'une chose « fonctionne mal » que par rapport à ce qu'elle devrait faire : {coral}les phénomènes vitaux ne sont donc pas de simples choses « données », ils se mesurent à une normativité{/coral}.

    **Aristote : le naturel et le contre-nature.** C'est pourquoi {sky}Aristote{/sky} oppose les mouvements naturels aux mouvements {violet}contre nature{/violet} ({blue}*para phusin*{/blue}), qui sont des mouvements violents ({blue}*bia*{/blue}) ou contraints. Ainsi le {violet}monstre{/violet} ({blue}*teras*{/blue}), {yellow}vivant qui ne réalise pas correctement les normes de son espèce{/yellow}, est le résultat d'une génération contre nature : des accidents durant la gestation {amber}« forcent » ou « contraignent » la matière{/amber} à mal réaliser les fonctions de l'espèce (*Génération des animaux*, IV, 3-4).

    **La vie n'est donc pas une donnée axiologiquement neutre : elle est intrinsèquement porteuse de valeurs.** La {yellow}maladie{/yellow} le révèle, qui résulte d'une dysfonction d'activités vitales, et fait concevoir la {violet}médecine{/violet} comme ce qui corrige le vivant pour le ramener à une « normalité ». C'est la thèse célèbre de {sky}Canguilhem{/sky} (*Le normal et le pathologique*) : {teal}« C'est la vie elle-même et non le jugement médical{/teal} qui fait du normal biologique {teal}un concept de valeur et non un concept de réalité statistique{/teal}. La vie, pour le médecin, {teal}ce n'est pas un objet, c'est une activité polarisée{/teal} dont la médecine prolonge, en lui apportant la lumière relative mais indispensable de la science humaine, l'effort spontané de défense et de lutte contre tout ce qui est {teal}de valeur négative »{/teal}. Autrement dit : {coral}ce n'est pas le médecin qui décide que la maladie est un mal{/coral} ; le vivant lui-même lutte contre elle, et la médecine ne fait que prolonger cet effort.

    **Bien des manières de faire de la vie une norme**, et de dire des formes de vie, individuelles ou collectives, « naturelles » ou « contre nature » : on peut insister sur {amber}le caractère essentiellement conflictuel des manifestations vitales{/amber} (Hegel, Schopenhauer, Nietzsche), ou au contraire sur {amber}la fragilité de la vie{/amber} et la difficulté de réunir et préserver les conditions de son épanouissement.
  points:
  - id: intro4-l4-p1
    sentence: "Parce que le vivant porte la trace d'une finalité, ses phénomènes peuvent être ___ : un être vivant se reproduit mal, ou se nourrit mal."
    answer: "dysfonctionnels"
