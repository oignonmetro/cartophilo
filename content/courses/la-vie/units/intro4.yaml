    answer: "interespèces"
    alt: []
- id: intro4-l6
  title: "Éthique et politique du vivant : le « droit à la vie »"
  notes: |-
    **Second exemple : le « droit à la vie ».** Les mouvements {violet}« pro-vie »{/violet} défendaient, et défendent encore, un {red}« droit à la vie »{/red} pour s'opposer au droit à l'avortement, à l'euthanasie, au suicide assisté, parfois à certaines formes de contraception.

    **Mais au nom de la vie, on peut défendre des droits diamétralement opposés.** Car {coral}fonder un « droit à la vie » sur l'une des caractéristiques du vivant, c'est nécessairement en exclure une partie{/coral}. Un exemple polémique le montre. Fondons ce droit sur la capacité à préparer et anticiper son futur, avec {sky}Peter Singer{/sky} (*Practical Ethics*, 1979) : {teal}« {/teal}ce n'est pas être spéciste que de dire qu'{teal}une vie capable de conscience de soi{/teal}, de pensée abstraite, de {teal}planifier son futur{/teal}, d'actes de communications complexes, et ainsi de suite..., {teal}a plus de valeur{/teal} qu'une vie qui n'est pas dotée de ces capacités ».

    **Ce que ce fondement inclut, et ce qu'il exclut :**
    - il s'étend à de nombreux animaux non humains, comme {yellow}les grands singes{/yellow} ;
    - il ne s'étend pas aux {yellow}embryons{/yellow}, aux {yellow}jeunes bébés{/yellow}, à {yellow}certaines personnes sévèrement handicapées{/yellow}.

    Il peut donc conduire à défendre {amber}un « droit » de certaines espèces animales à la vie{/amber} ; {amber}l'avortement et l'euthanasie, dans certaines circonstances{/amber} ; mais aussi {red}certains infanticides{/red}, par exemple d'un bébé dont le handicap laisse anticiper une existence de souffrance. Ces positions suscitent de nombreux débats en bioéthique.

    **La leçon : un droit à la vie sans fondement ni extension n'est qu'un slogan.** Quoi qu'on pense de Singer, l'exemple permet de {coral}dénoncer comme de simples slogans politiques vides de sens les formulations d'un « droit à la vie » qui ne précisent ni ses fondements, ni, de manière rigoureuse et justifiée, l'extension des êtres qu'il concerne{/coral}. Dire « la vie » ne suffit pas : il faut dire *quelle* vie, et pourquoi.
