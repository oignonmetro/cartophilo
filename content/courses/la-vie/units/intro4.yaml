    alt: []
- id: intro4-l2
  title: "Singer : la souffrance animale, et celle des plantes"
  notes: |-
    **L'affirmation que les animaux ne souffrent pas, que Singer juge formulée le plus radicalement chez Descartes, se réfute par un raisonnement très simple**, en quatre temps :
    - {amber}nul n'a une « expérience directe » de la douleur, sinon de la sienne propre{/amber} ;
    - nous n'attribuons donc de la douleur aux autres que par {amber}une déduction « à partir de diverses indications extérieures »{/amber} ;
    - cette déduction, à défaut de nous donner {pink}une « certitude absolue »{/pink}, est {green}« parfaitement raisonnable »{/green} : c'est ainsi que je sais que mon voisin souffre ;
    - or les animaux réunissent trois indications : (a) {yellow}ils offrent à notre regard des signes de souffrance{/yellow}, (b) {yellow}ils possèdent un système nerveux proche du nôtre{/yellow}, (c) {yellow}ils sont le fruit d'une évolution où la douleur joue un rôle pour la survie{/yellow}. {coral}Refuser de leur étendre la déduction est donc déraisonnable{/coral}, et ne peut être que la marque d'une forme de {violet}spécisme{/violet}.

    Le {violet}spécisme{/violet}, pour Singer, est {teal}« {/teal}un {teal}préjugé{/teal} ou une attitude de parti pris {teal}en faveur des intérêts des membres de sa propre espèce{/teal} et à l'encontre des intérêts des membres des autres espèces ». C'est l'analogue du racisme : un traitement inégal fondé sur l'appartenance, non sur les intérêts.

    **La difficulté qui engage les frontières du vivant : « Comment savons-nous que les plantes ne souffrent pas ? »** Elle revient souvent dans les conversations ordinaires. Singer répond que {red}aucune des trois conditions n'est réunie chez les plantes{/red} : pas de signes de souffrance, pas de système nerveux, pas d'avantage évolutif à éprouver la douleur pour un être qui ne peut fuir. Et quand bien même l'une d'elles souffrirait, {amber}des raisons pragmatiques{/amber}, qui ne s'appliquent pas aux animaux, devraient nous faire préférer la survie de notre espèce : c'est le principe du {violet}moindre mal{/violet} (il faut bien se nourrir de quelque chose).
  points:
  - id: intro4-l2-p1
    sentence: "Nul n'a d'« expérience ___ » de la douleur, sinon de la sienne : nous ne l'attribuons aux autres que par déduction à partir d'indications extérieures."
    answer: "directe"
    alt: []
  - id: intro4-l2-p2
    sentence: "La déduction qui attribue de la douleur aux autres ne donne pas de « certitude absolue », mais elle est « parfaitement ___ »."
    answer: "raisonnable"
    alt: []
  - id: intro4-l2-p3
    sentence: "Parmi les trois indications de la souffrance animale selon Singer : les signes de souffrance, l'évolution où la douleur sert la survie, et un ___ nerveux proche du nôtre."
    answer: "système"
    alt: []
  - id: intro4-l2-p4
    sentence: "Si nous n'attribuons la douleur à nos semblables que par déduction à partir de signes, et que les animaux offrent ces signes, refuser de leur étendre la déduction est déraisonnable : c'est la marque du ___."
    answer: "spécisme"
    alt: []
  - id: intro4-l2-p5
    sentence: "Singer : le spécisme est « un ___ ou une attitude de parti pris en faveur des intérêts des membres de sa propre espèce et à l'encontre des intérêts des membres des autres espèces »."
    answer: "préjugé"
    alt: []
  - id: intro4-l2-p6
    sentence: "À l'objection « Comment savons-nous que les ___ ne souffrent pas ? », Singer répond qu'aucune des trois indications de la souffrance n'y est réunie."
    answer: "plantes"
    alt: []
  - id: intro4-l2-p7
    sentence: "Même si une plante souffrait, des raisons pragmatiques nous feraient préférer la survie de notre espèce : c'est le principe du ___ mal."
    answer: "moindre"
    alt: []
- id: intro4-l3
  title: "Le vitalisme, une idéologie réactionnaire ?"
  notes: |-
    **Des options en apparence strictement théoriques se traduisent-elles nécessairement par des attitudes pratiques à l'égard du vivant ?** Le {violet}spécisme{/violet} de Singer implique des attitudes déterminées ; mais le mécanisme ou le vitalisme ?
    - Pour le {violet}mécanisme{/violet}, {green}rien n'indique qu'il en aille ainsi{/green} : il s'est constitué pour offrir des instruments de connaissance opératoires du vivant.
    - Le {violet}vitalisme{/violet} semble d'abord offrir {green}une conception favorable à la sauvegarde du vivant{/green}, dont il reconnaîtrait la spécificité ; mais {red}il a fait l'objet d'une appropriation importante, au XXe siècle, par le nazisme{/red}.

    **La vie comme « norme » absolue de l'idéologie nazie.** La vie y est conçue comme {red}« lutte »{/red} ; elle s'enracinerait {red}dans une terre, un peuple, une race{/red} ; opposée à une raison qui atomise tout, elle serait la source d'une {red}« unité organique »{/red} de la communauté, donc du droit ; contre le mécanisme froid et abstrait, elle ferait de la nature quelque chose de {red}sacré{/red}. D'où {teal}« une hiérarchie du vivant propre au nazisme »{/teal} : les Aryens au sommet, à côté de certains animaux, non parce qu'ils sont des animaux, mais pour leur supériorité dans la lutte pour la vie ({yellow}les animaux de proie{/yellow}) ; quant aux Juifs, {teal}« {/teal}ni proprement humains ni vraiment animaux, ils ressortissent {teal}au bactériologique{/teal} plus qu'au droit commun biologique » ({sky}Johann Chapoutot{/sky}, *La Loi du sang*, 2014).

    **Mais il faut faire la part des choses** : {green}le vitalisme, d'abord préoccupé de garantir l'autonomie des sciences de la vie{/green}, est une chose ; {red}son « annexion » par l'idéologie nazie, ou par quelque idéologie que ce soit{/red}, en est une autre. {sky}Canguilhem{/sky} le dit (*La connaissance de la vie*) : {teal}« Il est aussi absurde de chercher dans la biologie une justification{/teal} pour une politique et une économie d'exploitation de l'homme par l'homme {teal}qu'il serait absurde de nier à l'organisme vivant{/teal} tout caractère authentique de {teal}hiérarchie fonctionnelle{/teal} et d'intégration des fonctions de relation à des niveaux ascendants [...] parce qu'on est partisan, pour des raisons de justice sociale, {teal}d'une société sans classes »{/teal}. Autrement dit : {coral}l'organisme est bien hiérarchisé, mais cela ne justifie aucune hiérarchie sociale, et l'on n'a pas à nier le fait biologique pour refuser la conclusion politique{/coral}.

    **Conclusion : un bricolage.** La caractérisation de la vie par certaines idéologies réactionnaires, même quand elle s'autorise d'éléments empruntés à un concept scientifique, {coral}relève d'une forme de bricolage destiné à justifier des attitudes pratiques{/coral} : justification « absurde », certes, mais dont on ne saurait sous-estimer {amber}les effets de prestige{/amber}.
  points:
  - id: intro4-l3-p1
    sentence: "Le vitalisme semble offrir une conception favorable à la sauvegarde du vivant ; mais il a fait l'objet, au XXe siècle, d'une appropriation importante par le ___."
    answer: "nazisme"
    alt: []
  - id: intro4-l3-p2
    sentence: "Dans l'idéologie nazie, la vie, conçue comme « ___ », s'enracinerait dans une terre, un peuple, une race, et serait la source de l'« unité organique » de la communauté."
    answer: "lutte"
    alt: []
  - id: intro4-l3-p3
    sentence: "Opposée à une raison qui atomise tout, la vie serait pour l'idéologie nazie la source d'une « unité ___ » de la communauté, et par suite du droit."
    answer: "organique"
    alt: []
  - id: intro4-l3-p4
    sentence: "Johann ___, *La Loi du sang* (2014), décrit « une hiérarchie du vivant propre au nazisme »."
    answer: "Chapoutot"
    alt: []
  - id: intro4-l3-p5
    sentence: "Canguilhem : « Il est aussi ___ de chercher dans la biologie une justification pour une politique et une économie d'exploitation de l'homme par l'homme qu'il serait ___ de nier à l'organisme vivant tout caractère authentique de hiérarchie fonctionnelle »."
    answer: "absurde ; absurde"
    alt: []
  - id: intro4-l3-p6
    sentence: "Canguilhem : il serait absurde de nier à l'organisme vivant tout caractère authentique de hiérarchie ___ parce qu'on est partisan d'une société sans classes."
    answer: "fonctionnelle"
