- id: intro4-l5
  title: "Éthique et politique du vivant : l'écologie"
  notes: |-
    **Parce que la vie peut se concevoir de manière normative, elle est mobilisée dans des débats éthiques et politiques variés.** On laisse de côté l'un des concepts les plus centraux sur les rapports entre politique et vie, la {violet}biopolitique{/violet} ({sky}Foucault{/sky}), pour deux exemples relativement communs ; le premier est l'écologie politique.

    **Le vivant contre la nature.** Dans le sillage des {violet}« penseurs du vivant »{/violet} ({sky}Bruno Latour{/sky}, {sky}Philippe Descola{/sky}, {sky}Baptiste Morizot{/sky}, {sky}Donna Haraway{/sky}, {sky}Eduardo Viveiros de Castro{/sky}), on conteste de plus en plus l'usage du concept de {red}« nature »{/red}, auquel on préfère celui de {green}« vivant »{/green}.
    - La « nature » serait {red}une construction largement « occidentale »{/red}, tributaire d'{red}un sujet moderne en position d'extériorité, voire de surplomb{/red} : l'homme face à la nature, qui la regarde et l'exploite.
    - On lui substitue l'idée que {green}les humains ne sont que des vivants parmi d'autres{/green}, qui doivent résister contre {amber}un mode de production hostile au vivant dans son ensemble{/amber}, par exemple dans les {yellow}« Zones à Défendre » (ZAD){/yellow}.

    **L'intérêt politique, et le risque.** Ces manières de concevoir la lutte peuvent avoir, dans des circonstances à déterminer, un intérêt politique. Mais {coral}à partir de quel point cet intérêt risque-t-il de nous conduire à un mauvais usage de nos catégories intellectuelles ?{/coral}
    - faut-il prêter des {pink}« droits »{/pink} au vivant ?
    - transformer les {pink}« non-humains »{/pink} en {pink}« sujets politiques »{/pink} ?
    - imaginer des {pink}« alliances » interespèces{/pink} se révoltant contre un mode de production désastreux ?

    ! Ce n'est pas un rejet de l'écologie : la question porte sur l'usage des catégories de droit et de sujet politique, forgées pour des humains.
  points:
  - id: intro4-l5-p1
    sentence: "Parmi les concepts centraux sur les rapports entre politique et vie, celui de ___ est associé à Michel Foucault."
    answer: "biopolitique"
    alt: ["biopouvoir"]
  - id: intro4-l5-p2
    sentence: "Dans le sillage des « penseurs du vivant », on conteste l'usage du concept de « nature », auquel on préfère celui de « ___ »."
    answer: "vivant"
    alt: []
  - id: intro4-l5-p3
    sentence: "Pour les penseurs du vivant, la « nature » serait une construction largement « occidentale », tributaire d'un sujet moderne en position d'___, voire de surplomb."
    answer: "extériorité"
    alt: []
  - id: intro4-l5-p4
