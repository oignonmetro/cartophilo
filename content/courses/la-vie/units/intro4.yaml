lessons:
- id: intro4-l1
  title: "Singer : la sensibilité comme limite des intérêts"
  notes: |-
    **Les options théoriques sur la vie engagent des conséquences pratiques**, et d'abord le mécanisme : en déniant au vivant tout privilège ontologique sur la matière inerte, il a fait l'objet de très vives attaques sur le plan éthique. On laisse ici de côté la position réelle de Descartes, passablement caricaturée, pour examiner les arguments de l'un des principaux représentants de l'{violet}éthique animale{/violet} : {sky}Peter Singer{/sky} (*La libération animale*, 1975).

    **Le principe : une égale considération des intérêts.** Singer se place dans une perspective {violet}utilitariste{/violet}, inspirée notamment par {sky}Jeremy Bentham{/sky} (1748-1832) : il faut {teal}« donner aux intérêts de chacun une considération égale »{/teal}, en se gardant de décider des intérêts d'un individu d'après les siens propres. C'est le {violet}principe d'égale considération{/violet}.

    **Le critère : la sensibilité.** Or {teal}« {/teal}le {teal}critère de la sensibilité »{/teal}, c'est-à-dire {teal}« la capacité à souffrir et/ou à ressentir le plaisir »{/teal}, {teal}« {/teal}fournit {teal}la seule limite défendable{/teal} à la préoccupation pour les intérêts des autres ». Pourquoi la seule ? Parce que cette capacité est {teal}« {/teal}une {teal}condition nécessaire{/teal} sans laquelle un être {teal}n'a pas d'intérêts du tout »{/teal}. Avoir un intérêt, c'est pouvoir être mieux ou plus mal ; or {yellow}une pierre{/yellow}, contrairement à {yellow}un animal{/yellow}, ne peut rien éprouver : {coral}elle n'a pas d'intérêt, faute de pouvoir souffrir ou jouir{/coral}. Le critère tombe donc exactement là où commencent les intérêts.

    **L'objection classique : le flou des frontières du vivant**, puisque l'être vivant se caractérise justement ici par cette capacité. Singer y répond en distinguant deux affirmations :
    - {pink}comparer la souffrance animale et la souffrance humaine{/pink} : la question ne se pose pas, en vertu du principe d'égale considération ; Singer reconnaît même une {teal}« {/teal}différence significative entre {teal}les humains adultes normaux et les autres animaux »{/teal} ;
    - {red}nier que les animaux souffrent{/red} de quelque manière que ce soit, parce qu'ils seraient {teal}« {/teal}des {teal}automates inconscients{/teal}, ne possédant ni pensées ni sensibilité ni vie mentale d'aucune sorte » : c'est cette affirmation, bien plus forte et moins plausible, qu'il faut discuter. La leçon suivante en donne la réfutation.
  points:
  - id: intro4-l1-p1
    sentence: "Singer place son éthique animale dans une perspective utilitariste inspirée notamment par Jeremy ___ (1748-1832)."
    answer: "Bentham"
    alt: []
  - id: intro4-l1-p2
    sentence: "Singer : il faut « donner aux intérêts de chacun une considération ___ » : c'est le principe d'égale considération."
    answer: "égale"
    alt: []
  - id: intro4-l1-p3
    sentence: "Singer : « le critère de la ___ » fournit la seule limite défendable à la préoccupation pour les intérêts des autres."
    answer: "sensibilité"
    alt: []
  - id: intro4-l1-p4
    sentence: "Singer : la capacité à souffrir ou à ressentir le plaisir est « une condition ___ sans laquelle un être n'a pas d'intérêts du tout »."
    answer: "nécessaire"
    alt: []
  - id: intro4-l1-p5
    sentence: "Avoir un intérêt, c'est pouvoir être mieux ou plus mal : une ___, qui ne peut ni souffrir ni éprouver de plaisir, n'a pas d'intérêts, contrairement à un animal."
    answer: "pierre"
    alt: []
  - id: intro4-l1-p6
    sentence: "C'est ___ qui fait de la capacité à souffrir et à ressentir le plaisir la seule limite défendable à la préoccupation pour les intérêts des autres."
    answer: "Singer"
    alt: ["Peter Singer"]
