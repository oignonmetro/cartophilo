    sentence: "Singer discute l'affirmation selon laquelle les animaux ne souffriraient pas, parce qu'ils seraient des « ___ inconscients, ne possédant ni pensées ni sensibilité ni vie mentale d'aucune sorte »."
    answer: "automates"
    alt: []
