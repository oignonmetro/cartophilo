    alt: []
  - id: intro4-l4-p5
    sentence: "Aristote explique la génération du monstre par des accidents de gestation qui contraignent la matière, dans la *Génération des animaux*, livre ___, chapitres 3-4."
    answer: "IV"
    alt: ["4"]
  - id: intro4-l4-p6
    sentence: "La vie n'est pas une donnée ___ neutre : elle est intrinsèquement porteuse de valeurs, comme le révèle la maladie."
    answer: "axiologiquement"
    alt: []
  - id: intro4-l4-p7
    sentence: "Canguilhem : « C'est la vie elle-même et non le jugement médical qui fait du normal biologique un concept de ___ et non un concept de réalité statistique. »"
    answer: "valeur"
    alt: []
  - id: intro4-l4-p8
    sentence: "Canguilhem : « La vie, pour le médecin, ce n'est pas un objet, c'est une activité ___ »."
    answer: "polarisée"
    alt: []
  - id: intro4-l4-p9
