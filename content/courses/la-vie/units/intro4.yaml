    sentence: "Aristote oppose les mouvements naturels aux mouvements contre nature, en grec *___ phusin*, qui sont violents ou contraints."
    answer: "para"
    alt: []
  - id: intro4-l4-p4
    sentence: "Pour Aristote, le ___, vivant qui ne réalise pas correctement les normes de son espèce, résulte d'une génération contre nature."
