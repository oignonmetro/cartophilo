- id: sep-mort4-l5
  title: "Thanatiser ses désirs : une stratégie qui se retourne"
  notes: |-
    **Peut-on rendre la mort moins nuisible ?** Si le préférentialisme est vrai, on pourrait cesser d'avoir des intérêts que la mort contrarie : {violet}thanatiser{/violet} ses désirs, c'est-à-dire **abandonner tous les désirs que la mort pourrait contrarier** : ceux qu'on ne peut satisfaire qu'en vivant encore quelques jours, ceux qu'une vie normale ne suffit pas à satisfaire, et le désir d'immortalité lui-même. Au lieu de désirer que mon projet réussisse, je désirerais : {yellow}si je vis encore, que mon projet réussisse{/yellow}. Thanatisés, nos désirs n'offriraient plus de prise à la mort.

    **La stratégie se retourne contre nous.** {red}__La mort contrarie nos désirs non seulement en rendant faux leurs objets, mais en nous empêchant d'avoir des désirs__{/red} (Luper 2013). Même limités à des désirs dont la mort ne peut rendre faux l'objet, nous restons exposés au tort qu'elle nous fait en nous empêchant d'avoir et de satisfaire des désirs. Thanatiser nous obligerait donc à **nous refuser tout désir dont la satisfaction nous aurait été bénéfique**, et {coral}se refuser ces désirs serait aussi mauvais que le tort qu'on cherche à éviter{/coral}.

    **Ce qu'il en reste : une prudence.** L'idée d'adapter ses désirs est utile si on ne la pousse pas à l'extrême : {green}il est prudent de ne pas se donner des buts impossibles à atteindre, et donc d'éviter les projets qu'aucune vie normale ne peut achever{/green}.
  points:
  - id: sep-mort4-l5-p1
    sentence: "___ ses désirs, c'est abandonner tous les désirs que la mort pourrait contrarier."
    answer: "thanatiser"
    alt: []
  - id: sep-mort4-l5-p2
    sentence: "Un désir thanatisé est ___ : au lieu de désirer que mon projet réussisse, je désire que, si je vis encore, mon projet réussisse."
    answer: "conditionnel"
    alt: []
  - id: sep-mort4-l5-p3
    sentence: "Thanatiser échoue, car la mort contrarie nos désirs non seulement en rendant faux leurs objets, mais en nous ___ d'avoir des désirs."
    answer: "empêchant"
    alt: []
  - id: sep-mort4-l5-p4
    sentence: "Thanatiser obligerait à se refuser tout désir dont la satisfaction aurait été bénéfique, ce qui serait aussi ___ que le tort qu'on cherche à éviter."
    answer: "mauvais"
    alt: []
