# l'anglais. « Thanatiser » rend le « thanatize » de Luper.

id: sep-mort4
title: "Après la mort, et sans la mort"
subtitle: "Le préjudice posthume, Nagel contre Williams sur l'immortalité, désirer à l'abri de la mort"
