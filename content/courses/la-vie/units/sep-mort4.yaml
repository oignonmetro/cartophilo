- id: sep-mort4-l4
  title: "Williams : l'ennui de l'immortalité"
  notes: |-
    **La thèse de Williams.** Dans « The Makropulos Case: Reflections on the Tedium of Immortality », Bernard **Williams** (suivi par Shelly Kagan) soutient que la mort de certains est un malheur pour eux, mais que {red}ne jamais mourir serait intolérable{/red}, même dans les meilleures conditions.

    **Désirs conditionnels et désirs catégoriques.** Une femme qui veut mourir peut vouloir, si elle doit vivre, être nourrie et vêtue : ces désirs sont {violet}conditionnels{/violet} à sa survie, et ne lui donnent pas de raison de vivre. Un père qui désire que sa fille aimée prenne un bon départ a un désir qui ne dépend pas de sa survie : il est {violet}catégorique{/violet}, et lui donne une raison de vivre, puisqu'il pourra y veiller s'il survit. Pour Williams, nos désirs catégoriques {coral}nous font vivre, donnent sens à notre vie, et forment notre caractère{/coral} ; c'est parce que nous garderons le même caractère que nous savons que nous serons la même personne.

    **Conséquences pour la mort.**
    - Nous avons raison de condamner une mort **prématurée**, qui contrarie nos désirs catégoriques.
    - Mais {green}__la mortalité est bonne__{/green} : à vivre assez longtemps, nous perdrions nos désirs catégoriques ; plus rien ne nous pousserait à vivre, et un **ennui** oppressant s'installerait. Vus d'aujourd'hui, ces vieillards ennuyés ne sont même pas clairement nous.

    **Ne pourrait-on varier ses désirs ?** Nagel, Glover, Fischer pensent que la vie des « super-vieillards » n'a pas à devenir terne. Williams tient qu'**on ne peut rendre la vie éternelle désirable**, car elle devrait remplir deux conditions : {teal}« ce doit être clairement moi qui vis à jamais »{/teal}, et l'état où je survis doit être {teal}« adéquatement relié […] aux buts que j'ai maintenant en voulant survivre »{/teal}. Remplacer mes désirs catégoriques viole l'une d'elles : la vie future se détache de mes désirs actuels, et un tout autre caractère rend douteux que ce soit moi. {teal}« Le degré d'identification nécessaire avec la vie ultérieure […] est absolument minimal. »{/teal}

    **Les doutes de Luper.** Williams ne dit pas que ce ne serait clairement pas la même personne (il défend ailleurs un critère de continuité corporelle). Et il semble raisonnable de juger bon, dès maintenant, de développer des désirs que je n'ai pas encore. {coral}Une transformation graduelle et continue de nos désirs ne met fin ni à notre vie ni à notre existence{/coral} : une vie sans fin aurait des étapes moins **connexes**, mais **continues**, ce qui compte dans la survie que nous prisons ; nous pourrions y introduire de nouveaux projets qui prolongent les anciens sans les remplacer.
  points:
  - id: sep-mort4-l4-p1
    sentence: "Dans « The Makropulos Case », Bernard ___ soutient que ne jamais mourir serait intolérable, même dans les meilleures conditions."
    answer: "Williams"
    alt: []
