- id: sep-mort4-l2
  title: "Le préjudice rétroactif : nuire au vivant par ce qui suivra"
  notes: |-
    **Les défenseurs du préjudice posthume nient qu'il suppose une causalité à rebours.** Comment alors ?

    **Par la valeur de la vie.** Dorothy **Grover** (1989) : des événements posthumes peuvent changer la « qualité » d'une vie, par exemple la valeur de ses accomplissements. David **Velleman** (1991) : des événements ultérieurs peuvent changer le **sens** d'événements antérieurs, qui compte dans la valeur d'une vie.

    **Par les désirs.** Pitcher, Feinberg, Luper, Scarre recourent au préférentialisme : ce qui arrive après notre mort peut décider si des désirs que nous avions de notre vivant sont satisfaits ou contrariés. Selon **Pitcher**, {green}__un événement posthume nous nuit en rendant vraies des choses qui contrarient nos désirs__{/green}. {yellow}Être calomnié après ma mort rend vrai que ma réputation sera ternie, et cela me nuit à tous les moments, et à eux seuls, où je désire que ma réputation reste intacte{/yellow} : c'est pendant que je vis que mon bien-être est abaissé. De même, si je désire que ma fille ait une enfance heureuse même sans moi, et qu'après ma mort elle tombe gravement malade, c'est **maintenant** que mon désir est contrarié. L'événement posthume ne me nuit qu'**indirectement**, par les vérités qu'il établit.

    **Les objections.**
    - Velleman : {teal}« nous pensons le bien-être actuel d'une personne comme un fait intrinsèque au présent, non comme une relation qu'elle entretient actuellement avec son avenir »{/teal}.
    - Partridge : pour nuire en contrariant un désir, l'événement doit survenir **pendant** qu'on a ce désir ; or la personne et son désir ont disparu. Pour d'autres, nous n'avons aucune raison de vouloir que nos désirs soient satisfaits quand nous ne les avons plus.
    - **Parfit** répond que certains désirs sont **conditionnels à leur propre persistance** (je les veux satisfaits seulement si je les ai encore), mais que d'autres ne le sont pas.
  points:
  - id: sep-mort4-l2-p1
    sentence: "Pour Dorothy Grover (1989), des événements posthumes peuvent changer la « ___ » d'une vie, par exemple la valeur de ses accomplissements."
    answer: "qualité"
    alt: []
