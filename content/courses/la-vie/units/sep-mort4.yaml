lessons:
- id: sep-mort4-l1
  title: "Peut-on nuire aux morts ?"
  notes: |-
    **Une croyance ancienne.** Selon Aristote, on croit communément qu'un mort peut connaître la bonne et la mauvaise fortune, {teal}« l'honneur et le déshonneur, la prospérité et sa perte chez ses enfants et ses descendants en général, exactement comme s'il était vivant mais ne s'apercevait pas de ce qui arrive »{/teal} (*Éthique à Nicomaque*, I, 10). **Nagel** l'admet : {teal}« la vie d'un homme comprend beaucoup de choses qui n'ont pas lieu à l'intérieur des limites de sa vie »{/teal}, et {teal}« il y a une explication simple de ce qui est mal dans le fait de rompre une promesse faite à un mourant. C'est un tort fait au mort. »{/teal} Ce serait un {violet}préjudice posthume{/violet} (l'expression trompe : ses défenseurs ne disent pas que la victime est plus mal lotie pendant qu'elle est morte).

    **Premier doute : la causalité à rebours.** Le préjudice posthume semble supposer qu'un effet précède sa cause. {teal}« Après la mort, aucun événement ne peut modifier un instant de la vie d'une personne »{/teal} (Ernest **Partridge**, 1981). Les morts peuvent subir un **tort** (« wronged »), pensait-il, mais non un **dommage** (« harmed »). (Les prioristes admettent les deux, d'autres, comme J.S. Taylor, aucun.)

    **Second doute : rien ne modifie plus les propriétés du mort.** Supposons l'hédonisme intrinsèque, le comparativisme et la thèse de la terminaison. Rien de ce qui arrive après qu'une personne est morte et a cessé d'exister ne change la quantité de plaisir ou de douleur de sa vie : {red}__aucun événement posthume ne peut donc lui être mauvais__{/red}, ni en soi, ni globalement. Ces hypothèses laissent pourtant possible le **préjudice de la mort** elle-même : la mort retranche des biens d'une vie, un événement posthume n'y change rien.

    ! Distinguer le tort du dommage permet de condamner la calomnie d'un mort sans prétendre qu'elle le rend plus malheureux.
  points:
