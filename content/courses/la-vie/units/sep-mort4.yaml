- id: sep-mort4-l3
  title: "Nagel : mourir est toujours un mal"
  notes: |-
    **Est-il toujours malheureux de mourir ? Ne jamais mourir serait-il un mal ?** Deux essais influents répondent oui, l'un à la première question (Thomas **Nagel**), l'autre à la seconde (Bernard **Williams**).

    **La thèse de Nagel.** Dans « Death » (et *Le Point de vue de nulle part*), Nagel soutient que, **quel que soit son moment**, mourir est mauvais pour qui meurt. Sa raison : {teal}« la vie vaut d'être vécue même quand les éléments mauvais de l'expérience sont nombreux, et les bons trop maigres pour les compenser à eux seuls. Le poids positif supplémentaire est fourni par l'expérience elle-même, plutôt que par ses contenus. »{/teal} Il est bon en soi de faire l'expérience des choses, et ce bien l'emporte sur tous les maux qui l'accompagnent : {coral}vivre plus longtemps est toujours bon, pourvu qu'on continue de faire des expériences{/coral}.

    **Sa réponse aux objections.** La normalité et l'inévitabilité de la mort {teal}« n'impliquent pas qu'il ne serait pas bon de vivre plus longtemps »{/teal}. Quand la mort vient, il aurait été bon de vivre davantage : {teal}« s'il n'y a pas de limite à la quantité de vie qu'il serait bon d'avoir, il se peut qu'une mauvaise fin nous attende tous. »{/teal}

    **L'objection de Luper.** Que la valeur de l'expérience l'emporte sur tous les maux est {red}peu plausible{/red} : quiconque préfère être **anesthésié** plutôt que de subir la souffrance d'une opération le sait. La sédation est alors globalement bonne, *parce qu'*elle nous empêche un temps de rien éprouver. {green}__Dans certaines circonstances, mourir serait donc globalement bon pour nous__{/green} : quand la vie qui resterait apporterait de grands maux, comme la souffrance, que nul bien ne compense.
  points:
  - id: sep-mort4-l3-p1
    sentence: "Dans « Death », ___ soutient que, quel que soit son moment, mourir est mauvais pour qui meurt."
    answer: "Nagel"
    alt: []
  - id: sep-mort4-l3-p2
    sentence: "Pour Nagel, la vie vaut d'être vécue même quand les maux l'emportent : « le poids positif supplémentaire est fourni par l'___ elle-même, plutôt que par ses contenus »."
    answer: "expérience"
    alt: []
  - id: sep-mort4-l3-p3
    sentence: "Pour Nagel, « le poids positif supplémentaire est fourni par l'expérience elle-même, plutôt que par ses ___ »."
    answer: "contenus"
    alt: []
  - id: sep-mort4-l3-p4
