- id: sens3-l2
  title: "La seconde limite de l'analogie de la cire"
  notes: |
    Seconde limite : l'impression du cachet est une **altération**, non une réalisation, le passage d'une puissance **première** à un acte. La cire prend la forme du cachet et **perd** la sienne, ou son caractère informe : sa détermination précédente est détruite. Or la sensibilité est une disposition, une puissance **seconde** : son passage à l'acte est une réalisation, car son essence est la sensation. Le sujet sentant ne perd pas ses propres prédicats au profit de ce qu'il sent.

    L'altération par le sensible existe pourtant : c'est la **destruction** de la sensibilité, par celle de ses organes, sous l'effet de qualités trop intenses. « À l'occasion, les perceptions sensibles à l'excès détruisent les organes sensoriels. En effet, chaque fois que le mouvement de l'organe sensoriel devient trop fort, sa raison (c'est-à-dire le sens), se dissipe » (*De l'âme*, II, 12). Regarder trop longtemps le soleil abîme l'œil. C'est aussi pourquoi les **plantes** sont altérées par le chaud et le froid, qualités tactiles, sans les « sentir » : une fleur peut geler sans jamais **expérimenter** le froid.

    |                               | Affecté par le froid               | Sent le froid |
    | La fleur qui gèle             | oui : ses constituants sont détruits | non         |
    | L'animal qui touche la glace  | non : ses fonctions restent intactes | oui         |

    Être sensible, ce n'est donc pas pouvoir être affecté par les qualités sensibles, mais pouvoir en faire l'expérience **sans** en être altéré. D'où l'insistance d'Aristote sur l'immatérialité : la sensibilité est une capacité d'« abstraction » (`aphairesis`) des formes sensibles hors de leur substrat matériel. Ce n'est pas le cachet qui impressionne la sensibilité, c'est elle qui **abstrait** du cachet sa forme.

    ! La cire est une puissance première qui s'altère ; la sensibilité, une puissance seconde qui se réalise.
