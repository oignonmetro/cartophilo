- id: sens3-l5
  title: "Sentir à distance"
  notes: |
    L'essentiel : la sensation suppose {green}l'**absence de contact** physique, une **mise à distance** des qualités sensibles{/green}. C'est l'une des grandes {amber}**originalités**{/amber} d'Aristote : {red}la plupart des théories antiques expliquent la sensation par un contact{/red} (de l'objet ou de ses émanations avec le sujet ou ses émanations), conception **doxique** qu'il récuse.

    {amber}Et le **toucher** et le **goût**, qui semblent exiger le contact ?{/amber} Aristote fait l'hypothèse que la **langue** et la **chair** {red}ne sont pas des organes sensibles{/red}, mais l'extrémité d'un corps servant d'intermédiaire avec {green}le véritable organe, le **cœur**{/green} : sa biologie est {violet}**cardiocentrique**{/violet}, le cœur et non le cerveau étant le siège de l'âme. Ce n'est pas la chair qui touche ni la langue qui goûte, mais le cœur, à travers elles, {yellow}comme l'œil voit à travers le transparent{/yellow} : {teal}« Il semble bien qu'il en aille de la chair et de la langue comme il en va de l'air ou de l'eau{/teal} en rapport avec la vue, l'ouïe et l'odorat […]. {teal}Quand{/teal}, d'ailleurs, l'organe sensoriel lui-même est touché, {teal}il ne peut y avoir sensation, ni là ni ici »{/teal} (*De l'âme*, II, 11).

    Aristote n'explicite pas la raison de son insistance ; {amber}trois éléments y président sans doute{/amber} :
    - que la sensation soit l'acte d'une qualité {amber}**sans la matière**{/amber}, non l'arrivée d'« effluves » ;
    - qu'elle soit toujours {amber}l'**examen** d'un objet par un sujet{/amber} : contre la bipartition du {sky}*Philèbe*{/sky} entre sens nobles « à distance » (vue, ouïe, odorat) et {pink}sens vils « par contact »{/pink} (goût, toucher), Aristote rend son éminence à toute la sensibilité ; {coral}toute sensation est **critique**{/coral}, non parce qu'elle juge, mais parce qu'elle *est* la distinction de différences sensibles ;
    - surtout, fournir un {amber}**unique modèle d'intelligibilité**{/amber} : les cinq sens ont une unité fonctionnelle par {violet}**analogie**{/violet} (`kath'analogian`).

    ! Même le toucher sent à distance : la chair n'est pas l'organe, mais l'intermédiaire.
