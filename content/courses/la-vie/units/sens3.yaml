- id: sens3-l4
  title: "L'intermédiaire"
  notes: |
    Toute sensation suppose un {violet}« **intermédiaire** »{/violet} (`metaxu`) entre l'objet sensible et la sensibilité. Sa nature varie selon les sens, que *De l'âme*, II, 7 à 11 examinent un à un :

    | Chapitre du *De l'âme* | Sens    |
    | II, 7                  | vue     |
    | II, 8                  | ouïe    |
    | II, 9                  | odorat  |
    | II, 10                 | goût    |
    | II, 11                 | toucher |

    Ces chapitres insistent systématiquement sur la {amber}**nécessité**{/amber} de l'intermédiaire, qui transmet l'activité du sensible aux sens ; chaque sens a le sien, capable de transporter l'activité de son sensible propre (la couleur pour la vue, le son pour l'ouïe). Pour la vue, c'est le {violet}« **diaphane** »{/violet} ou transparent (`diaphanès`) : {amber}non un corps, mais une propriété de certains corps{/amber} {yellow}(l'air, l'eau, le verre, la glace){/yellow}. {coral}L'activité du transparent est la **lumière**{/coral} (*De l'âme*, II, 7) : en acte, il transmet les couleurs jusqu'à l'œil. {teal}« {/teal}Il en est, du reste, un indice évident : {teal}si l'on vient, en effet, à placer l'objet coloré sur <l'organe de> la vue elle-même, il ne se verra pas{/teal}. Mais, en fait, {teal}la couleur imprime un mouvement au transparent{/teal}, l'air, par exemple : et c'est donc celui-ci qui, contigu à l'organe sensoriel, {teal}met ce dernier en mouvement. »{/teal}

    De même pour le son et l'odeur : c'est le milieu intermédiaire qui est ébranlé, et {teal}« {/teal}si l'on place, en revanche, l'objet du sonore ou l'objet odorant sur le sensoriel lui-même, {teal}on ne produira aucune sensation »{/teal}. {coral}L'intermédiaire est un **relais** de la sensation{/coral}.

    ! Le transparent n'est pas une chose, mais une propriété des corps comme l'air ou l'eau.
  points:
  - id: sens3-l4-p1
    sentence: "__Toute sensation suppose la présence d'un « intermédiaire »__, en grec ___, **entre l'objet sensible et la sensibilité**."
    answer: "metaxu"
