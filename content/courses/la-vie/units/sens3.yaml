- id: sens3-l5
  title: "Sentir à distance"
  notes: |
    L'essentiel : la sensation suppose l'**absence de contact** physique, une **mise à distance** des qualités sensibles. C'est l'une des grandes **originalités** d'Aristote : la plupart des théories antiques expliquent la sensation par un contact (de l'objet ou de ses émanations avec le sujet ou ses émanations), conception **doxique** qu'il récuse.

    Et le **toucher** et le **goût**, qui semblent exiger le contact ? Aristote fait l'hypothèse que la **langue** et la **chair** ne sont pas des organes sensibles, mais l'extrémité d'un corps servant d'intermédiaire avec le véritable organe, le **cœur** : sa biologie est **cardiocentrique**, le cœur et non le cerveau étant le siège de l'âme. Ce n'est pas la chair qui touche ni la langue qui goûte, mais le cœur, à travers elles, comme l'œil voit à travers le transparent : « Il semble bien qu'il en aille de la chair et de la langue comme il en va de l'air ou de l'eau en rapport avec la vue, l'ouïe et l'odorat […]. Quand, d'ailleurs, l'organe sensoriel lui-même est touché, il ne peut y avoir sensation, ni là ni ici » (*De l'âme*, II, 11).

    Aristote n'explicite pas la raison de son insistance ; trois éléments y président sans doute :
    - que la sensation soit l'acte d'une qualité **sans la matière**, non l'arrivée d'« effluves » ;
    - qu'elle soit toujours l'**examen** d'un objet par un sujet : contre la bipartition du *Philèbe* entre sens nobles « à distance » (vue, ouïe, odorat) et sens vils « par contact » (goût, toucher), Aristote rend son éminence à toute la sensibilité ; toute sensation est **critique**, non parce qu'elle juge, mais parce qu'elle *est* la distinction de différences sensibles ;
    - surtout, fournir un **unique modèle d'intelligibilité** : les cinq sens ont une unité fonctionnelle par **analogie** (`kath'analogian`).

    ! Même le toucher sent à distance : la chair n'est pas l'organe, mais l'intermédiaire.
