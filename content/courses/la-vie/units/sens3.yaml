lessons:
- id: sens3-l1
  title: "Les formes sensibles sans la matière"
  notes: |
    Si toute sensation identifie la sensibilité au sensible, {amber}faut-il y voir un transfert de matière ?{/amber} Beaucoup de prédécesseurs l'ont pensé : {red}l'âme serait composée des **éléments**{/red} (feu, air, eau, terre), afin d'{teal}« expliquer la sensation et la connaissance de chacune des réalités »{/teal} (*De l'âme*, I, 5). {red}Ils font de l'âme un corps{/red} pour qu'elle se rende semblable à ce qu'elle connaît : {teal}« {/teal}en posant que {teal}la connaissance du semblable s'opère par le semblable{/teal}, c'est comme si l'on posait {teal}une équation entre l'âme et les choses »{/teal}.

    Aristote récuse qu'on fasse de l'âme un corps ; surtout, cette thèse rend mal compte de la sensation, car {coral}le transfert qu'elle opère est **immatériel**{/coral}. {teal}« {/teal}On doit concevoir l'idée que {teal}le sens constitue ce qui est propre à recevoir les formes sensibles sans la matière »{/teal} (*De l'âme*, II, 12, début). Et d'illustrer : {teal}« Ainsi la cire reçoit la marque de la bague sans le fer et l'or{/teal} ; elle prend la marque d'or ou celle de bronze, {teal}mais pas en tant qu'or ou bronze. »{/teal} Le cachet transmet non sa matière, mais {green}sa seule **forme**{/green}, ses contours. {yellow}Quand je sens l'encens qui brûle{/yellow}, je perçois la qualité sensible, non l'encens et sa combustion : l'odeur sans sa matière.

    Première limite de l'analogie : la sensibilité est sensible non à l'objet, mais à certaines de ses qualités ; non à la {violet}**substance**{/violet}, mais à certains de ses {violet}**accidents**{/violet}. L'odorat sent l'odeur de l'encens, non l'encens ; {yellow}la vue, les couleurs de Socrate, non Socrate{/yellow}. {coral}Nul besoin, donc, d'un contact matériel entre la sensibilité et l'objet{/coral}.

    ! Sentir n'est pas recevoir la chose, fût-ce en petit : c'est recevoir sa forme sensible.
