lessons:
- id: sens3-l1
  title: "Les formes sensibles sans la matière"
  notes: |
    Si toute sensation identifie la sensibilité au sensible, faut-il y voir un transfert de matière ? Beaucoup de prédécesseurs l'ont pensé : l'âme serait composée des **éléments** (feu, air, eau, terre), afin d'« expliquer la sensation et la connaissance de chacune des réalités » (*De l'âme*, I, 5). Ils font de l'âme un corps pour qu'elle se rende semblable à ce qu'elle connaît : « en posant que la connaissance du semblable s'opère par le semblable, c'est comme si l'on posait une équation entre l'âme et les choses ».

    Aristote récuse qu'on fasse de l'âme un corps ; surtout, cette thèse rend mal compte de la sensation, car le transfert qu'elle opère est **immatériel**. « On doit concevoir l'idée que le sens constitue ce qui est propre à recevoir les formes sensibles sans la matière » (*De l'âme*, II, 12, début). Et d'illustrer : « Ainsi la cire reçoit la marque de la bague sans le fer et l'or ; elle prend la marque d'or ou celle de bronze, mais pas en tant qu'or ou bronze. » Le cachet transmet non sa matière, mais sa seule **forme**, ses contours. Quand je sens l'encens qui brûle, je perçois la qualité sensible, non l'encens et sa combustion : l'odeur sans sa matière.

    Première limite de l'analogie : la sensibilité est sensible non à l'objet, mais à certaines de ses qualités ; non à la **substance**, mais à certains de ses **accidents**. L'odorat sent l'odeur de l'encens, non l'encens ; la vue, les couleurs de Socrate, non Socrate. Nul besoin, donc, d'un contact matériel entre la sensibilité et l'objet.

    ! Sentir n'est pas recevoir la chose, fût-ce en petit : c'est recevoir sa forme sensible.
