- id: sens3-l3
  title: "L'âme sent, par le corps"
  notes: |
    {amber}L'immatérialité du **contenu** de la sensation{/amber} ne signifie pas que tout le processus soit indépendant de la matière. Le point a fait débat chez les spécialistes à la fin du XXᵉ siècle : {sky}Myles **Burnyeat**{/sky} (« Aristote voit du rouge et entend un "do" : combien se passe-t-il de choses ? ») soutient que {red}la transmission de la forme sensible n'implique **aucune** opération matérielle{/red}, et que la théorie aristotélicienne relève non de processus physiologiques, mais uniquement d'états psychologiques ; le rôle de l'intermédiaire semble aller dans ce sens.

    {green}Il n'est pourtant pas besoin que tout le processus soit immatériel pour que son contenu le soit{/green}. Le *De la sensation et des sensibles* développe les {violet}**conditions corporelles**{/violet} de chaque type de sensation : la sensibilité s'exerce sur fond de processus physiologiques, dans des organes aux propriétés matérielles déterminées. Mais {coral}**ce n'est pas le corps qui sent, c'est l'âme**{/coral}, {amber}même si elle sent nécessairement par l'intermédiaire du corps{/amber}.

    Exemple : pour {sky}**Démocrite**{/sky} (*De la sensation et des sensibles*, 2), {red}l'œil voit parce qu'il est fait d'eau{/red}, la vision étant un certain reflet. Aristote refuse : la vision n'est pas une propriété matérielle comme la réflexion, puisque {yellow}d'autres choses reflètent sans être sensibles{/yellow}. {amber}Mais Démocrite a raison sur un point{/amber} : l'eau de l'œil, **transparente**, peut servir d'intermédiaire en « transportant » l'activité commune du sensible et de la sensibilité. {coral}Les propriétés de l'œil sont nécessaires à la vision, sans que la sensibilité s'y réduise{/coral}.

    ! Aristote n'est ni matérialiste (le corps ne sent pas) ni partisan d'une âme qui sentirait sans organes.
  points:
  - id: sens3-l3-p1
    sentence: "__L'immatérialité du__ ___ de la sensation **ne signifie pas que l'ensemble du processus de sensation se fasse indépendamment de tout processus matériel**."
    answer: "contenu"
    alt: []
  - id: sens3-l3-p2
