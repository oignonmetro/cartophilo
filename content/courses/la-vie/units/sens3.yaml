- id: sens3-l4
  title: "L'intermédiaire"
  notes: |
    Toute sensation suppose un « **intermédiaire** » (`metaxu`) entre l'objet sensible et la sensibilité. Sa nature varie selon les sens, que *De l'âme*, II, 7 à 11 examinent un à un :

    | Chapitre du *De l'âme* | Sens    |
    | II, 7                  | vue     |
    | II, 8                  | ouïe    |
    | II, 9                  | odorat  |
    | II, 10                 | goût    |
    | II, 11                 | toucher |

    Ces chapitres insistent systématiquement sur la **nécessité** de l'intermédiaire, qui transmet l'activité du sensible aux sens ; chaque sens a le sien, capable de transporter l'activité de son sensible propre (la couleur pour la vue, le son pour l'ouïe). Pour la vue, c'est le « **diaphane** » ou transparent (`diaphanès`) : non un corps, mais une propriété de certains corps (l'air, l'eau, le verre, la glace). L'activité du transparent est la **lumière** (*De l'âme*, II, 7) : en acte, il transmet les couleurs jusqu'à l'œil. « Il en est, du reste, un indice évident : si l'on vient, en effet, à placer l'objet coloré sur <l'organe de> la vue elle-même, il ne se verra pas. Mais, en fait, la couleur imprime un mouvement au transparent, l'air, par exemple : et c'est donc celui-ci qui, contigu à l'organe sensoriel, met ce dernier en mouvement. »

    De même pour le son et l'odeur : c'est le milieu intermédiaire qui est ébranlé, et « si l'on place, en revanche, l'objet du sonore ou l'objet odorant sur le sensoriel lui-même, on ne produira aucune sensation ». L'intermédiaire est un **relais** de la sensation.

    ! Le transparent n'est pas une chose, mais une propriété des corps comme l'air ou l'eau.
