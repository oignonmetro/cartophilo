- id: sens3-l3
  title: "L'âme sent, par le corps"
  notes: |
    L'immatérialité du **contenu** de la sensation ne signifie pas que tout le processus soit indépendant de la matière. Le point a fait débat chez les spécialistes à la fin du XXᵉ siècle : Myles **Burnyeat** (« Aristote voit du rouge et entend un "do" : combien se passe-t-il de choses ? ») soutient que la transmission de la forme sensible n'implique **aucune** opération matérielle, et que la théorie aristotélicienne relève non de processus physiologiques, mais uniquement d'états psychologiques ; le rôle de l'intermédiaire semble aller dans ce sens.

    Il n'est pourtant pas besoin que tout le processus soit immatériel pour que son contenu le soit. Le *De la sensation et des sensibles* développe les **conditions corporelles** de chaque type de sensation : la sensibilité s'exerce sur fond de processus physiologiques, dans des organes aux propriétés matérielles déterminées. Mais **ce n'est pas le corps qui sent, c'est l'âme**, même si elle sent nécessairement par l'intermédiaire du corps.

    Exemple : pour **Démocrite** (*De la sensation et des sensibles*, 2), l'œil voit parce qu'il est fait d'eau, la vision étant un certain reflet. Aristote refuse : la vision n'est pas une propriété matérielle comme la réflexion, puisque d'autres choses reflètent sans être sensibles. Mais Démocrite a raison sur un point : l'eau de l'œil, **transparente**, peut servir d'intermédiaire en « transportant » l'activité commune du sensible et de la sensibilité. Les propriétés de l'œil sont nécessaires à la vision, sans que la sensibilité s'y réduise.

    ! Aristote n'est ni matérialiste (le corps ne sent pas) ni partisan d'une âme qui sentirait sans organes.
