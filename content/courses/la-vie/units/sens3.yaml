- id: sens3-l2
  title: "La seconde limite de l'analogie de la cire"
  notes: |
    Seconde limite : l'impression du cachet est une {red}**altération**{/red}, non une réalisation, le passage d'une puissance {amber}**première**{/amber} à un acte. {yellow}La cire prend la forme du cachet{/yellow} et **perd** la sienne, ou son caractère informe : sa détermination précédente est détruite. Or la sensibilité est une disposition, {amber}une puissance **seconde**{/amber} : {green}son passage à l'acte est une réalisation{/green}, car son essence est la sensation. {coral}Le sujet sentant ne perd pas ses propres prédicats au profit de ce qu'il sent{/coral}.

    L'altération par le sensible existe pourtant : c'est la {violet}**destruction**{/violet} de la sensibilité, par celle de ses organes, sous l'effet de qualités trop intenses. {teal}« À l'occasion, les perceptions sensibles à l'excès détruisent les organes sensoriels{/teal}. En effet, chaque fois que le mouvement de l'organe sensoriel devient trop fort, {teal}sa raison (c'est-à-dire le sens), se dissipe »{/teal} (*De l'âme*, II, 12). {yellow}Regarder trop longtemps le soleil abîme l'œil{/yellow}. C'est aussi pourquoi les **plantes** sont altérées par le chaud et le froid, qualités tactiles, sans les « sentir » : {yellow}une fleur peut geler sans jamais **expérimenter** le froid{/yellow}.

    |                               | Affecté par le froid               | Sent le froid |
    | La fleur qui gèle             | oui : ses constituants sont détruits | non         |
    | L'animal qui touche la glace  | non : ses fonctions restent intactes | oui         |

    Être sensible, ce n'est donc pas pouvoir être affecté par les qualités sensibles, mais {green}pouvoir en faire l'expérience **sans** en être altéré{/green}. D'où l'insistance d'Aristote sur l'immatérialité : la sensibilité est une capacité d'{violet}« abstraction »{/violet} (`aphairesis`) des formes sensibles hors de leur substrat matériel. Ce n'est pas le cachet qui impressionne la sensibilité, {coral}c'est elle qui **abstrait** du cachet sa forme{/coral}.

    ! La cire est une puissance première qui s'altère ; la sensibilité, une puissance seconde qui se réalise.
  points:
