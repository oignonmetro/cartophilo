- id: platon-phedon-arguments-l9
  title: "Le sort des âmes : l'âme pure et l'âme alourdie (80c-82c)"
  notes: |-
    De l'affinité, Socrate tire une conséquence éthique : ce que devient l'âme après la mort dépend de ce qu'elle a fait de sa vie. {green}__L'âme qui s'est exercée à être morte rejoint ce qui lui ressemble__{/green} ; celle qui s'est attachée au corps en reste lourde.

    **Le cadavre dure, l'âme se disperserait ?** Même le corps, fait pour se dissoudre, résiste longtemps après la mort ; un corps desséché comme les {yellow}momies d'Égypte{/yellow} se conserve presque entier, et certaines parties, {yellow}os et tendons{/yellow}, sont {teal}« pour ainsi dire immortelles »{/teal}. Il serait absurde que l'âme, l'invisible, qui s'en va vers l'{violet}Invisible véritable, Hadès{/violet} (Platon joue sur *aidês*, l'invisible, et Hadès), se disperse et périsse dès qu'elle quitte le corps.

    **L'âme pure.** Si l'âme se sépare pure, sans rien entraîner du corps, parce qu'elle a passé sa vie à le fuir et à se concentrer en elle-même, c'est qu'elle a pratiqué {teal}« droitement la philosophie »{/teal} et s'est exercée à être morte. Elle s'en va vers ce qui lui ressemble, {coral}le divin, l'immortel, le sensé{/coral}, débarrassée de l'errance, de la déraison, des terreurs et des désirs sauvages, et passe, selon la formule des initiés, {teal}« dans la compagnie des dieux »{/teal} tout le temps à venir.

    **L'âme alourdie.** Si au contraire l'âme a été {red}ensorcelée par le corps{/red}, au point de ne tenir pour vrai que ce qu'on peut toucher, voir, boire, manger, et de détester ce qui est invisible et saisissable par la philosophie, elle sort du corps {red}« complètement pénétrée »{/red} de corporel. {yellow}« cela pèse, ami, [...] c'est lourd, terreux »{/yellow} : elle est tirée vers le visible, erre autour des tombeaux, où l'on voit des apparitions, ombres d'âmes qui ne sont pas parties pures.

    **Chacune devient ce qu'elle était déjà.** Ces âmes errent jusqu'à ce que leur appétit du corporel les fasse s'enchaîner de nouveau à un corps semblable à leurs occupations :
    - les gloutons, ivrognes et débauchés, dans des {yellow}ânes{/yellow} et des bêtes de ce genre
    - ceux qui ont préféré l'injustice, la tyrannie, le rapt, dans des {yellow}loups, des faucons, des milans{/yellow}
    - ceux qui ont pratiqué la {pink}« vertu publique et sociale »{/pink}, née de l'habitude sans philosophie ni intelligence, dans des espèces sociables, {yellow}abeilles, guêpes ou fourmis{/yellow}, ou de nouveau dans des hommes {teal}« bien comme il faut »{/teal}

    Ces réincarnations sont moins une zoologie qu'une **classification des âmes** : celui qui vit pour bâfrer est déjà un âne, celui qui ravit est déjà un loup. Et seul celui qui aime apprendre, parfaitement pur, peut rejoindre {green}« l'espèce des dieux »{/green}. Voilà pourquoi les vrais philosophes se tiennent à l'écart des appétits du corps, ne craignent ni la pauvreté ni l'obscurité.

    ! Les réincarnations animales disent ce qu'une âme est devenue par sa manière de vivre ; il ne faut pas les lire comme une doctrine zoologique.
    ! La vertu sociale, née de l'habitude, vaut mieux que le vice, mais ne suffit pas : sans philosophie, elle ne mène pas jusqu'aux dieux.
  points:
  - id: platon-phedon-arguments-l9-q1
    sentence: "Après la mort, certaines parties du corps, os et tendons, sont, même quand le corps se putréfie, « pour ainsi dire ___ »."
    answer: "immortelles"
