- id: platon-phedon-arguments-l2
  title: "La demande de Cébès et la loi des contraires (69e-71b)"
  notes: |-
    Le premier argument ouvre la partie démonstrative du dialogue. Il répond à une crainte précise, celle d'une âme qui se dissiperait à la mort, et s'appuie sur une loi très générale : {green}__tout ce qui a un contraire naît de son contraire__{/green}.

    **La demande de Cébès.** Cébès trouve excellent ce qu'a dit Socrate, mais les hommes ont du mal à croire qu'une fois séparée du corps l'âme existe encore ; ils craignent qu'elle ne s'en aille {yellow}« comme un souffle ou une fumée »{/yellow} et ne soit plus rien. Il faudrait donc une parole qui rassure et qui convainque {amber}« que l'âme existe après que l'homme est mort, qu'elle conserve aussi une certaine force et de la pensée »{/amber}. Deux choses sont demandées : que l'âme **existe** encore, et qu'elle **pense** encore. Le premier argument ne répondra qu'à la première.

    **Le point de départ : une antique tradition.** Socrate pose la question en termes d'Hadès : les âmes des morts y existent-elles ? Une {sky}« antique tradition »{/sky}, celle de la palingénésie (orphique ou pythagoricienne), dit que les âmes vont là-bas, puis reviennent ici et {teal}« naissent à partir des morts »{/teal}. Si c'est vrai, nos âmes doivent exister là-bas, car {coral}« elles ne pourraient en aucune façon naître à nouveau si elles n'avaient pas d'être »{/coral}. Il suffit donc de montrer {teal}« que les vivants ne proviennent d'absolument rien d'autre que des morts »{/teal}. La tradition ne sert pas d'autorité : elle fournit l'hypothèse que le raisonnement va mettre à l'épreuve.

    **La loi : tout contraire naît de son contraire.** Pour le comprendre facilement, il faut l'examiner non seulement chez les hommes, mais chez tous les animaux, toutes les plantes, toutes les choses qui ont un devenir. Quand une chose devient {yellow}plus grande{/yellow}, c'est nécessairement après avoir été plus petite ; le plus faible vient du plus fort, le plus rapide du plus lent, le pire du meilleur. La loi n'est pas une observation de physicien : elle découle de ce que veut dire **devenir**. Devenir, c'est passer d'un état à un autre ; si l'état d'arrivée a un contraire, l'état de départ ne peut être que ce contraire. On ne devient pas grand en partant de rien, mais en partant du petit.

    **Entre deux contraires, deux devenirs.** Puisqu'il y a deux termes, il y a aussi {teal}« un double devenir »{/teal}, de l'un vers l'autre et de l'autre vers l'un : {yellow}s'accroître et diminuer, se diviser et se rassembler, se refroidir et se réchauffer{/yellow}. Même quand nous n'avons pas de mot pour l'un des deux devenirs, il faut qu'il existe, car le parcours d'un pôle à l'autre est réversible. C'est cette seconde loi qui fera tout le poids de l'argument.

    ! La loi porte sur les choses qui deviennent et sur des contraires relatifs (plus grand, plus petit), non sur les Formes : le grand en soi ne devient jamais petit (102d-103c).
    ! Le premier argument répond à la crainte de la dispersion, non à la question de la pensée : il dira que l'âme existe, non qu'elle pense.
