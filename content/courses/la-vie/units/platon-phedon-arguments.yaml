- id: platon-phedon-arguments-l3
  title: "Vivre et être mort : pourquoi la nature ne peut pas boiter (71b-72e)"
  notes: |-
    Socrate applique les deux lois au couple qui l'intéresse, et montre par l'absurde que le devenir doit être **circulaire** : {green}__si les vivants meurent, il faut que des morts reviennent à la vie__{/green}, sans quoi tout finirait mort.

    **Dormir et veiller, vivre et être mort.** Socrate prend d'abord un couple familier : {yellow}dormir et être éveillé{/yellow}. De dormir vient être éveillé, et d'être éveillé, dormir ; les deux devenirs sont s'endormir et s'éveiller. Le choix n'est pas innocent : Sommeil et Mort sont frères chez Homère et Hésiode. Cébès applique ensuite le schéma : être mort est le contraire de vivre ; du vivant vient le mort, et du mort, il faut l'accorder, le vivant. Conclusion : {coral}« Elles existent donc bien, [...] nos âmes à nous, dans l'Hadès »{/coral}.

    **La nature ne doit pas boiter.** Des deux devenirs, l'un est évident : mourir. Faut-il le laisser sans contrepartie ? {red}« En ce cas la nature sera boiteuse »{/red}. Il faut donc le compenser par le devenir inverse, le {violet}« revivre »{/violet} (*anabiôskesthai*), qui va des morts aux vivants. Le mot ne désigne pas une seconde vie qui s'ajouterait à la première, mais le passage de l'état de mort à l'état de vie.

    **La preuve par l'absurde : un devenir en ligne droite.** Supposons que le devenir aille {red}« en ligne droite »{/red}, d'un terme à son opposé, {teal}« sans jamais faire retour vers le premier terme ni décrire le tournant »{/teal} (image de la course au stade, où l'on tourne autour de la borne pour revenir). Alors toutes choses finiraient par avoir le même aspect et cesseraient de devenir :
    - si l'on s'endormait sans jamais se réveiller, l'aventure d'{yellow}Endymion{/yellow}, endormi pour toujours, ne serait qu'une plaisanterie, puisque tout dormirait comme lui
    - si tout se rassemblait sans jamais se diviser, la formule d'{sky}Anaxagore{/sky}, {teal}« Ensemble sont toutes choses »{/teal}, serait vite accomplie
    - de même, si tout ce qui vit mourait et que rien ne revînt à la vie, {red}« n'est-ce pas une nécessité absolue qu'à la fin tout soit mort, et rien ne vive ? »{/red}

    La prémisse implicite qui rend l'argument contraignant est que **la vie ne peut pas s'épuiser** : il y a toujours des vivants. Or, si les vivants venaient d'autres vivants et mouraient sans retour, mourir voudrait dire retourner au néant, et rien n'empêcherait que tout soit à la fin {teal}« englouti dans la mort »{/teal}. Puisque ce n'est pas le cas, le revivre existe, et les âmes des morts existent quelque part.

    **Ce que l'argument établit, et ce qu'il n'établit pas.** Socrate conclut que le revivre existe, que les vivants viennent des morts, que les âmes des morts existent, {teal}« et même que du meilleur est réservé aux âmes bonnes, et du pire aux mauvaises »{/teal}. Cette dernière phrase ne découle pas du raisonnement : elle reprend la tradition (celle que cite le *Ménon*) et l'espoir de l'apologie. L'argument montre qu'**une âme subsiste** et parcourt le cycle des naissances ; il ne montre ni qu'elle pense, ni qu'elle reste la même âme, ni qu'elle ne finira pas par s'épuiser au fil des cycles (ce sera l'objection de Cébès, 86e-88b).

    ! « Revivre » ne veut pas dire vivre une seconde fois la même vie : c'est passer de l'état de mort à l'état de vie.
    ! L'argument prouve la subsistance d'un principe qui parcourt le cycle, non l'immortalité d'une âme qui pense.
