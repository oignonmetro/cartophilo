- id: platon-phedon-arguments-l4
  title: "La réminiscence : percevoir une chose, en concevoir une autre (72e-74a)"
  notes: |-
    Cébès relance le dialogue : si **apprendre, c'est se ressouvenir**, notre âme existait avant d'entrer dans un corps. L'argument de la réminiscence va le montrer, et donner du même coup ce qui manquait au premier : {green}__une âme qui pense__{/green}.

    **La preuve rappelée par Cébès.** Selon une formule que Socrate a coutume de répéter, {teal}« l'acquisition d'un savoir se trouve n'être rien d'autre qu'une réminiscence »{/teal} : il faut donc que nous ayons appris auparavant ce dont nous nous souvenons, ce qui serait impossible si l'âme n'existait pas avant d'entrer {teal}« dans cette forme humaine »{/teal}. La preuve, dit Cébès, est que les hommes bien interrogés {teal}« d'eux-mêmes, ils disent tout ce qui est comme c'est »{/teal}, surtout devant des {yellow}figures géométriques{/yellow} : c'est l'expérience du {sky}*Ménon*{/sky}, où un esclave retrouve seul une vérité de géométrie. Simmias ne s'en souvient pas bien : Socrate reprend autrement, en partant non des figures, mais d'**une sensation quelconque**.

    **Ce qu'est se ressouvenir.** Deux conditions. D'abord, pour se ressouvenir d'une chose, il faut l'avoir sue auparavant. Ensuite, il y a réminiscence quand, percevant une chose par un sens, {amber}« non seulement on perçoit cette chose, mais on conçoit en plus une autre chose »{/amber}, qui relève d'un autre savoir. Le passage se fait de ce qu'on perçoit à ce qu'on ne perçoit pas.

    **Les exemples : la lyre, le portrait.** Les amants, à la vue d'une {yellow}lyre{/yellow} ou d'un manteau de celui qu'ils aiment, pensent aussitôt au garçon à qui la lyre appartient : c'est une réminiscence. Voir Simmias fait souvent penser à Cébès ; voir le dessin d'un cheval peut faire penser à un homme. On se ressouvient donc à partir du **dissemblable** (la lyre fait penser à l'aimé) comme du **semblable** (le {yellow}portrait de Simmias{/yellow} fait penser à Simmias lui-même).

    **Le semblable oblige à juger de ce qui manque.** Mais quand on se ressouvient à partir d'une chose semblable, on est forcé de {coral}juger de ce qui manque à l'image pour ressembler à son modèle{/coral}. Juger qu'un portrait est imparfait, c'est le mesurer à l'original, qu'il faut donc déjà connaître. Encore faut-il désirer l'original : pour celui qui n'aime pas, une lyre n'est qu'une lyre ; c'est l'amant qui sent ce qui manque au portrait. La réminiscence suppose ainsi un regard d'amoureux, ou de philosophe.

    ! La réminiscence ne part pas seulement des figures géométriques, comme dans le *Ménon* : dans le *Phédon*, n'importe quelle sensation peut en être l'occasion.
    ! Se ressouvenir n'est pas recevoir une information du dehors : c'est concevoir, à l'occasion d'une perception, ce qu'on savait déjà.
