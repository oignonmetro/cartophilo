- id: platon-phedon-arguments-l1
  title: "Repérage : les trois premiers arguments (69e-84b)"
  notes: |-
    L'apologie a laissé Cébès sur sa faim : elle supposait que l'âme subsiste après la mort, sans le prouver. Socrate avance alors **trois arguments**, qui répondent chacun à une part de la crainte : {coral}l'âme existe après la mort{/coral} (les contraires), {coral}elle existait avant la naissance et pensait{/coral} (la réminiscence), {coral}elle est d'une nature qui ne se disperse pas{/coral} (l'affinité). Chacun établit quelque chose, aucun n'établit tout : c'est ce que les objections révéleront.

    | Moment | Lieu | Ce qui s'y joue |
    | la demande de Cébès | 69e-70b | l'âme ne se dissipe-t-elle pas comme un souffle ? il faut prouver qu'elle existe et pense après la mort |
    | le devenir entre contraires | 70c-72e | tout contraire naît de son contraire : les vivants naissent des morts, sinon tout finirait mort |
    | la réminiscence | 72e-77a | juger les choses égales déficientes suppose de connaître l'égal en soi avant la naissance |
    | intermède | 77a-78b | les deux arguments réunis ; l'enfant qui a peur réclame une incantation |
    | l'affinité | 78b-80c | l'âme ressemble à l'invisible, toujours même que soi : elle est indissoluble, ou presque |
    | le sort des âmes | 80c-84b | l'âme pure va vers l'invisible ; l'âme alourdie par le corps lui reste enchaînée |
