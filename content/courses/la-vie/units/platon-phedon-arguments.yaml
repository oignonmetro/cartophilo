- id: platon-phedon-arguments-l5
  title: "L'égal en soi : pourquoi il faut l'avoir connu avant de percevoir (74a-75c)"
  notes: |-
    Le cœur de l'argument est un exemple choisi avec soin : **l'égal**. Socrate montre que {green}__nous ne pouvons pas tirer des choses égales la connaissance de l'égal lui-même__{/green}, puisque c'est elle qui nous permet de les juger déficientes.

    **L'égal lui-même.** Il existe de l'égal : non l'égalité d'{yellow}un bout de bois et d'un bout de bois, d'un caillou et d'un caillou{/yellow}, mais quelque chose de différent, {teal}« l'égal lui-même »{/teal}. Simmias l'accorde avec force : c'est {teal}« incroyablement quelque chose »{/teal}, et nous savons ce qu'il est.

    **Il n'est pas les choses égales.** D'où vient ce savoir ? Des bouts de bois égaux ? Mais ils apparaissent {red}« égaux à un moment, mais non à un autre »{/red}, tout en restant les mêmes (égaux selon qu'on les mesure, qu'on les regarde de près ou de loin, ou qu'on les compare à autre chose). Au contraire, l'égal en soi ne nous est jamais apparu inégal. Ce qui peut paraître inégal ne peut pas être ce qui ne le paraît jamais : {coral}les choses égales et l'égal en soi ne sont pas la même chose{/coral}.

    **Et pourtant on le conçoit à partir d'elles.** C'est bien à l'occasion de ces choses égales que nous avons conçu l'égal. Peu importe qu'elles lui ressemblent ou non : dès que voir une chose fait concevoir une autre, il y a réminiscence.

    **La déficience : ce que les choses égales « aspirent » à être.** Les bouts de bois égaux ne paraissent pas égaux comme l'égal lui-même : il leur manque quelque chose, {teal}« et pas qu'un peu »{/teal}. Quand on juge ainsi que ce qu'on voit {amber}« souhaite » être semblable à une autre réalité, mais « reste en défaut »{/amber}, il faut avoir connu auparavant cette réalité. Le raisonnement repose sur une prémisse que l'empiriste ne peut pas refuser : **on ne peut mesurer un écart qu'à une règle qu'on possède déjà**. Celui qui dirait que nous formons l'idée d'égalité parfaite en idéalisant des choses à peu près égales suppose ce qu'il veut expliquer : pour dire « à peu près égal », il faut déjà savoir ce qu'est l'égal.

    **Donc avant toute perception, donc avant la naissance.** Or c'est seulement par les sens que nous pouvons remarquer que toutes les égalités sensibles aspirent à l'égal en soi sans l'atteindre. Il faut donc avoir possédé le savoir de l'égal {teal}« avant d'avoir commencé à voir, à entendre, à user de nos autres sens »{/teal}. Mais nous voyons et entendons dès la naissance : ce savoir, nous l'avons donc acquis {green}avant de naître{/green}.

    ! La sensation n'est plus ici un simple obstacle, comme dans l'apologie : elle est l'occasion nécessaire du ressouvenir, à condition d'y lire un manque.
    ! L'égal en soi n'est pas tiré des choses égales par abstraction : il est la règle qui permet de les juger égales et déficientes.
