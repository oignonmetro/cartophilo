- id: platon-phedon-arguments-l6
  title: "Avant la naissance : rendre raison et l'égale nécessité (75c-77a)"
  notes: |-
    Socrate étend l'argument à toutes les réalités en soi, tranche un dilemme et conclut par une proposition remarquable : {green}__l'existence de notre âme avant la naissance est aussi nécessaire que celle des réalités en soi__{/green}.

    **L'extension à tout ce qui est « ce que c'est ».** Le raisonnement ne vaut pas plus pour l'égal que pour {teal}« le beau en soi, le bon en soi, ou le juste, ou le pieux »{/teal}, bref pour {amber}« tout ce à quoi nous imprimons la marque "ce que c'est" »{/amber} quand nous interrogeons et répondons. C'est la question du dialecticien, « qu'est-ce que ? », qui désigne ces réalités.

    **Le dilemme : savoir dès la naissance, ou se ressouvenir.** Deux possibilités : {pink}ou bien nous naissons avec ces savoirs et les gardons toute notre vie{/pink}, {green}ou bien nous les avons perdus en naissant et nous les reprenons ensuite{/green}, et c'est ce qu'on appelle apprendre. Car savoir, c'est garder ce qu'on a acquis ; l'oubli est {teal}« la perte d'un savoir »{/teal}. Apprendre serait alors {teal}« reprendre possession d'une science qui nous est propre »{/teal}.

    **Le critère qui tranche : rendre raison.** Simmias ne sait pas choisir. Socrate lui propose un choix plus facile : celui qui sait peut-il {violet}rendre raison{/violet} de ce qu'il sait ? Oui, nécessairement. Or tout le monde peut-il rendre raison du beau, du bien ? Simmias craint qu'il n'y ait plus personne, demain à cette heure, pour le faire. Tous ne savent donc pas ; c'est qu'ils **se ressouviennent** de ce qu'ils ont su. La première branche tombe, la seconde reste.

    **L'objection de la naissance.** Simmias tente une issue : nous recevrions ces savoirs au moment même de naître. Mais nous venons d'accorder qu'à la naissance nous ne les avons pas : il faudrait donc les perdre {red}au moment même où nous les acquérons{/red}, ce qui est absurde. Simmias s'incline : il a {teal}« perdu une bonne occasion de [s]e taire »{/teal}. Nos âmes existaient donc {coral}« avant même d'être entrées dans une forme d'homme »{/coral}, séparées des corps et **douées de pensée** : voilà ce qui manquait au premier argument.

    **L'égale nécessité.** S'il existe {teal}« un beau, un bien, et tout ce qui comporte ce même mode d'existence »{/teal}, et si nous rapportons à lui les données sensibles, alors notre âme existe avant notre naissance ; sinon, tout le raisonnement est vain. {amber}« Il y a égale nécessité d'existence et pour ces réalités et pour nos âmes avant notre naissance »{/amber}. Pour Simmias, rien n'est plus évident que l'être du beau et du bien : la démonstration lui suffit. L'« avant » n'est d'ailleurs pas seulement chronologique : il dit aussi que l'âme pensante a part au mode d'être des réalités qu'elle pense.

    ! Rendre raison n'est pas argumenter ou démontrer : c'est pouvoir dire ce qu'est la chose, ce que fait le dialecticien.
    ! La réminiscence n'est pas le souvenir des Formes comme d'images innées : c'est la reprise d'un savoir que l'âme ne reçoit pas du dehors.
