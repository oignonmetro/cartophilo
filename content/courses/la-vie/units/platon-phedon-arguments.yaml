- id: platon-phedon-arguments-l7
  title: "Une démonstration faite à moitié ? L'enfant qui a peur (77a-78b)"
  notes: |-
    Simmias et Cébès jugent la preuve incomplète : la réminiscence montre que l'âme existait **avant** la naissance, non qu'elle existera **après** la mort. Socrate répond qu'elle est achevée si l'on joint les deux arguments ; mais il reconnaît qu'il reste une peur que les arguments ne suffisent pas à calmer.

    **La moitié manquante.** Pour Simmias, rien n'empêche d'affirmer à la fois que l'âme a son origine ailleurs et existe avant le corps, et qu'une fois entrée dans un corps et séparée de lui, elle subit {red}« sa fin et sa complète corruption »{/red}. La crainte du grand nombre tient toujours. Cébès précise : la démonstration n'a été faite {teal}« qu'à moitié »{/teal}.

    **La jonction des deux arguments.** Socrate répond que la preuve est achevée {teal}« si vous voulez bien articuler en un même raisonnement celui-ci avec le précédent »{/teal}. Le premier a établi que tout ce qui vit naît de ce qui est mort ; le second, que l'âme existe avant de naître. Si l'âme existe avant et que sa naissance ne peut venir que d'une mort, {coral}comment nier qu'elle existe aussi après la mort, puisqu'il lui faut naître de nouveau ?{/coral} La jonction n'est pas sans difficulté : le premier argument parle d'un principe qui parcourt le cycle des vies, le second d'une âme qui pense ; ce n'est pas tout à fait la même âme.

    **L'enfant qui a peur.** Socrate les soupçonne de craindre, {red}« d'une crainte enfantine »{/red}, que le vent n'éparpille l'âme à sa sortie du corps, surtout si l'on meurt {yellow}« lors d'une grande tempête »{/yellow}. Cébès en rit : il y a peut-être en nous {yellow}« comme un enfant »{/yellow} qui a peur de la mort comme d'un croque-mitaine. Cet enfant, c'est la part de nous que la démonstration convainc sans la rassurer.

    **L'incantation.** Il lui faut {teal}« une incantation quotidienne »{/teal} (*epôidê*). Le mot vient de la magie, mais Platon l'emploie pour les beaux discours qui soignent l'âme (*Charmide*) : l'incantation, c'est le raisonnement répété jusqu'à devenir une conviction. Où trouver l'enchanteur, puisque Socrate s'en va ? La Grèce est vaste, et il faut chercher partout sans épargner ni peine ni argent ; mais surtout {coral}les uns parmi les autres{/coral}, car ils trouveront difficilement plus aptes qu'eux-mêmes. C'est dire que la philosophie, en commun, doit prendre le relais de Socrate.

    ! L'incantation n'est pas une formule magique : c'est le discours répété qui transforme une démonstration en conviction.
    ! Socrate juge la preuve achevée en joignant les deux arguments, mais l'âme qui parcourt le cycle des vies et l'âme qui pense ne sont pas exactement la même.
