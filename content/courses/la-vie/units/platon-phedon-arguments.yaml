- id: platon-phedon-arguments-l8
  title: "L'affinité : l'âme ressemble à ce qui ne se dissout pas (78b-80c)"
  notes: |-
    Le troisième argument prend la crainte au mot : avoir peur que l'âme se disperse, c'est la ranger parmi les choses qui se dispersent. Socrate classe donc les choses en deux espèces et montre que {green}__l'âme ressemble à celle qui ne se dissout pas__{/green}.

    **La bonne question.** {amber}« à quelle espèce de chose peut-il bien convenir de subir une dispersion ? »{/amber} Il faudra ensuite chercher à laquelle des deux espèces appartient l'âme, et en tirer {teal}« confiance ou crainte »{/teal}.

    **Composé et non composé.** Il convient à ce qui a été composé de se décomposer {teal}« exactement selon le même processus que celui qui a présidé à sa composition »{/teal} : se dissoudre, c'est se séparer en ses parties. Ce qui n'est pas composé n'a pas de parties à séparer : {coral}« c'est par excellence à elle, et à elle seule, qu'il convient de ne pas subir ce processus »{/coral}.

    **Ce qui reste même que soi, ce qui change.** Les choses non composées sont vraisemblablement celles qui sont {teal}« toujours mêmes qu'elles-mêmes »{/teal}, comme {yellow}l'égal en soi, le beau en soi{/yellow}, qui ne reçoivent jamais aucune altération parce que chacun {teal}« comporte en soi et par soi une unique forme »{/teal}. Les {yellow}choses belles, hommes, chevaux, vêtements{/yellow}, au contraire, ne sont jamais les mêmes. Les premières ne se saisissent que par le raisonnement : elles sont **invisibles** ; les secondes se voient et se touchent.

    **Deux espèces, et l'âme du côté de l'invisible.** Posons donc deux espèces d'êtres : l'une visible et jamais la même, l'autre invisible et toujours la même. Nous sommes faits d'un corps et d'une âme. Le corps ressemble au visible ; l'âme, que personne ne voit, ressemble davantage à l'invisible.

    **L'âme ivre et l'âme qui pense.** La preuve vient aussi de ce que fait l'âme. Quand elle se sert du corps pour examiner, elle est traînée vers ce qui change {red}« et la voilà en proie à l'errance, au trouble, au vertige, comme si elle était ivre »{/red}. Quand elle examine seule par elle-même, elle s'élance vers ce qui est pur, immortel, toujours semblable à soi, et elle reste semblable à elle-même : {green}« Cet état de l'âme, c'est bien ce qu'on appelle la pensée »{/green}. L'âme se comporte comme ce avec quoi elle est en contact : c'est le signe de sa parenté avec l'invisible.

    **Commander et obéir.** Enfin, quand l'âme et le corps sont ensemble, la nature prescrit à l'âme de **commander**, au corps d'obéir. Or il revient au divin de commander, au mortel d'obéir : l'âme ressemble au divin.

    **La conclusion : indissoluble, ou presque.** L'âme ressemble à ce qui est {coral}« divin, immortel, objet pour l'intelligence, qui possède une forme unique, qui est indissoluble et toujours semblablement même que soi-même »{/coral} ; le corps à ce qui est humain, mortel, multiforme, sujet à dissolution. Il convient donc au corps de se dissoudre vite, et à l'âme {green}« d'être totalement indissoluble, ou presque »{/green}. L'argument ne conclut qu'à une **ressemblance** et à un « presque » : Socrate ne dit jamais que l'âme est non composée, il dit qu'elle ressemble à ce qui ne l'est pas. Elle peut d'ailleurs devenir plus ou moins semblable à l'invisible selon qu'elle pense ou qu'elle se livre aux sens. Ce « presque » laissera une prise aux objections.

    ! L'argument de l'affinité est un raisonnement de ressemblance : il rend très vraisemblable l'indissolubilité de l'âme, il ne la démontre pas.
    ! L'âme n'est pas une Forme : elle ressemble à l'invisible, et sa ressemblance croît ou décroît selon qu'elle pense ou qu'elle se laisse traîner par le corps.
