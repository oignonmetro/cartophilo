- id: platon-phedon-arguments-l10
  title: "La philosophie délie l'âme de sa prison (82c-84b)"
  notes: |-
    Socrate achève la section en décrivant le travail de la philosophie sur l'âme. Le corps n'est pas une prison par lui-même : {green}__c'est l'appétit qui enchaîne l'âme, et l'âme qui coopère à son propre enchaînement__{/green}. La philosophie la délie.

    **L'état où la philosophie trouve l'âme.** Quand la philosophie en prend possession, l'âme est {red}« enchaînée à l'intérieur d'un corps, agrippée à lui »{/red}, contrainte d'examiner les êtres à travers lui {yellow}« comme à travers les barreaux d'une prison »{/yellow}, au lieu de le faire elle-même, et vautrée dans l'ignorance.

    **L'enchaîné coopère à ses chaînes.** Le plus terrible dans cet emprisonnement, c'est qu'{amber}« il est l'œuvre de l'appétit, de sorte que c'est l'enchaîné lui-même qui coopère de la manière la plus efficace à parfaire son état d'enchaîné »{/amber}. La prison n'est plus l'« assignation à résidence » voulue par les dieux (62b) : c'est l'attention exclusive au corporel. Personne ne nous y tient que nous-mêmes.

    **Ce que fait la philosophie.** Elle parle doucement à l'âme et commence à la délier, en lui montrant que l'examen par les yeux, les oreilles, les autres sens, est plein d'illusions ; elle la persuade de s'en écarter autant qu'il n'est pas indispensable, de {teal}« se rassembler et à se ramasser elle-même en elle-même »{/teal}, de ne se fier qu'à elle-même, et de tenir pour sans vérité ce qui varie selon les instruments par lesquels on le saisit.

    **Le plus grand des maux.** Pourquoi l'âme du philosophe se tient-elle à l'écart des plaisirs, des peines, des craintes ? Non d'abord pour éviter la maladie ou la ruine, mais à cause d'un mal plus grand, qu'on subit sans le voir : l'âme {red}« est conduite à tenir ce qui cause l'affection la plus intense pour ce qui possède le plus d'évidence et de réalité véritable »{/red}. Un plaisir violent persuade que son objet est ce qu'il y a de plus réel ; or ce sont justement des choses visibles, qui ne le sont pas.

    **Le clou.** {yellow}« Chaque plaisir, chaque peine, c'est comme s'ils possédaient un clou avec lequel ils clouent l'âme au corps »{/yellow}, la fixent en lui et lui donnent la forme du corps : {teal}« À force de conformer ses jugements à ceux du corps et de se plaire aux mêmes objets »{/teal}, elle lui devient semblable. Elle ne peut donc arriver pure chez Hadès, et retombe aussitôt dans un autre corps, {yellow}« comme une nouvelle semence »{/yellow}.

    **Pénélope.** Une âme de philosophe ne serait pas assez sotte pour se laisser délier par la philosophie et, pendant ce temps, se rattacher aux plaisirs et aux peines : ce serait le travail sans fin d'une {yellow}Pénélope{/yellow} qui déferait sur sa toile ce que la philosophie a tissé. Elle apaise au contraire cette mer agitée, se laisse conduire par le raisonnement, se nourrit du vrai et du divin. Une âme ainsi formée {green}n'a pas à craindre d'être dispersée par les vents{/green} en quittant le corps.

    ! La prison, ici, n'est pas le corps lui-même, mais l'attention exclusive au corporel : c'est l'appétit qui enchaîne.
    ! Le plus grand mal n'est pas la douleur ou la ruine, mais l'illusion que l'objet d'une affection intense est ce qu'il y a de plus réel.
  points:
