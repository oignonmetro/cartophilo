- id: sep-psy4-l3
  title: "Pas d'organe : un isomorphisme qui représente"
  notes: |-
    **Que veut dire « ne faire qu'un par la forme » ? Prenons un cas favorable.** Qui pense que {yellow}les rainettes sont ovipares{/yellow} a une âme dont les états de structure sont, entre autres, un par la forme avec les rainettes. Or son âme ne devient pas une rainette. {red}__L'isomorphisme ne peut donc pas consister à posséder la forme comme la rainette la possède.__{/red} Il ressemble plutôt à celui d'{yellow}un plan et de la maison{/yellow} : il y a une structure commune, déterminée et exprimable, sans que le plan réalise la forme de la maison. Les maisons, après tout, ont trois dimensions.

    **Ce n'est pas un fait contingent : l'intelligence n'a pas d'organe.** Elle n'est pas {teal}« mêlée au corps »{/teal} :

    {teal}« elle ne se trouve pas non plus mêlée au corps. Car elle aurait alors une qualité, devenant ou chaude ou froide, et elle disposerait de quelque organe, comme la faculté sensitive, alors qu'en fait, elle n'en a aucun. »{/teal} (III, 4, 429a24-27)

    **La conséquence.** {yellow}Les briques et le mortier{/yellow} réalisent la forme d'une maison, ils abritent. Une intelligence ainsi comprise ne peut pas abriter. Donc, {coral}__quand elle devient isomorphe à son objet, ce doit être en un sens atténué, non littéral : elle le représente.__{/coral} Le mieux est de lire ainsi Aristote : S pense O quand son intelligence se rend semblable à O en représentant ses traits de structure saillants, par un isomorphisme direct, sans réaliser la forme de O à la manière de O.

    ! La thèse garde un intérêt hors du cadre aristotélicien : penser par isomorphisme entre nos capacités de représentation et les objets de notre connaissance a toujours eu ses partisans.
  points:
