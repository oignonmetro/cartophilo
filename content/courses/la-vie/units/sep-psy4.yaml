- id: sep-psy4-l6
  title: "Ni l'appétit seul : les gens maîtres d'eux-mêmes"
  notes: |-
    **Par le même raisonnement, Aristote écarte d'abord l'appétit lui-même (`orexis`).** Une faculté ne peut expliquer l'action si son activité ne suffit pas à déclencher le mouvement. Or :

    {teal}« les gens maîtres d'eux-mêmes, malgré leur appétit et leur désir, n'accomplissent pas les actions dont ils ont l'appétit, mais obéissent à l'intelligence »{/teal} (III, 9, 433a6-8)

    Les continents, à la différence de ceux qui sont pleinement tempérants, ont des désirs mauvais et n'y cèdent jamais : {green}__leurs désirs ne suffisent donc pas à l'action.__{/green} L'appétit seul, pris comme une faculté unique, ne l'explique pas entièrement.

    **Le conflit a son image dans l'*Éthique à Nicomaque*.** Chez le continent comme chez l'incontinent, il y a {teal}« une autre chose, naturellement distincte de la raison, qui est en conflit avec elle et lui résiste »{/teal} (I, 13, 1102b17-18). {yellow}« exactement comme les membres paralysés du corps qu'on décide de mouvoir vers la droite se portent au contraire vers la gauche »{/yellow} (1102b18-20) : seulement, {teal}« dans les corps, nous voyons ce qui se porte de travers, tandis que dans le cas de l'âme, nous ne le voyons pas »{/teal} (1102b22-23).

    | Personnage | Sa raison | Son désir | Ce qu'il fait |
    | le continent | correcte | mauvais | il suit la raison |
    | l'incontinent | correcte | mauvais | il suit le désir |
    | le tempérant | correcte | accordé | il suit les deux |

    **Le contre-exemple joue donc dans les deux sens.** L'incontinent montre que l'intelligence ne suffit pas à mouvoir ; le continent, que l'appétit ne suffit pas non plus. {coral}C'est de cette double insuffisance que part la solution du chapitre suivant.{/coral}
