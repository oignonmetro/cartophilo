- id: sep-psy4-l5
  title: "Qu'est-ce qui meut l'animal ? Trois réponses écartées"
  notes: |-
    **Sensation et pensée n'expliquent pas un fait central : les animaux se déplacent à la poursuite de ce qu'ils désirent.** {yellow}Pourquoi l'autruche a-t-elle fui le tigre ? Parce qu'elle voulait survivre. Pourquoi cet être humain a-t-il pris le chemin de l'opéra ? Parce qu'il voulait entendre la musique.{/yellow} L'explication par le désir vient toute seule : voilà pourquoi le *De l'âme* ne s'arrête pas à l'intelligence.

    **La question de III, 9.** {teal}« qu'est-ce qui imprime à l'animal le mouvement de locomotion ? »{/teal} (432b13-14) Aristote écarte une à une les facultés déjà étudiées.

    | Faculté | Pourquoi elle n'explique pas le mouvement |
    | nutritive | les plantes l'ont et ne se déplacent pas |
    | sensitive | des animaux l'ont et restent sur place |
    | intelligence spéculative | elle ne dit rien de ce qu'il faut fuir |
    | intelligence qui commande | elle ne suffit pas à faire agir |

    **La nutrition.** Le mouvement {teal}« vise toujours un but »{/teal}, et s'accompagne de représentation ou d'appétit. Sinon, les plantes aussi se déplaceraient.

    **La sensation.** {teal}« il est beaucoup d'animaux qui possèdent bel et bien le sens, mais restent sur place »{/teal} (432b19-21) : {yellow}éponges, huîtres, certains testacés{/yellow}. L'argument s'appuie sur un principe : si {teal}« la nature ne fait rien en vain »{/teal} (432b21), et que ces animaux sont complets, puisqu'ils se reproduisent, ils auraient les organes de la marche si la sensation était ce qui meut.

    **L'intelligence.** Spéculative, elle {teal}« ne considère aucune action à accomplir et ne dit rien de ce qui est à fuir ou à poursuivre »{/teal} (432b27-28). Même lorsqu'elle commande, cela ne suffit pas : {teal}« quand bien même l'intelligence ordonne et la réflexion dit de fuir ou de poursuivre quelque chose, on ne bouge pas ; et l'action, au contraire, s'aligne sur le désir »{/teal} (433a1-3), {yellow}et le médecin qui sait la médecine ne soigne pas pour autant{/yellow}.

    ! L'objection n'est pas que l'intelligence ne joue aucun rôle dans l'action, mais qu'elle n'y suffit pas : savoir ce qu'il faut faire n'est pas encore le faire.
