# Cours sur la psychologie d'Aristote (voir content/philosophie.md), tiré de
# l'article « Aristotle's Psychology » de Christopher Shields, Stanford
# Encyclopedia of Philosophy : sections 7 et 8. Citations du De l'âme dans la
# traduction de Bodéüs ; Métaphysique et Éthique à Nicomaque dans les Œuvres
# complètes (Flammarion).
#
# Le supplément sur l'intelligence productrice de III, 5 ne figure pas dans le
# PDF fourni : ce chapitre n'a donc pas de leçon. Le passage des Seconds
# Analytiques, I, 31 (87b37-88a7), reste un simple repère : l'extrait reçu venait
# d'un autre chapitre. L'idée y est citée d'après De l'âme, II, 5, 417b22-23.
# La continence (Éthique à Nicomaque, I, 13) porte sur les « gens maîtres d'eux-
# mêmes » de Bodéüs, qui rend ainsi les continents de l'article.

