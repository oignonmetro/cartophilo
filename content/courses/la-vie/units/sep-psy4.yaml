- id: sep-psy4-l7
  title: "L'appétit et l'intelligence pratique"
  notes: |-
    **Le chapitre III, 10 répond : il y a bien une faculté qui meut, mais elle n'agit pas seule.** Il commence par poser deux principes.

    {teal}« il est au moins manifeste qu'il y a là deux principes qui, alternativement, sont à l'origine du mouvement : l'appétit et l'intelligence, si l'on veut bien poser la représentation comme une sorte d'intellection »{/teal} (433a9-10)

    **Ce qui permet d'étendre la thèse aux animaux.** L'intelligence pratique est ici prise au sens large : elle inclut le traitement d'images que l'on trouve chez les animaux non humains, puisque {teal}« chez les autres animaux, il n'est pas question d'intellection, ni de raisonnement, mais de représentation »{/teal} (433a11-12). Appétit et intelligence pratique agissent de concert chez tous les animaux.

    **Lequel des deux commence ?** L'intelligence pratique est motrice quand elle prend pour point de départ un objet d'appétit. {green}__Le premier moteur n'est donc ni la raison ni la faculté, mais la chose voulue__{/green} : {teal}« Il n'y a donc qu'une seule chose à jouer, au départ, un rôle moteur : c'est l'objet de l'appétit. »{/teal} (433a21) D'où la conclusion :

    {teal}« il est clair que le genre de faculté de l'âme qui imprime le mouvement est ce qu'on appelle l'appétit »{/teal} (433a31)

    Ce qui est visé {teal}« est soit le bien, soit l'apparence du bien »{/teal} (433a28-29), et non n'importe quel bien : celui qui peut se faire. Le mot de la fin : {teal}« c'est donc dans la mesure où il est capable d'appétit, que l'animal est apte à se mouvoir lui-même »{/teal} (433b27-28).

    **Une hésitation bien fondée.** On a jugé ce traitement balbutiant, voire confus. Ce jugement sévère n'a pas de raison d'être : {coral}Aristote est sans doute sensible à la complexité des questions de philosophie de l'action.{/coral} À la différence de certains humiens ultérieurs, il voit que les données y sont instables : l'action a pour antécédent une faculté d'appétit, mais celle-ci n'est pas la seule en cause, et {coral}la raison pratique et la représentation y ont un rôle indispensable.{/coral}

    ! Dire que l'appétit meut ne fait pas d'Aristote un humien pour qui la raison serait esclave des passions : l'intelligence pratique reste indispensable à l'action.
