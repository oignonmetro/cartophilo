- id: sep-psy4-l4
  title: "Rien avant de penser : une difficulté, deux altérations"
  notes: |-
    **Ce qui fait la force de l'analyse fait aussi sa faiblesse.** Le changement hylémorphique a deux exigences : (i) un sujet préexistant, (ii) qui convienne à ce changement par sa catégorie. {yellow}Seule une surface peut changer de couleur ; une action, comme le trouble de Socrate sous le regard d'Alcibiade, ne peut pas devenir blanche.{/yellow}

    **Or, au premier pas, le modèle semble dépassé.** Aristote soutient que l'intelligence {teal}« n'est effectivement aucune des réalités avant de penser »{/teal} (III, 4, 429a24), à cause de la plasticité dont elle a besoin pour pouvoir tout penser : {teal}« Dès lors donc qu'elle saisit tout »{/teal}, rien d'étranger ne doit y faire écran (429a18-20), et {teal}« elle ne peut même avoir la moindre nature, en dehors de celle qui consiste à être un possible »{/teal} (429a21-22). {red}__Mais si elle n'est rien en acte avant de penser, comment l'analyse du changement s'y appliquerait-elle ?__{/red} {yellow}Une pâte à laquelle on donne forme de biscuit est déjà de la pâte{/yellow} ; même un organe des sens existe avant d'être affecté. D'où l'image célèbre : {yellow}« comme sur un tableau où aucun dessin ne se trouve réalisé »{/yellow} (429b31-430a1).

    **Une ressource : tout changement n'est pas une perte.** Aristote distingue :
    - {pink}la clôture brune peinte en blanc{/pink} : il y a destruction et perte de la couleur première ;
    - {green}le bâtisseur qui prend ses outils et se met à bâtir{/green} : rien n'est détruit, il était déjà capable, et il le devient pleinement.

    Le texte de II, 5 : {teal}« Que se mette, en effet, à spéculer celui qui possède la science, il n'y a pas là précisément d'altération, puisque le progrès va du même au même, dans le sens de la réalisation ; ou bien il s'agit d'un genre d'altération différent. Aussi n'est-on pas en droit de dire de l'être pensant, lorsqu'il pense, qu'il s'altère, non plus que du bâtisseur, lorsqu'il bâtit. »{/teal} (417b5-9) Ou bien on parle d'affection seulement en admettant {teal}« qu'il existe deux modes d'altération »{/teal} (417b14-15).

    **Une issue possible.** L'intelligence serait simplement apte à recevoir la forme d'une infinité d'objets de pensée, et donc rien de déterminé en elle-même. {coral}Loin d'être une anomalie, elle serait dans l'ordre cognitif ce que serait la matière la plus fondamentale, s'il y en a une, dans l'ordre matériel : l'une et l'autre se définiraient par l'étendue de leurs possibles.{/coral} Séparée de la thèse singulière de l'intelligence qui n'est rien avant de penser, l'analyse garde en tout cas sa plausibilité.
