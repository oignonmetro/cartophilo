- id: sep-psy4-l2
  title: "Penser, c'est recevoir une forme"
  notes: |-
    **Aristote aborde la pensée avec la même analyse hylémorphique que la perception.** Elle en est le prolongement :

    {teal}« Si, donc, l'opération de l'intelligence se compare à celle du sens, ou bien elle consistera à subir quelque chose sous l'effet de l'intelligible, ou bien elle sera une autre opération du même genre. Il doit donc y avoir un principe indéterminé, mais capable de recevoir la forme, un principe tel en puissance que celle-ci, mais qui n'est pas celle-ci. Et la relation du sensitif aux sensibles doit être celle de l'intelligence aux intelligibles. »{/teal} (III, 4, 429a13-18)

    **Le schéma est le même que pour la perception.** S pense O si et seulement si : (i) S a la capacité requise pour recevoir la **forme intelligible** de O ; (ii) O agit sur cette capacité en lui donnant forme ; (iii) la capacité devient isomorphe à cette forme.

    **Une précision évidente : on reçoit la forme, non le composé.** {teal}« ce n'est pas la pierre qui se trouve dans l'âme, mais sa forme »{/teal} (III, 8, 431b29-432a1). Qui pense à une pierre, plutôt que d'en percevoir une, a une faculté capable de ne faire qu'un, par la forme, avec cette pierre.

    **L'universel et le particulier.** Aristote en tire parfois que la pensée porte sur l'universel et la perception sur le particulier : {teal}« la sensation en acte porte sur les objets particuliers, alors que la science porte sur les objets universels »{/teal} (II, 5, 417b22-23 ; voir aussi *Seconds Analytiques*, I, 31). Il admet ailleurs que nous connaissons aussi les individus (II, 5, 417a29 ; *Métaphysique*, XIII, 10). {coral}Il n'y a pas là de contradiction{/coral} : il peut vouloir dire que la pensée procède à un plus haut degré de généralité, parce qu'elle a affaire à des traits de structure assez abstraits. On peut penser ce que c'est qu'être une pierre ; on ne le perçoit pas, au sens direct.

    ! Avoir la forme de la pierre dans l'âme n'est pas avoir une petite pierre dans la tête : c'est tout l'objet de la leçon suivante.
