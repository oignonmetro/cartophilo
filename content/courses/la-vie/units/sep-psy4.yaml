lessons:
- id: sep-psy4-l1
  title: "L'intelligence : ce qui fait l'homme"
  notes: |-
    **Aristote décrit l'intelligence (`nous`, souvent rendu par « intellect », « esprit » ou « raison ») par sa fonction** : {teal}« la partie de l'âme qui lui permet de connaître et de penser »{/teal} (III, 4, 429a10). Il y va de notre nature : {teal}« Tous les humains ont par nature le désir de savoir. »{/teal} (*Métaphysique*, I, 1, 980a21) {green}__De même qu'avoir des sens est essentiel à l'animal, avoir une intelligence est essentiel à l'homme.__{/green} En l'étudiant, Aristote étudie ce qui fait de l'homme un homme.

    **Une intelligence à deux usages.** L'homme ne fait pas que comprendre : il délibère, pèse des possibilités, conçoit des plans. Aristote attribue aussi ces activités à l'intelligence, et distingue :

    | Intelligence | Ce qu'elle fait |
    | théorique ou spéculative | comprendre et contempler |
    | pratique ou exécutive | délibérer et conduire l'action |

    Le *De l'âme* précise que la seconde {teal}« diffère d'ailleurs de l'intelligence spéculative par sa fin »{/teal} (III, 10, 433a14-15). L'*Éthique à Nicomaque* les relie : {teal}« l'intelligence saisit les réalités ultimes dans les deux directions »{/teal} (VI, 1143a35-b1). Dans les démonstrations, {yellow}elle saisit les premiers principes{/yellow} ; dans l'action, {yellow}le cas particulier à exécuter{/yellow}.

    **Où cela se trouve.** L'enquête principale tient dans deux chapitres, {sky}*De l'âme*, III, 4 et III, 5{/sky}, riches et réputés difficiles.

    ! « Intelligence » traduit ici `nous` et non une aptitude à résoudre des problèmes : elle n'est le propre que de l'homme parmi les êtres naturels.
