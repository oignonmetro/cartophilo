- id: sens5-l8
  title: "Les passions"
  notes: |
    Dernier élément : la théorie des « **passions** » ou « émotions » (`pathai`). Aux chapitres 1 à 11 du livre II de la *Rhétorique*, Aristote développe ce qu'on a pu appeler un « **traité des passions** » : cherchant les moyens dont dispose le rhéteur pour persuader une foule, il examine les passions qu'il peut susciter, leurs objets, les situations qui les provoquent et les caractères qui y sont disposés.

    Les émotions y sont des **mélanges complexes** de plaisir, de douleur, de désir et de crainte, éprouvés dans des situations et envers des individus particuliers. Selon Jamie Dow (*Passions and Persuasion in Aristotle's Rhetoric*, 2015), toutes les émotions dont Aristote fait la théorie *sont* des affections de la sensibilité, du plaisir et de la douleur. Ainsi la **colère**, émotion paradigmatique : « l'appétit accompagné de douleur de ce qui apparaît comme une vengeance à cause de ce qui apparaît comme un acte de dépréciation atteignant nous-même ou nos proches, quand cette dépréciation n'est pas justifiée » (*Rhétorique*, II, 2). Désir issu d'une douleur, celle d'une **dépréciation** jugée injuste, elle est suscitée par le `phantasma` plaisant d'une possible **vengeance** : un entrelacs de plaisirs et de douleurs issus de représentations.

    Olivier Renaut (*La Rhétorique des passions*, 2022) : « Plaisirs et douleurs constituent le lieu d'une expérience où s'articulent désir, sensation et représentation, et où se greffent anticipation et mémoire, opinion et même intellection, ces dernières opérations pouvant susciter des états affectifs complexes (le plaisir du deuil), de second ordre (la honte face au plaisir), ou redoublés (la peur d'avoir peur). » La sensibilité ouvre donc à une **vie émotionnelle** complexe : être sensible, c'est in fine être sensible à certaines émotions.

    ! Une passion n'est pas une sensation simple : c'est un entrelacs de plaisirs, de douleurs et de représentations.
