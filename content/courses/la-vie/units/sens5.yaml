- id: sens5-l6
  title: "Le logos et le plaisir de l'harmonie"
  notes: |
    Pourquoi seuls les humains auraient-ils de tels besoins ? {sky}Pierre **Pellegrin**{/sky} (*Des Animaux dans le monde*, 2022) formule une autre hypothèse, à partir des fragments des *Problèmes* (texte dont on n'a que des parties, {amber}d'authenticité douteuse{/amber}) : l'homme apprécie {green}des formes d'**harmonie**{/green} dans ses sensations {coral}parce qu'il possède le `logos`{/coral}. Or `logos` signifie à la fois la raison, le langage, et l'harmonie musicale ou mathématique. L'homme éprouverait ainsi, à même les sensations, {coral}un plaisir inaccessible aux autres animaux et non ramené à sa survie{/coral} : celui de l'harmonie entre les qualités sensibles.

    On pourrait alors relier la théorie de la sensibilité au plaisir pris au {yellow}spectacle **tragique**{/yellow}, dont parle la *Poétique* (13 et 14) : {teal}« Or, c'est le plaisir issu de la pitié et de la peur{/teal} {teal}au moyen de la représentation{/teal} que {teal}le poète doit procurer. »{/teal} L'homme jouit de l'harmonie dans ce qu'il sent : {yellow}l'odeur d'une fleur, le son d'une cithare, le spectacle d'une tragédie{/yellow}.

    {red}Est-ce un plaisir **intellectuel** ?{/red} Les indices manquent, {amber}la réponse ne peut être que spéculative{/amber} ; on peut penser que non : le plaisir propre d'un sens est éprouvé *dans* la sensation, {green}**senti** et non pensé{/green}. Mais il ne va pas sans l'intellect, {coral}sa **condition de possibilité**{/coral}, {yellow}comme l'intellection du triangle en soi ne va pas sans image{/yellow}. La sensibilité fonde la diversité de la vie psychique, mais {coral}elle en est modifiée **en retour**{/coral} : l'intelligence rend l'homme sensible au plaisir particulier de l'expérience **artistique**.

    ! Le plaisir artistique reste senti : l'intellect le rend possible sans le produire.
