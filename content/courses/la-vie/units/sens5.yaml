- id: sens5-l4
  title: "Penser avec des images"
  notes: |
    L'intelligence n'est {amber}ni **exclusive** de la sensibilité, ni seulement analogue à elle{/amber} : son exercice et son contenu {green}doivent s'**incarner** dans un `phantasma`{/green}. {teal}« L'âme ne pense jamais sans `phantasma` »{/teal} (*De l'âme*, III, 7). {red}Non que l'objet de la pensée soit une image{/red} : la pensée a besoin d'{coral}un **support sensible**{/coral}, fût-ce une image mentale. {teal}« La faculté intellective saisit les formes (`eidè`) immanentes aux `phantasmata` »{/teal} : les intelligibles ne sont pas des images, mais ils ne sont pas donnés *sans* images.

    Solution nuancée entre deux approches :

    | Approche         | Thèse                                          | Représentants |
    | Sensualiste      | les idées se réduisent à des impressions       | l'empirisme de Hume ; dans l'Antiquité, Démocrite et les épicuriens |
    | Intellectualiste | la pensée est indépendante des données sensibles, qui peuvent seulement susciter l'interrogation | l'épistémologie de Platon ; sous une autre forme, la tradition cartésienne |

    Exemple : {yellow}le **géomètre**{/yellow} ne s'interroge pas sur ce triangle-ci, tracé au tableau ou imaginé, mais sur les propriétés de tout triangle, sur ce que {sky}Platon{/sky} appellerait le « triangle en soi », son **essence**. {amber}Mais il ne les pense pas sans l'image d'un triangle particulier{/amber}.

    {coral}La science s'appuie ainsi sur la sensation sans s'y réduire{/coral} : aucune sensation ne constitue un savoir, qui porte sur l'universel ; c'est ce qui distingue Aristote des {red}**empirismes**{/red} anciens et modernes auxquels on veut trop souvent le ramener. Mais {teal}« si une sensation manquait{/teal}, {teal}nécessairement un savoir scientifique manquerait aussi{/teal}, et il nous serait {teal}impossible de l'acquérir »{/teal} (*Seconds Analytiques*, I, 18, 81a38-39 ; Pellegrin traduit « perception ») : la sensibilité offre à la science {coral}ses possibilités de **figuration**{/coral}. D'où la définition de l'homme comme {violet}« animal **rationnel** »{/violet}, vivant *sensible* doué de raison. La connaissance n'est ni réductible à la sensation, dont elle tire un matériau, ni un dépassement voué à s'en affranchir, {red}comme dans le platonisme{/red}.

    ! « Ne jamais penser sans image » ne veut pas dire que penser, c'est imaginer.
  points:
