- id: sens5-l8
  title: "Les passions"
  notes: |
    Dernier élément : la théorie des {violet}« **passions** » ou « émotions »{/violet} (`pathai`). Aux chapitres 1 à 11 du livre II de la *Rhétorique*, Aristote développe ce qu'on a pu appeler {amber}un « **traité des passions** »{/amber} : cherchant les moyens dont dispose le rhéteur pour persuader une foule, il examine les passions qu'il peut susciter, leurs objets, les situations qui les provoquent et les caractères qui y sont disposés.

    Les émotions y sont des {coral}**mélanges complexes**{/coral} de plaisir, de douleur, de désir et de crainte, éprouvés dans des situations et envers des individus particuliers. Selon {sky}Jamie Dow{/sky} (*Passions and Persuasion in Aristotle's Rhetoric*, 2015), toutes les émotions dont Aristote fait la théorie *sont* des affections de la sensibilité, du plaisir et de la douleur. Ainsi la {yellow}**colère**{/yellow}, émotion paradigmatique : {teal}« l'appétit accompagné de douleur{/teal} de {teal}ce qui apparaît comme une vengeance{/teal} à cause de ce qui apparaît comme {teal}un acte de dépréciation{/teal} atteignant nous-même ou nos proches, quand cette dépréciation {teal}n'est pas justifiée »{/teal} (*Rhétorique*, II, 2). Désir issu d'une douleur, celle d'une **dépréciation** jugée injuste, elle est suscitée par le `phantasma` plaisant d'une possible **vengeance** : {coral}un entrelacs de plaisirs et de douleurs issus de représentations{/coral}.

    {sky}Olivier Renaut{/sky} (*La Rhétorique des passions*, 2022) : « Plaisirs et douleurs constituent le lieu d'une expérience où s'articulent désir, sensation et représentation, et où se greffent anticipation et mémoire, opinion et même intellection, ces dernières opérations pouvant susciter des états affectifs complexes (le plaisir du deuil), de second ordre (la honte face au plaisir), ou redoublés (la peur d'avoir peur). » La sensibilité ouvre donc à une {coral}**vie émotionnelle**{/coral} complexe : {amber}être sensible, c'est in fine être sensible à certaines émotions{/amber}.

    ! Une passion n'est pas une sensation simple : c'est un entrelacs de plaisirs, de douleurs et de représentations.
