- id: sens5-l2
  title: "La phantasia, faculté de transition"
  notes: |
    Traduite par « imagination », la `phantasia` n'est pas {red}aussi **suspecte**{/red} pour Aristote que ce terme en général. Beaucoup ont violemment critiqué l'imagination, {sky}Platon{/sky} au premier chef, qui {red}dévalorise **ontologiquement et épistémologiquement**{/red} les `phantasmata`. La `phantasia` aristotélicienne peut être fausse, mais elle est d'abord {green}la faculté qui assure la **transition** entre la sensibilité et l'intelligence{/green} : {coral}elle fournit à la pensée son substrat sensible{/coral}. Comme pour la sensibilité, l'approche est psychologique avant d'être critique.

    Aristote la rapproche donc étroitement de la sensibilité, jusqu'à en faire une sorte de sensation : {teal}« La <faculté> imaginative et la <faculté> sensible sont la même chose{/teal}, bien que, dans leur essence, la <faculté> imaginative et la <faculté> sensible {teal}diffèrent l'une de l'autre »{/teal} (*Des rêves*, 1). Certains commentateurs, comme {sky}Pierre-Marie **Morel**{/sky}, font ainsi de la `phantasia` une espèce de sensation et du `phantasma` une sensation à part entière ; elle opère d'ailleurs au niveau de l'organe de la sensation commune, le {violet}**cœur**{/violet}.

    Mais les deux facultés {teal}« diffèrent dans leur essence »{/teal} (`to d'einai heteron`) : deux processus distincts sur une même matière, les qualités sensibles. {amber}La sensation est acte commun avec un sensible extérieur ; la `phantasia` opère seule{/amber}. {yellow}Certains animaux ont la sensibilité sans la `phantasia`{/yellow}. Et d'autres passages en font une dimension de l'**intellect**, en raison de l'absence de son objet ({teal}« si l'on veut bien poser que la `phantasia` est comme une sorte d'intellection »{/teal}, *De l'âme*, III, 10) : d'où l'idée qu'il y aurait **deux** `phantasiai`.

    Plus prudemment : la `phantasia` est une {coral}**faculté de transition**{/coral}, qui prolonge la sensibilité et que prolonge l'intellection. L'âme animale n'est pas {pink}une somme de facultés closes{/pink}, mais {green}une totalité **organique**{/green}, un *continuum* d'activités.

    ! Rapprocher `phantasia` et sensation n'est pas les confondre : leur « être » diffère.
  points:
  - id: sens5-l2-p1
    sentence: "__Pour Aristote, la *phantasia* n'est pas aussi__ ___ que l'est en général le terme d'imagination."
    answer: "suspecte"
