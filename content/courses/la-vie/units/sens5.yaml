- id: sens5-l3
  title: "Sensibilité et intelligence : analogie et écart"
  notes: |
    La pensée (`nous`), propre à l'homme, s'appuie {amber}de manière **médiate**{/amber} sur la sensibilité. *De l'âme*, III, 4-6 la présente comme {amber}**analogue** à la sensibilité{/amber} : comme la sensation est l'activité commune du sensible et de la sensibilité, l'intellection est l'activité commune d'un {violet}**intelligible**{/violet} et de l'intelligence ; comme elle, l'intelligence saisit des **différences**. D'où Aristote les réunit, au début de *De l'âme*, III, 9, sous une unique {violet}« **faculté critique** »{/violet}. {coral}Les différences entre facultés sont **plastiques**{/coral}, et l'intelligence se comprend à l'aune de la sensibilité.

    Mais l'écart est réel : Aristote refuse toujours de {red}**réduire** l'intelligence à la sensibilité{/red}.

    |                     | Sensibilité  | Intelligence                                   |
    | Différences saisies | sensibles    | intelligibles                                  |
    | Objets              | particuliers | universels (propriétés mathématiques, concepts) |

    L'intelligence n'est pas {pink}une sensation **raffinée**{/pink}, comme peut-être la `phantasia`, mais une faculté d'un tout autre ordre. Elle fonde la distinction de l'homme et des autres animaux : {coral}non de degré, mais de **nature**{/coral}, {yellow}comparable à l'écart entre plantes et animaux{/yellow}. Dans les {sky}*Éthiques*{/sky}, le bien proprement humain, le bonheur, coïncide avec l'exercice excellent de l'intelligence, pratique ou théorique, et non de la sensibilité : {green}la vie humaine est *plus* qu'animale, *plus* que sensible{/green}. Mais la sensibilité n'en est pas absente : {amber}l'homme est *aussi* un animal{/amber}.

    ! L'analogie entre sentir et penser ne supprime pas l'écart de nature entre le sensible et l'intelligible.
  points:
