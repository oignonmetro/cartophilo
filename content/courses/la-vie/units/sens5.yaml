- id: sens5-l7
  title: "Le désir, principe du mouvement"
  notes: |
    Second temps de la dérivation : l'animal sensible au plaisir et à la douleur est {teal}« également doué du désir{/teal}, puisque ce dernier est {teal}l'appétit de l'agréable »{/teal}. La sensibilité intervient aussi {amber}à un niveau **médiat**{/amber} : désirer suppose de {coral}se représenter de manière **prospective** le plaisir ou la peine à venir{/coral}, donc la `phantasia`. L'appétitif repose ainsi sur la sensibilité {amber}de **deux façons**{/amber} : il y trouve ses objets, et, médiatement, il passe par la `phantasia`.

    Or c'est l'appétitif, plus précisément {green}l'**objet désiré**, qu'Aristote consacre comme **principe du mouvement**{/green} et des décisions de l'individu : c'est la thèse centrale de *De l'âme*, III, 9 et 10 (voir l'unité « Désir, mouvement et action »). {amber}Thèse **polémique**{/amber} : elle s'oppose à {red}la conception **intellectualiste** de la volonté du socratisme{/red}, qui place le principe de l'action {red}dans le **jugement**{/red} (une chose est désirée parce qu'on la juge bonne : voir le {sky}*Ménon*{/sky}, 77b-78a). Pour Aristote, l'intellect et la faculté opinative sont {coral}à eux seuls **impuissants** à faire désirer{/coral} ; le désir en est indépendant, car l'agréable et le douloureux résident dans la sensation. {amber}L'intelligence peut l'informer, l'influencer, non en être la source{/amber}.

    D'où {coral}la justification psychologique de toute l'**éthique** d'Aristote{/coral} : éduquer à la vertu n'est pas seulement {pink}transmettre une connaissance du bien{/pink} (comme chez {sky}Socrate{/sky} et, dans une certaine mesure, chez Platon, dont {sky}Marion Pollaert{/sky} nuance l'intellectualisme), mais d'abord {green}**former le caractère**{/green} par les plaisirs et les peines, véritables principes de l'action (*Éthique à Nicomaque*, II, 1). Connaissance et intellect n'agissent sur le caractère que par le plaisant et le douloureux. Le mouvement animal est assis sur la sensibilité aux plaisirs et aux peines, {pink}non sur les facultés « supérieures »{/pink}.

    ! Aristote ne nie pas le rôle de l'intellect dans l'action : il nie qu'il puisse, seul, faire désirer.
