- id: sens5-l3
  title: "Sensibilité et intelligence : analogie et écart"
  notes: |
    La pensée (`nous`), propre à l'homme, s'appuie de manière **médiate** sur la sensibilité. *De l'âme*, III, 4-6 la présente comme **analogue** à la sensibilité : comme la sensation est l'activité commune du sensible et de la sensibilité, l'intellection est l'activité commune d'un **intelligible** et de l'intelligence ; comme elle, l'intelligence saisit des **différences**. D'où Aristote les réunit, au début de *De l'âme*, III, 9, sous une unique « **faculté critique** ». Les différences entre facultés sont **plastiques**, et l'intelligence se comprend à l'aune de la sensibilité.

    Mais l'écart est réel : Aristote refuse toujours de **réduire** l'intelligence à la sensibilité.

    |                     | Sensibilité  | Intelligence                                   |
    | Différences saisies | sensibles    | intelligibles                                  |
    | Objets              | particuliers | universels (propriétés mathématiques, concepts) |

    L'intelligence n'est pas une sensation **raffinée**, comme peut-être la `phantasia`, mais une faculté d'un tout autre ordre. Elle fonde la distinction de l'homme et des autres animaux : non de degré, mais de **nature**, comparable à l'écart entre plantes et animaux. Dans les *Éthiques*, le bien proprement humain, le bonheur, coïncide avec l'exercice excellent de l'intelligence, pratique ou théorique, et non de la sensibilité : la vie humaine est *plus* qu'animale, *plus* que sensible. Mais la sensibilité n'en est pas absente : l'homme est *aussi* un animal.

    ! L'analogie entre sentir et penser ne supprime pas l'écart de nature entre le sensible et l'intelligible.
