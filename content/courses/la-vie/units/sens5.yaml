- id: sens5-l6
  title: "Le logos et le plaisir de l'harmonie"
  notes: |
    Pourquoi seuls les humains auraient-ils de tels besoins ? Pierre **Pellegrin** (*Des Animaux dans le monde*, 2022) formule une autre hypothèse, à partir des fragments des *Problèmes* (texte dont on n'a que des parties, d'authenticité douteuse) : l'homme apprécie des formes d'**harmonie** dans ses sensations parce qu'il possède le `logos`. Or `logos` signifie à la fois la raison, le langage, et l'harmonie musicale ou mathématique. L'homme éprouverait ainsi, à même les sensations, un plaisir inaccessible aux autres animaux et non ramené à sa survie : celui de l'harmonie entre les qualités sensibles.

    On pourrait alors relier la théorie de la sensibilité au plaisir pris au spectacle **tragique**, dont parle la *Poétique* (13 et 14) : « Or, c'est le plaisir issu de la pitié et de la peur au moyen de la représentation que le poète doit procurer. » L'homme jouit de l'harmonie dans ce qu'il sent : l'odeur d'une fleur, le son d'une cithare, le spectacle d'une tragédie.

    Est-ce un plaisir **intellectuel** ? Les indices manquent, la réponse ne peut être que spéculative ; on peut penser que non : le plaisir propre d'un sens est éprouvé *dans* la sensation, **senti** et non pensé. Mais il ne va pas sans l'intellect, sa **condition de possibilité**, comme l'intellection du triangle en soi ne va pas sans image. La sensibilité fonde la diversité de la vie psychique, mais elle en est modifiée **en retour** : l'intelligence rend l'homme sensible au plaisir particulier de l'expérience **artistique**.

    ! Le plaisir artistique reste senti : l'intellect le rend possible sans le produire.
