- id: sens5-l1
  title: "La phantasia"
  notes: |
    Toutes les facultés propres aux animaux, soit toutes sauf la **nutrition** (qui englobe reproduction et croissance), dérivent de la sensibilité : l'intelligence, l'appétit (`orexis`), le mouvement. Geste philosophique **fort** : des opérations tenues ailleurs pour les plus éminentes, la pensée ou le raisonnement, se trouvent fondées sur la sensation, sans lui être réductibles.

    La première est la `phantasia`, souvent traduite « imagination » ou « représentation » : la faculté de produire des `phantasmata`, des images sensibles, qui se distinguent de celles de la sensation par l'**absence** de leur objet. « Les contenus de la `phantasia` sont, en effet, comme des données du sens, sauf qu'ils sont sans matière » (*De l'âme*, III, 8). Je sens une couleur quand je la vois sur un objet présent ; j'en ai un `phantasma` quand je m'en représente l'image, l'objet absent. En termes techniques : la `phantasia` est l'acte de la **seule** sensibilité, sans celui du sensible, alors que la sensation est leur acte **commun**.

    Elle englobe le rêve et la remémoration, d'où l'embarras des traducteurs. Dans le *De l'âme*, seul III, 3 lui est consacré ; mais plusieurs *Parva naturalia* traitent d'opérations qui en relèvent : *Sur la mémoire et la réminiscence*, et les trois traités sur le sommeil et le rêve.

    Son activité dérive littéralement de la sensation : « la `phantasia` est le mouvement qui se produit sous l'effet de la sensation en acte » (*De l'âme*, III, 3 ; même affirmation dans *Des rêves*, 1). Elle est d'abord **rétention** des sensations en images mentales, puis **recomposition** et transformation (dans le rêve), intentionnelle ou non ; son objet reste celui de la sensibilité : des qualités sensibles.

    ! La `phantasia` n'est pas seulement l'imagination créatrice : c'est toute présence d'une image sensible en l'absence de son objet.
