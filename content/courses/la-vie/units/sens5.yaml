- id: sens5-l9
  title: "La sensation, principe architectonique"
  notes: |
    Un texte explicite le rôle fondamental de la sensibilité dans la vie psychique : {teal}« Toutes [les facultés{/teal} communes à l'âme et au corps dont il est question dans les *Parva naturalia*] surviennent, {teal}pour les unes avec la sensation, pour les autres par la sensation{/teal}. Certaines sont précisément {teal}des affections de la sensation{/teal}, d'autres {teal}des dispositions de la sensation{/teal}, d'autres assurent {teal}sa protection et sa sauvegarde{/teal}, d'autres enfin provoquent {teal}sa destruction et sa privation »{/teal} (*De la sensation et des sensibles*, 1).

    {amber}La répartition est peu claire{/amber}, mais probablement :

    | Ce qui survient…     | Grec             | Exemples probables   |
    | *avec* la sensation  | `met'aisthèseôs` | plaisir et peine     |
    | *par* la sensation   | `di'aisthèseôs`  | appétit et mouvement |

    Les {violet}**affections**{/violet} (`pathai`) de la sensation sont le plaisir et la douleur, ou les émotions complexes qu'ils constituent ; ses {violet}**dispositions**{/violet} (`hexeis`), probablement les opérations de la `phantasia` (mémoire, rêve). {sky}Pierre-Marie Morel ({/sky}*Aristote, une philosophie de l'activité*, 2003) : « Ce que montre ici Aristote, c'est que {pink}l'animal n'est pas une addition de facultés et de parties{/pink}, mais {green}une unité à la fois organique et fonctionnelle{/green}, un système d'activités dans lequel la sensation joue le rôle de principe architectonique ou organisateur. »

    Conclusion : la sensibilité n'est pas seulement le {coral}**critère**{/coral} qui distingue l'animal de la plante ; elle est le {coral}**fondement**{/coral} de sa vie psychique complexe et sa manière de se rapporter au monde. D'où l'effort d'Aristote pour montrer qu'elle est {amber}**une** faculté malgré l'irréductibilité des cinq sens{/amber} : son unité n'est pas qu'analogique, car la {violet}**sensation commune**{/violet} les rend commensurables sans les réduire à un seul. Unité **organique**, elle est {green}le **principe architectonique** de la vie animale{/green}.

    ! La sensibilité n'est pas une faculté parmi d'autres : toutes les autres, sauf la nutrition, en dépendent d'une manière ou d'une autre.
