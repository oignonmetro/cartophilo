- id: sens5-l9
  title: "La sensation, principe architectonique"
  notes: |
    Un texte explicite le rôle fondamental de la sensibilité dans la vie psychique : « Toutes [les facultés communes à l'âme et au corps dont il est question dans les *Parva naturalia*] surviennent, pour les unes avec la sensation, pour les autres par la sensation. Certaines sont précisément des affections de la sensation, d'autres des dispositions de la sensation, d'autres assurent sa protection et sa sauvegarde, d'autres enfin provoquent sa destruction et sa privation » (*De la sensation et des sensibles*, 1).

    La répartition est peu claire, mais probablement :

    | Ce qui survient…     | Grec             | Exemples probables   |
    | *avec* la sensation  | `met'aisthèseôs` | plaisir et peine     |
    | *par* la sensation   | `di'aisthèseôs`  | appétit et mouvement |

    Les **affections** (`pathai`) de la sensation sont le plaisir et la douleur, ou les émotions complexes qu'ils constituent ; ses **dispositions** (`hexeis`), probablement les opérations de la `phantasia` (mémoire, rêve). Pierre-Marie Morel (*Aristote, une philosophie de l'activité*, 2003) : « Ce que montre ici Aristote, c'est que l'animal n'est pas une addition de facultés et de parties, mais une unité à la fois organique et fonctionnelle, un système d'activités dans lequel la sensation joue le rôle de principe architectonique ou organisateur. »

    Conclusion : la sensibilité n'est pas seulement le **critère** qui distingue l'animal de la plante ; elle est le **fondement** de sa vie psychique complexe et sa manière de se rapporter au monde. D'où l'effort d'Aristote pour montrer qu'elle est **une** faculté malgré l'irréductibilité des cinq sens : son unité n'est pas qu'analogique, car la **sensation commune** les rend commensurables sans les réduire à un seul. Unité **organique**, elle est le **principe architectonique** de la vie animale.

    ! La sensibilité n'est pas une faculté parmi d'autres : toutes les autres, sauf la nutrition, en dépendent d'une manière ou d'une autre.
  points:
