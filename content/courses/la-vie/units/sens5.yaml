- id: sens5-l4
  title: "Penser avec des images"
  notes: |
    L'intelligence n'est ni **exclusive** de la sensibilité, ni seulement analogue à elle : son exercice et son contenu doivent s'**incarner** dans un `phantasma`. « L'âme ne pense jamais sans `phantasma` » (*De l'âme*, III, 7). Non que l'objet de la pensée soit une image : la pensée a besoin d'un **support sensible**, fût-ce une image mentale. « La faculté intellective saisit les formes (`eidè`) immanentes aux `phantasmata` » : les intelligibles ne sont pas des images, mais ils ne sont pas donnés *sans* images.

    Solution nuancée entre deux approches :

    | Approche         | Thèse                                          | Représentants |
    | Sensualiste      | les idées se réduisent à des impressions       | l'empirisme de Hume ; dans l'Antiquité, Démocrite et les épicuriens |
    | Intellectualiste | la pensée est indépendante des données sensibles, qui peuvent seulement susciter l'interrogation | l'épistémologie de Platon ; sous une autre forme, la tradition cartésienne |

    Exemple : le **géomètre** ne s'interroge pas sur ce triangle-ci, tracé au tableau ou imaginé, mais sur les propriétés de tout triangle, sur ce que Platon appellerait le « triangle en soi », son **essence**. Mais il ne les pense pas sans l'image d'un triangle particulier.

    La science s'appuie ainsi sur la sensation sans s'y réduire : aucune sensation ne constitue un savoir, qui porte sur l'universel ; c'est ce qui distingue Aristote des **empirismes** anciens et modernes auxquels on veut trop souvent le ramener. Mais « si une sensation manquait, nécessairement un savoir scientifique manquerait aussi, et il nous serait impossible de l'acquérir » (*Seconds Analytiques*, I, 18, 81a38-39 ; Pellegrin traduit « perception ») : la sensibilité offre à la science ses possibilités de **figuration**. D'où la définition de l'homme comme « animal **rationnel** », vivant *sensible* doué de raison. La connaissance n'est ni réductible à la sensation, dont elle tire un matériau, ni un dépassement voué à s'en affranchir, comme dans le platonisme.

    ! « Ne jamais penser sans image » ne veut pas dire que penser, c'est imaginer.
