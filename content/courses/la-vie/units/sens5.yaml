- id: sens5-l5
  title: "Plaisir et peine"
  notes: |
    La sensibilité ouvre aussi à l'**appétit**, à la motricité et aux passions. « Mais on ne trouve, chez les plantes, que la faculté nutritive, tandis qu'ailleurs, celle-ci va de pair avec la faculté sensitive. Or, dans ces conditions, la faculté appétitive est également présente. L'appétit est, en effet, désir, ardeur et souhait. Or tous les animaux ont l'un des sens, le toucher ; et qui se trouve doué de sensation, est aussi accessible au plaisir et à la peine, à ce qui est agréable et douloureux ; et, dans ces conditions, il est également doué du désir, puisque ce dernier est l'appétit de l'agréable » (*De l'âme*, II, 3). La dérivation se fait en **deux temps**.

    D'abord, la sensibilité rend **immédiatement** accessible au plaisir et à la peine : la saveur « distingue entre le plaisant et le désagréable dans la nourriture ». Une plante gelée ne **souffre** pas du froid, parce qu'elle ne le **sent** pas ; un animal souffre du froid parce qu'il le sent. Telle sensation *est* plaisante ou douloureuse : sensation, plaisir et peine sont **contemporains**. Il y a pourtant une **postériorité logique** du plaisir et de la peine : certaines sensations ne sont ni plaisantes ni douloureuses, l'inverse n'est pas vrai.

    Parenthèse sur les **odeurs**, que traite le *De la sensation et des sensibles* (chapitre 5, 443a17-445a4) :

    | Odeurs plaisantes | Exemple | Pour qui |
    | par accident | celles de la nourriture | tout être doué d'odorat : elles signalent à distance nourriture et danger |
    | par soi | l'odeur d'une fleur | les seuls êtres humains |

    Aristote explique les secondes physiologiquement : l'odeur des plantes réglerait la température de notre cerveau. Explication peu satisfaisante : pourquoi seuls les humains auraient-ils ce besoin ?

    ! Plaisir et sensation sont contemporains, mais le plaisir suppose la sensation, non l'inverse.
