- id: sens5-l1
  title: "La phantasia"
  notes: |
    Toutes les facultés propres aux animaux, soit toutes sauf la **nutrition** (qui englobe reproduction et croissance), {green}dérivent de la sensibilité{/green} : l'intelligence, l'appétit (`orexis`), le mouvement. {amber}Geste philosophique **fort**{/amber} : des opérations tenues ailleurs pour les plus éminentes, la pensée ou le raisonnement, {coral}se trouvent fondées sur la sensation, sans lui être réductibles{/coral}.

    La première est la `phantasia`, souvent traduite {violet}« imagination » ou « représentation »{/violet} : la faculté de produire des `phantasmata`, des images sensibles, qui se distinguent de celles de la sensation par {coral}l'**absence** de leur objet{/coral}. {teal}« Les contenus de la `phantasia` sont{/teal}, en effet, {teal}comme des données du sens{/teal}, {teal}sauf qu'ils sont sans matière »{/teal} (*De l'âme*, III, 8). {yellow}Je sens une couleur quand je la vois sur un objet présent{/yellow} ; j'en ai un `phantasma` quand je m'en représente l'image, l'objet absent. En termes techniques : la `phantasia` est {amber}l'acte de la **seule** sensibilité{/amber}, sans celui du sensible, alors que la sensation est {amber}leur acte **commun**{/amber}.

    Elle englobe {yellow}le rêve et la remémoration{/yellow}, d'où l'embarras des traducteurs. Dans le *De l'âme*, seul III, 3 lui est consacré ; mais plusieurs *Parva naturalia* traitent d'opérations qui en relèvent : *Sur la mémoire et la réminiscence*, et les trois traités sur le sommeil et le rêve.

    Son activité dérive littéralement de la sensation : {teal}« la `phantasia` est le mouvement qui se produit sous l'effet de la sensation en acte »{/teal} (*De l'âme*, III, 3 ; même affirmation dans *Des rêves*, 1). Elle est d'abord {amber}**rétention**{/amber} des sensations en images mentales, puis {amber}**recomposition**{/amber} et transformation (dans le rêve), intentionnelle ou non ; son objet reste celui de la sensibilité : des qualités sensibles.

    ! La `phantasia` n'est pas seulement l'imagination créatrice : c'est toute présence d'une image sensible en l'absence de son objet.
