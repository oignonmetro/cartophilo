- id: sens5-l7
  title: "Le désir, principe du mouvement"
  notes: |
    Second temps de la dérivation : l'animal sensible au plaisir et à la douleur est « également doué du désir, puisque ce dernier est l'appétit de l'agréable ». La sensibilité intervient aussi à un niveau **médiat** : désirer suppose de se représenter de manière **prospective** le plaisir ou la peine à venir, donc la `phantasia`. L'appétitif repose ainsi sur la sensibilité de **deux façons** : il y trouve ses objets, et, médiatement, il passe par la `phantasia`.

    Or c'est l'appétitif, plus précisément l'**objet désiré**, qu'Aristote consacre comme **principe du mouvement** et des décisions de l'individu : c'est la thèse centrale de *De l'âme*, III, 9 et 10 (voir l'unité « Désir, mouvement et action »). Thèse **polémique** : elle s'oppose à la conception **intellectualiste** de la volonté du socratisme, qui place le principe de l'action dans le **jugement** (une chose est désirée parce qu'on la juge bonne : voir le *Ménon*, 77b-78a). Pour Aristote, l'intellect et la faculté opinative sont à eux seuls **impuissants** à faire désirer ; le désir en est indépendant, car l'agréable et le douloureux résident dans la sensation. L'intelligence peut l'informer, l'influencer, non en être la source.

    D'où la justification psychologique de toute l'**éthique** d'Aristote : éduquer à la vertu n'est pas seulement transmettre une connaissance du bien (comme chez Socrate et, dans une certaine mesure, chez Platon, dont Marion Pollaert nuance l'intellectualisme), mais d'abord **former le caractère** par les plaisirs et les peines, véritables principes de l'action (*Éthique à Nicomaque*, II, 1). Connaissance et intellect n'agissent sur le caractère que par le plaisant et le douloureux. Le mouvement animal est assis sur la sensibilité aux plaisirs et aux peines, non sur les facultés « supérieures ».

    ! Aristote ne nie pas le rôle de l'intellect dans l'action : il nie qu'il puisse, seul, faire désirer.
