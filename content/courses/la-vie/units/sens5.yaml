- id: sens5-l2
  title: "La phantasia, faculté de transition"
  notes: |
    Traduite par « imagination », la `phantasia` n'est pas aussi **suspecte** pour Aristote que ce terme en général. Beaucoup ont violemment critiqué l'imagination, Platon au premier chef, qui dévalorise **ontologiquement et épistémologiquement** les `phantasmata`. La `phantasia` aristotélicienne peut être fausse, mais elle est d'abord la faculté qui assure la **transition** entre la sensibilité et l'intelligence : elle fournit à la pensée son substrat sensible. Comme pour la sensibilité, l'approche est psychologique avant d'être critique.

    Aristote la rapproche donc étroitement de la sensibilité, jusqu'à en faire une sorte de sensation : « La <faculté> imaginative et la <faculté> sensible sont la même chose, bien que, dans leur essence, la <faculté> imaginative et la <faculté> sensible diffèrent l'une de l'autre » (*Des rêves*, 1). Certains commentateurs, comme Pierre-Marie **Morel**, font ainsi de la `phantasia` une espèce de sensation et du `phantasma` une sensation à part entière ; elle opère d'ailleurs au niveau de l'organe de la sensation commune, le **cœur**.

    Mais les deux facultés « diffèrent dans leur essence » (`to d'einai heteron`) : deux processus distincts sur une même matière, les qualités sensibles. La sensation est acte commun avec un sensible extérieur ; la `phantasia` opère seule. Certains animaux ont la sensibilité sans la `phantasia`. Et d'autres passages en font une dimension de l'**intellect**, en raison de l'absence de son objet (« si l'on veut bien poser que la `phantasia` est comme une sorte d'intellection », *De l'âme*, III, 10) : d'où l'idée qu'il y aurait **deux** `phantasiai`.

    Plus prudemment : la `phantasia` est une **faculté de transition**, qui prolonge la sensibilité et que prolonge l'intellection. L'âme animale n'est pas une somme de facultés closes, mais une totalité **organique**, un *continuum* d'activités.

    ! Rapprocher `phantasia` et sensation n'est pas les confondre : leur « être » diffère.
