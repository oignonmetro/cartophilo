- id: sep-mort3-l6
  title: "Pourquoi préférer vivre plus tard plutôt que naître plus tôt"
  notes: |-
    **L'autre usage de la symétrie.** Nous voulons mourir plus tard pour allonger notre vie ; mais nous ne voulons pas être nés plus tôt, ce qui l'allongerait aussi : {red}n'est-ce pas irrationnel ?{/red} Nous tenons davantage à la **continuation** de notre vie qu'à son **extension** ({yellow}attention en frottant la lampe : si vous souhaitez une vie plus longue, le génie pourrait vous vieillir{/yellow}).

    **Ce n'est pas irrationnel.** Le monde ne permet d'allonger la vie que vers l'avenir. Si l'on ne visait que la **quantité** de vie, ou la quantité de plaisir sans souci de sa distribution, la préférence serait irrationnelle ; mais nous ne sommes pas des {pink}gourmets de la vie ou du plaisir{/pink}.
    - **Parfit** : nous avons un {violet}biais en faveur de l'avenir{/violet} pour tous les biens : nous les voulons devant nous, et les maux derrière. Il explique pourquoi la mort, qui nous prive de biens futurs, nous afflige plus que de n'avoir pas toujours existé. Ce biais est **regrettable**, pense Parfit : l'insensibilité du gourmet nous rendrait moins sensibles à la mort, consolés par les plaisirs accumulés.
    - Nos projets : nous avons aussi des **buts actifs, tournés vers l'avenir**, centraux pour notre identité. {green}__On ne peut former et poursuivre de projets pour son passé__{/green} : seule l'extension vers l'avenir rend possibles nos projets actuels. Comme le souligne Frances **Kamm**, nous ne voulons pas que notre vie soit tout entière derrière nous.
    - Pourtant le passé n'est pas indifférent : la plupart, devant mourir demain, préféreraient avoir mille ans de gloire derrière eux que cinquante. {coral}Nous voulons avoir bien vécu.{/coral}

    **La réponse de Nagel et ses limites.** Il est raisonnable de ne pas vouloir être né plus tôt, dit Nagel, parce qu'il est **métaphysiquement impossible** qu'une personne commence d'exister beaucoup plus tôt, alors qu'elle aurait pu vivre plus longtemps. Mais cela dépend d'hypothèses discutables sur l'origine : {yellow}un zygote longtemps congelé aurait pu l'être brièvement{/yellow}, et la personne serait née bien plus tôt. Frederik **Kaufman** (2016) répond qu'un **organisme** humain aurait pu exister plus tôt, mais non une **personne** : {teal}« Les personnes (bien comprises) ne peuvent exister plus tôt qu'elles n'existent »{/teal}, si l'identité personnelle tient à la continuité psychologique, et que le moment où une conscience émerge est essentiel à la personne.
