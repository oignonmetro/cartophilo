lessons:
- id: sep-mort3-l1
  title: "Le problème du moment ; pendant ou avant la mort"
  notes: |-
    **Si l'on ne peut dire quand une chose nous rend plus mal lotis, on doutera qu'elle nous ait nui.** On peut aller jusqu'à poser que ce qui ne nous rend jamais plus mal lotis qu'autrement n'est pas mauvais pour nous : c'est la {violet}présomption épicurienne{/violet}. Elle impose au défenseur de la thèse du préjudice de répondre à la {violet}question du moment{/violet} : {red}si la mort est mauvaise pour nous, à quel moment nous rend-elle plus mal lotis ?{/red} Cinq réponses.

    **Le {violet}concurrentisme{/violet} : pendant que l'on meurt.** Ce qui est mauvais en soi l'est pendant qu'on l'a ; une mort douloureuse nous nuit donc pendant que mourir est douloureux. Pour la mort sans douleur, Julian **Lamont** (1998) dit que le préjudice de privation survient quand un {violet}événement garant{/violet} assure qu'on ne gardera pas ou n'obtiendra pas un bien autrement accessible ; la mort en est un, et le préjudice lui est simultané. {red}Mais c'est douteux{/red} : {yellow}attraper la grippe{/yellow} est mauvais, et pourtant cela ne nous rend pas plus mal lotis au moment de l'infection, mais plus tard, quand nous sommes malades.

    **Le {violet}priorisme{/violet} : avant la mort.** Si l'on est préférentialiste, une chose nous nuit au moment où un de nos désirs est contrarié. Or, comme le suggère George **Pitcher** (1984), un désir que j'ai **maintenant** peut être contrarié par ma mort **dans quelques mois** : c'est alors maintenant que ma mort me rend plus mal loti. {coral}La mort peut nous nuire rétroactivement.{/coral}
  points:
