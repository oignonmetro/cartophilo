- id: sep-mort3-l4
  title: "La privation sans dommage"
  notes: |-
    **Le comparativisme a des exceptions apparentes.** Il dit qu'une chose me nuit quand ma vie aurait été meilleure sans elle. Or {red}je ne subis apparemment aucun tort de ne pas être brillant, riche ou beau{/red}, alors que ma vie serait bien meilleure si je l'étais. Ou : {yellow}vous avez le billet gagnant du loto et décidez de me le donner ; avant de me le remettre, vous mourez d'une attaque. Votre mort m'a-t-elle nui ?{/yellow}

    **L'usage épicurien de ces cas.** Des choses auraient une énorme valeur négative pour moi sans me nuire ; de même, la privation de biens par la mort serait **sans dommage** : ma vie écourtée est pire, mais cette différence comparative ne montre pas que je subis un tort.

    **Quand le critère comparatif marche-t-il ?** Il marche bien pour les **pertes** (perdre ses bras) et certains **manques** (ne pas voir) ; il est inquiétant pour d'autres manques (manquer de génie). Pourquoi ? Trois pistes :
    - **Nagel** : fixer {teal}« des limites à la possibilité d'une possibilité{/teal} pour que sa non-réalisation soit {teal}un malheur »{/teal}, voire ne pas compter comme un malheur {teal}« une limitation, comme la mortalité, qui est normale pour l'espèce »{/teal} ;
    - **Draper** (1999) : la privation est sans dommage quand le bien manqué était **hautement improbable** ;
    - l'**importance** des biens : être privé d'un bien ne nuirait que s'il est important de l'avoir.

    ! Ces pistes laissent une question : si, contre toute attente, quelqu'un est un génie, le lui retirer serait-il sans dommage ?
  points:
  - id: sep-mort3-l4-p1
    sentence: "Exception apparente au comparativisme : je ne subis apparemment aucun tort de ne pas être brillant, riche ou ___, alors que ma vie serait meilleure si je l'étais."
    answer: "beau"
    alt: []
  - id: sep-mort3-l4-p2
    sentence: "Vous mourez avant de me remettre le billet gagnant du ___ : votre mort m'a-t-elle nui ? Le comparativisme semble dire que oui."
    answer: "loto"
    alt: []
  - id: sep-mort3-l4-p3
    sentence: "Les épicuriens peuvent soutenir que la privation de biens par la mort est sans ___ : ma vie écourtée est pire, mais je ne subis pas de tort."
