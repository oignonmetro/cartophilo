- id: sep-mort3-l2
  title: "Après la mort : le subséquentisme et ses deux problèmes"
  notes: |-
    **Le {violet}subséquentisme{/violet} : après la mort.** Être anesthésié au temps *t* nous nuit **après** *t*, au moment où nous aurions joui des biens perdus. De même, la mort nous rendrait plus mal lotis **après** que nous sommes morts, pendant le temps où nous aurions joui des biens dont elle nous prive (Feit 2002, Bradley 2004, 2009). Mais il faudrait donner un sens au niveau de bien-être de qui est mort.

    **Premier problème : le problème du sujet.** Si l'on est terminateur, un sujet peut-il avoir une propriété quand il n'existe pas ? C'est l'idée d'Épicure : {teal}« quand nous sommes, la mort n'est pas, et quand la mort est là, nous ne sommes pas »{/teal}.
    - Devenir anti-terminateur ne suffit pas : on peut mourir sans laisser de cadavre, ou le cadavre peut pourrir bien avant le moment où l'on aurait eu de la joie.
    - Plus prometteur, l'{violet}éternalisme métaphysique{/violet} (Nagel, Silverstein) : les objets passés et futurs sont ontologiquement sur le même pied que les présents. On peut alors encore se référer à Socrate, et lui attribuer la propriété *n'a pas de joie*.

    **Second problème : un mort n'a pas de niveau de bien-être.** On peut attribuer *n'a pas de joie* à un cadavre ; mais {red}__cela n'a pas de sens de demander comment se porte une personne pendant qu'elle est cadavre__{/red}. Ce qui peut se porter bien ou mal peut avoir un bien-être nul (capable de biens et de maux, sans en recevoir) ; {yellow}un sac de béton{/yellow} n'a aucun niveau de bien-être, pas même nul. Il en va de même du cadavre, et de nous quand nous ne sommes plus en vie.
  points:
  - id: sep-mort3-l2-p1
    sentence: "Le ___ tient que la mort nous rend plus mal lotis après notre mort, pendant le temps où nous aurions joui des biens perdus (Feit, Bradley)."
    answer: "subséquentisme"
    alt: ["subsequentisme"]
  - id: sep-mort3-l2-p2
    sentence: "Premier problème du subséquentisme, le problème du ___ : un sujet peut-il avoir une propriété quand il n'existe pas ?"
    answer: "sujet"
    alt: []
  - id: sep-mort3-l2-p3
    sentence: "Devenir anti-terminateur ne résout pas le problème du sujet, car on peut mourir sans laisser de ___, ou il peut pourrir avant le moment considéré."
    answer: "cadavre"
    alt: []
  - id: sep-mort3-l2-p4
    sentence: "Selon l'___ métaphysique (Nagel, Silverstein), les objets passés et futurs sont ontologiquement sur le même pied que les présents."
    answer: "éternalisme"
