    alt: []
- id: sep-mort3-l5
  title: "Lucrèce : le miroir du temps d'avant"
  notes: |-
    **Lucrèce, disciple d'Épicure, prolonge l'argument par une expérience de pensée** : {teal}« {/teal}Regarde en arrière le temps […] {teal}d'avant notre naissance{/teal}. La Nature nous tend ainsi {teal}le miroir de notre avenir après la mort{/teal}. Est-ce si sinistre, si sombre ?{teal} »{/teal} (*De rerum natura*, III).

    **L'{violet}argument de symétrie{/violet}.** Il est irrationnel de s'opposer à la mort, si elle met fin à notre existence : nous ne trouvons pas fâcheux de n'avoir pas existé avant de vivre, et notre non-existence d'avant la vie et celle d'après la mort sont **symétriques**, semblables en tout ce qui compte. Toute objection à l'une vaudrait contre l'autre.

    **Première lecture : la mort n'est pas mauvaise.** Ce qu'on reprocherait à la mort serait la non-existence qui suit ; or nous ne reprochons rien à celle d'avant la naissance. {red}L'argument est alors faible{/red} : il porte contre qui croit que la mort nous met dans un état horrible ; mais notre plainte est plutôt que {green}la mort nous empêche d'avoir davantage de bonne vie{/green}. Le miroir de la mort est la **naissance**, qui nous affecte tout autrement : {coral}la naissance rend la vie possible, elle commence une bonne chose ; la mort rend toute vie ultérieure impossible, elle met fin à une bonne chose{/coral}.

    **Seconde lecture : être mort n'est pas mauvais.** Il y a là un noyau de vérité : si des machines pouvaient nous démonter puis nous reconstruire après un temps de non-existence, ces intervalles ne nous affligeraient guère. Mais {red}une non-existence temporaire n'est pas une non-existence définitive{/red}.
  points:
