- id: sep-mort3-l3
  title: "À aucun moment déterminé, ou hors du temps"
  notes: |-
    **L'{violet}indéfinitisme{/violet}.** Nagel et Silverstein suggèrent que la mort nous nuit, mais à aucun moment déterminé. Lamont objecte que certains événements auraient alors lieu sans avoir lieu à aucun moment. William **Grey** répond que Lamont se méprend : le préjudice survient pendant une période **aux bords flous**, comme {yellow}le début de la calvitie{/yellow}. Mais alors l'indéfinitisme n'est vrai que si l'une des trois autres réponses l'est (Grey choisit le subséquentisme), car même une période floue est avant, pendant ou après la mort.

    **L'{violet}atemporalisme{/violet}.** Supposons qu'il n'y ait aucun moment où une mort privative nous rende plus mal lotis. Avec la présomption épicurienne, il faudrait conclure qu'elle ne nous nuit pas. Mais {green}__on peut rejeter la présomption épicurienne__{/green} : être privé de biens par la mort est mauvais pour nous si c'est globalement mauvais *simpliciter*, et cela n'exige aucun moment où la mort nous rend plus mal lotis.

    **Mais *quand* est-ce vrai ?** La question se pose, mais ce n'est plus la question du moment. La réponse : si elle est vraie, la proposition que la mort est globalement mauvaise pour nous est une {violet}vérité éternelle{/violet}, intemporelle (Feldman 1991), vraie à tout moment si elle l'est, comme {yellow}« 6 est plus petit que 7 »{/yellow}. Elle revient à dire que le bien-être de toute une vie réel de Sam est plus bas que celui qu'il aurait eu sans mourir. Jens **Johansson** (2013) a nommé atemporalisme la thèse que {teal}« la mort est mauvaise pour le défunt, mais à aucun moment »{/teal}.

    | Position | Quand la mort nuit-elle ? |
    | concurrentisme | pendant que l'on meurt |
    | priorisme | avant la mort |
    | subséquentisme | après la mort |
    | indéfinitisme | à un moment aux bords flous |
    | atemporalisme | à aucun moment |
