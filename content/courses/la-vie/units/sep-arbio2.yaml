- id: sep-arbio2-l2
  title: "Pourquoi la biologie demande un livre à part"
  notes: |-
    **Les *Seconds Analytiques* veulent valoir pour toute science, mais ne disent pas comment les appliquer.** Leurs exemples sont surtout mathématiques ; or les animaux ne ressemblent pas aux figures. Cinq traits exigent des précisions, qui sont les sujets mêmes de *Parties des animaux*, I :
    - ce sont des {violet}unités complexes de matière (corps) et de forme (âme){/violet} ;
    - ils naissent par un {violet}processus complexe de développement{/violet} ;
    - {violet}la fin{/violet} de ce développement lui est antérieure, causalement et par la définition ;
    - y opère une {violet}nécessité d'un genre propre{/violet}, la nécessité conditionnelle ;
    - il leur faut une {violet}méthode de division à plusieurs différences{/violet}.

    **Le problème d'ouverture : à quel niveau étudier ?** Faut-il définir chaque vivant à part, {teal}« la nature de l'être humain, du lion, du bœuf »{/teal}, ou poser d'abord {teal}« les attributs communs à tous les animaux »{/teal} (639a16-19) ? Le sommeil, la respiration, la croissance, la mort appartiennent {teal}« à la fois aux chevaux, aux chiens et aux êtres humains »{/teal} : en rester à ces groupes, c'est **se répéter**, {teal}« on sera contraint de dire plusieurs fois les mêmes choses »{/teal} (639a25-28).

    **Une distinction parmi les attributs communs.** Certains appartiennent à des animaux de forme différente {teal}« sans qu'ils aient entre eux aucune différence »{/teal} ; d'autres {teal}« relèvent de la même appellation, mais présentent une différence de forme{/teal}, par exemple {teal}le déplacement des animaux{/teal}, car il semble bien qu'il n'est pas formellement unique. Il y a, en effet, une différence entre le vol, la nage, la marche et la reptation.{teal} »{/teal} (639a30-b3) Le bon niveau ne sera donc pas le même pour tout : il ne suffit pas de dire « tous les animaux se déplacent ». D'où la question : {teal}« {/teal}s'il convient d'étudier les choses {teal}d'abord en ce qu'elles ont en commun par genre{/teal} puis, plus tard, les caractères propres, ou {teal}tout de suite les cas particuliers »{/teal} (639b3-5). Aristote répond en I, 4, après avoir introduit une nouvelle idée de la division.
