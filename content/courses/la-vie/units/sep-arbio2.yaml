- id: sep-arbio2-l3
  title: "La fin, la forme et la nécessité conditionnelle"
  notes: |-
    **Le chapitre 1 de *Parties des animaux*, I, établit trois priorités, qui n'en font qu'une.** Il les construit en exposant les erreurs des prédécesseurs, contre {violet}Empédocle et Démocrite{/violet}, dans l'esprit de Socrate.

    | Ce qui est premier | Sur quoi |
    | la cause finale | la cause motrice |
    | la forme (l'âme) | la matière (le corps) |
    | la nécessité conditionnelle | la nécessité simple |

    **Comment elles s'enchaînent.** La forme d'un vivant est sa capacité d'accomplir ses fonctions, nutrition, perception, locomotion : c'est l'âme. {green}__La forme est donc causalement antérieure à la matière, parce qu'elle est la fin en vue de laquelle les parties de l'animal viennent à être et existent.__{/green}

    **La nécessité conditionnelle.** Le « par nécessité » ne se ramène à aucune des deux sortes connues. Il y a une troisième sorte, propre aux êtres soumis à la génération :

    {teal}« {/teal}C'est une nécessité en quelque sorte "{teal}hypothétique{/teal}", car de même que, {teal}puisqu'il faut fendre avec la hache, il est nécessaire qu'elle soit dure{/teal}, et que si elle doit être dure, elle doit être faite d'airain ou de fer, de la même manière aussi, puisque {teal}le corps est un instrument »{/teal} il doit être de telle sorte (I, 1, 642a9-13).

    **Le sens de la flèche s'inverse.** La dureté du fer ne produit pas la hache ; c'est **si** l'on doit fendre, **alors** il faut du dur. {coral}__Les parties et les processus ne rendent pas nécessaire le résultat ; c'est le résultat qui rend nécessaire que le développement produise les parties dont l'organisme a besoin pour vivre.__{/coral}

    ! La nourriture est nécessaire « parce qu'il n'est pas possible d'exister sans elle » (642a8-9) : il ne s'ensuit pas qu'on doive être nourri, seulement que, **si** l'on doit vivre, il le faut.
