- id: sep-arbio2-l8
  title: "Le corps, instrument de l'âme"
  notes: |-
    **La fin du livre revient à la méthode.** Il applique aux activités ce que le chapitre 4 disait des parties, et unifie le tout dans une thèse : {green}__le corps entier est un instrument unique complexe, au service d'une activité unique complexe, vivre.__{/green}

    {teal}« {/teal}Mais puisque {teal}tout instrument est en vue de quelque chose{/teal} et que chacune des parties du corps est en vue de quelque chose, que ce en vue de quoi elles sont est une certaine action, il est manifeste aussi que {teal}le corps tout entier a été constitué en vue d'une certaine action totale. »{/teal} (I, 5, 645b14-17)

    **L'image de la scie.** {yellow}« Le sciage, en effet, ne se fait pas en vue de la scie, mais la scie en vue du sciage »{/yellow} (645b17-18). Il en résulte : {teal}« {/teal}De sorte aussi que {teal}le corps est en vue de l'âme{/teal}, et {teal}les parties en vue des fonctions{/teal} pour lesquelles chacune d'elles existe par nature.{teal} »{/teal} (645b19-20)

    **Les différences des parties s'expliquent par celles des actions.** Il faut donc parler d'abord des actions {teal}« communes à tous les animaux{/teal}, celles qui appartiennent {teal}à une famille{/teal} et celles qui appartiennent {teal}à une forme »{/teal} (645b21-22) : {coral}une bonne division des activités est une division des causes des parties{/coral}. Et {sky}les relations entre activités forment une hiérarchie{/sky} : si une action est en vue d'une autre, la partie qui l'accomplit l'est aussi (645b28-33). On retrouvera cela sur le poumon et sur le cou.

    **Bilan.** Le livre I donne une philosophie systématique de la biologie, qui fournit ce qui manque aux *Analytiques*. Reste la question : les traités la suivent-ils ?
