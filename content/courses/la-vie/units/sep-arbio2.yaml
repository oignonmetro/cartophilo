lessons:
- id: sep-arbio2-l1
  title: "D'abord les faits, ensuite les causes"
  notes: |-
    **Le livre I des *Parties des animaux* sert à appliquer à la biologie la philosophie générale de la science.** Il entend fixer des normes pour juger des recherches naturelles (639a15). Deux sortes d'indices le montrent : des déclarations de programme, et les sujets mêmes du livre.

    **Le programme de l'*Histoire des animaux*.** À la fin du chapitre 6 du livre I (le titre se traduirait mieux par *Enquêtes sur les animaux*) :

    {teal}« {/teal}Nous en parlerons plus tard exactement afin d'abord de {teal}saisir les attributs distinctifs et les caractères communs{/teal} à tous les animaux. Après cela, {teal}il faudra s'efforcer d'en trouver les causes{/teal}. C'est là, en effet, adopter {teal}la méthode conforme à la nature{/teal}, une fois qu'on est en possession du résultat de la recherche sur chacun. À partir de cela, en effet, devient manifeste à la fois ce sur quoi et ce à partir de quoi la démonstration doit se faire.{teal} »{/teal} (491a9-14)

    **Ce qu'il faut entendre.** L'enquête ({violet}`historia`{/violet}) établit les faits ; puis on cherche les causes. Cet ordre est naturel, parce que le but est une connaissance démonstrative : il faut distinguer **ce qu'il y a à expliquer** de **ce qui l'explique**. Aristote reprend ici les {violet}trois éléments de la démonstration{/violet} des *Seconds Analytiques* : {teal}« ce à propos de quoi l'on prouve, ce que l'on prouve, ce à partir de quoi l'on prouve »{/teal} (I, 10, 76b21-22).

    **Le partage des traités.**

    | Traité | Question | Exemple |
    | *Histoire des animaux* | le fait (`hoti`) | tout animal à poumon a une trachée |
    | *Parties*, *Génération* | le pourquoi (`dioti`) | la cause de cette corrélation |

    **Les traités causaux le disent eux-mêmes.** {teal}« {/teal}Car {teal}le fait même que les choses se passent de la sorte{/teal} est clairement attesté par nos exposés d'histoire naturelle, mais ce qu'il faut maintenant examiner, c'est {teal}pourquoi il en va ainsi. »{/teal} (*Marche des animaux*, 1, 704b9-10) Et : {teal}« De quelles parties{/teal}, donc, et de combien, chaque animal est constitué, on l'a montré assez clairement dans les recherches sur les animaux, mais {teal}du fait de quelles causes{/teal} chacune possède tel caractère, il faut maintenant l'examiner{teal} »{/teal} (*Parties des animaux*, II, 1, 646a8-11).

    **Une question débattue.** La définition est-elle un but explicite de l'*Histoire des animaux*, ou une simple conséquence de la recherche des causes ? Et cherche-t-on à définir les genres d'animaux, ou seulement leurs attributs ? Les traités causaux affirment avoir dit ce qu'est une partie, mais {red}il faut beaucoup d'efforts pour y reconstituer des définitions de genres d'animaux{/red}.
