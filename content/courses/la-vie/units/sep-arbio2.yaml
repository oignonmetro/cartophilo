- id: sep-arbio2-l6
  title: "Le prix des êtres périssables"
  notes: |-
    **Le dernier chapitre du livre s'ouvre sur le passage le plus connu de la biologie d'Aristote** : un éloge de l'étude des animaux, même les plus humbles. Il contient un argument, sous la rhétorique.

    **Deux sortes de substances naturelles.** {teal}« {/teal}Parmi les substances constituées par nature, les unes, {teal}inengendrées et incorruptibles{/teal}, existent pour absolument toute l'éternité, tandis que les autres {teal}ont part à la génération et à la corruption. »{/teal} (I, 5, 644b22-24)

    **Chacune a son charme.** Des êtres éternels, nous savons fort peu de choses, faute d'évidences sensibles. Mais leur valeur fait de leur connaissance un plaisir plus grand : {yellow}« comme aussi le fait d'apercevoir n'importe quelle petite partie des êtres aimés est plus agréable que de voir avec précision beaucoup d'autres grandes choses »{/yellow} (644b33-35).

    **Mais la science va du côté des périssables.** {teal}« {/teal}Mais {teal}les choses périssables{/teal}, parce que nous avons sur elles une connaissance meilleure et plus importante, {teal}nous fournissent plus de science{/teal} ; de plus, du fait qu'elles sont {teal}plus proches de nous{/teal} et plus appropriées à notre nature, elles rétablissent un certain équilibre par rapport à la philosophie portant sur les choses divines.{teal} »{/teal} (645a1-4)

    {green}__Telle est la première conclusion : si le but est le savoir scientifique, c'est dans l'étude des animaux et des plantes qu'on a le plus de chances de l'atteindre.__{/green} Il suffit de s'y appliquer : {teal}« du fait que nous vivons avec eux{/teal} ; en effet, on peut saisir {teal}de nombreuses informations{/teal} sur chaque famille, si l'on veut bien s'y appliquer suffisamment{teal} »{/teal} (644b29-31).

    ! Ce n'est pas un rabaissement de l'astronomie ou de la philosophie première : Aristote leur reconnaît un plaisir supérieur, et ne dispute que du degré de science accessible.
