- id: sep-arbio2-l5
  title: "Le plus et le moins, et l'analogie"
  notes: |-
    **Reste à dire ce qui fait d'« oiseau » ou de « poisson » un seul genre.** La discussion de la division le présupposait ; le chapitre 4 s'en occupe. Ce sont, dit Aristote, des familles {teal}« {/teal}qui ont à la fois {teal}une nature unique commune{/teal} et, à l'intérieur de la famille, {teal}des formes qui ne sont pas trop éloignées »{/teal} (644b2-4).

    **Le critère.** Avant toute explication scientifique de cette nature commune, on peut saisir que tous les oiseaux en ont une, par leurs nombreuses différences qui varient **par le plus et le moins** :

    {teal}« {/teal}Absolument toutes les familles, de fait, qui {teal}diffèrent entre elles par le degré{/teal}, c'est-à-dire par le plus et le moins, ont été réunies en {teal}un genre unique{/teal}, toutes celles qui sont {teal}dans un rapport d'analogie sont mises à part{/teal}. Je veux dire, par exemple, qu'un oiseau diffère d'un autre oiseau par le plus, autrement dit par un excédent (l'un a les ailes plus longues, un autre les a plus courtes), alors que les poissons diffèrent de l'oiseau par l'analogie ({teal}ce qui est plume chez l'un est écaille chez l'autre{/teal}).{teal} »{/teal} (I, 4, 644a16-22)

    | Différence | Où elle joue | Exemple |
    | par le plus et le moins | dans une même famille | ailes longues, ailes courtes |
    | par analogie | entre deux familles | plume et écaille, os et arête |

    **Pourquoi ce critère compte.** Il ne repose ni sur l'utilité ni sur l'aspect d'ensemble, il permet de **mesurer** la ressemblance : on passe d'une aile à une autre par des degrés, alors qu'on ne passe pas d'une plume à une écaille, qui ne sont les mêmes que par leur fonction. {coral}C'est sur ce thème que s'ouvre l'*Histoire des animaux*{/coral} (I, 1, 486a5-487a13), qui l'étend aux activités, aux modes de vie et aux caractères : il s'agit de savoir le fait, non le pourquoi.

    **La difficulté de méthode et sa solution.** Comme les formes dernières sont les substances, le mieux serait d'étudier chacune à part, mais on se répéterait. Aristote tranche : {teal}« traiter en commun de certains animaux selon leurs familles »{/teal}, et étudier individuellement {teal}« par exemple l'humain »{/teal}, qui ne se range dans aucune famille (644b1-7).

    ! La division ne suppose pas de faire reposer ces familles sur des noms : Aristote part des noms que « les gens » ont donnés, et les fait valoir, ou non, par ce critère.
