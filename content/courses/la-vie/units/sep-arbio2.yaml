- id: sep-arbio2-l7
  title: "« Là aussi il y a des dieux »"
  notes: |-
    **Reste le dégoût : que faire des animaux qui ne sont pas agréables à percevoir ?** Aristote répond par trois arguments.

    **L'argument de l'image.** {teal}« {/teal}Il serait, en effet, déraisonnable et étrange que, {teal}prenant plaisir à étudier les images de ces êtres{/teal} (parce que nous étudions en même temps l'art qui les fait, par exemple le dessin ou la sculpture), {teal}nous n'aimions pas mieux l'étude de ceux qui sont constitués par nature{/teal}, du moins quand nous pouvons en apercevoir les causes.{teal} »{/teal} (645a11-15) On admire un rat peint pour l'art du peintre ; à plus forte raison le vrai rat, si l'on voit ce qui l'a fait. Car {teal}« la nature artiste{/teal} procure de la même manière {teal}d'extraordinaires plaisirs{/teal} à ceux qui sont {teal}capables d'en connaître les causes{/teal}, c'est-à-dire qui sont philosophes par nature{teal} »{/teal} (645a9-10).

    **L'argument d'Héraclite.** {teal}« {/teal}C'est pourquoi il faut {teal}éviter un dégoût puéril{/teal} en considérant les animaux les plus ignobles. Car {teal}dans tous les êtres naturels il y a quelque chose de merveilleux »{/teal} (645a15-17). {yellow}Des étrangers veulent rencontrer Héraclite, et s'arrêtent en le voyant se chauffer près de son four{/yellow} : il les invite à entrer, {teal}« car "là aussi il y a des dieux" »{/teal}. La raison n'est pas pieuse, mais téléologique :

    {teal}« {/teal}Car dans les œuvres de la nature, {teal}ce n'est pas le hasard qui est présent{/teal}, mais le "{teal}en vue de quelque chose{/teal}", et on le trouve avant tout là. Et la fin en vue de laquelle un être a été constitué ou est venu à l'être {teal}tient la place du beau. »{/teal} (645a23-26)

    {coral}__La beauté d'un animal est donc celle de sa fonctionnalité.__{/coral}

    **L'argument de nous-mêmes.** {teal}« {/teal}Mais si quelqu'un a estimé que l'étude des animaux autres que l'homme manque de noblesse, {teal}il lui faut penser la même chose de lui-même. »{/teal} (645a26-27) Le sang, les chairs, les os, les vaisseaux de l'homme ne se considèrent pas sans aversion.

    **La seconde conclusion.** On ne disserte pas sur la matière en vue d'elle : {yellow}on parle d'{teal}« une maison et non les briques, le mortier et les poutres »{/teal}{/yellow}, et {teal}« {/teal}il faut que celui qui discute de la nature garde à l'esprit {teal}le composé et la substance totale »{/teal} (645a32-36). {green}Disséquer des vaisseaux est désagréable, mais c'est un moyen de comprendre ce en vue de quoi et l'âme.{/green}
