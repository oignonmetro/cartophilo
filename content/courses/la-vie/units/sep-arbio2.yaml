- id: sep-arbio2-l4
  title: "Contre la dichotomie"
  notes: |-
    **Les chapitres 2 et 3 tirent une théorie de la division d'une critique.** Celle de Platon et de certains de ses élèves : {teal}« Certains saisissent le particulier en divisant la famille en deux différences. »{/teal} (I, 2, 642b5) Aristote vise {teal}« les tableaux de divisions »{/teal} (642b12), peut-être ceux des derniers dialogues de Platon, peut-être des œuvres perdues de l'Académie.

    **La méthode critiquée combine deux techniques.** Elles rassemblent ce qui diffère et séparent ce qui se ressemble.
    - La {red}dichotomie{/red} divise en deux alternatives exhaustives, dont l'une est souvent la simple privation de l'autre (ailé, aptère).
    - La {red}division par des caractères non essentiels{/red} divise une classe par une différence qui lui est étrangère.

    {teal}« {/teal}Je veux dire, par exemple, ce qui arrive à ceux qui divisent en aptère et ailé et l'ailé en apprivoisé et sauvage, ou en blanc et noir. Car {teal}ni l'apprivoisé ni le blanc n'est une différence de l'ailé{/teal}, mais chacun est l'origine d'une autre division et n'est ici que {teal}par accident. »{/teal} (I, 3, 643b19-22)

    **Le dommage est concret.** La dichotomie démembre les familles : {teal}« {/teal}il convient de {teal}ne pas démembrer chaque famille{/teal}, par exemple en mettant des oiseaux dans une division et d'autres dans une autre{teal} »{/teal} (I, 2, 642b10-11). Le nom « oiseau » {teal}« se fonde sur telle ressemblance »{/teal} : diviser selon ce qui vit sur l'eau ou sur terre le déchire.

    **La méthode positive.** Diviser chaque différence par ses formes plus déterminées (les ailes en formes d'aile, les becs en formes de bec), et le faire **à la fois sur toutes les différences corrélées** à ce niveau :

    {teal}« {/teal}Il faut, au contraire, s'efforcer de {teal}saisir les animaux selon leur famille{/teal}, en suivant l'exemple de la majorité des gens qui distinguent les familles "oiseau" et "poisson". Et chacune a été définie {teal}par beaucoup de différences et non par dichotomie. »{/teal} (I, 3, 643b10-12)

    **Ce que cela donne, et ne donne pas.** Si tout oiseau a bec, plumes, ailes et deux pattes, on divise sur tout cela. {coral}On n'obtient pas de savoir démonstratif, mais les traits corrélés au bon niveau, c'est-à-dire ce sur quoi la démonstration doit porter.{/coral}
