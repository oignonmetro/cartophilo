# Cours sur la biologie d'Aristote (voir content/philosophie.md), tiré de
# l'article « Aristotle's Biology » de James Lennox, Stanford Encyclopedia of
# Philosophy (première publication 2006, révision substantielle 2026) :
# introduction, sections 1, 2 et 3. Citations d'Aristote dans les Œuvres
# complètes (Flammarion), du Ménon dans la traduction fournie par l'utilisateur.
# Citation d'Owen traduite de l'anglais. La chute des feuilles (Seconds
# Analytiques, II, 16-17, 98a35-b24) est résumée d'après l'article, sans
# citation : seul 99a21-23 a été fourni. La soustraction des attributs
# (Seconds Analytiques, I, 5) est un ajout de l'utilisateur à l'article, qui a
# aussi retiré la leçon sur l'état des sources : ne pas la rétablir.
#
# L'article écrit « the eventh successor » pour Andronicos : coquille écartée,
# son rang n'est pas donné ici.

