- id: sep-arbio1-l3
  title: "Le but de la science : les Seconds Analytiques"
  notes: |-
    **Pour comprendre la biologie d'Aristote, il faut la replacer dans sa philosophie de la science.** Comment passer de l'{pink}expérience quotidienne, superficielle et désordonnée{/pink}, à un {green}savoir scientifique organisé{/green} ? Il faut d'abord une idée du but : c'est ce que donnent les *Premiers* et les *Seconds Analytiques*.

    **Le but : un système hiérarchisé.** La {violet}science{/violet} est un {amber}système de concepts et de propositions ordonnés{/amber}, qui repose en dernier lieu sur la {amber}connaissance de la nature essentielle de ses objets{/amber} et d'autres {amber}premiers principes nécessaires{/amber}. Ces {coral}définitions{/coral} et ces {coral}principes{/coral} fondent l'{coral}explication causale{/coral} de toutes les autres vérités universelles du domaine, et celles-ci attribuent à un sujet des propriétés qui lui appartiennent {violet}par soi{/violet}, en vertu de sa nature.

    *Seconds Analytiques*, I, 5 : **qu'est-ce qu'une véritable démonstration scientifique universelle ?** Pour Aristote, une véritable explication scientifique (`apodeixis`) doit lier un prédicat à son sujet au **niveau de généralité exact où le prédicat et le sujet sont coextensifs.**

    **L'exemple du triangle.** Aristote explique comment isoler le sujet auquel la propriété appartient « à titre premier » (`prōton`). Il propose de procéder par {amber}**élimination ou soustraction des attributs**{/amber}. Prenons un {yellow}__triangle isocèle en bronze__{/yellow} :

    - Si l'on enclenche la soustraction en retirant le fait qu'il soit {yellow}**en bronze**{/yellow}, __la propriété d'avoir ses angles égaux à 180° reste vraie__. La propriété ne lui appartient donc pas *en tant que bronze*.
    - Si l'on retire le fait qu'il soit {yellow}**isocèle**{/yellow}, __la propriété reste encore vraie__ pour les autres triangles. La propriété ne lui appartient donc pas *en tant qu'isocèle*.
    - Mais si l'on retire le fait d'être un {yellow}triangle{/yellow} (pour ne garder que « figure » ou « périmètre »), __la propriété s'effondre__ (un quadrilatère vaut 360°, etc.). Le {violet}terme premier et adéquat{/violet} est donc le triangle. C'est à lui que la {coral}démonstration{/coral} s'applique {coral}universellement{/coral}.

    Ce principe méthodologique est central dans toute la philosophie aristotélicienne et on le retrouve en biologie, où Aristote refuse d'expliquer une __fonction animale__ (comme la respiration) espèce par espèce {coral}**s'il existe un genre plus large auquel cette fonction appartient primitivement**{/coral}.
