- id: sep-arbio1-l5
  title: "Le moyen terme est la cause"
  notes: |-
    **Les deux paires de questions se révèlent n'en former qu'une, grâce au {violet}moyen terme{/violet}** : le terme commun aux deux prémisses d'un syllogisme.

    {teal}« {/teal}Il s'ensuit donc que {teal}dans toutes les recherches{/teal} on cherche soit {teal}s'il y a un moyen terme{/teal}, soit {teal}quel est le moyen terme{/teal}. Car le moyen terme est {teal}la cause{/teal}, et dans tous les cas c'est celle-ci que l'on recherche.{teal} »{/teal} (II, 2, 90a5-7)

    **Pourquoi ?** Dans tout {violet}syllogisme valide{/violet}, le {amber}moyen terme garantit la conclusion{/amber}. Dans une explication scientifique, il doit en plus dire **la cause du fait** : ce qui relie le sujet à la propriété. Savoir la cause de quelque chose et savoir ce que c'est deviennent alors un seul savoir.

    **L'exemple du tonnerre :** {teal}« {/teal}il y a, en effet, {teal}une différence entre dire __pourquoi__ il tonne{/teal} et {teal}__ce qu'est__ le tonnerre{/teal} ; car on dira dans le premier cas {teal}"parce que le feu s'éteint dans les nuages"{/teal}, et à la question "qu'est-ce que le tonnerre ?" on répondra {teal}"le bruit d'un feu qui s'éteint dans les nuages"{/teal} ; si bien que __la même formule est énoncée de manière différente__, c'est-à-dire que dans un cas on a une {teal}démonstration continue{/teal}, dans l'autre {teal}une définition. »{/teal} (II, 10, 94a3-7)

    {coral}__Une même formule, deux dispositions : une démonstration quand elle dit *pourquoi*, une définition quand elle dit *ce que c'est*.__{/coral} Le chapitre 2 donne une autre illustration, l'éclipse : {teal}« {/teal}Qu'est-ce qu'une éclipse ? {teal}La privation pour la Lune de sa lumière{/teal} du fait de {teal}l'interposition de la Terre. »{/teal} (90a15-16) D'où la formule générale : {teal}« le "ce que c'est" et le "du fait de quoi c'est" c'est la même chose »{/teal}.

    ! Que l'extinction d'un feu soit fausse comme théorie du tonnerre n'importe pas ici : l'exemple illustre la structure d'une explication, non une vérité de physique.
  points:
