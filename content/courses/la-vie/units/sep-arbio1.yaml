- id: sep-arbio1-l2
  title: "Vie et transmission"
  notes: |-
    **Une vie entre l'Académie et le Lycée.**

    | Date | Événement |
    | 384 | naissance à Stagire |
    | 367 | arrivée à l'Académie de Platon |
    | 347 | mort de Platon, départ pour Assos puis Lesbos |
    | 343 | précepteur d'Alexandre |
    | 335 | retour à Athènes, fondation du Lycée |
    | 323 | mort d'Alexandre, retraite à Chalcis |
    | 322 | mort à Chalcis |

    Son père, {violet}Nicomaque{/violet}, est médecin du roi de Macédoine Amyntas III. À {sky}Lesbos{/sky}, il rencontre {violet}Théophraste{/violet} : {green}__à eux deux, ils fondent la biologie, Aristote pour les animaux, Théophraste pour les plantes.__{/green} À la mort d'Alexandre, le sentiment antimacédonien pousse Aristote à se retirer à Chalcis, ville natale de sa mère.

    **La transmission.** Le corpus conservé vient de manuscrits médiévaux, fondés sur une édition du Ier siècle avant notre ère attribuée à {violet}Andronicos de Rhodes{/violet}.
    - Pas de commentaires sur les écrits biologiques avant leur traduction en arabe.
    - En Occident, ils apparaissent dans les traductions latines de {violet}Michel Scot{/violet}, faites sur l'arabe, qui nourrissent le *De animalibus* d'{violet}Albert le Grand{/violet}.
    - Au XIIIe siècle, {violet}Guillaume de Moerbeke{/violet} traduit directement du grec.
    - À la fin du XVe siècle, les premières éditions imprimées, dont la traduction très diffusée de {violet}Théodore Gaza{/violet}.

    **Les œuvres.** Trois grands traités, l'*Histoire des animaux*, les *Parties des animaux*, la *Génération des animaux*, avec de plus brefs essais, comme le *Mouvement* et la *Marche des animaux*, et six traités des *Parva naturalia*. {red}Le *De l'âme* fait-il partie du projet ? La question est difficile{/red} ; il est clair, du moins, que sa théorie de l'âme et du corps est liée à la façon dont Aristote étudie les animaux.
