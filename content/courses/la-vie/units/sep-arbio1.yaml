- id: sep-arbio1-l6
  title: "Un exemple biologique : la chute des feuilles"
  notes: |-
    **Les** {sky}***Seconds Analytiques***{/sky} **ne parlent pas que d'éclipses : ils donnent aussi un long exemple biologique** (II, 16-17), la chute saisonnière des feuilles.

    **Une enquête en trois marches.**
    - **La question.** Pourquoi le {yellow}figuier et la vigne{/yellow} perdent-ils leurs feuilles ?
    - **Une première réponse.** Parce qu'ils ont de {violet}larges feuilles{/violet}. On a trouvé un trait commun aux deux, lié à ce qu'on cherche. Ce « parce que » n'est qu'une étape.
    - **Le changement de sujet.** La science cherche des attributions {violet}coextensives{/violet} : __tout ce qui a le prédicat, et rien d'autre__. « Le figuier perd ses feuilles » n'en est pas une, car la vigne aussi les perd. En revanche, {green}« tout ce qui a de larges feuilles perd ses feuilles »{/green} l'est : voilà la proposition à expliquer, et un genre, dont tous les membres et eux seuls perdent leurs feuilles.

    **Le moyen terme devient sujet.** Ce qui servait d'explication devient ce qu'il faut expliquer. La cause sera quelque chose de plus fondamental : {coral}la solidification de la sève à la jointure de la feuille{/coral}. Et elle donne aussi une définition de la chute des feuilles, conformément à la thèse générale : {teal}« {/teal}Or {teal}le moyen terme est formule du majeur{/teal}, et c'est pourquoi {teal}__toutes les sciences naissent par des définitions__. »{/teal} (II, 17, 99a22-23)

    **Une lacune, et le pont vers la suite.** Les *Analytiques* supposent qu'on a identifié le genre « à larges feuilles », {red}mais sans dire selon quels critères on identifie ces genres de base{/red}. C'est l'un des sujets les plus intéressants du livre I des *Parties des animaux*.

    **Deux questions organisent la suite.** Comment la philosophie de la biologie de *Parties des animaux*, I, se rapporte-t-elle aux *Seconds Analytiques* ? Et les traités qui rapportent les recherches sur les animaux suivent-ils ces normes ?
