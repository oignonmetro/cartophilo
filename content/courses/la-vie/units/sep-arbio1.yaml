- id: sep-arbio1-l4
  title: "Le paradoxe du Ménon et les quatre questions"
  notes: |-
    **Comment atteindre ce but ? Le livre II des *Seconds Analytiques* répond, en résolvant un vieux paradoxe** proposé par le *Ménon* : {teal}« {/teal}il n'est possible à un homme de chercher ni ce qu'il connaît ni ce qu'il ne connaît pas ! En effet, {teal}ce qu'il connaît, il ne le chercherait pas, parce qu'il le connaît{/teal}, et le connaissant, n'a aucun besoin d'une recherche ; et {teal}ce qu'il ne connaît pas, il ne le chercherait pas non plus, parce qu'il ne saurait même pas ce qu'il devrait chercher »{/teal} (80e).

    **La solution d'Aristote.** L'{amber}expérience perceptive{/amber} donne de l'objet de l'enquête {amber}une saisie qui n'est pas encore un savoir scientifique, mais qui suffit à diriger la suite{/amber}. Le dilemme suppose qu'on sache tout ou rien ; or on peut savoir *que* la Lune s'éclipse sans savoir *pourquoi*.

    **Quatre questions, en deux paires.** {teal}« Les choses que l'on cherche{/teal} sont {teal}en nombre égal à celles dont on a un savoir scientifique.{/teal} Or {teal}on cherche quatre choses : le fait, le pourquoi, si c'est et ce que c'est. »{/teal} (II, 1, 89b23-25). Autrement dit, les __types de questions que nous posons dans une enquête scientifique__ (`zētēsis`) correspondent exactement aux __types de connaissances scientifiques__ (`epistēmē`) que nous cherchons à constituer.

    | Première question | Seconde question | Exemple |
    | **Le fait** (to hoti) : déterminer *si* un fait est avéré ou si une propriété appartient à un sujet | **Le pourquoi** (to dioti) : déterminer *pourquoi* ce fait se produit, c'est-à-dire en identifier la cause explicative | « La Lune est-elle éclipsée ? » et si oui, « Pourquoi la Lune s'éclipse-t-elle ? » |
    | **L'existence** (ei esti) : déterminer *si* une entité ou un genre particulier existe dans la nature | **L'essence** (*ti estin*) : déterminer *ce qu'est* cette chose, c'est-à-dire formuler sa définition réelle et causale | « Dieu existe-t-il ? » et si oui, « Qu'est-ce qu'un dieu ? » |

    Dans chaque paire, l'ordre est naturel : {teal}« quand nous connaissons le fait, nous cherchons le pourquoi »{/teal} (89b29), et {teal}« {/teal}quand nous avons pris connaissance que la chose est, {teal}nous cherchons ce qu'elle est{/teal}, par exemple : qu'est-ce donc qu'un dieu, ou qu'est-ce qu'un homme ?{teal} »{/teal} (89b34-35)

    **Les deux mots grecs à retenir.** Le fait se dit {violet}`hoti`{/violet} (que), le pourquoi {violet}`dioti`{/violet} (parce que). Tout ce cours tient dans le passage de l'un à l'autre.
