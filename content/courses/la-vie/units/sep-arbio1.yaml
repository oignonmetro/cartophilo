lessons:
- id: sep-arbio1-l1
  title: "Le fondateur de l'étude scientifique de la vie"
  notes: |-
    **Aristote est à bon droit tenu pour l'initiateur de l'étude scientifique de la vie, bien qu'il ait eu des prédécesseurs.** Les philosophes grecs de la nature spéculaient sur l'origine des vivants ; le {sky}corpus hippocratique{/sky} s'intéressait à l'anatomie, à la physiologie et à la pathologie humaines ; Platon consacre une bonne part du discours de {sky}Timée{/sky} au corps humain, et, dans le {sky}*Banquet*{/sky}, Diotime explique la reproduction sexuée par un désir naturel d'immortalité.

    **Ce qui est nouveau : une étude à la fois systématique et entièrement empirique.** Aristote s'appuie sur ses prédécesseurs, mais {green}__il révise leur interprétation des faits, étend le champ de la recherche, et donne des explications qui s'accordent mieux aux phénomènes, tout en intégrant l'étude de la vie au cadre téléologique de sa science de la nature.__{/green}

    **La place de cette étude.** Il la tient pour centrale dans l'étude théorique de la nature : ses écrits zoologiques forment **environ 25 %** du corpus conservé. Ils défendent une méthode, et ils consignent la première étude systématique et complète des animaux. {coral}Rien de comparable par l'ampleur et la finesse jusqu'au XVIe siècle.{/coral}

    **Une image célèbre.** Au XIXe siècle, le grand anatomiste {violet}Richard Owen{/violet} déclare que la zoologie {yellow}« a jailli de ses travaux, on peut presque le dire, comme Minerve de la tête de Jupiter, dans un état de noble et splendide maturité »{/yellow}. L'image dit une admiration ; elle est aussi trompeuse, puisque le travail d'Aristote a eu des précédents.
