- id: sep-arbio4-l6
  title: "L'œuf, les yeux"
  notes: |-
    **Les ovipares, au livre III, héritent de ce qui est commun.** Les œufs d'oiseaux durcissent à l'air (752a30-b2), mais exigent que la mère couve. Aristote y distingue le blanc et le jaune, {green}non par leur description, comme dans l'*Histoire*, mais par leur fonction{/green} :

    {teal}« C'est à partir de lui en effet que l'animal prend consistance, tandis que le jaune devient sa nourriture, c'est-à-dire que chez ceux qui sont en train de se former, c'est de là que vient la croissance des parties. C'est pour cette raison aussi que le jaune et le blanc sont distingués par des enveloppes, comme s'ils avaient une nature différente »{/teal} (III, 2, 753b11-14)

    Pour le détail, Aristote renvoie à l'*Histoire* ; il retient que, {teal}« une fois que le cœur en premier est formé et que la grande veine s'est à partir de lui définie »{/teal}, deux cordons partent de cette veine : l'un vers l'enveloppe qui entoure l'animal, l'autre vers celle du jaune, par lequel l'animal {teal}« reçoit sa nourriture du jaune »{/teal} (753b19-25).

    **Les yeux : un fait, une place dans le plan.** L'*Histoire* décrit les yeux saillants de l'embryon. *Génération des animaux*, III, 2, n'en dit rien ; le livre II, en revanche, en fait un problème :

    {teal}« Mais la région des yeux des animaux pose une difficulté. Dès le début, les yeux sont en effet ce qui paraît le plus grand chez les animaux terrestres, aquatiques et ailés, alors que c'est la partie qui est formée en dernier, car, entre-temps, ils diminuent. »{/teal} (II, 6, 743b32-35)

    **La cause.** Les organes des sens dépendent de conduits, et {teal}« l'organe de l'œil est le seul à posséder un corps particulier »{/teal} (744a5).

    **Deux leçons.** D'abord, l'ordre du traité veut qu'{coral}un fait de grande généralité soit expliqué au livre II{/coral}, quoique le fait de l'*Histoire* concerne un oiseau : l'explication vaut pour les animaux de terre, d'air et d'eau. Ensuite, {coral}la visée causale y est constante, et elle manque, à bon droit, dans l'*Histoire*{/coral}.
  points:
