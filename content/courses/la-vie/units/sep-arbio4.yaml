lessons:
- id: sep-arbio4-l1
  title: "Parties des animaux : le plan"
  notes: |-
    **Les *Parties des animaux*, II-IV, expliquent ce que l'*Histoire*, I-IV, organise.** Le livre I, on l'a vu, donne les normes. L'explication par les fins et les fonctions est la forme première d'explication causale en biologie.

    | Livres | Sujet |
    | II, 1-2 | rapports entre parties uniformes et non uniformes |
    | II, 3-10 | les parties uniformes, du sang à la chair et à l'os |
    | II, 10-III, 3 | les parties externes de la tête des sanguins |
    | III, 3-IV, 4 | les organes internes des sanguins |
    | IV, 5-9 | les animaux sans sang |
    | IV, 10-14 | tronc et membres, oiseaux, poissons, animaux doubles |

    **Le fil de ce plan.** {green}__Le tout de l'organisme est téléologiquement antérieur à ses parties, et, parmi les parties, les non uniformes aux uniformes.__{/green} On n'explique pas le cœur à partir du tissu, mais le tissu à partir de ce que doit faire le cœur. Aristote se guide encore sur le corps humain, et, pour les organes internes, sur les dissections d'animaux comme le chien et le porc, supposés les plus proches de l'homme.

    **Les animaux sans sang** sont les crustacés, les testacés, les céphalopodes et les insectes. {yellow}Il finit sur ceux qui « dualisent » entre la terre et l'eau, ou l'air{/yellow}.
