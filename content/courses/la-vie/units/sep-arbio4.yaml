- id: sep-arbio4-l5
  title: "Le cœur, principe de l'embryon"
  notes: |-
    **Le cœur résout le problème.** Le géniteur donne le départ, mais ne fait pas croître : {teal}« l'être humain engendre l'être humain, mais c'est par lui-même qu'il croît »{/teal} (735a21-22). Il faut donc qu'une partie prenne d'abord le relais : {teal}« il est nécessaire que soit engendré en premier ce qui possède le principe de la croissance »{/teal} (735a16-17). Or c'est le cœur : {teal}« si, chez certains animaux, le cœur est engendré en premier et, chez ceux qui n'ont pas de cœur, ce qui lui est analogue, c'est du cœur qu'a des chances de venir le principe chez ceux qui en ont un »{/teal} (735a23-26). Première partie produite par la chaleur venue du père, il devient la source interne de cette chaleur, donc du développement.

    {teal}« même si d'une certaine façon toutes les parties existent en puissance dans l'embryon, ce qui est le plus en avant, c'est le principe. C'est pourquoi c'est le cœur qui acquiert en premier une existence séparée en acte, ce qui est évident non seulement à l'observation (car c'est ainsi que cela se passe), mais également si l'on s'appuie sur le raisonnement »{/teal} (II, 4, 740a2-5)

    **Le raisonnement.** {teal}« dès que ce qui se forme est séparé de ses deux parents, il doit s'administrer lui-même, comme l'enfant qui s'est établi loin de son père. C'est pourquoi il doit posséder un principe »{/teal} (740a5-8). Voilà pourquoi ce principe doit être là d'abord : si le principe {red}venait du dehors pour rester dedans plus tard{/red}, on ne saurait dire quand, et il faut que **d'abord existe la partie d'où viennent la croissance et le mouvement des autres**.

    **Contre Démocrite.** {red}Dire que les parties externes se différencient d'abord, c'est parler {teal}« comme s'il s'agissait d'animaux en bois ou en pierre »{/teal}{/red} (740a15) : les êtres de ce type n'ont pas de principe, les animaux en ont un, à l'intérieur.

    **La conclusion, avec sa raison nutritive.** {teal}« C'est pourquoi c'est manifestement le cœur qui est défini en premier chez tous les animaux sanguins, car il est le principe des homéomères et des anoméomères. »{/teal} (740a17-19) La dernière nourriture de l'animal est le sang, les vaisseaux sont son récipient ; {coral}le cœur est donc aussi leur principe{/coral}. Et Aristote renvoie : {teal}« C'est ce que montrent l'Histoire des animaux et les Dissections. »{/teal}

    **Fait et cause.** Ce que l'*Histoire* décrit, le point qui palpite, la *Génération* l'explique, en changeant de mots : elle dit {red}non qu'il palpite{/red}, mais {green}qu'il est animé dès l'origine et source de toutes les autres parties{/green}.
