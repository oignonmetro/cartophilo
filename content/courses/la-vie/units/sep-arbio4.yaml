- id: sep-arbio4-l3
  title: "Génération des animaux : le plan et les deux sexes"
  notes: |-
    **La *Génération des animaux* explique deux choses laissées de côté par les *Parties*** : les différences des parties liées à la génération, et la génération des parties. Elle se tourne vers les **causes efficientes**.

    | Livre | Sujet |
    | I | organes de la reproduction, sperme, contributions |
    | II | développement des vivipares, à commencer par l'homme |
    | III | les ovipares, puis la génération spontanée |
    | IV | mâle et femelle, ressemblances, difformités |
    | V | variations de couleur, de texture |

    **Une définition d'abord neutre.** {teal}« nous appelons mâle l'animal qui engendre en un autre, femelle celui qui engendre en soi »{/teal} (I, 2, 716a13-15).

    **Les contributions.** Les deux viennent d'un {violet}résidu utile du sang{/violet}, élaboré par coction, celui du mâle étant plus entièrement cuit : c'est la {violet}`gonê`{/violet} (le sperme) ; celui de la femelle, les {violet}`katamenia`{/violet} (menstrues).
    - Le mâle fournit **une source de mouvement**, une `dunamis` : une capacité de chauffer, présente dans le `pneuma` du sperme. {red}Il n'apporte aucune matière au petit.{/red}
    - La femelle fournit **une matière préparée**. Il ne lui faut que la présence de cette capacité, et commence un long développement, qu'Aristote compare à {yellow}un automate qui accomplit un ensemble de mouvements coordonnés une fois lancé{/yellow}.

    **L'analogie avec l'art.** {teal}« la nature qui est dans le mâle fait usage du sperme comme d'un outil et comme d'un outil qui possède des mouvements en acte, de la même façon que les outils sont mus dans le cas de ce qui est engendré par l'art. Car c'est en eux que réside en quelque façon le mouvement de l'art. »{/teal} (I, 21, 730b19-23)

    ! Cette répartition, qui fait du mâle la forme et de la femelle la matière, est une thèse d'Aristote, élaborée contre les écrits médicaux qui attribuaient une semence aux deux, non un constat.
