- id: sep-arbio4-l2
  title: "Pourquoi il y a un cou"
  notes: |-
    **Reprenons les organes de l'*Histoire*, II : mais on les explique maintenant** (III, 3, 664a14-36).

    {teal}« Car tous n'ont pas cette partie, seuls l'ont ceux qui ont ce en vue de quoi le cou existe naturellement, c'est-à-dire le larynx et ce qu'on appelle l'œsophage. »{/teal} Et : {teal}« Le larynx, donc, existe naturellement en vue du passage du souffle »{/teal}. {teal}« C'est pourquoi ceux qui n'ont pas de poumons n'ont pas non plus de cou, par exemple la famille des poissons. »{/teal}

    **La suite de la démonstration est conditionnelle.**
    - {teal}« il n'est pas nécessaire d'avoir un œsophage pour la nutrition, car il ne prend pas part à la préparation de la nourriture »{/teal} : l'estomac pourrait suivre immédiatement la bouche.
    - Pour le poumon, c'est **impossible** : il faut d'abord {teal}« quelque chose de commun, comme un tuyau »{/teal}, qui se divise ensuite en deux.
    - {teal}« Et du fait que l'organe qui se rapporte à la respiration a par nécessité une longueur, l'existence de l'œsophage est nécessaire comme intermédiaire entre la bouche et l'estomac. »{/teal}

    **Même la matière s'explique par la fonction.** L'œsophage est {teal}« charnu, possédant une élasticité tendineuse, tendineux pour pouvoir subir une tension quand la nourriture est ingérée, charnu pour pouvoir être mou, compressible et pour ne pas être endommagé en étant raboté par les aliments qui descendent »{/teal}.

    | *Histoire* (II, 15) | *Parties* (III, 3) |
    | tous ceux qui respirent ont un poumon | les parties sont en vue de la respiration |
    | aucune nécessité | nécessité conditionnelle |
    | une corrélation | un système d'organes |

    **Ce qui est changé.** {green}__Le langage de la nature, de la nécessité, du possible et du « en vue de » arrive tout d'un coup : les parties sont présentes à cause de la nécessité conditionnelle imposée par les besoins de l'organisme.__{/green} C'est l'Aristote qui a tant impressionné {violet}Georges Cuvier{/violet} : il expose les fonctions adaptatives de chaque organe, et comment les parties internes forment un système organique.

    **Une hiérarchie téléologique.** Inspirer et expirer sont en vue de la respiration, elle-même en vue du refroidissement du sang ; la trachée en vue du transport de l'air ; {coral}le cou en vue de protéger la trachée.{/coral} Et l'on n'y nomme guère de genres : {red}le poisson n'est cité qu'une fois{/red}, car c'est ce système d'organes qu'on explique, en quelque animal qu'il se trouve.
