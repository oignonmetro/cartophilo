- id: sep-arbio4-l4
  title: "L'art, la nature et l'embryon"
  notes: |-
    **L'analogie obscure de l'outil se déplie dans les premiers chapitres du livre II.** Son principe vaut pour l'art comme pour la nature :

    {teal}« tout ce qui est engendré par la nature ou par l'art est engendré par un être en acte à partir d'un être de ce type en puissance »{/teal} (II, 1, 734b21-22)

    **L'application.** La part préparée des `katamenia` est en puissance ce que celui qui fournit le sperme est en acte. Et ce sperme lui transmet un mouvement tel que, {teal}« lorsque son mouvement cesse, chacune des parties est engendrée et animée »{/teal} (734b23-24). {green}__Chaque partie, en venant à être, a déjà sa capacité fonctionnelle : elle naît et elle est animée.__{/green} D'où la thèse : {teal}« il n'y a pas de visage ni de chair qui ne possède une âme et, une fois qu'ils auront été détruits, l'un sera dit visage, l'autre chair par homonymie, de la même façon que s'ils étaient en pierre ou bien en bois »{/teal} (734b24-27).

    **Le chaud et le froid ne suffisent pas.** {yellow}Le feu tout seul ne produit pas une hache{/yellow} ; il ne produit pas davantage une main ou de la chair, car {teal}« elle aussi possède une certaine fonction »{/teal}. Chaud et froid peuvent rendre {teal}« durs ou mous, visqueux ou friables »{/teal}, {teal}« en revanche la raison pour laquelle ceci est dorénavant chair, cela os, ils ne peuvent plus la produire »{/teal} (734b31-34). Cette raison ({violet}`logos`{/violet}) vient du mouvement du géniteur, comme dans l'art : {teal}« si le chaud et le froid rendent le fer dur ou mou, l'épée, ce qui la produit, c'est le mouvement des instruments, mouvement qui possède la raison de l'art »{/teal} (734b37-735a2). {coral}Les propriétés d'un tissu suivent de sa fonction, et non l'inverse.{/coral}

    **La limite de l'analogie, qui est décisive.** {red}__Un être naturel, une fois engendré, se fait croître lui-même :__{/red} {teal}« rien ne s'engendre soi-même, mais c'est seulement à partir du moment où un être est engendré qu'il se fait croître lui-même »{/teal} (735a13-14). C'est la différence la plus fondamentale de l'art et de la nature : chacun des êtres naturels, selon la *Physique*, {teal}« possède en elle-même un principe de mouvement et d'arrêt »{/teal} (II, 1, 192b13-14), alors qu'{yellow}un lit, un manteau{/yellow} n'ont {teal}« aucune impulsion innée au changement »{/teal}. Le charpentier doit rester physiquement présent aux mouvements qui font la maison ; {red}le père, ou sa semence, non.{/red}

    **D'où un problème.** Comment un processus lancé par un générateur extérieur devient-il un développement naturel, qui a sa source dans le développant ? Réponse : la leçon suivante.
