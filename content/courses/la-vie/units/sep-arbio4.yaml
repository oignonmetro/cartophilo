- id: sep-arbio4-l7
  title: "Une énigme : pourquoi des traités séparés ?"
  notes: |-
    **La biologie d'Aristote pose une énigme quand on la compare au reste de son œuvre.**

    **Le constat.** La distinction du fait et de la cause est fondamentale dans sa théorie de la science, et les œuvres biologiques la respectent consciemment. {red}__Pourtant, nulle part, ni dans les *Seconds Analytiques* ni ailleurs, Aristote ne dit que ces étapes doivent former des traités distincts sur le même sujet.__{/red}

    **Il ne le fait nulle part ailleurs.** En météorologie, en cosmologie, en psychologie, en éthique, à propos du théâtre ou de la rhétorique, {yellow}un seul traité présente à la fois les faits et leur explication{/yellow}.

    **Ce n'est pas un artefact.**
    - Les renvois sont réguliers et de sens unique : les traités causaux renvoient à l'*Histoire* et aux dissections, jamais l'inverse.
    - Le soin avec lequel l'*Histoire* évite tous les concepts de la définition et de l'explication ne peut guère être mis au compte d'un éditeur ultérieur.

    **La question reste ouverte.** {coral}Qu'y a-t-il dans l'étude des animaux qui ait conduit Aristote à faire d'une distinction de méthode entre des étapes de la recherche des traités méthodologiquement distincts ?{/coral}
  points:
  - id: sep-arbio4-l7-p1
    sentence: "Énigme de la biologie d'Aristote : nulle part il ne dit que les étapes du fait et de la cause doivent former des ___ distincts sur le même sujet."
    answer: "traités"
    alt: []
  - id: sep-arbio4-l7-p2
