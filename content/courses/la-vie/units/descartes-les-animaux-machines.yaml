  title: "La spécificité immatérielle de notre âme nous rend immortels contrairement aux animaux"
  notes: ""
  passage:
    label: "11"
    text: "Au reste, je me suis ici un peu étendu sur le sujet de l'âme, à cause qu'il est des plus importants ; car après l'erreur de ceux qui nient Dieu, laquelle je pense avoir ci-dessus réfutée, il n'y en a point qui éloigne plutôt les esprits faibles du droit chemin de la vertu, que d'imaginer que l'âme des bêtes soit de même nature que la nôtre, et que, par conséquent, nous n'avons rien à craindre, ni à espérer, après cette vie, non plus que les mouches et les fourmis ; au lieu que, lorsqu'on sait combien elles diffèrent, on comprend beaucoup mieux les raisons qui prouvent que la nôtre est d'une nature entièrement indépendante du corps et, par conséquent, qu'elle n'est point sujette à mourir avec lui ; puis, d'autant qu'on ne voit point d'autres causes qui la détruisent, on est naturellement porté à juger de là qu'elle est immortelle."
