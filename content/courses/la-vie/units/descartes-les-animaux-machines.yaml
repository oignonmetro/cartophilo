- id: descartes-les-animaux-machines-l4
  title: "Une machine ne peut pas imiter la diversité communicative que peut produire une âme"
  notes: ""
  passage:
    label: "4"
    text: "Dont le premier est que jamais elles ne pourraient user de paroles, ni d'autres signes en les composant, comme nous faisons pour déclarer aux autres nos pensées. Car on peut bien concevoir qu'une machine soit tellement faite qu'elle profère des paroles, et même qu'elle en profère quelques-unes à propos des actions corporelles qui causeront quelque changement en ses organes : comme, si on la touche en quelque endroit, qu'elle demande ce qu'on lui veut dire ; si en un autre, qu'elle crie qu'on lui fait mal, et choses semblables ; mais non pas qu'elle les arrange diversement, pour répondre au sens de tout ce qui se dira en sa présence, ainsi que les hommes les plus hébétés peuvent faire."
