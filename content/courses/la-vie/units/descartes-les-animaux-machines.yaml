- id: descartes-les-animaux-machines-l3
  title: "La machine peut se faire passer pour un animal mais pour un humain"
  notes: ""
  passage:
    label: "3"
    text: "Et je m'étais ici particulièrement arrêté à faire voir que, s'il y avait de telles machines, qui eussent des organes et la figure d'un singe, ou de quelque autre animal sans raison, nous n'aurions aucun moyen pour reconnaître qu'elles ne seraient pas en tout de même nature que ces animaux ; au lieu que s'il y en avait qui eussent la ressemblance de nos corps et imitassent autant nos actions que moralement il serait possible, nous aurions toujours deux moyens très certains pour reconnaître qu'elles ne seraient point pour cela de vrais hommes."
