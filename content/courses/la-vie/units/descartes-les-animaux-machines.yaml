- id: descartes-les-animaux-machines-l7
  title: "Les animaux n'ont pas de raison du tout"
  notes: ""
  passage:
    label: "7"
    text: "Et ceci ne témoigne pas seulement que les bêtes ont moins de raison que les hommes, mais qu'elles n'en ont point du tout. Car on voit qu'il n'en faut que fort peu pour savoir parler ; et d'autant qu'on remarque de l'inégalité entre les animaux d'une même espèce, aussi bien qu'entre les hommes, et que les uns sont plus aisés à dresser que les autres, il n'est pas croyable qu'un singe ou un perroquet, qui serait des plus parfaits de son espèce, n'égalât en cela un enfant des plus stupides, ou du moins un enfant qui aurait le cerveau troublé, si leur âme n'était d'une nature du tout différente de la nôtre."
  points: [{id: descartes-les-animaux-machines-l7-p1, sentence: "« Et ceci ne témoigne pas seulement que les bêtes ont ___, mais qu'elles n'en ont point du tout. »", answer: "moins de raison que les hommes", alt: []}, {id: descartes-les-animaux-machines-l7-p2, sentence: "« Et ceci ne témoigne pas seulement que les bêtes ont moins de raison que les hommes, mais qu'___. »", answer: "elles n'en ont point du tout", alt: []}, {id: descartes-les-animaux-machines-l7-p3, sentence: "« Et ceci ne témoigne pas seulement ___, mais qu'elles n'en ont point du tout. »", answer: "que les bêtes ont moins de raison que les hommes", alt: []}, {id: descartes-les-animaux-machines-l7-p4, sentence: "« Et ceci ne témoigne pas seulement ___. »", answer: "que les bêtes ont moins de raison que les hommes, mais qu'elles n'en ont point du tout", alt: []}, {id: descartes-les-animaux-machines-l7-p5, sentence: "« Car on voit qu'___ ; et d'autant qu'on remarque de l'inégalité entre les animaux d'une même espèce, aussi bien qu'entre les hommes, et que les uns sont plus aisés à dresser que les autres, il n'est pas croyable qu'un singe ou un perroquet, qui serait des plus parfaits de son espèce, n'égalât en cela un enfant des plus stupides, ou du moins un enfant qui aurait le cerveau troublé, si leur âme n'était d'une nature du tout différente de la nôtre. »", answer: "il n'en faut que fort peu pour savoir parler", alt: []}]
- id: descartes-les-animaux-machines-l8
  title: "La machine et l'animal ne peuvent imiter que la voix humaine, pas la vraie parole"
  notes: ""
  passage:
    label: "8"
    text: "Et on ne doit pas confondre les paroles avec les mouvements naturels, qui témoignent les passions et peuvent être imités par des machines aussi bien que par les animaux ; ni penser, comme quelques anciens, que les bêtes parlent, bien que nous n'entendions pas leur langage : car s'il était vrai, puisqu'elles ont plusieurs organes qui se rapportent aux nôtres, elles pourraient aussi bien se faire entendre à nous qu'à leurs semblables."
