- id: descartes-les-animaux-machines-l1
  title: "Les esprits animaux permettent d'expliquer les comportement mécaniquement"
  notes: ""
  passage:
    label: "1"
    text: "J'avais expliqué assez particulièrement toutes ces choses dans le traité que j'avais ci-devant dessein de publier. Et ensuite j'y avais montré quelle doit être la fabrique des nerfs et des muscles du corps humain, pour faire que les esprits animaux, étant dedans, aient la force de mouvoir ses membres : ainsi qu'on voit que les têtes, un peu après être coupées, se remuent encore, et mordent la terre, nonobstant qu'elles ne soient plus animées ; quels changements se doivent faire dans le cerveau, pour causer la veille, et le sommeil, et les songes ; comment la lumière, les sons, les odeurs, les goûts, la chaleur, et toutes les autres qualités des objets extérieurs y peuvent imprimer diverses idées par l'entremise des sens ; comment la faim, la soif, et les autres passions intérieures, y peuvent aussi envoyer les leurs ; ce qui doit y être pris pour le sens commun, où ces idées sont reçues ; pour la mémoire, qui les conserve ; et pour la fantaisie, qui les peut diversement changer et en composer de nouvelles, et par même moyen, distribuant les esprits animaux dans les muscles, faire mouvoir les membres de ce corps en autant de diverses façons, et autant à propos des objets qui se présentent à ses sens, et des passions intérieures qui sont en lui, que les nôtres se puissent mouvoir, sans que la volonté les conduise."
