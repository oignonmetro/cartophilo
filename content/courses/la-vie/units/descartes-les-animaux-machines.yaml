- id: descartes-les-animaux-machines-l10
  title: "L'âme ne peut pas être produite mécaniquement par un corps"
  notes: ""
  passage:
    label: "10"
    text: "J'avais décrit, après cela, l'âme raisonnable, et fait voir qu'elle ne peut aucunement être tirée de la puissance de la matière, ainsi que les autres choses dont j'avais parlé, mais qu'elle doit expressément être créée ; et comment il ne suffit pas qu'elle soit logée dans le corps humain, ainsi qu'un pilote en son navire, sinon peut-être pour mouvoir ses membres, mais qu'il est besoin qu'elle soit jointe et unie plus étroitement avec lui pour avoir, outre cela, des sentiments et des appétits semblables aux nôtres, et ainsi composer un vrai homme."
