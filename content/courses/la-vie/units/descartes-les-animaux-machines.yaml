- id: descartes-les-animaux-machines-l9
  title: "L'ingéniosité animale n'égale pas l'ingéniosité plurielle de la raison humaine"
  notes: ""
  passage:
    label: "9"
    text: "C'est aussi une chose fort remarquable que, bien qu'il y ait plusieurs animaux qui témoignent plus d'industrie que nous en quelques-unes de leurs actions, on voit toutefois que les mêmes n'en témoignent point du tout en beaucoup d'autres : de façon que ce qu'ils font de mieux que nous ne prouve pas qu'ils ont de l'esprit ; car, à ce compte, ils en auraient plus qu'aucun de nous et feraient mieux en toute chose ; mais plutôt qu'ils n'en ont point, et que c'est la nature qui agit en eux, selon la disposition de leurs organes : ainsi qu'on voit qu'un horloge, qui n'est composé que de roues et de ressorts, peut compter les heures, et mesurer le temps, plus justement que nous avec toute notre prudence."
