- id: kant-cfj-dialectique-l3
  title: "L'antinomie du mécanisme et des causes finales (§69-70)"
  notes: |-
    Les §69 et 70 ouvrent la Dialectique. Le §69 explique **pourquoi une antinomie est possible** dans la faculté de juger, le §70 la **présente** : {green}__tant qu'elles restent des maximes de la réflexion, la maxime du mécanisme et celle des causes finales ne se contredisent pas__{/green} ; {red}elles ne se contredisent que si on les prend pour des principes de la possibilité des choses{/red}.

    **La faculté de juger déterminante ne peut avoir d'antinomie.** Elle {teal}« n'a pas par elle-même de principes qui fondent des concepts d'objets »{/teal} : elle se contente de **subsumer** le particulier sous les lois que lui fournit l'entendement. Or une antinomie est un conflit entre des principes : une faculté qui ne fait qu'appliquer des règles reçues d'ailleurs ne peut entrer en conflit avec elle-même. Si contradiction il y avait, elle serait dans la législation qu'elle applique, non en elle.

    **La faculté de juger réfléchissante, elle, se donne ses principes.** Elle doit subsumer {teal}« sous une loi qui n'est pas encore donnée »{/teal} : face à un particulier pour lequel aucun concept ne suffit, elle doit {coral}se servir à elle-même de principe{/coral}. Ce principe n'est pas objectif, c'est une **maxime**, subjective mais nécessaire pour connaître la nature dans ses lois empiriques. Une faculté qui se prescrit ses propres maximes (Renaut parle d'{violet}héautonomie{/violet}) peut s'en donner deux qui semblent s'opposer : d'où une {coral}« dialectique naturelle et une apparence inévitable qu'il faut dévoiler et dissoudre »{/coral}.

    **Les deux maximes ont deux sources.** Pour les lois universelles de la matière, l'entendement fournit des principes objectifs. Mais les lois particulières sont si diverses que la réflexion a besoin d'un fil conducteur. L'une de ses maximes lui est {teal}« fournie *a priori* par le simple entendement »{/teal} : le mécanisme ; l'autre est {teal}« suscitée par des expériences particulières qui mettent en jeu la raison »{/teal} : les causes finales, que provoque la rencontre des êtres organisés.

    | Forme | Thèse | Antithèse |
    | maxime | « Toute production de choses matérielles et de leurs formes doit être jugée comme possible d'après des lois simplement mécaniques. » | « Quelques produits de la nature matérielle ne peuvent pas être jugés comme possibles d'après des lois simplement mécaniques » |
    | principe constitutif | « Toute production de choses matérielles est possible d'après des lois simplement mécaniques. » | « Quelques productions de ces choses ne sont pas possibles d'après des lois simplement mécaniques. » |

    **Sous forme constitutive, elles se contredisent.** Si l'on en fait des principes de la possibilité des objets, {red}« l'une des deux serait nécessairement fausse »{/red} : ce serait une contradiction dans la législation de la raison, non plus une antinomie de la faculté de juger. Mais la raison {coral}ne peut démontrer ni l'une ni l'autre{/coral} : pour savoir ce qui est possible ou non selon des lois que seule l'expérience nous fait connaître, il faudrait un principe *a priori* que nous n'avons pas.

    **Sous forme de maximes, elles ne se contredisent pas.** Dire {teal}« je dois juger tous les événements survenant dans la nature matérielle [...] selon des lois simplement mécaniques »{/teal}, ce n'est pas dire {red}qu'ils ne sont possibles que par lui{/red} ; c'est seulement dire qu'il faut {teal}« explorer ce principe aussi loin que je le puis »{/teal}, car sans lui {teal}« il ne peut y avoir aucune véritable connaissance de la nature »{/teal}. Cela n'empêche pas, devant certaines formes, de réfléchir d'après un autre principe, celui des causes finales. Une règle qui prescrit de chercher partout le mécanisme ne contredit pas une règle qui prescrit de juger certains produits par des fins **là où le mécanisme ne suffit pas à notre esprit**. Ce qui reste établi, c'est seulement que la raison humaine, en suivant le mécanisme, {coral}« ne pourra jamais découvrir le moindre fondement de ce qui constitue ce qu'il y a de spécifique dans une fin naturelle »{/coral}.

    **Leur unité n'est pas exclue, seulement inaccessible.** Kant laisse un point {coral}« dans l'indécision »{/coral} : peut-être mécanisme et finalité se rejoignent-ils en un seul principe dans le fond de la nature, qui nous est inconnu ; nous sommes seulement incapables d'opérer nous-mêmes cette réunion.

    ! L'antithèse n'autorise pas à abandonner la recherche mécanique : il faut la poursuivre aussi loin qu'on le peut.
    ! À la différence des antinomies de la raison pure, thèse et antithèse portent ici sur les mêmes objets, les phénomènes : la solution ne peut consister à assigner l'une aux phénomènes et l'autre aux choses en soi.
