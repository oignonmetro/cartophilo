lessons:
- id: kant-cfj-dialectique-l1
  title: "Repérage : le plan de la Dialectique (§69-78)"
  notes: |-
    La **Dialectique de la faculté de juger téléologique** affronte le conflit que l'Analytique a fait naître : la nature doit être jugée d'après le mécanisme, et pourtant certains de ses produits ne peuvent l'être que d'après des fins. Sa réponse : {green}__mécanisme et finalité ne se contredisent que si l'on prend des maximes de notre jugement pour des lois des choses__{/green} ; leur dualité tient à notre entendement, et leur accord est renvoyé au {violet}suprasensible{/violet}.

    | Mouvement | Lieu | Ce qui s'y joue |
    | poser l'antinomie et en préparer la solution | §69-71 | mécanisme et finalité ne se contredisent que si l'on prend des maximes de la réflexion pour des lois des choses |
    | réfuter les systèmes dogmatiques | §72-74 | ni le hasard, ni la fatalité, ni la matière vivante, ni le Dieu créateur ne peuvent expliquer la finalité, car son concept ne se démontre pas |
    | fonder la solution sur notre entendement | §75-77 | nous ne pouvons penser les êtres organisés que par une cause intelligente parce que notre entendement va des parties au tout |
    | subordonner le mécanisme à la téléologie | §78 | il faut expliquer le vivant mécaniquement aussi loin que possible, en subordonnant ce mécanisme à la finalité |

    ! La Dialectique ne prouve ni l'existence de Dieu ni l'insuffisance réelle du mécanisme : elle établit ce que notre faculté de juger doit penser, et pourquoi.
