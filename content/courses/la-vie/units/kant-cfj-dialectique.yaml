- id: kant-cfj-dialectique-l7
  title: "Pourquoi la fin naturelle ne se traite pas dogmatiquement (§74)"
  notes: |-
    Le §74 donne la raison de l'échec de tous les systèmes : {green}__le concept de fin naturelle est inexplicable, parce que sa réalité objective ne peut être démontrée__{/green}. On ne peut donc le traiter que de façon critique.

    **Procéder dogmatiquement ou de façon critique.** On procède **dogmatiquement** avec un concept quand on le subsume sous un concept de la raison et qu'on détermine l'objet d'après lui : c'est l'affaire de la faculté de juger déterminante. On procède de façon **critique** quand on le considère seulement par rapport à notre pouvoir de connaître, {teal}« sans entreprendre de décider quoi que ce soit sur son objet »{/teal} : c'est l'affaire de la faculté de juger réfléchissante.

    **Pour en user dogmatiquement, il faudrait être sûr de sa réalité objective.** Le concept de fin naturelle subsume la nature sous une causalité que seule la raison peut penser. Pour subsumer sous lui une chose de la nature, il faudrait d'abord être assuré qu'il a un objet. Or il est **empiriquement conditionné**, puisqu'il n'est possible qu'à l'occasion de certaines expériences, mais il ne l'est que d'après un **principe de la raison** : on ne peut ni le tirer de l'expérience, ni le démontrer *a priori*. Nous ne savons donc pas s'il est un {red}concept ratiocinant et objectivement vide{/red} (*conceptus ratiocinans*) ou un {green}concept de la raison fondant une connaissance{/green} (*conceptus ratiocinatus*). La question de savoir si les fins naturelles exigent une causalité intentionnelle ne peut donc **même pas être posée** pour la faculté de juger déterminante.

    **Il réunit dans une même chose nécessité naturelle et contingence.** Une fin naturelle est un produit de la nature, donc **nécessaire** selon ses lois, et pourtant sa forme est **contingente** au regard des simples lois de la nature. Pour que ce ne soit pas une contradiction, le concept doit contenir un fondement qui rapporte la nature elle-même à quelque chose de **suprasensible**, et qui pour nous ne peut aucunement se connaître. Un principe qui renvoie à l'inconnaissable ne peut servir à déterminer un objet.

    **Tous les systèmes sont donc indécidables, qu'ils affirment ou qu'ils nient.** Quand on subsume des choses sous un concept simplement **problématique**, tout ce qu'on en affirme ou en nie (que la fin soit intentionnelle ou non) reste problématique, {coral}« étant donné que l'on ne sait pas si l'on juge sur quelque chose ou sur rien »{/coral}. Le théisme et l'hylozoïsme, qui affirment, ne sont pas mieux fondés qu'Épicure et Spinoza, qui nient.

    **Le théisme dogmatique se détruit lui-même.** Le concept d'une causalité par fins, l'**art**, a de la réalité objective, comme celui du mécanisme. Mais celui d'un être fondement originaire de la nature ne peut être garanti par rien. Et, le serait-il, {red}« comment puis-je mettre encore au nombre des produits de la nature des choses qui sont précisément données pour des produits d'un art divin »{/red}, alors que c'est l'impuissance de la nature à les produire qui obligeait à recourir à une cause distincte d'elle ? Expliquer l'organisme par un art divin, c'est cesser d'en faire une **fin naturelle**.

    ! « Indémontrable » ne veut pas dire « chimérique » : le concept de fin naturelle n'est pas déclaré vide, il est déclaré indécidable pour la faculté de juger déterminante.
