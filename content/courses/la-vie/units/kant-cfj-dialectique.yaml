- id: kant-cfj-dialectique-l10
  title: "Remarque : ce qui tient à notre entendement (§76)"
  notes: |-
    Le §76 est une **Remarque**, qui éclaire sans prouver. Il montre par trois exemples que {green}__certaines distinctions que nous croyons trouver dans les choses tiennent à la constitution de notre pouvoir de connaître__{/green}, et qu'elles valent pourtant nécessairement pour nous. La distinction du mécanisme et de la finalité est la troisième.

    **Le principe : la raison va plus loin que l'entendement ne peut la suivre.** La raison vise l'inconditionné ; l'entendement ne travaille que sous des conditions données. Là où l'entendement ne peut suivre, la raison produit des **Idées** qui ne sont pas des concepts d'objets, mais des principes **régulateurs**. L'entendement limite alors leur validité au sujet, mais {coral}« d'une manière universelle pour tous les sujets de cette espèce »{/coral} : on ne peut ni ne doit penser autrement, sans affirmer que le fondement de ce jugement est dans l'objet.

    **Premier exemple : le possible et l'effectif.** Il est nécessaire pour l'entendement humain de distinguer la possibilité et l'effectivité des choses. Mais {teal}« la raison s'en trouve dans le sujet »{/teal} : nous avons besoin de deux éléments hétérogènes, l'**entendement** pour les concepts, qui ne donnent que la possibilité, et l'**intuition sensible** pour les objets, qui seule donne l'existence. Parce qu'un concept ne contient pas l'existence de son objet, nous pouvons penser ce qui n'existe pas. {coral}« Si notre entendement était intuitif, il n'aurait pas d'autres objets que l'effectif »{/coral} : penser et donner l'objet seraient un seul acte, et la distinction disparaîtrait, avec elle la contingence. Elle vaut donc pour nous sans prouver qu'elle est dans les choses. Pourtant la raison exige un être dont l'existence soit inconditionnellement nécessaire, où possibilité et effectivité ne se distinguent plus : une Idée indispensable, mais que notre entendement ne peut se représenter.

    **Deuxième exemple : le devoir et l'être.** Dans l'usage pratique, la raison présuppose sa causalité inconditionnée, la **liberté**. Mais parce que nous sommes aussi sensibles, ce qui devrait se faire bien souvent n'a pas lieu : la nécessité morale s'exprime donc {teal}« non par un être (avoir lieu), mais par un devoir-être »{/teal}. Pour une raison sans sensibilité, dans un monde intelligible, il n'y aurait {coral}nulle différence entre devoir et faire{/coral}. Le devoir tient à notre constitution, et pourtant il commande à chacun comme s'il en allait réellement ainsi.

    **Troisième exemple : le mécanisme et la technique de la nature.** De même, {green}nous ne trouverions aucune différence entre le mécanisme de la nature et sa technique{/green} si notre entendement ne devait pas {coral}« aller du général au particulier »{/coral}. Le particulier contient toujours quelque chose de contingent au regard du général ; la raison exige pourtant de l'unité dans la liaison des lois particulières, et {violet}**cette légalité du contingent se nomme finalité**{/violet}. Comme les lois particulières ne se déduisent pas *a priori* des lois générales, le concept de finalité est nécessaire à notre faculté de juger, sans déterminer les objets : un principe régulateur qui {coral}« vaut avec autant de nécessité pour notre faculté humaine de juger que s'il était un principe objectif »{/coral}.

    ! Kant présente ces exemples comme une explicitation, « et non comme preuve » de ce qui précède.
    ! Que la finalité tienne à notre entendement ne la rend pas facultative : nous ne pouvons pas plus penser un organisme sans elle que penser le monde sans distinguer le possible du réel.
