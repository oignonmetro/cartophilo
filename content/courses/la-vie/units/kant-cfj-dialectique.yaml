- id: kant-cfj-dialectique-l11
  title: "Notre entendement va des parties au tout : l'entendement intuitif (§77)"
  notes: |-
    Le §77 donne la raison dernière de tout ce qui précède : {green}__si nous ne pouvons penser les êtres organisés que comme des fins, c'est à cause d'une propriété de notre entendement, qui est discursif__{/green}. Kant la fait apparaître par contraste avec l'Idée d'un **entendement intuitif**, pour lequel la distinction du mécanisme et de la finalité n'aurait pas lieu.

    **L'Idée de fin naturelle a ceci de particulier qu'elle semble constitutive.** Comme les autres Idées, elle tient à notre pouvoir de connaître ; mais son effet, l'organisme, est **donné** dans la nature, si bien qu'elle paraît désigner une causalité réelle. Pour ne pas prendre une propriété de notre entendement pour un prédicat des choses, il faut penser **un autre entendement possible** : de même que, dans la *Critique de la raison pure*, on devait penser une autre intuition possible pour comprendre que la nôtre ne donne que des phénomènes. Seul ce contraste permet de dire que certains produits doivent être jugés par nous comme intentionnels, sans prétendre qu'une cause intentionnelle existe réellement, et sans exclure qu'un entendement supérieur trouve leur fondement dans le mécanisme.

    **Notre entendement est discursif : le particulier est contingent pour lui.** {teal}« Notre entendement est un pouvoir des concepts, c'est-à-dire un entendement discursif »{/teal} : il va du **général analytique**, le concept, au particulier donné dans l'intuition empirique. Or un concept général ne détermine pas le particulier : de combien de façons des choses qui partagent un caractère commun peuvent se présenter à nous, c'est **contingent**. Le particulier doit pourtant s'accorder avec nos concepts pour être connu ; cet accord, qui n'a pas de principe, nous ne pouvons le penser que comme rendu possible par une fin.

    **Il pense donc tout réel comme produit de ses parties.** Pour expliquer un produit, notre entendement part des parties, pensées comme fondements généraux, vers les formes possibles qui en résultent : {coral}« un tout réel de la nature est à considérer uniquement comme effet des forces motrices concurrentes des parties »{/coral}. C'est le mode mécanique. Il ne livre jamais l'Idée d'un tout dont dépendraient la constitution et l'action des parties, alors que c'est ainsi que nous devons nous représenter un corps organisé.

    **D'où vient le concept de fin.** Vouloir que le tout lui-même rende possibles ses parties serait, pour un entendement discursif, {red}une contradiction{/red} : le tout réel ne peut être cause de ce qui le compose. Il ne reste qu'une voie : que la **représentation** du tout contienne le fondement de la forme du tout et de la liaison des parties. Or {coral}un produit dont la représentation de l'effet est la cause s'appelle **fin**{/coral}. C'est donc {green}« uniquement une conséquence de la constitution particulière de notre entendement »{/green} si nous nous représentons ces produits d'après la causalité des fins ; ce principe concerne la possibilité de **les juger**, non celle des choses mêmes.

    **L'entendement intuitif, archétype pensable.** Nous pouvons penser, négativement, un entendement non discursif, {coral}intuitif{/coral}, qui irait du **général synthétique** (l'intuition d'un tout comme tel) au particulier, c'est-à-dire {coral}du tout aux parties{/coral} : pour lui, la liaison des parties n'aurait rien de contingent. Kant l'appelle {violet}*intellectus archetypus*{/violet}, face à notre {violet}*intellectus ectypus*{/violet}, {teal}« qui a besoin d'images »{/teal}. Il n'est pas nécessaire de prouver qu'il est possible : il suffit que la comparaison avec notre entendement nous y conduise et que cette Idée {coral}« ne contient [...] pas de contradiction »{/coral}. Un point de comparaison pensable suffit pour montrer que la limite est la nôtre, non celle des choses.

    **L'espace ressemble au fondement cherché, mais n'en est que la condition formelle.** Dans l'espace aussi, aucune partie ne se détermine qu'en relation au tout. Si les êtres matériels étaient des choses en soi, l'unité qui fonde leurs formes ne serait que celle de l'espace ; or l'espace n'est pas un fondement **réel** des productions. Mais on peut tenir le monde matériel pour un simple phénomène et lui supposer comme substrat une chose en soi, objet d'une intuition intellectuelle qui n'est pas la nôtre. Il y aurait alors un {violet}fondement réel suprasensible{/violet}, inconnaissable, de la nature : nous y jugerions selon des lois mécaniques ce qui est nécessaire comme objet des sens, et par des fins ce qui fait l'unité des lois particulières et de leurs formes, {green}sans que l'un des deux modes d'explication exclue l'autre{/green}.

    **Ni le mécanisme ne rend la finalité superflue, ni l'inverse.** On peut essayer, sur un être organisé, toutes les lois mécaniques connues et à découvrir, et espérer légitimement de bons résultats, sans être jamais dispensé de recourir à la causalité finale : {coral}aucune raison humaine, ni aucune raison finie de même qualité mais de degré très supérieur, ne peut espérer comprendre mécaniquement{/coral} {teal}« la production ne serait-ce même que d'un brin d'herbe »{/teal}.

    ! Kant ne prouve pas l'existence d'un entendement intuitif : il lui suffit qu'il soit pensable sans contradiction, comme point de comparaison.
    ! Il ne dit pas non plus que la production mécanique des êtres organisés est impossible : il le faudrait seulement si les êtres matériels étaient des choses en soi.
