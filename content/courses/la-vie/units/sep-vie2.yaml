- id: sep-vie2-l3
  title: "Parke : de quoi la vie est-elle dite ?"
  notes: |-
    **Ce qu'il faut expliquer sous le nom de vie est lui-même en débat** (Tsokolov 2009, Mix 2020, Parke 2020). Emily **Parke** distingue plusieurs **dimensions** selon lesquelles les définitions divergent avant même de répondre.

    **Individus ou collectifs ?** Pour certaines définitions, la vie se dit {pink}d'abord des individus{/pink} ; pour d'autres, {pink}d'abord des collectifs{/pink}, jusqu'à des planètes entières, et des individus par dérivation. La plupart y voient une sorte d'**entité** plutôt qu'une relation ou un **processus** (voir pourtant Nicholson et Dupré 2018).

    **Base matérielle ou fonction ?** Certaines définitions cherchent une {violet}base matérielle{/violet}, limitant peut-être la vie à la biochimie que nous connaissons sur Terre ; d'autres sont {violet}fonctionnelles{/violet}. Carl **Sagan** se méfiait des définitions biochimiques, exposées au {red}« chauvinisme terrestre »{/red} : elles privilégient notre propre biochimie, comme si toute vie devait être faite comme la nôtre. D'autres tiennent au contraire notre biochimie pour universelle à bon droit (Pace 2001, Benner et al. 2004).

    **Frontières nettes ou continuum ?** Enfin, certaines définitions cherchent des {pink}frontières nettes{/pink}, d'autres admettent un {pink}continuum de « ressemblance au vivant »{/pink}.

    | Dimension | Un pôle | L'autre pôle |
    | à qui la vie se dit | individus | collectifs |
    | sur quoi elle repose | base matérielle | fonction |
    | sa frontière | nette | continuum |

    ! Deux chercheurs qui ne situent pas leur définition sur la même dimension ne se contredisent pas vraiment : ils ne répondent pas à la même question.
