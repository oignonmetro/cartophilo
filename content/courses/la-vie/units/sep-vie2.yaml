lessons:
- id: sep-vie2-l1
  title: "Sept façons de répondre au désaccord"
  notes: |-
    **Le débat sur la définition de la vie ressemble à une partie de tir à la corde conceptuelle.** Peut-être faut-il en tirer une forme de **scepticisme** envers le projet même de définir la vie. Devant un désaccord généralisé entre experts, plusieurs « coups » sont possibles (Kelley 2024) :
    - **plaider** : trouver ou forger une position, et la défendre ;
    - **la meilleure théorie disponible** : retenir celle qui rend compte du « plus » de phénomènes communs aux différentes positions ;
    - **stipuler** : définir un nouveau terme technique ;
    - **spécifier** : diviser le concept en types distincts, et les nommer ;
    - **la polysémie** : accepter un concept vague, qui glisse d'un usage à l'autre ;
    - **le scepticisme** : tenir qu'on n'aura peut-être jamais de réponse, et poursuivre un projet moins ambitieux (Cleland 2019) ;
    - **l'éliminativisme** : abandonner tout à fait le concept de vie, et reformuler la question (Jabr 2013).

    **Un accord de fond demeure pourtant.** La plupart des chercheurs admettent {green}__une distinction entre vivant et non-vivant, de nature plutôt que de degré__{/green}, et la plupart tiennent la vie pour une {violet}espèce naturelle{/violet} plutôt qu'un concept humain. Le scepticisme récent ne porte donc pas sur l'existence de la vie, mais sur **la définition comme but** : la littérature sur la question est {red}« vaste, répétitive et parfaitement non concluante »{/red}.

    **D'où vient l'absence de consensus ?** Les philosophes ne s'accordent pas là-dessus : ils invoquent des présupposés tus, soit dans l'approche de qui définit, soit dans la question même. Les scientifiques, eux, doutent moins du but, mais répugnent davantage au débat philosophique.

    ! Être sceptique sur la définition de la vie n'est pas nier qu'il y ait des vivants : c'est douter qu'une définition soit le bon moyen, ou le bon moment, pour les saisir.
