- id: sep-vie2-l2
  title: "Cleland : l'eau des alchimistes"
  notes: |-
    **Toute définition de la vie présuppose une théorie de la vie** (Cleland et Chyba 2002, Benner 2010, Cleland 2019). Sans le dire, cette position rejoint la {violet}théorie des concepts-théories{/violet} : on ne peut dire ce qui appartient à une catégorie sans savoir pourquoi ses membres se ressemblent.

    **L'analogie de la chimie ancienne.** Les alchimistes rapprochaient de l'eau l'{yellow}*aqua regia*{/yellow} (« eau royale ») et l'{yellow}*aqua fortis*{/yellow} (« eau forte »). La **théorie atomique** a révélé, selon Carol **Cleland**, que la vraie nature de l'eau était H₂O, et que les autres « eaux » étaient HNO₃ + 3 HCl et HNO₃ : {coral}des acides, sans rien de commun avec l'eau{/coral}. Une définition de « l'eau » par ses propriétés visibles (liquide, transparente, dissolvante) aurait réuni ce que la théorie sépare. De même, {red}__définir la vie avant d'avoir la bonne théorie, c'est risquer de regrouper ou de séparer à tort__{/red}.

    **D'où des critères provisoires plutôt que des définitions.** Cleland préconise d'éviter les définitions, qui risquent de nous {red}rendre aveugles à de nouvelles formes de vie{/red}, et leur préfère des {violet}critères provisoires{/violet}, qui évitent le dogme implicite même des définitions opérationnelles. Une sonde envoyée sur Mars avec une définition de la vie terrestre pourrait passer à côté d'une vie autre.

    ! Cleland ne dit pas qu'on ne saura jamais ce qu'est la vie : elle dit qu'on ne le saura qu'avec une théorie, comme on n'a su ce qu'est l'eau qu'avec la théorie atomique.
  points:
