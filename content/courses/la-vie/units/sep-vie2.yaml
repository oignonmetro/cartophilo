- id: sep-vie2-l4
  title: "Quiétisme et éliminativisme"
  notes: |-
    **Le {violet}quiétisme{/violet} : pourquoi s'acharner ?** D'autres auteurs tiennent que :
    - les concepts ordinaires n'ont pas à coïncider avec les concepts scientifiques (Machery 2011) ;
    - une définition ne changerait rien à la pratique scientifique (Szostak 2012) ;
    - il faut repenser radicalement le concept (Mariscal et Doolittle 2020) ;
    - ou même que la distinction du vivant et du non-vivant n'existe pas (Jabr 2013).

    **L'éliminativisme éclaire toutes les formes de scepticisme.** **Cowie** (2009) distingue deux éliminativismes.
    - L'{violet}éliminativisme ontologique{/violet} nie que les objets éliminés existent : {yellow}nous sommes tous éliminativistes à propos de quelque chose, les fantômes ou les fées{/yellow}.
    - L'{violet}éliminativisme linguistique{/violet} (ou conceptuel) se méfie de termes ou de concepts théoriques, ce que **Ramsey** (2020) appelle {violet}« dissolution de catégorie »{/violet} ou {violet}« fragmentation conceptuelle »{/violet}. {green}__Ce n'est pas qu'il n'y ait pas de vivants : c'est que la catégorie de vie est hétérogène, et non une espèce naturelle.__{/green}

    **Ce que l'éliminativisme linguistique permet.** Selon Cowie, on peut nier que rien dans le monde ne réponde à notre définition théorique de la vie, tout en la gardant comme {violet}fiction utile{/violet} ; ou juger les théories de la vie stériles, ou le mot trop vague, sans douter que la vie existe. Si l'on accepte l'une de ces positions, mieux vaudrait {coral}ne jamais employer « vie » seul{/coral}, mais parler de **vie métabolique**, de **vie évolutive**, et des autres conceptions.

    **Les présupposés en jeu.** Sous ces formes de scepticisme, trois désaccords tus :
    - **ce qu'est la vie** : une espèce naturelle dotée d'une essence, ou une construction humaine ;
    - **à quoi sert la définir**, si cela ne change pas la pratique scientifique ;
    - **quels traits sont pertinents**, et lesquels de simples conséquences.

    {red}Quand ces présupposés restent tus, les chercheurs se méprennent sur la source de leur désaccord.{/red}
