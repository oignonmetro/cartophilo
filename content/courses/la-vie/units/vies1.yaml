# Cours tiré du chapitre du manuel collectif sur la vie : Maxime Chapuis,
# « Vraie vie et modes de vie dans la philosophie antique », p. 40-70 (scan
# fourni par l'utilisateur, océrisé ; pages 48, 52, 62, 63 et 66 relues sur
# l'image). Voir content/philosophie.md, § « Un cours sur un auteur, tiré d'un
# commentaire » : citations reprises telles que le chapitre les donne, avec ses
# traductions (Platon : Robin, Pléiade, sauf les Lois, Brisson et Pradeau ;
# Éthique à Nicomaque : Tricot ; Politiques : Pellegrin ; Jamblique : Hasnaoui ;
# Diogène Laërce : dir. Goulet-Cazé), et ses références.
#
# Unités vies1 à vies6 : les mots de la vie (zôè, bios, genre, forme, mode et
# style de vie) ; vivre, c'est mourir ; choisir sa vie (deux chemins, mythe
# d'Er) ; Pythagore et la panégyrie ; Platon contre Calliclès ; Aristote, vie
# théorétique et vie pratique, et la conclusion du chapitre.

id: vies1
title: "Zôè, bios et modes de vie"
subtitle: "Deux mots grecs pour la vie, et pourquoi parler de « mode de vie »"
icon: compass
color: coral
group: "Vraie vie et modes de vie dans l'Antiquité (Chapuis)"
lessons:
- id: vies1-l1
  title: "Arendt : la vie qui peut se raconter"
  notes: |-
    **Le chapitre part d'une distinction devenue classique au XXe siècle : le grec aurait deux mots pour la vie, *zôè* et *bios*.** Cette leçon en donne la version d'Arendt, la suivante celle d'Agamben et ses limites.

    **Arendt : la vie entre naissance et mort.** Dans *Condition de l'homme moderne*, {sky}Hannah Arendt{/sky} donne au mot « vie » un sens tout différent du sens biologique, {teal}« {/teal}si on l'emploie par rapport au monde, pour désigner {teal}l'intervalle entre la naissance et la mort »{/teal}. Bornée par ces deux événements, cette vie {teal}« {/teal}suit {teal}un mouvement strictement linéaire{/teal}, causé néanmoins par le même moteur biologique qui anime tous les vivants et qui conserve perpétuellement {teal}le mouvement cyclique naturel »{/teal}. Le {pink}cycle{/pink} est celui de l'espèce, qui se reproduit sans fin ; la {green}ligne{/green} est celle de l'individu, qui naît une fois et meurt une fois.

    **Son trait principal : elle peut se raconter.** Cette vie spécifiquement humaine est {teal}« {/teal}toujours {teal}emplie d'événements qui à la fin peuvent être racontés, peuvent fonder une biographie »{/teal} ; c'est d'elle, *bios* par opposition à la simple *zôè*, qu'Aristote disait qu'elle {teal}« est en quelque manière une sorte de *praxis* »{/teal} (*Politiques*, I, 4). Car {amber}l'action et la parole{/amber} sont les deux activités dont le résultat sera toujours {teal}« une histoire assez cohérente pour être contée »{/teal}, si fortuits que paraissent un à un les événements.

    **D'où le partage :**
    - {violet}*zôè*{/violet} : {amber}le simple fait de vivre{/amber}, que les hommes ont en partage avec les animaux et les plantes ;
    - {violet}*bios*{/violet} : {amber}la vie spécifiquement humaine, digne d'un récit{/amber}, qui mêle parole et action, *logos* et *praxis* : il n'est de récit qu'à condition qu'il y ait une histoire, donc une action qui en soit le moteur, à raconter par la parole.

    ! Le récit n'est pas un ornement de la vie humaine : c'est ce qui la distingue. Une vie de plante ne se raconte pas, elle se décrit.
  points:
