- id: vies1-l5
  title: "Les questions que posent les modes de vie"
  notes: |-
    **La thématique des modes de vie articule six questions**, qui ordonnent tout le chapitre :
    - {amber}la pluralité{/amber} : si l'on constate *de facto* plusieurs modes de vie, qu'est-ce qui, *de jure*, autorise et justifie cette diversité ?
    - {amber}la fin{/amber} : quelle fin vise chacun, quel objet se donne-t-il ?
    - {amber}la modalité{/amber} : relèvent-ils de la nécessité ou de la contingence ?
    - {amber}les pratiques{/amber} : comment chacun se traduit-il dans la conduite de l'existence ?
    - {amber}la hiérarchie{/amber} : sont-ils tous souhaitables ? en est-il qui sont exclus comme possibilité même d'une vie ?
    - {coral}la vraie vie{/coral} : peut-on parler d'une « vraie vie », et en quel sens ?

    **Le chapitre commence par la dernière**, parce qu'elle est à la fois {green}le point de départ{/green} de la démarche philosophique (c'est pour changer de vie qu'on se consacre à la philosophie) et {green}sa fin{/green} (la philosophie élabore, conceptualise et justifie cette vie). Il y reviendra au terme, après la distinction des modes de vie.
  points:
  - id: vies1-l5-p1
    sentence: "Première question des modes de vie : si l'on en constate plusieurs *de facto*, qu'est-ce qui, *de ___*, autorise et justifie cette diversité ?"
    answer: "jure"
    alt: []
  - id: vies1-l5-p2
    sentence: "Une des questions des modes de vie porte sur leur modalité : relèvent-ils de la nécessité ou de la ___ ?"
    answer: "contingence"
    alt: []
  - id: vies1-l5-p3
    sentence: "De la pluralité des modes de vie découle la question de leur ___ : sont-ils tous souhaitables, ou certains sont-ils exclus ?"
    answer: "hiérarchie"
    alt: ["hiérarchisation"]
  - id: vies1-l5-p4
    sentence: "La question de la « ___ vie » est à la fois le point de départ de la démarche philosophique, puisqu'on philosophe pour changer de vie, et sa fin."
    answer: "vraie"
    alt: []
