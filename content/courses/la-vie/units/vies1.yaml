- id: vies1-l2
  title: "Agamben, et les limites de la distinction"
  notes: |-
    **Agamben reprend la distinction d'Arendt, en lui donnant une inflexion politique**, dès les premières pages d'*Homo sacer* : {teal}« {/teal}*zôè*, qui exprimait {teal}le simple fait de vivre{/teal}, commun à tous les êtres vivants (animaux, hommes ou dieux), et *bios*, qui indiquait {teal}la forme ou la façon de vivre{/teal} propre à un individu ou à un groupe ». *Zôè* désigne ce qu'il appelle la {violet}« vie nue »{/violet}, le processus naturel commun aux vivants ; *bios*, un mode ou un genre de vie.

    **Le texte d'Aristote : l'origine et la fin de la cité.** {sky}Giorgio Agamben{/sky} part des *Politiques*, qui distinguent implicitement {pink}l'origine{/pink} de la cité, la simple survie (les hommes ne se suffisant pas à eux-mêmes doivent s'unir), et {green}son fondement{/green}, la vie bonne, où l'homme accomplit sa nature d'animal doué de *logos* : la cité {teal}« {/teal}s'étant donc constituée {teal}pour permettre de vivre{/teal} [*ginomenê men tou zên eneken*], elle permet, une fois qu'elle existe, de {teal}mener une vie heureuse »{/teal} [*ousa de tou eu zên*] (*Les Politiques*, I, 2). D'où le partage entre {violet}*to zên*{/violet}, le simple fait de vivre (satisfaire ses besoins, procréer), et {violet}*to eu zên*{/violet}, {teal}« la vie politiquement qualifiée »{/teal}, propre aux hommes, et même à certains : les hommes libres, non réduits à la survie, ni {yellow}instruments vivants{/yellow} comme Aristote considère l'esclave, {teal}« {/teal}un {teal}bien acquis animé »{/teal} (*Politiques*, I, 4). Ainsi, pour Agamben, la simple vie naturelle {coral}reste confinée à la sphère de l'*oïkos*{/coral}, la maison, hors de la *polis*.

    **Mais la distinction est moins nette chez les Grecs qu'Agamben ne le croit** : *bios* n'est pas nécessairement réservé aux hommes. {sky}Dubreuil{/sky} le dit d'un trait : {teal}« Agamben épure Aristote{/teal} et il l'extrapole à l'entité merveilleuse "les Grecs" ». L'interprétation d'Arendt et d'Agamben repose sur une affirmation du grammairien {sky}Ammonius{/sky}, selon qui {teal}« *bios* convient aux animaux à raison{/teal} [*logikôn zôôn*], c'est-à-dire aux seuls êtres humains, {teal}*zôè* aux êtres humains et aux animaux sans raison »{/teal}.

    **D'où le choix de vocabulaire du chapitre.** Pour chaque texte grec, il indique le mot employé ; et plutôt que *bios*, qui n'a pas toujours ce sens, il dit {amber}« survie » ou « simple vie »{/amber} pour le processus commun aux vivants, et {amber}« mode de vie »{/amber} pour {coral}une manière de conduire son existence en vue d'une fin{/coral} (connaissance, action), selon une modalité (nécessité, contingence) et par certains procédés.
  points:
