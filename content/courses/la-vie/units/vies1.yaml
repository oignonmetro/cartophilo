- id: vies1-l4
  title: "Foucault et Hadot : style de vie ou manière de vivre"
  notes: |-
    **Puisqu'un mode de vie se choisit, on pourrait parler, avec Foucault, d'un « style de vie » ou d'une « esthétique de l'existence ».** {sky}Michel Foucault{/sky} entend par {violet}« arts de l'existence »{/violet} {teal}« {/teal}des {teal}pratiques réfléchies et volontaires{/teal} par lesquelles les hommes, non seulement se fixent des règles de conduite, mais {teal}cherchent à se transformer eux-mêmes{/teal}, à se modifier dans leur être singulier, et à {teal}faire de leur vie une œuvre{/teal} qui porte certaines valeurs esthétiques et réponde à certains critères de style ». Les {violet}« techniques de soi »{/violet} sont ces pratiques, liées par exemple {yellow}aux plaisirs sexuels{/yellow}, {yellow}à l'alimentation{/yellow}, {yellow}à l'ascèse{/yellow}. Le {violet}style{/violet}, du latin *stilus*, le poinçon pour écrire, dit bien l'idée : {yellow}« sculpter sa propre statue »{/yellow}, selon l'expression de Plotin (traité 38, VI, 7), faire de sa vie une œuvre d'art.

    **Hadot objecte : on ne sépare pas le beau du bien.** {sky}Pierre Hadot{/sky} reconnaît dans la philosophie un art de vivre, mais reproche à Foucault de {red}séparer le beau du bien{/red}, alors que pour les Grecs {green}le beau (*kalon*) est le bien (*agathon*){/green}. Plutôt qu'une « culture de soi », il parle de {teal}« {/teal}transformation, de transfiguration, de {teal}"dépassement de soi"{/teal} », et d'un terme qu'on ne peut éluder, la {violet}sagesse{/violet} : {teal}« {/teal}l'état auquel peut-être le philosophe {teal}ne parviendra jamais, mais auquel il tend »{/teal}. Elle a trois aspects :

    - {amber}la paix de l'âme{/amber} (*ataraxia*) ;
    - {amber}la liberté intérieure{/amber} (*autarkeia*) ;
    - et, sauf pour les sceptiques, {amber}la conscience cosmique{/amber} : la prise de conscience d'appartenir au Tout humain et cosmique, {coral}dilatation du moi qui réalise la grandeur d'âme{/coral} (*megalopsuchia*).

    **Le mode de vie vient avant la doctrine.** Pour Hadot, la philosophie est d'abord une manière de vivre, distincte du discours philosophique, qui en est en partie le produit : {teal}« {/teal}au moins depuis Socrate, {teal}l'option pour un mode de vie ne se situe pas à la fin{/teal} du processus de l'activité philosophique, comme une sorte d'appendice accessoire, mais bien au contraire, {teal}à l'origine{/teal} [...] ; et cette option {teal}détermine{/teal} ainsi jusqu'à un certain point {teal}la doctrine elle-même »{/teal}.

    **Le bilan du chapitre.** On peut reprocher à Hadot {red}une vision réductrice de la richesse des doctrines{/red} ; mais il a, avec Foucault, {green}mis l'accent sur la philosophie comme mode de vie recherché pour lui-même{/green}, qui exige des exercices, une ascèse, une transformation de soi. Le chapitre garde pourtant {amber}« mode de vie »{/amber} plutôt que « manière de vivre », qui ferait du discours le simple produit d'un type de vie.
  points:
  - id: vies1-l4-p1
    sentence: "Michel Foucault parle d'une « ___ de l'existence » : faire de sa vie une œuvre qui réponde à certains critères de style."
    answer: "esthétique"
    alt: []
  - id: vies1-l4-p2
