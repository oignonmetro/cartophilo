- id: vies1-l3
  title: "Genre, forme ou mode de vie"
  notes: |-
    **Comment nommer ce que choisit une vie philosophique ? Trois expressions sont écartées ou nuancées, pour en garder une.** L'expression {violet}« mode de vie »{/violet} sous-entend {amber}un ensemble de normes{/amber} auquel se soumettre, pour que l'existence corresponde à un idéal, fixé par le sujet lui-même, par son école ou par son maître.

    | Expression | Ce qu'elle dit | Sa limite |
    | genre de vie | une classe de vies aux caractères communs | nature et culture entremêlées |
    | forme de vie | des configurations de coexistence | trop hétérogène |
    | mode de vie | un modèle, une norme à suivre | retenue |

    **Le genre : une origine commune.** Le latin {violet}*genus*{/violet}, l'origine, la naissance, contient l'idée d'{amber}une source commune qui se diversifie en espèces{/amber}. Le géographe {sky}Vidal de la Blache{/sky} définit ainsi les genres de vie comme des {teal}« modes de groupements sociaux{/teal}, originairement sortis de {teal}la collaboration de la nature et des hommes »{/teal}, de plus en plus émancipés des milieux. Le genre a donc {coral}un sous-entendu biologique{/coral} : il est à l'intersection de la « simple vie » et du « mode de vie ».

    **La forme : le vital et le social.** Issue de {sky}Wittgenstein{/sky}, l'expression a pris un nouvel essor avec {sky}Estelle Ferrarese et Sandra Laugier{/sky}. Laugier définit les formes de vie comme {teal}« des configurations de co-existence humaine{/teal}, dont la texture est faite des pratiques ou actions qui les produisent, les modifient, les détruisent », et des {teal}« manières humaines d'être vivant »{/teal}. Notion {red}trop hétérogène pour trouver une unité{/red}, elle pense le vital hors de la biologie, comme un devenir sans cesse refaçonné.

    **Le mode : la juste mesure.** Le latin {violet}*modus*{/violet}, {amber}la mesure, la juste mesure, la limite convenable{/amber}, enveloppe {green}l'idée d'un modèle à suivre ou d'une norme à respecter{/green}. Or c'est bien ce que fait la philosophie antique : elle ne décrit pas seulement comment vivent les hommes, {coral}elle détermine des types de vie et les hiérarchise{/coral}.

    **Un exemple : l'exclusion de la vie chrématistique.** Aristote exclut la vie du commerçant des modes de vie possibles, parce que l'enrichissement n'est pas une fin en soi : {teal}« {/teal}Quant à la vie d'homme d'affaires [*chrèmatistès*], c'est {teal}une vie de contrainte{/teal}, et la richesse n'est évidemment pas le bien que nous cherchons : c'est seulement {teal}une chose utile, un moyen en vue d'une autre chose »{/teal} (*Éthique à Nicomaque*, I, 3). Un mode de vie est donc {coral}recherché pour lui-même{/coral}, et il est {coral}explicitement l'objet d'un choix{/coral}, ce que ne disent ni le genre ni la forme de vie.
  points:
