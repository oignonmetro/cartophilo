- id: sep-psy1-l4
  title: "Les quatre causes"
  notes: |-
    **Le *De l'âme* emploie un vocabulaire technique forgé ailleurs : il faut d'abord en rappeler le cadre : l'**{violet}**hylémorphisme**{/violet}**.** Le mot est composé des termes grecs pour la matière (`hulê`) et pour la forme ou figure (`morphê`). Ce cadre s'élabore lui-même dans une théorie générale de la cause et de l'explication, celle des quatre causes (`aitiai`), qu'expose la *Physique* (II, 3).

    | Cause | Ce qu'elle dit | La statue d'Hermès | Le texte |
    | matérielle | ce dont la chose est faite | le bronze | « la **réalité inhérente** à une chose dont cette chose est faite, par exemple l'airain de la statue » |
    | formelle | la structure que réalise la matière | la figure d'Hermès | « la forme et le modèle, c'est-à-dire la formule de l'être essentiel » |
    | efficiente | l'agent qui donne la forme | le sculpteur | « le principe premier d'où part le changement ou la mise en repos » |
    | finale | le but du composé | honorer Hermès | « du but, c'est-à-dire du ce en vue de quoi » |

    **Une double thèse sur ces causes.** {green}__Une explication complète exige de mentionner les quatre, et, cela fait, n'a plus rien à demander.__{/green} L'appel aux quatre causes est donc nécessaire et suffisant, là où elles s'appliquent : toutes les choses explicables ne les ont pas toutes, les figures géométriques n'ayant pas de cause efficiente.

    **Le vivant les a toutes.** {yellow}Un singe a une matière, son corps ; une forme, son âme ; une cause efficiente, son parent ; une cause finale, sa fonction.{/yellow} Dès lors, qu'Aristote donne de l'âme et du corps un traitement hylémorphique n'a rien d'une thèse ajoutée : {coral}c'est sa manière ordinaire d'expliquer.{/coral}

    ! La cause finale d'une statue vient d'une intention, celle du vivant non : la fonction d'un singe n'est le projet de personne.
