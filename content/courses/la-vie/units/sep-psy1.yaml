- id: sep-psy1-l5
  title: "Matière et forme, puissance et réalisation"
  notes: |-
    **La théorie des causes vient de problèmes sur le changement : c'est de là que sortent la matière et la forme.** Aristote soutient que tout changement exige quelque chose de complexe.

    **L'argument.** Quand une statue vient d'un bloc de bronze, il y a un sujet qui persiste, le bronze, et quelque chose qu'il acquiert, sa forme. Sans cette complexité, {red}rien ne pourrait venir à être{/red}, car ce qui naît sortirait de rien ou ne serait que ce qu'il était déjà. {green}__Or il y a génération : la forme et la matière sont donc des traits réels des composés engendrés.__{/green}

    **Le potentiel et l'effectif.** Un bloc indéterminé de bronze ne devient statue qu'en réalisant une certaine figure de statue. La matière est donc en puissance quelque F, jusqu'à ce qu'elle reçoive la forme qui la rend F de façon effective : {teal}« la matière est puissance, alors que la forme est réalisation »{/teal} (*De l'âme*, II, 1, 412a9-10). Le mot grec de **réalisation** est `entelecheia`, l'{violet}entéléchie{/violet}, que l'on traduit aussi par acte ou actualité.

    **Deux sortes de forme.** Le changement qualitatif exige le même appareil : quand on peint une statue, le sujet qui persiste est la statue, et elle acquiert une couleur. Mais cette forme-là est {pink}accidentelle{/pink} : la statue peut la perdre et demeurer. Fondue et refaite en {yellow}douze douzaines de coupe-papier{/yellow}, en revanche, elle perd sa forme {green}essentielle{/green} et cesse d'exister.

    | Forme | Son lien au sujet | En psychologie |
    | essentielle | la perdre, c'est cesser d'être | l'âme |
    | accidentelle | on peut la perdre et demeurer | la forme perçue |

    **Ces origines comptent pour la psychologie.** D'abord, Aristote se sert des deux formes : {coral}__l'âme est une forme essentielle, percevoir revient à acquérir des formes accidentelles.__{/coral} Ensuite, un cadre forgé pour le changement {red}se trouve parfois à l'étroit{/red} : Aristote n'accepte pas sans réserve que toute perception ou toute pensée soit un simple changement dans un sujet qui persiste.

    **Et surtout : le corps est-il vraiment une matière ?** Le bronze peut exister en bloc indéterminé, étant en puissance la statue d'un héros. {red}__Le corps n'a pas d'analogue de cet état : il n'attend pas là, comme une provision de matériau, qu'une âme vienne l'informer.__{/red} En un sens important, c'est **en étant animé** que le corps humain devient un corps humain. Il paraît donc mal fait pour tenir le rôle de matière, au sens précis de la théorie de la génération.
