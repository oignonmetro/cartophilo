lessons:
- id: sep-psy1-l1
  title: "Aristote et ses écrits psychologiques"
  notes: |-
    **La psychologie d'Aristote appartient à sa maturité, et s'écrit depuis sa biologie.** Quelques dates situent ce fait.

    | Période | Dates | Lieu |
    | l'Académie de Platon | 367-347 | Athènes |
    | les voyages, la recherche biologique | 347-334 | Assos, Lesbos, Macédoine |
    | le Lycée, sa propre école | 334-323 | Athènes |

    Né en **384** en Macédoine, mort en **322**, Aristote consacre ses années hors d'Athènes surtout à la recherche biologique. À en juger par leur contenu, ses principaux écrits psychologiques datent probablement du second séjour à Athènes : le {sky}*De l'âme*{/sky} y porte à la fois la marque de son intérêt pour la {violet}taxinomie biologique{/violet} et celle de sa théorie physique et métaphysique la plus élaborée.

    **Deux ensembles de textes, deux niveaux d'abstraction.**
    - Les {sky}*Parva naturalia*{/sky}, recueil lâche de petits traités (dont *De la sensation* et *De la mémoire*), sont d'orientation {amber}**empirique**{/amber}. Ils annoncent porter sur {amber}*ce qui* est commun à l'âme et au corps{/amber} : « {teal}comme la sensation, la mémoire, l'impulsion, l'appétit et le désir en général, et en outre le plaisir et la peine{/teal} » (*De la sensation*, 1, 436a6-10).
    - Le {sky}*De l'âme*{/sky} pose, lui, la question de savoir {amber}*si* tout est commun à l'âme et au corps{/amber} : « {teal}est-ce que toutes appartiennent également en commun à l'être animé ou bien en est-il encore quelqu'une qui soit propre à l'âme elle-même ? Il est, en effet, nécessaire, mais difficile, d'en avoir une idée{/teal} » (I, 1, 403a3-5).

    **La différence tient donc à la question.** {coral}Les *Parva naturalia* étudient les phénomènes communs, le *De l'âme* demande si __tous les états psychologiques__ sont aussi des __états matériels__ du corps.{/coral} D'où son caractère plus théorique, plus conscient de sa méthode, plus attentif aux questions générales sur la perception, la pensée et le rapport de l'âme au corps.

    ! Le *De l'âme* n'est pas un traité sur l'âme humaine ou sur ce qui survit à la mort : son enquête vaut pour tout ce qui vit.
