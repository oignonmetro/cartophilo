# Cours sur la psychologie d'Aristote (voir content/philosophie.md), tiré de
# l'article « Aristotle's Psychology » de Christopher Shields, Stanford
# Encyclopedia of Philosophy (première publication 2000, révision substantielle
# 2020) : introduction, sections 1 et 2. Les citations sont reprises du texte
# français, non retraduites de l'anglais de l'article : De l'âme, Physique,
# Métaphysique, Parties des animaux et De la sensation dans les Œuvres
# complètes (Flammarion), le De l'âme étant traduit par Bodéüs.
#
# Vocabulaire de Bodéüs : réalisation (entelecheia, « actuality » dans
# l'article), intelligence (nous, « mind »), appétit (orexis, « desire »),
# désir (epithumia), représentation (phantasia).
#
# Repère corrigé sur le texte : la question des affections, « 402a3-5 » dans
# l'article, se lit en 403a3-5. Le plan général de l'article et son renvoi à ses
# suppléments (« Method in Psychology ») ne donnent pas de carte : ces
# suppléments ne figurent pas dans le PDF fourni.

