- id: sep-psy1-l3
  title: "Une enquête à cheval sur la science de la nature"
  notes: |-
    {coral}__**L'âme relève-t-elle de la science de la nature ?**__{/coral} **Aristote répond oui et non, et c'est de là que vient sa difficulté de méthode.** La {violet}physique{/violet}, pour lui, est la science théorique des êtres susceptibles de {amber}changement{/amber}, distincte des mathématiques et de la philosophie première (*Métaphysique*, E, 1).

    __**Oui, pour**__ {green}__**la plupart des états de l'âme**__{/green}__**.**__ La colère, la joie, le courage, la pitié, l'amour et la haine engagent __le corps__ de façon centrale et manifeste : {teal}« les passions expriment ce qui est inhérent à une matière »{/teal} (I, 1, 403a25). Aussi {teal}« un naturaliste est en droit d'avoir ses vues sur l'âme »{/teal} (403a27-28). Sa définition de la colère le montre : le dialecticien y voit {yellow}« un appétit de vengeance »{/yellow}, le naturaliste {yellow}« un bouillonnement du sang qui entoure le cœur »{/yellow} (403a30-b1). L'un donne la __forme__, l'autre la __matière__, et il faut les deux. La *Métaphysique* dit de même qu'{teal}« il appartient au physicien d'étudier aussi une certaine âme, pour autant qu'elle n'est pas sans matière »{/teal} (E, 1, 1026a5-6).

    __**Non, pour**__ {red}__**l'intelligence**__{/red}__**.**__ Celle-ci (`nous`) n'est peut-être pas engagée dans le corps à la manière de ces états. L'argument des *Parties des animaux* (I, 1) le justifie en faisant __de l'âme l'objet d'une science universelle__ :
    - Si la science naturelle devait étudier **toute** l'âme, elle devrait inclure l'intellect
    - Or, {amber}__en étudiant l'intellect, elle devrait étudier *tous les intelligibles*__{/amber}. Car pour Aristote, une faculté de connaissance et son objet sont indissociables : {yellow}étudier la __sensation__, par exemple, c'est nécessairement étudier les objets __sensibles__ (les couleurs, les sons, les odeurs){/yellow}.
    - En outre, {coral}l'intellect a la particularité de pouvoir tout concevoir{/coral} : les objets matériels, les concepts mathématiques, mais aussi les principes métaphysiques et les réalités immatérielles. Le domaine des {coral}« intelligibles »{/coral} englobe donc {coral}**la totalité de ce qui existe**{/coral}**.**
    - Par conséquent, la science naturelle deviendrait la **science de toutes choses** et absorberait la totalité de la philosophie.

    L'intellect (*nous* / *dianoia*), propre à l'être humain, ne produit pas de mouvement corporel direct et n'est pas lié à un organe physique matériel de la même manière que les sens. Ainsi, **l'intellect n'est pas « nature » au sens physique**, et __son étude relève non pas de la biologie__, mais de la philosophie première (la métaphysique).

    **D'où une perplexité authentique sur la méthode.** Si des sciences différentes emploient des méthodes différentes, et que __l'étude de l'âme se partage sans appartenir à aucune__, on ne sait plus comment procéder (I, 1, 402a16-22). Aristote entreprend donc l'enquête avec modestie : {teal}« il est de toute manière extrêmement malaisé d'atteindre une quelconque position convaincante à son propos »{/teal} (402a10-11). La question n'a pas disparu : à côté d'approches purement naturalistes, {yellow}la philosophie de l'esprit emploie encore des méthodes *a priori*, et la science cognitive mêle les deux{/yellow}.
