- id: sep-psy1-l2
  title: "L'âme, principe de la vie"
  notes: |-
    **Ce qui étonne d'abord un lecteur moderne : la psychologie d'Aristote étudie les plantes.** Elle est la science de l'âme (`psuchê`, en latin `anima`) ; or l'âme est pour lui un {violet}principe général de la vie{/violet}, non ce qui pense ou ce qui éprouve. {green}__Dès lors, tout ce qui vit a une âme, et la psychologie porte sur tous les vivants,__{/green} {red}__non sur les seuls êtres humains, à qui Aristote réserve l'esprit.__{/red}

    **Le mot contient déjà l'argument.** Un être {violet}animé{/violet} est un être qui a une {teal}*anima*{/teal} : qu'un chêne soit animé n'a rien d'une rêverie animiste, cela veut seulement dire qu'il est vivant. Aussi le *De l'âme* doit-il rendre compte des activités vitales des plantes et des animaux à côté de celles de l'homme, et traite-t-il de la nature de la vie même, sujet qui sort du champ de la psychologie contemporaine.

    **Un point de contact avec la psychologie d'aujourd'hui, pourtant.** Dans les deux cas, des questions différentes appellent des méthodes différentes, au point qu'on se demande si elles relèvent d'une même discipline. {yellow}Le spécialiste de la psychanalyse freudienne n'a, ni par son intérêt ni par sa méthode, de recouvrement immédiat avec le physiologiste du cerveau ou le généticien du comportement.{/yellow} C'est là le problème de la leçon suivante, qu'Aristote rencontre déjà.

    ! « Avoir une âme » ne veut pas dire ici avoir une vie intérieure : la plante a une âme, sans éprouver quoi que ce soit.
