# Cours tiré du chapitre du manuel collectif sur la vie : Marie-Noëlle Ribas,
# « De la biologie à l'éthique : Aristote et la vie », p. 93-125 (scan fourni
# par l'utilisateur, océrisé ; pages 94, 100-102, 111-113, 118-120 et 124 relues
# sur l'image). Voir content/philosophie.md, § « Un cours sur un auteur, tiré
# d'un commentaire » : citations d'Aristote reprises dans les traductions que
# donne le chapitre, avec ses références (DA = De l'âme, PA = Parties des
# animaux, GA = Génération des animaux, HA = Histoire des animaux, MA =
# Mouvement des animaux, IA = Marche des animaux, EN = Éthique à Nicomaque).
#
# Unités arvie1 à arvie4 : la nature, l'art et l'âme ; formes de vie et
# animal ; expliquer le vivant ; vivre en homme. La fonction propre (EN, I, 6)
# et la primauté de la vie contemplative recoupent vies6 (Chapuis), dans une
# autre traduction : les cartes ne se répètent pas d'une unité à l'autre.

id: arvie1
title: "La nature, l'art et l'âme"
subtitle: "Le vivant chez le physicien : un principe interne de mouvement, une âme qui est sa forme"
icon: compass
color: sky
group: "Aristote et la vie"
lessons:
- id: arvie1-l1
  title: "Le physicien et le principe interne de mouvement"
  notes: |-
    **Aristote aborde la vie en {violet}physicien{/violet}, au sens ancien du mot : un *phusikos*, qui étudie la nature (*phusis*) comme ensemble de ce qui existe.** Opposée à la mort, la vie (*bios* ou *zôè*) est l'ensemble des conditions qui permettent aux végétaux et aux animaux {amber}la reproduction, la croissance et l'adaptation à leur environnement{/amber}. Parmi les vivants, l'homme se singularise par {green}la raison{/green}, qui lui permet de penser sa vie et de décider de sa manière de vivre. D'où la question du chapitre : {coral}qu'est-ce que vivre en général, et vivre en homme au sein de la nature ?{/coral}

    **Ce qu'ont en commun les êtres naturels : un principe interne de mouvement.** Tous ne sont pas vivants, mais tous ont en eux un {violet}principe interne de mouvement{/violet}, la nature. Outre le mouvement local (*kinèsis*), le physicien étudie des mouvements qui sont {amber}l'expression spontanée de la nature des corps eux-mêmes{/amber} :
    - les {yellow}éléments{/yellow} (eau, air, terre, feu) ont des mouvements naturels : ce qui est fait de terre tend vers le bas, ce qui est fait d'air vers le haut, dans un univers orienté absolument ;
    - les {yellow}vivants{/yellow} ont les leurs : la génération (*genesis*), la croissance (*auxesis*), le changement qualitatif (*alloiôsis*), le dépérissement (*phthisis*).

    Pour un vivant, se mouvoir, c'est donc {coral}réaliser les mouvements que sa nature suppose{/coral} : croître en se nourrissant comme les plantes, se déplacer comme les animaux, ou mourir, lot des êtres corruptibles de la sphère sublunaire.

    **Le premier partage n'est pas entre l'animé et l'inanimé, mais entre la nature et l'art** (*Physique*, II, 1) : {green}les êtres naturels trouvent leur principe de mouvement en eux-mêmes{/green}, {red}les produits de l'art l'ont à l'extérieur d'eux{/red}.
  points:
  - id: arvie1-l1-p1
    sentence: "Aristote aborde la vie en physicien au sens ancien du mot, un *___*, qui étudie la nature comme ensemble de ce qui existe."
    answer: "phusikos"
    alt: ["physikos"]
  - id: arvie1-l1-p2
    sentence: "Tous les êtres naturels ne sont pas vivants, mais tous ont en eux un principe ___ de mouvement, qu'Aristote nomme nature."
    answer: "interne"
    alt: []
  - id: arvie1-l1-p3
    sentence: "Les mouvements naturels des vivants sont la génération (*genesis*), la croissance (*auxesis*), le changement qualitatif (*alloiôsis*) et le dépérissement, en grec *___*."
    answer: "phthisis"
    alt: []
  - id: arvie1-l1-p4
    sentence: "Parmi les mouvements naturels des vivants, la croissance se dit en grec *___*."
    answer: "auxesis"
    alt: []
  - id: arvie1-l1-p5
    sentence: "Dans la *Physique*, II, 1, Aristote ne partage pas d'abord l'animé et l'inanimé, mais les êtres naturels, qui ont leur principe de mouvement en eux-mêmes, et les produits de l'___, qui l'ont hors d'eux."
    answer: "art"
    alt: ["technique"]
  - id: arvie1-l1-p6
    sentence: "Pour un vivant, se mouvoir, c'est réaliser les mouvements que sa nature suppose ; mourir est le lot des êtres corruptibles de la sphère ___."
    answer: "sublunaire"
    alt: []
- id: arvie1-l2
  title: "L'art n'est pas la nature : Pandore, Dédale, Talos"
  notes: |-
    **La distinction de la nature et de l'art fait écho aux mythes grecs, où le sommet de l'art serait d'insuffler la vie à ses productions.** Les dieux en semblent capables, et {sky}Héphaïstos{/sky}, dieu du feu et de la forge, tout particulièrement.

    - {yellow}Pandore{/yellow}. {sky}Adrienne Mayor{/sky} (*Gods and Robots*) rappelle que, chez Hésiode, Pandore n'est pas une jeune fille qui cède à la tentation d'ouvrir une jarre : c'est {amber}une créature artificielle, conçue par Zeus et fabriquée par Héphaïstos{/amber}, un {teal}« beau mal »{/teal} pour punir les hommes du vol du feu par Prométhée (*Théogonie*, 570-572). D'où le mot de Mayor : {teal}« parce qu'elle a été fabriquée et non engendrée, Pandore n'est pas naturelle »{/teal}. {coral}L'art n'est pas la nature.{/coral}
    - {yellow}Dédale{/yellow}, l'ingénieur mythique, dont l'art est dit divin parce qu'il donne {amber}l'impression de la vie{/amber} : ses statues, que mentionne le *Ménon* (97d-98a), semblent se mouvoir d'elles-mêmes. Vivantes, ou singeant la vie par de savants mécanismes ?
    - {yellow}Talos{/yellow}, l'automate de bronze qu'Héphaïstos aurait offert à Minos pour garder la Crète. {coral}Un automate n'est pas un vivant, même s'il en a l'apparence.{/coral}

    **Aristote n'envisage les machines autonomes que pour réaffirmer la supériorité de la nature**, l'art humain n'ayant pas les moyens de produire des êtres animés de l'intérieur. Dans la *Politique* (I, 4), il imagine {yellow}des navettes qui tisseraient d'elles-mêmes{/yellow}, pour souligner l'écart entre ce rêve, qui libérerait les hommes du travail, et la réalité : faute d'automates, il est politiquement nécessaire d'avoir des esclaves, {teal}« sorte de possession animée »{/teal}, pour libérer du temps pour la politique et l'étude.
  points:
  - id: arvie1-l2-p1
    sentence: "Dans les mythes grecs, c'est surtout ___, dieu du feu et de la forge, qui semble capable d'insuffler la vie à ses productions."
    answer: "Héphaïstos"
    alt: ["Héphaistos", "Hephaïstos"]
  - id: arvie1-l2-p2
    sentence: "Adrienne Mayor : « parce qu'elle a été fabriquée et non engendrée, ___ n'est pas naturelle »."
    answer: "Pandore"
    alt: []
  - id: arvie1-l2-p3
    sentence: "Chez Hésiode, Pandore est une créature artificielle, un « beau ___ » fabriqué par Héphaïstos pour punir les hommes du vol du feu."
    answer: "mal"
    alt: []
  - id: arvie1-l2-p4
    sentence: "L'ingénieur mythique ___ a un art dit divin : ses statues, mentionnées dans le *Ménon*, semblent se mouvoir d'elles-mêmes."
    answer: "Dédale"
    alt: []
  - id: arvie1-l2-p5
    sentence: "___ est l'automate de bronze qu'Héphaïstos aurait forgé et offert à Minos pour garder l'île de Crète."
    answer: "Talos"
    alt: []
  - id: arvie1-l2-p6
    sentence: "Dans la *Politique*, Aristote imagine des ___ qui tisseraient d'elles-mêmes, pour souligner que la machine n'est pas encore à portée de la technique humaine."
    answer: "navettes"
    alt: []
  - id: arvie1-l2-p7
    sentence: "Faute d'automates, Aristote juge politiquement nécessaire d'avoir des esclaves, « sorte de ___ animée », pour libérer du temps pour la politique et l'étude."
    answer: "possession"
    alt: []
- id: arvie1-l3
  title: "Une nature qui s'ingénie, et ne fait rien en vain"
  notes: |-
    **Pourtant, Aristote pense souvent la nature sur un modèle technique.** La pensée grecque de la vie se représente le dieu comme {yellow}un artisan qui travaille un matériau, lui donne forme et l'anime{/yellow}. Dans les traités physiques, la nature {teal}« s'ingénie »{/teal} à donner aux vivants les moyens de vivre : le verbe {violet}*mechanaomai*{/violet} (*Parties des animaux*, II, 7) signifie {amber}« fabriquer avec art »{/amber}, la nature mobilisant des moyens pour obtenir des effets qui ne doivent rien au hasard (*Physique*, II, 8).

    **Le meilleur possible, non le meilleur absolument.** Comme le dieu du *Timée*, mais {pink}sans intention{/pink}, la nature d'Aristote réalise toujours le meilleur, en tenant compte du donné matériel qu'elle doit modeler. Elle produit {green}ce qu'il y a de mieux au vu de la matière{/green}, qui peut lui résister ou venir à manquer. Qu'elle ne fasse {violet}« rien en vain »{/violet} (*ouden matèn*) n'implique donc pas qu'elle produise des êtres parfaits. Même l'homme, auprès de qui tous les autres sont des {teal}« nains »{/teal} (*PA*, IV, 10), gagnerait à avoir {yellow}la vision nocturne du chat{/yellow} ou {yellow}l'odorat du chien{/yellow}. {teal}« {/teal}la nature ne fait rien en vain, en chaque espèce animale, {teal}en réalisant toujours le meilleur selon ce que permet son essence »{/teal} (*Marche des animaux*, 2).

    **Les vivants manifestent exemplairement ce qu'est la nature.** Ceux qui produisent le changement par eux-mêmes sont les êtres les plus accomplis, car ils ont en eux ce principe de mouvement. Ils se distinguent ainsi :
    - des {red}êtres inanimés{/red}, qui ne font que subir un mouvement (*Physique*, VIII, 4) ;
    - des {red}objets techniques{/red}, qui imitent la nature quand on les met mécaniquement en mouvement.

    {coral}Le vivant est le cas exemplaire de la nature : un principe immanent de devenir et d'accomplissement.{/coral}
  points:
  - id: arvie1-l3-p1
    sentence: "Dans ses traités physiques, Aristote dit que la nature « s'ingénie » à donner aux vivants les moyens de vivre : le verbe *___* signifie « fabriquer avec art »."
    answer: "mechanaomai"
    alt: ["mêchanaomai"]
  - id: arvie1-l3-p2
    sentence: "Comme le dieu du *___*, mais sans intention, la nature d'Aristote réalise toujours le meilleur en tenant compte de la matière qu'elle modèle."
    answer: "Timée"
    alt: []
  - id: arvie1-l3-p3
    sentence: "La nature produit non le meilleur absolument, mais ce qu'il y a de mieux au vu de la ___, qui peut lui résister ou venir à manquer."
    answer: "matière"
    alt: []
  - id: arvie1-l3-p4
    sentence: "Que la nature ne fasse « rien en ___ » n'implique pas qu'elle produise des êtres absolument parfaits."
    answer: "vain"
    alt: []
  - id: arvie1-l3-p5
    sentence: "Auprès de l'homme, tous les autres êtres sont des « ___ » (*Parties des animaux*, IV, 10) ; il gagnerait pourtant à avoir la vision nocturne du chat."
    answer: "nains"
    alt: []
  - id: arvie1-l3-p6
    sentence: "*Marche des animaux*, 2 : la nature ne fait rien en vain, « en réalisant toujours le meilleur selon ce que permet son ___ »."
    answer: "essence"
    alt: []
  - id: arvie1-l3-p7
    sentence: "Les vivants manifestent de manière exemplaire l'originalité de la nature : un principe ___ de devenir et d'accomplissement."
    answer: "immanent"
    alt: []
- id: arvie1-l4
  title: "L'âme, forme du corps"
  notes: |-
    **Le vivant est une substance composée d'une matière, son corps, et d'une âme, sa forme.** Aristote l'analyse avec ses concepts propres : {violet}substance{/violet}, {violet}matière{/violet} (*hulè*), {violet}forme{/violet} (*eidos*). L'âme est {coral}le principe qui organise le composé de l'intérieur et qui fait sa définition{/coral}. Les traités qui en traitent : l'*Histoire*, les *Parties*, la *Marche* et le *Mouvement des animaux*, le *De l'âme*, les *Petits traités d'histoire naturelle*, et même les deux premiers livres *Du ciel*, où le ciel est présenté comme un vivant.

    **La forme n'est pas la figure : contre Démocrite.** L'âme ne se réduit ni à l'apparence extérieure ({violet}*morphè*{/violet}) ni à une configuration de parties. Le tort de {sky}Démocrite{/sky} est de réduire la forme à la {red}figure (*schèma*){/red}, ce qui interdit de comprendre la différence entre {yellow}une main vivante{/yellow} et {yellow}une main inerte{/yellow}, sculptée ou coupée du corps. Toutes sont identiques en apparence ; mais l'une a {green}la faculté d'exercer une fonction{/green}, l'autre non. Aucune partie du cadavre {teal}« {/teal}n'est plus telle qu'elle était, je veux dire, {teal}ce n'est plus un œil ou une main »{/teal} (*Parties des animaux*, I, 1), sinon par {violet}homonymie{/violet}, comme le {yellow}médecin en peinture{/yellow} est médecin.

    **L'âme n'est pas séparable : la mort atteint le composé.** L'âme est le principe immatériel et immanent qui donne la vie ; Aristote ne la conçoit pas, comme Platon, capable d'exister séparée (*De l'âme*, II, 1).
    - {red}Pour Platon{/red}, l'âme est immortelle, et la mort est ce moment où {teal}« l'âme, séparée du corps, est elle-même en elle-même »{/teal} (*Phédon*, 64c).
    - {green}Pour Aristote{/green}, {coral}la mort atteint le composé lui-même{/coral} : c'est le moment où la corruption du composé hylémorphique atteint un point de non-retour, parce que son unité cesse. {teal}« {/teal}une fois l'âme disparue, {teal}il n'y a plus d'animal{/teal} et aucune de ses parties ne reste la même, {teal}sinon par la seule configuration »{/teal} (*PA*, I, 1).

    **D'où l'objet premier du naturaliste : l'âme.** La forme est {teal}« davantage nature »{/teal} (*Physique*, II, 1) et {teal}« davantage substance »{/teal} (*Métaphysique*, Z, 3) que la matière ; il revient donc au naturaliste de traiter de l'âme, ou du moins de la partie de l'âme par laquelle l'animal est ce qu'il est (*PA*, I, 1).
  points:
  - id: arvie1-l4-p1
    sentence: "Le vivant est une substance composée d'une matière, *hulè*, son corps, et d'une âme qu'Aristote identifie à sa ___, *eidos*."
    answer: "forme"
    alt: []
  - id: arvie1-l4-p2
    sentence: "Le tort de Démocrite est de réduire la forme à la ___, *schèma*, ce qui interdit de distinguer une main vivante d'une main coupée."
    answer: "figure"
    alt: []
  - id: arvie1-l4-p3
    sentence: "Une main vivante et une main sculptée sont identiques en apparence ; seule la première a la faculté d'exercer une ___."
    answer: "fonction"
    alt: []
  - id: arvie1-l4-p4
    sentence: "*Parties des animaux*, I, 1 : aucune des parties du cadavre n'est plus telle qu'elle était, ce n'est plus un œil ou une main, sinon par ___, comme le médecin en peinture est médecin."
    answer: "homonymie"
    alt: []
  - id: arvie1-l4-p5
    sentence: "Contre Platon, pour qui l'âme peut exister séparée, Aristote soutient que la mort atteint le ___ lui-même, quand l'unité du corps et de l'âme cesse."
    answer: "composé"
    alt: []
  - id: arvie1-l4-p6
    sentence: "*Parties des animaux*, I, 1 : « une fois l'âme disparue, il n'y a plus d'___ et aucune de ses parties ne reste la même, sinon par la seule configuration »."
    answer: "animal"
    alt: []
  - id: arvie1-l4-p7
    sentence: "Pour Aristote, la forme est « davantage ___ » (*Physique*, II, 1) et « davantage substance » (*Métaphysique*, Z, 3) que la matière."
    answer: "nature"
    alt: []
  - id: arvie1-l4-p8
    sentence: "Parce que la forme, identifiée à l'âme, fait du vivant une substance, le ___ qui examine les vivants prendra l'âme pour premier objet d'étude."
    answer: "naturaliste"
    alt: ["physicien"]
- id: arvie1-l5
  title: "L'âme, réalisation première"
  notes: |-
    **Où Aristote étudie l'âme.** Les trois livres du *De l'âme* en définissent les principes ; les neuf opuscules des *Petits traités d'histoire naturelle* étudient les états {teal}« communs à l'âme et au corps »{/teal} : la sensation, la mémoire, le sommeil et la veille, la longévité, la jeunesse et la vieillesse, la respiration, la vie et la mort.

    **Une première définition de la vie** (*De l'âme*, II, 1) : {teal}« Par vie [*zôè*], nous voulons dire la propriété de par soi-même se nourrir{/teal} [*trophèn*], {teal}croître{/teal} [*auxèsin*] {teal}et dépérir{/teal} [*phthisin*] ». La vie est une propriété qu'{amber}un corps naturel possède{/amber} ; d'où la distinction du corps, qui la possède, et de l'âme, qui en est le principe. Le corps, comme matière, est {violet}puissance{/violet} ; l'âme, comme forme, est {violet}réalisation{/violet} (*entélécheia*) : {teal}« Il faut donc nécessairement que l'âme soit substance comme forme d'un corps qui a potentiellement la vie. Or cette substance est réalisation »{/teal}.

    **Réalisation première : posséder sans exercer.** Aristote précise : l'âme est {violet}« réalisation première »{/violet} (*entélécheia protè*), c'est-à-dire {coral}une activité potentielle, non l'activité elle-même{/coral}. L'exemple de la {yellow}science{/yellow} fait entendre les deux sens de « réalisation » :
    - {amber}posséder la science{/amber} sans l'exercer : c'est le premier niveau, celui de l'âme ;
    - {amber}l'exercer actuellement{/amber} : c'est le second, celui de l'activité.

    Ainsi l'âme détermine ce qu'un vivant *peut* faire, sans qu'il le fasse nécessairement : {yellow}l'homme peut marcher, mais ne le fait pas quand il se repose ou qu'il dort{/yellow}.

    **D'où l'écart avec Platon.** {red}Platon conçoit la vie comme l'union de deux substances, l'âme et le corps{/red} ; {green}Aristote la définit comme une série d'activités, et l'âme comme un ensemble de potentialités vitales{/green}. Le corps n'est pas la vie, mais la nature l'a disposé à vivre, en l'organisant et en lui donnant ses organes : il est l'ensemble des puissances dont l'âme permet la réalisation tant qu'il vit. {coral}La vie n'est pas un état, mais un ensemble de capacités que le vivant réalise quand il accomplit ses activités{/coral}, comme la nutrition ou la sensation.
  points:
  - id: arvie1-l5-p1
    sentence: "Les *Petits traités d'histoire naturelle* étudient les propriétés et les états « communs à l'___ et au corps »."
    answer: "âme"
    alt: []
  - id: arvie1-l5-p2
    sentence: "*De l'âme*, II, 1 : « Par vie, nous voulons dire la propriété de par soi-même se nourrir, croître et ___ »."
    answer: "dépérir"
    alt: []
  - id: arvie1-l5-p3
    sentence: "Pour le vivant, le corps, comme matière, est puissance ; l'âme, comme forme, est réalisation, en grec *___*."
    answer: "entélécheia"
    alt: ["entelecheia", "entéléchie"]
  - id: arvie1-l5-p4
    sentence: "*De l'âme*, II, 1 : il faut que l'âme soit substance comme forme d'un corps qui a ___ la vie."
    answer: "potentiellement"
    alt: []
  - id: arvie1-l5-p5
    sentence: "L'âme est « réalisation ___ » : une activité potentielle, comme la science qu'on possède sans l'exercer."
    answer: "première"
    alt: []
  - id: arvie1-l5-p6
    sentence: "Pour faire entendre les deux sens de « réalisation », Aristote convoque la ___, qu'on peut posséder sans l'exercer, ou exercer actuellement."
    answer: "science"
    alt: []
  - id: arvie1-l5-p7
    sentence: "Platon conçoit la vie comme l'union de deux substances ; Aristote la définit comme une série d'___, et l'âme comme un ensemble de potentialités vitales."
    answer: "activités"
    alt: []
  - id: arvie1-l5-p8
    sentence: "Pour Aristote, la vie n'est pas un ___, mais un ensemble de capacités que le vivant réalise quand il accomplit ses activités."
    answer: "état"
    alt: []
