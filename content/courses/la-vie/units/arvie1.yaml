- id: arvie1-l5
  title: "L'âme, réalisation première"
  notes: |-
    **Où Aristote étudie l'âme.** Les trois livres du *De l'âme* en définissent les principes ; les neuf opuscules des *Petits traités d'histoire naturelle* étudient les états {teal}« communs à l'âme et au corps »{/teal} (*De la sensation et des sensibles*, 1) : la sensation, la mémoire, le sommeil et la veille, la longévité, la jeunesse et la vieillesse, la respiration, la vie et la mort.

    **Une première définition de la vie** (*De l'âme*, II, 1) : {teal}« Par vie [{blue}*zôè*{/blue}], nous voulons dire la propriété de par soi-même se nourrir{/teal} [{blue}*trophèn*{/blue}], {teal}croître{/teal} [{blue}*auxèsin*{/blue}] {teal}et dépérir{/teal} [{blue}*phthisin*{/blue}] ». La vie est une propriété qu'{amber}un corps naturel possède{/amber} ; d'où la distinction du corps, qui la possède, et de l'âme, qui en est le principe. Le corps, comme matière, est {violet}puissance{/violet} ; l'âme, comme forme, est {violet}réalisation{/violet} ({blue}*entélécheia*{/blue}) : {teal}« Il faut donc nécessairement que l'âme soit substance comme forme d'un corps qui a potentiellement la vie. Or cette substance est réalisation. Donc elle est {teal}la réalisation d'un tel corps »{/teal} (412a19-22).

    **Réalisation première : posséder sans exercer.** Aristote précise : l'âme est {violet}« réalisation première »{/violet} ({blue}*entélécheia protè*{/blue}), c'est-à-dire {coral}une activité potentielle, non l'activité elle-même{/coral}. L'exemple de la {yellow}science{/yellow} fait entendre les deux sens de « réalisation » :
    - {amber}posséder la science{/amber} sans l'exercer : c'est le premier niveau, celui de l'âme ;
    - {amber}l'exercer actuellement{/amber} : c'est le second, celui de l'activité.

    Ainsi l'âme détermine ce qu'un vivant *peut* faire, sans qu'il le fasse nécessairement : {yellow}l'homme peut marcher, mais ne le fait pas quand il se repose ou qu'il dort{/yellow}.

    **D'où l'écart avec Platon.** {red}Platon conçoit la vie comme l'union de deux substances, l'âme et le corps{/red} ; {green}Aristote la définit comme une série d'activités, et l'âme comme un ensemble de potentialités vitales{/green}. Le corps n'est pas la vie, mais la nature l'a disposé à vivre, en l'organisant et en lui donnant ses organes : il est l'ensemble des puissances dont l'âme permet la réalisation tant qu'il vit. {coral}La vie n'est pas un état, mais un ensemble de capacités que le vivant réalise quand il accomplit ses activités{/coral}, comme la nutrition ou la sensation.
