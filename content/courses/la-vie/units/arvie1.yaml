- id: arvie1-l3
  title: "Une nature qui s'ingénie, et ne fait rien en vain"
  notes: |-
    **Pourtant,** {coral}__**Aristote pense souvent la nature sur un modèle technique**__{/coral}**.** La pensée grecque de la vie se représente le dieu comme {yellow}un artisan qui travaille un matériau, lui donne forme et l'anime{/yellow}. Dans les traités physiques, la nature {teal}« s'ingénie »{/teal} à donner aux vivants les moyens de vivre : le verbe {blue}*mechanaomai*{/blue} (*Parties des animaux*, II, 7) signifie {amber}« fabriquer avec art »{/amber}, la nature mobilisant des moyens pour obtenir des effets qui ne doivent rien au hasard (*Physique*, II, 8).

    **Le meilleur possible, non le meilleur absolument.** Comme le dieu du *Timée*, mais {pink}sans intention{/pink}, la {amber}nature{/amber} d'Aristote {amber}réalise toujours le meilleur, en tenant compte du donné matériel qu'elle doit modeler{/amber} (*Génération des animaux*, II, 6). Elle produit {coral}ce qu'il y a de mieux au vu de la matière{/coral}, qui peut lui résister ou venir à manquer (*Parties des animaux*, III, 2). Qu'elle ne fasse {violet}« rien en vain »{/violet} ({blue}*ouden matèn*{/blue} ; *De l'âme*, III, 12 ; *Parties des animaux*, II, 13) {coral}n'implique donc pas qu'elle produise des êtres parfaits{/coral}. Même l'homme, auprès de qui tous les autres sont des {teal}« nains »{/teal} (*PA*, IV, 10), gagnerait à avoir {yellow}la vision nocturne du chat{/yellow} ou {yellow}l'odorat du chien{/yellow}. La nature produit du mieux qu'elle peut : {teal}« {/teal}la nature ne fait rien en vain, en chaque espèce animale, {teal}en réalisant toujours le meilleur selon ce que permet son essence »{/teal} (*Marche des animaux*, 2).

    **Les** __**vivants**__ **manifestent exemplairement ce qu'est la nature.** Ceux qui produisent le changement par eux-mêmes sont __les êtres les plus accomplis__, car ils ont en eux ce principe de mouvement. Ils se distinguent ainsi :
    - des {red}êtres inanimés{/red}, qui ne font que subir un mouvement (*Physique*, VIII, 4) ;
    - des {red}objets techniques{/red}, qui imitent la nature quand on les met mécaniquement en mouvement.

    {coral}Le vivant est le cas exemplaire de la nature : un principe immanent de devenir et d'accomplissement.{/coral}
  points:
