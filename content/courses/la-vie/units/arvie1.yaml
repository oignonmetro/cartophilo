- id: arvie1-l4
  title: "L'âme, forme du corps"
  notes: |-
    **Le vivant est une substance composée d'une matière, son corps, et d'une âme, sa forme.** Aristote l'analyse avec ses concepts propres : {violet}substance{/violet}, {violet}matière{/violet} ({blue}*hulè*{/blue}), {violet}forme{/violet} ({blue}*eidos*{/blue}). L'âme est {coral}le principe qui organise le composé de l'intérieur et qui fait sa définition{/coral}. Les traités qui en traitent : l'*Histoire*, les *Parties*, la *Marche* et le *Mouvement des animaux*, le *De l'âme*, les *Petits traités d'histoire naturelle*, et même les deux premiers livres *Du ciel*, où {yellow}le ciel est présenté comme un vivant{/yellow}.

    **La forme n'est pas la figure : contre Démocrite.** L'âme ne se réduit ni à l'apparence extérieure ({blue}*morphè*{/blue}) ni à une configuration de parties. Le tort de {sky}Démocrite{/sky} est de __réduire la forme à la__ {red}__figure (__{/red}{blue}__*schèma*__{/blue}{red}__)__{/red}, ce qui interdit de comprendre la __différence entre__ {yellow}__une main vivante__{/yellow} __et__ {yellow}__une main inerte__{/yellow}, sculptée ou coupée du corps. Toutes sont identiques en apparence ; mais l'une a {green}la faculté d'exercer une fonction{/green}, l'autre non. Aristote le dit du cadavre et de la main (*Parties des animaux*, I, 1, 640b33-641a6) : {teal}« {/teal}[...] quand bien même la configuration du cadavre {teal}garde même figure, ce n'est pourtant pas un être humain{/teal}. De plus, {teal}une main ne peut être composée de n'importe quoi{/teal}, par exemple, d'airain ou de bois, {teal}sinon par homonymie{/teal}, au sens où {yellow}le médecin en peinture{/yellow} est médecin. Car {teal}elle ne pourra pas remplir sa fonction{/teal}, pas plus que le médecin en peinture. De la même manière, {teal}aucune des parties du cadavre n'est plus telle qu'elle était{/teal}, je veux dire, {teal}ce n'est plus un œil ou une main »{/teal}. Autrement dit : une main de bronze ou de bois n'est une main que de nom ({violet}homonymie{/violet}), puisqu'elle ne saisit rien ; et la main du cadavre, qui a pourtant la même figure, ne l'est plus davantage.

    **L'âme n'est pas séparable : la mort atteint le composé.** L'âme est le principe immatériel et immanent qui donne la vie ; Aristote ne la conçoit pas, comme Platon, capable d'exister séparée (*De l'âme*, II, 1).
    - {red}Pour Platon{/red}, l'âme est immortelle, et la mort est ce moment où {teal}« l'âme, séparée du corps, est elle-même en elle-même »{/teal} (*Phédon*, 64c).
    - {green}Pour Aristote{/green}, {coral}la mort atteint le composé lui-même{/coral} : c'est le moment où la __corruption du composé hylémorphique__ atteint un point de non-retour, parce que son unité cesse. {teal}« {/teal}Une fois l'âme disparue, {teal}il n'y a plus d'animal{/teal} et aucune de ses parties ne reste la même, {teal}sinon par la seule configuration »{/teal} (*PA*, I, 1).

    **D'où l'objet premier du naturaliste : l'âme.** La forme est {teal}« davantage nature »{/teal} (*Physique*, II, 1) et {teal}« davantage substance »{/teal} (*Métaphysique*, Z, 3) que la matière ; il revient donc au naturaliste de traiter de l'âme, ou du moins de la partie de l'âme par laquelle l'animal est ce qu'il est (*PA*, I, 1).
