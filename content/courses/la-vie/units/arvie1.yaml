- id: arvie1-l1
  title: "Le physicien et le principe interne de mouvement"
  notes: |-
    **Aristote aborde la vie en** {violet}**physicien**{/violet}**, au sens ancien du mot : un** {blue}***phusikos***{/blue}**, qui étudie la nature (**{blue}***phusis***{/blue}**) comme ensemble de ce qui existe.** Opposée à la mort, la {violet}vie{/violet} ({blue}*bios*{/blue} ou {blue}*zôè*{/blue}) est l'ensemble des conditions qui permettent aux végétaux et aux animaux {amber}la reproduction, la croissance et l'adaptation à leur environnement{/amber}. Parmi les vivants, l'homme se singularise par {green}la raison{/green}, qui lui permet de penser sa vie et de décider de sa manière de vivre. D'où la question du chapitre : {coral}qu'est-ce que vivre en général, et vivre en homme au sein de la nature ?{/coral}

    **Ce qu'ont en commun les êtres naturels : un principe interne de mouvement.** Tous ne sont pas vivants, mais tous ont en eux un {violet}principe interne de mouvement{/violet}, la nature. Outre le mouvement local ({blue}*kinèsis*{/blue}), le physicien étudie des mouvements qui sont {amber}l'expression spontanée de la nature des corps eux-mêmes{/amber} :
    - les {yellow}éléments{/yellow} (eau, air, terre, feu) ont des mouvements naturels : ce qui est fait de terre tend vers le bas, ce qui est fait d'air vers le haut, dans un univers orienté absolument ;
    - les {yellow}vivants{/yellow} ont les leurs : la {yellow}génération{/yellow} ({blue}*genesis*{/blue}), la {yellow}croissance{/yellow} ({blue}*auxesis*{/blue}), le {yellow}changement qualitatif{/yellow} ({blue}*alloiôsis*{/blue}), le {yellow}dépérissement{/yellow} ({blue}*phthisis*{/blue}).

    Pour un vivant, se mouvoir, c'est donc {coral}réaliser les mouvements que sa nature suppose{/coral} : croître en se nourrissant comme les plantes, se déplacer comme les animaux, ou mourir, lot des êtres corruptibles de la sphère sublunaire.

    **Le premier partage n'est pas entre l'animé et l'inanimé, mais entre la nature et l'art** (*Physique*, II, 1) : {green}les êtres naturels trouvent leur principe de mouvement en eux-mêmes{/green}, {red}les produits de l'art l'ont à l'extérieur d'eux{/red}.
