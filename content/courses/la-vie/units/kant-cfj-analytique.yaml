  title: "Repérage : l'être organisé, fin naturelle (§64-65)"
  notes: |-
    Le §64 dit ce qu'il faut pour qu'une chose soit pensée comme une fin, puis comme une **fin naturelle** ; le §65 l'analyse, l'identifie à l'{green}**être organisé**{/green} et en fixe le statut.

