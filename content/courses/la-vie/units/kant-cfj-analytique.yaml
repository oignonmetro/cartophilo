- id: kant-cfj-analytique-l12
  title: "La téléologie dans la science de la nature : pas de Dieu en physique (§68)"
  notes: |-
    Le §68 fixe la place de la téléologie dans la science de la nature. {green}__Elle en est un principe interne, à condition de ne parler que de « fin de la nature », jamais de « fin divine »__{/green} : introduire Dieu en physique ruinerait à la fois la physique et la théologie.

    **Une science doit tirer ses principes d'elle-même.** Ses principes sont ou bien {violet}**domestiques**{/violet} (*principia domestica*), intérieurs à elle, ou bien {violet}**étrangers**{/violet} (*principia peregrina*), empruntés à un autre domaine. Toute science est un système, un édifice qui doit tenir par lui-même ; une science qui emprunte son principe d'organisation à une autre en dépend et ne peut plus se justifier seule.

    **Le cercle de la physico-théologie.** {red}Introduire Dieu dans la science de la nature pour expliquer la finalité, puis se servir de cette finalité pour prouver que Dieu existe{/red}, c'est commettre {red}« un diallèle trompeur »{/red}. La physique n'explique plus rien, puisqu'elle s'en remet à une intention qu'elle ne peut observer ; la théologie ne prouve plus rien, puisqu'elle suppose au départ ce qu'elle veut démontrer à la fin. Le physico-théologien lui-même doit accorder la règle qui le condamne : deux propositions ne peuvent se servir mutuellement de seule preuve.

    **D'où le choix des mots : « fin de la nature ».** Cette expression suffit à écarter la confusion ; il faut {teal}« nous borner scrupuleusement et modestement à l'expression qui dit uniquement juste ce que nous savons »{/teal}. Parler de {red}« fin divine »{/red} paraît plus pieux, mais prétend savoir l'auteur de la nature, alors que la science n'observe que des produits engendrés selon des lois.

    **Ce qui se démontre *a priori* n'est pas de la téléologie.** Les propriétés géométriques et les lois mécaniques universelles unissent admirablement des règles indépendantes en un principe ; mais elles sont **nécessaires**, démontrables sans expérience : la téléologie ne s'y applique pas, elle ne vaut que pour une classe particulière d'objets, les êtres organisés, dont la forme est contingente au regard des lois générales.

    **On peut parler de la sagesse de la nature, sans en faire un être raisonnable.** La téléologie physique parle légitimement de la {yellow}« sagesse, de l'économie, de la prévoyance, de la bienfaisance »{/yellow} de la nature, {coral}sans pour autant faire d'elle un être raisonnable (parce que ce serait absurde){/coral}, et sans placer au-dessus d'elle un maître d'œuvre, ce qui serait {red}*vermessen*{/red}, démesuré. Ces mots désignent seulement une causalité de la nature pensée **par analogie** avec notre usage technique de la raison, pour se donner la règle selon laquelle explorer certains produits.

    **Pourquoi la téléologie reste une propédeutique à la théologie.** {teal}« On ne comprend complètement que ce que l'on peut faire soi-même et mettre en œuvre selon des concepts »{/teal} : la physique mécanique s'en tient à ce qu'on peut observer ou produire à la ressemblance de la nature. Or {coral}l'organisation dépasse infiniment tout pouvoir de présentation par l'art{/coral} : nous ne savons pas fabriquer un brin d'herbe. La téléologie ne peut donc être une partie doctrinale de la physique ; elle la complète par une méthode de recherche, et n'est rattachée à la théologie qu'à titre de **passage**.

    ! Kant ne déclare pas le concept de Dieu inutile : il l'exclut seulement de l'explication physique.
    ! Les expressions « sagesse » ou « économie » de la nature sont des façons de parler du jugement réfléchissant, non l'attribution d'une conscience à la matière.
