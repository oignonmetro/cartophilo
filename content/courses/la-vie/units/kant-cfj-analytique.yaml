    | la forme contingente pour la raison | §64 | une chose n'est pensable que comme fin si les lois de la nature ne rendent pas sa forme nécessaire |
    | l'hexagone dans le sable | §64 | une fin, mais un produit de l'art |
    | l'arbre, cause et effet de soi | §64 | comme espèce, comme individu, dans ses parties |
    | deux causalités | §65 | causes réelles et causes idéales |
    | les parties se produisent réciproquement | §65 | un être organisé et s'organisant lui-même |
    | la montre | §65 | une force motrice, non une force formatrice |
    | un concept régulateur | §65 | aucune analogie connue ; un principe pour la réflexion |
