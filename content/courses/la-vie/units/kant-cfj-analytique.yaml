- id: kant-cfj-analytique-l7
  title: "Ce qui est cause et effet de soi-même : l'arbre (§64)"
  notes: |-
    Le §64 dit à quelle condition une chose ne peut être pensée que comme une fin, puis ce qu'il faut de plus pour qu'elle soit une {violet}**fin naturelle**{/violet} et non un produit de l'art. Sa formule provisoire, {green}__une chose est fin naturelle « quand elle est cause et effet d'elle-même »__{/green}, est éclairée par l'exemple de l'arbre avant d'être analysée au §65.

    **Une chose n'est pensable que comme fin quand sa forme est contingente pour la raison.** Il faut que {teal}« sa forme ne soit pas possible d'après de simples lois de la nature »{/teal}, celles que l'entendement connaît. Or la raison veut connaître la **nécessité** de toute forme pour comprendre sa production ; quand les lois mécaniques ne la lui donnent pas, la seule nécessité qui lui reste est celle d'une forme produite d'après un concept. Elle admet donc la causalité qui produit la chose {teal}« comme si elle était possible uniquement par la raison »{/teal}, c'est-à-dire par une volonté. Même celui qui veut tout expliquer par le mécanisme doit accorder que ses lois ne suffisent pas ici : les lois du mouvement règlent chocs et attractions, elles ne disent pas pourquoi des parties s'assemblent en un organe adapté.

    **Cela ne suffit pas à faire une fin naturelle : l'hexagone dans le sable.** Celui qui, {yellow}dans un pays qui lui semble inhabité, voit un hexagone régulier dessiné dans le sable{/yellow} conclut aussitôt que ni le sable, ni la mer, ni le vent, ni les bêtes n'ont pu le produire : la coïncidence avec un concept que seule la raison fournit serait un hasard infiniment improbable. Il y voit une fin, mais {red}« un produit de l'art »{/red} : {teal}« *vestigium hominis video* »{/teal}, je vois une trace d'homme. La cause est **hors** de la chose. Pour une fin **naturelle**, il faut donc davantage : que la chose soit elle-même la source de sa forme.

    **D'où la formule : cause et effet d'elle-même, « bien que ce soit en un double sens ».** Une telle causalité peut être {teal}« pensée certes sans contradiction, sans toutefois pouvoir être conçue »{/teal} : nous la pensons sans la comprendre. Kant l'éclaire par un exemple avant de l'analyser.

    **L'arbre se produit lui-même de trois façons.**
    - {yellow}**Comme espèce**{/yellow} : un arbre produit un autre arbre de la même espèce ; tour à tour effet et cause, il se conserve en permanence comme espèce. Une pierre ne produit pas d'autre pierre.
    - {yellow}**Comme individu**{/yellow}, par la **croissance**, qui {teal}« se distingue totalement de tout accroissement de grandeur selon des lois mécaniques »{/teal} et équivaut à une génération. Le cristal grossit par ajout de matière déjà formée ; la plante, elle, élabore la matière qu'elle assimile en lui donnant une qualité que le mécanisme extérieur ne peut fournir, puis se forme elle-même de cette substance qui est son produit. Aucun art ne sait refaire ce qu'elle fait de sa nourriture.
    - {yellow}**Dans ses parties**{/yellow} : la conservation d'une partie dépend de celle de l'autre, et réciproquement. Les feuilles sont produites par l'arbre, mais l'arbre dépend d'elles : un dépouillement réitéré des feuilles le tuerait. L'œil d'une feuille greffé sur un autre arbre y produit une pousse de sa propre espèce, si bien que chaque branche peut être vue comme un arbre qui se nourrit d'un autre.

    **Le vivant va jusqu'à se réparer et à se réorganiser.** Quand une partie manque, les autres y suppléent ; les {yellow}monstruosités{/yellow} elles-mêmes, où des parties se forment autrement pour conserver ce qui existe, montrent un pouvoir de se défendre contre les lésions que Kant mentionne {teal}« en passant »{/teal}, bien qu'il compte parmi les plus étonnants.

    ! « Cause et effet d'elle-même » n'est pas une contradiction : la chose ne précède pas sa propre existence ; ses parties et son tout se produisent réciproquement.
    ! La contingence de la forme n'est pas le hasard : elle exprime que notre entendement ne peut déduire cette forme des lois générales de la matière.
