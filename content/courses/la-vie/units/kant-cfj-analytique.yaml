- id: kant-cfj-analytique-l11
  title: "La nature entière comme système des fins (§67)"
  notes: |-
    Le §67 étend le principe téléologique de l'organisme à la **nature entière**. Il revient d'abord sur la finalité externe pour distinguer deux jugements que l'on confond, puis montre que {green}__la matière organisée conduit nécessairement à l'Idée de la nature comme système des fins__{/green}, à titre de maxime régulatrice.

    **L'utilité ne fait toujours pas une fin.** On ne peut tenir pour des fins de la nature les {yellow}fleuves{/yellow} parce qu'ils facilitent les échanges, ni les {yellow}montagnes{/yellow} parce qu'elles portent les sources, ni le bétail parce qu'il sert à l'homme. {coral}Entre des choses dont aucune n'est reconnue fin en elle-même, le rapport externe ne peut être jugé final qu'**hypothétiquement**.{/coral}

    **Juger la forme d'une chose et juger son existence, ce n'est pas la même chose.** {teal}« Juger une chose, d'après sa forme intérieure, comme constituant une fin de la nature, c'est tout autre chose que de tenir l'existence de cette chose pour une fin de la nature. »{/teal} Le premier jugement s'appuie sur l'organisation observée : {yellow}la forme interne d'un simple brin d'herbe{/yellow} suffit à prouver, pour notre jugement, qu'il n'est possible que selon la règle des fins. Le second exigerait de connaître la {violet}**fin finale**{/violet} (*scopus*) de la nature, donc un rapport au suprasensible, car {coral}« la fin de l'existence de la nature elle-même doit être recherchée au-delà de la nature »{/coral}. Or on ne voit pas, dans la nature, pourquoi des hommes doivent exister : Kant songe aux habitants de la {yellow}Nouvelle-Hollande{/yellow} ou de la {yellow}Terre de Feu{/yellow}. La chaîne des usages (l'herbe pour le bétail, le bétail pour l'homme) n'aboutit à aucune fin catégorique.

    **La matière organisée conduit pourtant à l'Idée d'un système des fins.** Seule la matière organisée {teal}« introduit nécessairement avec elle le concept d'elle-même comme une fin de la nature »{/teal}, parce que sa forme est à la fois produit de la nature et fin. Mais une fois découvert dans la nature un pouvoir de produire des fins, la raison ne peut laisser ces fins isolées dans un monde de pur mécanisme : l'unité qu'elle exige la conduit à l'{green}**Idée de la totalité de la nature comme un système**{/green} ordonné d'après la règle des fins, auquel tout le mécanisme doit être subordonné, du moins pour examiner les phénomènes.

    **Cette Idée n'est qu'une maxime.** Elle s'énonce : {teal}« tout dans le monde est bon à quelque chose, rien n'y existe pour rien »{/teal}, et l'exemple des produits organiques nous y autorise, {teal}« voire invité »{/teal}. Elle vaut pour la faculté de juger **réfléchissante**, non déterminante : elle est **régulatrice**, non constitutive. Elle fournit un fil conducteur selon un nouvel ordre de légalité, sans rien retrancher au mécanisme, et {red}ne décide pas{/red} si l'herbe existe intentionnellement pour le mouton, ni le mouton pour l'homme.

    **Même le désagréable s'y laisse lire.** On peut dire, sans rien affirmer de la nature, que la {yellow}**vermine**{/yellow} qui tourmente les hommes dans leurs vêtements est une {coral}incitation à la propreté{/coral}, que les {yellow}moustiques{/yellow} poussent les sauvages à assainir leur séjour, que les {yellow}rêves{/yellow} agitent de l'intérieur les organes vitaux pendant le sommeil, qui sans eux serait peut-être {teal}« une complète extinction de la vie »{/teal}. Une maxime de recherche qui ne vaudrait que pour l'agréable ne serait qu'une projection ; celle-ci permet de chercher un ordre là où l'on n'aurait vu que du désordre.

    **La beauté de la nature devient une faveur.** Dans ce système, la beauté naturelle peut être considérée elle aussi comme une finalité objective : comme {yellow}une **faveur**{/yellow} que la nature nous a accordée en répandant, par surcroît d'utilité, la beauté et le charme, comme si elle avait décoré sa scène pour nous. Une note précise que le jugement de goût, lui, restait désintéressé ; c'est le jugement téléologique qui fait de ces formes un élément favorable au progrès de la culture.

    ! Le système des fins n'est pas un organisme géant : Kant ne dit pas que la nature est un animal, il dit que nous pouvons la juger comme si elle formait un système.
    ! L'exemple de la vermine n'est pas une théodicée naïve : il illustre ce que permet une maxime de recherche, sans prétendre connaître les intentions de la nature.
