lessons:
- id: kant-cfj-analytique-l1
  title: "Repérage : le plan de l'Analytique (§61-68)"
  notes: |-
    L'**Analytique de la faculté de juger téléologique** cherche ce qui, dans la nature, mérite le nom de {violet}**« fin naturelle »**{/violet}, et à quel titre on peut en juger. Elle avance par élimination, puis par extension : {green}__seuls les êtres organisés doivent être pensés comme des fins de la nature__{/green}, et leur maxime peut s'étendre à la nature entière, {red}sans jamais devenir une connaissance de la production des choses{/red}.

    | Mouvement | Lieu | Ce qui s'y joue |
    | poser la question de la finalité objective | §61 | juger la nature d'après des fins est légitime, mais seulement pour la faculté de juger réfléchissante |
    | écarter les fausses finalités | §62-63 | ni la fécondité des figures géométriques ni l'utilité d'une chose pour une autre ne prouvent une fin de la nature |
    | définir la fin naturelle : l'être organisé | §64-65 | une chose est fin naturelle quand ses parties se produisent les unes les autres et produisent le tout, ce que ne fait aucune machine |
    | tirer la maxime et l'étendre à la nature | §66-68 | rien n'est en vain dans un être organisé ; la nature entière peut alors se juger comme un système des fins, sans Dieu en physique |

    ! L'Analytique ne dit pas comment les êtres organisés sont produits : elle dit comment nous devons les juger.
