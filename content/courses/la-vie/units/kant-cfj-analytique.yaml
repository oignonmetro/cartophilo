- id: kant-cfj-analytique-l9
  title: "Repérage : de la maxime au système des fins (§66-68)"
  notes: |-
    Une fois la fin naturelle définie, Kant en tire le principe qui permet de la juger (§66), l'étend à la nature entière (§67), puis fixe la place de la téléologie dans la science de la nature (§68).

    | Paragraphe | Lieu | Ce qui s'y joue |
    | la maxime du jugement sur les organismes | §66 | rien n'est en vain dans un être organisé |
    | la nature comme système des fins | §67 | la maxime s'étend à la nature entière, à titre régulateur |
    | la téléologie dans la science de la nature | §68 | « fin de la nature », non « fin divine » : pas de Dieu en physique |
  tables:
  - table: paragraphe-lieu-ce-qui-s-y-joue
    exercises:
    - {kind: order, column: Lieu}
    - {kind: cell, column: Lieu}
