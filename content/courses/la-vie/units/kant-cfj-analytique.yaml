- id: kant-cfj-analytique-l3
  title: "Repérage : écarter les fausses finalités (§62-63)"
  notes: |-
    Avant de dire ce qu'est une fin naturelle, Kant écarte deux finalités qui en ont l'apparence : celle des figures géométriques, {pink}objective mais formelle{/pink} (§62), et celle de l'utilité, {red}relative et hypothétique{/red} (§63).

    | Moment | Lieu | Ce qui s'y joue |
    | la fécondité du cercle | §62 | une finalité objective et intellectuelle, qui ne suppose aucune fin |
    | c'est moi qui introduis la finalité | §62 | l'espace est un mode de représentation en moi |
    | beauté ou perfection des figures | §62 | une perfection relative ; seule la démonstration est belle |
    | utilité et convenance | §63 | la finalité relative, distincte de la finalité interne |
    | la chaîne des moyens | §63 | sans terme qui soit lui-même une fin, elle reste hypothétique |
    | le Groenlandais et le Lapon | §63 | dire que la nature les a pourvus serait un jugement audacieux et arbitraire |
