- id: arvie2-l2
  title: "Trois âmes, une hiérarchie cumulative"
  notes: |-
    **Trois types d'âme, pour trois grandes manières d'être en vie** (*De l'âme*, II, 3) :

    | Vivant | Âme | Ce qu'elle permet |
    | la plante | végétative | croître, se nourrir, dépérir |
    | l'animal | sensitive | sentir, et pour certains se mouvoir |
    | l'homme | rationnelle | penser et parler |

    **Une hiérarchie cumulative, et non seulement classificatoire** : {coral}chaque forme supérieure enveloppe les capacités des formes inférieures{/coral}. L'intellection caractérise la vie humaine {amber}sans abolir les fonctions végétatives et animales qu'elle intègre{/amber}. Aristote le dit par une analogie avec {yellow}les figures géométriques{/yellow} : {teal}« {/teal}tout comme {teal}le quadrilatère contient le triangle en puissance{/teal}, l'âme sensitive contient en puissance l'âme végétative et l'âme intellective contient en puissance à la fois l'âme végétative et l'âme sensitive » (414b28-32). Pouvoir penser et vouloir renferme le pouvoir de se nourrir, croître, se mouvoir, percevoir.

    **Une tripartition souple : la continuité des formes de vie** (*Histoire des animaux*, VIII) : {teal}« Ainsi la nature passe petit à petit des êtres inanimés aux animaux{/teal}, de sorte que, du fait de cette continuité, {teal}on n'aperçoit pas la frontière entre eux{/teal} ni auquel des deux groupes la forme moyenne appartient. [...] cette famille prise comme un tout, comparée aux autres corps, apparaît en quelque sorte {teal}comme animée et comme inanimée comparée aux animaux »{/teal}.

    **Les plantes sont à la frontière de la vie** : comparées aux corps inertes, elles paraissent {green}vivantes ({blue}*empsuchon*{/blue}){/green} ; comparées aux animaux, {pink}presque inanimées ({blue}*apsuchon*{/blue}){/pink}. Et certains animaux ont plus de sensation, de mémoire, d'intelligence pratique, de sociabilité que d'autres. {coral}Les seuils fonctionnels (nutrition, sensation, pensée) ne doivent pas oblitérer la continuité entre les formes de vie.{/coral}
  points:
  - id: arvie2-l2-p2
    sentence: "La hiérarchie des âmes est ___ et **pas seulement classificatoire** : chaque forme supérieure de vie enveloppe les capacités des formes inférieures."
    answer: "cumulative"
    alt: []
  - id: arvie2-l2-p8
    sentence: "__L'intellection caractérise la vie humaine__ sans ___ les **fonctions végétatives et animales** qu'elle intègre."
    answer: "abolir"
    alt: []
  - id: arvie2-l2-p3
    sentence: "*De l'âme*, II, 3 : __comme le__ ___ __contient le triangle en puissance__, l'âme sensitive contient en puissance **l'âme végétative**."
    answer: "quadrilatère"
    alt: []
  - id: arvie2-l2-p4
    sentence: "*Histoire des animaux*, VIII : « Ainsi la nature passe **petit à petit** des êtres inanimés aux animaux, de sorte que, du fait de cette ___, __on n'aperçoit pas la frontière entre eux__ »."
    answer: "continuité"
    alt: []
