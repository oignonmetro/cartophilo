    answer: "réflexe"
    alt: []
- id: arvie2-l5
  title: "Caractères et comportements des animaux"
  notes: |-
    **La nature de l'animal détermine en bonne part sa manière d'agir.** Aristote dégage des dispositions affectives stables, le {violet}caractère{/violet} ({blue}*èthos*{/blue}), qui orientent l'action des animaux d'une même espèce (*Histoire des animaux*, I, 1), à travers des conduites régulières :
    - {yellow}la prudence de la biche{/yellow}, qui choisit un lieu protégé pour mettre bas ;
    - {yellow}l'affection maternelle de la jument{/yellow}, qui prend en charge le poulain d'une autre ;
    - {yellow}la ruse de la seiche{/yellow}, qui use de son encre pour se dissimuler.

    **Ce caractère n'est pas immuable : l'action peut le transformer.** {yellow}Les poules qui ont vaincu un coq{/yellow} se mettraient à chanter comme lui, chercheraient à le couvrir, prendraient des traits masculins (*Histoire des animaux*, IX, 49). Mais {red}c'est encore la nature de l'espèce qui dicte ce changement{/red}, puisqu'on l'observe dans l'espèce. Un animal peut-il être à l'origine d'un comportement nouveau, *à titre individuel* ?

    **Oui, par les comportements acquis.** Les animaux qui ont, en plus de la sensation, {amber}la mémoire et l'imagination{/amber}, repèrent des similitudes entre une situation passée et la présente, et adaptent leur conduite. {yellow}Le silure{/yellow} qui s'est accoutumé aux hameçons ne délaisse pas les petits poissons, {teal}« {/teal}mais donne un coup de dents, qu'il a très dures, le plus fort possible et {teal}détruit les hameçons »{/teal} (*Histoire des animaux*, VIII, 36).

    **Mais ni réflexion ni délibération.** Aristote parle de {violet}vécu{/violet} ({blue}*peira*{/blue}), d'{violet}habitude{/violet} ({blue}*sunètheia*{/blue}), de comportements singuliers, qui s'expliquent par des mécanismes psychologiques. {yellow}Le chameau qui mord son gardien{/yellow}, après avoir découvert qu'on l'avait amené par ruse à s'accoupler avec sa mère (IX, 47), s'explique par un jeu de passions rendu possible par la mémoire et l'imagination. {sky}Labarrière{/sky} : {teal}« {/teal}Sans doute marqué par ce souvenir et désireux de se venger, ce jeune chameau a-t-il, en effet, vu apparaître dans son âme {teal}une {blue}*phantasia*{/blue} lui faisant vivre par avance l'action{/teal} qu'il projetait d'accomplir, et sans doute également cette {blue}*phantasia*{/blue} {teal}lui procura-t-elle du plaisir »{/teal}.
  points:
  - id: arvie2-l5-p1
    sentence: "Aristote dégage chez les animaux d'une même espèce **des dispositions affectives stables**, leur caractère, en grec *___*."
    answer: "èthos"
    alt: ["ethos", "êthos"]
  - id: arvie2-l5-p2
    sentence: "__Exemples du caractère naturel d'une espèce__ : la prudence de la biche, l'affection maternelle de la jument, la **ruse** de la ___, qui use de son encre."
    answer: "seiche"
    alt: []
  - id: arvie2-l5-p3
    sentence: "Les ___ qui ont vaincu un coq se mettraient à chanter comme lui : __le caractère naturel n'est pas immuable__, **l'action peut le transformer**."
    answer: "poules"
    alt: []
  - id: arvie2-l5-p8
    sentence: "Que les poules qui ont vaincu un coq chantent comme lui, on l'observe dans l'espèce : c'est encore la ___ **de l'espèce** qui dicte ce changement."
    answer: "nature"
    alt: []
  - id: arvie2-l5-p5
    sentence: "__Les comportements acquis supposent__, en plus de la sensation, la **mémoire** et l'___, qui permettent de repérer des similitudes entre une situation passée et la présente."
    answer: "imagination"
    alt: []
  - id: arvie2-l5-p4
    sentence: "__Exemple de comportement acquis__ : accoutumé aux **hameçons**, le ___ ne délaisse pas les petits poissons, mais donne un coup de dents et détruit les hameçons (*Histoire des animaux*, VIII, 36)."
    answer: "silure"
    alt: []
  - id: arvie2-l5-p6
    sentence: "Pour les animaux, Aristote parle de **vécu**, *peira*, et d'**habitude**, *___*, __sans réflexion ni délibération__."
    answer: "sunètheia"
    alt: ["sunetheia", "sunêtheia"]
  - id: arvie2-l5-p7
    sentence: "Labarrière : **le chameau qui mord son gardien** a vu apparaître dans son âme une *phantasia* __lui faisant vivre par__ ___ __l'action qu'il projetait__."
    answer: "avance"
    alt: []
- id: arvie2-l6
  title: "L'intelligence pratique des animaux, et l'homme qui agit"
  notes: |-
    **Être privé de raison n'est pas être privé d'intelligence** ({sky}Labarrière{/sky}). Pour Aristote, l'animal sans {blue}*logos*{/blue} est seulement incapable de {red}délibération rationnelle ({blue}*bouleusis*{/blue}){/red} et de {red}choix réfléchi ({blue}*prohairesis*{/blue}){/red}. Mais il existe {green}une intelligence animale, pratique{/green}, la {blue}*phronèsis*{/blue} : {amber}perceptive et située{/amber}, liée aux besoins vitaux et au mode de vie de chaque espèce, capacité de prévision rendue possible par la sensation, la mémoire et l'imagination, qui permet à l'animal de faire ce qui est bon pour lui. C'est grâce à elle que {yellow}l'abeille{/yellow} fabrique et conserve son miel, construit des ruches, fait œuvre commune.

    **Elle libère l'animal de la réaction mécanique** : il peut ne pas répondre aussitôt à un stimulus, tirer parti d'une expérience, anticiper, modifier sa conduite en vue d'une fin.

    **Ce qui reste fixé par l'espèce : le désirable.** La nature spécifique définit ce qui est désirable pour l'animal : {yellow}une tique{/yellow} ne désire pas les mêmes choses qu'un homme, d'autant que la {blue}*phantasia*{/blue} dépend de la sensation. Aristote ménage cependant des comportements originaux.

    **L'homme seul agit, au sens strict.** Doué de raison, il peut agir de manière réfléchie et volontaire : il est le seul animal dont on peut dire qu'{coral}il agit{/coral} (*Éthique à Eudème*, II, 6), parce qu'{coral}il décide du principe de son action{/coral} (*Éthique à Nicomaque*, VI, 2). Agent libre, il veut une fin plutôt qu'une autre et délibère sur les moyens. {red}Mais cette liberté a un prix{/red} : vivre signifie pour lui {amber}être responsable de ses choix de vie{/amber}.
  points:
  - id: arvie2-l6-p7
    sentence: "Labarrière : être **privé de raison** n'est pas être privé d'___."
    answer: "intelligence"
    alt: []
  - id: arvie2-l6-p1
    sentence: "__Pour Aristote, les animaux privés de raison sont seulement incapables__ de délibération rationnelle, *bouleusis*, et de **choix réfléchi**, *___*."
    answer: "prohairesis"
    alt: ["proairesis"]
  - id: arvie2-l6-p2
    sentence: "__Il existe une intelligence animale, pratique__, **perceptive et située**, la *___*, qui permet à l'animal de faire ce qui est bon pour lui."
    answer: "phronèsis"
    alt: ["phronesis", "phronêsis"]
  - id: arvie2-l6-p3
    sentence: "C'est grâce à son **intelligence pratique** que l'___ fabrique du miel qu'elle conserve, construit des ruches et fait œuvre commune."
    answer: "abeille"
    alt: []
  - id: arvie2-l6-p8
    sentence: "__L'intelligence pratique libère l'animal de la réaction__ ___ : il peut ne pas répondre aussitôt à un stimulus, **anticiper**, modifier sa conduite en vue d'une fin."
    answer: "mécanique"
    alt: []
  - id: arvie2-l6-p4
    sentence: "__La nature spécifique définit ce qui est désirable pour un animal__ : une ___ ne sera pas portée à désirer **les mêmes choses qu'un homme**."
    answer: "tique"
    alt: []
  - id: arvie2-l6-p5
    sentence: "L'**homme** est le seul animal dont on peut dire qu'il agit, au sens strict, parce qu'__il décide du__ ___ __de son action__."
    answer: "principe"
    alt: []
