- id: arvie2-l4
  title: "Automoteur, mais autonome ?"
  notes: |-
    **L'animal se meut, mais dépend de son environnement, de ses sensations, de ses représentations.** Peut-il être un agent autonome, si le principe de son action est {red}ce qu'il se représente comme un bien ou un mal, hors de lui{/red} ?

    **Le désir est une activité propre de l'animal.** Contre une lecture qui ferait du mouvement animal {red}une réaction mécanique{/red} à l'environnement, {sky}David Furley{/sky} (« Self Movers ») soutient que le désir ne meut l'animal qu'à condition que l'objet soit {amber}perçu comme désirable par la faculté de représentation{/amber} : {coral}c'est dans l'animal, et non hors de lui, que le mouvement trouve son origine{/coral}. {sky}Pierre-Marie Morel{/sky} en souligne le mérite : {teal}« {/teal}le désir, bien qu'il soit en un sens mû ou "ému" par son objet, {teal}demeure une activité propre de l'animal{/teal}. Le gain théorique de cette solution n'est pas seulement psychophysique, {teal}il est aussi éthique{/teal} : elle montre en effet que {teal}je peux agir en fonction d'événements extérieurs sans cesser d'être le sujet responsable{/teal} et volontaire, de mes propres actions ».

    **Mais l'animal ne serait-il pas un automate naturel, très perfectionné ?** Non, grâce à la distinction du naturel et de l'artificiel. {coral}La nature oriente l'action de l'animal sans la déterminer actuellement{/coral} : le mouvement naturel peut n'être {green}qu'une tendance à réaliser tel mouvement{/green}, et non {red}un mouvement automatique qui s'effectue nécessairement, comme un réflexe{/red}. Les animaux automoteurs sont {amber}bien plus que de simples automates{/amber}.
  points:
  - id: arvie2-l4-p1
    sentence: "David ___, dans « Self Movers », soutient que __le désir ne meut l'animal qu'à condition que l'objet soit perçu comme désirable__ par la faculté de représentation."
    answer: "Furley"
    alt: []
  - id: arvie2-l4-p2
    sentence: "__Pour Furley, contre une lecture mécanique__, c'est **dans l'animal, et non hors de lui**, que le mouvement trouve son ___ : dans le désir qu'il se forme."
    answer: "origine"
    alt: []
  - id: arvie2-l4-p3
    sentence: "Morel : le désir, **bien qu'il soit en un sens mû par son objet**, « demeure une activité ___ de l'animal »."
    answer: "propre"
    alt: []
  - id: arvie2-l4-p4
    sentence: "Morel : le gain de la solution de Furley n'est pas seulement psychophysique, il est aussi ___ : on peut **agir en fonction d'événements extérieurs en restant sujet responsable**."
    answer: "éthique"
    alt: []
  - id: arvie2-l4-p5
    sentence: "__L'animal n'est pas un automate naturel__, car **la nature oriente son action sans la déterminer** : le mouvement naturel peut n'être qu'une ___ à réaliser tel mouvement."
    answer: "tendance"
    alt: []
  - id: arvie2-l4-p6
