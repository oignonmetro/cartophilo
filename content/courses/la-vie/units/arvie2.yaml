lessons:
- id: arvie2-l1
  title: "Vivre se dit de plusieurs manières"
  notes: |-
    **Le « fait de vivre » ({blue}*tou zèn*{/blue}) distingue le vivant de l'inerte, et s'explique par la possession d'une âme** (*De l'âme*, II, 2) : {teal}« {/teal}ce qui distingue l'animé de l'inanimé, {teal}c'est le fait de vivre{/teal}. Or {teal}le fait de vivre s'entend de plusieurs manières{/teal}. Nous disons qu'il y a vie là où se trouve {teal}ne serait-ce qu'une seule de ces manifestations{/teal}, comme l'intellection, la sensation, le mouvement et le repos selon le lieu ou encore le mouvement qu'implique la nutrition, et enfin le dépérissement et la croissance. » {coral}Une seule suffit : la plante, qui ne fait que se nourrir et croître, vit.{/coral}

    **L'âme est un ensemble de facultés**, qu'Aristote énumère pour les répartir selon les vivants (*De l'âme*, II, 3) :

    | Faculté | Terme grec |
    | nutritive | threptikon |
    | désirante | orektikon |
    | sensitive | aisthetikon |
    | locomotrice | kinètikon kata topon |
    | réflexive | dianoètikon |

    Tous les vivants n'ont pas les mêmes capacités, donc pas la même âme : {amber}être en vie ne signifie pas la même chose pour chacun{/amber}.
  points:
  - id: arvie2-l1-p7
    sentence: "__Ce qui distingue le vivant de l'inerte__ est « le fait de vivre », en grec *tou ___*, qui s'explique par la possession d'une **âme**."
    answer: "zèn"
    alt: ["zên", "zen"]
