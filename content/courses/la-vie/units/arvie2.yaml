- id: arvie2-l3
  title: "Comment l'animal se meut : sensation, imagination, désir"
  notes: |-
    **Le propre de l'animal : la sensation, et pour la plupart la locomotion.** La nature est un principe interne de mouvement, et {coral}l'animal seul est capable de se mouvoir de lui-même{/coral} (*Physique*, VIII, 4) : il se déplace pour se nourrir, fuir le danger, s'accoupler, s'occuper de ses petits. La {violet}sensation{/violet} ({blue}*aisthèsis*{/blue}) le distingue de la plante : elle discrimine des qualités, et procure plaisir ou peine. {yellow}Les moules et les huîtres{/yellow}, qui ne se déplacent pas, sont bien des animaux, car elles sentent (*Histoire des animaux*, IV, 4).

    **S'y ajoutent, chez d'autres, mémoire et imagination.** La {violet}mémoire{/violet} conserve une trace des sensations passées sous forme de souvenirs ; l'{violet}imagination{/violet} ({blue}*phantasia*{/blue}) produit des images, se représente les objets même absents. L'animal doué d'imagination peut se représenter un objet {green}comme désirable{/green}, ou {red}comme à craindre et à fuir{/red}.

    **Le désir, cause ultime du mouvement.** L'imagination {teal}« prépare le désir »{/teal} ({blue}*orexis*{/blue}) ({sky}Labarrière{/sky}), faculté proprement motrice : {teal}« Les animaux tendent au mouvement et à l'action, parce que le désir est la cause ultime du mouvement{/teal} et qu'il se produit {teal}par l'intermédiaire de la sensation, de l'imagination ou de la pensée »{/teal} (*Mouvement des animaux*, 7). {yellow}Voir une proie, l'imaginer, y penser{/yellow} ne suffit pas à mettre l'animal en mouvement ; {coral}il faut encore qu'il désire l'obtenir{/coral}.

    **Le versant physiologique : le cœur.** Le {violet}cœur{/violet}, ou son équivalent, est le moteur de l'action : il est littéralement {teal}« ému »{/teal} par l'objet désirable, qu'il meut à son tour. Il est {amber}un point fixe, un moteur immobile{/amber}, comme {yellow}la rotule{/yellow} permet le mouvement de la jambe en restant fixe. Le mouvement effectif vient d'un {teal}« souffle vital »{/teal} ({blue}*pneuma sumphuton*{/blue}), qui se contracte ou se dilate pour la poussée et la traction. Aristote défend un {violet}cardiocentrisme{/violet} : le cœur est principe de la vie, du mouvement et de la sensation, {red}le cerveau étant ravalé à une fonction de refroidissement{/red}. Mais {coral}le principe de l'animal reste son âme{/coral}, dont les organes ne sont que les instruments (le grec {blue}*organon*{/blue} désigne aussi bien l'organe que l'outil).
  points:
  - id: arvie2-l3-p1
    sentence: "La nature est un principe interne de mouvement, et __seul l'__ ___ **est capable de se mouvoir de lui-même** (*Physique*, VIII, 4)."
    answer: "animal"
    alt: []
  - id: arvie2-l3-p10
    sentence: "__Ce qui distingue l'animal de la plante__ : la **sensation**, en grec *___*, qui discrimine des qualités et procure plaisir ou peine."
    answer: "aisthèsis"
    alt: ["aisthesis", "aisthêsis"]
  - id: arvie2-l3-p2
    sentence: "Les **moules et les huîtres**, qui ne se déplacent pas, sont pourtant des animaux, parce qu'elles possèdent la ___."
    answer: "sensation"
    alt: []
  - id: arvie2-l3-p3
    sentence: "L'**imagination**, en grec *___*, est la capacité de produire des images et de se représenter des objets **même en leur absence**."
    answer: "phantasia"
    alt: []
  - id: arvie2-l3-p4
    sentence: "Selon Labarrière, l'**imagination** « prépare le ___ » (*orexis*), faculté proprement motrice de l'animal."
    answer: "désir"
    alt: []
  - id: arvie2-l3-p5
    sentence: "*Mouvement des animaux*, 7 : « **le désir** est la cause ___ du mouvement », et il se produit par l'intermédiaire de la sensation, de l'imagination ou de la pensée."
