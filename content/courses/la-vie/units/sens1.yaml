- id: sens1-l2
  title: "L'âme, principe de vie"
  notes: |
    La sensibilité est une faculté centrale de la « psychologie » d'Aristote, son discours (`logos`) sur l'âme (`psuchè`). De manière étonnante pour nous, l'étude de l'âme n'y est pas « métaphysique » : cette habitude vient de la tradition **chrétienne** et de sa manière de penser la relation de l'âme et du corps, où l'âme est un objet mystérieux, au statut ontologique flou, décisif pour penser ce que « je » suis.

    Aristote conçoit d'abord l'âme comme **le principe qui fait que les vivants sont en vie**. La psychologie est une partie de la **biologie** : elle étudie les « puissances » ou « facultés » (`dunameis`) propres au vivant, qui le distinguent de l'inerte (nutrition, reproduction, sensibilité, appétit, intelligence ou `nous`, motricité). « Il y a vie là où se trouve ne serait-ce qu'une seule quelconque des manifestations telles que l'intelligence, la sensation, le mouvement local et le repos, ou encore le mouvement nutritif, dépérissement et croissance. » (*De l'âme*, II, 2)

    Les développements sur la sensibilité sont quantitativement sans égal :

    | Faculté      | *De l'âme*                     | *Parva naturalia*            |
    | Sensibilité  | neuf chapitres (II, 5 à III, 2) | tout le *De la sensation et des sensibles*, sept chapitres |
    | Nutrition    | un chapitre (II, 4)            | jamais abordée en propre     |
    | Intelligence | trois chapitres (III, 4-6)     | aucun développement propre   |

    Les *Parva naturalia* (*Petits traités d'histoire naturelle*) prolongent le *De l'âme* sur certaines facultés (sensibilité, mémoire) et des faits zoologiques transversaux (sommeil, rêves, longévité, mort des animaux).

    Cette importance quantitative reflète une **double importance théorique** : la sensibilité fait la spécificité du règne animal, littéralement la manière de vivre des animaux ; et, surtout, elle fonde la diversité des autres opérations (désir, imagination, remémoration, intelligence), qui toutes « dérivent » à leur manière de la sensation.

    ! Pour Aristote, l'âme n'est pas un objet mystérieux distinct du vivant : c'est son principe de vie.
