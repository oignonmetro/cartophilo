- id: sens1-l3
  title: "Le critère de l'animal"
  notes: |
    Tous les vivants ont une âme, mais tous n'ont pas toutes ses facultés. Aristote a une conception **extensive** du vivant : contre de nombreux Grecs, qui font de la respiration « la norme de la vie » et excluent par là les plantes (qui, pour eux, ne respirent pas), il tient les plantes pour vivantes. La « norme de la vie » est pour lui la faculté de **se nourrir**, dont découle celle de se reproduire : la nutrition maintient la vie dans le temps au niveau de l'individu, la reproduction au niveau de l'espèce.

    Les animaux ont davantage de facultés (mobilité, mémoire, plaisir et douleur, donc désir et crainte), au point qu'il y a un **saut de nature**, et non une simple différence de degré, entre règne végétal et règne animal. Ce qui fonde ce saut, c'est la sensibilité : tous les animaux l'ont, aucune plante ne l'a. Même les plus simples, que la biologie moderne nommera « zoophytes », comme les éponges de mer, ont au moins le toucher, vraisemblablement aussi le goût. D'autres facultés n'appartiennent qu'à certains animaux : l'intelligence à l'homme, la motricité à ceux qui ne sont pas, comme les huîtres, fixés.

    « Donc c'est en vertu de ce principe [la nutrition] que la vie est dévolue aux vivants, bien que l'animal soit fondamentalement identifiable grâce au critère de la sensation. » (*De l'âme*, II, 2) ; « c'est par cela que nous distinguons ce qui est animal et ce qui ne l'est pas » (*De la sensation et des sensibles*, 1).

    | Vivant  | Facultés                          | Cas limite                        |
    | Plante  | nutrition, reproduction           |                                   |
    | Animal  | + sensibilité, au moins le toucher | l'éponge de mer, zoophyte ; l'huître, sans motricité |
    | Homme   | + intelligence (`nous`)           |                                   |

    ! La sensibilité n'est pas une propriété de plus parmi d'autres : elle fonde la division même du domaine vivant.
