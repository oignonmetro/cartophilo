id: sens1
title: "La place de la sensibilité"
subtitle: "La faculté de sentir, critère de l'animal et fondement de sa psychologie"
icon: compass
color: teal
group: "Aristote : la sensibilité"
lessons:
- id: sens1-l1
  title: "Une faculté de l'âme"
  notes: |
    Parmi les sens que l'on donne aujourd'hui à « sensibilité », Aristote privilégie la **faculté de sentir** : celle que possèdent certains vivants, les animaux à l'exclusion des plantes, et qui leur permet de sentir les qualités sensibles des choses qui les entourent.

    Contrairement à une attitude très répandue dans l'histoire de la philosophie, son intérêt n'est **pas d'abord critique** : il ne cherche pas au premier chef à savoir si la sensibilité trompe ou si elle produit des connaissances. Cet intérêt est d'abord **biologique** (une faculté du vivant) et plus précisément **psychologique** (la sensation est l'une des opérations fondamentales de l'âme, en rapport singulier avec ses autres facultés). Aristote en tire des considérations gnoséologiques, mais ce n'est pas le but principal de sa théorie.

    La sensation est centrale pour l'existence de l'animal : elle est le critère qui l'identifie au sein du vivant, mais surtout la manière dont il se rapporte au monde.

    L'exposé suit quatre temps :
    - pourquoi la sensibilité occupe une place centrale dans la pensée du vivant ;
    - un unique mécanisme, la sensation, analogue pour tous les sens ;
    - la pluralité des sens, irréductible, face à l'unité de la sensibilité ;
    - la sensibilité, fondement de la vie psychique complexe des animaux.

    ! « Sensibilité » ne désigne pas ici l'affectivité ni le goût esthétique, mais d'abord la faculté de sentir.
