- id: sens1-l4
  title: "Sensibilité, psychologie animale et intérêt pour l'animal"
  notes: |
    Désirer et craindre (la faculté **appétitive**) sont aussi communs à tous les animaux, mais ils « dérivent » de la sensibilité : c'est **dans** le contenu de ses sensations que l'animal trouve du plaisant et du douloureux, qu'il peut dès lors désirer ou craindre. La sensibilité est la condition de l'appétitif, sans s'y réduire : goûter une saveur n'est pas la même chose que désirer manger tel plat. La sensation est une condition nécessaire et suffisante pour éprouver désir et crainte.

    De même pour l'imagination (`phantasia`) et la remémoration, et même, en un sens, pour la motricité (qui implique le désir) et l'intelligence (`nous`, qui implique l'imagination, faculté de se représenter une qualité sensible **absente**). Chaque faculté a ses objets et ses opérations propres ; mais aucune n'existe hors d'un être sensible. La sensibilité est la **condition de possibilité** de toute la psychologie animale.

    D'où l'importance de l'animal : la majorité du corpus biologique d'Aristote est zoologique, les plantes n'y sont qu'évoquées. On l'attribue souvent à une anecdote douteuse : Aristote et son disciple Théophraste se seraient partagé le vivant, les animaux au maître, les plantes au disciple, dont on a conservé plusieurs traités sur les plantes. Deux raisons théoriques sont plus probables :
    - l'animal est plus **complet** : davantage de « fonctions » (`erga`) et de « facultés » (`dunameis`), un plus grand « achèvement » (`teleion`) ;
    - le monde animal est plus **divers**, et l'attention à la diversité est un trait de la philosophie d'Aristote.

    Complétude et diversité sont l'effet de la sensibilité, qui ouvre l'animal à des opérations complexes et unifie cette diversité sous un seul critère, sa manière de vivre.

    ! Dire que les autres facultés « dérivent » de la sensation ne veut pas dire qu'elles s'y réduisent.
