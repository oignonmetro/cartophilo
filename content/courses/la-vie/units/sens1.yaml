- id: sens1-l3
  title: "Le critère de l'animalité"
  notes: |
    Pour Aristote, tous les vivants ont une âme, mais ils n'ont pas tous les mêmes facultés : l'âme se déploie plus ou moins richement selon les vivants, et chacun n'en possède qu'une partie.

    Aristote adopte **une conception étendue du vivant**. Pour de nombreux Grecs, {red}la respiration est « la norme de la vie »{/red}, c'est-à-dire ce qui permet de décider si un être est vivant ou non. Comme ils pensent que {red}les plantes{/red} ne respirent pas, ils les excluent du vivant (*De l'âme*, I, 2). 
    Aristote, lui, tient les plantes pour vivantes, car il place la norme de la vie ailleurs : dans **{green}la faculté de se nourrir, dont découle celle de se reproduire{/green}**. Ces deux facultés ont la même fonction, qui est de **{yellow}faire durer la vie{/yellow}**, mais à deux échelles différentes. La **nutrition **maintient la vie dans le temps __au niveau de l'individu__, tandis que la **reproduction **la maintient __au niveau de l'espèce__. Or les plantes se nourrissent et se reproduisent : elles sont donc vivantes.

    Les **animaux **possèdent, en plus de ces deux facultés, d'autres capacités : la __mobilité__, la __mémoire__, le __plaisir __et la __douleur__, et par conséquent le __désir __et la __crainte__. Ces capacités supplémentaires sont si importantes qu'entre le règne végétal et le règne animal, il y a **un saut de nature**, et pas seulement une différence de degré. Autrement dit, **un animal n'est pas une plante qui aurait simplement un peu plus de facultés** : c'est un être d'une autre sorte.

    Ce saut repose sur la **sensibilité**, que tous les animaux possèdent et qu'aucune plante ne possède (*De la sensation et des sensibles*, chap. 1). Même les animaux les plus simples, que la biologie moderne nommera {violet}« zoophytes »{/violet}, comme les éponges de mer, ont au moins le **toucher**, et vraisemblablement aussi le goût. Les autres facultés, en revanche, ne se rencontrent que chez certains animaux : **l'intelligence est propre à l'homme**, et la motricité n'appartient qu'aux animaux qui ne sont pas fixés, à la différence des huîtres.

    Ainsi, deux critères distincts sont à l'œuvre. {coral}La nutrition fait qu'un être est vivant, mais c'est la sensation qui fait qu'il est un animal.{/coral}

    | Vivant  | Facultés                          | Cas limite                        |
    | Plante  | nutrition, reproduction           |                                   |
    | Animal  | + sensibilité, au moins le toucher | l'éponge de mer, zoophyte ; l'huître, sans motricité |
    | Homme   | + intelligence (`nous`)           |                                   |

    ! La sensibilité n'est pas une propriété de plus parmi d'autres : elle fonde la **division **même du domaine vivant.
