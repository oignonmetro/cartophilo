- id: sens1-l4
  title: "Sensibilité, psychologie animale et intérêt pour l'animal"
  notes: |
    __Désirer __et __craindre__ (ce qu'Aristote appelle la **faculté appétitive**) sont, eux aussi, __communs à tous les animaux__, mais ils « dérivent » de la sensibilité. Autrement dit, c'est dans le **contenu de ses sensations** que l'animal rencontre du plaisant et du douloureux, et c'est parce qu'il les rencontre qu'il peut ensuite désirer l'un et craindre l'autre. La sensibilité est donc ce dont l'appétit dépend : **sans sensation, pas de désir ni de crainte**. Pour autant, l'appétit ne se réduit pas à la sensibilité, car goûter une saveur n'est pas la même chose que désirer manger tel plat.

    Le même rapport de dépendance vaut pour les autres facultés animales. L'**imagination **(*phantasia*), qui est la __faculté de se représenter une qualité sensible absente__, et la **remémoration **supposent la sensibilité. La **motricité **la suppose aussi, en un sens, puisqu'elle __implique le désir__, qui lui-même dérive de la __sensation__. Il en va de même pour l'**intelligence** (*nous*), qui implique l'**imagination**. Chaque faculté a certes ses objets et ses opérations propres, mais aucune ne peut exister chez un être qui ne sent pas. Ainsi, **la sensibilité est ce sur quoi repose toute la psychologie animale** : si on la retire, toutes les autres facultés disparaissent avec elle.

    On comprend dès lors pourquoi l'animal occupe une place centrale chez Aristote : la plus grande partie de ses {teal}écrits biologiques{/teal} porte sur les {teal}animaux{/teal}, et {pink}les plantes n'y sont qu'évoquées{/pink}. On explique souvent ce déséquilibre par une anecdote douteuse, selon laquelle Aristote et son disciple Théophraste se seraient partagé le vivant, les animaux revenant au maître et les plantes au disciple (on a d'ailleurs conservé plusieurs traités de Théophraste sur les plantes). Deux raisons théoriques sont plus probables :
    - L'animal est plus complet que la plante : il possède davantage de « fonctions » (*erga*) et de « facultés » (*dunameis*), et il atteint un plus grand « achèvement » (*teleion*).
    - **Le monde animal est plus divers que le monde végétal**, or l'attention à la diversité est un trait propre de la philosophie d'Aristote.

    Ces deux raisons ont en réalité la même origine. La complétude et la diversité de l'animal sont l'effet de la sensibilité : c'est elle qui ouvre l'animal à des opérations complexes, et c'est elle aussi qui unifie cette diversité sous un seul critère, la manière de vivre de chaque animal.

    ! Dire que les autres facultés « dérivent » de la sensation ne veut pas dire qu'elles s'y réduisent.
