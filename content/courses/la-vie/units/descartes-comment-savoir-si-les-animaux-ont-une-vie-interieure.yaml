id: descartes-comment-savoir-si-les-animaux-ont-une-vie-interieure
title: "Descartes : comment savoir si les animaux ont une vie intérieure ?"
subtitle: "lettre à Henry More du 5 février 1649, dite « Lettre à Morus », 5e réponse aux objections"
icon: page
color: coral
lessons:
- id: descartes-comment-savoir-si-les-animaux-ont-une-vie-interieure-l1
  title: "La pensée animale est une illusion anthropomorphique"
  notes: ""
  passage:
    label: "1"
    text: |-
      Mais il n'y a pas de préjugé auquel nous ne soyons tous plus accoutumés qu'à celui qui nous a persuadés depuis notre enfance que les bêtes pensent.

      Aucune raison ne nous a poussés à croire cela si ce n'est que, voyant la plupart des membres des bêtes, dans leur apparence et dans leurs mouvements, ne différer que peu des nôtres, et croyant d'autre part qu'il y a en nous un principe unique de ces mouvements, savoir l'âme, la même pour mouvoir le corps et pour penser, nous n'avons pas douté qu'une telle âme ne se trouve chez les bêtes.
  points: [{id: descartes-comment-savoir-si-les-animaux-ont-une-vie-interieure-l1-p1, sentence: "« Mais il n'y a pas de ___ auquel nous ne soyons tous plus accoutumés qu'à celui qui nous a persuadés depuis notre enfance que les bêtes pensent. »", answer: "préjugé", alt: []}, {id: descartes-comment-savoir-si-les-animaux-ont-une-vie-interieure-l1-p2, sentence: "« Mais il n'y a pas de préjugé auquel nous ne soyons tous plus accoutumés qu'à celui qui nous a persuadés depuis notre enfance que ___. »", answer: "les bêtes pensent", alt: []}, {id: descartes-comment-savoir-si-les-animaux-ont-une-vie-interieure-l1-p3, sentence: "« Mais il n'y a pas de préjugé auquel nous ne soyons tous plus accoutumés qu'à celui qui nous a ___ que les bêtes pensent. »", answer: "persuadés depuis notre enfance", alt: []}, {id: descartes-comment-savoir-si-les-animaux-ont-une-vie-interieure-l1-p4, sentence: "« Mais il n'y a pas de préjugé auquel nous ne soyons tous plus accoutumés qu'à celui qui nous a ___. »", answer: "persuadés depuis notre enfance que les bêtes pensent", alt: []}, {id: descartes-comment-savoir-si-les-animaux-ont-une-vie-interieure-l1-p5, sentence: "« Aucune raison ne nous a poussés à croire cela si ce n'est que, voyant la plupart des membres des bêtes, dans leur apparence et dans leurs mouvements, ___, et croyant d'autre part qu'il y a en nous un principe unique de ces mouvements, savoir l'âme, la même pour mouvoir le corps et pour penser, nous n'avons pas douté qu'une telle âme ne se trouve chez les bêtes. »", answer: "ne différer que peu des nôtres", alt: []}, {id: descartes-comment-savoir-si-les-animaux-ont-une-vie-interieure-l1-p6, sentence: "« Aucune raison ne nous a poussés à croire cela si ce n'est que, voyant la plupart des membres des bêtes, dans leur apparence et dans leurs mouvements, ne différer que peu des nôtres, et croyant d'autre part qu'il y a en nous un principe unique de ces mouvements, savoir l'âme, la même pour mouvoir le corps et pour penser, ___. »", answer: "nous n'avons pas douté qu'une telle âme ne se trouve chez les bêtes", alt: []}]
- id: descartes-comment-savoir-si-les-animaux-ont-une-vie-interieure-l2
  title: "2"
  notes: ""
  passage:
    label: "2"
    text: "Mais après avoir remarqué qu'il faut distinguer deux principes différents des mouvements ; l'un tout mécanique et corporel, qui dépend de la seule force des esprits animaux et de la seule conformation des membres, et qui peut être appelé âme corporelle ; l'autre incorporel, savoir l'esprit ou cette âme que j'ai définie substance pensante, j'ai recherché plus soigneusement si les mouvements des esprits animaux procédaient de ces deux principes, ou d'un principe seulement. Et après avoir vu clairement que tous ces mouvements pouvaient procéder du seul principe corporel et mécanique, j'ai tenu pour certain et pour démontré que nous ne pourrions prouver en aucune manière qu'il y a une Âme pensante chez les bêtes. Je ne m'attarde ni sur les ruses, ni sur les finesses des chiens et des renards, ni sur tout ce que les bêtes peuvent faire pour la nourriture, pour l'amour, ou par crainte. Je me fais fort en effet d'expliquer très facilement tout cela comme effets de la seule conformation des membres."
  points: [{id: descartes-comment-savoir-si-les-animaux-ont-une-vie-interieure-l2-p1, sentence: "« Mais après avoir remarqué qu'il faut distinguer ___ ; l'un tout mécanique et corporel, qui dépend de la seule force des esprits animaux et de la seule conformation des membres, et qui peut être appelé âme corporelle ; l'autre incorporel, savoir l'esprit ou cette âme que j'ai définie substance pensante, j'ai recherché plus soigneusement si les mouvements des esprits animaux procédaient de ces deux principes, ou d'un principe seulement. »", answer: "deux principes différents des mouvements", alt: []}, {id: descartes-comment-savoir-si-les-animaux-ont-une-vie-interieure-l2-p2, sentence: "« Et après avoir vu clairement que ___, j'ai tenu pour certain et pour démontré que nous ne pourrions prouver en aucune manière qu'il y a une Âme pensante chez les bêtes. »", answer: "tous ces mouvements pouvaient procéder du seul principe corporel et mécanique", alt: []}]
- id: descartes-comment-savoir-si-les-animaux-ont-une-vie-interieure-l3
  title: "2"
  notes: ""
  passage:
    label: "3"
    text: "Bien que je tienne pour démontré qu'on ne peut prouver qu'il y a une pensée chez les bêtes, je ne crois pas cependant qu'on puisse démontrer qu'il n'y en a pas, parce que l'esprit humain ne pénètre pas leur cœur. Mais, en examinant ce qui est le plus probable en cette matière, je ne vois aucun argument militer en faveur de la pensée des bêtes, sauf un seul, à savoir, qu'ayant des yeux, des oreilles, une langue, et les autres organes des sens comme nous, il est vraisemblable qu'elles sentent comme nous ; et que la pensée étant impliquée dans notre manière de sentir, il faut attribuer même aux bêtes une pensée semblable. Cet argument, étant très naturel, a pénétré l'esprit de tous les hommes, depuis toujours. Mais il y a d'autres arguments, beaucoup plus nombreux et plus forts, quoique moins familiers pour l'ensemble des hommes, qui nous persuadent du contraire. Parmi lesquels se range en bonne place celui qui soutient qu'il y a moins de probabilité pour que tous les vers, les moucherons, les chenilles, et le reste des animaux soient doués d'une âme immortelle que pour qu'ils se meuvent à l'imitation des machines."
  points: [{id: descartes-comment-savoir-si-les-animaux-ont-une-vie-interieure-l3-p1, sentence: "« Bien que je tienne pour démontré qu'___, je ne crois pas cependant qu'on puisse démontrer qu'il n'y en a pas, parce que l'esprit humain ne pénètre pas leur cœur. »", answer: "on ne peut prouver qu'il y a une pensée chez les bêtes", alt: []}, {id: descartes-comment-savoir-si-les-animaux-ont-une-vie-interieure-l3-p2, sentence: "« Bien que je tienne pour démontré qu'on ne peut prouver qu'il y a une pensée chez les bêtes, je ne crois pas cependant qu'on puisse ___, parce que l'esprit humain ne pénètre pas leur cœur. »", answer: "démontrer qu'il n'y en a pas", alt: []}, {id: descartes-comment-savoir-si-les-animaux-ont-une-vie-interieure-l3-p3, sentence: "« Bien que je tienne pour démontré qu'on ne peut prouver qu'il y a une pensée chez les bêtes, ___, parce que l'esprit humain ne pénètre pas leur cœur. »", answer: "je ne crois pas cependant qu'on puisse démontrer qu'il n'y en a pas", alt: []}, {id: descartes-comment-savoir-si-les-animaux-ont-une-vie-interieure-l3-p4, sentence: "« Bien que je tienne pour démontré qu'on ne peut prouver qu'il y a une pensée chez les bêtes, je ne crois pas cependant qu'on puisse démontrer qu'il n'y en a pas, parce que ___. »", answer: "l'esprit humain ne pénètre pas leur cœur", alt: []}, {id: descartes-comment-savoir-si-les-animaux-ont-une-vie-interieure-l3-p5, sentence: "« Bien que je tienne pour démontré qu'on ne peut prouver qu'il y a une pensée chez les bêtes, je ne crois pas cependant ___, parce que l'esprit humain ne pénètre pas leur cœur. »", answer: "qu'on puisse démontrer qu'il n'y en a pas", alt: []}, {id: descartes-comment-savoir-si-les-animaux-ont-une-vie-interieure-l3-p6, sentence: "« ___, parce que l'esprit humain ne pénètre pas leur cœur. »", answer: "Bien que je tienne pour démontré qu'on ne peut prouver qu'il y a une pensée chez les bêtes, je ne crois pas cependant qu'on puisse démontrer qu'il n'y en a pas", alt: []}, {id: desc