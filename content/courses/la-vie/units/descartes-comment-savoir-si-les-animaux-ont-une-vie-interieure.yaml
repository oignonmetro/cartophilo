e dans notre manière de sentir, il faut attribuer même aux bêtes ___. »", answer: "une pensée semblable", alt: []}, {id: descartes-comment-savoir-si-les-animaux-ont-une-vie-interieure-l3-p11, sentence: "« Mais, en examinant ce qui est le plus probable en cette matière, je ne vois aucun argument militer en faveur de la pensée des bêtes, sauf un seul, à savoir, qu'ayant des yeux, des oreilles, une langue, et les autres organes des sens comme nous, il est vraisemblable qu'elles sentent comme nous ; et que ___. »", answer: "la pensée étant impliquée dans notre manière de sentir, il faut attribuer même aux bêtes une pensée semblable", alt: []}]
- id: descartes-comment-savoir-si-les-animaux-ont-une-vie-interieure-l4
  title: "L'explication du comportement animal peut faire l'économie d'une psychologie animale"
  notes: ""
  passage:
    label: "4"
    text: "D'abord, parce qu'il est certain que, dans le corps des animaux, comme dans les nôtres, il y a des os, des nerfs, des muscles, du sang, des esprits et d'autres organes disposés de telle sorte que par eux-mêmes, sans aucune pensée, ils puissent produire tous les mouvements que nous observons chez les bêtes. Ce qui est évident dans les convulsions, lorsque, malgré l'esprit, la machinerie du corps se meut souvent d'elle-même et en des façons plus diverses qu'elle n'a coutume de le faire sous l'action de la volonté."
  points: [{id: descartes-comment-savoir-si-les-animaux-ont-une-vie-interieure-l4-p1, sentence: "« D'abord, parce qu'il est certain que, dans le corps des animaux, comme dans les nôtres, il y a des os, des nerfs, des muscles, du sang, des esprits et d'autres organes disposés de telle sorte que par eux-mêmes, ___, ils puissent produire tous les mouvements que nous observons chez les bêtes. »", answer: "sans aucune pensée", alt: []}, {id: descartes-comment-savoir-si-les-animaux-ont-une-vie-interieure-l4-p2, sentence: "« D'abord, parce qu'il est certain que, dans le corps des animaux, comme dans les nôtres, il y a des os, des nerfs, des muscles, du sang, des esprits et d'autres organes disposés de telle sorte que par eux-mêmes, sans aucune pensée, ils puissent ___. »", answer: "produire tous les mouvements que nous observons chez les bêtes", alt: []}, {id: descartes-comment-savoir-si-les-animaux-ont-une-vie-interieure-l4-p3, sentence: "« Ce qui est évident dans les convulsions, lorsque, malgré l'esprit, ___ se meut souvent d'elle-même et en des façons plus diverses qu'elle n'a coutume de le faire sous l'action de la volonté. »", answer: "la machinerie du corps", alt: []}, {id: descartes-comment-savoir-si-les-animaux-ont-une-vie-interieure-l4-p4, sentence: "« Ce qui est évident dans les convulsions, lorsque, malgré l'esprit, la machinerie du corps ___ et en des façons plus diverses qu'elle n'a coutume de le faire sous l'action de la volonté. »", answer: "se meut souvent d'elle-même", alt: []}]
- id: descartes-comment-savoir-si-les-animaux-ont-une-vie-interieure-l5
  title: "Le mouvement des animaux s'explique comme celui d'une machine"
  notes: ""
  passage:
    label: "5"
    text: "Ensuite parce que, du moment que l'art est un imitateur de la nature et que les hommes peuvent fabriquer des automates variés dans lesquels, sans aucune pensée, se trouve le mouvement, il semble conforme à la raison que la nature produise aussi ses automates, mais qui l'emportent de beaucoup sur les produits de l'art, à savoir toutes les bêtes ; surtout que nous ne voyons pas de raison pour que là où se trouve une conformation de membres telle que nous la voyons chez les animaux, doive se trouver aussi la pensée ; et qu'en conséquence il est plus digne d'admiration de trouver un esprit dans chaque corps humain que de n'en trouver aucun chez les bêtes."
  points: []
- id: descartes-comment-savoir-si-les-animaux-ont-une-vie-interieure-l6
  title: "La parole peut témoigner d'une vie intérieure, mais les animaux n'en ont pas"
  notes: ""
  passage:
    label: "6"
    text: "Mais de tous les arguments qui nous persuadent que les bêtes sont dénuées de pensée, le principal, à mon avis, est que bien que les unes soient plus parfaites que les autres dans une même espèce, tout de même que chez les hommes, comme on peut voir chez les chevaux et chez les chiens, dont les uns apprennent beaucoup plus aisément que d'autres ce qu'on leur enseigne ; et bien que toutes nous signifient très facilement leurs impulsions naturelles, telles que la colère, la crainte, la faim, ou autres états semblables, par la voix ou par d'autres mouvements du corps, jamais cependant jusqu'à ce jour on n'a pu observer qu'aucun animal en soit venu à ce point de perfection d'user d'un véritable langage, c'est-à-dire d'exprimer soit par la voix, soit par les gestes quelque chose qui puisse se rapporter à la seule pensée et non à l'impulsion naturelle. Ce langage est en effet le seul signe certain d'une pensée latente dans le corps ; tous les hommes en usent, même ceux qui sont stupides ou privés d'esprit, ceux auxquels manquent la langue et les organes de la voix, mais aucune bête ne peut en user ; c'est pourquoi il est permis de prendre le langage pour la vraie différence entre les hommes et les bêtes."
  points: []
- id: descartes-comment-savoir-si-les-animaux-ont-une-vie-interieure-l7
  title: "Les animaux sont sensibles et vivants mais sans pensée"
  notes: ""
  passage:
    label: "7"
    text: "Les autres arguments qui retirent la pensée aux bêtes, je les passe sous silence, pour être bref. Je voudrais cependant indiquer que je parle de la pensée, non de la vie ou de la sensibilité : je ne refuse la vie à aucun animal, car je crois qu'elle consiste dans la seule chaleur du cœur ; je ne lui refuse même pas la sensibilité, dans la mesure où elle dépend d'un organe corporel. Si bien que mon opinion est moins cruelle envers les bêtes qu'elle n'est pieuse envers les hommes qui ne sont plus asservis à la superstition des Pythagoriciens et qui sont délivrés du soupçon de crime toutes les fois qu'ils mangent ou tuent les animaux."
  points: []
