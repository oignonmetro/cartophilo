- id: intro1-l4
  title: "Deux impasses, et un point de départ"
  notes: |-
    **Cette première analyse laisse un concept de vie particulièrement instable, et deux impasses** : ce sont les deux leçons qui précèdent, mises face à face.
    - {pink}Accorder à l'objet le maximum d'originalité et d'autonomie{/pink} : on garde la vie, mais {coral}on se prive des moyens rigoureux de la connaître{/coral} (le « mystère »).
    - {red}Par réaction antimétaphysique, dissoudre sa singularité{/red} : on garde la rigueur, mais {coral}on perd l'objet même de l'enquête{/coral} (le vivant éparpillé).

    **D'où la méthode : commencer par la conception ordinaire de la vie.** Ce n'est pas une concession au sens commun, mais une exigence de la raison elle-même, que formule {sky}Canguilhem{/sky} (*La connaissance de la vie*) : {teal}« {/teal}un {teal}rationalisme raisonnable{/teal} doit savoir {teal}reconnaître ses limites{/teal} et {teal}intégrer ses conditions d'exercice »{/teal}. Or ces conditions, il les trouve dans {teal}« {/teal}la {teal}connaissance naïve »{/teal} des concepts qu'il met au travail, et c'est singulièrement vrai de la vie : la biologie ne s'est donné un objet qu'à partir de l'expérience commune du vivant. L'unité suivante part donc de cette conception ordinaire.
  points:
  - id: intro1-l4-p1
    sentence: "__Première des deux impasses du concept de vie__ : accorder à l'objet le **maximum d'originalité et d'autonomie**, au prix de se priver des moyens ___ de le connaître."
    answer: "rigoureux"
    alt: []
  - id: intro1-l4-p2
    sentence: "__Seconde des deux impasses du concept de vie__ : par réaction ___, **dissoudre la singularité** de la vie, jusqu'à perdre l'objet même de l'enquête."
    answer: "antimétaphysique"
    alt: []
  - id: intro1-l4-p6
    sentence: "__Entre la vie comme mystère et la vie dissoute dans le vivant__, la méthode consiste à partir de la conception ___ de la vie, parce que **la biologie elle-même s'est donné son objet** à partir d'elle."
    answer: "ordinaire"
    alt: ["commune"]
  - id: intro1-l4-p8
    sentence: "Partir de la conception ordinaire de la vie n'est pas une ___ au sens commun, mais **une exigence de la raison** elle-même."
    answer: "concession"
    alt: []
  - id: intro1-l4-p3
    sentence: "Canguilhem, *La connaissance de la vie* : « un rationalisme ___ __doit savoir reconnaître ses limites__ et intégrer ses conditions d'exercice »."
    answer: "raisonnable"
    alt: []
  - id: intro1-l4-p4
    sentence: "Canguilhem, *La connaissance de la vie* : « un rationalisme raisonnable doit savoir reconnaître ses limites et __intégrer ses conditions__ d'___ »."
    answer: "exercice"
