- id: intro1-l2
  title: "Le vivant des sciences : flou et dispersion"
  notes: |-
    **Étudier le seul vivant ne règle rien : les sciences elles-mêmes en donnent une image floue et dispersée.** Deux premières difficultés.

    **D'abord, le flou des frontières.** Biochimie, biologie, écologie donnent du vivant une image où {amber}la part du flou joue un rôle déterminant{/amber}, et sur deux plans :
    - les frontières entre les différents {violet}règnes{/violet} du vivant ne sont pas nettes ;
    - dès qu'on étudie {yellow}l'apparition des premières cellules{/yellow}, {yellow}l'« habitabilité » de la Terre{/yellow} ou les {yellow}états de la matière{/yellow}, c'est {coral}la distinction même entre vivant et non-vivant{/coral} qui perd sa netteté.

    L'Académie des sciences en tire la conséquence, à partir de l'évolution : {teal}« {/teal}L'évolutionnisme nous oblige ainsi à accepter qu'il existe {teal}un continuum entre toutes les espèces vivantes{/teal}. Pour les mêmes raisons, la séparation entre "systèmes non vivants" et "systèmes vivants" ne peut, elle aussi, qu'être {teal}conventionnelle{/teal}. [...] Tout se comprend donc dans {teal}une continuité entre l'inerte et le vivant{/teal}, la cellule et l'organisme entier, une espèce et une autre, etc.{teal} »{/teal} Autrement dit : si les espèces sortent les unes des autres par degrés, aucune coupure franche ne les sépare ; et si le vivant est sorti de l'inerte, la ligne qui les sépare est {coral}tracée par nous{/coral}, non trouvée dans les choses.

    **Ensuite, l'unité et l'autonomie des sciences de la vie.** Ces disciplines sont éparpillées, et certaines empruntent {red}à des sciences dont l'objet n'est pas le vivant{/red} leurs méthodes, et parfois une partie de leur contenu. Si la philosophie doit penser la vie en suivant ces sciences, le risque est {coral}la dissolution pure et simple de l'objet{/coral}. {sky}Canguilhem{/sky} pose la condition (*La connaissance de la vie*) : la biologie ne permet de {teal}« repenser ou rectifier des concepts philosophiques fondamentaux{/teal}, comme celui de vie » que si elle n'est pas {teal}« {/teal}fascinée par {teal}le prestige des sciences physico-chimiques{/teal}, réduite ou se réduisant {teal}au rôle de satellite de ces sciences »{/teal}. Une biologie devenue chimie appliquée n'a plus rien à dire de la vie.
  points:
