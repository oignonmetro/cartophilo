# Cours tiré de l'introduction du manuel collectif sur la vie : Ulysse
# Chaintreuil et Louis Rouquayrol, « Introduction : la vie comme problème
# philosophique », p. 15-37 (scan fourni par l'utilisateur, océrisé ; pages 20,
# 22 et 29 relues sur l'image). Voir content/philosophie.md, § « Un cours sur un
# auteur, tiré d'un commentaire » : pas de repérage de l'introduction elle-même,
# citations reprises telles que l'introduction les donne, avec ses références.
#
# Unités intro1 à intro5, une par grande partie : difficultés liminaires ;
# conception « ordinaire » ; vitalisme et ses concurrents ; questions
# pratiques ; autres usages. Le dernier paragraphe (présentation des chapitres
# du manuel) ne donne pas de carte. Les chapitres du manuel auxquels
# l'introduction renvoie (Fedi sur Bergson, Angleraux, Ribas sur Aristote,
# Proust sur le Phédon, Hacques, Lema Habash et Zaino sur Spinoza, Caillé sur
# Descartes et Leibniz, Messerlé sur Diderot, Depetris sur Canguilhem, Soutet,
# Farge sur Foucault, Chapuis, de Saxcé sur Augustin, Josset, Ballanfat) ne sont
# pas cités dans les rappels : ils feront leurs propres unités.

id: intro1
title: "Les difficultés du concept de vie"
subtitle: "Entre le mystère et la dissolution dans le vivant : pourquoi partir de la conception ordinaire"
icon: compass
color: amber
group: "La vie comme problème philosophique (introduction)"
lessons:
- id: intro1-l1
  title: "Cerner la vie par des oppositions"
  notes: |-
    **La vie est un défi pour toute entreprise de conceptualisation** : on l'a souvent répété depuis {sky}Canguilhem{/sky} (« Le concept et la vie », 1966). Et la question n'est pas réservée aux philosophes : {amber}les limites de ce qu'il faut tenir pour vivant{/amber}, {amber}les attributs qui conviennent à la vie{/amber} (la sensibilité ? la conscience ?), {amber}ses origines{/amber} occupent une place de choix dans les conversations ordinaires, surtout depuis que les questions écologiques sont devenues incontournables. Cette leçon montre la première manière de s'y prendre, et l'impasse où elle mène.

    **Une première méthode : gagner en précision par oppositions**, plus ou moins faciles, plus ou moins grossières. Chacune met en avant un trait de la vie en l'opposant à ce qui en est dépourvu :

    | La vie comme | Opposée à |
    | source d'activité | l'inerte |
    | principe d'organisation | l'inorganique |
    | douée de conscience | la matière brute |
    | facteur d'indétermination | un monde soumis aux lois physiques |
    | orientée par une fin immanente | les machines |

    **Ainsi présentée, la vie échappe à l'intelligence qui calcule.** Si la vie est ce qui {amber}n'est pas inerte{/amber}, {amber}pas soumis aux lois de la physique{/amber}, {amber}pas machinal{/amber}, alors {red}une intelligence dont la rigueur logique et l'exactitude mathématique sont le principal instrument{/red} ne peut la saisir adéquatement : ses instruments sont justement faits pour l'inerte, le déterminé, le mécanique. Il ne resterait que {pink}le raisonnement par analogie, l'intuition, une certaine empathie{/pink}, à employer avec la plus grande prudence, puisqu'à chaque étape les frontières de l'objet sont difficiles à fixer. Au bout du chemin, le risque : {coral}ne voir dans la vie qu'un simple « mystère »{/coral}.

    ! On a pu attribuer cette position à {sky}Bergson{/sky}, mais c'est une caricature : ses positions sont notablement plus subtiles.

    **La réaction inverse : abandonner la vie pour le vivant.** Si la vie est un mystère qui échappe par définition à la raison, la tentation est grande de {red}se débarrasser du concept de vie{/red}, aux résonances métaphysiques trop embarrassantes, pour étudier plus modestement {green}le vivant{/green}. N'est-ce pas ainsi que devraient procéder les sciences ? Les recherches sur le vivant, sur les conditions de son apparition et de sa perpétuation, sur des phénomènes vitaux comme {yellow}la croissance{/yellow} ou {yellow}la reproduction{/yellow}, permettraient à la biochimie, à la biologie, à l'écologie de construire leur objet en négligeant les {teal}« {/teal}aspects {teal}philosophiques, spirituels ou religieux »{/teal} du concept de vie (Académie des sciences, *Les origines du vivant*, 2016).

    **Mais cette modestie, loin d'évacuer les difficultés, en produit de nouvelles** : c'est l'objet de la leçon suivante.
  points:
  - id: intro1-l1-p1
    sentence: "__Que la vie soit un défi pour toute entreprise de conceptualisation__, on le répète depuis ___, dans « Le concept et la vie » (1966)."
    answer: "Canguilhem"
    alt: ["Georges Canguilhem"]
