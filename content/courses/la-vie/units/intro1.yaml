- id: intro1-l3
  title: "Le vivant des sciences : des concepts empruntés"
  notes: |-
    **Deux autres difficultés montrent que le refus du concept de vie reste inachevé : les sciences du vivant pensent avec des concepts qu'elles n'ont pas critiqués.**

    **Des métaphores impensées.** {sky}Derrida{/sky} le soulignait, à l'attention des candidats à l'agrégation de 1976 (séminaire *La vie la mort*, 1975-1976) : le geste critique qui refuse le concept de vie comme {violet}hypostase{/violet} du vivant (une abstraction qu'on transforme en chose, une « Vie » qu'on placerait derrière les vivants) {red}présente quelque chose d'inachevé{/red}. Car les spécialistes du vivant parlent de {yellow}« production »{/yellow} et de {yellow}« reproduction »{/yellow}, et, depuis la seconde moitié du XXe siècle, d'{yellow}« information »{/yellow} (le code génétique, le programme). Ils opèrent ainsi avec {coral}des concepts plus ou moins métaphoriques, dont les résonances, éventuellement métaphysiques, demeurent impensées{/coral} : on chasse la métaphysique par la porte, elle revient par le vocabulaire.

    **Scier la branche sur laquelle on est assis.** Les scientifiques ont emprunté à la connaissance ordinaire, au sens commun, {amber}la notion de vivant à partir de laquelle ils ont construit leurs théories{/amber}. Que reste-t-il, dans leurs travaux, de cette notion naïve, et des besoins ontologiques, épistémiques et moraux de démarquer vivant et non-vivant auxquels elle répond ? Les sciences de la vie sont plurielles : {yellow}l'anatomie{/yellow}, qui examine la structure des organismes (muscles, tissus), est une chose ; {yellow}la biologie chimique{/yellow}, qui emprunte ses outils analytiques à la chimie, en est une autre. D'où un **conflit** :
    - {green}la notion commune de vie{/green}, construite à partir de l'expérience ordinaire de la croissance, de la nutrition, dans leur différence avec la matière inerte, {coral}offre un objet à la biologie{/coral}, qui peut ainsi se constituer en champ scientifique autonome ;
    - {red}cette science s'est ensuite divisée jusqu'à dissoudre l'unité même du concept qui lui donne son nom{/red}, {blue}*bios*{/blue}.

    ! Ce n'est pas un reproche fait aux sciences : la difficulté est que la biologie vit d'une notion commune qu'elle défait en progressant.
