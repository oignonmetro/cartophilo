    sentence: "__Les sciences du vivant en donnent une image floue__ : les frontières ne sont pas nettes entre les différents ___ du vivant, ni même, pour l'apparition des premières cellules, entre **vivant et non-vivant**."
    answer: "règnes"
    alt: []
  - id: intro1-l2-p11
