- id: bichat3-l3
  title: "La société, la somme des forces, la fin naturelle"
  notes: |-
    **La psychologie de Bichat est une genèse, donc une théorie de l'apprentissage**, comme chez Condillac et Rousseau. Elle traite de ce qui s'ajoute à la nature pour modeler la vie animale de l'homme : la **société** (*R*, I, art. 8, §4).

    **La société dénature.** On retrouve un thème rousseauiste : la vie sociale raccourcit la durée de la vie. {teal}« Nous vivons avec excès… nous abusons de la vie animale, elle est circonscrite par la nature dans des limites que nous avons trop agrandies pour sa durée »{/teal} (art. 10, §1).

    **Sa manifestation principale est la division du travail**, qui oblige chacun à exercer certains organes aux dépens des autres. {teal}« Elle agrandit la sphère d'action des uns, rétrécit celle des autres, modifie celle de tous. »{/teal} Comme {teal}« l'habitude d'agir perfectionne l'action »{/teal}, l'homme social a des organes très éduqués et d'autres inaptes : {teal}« la société intervertit en partie l'ordre naturel de l'éducation de la vie animale »{/teal}.

    **La démonstration repose sur une loi de conservation.** {teal}« Une somme déterminée de force a été répartie en général à cette vie : or cette somme doit rester toujours la même, soit que sa distribution ait lieu également, soit qu'elle se fasse avec inégalité ; par conséquent l'activité d'un organe suppose nécessairement l'inaction des autres. »{/teal} Si la force totale est fixe, {coral}ce qu'un organe gagne, les autres le perdent{/coral} : l'homme qui canalise toute sa force dans une activité est faible dans les autres. C'est la position d'un {violet}invariant{/violet}, comme la quantité de mouvement chez Descartes ou la masse chez Lavoisier : l'ambition de faire de la physiologie une science.

    **La loi vaut aussi pour la vie organique** : {teal}« l'affection d'un rein double la sécrétion de l'autre »{/teal}. D'où l'image : {teal}« l'ensemble des fonctions représente alors une espèce de cercle dont une moitié appartient à la vie organique, et l'autre moitié à la vie animale. Les forces vitales semblent successivement parcourir ces deux moitiés. »{/teal} Voilà pourquoi la société, qui nous fait vivre hors de nous et abuse de la vie animale, {red}raccourcit la vie{/red} : ce que la vie animale dépense en excès, la vie organique le perd.

    **La fin naturelle** (art. 10) : {coral}la vie animale meurt d'abord{/coral}. Bichat reprend Haller : les fonctions s'éteignent successivement, jusqu'à ce que le cœur cesse de vivre.

    ! « Somme de force » n'est pas une mesure : c'est un invariant posé en amont, ce qui permet de raisonner sur une répartition sans rien quantifier.
