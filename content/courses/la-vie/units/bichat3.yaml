- id: bichat3-l5
  title: "Bichat anthropologue"
  notes: |-
    **La partie I des *Recherches* est une anthropologie.** Elle se rattache à un idéal de la physiologie des Lumières : être, dans sa plus grande extension, **une science de la nature humaine**. Elle appartient à un ensemble de textes dont l'arrière-plan est Rousseau, Condillac et Locke : les *Rapports du physique et du moral de l'homme* de **Cabanis**, l'*Histoire naturelle de l'homme* de **Buffon**, le *Traité* de **Pinel**, le *Traité de l'âme* de **La Mettrie**, la troisième partie de la *Philosophie zoologique* de **Lamarck**, certaines pages de l'*Anthropologie* de **Kant**. L'étude des processus physiologiques s'y double d'un discours sur l'usage des facultés, les rapports du naturel et du social, l'éducation.

    **Une histoire naturelle de l'homme.** Selon l'*Anthropologie du point de vue pragmatique* de Kant, {teal}« la connaissance physiologique de l'homme tend à l'exploration de ce que la nature fait de l'homme »{/teal}. Cette perspective, ce que la nature fait de l'homme, dépasse les clivages métaphysiques de ces auteurs (matérialisme de Lamarck ou Cabanis, dualisme de Buffon).

    **La vie dont parle cette partie est celle du XVIIIe siècle** : une vie humaine {coral}que la société détourne de sa nature, que l'éducation rend à elle-même, que les passions peuvent altérer jusqu'à la folie{/coral}, objet d'une histoire naturelle qui serait à la fois psychologie, physiologie, médecine et pédagogie.

    ! Rien dans la partie I n'annonce encore la physiologie expérimentale : c'est la partie II, sur la mort, qui rompra avec cet ensemble.
