- id: bichat3-l12
  title: "Le chirurgien, l'hôpital, le cas"
  notes: |-
    La configuration où la vérité du vivant se tire de la mort a des **conditions institutionnelles** : la promotion des chirurgiens, l'hôpital devenu lieu de savoir, la notion de **cas**. Elles expliquent pourquoi c'est un chirurgien, Bichat, et non un médecin comme Pinel, qui a fait de l'anatomie pathologique le pivot de la médecine.

    **La promotion des chirurgiens.** Bichat fut d'abord **chirurgien**, élève de **Desault**, à qui il succéda à l'Hôtel-Dieu. Sous la Révolution, les chirurgiens, simples artisans, deviennent les égaux des médecins ; Desault invente la {violet}leçon chirurgicale clinique{/violet} : une opération, l'histoire du cas, et une autopsie pour trouver le lieu de la maladie. Les chirurgiens apportent la palpation des corps et un savoir-faire technique, sans lequel les expériences sur les animaux vivants seraient impossibles. L'**hôpital** devient lieu de guérison et de savoir : on y compare les traitements par **registres et statistiques**.

    **Le cas, double pratique de l'individu.** Foucault : {teal}« De la mise en place de la mort dans la pensée médicale est née une médecine qui se donne comme science de l'individu. »{/teal} Un {violet}cas{/violet}, c'est à la fois une **séquence d'événements** (l'histoire de cas) et un **élément d'une série** de cas comparables (le registre). Les « petits récits » de mort des *Recherches* ont ce double statut : variations sur la mort violente, et séquences narratives. Ils délivrent la médecine de la conjecture sans lui ôter son caractère de **savoir de l'individuel**.

    **Pourquoi un chirurgien.** Pinel, médecin, n'a pu comprendre la portée de l'anatomie pathologique : pour lui comprendre, c'était voir et dresser des tableaux de symptômes ; il ne pouvait concevoir que {red}la vérité fût au bout du toucher{/red}. À côté de la maladie des médecins, entité invisible, il y avait un {violet}« concept chirurgical de maladie »{/violet}, lésion palpable. Padoue, Édimbourg, Paris après la Révolution ont en commun la proximité des médecins et des chirurgiens ; à chaque fois l'anatomie pathologique y naît. Mais seul Bichat en fait le pivot du savoir médical : {coral}l'autonomie du conceptuel résulte d'une intériorisation de ses conditions socio-historiques{/coral}.

    **John Hunter, le plus proche.** Chirurgien d'Édimbourg, il pense la vie comme une force en lutte avec la nature matérielle, distingue organes et éléments vitaux, voit dans la maladie {teal}« la perversion des actions naturelles de l'économie animale »{/teal}, et apprend de la maladie et des monstres : {teal}« la mauvaise action des parties d'un organe montre souvent ce qu'était l'acte naturel »{/teal}. Mais chez lui le savoir passe par l'**anatomie comparée**, non par l'expérimentation : c'est la différence essentielle.
