- id: bichat3-l9
  title: "Pourquoi la mort : l'invariant des enchaînements"
  notes: |-
    **C'est le cœur de la lecture de Huneman** : il explique pourquoi l'interrogation sur la mort institue la physiologie expérimentale.

    **Le point de départ : l'impasse des forces vitales.** Les expériences sur les propriétés vitales d'un organe n'ont guère de sens, puisque {red}ces forces sont par essence variables{/red}. L'histologie, fondamentale, ne se prolonge donc pas en une connaissance de la vie de chaque organe, ni du tout.

    **Or la mort est un processus d'enchaînements, et ces enchaînements ne varient pas.** {teal}« L'enchaînement des phénomènes ne varie pas »{/teal}, écrit Bichat dans la variété des conditions naturelles de la mort. {green}__Les forces vitales varient en chacun des organes ; mais l'ordre dans lequel la mort de l'un entraîne celle de l'autre est invariant__{/green}. Voilà l'invariant sur lequel une science du vivant peut se constituer.

    **Pourquoi ces enchaînements de mort font connaître la vie.** Si la mort du « cœur à sang noir » fait cesser les phénomènes chimiques du poumon, c'est que celui-là entretient ceux-ci : {coral}l'investigation de la mort montre, en les annulant, les conditionnements entre organes qui constituent la vie{/coral}. Ces liens sont **le procès même de la vie**. Or :
    - {pink}une fois le corps mort{/pink}, ils n'existent plus ;
    - {pink}dans la vie{/pink}, ils sont imperceptibles, parce que {red}tous les phénomènes sont simultanés{/red} et profonds.

    **La mort étale dans le temps ce que la vie tient ensemble.** {green}__L'expérience de la mort transforme en enchaînements chronologiques les enchaînements logiques qui constituent le vivant__{/green} : les phénomènes mécaniques du poumon *conditionnent* les chimiques (logique) ; dans la mort, la fin des premiers *entraîne*, ensuite, celle des seconds (chronologique, art. 5). {coral}La mort étale dans le temps et présente dans l'espace la connexion logique invariable des phénomènes qui fait l'organisme.{/coral} Bichat surmonte ainsi la difficulté du vitalisme en donnant à la physiologie un objet spécifique : les {violet}enchaînements{/violet}, que l'*Anatomie générale* voulait toujours « avoir en vue ».

    **Une connaissance circulaire, non déductive.** La mort ne se connaît que par **plusieurs expériences entrecroisées** (asphyxie pour le poumon, syncope pour le cerveau), parce qu'il n'y a pas une seule ligne de dépendance : les conditionnements sont réciproques et multilinéaires. Bichat l'écrit en note : les problèmes de physiologie sont {teal}« un cercle où il faut toujours supposer quelque chose, sauf à le prouver ensuite »{/teal}, et {teal}« il est impossible que la solution de l'une amène comme conséquence nécessaire celle de toutes les autres »{/teal}. Chaque reconstruction d'un conditionnement **présuppose les autres** : c'est le concept même d'organisme, où chaque partie est à la fois cause et effet.

    ! L'expérimentation ne tue pas ici pour connaître la mort, mais pour connaître la vie : la mort n'est pas l'objet, elle est l'accès.
