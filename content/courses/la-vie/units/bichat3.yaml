- id: bichat3-l13
  title: "La mort inscrite dans l'essence de la vie"
  notes: |-
    **L'héritage de Bichat se poursuit en deux traditions** : en anatomie pathologique (Broussais et sa « médecine physiologique », **Laënnec**, l'école clinique de Paris), en physiologie (Magendie, Legallois). Toutes deux renvoient à {coral}un même type d'intelligibilité du vivant, centré sur la puissance de positivité du corps mourant{/coral}.

    **Une contradiction apparente.** Par la mort, le vivant devient connaissable sans sortir du cadre vitaliste : la mort s'ancre dans la vie. Or Bichat oppose franchement {green}les forces vitales{/green} et {red}les forces physico-chimiques, mortifères{/red}, continuellement en lutte avec les premières. La physique et la chimie sont la mort dans le vivant, quoiqu'elles participent à son fonctionnement (et l'expérimentation, qui use de moyens physiques et chimiques, serait sans elles impossible).

    **La définition poussée à l'extrême résout la contradiction.** {green}__Précisément parce que la vie est résistance à la mort, elle lui est subordonnée : elle a la mort pour condition, et est condamnée à mourir.__{/green} La définition vitaliste inscrit la mort dans l'essence même de la vie. Dire que le vivant diffère irréductiblement du brut revient donc à dire que **le propre du vivant est de mourir**, et de pouvoir déroger à la vie par la maladie. {teal}« L'histoire des phénomènes dans lesquels les forces vitales ont leur type naturel nous mène, comme conséquence, à celle des phénomènes où ces forces sont altérées. Or dans les sciences physiques il n'y a que la première histoire : jamais la seconde ne se trouve. (…) Il est de la nature des propriétés vitales de s'épuiser »{/teal} (*AG*, discours préliminaire, §3).

    **D'où le sens nouveau d'une définition ancienne.** « Ensemble des fonctions qui résistent à la mort » est identique dans sa lettre aux définitions de Stahl ou de Barthez ; mais elle résume chez Bichat {coral}la résistance vitale, l'ancrage du vital dans la mort, et la ressource de savoir que constitue cette mortalité{/coral}. **L'autonomie de la science du vivant vient de la mortalité**, qui lui donne sa rigueur et n'appartient qu'aux êtres organisés.

    ! Un corps brut ne meurt pas et n'est pas malade : c'est parce que le vivant peut mourir que sa science a un objet propre, absent des sciences physiques.
