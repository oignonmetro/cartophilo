- id: bichat3-l11
  title: "Un nouveau savoir : la vérité du vivant tirée des cadavres"
  notes: |-
    **Anatomie et physiologie deviennent inséparables, pivotant autour de la mort.** La déduction anatomique et l'expérience sur un tissu ne sont plus les seules méthodes : un nouveau complexe, {coral}physiologie expérimentale et histologie{/coral}, se déploie à partir du rapport entre vie, mort et expérience. Si les tissus ont des propriétés, c'est **pour entrer dans des enchaînements** et accomplir des fonctions ; et la mort des organes renvoie aux affections morbides des tissus.

    **La médecine tire aussi ses objets de la mort.** La connaissance des maladies passe par celle de l'affection des tissus qui les cause, non par les symptômes. {teal}« Qu'est l'observation, si on ignore là où est le siège du mal ? (…) Ouvrez quelques cadavres, vous verrez aussitôt se dissiper l'obscurité que jamais la seule observation n'aurait pu dissiper »{/teal} (*AG*, discours préliminaire). Le {violet}localisme{/violet} est ancien (**Morgagni**, *De sedibus*, 1761, qui diversifie les affections selon les organes, non les tissus) ; mais il n'avait jamais pris place dans une configuration où **la vérité des phénomènes vitaux se tire des processus de mort**. Cette configuration concilie {green}le vitalisme, forme que prend l'autonomie de la science du vivant{/green}, et {green}un savoir positif, une médecine rationnelle{/green} : {teal}« Une nosographie fondée sur l'affection des organes sera nécessairement invariable. »{/teal}

    **Fonder et constituer.** Selon la distinction de Judith **Schlanger**, l'anatomie générale **fonde** la science de Bichat (elle en contient les premiers principes) ; la physiologie de la mort la **constitue** (elle rend ces principes opérants sur les phénomènes réels). La dualité se retrouve entre les deux parties des *Recherches*.
