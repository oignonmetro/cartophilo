lessons:
- id: bichat3-l1
  title: "Les deux vies s'opposent terme à terme"
  notes: |-
    **Les *Recherches* ont deux parties, et deux physiologies.** Dans son *Discours sur l'étude de la physiologie*, Bichat distingue une {violet}science de raisonnement{/violet} et une {violet}science de l'observation{/violet}. L'historien **Lesch** reconnaît la première dans la partie I (division des fonctions, propriétés et forces vitales), tournée vers le passé, et la seconde dans la partie II (expériences sur le cœur, le poumon, le cerveau), qui aura par Magendie et Claude Bernard la postérité la plus féconde. Reste à comprendre le rapport des deux, et ce fait étrange : {green}__ce qui mérite le plus le nom de physiologie expérimentale est une recherche sur la mort__{/green}.

    **La partie I, « Recherches sur la vie », suit les conséquences de la division des deux vies.**

    | Caractère | vie animale | vie organique |
    | conformation | symétrique | irrégulière |
    | dans le temps | intermittente | continue |
    | centre nerveux | le cerveau | des ganglions dispersés |
    | habitude | modifiée par elle | épargnée |

    **La symétrie.** Les organes de la vie animale sont {coral}symétriques{/coral}, ce qui leur permet de supporter un trouble et d'y suppléer ; ceux de la vie organique forment un {teal}« système unique »{/teal}. Or {teal}« l'harmonie est aux fonctions des organes ce que la symétrie est à leur conformation »{/teal} : voir suppose l'harmonie des deux yeux.

    **L'irrégularité.** La vie organique tolère l'irrégularité de conformation de ses organes, non la vie animale : {coral}dans la profondeur du vivant se trouve déjà l'irrégularité propre au vitalisme{/coral}.

    **Intermittence et continuité.** {teal}« Intermittence périodique des fonctions externes, continuité non interrompue des fonctions internes »{/teal} : dans la vie organique {teal}« chaque fonction est dans une dépendance immédiate de celles qui la précèdent »{/teal}, la circulation étant {teal}« centre de toutes »{/teal}. La vie animale, en lutte avec l'extérieur, ne peut rester constamment en action : elle doit se régénérer.

    **Surface et profondeur.** La vie animale est extérieure, d'une {pink}harmonie visible{/pink}, la symétrie ; la vie organique est enfouie, irrégulière, d'une {green}harmonie cachée{/green}, qui tient à son fonctionnement et demandera des expériences pour être connue. Cuvier opposera de même les organes vitaux, intérieurs, protégés des chocs, aux organes de la sensation et de la motricité, en surface. Mais à ce stade, {red}la dépendance circulaire des fonctions organiques ne peut qu'être constatée{/red}, non connue dans son principe.

    **Deux systèmes nerveux.** Tous les nerfs sensitifs aboutissent au **cerveau**, centre de la vie animale. Le système nerveux de la vie organique, lui, n'est pas centré : il forme une **chaîne ganglionnaire**, chaque organe commandé par le {violet}ganglion{/violet} le plus proche. {green}La vie organique, condition de toute vie, n'a pas de centre{/green} : c'est la décentralisation des tissus, retrouvée sur l'organisme entier.
