- id: bichat3-l10
  title: "La circularité du vivant et le poumon médiateur"
  notes: |-
    **Le plan de la partie II dessine des schémas d'enchaînement.** Après l'article 1, sur la mort en général, trois sections, consacrées à la mort du **cœur**, du **poumon**, du **cerveau**, de quatre articles chacune : l'effet de la mort de l'organe sur chacun des deux autres, sur le reste du corps, puis sur la **mort générale**. Ce dernier article résume les trois premiers en un enchaînement-de-mort complet, qui est aussi {coral}une chaîne de conditionnement entre organes{/coral} ; leur ensemble dresse un schéma du fonctionnement intérieur de l'organisme.

    **Trois enchaînements généraux**, où « cœur → cerveau » signifie que la mort du cœur conditionne celle du cerveau :

    | Section | Enchaînement |
    | mort du cœur | cœur → cerveau → poumon |
    | mort du poumon | poumon → cœur et → cerveau |
    | mort du cerveau | cerveau → poumon → cœur |

    Le poumon donne lieu à **deux** enchaînements, ce qui répond au fait que {coral}la plupart des morts subites commencent par le poumon{/coral}. Et ces relations de dépendance peuvent se lire à la suite les unes des autres : {green}__le conditionnement est circulaire__{/green}. L'organisation du vivant, dessinée par l'étude de la mort, se superpose à la circularité de la méthode.

    **Le vivant est circulaire, la nature linéaire.** Les phénomènes vitaux sont fermés sur eux-mêmes ; la biologie le développera avec la régulation, les boucles de rétroaction, les cycles (Krebs, ATP). {pink}La nature matérielle se pense comme un processus linéaire sans début ni fin{/pink} ; {green}les vivants fonctionnent circulairement{/green} : les parties sont à la fois cause et effet du tout. Cuvier le retrouve avec le {violet}principe des conditions d'existence{/violet} (la forme de chaque partie est déterminée par toutes les autres). Fermé sur soi, l'organisme a une **individualité** par laquelle il s'oppose et se rapporte à son milieu : {coral}la physiologie ne se dérive pas continûment de la physique{/coral}.

    **Le poumon médiatise les deux vies.** Pour que la partie II montre comment s'enchaînent dans le réel les deux vies que la partie I distinguait, il faut à chacune un organe. Le **cerveau** est celui de la vie animale, le **cœur** celui de la vie organique (le dernier à mourir). Le **poumon** est le siège de phénomènes mécaniques, sous l'emprise des nerfs donc du cerveau, et de phénomènes chimiques, organiques : {teal}« Voilà pourquoi l'existence du poumon est autant liée à celle du cerveau… qu'à celle du cœur »{/teal}. La respiration est une {violet}« fonction mixte »{/violet}. **Le schéma fonctionnel double (deux vies) correspond, dans le corps, à un schéma organique triple centré sur le poumon** : {teal}« L'action de l'un de ces trois organes est essentiellement nécessaire à celle des deux autres. »{/teal}

    **Le concept d'influence unit les deux parties.** {teal}« Quoiqu'une foule de caractères les distingue, leurs fonctions principales s'enchaînent cependant d'une manière réciproque. »{/teal} La partie I analysait les différences des deux vies, la partie II retrace leur enchaînement. Dans la première, {coral}la vie organique influence la vie animale{/coral} (le secret des passions) ; dans la seconde, {coral}la mort d'un organe influence celle des autres{/coral}. Le mot, volontairement flou, dit la spécificité de la causalité biologique : {green}moins linéaire que circulaire, moins déterminée que plurivoque{/green}.

    **La partie II donne à la partie I sa réalité organique.** La première est faite sur l'homme ; la seconde, expérimentale, poursuit sur des animaux supérieurs les relations qui sous-tendent la division des fonctions. Bichat dessine ainsi {coral}un envers de mort à la vie{/coral}, que n'auraient pas soupçonné les tenants de l'histoire naturelle de l'homme, comme Pinel inscrit au cœur de l'homme la possibilité de devenir fou.
