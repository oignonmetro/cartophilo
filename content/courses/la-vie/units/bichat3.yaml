- id: bichat3-l4
  title: "Les passions relèvent de la vie organique"
  notes: |-
    **La thèse nouvelle de Bichat.** Il ne suit pas le couple physique/moral de **Cabanis**, mais la division des deux vies, qui ne s'y superpose pas. Dans l'article « Du moral dans les deux vies » (art. 3), il partage le moral : {pink}l'intellectuel appartient à la vie animale{/pink}, puisque l'entendement repose sur la sensation ; {green}__l'affectif, les passions, appartient à la vie organique__{/green}.

    **Trois raisons.**
    - Toutes les fonctions organiques sont affectées par la passion : {yellow}l'évanouissement de la frayeur, la rougeur de la honte, l'amaigrissement des déprimés{/yellow}. Or, pour un même degré de passion, les fonctions de la vie animale (entendre, réfléchir) restent intactes.
    - Contrairement aux fonctions de la vie animale, {coral}la passion n'obéit pas à la volonté{/coral}.
    - Réciproquement, certaines passions et douleurs sont dues à {teal}« des lésions de l'estomac, du foie, de la rate, des intestins »{/teal}.

    **Pourquoi l'illusion contraire ?** On a toujours lié les passions à la vie de relation parce qu'elles {pink}s'expriment au-dehors{/pink} : visage, larmes, rire, gestes. Bichat l'explique par l'**influence** de la vie organique sur la vie animale : dans la colère, le sang circule plus vite et afflue au cerveau, d'où l'agitation nerveuse. La passion, siégeant dans un organe de la vie organique, affecte par **sympathie** les organes de la vie animale, {teal}« semblable à ce que nous observons dans les maladies des organes internes, qui font naître sympathiquement des spasmes, une faiblesse, ou même la paralysie des muscles locomoteurs »{/teal}. Peu importe la cause : {teal}« c'est de l'affection, et non de la cause qui la produit, que naît la sympathie »{/teal}.

    **Le caractère et le tempérament.** {teal}« Nos actes extérieurs forment un tableau dont le fond et le dessin sont à la vie animale, mais sur lequel la vie organique répand la nuance et le coloris des passions. Or cette nuance, ce coloris, c'est le caractère »{/teal} (art. 3, §4). D'où sa fixité, et son empreinte involontaire sur tous nos actes. De même le {violet}tempérament{/violet} (bilieux, flegmatique, sanguin), mi-physique mi-moral, tient à {coral}des modifications des passions et des viscères de la vie organique{/coral} ; {teal}« la vie animale est presque constamment étrangère aux attributs des tempéraments »{/teal}.

    **Schopenhauer y verra l'essentiel de Bichat.** Le contraste des deux vies {teal}« répond à ma distinction entre la volonté et l'intellect »{/teal} : si les passions, affections de la volonté, sont organiques, souterraines et inconscientes, c'est que {coral}le vouloir n'est pas essentiellement conscient{/coral}. Il cite la conclusion de Bichat : {teal}« La vie organique est le terme où aboutissent et le centre d'où partent les passions. »{/teal} Et il retrouve l'indépendance de la volonté envers l'intellect dans le fait que la vie organique repose non sur le cerveau, mais sur la chaîne ganglionnaire.

    ! Bichat ne nie pas que les passions se voient au-dehors : il en situe le siège dedans, et explique leur expression par l'influence d'une vie sur l'autre.
