- id: bichat3-l8
  title: "Comment Bichat construit une expérience"
  notes: |-
    Une fois la mort violente choisie pour objet, reste à l'interroger : chaque expérience de Bichat **coupe un lien entre deux organes** et lit la réponse, vie ou mort, ce qui fait apparaître une dépendance. Le dispositif le plus célèbre, le **robinet de la trachée**, montre que le sang entretient la vie de deux manières.

    **Couper un lien, lire la réponse.** L'expérience **coupe le lien entre un organe source et un organe cible** : si la cible continue de fonctionner, la dépendance présumée n'est pas réelle. Le résultat est {coral}binaire{/coral}, vie ou mort, et non une mesure, puisque les forces vitales varient. Exemple : le cœur meurt juste après le cerveau ; mais l'irritation d'un cerveau à découvert n'affecte pas le cœur, et le cœur n'est le siège d'aucun mouvement volontaire : **le cerveau tue donc le cœur par un intermédiaire, le poumon** (art. 11), dont les phénomènes mécaniques dépendent des nerfs de la vie animale (art. 10). Le schéma peut être ternaire : couper le lien du cerveau au premier ganglion ne change pas le poumon, ce ganglion n'est donc pas un relais. **Chaque expérience en appelle une autre.**

    **Le robinet de la trachée.** Dans l'asphyxie, la mort du poumon change le sang rouge en sang noir, qui tue le cerveau (art. 7) ; mais les autres organes (art. 8) ? Bichat installe {yellow}un robinet dans la trachée-artère d'un chien{/yellow}, relié à un autre chien asphyxié qui lui envoie du sang noir, dont on peut faire varier le débit. Si l'on coupe pour laisser passer l'air, le sang reprend très vite sa couleur rouge : le {teal}« principe »{/teal} du sang rouge passe directement du poumon au sang. Sang noir maintenu : la mort touche le cerveau, les nerfs, la vie animale, puis le reste ; le cœur seul semble fonctionner plus longtemps. **Le sang entretient donc la vie de deux manières** : par son {violet}mouvement{/violet}, action mécanique, et par sa {violet}nature{/violet}, action chimique. Bichat unit ainsi les thèses des mécanistes et des iatrochimistes, en montrant leurs insuffisances respectives ; la mort par le poumon ou le cerveau arrête la seconde, la mort du cœur la première (art. 12).
