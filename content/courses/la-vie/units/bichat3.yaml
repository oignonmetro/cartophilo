- id: bichat3-l7
  title: "Pourquoi la mort violente"
  notes: |-
    **Bichat restreint son objet à la mort violente.** La partie II distingue mort accidentelle et mort naturelle, et parmi les morts accidentelles ne traite que de la **mort violente**, survenant subitement après un trouble, non de la mort par maladie (*R*, II, art. 1, §1). Car la maladie, {teal}« état intermédiaire à la santé et à la mort »{/teal}, {red}ne peut s'imiter{/red} ; et le pourrait-on, cela n'apprendrait rien, puisque les lois vitales y sont modifiées. La mort violente, elle, {green}peut s'imiter par l'expérimentation animale{/green}. Le progrès repose sur une **réduction des questions** : la cause de la mort n'est jamais étudiée pour elle-même ; ce qui compte, c'est comment, un organe atteint, les autres s'en trouvent affectés. Asphyxies, syncopes, noyades sont traitées de même.

    **Toutes les expériences ne sont pas incertaines.** Dans le *Discours sur l'étude de la physiologie*, Bichat répond aux vitalistes :
    - les expériences sont {red}« incertaines quand elles ont pour objet les forces vitales »{/red} d'un organe précis, comme celles de Haller sur la dure-mère, qui se contredisent, parce que ces forces varient ;
    - elles sont {green}certaines{/green}, même si {teal}« elles demandent une extrême précision »{/teal}, quand elles portent sur des phénomènes qui mettent en jeu **plusieurs organes** : digestion (Spallanzani), asphyxie, influence des sécrétions les unes sur les autres.

    Il pose déjà les règles de Claude Bernard : un animal-témoin, l'état de l'animal, la répétition de l'expérience.

    **Le programme : trois organes et leurs influences.** {teal}« Toute mort subite commence par l'interruption de la circulation, de la respiration et de l'action du cerveau »{/teal} : la mort est **l'enchaînement des décès partiels** du {violet}cœur{/violet}, du {violet}cerveau{/violet} et du {violet}poumon{/violet}. Il s'agit de comprendre comment la mort de chacun entraîne, {violet}« influence »{/violet} dans la langue de Bichat, celle des autres. Bichat se place dans **l'espace de la mort apparente**, et rompt avec la conception continuiste de Haller, Maupertuis ou Buffon : {coral}la mort n'est plus l'effet du travail vital, mais un nouveau processus{/coral}, discontinu avec la vie.
  points:
  - id: bichat3-l7-p1
    sentence: "Parmi les morts accidentelles, la partie II des *Recherches* ne traite que de la mort ___, survenant subitement après un trouble, et non de la mort par maladie."
