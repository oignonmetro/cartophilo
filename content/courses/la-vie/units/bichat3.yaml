- id: bichat3-l6
  title: "De la mort-état à la mort-processus"
  notes: |-
    **La partie II, « Recherches sur la mort », semble tenir un autre discours.** Elle ne se rattache à la première que par un seul élément, celui-là même qui faisait l'originalité de Bichat : **la division de la vie animale et de la vie organique**. Pour comprendre sa longue enquête (comment la mort du cerveau provoque celle du poumon, celle du cœur la mort générale), il faut la replacer dans une histoire de la mort.

    **La mort comme séparation.** Le dualisme chrétien de l'âme et du corps, doublé de l'âme aristotélicienne principe de vie, fait penser la mort comme {pink}séparation de l'âme et du corps{/pink}. Selon Philippe **Ariès**, le premier millénaire la concevait plutôt comme un sommeil de l'être indivisible attendant la Résurrection ; puis la mort s'individualise (les *artes moriendi*) : {pink}mourir est instantané, la mort est l'état du corps sans âme{/pink}.

    **La mort comme processus.** La fin de l'animisme permet aux médecins d'en faire {green}un travail intérieur au vivant{/green} : usure des solides par frottements, épaississement et obstruction des vaisseaux (**Haller**), thème repris par **Buffon** (« De la vieillesse et de la mort »), Maupertuis, Lamarck. La mort est un processus et non un état ; elle commence quasiment avec la vie. {teal}« Nous commençons de vivre par degrés et nous finissons de mourir comme nous commençons de vivre »{/teal} (Buffon). Ariès y voit l'effet d'une réticence moderne devant l'heure de la mort : {teal}« La mort a été, alors, remplacée par la mortalité en général »{/teal}.

    **La mort apparente.** Une dernière transformation achève de défaire le dualisme. **Winslow** (1740) soutient une thèse sur l'{teal}« incertitude des signes de la mort »{/teal} ; son traducteur **Bruhier** part en croisade contre l'inhumation prématurée : la mort constatée n'est pas forcément la mort, d'où {red}la crainte d'être enterré vivant{/red}. Pour Ariès, {teal}« la peur de la mort apparente a été la première forme avouée, acceptable, de la peur de la mort »{/teal}. Entre la mort apparente et la mort réelle s'étend un espace que la science interprète comme **l'absence de certaines fonctions** : l'article « Mort » de l'*Encyclopédie* (Ménuret) en fait une {coral}extinction progressive, parfois réversible, de fonctions diverses{/coral}. Le vitalisme le permet : si la vie est somme de vies propres, la mort du tout est la suite des morts des organes.

    **Bichat s'inscrit dans cette lignée, mais abandonne le dualisme vie/mort**, et apporte deux clartés.
    - Les {violet}« propriétés de tissu »{/violet}, comme l'{violet}extensilité{/violet} (le tissu se distend sous une impulsion étrangère), persistent après la mort et ne dépendent pas de la vitalité ; Bordeu, Barthez et Haller les confondaient avec les propriétés vitales. Leur distinction (*R*, I, art. 7) évite de prendre les frémissements ou saignements du cadavre pour des signes de vie, fascination morbide encore vivace chez Garmann ou Ménuret.
    - Grâce à la division des deux vies, {green}__la mort apparente reçoit un statut : c'est l'intervalle entre la mort de la vie animale, réversible, et celle de la vie organique__{/green} (*R*, II, art. 1, §1). Une étude de la vie organique comme telle devient possible, en étudiant ce qui se passe dans cet intervalle.

    ! La mort-processus de Bichat n'est pas celle de Buffon : ce n'est pas l'usure lente que la vie produit, c'est un nouveau processus qui commence avec une atteinte (voir la leçon suivante).
