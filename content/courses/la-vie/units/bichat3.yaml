- id: bichat3-l2
  title: "L'habitude : elle émousse le sentiment, perfectionne le jugement"
  notes: |-
    **La vie animale est soumise à l'habitude, la vie organique non.** {teal}« Tout est modifié par l'habitude dans la vie animale »{/teal} (*R*, I, art. 5, §1). Si les fonctions organiques y étaient soumises, {teal}« mille causes menaceraient chaque jour l'existence »{/teal} : circulation et respiration s'écarteraient de leur cours.

    **La physiologie de Bichat embrasse ce que nous appellerions psychologie** : perception, entendement, passions, tout ce par quoi l'homme se rapporte au monde. Comme Locke, Condillac et les philosophes du temps, il conçoit **une genèse continue des fonctions intellectuelles à partir de la sensation** : la sensation induit le {violet}sentiment{/violet} (plaisir ou peine, comme trouver un chant agréable), puis le {violet}jugement{/violet}, qui distingue les accords et la mélodie de ce chant.

    **Sentiment absolu et sentiment relatif.**
    - {pink}Absolu{/pink} : la douleur d'une blessure, le plaisir de l'accouplement.
    - {pink}Relatif{/pink} : fonction de l'état de celui qui l'éprouve ; {yellow}une belle campagne charme le citadin, non celui qui l'a chaque jour sous les yeux{/yellow}.

    La différence est physiologique : {teal}« Tout ce qui agit sur nos organes en détruisant leurs tissus est toujours cause d'une sensation absolue ; le simple contact d'un corps sur le nôtre n'en produit jamais que de relatives. »{/teal}

    **L'habitude émousse le sentiment.** Dans le sentiment, l'âme compare la sensation nouvelle aux anciennes, non par réflexion mais par un {teal}« effet involontaire de la première impression des objets »{/teal}. Plus la nouvelle ressemble aux anciennes, plus le sentiment s'atténue : {coral}le plaisir ou la douleur relatifs, répétés, mènent à l'indifférence{/coral}.

    **L'habitude perfectionne le jugement.** L'effet est inverse, pour deux raisons : le sentiment émoussé laisse l'âme plus libre de distinguer les causes de ce qu'elle sent ; et le jugement s'exerce : {teal}« notre jugement devient précis, rigoureux ; il embrasse tout »{/teal}. On pense à Locke : c'est l'exercice qui fait l'esprit.

    **D'où l'éducation**, caractère de la vie animale. L'habitude, en émoussant les impressions qui retiennent d'abord l'enfant, lui apprend {teal}« à voir, à entendre, à sentir, à goûter, à toucher »{/teal}, en le faisant descendre {teal}« des notions confuses de l'ensemble, aux idées précises des détails »{/teal}. Bichat est ici proche de l'*Émile* de **Rousseau** : l'éducation commence par les sens. Épargnée par l'habitude, {green}la vie organique est d'emblée ce qu'elle a à être ; la vie animale doit se développer{/green}.

    **Toute sensation est comparaison.** {teal}« Toute sensation suppose une comparaison entre l'état actuel et l'état passé »{/teal} (*R*, I, art. 8, §1) : le froid se sent par contraste avec une chaleur antérieure. C'est pourquoi {coral}le fœtus, baigné dans un milieu homogène, n'éprouve aucune sensation{/coral} et ne jouit pas de la vie animale : il manque à son cerveau non l'excitabilité, mais l'{violet}excitation{/violet}, une différence minimale. Comparer est l'acte central des théories de la connaissance du siècle (Condillac, Rousseau, La Mettrie, Buffon) ; mais chez Bichat, {green}c'est la sensation elle-même qui est le fruit d'une comparaison{/green}.
