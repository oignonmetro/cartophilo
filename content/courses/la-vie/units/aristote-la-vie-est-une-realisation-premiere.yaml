- id: "aristote-la-vie-est-une-realisation-premiere-l1"
  title: "L'âme est à l'exercice des fonctions vitales ce que la science est à la spéculation"
  notes: |-
    **Le paragraphe fixe le degré de la réalisation :** {violet}**l'âme**{/violet} **est réalisation** {coral}**« comme la science »**{/coral}**,** {red}**non comme l'acte de spéculer**{/red}**.** Il reprend la distinction posée en 412a10 et s'en sert enfin.

    **L'argument tient en une phrase :** {teal}« la présence de l'âme implique sommeil et éveil »{/teal}. Le vivant qui dort {green}a son âme{/green}, et pourtant {pink}n'exerce ni la sensation ni la pensée{/pink}. Si l'âme était l'exercice, {red}__le dormeur n'aurait plus d'âme, donc ne vivrait pas__{/red}. {coral}L'âme est donc ce qu'on a, non ce qu'on fait.{/coral}

    {sky}Shields{/sky} parle de deux {violet}degrés{/violet} de la réalisation, la simple possession et l'usage ; {sky}Polansky{/sky} et {sky}Hamlyn{/sky}, d'une réalisation {violet}« à titre de disposition »{/violet} (`hexis`), qui explique qu'un vivant reste vivant quand il dort.

    **Pour la vie,** c'est sa définition comme {green}__capacité__{/green} : est vivant ce qui {amber}peut{/amber} exercer ses fonctions, même quand il ne les exerce pas.

    ! L'argument ne dit pas que le dormeur n'exerce rien : il se nourrit et respire. Il dit que la présence de l'âme ne se mesure pas à l'exercice de toutes ses fonctions.
