- id: "aristote-la-vie-est-une-realisation-premiere-i2"
  title: "Les mots du texte : science, acte de spéculer, organe"
  notes: |-
    **L'exemple de la science porte toute la définition.** Il faut l'entendre comme Aristote : {violet}la science{/violet} (`epistêmê`) est {green}un savoir qu'on a{/green}, même quand on n'y pense pas ; {violet}l'acte de spéculer{/violet} (`theôrein`) est {green}l'usage de ce savoir{/green}, le fait d'y penser en acte.

    | Dans le texte | Grec | Sens |
    | la science | `epistêmê` | un savoir possédé, une disposition |
    | l'acte de spéculer | `theôrein` | l'exercice de ce savoir, la contemplation en acte |
    | disposition | `hexis` | un état acquis qu'on a sans l'exercer |
    | réalisation première | `entelecheia hê prôtê` | le premier degré de la réalisation : la capacité |
    | pourvu d'organes | `organikon` | qui a des organes, qui sert d'instrument |

    **Le savant en trois états.** *De l'âme*, II, 5 distingue l'homme {yellow}capable d'apprendre{/yellow}, celui qui {yellow}possède la science{/yellow} et {teal}« celui qui est bel et bien en train de spéculer »{/teal}, {teal}« savant par réalisation »{/teal} (417a28-29). Notre texte ne retient que les deux derniers : {coral}__l'âme est au vivant ce que la science est au savant__{/coral}.

    **« Organe » veut dire outil.** `Organon` désigne l'instrument, et `organikon` peut s'entendre {amber}« pourvu d'organes »{/amber} ou {amber}« qui sert d'instrument »{/amber} : le débat est repris dans la leçon 412a28-b6.

    ! La science possédée n'est pas l'ignorance : celui qui sait la géométrie et dort la sait encore, celui qui ne l'a jamais apprise non.
