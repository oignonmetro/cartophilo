- id: "aristote-la-vie-est-une-realisation-premiere-o2"
  title: "La vie comme capacité : Plotin, Leibniz"
  notes: |-
    **L'argument du sommeil a été retourné contre Aristote, et le mot d'entéléchie repris dans un tout autre sens.**

    **Plotin : le sommeil contre l'entéléchie.** Le traité 2 (IV, 7, chap. 8⁵) objecte que l'entéléchie doit {teal}« adhérer naturellement à ce dont elle est entéléchie »{/teal} : l'âme ne pourrait donc pas {teal}« faire retraite dans le sommeil »{/teal}, et {red}« il n'y aura même plus de sommeil »{/red}. Pour Plotin, {pink}le sommeil est une absence de l'âme{/pink}, qui se retire du corps. Notre texte avait répondu d'avance : {green}__dans le sommeil, rien ne se retire__{/green}, puisque l'âme est réalisation {coral}première{/coral}, présente dans le sommeil comme dans l'éveil. Les deux auteurs partent du même fait et en tirent l'inverse.

    **Leibniz : l'entéléchie devient une force.** {teal}« On pourrait donner le nom d'Entéléchies à toutes les substances simples, ou Monades créées, car elles ont en elles une certaine perfection [...], il y a une suffisance qui les rend sources de leurs actions internes, et, pour ainsi dire, des Automates incorporels »{/teal} (*Monadologie*, §18). Et ailleurs : {teal}« Aristote les appelle entéléchies premières, je les appelle peut-être plus intelligiblement forces primitives, qui ne contiennent pas seulement l'acte ou le complément de la possibilité, mais encore une activité originale »{/teal} (cité par Michel Fichant, d'après Gerhardt, IV, 479). {amber}Le mot reste, le sens change{/amber} : chez Aristote, {green}la forme d'un corps{/green} ; chez Leibniz, {pink}une substance simple, source de ses actions{/pink}, qui n'est la forme d'aucun corps.

    | Auteur | L'entéléchie | Le sommeil |
    | Aristote | la forme d'un corps organisé, capacité possédée | l'âme demeure, l'exercice cesse |
    | Plotin | une forme collée au corps, qu'il refuse pour l'âme | l'âme se retire |
    | Leibniz | une substance simple, force primitive | non traité ici |

    ! Leibniz ne reprend pas l'hylémorphisme : ses entéléchies sont des substances, non des formes de corps.
