- id: "aristote-la-vie-est-une-realisation-premiere-l2"
  title: "L'âme est la réalisation première de la vie"
  notes: |-
    **Le paragraphe confirme par deux raisons, puis énonce la définition :** {violet}**l'âme**{/violet} **est** {coral}**la réalisation première d'un corps naturel qui a potentiellement la vie**{/coral}**.**

    **Première raison : une correspondance.**

    | | Chez le savant | Chez le vivant |
    | l'exercice | l'acte de spéculer | l'éveil |
    | la possession sans exercice | avoir la science sans l'exercer | le sommeil |

    Comme la science demeure quand on n'y pense pas, {green}__l'âme demeure dans le sommeil__{/green}.

    **Seconde raison : l'ordre de la génération.** {teal}« La première des deux à naître chez un même sujet, c'est la science »{/teal} : on {amber}acquiert{/amber} un savoir avant de s'en servir. De même, {green}__le vivant a ses capacités avant de les exercer__{/green}. {sky}Polansky{/sky}, {sky}Shields{/sky} et {sky}Hamlyn{/sky} y lisent la seconde raison du mot « première » : la capacité vient {violet}d'abord dans l'histoire de l'individu{/violet}.

    **Une tension à noter.** Selon la génération, la capacité est première ; mais selon la définition, {teal}« les facultés sont précédées par les actes et les actions, selon l'ordre logique »{/teal} (II, 4, 415a18-20) : on ne définit une capacité que par ce qu'elle fait. {amber}« Première » vaut dans le premier ordre, non dans le second.{/amber}

    **Pour la vie,** le mot « première » distingue {green}être en vie{/green}, qui est une capacité, et {green}vivre en acte{/green}, qui en est l'exercice.

    ! « Première » ne veut pas dire que l'âme précède le corps dans le temps : elle précède son propre exercice.
