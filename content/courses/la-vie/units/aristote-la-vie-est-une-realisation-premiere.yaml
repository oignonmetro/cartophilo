# Unité de texte (voir content/textes.md) : Aristote, De l'âme, II, 1,
# 412a22-b9, trad. Bodéüs (Œuvres complètes, Flammarion). Titres et cartes-citation
# de l'utilisateur ; rappels, introductions, cartes-explication et prolongements
# écrits sans commentaire suivi, d'après l'édition et le notebook « Aristote :
# la vie » (Shields, Polansky, Bermúdez, Bolton, Hamlyn). La phrase « En effet,
# la présence de l'âme implique sommeil et éveil », absente du texte de la
# première leçon, y est rétablie d'après l'édition. Précède : -realisation
# (412a6-22) ; suite : aristote-ame-vue-oeil (412b10-413a3).

id: aristote-la-vie-est-une-realisation-premiere
title: "Aristote : la vie est la capacité d'accomplir ses fonctions vitales"
subtitle: "De l'âme, II, 1"
icon: page
color: coral
intro: |-
  La seconde moitié de la définition de l'âme (II, 1, 412a22-b9). L'âme est la réalisation « première » d'un corps naturel, comme la science qu'on possède sans s'en servir, puisque le dormeur vit ; ce corps est pourvu d'organes, jusque chez la plante ; et la question de savoir si l'âme et le corps font un ne se pose plus.
lessons:
- id: "aristote-la-vie-est-une-realisation-premiere-i1"
  title: "Vivre, c'est pouvoir avant d'exercer : la thèse et le plan"
  notes: |-
    **Le texte répond à la question** {amber}**« de quelle sorte de réalisation l'âme est-elle la réalisation, et de quel corps ? »**{/amber} **:** {violet}**l'âme**{/violet} **est** {coral}**la réalisation première d'un corps naturel pourvu d'organes**{/coral}**.** Le passage précédent (412a6-22) avait établi que l'âme est forme, donc réalisation ; mais la réalisation se dit de deux façons, et le corps n'était pas encore qualifié.

    La thèse réunit trois affirmations. L'une porte sur le **mode** de l'âme : elle est {green}__une capacité possédée__{/green}, {pink}non son exercice{/pink}. L'autre porte sur le **corps** : il est {green}__pourvu d'organes__{/green}, ce qui vaut jusque pour la plante. La dernière en tire une **conséquence** : {coral}l'âme et le corps ne sont pas deux choses à unir{/coral}. Chacune dépend de la précédente : on ne pourrait dire de quel corps l'âme est la réalisation sans avoir dit de quelle réalisation il s'agit.

    **Les lignes** {teal}**412a22-25**{/teal} **fixent** {violet}**le degré de la réalisation**{/violet} par l'analogie de la science. **Les lignes** {teal}**412a25-28**{/teal} **la confirment et énoncent la définition**. **Les lignes** {teal}**412a28-b6**{/teal} **disent** {violet}**quel corps**{/violet} l'âme réalise, jusque chez la plante. **Les lignes** {teal}**412b6-9**{/teal} **en tirent que la question de l'unité ne se pose pas**.

    | Mouvement | Lieu | Ce qui s'y joue |
    | fixer le degré de la réalisation par l'analogie de la science | 412a22-25 | la réalisation est la science possédée ou l'acte de spéculer ; l'âme est présente dans le sommeil comme dans l'éveil, elle est donc comme la science possédée |
    | confirmer par le sommeil et par l'ordre de la génération, puis énoncer la définition | 412a25-28 | l'éveil répond à l'acte de spéculer, le sommeil à la science qu'on n'exerce pas, et la science vient la première : l'âme est réalisation première |
    | qualifier le corps que l'âme réalise, jusque chez la plante | 412a28-b6 | ce corps est pourvu d'organes, même la plante, dont la feuille protège le fruit et la racine fait office de bouche : d'où une formule commune à toute âme |
    | en tirer que la question de l'unité ne se pose pas | 412b6-9 | on ne demande pas si la cire et sa figure font un ; la réalisation est l'un et l'être au sens premier |

    **Contre qui ?** Contre ceux qui font de l'âme {red}une chose distincte qu'il faudrait relier au corps{/red} : selon {sky}Shields{/sky}, la dernière phrase vise d'abord {sky}**Platon**{/sky}, dont le *Phédon* pose la question de la survie séparée ; selon {sky}Polansky{/sky} et {sky}Bermúdez{/sky}, aussi les {sky}**pythagoriciens**{/sky}, qui attachent l'âme au corps sans dire lequel (I, 3).

    ! « Première » ne veut pas dire la plus importante : c'est le premier des deux degrés de la réalisation, celui de la capacité.
