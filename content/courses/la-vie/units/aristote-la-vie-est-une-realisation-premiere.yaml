- id: "aristote-la-vie-est-une-realisation-premiere-l5"
  title: "La vie et le vivant ne font qu'un"
  notes: |-
    **Le paragraphe tire la conséquence :** {coral}**on n'a pas besoin de chercher si le corps et l'âme font un**{/coral}**, pas plus que la cire et sa figure, parce que** {violet}**la réalisation**{/violet} **est l'un et l'être au sens premier.**

    **Ce que la phrase ne dit pas.** {red}Elle ne dit pas que l'âme et le corps sont identiques{/red} : Aristote vient de nier que le corps soit l'âme (412a17). {sky}Shields{/sky} le note : la question tombe parce que {green}__sa motivation disparaît__{/green}. Elle supposait {pink}deux choses indépendantes à relier{/pink} ; or l'existence même du corps organique dépend de l'âme.

    **L'exemple de la cire.** Personne ne demande si {yellow}la cire et la figure qu'on y imprime{/yellow} font un : {amber}la figure n'est pas une seconde chose posée sur la cire{/amber}, c'est la cire en tant que figurée. De même, l'âme est le corps {green}en tant qu'il peut vivre{/green}.

    **« L'un et l'être, dont on parle en plusieurs sens, c'est, souverainement, la réalisation. »** Il y a plusieurs façons d'être un ; {green}__la plus forte est celle d'une puissance et de son acte__{/green}. La *Métaphysique* le dit en termes généraux : {teal}« la matière dernière et l'aspect sont une seule et même chose, celle-là en puissance, celui-là en acte »{/teal} (H, 6, 1045b17-19). {sky}Bolton{/sky}, {sky}Bermúdez{/sky} et {sky}Whiting{/sky} renvoient à ce passage.

    **Pour la vie,** la conséquence est capitale : {coral}__le vivant n'est pas l'assemblage d'une vie et d'un corps__{/coral}, mais un seul être, que sa vie fait un.

    ! La question de l'unité tombe, non celle de la séparation : la phrase qui suit (413a4-9) laisse ouvert le cas des parties de l'âme qui ne sont réalisation d'aucun corps.
  passage:
    label: "412b6-9"
    text: "C'est pourquoi l'on n'a même pas besoin de chercher si le corps et l'âme font un, exactement comme on ne le demande non plus de la cire et de la figure, ni, globalement, de la matière de chaque chose et de ce qui a cette matière. Car l'un et l'être, dont on parle effectivement en plusieurs sens, c'est, souverainement, la réalisation."
