- id: "aristote-la-vie-est-une-realisation-premiere-l3"
  title: "L'organe est le potentiel de vie"
  notes: |-
    **Le paragraphe qualifie le corps :** {violet}**le corps que l'âme réalise**{/violet} **est** {coral}**pourvu d'organes**{/coral}**, jusque chez la plante ; d'où la formule commune à toute âme.**

    **« Pourvu d'organes ».** Le grec `organikon` vient d'`organon`, l'outil. On le traduit {amber}« pourvu d'organes »{/amber}, avec {sky}Hicks{/sky} et {sky}Bermúdez{/sky}, ou {amber}« instrumental »{/amber}, avec {sky}Polansky{/sky} : {green}__le corps entier est l'instrument de l'âme__{/green}. {sky}Shields{/sky} juge les deux lectures complémentaires : si le corps entier sert d'instrument, il doit avoir des parties elles-mêmes adaptées à chaque fonction. {sky}Bolton{/sky} rapproche le mot des *Parties des animaux* : {teal}« le corps est un instrument (en effet chacune de ses parties est en vue de quelque chose et de même pour le tout) »{/teal} (I, 1, 642a11-13).

    **Pourquoi la plante ?** Parce qu'elle est {amber}le vivant le plus simple{/amber}, et qu'on pourrait douter qu'elle ait des organes. Or {yellow}la feuille protège le péricarpe{/yellow}, {yellow}le péricarpe le fruit{/yellow}, et {yellow}les racines correspondent à la bouche{/yellow}, {teal}« puisque les deux absorbent la nourriture »{/teal}. {coral}__Un organe se reconnaît à sa fonction, non à sa figure__{/coral} : la racine n'a rien d'une bouche, sinon de nourrir.

    **La formule commune.** {teal}« La réalisation première d'un corps naturel pourvu d'organes »{/teal} vaut pour {green}toute âme{/green}, végétale, animale ou humaine. Mais elle n'est qu'{amber}une esquisse{/amber} : pour {sky}Bolton{/sky}, une définition qui dit le fait sans en donner la cause ; pour {sky}Shields{/sky}, comme la définition de la {yellow}figure{/yellow}, qui s'applique au triangle et au quadrilatère sans être celle d'aucun (II, 3, 414b20-28).

    **Pour la vie,** le paragraphe dit {green}__qui vit : tout corps organisé, la plante comprise__{/green}, et il range la vie du côté de la {violet}fonction{/violet}.

    ! « Pourvu d'organes » ne signifie pas « organisé » au sens moderne d'une complexité chimique : c'est un corps dont les parties sont les instruments de ses fonctions.
  passage:
    label: "412a28-b6"
    text: "Tel est, du reste, tout corps pourvu d'organes. Or les parties des plantes aussi sont des organes, mais d'une extrême simplicité : ainsi, la feuille est une protection du péricarpe et le péricarpe une protection du fruit, tandis que les racines correspondent à la bouche, puisque les deux absorbent la nourriture. Et si l'on a besoin d'une formule qui s'applique en commun à toute âme, ce sera : la réalisation première d'un corps naturel pourvu d'organes."
  points:
  - id: "aristote-la-vie-est-une-realisation-premiere-l3-p1"
    sentence: "« Tel est, du reste, tout corps pourvu d'organes. Or les parties des plantes aussi sont des organes, mais d'une extrême simplicité : ainsi, la feuille est une protection du péricarpe et le péricarpe une protection du fruit, tandis que les racines correspondent à la bouche, puisque les deux absorbent la nourriture. Et si l'on a besoin d'___ à toute âme, ce sera : la réalisation première d'un corps naturel pourvu d'organes. »"
    answer: "une formule qui s'applique en commun"
    alt: []
