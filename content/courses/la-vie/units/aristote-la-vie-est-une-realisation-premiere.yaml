- id: aristote-la-vie-est-une-realisation-premiere-l1
  title: "L'âme est à l'exercice des fonctions vitales ce que la science est à la spéculation"
  notes: ""
  passage:
    label: "-"
    text: "Mais cette dernière [la réalisation] s'entend de deux façons, tantôt, comme la science, tantôt, comme l'acte de spéculer. Par conséquent, c'est évidemment comme la science."
  points: [{id: aristote-la-vie-est-une-realisation-premiere-l1-p1, sentence: "« Mais cette dernière [la réalisation] ___, tantôt, comme la science, tantôt, comme l'acte de spéculer. Par conséquent, c'est évidemment comme la science. »", answer: "s'entend de deux façons", alt: []}, {id: aristote-la-vie-est-une-realisation-premiere-l1-p2, sentence: "« Mais cette dernière [la réalisation] s'entend de deux façons, tantôt, comme ___, tantôt, comme l'acte de spéculer. Par conséquent, c'est évidemment comme la science. »", answer: "la science", alt: []}, {id: aristote-la-vie-est-une-realisation-premiere-l1-p3, sentence: "« Mais cette dernière [la réalisation] s'entend de deux façons, tantôt, comme la science, tantôt, comme ___. Par conséquent, c'est évidemment comme la science. »", answer: "l'acte de spéculer", alt: []}, {id: aristote-la-vie-est-une-realisation-premiere-l1-p4, sentence: "« Mais cette dernière [la réalisation] s'entend de deux façons, tantôt, comme la science, tantôt, comme l'acte de spéculer. Par conséquent, c'est évidemment ___. »", answer: "comme la science", alt: []}, {id: aristote-la-vie-est-une-realisation-premiere-l1-p5, sentence: "« Mais cette dernière [la réalisation] s'entend de deux façons, ___. Par conséquent, c'est évidemment comme la science. »", answer: "tantôt, comme la science, tantôt, comme l'acte de spéculer", alt: []}, {id: aristote-la-vie-est-une-realisation-premiere-l1-p6, sentence: "« Mais cette dernière [la réalisation] ___. Par conséquent, c'est évidemment comme la science. »", answer: "s'entend de deux façons, tantôt, comme la science, tantôt, comme l'acte de spéculer", alt: []}]
- id: aristote-la-vie-est-une-realisation-premiere-l2
  title: "L'âme est la réalisation première de la vie"
  notes: ""
  passage:
    label: "-"
    text: "Or il y a correspondance entre l'éveil et l'acte de spéculer, d'un côté, et, de l'autre, le sommeil et le fait d'avoir cette disposition sans l'exercer ; par ailleurs, la première des deux à naître chez un même sujet, c'est la science. En conséquence, l'âme est la réalisation première d'un corps naturel qui a potentiellement la vie."
  points: [{id: aristote-la-vie-est-une-realisation-premiere-l2-p1, sentence: "« Or il y a correspondance entre l'éveil et l'acte de spéculer, d'un côté, et, de l'autre, le sommeil et ___ ; par ailleurs, la première des deux à naître chez un même sujet, c'est la science. En conséquence, l'âme est la réalisation première d'un corps naturel qui a potentiellement la vie. »", answer: "le fait d'avoir cette disposition sans l'exercer", alt: []}, {id: aristote-la-vie-est-une-realisation-premiere-l2-p2, sentence: "« Or il y a correspondance entre l'éveil et l'acte de spéculer, d'un côté, et, de l'autre, le sommeil et le fait d'avoir cette disposition sans l'exercer ; par ailleurs, la première des deux à naître chez un même sujet, c'est la science. En conséquence, l'âme est la ___ d'un corps naturel qui a potentiellement la vie. »", answer: "réalisation première", alt: []}, {id: aristote-la-vie-est-une-realisation-premiere-l2-p3, sentence: "« Or il y a correspondance entre l'éveil et l'acte de spéculer, d'un côté, et, de l'autre, le sommeil et le fait d'avoir cette disposition sans l'exercer ; par ailleurs, la première des deux à naître chez un même sujet, c'est la science. En conséquence, l'âme est la réalisation première d'un ___ qui a potentiellement la vie. »", answer: "corps naturel", alt: []}, {id: aristote-la-vie-est-une-realisation-premiere-l2-p4, sentence: "« Or il y a correspondance entre l'éveil et l'acte de spéculer, d'un côté, et, de l'autre, le sommeil et le fait d'avoir cette disposition sans l'exercer ; par ailleurs, la première des deux à naître chez un même sujet, c'est la science. En conséquence, l'âme est la réalisation première d'un corps naturel ___. »", answer: "qui a potentiellement la vie", alt: []}, {id: aristote-la-vie-est-une-realisation-premiere-l2-p5, sentence: "« Or il y a correspondance entre l'éveil et l'acte de spéculer, d'un côté, et, de l'autre, le sommeil et le fait d'avoir cette disposition sans l'exercer ; par ailleurs, la première des deux à naître chez un même sujet, c'est la science. En conséquence, l'âme est ___. »", answer: "la réalisation première d'un corps naturel qui a potentiellement la vie", alt: []}]
- id: aristote-la-vie-est-une-realisation-premiere-l3
  title: "L'organe est le potentiel de vie"
  notes: ""
  passage:
    label: "-"
    text: "Tel est, du reste, tout corps pourvu d'organes. Or les parties des plantes aussi sont des organes, mais d'une extrême simplicité : ainsi, la feuille est une protection du péricarpe et le péricarpe une protection du fruit, tandis que les racines correspondent à la bouche, puisque les deux absorbent la nourriture. Et si l'on a besoin d'une formule qui s'applique en commun à toute âme, ce sera : la réalisation première d'un corps naturel pourvu d'organes."
  points: [{id: aristote-la-vie-est-une-realisation-premiere-l3-p1, sentence: "« Tel est, du reste, tout corps pourvu d'organes. Or les parties des plantes aussi sont des organes, mais d'une extrême simplicité : ainsi, la feuille est une protection du péricarpe et le péricarpe une protection du fruit, tandis que les racines correspondent à la bouche, puisque les deux absorbent la nourriture. Et si l'on a besoin d'___ à toute âme, ce sera : la réalisation première d'un corps naturel pourvu d'organes. »", answer: "une formule qui s'applique en commun", alt: []}, {id: aristote-la-vie-est-une-realisation-premiere-l3-p2, sentence: "« Et si l'on a besoin d'une formule qui s'applique en commun ___, ce sera : la réalisation première d'un corps naturel pourvu d'organes. »", answer: "à toute âme", alt: []}, {id: aristote-la-vie-est-une-realisation-premiere-l3-p3, sentence: "« Tel est, du reste, tout corps pourvu d'organes. Or les parties des plantes aussi sont des organes, mais d'une extrême simplicité : ainsi, la feuille est une protection du péricarpe et le péricarpe une protection du fruit, tandis que les racines correspondent à la bouche, puisque les deux absorbent la nourriture. Et si l'on a besoin d'une formule qui s'applique en commun à toute âme, ce sera : la ___. »", answer: "réalisation première d'un corps naturel pourvu d'organes", alt: []}]
- id: aristote-la-vie-est-une-realisation-premiere-l5
  title: "La vie et le vivant ne font qu'un"
  notes: ""
  passage:
    label: "-"
    text: "C'est pourquoi l'on n'a même pas besoin de chercher si le corps et l'âme font un, exactement comme on ne le demande non plus de la cire et de la figure, ni, globalement, de la matière de chaque chose et de ce qui a cette matière. Car l'un et l'être, dont on parle effectivement en plusieurs sens, c'est, souverainement, la réalisation."
  points: [{id: aristote-la-vie-est-une-realisation-premiere-l5-p1, sentence: "« C'est pourquoi l'on n'a même pas besoin de chercher ___, exactement comme on ne le demande non plus de la cire et de la figure, ni, globalement, de la matière de chaque chose et de ce qui a cette matière. »", answer: "si le corps et l'âme font un", alt: []}, {id: aristote-la-vie-est-une-realisation-premiere-l5-p2, sentence: "« C'est pourquoi l'on n'a même pas besoin de chercher si le corps et l'âme font un, exactement comme on ne le demande non plus ___, ni, globalement, de la matière de chaque chose et de ce qui a cette matière. »", answer: "de la cire et de la figure", alt: []}, {id: aristote-la-vie-est-une-realisation-premiere-l5-p3, sentence: "« C'est pourquoi l'on n'a même pas besoin de chercher si le corps et l'âme font un, exactement comme on ne le demande non plus de la cire et de la figure, ni, globalement, de la matière de chaque chose et de ce qui a cette matière. Car l'un et l'être, dont on parle effectivement en plusieurs sens, c'est, souverainement, ___. »", answer: "la réalisation", alt: []}, {id: aristote-la-vie-est-une-realisation-premiere-l5-p4, sentence: "« C'est pourquoi l'on n'a même pas besoin de chercher si le corps et l'âme font un, exactement comme on ne le demande non plus de la cire et de la figure, ni, globalement, de la matière de chaque chose et de ce qui a cette matière. Car ___, dont on parle effectivement en plusieurs sens, c'est, souverainement, la réalisation. »", answer: "l'un et l'être", alt: []}]
