- id: "aristote-la-vie-est-une-realisation-premiere-l4"
  title: "La vie, c'est l'âme (réalisation première) et ce qu'elle fait (réalisation seconde)"
  notes: |-
    **Le texte ne définit pas la vie, il définit l'âme ; mais il permet de dire ce que vivre veut dire.** Domaine par domaine :

    **Une définition à deux étages.** {green}__Vivre se dit de la capacité et de son exercice__{/green}. L'âme est la vie {violet}comme capacité{/violet}, la réalisation première ; ce qu'elle fait, se nourrir, sentir, penser, est la vie {violet}comme exercice{/violet}, la réalisation seconde. *De l'âme*, II, 2 le confirme : {teal}« le fait de vivre s'entend de plusieurs façons »{/teal} (413a22).

    | | Réalisation première | Réalisation seconde |
    | chez le savant | la science possédée | l'acte de spéculer |
    | chez le vivant | l'âme | l'exercice des fonctions vitales |
    | état | le sommeil | l'éveil |
    | sens de « vivre » | être en vie | vivre en acte |

    **Le statut ontologique.** {red}La vie n'est pas une activité qui commencerait et cesserait sans cesse{/red} : {green}__elle est une disposition durable__{/green}, qui demeure dans le sommeil. Et {coral}le vivant est un{/coral} : ni assemblage d'un corps et d'une vie, ni corps habité par une âme.

    **Le statut épistémologique.** La formule commune n'est qu'{amber}une esquisse{/amber}, et la capacité ne se définit que par ses actes (II, 4, 415a18-20) : {coral}__on connaît la vie par ce que fait le vivant__{/coral}, puis on remonte à ce qu'il peut.

    **Le vivant.** {green}__La plante vit au même titre que l'animal__{/green} : elle a des organes, définis par leur fonction. La vie {red}ne se mesure ni à la complexité{/red} {red}ni à la conscience{/red}.

    **Le sommeil et la mort.** Dormir, c'est {amber}vivre sans exercer{/amber} la sensation ni la pensée ; mourir, ce sera {red}perdre la capacité elle-même{/red}. Le sommeil est donc l'état qui fait voir {green}la vie comme capacité{/green}.

    **La conduite de la vie.** L'*Éthique à Nicomaque* reprend la distinction : {teal}« vu qu'il y a deux façons d'entendre cette vie aussi, il faut poser que c'est la vie en acte, car c'est elle principalement qui semble entendue »{/teal} (I, 6, 1098a5-7). {coral}__Être en vie ne suffit pas à bien vivre__{/coral} : la vie bonne est une affaire d'exercice.

    ! L'âme n'est pas toute la vie : elle en est le premier étage, la capacité ; vivre, c'est aussi l'exercer.
