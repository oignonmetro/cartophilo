- id: sep-arbio3-l2
  title: "Les limites de la division"
  notes: |-
    **La pratique de l'*Histoire des animaux* montre à la fois la valeur de la division et ses limites.**

    **Elle ne donne pas les genres.** La division suppose ses axes, elle ne les fournit pas. Pourquoi réunir les animaux qui ont **quatre pattes** et qui **donnent naissance à des petits vivants** ? Chacun de ces traits vient bien d'une division, l'une selon la locomotion, l'autre selon la reproduction. {red}__Mais ces divisions ne disent pas que les quadrupèdes vivipares forment un groupe scientifiquement important.__{/red} Il faut autre chose pour reconnaître des genres significatifs, comme {yellow}les céphalopodes ou les cétacés{/yellow}.

    **Elle est indifférente à la cause.** Elle ne distingue pas les caractères causalement fondamentaux des {violet}attributs propres{/violet}, alors que cette distinction est absolument fondamentale pour la science aristotélicienne. Comparer l'*Histoire des animaux* aux *Parties* et à la *Génération* montre comment Aristote l'opère en pratique.

    **La question d'ensemble.** {coral}On voit ainsi Aristote au travail sur la question centrale des *Seconds Analytiques*, II : comment définition, démonstration causale et division se rapportent-elles les unes aux autres dans la quête du savoir ?{/coral} Deux exemples de l'*Histoire* le montreront, à comparer ensuite aux traités explicatifs.
  points:
  - id: sep-arbio3-l2-p1
    sentence: "Première limite de la division dans l'*Histoire des animaux* : elle suppose ses ___, elle ne les fournit pas."
    answer: "axes"
    alt: []
  - id: sep-arbio3-l2-p2
    sentence: "La division selon la locomotion et selon la reproduction ne dit pas que les quadrupèdes vivipares forment un groupe ___ important."
    answer: "scientifiquement"
    alt: []
  - id: sep-arbio3-l2-p3
    sentence: "Il faut autre chose que la division pour reconnaître des genres significatifs, comme les céphalopodes ou les ___."
    answer: "cétacés"
    alt: []
  - id: sep-arbio3-l2-p4
    sentence: "Seconde limite de la division : elle est indifférente à la distinction entre caractères causalement fondamentaux et attributs ___."
    answer: "propres"
    alt: []
- id: sep-arbio3-l3
  title: "Le poumon : une corrélation à l'extension ouverte"
  notes: |-
    **Premier exemple : les organes de la respiration, chez les sanguins** (II, 15).

    {teal}« {/teal}Donc tous les quadrupèdes vivipares {teal}ont un gosier et une trachée-artère{/teal} et ils sont disposés de la même manière que chez l'être humain. Il en va aussi de même pour tous les quadrupèdes ovipares et chez les oiseaux. Mais {teal}ils diffèrent par les formes de ces parties{/teal}. D'une manière générale, ceux qui inhalent de l'air, l'inspirent et l'expirent, {teal}ont tous un poumon{/teal}, une trachée-artère et un gosier{teal} »{/teal} (505b33-506a3)

    **Une tournure et une innovation.** Le grec emploie un tour redondant, {violet}`hosa... panta`{/violet} : « autant qui sont X, tous ont Y ». Aristote ne note pas seulement une corrélation universelle : {green}__il le fait en laissant ouverte son extension.__{/green} On peut découvrir de nouveaux animaux qui la présentent sans changer la généralisation, puisqu'elle porte sur la corrélation entre différences, non sur les genres qui l'illustrent. L'ordre inverse, {violet}`panta hosa`{/violet}, semble marquer un universel convertible, ce que nous appelons une implication.

    **Le schéma inductif.**
    - Autant qui sont P, tous ont Y ; autant qui sont Q, tous ont Y...
    - D'une manière générale, tous ceux qui sont X, trait commun à P et Q, ont Y, et eux seuls.

    Ici, X est **inspirer et expirer de l'air**, trait coextensif aux trois organes.

    **Un garde-fou.** La suite met en garde contre une inférence fausse : que tout sanguin aurait un poumon. {teal}« Les sanguins n'ont pas tous de poumon{/teal}, par exemple les poissons n'en ont pas, ni aucun autre animal qui a des {teal}branchies. »{/teal} (506a12) Ici encore, {coral}la corrélation porte sur les branchies, en quelque animal qu'on les trouve, non sur un genre.{/coral}
  points:
