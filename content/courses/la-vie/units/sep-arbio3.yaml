# Cours sur la biologie d'Aristote (voir content/philosophie.md), tiré de
# l'article « Aristotle's Biology » de James Lennox, Stanford Encyclopedia of
# Philosophy : section 5.1. Citations d'Aristote dans les Œuvres complètes
# (Flammarion), où « gosier » rend l'œsophage de l'article.
#
# L'article analyse la tournure grecque hosa... panta en s'appuyant sur sa
# propre traduction (« as many as... all ») ; celle des Œuvres complètes ne la
# fait pas apparaître (« tous les quadrupèdes vivipares ont... »). La thèse est
# donc exposée sur la tournure grecque.

