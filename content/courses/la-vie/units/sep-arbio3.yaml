- id: sep-arbio3-l5
  title: "L'embryon de poulet"
  notes: |-
    **Second exemple, tiré des livres sur la génération** (VI, 3), à comparer ensuite à la *Génération des animaux*.

    {teal}« {/teal}La genèse à partir de l'œuf se fait chez les oiseaux {teal}de la même manière pour tous{/teal}, mais {teal}le temps nécessaire à leur maturité est différent{/teal}, comme on l'a dit. Chez les poules, c'est {teal}après trois jours et trois nuits{/teal} qu'apparaît un premier signe, chez les oiseaux plus grands il faut plus de temps et chez les plus petits moins de temps.{teal} »{/teal} (561a4-8)

    **Une généralisation et une corrélation de degré.** Elle part de **tous les oiseaux**, puis lie par le plus et le moins la taille de l'oiseau à la vitesse du développement. {green}__Ce procédé fait de la description soignée de l'œuf de poule au quatrième jour une description universelle__{/green} : le même stade survient chez tout oiseau, plus tôt ou plus tard selon sa taille.

    **La description.** {teal}« {/teal}et de la grosseur d'un point sanguinolent {teal}le cœur apparaît dans le blanc{/teal}. Et ce point palpite et {teal}se meut comme un être animé »{/teal} (561a11-12). Puis deux vaisseaux, puis le corps, {teal}« {/teal}d'abord très petit et blanc. Mais {teal}la tête est visible{/teal} et dans celle-ci {teal}les yeux qui font fortement saillie »{/teal} (561a18-20) : {teal}« c'est bien après qu'ils rapetissent et se contractent »{/teal}.

    **Sa postérité.** {coral}Cette expérience classique, déjà consignée dans un traité médical ancien d'embryologie, sera refaite bien des fois à la Renaissance.{/coral} Quiconque a vu des films modernes du poussin à ce stade mesure sa précision, compte tenu de la taille de l'embryon. Mais, comme pour le poumon, il faut remarquer {red}ce qui manque : aucune explication{/red}.
