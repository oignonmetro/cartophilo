- id: sep-arbio3-l4
  title: "Ce qui n'y est pas, et le corps humain comme repère"
  notes: |-
    **Le passage sur le poumon vaut autant par ce qu'il tait.** {red}__Aristote n'y affirme presque jamais qu'une corrélation est nécessaire, ne distingue pas l'essence des simples attributs, et évite toute trace d'explication causale.__{/red}
    - Il note la corrélation entre poumon, trachée et gosier d'une part, inspiration et expiration d'autre part, mais {red}ne dit pas que ces organes sont là pour respirer{/red}. Le mot de « respiration » n'y figure jamais.
    - Il emploie souvent le mot de « nature », mais ne dit pas que {pink}la nature ne fait rien en vain{/pink}.
    - Il n'y a presque aucune mention de la distinction de la matière et de la forme.

    {coral}Cette absence est attendue : l'`historia` prépare la recherche des causes, elle ne la fait pas.{/coral} Ce vocabulaire ne vient qu'avec les traités causaux.

    **Le corps humain comme repère.** Second trait de l'*Histoire* : elle se sert du corps humain comme d'une référence, et elle dit pourquoi : {teal}« {/teal}Mais il faut d'abord {teal}saisir les parties de l'être humain{/teal}, car, de même que {teal}chacun évalue une monnaie par rapport à celle qui lui est la mieux connue{/teal}, de même en est-il aussi dans les autres domaines. Or l'être humain est nécessairement celui des animaux qui nous est {teal}le mieux connu. »{/teal} (I, 6, 491a19-23)

    **Deux raisons.** Il est **le plus proche de nous**, du point de vue de la connaissance, et sert de carte pour ne rien omettre. Il suit aussi **l'ordre de la nature**, selon Aristote : le corps humain serait le plus conforme aux dimensions naturelles du cosmos, le haut de l'homme répondant au haut de l'univers (I, 15, 494a26-b1).

    ! Partir de l'homme ne signifie pas qu'il soit la mesure de tous les animaux : c'est un point de départ pour connaître, comme une monnaie familière pour évaluer les autres.
  points:
  - id: sep-arbio3-l4-p1
    sentence: "Dans l'*Histoire des animaux*, Aristote évite toute trace d'explication ___, ce qui n'a rien d'une négligence."
    answer: "causale"
    alt: []
