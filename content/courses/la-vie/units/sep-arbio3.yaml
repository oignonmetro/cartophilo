- id: sep-arbio3-l1
  title: "Quatre sortes de différences"
  notes: |-
    **L'*Histoire des animaux* n'est pas une compilation mal ordonnée de savoirs sur la nature.** On le répète souvent ; {green}__de nombreuses études, à la suite de {violet}David Balme{/violet}, ont montré qu'elle se construit du début à la fin sur une division à plusieurs différences.__{/green}

    **Elle s'organise selon quatre sortes de différences**, annoncées dès le premier chapitre (486b22-487a14).

    | Différences | Livres |
    | les parties | I-IV |
    | les activités et modes de vie : génération | V-VI, IX |
    | les autres activités et modes de vie | VII |
    | les caractères | VIII |

    **Le plan des parties.** Les parties non uniformes (nos organes) des sanguins, puis leurs parties uniformes (nos tissus), puis les parties des animaux sans sang.

    **Les groupes d'animaux viennent ensuite.** Ils se reconnaissent à des corrélations stables entre différences : un grand nombre d'animaux ont {yellow}ailes, plumes, bec et deux pattes sans chair{/yellow}, et ce groupe a reçu le nom d'**oiseau**. D'autres n'ont pas de nom : Aristote les désigne par leurs différences corrélées, ainsi {yellow}les quadrupèdes vivipares{/yellow}, qui correspondent à nos mammifères terrestres, à une exception importante près.
