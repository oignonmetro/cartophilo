- id: kant-cfj-analytique-l2c
  title: "Objectif ou subjectif : le jugement déterminant et le jugement réfléchissant (Introduction, IV-VII ; §75, §78)"
  notes: |-
    La leçon précédente a distingué deux usages de la faculté de juger. Il faut maintenant comprendre __pourquoi le jugement déterminant est objectif et le jugement réfléchissant seulement subjectif__, et en quel sens précis : c'est ce qui permettra au §75 de dire que la finalité ne vaut que « pour nous », sans en faire pour autant une fantaisie.

    **Tout se joue sur une question : qui fixe le verdict, la règle ou celui qui juge ?** Un jugement est {coral}***objectif***{/coral} quand ce qu'il affirme est __fixé par l'objet et par une règle qui vaut pour tous__ ; il est {pink}***subjectif***{/pink} quand il __dépend de l'état de celui qui juge__ (son plaisir, sa sensation, ses habitudes). Or {amber}**le sens dans lequel va le jugement, de l'universel au particulier ou l'inverse, décide justement de cela**{/amber}.

    **Le jugement déterminant : la règle est donnée, c'est donc elle qui décide.** Je dispose d'une loi, {yellow}*les métaux se dilatent à la chaleur*{/yellow}, et d'un cas, {yellow}ce rail chauffé par le soleil{/yellow}. J'en conclus que {yellow}ce rail va se dilater{/yellow}. Je n'ai rien mis de moi dans ce verdict : il suit de la règle et du cas, si bien que {amber}__quiconque applique la même règle au même cas aboutit au même verdict__{/amber}, comme dans un calcul. Kant le dit du plus simple constat d'expérience, celui de qui, {teal}« dans un cristal de roche, perçoit une goutte d'eau mobile »{/teal} : il {teal}« exige à juste titre que chacun l'admette nécessairement ainsi, cela parce que l'on a porté ce jugement selon les conditions générales de la faculté de juger déterminante »{/teal} (Introduction, VII). Objectif ne veut pas dire infaillible : on peut se tromper de règle ou de cas, et subsumer la baleine sous le concept de poisson. Mais l'erreur se corrige sur l'objet, par l'expérience, et non en interrogeant les goûts de celui qui juge.

    **Un** {coral}***jugement déterminant***{/coral} {pink}***subjectif***{/pink} **serait absurde.** Imaginons qu'on dise : {yellow}*ce rail va se dilater, mais seulement pour moi*{/yellow} ; ou qu'un arbitre siffle {yellow}*hors-jeu, mais seulement à mon avis, le règlement n'y est pour rien*{/yellow}. De deux choses l'une. {green}Ou bien j'applique vraiment la règle{/green}, et le verdict vaut pour tous, puisque la règle porte sur le rail et non sur moi. {red}Ou bien le verdict dépend de moi{/red}, et alors {red}__ce n'est plus la règle qui l'a fixé__{/red} : je n'ai rien subsumé, je n'ai rien déterminé, j'ai seulement dit ce que j'éprouve. Une {violet}règle{/violet} {amber}__qui laisserait le verdict au gré de chacun ne déterminerait rien__{/amber} : l'expression se détruit elle-même. Kant montre ce passage d'un régime à l'autre dans les *Prolégomènes* (§18-20) : *quand le soleil éclaire la pierre, elle devient chaude* ne fait que relier deux perceptions dans ma conscience, et ne vaut que pour moi ; *le soleil échauffe la pierre* applique le concept de **cause**, et vaut dès lors pour tous. {amber}__C'est l'application d'un universel qui fait passer du subjectif à l'objectif.__{/amber}

    **Cet universel, c'est l'entendement qui le fournit.** La faculté de juger déterminante __n'a pas de principe propre__ : {teal}« la faculté de juger déterminante sous des lois transcendantales universelles, que donne l'entendement, se borne à subsumer ; la loi lui est prescrite *a priori* »{/teal} (Introduction, IV). Elle est l'exécutante d'une législation qui vient d'ailleurs, __comme l'arbitre applique un règlement qu'il n'a pas écrit__. Son objectivité vient donc de l'{coral}entendement{/coral}, dont les catégories (la cause, la substance) sont les conditions sans lesquelles aucun objet d'expérience ne serait possible. L'objectivité kantienne ne désigne pas l'accès à la chose en soi, mais cette {coral}validité nécessaire pour tous les objets d'expérience{/coral}.

    **Inversement, le jugement réfléchissant : tant que l'universel est seulement cherché, rien n'est encore affirmé de l'objet.** {violet}__Réfléchir__{/violet}, c'est {amber}__comparer des cas pour leur trouver une règle__{/amber}. Le principe qui guide cette recherche ne peut venir de l'entendement, {teal}« parce que, sinon, elle serait faculté de juger déterminante »{/teal} (Introduction, IV), ni être tiré de la nature, puisqu'il faut le supposer avant toute comparaison. La faculté de juger le {teal}« prescrit, non pas à la nature (comme autonomie), mais à elle-même (comme héautonomie) »{/teal} (Introduction, V) : c'est __une règle de notre recherche__, non une loi des choses.

    **Mais nos généralisations sur les phénomènes ne sont-elles pas des** {pink}**jugements réfléchissants**{/pink} {coral}**objectifs**{/coral} **?** On compare des métaux chauffés et l'on conclut que *les métaux se dilatent à la chaleur* : on est bien parti du particulier, et le résultat est bien objectif. Kant l'accorde, mais montre que {green}__l'objectivité arrive au moment où la réflexion aboutit à un concept d'objet__{/green} : la loi trouvée, pensée sous la catégorie de cause, s'applique désormais à chaque métal nouveau par un **jugement déterminant**. Pour les concepts les plus généraux de la nature, Kant le dit expressément : {teal}« La faculté de juger est ici, dans sa réflexion, en même temps déterminante »{/teal} (*Première Introduction*, V). Une {violet}généralisation objective{/violet} n'est donc plus un jugement *simplement* réfléchissant : elle a trouvé son universel. Ce qui reste subjectif dans cette démarche, c'est le principe qui l'a guidée, la supposition que la nature se laisse ranger sous des lois à notre portée.

    **Seuls restent subjectifs les** {pink}**jugements simplement réfléchissants**{/pink} **: le beau et la fin naturelle.** Là, la réflexion ne peut {amber}jamais aboutir à un concept qui détermine l'objet{/amber}. Pour le beau, il n'y a pas de concept du tout, seulement un plaisir. Pour le vivant, le concept de fin ne peut déterminer l'objet sans dépasser l'expérience. Dire que le {yellow}cristallin de l'œil{/yellow} a pour fin de faire converger les rayons sur la rétine, c'est seulement se donner une Idée qui guide l'exploration de l'œil ; affirmer qu'une intention l'a produit serait {red}« un jugement téléologique déterminant et, comme tel, transcendant »{/red}. Le jugement téléologique est donc {coral}« un jugement simplement réfléchissant, et non pas déterminant »{/coral} (*Première Introduction*, IX). Juger l'oiseau comme une fin naturelle, ce n'est pas affirmer qu'une intention l'a produit, c'est dire que __nous ne pouvons pas comprendre sa possibilité autrement__ : une {teal}« maxime »{/teal} de {coral}« portée subjective pour la seule faculté de juger réfléchissante »{/coral} (§75), qui {teal}« ne vaut donc pour nous que subjectivement, et non pas objectivement »{/teal} (§78).

    | Jugement | Exemple | Objectif ? |
    | déterminant | ce rail chauffé va se dilater | oui : la règle donnée fixe le verdict pour tous |
    | réfléchissant qui aboutit | les métaux se dilatent à la chaleur | oui, une fois la loi trouvée et appliquée de façon déterminante |
    | simplement réfléchissant | cet oiseau est une fin naturelle ; cette fleur est belle | non : aucun concept ne détermine l'objet |

    **Une précision évite le contresens : l'objectivité elle-même vient du sujet.** Les catégories sont des formes *a priori* de *notre* entendement ; en ce sens, toute connaissance a une origine subjective. Il faut donc distinguer {sky}l'__origine__ d'un principe{/sky} et {sky}sa __portée__{/sky}. Les {coral}catégories{/coral} ont une {coral}origine subjective{/coral} mais une {coral}**portée objective**{/coral}, parce que les objets d'expérience ne sont possibles que par elles. Le principe de la faculté de juger réfléchissante a lui aussi une origine *a priori* (il est {teal}« transcendantal quant à son origine »{/teal}, *Première Introduction*, V), mais une **portée seulement subjective**.

    **Restent deux questions.** Pourquoi le principe qui guide toute recherche de lois est-il subjectif ? Et un jugement subjectif n'est-il pas arbitraire ? La leçon suivante y répond.

    ! « Réfléchissant » ne veut pas dire « subjectif » dans tous les cas : la réflexion qui trouve un concept d'objet aboutit à un jugement déterminant, objectif ; seuls les jugements simplement réfléchissants (le beau, la fin naturelle) restent subjectifs.
    ! Le jugement déterminant n'est pas objectif parce qu'il atteindrait la chose en soi : il vaut pour les objets d'expérience, que nos formes *a priori* rendent possibles.
