- id: kant-cfj-analytique-l2d
  title: "L'induction, le vivant et la portée du jugement réfléchissant (Introduction, IV-V ; §70-71, §74-77)"
  notes: |-
    La leçon précédente a montré que le jugement réfléchissant ne peut pas être objectif. Deux objections se présentent alors : {pink}la science ne passe-t-elle pas sans cesse du particulier à des lois objectives{/pink} ? Et {pink}un jugement seulement subjectif n'est-il pas arbitraire{/pink} ? Cette leçon y répond, puis montre ce que ce statut permet : {green}__dissoudre l'antinomie du mécanisme et de la finalité__{/green}.

    **L'objection de l'induction.** Mais ne passe-t-on pas sans cesse, dans la vie courante comme en physique, du particulier à des lois générales sur les choses extérieures ? On voit des corps tomber et l'on en tire que tous les corps tombent ; Kepler, à partir des positions observées de Mars, a trouvé les lois du mouvement des planètes. Ces lois ne sont-elles pas objectives ? Kant répond en trois temps.
    - **Oui, les lois trouvées sont objectives, mais ce n'est pas la réflexion qui les rend telles.** Une fois découverte et confirmée, une loi de Kepler est une détermination de la liaison causale que l'entendement prescrit à toute la nature ; l'appliquer à une planète nouvellement observée est alors un {violet}jugement déterminant{/violet}. La réflexion **trouve** l'universel ; ce qui le fait valoir de l'objet, c'est qu'il s'inscrit dans le cadre des catégories et se vérifie dans l'expérience.
    - **Mais leur nécessité ne nous est pas donnée.** Les catégories disent que tout changement a une cause, non lesquelles. Les lois particulières {teal}« peuvent bien être contingentes du point de vue de notre entendement »{/teal}, et pourtant il faut, {teal}« si elles doivent être dites des lois »{/teal}, {teal}« qu'elles puissent être considérées comme nécessaires à partir d'un principe d'unité du divers, quand bien même ce principe serait inconnu de nous »{/teal} (Introduction, IV). L'induction seule ne donne qu'une généralité de fait, qu'une seule exception suffirait à défaire.
    - **Ce qui reste subjectif, c'est le principe de la recherche, non la loi trouvée.** Pour chercher des lois, il faut présupposer que la nature se laisse ranger en genres et en espèces à notre portée, que {teal}« la nature spécifie ses lois universelles selon le principe de la finalité pour notre pouvoir de connaître »{/teal} (Introduction, V). Sans cette présupposition, la réflexion procéderait {red}« de manière aventureuse et aveugle »{/red} (*Première Introduction*, V). Or elle ne peut être prouvée par induction, puisque toute induction la présuppose : elle reste une **maxime** de la faculté de juger, une {pink}finalité formelle{/pink} que nous prêtons à la nature pour pouvoir la connaître.

    **La finalité du vivant, elle, ne deviendra jamais une loi comme celle de Kepler.** Une loi de Kepler lie des phénomènes par la causalité {violet}efficiente{/violet}, que l'expérience peut montrer : une position, puis une autre. La fin naturelle exigerait une cause agissant par la représentation du tout, et __aucune intuition ne montre une telle cause__ : on n'observe jamais une intention (§61). Surtout, notre entendement est {violet}**discursif**{/violet} : il doit {teal}« aller du général analytique (des concepts) au particulier (l'intuition empirique donnée) »{/teal} (§77), donc comprendre un tout à partir de ses parties. Un tout qui détermine ses parties, comme l'organisme, il ne peut le penser que par la représentation d'une fin. La limite n'est donc pas provisoire, comme celle d'une science encore jeune : il est {red}« absurde »{/red} d'espérer {teal}« que puisse un jour surgir encore un Newton qui rende compréhensible ne serait-ce qu'un brin d'herbe d'après des lois naturelles que nulle intention n'a ordonnées »{/teal} (§75). Le jugement téléologique est réfléchissant **pour toujours**.

    **Dans quelle mesure il est subjectif : ni privé, ni arbitraire.** {green}Subjectif, ici, ne veut pas dire « propre à chacun »{/green}, comme l'est le goût de l'agréable. Trois traits le distinguent d'une simple préférence :
    - **il est universel** : l'entendement limite la validité de ces Idées {teal}« simplement au sujet, encore que toutefois d'une manière universelle pour tous les sujets de cette espèce »{/teal} (§76), parce qu'il tient à la structure de l'entendement humain (discursif, qui distingue le possible et l'effectif) et non à un sentiment personnel
    - **il est nécessaire** : pour les êtres organisés, la maxime est {coral}« essentiellement nécessaire »{/coral}, car {teal}« même la pensée de ces produits comme choses organisées est impossible si ne s'y trouve pas rattachée celle d'une production intentionnelle »{/teal} (§75) ; il vaut même {teal}« avec autant de nécessité pour notre faculté humaine de juger que s'il était un principe objectif »{/teal} (§76)
    - **il est fécond** : comme fil conducteur, il fait découvrir des lois que le mécanisme seul laisserait cachées (§67, §75), sans jamais contredire l'explication mécanique

    Ce qui lui manque, c'est seulement la {red}réalité objective{/red} : il ne décide pas si la nature agit réellement d'après des fins ; on ne peut même pas, dit le §74, {teal}« poser la question »{/teal}.

    **L'enjeu : c'est ce qui dissout l'antinomie.** Mécanisme et finalité, pris comme maximes régulatrices de la recherche, ne se contredisent pas : on peut chercher aussi loin que possible des causes mécaniques tout en se laissant guider par l'idée de fin. Ils ne se contredisent que si l'on transforme ces {teal}« principes fondamentaux, régulateurs pour la recherche, en principes constitutifs de la possibilité des objets eux-mêmes »{/teal} (§70). L'apparence d'antinomie vient donc de ce {red}que l'on confond un principe fondamental de la faculté de juger réfléchissante avec celui de la faculté de juger déterminante{/red} (§71).

    ! Régulateur ne veut pas dire facultatif : pour les êtres organisés, la maxime de finalité est indispensable ; seule son extension à la nature entière est « utile, mais non point indispensable » (§75).
    ! Ce qui est subjectif dans la réflexion n'est pas la loi empirique qu'elle trouve (celle de Kepler vaut de l'objet), mais le principe qui guide sa recherche, et, dans le cas du vivant, le concept de fin lui-même.
