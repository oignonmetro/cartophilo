lessons:
- id: kant-cfj-analytique-l2b
  title: "Jugement déterminant et réfléchissant, principe constitutif et régulateur (Introduction, IV ; §67, §74)"
  notes: |-
    Dès son ouverture (§61), la *Critique de la faculté de juger téléologique* range le jugement téléologique du côté de la {violet}**faculté de juger réfléchissante**{/violet} et d'en faire un {violet}**principe régulateur**{/violet}, non {violet}constitutif{/violet}. Ces deux distinctions commandent toute la Critique de la faculté de juger téléologique : __l'Analytique__ s'y réfère pour dire **en quel sens un être organisé est une « fin naturelle »** (§65, §67), __la Dialectique__ s'en sert pour **dissoudre l'antinomie** (§70-71), et les §75-76 expliquent **pourquoi ce jugement ne vaut que** {green}__**pour nous**__{/green}. Il faut donc les comprendre avant d'aller plus loin.

    {violet}**Juger**{/violet}**, c'est penser le particulier sous l'universel ; tout dépend de ce qui est donné.** La {violet}faculté de juger{/violet} en général est {teal}« le pouvoir de penser le particulier comme compris sous l'universel »{/teal} (Introduction, IV). Or ce rapport peut se parcourir dans deux sens.

    - __Si l'universel (la règle, la loi, le concept) est déjà donné__, la faculté de juger n'a qu'à lui {violet}*subsumer*{/violet} le cas particulier : elle est {violet}__**déterminante**__{/violet}. Juger que la chute de ce corps a une cause, c'est appliquer à un phénomène une loi que l'entendement fournit d'avance.
    - __Si seul le particulier est donné__, en revanche, {teal}« pour lequel l'universel doit être trouvé »{/teal}, la faculté de juger est {violet}__**réfléchissante**__{/violet} : le naturaliste devant un organisme qu'aucune loi connue n'explique doit chercher lui-même la règle qui permettra de l'étudier.

    **Constitutif ou régulateur : ce que le principe fait de l'objet.** La distinction vient de la *Critique de la raison pure*, où les Idées de la raison n'ont qu'un usage « régulateur » (une règle qu'on applique à nous-mêmes) : la raison théorique ne contient par elle-même {teal}« aucun principe *constitutif*, mais des principes simplement *régulateurs* »{/teal} (§76).

    - Un principe {violet}**constitutif**{/violet} dit ce qu'est l'objet, parce qu'il est une condition de sa possibilité même : sans la catégorie de causalité, il n'y aurait pas d'objet d'expérience du tout, seulement une suite de sensations.
    - Un principe {violet}**régulateur**{/violet}, au contraire, ne dit rien de la constitution de l'objet ; il dit comment nous devons procéder pour l'étudier. Il sert de {yellow}« fil conducteur »{/yellow} (§67) pour {teal}« orienter la recherche »{/teal} (§65).

    **Les deux distinctions se recouvrent sans se confondre.** La faculté de juger *déterminante* applique des principes *constitutifs*, que l'entendement lui prescrit ; la faculté de juger *réfléchissante* se donne des principes *régulateurs*. D'où la formule du §74 : **le concept de fin naturelle** {teal}« n'est pas constitutif pour la faculté de juger déterminante, mais il est __simplement régulateur pour la faculté de juger réfléchissante__ »{/teal}. Mais elles ne disent pas la même chose : {amber}déterminant et réfléchissant{/amber} qualifient le {amber}__mouvement du jugement__{/amber} (de l'universel donné au particulier, ou du particulier donné à l'universel cherché) ; {coral}constitutif et régulateur{/coral} qualifient le {coral}__statut d'un principe__{/coral} (déterminer l'objet, ou guider notre recherche).

    | Ce qui les distingue | Faculté de juger déterminante | Faculté de juger réfléchissante |
    | ce qui est donné | l'universel (règle, loi, concept) | seulement le particulier |
    | ce qu'elle fait | subsumer le particulier sous l'universel | chercher l'universel qui convient au particulier |
    | d'où vient son principe | de l'entendement, qui le lui prescrit | d'elle-même, qui se le donne |
    | statut du principe | constitutif | régulateur |
    | à qui il prescrit sa loi | à la nature | à elle-même (héautonomie) |
    | validité | objective | subjective, mais universelle pour tout entendement humain |

    Reste à savoir pourquoi l'un est objectif et l'autre subjectif.
