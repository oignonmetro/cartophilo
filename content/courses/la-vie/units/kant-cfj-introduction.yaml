    sentence: "« En un objet donné dans l'expérience, la finalité peut être représentée, soit à partir d'un fondement simplement **subjectif**, comme accord de sa forme [...] avec les pouvoirs de connaître [...] ; soit à partir d'un fondement **___**, comme accord de sa forme avec __la possibilité de la chose elle-même__, selon un concept de celle-ci » (Introduction, VIII)"
    answer: "objectif"
    alt: []
  - id: kant-cfj-introduction-l4-q3
    sentence: "« En un objet donné dans l'expérience, la finalité peut être représentée, soit à partir d'un fondement simplement **subjectif**, comme accord de sa forme [...] avec les pouvoirs de connaître [...] ; soit à partir d'un fondement **objectif**, comme accord de sa forme avec ___, selon un concept de celle-ci » (Introduction, VIII)"
    answer: "la possibilité de la chose elle-même"
    alt: []
  - id: kant-cfj-introduction-l4-q4
    sentence: "Celui qui juge une chose belle « prétend légitimement à l'assentiment de ___, quand bien même ce jugement est empirique et particulier » (Introduction, VII)."
    answer: "chacun"
    alt: []
  - id: kant-cfj-introduction-l4-q5
    sentence: "« car le fondement de ce plaisir est situé dans la condition générale, quoique ___, des jugements réfléchissants » (Introduction, VII)"
    answer: "subjective"
    alt: []
  - id: kant-cfj-introduction-l4-q6
    sentence: "Le jugement de goût revendique une universalité ___ : il exige l'accord de tous sans qu'aucun concept puisse la prouver."
    answer: "subjective"
    alt: []
  - id: kant-cfj-introduction-l4-q7
    sentence: "*Cette rose est belle* exige l'accord de tous ; *ce vin est ___* ne vaut que pour moi."
    answer: "agréable"
    alt: []
  - id: kant-cfj-introduction-l4-q8
    sentence: "« La faculté de juger esthétique est donc un pouvoir particulier pour apprécier des choses selon une **règle**, mais non selon des **___**. » (Introduction, VIII)"
    answer: "concepts"
    alt: []
  - id: kant-cfj-introduction-l4-q9
    sentence: "La faculté de juger téléologique procède « comme partout dans la connaissance théorique, selon des concepts, mais en observant, par rapport à certains objets de la nature, des principes particuliers, à savoir ceux d'une faculté de juger ___, ne déterminant pas d'objets » (Introduction, VIII)."
    answer: "simplement réfléchissante"
    alt: []
  - id: kant-cfj-introduction-l4-q10
    sentence: "La finalité d'un être organisé est dite objective parce qu'elle concerne l'___ interne de la chose, non l'accord de sa forme avec nos facultés ; le jugement qui la pense reste pourtant subjectif par son principe."
    answer: "organisation"
    alt: []
  - id: kant-cfj-analytique-l2b-q29
    sentence: "Subjectif ne veut pas dire privé : l'entendement limite la validité de ces Idées « simplement au sujet, encore que toutefois d'une manière ___ » (§76)."
    answer: "universelle pour tous les sujets de cette espèce"
    alt: []
  - id: kant-cfj-analytique-l2b-q30
    sentence: "Le jugement téléologique vaut pour tout entendement humain parce qu'il tient à la ___ de notre pouvoir de connaître, et non à un sentiment personnel comme le goût de l'agréable."
    answer: "structure"
    alt: ["constitution", "nature"]
  - id: kant-cfj-analytique-l2b-q31
    sentence: "Pour les êtres organisés, la maxime de finalité est « essentiellement nécessaire », car « même la pensée de ces produits comme choses ___ est impossible si ne s'y trouve pas rattachée celle d'une production intentionnelle » (§75)."
    answer: "organisées"
    alt: []
  - id: kant-cfj-analytique-l2b-q32
    sentence: "Étendue à la nature entière, la maxime de finalité est « certes utile, mais non point ___ » (§75), parce que la nature ne nous est pas donnée en totalité comme organisée."
    answer: "indispensable"
    alt: []
  - id: kant-cfj-analytique-l2b-q33
    sentence: "Ce qui manque au jugement téléologique, c'est la réalité objective : selon le §74, on ne peut ni décider si les fins naturelles requièrent une causalité intentionnelle, ni même « ___ »."
    answer: "poser la question"
    alt: []
  - id: kant-cfj-analytique-l2c-q26
    sentence: "Le principe de finalité, en tant que régulateur, vaut « avec autant de nécessité pour notre faculté humaine de juger que s'il était un principe ___ » (§76)."
    answer: "objectif"
    alt: []
  - id: kant-cfj-analytique-l2b-q34
    sentence: "Mécanisme et finalité ne se contredisent que si l'on transforme ces « principes fondamentaux, régulateurs pour la recherche, en principes ___ de la possibilité des objets eux-mêmes » (§70)."
    answer: "constitutifs"
    alt: []
  - id: kant-cfj-analytique-l2b-q35
    sentence: "Selon le §71, toute apparence d'antinomie entre mécanisme et finalité repose sur ceci « que l'on confond un principe fondamental de la faculté de juger ___ avec celui de la faculté de juger déterminante »."
    answer: "réfléchissante"
