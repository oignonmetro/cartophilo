- id: kant-cfj-analytique-l2c
  title: "Objectif ou subjectif : le jugement déterminant et le jugement réfléchissant (Introduction, II-V ; §70, §75-76)"
  notes: |-
    La leçon précédente a distingué deux usages de la faculté de juger. Il faut maintenant comprendre __pourquoi le__ {violet}__jugement déterminant__{/violet} __est__ {violet}__*objectif*__{/violet} __et le jugement__ {violet}__réfléchissant seulement *subjectif*__{/violet}, et en quel sens précis : c'est ce qui permettra au §75 de dire que la finalité ne vaut que « pour nous », sans en faire pour autant une fantaisie.

    **Pourquoi le jugement déterminant est objectif.** D'abord parce que __l'universel qu'il applique est un concept d'objet__, donné par l'{coral}entendement{/coral} : ce n'est pas la manière dont je suis affecté qui décide, c'est __une règle qui vaut pour tout ce qui tombe sous elle__. Ensuite parce que, chez Kant, {green}l'objectivité ne désigne pas l'accès à la chose en soi{/green}, mais __l'unification nécessaire des représentations sous des lois *a priori*__ : les catégories sont les conditions sans lesquelles aucun objet d'expérience ne serait possible, si bien que juger d'après elles, c'est **constituer** l'objet d'expérience. Enfin, et par conséquent, ce jugement vaut {coral}universellement et nécessairement{/coral} : le principe *tout changement a une cause* ne s'impose pas seulement à celui qui l'énonce, mais à tout être qui connaît par un entendement comme le nôtre.

    **Objectif ne veut pas dire vrai, mais valant de l'objet.** Un jugement déterminant peut être faux : on peut subsumer la baleine sous le concept de poisson. Il n'en reste pas moins objectif par sa **prétention** : il affirme quelque chose de l'objet lui-même, ce que l'expérience peut confirmer ou réfuter. C'est en ce sens qu'il est {coral}__nécessairement__ objectif{/coral} : __déterminer, c'est appliquer un concept d'objet, si bien qu'un jugement déterminant qui ne porterait pas sur l'objet ne serait plus déterminant du tout__. L'objectivité n'est pas une qualité qui s'ajouterait à lui ; elle est comprise dans sa définition.

    **Cette objectivité, il ne la tient pas de lui-même, mais de l'entendement.** La faculté de juger déterminante __n'a pas de principe propre__ : {teal}« la faculté de juger déterminante sous des lois transcendantales universelles, que donne l'entendement, se borne à subsumer ; la loi lui est prescrite *a priori* »{/teal} (Introduction, IV). Elle est l'exécutante d'une législation qui vient d'ailleurs, __comme le juge qui applique un code qu'il n'a pas écrit__. Son rapport à l'{coral}entendement{/coral} est donc bien **l'origine de son objectivité** : l'universel qu'elle applique est une catégorie, ou une loi qui en dérive, et les catégories sont les conditions sans lesquelles aucun objet d'expérience ne serait possible. Même quand elle applique un concept empirique (« ceci est un métal »), ce concept ne vaut de l'objet que parce qu'il est tiré de l'expérience et pensé sous les catégories.

    **La raison, en revanche, ne peut lui donner aucun principe objectif pour connaître la nature.** Kant partage les législations : {teal}« La législation par des concepts de la nature s'opère par l'entendement et elle est théorique. La législation par le concept de liberté s'opère par la raison et elle est simplement pratique. »{/teal} (Introduction, II). Dans la connaissance de la nature, la raison ne fait que tirer des conséquences de lois que l'entendement lui fournit ; ses Idées propres (l'âme, le monde comme totalité, Dieu) dépassent toute expérience possible, et __aucune intuition ne leur correspond__. C'est pourquoi elle ne contient {teal}« aucun principe constitutif, mais des principes simplement régulateurs »{/teal} (§76). Si l'on voulait qu'elle prescrive malgré tout sa loi à la faculté de juger déterminante, on obtiendrait, dit le §70, {red}« un principe objectif que la raison prescrirait et auquel la faculté de juger devrait se soumettre quand elle procède à une détermination, mais en se perdant hors du monde sensible, dans le transcendant »{/red} : c'est l'usage **dogmatique** du concept de fin, celui que la Dialectique dénonce (§74).

    **Un jugement déterminant ne pourrait pas être subjectif sans se contredire.** Déterminer, c'est attribuer à l'objet un prédicat. Or {red}un jugement dont le fondement serait seulement un état du sujet{/red} (un plaisir, une sensation, une disposition personnelle) dirait comment le sujet est affecté, non ce qu'est la chose : il ne déterminerait aucun objet. Dès qu'un jugement n'exprime plus que l'état du sujet, ou une manière d'ordonner sa réflexion sans concept donné, il cesse d'être déterminant.

    **Une précision évite le contresens : l'objectivité elle-même vient du sujet.** Les catégories sont des formes *a priori* de *notre* entendement ; en ce sens, toute connaissance a une origine subjective. Il faut donc distinguer {sky}l'__origine__ d'un principe{/sky} et {sky}sa __portée__{/sky}. Les {coral}catégories{/coral} ont une {coral}origine subjective{/coral} mais une {coral}**portée objective**{/coral}, parce que les objets d'expérience ne sont possibles que par elles. Le principe de la faculté de juger réfléchissante a lui aussi une origine *a priori* (il est {teal}« transcendantal quant à son origine »{/teal}, *Première Introduction*, V), mais une **portée seulement subjective**.

    **Pourquoi le jugement réfléchissant est subjectif : il ne prescrit sa loi qu'à lui-même.** La faculté de juger réfléchissante ne peut tirer son principe de l'entendement, {teal}« parce que, sinon, elle serait faculté de juger déterminante »{/teal}, ni le {teal}« prescrire à la nature »{/teal} (Introduction, IV). Elle {teal}« prescrit, non pas à la nature (comme autonomie), mais à elle-même (comme héautonomie) une loi pour la réflexion sur cette nature »{/teal} (Introduction, V). Juger l'oiseau comme une fin naturelle, ce n'est donc pas affirmer qu'une intention l'a produit ; c'est dire que __nous ne pouvons pas comprendre sa possibilité autrement__. Le principe de finalité est ainsi {teal}« une maxime »{/teal} de {coral}« portée subjective pour la seule faculté de juger réfléchissante »{/coral} (§75) : il {teal}« ne vaut donc pour nous que subjectivement, et non pas objectivement »{/teal} (§78).

    **Il ne peut pas être objectif, par définition même.** Ce qui le définit, c'est que l'universel __n'est pas donné__ : il est à trouver. Or le principe qui guide cette recherche ne peut venir de l'entendement (sinon le jugement serait déterminant), ni être tiré de la nature, puisqu'il doit __précéder toute comparaison__ des choses entre elles : on ne peut pas observer que la nature est ordonnée pour nous avant d'avoir commencé à l'ordonner. Il ne peut donc être qu'une règle que notre esprit se donne pour conduire sa propre recherche.

    **Restent deux objections.** La science ne tire-t-elle pas sans cesse du particulier des lois objectives ? Et un jugement seulement subjectif n'est-il pas arbitraire ? La leçon suivante y répond.

    ! Le jugement déterminant n'est pas objectif parce qu'il atteindrait la chose en soi : il vaut pour les objets d'expérience, que nos formes *a priori* rendent possibles.
    ! Le vocabulaire de l'autonomie varie : dans l'Introduction (V), l'autonomie est celle de l'entendement, qui légifère sur la nature, et l'héautonomie celle de la faculté de juger, qui ne légifère que pour elle-même ; au §71, Kant appelle « autonomie » celle de la faculté de juger réfléchissante et « hétéronomie » celle de la déterminante, qui doit suivre les lois fournies par l'entendement.
