- id: kant-cfj-introduction-l4
  title: "Subjectif, mais pas arbitraire : le beau et la fin naturelle (Introduction, VII-VIII ; §70-71, §75-76)"
  notes: |-
    Les leçons précédentes ont établi que seuls restent subjectifs les jugements **simplement réfléchissants** : celui qui juge une chose belle, celui qui juge un vivant comme une fin naturelle. Encore faut-il entendre le mot au sens de Kant. {red}Au sens ordinaire, « subjectif » veut dire arbitraire, affaire de préférence{/red} ; {green}au sens transcendantal, il veut dire que le **principe** du jugement vient de notre manière de juger, non de la constitution des choses{/green}. En ce second sens, ces deux jugements sont subjectifs, mais __ni privés, ni sans rapport aux objets__ ; et ils le sont de deux façons différentes.

    **Une même faculté de juger, deux sortes de finalité.** Dans un objet de l'expérience, dit Kant, la finalité peut être représentée {teal}« soit à partir d'un fondement simplement subjectif, comme accord de sa forme »{/teal} avec nos pouvoirs de connaître, {teal}« soit à partir d'un fondement objectif, comme accord de sa forme avec la possibilité de la chose elle-même, selon un concept de celle-ci »{/teal} (Introduction, VIII). La première est celle du **beau** : la forme de la rose s'accorde avec le jeu de nos facultés. La seconde est celle du **vivant** : les parties de l'oiseau s'accordent avec ce que l'oiseau doit être pour vivre.

    **Le jugement esthétique : sans concept, mais universel.** *Cette rose est belle* ne repose sur aucun concept de la rose et n'apprend rien sur elle : son prédicat exprime le {pink}plaisir{/pink} que suscite l'accord libre de l'imagination et de l'entendement. Il n'est pourtant pas un simple jugement d'agrément comme *ce vin est agréable*, qui ne vaut que pour moi. Celui qui éprouve ce plaisir {teal}« prétend légitimement à l'assentiment de chacun, quand bien même ce jugement est empirique et particulier ; car le fondement de ce plaisir est situé dans la condition générale, quoique subjective, des jugements réfléchissants »{/teal} (Introduction, VII) : l'accord de l'imagination et de l'entendement est requis pour toute connaissance, donc commun à tous. D'où une {coral}**universalité subjective**{/coral} : l'exigence de l'accord de tous, sans concept qui la prouve.

    **Le jugement téléologique : par concepts, sur l'objet, et pourtant subjectif par son principe.** Le §61 parle bien d'une {violet}« finalité objective »{/violet} : comment un jugement sur une finalité objective peut-il être subjectif ? Parce que les deux mots ne portent pas sur la même chose. {green}La finalité est objective par son **objet**{/green} : elle concerne l'organisation interne de la chose, ses parties comme moyens et fins les unes des autres, et non l'accord de sa forme avec nos facultés. Aussi ce jugement procède-t-il par concepts, et sert-il la connaissance : la faculté de juger téléologique procède {teal}« comme partout dans la connaissance théorique, selon des concepts »{/teal}. Mais {red}son **principe** reste subjectif{/red} : elle suit {teal}« ceux d'une faculté de juger simplement réfléchissante, ne déterminant pas d'objets »{/teal} (Introduction, VIII), car elle {teal}« ne peut alléguer aucun principe tiré du concept de la nature »{/teal} qui autoriserait à prêter des fins à la nature (ibid.). Notre entendement discursif ne peut comprendre l'organisation d'un vivant par le seul mécanisme : il la pense comme une fin, sans pouvoir affirmer que la nature agit pour des fins.

    | Ce qui les distingue | Jugement esthétique | Jugement téléologique |
    | exemple | cette rose est belle | cet oiseau est une fin naturelle |
    | finalité visée | subjective : accord de la forme avec nos facultés | objective : organisation interne de la chose |
    | ce qui le porte | le sentiment de plaisir, sans concept | des concepts (l'idée de fin naturelle) |
    | statut du principe | subjectif | subjectif, régulateur |
    | validité revendiquée | universalité subjective : l'accord de tous | nécessité de méthode pour la science du vivant |

    **Dans quelle mesure il est subjectif : ni privé, ni arbitraire.** {green}Subjectif, ici, ne veut pas dire « propre à chacun »{/green}, comme l'est le goût de l'agréable. Trois traits le distinguent d'une simple préférence :
    - **il est universel** : l'entendement limite la validité de ces Idées {teal}« simplement au sujet, encore que toutefois d'une manière universelle pour tous les sujets de cette espèce »{/teal} (§76), parce qu'il tient à la structure de l'entendement humain (discursif, qui distingue le possible et l'effectif) et non à un sentiment personnel
    - **il est nécessaire** : pour les êtres organisés, la maxime est {coral}« essentiellement nécessaire »{/coral}, car {teal}« même la pensée de ces produits comme choses organisées est impossible si ne s'y trouve pas rattachée celle d'une production intentionnelle »{/teal} (§75) ; il vaut même {teal}« avec autant de nécessité pour notre faculté humaine de juger que s'il était un principe objectif »{/teal} (§76)
    - **il est fécond** : comme fil conducteur, il fait découvrir des lois que le mécanisme seul laisserait cachées (§67, §75), sans jamais contredire l'explication mécanique

    Ce qui lui manque, c'est seulement la {red}réalité objective{/red} : il ne décide pas si la nature agit réellement d'après des fins ; on ne peut même pas, dit le §74, {teal}« poser la question »{/teal}.

    **L'enjeu : c'est ce qui dissout l'antinomie.** Mécanisme et finalité, pris comme maximes régulatrices de la recherche, ne se contredisent pas : on peut chercher aussi loin que possible des causes mécaniques tout en se laissant guider par l'idée de fin. Ils ne se contredisent que si l'on transforme ces {teal}« principes fondamentaux, régulateurs pour la recherche, en principes constitutifs de la possibilité des objets eux-mêmes »{/teal} (§70). L'apparence d'antinomie vient donc de ce {red}que l'on confond un principe fondamental de la faculté de juger réfléchissante avec celui de la faculté de juger déterminante{/red} (§71).

    ! « Finalité objective » ne veut pas dire « jugement objectif » : la finalité de l'organisme est objective par son objet (l'organisation de la chose) ; le jugement qui la pense reste subjectif par son principe.
    ! Le jugement de goût n'est pas un jugement d'agrément : *ce vin est agréable* ne vaut que pour moi, *cette rose est belle* exige l'accord de tous.
    ! Régulateur ne veut pas dire facultatif : pour les êtres organisés, la maxime de finalité est indispensable ; seule son extension à la nature entière est « utile, mais non point indispensable » (§75).
    ! Le vocabulaire de l'autonomie varie : dans l'Introduction (V), l'autonomie est celle de l'entendement, qui légifère sur la nature, et l'héautonomie celle de la faculté de juger, qui ne légifère que pour elle-même ; au §71, Kant appelle « autonomie » celle de la faculté de juger réfléchissante et « hétéronomie » celle de la déterminante, qui doit suivre les lois fournies par l'entendement.
