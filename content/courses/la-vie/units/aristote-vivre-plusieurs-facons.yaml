- id: aristote-vivre-plusieurs-facons-p5
  title: "Toucher, la condition de la vie animale"
  notes: |-
    **Le paragraphe fonde la sensation :** {violet}**le toucher**{/violet} **est** {coral}**le fondement de la sensation**{/coral}**, commun à tous les animaux ; il se sépare des autres sens comme la nutrition se sépare de la sensation.** La structure du vivant se répète donc à l'étage de l'animal.

    **La même asymétrie, un étage plus haut.**

    | Étage | La base, qui peut exister seule | Ce qui la suppose |
    | le vivant | la nutrition | la sensation |
    | l'animal | le toucher | les autres sens |

    Comme la plante a la nutrition sans la sensation, {yellow}certains animaux{/yellow} ont le toucher sans les autres sens ; {red}l'inverse ne se trouve pas{/red}. {coral}__Tout animal touche, tout animal ne voit pas.__{/coral}

    **Pourquoi le toucher ?** Le texte remet la raison à plus tard ; *De l'âme*, III, 12-13 la donne : {teal}« s'il n'a pas de sensation quand il est touché, l'animal sera incapable de fuir ceci et de prendre cela. Or, dans ces conditions, il lui sera impossible d'assurer sa conservation »{/teal} (III, 12, 434b14-18). Le toucher est le sens de {green}__ce qui touche le corps__{/green} : la nourriture, que {yellow}le goût{/yellow}, {teal}« une sorte de toucher »{/teal}, saisit, et ce qui menace. Aussi {teal}« il ne peut y avoir d'animal sans le toucher »{/teal}, tandis que {teal}« les autres sens, en revanche, ont pour but le bien-être »{/teal} (434b22-25).

    **« Parcelle » de l'âme.** Le mot annonce la question suivante (413b13-16) : la nutritive est-elle une âme, ou une partie d'âme ?

    **Pour la vie,** le paragraphe lie la sensation à la **conservation** : {coral}__sentir, d'abord, c'est se garder en vie__{/coral}. Le toucher est le sens de la survie, les autres sens servent le bien-vivre.

    ! « Le fondement de la sensation » ne veut pas dire le sens le plus noble : c'est le plus nécessaire, celui sans lequel aucun autre n'existe.
  passage:
    label: "413b4-10"
    text: "Or le fondement de la sensation, dévolu à tous, est le toucher. Et, de même que la fonction nutritive peut être séparée du toucher et de toute sensation, de la même façon le toucher peut l'être des autres sensations. Mais nous appelons nutritive cette sorte de parcelle de l'âme que même les végétaux ont en partage, alors que, manifestement, les animaux possèdent tous la sensation tactile."
  tables:
