- id: aristote-vivre-plusieurs-facons-p6
  title: "L'âme se définit par les façons de vivre"
  notes: |-
    **Le paragraphe conclut, provisoirement :** {violet}**l'âme**{/violet} **est** {coral}**principe des manifestations de la vie et se définit par elles**{/coral}**.** La cause de chacune est remise à plus tard.

    **« Nous en parlerons plus tard. »** Le chapitre s'était ouvert sur l'exigence d'une définition qui donne {teal}« le motif pour lequel il en va ainsi »{/teal} (413a15-16). Ici, Aristote {amber}ne la remplit pas encore{/amber} : il dit **le fait**, ce que l'âme fait, et renvoie **la cause** aux chapitres qui étudieront chaque faculté. C'est un point de méthode : {green}__on connaît l'âme par ses fonctions avant d'en connaître la raison__{/green}.

    **Le retour de la liste.** Les quatre façons de vivre du début reviennent, mais dans l'**ordre inverse** : la première liste allait de l'intelligence à la nutrition, la conclusion va de la nutrition à la pensée. Entre les deux, le texte a établi que {coral}la nutrition est la base de toutes{/coral}.

    | Façon de vivre (413a23-25) | Fonction de l'âme (413b12-13) |
    | le mouvement nutritif, dépérissement et croissance | nutritive |
    | la sensation | sensitive |
    | l'intelligence | cogitative |
    | le mouvement local et le repos | le mouvement |

    **Pour la vie,** la conclusion renverse la perspective du chapitre 1 : {green}__l'âme n'est rien d'autre que le principe des façons de vivre__{/green}. On ne définit pas la vie par l'âme, {coral}on définit l'âme par la vie{/coral}.

    ! « Se définit par » ne fait pas de l'âme une somme de facultés : la phrase qui suit (413b13-16) demande si chacune est une âme ou une partie d'âme.
  passage:
    label: "413b10-13"
    text: "Quant à la raison de chacun de ces phénomènes, nous en parlerons plus tard. Et, pour l'instant, l'on se bornera simplement à dire que l'âme est principe des manifestations qu'on vient d'évoquer et qu'elle se définit par les fonctions nutritive, sensitive, cogitative et par le mouvement."
  tables:
