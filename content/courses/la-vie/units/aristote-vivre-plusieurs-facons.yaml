- id: aristote-vivre-plusieurs-facons-p3
  title: "Se nourrir suffit à vivre, et toute autre vie le suppose"
  notes: |-
    **Le paragraphe ordonne les façons de vivre :** {coral}**la vie nutritive peut exister sans les autres, les autres non sans elle**{/coral}**, du moins** {amber}**chez les mortels**{/amber}**.** La preuve est un fait : {yellow}les végétaux{/yellow}, qui n'ont qu'elle.

    **Une asymétrie.** La nutrition {green}__peut être séparée__{/green} des autres façons de vivre : la plante vit sans sentir. {red}L'inverse est impossible{/red} : pas de sensation, pas de pensée, sans un corps qui se nourrit. La liste du premier paragraphe devient donc une {violet}série{/violet}, dont la nutrition est la base.

    | Vivant | Ses façons de vivre |
    | la plante | la nutrition seule |
    | l'animal | la nutrition et la sensation, parfois le mouvement local |
    | l'homme | la nutrition, la sensation, le mouvement, l'intelligence |
    | le dieu | l'intelligence, sans nutrition |

    **Quelle séparation ?** {sky}Shields{/sky} et {sky}Polansky{/sky} distinguent la séparation **de lieu**, **de définition** et **de fait**. Ici, c'est une séparation **de fait** : la nutrition {green}existe réellement seule{/green} dans la plante. Chez l'animal, nutrition et sensation ne sont distinctes que {amber}par la définition{/amber}.

    **« Chez les mortels. »** La restriction réserve les vivants qui {red}ne se nourrissent pas{/red}. Pour {sky}Shields{/sky} et {sky}Polansky{/sky}, ce sont les dieux, qui pensent sans corps qui dépérisse ; pour {sky}Pellegrin{/sky}, aussi les astres, vivants mais dépourvus d'âme nutritive. {sky}Shields{/sky} ajoute que la dépendance des autres facultés envers la nutrition est une {violet}nécessité hypothétique{/violet} : un corps qui sent doit d'abord se maintenir.

    **Pour la vie,** c'est sa structure : {coral}__se nourrir est la condition de toute vie mortelle, et suffit à faire un vivant__{/coral}.

    ! « Séparée » ne veut pas dire séparée dans l'espace : chez l'animal, nutrition et sensation sont dans le même vivant ; la plante montre seulement que la première peut exister sans la seconde.
  passage:
    label: "413a31-b1"
    text: "Or, si cette forme de vie peut être séparée des autres, les autres, en revanche, ne peuvent l'être de celle-ci chez les mortels. Et on le voit dans le cas des végétaux, puisque aucune autre faculté de l'âme ne leur est dévolue."
  tables:
