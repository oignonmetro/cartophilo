# Unité de texte (voir content/textes.md) : Aristote, De l'âme, II, 2,
# 413a20-b13, trad. Bodéüs (Œuvres complètes, Flammarion), texte fourni par
# l'utilisateur, vérifié sur l'édition (appels de note et repères marginaux
