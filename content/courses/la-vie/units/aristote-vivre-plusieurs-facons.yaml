- id: aristote-vivre-plusieurs-facons-ouverture
  title: "Une âme ou des parties d'âme ? La vie de la bouture et de l'insecte coupé"
  notes: |-
    **Aussitôt après, Aristote pose la question que la conclusion laissait ouverte :** {amber}**chacune des fonctions est-elle une âme, ou une partie d'âme ?**{/amber} Et si c'est une partie, {amber}est-elle séparée par la raison seulement, ou aussi dans l'espace ?{/amber}

    **Deux cas embarrassants.** {yellow}La plante{/yellow} dont on sépare un rameau : chaque partie vit, {teal}« comme si l'âme qui se trouve en elles était réellement unique en chaque plante et potentiellement multiple »{/teal}. {yellow}L'insecte{/yellow} qu'on sectionne : chaque segment {teal}« est, en effet, doué de sensation ainsi que de mouvement local »{/teal}. {green}__L'âme est une en acte, plusieurs en puissance__{/green} : elle ne se divise pas en morceaux, mais un vivant peut en devenir plusieurs.

    **Pour la vie,** c'est la question de son {violet}unité{/violet} : {coral}__un vivant n'est pas toujours un individu indivisible__{/coral}, et la bouture fait voir qu'une même vie peut se multiplier.

    ! Ces cas ne prouvent pas que l'âme soit faite de parties dans l'espace : chaque segment qui vit a l'âme entière de son espèce, non un morceau d'âme.
  passage:
    label: "Ouverture"
    source: "De l'âme, II, 2, 413b13-22"
    text: "Est-ce que, cependant, chacun de ces principes constitue une âme ou bien une parcelle d'âme ? Et, dans ce dernier cas, est-ce que cela implique une séparation uniquement de raison ou bien aussi de lieu ? Pour certains d'entre eux, ce n'est pas difficile à voir, mais il y a quelques cas embarrassants. De même, en effet, que chez les plantes, certaines parties segmentées ont manifestement la vie, même lorsqu'on les sépare l'une de l'autre, comme si l'âme qui se trouve en elles était réellement unique en chaque plante et potentiellement multiple, de la même façon, nous voyons que c'est aussi ce qui se produit, avec d'autres traits distinctifs de l'âme, dans le cas des insectes, lorsqu'on les sectionne : chacun des segments est, en effet, doué de sensation ainsi que de mouvement local."
  points:
  - id: aristote-vivre-plusieurs-facons-ouverture-1
    sentence: "*De l'âme*, II, 2 : « Est-ce que, cependant, chacun de ces principes constitue ___ ou bien une parcelle d'âme ? »"
    answer: "une âme"
    alt: []
  - id: aristote-vivre-plusieurs-facons-ouverture-2
    sentence: "*De l'âme*, II, 2 : « est-ce que cela implique une séparation uniquement de raison ou bien aussi de ___ ? »"
    answer: "lieu"
    alt: []
  - id: aristote-vivre-plusieurs-facons-ouverture-3
    sentence: "*De l'âme*, II, 2, sur les plantes dont les parties séparées vivent : « comme si l'âme qui se trouve en elles était réellement unique en chaque plante et ___ »."
    answer: "potentiellement multiple"
    alt: []
  - id: aristote-vivre-plusieurs-facons-ouverture-4
    sentence: "*De l'âme*, II, 2, sur les insectes sectionnés : « chacun des segments est, en effet, doué de ___ ainsi que de mouvement local »."
    answer: "sensation"
    alt: []
- id: aristote-vivre-plusieurs-facons-o1
  title: "Ce que vivre veut dire, d'après ce texte : une série, de la plante à la pensée"
  notes: |-
    **Le texte donne la définition la plus large de la vie chez Aristote.** Domaine par domaine, ce qu'il en dit, suppose ou permet d'en penser :

    **La définition.** {green}__Vivre n'a pas une essence unique : c'est une famille de façons d'être actif__{/green}, et une seule suffit. Mais la famille n'est pas un assemblage : {coral}les façons de vivre forment une série{/coral}, où chacune suppose la précédente, sur la base de la nutrition. Le critère est donc à la fois {violet}disjonctif{/violet} (une seule suffit) et {violet}ordonné{/violet} (pas n'importe laquelle sans la nutrition).

    | Vivant | Ce qu'il est de plus que le précédent | Ce que cela suppose |
    | la plante | un vivant : il se nourrit, croît, dépérit | rien d'autre |
    | l'animal | un vivant qui sent, au moins par le toucher | la nutrition |
    | l'animal qui se déplace | il sent aussi à distance | le toucher |
    | l'homme | il pense | la sensation |

    **Le statut ontologique.** La vie n'a pas de frontière tranchée : {teal}« Ainsi la nature passe petit à petit des êtres inanimés aux animaux, de sorte que, du fait de cette continuité, on n'aperçoit pas la frontière entre eux »{/teal} (*Histoire des animaux*, VIII, 1, 588b4-6). {amber}La série du *De l'âme* est aussi une continuité dans la nature{/amber} : la plante paraît {teal}« comme animée »{/teal} comparée aux corps, {teal}« et comme inanimée comparée aux animaux »{/teal}.

    **Le statut épistémologique.** Le texte part de ce qui se voit et de ce qui se dit : {yellow}« visiblement »{/yellow}, {yellow}« manifestement »{/yellow}, {yellow}« nous les appelons »{/yellow}. {green}__La vie se reconnaît à ses manifestations__{/green}, et l'âme se définit par elles ; la cause est remise à plus tard. On connaît donc la vie {amber}par en bas et par ses effets{/amber}.

    **La mort.** Deux limites se dessinent. Pour la plante, {red}__la vie dure tant qu'elle peut se nourrir__{/red}. Pour l'animal, le toucher est la condition de la vie : {teal}« c'est par celui-ci que se trouve définie la vie, puisque, sans le toucher, on a montré l'impossibilité d'être un animal »{/teal}, et l'excès du tangible, le trop chaud, le trop froid, {red}« supprime l'animal »{/red}, non l'organe seulement (III, 13, 435b13-17).

    **Vivre et bien vivre.** Le toucher sert à vivre, {teal}« les autres sens, en revanche, l'animal les possède [...] non pour être animal, mais pour l'être bien »{/teal} (III, 13, 435b19-21). {coral}__La série des façons de vivre est aussi une série du nécessaire au meilleur__{/coral} : se nourrir et toucher pour exister, voir et entendre pour vivre bien, penser enfin, ce qui est propre à l'homme.

    ! Dire que la nutrition est la base n'est pas dire qu'elle est la vie la plus haute : elle est la plus commune, et la pensée la plus haute.
