- id: aristote-vivre-plusieurs-facons-p1
  title: "Vivre se dit de plusieurs façons : une seule suffit à faire un vivant"
  notes: |-
    **Le paragraphe pose le critère du vivant :** {violet}**l'animé se distingue de l'inanimé par la vie**{/violet}**, et** {coral}**il y a vie dès qu'il y a une seule de ses manifestations**{/coral}**.**

    **Un point de départ, non une démonstration.** {teal}« Disons donc, en guise de point de départ »{/teal} : Aristote ne prouve pas que l'animé se distingue par la vie, il {amber}le pose{/amber}, comme ce que chacun accorde. Le travail commence ensuite : dire ce que « vivre » veut dire.

    **« Vivre s'entend de plusieurs façons. »** Le mot n'a pas un seul sens, parce que les vivants ne vivent pas tous de la même manière. D'où le critère : {green}__il suffit d'une seule manifestation__{/green}, {red}il n'en faut pas toutes{/red}.

    | Manifestation | Qui l'a |
    | l'intelligence | l'homme |
    | la sensation | tous les animaux |
    | le mouvement local et le repos | certains animaux seulement |
    | le mouvement nutritif, dépérissement et croissance | tout vivant mortel, plante comprise |

    La liste va {amber}du plus haut au plus bas{/amber}, et la dernière ligne est la plus large : elle prépare la suite, qui fera de la nutrition la condition de toutes les autres.

    **Deux précisions de vocabulaire.** {yellow}« Le mouvement local et le repos »{/yellow} vont ensemble : se mouvoir, c'est aussi pouvoir s'arrêter, comme le corps naturel a {teal}« un principe de mouvement et de stabilité en lui-même »{/teal} (412b16-17). Et {yellow}« le mouvement nutritif »{/yellow} prend « mouvement » au sens large de **changement** : croître et dépérir sont des mouvements selon la quantité.

    **Pour la vie,** c'est sa définition la plus large : {coral}__vivre n'est pas une propriété, mais une famille de manières d'être actif__{/coral}.

    ! « Ne serait-ce qu'une seule » : la plante, qui n'a que la nutrition, vit autant que l'homme ; elle ne vit pas moins, elle vit d'une seule façon.
  passage:
    label: "413a20-25"
