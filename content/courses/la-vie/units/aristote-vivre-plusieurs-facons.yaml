id: aristote-vivre-plusieurs-facons
title: "Aristote : vivre se dit de plusieurs façons, et une seule suffit"
subtitle: "De l'âme, II, 2, 413a20-b13"
icon: page
color: coral
intro: |-
  Le point de départ du chapitre 2 du livre II. Ce qui distingue l'animé de l'inanimé, c'est la vie ; mais vivre se dit de plusieurs façons, et il suffit d'une seule pour qu'il y ait vie. Ces façons s'ordonnent : se nourrir suffit à vivre, et tout le reste le suppose ; sentir, à commencer par toucher, fait l'animal. L'âme est le principe de ces fonctions, et se définit par elles.
lessons:
- id: aristote-vivre-plusieurs-facons-i1
  title: "Ce qui distingue le vivant : la thèse et le plan"
  notes: |-
    **Le texte répond à la question** {amber}**« qu'est-ce qui distingue l'animé de l'inanimé ? »**{/amber} **:** {violet}**la vie**{/violet}**, mais** {coral}**vivre se dit de plusieurs façons, et une seule suffit**{/coral}**.** C'est le « point de départ » du chapitre 2. Le chapitre 1 avait donné une formule commune de l'âme ; or une définition doit {teal}« non seulement montrer le fait dont il s'agit [...], mais encore contenir et rendre manifeste le motif pour lequel il en va ainsi »{/teal} (413a13-16). Aristote repart donc des faits : de ce qu'on voit vivre.

    La thèse réunit deux affirmations. L'une porte sur la **définition** de la vie : {green}__elle se reconnaît à ses manifestations__{/green}, et il suffit d'{amber}une seule{/amber} (intelligence, sensation, mouvement local, nutrition) : le critère est {violet}disjonctif{/violet}. L'autre porte sur leur **ordre** : {green}__la nutrition peut exister seule, les autres non sans elle__{/green}, et la sensation, fondée sur le toucher, fait l'animal. La seconde est nécessaire à la première : {pink}sans cet ordre, la liste ne serait qu'un assemblage{/pink} ; {coral}avec lui, les façons de vivre forment une série qui repose sur la nutrition{/coral}.

    Le texte procède en six temps. **Les lignes** {teal}**413a20-25**{/teal} **posent le critère** et sa pluralité ; **les lignes** {teal}**413a25-31**{/teal} **l'étendent aux plantes** ; **les lignes** {teal}**413a31-b1**{/teal} **ordonnent les façons de vivre** ; **les lignes** {teal}**413b1-4**{/teal} **distinguent l'animal**, **les lignes** {teal}**413b4-10**{/teal} **fondent la sensation sur le toucher**, et **les lignes** {teal}**413b10-13**{/teal} **concluent sur l'âme**.

    | Mouvement | Lieu | Ce qui s'y joue |
    | poser le critère du vivant et sa pluralité | 413a20-25 | l'animé se distingue par la vie, et il y a vie dès qu'il y a une seule de ses manifestations : intelligence, sensation, mouvement local, nutrition |
    | reconnaître la vie aux plantes | 413a25-31 | les plantes croissent et dépérissent de tous côtés par un principe qui est en elles : elles vivent, aussi longtemps qu'elles se nourrissent |
    | ordonner les façons de vivre | 413a31-b1 | la vie nutritive peut exister seule, les autres ne le peuvent pas sans elle chez les mortels : les végétaux le montrent |
    | distinguer l'animal par la sensation | 413b1-4 | la nutrition fait le vivant, la sensation l'animal, puisqu'on appelle animaux des êtres fixes qui sentent |
    | fonder la sensation sur le toucher | 413b4-10 | le toucher se sépare des autres sens comme la nutrition de la sensation, et tous les animaux l'ont |
    | conclure sur l'âme | 413b10-13 | l'âme est principe de ces fonctions et se définit par elles ; la cause de chacune est remise à plus tard |

    **Contre qui ?** Contre ceux qui ne reconnaissent la vie qu'au {red}mouvement visible{/red} et refuseraient de dire vivante la plante, qui ne se déplace pas. Et contre {sky}**Empédocle**{/sky}, qui explique la croissance des plantes par les éléments, {red}la terre qui descend, le feu qui monte{/red} (II, 4, 415b28-416a2) : la croissance en directions contraires montre {green}un principe propre au vivant{/green}.

    ! La liste n'est pas une conjonction : il ne faut pas toutes ces manifestations pour vivre, une seule suffit.
