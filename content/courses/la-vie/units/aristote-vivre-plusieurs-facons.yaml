- id: aristote-vivre-plusieurs-facons-o2
  title: "Définir la vie par ses fonctions : Empédocle, Bichat, la biologie d'aujourd'hui"
  notes: |-
    **Une définition de la vie par une série de fonctions se mesure à trois autres manières de penser le vivant.**

    **Empédocle : la plante comme mélange d'éléments.** Aristote juge qu'{sky}**Empédocle**{/sky} {teal}« a bien tort d'ajouter à ce propos que la croissance, chez les plantes, s'effectue vers le bas, selon l'enracinement, parce que la terre se porte naturellement dans cette direction, et vers le haut, parce que le feu possède ce mouvement »{/teal} (II, 4, 415b28-416a2). Deux objections : {red}le haut et le bas de la plante ne sont pas ceux du monde{/red}, puisque {teal}« ce qui correspond à la tête des animaux, ce sont les racines des plantes »{/teal} ; et {teal}« qu'est-ce qui assure la cohésion du feu et de la terre qui se portent en sens opposés ? »{/teal} (416a2-8). {green}__C'est l'argument de 413a25-31 retourné contre son adversaire__{/green} : des mouvements contraires tenus ensemble supposent l'âme.

    **Bichat : deux vies au lieu d'une série.** Les *Recherches physiologiques sur la vie et la mort* distinguent une vie {violet}« au-dedans de soi »{/violet}, la {violet}vie organique{/violet}, que vit le végétal, et une vie {violet}animale{/violet}, tournée vers le dehors : l'animal {teal}« rapporte tout à son existence, il existe hors de lui, il est l'habitant du monde »{/teal}. {green}La base végétale est commune aux deux auteurs{/green}. Mais Bichat range la **motricité** avec la sensibilité dans la vie animale, {pink}là où Aristote l'en détache{/pink} par le cas des animaux fixes ; et il parle de {amber}deux vies{/amber}, Aristote d'{amber}une série{/amber} dont chaque terme suppose le précédent.

    **La biologie d'aujourd'hui : l'échec des listes.** Les définitions par une liste de propriétés {red}échouent par contre-exemples{/red} : {yellow}les fourmis ouvrières{/yellow} ne se reproduisent pas et vivent, {yellow}les cristaux{/yellow} croissent et ne vivent pas. D'où, chez certains philosophes de la biologie, {violet}le pluralisme{/violet} : plusieurs définitions légitimes de la vie (cours SEP « Life », dans la piste Idées). Aristote avait déjà renoncé à {red}une liste de conditions toutes nécessaires{/red} : une seule suffit. Et son critère de la croissance écarte le cristal : {green}__la plante croît par un principe qui est en elle, et de tous côtés__{/green}, ce qu'aucun dépôt de matière ne fait. Ce rapprochement est une lecture, non une thèse du texte.

    | Auteur | Comment il pense la vie | Ce qu'Aristote lui oppose ou partage |
    | Empédocle | un mélange d'éléments qui vont chacun vers son lieu | il faut un principe qui tienne ensemble les mouvements contraires |
    | Bichat | deux vies, organique et animale | la base végétale, mais la sensation sans le mouvement |
    | la biologie d'aujourd'hui | plusieurs définitions, faute d'une liste qui tienne | une seule façon de vivre suffit, mais toutes reposent sur la nutrition |

    ! Le pluralisme contemporain renonce à unifier les définitions ; Aristote, lui, les ordonne : plusieurs façons de vivre, une seule base.
