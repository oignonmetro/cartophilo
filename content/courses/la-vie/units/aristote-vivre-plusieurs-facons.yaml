- id: aristote-vivre-plusieurs-facons-p4
  title: "Le vivant et l'animal : la sensation, non le mouvement, fait l'animal"
  notes: |-
    **Le paragraphe distingue deux critères :** {violet}**la nutrition fait le vivant**{/violet}**,** {coral}**la sensation fait l'animal**{/coral}**.** Et ce n'est pas le mouvement qui fait l'animal, puisque certains sentent sans se déplacer.

    **« En vertu de ce principe ».** Le « donc » tire la conséquence du paragraphe précédent : {green}__c'est par la nutrition que la vie appartient aux vivants__{/green}, à tous, puisqu'elle est la seule qui puisse exister seule.

    **« Bien que ».** La concession introduit un second critère, pour un second concept. Le vivant et l'{violet}animal{/violet} ne se confondent pas : en grec, \`zôon\`, l'animal, est de la famille de \`zên\`, vivre, mais {amber}tout vivant n'est pas un animal{/amber}. L'animal se reconnaît d'abord à la sensation.

    **La preuve : les animaux fixes.** Des êtres {teal}« qui ne bougent pas et ne changent pas de place, mais qui sont doués de sensation »{/teal}, on les appelle {teal}« des animaux et pas seulement des vivants »{/teal}. Si le mouvement faisait l'animal, ils ne seraient que des plantes. L'*Histoire des animaux* en donne des exemples : {yellow}les pinnes{/yellow}, qui {teal}« vivent fixées »{/teal}, {yellow}les ascidies{/yellow}, et {yellow}l'éponge{/yellow}, qui {teal}« ressemble complètement aux plantes »{/teal} (VIII, 1, 588b12-21).

    | Critère | Ce qu'il fait | Le cas qui le montre |
    | la nutrition | le vivant | la plante, qui n'a qu'elle |
    | la sensation | l'animal | l'animal fixe, qui sent sans se déplacer |
    | le mouvement local | certains animaux seulement | l'animal fixe, qui ne l'a pas |

    **Pour la vie,** le paragraphe sépare deux concepts que la langue rapproche : {coral}__être vivant et être animal__{/coral}. La vie s'étend plus loin que l'animalité, jusqu'à la plante.

    ! « Fondamentalement identifiable » ne veut pas dire que tout ce qui est fixe soit une plante : c'est la sensation, non l'immobilité, qui tranche.
  passage:
    label: "413b1-4"
    text: "Donc c'est en vertu de ce principe que la vie est dévolue aux vivants, bien que l'animal soit fondamentalement identifiable grâce au critère de la sensation. En effet, les êtres qui ne bougent pas et ne changent pas de place, mais qui sont doués de sensation, nous les appelons des animaux et pas seulement des vivants."
