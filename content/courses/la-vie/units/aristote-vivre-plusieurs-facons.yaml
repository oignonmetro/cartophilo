- id: aristote-vivre-plusieurs-facons-p2
  title: "La plante vit : elle croît par elle-même dans tous les sens"
  notes: |-
    **Le paragraphe étend la vie aux plantes :** {violet}**tous les êtres qui croissent**{/violet} **vivent, parce qu'ils ont** {coral}**en eux-mêmes le principe de leur croissance**{/coral}**, une croissance qui va dans des directions contraires.** C'est l'application du critère : une seule manifestation, la nutrition, suffit.

    | Moment | Fragment | Ce qui s'y joue |
    | tirer la conséquence et en donner la raison | 1 | les plantes vivent, car elles ont en elles le principe qui les fait croître et dépérir dans des directions contraires |
    | décrire cette croissance et lier la vie à la nourriture | 2 | elles croissent vers le haut et vers le bas, de tous côtés, et vivent aussi longtemps qu'elles se nourrissent |

    === 1 Des directions contraires, un principe intérieur

    **« Tous les êtres qui se développent »** traduit le grec `ta phuomena`, {yellow}les plantes{/yellow}, « ce qui pousse » (du même verbe que `phusis`, la nature). Aristote ne dit pas « il est évident que les plantes vivent » : il en donne {amber}une raison{/amber}, tirée de ce qu'on voit (« visiblement »).

    **La raison.** Un corps inanimé ne se meut que dans un sens : {yellow}le feu vers le haut{/yellow}, {yellow}la terre vers le bas{/yellow}. Or la plante {green}__croît à la fois vers le haut et vers le bas__{/green}, par ses tiges et par ses racines. {red}Aucun élément ne peut l'expliquer{/red}, puisque chacun irait dans une seule direction : il faut {coral}une puissance qui soit dans la plante même{/coral}. {sky}Polansky{/sky}, {sky}Shields{/sky} et {sky}Hamlyn{/sky} lisent ainsi l'argument : la croissance en directions contraires est la marque d'un principe interne.

    === 2 De tous côtés, tant qu'ils se nourrissent

    **« De tous côtés »** ajoute la croissance en largeur : {green}__la plante se développe comme un tout__{/green}. {sky}Shields{/sky} y voit une croissance {violet}réglée et limitée{/violet}, non une expansion brute, comme serait celle d'un feu.

    **« Aussi longtemps qu'ils peuvent absorber de la nourriture. »** La phrase lie la **durée** de la vie à la **nutrition** : {coral}__la plante vit tant qu'elle se nourrit__{/coral}. Vivre, pour elle, c'est {amber}se maintenir{/amber} en assimilant, et cesser de pouvoir se nourrir, c'est mourir.

    **Pour la vie,** le paragraphe donne son critère minimal : {green}__vit ce qui croît et se maintient par un principe qui est en lui__{/green}, non ce qui bouge visiblement.

    ! « Directions contraires » ne veut pas dire que la plante pousse au hasard : c'est une croissance tenue ensemble par un même principe, la preuve qu'elle n'est pas un simple mélange d'éléments.
  passage:
    label: "413a25-31"
    text: "C'est pourquoi l'on considère que tous les êtres qui se développent ont également la vie, car, visiblement, ils ont en eux-mêmes la sorte de puissance ou de principe qui leur permet de suivre, dans leur croissance et leur dépérissement, des directions contraires. La croissance, en effet, ne s'effectue pas vers le haut à l'exclusion du bas, mais c'est pareillement dans les deux sens et de tous côtés que se développent tous les êtres qui ont toujours à se nourrir et dont la vie se maintient aussi longtemps qu'ils peuvent absorber de la nourriture."
