- id: bichat4-l2
  title: "Claude Bernard contre la médecine anatomo-clinique"
  notes: |-
    **La critique bernardienne de Bichat n'est pas une polémique** : elle est au centre du dispositif par lequel Claude Bernard veut faire de la physiologie une science expérimentale, dans l'*Introduction à l'étude de la médecine expérimentale* (1865), les *Principes de médecine expérimentale* et les *Leçons sur les phénomènes de la vie communs aux animaux et aux végétaux* (1878).

    **L'adversaire : la médecine de son temps**, héritière de Bichat et de Cabanis. Elle conjoint {red}vitalisme, empirisme clinique et anatomie pathologique{/red} : un art descriptif, du {red}« coup d'œil »{/red} clinique et de l'instinct du remède, jamais sûr. La plasticité des forces vitales y soutient la définition de la médecine comme art, déjà chez Cabanis ; l'anatomie pathologique, qui fonde le diagnostic sur la perception fine des lésions, s'accorde avec cette médecine du regard. Les deux traditions issues de Bichat, physiologie expérimentale et médecine anatomo-clinique, sont devenues chez Bernard {coral}inconciliables{/coral}.

    **La médecine doit dériver de la physiologie**, science expérimentale fondée sur le {violet}déterminisme{/violet} : des conditions données produisent nécessairement des phénomènes donnés, seul postulat invariable de la science. Il en résulte qu'entre phénomènes pathologiques et physiologiques {green}__ce sont les conditions qui diffèrent, non la nature des processus__{/green} : {teal}« l'état pathologique ne crée rien »{/teal}. Cette **identité du physiologique et du pathologique** achève l'élimination de la médecine nosologique engagée par Bichat et Broussais.

    **Deux expériences la légitiment.**
    - **Les poisons** : {teal}« Le poison n'a pas créé d'organes nouveaux, de fonctions pathologiques nouvelles ; il n'a fait que déranger les fonctions. »{/teal} Pas de différence qualitative entre maladie et santé : la même physiologie opère, dans d'autres conditions.
    - **La fonction glycogénique du foie** : découvrant du sucre dans la veine cave d'un lapin à jeun, Bernard comprend que le foie sécrète du sucre. Le {violet}diabète{/violet} n'est donc pas l'apparition d'une fonction nouvelle, mais **l'amplification d'une fonction existante** ; il le produit même par une lésion de la moelle allongée : {teal}« Vous avez donc vu se produire sous vos yeux par une simple lésion de la moelle allongée, le phénomène du diabète. »{/teal}

    ! Bernard ne rompt pas avec l'unité de la physiologie et de la pathologie, héritée de Bichat : il la radicalise contre l'anatomie pathologique, qui en était née.
  points:
