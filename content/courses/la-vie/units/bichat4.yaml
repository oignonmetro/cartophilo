- id: bichat4-l4
  title: "La physiologie générale prend congé de Bichat"
  notes: |-
    **Un coup de chapeau qui est un congé.** Bernard salue Bichat pour avoir opéré une {coral}« décentration » de la vie{/coral}, et pour avoir {teal}« ramené la physiologie sur un terrain défini où il fut possible de suivre et de localiser les phénomènes des corps vivants, en les rattachant aux propriétés élémentaires des tissus comme des effets à leur cause »{/teal}. Mais {red}la distinction des propriétés physiques et vitales disparaît{/red} ; parlant de Bichat ou de Lavoisier, Bernard écrit la **préhistoire** d'une science dont il inaugurerait l'histoire.

    **De l'hôpital au laboratoire.** Bichat, lié à l'hôpital, écrivait une physiologie de l'homme, anthropologique. Bernard veut une médecine qui commence à l'hôpital et se termine au laboratoire, et une {violet}physiologie générale{/violet} des phénomènes {teal}« communs aux animaux et aux végétaux »{/teal} : {teal}« plantes et animaux vivent identiquement, mais fonctionnent autrement »{/teal}. La glycogenèse le permet : les animaux n'ont pas besoin de tirer le sucre des plantes, ils le produisent eux-mêmes. Une unité du fonctionnement vital remplace l'ancienne dépendance des animaux envers les végétaux ; la {red}finalité externe{/red} de l'histoire naturelle est éliminée : le vivant {teal}« travaille pour lui et non pas pour d'autres »{/teal}. Bernard réunit ainsi médecine et histoire naturelle, ce que Lamarck appelait biologie ; il cofonde en 1848 la **Société de biologie**.

    **Deux critiques de Bichat en découlent.**
    - **La division des deux vies** vaut en physiologie spéciale de l'homme et des animaux supérieurs, non en physiologie générale : certains animaux y dérogent, dont le cœur n'a pas les fibres striées propres à la vie animale.
    - **Cœur, poumon, cerveau ne sont pas les organes essentiels** : {teal}« une infinité d'animaux inférieurs vivent sans poumon, sans cerveau, sans cœur »{/teal}. L'anatomie comparée de Cuvier a montré qu'une même fonction peut être accomplie par des organes différents.

    **Reste à savoir si Bernard a quitté la structure du savoir instaurée par Bichat**, qui liait vie et mort : c'est ce qu'examinent les leçons suivantes.
