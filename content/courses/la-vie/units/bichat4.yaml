- id: bichat4-l6
  title: "Les deux voies : la consigne d'évolution"
  notes: |-
    **Destruction et création n'ont pas le même statut pour la science.** Les destructions organiques se comprennent : actions catalytiques dont le catalyseur, propre à la vie, est un **ferment** ; fermentation, putréfaction et combustion se ramènent à la fermentation. Les créations sont de deux sortes.
    - Les {pink}créations chimiques{/pink}, rénovation locale des cellules, sont connaissables : le chimiste en reproduit les produits, par d'autres procédés. {teal}« Le chimiste pourra faire les produits du vivant, mais il ne fera jamais ses outils. »{/teal}
    - Les {red}créations morphologiques{/red}, qui donnent sa forme au vivant à travers son développement, **échappent à la science** : elles ne relèvent pas du déterminisme physico-chimique.

    **La consigne d'évolution.** Ce n'est pas une autre causalité : elle {teal}« traduit une influence héréditaire »{/teal}. {teal}« La vie est un conflit »{/teal} entre des conditions matérielles déterminées et des lois vitales qui {teal}« dérivent par atavisme des organismes que le vivant continue »{/teal}. Ces lois n'ont aucune efficience propre ; seul le déterminisme physico-chimique les manifeste, sans les engendrer. Il accomplit la {violet}« consigne d'évolution »{/violet}, qui ne vise pas un but mais représente l'histoire accumulée dans l'œuf, {teal}« une formule organique qui résume les conditions évolutives d'un être déterminé par cela même qu'il en procède »{/teal}. Formule célèbre : {teal}« La force vitale dirige des phénomènes qu'elle ne produit pas ; les agents physiologiques produisent des phénomènes qu'ils ne dirigent pas. »{/teal}

    **D'où une hésitation constitutive.** Seules les conditions physico-chimiques sont connaissables, parce que l'expérience les atteint : {green}la vie sera atteinte à partir de la mort, et finalement comme mort{/green}, une mort devenue sa condition la plus intime. Mais {red}la consigne d'évolution ne relève que de la description{/red}. {red}Ce qui échappe à la science, c'est rien moins que les lois mêmes de la vie.{/red} La contradiction se lit deux fois :
    - **Qui vit ?** Avec Robin, Bernard identifie la vie au {violet}protoplasma{/violet}, {teal}« la seule matière vivante et travaillante »{/teal} ; mais le protoplasma n'a pas de forme, et {teal}« ce n'est point par une propriété du protoplasme que l'on peut expliquer la morphologie »{/teal}.
    - **Le vivant, c'est l'évolution** : {teal}« Tout est évolution »{/teal} ; pourtant aucun travail de Bernard ne porte sur l'évolution d'un vivant, parce que la méthode expérimentale n'y a plus cours. L'embryologie expérimentale (Roux, His, Spemann) lèvera cette limite ; pour Bernard elle était de principe : l'embryon renvoie à l'histoire de la lignée, sur laquelle aucune expérience n'est possible.

    **Deux voies vers la vie.** Bernard noue deux traditions : la physiologie expérimentale issue de **Bichat**, prépondérante, et la morphologie issue de l'anatomie comparée de **Cuvier** (la « morphologie transcendantale » de Geoffroy Saint-Hilaire, l'embryologie descriptive de Von Baer). D'un côté, {coral}le fonctionnement d'ensemble du vivant devient objet de savoir expérimental à la lumière de sa mort{/coral} ; de l'autre, {coral}la forme vivante devient intelligible par la description de son histoire{/coral}, au plus près du passage de la non-vie à la vie. Pôles : mort, fonctionnement, expérimentation ; histoire, origine, description. Il n'est pas sûr que ce soit la même « vie ». Bernard est proche de **Darwin** en reconnaissant que l'histoire fait le propre de l'organisme, loin de lui en refusant à l'hérédité d'être objet de science : la statistique n'est pour lui que conjecture.
