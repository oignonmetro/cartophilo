- id: bichat4-l3
  title: "Le milieu intérieur contre la force vitale"
  notes: |-
    **Le déterminisme n'admet pas d'exception, même vitale.** {teal}« Quelle que soit la nature de la force vitale, on peut dire qu'elle ne diffère pas des forces brutes, en ce sens qu'elle est enchaînée comme elles, dans ses manifestations, à des conditions matérielles… déterminées par des lois »{/teal}. Expliquer les maladies par les lésions d'un principe vital, comme Barthez, est aussi absurde que d'expliquer {yellow}les faiblesses d'une pile par une lésion de l'électricité{/yellow}. Le mot « force » n'a de sens que comme {teal}« le rapport d'un mouvement à sa cause »{/teal} : il s'agit de chercher les rapports entre conditions et phénomènes, non {red}« l'essence des maladies ou la cause de la vie »{/red}.

    **Mais il faut rendre compte de la spontanéité du vivant.** Sinon Bernard reviendrait à un mécanisme classique (« la vie… n'est en effet qu'un mécanisme »). D'où, à partir de 1851, le {violet}milieu intérieur{/violet} : l'intermédiaire entre les organes et le milieu externe, constitué par {teal}« tous les liquides circulant »{/teal} dans l'organisme et produit par lui, qui maintient constantes, **par des moyens qui ne dérogent pas aux lois ordinaires**, les conditions d'eau, de pression, de température nécessaires à la vie. Plus l'organisme est évolué, plus ce milieu le rend indépendant de l'extérieur (les mammifères et la température).

    **Le milieu intérieur résout la difficulté de Bichat.** Il obéit aux mêmes lois physico-chimiques que les corps bruts ; mais sa médiation produit **l'apparence** que l'organisme n'obéit pas à ces lois. {green}__Le vivant est régi par un déterminisme médiatisé__{/green} : la physiologie peut être une science expérimentale sans perdre la spécificité de son objet. Bernard concilie ainsi ce que Bichat cherchait, {coral}l'autonomie de la physiologie et son statut de science{/coral}.

    **La « vie » n'est plus qu'un mot.** {teal}« Il n'y a aucune réalité objective dans les mots vie, mort, santé, maladie. Ce sont des expressions littéraires qui représentent à l'esprit l'apparence de certains phénomènes. »{/teal} La vie est {teal}« résultat du contact de l'organisme et du milieu »{/teal} ; ses conditions ne sont {teal}« ni dans l'organisme ni dans le milieu extérieur mais dans les deux à la fois »{/teal}. Et la maladie peut venir, sans lésion des tissus, de la seule altération du milieu : la problématique anatomopathologique de la lésion est dépassée.

    **Le milieu intérieur est l'harmonie que pressentait Bordeu.** Par lui tous les éléments communiquent ; il assure l'organicité de l'organisme, {teal}« un ensemble composé par un nombre considérable d'organismes ayant chacun leur spécialité et vivant dans un milieu intérieur »{/teal}. Il est fait {teal}« pour les cellules »{/teal} et par elles, à la fois moyen et but : {teal}« le but de tous les mécanismes vitaux… c'est de maintenir l'unité des conditions de vie dans le milieu intérieur »{/teal}. La double circulation, générale et capillaire, produit à la fois l'**intégration** des organes et leur **indépendance**.

    **Des expériences précises.** En 1851, Bernard montre que le système nerveux (le grand sympathique) corrige les variations de la chaleur interne : c'est l'activité {violet}autorégulatrice{/violet} de l'organisme, avant le mot. Les *Leçons sur la chaleur animale* (1871) montrent que la section du grand sympathique augmente la chaleur sans accroître les combustions dans le sang : contre Lavoisier, la chaleur n'est pas une combustion, mais {teal}« une faculté générale appartenant à tous les tissus »{/teal}, que le système nerveux régule.
