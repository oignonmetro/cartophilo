- id: bichat4-l7
  title: "Conclusion : la mort au cœur du vivant"
  notes: |-
    **Le bilan.** Bichat constitue une physiologie expérimentale à partir de la connaissance des enchaînements de mort, pour surmonter les difficultés du vitalisme. L'irréductibilité de la vie et de sa science passe par **l'inscription structurelle de la mort dans le vivant**. Le passage de la {pink}mort-état{/pink} à la {green}mort-processus{/green} retourne la vieille critique selon laquelle la science ne connaîtrait le vivant que mort : {green}__c'est désormais le vivant lui-même qui se laisse connaître à partir de sa mortalité__{/green}.

    **La fidélité de Claude Bernard.** Canguilhem : {teal}« Claude Bernard est resté bien plus fidèle qu'on ne le dit à l'enseignement et à l'esprit de Xavier Bichat. »{/teal} Il approfondit même cette logique en situant la solidarité de la vie et de la mort au niveau le plus élémentaire. La biologisation de la médecine renforce l'ancrage de la mort dans la vie ; le prix en est une hésitation sur l'objet : {red}la physiologie générale s'est faite science expérimentale en s'ôtant la possibilité de s'assurer que c'est bien de « la vie » qu'il s'agit{/red}.

    **Pinel et la psychiatrie** : une même mise au jour des figures du négatif dans le projet d'une histoire naturelle de l'homme.

    **La philosophie.** Foucault : {teal}« L'importance de Bichat, de Jackson, de Freud dans la culture européenne ne prouve pas qu'ils étaient aussi philosophes que médecins, mais que, dans cette culture, la pensée médicale engage de plein droit le statut philosophique de l'homme. »{/teal} D'où le nombre des philosophes qui lisent Bichat : Maine de Biran, Schopenhauer, Comte. Plus qu'une image de l'homme, Bichat avance {coral}une détermination du rapport de l'homme à sa propre vie{/coral}. Distinguer vie animale et vie organique revient, Schopenhauer l'a senti, à **déposséder l'homme de l'emprise sur une part essentielle de lui-même** : cette vie souterraine qui commande tempérament, passions, caractère, à la fois étrangère à moi et constitutive de moi, se trouve, par la constitution même du savoir physiologique, **intimement mêlée à la mort**.

    **Jusqu'à Freud.** Cent vingt ans après, *Au-delà du principe de plaisir* expose les {violet}« pulsions de mort »{/violet}, qui s'indiquent dans la {violet}« compulsion à répéter »{/violet} (*Wiederholungszwang*). Freud pousse à ses limites la transformation de Bichat : {coral}l'homme est divisé d'avec lui-même, et son individualité se ressource secrètement en une mort{/coral}. Dans l'*Esquisse* de 1895, le système Ψ, ancêtre de l'Inconscient, était d'ailleurs localisé dans un ganglion du sympathique, élément du centre de la vie organique selon Bichat.
