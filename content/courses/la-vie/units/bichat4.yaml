- id: bichat4-l5
  title: "« La vie, c'est la mort » : Bernard fidèle à Bichat"
  notes: |-
    **Les poisons, objets et instruments de savoir.** Bernard étudie le curare, l'oxyde de carbone, la strychnine ; mais chaque mécanisme découvert devient **un instrument pour en découvrir d'autres**. Avant de savoir comment l'oxyde de carbone bloque la fixation de l'oxygène par les globules, il s'en sert pour étudier l'absorption de l'oxygène par les tissus. Le {violet}curare{/violet} tue le seul nerf moteur et laisse intact le muscle : nerfs et muscles ont donc des propriétés indépendantes. Curare, strychnine (nerf sensitif), sulfocyanure de potassium (fibre musculaire) : {coral}trois instruments d'analyse sélectifs{/coral}, parce que l'action toxique est locale et précise.

    **La structure de Bichat retrouvée.** Bernard l'écrit en 1856 : les toxiques sont {teal}« de véritables réactifs de la vie »{/teal} qui {teal}« amènent la mort par un mécanisme qui désigne le rôle physiologique du tissu qui se trouve atteint »{/teal}. {teal}« Avec ces agents on peut étudier, non pas la mort des organes, comme l'a fait Bichat, mais la mort des systèmes organiques. »{/teal} Le niveau change (systèmes, terme bichatien, au lieu d'organes), mais {green}__l'appréhension expérimentale des enchaînements de mort délivre toujours la connaissance des connexions vitales__{/green}. D'où l'impératif : {teal}« pour apprendre comment les animaux et l'homme vivent, il est indispensable d'en voir mourir un grand nombre, parce que les mécanismes de la vie ne peuvent se dévoiler et se prouver que par la connaissance des mécanismes de la mort »{/teal} (*IME*). En subordonnant l'anatomie, qui ne comprend que les « éléments mécaniques passifs », à la physiologie, Bernard **achève le geste de Bichat**.

    **Caractériser la vie sans la définir.** Il n'y a pas de définition des choses naturelles ; mais on peut {teal}« caractériser les corps vivants par rapport aux corps bruts »{/teal} : organisation, génération, nutrition, évolution, et {teal}« caducité et mort »{/teal}. La {violet}nutrition{/violet} est fondamentale, {teal}« une génération continuée »{/teal}, et suppose un double mouvement : {pink}désassimilation, destruction{/pink}, et {green}assimilation, réparation{/green}. {teal}« Il y a dans l'être vivant deux ordres de phénomènes : des phénomènes de création vitale, ou synthèse organisatrice ; et des phénomènes de mort, ou de destruction organique. »{/teal} La physiologie moderne y verra le {violet}métabolisme{/violet}, anabolisme et catabolisme.

    **Ce que Bernard en fait est inédit.** Seule {green}la synthèse est véritablement vitale{/green} ; la destruction est purement physico-chimique, et continue après la mort. Or {coral}toute manifestation d'un phénomène vital est liée à une destruction organique{/coral}, puisque toute fonction consomme de la matière. **Ce qu'on voit de la vie n'est donc que de la mort** : {teal}« La vie, c'est la mort. »{/teal} Bernard y voit la vérité de Bichat : {teal}« il y a de vrai que la vie ce n'est que la mort et que nous sommes constamment sur la pente de la mort par cela même que nous vivons »{/teal}. L'envers : {teal}« La vie c'est la création »{/teal}, mais cette création est invisible, et l'expérience n'y a pas prise. {coral}De la vie, nous ne voyons et ne connaissons que la mort.{/coral} L'oxyde de carbone le montre : c'est la caducité des liaisons de l'oxygène aux globules qui permet la nutrition, et le poison tue en les stabilisant. **La vie vit des morts élémentaires en elle.**

    ! Ce n'est pas l'usure de Buffon : chez Bernard, la mort n'est pas une conséquence négative de la vie, mais l'envers et la condition de toute fonction vitale.
