lessons:
- id: bichat4-l1
  title: "Magendie : l'expérience sans le vitalisme"
  notes: |-
    **Seul le devenir de la physiologie expérimentale peut attester les relations nouées par Bichat entre savoir, vie et mort.** Claude Bernard s'est voulu son inventeur ; mais les éléments de cette physiologie, et le dépassement des obstacles qui l'entravaient, sont l'œuvre de Bichat. Il faut donc le resituer dans la lignée Bichat, Magendie, Bernard.

    **Magendie, « chiffonnier des faits ».** Élève de Bichat et maître de Claude Bernard au Collège de France, il est décrit par celui-ci comme un empiriste pur, soupçonneux envers toute théorie. Il suit la direction expérimentale de Bichat, ce qui le mène à de grandes découvertes, comme la distinction des **racines nerveuses antérieures et postérieures**, l'une motrice, l'autre sensitive.

    **Mais il conteste le vitalisme de Bichat sur deux points.**
    - {red}L'irréductibilité ne signifie pas la lutte{/red} : si les propriétés des vivants sont irréductibles aux propriétés physico-chimiques, cela ne veut pas dire que ces deux ordres s'affrontent.
    - {red}L'analogie avec la gravitation manque l'essentiel{/red} : Newton peut donner la loi mathématique de la gravitation, les propriétés vitales ne tombent sous aucune loi quantitative.

    Il faut et il suffit de reconnaître l'existence vitale comme telle, ramenée à la {violet}nutrition{/violet} et à l'{violet}action{/violet} (le rein produit l'urine, le foie la bile) ; voir la vitalité traduite en propriétés différentes selon les organes est déjà trop, un {pink}« roman »{/pink}, {teal}« l'anthropomorphisme des philosophes appliqué aux molécules »{/teal}. La physiologie se borne à ce qui tombe sous les sens : {teal}« nous devons nous borner à étudier leurs résultats, c'est-à-dire les propriétés physiques des organes »{/teal}, et leur concours à la vie générale, c'est-à-dire les **fonctions**.

    **Le débat avec Albury.** William **Albury** soutient que Magendie {pink}rompt avec Bichat{/pink} : chez Bichat, l'expérience n'est qu'{teal}« une extension de l'observation »{/teal}, la vie s'observe d'abord comme phénomène d'ensemble ; Magendie fait de l'expérimentation l'accès adéquat aux fonctions et la voie pour poser de nouveaux problèmes. L'opposition est {teal}« une problématique de l'observation contre une problématique de l'expérimentation »{/teal}. Huneman ne le conteste pas, mais soutient que {green}__tout le travail de Bichat était nécessaire pour qu'une telle problématique fût possible__{/green} : l'expérience comme accès aux procès entre organes, la mort médiatisant la vie et son savoir, viennent de lui. Les deux forment un couple, où {coral}la nouveauté radicale du second est pensable parce que le premier a déplacé l'ancien{/coral}.

    **La force vitale devient une hypothèse inutile.** Pour Magendie, la diversité des phénomènes vitaux s'explique par la diversité des organisations : {teal}« quand la force vitale anime un corps d'organisation donnée, il produira des phénomènes donnés »{/teal}. On est aux limites du déterminisme (à telles conditions, tels effets). Mais alors cette force n'a plus de prédicat propre : {red}rien n'oblige à la distinguer des forces physiques{/red}. Bernard franchira le pas en supprimant la notion de force, grâce au **milieu intérieur**.
