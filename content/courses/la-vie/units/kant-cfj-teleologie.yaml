- id: kant-cfj-teleologie-l14
  title: "Les systèmes sur la finalité, et leur échec (§ 72-73)"
  notes: |-
    Les § 72 et 73 passent en revue les systèmes qui ont prétendu trancher **dogmatiquement** la question de la finalité naturelle. Ils les classent (§ 72), puis montrent qu'{red}__aucun n'accomplit ce qu'il prétend__{/red} (§ 73). Le but n'est pas l'histoire de la philosophie : c'est de montrer que la question, posée sur les choses mêmes, ne peut pas être tranchée, ce qui ouvre la voie à la solution critique.

    **La question que personne ne conteste, et celle que tous disputent.** Que les êtres organisés doivent être jugés d'après des causes finales, au moins comme fil conducteur, {coral}personne ne l'a mis en doute{/coral}. Le débat porte sur autre chose : ce principe n'est-il qu'une **maxime** de notre jugement, ou un principe **objectif** de la nature, qui posséderait une autre causalité que le mécanisme ? Kant appelle {violet}technique{/violet} la causalité de la nature à cause de l'apparence finale de ses produits, et distingue une technique {violet}intentionnelle{/violet} et une technique {violet}inintentionnelle{/violet}. Les systèmes s'opposent sur ce point ; ils ne s'opposeraient pas s'ils s'en tenaient à la maxime.

    | Finalité | physique | hyperphysique |
    | idéalisme | casualité | fatalité |
    | réalisme | hylozoïsme | théisme |

    **L'idéalisme de la finalité la tient pour inintentionnelle.** Ou bien par **casualité** : la forme finale vient des seules lois du mouvement, au hasard ({sky}Épicure, Démocrite{/sky}). Ou bien par **fatalité** : elle découle de la nécessité de nature d'un être originaire, non de son entendement ({sky}Spinoza{/sky}).

    **Le réalisme la tient pour intentionnelle.** Ou bien de façon physique, l'**hylozoïsme** : la finalité vient de la vie de la matière, immanente ou insufflée par une âme du monde. Ou bien de façon hyperphysique, le **théisme** : elle vient d'un être originaire intelligent qui produit avec intention.

    **La casualité n'explique rien.** Elle efface toute différence entre ce que la nature produit avec art et ce qu'elle produit mécaniquement, et prend le hasard aveugle pour principe : {red}« rien ne se trouvant ainsi expliqué, pas même l'apparence »{/red} de finalité dans notre jugement. Kant la juge {teal}« si manifestement absurde qu'il ne saurait nous retenir »{/teal}.

    **La fatalité confond l'unité de la substance et l'unité des fins.** {sky}Spinoza{/sky} fait des formes naturelles des accidents inhérents à un être originaire : il assure bien l'**unité de fondement** requise par toute finalité, mais il supprime la **contingence** sans laquelle aucune unité finale ne peut être pensée. Or {coral}« cette unité ontologique n'est pas encore pour autant unité finale »{/coral} : que des choses appartiennent à un même sujet ne dit pas qu'elles soient ordonnées en vue de quelque chose ; une fin suppose un rapport à une cause qui a de l'**intelligence**. Si tout est nécessaire, {red}« être une chose et être une fin se confondent »{/red} : le mot ne désigne plus rien. Il en va de même pour qui appelle finalité la « perfection transcendantale » des choses : {red}« un jeu puéril où les mots remplacent les concepts »{/red}.

    **L'hylozoïsme se contredit, puis tourne en cercle.** Une **matière vivante** est impensable, car {teal}« l'absence de vie, *inertia*, constitue le caractère essentiel de la matière »{/teal}. Reste une matière **animée**, la nature entière comme un animal ; mais une telle hypothèse ne se comprend pas a priori, on ne la tire que de l'expérience de l'organisation en petit. D'où le cercle : on veut expliquer la finalité des êtres organisés par la vie de la matière, alors qu'{coral}on ne connaît cette vie nulle part ailleurs que dans les êtres organisés{/coral}.

    **Le théisme est le meilleur, mais il ne fonde rien dogmatiquement.** Grâce à l'entendement qu'il prête à l'être originaire, il est {green}le mieux à même{/green} de soustraire la finalité à l'idéalisme et de la penser comme intentionnelle. Mais pour poser dogmatiquement le fondement de la finalité au-delà de la nature, il faudrait avoir **prouvé** à la faculté de juger déterminante que l'unité finale est impossible par le simple mécanisme de la matière. Or nous savons seulement que nous ne pouvons en juger autrement : {coral}un fondement pour la faculté de juger réfléchissante, non pour la faculté de juger déterminante{/coral}.

    ! Kant ne rejette pas le théisme : il rejette sa prétention à valoir comme connaissance de la nature.
    ! L'hylozoïsme n'est pas l'auto-organisation du § 65 : Kant dit que l'être organisé s'organise lui-même, jamais que la matière comme telle est vivante.
