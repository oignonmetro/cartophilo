- id: kant-cfj-teleologie-l7
  title: "L'être organisé, une fin naturelle (§ 65)"
  notes: |-
    Le § 65 déduit la formule provisoire du § 64 ({teal}« manière quelque peu impropre et imprécise de s'exprimer »{/teal}) à partir d'un concept déterminé. Il établit que {green}__les fins naturelles sont les êtres organisés__{/green}, dont {coral}les parties se produisent les unes les autres{/coral}, puis montre qu'{red}aucune analogie connue{/red} ne rend cette organisation compréhensible, et fixe enfin son statut : un concept **régulateur**.

    **Il n'y a que deux causalités pensables.** L'entendement pense une série de causes et d'effets {teal}« toujours descendante »{/teal}, où l'effet ne peut être cause de sa cause : c'est le {violet}*nexus effectivus*{/violet}, la connexion des causes **réelles**. La raison peut penser une connexion {coral}« aussi bien descendante qu'ascendante »{/coral} : la {yellow}maison{/yellow} est cause des loyers qu'elle rapporte, mais la représentation de ces revenus fut la cause de sa construction. C'est le {violet}*nexus finalis*{/violet}, celui des causes **idéales** : l'effet n'agit pas en remontant le temps, c'est sa **représentation** qui agit d'avance.

    **Première condition, commune à toute fin : les parties n'existent que par leur relation au tout.** La chose est une fin, donc comprise sous une Idée qui détermine a priori ce qu'elle doit contenir. Mais si l'on s'en tient là, c'est {red}simplement une œuvre d'art{/red}, le produit d'une cause raisonnable **distincte** de sa matière.

    **Seconde condition, propre à la fin naturelle : les parties sont réciproquement cause et effet de leur forme.** Sans cause extérieure, il faut que les parties se relient en un tout parce qu'elles se produisent mutuellement. Alors l'Idée du tout détermine en retour la forme des parties, {teal}« non pas en tant que cause - car ce serait alors un produit de l'art -, mais en tant que fondement de la connaissance »{/teal}, pour celui qui juge. Le tout n'est pas une force cachée dans la matière : c'est ce qui nous permet de **comprendre** l'unité de ce que les parties font entre elles.

    **Chaque partie est un organe qui produit les autres.** Être un instrument pour les autres ne suffit pas, puisqu'un outil de l'art l'est aussi ; chaque partie doit être {teal}« un organe produisant les autres parties »{/teal}. Seul un instrument de la nature le peut. D'où la définition : un {coral}« être organisé et s'organisant lui-même »{/coral}.

    **La montre montre ce qui manque à la machine.** {yellow}Dans une montre{/yellow}, un rouage est l'instrument du mouvement d'un autre, mais n'est pas la cause de sa production : {teal}« une partie existe certes pour l'autre, mais elle n'existe pas par elle »{/teal}. La cause des rouages est hors de la montre, dans l'horloger. Aussi une montre ne produit-elle ni ses rouages ni d'autres montres, ne remplace pas une pièce retirée, ne se répare pas quand elle se dérègle : tout ce que l'on attend au contraire d'un être organisé. La machine n'a qu'une {violet}**force motrice**{/violet} ; l'être organisé possède une {violet}**force formatrice**{/violet} (*bildende Kraft*), qu'il communique aux matières qui en sont dépourvues. Une force qui transmet le mouvement ne contient aucune règle pour **donner forme** à une matière informe : le mécanisme ne peut donc l'expliquer.

    **Aucune analogie connue ne convient.** Parler d'un {red}*analogon* de l'art{/red}, c'est dire {coral}« beaucoup trop peu »{/coral}, car on se représente l'artiste extérieur à la nature, alors qu'elle s'organise elle-même. Un {pink}*analogon* de la vie{/pink} serait plus proche, mais il faut alors ou bien prêter la vie à la matière comme telle, {red}l'**hylozoïsme**{/red}, qui contredit son essence, ou bien lui associer une **âme**, qui suppose déjà la matière organisée ou fait de l'âme l'artiste et soustrait le produit à la nature. Conclusion : {coral}« l'organisation de la nature n'a donc rien d'analogue avec une quelconque causalité dont nous avons connaissance »{/coral}. La beauté naturelle, qui ne tient qu'à la forme de la surface, peut être dite un *analogon* de l'art ; la perfection interne de l'organisme, non.

    **Le concept de fin naturelle est régulateur, mais il donne enfin un objet à la téléologie.** Il n'est {red}pas constitutif{/red} ; il est {green}régulateur pour la faculté de juger réfléchissante{/green}, pour guider la recherche {teal}« à l'aide d'une analogie éloignée avec notre causalité selon des fins en général »{/teal}. Les êtres organisés sont pourtant les seuls qui, considérés en eux-mêmes, doivent être pensés comme fins : ils procurent {coral}« une réalité objective au concept d'une fin qui n'est pas une fin pratique, mais est une fin de la nature »{/coral}, et fondent ainsi une téléologie dans la science de la nature.

    **L'analogie politique.** Une note de Kant éclaire l'organisation par une analogie inverse : lors de la récente transformation d'un grand peuple en un État, on a parlé à bon droit d'{yellow}« organisation »{/yellow}, car chaque membre doit y être {coral}non seulement moyen, mais aussi fin{/coral}.

    ! « S'organisant lui-même » ne fait pas de Kant un vitaliste : la force formatrice n'est pas une substance vitale, et l'hylozoïsme est rejeté comme contradictoire.
    ! L'Idée du tout n'est pas une cause efficiente agissant dans le vivant : elle est un fondement de connaissance pour celui qui juge.
