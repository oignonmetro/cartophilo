- id: kant-cfj-teleologie-l11
  title: "Repérage : la Dialectique, de l'antinomie à sa solution (§ 69-78)"
  notes: |-
    La **Dialectique** affronte le conflit que l'Analytique a fait naître : la nature doit être jugée d'après le mécanisme, et pourtant certains de ses produits ne peuvent l'être que d'après des fins. Elle définit ce qu'est une antinomie de la faculté de juger (§ 69), la présente (§ 70) et en prépare la solution (§ 71) ; elle réfute ensuite les systèmes qui ont cru trancher la question (§ 72-73) et montre pourquoi ils le devaient (§ 74) ; elle fonde enfin la solution sur la constitution de notre entendement (§ 75-77) et réunit les deux principes en subordonnant le mécanisme à la téléologie (§ 78).

    | Paragraphe | Lieu | Ce qui s'y joue |
    | ce qu'est une antinomie de la faculté de juger | § 69 | seule la faculté de juger réfléchissante, qui se donne ses maximes, peut entrer en conflit avec elle-même |
    | la présentation de l'antinomie | § 70 | mécanisme et causes finales : des maximes compatibles, des principes constitutifs contradictoires |
    | la préparation de la solution | § 71 | l'apparence d'antinomie vient de la confusion du réfléchissant et du déterminant |
    | les systèmes sur la finalité | § 72 | idéalisme (casualité, fatalité) et réalisme (hylozoïsme, théisme) |
    | l'échec des systèmes | § 73 | aucun n'accomplit ce qu'il prétend |
    | le concept inexplicable de fin naturelle | § 74 | sa réalité objective ne se démontre pas : il ne se traite pas dogmatiquement |
    | la finalité, principe critique | § 75 | « il y a un Dieu » devient : nous ne pouvons penser ces fins que par une cause intelligente |
    | la Remarque | § 76 | possible et effectif, devoir et être : des distinctions qui tiennent à notre entendement |
    | l'entendement intuitif | § 77 | notre entendement va des parties au tout, d'où le besoin de penser des fins |
    | la réunion des deux principes | § 78 | le mécanisme est subordonné à la téléologie, et leur accord renvoyé au suprasensible |
