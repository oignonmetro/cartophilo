- id: kant-cfj-teleologie-l2
  title: "Repérage : l'Analytique, de la finalité objective à l'être organisé (§ 61-68)"
  notes: |-
    L'**Analytique** cherche ce qui, dans la nature, mérite le nom de **fin naturelle**. Elle procède par élimination, puis par extension : après avoir posé la question (§ 61), elle écarte deux finalités qui n'en sont pas, celle des figures géométriques (§ 62) et celle de l'utilité (§ 63) ; elle définit alors la fin naturelle (§ 64) et l'identifie à l'être organisé (§ 65), en tire la maxime « rien en vain » (§ 66), l'étend à la nature entière (§ 67) et fixe sa place dans la science (§ 68).

    | Paragraphe | Lieu | Ce qui s'y joue |
    | la question de la finalité objective | § 61 | un tel jugement est légitime, mais seulement pour la faculté de juger réfléchissante |
    | la finalité formelle des figures | § 62 | la fécondité du cercle est objective mais sans fin : c'est nous qui l'y mettons |
    | la finalité relative | § 63 | l'utilité d'une chose pour une autre reste hypothétique |
    | le caractère spécifique des fins naturelles | § 64 | une fin naturelle est cause et effet d'elle-même, comme l'arbre |
    | l'être organisé | § 65 | les parties se produisent réciproquement : une force formatrice, non motrice |
    | la maxime du jugement sur les organismes | § 66 | rien n'est en vain dans un être organisé |
    | la nature comme système des fins | § 67 | la maxime s'étend à la nature entière, à titre régulateur |
    | la téléologie dans la science de la nature | § 68 | « fin de la nature », non « fin divine » : pas de Dieu en physique |
