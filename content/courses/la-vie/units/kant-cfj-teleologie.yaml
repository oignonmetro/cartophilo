- id: kant-cfj-teleologie-l3
  title: "La question : y a-t-il une finalité objective de la nature ? (§ 61)"
  notes: |-
    Le § 61 ouvre la seconde partie en changeant d'objet : après la **finalité subjective** du beau, qui tenait à l'accord de nos facultés, il demande s'il existe une {violet}**finalité objective**{/violet} de la nature, c'est-à-dire des choses dont la possibilité même n'est compréhensible que par des fins. Sa réponse fixe le statut de tout ce qui suit : {green}__un tel jugement est légitime, mais seulement pour la faculté de juger réfléchissante__{/green}.

    **La finalité esthétique avait un fondement a priori ; la finalité objective n'en a pas.** Pour le beau, la représentation d'une forme est {teal}« quelque chose qui fait partie de nous-mêmes »{/teal} : on pouvait donc concevoir a priori qu'elle convienne à l'accord de nos pouvoirs de connaître, puisque ce rapport se joue tout entier en nous. Une finalité objective, au contraire, prête aux choses {teal}« des fins qui ne sont pas les nôtres et qui n'appartiennent pas non plus à la nature (laquelle nous ne considérons pas comme un être intelligent) »{/teal}. Or __on ne peut légiférer a priori que sur ce qui relève de nos propres facultés__ ; sur ce qui se passe dans les choses hors de nous, rien ne permet de présumer qu'elles se servent les unes des autres comme moyens. L'adversaire ne peut refuser cette prémisse sans effacer la différence entre l'accord de nos représentations et la constitution des corps.

    **L'expérience ne la prouve pas davantage.** On ne voit jamais une fin : on voit des formes, des mouvements, des successions. Pour croire l'avoir observée, il faudrait un {red}« sophisme »{/red}, qui prendrait une manière de lier nos représentations, appliquée à la nature par analogie, pour une propriété découverte dans les choses.

    **La finalité sert à prouver la contingence de la nature, non sa nécessité.** Kant prend l'exemple de l'oiseau : la {yellow}cavité de ses os, la disposition de ses ailes et de sa queue{/yellow} sont dites {coral}« au plus haut degré contingent »{/coral} selon le simple {violet}*nexus effectivus*{/violet}, la liaison des causes efficientes. Le mécanisme explique chaque os et chaque plume par ses causes ; mais rien, dans ces causes, n'exigeait que tous ces effets convergent vers le vol. La nature, {teal}« considérée comme simple mécanisme, aurait pu se structurer de mille autres manières »{/teal}. C'est cette **contingence de l'unité**, relativement aux lois mécaniques, qui oblige à chercher le principe de cette unité ailleurs que dans le concept de la nature.

    **Le jugement téléologique reste légitime, comme principe de recherche.** Il est tiré {teal}« du moins à titre problématique »{/teal}, pour soumettre la nature, {teal}« selon l'analogie avec la causalité d'après des fins, aux principes de l'observation et de la recherche, sans prétendre l'expliquer par là »{/teal}. On pense alors la nature {yellow}« comme technique »{/yellow}, comme si elle produisait d'après des concepts à la manière d'un artisan, parce que c'est le seul moyen de se donner une règle là où le mécanisme ne suffit pas. Il relève donc de la faculté de juger {violet}**réfléchissante**{/violet}, qui cherche une règle pour un particulier donné, et non de la faculté de juger {violet}**déterminante**{/violet}, qui subsume sous une loi déjà donnée.

    **Le prendre pour une loi des choses ruinerait la science.** Si l'on posait dans la nature des causes agissant intentionnellement, le concept de fin naturelle deviendrait un principe constitutif : il cesserait d'appartenir à la faculté de juger et introduirait {red}« une nouvelle causalité dans la science de la nature »{/red}, que {coral}« nous n'empruntons cependant qu'à nous-mêmes »{/coral}. La physique expliquerait alors par des intentions qu'elle ne peut ni observer ni vérifier.

    ! Kant ne nie pas l'organisation du vivant : il nie qu'elle se déduise du concept de nature, ou qu'elle prouve des intentions dans les choses.
    ! « Réfléchissante » ne veut pas dire arbitraire : le jugement téléologique est nécessaire pour nous, mais il ne détermine pas l'objet.
