- id: kant-cfj-teleologie-l16
  title: "La finalité, principe critique : « il y a un Dieu » devient une maxime (§ 75)"
  notes: |-
    Le § 75 formule positivement la solution, que dit son titre : {green}__« le concept d'une finalité objective de la nature est un principe critique de la raison pour la faculté de juger réfléchissante »__{/green}. Il ne dit pas comment les êtres organisés sont produits, il dit comment nous devons les penser, et pourquoi c'est inévitable pour nous.

    **Deux énoncés que tout sépare.** Dire que la production de certaines choses {red}n'est possible que par une cause agissant intentionnellement{/red}, c'est décider de l'objet, et devoir prouver la réalité objective de ce concept. Dire que {green}je ne peux, d'après la constitution de mes pouvoirs de connaître, juger autrement de leur possibilité{/green} qu'en pensant une cause intentionnelle, c'est seulement régler l'usage de mes facultés selon leurs limites. Le premier est un principe objectif pour la faculté de juger déterminante ; le second, {coral}une maxime que la raison impose à la faculté de juger réfléchissante{/coral}.

    **Indispensable pour les organismes, simplement utile pour la nature entière.** Pour explorer les êtres organisés par une observation suivie, le concept d'une intention est {coral}« une maxime absolument nécessaire »{/coral} : on ne peut même pas les penser comme organisés sans penser une production intentionnelle. Pour la nature entière, la même maxime est **utile, mais non indispensable**, parce que {teal}« la nature ne nous est pas donnée en totalité comme organisée »{/teal}.

    **Les fins naturelles prouvent la contingence du monde, non l'existence de Dieu.** Penser une chose comme fin, c'est penser sa forme comme contingente au regard des lois de la nature ; les êtres organisés sont donc {teal}« la preuve la plus importante de la contingence de l'univers »{/teal}, et l'argument qui, pour le sens commun comme pour le philosophe, fait conclure à un auteur intelligent hors du monde. Mais ce que prouve la téléologie la plus aboutie, c'est seulement que {coral}« nous ne pouvons nous forger absolument aucun concept de la possibilité d'un tel monde si nous ne nous représentons pas une cause suprême de ce monde qui agirait intentionnellement »{/coral}. Car nous n'**observons** pas les fins comme intentionnelles : c'est nous qui ajoutons ce concept dans la réflexion, comme un fil conducteur. Il ne nous est pas donné par l'objet.

    **La formulation permise.** Dogmatiquement, la proposition s'énoncerait : {red}*Il y a un Dieu*{/red}. Pour nous, êtres humains, seule est permise la formulation limitée : {green}« *Nous ne pouvons aucunement nous représenter et nous rendre compréhensible la finalité* [...] *qu'en nous les représentant, ainsi que le monde en général, comme produits d'une cause intelligente (d'un Dieu)* »{/green}. Et cette proposition suffit à tout usage, spéculatif ou pratique, de notre raison.

    **Pas de Newton du brin d'herbe, mais pas de négation non plus.** Il est si certain que nous ne pouvons connaître les êtres organisés d'après des principes simplement mécaniques qu'il est {coral}« absurde »{/coral} d'espérer {yellow}« un Newton qui rende compréhensible ne serait-ce qu'un brin d'herbe »{/yellow} par des lois que nulle intention n'a ordonnées. Mais affirmer qu'aucun principe mécanique suffisant ne peut se cacher dans la nature serait {red}« une attitude trop démesurée »{/red} : {teal}« d'où prétendons-nous le savoir ? »{/teal} Nous ne pouvons donc ni affirmer ni nier objectivement qu'un être intelligent soit l'auteur des fins naturelles ; il est seulement assuré que nous ne pouvons rien placer d'autre à leur fondement. C'est {coral}« un fondement subjectif, mais indissolublement inhérent à l'espèce humaine »{/coral}.

    ! « Subjectif » ne veut pas dire « arbitraire » : la maxime vaut nécessairement pour tout être humain, parce qu'elle tient à la constitution de notre entendement.
    ! L'impossibilité d'un Newton du brin d'herbe ne condamne pas la biologie : elle interdit seulement d'espérer réduire l'organisme au seul mécanisme.
