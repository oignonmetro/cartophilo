- id: kant-cfj-teleologie-l5
  title: "La finalité relative : l'utilité n'est pas une fin de la nature (§ 63)"
  notes: |-
    Le § 63 isole la seule finalité qui puisse fonder une téléologie de la nature en écartant la plus répandue : l'utilité. Il distingue {green}**finalité interne**{/green}, propre à un être naturel, et {red}**finalité relative**{/red} ou externe, la convenance d'une chose pour une autre, et montre que {coral}__cette dernière n'autorise aucun jugement téléologique absolu__{/coral}.

    **Deux manières de juger un effet comme fin.** L'expérience nous conduit au concept d'une fin de la nature quand nous ne pouvons comprendre un rapport de cause à effet qu'en plaçant {teal}« au fondement de la causalité de la cause l'Idée de son effet »{/teal}. Cela peut se faire de deux façons : ou bien l'effet est considéré lui-même comme **produit de l'art** de la nature, et c'est une finalité **interne** ; ou bien il n'est considéré que comme **matériau** pour l'art d'autres êtres, et c'est une finalité **relative**, qui s'appelle {violet}**utilité**{/violet} pour l'homme et {violet}**convenance**{/violet} pour toute autre créature.

    | Finalité | Ce qu'est la chose | Exemple |
    | interne | une fin, produit de l'art de la nature | l'être organisé |
    | relative | un moyen pour d'autres êtres | le sable pour les pins |

    **L'utilité s'explique tout entière par le mécanisme.** Kant prend l'exemple du {yellow}**sable**{/yellow} laissé par la mer primitive en se retirant : il n'y a pas de sol plus favorable aux pins, et de vastes forêts ont pu y croître. Faut-il dire que la mer s'est retirée pour les pins ? Le sable se comprend parfaitement {teal}« pour lui-même comme l'effet de sa cause, la mer »{/teal}, sans qu'on suppose une fin à cette mer. La relation d'utilité est **extérieure** à la chose : elle n'entre pas dans ce qui la rend possible, elle reste {coral}« simplement contingente pour la chose même à laquelle on l'attribue »{/coral}. Le partisan de la providence ne peut le nier sans prêter une intention à la mer.

    **Une chaîne de moyens reste suspendue à une condition.** Si l'on fait du sable une fin relative, il faut faire de la mer son moyen ; si l'herbe est pour le bétail, le bétail est pour les loups ou pour l'homme. Mais une telle chaîne ne devient une finalité absolue que si son dernier terme est lui-même une fin de la nature : la finalité externe suppose {teal}« que l'existence de l'être auquel la chose convient [...] soit pour elle-même une fin de la nature »{/teal}. Or l'observation de la nature ne peut jamais l'établir. La finalité relative ne donne donc que des indications **hypothétiques**.

    **L'usage que l'homme fait des choses ne prouve rien.** Que l'homme trouve dans la nature de quoi satisfaire ses intentions, même {red}« souvent insensées »{/red} (les plumes bigarrées des oiseaux pour orner ses vêtements, les sucs des plantes pour se farder), ne fait pas de ces choses des fins naturelles : {teal}« la raison de l'être humain sait conférer aux choses une dimension de conformité avec ses inventions arbitraires »{/teal}. L'appropriation après coup n'est pas la cause de la chose. Seule une hypothèse le permettrait : si les hommes avaient **le devoir de vivre sur terre**, les moyens indispensables à leur subsistance devraient être tenus pour des fins naturelles.

    **Le Groenlandais et le Lapon ne sont pas des fins de la nature.** La neige protège les semailles et porte les traîneaux, les rennes se nourrissent de mousse et se laissent apprivoiser, la mer apporte du bois et des animaux remplis d'huile : {yellow}« une admirable conjonction »{/yellow} de rapports finaux, dont la fin serait le Groenlandais, le Lapon, le Samoyède. Mais on ne voit pas pourquoi des hommes devraient vivre là. Dire que la nature a disposé tout cela pour {red}« certaines misérables créatures »{/red} serait {red}« un jugement très audacieux et arbitraire »{/red} : l'{coral}« extrême insociabilité des hommes »{/coral} suffit à expliquer qu'ils se soient dispersés jusque dans ces contrées.

    ! Kant ne nie pas que le sable convienne aux pins : il refuse d'ériger cette convenance en cause de l'existence du sable.
    ! La critique de la finalité externe n'en supprime pas tout usage : les § 82-84 penseront encore l'homme comme fin dernière de la nature, à titre de jugement réfléchissant.
