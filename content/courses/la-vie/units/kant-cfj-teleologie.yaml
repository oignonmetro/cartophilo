- id: kant-cfj-teleologie-l19
  title: "Réunir les deux principes : subordonner le mécanisme à la téléologie (§ 78)"
  notes: |-
    Le § 78 conclut la Dialectique et prépare le passage à la Méthodologie. Il dit comment les deux principes s'accordent dans la pratique : {green}__on ne peut les unir pour expliquer une même chose, mais on peut subordonner le mécanisme à la téléologie__{/green}, en renvoyant leur accord au suprasensible.

    **Ne pas négliger le mécanisme.** {coral}« Sans celui-ci, on ne peut obtenir aucune intelligence de la nature des choses »{/coral}. Admettre qu'un architecte suprême a créé directement les formes de la nature n'apprend rien, car nous ne connaissons ni sa manière d'agir ni ses Idées : on ne peut expliquer la nature à partir de lui, **de haut en bas**. Et, **de bas en haut**, invoquer une cause intentionnelle dès qu'on croit voir de la finalité, c'est produire {red}« une explication totalement tautologique »{/red} : dire que l'œil voit parce qu'il est fait pour voir, c'est nommer la fonction sans indiquer comment elle se produit, {red}abuser la raison avec des mots{/red}, et la jeter dans une {red}« exaltation poétique »{/red} qu'elle a pour destination d'empêcher.

    **Ne pas négliger les fins.** C'est {coral}« une maxime tout aussi nécessaire »{/coral} : même s'il ne rend pas plus compréhensible la genèse des êtres organisés, le principe des fins est un {violet}**principe heuristique**{/violet} pour explorer les lois particulières de la nature. Vouloir suivre partout le seul mécanisme, là où la finalité se manifeste de façon indéniable, ferait divaguer la raison parmi des pouvoirs de la nature {red}aussi chimériques{/red} que ceux d'une téléologie qui ignore le mécanisme. La raison doit seulement être prudente : ne pas tenir pour téléologique toute régularité, comme celle des cristaux, qui reste explicable mécaniquement.

    **On ne peut les unir pour expliquer une même chose : l'exemple du ver.** Si j'admets qu'un {yellow}**ver**{/yellow} est produit par le simple mécanisme de la matière, quand ses éléments sont libérés par la putréfaction, je ne peux plus le déduire de cette même matière comme d'une causalité selon des fins ; et si je le tiens pour une fin naturelle, je ne peux plus compter sur sa production mécanique comme principe constitutif. {red}« Un mode d'explication exclut l'autre »{/red}, même si, objectivement, les deux reposaient sur un fondement unique.

    **Leur accord repose sur le suprasensible, comme exposition et non comme explication.** Le principe qui les rend compatibles ne peut être que **hors d'eux**, dans le {violet}**suprasensible**{/violet}, dont nous n'avons qu'un concept indéterminé. Or {teal}« expliquer signifie déduire d'un principe qu'il faut donc pouvoir connaître et indiquer clairement »{/teal}. Leur réunion ne fonde donc pas une {red}explication{/red} (*explicatio*) pour la faculté de juger déterminante, mais seulement une {green}**exposition**{/green} (*expositio*) de leur possibilité pour la faculté de juger réfléchissante : elle garantit qu'ils **peuvent** s'unir, sans dire comment.

    **Subordonner le mécanisme à la téléologie.** On ne peut remplacer l'un par l'autre, ni en tout ni en partie : là où l'on ne pense une chose que par une intention, aucun mécanisme ne peut prendre sa place, et là où le mécanisme rend une chose nécessaire, aucune fin n'est requise. Mais on peut {coral}« subordonner une de ces maximes (le mécanisme) à l'autre (le technicisme intentionnel) »{/coral}. Car là où des fins sont conçues, il faut aussi des **moyens**, dont la loi d'action ne présuppose aucune fin et peut être mécanique, tout en servant d'{coral}une cause subordonnée d'effets intentionnels{/coral}. La matière d'un être organisé obéit à ses lois mécaniques et sert pourtant de **moyen** à la forme que l'on juge intentionnelle.

    **D'où le droit et la vocation de la science.** Nous ne savons pas jusqu'où va l'explication mécanique ; nous savons seulement qu'elle restera toujours insuffisante pour ce que nous reconnaissons comme fins naturelles. D'où {green}le droit, et même la vocation, d'expliquer mécaniquement tous les produits de la nature, même les plus finalisés, aussi loin que nous le pouvons{/green}, sans jamais perdre de vue que ceux que nous ne pouvons examiner que sous le concept de fin doivent être finalement subordonnés à la causalité selon des fins.

    ! Subordonner le mécanisme ne veut pas dire le négliger : il faut au contraire le pousser aussi loin que possible.
    ! Le § 78 ne fournit pas une explication unifiée du vivant : l'accord des deux principes est garanti, non compris.
  points:
  - id: kant-cfj-teleologie-l19-q1
    sentence: "« Il importe infiniment à la raison de ne pas laisser de côté le **___** de la nature dans ses productions et de ne pas le négliger dans leur explication : car, sans celui-ci, on ne peut obtenir __aucune intelligence de la nature des choses__. »"
    answer: "mécanisme"
    alt: []
  - id: kant-cfj-teleologie-l19-q2
    sentence: "« Il importe infiniment à la raison de ne pas laisser de côté le **mécanisme** de la nature dans ses productions et de ne pas le négliger dans leur explication : car, sans celui-ci, on ne peut obtenir ___. »"
    answer: "aucune intelligence de la nature des choses"
    alt: []
  - id: kant-cfj-teleologie-l19-q3
    sentence: "« nous produirions une explication totalement **___** et nous abuserions la raison avec __des mots__ »"
    answer: "tautologique"
    alt: []
  - id: kant-cfj-teleologie-l19-q4
    sentence: "« nous produirions une explication totalement **tautologique** et nous abuserions la raison avec ___ »"
    answer: "des mots"
    alt: []
  - id: kant-cfj-teleologie-l19-q5
    sentence: "« étant donné que, même s'il ne nous rend pas vraiment plus compréhensible la modalité de leur genèse, il constitue cependant un **___** pour explorer __les lois particulières de la nature__ »"
    answer: "principe heuristique"
    alt: []
  - id: kant-cfj-teleologie-l19-q6
    sentence: "« étant donné que, même s'il ne nous rend pas vraiment plus compréhensible la modalité de leur genèse, il constitue cependant un **principe heuristique** pour explorer ___ »"
    answer: "les lois particulières de la nature"
    alt: []
  - id: kant-cfj-teleologie-l19-q7
    sentence: "« la réunion des deux principes ne saurait reposer sur un fondement de l'**___** (*explicatio*) d'un produit selon des lois données pour la faculté de juger déterminante, mais seulement sur un fondement de l'__exposition__ (*expositio*) de cette possibilité pour la faculté de juger réfléchissante. »"
    answer: "explication"
    alt: []
  - id: kant-cfj-teleologie-l19-q8
    sentence: "« la réunion des deux principes ne saurait reposer sur un fondement de l'**explication** (*explicatio*) d'un produit selon des lois données pour la faculté de juger déterminante, mais seulement sur un fondement de l'___ (*expositio*) de cette possibilité pour la faculté de juger réfléchissante. »"
    answer: "exposition"
    alt: []
  - id: kant-cfj-teleologie-l19-q9
    sentence: "« au contraire est-il permis simplement de **___** une de ces maximes (le mécanisme) à l'autre (__le technicisme intentionnel__) »"
    answer: "subordonner"
    alt: []
  - id: kant-cfj-teleologie-l19-q10
    sentence: "« au contraire est-il permis simplement de **subordonner** une de ces maximes (le mécanisme) à l'autre (___) »"
    answer: "le technicisme intentionnel"
    alt: []
  - id: kant-cfj-teleologie-l19-q11
    sentence: "Expliquer les formes de la nature par un architecte suprême qui les aurait créées directement n'augmente en rien notre connaissance, car nous ne connaissons ni son mode d'action ni ses ___."
    answer: "Idées"
    alt: []
  - id: kant-cfj-teleologie-l19-q12
    sentence: "Recourir à une cause intentionnelle pour tout ce qui semble finalisé entraînerait la raison dans une ___ poétique, qu'elle a précisément pour destination d'empêcher."
    answer: "exaltation"
    alt: []
  - id: kant-cfj-teleologie-l19-q13
    sentence: "« Si, par exemple à propos d'un ___, j'admets qu'il est à considérer comme produit du simple mécanisme de la matière (de la formation nouvelle qu'elle opère par elle-même, quand ses éléments sont libérés par putréfaction), je ne peux dès lors déduire le même produit à partir de cette même matière comme à partir d'une causalité [...] capable d'agir selon des fins. »"
    answer: "ver"
    alt: []
  - id: kant-cfj-teleologie-l19-q14
    sentence: "Les deux principes ne peuvent s'unir comme principes dogmatiques et constitutifs pour expliquer une même chose de la nature, car, dit Kant, « un mode d'explication ___ l'autre »."
    answer: "exclut"
    alt: []
  - id: kant-cfj-teleologie-l19-q15
    sentence: "« le principe commun de la déduction mécanique d'un côté et de la déduction téléologique de l'autre est le ___ »"
    answer: "suprasensible"
    alt: []
  - id: kant-cfj-teleologie-l19-q16
    sentence: "Expliquer, selon Kant, c'est ___ d'un principe qu'il faut pouvoir connaître et indiquer clairement."
    answer: "déduire"
    alt: []
  - id: kant-cfj-teleologie-l19-q17
    sentence: "Là où des fins sont conçues, il faut admettre des moyens dont la loi d'action peut être mécanique, mais qui constituent en même temps une cause ___ d'effets intentionnels."
    answer: "subordonnée"
    alt: []
  - id: kant-cfj-teleologie-l19-q18
    sentence: "La raison ne doit pas « chercher à expliquer comme téléologique toute technique de la nature, c'est-à-dire son pouvoir producteur, tel que s'y manifeste une finalité de la forme pour notre simple appréhension (comme dans les corps ___) »."
    answer: "réguliers"
    alt: []
  - id: kant-cfj-teleologie-l19-q19
    sentence: "Selon la note d'Alain Renaut, le § 78 amorce le passage à la ___ : il faut montrer que mécanisme et finalité, compatibles en droit, ne se contredisent pas non plus dans la pratique."
    answer: "Méthodologie"
    alt: []
  - id: kant-cfj-teleologie-l19-q20
    sentence: "Le § 78 tient ensemble deux devoirs : expliquer mécaniquement tous les produits de la nature aussi loin que nous le pouvons, et subordonner finalement à la causalité selon des fins ceux que nous ne pouvons examiner que sous le concept de ___."
    answer: "fin"
    alt: []
