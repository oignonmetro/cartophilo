lessons:
- id: kant-cfj-teleologie-l1
  title: "Repérage : le plan de la Critique de la faculté de juger téléologique"
  notes: |-
    La seconde partie de la *Critique de la faculté de juger* part d'une question (__y a-t-il dans la nature une finalité objective, et de quel droit la juger ?__) et aboutit à une réponse en deux temps : {green}__certains produits de la nature, les êtres organisés, ne peuvent être pensés par nous que comme des fins__{/green}, mais {red}ce jugement ne nous apprend rien de leur production réelle{/red} ; il est une règle de notre réflexion, imposée par la constitution de notre entendement.

    **L'Analytique** {sky}**(§ 61-68)**{/sky} **cherche ce qui mérite le nom de fin naturelle** : elle écarte la finalité {pink}géométrique{/pink} et la finalité {pink}d'utilité{/pink}, définit l'{green}**être organisé**{/green} comme ce qui est « cause et effet d'elle-même », puis étend sa maxime à la nature entière comme système des fins. **La Dialectique** {sky}**(§ 69-78)**{/sky} **affronte le conflit qui en naît** entre le {violet}mécanisme{/violet} et la {violet}téléologie{/violet} : elle le présente comme une antinomie, réfute les systèmes qui ont cru le trancher, puis le résout en ramenant les deux principes à des maximes de notre jugement, fondées sur notre entendement {coral}discursif{/coral}.

    | Mouvement | Lieu | Ce qui s'y joue |
    | poser la question de la finalité objective et écarter ses fausses figures | § 61-63 | ni la fécondité des figures géométriques ni l'utilité d'une chose pour une autre ne prouvent une fin de la nature |
    | définir la fin naturelle : l'être organisé | § 64-65 | une chose est fin naturelle quand ses parties se produisent les unes les autres et produisent le tout, ce que ne fait aucune machine |
    | tirer la maxime de l'organisme et l'étendre à la nature | § 66-68 | rien n'est en vain dans un être organisé ; la nature entière peut alors se juger comme un système de fins, sans recourir à Dieu en physique |
    | poser l'antinomie et en préparer la solution | § 69-71 | mécanisme et finalité ne se contredisent que si l'on prend des maximes de la réflexion pour des lois des choses |
    | réfuter les systèmes dogmatiques | § 72-74 | ni le hasard, ni la fatalité, ni la matière vivante, ni le Dieu créateur ne peuvent expliquer la finalité, car son concept ne se démontre pas |
    | fonder la solution sur notre entendement | § 75-77 | nous ne pouvons penser les êtres organisés que par une cause intelligente parce que notre entendement va des parties au tout |
    | subordonner le mécanisme à la téléologie | § 78 | il faut expliquer le vivant mécaniquement aussi loin que possible, en subordonnant ce mécanisme à la finalité |

    ! La seconde partie ne prouve ni l'existence de Dieu ni l'insuffisance réelle du mécanisme : elle établit ce que notre faculté de juger doit penser, et pourquoi.
