- id: kant-cfj-teleologie-l4
  title: "La finalité objective mais formelle des figures géométriques (§ 62)"
  notes: |-
    Le § 62 étudie un **cas-limite** avant d'aborder les fins naturelles : la finalité des figures géométriques. Elle est **objective**, puisqu'on peut dire à quelle fin la figure sert, mais seulement **formelle** : {green}__elle ne suppose aucune fin à son fondement, parce que c'est nous qui l'introduisons dans la figure en la construisant__{/green}. Le paragraphe ménage ainsi le passage de la finalité subjective du beau à la finalité objective et matérielle des êtres vivants.

    **La finalité des figures est objective et intellectuelle.** {teal}« Toutes les figures géométriques qui sont tracées selon un principe manifestent une finalité objective variée, souvent admirée »{/teal} : une seule règle de construction permet de résoudre une foule de problèmes qu'on n'avait pas en vue en la posant. Kant prend l'exemple du {yellow}**cercle**{/yellow} : construire un triangle à partir d'une base et de l'angle opposé admet une infinité de solutions, que le cercle {teal}« contient pourtant toutes ensemble »{/teal} ; deux cordes qui se coupent dans un cercle se divisent d'elles-mêmes en segments dont les rectangles sont égaux. Cette convenance d'une figure à des usages innombrables est **objective**, puisqu'elle se connaît par la raison et tient à la figure, et non au plaisir de celui qui la regarde.

    **Mais elle est formelle : la figure n'est pas faite pour ces usages.** La fin, ici, ne rend pas possible le concept de l'objet : le cercle n'existe pas *pour* résoudre le problème du triangle, c'est au contraire la solution qui découle de la constitution du cercle. Il en va autrement d'un {yellow}**jardin**{/yellow} : l'ordre de ses allées et de ses parterres ne se déduit d'aucune règle a priori, il porte sur des choses existantes, données empiriquement ; il suppose donc le **concept d'une fin**, le plan du jardinier. D'où la distinction : finalité {violet}formelle{/violet} (sans fin à son fondement) et finalité {violet}réelle{/violet} ou matérielle (qui dépend du concept d'une fin).

    **La raison : c'est moi qui mets la finalité dans la figure.** L'espace n'est pas une propriété des choses hors de moi, mais {teal}« un simple mode de représentation en moi »{/teal}. En traçant une figure d'après un concept, je détermine moi-même l'espace : {coral}« c'est moi qui introduis la finalité dans la figure que je trace en conformité avec un concept »{/coral}. Je n'ai donc besoin d'aucune fin inscrite dans l'objet pour en rendre compte. Le présupposé est l'idéalité transcendantale de l'espace, établie dans la *Critique de la raison pure* ; sans elle, la fécondité a priori de la géométrie deviendrait un mystère.

    **L'admiration des géomètres est naturelle, mais Platon s'est mépris sur sa source.** Les géomètres anciens étudiaient la parabole et l'ellipse sans en connaître l'usage, que révéleraient la chute des corps et le mouvement des astres. Cet accord inattendu suscite l'{violet}**admiration**{/violet}, {teal}« un étonnement qui resurgit toujours »{/teal} même une fois le doute dissipé. {sky}Platon{/sky} y a vu le signe d'une {red}communauté intellectuelle avec l'origine de tous les êtres{/red} ; c'est une {red}« admiration suscitée par un malentendu »{/red}, {teal}« pardonnable »{/teal}, car elle prend pour une harmonie des choses ce qui tient à notre propre manière de construire l'espace. Elle reste légitime en un sens : l'accord de l'espace avec l'entendement est inexplicable pour nous, et nous fait pressentir un fondement au-delà du sensible.

    **On ne doit donc pas parler de la beauté des figures.** Le jugement qui y trouve de la finalité n'est pas esthétique, sans concept, mais intellectuel, par concepts : il faudrait parler d'une {coral}« perfection relative »{/coral} plutôt que d'une beauté. Seule une **démonstration** peut être dite belle, parce qu'en elle l'entendement et l'imagination se sentent renforcés : c'est l'{violet}« élégance de la démonstration »{/violet}.

    ! La finalité des figures n'est pas une fin naturelle : en mathématique pure, il n'est question que de la possibilité des choses, non de leur existence, donc ni de cause ni d'effet (§ 63, note).
