- id: kant-cfj-teleologie-l8
  title: "La maxime : rien n'est en vain dans un être organisé (§ 66)"
  notes: |-
    Le § 66 tire de la définition de l'être organisé le principe qui permet de le juger. {green}__« Un produit organisé de la nature est celui dans lequel tout est fin et réciproquement aussi moyen »__{/green} : ce principe est à la fois la définition de l'organisme et une {violet}**maxime**{/violet} de la faculté de juger, nécessaire à la recherche, mais régulatrice.

    **La définition implique la maxime.** Si les parties d'un être organisé se produisent et se conservent mutuellement, une partie qui ne servirait à rien n'y aurait pas de place : elle romprait la réciprocité qui fait le tout. D'où : {teal}« Il n'y a rien en lui qui soit là pour rien, sans fin, ou qui se doive attribuer à un mécanisme aveugle de la nature. »{/teal}

    **L'expérience suscite le principe, mais ne peut le fonder.** Il naît de l'**observation**, cette expérience méthodiquement conduite. Mais il affirme une finalité **universelle et nécessaire**, *rien* en vain ; or l'expérience ne fournit que des régularités constatées, jamais une nécessité ni une universalité stricte. Il doit donc avoir pour fondement {teal}« quelque principe a priori »{/teal}, fût-il seulement régulateur, et les fins ne résident que {coral}« dans l'Idée de celui qui juge »{/coral}, non dans une cause efficiente. L'empiriste ne peut contester que l'induction ne donne jamais l'universel.

    **Les anatomistes ne peuvent s'en passer, pas plus que les physiciens du principe de causalité.** {yellow}Ceux qui dissèquent les végétaux et les animaux{/yellow} pour savoir pourquoi telle partie leur a été donnée tiennent pour nécessaire cette maxime, et lui donnent {coral}la même valeur{/coral} qu'au principe de toute la science de la nature : {teal}« rien ne se produit par hasard »{/teal}. Abandonner celui-ci, ce serait n'avoir plus d'expérience du tout ; abandonner celle-là, ce serait n'avoir plus de {violet}**fil conducteur**{/violet} pour observer les êtres organisés. Qui renonce à chercher la fonction d'un organe inconnu le déclare un caprice du mécanisme et cesse de chercher.

    **La finalité doit s'étendre à tout le produit.** {teal}« Une Idée doit être au fondement de la possibilité du produit de la nature. »{/teal} Or l'Idée est {teal}« une unité absolue de la représentation »{/teal}, tandis que {coral}la matière est une multiplicité qui ne fournit d'elle-même aucune unité{/coral}. Une unité absolue ne peut régir un objet à moitié : si l'on rapporte le produit à un principe au-delà du mécanisme, il faut le juger **tout entier** d'après ce principe. Mêler les deux, juger une partie par les fins et une autre par le seul mécanisme, ne laisserait {red}« aucune règle d'appréciation qui soit sûre »{/red}.

    **Même ce qui semble mécanique relève de la fin.** Dans un corps animal, la peau, les os, les cheveux peuvent être compris comme des concrétions selon des lois mécaniques. Mais la cause qui procure la matière convenable, la modifie, la façonne et la dépose aux bons endroits doit toujours être jugée téléologiquement : tout y est organisé, et tout y est organe.

    ! La maxime n'affirme pas que la nature ne produit jamais d'organe inutile : elle prescrit de chercher la fonction de chaque partie.
    ! Elle ne remplace pas le mécanisme : elle guide la recherche là où il ne suffit pas à rendre l'organisation compréhensible.
  points:
  - id: kant-cfj-teleologie-l8-q1
