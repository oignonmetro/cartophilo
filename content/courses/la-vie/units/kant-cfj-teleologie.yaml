- id: kant-cfj-teleologie-l13
  title: "Préparer la solution : ne pas confondre réfléchir et déterminer (§ 71)"
  notes: |-
    Le § 71 prépare la résolution de l'antinomie. Il établit deux certitudes de sens contraire, puis en tire le diagnostic : {green}__toute apparence d'antinomie vient de ce que l'on confond un principe de la faculté de juger réfléchissante avec un principe de la faculté de juger déterminante__{/green}.

    **On ne peut pas prouver que le mécanisme est réellement insuffisant.** {teal}« Nous ne pouvons nullement prouver l'impossibilité de la production des produits organisés de la nature par le simple mécanisme naturel »{/teal}. Car les lois particulières de la nature ne nous sont connues qu'empiriquement, et le principe interne qui rendrait compte de toute leur diversité réside dans le {violet}**suprasensible**{/violet}, hors de notre portée. Pour affirmer que la matière est incapable de produire un organisme, il faudrait connaître toutes ses forces et jusqu'à leur fondement : ce serait s'attribuer un savoir que l'homme n'a pas. Nous ne savons donc pas si la nature, par ses seules forces, suffirait à produire ce que nous jugeons organisé, ni s'il faut au fondement des fins naturelles un {red}« entendement architectonique »{/red}.

    **Mais il est certain que le mécanisme est insuffisant pour nous.** {coral}« Que, par rapport à notre pouvoir de connaître, le simple mécanisme de la nature ne puisse pas non plus fournir de fondement d'explication pour la production d'êtres organisés, c'est tout aussi indubitablement certain. »{/coral} Ce qui est incertain dans les choses est certain pour notre façon de connaître : nous ne savons pas expliquer l'organisation sans l'Idée d'un tout qui règle les parties.

    **D'où le principe juste pour la réflexion.** Pour la faculté de juger réfléchissante, il est {teal}« tout à fait juste »{/teal} de penser, pour la connexion si manifeste des choses d'après des fins, une causalité autre que le mécanisme : {coral}« une cause du monde (intelligente) agissant selon des fins »{/coral}. Comme **maxime**, ce principe n'est qu'une Idée qu'on ne cherche pas à rendre réelle, un **fil conducteur** qui reste disponible pour toutes les explications mécanistes et {green}ne se perd pas hors du monde sensible{/green}. Comme principe **objectif**, il obligerait la faculté de juger déterminante à le suivre {red}dans le transcendant, au risque de l'erreur{/red}.

    **Le diagnostic.** L'apparence d'antinomie repose sur la confusion entre {violet}l'**autonomie**{/violet} de la faculté de juger réfléchissante, valable seulement pour nous et pour l'usage que nous faisons de notre raison, et {violet}l'**hétéronomie**{/violet} de la faculté de juger déterminante, qui doit suivre les lois que lui fournit l'entendement. Prendre une règle que le sujet se prescrit pour une loi que les choses imposent, c'est créer un conflit qui n'existe pas.

    ! Le § 71 n'est qu'une « préparation » : il désigne la source de l'illusion, mais il faudra les § 75-77 pour comprendre pourquoi notre entendement ne peut juger autrement.
    ! Kant ne concède pas que le vivant soit réellement produit par le mécanisme : il dit qu'on ne peut prouver ni que oui, ni que non.
