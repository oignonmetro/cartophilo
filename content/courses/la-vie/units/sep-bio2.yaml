    answer: "optimalité"
    alt: []
- id: sep-bio2-l6
  title: "Trois sortes d'adaptationnisme"
  notes: |-
    **Un exemple de ce que la philosophie apporte : montrer qu'on se dispute sur trois thèses à la fois.** {violet}Peter Godfrey-Smith{/violet} (2001) distingue trois types d'adaptationnisme, logiquement indépendants.

    | Adaptationnisme | Sa thèse | Sa nature |
    | empirique | la sélection domine, et suffit à prédire les résultats | une thèse sur la nature |
    | explicatif | l'adaptation est le grand problème, que la sélection résout | une thèse sur ce qui compte |
    | méthodologique | chercher l'adaptation est la meilleure stratégie | un conseil de recherche |

    **Pourquoi la distinction change le débat.** Ces trois thèses peuvent se séparer.
    - On peut être {violet}explicatif{/violet} sans être {violet}empirique{/violet} : admettre que la plupart des traits ne sont pas des adaptations, et tenir pourtant que l'œil, seul, pose la grande question à laquelle la sélection répond.
    - On peut être {violet}méthodologique{/violet} sans être {violet}empirique{/violet} : supposer l'adaptation pour voir ce qu'elle prédit, à titre d'hypothèse de travail, sans croire qu'elle explique tout.

    {coral}__Critiquer l'une de ces thèses ne réfute donc pas les autres__{/coral} : qui attaque l'adaptationniste en montrant un trait non adaptatif n'a touché que la thèse empirique.
  tables:
