- id: sep-bio2-l7
  title: "Les unités de sélection : le gène égoïste"
  notes: |-
    **Seconde controverse des années 1980 : sur quoi la sélection agit-elle ?** Elle s'ouvre avec deux livres.

    **La thèse du gène.** {sky}*Adaptation and Natural Selection*{/sky} de {violet}George Williams{/violet} (1966) et {sky}*The Selfish Gene*{/sky} (*Le Gène égoïste*) de {violet}Richard Dawkins{/violet} (1976) soutiennent que {green}__l'unité de sélection est l'allèle mendélien individuel, et non l'organisme, le groupe d'organismes ou l'espèce__{/green}. Le renversement est net : ce n'est plus le lion qui lutte pour survivre grâce à ses gènes, ce sont les gènes qui se perpétuent à travers des lions.

    **Une explosion de travaux philosophiques sur la question des {violet}unités de sélection{/violet}** (Brandon et Burian 1984). Les premiers débats portent sur deux points (Hull 1980, Wimsatt 1980, Brandon 1982, Sober et Lewontin 1984, Lloyd 1988, Sterelny et Kitcher 1988) :
    - y a-t-il **une** unité de sélection déterminée ?
    - **quels critères** permettent de dire laquelle, dans chaque cas ?

    ! Dire que le gène est l'unité de sélection n'est pas dire que les gènes ont des intentions : « égoïste » est une image pour dire qu'ils sont retenus selon leur propre taux de copie.
  points:
  - id: sep-bio2-l7-p1
    sentence: "La seconde controverse qui explique l'intérêt philosophique des années 1980 pour l'évolution porte sur les ___ de sélection."
    answer: "unités"
    alt: []
  - id: sep-bio2-l7-p2
    sentence: "*Adaptation and Natural Selection* (1966), qui soutient que l'unité de sélection est l'allèle individuel, est de George ___."
    answer: "Williams"
    alt: []
  - id: sep-bio2-l7-p3
    sentence: "*The Selfish Gene* (1976), qui soutient que l'unité de sélection est l'allèle individuel, est de Richard ___."
    answer: "Dawkins"
    alt: []
  - id: sep-bio2-l7-p4
    sentence: "Pour Williams et Dawkins, l'unité de sélection est l'___ mendélien individuel, et non l'organisme, le groupe d'organismes ou l'espèce."
    answer: "allèle"
    alt: ["allele"]
  - id: sep-bio2-l7-p5
    sentence: "Les premiers débats sur les unités de sélection demandent s'il y a une unité de sélection ___, et quels critères permettent de la reconnaître dans chaque cas."
    answer: "déterminée"
    alt: []
  - id: sep-bio2-l7-p6
    sentence: "« Égoïste » est une image : dans la thèse de Dawkins, les gènes n'ont pas d'intentions, ils sont retenus selon leur propre taux de ___."
    answer: "copie"
    alt: ["réplication"]
- id: sep-bio2-l8
  title: "Modèles à plusieurs niveaux et sélection de groupe"
  notes: |-
    **Quand apparaissent les modèles de {violet}sélection à plusieurs niveaux{/violet} et l'{violet}équation de Price{/violet}, l'attention passe à leur interprétation** (Godfrey-Smith et Lewontin 1993, Lloyd 2005, Waters 2005, Okasha 2006, Birch 2017). Le débat cesse d'être seulement empirique, car un même phénomène se laisse souvent décrire de plusieurs manières.

    **La question d'équivalence.** Pour tout modèle de sélection de groupe, existe-t-il un modèle de sélection individuelle {violet}empiriquement équivalent{/violet} ? (De même pour les modèles génotypiques et géniques.) Si oui, {red}__ces modèles représentent-ils la même structure causale__{/red}, ou seulement les mêmes résultats ? C'est une vraie question philosophique : deux comptabilités peuvent donner le même total sans décrire les mêmes causes. Autre question : la {violet}sélection de parentèle{/violet} est-elle une forme de sélection de groupe ?

    **Une contribution philosophique à la biologie.** On peut soutenir que des philosophes ont contribué de façon significative à la {coral}réhabilitation de certaines formes de « sélection de groupe »{/coral} dans la biologie de l'évolution, dans les années 1990, après **deux décennies de négligence ou de mépris** : c'est le cas de {sky}*Unto Others*{/sky} (1998), du philosophe Elliott Sober et du biologiste David Sloan Wilson.

    ! La réhabilitation ne porte que sur **certaines formes** de sélection de groupe : elle ne rétablit pas l'idée naïve que les traits évoluent « pour le bien de l'espèce ».
  points:
  - id: sep-bio2-l8-p1
    sentence: "Avec les modèles de sélection à plusieurs niveaux et l'équation de ___, les débats sur les unités de sélection portent sur l'interprétation de ces modèles."
    answer: "Price"
    alt: []
  - id: sep-bio2-l8-p2
    sentence: "Pour tout modèle de sélection de groupe, existe-t-il un modèle de sélection individuelle ___ équivalent ? Et, si oui, représentent-ils la même structure causale ?"
    answer: "empiriquement"
    alt: []
  - id: sep-bio2-l8-p3
    sentence: "Deux modèles de sélection, l'un de groupe, l'autre individuel, peuvent être empiriquement équivalents : la question devient de savoir s'ils représentent la même structure ___."
    answer: "causale"
    alt: []
  - id: sep-bio2-l8-p4
    sentence: "Une question d'interprétation des modèles de sélection : la sélection de ___ est-elle une forme de sélection de groupe ?"
    answer: "parentèle"
    alt: []
  - id: sep-bio2-l8-p5
    sentence: "Des philosophes ont contribué, dans les années 1990, à réhabiliter certaines formes de sélection de ___, après deux décennies de négligence ou de mépris."
    answer: "groupe"
    alt: []
  - id: sep-bio2-l8-p6
    sentence: "*Unto Others* (1998), qui contribue à réhabiliter certaines formes de sélection de groupe, est du philosophe Elliott Sober et du biologiste David Sloan ___."
    answer: "Wilson"
