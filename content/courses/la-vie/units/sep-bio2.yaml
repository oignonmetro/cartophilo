- id: sep-bio2-l4
  title: "Dérive et sélection : des processus, non des motifs"
  notes: |-
    **Comment distinguer la {violet}dérive génétique aléatoire{/violet} de la sélection ?** (Beatty.) La question paraît simple ; elle cache une vraie difficulté conceptuelle.

    **Le même motif, deux origines.** On pense d'ordinaire que la dérive a lieu quand on observe une **fluctuation aléatoire des fréquences géniques**. {red}__Or la sélection dans un environnement changeant peut produire exactement le même motif.__{/red} Si le milieu favorise tantôt un trait, tantôt l'autre, les fréquences oscillent comme si le hasard seul jouait. Le motif observé ne permet donc pas de trancher.

    **Il faut donc les distinguer comme {violet}processus{/violet}, non comme {violet}motifs{/violet}.** Un moyen : la distinction entre {green}échantillonnage discriminant{/green} et {pink}échantillonnage indiscriminé{/pink} (Millstein 2002, 2005 ; Brandon 2005). {coral}__La question devient : le trait qui nous intéresse est-il causalement pertinent ou non pour les changements de fréquence ?__{/coral}
    - Des oiseaux repèrent les papillons clairs et les mangent : la couleur joue causalement, l'échantillonnage est **discriminant**, c'est de la sélection (exemple familier).
    - Un incendie brûle tout un côté de la forêt, sans égard à la couleur : même si les clairs en meurent davantage, la couleur ne joue aucun rôle, l'échantillonnage est **indiscriminé**, c'est de la dérive.

    Le résultat chiffré peut être identique dans les deux cas : seule la causalité diffère. Ces analyses soigneuses de la génétique des populations, cœur mathématique de la théorie traditionnelle de l'évolution, restent fécondes (Plutynski 2006, Okasha 2007, Sarkar 2011, Sober 2024).

    ! La dérive n'est pas l'absence de cause : l'incendie est bien une cause de mort. Ce qui manque, c'est un rôle causal du **trait** considéré.
  points:
  - id: sep-bio2-l4-p1
    sentence: "On pense d'ordinaire que la dérive a lieu quand les fréquences géniques fluctuent au hasard ; mais la sélection dans un environnement ___ peut produire exactement le même motif."
    answer: "changeant"
    alt: []
  - id: sep-bio2-l4-p2
    sentence: "Puisque la sélection dans un environnement changeant imite la fluctuation aléatoire des fréquences géniques, il faut distinguer sélection et dérive comme ___, non comme simples motifs."
    answer: "processus"
    alt: []
  - id: sep-bio2-l4-p3
    sentence: "Puisque la sélection dans un environnement changeant imite la fluctuation aléatoire des fréquences géniques, il faut distinguer sélection et dérive comme processus, non comme simples ___."
    answer: "motifs"
    alt: []
  - id: sep-bio2-l4-p4
    sentence: "Roberta Millstein et Brandon distinguent la sélection et la dérive par deux sortes d'échantillonnage : la sélection est un échantillonnage ___."
    answer: "discriminant"
    alt: []
  - id: sep-bio2-l4-p5
    sentence: "Roberta Millstein et Brandon distinguent la sélection et la dérive par deux sortes d'échantillonnage : la dérive est un échantillonnage ___."
    answer: "indiscriminé"
    alt: []
  - id: sep-bio2-l4-p6
    sentence: "Pour distinguer sélection et dérive, on demande si le trait considéré est causalement ___ ou non pour les changements de fréquence géniques."
    answer: "pertinent"
    alt: []
  - id: sep-bio2-l4-p7
    sentence: "Un incendie brûle un côté de la forêt, sans égard à la couleur des papillons ; même si les clairs en meurent davantage, c'est de la ___, la couleur ne jouant aucun rôle causal."
    answer: "dérive"
    alt: []
  - id: sep-bio2-l4-p8
    sentence: "La génétique des ___ est le cœur mathématique de la théorie traditionnelle de l'évolution, dont les analyses de la dérive et de la sélection restent fécondes."
    answer: "populations"
    alt: []
- id: sep-bio2-l5
  title: "La sociobiologie et les écoinçons de Saint-Marc"
  notes: |-
    **L'intense intérêt philosophique des années 1980 pour la théorie de l'évolution s'explique en partie par deux controverses** (Segerstråle 2000). La première est celle de la {violet}sociobiologie{/violet}.

    **La provocation de Wilson.** {violet}E. O. Wilson{/violet} publie le manuel qui donne son nom à la controverse, {sky}*Sociobiology*{/sky} (1975), puis un livre grand public couronné par le prix Pulitzer, {sky}*On Human Nature*{/sky} (1978). Le geste contesté : appliquer la biologie de l'évolution au comportement social **humain**.

    **La critique de Gould et Lewontin.** Une critique capitale vient de {violet}Stephen Jay Gould et Richard Lewontin{/violet} (1979), dans {sky}« The spandrels of San Marco and the Panglossian paradigm »{/sky}, sous-titré critique du {violet}programme adaptationniste{/violet}. Deux images portent l'argument :
    - {yellow}Les **écoinçons** (*spandrels*) de Saint-Marc{/yellow} : ces espaces triangulaires entre les arcs de la basilique de Venise sont si richement décorés qu'on les croirait voulus ; ce sont en réalité des sous-produits nécessaires de l'architecture, utilisés après coup. De même, un trait utile n'a pas forcément été sélectionné pour cet usage.
    - {yellow}Le **paradigme panglossien**{/yellow}, du docteur Pangloss de Voltaire, pour qui tout est au mieux : les nez sont faits pour porter des lunettes. {red}__C'est le défaut que Gould et Lewontin reprochent à l'adaptationniste : inventer pour chaque trait une histoire sur son utilité.__{/red}

    **Le débat s'élargit.** Les discussions sur l'{violet}adaptationnisme{/violet} se révèlent porter sur un ensemble diffus d'inquiétudes : l'évolution produit-elle des adaptations ? quel rôle pour les {violet}modèles d'optimalité{/violet} ? quelle méthode pour la théorie de l'évolution ? Le travail philosophique aide à {coral}distinguer ces fils et à réduire la confusion{/coral} d'une littérature biologique passionnée et polémique, pour et contre (Orzack et Sober 2001).

    ! Gould et Lewontin ne nient pas la sélection naturelle : ils contestent qu'on la suppose partout, sans preuve, comme explication de tout trait.
  points:
  - id: sep-bio2-l5-p1
    sentence: "La première des deux controverses qui expliquent l'intérêt philosophique des années 1980 pour l'évolution est celle de la ___, provoquée par le manuel de 1975 qui porte ce nom."
    answer: "sociobiologie"
    alt: []
  - id: sep-bio2-l5-p2
    sentence: "*Sociobiology* (1975) et *On Human Nature* (1978), qui appliquent l'évolution au comportement social humain, sont d'E. O. ___."
    answer: "Wilson"
    alt: []
  - id: sep-bio2-l5-p3
    sentence: "E. O. Wilson publie en 1978 un livre grand public couronné par le prix Pulitzer, *On Human ___*."
    answer: "Nature"
    alt: []
  - id: sep-bio2-l5-p4
    sentence: "La critique du programme adaptationniste, « The spandrels of San Marco and the Panglossian paradigm » (1979), est due à Stephen Jay Gould et Richard ___."
    answer: "Lewontin"
    alt: []
  - id: sep-bio2-l5-p5
    sentence: "Gould et Lewontin comparent certains traits biologiques aux ___ (*spandrels*) de Saint-Marc : ces espaces entre les arcs semblent voulus, et sont des sous-produits de l'architecture."
    answer: "écoinçons"
    alt: []
  - id: sep-bio2-l5-p6
    sentence: "Les écoinçons de Gould et Lewontin sont empruntés à la basilique ___ de Venise."
    answer: "Saint-Marc"
    alt: ["Saint Marc"]
  - id: sep-bio2-l5-p7
