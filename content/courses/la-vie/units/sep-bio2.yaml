    sentence: "Le ___ sur la vie tient qu'il n'y a pas une seule définition correcte de la « vie », mais plusieurs définitions légitimes."
    answer: "pluralisme"
    alt: []
- id: sep-bio2-l2
  title: "Créer la vie, et d'où elle vient"
  notes: |-
    **Si l'on ne sait pas définir la vie, peut-on la créer ?** La question de la {violet}vie artificielle{/violet} se pose en deux versions, de force très inégale.

    | Thèse | Ce qu'elle soutient | Son point faible |
    | vie artificielle forte | robots et programmes peuvent être vivants | oublie des traits cruciaux du vivant |
    | vie artificielle faible | simuler in silico nous instruit sur le vivant | trop modeste, voire triviale |

    **Vie artificielle forte.** Quand des robots ou des programmes manifestent certaines {violet}propriétés formelles{/violet} comme l'{violet}autoréplication{/violet}, ils sont vivants. C'est une sorte de fonctionnalisme : ce qui compte est l'organisation, non le matériau. Les sceptiques répondent que cette approche {red}laisse de côté des traits cruciaux des vivants{/red} (Sober 1991, Boden 1999, Brooks 2001). Boden demande par exemple si le métabolisme n'est pas nécessaire, ce qu'un programme n'a pas.

    **Vie artificielle faible.** On ne prétend plus que la simulation vit : on apprend sur la nature des vivants en simulant leurs processus {violet}*in silico*{/violet} (Langton 1989, 1995). Une simulation de vol n'a jamais volé, et pourtant elle apprend quelque chose sur le vol (exemple familier). Mais {red}on peut craindre que cette approche soit trop modeste, voire triviale{/red}.

    **L'origine de la vie sur Terre.** La question soulève d'abord des problèmes de **méthode**, car on peut partir de deux bouts :
    - **depuis le bas** : prendre des {violet}systèmes chimiques prébiotiques{/violet} très simples et « créer » des vivants à partir d'eux ;
    - **depuis le haut** : remonter à notre {violet}dernier ancêtre commun universel{/violet} (LUCA) pour établir ce qu'était le premier vivant ou type de vivant.

    **La vie existe-t-elle ailleurs dans l'Univers ?** {coral}Cette dernière question nous ramène à la première : pour chercher la vie, il faut savoir ce qu'est la vie.{/coral}
  tables:
  - table: these-ce-qu-elle-soutient-son-point-faible
    exercises:
    - {kind: bank, column: Son point faible}
    - {kind: cell, column: Thèse}
