    answer: "statistique"
    alt: []
  - id: sep-bio2-l3-p9
    sentence: "Dans l'interprétation statistique de l'évolution, un taux de sélection ne pousse pas plus les organismes qu'un taux de ___ dans un pays ne pousse quelqu'un vers la tombe."
    answer: "mortalité"
    alt: []
