- id: sep-bio2-l3
  title: "La sélection est-elle une force ? Sober contre l'interprétation statistique"
  notes: |-
    **La biologie de l'évolution a longtemps pris la part du lion de l'attention philosophique.** Ce travail sert parfois une thèse générale, comme la {violet}conception sémantique{/violet} (ou par modèles) des théories (Beatty, Lloyd, Thompson) ; mais il porte surtout sur des problèmes internes à la théorie, et ressemble alors autant à de la biologie théorique qu'à de la philosophie des sciences pure.

    **L'interprétation de Sober : des forces.** {sky}*The Nature of Selection*{/sky} (1984) d'{violet}Elliott Sober{/violet} marque le moment où beaucoup de philosophes découvrent le champ. Sober analyse la structure de la {violet}génétique des populations{/violet} par une analogie avec la {yellow}mécanique newtonienne et la composition des forces{/yellow}. {green}__Le changement réel des fréquences géniques dans le temps est la résultante de plusieurs « forces » : la sélection, la dérive génétique aléatoire, la mutation et la migration.__{/green} L'analogie va loin : comme un corps qui ne subit aucune force ne change pas de mouvement, une population qu'aucune force n'affecte garde ses fréquences. L'évolution s'explique alors comme un mouvement, par addition de causes.

    **L'interprétation statistique.** Plusieurs philosophes contestent cette lecture (Sterelny et Kitcher 1988, Matthen et Ariew 2002, Walsh, Lewens et Ariew 2002). Selon la lecture {pink}« statistique »{/pink}, ce qui se passe causalement, ce sont les vies, les morts et les naissances des individus ; la sélection et la dérive sont des **résumés statistiques** de ces événements au niveau de la population, non des causes qui s'y ajoutent. {red}Un taux de mortalité dans un pays ne pousse personne vers la tombe{/red} (exemple familier) : de même, la sélection ne serait pas une force qui pousse.

    **Le débat continue**, notamment sur les interprétations « causales » raisonnables de l'{violet}équation de Price{/violet} (Okasha 2006).

    ! Le désaccord ne porte pas sur les chiffres : les deux camps emploient les mêmes équations. Il porte sur ce qu'elles représentent, des causes ou des bilans.
  points:
  - id: sep-bio2-l3-p1
    sentence: "Le travail de philosophie de l'évolution sert parfois une thèse générale de philosophie des sciences, comme la conception ___ (ou par modèles) des théories."
    answer: "sémantique"
    alt: []
  - id: sep-bio2-l3-p2
    sentence: "*The Nature of Selection* (1984), étude classique qui marque le moment où beaucoup de philosophes découvrent la philosophie de la biologie, est d'Elliott ___."
    answer: "Sober"
    alt: []
  - id: sep-bio2-l3-p3
    sentence: "L'étude classique d'Elliott Sober parue en 1984, qui analyse la génétique des populations, s'intitule *The Nature of ___*."
    answer: "Selection"
    alt: []
  - id: sep-bio2-l3-p4
    sentence: "Sober analyse la structure de la génétique des populations par une analogie avec la mécanique ___ et la composition des forces."
    answer: "newtonienne"
    alt: []
  - id: sep-bio2-l3-p5
    sentence: "Pour Sober, le changement des fréquences géniques résulte de plusieurs « forces » : la sélection, la ___ génétique aléatoire, la mutation et la migration."
    answer: "dérive"
    alt: []
  - id: sep-bio2-l3-p6
    sentence: "Pour Sober, le changement des fréquences géniques résulte de plusieurs « forces » : la sélection, la dérive génétique aléatoire, la ___ et la migration."
    answer: "mutation"
    alt: []
  - id: sep-bio2-l3-p7
    sentence: "Pour Sober, le changement des fréquences géniques résulte de plusieurs « forces » : la sélection, la dérive génétique aléatoire, la mutation et la ___."
    answer: "migration"
    alt: []
  - id: sep-bio2-l3-p8
