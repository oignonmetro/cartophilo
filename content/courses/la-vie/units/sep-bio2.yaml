# Cours sur la philosophie de la biologie (voir content/philosophie.md), tiré
# de l'article « Philosophy of Biology », Stanford Encyclopedia of Philosophy :
# sections 3 (« Philosophy of Life ») et 4 (« Philosophy of Evolutionary
# Biology »). L'article nomme sans les définir les trois adaptationnismes de
# Godfrey-Smith et les écoinçons de Gould et Lewontin : leur explication vient
# de ces textes eux-mêmes. L'acronyme « LUCU » de l'article est une coquille
# pour LUCA.

id: sep-bio2
title: "La vie et l'évolution"
subtitle: "Définir, créer et faire naître la vie ; forces, dérive, adaptation, unités de sélection"
icon: bulb
color: teal
group: "La philosophie de la biologie (SEP)"
lessons:
- id: sep-bio2-l1
  title: "Qu'est-ce que la vie ? Trois réponses à l'échec des définitions"
  notes: |-
    **Une des questions fondamentales de la biologie est aussi la plus vieille.** Déjà {violet}Aristote{/violet} pense que les vivants manifestent le {violet}mouvement de soi{/violet}, avec d'autres traits essentiels (*De l'âme*, 412a-416b). On aimerait une liste de {violet}conditions nécessaires et suffisantes{/violet} pour être vivant.

    **Les listes échouent par contre-exemples.** Beaucoup de biologistes diraient : organisation, métabolisme, reproduction, croissance. Mais :
    - les {red}fourmis ouvrières{/red} ne se reproduisent pas, et sont vivantes : la reproduction n'est pas nécessaire ;
    - les {red}formations géologiques{/red} sont organisées, et ne sont pas vivantes : l'organisation n'est pas suffisante ;
    - les {red}cristaux{/red} croissent, et ne sont pas vivants : la croissance non plus.

    **Trois réponses à cet échec.**
    - **Renoncer à la forme de la définition** : la vie ne se définit pas par des conditions nécessaires et suffisantes, mais par des {violet}exemplaires, des prototypes ou des faisceaux de propriétés{/violet} (Malaterre et Chartier 2019).
    - **Le {violet}scepticisme définitionnel{/violet}** (Machery, Cleland 2019) : il y a trop de définitions pour les réunir, et {red}__nous n'examinons qu'un seul cas, celui de notre planète__{/red}. Or on ne généralise pas sûrement à partir d'un seul exemple : peut-être ce que nous tenons pour essentiel n'est-il qu'un accident de la vie terrestre.
    - **Le {violet}pluralisme{/violet}** : il n'y a pas une seule définition correcte de la « vie », mais plusieurs définitions légitimes (Oliver et Perry 2006, Griesemer 2015, Mix 2015, Bich et Green 2017).

    ! Le sceptique ne dit pas que la vie n'existe pas : il doute que le projet de la **définir** soit, en l'état de nos connaissances, un bon projet.
  points:
  - id: sep-bio2-l1-p1
    sentence: "Pour Aristote (*De l'âme*, 412a-416b), les vivants manifestent le mouvement de ___, avec d'autres traits essentiels."
    answer: "soi"
    alt: []
  - id: sep-bio2-l1-p2
    sentence: "Contre la reproduction comme condition nécessaire de la vie : les fourmis ___ ne se reproduisent pas, et sont vivantes."
    answer: "ouvrières"
    alt: []
  - id: sep-bio2-l1-p3
    sentence: "Contre l'organisation comme condition suffisante de la vie : les formations ___ sont organisées, et ne sont pas vivantes."
    answer: "géologiques"
    alt: []
  - id: sep-bio2-l1-p4
    sentence: "Contre la croissance comme condition suffisante de la vie : les ___ croissent, et ne sont pas vivants."
    answer: "cristaux"
    alt: []
  - id: sep-bio2-l1-p5
    sentence: "Première réponse à l'échec des conditions nécessaires et suffisantes : définir la vie par des exemplaires, des prototypes ou des ___ de propriétés."
    answer: "faisceaux"
    alt: []
  - id: sep-bio2-l1-p6
