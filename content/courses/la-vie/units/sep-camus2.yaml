- id: sep-camus2-l3
  title: "Les limites de la raison : ni suicide ni espoir"
  notes: |-
    **Des affirmations catégoriques.** Malgré son intention de ne pas argumenter, Camus conclut ce « raisonnement absurde » par des affirmations adressées à l'intelligence, sur la frustration inévitable du désir humain de connaître le monde et d'y être chez soi. {teal}« Il faut désespérer d'en reconstruire jamais la surface familière et tranquille qui nous donnerait la paix du cœur. »{/teal} {teal}« Ce monde en lui-même n'est pas raisonnable, c'est tout ce qu'on en peut dire. »{/teal} Nos efforts de connaître sont mus par une {violet}nostalgie d'unité{/violet}, et il y a un {teal}« décalage constant entre ce que nous imaginons savoir et ce que nous savons réellement »{/teal}. Ses prémisses reviennent sans cesse : {red}le monde est inconnaissable, et la vie sans sens{/red}.

    **Pas un irrationaliste.** Avi **Sagi** (2002) suggère que Camus ne parle pas en irrationaliste (c'est ainsi qu'il juge les existentialistes), mais comme quelqu'un qui cherche à {green}comprendre rationnellement les limites de la raison{/green}. Le problème est qu'en exigeant sens, ordre et unité, nous voulons dépasser ces limites, et poursuivons l'impossible.

    **Deux réponses évidentes à cette frustration** :
    - le {red}suicide{/red} ;
    - l'{red}espoir{/red} : celui, religieux, d'une autre vie, décrit dans *Noces* ; ou celui, examiné dans *L'Homme révolté*, de qui vit pour une grande cause qui le dépasse : {teal}« espoir d'une autre vie qu'il faut "mériter", ou tricherie de ceux qui vivent non pour la vie elle-même, mais pour quelque grande idée qui la dépasse, la sublime, lui donne un sens et la trahit »{/teal}.

    **La réponse de Camus.** {green}__Vivre sans échappatoire et avec intégrité, dans la révolte et le défi, en maintenant la tension propre à la vie humaine.__{/green} Puisque la mort est {teal}« l'absurdité la plus évidente »{/teal}, il faut {teal}« mourir irréconcilié et non pas de plein gré »{/teal} : une vie sans consolation, faite de **lucidité** et d'une conscience aiguë de sa mortalité et de ses limites, en révolte contre elles.
  points:
