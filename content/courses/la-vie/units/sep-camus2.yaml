- id: sep-camus2-l4
  title: "Contre les existentialistes : le saut"
  notes: |-
    **Un air de Nietzsche.** Le ton, les idées et le style de Camus rappellent **Nietzsche** : « Dieu est mort » est leur point de départ commun, comme la volonté d'affronter les vérités déplaisantes. Mais Camus écrit contre le courant dont Nietzsche passe pour le précurseur, et dont il est lui-même le plus proche : l'**existentialisme**. *Le Mythe* vise explicitement **Chestov, Kierkegaard, Jaspers, Heidegger**, et la phénoménologie de **Husserl**.

    **Même point de départ, autre issue.** Camus partage leur constat de l'absurdité de la condition humaine, mais rejette leur {red}fuite finale et leur irrationalité{/red} : {teal}« ils divinisent ce qui les écrase et trouvent une raison d'espérer dans ce qui les démunit. Cet espoir forcé est chez tous d'essence religieuse. »{/teal} Chacun trahit son intuition première en en appelant à la **transcendance**. Kierkegaard, par exemple, sent fortement l'absurde ; mais au lieu de le respecter comme le mal humain inévitable, il cherche à en guérir en en faisant un attribut de Dieu, qu'il embrasse.

    **Une critique immanente.** Camus ne réfute pas : il partage avec la phénoménologie l'affirmation {teal}« qu'il n'est point de vérité, mais seulement des vérités »{/teal}. Il montre que chaque philosophie existentialiste contredit son propre point de départ : l'esprit, {teal}« parti d'une philosophie de la non-signification du monde, […] finit par lui trouver un sens et une profondeur »{/teal}. Face à eux : {green}__« L'absurde, c'est la raison lucide qui constate ses limites. »__{/green}

    **Husserl.** Camus loue, avec Sartre, l'**intentionnalité** du premier Husserl, qui suit l'esprit absurde par {teal}« cette apparente modestie de la pensée qui se borne à décrire ce qu'elle se refuse à expliquer »{/teal} ; mais il juge la recherche ultérieure d'essences extratemporelles, dans les *Idées*, un **saut quasi religieux**.

    **Sartre.** Pour Sartre, l'absurde devient la **contingence** de *L'Être et le Néant* : la contingence universelle de l'être qui est sans être le fondement de son être, d'où le projet vain de fonder l'être, la {teal}« passion inutile »{/teal} de devenir Dieu. {pink}Pour Sartre, l'absurde est une propriété ontologique de l'existence{/pink}, qui ne limite pas sa compréhension ; {green}pour Camus, il est un trait essentiel de notre rapport au monde{/green} : un divorce indépassable entre la conscience, avec son {teal}« désir éperdu de clarté »{/teal}, et le {teal}« silence déraisonnable du monde »{/teal}.

    | Auteur | L'absurde est | Ce qu'il en fait |
    | Sartre | une propriété de l'être | la contingence, comprise |
    | Camus | un rapport homme-monde | une limite à maintenir |
    | Kierkegaard | un attribut de Dieu | un saut dans la foi |
