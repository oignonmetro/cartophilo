- id: sep-camus2-l2
  title: "L'absurde vécu : les décors s'écroulent"
  notes: |-
    **Montrer plutôt que démontrer.** Pour atteindre le fond sans argumenter, Camus décrit, énumère, illustre. Comme il le dira dans *L'Homme révolté*, la sensibilité absurde n'est {teal}« rien d'autre qu'un point de départ, une critique vécue, l'équivalent, sur le plan de l'existence, du doute systématique »{/teal}. Le *Mythe* décrit le sentiment de l'absurdité, qui {teal}« au détour de n'importe quelle rue peut frapper à la face de n'importe quel homme »{/teal} et, tel quel, {teal}« est insaisissable »{/teal}, par des thèmes qui {teal}« courent à travers toutes les littératures et toutes les philosophies »{/teal}, avec des images, des métaphores, des anecdotes tirées de l'expérience commune.

    **Après *La Nausée*.** Camus fait écho, sans le nommer, au roman de **Sartre**, où Antoine **Roquentin** découvre l'absurde. Dans sa recension de 1938, il jugeait que les théories et les images du roman ne s'équilibraient pas : le passage de l'une à l'autre lui paraissait trop rapide, trop peu motivé, pour faire œuvre d'art ; mais il louait la description de l'angoisse et de la nausée qui surgissent quand s'effondrent les structures ordinaires de l'existence.

    **La version de Camus.** {teal}« Il arrive que les décors s'écroulent. Lever, tramway, quatre heures de bureau ou d'usine, repas, tramway, quatre heures de travail, repas, sommeil et lundi mardi mercredi jeudi vendredi et samedi sur le même rythme… »{/teal} À mesure que cela continue, {coral}on prend lentement conscience, et l'on sent l'absurde{/coral}.

    ! La lassitude de la routine n'est pas l'absurde lui-même : elle en est l'éveil, le moment où la question du sens surgit.
