- id: sep-camus2-l1
  title: "Le suicide, seule question sérieuse"
  notes: |-
    **Le cycle de l'absurde.** Après *Noces*, Camus prépare un triptyque : un roman, *L'Étranger* (paru en juin **1942**) ; un essai, *Le Mythe de Sisyphe* (octobre **1942**) ; une pièce, *Caligula* (deux ans plus tard).

    **La question fondamentale.** {teal}« Il n'y a qu'un problème philosophique vraiment sérieux : c'est le suicide. Juger que la vie vaut ou ne vaut pas la peine d'être vécue, c'est répondre à la question fondamentale de la philosophie. Le reste, si le monde a trois dimensions, si l'esprit a neuf ou douze catégories, vient ensuite. »{/teal} On objectera que le suicide est un **acte**, non une question ; qu'une question philosophique serait plutôt « à quelles conditions le suicide est-il justifié ? », ou « que veut dire demander si la vie vaut d'être vécue ? », comme le fait William **James** dans *La Volonté de croire*. Mais pour Camus, {green}__le premier résultat de la philosophie est l'action, non la compréhension__{/green} : la question est de savoir s'il faut vivre, et comment.

    **Trois absurdités.** Le suicide répond à une réalité : la vie est absurde. Il est absurde de chercher sans cesse un sens à la vie quand il n'y en a pas ; absurde d'espérer survivre à une mort qui nous anéantit ; absurde aussi de vouloir connaître et expliquer le monde, la connaissance rationnelle étant vaine. {teal}« Cette raison universelle, pratique ou morale, ce déterminisme, ces catégories qui expliquent tout, ont de quoi faire rire l'homme honnête. »{/teal}

    **Une sensibilité absurde, non une philosophie.** Camus parle d'une {violet}« sensibilité absurde »{/violet}, d'un {teal}« mal de l'esprit »{/teal} répandu dans le siècle, **antérieur** à la philosophie. Il ne démontre pas l'absurdité de la vie ; ce qui l'intéresse, {teal}« ce ne sont pas tant les découvertes absurdes. Ce sont leurs conséquences »{/teal}. Il le constate : {teal}« beaucoup de gens meurent parce qu'ils estiment que la vie ne vaut pas la peine d'être vécue »{/teal}. La vraie question est : {teal}« L'absurde commande-t-il la mort ? »{/teal} Le livre cherche moins à argumenter qu'à **montrer** une façon de vivre qui rende la vie digne d'être vécue, quoique dénuée de sens.
