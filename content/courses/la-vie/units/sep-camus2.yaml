- id: sep-camus2-l6
  title: "Du scepticisme à des valeurs"
  notes: |-
    **Comparé à Pyrrhon.** Comme **Pyrrhon**, Camus résout sa question existentielle, éviter le désespoir, en acceptant notre mortalité et notre ignorance ultime. Mais deux différences décisives :
    - {red}on ne peut jamais renoncer au désir de connaître{/red} ;
    - le savoir {green}avive nos élans vitaux{/green} : déjà présente dans *Noces*, l'idée lie ici la conscience au bonheur.

    Le bonheur camusien unit la vie intense et sensible dans le présent, et la conscience tragique, lucide et défiante de Sisyphe : son sens des limites, son amertume, sa persévérance, son refus de toute consolation.

    **Aristote et Nietzsche.** Sagi rapproche Camus d'**Aristote**, en tant qu'il prône la pleine réalisation des capacités humaines. Il est proche aussi de **Nietzsche**, qui appelait à {teal}« dire oui à la vie »{/teal}, en l'embrassant {teal}« jusque dans ses problèmes les plus étranges et les plus durs »{/teal} : être pleinement vivant, c'est être aussi conscient du négatif que du positif.

    **Le tour de passe-passe.** Comment Camus passe-t-il du **scepticisme** (sur la vérité) et du **nihilisme** (sur le sens de la vie) à une manière de vivre jugée **meilleure** que d'autres ? {red}__Comment justifie-t-il des valeurs ? La contradiction révèle un tour de passe-passe : le philosophe cède la place à l'artiste.__{/red} C'est en artiste, par l'image de Sisyphe tendu, pleinement vivant et heureux, que Camus plaide pour l'acceptation du tragique, la conscience de l'absurde et une vie sensible.
  points:
