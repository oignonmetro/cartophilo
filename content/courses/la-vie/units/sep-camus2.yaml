- id: sep-camus2-l5
  title: "Il faut imaginer Sisyphe heureux"
  notes: |-
    **Quitter le terrain de la philosophie.** Pour rester fidèle au raisonnement absurde et ne pas céder à l'{teal}« esprit de nostalgie »{/teal}, le *Mythe* passe par des figures : **Don Juan**, **Kirilov** (*Les Possédés* de Dostoïevski), le théâtre, la création littéraire. Puis l'histoire de **Sisyphe**, qui incarne pleinement {teal}« le travail inutile et sans espoir »{/teal} : {teal}« Son mépris des dieux, sa haine de la mort et sa passion pour la vie, lui ont valu ce supplice indicible où tout l'être s'emploie à ne rien achever. »{/teal}

    **Vivre sans résignation.** Il incarne la révolte, qui {teal}« n'est que l'assurance d'un destin écrasant, moins la résignation qui devrait l'accompagner »{/teal}. Comme lui, nous ne pouvons cesser de chercher à comprendre ce qui dépasse notre intelligence, ni de vouloir vivre sans mourir : {coral}nous sommes notre destin, et notre frustration est notre vie même{/coral}.

    **L'heure de la conscience.** Quand le rocher retombe, Sisyphe redescend : {teal}« Cette heure qui est comme une respiration et qui revient aussi sûrement que son malheur, cette heure est celle de la conscience. À chacun de ces instants, où il quitte les sommets et s'enfonce peu à peu vers les tanières des dieux, il est supérieur à son destin. Il est plus fort que son rocher. »{/teal} Pourquoi « supérieur », « plus fort », sans espoir de réussir ? Parce que {green}__la conscience fait le tragique, et le tragique fait la victoire__{/green} : {teal}« Si ce mythe est tragique, c'est que son héros est conscient. »{/teal} {teal}« La clairvoyance qui devait faire son tourment consomme du même coup sa victoire. »{/teal} {teal}« Sisyphe, prolétaire des dieux, impuissant et révolté, connaît toute l'étendue de sa misérable condition : c'est à elle qu'il pense pendant sa descente. »{/teal}

    **La réponse au suicide.** Pleine conscience, refus des fausses solutions comme la religion, refus de se soumettre, et persévérance pleine de vie : {green}c'est ainsi qu'une vie sans sens ultime vaut d'être vécue{/green}. {teal}« Toute la joie silencieuse de Sisyphe est là. Son destin lui appartient. Son rocher est sa chose. »{/teal} En prenant conscience de sa condition, Sisyphe se l'approprie : il fait de ce qui lui est imposé **sa propre fin**. De même **Meursault**, dans la seconde partie de *L'Étranger*, devient conscient après le meurtre, et mourra triomphant, en homme absurde.

    **Le bonheur.** Refuser l'espoir de résoudre la tension, c'est aussi refuser le **désespoir**. {teal}« Le bonheur et l'absurde sont deux fils de la même terre. Ils sont inséparables. »{/teal} Non que l'absurde mène forcément au bonheur : reconnaître l'absurde, c'est accepter notre fragilité et nos limites, signes d'une vie pleinement vécue. {teal}« La lutte elle-même vers les sommets suffit à remplir un cœur d'homme. Il faut imaginer Sisyphe heureux. »{/teal}

    ! Sisyphe n'est pas heureux malgré sa conscience de l'absurde, mais par elle : le bonheur camusien est lucide, non résigné.
