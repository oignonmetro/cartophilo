- id: sep-vie3-l1
  title: "La vie artificielle, forte ou faible"
  notes: |-
    **La seconde moitié de l'article porte sur les usages du concept de vie.** Plusieurs définitions vues plus haut sont nées chez des chercheurs travaillant sur ces questions appliquées ; la première est la vie artificielle.

    **En principe, la vie peut être créée** : la plupart des scientifiques et des philosophes l'admettent. Mais ils ne s'accordent pas sur ce que cela demanderait.

    **La vie artificielle forte.** Pour les approches {violet}fonctionnelles{/violet}, recréer l'**organisation formelle** des organismes pourrait suffire : des robots complexes ({violet}*hardware*{/violet}) ou des programmes ({violet}*software*{/violet}) pourraient être vivants. C'est la {violet}vie artificielle forte{/violet} (*Strong A-Life*), qui a reçu les mêmes objections que l'intelligence artificielle forte avant elle. Ceux qui la rejettent tiennent que l'approche fonctionnelle manque l'essentiel de la biologie.
    - Les objections {pink}épistémiques{/pink} : nous n'avons pas le savoir biologique nécessaire pour recréer la vie dans un cadre numérique.
    - Les objections {pink}ontologiques{/pink}, les plus nombreuses : une représentation ne peut équivaloir à ce qu'elle représente, ou la vie exige une incarnation chimique. {red}Une objection ontologique déclare la vie artificielle forte impossible par décret.{/red}

    **La vie artificielle faible.** Elle ne présume pas l'équivalence ontologique de circuits et de cellules de structure semblable. Son but est plus modeste : {green}__mieux comprendre la vie telle que nous la connaissons en explorant les effets de divers paramètres dans des simulations, et placer la vie dans le cadre plus large de la biologie possible__{/green} (Langton). Exemple : dans le programme **Tierra** (Ray 1993), des logiciels se disputaient la puissance de calcul. Contre l'attente des chercheurs, un {coral}parasitisme logiciel{/coral} apparut, des programmes détournant le processus de reproduction d'autres programmes ; puis des mécanismes de police, et une {yellow}course aux armements entre profiteurs et logiciels qui cherchaient à les arrêter{/yellow}.

    **Les avantages de l'*in silico*.** Forte ou faible, la vie artificielle coûte moins cher que le travail sur des organismes réels, et offre ce que la biologie ordinaire n'offre pas : programmer d'autres paramètres à la place des lois de la nature, explorer des relations à travers des temps et des espaces immenses.

    ! Tierra ne prouve pas que des programmes vivent : il montre que des phénomènes typiques du vivant (parasitisme, course aux armements) surgissent de la seule sélection, quel que soit le support.
