- id: sep-vie3-l5
  title: "Les biosignatures, preuves négatives"
  notes: |-
    **Même les analyses les plus pessimistes suggèrent que la vie terrestre n'est pas unique** (Frank et Sullivan 2016) : de quoi justifier qu'on la cherche ailleurs. La recherche vise deux extrêmes : {pink}les sous-produits chimiques de la vie{/pink}, et {pink}les signaux technologiques d'une vie intelligente{/pink}. La biologie de populations extraterrestres serait passionnante, mais elle s'étudie mal à distance.

    **Les {violet}biosignatures{/violet}.** Ce sont des marqueurs de vie : des composés que la simple chimie produit rarement. Elles impliquent une {violet}conception matérielle de la vie{/violet}, biochimique, métabolique ou thermodynamique. On les cherche surtout sur Mars : expériences sur place, observations depuis la Terre ou l'orbite, étude des météorites. Les télescopes cherchent des **gaz hors d'équilibre thermodynamique** : du **méthane** est détecté sporadiquement sur Mars depuis 2004 ; le télescope spatial **James Webb** peut chercher des biomarqueurs gazeux dans l'atmosphère des exoplanètes.

    **Une biosignature est une preuve négative.** {red}__Il faut exclure toutes les possibilités abiotiques__{/red} : une molécule n'atteste la vie que si aucun processus non vivant ne peut la produire. {coral}On ne sera donc jamais sûr d'avoir envisagé toutes les réactions et circonstances qui permettent au non-vivant de produire des molécules typiques de la vie.{/coral}

    **Sur place, Viking et après.** En 1975, la NASA envoie sur Mars les sondes **Viking**, dont certaines expériences devaient détecter la vie. L'une, la {violet}*Labeled Release Experiment*{/violet}, le fit ; mais son résultat contredisait les autres expériences de bord, et fut jugé {red}non concluant{/red}. Le rover **Perseverance** peut évaluer certaines biosignatures, et des missions américaines, chinoises et japonaises cherchent des traces de vie passée ou présente sur Mars.

    **Mars et la Terre échangent des roches.** Des tonnes de roches passent chaque année d'une planète à l'autre : une vie martienne ne serait pas forcément une origine distincte. La météorite martienne **ALH84001**, où des chercheurs de la NASA virent en 1996 des structures semblables à des bactéries, a contribué à fonder l'astrobiologie.

    ! Détecter une biosignature ne prouve pas la vie : cela prouve seulement qu'on n'a pas encore trouvé de chimie qui l'explique.
