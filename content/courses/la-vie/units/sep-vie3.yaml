- id: sep-vie3-l2
  title: "La vie synthétique"
  notes: |-
    **La vie synthétique ({violet}*wetware*{/violet})** traite certaines questions de la vie artificielle avec un grain de réalisme plus fin : elle travaille avec de la vraie chimie, non des circuits.

    **Ses projets** : produire l'{coral}autoréplication{/coral} (Lincoln et Joyce 2009), des {coral}génomes minimaux{/coral} (Koonin 2000, Hutchinson et al. 2016), une évolution chimique, des machines vivantes synthétiques ou {violet}« xénobots »{/violet}, une {violet}« xénobiologie »{/violet} aux bases génétiques différentes. L'intelligence artificielle a catalysé ces recherches, au point que certains parlent d'un déluge imminent.

    **Ce qu'elle apprend.** Toute la biologie de synthèse n'étudie pas la vie telle qu'elle *pourrait être*, pas plus que toute programmation n'est vie artificielle. Mais ses outils éclairent : {green}__en explorant les possibles, on découvre des relations cachées, et l'on voit quels aspects de la vie sont plus ou moins plausibles qu'on ne le croyait__{/green}.

    | Approche | Support | But |
    | vie artificielle forte | *hardware*, *software* | créer du vivant |
    | vie artificielle faible | simulations | comprendre la vie possible |
    | vie synthétique | *wetware* | recréer en chimie réelle |
