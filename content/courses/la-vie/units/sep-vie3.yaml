- id: sep-vie3-l3
  title: "L'origine de la vie : de Pasteur à Miller"
  notes: |-
    **La nature de la vie est inséparable de son origine.** Anciens et modernes admettaient que la vie surgit souvent spontanément du non-vivant ; deux siècles d'expériences ont renversé cette idée. Les expériences de **Pasteur** sur l'{violet}abiogenèse{/violet} ont montré que {green}la vie ne naît pas, d'ordinaire, du non-vivant{/green}. Mais ce résultat a fait de l'origine de la vie {coral}une des plus grandes énigmes de la science{/coral} : si la vie ne vient que de la vie, d'où vient la première ?

    **Darwin en dit peu.** Sa seule spéculation est dans une lettre à son ami Joseph **Hooker** : il imagine la vie naissant dans {yellow}« quelque petite mare tiède »{/yellow}.

    **Le XXe siècle s'en empare.** Entre les deux guerres, Alexandre **Oparine** et J.B.S. **Haldane** proposent séparément des hypothèses sur l'origine de la vie. Dans les années 1950, l'étudiant Stanley **Miller** les met à l'épreuve et découvre {coral}des dizaines d'acides aminés{/coral} dans son mélange (1953). Le champ s'est depuis considérablement étendu.

    **La vie est apparue très tôt.** Nos plus anciennes archives fiables, il y a quelque {coral}3,5 milliards d'années{/coral}, contiennent des fossiles microbiens : des formes distinctes des procaryotes actuels, et des rapports isotopiques du carbone propres à la vie que nous connaissons. {green}__Dès que la Terre ne fut plus en fusion, elle fut pleine de vie.__{/green} Comment la vie a commencé, et pourquoi si vite, reste une des questions ouvertes les plus pressantes de la science.
  points:
  - id: sep-vie3-l3-p1
    sentence: "Les expériences de ___ sur l'abiogenèse ont montré que la vie ne naît pas, d'ordinaire, du non-vivant, renversant l'idée de génération spontanée."
    answer: "Pasteur"
    alt: []
  - id: sep-vie3-l3-p2
