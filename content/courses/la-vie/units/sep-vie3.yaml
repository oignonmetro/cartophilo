- id: sep-vie3-l4
  title: "Remonter ou construire : LUCA et la chimie prébiotique"
  notes: |-
    **L'origine de la vie a l'air d'une question, mais elle en est plusieurs.** On peut chercher comment la vie *aurait pu* naître, ou comment elle *est* née ; viser l'adéquation historique, l'explication naturelle, ou la ressemblance à la vie telle que nous la connaissons. Certaines étapes ont pu être {pink}fortuites{/pink}, d'autres {pink}contingentes{/pink}, d'autres encore {pink}la seule voie possible partout dans l'Univers{/pink}.

    **De bas en haut ({violet}*bottom-up*{/violet}).** On part de la chimie prébiotique et l'on cherche comment elle aurait pu résister aux contraintes pour former des entités semblables au vivant, capables d'évoluer. Le problème principal : {red}__la plupart des interactions énergétiquement favorables consommeraient les formes de proto-vie elles-mêmes__{/red}. On relâche alors des hypothèses : l'environnement a peut-être fourni les premières frontières, ou un matériel proto-génétique ; tout a pu se passer dans un solvant visqueux plutôt qu'une cellule, sur une surface (Wächtershäuser), ou avec des entités encapsulées plus tard (Eigen et Schuster). Mais {red}le fossé entre la chimie prébiotique et les formes de vie les plus simples reste immense{/red}.

    **De haut en bas ({violet}*top-down*{/violet}).** On part des taxons actuels et l'on remonte leur ascendance, en comparant la centaine de gènes partagés liés à la traduction biologique (Koonin 2011). Toute la vie partage un {violet}dernier ancêtre commun universel{/violet}, **LUCA** (*Last Universal Common Ancestor*). Il y a peut-être eu plusieurs origines de la vie, mais nous ne pouvons les distinguer d'une seule ; au moins une a conduit à LUCA, contrainte importante pour toute théorie.

    **LUCA n'est pas le premier vivant.** C'était une créature parmi une population plus large, qui a vécu {coral}longtemps après l'origine du premier organisme{/coral}. Restent ouvertes : était-il simple ou complexe ? avait-il une membrane semblable aux nôtres ? son génome était-il d'ADN ? où et quand vivait-il ?

    **Le fossé entre les deux approches est immense** : d'innombrables générations séparent la chimie prébiotique de LUCA. Nous ne résoudrons peut-être jamais l'origine de la vie, mais chaque pas rapproche de la compréhension de la trajectoire.

    ! Remonter jusqu'à LUCA ne remonte pas jusqu'à l'origine : LUCA est le dernier ancêtre commun des vivants actuels, non le premier vivant.
  points:
