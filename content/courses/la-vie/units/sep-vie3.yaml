- id: sep-vie3-l6
  title: "Les technosignatures : chercher l'intelligence"
  notes: |-
    **Chercher une vie intelligente frappe davantage l'imagination.** Dans les années 1890, Percival **Lowell** dessine des {yellow}canaux martiens{/yellow}, influencé par l'observation de chenaux apparents ; la science-fiction imagine aussitôt une civilisation mourante, tirant l'eau des dernières glaces des pôles (Wells 1898).

    **SETI.** L'intérêt pour les signaux radio venus de l'espace croît au XXe siècle, et s'accélère après **Spoutnik** (1957). Le programme {violet}SETI{/violet} n'est plus financé sur fonds publics depuis 1994, mais des donateurs et des chercheurs le poursuivent. Les obstacles sont immenses : l'espace est inimaginablement grand, les signaux faibles, les modes de communication interstellaire innombrables, et nos recherches n'en couvrent qu'une part insignifiante. On s'intéresse toujours aux {violet}technosignatures{/violet}.

    **Envoyer des messages : METI.** Plus controversé : depuis 1974, des dizaines de messages ont été envoyés dans l'espace, surtout par radio vers des étoiles prometteuses. C'est le **SETI actif**, ou {violet}METI{/violet} (*Messaging Extraterrestrial Intelligence*). La pratique continue parce qu'elle est peu coûteuse et facile ; mais beaucoup de philosophes, scientifiques et experts s'y opposent : {red}__elle risque de signaler notre présence à des forces peut-être hostiles, au nom de générations futures qui ne peuvent y consentir__{/red} (Smith 2020).
