- id: arvie3-l3
  title: "La génération et l'organisation des parties"
  notes: |-
    **La méconnaissance de la nature comme cause explique l'échec des prédécesseurs sur deux points : la génération, et l'organisation des parties.**

    **La génération : « un chemin vers une nature ».** Contre {sky}Empédocle{/sky} et les atomistes, Aristote refuse que la matière des quatre éléments s'organise d'elle-même, et que {red}la vie résulte d'une combinaison matérielle spontanée{/red}. Dans la génération, la nature est {teal}« un chemin vers une nature »{/teal} (*Physique*, II, 1) : {amber}tout ne produit pas n'importe quoi, quelque chose du géniteur se perpétue{/amber}. Une {violet}forme{/violet}, l'essence, est transmise du géniteur au rejeton, et elle existe en acte avant lui : {teal}« La genèse est en vue de la substance et non pas la substance en vue de la génération »{/teal} (*Parties des animaux*, I, 1). Ce n'est pas affaire de configuration matérielle, mais d'{violet}information{/violet} : {coral}l'intuition que retrouveront les découvreurs de l'ADN{/coral}, quand ils imagineront que la reproduction communique quelque chose de l'ordre de l'information ({sky}Delbrück{/sky}).

    **L'organisation des parties, selon une fin.** La matière du corps s'organise en niveaux qui s'articulent selon une fin :
    - les {violet}éléments{/violet} ;
    - les {violet}parties homéomères{/violet}, qui se divisent en parties identiques à elles-mêmes : {yellow}le sang, la chair, les os{/yellow} ;
    - les {violet}parties anhoméomères{/violet}, dont les subdivisions ne sont pas identiques au tout : {yellow}le visage, les pieds{/yellow}.

    Les éléments sont en vue des homéomères, qui sont en vue des anhoméomères. {red}L'erreur d'Empédocle ou de Démocrite{/red} est d'avoir cru qu'il suffisait de dire en quoi les parties sont faites, et comment elles sont mécaniquement agencées. Contre Empédocle, pour qui {red}l'assemblage se fait au hasard, les composés viables étant les seuls à survivre{/red} (*Physique*, II, 8), {green}c'est parce qu'un animal a telle nature qu'il a des jambes, des poumons, et que cela a un sens pour lui{/green}.

    **La téléologie explique jusqu'à l'adaptation.** {red}Ce n'est pas parce que le chameau a le palais dur qu'il peut manger des épineux{/red} ; {green}c'est parce qu'il vit dans un pays plein d'épineux, et pour pouvoir s'en nourrir, qu'il a le palais dur{/green} (*PA*, III, 14).
  points:
