- id: arvie3-l4
  title: "La nécessité hypothétique"
  notes: |-
    **Aristote modifie en profondeur le sens de la nécessité naturelle.** Il est, dit {sky}Lennox{/sky}, un {teal}« philosophe de la biologie »{/teal}, qui mesure ce que sa conception de la nature change aux concepts du naturaliste.
    - {red}La nécessité absolue{/red}, celle des présocratiques : est nécessaire ce qui ne peut être autrement du fait de sa nature, comme {yellow}le corps lourd qui tombe{/yellow}, sans exception aucune.
    - {green}La nécessité hypothétique ou conditionnelle{/green}, celle de l'organisme : {coral}une chose n'est nécessaire qu'à condition qu'une certaine fin doive être réalisée{/coral} (*Parties des animaux*, I, 1). Étant donné ce qu'est l'animal et les fonctions qu'il doit accomplir, certaines parties lui sont nécessaires.

    **Les quatre causes ramenées à deux** (*PA*, I, 1) : le {violet}« ce en vue de quoi »{/violet}, qui renvoie à la cause formelle et finale, et le {violet}« par nécessité »{/violet}, qui renvoie parfois à la cause efficiente, surtout à la matérielle. Une explication complète est donc double : {amber}pourquoi une chose existe, et comment elle le peut{/amber}. Ainsi des {yellow}dents{/yellow} : en vue de quoi elles ont des formes différentes (les incisives tranchantes pour couper, les molaires larges pour broyer), et quelles conditions matérielles rendent possible leur formation.

    **La matière a sa part.** Les anciens physiciens avaient raison : la matière peut être cause selon une nécessité mécanique. {teal}« Le nécessaire dans les êtres naturels c'est ce que l'on présente comme étant la matière et les mouvements de celle-ci »{/teal} (*Physique*, II, 9). Certains phénomènes sont même purement mécaniques, sans finalité : {yellow}la bile, qui est un résidu{/yellow}, {yellow}la couleur des yeux{/yellow}.

    **Mais ignorer la finalité, c'est donner une explication au mieux incomplète.** Pour reprendre un mot de Canguilhem, l'explication mécaniste du vivant est, pour Aristote, {teal}« à peine une connaissance biologique »{/teal}.
  points:
  - id: arvie3-l4-p1
    sentence: "Pour Lennox, Aristote n'est pas qu'un biologiste : il est aussi un « ___ **de la biologie** »."
    answer: "philosophe"
    alt: []
