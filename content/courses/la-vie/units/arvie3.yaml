- id: arvie3-l2
  title: "L'enquête, et trois réductions de la vie"
  notes: |-
    **Aristote reproche à ses prédécesseurs de raisonner sur la nature de manière logique et abstraite**, au lieu de partir de l'{violet}expérience{/violet} ({blue}*empeiria*{/blue}), qui fournit les principes propres du raisonnement scientifique. Le défaut d'investigation naturelle ({blue}*anepiskepsia*{/blue}) explique leur vue partielle : {sky}Démocrite{/sky} veut {red}« proposer une cause universelle »{/red} sans avoir examiné tous les faits (*GA*, V, 8).

    **Non une confrontation directe avec la nature, mais une enquête méthodique.** Le naturaliste compile les observations et l'expérience ordinaire des hommes, consigne les témoignages, les commente, les accepte le plus souvent. C'est l'{violet}« histoire »{/violet}, littéralement {amber}« l'enquête »{/amber} : dans l'*Histoire des animaux*, Aristote établit les faits ({blue}*to hoti*{/blue}), différences et attributs, car {coral}c'est à cette condition que les principes de la démonstration deviennent évidents{/coral} (*HA*, I, 6).

    **Trois réductions de la vie, que dénonce Aristote**, comme plus tard {sky}Canguilhem{/sky} :

    | Réduction | Ce qu'Aristote y oppose |
    | aux phénomènes les plus ordonnés | une science non mathématique du vivant |
    | à certains vivants jugés dignes | l'étude de toutes les formes de vie |
    | aux principes matériels | la nature comme forme et fin |

    - {red}La réduction de la philosophie naturelle à l'étude des phénomènes les plus ordonnés{/red}, ceux de l'astronomie, qui reçoivent une explication mathématique. {green}Une science du vivant n'est pas moins scientifique pour n'être pas exacte{/green} sur le modèle des mathématiques.
    - {red}La réduction de la zoologie à certains vivants privilégiés{/red}. Aristote refuse un {violet}anthropocentrisme{/violet} excessif, et n'exclut ni les parties jugées peu nobles, ni les singularités que sont {yellow}les monstres{/yellow}.
    - {red}La réduction des principes premiers à des principes matériels{/red} : {teal}« {/teal}Les anciens physiologues [...] ne voyaient pas la pluralité des causes, mais uniquement {teal}la cause matérielle et la cause motrice{/teal} lesquelles étaient indistinctes. {teal}Ils ne sont pas attentifs à la cause formelle et la cause finale »{/teal} (*GA*, V, 1). En ignorant que la nature est forme et fin, c'est-à-dire âme dans le vivant, {coral}les atomistes se privent des moyens de distinguer le vivant de l'inerte{/coral}, et d'expliquer qu'un être soit à l'origine de son propre mouvement.
  points:
