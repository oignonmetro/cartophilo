- id: arvie3-l1
  title: "Plaidoyer pour une science du vivant"
  notes: |-
    **Aristote est le premier à défendre explicitement la dignité d'une science du vivant**, à une époque où les naturalistes la négligent pour l'astronomie. Contre ceux qui, comme {sky}Platon{/sky}, réservent la science aux réalités immuables, seules objets d'une connaissance exacte, {green}il réaffirme la légitimité de la partie de la physique qui porte sur les êtres soumis au changement{/green} : cette étude est possible, nécessaire, et même {coral}plus scientifique, vu l'état plus avancé des connaissances{/coral} (*Parties des animaux*, I, 5).

    **Tout dans la nature mérite l'attention** : {teal}« dans tous les êtres naturels il y a quelque chose de merveilleux »{/teal} (*PA*, I, 5). Aristote pointe l'incohérence de ceux qui {red}répugnent à étudier les animaux pour ne s'occuper que de l'homme{/red}, sans voir que l'homme est un être naturel dont le corps n'est pas plus agréable à voir. D'où {amber}un refus d'une science qui ignorerait les formes de vie non humaines au nom de la supériorité humaine{/amber}, et une leçon d'{violet}humilité{/violet} : ramenés à notre corps, qui nous dégoûte parfois, nous voyons que notre supposée différence s'annule. {coral}Nous sommes mortels, et ce corps nous le rappelle.{/coral}

    **L'homme reste pourtant un point de référence**, parce qu'il est le plus connu de nous et incarne une perfection naturelle. La marche latérale du {yellow}crabe{/yellow} est dite {teal}« contre nature »{/teal} parce qu'elle n'est pas orientée vers l'avant comme chez l'homme bipède (*Marche des animaux*). Mais Aristote inverse aussi la perspective, quand il examine les parties de l'homme à partir de celles des animaux, plus familières (*Histoire des animaux*, I, 6).
