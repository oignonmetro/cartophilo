- id: arvie3-l7
  title: "Une nature finalisée, contre la vie créatrice"
  notes: |-
    **Aristote fut un pionnier, mais aussi un obstacle épistémologique pour la biologie moderne.** En comprenant le vivant comme {red}une substance douée d'une forme spécifique immuable{/red}, il interdit de concevoir {green}la vie comme une activité créatrice en perpétuelle évolution{/green}. La nature travaille à conserver un type qui a sa perfection propre : {coral}une nouveauté singulière n'y peut être qu'une anomalie{/coral}, jamais une amélioration de l'espèce. L'évolutionnisme devra rompre avec cette nature qui tend toujours au meilleur.

    **Le monstre selon Canguilhem consomme cette rupture.** Dans une nature qui n'est plus un cosmos où tout a sa place, le monstre n'est plus {red}le « vivant de valeur négative »{/red}, l'être en défaut, puisque {teal}« il ne peut rien manquer à un vivant, si l'on veut bien admettre qu'il y a mille et une façons de vivre »{/teal} ({sky}Canguilhem{/sky}, *La connaissance de la vie*).

    | Le monstre | Ce qu'il est |
    | chez Aristote | un échec de la finalité naturelle |
    | chez Canguilhem | une aventure, une tentative |

    **La machine, modèle trop finalisé.** Dans « Machine et organisme », Canguilhem critique les mécanistes qui conçoivent l'organisme comme une machine, sans voir qu'elle est trop finalisée pour en être le modèle. Aristote, malgré son finalisme, {red}n'échappe pas à la critique{/red} : il conçoit le vivant comme {red}un tout déjà organisé, où chaque pièce a une seule fonction, toujours la même{/red}. Or, pour Canguilhem, {green}l'organisme est capable d'un fonctionnement labile{/green} : en bonne santé, il expérimente des régimes de fonctionnement alternatifs, pour entretenir {amber}sa marge de liberté{/amber}.

    **Aristote, homme de son temps.** Dans sa nature, tout se déploie immuablement, {red}point de lutte entre vivants qui obligerait à inventer de nouvelles formes{/red}. La finalité de la vie est {violet}l'accomplissement{/violet} de ses fonctions : réaliser pleinement ce que la nature nous dispose à être. Pour le vivant non humain, vivre, c'est assurer sa survie et celle de l'espèce ; {coral}pour l'homme, c'est aussi bien vivre{/coral}, toujours dans les limites fixées par la nature.
