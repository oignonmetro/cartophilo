- id: arvie3-l5
  title: "Le monstre, une erreur de la nature ?"
  notes: |-
    **Comment une nature qui ne fait rien en vain et produit toujours le meilleur peut-elle produire des monstres ?** Aristote ne songe pas seulement aux {yellow}chimères{/yellow} de la mythologie, croisements improbables qui produisent des vivants atypiques (sans « type »), mais au monstre ordinaire : {yellow}l'être porteur d'une malformation ou d'un handicap{/yellow} qui le distingue de ses congénères.

    **Une définition très large : un écart au chemin de la génération.** {teal}« Celui qui ne ressemble pas à ses parents est déjà, d'une certaine façon, un monstre{/teal}, car, dans ce cas, {teal}la nature s'est en quelque manière écartée du type générique »{/teal} (*Génération des animaux*, IV, 3).

    **Le mécanisme : une forme qui ne maîtrise pas la matière.** Toute génération tend à reproduire la forme du géniteur, un homme engendre un homme ; mais la transmission s'effectue dans une matière {red}dont la résistance et l'indétermination peuvent contrarier l'action formatrice{/red}. Le monstre naît quand {coral}le mouvement venu du mâle ne parvient pas à informer, c'est-à-dire à maîtriser et organiser, la matière fournie par la femelle{/coral}. Le {violet}monstre{/violet} ({blue}*teras*{/blue}) est {amber}le résultat d'un processus finalisé contrarié{/amber}.

    **Des degrés de monstruosité.** {teal}« le tout premier écart est la naissance d'une femelle au lieu d'un mâle »{/teal}, aussitôt nuancé : {teal}« mais ce premier écart était nécessaire selon la nature »{/teal} (*GA*, IV, 3). Puis ressembler plus à la lignée qu'aux parents, plus à un homme qu'à la lignée, enfin plus à un animal qu'à un homme.

    **Contre nature, mais pas absolument.** {teal}« Les monstres sont dans la nature parce qu'ils sont les effets d'un hasard spontané »{/teal} ({sky}Morel{/sky}). Ce {violet}hasard spontané{/violet} ({blue}*automaton*{/blue}) n'est pas l'absence de cause, mais {amber}la production naturelle d'un résultat qui n'était pas la fin du processus{/amber}. Le monstre peut être dit {violet}« contre nature »{/violet} ({blue}*para phusin*{/blue}), parce que la cause matérielle a empêché la forme et la fin de s'accomplir : {teal}« {/teal}Le monstre appartient à la classe des phénomènes contraires à la nature, {teal}non pas à la nature prise absolument mais à la nature considérée dans son cours ordinaire »{/teal} (*GA*, IV, 4). {coral}Son existence ne réfute donc pas la téléologie : elle en révèle le caractère conditionnel, non providentialiste{/coral}. Dans le monde sublunaire, la nature réalise le meilleur possible, dans la mesure où rien ne l'en empêche.
  points:
