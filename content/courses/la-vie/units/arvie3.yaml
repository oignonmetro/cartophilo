- id: arvie3-l6
  title: "Aristote biologiste ?"
  notes: |-
    **Le « tournant biologique » des études aristotéliciennes** (années 1960-1980), avec {sky}Allan Gotthelf{/sky}, {sky}James Lennox{/sky} et {sky}Pierre Pellegrin{/sky}, reconnaît à Aristote un rôle majeur dans l'étude du vivant.
    - {sky}Lennox{/sky} : {teal}« {/teal}la délimitation par Aristote d'{teal}une branche spéciale dans les sciences théoriques dévolue à l'étude systématique des animaux{/teal} » constitue {teal}« un événement fondateur »{/teal} de l'histoire de la biologie.
    - {sky}Pellegrin{/sky} : {teal}« Aristote, et lui seul, pour plus de vingt-deux siècles, a été un véritable biologiste »{/teal}. Il voit une homologie entre Aristote et {sky}Cuvier{/sky}, qui cherchent tous deux des analogies fonctionnelles sous la diversité apparente des vivants.

    **Aristote classe, et classe très bien** (Pellegrin, *La classification des animaux chez Aristote*) : ses classifications ont une valeur systématique. La distinction des {violet}animaux sanguins et non sanguins{/violet} reste une grande articulation des classifications modernes : les sanguins sont pour lui les plus parfaits et les plus chauds ; les autres ont, à la place du sang, un liquide qui n'est pas rouge, un {yellow}sérum{/yellow}, sang imparfait. {coral}Elle recouvre à peu près notre distinction des vertébrés et des invertébrés.{/coral}

    **Mais il ne classe pas pour classer.** Ses « enquêtes sur les animaux » ont {amber}une fonction de monstration{/amber}, analogue à celle des schémas anatomiques : elles réalisent {teal}« par le biais du discours »{/teal} ce que les dissections et schémas réalisent {teal}« au moyen de la vue »{/teal} (*PA*, IV, 5). L'*Histoire des animaux*, zoologie empirique, montre ce que les traités démonstratifs (*Parties*, *Marche des animaux*) expliqueront par les premiers principes.

    **Pas de cases fixes.** Aristote classe selon plusieurs points de vue, {teal}« leur mode de vie, leurs actes, leurs mœurs, leurs parties »{/teal} (*HA*, I, 1), ou selon la reproduction ({yellow}vivipares, ovipares, ovovivipares{/yellow}), sans qu'aucun soit privilégié ; genre, espèce, différence n'y désignent pas un niveau fixe. {red}Les systématiciens réduiront le vivant à une collection de caractères{/red} ; {green}Aristote cherche l'essence du vivant{/green}. La taxinomie a dû rompre avec cette visée {violet}« ousiologique »{/violet} (Pellegrin).
