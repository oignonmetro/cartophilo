- id: sep-vie1-l6
  title: "Le vitalisme et la légende de Wöhler"
  notes: |-
    **Le {violet}vitalisme{/violet} est l'étiquette collective des réponses à Descartes** pendant trois siècles. C'est une position {coral}hétérogène{/coral} : son seul trait commun est {green}__le doute envers une conception mécaniste de la vie__{/green}. Les vitalistes ont fait reposer la vie sur des causes immatérielles, un arrangement particulier de la matière, un fluide vital spécial, une fin particulière, ou même des forces mentales.

    **La légende de Wöhler.** On apprend parfois que la synthèse de l'**urée** à partir de cyanate d'ammonium par Friedrich **Wöhler** aurait sonné le glas du vitalisme. Le raisonnement prêté à l'histoire : {pink}si des composés biologiques s'obtiennent par simple chimie, alors la biologie n'est que chimie{/pink}. Mais c'est une {red}version caricaturale{/red} : l'histoire a rarement de tels tournants. Beaucoup de chimistes étaient déjà mécanistes, et des théories vitalistes se sont développées jusqu'au XXe siècle, chez **Bergson** et **Driesch**.

    **La disparition du clivage rend la tâche plus difficile.** Au XXe siècle, le clivage du mécanisme et du vitalisme se dissipe. Mais {red}__sans une compréhension vitaliste, distinguer le vivant du non-vivant devient plus difficile__{/red} : on n'a plus de principe propre à invoquer, et il faut trouver la différence dans l'organisation de la matière ordinaire. D'où, depuis un siècle et demi, des centaines de tentatives de définir la vie, souvent stimulées par la vie artificielle, la biologie de synthèse, l'étude des origines de la vie et l'astrobiologie, qui défont les groupements traditionnels de propriétés.

    ! Le vitalisme n'est pas une doctrine unique : on ne peut le réfuter d'un seul coup, ni par une seule expérience.
