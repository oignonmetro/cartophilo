- id: sep-vie1-l2
  title: "La définition théorique et ses contre-exemples"
  notes: |-
    **Les philosophes cherchent d'ordinaire une {violet}définition théorique{/violet}** (dite aussi réelle, idéale ou philosophique). Complète, elle donne des {violet}conditions individuellement nécessaires et conjointement suffisantes{/violet} : tout ce qui les remplit tombe sous le concept, et rien d'autre. *Nécessaires* : chaque condition manque-t-elle, la chose n'est pas vivante. *Suffisantes ensemble* : toutes réunies, elle l'est forcément.

    **Une telle définition est fragile.** {red}__Un seul contre-exemple, même imaginé, suffit à la réfuter__{/red}, puisqu'elle prétend valoir sans exception. L'exemple classique est celui des {yellow}« célibataires » définis comme « hommes non mariés »{/yellow} : la définition paraît évidente, et pourtant des non-célibataires la remplissent, les chiens mâles, les petits garçons, les veufs.

    **Toute définition de la vie inclut du non-vivant ou exclut du vivant.**
    - La vie est {pink}organisée{/pink}, mais les {red}formations géologiques{/red} aussi.
    - La vie {pink}transforme de l'énergie{/pink}, mais le {red}feu{/red} aussi.
    - La vie {pink}évolue au moyen d'une biochimie complexe{/pink}, mais les {red}prions{/red} aussi.
    - La vie {pink}s'entretient elle-même{/pink}, mais pas les {red}parasites{/red}.
    - La vie est {pink}en déséquilibre thermodynamique{/pink}, mais bien d'autres choses le sont.

    Chaque critère pèche dans un sens ou dans l'autre : trop large (il laisse entrer le feu, les cristaux, les prions) ou trop étroit (il laisse dehors le parasite, qui vit pourtant).

    **Conclusion : la définition théorique est une norme trop rigide.** {coral}__Le monde réel est bien trop complexe pour que des critères en nombre limité tranchent tous les cas limites.__{/coral}

    ! Le contre-exemple n'a pas besoin d'exister : il suffit qu'il soit concevable, puisque la définition théorique prétend dire ce que la vie est en toute rigueur.
  points:
  - id: sep-vie1-l2-p1
    sentence: "Les philosophes cherchent d'ordinaire une définition ___ (dite aussi réelle, idéale ou philosophique), qui dit ce que la chose est en toute rigueur."
    answer: "théorique"
    alt: []
