- id: sep-vie1-l7
  title: "Les définitions contemporaines : classer des milliers de définitions"
  notes: |-
    **Il existe peut-être des milliers de définitions concurrentes.** Faute de pouvoir les recenser, on peut en considérer les grandes **catégories** : trois tentatives rigoureuses de ce siècle les classent.

    **Trois méthodes.** **Popa** (2004) et **Trifonov** (2011) ont reconstitué les catégories à partir de dizaines de définitions recueillies auprès de dizaines d'experts ; **Malaterre et Chartier** (2019) ont procédé par {violet}fouille de textes{/violet} sur **30 000 articles scientifiques** de biologie.

    | Classement | Méthode | Exemples de catégories |
    | Popa 2004 | définitions recueillies | mécaniste, holiste, génétique, cybernétique, vitaliste |
    | Trifonov 2011 | définitions recueillies | énergie, matière, système, évolution, reproduction |
    | Malaterre et Chartier 2019 | fouille de textes | métabolisme, structure, environnement, évolution, information |

    Les trois se recoupent en partie (le métabolisme et la matière, l'évolution, l'information et la génétique), mais chacun a ses catégories propres. Chez Popa, par exemple, la définition {violet}cybernétique{/violet} abstrait assez pour inclure la vie artificielle sur ordinateur, la définition {violet}minimaliste{/violet} use du moins d'information possible pour démarquer le vivant.

    **Un classement ouvre la conversation, il ne la ferme pas.** La plupart des définitions chevauchent ces catégories et laissent ambigu leur statut : théorique, opérationnel ou autre. Classer, c'est choisir, et des gens raisonnables peuvent en disputer.

    ! Que des catégories se recoupent d'un classement à l'autre ne montre pas un accord sur ce qu'est la vie : seulement sur les familles de réponses.
