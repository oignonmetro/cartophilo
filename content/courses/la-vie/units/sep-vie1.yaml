- id: sep-vie1-l4
  title: "Au-delà des définitions : prototypes, exemplaires, théories"
  notes: |-
    **Le XXe siècle s'éloigne des définitions** vers d'autres conceptions des concepts. Les trois théories les plus répandues (Machery 2009) : les **prototypes**, les **exemplaires** et les **théories**.

    **Prototypes et exemplaires : des concepts par ressemblance.**
    - Un {violet}prototype{/violet} rassemble des traits abstraits partagés par **la plupart** des membres d'une catégorie (Rosch). Les définitions de la vie des manuels de biologie, listes de caractères dont aucun n'est exigé de tous, en sont peut-être ; de même les {violet}espèces naturelles à faisceau de propriétés{/violet} (Boyd), prisées en philosophie de la biologie.
    - Un {violet}exemplaire{/violet} se construit autour de la ressemblance avec **un cas individuel particulier**.

    Tous deux reposent sur la ressemblance à un cas paradigmatique : {pink}un idéal imaginé pour le prototype, un objet réel pour l'exemplaire{/pink}. Mais {red}__pour qu'un concept par ressemblance serve en science, il faut dire quelles ressemblances comptent, combien, et pourquoi__{/red} : un virus ressemble à une cellule par son génome, à un cristal par sa passivité.

    **Les concepts-théories, plus nébuleux.** Un {violet}concept-théorie{/violet} repose sur une **explication** de ce pourquoi les membres d'une catégorie partagent certaines propriétés : il est aussi divers que les théories scientifiques. Selon la théorie de la vie retenue, les cas limites (virus, prions, protocellules) seront inclus ou non.

    **Bilan.** Chaque genre de définition a ses avantages, ses défauts et ses critères de réussite. On a encore peu travaillé la vie comme concept (paradigme, exemplaire) plutôt que comme définition, mais cela change (Mariscal et Doolittle 2020).
  points:
