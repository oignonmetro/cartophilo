- id: sep-vie1-l8
  title: "Aucun consensus en vue, et le pluralisme"
  notes: |-
    **La leçon des définitions actuelles : aucun consensus ne s'annonce.** Ces classements résument des tentatives de définir une catégorie sur laquelle on ne s'accorde que vaguement : {red}__beaucoup de scientifiques ne s'accordent même pas sur les phénomènes qu'une définition de la vie devrait unifier__{/red}. Certaines théories incluraient les prions, les virus, et des entités seulement supposées à l'origine de la vie ; d'autres les excluent. Certains admettent les **organismes numériques** comme vivants, d'autres non.

    **On ne peut pas pour autant ignorer la question.** L'{violet}équivoque conceptuelle{/violet} coûte cher à la recherche, en temps et en argent (Trombley et Cottenie 2019) : deux équipes qui croient chercher la même chose sous le même mot ne la cherchent pas.

    **Une issue rarement prise : le pluralisme.** Vu cette diversité, on pourrait adopter un {violet}pluralisme définitionnel{/violet} : {green}il y a plusieurs façons d'être vivant{/green}. Curieusement, cette position est rare dans la littérature.

    ! Le pluralisme n'est pas le relativisme : il ne dit pas que tout se vaut, mais que plusieurs concepts précis de la vie peuvent être légitimes ensemble, chacun pour un usage.
  points:
  - id: sep-vie1-l8-p1
    sentence: "Ce que montrent les définitions actuelles de la vie : aucun ___ ne s'annonce."
    answer: "consensus"
    alt: []
  - id: sep-vie1-l8-p2
    sentence: "Beaucoup de scientifiques ne s'accordent même pas sur les ___ qu'une définition de la vie devrait unifier : certains incluent prions et virus, d'autres les excluent."
    answer: "phénomènes"
    alt: []
  - id: sep-vie1-l8-p3
