- id: sep-vie1-l5
  title: "De Platon à Descartes"
  notes: |-
    **Les définitions historiques de la vie ne se suivent pas en progrès linéaire** : chaque époque trace la frontière ailleurs. Historiens, philosophes et scientifiques ne la racontent pas de la même façon, ce qui invite à la prudence.

    **Platon : trois vies.** Dans le *Phèdre*, le *Timée* et la *République*, Platon divise la vie en trois : la {violet}vie végétative{/violet}, que possèdent tous les vivants sous forme de **nutrition** et de **reproduction** ; la {violet}vie animale{/violet}, qui y ajoute **sensation** et **locomotion** ; la {violet}vie rationnelle{/violet}, propre à l'homme, qui a les trois. La théologie chrétienne en garde l'esprit, sinon le détail : la vie humaine n'y est pas seulement rationnelle, elle engage {pink}une âme spirituelle, éternelle, et une vie intérieure consciente{/pink}.

    **Aristote : résister aux perturbations.** Pour Aristote, le vivant a une forme, une matière et une orientation vers une fin appropriées (*De l'âme*, 412a1-416b). La vie est une forme de {violet}mouvement de soi{/violet}, de perpétuation ou d'altération de soi. {green}__À la différence du non-vivant, le vivant a la capacité de résister aux perturbations internes et externes__{/green} : c'est pour Aristote la distinction **essentielle**, les autres traits étant **accidentels**. Ce projet de démarquer l'essentiel de l'accidentel dans la vie {coral}persiste jusqu'à nos jours{/coral}.

    **Descartes : la coupure déplacée.** Descartes voit un écart plus grand {red}entre les animaux et les agents rationnels{/red} qu'entre les objets inanimés et les animaux. C'est un tournant : la pensée médiévale plaçait la grande coupure {pink}entre végétaux et animaux{/pink}. Les animaux sont analogues à {yellow}des horloges complexes{/yellow}, privés de la vie intérieure, spirituelle, centrale dans l'expérience humaine. Ses partisans sont dits {violet}mécanistes{/violet}.

    | Auteur | Grande coupure | Critère |
    | Platon | trois vies emboîtées | nutrition, sensation, raison |
    | Aristote | vivant et non-vivant | résister aux perturbations |
    | médiévaux | végétaux et animaux | la sensation |
    | Descartes | animaux et êtres rationnels | la pensée |

    ! Voir dans le mécanisme cartésien l'ancêtre continu de la science actuelle est un anachronisme : peu de scientifiques d'aujourd'hui acceptent ses fondements théoriques.
