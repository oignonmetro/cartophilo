    sentence: "Une définition théorique complète donne des conditions individuellement nécessaires et conjointement ___ : tout ce qui les remplit tombe sous le concept."
    answer: "suffisantes"
    alt: []
  - id: sep-vie1-l2-p3
    sentence: "Une définition théorique donne des conditions individuellement ___ et conjointement suffisantes : qu'une seule manque, et la chose ne tombe pas sous le concept."
    answer: "nécessaires"
    alt: []
  - id: sep-vie1-l2-p4
    sentence: "Une définition théorique prétend valoir sans exception : c'est pourquoi elle est fragile, un seul ___ imaginé suffisant à la réfuter."
    answer: "contre-exemple"
    alt: ["contre exemple"]
  - id: sep-vie1-l2-p5
    sentence: "Exemple classique de la fragilité des définitions théoriques : définis comme « hommes non mariés », les ___ incluraient les chiens mâles, les petits garçons et les veufs."
    answer: "célibataires"
    alt: []
  - id: sep-vie1-l2-p6
    sentence: "La vie est organisée, mais les formations ___ aussi : le critère de l'organisation est trop large."
    answer: "géologiques"
    alt: []
  - id: sep-vie1-l2-p7
    sentence: "La vie transforme de l'énergie, mais le ___ aussi : le critère du métabolisme énergétique laisse entrer du non-vivant."
    answer: "feu"
    alt: []
  - id: sep-vie1-l2-p8
    sentence: "La vie évolue au moyen d'une biochimie complexe, mais les ___ aussi, qu'on range rarement parmi les vivants."
    answer: "prions"
    alt: []
  - id: sep-vie1-l2-p9
    sentence: "La vie s'entretient elle-même, mais pas les ___ : le critère de l'autoentretien est trop étroit."
    answer: "parasites"
    alt: []
  - id: sep-vie1-l2-p10
    sentence: "La vie est en déséquilibre ___, mais bien d'autres choses le sont : le critère ne distingue pas le vivant."
    answer: "thermodynamique"
    alt: []
  - id: sep-vie1-l2-p11
    sentence: "Un critère de la vie est trop large quand il laisse entrer le feu ou les prions ; il est trop étroit quand il exclut le parasite, qui pourtant ___."
    answer: "vit"
    alt: []
  - id: sep-vie1-l2-p12
    sentence: "Les définitions théoriques sont une norme trop ___ : le monde réel est bien trop complexe pour que des critères en nombre limité tranchent tous les cas limites."
    answer: "rigide"
    alt: []
- id: sep-vie1-l3
  title: "Définitions opérationnelle, nominale, ostensive, stipulative"
  notes: |-
    **Lassés des allers-retours des définitions théoriques, les non-philosophes préfèrent souvent une {violet}définition opérationnelle{/violet}** (ou de travail) : elle sert en pratique à restreindre le champ des phénomènes étudiés. Les philosophes n'y voient souvent pas une vraie définition ; elle est {red}philosophiquement superficielle{/red}. Exemple : la définition de la vie retenue par la **NASA**, {teal}« un système chimique autoentretenu capable d'évolution darwinienne »{/teal} (Joyce 1994). Elle pourrait {red}inclure les virus{/red} tout en {red}excluant les mules{/red}, qui, stériles, n'évoluent pas.

    **Trois autres sortes de définitions.**
    - La {violet}définition nominale{/violet} (de lexicographe, de dictionnaire) analyse **l'usage** d'un mot. Elle suit la lente acceptation culturelle : elle ne peut donc guider la recherche sur des questions neuves ou controversées.
    - La {violet}définition ostensive{/violet} (démonstrative) communique un concept en montrant : {yellow}« ceci est rouge », en désignant un bloc rouge{/yellow}. Le juge **Potter Stewart** définit ainsi la pornographie : {teal}« je la reconnais quand je la vois »{/teal}. Mais ce savoir est {red}illusoire{/red} : une catégorie culturelle intériorisée peut sembler aussi naturelle qu'une espèce naturelle, et chacun comprend différemment ce qu'on lui montre. {yellow}« Ceci est *gavagai* »{/yellow} peut viser la rougeur du bloc, sa dureté ou toute autre propriété. Or les scientifiques ne s'accordent même pas sur les objets terrestres (virus, prions) : {coral}la définition ostensive ne permet pas de comprendre la vie{/coral}.
    - La {violet}définition stipulative{/violet} introduit et définit un terme **par décret**. En géométrie euclidienne, le cercle n'admet aucun contre-exemple, étant donné les axiomes. Mais dans le monde réel, {red}c'est un piètre refuge{/red} : définir les {yellow}cygnes comme « oiseaux blancs au long cou »{/yellow} y ferait entrer cigognes, grandes aigrettes et grues, et sortir les cygnes noirs d'Australie. Stipuler que la vie est faite d'{pink}« entités reproductrices à base de carbone »{/pink} exclurait par décret une vie à base de silicium : {coral}cela ne fait que déplacer le débat{/coral}, et ne convaincra pas qui trouve la stipulation peu intuitive.

    **Deux définitions concurrentes, aux fins opposées.** La plupart des tentatives de définir la vie sont opérationnelles ou philosophiques : les premières sont {pink}rapides et admettent des contre-exemples{/pink}, les secondes {green}précises et chargées de théorie{/green}. {coral}Certains désaccords se dissolvent dès qu'on précise le type de définition employé.{/coral}

    | Définition | Ce qu'elle fait | Sa limite |
    | théorique | conditions nécessaires et suffisantes | un contre-exemple la réfute |
    | opérationnelle | restreint le champ en pratique | superficielle |
    | nominale | analyse l'usage du mot | suit l'usage, ne guide pas |
    | ostensive | montre des exemples | ce qu'on montre est ambigu |
    | stipulative | décrète un sens | déplace le débat |
