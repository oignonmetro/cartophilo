- id: montaigne-monstre-i2
  title: "Les notions"
  notes: |-
    **Nature, monstre, présage, genre, habitude, norme, anomalie : le chapitre joue sur l'écart entre ce qui est et ce qu'on a l'habitude de voir.**

    Par **nature**, Montaigne entend l'ensemble ordonné de ce qui existe, l'œuvre de Dieu considérée dans sa totalité. Est « selon la nature » ce qui trouve sa place dans cet ordre ; serait « contre nature » ce qui en sortirait, comme une erreur de fabrication sort de la série des objets bien faits. Le **monstre** est un être dont la forme s'écarte de celle de son espèce ; le mot est souvent pris au sens de ce qui « montre » ou avertit (latin *monstrare*). Le **présage** et le **prodige** désignent un événement extraordinaire lu comme un signe qui annonce l'avenir (une comète annonçant une guerre). Le **genre** est une famille de formes apparentées : avoir des semblables rend une forme intelligible par comparaison. L'**habitude** est ce qu'on a vu assez souvent pour ne plus s'en étonner.

    | Norme | Ce qu'elle dit | Exemple |
    | statistique | ce qui arrive le plus souvent | la plupart des enfants naissent avec deux bras |
    | prescriptive | ce qui doit être | un enfant devrait avoir deux bras |

    Une **anomalie** est un écart par rapport à ce qui arrive d'habitude, sans que cet écart implique par lui-même un défaut : le gaucher présente une anomalie statistique, on ne dira pas qu'il est mal fait.

    ! Une anomalie n'est pas un défaut : le passage de l'une à l'autre est précisément ce que le chapitre récuse.
