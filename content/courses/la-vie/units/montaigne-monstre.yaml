- id: montaigne-monstre-par4
  title: "L'énoncé et le fondement de la thèse"
  notes: |-
    **Ce dernier mouvement alterne le point de vue de Dieu et le point de vue humain : Dieu voit l'infinité des formes, mais le genre est inconnu de l'homme ; la sagesse divine ne produit que du régulier, mais on n'en voit pas les rapports.** C'est pourquoi les arguments ne se suivent pas en blocs séparés : l'argument du genre inconnu s'intercale entre les deux sous-arguments théologiques. Viennent ensuite la citation de Cicéron, qui explique le versant humain, puis la thèse diagnostique, le principe conceptuel et l'exhortation.

    | Extrait | Ce qu'il fait |
    | 4.1 | Dieu qui connaît : aucune forme ne fait exception |
    | 4.2 | le genre inconnu de l'homme |
    | 4.3 | Dieu qui produit, et les rapports que nous ne voyons pas |
    | 4.4 | l'argument par l'habitude : la citation de Cicéron |
    | 4.5 | la thèse diagnostique : contre nature, contre nos habitudes |
    | 4.6 | le principe : rien n'existe qui ne soit selon la nature |
    | 4.7 | l'exhortation : une éthique du regard |

    === 1 Dieu qui connaît : aucune forme ne fait exception

    **Premier sous-argument théologique, qui porte sur Dieu comme celui qui connaît : pour un regard qui embrasse la totalité des formes, aucune ne fait exception.** Le dernier mouvement est construit sur une **alternance** entre le point de vue de Dieu et le point de vue humain (Dieu voit l'infinité des formes, mais le genre est inconnu de l'homme ; la sagesse divine ne produit que du régulier, mais nous n'en voyons pas les rapports). D'où l'argument du genre inconnu, intercalé entre les deux sous-arguments théologiques.

    Le raisonnement : une chose ne paraît monstrueuse que si elle fait exception à une série connue (un veau à deux têtes, à la série des veaux qu'on a vus). Or, pour qui voit la totalité des formes, chacune est comprise dans l'ensemble. Donc les monstres ne le sont pas pour Dieu. « Ce que nous **appelons** » contient la thèse diagnostique en germe : le mot « monstre » est le nôtre.

    **Limite** : ce sous-argument établit que la monstruosité est relative à un point de vue partiel, mais ne prouve pas qu'il n'existe aucun dérèglement réel ; un Dieu qui voit tout pourrait voir des formes défectueuses comme défectueuses. D'où la nécessité du second sous-argument (4.3).

    Portée **esthétique** : l'argument ancien d'une beauté du tout, invisible à qui ne voit que la partie. Pour Augustin (*La Cité de Dieu*, XVI, 8), Dieu compose la beauté de l'univers par la ressemblance et la diversité des parties ; qui ne voit pas l'ensemble est choqué par la partie, comme un œil qui ne verrait qu'une tesselle d'une mosaïque. Pour le concept de **nature** : « l'immensité » d'une œuvre qui contient « l'infinité des formes », une fécondité qui excède l'expérience humaine ; « De l'expérience » (III, 13) fera de la diversité la qualité la plus universelle des choses.

    ! Ce premier sous-argument ne suffit pas à la thèse ontologique : il relativise la monstruosité, sans exclure un dérèglement réel.

    === 2 Le genre inconnu de l'homme

    **L'argument du genre inconnu passe du point de vue de Dieu au point de vue de « l'homme » : une forme peut être régulière en elle-même et paraître irrégulière à qui ignore ses semblables.** Il répond à une difficulté : si tout est régulier, comment une forme régulière peut-elle paraître irrégulière ? Être régulier, c'est appartenir à un genre, avoir des semblables qui rendent la forme intelligible. Or le genre de l'enfant double peut exister sans qu'on en connaisse les autres membres, comme un fragment de poterie paraît informe à qui n'a jamais vu le vase entier.

    Statut : une **conjecture** (« on peut bien croire »), non une démonstration. Montaigne ne prétend pas connaître ce genre ; il montre qu'il est possible, et cela suffit à lever la contradiction entre le regard divin et l'expérience humaine. Le mot « **étonne** » apparaît ici pour la première fois : l'étonnement est le propre du regard humain, et c'est lui que Cicéron expliquera (4.4).

    ! Montaigne ne prétend pas connaître le genre de l'enfant double : il lui suffit qu'il soit possible.

    === 3 Dieu qui produit, et les rapports que nous ne voyons pas

    **La première phrase est le second sous-argument théologique : Dieu comme celui qui produit. Une cause parfaitement sage ne produit pas d'effet déréglé ; tout ce qui existe est donc régulier.** Toute chose vient de Dieu ; or une cause parfaitement sage ne produit pas d'effet déréglé, pas plus qu'un architecte parfait ne construit un mur de travers par inadvertance. C'est ce sous-argument qui porte proprement la **thèse ontologique**, puisqu'il exclut que le dérèglement soit réel.

    Le mot « **normal** » vient du latin *norma*, l'équerre : ce qui est conforme à la règle. Or la règle est ici celle de la sagesse divine, non la fréquence observée. Montaigne déplace le sens du normal : est normal ce qui est conforme à l'ordre du tout, et en ce sens tout est normal, l'enfant double compris.

    La seconde phrase achève l'argument du genre inconnu. Le « Mais » articule le **réel** et l'**apparent** : la régularité est réelle, c'est sa visibilité qui manque. L'irrégularité apparente mesure un défaut de la connaissance humaine, non un défaut de la chose : la raison ne voit pas les rapports qui constituent l'ordre, et ne peut donc juger de l'ordre à partir de ce qu'elle voit.

    ! « Normal » ne veut pas dire ici fréquent : c'est ce qui est conforme à l'ordre du tout.

    === 4 L'argument par l'habitude : la citation de Cicéron

    **La citation de Cicéron déplace le critère du monstrueux de la connaissance vers l'habitude : l'ignorance de la cause ne suffit pas à produire l'étonnement, il faut encore que la chose soit rare.** On serait tenté de croire que le monstre est simplement ce dont on ignore la cause. La citation défait cette tentation par une comparaison :

    | | Cause | Fréquence | Réaction |
    | une graine devient un arbre | inconnue | fréquente | aucun étonnement |
    | l'enfant double | inconnue | rare | on crie au prodige |

    L'ignorance est commune aux deux cas : elle n'est pas ce qui produit l'étonnement ; seule la **fréquence** change. L'ignorance est une condition **nécessaire** de l'étonnement (qui connaîtrait les rapports ne s'étonnerait pas), mais non **suffisante**.

    La citation n'illustre pas : elle fait avancer la démonstration. Elle reprend le mot « prodige », disqualifié au paragraphe 2, et en donne l'origine psychologique. Portée épistémologique, la plus générale du texte : la familiarité d'une chose ne prouve pas qu'on la comprenne, pas plus que son étrangeté ne prouve qu'elle soit déréglée. « Des boiteux » (III, 11) retournera la leçon contre Montaigne lui-même : « Je n'ai vu monstre et miracle au monde plus exprès que moi-même. »

    ! L'ignorance de la cause est nécessaire à l'étonnement, mais ne suffit pas : c'est la rareté qui le déclenche.

    === 5 La thèse diagnostique : contre nature, contre nos habitudes

    **La thèse diagnostique sort directement de l'argument par l'habitude : ce que l'on prend pour une norme de la nature n'est que la norme de ce qu'on a l'habitude de voir.** Le « nous » désigne l'humanité en général, non un groupe particulier.

    Portée **anthropologique** : la coutume fonctionne comme une nature de remplacement, qui fait prendre son usage pour la règle du monde. « L'accoutumance est une seconde nature, et non moins puissante » (« De ménager sa volonté », III, 10). Même structure dans « Des cannibales » (I, 31 dans l'édition Villey) : « chacun appelle barbarie ce qui n'est pas de son usage ».

    | Domaine | Nom donné à l'inhabituel | Ce qu'on croit désigner |
    | les corps | « contre nature » | un défaut de la chose |
    | les mœurs | « barbarie » | un défaut de l'autre peuple |

    Prolongements : pour Lévi-Strauss, « le barbare, c'est d'abord l'homme qui croit à la barbarie » (*Race et histoire*, 1952) ; pour Canguilhem, le monstre est le vivant « de valeur négative ». Montaigne répond, trois siècles plus tôt, que cette valeur négative est projetée par le regard.

    Portée **éthique**, à présenter comme un prolongement : « contre nature » a longtemps servi de condamnation morale, notamment de certaines conduites sexuelles. S'il ne signifie que « contre nos habitudes », il perd sa force de condamnation. Montaigne ne tire pas cette conséquence, mais son argument interdit d'invoquer la nature pour condamner ce qui est seulement rare. Portée **esthétique** : le jugement de laideur vient lui aussi de l'habitude ; l'« Apologie » (II, 12) montre que chaque nation se représente la beauté d'après ses propres traits.

    ! La conséquence éthique contre l'usage moral de « contre nature » est un prolongement : Montaigne ne la tire pas lui-même.

    === 6 Le principe : rien n'existe qui ne soit selon la nature

    **Le « et pourtant » oppose ce que l'on nomme et ce qui est. Montaigne ne raisonne plus à partir de Dieu mais à partir de la nature : si la nature est l'ensemble de ce qui existe, « contre nature », dit d'une chose existante, se contredit.** Comme parler d'un habitant de Paris qui ne serait pas dans Paris. « Quoi que cela puisse être » marque l'universalité sans exception. D'où une seconde voie vers la thèse ontologique : après la voie **théologique** (la perfection de la cause), une voie **conceptuelle** (la définition de la nature comme totalité).

    La place de la phrase montre pourquoi la thèse diagnostique a besoin de la thèse ontologique : l'explication par l'habitude dit pourquoi l'on juge une chose monstrueuse, non que ce jugement est faux. **Montrer l'origine d'une croyance ne prouve pas qu'elle est erronée** ; le « et pourtant » garantit que le jugement expliqué est bien une erreur.

    | Sens de « nature » | Qui s'en sert |
    | l'ensemble de ce qui existe | le principe (4.6) |
    | un ordre régulier | la sagesse divine (4.3) |
    | une norme dont on peut s'écarter, conformité à un type | ce que Montaigne récuse |

    Comparaison décisive : pour **Aristote** (*De la génération des animaux*, IV, 4, 770b), le monstre est contre nature, mais non contre la nature absolument, seulement contre la nature telle qu'elle est la plupart du temps : un écart relatif à une norme **statistique**, qui reste une propriété du monde. Montaigne va plus loin : il déplace la norme de ce qui arrive le plus souvent vers ce qu'on a l'habitude de voir, du monde vers le sujet. Entre les deux, **Augustin** : le prodige se produit « non contra naturam, sed contra quam est nota natura » (*La Cité de Dieu*, XXI, 8). Montaigne ajoute à Augustin l'argument de Cicéron, qui fait de cette connaissance une simple familiarité. **Diderot** reprendra l'idée dans *Le Rêve de d'Alembert* : l'homme n'est qu'un effet commun, le monstre un effet rare, tous deux également naturels.

    ! Aristote rendait déjà le monstre relatif, mais à une fréquence du monde ; Montaigne le rend relatif au regard.

    === 7 L'exhortation : une éthique du regard

    **La dernière phrase est une exhortation, qui tire la conséquence pratique de la thèse. Elle nomme les deux choses que le chapitre a traitées : l'« erreur », épistémique (prendre l'inhabituel pour le déréglé), et l'« étonnement », affectif (la réaction devant la nouveauté).** La « raison universelle et naturelle » est le raisonnement qui porte sur le tout, et que l'esprit peut former par lui-même, par opposition au jugement particulier que produit l'habitude.

    Portée **éthique** : une éthique du regard. L'étonnement n'est pas innocent, puisqu'il enferme l'autre dans la catégorie du prodige ; il faut apprendre à le dépasser. Se défaire de l'étonnement, c'est reconnaître que sa propre habitude n'est pas la mesure des choses : une forme d'**humilité**.

    Une difficulté : si tout ce qui existe est selon la nature, comment la nature peut-elle encore servir de guide, comme Montaigne le veut dans « De l'expérience » (III, 13) ? Une norme qui n'exclut rien ne semble plus rien prescrire. Réponse possible : la nature change de fonction normative. Elle ne prescrit plus une forme à laquelle se conformer, mais une **attitude**, accueillir la diversité au lieu de la juger. La nature cesse d'être un étalon des corps pour devenir une correction du regard.

    Synthèse du quatrième mouvement : l'argument théologique prouve, par son second sous-argument, que le monstre n'existe pas du côté des choses ; le genre inconnu explique comment une forme régulière peut paraître irrégulière ; l'habitude montre que c'est la rareté qui produit le jugement ; le principe fonde la thèse ontologique sur la définition de la nature ; l'exhortation en tire une discipline du regard.

    ! Une nature qui n'exclut rien prescrit encore quelque chose : non une forme, mais une manière de regarder.
  passage:
    label: "§4"
    text: "Ce que nous appelons des « monstres » ne le sont pas pour Dieu, qui voit dans l'immensité de son œuvre l'infinité des formes qu'il y a comprises. Et on peut bien croire que cette forme qui nous étonne a quelque chose à voir avec une autre appartenant au même genre, inconnue de l'homme. De sa parfaite sagesse ne peut rien venir que de bon, de normal et de régulier. Mais nous n'en voyons pas les rapports et les relations. « Ce que l'homme voit fréquemment ne l'étonne pas, même si la cause lui en est inconnue. Mais devant quelque chose qu'il n'a jamais vu, il pense à un prodige. » [Cicéron, De la divination, II, 27] Nous appelons « contre nature » ce qui va contre nos habitudes, et pourtant rien n'existe qui ne soit selon la nature, quoi que cela puisse être. Que cette raison universelle et naturelle chasse de nous l'erreur et l'étonnement que la nouveauté nous apporte."
