- id: montaigne-monstre-o1
  title: "Conclusion : la norme déplacée vers le regard"
  notes: |-
    **Aucun argument ne suffirait seul : l'explication par l'habitude dirait pourquoi l'on juge une chose monstrueuse sans établir que ce jugement est faux ; l'argument théologique ou le principe conceptuel prouveraient que le monstre n'existe pas sans expliquer l'erreur. C'est leur conjonction qui permet de conclure.**

    Les portées philosophiques ont une même source : le **déplacement de la norme du monde vers celui qui regarde**.

    | Portée | Ce que le texte en tire |
    | épistémologique | dénoncer l'habitude déguisée en critère de vérité, et l'interprétation rétrospective |
    | anthropologique | l'homme, être d'habitude ; deux pratiques (le spectacle payant, le présage politique) ; l'humanité maintenue de ceux qui portent l'écart |
    | éthique | discipliner le regard, ne plus réduire un être à un signe |
    | esthétique | relativiser la laideur, reprendre l'idée d'une beauté du tout |

    Par ricochet, le chapitre éclaire la forme des *Essais*, que Montaigne décrit dans « De l'amitié » (I, 28) comme des « grotesques et corps monstrueux, rapiécés de divers membres, sans certaine figure, n'ayant ordre, suite ni proportion que fortuite ». Si le monstre n'est pas contre nature, le livre sans ordre apparent ne l'est pas non plus : il aurait, lui aussi, des « rapports et relations » que le lecteur pressé ne voit pas.

    La nature cesse d'être un modèle de forme pour devenir une totalité féconde, et le vivant cesse d'être défini par sa conformité à un type. **Limite des prolongements modernes** : Montaigne ne pense pas le vivant comme Canguilhem ; il le pense comme une partie de l'œuvre divine, et c'est l'ordre du tout, non une puissance propre à la vie, qui garantit la régularité de chaque forme.

    ! Lire Montaigne avec Canguilhem éclaire, mais ne doit pas faire oublier que chez lui la régularité vient de l'ordre divin, non de la vie.
