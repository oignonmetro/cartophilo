id: montaigne-monstre
title: "D'un enfant monstrueux"
subtitle: "Montaigne, Essais, II, 30"
icon: page
color: teal
intro: |-
  Un court chapitre du livre II des *Essais* : Montaigne décrit un enfant double qu'on exhibe pour de l'argent, écarte la lecture qui en fait un présage, rapporte un second cas, puis conclut que rien n'est contre nature, sinon pour nos habitudes.

  Relu linéairement, le chapitre suit une progression inductive : les faits d'abord, la thèse à la fin.
lessons:
- id: montaigne-monstre-i1
  title: "La thèse et les mouvements"
  notes: |-
    **Le chapitre réunit deux affirmations de statut différent : une thèse ontologique (rien de ce qui existe n'est réellement contre nature) et une thèse diagnostique (appeler une chose « contre nature », c'est dire seulement qu'elle va contre nos habitudes).** La seconde dépend de la première : pour soutenir que le mot n'exprime que notre habitude, il faut avoir établi qu'il ne désigne rien de réel. Mais la première ne suffit pas à la seconde : si rien n'est contre nature, il reste à expliquer pourquoi l'on juge pourtant que certaines choses le sont. Montaigne doit donc fournir à la fois une **preuve** que le monstre véritable n'existe pas, et une **explication** de l'illusion qui le fait voir.

    Quatre mouvements, un par paragraphe, dans une progression **inductive** : les faits viennent d'abord, la thèse n'est nommée qu'à la fin.

    | Mouvement | Paragraphe | Fonction |
    | 1 | le récit de l'enfant | appui implicite : faire voir un être naturel avant toute théorie |
    | 2 | le présage | réfuter la lecture adverse |
    | 3 | le pâtre du Médoc | généraliser par un second cas |
    | 4 | la thèse | l'énoncer et la fonder, en six moments |

    Le quatrième mouvement articule l'argument théologique en deux sous-arguments (Dieu qui connaît, Dieu qui produit), l'argument du genre inconnu, l'argument par l'habitude (la citation de Cicéron), la thèse diagnostique, le principe conceptuel (rien n'existe qui ne soit selon la nature) et une exhortation.

    ! La thèse diagnostique, seule, n'établit pas que le jugement de monstruosité est faux : elle en donne seulement l'origine.
