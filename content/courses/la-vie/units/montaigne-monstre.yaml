- id: montaigne-monstre-par2
  title: "La réfutation de la lecture adverse : le monstre n'est pas un signe"
  notes: |-
    **Jusqu'alors, Montaigne a décrit ; il affronte à présent l'interprétation dominante de son temps, qui fait du monstre un présage.** Le mouvement a une fonction négative mais nécessaire : si le monstre n'est pas un message surnaturel, il reste à le penser comme un fait naturel.

    | Extrait | Ce qu'il fait |
    | 2.1 | exposer la lecture adverse : un présage politique favorable au roi |
    | 2.2 | la réfuter par l'ironie : on devine à reculons |

    === 1 La lecture adverse : un présage politique

    **Montaigne expose la lecture adverse au conditionnel (« pourraient bien ») : une concession feinte.** Jusqu'alors, il a décrit ; il affronte à présent l'interprétation dominante de son temps, qui fait du monstre un présage. Ce mouvement a une fonction négative mais nécessaire : si le monstre n'est pas un message surnaturel, il reste à le penser comme un fait naturel.

    On serait tenté, avec l'opinion du temps (Ambroise Paré voit le plus souvent dans les monstres les signes d'un malheur à venir), de croire que ce corps double à tête unique annonce quelque chose. Le mécanisme est une **analogie** : un corps à plusieurs membres et une seule tête ressemble à un royaume de plusieurs parties sous un seul roi.

    Portée **anthropologique** : vers 1578, pendant les **guerres de Religion**, le royaume est divisé, et l'interprète projette sur le corps de l'enfant les préoccupations politiques de son temps. Second usage social du monstre, après l'usage marchand : un usage **symbolique**. Les deux supposent que le monstre soit une exception, ce que la thèse récusera. L'analogie rapporte, comme l'embrassade, l'étrange à du connu, mais illégitimement : elle transforme l'enfant en message au lieu de le rattacher à l'ordre des formes.

    ! L'analogie du présage et l'image de l'embrassade rapportent toutes deux l'étrange au connu ; seule la seconde le fait légitimement.

    === 2 La réfutation ironique : deviner à reculons

    **Le « Mais » introduit la réfutation, qui passe par l'ironie : Montaigne applique à la lettre la méthode des devins pour en faire voir le vide.** Il ne réfute pas le présage par un argument sur la nature ; il en attaque la **valeur de connaissance**. Une prédiction ne vaut que si elle est formulée avant l'événement et vérifiée par lui. Or les interprètes trouvent après coup « quelque interprétation qui vérifie ce qui était prévu ». Leur méthode ne vérifie donc rien : elle ajuste le signe à l'événement, comme Épiménide, qui « devinait à reculons ».

    Portée **épistémologique** : une interprétation qui s'accorde avec tous les événements possibles ne dit rien d'aucun, et ne peut jamais être démentie. La citation vient du livre II du *De la divination*, où **Cicéron** critique la divination en son propre nom ; Montaigne y reviendra au paragraphe 4, ce qui relie les deux mouvements. Portée **éthique** : Montaigne refuse de faire de l'enfant un signe au service d'un discours sur le roi ; il le traite comme un être, non comme un message.

    Synthèse du deuxième mouvement : le monstre perd son statut de message, non parce qu'on aurait prouvé qu'aucun dieu ne peut envoyer de signes, mais parce que la méthode qui les lit ne vérifie rien. Le mot « prodige » est disqualifié avant d'être expliqué.

    ! Montaigne ne prouve pas que les présages sont impossibles : il montre que leur lecture ne peut rien vérifier.
  passage:
    label: "§2"
    text: "Ce double corps et ces membres différents, se raccordant à une seule tête, pourraient bien constituer pour le roi un présage favorable montrant qu'il maintiendra sous sa loi l'union des diverses pièces et parties de notre état. Mais de peur que les événements ne viennent le démentir, mieux vaut le laisser faire d'abord, car il n'y a rien de mieux que de deviner les choses déjà faites : « quand les choses ont eu lieu, on leur trouve quelque interprétation qui vérifie ce qui était prévu » [Cicéron, De la divination, II, 31]. De la même façon, on disait d'Épiménide qu'il « devinait à reculons »."
