- id: montaigne-monstre-par1
  title: "Le récit : faire voir le monstre comme un être naturel"
  notes: |-
    **Ce premier mouvement ne formule aucun argument explicite, mais la manière de décrire appuie déjà la thèse : elle range l'enfant parmi les objets d'une connaissance naturelle, et fait voir ce qu'il a d'ordinaire avant ce qu'il a d'étrange.**

    | Extrait | Ce qu'il fait |
    | 1.1 | annoncer une méthode : décrire, laisser l'explication aux médecins |
    | 1.2 | poser le témoin direct devant un spectacle payant |
    | 1.3 | montrer l'enfant ordinaire avant l'anomalie |
    | 1.4 | décrire l'anomalie par ses causes, et l'image de l'embrassade |
    | 1.5 | observer avec précision : la vie à travers l'anomalie |

    ! Pas encore de thèse : c'est l'ordre et le ton de la description qui argumentent.

    === 1 Une méthode : décrire, et laisser l'explication aux médecins

    **Montaigne annonce une méthode avant un contenu : il sépare l'observation, qu'il rapporte, de l'explication, qu'il renvoie aux médecins.** Ce premier mouvement ne formule aucun argument explicite, mais la manière de décrire appuie déjà la thèse : elle range l'enfant parmi les objets d'une connaissance naturelle.

    Le renvoi aux médecins a une fonction argumentative : il range l'enfant dans le domaine de ceux qui cherchent des **causes naturelles**, non dans celui des devins ou des théologiens. Avant toute thèse, le monstre est déjà traité comme un objet de la nature.

    Portée **épistémologique** : cette retenue n'est pas une modestie d'amateur. Elle est cohérente avec le paragraphe 4, où l'on « ne voit pas les rapports et les relations » qui rendraient la forme intelligible : qui ignore les causes doit décrire exactement et s'abstenir d'interpréter. C'est un trait du scepticisme de Montaigne, que l'« Apologie de Raimond Sebond » (II, 12) développe : la raison humaine ne peut mesurer la nature à sa capacité de comprendre. On peut prolonger par Canguilhem (« La monstruosité et le monstrueux », *La Connaissance de la vie*, 1952) : la **monstruosité**, fait biologique, relève de la science ; le **monstrueux**, catégorie de l'imagination. Montaigne laisse la première aux médecins ; c'est le second qu'il examine.

    Portée **esthétique** : le « récit très simple » écrit le monstre sans le rendre spectaculaire, contre les recueils de prodiges du temps (Boaistuau, *Histoires prodigieuses*, 1560 ; Ambroise Paré, *Des monstres et prodiges*, 1573).

    ! Renvoyer aux médecins n'est pas se désintéresser de la question : c'est déjà la ranger du côté des causes naturelles.

    === 2 Un témoin direct devant un spectacle payant

    **Montaigne parle en témoin direct, et fait voir une pratique sociale : l'étrangeté de l'enfant se vend.** « Je vis », « avant-hier » : l'autorité de l'expérience s'oppose au ouï-dire des recueils de prodiges. Même dans ce témoignage, il reste prudent : les accompagnateurs « se disaient » parents, ce qu'il ne garantit pas.

    Portée **anthropologique** : la curiosité pour l'étrange crée un marché, et le corps anomal devient un spectacle payant. Or ce qui se vend, c'est l'« étrangeté », l'effet de la rareté sur les spectateurs, ce que le paragraphe 4 appellera « l'étonnement que la nouveauté nous apporte ». La valeur marchande de l'enfant dépend donc entièrement de l'habitude du public : si de tels enfants étaient fréquents, personne ne paierait pour les voir. La scène initiale contient ainsi, sans le dire, la **thèse diagnostique**.

    On attendrait une prise de position éthique contre l'exhibition. Montaigne ne condamne rien, et il est lui-même parmi les spectateurs : son éthique se loge dans la manière de regarder, non dans des jugements explicites.

    ! Ce qui se vend n'est pas l'enfant, mais l'effet de sa rareté sur ceux qui paient.

    === 3 L'ordinaire avant l'étrange

    **Le geste décisif est un geste d'ordre : Montaigne décrit l'ordinaire avant l'anomalie, ce qui renverse l'ordre du spectacle, qui montre d'abord l'étrange.** L'enfant est « d'une forme ordinaire », il marche et gazouille « comme les autres enfants de son âge », il en est encore au lait. La seule particularité relevée, celle des cris, est **modalisée** (« semblaient bien ») : Montaigne n'amplifie pas l'étrangeté.

    Portée **anthropologique et éthique** : l'enfant est traité comme un enfant, avec des gestes et des états d'enfant (il tète, recrache, crie, a un âge précis), considéré en lui-même plutôt que comme une curiosité. Portée pour le concept de **vivant** : l'enfant se développe selon les étapes ordinaires de la croissance ; la vie ne dépend pas de la conformité de la forme à un type.

    ! La description n'est pas neutre : l'ordre dans lequel elle montre les choses est déjà un argument.

    === 5 L'anomalie décrite par ses causes, et l'embrassade

    **L'anomalie apparaît enfin, mais décrite en termes anatomiques, et l'accent porte encore sur ce qui est complet (« le reste intact »).** Le bras plus court est rapporté à une cause précise, un **accident** de naissance : Montaigne distingue, à l'intérieur même de l'anomalie, ce qui appartient à la forme de l'enfant et ce qui relève d'un accident. Même devant l'étrange, il raisonne par les causes naturelles.

    L'image de l'**embrassade** a une portée **esthétique** : elle substitue à l'horreur une scène de tendresse familière. Elle a aussi une portée **argumentative**, qu'on ne voit qu'après coup : rapprocher la forme étrange d'une scène connue, c'est déjà lui trouver des « rapports et relations » avec ce qu'on a l'habitude de voir, faire en petit ce que le paragraphe 4 décrira comme la condition pour cesser de s'étonner. L'image est un premier geste de **familiarisation**.

    ! L'embrassade n'est pas un ornement : elle anticipe la solution du paragraphe 4.

    === 7 Un protocole d'observation : la vie à travers l'anomalie

    **La description devient presque un protocole : mesure (« quatre doigts »), manipulation (« si on retournait »), distinction entre ce qu'on voit et ce qu'on ne voit pas, témoignage rapporté et attribué (« la nourrice nous a dit »).** La précision fait voir la chose telle qu'elle est, sans la charger de sens.

    Portée principale, pour le concept de **vivant** : les membres de l'enfant incomplet sont « nourris et vivants », l'enfant « urinait par les deux endroits ». La vie fonctionne à travers l'anomalie, elle trouve d'autres voies quand la voie habituelle manque. Prolongement : pour Canguilhem (*Le Normal et le pathologique*, 1943, rééd. 1966), une anomalie est d'abord une inégalité, une irrégularité de fait, non un défaut ; elle ne devient **pathologique** que si elle empêche le vivant de vivre. L'enfant présente une anomalie qui ne l'empêche pas de vivre comme un enfant.

    Le passage pose aussi la question de l'**individu** : y a-t-il un vivant ou deux ? L'enfant sans tête vit, mais par l'autre. La médecine parle aujourd'hui de jumeaux **hétéropages**, dont l'un est incomplet et dépend de l'autre. La vie ne coïncide pas nécessairement avec l'individu, et la frontière entre deux vivants est elle aussi une affaire d'habitude.

    Synthèse du premier mouvement : la description fonctionne comme un argument implicite. Montaigne présente un être qui fonctionne selon les lois ordinaires du vivant, et dont l'étrangeté réside d'abord dans le regard des spectateurs qui paient pour le voir. Le paragraphe 4 n'aura plus qu'à nommer ce que le récit a fait voir.

    ! Une anomalie n'est pas une maladie : elle ne devient pathologique que si elle empêche de vivre.
  passage:
    label: "§1"
    text: "Ce récit sera très simple : je laisse aux médecins le soin de discourir sur la question. Je vis avant-hier un enfant que deux hommes et une nourrice, qui se disaient être le père, l'oncle et la tante, promenaient pour le montrer et en tirer quelques sous, à cause de son étrangeté. Il était d'une forme ordinaire, se tenait sur ses pieds, marchait et gazouillait à peu près comme les autres enfants de son âge. Il n'avait pas encore voulu se nourrir autrement qu'en tétant sa nourrice, et ce qu'on essaya devant moi de lui mettre dans la bouche, il le mâchait un peu, et le rendait sans l'avaler. Ses cris semblaient bien avoir quelque chose de particulier. Il était âgé de quatorze mois tout juste. Au-dessous des tétins, il était attaché et collé à un autre enfant sans tête, dont le canal médullaire de la colonne vertébrale était bouché, et le reste intact : si l'un de ses bras était plus court, c'est qu'il lui avait été brisé par accident à la naissance. Ils étaient accolés face à face, comme si un enfant plus petit voulait en embrasser un autre plus grand. La région par laquelle ils étaient attachés n'était que de quatre doigts environ, de sorte que si on retournait l'enfant incomplet, on pouvait voir en dessous le nombril de l'autre : la suture se situait entre les tétins et le nombril. On ne pouvait voir ce dernier sur l'enfant incomplet, mais on voyait bien tout le reste de son ventre. Ainsi ce qui n'était pas attaché, comme les bras, le fessier, les cuisses et les jambes de cet enfant incomplet, demeurait pendant et ballottant sur l'autre, et lui descendait jusqu'à mi-jambe. La nourrice nous a dit aussi qu'il urinait par les deux endroits, et les membres du deuxième étaient nourris et vivants, et dans le même état que ceux du premier, sauf qu'ils étaient plus courts et plus menus."
