- id: montaigne-monstre-par3
  title: "Un second cas : le pâtre du Médoc"
  notes: |-
    **Le paragraphe est juxtaposé au précédent sans transition, et ne contient aucune interprétation : après la réfutation du présage, Montaigne ne cherche même plus de signe, il rapporte.** Sa fonction est de **généraliser** : l'observation ne porte pas sur une exception unique. On peut ajouter, sans en faire une intention explicite de Montaigne, que la succession rapprochée des deux rencontres (« avant-hier », « je viens de voir ») rend déjà l'étrange moins rare, donc moins étonnant : c'est ce que le paragraphe 4 établira. « Des boiteux » (III, 11) le dira en maxime : « On s'apprivoise à toute étrangeté par l'usage et le temps. »

    La construction de la phrase porte la portée **anthropologique** : le « mais » fait passer du manque à l'ordinaire (la barbe, les désirs, le contact des femmes). L'appartenance à l'humanité n'est pas suspendue par l'écart corporel ; on retrouve « Du repentir » (III, 2) : « Chaque homme porte la forme entière de l'humaine condition. » Pour le concept de **vivant** : le désir persiste sans l'organe qu'on croirait nécessaire.

    Synthèse du troisième mouvement : l'anomalie n'est ni unique ni exclusive de l'ordinaire. Deux cas, la lecture surnaturelle disqualifiée, l'humain et le vivant montrés par deux fois à travers l'écart : il reste à nommer le principe.

    ! Le « mais » ne corrige pas le manque : il montre que l'ordinaire humain le traverse.
  passage:
    label: "§3"
    text: "Je viens de voir dans le Médoc un pâtre, de trente ans environ, qui ne présente pas de parties génitales : il a seulement trois trous par où s'écoule sans cesse de l'eau ; mais il a de la barbe, éprouve des désirs, et recherche le contact des femmes."
