- id: vies2-l2
  title: "Le Gorgias : nous sommes déjà morts"
  notes: |-
    **Platon radicalise la question d'Euripide : non seulement vivre, c'est mourir, mais la vie est la mort, les vivants sont déjà morts** (*Gorgias*, 493a-b) :

    {teal}« Peut-être même en réalité sommes-nous morts !{/teal} C'est justement ce que j'ai déjà entendu soutenir par quelqu'un des Sages [{blue}*tôn sophôn*{/blue}] : à cette heure, disait-il, nous sommes morts, {teal}notre corps{/teal} [{blue}*sôma*{/blue}] {teal}est notre sépulcre{/teal} [{blue}*sèma*{/blue}], et cette partie de l'âme où sont les désirs est précisément de nature à se laisser séduire et retourner sens dessus dessous. C'est ce dont un homme ingénieux, un Sicilien peut-être ou bien un Italique, a fait, dit-on, une fable [{blue}*muthologôn*{/blue}], dans laquelle, donnant au mot un croc-en-jambe, il a appelé {teal}un tonneau{/teal} [{blue}*pithos*{/blue}], cette partie de l'âme, à cause de sa disposition {teal}à se laisser persuader{/teal} [{blue}*pithanon*{/blue}], de sa crédulité [...] ; appelant d'autre part {teal}"tonneau troué"{/teal} cette partie de leur âme à laquelle appartiennent les désirs, la comparant, en raison de {teal}l'insatiabilité de leurs désirs{/teal}, à ce qu'il y a de disloqué dans le tonneau et à son incapacité de ne pas laisser fuir ce qu'on y met. »

    **Deux jeux de mots portent la thèse.**
    - {yellow}{blue}*sôma*{/blue} / {blue}*sèma*{/blue}{/yellow} : le corps est un tombeau ; l'âme y est enterrée vivante.
    - {yellow}{blue}*pithos*{/blue} / {blue}*pithanon*{/blue}{/yellow} : la partie désirante est un tonneau, parce qu'elle se laisse persuader ; et un tonneau troué, parce que ses désirs, insatiables, fuient à mesure qu'on les remplit.

    **Platon ne parle pas en son nom.** Pour la question comme pour la réponse, il mobilise {amber}l'opinion{/amber} : celle du {sky}poète tragique{/sky} (Euripide), celle supposément éclairée de {sky}sages anonymes{/sky} (des {blue}*sophoi*{/blue}, non des philosophes), celle enfin d'un {sky}homme ingénieux{/sky}, orphique ou pythagoricien, dont le propos est assimilé à un {violet}mythe{/violet}. Tout se passe comme si, de la relation entre vie et mort, {coral}la philosophie ne pouvait produire elle-même un discours, mais devait le recevoir d'autres genres de discours{/coral} : {yellow}poétique, savant, mythologique{/yellow}.

    **D'où le paradoxe** : la philosophie, qui ne peut rien dire par elle-même de la mort, est pourtant {green}une pratique qui consiste à apprendre à mourir{/green}. C'est la leçon suivante.
  points:
  - id: vies2-l2-p1
    sentence: "Platon, *Gorgias* : « __Peut-être même en réalité__ sommes-nous ___ ! »"
    answer: "morts"
    alt: []
  - id: vies2-l2-p2
    sentence: "Platon, *Gorgias* : « notre **corps** [*sôma*] est notre ___ [*sèma*] »."
    answer: "sépulcre"
    alt: []
  - id: vies2-l2-p3
    sentence: "__Le jeu de mots du *Gorgias* qui fait du corps un tombeau__ joue sur *sôma*, le **corps**, et *___*, le **tombeau**."
    answer: "sèma"
    alt: ["sema", "sêma"]
  - id: vies2-l2-p4
