lessons:
- id: vies2-l1
  title: "Qu'est-ce que la vraie vie ?"
  notes: |-
    **La philosophie ne cesse de se poser la question : qu'est-ce que la vraie vie ?** Non pas seulement une vie {pink}authentiquement vécue{/pink}, au sens étymologique d'« authentique » (le grec {violet}*authentikos*{/violet}, « qui consiste en un pouvoir absolu », d'où « garanti, inattaquable ») : une vie pleinement fidèle à des principes, *quels qu'ils soient*. Mais {green}une vie conforme au concept même de vie{/green}, qui permette de discriminer entre les types de vie, dirigée selon {coral}des principes indubitables, dont tous devraient en droit reconnaître la validité{/coral}.

    ! La différence est décisive : une vie authentique peut être fidèle à de mauvais principes ; la vraie vie est celle dont les principes valent pour tous.

    **Une telle vie formulerait un impératif**, celui du poème de {sky}Rilke{/sky}, « Torse archaïque d'Apollon » : {teal}« Tu dois changer ta vie »{/teal}, que {sky}Peter Sloterdijk{/sky} a repris pour titre d'un ouvrage.

    **La question naît d'une interrogation sur la vie et la mort**, dont {sky}Euripide{/sky} se fait l'écho, dans un fragment probablement tiré de *Polyidos*, que Platon rapporte dans le *Gorgias* (492e) : {teal}« Qui sait si vivre{/teal} [*to zèn*] {teal}ce n'est pas mourir{/teal} [*katthanein*], et si, d'un autre côté, {teal}mourir{/teal} [*to katthanein*], {teal}ce n'est pas vivre{/teal} [*zèn*] ? »

    **Ce qu'affirme la question : la frontière entre vivre et mourir est poreuse.** Les deux verbes substantivés désignent deux processus {amber}indiscernables{/amber}. La mort n'est pas un événement qui marque la fin de la vie : {coral}vivre est un processus équivalent à celui de mourir{/coral}.
    - {amber}Venir à la vie{/amber}, c'est déjà entamer le processus qui conduit inexorablement à la mort ;
    - inversement, {amber}mourir{/amber} prouve qu'on est vivant, puisque {yellow}seul peut mourir un vivant{/yellow}.

    Mais Euripide ne l'affirme pas : il le demande ({violet}*tis d'oiden*{/violet}, « qui sait », presque « y a-t-il quelqu'un pour savoir ? »). C'est {coral}une évidence si bien oubliée qu'elle est devenue le secret, le mystère de la vie{/coral}.
  points:
  - id: vies2-l1-p1
    sentence: "Le grec *___*, « qui consiste en un pouvoir absolu », d'où « garanti, inattaquable », donne le mot « authentique »."
    answer: "authentikos"
    alt: []
  - id: vies2-l1-p2
