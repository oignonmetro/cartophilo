- id: sep-camus1-l4
  title: "Noces : la mort sans espoir"
  notes: |-
    **Un monde sans Dieu.** Camus a consacré son mémoire, à l'université d'Alger, au rapport de la philosophie grecque et du christianisme, de **Plotin à Augustin**. Sa philosophie rejette pourtant explicitement la religion comme fondement : {green}elle choisit de vivre sans Dieu{/green}, et explore les questions et les pièges d'un **monde post-religieux**.

    **_Noces_ (1938), le point de départ.** Ces essais lyriques, publiés en Algérie, décrivent une conscience qui jouit du monde, un corps qui se délecte de la nature, une immersion dans la pure physicalité. Mais ces expériences sont présentées comme **la solution d'un problème philosophique** : trouver le sens de la vie face à la mort.

    **Deux attitudes opposées.**
    - D'un côté, les {pink}craintes d'inspiration religieuse{/pink} : contre l'orgueil, pour l'âme immortelle, l'espoir d'un au-delà, la résignation au présent, le souci de Dieu.
    - De l'autre, des faits que Camus tient pour évidents : {green}nous devons mourir, et il n'y a rien au-delà de cette vie{/green}. Il en tire, sans le dire, que l'âme n'est pas immortelle, et invite à regarder en face une réalité inconfortable, **sans en donner de preuves**.

    **Où est la sagesse ?** Dans la {teal}« certitude consciente d'une mort sans espoir »{/teal}, et dans le refus de se cacher que nous allons mourir : {teal}« il n'est pas de bonheur surhumain, pas d'éternité hors de la courbe des journées »{/teal} ; {teal}« je ne trouve pas de sens au bonheur des anges »{/teal}. Il n'y a que ce monde, cette vie, l'immédiateté du présent. {teal}« {/teal}Il ne me plaît pas de croire que {teal}la mort ouvre sur une autre vie{/teal}. Elle est pour moi {teal}une porte fermée. »{/teal}

    ! On dit parfois Camus « païen » parce qu'il rejette l'espoir chrétien d'un au-delà ; c'est une erreur : ce qu'il rejette, c'est l'espoir lui-même.
