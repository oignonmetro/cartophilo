- id: sep-camus1-l2
  title: "Le paradoxe de l'absurde"
  notes: |-
    **Une philosophie faite de paradoxes.** Dans *Le Mythe de Sisyphe*, Camus présente {pink}une philosophie qui conteste la philosophie elle-même{/pink}. L'essai appartient à la tradition existentialiste, mais Camus nie être existentialiste. *Le Mythe* et *L'Homme révolté* sont systématiquement {pink}sceptiques sur le sens de la vie{/pink}, et pourtant ils donnent {green}des réponses objectivement valables à la question de savoir comment vivre{/green}. Rejetant l'idée même de système, Camus construit pourtant un édifice original autour de deux termes : l'{violet}absurde{/violet} et la {violet}révolte{/violet}.

    **Le paradoxe essentiel : l'absurde.** Camus admet, avec Aristote, que **la philosophie commence par l'étonnement** : l'homme ne peut s'empêcher de demander « quel est le sens de l'existence ? ». Mais il nie qu'il y ait une réponse, et rejette toute fin scientifique, téléologique, métaphysique ou humaine qui en donnerait une : {red}le monde, l'univers, l'entreprise humaine restent muets sur une telle fin{/red}. Puisque l'existence n'a pas de sens, il faut apprendre à porter un vide irrémédiable. {green}__L'absurde, c'est cette situation paradoxale : entre notre élan à poser les questions ultimes et l'impossibilité d'y répondre.__{/green}

    **Une image plutôt qu'un argument.** L'absurde se saisit le mieux dans l'image de {yellow}Sisyphe{/yellow} : comme lui, nous ne pouvons cesser de demander le sens de la vie, pour voir nos réponses rouler en bas. D'où des questions sur la philosophie même : que reste-t-il à l'argument si l'on répond à la question du suicide par une métaphore ? Si la vie n'a pas de sens, pourquoi continuer à vivre et à raisonner ? {pink}Silène{/pink} n'aurait-il pas raison de dire qu'il vaudrait mieux n'être pas né ? Francis **Jeanson** (1947) demandait si une philosophie absurde n'est pas une contradiction dans les termes, une posture antirationnelle qui finit dans le silence.

    ! L'absurde n'est pas le monde, ni l'homme, mais leur rapport : la question que l'homme ne peut s'empêcher de poser, face à un monde qui ne répond pas.
  points:
