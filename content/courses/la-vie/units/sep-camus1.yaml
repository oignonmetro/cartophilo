- id: sep-camus1-l3
  title: "Philosophe ou artiste ?"
  notes: |-
    **Camus a dit non.** Dans un entretien avec Jeanine Delpech (*Les Nouvelles littéraires*, novembre 1945), il dit ne pas croire assez à la raison pour croire à un système. Ses carnets le confirment : il se dit **artiste et non philosophe**, parce qu'il pense selon les mots et non selon les idées.

    **Sartre a vu le philosophe.** Dans sa recension de *L'Étranger*, rapporté au *Mythe*, Sartre rapproche aussitôt Camus de **Pascal, Rousseau et Nietzsche** ; devenus amis, il parle de la {violet}« philosophie de l'absurde »{/violet} de Camus, qu'il distingue de sa propre pensée, à laquelle il accepte, lui, l'étiquette d'{violet}existentialiste{/violet}. Le caractère antisystématique de cette philosophie a fait que peu de chercheurs en ont mesuré la profondeur ; Ronald **Srigley** (*Albert Camus' Critique of Modernity*, 2011) est une exception.

    **La lecture d'Aronson.** Prendre au sérieux les écrits philosophiques de Camus, c'est voir qu'ils contiennent plus qu'une humeur, des images et des affirmations sans appui, même s'ils en contiennent beaucoup. {green}__Camus pousse le scepticisme aussi loin que possible, comme un doute méthodique, jusqu'à trouver la base d'une conclusion non sceptique.__{/green} Sa philosophie, aux prémisses souvent tues, se construit par étapes, comme un effort pour **démontrer** ce qu'implique l'absurdité de l'existence. Elle répond ainsi à deux questions :
    - celle du *Mythe de Sisyphe* : pourquoi ne devrais-je pas me tuer ?
    - celle de *L'Homme révolté* : pourquoi ne devrais-je pas tuer les autres ?
  points:
