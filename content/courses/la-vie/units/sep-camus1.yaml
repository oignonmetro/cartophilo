- id: sep-camus1-l5
  title: "L'espoir, le pire des maux"
  notes: |-
    **L'espoir est l'erreur que Camus veut éviter** : il rejette les illusions de l'espoir. Il s'appuie sur la lecture que fait **Nietzsche** de la {yellow}boîte de Pandore{/yellow} dans *Humain, trop humain* : Zeus a lâché sur le monde tous les maux, épidémies et maladies, mais le dernier, l'**espoir**, reste caché dans la boîte et précieusement gardé.

    **Pourquoi l'espoir serait-il un mal ?** Les hommes y voient leur plus grand bien ; Zeus, mieux avisé, en a fait la plus grande source de tourments. {green}__C'est par l'espoir que les hommes se laissent tourmenter : parce qu'ils attendent une récompense ultime.__{/green} Pour Camus, la solution reçue est le problème : {red}l'espoir est désastreux parce qu'il fait tenir cette vie pour rien, sinon pour la préparation d'une autre{/red}. Pire, en nous apprenant à détourner le regard de la vie, il **tue une part de nous**, l'attitude réaliste dont nous avons besoin face aux vicissitudes de l'existence.

    **La richesse présente.** Que faut-il alors ? Ni sceptique ni relativiste, le jeune Camus s'appuie sur l'évidence de l'expérience sensible : {coral}vivre intensément la vie des sens, ici et maintenant{/coral}. {teal}« {/teal}Entre ce ciel et ces visages tournés vers lui, {teal}rien où accrocher une mythologie{/teal}, une littérature, une éthique ou une religion, mais des pierres, la chair, des étoiles et {teal}ces vérités que la main peut toucher. »{/teal} {teal}« Si je refuse obstinément{/teal} tous les "plus tard" du monde, c'est qu'il s'agit aussi bien de ne pas renoncer à {teal}ma richesse présente. »{/teal} Cette richesse, l'espoir nous en frustre.

    **Les deux côtés en une phrase.** {teal}« Le monde est beau, et hors de lui, point de salut. »{/teal} Seul celui qui accepte la mort, dépouillé de tout espoir, goûte le plus intensément la vie physique, mais aussi ses liens affectifs : {teal}« {/teal}Sentir {teal}ses liens avec une terre{/teal}, {teal}son amour pour quelques hommes{/teal}, savoir qu'il est toujours un lieu où le cœur trouvera son accord, voici déjà {teal}beaucoup de certitudes pour une seule vie d'homme. »{/teal}

    **Un argument par l'évocation.** Le côté lyrique de ces essais est **au centre de l'argument** : plutôt que d'argumenter, Camus affirme que ces expériences sont elles-mêmes la bonne réponse, et écrit pour que le lecteur « voie ». Dans « Noces à Tipasa » : {teal}« J'aime cette vie avec abandon{/teal} et veux en parler avec liberté : elle me donne {teal}l'orgueil de ma condition d'homme. »{/teal} Nous ne pouvons goûter pleinement la vie qu'à condition de ne plus fuir notre mort.
