- id: sep-camus1-l1
  title: "Qui est Camus ?"
  notes: |-
    **Albert Camus (1913-1960)** fut journaliste, éditorialiste, dramaturge et metteur en scène, romancier, essayiste politique et militant, et, quoiqu'il l'ait plus d'une fois nié, **philosophe**. Il ignorait ou combattait la philosophie systématique, se fiait peu au rationalisme, {red}affirmait plus qu'il n'argumentait{/red}, exprimait certaines idées par des métaphores, et méditait des questions comme {green}le sens de la vie face à la mort{/green}.

    **La question qui ouvre *Le Mythe de Sisyphe*.** Bien qu'il se soit nettement séparé de l'existentialisme, il a posé l'une des questions existentialistes les plus célèbres du siècle : {teal}« Il n'y a qu'un problème philosophique vraiment sérieux : c'est le suicide. »{/teal} Et sa philosophie de l'absurde a laissé une image saisissante du destin humain : {yellow}Sisyphe poussant sans fin son rocher au sommet de la montagne, pour le voir chaque fois redescendre{/yellow}.

    **De l'absurde à la politique.** Sa philosophie trouve une expression politique dans *L'Homme révolté*, qui, avec ses éditoriaux, ses pièces et ses romans, lui vaut une réputation de **grand moraliste**. Elle l'oppose aussi à son ami **Sartre** : pendant la guerre froide, Camus et Sartre deviennent les grandes voix de la gauche {pink}anticommuniste{/pink} et de la gauche {pink}procommuniste{/pink}. Camus formule enfin une **critique de la religion et des Lumières**, marxisme compris.

    **Repères.** Prix Nobel de littérature en **1957** ; mort dans un accident de voiture en janvier **1960**, à 46 ans.
