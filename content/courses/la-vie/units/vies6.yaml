# Chapitre de Maxime Chapuis, « Vraie vie et modes de vie dans la philosophie
# antique » (voir vies1 pour la source et la méthode) : « Qu'il est possible de
# choisir entre deux modes de vie : Aristote, la vie théorétique et la vie
# pratique », et la conclusion du chapitre. Festugière, Apologie 38a et Éthique
# à Nicomaque VI, 5 relus sur l'image (p. 62, 66). Le chapitre écrit
# « biaois » pour la violence de la vie chrématistique : lu biaios. Le grec
# θεωρία des citations de Bénatouïl et Bonazzi est translittéré (theôria).

id: vies6
title: "Aristote : vie théorétique et vie pratique"
subtitle: "La fonction propre de l'homme, les deux logiques de l'Éthique à Nicomaque, et ce que suppose la contemplation"
icon: compass
color: coral
group: "Vraie vie et modes de vie dans l'Antiquité"
lessons:
- id: vies6-l1
  title: "L'aporie des deux vies"
  notes: |-
    **Une aporie traverse l'Antiquité grecque : faut-il vivre en citoyen ou en contemplatif ?** {sky}André-Jean Festugière{/sky} la formule : {teal}« D'Euripide au Stagirite, la tradition n'a point varié.{/teal} L'union du *bios theôrètikos* au *bios politikos* constitue {teal}l'une des apories les plus délicates du problème moral{/teal}. [...] Mais où est le bonheur véritable, le bonheur conforme à l'essence de l'homme ? {teal}Si l'homme est avant tout citoyen{/teal}, son acte (*energeia*) consiste à {teal}pratiquer d'abord les vertus sociales{/teal}, en premier lieu la justice. [...] À l'opposé, {teal}si l'homme est, avant tout, l'être pourvu d'un intellect spéculatif{/teal} dont l'office est de contempler les choses divines, l'activité morale humaine consiste à {teal}pratiquer d'abord la *theôria* »{/teal}.

    **Jusqu'ici, la pluralité des vies se réduisait à deux** : {green}le libre{/green} et {red}le servile{/red}, {green}le juste{/green} et {red}l'injuste{/red}, {green}le raisonnable{/green} et {red}le déraisonnable{/red}, {green}le philosophique{/green} et {red}le non-philosophique{/red}, comme si seul le premier menait à la vraie vie. Socrate le dit (*Apologie*, 38a) : {teal}« {/teal}c'est là précisément pour un homme le bien le plus grand, de {teal}s'employer chaque jour à parler de la vertu{/teal} [...] tandis que je procède à l'examen de moi-même comme des autres, et enfin, qu'{teal}une vie à laquelle l'examen fait défaut ne mérite pas qu'on la vive »{/teal}.

    **La vraie vie articule théorie et pratique.** L'examen consiste, du point de vue {amber}théorique{/amber}, à chercher les essences (qu'est-ce que le juste ? le courage ?), et, du point de vue {amber}pratique{/amber}, à changer en profondeur sa manière de vivre selon la seule vertu. Les deux ne font qu'un, car {violet}l'intellectualisme socratique{/violet} affirme que {coral}la connaissance de la vertu suffit à rendre vertueux{/coral} (*Lachès*, 194d ; *Gorgias*, 460b-c ; *Protagoras*, 332b-d). Platon donne ainsi {coral}le primat à la théorie, qui doit régler la pratique{/coral}.

    **Une invention platonicienne.** {sky}Bénatouïl et Bonazzi{/sky} : {teal}« Il est très probable que Platon, suivi en cela par Aristote, ait inventé la conception d'une vie consacrée à la *theôria*{/teal} et qui soit propre au philosophe, au point que {teal}les philosophes ultérieurs ont dû reconnaître cette nouvelle conception{/teal} de la philosophie et prendre position pour ou contre celle-ci. » Mais ne peut-on dissocier théorie et pratique, pour en faire **deux modes de vie également souhaitables** ? C'est le pas d'Aristote.
