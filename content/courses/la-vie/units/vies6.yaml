- id: vies6-l6
  title: "Ce que suppose la contemplation"
  notes: |-
    **Le bilan du chapitre.** Avec Pythagore et Platon, la philosophie antique privilégie très largement {green}le mode de vie contemplatif{/green} sur les autres, {red}le politique, l'apolaustique et le chrématistique{/red}, ce dernier étant régulièrement exclu des vies dignes d'un homme libre. Elle tend à réduire leur multiplicité à deux : {green}la vie libre du philosophe{/green} et {red}la vie servile{/red}, qui comprend l'action politique comme la recherche des plaisirs.

    **La contemplation (*theôria*) requiert au moins quatre éléments**, selon {sky}Bénatouïl et Bonazzi{/sky} :
    - {amber}une justification éthique{/amber} de la supériorité de la connaissance sur les autres activités, et la promotion d'une vie principalement consacrée à elle ;
    - {amber}une élucidation psychologique et épistémologique{/amber} : la contemplation est attribuée à une faculté distincte et immortelle, le *noûs*, distinguée de la sensation, de l'opinion, de l'expérience, de la raison pratique ;
    - {amber}une définition ontologique et cosmologique{/amber} des entités contemplées, êtres divins supérieurs, à la fois objets de connaissance et {coral}modèles à imiter{/coral} ;
    - {amber}une analogie{/amber} entre l'activité intellectuelle et {yellow}le fait d'assister à un spectacle religieux ou à une fête{/yellow}, ce qui justifie le nom de *theôria*.

    **Les critères qui distinguent les modes de vie :**

    | Critère | Ce qu'il oppose |
    | les facultés | l'âme et le corps, et les parties de l'âme |
    | les objets | le sensible et l'intelligible |
    | les modalités | le nécessaire et le contingent |
    | les activités | connaître, agir, jouir |

    Ces critères servent aussi à hiérarchiser les vies, et en général à en désigner {coral}une seule comme la vraie vie{/coral}.

    **Le pas d'Aristote.** S'il hérite en partie de la contemplation platonicienne, Aristote {green}restitue sa dignité philosophique au mode de vie pratique{/green}, en distinguant deux orientations : celle de {amber}l'homme en tant qu'homme{/amber}, et celle de {amber}l'homme en tant qu'il doit dépasser l'homme{/amber}. {coral}L'homme doit, autant que possible, mener une vie qui dépasse l'homme ; mais il peut aussi mener une vie en tant qu'homme.{/coral}
