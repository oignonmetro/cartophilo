- id: vies6-l4
  title: "Les trois vies de l'Éthique à Nicomaque"
  notes: |-
    **Aristote identifie trois principaux modes de vie** (*Éthique à Nicomaque*, I, 3) : {teal}« Les hommes, et il ne faut pas s'en étonner, paraissent concevoir le bien et le bonheur d'après la vie{/teal} [*biôn*] {teal}qu'ils mènent{/teal}. La foule et les gens plus grossiers disent que c'est le plaisir : c'est la raison pour laquelle ils ont une préférence pour {teal}la vie [*bion*] de jouissance [*apolaustikon*]{/teal}. C'est qu'en effet {teal}les principaux types de vie sont au nombre de trois{/teal} : celle dont nous venons de parler, {teal}la vie politique{/teal} [*politikos*], et en troisième lieu {teal}la vie contemplative{/teal} [*theôrètikos*]. [...] Les gens cultivés [*oi charientes*], et qui aiment la vie active, {teal}préfèrent l'honneur{/teal}, car c'est là, à tout prendre, la fin de la vie politique. Mais l'honneur apparaît comme une chose {teal}trop superficielle{/teal} pour être l'objet cherché, car, de l'avis général, {teal}il dépend plutôt de ceux qui honorent que de celui qui est honoré{/teal} [...]. »

    **La méthode : partir de l'opinion.** Aristote constate d'abord que {amber}chacun appelle bien ce qui correspond à la vie qu'il mène{/amber}, au lieu d'établir d'abord le bien, puis le type de vie qui y mène. Mais {coral}chaque mode de vie se définit par sa fin (*telos*){/coral}.

    | Vie | Sa fin | Le verdict d'Aristote |
    | chrématistique | la richesse | pas une vie, un moyen |
    | apolaustique | le plaisir des sens | une vie de servitude |
    | politique | l'honneur | à repenser |
    | contemplative | la contemplation | traitée au livre X |

    - {red}La vie chrématistique{/red} n'est pas un mode de vie à part entière, {coral}car la richesse n'est pas une fin, mais un moyen{/coral} (I, 3). Aristote y voit même une {violet}violence{/violet} (*biaios*), contraire à la nature de l'homme.
    - {red}La vie apolaustique{/red} identifie le bonheur aux plaisirs des sens ; partagée par la foule et par des dirigeants qui ont {yellow}les goûts d'un Sardanapale{/yellow}, elle est exclue {coral}comme une vie de servitude{/coral}.
    - {green}La vie politique{/green}, pratique, vise selon les gens cultivés l'honneur ; mais l'honneur {amber}dépend de celui qui reconnaît plus que de celui qui veut être reconnu{/amber} : il faut donc en repenser la fin, que I, 6 place dans l'accomplissement de la fonction propre.
    - {green}La vie contemplative{/green} est seulement mentionnée ici : le livre X lui est consacré.

    {coral}Seules les deux dernières sont dignes d'un homme libre.{/coral}
  points:
