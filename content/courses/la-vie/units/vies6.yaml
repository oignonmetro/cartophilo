- id: vies6-l5
  title: "Le nécessaire et le contingent : sophia et phronèsis"
  notes: |-
    **Sur quels objets portent la vie théorétique et la vie pratique ?** La définition de la {violet}prudence{/violet} (*phronèsis*), vertu du politique, le montre (*Éthique à Nicomaque*, VI, 5) : {teal}« {/teal}[...] la prudence {teal}ne saurait être ni une science{/teal} [*épistèmè*], {teal}ni un art{/teal} [*tekhnè*] : une science, parce que {teal}l'objet de l'action peut être autrement qu'il n'est{/teal} ; un art, parce que {teal}le genre de l'action{/teal} [*praxeôs*] {teal}est autre que celui de la production{/teal} [*poièseôs*]. Reste donc que la prudence est {teal}une disposition, accompagnée de règle vraie, capable d'agir{/teal} dans la sphère de ce qui est bon ou mauvais pour un être humain. Tandis que la production, en effet, a une fin autre qu'elle-même, il n'en saurait être ainsi pour l'action, {teal}la bonne pratique étant elle-même sa propre fin »{/teal}.

    **Le nécessaire et le contingent.**
    - {amber}La science{/amber}, donc la vie théorétique, porte sur un objet {coral}qui ne peut être autrement qu'il n'est{/coral}, c'est-à-dire {violet}nécessaire{/violet} (VI, 3). D'où trois sciences théorétiques : les {yellow}mathématiques{/yellow}, la {yellow}physique{/yellow}, la {yellow}théologie{/yellow} (*Métaphysique*, E, 1).
    - {amber}La vie pratique{/amber} porte sur ce qui peut être autrement qu'il n'est, le {violet}contingent{/violet}. Seules les réalités contingentes, les affaires humaines et celles de la cité, font l'objet de la {violet}délibération{/violet} (*bouleusis*, la détermination des moyens en vue d'une fin) : on ne délibère pas sur ce qui ne peut pas être autrement.

    **Action et production.** La {violet}*praxis*{/violet} {green}est à elle-même sa propre fin{/green} : l'homme agit sur l'homme, qu'il transforme la cité par la politique ou se transforme lui-même par l'éthique. La {violet}*poièsis*{/violet} {red}produit en dehors de soi{/red}.

    **Deux parties de l'âme rationnelle** (VI, 2), chacune avec sa vertu intellectuelle :
    - la partie contemplative ou scientifique, l'{violet}*épistèmonikon*{/violet}, dont la vertu est la {violet}*sophia*{/violet}, connaissance à la fois de l'intellection (*noûs*) des premiers principes et de la science (*épistèmè*) qui en tire les conclusions (VI, 7) ;
    - la partie calculative ou délibérative, le {violet}*logistikon*{/violet}, dont la vertu est la {violet}*phronèsis*{/violet} : {coral}la capacité d'adapter la norme d'action à la singularité de chaque situation{/coral}, et de saisir le moment opportun, le {violet}*kairos*{/violet}.

    | Mode de vie | Partie de l'âme | Réalités | Modalité | Vertu |
    | théorétique | contemplative | éternelles | nécessité | sophia |
    | pratique | calculative | temporelles | contingence | phronèsis |

    **Deux aspects d'une même excellence.** {sky}Joly{/sky} : {teal}« Le type complet de l'humanité ne se réalise que par la mise en pratique de toutes les vertus{/teal}, les deux vies pratique et contemplative sont deux aspects corrélatifs de l'activité de l'homme par excellence. {teal}La vie pratique est le propre de l'homme, la vie contemplative est le propre de Dieu{/teal} ; mais l'homme étant divin par son esprit, la vie contemplative appartient aussi à l'homme, avec toutes les limitations imposées par la nature humaine. »
