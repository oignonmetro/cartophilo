- id: vies6-l3
  title: "Plus qu'humaine : les deux logiques de l'Éthique"
  notes: |-
    **Le paradoxe demeure, que Pierre-Marie Morel résume ainsi** : {teal}« la vie théorétique est la plus propre à l'homme, mais elle ne l'est que parce qu'elle est plus qu'humaine{/teal} ; {teal}seule la vie pratique est au sens strict proprement humaine »{/teal}.

    **La hiérarchie du livre X, 7.** La vie contemplative correspond à l'activité de l'{violet}intellect{/violet} (*noûs*), partie la plus élevée de l'âme, puisque divine. Elle est donc conforme à la plus haute des vertus, et procure {green}le bonheur parfait{/green}, avec :
    - {amber}le plus grand des plaisirs{/amber} ;
    - {amber}la plus grande autarcie{/amber}, puisque la présence d'autrui ne lui est pas nécessaire ;
    - {amber}la *scholè*{/amber}, le temps libéré des affaires.

    **Deux logiques, selon {sky}Morel{/sky} :** {teal}« La logique éthico-anthropologique{/teal} privilégie la question {teal}"quel est le genre de vie le plus conforme à la fonction propre de l'homme en tant qu'homme ?"{/teal} et met au premier plan la vie pratique, tout en admettant qu'il y a plusieurs manières d'être heureux. {teal}La logique cosmo-théologique{/teal} privilégie la question {teal}"quel est le bonheur le plus parfait absolument parlant ?"{/teal} et nous conduit à répondre qu'il s'agit de {teal}la seule vie divine qu'un homme puisse mener, à savoir la vie contemplative{/teal}. »

    | Logique | Question | Réponse |
    | éthico-anthropologique | la vie conforme à l'homme en tant qu'homme | la vie pratique |
    | cosmo-théologique | le bonheur le plus parfait absolument | la vie contemplative |

    **Une hiérarchie sans rejet.** La vie pratique permet à l'homme d'accomplir sa fonction propre {coral}en tant qu'homme{/coral} ; la vie contemplative, {coral}en tant qu'il n'est pas qu'homme{/coral}. Car il y a en l'homme une part divine, l'intellect, qui l'oblige, pour atteindre le bonheur parfait, à {teal}« dans la mesure du possible, s'immortaliser »{/teal} (*Éthique à Nicomaque*, X, 7).
