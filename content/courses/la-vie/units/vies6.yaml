- id: vies6-l2
  title: "La fonction propre de l'homme"
  notes: |-
    **Aristote part d'une enquête sur la fonction propre (*ergon*) de l'homme : quel type de vie le caractérise ?** (*Éthique à Nicomaque*, I, 6) : {teal}« Le simple fait de vivre{/teal} [*zên*] {teal}est{/teal}, de toute évidence, {teal}une chose que l'homme partage en commun même avec les végétaux{/teal} ; or ce que nous recherchons, c'est {teal}ce qui est propre{/teal} [*idion*] {teal}à l'homme{/teal}. Nous devons donc laisser de côté la vie [*zôèn*] de nutrition et la vie de croissance. Viendrait ensuite {teal}la vie sensitive{/teal}, mais celle-là encore apparaît {teal}commune avec le cheval, le bœuf et tous les animaux{/teal}. Reste donc {teal}une certaine vie pratique{/teal} [*praktikè*] {teal}de la partie rationnelle de l'âme{/teal} [...]. [...] le bien pour l'homme consiste dans {teal}une activité de l'âme en accord avec la vertu{/teal}, et, au cas de pluralité de vertus, en accord avec la plus excellente et la plus parfaite d'entre elles. »

    **Le raisonnement procède par élimination**, comme on cherche ce qu'un outil fait que les autres ne font pas :
    - {yellow}se nourrir, croître{/yellow} : commun avec les végétaux, donc pas propre à l'homme ;
    - {yellow}sentir{/yellow} : commun avec le cheval, le bœuf, tous les animaux ;
    - reste {coral}la vie de la partie rationnelle{/coral} : l'homme seul possède le *logos*.

    On ne parle donc de mode de vie que pour {amber}la vie qui permet à l'homme d'accomplir sa fonction propre{/amber} : une {coral}vie pratique de la raison{/coral}.

    **D'où une confusion apparente.** Le livre X, notamment au chapitre 7, établit {red}la supériorité de la vie contemplative sur la vie pratique{/red} : Aristote se contredit-il ? Non, car le bonheur y est défini comme {teal}« une activité [*energeia*] conforme à la vertu »{/teal} (X, 7), et placé dans une {teal}« certaine activité théorétique »{/teal} (*theôrètikè [...] energeia*) (X, 8). {coral}L'activité ne se réduit pas à la *praxis* : la contemplation en est aussi un type.{/coral}
  points:
