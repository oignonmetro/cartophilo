    answer: "15"
    alt: ["quinze"]
  - id: sep-vie4-l4-p4
    sentence: "Les recherches sur l'utérus ___ compliquent les questions traditionnelles de l'avortement."
    answer: "artificiel"
    alt: []
  - id: sep-vie4-l4-p5
    sentence: "Le ___ vise à améliorer par la technique la vie sociale, psychologique et physique des humains, des prothèses au téléchargement de l'esprit."
    answer: "transhumanisme"
