- id: sep-vie4-l5
  title: "Ne pas fonder sa morale sur la biologie"
  notes: |-
    **Que la vie soit une source de controverses éthiques, juridiques et politiques n'a rien d'étonnant.** L'article ne tranche pas ces débats ; mais il en tire une mise en garde.

    **Il y a un consensus minimal sur quatre points** :
    - ce qu'est la vie ;
    - ce qu'est un organisme vivant individuel ;
    - quand commencent et finissent les vies individuelles ;
    - quels traits de la vie fondent la considérabilité morale.

    **D'où la conclusion.** {red}__On ne devrait pas invoquer la biologie pour fonder ses positions morales, à moins de vouloir qu'elles soient vagues et non concluantes.__{/red} Celui qui dit « c'est une vie, donc il faut la protéger » s'appuie sur un concept que la biologie elle-même ne fixe pas : sa conclusion hérite de ce flou.

    ! La mise en garde ne dit pas que la morale doit ignorer la biologie : elle dit que la biologie ne tranchera pas à sa place les questions de valeur.
  points:
  - id: sep-vie4-l5-p1
    sentence: "Il n'y a qu'un consensus ___ sur ce qu'est la vie, sur ce qu'est un organisme individuel, sur le début et la fin des vies, et sur les traits qui fondent la considérabilité morale."
    answer: "minimal"
    alt: []
  - id: sep-vie4-l5-p2
    sentence: "On ne devrait pas invoquer la ___ pour fonder ses positions morales, à moins de vouloir qu'elles soient vagues et non concluantes."
    answer: "biologie"
    alt: []
  - id: sep-vie4-l5-p3
    sentence: "Qui dit « c'est une vie, donc il faut la protéger » s'appuie sur un concept que la biologie ne fixe pas : sa conclusion hérite de ce ___."
    answer: "flou"
    alt: []
- id: sep-vie4-l6
  title: "Trois issues : découvrir, décider, distinguer"
  notes: |-
    **Le terrain est bien couvert, mais aucune vue ne s'impose**, et vu la diversité des disciplines, des valeurs explicatives et des engagements théoriques, cela changera difficilement. Pourtant, bien des pratiques reposent sur des conceptions concurrentes de la vie. Trois issues sont possibles.

    **Une découverte.** Comme la théorie atomique a créé de nouvelles divisions, tenues pour plus réelles que les catégories des anciens et des alchimistes, des découvertes pourraient montrer {green}un faisceau clair de la façon dont des entités complexes, semblables au vivant, se forment à partir de la chimie prébiotique{/green}, et convaincre la majorité.

    **Une décision.** Les communautés scientifiques pourraient aussi trancher selon des valeurs ou des buts partagés. L'exemple de la **mort** : après des décennies de débat, {coral}les médecins n'ont pas fait une découverte, mais pris une décision{/coral}. Ils ont jugé que l'**irréversibilité** de la mort était la propriété la plus importante pour leurs fins, et ont adopté la {violet}mort cérébrale totale{/violet} comme critère opérationnel. {coral}Les faits n'ont pas changé ; la compréhension partagée, si.{/coral}

    **Une distinction : la polysémie.** Enfin, la vie pourrait être acceptée comme un concept **polysémique**, chaque faisceau de définitions valant pour un sous-ensemble : vie biochimique, évolutive, métabolique. L'exemple des **planètes** (Brusse 2016) : la catégorie, jusqu'à la Renaissance, comprenait le Soleil et la Lune ; les astéroïdes, d'abord planètes, deviennent « petites planètes », puis astéroïdes ; **Pluton**, découverte en 1930, est la plus petite planète jusqu'à ce que, de 1992 à 2006, on trouve beaucoup d'objets semblables. Les astronomes redéfinissent alors le terme : une {violet}« planète »{/violet} couvre aujourd'hui deux catégories, les planètes typiques et les **planètes naines**. De même, certaines catégories de définitions de la vie pourraient devenir des sous-catégories reconnues.

    | Issue | Modèle | Ce qui change |
    | découverte | la théorie atomique | les faits connus |
    | décision | la mort cérébrale | la compréhension partagée |
    | polysémie | les planètes naines | les sous-catégories |

    **Combien de temps cela durera-t-il ?** Nous sommes peut-être à des jours ou à des décennies d'une découverte ou d'une décision. Pour l'heure, le débat continue.
