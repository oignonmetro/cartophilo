    answer: "sentience"
    alt: []
- id: sep-vie4-l4
  title: "Quand commence une vie humaine ? Les techniques et le transhumanisme"
  notes: |-
    **Si des vivants ont un statut moral propre, la plupart des philosophes y comptent les humains.** Il importe alors de savoir **quand** un individu humain commence d'exister et acquiert ce statut : à la conception, à la naissance, ou entre les deux. Or {red}__la biologie du développement ne fournit pas de point de départ incontesté du début de la « vie »__{/red} (Maienschein 2014). Les décideurs et les médecins tracent pourtant des lignes, selon la possibilité d'une vie autonome, la sentience ou d'autres traits.

    **Les opinions, détaillées, sont nuancées.** Le clivage {pink}*pro-life*{/pink} / {pink}*pro-choice*{/pink} persiste, atténué en Europe. Mais question par question, la plupart des gens sont favorables au choix en cas de malformation, de santé de la femme ou de viol : {coral}seuls 15 % environ des répondants sont constamment *pro-life* dans tous les scénarios{/coral} (Osborne et al. 2022). Des débats analogues touchent l'euthanasie, la peine de mort, la guerre ; engagements éthiques et métaphysiques y comptent ensemble.

    **Les techniques posent de nouvelles questions.** Contraception, procédés d'avortement, prématurés sauvés : chaque technique a rendu l'avortement plus disputé. Les recherches sur l'{violet}utérus artificiel{/violet} compliquent encore les choses : même si un fœtus pouvait être mené à terme artificiellement, cela exigerait un traitement médical et une parenté génétique, sans parler du coût d'élever un enfant.

    **Le {violet}transhumanisme{/violet}** vise à améliorer par la technique la vie sociale, psychologique et physique des humains : prothèses, implants, médicaments, jusqu'au « téléchargement » de l'esprit. Les {violet}bioconservateurs{/violet} s'y opposent pour des raisons pratiques, morales ou esthétiques ; les {violet}posthumanistes{/violet} espèrent un monde où les humains seraient remplacés par des intelligences artificielles. Savoir si ces posthumains seraient « vivants » a la même structure que le débat sur la vie artificielle. On y discute : une technique est-elle {pink}thérapie ou amélioration{/pink} ? les risques l'emportent-ils sur les bénéfices ? quels changements modifient le statut moral ou ontologique de qui les reçoit ?
  points:
  - id: sep-vie4-l4-p1
    sentence: "La biologie du ___ ne fournit pas de point de départ incontesté du début de la « vie » humaine (Maienschein 2014)."
    answer: "développement"
    alt: []
  - id: sep-vie4-l4-p2
    sentence: "Faute de point de départ biologique incontesté, décideurs et médecins tracent des lignes selon la possibilité d'une vie autonome, la ___ ou d'autres traits."
    answer: "sentience"
    alt: []
  - id: sep-vie4-l4-p3
