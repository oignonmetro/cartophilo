lessons:
- id: sep-vie4-l1
  title: "Les virus et la zone crépusculaire de la microbiologie"
  notes: |-
    **Les scientifiques s'intéressent aux questions philosophiques quand ils prennent conscience de leurs limites ou de leurs choix conceptuels** : ceux qui étudient le temps profond, l'espace lointain, l'abstrait ou l'éthique les rencontrent. Le concept de vie compte aussi **au-dessous et au-dessus de l'organisme**.

    **Les virus.** Ce sont des unités de matériel génétique enfermées dans une enveloppe de protéines. On ignore s'ils ont tous un ancêtre commun, et comment ils sont nés : éléments transposables échappés, cellules réduites, ou troisième voie ancestrale. Leur statut de vivant est disputé, en **trois camps** :
    - pour les uns, les virions sont {green}vivants{/green} ;
    - pour d'autres, {red}ils ne le sont pas{/red} ;
    - pour un troisième camp, {pink}ils ne vivent que dans une cellule infectée{/pink}, et ne sont hors d'elle qu'une simple {yellow}« graine »{/yellow} (Forterre 2010).

    **La {violet}« zone crépusculaire de la microbiologie »{/violet}** (Postgate 1999). Elle comprend les éléments transposables, les viroïdes, les microbes non cultivables, les organismes en état végétatif, les prions. {coral}__Le problème est le même pour tous : ils ont certaines des propriétés associées à la vie, mais pas toutes.__{/coral} Les **prions**, par exemple, sont des protéines, produits de la vie, capables de replier d'autres prions de façon à permettre une évolution cumulative ; on les range pourtant rarement parmi les vivants, à cause de leur inactivité la plupart du temps et de leur grande simplicité.

    ! Le cas des virus montre que la question « vivant ou non ? » dépend du concept de vie retenu : la troisième position fait de la vie un état que l'on traverse, non une propriété que l'on a.
  points:
  - id: sep-vie4-l1-p1
    sentence: "Les ___ sont des unités de matériel génétique enfermées dans une enveloppe de protéines, dont le statut de vivant est disputé."
    answer: "virus"
    alt: []
  - id: sep-vie4-l1-p2
    sentence: "Un troisième camp tient que les virus ne vivent que dans une cellule ___, et ne sont hors d'elle qu'une simple « graine » (Forterre 2010)."
    answer: "infectée"
    alt: []
  - id: sep-vie4-l1-p3
    sentence: "Pour Forterre (2010), un virus hors d'une cellule infectée n'est qu'une simple « ___ »."
    answer: "graine"
    alt: []
  - id: sep-vie4-l1-p4
    sentence: "Les éléments transposables, viroïdes, microbes non cultivables et prions forment la « zone ___ de la microbiologie » (Postgate 1999)."
    answer: "crépusculaire"
    alt: []
  - id: sep-vie4-l1-p5
    sentence: "Le problème commun aux entités de la zone crépusculaire de la microbiologie : elles ont certaines des propriétés associées à la vie, mais pas ___."
    answer: "toutes"
    alt: []
  - id: sep-vie4-l1-p6
    sentence: "Les prions sont des protéines capables de replier d'autres prions de façon à permettre une évolution ___."
    answer: "cumulative"
    alt: []
  - id: sep-vie4-l1-p7
    sentence: "On range rarement les prions parmi les vivants, à cause de leur ___ la plupart du temps et de leur grande simplicité."
    answer: "inactivité"
    alt: []
- id: sep-vie4-l2
  title: "Au-dessus de l'organisme : colonies et Gaïa"
  notes: |-
    **Il y a aussi une zone crépusculaire de l'écologie.** Les organismes forment populations, espèces, lignées, clades, écosystèmes : leur statut est ouvert, mais ils ont beaucoup des traits associés à la vie.

    **Le meilleur candidat : les insectes eusociaux** (certaines fourmis, abeilles, guêpes, termites). Chez plusieurs espèces, une distinction rigide sépare {pink}les castes qui se reproduisent{/pink} de {pink}celles qui ne se reproduisent pas{/pink}, beaucoup de ces dernières s'occupant des jeunes : la colonie ressemble à un organisme dont les ouvrières seraient les organes.

    **Mais une règle joue contre les entités supérieures.** {red}__Les entités au-dessus de l'organisme sont en règle générale moins intégrées que les organismes qui les composent.__{/red} À chaque échelon de la hiérarchie biologique, les parties sont bien plus homogènes que le tout : nos cellules semblent plus intégrées et autonomes que notre corps ; une fourmi est plus autonome que sa colonie.

    **Gaïa.** Le cas le plus controversé. Gaïa, figure de la mythologie grecque, personnifie la Terre. En 1979, James **Lovelock** reprend le nom dans *Gaia: A New Look at Life on Earth* : l'ensemble des écosystèmes de la planète, imbriqués, peut se voir comme {violet}une seule entité{/violet}, un **système homéostatique autorégulé**. Une de ses idées compte pour la recherche de vie : {coral}c'est à l'échelle planétaire que se détecte la vie ailleurs{/coral}. Mais beaucoup jugèrent le modèle inexact : {red}la Terre ne peut, par principe, évoluer{/red} (elle ne se reproduit pas et n'est pas sélectionnée parmi d'autres), et lui accorder le statut de vivant était immotivé (Doolittle 1981). Des tentatives récentes le refondent sur des mécanismes régulateurs biotiques et abiotiques et une sélection au niveau des clades (Lenton et al. 2018, Doolittle 2025). Quoi qu'il en soit, l'idée d'une Terre vivante a motivé beaucoup de membres du mouvement écologiste.
  points:
  - id: sep-vie4-l2-p1
    sentence: "Il y a une zone crépusculaire de l'___ : populations, espèces, lignées, clades et écosystèmes ont beaucoup des traits associés à la vie, mais leur statut est ouvert."
    answer: "écologie"
    alt: []
  - id: sep-vie4-l2-p2
    sentence: "Le meilleur candidat à la vie au-dessus de l'organisme est celui des insectes ___, dont les castes reproductrices et stériles se distinguent rigidement."
    answer: "eusociaux"
    alt: []
  - id: sep-vie4-l2-p3
    sentence: "Les entités au-dessus de l'organisme sont en règle générale moins ___ que les organismes qui les composent."
    answer: "intégrées"
    alt: []
  - id: sep-vie4-l2-p4
    sentence: "À chaque échelon de la hiérarchie biologique, les parties sont plus ___ que le tout : nos cellules semblent plus intégrées que notre corps."
    answer: "homogènes"
    alt: []
  - id: sep-vie4-l2-p5
    sentence: "En 1979, James ___ voit dans l'ensemble des écosystèmes de la Terre une seule entité, Gaïa, système homéostatique autorégulé."
    answer: "Lovelock"
    alt: []
  - id: sep-vie4-l2-p6
    sentence: "Lovelock conçoit la Terre comme un système ___ autorégulé."
    answer: "homéostatique"
    alt: []
  - id: sep-vie4-l2-p7
    sentence: "Objection à Gaïa (Doolittle 1981) : la Terre ne peut, par principe, ___, puisqu'elle ne se reproduit pas et n'est pas sélectionnée parmi d'autres."
    answer: "évoluer"
    alt: []
  - id: sep-vie4-l2-p8
    sentence: "Une idée de Lovelock compte pour la recherche de vie ailleurs : c'est à l'échelle ___ que la vie se détecte."
    answer: "planétaire"
    alt: []
  - id: sep-vie4-l2-p9
    sentence: "Quoi qu'il en soit de sa justification théorique, l'idée d'une Terre vivante a motivé beaucoup de membres du mouvement ___."
    answer: "écologiste"
