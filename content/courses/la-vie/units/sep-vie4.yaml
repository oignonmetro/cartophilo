- id: sep-vie4-l3
  title: "La vie n'est pas la valeur"
  notes: |-
    **Hors de la science, le mot « vie » importe surtout au début et à la fin des vies individuelles** : contraception et avortement d'un côté ; de l'autre, la fin de vie, débattue depuis que des techniques maintiennent des corps humains en vie bien au-delà de ce que la nature permettrait, et l'{violet}euthanasie{/violet}, mort volontaire pour soulager la douleur.

    **Il faut d'abord distinguer la vie de ce qu'on confond avec elle.** Dans le discours public, {red}l'existence de la vie se confond souvent avec sa valeur{/red}. Or on peut distinguer la vie de la {violet}sentience{/violet}, de la {violet}personne{/violet} et de la {violet}considérabilité morale{/violet}.

    **La pratique dément la valeur de la vie comme telle.** Beaucoup semblent supposer que la vie apporte avec elle une considérabilité morale ; mais {coral}la plupart des humains tuent sans scrupule des bactéries par propreté, et beaucoup mangent ou portent la chair d'animaux{/coral}. Donc, dans bien des discussions, {green}__la vie n'a de valeur que comme véhicule d'autres propriétés, elles-mêmes nébuleuses, qui confèrent la valeur__{/green} : sentience, personne, considérabilité morale, voire âme immatérielle.

    **Une position de départ.** Attribuer une valeur morale à des êtres non vivants reste minoritaire (mais voir Leopold 1949). On peut donc partir de ceci : {coral}la vie est une condition préalable de la sentience, et la sentience de la considérabilité morale{/coral} (Birch 2024). Mais attribuer la vie suppose un concept de vie : les deux sont contestés.

    ! Dire que la vie n'est pas la valeur n'est pas dire que la vie n'a pas de valeur : c'est dire que la valeur vient d'autre chose que du seul fait d'être vivant.
  points:
  - id: sep-vie4-l3-p1
    sentence: "La mort volontaire pour soulager la douleur et la souffrance, l'___, reste controversée."
    answer: "euthanasie"
    alt: []
  - id: sep-vie4-l3-p2
    sentence: "Dans le discours public, l'existence de la vie se confond souvent avec sa ___."
    answer: "valeur"
    alt: []
  - id: sep-vie4-l3-p3
    sentence: "On peut distinguer la vie de la ___ (capacité de ressentir), de la personne et de la considérabilité morale."
    answer: "sentience"
    alt: []
  - id: sep-vie4-l3-p4
    sentence: "On peut distinguer la vie de la sentience, de la personne et de la ___ morale, c'est-à-dire du fait de compter moralement."
    answer: "considérabilité"
    alt: []
  - id: sep-vie4-l3-p5
    sentence: "La pratique dément que la vie confère par elle-même une considérabilité morale : la plupart des humains tuent sans scrupule des ___ par propreté."
    answer: "bactéries"
    alt: []
  - id: sep-vie4-l3-p6
    sentence: "Dans bien des discussions, la vie n'a de valeur que comme ___ d'autres propriétés qui confèrent la valeur : sentience, personne, voire âme immatérielle."
    answer: "véhicule"
    alt: []
  - id: sep-vie4-l3-p7
    sentence: "Position de départ possible (Birch 2024) : la vie est une condition préalable de la sentience, et la sentience de la ___ morale."
    answer: "considérabilité"
    alt: []
  - id: sep-vie4-l3-p8
