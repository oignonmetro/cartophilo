lessons:
- id: vies5-l1
  title: "Quelle vie faut-il mener ?"
  notes: |-
    **Face à Calliclès, Socrate pose la question fondamentale de toute existence : quel type de vie faut-il adopter ?** (*Gorgias*, 500c) : {teal}« {/teal}La question dont nous parlons [...] n'est-elle pas celle de laquelle s'occuperait avec le plus de sérieux, même un homme qui a peu de réflexion : de savoir {teal}quelle doit être notre manière de vivre{/teal} [*tropon zèn*] ? si ce doit être celle à laquelle tu me convies, qui consiste à {teal}se conduire comme se conduit un homme{/teal} [...] ; à prendre la parole dans l'Assemblée du Peuple, à pratiquer l'art oratoire [...] ? ou bien si c'est {teal}la vie{/teal} [*bion*] {teal}que voici, celle de la philosophie ?{/teal} »

    **Le vocabulaire.** Le passage appelle {violet}*bios*{/violet} un « mode de vie » ({violet}*tropon zèn*{/violet}, littéralement « vivre d'une certaine manière »).

    **L'alternative entre deux modes de vie.**
    - {red}La vie pratique{/red}, consacrée à la politique et aux affaires de l'homme au sens de l'{violet}*anèr*{/violet}, le mâle, opposé à *gunè*, la femme (et non l'homme générique, *anthrôpos*) : le citoyen athénien, l'homme libre. Elle exclut donc {yellow}les esclaves, les femmes, tous les non-citoyens{/yellow}.
    - {green}La vie philosophique{/green} : par opposition, on peut supposer qu'elle ne s'occupe pas des affaires de la cité, et {coral}qu'elle n'est pas réservée aux seuls hommes{/coral}.
  points:
  - id: vies5-l1-p1
    sentence: "Platon, *Gorgias* : la question la plus sérieuse est « de savoir quelle doit être notre manière de ___ » [*tropon zèn*]."
    answer: "vivre"
    alt: []
  - id: vies5-l1-p2
    sentence: "Dans le *Gorgias*, *bios* désigne un mode de vie, *___ zèn*, littéralement « vivre d'une certaine manière »."
    answer: "tropon"
    alt: []
  - id: vies5-l1-p3
    sentence: "Socrate demande à Calliclès quelle vie mener, la vie politique ou celle de la philosophie, dans le *Gorgias*, en ___."
    answer: "500c"
    alt: []
  - id: vies5-l1-p4
    sentence: "La vie pratique que Calliclès propose est celle de l'*___*, l'homme au sens du mâle, opposé à la femme, c'est-à-dire du citoyen."
    answer: "anèr"
    alt: ["aner", "anêr"]
  - id: vies5-l1-p5
    sentence: "Réservée au citoyen mâle, la vie politique exclut les esclaves, les ___ et tous les non-citoyens ; la vie philosophique n'est pas réservée aux seuls hommes."
    answer: "femmes"
    alt: []
- id: vies5-l2
  title: "Le réquisitoire de Calliclès"
  notes: |-
    **Pour Calliclès, la philosophie est un plaisir de jeunesse, ruineux au-delà** (*Gorgias*, 484c-e) : {teal}« {/teal}La philosophie en effet a certainement, Socrate, son agrément, {teal}à condition qu'on s'y applique avec modération dans la jeunesse{/teal} ; mais, si l'on y passe plus de temps qu'il ne faut, {teal}cela est ruineux pour un homme{/teal}. [...] C'est un fait que le philosophe {teal}perd toute expérience des lois qui sont celles de la cité{/teal} ; du langage dont il faut user dans les conventions [...] ; des plaisirs comme des passions des hommes ; bref, il perd, d'une façon générale, {teal}toute expérience des mœurs{/teal} [*tôn èthôn*]. »

    **Deux griefs.** La philosophie est {red}apolitique{/red} : elle éloigne des droits et devoirs du citoyen. Et elle s'oppose à tout plaisir et tout désir, soit à la {violet}vie apolaustique{/violet}, la vie de jouissance. Car pour Calliclès, {coral}le bonheur réside dans la jouissance du pouvoir qui permet de satisfaire ses désirs{/coral}. D'où le mot de {sky}Joly{/sky} : {teal}« la vie de Calliclès réunit la vie politique et la vie apolaustique{/teal}, elle permet d'assouvir les deux plus grandes passions que sont {teal}l'ambition et le plaisir »{/teal}. Ces deux vies n'en font qu'une, l'{violet}*èthos*{/violet} qui fait l'homme de valeur, le {violet}*kalos kagathos*{/violet}, et la bonne réputation.

    **La philosophie n'est pas une vie digne d'un homme** (485d-e) : {teal}« {/teal}quand c'est justement un homme d'âge que je vois faire encore de la philosophie [...], {teal}cet homme-là, Socrate, me semble avoir dorénavant besoin des verges{/teal}. [...] c'est le fait de cet homme-là [...] de finir par {teal}ne pas se comporter en homme{/teal} [*anandrô*], de {teal}fuir comme il le fait le centre de la cité{/teal} et ces places [*tas agoras*] sur lesquelles, comme dit le poète, "se font remarquer les hommes" [...], et de passer le reste de sa vie, {teal}enfoncé dans un coin, à chuchoter en compagnie de trois ou quatre adolescents{/teal}, sans jamais rien proférer de libre, de grand, et, tout au moins, de suffisant ! »

    **Le philosophe est {violet}*anandros*{/violet}, sans virilité** : il refuse les fonctions politiques auxquelles le citoyen est destiné, et ne peut donc jouir de la parole libre du citoyen, l'{violet}*isègoria*{/violet}.
  points:
  - id: vies5-l2-p1
    sentence: "Calliclès : la philosophie a son agrément, « à condition qu'on s'y applique avec modération dans la ___ »."
    answer: "jeunesse"
    alt: []
  - id: vies5-l2-p2
    sentence: "Calliclès : le philosophe perd, d'une façon générale, « toute expérience des ___ »."
    answer: "mœurs"
    alt: ["moeurs"]
  - id: vies5-l2-p3
    sentence: "Calliclès reproche à la philosophie de s'opposer à tout plaisir et tout désir, soit à la vie ___, la vie de jouissance."
    answer: "apolaustique"
    alt: []
  - id: vies5-l2-p4
    sentence: "Joly : « la vie de Calliclès réunit la vie politique et la vie apolaustique, elle permet d'assouvir les deux plus grandes passions que sont l'___ et le plaisir »."
    answer: "ambition"
    alt: []
  - id: vies5-l2-p5
    sentence: "Calliclès : un homme d'âge qui fait encore de la philosophie « me semble avoir dorénavant besoin des ___ »."
    answer: "verges"
    alt: []
  - id: vies5-l2-p6
    sentence: "Calliclès : le vieux philosophe passe sa vie « enfoncé dans un coin, à ___ en compagnie de trois ou quatre adolescents »."
    answer: "chuchoter"
    alt: []
  - id: vies5-l2-p7
    sentence: "Le portrait du philosophe qui fuit l'agora et mérite les verges se lit dans le *Gorgias*, en 485___."
    answer: "d-e"
    alt: ["d"]
  - id: vies5-l2-p8
    sentence: "Pour Calliclès, le philosophe est *___*, sans virilité : il refuse les fonctions politiques auxquelles le citoyen est destiné."
    answer: "anandros"
    alt: []
  - id: vies5-l2-p9
    sentence: "En fuyant les fonctions politiques, le philosophe ne peut jouir de la parole libre du citoyen, l'*___*."
    answer: "isègoria"
    alt: ["isegoria", "isêgoria", "isègoriè"]
- id: vies5-l3
  title: "Socrate retourne l'accusation"
  notes: |-
    **La vie philosophique, incarnée par Socrate, subvertit chacun de ces griefs en se les réappropriant.**
    - Accusé de fuir le centre de la cité, {green}Socrate passe son temps dans les rues et sur les places publiques{/green}.
    - Accusé de ne rien dire de libre, il fait preuve de {violet}*parrhèsia*{/violet}, le {green}franc-parler{/green} (*Gorgias*, 487a).
    - Accusé d'être apolitique, {green}il prétend être le seul à s'occuper du véritable art politique{/green}, en disant non ce qui plaît mais ce qui vaut le mieux (521d).

    **Loin d'être un sous-homme, le philosophe se voit promettre une place parmi les Bienheureux** (523a sq.) : {teal}« {/teal}Voici quelle est cette loi : si un homme meurt {teal}après avoir vécu une vie de justice et de piété{/teal}, qu'il se rende {teal}aux Îles des Bienheureux{/teal} [...] ; mais s'il a vécu sans justice ni respect des dieux, qu'il se dirige vers la prison où on paie sa faute [...], cette prison qu'on appelle {teal}le Tartare{/teal}. »

    **Platon réduit ainsi les trois vies à deux :**
    - {green}la vie juste{/green}, synonyme de vie philosophique et de vie véritablement politique : {coral}le mode de vie dominé par la raison{/coral} ;
    - {red}la vie injuste{/red}, qui réunit la vie politique au sens courant et la vie apolaustique : le mode de vie dominé par les désirs et les passions.

    **Et il déplace le sens de la valeur** : le *kalos kagathos* n'est plus {red}celui qui brille par sa réputation{/red}, mais {green}le vertueux{/green}, qui pratique la {violet}tempérance{/violet} (*sôphrosunè*) et la {violet}justice{/violet} (*dikaiosunè*).
  points:
  - id: vies5-l3-p1
    sentence: "Accusé de ne rien dire de libre, Socrate fait preuve de *___*, le franc-parler (*Gorgias*, 487a)."
    answer: "parrhèsia"
    alt: ["parrhesia", "parrhêsia"]
  - id: vies5-l3-p2
    sentence: "Accusé d'être apolitique, Socrate prétend être le seul à s'occuper du véritable art ___, en disant non ce qui plaît mais ce qui vaut le mieux."
    answer: "politique"
    alt: []
  - id: vies5-l3-p3
    sentence: "Platon, *Gorgias* : qui meurt après une vie de justice et de piété se rend aux Îles des ___."
    answer: "Bienheureux"
    alt: []
  - id: vies5-l3-p4
    sentence: "Platon, *Gorgias* : qui a vécu sans justice ni respect des dieux va vers la prison où on paie sa faute, qu'on appelle le ___."
    answer: "Tartare"
    alt: []
  - id: vies5-l3-p5
    sentence: "Platon réduit les trois vies à deux : la vie juste, dominée par la raison, et la vie ___, qui réunit la vie politique au sens courant et la vie apolaustique."
    answer: "injuste"
    alt: []
  - id: vies5-l3-p6
    sentence: "Pour Platon, le *kalos kagathos* n'est plus celui qui brille par sa réputation, mais le vertueux, qui pratique la justice et la tempérance, en grec *___*."
    answer: "sôphrosunè"
    alt: ["sophrosune", "sôphrosunê", "sophrosunè"]
- id: vies5-l4
  title: "L'égalité géométrique et l'unité des vertus"
  notes: |-
    **Le fondement de la vie juste : l'ordre, selon l'égalité géométrique** (*Gorgias*, 507e-508a) : {teal}« {/teal}À ce qu'assurent les doctes, Calliclès, {teal}le ciel et la terre, les Dieux et les hommes sont liés entre eux par une communauté{/teal}, faite d'amitié et de bon arrangement, de sagesse et d'esprit de justice, et c'est la raison pour laquelle, à cet univers, ils donnent [...] {teal}le nom de cosmos, d'arrangement{/teal}, et non celui de dérangement non plus que de dérèglement. [...] il t'a échappé au contraire que {teal}l'égalité géométrique possède un grand pouvoir{/teal}, chez les Dieux aussi bien que chez les hommes. Mais toi, c'est {teal}à avoir davantage{/teal} que l'on doit, penses-tu, travailler, et {teal}tu es indifférent à la géométrie ! »{/teal}

    **L'unité des vertus.** Juste avant (507c), Platon énumère les vertus de l'homme tempérant, le {violet}*sôphrôn*{/violet} : il est juste, courageux, pieux, et parfaitement bon. Les vertus {coral}s'impliquent mutuellement{/coral} : on ne peut en posséder une sans les autres. Chacune respecte {amber}un ordre{/amber} :

    | Vertu | L'ordre qu'elle respecte |
    | tempérance | entre la raison et le déraisonnable en l'homme |
    | justice | celui de la cité, la place de chacun |
    | piété | entre les hommes et les dieux |
    | courage | entre ce qu'il faut poursuivre et fuir |

    D'où trois conséquences :
    - {coral}morale et bonheur s'accordent{/coral} : l'âme vertueuse est nécessairement heureuse, car le bonheur vient de l'harmonie de l'âme ;
    - la tempérance, ordre de l'âme, ne va pas sans la justice, ordre de la cité : {coral}la vie philosophique ne s'accomplit qu'au sein de la cité{/coral}, et c'est pourquoi Socrate se dit le seul vrai politique ;
    - l'ordre de l'âme et celui de la cité reposent sur {coral}l'ordre cosmique{/coral} et sur l'égalité géométrique.

    **Les « doctes » sont sans doute des pythagoriciens** : {sky}Pythagore{/sky} passait pour avoir le premier appelé l'univers *kosmos* (selon Aétius, *Opinions*, II, 1, 1), et les pythagoriciens furent les premiers à appliquer l'égalité géométrique à l'ordre cosmique.
  points:
  - id: vies5-l4-p1
    sentence: "Platon, *Gorgias* : le ciel et la terre, les Dieux et les hommes sont liés par une communauté, et c'est pourquoi les doctes donnent à l'univers le nom de ___, d'arrangement."
    answer: "cosmos"
    alt: ["kosmos"]
  - id: vies5-l4-p2
    sentence: "Socrate à Calliclès : « il t'a échappé au contraire que l'égalité ___ possède un grand pouvoir, chez les Dieux aussi bien que chez les hommes »."
    answer: "géométrique"
    alt: []
  - id: vies5-l4-p3
    sentence: "Socrate à Calliclès : c'est à avoir davantage que l'on doit, penses-tu, travailler, « et tu es indifférent à la ___ ! »"
    answer: "géométrie"
    alt: []
  - id: vies5-l4-p4
    sentence: "Le reproche fait à Calliclès d'être indifférent à la géométrie se lit dans le *Gorgias*, en 507e-___."
    answer: "508a"
    alt: []
  - id: vies5-l4-p5
    sentence: "Les vertus s'impliquent mutuellement : on ne peut en posséder une sans posséder les autres. C'est l'___ de la vertu."
    answer: "unité"
    alt: []
  - id: vies5-l4-p6
    sentence: "Parce que le bonheur vient de l'harmonie de l'âme, dans la vie vertueuse morale et ___ s'accordent."
    answer: "bonheur"
    alt: []
  - id: vies5-l4-p7
    sentence: "La tempérance, ordre de l'âme, ne va pas sans la justice, ordre de la cité : la vie philosophique ne s'accomplit donc qu'au sein de la ___."
    answer: "cité"
    alt: []
  - id: vies5-l4-p8
    sentence: "Les « doctes » du *Gorgias* sont sans doute des ___ : leur maître passait pour avoir le premier appelé l'univers *kosmos*."
    answer: "pythagoriciens"
    alt: []
- id: vies5-l5
  title: "Deux égalités"
  notes: |-
    **Comment une conception mathématique fonde-t-elle une communauté amicale entre hommes et dieux ?** Le livre VI des *Lois* distingue deux égalités (757a-e) : {teal}« {/teal}Oui, le vieux dicton est vrai qui dit que {teal}l'égalité engendre l'amitié{/teal} [...]. En fait, {teal}il y a deux égalités{/teal} [...]. L'une [...], c'est celle qui est égale {teal}selon la mesure, le poids et le nombre{/teal} ; il suffit de régler la répartition de celle-ci {teal}par le moyen du tirage au sort{/teal}. L'autre en revanche, {teal}l'égalité la plus vraie et la meilleure{/teal}, n'apparaît pas facilement aux yeux de tout le monde. Elle suppose bien sûr le jugement de Zeus [...]. {teal}Au plus important, elle attribue davantage, et au plus petit elle attribue moins{/teal}, donnant une juste part {teal}en proportion de sa nature{/teal} [...]. Car il n'y a pas de doute, pour nous {teal}la politique est toujours cela même : le juste »{/teal}.

    | Égalité | Fondée sur | Elle donne |
    | arithmétique | le nombre | la même chose à chacun |
    | géométrique | la proportion | à chacun ce qui lui convient |

    - {red}L'égalité arithmétique{/red} accorde à chacun la même chose, sans tenir compte de la diversité des individus ni de leur mérite : {amber}les individus y sont interchangeables{/amber}.
    - {green}L'égalité géométrique{/green} repose sur la proportion, l'égalité entre rapports ({yellow}A/B = C/D{/yellow}) : {coral}à l'homme vertueux un grand bonheur, à l'homme vicieux un grand malheur{/coral}.

    **L'égalité géométrique fonde l'ordre, donc la justice** : l'ordre est une hiérarchie, et {coral}l'ordre cosmique sert de modèle à l'ordre social et à l'ordre de l'âme{/coral}. La vie philosophique est donc proprement {green}conforme à la nature{/green}, contre Calliclès pour qui la nature est {red}le dérèglement{/red}, la loi du plus fort et la soumission aux plaisirs. Et elle fonde une {violet}*philia*{/violet} entre dieux et hommes : par la raison vertueuse, partie divine et immortelle de l'âme (*Timée*, 90a-d), {coral}l'homme s'assimile au divin{/coral}.

    **Le renversement est complet.** Pour Calliclès, seules les vies apolaustique et politique rendent heureux et font un homme de valeur. Pour Platon, {green}seule la vie philosophique{/green} atteint le bonheur véritable, en se donnant la vertu pour fin ; seule elle se soucie vraiment de politique ; seule elle accomplit la nature de l'homme, l'exercice de la raison, et l'assimile aux dieux.
  points:
  - id: vies5-l5-p1
    sentence: "Platon, *Lois*, VI : « le vieux dicton est vrai qui dit que l'égalité engendre l'___ »."
    answer: "amitié"
    alt: []
  - id: vies5-l5-p2
    sentence: "Platon, *Lois*, VI : la première égalité, selon la mesure, le poids et le nombre, se répartit par le moyen du ___ au sort."
    answer: "tirage"
    alt: []
  - id: vies5-l5-p3
    sentence: "Platon, *Lois*, VI : l'égalité la plus vraie donne à chacun une juste part « en ___ de sa nature »."
    answer: "proportion"
    alt: []
  - id: vies5-l5-p4
    sentence: "Platon, *Lois*, VI : « pour nous la politique est toujours cela même : le ___ »."
    answer: "juste"
    alt: []
  - id: vies5-l5-p5
    sentence: "La distinction des deux égalités, l'une selon le nombre, l'autre selon la proportion, se trouve dans les *Lois*, livre ___, 757a-e."
    answer: "VI"
    alt: ["6"]
  - id: vies5-l5-p6
    sentence: "L'égalité ___ accorde à chacun la même chose, sans tenir compte du mérite : les individus y sont interchangeables."
    answer: "arithmétique"
    alt: ["numérique"]
  - id: vies5-l5-p7
    sentence: "Fondée sur la proportion, l'égalité géométrique donne à chacun ce qui lui convient : à l'homme vertueux un grand bonheur, à l'homme ___ un grand malheur."
    answer: "vicieux"
    alt: []
  - id: vies5-l5-p8
    sentence: "Parce que l'ordre cosmique sert de modèle à l'ordre social et à l'ordre de l'âme, la vie philosophique est conforme à la ___, contre Calliclès qui la voit dans le dérèglement."
    answer: "nature"
    alt: []
  - id: vies5-l5-p9
    sentence: "Par la raison vertueuse, partie divine et immortelle de l'âme (*Timée*, 90a-d), l'homme s'___ au divin."
    answer: "assimile"
    alt: []
