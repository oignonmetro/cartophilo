- id: sens2-l3
  title: "Recevoir : Démocrite, les épicuriens, la cire"
  notes: |
    D'autres prédécesseurs ont soutenu au contraire que la sensibilité **reçoit passivement** une activité extérieure : les choses perçues pénètrent en quelque sorte dans le sujet, qui reçoit leurs **effluves** ou leurs émanations. La sensation serait l'**impression** que font sur nous les objets. C'est encore le cas chez Hume, pour qui les sensations sont des impressions externes produites sur la scène mentale qu'est l'esprit (*Traité de la nature humaine*, I, IV, 6).

    La conception est paradigmatique chez **Démocrite**, qui conçoit la vision « comme la réception de l'image réfléchie des objets visibles ». Elle deviendra chez les épicuriens la théorie des **simulacres** (Épicure, *Lettre à Hérodote*) : un flux continu d'atomes se détache de la surface des corps, réplique de l'objet ou de son apparence, qui nous fait connaître ses qualités en touchant nos organes. Aristote vise sans doute ce type de thèse quand il évoque ceux qui disent « que la couleur est un effluve et que l'on voit par une cause de ce type » (l'effluve semble chez lui associé à Empédocle). D'où l'image d'une sensation analogue à l'**impression d'un cachet dans la cire**.

    Aristote admet que la sensation modifie le sujet : « toute sensation réside dans le fait de recevoir un mouvement et d'être affecté, comme on l'a dit, puisqu'elle passe pour être une forme d'altération » (*De l'âme*, II, 5). Mais l'« altération » (`alloiôsis`) n'est qu'une opinion admise (« elle passe pour… », `dokei`), un `endoxon`, approximation temporairement valable : la sensation fait passer la sensibilité à l'« acte » (`energeia`), elle est la « réalisation » (`entelecheia`) de sa puissance. Il reprend aussi l'analogie, sans doute démocritéenne, du cachet, et reconnaît à l'objet sensible une activité décisive.

    L'enjeu : comprendre comment la sensibilité peut être à la fois capacité à **recevoir** le mouvement d'un objet et capacité à le **saisir**. Empédocle avançait déjà les deux sans les concilier : tantôt on voit parce que la lumière sort de l'œil, tantôt « à cause des effluves en provenance des objets vus ».

    ! Quand Aristote dit que la sensation « passe pour » une altération, il ne l'affirme pas en son nom propre.
