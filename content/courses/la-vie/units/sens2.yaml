- id: sens2-l5
  title: "La sensation, réalisation de la sensibilité"
  notes: |
    La sensibilité, comme toute faculté de l'âme et comme l'âme elle-même, est une **puissance seconde**. Elle est donnée comme disposition (`hexis`) dès la conception de l'embryon : l'animal, sauf malformation, possède dès sa naissance la capacité de sentir, comme le savant possède la science ; endormi, il la conserve sans l'exercer. « Nous parlons de sentir avec deux significations. De celui qui a la capacité d'entendre ou de voir, nous disons, en effet, qu'il entend ou voit, même si d'aventure il dort », « et nous disons également de celui qui exerce bel et bien ces activités qu'il sent » (*De l'âme*, II, 5).

    La sensation est donc le passage à l'acte d'une puissance seconde, **non une altération** : elle ne transforme pas la sensibilité, elle la **réalise et la parachève**. La sensibilité n'est pas détruite et remplacée par la sensation, comme l'ignorance l'est par la connaissance dans l'apprentissage ; la sensation est la réalisation, l'achèvement et donc l'**essence** de la sensibilité, comme la spéculation l'est de la science du savant.

    D'où l'identité : l'activité du sensible et celle de la sensibilité sont une seule et même chose, et il est vain de demander qui est actif et qui est passif. « La sensibilité, par ailleurs, est potentiellement identique au sensible déjà réalisé, comme on l'a dit. Donc, au moment où elle est affectée, elle n'est pas semblable à celui-ci, mais une fois qu'elle a été affectée, elle se trouve assimilée à lui. » Endormi, le sujet est en puissance identique au sensible ; éveillé et sentant, il l'est en acte.

    ! La sensibilité de l'animal endormi n'a pas disparu : c'est une puissance seconde, non une simple puissance première.
