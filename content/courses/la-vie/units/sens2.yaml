- id: sens2-l2
  title: "Sentir, c'est faire : Platon et Empédocle"
  notes: |
    Une première conception fait de la sensation une **saisie** active du sujet, idée courante aujourd'hui encore. Chez certains prédécesseurs d'Aristote, elle prend la forme d'**émanations** partant des organes des sens vers les objets, qui s'en trouvent comme « éclairés ». Aristote l'attribue à Platon et à Empédocle : « la vision se produit parce que de la lumière sort [de l'œil] comme d'une lanterne » (*De la sensation et des sensibles*, 2), ou, dirait-on aujourd'hui, d'un projecteur.

    Dans le *Timée*, les yeux sont « porteurs de lumière » (`phôsphora`) : un **feu** s'en écoule en flux continu et se mêle à la lumière extérieure ; ce tout, s'il touche quelque chose, « en transmet les mouvements à travers tout le corps jusqu'à l'âme, et nous procure cette sensation grâce à laquelle précisément nous disons que "nous voyons" ». Sans lumière extérieure, ce feu s'éteint : d'où l'absence de vision dans l'obscurité. La suite explique la réflexion de la lumière dans les miroirs.

    Ces explications ont un caractère **mythique** ; Aristote les lit **littéralement** pour en montrer l'absurdité. Mais elles imagent une vérité qu'il retient : sentir, c'est **faire**, non simplement recevoir. La sensibilité n'est pas une « scène de théâtre » où joueraient les qualités sensibles (l'image est de Hume), mais une faculté de saisie.

    D'où l'**analogie** entre sensation et intellection (*De l'âme*, II, 5) : elles diffèrent non par leur fonctionnement, mais par leurs **objets**, qui « viennent de l'extérieur » (les sensibles, particuliers) ou « résident en quelque sorte dans l'âme elle-même » (les intelligibles, universels). Or l'intellection est une activité, et même, à la fin de l'*Éthique à Nicomaque*, l'une de celles qui s'identifient au bonheur. La sensation est donc elle aussi une activité : une saisie **précognitive**.

    ! Aristote récuse les émanations de l'œil, pas la dimension active de la sensibilité.
