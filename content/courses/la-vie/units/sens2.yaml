- id: sens2-l1
  title: "L'identité de l'acte du sensible et de la sensibilité"
  notes: |
    Une faculté est une « disposition » (`hexis`) ; toute disposition, en tant que « puissance » (`dunamis`), se connaît par son « activité » (`energeia`). Aristote le dit des facultés de l'âme : « il faut encore préciser au préalable ce qu'est le fait de penser, et ce qu'est le fait de sentir, parce que les facultés sont précédées par les actes et les actions, selon l'ordre logique » (*De l'âme*, II, 3). Penser la faculté sensitive, c'est donc examiner ce qui se passe quand un animal sent.

    Pour Aristote, la sensation est une **identification** de l'objet senti et de la faculté de sentir. C'est la fameuse formule : « l'acte du sensible et celui de la sensibilité sont un seul et même <acte> » (*De l'âme*, III, 2) ; leurs activités sont « une et identiques » (`autè kai mia`). Conséquence : la sensibilité n'est pas une faculté essentiellement **suspecte ou trompeuse**, même si elle peut l'être ; elle donne la connaissance des réalités sensibles **particulières** qui entourent le sujet.

    Cette thèse prétend dépasser l'opposition de deux familles de conceptions, que portent des traditions différentes :

    | Conception | La sensation est…              | Le sujet | L'objet            |
    | Active     | une activité, une saisie       | actif    | strictement passif |
    | Passive    | une altération, une réception  | passif   | actif              |

    ! L'identité de l'acte ne supprime ni le sujet ni l'objet : c'est leur activité, dans la sensation, qui est une.
