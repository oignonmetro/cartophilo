- id: sens2-l4
  title: "Deux sens de la puissance"
  notes: |
    La doctrine de « l'identité et de l'unité de l'acte » (`energeia autè kai mia`) de la sensibilité et du sensible surmonte la contradiction. Aristote admet avec **Démocrite** que la sensibilité n'est pas immédiatement l'agent de sa propre activité : c'est le sensible, extérieur, qui « met en mouvement ». On ne sent pas ce qui n'est pas présent (sinon, c'est mémoire ou imagination) : pour sentir, « il faut nécessairement disposer du sensible » (*De l'âme*, II, 5). Mais la sensibilité s'accomplit selon sa propre nature quand le sensible la meut : la sensation est une **co-activité** du sensible et de la sensibilité, où celle-ci s'identifie à celui-là.

    Pour le montrer, Aristote distingue deux manières d'être en puissance (*De l'âme*, II, 5, fin), sur l'exemple du savant :

    | Modalité           | L'homme savant                                           |
    | Puissance première | tout homme, même l'enfant ou l'ignorant : son genre « fournit la matière » de la science |
    | Puissance seconde  | Aristote qui mange ou dort : il possède la science, une `hexis`, sans l'exercer |
    | Acte               | Aristote « bel et bien en train de spéculer », « savant par réalisation » |

    D'où deux passages à l'acte. Quand le disciple apprend, il **change** de nature : il devient littéralement « différent » ; il y a « destruction sous l'effet du contraire », l'ignorance étant détruite par la science. Quand Aristote spécule, il reste savant : « le progrès va du même au même dans le sens de la réalisation », c'est une « préservation de l'être potentiel par l'être réalisé ». Dans un cas, une chose se transforme ; dans l'autre, elle se **réalise**.

    ! La disposition (`hexis`) est un état intermédiaire entre la puissance et l'acte : elle implique déjà une forme minimale d'activité.
