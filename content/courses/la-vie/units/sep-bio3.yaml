- id: sep-bio3-l8
  title: "Genres naturels et pensée populationnelle"
  notes: |-
    **Les espèces biologiques sont souvent données comme exemple classique de {violet}genre naturel{/violet} (*natural kind*)** : d'où l'influence majeure de la philosophie de la systématique sur les travaux récents consacrés au classement et aux genres naturels (Dupré 1993, 2002 ; Boyd 1999 ; Griffiths 1999 ; Wilson 1999 ; Okasha 2002 ; Walsh 2006 ; Slater 2015).

    **Le conflit.** Un genre naturel classique suppose une {violet}essence{/violet} : une propriété commune à tous ses membres, comme le numéro atomique pour l'or. Or la biologie pense en {violet}pensée populationnelle{/violet} (*population thinking*, Mayr 1975) : {red}__une population est faite d'individus variables, et aucune variation n'y est un écart par rapport à un type__{/red}. L'évolution suppose même cette variation. Comment concilier les deux ?

    **La question ouverte.** {green}Peut-il y avoir une notion de genre naturel, ou un {violet}essentialisme{/violet}, compatible avec la pensée populationnelle ?{/green} (Mayr 1975, Sober 1980, Ariew 2008.) Plusieurs tentatives modifient l'idée de genre naturel plutôt que d'y renoncer : Boyd (1999) rattache l'unité du genre à une **homéostasie** de propriétés, Griffiths (1999) parle d'{violet}essences historiques{/violet}, puisque ce qui unit une espèce est sa généalogie, non une propriété intrinsèque.

    ! « Espèce naturelle » traduit parfois *natural kind* : il faut éviter de le confondre avec l'espèce biologique, puisque toute la question est de savoir si celle-ci en est une.
  points:
  - id: sep-bio3-l8-p1
    sentence: "Les espèces biologiques sont souvent données comme exemple classique de genre ___, alors même que la thèse de Ghiselin le conteste."
    answer: "naturel"
    alt: []
  - id: sep-bio3-l8-p2
    sentence: "La pensée ___ (Mayr 1975) tient qu'une population est faite d'individus variables, sans que cette variation soit un écart par rapport à un type."
    answer: "populationnelle"
    alt: []
  - id: sep-bio3-l8-p3
    sentence: "La notion de pensée populationnelle, qui s'oppose à la pensée par types, est liée au nom d'Ernst ___ (1975)."
    answer: "Mayr"
    alt: []
  - id: sep-bio3-l8-p4
    sentence: "Une question ouverte sur les genres naturels : peut-il y avoir un ___ compatible avec la pensée populationnelle de la biologie ?"
    answer: "essentialisme"
    alt: []
  - id: sep-bio3-l8-p5
    sentence: "Griffiths (1999) parle d'essences ___ : ce qui unit une espèce est sa généalogie, non une propriété intrinsèque."
    answer: "historiques"
    alt: []
  - id: sep-bio3-l8-p6
    sentence: "Boyd (1999) rattache l'unité d'un genre naturel à une ___ de propriétés, plutôt qu'à une essence commune à tous ses membres."
    answer: "homéostasie"
    alt: []
