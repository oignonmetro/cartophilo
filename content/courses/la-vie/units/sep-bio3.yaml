    answer: "nature"
    alt: []
- id: sep-bio3-l5
  title: "Qu'est-ce qu'un individu biologique ?"
  notes: |-
    **La thèse des espèces comme individus laisse des questions sans réponse et en soulève de nouvelles** (Kitcher 1984, 1989 ; Ereshefsky 2000). Si l'on sait mieux ce qu'est une espèce, on ne sait pas pour autant ce qu'il faut y compter.

    **Une difficulté de terrain.** Supposez que vous soyez {violet}biologiste des populations{/violet} et que vous deviez {green}recenser les individus d'une population{/green}. {red}__Quelles entités devez-vous compter ?__{/red} Dans un bosquet de trembles issus d'une même racine, y a-t-il un arbre ou mille (exemple familier) ? Une colonie de fourmis est-elle un individu, ou des milliers ?

    **Une longue liste de critères.** Philosophes et biologistes en proposent une variété (Clarke 2013) :
    - {sky}génétiques et reproductifs{/sky} : la reproduction, les cycles de vie, la génétique, le sexe, les {violet}goulets développementaux{/violet}, la {violet}séparation germen-soma{/violet} ;
    - {sky}physiologiques{/sky} : la réponse immunitaire, l'autonomie métabolique, l'intégration fonctionnelle, les limites spatiales ou la contiguïté ;
    - {sky}évolutifs et sociaux{/sky} : la maximisation de la fitness, la coopération et le conflit, les {violet}mécanismes de police{/violet}, la codispersion, les adaptations.

    {coral}__La question de ce qu'est un individu biologique est donc pressante__{/coral} (Wilson 2005, Okasha 2006, Clarke 2011, Pradeu 2012, Bouchard et Huneman 2013, Godfrey-Smith 2013) : ces critères ne découpent pas le vivant de la même façon, et compter les individus décide de ce que mesure la fitness.
  points:
  - id: sep-bio3-l5-p1
    sentence: "Un biologiste des populations qui doit ___ les individus d'une population doit d'abord décider quelles entités compter : d'où la question de l'individu biologique."
    answer: "recenser"
    alt: ["compter"]
  - id: sep-bio3-l5-p2
    sentence: "Parmi les critères de l'individu biologique, certains sont physiologiques : la réponse ___, l'autonomie métabolique, l'intégration fonctionnelle."
    answer: "immunitaire"
    alt: []
  - id: sep-bio3-l5-p3
    sentence: "Parmi les critères de l'individu biologique, certains sont physiologiques : la réponse immunitaire, l'autonomie ___, l'intégration fonctionnelle."
    answer: "métabolique"
    alt: []
  - id: sep-bio3-l5-p4
    sentence: "Parmi les critères de l'individu biologique, certains relèvent de la reproduction : les cycles de vie, les goulets développementaux, la séparation ___-soma."
    answer: "germen"
    alt: ["germe"]
  - id: sep-bio3-l5-p5
    sentence: "Parmi les critères de l'individu biologique, certains sont évolutifs et sociaux : la coopération et le conflit, la codispersion, les mécanismes de ___."
    answer: "police"
    alt: []
  - id: sep-bio3-l5-p6
    sentence: "Dans un bosquet de ___ issus d'une même racine, y a-t-il un arbre ou mille ? Cet exemple montre que la question de l'individu biologique se pose dès le recensement."
    answer: "trembles"
    alt: []
- id: sep-bio3-l6
  title: "Le concept biologique d'espèce"
  notes: |-
    **Les biologistes restent profondément divisés sur la catégorie d'espèce** (Ereshefsky, Wheeler et Meier 2000, Coyne et Orr 2004, Wilkins 2009). Le concept le plus célèbre est un bon point de départ, parce que ses limites montrent ce qu'on attend d'un tel concept.

    **Le {violet}concept biologique d'espèce{/violet} (CBE)** d'{violet}Ernst Mayr{/violet} : {teal}« {/teal}Les espèces sont des {teal}groupes de populations naturelles qui se croisent entre elles{/teal}, et qui sont {teal}reproductivement isolés{/teal} d'autres groupes de ce genre{teal} »{/teal} (1963). L'attrait du concept : le critère n'est pas la ressemblance, mais un fait biologique, l'échange de gènes.

    **Trois objections.**
    - **Les organismes {violet}asexués{/violet} ne se croisent pas** : sur le CBE, {red}il n'y a donc pas d'espèces d'organismes asexués{/red}, ce qui écarte une grande partie du vivant (voir pourtant, en sens contraire, Bobay et Ochman 2017).
    - **L'{violet}introgression{/violet}** : beaucoup d'espèces échangent quelques gènes avec d'autres, par hybridation. {red}Elles ne pourraient donc être des espèces distinctes{/red} sur ce critère strict : l'ours polaire et le grizzly en donnent un exemple (exemple familier).
    - **Le registre fossile** : {red}le CBE est extrêmement difficile à appliquer aux espèces fossiles{/red}, car les organes sexuels ne se fossilisent pas d'ordinaire, et le comportement reproducteur est difficile à attester.

    {coral}Devant ces problèmes (et pour d'autres raisons), les biologistes ont avancé d'autres concepts d'espèce{/coral}, d'où la question de la leçon suivante.
  points:
  - id: sep-bio3-l6-p1
    sentence: "Le concept biologique d'espèce, le plus célèbre des concepts d'espèce, est dû à Ernst ___."
    answer: "Mayr"
    alt: []
  - id: sep-bio3-l6-p2
    sentence: "Mayr : « Les espèces sont des groupes de populations naturelles qui se croisent entre elles, et qui sont reproductivement ___ d'autres groupes de ce genre »."
    answer: "isolés"
    alt: []
  - id: sep-bio3-l6-p3
    sentence: "Mayr : « Les espèces sont des groupes de populations naturelles qui se ___ entre elles, et qui sont reproductivement isolés d'autres groupes de ce genre »."
    answer: "croisent"
    alt: []
  - id: sep-bio3-l6-p4
    sentence: "Première objection au concept biologique d'espèce de Mayr : les organismes ___ ne se croisent pas, et il n'y aurait donc pas d'espèces parmi eux."
    answer: "asexués"
    alt: []
  - id: sep-bio3-l6-p5
    sentence: "Deuxième objection au concept biologique d'espèce de Mayr : beaucoup d'espèces présentent de l'___, un échange de gènes par hybridation, et ne pourraient donc être des espèces distinctes."
    answer: "introgression"
    alt: []
  - id: sep-bio3-l6-p6
    sentence: "Troisième objection au concept biologique d'espèce de Mayr : il s'applique très mal aux espèces ___, car les organes sexuels ne se conservent pas, et le comportement reproducteur est difficile à attester."
    answer: "fossiles"
    alt: []
- id: sep-bio3-l7
  title: "Pluralisme et monisme sur les espèces"
  notes: |-
    **Une fois admis plusieurs concepts d'espèce, faut-il en choisir un ?** Le débat a trois positions, et il fait toujours rage (Wilson 1999, Wheeler et Meier 2000, Barker 2019).

    | Position | Sa thèse | Auteur cité |
    | pluralisme | plusieurs concepts d'espèce sont corrects | Ereshefsky |
    | monisme | un seul concept d'espèce est correct | Hull |
    | élimination | il faut supprimer le rang d'espèce | Mishler |

    **Le {violet}pluralisme des espèces{/violet}** (Ereshefsky 1992) : il n'y a pas de concept d'espèce unique et correct qui classe tous les organismes de la même façon ; {green}__il y a plusieurs concepts corrects__{/green}. Le point est fort, et il faut le voir : pour certains organismes, {coral}des concepts différents les placeront correctement dans des espèces distinctes{/coral}. Ce n'est pas une affaire de mots ou d'imprécision : deux classements incompatibles peuvent être vrais chacun selon son concept.

    **Le {violet}monisme des espèces{/violet}** : il y a un seul concept correct. Certains allèguent que {pink}le pluralisme n'est que temporaire{/pink}, parce qu'on finira par trouver le meilleur concept (Hull 1999).

    **L'élimination du rang.** D'autres soutiennent même qu'il faut {red}se débarrasser complètement du rang d'espèce{/red} (Mishler 1999, Mishler et Wilkins 2018) : si la cladistique ne reconnaît que des groupes monophylétiques emboîtés, pourquoi privilégier l'un de ces niveaux en l'appelant « espèce » ?

    ! Le pluralisme n'est pas le relativisme : il ne dit pas que tout concept d'espèce se vaut, mais que plusieurs, précis et justifiés, peuvent être corrects ensemble.
  tables:
  - table: position-sa-these-auteur-cite
    exercises:
    - {kind: bank, column: Position}
