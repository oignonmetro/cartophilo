- id: sep-bio3-l2
  title: "L'inférence phylogénétique et la parcimonie"
  notes: |-
    **Un autre pan du travail conceptuel porte sur l'{violet}inférence phylogénétique{/violet} : comment justifier une hypothèse sur un passé que personne n'a vu ?**

    **Le problème.** Les phylogénies se représentent par des {violet}arbres phylogénétiques{/violet}. Les découvrir pose le problème familier de la {violet}sous-détermination de la théorie par les données{/violet}. Avec seulement **quatre taxons**, il y a **quinze arbres enracinés possibles** ; or {red}__un seul peut correspondre à la lignée historique réelle__{/red}, et la phylogénie ne s'observe pas directement. Elle doit donc s'inférer, et tout le problème est de justifier de telles hypothèses historiques.

    **La parcimonie.** La méthode phylogénétique de choix est d'abord la {violet}parcimonie{/violet} : {green}choisir l'arbre qui suppose le moins d'événements évolutifs{/green}. Si trois espèces ont des ailes semblables, un arbre où les ailes sont apparues une seule fois l'emporte sur un arbre où elles sont apparues trois fois (exemple familier).

    **Une justification poppérienne.** Certains systématiciens phylogénétiques défendent cette méthode par le {violet}falsificationnisme{/violet} de {violet}Karl Popper{/violet} (Wiley 1975, Farris 1983). L'idée : chaque événement supplémentaire qu'un arbre doit supposer est une hypothèse ajoutée pour sauver l'arbre devant les données. L'arbre le plus parcimonieux est donc le moins en difficulté devant elles.

    ! La sous-détermination ne vient pas d'un manque provisoire de fossiles : le nombre d'arbres possibles croît avec celui des taxons, et aucun n'est observable.
  points:
  - id: sep-bio3-l2-p1
    sentence: "Découvrir une phylogénie pose le problème familier de la ___ de la théorie par les données : plusieurs arbres sont compatibles avec les mêmes observations."
    answer: "sous-détermination"
    alt: ["sous détermination"]
  - id: sep-bio3-l2-p2
    sentence: "Avec seulement quatre taxons, il y a ___ arbres phylogénétiques enracinés possibles, dont un seul correspond à la lignée historique réelle."
    answer: "quinze"
    alt: ["15"]
  - id: sep-bio3-l2-p3
    sentence: "La phylogénie de taxons donnés ne s'observe pas directement : elle doit s'___, d'où le problème de justifier de telles hypothèses historiques."
    answer: "inférer"
    alt: []
  - id: sep-bio3-l2-p4
    sentence: "La méthode phylogénétique dite de la ___ prescrit de choisir l'arbre qui suppose le moins d'événements évolutifs."
    answer: "parcimonie"
    alt: []
  - id: sep-bio3-l2-p5
    sentence: "La parcimonie, méthode d'inférence phylogénétique, prescrit de choisir l'arbre qui suppose le moins d'___ évolutifs."
    answer: "événements"
    alt: ["évènements"]
  - id: sep-bio3-l2-p6
    sentence: "Certains systématiciens défendent la parcimonie par le falsificationnisme de Karl ___ (Wiley 1975, Farris 1983)."
    answer: "Popper"
    alt: []
  - id: sep-bio3-l2-p7
    sentence: "Certains systématiciens défendent la parcimonie, méthode d'inférence phylogénétique, par le ___ de Popper : chaque événement ajouté à un arbre est une hypothèse supplémentaire pour le sauver devant les données."
    answer: "falsificationnisme"
    alt: []
- id: sep-bio3-l3
  title: "L'attraction des longues branches"
  notes: |-
    **La parcimonie a un défaut systématique, et c'est un biologiste qui le démontre.**

    **Felsenstein.** Dans les années 1970, {violet}Joseph Felsenstein{/violet} montre que les lignées d'une certaine topologie sont sujettes à une {red}erreur systématique dans l'analyse de parcimonie{/red} (Felsenstein 1978, 2004). C'est le problème de l'{violet}attraction des longues branches{/violet} : {red}__des taxons au bout de longues branches sont groupés à tort par la parcimonie__{/red}, au lieu de l'être avec les taxons dont ils partagent un ancêtre commun plus récent.

    **Pourquoi.** Une longue branche, c'est beaucoup de changement. Deux lignées qui changent beaucoup finissent, par hasard, par se ressembler sur certains caractères : les mêmes mutations surviennent indépendamment. La parcimonie, qui cherche à compter le moins d'événements possible, préfère lire cette ressemblance comme un héritage commun, puisque c'est **moins d'événements**. Elle se trompe donc d'autant plus sûrement qu'il y a plus de données : {coral}le défaut n'est pas un manque d'information, il tient à la règle{/coral}.

    **La solution proposée : la statistique.** Felsenstein propose des techniques statistiques, en particulier les méthodes de {violet}maximum de vraisemblance{/violet} : au lieu de compter les événements, on choisit l'arbre sous lequel, étant donné un modèle du changement évolutif, les données observées sont les plus probables. Un tel modèle prévoit que les longues branches accumulent des coïncidences, et ne s'y laisse donc pas prendre. {sky}Les débats entre les deux camps continuent{/sky} (Sober 2004).

    ! La vraisemblance a un prix : elle exige un modèle du changement évolutif, que la parcimonie semble se dispenser de supposer.
  points:
  - id: sep-bio3-l3-p1
    sentence: "Joseph ___ montre dans les années 1970 que l'analyse de parcimonie est sujette à une erreur systématique pour certaines topologies de lignées."
    answer: "Felsenstein"
    alt: []
  - id: sep-bio3-l3-p2
    sentence: "L'erreur systématique de la parcimonie en phylogénie, montrée par Felsenstein, se nomme l'attraction des ___ branches."
    answer: "longues"
    alt: []
  - id: sep-bio3-l3-p3
    sentence: "Dans l'attraction des longues branches, des taxons sont groupés à tort par la parcimonie, au lieu de l'être avec ceux dont ils partagent un ___ commun plus récent."
    answer: "ancêtre"
    alt: []
  - id: sep-bio3-l3-p4
    sentence: "Deux lignées qui changent beaucoup finissent par se ressembler par hasard ; la parcimonie lit cette ressemblance comme un héritage commun, parce que cela suppose moins d'___."
    answer: "événements"
    alt: ["évènements"]
  - id: sep-bio3-l3-p5
    sentence: "Pour éviter l'attraction des longues branches, Felsenstein propose des techniques statistiques, en particulier les méthodes de maximum de ___."
    answer: "vraisemblance"
    alt: []
  - id: sep-bio3-l3-p6
    sentence: "Le maximum de vraisemblance choisit l'arbre sous lequel, étant donné un modèle du changement évolutif, les données observées sont les plus ___."
    answer: "probables"
    alt: []
- id: sep-bio3-l4
  title: "Les espèces sont des individus"
  notes: |-
    **Le biologiste {violet}Michael Ghiselin{/violet} (1974) pique la curiosité des philosophes : la systématique se trompe, dit-il, sur le statut ontologique même des espèces.** On croyait que le tigre était un genre de chose. C'est une chose.

    **La thèse.** {red}Les espèces ne sont pas des {violet}genres naturels{/violet} comme les éléments chimiques.{/red} {green}__Ce sont des {violet}particuliers historiques{/violet}, comme les nations ou les galaxies.__{/green} Comme eux :
    - elles ont un **commencement**, par la {violet}spéciation{/violet} ;
    - elles ont des **parties** intégrées dans le temps par des relations biologiques ;
    - elles **cessent d'exister**, par l'extinction (Mishler et Brandon 1987).

    **La relation de l'organisme à l'espèce change.** Les organismes individuels ne sont pas des **instances** de l'espèce, {yellow}comme une alliance est une instance de l'or{/yellow}. Ils en sont des **parties**, {yellow}comme on est une partie d'une famille{/yellow}. La différence se voit sur un test : de l'or fabriqué sur une autre planète serait de l'or, mais un être semblable au tigre apparu sans lien avec les tigres ne serait pas un tigre (exemple familier), comme un sosie ne fait pas partie de votre famille.

    **La conséquence.** Smart l'avait déjà remarqué : {coral}__il ne peut y avoir de « lois de la nature » sur les espèces biologiques en tant que telles__{/coral}, du moins au sens traditionnel. On n'a pas de loi sur la France ni sur la Voie lactée : on en fait l'histoire.

    **Hull développe la thèse.** {violet}David Hull{/violet} défend la {violet}thèse des espèces comme individus{/violet} et en explore les implications pour les **noms d'espèces**, les **lois de la nature** et la **nature humaine** (Hull 1976, 1978, 1986). S'il n'y a pas de propriété que tout humain doive avoir pour être humain, mais seulement l'appartenance à une lignée, que devient l'idée d'une nature humaine ?

    ! « Individu » n'a pas ici le sens courant d'organisme : c'est le sens logique d'une chose particulière, située dans l'espace et le temps, qui s'oppose à une classe.
  points:
  - id: sep-bio3-l4-p1
    sentence: "Le biologiste Michael ___ (1974) soutient que la systématique se trompe sur le statut ontologique des espèces : ce ne sont pas des genres naturels."
    answer: "Ghiselin"
    alt: []
  - id: sep-bio3-l4-p2
    sentence: "Pour Ghiselin, les espèces ne sont pas des genres naturels comme les ___ chimiques."
    answer: "éléments"
    alt: []
  - id: sep-bio3-l4-p3
    sentence: "Pour Ghiselin, les espèces sont des ___ historiques, comme les nations ou les galaxies."
    answer: "particuliers"
    alt: []
  - id: sep-bio3-l4-p4
    sentence: "Pour Ghiselin, les espèces sont des particuliers historiques, comme les nations ou les ___."
    answer: "galaxies"
    alt: []
  - id: sep-bio3-l4-p5
    sentence: "Selon la thèse des espèces comme individus, une espèce a un commencement par la ___, des parties intégrées par des relations biologiques, et une fin par l'extinction."
    answer: "spéciation"
    alt: []
  - id: sep-bio3-l4-p6
    sentence: "Selon la thèse des espèces comme individus, une espèce a un commencement par la spéciation, des parties intégrées par des relations biologiques, et une fin par l'___."
    answer: "extinction"
    alt: []
  - id: sep-bio3-l4-p7
    sentence: "Selon la thèse des espèces comme individus, les organismes ne sont pas des instances de l'espèce, comme une alliance est une instance de l'___."
    answer: "or"
    alt: []
  - id: sep-bio3-l4-p8
    sentence: "Selon la thèse des espèces comme individus, les organismes sont des parties de l'espèce, comme on est une partie d'une ___."
    answer: "famille"
    alt: []
  - id: sep-bio3-l4-p9
    sentence: "Si les espèces sont des individus, il ne peut y avoir de ___ de la nature sur les espèces en tant que telles, conséquence que Smart avait déjà remarquée."
    answer: "lois"
    alt: []
  - id: sep-bio3-l4-p10
    sentence: "David ___ développe la thèse des espèces comme individus, et en explore les implications pour les noms d'espèces, les lois de la nature et la nature humaine."
    answer: "Hull"
    alt: []
  - id: sep-bio3-l4-p11
