# de l'article « Philosophy of Biology », Stanford Encyclopedia of Philosophy :
# section 5 (« Philosophy of Systematic Biology »). Citations traduites de
# l'anglais. « Natural kind » est rendu par « genre naturel », pour éviter
# l'équivoque avec l'espèce biologique.

id: sep-bio3
title: "Classer le vivant : systématique et espèces"
subtitle: "La révolution cladistique, l'inférence phylogénétique, et ce qu'est une espèce"
icon: people
color: teal
group: "La philosophie de la biologie (SEP)"
lessons:
- id: sep-bio3-l1
  title: "La révolution cladistique"
  notes: |-
    **La discussion philosophique de la {violet}systématique{/violet} répond à une « révolution scientifique » dans cette discipline, dans les années 1960 et 1970.** La science du classement du vivant change alors de but : que doit représenter une classification ?

    **Trois écoles.** La discipline se transforme à partir de la {pink}phénétique{/pink} et de la {pink}taxonomie évolutionniste{/pink}, parallèlement à l'application de méthodes quantitatives. La phénétique regroupe selon la ressemblance d'ensemble ; la taxonomie évolutionniste mêle généalogie et degré de divergence. Leur succède l'approche {green}« cladistique »{/green} de {violet}Willi Hennig{/violet} (1966).

    **La thèse cladistique.** {green}__Le seul but de la systématique doit être de représenter les groupes « naturels » d'organismes__{/green}, et les cladistes entendent par là les {violet}groupes monophylétiques{/violet} : un groupe monophylétique comprend **une espèce ancestrale, et toutes ses espèces descendantes, et elles seules**. Une approche cladistique ne représente donc que la {violet}phylogénie{/violet}, le schéma de la descendance commune.

    **Ce que la règle change.** Les « reptiles », au sens usuel, excluent les oiseaux, qui descendent pourtant de reptiles (exemple familier). Pour un phénéticien, cette exclusion a un sens, car les oiseaux ne leur ressemblent plus. Pour un cladiste, {red}un tel groupe n'est pas naturel{/red}, puisqu'il retire des descendants.

    **Un philosophe dans la bataille.** {violet}David Hull{/violet} participe activement aux débats scientifiques de cette révolution : il préside la {sky}Society of Systematic Zoology{/sky} en 1984-1985, puis la {sky}Philosophy of Science Association{/sky} en 1985-1986.

    ! « Monophylétique » n'est pas « issu d'un ancêtre commun » tout court : il faut encore que le groupe contienne **tous** les descendants de cet ancêtre.
  points:
  - id: sep-bio3-l1-p1
    sentence: "La systématique connaît dans les années 1960 et 1970 une révolution qui la fait passer de la ___ et de la taxonomie évolutionniste à la cladistique."
    answer: "phénétique"
    alt: []
  - id: sep-bio3-l1-p2
    sentence: "La phénétique regroupe les organismes selon leur ___ d'ensemble, à la différence de la cladistique, qui ne suit que la généalogie."
    answer: "ressemblance"
    alt: ["similitude", "similarité"]
  - id: sep-bio3-l1-p3
    sentence: "L'approche cladistique de la systématique est due à Willi ___ (1966)."
    answer: "Hennig"
    alt: []
  - id: sep-bio3-l1-p4
    sentence: "Pour l'approche de Hennig, nommée ___, le seul but de la systématique est de représenter les groupes naturels d'organismes."
    answer: "cladistique"
    alt: []
  - id: sep-bio3-l1-p5
    sentence: "Les cladistes tiennent pour groupes naturels les groupes ___ : une espèce ancestrale, toutes ses espèces descendantes, et elles seules."
    answer: "monophylétiques"
    alt: []
  - id: sep-bio3-l1-p6
    sentence: "Une approche cladistique ne représente que la ___, c'est-à-dire le schéma de la descendance commune."
    answer: "phylogénie"
    alt: []
  - id: sep-bio3-l1-p7
    sentence: "Pour un cladiste, les « reptiles » au sens usuel ne forment pas un groupe naturel, puisqu'ils excluent les ___, qui en descendent."
    answer: "oiseaux"
    alt: []
