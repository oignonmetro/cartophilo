- id: jonas3-l1
  title: "La rupture avec l'anthropocentrisme"
  notes: |-
    Un autre point de Jonas est la {violet}rupture avec l'anthropocentrisme{/violet} : la technique ne prend plus seulement l'homme pour fin, elle le prend pour **objet**, et menace par là la dignité qu'on lui reconnaissait.

    **Maîtriser le vivant, c'est éliminer le hasard.** La capacité croissante de rendre le vivant **prévisible**, grâce aux recherches sur le génome, permettrait de sélectionner à l'avance les caractéristiques des nouveau-nés dans le cadre d'une procréation artificielle. Jonas distingue **deux voies d'élimination du hasard**, qui toutes deux organisent l'être à venir à partir de la base chromatique :
    - la technique ADN de **recombinaison des cellules germinales** humaines, qui modifie ce qui est donné par hasard, l'améliore, peut-être l'invente ;
    - la **copie d'individus modèles** par {red}clonage{/red}.

    Dans les deux cas, on veut {red}s'arroger un pouvoir de décision{/red} sur les modalités et le résultat de la procréation : substituer l'art au hasard nous épargnerait toute surprise désagréable et nous rendrait **maîtres de notre développement spécifique**.

    **L'éloge du hasard.** Or le hasard est la **source productrice** du développement des espèces, et la garantie, dans toute procréation sexuelle, que chaque individu né est **unique**. {teal}« Le hasard de l'événement sexuel est la bénédiction irremplaçable, comme le fardeau inévitable de notre tirage au sort, et son imprévisibilité est toujours plus digne de confiance que nos options pesées en une journée. »{/teal} Le paradoxe est voulu : ce qui échappe à notre décision vaut mieux que notre décision, parce qu'il ne reflète {green}les préférences de personne{/green}, alors que nos options pèsent les modes et les désirs d'un moment.

    ! Jonas n'idéalise pas le hasard parce qu'il serait toujours heureux (il est aussi un « fardeau ») : il le préfère parce qu'il garantit l'unicité de chacun et qu'il n'est le choix de personne.
