- id: jonas3-l4
  title: "La question métaphysique"
  notes: |-
    Enfin, Jonas évoque la **position de la question métaphysique** : le pouvoir apocalyptique de la technique pose une question à laquelle l'éthique ne s'était jamais confrontée.

    **Une question inédite.** Le potentiel apocalyptique de la technique est double : mettre en danger le **maintien du genre humain**, ou corrompre son **intégrité génétique** en la changeant arbitrairement. Il pose donc la question {violet}métaphysique{/violet} : {red}si et pourquoi il doit y avoir une humanité{/red} ; pourquoi l'homme, tel que l'évolution l'a fait naître, doit être préservé et son héritage génétique respecté ; et même pourquoi il doit y avoir de la vie en général. Tant que l'homme ne pouvait pas abolir l'humanité, la question ne se posait pas pratiquement.

    **La réponse : un impératif catégorique.** Jonas répond par une sorte d'{green}impératif catégorique{/green}, une **exigence à exister** pour l'humanité, qui doit l'empêcher de jouer avec sa propre vie : les risques techniques, même très incertains, sont à **exclure dès le début**. Catégorique, parce qu'il ne dépend d'aucune fin qu'on pourrait ne pas vouloir : l'existence de l'humanité n'est pas un moyen pour autre chose, elle est la condition de toute éthique.

    **La nature humaine en question.** D'où l'enjeu : existe-t-il une **nature humaine** stable et constante, ou n'est-elle qu'une **construction sociale et historique**, appelée à varier ? Sommes-nous des créatures devant respecter des préceptes divins, des êtres naturels devant se plier à notre essence sous peine de transgression, ou un {pink}être plastique, auteur de lui-même{/pink} ? L'éthique de Jonas semble reposer sur l'impératif d'une **persévérance de la vie humaine**, devoir envers les générations futures et envers l'humanité en général.

    ! L'impératif de Jonas exclut les risques même très incertains : quand l'existence de l'humanité est en jeu, l'incertitude ne justifie pas de parier.
