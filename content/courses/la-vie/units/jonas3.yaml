- id: jonas3-l3
  title: "L'eugénisme libéral"
  notes: |-
    Les craintes de Jonas se prolongent chez des auteurs plus récents, qui voient venir non un eugénisme d'État, mais un {violet}eugénisme libéral{/violet}, celui du marché et du choix des parents.

    **Habermas.** Dans {sky}*L'avenir de la nature humaine. Vers un eugénisme libéral*{/sky} (2002), Jürgen **Habermas** dit avoir {teal}« préféré adopter la perspective d'un présent futur, à partir de laquelle nous jetterons peut-être, un jour, un regard rétrospectif sur les pratiques, aujourd'hui contestées, ouvrant la voie à un eugénisme libéral, réglé par l'offre et la demande »{/teal}. Il se projette dans un monde dystopique pour dénoncer d'avance les limites, les défauts et le caractère tragique, pour l'espèce, des techniques que nous cherchons à acquérir. L'eugénisme ne viendrait plus des {red}pouvoirs totalitaires{/red}, mais du **progrès scientifique** qui rend possible la sélection des caractéristiques de l'embryon.

    **Le fardeau de l'enfant parfait.** Des parents soucieux de donner à leurs enfants les meilleures chances feraient porter sur eux un lourd fardeau : sélectionnés pour la beauté, l'intelligence ou l'aptitude sportive, ils pourraient ne pas répondre aux attentes, et n'auraient {red}pas droit à l'erreur{/red}, privés surtout de la liberté de déroger au modèle prévu. Il faudrait plutôt, dit Dominique **Lecourt**, considérer {teal}« les enfants comme un don à chérir et non comme le résultat de notre manipulation »{/teal}.

    **Fukuyama.** Dans *La fin de l'homme* (2004), Francis **Fukuyama** dénonce un tri social : les riches sélectionneront les embryons pour optimiser leurs enfants, confirmant la conformité entre origine sociale, aspect et intelligence ; et celui qui échoue pourra incriminer un mauvais choix de gènes plutôt que sa responsabilité. Membre du **Conseil présidentiel de bioéthique** (2001-2004, sous G. W. Bush), il demandait l'interdiction des biotechnologies. Après avoir, à la suite de **Hegel**, annoncé la fin de l'histoire, il constate que la biologie a des effets sur la politique : {teal}« si la science et la technique sont à la source du monde moderne, elles représentent aussi les points les plus vulnérables de notre civilisation »{/teal}, d'où la menace du {red}« bioterrorisme »{/red}. Avec les dystopies (*1984*, *Le meilleur des mondes*), il juge qu'**Huxley** avait raison : la biotechnique peut altérer la nature humaine et nous propulser dans une phase {red}« posthumaine »{/red} de notre histoire.

    ! L'eugénisme libéral n'a besoin d'aucune contrainte : il naît de choix privés et bien intentionnés, ce qui le rend plus difficile à dénoncer que l'eugénisme d'État.
  points:
