- id: jonas3-l5
  title: "Relativiser la peur de la technique"
  notes: |-
    Contre une méfiance excessive, d'autres auteurs rappellent que l'homme s'est toujours transformé lui-même, et que la peur de la technique vient souvent de **l'ignorance** qu'on en a. Ce ne sont pas des commentaires de Jonas, mais des objections à une lecture alarmiste.

    **Sloterdijk : rien de nouveau.** L'homme a toujours opéré sur lui-même des modifications ; les transformations techniques ne seraient donc pas une nouveauté. Médicaments, **prothèses** (du genou au cœur, en passant par les dents), pacemakers, greffes, lentilles et lunettes : le transhumanisme serait le simple prolongement d'un mouvement lointain, né avec la {yellow}béquille{/yellow}, qui pallie nos déficiences. Il y a {green}continuité entre les lunettes{/green} qui corrigent la myopie et les techniques qui rendraient la vue aux aveugles.

    **Klein : une mythologie de la technique.** Pour Étienne **Klein**, la technique a bouleversé la vie depuis la révolution industrielle, mais la méfiance qu'elle suscite est amplifiée par une **mythologie** : {teal}« Les technologies, quelles qu'elles soient, ne produisent pas seulement les instruments qui transforment notre vie, elles modifient la réalité qui nous entoure »{/teal}. Elles produisent aussi des mythes et des récits ; or {teal}« par essence, l'imaginaire n'est pas là pour intégrer une technique à une société. Il a plutôt un rôle de transformation symbolique »{/teal}, qui charge affectivement les objets techniques, d'autant plus que la technologie devient **opaque**.

    **Séris : la facilité d'usage, l'ignorance du fonctionnement.** Les objets les plus récents sont faciles à utiliser et très difficiles à comprendre. Jean-Pierre **Séris** : {teal}« nous vivons dans un monde où le 'capital' de savoir technique accumulé est colossal, et en même temps, nous sommes bien plus que nos ancêtres dispensés de tout savoir-faire technique »{/teal}. Ce retrait de la technique donne à la technologie de pointe une aura scientifique, qu'on nomme {violet}technoscience{/violet}.

    **Simondon : l'aliénation par ignorance.** Dans *Du mode d'existence des objets techniques*, Gilbert **Simondon** déconstruit la peur de la machine ou du robot, qui s'affranchirait de la tutelle humaine : cette vision irrationnelle repose sur l'**ignorance**. {teal}« La plus forte cause d'aliénation dans le monde contemporain réside dans cette méconnaissance de la machine, qui n'est pas une aliénation causée par la machine, mais par la non-connaissance de sa nature et de son essence »{/teal}. D'où la nécessité d'une {green}pédagogie de la technique{/green}.

    ! Ces objections ne réfutent pas Jonas : elles visent la peur mal informée, non la responsabilité devant un pouvoir réellement nouveau par son échelle.
  points:
