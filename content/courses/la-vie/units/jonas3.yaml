- id: jonas3-l2
  title: "Le clone"
  notes: |-
    Au-delà de la capacité technique qui rend le clonage possible, Jonas s'interroge sur le **statut du clone** : une simple réplique, sans existence singulière. Il imagine le désarroi de celui qui, connaissant sa situation, prend conscience de sa réalité.

    **Ce que le clone perd.** {teal}« Se savoir pâle copie d'un être, qui s'est déjà révélé dans une vie, doit étouffer l'authenticité d'être soi-même, la liberté de se découvrir comme une surprise pour soi-même et pour les autres avec ce qu'il y a en soi. »{/teal} Le mal n'est pas génétique mais **existentiel** : le clone sait d'avance ce qu'un autre a fait de ce qu'il est. Son avenir est {red}déjà joué{/red} dans la vie de son modèle, et il ne peut plus se découvrir.

    **Ce que perdent les autres.** {teal}« Et ce savoir illicite étouffe la spontanéité de l'environnement à l'égard du nouvel arrivant qui pourtant n'est justement pas nouveau. »{/teal} Parents et proches regardent l'enfant à travers son modèle ; ils attendent de lui une vie qu'ils connaissent déjà. Le savoir est {red}illicite{/red} : nul ne devrait savoir d'avance qui sera un nouveau-né.

    ! L'argument ne suppose pas que le clone serait identique à son modèle (il ne l'est pas) : il suffit qu'il se sache copie, et que les autres le sachent, pour que la liberté de se découvrir soit étouffée.
  points:
  - id: jonas3-l2-p1
    sentence: "Jonas, sur le clone : « Se savoir ___ copie d'un être, qui s'est déjà révélé dans une vie, doit étouffer l'authenticité d'être soi-même. »"
    answer: "pâle"
    alt: []
  - id: jonas3-l2-p2
    sentence: "Jonas, sur le clone : « Se savoir pâle copie d'un être, qui s'est déjà révélé dans une vie, doit étouffer l'___ d'être soi-même. »"
