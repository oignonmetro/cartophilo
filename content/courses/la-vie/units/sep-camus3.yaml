- id: sep-camus3-l2
  title: "Je me révolte, donc nous sommes"
  notes: |-
    ***L'Homme révolté* (1951) reprend là où s'arrêtait le *Mythe*.** La conclusion finale du raisonnement absurde est {teal}« le rejet du suicide{/teal} et le maintien de {teal}cette confrontation désespérée entre l'interrogation humaine et le silence du monde »{/teal}. Conclure autrement nierait sa prémisse, l'existence de celui qui interroge : {green}__l'absurdisme doit tenir la vie pour le seul bien nécessaire__{/green}. {teal}« Pour dire que la vie est absurde, la conscience a besoin d'être vivante. »{/teal} {teal}« Respirer, c'est juger. »{/teal} Le critère de validité objective est la **cohérence**.

    **Du suicide au meurtre.** Le but est d'examiner {teal}« la réalité du moment, qui est le crime logique »{/teal} : une époque qui, en cinquante ans, déracine, asservit ou tue soixante-dix millions d'hommes. {teal}« Au temps de la négation{/teal}, il pouvait être utile de s'interroger sur {teal}le problème du suicide{/teal}. {teal}Au temps des idéologies{/teal}, il faut {teal}se mettre en règle avec le meurtre. »{/teal} Camus passe ainsi de l'**individu** à notre **appartenance sociale**.

    **Le meurtre devenu indifférent.** {teal}« {/teal}Le sentiment de l'absurde, quand on prétend d'abord en tirer une règle d'action, {teal}rend le meurtre au moins indifférent et, par conséquent, possible{/teal}. […] Point de pour ni de contre, {teal}l'assassin n'a ni tort ni raison{/teal}. On peut tisonner les crématoires comme on peut aussi se dévouer à soigner les lépreux. {teal}Malice et vertu sont hasard ou caprice. »{/teal} Kamel **Daoud**, réécrivant *L'Étranger* du point de vue de la victime, appelle à juste titre le meurtre de l'Arabe un {teal}« crime philosophique »{/teal}.

    **La révolte, donnée première.** À l'absence de Dieu (*Noces*) et à l'absurde (*Le Mythe*), Camus ajoute la {violet}révolte{/violet}, élevée au rang de donnée première de l'expérience, comme le *cogito* que Sartre prend pour point de départ ; mais Camus laisse de côté l'ontologie pour l'expérience sociale. La révolte contre l'absurde demeure, mais *L'Homme révolté* commence par la révolte contre **l'oppression et l'injustice**. Et {green}__la révolte crée des valeurs, une dignité, une solidarité__{/green} : {teal}« Je me révolte, donc nous sommes. »{/teal} Comment un *je* mène-t-il à un *nous* ? Agir contre l'oppression, c'est en appeler à des valeurs communes et se joindre à d'autres dans la lutte : {coral}la solidarité est notre condition commune{/coral}.

    ! Le *cogito* de la révolte ne fonde pas un moi isolé, comme celui de Descartes : il fonde d'emblée une communauté.
