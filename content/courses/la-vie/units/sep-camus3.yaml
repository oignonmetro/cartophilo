- id: sep-camus3-l4
  title: "La violence, inévitable et impossible"
  notes: |-
    **Le thème le plus difficile.** Les derniers chapitres de *L'Homme révolté*, souvent faits d'affirmations sans preuve, affrontent ceci : {red}__le recours à la violence est à la fois inévitable et « impossible »__{/red}.
    - **Inévitable** : le révolté ne peut renoncer au mensonge, à l'injustice et à la violence, qui entrent nécessairement dans la lutte contre l'oppression. {teal}« {/teal}Il ne peut donc prétendre absolument à {teal}ne point tuer ni mentir{/teal}, {teal}sans renoncer à sa révolte{/teal}, et {teal}accepter une fois pour toutes le meurtre et le mal. »{/teal} Ne pas se révolter, c'est se faire complice de l'oppression.
    - **Impossible** : la révolte est, en principe, une **protestation contre la mort**, et la source de la solidarité. Tuer un homme, même un oppresseur, rompt cette solidarité, contredit notre être même.

    **Ceux qui ignorent le dilemme** : les croyants de l'histoire, héritiers de Hegel et de Marx, qui imaginent un temps où l'oppression cessera. Cet espoir ressemble au paradis des religions : {red}vivre pour un avenir meilleur et lui sacrifier des hommes, c'est une autre religion{/red}.

    **Deux signes d'une révolution restée révoltée.** Camus ne dit pas comment une révolution réussie resterait fidèle à la révolte, mais propose deux signes : {green}elle abolirait la peine de mort, et favoriserait la liberté d'expression{/green}.

    **L'alternative.** Le révolté oppose à un monde condamné à mort, et à l'obscurité de la condition humaine, son exigence de vie et de clarté : il cherche, sans le savoir, une morale ou un sacré. Ou bien accepter de vivre dans un univers sans Dieu et se révolter **dans des limites**, comme les formations sanitaires de *La Peste* ; ou bien devenir révolutionnaire, et refuser de vivre dans le présent au nom d'un triomphe total de la justice. {teal}« Tuer Dieu{/teal} et bâtir une Église, c'est le {teal}mouvement constant et contradictoire de la révolte. »{/teal} Car {teal}« {/teal}l'insurrection humaine, dans ses formes élevées et tragiques, n'est et ne peut être qu'{teal}une longue protestation contre la mort »{/teal}.
