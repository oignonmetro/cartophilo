- id: sep-camus3-l6
  title: "Un philosophe du présent"
  notes: |-
    **Un humaniste assagi.** S'il anticipe à certains égards les postmodernes, Camus garde un souci métaphysique de l'absurde et de la révolte. Il est, selon Jeffrey C. **Isaac**, un {teal}« humaniste assagi »{/teal}, attaché comme Hannah Arendt à {teal}« la langue du droit, de la liberté et de la vérité »{/teal}.

    **L'incroyance.** Son exploration d'un univers sans Dieu le fait souvent citer dans les débats sur l'incroyance. Mais à la différence des {pink}« nouveaux athées »{/pink}, il ne fut jamais assez sûr pour déclarer que Dieu n'existe pas, ni militant contre la religion : dans *La Peste*, le père Paneloux finit par rejoindre humblement les formations sanitaires.

    **Le meurtre politique.** Après le 11 septembre, ses écrits sur la violence sont relus. Selon Foley, dans *L'Homme révolté*, *Caligula* et *Les Justes*, Camus fixe les conditions exceptionnelles d'un meurtre politique légitime :
    - la cible doit être un **tyran** ;
    - le meurtre ne doit pas toucher de **civils innocents** ;
    - le tueur doit être en **proximité physique** directe avec sa victime ;
    - il ne doit y avoir **aucune autre solution**.

    Et le tueur, ayant violé l'ordre moral, doit être prêt à {coral}donner sa propre vie en retour{/coral}. Camus exclut le massacre, le meurtre indirect, le meurtre de civils.

    ***La Peste* et le Covid-19.** En 2020, les ventes de *La Peste* explosent. On y cherche comment vivre devant l'absurdité d'une maladie sans raison, et l'on loue sa philosophie modeste : {green}agir avec les autres, là où l'on est, en faisant simplement son travail{/green}. Comme le dit Rieux : {teal}« {/teal}Il ne s'agit pas d'héroïsme dans tout cela. {teal}Il s'agit d'honnêteté{/teal}. C'est une idée qui peut faire rire, mais {teal}la seule façon de lutter contre la peste, c'est l'honnêteté. »{/teal}
