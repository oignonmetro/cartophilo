- id: sep-camus3-l5
  title: "La Chute : vivre avec ses contradictions"
  notes: |-
    **Critiquer ce qu'on juge naturel et inévitable.** C'est l'un des aspects les plus déroutants de Camus : la tentation du suicide hante l'homme, comme le désir d'un ordre impossible ; le besoin métaphysique qui mène à la terreur communiste est **universel**. Camus le décrit pour mieux y résister **en nous-mêmes** autant qu'en autrui. D'où une sympathie profonde envers les révolutionnaires qu'il combat : ils partagent le même point de départ et les mêmes tentations.

    ***La Chute* (1956).** Cette complexité morale culmine dans ce court roman, dont l'unique personnage, **Clamence**, a été identifié à l'homme quelconque, à Camus, à Sartre : il est tout cela. Coupable d'avoir laissé une jeune femme se suicider, il a une vie remplie de bonnes œuvres, mais il est **hypocrite** et le sait. Assis dans un bar d'**Amsterdam**, il descend dans son enfer personnel, mêlant justification de soi et confession. Camus cherche à comprendre autant qu'à condamner : {coral}Clamence est un monstre, mais aussi un homme comme les autres{/coral}.

    **Le message.** {green}__La vie n'est pas une chose simple, mais une suite de tensions et de dilemmes ; ce qui paraît le plus simple est ambigu, voire contradictoire.__{/green} Camus conseille de ne pas chercher à les résoudre : nous ne nous purgerons jamais des élans qui menacent de ravager nos vies. Si sa philosophie a un sens, c'est d'{coral}apprendre à tolérer, et même à embrasser, la frustration et l'ambivalence auxquelles l'homme ne peut échapper{/coral}.
  points:
  - id: sep-camus3-l5-p1
    sentence: "Camus décrit le besoin métaphysique qui mène à la terreur comme ___, pour mieux y résister en nous-mêmes autant qu'en autrui."
    answer: "universel"
