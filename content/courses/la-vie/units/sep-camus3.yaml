- id: sep-camus3-l1
  title: "Le droit de tuer : des Lettres à un ami allemand à La Peste"
  notes: |-
    **Un absurdiste engagé.** On oublie souvent que l'auteur de *L'Étranger* fut aussi militant : membre de la branche algérienne du **Parti communiste** au milieu des années 1930, journaliste à *Alger républicain*, auteur en 1939 de reportages sur la misère en **Kabylie**, parmi les premiers d'un Européen d'Algérie sur la condition des indigènes. Pacifiste au début de la guerre, il méconnut le nazisme et prôna une paix négociée avec Hitler.

    **Les *Lettres à un ami allemand* (1943-1944).** Entré dans la Résistance, Camus se demande si la violence contre l'occupant est justifiée : il faut {teal}« {/teal}aller voir {teal}si nous avions le droit de tuer des hommes{/teal}, s'il nous était permis d'ajouter à l'atroce misère de ce monde{teal} »{/teal}. Les Français ne comprirent les raisons de combattre qu'au bord de l'abîme, pour se battre ensuite avec une conscience claire et les {teal}« mains pures »{/teal} : {coral}tuer n'est permis que dans des limites strictes, après une grande provocation{/coral}. Les deux adversaires partaient du sentiment de l'absurdité du monde ; mais {green}les Français l'ont reconnue et ont vécu en elle{/green}, quand {red}les Allemands ont voulu la surmonter en dominant le monde{/red}. C'est déjà la transition du *Mythe* à *L'Homme révolté*.

    ***La Peste* (1947).** Rédacteur en chef de *Combat*, Camus écrit un roman dont le contenu évident est, dit-il, la lutte de la résistance européenne contre le nazisme. Une épidémie de peste frappe **Oran** ; la seule réponse est de refuser la maladie et la mort, et d'organiser des {violet}« formations sanitaires »{/violet}. Quels que soient les grands buts de chacun (Tarrou veut abolir la peine de mort, le père Paneloux appelle à embrasser la culpabilité et l'amour de Dieu), {green}__la situation demande une action très limitée, sans héroïsme, menée solidairement__{/green} : comme Sisyphe, en pleine conscience de ses limites, mais désormais comme un **nous**. Le roman représente une résistance **collective et non violente** à un fléau sans cause humaine, et élude ainsi les questions morales de la lutte contre des occupants humains : Barthes puis Sartre le lui reprocheront.

    **Après la Libération.** Camus est l'une des rares voix contre l'usage de la bombe atomique (1945), s'oppose à la peine de mort pour les collaborateurs, puis rompt avec le marxisme et le communisme, tout en refusant la guerre froide.
