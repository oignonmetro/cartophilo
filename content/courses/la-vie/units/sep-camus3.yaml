- id: sep-camus3-l3
  title: "Révolte contre révolution : la critique du communisme"
  notes: |-
    **Des raisons personnelles, politiques, philosophiques.** Camus fut exclu du Parti communiste pour avoir refusé de minimiser le colonialisme en Algérie ; ses rapports avec les communistes s'aigrissent après 1945, jusqu'à la série d'articles **« Ni victimes ni bourreaux »** (1946), où il se dit socialiste mais non marxiste, et rejette la maxime selon laquelle {red}« la fin justifie les moyens »{/red} : {teal}« {/teal}Dans les perspectives du marxisme, {teal}cent mille morts ne sont rien{/teal}, en effet, {teal}au prix du bonheur de centaines de millions de gens. »{/teal}

    **D'où viennent l'attrait et les crimes du communisme ?** D'une même impulsion humaine : {green}__devant l'absurde et l'injustice, l'homme refuse son existence et veut refaire le monde__{/green}. Camus valide la révolte comme point de départ, mais critique la politique qui vise un avenir utopique. À la volonté de transformer le monde, il oppose la {violet}mesure{/violet}, au sens de proportion ou d'équilibre, et le fait de vivre dans la tension de la condition humaine : une {violet}pensée « de midi »{/violet}, qu'il dit {violet}« méditerranéenne »{/violet}, sans argument substantiel pour l'étiquette.

    **La révolution, révolte sans limites.** {red}La révolution naît quand la révolte veut ignorer les limites de la vie humaine.{/red} Par une logique inévitable du nihilisme, le communisme couronne la tendance moderne à diviniser l'homme et à unifier le monde : l'élan aveugle de la révolte, qui {teal}« revendique l'ordre au milieu du chaos{/teal} et {teal}l'unité{/teal} au cœur même de ce qui fuit et disparaît{teal} »{/teal}. Le révolté devenu révolutionnaire tue, puis justifie le meurtre. L'exécution de **Louis XVI** fut le pas décisif d'une justice sans limites. C'est l'« histoire de l'orgueil européen » : Sade, le romantisme, le dandysme, *Les Frères Karamazov*, Hegel, Marx, Nietzsche, le surréalisme, les nazis, et surtout les bolcheviks.

    **Les angles morts selon Aronson.** Le meurtre « rationnel » qui intéresse Camus n'est finalement commis que par les communistes : rien sur la Shoah, sur Hiroshima, sur le colonialisme (sinon en note). Absurde et révolte deviennent {red}une idéologie de guerre froide{/red}. La cible principale : les intellectuels attirés par le communisme, dont **Sartre**, accusé d'avoir cédé au {violet}culte de l'histoire{/violet}, c'est-à-dire d'avoir voulu, comme les existentialistes du *Mythe*, fuir l'absurde dans l'histoire.
