- id: bichat1-l2
  title: "Une physiologie qui ne connaît que le cadavre"
  notes: |-
    À la fin du XVIIIe siècle, **les deux sciences du vivant sont inégalement constituées**, et c'est de ce déséquilibre que part Bichat : il veut donner à la physiologie des bases à partir desquelles elle puisse se développer {yellow}comme la physique depuis les *Principia* de Newton{/yellow}.

    **L'anatomie est achevée.** Depuis **Vésale**, elle décrit à l'aide des dissections les structures internes du corps (musculaire, vasculaire, osseuse, nerveuse) ; les traités de **Soemmering** et de **Winslow**, dans le dernier quart du siècle, en marquent l'état achevé.

    **La physiologie est dispersée.** Malgré la découverte de la circulation du sang par **Harvey**, elle donne l'impression d'une grande confusion, sur ses méthodes, son objet et son rapport à l'anatomie. Certains la tiennent pour un {red}« roman »{/red} ; en {sky}1795{/sky}, à la création de l'**Institut**, {red}il n'y a pas de classe de physiologie{/red}.

    **Elle n'est sérieuse que subordonnée à l'anatomie.** **Vicq d'Azyr** l'écrit en 1790 : {teal}« L'anatomie peut exister séparée de la physiologie ; mais la physiologie ne peut exister seule, elle doit être associée à l'étude du corps humain, sans laquelle elle errera toujours de système en système. »{/teal} Or {coral}__le cadavre est la source du savoir anatomique__{/coral} : la science du vivant semble donc {red}ne connaître le vivant que mort{/red}, et une physiologie comme science du *fonctionnement* reste problématique.

    **Bichat refuse la séparation des deux sciences.** Elle est une erreur, car {teal}« les dépouilles de la mort furent le domaine de l'anatomiste ; le physiologiste eut en partage les phénomènes de la vie comme si les travaux de l'un n'étaient pas enchaînés aux recherches de l'autre ; comme si la connaissance de l'effet pouvait se séparer de celle de l'agent qui le produit »{/teal}. Avec **Haller**, il pose que {teal}« la science des fonctions est le but, celle des organes le moyen »{/teal}.

    **Le symptôme du problème** : l'absence d'une {violet}tradition de recherche unitaire{/violet} en physiologie. La théorie par laquelle Bichat unit anatomie et physiologie ne se comprend que comme une réponse à ce problème.

    ! Le reproche selon lequel on ne connaîtrait le vivant que mort est celui que Bichat retournera : chez lui, c'est le vivant lui-même qui se laissera connaître à partir de sa mortalité.
