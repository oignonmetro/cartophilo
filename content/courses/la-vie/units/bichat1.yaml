- id: bichat1-l3
  title: "Le mécanisme et son aporie"
  notes: |-
    **Depuis Descartes et Harvey, le savoir du vivant avance sous le signe du {violet}mécanisme{/violet}.** La circulation du sang inaugure la grande métaphore du corps comme {yellow}machinerie de pompes et de tuyaux{/yellow} ; le dualisme cartésien la légitime en assimilant le corps des animaux à une machine. Sa position fondamentale : {green}aucun principe vital autre que les « lois mécaniques »{/green}.

    **Le mécanisme cartésien superpose deux thèses, souvent mal distinguées.**
    - {sky}Les animaux sont des machines{/sky} (*Discours de la méthode*, V ; *Traité de l'homme*) : leurs fonctions suivent {teal}« de la seule disposition de ses organes, ni plus ni moins que ne font les mouvements d'une horloge ou d'un automate »{/teal}, sans {teal}« aucune autre âme végétative, ni sensitive »{/teal}. La question de l'ingénieur qui a construit ces machines et fixé leurs fonctions, Dieu, reste dans l'ombre.
    - {sky}Les lois physiques suffisent à expliquer les prestations et la formation des vivants{/sky} : dans le traité sur la formation du fœtus, Descartes en tire une théorie de l'{violet}épigenèse{/violet}, l'animal construit par ajouts successifs de configurations créées par le mouvement des liquides.

    **Pour les médecins, le mécanisme reste un {violet}idéal régulateur{/violet}.** Ils savent que dans la pratique le vivant ne s'assimile pas entièrement aux phénomènes matériels. D'où l'{red}aporie du mécanisme{/red} : il est commode pour comprendre des **mécanismes locaux** (circulation, digestion), mais {red}l'animal-machine dans son entier ne se laisse pas connaître{/red}.

    **Le mécanisme partage un défaut avec l'animisme qu'il a détruit.** L'{pink}animisme{/pink} de la Renaissance, prolongeant l'aristotélisme, donnait une âme à tous les êtres. Il reposait sur une difficulté d'Aristote : l'âme (*psuchè*) est {violet}entéléchie{/violet}, mais toute substance (*ousia*) en possède une, puisqu'elle est par soi ; le glissement était donc facile vers une âme en tout être. Le mécanisme a éradiqué cet animisme, mais {coral}__ni l'un ni l'autre ne font de différence décisive entre le vivant et le non-vivant__{/coral} : la nature est uniformément animée d'un côté, pure étendue de l'autre.

    ! L'aporie du mécanisme n'est pas d'expliquer mal les fonctions locales, mais de ne pas atteindre le tout de l'organisme : c'est exactement le problème que Bichat reprendra.
