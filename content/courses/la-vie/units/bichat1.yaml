lessons:
- id: bichat1-l1
  title: "La vie définie par la mort"
  notes: |-
    Toute l'étude part d'une **définition devenue si fameuse qu'on en a oublié l'auteur** : {teal}« La vie est l'ensemble des fonctions qui résistent à la mort »{/teal}, ouverture des {sky}*Recherches physiologiques sur la vie et la mort*{/sky} (1800) de **Marie-François Xavier Bichat** (1771-1802). Elle paraît familière ; elle est pourtant étrange, puisqu'elle fait entrer {red}la mort au principe même de la vie{/red}.

    **La définition tranche avec celle de la physiologie classique.** Jean **Fernel**, un des premiers à concevoir la physiologie, la définissait en 1645 dans sa *Médecine universelle* comme la science qui {teal}« explore la nature de l'homme sain, toutes ses forces et fonctions »{/teal}. La physiologie classique étudie donc {green}la santé, positivement{/green} ; Bichat la rapporte {red}à son contraire{/red}. D'où la question de départ : __quel tour de pensée a pu pousser Bichat à référer à la mort la « nature de l'homme sain » et la science qui en traite ?__

    **Bichat est au départ de trois traditions.**
    - En **médecine**, il fonde la médecine sur l'{violet}anatomie pathologique{/violet}, et Michel **Foucault** (*Naissance de la clinique*) a montré le rôle qu'y joue la considération de la mort.
    - En **anatomie**, il inaugure la science des tissus, l'{violet}histologie{/violet} ; Auguste **Comte** voit en lui un pionnier de l'âge positif et donne son nom à un mois du calendrier positiviste.
    - En **physiologie**, il ouvre la tradition que **Magendie** puis **Claude Bernard** nommeront {violet}physiologie expérimentale{/violet}.

    **La question devient alors précise** : __pourquoi a-t-il fallu des recherches sur la vie *et la mort* pour que naisse la physiologie expérimentale ?__ Quelle image de la vie s'y dessine, solidaire de la médecine anatomo-pathologique ? Et que dit la célébrité de la définition du statut de cette {coral}« énigmatique conjonction »{/coral} de la vie et de la mort dans notre pensée ?

    ! La définition ne dit pas que la vie est un simple sursis : elle désigne des **fonctions**, actives, qui résistent. Ce que Bichat en tire pour la connaissance du vivant fait l'objet de toute la suite.
