- id: bichat1-l4
  title: "Stahl : l'âme du vivant et l'organisme"
  notes: |-
    **Le mécanisme lève une question qu'il escamote aussitôt** : si la nature comme telle n'est pas vivante, qu'en est-il de ce que nous appelons « vie » ? {teal}« Ce qui me choquait par-dessus tout, écrit Stahl, c'est que dans cette théorie physique du corps humain, la vie, même dès le début, était passée sous silence, et que je n'en voyais nulle part une définition logique. »{/teal}

    **Stahl (1660-1734) renverse l'animisme.** Sa réponse : {green}__précisément parce que les êtres naturels n'ont pas d'âme, étant régis par les lois du mouvement, il faut que les vivants aient une âme irréductible aux choses naturelles__{/green}.
    - L'{pink}animisme classique{/pink} pense le naturel sur le mode du vivant : tout est vie, latente ou manifeste.
    - L'{green}animisme stahlien{/green} pense le vivant **par opposition** à la nature dont traite la physique.

    **Cette âme est une raison inconsciente.** Elle reste d'ordre spirituel : elle gouverne l'animal, lui fait éviter les dangers et rechercher ce qui lui convient, sans en avoir conscience. À la nature mécanique, Stahl oppose l'{violet}organisme{/violet}, ensemble de faits qui se coordonnent {teal}« bien certainement en vue d'une fin toute spécifique »{/teal}.

    **La finalité passe à l'intérieur du vivant.** Dans le mécanisme cartésien, {pink}puissance et finalité sont tout entières en Dieu{/pink} : le vivant ne tend à rien, il développe ce que Dieu a mis en lui. Stahl {green}met la finalité dans le vivant, sous forme d'âme{/green}. D'où sa thèse : {teal}« il n'y a de corps vivants que les corps organisés »{/teal}.

    **L'organisme devient le schème du vivant à la fin du siècle.** Même si la pensée de Stahl, embarrassée, fait peu l'unanimité, le concept d'organisme comme corps dont {coral}chaque partie existe pour le tout et comme fin pour les autres{/coral}, élaboré surtout par l'histoire naturelle, devient le moyen de penser la vie hors du mécanisme.
    - **Kant** (*Critique de la faculté de juger*, §66) : {teal}« Un produit organisé de la nature est celui en lequel tout est fin et réciproquement aussi moyen. »{/teal}
    - **Lamarck** : les facultés vitales {teal}« résultent essentiellement d'actes de l'organisation »{/teal}.
    - **Cuvier** : {teal}« La vie en général suppose donc l'organisation en général »{/teal}.

    ! Stahl ne revient pas à l'animisme de la Renaissance : son âme n'anime pas la nature, elle sépare au contraire le vivant de la nature.
  points:
