- id: bichat1-l8
  title: "Le problème légué à Bichat"
  notes: |-
    **Deux physiologies se font face, chacune incomplète.**

    | Physiologie | Méthode | Objet |
    | Haller | expérimentation | les parties |
    | vitalistes | observation | la totalité |
    | Claude Bernard (1856) | expérimentation | la totalité |

    Entre Haller et Claude Bernard se tiennent Bichat et Magendie. La question est donc : __quel changement du statut de l'expérience a permis de faire de la **totalité organique** un objet de savoir **expérimental**, alors qu'auparavant la totalité relevait de l'observation et l'expérimentation des parties ?__

    **Le dilemme légué à Bichat.**
    - {pink}La physique mécaniste, ou même newtonienne{/pink}, est insuffisante : {red}elle ne fait pas la différence entre vivant et non-vivant{/red}.
    - {pink}Le vitalisme{/pink} fait la différence, mais {red}__il est incapable d'édifier une science de la vie__{/red}. En définissant la vie par opposition à la nature matérielle, objet de la physique, il l'oppose au domaine de l'être régi par des lois : donc {coral}la vie ne reconnaît pas de lois{/coral}, et n'est plus intelligible scientifiquement. La clinique le confirme : une même maladie évolue différemment selon les sujets.

    **Conclusion paradoxale** : {red}ce qui est scientifiquement connu est, comme tel, non vivant{/red} (les corps morts de l'anatomiste), et {red}le vivant n'est pas connu scientifiquement{/red} ; tout au plus accumule-t-on des descriptions de l'économie animale et des parcours des sympathies.

    **L'aporie tient à la finalité interne.** Le propre du vivant est son rapport à une fin, sa {violet}« finalité interne »{/violet} au sens de Kant : sa tendance à la conservation, à la stabilité et à la reproduction. Or les rapports entre organes qui la rendent possible ne se connaissent ni {pink}par l'observation{/pink}, qui n'accède pas aux processus vitaux eux-mêmes, ni {pink}par l'expérimentation hallérienne{/pink}, qui ne laisse voir que du partiel et de l'artificiel ; ni en subordonnant la physiologie à l'anatomie, vision du corps mort, ni en faisant des organes de petits vivants échangeant comme {yellow}des citoyens dans une économie politique{/yellow}. On pressent que le vivant est un genre d'être spécifique, mais {red}on ne sait pas faire de cette spécificité quelque chose de connaissable{/red}.

    **D'où le paradoxe de Bichat** : {green}__il est vitaliste, et pourtant tout son travail tend à établir une science des phénomènes vivants__{/green}. Comment c'est possible : ses thèses et leur généalogie (unité suivante), l'architecture des *Recherches* (troisième unité), leur portée chez Magendie et Claude Bernard (quatrième).
