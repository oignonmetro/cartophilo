- id: bichat1-l6
  title: "Haller contre Bordeu : la querelle des propriétés vitales"
  notes: |-
    **La spécificité des problèmes physiologiques du tournant du siècle se joue entre Haller et Bordeu**, qui s'affrontent sur la nature des propriétés vitales.

    **Haller : la physiologie, « anatomie animée ».** Chaque organe a une fonction ; l'anatomie en décrit la forme sur le corps mort, la physiologie en saisit la fonction quand l'organe est animé. {pink}L'anatomie est le fil conducteur de la physiologie{/pink} : si tel organe a telle place et telle conformation, il aura telle fonction. La physiologie y ajoute seulement les propriétés vitales (irritabilité, sensibilité) que des expériences mesurent. C'est **la première forme de physiologie expérimentale**, mais parallèle à l'anatomie et portant sur des parties.

    **Bordeu : chaque organe sensible à sa manière.** Principal inspirateur de l'{violet}école vitaliste de Montpellier{/violet} et maître des médecins de l'*Encyclopédie* (Fouquet, Ménuret de Chambaud), il explique dans ses *Recherches sur les glandes* (1751) la sécrétion par une **sensibilité discriminatoire** de chaque glande à certains éléments. Le vivant est un ensemble d'organes dont chacun a sa {violet}« vie propre »{/violet}.

    **Le vitalisme se définit alors.** C'est {green}__penser une autonomie radicale du vivant, définie par une propriété irréductible, la sensibilité__{/green}. Plus besoin d'âme : le corps se gouverne seul, agencement d'êtres sensibles élémentaires, les organes. Et le vivant déroge aux lois physiques : {coral}les propriétés vitales sont plastiques, variables{/coral}, à la différence des propriétés physiques, constantes et régulières.

    **L'enjeu philosophique de la querelle est l'âme.** Pour Haller, les corps bruts ont la gravitation, les vivants l'irritabilité, et certains animaux la sensibilité, {pink}signe d'une âme{/pink} qui reçoit les informations des nerfs. En définissant la vie par la sensibilité, Bordeu {green}économise l'âme{/green}. La querelle de l'irritabilité et de la sensibilité recouvre donc la question de **la pertinence de la notion d'âme pour comprendre le vivant**.

    ! Haller n'est pas animiste : aucune âme chez lui ne dirige les phénomènes vitaux ; l'âme n'est que le récepteur de la sensibilité, propre à certains animaux.
