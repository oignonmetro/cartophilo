- id: bichat1-l7
  title: "L'économie animale, objet d'observation"
  notes: |-
    **Le vitalisme de Bordeu doit comprendre l'accord des organes.** Les manifestations du vivant (reproduction, nutrition, mouvement) tendent toutes à sa conservation : elles témoignent d'une activité ordonnée vers une fin, donc d'**une harmonie nécessaire** entre des organes qui vivent chacun pour soi.

    **L'image de l'essaim d'abeilles.** Bordeu puis Maupertuis comparent l'homme à {yellow}un groupe d'abeilles qui s'attachent à une branche{/yellow}, se pressent, se soutiennent et forment une espèce de tout, {teal}« dans lequel chaque partie vivante à sa manière contribue par la correspondance et la direction de ses mouvements à entretenir cette espèce de vie de tout le corps »{/teal} (Ménuret de Chambaud, *Encyclopédie*, art. « Observation »).

    **L'image fait problème : où est la vie ?** Comment penser le rapport de la vie des parties à celle du tout ?
    - Si la vie est {pink}dans l'organisation{/pink}, alors {red}les éléments de l'organisation ne vivent pas{/red}.
    - Si elle est {pink}dans la vie propre des organes{/pink}, alors {red}on ne voit plus ce que l'organisation apporte{/red}, ni comment elle est possible.

    **L'{violet}économie animale{/violet} est l'objet du questionnement vitaliste.** L'organisme se distingue de l'être matériel par son **ordre** (harmonie) et par les **propriétés** de ses éléments (sensibles). {teal}« L'économie animale, c'est l'ordre, le mécanisme, l'ensemble des forces qui entretiennent la vie »{/teal} (Ménuret). Un de ses facteurs majeurs est la {violet}sympathie{/violet}, notion hippocratique : la communication d'affections entre parties éloignées, par des chemins parfois étranges, sans support visible comme les nerfs.

    **Elle s'observe, elle ne s'expérimente pas.** Séparé des lois naturelles, le vivant ne se connaît plus par la mécanique et la chimie : {teal}« appliquons-nous à observer »{/teal}, dit Bordeu. Contre l'{pink}expérimentation hallérienne{/pink}, les vitalistes objectent deux choses : {red}__elle n'opère que sur une partie, et n'accède donc pas à la totalité de l'organisme ; elle crée des conditions artificielles__{/red}, qui ne sont pas celles de l'animal naturel. Goldstein reprendra l'argument contre la reconstruction du système nerveux en réflexes. Seule {green}l'observation respecte le vivant comme vivant{/green}. Son pendant en médecine est la {violet}clinique{/violet} (Cabanis) : non plus classer les maladies comme des espèces (médecine {violet}nosologique{/violet}), mais saisir le mal de chaque malade à partir de l'ensemble de ses symptômes.

    ! L'observation vitaliste n'est pas un retard : elle procède de la modestie newtonienne. Cabanis : la cause qui meut les corps animés est inconnue, comme toute cause première, et sa connaissance ne servirait à rien.
