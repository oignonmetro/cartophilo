    sentence: "« Ce qui me choquait par-dessus tout, c'est que dans cette théorie physique du corps humain, la ___, même dès le début, était passée sous silence » : Stahl reproche au mécanisme d'escamoter la question de ce qui fait le vivant."
    answer: "vie"
