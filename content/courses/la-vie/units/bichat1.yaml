- id: bichat1-l5
  title: "Spinoza, Leibniz, Newton : la fin de l'inertie"
  notes: |-
    **Les réticences des physiologistes envers le mécanisme s'éclairent par la philosophie postcartésienne.** Stahl fut un interlocuteur de **Leibniz**, qui consacra un écrit à réfuter sa *Theoria medica vera* : la physiologie participe donc des mises en question du cartésianisme par Spinoza, Leibniz et Newton.

    **Chez Descartes, les corps sont inertes et le vivant renvoie à Dieu.** L'essence de la matière est l'étendue : les corps n'ont en eux-mêmes aucune force ; Dieu a mis le mouvement dans le monde et en conserve la quantité. Le mécanisme ne peut alors se passer de la théologie : si les animaux sont des machines, {pink}un ingénieur suprême les a construites{/pink}, et l'énigme de leurs prestations finalisées se concentre en Dieu. Détachée de la théologie, la physiologie mécaniste perd sa consistance, comme le montre {amber}la préférence des philosophes (Leibniz, Bonnet, Haller) pour le {violet}préformationnisme{/violet} de Malebranche{/amber}, qui concentre la puissance créatrice à l'origine, en Dieu.

    **Spinoza et Leibniz rendent aux corps une autonomie.**
    - **Spinoza** : l'essence actuelle d'un corps est son {violet}*conatus*{/violet}, l'effort pour persévérer dans son être (*Éthique*, III, 7). Le corps enveloppe la raison de son mouvement ; sans admettre de finalité, cette spontanéité incite à penser {coral}une vie universelle{/coral} qui se confond avec celle de Dieu (*Deus sive natura*).
    - **Leibniz** : l'essence d'une substance est sa **force**. Premier à employer le mot d'{violet}organisme{/violet} pour les vivants, il le conçoit comme {yellow}une machine infiniment organisée{/yellow} ; et comme toute monade est perception et appétition, l'organisme tend vers une fin. Mais il n'y a pour lui qu'{red}une différence de degré{/red} entre vivant et artifice (machine infinie, machine finie), quand pour Stahl le vivant s'oppose essentiellement à l'inanimé, dont les lois tendent à sa corruption.

    **Newton fournit à la physiologie sa méthode.** La gravitation est une force émanée de chaque corps, non un mouvement imprimé du dehors. La méthode newtonienne : {green}ne pas faire d'hypothèses sur la cause première, exprimer les lois selon lesquelles agissent les forces{/green}. **Haller** l'applique au vivant : comme Newton constate la gravitation, il constate l'{violet}irritabilité{/violet}, propriété qu'a une partie de se raccourcir quand on la touche, et en mesure les degrés. Elle varie inversement à la {violet}sensibilité{/violet}, propriété de ressentir les excitations par les nerfs pour les transmettre à l'âme.

    **Haller est dualiste au sens de Descartes, mécaniste au sens de Newton.** Dualiste : la matière, brute ou irritable, d'un côté, les âmes de l'autre, dont le signe est la sensibilité. Mécaniste : sans en demander la cause, il étudie les lois d'une propriété constatable.

    ! « Mécaniste au sens de Newton » ne veut pas dire que Haller réduit le vivant à la physique : il lui attribue une propriété propre, l'irritabilité, comme Newton attribue la gravitation aux corps.
