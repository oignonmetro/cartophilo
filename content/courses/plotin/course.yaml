      - id: t-1-2
        title: "Sur les vertus"
        ennead: 1
        numberInEnnead: 2
        chrono: 19
        highlight: true
        unit: traite19
        theses:
          - "Nos vertus nous rendent semblables à un divin qui n'a pas de vertus : il y a deux sortes d'assimilation."
          - "Les vertus civiques imposent mesure et limite aux passions : un premier pas vers le divin."
          - "Les vertus supérieures sont des purifications : l'âme se tourne vers l'Intellect, et l'homme devient un dieu."
        summary: |-
          Le traité 19 part du mot du *Théétète* (176b) : la vertu consiste à se rendre « semblable au dieu ». **L'éthique de Plotin a ceci de déconcertant que sa seule activité est la poursuite de l'union de l'âme avec le divin.**

          - **Un paradoxe** : nos vertus nous rendent semblables à un divin qui n'a pas de vertus. Il se résout par la **double assimilation** (chap. 2) : celle de deux images d'un même modèle, et celle de l'image à son modèle. Entre les niveaux de l'être, pas de rupture : chaque niveau garde une **trace** du précédent.
          - **Les vertus civiques** (réflexion, courage, maîtrise de soi, justice) imposent mesure et limite aux passions : c'est la **métriopathie** d'Aristote, un premier pas.
          - **Les vertus plus hautes sont des purifications** (`kátharsis`) : détachement du corps et **retour** (`epistrophḗ`) vers l'Intellect, qui illumine les traces de l'intelligible en l'âme. Elles suppriment les passions : l'**impassibilité** (`apátheia`) des stoïciens.
          - L'homme purifié est **« uniquement un dieu »** ; il faut choisir non la vie de l'homme de bien, mais **la vie des dieux** (chap. 7).

          Porphyre, puis Macrobe et les néoplatoniciens, en tireront une échelle de « degrés de vertus », étrangère à la lettre de Plotin.
      - id: t-1-3
        title: "Sur la dialectique"
        ennead: 1
        numberInEnnead: 3
        chrono: 20
        highlight: true
        unit: traite20
        theses:
          - "La dialectique est une méthode de purification : le moyen de l'ascension de l'âme vers le Bien."
          - "Le musicien, l'amant et le philosophe du Phèdre sont trois degrés de la remontée vers l'intelligible."
          - "La dialectique n'est pas la logique, ni un instrument : c'est la partie la plus précieuse de la philosophie."
        summary: |-
          **Le traité 20, suite du traité 19 (I, 2), fait de la dialectique la méthode de l'ascension de l'âme vers le Bien : une méthode de purification éthique, et non seulement de recherche et de définition, comme chez Platon.**

          - **Trois figures** du *Phèdre* (248d) : l'âme qui a le plus vu naît dans un philosophe, un musicien ou un amant. Plotin en fait trois degrés de la remontée (chap. 1-3) : le **musicien**, ému par le beau des sons, doit aller à l'harmonie intelligible ; l'**amant**, épris d'un corps, doit aller à la beauté de tous les corps, puis des occupations, des sciences et des vertus ; le **philosophe**, qui a « des ailes », n'a besoin que des mathématiques puis de la dialectique.
          - **La dialectique véritable** (chap. 4-5) dit de chaque chose ce qu'elle est, divise et rassemble les genres jusqu'au principe, puis contemple. Elle laisse à une autre technique la **logique** des propositions et des syllogismes (celle d'Aristote et des stoïciens).
          - Elle n'est pas un instrument de la philosophie, mais **sa partie la plus précieuse** (chap. 6), qui embrasse la physique et l'éthique.

          Comme les vertus civiques avant la purification, la logique n'est qu'un préalable, à dépasser.
