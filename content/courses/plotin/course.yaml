# Squelette à vide : trois pistes communes aux deux auteurs de l'explication
# de texte (voir content/courses/marx/course.yaml). `kind: grammar` sur les
# trois : c'est la nature de contenu décidée pour l'explication de texte
# (voir CLAUDE.md « Non encore décidé » et content/philosophie.md), rappel
# de cours puis phrase à trou, sans association ni QCM, ce que demandait déjà
# CLAUDE.md pour Glossaire et Repérage, et qui convient tout autant à Idées.

id: plotin
name: Plotin
learning: plotin
known: fr
flag: 🏛️
tagline: Explication de texte.
status: available
default: false
layout: library
version: 7

tracks:
  - id: glossaire
    title: Glossaire
    subtitle: Notions centrales
    kind: grammar
    color: teal
    icon: glossary
    units: [g-un, g-intellect, g-ame, g-sundioikesis, g-noothenai, g-henosis]

  - id: idees
    title: Idées
    subtitle: Thèses et arguments
    kind: grammar
    color: violet
    icon: bulb
    units: [id1, id2, id3, id4, id5, id6, id7, id8]

  - id: textes
    title: Textes
    subtitle: Explications suivies, paragraphe par paragraphe
    kind: grammar
    color: coral
    icon: page
    # Une unité par texte étudié (voir content/textes.md) : ses leçons
    # suivent les paragraphes, cartes jouées dans l'ordre écrit.
    units: [t10c1]

  - id: reperage
    title: Repérage
    subtitle: Se situer dans les œuvres
    kind: grammar
    color: sky
    icon: compass
    units: []
    # Les 54 traités des Ennéades ne sont pas des leçons : un pur index de
    # référence, un moyen mnémotechnique pour se repérer dans l'ordre de
    # Porphyre (ci-dessous) et le rang chronologique de rédaction (`chrono`,
    # voir la Vie de Plotin). Cliquer un traité ouvrira son résumé (à
    # rédiger) ; les exercices viendront séparément, communs à toute la
    # piste plutôt que propres à chaque traité (voir `treatiseEntrySchema`).
