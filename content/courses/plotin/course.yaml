        chrono: 41
      - id: t-4-7
        title: "Sur l'immortalité de l'âme"
        ennead: 4
        numberInEnnead: 7
        chrono: 2
        unit: traite2
        theses:
          - "Nous sommes notre âme : elle est immortelle, car elle a l'être et la vie par elle-même."
          - "L'âme n'est pas un corps : un souffle corporel n'expliquerait ni la mémoire, ni la sensation, ni la pensée."
          - "L'âme produit et gouverne les corps par des « raisons » (lógoi), sans quitter l'intelligible."
        summary: |-
          **Le traité 2 établit que l'âme, qui est ce que nous sommes, est incorporelle, immortelle et intelligible.** Il prend un tour « doxographique » : Plotin réfute les définitions de l'âme de ses prédécesseurs avant de défendre la sienne, qu'il tient pour platonicienne.

          - **Nous sommes notre âme** (chap. 1-2) : le corps, composé, se dissout ; l'âme, qui est le soi, est la cause de l'existence des corps.
          - **Contre l'âme corporelle** : les épicuriens (atomes, chap. 3) et surtout les stoïciens, pour qui l'âme est un souffle (`pneûma`) corporel (chap. 3 à 8³). Si l'âme était un corps, il n'y aurait ni mémoire, ni sensation unifiée, ni pensée.
          - **Contre l'âme « harmonie »** des pythagoriciens (chap. 8⁴) et l'âme **« entéléchie »** d'Aristote (chap. 8⁵) : l'âme n'est forme d'aucun corps.
          - **La nature de l'âme** (chap. 9-12) : elle a l'être et la vie par elle-même ; elle est divine, immortelle, indivisible.
          - **La venue dans le corps** (chap. 13-15) : l'âme produit et gouverne les corps par des « formules rationnelles » (`lógoi`) sans quitter l'intelligible ; sa descente n'est que partielle.

          Le traité 4 (IV, 2) et le traité 21 (IV, 1) en sont la suite.
      - id: t-4-8
        title: "Sur la descente de l'âme dans les corps"
        ennead: 4
        numberInEnnead: 8
        chrono: 6
        priority: 2
        highlight: true
        unit: traite6
        theses:
          - "Toute âme est duelle : une partie tournée vers le corps, l'autre vers l'Intellect."
          - "La descente de l'âme est à la fois volontaire et nécessaire."
          - "Le corps manifeste l'âme et n'est pas méprisable : seule l'âme individuelle est « contaminée » par lui."
        summary: |-
          **Le traité 6 pose la question du rapport de l'âme et du corps : comment deux natures hétérogènes, l'une sensible, l'autre intelligible, forment-elles une « communauté » ?** Le rapport de l'âme au corps se pense comme une **descente** (`katabàs`).

          - Le traité s'ouvre sur l'un des passages les plus célèbres de Plotin : « Souvent, lorsque je m'éveille à moi-même en sortant de mon corps… ». Il aborde la question par le haut, depuis l'identité intelligible de l'âme.
          - Plotin convoque Héraclite, Empédocle et Pythagore, qui parlent « par énigmes », puis Platon, chez qui il trouve deux axes : la descente comme **chute** (*Phédon*, *République*, *Phèdre*) ou comme **achèvement de l'univers** (*Timée*).
          - Toute âme a une partie tournée vers le corps et une partie tournée vers l'Intellect ; mais l'âme de l'univers gouverne son corps sans en pâtir, quand l'âme individuelle en est « contaminée », à cause de la **matière**.
          - La descente est à la fois **volontaire** et **nécessaire** (chap. 5) : le volontaire est compris dans la nécessité.
          - Le corps n'est pas méprisable : il manifeste l'âme, qui sans lui aurait ignoré ce qu'elle possède. Intelligible et sensible sont solidaires.
      - id: t-4-9
        title: "Si toutes les âmes n'en sont qu'une"
        ennead: 4
        numberInEnnead: 9
        chrono: 8
        unit: traite8
        theses:
          - "Toutes les âmes n'en sont qu'une : leur multiplicité n'est qu'apparente."
          - "La diversité des vivants vient des corps : une même âme anime différemment des corps différents."
          - "L'âme est une malgré ses puissances multiples, comme une science est tout entière en chacun de ses théorèmes."
        summary: |-
          **Le traité 8 reprend la question classique de l'unité de l'âme, et défend une thèse que Plotin sait audacieuse : toutes les âmes n'en sont qu'une.**

          - Contre les stoïciens (l'âme serait un corps) et Aristote (l'âme « entéléchie »), il rappelle, après le traité 2, que l'âme est incorporelle et indivisible.
          - Au-delà de l'**homogénéité** des âmes, lieu commun platonicien, il soutient leur **unité** : la multiplicité des âmes n'est qu'apparente ; c'est une seule âme qui se manifeste de différentes manières. Il retient la **sympathie universelle** des stoïciens, mais la rapporte à une âme unique.
          - Deux objections : la diversité des vivants, qui vient des **corps** ; la diversité des **facultés**, qui ne contrarie pas l'unité : « ce n'est pas parce que l'âme a plusieurs puissances qu'elle n'est pas une » (3, 16-17).
          - Justification : l'unité de **provenance** (les empreintes d'un même **sceau**) et la comparaison de la **science**, présente tout entière en chacun de ses théorèmes.

          Reste une ambiguïté, que les traités 27-29 (IV, 3-5) devront affronter : comment les âmes individuelles procèdent-elles de l'âme du monde sans en être distinctes ?
      - id: t-5-1
        title: "Sur les trois hypostases qui ont rang de principes"
        ennead: 5
        numberInEnnead: 1
        chrono: 10
        priority: 5
        highlight: true
        unit: traite10
        theses:
          - "Il y a trois réalités véritables, l'Un, l'Intellect et l'Âme : chacune est produite par la précédente."
          - "Les âmes se sont éloignées de leur source par audace et en ont oublié l'origine."
          - "Les trois réalités sont aussi en nous : il faut fuir les « bruits sensibles » pour entendre ceux de l'intérieur."
        summary: |-
          **Le traité 10 est le seul exposé à la fois systématique et synthétique de la doctrine plotinienne des trois réalités véritables, l'Un, l'Intellect et l'Âme, que le titre de Porphyre nomme « hypostases ».** Il part d'une question : pourquoi l'âme s'est-elle éloignée de sa source ?

          - **L'Âme** (chap. 1-3) : par **audace** (`tólma`), les âmes ont voulu s'appartenir et oublié le dieu leur père. Il faut leur rappeler leur dignité : l'âme du monde donne vie et ordre à tout l'univers. L'Âme est l'image de l'Intellect, comme le discours prononcé l'est du discours intérieur ; sa pensée est discursive (`diánoia`), celle de l'Intellect intuitive (`nóēsis`).
          - **L'Intellect** (chap. 4-7) est « pensée » et « être » ; il contient les genres premiers du *Sophiste*. Multiple, il vient de l'Un, qui l'engendre sans vouloir ni se mouvoir, par **surabondance**, comme le soleil sa lumière. L'engendré se **retourne** (`epistrophḗ`) vers son principe et s'en trouve déterminé. Kronos qui avale ses enfants figure l'Intellect.
          - **Les prédécesseurs** (chap. 8-9) : seuls Platon et les pythagoriciens ont saisi la hiérarchie des trois principes ; Plotin se présente en **interprète** de Platon.
          - **L'homme intérieur** (chap. 10-12) : les trois réalités sont aussi en nous ; il faut négliger les **« bruits sensibles »** pour entendre les sons de là-bas.

          Augustin et Eusèbe l'ont lu à la lumière de la Trinité chrétienne, au prix d'un contresens sur la causalité nécessaire de l'Un.
      - id: t-5-2
        title: "Sur la génération et le rang des choses qui sont après le premier"
        ennead: 5
        numberInEnnead: 2
        chrono: 11
        unit: traite11
        theses:
          - "L'Un, parfait et sans besoin, surabonde : l'engendré se tourne vers lui, le voit et devient l'Intellect."
          - "L'Âme engendre en descendant une image d'elle-même : ses facultés sensible et végétative."
          - "La réalité est continue, sans rupture entre ses niveaux, « comme une longue vie qui s'étend dans sa longueur »."
        summary: |-
          **Le petit traité 11 (deux chapitres) établit la continuité entre les niveaux de la réalité : la tripartition du réel en Un, Intellect et Âme n'implique aucune rupture.**

          - **« L'Un est toutes choses et il n'est aucune d'elles »** : parfait, sans besoin, il **surabonde** ; l'engendré, indéterminé, se tourne vers lui, le voit, et devient à la fois **Intellect** (par la vision) et **être** (par son repos orienté vers lui).
          - L'Intellect produit de même l'**Âme**. Mais l'Âme, elle, produit en se mouvant, par désir de ce qui est inférieur : elle engendre une **image** d'elle-même, ses facultés sensible et végétative.
          - L'Âme est dans une plante, un animal ou un homme selon la faculté qui domine ; mais elle n'est **en aucun lieu**, donc partout : couper une plante ne la déplace pas.
          - Contre l'objection d'une multiplication des principes, un même processus (surabondance, puis **retour**) gouverne chaque niveau : chaque réalité est l'image de la précédente et le modèle de la suivante.

          Le traité finit sur une image : le réel est **« comme une longue vie qui s'étend dans sa longueur »**.
      - id: t-5-3
        title: "Sur les hypostases qui ont la faculté de connaître et ce qui est au-delà"
        ennead: 5
        numberInEnnead: 3
        chrono: 49
        highlight: true
      - id: t-5-4
        title: "Comment vient du premier ce qui est après le premier, et sur l'Un"
        ennead: 5
        numberInEnnead: 4
        chrono: 7
        highlight: true
        priority: 3
        unit: traite7
        theses:
          - "L'Intellect provient immédiatement de l'Un, qui pourtant demeure en lui-même."
          - "L'Intellect est l'intellection de l'Un : distinct de lui, il n'en est pas séparé."
          - "Toute réalité a deux actes : l'un la définit, l'autre fait exister autre chose (la chaleur du feu)."
        summary: |-
          **Le bref traité 7 (deux chapitres) affronte une difficulté première : si toutes choses viennent de l'Un, comment en viennent-elles, alors que l'Un « reste en lui-même » ?**

          - La procession est posée sous sa forme la plus simple : ce qui vient de l'Un en vient soit par des **intermédiaires**, soit **immédiatement**. Plotin défend la seconde voie : l'**Intellect** provient immédiatement de l'Un.
          - L'Un est simple, unique, parfait, « au-delà de la réalité » ; il **demeure** (`ménei`) en lui-même, comme le démiurge du *Timée* (42e5-6). On ne le connaît que relativement : il n'est « intelligible » que pour l'Intellect qui le pense.
          - L'Intellect est une **intellection** de l'Un, donc une dualité : distinct de l'Un, il n'en est pas séparé.
          - La thèse des **deux actes** explique la procession : toute réalité a un acte qui la constitue et un acte second qui en provient sans l'affecter, comme la chaleur du feu. L'Un est une puissance qui surabonde.

          Le traité établit déjà fermement les principales thèses des traités ultérieurs.
      - id: t-5-5
        title: "Sur l'intellect et que les intelligibles ne sont pas hors de l'intellect, et sur le Bien"
        ennead: 5
        numberInEnnead: 5
        chrono: 32
      - id: t-5-6
        title: "Sur le fait que ce qui est au-delà de l'être n'intellige pas, et sur ce que sont les principes premier et second d'intellection"
        ennead: 5
        numberInEnnead: 6
        chrono: 24
        unit: traite24
        theses:
          - "Contre Aristote, ce qui pense, même soi-même, n'est pas premier : le principe, absolument un, n'intellige pas."
          - "Ce qui s'intellige soi-même est à la fois un et deux : il faut qu'il soit « simple et non simple »."
          - "Intelliger, c'est un mouvement qui se porte vers le Bien en le désirant : le désir a engendré l'intellection."
        summary: |-
          **Le traité 24 dissocie l'excellence du principe de l'activité de pensée : ce qui pense, même soi-même, ne peut plus prétendre au premier rang.** Il vise la théologie d'Aristote, pour qui l'Intellect qui se pense est « la plus divine des choses » : Plotin lui substitue l'Un, parfait parce que purifié de toute intellection.

          - **Penser, c'est être deux** (chap. 1) : ce qui s'intellige est à la fois un et deux, « simple et non simple ». L'âme pense autre chose qu'elle ; l'Intellect se pense lui-même, et pense ainsi au sens propre.
          - **Le Premier n'intellige pas** (chap. 2-3) : il y a un principe qui n'intellige pas, un principe qui intellige en un sens premier (l'Intellect) et un autre en un sens second (l'âme). Le multiple suppose une unité simple avant lui.
          - **Les images** (chap. 4) : l'Intellect « prend la forme du Bien » ; le Bien est la lumière, l'Intellect le soleil, l'âme la lune.
          - **Le désir précède la pensée** (chap. 5) : « intelliger : un mouvement qui se porte vers le Bien en le désirant ». L'Intellect ne s'intellige que par accident, en regardant vers le Bien.
          - **Au-delà de la réalité, au-delà de l'intellection** (chap. 6) : le Bien ne se connaît pas ; il donne aux autres choses de l'atteindre.

          C'est l'un des gestes inauguraux du néoplatonisme.
      - id: t-5-7
        title: "S'il y a des idées même des êtres individuels"
        ennead: 5
        numberInEnnead: 7
        chrono: 18
        unit: traite18
        theses:
          - "Il y a une Idée de chaque individu, un « Socrate en soi » : les différences entre les hommes sont formelles."
          - "Le nombre des individus en soi est déterminé : à chaque période, le monde recommence à l'identique."
          - "Il y a autant de raisons que d'individus différents : la matière n'explique que la laideur."
        summary: |-
          **Le bref traité 18 (trois pages) est l'un des plus originaux de Plotin : il y a une Idée de chaque individu, un « Socrate en soi ».** Platon ne l'avait pas soutenu explicitement.

          - La participation ne relie pas seulement le sensible à une forme universelle (l'homme en soi), mais aussi l'individu à un **individu en soi** : les différences entre les hommes sont des **« différences formelles »**, non de simples accidents de la matière.
          - **L'illimité n'est pas à craindre** dans l'intelligible : le nombre des individus en soi est pourtant déterminé, car le monde revient à l'identique à chaque **période**, la Grande Année.
          - Deux conséquences : la rationalité s'étend au monde des individus ; et l'âme garde, après la mort, sa personnalité et son unicité. **Plotin refuse d'identifier individualité et irrationalité.**
          - Les chapitres 2-3 confrontent la thèse à la naissance des enfants et au cas des **jumeaux** : « il y a autant de raisons que d'individus différents » ; la matière n'explique que la laideur.
      - id: t-5-8
        title: "Sur la beauté intelligible"
        ennead: 5
        numberInEnnead: 8
        chrono: 31
        highlight: true
      - id: t-5-9
        title: "Sur l'Intellect, les idées et ce qui est"
        ennead: 5
        numberInEnnead: 9
        chrono: 5
        unit: traite5
        theses:
          - "L'Intellect est les Formes qu'il pense : elles ne sont ni avant ni après lui, mais en lui."
          - "Toujours en acte, l'Intellect est antérieur et supérieur à l'Âme : il n'est pas l'âme parvenue à sa perfection."
          - "Il y a une Forme de l'homme, mais aucune des choses sans valeur, qui viennent de la matière."
        summary: |-
          **Le traité 5 examine la nature et l'organisation du monde intelligible : le rapport entre l'Intellect et les Formes**, qui sont pour les platoniciens la totalité des réalités « qui sont réellement ».

          - **Chap. 1-2 : la vraie philosophie.** Trois genres d'hommes : ceux qui en restent à la sensation et au plaisir (épicuriens), ceux qui s'élèvent un peu par la vie pratique (stoïciens), ceux qui contemplent l'intelligible (platoniciens). Il faut monter d'« ici-bas » jusque « là-bas ».
          - **Chap. 3-6 : l'Intellect.** Il donne à l'âme sa forme et ses « raisons » (`lógoi`) ; toujours en acte, il est supérieur à l'âme ; il se pense lui-même, et se penser soi-même, c'est penser les Formes, qui sont en lui. Il est « toutes les choses ensemble ».
          - **Chap. 7-14 : les Formes.** Elles ne sont pas produites par l'Intellect qui les pense : elles lui sont « antérieures », c'est-à-dire contemporaines. Puis : de quoi y a-t-il des Formes ? Pas des choses contraires à la nature, pas des techniques (sauf en l'homme), une Forme de l'homme mais peut-être pas de Socrate, aucune de la boue ni des composés accidentels.

          Les sources sont Platon (théorie des Formes), Aristote (forme dans la matière, intellect qui se pense) et le médioplatonisme (les Formes, pensées de l'Intellect). Le traité laisse pour plus tard la question de l'Un : le traité 7 (V, 4) y répondra.
      - id: t-6-1
        title: "Sur les genres de l'être I"
        ennead: 6
        numberInEnnead: 1
        chrono: 42
      - id: t-6-2
        title: "Sur les genres de l'être II"
        ennead: 6
        numberInEnnead: 2
        chrono: 43
      - id: t-6-3
        title: "Sur les genres de l'être III"
        ennead: 6
        numberInEnnead: 3
        chrono: 44
      - id: t-6-4
        title: "Sur la raison pour laquelle l'être, un et identique, est partout tout entier I"
        ennead: 6
        numberInEnnead: 4
        chrono: 22
        unit: traite22
        theses:
          - "Ce n'est pas l'intelligible qui est dans le sensible : c'est le sensible qui est dans l'intelligible, dans l'être."
          - "L'âme ne vient pas dans les corps : c'est le corps qui s'avance vers elle et en reçoit ce qu'il peut."
          - "Comme une parole est entendue tout entière par chaque oreille, l'âme une est tout entière présente à chaque corps."
        summary: |-
          **Les traités 22 et 23, qui n'en formaient sans doute qu'un seul, exposent la théorie plotinienne de la participation : comment l'intelligible, un et identique, est-il partout tout entier dans le sensible ?** C'en est l'exposé le plus abouti chez Plotin.

          - **Le renversement** (chap. 2) : ce n'est pas l'intelligible qui est dans le sensible, c'est le sensible qui est dans l'intelligible ; « partout » signifie « dans l'être ».
          - **L'indivisible reste en lui-même** : le divisible est une affection du corps, l'indivisible une affection de l'incorporel (chap. 8). L'âme une contient les âmes multiples, comme une âme ses sciences (chap. 4).
          - **Ce n'est pas l'âme qui vient dans le corps, c'est le corps qui s'avance vers elle** et en reçoit ce qu'il peut : « ce qui est présent est présent selon l'aptitude de ce qui le reçoit » (chap. 6, 11-12).
          - **Les images** : la main qui soulève un bois plus grand qu'elle, la sphère lumineuse, le son entendu tout entier par chaque oreille, l'assemblée troublée par le peuple (chap. 7, 12, 15).
          - **Nous étions là-bas** des hommes intelligibles ; un second homme s'est ajouté à nous (chap. 14). « Descendre », c'est seulement se trouver dans un corps (chap. 16).

          Le traité 23 (VI, 5) reprend la même démonstration et l'achève sur une exhortation.
      - id: t-6-5
        title: "Sur la raison pour laquelle l'être, un et identique, est partout tout entier II"
        ennead: 6
        numberInEnnead: 5
        chrono: 23
        unit: traite23
        theses:
          - "Tous les hommes croient le dieu présent partout, un et identique : c'est le principe le plus solide de tous."
          - "Quand nous connaissons vraiment, nous ne recevons pas les intelligibles : nous sommes en eux, nous les devenons."
          - "On devient tout en rejetant le non-être : ce n'est pas le tout qui vient à nous, c'est nous qui nous en détournons."
        summary: |-
          **Le traité 23, suite du traité 22 (VI, 4), achève la démonstration : l'être véritable reste en lui-même, et ce sont les autres choses qui en participent, autant qu'elles le peuvent.** Il passe de la participation à une exhortation : se retourner vers l'intelligible, notre véritable demeure.

          - **Une notion commune** (chap. 1) : tous les hommes disent le dieu présent en chacun, un et identique ; c'est « le principe le plus solide de tous ». Mais la raison, qui prend ses principes dans les corps, divise : il faut raisonner sur l'intelligible à partir de ses propres principes (chap. 2).
          - **L'unité véritable ne se trouve en aucune chose** (chap. 3) ; croire en dieu, c'est croire que la même chose est partout entière (chap. 4). Mise en garde contre l'image du cercle et de ses rayons (chap. 5).
          - **Nous sommes les intelligibles** (chap. 7) : connaître vraiment, ce n'est pas recevoir des empreintes, c'est être en eux. Il faut se retourner, comme Achille tiré par les cheveux par Athéna.
          - **La matière n'est pas loin des formes** (chap. 8) : elle se tient auprès d'elles ; l'Éros « qui veille à la porte » possède la beauté en restant auprès d'elle (chap. 10).
          - **On devient tout en rejetant le non-être** (chap. 12) : ce n'est pas le tout qui vient à nous, c'est nous qui nous en détournons.
