        chrono: 44
      - id: t-6-4
        title: "Sur la raison pour laquelle l'être, un et identique, est partout tout entier I"
        ennead: 6
        numberInEnnead: 4
        chrono: 22
        unit: traite22
        theses:
          - "Ce n'est pas l'intelligible qui est dans le monde sensible, mais le monde sensible qui est dans l'intelligible, c'est-à-dire dans l'être."
          - "L'âme ne vient pas dans les corps : c'est le corps qui s'avance vers elle et en reçoit ce qu'il peut."
          - "Comme une parole est entendue tout entière par chaque oreille, l'âme une est tout entière présente à chaque corps."
        summary: |-
          **Le traité 22 renverse la question de la participation : ce n'est pas l'intelligible qui est dans le sensible, c'est le sensible qui est dans l'intelligible ; l'âme ne vient pas dans les corps, ce sont eux qui s'avancent vers elle.** Avec le traité 23, qui n'en formait sans doute qu'un seul, c'est l'exposé le plus abouti de Plotin sur la participation.

          - **La question** (chap. 1) : comment l'âme, incorporelle et sans grandeur, peut-elle être partout dans l'univers ?
          - **Le renversement** (chap. 2-3) : « partout » signifie « dans l'être » ; le monde sensible est dans l'univers véritable, qui reste en lui-même.
          - **Une âme et des âmes** (chap. 4-6) : la multiplicité vient de l'altérité, non du lieu ; l'âme une contient les âmes, comme une âme ses sciences.
          - **L'incorporel ne se divise pas** (chap. 7-10) : la main soulève un bois plus grand qu'elle ; le divisible est une affection du corps, l'indivisible une affection de l'incorporel.
          - **Chacun reçoit selon son aptitude** (chap. 11-15) : comme une parole entendue tout entière par chaque oreille ; nous étions là-bas des hommes intelligibles, et un second homme s'est ajouté à nous.
          - **Descendre** (chap. 16) : c'est seulement se trouver dans un corps.

          Le traité 23 (VI, 5) reprend la même démonstration et l'achève sur une exhortation.
      - id: t-6-5
        title: "Sur la raison pour laquelle l'être, un et identique, est partout tout entier II"
        ennead: 6
        numberInEnnead: 5
        chrono: 23
        unit: traite23
        theses:
          - "Tous les hommes croient que le dieu est présent partout, un et identique, et c'est la conviction la plus solide de toutes."
          - "Quand nous connaissons vraiment, ce n'est pas que les intelligibles nous viennent : nous entrons en eux et nous les devenons."
          - "Nous sommes déjà le Tout intelligible, qui ne s'éloigne jamais de nous : c'est seulement notre attention qui s'en détache quand nous nous identifions aux limites du corps."
        summary: |-
          **Le traité 23, suite du traité 22 (VI, 4), achève la démonstration : l'être véritable reste en lui-même, et ce sont les autres choses qui en participent, autant qu'elles le peuvent.** Il passe de la participation à une exhortation : se retourner vers l'intelligible, notre véritable demeure.

          - **Une notion commune** (chap. 1-2) : tous les hommes disent le dieu présent en chacun, un et identique ; c'est « le principe le plus solide de tous ». Mais la raison, qui prend ses principes dans les corps, divise.
          - **L'unité véritable reste en elle-même** (chap. 3-6) : croire en dieu, c'est croire que la même chose est partout entière. Il faut se garder de l'image des rayons qui quitteraient leur centre.
          - **Nous devenons les intelligibles** (chap. 7) : connaître vraiment, ce n'est pas recevoir des empreintes, c'est être en eux. Il faut se retourner, comme Achille tiré par les cheveux par Athéna.
          - **La matière auprès des formes** (chap. 8-10) : la forme n'est pas loin de la matière ; l'Éros « qui veille à la porte » possède la beauté en restant auprès d'elle.
          - **Rejeter le non-être** (chap. 11-12) : le Tout intelligible, présent partout tout entier, ne s'éloigne jamais de nous ; c'est notre attention qui s'en détache quand nous nous identifions aux limites du corps, qui s'ajoutent à notre être (le « non-être »). Comme un dieu apparu dans une pièce n'est vu que de celui qui regarde dans sa direction, en rejetant ces limites nous cessons de nous détourner du Tout.

          Plotin y multiplie les images (le cercle, l'illumination, le reflet dans l'eau) tout en mettant en garde contre leur pente : elles font croire l'intelligible lointain.
      - id: t-6-6
        title: "Sur les nombres"
        ennead: 6
        numberInEnnead: 6
        chrono: 34
        unit: traite34
        theses:
          - "Le nombre n'est pas produit par celui qui compte : il existe d'abord dans le monde intelligible, où il est fini et achevé, sans qu'on puisse toujours y ajouter un."
          - "Le nombre est dans l'être, avant l'Intellect et le Vivant : c'est la règle selon laquelle l'être se déploie en une multitude d'êtres."
          - "L'un n'est ni un état de l'âme ni une relation : une chose est une parce que l'un est présent en elle."
        summary: |-
          **Le traité 34 arrache le nombre au sensible pour le placer dans l'intelligible : il n'est pas produit par celui qui compte, mais existe d'abord dans l'être, comme la règle selon laquelle l'être se déploie en êtres.** Sa visée n'est pas mathématique, mais ontologique et cosmologique.

          - **La question de départ** (chap. 1-3) : le « nombre illimité » du *Parménide* (144a). Tout ensemble réel est limité ; la multiplicité n'est pas un mal, car l'un l'enveloppe ; l'illimitation pure, la matière, fuit la limite.
          - **Où est le nombre ?** (chap. 4-10) : ni simple notion de l'âme, ni accident des Formes, il existe en soi. Dans la triade être, intellect, vivant, il est dans l'être : l'être est le nombre unifié, les êtres le nombre déroulé.
          - **Objections et réponses** (chap. 11-14) : contre Aristote, les stoïciens et ceux qui en font une relation, une chose est une par la présence de l'un, comme elle est belle par la présence du beau.
          - **Nombres nombrants, nombres nombrés** (chap. 15-16) : le nombre essentiel constitue les êtres ; le nombre du compte n'en est que l'image.
          - **Le nombre illimité** (chap. 17-18) : l'illimité n'est que dans notre représentation ; dans l'intelligible, le nombre est fini et achevé, car il est tout ensemble, et l'on ne peut toujours y ajouter un ; mais du point de vue de la puissance, l'être et le nombre sont illimités, et Platon avait raison.

          Plotin s'y montre fidèle au *Timée* : c'est par la limite venue de l'intelligible que le monde est connaissable. Les gnostiques ont donc tort de le mépriser.
      - id: t-6-7
        title: "Comment la multiplicité des idées s'est établie et sur le bien ?"
        ennead: 6
        numberInEnnead: 7
        chrono: 38
        highlight: true
        unit: traite38
        theses:
          - "Nos organes des sens ne résultent pas d'un calcul de la divinité pour nous protéger : ils expriment dans le corps des formes éternelles de l'intelligible."
          - "L'Intellect est un « Bien devenu varié » : le Bien lui donne la multiplicité sans la posséder lui-même."
          - "Le Bien est une beauté sans forme : l'âme qui l'aime se dépouille de toute forme pour s'unir à lui."
        summary: |-
          **Le traité 38 va de l'intelligible au Bien : l'Intellect contient sans raisonner toutes les formes, jusqu'aux sensations et aux bêtes ; il n'est qu'un « Bien devenu varié », et le Bien, sans forme, ne pense pas.** C'est l'un des plus longs et des plus difficiles des traités, en trois parties presque égales.

          - **L'intelligible sans raisonnement** (chap. 1-7) : nos organes des sens ne résultent pas d'un calcul de la divinité qui, voyant périr les vivants du chaud et du froid, leur aurait ajouté des organes pour les sauver : ils expriment dans le corps des formes éternelles de l'intelligible, où chaque forme est son « quoi » et son « pourquoi ». La sensation y existe déjà : l'homme intelligible éclaire l'homme d'ici-bas, dont les sensations sont des pensées obscures.
          - **Le vivant total** (chap. 8-14) : l'Intellect contient les formes de tous les vivants, même irrationnels, des plantes et de la terre ; sa vie variée vagabonde dans la « plaine de la vérité ».
          - **Le Bien, source et objet de désir** (chap. 15-30) : l'Intellect reçoit du Bien ce que le Bien n'a pas ; l'âme ne désire l'Intellect que lorsque la lumière du Bien le colore. Le Bien n'est pas bien parce qu'on le désire, et le plaisir n'est qu'une suite de sa possession.
          - **Le Bien en lui-même** (chap. 31-42) : beauté sans forme, il suscite un amour sans mesure ; l'âme s'unit à lui en se dépouillant de toute forme. Il ne pense pas, contre Aristote, et toutes choses sont « autour du roi ».

          Plotin y réunit sa lecture du *Timée*, du *Banquet*, du *Phèdre*, du *Philèbe* et du *Parménide*.
      - id: t-6-8
        title: "Sur le volontaire"
        ennead: 6
        numberInEnnead: 8
        chrono: 39
        highlight: true
        unit: traite39
        theses:
          - "Ce qui dépend de nous ne réside pas dans l'action mais dans la pensée, et la volonté libre est celle qui veut le Bien."
          - "Le Bien n'existe ni par hasard ni par nécessité, car sa surabondance de puissance le place au-dessus de toute nécessité."
          - "Le Bien est entièrement volonté : il est ce qu'il veut et, pour ainsi dire, se produit lui-même."
        summary: |-
          **Le traité 39 transpose aux premiers principes le vocabulaire de la liberté : ce qui dépend de nous réside dans l'intellect tourné vers le Bien, et le Bien, qui n'existe ni par hasard ni par nécessité, est tout entier volonté.** Plotin y discute Alexandre d'Aphrodise, pour qui rien de ce qui tient à leur nature ne dépend des dieux.

          - **La liberté en nous** (chap. 1-6) : ce qui dépend de nous n'est ni dans le désir, ni dans l'action soumise aux circonstances, mais dans l'intellect ; la volonté est libre quand elle veut le Bien, et l'Intellect, tourné vers lui, est libre de son propre fait.
          - **Le discours téméraire** (chap. 7-11) : refuser la liberté au Bien parce qu'il n'est pas maître de sa nature, c'est vider de sens « ce qui dépend de nous ». Le Bien n'est pas advenu par accident : il est seul, au-dessus de la nécessité, et l'on doit même lui retirer le « est ».
          - **Le discours positif** (chap. 12-21) : pour persuader, Plotin dit, « pour ainsi dire », que le Bien se veut, s'aime et se produit lui-même, cause de soi ; il est le centre du cercle, la source de la lumière, et il est « tout entier volonté ».

          Pour l'atteindre, il faut « retrancher toutes choses ».
      - id: t-6-9
        title: "Sur le Bien ou l'Un"
        ennead: 6
        numberInEnnead: 9
        chrono: 9
        priority: 4
        highlight: true
        unit: traite9
        theses:
          - "Tout être est un, et le principe premier, parfaitement simple, est au-delà de l'Intellect et de l'être."
          - "On ne peut parler de l'Un que par négations : cette « théologie négative » est une méthode, une exhortation qui indique le chemin."
          - "L'âme remonte jusqu'à l'Un en s'unissant à lui, au-delà de toute connaissance : « fuir seul vers lui seul »."
        summary: |-
          **Le traité 9 présente pour la première fois de manière systématique le premier principe de Plotin : au-delà de l'Intellect et de l'être, une réalité absolument simple, l'Un.** C'est son innovation fondamentale dans la tradition platonicienne, qui plaçait au principe un Intellect « démiurgique ».

          - **Tout être est un** (chap. 1-2) : une armée, une maison, un corps n'existent qu'en vertu de leur unité. Mais ni l'Âme, ni l'Intellect et l'être, multiples, ne sont l'Un.
          - **L'Un est au-delà de tout** (chap. 3-4) : sans forme, il n'est pas, ne se connaît ni ne se dit. La **théologie négative** est une méthode : tout discours sur l'Un est une exhortation qui indique le chemin.
          - **La causalité de l'Un** (chap. 5-6) : il est le principe de tout, et le Bien pour les autres, non pour lui-même.
          - **L'union** (chap. 7-11) : l'âme doit se faire une et sans forme, comme un cercle qui fait coïncider son centre avec le centre de tout ; elle vit alors, dans une « extase », la vie véritable.

          Placé par Porphyre à la fin des *Ennéades*, le traité s'achève sur la vie « des dieux et des hommes divins » : « fuir seul vers lui seul ».
