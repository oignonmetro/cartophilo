      - id: t-1-2
        title: "Sur les vertus"
        ennead: 1
        numberInEnnead: 2
        chrono: 19
        highlight: true
        unit: traite19
        theses:
          - "Nos vertus nous rendent semblables à un divin qui n'a pas de vertus : il y a deux sortes d'assimilation."
          - "Les vertus civiques imposent mesure et limite aux passions : un premier pas vers le divin."
          - "Les vertus supérieures sont des purifications : l'âme se tourne vers l'Intellect, et l'homme devient un dieu."
        summary: |-
          **Le traité 19 fait de la vertu le moyen de se rendre « semblable au dieu » : l'éthique de Plotin n'a pour seule activité que l'union de l'âme avec le divin.** Le mot vient du *Théétète* (176b).

          - **Un paradoxe** (chap. 1-2) : nos vertus nous rendent semblables à un divin qui n'a pas de vertus. Il se résout par la **double assimilation** : celle de deux images d'un même modèle, et celle de l'image à son modèle.
          - **Les vertus civiques** (chap. 1-2) : réflexion, courage, maîtrise de soi, justice imposent mesure et limite aux passions, comme la **métriopathie** d'Aristote : un premier pas.
          - **Les vertus comme purifications** (chap. 3-5) : détachement du corps et **retour** (`epistrophḗ`) vers l'Intellect, qui illumine les traces de l'intelligible en l'âme. Elles suppriment les passions : l'**impassibilité** (`apátheia`) des stoïciens.
          - **Les vertus de l'âme purifiée** (chap. 6-7) : l'homme purifié est **« uniquement un dieu »** ; il faut choisir non la vie de l'homme de bien, mais la vie des dieux.

          Porphyre, puis Macrobe et les néoplatoniciens, en tireront une échelle de « degrés de vertus », étrangère à la lettre de Plotin. Le traité 20 (I, 3) en est la suite.
      - id: t-1-3
        title: "Sur la dialectique"
        ennead: 1
        numberInEnnead: 3
        chrono: 20
        highlight: true
        unit: traite20
        theses:
          - "La dialectique est une méthode de purification : le moyen de l'ascension de l'âme vers le Bien."
          - "Le musicien, l'amant et le philosophe du Phèdre sont trois degrés de la remontée vers l'intelligible."
          - "La dialectique n'est pas la logique, ni un instrument : c'est la partie la plus précieuse de la philosophie."
        summary: |-
          **Le traité 20, suite du traité 19 (I, 2), fait de la dialectique la méthode de l'ascension de l'âme vers le Bien : une méthode de purification, et non seulement de recherche et de définition, comme chez Platon.**

          - **Trois degrés de la remontée** (chap. 1-3) : le *Phèdre* (248d) fait naître l'âme qui a le plus vu dans un philosophe, un musicien ou un amant. Le **musicien** doit aller du beau des sons à l'harmonie intelligible ; l'**amant**, de la beauté d'un corps à celle des vertus ; le **philosophe**, qui a « des ailes », n'a besoin que des mathématiques puis de la dialectique.
          - **La dialectique véritable** (chap. 4-5) : elle dit de chaque chose ce qu'elle est, divise et rassemble les genres jusqu'au principe, puis contemple. Elle laisse la **logique** des propositions à une autre technique, celle d'Aristote et des stoïciens.
          - **La partie la plus précieuse** (chap. 6) : la dialectique n'est pas un instrument de la philosophie, mais sa partie la plus précieuse, qui embrasse la physique et l'éthique.

          Comme les vertus civiques avant la purification, la logique n'est qu'un préalable, à dépasser.
      - id: t-1-4
        title: "Sur le bonheur"
        ennead: 1
