      - id: t-6-9
        title: "Sur le Bien ou l'Un"
        ennead: 6
        numberInEnnead: 9
        chrono: 9
        priority: 4
        highlight: true
        unit: traite9
        theses:
          - "Tout être est un : le principe premier, absolument simple, est au-delà de l'Intellect et de l'être."
          - "On ne parle de l'Un que par négation : la théologie négative est une méthode, une exhortation qui indique le chemin."
          - "L'âme remonte à l'Un par l'union, au-delà de toute connaissance : « fuir seul vers lui seul »."
        summary: |-
          **Le traité 9 présente pour la première fois de manière systématique la théorie plotinienne du premier principe : au-delà de l'Intellect et du monde intelligible, une réalité absolument simple, l'Un.** C'est l'innovation fondamentale de Plotin dans la tradition platonicienne, qui plaçait au principe un Intellect « démiurgique ».

          - **Tout être est un** : une armée, une maison, un corps, une âme n'existent qu'en vertu de leur unité. Mais ni l'Âme, une « en vertu d'un autre », ni l'Intellect et l'être, multiples, ne sont l'Un (chap. 1-2).
          - **L'Un est au-delà de tout** : sans forme, il n'est pas, ne se connaît ni ne se dit. Plotin lit ainsi la première hypothèse du *Parménide* et fait de la **théologie négative** une méthode. Tout discours sur l'Un est un discours sur nous, une exhortation qui indique le chemin (chap. 3-4).
          - **La causalité de l'Un** est non réversible : nous sommes causés par lui, il ne nous cause pas à proprement parler. Il est le Bien pour les autres, non pour lui-même (chap. 5-6).
          - **L'union** : l'âme doit se faire une et sans forme, comme un cercle qui fait coïncider son centre avec le centre de tout ; elle vit alors la vie véritable, dans une « extase » qui n'est plus connaissance (chap. 7-11).

          Placé par Porphyre à la fin des *Ennéades*, le traité s'achève sur la vie « des dieux et des hommes divins » : « fuir seul vers lui seul ».
