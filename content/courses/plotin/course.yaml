      - id: t-3-6
        title: "Sur l'impassibilité des incorporels"
        ennead: 3
        numberInEnnead: 6
        chrono: 26
        unit: traite26
        theses:
          - "Les sensations et les passions ne sont pas des affections de l'âme, mais des activités : l'âme reste inaltérable."
          - "Purifier l'âme, ce n'est pas la laver d'une souillure, mais la détourner des images, comme on réveille un rêveur."
          - "La matière, non-être véritable, est impassible : les formes s'y reflètent comme dans un miroir, sans l'affecter."
        summary: |-
          **Le traité 26 montre que ce qui paraît pâtir ne pâtit pas : ni l'âme ni la matière, toutes deux incorporelles, ne sont affectées, l'une par perfection, l'autre par impuissance.** Il rectifie deux erreurs nées de nos « habitudes de langage » : parler de « passions de l'âme », et croire avec les péripatéticiens la matière « affectée » par les formes.

          - **Les sensations et les passions sont des activités** (chap. 1-3) : le vice est un manque d'harmonie ; la peur naît dans l'âme, mais la pâleur dans le corps.
          - **La faculté passive** (chap. 4-5) : elle est comme l'harmonie d'une lyre, dont seules les cordes sont mues. La purification détourne l'âme des images, comme on réveille un rêveur.
          - **L'être n'est pas un corps** (chap. 6) : la résistance des corps est signe de faiblesse ; être dans le corps, pour l'âme, c'est dormir.
          - **La matière, non-être véritable** (chap. 7-10) : elle ment dans tout ce qu'elle annonce ; les formes s'y montrent comme dans un miroir, sans l'affecter.
          - **Participer sans participer** (chap. 11-18) : la matière reçoit les formes comme Pénia reçoit Poros, sans rien en garder ; elle porte la grandeur comme un vêtement.
          - **Plus réceptacle que mère** (chap. 19) : la matière est stérile, seule la forme engendre.

          C'est le plus long exposé de Plotin sur la nature paradoxale de la matière, après les traités 12 (II, 4) et 25 (II, 5).
      - id: t-3-7
        title: "Sur l'éternité et le temps"
        ennead: 3
        numberInEnnead: 7
        chrono: 45
        highlight: true
      - id: t-3-8
        title: "Sur la contemplation"
        ennead: 3
        numberInEnnead: 8
        chrono: 30
        highlight: true
      - id: t-3-9
        title: "Considérations diverses"
        ennead: 3
        numberInEnnead: 9
        chrono: 13
        unit: traite13
        theses:
          - "Le vivant intelligible du Timée est l'Intellect en repos : c'est l'âme qui divise, par la pensée discursive."
          - "L'âme est indéterminée avant de voir l'Intellect : relativement à lui, elle est comme une matière."
          - "L'Un est partout et nulle part : partout, il produit tout ; nulle part, il n'est rien de ce qu'il produit."
        summary: |-
          **Le traité 13 n'a pas de thèse unique : c'est un collage de neuf paragraphes, que Porphyre a réunis à la fin de la troisième Ennéade, et qui précisent des difficultés des douze premiers traités.**

          - **Le vivant intelligible** du *Timée* (chap. 1) : le vivant intelligible n'est pas séparé de l'Intellect, c'est l'Intellect en repos ; la division, œuvre de la pensée discursive, revient à l'âme.
          - **L'indétermination de l'âme** (chap. 3 et 5) : indéterminée (`aóristos`) avant de voir l'Intellect, l'âme est comme la vue, et comme une matière pour lui.
          - **L'Un partout et nulle part** (chap. 4) : partout, il produit tout ; nulle part, il n'est rien de ce qu'il produit.
          - **L'acte et la puissance** (chap. 8) : l'Intellect est ce qui est toujours en acte.
          - **Le Premier ne pense pas** (chap. 9) : au-delà de ce qui est, il n'a ni pensée, ni conscience de lui-même, ni vie, qui sont les traits de l'Intellect.

          Le seul fil commun est peut-être l'acte intellectif ; peut-être Porphyre n'a-t-il voulu que compléter sa neuvaine.
      - id: t-4-1
        title: "Comment l'on dit que l'âme est intermédiaire entre la réalité indivisible et la réalité divisible (Sur la réalité de l'âme II)"
        ennead: 4
        numberInEnnead: 1
        chrono: 21
        unit: traite21
        theses:
          - "L'âme n'est « divisible dans les corps » que parce qu'elle vient dans des corps : là-bas, elle est indivise."
          - "Quelque chose de l'âme reste attaché là-haut, comme un rayon dérive du centre."
          - "Même la part divisée de l'âme se divise de façon indivisible : elle se donne tout entière au corps tout entier."
        summary: |-
          **L'unique chapitre du traité 21 ajoute une ultime précision à l'indivisibilité de l'âme : même la part divisée de l'âme n'est « divisible que de façon indivisible ».**

          - **Les âmes là-bas et ici** (l. 1-11) : là-bas, l'Intellect est « tout entier ensemble » et les âmes sans corps sont indivises ; se diviser, pour l'âme, c'est venir dans des corps. D'où la formule du *Timée* (35a) : **« divisible dans les corps »**.
          - **Ce qui reste là-haut** (l. 12-17) : l'âme ne s'est pas éloignée tout entière ; quelque chose d'elle reste attaché là-haut, **comme un rayon dérive du centre**.
          - **Divisée de façon indivisible** (l. 17-22) : même ici-bas, elle se donne **tout entière au corps tout entier** ; seule la réception de ses soins par les corps se divise.

          Bribe d'un texte plus long, qui rassemblait sans doute les traités 2, 4 et 21, ce chapitre a changé de place selon les éditions : Porphyre en fit le deuxième traité de la quatrième Ennéade, Ficin le premier.
      - id: t-4-2
        title: "Sur la réalité de l'âme I"
        ennead: 4
        numberInEnnead: 2
        chrono: 4
        unit: traite4
        theses:
          - "Selon le Timée, l'âme est indivisible, car sans étendue, et divisible, car elle agit dans des corps distincts."
          - "Selon le Parménide, l'âme est une et multiple : ni absolument divisible, ni absolument indivisible."
          - "Les réalités se distinguent par leur degré d'unité : le principe est un, l'âme une et multiple, ses produits multiples."
        summary: |-
          **Le traité 4, suite du traité 2 (IV, 7), définit l'âme comme une réalité intelligible mais intermédiaire, à la fois indivisible et divisible.**

          - **Le mélange** du *Timée* (chap. 1, 29-41) : l'âme est engendrée d'un mélange entre la réalité indivisible, toujours la même, et la réalité divisible qui devient dans les corps (35a).
          - **Indivisible et divisible** (chap. 1, 41-76) : indivisible, car elle n'est pas une quantité étendue ; divisible, car elle exerce son activité dans des corps distincts.
          - **Une et multiple** (chap. 2) : avec le *Parménide* (155e), l'âme n'est ni absolument divisible, ni absolument indivisible.
          - **Les degrés d'unité** (chap. 2, 39-49) : au sommet, le principe un d'où vient l'âme ; puis l'âme, une et multiple ; puis ses produits, multiples. Ce double critère, divisibilité et multiplicité, hiérarchise tous les niveaux de réalité.

          Le traité 21 (IV, 1), un unique chapitre isolé par Porphyre, en donne sans doute le dernier mot.
      - id: t-4-3
        title: "Sur les difficultés relatives à l'âme I"
        ennead: 4
        numberInEnnead: 3
        chrono: 27
        unit: traite27
        theses:
          - "Nos âmes ne sont pas des parties de l'âme du monde, mais ses sœurs : toutes viennent d'une même Âme."
          - "L'âme n'est pas dans le corps comme en un lieu, mais comme la lumière dans l'air : c'est le corps qui est en elle."
          - "La mémoire n'appartient ni à l'Intellect ni au composé : elle relève de la représentation, et l'âme bonne est oublieuse."
        summary: |-
          **Le traité 27 ouvre le plus long essai ancien consacré à l'âme (traités 27 à 29) : nos âmes ne sont pas des parties de l'âme du monde, l'âme n'est pas dans le corps comme en un lieu, et la mémoire relève de la représentation.**

          - **Introduction** (chap. 1, 1-16) : trois raisons d'étudier l'âme : connaître les principes, obéir au « Connais-toi toi-même », connaître le sujet de toute connaissance.
          - **Contre la thèse stoïcienne** (chap. 1, 16 à 8) : nos âmes ne sont pas des parties de l'âme du monde, mais ses sœurs ; toutes viennent d'une même Âme, comme les théorèmes d'une science qui reste entière.
          - **L'entrée de l'âme dans le corps** (chap. 9 à 19) : l'âme du monde produit son corps sans descendre ; les âmes humaines descendent, mais leur tête reste fixée en haut.
          - **Où est l'âme ?** (chap. 20 à 24) : ni dans un lieu, ni dans un vase, ni comme un pilote dans son navire, mais comme la lumière dans l'air ; c'est le corps qui est dans l'âme.
          - **La mémoire** (chap. 25 à 32) : elle n'appartient ni à l'Intellect ni au composé, mais à la faculté de représentation ; l'âme bonne est oublieuse.

          Rédigés entre 263 et 268, pendant le séjour de Porphyre à Rome, les traités 27 à 29 n'en formaient qu'un : Porphyre l'a coupé en trois. La réflexion sur la mémoire se poursuit au traité 28 (IV, 4).
      - id: t-4-4
        title: "Sur les difficultés relatives à l'âme II"
