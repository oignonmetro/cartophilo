        chrono: 52
      - id: t-2-4
        title: "Sur les deux matières"
        ennead: 2
        numberInEnnead: 4
        chrono: 12
        highlight: true
        priority: 6
        unit: traite12
        theses:
          - "Il y a deux matières, l'une sensible, l'autre intelligible, toutes deux incorporelles."
          - "La matière intelligible existe : la multiplicité des Formes exige un substrat commun, et elle est un être véritable."
          - "La matière sensible est privée de tout, même de grandeur ; elle est identique à la privation et à l'illimité, et elle est le mal."
        summary: |-
          **Le traité 12 soutient qu'il y a deux matières, toutes deux incorporelles : une matière intelligible, substrat des Formes, et une matière sensible, privation, illimité et mal.**

          - **La position de Platon** (chap. 1) : contre les stoïciens (une matière corporelle) et les aristotéliciens (une seule matière), Plotin suit le témoignage d'Aristote sur la **Dyade indéfinie**, matière des Idées.
          - **La matière intelligible** (chap. 2-5) : la multiplicité des Formes exige un substrat commun. Elle est un être véritable, engendré hors du temps : l'état informe de chaque réalité avant sa **conversion** vers son principe.
          - **La matière sensible existe** (chap. 6-10) : elle explique la transformation des éléments. Privée de tout, elle n'a pas même de **grandeur** ; on ne la saisit que par un **raisonnement bâtard**.
          - **Ce qu'elle est** (chap. 11-16) : contre Aristote, la **privation** même ; avec le *Sophiste*, un non-être ; l'**illimité** (`ápeiron`) ; enfin le **mal**.

          La matière d'ici, ornée de formes, n'est qu'**« un cadavre ornementé »** (5, 18). Les traités 25 (II, 5) et 26 (III, 6) reprendront la question.
      - id: t-2-5
        title: "Sur le sens de « en puissance » et « en acte »"
        ennead: 2
        numberInEnnead: 5
        chrono: 25
        unit: traite25
        theses:
          - "Ce qui est en puissance ne devient pas lui-même en acte : l'airain reste airain, c'est la statue qui est en acte."
          - "Dans l'intelligible, rien n'est en puissance : tout y est forme, à la fois en acte et acte."
          - "La matière est tous les êtres en puissance et n'est rien en acte : un « mensonge véritable », un non-être."
        summary: |-
          **Le traité 25 fixe le sens d'« en puissance » et d'« en acte », hérités d'Aristote : ce qui est en puissance ne devient jamais lui-même en acte, et la matière, tous les êtres en puissance, n'est rien en acte.**

          - **L'être en puissance** (chap. 1) : un substrat passif, qui a besoin d'autre chose pour passer à l'acte, comme l'airain, statue en puissance. Il n'est pas une puissance : la puissance est active, comme le courage.
          - **L'être en acte, c'est le composé** (chap. 2) : l'airain reste airain, c'est la statue qui vient à l'être ; l'acte est la forme de ce composé.
          - **Les intelligibles** (chap. 3) : là-bas, rien n'est en puissance ; tout est forme, même la matière intelligible, et chaque réalité est à la fois en acte et acte.
          - **La matière** (chap. 4-5) : n'étant aucun des êtres, elle est un non-être, « un mensonge véritable » ; elle ne passera jamais à l'acte, et c'est pourquoi elle est indestructible.

          Contre Aristote, pour qui la matière tend vers la forme, Plotin maintient un écart infranchissable entre elles. Le traité 26 (III, 6), chap. 7, y reviendra.
      - id: t-2-6
        title: "Sur la réalité ou sur la qualité"
        ennead: 2
        numberInEnnead: 6
        chrono: 17
        unit: traite17
        theses:
          - "Contre Aristote, la différence qui définit une chose relève de sa réalité, non de la qualité, qui n'est qu'accidentelle."
          - "Le « complément de la réalité » (le blanc de la neige) est intermédiaire entre la simple qualité et l'acte intelligible."
          - "La réalité sensible n'est qu'une « réalité qualifiée », image de la réalité de là-bas, seule réellement réalité."
        summary: |-
          **Le traité 17 refuse de ranger la différence d'une chose parmi ses qualités : la différence relève de sa réalité, la qualité n'est qu'accidentelle, et entre les deux se tient le « complément de la réalité ».**

          - **Contre Aristote** (chap. 1, 8-29) : la *Métaphysique* (Δ, 14) fait de la différence une qualité au sens propre ; c'est confondre l'ordre de la réalité (`ousía`) et celui de l'accident.
          - **Le complément de la réalité** (chap. 1, 30-40) : la blancheur de la neige ou la chaleur du feu font partie de ce qu'ils sont ; la blancheur d'une table n'est qu'une qualité.
          - **Trois niveaux** (chap. 1, 41-56) : l'acte de la réalité là-bas, la Forme du feu ; le complément de la réalité, sensible mais lié à la raison (`lógos`) qui produit la chose ; la qualité, purement accidentelle.
          - **La réalité d'ici n'est qu'une image** (chap. 2-3) : la réalité sensible n'est qu'une « réalité qualifiée » ; seule la réalité de là-bas est « réellement réalité ».

          Le traité est un **dialogue** avec un interlocuteur péripatéticien, qui avance par objections : d'où son obscurité réputée, et l'équivocité des mots « forme », « acte » et « réalité », pris tantôt au sens d'Aristote, tantôt à celui de Platon.
