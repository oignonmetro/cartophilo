      - id: t-3-9
        title: "Considérations diverses"
        ennead: 3
        numberInEnnead: 9
        chrono: 13
        unit: traite13
        theses:
          - "Le vivant intelligible du Timée est l'Intellect en repos : c'est l'âme qui divise, par la pensée discursive."
          - "L'âme est indéterminée avant de voir l'Intellect : relativement à lui, elle est comme une matière."
          - "L'Un est partout et nulle part : partout, il produit tout ; nulle part, il n'est rien de ce qu'il produit."
        summary: |-
          **Le traité 13 est un collage : neuf paragraphes, morceaux choisis ou fragments d'autres développements, que Porphyre a réunis à la fin de la troisième Ennéade.**

          - Leur unité n'a rien de manifeste : il y est question du monde et de l'âme, mais aussi de l'Intellect (chap. 1-2), de l'Un (chap. 4 et 9), de l'acte et de la puissance (chap. 8). Ils sont proches des douze premiers traités, dont ils reprennent les difficultés pour les préciser ou les résumer, comme des réponses à des lecteurs.
          - **Chap. 1** : un commentaire du *Timée* (39e) : le vivant intelligible n'est pas séparé de l'Intellect ; c'est l'Intellect en repos. La division, œuvre de la pensée discursive, revient à l'âme.
          - **Chap. 3 et 5** : l'**indétermination** (`aóristos`) de l'âme : indéterminée avant de voir l'Intellect, elle est comme la vue, et comme une matière pour lui.
          - **Chap. 4** : l'Un est **partout et nulle part** : partout, il produit tout ; nulle part, il n'est rien de ce qu'il produit.
          - **Chap. 9** : le Premier, au-delà de ce qui est, **ne pense pas**, n'a pas conscience de lui-même et ne vit pas : ce sont les traits de l'Intellect.

          Le seul fil commun est peut-être l'acte intellectif ; peut-être Porphyre n'a-t-il voulu que compléter sa neuvaine.
      - id: t-4-1
        title: "Comment l'on dit que l'âme est intermédiaire entre la réalité indivisible et la réalité divisible (Sur la réalité de l'âme II)"
        ennead: 4
        numberInEnnead: 1
        chrono: 21
        unit: traite21
        theses:
          - "L'âme n'est « divisible dans les corps » que parce qu'elle vient dans des corps : là-bas, elle est indivise."
          - "Quelque chose de l'âme reste attaché là-haut, comme un rayon dérive du centre."
          - "Même la part divisée de l'âme se divise de façon indivisible : elle se donne tout entière au corps tout entier."
        summary: |-
          **L'unique chapitre du traité 21 démontre l'indivisibilité de l'âme, et y ajoute une ultime précision : la partie divisible de l'âme n'est elle-même « divisible que de façon indivisible ».**

          - Après les traités 2, 4, 6 et 8, Plotin reprend la phrase du *Timée* (35a) : l'âme est faite d'un mélange d'indivisible et de **« divisible dans les corps »**. Elle ne se divise que relativement : ce sont les corps qui la contraignent à exercer ses puissances en différents lieux.
          - Là-bas, l'Intellect est « tout entier ensemble », et les âmes sans corps sont dans l'indivision ; ici, elles sont venues dans des corps et s'y sont divisées. Mais l'âme ne s'est pas éloignée tout entière : quelque chose d'elle reste attaché là-haut, **comme un rayon dérive du centre**.
          - Même ici-bas, elle se donne **tout entière au corps tout entier** : seule la réception de ses soins par les corps se divise.

          Bribe d'un texte plus long, ce chapitre a changé de place selon les éditions : Porphyre en fit le deuxième traité de la quatrième Ennéade, Ficin le premier.
      - id: t-4-2
        title: "Sur la réalité de l'âme I"
        ennead: 4
        numberInEnnead: 2
        chrono: 4
        unit: traite4
        theses:
          - "Selon le Timée, l'âme est indivisible, car sans étendue, et divisible, car elle agit dans des corps distincts."
          - "Selon le Parménide, l'âme est une et multiple : ni absolument divisible, ni absolument indivisible."
          - "Les réalités se distinguent par leur degré d'unité : le principe est un, l'âme une et multiple, ses produits multiples."
        summary: |-
          **Le traité 4, suite du traité 2 (IV, 7), propose une définition de l'âme : une réalité intelligible mais intermédiaire, à la fois indivisible et divisible.**

          - Plotin s'appuie sur le *Timée* (35a) : l'âme du monde est engendrée d'un mélange entre la réalité indivisible, toujours la même, et la réalité divisible qui devient dans les corps.
          - L'âme est **indivisible** en tant qu'elle n'est pas une quantité étendue, **divisible** en tant qu'elle exerce son activité dans des corps distincts (chap. 1).
          - Avec le *Parménide* (155e), elle est **une et multiple** : ni absolument divisible, ni absolument indivisible (chap. 2, analyse dichotomique).
          - Plotin introduit un **double critère**, divisibilité et multiplicité, qui hiérarchise les réalités : au sommet, le principe un d'où vient l'âme ; puis l'âme, une et multiple ; puis ses produits, multiples. Les degrés d'unité distinguent tous les niveaux de réalité.

          Le traité 21 (IV, 1), un unique chapitre isolé par Porphyre, en donne sans doute le dernier mot.
      - id: t-4-3
