      - id: t-1-6
        title: "Sur le beau"
        ennead: 1
        numberInEnnead: 6
        chrono: 1
        priority: 1
        highlight: true
        unit: traite1
        theses:
          - "La beauté n'est pas la proportion des parties : elle manifeste l'unité d'une Forme."
          - "Reconnaître le beau est une réminiscence qui purifie l'âme : l'esthétique est dépassée par l'éthique."
          - "Le beau mène de l'extérieur à l'intérieur, jusqu'à l'Un : le bien est au-delà du beau."
        summary: |-
          **Le premier traité de Plotin n'est pas un traité d'esthétique : c'est une introduction à la philosophie platonicienne et à la conversion qu'elle demande.** Partant de la question « qu'est-ce qui rend une chose belle ? », il mène de la beauté des corps à celle des âmes, puis à l'intelligible et jusqu'à l'Un.

          - Contre la définition stoïcienne du beau par la **proportion** (symétrie des parties), Plotin fait de la beauté la manifestation d'une **unité**, celle de la **Forme** (`eîdos`) : la lumière, l'or, l'éclair sont beaux sans avoir de parties.
          - Reconnaître le beau, c'est pour l'âme un **ajustement** et une **réminiscence** : elle y retrouve sa parenté avec l'intelligible. La contemplation de la Forme est aussi une intuition de soi.
          - La vertu est une **purification** : l'âme se détourne du corps et redevient « Forme et raison ». L'esthétique est dépassée par l'éthique.
          - La beauté vient de l'**intérieur** (le projet de l'architecte, la Nature comme Forme) ; il faut voir avec « l'œil de l'âme ».
          - Narcisse, qui se perd dans son reflet, et Ulysse, qui fuit Circé, opposent deux rapports aux images ; notre patrie est l'intelligible, et le bien est au-delà du beau.

          Le traité décrit un « itinéraire » de l'âme vers le divin : seul le philosophe connaît, dès cette vie, la joie de contempler le beau en soi.
      - id: t-1-7
        title: "Sur le souverain bien et les autres biens"
        ennead: 1
