      - id: t-3-1
        title: "Sur le destin"
        ennead: 3
        numberInEnnead: 1
        chrono: 3
        unit: traite3
        theses:
          - "Contre les épicuriens, le hasard des atomes ne peut produire un monde si beau : une providence le gouverne."
          - "Contre les stoïciens, tout n'est pas destin : l'âme est une cause, et l'homme est responsable de ses actes."
          - "Les astres ne causent pas nos actes : ils donnent seulement des signes de l'avenir."
        summary: |-
          **Le traité 3 refuse à la fois le hasard des épicuriens et la nécessité universelle des stoïciens : une providence gouverne le monde, mais l'âme est une cause, et l'homme reste responsable de ses actes.**

          - **Causes prochaines et causes lointaines** (chap. 1) : tout ce qui devient a une cause ; la question porte sur les causes lointaines.
          - **Cinq opinions réfutées** (chap. 2-7) : les atomes, les éléments, l'âme du monde qui ferait tout, les astres des astrologues, l'enchaînement stoïcien des causes. Toutes abolissent notre autonomie. Les astres, eux, donnent seulement des « signes » de l'avenir (chap. 5-6).
          - **L'âme, cause lointaine** (chap. 8) : séparée du corps, l'âme est libre ; dans un corps, sa liberté varie avec sa bonté.
          - **L'action volontaire** (chap. 9-10) : il y a deux espèces de causes, l'âme et les causes extérieures. Le voleur et l'assassin sont donc responsables : la providence fixe le cadre du devenir sans agir dans chaque acte.

          Plotin s'inscrit dans la tradition des traités *Du destin* de Cicéron, du pseudo-Plutarque et d'Alexandre d'Aphrodise ; les traités 47 et 48 (III, 2-3), *Sur la providence*, reprendront la question.
      - id: t-3-2
        title: "Sur la providence I"
        ennead: 3
        numberInEnnead: 2
        chrono: 47
      - id: t-3-3
        title: "Sur la providence II"
        ennead: 3
        numberInEnnead: 3
        chrono: 48
      - id: t-3-4
        title: "Sur le démon qui nous a reçus en partage"
        ennead: 3
        numberInEnnead: 4
        chrono: 15
        unit: traite15
        theses:
          - "Le démon n'est pas une divinité intermédiaire : c'est ce qui se tient au-dessus de la partie de l'âme active en nous."
          - "L'âme est responsable de son destin : selon la vie que nous choisissons, nous choisissons notre démon."
          - "Le démon du sage est un dieu, car en lui c'est l'intellect qui agit."
        summary: |-
          **Le traité 15 réduit le démon à une part de l'âme : notre démon est ce qui se tient au-dessus de la partie de l'âme qui est active en nous, si bien que l'âme est responsable de son destin.**

          - **L'âme et ses puissances** (chap. 1) : suite du traité 11 (V, 2), le traité est d'abord une étude de l'âme. La nature y engendre une **« indétermination totale »**, texte décisif pour la génération de la matière.
          - **Les réincarnations** (chap. 2) : quand elle quitte le corps, l'âme devient la partie d'elle-même qu'elle a le plus développée.
          - **Une démonologie « déflationniste »** (chap. 3) : le démon n'est pas une divinité intermédiaire, comme chez Hésiode ; c'est la partie de l'âme au-dessus de celle qui agit (3, 4-8). Proclus le lui reprochera.
          - **Choisir son démon** (chap. 4-5) : choisir sa vie, c'est choisir son démon, comme dans le mythe d'Er. L'âme du monde, elle, gouverne son corps sans y descendre.
          - **Le démon du sage est un dieu** (chap. 6) : en lui, c'est l'intellect qui agit ; son démon est donc ce qui est au-dessus de l'intellect, l'Un.

          Le traité rend douteux le récit de Porphyre sur la séance de l'**Iseion**, où le démon de Plotin serait apparu.
