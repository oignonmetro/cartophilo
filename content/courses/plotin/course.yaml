      - id: t-6-9
        title: "Sur le Bien ou l'Un"
        ennead: 6
        numberInEnnead: 9
        chrono: 9
        priority: 4
        highlight: true
        unit: traite9
        theses:
          - "Tout être est un : le principe premier, absolument simple, est au-delà de l'Intellect et de l'être."
          - "On ne parle de l'Un que par négation : la théologie négative est une méthode, une exhortation qui indique le chemin."
          - "L'âme remonte à l'Un par l'union, au-delà de toute connaissance : « fuir seul vers lui seul »."
        summary: |-
          **Le traité 9 présente pour la première fois de manière systématique le premier principe de Plotin : au-delà de l'Intellect et de l'être, une réalité absolument simple, l'Un.** C'est son innovation fondamentale dans la tradition platonicienne, qui plaçait au principe un Intellect « démiurgique ».

          - **Tout être est un** (chap. 1-2) : une armée, une maison, un corps n'existent qu'en vertu de leur unité. Mais ni l'Âme, ni l'Intellect et l'être, multiples, ne sont l'Un.
          - **L'Un est au-delà de tout** (chap. 3-4) : sans forme, il n'est pas, ne se connaît ni ne se dit. La **théologie négative** est une méthode : tout discours sur l'Un est une exhortation qui indique le chemin.
          - **La causalité de l'Un** (chap. 5-6) : il est le principe de tout, et le Bien pour les autres, non pour lui-même.
          - **L'union** (chap. 7-11) : l'âme doit se faire une et sans forme, comme un cercle qui fait coïncider son centre avec le centre de tout ; elle vit alors, dans une « extase », la vie véritable.

          Placé par Porphyre à la fin des *Ennéades*, le traité s'achève sur la vie « des dieux et des hommes divins » : « fuir seul vers lui seul ».
