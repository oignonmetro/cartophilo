      - id: t-3-1
        title: "Sur le destin"
        ennead: 3
        numberInEnnead: 1
        chrono: 3
        unit: traite3
        theses:
          - "Contre les épicuriens, le hasard des atomes ne peut produire un monde si beau : une providence le gouverne."
          - "Contre les stoïciens, tout n'est pas destin : l'âme est une cause, et l'homme est responsable de ses actes."
          - "Les astres ne causent pas nos actes : ils donnent seulement des signes de l'avenir."
        summary: |-
          **Le traité 3 s'interroge sur le destin et, partant, sur la responsabilité humaine.** Si la vraie vie de l'âme est la contemplation des intelligibles, la vie qu'elle mène dans un corps se déroule-t-elle dans un univers sans rime ni raison ?

          - Plotin s'inscrit dans une tradition : les traités *Du destin* de Cicéron, du pseudo-Plutarque et d'Alexandre d'Aphrodise.
          - Tout ce qui devient a une cause ; il faut distinguer **causes prochaines** et **causes lointaines** (chap. 1-2). Cinq opinions sur les causes lointaines (atomes des épicuriens, éléments des « physiologues », destin, astres des astrologues, enchaînement des causes des stoïciens) sont réfutées (chap. 3-7) : toutes abolissent notre autonomie.
          - Contre les **épicuriens**, Plotin tient qu'une providence gouverne le monde ; contre les **stoïciens**, il refuse le nécessitarisme et place la providence dans un intelligible autonome, ce qui permet de concilier la réalité des maux et la perfection divine.
          - La cause lointaine est l'**âme**, celle de l'univers et celle de l'individu (chap. 8-10) : séparée du corps, l'âme est libre ; dans un corps, sa liberté varie avec sa bonté. Il y a deux espèces de causes, l'âme et les causes extérieures.
          - Le voleur et l'assassin sont responsables : la providence fixe le cadre du devenir sans agir dans chaque acte. Les astres donnent seulement des « signes » de l'avenir.
      - id: t-3-2
        title: "Sur la providence I"
        ennead: 3
        numberInEnnead: 2
        chrono: 47
      - id: t-3-3
        title: "Sur la providence II"
        ennead: 3
        numberInEnnead: 3
        chrono: 48
      - id: t-3-4
        title: "Sur le démon qui nous a reçus en partage"
        ennead: 3
        numberInEnnead: 4
        chrono: 15
        unit: traite15
        theses:
          - "Le démon n'est pas une divinité intermédiaire : c'est ce qui se tient au-dessus de la partie de l'âme active en nous."
          - "L'âme est responsable de son destin : selon la vie que nous choisissons, nous choisissons notre démon."
          - "Le démon du sage est un dieu, car en lui c'est l'intellect qui agit."
        summary: |-
          **Le traité 15, suite du traité 11 (V, 2), est d'abord un traité de psychologie : il étudie l'âme et ses puissances, puis l'âme humaine et ses réincarnations, et ne vient au démon qu'à travers elles.**

          - **Une démonologie « déflationniste »** : le démon n'est pas une divinité intermédiaire entre les hommes et les dieux, comme chez Hésiode. C'est **ce qui se tient au-dessus de la partie de l'âme qui est active en nous** (3, 4-8) : l'âme est à elle-même son propre démon, et Proclus le lui reprochera.
          - **L'âme est responsable de son destin** : quand elle quitte le corps, elle devient la partie d'elle-même qu'elle a le plus développée ; choisir sa vie, c'est choisir son démon (le mythe d'Er). L'âme du monde, elle, gouverne son corps sans y descendre.
          - **Le démon du sage est un dieu**, car en lui c'est l'intellect qui agit : son démon est donc ce qui est au-dessus de l'intellect, l'Un. D'où le doute sur le récit de Porphyre (la séance de l'**Iseion**).
          - **Le chapitre 1** dit que la nature engendre une **« indétermination totale »** : un texte décisif pour la question de la génération de la matière.
