      - id: t-1-9
        title: "Sur le suicide raisonnable"
        ennead: 1
        numberInEnnead: 9
        chrono: 16
        unit: traite16
        theses:
          - "Il ne faut pas se donner la mort, sauf si c'est vraiment nécessaire : contre les stoïciens, Plotin suit le Phédon."
          - "L'âme doit attendre que l'harmonie qui la lie au corps n'existe plus, sinon elle part en amenant quelque chose."
          - "Le rang de chacun là-bas dépend de son état quand il sort de son corps : il faut progresser tant qu'on le peut."
        summary: |-
          **Le minuscule traité 16 (un chapitre) se demande si le suicide peut être « raisonnable » (`eúlogos`), et répond non, sauf nécessité.** C'est une exhortation, dans le ton de la prédication morale de l'époque, pour prévenir le suicide.

          - Plotin suit le *Phédon* (61c-62c), qui tient la mort volontaire pour toujours « déraisonnable » (`álogon`), contre les **stoïciens**, qui l'admettaient dans des cas extrêmes, comme la folie.
          - **Quatre arguments** : l'âme doit attendre que l'**harmonie** qui la lie au corps s'épuise, sinon elle part en emportant quelque chose ; le suicide est un acte de **passion** (angoisse, douleur, colère) ; le temps de chacun est **fixé par le destin** ; le rang de l'âme après la mort dépend de son état au moment de sortir du corps : il faut **progresser** tant qu'on le peut.
          - Une réserve : sauf s'il est **« vraiment nécessaire »**, cas jamais précisé, même dans le traité 46 (I, 4) : peut-être une marge de doute plutôt qu'une exception.

          La première phrase, « Tu n'expulseras pas ton âme du corps », serait le seul emprunt identifiable de Plotin aux *Oracles chaldaïques*.
      - id: t-2-1
        title: "Sur le monde"
        ennead: 2
        numberInEnnead: 1
        chrono: 40
      - id: t-2-2
        title: "Sur le mouvement circulaire"
        ennead: 2
        numberInEnnead: 2
        chrono: 14
        unit: traite14
        theses:
          - "C'est l'âme qui fait tourner le ciel, et le ciel se meut en cercle parce qu'il imite l'Intellect."
          - "L'Intellect et l'Âme tournent autour de l'Un, qu'ils désirent sans jamais le rejoindre."
          - "L'âme, qui ne se meut pas dans le lieu, meut pourtant le corps dans le lieu, comme notre âme meut notre corps."
        summary: |-
          **Le traité 14 explique pourquoi le ciel se meut en cercle autour du centre de l'univers. Sa thèse est simple : c'est l'âme qui fait tourner le monde et le ciel, parce que le ciel « imite l'Intellect ».**

          - Plotin reprend Platon (*Lois*, X ; *Timée*, l'âme du monde faite des cercles du Même et de l'Autre), mais répond aux objections d'Aristote (*De l'âme*, I, 3) : d'où vient le mouvement circulaire de l'âme, et comment meut-elle un corps ?
          - **La métaphore des cercles** : l'Un est le centre ; l'Intellect et l'Âme sont des cercles qui désirent s'unir à lui sans jamais le rejoindre, et tournent donc autour de lui. L'âme a un centre **intelligible**, le corps un centre **local** : le corps du monde suit l'âme.
          - Le mouvement de l'âme n'est pas local, mais elle meut le corps dans le lieu, comme notre âme meut notre corps quand elle se réjouit : **microcosme et macrocosme**.
          - **Le feu**, qui va par nature en ligne droite, tourne en cercle parce que l'âme, partout, l'entraîne vers elle sans fatigue.

          « L'univers se meut donc lui aussi en cercle et reste en même temps immobile », comme l'Intellect.
      - id: t-2-3
        title: "Si les astres agissent"
        ennead: 2
