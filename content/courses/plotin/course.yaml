        chrono: 52
      - id: t-2-4
        title: "Sur les deux matières"
        ennead: 2
        numberInEnnead: 4
        chrono: 12
        highlight: true
        priority: 6
        unit: traite12
        theses:
          - "Il y a deux matières, l'une sensible, l'autre intelligible, toutes deux incorporelles."
          - "La matière intelligible existe : la multiplicité des Formes exige un substrat commun, et elle est un être véritable."
          - "La matière sensible est privée de tout, même de grandeur ; elle est identique à la privation et à l'illimité, et elle est le mal."
        summary: |-
          **Le traité 12 développe une théorie de la matière très originale, nourrie d'Aristote, de Platon et des stoïciens : il y a deux matières, toutes deux incorporelles, l'une intelligible, l'autre sensible.**

          - Contre les stoïciens (une matière corporelle) et les aristotéliciens (une seule matière), Plotin adopte ce qu'il tient pour la position de Platon, en suivant le témoignage d'Aristote sur la **Dyade indéfinie**, matière des Idées.
          - **La matière intelligible** (chap. 2-5) explique la multiplicité des Formes : un substrat commun, coupé en autant de figures. Recevant sa forme, elle devient une vie intelligente ; elle est engendrée sans naître dans le temps : c'est le produit informe de chaque réalité, avant sa **conversion** vers son géniteur.
          - **La matière sensible** (chap. 6-16) explique la transformation des éléments. Privée de tout, elle n'a pas même de **grandeur** (contre les stoïciens) ni de masse ; on ne la saisit que par un **raisonnement bâtard**.
          - Plotin l'identifie, contre Aristote, à la **privation** ; il en fait un **non-être relatif** (le *Sophiste*), l'**illimité** (`ápeiron`), dont l'illimité sensible est le modèle, et enfin le **mal**.

          La matière d'ici, ornée de formes, n'est qu'**« un cadavre ornementé »**.
      - id: t-2-5
        title: "Sur le sens de « en puissance » et « en acte »"
        ennead: 2
        numberInEnnead: 5
        chrono: 25
        unit: traite25
        theses:
          - "Ce qui est en puissance ne devient pas lui-même en acte : l'airain reste airain, c'est la statue qui est en acte."
          - "Dans l'intelligible, rien n'est en puissance : tout y est forme, à la fois en acte et acte."
          - "La matière est tous les êtres en puissance et n'est rien en acte : un « mensonge véritable », un non-être."
        summary: |-
          **Le traité 25 examine les notions d'acte et de puissance, héritées d'Aristote, pour en fixer l'usage dans le sensible, dans l'intelligible et pour la matière.** Plotin ne fait pas œuvre de doxographe : il plie la doctrine du Stagirite à sa propre métaphysique.

          - **Quatre notions** (chap. 1-2) : l'être en puissance est un substrat passif (l'airain), qui a besoin d'autre chose pour passer à l'acte ; l'être en acte est le composé (la statue) ; l'acte est la forme du composé ; la puissance est une puissance active (le courage).
          - **Ce qui est en puissance ne devient pas lui-même en acte** : l'airain reste airain, c'est la statue qui vient à l'être.
          - **Dans l'intelligible, tout est en acte et tout est acte** (chap. 3) : même la matière y est une forme ; les formes, éternelles, sont les plus beaux actes.
          - **La matière première est tous les êtres en puissance et n'est rien en acte** (chap. 4-5) : un non-être, un « mensonge véritable », qui ne passera jamais à l'acte, et pour cela indestructible.

          Contre Aristote, pour qui la matière tend vers la forme, Plotin maintient un écart infranchissable entre elles. Le traité 26 (III, 6), chap. 7, y reviendra.
      - id: t-2-6
        title: "Sur la réalité ou sur la qualité"
        ennead: 2
        numberInEnnead: 6
        chrono: 17
        unit: traite17
        theses:
          - "Contre Aristote, la différence qui définit une chose relève de sa réalité, non de la qualité, qui n'est qu'accidentelle."
          - "Le « complément de la réalité » (le blanc de la neige) est intermédiaire entre la simple qualité et l'acte intelligible."
          - "La réalité sensible n'est qu'une « réalité qualifiée », image de la réalité de là-bas, seule réellement réalité."
        summary: |-
          **Le traité 17 porte sur la consistance et la composition des réalités sensibles : qu'est-ce qui distingue, dans une chose, ce qui fait sa réalité de ce qui n'est qu'une qualité ?**

          - Plotin conteste la division aristotélicienne des qualités (*Métaphysique*, Δ, 14), qui range la **différence** de la réalité parmi les qualités : elle confond l'ordre de la réalité (`ousía`) et celui de l'accident.
          - Il retourne contre Aristote ses propres concepts (réalité, acte, différence, qualité), dans un sens platonicien : la forme est la **raison** (`lógos`), séparée ; la réalité sensible, « réalité qualifiée », n'est qu'une image de la réalité de là-bas, seule « réellement réalité ».
          - Le traité est un **dialogue** avec un interlocuteur péripatéticien, qui avance par objections : d'où son obscurité réputée.
          - La notion clé est le **« complément de la réalité »**, comme la blancheur de la neige ou la chaleur du feu : sensible, mais lié au `lógos`, il est un niveau médiateur entre la qualité accidentelle (la blancheur peinte) et l'acte intelligible.

          L'équivocité de « forme », « acte » et « réalité » n'est pas une négligence : elle vient de l'intégration d'Aristote dans le cadre de l'émanation.
