      - id: t-1-9
        title: "Sur le suicide raisonnable"
        ennead: 1
        numberInEnnead: 9
        chrono: 16
        unit: traite16
        theses:
          - "Il ne faut pas se donner la mort, sauf si c'est vraiment nécessaire : contre les stoïciens, Plotin suit le Phédon."
          - "L'âme doit attendre que l'harmonie qui la lie au corps n'existe plus, sinon elle part en amenant quelque chose."
          - "Le rang de chacun là-bas dépend de son état quand il sort de son corps : il faut progresser tant qu'on le peut."
        summary: |-
          **Le minuscule traité 16 (un chapitre) répond que le suicide n'est jamais « raisonnable » (`eúlogos`), sauf s'il est « vraiment nécessaire ».** C'est une exhortation, dans le ton de la prédication morale de l'époque, pour prévenir le suicide.

          - **Contre les stoïciens** : ils admettaient le suicide dans des cas extrêmes, comme la folie ; Plotin suit le *Phédon* (61c-62c), qui tient la mort volontaire pour toujours « déraisonnable » (`álogon`).
          - **La séparation naturelle** (1, 1-7) : l'âme doit attendre que l'**harmonie** qui la lie au corps s'épuise, sinon elle part en amenant quelque chose.
          - **La passion** (1, 7-14) : le suicide est un acte d'angoisse, de douleur ou de colère.
          - **Le destin et le progrès** (1, 15-19) : le temps de chacun est fixé par le destin ; et le rang de l'âme après la mort dépend de son état au moment de sortir du corps : il faut **progresser** tant qu'on le peut.
          - **Une réserve** : le cas « vraiment nécessaire » n'est jamais précisé, même dans le traité 46 (I, 4) : peut-être une marge de doute plutôt qu'une exception.

          La première phrase, « Tu n'expulseras pas ton âme du corps », serait le seul emprunt identifiable de Plotin aux *Oracles chaldaïques*.
      - id: t-2-1
        title: "Sur le monde"
        ennead: 2
        numberInEnnead: 1
        chrono: 40
      - id: t-2-2
        title: "Sur le mouvement circulaire"
        ennead: 2
        numberInEnnead: 2
        chrono: 14
        unit: traite14
        theses:
          - "C'est l'âme qui fait tourner le ciel, et le ciel se meut en cercle parce qu'il imite l'Intellect."
          - "L'Intellect et l'Âme tournent autour de l'Un, qu'ils désirent sans jamais le rejoindre."
          - "L'âme, qui ne se meut pas dans le lieu, meut pourtant le corps dans le lieu, comme notre âme meut notre corps."
        summary: |-
          **Le traité 14 explique pourquoi le ciel se meut en cercle : c'est l'âme qui le fait tourner, parce que le ciel « imite l'Intellect ».**

          - **La question** (chap. 1, 1-19) : Plotin reprend Platon (*Lois*, X ; *Timée*), mais répond à Aristote (*De l'âme*, I, 3) : d'où vient le mouvement circulaire de l'âme, et comment meut-elle un corps ?
          - **Le feu** (chap. 1, 19-51) : il va par nature en ligne droite, mais tourne en cercle parce que l'âme du monde, partout, l'entraîne vers elle.
          - **Les deux centres** (chap. 2) : l'âme a un centre **intelligible**, le corps un centre **local**. Notre âme meut notre corps sans se mouvoir dans le lieu : **microcosme et macrocosme**.
          - **L'âme poursuit le Bien** (chap. 3) : l'Intellect et l'Âme sont comme des cercles qui désirent s'unir à l'Un sans jamais le rejoindre, et tournent donc autour de lui.

          « L'univers se meut donc lui aussi en cercle et reste en même temps immobile », comme l'Intellect. Le traité 40 (II, 1), *Sur le ciel*, reprendra la question du feu céleste.
      - id: t-2-3
        title: "Si les astres agissent"
        ennead: 2
