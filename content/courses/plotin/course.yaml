      - id: t-4-7
        title: "Sur l'immortalité de l'âme"
        ennead: 4
        numberInEnnead: 7
        chrono: 2
        unit: traite2
        theses:
          - "Nous sommes notre âme : elle est immortelle, car elle a l'être et la vie par elle-même."
          - "L'âme n'est pas un corps : un souffle corporel n'expliquerait ni la mémoire, ni la sensation, ni la pensée."
          - "L'âme produit et gouverne les corps par des « raisons » (lógoi), sans quitter l'intelligible."
        summary: |-
          **Le traité 2 établit que l'âme, qui est ce que nous sommes, n'est pas un corps : elle est incorporelle, immortelle et intelligible.** Plotin réfute d'abord les définitions de ses prédécesseurs, puis défend la sienne, qu'il tient pour platonicienne.

          - **Nous sommes notre âme** (chap. 1-2) : le corps, composé, se dissout ; l'âme, qui est le soi, est la cause de l'existence des corps.
          - **L'âme n'est pas un corps** (chap. 3 à 8³) : ni les atomes des épicuriens, ni surtout le souffle (`pneûma`) des stoïciens. Si l'âme était un corps, il n'y aurait ni mémoire, ni sensation unifiée, ni pensée.
          - **L'âme n'est forme d'aucun corps** (chap. 8⁴-8⁵) : ni « harmonie », comme le disent les pythagoriciens, ni « entéléchie », comme le dit Aristote.
          - **La nature de l'âme** (chap. 9-12) : elle a l'être et la vie par elle-même ; elle est divine, immortelle, indivisible.
          - **La venue dans le corps** (chap. 13-15) : l'âme produit et gouverne les corps par des « formules rationnelles » (`lógoi`), sans quitter l'intelligible ; sa descente n'est que partielle.

          Dans l'édition GF, le long chapitre 8 est divisé en cinq parties, de 8¹ à 8⁵. Les traités 4 (IV, 2) et 21 (IV, 1) sont la suite de celui-ci.
      - id: t-4-8
        title: "Sur la descente de l'âme dans les corps"
        ennead: 4
        numberInEnnead: 8
        chrono: 6
        priority: 2
        highlight: true
        unit: traite6
        theses:
          - "Toute âme est duelle : une partie tournée vers le corps, l'autre vers l'Intellect."
          - "La descente de l'âme est à la fois volontaire et nécessaire."
          - "Le corps manifeste l'âme et n'est pas méprisable : seule l'âme individuelle est « contaminée » par lui."
        summary: |-
          **Le traité 6 pense le rapport de l'âme et du corps comme une descente (`katabàs`) à la fois volontaire et nécessaire : toute âme a une partie tournée vers le corps et une partie qui reste auprès de l'Intellect.**

          - **Partir de l'expérience** (chap. 1) : « Souvent, lorsque je m'éveille à moi-même en sortant de mon corps… ». Plotin aborde la question par le haut, depuis l'âme qui contemple.
          - **Deux lectures de Platon** (chap. 1-2) : la descente est une **chute** (*Phédon*, *République*, *Phèdre*), ou ce qui **achève l'univers** (*Timée*). L'âme du monde gouverne son corps sans en pâtir.
          - **La chute des âmes individuelles** (chap. 3-4) : elles s'attachent à un corps particulier et en sont « contaminées », à cause de la **matière**.
          - **Volontaire et nécessaire** (chap. 5) : le volontaire est compris dans la nécessité. Le corps n'est pas méprisable : sans lui, l'âme aurait ignoré ce qu'elle possède.
          - **L'âme amphibie** (chap. 7-8) : intermédiaire entre l'intelligible et le sensible, elle a une partie supérieure, orientée vers l'Intellect, qui ne descend pas.

          Le traité donne sa forme classique à la doctrine plotinienne de l'âme, que les traités 27 à 29 (IV, 3-5) développeront.
      - id: t-4-9
        title: "Si toutes les âmes n'en sont qu'une"
        ennead: 4
        numberInEnnead: 9
        chrono: 8
        unit: traite8
        theses:
          - "Toutes les âmes n'en sont qu'une : leur multiplicité n'est qu'apparente."
          - "La diversité des vivants vient des corps : une même âme anime différemment des corps différents."
          - "L'âme est une malgré ses puissances multiples, comme une science est tout entière en chacun de ses théorèmes."
        summary: |-
          **Le traité 8 défend une thèse que Plotin sait audacieuse : toutes les âmes n'en sont qu'une, et leur multiplicité n'est qu'apparente.**

          - **La thèse** (chap. 1, 1-13) : au-delà de l'**homogénéité** des âmes, lieu commun platonicien, Plotin soutient leur **unité**.
          - **L'âme se divise dans les corps** (chap. 1-2) : la diversité des vivants vient des **corps**, qu'une même âme anime différemment.
          - **La sympathie universelle** (chap. 3, 1-9) : Plotin la reprend des stoïciens, mais la rapporte à une âme unique.
          - **La diversité des facultés** (chap. 3, 10-fin) : « ce n'est pas parce que l'âme a plusieurs puissances qu'elle n'est pas une » (3, 16-17).
          - **Deux justifications** (chap. 4-5) : les âmes sont les empreintes d'un même **sceau** ; l'âme est présente en chacune, comme une **science** tout entière en chacun de ses théorèmes.

          Reste une ambiguïté, que les traités 27-29 (IV, 3-5) devront affronter : comment les âmes individuelles procèdent-elles de l'âme du monde sans en être distinctes ?
      - id: t-5-1
        title: "Sur les trois hypostases qui ont rang de principes"
        ennead: 5
        numberInEnnead: 1
        chrono: 10
        priority: 5
        highlight: true
        unit: traite10
        theses:
          - "Il y a trois réalités véritables, l'Un, l'Intellect et l'Âme : chacune est produite par la précédente."
          - "Les âmes se sont éloignées de leur source par audace et en ont oublié l'origine."
          - "Les trois réalités sont aussi en nous : il faut fuir les « bruits sensibles » pour entendre ceux de l'intérieur."
        summary: |-
          **Le traité 10 est le seul exposé à la fois systématique et synthétique des trois réalités véritables, l'Un, l'Intellect et l'Âme, que le titre de Porphyre nomme « hypostases » : chacune est produite par la précédente, et toutes trois sont aussi en nous.**

          - **L'oubli de l'âme** (chap. 1-2) : par **audace** (`tólma`), les âmes ont voulu s'appartenir et ont oublié le dieu leur père. Il faut leur rappeler leur dignité : l'âme du monde donne vie et ordre à tout l'univers.
          - **L'Âme, image de l'Intellect** (chap. 3) : comme le discours prononcé est l'image du discours intérieur. Sa pensée est discursive (`diánoia`), celle de l'Intellect intuitive (`nóēsis`).
          - **L'Intellect** (chap. 4) est à la fois pensée et être ; il contient les genres premiers du *Sophiste*.
          - **Comment l'Un engendre** (chap. 5-7) : sans vouloir ni se mouvoir, par **surabondance**, comme le soleil sa lumière ; l'engendré se **retourne** (`epistrophḗ`) vers lui et s'en trouve déterminé. Comme Kronos avale ses enfants, l'Intellect garde en lui ce qu'il engendre.
          - **Les prédécesseurs** (chap. 8-9) : seuls Platon et les pythagoriciens ont saisi la hiérarchie des trois principes ; Plotin se présente en **interprète** de Platon.
          - **Les trois réalités en nous** (chap. 10-12) : il faut négliger les **« bruits sensibles »** pour entendre les sons de là-bas.

          Augustin et Eusèbe l'ont lu à la lumière de la Trinité chrétienne, au prix d'un contresens : l'Un engendre par nécessité, non par volonté.
      - id: t-5-2
        title: "Sur la génération et le rang des choses qui sont après le premier"
        ennead: 5
        numberInEnnead: 2
        chrono: 11
        unit: traite11
        theses:
          - "L'Un, parfait et sans besoin, surabonde : l'engendré se tourne vers lui, le voit et devient l'Intellect."
          - "L'Âme engendre en descendant une image d'elle-même : ses facultés sensible et végétative."
          - "La réalité est continue, sans rupture entre ses niveaux, « comme une longue vie qui s'étend dans sa longueur »."
        summary: |-
          **Le petit traité 11 (deux chapitres) établit la continuité entre les niveaux de la réalité : la tripartition du réel en Un, Intellect et Âme n'implique aucune rupture.**

          - **La première génération** (chap. 1, 1-13) : « l'Un est toutes choses et il n'est aucune d'elles ». Parfait, sans besoin, il **surabonde** ; l'engendré se tourne vers lui, le voit, et devient l'**Intellect** et l'**être**.
          - **L'Âme et son image** (chap. 1, 13-28) : l'Intellect produit de même l'**Âme** ; mais l'Âme produit en se mouvant : elle engendre une **image** d'elle-même, ses facultés sensible et végétative.
          - **En aucun lieu, donc partout** (chap. 2, 1-24) : l'Âme est dans une plante, un animal ou un homme selon la faculté qui domine ; couper une plante ne la déplace pas.
          - **Un même processus** (chap. 2, 24-31) : surabondance, puis **retour**, à chaque niveau ; chaque réalité est l'image de la précédente et le modèle de la suivante.

          Le traité finit sur une image : le réel est **« comme une longue vie qui s'étend dans sa longueur »**. Le traité 15 (III, 4) en est la suite.
      - id: t-5-3
        title: "Sur les hypostases qui ont la faculté de connaître et ce qui est au-delà"
        ennead: 5
        numberInEnnead: 3
        chrono: 49
        highlight: true
      - id: t-5-4
        title: "Comment vient du premier ce qui est après le premier, et sur l'Un"
        ennead: 5
        numberInEnnead: 4
        chrono: 7
        highlight: true
        priority: 3
        unit: traite7
        theses:
          - "L'Intellect provient immédiatement de l'Un, qui pourtant demeure en lui-même."
          - "L'Intellect est l'intellection de l'Un : distinct de lui, il n'en est pas séparé."
          - "Toute réalité a deux actes : l'un la définit, l'autre fait exister autre chose (la chaleur du feu)."
        summary: |-
          **Le bref traité 7 (deux chapitres) explique comment l'Intellect vient de l'Un sans que l'Un sorte de lui-même : toute réalité a deux actes, l'un qui la constitue, l'autre qui en provient sans l'affecter.**

          - **Le Premier** (chap. 1, 1-23) : il est un, simple, parfait, « au-delà de la réalité ».
          - **L'Un parfait produit** (chap. 1, 23-41) : ce qui vient de lui en vient soit par des intermédiaires, soit **immédiatement** ; c'est le cas de l'**Intellect**.
          - **La dualité de l'Intellect** (chap. 2, 1-27) : l'Intellect est une **intellection** de l'Un ; distinct de lui, il n'en est pas séparé. L'Un, lui, **demeure** (`ménei`) en lui-même.
          - **Les deux actes** (chap. 2, 27-36) : il y a l'acte de la réalité et l'acte issu de la réalité, comme le feu et la chaleur qui en émane. L'Un est une puissance qui surabonde.

          Le traité pose ainsi le mécanisme de la procession, que les traités 10 (V, 1) et 11 (V, 2) développeront.
      - id: t-5-5
        title: "Sur l'intellect et que les intelligibles ne sont pas hors de l'intellect, et sur le Bien"
        ennead: 5
        numberInEnnead: 5
        chrono: 32
      - id: t-5-6
        title: "Sur le fait que ce qui est au-delà de l'être n'intellige pas, et sur ce que sont les principes premier et second d'intellection"
        ennead: 5
        numberInEnnead: 6
        chrono: 24
        unit: traite24
        theses:
          - "Contre Aristote, ce qui pense, même soi-même, n'est pas premier : le principe, absolument un, n'intellige pas."
          - "Ce qui s'intellige soi-même est à la fois un et deux : il faut qu'il soit « simple et non simple »."
          - "Intelliger, c'est un mouvement qui se porte vers le Bien en le désirant : le désir a engendré l'intellection."
        summary: |-
          **Le traité 24 dissocie l'excellence du principe de l'activité de pensée : ce qui pense, même soi-même, ne peut plus prétendre au premier rang.** Il vise la théologie d'Aristote, pour qui l'Intellect qui se pense est « la plus divine des choses » : Plotin lui substitue l'Un, parfait parce que purifié de toute intellection.

          - **Penser, c'est être deux** (chap. 1) : ce qui s'intellige est à la fois un et deux, « simple et non simple ». L'âme pense autre chose qu'elle ; l'Intellect se pense lui-même, et pense ainsi au sens propre.
          - **Le Premier n'intellige pas** (chap. 2-3) : il y a un principe qui n'intellige pas, un qui intellige en un sens premier (l'Intellect) et un en un sens second (l'âme). Le multiple suppose une unité simple avant lui.
          - **Les images** (chap. 4) : l'Intellect « prend la forme du Bien » ; le Bien est la lumière, l'Intellect le soleil, l'âme la lune.
          - **Le désir précède la pensée** (chap. 5) : « intelliger : un mouvement qui se porte vers le Bien en le désirant ». L'Intellect ne s'intellige que par accident, en regardant vers le Bien.
          - **Au-delà de la réalité, au-delà de l'intellection** (chap. 6) : le Bien ne se connaît pas ; il donne aux autres choses de l'atteindre.

          C'est l'un des gestes inauguraux du néoplatonisme.
      - id: t-5-7
        title: "S'il y a des idées même des êtres individuels"
        ennead: 5
        numberInEnnead: 7
        chrono: 18
        unit: traite18
        theses:
          - "Il y a une Idée de chaque individu, un « Socrate en soi » : les différences entre les hommes sont formelles."
          - "Le nombre des individus en soi est déterminé : à chaque période, le monde recommence à l'identique."
          - "Il y a autant de raisons que d'individus différents : la matière n'explique que la laideur."
        summary: |-
          **Le bref traité 18 (trois pages) est l'un des plus originaux de Plotin : il y a une Idée de chaque individu, un « Socrate en soi ».** Platon ne l'avait pas soutenu explicitement.

          - **Un Socrate en soi** (chap. 1, 1-5) : la participation relie aussi l'individu à un **individu en soi** ; les différences entre les hommes sont des **« différences formelles »**, non de simples accidents de la matière.
          - **L'illimité n'est pas à craindre** (chap. 1, 6-27) : le nombre des individus en soi est pourtant déterminé, car le monde revient à l'identique à chaque **période**, la Grande Année.
          - **Les géniteurs et la matière** (chap. 2) : les différences entre enfants des mêmes parents viennent des raisons ; la matière n'explique que la laideur.
          - **Les jumeaux** (chap. 3) : « il y a autant de raisons que d'individus différents ».

          Deux conséquences : la rationalité s'étend au monde des individus, et l'âme garde après la mort sa personnalité. **Plotin refuse d'identifier individualité et irrationalité.**
      - id: t-5-8
        title: "Sur la beauté intelligible"
        ennead: 5
        numberInEnnead: 8
        chrono: 31
        highlight: true
      - id: t-5-9
        title: "Sur l'Intellect, les idées et ce qui est"
        ennead: 5
        numberInEnnead: 9
        chrono: 5
        unit: traite5
        theses:
          - "L'Intellect est les Formes qu'il pense : elles ne sont ni avant ni après lui, mais en lui."
          - "Toujours en acte, l'Intellect est antérieur et supérieur à l'Âme : il n'est pas l'âme parvenue à sa perfection."
          - "Il y a une Forme de l'homme, mais aucune des choses sans valeur, qui viennent de la matière."
        summary: |-
          **Le traité 5 examine le monde intelligible : l'Intellect, toujours en acte et supérieur à l'âme, ne pense pas des Formes extérieures à lui, il est les Formes qu'il pense.**

          - **La vraie philosophie** (chap. 1-2) : les épicuriens en restent au plaisir, les stoïciens s'élèvent un peu par la vie morale, les platoniciens contemplent l'intelligible. Il faut monter d'« ici-bas » jusque « là-bas ».
          - **L'Intellect au-dessus de l'âme** (chap. 3-4) : il lui donne sa forme et ses « raisons » (`lógoi`) ; toujours en acte, il lui est supérieur.
          - **Penser, c'est être les Formes** (chap. 5-6) : l'Intellect se pense lui-même, et se penser, c'est penser les Formes, qui sont en lui. Il est « toutes les choses ensemble ».
          - **Les Formes ne sont pas produites par l'Intellect** (chap. 7-9) : elles lui sont « antérieures », non dans le temps, mais parce qu'il ne les penserait sinon que par hasard ; en vérité, elles lui sont contemporaines.
          - **De quoi y a-t-il des Formes ?** (chap. 10-14) : de l'homme, peut-être pas de Socrate ; pas des techniques, sauf en l'homme ; aucune des choses sans valeur ni des composés accidentels.

          Le traité concilie Platon, Aristote et le médioplatonisme ; il laisse pour plus tard la question de l'Un, à laquelle répondra le traité 7 (V, 4).
