      - id: t-4-2
        title: "De l'essence de l'âme"
        ennead: 4
        numberInEnnead: 2
        chrono: 4
        unit: traite4
        summary: |-
          **Le traité 4, suite du traité 2 (IV, 7), propose une définition de l'âme : une réalité intelligible mais intermédiaire, à la fois indivisible et divisible.**

          - Plotin s'appuie sur le *Timée* (35a) : l'âme du monde est engendrée d'un mélange entre la réalité indivisible, toujours la même, et la réalité divisible qui devient dans les corps.
          - L'âme est **indivisible** en tant qu'elle n'est pas une quantité étendue, **divisible** en tant qu'elle exerce son activité dans des corps distincts (chap. 1).
          - Avec le *Parménide* (155e), elle est **une et multiple** : ni absolument divisible, ni absolument indivisible (chap. 2, analyse dichotomique).
          - Plotin introduit un **double critère**, divisibilité et multiplicité, qui hiérarchise les réalités : au sommet, le principe un d'où vient l'âme ; puis l'âme, une et multiple ; puis ses produits, multiples. Les degrés d'unité distinguent tous les niveaux de réalité.

          Le traité 21 (IV, 1), un unique chapitre isolé par Porphyre, en donne sans doute le dernier mot.

