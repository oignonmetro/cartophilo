      - id: t-3-6
        title: "Sur l'impassibilité des incorporels"
        ennead: 3
        numberInEnnead: 6
        chrono: 26
        theses:
          - "Les sensations et les passions ne sont pas des affections de l'âme, mais des activités : l'âme reste inaltérable."
          - "Purifier l'âme, ce n'est pas la laver d'une souillure, mais la détourner des images, comme on réveille un rêveur."
          - "La matière, non-être véritable, est impassible : les formes s'y reflètent comme dans un miroir, sans l'affecter."
