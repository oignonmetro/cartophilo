      - id: t-1-2
        title: "Sur les vertus"
        ennead: 1
        numberInEnnead: 2
        chrono: 19
        highlight: true
        unit: traite19
        theses:
          - "Le divin n'a pas de vertus, et pourtant les nôtres nous rendent semblables à lui : comme une image à son modèle, non comme deux choses qui partagent le même trait."
          - "Les vertus de la vie en société mettent de la mesure dans nos passions, et c'est un premier pas vers le divin."
          - "Les vertus supérieures purifient l'âme en la tournant vers l'Intellect : l'homme devient alors un dieu."
        summary: |-
          **Le traité 19 fait de la vertu le moyen de se rendre « semblable au dieu » : l'éthique de Plotin n'a pour seule activité que l'union de l'âme avec le divin.** Cette formule vient du *Théétète* (176b).

          - **Un paradoxe** (chap. 1-2) : nos vertus nous rendent semblables à un divin qui n'a pas de vertus (elles servent à maîtriser des passions qu'il n'a pas). Il se résout par la **double assimilation** : deux images d'un même modèle se ressemblent entre elles ; une image ressemble à son modèle sans que le modèle lui ressemble. Exemples : l'objet chauffé par le feu, sans que le feu soit chauffé ; la maison construite, avec son ordre et sa symétrie, et la maison pensée par l'architecte, qui n'en a pas.
          - **Les vertus civiques** (chap. 1-2) : réflexion, courage, maîtrise de soi, justice imposent mesure et limite aux passions, comme la **métriopathie** d'Aristote : un premier pas.
          - **Les vertus comme purifications** (chap. 3-5) : détachement du corps et **retour** (`epistrophḗ`) vers l'Intellect, qui illumine les traces de l'intelligible en l'âme. Elles suppriment les passions : l'**impassibilité** (`apátheia`) des stoïciens.
          - **Les vertus de l'âme purifiée** (chap. 6-7) : l'homme purifié est **« uniquement un dieu »** ; il faut choisir non la vie de l'homme de bien, mais la vie des dieux.

          Porphyre, puis Macrobe et les néoplatoniciens, en tireront une échelle de « degrés de vertus », étrangère à la lettre de Plotin. Le traité 20 (I, 3) en est la suite.
      - id: t-1-3
        title: "Sur la dialectique"
        ennead: 1
        numberInEnnead: 3
        chrono: 20
        highlight: true
        unit: traite20
        theses:
          - "La dialectique (l'art de raisonner par concepts) purifie l'âme et la fait monter jusqu'au Bien."
          - "Le musicien, l'amoureux et le philosophe du Phèdre sont trois étapes de la montée vers ce que seule la pensée saisit (l'intelligible)."
          - "La dialectique n'est ni de la logique ni un simple outil, mais ce que la philosophie a de plus précieux."
        summary: |-
          **Le traité 20, suite du traité 19 (I, 2), fait de la dialectique la méthode de l'ascension de l'âme vers le Bien : une méthode de purification, et non seulement de recherche et de définition, comme chez Platon.**

          - **Trois degrés de la remontée** (chap. 1-3) : dans le *Phèdre* (248d), l'âme qui a le plus contemplé l'intelligible naît ensuite dans un philosophe, un musicien ou un amant. Le **musicien** doit aller du beau des sons à l'harmonie intelligible ; l'**amant**, de la beauté d'un corps à celle des vertus ; le **philosophe**, qui a « des ailes », n'a besoin que des mathématiques puis de la dialectique.
          - **La dialectique véritable** (chap. 4-5) : elle dit de chaque chose ce qu'elle est, divise et rassemble les genres jusqu'au principe, puis contemple. Elle laisse la **logique** des propositions à une autre technique, celle d'Aristote et des stoïciens.
          - **La partie la plus précieuse** (chap. 6) : la dialectique n'est pas un instrument de la philosophie, mais sa partie la plus précieuse, qui embrasse la physique et l'éthique.

          Comme les vertus civiques avant la purification, la logique n'est qu'un préalable, à dépasser.
      - id: t-1-4
        title: "Sur le bonheur"
        ennead: 1
        numberInEnnead: 4
        chrono: 46
        unit: traite46
        theses:
          - "Le bonheur est une vie, mais « vivre » a plusieurs sens, et seule la vie parfaite de l'Intellect rend heureux."
          - "L'homme est heureux quand il vit effectivement cette vie parfaite, et le reste n'est pour lui que des vêtements qu'il porte."
          - "Les malheurs n'atteignent pas le bonheur du sage, qui brille encore comme une lanterne dans la tempête."
        summary: |-
          **Le traité 46 place le bonheur dans la vie, mais dans la vie parfaite de l'Intellect, dont toutes les autres vies ne sont que des images : l'homme est heureux quand il vit effectivement cette vie, et les maux ne peuvent alors rien contre son bonheur.**

          - **Les critères écartés** (chap. 1-2) : si le bonheur est le bien-être, la fonction propre ou la fin, les animaux et même les plantes seraient heureux ; ni la sensation ni la raison ne sont le critère cherché.
          - **La vie parfaite** (chap. 3-4) : « vivre » se dit en plusieurs sens, de la vie claire à la vie obscure ; le bonheur n'appartient qu'à celui qui vit dans la plénitude. L'homme heureux est cette vie de l'intellect, et porte le reste comme des vêtements.
          - **Le sage et les maux** (chap. 5-10) : la santé et l'absence de douleur sont nécessaires, non bonnes ; ni la ruine d'une cité, ni la captivité, ni la souffrance n'entament son bonheur, pas même la perte de conscience, car l'intellect reste en acte.
          - **La vie du sage** (chap. 11-16) : sa volonté est tournée vers l'intérieur, son plaisir est la sérénité ; il voit le bien même dans le taureau de Phalaris (un taureau de bronze où l'on brûlait les condamnés), et use de son corps comme le musicien de sa lyre.

          Le traité prolonge le traité 36 : le bonheur est la vie de l'être véritable, le monde intelligible.
      - id: t-1-5
        title: "Si le bonheur s'accroît avec le temps"
        ennead: 1
        numberInEnnead: 5
        chrono: 36
        unit: traite36
        theses:
          - "Le bonheur ne grandit pas avec le temps, car il est un état présent, et le bonheur passé n'existe plus."
          - "Le bonheur est la vie de l'être véritable (le monde intelligible) : il se mesure à l'éternité et non au temps, et doit être tout entier présent."
          - "Le bonheur ne dépend pas du nombre des actions, car c'est l'état de l'âme qui rend les actions belles."
        summary: |-
          **Le traité 36 soutient que le bonheur ne s'accroît pas avec le temps : il est une disposition présente de l'âme, la vie de l'être véritable (le monde intelligible), qui se mesure à l'éternité et non à la durée.** Plotin rejoint la conclusion des stoïciens et des épicuriens contre Aristote, mais par ses propres raisons.

          - **La thèse** (chap. 1-2) : le bonheur consiste à être en une certaine disposition, et une disposition n'existe qu'au présent. Le désir de vivre ne vise pas l'avenir, mais que l'état actuel se prolonge.
          - **Durée, plaisir, malheur** (chap. 3-6) : voir ou jouir plus longtemps n'ajoute rien ; le plaisir passé n'existe plus. Le malheur croît quand le mal s'aggrave, non parce qu'il dure ; le bonheur, lui, a une borne et ne croît qu'avec la vertu.
          - **Le temps et l'éternité** (chap. 7) : on peut compter les temps passés, non ajouter un bonheur qui n'est plus. Le temps, image de l'éternité, disperse l'unité ; le bonheur, vie de l'être véritable, doit exister tout entier ; l'éternité n'est pas un temps infini, mais une vie possédée tout entière à la fois.
          - **Le souvenir et les actions** (chap. 8-10) : se souvenir d'un plaisir ou d'une belle chose n'accroît pas le bonheur ; le bonheur réside dans la disposition de l'âme, qui rend belles les actions, non dans le nombre des actions.

          Il complète ainsi les traités 19, 20 et 46, qui le précèdent dans la première Ennéade.
      - id: t-1-6
        title: "Sur le beau"
        ennead: 1
        numberInEnnead: 6
        chrono: 1
        priority: 1
        highlight: true
        unit: traite1
        theses:
          - "La beauté ne tient pas à la bonne proportion des parties, mais à l'unité qu'une Forme donne à la chose."
          - "Reconnaître le beau, c'est se souvenir du monde intelligible : la beauté sensible n'est qu'un tremplin, qui pousse l'âme à se purifier moralement."
          - "Le beau nous mène du dehors vers le dedans, jusqu'à l'Un, et le bien est au-delà du beau."
        summary: |-
          **Le premier traité de Plotin n'est pas un traité d'esthétique, mais une introduction à la philosophie platonicienne : la beauté n'est pas la proportion des parties, elle manifeste l'unité d'une Forme, et mène l'âme des corps jusqu'à l'Un.**

          - **Contre la proportion** (chap. 1) : les stoïciens définissent le beau par la symétrie des parties ; mais la lumière, l'or, l'éclair sont beaux sans avoir de parties.
          - **La Forme et l'âme** (chap. 2-3) : est beau ce qui participe d'une **Forme** (`eîdos`), qui rassemble le multiple en une unité. L'âme reconnaît le beau par **ajustement** : elle y retrouve sa parenté avec l'intelligible.
          - **La beauté vient de l'intérieur** (chap. 3) : le projet de l'architecte fait la beauté de la maison, comme la Forme celle de la Nature.
          - **La vertu est une purification** (chap. 5-6) : l'âme se détourne du corps et redevient « Forme et raison ». L'esthétique est dépassée par l'éthique : la beauté sensible n'est qu'un tremplin, qui rappelle à l'âme sa patrie ; s'y arrêter, c'est s'égarer.
          - **La fuite vers là-bas** (chap. 8-9) : Narcisse se perd dans son reflet, Ulysse fuit Circé, et l'âme se sculpte comme une statue en retranchant ce qui est matériel ; il faut voir avec « l'œil de l'âme », et découvrir que le bien est au-delà du beau.

          Le traité décrit un « itinéraire » de l'âme vers le divin, que les traités suivants ne cesseront de reprendre.
      - id: t-1-7
        title: "Sur le souverain bien et les autres biens"
        ennead: 1
        numberInEnnead: 7
        chrono: 54
        highlight: true
      - id: t-1-8
        title: "Quels sont les maux ?"
        ennead: 1
        numberInEnnead: 8
        chrono: 51
        highlight: true
      - id: t-1-9
        title: "Sur le suicide raisonnable"
        ennead: 1
        numberInEnnead: 9
        chrono: 16
        unit: traite16
        theses:
          - "Contre les stoïciens, qui admettent la « sortie raisonnable », Plotin suit le Phédon : on ne doit pas se donner la mort, sauf nécessité."
          - "L'âme doit attendre que son lien avec le corps (une « harmonie ») se défasse de lui-même, sinon elle part en emportant quelque chose avec elle."
          - "Notre sort dans l'au-delà dépend de l'état de notre âme à la mort, donc il faut progresser tant qu'on le peut."
        summary: |-
          **Le minuscule traité 16 (un chapitre) répond que le suicide n'est jamais « raisonnable » (`eúlogos`), sauf s'il est « vraiment nécessaire ».** C'est une exhortation, dans le ton de la prédication morale de l'époque, pour prévenir le suicide.

          - **Contre les stoïciens** : ils admettaient le suicide dans des cas extrêmes, comme la folie ; Plotin suit le *Phédon* (61c-62c), qui tient la mort volontaire pour toujours « déraisonnable » (`álogon`).
          - **La séparation naturelle** (1, 1-7) : l'âme doit attendre que l'**harmonie** qui la lie au corps s'épuise, sinon elle part en amenant quelque chose.
          - **La passion** (1, 7-14) : le suicide est un acte d'angoisse, de douleur ou de colère.
          - **Le destin et le progrès** (1, 15-19) : le temps de chacun est fixé par le destin ; et le rang de l'âme après la mort dépend de son état au moment de sortir du corps : il faut **progresser** tant qu'on le peut.
          - **Une réserve** : le cas « vraiment nécessaire » n'est jamais précisé, même dans le traité 46 (I, 4) : peut-être une marge de doute plutôt qu'une exception.

          La première phrase, « Tu n'expulseras pas ton âme du corps », serait le seul emprunt identifiable de Plotin aux *Oracles chaldaïques*.
      - id: t-2-1
        title: "Sur le monde"
        ennead: 2
        numberInEnnead: 1
        chrono: 40
        unit: traite40
        theses:
          - "Le monde et le ciel ne durent pas seulement parce qu'un dieu le veut : leur âme et leur corps les rendent immortels."
          - "Le corps du monde s'écoule sans rien perdre au-dehors, si bien que le monde ne vieillit pas et que les astres restent les mêmes."
          - "Le ciel n'est fait que d'un feu pur (une lumière), si bien que rien ne s'en écoule et qu'il n'a pas besoin de nourriture."
        summary: |-
          **Le traité 40 explique pourquoi le monde et le ciel sont immortels, non seulement par l'espèce, mais en restant eux-mêmes : leur corps ne s'écoule pas au-dehors, et l'âme du monde, toute proche de l'intelligible, les retient sans peine.** Ni l'éther d'Aristote ni la « volonté du dieu » du *Timée* ne suffisent.

          - **La difficulté** (chap. 1-2) : la volonté du dieu n'explique rien ; que le monde contienne tout ne garantit pas la permanence de ses parties, les astres ; Platon et Héraclite font s'écouler tout corps.
          - **L'âme et le corps** (chap. 3-5) : le corps du monde s'écoule en lui-même et ne vieillit pas ; le feu, arrivé là-haut, est retenu par l'âme. L'âme du monde, plus forte que tout lien, gouverne sans fatigue ; les vivants d'ici sont faits par une image affaiblie d'elle, qui ne sait pas les retenir.
          - **Le corps du ciel** (chap. 6-8) : contre le *Timée*, les astres ne sont pas faits des quatre éléments, mais d'un feu pur qui est lumière ; Plotin réinterprète ensuite Platon en ce sens. Rien ne s'en écoule, et le ciel n'a pas besoin de nourriture.

          Paradoxe : le feu céleste de Plotin est si distinct des éléments d'ici qu'il ressemble au cinquième élément qu'il refuse.
      - id: t-2-2
        title: "Sur le mouvement circulaire"
        ennead: 2
        numberInEnnead: 2
        chrono: 14
        unit: traite14
        theses:
          - "C'est l'âme qui fait tourner le ciel, et le ciel se meut en cercle parce qu'il imite l'Intellect."
          - "L'Intellect et l'Âme tournent autour de l'Un, qu'ils désirent sans jamais le rejoindre."
          - "L'âme ne se déplace pas dans l'espace et pourtant elle déplace le corps, comme la nôtre déplace notre corps."
        summary: |-
          **Le traité 14 explique pourquoi le ciel se meut en cercle : c'est l'âme qui le fait tourner, parce que le ciel « imite l'Intellect ».**

          - **La question** (chap. 1, 1-19) : Plotin reprend Platon (*Lois*, X ; *Timée*), mais répond à Aristote (*De l'âme*, I, 3) : d'où vient le mouvement circulaire de l'âme, et comment meut-elle un corps ?
          - **Le feu** (chap. 1, 19-51) : il va par nature en ligne droite, mais tourne en cercle parce que l'âme du monde, partout, l'entraîne vers elle.
          - **Les deux centres** (chap. 2) : l'âme a un centre **intelligible**, le corps un centre **local**. Notre âme meut notre corps sans se mouvoir dans le lieu : **microcosme et macrocosme**.
          - **L'âme poursuit le Bien** (chap. 3) : l'Intellect et l'Âme sont comme des cercles qui désirent s'unir à l'Un sans jamais le rejoindre, et tournent donc autour de lui.

          « L'univers se meut donc lui aussi en cercle et reste en même temps immobile », comme l'Intellect. Le traité 40 (II, 1), *Sur le ciel*, reprendra la question du feu céleste.
      - id: t-2-3
        title: "Si les astres agissent"
        ennead: 2
        numberInEnnead: 3
        chrono: 52
      - id: t-2-4
        title: "Sur les deux matières"
        ennead: 2
        numberInEnnead: 4
        chrono: 12
        highlight: true
        priority: 6
        unit: traite12
        theses:
          - "Il y a deux matières, l'une sensible (perçue par les sens), l'autre intelligible (saisie par la pensée), et aucune n'est un corps."
          - "La matière intelligible existe, car la multiplicité des Formes demande un fond commun, et c'est un être véritable."
          - "La matière sensible n'a rien en propre, pas même une taille : elle se confond avec le manque et l'illimité, et elle est le mal."
        summary: |-
          **Le traité 12 soutient qu'il y a deux matières, toutes deux incorporelles : une matière intelligible, substrat des Formes, et une matière sensible, privation, illimité et mal.**

          - **La position de Platon** (chap. 1) : contre les stoïciens (une matière corporelle) et les aristotéliciens (une seule matière), Plotin suit le témoignage d'Aristote sur la **Dyade indéfinie**, matière des Idées.
          - **La matière intelligible** (chap. 2-5) : la multiplicité des Formes exige un substrat commun. Elle est un être véritable, engendré hors du temps : l'état informe de chaque réalité avant sa **conversion** vers son principe.
          - **La matière sensible existe** (chap. 6-10) : elle explique la transformation des éléments. Privée de tout, elle n'a pas même de **grandeur** ; on ne la saisit que par un **raisonnement bâtard**.
          - **Ce qu'elle est** (chap. 11-16) : contre Aristote, la **privation** même ; avec le *Sophiste*, un non-être ; l'**illimité** (`ápeiron`) ; enfin le **mal**.

          La matière d'ici, ornée de formes, n'est qu'**« un cadavre ornementé »** (5, 18). Les traités 25 (II, 5) et 26 (III, 6) reprendront la question.
      - id: t-2-5
        title: "Sur le sens de « en puissance » et « en acte »"
        ennead: 2
        numberInEnnead: 5
        chrono: 25
        unit: traite25
        theses:
          - "Ce qui est en puissance (possible) ne devient pas lui-même en acte (réel) : l'airain reste airain, et c'est la statue qui est en acte."
          - "Dans le monde intelligible, rien n'est seulement possible : tout y est forme, déjà pleinement réel."
          - "La matière peut devenir tous les êtres (en puissance), mais n'en est aucun (en acte) : un « mensonge véritable », un non-être."
        summary: |-
          **Le traité 25 fixe le sens d'« en puissance » et d'« en acte », hérités d'Aristote : ce qui est en puissance ne devient jamais lui-même en acte, et la matière, tous les êtres en puissance, n'est rien en acte.**

          - **L'être en puissance** (chap. 1) : un substrat passif, qui a besoin d'autre chose pour passer à l'acte, comme l'airain, statue en puissance. Il n'est pas une puissance : la puissance est active, comme le courage.
          - **L'être en acte, c'est le composé** (chap. 2) : l'airain reste airain, c'est la statue qui vient à l'être ; l'acte est la forme de ce composé.
          - **Les intelligibles** (chap. 3) : là-bas, rien n'est en puissance ; tout est forme, même la matière intelligible, et chaque réalité est à la fois en acte et acte.
          - **La matière** (chap. 4-5) : n'étant aucun des êtres, elle est un non-être, « un mensonge véritable » ; elle ne passera jamais à l'acte, et c'est pourquoi elle est indestructible.

          Contre Aristote, pour qui la matière tend vers la forme, Plotin maintient un écart infranchissable entre elles. Le traité 26 (III, 6), chap. 7, y reviendra.
      - id: t-2-6
        title: "Sur la réalité ou sur la qualité"
        ennead: 2
        numberInEnnead: 6
        chrono: 17
        unit: traite17
        theses:
          - "Contre Aristote, ce qui définit une chose relève de sa réalité (ce qu'elle est) et non de la qualité, qui reste accidentelle."
          - "La blancheur de la neige, contrairement à celle d'un homme pâle, n'est pas un accident : elle vient de la nature même de la neige."
          - "Le monde sensible n'est qu'une « réalité qualifiée », simple image de la réalité intelligible, la seule vraiment réelle."
        summary: |-
          **Le traité 17 refuse de ranger parmi ses qualités ce qui définit une chose : cela relève de sa réalité (ce qu'elle est), alors que la qualité n'est qu'accidentelle. Entre les deux se tient le « complément de la réalité » : une propriété essentielle, comme la blancheur de la neige, qui vient de la nature même de la chose.**

          - **Contre Aristote** (chap. 1, 8-29) : la *Métaphysique* (Δ, 14) fait de la différence une qualité au sens propre ; c'est confondre l'ordre de la réalité (`ousía`) et celui de l'accident.
          - **Le complément de la réalité** (chap. 1, 30-40) : la blancheur de la neige ou la chaleur du feu font partie de ce qu'ils sont ; la blancheur d'une table n'est qu'une qualité.
          - **Trois niveaux** (chap. 1, 41-56) : l'acte de la réalité là-bas, la Forme du feu ; le complément de la réalité, sensible mais lié à la raison (`lógos`) qui produit la chose ; la qualité, purement accidentelle.
          - **La réalité d'ici n'est qu'une image** (chap. 2-3) : la réalité sensible n'est qu'une « réalité qualifiée » ; seule la réalité de là-bas est « réellement réalité ».

          Le traité est un **dialogue** avec un interlocuteur péripatéticien, qui avance par objections : d'où son obscurité réputée, et l'équivocité des mots « forme », « acte » et « réalité », pris tantôt au sens d'Aristote, tantôt à celui de Platon.
      - id: t-2-7
        title: "Sur le mélange total"
        ennead: 2
        numberInEnnead: 7
        chrono: 37
        unit: traite37
        theses:
          - "Contre les péripatéticiens (aristotéliciens), certains mélanges sont totaux : l'eau traverse le papyrus de part en part."
          - "Ni la matière ni les qualités n'empêchent le mélange : seules certaines qualités, comme la densité, le bloquent."
          - "La corporéité (le fait d'être un corps) n'est pas un composé, mais une forme, une « raison » qui produit le corps en venant dans la matière."
        summary: |-
          **Le traité 37 prend position entre stoïciens et péripatéticiens : le mélange total existe dans certains cas, car la matière et les qualités, incorporelles, ne refusent pas de se mélanger ; seules certaines qualités, comme la densité, l'empêchent.** Il s'achève sur une définition de la corporéité.

          - **Le débat** (chap. 1) : les stoïciens admettent qu'un corps pénètre tout entier un autre, même plus grand ; les péripatéticiens leur opposent trois objections : les corps se diviseraient et périraient, le mélange occupe souvent plus d'espace, un petit corps ne peut pénétrer tout un grand.
          - **La solution** (chap. 2) : l'eau traverse tout entier le papyrus, et la matière de l'une et l'autre masse subsiste. Matière et qualités étant incorporelles, ce qui empêche le mélange tient à certaines qualités, comme la densité.
          - **La corporéité** (chap. 3) : non un composé, mais une forme, une raison qui, venue dans la matière, produit le corps ; la raison séparée de la matière est dans l'Intellect.

          Plotin y prolonge ses objections du traité 2 contre les stoïciens, et sa doctrine de la matière du traité 12.
      - id: t-2-8
        title: "Comment se fait-il que les objets vus de loin paraissent petits ?"
        ennead: 2
        numberInEnnead: 8
        chrono: 35
        unit: traite35
        theses:
          - "On voit d'abord des couleurs, la taille seulement à leur suite : de loin, la couleur s'estompe, et les objets paraissent plus petits, la distance plus courte."
          - "Pour juger la taille d'un ensemble, la vue en additionne les détails : de loin, ils s'effacent, la vue glisse sur une masse et la voit plus petite."
          - "L'angle sous lequel on voit un objet n'explique pas sa petitesse apparente : le ciel remplit toute la vue et paraît pourtant bien plus petit qu'il n'est."
        summary: |-
          **De loin, les objets paraissent plus petits parce que la vue mesure une taille en additionnant des détails : la distance affaiblit ce que l'œil reçoit, les détails s'effacent, et la vue, sans repères où s'arrêter, glisse sur l'ensemble et le contracte.** La distance elle-même paraît plus courte pour la même raison. C'est, avec le début du traité 29, le seul texte de Plotin sur l'optique.

          - **Un problème pour Plotin** : voir n'est pas recevoir une petite image gravée dans l'œil, mais un acte de l'âme ; or la grandeur est une Forme intelligible. Comment la seule distance pourrait-elle la rapetisser ?
          - **Quatre explications possibles** (1, 1-17) : la lumière se resserrerait à la mesure de la pupille ; seule la forme de l'objet arriverait à l'œil ; il faudrait examiner l'objet de près, partie par partie ; la taille ne serait vue que par accident, la couleur étant l'objet premier de la vue. Plotin retient la dernière, tirée du *De l'âme* d'Aristote.
          - **La taille suit la couleur** (1, 12-17 et 29-34) : la vue perçoit d'abord des couleurs et n'évalue la taille qu'à partir d'elles. De loin, la couleur s'affaiblit (c'est le flou, qui touche la qualité) et la taille se contracte avec elle (c'est la réduction, qui touche la quantité).
          - **La comparaison avec le son** (1, 17-28) : en s'éloignant, un son ne devient pas plus petit, mais plus faible et plus confus ; il ne devient jamais plus fort. De même, la couleur s'affaiblit, et la taille avec elle : jamais d'agrandissement.
          - **Mesurer partie par partie** (1, 33-47) : de près, la vue s'arrête sur chaque maison et chaque arbre d'une montagne, ce qui lui donne des unités de compte et « déplie » sa grandeur. De loin, ces détails s'effacent ; sans relief où s'arrêter, la vue traverse l'ensemble d'un seul glissement et lui attribue une taille réduite.
          - **La distance aussi** (1, 48-51) : l'intervalle paraît plus court pour la même raison, car on ne distingue plus les parties de l'air qui nous sépare de l'objet.
          - **Contre l'angle visuel** (2, 1-18) : on explique parfois la petitesse par l'angle sous lequel l'objet est vu. Mais le ciel remplit toute la vue et paraît pourtant bien plus petit qu'il n'est : l'angle ne suffit pas.
          - **Pourquoi la distance affaiblit-elle la vue ?** Le traité le constate sans l'expliquer. D'après d'autres traités de Plotin, ce que les choses émettent n'est que la trace de leur activité interne, et ce rayonnement s'épuise en traversant l'espace et la matière, qui le dispersent (comme la chaleur loin du feu).

          Plotin y reste fidèle à Aristote : c'est par la couleur que la vue atteint d'abord son objet.
      - id: t-2-9
        title: "Contre les gnostiques"
        ennead: 2
        numberInEnnead: 9
        chrono: 33
        highlight: true
        unit: traite33
        theses:
          - "Il n'y a que trois réalités premières, l'Un, l'Intellect et l'Âme, et les gnostiques ont tort d'en ajouter d'autres."
          - "Le monde n'est pas né d'une chute ou d'une faute de l'âme, comme le prétend le mythe gnostique de Sagesse (Sophia)."
          - "Mépriser le monde et ses astres ne rend pas meilleur, et dire « regarde vers dieu » n'est qu'un mot sans la vertu."
        summary: |-
          **Le traité 33 est un plaidoyer pour la culture grecque et pour le vrai platonisme contre les gnostiques, qui fréquentaient l'école de Plotin : il n'y a que trois réalités ; le monde n'est pas né d'une chute de l'âme ; et mépriser le monde, les astres et la vertu ne rend pas meilleur.**

          - **Trois réalités, pas davantage** (chap. 1-3) : le Bien, l'Intellect, l'Âme ; inutile de multiplier les intellects. L'âme du monde gouverne sans réflexion, en restant là-haut, et toutes choses en sont toujours engendrées.
          - **Contre la production du monde par une chute** (chap. 4-9) : ce n'est pas l'inclinaison de l'âme qui produit, mais son absence d'inclinaison. Le monde est la plus belle image possible de l'intelligible ; les astres sont des dieux ; les gnostiques, arrogants, se croient supérieurs à tout.
          - **Le mythe de Sagesse** (chap. 10-14) : la descente de Sagesse et la naissance d'un démiurge, image d'une image, sont absurdes ; leurs incantations rabaissent les réalités divines, et les maladies ne viennent pas de démons.
          - **La vertu et la beauté** (chap. 15-18) : ils n'ont rien écrit sur la vertu, et sans elle « dieu » n'est qu'un mot ; qui aime le père aime aussi les enfants ; il faut habiter son corps comme une belle maison, en attendant de la quitter.

          Jamais Plotin n'est aussi virulent. Porphyre fit de ce traité le dernier de la deuxième Ennéade ; il clôt les traités 30 à 33, écrits ensemble.
      - id: t-3-1
        title: "Sur le destin"
        ennead: 3
        numberInEnnead: 1
        chrono: 3
        unit: traite3
        theses:
          - "Contre les épicuriens, le simple hasard des atomes ne peut produire un monde aussi beau, donc une providence le gouverne."
          - "Contre les stoïciens, tout n'est pas destin, car l'âme est une cause et l'homme est responsable de ses actes."
          - "Les astres ne causent pas nos actes : ils donnent seulement des signes de l'avenir."
        summary: |-
          **Le traité 3 refuse à la fois le hasard des épicuriens et la nécessité universelle des stoïciens : une providence gouverne le monde, mais l'âme est une cause, et l'homme reste responsable de ses actes.**

          - **Causes prochaines et causes lointaines** (chap. 1) : tout ce qui devient a une cause ; la question porte sur les causes lointaines.
          - **Cinq opinions réfutées** (chap. 2-7) : les atomes, les éléments, l'âme du monde qui ferait tout, les astres des astrologues, l'enchaînement stoïcien des causes. Toutes abolissent notre autonomie. Les astres, eux, donnent seulement des « signes » de l'avenir (chap. 5-6).
          - **L'âme, cause lointaine** (chap. 8) : séparée du corps, l'âme est libre ; dans un corps, sa liberté varie avec sa bonté.
          - **L'action volontaire** (chap. 9-10) : il y a deux espèces de causes, l'âme et les causes extérieures. Le voleur et l'assassin sont donc responsables : la providence fixe le cadre du devenir sans agir dans chaque acte.

          Plotin s'inscrit dans la tradition des traités *Du destin* de Cicéron, du pseudo-Plutarque et d'Alexandre d'Aphrodise ; les traités 47 et 48 (III, 2-3), *Sur la providence*, reprendront la question.
      - id: t-3-2
        title: "Sur la providence I"
        ennead: 3
        numberInEnnead: 2
        chrono: 47
        unit: traite47
        theses:
          - "La providence veille sur l'univers en le faisant exister à l'image de l'Intellect, dont il naît sans calcul."
          - "On ne doit pas blâmer l'univers à cause de ses parties, car inégalités et maux contribuent à la beauté de l'ensemble."
          - "Les âmes sont comme des acteurs : la raison distribue les rôles, mais chacune répond de son jeu, bon ou mauvais."
        summary: |-
          **Les traités 47 et 48, qui n'en faisaient qu'un, défendent la providence contre les épicuriens, qui la nient, et contre les péripatéticiens et les gnostiques, qui la limitent : la providence veille sur l'univers en le faisant exister à l'image de l'Intellect, dont il naît sans calcul.** Le traité 47 en est la première partie.

          - **Le monde, image de l'Intellect** (chap. 1-3) : du monde véritable, un et sans parties, s'écoule une raison qui produit un univers divisé, où la guerre s'ajoute à l'amitié, mais qu'une seule harmonie gouverne. Le monde lui-même le dit : il est beau et se suffit à lui-même.
          - **Les maux et la justice** (chap. 4-10) : les maux ont une fonction, et le mal est un défaut de bien ; les âmes sont responsables de leurs fautes ; l'homme est à un rang intermédiaire, et le dieu ne combat pas à la place de ceux qui refusent le combat.
          - **La raison et ses contraires** (chap. 11-16) : la raison n'a pas mis de belles couleurs partout, comme un peintre ; la justice règne à travers le cycle des vies ; la guerre des vivants n'est qu'un jeu de théâtre ; la raison, moins une que l'Intellect, produit des contraires, comme une harmonie de sons opposés.
          - **Le drame de l'univers** (chap. 17-18) : les âmes sont des acteurs, qui reçoivent leur rôle de l'auteur mais jouent bien ou mal d'elles-mêmes.

          Plotin y unit le livre X des *Lois* et les arguments des stoïciens.
      - id: t-3-3
        title: "Sur la providence II"
        ennead: 3
        numberInEnnead: 3
        chrono: 48
        unit: traite48
        theses:
          - "Il n'y a qu'une providence : pure dans l'intelligible, elle devient destin ici-bas, et elle redresse nos fautes."
          - "L'homme est libre en son principe, donc ses mauvaises actions sont les siennes et non celles de la providence."
          - "Le devin lit la nature comme une écriture, par analogie et sans savoir pourquoi, et seul un dieu discerne la providence."
        summary: |-
          **Le traité 48, seconde partie de l'unique traité sur la providence, montre que tout appartient à un seul ordre universel, où l'homme garde un principe de liberté : la providence, pure là-haut, est destin ici-bas, et les maux viennent de nous.**

          - **Un seul ordre** (chap. 1-3) : la raison totale accompagne les bonnes et les mauvaises actions ; l'univers est un animal un et multiple, gouverné comme une armée par un général qui commanderait aussi l'ennemi. Les choses naissent inégales parce qu'elles s'éloignent du principe.
          - **L'homme et la providence** (chap. 4-5) : l'homme a un principe libre, qui n'agit pas en tous ; ses vies antérieures expliquent ce qu'il est. Il n'y a qu'une providence, destin en bas ; nos fautes sont les nôtres, et la providence les redresse comme on suture une plaie.
          - **Devins et racine** (chap. 6-7) : le devin lit les lettres de la nature par analogie, sans savoir pourquoi ; seul un dieu discerne la providence. Abolir le pire, ce serait abolir la providence : tout sort d'une même racine.

          Le traité s'achève sur l'image de l'arbre, dont toutes les parties vivent de la même racine.
      - id: t-3-4
        title: "Sur le démon qui nous a reçus en partage"
        ennead: 3
        numberInEnnead: 4
        chrono: 15
        unit: traite15
        theses:
          - "Le démon (esprit gardien) n'est pas une divinité intermédiaire : c'est ce qui se tient au-dessus de la partie de l'âme qui agit en nous."
          - "L'âme est responsable de son destin, car selon la vie que nous choisissons, nous choisissons notre démon."
          - "Le démon du sage est un dieu, car en lui c'est l'intellect qui agit."
        summary: |-
          **Le traité 15 réduit le démon à une part de l'âme : notre démon est ce qui se tient au-dessus de la partie de l'âme qui est active en nous, si bien que l'âme est responsable de son destin.**

          - **L'âme et ses puissances** (chap. 1) : suite du traité 11 (V, 2), le traité est d'abord une étude de l'âme. La nature y engendre une **« indétermination totale »**, texte décisif pour la génération de la matière.
          - **Les réincarnations** (chap. 2) : quand elle quitte le corps, l'âme devient la partie d'elle-même qu'elle a le plus développée.
          - **Une démonologie réduite** (chap. 3) : le démon n'est pas une divinité intermédiaire, comme chez Hésiode ; c'est la partie de l'âme au-dessus de celle qui agit (3, 4-8). Proclus le lui reprochera.
          - **Choisir son démon** (chap. 4-5) : choisir sa vie, c'est choisir son démon, comme dans le mythe d'Er. L'âme du monde, elle, gouverne son corps sans y descendre.
          - **Le démon du sage est un dieu** (chap. 6) : en lui, c'est l'intellect qui agit ; son démon est donc ce qui est au-dessus de l'intellect, l'Un.

          Le traité rend douteux le récit de Porphyre sur la séance de l'**Iseion**, où le démon de Plotin serait apparu.
      - id: t-3-5
        title: "Sur l'amour"
        ennead: 3
        numberInEnnead: 5
        chrono: 50
        highlight: true
        unit: traite50
        theses:
          - "L'amour naît de la parenté entre l'âme et la beauté : il peut être pur, mêlé au désir du corps mais mesuré, ou dévoyé, contre nature."
          - "Il y a deux Aphrodite : l'âme divine engendre Éros dieu, qui regarde vers l'Intellect, et l'âme du monde engendre Éros démon."
          - "Éros, fils de Poros (la ressource) et de Pénia (la pauvreté), est une « raison » (un principe formateur) mêlée d'indétermination : toujours en manque, il n'est jamais comblé."
        summary: |-
          **Le traité 50 demande si l'amour est un dieu, un démon ou une passion de l'âme, et répond en interprétant les mythes de Platon : passion née de la parenté de l'âme avec le beau, l'amour est aussi un dieu, regard de l'âme divine vers l'Intellect, et un démon, fils de Poros et de Pénia.**

          - **La passion** (chap. 1) : l'amour naît de la parenté de l'âme avec la beauté ; certains n'aiment que la beauté, d'autres veulent engendrer dans le beau ; seul est réprouvé l'amour qui va contre la nature.
          - **Le dieu** (chap. 2-4) : Aphrodite est double. La céleste, l'âme divine née de Kronos, l'Intellect, engendre un Éros dieu, qui est vision (`hórasis`) et comme l'œil de l'amant ; l'âme du monde engendre un Éros intérieur au monde, et chaque âme a le sien, son démon.
          - **Le démon** (chap. 5-9) : l'Éros du *Banquet* n'est pas le monde sensible. Fils de Poros, la raison, et de Pénia, l'indétermination, il est une raison mêlée et ne peut jamais être comblé. Zeus est l'Intellect, son jardin la splendeur des raisons ; les mythes morcellent dans le temps ce qui est ensemble.

          Écrit en 269, dans la solitude de la Campanie, il précède les traités 51 et 52, sur les maux et sur les astres.
      - id: t-3-6
        title: "Sur l'impassibilité des incorporels"
        ennead: 3
        numberInEnnead: 6
        chrono: 26
        unit: traite26
        theses:
          - "Les sensations et les passions ne sont pas des changements subis par l'âme mais des activités, et l'âme reste donc inaltérable."
          - "Purifier l'âme, ce n'est pas la laver d'une souillure, mais la détourner des images, comme on réveille un rêveur."
          - "La matière, vrai non-être, n'est affectée par rien : les formes s'y reflètent comme dans un miroir, sans la modifier."
        summary: |-
          **Le traité 26 montre que ce qui paraît pâtir ne pâtit pas : ni l'âme ni la matière, toutes deux incorporelles, ne sont affectées, l'une par perfection, l'autre par impuissance.** Il rectifie deux erreurs nées de nos « habitudes de langage » : parler de « passions de l'âme », et croire avec les péripatéticiens la matière « affectée » par les formes.

          - **Les sensations et les passions sont des activités** (chap. 1-3) : le vice est un manque d'harmonie ; la peur naît dans l'âme, mais la pâleur dans le corps.
          - **La faculté passive** (chap. 4-5) : elle est comme l'harmonie d'une lyre, dont seules les cordes sont mues. La purification détourne l'âme des images, comme on réveille un rêveur.
          - **L'être n'est pas un corps** (chap. 6) : la résistance des corps est signe de faiblesse ; être dans le corps, pour l'âme, c'est dormir.
          - **La matière, non-être véritable** (chap. 7-10) : elle ment dans tout ce qu'elle annonce ; les formes s'y montrent comme dans un miroir, sans l'affecter.
          - **Participer sans participer** (chap. 11-18) : la matière reçoit les formes comme Pénia reçoit Poros, sans rien en garder ; elle porte la grandeur comme un vêtement.
          - **Plus réceptacle que mère** (chap. 19) : la matière est stérile, seule la forme engendre.

          C'est le plus long exposé de Plotin sur la nature paradoxale de la matière, après les traités 12 (II, 4) et 25 (II, 5).
      - id: t-3-7
        title: "Sur l'éternité et le temps"
        ennead: 3
        numberInEnnead: 7
        chrono: 45
        highlight: true
        unit: traite45
        theses:
          - "L'éternité est la vie de l'être, tout entière d'un seul coup et sans étendue : l'être complet n'a ni passé ni avenir."
          - "Le temps n'est ni le mouvement, ni sa durée, ni sa mesure, car ces définitions n'en disent qu'un accident."
          - "Le temps est la vie de l'âme, qui passe d'un état à un autre, et il naît quand elle s'éloigne de l'éternité."
        summary: |-
          **Le traité 45 définit l'éternité comme la vie de l'être, tout entière ensemble et sans extension, puis le temps comme la vie de l'âme descendue, qui passe d'un état à un autre.** Il commente ainsi le temps « image de l'éternité » du *Timée*.

          - **L'éternité** (chap. 1-6) : ni le monde intelligible lui-même, ni le repos, elle est la puissance une de l'intelligible, « une vie qui demeure dans l'identité » ; l'être véritable, complet, n'a ni passé ni avenir. Elle est « une vie d'emblée illimitée », tournée vers l'Un.
          - **Les définitions manquées** (chap. 7-10) : le temps n'est ni le mouvement, ni le ciel qui se meut, ni l'intervalle du mouvement des stoïciens, ni la mesure du mouvement d'Aristote, ni l'accompagnement d'Épicure : toutes prennent un accident pour l'essence.
          - **Le temps, vie de l'âme** (chap. 11-13) : une puissance de l'âme, affairée, voulant plus que le présent, s'est temporalisée en produisant le monde. La révolution du ciel ne fait que manifester et mesurer le temps ; si l'âme revenait à l'unité, le temps cesserait.

          Plotin y rompt avec ses prédécesseurs en rapportant le temps à l'âme, et non au mouvement des corps.
      - id: t-3-8
        title: "Sur la contemplation"
        ennead: 3
        numberInEnnead: 8
        chrono: 30
        highlight: true
        unit: traite30
        theses:
          - "Tout contemple, même la nature des plantes : la contemplation est l'activité commune de tous les êtres et leur but."
          - "Produire et agir sont une contemplation affaiblie : on agit pour voir ce que la pensée seule ne parvient pas à voir."
          - "La nature produit en silence parce qu'elle contemple : ce qui naît est le résultat de ce qu'elle voit."
        summary: |-
          **Le traité 30 démontre une thèse simple et provocante : tout contemple, des plantes jusqu'à l'Intellect, et toute production, toute action, est une contemplation affaiblie.** C'est une sorte d'introduction à la philosophie de Plotin : la contemplation explique à la fois la procession des réalités et leur retour vers leur principe.

          - **La thèse, en jouant** (chap. 1, 1-18) : toutes choses aspirent à la contemplation, même la nature qui est dans les plantes.
          - **La nature contemple** (chap. 1, 18 à 4) : elle produit sans mains ni leviers, parce qu'elle est une raison immobile ; dans une prosopopée, elle dit qu'elle produit en silence, comme les géomètres tracent des figures en contemplant.
          - **L'âme contemple** (chap. 5-7) : agir, c'est atteindre la contemplation par un détour ; les hommes trop faibles pour contempler agissent pour voir.
          - **L'Intellect contemple l'Un** (chap. 8-11) : en lui, « être et penser, c'est la même chose » ; l'Un est la puissance de toutes choses, comme une source qui se donne à tous les fleuves sans s'épuiser.

          Émile Bréhier y voyait l'œuvre la plus achevée de Plotin. Avec les traités 31 à 33, il forme un ensemble écrit à la maturité de sa philosophie.
      - id: t-3-9
        title: "Considérations diverses"
        ennead: 3
        numberInEnnead: 9
        chrono: 13
        unit: traite13
        theses:
          - "Le Vivant intelligible du Timée (le modèle du monde) est l'Intellect au repos, et l'âme le divise en pensant pas à pas."
          - "Avant de se tourner vers l'Intellect, l'âme est indéterminée : par rapport à lui, elle est comme une matière."
          - "L'Un est partout et nulle part : partout, car il produit tout ; nulle part, car il n'est rien de ce qu'il produit."
        summary: |-
          **Le traité 13 n'a pas de thèse unique : c'est un collage de neuf paragraphes, que Porphyre a réunis à la fin de la troisième Ennéade, et qui précisent des difficultés des douze premiers traités.**

          - **Le vivant intelligible** du *Timée* (chap. 1) : le Vivant intelligible (le modèle du monde) n'est pas séparé de l'Intellect, c'est l'Intellect en repos ; la division, œuvre de la pensée discursive, revient à l'âme.
          - **L'indétermination de l'âme** (chap. 3 et 5) : indéterminée (`aóristos`) avant de voir l'Intellect, l'âme est comme la vue, et comme une matière pour lui.
          - **L'Un partout et nulle part** (chap. 4) : partout, il produit tout ; nulle part, il n'est rien de ce qu'il produit.
          - **L'acte et la puissance** (chap. 8) : l'Intellect est ce qui est toujours en acte.
          - **Le Premier ne pense pas** (chap. 9) : au-delà de ce qui est, il n'a ni pensée, ni conscience de lui-même, ni vie, qui sont les traits de l'Intellect.

          Le seul fil commun est peut-être l'acte intellectif ; peut-être Porphyre n'a-t-il voulu que compléter sa neuvaine.
      - id: t-4-1
        title: "Comment l'on dit que l'âme est intermédiaire entre la réalité indivisible et la réalité divisible (Sur la réalité de l'âme II)"
        ennead: 4
        numberInEnnead: 1
        chrono: 21
        unit: traite21
        theses:
          - "L'âme n'est « divisible dans les corps » que parce qu'elle vient dans des corps ; dans le monde intelligible, elle est indivise."
          - "Une part de l'âme reste attachée au monde intelligible, comme un rayon reste lié au centre dont il dérive."
          - "Même quand l'âme se divise, c'est sans se morceler : elle se donne tout entière à tout le corps."
        summary: |-
          **L'unique chapitre du traité 21 ajoute une ultime précision à l'indivisibilité de l'âme : même la part divisée de l'âme n'est « divisible que de façon indivisible ».**

          - **Les âmes là-bas et ici** (l. 1-11) : là-bas, l'Intellect est « tout entier ensemble » et les âmes sans corps sont indivises ; se diviser, pour l'âme, c'est venir dans des corps. D'où la formule du *Timée* (35a) : **« divisible dans les corps »**.
          - **Ce qui reste là-haut** (l. 12-17) : l'âme ne s'est pas éloignée tout entière ; quelque chose d'elle reste attaché là-haut, **comme un rayon dérive du centre**.
          - **Divisée de façon indivisible** (l. 17-22) : même ici-bas, elle se donne **tout entière au corps tout entier** ; seule la réception de ses soins par les corps se divise.

          Bribe d'un texte plus long, qui rassemblait sans doute les traités 2, 4 et 21, ce chapitre a changé de place selon les éditions : Porphyre en fit le deuxième traité de la quatrième Ennéade, Ficin le premier.
      - id: t-4-2
        title: "Sur la réalité de l'âme I"
        ennead: 4
        numberInEnnead: 2
        chrono: 4
        unit: traite4
        theses:
          - "Selon le Timée, l'âme est à la fois indivisible, car sans étendue, et divisible, car elle agit dans des corps distincts."
          - "Selon le Parménide, l'âme est une et multiple : ni absolument divisible, ni absolument indivisible."
          - "Les réalités se distinguent par leur degré d'unité : le principe intelligible est purement un, l'âme est une et multiple, les corps sont purement multiples."
        summary: |-
          **Le traité 4, suite du traité 2 (IV, 7), définit l'âme comme une réalité intelligible mais intermédiaire, à la fois indivisible et divisible.**

          - **Le mélange** du *Timée* (chap. 1, 29-41) : l'âme est engendrée d'un mélange entre la réalité indivisible, toujours la même, et la réalité divisible qui devient dans les corps (35a).
          - **Indivisible et divisible** (chap. 1, 41-76) : indivisible, car elle n'est pas une quantité étendue ; divisible, car elle exerce son activité dans des corps distincts.
          - **Une et multiple** (chap. 2) : avec le *Parménide* (155e), l'âme n'est ni absolument divisible, ni absolument indivisible.
          - **Les degrés d'unité** (chap. 2, 39-49) : au sommet, le principe un d'où vient l'âme (ici l'Intellect, purement indivisible) ; puis l'âme, une par son essence mais divisée en se distribuant dans les corps qu'elle anime ; puis ses produits, les corps, purement multiples. Ce double critère, divisibilité et multiplicité, hiérarchise tous les niveaux de réalité.

          Le traité 21 (IV, 1), un unique chapitre isolé par Porphyre, en donne sans doute le dernier mot.
      - id: t-4-3
        title: "Sur les difficultés relatives à l'âme I"
        ennead: 4
        numberInEnnead: 3
        chrono: 27
        unit: traite27
        theses:
          - "Nos âmes ne sont pas des parties de l'âme du monde, mais ses sœurs : toutes viennent d'une même Âme."
          - "L'âme n'est pas dans le corps comme en un lieu, mais comme la lumière dans l'air : c'est le corps qui est en elle."
          - "Contrairement à la sensation, la mémoire n'appartient pas à l'ensemble âme-corps mais à l'âme seule, qui garde ses représentations sans les graver dans le corps."
        summary: |-
          **Le traité 27 ouvre le plus long essai ancien consacré à l'âme (traités 27 à 29) : nos âmes ne sont pas des parties de l'âme du monde, l'âme n'est pas dans le corps comme en un lieu, et la mémoire n'appartient pas à l'ensemble âme-corps, mais à l'âme seule.**

          - **Introduction** (chap. 1, 1-16) : trois raisons d'étudier l'âme : connaître les principes, obéir au « Connais-toi toi-même », connaître le sujet de toute connaissance.
          - **Contre la thèse stoïcienne** (chap. 1, 16 à 8) : nos âmes ne sont pas des parties de l'âme du monde, mais ses sœurs ; toutes viennent d'une même Âme, comme les théorèmes d'une science qui reste entière.
          - **L'entrée de l'âme dans le corps** (chap. 9 à 19) : l'âme du monde produit son corps sans descendre ; les âmes humaines descendent, mais leur tête reste fixée en haut.
          - **Où est l'âme ?** (chap. 20 à 24) : ni dans un lieu, ni dans un vase, ni comme un pilote dans son navire, mais comme la lumière dans l'air ; c'est le corps qui est dans l'âme.
          - **La mémoire** (chap. 25 à 32) : la sensation est l'œuvre commune de l'âme et du corps (le composé), mais la mémoire n'appartient ni à l'Intellect ni au composé : elle est à l'âme seule, qui garde ses représentations sans les graver dans le corps, lequel est plutôt cause d'oubli. L'âme bonne est oublieuse.

          Rédigés entre 263 et 268, pendant le séjour de Porphyre à Rome, les traités 27 à 29 n'en formaient qu'un : Porphyre l'a coupé en trois. La réflexion sur la mémoire se poursuit au traité 28 (IV, 4).
      - id: t-4-4
        title: "Sur les difficultés relatives à l'âme II"
        ennead: 4
        numberInEnnead: 4
        chrono: 28
        unit: traite28
        theses:
          - "Seules les âmes qui changent ont de la mémoire : ni l'âme de là-haut, ni les astres, ni l'âme du monde n'en ont."
          - "Plaisir, douleur, désir et colère naissent dans le corps vivant, et l'âme ne fait que les connaître, sans en être affectée."
          - "Les astres et la magie agissent parce que l'univers est un seul vivant dont les parties sont solidaires (sympathie), et seule la contemplation échappe à la magie."
        summary: |-
          **Le traité 28 poursuit l'enquête sur l'âme : seules les âmes qui changent ont de la mémoire ; les passions naissent dans le corps vivant ; et l'influence des astres, comme la magie, s'explique par la sympathie d'un univers qui est un vivant unique.**

          - **La mémoire dans l'intelligible** (chap. 1-5) : là-bas, l'âme contemple et ne se souvient de rien ; la mémoire commence quand elle s'éloigne, et l'âme « est et devient ce dont elle se souvient ».
          - **Ni les astres, ni Zeus, ni l'âme du monde** (chap. 6-17) n'ont de mémoire : ils ne cessent de voir le dieu et produisent sans calculer, comme la nature, « image de la réflexion ». Nos âmes, divisées entre plusieurs principes, délibèrent.
          - **Les passions** (chap. 18-29) : la douleur est la connaissance d'un corps privé de l'image de l'âme ; le désir et la colère naissent dans le corps vivant. La terre elle-même a une âme et des sensations.
          - **L'influence des astres** (chap. 30-39) : ni causes corporelles, ni choix des dieux, mais la sympathie d'un vivant unique, dont les astres sont comme les membres d'un danseur.
          - **La magie et les prières** (chap. 40-45) agissent par la même sympathie ; le sage n'y est soumis que par son corps, et seule la contemplation y échappe.

          C'est la partie centrale de l'ensemble des traités 27 à 29 ; le traité 29 (IV, 5) examinera l'intermédiaire de la vision.
      - id: t-4-5
        title: "Sur les difficultés relatives à l'âme III, ou Sur la vue"
        ennead: 4
        numberInEnnead: 5
        chrono: 29
        unit: traite29
        theses:
          - "Voir ne demande pas que l'air entre l'œil et l'objet soit modifié : la vue vient de la solidarité (« sympathie ») d'un univers vivant unique."
          - "La lumière n'est ni une qualité ni une modification de l'air, mais l'activité (non corporelle) d'un corps lumineux."
          - "Un œil ne verrait pas un corps situé hors de notre monde, car sans solidarité entre les parties de l'univers (sympathie) il n'y a pas de sensation."
        summary: |-
          **Le traité 29 achève l'enquête sur l'âme par la question de la vue : voir ne suppose pas qu'un intermédiaire soit affecté, car la vision se fait par la sympathie d'un univers vivant unique ; et la lumière est l'activité incorporelle d'un corps lumineux.**

          - **La vue sans intermédiaire affecté** (chap. 1-3) : contre les stoïciens, l'air n'a pas besoin de transmettre une empreinte de proche en proche. Un intermédiaire ne fait qu'affaiblir la sympathie ; la preuve : on voit la nuit le feu des phares, et tout l'objet est vu de partout.
          - **Les autres explications** (chap. 2-4) : les rayons visuels des platoniciens, la tension des stoïciens, les simulacres des épicuriens ; la lumière n'est pas un bâton qui toucherait l'objet.
          - **L'ouïe** (chap. 5) : le son naît du choc des corps, et parvient à la sensation par une communauté semblable.
          - **La lumière** (chap. 6-7) : ni qualité ni affection de l'air, elle est une activité, comme la vie est l'activité de l'âme ; elle ne périt pas, mais accompagne sa source.
          - **Un corps hors du ciel** (chap. 8) ne serait pas vu : sans sympathie, ni sujet sentant, ni objet sensible.

          Ce bref traité clôt les traités 27 à 29, *Sur les difficultés relatives à l'âme*, dont il forme la cinquième section.
      - id: t-4-6
        title: "Sur la sensation et la mémoire"
        ennead: 4
        numberInEnnead: 6
        chrono: 41
        unit: traite41
        theses:
          - "La sensation n'est pas une empreinte dans l'âme : l'âme voit l'objet là où il est, hors d'elle, à distance."
          - "Percevoir, ce n'est pas subir mais agir : l'âme lit les empreintes laissées dans l'air comme des lettres, et en juge."
          - "La mémoire n'est pas la conservation d'empreintes, mais une capacité que l'exercice renforce, comme un muscle."
        summary: |-
          **Le traité 41 refuse de faire de la sensation et du souvenir des empreintes dans l'âme : percevoir est un acte, par lequel l'âme saisit l'objet là où il est, et la mémoire est une puissance active, qui se renforce par l'exercice.** Appendice des traités 27-29, il répond au *De la mémoire et de la réminiscence* d'Aristote, et vise aussi ceux qui font de l'âme un corps.

          - **La sensation** (chap. 1-2) : nous voyons l'objet à distance, hors de nous ; une empreinte en nous ne montrerait que des images, et ne dirait ni la distance ni la grandeur du ciel. L'âme ne subit pas : elle lit, pour ainsi dire, les empreintes tracées dans l'air.
          - **La mémoire** (chap. 3) : l'âme, dernière des réalités intelligibles et première de l'univers sensible, se souvient des objets vers lesquels elle a tendu son attention. Si les souvenirs étaient des empreintes, on n'aurait pas à les chercher, et ce qui subit le plus se souviendrait le mieux ; or l'exercice renforce la mémoire, et l'âge l'affaiblit, comme la vue.

          Sensations et souvenirs ne sont pas des lettres tracées sur des tablettes.
      - id: t-4-7
        title: "Sur l'immortalité de l'âme"
        ennead: 4
        numberInEnnead: 7
        chrono: 2
        unit: traite2
        theses:
          - "Nous sommes notre âme, et elle est immortelle parce qu'elle tient son être et sa vie d'elle-même."
          - "L'âme n'est pas un corps : même un souffle matériel n'expliquerait ni la mémoire, ni la sensation, ni la pensée."
          - "L'âme produit et gouverne les corps par des « raisons » (lógoi, principes formateurs), sans quitter le monde intelligible."
        summary: |-
          **Le traité 2 établit que l'âme, qui est ce que nous sommes, n'est pas un corps : elle est incorporelle, immortelle et intelligible.** Plotin réfute d'abord les définitions de ses prédécesseurs, puis défend la sienne, qu'il tient pour platonicienne.

          - **Nous sommes notre âme** (chap. 1-2) : le corps, composé, se dissout ; l'âme, qui est le soi, est la cause de l'existence des corps.
          - **L'âme n'est pas un corps** (chap. 3 à 8³) : ni les atomes des épicuriens, ni surtout le souffle (`pneûma`) des stoïciens. Si l'âme était un corps, il n'y aurait ni mémoire, ni sensation unifiée, ni pensée.
          - **L'âme n'est forme d'aucun corps** (chap. 8⁴-8⁵) : ni « harmonie », comme le disent les pythagoriciens, ni « entéléchie », comme le dit Aristote.
          - **La nature de l'âme** (chap. 9-12) : elle a l'être et la vie par elle-même ; elle est divine, immortelle, indivisible.
          - **La venue dans le corps** (chap. 13-15) : l'âme produit et gouverne les corps par des « formules rationnelles » (`lógoi`), sans quitter l'intelligible ; sa descente n'est que partielle.

          Dans l'édition GF, le long chapitre 8 est divisé en cinq parties, de 8¹ à 8⁵. Les traités 4 (IV, 2) et 21 (IV, 1) sont la suite de celui-ci.
      - id: t-4-8
        title: "Sur la descente de l'âme dans les corps"
        ennead: 4
        numberInEnnead: 8
        chrono: 6
        priority: 2
        highlight: true
        unit: traite6
        theses:
          - "Toute âme est duelle : une partie tournée vers le corps, l'autre vers l'Intellect."
          - "La descente de l'âme dans un corps est à la fois volontaire et nécessaire."
          - "Le corps n'est pas méprisable, car il manifeste l'âme : seule l'âme individuelle est « contaminée » par lui."
        summary: |-
          **Le traité 6 pense le rapport de l'âme et du corps comme une descente (`katabàs`) à la fois volontaire et nécessaire : toute âme a une partie tournée vers le corps et une partie qui reste auprès de l'Intellect.**

          - **Partir de l'expérience** (chap. 1) : « Souvent, lorsque je m'éveille à moi-même en sortant de mon corps… ». Plotin aborde la question par le haut, depuis l'âme qui contemple.
          - **Deux lectures de Platon** (chap. 1-2) : la descente est une **chute** (*Phédon*, *République*, *Phèdre*), ou ce qui **achève l'univers** (*Timée*). L'âme du monde gouverne son corps sans en pâtir.
          - **La chute des âmes individuelles** (chap. 3-4) : elles s'attachent à un corps particulier et en sont « contaminées », à cause de la **matière**.
          - **Volontaire et nécessaire** (chap. 5) : le volontaire est compris dans la nécessité. Le corps n'est pas méprisable : sans lui, l'âme aurait ignoré ce qu'elle possède.
          - **L'âme amphibie** (chap. 7-8) : intermédiaire entre l'intelligible et le sensible, elle a une partie supérieure, orientée vers l'Intellect, qui ne descend pas.

          Le traité donne sa forme classique à la doctrine plotinienne de l'âme, que les traités 27 à 29 (IV, 3-5) développeront.
      - id: t-4-9
        title: "Si toutes les âmes n'en sont qu'une"
        ennead: 4
        numberInEnnead: 9
        chrono: 8
        unit: traite8
        theses:
          - "Toutes les âmes ne font qu'une : leur multiplicité n'est qu'apparente."
          - "La diversité des vivants vient des corps : une même âme anime différemment des corps différents."
          - "L'âme est une malgré la variété de ses facultés, comme une science est tout entière dans chacun de ses théorèmes."
        summary: |-
          **Le traité 8 défend une thèse que Plotin sait audacieuse : toutes les âmes n'en sont qu'une, et leur multiplicité n'est qu'apparente.**

          - **La thèse** (chap. 1, 1-13) : au-delà de l'**homogénéité** des âmes, lieu commun platonicien, Plotin soutient leur **unité**.
          - **L'âme se divise dans les corps** (chap. 1-2) : la diversité des vivants vient des **corps**, qu'une même âme anime différemment.
          - **La sympathie universelle** (chap. 3, 1-9) : Plotin la reprend des stoïciens, mais la rapporte à une âme unique.
          - **La diversité des facultés** (chap. 3, 10-fin) : « ce n'est pas parce que l'âme a plusieurs puissances qu'elle n'est pas une » (3, 16-17).
          - **Deux justifications** (chap. 4-5) : les âmes sont les empreintes d'un même **sceau** ; l'âme est présente en chacune, comme une **science** tout entière en chacun de ses théorèmes.

          Reste une ambiguïté, que les traités 27-29 (IV, 3-5) devront affronter : comment les âmes individuelles procèdent-elles de l'âme du monde sans en être distinctes ?
      - id: t-5-1
        title: "Sur les trois hypostases qui ont rang de principes"
        ennead: 5
        numberInEnnead: 1
        chrono: 10
        priority: 5
        highlight: true
        unit: traite10
        theses:
          - "Il y a trois réalités véritables, l'Un, l'Intellect et l'Âme : chacune est produite par la précédente."
          - "Les âmes se sont éloignées de leur source par audace et en ont oublié l'origine."
          - "Les trois réalités sont aussi en nous : il faut fuir les bruits du monde sensible pour entendre ceux de l'intérieur."
        summary: |-
          **Le traité 10 est le seul exposé à la fois systématique et synthétique des trois réalités véritables, l'Un, l'Intellect et l'Âme, que le titre de Porphyre nomme « hypostases » : chacune est produite par la précédente, et toutes trois sont aussi en nous.**

          - **L'oubli de l'âme** (chap. 1-2) : par **audace** (`tólma`), les âmes ont voulu s'appartenir et ont oublié le dieu leur père. Il faut leur rappeler leur dignité : l'âme du monde donne vie et ordre à tout l'univers.
          - **L'Âme, image de l'Intellect** (chap. 3) : comme le discours prononcé est l'image du discours intérieur. Sa pensée est discursive (`diánoia`), celle de l'Intellect intuitive (`nóēsis`).
          - **L'Intellect** (chap. 4) est à la fois pensée et être ; il contient les genres premiers du *Sophiste*.
          - **Comment l'Un engendre** (chap. 5-7) : sans vouloir ni se mouvoir, par **surabondance**, comme le soleil sa lumière ; l'engendré se **retourne** (`epistrophḗ`) vers lui et s'en trouve déterminé. Comme Kronos avale ses enfants, l'Intellect garde en lui ce qu'il engendre.
          - **Les prédécesseurs** (chap. 8-9) : seuls Platon et les pythagoriciens ont saisi la hiérarchie des trois principes ; Plotin se présente en **interprète** de Platon.
          - **Les trois réalités en nous** (chap. 10-12) : il faut négliger les **« bruits sensibles »** pour entendre les sons de là-bas.

          Augustin et Eusèbe l'ont lu à la lumière de la Trinité chrétienne, au prix d'un contresens : l'Un engendre par nécessité, non par volonté.
      - id: t-5-2
        title: "Sur la génération et le rang des choses qui sont après le premier"
        ennead: 5
        numberInEnnead: 2
        chrono: 11
        unit: traite11
        theses:
          - "L'Un, parfait et sans besoin, déborde de lui-même : ce qui en naît se tourne vers lui, le voit et devient l'Intellect."
          - "L'Âme engendre en descendant une image d'elle-même : la faculté de sentir et celle de croître (végétative)."
          - "La réalité est continue, sans rupture entre ses niveaux, « comme une longue vie qui s'étend dans sa longueur »."
        summary: |-
          **Le petit traité 11 (deux chapitres) établit la continuité entre les niveaux de la réalité : la tripartition du réel en Un, Intellect et Âme n'implique aucune rupture.**

          - **La première génération** (chap. 1, 1-13) : « l'Un est toutes choses et il n'est aucune d'elles ». Parfait, sans besoin, il **surabonde** ; l'engendré se tourne vers lui, le voit, et devient l'**Intellect** et l'**être**.
          - **L'Âme et son image** (chap. 1, 13-28) : l'Intellect produit de même l'**Âme** ; mais l'Âme produit en se mouvant : elle engendre une **image** d'elle-même, ses facultés sensible et végétative.
          - **En aucun lieu, donc partout** (chap. 2, 1-24) : l'Âme est dans une plante, un animal ou un homme selon la faculté qui domine ; couper une plante ne la déplace pas.
          - **Un même processus** (chap. 2, 24-31) : surabondance, puis **retour**, à chaque niveau ; chaque réalité est l'image de la précédente et le modèle de la suivante.

          Le traité finit sur une image : le réel est **« comme une longue vie qui s'étend dans sa longueur »**. Le traité 15 (III, 4) en est la suite.
      - id: t-5-3
        title: "Sur les hypostases qui ont la faculté de connaître et ce qui est au-delà"
        ennead: 5
        numberInEnnead: 3
        chrono: 49
        highlight: true
        unit: traite49
        theses:
          - "Seul l'Intellect se connaît pleinement : en lui, ce qui pense, la pensée et ce qui est pensé ne font qu'un."
          - "L'âme ne se connaît qu'en devenant Intellect : nous sommes la pensée qui raisonne pas à pas, et l'Intellect est notre roi."
          - "L'Un, au-delà de l'Intellect, ne se pense pas : il donne ce qu'il n'a pas, et l'on ne peut dire de lui que ce qu'il n'est pas."
        summary: |-
          **Le traité 49 reprend les trois principes du point de vue de la connaissance de soi : l'âme ne se connaît qu'en devenant Intellect, l'Intellect se connaît pleinement parce qu'en lui ce qui pense et ce qui est pensé ne font qu'un, et l'Un, au-delà de la connaissance, ne se pense pas.** C'est le dernier traité à exposer en entier la doctrine des trois hypostases.

          - **L'âme** (chap. 1-4) : se connaître n'est pas connaître une partie par une autre. La pensée discursive, ce que « nous » sommes, raisonne sur les empreintes venues des sens et de l'Intellect ; l'âme ne se connaît qu'en devenant Intellect.
          - **L'Intellect** (chap. 5-10) : en lui, l'Intellect, l'intellection et l'intelligible sont une seule et même chose ; il est une lumière qui se voit elle-même. Mais se penser suppose une multiplicité : ce qui est absolument un ne se pense pas.
          - **L'Un** (chap. 11-17) : l'Intellect naît en voulant voir l'Un et en le voyant multiple. L'Un est ineffable : on dit ce qu'il n'est pas ; puissance de toutes choses, il donne ce qu'il n'a pas, et l'âme l'atteint dans un contact, soudain, comme une lumière.

          Le traité se clôt sur une exhortation : « Retranche toutes choses ».
      - id: t-5-4
        title: "Comment vient du premier ce qui est après le premier, et sur l'Un"
        ennead: 5
        numberInEnnead: 4
        chrono: 7
        highlight: true
        priority: 3
        unit: traite7
        theses:
          - "L'Intellect vient directement de l'Un, qui pourtant reste tel qu'il est."
          - "L'Intellect est la pensée de l'Un : distinct de lui, il n'en est pourtant pas séparé."
          - "Toute réalité a deux activités, l'une qui la définit, l'autre qui fait exister autre chose (la chaleur du feu)."
        summary: |-
          **Le bref traité 7 (deux chapitres) explique comment l'Intellect vient de l'Un sans que l'Un sorte de lui-même : toute réalité a deux actes, l'un qui la constitue, l'autre qui en provient sans l'affecter.**

          - **Le Premier** (chap. 1, 1-23) : il est un, simple, parfait, « au-delà de la réalité ».
          - **L'Un parfait produit** (chap. 1, 23-41) : ce qui vient de lui en vient soit par des intermédiaires, soit **immédiatement** ; c'est le cas de l'**Intellect**.
          - **La dualité de l'Intellect** (chap. 2, 1-27) : l'Intellect est une **intellection** de l'Un ; distinct de lui, il n'en est pas séparé. L'Un, lui, **demeure** (`ménei`) en lui-même.
          - **Les deux actes** (chap. 2, 27-36) : il y a l'acte de la réalité et l'acte issu de la réalité, comme le feu et la chaleur qui en émane. L'Un est une puissance qui surabonde.

          Le traité pose ainsi le mécanisme de la procession, que les traités 10 (V, 1) et 11 (V, 2) développeront.
      - id: t-5-5
        title: "Sur l'intellect et que les intelligibles ne sont pas hors de l'intellect, et sur le Bien"
        ennead: 5
        numberInEnnead: 5
        chrono: 32
        unit: traite32
        theses:
          - "Si les intelligibles (les Formes) étaient hors de l'Intellect, il n'en recevrait que des images : pour atteindre la vérité, ils doivent être en lui."
          - "Le Bien est antérieur au Beau : tous le désirent, même en dormant, et ce désir est plus originel que l'amour du beau."
          - "L'Un n'est en rien, mais tout est en lui : le monde dans l'Âme, l'Âme dans l'Intellect, l'Intellect dans l'Un."
        summary: |-
          **Le traité 32 établit que les intelligibles ne sont pas hors de l'Intellect, sans quoi il n'en saisirait que des images et manquerait la vérité ; puis il décrit l'Un-Bien, au-delà du nombre, de l'être et même du Beau.**

          - **Les intelligibles dans l'Intellect** (chap. 1-2) : un Intellect qui verrait des Formes extérieures les connaîtrait comme la sensation, par des images, et ne posséderait que le faux. Sa vérité s'accorde avec elle-même.
          - **Le second dieu et le premier** (chap. 3) : l'Intellect est un second dieu, devant lequel s'avance la procession qui précède le Grand Roi.
          - **L'Un au-delà du nombre et de l'être** (chap. 4-6) : il est une mesure, non un mesuré ; l'être est une trace de l'Un ; l'Un est « au-delà de l'être », et son nom même est une négation du multiple.
          - **Voir l'Un** (chap. 7-11) : comme l'œil voit sa propre lumière paupières closes, l'Intellect voit une lumière soudaine ; l'Un n'est nulle part, mais tout est en lui, comme dans le premier des cercles.
          - **Le Bien avant le Beau** (chap. 12-13) : le désir du Bien est présent même à ceux qui dorment ; l'amour du Beau, qui mêle plaisir et douleur, est second. Le Bien, « seul et isolé », ne possède rien.

          Le traité 32 ne faisait qu'un avec le traité 31 (V, 8), que Porphyre a placé avant lui.
      - id: t-5-6
        title: "Sur le fait que ce qui est au-delà de l'être n'intellige pas, et sur ce que sont les principes premier et second d'intellection"
        ennead: 5
        numberInEnnead: 6
        chrono: 24
        unit: traite24
        theses:
          - "Contre Aristote, ce qui pense, même lui-même, n'est pas premier : le principe, parfaitement un, ne pense pas."
          - "Ce qui se pense soi-même est à la fois un et deux (celui qui pense et ce qui est pensé) : il est « simple et non simple »."
          - "Penser est un mouvement qui se porte vers le Bien en le désirant : c'est ce désir qui fait naître la pensée."
        summary: |-
          **Le traité 24 dissocie l'excellence du principe de l'activité de pensée : ce qui pense, même soi-même, ne peut plus prétendre au premier rang.** Il vise la théologie d'Aristote, pour qui l'Intellect qui se pense est « la plus divine des choses » : Plotin lui substitue l'Un, parfait parce que purifié de toute intellection.

          - **Penser, c'est être deux** (chap. 1) : ce qui s'intellige est à la fois un et deux, « simple et non simple ». L'âme pense autre chose qu'elle ; l'Intellect se pense lui-même, et pense ainsi au sens propre.
          - **Le Premier n'intellige pas** (chap. 2-3) : il y a un principe qui n'intellige pas, un qui intellige en un sens premier (l'Intellect) et un en un sens second (l'âme). Le multiple suppose une unité simple avant lui.
          - **Les images** (chap. 4) : l'Intellect « prend la forme du Bien » ; le Bien est la lumière, l'Intellect le soleil, l'âme la lune.
          - **Le désir précède la pensée** (chap. 5) : « intelliger : un mouvement qui se porte vers le Bien en le désirant ». L'Intellect ne s'intellige que par accident, en regardant vers le Bien.
          - **Au-delà de la réalité, au-delà de l'intellection** (chap. 6) : le Bien ne se connaît pas ; il donne aux autres choses de l'atteindre.

          C'est l'un des gestes inauguraux du néoplatonisme.
      - id: t-5-7
        title: "S'il y a des idées même des êtres individuels"
        ennead: 5
        numberInEnnead: 7
        chrono: 18
        unit: traite18
        theses:
          - "Chaque individu a son Idée, un « Socrate en soi » : les différences entre les hommes tiennent à la forme, non à la matière."
          - "Le nombre d'individus en soi est limité : le monde recommence donc à l'identique à chaque cycle."
          - "Il y a autant de « raisons » (principes formateurs) que d'individus différents, et la matière n'explique que la laideur."
        summary: |-
          **Le bref traité 18 (trois pages) est l'un des plus originaux de Plotin : il y a une Idée de chaque individu, un « Socrate en soi ».** Platon ne l'avait pas soutenu explicitement.

          - **Un Socrate en soi** (chap. 1, 1-5) : la participation relie aussi l'individu à un **individu en soi** ; les différences entre les hommes sont des **« différences formelles »**, non de simples accidents de la matière.
          - **L'illimité n'est pas à craindre** (chap. 1, 6-27) : le nombre des individus en soi est pourtant déterminé, car le monde revient à l'identique à chaque **période**, la Grande Année.
          - **Les géniteurs et la matière** (chap. 2) : les différences entre enfants des mêmes parents viennent des raisons ; la matière n'explique que la laideur.
          - **Les jumeaux** (chap. 3) : « il y a autant de raisons que d'individus différents ».

          Deux conséquences : la rationalité s'étend au monde des individus, et l'âme garde après la mort sa personnalité. **Plotin refuse d'identifier individualité et irrationalité.**
      - id: t-5-8
        title: "Sur la beauté intelligible"
        ennead: 5
        numberInEnnead: 8
        chrono: 31
        highlight: true
        unit: traite31
        theses:
          - "L'art n'imite pas ce qu'on voit mais les principes qui font la nature, comme Phidias, qui a sculpté Zeus tel qu'il serait s'il se montrait."
          - "Dans l'intelligible, le savoir n'est pas fait de phrases : chaque Forme est une image vivante, comme les hiéroglyphes d'Égypte."
          - "Le monde n'a pas été fabriqué par un artisan divin (démiurge) qui délibère : il est l'image belle et éternelle de l'intelligible."
        summary: |-
          **Le traité 31 est un hymne à la beauté du monde intelligible : là-bas, tout est forme, donc tout est beau ; les intelligibles ne sont pas hors de l'Intellect, ils sont l'Intellect lui-même ; et le monde sensible en est l'image, produite sans délibération.**

          - **La beauté vient de la forme** (chap. 1-2) : de deux blocs de pierre, seul est beau celui où l'art a fait entrer une forme ; l'art imite les raisons de la nature, et Phidias a sculpté Zeus tel qu'il serait s'il se montrait.
          - **La vie bienheureuse de l'Intellect** (chap. 3-4) : là-bas, tout est transparent, chaque chose est tout, et la contemplation ne connaît ni fatigue ni satiété.
          - **Le savoir véritable** (chap. 5-6) n'est pas fait de propositions : les Formes sont des images vivantes, comme les hiéroglyphes des sages d'Égypte.
          - **Le monde, image du beau** (chap. 7-9) : il n'a pas été planifié par un démiurge qui délibère ; tout ce qui se trouve ici vient de là-bas, et la beauté précède tout raisonnement.
          - **Voir le beau, devenir le beau** (chap. 10-13) : l'âme possédée par le dieu ne voit plus le beau au-dehors, elle le devient ; le mythe de Kronos dit l'Intellect qui garde ses enfants.

          Avec le traité 32 (V, 5), c'est une même méditation sur l'Intellect et sur son père, l'Un, que Porphyre a séparée en deux.
      - id: t-5-9
        title: "Sur l'Intellect, les idées et ce qui est"
        ennead: 5
        numberInEnnead: 9
        chrono: 5
        unit: traite5
        theses:
          - "L'Intellect est identique aux Formes qu'il pense : elles ne sont ni avant ni après lui, mais en lui."
          - "L'Intellect est toujours pleinement en activité : il est antérieur et supérieur à l'Âme, et n'est pas l'âme devenue parfaite."
          - "Il y a une Forme de l'homme, mais aucune des choses sans valeur, qui viennent de la matière."
        summary: |-
          **Le traité 5 examine le monde intelligible : l'Intellect, toujours en acte et supérieur à l'âme, ne pense pas des Formes extérieures à lui, il est les Formes qu'il pense.**

          - **La vraie philosophie** (chap. 1-2) : les épicuriens en restent au plaisir, les stoïciens s'élèvent un peu par la vie morale, les platoniciens contemplent l'intelligible. Il faut monter d'« ici-bas » jusque « là-bas ».
          - **L'Intellect au-dessus de l'âme** (chap. 3-4) : il lui donne sa forme et ses « raisons » (`lógoi`) ; toujours en acte, il lui est supérieur.
          - **Penser, c'est être les Formes** (chap. 5-6) : l'Intellect se pense lui-même, et se penser, c'est penser les Formes, qui sont en lui. Il est « toutes les choses ensemble ».
          - **Les Formes ne sont pas produites par l'Intellect** (chap. 7-9) : elles lui sont « antérieures », non dans le temps, mais parce qu'il ne les penserait sinon que par hasard ; en vérité, elles lui sont contemporaines.
          - **De quoi y a-t-il des Formes ?** (chap. 10-14) : de l'homme, peut-être pas de Socrate ; pas des techniques, sauf en l'homme ; aucune des choses sans valeur ni des composés accidentels.

          Le traité concilie Platon, Aristote et le médioplatonisme ; il laisse pour plus tard la question de l'Un, à laquelle répondra le traité 7 (V, 4).
      - id: t-6-1
        title: "Sur les genres de l'être I"
        ennead: 6
        numberInEnnead: 1
        chrono: 42
      - id: t-6-2
        title: "Sur les genres de l'être II"
        ennead: 6
