      - id: t-5-9
        title: "De l'Intellect, des Formes et de l'être"
        ennead: 5
        numberInEnnead: 9
        chrono: 5
        unit: traite5
        summary: |-
          **Le traité 5 examine la nature et l'organisation du monde intelligible : le rapport entre l'Intellect et les Formes**, qui sont pour les platoniciens la totalité des réalités « qui sont réellement ».

          - **Chap. 1-2 : la vraie philosophie.** Trois genres d'hommes : ceux qui en restent à la sensation et au plaisir (épicuriens), ceux qui s'élèvent un peu par la vie pratique (stoïciens), ceux qui contemplent l'intelligible (platoniciens). Il faut monter d'« ici-bas » jusque « là-bas ».
          - **Chap. 3-6 : l'Intellect.** Il donne à l'âme sa forme et ses « raisons » (`lógoi`) ; toujours en acte, il est supérieur à l'âme ; il se pense lui-même, et se penser soi-même, c'est penser les Formes, qui sont en lui. Il est « toutes les choses ensemble ».
          - **Chap. 7-14 : les Formes.** Elles ne sont pas produites par l'Intellect qui les pense : elles lui sont « antérieures », c'est-à-dire contemporaines. Puis : de quoi y a-t-il des Formes ? Pas des choses contraires à la nature, pas des techniques (sauf en l'homme), une Forme de l'homme mais peut-être pas de Socrate, aucune de la boue ni des composés accidentels.

          Les sources sont Platon (théorie des Formes), Aristote (forme dans la matière, intellect qui se pense) et le médioplatonisme (les Formes, pensées de l'Intellect). Le traité laisse pour plus tard la question de l'Un : le traité 7 (V, 4) y répondra.

