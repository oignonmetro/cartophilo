- id: traite26-l6
  title: "Participer sans participer"
  notes: |-
    Le chapitre 11 part du *Timée* (50c) : **« Les choses qui entrent et sortent de la matière sont des imitations des êtres »**. La difficulté n'est pas de savoir comment les formes viennent dans la matière, mais **comment elles y sont présentes** sans l'affecter, alors qu'elles s'affectent mutuellement en elle.

    - **La beauté comme une parure** : ce qui reçoit la beauté sans altération est comme une personne qui revêt une parure. Si la matière, laide de l'être même de la laideur, devenait belle, elle serait détruite. **Si elle est mauvaise, elle n'est pas affectée par le bien** : c'est être totalement impassible.
    - **Platon cherche un modèle de participation sans affection** (chap. 12). Le mot de Démocrite, « par convention la couleur », ne serait pas absurde ici. Dire la matière « enflammée », c'est comme dire que **la statue a traversé l'airain** ; faire pâtir la matière, c'est en faire un corps.
    - **Elle « fuit la forme »** (chap. 13) au sens où elle a **cette forme qui est de n'en avoir jamais**. Elle est « le réceptacle et la nourrice de tout le devenir » (*Timée*, 49a). Un miroir se voit, car il est une forme ; la matière ne se voit jamais, comme **l'air, invisible même illuminé**.

    **Pénia et Poros** (chap. 14, *Banquet*, 203b-d) : par son audace et sa pauvreté, la matière tente de saisir et ne saisit rien : le mythe en fait **une mendiante**. Unie à Poros, elle ne s'unit pas à l'être, mais à une réalité pleine de ressources. D'où l'étonnant : **la matière participe sans participer**. Ce qu'elle saisit glisse sur elle, comme **l'écho** sur les surfaces lisses. Elle arrête la procession comme les **miroirs** placés devant le soleil concentrent le feu : ainsi elle est cause de la génération.

    **Les représentations dans l'âme** (chap. 15) entrent et sortent sans s'y mêler ; mais la matière est plus faible que l'âme : elle ne peut pas même dire **« moi, je suis là »**.

    ! « Participer sans participer » n'est pas une contradiction : la matière donne lieu aux reflets des formes sans rien recevoir d'elles.
