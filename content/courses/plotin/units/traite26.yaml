title: "Traité 26 (III, 6) : Sur l'impassibilité des incorporels"
subtitle: "Ce qui paraît pâtir ne pâtit pas"
icon: compass
color: sky
lessons:
- id: traite26-l1
  title: "Ce qui paraît pâtir ne pâtit pas"
  notes: |-
    **Le traité 26 pourrait, comme les traités 22-23, porter un titre paradoxal : comment ce qui paraît pâtir ne pâtit pas.** Plotin y rectifie deux erreurs qui s'appuient sur nos **« habitudes de langage »** (12, 29) :

    | L'erreur | Ce que soutient Plotin |
    | parler de « passions de l'âme » | l'âme, forme et intelligible en son sommet, est impassible |
    | supposer la matière toujours « affectée » par les formes (péripatéticiens) | la matière reçoit les formes sans en pâtir |

    **Un diptyque** : une première partie, rapide, sur l'âme (chap. 1-5) ; le chapitre 6 sur l'être impassible, qui sert de charnière ; un véritable traité sur la matière (chap. 7-19). **Deux sens de l'impassibilité** s'y opposent : celle de l'âme vient de sa **perfection**, celle de la matière de son **impuissance**, de son incapacité à passer à l'acte. Les corps, eux, sont le domaine propre de la passivité.

    **Le chapitre 1** : **« les sensations ne sont pas des affections, disons-nous, mais des activités et des jugements »** (1, 1-2). Les affections concernent un corps ; le jugement, l'âme. Les impressions mêmes sont **comme les pensées, des actes capables de connaître sans être affectées**.

    Si l'âme était un corps, il serait impossible de la montrer impassible. Mais si elle est une réalité sans grandeur, un nombre ou une raison, il faut imaginer qu'elle reçoit **« des raisons irrationnelles ou des passions impassibles »** : **elle possède sans posséder, et subit sans subir** (1, 32-35).

    **La cible** : tous ceux qui font de l'âme un corps, d'abord les stoïciens. **Cléanthe** concevait la représentation comme l'impression d'un sceau dans la cire.

    ! L'impassibilité de l'âme n'est pas l'insensibilité : l'âme sent et juge, mais sentir et juger sont des actes, non des affections.
