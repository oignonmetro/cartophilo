- id: traite26-l7
  title: "La grandeur, le vêtement et la mère stérile"
  notes: |-
    **La matière et la grandeur** (chap. 16-18) : par elle-même, la matière n'a pas de grandeur. **Une raison formelle la porte à la quantité qu'elle souhaite** ; si l'on enlève le cheval, la grandeur du cheval s'en va. Si le ciel prenait fin, toute la grandeur portée sur la matière la quitterait, la laissant telle qu'elle était.

    - La dimension est une forme, une réalité immatérielle : **la matière n'est grande que par participation**, et participe à la grandeur sans y participer.
    - **La grandeur d'ici-bas est un mensonge** : la couleur vient de la non-couleur, la qualité d'ici-bas de la non-qualité, et elles n'ont que **le même nom** que les réalités intelligibles.
    - **La matière utilise le grand comme une sorte de vêtement** (18, 20) : si ce qui le lui met l'enlève, elle reste la même.
    - L'âme, elle, reçoit les formes des êtres sensibles **dépouillées de leur masse** ; la matière, sans activité, **n'est qu'une ombre**.

    **Conclusion : la « mère »** (chap. 19, *Timée*, 50d et 51a). Les reflets entrent dans la matière sans la détériorer ni l'améliorer. Les termes **« réceptacle » et « nourrice » lui conviennent mieux ; « mère » est une façon de parler**, puisqu'elle ne produit rien. Si la mère donne quelque chose à son enfant, c'est en tant que forme : **seule la forme engendre, l'autre nature est stérile**.

    Les anciens sages le disaient à mots couverts : ils représentaient **l'ancien Hermès** avec un organe toujours en activité, pour montrer que la raison intelligible engendre les choses sensibles, et la matière, stérile, **entourée d'eunuques** : la Grande Mère, Cybèle.

    ! La matière est dite « mère » parce qu'elle reçoit, non parce qu'elle engendre : elle est séparée de tout pouvoir d'engendrer.
