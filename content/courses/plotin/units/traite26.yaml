- id: traite26-l5
  title: "La matière, non-être véritable et miroir"
  notes: |-
    **La matière est incorporelle** (chap. 7), puisque le corps est postérieur et composé : c'est elle qui, avec autre chose, le produit. Elle est **impassible**, comme l'être, à cause de leur incorporéité. Mais n'étant **ni âme, ni intellect, ni vie, ni forme, ni raison, ni limite, ni puissance**, elle n'est pas un être : elle est **le non-être véritable**, non au sens où le mouvement et le repos sont non-être.

    - Invisible par elle-même, elle **fuit qui veut la voir** ; à sa surface apparaissent toujours des contraires, petit et grand, manque et excès.
    - **« Elle ment dans tout ce qu'elle annonce »** (7, 21) : paraît-elle grande ? elle est petite. Ce qui semble apparaître en elle n'est qu'un **fantôme sur un fantôme**, **comme ce qui apparaît dans un miroir**, situé ailleurs que là où il se manifeste.
    - Les reflets semblent agir sur elle, mais n'y font rien : faibles, ils la traversent sans la couper, comme des objets dans l'eau.

    **En dialogue avec Aristote** (chap. 8-9) : ne pâtit que ce qui a des qualités contraires à ce qui l'affecte, le chaud par le froid, l'humide par le sec ; or **l'altération conduit à la destruction**, et la matière est indestructible. Il y a plusieurs façons d'être présent : la figure dans la cire, la lumière, le froid dans la pierre ne pâtissent pas. **« La matière est plus impassible encore que les miroirs »** (9, 18-19). Elle est comme **une maison où différentes personnes se battent** : elle reste impassible.

    **Altérée, la matière ne serait plus matière** (chap. 10) : qualifiée, elle ne serait plus capable de tout recevoir. Comme la forme là-bas est inaltérable, ici la matière ne connaît aucune altération.

    ! Les qualités contraires se combattent dans la matière, mais ne la combattent pas : elles n'ont aucun rapport de contrariété avec elle.
