- id: traite26-l2
  title: "Le vice, la vertu et les passions"
  notes: |-
    **Le vice altère-t-il l'âme ?** (chap. 2) On dit qu'il faut « l'enlever », comme une chose mauvaise présente en elle.

    **La vertu est une harmonie, le vice un manque d'harmonie** : l'accord des parties de l'âme, conforme à la nature. Rien ne vient s'ajouter : chaque partie s'ajuste aux autres, comme des **choreutes** qui chantent ensemble, chacun sa partie. Et avant l'harmonie, il y a la vertu propre de chaque faculté.

    - **La faculté qui raisonne dépend de l'Intellect** : être dans la vertu, c'est agir selon sa réalité en suivant la raison. Écouter la raison, c'est **voir sans recevoir de figure** : **« il n'y a pas là l'impression d'un cachet »** (2, 38-39), comme une figure dans la cire. Les souvenirs non plus ne sont pas des dispositions.
    - **Le principe** : **les actes des êtres sans matière se produisent sans altération** ; seuls les êtres matériels pâtissent en agissant. Quand la vue est en acte, c'est l'œil qui pâtit.
    - **La lâcheté** consiste à ne pas regarder vers la raison, ou à manquer des instruments corporels ; **la débauche**, à ce que la faculté désirante agisse seule. Souvent, le vice de cette faculté n'est que **le mauvais état du corps**.

    **Les passions** (chap. 3) : la honte naît dans l'âme, mais c'est le corps, sous sa dépendance, qui est modifié par la mobilité du sang. **La peur a son origine dans l'âme, mais la pâleur vient d'un reflux du sang à l'intérieur du corps.** Dire que l'âme rougit ou pâlit, c'est oublier que ces affections se produisent dans le composé.

    **Résumé** (3, 27-35) : les actes et les vies ne sont pas des altérations ; les souvenirs et les imaginations ne sont pas des empreintes dans la cire ; **la vertu et le vice ne sont pas dans l'âme comme le noir et le blanc dans le corps.**

    ! Dire que le vice n'altère pas l'âme ne revient pas à le nier : c'est en faire un désaccord entre ses activités, non une souillure déposée en elle.
