- id: traite26-l3
  title: "La faculté passive : l'harmonie et les cordes"
  notes: |-
    **Qu'est-ce que la faculté de l'âme qu'on dit passive ?** (chap. 4) Celle où semblent se constituer les passions, suivies de plaisir et de douleur.

    - Certaines passions naissent **d'une opinion** : penser qu'on va mourir produit la peur. L'opinion est en un lieu, la passion mise en branle en un autre. D'autres s'imposent sans choix réfléchi, avec **une opinion obscure, une imagination indistincte**, comme celle de la « nature ».
    - De là le trouble perçu par le corps : **frisson, tremblement, pâleur, impuissance à parler**. Si l'âme éprouvait tout cela, elle serait corporelle.
    - **« Cette faculté de l'âme qui est passive n'est pas un corps, mais une certaine forme »** (4, 30-31). La puissance végétative qui fait pousser les plantes ne pousse pas elle-même.

    **L'image de la lyre** (4, 41-52) :

    | Dans l'instrument | Dans le vivant |
    | l'harmonie, immobile | la faculté passive de l'âme |
    | le musicien | les causes du mouvement |
    | les cordes ébranlées | les parties du corps mues par la passion |

    Quand la lyre résonne, la corde vibre et subit le choc, mais l'harmonie ne subit aucune déformation : de même, dans la peur, le corps tremble, mais la forme de l'âme qui en est cause reste intacte.

    **« Ce n'est pas l'harmonie qui pâtit, mais la corde. »** On parle d'un « occasionnalisme » plotinien : nous pâlissons à l'occasion d'une pensée qui, pour l'âme, n'est qu'activité.

    **Pourquoi purifier une âme qui ne pâtit pas ?** (chap. 5) Parce que **l'image mentale** introduite dans la faculté passive produit un trouble, que la raison juge préférable de supprimer : c'est comme si l'on réveillait l'âme pour supprimer **les images de nos rêves**. La purification, c'est **isoler l'âme** : ne pas s'associer à d'autres réalités, ne pas regarder hors de soi, ne pas considérer d'images. La séparation est **comme une lumière qui n'est plus dans le brouillard**, et qui n'y était pas affectée. L'âme se trouve alors en un **« véhicule »** (`ὄχημα`) subtil, notion décisive pour Porphyre et Proclus.

    ! La purification ne lave pas l'âme d'une souillure : elle la réveille, en la détournant des images qui troublent le corps.
