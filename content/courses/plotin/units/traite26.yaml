- id: traite26-l4
  title: "L'être n'est pas un corps"
  notes: |-
    **Le chapitre 6 sert de charnière** : la réalité intelligible est impassible ; or **la matière est aussi l'un des incorporels**, en un autre sens. Avant de dire comment elle est impassible, il faut établir que l'être n'est pas ce que croit la plupart des gens.

    **L'être véritable est l'être total**, auquel rien ne manque : parfait, il est la cause du semblant d'être des autres choses. Il vit d'une **vie parfaite** : il est l'Intellect et la pensée totale, éternel, sans rien recevoir. **Il n'est donc ni un corps, ni un substrat pour les corps.**

    **L'objection matérialiste** : comment les montagnes, les pierres, la solidité de la terre ne seraient-elles pas, et l'âme et l'intellect, invisibles et sans résistance, seraient-ils ?

    **La réponse de Plotin** :

    - **Plus un corps est lourd et terreux, plus il est déficient** : sujet à tomber, incapable de se relever ; ses chocs viennent de sa faiblesse. Le mouvement est **comme une certaine vie** dans les corps.
    - **La terre est le plus passif des éléments** : coupée, elle ne se réunit pas, quand les autres éléments s'unifient à nouveau. Ce qui est le plus corps est au plus proche du non-être : un choc, c'est **« un non-être qui tombe sur un non-être »** (6, 64).
    - **Les matérialistes sont comme des rêveurs** : ils croient évident ce qu'ils voient, mais ce ne sont que des rêves. **« Être dans le corps, pour l'âme, c'est dormir »** (6, 70-71) ; se réveiller avec le corps, c'est passer **d'un lit à un autre** ; le vrai réveil est de quitter les corps.

    ! La résistance et la solidité ne prouvent pas la réalité des corps : elles trahissent leur faiblesse et leur voisinage avec le non-être.
