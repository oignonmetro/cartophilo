- id: traite26-l8
  title: "Repérage : le plan du traité 26"
  notes: |-
    **Le traité 26 traite de l'âme (chap. 1-5), puis, après la charnière de l'être (chap. 6), de la matière (chap. 7-19).**

    | Moment | Lieu | Ce qui s'y joue |
    | les sensations sont des activités | chap. 1 | possède sans posséder, subit sans subir |
    | le vice et la vertu | chap. 2 | une harmonie, les choreutes |
    | les passions et le corps | chap. 3 | la peur et la pâleur |
    | la faculté passive | chap. 4 | l'harmonie et les cordes |
    | impassibilité et purification | chap. 5 | réveiller l'âme, la lumière dans le brouillard |
    | l'être n'est pas un corps | chap. 6 | être dans le corps, c'est dormir |
    | la matière, non-être véritable | chap. 7 | elle ment dans tout ce qu'elle annonce |
    | avec Aristote : les contraires | chap. 8-9 | plus impassible que les miroirs |
    | la matière inaltérable | chap. 10 | altérée, elle ne serait plus matière |
    | la participation impassible | chap. 11-12 | imitations qui entrent et sortent |
    | la matière fuit la forme | chap. 13 | réceptacle et nourrice ; le miroir |
    | Pénia et Poros | chap. 14 | participer sans participer, l'écho |
    | les formes comme des représentations | chap. 15 | « moi, je suis là » |
    | la matière et la grandeur | chap. 16-18 | la grandeur comme un vêtement |
    | la mère stérile | chap. 19 | Hermès et la Grande Mère |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

