id: g-noothenai
title: Noōthēnai
subtitle: Devenir intellect, s'élever de l'Âme à l'Intellect
icon: bulb
color: amber
lessons:
- id: g-noothenai-l1
  title: S'intellectualiser
  # Occurrence laissée de côté : `noōthēnai` apparaît aussi en VI, 8, 1
  # (traité 39), mais pour décrire le même moment qu'en VI, 7, 35 (les vertus
  # ou l'âme qui se détachent du corps pour devenir contemplatives) ; aucun
  # trait propre ne permet d'en faire une localisation à réponse unique.
  notes: |-
    **`Noōthēnai`**, infinitif aoriste passif du verbe `noōō`, signifie **« être intellectualisé », « devenir intellect »** : le processus par lequel l'âme, ou une vertu, est transformée et illuminée par l'**Intellect** (`Noûs`), s'élevant au-dessus de la raison discursive pour adopter une nature purement intellective. Son participe passif, `noōtheisa`, désigne **« l'âme devenue intellect »**.

    **Le verbe est forgé sur `Noûs`**, le nom même de la seconde hypostase : il a donc un ancrage exclusif et désigne la coïncidence avec l'Intellect, et avec lui seul. Plotin l'emploie en __VI, 7, 35__ (traité 38) et en VI, 8, 1 (traité 39) pour le moment où les vertus ou l'âme se détachent du corps pour devenir contemplatives, « intellectualisées » par la lumière d'en haut ; en __I, 2, 6__ (traité 19, *Des vertus*), la vertu contemplative au plus haut degré consiste précisément à s'intellectualiser.

    **Devenue intellect, l'âme saisit tout d'un seul coup.** Elle ne parcourt plus les Formes une à une, elle les embrasse toutes à la fois, `homou panta` (« tout est ensemble »), formule que Plotin emprunte à **Anaxagore**. Il l'illustre en __IV, 4, 1__ (traité 28) par la perception d'un visage : l'intuition le saisit d'un coup, yeux, nez et bouche ensemble, là où la pensée discursive l'examine partie par partie. À ce niveau, le sujet ne se pense même plus comme une personne particulière, un « Socrate », mais s'identifie entièrement à l'être et à la pensée intelligibles (__V, 3, 4__, traité 49).

    ! Contempler les Formes une par une, « une Forme, puis une autre », ce n'est pas encore être l'Intellect : ce parcours successif est le propre de l'âme discursive (`dianoia`). Plotin précise que l'Intellect ne voit pas les choses alternativement, les unes après les autres (__VI, 7, 35__).
  points:
  - id: g-noothenai-l1-1
    sentence: "Le verbe grec, translittéré, par lequel Plotin désigne le processus où l'âme, transformée et illuminée par l'Intellect, s'élève au-dessus de la raison discursive pour devenir elle-même intellect est ___."
    answer: noōthēnai
    alt: []
  - id: g-noothenai-l1-2
    sentence: "`Noōthēnai`, qui nomme le passage de l'âme au niveau de la seconde hypostase, se traduit en français par « devenir ___ »."
    answer: intellect
    alt: []
  - id: g-noothenai-l1-3
    sentence: "Le participe passif de `noōthēnai`, par lequel Plotin désigne « l'âme devenue intellect », est ___."
    answer: noōtheisa
    alt: []
  - id: g-noothenai-l1-4
    sentence: "Parce qu'il est forgé sur ___, le nom grec de l'Intellect, le verbe `noōthēnai` désigne exclusivement la coïncidence de l'âme avec la seconde hypostase, et non avec l'Âme ou l'Un."
    answer: Noûs
    alt: []
  - id: g-noothenai-l1-5
    sentence: "Plotin emploie `noōthēnai` pour le moment où l'âme se détache du corps pour être « intellectualisée » par la lumière d'en haut, notamment dans le chapitre où il précise que l'Intellect ne voit pas les choses les unes après les autres, en ___."
    answer: VI, 7, 35
    alt: []
  - id: g-noothenai-l1-6
    sentence: "Que la vertu contemplative, à son plus haut degré, consiste précisément à s'intellectualiser (`noōthēnai`), Plotin l'affirme dans le traité *Des vertus*, en ___."
    answer: I, 2, 6
    alt: []
  - id: g-noothenai-l1-7
    sentence: "Devenue intellect, l'âme ne parcourt plus les Formes une à une mais les saisit toutes à la fois, ce que Plotin exprime par la formule « tout est ensemble », en grec, translittéré, ___."
    answer: homou panta
    alt: []
  - id: g-noothenai-l1-8
    sentence: "La formule « tout est ensemble » (`homou panta`), par laquelle Plotin décrit la saisie simultanée de toutes les Formes par l'Intellect, est empruntée à ___."
    answer: Anaxagore
    alt: []
  - id: g-noothenai-l1-9
    sentence: "Pour distinguer l'intuition intellectuelle de la pensée discursive, Plotin prend l'exemple de la perception d'un ___, saisi d'un seul coup dans sa totalité unifiée, là où la pensée discursive l'examine partie par partie."
    answer: visage
    alt: []
  - id: g-noothenai-l1-10
    sentence: "L'exemple du visage, saisi d'un seul coup par l'intuition intellectuelle mais examiné partie par partie par la pensée discursive, se trouve en ___."
    answer: IV, 4, 1
    alt: []
  - id: g-noothenai-l1-11
    sentence: "Élevé au niveau de l'Intellect, le sujet ne se pense plus comme une personne particulière, par exemple en tant que « ___ », mais s'identifie entièrement à l'être et à la pensée intelligibles."
    answer: Socrate
    alt: []
  - id: g-noothenai-l1-12
    sentence: "Que le sujet élevé à l'Intellect cesse de se penser comme une personne particulière, par exemple en tant que « Socrate », pour s'identifier à l'être et à la pensée intelligibles, Plotin l'expose en ___."
    answer: V, 3, 4
    alt: []
  - id: g-noothenai-l1-13
    sentence: "Contempler les Formes une à une, « une Forme, puis une autre », ce n'est pas encore être l'Intellect, mais penser au niveau de l'âme discursive, la ___."
    answer: dianoia
    alt: []
  - id: g-noothenai-l1-14
    sentence: "Plotin précise que l'Intellect ne voit pas les choses ___, les unes après les autres : le déroulement successif n'appartient qu'au raisonnement de l'âme ou à la parole didactique."
    answer: alternativement
