    answer: egersis
    alt: []
  - id: g-noothenai-l2-2
    sentence: "L'*egersis*, image par laquelle Plotin décrit la libération de l'âme hors du sommeil de la matière, sans nommer ce qu'elle devient, se traduit par « ___ »."
    answer: éveil
    alt: ["réveil"]
  - id: g-noothenai-l2-3
    sentence: "Plotin décrit sa propre expérience de l'élévation de l'âme : « Souvent, lorsque je m'___ à moi-même en sortant de mon corps, et qu'à l'écart des autres choses je rentre à l'intérieur de moi, je vois une beauté d'une force admirable »."
    answer: éveille
    alt: []
  - id: g-noothenai-l2-q1
    sentence: "« Souvent, lorsque je m'éveille à moi-même en sortant de mon corps, et qu'à l'écart des autres choses je rentre à l'intérieur de moi, je vois ___ » (traité 6, chap. 1, l. 1-3)."
    answer: une beauté d'une force admirable
    alt: []
  - id: g-noothenai-l2-q2
    sentence: "Le passage où Plotin décrit sa propre expérience, « Souvent, lorsque je m'éveille à moi-même en sortant de mon corps », ouvre le traité ___, *Sur la descente de l'âme dans les corps*."
