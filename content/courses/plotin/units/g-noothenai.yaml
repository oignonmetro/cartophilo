- id: g-noothenai-l2
  title: Devenir intellect, ou s'éveiller
  notes: |-
    Pour dire le fait, pour notre âme, de **« devenir l'Intellect »**, `noōthēnai` est plus exact que l'**éveil** (`egersis`), autre image de la remontée chez Plotin : l'éveil dit {sky}comment l'âme se libère{/sky}, `noōthēnai` nomme {amber}ce que l'âme devient{/amber}.

    |  | `egersis` | `noōthēnai` |
    | **Nature** | une image | une définition |
    | **Ce qu'il dit** | ce dont on se libère | ce que l'âme devient |
    | **Portée** | à plusieurs degrés | l'Intellect seul |

    **L'éveil vient d'une expérience vécue.** En __IV, 8, 1__ (traité 6), Plotin écrit : « Souvent, lorsque je m'éveille à moi-même en sortant de mon corps, et qu'à l'écart des autres choses je rentre à l'intérieur de moi, je vois une beauté d'une force admirable [...] », jusqu'à se découvrir « devenu identique au divin, installé en lui ». Et en __III, 6, 6__ (traité 26) : « être dans le corps, pour l'âme, c'est dormir ». Mais l'image dit le sommeil de la matière qu'on quitte, pas la structure où la conscience s'établit, et elle se décline à plusieurs degrés (éveil à la beauté, à la vertu, à l'Un) : on peut être éveillé sans être encore identifié à tout l'intelligible. Avec `noōthēnai`, l'âme ne fait plus face à l'Intellect comme un spectateur devant un paysage, **elle devient le paysage intelligible lui-même**.

    Ce « devenir » a deux faces :

    - Prendre conscience : nous étions déjà ces réalités intelligibles avant notre génération corporelle, le sommet « non descendu » de l'âme n'a jamais quitté l'intelligible ; devenir intellect, c'est passer de la puissance à l'acte au niveau de la conscience (`sunaisthēsis`).
    - Coïncider : en __VI, 5, 7__ (traité 23), « nous sommes les intelligibles ; nous ne les recevons pas, mais nous sommes en eux [...] Nous sommes donc à la fois toutes choses et une seule ».

    ! Devenir intellect n'est ni une génération temporelle ni une transformation de substance : l'Intellect demeure éternellement dans le présent simultané, et le « devenir » y est plus équivoque qu'au niveau de l'Âme. Plotin encadre d'ailleurs ce langage de précautions comme `hoion` (« comme si »).
  points:
  - id: g-noothenai-l2-1
    sentence: "Pour dire le fait, pour notre âme, de devenir l'Intellect, `noōthēnai` est plus exact que l'image de l'éveil, qui dit ce dont l'âme se libère plutôt que ce qu'elle devient ; cet éveil se nomme en grec, translittéré, ___."
    answer: egersis
    alt: []
  - id: g-noothenai-l2-2
    sentence: "L'`egersis`, image par laquelle Plotin décrit la libération de l'âme hors du sommeil de la matière, sans nommer ce qu'elle devient, se traduit par « ___ »."
    answer: éveil
    alt: ["réveil"]
  - id: g-noothenai-l2-3
    sentence: "Plotin décrit sa propre expérience de l'élévation de l'âme : « Souvent, lorsque je m'___ à moi-même en sortant de mon corps, et qu'à l'écart des autres choses je rentre à l'intérieur de moi, je vois une beauté d'une force admirable »."
    answer: éveille
    alt: []
  - id: g-noothenai-l2-4
    sentence: "Le passage où Plotin décrit sa propre expérience d'élévation, lorsqu'il « s'éveille à lui-même en sortant de son corps » et se découvre « devenu identique au divin », se lit en ___."
    answer: IV, 8, 1
    alt: []
  - id: g-noothenai-l2-5
    sentence: "L'image plotinienne de l'éveil repose sur une formule : « être dans le corps, pour l'âme, c'est ___ »."
    answer: dormir
    alt: []
  - id: g-noothenai-l2-6
    sentence: "La formule selon laquelle « être dans le corps, pour l'âme, c'est dormir », qui fonde l'image plotinienne de l'éveil, se lit en ___."
    answer: III, 6, 6
    alt: []
  - id: g-noothenai-l2-7
    sentence: "Avec `noōthēnai`, l'âme ne fait plus face à l'Intellect comme un spectateur éveillé devant un paysage : elle devient le ___ intelligible lui-même, en coïncidant avec les Formes."
    answer: paysage
    alt: []
  - id: g-noothenai-l2-8
    sentence: "Nous étions déjà les réalités intelligibles avant notre génération corporelle ; devenir intellect, c'est donc passer de la puissance à l'acte au niveau de la conscience, par une prise de conscience que le grec nomme, translittéré, ___."
    answer: sunaisthēsis
    alt: ["synaisthēsis"]
  - id: g-noothenai-l2-9
    sentence: "Plotin formule l'identification de l'âme aux intelligibles : « nous sommes les intelligibles ; nous ne les ___ pas, mais nous sommes en eux »."
    answer: recevons
    alt: []
  - id: g-noothenai-l2-10
    sentence: "Pour dire que l'âme qui pense véritablement coïncide avec les intelligibles, Plotin conclut : « Nous sommes donc à la fois toutes choses et ___ »."
    answer: une seule
    alt: []
  - id: g-noothenai-l2-11
    sentence: "La formule « nous sommes les intelligibles ; nous ne les recevons pas, mais nous sommes en eux », qui dit l'identification de l'âme aux intelligibles, se lit en ___."
    answer: VI, 5, 7
    alt: []
  - id: g-noothenai-l2-12
    sentence: "Parce que le devenir s'oppose en toute rigueur à l'être et à l'éternité, Plotin encadre le langage du « devenir-intellect » de précautions comme le terme grec, translittéré, ___, « comme si »."
    answer: hoion
    alt: []
