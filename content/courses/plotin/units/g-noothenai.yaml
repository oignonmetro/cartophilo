    sentence: "« L'individu n'a pas du tout le souvenir de lui-même ; il ne se rappelle pas non plus si c'est cet homme, ___ par exemple, qui contemple » (traité 28, chap. 2, l. 1-3)."
    answer: Socrate
    alt: []
  - id: g-noothenai-l1-q9
    sentence: "Que celui qui contemple l'intelligible ne se rappelle pas si c'est « cet homme, Socrate par exemple », qui contemple, Plotin l'écrit au chapitre 2 du traité ___."
    answer: 28 (IV, 4)
    alt: ["28", "IV, 4"]
  - id: g-noothenai-l1-q10
