  points:
  - id: g-noothenai-l1-1
    sentence: "Le verbe grec, translittéré, par lequel Plotin désigne le processus où l'âme, transformée et illuminée par l'Intellect, s'élève au-dessus de la raison discursive pour devenir elle-même intellect est ___."
    answer: noôthênai
    alt: []
  - id: g-noothenai-l1-2
    sentence: "*Noôthênai*, qui nomme le passage de l'âme au niveau de la seconde hypostase, se traduit en français par « devenir ___ »."
    answer: intellect
    alt: []
  - id: g-noothenai-l1-3
    sentence: "Le participe passif de *noôthênai*, par lequel Plotin désigne l'âme devenue intellect, est ___."
    answer: noôtheisa
    alt: []
  - id: g-noothenai-l1-4
    sentence: "Parce qu'il est forgé sur ___, le nom grec de l'Intellect, le verbe *noôthênai* désigne exclusivement la coïncidence de l'âme avec la seconde hypostase, et non avec l'Âme ou l'Un."
    answer: Noûs
    alt: []
  - id: g-noothenai-l1-q1
    sentence: "Si l'âme contemple, « c'est qu'elle est devenue intellect, qu'elle s'est ___ faite intellect, et qu'elle se trouve dans \"le lieu intelligible\" » (traité 38, chap. 35, l. 3-5)."
    answer: pour ainsi dire
    alt: []
  - id: g-noothenai-l1-q2
    sentence: "Si l'âme contemple, « c'est qu'elle est devenue intellect, qu'elle s'est pour ainsi dire faite intellect, et qu'elle se trouve dans \"___\" » (traité 38, chap. 35, l. 3-5)."
    answer: le lieu intelligible
    alt: []
  - id: g-noothenai-l1-q3
    sentence: "« Si donc la vertu est comme un autre ___, et qu'elle est un état qui fait que, d'une certaine façon, l'âme s'intellectualise » (traité 39, chap. 5, l. 34-35)."
    answer: intellect
    alt: []
  - id: g-noothenai-l1-q4
    sentence: "Plotin applique le verbe *noôthênai* à la vertu, « un état qui fait que, d'une certaine façon, l'âme s'intellectualise », au chapitre 5 du traité ___."
    answer: 39 (VI, 8)
    alt: ["39", "VI, 8"]
  - id: g-noothenai-l1-q5
    sentence: "Parce que la vertu fait que l'âme s'intellectualise, la vertu la plus haute n'est pas pour Plotin une règle de conduite, mais une manière de ___ qui transforme celui qui pense."
    answer: penser
    alt: []
  - id: g-noothenai-l1-7
    sentence: "Devenue intellect, l'âme ne parcourt plus les Formes une à une mais les saisit toutes à la fois, ce que Plotin exprime par la formule « tout est ensemble », en grec, translittéré, ___."
    answer: homou panta
    alt: []
  - id: g-noothenai-l1-8
    sentence: "La formule « tout est ensemble » (*homou panta*), par laquelle Plotin décrit la saisie simultanée de toutes les Formes par l'Intellect, est empruntée à ___."
    answer: Anaxagore
    alt: []
  - id: g-noothenai-l1-q6
    sentence: "Une intellection variée peut être une, « comme les multiples actes de sensation qui servent à constituer un ___ : on voit d'un seul coup les yeux, le nez et les autres parties » (traité 28, chap. 1, l. 23-25)."
    answer: visage
    alt: []
  - id: g-noothenai-l1-q7
    sentence: "« Comme les multiples actes de sensation qui servent à constituer un visage : on voit ___ les yeux, le nez et les autres parties » (traité 28, chap. 1, l. 23-25)."
    answer: d'un seul coup
    alt: ["d'un coup"]
