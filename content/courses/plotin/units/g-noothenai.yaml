  - id: g-noothenai-l2-q3
    sentence: "L'image de l'éveil dit ce qu'on quitte, non où l'on s'établit : elle se décline à plusieurs degrés, et l'on peut être éveillé sans être encore ___ à tout l'intelligible."
    answer: identifié
    alt: ["identifie"]
  - id: g-noothenai-l2-7
    sentence: "Avec *noôthênai*, l'âme ne fait plus face à l'Intellect comme un spectateur éveillé devant un paysage : elle devient le ___ intelligible lui-même, en coïncidant avec les Formes."
