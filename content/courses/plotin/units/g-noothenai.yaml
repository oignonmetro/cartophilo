# Entrée du glossaire de Plotin (skill glossaire), refondue le 2026-10-21 :
# une leçon, cartes reprises avec leurs identifiants. Citations vérifiées sur
# la GF (VI, 7, 35 ; VI, 8, 5 ; IV, 4, 1-2 ; I, 1, 8 et 11 ; IV, 8, 1 ;
# III, 6, 6 ; VI, 5, 7).

id: g-noothenai
title: Devenir intellect (`noôthênai`)
subtitle: Le moment où l'âme cesse de raisonner pas à pas pour penser comme l'Intellect, tout d'un coup, et devient ce qu'elle pense
icon: book
color: coral
lessons:
- id: g-noothenai-l1
  title: Devenir intellect
  notes: |-
    Chez Plotin, {violet}**devenir intellect**{/violet} (*noôthênai*) est le moment où l'âme {pink}cesse de raisonner pas à pas{/pink} pour {green}penser comme l'Intellect, tout d'un coup{/green}, et devient ce qu'elle pense : la deuxième étape de la remontée, entre la vie de l'âme et l'[[g-henosis|hénose]].

    __**Un mot qui dit exactement le terme.**__ Forgé sur *noûs*, le verbe ne désigne rien d'autre que la coïncidence avec l'{violet}[[g-intellect|Intellect]]{/violet}. Si l'âme contemple, « c'est qu'elle est devenue intellect, qu'elle s'est __pour ainsi dire faite intellect__, et qu'elle se trouve dans "le lieu intelligible" » ([[traite38|traité 38]], chap. 35). Et Plotin l'applique à la vertu : « si donc la vertu est comme un autre intellect, et qu'elle est un état qui fait que, d'une certaine façon, __l'âme s'intellectualise__ » ([[traite39|traité 39]], chap. 5). La vertu la plus haute n'est donc pas une règle de conduite, mais une manière de penser.

    __**Ce qui change : une pensée qui ne cherche plus.**__ La pensée de l'âme est discursive (*dianoia*) : elle va d'une idée à l'autre. Devenue intellect, l'âme voit d'un coup ce qu'elle cherchait, parce qu'elle ne se tient plus devant les choses mais en elles : {violet}*homou panta*{/violet}, « toutes choses ensemble » (voir [[g-noesis|pensée]]). {yellow}On voit d'un seul coup un visage{/yellow} : une intellection variée peut être une, « comme les multiples actes de sensation qui servent à constituer un visage : __on voit d'un seul coup__ les yeux, le nez et les autres parties » ([[traite28|traité 28]], chap. 1).

    __**Ce qui disparaît : le souvenir de soi comme individu.**__ Dans l'intelligible, « l'individu n'a pas du tout le souvenir de lui-même ; il ne se rappelle pas non plus __si c'est cet homme, Socrate par exemple__, qui contemple » ([[traite28|traité 28]], chap. 2). Ce n'est pas une perte : nous devenons l'intelligible en nous offrant à lui comme une matière, et nous prenons forme selon ce que nous voyons. « Nous sommes les intelligibles ; __nous ne les recevons pas, mais nous sommes en eux__ » ([[traite23|traité 23]], chap. 7).

    __**Ce que nous sommes dépend de ce dont nous faisons usage.**__ « Nous ne faisons pas toujours usage de tout ce que nous possédons » ([[traite53|traité 53]], chap. 11). Le [[g-hemeis|« nous »]] se tient entre le vivant et l'Intellect, et l'Intellect est déjà « à nous », par notre [[g-ame-non-descendue|âme non descendue]]. **Devenir intellect, c'est donc moins acquérir que prendre conscience** : plus nous pensons pour comprendre, et non pour désirer ou craindre, plus nous sommes ce que nous possédions déjà.

    __**Plus exact que l'image de l'éveil.**__ Plotin dit aussi de l'âme qu'elle s'éveille : « Souvent, lorsque __je m'éveille à moi-même en sortant de mon corps__, et qu'à l'écart des autres choses je rentre à l'intérieur de moi, je vois une beauté d'une force admirable » ([[traite6|traité 6]], chap. 1), car « être dans le corps, pour l'âme, c'est dormir » ([[traite26|traité 26]], chap. 6). Mais l'éveil dit ce dont on se libère, non où l'on s'établit : on peut être éveillé sans être encore identifié à tout l'intelligible.

    |  | *egersis* | *noôthênai* |
    | **Nature** | une image | une définition |
    | **Ce qu'il dit** | ce dont on se libère | ce que l'âme devient |
    | **Portée** | à plusieurs degrés | l'Intellect seul |

    ! Contempler les Formes une par une, ce n'est pas encore être l'Intellect : l'Intellect ne voit pas les choses « alternativement, d'abord les unes puis les autres », et c'est le discours qui, « en vue de l'enseignement », place ces processus dans le devenir ([[traite38|traité 38]], chap. 35). D'où les précautions de Plotin : l'âme s'est « pour ainsi dire » faite intellect.

    **Voir aussi** : [[g-intellect|Intellect]] · [[g-noesis|Pensée]] · [[g-henosis|Hénose]] · [[g-hemeis|Soi, soi-même]] · [[g-ame-non-descendue|Âme non descendue]]
