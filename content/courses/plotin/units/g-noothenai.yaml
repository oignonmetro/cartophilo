lessons:
- id: g-noothenai-l1
  title: S'intellectualiser
  notes: |-
    **Devenir intellect** (*noôthênai*, infinitif aoriste passif d'un verbe forgé sur *noûs*) **nomme le moment où l'âme cesse de raisonner pas à pas pour penser à la manière de l'Intellect, tout d'un coup.** C'est la deuxième étape de la remontée, entre la vie de l'âme et l'union à l'Un.

    __**Un mot qui dit exactement le terme.**__ Parce qu'il est forgé sur *noûs*, le nom même de la seconde hypostase, le verbe ne désigne rien d'autre que la coïncidence avec l'Intellect. Plotin l'emploie au sommet de la remontée : si l'âme contemple, {teal}« c'est qu'elle est devenue intellect, qu'elle s'est pour ainsi dire faite intellect, et qu'elle se trouve dans "le lieu intelligible" »{/teal} (traité 38 [VI, 7], chap. 35, l. 3-5). Et il l'applique à la vertu : {teal}« si donc la vertu est comme un autre intellect, et qu'elle est un état qui fait que, d'une certaine façon, l'âme s'intellectualise »{/teal} (traité 39 [VI, 8], chap. 5, l. 34-35). **La vertu la plus haute n'est donc pas une règle de conduite, mais une manière de penser qui transforme celui qui pense.**

    __**Ce qui change : une pensée qui ne cherche plus.**__ La pensée de l'âme est {pink}discursive{/pink} (*dianoia*) : elle va d'une idée à l'autre, elle cherche. Devenue intellect, l'âme {green}voit d'un coup{/green} ce qu'elle cherchait, parce qu'elle ne se tient plus devant les choses mais en elles : {violet}*homou panta*{/violet}, « toutes choses ensemble », formule que Plotin emprunte à {sky}Anaxagore{/sky}. Il en donne une image tirée de la perception : une intellection variée peut être une, {teal}« comme les multiples actes de sensation qui servent à constituer un visage : on voit d'un seul coup les yeux, le nez et les autres parties »{/teal} (traité 28 [IV, 4], chap. 1, l. 23-25).

    __**Ce qui disparaît : le souvenir de soi comme individu.**__ Dans l'intelligible, {teal}« l'individu n'a pas du tout le souvenir de lui-même ; il ne se rappelle pas non plus si c'est cet homme, Socrate par exemple, qui contemple »{/teal} (traité 28 [IV, 4], chap. 2, l. 1-3). Ce n'est pas une perte : {coral}**nous devenons l'intelligible en nous offrant à lui comme une matière, et nous prenons forme en fonction de ce que nous voyons**{/coral} (l. 6-8).

    __**Ce que cela peut nous faire.**__ Pour Plotin, ce que nous sommes dépend de ce dont nous faisons usage : {teal}« nous ne faisons pas toujours usage de tout ce que nous possédons »{/teal} (traité 53 [I, 1], chap. 11, l. 5-6). « Nous » nous tenons entre le vivant et l'Intellect ; plus nous pensons pour comprendre, et non pour désirer ou craindre, plus nous nous rapprochons de l'Intellect. **Notre identité n'est donc pas donnée une fois pour toutes : la qualité de notre pensée change ce que nous sommes.**

    __**Le faisons-nous déjà ?**__ À moitié. Nous **possédons** déjà l'Intellect : il est « à nous », parce que notre âme est intelligible à sa façon (traité 53, chap. 8), et sa partie la plus haute n'est jamais descendue. Chaque fois que nous comprenons, nous exerçons à petite échelle une activité de cet ordre. Mais l'identification complète, où l'on ne se rappelle même plus être « Socrate », est un terme que l'on approche, non un état de tous les jours.

    ! Contempler les Formes une par une, ce n'est pas encore être l'Intellect : ce parcours est le propre de la *dianoia*. Plotin précise que l'Intellect ne voit pas les choses « alternativement, d'abord les unes puis les autres », et que c'est le discours qui, « en vue de l'enseignement », place ces processus dans le devenir (traité 38 [VI, 7], chap. 35, l. 27-29).
