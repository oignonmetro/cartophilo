- id: g-noothenai-l2
  title: Devenir intellect, ou s'éveiller
  notes: |-
    **Pour dire ce que devient l'âme qui rejoint l'Intellect, *noôthênai* est plus exact que l'image de l'éveil** (*egersis*), autre figure de la remontée chez Plotin : l'éveil dit {sky}ce dont l'âme se libère{/sky}, *noôthênai* nomme {amber}ce qu'elle devient{/amber}.

    |  | *egersis* | *noôthênai* |
    | **Nature** | une image | une définition |
    | **Ce qu'il dit** | ce dont on se libère | ce que l'âme devient |
    | **Portée** | à plusieurs degrés | l'Intellect seul |

    __**L'éveil vient d'une expérience vécue.**__ Le traité 6 s'ouvre sur un aveu : {teal}« Souvent, lorsque je m'éveille à moi-même en sortant de mon corps, et qu'à l'écart des autres choses je rentre à l'intérieur de moi, je vois une beauté d'une force admirable »{/teal} (traité 6 [IV, 8], chap. 1, l. 1-3). L'image repose sur une thèse : {teal}« être dans le corps, pour l'âme, c'est dormir »{/teal} (traité 26 [III, 6], chap. 6, l. 71).

    __**Mais l'image dit ce qu'on quitte, non où l'on s'établit.**__ Elle se décline à plusieurs degrés (éveil à la beauté, à la vertu, à l'Un) : {pink}on peut être éveillé sans être encore identifié à tout l'intelligible{/pink}. Avec *noôthênai*, {green}l'âme ne fait plus face à l'Intellect comme un spectateur devant un paysage, elle devient le paysage intelligible lui-même{/green}.

    __**Ce « devenir » a deux faces.**__

    - Prendre conscience : nous étions déjà ces réalités par notre partie non descendue ; devenir intellect, c'est passer de la puissance à l'acte au niveau de la conscience (*sunaisthêsis*)
    - Coïncider : {teal}« si donc nous avons part à la connaissance véritable, nous sommes les intelligibles ; nous ne les recevons pas, mais nous sommes en eux »{/teal}, et {teal}« nous sommes donc à la fois toutes choses et une seule »{/teal} (traité 23 [VI, 5], chap. 7, l. 4-9)

    **Ce n'est donc pas un exploit réservé à quelques-uns, mais une attention à tourner** : on s'éveille quand on cesse de se confondre avec le corps, ses désirs et ses craintes. Plotin n'en fait pourtant pas un état permanent : l'expérience lui arrive « souvent », puis vient la redescente vers la pensée raisonnante (traité 6, chap. 1).

    ! Devenir intellect n'est ni une génération temporelle ni une transformation de substance : l'Intellect demeure dans l'éternité, et le « devenir » y est plus équivoque qu'au niveau de l'Âme. D'où les précautions de Plotin, comme *hoion* (« pour ainsi dire », « comme si ») : l'âme s'est « pour ainsi dire » faite intellect.
