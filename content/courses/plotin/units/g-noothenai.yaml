    sentence: "Contempler les Formes une à une, l'une puis l'autre, ce n'est pas encore être l'Intellect, mais penser au niveau de l'âme discursive, la ___."
    answer: dianoia
    alt: []
  - id: g-noothenai-l1-q12
    sentence: "L'Intellect ne voit pas les choses « ___, d'abord les unes puis les autres » : c'est le discours qui, « en vue de l'enseignement », place ces processus dans le devenir (traité 38, chap. 35, l. 27-29)."
    answer: alternativement
    alt: []
