- id: g-amour-l4
  title: Le désir avant la pensée, l'amour au sommet
  notes: |-
    **L'amour n'est pas seulement le ressort de l'âme : il est à l'origine de la pensée.** Pourquoi l'Intellect pense-t-il ? Parce qu'il désire le Bien. « Voici ce qu'est intelliger : un mouvement qui se porte vers le Bien en le désirant. Car le désir a engendré l'intellection » (V, 6 [24], 5, 8-10). Le désir (`ephesis`) est donc plus originaire que la pensée.

    **Ce désir est universel ; l'amour du beau ne l'est pas.** Le désir du Bien est connaturel, présent même à ceux qui dorment ; l'amour du beau suppose d'avoir vu le beau, et il provoque la stupeur, le choc, les **douleurs de l'enfantement** (V, 5 [32], 12). C'est que le Beau, que Plotin rattache à l'Intellect, vient en second : le Bien est plus ancien.

    | Le désir du Bien | L'amour du beau |
    | connaturel, présent même à ceux qui dorment | suppose d'avoir vu le beau |
    | doux, sans stupeur | stupeur, choc, plaisir mêlé de douleur |

    **Au sommet, l'amour n'est plus un manque.** « Et il est à la fois objet d'amour et lui-même amour, c'est-à-dire qu'il est amour de soi » (VI, 8 [39], 15, 1 : `erasmion kai erôs kai hautou erôs`). Partout ailleurs, on aime ce qui manque ; ici, ce qui aime est identique à ce qu'il aime. Plotin s'en sert, dans un traité sur la liberté de l'Un, pour dire qu'il n'est soumis à rien d'autre que lui-même.

    ! L'amour de soi de l'Un n'introduit en lui aucune dualité : l'aimant, l'aimé et l'amour y sont une seule et même chose, ce qui le distingue de tout autre amour.
