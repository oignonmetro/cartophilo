id: g-amour
title: Amour (`erôs`)
subtitle: Passion, démon ou dieu selon l'âme qui l'engendre, regard tendu vers ce qui manque, et jusqu'au Bien, amour de soi
icon: book
color: coral
lessons:
- id: g-amour-l1
  title: Passion, démon, dieu
  notes: |-
    **Plotin ne choisit pas entre les portraits contradictoires que Platon donne de l'amour : il les range à des niveaux de réalité différents.** C'est ainsi qu'il fait d'une notion de la vie affective une pièce de sa métaphysique.

    __**La question.**__ Le {sky}*Phèdre*{/sky} fait de l'amour un dieu, et aussi une passion qui possède l'âme ; le {sky}*Banquet*{/sky} en fait tantôt un dieu lié à Aphrodite, tantôt un démon indigent, fils de Poros et de Pénia. Le [[traite50|traité 50]] s'ouvre donc sur une alternative : « De l'amour, dira-t-on qu'il est un dieu, un démon ou une passion de l'âme ? » (chap. 1, l. 1-2). Sa réponse : {green}les trois, selon l'âme dont l'amour procède{/green}. Il suit lui-même cet ordre : la passion (chap. 1), le dieu (chap. 2-4), le démon (chap. 5-9).

    | Niveau | D'où il naît | Ce qu'il est |
    | dieu | l'âme pure, tournée vers l'Intellect | un regard rempli de ce qu'il contemple |
    | démon | l'âme mêlée au corps | un intermédiaire, toujours indigent |
    | passion | l'âme incarnée devant un beau corps | une affection, née d'une parenté avec le beau |

    __**Pourquoi cette solution tient : un Éros est toujours l'acte d'une âme.**__ Éros est l'acte de l'âme qui s'efforce vers le bien (chap. 4). **Il a donc le rang de l'âme qui l'engendre** : {coral}dieu si elle est pure, démon si elle est mêlée{/coral}. Chaque âme a ainsi son Éros, qui est le démon qui l'accompagne ; et les Éros particuliers sont dans l'Éros universel comme les âmes particulières dans l'Âme universelle.

    __**Même la passion a une cause qui n'est pas corporelle.**__ On aime un bel objet parce que l'âme a une {violet}**parenté**{/violet} avec la beauté, le sens irraisonné d'une affinité (chap. 1) : {coral}l'amour des corps est déjà, sans le savoir, un amour de ce dont le corps est l'image.{/coral}

    __**Éros a une existence propre.**__ L'âme pure, éprise de l'Intellect, a engendré Éros, et « son activité a produit une existence, c'est-à-dire une réalité » (chap. 2, l. 35-36 ; *hupostasis kai ousia*). Le « c'est-à-dire » explique plus qu'il n'ajoute : **Éros n'est pas un affect passager, mais une réalité qui subsiste**, engendrée par l'âme comme l'âme l'est par l'Intellect.

    ! Éros n'est pas d'abord un sentiment : la passion n'en est que le degré le plus bas.
