  points:
  - id: g-amour-l1-1
    sentence: "Le traité de Plotin consacré à l'amour, qui se demande si Éros est divinité, démon ou affection de l'âme, est le traité ___ (III, 5)."
    answer: "50"
    alt: ["cinquante"]
  - id: g-amour-l1-q1
    sentence: "« De l'amour, dira-t-on qu'il est un dieu, un ___ ou une passion de l'âme ? » (traité 50, chap. 1, l. 1-2)."
    answer: démon
    alt: ["demon"]
  - id: g-amour-l1-2
    sentence: "Plotin ne choisit pas entre le dieu du *Phèdre* et le démon du *Banquet* : il range ces portraits de l'amour à des ___ de réalité différents."
    answer: niveaux
    alt: ["degrés", "degres"]
  - id: g-amour-l1-3
    sentence: "Éros est l'___ de l'âme qui s'efforce vers le bien (traité 50, chap. 4) : c'est pourquoi il a le rang de l'âme qui l'engendre."
    answer: acte
    alt: ["activité", "activite"]
  - id: g-amour-l1-q2
    sentence: "Le pivot de la solution de Plotin est le suivant : puisqu'un Éros est toujours l'acte d'une âme, il a le ___ de l'âme qui l'engendre, dieu si elle est pure, démon si elle est mêlée."
    answer: rang
    alt: []
  - id: g-amour-l1-4
    sentence: "Dans le traité 50 (traité 50, chap. 4), l'Éros de l'âme pure est un dieu ; celui de l'âme ___ est un démon."
    answer: mélangée
    alt: ["melangee", "mêlée"]
  - id: g-amour-l1-5
    sentence: "Chaque âme a son Éros propre, qui est le ___ qui l'accompagne (traité 50, chap. 4)."
    answer: démon
    alt: ["demon", "daimôn"]
  - id: g-amour-l1-6
    sentence: "Les Éros particuliers sont dans l'Éros universel comme les âmes particulières dans l'___ universelle (traité 50, chap. 4)."
    answer: Âme
    alt: ["âme", "ame"]
  - id: g-amour-l1-7
    sentence: "La cause de la passion amoureuse est une ___ de l'âme avec la beauté, le sens irraisonné d'une affinité (traité 50, chap. 1)."
    answer: parenté
    alt: ["parente"]
  - id: g-amour-l1-q3
    sentence: "L'âme pure a engendré Éros, et « son activité a produit une existence, c'est-à-dire une ___ » (traité 50, chap. 2, l. 35-36)."
    answer: réalité
    alt: ["realite"]
  - id: g-amour-l1-9
    sentence: "Pour dire que l'Éros divin n'est pas un affect passager mais une réalité qui subsiste, Plotin le nomme, en grec translittéré, ___ kai ousia, « une existence, c'est-à-dire une réalité » (traité 50, chap. 3)."
    answer: hupostasis
    alt: ["hupostasin", "hypostasis"]
  - id: g-amour-l2-q1
    sentence: "« Éros occupe une position intermédiaire entre qui désire et qui est désiré, il est l'___ de ce qui désire, fournissant à l'amant le moyen de voir par lui l'objet de son désir » (traité 50, chap. 2, l. 38-41)."
    answer: œil
    alt: ["oeil"]
  - id: g-amour-l2-q2
    sentence: "« Éros occupe une position ___ entre qui désire et qui est désiré, il est l'œil de ce qui désire » (traité 50, chap. 2, l. 38-40)."
    answer: intermédiaire
    alt: ["intermediaire"]
  - id: g-amour-l2-q3
    sentence: "Éros « est l'œil de ce qui désire, fournissant à l'amant le moyen de ___ par lui l'objet de son désir » (traité 50, chap. 2, l. 40-41)."
    answer: voir
    alt: []
  - id: g-amour-l2-2
    sentence: "L'Aphrodite céleste, d'où naît l'Éros divin, figure l'âme pure ; elle est née de ___, qui est l'Intellect (traité 50, chap. 2)."
    answer: Kronos
    alt: ["Cronos"]
  - id: g-amour-l2-3
    sentence: "Plotin fait venir le nom d'Éros de *horasis*, c'est-à-dire la ___ (traité 50, chap. 3)."
    answer: vision
    alt: []
  - id: g-amour-l2-4
    sentence: "Éros naît de l'âme tournée vers l'Intellect comme l'âme naît de l'Intellect tourné vers l'Un : à chaque degré, ce qui naît naît d'un ___ vers le haut."
    answer: regard
    alt: []
  - id: g-amour-l2-5
    sentence: "Parce qu'il reconduit vers sa source ce qui en est issu, l'amour est chez Plotin le mouvement même de la ___ (*epistrophê*)."
    answer: conversion
    alt: []
  - id: g-amour-l2-6
    sentence: "Éros, « l'œil de ce qui désire », n'est ni l'amant ni l'aimé, mais ce par quoi l'un ___ l'autre."
    answer: voit
    alt: []
  - id: g-amour-l4-q3
    sentence: "« Et il est à la fois objet d'amour et lui-même amour, c'est-à-dire qu'il est amour de ___, puisqu'il ne tient sa beauté de rien d'autre que de lui-même » (traité 39, chap. 15, l. 1-3)."
    answer: soi
    alt: []
  - id: g-amour-l4-q4
    sentence: "Le Bien est amour de soi, « puisqu'il ne tient sa ___ de rien d'autre que de lui-même » (traité 39, chap. 15, l. 1-3)."
    answer: beauté
    alt: ["beaute"]
  - id: g-amour-l4-8
    sentence: "Pour dire que le Bien est « objet d'amour », digne d'être aimé, Plotin emploie en VI, 8, 15 l'adjectif grec, translittéré, ___."
    answer: erasmion
    alt: []
  - id: g-amour-l4-7
    sentence: "Le traité où Plotin dit du Bien qu'il est amour de soi, pour montrer qu'il n'est soumis à rien, est le traité ___ (VI, 8)."
    answer: "39"
    alt: ["trente-neuf"]
