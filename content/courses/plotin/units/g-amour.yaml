- id: g-amour-l4
  title: Le désir avant la pensée, l'amour au sommet
  notes: |-
    **L'amour n'est pas seulement le ressort de l'âme : il est à l'origine de la pensée elle-même, et on le retrouve, transformé, jusque dans l'Un.**

    __**L'Intellect pense parce qu'il désire.**__ Pourquoi y a-t-il de la pensée ? « Voici ce qu'est intelliger : un mouvement qui se porte vers le Bien en le désirant. Car le désir a engendré l'intellection et l'a fait exister avec lui » ([[traite24|traité 24]], chap. 5, l. 8-10). **Le désir** (*ephesis*) **est donc plus originaire que la pensée** : l'Intellect n'est pas d'abord un regard neutre, c'est un élan vers le Bien qui, en se portant vers lui, devient pensée.

    __**Ce désir est universel ; l'amour du beau ne l'est pas.**__ Le désir du Bien est connaturel, présent même à ceux qui dorment ; l'amour du beau suppose d'avoir vu le beau, et il provoque la stupeur, le choc, les **douleurs de l'enfantement** ([[traite32|traité 32]], chap. 12). C'est que {coral}le Beau, que Plotin rattache à l'Intellect, vient en second : le Bien est plus ancien.{/coral}

    | Le désir du Bien | L'amour du beau |
    | connaturel, présent même à ceux qui dorment | suppose d'avoir vu le beau |
    | doux, sans stupeur | stupeur, choc, plaisir mêlé de douleur |

    __**Au sommet, l'amour n'est plus un manque.**__ « Et il est à la fois objet d'amour et lui-même amour, c'est-à-dire qu'il est amour de soi, puisqu'il ne tient sa beauté de rien d'autre que de lui-même » ([[traite39|traité 39]], chap. 15, l. 1-3 ; *erasmion kai erôs kai hautou erôs*). {pink}Partout ailleurs, on aime ce qui manque{/pink} ; {green}ici, ce qui aime est identique à ce qu'il aime{/green}. Plotin s'en sert, dans un traité sur la liberté de l'Un, pour dire qu'il n'est soumis à rien d'autre que lui-même.

    ! L'amour de soi de l'Un n'introduit en lui aucune dualité : l'aimant, l'aimé et l'amour y sont une seule et même chose, ce qui le distingue de tout autre amour.
