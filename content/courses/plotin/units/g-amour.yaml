- id: g-amour-l3
  title: Poros et Pénia, ou pourquoi l'amour n'est jamais comblé
  notes: |-
    **Au niveau démonique, Éros est un mixte, et c'est ce qui explique qu'il ne se repose jamais.** Plotin lit allégoriquement le mythe de Diotime (*Banquet*) : Éros est conçu de **Poros** (l'Expédient) et de **Pénia** (la Pauvreté). Or Poros est le **principe rationnel**, les raisons qui descendent de l'Intellect dans l'âme ; Pénia est **l'indétermination**, la matière (III, 5, 7 et 9).

    **D'où sa nature double.** Raison mêlée d'indétermination, Éros a l'ingéniosité de la raison et la maladresse de l'indigence : il sait chercher, mais ce qu'il reçoit ne le remplit pas, parce que l'indéterminé en lui ne retient rien. C'est un **désir frénétique qui ne peut être comblé** (7, 19).

    **Le mythe raconte dans le temps ce qui est éternel.** « Poros est ivre de nectar, car il n'y a pas encore de vin » (7, 1-3) : Éros est né avant le sensible. Les mythes **morcellent** en moments successifs ce qui est ensemble (9, 24-25) ; à qui les comprend de les réassocier.

    **L'amour vrai et l'amour faux.** Les amours conformes à la nature relèvent de la réalité véritable ; les amours contre nature ne sont que des affects, sans réalité (7, 42-44).

    ! Pénia n'est pas le mal moral : c'est l'indétermination qui fait d'Éros un démon toujours en manque, et donc toujours tendu vers ce qu'il n'a pas.
