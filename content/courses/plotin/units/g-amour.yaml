- id: g-amour-l3
  title: Poros et Pénia, ou pourquoi l'amour n'est jamais comblé
  notes: |-
    **Au niveau démonique, Éros est un mixte, et c'est ce qui explique qu'il ne se repose jamais.** Plotin lit allégoriquement le mythe de Diotime ({sky}*Banquet*{/sky}) : Éros est conçu de {yellow}**Poros** (l'Expédient){/yellow} et de {yellow}**Pénia** (la Pauvreté){/yellow}. Or Poros est le **principe rationnel**, les raisons qui descendent de l'Intellect dans l'âme ; Pénia est **l'indétermination**, la matière (chap. 7 et 9).

    __**D'où sa nature double.**__ Raison mêlée d'indétermination, Éros a {green}l'ingéniosité de la raison{/green} et {red}la maladresse de l'indigence{/red} : il sait chercher, mais ce qu'il reçoit ne le remplit pas, **parce que l'indéterminé en lui ne retient rien**. C'est un désir frénétique qui ne peut être comblé (chap. 7).

    __**Le mythe raconte dans le temps ce qui est éternel.**__ « Poros est ivre de nectar, car il n'y a pas encore de vin » (chap. 7, l. 1-3) : le détail montre qu'Éros est né avant le sensible. Les mythes **morcellent** en moments successifs ce qui est ensemble (chap. 9) ; à qui les comprend de les réassocier.

    __**L'amour vrai et l'amour faux.**__ Les amours conformes à la nature relèvent de la réalité véritable ; {red}les amours contre nature ne sont que des affects, sans réalité{/red} (chap. 7).

    ! Pénia n'est pas le mal moral : c'est l'indétermination qui fait d'Éros un démon toujours en manque, et donc toujours tendu vers ce qu'il n'a pas.
