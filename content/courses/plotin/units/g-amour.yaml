- id: g-amour-l2
  title: L'œil de ce qui désire
  notes: |-
    **Au niveau divin, Éros n'est pas un manque qui cherche à voir : c'est une vision.** L'âme pure, que Plotin figure par l'{yellow}**Aphrodite céleste**{/yellow}, née de **Kronos**, c'est-à-dire de l'Intellect, est éprise de lui ; de ce regard qu'elle lui porte naît Éros (chap. 2-3).

    __**Ni l'amant ni l'aimé, mais ce par quoi l'un voit l'autre.**__ « Éros occupe une position intermédiaire entre qui désire et qui est désiré, il est l'œil de ce qui désire, fournissant à l'amant le moyen de voir par lui l'objet de son désir » ([[traite50|traité 50]], chap. 2, l. 38-41). **L'image de l'œil dit exactement cela** : un œil n'est ni celui qui regarde ni ce qui est regardé, il est le regard lui-même, tendu et rempli de ce qu'il contemple. Plotin appuie l'idée sur une étymologie : le nom d'Éros viendrait de *horasis*, la **vision** (chap. 3).

    __**La même structure que toute la procession.**__ Éros vient de l'âme tournée vers l'Intellect, comme l'âme vient de l'Intellect tourné vers l'Un : {coral}à chaque degré, ce qui naît naît d'un regard vers le haut.{/coral} C'est pourquoi l'amour est le mouvement même de la {violet}**conversion**{/violet} (*epistrophê*) : il reconduit vers sa source ce qui en est issu.

    **Même l'Éros attaché aux unions d'ici-bas**, celui de l'âme du monde, que figure l'autre Aphrodite, fille de Zeus et de Dioné, ramène vers le haut les âmes aptes à se souvenir.

    ! « Éros-vision » n'est pas un terme de Plotin : le rapprochement d'*erôs* et de *horasis* est une étymologie qu'il propose, non un nom technique.
