- id: g-amour-l2
  title: L'œil de ce qui désire
  notes: |-
    **Au niveau divin, Éros n'est pas un manque qui cherche à voir : c'est une vision.** L'âme pure, que Plotin figure par l'**Aphrodite céleste**, née de **Kronos**, c'est-à-dire de l'Intellect, est éprise de lui ; de ce regard qu'elle lui porte naît Éros (III, 5, 2-3). D'où sa formule : Éros est **« l'œil de ce qui désire »**, l'intermédiaire qui donne à l'amant le moyen de voir l'objet de son désir (2, 39-41).

    **Pourquoi un œil ?** Parce qu'Éros n'est ni l'amant ni l'aimé, mais ce par quoi l'un voit l'autre : un regard tendu, **rempli** de ce qu'il contemple. Plotin appuie cette idée sur une étymologie : le nom d'Éros viendrait de `horasis`, la **vision** (3, 14-15).

    **La même structure que toute la procession.** Éros vient de l'âme tournée vers l'Intellect, comme l'âme vient de l'Intellect tourné vers l'Un : à chaque degré, ce qui naît naît d'un **regard vers le haut**. C'est pourquoi l'amour est le mouvement même de la **conversion** (`epistrophê`) : il reconduit vers sa source ce qui en est issu.

    **Même l'Éros attaché aux unions d'ici-bas**, celui de l'âme du monde, que figure l'autre Aphrodite, fille de Zeus et de Dioné, ramène vers le haut les âmes aptes à se souvenir.

    ! « Éros-vision » n'est pas un terme de Plotin : le rapprochement d'`erôs` et de `horasis` est une étymologie qu'il propose, non un nom technique.
