# Entrée du glossaire de Plotin (skill glossaire), refondue, 2026-10-21.
# Tirée des anciennes fiches Amour et Amant (une leçon par entrée) ; les
# cartes reprises gardent leur identifiant. Citations vérifiées sur la GF.

id: g-amour
title: Amour (`erôs`)
subtitle: Dieu, démon ou passion selon l'âme qui l'engendre, regard tendu vers ce qu'il désire, et jusqu'au Bien, amour de soi
icon: book
color: coral
lessons:
- id: g-amour-l1
  title: Amour
  notes: |-
    Chez Plotin, l'{violet}**amour**{/violet} (*erôs*) n'est pas d'abord {pink}un sentiment{/pink} : c'est l'{green}acte d'une âme tendue vers le bien{/green}, qui a le rang de l'âme qui l'engendre, dieu, démon ou passion.

    __**Dieu, démon ou passion : les trois, à des niveaux différents.**__ Platon donne de l'amour des portraits contradictoires : un dieu dans le {sky}*Phèdre*{/sky}, un démon indigent dans le {sky}*Banquet*{/sky}. Le [[traite50|traité 50]] s'ouvre donc sur une alternative : « De l'amour, dira-t-on qu'il est __un dieu, un démon ou une passion__ de l'âme ? » (chap. 1). Il répond : les trois, parce qu'**un Éros est toujours l'acte d'une âme, et en a donc le rang** : dieu si l'âme est pure, démon si elle est mêlée au corps, passion quand l'âme incarnée est frappée par un beau corps.

    | Niveau | D'où il naît | Ce qu'il est |
    | dieu | l'âme pure, tournée vers l'Intellect | un regard rempli de ce qu'il contemple |
    | démon | l'âme mêlée au corps | un intermédiaire, toujours indigent |
    | passion | l'âme incarnée devant un beau corps | une affection, née d'une parenté avec le beau |

    __**Même la passion n'a pas une cause corporelle.**__ On aime un bel objet parce que l'âme a une {violet}**parenté**{/violet} avec la [[g-beaute|beauté]] (chap. 1) : l'amour des corps est déjà, sans le savoir, un amour de ce dont le corps est l'image.

    __**L'œil de ce qui désire.**__ Au niveau divin, Éros n'est pas un manque qui cherche à voir : c'est une vision. L'âme pure, éprise de l'{violet}[[g-intellect|Intellect]]{/violet}, engendre Éros, et « son activité a produit __une existence, c'est-à-dire une réalité__ » (chap. 2) : **Éros n'est pas un affect passager, mais une réalité qui subsiste**. Il « occupe une position intermédiaire entre qui désire et qui est désiré, il est __l'œil de ce qui désire__ » (chap. 2). {yellow}Un œil n'est ni celui qui regarde ni ce qui est regardé : il est le regard même.{/yellow} Plotin fait d'ailleurs venir le nom d'Éros de *horasis*, la vision (chap. 3).

    __**Au démon, le manque ; au sommet, l'amour de soi.**__ Le démon Éros, fils de [[g-poros-et-penia|Poros et Pénia]], ne peut jamais être comblé. À l'autre extrémité, le Bien n'aime pas ce qui lui manque : « il est à la fois objet d'amour et lui-même amour, c'est-à-dire qu'il est __amour de soi__, puisqu'il ne tient sa beauté de rien d'autre que de lui-même » ([[traite39|traité 39]], chap. 15). Là, ce qui aime est identique à ce qu'il aime. Entre les deux, le [[g-desir|désir]] du Bien est plus ancien que tout amour du beau.

    ! « Éros-vision » n'est pas un terme de Plotin : le rapprochement d'*erôs* et de *horasis* est une étymologie qu'il propose, non un nom technique.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 50, chap. 1 | dieu, démon ou passion de l'âme |
    | traité 50, chap. 2 | l'œil de ce qui désire |
    | traité 50, chap. 5-9 | le démon, fils de Poros et Pénia |
    | traité 39, chap. 15 | le Bien, amour de soi |

    **Voir aussi** : [[g-amant|Amant]] · [[g-poros-et-penia|Poros et Pénia]] · [[g-desir|Désir]] · [[g-beaute|Beauté]] · [[g-intellect-amoureux|Intellect amoureux]] · [[traite50|Traité 50]]
