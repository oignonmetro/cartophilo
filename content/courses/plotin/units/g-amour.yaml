id: g-amour
title: Amour (`erôs`)
subtitle: Passion, démon ou dieu selon l'âme qui l'engendre, regard tendu vers ce qui manque, et jusqu'au Bien, amour de soi
icon: book
color: coral
lessons:
- id: g-amour-l1
  title: Passion, démon, dieu
  notes: |-
    **Plotin ne choisit pas entre les portraits contradictoires que Platon donne de l'amour : il les range à des niveaux de réalité différents.** Le *Phèdre* fait de l'amour un dieu, et aussi une passion qui possède l'âme ; le *Banquet* en fait tantôt un dieu lié à Aphrodite, tantôt un démon indigent, fils de Poros et de Pénia. Le traité 50 (III, 5, *Sur l'amour*) part de cette question, « dieu, démon ou passion ? », et répond : les trois, selon l'âme dont l'amour procède. Il suit lui-même cet ordre : la passion (chap. 1), le dieu (chap. 2-4), le démon (chap. 5-9).

    | Niveau | D'où il naît | Ce qu'il est |
    | dieu | l'âme pure, tournée vers l'Intellect | un regard rempli de ce qu'il contemple |
    | démon | l'âme mêlée au corps | un intermédiaire, toujours indigent |
    | passion | l'âme incarnée devant un beau corps | une affection, née d'une parenté avec le beau |

    **Pourquoi cette solution tient : un Éros est toujours l'acte d'une âme.** Éros est l'acte de l'âme qui s'efforce vers le bien (III, 5, 4). Il a donc le rang de l'âme qui l'engendre : **dieu** si elle est pure, **démon** si elle est mêlée. Chaque âme a ainsi son Éros, qui est le démon qui l'accompagne ; et les Éros particuliers sont dans l'Éros universel comme les âmes particulières dans l'Âme universelle.

    **Même la passion a une cause qui n'est pas corporelle.** On aime un bel objet parce que l'âme a une **parenté** avec la beauté, le sens irraisonné d'une affinité (III, 5, 1) : l'amour des corps est déjà, sans le savoir, un amour de ce dont le corps est l'image.

    **Éros a une existence propre.** Plotin dit de l'Éros divin qu'il est `hupostasis kai ousia` (III, 5, 2, 36 ; 3, 1), « une existence, c'est-à-dire une réalité » : le `kai` y explique plus qu'il n'ajoute. Ce n'est donc pas un affect passager, mais une réalité qui subsiste, engendrée par l'âme comme l'âme l'est par l'Intellect.

    ! Éros n'est pas d'abord un sentiment : la passion n'en est que le degré le plus bas.
