id: "t5c1"
title: "Les trois genres d'hommes (5 [V, 9], 1)"
subtitle: "Traité 5, Sur l'Intellect, les idées et ce qui est, chapitre 1"
group: "Traité 5 (V, 9) : Sur l'Intellect, les idées et ce qui est"
icon: "page"
color: "coral"
