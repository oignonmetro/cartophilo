lessons:
- id: "t5c1-p1"
  title: "La sensation avant l'intellect"
  notes: ""
  passage:
    label: "l. 1-9"
    part: "Ceux qui en restent au sensible"
    text: |-
      Dès leur naissance, tous les hommes ont recours à la sensation avant l'intellect, et ils rencontrent d'abord, nécessairement, les choses sensibles. Certains en restent là et pensent, leur vie durant, que les choses sensibles sont la réalité première et dernière ; ils considèrent ce qui est pénible et ce qui est agréable en elles comme le mal et le bien – en croyant que cela suffit – et ils passent leur vie, on le sait, à poursuivre l'un et à éviter l'autre.
  points: []
- id: "t5c1-p1b"
  title: "Comme de lourds oiseaux"
  notes: ""
  passage:
    label: "l. 1-9"
    part: "Ceux qui en restent au sensible"
    text: |-
      Et ceux d'entre eux qui ont une prétention à la raison, posent que cela est le savoir, comme de lourds oiseaux qui, après avoir recueilli beaucoup de choses à terre, sont incapables de s'envoler très haut à cause de leur poids alors même que la nature les a pourvus d'ailes.
  points: []
- id: "t5c1-p2"
  title: "N'avoir de la vertu que le nom"
  notes: ""
  passage:
    label: "l. 10-16"
    part: "Ceux qui s'élèvent quelque peu"
    text: |-
      Mais d'autres hommes s'élèvent quelque peu des choses d'ici-bas parce que la meilleure partie de l'âme les attire de ce qui est agréable vers ce qui a une beauté plus grande. Mais ils sont incapables de voir ce qui se trouve là-bas et ils n'ont pas d'autre lieu où se poser : n'ayant de la vertu que le nom, ils retombent parmi les actions et les « choix » d'ici-bas, d'où ils ont d'abord tenté de s'élever.
  points: []
- id: "t5c1-p3"
  title: "Le retour dans la patrie"
  notes: ""
  passage:
    label: "l. 16-22"
    part: "Les hommes divins"
    text: |-
      Il y a encore un troisième genre d'hommes, divins par la supériorité de leur puissance et par la pénétration de leur vue, qui voient par leur vue perçante la splendeur de là-bas et s'y élèvent, comme au-dessus des nuages et de l'obscurité d'ici-bas ; ils y restent, en regardant de là-bas toutes les choses d'ici-bas et en se réjouissant de ce lieu de vérité qui leur est familier, comme un homme qui revient, après une longue errance, dans sa patrie bien gouvernée.
  points: []
