  points:
  - id: g-necessaire-l1-q1
    sentence: "La nécessité, que Plotin distingue de la contrainte et dont il fait la loi de la procession, se dit en grec translittéré ___."
    answer: anankê
    alt: ["ananke", "anagkê", "anagke"]
  - id: g-necessaire-l1-q2
    sentence: "« Quant à la nécessité, elle ne désigne pas une influence extérieure, mais un état de fait ___ » (traité 47, chap. 10)."
    answer: inévitable
    alt: ["inevitable"]
  - id: g-necessaire-l1-q3
    sentence: "« Lorsqu'un principe a été posé, la série des effets qui en découlent finit par s'accomplir, à condition que tous les principes soient eux aussi inclus dans la ___ » (traité 47, chap. 10)."
    answer: série
    alt: ["serie"]
  - id: g-necessaire-l1-q4
    sentence: "Contre le destin stoïcien : « pousser à ce degré excessif la nécessité et le destin ainsi compris, c'est par là même ___ le destin » (traité 3, chap. 4)."
    answer: abolir
    alt: []
  - id: g-necessaire-l1-q5
    sentence: "« Dès que n'importe laquelle des autres choses atteint sa ___, nous constatons qu'elle engendre » (traité 7, chap. 1)."
    answer: perfection
    alt: []
  - id: g-necessaire-l1-q6
    sentence: "Le premier ne peut demeurer en lui-même « comme s'il était ___ de lui-même et comme s'il était dépourvu de puissance » (traité 7, chap. 1)."
    answer: avare
    alt: []
  - id: g-necessaire-l1-q7
    sentence: "Sans la procession, « aucun être n'existerait, car l'Un resterait en ___ » (traité 6, chap. 6)."
    answer: lui-même
    alt: ["lui meme", "lui-meme"]
  - id: g-necessaire-l1-q8
    sentence: "La puissance du principe « ne doit pas s'immobiliser, comme bornée par la ___ » (traité 6, chap. 6)."
    answer: jalousie
    alt: []
  - id: g-necessaire-l1-q9
    sentence: "« Il est nécessaire que chaque chose donne aussi ce qui lui appartient à une autre, sinon le ___ ne sera pas le Bien » (traité 33, chap. 3)."
    answer: Bien
    alt: ["bien"]
  - id: g-necessaire-l1-q10
    sentence: "« C'est en effet dans les choses qui ___ le principe que la nécessité existe » (traité 39, chap. 9)."
    answer: suivent
    alt: []
  - id: g-necessaire-l1-q11
    sentence: "L'Un n'est pas contraint : il est lui-même « pour les autres choses la nécessité et la ___ » (traité 39, chap. 10)."
    answer: loi
    alt: []
  - id: g-necessaire-l1-q12
    sentence: "La nécessité de la procession porte sur les engendrés : « c'est une nécessité, en effet, dès lors qu'elles ___ de lui » (traité 7, chap. 1)."
    answer: viennent
    alt: []
  - id: g-necessaire-l1-q13
    sentence: "« Là-bas, il n'existe absolument pas de ___, mais on parle de « raisonnement » pour indiquer que toutes les choses sont disposées comme si elles étaient la conséquence d'un raisonnement » (traité 38, chap. 1)."
    answer: raisonnement
    alt: []
  - id: g-necessaire-l1-q14
    sentence: "Le monde « est né non pas à la suite d'un calcul qui établit qu'il devait naître, mais il résulte de la nécessité qu'il y ait une nature de ___ » (traité 47, chap. 2)."
    answer: second rang
    alt: ["second-rang"]
  - id: g-necessaire-l1-q15
    sentence: "L'ordre du monde est tel que, « si l'on pouvait user du calcul rationnel le plus parfait, on s'___ de voir qu'un calcul de ce genre ne trouverait meilleure manière de produire l'univers » (traité 47, chap. 14)."
    answer: émerveillerait
    alt: ["emerveillerait"]
  - id: g-necessaire-l1-q16
    sentence: "Le terme dernier de la procession, « c'est la ___ qui ne possède plus rien du premier » (traité 51, chap. 7)."
    answer: matière
    alt: ["matiere"]
  - id: g-necessaire-l1-q17
    sentence: "La nécessité du Timée « entraîne vers le mal et le conduit loin de la raison, parce qu'elle n'est pas une « ___ » » (traité 47, chap. 2)."
    answer: raison
    alt: []
  - id: g-necessaire-l1-q18
    sentence: "Malgré sa résistance, « il n'en reste pas moins que l'___ domine la nécessité » (traité 47, chap. 2)."
    answer: intellect
    alt: []
  - id: g-necessaire-l1-q19
    sentence: "« Il y a une seule providence : au niveau inférieur, elle est ___, tandis qu'au niveau supérieur, elle n'est que providence » (traité 48, chap. 5)."
    answer: destin
    alt: []
  - id: g-necessaire-l1-q20
    sentence: "La procession nécessaire n'a pas commencé : les choses engendrées « n'ont donc pas été engendrées à un moment ___, mais elles sont engendrées et le seront toujours » (traité 33, chap. 3)."
    answer: donné
    alt: ["donne"]
