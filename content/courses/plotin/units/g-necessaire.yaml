id: g-necessaire
title: Nécessaire (`anankê`)
icon: book
color: coral
lessons:
- id: g-necessaire-l1
  title: Nécessaire
  notes: |-
    Chez Plotin, la {violet}**nécessité**{/violet} (*anankê*) est [def]. Elle n'est {pink}ni une contrainte venue du dehors ni le destin aveugle des stoïciens{/pink} : elle est la manière dont tout procède de l'Un, qui seul n'y est pas soumis.

    __**La nécessité n'est pas une**__ {violet}__**contrainte**__{/violet} __**: elle est la suite inévitable de ce qui est posé, non une force venue du dehors.**__ La contrainte suppose deux termes, ce qui pousse et ce qui résiste. La nécessité n'en a qu'un, ce qui est posé, et ce qui en suit : elle « ne désigne pas une influence extérieure, mais __un état de fait inévitable__ » ([[traite47|traité 47]], chap. 10). D'où sa forme : « lorsqu'un principe a été posé, __la série des effets qui en découlent finit par s'accomplir__ » (*ibid*.). Elle ne supprime donc pas les causes propres, puisqu'elle les comprend : la série ne s'accomplit qu'« à condition que tous les principes soient eux aussi inclus dans la série. Or, les hommes aussi sont des principes » (*ibid*. ; voir [[g-volontaire|volontaire]]). {coral}Le destin des stoïciens, au contraire, se détruit lui-même{/coral} : si une seule âme mouvait tout, il n'y aurait plus qu'un agent, et « pousser à ce degré excessif la nécessité et le destin ainsi compris, c'est par là même __abolir le destin__, l'enchaînement des causes et leur entrelacement » ([[traite3|traité 3]], chap. 4).

    __**La**__ {violet}__**procession**__{/violet} __**est nécessaire, parce qu'un principe parfait ne peut garder sa puissance pour lui : sans elle, rien n'existerait.**__ Tout ce qui est parfait produit : « dès que n'importe laquelle des autres choses atteint sa perfection, nous constatons qu'elle engendre » ([[traite7|traité 7]], chap. 1) : __elle « ne supporte plus de demeurer en elle-même »__, {yellow}comme le feu qui réchauffe{/yellow}. Or le premier est le plus parfait. {coral}S'il ne produisait rien, il serait avare et impuissant, donc il ne serait plus le principe{/coral} : « comment alors ce qui est le plus parfait, le bien premier, demeurerait-il en lui-même, __comme s'il était avare de lui-même__ et comme s'il était dépourvu de puissance ? » (*ibid*.). Donc « il faut absolument aussi que quelque chose naisse de lui, s'il doit exister quelque chose » (*ibid*.). Sans cette nécessité, « aucun être n'existerait, car __l'Un resterait en lui-même__ » ([[traite6|traité 6]], chap. 6), et sa puissance « ne doit pas s'immobiliser, comme bornée par la jalousie » (*ibid*.). Elle vaut à chaque degré : « il est nécessaire que chaque chose donne aussi ce qui lui appartient à une autre, __sinon le Bien ne sera pas le Bien__, ou l'Intellect ne sera pas l'Intellect, ou l'Âme ne sera pas ce qu'elle est » ([[traite33|traité 33]], chap. 3). **La nécessité est donc bien l'expression de la procession** (voir [[g-procession|procession]]).

    __**L'**__{violet}__**Un**__{/violet} __**n'est pas soumis à la nécessité : elle commence après lui, qui en est la source et la loi.**__ Être soumis à la nécessité, c'est dépendre de ce qui est posé avant soi ; or rien n'est avant l'Un. Il « ne résulte pas de la nécessité. Car il n'y avait pas de nécessité. C'est en effet __dans les choses qui suivent le principe que la nécessité existe__ » ([[traite39|traité 39]], chap. 9). Il n'est pas contraint par la nécessité : il est lui-même « __pour les autres choses la nécessité et la loi__ » (chap. 10). {coral}La nécessité de la procession ne le lie donc pas lui-même{/coral} : la formule du [[traite7|traité 7]] porte sur ce qui vient de lui, « c'est une nécessité, en effet, __dès lors qu'elles viennent de lui__ » (chap. 1). Ce qui est nécessaire, c'est que tout ce qui existe dépende de lui, non qu'il soit forcé de produire (voir [[g-liberte|liberté]]).

    __**La nécessité tient lieu de**__ {violet}__**calcul**__{/violet} __**: le monde naît sans délibération, et pourtant comme l'aurait fait le meilleur calcul.**__ On calcule quand on ne sait pas encore ce qu'il faut faire ; l'Intellect le sait, puisqu'il est le modèle. {pink}Le démiurge du *Timée*, qui délibère, n'est qu'une façon de parler{/pink} : « là-bas, __il n'existe absolument pas de raisonnement__, mais on parle de « raisonnement » pour indiquer que toutes les choses sont disposées comme si elles étaient la conséquence d'un raisonnement » ([[traite38|traité 38]], chap. 1). Le monde « est né non pas à la suite d'un calcul qui établit qu'il devait naître, mais il résulte de __la nécessité qu'il y ait une nature de second rang__ » ([[traite47|traité 47]], chap. 2). Or ce qui suit nécessairement du modèle en est l'image ; le résultat est donc celui du meilleur calcul : l'ordre du monde est « conforme à l'Intellect, sans cependant provenir d'un calcul rationnel. Il est tel que, si l'on pouvait user du calcul rationnel le plus parfait, __on s'émerveillerait__ de voir qu'un calcul de ce genre ne trouverait meilleure manière de produire l'univers » (chap. 14).

    __**Au plus bas, la nécessité devient celle de la**__ {violet}__**matière**__{/violet} __**et du**__ {violet}__**destin**__{/violet} __**: elle résiste à la raison, que l'intellect domine pourtant.**__ La procession a un terme : « il est nécessaire qu'il y ait quelque chose qui vienne après le premier, et, dès lors, qu'il y ait aussi un terme dernier. Ce terme dernier, c'est __la matière qui ne possède plus rien du premier__ » ([[traite51|traité 51]], chap. 7 ; voir [[g-mal|mal]]). Or ce qui n'a plus rien de la raison ne peut que lui résister ; c'est la nécessité du {sky}*Timée*{/sky}, que Plotin assimile à la matière : « il fallait qu'il y ait une harmonie, pour que l'intellect et la nécessité y soient réunis : la nécessité l'entraîne vers le mal et le conduit loin de la raison, __parce qu'elle n'est pas une « raison »__ ; il n'en reste pas moins que l'intellect domine la nécessité » ([[traite47|traité 47]], chap. 2). Le destin n'est pas pour autant une seconde cause, rivale de la providence : « il y a une seule providence : __au niveau inférieur, elle est destin__, tandis qu'au niveau supérieur, elle n'est que providence » ([[traite48|traité 48]], chap. 5). L'âme y est prise quand elle entre dans un corps : elle n'a plus alors « cette maîtrise totale, puisqu'elle est rangée au côté d'autres choses » ([[traite3|traité 3]], chap. 8).

    | Niveau | La nécessité y est | Pourquoi |
    | l'Un | absente | rien n'est avant lui |
    | ce qui procède de l'Un | la suite de ce qui est posé | tout ce qui est parfait engendre |
    | le monde sensible | ce qui tient lieu de calcul | il est l'image nécessaire du modèle |
    | la matière | ce qui résiste à la raison | elle n'a plus rien du premier |
    | l'âme dans un corps | le destin | elle est rangée au côté d'autres choses |

    ! Que la procession soit nécessaire {pink}ne veut pas dire qu'elle ait commencé un jour{/pink} : les choses engendrées « n'ont donc pas été engendrées à un moment donné, mais elles sont engendrées et le seront toujours » ([[traite33|traité 33]], chap. 3 ; voir [[g-atemporel|atemporel]]).

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 3, chap. 4 | le destin poussé à l'excès s'abolit |
    | traité 6, chap. 6 | sans procession, l'Un resterait en lui-même |
    | traité 7, chap. 1 | ce qui est parfait engendre ; le premier n'est pas avare |
    | traité 39, chap. 9-10 | la nécessité commence après le principe |
    | traité 47, chap. 2 | le monde sans calcul ; l'intellect domine la nécessité |
    | traité 47, chap. 10 | un état de fait inévitable, non une influence extérieure |
    | traité 47, chap. 14 | l'ordre du monde, celui du meilleur calcul |
    | traité 48, chap. 5 | une seule providence, destin au niveau inférieur |

    **Voir aussi** : [[g-procession|Procession]] · [[g-liberte|Liberté]] · [[g-volontaire|Volontaire]] · [[g-un|Un]] · [[g-mal|Mal]] · [[g-hule|Matière]] · [[g-theodicee|Théodicée]] · [[traite47|Traité 47]]
