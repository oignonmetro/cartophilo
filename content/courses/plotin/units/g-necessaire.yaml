# Entrée du glossaire de Plotin (skill glossaire) : notion, écrite le
# 2026-11-18 avec la procédure NotebookLM (journal g-necessaire). Citations
# vérifiées sur la GF (traité 3, chap. 4, 8 ; traité 6, chap. 3, 6 ; traité
# 7, chap. 1 ; traité 33, chap. 3 ; traité 38, chap. 1 ; traité 39, chap.
# 9-10 ; traité 47, chap. 2, 10, 14 ; traité 48, chap. 5 ; traité 51, chap.
