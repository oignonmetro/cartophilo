lessons:
- id: g-ame-non-descendue-l1
  title: Âme non descendue
  notes: |-
    Chez Plotin, l'{violet}**âme non descendue**{/violet} est [def] : {pink}notre âme ne descend jamais tout entière{/pink}.

    __**La thèse, avancée contre les autres.**__ Plotin l'introduit en sachant qu'il heurte ses contemporains : « Et s'il faut oser dire contre l'opinion des autres plus clairement ce que l'on pense, notre âme __n'a pas plongé tout entière__ ici-bas, mais quelque chose d'elle __reste toujours dans l'intelligible__ » ([[traite6|traité 6]], chap. 8). Ses successeurs, Jamblique et Proclus, la rejetteront.

    __**Pourquoi Plotin en a besoin : sans elle, pas de remontée.**__ Si l'âme était descendue tout entière, plus rien en nous ne toucherait l'intelligible ; la remontée vers l'{violet}[[g-intellect|Intellect]]{/violet} et l'[[g-un|Un]] deviendrait impossible, car **on ne peut retrouver que ce qu'on n'a jamais tout à fait perdu**. La philosophie ne nous fait donc pas acquérir une vie supérieure : elle nous rend attentifs à celle que nous menons déjà.

    __**Pourquoi nous n'en savons rien : une affaire d'attention.**__ L'objection vient d'elle-même : si une part de nous contemple sans cesse, pourquoi ne le sentons-nous pas ? Parce que ce qu'elle pense « ne parvient jusqu'à nous que lorsqu'en descendant __il arrive jusqu'à notre perception__ ». Or, quand notre part sensible est dominée et troublée, « elle ne nous permet pas de percevoir les choses que contemple la partie supérieure de notre âme ». {yellow}Comme un désir dont on ne s'aperçoit qu'en y prenant garde{/yellow}, la contemplation continue sans que nous y soyons : **ce n'est pas elle qui s'interrompt, c'est notre attention qui est ailleurs**.

    __**Des âmes amphibies.**__ D'où la condition de l'âme : « Les âmes sont donc pour ainsi dire __amphibies__, puisqu'il faut qu'elles mènent une partie de leur vie ici et l'autre partie là-bas » ([[traite6|traité 6]], chap. 4). Selon qu'elles sont plus ou moins capables de s'unir à l'Intellect, elles vivent davantage là-haut ou ici : la vie morale consiste à déplacer ce que nous sommes vers la partie qui n'est pas descendue.

    ! Le corps n'est pas une prison où l'âme serait tombée tout entière : l'âme anime le corps sans y être enfermée, et son sommet n'a jamais quitté l'intelligible.

    **Voir aussi** : [[g-ame|Âme]] · [[g-vivant|Vivant]] · [[g-intellect|Intellect]] · [[traite6|Traité 6]]
