  - id: g-ame-l2-q1
    sentence: "« Et s'il faut oser dire contre l'opinion des autres plus clairement ce que l'on pense, notre âme n'a pas ___ ici-bas, mais quelque chose d'elle reste toujours dans l'intelligible » (traité 6, chap. 8, l. 1-3)."
    answer: plongé tout entière
