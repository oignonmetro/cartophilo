  - id: g-ame-l2-q2
    sentence: "« Et s'il faut oser dire contre l'opinion des autres plus clairement ce que l'on pense, notre âme n'a pas plongé tout entière ici-bas, mais quelque chose d'elle ___ » (traité 6, chap. 8, l. 1-3)."
    answer: reste toujours dans l'intelligible
    alt: []
  - id: g-ame-l2-q3
    sentence: "« Et s'il faut oser dire contre ___ plus clairement ce que l'on pense, notre âme n'a pas plongé tout entière ici-bas » (traité 6, chap. 8, l. 1-3)."
    answer: l'opinion des autres
    alt: []
  - id: g-ame-l2-q4
