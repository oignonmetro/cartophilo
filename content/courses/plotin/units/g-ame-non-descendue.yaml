    sentence: "« Les âmes sont donc pour ainsi dire ___, puisqu'il faut qu'elles mènent une partie de leur vie ici et l'autre partie là-bas » (traité 6, chap. 4)."
    answer: amphibies
    alt: []
  - id: g-ame-non-descendue-l1-q3
    sentence: "« Les âmes sont donc pour ainsi dire amphibies, puisqu'il faut qu'elles mènent une partie de leur vie ici et l'autre partie ___ » (traité 6, chap. 4)."
