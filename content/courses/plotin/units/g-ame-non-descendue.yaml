    sentence: "Si la partie de l'âme qui est dans le sensible est dominée et troublée, « elle ne nous permet pas de ___ les choses que contemple la partie supérieure de notre âme » (traité 6, chap. 8, l. 4-6)."
    answer: percevoir
    alt: []
  - id: g-ame-l2-q7
    sentence: "Si nous ignorons la contemplation de notre partie supérieure, ce n'est pas qu'elle s'interrompe : c'est que notre ___ est ailleurs."
    answer: attention
    alt: []
  - id: g-ame-non-descendue-l1-q1
    sentence: "Ce que pense la partie supérieure de l'âme « ne parvient jusqu'à nous que lorsqu'en descendant il arrive jusqu'à notre ___ » (traité 6, chap. 8)."
    answer: perception
