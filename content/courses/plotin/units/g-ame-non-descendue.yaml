    answer: 6 (IV, 8)
    alt: ["6", "IV, 8"]
  - id: g-ame-l1-q10
    sentence: "Contre l'idée que l'âme individuelle descendrait tout entière dans le corps comme dans une prison, Plotin soutient que sa partie la plus haute demeure dans l'intelligible ; on la dit ___."
    answer: non descendue
    alt: ["non-descendue"]
  - id: g-ame-l2-q5
    sentence: "Si l'âme était descendue tout entière, rien en nous ne serait plus en contact avec l'intelligible et la remontée deviendrait impossible, car on ne peut retrouver que ce qu'on n'a jamais tout à fait ___."
    answer: perdu
    alt: []
