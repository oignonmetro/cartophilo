id: id7
title: L'Intellect
subtitle: Le domaine des Formes et sa production
icon: bulb
color: blue
group: La métaphysique de l'intelligible
lessons:
- id: id7-l1
  title: Le domaine de l'Intellect
  notes: |-
    Le domaine où résident les Formes intelligibles, l'Essence intelligible tout entière, constitue le domaine propre de **l'Intellect**.

    - Loin d'être des entités abstraites inertes, les Formes intelligibles sont des intellects pleinement **actifs** (en état d'activation), application directe du principe de la puissance procréatrice du parfait.
    - La **dialectique** est la science qui examine la structure de ce système organique de Formes interconnectées.
    - Chaque Forme contient potentiellement toutes les autres tout en étant présente en chacune d'elles : c'est l'**« un-multiple »** (`hen polla`), que Plotin illustre par l'analogie de **la géométrie** : de même que chaque théorème contient potentiellement, par ses liens logiques avec les autres, l'ensemble de la science.

    ! L'Intellect n'est ni antérieur ni postérieur aux êtres intelligibles qu'il pense : il s'identifie **pleinement** à eux, de sorte qu'il ne cherche jamais après un objet mais le possède déjà. Son appréhension des vérités intelligibles s'accomplit **« d'un seul coup »**, dans un acte unitaire, à la différence de la pensée discursive de l'âme, qui les exprime comme des propositions distinctes au niveau du **raisonnement** (`dianoia`). Chaque Forme intelligible est ainsi, à la fois, un être, un vivant et un **intellect en éveil**.
  points:
  - id: id7-l1-1
    sentence: Le domaine où résident les Formes intelligibles, c'est-à-dire l'Essence intelligible tout
      entière, constitue le domaine propre de ___.
    answer: l'Intellect
  - id: id7-l1-2
    sentence: Loin d'être des entités abstraites inertes, les Formes intelligibles sont, selon Plotin,
      des intellects pleinement ___ (ce qui applique directement le principe de la puissance procréatrice
      du parfait).
    answer: actifs
    explanation: C'est-à-dire en état d'activation.
  - id: id7-l1-3
    sentence: La science qui examine la structure du système organique formé par les Formes intelligibles
      interconnectées, afin d'en donner une compréhension complète, se nomme la ___.
    answer: dialectique
  - id: id7-l1-4
    sentence: L'unité multiple que forment ensemble les Formes intelligibles, chacune contenant potentiellement
      toutes les autres tout en étant présente en chacune d'elles, est désignée par l'expression « ___
      ».
    answer: un-multiple
    explanation: En grec, hen polla.
  - id: id7-l1-5
    sentence: 'Plotin recourt à une science déductive pour illustrer la mereologie propre à l''Intellect,
      où, de même que chaque théorème contient potentiellement, par les liens de cohérence logique qui
      l''unissent aux autres, l''ensemble de cette science, chaque Forme intelligible contient potentiellement
      toutes les autres : cette science est ___.'
    answer: la géométrie
  - id: id7-l1-6
    sentence: 'Chaque Forme intelligible est, chez Plotin, trois choses à la fois : un être, un vivant,
      et un ___.'
    answer: intellect en éveil
  - id: id7-l1-7
    sentence: Trait fondamental de l'ontologie plotinienne selon lequel l'Intellect n'est ni antérieur
      ni postérieur aux êtres intelligibles qu'il pense, mais s'identifie ___ à eux, de sorte qu'il ne
      cherche jamais après un objet mais le possède déjà.
    answer: pleinement
  - id: id7-l1-8
    sentence: À la différence de la pensée discursive, caractéristique de l'âme et procédant par une succession
      d'actes distincts, l'appréhension intellective des vérités intelligibles s'accomplit « ___ », dans
      un acte unitaire qui court-circuite toute différenciation propositionnelle.
    answer: d'un seul coup
  - id: id7-l1-9
    sentence: Le niveau psychique inférieur auquel les vérités intelligibles, saisies d'un coup par l'Intellect,
      peuvent être exprimées comme des propositions et théorèmes distincts se nomme le ___.
    answer: raisonnement
    explanation: En grec, dianoia.
- id: id7-l2
  title: Les cinq genres suprêmes et l'Organisme vivant parfait
  notes: |-
    Plotin identifie, dans le *Sophiste* de Platon, cinq « genres suprêmes » aux catégories fondamentales qui gouvernent la formation de l'unité complexe de l'Intellect.

    - **l'Être** : détermine chaque Forme comme ce qu'elle est en elle-même, et comme cause d'être pour tout ce qui y participe.
    - **le Mouvement** : correspond à la procession de l'Être à partir du premier Principe, et à sa coexistence active avec les autres Formes.
    - **le Repos** : exprime l'immobilité, le fait que chaque être demeure ce qu'il est, conformément à sa définition.
    - **la Mêmeté et l'Altérité** : à travers eux, chaque Forme est corrélée aux autres, en un réseau ordonné de genres et d'espèces.

    Selon Kalligas, même le langage des **mythes** peut présenter la structure synchronique et holistique de l'intelligible sous forme d'épisodes temporellement distincts, signe que cette structure résiste à l'exposition discursive.

    ! Au-delà des cinq genres suprêmes, ce sont des **nombres eidétiques** qui déterminent l'agencement des Formes à l'intérieur du domaine intelligible, en prescrivant leurs positions au sein de l'**Organisme vivant parfait**, le modèle intelligible sur la base duquel le Démiurge façonne l'univers sensible.
  points:
  - id: id7-l2-1
    sentence: Selon Kalligas, même le langage des ___ peut présenter la structure synchronique et holistique
      de l'intelligible sous la forme d'épisodes temporellement distincts.
    answer: mythes
  - id: id7-l2-2
    sentence: L'œuvre platonicienne dont sont tirés les cinq « genres suprêmes » que Plotin identifie
      aux catégories fondamentales gouvernant la formation de l'unité complexe de l'Intellect est ___.
    answer: le Sophiste
  - id: id7-l2-3
    sentence: Parmi les cinq genres suprêmes du Sophiste repris par Plotin, celui qui détermine chaque
      Forme comme ce qu'elle est en elle-même, mais aussi comme cause d'être pour tout ce qui y participe,
      est ___.
    answer: l'Être
  - id: id7-l2-4
    sentence: Parmi les cinq genres suprêmes, celui qui correspond à la procession de l'Être à partir
      du premier Principe ainsi qu'à sa coexistence active avec les autres Formes, est ___.
    answer: le Mouvement
  - id: id7-l2-5
    sentence: Parmi les cinq genres suprêmes, celui qui exprime l'immobilité, c'est-à-dire le fait que
      chaque être demeure ce qu'il est de sorte qu'il corresponde toujours à sa définition, est ___.
    answer: le Repos
  - id: id7-l2-6
    sentence: Parmi les cinq genres suprêmes, ceux à travers lesquels chaque Forme est corrélée aux autres
      pour former, avec elles, un réseau ordonné de genres et d'espèces, sont ___.
    answer: la Mêmeté et l'Altérité
  - id: id7-l2-7
    sentence: Ce qui, en plus des cinq genres suprêmes, détermine en outre l'agencement des Formes à l'intérieur
      du domaine intelligible, en prescrivant les positions qu'elles occupent au sein du réseau d'entités
      formant l'Organisme vivant parfait, ce sont les ___.
    answer: nombres eidétiques
  - id: id7-l2-8
    sentence: Le nom donné, chez Plotin, au modèle intelligible sur la base duquel le Démiurge (l'Intellect
      en tant qu'entité contemplative active) façonne l'univers sensible, est ___.
    answer: l'Organisme vivant parfait
  - id: id7-l2-9
    sentence: C'est précisément la dualité fonctionnelle entre l'Intellect comme sujet contemplant et
      ses objets comme objets contemplés, bien qu'inséparablement liés, qui rend l'Intellect, en vertu
      de la priorité logique du simple sur le multiple, impropre au rôle de ___.
    answer: premier principe absolu
- id: id7-l3
  title: La production de l'Intellect
  notes: |-
    L'Intellect n'est pas le premier principe : la dualité entre l'Intellect comme sujet contemplant et ses objets comme objets contemplés, bien qu'inséparablement liés, le rend, en vertu de la priorité du simple sur le multiple, impropre au rôle de **premier principe absolu**. Sa production se déroule en deux stades.

    - {sky}**Premier stade**{/sky} : le premier principe engendre quelque chose dont la seule caractéristique définitoire est son altérité par rapport à lui : une **matière intelligible**, par analogie avec la matière des corps. Cette première activité n'est pas du Bien lui-même, mais **procédant** (*arising from*) du Bien ; indifférenciée, elle est décrite comme une « vue informe » et une **vie illimitée**, mais déjà animée d'une propension innée à revenir vers son origine, un **pur désir**.
    - {sky}**Second stade**{/sky} : l'activité de cette Altérité s'analyse en deux composantes, sa persistance dans ce qui la constitue comme Être et sa propension au retour, laquelle culmine en une **contemplation** de son origine. Comme l'Intellect ne peut appréhender cette origine dans son unité absolue, l'objet de sa contemplation se résout en une multitude de vérités interconnectées, les **êtres** que l'Intellect englobe.

    Par cette double activation, l'Intellect devient pleinement ce qu'il est : un Intellect actif, **auto-subsistant**, une activité que Plotin appelle aussi la **Vie**, identifiée à l'**éternité** pour en souligner l'atemporalité (ses parties y sont toujours conjointement présentes).

    ! L'Un suprême, lui, est antérieur **même à** l'éternité : il précède jusqu'à cette structure qui rassemble les parties de l'Intellect.
  points:
  - id: id7-l3-1
    sentence: Au premier stade de la production de l'Intellect, le premier principe engendre quelque chose
      dont la seule caractéristique définitoire est son altérité par rapport à lui, quelque chose de fondamentalement
      non-Un et totalement informe, parfois appelé, par analogie avec la matière des corps, ___.
    answer: matière intelligible
  - id: id7-l3-2
    sentence: 'Cette matière intelligible doit son émergence à son altérité vis-à-vis du premier principe,
      dont elle dépend comme d''une activité qu''il produit : elle illustre ainsi le principe selon lequel
      tout ce qui procède, conformément à la théorie des deux activités, de la cause première est nécessairement
      moins parfait que cette cause elle-même, en raison même de sa dépendance à son égard, le principe
      de la ___ de la cause métaphysique.'
    answer: prédominance
  - id: id7-l3-3
    sentence: Puisqu'aucune distinction entre essence et activité ne peut exister dans l'Un primordial,
      cette première activité qui apparaît après lui constitue une activité non pas du Bien lui-même,
      mais ___ du Bien.
    answer: procédant
    explanation: « Arising from » dans l'expression anglaise du texte source.
  - id: id7-l3-4
    sentence: En raison de son caractère indifférencié, cette première activité issue de l'Un est décrite
      par Plotin comme une « vue informe » et une « ___ ».
    answer: vie illimitée
  - id: id7-l3-5
    sentence: Bien qu'indifférenciée, cette première activité issue de l'Un possède une propension innée
      à revenir vers son origine, ce qui lui vaut d'être qualifiée par Plotin de « ___ ».
    answer: pur désir
  - id: id7-l3-6
    sentence: 'Au second stade de la production de l''Intellect, son activité s''analyse en deux composantes
      : la stabilité de sa persistance dans ce qui le constitue comme Être et sa propension au retour
      vers son origine, laquelle culmine en une ___ de cette origine.'
    answer: contemplation
  - id: id7-l3-7
    sentence: Comme l'Intellect ne parvient pas à appréhender dans son unité absolue ce qu'il contemple,
      l'objet de sa contemplation se résout finalement en une multitude de vérités interconnectées, identifiées
      aux ___ que l'Intellect lui-même englobe.
    answer: êtres
  - id: id7-l3-8
    sentence: 'Par cette double activation (persistance et retour), l''Intellect devient pleinement ce
      qu''il est : un Intellect parfaitement actif constitué en une unité multiple, et en ce sens qualifié
      d''___, puisqu''il se rend lui-même parfait en tant que ce qu''il est.'
    answer: auto-subsistant
  - id: id7-l3-9
    sentence: Cette activité auto-constituante de l'Intellect est aussi appelée ___ par Plotin.
    answer: Vie
  - id: id7-l3-10
    sentence: 'Plotin identifie parfois cette Vie, activité auto-constituante de l''Intellect, à ce qu''il
      appelle l''« ___ », afin d''en souligner l''atemporalité : ses parties y sont toujours conjointement
      présentes.'
    answer: éternité
  - id: id7-l3-11
    sentence: À la différence de l'Intellect, dont l'éternité rassemble les parties toujours conjointement
      présentes, l'Un suprême est, lui, antérieur ___ l'éternité elle-même.
    answer: même à
