id: ame5
title: "Une descente sans chute : la métaphore de la lumière"
subtitle: "Descendre, c'est éclairer ; se trouver dans un corps sans être en un lieu ; une doctrine précisée, non changée"
group: "L'âme et sa descente"
icon: infinity
color: teal
lessons:
- id: ame5-l1
  title: "Descendre, c'est éclairer"
  notes: |-
    **La « descente » de l'âme n'est pas un déplacement : l'âme ne fait pour ainsi dire que tourner le regard ici-bas, et ce qui descend, c'est** {coral}**la lumière qu'elle répand sur ce qui est au-dessous d'elle**{/coral}. Plotin le dit le plus nettement dans son avant-dernier traité, mais le pense dès le [[traite6|traité 6]].

    **Le texte du traité 53** (12, 21-31) :

    {teal}« {/teal}L'âme descend au sens où {teal}__quelque chose d'autre, qui est produit par elle, descend__{/teal} à l'occasion de son inclinaison. Elle laisse donc échapper son reflet ? Et son inclinaison, comment n'est-ce pas une faute ? Si {teal}l'inclinaison est __une illumination dirigée vers le bas__{/teal}, ce n'est pas une faute de même que {teal}ce n'est pas l'ombre, mais __l'objet illuminé__ qui est coupable{/teal} ; car s'il n'existait pas, l'âme n'aurait nul endroit à éclairer. Donc, si on dit qu'elle « descend », et qu'elle « s'incline », c'est au sens où {teal}__ce qui est éclairé par elle vit de sa vie__{/teal}. Elle laisse aller son reflet, s'il n'y a rien près d'elle pour le recevoir ; et elle le laisse aller non parce qu'elle l'a détaché d'elle-même, mais parce qu'elle n'est plus là : {teal}elle n'est plus là quand __elle regarde tout entière vers le haut__ »{/teal}.

    **Ce que le texte établit.**

    - {amber}Qui descend ?{/amber} {red}Pas l'âme elle-même{/red}, {green}mais ce qu'elle produit{/green} : son {violet}reflet{/violet} ({blue}*eidôlon*{/blue}), la vie qu'elle donne au corps.
    - {amber}Qu'est-ce que l'inclinaison ?{/amber} L'{violet}inclinaison{/violet} ({blue}*neusis*{/blue}), le mot même de la chute, devient une **illumination vers le bas**.
    - {amber}Y a-t-il faute ?{/amber} {green}Non{/green} : {yellow}une lampe n'est pas coupable de l'ombre que projette l'objet qu'elle éclaire{/yellow}. S'il y a une ombre, elle tient à l'objet éclairé, c'est-à-dire au corps.
    - {amber}Comment l'âme « remonte »-t-elle ?{/amber} Elle ne coupe rien : elle cesse d'éclairer en se tournant tout entière vers le haut, et le reflet, faute de source, s'éteint.

    **Une image qui vient de Platon.** Dans l'analogie du Soleil et l'allégorie de la caverne, la lumière représente la vérité ; mais le Bien, comparé au soleil, a aussi une puissance d'engendrement : {teal}« {/teal}c'est lui {teal}__que j'affirme être le rejeton du bien__{/teal}, lui que le bien a engendré {teal}à sa propre ressemblance{/teal}, de telle façon que ce qu'il est lui, le bien, dans le lieu intelligible par rapport à l'intellect et aux intelligibles, celui-ci, le soleil, l'est {teal}dans le lieu visible par rapport à la vue et aux choses visibles »{/teal} (*{sky}République{/sky}*, 508b-c). {coral}La lumière est liée à la vie{/coral} : sans le soleil pour nous éclairer et nous réchauffer, la vie ne serait pas possible.

    **Une image déjà ancienne chez Plotin.** Le [[traite6|traité 6]] compare les âmes individuelles à des **rayons** et l'Âme totale au **soleil** (4, 1-7) ; le [[traite28|traité 28]] parle de l'inclinaison des âmes des astres et de l'**illumination qui émane d'eux** pour se porter sur le ciel tout entier (8, 51-55). Et l'âme qui éclaire imite l'**Un**, dont la puissance surabonde et déborde pour produire les autres êtres ([[traite11|traité 11]], 1, 7-9).

    ! L'âme qui éclaire ne perd rien de sa lumière, pas plus que le soleil ne s'épuise en éclairant : c'est la différence entre une émanation et une chute.
