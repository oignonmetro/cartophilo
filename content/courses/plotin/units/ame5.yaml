- id: ame5-l3
  title: "Un texte qui résiste : l'âme qui redescend avec plaisir"
  notes: |-
    **Un passage du** [[traite9|traité 9]] **semble dire que l'âme descend bel et bien, et même qu'elle aime redescendre : il s'explique quand on voit que ce n'est pas l'âme, mais** {coral}**le vivant, le corps animé, qui ne peut rester longtemps dans la contemplation**{/coral}.

    **Le texte** (3, 4-9) :

    {teal}« {/teal}Mais dans la mesure où l'âme avance {teal}__vers ce qui n'a pas de forme__{/teal}, tout en étant incapable de saisir cela parce qu'elle {teal}n'est pas délimitée{/teal} par cela et qu'elle n'est pas non plus, pour ainsi dire, affectée par une empreinte multiforme, {teal}__elle vacille et craint de ne rien tenir__{/teal}. Voilà pourquoi, ce faisant, {teal}elle se fatigue et __redescend souvent avec plaisir__{/teal}, s'éloignant de tout cela, jusqu'à ce qu'elle parvienne au sensible, {teal}comme si elle trouvait __du repos sur du solide__ »{/teal}.

    **La difficulté.** {red}L'âme doit revenir au sensible pour se poser sur quelque chose de solide et de stable{/red} : cela suggère qu'elle descend réellement, et même qu'elle a besoin du corps. {yellow}Comme un nageur qui, au large, s'inquiète de ne pas toucher le fond et regagne la plage avec soulagement.{/yellow}

    **La lecture de Lacroix.** Le passage vise l'**âme individuelle**, qui anime le corps par voie de participation. Le corps qui participe à l'âme devient un individu, qui peut accéder par la contemplation à la vie de {teal}« {/teal}ce qui n'a {teal}pas de forme »{/teal}, mais {red}ne saurait demeurer perpétuellement en contemplation{/red}. {coral}Plotin n'affirme donc pas que l'âme craint la contemplation{/coral}, elle pourrait même demeurer perpétuellement là-haut, {green}mais que c'est le corps participant à l'âme qui ne peut souffrir cet état trop longtemps{/green}, comme s'il avait besoin d'être rassuré en se posant sur une réalité semblable à la sienne.

    **La confirmation du traité 10**, qui suit immédiatement le traité 9 dans l'ordre chronologique : la séparation de l'âme et du corps ne s'y comprend pas au sens local (leçon précédente). Le passage du traité 9 ne décrit donc pas une âme qui tombe, mais **un vivant qui ne peut rester longtemps à la hauteur de sa partie la plus haute**.

    ! Ce que l'âme « craint » au traité 9 n'est pas l'intelligible, mais l'informe : l'Un ne donne aucune prise, et le vivant habitué aux formes y perd pied.
  points:
