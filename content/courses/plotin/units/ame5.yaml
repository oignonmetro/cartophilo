- id: ame5-l2
  title: "Être dans un corps sans être en un lieu"
  notes: |-
    **« Descendre » signifie {teal}« {/teal}{teal}se trouver dans un corps »{/teal}, et {teal}« {/teal}{teal}se trouver dans un corps »{/teal} veut dire** {coral}**donner au corps quelque chose de soi sans lui appartenir**{/coral}. Rien n'est local dans la descente ; c'est pourquoi la séparation que demande la philosophie ne l'est pas non plus.

    **Le texte du traité 22** (16, 10-17) :

    {teal}« {/teal}il est évident qu'il faut dire que ce que les anciens disent "être venu", {teal}__c'est le corps__ qui peut se trouver là-bas et qui peut __participer de la vie et de l'âme__{/teal}, et que le fait d'"être venu", {teal}__n'est absolument pas local__{/teal}, quelle que soit d'ailleurs la communauté en question. De la sorte, {teal}"descendre" signifie __"se trouver dans un corps"__{/teal}, au sens où nous disons qu'une âme se trouve dans un corps, {teal}qu'elle donne au corps __quelque chose d'elle-même__, sans pourtant __lui appartenir__{/teal}, alors que {teal}"s'en aller" signifie que le corps __n'a plus aucune sorte de communauté__ avec l'âme »{/teal}.

    {coral}Le mouvement est renversé : ce n'est pas l'âme qui vient au corps, c'est le corps qui vient participer à la vie de l'âme.{/coral} {yellow}On dit d'une maison qu'elle {teal}« {/teal}{teal}entre dans la lumière »{/teal} quand on ouvre ses volets{/yellow} : la lumière n'a pas bougé. Plotin est ici plus explicite qu'au [[traite6|traité 6]] : la descente est une **métaphore**, une manière de s'exprimer. Le [[traite27|traité 27]] dit de même que {green}le corps est dans l'âme{/green}, {red}plutôt que l'âme dans le corps{/red}, comme l'air est dans la lumière (chap. 22).

    **La séparation n'est pas locale non plus.** Si l'âme n'est pas dans le corps comme en un lieu, s'en séparer ne peut pas être en sortir. Le [[traite10|traité 10]] lit ainsi l'exhortation platonicienne : {teal}« {/teal}De surcroît, l'exhortation {teal}__à nous séparer__{/teal} ne doit pas être entendue {teal}en un sens local{/teal}, car cette partie de l'âme est {teal}__déjà séparée par nature__{/teal}, mais du point de vue de {teal}__l'inclinaison vers le corps__{/teal} et {teal}__des représentations__{/teal}, et au sens où il faut demeurer étranger à celle-ci, si d'une façon ou d'une autre on arrive à faire remonter l'autre espèce d'âme et à amener aussi avec nous vers le haut la partie de l'âme qui est établie ici-bas, et qui est {teal}la seule à fabriquer et à façonner le corps{/teal} en y consacrant son activité{teal} »{/teal} (10, 24-30).

    Se séparer, c'est donc **ne pas pencher** vers les plaisirs sensibles et rester, autant que possible, étranger au corps, pour qu'il n'empêche pas l'âme individuelle de retrouver l'âme totale. {yellow}On peut être assis à une table bruyante et suivre sa propre pensée{/yellow} : on s'en est séparé sans se lever.

    **Nous sommes chacun un monde intelligible.** D'où la formule du [[traite15|traité 15]] : {teal}« {/teal}nous sommes {teal}__chacun un monde intelligible__ »{/teal} (3, 22). La partie intellective de notre âme reste divine, **alors même qu'elle se trouve dans le corps et qu'elle est individualisée**.

    ! {teal}« {/teal}L'âme est {teal}dans le corps »{/teal} est une façon de parler, à cause de ce que nous voyons : le corps est visible, l'âme ne l'est pas, et nous mettons l'invisible dans le visible.
