- id: ame5-l4
  title: "Une doctrine précisée, non changée"
  notes: |-
    **De son premier à son dernier traité, Plotin parle de la descente, et semble parfois se contredire. Pour Lacroix,** {green}**sa conception est restée essentiellement la même : il l'a précisée plutôt que modifiée**{/green}, en se dégageant peu à peu de la façon gnostique de la dire.

    **Un thème de toute l'œuvre.** La descente apparaît dès le [[traite1|traité 1]] (5, 49 ; 7, 5), au [[traite2|traité 2]] (10, 13-19) et au [[traite5|traité 5]] (1, 10 et suiv.), sans y être développée, et elle est discutée jusqu'aux derniers écrits : le [[traite51|traité 51]] (13, 10 et suiv.) se demande si l'âme participe au mal en descendant, le [[traite53|traité 53]] y voit une illumination.

    **Trois moments.**

    | Période | Traités | Comment la descente est dite |
    | les premiers traités | 6, 9 | les modalités d'une chute, l'âme sur deux fronts |
    | la polémique | 22, 27, 33 | une décision des âmes, un corps qui participe |
    | les derniers traités | 53 | une illumination, comme le rayonnement de l'Un |

    - {amber}Les premiers traités{/amber}, plus proches des thèses gnostiques, n'insistent pas sur le caractère métaphorique de la descente, mais sur **les modalités de la chute**. L'âme y travaille **« sur deux fronts »**, même si elle ne descend pas réellement : elle est **{teal}« {/teal}pour ainsi dire {teal}amphibie »{/teal}** ([[traite6|traité 6]], 4, 31).
    - {amber}Puis Plotin se détache des gnostiques{/amber} : le débat **« entre amis »** devient une opposition ferme et hostile. Au [[traite27|traité 27]], la descente est le fait des âmes elles-mêmes, non d'un décret divin.
    - {amber}Enfin{/amber}, l'âme ne fait qu'**éclairer** le monde ([[traite53|traité 53]]), à l'instar de l'Un dont la puissance surabonde. {coral}La chute originelle et partielle, comprise d'abord comme une inclinaison vers le bas, se transforme en rayonnement qui laisse un reflet sur les ombres que sont les choses sensibles.{/coral}

    **Deux contradictions apparentes.**

    - {red}Faute ou non ?{/red} Le [[traite6|traité 6]] parle d'une **double faute** (5, 16-22), puisque l'âme choisit de venir ici-bas ; le [[traite53|traité 53]] dit que l'âme ne commet pas de faute.
    - {red}Descend-elle, ou non ?{/red} Un passage du [[traite9|traité 9]] semble opter pour une vision binaire, l'âme auprès de l'Intellect d'un côté, l'âme descendue dans un corps de l'autre.

    **Ce que Lacroix conclut.** Chacun de ces textes s'explique dans son contexte : {coral}le traité 6 ne dit pas que l'âme descend réellement, il la dit « amphibie » pour signifier qu'elle opère sur deux fronts{/coral}. L'idée de l'âme qui illumine n'apparaît d'ailleurs pas seulement au traité 53 : elle est déjà au [[traite28|traité 28]], et elle vient de Platon. Plotin a précisé sa pensée **contre ses interlocuteurs**, sans la modifier.

    ! Cette lecture est disputée : Narbonne voit au contraire la non-descente s'effacer après le traité 33, comme si elle n'avait servi qu'à combattre les gnostiques ([[ame6|unité suivante]]).
