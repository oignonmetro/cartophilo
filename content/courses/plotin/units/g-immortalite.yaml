lessons:
- id: g-immortalite-l1
  title: Immortalité
  notes: |-
    Chez Plotin, l'{violet}**immortalité**{/violet} de l'âme est [def]. Elle n'est pas {pink}la survie de la personne avec ses souvenirs{/pink} : ce qui ne meurt pas, c'est ce qui vit par soi, et l'âme qui s'en approche oublie ce qu'elle a été ici.

    __**L'âme ne peut pas mourir, parce qu'elle a la vie par elle-même : il faut un premier vivant.**__ Tout ce qui vit ne peut pas avoir reçu la vie d'un autre : « il est impossible en effet que toutes choses aient reçu la vie du dehors, sans quoi __on poursuivrait à l'infini__. Il doit, au contraire, y avoir une nature qui soit primitivement vivante, et qui soit de toute nécessité « impérissable et immortelle », puisqu'elle est aussi le principe de la vie de tous les autres êtres vivants » ([[traite2|traité 2]], chap. 9). Cette nature, c'est l'âme. Or ce qui a la vie par soi ne peut pas la perdre, parce qu'on ne perd que ce qu'on a reçu. Plotin le montre par le feu et le bois : le bois brûle tant qu'on l'alimente, parce que la chaleur lui vient du dehors ; mais « l'âme ne possède pas la vie de cette façon, comme si elle était une matière sous-jacente ; __c'est la vie qui est installée en elle qui fait qu'elle est l'âme__ » (chap. 11). D'où la conclusion : « elle tient d'elle-même une vie, __qui ne peut être détruite__. Comment en effet pourrait-elle être détruite, puisqu'elle ne vient pas de l'extérieur » (*ibid*.) ? Une chose simple ne se décompose pas : « l'âme est __une nature une et simple qui est en acte dans le fait de vivre__ » (chap. 12 ; voir [[g-vie|vie]]). L'altération ne peut pas non plus la détruire, car « lorsqu'elle détruit, l'altération détruit la forme, mais elle laisse la matière, car __le changement est une affection propre à un composé__ » (*ibid*.). Et l'expérience le confirme à sa manière : « s'ils soutiennent que toute âme peut périr, __toutes choses auraient dû avoir péri depuis longtemps__ » (*ibid*.) ; si la vie pouvait se perdre, un temps sans fin l'aurait épuisée.

    __**L'âme n'est ni un corps, ni une harmonie, ni la forme d'un corps : ce qui peut se défaire n'est pas elle.**__ Le traité 2 écarte une à une les thèses qui rendraient l'âme mortelle. Si elle était un corps, comme le veulent les stoïciens, elle périrait, car « si elle est un corps, __elle doit être entièrement décomposable__, car tout corps est un composé » ([[traite2|traité 2]], chap. 2). Si elle était l'harmonie du corps, elle disparaîtrait avec lui ; mais « l'âme est antérieure, tandis que l'harmonie est postérieure. __C'est la réalité antérieure qui gouverne le corps__ » (chap. 8 ; voir [[g-union-ame-corps|union de l'âme et du corps]]). Si elle était la forme du corps, l'entéléchie d'Aristote, elle en serait inséparable ; or les vivants changent de corps, ce qui prouve que « l'être de l'âme __ne consiste donc pas à être la forme de quelque chose__ ; elle est une réalité qui ne reçoit pas son être du fait de s'établir dans un corps, mais qui est avant même d'appartenir à ce corps » (*ibid*.). Chaque fois, ce qui pourrait mourir, le composé, l'accord, la forme liée, n'est pas l'âme.

    __**L'âme purifiée se découvre parente du divin.**__ Il y a une autre preuve, qui ne passe pas par le raisonnement mais par l'expérience que l'âme fait d'elle-même. L'âme « a part à ce qui est divin en raison de sa parenté et de sa communauté de réalité avec elles. Voilà pourquoi __quiconque parmi nous est pur s'éloignerait peu__, pour ce qui est de son âme, des choses qui sont là-bas, car elle ne leur serait inférieure que dans la mesure où elle est dans un corps » ([[traite2|traité 2]], chap. 10). Pour le voir, il faut ôter ce qui la recouvre, comme on nettoie des statues divines « recouvertes de vert-de-gris par le temps ». « C'est comme si __l'or avait une âme__ et se mettait à se débarrasser de toute la boue qui le recouvre. Parce que, auparavant, il s'ignorait lui-même, il ne voyait pas l'or ; mais maintenant qu'il se voit isolé, il parvient à s'étonner de la valeur qui est la sienne et à comprendre que, désormais, __il n'a plus aucun besoin d'une beauté empruntée__ » (*ibid*. ; voir [[g-katharsis|purification]]). L'âme qui se voit ainsi voit qu'elle n'est pas de la nature de ce qui meurt.

    __**Ce qui survit, c'est l'âme, non le composé, et l'âme bonne oublie.**__ La mort défait le vivant, non l'âme. Les âmes ne sont pas toutes aussi promptes à quitter ce qui s'est ajouté à elles : « les âmes pures, lorsqu'elles sont affranchies, __abandonnent ce qui leur fut accolé à leur naissance__, tandis que les autres le gardent très longtemps. Mais lorsqu'il aura été abandonné, cet élément inférieur lui non plus ne périra pas, aussi longtemps qu'existera ce dont il tire son origine. En effet __rien de ce qui vient de ce qui est ne périt__ » ([[traite2|traité 2]], chap. 14). Les âmes des bêtes et des plantes ne meurent pas davantage, car « absolument toutes en effet ont pris leur élan du même principe » (*ibid*.). Mais l'âme ne garde pas indéfiniment la mémoire de sa dernière vie : « à mesure que passe le temps qui suit la mort, vont se manifester les souvenirs d'autres choses qui viennent des vies antérieures » ; et, « comme elle se sera purifiée plus encore du corps, elle recouvrera en sa mémoire même des choses qu'elle ne retenait pas au cours de sa vie ici-bas » ([[traite27|traité 27]], chap. 27). Plus elle monte, plus elle oublie ce qui était d'ici : « si quelqu'un dit que __l'âme bonne est oublieuse__, il a raison de le dire, si c'est en ce sens. Car elle s'enfuit loin du multiple et conduit le multiple à l'un » (chap. 32 ; voir [[g-mort|mort]]).

    | Thèse adverse | Pourquoi l'âme n'est pas cela |
    | un corps | tout corps est composé, donc décomposable |
    | une harmonie | l'harmonie est postérieure, l'âme gouverne le corps |
    | la forme d'un corps | les vivants changent de corps, l'âme est avant lui |

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 2, chap. 2 | un corps serait décomposable |
    | traité 2, chap. 8 | ni harmonie ni forme d'un corps |
    | traité 2, chap. 9 | il faut un premier vivant, immortel |
    | traité 2, chap. 10 | l'or qui se débarrasse de la boue |
    | traité 2, chap. 11 | la vie installée en elle ne peut être détruite |
    | traité 2, chap. 14 | rien de ce qui vient de ce qui est ne périt |
    | traité 27, chap. 32 | l'âme bonne est oublieuse |

