- id: traite35-l4
  title: "Repérage : le plan du traité 35"
  notes: |-
    **Le traité 35 examine quatre explications et retient la dernière (chap. 1), puis en réfute une cinquième (chap. 2).**

    | Moment | Lieu | Ce qui s'y joue |
    | la question | 1, 1-3 | les objets petits, les distances courtes |
    | l'explication stoïcienne | 1, 4-6 | la lumière se contracte |
    | la forme seule arrive à l'œil | 1, 6-9 | le principe rationnel de la grandeur |
    | l'explication épicurienne | 1, 9-12 | examiner chaque partie de près |
    | la grandeur vue par accident | 1, 12-17 | la couleur, objet premier |
    | le cas de l'ouïe | 1, 17-29 | l'intensité, la portée |
    | la confirmation | 1, 29-51 | la montagne ; la distance |
    | l'angle visuel réfuté | chap. 2 | le ciel |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! Le traité compte cinq solutions en tout : quatre au chapitre 1, et une cinquième, celle de l'angle visuel, que réfute le chapitre 2.
  points:
  - id: traite35-l4-p1
    sentence: "Dans le traité 35 de Plotin, la thèse que la grandeur n'est vue que par accident se trouve en ___."
    answer: "1, 12-17"
    alt: ["chap. 1, 12-17"]
  - id: traite35-l4-p2
    sentence: "Dans le traité 35 de Plotin, la comparaison avec l'ouïe se trouve en ___."
    answer: "1, 17-29"
    alt: ["chap. 1, 17-29"]
  - id: traite35-l4-p3
