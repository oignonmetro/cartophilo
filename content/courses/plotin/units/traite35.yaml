- id: traite35-l2
  title: "La grandeur suit la couleur"
  notes: |-
    **La comparaison avec le son** (1, 17-29) : l'ouïe perçoit d'abord un son, non une distance. En s'éloignant, un son ne devient pas plus petit, mais plus faible et plus confus ; de même, la vue d'un objet lointain perd d'abord la netteté de sa couleur, et la taille avec elle. Comme la couleur, le son lointain arrive indistinct, et l'ouïe aussi recherche une forme. Objection : quel autre sens aurait pour objet premier la grandeur du son ? Réponse : l'ouïe perçoit cette grandeur **non comme une quantité, mais comme une intensité**, et alors ce n'est pas par accident, pas plus que pour le **goût**, qui perçoit l'intensité du doux. Au sens strict, la grandeur du son est sa **portée** : celle-là n'est perçue que par accident.

    **Couleur et grandeur s'amoindrissent ensemble** (1, 29-34) : objection, les couleurs ne deviennent pas plus petites, mais moins distinctes. Réponse : les deux deviennent moindres qu'elles ne sont ; une couleur amoindrie devient indistincte, une grandeur amoindrie devient petite ; et puisque la grandeur **accompagne la couleur**, elle diminue à proportion.

    **Mesurer partie par partie** (1, 34-48) : pour connaître la taille d'un ensemble, la vue additionne ses parties ; de loin, les détails se fondent en une masse, et la vue, sans points d'appui, juge l'ensemble plus petit. Sur une montagne couverte de maisons et d'arbres, on mesure de près l'ensemble à partir de chaque chose vue ; de loin, les formes ne nous parviennent pas l'une après l'autre, et la vue perd le moyen de mesurer. Même de près, des objets variés vus comme un ensemble unique paraissent plus petits ; une grandeur **uniforme**, de couleur semblable, trompe aussi : la vue **glisse** sur ses parties, faute d'une différence propre à chacune.

    **La distance** (1, 48-51) : l'intervalle se contracte pour la même raison ; la vue ne perçoit pas de quelle forme est sa partie éloignée.

    ! La distance n'est pas déduite de la grandeur : elle paraît courte pour la même raison que la grandeur paraît petite, parce que sa partie lointaine est indistincte.
