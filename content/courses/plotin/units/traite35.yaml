id: traite35
title: "Traité 35 (II, 8) : Comment se fait-il que les objets vus de loin paraissent petits ?"
subtitle: "La grandeur vue par accident"
icon: compass
color: sky
lessons:
- id: traite35-l1
  title: "La question et les quatre explications"
  notes: |-
    **Une question d'optique** : Porphyre range l'optique parmi les sciences que Plotin connaissait bien, sans vouloir s'y attarder (*Vie de Plotin*, 14). Hormis les cinq premiers chapitres du traité 29, *Sur la vue*, ce traité de trois pages est le seul qui en traite.

    **Pourquoi c'est un problème pour Plotin** : aujourd'hui, on explique le phénomène par la géométrie de la lumière (depuis Képler et Descartes) : l'image formée sur la rétine est d'autant plus petite que l'angle visuel est faible. Pour Plotin, voir n'est pas recevoir une petite image gravée dans l'œil comme un sceau dans la cire : c'est un **acte de l'âme**, qui se porte vers l'objet réel. Or la grandeur est pour lui une **Forme intelligible**, par nature indivisible et immuable. Comment une Forme paraîtrait-elle rapetissée par la seule distance ? Si la distance altérait la grandeur perçue, la sensation tromperait sur la Forme elle-même.

    **Un phénomène étudié par toutes les écoles** :

    | École | Ce qu'elle en fait |
    | les sceptiques | une preuve qu'on ne peut se fier aux sens |
    | les stoïciens | l'effet de la faiblesse du rayon visuel issu de nos yeux |
    | les épicuriens | l'effet de l'érosion des simulacres qui traversent l'air |

    Épicure tient pourtant que les **astres** ont à peu près la grandeur qu'on leur voit (*Lettre à Pythoclès*, 91), et Lucrèce le suit. La seconde partie de la question, **pourquoi les distances paraissent plus courtes**, n'a pas d'écho chez les autres écoles.

    **Quatre explications** (1, 1-17) :

    | Explication | Inspiration |
    | la lumière se contracte à la mesure de la pupille | stoïcienne |
    | seul le principe rationnel de la grandeur parvient à l'œil | le *De l'âme* d'Aristote |
    | il faut examiner de près chaque partie de l'objet | épicurienne |
    | la grandeur est vue par accident | le *De l'âme* d'Aristote |

    Plotin présente les trois premières sans les discuter, **défend la quatrième** et réfute longuement une cinquième (chap. 2). Pour Aristote, la **couleur** est l'objet premier de la vue ; la grandeur n'en est perçue que de manière secondaire, par accident. De près, on sait la dimension de la surface colorée ; de loin, on sait seulement qu'elle est colorée. Autrement dit, la vue ne mesure pas directement la taille : elle perçoit d'abord des couleurs et des détails de formes, et ne saisit la taille qu'à travers eux. Quand la distance augmente, la couleur et les détails s'estompent, et la taille paraît diminuer avec eux.

    ! « Par accident » ne veut pas dire par hasard : la grandeur est perçue avec la couleur, à sa suite, et non pour elle-même.
