- id: traite35-l3
  title: "Contre l'angle visuel"
  notes: |-
    **Une cinquième explication, réfutée** (chap. 2) : l'objet lointain paraîtrait petit parce que l'**angle visuel** sous lequel on le voit est plus petit. C'est l'explication des opticiens, et celle que retiendront les modernes. Plotin a déjà dit ailleurs que c'est impossible ; il ajoute un argument. Qui soutient cette thèse concède que le reste du champ visuel voit autre chose, un autre objet ou l'**air**. Mais quand la montagne est si grande que la vue ne laisse rien de côté, quand l'objet égale ou déborde le champ visuel, il paraît encore bien plus petit qu'il n'est.

    **L'exemple du ciel** : on ne peut voir d'un seul coup d'œil un **hémisphère** entier ; mais accordons-le. Si la vue entière embrasse l'hémisphère entier, et que ce qui y apparaît est plusieurs fois plus grand qu'il ne nous paraît, la petitesse de l'angle visuel ne peut être la cause.

    ! L'argument ne nie pas l'angle visuel : il montre qu'à angle maximal l'objet paraît encore plus petit qu'il n'est, et que la cause est donc ailleurs.
  points:
  - id: traite35-l3-p1
    sentence: "La cinquième explication, réfutée au chapitre 2 du traité 35, invoque la petitesse de l'___ visuel."
    answer: "angle"
