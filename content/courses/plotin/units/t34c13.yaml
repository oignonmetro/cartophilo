- id: "t34c13-m3e"
  title: "Comme le nom propre de la chose même"
  notes: |-
    **Une comparaison :** {coral}**c'est « comme si l'on prononçait le nom propre de la chose même »**{/coral}**.** Le « ceci » renvoie à la chose elle-même, comme un nom propre.

    **Pourquoi le nom propre ?** __Un nom propre, comme {yellow}« Socrate »{/yellow}, renvoie directement à un individu__, sans passer par une description qui pourrait convenir à d'autres. Le « ceci » renvoie de la même manière à la chose même. Son nom commun, ce serait {red}l'espèce dans laquelle elle s'inscrit{/red} ; son nom propre, c'est {green}cette *mia idea* ou cette *mia ousia*{/green}, cette idée unique qui, par son unicité ({yellow}le cheval n'est pas le bœuf{/yellow}), {coral}fait signe vers l'Un{/coral}. Le nom propre est « ceci », non « bœuf » ou « soleil ».

    **Pourquoi « comme si » ?** La formule est une **comparaison**, non une thèse sur les noms propres : {amber}c'est une image{/amber}. L'expression de « nom propre » (*idion onoma*) est sans doute un écho de débats {sky}stoïciens{/sky}, sans que le contexte permette de préciser lesquels ; c'est sans doute le seul endroit où Plotin l'emploie. Plotin a souvent précisé ailleurs les rapports de la pensée humaine et des mots qu'elle emploie, notamment à propos de l'Un ([[traite39|traité 39]], 13, 47). Le *Parménide* (133d) en offre une remarque explicite.

    **Qu'est-ce qu'établit ce passage ?** Que le « ceci », et avec lui l'un, n'est {red}ni un mot vide ni une affection sans objet{/red} : {green}il désigne une réalité{/green}. C'est la première des deux manières de réduire l'unité à rien que le troisième moment écarte.

    ! « C'est comme si » n'est pas {red}une théorie du nom propre{/red} : c'est {green}une image du fonctionnement du « ceci »{/green}.
