- id: "t34c13-m2e"
  title: "À moins qu'il ne produise l'être en s'inclinant"
  notes: |-
    **La restriction :** {coral}**« à moins encore qu'il ne produise l'être en s'inclinant pour l'engendrer »**{/coral}**.** Elle dit en quel sens l'être serait « dans » l'un : seulement comme ce qu'il produit, {yellow}comme l'effet est contenu dans la puissance de sa cause{/yellow}.

    ? **Inclinaison** (*neusis*) : le mouvement de ce qui se penche vers le bas ; chez Plotin, surtout l'inclinaison de l'âme vers le corps, qui la fait descendre. Ici, le principe se pencherait vers ce qu'il engendre (*auto prosneusan autou tèi genesei*).

    **Pourquoi « à moins encore qu'il ne produise » ?** La concessive est **prudente**, et la prudence est voulue : __l'Un ne se meut pas et ne change pas__, une inclinaison au sens propre supposerait en lui un changement. D'où le « à moins que », qui {amber}signale qu'on parle par image{/amber}. Plotin procède de même lorsqu'il parle de l'activité de l'Un : il dit « comme une activité », *hoion energeia*, {teal}« {/teal}ce qui lui {teal}tient lieu d'acte »{/teal} ([[traite39|traité 39]], 7, 47).

    **Pourquoi l'inclinaison ?** C'est l'une des variantes qui expliquent le mouvement plus général de la **procession** hors de l'Un. Mais le vocabulaire de l'inclinaison correspond plutôt à la {violet}descente de l'âme{/violet} qu'à la constitution de l'être : {teal}« {/teal}si {teal}l'inclinaison est une illumination dirigée vers ce qui se trouve plus bas{/teal}, {teal}ce n'est pas une faute »{/teal} ([[traite53|traité 53]], I, 1, 12, 24-26). D'où la légère restriction. **Si ce vocabulaire a un sens**, semblent dire ces mots elliptiques, {coral}il y a comme une présence de l'être dans l'un{/coral}. D'autres textes recourent aux images traditionnelles du {yellow}père{/yellow}, de la {yellow}source{/yellow} ou de la {yellow}racine{/yellow}.

    **Qu'est-ce qu'établit ce deuxième moment ?** L'un n'est plus seulement la condition de tout ce qui est pensé, il est {green}la condition de tout ce qui est{/green}, et il est antérieur à l'être parce qu'il se passe de lui. Mais cette antériorité ne tient que par l'asymétrie, et {pink}la génération de l'être reste affirmée par la doctrine plutôt que démontrée{/pink}.

    ! L'« inclinaison » n'est pas {red}un mouvement de l'Un{/red} : c'est {green}une image{/green}, signalée comme telle par le « à moins que ».
