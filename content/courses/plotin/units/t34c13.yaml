# Unité de texte (voir content/textes.md) : Plotin, traité 34 (VI, 6), Sur
# les nombres, 13, 36 - 14, 13, traduction L. Brisson (GF), d'après la
# synthèse de l'argumentation fournie par l'utilisateur, le rapport du jury de
# l'agrégation 2012 (sans le nommer dans les cartes) et les notes de
# L. Brisson. Niveau approfondi (refonte du 2026-11-27) : une leçon par
# proposition, cinq mouvements repérés par leurs lignes, chacun en parties
# (`part`, une par argument de la synthèse) ; toutes les cartes antérieures
# gardées avec leur identifiant. Les citations des autres traités viennent de
# la GF. Le texte grec n'est pas découpé en paragraphes.

id: "t34c13"
title: "L'un est une réalité (34 [VI, 6], 13-14)"
subtitle: "Traité 34, Sur les nombres, chapitres 13-14"
depth: "approfondie"
icon: "page"
color: "coral"
intro: |-
  Un passage du traité 34 (VI, 6), *Sur les nombres*, dans la traduction de L. Brisson (GF). Quand on dit « un » d'une chose, lui attribue-t-on quelque chose de réel ? Plotin montre que la pensée et le discours présupposent l'un, que l'un précède l'être, puis, en répondant à deux objections, que l'unité est dans les corps par accident et par soi dans ce qui vient en premier.
lessons:
- id: "t34c13-i1"
  title: "Le texte, sa place et son plan"
  notes: |-
    **Le passage appartient au traité 34 (VI, 6),** {sky}***Sur les nombres***{/sky}**, cité dans la traduction de** {sky}**L. Brisson**{/sky} **(GF).** Le traité cherche ce qu'est le {violet}nombre{/violet} et s'il existe {amber}en soi{/amber} : il soutient que les nombres sont des {coral}réalités intelligibles{/coral}, antérieures aux choses qu'on compte. Le plan de la GF range les chapitres {sky}11 à 14{/sky} en {amber}objections et réponses à la thèse du nombre en soi{/amber} : le chapitre 11 objecte que la décade en soi n'est qu'un ensemble d'unités, le chapitre 12 qu'{red}il n'y a pas d'unité en soi, seulement des unités particulières{/red} ; le chapitre 13 répond qu'{green}il y a des degrés dans l'un{/green}, le chapitre 14 que {green}la comparaison de l'un avec un relatif est injustifiée{/green}.

    **Pourquoi tant d'objections ?** Le chapitre 12 prête à un adversaire, que les notes de L. Brisson identifient aux {sky}stoïciens{/sky}, une thèse précise : {red}__l'un n'est qu'une « affection de l'âme »__{/red}, une « notion » que nous tirons des choses après coup ; et « un » serait comme {yellow}« à droite » ou « en haut »{/yellow}, qui ne se disent que d'une position par rapport à une autre. Le début du chapitre 13 répond déjà que {coral}ce n'est pas à propos de rien que la pensée dit « un »{/coral}, et que l'unité a des degrés ({yellow}l'armée est moins une que la maison, la maison moins que le continu{/yellow}) ; or {amber}il ne peut y avoir de plus ou de moins dans ce qui n'est pas{/amber}. Le passage étudié reprend la question à sa racine.

    **Le passage se lit en trois moments, une montée puis un retour** : {coral}**de la pensée à l'un**{/coral} (13, 36-50), {coral}**de l'être à l'un**{/coral} (13, 50-54), puis {coral}**de l'un aux choses**{/coral}, en répondant aux objections (13, 54 - 14, 13).

    | Mouvement | Lieu | Ce qui s'y joue |
    | ranger l'un parmi les intelligibles, puis montrer que la pensée ne peut ni s'en passer ni le produire | 13, 36-50 | L'un, connu sur le mode de l'intelligible, est présupposé par toute pensée et tout discours, qui ne peuvent l'avoir formé : il faut admettre le nombre. |
    | transposer l'argument à l'existence des choses | 13, 50-54 | Rien n'est qui ne soit un : l'un doit se trouver avant l'être et l'engendrer, puisque l'être contient l'un qui est multiple et l'un ne contient pas l'être. |
    | écarter l'objection du « ceci » vide | 13, 54-60 | Le « ceci » désigne au lieu de nommer : il suppose une présence, une réalité sous-jacente. |
    | écarter l'objection du relatif par la masse divisée | 14, 1-8 | L'un ne se perd que par une division qui affecte la chose : il était en elle, outre le sujet. |
    | fixer le double statut de l'un | 14, 8-13 | Ce qui va et vient dans un même sujet est un être : accident dans les choses inférieures, par soi dans ce qui vient en premier. |

    Le **premier moment** ne prouve pas que l'un est intelligible : il le pose par analogie ; ce qu'il prouve, c'est que l'un passe du statut de {red}résultat{/red} (ce que la pensée trouverait en comptant) à celui de {green}condition{/green} (ce sans quoi elle ne pourrait pas compter). Le **deuxième** est le point le plus haut du texte, où l'un est dit sans être. Le **troisième** ne progresse pas vers le principe : il {amber}consolide{/amber}, en répondant à des objections formulées **hors de l'extrait** (au chapitre 12 et au début du chapitre 13). Les arguments les mieux étayés portent sur la pensée et sur l'unité des corps ; les plus fragiles sont aux deux extrémités, l'intelligibilité de l'un, posée {pink}par analogie{/pink}, et la génération de l'être, posée {pink}par doctrine{/pink}.

    ! Le troisième moment n'est pas une montée de plus vers l'Un : c'est un retour aux choses, qui referme le texte sur son ouverture.
