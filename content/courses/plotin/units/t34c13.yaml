- id: t34c13-p4
  title: "L'un n'est pas un relatif : la masse divisée"
  notes: |-
    **L'un n'est pas un relatif : il ne se perd pas par une affection de son seul corrélat, mais par une division qui en prive la chose elle-même. La masse divisée le prouve.**

    | Extrait | Argument | Ce qu'il fait |
    | 1 | 7 | un critère : la perte de l'un affecte la chose elle-même |
    | 2 | 7a | une preuve par l'exemple : la masse divisée |

    L'objection du relatif, exposée plus en détail au chapitre 12, revient en conséquence de ce qui précède. L'argument a une structure nette : un critère, puis une preuve par l'exemple.

    ! L'exemple porte sur une masse, donc sur l'unité sensible : il n'établit pas encore le statut de l'unité.

    === 1 Argument 7 : l'un n'est pas un relatif

    **Un relatif ne se dit d'une chose que par rapport à une autre, son corrélat : « plus grand que », « à droite de », « double de ».** C'est le sens des *Catégories* d'Aristote. Un relatif peut cesser de convenir à une chose sans que cette chose change : « être à droite de x » cesse d'être vrai si x se déplace ; Paul est plus grand que Pierre, Pierre grandit, et Paul n'est plus plus grand que lui sans avoir changé. Le *Phédon* donne les exemples de « plus grand que » et « plus petit que » : Paul peut être à la fois plus grand que Pierre et plus petit que Jean. La qualification est alors étrangère à ce qu'est la chose. C'est ce que dit le texte : ces termes « perdent leur nature propre » parce que « leur corrélat a pâti ».

    L'**objection** fait de l'unité un relatif de ce genre : vue de loin, une ville paraît une, vue de près elle est un agrégat de maisons ; dix soldats sont dix ou un peloton. L'unité ne serait alors rien dans la chose.

    La réponse pose un **critère** : pour « échapper à l'un » (*ek tou hen ekbènai*), il faut que la chose elle-même subisse quelque chose, une **division** en deux ou plus, qui la « prive » de l'un ; un changement plus profond qu'une modification de configuration. La réponse est **modalisée** (« il serait raisonnable de répondre ») et ne dit pas que l'un n'est relatif en aucun sens, seulement qu'il ne se perd pas sans que la chose soit affectée. Les relatifs sont étudiés en détail dans le traité 42 (VI, 1), chapitres 6 à 9.

    ! Perdre l'unité n'est pas un changement de point de vue : c'est un événement qui arrive à la chose.

    === 2 Argument 7a : la masse divisée

    **Une masse qui, divisée, devient deux sans cesser d'être masse avait en elle, outre le substrat, l'un que la division a détruit.** Qu'on coupe en deux une boule d'argile : l'argile demeure, en même quantité (c'est le **substrat**, le matériau qui demeure sous le changement), mais il y a deux boules au lieu d'une. Ce qui a disparu, c'est son unité.

    Deux conclusions : l'unité était **distincte du substrat**, puisque le substrat demeure quand elle disparaît ; et elle était **dans la chose**, puisqu'il a fallu agir sur la chose pour la lui retirer. La division effectue en acte une opération parfois irréversible. Alors que les relations de comparaison (« plus sucré que », « plus riche que ») relèvent de la contingence du sensible, la participation à l'unité est l'imitation de l'unité intelligible, qui elle-même imite l'unité qui est « avant l'être ».

    ! Ce qui est établi ici est la réalité de l'unité dans le sensible, non encore son statut.
  passage:
    label: "14, 1-8"
    text: "Aux arguments qui ont fait appel à la notion de relatif, il serait raisonnable de répondre que l'un n'est pas de ces termes qui, parce que leur corrélat a pâti, perdent leur nature propre sans qu'eux-mêmes aient pâti en rien. Non, il faut, pour qu'un être échappe à l'un, qu'une division en deux ou plus lui ait fait subir la privation de l'un. Si donc une même masse, après division, devient deux, sans pour autant disparaître comme masse, il est clair que, outre le substrat, il y avait de plus en elle l'un qu'elle a perdu parce que la division l'a détruit."
