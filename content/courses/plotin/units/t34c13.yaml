- id: t34c13-bilan
  title: "Bilan : deux unités, une hiérarchie"
  notes: |-
    **La question était de savoir si l'unité est quelque chose de réel ou seulement une manière de parler. Le texte répond qu'elle est réelle, et le montre de trois façons.** La pensée et le discours la présupposent et ne peuvent pas l'avoir produite ; l'être ne se passe pas d'elle, alors qu'elle se passe de l'être ; les corps peuvent la perdre par division, ce qui prouve qu'elle était en eux autre chose que leur matière. L'unité n'est donc ni un mot, ni une relation, ni une construction de l'esprit.

    | | L'un démontré | L'un affirmé |
    | Lieu | 13, 36-50 et 14, 1-13 | 13, 50-54 |
    | Ce qu'il est | l'un qu'exige la pensée et que perd la masse divisée | l'un qui précède l'être |
    | Statut | l'« un qui est », intelligible, « parmi les êtres » | l'Un au-delà de l'être |
    | Établi par | arguments (4b, 7a) | doctrine (procession) |

    Le texte ne se contredit pas, parce qu'il ne parle pas toujours du même un. L'un qu'il démontre et dit intelligible est l'unité présente dans le premier être, celle par laquelle chaque Forme est une, que la pensée possède d'avance et dont l'unité des corps n'est qu'une participation. Mais cette unité intelligible est elle-même « l'un qui est multiple », l'unité d'un être déterminé : c'est pourquoi elle ne peut être première, et renvoie à un un sans mélange d'être, qui la précède et l'engendre. L'Un au-delà de l'être n'est pas l'**objet** du texte, il en est l'**horizon**, atteint une seule fois par l'asymétrie de l'un et de l'être, et désigné seulement par image, dans l'« inclinaison ».

    Le paradoxe se résout en une **hiérarchie** : l'unité des corps est reçue de l'unité intelligible, et l'unité intelligible est la trace de l'Un qui précède l'être ; le même mot désigne, à chaque niveau, une unité qui imite la précédente. Restent deux points sans démonstration, l'intelligibilité de l'un (posée par analogie) et la génération de l'être (posée par la doctrine de la procession). Les signaler, plutôt que les effacer, rend compte de l'originalité du passage, qui aborde le premier principe **par le bas**, à partir de ce que suppose le moindre acte de compter.

    Le passage engage des doctrines centrales du plotinisme : le lien entre l'unité et l'être, la procession (« s'inclinant », « les choses inférieures »), la transcendance de l'un (« il doit se trouver avant l'être »), la priorité de l'être sur la pensée. L'essentiel est d'affirmer avec clarté le **paradoxe** qui fait son originalité, l'un comme intelligible, et de donner forme au rapport problématique entre l'un-nombre et l'Un-premier principe.

    ! Les deux points non démontrés ne sont pas des défauts à taire : ce sont eux qui font l'originalité du passage.
