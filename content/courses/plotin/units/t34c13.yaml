- id: "t34c13-m3c"
  title: "Pas une affection sans objet"
  notes: |-
    **La conclusion négative :** {coral}**le « ceci » n'est pas « une affection de la raison discursive qui ne porterait sur aucun être »**{/coral}**.** Il n'est ni un mot creux, ni une impression sans objet.

    ? **Affection** (*pathèma*) : au sens ancien, ce que l'esprit subit, une impression, un état ; {yellow}le sentiment d'avoir entendu un bruit quand il n'y en a pas eu{/yellow} serait une affection vide.

    **Pourquoi « affection » ?** __Parce que c'est le mot de l'adversaire.__ Au chapitre 12, l'un est dit {red}« une affection de l'âme relative à chacun des êtres »{/red}, expression qui vient d'{sky}Aristote{/sky} (*De l'interprétation*, 1) et que les {sky}stoïciens{/sky} avaient reprise. Le début du chapitre 13 a déjà répondu : {teal}« {/teal}ce n'est pas {teal}une affection vide{/teal}, ce n'est pas {teal}à propos de rien qu'elle dit “un” »{/teal} (*kenon pathèma*, 13, 8-9).

    **Pourquoi l'affection n'est-elle pas vide ?** Il faut comprendre que l'âme qui pense l'unité en voyant n'importe quelle chose déterminée ({yellow}un vivant, un livre, un tas de sable, une foule{/yellow}) {red}ne pense pas à rien, ni même à une simple structure logique{/red} : ce *pathèma* a une plénitude, et il assure au mot (*onoma*) correspondant {coral}une réelle plénitude, une plénitude « hénologique »{/coral}. Toutes les unités du monde sensible et du monde intelligible sont des {amber}traces de l'Un premier et ineffable{/amber}.

    **Pourquoi « Dès lors » ?** La conclusion découle de la phrase précédente : ce qui désigne une présence {green}ne peut pas être vide{/green}.

    ! Plotin ne nie pas que dire « un » soit une affection de la pensée : il nie {red}qu'elle soit vide{/red}, {green}sans objet{/green}.
