- id: "t34c13-m5b"
  title: "Accident dans les sensibles, en soi dans les intelligibles"
  notes: |-
    **La distinction :** {coral}**l'un, « tantôt il est un accident pour ces sujets », « tantôt il existe en soi », « suivant qu'il apparaît dans les sensibles ou dans les intelligibles »**{/coral}**.**

    ? **Accident, par soi** : une propriété est **par soi** quand elle appartient à une chose en vertu de ce qu'est cette chose ; elle est **accidentelle** quand elle lui appartient sans découler de ce qu'elle est. La distinction vient d'{sky}Aristote{/sky}, qui distingue l'essence et l'accident.

    **Pourquoi « accident » ?** Il faut l'entendre comme {violet}attribut{/violet} au sens large, et {red}non comme hasard{/red}. Le terme est susceptible de différents degrés de contingence (*Métaphysique*, Δ, 30) : {yellow}tout vêtement a nécessairement une couleur, mais aucune couleur particulière ne découle de ce qu'est un vêtement{/yellow}. De même, tout corps sensible a nécessairement une certaine unité, mais il ne s'agit pas de l'unité en soi, seulement de l'unité **prédiquée**.

    **Pourquoi « existe en soi » ?** Dans l'intelligible, l'unité appartient à la chose par ce qu'elle est : {yellow}une Forme, comme la justice, ne peut pas être coupée en deux justices{/yellow}. La distinction reprend, en termes aristotéliciens, la {coral}participation{/coral} posée par l'analogie initiale : le dernier moment s'appuie sur le deuxième pour revenir au premier.

