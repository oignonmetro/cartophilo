- id: "t34c13-m1"
  title: "La réalité et l'être sont de l'intelligible"
  notes: |-
    **La phrase s'ouvre sur un modèle :** {violet}**la réalité et l'être**{/violet} **sont** {coral}**« quelque chose d'intelligible et non pas de sensible »**{/coral}**, bien que le sensible y participe.** Plotin ne le démontre pas : il le pose comme acquis, pour y ranger ensuite l'un. Tout l'argument suivant tient à cette comparaison, {amber}« tout comme… de même »{/amber}.

    **Pourquoi « En outre » ?** Le passage prend le relais du début du chapitre 13, qui vient d'établir que l'un a des degrés et qu'{coral}il y a dans tous les cas « référence à l'un »{/coral}. « En outre » ajoute une seconde raison, d'un autre ordre : non plus les degrés de l'un dans les choses, mais {amber}la manière dont la pensée le connaît{/amber}.

    ? **Intelligible** : ce que seule la pensée saisit, par opposition au {violet}sensible{/violet}, que les sens perçoivent. Le cheval qu'on voit dans un pré est sensible ; ce que tous les chevaux ont en commun, et qui ne se confond avec aucun d'eux, est intelligible : la {violet}Forme{/violet} ou {violet}Idée{/violet} du cheval.

    ? **Réalité** (*ousia*) : ce qui est vraiment, stable et identique à soi. La GF rend *ousia* par « réalité », d'autres traductions par « substance ».

    **Pourquoi la réalité et l'être sont-ils « quelque chose d'intelligible et non pas de sensible » ?** __Parce que ce qui est vraiment ne change pas__ : {yellow}la beauté d'un bouquet se fane, la beauté elle-même ne se fane pas{/yellow}. Les choses sensibles naissent, changent et périssent ; {coral}elles n'ont d'être que par emprunt{/coral}. Le couple « la réalité et l'être » (*hè ousia kai to einai*) appelle la doctrine de l'{violet}homonymie de l'être{/violet} : l'être au sens strict, la réalité, n'existe que dans l'intelligible, la {teal}« plaine de la vérité »{/teal} du {sky}*Phèdre*{/sky} (248b), où *ta onta*, *hai ousiai*, *ta eidè* (les étants, les réalités, les Formes) sont synonymes ; le sensible est être {amber}au sens dérivé{/amber}.

    ? **Homonymie de l'être** : l'être se dit en deux sens, au sens strict de l'intelligible et au sens dérivé du sensible, qui n'est pas pour autant non-être comme la matière. Elle est l'autre nom de la participation, et non une « duplicité de l'être ».

    **Pourquoi « bien que le sensible participe des intelligibles » ?** La concession prévient une objection : si le sensible a de l'être, l'être n'est-il pas aussi sensible ? {green}Non : il l'a reçu{/green}. Cette homonymie fonde la beauté du monde sensible, que Plotin défend contre les {sky}Gnostiques{/sky} dans le [[traite33|traité 33]], qui précède *Sur les nombres*.

    ? **Participation** (*methexis*) : la relation par laquelle une chose sensible tient ce qu'elle est d'une Forme ; {yellow}ce cheval-ci est un cheval parce qu'il imite, imparfaitement, le cheval en soi{/yellow}. Elle va toujours __du sensible vers l'intelligible__, jamais l'inverse ; ce n'est pas une identité mais une {violet}imitation{/violet}.

    **Pourquoi Plotin peut-il la tenir pour acquise ?** C'est la doctrine du {sky}*Phédon*{/sky} et de *La République*, que Plotin reprend en rejetant les objections qu'{sky}Aristote{/sky} lui oppose au début de la *Métaphysique* ; sans cet ancrage dans les Formes, {red}le sensible sombrerait dans le flux héraclitéen{/red} : {coral}la participation lui assure une consistance ontologique{/coral}.

    ! Écrire que {red}« les Formes participent au sensible »{/red} renverse la participation : c'est {green}le sensible qui participe de l'intelligible{/green}, et c'est une erreur grave.
