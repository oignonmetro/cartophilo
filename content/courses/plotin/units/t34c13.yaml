- id: "t34c13-m4c"
  title: "Il faut une division qui prive la chose de l'un"
  notes: |-
    **Le critère :** {coral}**« pour qu'une chose échappe à l'un », il faut « qu'une division en deux ou en un nombre plus grand lui ait fait subir la privation de l'un »**{/coral}**.**

    **Pourquoi « Non » ?** L'adverbe oppose deux manières de perdre : par l'affection d'un corrélat, propre aux relatifs, et par une **division** qui affecte la chose elle-même. __Pour qu'une chose cesse d'être une, il ne suffit pas que quelque chose change autour d'elle__ : {coral}il faut qu'elle-même subisse quelque chose{/coral}.

    **Pourquoi « échappe à l'un » ?** L'expression grecque, *ek tou hen ekbènai*, dit un véritable départ hors de l'unité, {amber}un changement plus profond qu'une simple modification de configuration{/amber}. Alors que les relations spatiales et, plus généralement, celles qui tiennent à des comparaisons ({yellow}« plus sucré que », « plus riche que »{/yellow}) relèvent de la contingence du sensible, {green}la participation à l'unité n'est pas un simple état de fait{/green}.

    **Pourquoi « privation » ?** Le mot dit qu'on retire à la chose ce qu'elle avait : {coral}la perte de l'unité n'est pas un changement de point de vue, c'est un événement qui arrive à la chose{/coral}.

