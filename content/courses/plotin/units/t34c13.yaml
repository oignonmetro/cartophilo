- id: "t34c13-o3"
  title: "Leibniz, Kant, Frege : où est l'unité ?"
  notes: |-
    **La question du passage, l'unité est-elle dans les choses ou dans la pensée, traverse la philosophie moderne.** Trois réponses la reprennent, chacune d'un côté différent de celle de Plotin.

    **Leibniz : pas de multitude sans vraies unités.** Dans sa lettre à {sky}Arnauld{/sky} du 30 avril 1687, {sky}Leibniz{/sky} tient {teal}« {/teal}pour un axiome cette proposition identique qui n'est diversifiée que par l'accent, savoir que {teal}ce qui n'est pas véritablement *un* être n'est pas non plus véritablement un *être* »{/teal}, et ajoute : {teal}« {/teal}On a toujours cru que {teal}l'un et l'être sont des choses réciproques »{/teal}. Comme Plotin, il fait de l'unité la condition de l'être ({amber}« il n'est rien qui ne soit un »{/amber}) ; comme lui, il en conclut que les {yellow}agrégats{/yellow} (un tas, un troupeau) n'ont qu'une unité d'emprunt, et qu'il faut de vraies unités, les substances. Mais il garde la **réciprocité** de l'un et de l'être, qu'Aristote soutenait et que Plotin nie.

    **Kant : l'unité, catégorie de l'entendement.** Dans la *Critique de la raison pure* (Analytique transcendantale), l'{violet}unité{/violet} est la première des **catégories de la quantité** (unité, pluralité, totalité) : un concept pur que l'entendement applique à ce que donnent les sens. C'est, transposée, {red}la thèse de l'objection{/red} : l'unité vient de la pensée et non des choses. Mais Kant la renverse aussi : la catégorie est **a priori**, antérieure à toute expérience, comme le savoir « d'avance » de Plotin ; elle n'est pas tirée des choses, elle les rend pensables. {coral}Kant garde la préexistence de l'un à l'expérience, mais la loge dans le sujet, non dans l'intelligible.{/coral}

    **Frege : le nombre se dit d'un concept.** Dans *Les Fondements de l'arithmétique* (1884, § 46), {sky}Frege{/sky} soutient qu'{amber}un énoncé de nombre contient une assertion sur un concept{/amber}, non sur les choses : {yellow}devant les mêmes soldats, on dit avec une égale vérité « voici quatre compagnies » et « voici cinq cents hommes »{/yellow} selon le concept sous lequel on la compte. C'est l'objection du relatif sous une forme nouvelle : une chose n'est une ou multiple que sous un concept. Mais Frege ne fait pas pour autant du nombre {red}une affection de l'âme{/red} : le nombre est {green}objectif{/green}, sans être une propriété des choses.

    | Auteur | Où est l'unité ? | Ce qu'il partage avec Plotin |
    | Leibniz | dans les vraies substances | l'être suppose l'unité |
    | Kant | dans l'entendement, a priori | l'un précède l'expérience |
    | Frege | dans le concept sous lequel on compte | le nombre est objectif |

    ! Kant n'est pas {red}un stoïcien{/red} : la catégorie d'unité n'est pas une notion formée après les choses, mais {green}une condition a priori de leur pensée{/green}.
