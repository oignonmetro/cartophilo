- id: "t34c13-m1e"
  title: "Ce quelque chose est identique à l'être"
  notes: |-
    **Le savoir préalable a un contenu précis :** {coral}**si la raison discursive connaissait d'avance « ce quelque chose », c'est que ce quelque chose est identique à l'être**{/coral}**.** Elle ne peut pas savoir d'avance que tel arbre existe ; ce qu'elle sait d'avance, c'est ce que contient le simple fait de désigner une chose.

    **Pourquoi « ce quelque chose » ?** __Parce que désigner, c'est découper__ : {yellow}quand on montre un point du paysage en disant « ceci »{/yellow}, on délimite une chose, on la distingue du reste, on la pose {amber}comme un être, et comme un seul{/amber}. Le « quelque chose » (*ti*) est en outre une catégorie {sky}stoïcienne{/sky}, le genre suprême de leur ontologie : Plotin reprend le mot de l'adversaire pour montrer qu'il contient déjà l'un.

    **Pourquoi « identique à l'être » ?** Le savoir préalable {red}n'est pas un savoir sur les choses{/red}, c'est {green}le savoir de ce qu'est toute chose en tant qu'on peut la désigner{/green} : un être, et un être un. {coral}L'un est compris dans l'acte même de désigner.{/coral}

    **Pourquoi « cela signifierait » ?** Le conditionnel déplie ce qu'implique la phrase précédente. L'argument 2 établit **le fait** d'un savoir préalable ; cette phrase en donne **le mécanisme**. Or chaque Forme, chaque « ceci » intelligible, est une certaine unité : au chapitre 5 (36-38), Plotin parle {teal}« {/teal}non pas de {teal}cet Un dont nous disons bien sûr qu'il est “au-delà de l'être”{/teal}, mais bien de {teal}cet un qui est attribué à chacune des formes »{/teal} (*ho katègoreitai tôn eidôn hekastou*).

    ! Le savoir préalable ne porte pas sur {red}l'existence de telle chose{/red}, mais sur {green}ce que suppose toute désignation{/green} : un être un.
