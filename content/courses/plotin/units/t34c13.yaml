- id: "t34c13-m3d"
  title: "Une réalité sous-jacente"
  notes: |-
    **La thèse positive :** {coral}**le « ceci » « est une réalité sous-jacente »**{/coral}**.** Ce qu'il désigne n'est pas le mot, mais ce qui porte la chose.

    ? **Réalité sous-jacente** (*hupokeimenon*) : ce qui « gît sous » une chose et en porte les propriétés, le substrat ; la notion vient d'{sky}Aristote{/sky}.

    **Pourquoi « sous-jacente » ?** __Parce que le « ceci » vise ce qui demeure sous ce qu'on voit__, non une qualité de plus. Le [[traite12|traité 12]] dit de même de la matière : {teal}« {/teal}elle {teal}n'est pas un nom vide{/teal}, mais elle est {teal}quelque chose qui joue le rôle de substrat »{/teal} (II, 4, 12, 22-23 ; *ou kenon onoma, all'esti ti hupokeimenon*). Chez Plotin, {coral}refuser qu'un terme soit vide, c'est toujours lui assigner un support réel{/coral}, sa consistance, son *hupostasis*.

    **Pourquoi le** *Timée* **?** Le « ceci » renvoie très probablement au *Timée* (49d-50c), où Platon refuse le « ceci » aux choses sensibles : {teal}« {/teal}ces choses-là sont fuyantes et {teal}ne comportent pas les expressions ceci ou cela{/teal} ou cet être, ou toute autre formule qui les désignerait {teal}comme réalités permanentes »{/teal} (49e, traduction Rivaud). Le « ceci » désigne donc d'abord des **réalités stables** ; la référence est difficile, et le texte ne la rend pas explicite.

    **Pourquoi l'un est-il « propre » à tout ?** L'un est présent en tout, propre en ce sens à tout (intelligible, sensible, contenu de pensée), mais il est aussi partout : {amber}l'appropriation la plus intime est la perte du propre essentiel au profit de l'unité{/amber}.

    **Quel est l'enjeu ?** Le refus du {violet}nominalisme{/violet} : {red}ce n'est pas la pensée qui produit l'intelligible et les notions du discours{/red}, mais {green}l'être intelligible qui sert de support à la pensée{/green}.

    ? **Nominalisme** : la thèse selon laquelle les termes généraux ne sont que des noms, auxquels ne correspond aucune réalité hors de la pensée.

    ! « Réalité sous-jacente » ne désigne pas ici {red}la matière{/red} : c'est {green}ce qui porte la chose désignée, quelle qu'elle soit{/green}.
