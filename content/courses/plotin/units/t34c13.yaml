- id: t34c13-m3
  title: "Le « ceci » n'est pas un terme vide"
  notes: |-
    **Le « ceci » n'est pas un terme vide : il désigne au lieu de prononcer un nom, donc suppose une présence ; il est « une réalité sous-jacente ».** Le texte ne poursuit pas vers l'Un : il revient en arrière (« Et le “ceci” ») et répond à une objection formulée plus haut, d'où son allure elliptique.

    L'**objection** : quand la raison discursive dit « ceci » ou « un », peut-être ne produit-elle qu'un mot, ou n'éprouve-t-elle qu'une **affection** (*pathèma*) qui ne porterait sur aucun être, une impression à laquelle rien ne correspond. Le début du chapitre 13 y répondait déjà : « ce n'est pas une affection vide (*kenon pathèma*), ce n'est pas à propos de rien qu'elle dit “un” » (13, 8-9). La réponse protège rétroactivement l'argument 2a : si le « ceci » ne désignait rien, l'identité de ce quelque chose et de l'être ne prouverait rien.

    La réponse tient dans l'opposition entre **désigner** et **nommer**. Nommer, c'est appliquer un mot général (« cheval »), qu'on peut employer sans que rien ne lui corresponde (on parle de licornes). Désigner, c'est montrer : « ceci » ne fonctionne que si quelque chose est là. D'où « la manifestation d'une existence, une présence, une réalité ou une autre forme d'être » : il faut qu'il y ait quelque chose. Le « ceci » (*touto*) vient de la logique **stoïcienne** : la proposition « définie » a pour sujet un démonstratif (« Celui-ci marche »), qui fixe la référence par un geste de « monstration » (*deixis*) ; Plotin détourne cette analyse en faisant désigner au « ceci » une présence (*parousia*) intelligible.

    Cette **réalité sous-jacente** est l'*hupokeimenon*, ce qui gît sous les propriétés et les porte, notion qu'on retrouve chez Aristote. Le traité 12 (II, 4, 12, 22-23) dit de même de la matière qu'« elle n'est pas un nom vide, mais elle est quelque chose qui joue le rôle de substrat » : refuser qu'un terme soit vide, c'est lui assigner un support réel, sa consistance, son *hupostasis*. Le « ceci » renvoie aussi très probablement au *Timée* (49d-50c), où Platon refuse le « ceci » aux sensibles, trop fuyants, pour le réserver aux réalités permanentes.

    Le **nom propre**, comme « Socrate », renvoie directement à l'individu sans passer par une description ; le nom commun d'une chose serait son espèce, son nom propre la *mia idea*, l'idée unique qui, par son unicité, fait signe vers l'Un (voir aussi *Parménide*, 133d). L'expression (*idion onoma*), sans doute un écho de débats stoïciens, n'apparaît sans doute nulle part ailleurs chez Plotin.

    L'enjeu est le refus du **nominalisme** : ce n'est pas la pensée qui produit l'intelligible et les notions du discours, c'est l'être intelligible qui sert de support à la pensée.

    ! « C'est comme si » : la comparaison au nom propre est une image, non une thèse sur les noms propres.
