- id: "t34c13-m4"
  title: "Aux arguments qui ont fait intervenir le relatif"
  notes: |-
    **Le chapitre 14 s'ouvre sur une seconde objection :** {coral}**« aux arguments qui ont fait intervenir le relatif, il serait raisonnable de répondre »**{/coral}**.** Le chapitre 12 (24-32) les avait exposés ; le texte les suppose connus.

    ? **Relatif** (*pros ti*) : ce qui ne se dit d'une chose que par rapport à une autre, « plus grand que », « à droite de », « double de » ; les relatifs sont, dit {sky}Aristote{/sky}, {teal}« {/teal}les choses dont {teal}l'être se réduit à être dans une certaine relation avec quelque chose »{/teal} (*Catégories*, 7, 8a31-32). L'autre terme du rapport est le {violet}corrélat{/violet}.

    **Quels étaient ces arguments ?** Au chapitre 12, l'un était rangé avec {yellow}« à droite » et « en haut »{/yellow} : {red}quelle existence rattacher à « à droite », sinon le fait que quelqu'un est ici et un autre là ?{/red} De même, une chose serait une ou multiple {red}selon le rapport sous lequel on la considère{/red} : {yellow}vue de loin, une ville paraît une ; vue de près, elle n'est qu'un agrégat de maisons{/yellow} ; {yellow}les mêmes dix soldats sont dix quand on compte les hommes, un quand on compte les pelotons{/yellow}. L'unité ne serait alors {red}rien dans la chose{/red}. Cette thèse représente {coral}l'effort extrême pour vider l'un et le nombre de toute réalité{/coral}.

    **Pourquoi « il serait raisonnable de répondre » ?** La réponse est **modalisée** : le conditionnel et « raisonnable » marquent une {amber}prudence{/amber}. Plotin ne dit pas que l'un n'est relatif en aucun sens, seulement qu'il n'est pas de ces relatifs qui se perdent sans que la chose soit affectée. Les relatifs sont étudiés en détail dans le [[traite42|traité 42]] (VI, 1), chapitres 6 à 9.

    ! L'objection ne dit pas que l'un {red}n'existe pas{/red} : elle dit qu'{red}il n'est qu'un rapport{/red}, ce qui revient, pour Plotin, à le vider de réalité.
