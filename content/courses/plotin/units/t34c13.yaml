- id: t34c13-m5
  title: "Accident dans le sensible, par soi dans ce qui vient en premier"
  notes: |-
    **L'un, tantôt présent, tantôt absent dans le même sujet, est parmi les êtres ; il est accident dans les choses inférieures et par soi dans ce qui vient en premier, « lorsqu'il est un, puis être ».**

    | Extrait | Arguments | Ce qu'il fait |
    | 1 | 8 | conclure de la masse divisée que l'un est parmi les êtres |
    | 2 | 8a, 8b | fixer son double statut, et préciser le second |

    Le dernier moment s'appuie sur le deuxième pour revenir au premier : la distinction de l'accident et du par soi reprend, en termes aristotéliciens, la **participation** posée par l'analogie initiale. Le texte se referme sur son ouverture : l'unité est dans les corps comme ce qu'ils ont, dans l'intelligible comme ce qu'il est.

    ! Ce dernier moment ne progresse pas vers le principe : il assigne à l'unité des corps son rang, réelle mais reçue.

    === 1 Argument 8 : l'un est parmi les êtres

    **La question rhétorique tire la conséquence de la masse divisée : ce qui, dans le même sujet, tantôt est présent, tantôt s'en va, doit être rangé parmi les êtres, « où qu'il se trouve ».** Son ressort est une prémisse implicite : ce qui n'est rien ne peut ni arriver ni disparaître. Si un mur blanc devient bleu, ce qui a changé (la couleur) est quelque chose ; si une masse perd son unité, ce qu'elle perd est quelque chose.

    ! « Parmi les êtres » : l'un est ici placé dans l'être, alors que le deuxième moment le disait « avant l'être ».

    === 2 Arguments 8a et 8b : accident dans le sensible, par soi dans ce qui vient en premier

    **L'un est accident dans les choses inférieures et existe en soi dans les intelligibles.** La distinction, posée plus qu'elle n'est démontrée, vient d'**Aristote** : une propriété est **par soi** quand elle appartient à une chose en vertu de ce qu'est cette chose, **accidentelle** quand elle lui appartient sans en découler. « Accident » s'entend ici comme **attribut** au sens large, et ne veut pas dire hasard (la *Métaphysique*, Δ, 30, distingue des degrés de contingence) : tout vêtement a nécessairement une couleur, mais aucune couleur ne découle de ce qu'est un vêtement. De même, tout corps a nécessairement une certaine unité, mais aucun n'est un par lui-même : son unité lui vient de l'extérieur (pour un vivant, de l'âme) ; ce n'est pas l'unité en soi, seulement l'unité **prédiquée**, associée à du multiple corruptible. Dans l'intelligible, l'unité appartient à la chose par ce qu'elle est : une Forme, comme la justice, ne peut pas être coupée en deux justices.

    **Argument 8b.** La seconde branche est précisée par l'ordre établi en 5a : dans « ce qui vient en premier », l'unité précède l'être, cette réalité est un avant d'être, et tient donc son unité d'elle-même. Après « ce qui vient en premier », les manuscrits portent « dans les intelligibles » (*tois noètois*), que L. Brisson, à la suite de Henry et Schwyzer, tient pour une **glose** interpolée et ne traduit pas ; on se trouve alors au niveau de l'« un qui est » (*hen on*).

    Une **tension** demeure : l'un est placé « parmi les êtres », et il est par soi dans ce qui vient en premier « lorsqu'il est un, puis être », donc être aussi, alors que le deuxième moment disait l'un « avant l'être ». L'un de cette fin semble être l'unité du premier être, l'« un qui est », plutôt que l'Un au-delà de l'être : c'est l'un « attribué à chacune des formes » du chapitre 5, auquel participe toute unité sensible, comme nos dizaines participent à la décade en soi.

    ! « Par accident » ne veut pas dire « par hasard » : il est nécessaire qu'un corps ait une certaine unité, mais elle ne lui vient pas de ce qu'il est.
