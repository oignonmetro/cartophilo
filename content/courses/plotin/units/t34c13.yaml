# Unité de texte (voir content/textes.md) : Plotin, traité 34 (VI, 6), Sur
# les nombres, chapitres 13-14, d'après la synthèse de l'argumentation fournie
# par l'utilisateur, du rapport du jury de l'agrégation 2012 (sans le nommer
# dans les cartes) et des notes de L. Brisson. Texte et citations de Plotin :
# la GF (traduction L. Brisson, comme t10c1), et non la traduction du sujet
# de 2012 que suivent la synthèse et le rapport. Le texte grec n'est pas
# découpé en paragraphes : cinq mouvements repérés par leurs lignes (13, 36 -
# 14, 13), arguments 1 à 8 de la synthèse en sections `=== k`. L'analyse de
# la structure va en introduction, le bilan et la conclusion en prolongement.
# Toutes les explications, digressions comprises, font cartes.

id: t34c13
title: "L'un est une réalité (34 [VI, 6], 13-14)"
subtitle: "Traité 34, Sur les nombres, chapitres 13-14"
icon: page
color: coral
intro: |-
  Un passage du traité 34 (VI, 6), *Sur les nombres* : quand on dit « un » d'une chose, lui attribue-t-on quelque chose de réel ? Plotin montre que la pensée et le discours présupposent l'un, que l'un précède l'être, puis, en répondant à deux objections, que l'unité est dans les corps par accident et dans l'intelligible par soi.
lessons:
- id: t34c13-i1
  title: "La question, la thèse, la difficulté"
  notes: |-
    **Quand on dit « un » d'une chose, lui attribue-t-on quelque chose de réel, ou l'unité n'est-elle qu'une manière de parler, un point de vue que la pensée prend sur les choses, comme un relatif qui varie avec la comparaison ?**

    Le texte entre dans le débat sur le **statut ontologique de l'unité et du nombre**, que Plotin mène **en platonicien** (participation du sensible à l'intelligible, priorité de l'intelligible sur la pensée) **avec des outils aristotéliciens** (relatif, substrat, accident).

    Sa thèse : **l'unité est une réalité**. La pensée et le discours la présupposent, de sorte qu'elle doit leur préexister ; elle précède même l'être, qu'elle engendre ; elle n'est présente dans les corps que **par accident**, comme ce qu'une division peut leur retirer, alors qu'elle existe **par soi** dans l'intelligible, où il est par soi dans « ce qui vient en premier, lorsqu'il est un, puis être ».

    La difficulté naît de deux affirmations. Pour établir que l'unité est réelle, Plotin la range parmi les **intelligibles**, connue par la raison discursive « sur le mode de l'intelligible » ; pour établir qu'elle précède l'être, il affirme que « dans l'un il n'y a pas l'être », ce qui est la doctrine de l'**Un au-delà de l'essence**, que d'autres traités disent hors de toute saisie intellectuelle. Or si l'un est un intelligible, il relève de l'être et de la pensée et ne peut les précéder ; s'il les précède, il ne peut être un intelligible parmi d'autres.

    D'où la question directrice : le texte ne fait-il pas jouer **deux unités**, l'**un-nombre**, présent dans l'Intellect, et l'**Un-principe**, qui l'engendre ? Il aggrave lui-même la tension : l'un, dit « avant l'être » au deuxième moment (13, 50-54), est placé à la fin « parmi les êtres », et il y est par soi dans ce qui vient en premier « lorsqu'il est un, puis être », donc être aussi.

    Le passage porte sur la question centrale et classique du rapport de l'être et de l'un : une doctrine décisive de Plotin, le rôle fondateur de l'unité, mais sans que la doctrine « orthodoxe » y soit exactement respectée. Il faut donc rendre compte de son argumentation précise, plutôt que d'en faire le prétexte d'une dissertation générale sur l'Un ou sur le sensible et l'intelligible, et en souligner les difficultés, voire les énigmes : les meilleurs commentaires montrent l'originalité d'un passage par nature singulier.

    ! Ne pas confondre partout l'un du texte avec l'Un, premier principe : c'est précisément la confusion que la problématique demande d'éviter.
