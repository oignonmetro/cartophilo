- id: "t34c13-m3"
  title: "Le « ceci » n'est pas un terme vide"
  notes: |-
    **Le texte revient en arrière :** {coral}**« le “ceci” n'est pas un terme vide »**{/coral}**.** Il ne poursuit pas vers l'Un ; il répond à une objection formulée plus haut, d'où son allure elliptique : il faut la reconstituer à partir de la réponse.

    **Quelle est l'objection ?** Quand la raison discursive dit « ceci » ou « un », peut-être {red}ne produit-elle qu'un mot{/red}, un son sans objet. Le chapitre 12 range précisément le « ceci » et le « quelque chose » parmi les {red}notions nées en nous après les choses{/red}, comme une foule ou une armée, qui ne sont rien en dehors de ceux qui la composent. Les notes de Brisson y voient la théorie {sky}stoïcienne{/sky} de la proposition.

    **Pourquoi y répondre ici ?** __Parce que tout le premier moment en dépend.__ Le savoir préalable tenait à l'identité de « ce quelque chose » et de l'être ; {coral}si le « ceci » ne désignait rien, cette identité ne prouverait rien{/coral}. La réponse protège donc rétroactivement l'argument 2.

    **Pourquoi « Et » ?** Le connecteur est le premier des trois qui signalent le retour aux objections (« Et le “ceci” », « Aux arguments qui ont fait intervenir le relatif », « Cela donc ») : {amber}le troisième moment consolide plus qu'il ne progresse{/amber}. C'est aussi l'une des trois difficultés du passage : le « ceci » renvoie très certainement au *Timée*, qu'on ne peut pas attendre d'un lecteur qu'il connaisse.

    ! « Terme vide » ne vise pas {red}un mot sans définition{/red}, mais {green}un mot qui ne désignerait aucune réalité{/green}.
