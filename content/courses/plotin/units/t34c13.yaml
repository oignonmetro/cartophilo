- id: "t34c13-i2"
  title: "La question, la thèse, la problématique"
  notes: |-
    **Quand on dit** {violet}**« un »**{/violet} **d'une chose, lui attribue-t-on** {green}**quelque chose de réel**{/green}**, ou l'unité n'est-elle** {red}**qu'une manière de parler**{/red}**, un point de vue que la pensée prend sur les choses, comme un relatif qui varie avec la comparaison ?** Le texte entre dans le débat sur le {amber}statut ontologique de l'unité et du nombre{/amber}, que Plotin mène {sky}en platonicien{/sky} (participation du sensible à l'intelligible, priorité de l'intelligible sur la pensée) avec des {sky}outils aristotéliciens{/sky} (relatif, substrat, accident). Il porte sur la question centrale et classique du {amber}rapport de l'être et de l'un{/amber} : une doctrine décisive de Plotin, le rôle fondateur de l'unité, mais sans que la doctrine « orthodoxe » y soit exactement respectée.

    **Sa thèse : l'unité est une réalité.** La pensée et le discours la présupposent, de sorte qu'{coral}elle doit leur préexister{/coral} ; elle précède même l'être, {coral}qu'elle engendre{/coral} ; elle n'est présente dans les corps que {pink}par accident{/pink}, comme ce qu'une division peut leur retirer, alors qu'elle existe {green}par soi{/green} dans ce qui vient en premier, « lorsqu'il est un, puis être ».

    **La difficulté naît de deux affirmations.** Pour établir que l'unité est réelle, Plotin la range parmi les {violet}intelligibles{/violet}, connue par la raison discursive « sur le mode de l'intelligible » ; pour établir qu'elle précède l'être, il affirme que {teal}« {/teal}dans l'un {teal}il n'y a pas l'être »{/teal}, ce qui est la doctrine de l'{violet}Un au-delà de l'essence{/violet}, que d'autres traités disent hors de toute saisie intellectuelle. Or __si l'un est un intelligible, il relève de l'être et de la pensée et ne peut les précéder__ ; __s'il les précède, il ne peut être un intelligible parmi d'autres__. D'où la question directrice : le texte ne fait-il pas jouer **deux unités**, l'{amber}un-nombre{/amber}, présent dans l'Intellect, et l'{amber}Un-principe{/amber}, qui l'engendre ? Il aggrave lui-même la tension : l'un, dit « avant l'être » au deuxième moment, est placé à la fin « parmi les êtres », et il est par soi dans ce qui vient en premier « lorsqu'il est un, puis être », donc être aussi.

    | Difficulté | Où elle se trouve | Réponse du texte |
    | l'un est dit connu « sur le mode de l'intelligible » | 13, 39-40 | c'est l'un présent dans l'Intellect, que l'âme possède d'avance |
    | l'un est dit « avant l'être » et sans être | 13, 51-54 | l'Un-principe, atteint par l'asymétrie de l'un et de l'être, dit par image |
    | le « ceci » renvoie au Timée | 13, 54-60 | il désigne une présence, une réalité sous-jacente |
    | l'objection du relatif reste hors de l'extrait | 14, 1-8 | l'un se perd par division, non par la variation d'un corrélat |

    Rendre compte du passage, c'est suivre son **argumentation précise**, et non {red}en faire le prétexte d'une dissertation générale{/red} sur l'Un ou sur le sensible et l'intelligible : il faut en {green}souligner les difficultés, voire les énigmes{/green}, et montrer l'originalité d'un passage par nature singulier.

    ! Ne pas confondre partout l'un du texte avec l'Un, premier principe : c'est précisément la confusion que la problématique demande d'éviter.
