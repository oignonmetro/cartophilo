- id: "t34c13-m2b"
  title: "Avant l'être, et l'engendrant"
  notes: |-
    **D'où la conclusion :** {coral}**l'un « doit se trouver avant l'être et engendrer l'être »**{/coral}**.** La phrase enchaîne en réalité trois affirmations, de force croissante.

    | Affirmation | Ce qu'elle dit | Ce qui l'établit |
    | condition | l'être ne va pas sans l'un | « il n'est rien qui ne soit un » |
    | antériorité | l'un est « avant » l'être | l'asymétrie de la phrase suivante |
    | génération | l'un « engendre » l'être | la doctrine de la procession, non argumentée ici |

    **Pourquoi « avant » demande-t-il plus que la condition ?** Selon le critère qu'{sky}Aristote{/sky} attribue à {sky}Platon{/sky} (*Métaphysique* Δ, 11), {amber}A est antérieur à B lorsque B ne peut être sans A, alors que A peut être sans B{/amber}. Il faut donc encore montrer que l'un se passe de l'être, alors que l'être ne se passe pas de l'un : ce sera l'asymétrie de la ligne 53. Mais la formule {pink}« l'un peut être sans l'être »{/pink} attribue l'être à ce dont elle veut dire qu'il s'en passe : c'est toute la difficulté de parler de ce qui précède l'être.

    **Pourquoi « engendrer » est-il plus fort encore ?** __Parce qu'une condition n'est pas une cause.__ Ce dernier pas n'est pas argumenté : il repose sur la doctrine plotinienne de la **procession**, que Plotin expose ailleurs ({teal}l'Un est antérieur à l'Être{/teal}, [[traite9|traité 9]], 2, 29-30 ; {teal}il l'engendre{/teal}, [[traite32|traité 32]], 5, 5-7). Au [[traite9|traité 9]], chapitre 2, Plotin conclut de même que {teal}« {/teal}l'unité est {teal}ce qui est premier, tandis que l'Intellect, les formes et ce qui est ne sont pas premiers »{/teal}.

    ? **Procession** : la manière dont chaque principe produit ce qui vient après lui sans rien perdre ni changer, {yellow}comme le soleil éclaire sans s'appauvrir{/yellow} : de l'Un vient l'Intellect, de l'Intellect l'Âme.

    **Que reprend « avant l'être » ?** Le *pro ousias* reprend l'{violet}au-delà de l'essence{/violet} (*epekeina tès ousias*) de l'Idée du Bien dans {sky}*La République*{/sky} (VI, 509b). C'est le seul passage de l'extrait qui renvoie explicitement au premier principe tel que le présentent les traités [[traite9|9]], [[traite10|10]], [[traite32|32]], [[traite38|38]], [[traite39|39]] et [[traite49|49]]. Le texte ne nomme jamais le Bien, mais envisage {coral}la puissance de diffusion de l'un{/coral}. L'engendrement de l'être (*gennôn tèn ousian*) est un point délicat : il suppose une {amber}« constitution » du monde intelligible en tension par rapport au premier principe{/amber}, cette « généalogie » de l'être intelligible que {sky}Pierre Hadot{/sky} a mise en lumière dans son commentaire du traité 38 (1988). L'un qui engendre est principe et fondement : il a donc {amber}un certain mode d'être avant même l'être qu'il produit{/amber}. **Être « avant l'être » est tout le mystère de la nature ineffable de l'Un.**

    ! « Avant l'être » n'est pas {red}une antériorité dans le temps{/red} : c'est {green}une antériorité de principe{/green}.
