- id: t34c13-p3
  title: "Le « ceci » n'est pas un terme vide"
  notes: |-
    **Le « ceci » n'est pas un terme vide : il désigne au lieu de nommer, donc suppose une présence, une « réalité sous-jacente ».** Le texte ne poursuit pas vers l'Un : il revient en arrière (« Et le “ceci” ») et répond à une objection formulée plus haut, d'où son allure elliptique.

    L'**objection** : quand la pensée dit « ceci » ou « un », peut-être ne produit-elle qu'un mot, ou n'éprouve-t-elle qu'une **affection** (*pathèma*) sans objet, une impression à laquelle rien ne correspond. Le début du chapitre 13 y répondait déjà : ce n'est pas une « affection vide » (*kenon pathèma*), ce n'est pas à propos de rien que la pensée dit « un ». La réponse protège rétroactivement l'argument 2a : si « ceci » ne désignait rien, l'identité de « ceci » et d'« un être » ne prouverait rien.

    La réponse tient dans l'opposition entre **désigner** et **nommer**. Nommer, c'est appliquer un mot général (« cheval »), qu'on peut employer sans que rien ne lui corresponde (on parle de licornes). Désigner, c'est montrer : « ceci » ne fonctionne que si quelque chose est là. D'où « une présence, une substance ou une autre forme d'être » : il faut qu'il y ait quelque chose. Cette **réalité sous-jacente** est l'*hupokeimenon*, ce qui gît sous les propriétés et les porte, notion qu'on retrouve chez Aristote. Le traité 12 (II, 4, 12) dit de même de la matière qu'elle n'est « pas un mot vide, mais bien un certain substrat » (*ou kenon onoma, all'esti ti hupokeimenon*) : refuser qu'un terme soit vide, c'est lui assigner un support réel, sa consistance, son *hupostasis*.

    Le « ceci » renvoie très probablement au *Timée* (49d-50c), où Platon refuse le « ceci » aux sensibles, trop fuyants, pour le réserver aux réalités permanentes. Le **nom propre**, comme « Socrate », renvoie directement à l'individu sans passer par une description ; son nom commun serait l'espèce, son nom propre la *mia idea*, l'idée unique qui, par son unicité, fait signe vers l'Un. L'expression (*idion onoma*), sans doute un écho de débats stoïciens, n'apparaît sans doute nulle part ailleurs chez Plotin.

    L'enjeu est le refus du **nominalisme** : ce n'est pas la pensée qui produit l'intelligible et les notions du discours, c'est l'être intelligible qui sert de support à la pensée.

    ! « Tout à fait comme si » : la comparaison au nom propre est une image, non une thèse sur les noms propres.
