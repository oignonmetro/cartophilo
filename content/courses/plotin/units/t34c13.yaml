- id: "t34c13-m1d"
  title: "« Elle la connaissait donc d'avance »"
  notes: |-
    **De là une conséquence :** {coral}**« elle la connaissait donc d'avance »**{/coral}**.** Puisque, à partir d'une chose qu'elle voit, la raison discursive en pense une autre qu'elle ne voit pas, la vision ne lui a pas donné ce qu'elle pense : {coral}elle donne l'occasion de penser l'un, elle n'en est pas la source{/coral}.

    **Quelle est la chose vue, et quelle est l'autre ?** La chose vue est {yellow}l'arbre{/yellow} ; celle qu'elle ne voit pas est {violet}l'un{/violet}. En voyant l'arbre, la pensée pense « un », alors que l'un n'est visible nulle part. {yellow}On ne reconnaît un visage dans la foule que si on l'a déjà vu{/yellow}.

    **Pourquoi « donc » ?** Le « donc » n'est valide qu'à une condition que le texte ne formule pas : {amber}__la chose vue ne contient pas ce qu'on pense à son occasion__{/amber}. Pourquoi l'admettre ? __Parce que les choses sensibles ne sont jamais parfaitement unes__ : {yellow}l'arbre a des branches, des feuilles, des racines{/yellow}, il est à la fois un et multiple, et il le reste tant qu'on le regarde. Si l'idée d'unité venait de lui, elle serait aussi mêlée que lui ; or {coral}ce qu'on pense sous le mot « un », c'est une unité sans parties et sans mélange{/coral}, qu'aucune chose vue ne présente telle quelle. C'est le raisonnement du {sky}*Phédon*{/sky} sur l'égalité (74e, dont la phrase est peut-être un souvenir) : {yellow}des bouts de bois ne sont jamais parfaitement égaux, et pourtant on les juge « presque égaux »{/yellow}, ce qui suppose qu'on connaisse déjà l'égal lui-même pour mesurer l'écart.

    ? **Réminiscence** : la doctrine platonicienne selon laquelle {teal}« penser, c'est se souvenir »{/teal} (*Phédon*) : l'âme reconnaît dans les choses ce qu'elle a connu avant d'être dans un corps.

    **Pourquoi « d'avance » ?** Le savoir préalable (*proèdei*) suppose la {violet}réminiscence{/violet} : {coral}la pensée humaine ne s'explique pas par une genèse empirique{/coral}, mais par une connaissance antérieure des Formes. Mais sous sa forme plotinienne : {teal}« {/teal}notre âme {teal}n'a pas plongé tout entière ici-bas{/teal}, mais {teal}quelque chose d'elle reste toujours dans l'intelligible »{/teal} ([[traite6|traité 6]], IV, 8, 8, 1-3), doctrine originale que {sky}Proclus{/sky} refusera. L'antériorité n'est donc pas seulement {pink}chronologique{/pink} (Plotin reprend la métempsycose), mais {green}ontologique{/green} : il y a une partie de notre âme qui « n'est pas descendue », toujours dans le monde intelligible, {amber}intelligence pure immanente à l'être lui-même{/amber}. Sur cette importance de la réminiscence chez Plotin, {sky}Jean-Louis Chrétien{/sky}, *L'Inoubliable et l'inespéré* (1991).

    ! « D'avance » ne désigne pas d'abord {red}un savoir acquis plus tôt{/red}, mais {green}ce qui rend possible la pensée de chaque chose vue{/green}.
