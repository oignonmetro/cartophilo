- id: "t34c13-o2"
  title: "Aristote et les stoïciens : l'un, l'être et la notion"
  notes: |-
    **Le passage prend position dans un débat antique : l'un est-il** {green}**une réalité**{/green}**, ou** {red}**une manière de parler des choses**{/red} **?** Deux adversaires y sont présents sans être nommés, {sky}Aristote{/sky} et les {sky}stoïciens{/sky}, et Plotin répond à chacun avec ses propres outils. C'est la portée **métaphysique** du texte : il fonde une **hénologie**, une pensée de l'un, là où Aristote faisait de l'un l'autre nom de l'être.

    **Aristote : l'un et l'être se convertissent.** Pour lui, {teal}« {/teal}ce qui est et l'un, {teal}c'est la même chose »{/teal}, une seule nature (*Métaphysique*, Γ, 2, 1003b22-24 ; I, 2) : {yellow}« homme » et « un homme », c'est la même chose{/yellow}. Plotin discute cette thèse au [[traite9|traité 9]], 2, qui en fait une doctrine venue d'Aristote, et la retourne : si l'être de chaque chose est multiple ({yellow}l'homme est animal et raisonnable{/yellow}), et que l'unité ne peut être une multiplicité, {coral}l'unité et l'être sont différents{/coral}, et l'unité est {amber}« ce qui est premier »{/amber}. C'est l'asymétrie de 13, 52-53 : Plotin emprunte à Aristote son critère d'antériorité (*Métaphysique* Δ, 11) pour nier la conversion qu'Aristote soutenait.

    **Les stoïciens : l'un n'est qu'une notion.** Pour l'adversaire des chapitres 12-13, l'un est une **affection de l'âme**, une **notion** (*ennoèma*) formée après les choses, comme le « quelque chose » (*ti*), genre suprême de leur ontologie. Les stoïciens distinguent en outre trois degrés d'unité dans les corps :

    | Degré d'unité | Ce qui tient les parties | Exemple |
    | unifié | une seule et même disposition | les êtres vivants |
    | joint | des parties regroupées en un tout | les pierres d'une maison, les planches d'un navire |
    | séparé | des parties non jointes qui forment pourtant une unité | un chœur, une armée |

    Plotin reprend ces exemples (la maison, l'armée) pour montrer que {coral}l'unité a des degrés, donc qu'elle est une réalité{/coral}, puisqu'{amber}il n'y a pas de plus ou de moins dans ce qui n'est pas{/amber}. Contre la notion formée après coup, il oppose la **genèse** de la pensée ; contre le démonstratif stoïcien, une **présence intelligible**. C'est la portée **épistémologique** du texte : un **réalisme** de l'intelligible contre ce qu'on appellerait un conceptualisme.

    ! Plotin n'est pas {red}aristotélicien{/red} parce qu'il parle de substrat, d'accident et de relatif : {green}il retourne contre Aristote et les stoïciens leurs propres outils{/green}.
