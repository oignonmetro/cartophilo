- id: t34c13-p1
  title: "De la pensée à l'un : l'un préexiste à la pensée et au discours"
  notes: |-
    **Le premier moment range l'un parmi les intelligibles, puis montre que la pensée et le discours le présupposent et ne peuvent pas l'avoir produit : l'un leur préexiste.**

    | Extrait | Arguments | Ce qu'il fait |
    | 1 | 1 | ranger l'un parmi les intelligibles, par analogie avec la substance et l'être |
    | 2 | 2, 2a, 3 | la pensée « savait d'avance » ; « ceci » est « un être » ; un, deux, plusieurs |
    | 3 | 3, 4a | on ne pense rien sans un nombre ; on ne peut pas dire que l'un n'est pas |
    | 4 | 4b | ce que requiert la genèse de toute notion préexiste à la pensée |

    Ce moment ne prouve pas que l'un est intelligible : il le suppose. Ce qu'il prouve, c'est que la pensée et le discours ne peuvent se passer de l'un ni l'avoir produit. L'un cesse d'apparaître comme un **résultat** (ce que la pensée trouverait en comptant les choses) pour apparaître comme une **condition** (ce sans quoi elle ne pourrait même pas commencer à compter).

    ! Les arguments 2 à 4 ne démontrent pas l'intelligibilité de l'un, mais qu'il n'est pas tiré des choses par la pensée.

    === 1 Argument 1 : l'un rangé parmi les intelligibles, par analogie

    **Par analogie avec la substance et l'être, qui sont de l'intelligible bien que le sensible y participe, Plotin pose que l'un aussi est de l'intelligible, bien qu'on le perçoive dans les corps.**

    Est **intelligible** ce que seule la pensée saisit (ce que tous les chevaux ont en commun, la Forme du cheval), par opposition au sensible, que les sens perçoivent. La **participation** (*methexis*) est la relation par laquelle une chose sensible tient ce qu'elle est d'une Forme ; elle va toujours du sensible vers l'intelligible, jamais l'inverse. Ce n'est pas une identité mais une **imitation** : l'homme sensible n'est pas l'homme en soi, il lui ressemble. C'est la doctrine du *Phédon* et de *La République*, que Plotin reprend en rejetant les objections d'Aristote au début de la *Métaphysique* ; sans cet ancrage dans les Formes, le sensible sombrerait dans le flux héraclitéen.

    « La substance et l'être » (*hè ousia kai to einai*, « la réalité » dans les traductions de la GF) appellent la doctrine de l'**homonymie de l'être** : l'être au sens strict, la substance, n'existe que dans l'intelligible, la « plaine de la vérité » du *Phèdre* (248b), où *ta onta*, *hai ousiai*, *ta eidè* (les étants, les substances, les Formes) sont synonymes ; le sensible est être au sens dérivé. Cette homonymie est l'autre nom de la participation (on ne parlera pas d'une « duplicité de l'être ») ; elle fonde la beauté du monde sensible, que Plotin défend contre les Gnostiques dans le traité 33, qui précède *Sur les nombres*. L'un connaît une homonymie comparable : non pas accidentelle, mais de participation ; ce qu'ont en commun toutes les formes d'unité est la **trace du premier principe** dans la procession.

    On perçoit bien de l'unité dans les corps : Aristote range le nombre parmi les **sensibles communs** (*De l'âme*, III, 1, 425a16), et il est inutile de compter pour voir qu'il y a deux tours à Notre-Dame. Mais la pensée saisit l'un « comme un intelligible et sur le mode de l'intelligible » (*noèton kai noètôs*) : la première expression dit ce qu'est l'objet, la seconde comment il est saisi. Cette pensée est la *dianoia*, la pensée discursive de l'âme, qui va d'une chose vue à une autre qu'elle ne voit pas. L'approche de l'un n'est pas une expérience mystique, c'est une remontée de l'ici vers le là-bas.

    L'analogie ne prouve pas que l'un est intelligible : elle le range dans une classe que le lecteur platonicien admet déjà. Et elle fait difficulté, rapprochée de la transcendance de l'Un : « ce qui dépasse la pensée est plus vénérable que la pensée » (traité 38, chapitre 39) ; on ne le comprend « ni par la science, ni par une intuition intellectuelle », mais par une présence supérieure à la science (traité 9, chapitre 4) ; « il n'a pas de forme, même intelligible » (traité 39, chapitre 11).

    ! Écrire que « les Formes participent au sensible » renverse la participation : c'est une erreur grave.

    === 2 Arguments 2 et 3 : la pensée « savait d'avance »

    **Puisque, à partir d'une chose qu'elle voit, la pensée en pense une autre qu'elle ne voit pas (l'un), elle « savait donc d'avance » : la vision donne l'occasion de penser l'un, elle n'en est pas la source.**

    Le « donc » suppose une prémisse implicite : la chose vue ne contient pas ce qu'on pense à son occasion. Les choses sensibles ne sont jamais parfaitement unes (l'arbre est un et multiple), alors que l'un pensé est sans parties : c'est le raisonnement du *Phédon* sur les bouts de bois « presque égaux », qui supposent qu'on connaisse déjà l'égal lui-même.

    Le « savoir d'avance » (*proèdei*) suppose la **réminiscence** : « penser, c'est se souvenir ». Mais sous sa forme plotinienne : une partie de l'âme ne descend jamais dans le corps, « il y a toujours quelque chose d'elle dans l'intelligible » (traité 6, IV, 8, 8, 3), doctrine que Proclus refusera. L'antériorité n'est donc pas seulement chronologique (Plotin reprend la métempsycose) mais **ontologique**, une antériorité de principe.

    **Argument 2a.** Ce savoir préalable tient à ce que « ceci » est identique à « un être » : désigner une chose, c'est la découper, la délimiter, la poser comme un être, et comme un seul. L'argument 2 établit le fait du savoir préalable ; 2a en donne le **mécanisme** : l'un est compris dans l'acte même de désigner.

    **Argument 3.** Ce qui valait pour « ceci » vaut pour toute manière de parler des choses : quand on dit *ti* (quelque chose), on dit *hen* (un) ; « un couple de choses », deux ; « des choses », plusieurs. C'est la distinction grecque du **singulier**, du **duel** et du **pluriel**. Plotin passe sans transition de la parole à la pensée, parce que le discours exprime la pensée et en a la même structure. Le « deux » n'est pas ici la **Dyade** de l'enseignement oral de Platon, seulement un attribut contenu dans certaines notions. Les couples de genres du *Sophiste* (le Même et l'Autre, le Mouvement et le Repos) supposent de même l'unité de chaque contenu de pensée et la dualité de chaque couple.

    ! « D'avance » ne désigne pas d'abord un savoir acquis plus tôt, mais ce qui rend possible la pensée de chaque chose vue.

    === 3 Argument 4a : on ne peut pas dire que l'un n'est pas

    **La généralisation de l'argument 3 (on ne peut penser quelque chose sans un nombre) a une conséquence sur le dire : ce dont la non-existence rendrait impossible toute parole, on ne peut pas dire que cela n'est pas.**

    La force de l'induction tient à ce que les trois cas **épuisent** les manières de parler des choses, ce que le texte suppose sans le dire. Dans un traité *Sur les nombres*, elle fait passer de l'un au **nombre** en général et prépare la thèse que les nombres sont des réalités.

    L'argument 4a se décompose : supposer que l'un n'existe pas ; alors il n'y aurait plus rien à penser ni à dire, pas même « l'un n'existe pas », qui est une phrase, et une seule ; celui qui l'affirme ne pourrait donc pas le dire si c'était vrai. Comme celui qui dit à voix haute « je ne peux pas parler », il réfute ce qu'il dit en le disant : la négation se **défait** elle-même.

    Mais ne pas pouvoir nier n'est pas encore affirmer : la conclusion porte sur ce qu'on peut dire, non sur ce qui existe. Reste une objection : la pensée aurait besoin de la **notion** d'un, qu'elle formerait elle-même, sans qu'existe hors d'elle aucune unité réelle. C'est elle que le « mais » suivant écarte.

    ! L'argument 4a ne prouve pas que l'un existe : il prouve seulement qu'on ne peut pas dire qu'il n'existe pas.

    === 4 Argument 4b : l'un préexiste à la pensée et au discours

    **Ce dont toute notion et tout discours ont besoin pour naître doit préexister à la pensée et au discours : leur genèse « oblige à admettre l'un ».**

    Le mot décisif est **« genèse »** : il ne s'agit plus de ce qu'utilise une pensée déjà formée, mais de ce qu'il faut pour qu'une notion se forme. Si l'un n'était qu'une notion produite, la pensée devrait, pour la produire, penser déjà quelque chose, donc déjà de l'un : l'un serait requis pour sa propre production, ce qui est **circulaire**. On n'apprend pas à compter sans savoir distinguer une chose d'une autre : l'unité n'est pas le résultat du comptage, puisque le comptage la suppose.

    La prémisse implicite (ce qui est requis pour qu'une notion naisse ne peut pas être une notion produite) rend l'argument valide. La gradation va de l'impossibilité de nier (4a) à la nécessité d'admettre une préexistence (4b), et la conclusion reste mesurée : la genèse « oblige à admettre » l'un. Ce dont il est besoin pour la genèse de toute notion (*noèma*) et de tout discours (*logos*) doit préexister : l'être des nombres précède notre pensée des nombres. C'est le cœur du **réalisme platonicien** : l'intelligible préexiste à l'intelligence, l'être à la pensée.

    ! Le texte ne dit ici que ce que requiert la naissance de nos pensées : la préexistence de l'un, non encore son rapport à l'être.
  passage:
    label: "13, 36-50"
    text: "De même que la substance et l'être, bien que le sensible en participe, sont de l'intelligible et non du sensible, de même aussi l'un : bien qu'on le perçoive dans le sensible en raison de la participation, la pensée pourtant le saisit comme un intelligible et sur le mode de l'intelligible, en sorte qu'à partir d'une chose qu'elle voit elle en pense une autre qu'elle ne voit pas. Elle savait donc d'avance ; et si elle savait d'avance que ceci est un être, c'est que « ceci » est identique à « un être ». Et quand elle dit « quelque chose », elle dit aussi « un » ; de même quand elle dit « un couple de choses », elle dit aussi « deux », et quand elle dit « des choses », elle dit « plusieurs ». Si donc il n'est pas même possible de penser quelque chose sans le « un » ou le « deux » ou un nombre quelconque, comment se pourrait-il que ce sans quoi il n'est pas possible de penser ou de dire quelque chose ne soit pas ? Car ce dont la non-existence rend impossible de penser ou de dire quoi que ce soit, il est impossible de dire que cela n'est pas ; mais ce dont il est besoin dans tous les cas pour la genèse de toute notion ou de tout discours doit préexister et au discours et à la pensée ; dans ces conditions, leur genèse oblige à admettre l'un."
