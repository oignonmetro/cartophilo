- id: "t34c13-m2"
  title: "Rien n'est qui ne soit un"
  notes: |-
    **L'argument change de plan :** {coral}**l'un est indispensable « pour rendre compte de l'existence de chaque réalité », « car il n'est rien qui ne soit un »**{/coral}**.** Jusqu'ici, l'un était requis par la pensée ; à présent, il l'est par l'être lui-même.

    **Pourquoi « Et si cela est indispensable » ?** La phrase reprend la forme de l'argument précédent ({amber}ce qui est requis préexiste{/amber}), en l'appliquant non plus à la formation de nos notions, mais à {coral}l'existence des choses{/coral}. Le « cela » reprend le nombre, et d'abord l'un, qu'il a fallu admettre.

    **Pourquoi « l'existence de chaque réalité » ?** En grec *ousias hekastès hupostasis* : le mot *hupostasis* dit {violet}la subsistance{/violet}, le fait qu'une réalité tienne par elle-même ; l'un en est le fondement. Le jeu est serré : la *ousia* de la première ligne, que la traduction rend par « réalité », revient ici, et c'est elle qu'{coral}il faudra engendrer{/coral}.

    **Pourquoi « il n'est rien qui ne soit un » ?** __Parce qu'une chose sans aucune unité ne serait aucune chose déterminée.__ {yellow}Une armée est une armée, un tas de sable un tas, un vivant un vivant ; si l'armée perd toute unité, il n'y a plus d'armée, mais des soldats dispersés, dont chacun, à son tour, est un{/yellow}. Ce qui n'aurait aucune unité ne serait rien qu'on puisse désigner, donc ne serait pas. Le [[traite9|traité 9]] s'ouvre sur le même axiome : {teal}« {/teal}C'est {teal}en vertu de l'unité que tous les êtres sont des êtres{/teal} […]. Et en effet, {teal}qu'est-ce qui pourrait être, sans être un ? »{/teal} (1, 1-3).

    **Qu'est-ce que la prémisse établit, et qu'est-ce qu'elle n'établit pas ?** Elle établit que {coral}l'un est condition nécessaire de l'être{/coral}. Mais {sky}Aristote{/sky} l'accorderait aussi : pour lui, {teal}« {/teal}ce qui est et l'un, {teal}c'est la même chose »{/teal} (*Métaphysique*, Γ, 2, 1003b22-24), l'un et l'être se {violet}convertissent{/violet}, ils se disent de tout ce qui est, {red}sans que l'un précède l'autre{/red}. De la prémisse, on ne peut donc pas encore tirer la priorité.

    ! « Il n'est rien qui ne soit un » ne suffit pas à établir {red}la priorité de l'un{/red} : deux choses peuvent aller toujours ensemble sans que l'une précède l'autre.
  passage:
    label: "13, 50-54"
    part: "Argument 5 : l'un doit se trouver avant l'être et l'engendrer"
    text: "Et si cela est indispensable pour rendre compte de l'existence de chaque réalité, car il n'est rien qui ne soit un,"
  points:
