- id: "t34c13-m1f"
  title: "Dire quelque chose, c'est dire un, deux ou plusieurs"
  notes: |-
    **Ce qui valait pour « ce quelque chose » vaut pour toute manière de parler des choses :** {coral}**dire « quelque chose », c'est dire « un » ; « un couple de choses », deux ; « des choses », plusieurs.**{/coral}

    **Pourquoi trois cas ?** Le grec distingue trois **nombres grammaticaux** :

    | Nombre grammatical | Ce qu'on dit | Ce qu'on dit aussi |
    | singulier (*ti*) | « quelque chose » | un |
    | duel (*tine*) | « un couple de choses » | deux |
    | pluriel (*tina*) | « des choses » | plusieurs |

    ? **Duel** : un nombre grammatical propre aux paires, entre le singulier et le pluriel, comme {yellow}les deux yeux ou deux chevaux attelés{/yellow}. Le grec l'a, d'autres langues aussi.

    **Pourquoi « du même coup » ?** Il n'y a pas deux actes, l'un de nommer, l'autre de compter : {coral}nommer quelque chose, c'est déjà le compter{/coral}. Plotin renvoie ici au {sky}*Sophiste*{/sky} (237d), où l'Étranger montre qu'on ne peut dire « quelque chose » sans dire un, deux ou plusieurs.

    **Pourquoi passer de « on dit » à « elle dit » ?** Plotin passe sans transition de la parole à la pensée, __parce que le discours exprime la pensée et en a la même structure__. La {violet}raison discursive{/violet} parle en elle-même ce qu'elle pense.

    **Pourquoi le « deux » ?** Il n'est pas ici la {violet}Dyade{/violet}, le principe du deux que la tradition attribue à l'{sky}enseignement oral de Platon{/sky}, mais {amber}un attribut contenu dans certaines notions{/amber}. Les couples de genres du *Sophiste* (le Même et l'Autre, le Mouvement et le Repos) supposent de même {coral}l'unité de chaque contenu de pensée et la dualité de chaque couple{/coral}.

    ! Le deux de « un couple de choses » n'est {red}pas la Dyade{/red} : c'est {green}une détermination de la notion{/green}.
