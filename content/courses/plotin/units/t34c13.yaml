- id: "t34c13-m1i"
  title: "Ce qu'il faut pour que se forment notion et discours leur préexiste"
  notes: |-
    **L'argument décisif :** {coral}**ce qui est toujours indispensable « pour que se forment toute notion et tout discours » doit leur préexister**{/coral}**.**

    **Pourquoi « En revanche » ?** La phrase répond à l'objection laissée ouverte : l'un ne serait-il qu'une notion formée par la pensée ? Le point décisif est la {violet}formation{/violet} des notions, leur genèse : __il ne s'agit plus de ce qu'utilise une pensée déjà formée, mais de ce qu'il faut pour qu'une notion se forme__.

    ? **Notion** (*noèma*) : un contenu de pensée, ce que la pensée forme et saisit en pensant ; le {violet}discours{/violet} (*logos*) en est l'expression ordonnée.

    **Pourquoi l'un ne peut-il pas être une notion produite ?** Pour produire cette notion, comme n'importe quelle autre, {amber}la pensée devrait déjà penser quelque chose, donc déjà de l'un{/amber} (argument 3). L'un serait alors requis pour sa propre production : {red}l'hypothèse est circulaire{/red}, il faudrait qu'il existe avant d'avoir été produit. {yellow}On n'apprend pas à compter sans savoir déjà distinguer une chose d'une autre{/yellow} : l'unité ne peut pas être le résultat du comptage, puisque le comptage la suppose. {green}La seule issue est que l'un préexiste à la pensée.{/green}

    **Pourquoi « toujours » ?** L'adverbe dit que l'un n'est pas requis pour telle notion, mais {amber}pour toute notion, dans tous les cas{/amber} : c'est ce qui en fait une condition. La prémisse que le texte ne formule pas (__ce qui est requis pour qu'une notion se forme ne peut pas être une notion produite__) est celle qui rend l'argument valide.

    **Pourquoi « et au discours, et à la pensée » ?** L'ordre redit la double portée de l'argument 3 : on ne peut ni dire ni penser sans l'un. {coral}L'antériorité de l'être des nombres sur notre pensée des nombres{/coral} est le cœur du **réalisme platonicien** : l'intelligible préexiste à l'intelligence, l'être à la pensée.

    ! La gradation va de l'impossibilité de nier (on ne peut affirmer que l'un n'est pas) à la nécessité d'une préexistence : {red}ce n'est pas la même chose{/red}.
  passage:
    label: "13, 36-50"
    part: "Argument 4 : l'un est requis par toute pensée et tout discours"
    text: "En revanche, ce qui est toujours indispensable pour que se forment toute notion et tout discours, doit préexister et au discours, et à la pensée."
  points:
  - id: "t34c13-m1-65"
    sentence: "« En revanche, ce qui est toujours indispensable ___, doit préexister et au discours, et à la pensée. »"
    answer: "pour que se forment toute notion et tout discours"
