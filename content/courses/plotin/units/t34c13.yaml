- id: "t34c13-m1b"
  title: "La présence de l'un dans le sensible est due à la participation"
  notes: |-
    **Plotin applique le modèle à** {violet}**l'un**{/violet} **:** {coral}**sa présence dans le sensible est due à la participation**{/coral}**.** On perçoit bien de l'unité dans les corps, mais cette unité perçue est empruntée, comme l'être du bouquet.

    **Pourquoi « on peut considérer » ?** La modalité est prudente : {amber}Plotin propose l'analogie plus qu'il ne la démontre{/amber}. L'analogie ne prouve pas que l'un est intelligible ; elle le range dans une classe, avec la réalité et l'être, que le lecteur platonicien admet déjà. Toute la suite ne prouvera pas, à proprement parler, que l'un est intelligible, mais {coral}qu'il n'est pas tiré des choses par la pensée{/coral}.

    **Pourquoi « dont la présence dans le sensible » ?** __Parce qu'on voit de l'un dans les corps__ : {yellow}on voit qu'il y a un arbre devant soi, et non deux ou aucun{/yellow}. {sky}Aristote{/sky} range le nombre, et l'unité en particulier, parmi les {violet}sensibles communs{/violet}, perçus par plusieurs sens à la fois (*De l'âme*, III, 1, 425a16) : {yellow}inutile de compter pour voir qu'il y a deux tours à Notre-Dame et quatre piliers à la tour Eiffel{/yellow} ; a fortiori, on perçoit « un » dès qu'il y a un contenu de sensation, {yellow}un bruit, une odeur, une tache colorée{/yellow}. Plotin accorde ce point, mais le retourne : {coral}ce qu'on perçoit ainsi n'est que la présence d'un un reçu{/coral}.

    **Pourquoi « due à la participation » ?** L'homonymie vaut pour l'un comme pour l'être : il y a une {amber}homonymie comparable entre l'unité sensible et l'unité intelligible{/amber}. Elle n'est pas une homonymie accidentelle, comme celle d'un même mot pour deux choses sans rapport, mais {green}une relation de participation{/green} : il y a {coral}quelque chose de commun à toutes les formes d'unité{/coral}, la {violet}trace du premier principe{/violet} dans l'ensemble de la procession. Le lien entre l'unité et la réalité se constate dans {yellow}le moindre phénomène sensible, un arc-en-ciel, une armée, une pensée joyeuse{/yellow} ; il existe de façon éminente dans l'intelligible.

    **Pourquoi l'un doit-il valoir comme intelligible ?** L'objet propre de *Sur les nombres* est de montrer l'importance des {violet}nombres intelligibles{/violet}, et d'abord de l'unité intelligible, dans la constitution du monde supérieur. Le traité distingue (chapitres 10 et 15) les {violet}nombres nombrants{/violet}, réalités intelligibles (hénade, dyade, triade, la décade en soi, *autodekas*), et les {violet}nombres nombrés{/violet}, quantités de choses qu'on compte : {yellow}nos dizaines sensibles, dix arbres le long de la route ou dix étudiants au cours de grec{/yellow}, temporaires et accidentelles, participent à la décade en soi ; {teal}« {/teal}la dizaine qui est un aspect de la chose {teal}n'est pas la décade en soi »{/teal} (chapitre 5, 40). De même, {coral}toute unité sensible participe à l'un qui existe « sur le mode de l'intelligible »{/coral}, comme Forme, réalité incorporelle et éternelle.

    ! L'un perçu dans les corps n'est pas {red}une illusion{/red} : il est {green}réel, mais reçu{/green}.
