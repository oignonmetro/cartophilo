- id: "t34c13-m1c"
  title: "Connu comme un intelligible et sur le mode de l'intelligible"
  notes: |-
    **L'un** {coral}**« n'est pourtant connu par la raison discursive que comme un intelligible et sur le mode de l'intelligible »**{/coral}**.** Présent dans le sensible, il n'est connu que comme ce qu'il est vraiment : un intelligible.

    ? **Raison discursive** (*dianoia*) : la pensée de l'âme humaine, qui raisonne et passe d'une chose à une autre, par opposition à l'intuition immédiate de l'{violet}Intellect{/violet}, qui saisit tout d'un coup.

    **Pourquoi « la raison discursive » ?** __Parce que c'est notre pensée qui est en cause__, celle qui, dans l'objection du chapitre 12, tirerait l'un des choses. Plotin ne parle pas de l'Intellect divin, mais de l'âme qui {yellow}voit un arbre et pense « un »{/yellow}. Le texte ne nomme jamais l'âme, mais {amber}les opérations psychiques humaines y sont partout présentes{/amber}, la pensée et le langage notamment.

    **Pourquoi deux expressions, « comme un intelligible et sur le mode de l'intelligible » ?** En grec *noèton kai noètôs* : la première dit {coral}ce qu'est l'objet saisi{/coral}, une réalité intelligible ; la seconde, {coral}comment il est saisi{/coral}, par la pensée et non par les yeux. {yellow}Les yeux enregistrent la couleur et la forme de l'arbre{/yellow} ; mais l'unité n'est pas une couleur de plus, posée sur l'arbre à côté du vert : c'est la pensée qui saisit que ce qui est vu est un. Ce qui peut être saisi sensiblement peut l'être aussi « intelligiblement ». L'approche de l'un n'est donc {red}pas celle d'une expérience mystique{/red}, mais {green}une remontée de notre monde sensible vers l'autre, de l'ici vers le là-bas{/green}.

    **Pourquoi « pourtant » ?** L'adverbe marque l'écart entre la présence de l'un dans le sensible et sa connaissance : {amber}il est dans les corps, il n'est connu que hors d'eux{/amber}.

    **C'est la difficulté du passage.** Rapprochée de la transcendance de l'Un, la formule surprend : Plotin tient ailleurs pour {teal}« {/teal}plus vénérable et {teal}réellement vénérable ce qui est au-delà du penser »{/teal} ([[traite38|traité 38]], 39, 33-34) ; notre saisie de l'Un {teal}« {/teal}ne se fait {teal}ni au moyen de la science ni au moyen de l'intellection »{/teal}, elle {teal}« {/teal}résulte {teal}d'une présence qui est supérieure à la science »{/teal} ([[traite9|traité 9]], 4, 1-3) ; en ce qui le concerne, {teal}« {/teal}il n'y a {teal}pas de figure, pas même intelligible »{/teal} ([[traite39|traité 39]], 11, 31-32), et le principe ne doit {teal}« {/teal}ni recevoir de forme {teal}ni être une forme intelligible »{/teal} (traité 38, 33, 21). Mais {amber}dans ses premiers traités, Plotin fait parfois de l'Un le sommet du monde intelligible{/amber}, et en ce sens un intelligible.

    ! L'un connu « sur le mode de l'intelligible » n'est pas {red}l'Un au-delà de la pensée{/red} : c'est {green}l'unité présente dans l'intelligible{/green}, et la difficulté vient de ce que le texte ne le précise pas.
