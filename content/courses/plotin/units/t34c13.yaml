- id: "t34c13-m2d"
  title: "L'un qui est multiple ; dans l'un, pas l'être"
  notes: |-
    **La raison :** {coral}**« dans l'être il y a aussi l'un qui est multiple, tandis que dans l'un il n'y a pas l'être »**{/coral}**.** C'est l'asymétrie qui transforme la coextension en priorité.

    **Pourquoi « dans l'être il y a aussi l'un qui est multiple » ?** __L'unité qu'on trouve dans l'être est toujours l'unité d'une pluralité__, {yellow}comme celle d'un organisme, tout composé de parties{/yellow} ; et le monde intelligible lui-même est un ensemble de Formes. Un être est toujours un être déterminé, {yellow}un cheval ou la justice{/yellow} : être un cheval, c'est être un et, en plus, être cheval ; il y a déjà dans tout être deux aspects, son unité et ce qu'il est. La formule vient du {sky}*Parménide*{/sky} (143a, *to hen on polla* ; 144e) : pour Plotin, {coral}on se trouve alors au niveau de l'Intellect{/coral}. Au [[traite9|traité 9]], 2, Plotin le dit de l'homme : {teal}« {/teal}l'homme est un animal et il est doué de raison, c'est-à-dire qu'{teal}il a plusieurs parties qui sont reliées dans l'unité »{/teal}.

    ? **Un-multiple** : l'unité d'un tout fait de parties, l'unité de ce qui est déterminé ; c'est l'unité de l'Intellect et des Formes, non celle de l'Un.

    **Pourquoi « dans l'un il n'y a pas l'être » ?** __L'un pur ne contient aucune pluralité, donc aucune détermination, donc pas l'être.__ D'où l'asymétrie : {coral}l'être ne se passe pas de l'un, l'un se passe de l'être{/coral}. C'est exactement le critère d'antériorité qui manquait à l'argument précédent.

    | | Contient l'autre ? | Peut être sans l'autre ? |
    | l'être | oui : l'un qui est multiple | non |
    | l'un | non : pas l'être en lui | oui |

    **Pourquoi « tandis que » ?** La conjonction met les deux membres en regard : {amber}de deux termes toujours ensemble, celui qui peut être pensé sans l'autre est premier{/amber}. C'est le point le plus haut du texte, où l'un est dit sans être, et c'est de là que naît la difficulté : comment ce qui précède l'être peut-il encore être appelé intelligible ?

    ! L'un qui est multiple n'est {red}pas l'Un{/red} : c'est {green}l'unité de l'être{/green}, et c'est pourquoi elle ne peut être première.
