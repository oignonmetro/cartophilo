- id: "t34c13-m3b"
  title: "Désigner au lieu de nommer"
  notes: |-
    **La raison :** {coral}**« au lieu de prononcer son nom, il désigne »**{/coral} **une présence, une réalité ou une autre forme d'être.** Le « ceci » ne décrit rien : il montre, et il ne fonctionne que si quelque chose est là.

    **Pourquoi opposer désigner et nommer ?** __Nommer, c'est appliquer à une chose un mot général__, comme {yellow}« cheval »{/yellow}, qui vaut pour beaucoup de choses et qu'on peut employer sans que rien ne lui corresponde ({yellow}on parle bien de licornes{/yellow}). __Désigner, c'est montrer__ : « ceci » pointe vers ce qui est là. {coral}Un « ceci » qui ne montrerait rien serait un geste manqué, pas une parole.{/coral}

    ? **Désigner** (*deixis*, « monstration ») : faire voir une chose en la montrant, par un geste ou un démonstratif, sans dire ce qu'elle est.

    **D'où vient ce « ceci » ?** Le *touto* vient vraisemblablement de la théorie {sky}stoïcienne{/sky} de la proposition : la proposition **« définie »** est celle dont le sujet est un démonstratif au singulier ({yellow}« Celui-ci marche »{/yellow}), où la référence à un individu réel déterminé est fixée par un geste verbal de « monstration ». {coral}Plotin détourne cette explication{/coral} : il fait désigner au « ceci » {amber}une présence (*parousia*) intelligible{/amber}.

    **Pourquoi l'énumération « une présence, une réalité ou une autre forme d'être » ?** Quelle que soit la nature de ce qu'on montre, {coral}il faut qu'il y ait quelque chose{/coral} ; l'énumération ne choisit pas, elle exclut seulement le rien. « La manifestation d'une existence » dit la même chose : le « ceci » fait apparaître ce qui est.

    ! « Désigner » ne veut pas dire {red}nommer précisément{/red} : le « ceci » ne dit rien de la chose, sinon {green}qu'elle est là{/green}.
