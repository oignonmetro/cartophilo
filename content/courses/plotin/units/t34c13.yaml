- id: "t34c13-m1j"
  title: "Il faut admettre le nombre"
  notes: |-
    **La conclusion est mesurée :** {coral}**« il faut admettre le nombre, pour que se forment discours et pensée »**{/coral}**.**

    **Pourquoi « le nombre », et non « l'un » ?** __Parce que l'argument a fait passer de l'un au nombre en général__ (argument 3) : la conclusion vaut pour tout le traité, qui cherche si les nombres sont des réalités. L'un en est le premier.

    **Pourquoi « admettre » ?** Le verbe est modeste : {amber}il faut poser le nombre, l'accorder{/amber}. Le texte ne dit ici que ce que requiert la naissance de nos pensées, non encore ce qu'est le nombre en lui-même ni son rapport à l'être.

    **Qu'est-ce qu'établit ce premier moment ?** Plotin n'a pas prouvé que l'un est intelligible, il l'a {pink}posé par analogie{/pink} ; ce qu'il a prouvé, c'est que la pensée et le discours {green}ne peuvent pas se passer de l'un ni l'avoir produit{/green}, de sorte qu'il leur préexiste. L'un cesse d'apparaître comme {red}un résultat{/red}, ce que la pensée trouverait en comptant les choses, pour apparaître comme {green}une condition{/green}, ce sans quoi elle ne pourrait même pas commencer à compter.

    ! « Il faut admettre » n'est pas {red}« il est démontré »{/red} : la conclusion porte sur ce que la pensée suppose.
  passage:
    label: "13, 36-50"
    part: "Argument 4 : l'un est requis par toute pensée et tout discours"
    text: "Voilà pourquoi il faut admettre le nombre, pour que se forment discours et pensée."
  points:
  - id: "t34c13-m1-67"
    sentence: "« Voilà pourquoi ___, pour que se forment discours et pensée. »"
    answer: "il faut admettre le nombre"
    alt: []
