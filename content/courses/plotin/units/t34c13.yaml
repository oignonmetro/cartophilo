- id: t34c13-m1
  title: "De la pensée à l'un : l'un préexiste à la pensée et au discours"
  notes: |-
    **Le premier moment range l'un parmi les intelligibles, puis montre que la pensée et le discours le présupposent et ne peuvent pas l'avoir produit : l'un leur préexiste.**

    | Extrait | Arguments | Ce qu'il fait |
    | 1 | 1 | ranger l'un parmi les intelligibles, par analogie avec la réalité et l'être |
    | 2 | 2, 2a, 3 | la raison discursive « la connaissait d'avance » ; ce quelque chose est identique à l'être ; un, deux, plusieurs |
    | 3 | 3, 4a | on ne pense rien sans un nombre ; il est impossible d'affirmer que l'un n'est pas |
    | 4 | 4b | ce qu'il faut pour que se forment notion et discours leur préexiste |

    Ce moment ne prouve pas que l'un est intelligible : il le suppose. Ce qu'il prouve, c'est que la pensée et le discours ne peuvent se passer de l'un ni l'avoir produit. L'un cesse d'apparaître comme un **résultat** (ce que la pensée trouverait en comptant les choses) pour apparaître comme une **condition** (ce sans quoi elle ne pourrait même pas commencer à compter).

    ! Les arguments 2 à 4 ne démontrent pas l'intelligibilité de l'un, mais qu'il n'est pas tiré des choses par la pensée.

    === 1 Argument 1 : l'un rangé parmi les intelligibles, par analogie

    **Par analogie avec la réalité et l'être, qui sont quelque chose d'intelligible bien que le sensible y participe, Plotin pose que l'un aussi est intelligible, bien qu'il soit présent dans le sensible.**

    Est **intelligible** ce que seule la pensée saisit (ce que tous les chevaux ont en commun, la Forme du cheval), par opposition au sensible, que les sens perçoivent. La **participation** (*methexis*) est la relation par laquelle une chose sensible tient ce qu'elle est d'une Forme ; elle va toujours du sensible vers l'intelligible, jamais l'inverse. Ce n'est pas une identité mais une **imitation** : l'homme sensible n'est pas l'homme en soi, il lui ressemble. C'est la doctrine du *Phédon* et de *La République*, que Plotin reprend en rejetant les objections d'Aristote au début de la *Métaphysique* ; sans cet ancrage dans les Formes, le sensible sombrerait dans le flux héraclitéen.

    « La réalité et l'être » (*hè ousia kai to einai* ; la GF rend *ousia* par « réalité », d'autres par « substance ») appellent la doctrine de l'**homonymie de l'être** : l'être au sens strict, la réalité, n'existe que dans l'intelligible, la « plaine de la vérité » du *Phèdre* (248b), où *ta onta*, *hai ousiai*, *ta eidè* (les étants, les réalités, les Formes) sont synonymes ; le sensible est être au sens dérivé. Cette homonymie est l'autre nom de la participation (on ne parlera pas d'une « duplicité de l'être ») ; elle fonde la beauté du monde sensible, que Plotin défend contre les Gnostiques dans le traité 33, qui précède *Sur les nombres*. L'un connaît une homonymie comparable : non pas accidentelle, mais de participation ; ce qu'ont en commun toutes les formes d'unité est la **trace du premier principe** dans la procession.

    On perçoit bien de l'unité dans les corps : Aristote range le nombre parmi les **sensibles communs** (*De l'âme*, III, 1, 425a16), et il est inutile de compter pour voir qu'il y a deux tours à Notre-Dame. Mais l'un n'est connu « que comme un intelligible et sur le mode de l'intelligible » (*noèton kai noètôs*) : la première expression dit ce qu'est l'objet, la seconde comment il est saisi. Ce qui le connaît est la **raison discursive** (*dianoia*), la pensée de l'âme, qui raisonne et va d'une chose vue à une autre qu'elle ne voit pas, et non l'intuition immédiate de l'Intellect. L'approche de l'un n'est pas une expérience mystique, c'est une remontée de l'ici vers le là-bas.

    L'analogie ne prouve pas que l'un est intelligible : elle le range dans une classe que le lecteur platonicien admet déjà. Et elle fait difficulté, rapprochée de la transcendance de l'Un : Plotin tient pour « plus vénérable et réellement vénérable ce qui est au-delà du penser » (traité 38, 39, 33-34) ; notre saisie de l'Un « ne se fait ni au moyen de la science ni au moyen de l'intellection », elle « résulte d'une présence qui est supérieure à la science » (traité 9, 4, 1-3) ; en ce qui le concerne, « il n'y a pas de figure, pas même intelligible » (traité 39, 11, 31-32), et le principe ne doit « ni recevoir de forme ni être une forme intelligible » (traité 38, 33, 21). Mais dans ses premiers traités, Plotin fait parfois de l'Un le **sommet du monde intelligible**, et en ce sens un intelligible.

    L'objet propre de *Sur les nombres* est de montrer l'importance des nombres intelligibles, et d'abord de l'unité intelligible, dans la constitution du monde supérieur. Le traité distingue (chapitres 10 et 15) les nombres **nombrants**, réalités intelligibles (hénade, dyade, triade, la décade en soi, *autodekas*), et les nombres **nombrés**, quantités de choses qu'on compte : nos dizaines sensibles, temporaires et accidentelles (dix arbres le long de la route, dix étudiants au cours de grec), participent à la décade en soi ; « la dizaine qui est un aspect de la chose n'est pas la décade en soi » (chapitre 5, 40). De même, toute unité sensible participe à l'un qui existe « sur le mode de l'intelligible », comme Forme.

    ! Écrire que « les Formes participent au sensible » renverse la participation : c'est une erreur grave.

    === 2 Arguments 2 et 3 : la raison discursive « la connaissait d'avance »

    **Puisque, à partir d'une chose qu'elle voit, la raison discursive en pense une autre qu'elle ne voit pas (l'un), « elle la connaissait donc d'avance » : la vision donne l'occasion de penser l'un, elle n'en est pas la source.**

    Le « donc » suppose une prémisse implicite : la chose vue ne contient pas ce qu'on pense à son occasion. Les choses sensibles ne sont jamais parfaitement unes (l'arbre est un et multiple), alors que l'un pensé est sans parties : c'est le raisonnement du *Phédon* (74e) sur les bouts de bois « presque égaux », qui supposent qu'on connaisse déjà l'égal lui-même.

    Le savoir préalable (*proèdei*) suppose la **réminiscence** : « penser, c'est se souvenir ». Mais sous sa forme plotinienne : « notre âme n'a pas plongé tout entière ici-bas, mais quelque chose d'elle reste toujours dans l'intelligible » (traité 6, IV, 8, 8, 1-3), doctrine que Proclus refusera. L'antériorité n'est donc pas seulement chronologique (Plotin reprend la métempsycose) mais **ontologique**, une antériorité de principe.

    **Argument 2a.** Ce savoir préalable tient à ce que « ce quelque chose » est « identique à l'être » : désigner une chose, c'est la découper, la délimiter, la poser comme un être, et comme un seul. L'argument 2 établit le fait du savoir préalable ; 2a en donne le **mécanisme** : l'un est compris dans l'acte même de désigner. Or chaque Forme, chaque « ceci » intelligible, est une certaine unité : au chapitre 5 (36-38), Plotin parle « non pas de cet Un dont nous disons bien sûr qu'il est “au-delà de l'être”, mais bien de cet un qui est attribué à chacune des formes ».

    **Argument 3.** Ce qui valait pour ce quelque chose vaut pour toute manière de parler des choses : quand on dit *ti* (quelque chose), on dit *hen* (un) ; « un couple de choses », deux ; « des choses », plusieurs. C'est la distinction grecque du **singulier**, du **duel** et du **pluriel**, par laquelle Plotin renvoie au *Sophiste* (237d). Il passe sans transition de la parole à la pensée, parce que le discours exprime la pensée et en a la même structure. Le « deux » n'est pas ici la **Dyade** de l'enseignement oral de Platon, seulement un attribut contenu dans certaines notions. Les couples de genres du *Sophiste* (le Même et l'Autre, le Mouvement et le Repos) supposent de même l'unité de chaque contenu de pensée et la dualité de chaque couple.

    ! « D'avance » ne désigne pas d'abord un savoir acquis plus tôt, mais ce qui rend possible la pensée de chaque chose vue.

    === 3 Argument 4a : il est impossible d'affirmer que l'un n'est pas

    **La généralisation de l'argument 3 (on ne peut penser quelque chose sans un nombre) a une conséquence sur le dire : ce dont la non-existence rendrait impossible toute parole, « il est impossible d'affirmer que cela n'est pas ».**

    La force de l'induction tient à ce que les trois cas **épuisent** les manières de parler des choses, ce que le texte suppose sans le dire. Dans un traité *Sur les nombres*, elle fait passer de l'un au **nombre** en général et prépare la thèse que les nombres sont des réalités. Plotin s'appuie encore sur le *Sophiste* (238c) et fait allusion au *Parménide* (142a, 155e), où l'un qui n'est pas ne peut être ni nommé ni dit.

    L'argument 4a se décompose : supposer que l'un n'existe pas ; alors il n'y aurait plus rien à penser ni à dire, pas même « l'un n'existe pas », qui est une phrase, et une seule ; celui qui l'affirme ne pourrait donc pas le dire si c'était vrai. Comme celui qui dit à voix haute « je ne peux pas parler », il réfute ce qu'il dit en le disant : la négation se **défait** elle-même.

    Mais ne pas pouvoir nier n'est pas encore affirmer : la conclusion porte sur ce qu'on peut dire, non sur ce qui existe. Reste une objection : la pensée aurait besoin de la **notion** d'un, qu'elle formerait elle-même, sans qu'existe hors d'elle aucune unité réelle. C'est elle que le « en revanche » suivant écarte.

    ! L'argument 4a ne prouve pas que l'un existe : il prouve seulement qu'on ne peut pas affirmer qu'il n'existe pas.

    === 4 Argument 4b : l'un préexiste à la pensée et au discours

    **Ce qui est indispensable « pour que se forment toute notion et tout discours » doit leur préexister : « il faut admettre le nombre, pour que se forment discours et pensée ».**

    Le point décisif est la **formation** des notions (leur genèse) : il ne s'agit plus de ce qu'utilise une pensée déjà formée, mais de ce qu'il faut pour qu'une notion se forme. Si l'un n'était qu'une notion produite, la pensée devrait, pour la produire, penser déjà quelque chose, donc déjà de l'un : l'un serait requis pour sa propre production, ce qui est **circulaire**. On n'apprend pas à compter sans savoir distinguer une chose d'une autre : l'unité n'est pas le résultat du comptage, puisque le comptage la suppose.

    La prémisse implicite (ce qui est requis pour qu'une notion se forme ne peut pas être une notion produite) rend l'argument valide. La gradation va de l'impossibilité de nier (4a) à la nécessité d'admettre une préexistence (4b), et la conclusion reste mesurée : il faut « admettre » le nombre. Ce qu'il faut pour que se forment toute notion (*noèma*) et tout discours (*logos*) doit préexister : l'être des nombres précède notre pensée des nombres. C'est le cœur du **réalisme platonicien** : l'intelligible préexiste à l'intelligence, l'être à la pensée.

    ! La conclusion porte sur « le nombre » : l'argument a fait passer de l'un au nombre en général, dont l'un est le premier.
  passage:
    label: "13, 36-50"
    text: "En outre, tout comme la réalité et l'être sont quelque chose d'intelligible et non pas de sensible, bien que le sensible participe des intelligibles, de même aussi on peut considérer que l'un, dont la présence dans le sensible est due à la participation, n'est pourtant connu par la raison discursive que comme un intelligible et sur le mode de l'intelligible, de sorte que c'est à partir d'une chose qu'elle voit qu'elle en pense une autre qu'elle ne voit pas. Elle la connaissait donc d'avance. Et si elle la connaissait d'avance comme étant ce quelque chose, cela signifierait que ce dernier est identique à l'être. Et quand on dit « quelque chose », du même coup on dit « un ». De même, quand elle dit « un couple de choses », elle dit deux, et quand elle dit « des choses », elle dit plusieurs. Si donc il n'est pas même possible de penser quelque chose sans le « un », le « deux » ou un nombre quelconque, comment se peut-il que ce sans quoi il n'est pas possible de penser ou de dire quelque chose ne soit pas ? Car ce dont la non-existence rend impossible de dire ou de penser quoi que ce soit, il est impossible d'affirmer que cela n'est pas. En revanche, ce qui est toujours indispensable pour que se forment toute notion et tout discours, doit préexister et au discours, et à la pensée. Voilà pourquoi il faut admettre le nombre, pour que se forment discours et pensée."
