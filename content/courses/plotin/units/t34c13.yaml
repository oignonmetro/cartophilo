- id: "t34c13-m4b"
  title: "L'un n'est pas de ces relatifs"
  notes: |-
    **La réponse :** {coral}**l'un n'est pas « un de ces relatifs qui, lorsque leur corrélat pâtit sans qu'ils subissent eux-mêmes aucune affection, perdent leur nature propre »**{/coral}**.**

    **Que sont ces relatifs ?** __Ils peuvent cesser de convenir à une chose sans que cette chose change.__ {yellow}« Être à droite de x » n'est plus vrai si x a changé de place{/yellow} ; {yellow}Paul est plus grand que Pierre ; Pierre grandit ; Paul n'a pas changé, et pourtant il n'est plus plus grand que lui{/yellow}. Le {sky}*Phédon*{/sky} (96e-97b) en donne les exemples souvent repris, « plus grand que » et « plus petit que » : {yellow}Paul peut être à la fois plus grand que Pierre et plus petit que Jean{/yellow}. La qualification est alors {pink}purement accidentelle et étrangère à ce qu'est la chose{/pink}.

    **Pourquoi « pâtit » et « aucune affection » ?** Pâtir, c'est subir un changement. Le relatif perd sa nature propre {amber}parce que l'autre terme a changé{/amber}, sans avoir lui-même rien subi : {coral}c'est ce qui le rend extérieur à la chose{/coral}. Plotin éclaire ailleurs cette nature : le relatif est {teal}« {/teal}ce qui {teal}ne tient sa réalité de rien d'autre que du rapport »{/teal} ([[traite42|traité 42]], VI, 1, 7) ; {yellow}le double et la moitié n'ont d'être que l'un par l'autre{/yellow}.

    **Pourquoi l'un n'en est-il pas ?** La phrase suivante le dira : __l'un ne se perd pas par ce qui arrive à un autre__, il se perd par ce qui arrive à la chose elle-même.

