- id: "t34c13-m5d"
  title: "Par soi dans ce qui vient en premier"
  notes: |-
    **Le second membre :** {coral}**l'un « est par soi dans ce qui vient en premier, lorsqu'il est un, puis être »**{/coral}**.**

    **Pourquoi « ce qui vient en premier » ?** Seule la seconde branche de la distinction est précisée, et elle l'est par l'ordre établi au deuxième moment : dans ce qui vient en premier, {coral}l'unité précède l'être{/coral}, cette réalité est un avant d'être, donc elle tient son unité d'elle-même et non d'ailleurs. On se trouve alors au niveau de l'« un qui est ».

    ? **Glose** : une note ajoutée par un lecteur ou un copiste dans la marge ou entre les lignes d'un manuscrit, puis passée dans le texte. Après « ce qui vient en premier », les manuscrits portent « dans les intelligibles » (*tois noètois*), que L. Brisson, à la suite de Henry et Schwyzer, tient pour une glose interpolée et ne traduit pas.

    **Pourquoi « lorsqu'il est un, puis être » ?** La formule donne l'ordre, non une alternance dans le temps : __d'abord un, puis être__. Mais une **tension** demeure : l'un est placé « parmi les êtres », et ce qui vient en premier est un « puis être », donc être aussi, alors que le deuxième moment disait l'un « avant l'être ». L'un de cette fin semble être {amber}l'unité du premier être, l'« un qui est »{/amber}, plutôt que l'Un au-delà de l'être : l'un « attribué à chacune des formes » du chapitre 5, auquel participe toute unité sensible.

    **Qu'est-ce qu'établit ce dernier moment ?** Il ne fait pas progresser vers le principe, il consolide : il écarte deux manières de réduire l'unité à rien ({red}un simple mot, une simple relation{/red}) et il assigne à l'unité des corps son rang, {green}réelle mais reçue{/green}. Le texte se referme sur son ouverture : la participation, énoncée au départ par analogie, reçoit à la fin son vocabulaire précis. **L'unité est dans les corps comme ce qu'ils ont, et dans l'intelligible comme ce qu'il est.**

    ! « Lorsqu'il est un, puis être » n'est pas {red}l'Un au-delà de l'être{/red} : c'est {green}l'un qui est, au niveau de l'Intellect{/green}.
