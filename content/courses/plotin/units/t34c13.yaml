- id: t34c13-i2
  title: "La structure : une montée, puis un retour"
  notes: |-
    **Le texte n'avance pas en ligne droite : il établit en deux temps la priorité de l'un, sur la pensée puis sur l'être, avant de revenir, par des réponses à des objections, au statut de l'unité dans les choses.**

    | Moment | Lignes | Mouvement | Arguments |
    | I | 13, 36-50 | de la pensée à l'un | 1 à 4 |
    | II | 13, 50-54 | de l'être à l'un | 5 |
    | III | 13, 54 - 14, 13 | de l'un aux choses | 6 à 8 |

    Le **premier moment** ne prouve pas que l'un est intelligible : il le pose par analogie. Ce qu'il prouve, c'est que la pensée et le discours ne peuvent se passer de l'un ni l'avoir produit : l'un passe du statut de **résultat** (ce que la pensée trouverait en comptant) à celui de **condition** (ce sans quoi elle ne pourrait pas compter).

    Le **deuxième moment** transpose ce raisonnement à l'être ; c'est le **point le plus haut** du texte, où l'un est dit sans être.

    Le **troisième moment** ne progresse pas vers le principe : il **consolide**. Ses connecteurs (« Et le “ceci” », « Aux arguments qui ont fait appel à la notion de relatif », « Cela donc ») signalent des réponses à des objections formulées **hors de l'extrait** (au chapitre 12 et au début du chapitre 13), d'où leur allure elliptique : il faut reconstituer chaque objection à partir de la réponse.

    Les arguments les mieux étayés portent sur la pensée et sur l'unité des corps (4b, 7a) ; les plus fragiles sont aux deux extrémités : l'intelligibilité de l'un, posée **par analogie** (1), et la génération de l'être, posée **par doctrine** (5).

    ! Le troisième moment n'est pas une montée de plus vers l'Un : c'est un retour aux choses, qui referme le texte sur son ouverture.
