- id: t34c13-m2
  title: "De l'être à l'un : l'un avant l'être"
  notes: |-
    **Le deuxième moment transpose à l'être le raisonnement du premier : l'un est condition de tout ce qui est, comme il l'était de tout ce qui est pensé ; il doit donc se trouver avant l'être et l'engendrer.**

    | Extrait | Argument | Ce qu'il fait |
    | 1 | 5 | l'un, indispensable à l'existence de chaque réalité, doit se trouver avant l'être et l'engendrer |
    | 2 | 5a | l'asymétrie : dans l'être, l'un qui est multiple ; dans l'un, pas l'être |

    C'est le point le plus haut du texte, où l'un est dit sans être, et le seul passage de l'extrait qui renvoie explicitement au premier principe, tel que le présentent les traités 9, 10, 32, 38, 39 et 49. Mais il ne tient que par l'asymétrie de 5a, et laisse la génération sur le plan de la doctrine. C'est de là que naît la difficulté : comment ce qui précède l'être peut-il encore être dit intelligible ?

    ! L'ordre du texte n'est pas l'ordre logique : 5a, présenté comme une conséquence, fonde 5.

    === 1 Argument 5 : l'un doit se trouver avant l'être et l'engendrer

    **« Et si cela est indispensable pour rendre compte de l'existence de chaque réalité » : la phrase marque un changement de plan. L'un, requis jusqu'ici par la pensée, l'est à présent par l'être lui-même.** L'argument reprend la forme de 4b (ce qui est requis préexiste), appliquée non plus à la formation de nos notions mais à l'existence des choses : l'un fonde « l'existence de chaque réalité » (*ousias hekastès hupostasis*).

    La prémisse, **« il n'est rien qui ne soit un »**, se comprend par l'absence d'unité : une armée qui perd toute unité n'est plus une armée, mais des soldats dispersés, dont chacun, à son tour, est un. Ce qui n'aurait aucune unité ne serait rien de déterminé, donc ne serait pas.

    La phrase enchaîne pourtant trois affirmations. La prémisse établit que l'un est **condition nécessaire** de l'être, ce qu'Aristote accorderait aussi, lui pour qui l'un et l'être se **convertissent** sans que l'un précède l'autre. Qu'il soit **« avant »** l'être demande plus : selon le critère qu'Aristote attribue à Platon (*Métaphysique* Δ, 11), A est antérieur à B si B ne peut être sans A, alors que A peut être sans B ; c'est ce qu'établira 5a. Qu'il **« engendre »** l'être est plus fort encore, car une condition n'est pas une cause : ce pas n'est pas argumenté, il repose sur la doctrine de la **procession**, où chaque principe produit ce qui vient après lui sans rien perdre, comme le soleil éclaire sans s'appauvrir. Que l'Un soit antérieur à l'être, Plotin le dit ailleurs (traité 9, VI, 9, 2), et qu'il l'engendre (traité 32, V, 5, 5).

    « Il doit se trouver avant l'être (*pro ousias*) et engendrer l'être (*gennôn tèn ousian*) » reprend l'*epekeina tès ousias* de *La République* (VI, 509b), l'au-delà de l'essence de l'Idée du Bien. Le texte ne nomme jamais le Bien, mais envisage la puissance de diffusion de l'un. Pierre Hadot, dans son commentaire du traité 38 (1988), a mis en lumière cette « généalogie » de l'être intelligible à partir de l'Un. Être « avant l'être », c'est tout le mystère de la nature ineffable de l'Un : la formule même attribue l'être à ce dont elle veut dire qu'il s'en passe.

    ! « Il n'est rien qui ne soit un » ne suffit pas à établir la priorité de l'un : deux choses peuvent aller toujours ensemble sans que l'une précède l'autre.

    === 2 Argument 5a : « un qui est », et non « être » et ensuite « un »

    **La formule « un qui est » fixe un ordre : l'un vient d'abord, l'être s'y ajoute ; « être » et ensuite « un » ferait de l'unité une propriété qui s'ajouterait à l'être après coup.** La formule (*hen on*) renvoie à la deuxième hypothèse du *Parménide* (142d), qui montre que l'un qui est est déjà double ; mais les guillemets ne garantissent pas à eux seuls une citation, puisque le texte en emploie déjà autour de « quelque chose » et d'« un ».

    La justification tient en une **asymétrie**. Dans l'être, il y a « l'un qui est multiple », formule elle aussi tirée du *Parménide* (143a, 144e) : pour Plotin, on se trouve alors au niveau de l'**Intellect**. Un être est toujours déterminé, un cheval ou la justice, donc un et, en plus, ce qu'il est. Dans l'un, il n'y a pas l'être : l'un pur ne contient aucune pluralité, donc aucune détermination. L'être ne se passe pas de l'un, l'un se passe de l'être : c'est exactement le **critère d'antériorité** qui manquait à l'argument 5. Ce qui se présente comme une conséquence (« voilà pourquoi ») est en réalité ce qui fonde l'antériorité.

    La restriction, « à moins encore qu'il ne produise l'être en s'inclinant pour l'engendrer » (*prosneusan*), dit en quel sens l'être serait « dans » l'un : comme ce qu'il produit, l'effet dans la puissance de sa cause. L'**inclinaison** (*neusis*) est une image, une des variantes de la procession ; Plotin l'emploie surtout pour la **descente de l'âme** vers le corps : « si l'inclinaison est une illumination dirigée vers ce qui se trouve plus bas, ce n'est pas une faute » (traité 53, I, 1, 12, 24-26). L'Un ne se meut pas et ne change pas : d'où le « à moins que », la même prudence que dans la « quasi-activité » de l'Un, *hoion energeia*, « ce qui lui tient lieu d'acte » (traité 39, 7, 47). D'autres textes recourent aux images traditionnelles du père, de la source ou de la racine.

    Une obscurité demeure : le sujet grammatical de « il est “un qui est” » est l'un lui-même, ce qui semble lui attribuer l'être au moment même où l'être est dit absent de lui. L'un dont il est question est-il celui de l'*epekeina tès ousias*, ou l'unité présente sur le mode intelligible dans l'être ?

    ! L'« inclinaison » n'est pas un mouvement de l'Un : c'est une image, signalée comme telle par le « à moins que ».
  passage:
    label: "13, 50-54"
