- id: "t34c13-m1h"
  title: "Il est impossible d'affirmer que l'un n'est pas"
  notes: |-
    **La conséquence porte sur le dire :** {coral}**ce dont la non-existence rendrait impossible de dire ou de penser quoi que ce soit, « il est impossible d'affirmer que cela n'est pas »**{/coral}**.** La question rhétorique pose la thèse, la phrase en « car » la fonde.

    **Comment se décompose le raisonnement ?** Qu'on suppose d'abord que l'un n'existe pas. Puisque toute pensée et tout discours portent sur quelque chose, une chose ou plusieurs, {amber}il n'y aurait plus rien qu'on puisse penser ni dire{/amber}. Mais alors la phrase {red}« l'un n'existe pas »{/red} ne pourrait pas être dite non plus : c'est une phrase, elle porte sur quelque chose, et elle est elle-même une phrase, une seule. {coral}Celui qui l'affirme ne pourrait pas la dire si elle était vraie{/coral} : sa phrase détruit les conditions qui lui permettent d'être prononcée. {yellow}Celui qui dit à voix haute « je ne peux pas parler » réfute ce qu'il dit en le disant{/yellow} ; de même, nier l'un, c'est employer, pour le nier, ce dont on nie l'existence : {coral}la négation se défait elle-même au moment où on l'énonce{/coral}.

    **Pourquoi « il est impossible d'affirmer », et non « il est faux » ?** __Parce que la négation de l'un n'est pas seulement fausse, elle est impossible à dire.__ Plotin s'appuie sur le {sky}*Sophiste*{/sky} (238c) et fait allusion au {sky}*Parménide*{/sky} (142a, 155e), où l'un qui n'est pas ne peut être ni nommé ni dit.

    **Qu'est-ce qui est établi ?** {amber}La conclusion porte sur ce qu'on peut dire, non encore sur ce qui existe.{/amber} Ne pas pouvoir nier n'est pas encore affirmer. Reste une objection : peut-être la pensée a-t-elle besoin de la **notion** d'un, d'une idée qu'elle forme elle-même, {red}sans qu'existe hors d'elle aucune unité réelle{/red}. C'est elle que la phrase suivante écarte, et c'est pourquoi elle s'ouvre par « En revanche ».

    ! L'argument ne prouve pas {red}que l'un existe{/red} : il prouve seulement {green}qu'on ne peut pas affirmer qu'il n'existe pas{/green}.
