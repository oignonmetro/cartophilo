- id: "t34c13-m1g"
  title: "On ne pense rien sans un nombre"
  notes: |-
    **Plotin généralise :** {coral}**il n'est « pas même possible de penser quelque chose sans le “un”, le “deux” ou un nombre quelconque »**{/coral}**.**

    **Pourquoi « Si donc » ?** La phrase tire la conclusion des trois cas : {amber}une induction{/amber}. Sa force tient à ce que __les trois cas épuisent les manières de parler des choses__ : il n'existe pas de quatrième forme, sans nombre, sous laquelle penser un objet. Mais {pink}le texte ne le dit pas, il le suppose{/pink}.

    **Pourquoi « pas même » ?** L'adverbe porte l'argument au plus bas : non pas seulement compter, mais {amber}penser quoi que ce soit{/amber} suppose le nombre. {yellow}Penser un caillou, c'est déjà penser un caillou{/yellow} ; penser une pluie de cailloux, c'est en penser plusieurs.

    **Pourquoi « un nombre quelconque » ?** La généralisation a une fonction propre dans un traité *Sur les nombres* : elle fait passer {coral}de l'un au nombre en général{/coral}, et prépare la conclusion du mouvement, {teal}« {/teal}il faut {teal}admettre le nombre »{/teal}. D'où la nécessité de l'existence des nombres pour que nos pensées aient une structure et se déploient selon le triple point de vue du singulier, du duel et du pluriel.

    ! L'induction n'est pas {red}une démonstration{/red} : elle tient {green}à ce que les trois cas sont tous les cas{/green}, ce que le texte suppose.
  passage:
    label: "13, 36-50"
    part: "Argument 3 : on ne pense rien sans un nombre"
    text: "Si donc il n'est pas même possible de penser quelque chose sans le « un », le « deux » ou un nombre quelconque,"
