- id: "t34c13-m2c"
  title: "« Un qui est », et non « être » et ensuite « un »"
  notes: |-
    **L'ordre est fixé :** {coral}**l'un est « un qui est », et non pas « être » et ensuite « un »**{/coral}**.** L'un vient d'abord, l'être s'y ajoute.

    ? **« Un qui est »** (*hen on*) : la formule de la deuxième hypothèse du {sky}*Parménide*{/sky} (142d), qui examine l'un qui est et montre qu'il est déjà double, puisqu'il comporte l'un et l'être. Dans le *hen on*, chacun des deux termes, *hen* et *on*, est un : {yellow}cela fait deux choses{/yellow}.

    **Pourquoi refuser « être » et ensuite « un » ?** __Ce serait faire de l'unité une propriété qui s'ajouterait à l'être après coup__, {yellow}comme une couleur à un objet déjà fait{/yellow}. Or l'argument précédent vient de montrer que rien n'est sans être un : {coral}l'un ne peut pas venir après ce qu'il rend possible{/coral}.

    **Pourquoi « Voilà pourquoi » ?** La phrase se présente comme une conséquence de « il doit se trouver avant l'être ». Mais {amber}la dépendance logique est l'inverse de l'ordre du texte{/amber} : c'est la phrase suivante (l'asymétrie) qui fonde l'antériorité, et non l'inverse.

    **Pourquoi des guillemets ?** On peut y lire une citation du *Parménide* ; mais {pink}les guillemets ne la garantissent pas à eux seuls{/pink}, puisque le texte en emploie déjà autour de « quelque chose » et d'« un ». Une **obscurité** demeure : le sujet grammatical de « il est “un qui est” » est l'un lui-même, ce qui semble {red}lui attribuer l'être{/red} au moment même où l'être est dit absent de lui. L'un dont il est question est-il celui de l'*epekeina tès ousias* (« il doit se trouver avant l'être »), ou bien l'unité présente sur le mode intelligible dans la seconde hypostase, c'est-à-dire dans l'être ?

    ! « Un qui est » ne dit pas que l'un {red}est un être{/red} : il dit {green}l'ordre de l'un et de l'être{/green}, l'un d'abord.
