  - id: g-phantasia-l1-q1
    sentence: "La faculté qui retient ce que la sensation et la pensée lui apportent, que la GF traduit par « représentation », se dit en grec translittéré ___."
    answer: phantasia
    alt: ["phantasía"]
  - id: g-phantasia-l1-q2
    sentence: "Contre une mémoire logée dans la sensation ou le raisonnement : « ceux qui raisonnent le mieux ne sont pas ceux qui ont la ___ la meilleure » (traité 27, chap. 29)."
    answer: mémoire
    alt: ["memoire"]
  - id: g-phantasia-l1-q3
    sentence: "Dans la faculté de représentation, « ce qui a été vu y est présent alors même qu'il n'y a plus ___ » (traité 27, chap. 29)."
    answer: sensation
    alt: []
  - id: g-phantasia-l1-q4
    sentence: "« La mémoire appartient à la faculté qui produit des représentations, et que se souvenir s'apparente au fait de produire une ___ » (traité 27, chap. 29)."
    answer: représentation
    alt: ["representation"]
  - id: g-phantasia-l1-q5
    sentence: "Tant qu'il reste à l'intérieur, le concept nous échappe, « car le concept ne comporte pas de ___ » (traité 27, chap. 30)."
    answer: parties
    alt: []
  - id: g-phantasia-l1-q6
    sentence: "Le discours, en déployant le concept, « fait apparaître le concept comme dans un ___ » : la représentation (traité 27, chap. 30)."
    answer: miroir
    alt: []
  - id: g-phantasia-l1-q7
    sentence: "« Autre chose est l'intellection, autre chose la ___ de l'intellection » (traité 27, chap. 30)."
    answer: perception
    alt: []
  - id: g-phantasia-l1-q8
    sentence: "Quand les deux âmes s'accordent, leurs représentations n'en font qu'une : « à la façon d'une ___, l'une accompagne l'autre » (traité 27, chap. 31)."
    answer: ombre
    alt: []
  - id: g-phantasia-l1-q9
    sentence: "La représentation de l'âme inférieure suit celle de l'âme supérieure, « comme une faible ___ qui en prolonge une plus forte » (traité 27, chap. 31)."
    answer: lumière
    alt: ["lumiere"]
  - id: g-phantasia-l1-q10
    sentence: "« Lorsqu'il y a conflit et désaccord, la représentation devient ___ par elle-même » (traité 27, chap. 31)."
    answer: manifeste
    alt: []
