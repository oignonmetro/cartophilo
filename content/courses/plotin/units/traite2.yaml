- id: traite2-l14
  title: "La venue dans le corps : produire sans quitter l'intelligible (chap. 13)"
  notes: |-
    Le chapitre 13 affronte la difficulté que tout le traité a rendue aiguë : {teal}« Comment donc, puisque l'intelligible est séparé, l'âme vient-elle dans le corps ? »{/teal} (l. 1). Plotin répond en peu de lignes, mais sa réponse commande les traités qui suivront sur la descente de l'âme.

    __**Il faut distinguer deux niveaux.**__ {green}« Tout ce qui est intellect pur »{/green} mène sans cesse, impassible, une vie seulement intellective et {teal}« reste toujours là-bas »{/teal}, {teal}« car il n'a ni tendance ni désir »{/teal} (l. 2-4) : {amber}rien ne lui manque, il n'a rien à chercher hors de lui{/amber}. Impassibilité et tendance sont des notions stoïciennes ; Plotin les reprend pour définir {coral}**la partie de toute âme qui, « intellect pur », ne quitte pas l'intelligible**{/coral} et __demeure auprès de l'Intellect, son principe__. Ce qui vient {teal}« tout de suite après cet intellect »{/teal} comporte {teal}« en plus un désir »{/teal}, et c'est ce __désir__ qui le porte {teal}« pour ainsi dire plus loin »{/teal} (l. 4-6). Ce sujet du désir est **l'âme de l'univers**, et plus précisément sa partie appelée « nature », qui produit ce qui la suit. Le désir y est un {violet}ajout{/violet} : c'est lui qui fait passer du premier niveau au second.

    __**Ce désir n'est pas un manque, mais une fécondité.**__ Ce qui comporte ce désir veut {green}« produire un ordre conforme à ce qu'il a vu dans l'intellect »{/green} : {yellow}il s'efforce de produire, « comme s'il était gros des intelligibles et qu'il ressentait les douleurs de l'enfantement », et il fabrique{/yellow} (l. 6-8). L'image vient du {sky}*Banquet*{/sky} (206c-e), où l'on enfante dans le beau ; Plotin la rapporte à la fabrication du monde du {sky}*Timée*{/sky}, et __donne ainsi à l'âme le rôle que Platon réservait au démiurge__. **L'âme ne descend pas parce que le corps l'attire, mais** {coral}**parce qu'elle est pleine de ce qu'elle a contemplé**{/coral} __et veut le faire exister ailleurs,__ {yellow}__comme un architecte veut voir bâtie la maison qu'il a conçue__{/yellow}. Ce désir reste pourtant la marque d'un rang second : l'intellect, qui n'en a pas, n'a rien à produire hors de lui pour être ce qu'il est.

    __**L'âme gouverne de l'extérieur avec l'âme du monde, ou s'isole dans une partie.**__ Plotin passe alors de l'{violet}âme du monde{/violet} à {teal}« cette âme »{/teal}, l'{violet}âme particulière{/violet}, {teal}« tendue par ce sérieux effort qui s'exerce dans le sensible »{/teal}, que le traité 6 (IV, 8) montrera de même __gouvernant d'abord avec l'âme du monde, puis s'isolant__.

    - {green}Avec l'âme de l'univers{/green}, l'âme {teal}« domine ce qu'elle gouverne de l'extérieur et [...] prend soin de l'univers »{/teal} (l. 8-10).
    - {pink}Quand elle souhaite gouverner une partie{/pink}, {teal}« elle se trouve isolée et elle en vient à se trouver dans cette partie »{/teal}, {coral}« sans pourtant appartenir tout entière au corps, mais en gardant quelque chose d'extérieur à lui »{/coral} (l. 10-13).

    Dans les deux cas, **son intellect n'est pas affecté par le corps** (l. 13-14).

    __**La descente n'est que partielle.**__ L'âme se trouve {teal}« tantôt __dans un corps__ et tantôt __hors d'un corps__ »{/teal} (l. 14-15). {teal}« Prenant son élan à partir des réalités premières, elle s'avance jusqu'aux réalités de troisième rang, celles d'ici-bas »{/teal} (l. 15-16), formule de la *Lettre II* attribuée à Platon. Et c'est par elle que l'intellect, {teal}« qui reste à la même place »{/teal}, {teal}« remplit toutes choses de beauté et les met en ordre »{/teal} (l. 16-19), {coral}« réalité immortelle qui utilise une réalité immortelle, dans la mesure où, parce qu'il est toujours le même, l'intellect perdurera en une activité sans fin »{/coral}.

    __**Le retour à la question du traité.**__ Le chapitre n'est pas une digression : il montre que {amber}**la venue dans le corps ne compromet pas l'immortalité**{/amber}. La partie supérieure de l'âme ne descend pas ; même dans un corps, son intellect n'en est pas affecté ; et __l'âme est l'instrument d'un intellect dont l'activité ne cesse jamais, si bien qu'elle ne peut cesser non plus__.

    ! Ce chapitre ne règle pas toutes les difficultés de la descente : le traité 6 (IV, 8), *Sur la descente de l'âme dans les corps*, et les traités 27-29 (IV, 3-5) y reviendront longuement. L'âme qui s'isole dans une partie y deviendra l'âme qui « chute ».
