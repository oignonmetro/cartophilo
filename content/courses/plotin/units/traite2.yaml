- id: traite2-l12
  title: "L'âme purifiée se découvre divine (chap. 10)"
  notes: |-
    Le chapitre 10 répond à l'objection la plus naturelle contre l'immortalité de l'âme, celle qu'on tire du spectacle des âmes réelles, vicieuses et troublées. Plotin la renverse : ce qu'on voit, ce n'est pas l'âme, mais **ce qui s'est ajouté à elle**.

    **__L'objection.__** Si l'âme était divine et immortelle, la verrait-on si souvent lâche, injuste, emportée ? Plotin le dit lui-même : {red}« parce qu'ils voient chez la plupart des gens que l'âme a subi de multiples dommages, ils ne la conçoivent pas comme une réalité divine ou immortelle »{/red} (l. 24-26).

    **__La réponse est une règle de méthode.__** {teal}« Il faut examiner la nature d'une chose en particulier en la considérant à l'état pur, dans la mesure où ce qui y est ajouté constitue toujours un obstacle à la connaissance de ce à quoi cela a été ajouté »{/teal} (l. 26-29). On ne juge pas un tableau de maître à la suie qui le couvre. D'où la consigne : {teal}« Prenons l'âme, non pas celle qui se trouve dans un corps, qui est chargée de désirs irrationnels et d'élans agressifs, et qui a accueilli d'autres affections, mais celle qui s'est purifiée de tout cela et qui, dans toute la mesure du possible, n'a plus rien de commun avec le corps »{/teal} (l. 7-10).

    **__Ce que montre l'âme purifiée.__** Que les maux sont {teal}« des concrétions pour l'âme et qu'ils viennent de l'extérieur »{/teal} (l. 10-11), {yellow}comme les coquillages et les algues qui recouvrent la statue du dieu marin Glaucos{/yellow} dans la {sky}*République*{/sky} (X) ; et que, sitôt purifiée, la réflexion et les autres vertus sont présentes en elle.

    **__L'argument de la parenté.__** {teal}« La réflexion et la vertu véritable sont des choses divines et elles ne sauraient advenir en une réalité vile et mortelle »{/teal} ; il faut donc que ce en quoi elles se trouvent soit divin, {teal}« en raison de sa parenté et de sa communauté de réalité avec elles »{/teal} (l. 15-18). Le principe : on ne reçoit que ce à quoi on est apparenté, comme seul un miroir poli, et non un morceau de bois, peut recevoir l'image du soleil.

    **__L'expérience de soi.__** Que celui qui s'est dépouillé se regarde : {teal}« il croira qu'il est immortel, quand il se contemplera lui-même installé dans l'intelligible et le pur »{/teal} (l. 30-32). Il se verra **intellect**, concevant {teal}« par le moyen de ce qui est éternel »{/teal} ce qui est éternel, et trouvera du bon dans le vers d'{sky}Empédocle{/sky} : {teal}« Salut à vous, je suis un dieu immortel »{/teal} (l. 37-38).

    **__Les statues intérieures.__** L'âme n'a pas à sortir d'elle-même pour voir la tempérance et la justice : elle les voit {teal}« en elle-même »{/teal}, {yellow}« comme s'il s'agissait de statues divines dressées en elle, qu'elle voit recouvertes de vert-de-gris par le temps mais dont elle s'emploie à enlever les impuretés »{/yellow} (l. 44-46).

    **__L'or animé.__** {teal}« C'est comme si l'or avait une âme et se mettait à se débarrasser de toute la boue qui le recouvre »{/teal} : il ignorait sa valeur, il la découvre, et comprend qu'il n'a besoin d'aucune beauté d'emprunt (l. 46-51). L'image dit trois choses : la laideur était un ajout, la valeur était là depuis toujours, et la purification est une découverte de soi.

    ! La purification ne rend pas l'âme divine : elle découvre qu'elle l'était. Rien ne lui est ajouté, on lui retire ce qui la cachait.

    ! Le vers d'Empédocle ne fait pas du moi empirique un dieu : c'est l'âme purifiée, qui se voit intellect, qui peut le reprendre.
