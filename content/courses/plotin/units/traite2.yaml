- id: traite2-plan-nature
  title: "Repérage : la nature de l'âme (chap. 9-12)"
  notes: |-
    Les chapitres 9 à 12 disent enfin {green}**ce qu'est l'âme**{/green}, maintenant qu'on sait ce qu'elle ne peut pas être. Ils vont du principe à ses conséquences : l'âme a la vie par elle-même (chap. 9) ; on le voit en la regardant purifiée, divine (chap. 10) ; ce qui a la vie par soi ne peut la perdre (chap. 11), ni périr d'aucune manière (chap. 12).

    | Moment | Lieu | Ce qui s'y joue |
    | la vie par soi | chap. 9 | l'âme a la vie par elle-même, car elle est principe du mouvement, et ce qu'on a par soi ne se perd pas |
    | l'âme purifiée | chap. 10 | l'âme est divine, car, purifiée de ses ajouts, elle reçoit la réflexion et la vertu, qui sont divines |
    | l'indestructible | chap. 11-12 | l'âme ne peut périr, car elle n'est ni un composé, ni une quantité, ni une matière qui recevrait la vie |
