- id: traite2-l9
  title: "Qualités, mélange total, ordre des principes (chap. 8¹-8³)"
  notes: |-
    Les chapitres 8¹ à 8³ achèvent la réfutation des stoïciens en s'attaquant à leur physique : même les qualités des corps, même le mélange, même la genèse du monde supposent l'incorporel.

    **Les corps n'agissent que par des puissances incorporelles** (chap. 8¹). Les stoïciens rangent l'âme parmi les corps actifs, avec ce qui chauffe ou pousse. Mais d'abord, l'âme a d'autres puissances (penser, sentir, raisonner, désirer, prévoir) ; ensuite, même la chaleur d'un corps est une puissance incorporelle en lui. La preuve : {teal}« la douceur du miel n'est pas moins douceur en chaque partie que dans le tout »{/teal}. Coupez une goutte de miel en deux : vous avez deux moitiés de la quantité, mais pas deux moitiés de douceur. Une qualité n'est donc pas une quantité, ni un corps. De même, {red}si les puissances étaient des corps, les plus grandes masses auraient les plus grandes puissances{/red} ; or c'est souvent l'inverse (un peu de poison tue un homme). Et la même matière produit des choses toutes différentes selon les **raisons incorporelles** qu'elle reçoit.

    **Condition n'est pas cause.** On meurt quand le souffle et le sang nous quittent, disent les stoïciens. Sans doute ne vit-on pas sans eux, ni sans bien d'autres choses ; mais rien de cela n'est l'âme.

    **Le mélange total est impossible** (chap. 8²). Une âme-corps présente dans tout le corps y serait mélangée. Ou bien le mélange abolit les ingrédients, comme le doux et l'amer : l'âme ne serait plus en acte, nous n'aurions plus d'âme. Ou bien c'est le **« mélange total »** de Chrysippe (une goutte de vin se répand dans toute la mer) : deux corps occupant exactement le même lieu, chacun pénétrant l'autre jusque dans ses plus petites parties. Mais pénétrer un corps partout, c'est le diviser en points, donc en une infinité de parties **en acte** : c'est impossible. Or l'âme pénètre tout le corps : elle est donc incorporelle.

    **Les stoïciens mettent le monde à l'envers** (chap. 8³). Pour eux, un même souffle est d'abord « nature » (dans la plante), puis devient « âme » en se refroidissant à la naissance, et l'intellect vient en dernier. Ils font donc venir **le meilleur du pire**. Or, Aristote l'a montré : {green}ce qui est en puissance ne passe à l'acte que par quelque chose qui est déjà en acte{/green}. Si l'intellect venait en dernier, rien n'aurait jamais pu actualiser le reste. Il faut donc renverser l'ordre : l'intellect d'abord, puis l'âme, puis la nature, puis les corps.

    ! « Puissance » a ici le sens d'Aristote : capacité en attente d'être actualisée. C'est pourquoi elle exige un acte antérieur.
  points:
