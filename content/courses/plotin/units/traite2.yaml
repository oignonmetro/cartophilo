id: traite2
title: "Traité 2 (IV, 7) : Sur l'immortalité de l'âme"
subtitle: "L'âme n'est pas un corps"
icon: compass
color: sky
lessons:
- id: traite2-l1
  title: "Repérage : le plan du traité 2"
  notes: |-
    Le traité 2 va de la question (__sommes-nous immortels ?__) à la réponse ({green}__nous sommes notre âme, et elle est immortelle__{/green}) par un long détour : la réfutation de {red}ceux qui font de l'âme un corps ou quelque chose du corps{/red}.

    **Le chapitre** {teal}**1**{/teal} **pose la question** « __sommes nous immortels ?__ » et la ramène à une autre : que sommes-nous ? une âme ou un corps ? **Les chapitres** {teal}**2 à 8³**{/teal} **réfutent** {red}**l'âme-corps**{/red} : les atomes des {red}épicuriens{/red}, puis surtout le souffle des {red}stoïciens{/red}, attaqué argument par argument (la vie, l'ordre, la croissance, la sensation, la douleur, la pensée, la vertu, le mélange). **Les chapitres** {teal}**8⁴ et 8⁵**{/teal} **écartent** {pink}**l'âme comme forme du corps**{/pink} : l'harmonie des pythagoriciens, l'entéléchie d'Aristote. **Les chapitres** {teal}**9 à 12**{/teal} **disent** {green}**ce qu'est l'âme**{/green} : une réalité qui a la vie par elle-même, divine, indestructible. **Les chapitres** {teal}**13 à 15**{/teal} **répondent à la difficulté qui en naît** : comment une telle réalité vient-elle dans un corps ?

    | Mouvement | Lieu | Ce qui s'y joue |
    | poser le problème anthropologique et définir le « soi » véritable | chap. 1 | le corps n'est qu'un instrument mortel et composé, tandis que l'essence véritable de l'homme réside exclusivement dans son âme |
    | réfuter le matérialisme (épicuriens et stoïciens) | chap. 2-8³ | une réalité corporelle, étant divisible, passive et quantitative, est par nature incapable de générer la vie, la sensation ou la pensée |
    | écarter les fausses définitions incorporelles (pythagoriciens et Aristote) | chap. 8⁴-8⁵ | l'âme n'est ni une « harmonie » résultant de l'assemblage des éléments matériels, ni une « entéléchie » indissociable d'un corps organique |
    | fonder la véritable nature divine et intelligible de l'âme | chap. 9-12 | l'âme est une réalité incorporelle, divine et indivisible, qui possède la vie par elle-même et demeure par conséquent immuable et indestructible |
    | expliquer l'incarnation et garantir la survie séparée | chap. 13-15 | l'âme anime et ordonne le corps sans s'y emprisonner ni s'y diviser, conservant sa subsistance propre et sa survie individuelle éternelle après la disparition de l'enveloppe corporelle |

    ! La réfutation occupe l'essentiel du traité : Plotin ne dit ce qu'est l'âme (chap. 9-12) qu'après avoir montré ce qu'elle ne peut pas être.
