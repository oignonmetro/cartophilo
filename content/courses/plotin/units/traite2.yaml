- id: traite2-l2
  title: "Nous sommes notre âme : une réalité autarcique"
  notes: |-
    **Plotin justifie l'hypothèse platonicienne selon laquelle c'est l'âme qui définit l'homme, et le corps est l'instrument de l'âme immortelle qui le gouverne** (comme le disait l'*Alcibiade*). Les deux premiers chapitres établissent que l'âme, ce que nous sommes en propre, est immortelle, et donc distincte du corps.

    - **L'erreur commune des atomistes et des stoïciens** est d'avoir défini l'âme comme un corps : ils ne peuvent plus rendre compte de la vie ni des fonctions du vivant (locomotion, sensation, pensée).
    - Plotin retrouve la leçon du *Phédon* (102a-105e) et de la *République* (X, 608c-612a) : l'âme est essentiellement vivante et ne peut mourir. Il va plus loin : elle est vivante **« par elle-même »**, et même elle « est par elle-même ».
    - L'âme est donc une **réalité autarcique** : comme l'Un et l'Intellect, elle vérifie l'axiome selon lequel une réalité (`οὐσία`) véritable est **cause de sa propre existence**. Le corps, lui, est produit et doit être animé.

    **L'âme ne travaille pas la matière comme un artisan :** refusant le paradigme du démiurge, Plotin place entre l'âme et la matière les **« formules rationnelles » (`λόγοι`)** qui, issues de l'âme, s'avancent dans la matière pour l'informer. L'âme instruit la matière comme un **pédagogue** forme son élève.

    | Niveau | Ce qu'il est |
    | la matière | parfaitement indéterminée |
    | les corps | formés par les raisons de l'âme |
    | l'âme | la cause du sensible dans sa totalité |

    ! La raison qui ordonne le monde n'est pas corporelle et immanente à la nature, comme chez les stoïciens : elle est la détermination que l'âme du monde impose à la matière.
  points:
