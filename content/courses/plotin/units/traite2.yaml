- id: traite2-l12
  title: "L'âme est apparentée au divin (chap. 10, l. 1-29)"
  notes: |-
    Le chapitre 10 tire des chapitres 2 à 8⁵ leur conséquence positive : {green}l'âme est apparentée à la nature divine et éternelle{/green}. Plotin l'établit ensuite d'une seconde manière, en regardant notre propre âme purifiée, et répond à l'objection la plus naturelle, celle qu'on tire du spectacle des âmes réelles, vicieuses et troublées : ce qu'on voit, ce n'est pas l'âme, mais **ce qui s'est ajouté à elle**.

    __**Ce qui n'est pas un corps est apparenté au divin**__ (l. 1-3). {teal}« Qu'on ait démontré qu'elle n'est nullement un corps rend évident le fait que l'âme est __apparentée à la nature divine et éternelle__ »{/teal}. Pourquoi « évident » ? Parce que le chapitre 9 a partagé le réel en deux : les corps, qui naissent et périssent, et {teal}« l'autre nature, celle qui a l'être par elle-même »{/teal}, à laquelle appartient le divin. **Exclure l'âme des corps, c'est déjà la ranger de l'autre côté.** Plotin le marque en lui appliquant les mots dont le {sky}*Phèdre*{/sky} (247c) décrit l'être qui se tient au-delà du ciel : {teal}« elle n'a ni forme, ni couleur et elle ne peut être touchée »{/teal}. L'âme porte les mêmes négations que l'intelligible ; elle en est donc parente.

    __**Le divin se reconnaît à une vie bonne et réfléchie**__ (l. 3-7). La seconde preuve part d'une prémisse que tout platonicien accorde, tirée de la {sky}*République*{/sky} (VII, 521a) : {teal}« tout ce qui est divin et qui est véritablement jouit d'une __vie bonne et réfléchie__ »{/teal}. Le divin ne se définit pas d'abord par sa puissance ou sa durée, mais par la **qualité de sa vie** : il pense et il est bon. Pour savoir si l'âme est divine, il suffit donc de regarder si elle vit ainsi, et Plotin veut {teal}« prendre pour point de départ de notre enquête notre propre âme »{/teal} : c'est de l'intérieur, et non par ouï-dire, qu'on peut le constater. Mais laquelle de nos âmes ?

    __**L'objection.**__ Si l'âme était divine et immortelle, la verrait-on si souvent lâche, injuste, emportée ? Plotin explique lui-même d'où vient l'incrédulité : {teal}« si tout homme était tel, ou s'il y avait une multitude d'âmes telles, personne ne serait incrédule au point de ne pas croire que ce qui en l'homme est l'âme est absolument immortel »{/teal} (l. 21-24) ; {red}« mais en réalité, parce qu'ils voient chez la plupart des gens __que l'âme a subi de multiples dommages__, ils ne la conçoivent pas comme une réalité divine ou immortelle »{/red} (l. 24-26). L'objection juge l'âme sur ce qu'elle est le plus souvent, non sur ce qu'elle est.

    __**La réponse est une règle de méthode.**__ {teal}« Il faut examiner la nature d'une chose en particulier en la considérant à l'état pur, dans la mesure où __ce qui y est ajouté constitue toujours un obstacle à la connaissance__ de ce à quoi cela a été ajouté »{/teal} (l. 26-29). {yellow}On ne juge pas un tableau de maître à la suie qui le couvre{/yellow}. D'où la consigne : {teal}« Prenons __l'âme__, non pas celle qui se trouve dans un corps, qui est chargée de désirs irrationnels et d'élans agressifs, et qui a accueilli d'autres affections, mais celle __qui s'est purifiée__ de tout cela et qui, dans toute la mesure du possible, __n'a plus rien de commun avec le corps__ »{/teal} (l. 7-10).

    __**Ce que montre l'âme purifiée.**__ Que {pink}les maux{/pink} sont {teal}« des concrétions pour l'âme et qu'ils viennent de l'extérieur »{/teal} (l. 10-11), {yellow}comme les coquillages et les algues qui recouvrent la statue du dieu marin Glaucos{/yellow} dans la {sky}*République*{/sky} (X) ; et que, sitôt purifiée, la réflexion et les autres vertus, {teal}« qui lui appartiennent en propre »{/teal} (formule du {sky}*Banquet*{/sky}, 209a), sont présentes en elle.

    __**La conclusion de la seconde preuve.**__ Le divin vit d'une vie bonne et réfléchie ; or l'âme purifiée possède la réflexion et la vertu, non comme un bien emprunté, mais **comme le sien** ; donc, {coral}« chaque fois qu'elle revient à elle-même, comment n'appartiendrait-elle pas à cette nature dont nous déclarons qu'elle est celle de tout ce qui est divin et éternel ? »{/coral} (l. 13-15). Se purifier, c'est **revenir à soi**.

    **__L'argument de la parenté.__** {teal}« La réflexion et la vertu véritable sont des choses divines et elles ne sauraient advenir en une réalité vile et mortelle »{/teal} ; il faut donc que ce en quoi elles se trouvent soit divin, {teal}« en raison de sa parenté et de sa communauté de réalité avec elles »{/teal} (l. 15-18). Le raisonnement tient en trois temps : __la réflexion et la vertu sont divines__ ; __ce qui est vil et mortel ne peut recevoir le divin__, car on ne reçoit que ce à quoi on est apparenté ; __or elles se trouvent dans l'âme purifiée__. Elle est donc divine. On peut penser au miroir poli, qui seul, et non un morceau de bois, reçoit l'image du soleil.

    __**L'âme pure diffère peu des réalités de là-bas**__ (l. 18-21). {teal}« Quiconque parmi nous est pur s'éloignerait peu, pour ce qui est de son âme, des choses qui sont là-bas, car elle ne leur serait inférieure que dans la mesure où elle est dans un corps »{/teal}. Ce qui sépare l'âme des intelligibles n'est donc pas **sa nature**, mais **sa situation** : le corps auquel elle est jointe, comme le chapitre 9 l'avait dit de tout ce qui est {teal}« mélangé à quelque chose d'inférieur »{/teal}.
