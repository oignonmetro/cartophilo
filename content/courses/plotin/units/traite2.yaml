- id: traite2-l9
  title: "Les corps n'agissent que par des puissances incorporelles (chap. 8¹)"
  notes: |-
    Le chapitre 8¹ ouvre la dernière série d'arguments contre les stoïciens : après avoir montré qu'un corps ne peut ni vivre, ni sentir, ni penser par lui-même, Plotin attaque leur __**physique**__. Il montre que **même** __**ce que font les corps** (chauffer, refroidir, pousser, peser) ne s'explique pas par ce qu'ils ont de corporel__, et que l'âme, à plus forte raison, n'est pas un corps.

    **La doctrine visée.** Les {red}stoïciens{/red} posent deux principes, tous deux corporels : la {pink}matière{/pink}, purement {pink}passive{/pink} et {pink}sans qualité{/pink}, et un {amber}principe actif{/amber}, le *logos* ou dieu, qui est un {amber}souffle igné{/amber}. Ils rangent l'âme {red}« au rang de ce qui est actif »{/red}, avec ce qui chauffe ou pousse (l. 1-3).

    **__Premier argument : ils se trompent deux fois.__** D'abord, {teal}« les corps eux-mêmes ont ces activités grâce aux puissances incorporelles qui se trouvent en eux »{/teal} (l. 4-5) : ce qui chauffe dans le feu, ce n'est pas sa masse, c'est sa chaleur. Ensuite, l'âme n'a même pas ces puissances-là : elle est pourvue {teal}« d'intellection, de sensation, de raisonnement, de désir, d'une prévoyance réfléchie et admirable »{/teal} (l. 6-8), qui exigent {teal}« une réalité d'un autre ordre »{/teal}. **D'où la formule** : {teal}« quand ils font passer les puissances des réalités incorporelles dans les corps, ils ne laissent plus aucune puissance à ces derniers »{/teal} (l. 9-11). Autrement dit, si l'on fait de la puissance un morceau de corps, il ne reste plus dans le corps que de la masse, et la masse, passive par définition, ne fait rien : en voulant tout donner aux corps, on leur retire ce qui les faisait agir.

    __**Deuxième argument : la qualité n'est pas un corps.**__ Le raisonnement part d'une concession des stoïciens que font les stoïciens :

    - ils admettent __« que la qualité est différente de la quantité, que tout corps a une quantité, mais qu'il n'est pas vrai que tout corps ait encore une qualité »__ (la matière en est dépourvue) ;
    - ils doivent donc admettre {coral}« que, parce qu'elle est différente de la quantité, la qualité est différente du corps »{/coral} (l. 12-17).

    Plotin le confirme par une expérience. Un corps divisé perd ce qu'il était (sa quantité), alors que {teal}« la qualité reste entièrement la même dans chacune des parties d'un corps qui a été morcelé »{/teal} (l. 19-21). Plotin prend l'exemple du {yellow}miel{/yellow} : {teal}« la douceur du miel n'est pas moins douceur en chaque partie que dans le tout »{/teal} (l. 21-22). Coupez une goutte en dix : vous avez dix fois moins de miel, mais pas dix fois moins de douceur. Plotin renvoie ici au chapitre 5, où il a établi la même chose de l'âme (la partie identique au tout).

    **__Troisième argument : la puissance ne suit pas la masse.__** {red}Si les puissances étaient des corps, les plus fortes auraient les plus grandes masses{/red} (l. 23-25). Or l'expérience montre l'inverse : de grandes masses ne peuvent presque rien, et {green}« les petites et même les minuscules »{/green} ont les plus grandes puissances (une étincelle embrase une forêt, quelques gouttes de poison tuent). La production doit donc être attribuée {teal}« à quelque chose qui est dépourvu de grandeur »{/teal} (l. 27-28).

    **__Quatrième argument : la matière est partout la même.__** Les stoïciens disent que la matière est un corps, partout identique. Or elle produit des choses toutes différentes {teal}« en recevant des qualités »{/teal} : la différence ne vient donc pas d'elle, mais de ce qu'elle reçoit, à savoir {teal}« des raisons immatérielles et incorporelles »{/teal} (l. 28-31). Comme une même argile devient cheval ou homme selon la forme que le sculpteur lui donne.

    **__Cinquième argument : une condition n'est pas une cause.__** On meurt, disent-ils, quand le souffle et le sang nous quittent. Plotin l'accorde : {teal}« il n'est pas possible de continuer à vivre sans eux, ni sans bien d'autres choses encore ; mais rien de tout cela n'est l'âme »{/teal} (l. 32-34). On meurt aussi sans nourriture, et personne ne dit que l'âme est du pain. De plus, {teal}« ni le souffle ni le sang ne peuvent se répandre en toutes choses, alors que l'âme le peut »{/teal} (l. 35-36).

    ! Plotin ne nie pas que les corps agissent : il dit que ce qui agit en eux est incorporel (une qualité, une raison), et que l'âme ne se range même pas parmi ces puissances physiques.
