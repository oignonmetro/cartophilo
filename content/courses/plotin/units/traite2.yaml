- id: traite2-l4
  title: "Harmonie et entéléchie : les chapitres 8⁴ et 8⁵"
  notes: |-
    **La même exigence de séparer l'âme et le corps commande la réfutation des définitions pythagoricienne et aristotélicienne de l'âme.** Selon les stoïciens, âme et corps sont intimement mélangés dans le vivant : c'est risquer de ne plus distinguer leurs puissances, ni même de rendre compte des corps (chap. 8¹).

    - **Chapitre 8⁴** : l'âme n'est pas une **« harmonie »**, comme le voulaient les pythagoriciens ; la réfutation est rapide.
    - **Chapitre 8⁵** : l'âme n'est pas l'**« entéléchie »** (la réalisation) du corps, comme le voulait Aristote. La réfutation est plus difficile et ambiguë, car Plotin doit beaucoup à Aristote : il reprend les fonctions de l'âme décrites dans le *De l'âme*.

    **Les aristotéliciens ont au moins le mérite d'accorder qu'une partie de l'âme existe séparément du corps et est immortelle.** Mais il faudrait admettre que l'âme n'est en aucune de ses parties la « forme d'un corps » : elle est la réalité incorporelle qui produit tous les corps en informant la matière.

    **Pourquoi des chapitres 8¹ à 8⁵ ?** Ils manquaient dans les manuscrits sur lesquels travaillait **Marsile Ficin**, auteur de la première numérotation des chapitres. On les connaît par certains manuscrits et par la *Préparation évangélique* d'**Eusèbe** (XV, 22 pour les quatre premiers, XV, 10 pour le dernier).

    ! L'ordre du texte est 8, 8¹, 8², 8³, 8⁴, 8⁵, puis 9 : la numérotation trahit une lacune des manuscrits, pas un ordre de lecture.
