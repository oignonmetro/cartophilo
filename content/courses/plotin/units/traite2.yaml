  title: "Ni mélange total, ni âme née du froid (chap. 8²-8³)"
  notes: |-
    Les chapitres 8² et 8³ achèvent la réfutation des stoïciens sur deux points de leur physique : la manière dont l'âme serait présente au corps (**le mélange**), et la manière dont elle naîtrait (**le refroidissement**). Dans les deux cas, la thèse matérialiste aboutit à une absurdité, et la conclusion du chapitre 8³ referme tout le premier mouvement : {coral}« l'âme n'est ni comme un souffle ni comme un corps »{/coral}.

    **__Si l'âme était un corps présent partout dans le corps, elle y serait mélangée__** (chap. 8², l. 1-2). Deux cas se présentent.

    - Hypothèse 1, {red}le mélange ordinaire{/red} : dans un mélange de corps, aucun ingrédient ne reste en acte, {yellow}« tout comme lorsqu'on mélange le doux et l'amer, le doux n'existe plus »{/yellow}. L'âme mélangée {teal}« ne serait plus en acte mais seulement en puissance, perdant ainsi son être même »{/teal}, et {red}« nous n'aurions plus d'âme »{/red} (l. 2-6). Or l'âme anime, sent et pense sans cesse.
    - Hypothèse 2, {red}le « mélange total »{/red} de Chrysippe : deux corps occupent exactement le même lieu, chacun pénétrant l'autre jusque dans ses moindres parties (une goutte de vin se répand dans toute la mer). Plotin montre que c'est impossible : {teal}« ce qui est jeté dans le mélange pénètre à travers tout, même à travers ce qui est le plus petit, ce qui précisément est impossible, car le plus grand deviendra égal au plus petit »{/teal} (l. 12-15). Et pour qu'aucun intervalle ne reste non pénétré, il faudrait {teal}« que la division du corps se fasse suivant des points »{/teal} : le corps serait divisé à l'infini **en acte**, et non plus seulement en puissance (l. 16-20).

    **D'où la conclusion** : {teal}« Il est donc impossible qu'un corps en pénètre un autre sur le mode du mélange total, alors que l'âme pénètre en totalité. Par conséquent, elle est incorporelle »{/teal} (l. 20-21). Le principe sous l'argument vient d'Aristote : un continu est divisible à l'infini en puissance, jamais en acte.

    **__L'âme ne naît pas du froid__** (chap. 8³, l. 1-5). Les stoïciens disent qu'un même souffle, d'abord {violet}« nature »{/violet} dans l'embryon (comme dans une plante), devient {violet}« âme »{/violet} à la naissance, lorsqu'il est exposé au froid de l'air et s'y affine. Plotin répond par un fait : {teal}« plusieurs vivants naissent dans la chaleur et ils possèdent une âme qui n'a pas été refroidie »{/teal} (l. 3-5) ; il pense sans doute aux astres, vivants nés dans le feu.

    **__Ils mettent le monde à l'envers__** (l. 5-14). Chez eux, la tension du souffle est « tenue » (*hexis*) dans les pierres, « nature » dans les plantes, « âme » dans les animaux, et l'intellect vient en dernier, puisqu'il vient de l'âme. {red}« Les voilà donc qui fabriquent d'abord l'inférieur »{/red} : le meilleur naîtrait du pire. Plotin rétablit l'ordre : si l'intellect est premier, il faut {green}« fabriquer l'âme tout de suite après, puis ensuite la nature »{/green}, et toujours l'inférieur à la suite (l. 9-11).

    **__Pourquoi cet ordre est nécessaire : l'acte précède la puissance__** (l. 13-22). L'argument vient d'Aristote (*Métaphysique*, Θ, 8) :

    - {teal}« Si ce qui est en puissance venait à l'existence avant que ce qui est en acte, c'est-à-dire l'intellect, n'existe, alors ce qui est en puissance ne pourrait pas passer à l'acte »{/teal}, car {teal}« qu'est-ce qui l'amènera à l'acte s'il n'y a rien d'autre que lui qui lui soit antérieur ? »{/teal} ;
    - s'il y passait de lui-même, ce ne serait encore qu'en {teal}« fixant les yeux sur quelque chose qui est non pas en puissance, mais en acte »{/teal}, et ce modèle, objet de son désir, lui serait supérieur ;
    - {coral}« Par conséquent, le meilleur, qui possède une nature différente du corps et qui est toujours en acte, est antérieur. Par conséquent, l'âme et l'intellect sont antérieurs à la nature. Par conséquent, l'âme n'est ni comme un souffle ni comme un corps. »{/coral}

    Plotin prend lui-même l'image du regard ; on peut penser à l'élève qui ne devient médecin que parce que la médecine existe déjà en acte chez ses maîtres.

    ! Ce n'est pas l'ordre du développement d'un individu (l'enfant pense après avoir grandi) qui est en jeu, mais l'ordre de dépendance : ce qui actualise vient avant ce qui est actualisé. L'Un n'est d'ailleurs pas mentionné ici : la hiérarchie s'arrête à l'intellect, puis à l'âme, à la nature et aux corps.
