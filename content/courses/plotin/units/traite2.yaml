title: "Traité 2 (IV, 7) : Sur l'immortalité de l'âme"
subtitle: "L'âme n'est pas un corps"
icon: compass
color: sky
lessons:
- id: traite2-l1
  title: "Repérage : le plan du traité 2"
  notes: |-
    Le traité 2 va de la question (sommes-nous immortels ?) à la réponse (nous sommes notre âme, et elle est immortelle) par un long détour : la réfutation de ceux qui font de l'âme un corps ou quelque chose du corps.

    **Le chapitre 1 pose la question** et la ramène à une autre : qu'est-ce que l'âme ? **Les chapitres 2 à 8³ réfutent l'âme-corps** : les atomes des épicuriens, puis surtout le souffle des stoïciens, attaqué argument par argument (la vie, l'ordre, la croissance, la sensation, la douleur, la pensée, la vertu, le mélange). **Les chapitres 8⁴ et 8⁵ écartent l'âme comme forme du corps** : l'harmonie des pythagoriciens, l'entéléchie d'Aristote. **Les chapitres 9 à 12 disent ce qu'est l'âme** : une réalité qui a la vie par elle-même, divine, indestructible. **Les chapitres 13 à 15 répondent à la difficulté qui en naît** : comment une telle réalité vient-elle dans un corps ?

    | Moment | Lieu | Ce qui s'y joue |
    | sommes-nous immortels ? | chap. 1 | nous sommes notre âme ; le corps se dissout |
    | la vie et les éléments | chap. 2 | aucune composition de corps ne produit la vie |
    | atomes et souffle | chap. 3 | une juxtaposition ne fait pas une âme ; la matière ne s'anime pas seule |
    | la « manière d'être » | chap. 4 | le souffle « disposé » est une raison ; l'âme produit des effets contraires |
    | croissance et quantité | chap. 5 | la partie de l'âme est identique au tout |
    | la sensation | chap. 6 | ce qui sent doit être un, comme un centre |
    | la douleur | chap. 7 | la douleur du doigt ne se transmet pas de proche en proche |
    | la pensée et la vertu | chap. 8 | penser, c'est saisir sans le corps |
    | qualité et quantité | chap. 8¹ | la douceur du miel est entière en chaque partie |
    | le mélange total | chap. 8² | un corps ne peut en pénétrer un autre en totalité |
    | la nature avant l'âme ? | chap. 8³ | la puissance ne passe à l'acte que par un acte antérieur |
    | l'harmonie | chap. 8⁴ | il faut un musicien avant l'harmonie |
    | l'entéléchie | chap. 8⁵ | l'âme est avant d'appartenir au corps |
    | la vie par soi | chap. 9 | l'âme est principe du mouvement et a la vie par elle-même |
    | l'âme purifiée | chap. 10 | les maux sont des ajouts ; l'âme est divine |
    | l'indestructible | chap. 11-12 | ni dissoute, ni divisée, ni altérée |
    | la venue dans le corps | chap. 13 | l'âme produit un ordre sans quitter l'intelligible |
    | les autres âmes | chap. 14 | rien de ce qui vient de ce qui est ne périt |
    | la preuve par l'opinion | chap. 15 | oracles et culte des morts |

    ! La réfutation occupe l'essentiel du traité : Plotin ne dit ce qu'est l'âme (chap. 9-12) qu'après avoir montré ce qu'elle ne peut pas être.
