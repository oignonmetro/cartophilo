- id: traite2-l6
  title: "La croissance et le tout dans la partie (chap. 5)"
  notes: |-
    Le chapitre 5 montre qu'une âme-corps ne pourrait ni mouvoir de façons diverses, ni faire croître, ni rester la même, et que l'âme a une propriété qu'aucun corps n'a : __sa partie est identique au tout__. En bref, un corps est fondamentalement incapable d'être le principe premier de l'être et du mouvement.

    **Les mouvements** (l. 1-15). Un corps n'a qu'un mouvement, selon sa nature (la pierre tombe, le feu monte). Le vivant en a mille. On répond qu'ils viennent tantôt de **choix**, tantôt de **raisons** : très bien, mais ni le choix ni les raisons n'appartiennent au corps. La __matière corporelle__ est essentiellement {pink}passive{/pink}. Lorsqu'un corps se meut en tant que corps, il le fait par {pink}impulsion extérieure{/pink}, choc ou pesanteur. Le corps n'a de raison que celle qu'on lui a donnée. Si l'âme était un corps, elle aurait donc __besoin d'un autre corps pour la mettre en mouvement__, et celui-ci d'un autre encore, ce qui entraînerait une régression à l'infini. Il faut donc s'arrêter à un principe premier de mouvement qui soit incorporel.

    **La croissance.** Si __l'âme__ qui fait croître le corps était elle-même un corps, elle __devrait croître avec lui pour rester à sa mesure__ (le stoïcien Antipater le soutenait : l'âme augmente et diminue avec le corps). Il faudrait donc lui ajouter de la matière. Or ce qu'on ajoute est **soit une âme, soit un corps inanimé** : si c'est une âme, d'où vient-elle et comment partagera-t-elle les souvenirs et les opinions de la première ? Si c'est un corps inanimé, comment s'animera-t-il ? Et si l'âme perd et gagne sans cesse des parties comme le corps, **rien ne restera le même** : comment aurions-nous des souvenirs, comment reconnaîtrions-nous ce qui nous est familier ?

    **Le tout dans la partie** (l. 15-fin). Dans la seconde partie du chapitre, Plotin établit une distinction ontologique majeure entre la nature du corps et celle de l'âme à partir de la relation entre **la partie et le tout** :

    - Dans le corps (divisibilité quantitative) : La partie est toujours plus petite que le tout et séparée des autres parties (un bras ou une jambe n'est pas le corps entier).
    - **Dans l'âme (unité omniprésente)** : En l'âme incorporelle, **la partie est identique au tout**. L'âme ne se divise pas spatialement lorsqu'elle anime un corps étendu : elle est **présente tout entière dans chaque partie du corps** (dans le pied comme dans la main).

    Si l'âme était corporelle, elle serait fragmentée dans les différentes parties du corps et perdrait son unité fondamentale, ce qui rendrait impossible toute conscience centralisée et toute vie organique unifiée.

    **D'où la conclusion.** {teal}« Lorsque dans une chose la partie est identique au tout, la réalité de cette chose excède la quantité et doit nécessairement être elle-même dépourvue de quantité »{/teal}. {coral}« L'âme et les raisons sont donc dépourvues de quantité. »{/coral} L'âme est une qualité, non une quantité : comme une qualité, elle reste la même quand le corps diminue.

    ! « Tout entière en chaque partie » ne veut pas dire que l'âme se multiplie en copies : elle reste une, présente partout sans être répartie.
