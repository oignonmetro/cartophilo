- id: traite2-l13
  title: "La vie n'est pas reçue : l'âme ne peut la perdre (chap. 11)"
  notes: |-
    Le chapitre 11 tire la conséquence des chapitres 9 et 10 : {teal}« D'une telle réalité, quel homme de bon sens dirait, dans une discussion, qu'elle n'est pas immortelle ? »{/teal} (l. 1-2). Il précise **en quel sens l'âme a la vie**, et montre que, de quelque façon qu'on pense la vie, on arrive à quelque chose d'immortel.

    **__L'âme n'a pas la vie comme le feu sa chaleur.__** Plotin prend l'exemple du feu. Sa chaleur ne lui vient pas de l'extérieur ; et pourtant le feu peut disparaître, parce qu'il dépend du {yellow}bois, son matériau combustible{/yellow} : {teal}« c'est par celui-ci que le feu disparaîtra »{/teal} (l. 4-7), quand le combustible manque. {teal}« Mais l'âme ne possède pas la vie de cette façon, comme si elle était une matière sous-jacente ; c'est la vie qui est installée en elle qui fait qu'elle est l'âme »{/teal} (l. 7-9). Il n'y a pas, sous l'âme, un support qui pourrait s'épuiser et l'emporter avec lui : **la vie est ce qui la fait âme**.

    **__Trois façons de penser la vie, une seule conclusion__** (l. 9-17).

    - Hypothèse 1 : {green}la vie est une réalité{/green}, qui possède la vie par elle-même. C'est exactement ce que nous cherchons, l'âme, {teal}« et on admettra alors que cette chose est immortelle »{/teal}.
    - Hypothèse 2 : {coral}la vie est un composé{/coral}. Alors on la décomposera {teal}« jusqu'à ce que l'on parvienne à une chose immortelle qui se meut d'elle-même »{/teal}, comme l'âme du *Phèdre* : dans un mélange, il faut bien un élément qui anime les autres.
    - Hypothèse 3 : {red}« la vie est une affection venue de l'extérieur et acquise par la matière »{/red}. Alors ce d'où elle vient est immortel, {teal}« puisqu'elle ne peut recevoir le contraire de ce qu'elle apporte »{/teal} : c'est l'argument du *Phédon*, où le feu, qui apporte la chaleur, ne reçoit pas le froid ; ce qui apporte la vie ne reçoit pas la mort.

    {coral}Dans les trois cas, il y a au principe de la vie quelque chose d'immortel{/coral}, et {teal}« il n'y a qu'une nature qui vive en acte »{/teal} (l. 17).

    ! Le feu n'est pas ici l'image de l'âme, mais son contraire : le feu a sa chaleur par lui-même et périt pourtant, parce qu'il dépend d'une matière ; l'âme, elle, ne dépend d'aucune.
