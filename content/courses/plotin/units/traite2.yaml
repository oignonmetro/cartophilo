- id: traite2-l12
  title: "L'âme purifiée se découvre divine (chap. 10)"
  notes: |-
    Le chapitre 10 répond à l'objection la plus naturelle contre l'immortalité de l'âme, celle qu'on tire du spectacle des âmes réelles, vicieuses et troublées. Plotin la renverse : ce qu'on voit, ce n'est pas l'âme, mais ce qui s'est ajouté à elle.

    **L'objection.** Si l'âme était divine et immortelle, la verrait-on si souvent lâche, injuste, emportée ? Plotin le dit lui-même : {red}« parce qu'ils voient chez la plupart des gens que l'âme a subi de multiples dommages, ils ne la conçoivent pas comme une réalité divine ou immortelle »{/red}.

    **La réponse est une règle de méthode.** {teal}« Il faut examiner la nature d'une chose en particulier en la considérant à l'état pur »{/teal}, car ce qui s'y ajoute empêche de la connaître. On ne juge pas l'or à la boue qui le couvre, ni une statue au vert-de-gris. Il faut donc considérer l'âme non pas telle qu'elle est dans un corps, chargée de désirs et de colères, mais **purifiée**, autant que possible détachée du corps.

    **Ce que montre l'âme purifiée.** Que les maux sont des **« concrétions »** venues de l'extérieur, comme les coquillages et les algues qui recouvrent la statue du dieu marin Glaucos (*{sky}République{/sky}*, X) ; et que, sitôt purifiée, la réflexion et les vertus lui sont présentes. Or ces vertus sont divines, et elles ne peuvent habiter qu'une chose apparentée : {green}l'âme qui les reçoit est donc divine elle-même, par parenté avec elles.{/green}

    **L'expérience de soi.** Que celui qui s'est ainsi dépouillé se regarde : il se verra **intellect**, installé dans l'intelligible, voyant l'éternel par ce qu'il a d'éternel. Il trouvera du bon dans le vers d'Empédocle : **« Salut à vous, je suis un dieu immortel »**. Il ne cherchera pas la justice et la tempérance hors de lui : il les verra **en lui-même**, comme des statues divines qu'il débarrasse de leur vert-de-gris.

    **L'image de l'or animé.** {yellow}Si l'or avait une âme et se débarrassait de sa boue, il découvrirait enfin sa valeur{/yellow}, qu'il ignorait, et comprendrait qu'il n'a besoin d'aucune beauté d'emprunt. L'image dit trois choses : la laideur était un ajout, la valeur était là depuis toujours, et la purification est une découverte de soi.

    ! La purification ne rend pas l'âme divine : elle découvre qu'elle l'était. Rien ne lui est ajouté, on lui retire ce qui la cachait.
