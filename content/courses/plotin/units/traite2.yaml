- id: traite2-l8
  title: "Penser et être vertueux (chap. 8)"
  notes: |-
    Le chapitre 8 passe de la sensation à la pensée et à la vertu : si un corps ne peut même pas sentir, à plus forte raison ne peut-il ni penser ce qui n'a pas de grandeur, ni être juste.

    **Penser, c'est saisir sans le corps.** Sentir, c'est se servir du corps pour percevoir le sensible. Or, si penser se faisait aussi par le corps, ce serait juste sentir. Penser, c'est donc __percevoir sans le corps__, et {teal}« il faut à plus forte raison encore que l'être qui pense ne soit pas un corps »{/teal}.

    **Le divisible ne pense pas l'indivisible.** Les objets propres de l'intellect sont des réalités intelligibles, indivisibles et dépourvues de grandeur physique. Un corps étant par définition étendu et divisible, il est __incapable de saisir ce qui n'a aucune dimension ni grandeur spatiale__. Pour appréhender une réalité indivisible, le sujet pensant doit être lui-même **indivisible et purifié du corps**.

    Car si un corps étendu recevait un objet indivisible, __il le recevrait à travers ses propres parties spatiales__. {red}**L'objet intelligible se retrouverait morcelé et dispersé dans la matière.**{/red} Or, diviser le concept de Justice ou de Beauté en morceaux de matière revient à détruire l'idée elle-même. En outre, si **le corps** prétendait recevoir cet objet tout entier dans toute sa masse, il {red}**lui imposerait une extension spatiale et une grandeur physique**{/red}, __ce qui dénaturerait l'intelligible en le transformant en chose corporelle__.

    **Abstraire, c'est se séparer du corporel.** Même les formes engagées dans la matière doivent en être séparées pour être pensées. Le géomètre pense le cercle à partir de cercles tracés dans le sable, mais ce qu'il pense, c'est le cercle séparé de toute matière, et {teal}« ce n'est pas avec l'aide de la chair »{/teal} qu'il opère cette __séparation__. Pour penser, l'âme doit donc elle-même se séparer du corps.

    **L'incompatibilité entre la matière et les vertus.** Assimiler l'âme à un corps (comme un souffle (*pneûma*) ou du sang) {red}réduirait la tempérance, le courage et la justice à de simples réactions ou équilibres physiques{/red}. Or, {yellow}la matière corporelle ne fait que subir passivement{/yellow} des affections mécaniques, cherchant la chaleur, le froid ou le plaisir tactile, ce qui la rend __intrinsèquement incapable de dispenser la justice selon le mérite ou de pratiquer la retenue morale__. Un principe matériel ne pouvant s'abstraire des impulsions sensibles ni conserver des notions immatérielles, {coral}**la pratique des vertus exige nécessairement une âme incorporelle et souveraine, affranchie des contraintes de la matière**{/coral}.

    ! L'argument ne dit pas que le corps est inutile à la pensée humaine : il dit que ce qui pense n'est pas le corps.
