- id: traite2-l9
  title: "Les corps n'agissent que par des puissances incorporelles (chap. 8¹)"
  notes: |-
    Le chapitre 8¹ ouvre la dernière série d'arguments contre les stoïciens : après avoir montré qu'un corps ne peut ni vivre, ni sentir, ni penser par lui-même, Plotin attaque leur __**physique**__. Il montre que **même** __**ce que font les corps** (chauffer, refroidir, pousser, peser) ne s'explique pas par ce qu'ils ont de corporel__, et que l'âme, à plus forte raison, n'est pas un corps.

    **La doctrine visée.** Les {red}stoïciens{/red} posent deux principes, tous deux corporels : la {pink}matière{/pink}, purement {pink}passive{/pink} et {pink}sans qualité{/pink}, et un {amber}principe actif{/amber}, le *logos* ou dieu, qui est un {amber}souffle igné{/amber}. Ils rangent l'âme {red}« au rang de ce qui est actif »{/red}, avec ce qui chauffe ou pousse (l. 1-3).

    __**Ce qui agit dans un corps n'est déjà pas corporel.**__ Les stoïciens raisonnent ainsi : les corps agissent (le feu chauffe, la pierre pèse), l'âme agit, donc l'âme est un corps comme eux. Plotin attaque la première prémisse : ce n'est pas en tant que corps qu'un corps agit. {teal}« Les corps eux-mêmes ont ces activités grâce aux puissances incorporelles qui se trouvent en eux »{/teal} (l. 4-5). Plotin ne donne pas d'exemple, on peut prendre celui du feu : ce qui chauffe en lui, ce n'est pas sa masse, c'est sa chaleur. Un même morceau de fer brûle quand il est rougi au feu et ne brûle plus une fois refroidi : __sa masse n'a pas changé__, sa chaleur si. L'action d'un corps vient donc de sa qualité, de sa puissance, qui n'est pas sa masse : {coral}même dans les corps, ce qui agit est incorporel{/coral}. Ranger l'âme parmi ce qui agit ne prouve donc pas qu'elle soit un corps.

    **__L'âme ne fait d'ailleurs même pas ce que font les corps.__** Admettons qu'on range l'âme avec ce qui chauffe ou pousse : elle n'a pas ces puissances-là. Elle est pourvue {teal}« d'intellection, de sensation, de raisonnement, de désir, d'une prévoyance réfléchie et admirable »{/teal} (l. 6-8), toutes choses {teal}« qui exigent une réalité d'un autre ordre »{/teal}. Penser un théorème, désirer la justice, prévoir : rien de cela n'est chauffer, refroidir, pousser ou peser.

    **__En faisant des puissances des corps, on ôte aux corps toute puissance.__** Plotin en tire une formule paradoxale : {teal}« quand ils font passer les puissances des réalités incorporelles dans les corps, ils ne laissent plus aucune puissance à ces derniers »{/teal} (l. 9-11). Le paradoxe se dénoue avec une prémisse que les stoïciens admettent eux-mêmes : __la matière, en tant que telle, est purement passive__. Or __si la puissance n'est rien d'autre qu'un corps__, elle n'est qu'une masse de plus, et __une masse, comme toute matière, ne fait rien__. En voulant que tout ce qui agit soit corps, ils ne laissent dans les corps que de la masse inerte : {red}il n'y a plus rien en eux qui puisse agir{/red}. Pour que les corps agissent, il faut donc qu'il y ait en eux autre chose que du corps.

    __**La qualité n'est pas un corps.**__ Le raisonnement part d'une concession que font les stoïciens eux-mêmes :

    - ils admettent __« que la qualité est différente de la quantité, que tout corps a une quantité, mais qu'il n'est pas vrai que tout corps ait encore une qualité »__ (la matière en est dépourvue) ;
    - ils doivent donc admettre {coral}« que, parce qu'elle est différente de la quantité, la __qualité__ est différente du corps »{/coral} (l. 12-17).

    Le pivot est simple : {teal}« comment pourrait-on être un corps sans avoir une quantité, s'il est vrai que tout corps a une quantité ? »{/teal} (l. 16-17). __Être un corps, c'est avoir une quantité__ ; ce qui est autre chose qu'une quantité ne peut donc pas être un corps. __Si la qualité n'est pas un corps__, la thèse stoïcienne, selon laquelle tout ce qui agit est corps, tombe dès le premier exemple.

    Plotin s'appuie sur une expérience. Un corps divisé perd ce qu'il était (sa {violet}quantité{/violet}), alors que {teal}« la __qualité__ reste entièrement __la même__ dans chacune des __parties__ d'un corps qui a été morcelé »{/teal} (l. 19-21). Plotin prend l'exemple du {yellow}miel{/yellow} : {teal}« la douceur du miel n'est pas moins douceur en chaque partie que dans le tout »{/teal} (l. 21-22). Coupez une goutte en dix : vous avez dix fois moins de miel, mais pas dix fois moins de douceur. Ce qui se partage avec le corps est corporel ; __la douceur (qualité du miel) ne se partage pas : elle n'est donc pas un corps__. Plotin renvoie ici au chapitre 5, où il a établi la même chose de l'âme (la partie identique au tout).

    __**La puissance ne suit pas la masse.**__ {red}Si les puissances étaient des corps, les plus fortes auraient les plus grandes masses{/red} (l. 23-25). Or l'expérience montre l'inverse : __de grandes masses ne peuvent presque rien__, et {green}« les petites et même les minuscules »{/green} ont les plus grandes puissances (__une étincelle embrase une forêt, quelques gouttes de poison tuent__). **Si la puissance était un corps, elle croîtrait avec la** {violet}**masse**{/violet} ; puisqu'elle n'en suit pas les variations, elle n'est pas de l'ordre de la masse, et la production doit être attribuée {teal}« à quelque chose qui est dépourvu de grandeur »{/teal} (l. 27-28), c'est-à-dire d'incorporel.

    __**La matière, partout la même, reçoit ses différences de raisons incorporelles.**__ Les {red}stoïciens{/red} disent que la matière est un corps, partout identique. Or elle produit des choses toutes différentes {teal}« en recevant des qualités »{/teal} : or __une cause partout identique ne peut expliquer des effets différents__. La différence ne vient donc pas de la matière, mais de ce qu'elle reçoit ; et ce qu'elle reçoit ne peut pas être de la matière encore, puisque toute matière est la même. Ce sont donc {teal}« des raisons immatérielles et incorporelles »{/teal} (l. 28-31). On peut penser à une même argile qui devient cheval ou homme selon la forme que le sculpteur lui donne.

    __**Le souffle et le sang sont des conditions de la vie, mais pas de l'âme.**__ On meurt, disent-ils, quand le {violet}souffle{/violet} et le {violet}sang{/violet} nous quittent. Plotin l'accorde : {teal}« il n'est pas possible de continuer à vivre sans eux, ni sans bien d'autres choses encore ; mais rien de tout cela n'est l'âme »{/teal} (l. 32-34). On meurt aussi sans nourriture, et personne ne dit que l'âme est du pain. De plus, {teal}« ni le souffle ni le sang ne peuvent se répandre en toutes choses, alors que l'âme le peut »{/teal} (l. 35-36) : il n'y a pas de sang dans l'ongle ni dans le cheveu, et pourtant l'âme y est présente, puisqu'ils croissent. Ce qui n'est pas partout où est l'âme ne peut pas être l'âme.

    ! Plotin ne nie pas que les corps agissent : il dit que __ce qui agit en eux est incorporel__ (une qualité, une raison), et que l'âme ne se range même pas parmi ces puissances physiques.
