- id: traite2-l3
  title: "La vie ne naît pas d'une composition de corps (chap. 2)"
  notes: |-
    Le **chapitre 2** constitue l'amorce de la réfutation par Plotin des doctrines matérialistes et corporéalistes de l'âme (notamment stoïciennes et épicuriennes).

    Plotin pose comme point de départ que **tout corps est nécessairement un composé**. Si l'âme était de nature corporelle, elle serait donc elle-même composée de deux ou plusieurs corps simples (ou éléments). Puisque la vie appartient intrinsèquement à l'âme, Plotin formule un **dilemme** concernant __la manière dont la vie serait répartie entre les éléments corporels__ constituant cette prétendue **« âme corporelle »** :

    - Hypothèse 1 : {green}Toutes{/green} les parties corporelles composant l'âme sont vivantes.
    - Hypothèse 2 : {coral}Une seule{/coral} des parties est vivante, tandis que les autres ne le sont pas.
    - Hypothèse 3 : {red}Aucune{/red} des parties n'est vivante en elle-même.

    Plotin réfute systématiquement chacune de ces options :

    - Réfutation de l'hypothèse 1 : Si chaque partie est vivante en elle-même, {green}chaque partie est alors déjà une âme à part entière{/green}. Il devient __inutile d'assembler plusieurs corps vivants pour former une seule âme__.
    - **Réfutation de l'hypothèse 2** : Si seule l'une des parties a la vie, alors {coral}cette partie unique est la seule véritable âme{/coral}. Les autres parties corporelles ne seraient alors que de la matière inerte qui lui est adjointe (comme des bijoux sur un corps).
    - Réfutation de l'hypothèse 3 (Aucune partie n'a la vie) : Il est impossible que l'{red}assemblage de plusieurs corps inanimés ou morts{/red} produise de la vie. La simple __juxtaposition de matière inerte ne peut engendrer la vie par magie ou par simple combinaison quantitative__ (on ne fera jamais un golem avec un tas de caillou, comme on ne fera jamais la vie simplement en combinant les différents éléments qui composent la matière).

    Plotin en tire la conclusion que **l'âme ne saurait être un corps**. L'âme est une réalité **incorporelle**, indivisible et vivante par elle-même. Loin d'être le résultat d'un assemblage corporel, c'est l'âme qui assure l'unité, la cohésion et l'animation des corps sensibles.
