- id: traite2-plan-venue
  title: "Repérage : l'âme et les corps (chap. 13-15)"
  notes: |-
    Les chapitres 13 à 15 répondent à la difficulté que crée la thèse : si l'âme est séparée et divine, {red}comment vient-elle dans un corps ?{/red} Plotin le montre d'abord pour l'âme du monde et la nôtre (chap. 13), puis l'étend aux âmes des bêtes et des plantes (chap. 14), avant d'ajouter en annexe les témoignages de l'opinion commune (chap. 15).

