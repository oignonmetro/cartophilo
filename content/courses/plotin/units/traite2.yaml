- id: traite2-l13b
  title: "Aucune manière de périr ne convient à l'âme (chap. 12)"
  notes: |-
    Le chapitre 12 ferme le mouvement : il écarte une position intermédiaire, celle qui ne rend immortelle que l'âme du monde, puis passe en revue les manières dont une chose peut périr. {coral}Aucune ne convient à l'âme.{/coral}

    **__Si toute âme périssait, tout aurait péri.__** {teal}« S'ils soutiennent que toute âme peut périr, toutes choses auraient dû avoir péri depuis longtemps »{/teal} (l. 1-2) : c'est l'argument du chapitre 9, ce qui sauvegarde toutes choses ne peut pas disparaître.

    **__Pas de raison de distinguer l'âme du monde et la nôtre.__** Certains, les {red}stoïciens{/red}, accordent l'immortalité à {pink}l'âme de l'univers{/pink} mais la refusent à {pink}la nôtre{/pink}. {teal}« Il leur faut expliquer pourquoi »{/teal} (l. 2-4), car les deux ont en commun tout ce qui fonde l'immortalité :

    - {teal}« Chacune en effet est principe de mouvement »{/teal} ;
    - {teal}« l'une et l'autre tiennent la vie d'elle-même »{/teal} ;
    - {teal}« l'une et l'autre atteignent les mêmes choses par le même moyen, quand elles contemplent les êtres qui sont dans le ciel et ceux qui sont au-delà du ciel »{/teal}, en remontant jusqu'au premier principe (l. 4-8).

    Ce qui distingue nos âmes, c'est le corps qu'elles gouvernent, non leur nature : ce qui vaut pour l'une vaut pour l'autre.

    **__La réminiscence prouve que notre âme est antérieure au corps.__** {teal}« La conception de chaque être en soi, qu'elle tire par elle-même des spectacles qu'elle a en elle-même, c'est-à-dire de la réminiscence, apporte la preuve qu'elle est antérieure au corps et qu'elle est éternelle puisqu'elle jouit de sciences qui sont éternelles »{/teal} (l. 8-11). Personne n'a vu un cercle parfait ni l'égal en soi ; si nous les concevons, ce n'est pas de la sensation que nous les tenons, mais de nous-mêmes.

    **__Les trois manières de périr lui sont étrangères__** (l. 11-19).

    - **La dissolution** : ce qui a été composé se défait {teal}« suivant la manière même dont il a été composé »{/teal} ; or l'âme est {green}« une nature une et simple qui est en acte dans le fait de vivre »{/green}.
    - **La division** : l'âme {teal}« n'est ni une masse ni une quantité »{/teal}, comme l'a montré le chapitre 5.
    - **L'altération** : elle détruit la forme mais laisse la matière, car {teal}« le changement est une affection propre à un composé »{/teal}.

    {coral}« Cela étant, puisque l'âme ne peut être détruite d'aucune de ces manières, elle est nécessairement indestructible. »{/coral}

    ! L'argument par la réminiscence reprend le *Phédon* : apprendre, c'est se ressouvenir de ce qu'on savait avant de naître. Il ne s'agit pas d'une mémoire d'événements passés, mais de la présence en l'âme de vérités éternelles.
  points:
