- id: traite2-l14
  title: "La venue dans le corps : produire sans quitter l'intelligible (chap. 13)"
  notes: |-
    Le chapitre 13 affronte la difficulté que tout le traité a rendue aiguë : si l'âme est intelligible, séparée, divine, pourquoi et comment vient-elle dans un corps ? Plotin répond en peu de lignes, mais sa réponse commande tous les traités suivants.

    **Il faut distinguer deux niveaux.** {green}« Ce qui est intellect pur »{/green} vit d'une vie seulement intellective, impassible, et reste toujours là-bas, car **il n'a ni tendance ni désir** : rien ne lui manque. Ce qui vient juste après lui, l'âme, a **en plus un désir**, et c'est ce désir qui la porte vers le sensible.

    **Le désir de l'âme n'est pas un manque, mais une fécondité.** Elle veut **produire un ordre conforme à ce qu'elle a vu** dans l'Intellect. Plotin le dit par une image du *{sky}Banquet{/sky}* : {yellow}elle est comme « grosse des intelligibles » et ressent les douleurs de l'enfantement{/yellow}. Elle ne descend pas parce qu'elle est attirée par le corps, mais parce qu'elle est pleine de ce qu'elle a contemplé et veut le faire exister ailleurs. Plotin donne ainsi à l'âme le rôle que le *Timée* donnait au démiurge.

    **Comment elle gouverne.** Avec l'âme de l'univers, elle domine **de l'extérieur** ce qu'elle gouverne et prend soin de tout le monde. Quand elle veut gouverner une partie, elle se trouve isolée dans cette partie, {coral}« sans pourtant appartenir tout entière au corps, mais en gardant quelque chose d'extérieur à lui »{/coral}. **Son intellect n'est pas affecté** par le corps.

    **La descente est donc partielle.** L'âme est tantôt dans un corps, tantôt hors d'un corps, mais toujours par une partie seulement : sa partie la plus haute reste dans l'intelligible. Et c'est par elle que l'Intellect, qui reste en place, **« remplit toutes choses de beauté et les met en ordre »**.

    ! Plotin reconnaît que la mention de ce désir ne résout pas toutes les difficultés de la descente : les traités 6 (IV, 8) et 27-29 (IV, 3-5) y reviendront longuement.
  points:
  - id: traite2-l14-q1
