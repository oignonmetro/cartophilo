- id: traite2-l15
  title: "Les autres âmes, et la preuve par l'opinion (chap. 14-15)"
  notes: |-
    Les chapitres 14 et 15 étendent la conclusion à **toutes les âmes**, puis ajoutent, pour ceux qui ne se contentent pas d'une démonstration, une preuve tirée des croyances communes.

    **__Les âmes des bêtes__** (chap. 14, l. 1-3). Pour {teal}« toutes celles, parmi elles, qui ont commis des fautes et qui sont venues jusque dans des corps d'animaux »{/teal}, qui sont donc des âmes humaines, {teal}« il est nécessaire qu'elles aussi soient immortelles »{/teal}. Plotin admet ainsi la {violet}transmigration{/violet}, comme le *Timée* à sa fin.

    **__Les âmes des plantes__** (chap. 14, l. 3-8). {teal}« S'il y a une autre espèce d'âme, elle ne doit pas venir d'ailleurs que de cette nature qui vit »{/teal}, et elle cause la vie dans les vivants, en particulier dans les plantes. Car toutes les âmes {teal}« ont pris leur élan du même principe »{/teal} : elles ont une vie propre, sont incorporelles, indivisibles, et ce sont des réalités. Les raisons qui valaient pour notre âme valent donc pour elles.

    **__L'objection de l'âme tripartite__** (chap. 14, l. 8-14). La *République* distingue dans l'âme humaine trois parties : {red}une âme composée ne sera-t-elle pas dissoute ?{/red} Plotin répond en deux temps.

    - {green}Les âmes pures, une fois affranchies, abandonnent ce qui leur fut « accolé » à leur naissance{/green}, les autres le gardent très longtemps : les parties inférieures ne sont pas l'âme elle-même, mais ce qui s'est ajouté à elle quand elle est venue dans un corps.
    - Même cet élément inférieur, une fois abandonné, {teal}« ne périra pas, aussi longtemps qu'existera ce dont il tire son origine »{/teal}. {coral}« En effet rien de ce qui vient de ce qui est ne périt. »{/coral}

    **__La preuve par l'opinion__** (chap. 15). {teal}« Eh bien, nous avons dit ce qu'il fallait à ceux qui avaient besoin d'une démonstration. »{/teal} Pour ceux qui réclament {teal}« une preuve fondée sur l'autorité de la sensation »{/teal}, Plotin rappelle des faits : les dieux ordonnent {teal}« par des oracles d'apaiser la colère des âmes à qui on a porté tort »{/teal} ; tous les hommes rendent des honneurs aux défunts {teal}« comme s'il s'agissait d'êtres doués de sensation »{/teal} ; et bien des âmes, après avoir quitté leur corps, continuent de rendre service aux hommes par des oracles. Ce chapitre est une **annexe** destinée aux lecteurs qui ne sont pas philosophes : {coral}il ne prouve rien par lui-même, il montre que la croyance commune s'accorde avec la démonstration.{/coral}

    ! « Accolé » ne qualifie pas le corps, mais les parties inférieures de l'âme : c'est elles que l'âme pure laisse derrière elle. Plotin n'emploie ce terme nulle part ailleurs.
