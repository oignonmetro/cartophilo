- id: traite2-l10
  title: "L'âme n'est pas une harmonie (chap. 8⁴)"
  notes: |-
    Le chapitre 8⁴ ouvre le second mouvement de la réfutation. Puisque l'âme n'est pas un corps, {teal}« il faut chercher laquelle »{/teal} est sa nature : ne serait-elle pas {pink}quelque chose qui ressortit au corps{/pink}, comme l'harmonie d'un instrument ? Plotin écarte cette solution par une série d'arguments empruntés au {sky}*Phédon*{/sky} et à {sky}Aristote{/sky}, puis par un argument décisif qui est le sien.

    **La thèse visée.** {yellow}Tout comme les cordes tendues d'un instrument produisent une sorte d'affection qu'on appelle « harmonie »{/yellow}, le corps, mélange de parties dissemblables, produirait {red}« la vie et l'âme comme affection résultant de ce mélange »{/red} (l. 5-9). Ce n'est pas l'harmonie mathématique des pythagoriciens, précise Plotin, mais une harmonie de cordes, c'est-à-dire un effet du corps.

    **__Cinq arguments déjà connus.__**

    - {green}L'âme est antérieure{/green}, {red}l'harmonie postérieure{/red} (l. 10-11) : une harmonie n'existe qu'une fois les cordes tendues ; l'âme, elle, organise le corps (*Phédon*, 92b-c).
    - L'âme {teal}« gouverne le corps, lui donne des ordres et le combat de multiples façons »{/teal} (l. 11-12) : on s'interdit de boire malgré la soif. Or un accord ne peut pas retendre les cordes dont il résulte (*Phédon*, 94b-e).
    - {teal}« L'âme doit être une réalité, tandis que l'harmonie n'est pas une réalité »{/teal} (l. 13-14) : une harmonie n'est qu'un rapport entre des éléments, elle ne subsiste pas par soi. Plotin n'avait encore jamais qualifié l'âme de réalité (*ousia*) : il le fait ici pour la première fois.
    - Le mélange bien proportionné des corps qui nous constituent, {teal}« quand il est bien proportionné, serait la santé »{/teal} (l. 14-15), non l'âme : le bon réglage d'un moteur n'est pas le conducteur (Aristote, *De l'âme*, I, 4).
    - Chaque partie du corps, d'un mélange différent, aurait son harmonie, donc {red}« il y aurait plusieurs âmes »{/red} (l. 15-17), alors que le vivant est un.

    **__L'argument décisif : il faut un musicien.__** {teal}« Enfin, la difficulté la plus importante est qu'il doit nécessairement y avoir, avant cette âme-là, une autre âme qui soit celle qui produit cette harmonie-là »{/teal}, {teal}« comme c'est le cas pour les instruments de musique, où c'est le musicien qui produit l'harmonie à l'aide des cordes et qui possède en lui le rapport d'après lequel il produira l'harmonie »{/teal} (l. 17-21). Car {teal}« ni les cordes dans un cas ni les corps dans l'autre ne peuvent d'eux-mêmes produire l'harmonie »{/teal}. Des morceaux de bois et des cordes jetés dans une boîte ne s'accordent pas seuls en lyre : l'accord suppose quelqu'un qui en a la règle.

    **Le fond de l'erreur.** Ces gens {red}« font aussi sortir de l'inanimé l'animé et du désordonné l'ordonné »{/red} (l. 22-24) : au lieu de faire venir l'ordre de l'âme, ils font naître l'âme {red}« d'un ordre en quelque sorte spontané »{/red}. C'est la même faute que chez les stoïciens : faire venir le supérieur de l'inférieur. **L'âme n'est donc pas une harmonie.**

    ! L'harmonie réfutée ici est celle des cordes, un effet du corps. Plotin ne nie pas que l'âme ait en elle des rapports et des raisons : c'est précisément le musicien qui les possède.
