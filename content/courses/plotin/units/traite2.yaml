- id: traite2-l6
  title: "Repérage : le plan du traité 2"
  notes: |-
    **Le traité 2 pose la question (chap. 1-2), réfute les définitions rivales de l'âme (chap. 3 à 8⁵), puis dit sa nature (chap. 9-12) et sa venue dans le corps (chap. 13-15).**

    | Moment | Lieu | Ce qui s'y joue |
    | sommes-nous immortels | chap. 1 | le corps est mortel, notre âme ne l'est pas |
    | l'âme n'est pas un corps | chap. 2 | l'âme est la cause de l'existence des corps |
    | contre les épicuriens | chap. 3 | l'âme n'est pas faite d'atomes |
    | ni souffle ni manière d'être | chap. 4-5 | contre l'âme corporelle des stoïciens |
    | ni sensation ni pensée | chap. 6-8 | si l'âme était un corps, ni sensation ni pensée |
    | ni quantité ni mélange | chap. 8¹-8³ | l'âme et l'intellect antérieurs au corps |
    | contre l'harmonie | chap. 8⁴ | la définition pythagoricienne |
    | contre l'entéléchie | chap. 8⁵ | la définition aristotélicienne |
    | la nature de l'âme | chap. 9-12 | principe de vie, divine, immortelle |
    | la venue dans le corps | chap. 13 | l'âme du monde produit et dirige sans être dans le corps |
    | la survie des âmes | chap. 14-15 | les âmes subsistent séparément des corps |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! Les chapitres 8¹ à 8⁵ viennent entre le chapitre 8 et le chapitre 9 : absents des manuscrits de Ficin, qui a numéroté les chapitres, ils portent un exposant.
