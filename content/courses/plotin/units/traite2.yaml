    sentence: "« S'ils soutiennent que toute âme peut périr, toutes choses auraient dû avoir péri depuis ___ » (l. 1-2)."
    answer: "longtemps"
    alt: []
  - id: traite2-l13-q6
    sentence: "À ceux qui accordent l'immortalité à l'âme de l'univers mais pas à la nôtre, Plotin répond que l'une et l'autre sont principe de ___ et tiennent la vie d'elles-mêmes."
    answer: "mouvement"
    alt: []
