- id: traite2-l8
  title: "Penser et être vertueux (chap. 8)"
  notes: |-
    Le chapitre 8 passe de la sensation à la pensée et à la vertu : si un corps ne peut même pas sentir, à plus forte raison ne peut-il ni penser ce qui n'a pas de grandeur, ni être juste.

    **Penser, c'est saisir sans le corps.** Sentir, c'est se servir du corps pour percevoir le sensible ; si penser se faisait aussi par le corps, ce serait sentir. Penser, c'est donc percevoir sans le corps, et {teal}« il faut à plus forte raison encore que l'être qui pense ne soit pas un corps »{/teal}.

    **Le divisible ne pense pas l'indivisible.** Nous pensons des choses sans grandeur : le point, la ligne, l'égal, le juste. Comment ce qui a une grandeur et se divise saisirait-il ce qui est sans parties ? Par une partie de lui sans parties ? Mais alors ce qui pense n'est plus un corps.

    **Même les formes engagées dans la matière doivent en être séparées pour être pensées.** Le géomètre pense le cercle à partir de cercles tracés dans le sable, mais ce qu'il pense, c'est le cercle séparé de toute matière, et {teal}« ce n'est pas avec l'aide de la chair »{/teal} qu'il opère cette séparation. Pour penser, l'âme doit donc elle-même se séparer du corps.

    **La vertu est l'argument le plus parlant.** Le beau et le juste n'ont pas de grandeur. Si l'âme était un souffle, la tempérance serait un souffle bien tempéré et le courage un souffle impassible : {red}la vertu ne serait qu'une bonne constitution physique{/red}. Mais qu'importe à un souffle d'être tempéré ? Un souffle chercherait plutôt la chaleur, la douceur, le contact agréable (Plotin cite ici l'*Odyssée*). La répartition selon le mérite, qui est la justice, n'a aucun sens pour un souffle.

    **Enfin, la vertu est éternelle.** Si l'âme la contemple comme les objets de la géométrie, elle est une réalité qui subsiste ; et ce en quoi elle se trouve doit être du même type : non un corps, qui **« s'écoule tout entier »**.

    ! L'argument ne dit pas que le corps est inutile à la pensée humaine : il dit que ce qui pense n'est pas le corps.
