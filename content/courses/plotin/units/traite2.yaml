- id: traite2-l7
  title: "Ce qui sent doit être un : sensation et douleur (chap. 6-7)"
  notes: |-
    Les chapitres 6 et 7 tirent l'argument le plus fort de l'expérience la plus commune : sentir et souffrir supposent un sujet qui rassemble, et un corps, toujours étendu en parties, ne rassemble rien.

    **Sentir, c'est unifier** (chap. 6). Je vois une pomme, je la touche, je la sens : ce ne sont pas trois sensations de trois sujets, mais une seule sensation d'un seul objet. Il y a donc un point où tout converge, {yellow}comme un centre vers lequel arrivent des lignes venues de la circonférence{/yellow}. Si ce centre était étendu, chaque extrémité aurait sa propre sensation, {red}« exactement comme si je sentais une chose, et toi une autre »{/red} : personne ne saurait que la couleur et l'odeur sont celles d'une même pomme. Même un visage, qui est étendu, se rassemble dans la pupille ; à plus forte raison dans le principe directeur.

    **Une âme étendue se diviserait avec ses objets.** Si l'âme était une grandeur, chacune de ses parties percevrait une partie de l'objet, et personne ne percevrait le tout ; et comme une grandeur se divise à l'infini, on aurait du même objet une infinité de sensations.

    **La mémoire serait impossible.** Si sentir, c'est recevoir une empreinte, comme le cachet d'une bague dans la cire, et que cette empreinte se fait dans le sang ou le souffle, qui sont fluides, elle s'efface comme sur l'eau : pas de mémoire. Si elle dure, elle occupe la place : pas de nouvelles sensations. Or nous nous souvenons et nous sentons encore. Donc l'âme n'est pas un corps.

    **La douleur au doigt** (chap. 7). Les stoïciens placent la sensation dans le principe directeur (*hêgemonikon*), d'où partent des souffles vers les organes **comme les tentacules d'une pieuvre**. Comment le principe directeur sent-il la douleur du doigt ? Par **transmission**, disent-ils, de proche en proche. Mais alors chaque relais sentirait sa propre douleur : le doigt, puis la paume, puis le bras, une infinité de sensations ; et le principe directeur ne sentirait que la douleur du dernier relais, {red}« sans savoir que c'est le doigt qui souffre »{/red}. Or c'est bien le doigt que je sens. Il faut donc que ce qui sent soit **le même partout à la fois**, ce dont aucun corps n'est capable.

    ! L'argument n'est pas que la douleur n'est pas dans le doigt : elle y est. C'est que celui qui la sent n'est pas réparti entre le doigt et le cerveau.
