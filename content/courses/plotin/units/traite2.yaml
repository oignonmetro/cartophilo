- id: traite2-plan-venue
  title: "Repérage : l'âme et les corps (chap. 13-15)"
  notes: |-
    Les chapitres 13 à 15 répondent à la difficulté que crée la thèse : si l'âme est séparée et divine, {red}comment vient-elle dans un corps ?{/red} Plotin le montre d'abord pour l'âme qui produit le monde et pour la nôtre (chap. 13), puis étend l'immortalité aux âmes des bêtes et des plantes (chap. 14), avant d'ajouter en annexe les témoignages de l'opinion commune (chap. 15).

    | Moment | Lieu | Ce qui s'y joue |
    | la venue dans le corps | chap. 13 | l'âme vient dans le corps parce qu'elle désire ordonner le sensible sur le modèle de l'intelligible, sans le quitter |
    | les autres âmes | chap. 14 | les âmes des bêtes et des plantes sont immortelles aussi, car « rien de ce qui vient de ce qui est ne périt » |
    | la preuve par l'opinion | chap. 15 | oracles et culte des morts confirment, pour qui ne suit pas la démonstration, que les âmes ne sont pas détruites |
