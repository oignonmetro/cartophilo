- id: traite2-l7
  title: "Ce qui sent doit être un : sensation et douleur (chap. 6-7)"
  notes: |-
    Les chapitres 6 et 7 tirent l'argument le plus fort de l'expérience la plus commune : {green}**sentir et souffrir supposent un sujet qui rassemble**{/green}, et {pink}un corps, toujours étendu en parties, ne rassemble rien{/pink}.

    **La réfutation de la sensation et de la mémoire comme « empreintes »** (chap. 6). Les {red}philosophes matérialistes{/red} (notamment les stoïciens et les épicuriens) définissaient la {red}sensation{/red} comme l'impression ou la marque d'un {red}sceau{/red} gravé dans la matière de l'âme (air, souffle ou sang).

    **1. Le dilemme du fluide et du solide** :

    - Si la matière de l'âme est __fluide__ (comme l'air ou le sang), __l'impression s'efface immédiatement__, à la manière d'une onde sur l'eau, ce qui rend la mémoire impossible.
    - Si la matière est assez __rigide__ pour conserver l'empreinte, deux cas se présentent : soit {red}les anciennes empreintes font obstacle aux nouvelles{/red} (**impossibilité d'éprouver de nouvelles sensations**), soit {red}les nouvelles effacent les anciennes{/red} (**perte des souvenirs**). Puisqu'un être vivant peut à la fois acquérir de nouvelles sensations et conserver ses anciens souvenirs sans interférence, l'âme ne saurait être un corps.

    **2. Sentir, c'est unifier**. Je vois une pomme, je la touche, je la sens : ce ne sont pas trois sensations de trois sujets, mais une seule sensation d'un seul objet. Il y a donc un point où tout converge, {yellow}comme un centre vers lequel arrivent des lignes venues de la circonférence{/yellow}. Si ce centre était étendu, chaque extrémité aurait sa propre sensation, {red}« exactement comme si je sentais une chose, et toi une autre »{/red}. Pour juger qu'{green}une rose{/green} est {green}à la fois *rouge* (vue) et *odorante* (odorat){/green}, il faut que les différentes perceptions convergent vers un **centre indivisible et incorporel** capable de rassembler la multiplicité dispersée.

    **La douleur au doigt** (chap. 7). Selon la thèse stoïcienne de la {red}transmission{/red}, le souffle du doigt affecté transmet son affection à la partie voisine (la main), qui la transmet au poignet, puis au bras, jusqu'au cerveau ou au cœur.

    - **La multiplication infinie des douleurs** : Plotin souligne alors que si chaque partie corporelle subit et transmet l'affection de la précédente, la deuxième partie ne sent pas la blessure du doigt, mais la souffrance de la première partie ; la troisième sent la souffrance de la deuxième, et ainsi de suite. On aurait alors {red}une infinité de sensations de douleurs différentes avant même que le signal n'atteigne le centre directeur{/red}.
    - L'incapacité de localiser le mal : Si le principe directeur ne reçoit le signal que de la partie qui lui est immédiatement contiguë (par exemple le bras ou l'épaule), il {red}ne sentira que l'affection de cette partie adjacente{/red}. Il ignorera totalement {red}que c'est le doigt qui souffre à l'origine{/red}.

    **L'omniprésence de l'âme incorporelle.** Puisqu'un **corps physique** est étendu dans l'espace, __ses parties sont spatialement séparées et ne réagissent entre elles que par contact mécanique local__. (Ainsi, si le fait de tirer un maillon de chaîne entraîne bien tous les autres, cet entraînement n'est qu'un choc matériel aveugle : aucun maillon ne **sait** ni ne **ressent** ce que subit le premier.) Pour qu'un homme déclare « j'ai mal au doigt », le sujet percevant ne doit donc pas être une suite de relais physiques qui se poussent, mais une **conscience unifiée** à travers tout l'organisme. Seul un être **incorporel** (l'âme) peut être présent tout entier dans le doigt touché et tout entier au centre du sujet, permettant d'éprouver la douleur là où la matière ne fait que transmettre un mouvement.

    En conclusion de ces deux chapitres, Plotin établit que la sensation et la mémoire ne sont pas des impressions physiques passives dans une matière, mais des **actes et des jugements d'une puissance incorporelle et indivisible**.
