- id: traite2-l10b
  title: "L'âme n'est l'entéléchie d'aucun corps (chap. 8⁵)"
  notes: |-
    Le chapitre 8⁵ affronte la version la plus savante de l'âme-forme : celle d'{sky}Aristote{/sky}. Plotin la pousse dans ses conséquences, montre qu'aucune partie de l'âme ne s'y laisse enfermer, et conclut le premier grand ensemble du traité : {green}l'âme est une réalité avant même d'appartenir à un corps{/green}.

    **Ce qu'Aristote entend par entéléchie.** Pour Aristote, l'âme est l'{violet}**entéléchie**{/violet} (*entelekheia*, la réalisation, l'acte achevé) {teal}« d'un corps naturel organisé ayant la vie en puissance »{/teal} (l. 4-5). Dans le composé, {teal}« l'âme tient la place de la forme par rapport à la matière »{/teal} (l. 2-3), et elle en est {coral}**inséparable**{/coral}, {yellow}« comme la figure de la statue l'est au bronze »{/yellow} (l. 6-7). Plotin prend cette inséparabilité au mot.

    **__Une âme collée au corps serait coupée avec lui, ne dormirait pas et ne lutterait pas contre lui.__**

    - **L'âme serait divisible.** {teal}« Si le corps était découpé en parties l'âme le serait en autant de parties »{/teal}, et un membre retranché emporterait {red}« un morceau d'âme »{/red} (l. 5-9) : on ne devient pas trois quarts d'âme en perdant une jambe.
    - **Il n'y aurait plus de sommeil.** L'entéléchie doit {teal}« adhérer naturellement à ce dont elle est entéléchie »{/teal} : l'âme ne pourrait donc pas {teal}« faire retraite dans le sommeil »{/teal}, et {red}« il n'y aura même plus de sommeil »{/red} (l. 8-11). Dans le sommeil, le corps reste là et vit, mais {amber}la sensation et la pensée se suspendent{/amber} {amber}: quelque chose de l'âme cesse d'agir à travers le corps sans que le corps disparaisse{/amber}. __Une forme collée à sa matière ne peut pas se retirer ainsi : la figure d'une statue ne s'absente pas du bronze.__
    - **Il n'y aurait plus de conflit intérieur.** {teal}« Si l'âme était entéléchie, **il ne pourrait pas même y avoir d'opposition entre la** __**raison**__ **et les** __**désirs**__ »{/teal} : {red}le tout serait affecté d'une seule et même manière{/red} (l. 11-14). Or la raison combat souvent le désir. {coral}__Une forme ne lutte pas contre la matière qu'elle informe__{/coral} : la figure de la statue ne combat pas le bronze. {amber}Si la raison peut s'opposer aux désirs du corps, c'est qu'elle n'est pas la forme de ce corps.{/amber}

    **__Aucune partie de l'âme n'est une forme inséparable.__** Plotin les passe en revue, dans l'ordre d'Aristote.

    - **L'âme qui pense.** Avec une âme-forme, {red}il n'y aurait que des sensations{/red}. Une __forme inséparable d'un organe corporel__ ne peut accomplir __que des fonctions organiques__. L'{coral}intellection (la pensée rationnelle qui saisit des intelligibles immatériels) exige une indépendance à l'égard de la matière{/coral}. {teal}« Voilà pourquoi ils introduisent une autre âme, l'intellect, qu'ils tiennent pour immortelle »{/teal} (l. 14-16) : Aristote lui-même reconnaît une partie séparée. {teal}« L'âme qui raisonne doit donc être entéléchie dans un autre sens que celui-là »{/teal} (l. 16-17).
    - **L'âme qui sent et se souvient.** Si elle garde les empreintes des objets absents, elle les garde {teal}« sans l'aide du corps »{/teal} ; sinon, ces empreintes seraient dans le corps comme des figures, {red}« il lui serait alors impossible d'en recevoir d'autres »{/red} (l. 17-22), comme une cire couverte de cachets.
    - **L'âme qui désire.** Si {red}la faculté désirante{/red} était une entéléchie liée au corps, elle {red}ne pourrait s'appliquer qu'à des besoins matériels (nourriture, boisson){/red}. Or, {amber}l'être humain{/amber} éprouve des {amber}désirs{/amber} d'une autre nature, {amber}orientés vers des réalités non corporelles{/amber} (comme la {teal}vertu{/teal} ou la {teal}vérité{/teal}). L'existence de tels désirs prouve que la faculté désirante ne saurait être tenue pour une entéléchie inséparable du corps.
    - **L'âme végétative.** Plotin prend l'exemple de la {teal}plante{/teal} dont tout le reste se dessèche alors que la racine vit encore : si l'âme était la forme d'un corps, {red}__la détérioration ou la mort d'une partie du corps entraînerait la destruction ou la mutilation proportionnelle de l'âme__{/red}. Or, le fait que la partie supérieure de la plante puisse {teal}se flétrir sans que l'âme ne disparaisse{/teal} prouve que l'âme se retire des parties mortes pour se rassembler et se maintenir entière dans la racine. En abandonnant les branches desséchées, {coral}l'âme montre qu'elle n'est pas une simple propriété physique du corps végétal, mais un principe autonome qui habite le corps sans y être enchaîné de façon rigide{/coral}.

    **__L'âme passe d'un corps à un autre.__** Si l'âme passe d'une grande plante dans une petite, et d'une petite dans une plante entière, {teal}« qu'est-ce qui l'empêche d'être aussi totalement séparée ? »{/teal} Et {teal}« c'est la même âme qui passe d'un vivant à un autre »{/teal} : comment le pourrait-elle si elle était l'entéléchie d'un seul (l. 32-38) ? Une forme inséparable naît et périt avec son corps ; une âme qui passe d'une plante adulte dans la petite masse d'où sortira une autre plante (on peut penser à une bouture) existe donc hors du corps qu'elle quitte. Plotin ajoute : comment ce qui est sans partie serait-il la forme d'un corps divisible ?

    **__La conclusion.__** {coral}« Par conséquent l'être de l'âme ne consiste donc pas à être la forme de quelque chose ; elle est une réalité qui ne reçoit pas son être du fait de s'établir dans un corps, mais qui est avant même d'appartenir à ce corps »{/coral} (l. 39-42). Le verbe « s'établir » (*hidrusthai*) est celui qu'on emploie pour les statues des dieux dressées dans les temples. L'âme est donc une {green}réalité{/green} au sens fort : elle est par elle-même, alors que {red}tout ce qui relève du corps doit être dit **devenir**{/red}, et non réalité, {teal}« dans la mesure où cela naît et périt, n'est jamais réellement et n'est sauvegardé que par participation à l'être »{/teal} (l. 45-48).

    ! Plotin ne rejette pas Aristote en bloc : il lui emprunte la plupart de ses arguments contre les stoïciens, et ne lui reproche que de n'être pas allé jusqu'au bout de la séparation de l'âme, dont l'intellect séparé est déjà l'aveu.

    ! Ce chapitre ne figure dans aucun manuscrit des *Ennéades* : il n'est connu que par la citation qu'en donne Eusèbe dans sa *Préparation évangélique*.
