# Cours d'un traité de Plotin (piste Repérage, voir content/philosophie.md),
# d'après la notice et le plan détaillé de Luc Brisson et Jean-François Pradeau, dans Plotin, Traités 1-6,
# trad. sous la dir. de L. Brisson et J.-F. Pradeau, GF-Flammarion, 2002.
# Les citations viennent de la notice ou du plan ; les repères (chapitre,
# lignes) sont ceux de cette édition. Lié à l'entrée t-4-7 de l'index.

id: traite2
title: "Traité 2 (IV, 7) : Sur l'immortalité de l'âme"
subtitle: "L'âme n'est pas un corps"
icon: compass
color: sky
lessons:
- id: traite2-l1
  title: "L'âme, point nodal de la réalité"
  notes: |-
    **Toute la tradition ancienne faisait de la définition de l'âme la condition d'une définition de l'homme**, mais aussi de l'étude des vivants (tous sont des corps animés) et de l'explication du monde (qui, pour beaucoup, a une âme). Plotin inscrit à son tour l'enquête sur l'âme à la croisée de l'**éthique**, de la **biologie** et de la **cosmologie**.

    **Pour Plotin, l'âme est en outre le point nodal de la réalité :** elle est le **terme de la procession** qui, issue de l'Un et passant par l'Intellect, s'achève avec elle. En deçà de l'âme, rien n'a de réalité au sens strict : les corps n'existent que pour autant qu'une âme les informe et les anime. L'âme est à la fois **cause de l'univers sensible** et, en nous, **sujet de la connaissance** de l'intelligible.

    - Le traité 2, avec les traités 4 (IV, 2) et 21 (IV, 1) qui en sont la suite, ne traite ces questions que partiellement ; les trois traités *Sur les difficultés relatives à l'âme*, 27 à 29 (IV, 3-5), poursuivront l'enquête.
    - Les traités 2 et 4 prennent un tour **« doxographique »** : Plotin examine les opinions (`δόξαι`) des prédécesseurs pour les réfuter, avant de défendre sa propre définition, platonicienne et donc vraie à ses yeux.

    ! Être le dernier degré de la procession ne rend pas l'âme secondaire : c'est elle qui cause le sensible et qui connaît l'intelligible.
