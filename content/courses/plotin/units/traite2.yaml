- id: traite2-l15
  title: "Les autres âmes, et la preuve par l'opinion (chap. 14-15)"
  notes: |-
    Les chapitres 14 et 15 étendent la conclusion à **toutes les âmes**, puis ajoutent, pour ceux qui ne se contentent pas d'une démonstration, une preuve tirée des croyances communes.

    **__Les âmes des bêtes__** (chap. 14, l. 1-3). Pour {teal}« toutes celles, parmi elles, qui ont commis des fautes et qui sont venues jusque dans des corps d'animaux »{/teal}, qui sont donc des âmes humaines, {teal}« il est nécessaire qu'elles aussi soient immortelles »{/teal}. Plotin admet ainsi la {violet}transmigration{/violet}, comme le *Timée* à sa fin.

    __**Les autres espèces d'âme**__ (chap. 14, l. 3-8). {teal}« S'il y a une autre espèce d'âme, elle ne doit pas venir d'ailleurs que de cette nature qui vit »{/teal}, et __elle cause la vie dans les vivants__, en particulier dans les plantes : c'est l'{violet}**âme végétative**{/violet}, celle du {sky}*Timée*{/sky} (76e-77b). Car toutes les âmes {teal}« ont pris leur élan du même principe »{/teal} : elles ont une vie propre, sont incorporelles, indivisibles, et ce sont des réalités. Les raisons qui valaient pour notre âme valent donc pour elles.

    __**L'objection de l'âme tripartite**__ (chap. 14, l. 8-14). La {sky}*République*{/sky} (IV) distingue dans l'âme humaine trois espèces, que la tradition appellera « parties » : {red}une âme composée ne sera-t-elle pas dissoute ?{/red} Plotin répond en deux temps.

    - Les âmes pures, une fois affranchies, abandonnent ce qui leur fut « accolé » à leur naissance, les autres le gardent très longtemps : __les__ {violet}__parties inférieures de l'âme__{/violet} ({yellow}vie biologique, sensibilité, désirs{/yellow}) __ne sont pas__ {pink}__l'âme elle-même__{/pink}__, mais__ {coral}__ce qui s'est ajouté à elle quand elle est venue dans un corps__{/coral}.
    - Même cet élément inférieur, une fois abandonné, {teal}« ne périra pas, aussi longtemps qu'existera ce dont il tire son origine »{/teal}. {coral}« En effet rien de ce qui vient de ce qui est ne périt. »{/coral}

    Plotin achève ainsi son commentaire de la fin de la *République*, ouvert avec la statue de Glaucos, en s'appuyant sur le {sky}*Timée*{/sky} (69c-71e), qui dit **« mortelles »** les {yellow}parties inférieures de l'âme{/yellow} : elles ne sont pas l'âme véritable, et {yellow}même elles ne sont pas anéanties{/yellow}.

    ! Les {violet}facultés inférieures{/violet} n'appartiennent qu'au **« composé »** (*to sunamphoteron*), c'est-à-dire au __vivant individuel issu de l'union provisoire de l'âme et du corps__. Elles forment un ajout adventice lié à l'incarnation. C'est pourquoi, lors de sa purification ou de son affranchissement, l'âme s'en sépare : « les âmes pures, lorsqu'elles sont affranchies, abandonnent ce qui leur fut accolé à leur naissance » (chap. 14).

    **__La preuve par l'opinion__** (chap. 15). {teal}« Eh bien, nous avons dit ce qu'il fallait à ceux qui avaient besoin d'une démonstration. »{/teal} Pour ceux qui réclament {teal}« une preuve fondée sur l'autorité de la sensation »{/teal}, Plotin rappelle des faits : les dieux ordonnent {teal}« par des oracles d'apaiser la colère des âmes à qui on a porté tort »{/teal} ; tous les hommes rendent des honneurs aux défunts {teal}« comme s'il s'agissait d'êtres doués de sensation »{/teal} ; et bien des âmes, après avoir quitté leur corps, continuent de rendre service aux hommes, par des oracles et d'autres bienfaits, comme les âmes des morts qui veillent sur les orphelins dans les {sky}*Lois*{/sky} (XI, 927a). Conclusion : {teal}« par leur exemple, elles montrent que les autres âmes ne sont pas détruites »{/teal}. Ce chapitre est une **annexe** destinée aux lecteurs qui ne sont pas philosophes : {coral}il ne prouve rien par lui-même, il montre que la croyance commune s'accorde avec la démonstration.{/coral}

    ! Ce n'est pas le corps qui produit la puissance de l'âme, mais c'est la puissance de l'âme qui s'actualise dans le corps tant que celui-ci est apte à la recevoir. Lorsque le composé se dissout ou que l'âme s'en affranchit : {coral}le **reflet** (l'exercice sensible dans le corps) disparaît de la matière{/coral} et __la **source** (la puissance en l'âme) demeure intacte dans son principe incorporel__, car l'acte intérieur de l'âme ne dépend pas du corps. Ainsi, {amber}__les parties inférieures ne sont pas anéanties__{/amber} : c'est leur **manifestation extérieure s'interrompt**, et c'est leur **principe incorporel qui subsiste** dans l'impassibilité de l'âme.
