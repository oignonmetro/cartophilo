- id: traite2-l3
  title: "La vie ne naît pas d'une composition de corps (chap. 2)"
  notes: |-
    Le chapitre 2 ouvre la réfutation de l'âme-corps par l'argument le plus général : aucun assemblage de corps, si habile soit-il, ne peut donner la vie, parce que la vie n'est dans aucun des corps qu'on assemble.

    **Supposons l'âme un corps.** Comme tout corps est composé, elle sera faite de deux corps ou plus. Or la vie est nécessairement en l'âme. Il faut donc se demander où est la vie dans ce composé : dans chacun de ses composants, dans l'un d'eux seulement, ou dans aucun.

    **Les éléments sont inanimés par eux-mêmes.** Le feu, l'air, l'eau, la terre n'ont pas la vie : quand l'âme est présente en l'un d'eux, il ne la reçoit que **« par procuration »**, comme une chose importée du dehors (*epaktos*). Et ceux qui imaginent d'autres éléments, les atomes, en font encore des corps, non des âmes.

    **D'où un dilemme sans issue.** {teal}« Si aucun d'entre eux ne possède la vie, il est absurde de supposer que leur composition l'a produite ; et si chacun la possédait, un seul y suffirait »{/teal}. Un tas de pierres mortes ne devient pas vivant parce qu'on le dispose bien ; et si l'une des pierres vivait, c'est elle qui serait l'âme, et les autres seraient de trop. Plus encore : {red}il est impossible que des choses dépourvues d'intellect engendrent l'Intellect{/red}.

    **Il faut une cause du mélange.** Même les stoïciens ne disent pas que les corps se mélangent n'importe comment : il faut donc **un élément ordonnateur**, une cause qui règle le mélange, et cette cause « aura rang d'âme ». Plotin reprend ici le *{sky}Philèbe{/sky}* de Platon, où un intellect divin est la cause du mélange et de l'ordre du monde.

    **L'argument va plus loin que la vie : il touche l'existence même des corps.** Même un corps simple n'existerait pas sans âme, car {green}« ce qui produit un corps, c'est la venue d'une raison dans la matière, et une raison ne peut venir d'ailleurs que d'une âme »{/green}. La raison (*logos*) est la forme que l'âme imprime dans la matière : sans elle, la matière, informe et sans qualité, ne serait jamais un corps. L'âme n'est donc pas un corps parmi d'autres : elle est **la cause de ce qui fait des corps des corps**.

    ! L'argument ne nie pas que le vivant soit composé : il nie que la composition explique la vie. Elle en est la condition, pas la cause.
