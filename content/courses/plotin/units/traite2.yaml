- id: traite2-l11
  title: "La vie par soi (chap. 9)"
  notes: |-
    Le chapitre 9 marque le **tournant** du traité : après avoir dit ce que l'âme n'est pas, Plotin dit ce qu'elle est, {green}une réalité qui a l'être et la vie par elle-même, et qui ne peut donc les perdre{/green}.

    __**Il faut une nature qui ne naît ni ne périt.**__ Les corps et les assemblages physiques du monde sensible sont sujets au devenir : ils naissent, se modifient et se détruisent. Ils ne possèdent pas {amber}l'existence{/amber} par eux-mêmes, mais {amber}la reçoivent de manière dérivée et temporaire{/amber}. {coral}Si *toutes* les réalités étaient de cette nature composée et périssable, la totalité du réel finirait nécessairement par se détruire.{/coral} Or, le néant ne pouvant rien engendrer, une fois le monde détruit, plus rien ne pourrait jamais réapparaître. L'{violet}existence continue du monde{/violet} sensible exige donc logiquement l'existence préalable d'une {coral}« autre nature » qui possède l'être par elle-même et ne peut périr{/coral}.

    ! On pourrait être tenté de penser que la {pink}matière physique{/pink} pourrait se régénérer d'elle-même en un cycle éternel. Plotin s'oppose fermement à cette idée : {pink}**la matière corporelle, prise isolément, est dispersée, passive et incapable de s'ordonner**{/pink}. Ce ne sont pas les éléments matériels qui se rassemblent eux-mêmes, mais l'âme qui {teal}« sauvegarde toutes choses »{/teal} et {teal}« met en ordre »{/teal} l'univers. Il faut donc nécessairement poser {amber}__un principe incorporel supérieur qui garantit la permanence de l'être__{/amber}.

    __**L'âme a la vie par elle-même, elle ne peut donc pas la perdre.**__ Plotin reprend le {sky}*Phèdre*{/sky} (245c) : **l'âme** est {teal}« principe du mouvement »{/teal}, elle {teal}« se meut d'elle-même et donne la vie au corps animé, mais [...] a la vie par elle-même et ne peut jamais la perdre parce qu'elle l'a par elle-même »{/teal} (l. 5-8). Si la vie était reçue du dehors par l'âme, elle lui serait extérieure et l'âme pourrait la perdre. Pour Plotin, l'âme possède la vie **par elle-même** : la **vie** n'est pas un attribut accidentel de l'âme, mais sa propre **définition** et son **essence** même. Or, une réalité ne peut jamais être séparée de ce qui constitue sa propre définition (de même que le feu ne peut être séparé de la chaleur) ; __l'âme ne peut donc pas cesser de vivre__.

    __**Il faut un**__ {violet}__**premier vivant**__{/violet}__**, sinon on remonte à l'infini.**__ {teal}« Il est impossible en effet que toutes choses aient reçu la vie du dehors, sans quoi on poursuivrait à l'infini »{/teal} (l. 8-10). Si chaque vivant tenait sa vie d'un autre, qui la tiendrait d'un autre encore, la chaîne n'aurait pas de premier anneau, et rien ne vivrait. Il faut donc {teal}« __une nature qui soit primitivement vivante__, et qui soit de toute nécessité "impérissable et immortelle" »{/teal}, formule du {sky}*Phédon*{/sky}, {teal}« puisqu'elle est aussi le principe de la vie de tous les autres êtres vivants »{/teal} (l. 10-13).

    __**Ce qui a l'être par soi est toujours :**__ {yellow}__**l'exemple du blanc**__{/yellow} (l. 17-22). Puisque **l'âme est primitivement vivante et existe par elle-même**, __elle n'est pas soumise aux lois de la matière, de la division ou de la décomposition qui affectent les corps composés__. Plotin prend l'exemple du blanc.

    - Le blanc, {teal}« qui en lui-même est une couleur, ne peut pas être tantôt blanc tantôt non blanc »{/teal} : ce qu'une chose est par elle-même, elle ne peut pas cesser de l'être.
    - {teal}« Or si le blanc était un être en plus d'être blanc, il serait toujours. Mais il possède seulement le blanc »{/teal} : {yellow}le blanc{/yellow} n'a par lui-même que la blancheur, pas l'existence ; c'est pourquoi il {yellow}peut cesser d'exister, sans jamais cesser d'être blanc tant qu'il existe{/yellow}.
    - {coral}« Or ce qui tient l'être de lui-même et primitivement sera toujours un être »{/coral} : ce qui a l'**être** par lui-même, comme le blanc a la blancheur, ne peut pas plus cesser d'être que le blanc ne peut devenir noir.

    Appliqué à l'âme : elle tient l'être et la vie d'elle-même, comme le blanc tient de lui-même la blancheur ; {amber}elle ne peut donc pas plus cesser d'être et de vivre que le blanc ne peut devenir non blanc{/amber}. Platon donnait dans le {sky}*Phédon*{/sky} un exemple voisin : le trois ne peut devenir pair, parce que l'impair lui appartient par lui-même.

    __**L'âme « est l'être primitivement ».**__ Ce qui possède l'être {violet}« primitivement »{/violet} (*prôtôs*) et par soi {amber}ne reçoit pas son existence d'une cause extérieure{/amber}. **L'être constitue son essence même** ; il ne peut donc jamais être séparé de l'être ni cesser d'exister. Plotin s'interroge alors : quelle est la nature de cet être fondamental ? Peut-il être inerte ? Non, car __ce qui est « mort », comme la pierre ou le bois, ne possède aucune intériorité ni aucune activité autonome__ ; c'est un __objet passif, divisible et soumis aux actions extérieures__, ce qui témoigne d'un manque d'être. L'être absolu et autarcique, existant par lui-même, doit au contraire posséder l'activité et l'autonomie souveraines : il est donc nécessairement **vie**, et une « vie pure » parce qu'elle est affranchie de toute matière corporelle.

    __**L'âme n'est pas vraiment diminuée par un corps.**__ Lorsqu'une nature spirituelle pure s'associe à un corps matériel (qui lui est inférieur), cette **union** constitue un **« obstacle »**. Les besoins, les passions et les contraintes du corps gênent l'âme et obscurcissent son élan naturel vers le monde intelligible. Toutefois, Plotin démontre que {red}ce **mélange** n'est **qu'une affection accidentelle et externe**{/red}. L'âme étant une réalité simple et incorporellement vivante, elle « ne peut certainement pas perdre la nature qui est la sienne ». __Le corps peut entraver l'activité de l'âme, mais il ne peut pas détruire ni altérer son essence.__

    ! *Avoir la vie par soi* ne veut pas dire que l'âme ne vient de rien : elle est produite par l'Intellect, mais elle ne devient elle-même qu'en se retournant vers lui, et c'est en ce sens qu'elle possède par elle-même l'existence.
