- id: traite2-l10b
  title: "L'âme n'est l'entéléchie d'aucun corps (chap. 8⁵)"
  notes: |-
    Le chapitre 8⁵ affronte la version la plus savante de l'âme-forme : celle d'{sky}Aristote{/sky}. Plotin la pousse dans ses conséquences, montre qu'aucune partie de l'âme ne s'y laisse enfermer, et conclut le premier grand ensemble du traité : {green}l'âme est une réalité avant même d'appartenir à un corps{/green}.

    **Ce qu'Aristote entend par entéléchie.** Pour Aristote, l'âme est l'{violet}**entéléchie**{/violet} (*entelekheia*, la réalisation, l'acte achevé) {teal}« d'un corps naturel organisé ayant la vie en puissance »{/teal} (l. 4-5). Dans le composé, {teal}« l'âme tient la place de la forme par rapport à la matière »{/teal} (l. 2-3), et elle en est **inséparable**, {yellow}« comme la figure de la statue l'est au bronze »{/yellow} (l. 6-7). Plotin prend cette inséparabilité au mot.

    **__Trois conséquences absurdes de l'âme-forme.__**

    - **L'âme serait divisée.** {teal}« Si le corps était découpé en parties l'âme le serait en autant de parties »{/teal}, et un membre retranché emporterait {red}« un morceau d'âme »{/red} (l. 5-9) : on ne devient pas trois quarts d'âme en perdant une jambe.
    - **Il n'y aurait plus de sommeil.** L'entéléchie doit {teal}« adhérer naturellement à ce dont elle est entéléchie »{/teal} : l'âme ne pourrait donc pas {teal}« faire retraite dans le sommeil »{/teal}, et {red}« il n'y aura même plus de sommeil »{/red} (l. 8-11). Le sommeil suppose que l'âme se retire en partie de l'activité du corps ; une forme collée à sa matière ne se retire de rien.
    - **Il n'y aurait plus de conflit intérieur.** {teal}« Si l'âme était entéléchie, il ne pourrait pas même y avoir d'opposition entre la raison et les désirs »{/teal} : {red}le tout serait affecté d'une seule et même manière{/red} (l. 11-14). Or la raison combat souvent le désir ; une forme ne lutte pas contre la matière qu'elle informe.

    **__Aucune partie de l'âme n'est une forme inséparable.__** Plotin les passe en revue, dans l'ordre d'Aristote.

    - **L'âme qui pense.** Avec une âme-forme, {red}il n'y aurait que des sensations{/red}. {teal}« Voilà pourquoi ils introduisent une autre âme, l'intellect, qu'ils tiennent pour immortelle »{/teal} (l. 14-16) : Aristote lui-même reconnaît une partie séparée. {teal}« L'âme qui raisonne doit donc être entéléchie dans un autre sens que celui-là »{/teal} (l. 16-17).
    - **L'âme qui sent et se souvient.** Si elle garde les empreintes des objets absents, elle les garde {teal}« sans l'aide du corps »{/teal} ; sinon, ces empreintes seraient dans le corps comme des figures, {red}« il lui serait alors impossible d'en recevoir d'autres »{/red} (l. 17-22), comme une cire couverte de cachets.
    - **L'âme qui désire.** L'élément qui désire {teal}« non pas les aliments ni les boissons mais les choses autres que corporelles »{/teal} ne peut pas être la forme du corps (l. 22-25) : l'estomac ne désire pas la justice.
    - **L'âme végétative.** Plotin prend l'exemple de la plante dont tout le reste se dessèche alors que la racine vit encore : l'âme {yellow}{teal}« s'est concentrée en une seule »{/teal} partie{/yellow}, la racine, après avoir abandonné les autres (l. 25-31). Et toute la plante, avant de grandir, était dans {teal}« cette petite masse »{/teal}. Une âme qui se retire et se concentre n'est pas répandue dans tout le corps comme une forme inséparable.

    **__L'âme passe d'un corps à un autre.__** Si l'âme passe d'une grande plante dans une petite, et d'une petite dans une plante entière, {teal}« qu'est-ce qui l'empêche d'être aussi totalement séparée ? »{/teal} Et {teal}« c'est la même âme qui passe d'un vivant à un autre »{/teal} : comment le pourrait-elle si elle était l'entéléchie d'un seul (l. 32-38) ?

    **__La conclusion.__** {coral}« Par conséquent l'être de l'âme ne consiste donc pas à être la forme de quelque chose ; elle est une réalité qui ne reçoit pas son être du fait de s'établir dans un corps, mais qui est avant même d'appartenir à ce corps »{/coral} (l. 39-42). Le verbe « s'établir » (*hidrusthai*) est celui qu'on emploie pour les statues des dieux dressées dans les temples. L'âme est donc une {green}réalité{/green} au sens fort, alors que {red}tout ce qui relève du corps doit être dit **devenir**{/red}, et non réalité, {teal}« dans la mesure où cela naît et périt, n'est jamais réellement et n'est sauvegardé que par participation à l'être »{/teal} (l. 45-48).

    ! Plotin ne rejette pas Aristote en bloc : il lui emprunte la plupart de ses arguments contre les stoïciens, et ne lui reproche que de n'être pas allé jusqu'au bout de la séparation de l'âme, dont l'intellect séparé est déjà l'aveu.

    ! Ce chapitre ne figure dans aucun manuscrit des *Ennéades* : il n'est connu que par la citation qu'en donne Eusèbe dans sa *Préparation évangélique*.
