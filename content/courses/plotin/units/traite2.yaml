- id: traite2-l5
  title: "Le souffle « disposé » et les effets contraires (chap. 4)"
  notes: |-
    Le chapitre 4 retourne contre les stoïciens leurs propres concessions : en parlant d'un souffle « intelligent » et « disposé d'une certaine manière », ils reconnaissent déjà, sans le dire, qu'il y a dans l'âme autre chose qu'un corps.

    **Un aveu.** Les stoïciens disent que le souffle de l'âme est un « feu intelligent » : ils sont **« conduits par la vérité »** à admettre qu'une forme d'âme est antérieure et supérieure aux corps. Mais au lieu d'installer les corps dans les puissances de l'âme, ils cherchent un corps où installer l'intelligence, comme si elle ne pouvait être sans un feu ou un souffle pour la porter.

    **Le dilemme de la « manière d'être ».** Tout souffle n'est pas une âme : le vent en est un, et il ne vit pas. Les stoïciens disent donc que l'âme est un souffle **« disposé d'une certaine manière »** (*pôs ekhon*), comme le poing n'est rien d'autre que la main, mais disposée d'une certaine façon. Or cette manière d'être est quelque chose, ou elle n'est rien.

    - {red}Si elle n'est rien{/red}, l'âme n'est que du souffle, et « manière d'être » n'est qu'un mot : il faudrait dire alors que l'âme et le dieu ne sont que matière, et que tout le reste n'est que mots.
    - {green}Si elle est quelque chose{/green}, présent dans la matière sans être fait de matière, alors c'est **une raison**, non un corps : « une autre nature ». Le matérialisme s'arrête là où commence la disposition.

    **Second argument : les effets.** Un corps agit selon ses qualités, et toujours dans le même sens : le chaud chauffe, le froid refroidit, le noir noircit ; {teal}« ce n'est pas le propre du feu que de refroidir »{/teal}. L'âme, elle, produit des effets différents selon les vivants, et même **contraires** dans un même vivant : elle durcit les os et amollit la chair, rend telle partie dense et telle autre rare, telle autre noire ou blanche. Une même cause corporelle ne ferait jamais cela. L'âme agit donc non comme une qualité, mais comme une **raison** qui sait ce qu'il faut faire à chaque endroit.

    ! Le « poing » n'est pas un exemple de Plotin, mais l'exemple stoïcien du *pôs ekhon* : une main disposée d'une certaine manière. L'objection est que la disposition qui fait d'un souffle une âme ne peut pas être, elle, un corps.
