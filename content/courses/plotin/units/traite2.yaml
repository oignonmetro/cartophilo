- id: traite2-l10
  title: "Ni harmonie ni entéléchie : l'âme n'est forme d'aucun corps (chap. 8⁴-8⁵)"
  notes: |-
    Les chapitres 8⁴ et 8⁵ écartent une solution plus fine que le matérialisme : l'âme ne serait pas un corps, mais quelque chose du corps, sa bonne proportion ou sa forme. Plotin montre que c'est encore la faire dépendre de ce qu'elle produit.

    **L'âme-harmonie** (chap. 8⁴). Comme les cordes tendues d'une lyre produisent une harmonie, le corps, mélange bien proportionné, produirait la vie et l'âme. Plotin reprend contre cette thèse les arguments du *{sky}Phédon{/sky}* et d'Aristote.

    - L'âme est **antérieure** ; l'harmonie est **postérieure** aux cordes qu'elle accorde.
    - L'âme **gouverne** le corps et le **combat** souvent (le désir contre la raison) ; une harmonie ne combat pas les cordes dont elle résulte.
    - L'âme est une réalité (*ousia*) ; l'harmonie n'est qu'un rapport.
    - Un mélange bien proportionné, c'est **la santé**, non l'âme ; et chaque partie du corps, d'un mélange différent, aurait son âme.
    - Surtout, {teal}une harmonie suppose un musicien{/teal}, qui a en lui le rapport et règle les cordes. Il faudrait donc une autre âme avant l'âme-harmonie. On fait sortir {red}l'animé de l'inanimé et l'ordre du désordre{/red}.

    **L'âme-entéléchie** (chap. 8⁵). Pour Aristote, l'âme est **l'entéléchie** (la réalisation, la forme) « d'un corps naturel organisé ayant la vie en puissance », comme la figure de la statue est la forme du bronze. Plotin en tire les conséquences.

    - Couper le corps, ce serait couper l'âme.
    - L'âme ne pourrait se retirer dans le **sommeil**, et il n'y aurait même plus de sommeil.
    - Il n'y aurait pas de **conflit entre la raison et les désirs** : une forme ne lutte pas contre sa matière.
    - Il n'y aurait que des sensations, pas d'intellection : c'est pourquoi Aristote lui-même pose un **intellect séparé et immortel**. Il reconnaît donc qu'une partie de l'âme n'est forme d'aucun corps.
    - Même l'âme végétative n'est pas inséparable : quand la plante se flétrit, elle **se retire dans la racine**, et toute la plante était d'abord dans une graine.

    **La conclusion vaut pour toute l'âme.** {green}L'âme est une réalité qui est avant même d'appartenir à un corps.{/green} Elle n'est ni corps ni affection du corps, mais action et production. Le corporel, au contraire, **devient** : il naît, périt, et n'existe que par participation à l'être.

    ! Plotin ne rejette pas Aristote en bloc : il lui emprunte la plupart de ses arguments contre les stoïciens, et ne lui reproche que de n'être pas allé jusqu'au bout de la séparation de l'âme.
