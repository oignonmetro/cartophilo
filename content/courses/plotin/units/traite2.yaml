- id: traite2-l13
  title: "Indestructible : ni dissoute, ni divisée, ni altérée (chap. 11-12)"
  notes: |-
    Les chapitres 11 et 12 tirent la conséquence : une réalité qui a la vie par elle-même échappe à toutes les manières dont une chose peut périr.

    **La vie de l'âme n'est pas comme la chaleur du feu** (chap. 11). Le feu peut s'éteindre, non que la chaleur lui vienne du dehors, mais parce qu'il dépend du bois qui le nourrit : quand le combustible manque, le feu disparaît. {teal}« L'âme ne possède pas la vie de cette façon, comme si elle était une matière sous-jacente »{/teal} : il n'y a pas en elle un support qui pourrait cesser de recevoir la vie. **La vie est ce qui fait qu'elle est âme.** Ou bien donc la vie est une réalité vivante par elle-même, et c'est l'âme, immortelle ; ou bien on la traite comme un composé, et en la décomposant on finira par arriver à quelque chose qui se meut de soi, donc immortel ; ou bien c'est une affection venue du dehors, et ce qui l'apporte est immortel, car il ne peut recevoir le contraire de ce qu'il apporte (le *Phédon* : le feu ne reçoit pas le froid).

    **Pourquoi l'âme du monde et pas la nôtre ?** (chap. 12). Si toute âme pouvait périr, tout aurait péri depuis longtemps. Et si l'on accorde l'immortalité à l'âme de l'univers seulement, il faut dire pourquoi : {red}les deux sont principe de mouvement, tiennent la vie d'elles-mêmes, et contemplent les mêmes réalités{/red}. Notre âme, par la **réminiscence**, tire d'elle-même la conception de chaque être en soi ; elle possède donc des sciences éternelles, et elle est antérieure au corps.

    **Les trois manières de périr lui sont étrangères.**

    - **La dissolution** : ce qui a été composé se défait comme il a été composé ; l'âme est une et simple.
    - **La division** : l'âme n'est ni une masse ni une quantité (chap. 5).
    - **L'altération** : elle détruit la forme en laissant la matière ; c'est une affection du composé.

    {coral}L'âme est donc nécessairement indestructible.{/coral}

    ! L'argument par la réminiscence (chap. 12) reprend le *Phédon* : apprendre, c'est se ressouvenir de ce qu'on savait avant de naître.
