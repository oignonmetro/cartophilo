- id: traite2-l9b
  title: "L'âme ne se mélange pas au corps (chap. 8²)"
  notes: |-
    Le chapitre 8² poursuit la réfutation des stoïciens sur un point de leur physique : la __manière dont l'âme serait présente au corps__ (**le** {violet}**mélange**{/violet}). Si l'âme était un corps, elle ne pourrait être partout dans le corps qu'en s'y mélangeant ; or aucune sorte de mélange entre corps ne rend compte de cette présence.

    __**Si l'âme était un corps présent partout dans le corps, elle y serait mélangée**__ (l. 1-2). Deux cas se présentent.

    - Hypothèse 1, {red}le **mélange ordinaire**{/red} : dans un mélange de corps, aucun ingrédient ne reste en acte, {yellow}« tout comme lorsqu'on mélange le doux et l'amer, le doux n'existe plus »{/yellow}. L'âme mélangée {teal}« ne serait plus en acte mais seulement en puissance, perdant ainsi son être même »{/teal}, et {red}« nous n'aurions plus d'âme »{/red} (l. 2-6). Or l'âme anime, sent et pense sans cesse : elle est en acte, donc elle ne s'est pas mélangée au corps de cette façon.
    - Hypothèse 2, {red}le **« mélange total »**{/red} de {sky}Chrysippe{/sky} : deux corps occupent exactement le même lieu, chacun pénétrant l'autre jusque dans ses moindres parties (une goutte de vin se répand dans toute la mer). Plotin montre que c'est impossible, pour deux raisons.

      - __Le volume s'additionne et ne se mélange pas.__ Si un corps en pénètre un autre jusque dans ses plus petites parties sans que rien n'augmente, deux corps occupent la place d'un seul : un litre de vin versé dans un litre d'eau ferait toujours un litre. {teal}« Ce qui est jeté dans le mélange pénètre à travers tout, même à travers ce qui est le plus petit, ce qui précisément est impossible, car le plus grand deviendra égal au plus petit »{/teal} (l. 12-15).
      - __Il faudrait diviser le corps en points.__ Pour qu'il ne reste nulle part un intervalle non pénétré, le corps qui reçoit doit être traversé en chacun de ses points, donc {teal}« que la division du corps se fasse suivant des points »{/teal}. Or un corps n'est divisible à l'infini qu'**en puissance** : on peut toujours le couper encore, mais __il n'est jamais effectivement coupé en une infinité de morceaux__. Le mélange total exigerait que ses parties soient infinies **en acte** (l. 16-20), ce qui est impossible : __un corps fait de points sans étendue n'aurait plus de grandeur du tout__.

    **D'où la conclusion** : {teal}« Il est donc impossible qu'un corps en pénètre un autre sur le mode du mélange total, alors que l'âme pénètre en totalité. Par conséquent, elle est incorporelle »{/teal} (l. 20-21). Le raisonnement est donc le suivant : l'âme est présente dans tout le corps, jusque dans ses moindres parties ; aucun corps ne peut être ainsi présent dans un autre ; l'âme n'est donc pas un corps. Le principe sous l'argument vient d'Aristote : un {violet}continu{/violet} est __divisible à l'infini *en puissance*__, jamais *en acte*.
