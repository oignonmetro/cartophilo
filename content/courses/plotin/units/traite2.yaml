- id: traite2-plan-ame-corps
  title: "Repérage : la réfutation de l'âme-corps (chap. 2-8³)"
  notes: |-
    Les chapitres 2 à 8³ forment le premier et le plus long mouvement du traité : ils montrent que {red}**l'âme n'est pas un corps**{/red}. Plotin défend d'abord que les corps ne peuvent pas en eux-mêmes insuffler la vie (chap. 2), et écarte ainsi les atomes des {red}épicuriens{/red} (chap. 3, l. 1-6), puis réfute le souffle des {red}stoïciens{/red} **fonction par fonction** : ce que fait l'âme (animer, ordonner, faire croître, sentir, penser), un corps ne peut pas le faire. Les chapitres 8¹ à 8³ en tirent les conséquences : l'âme n'est pas une quantité, ne se mélange pas aux corps, et précède la nature.

    | Moment | Lieu | Ce qui s'y joue |
    | la vie et les éléments | chap. 2 | l'âme ne peut pas être un corps car la matière physique est passive et divisible, tandis que l'âme est la cause active et première de l'existence et de l'animation des corps |
    | atomes et souffle | chap. 3 | l'âme ne saurait consister en un assemblage d'atomes ou d'éléments matériels passifs, car la simple juxtaposition de parties corporelles est incapable de produire la vie ou la conscience |
    | la « manière d'être » | chap. 4 | puisque toute réalité corporelle ne produit qu'un seul effet déterminé par sa qualité propre et que le vivant produit au contraire des effets multiples et opposés, la cause qui ordonne et anime le vivant est donc nécessairement une puissance incorporelle. |
    | croissance et quantité | chap. 5 | la matière corporelle est intrinsèquement incapable d'être le principe de l'existence, de la cohésion et du mouvement de la vie, alors que l'âme, qui n'a pas de quantité et qui est identique à ses parties, le peut |
    | la sensation | chap. 6 | si l'âme était un corps, la sensation, qui demande une unification des stimuli, serait impossible |
    | la douleur | chap. 7 | la douleur du doigt ne se transmet pas de proche en proche |
    | la pensée et la vertu | chap. 8 | si l'âme était un corps, elle ne pourrait percevoir que des formes matérielles et il serait donc impossible de saisir des choses intelligibles ; le sujet doit donc lui-même être de nature incorporelle. |
    | quantité | chap. 8¹ | lorsque la partie d'une réalité est égale et identique au tout, cette réalité excède par définition la quantité spatiale ; et puisque c'est le cas de l'âme, elle est donc totalement incorporelle et inétendue |
    | le mélange total | chap. 8² | l'âme ne pourrait pas pénétrer entièrement un corps si, au lieu d'être incorporelle, elle était un autre corps |
    | la nature avant l'âme ? | chap. 8³ | l'âme ne saurait dériver d'une modification physique accidentelle, car le principe parfait et intelligible précède nécessairement ce qui est inférieur et matériel |
