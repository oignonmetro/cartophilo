- id: traite2-l12c
  title: "L'âme purifiée se découvre divine (chap. 10, l. 29-51)"
  notes: |-
    La seconde moitié du chapitre 10 passe de la démonstration à l'expérience : l'âme purifiée n'a plus à être convaincue de sa divinité, **elle la voit en se regardant elle-même**. Plotin le dit d'abord de l'intellect qu'elle découvre en elle, puis des sciences et des vertus qu'elle y retrouve, et le fait voir par deux images, les statues et l'or.

    __**L'expérience de soi.**__ Que celui qui s'est dépouillé se regarde : {teal}« il croira qu'il est immortel, quand il se contemplera lui-même installé dans l'intelligible et le pur »{/teal} (l. 30-32). Il se verra **intellect**, concevant {teal}« par le moyen de ce qui est éternel »{/teal} ce qui est éternel : __on ne saisit l'éternel que par quelque chose d'éternel en soi, si bien que celui qui pense l'éternel se découvre lui-même éternel__. Il ne contemple pas les intelligibles de loin, il les contient, {teal}« puisque lui aussi est devenu un monde intelligible, un monde lumineux, illuminé par la vérité qui vient du bien »{/teal} (l. 35-36), formule de la {sky}*République*{/sky} (VI, 508d). Il trouvera alors du bon dans le vers d'{sky}Empédocle{/sky} : {teal}« Salut à vous, je suis un dieu immortel »{/teal} (l. 37-38), {teal}« une fois qu'il sera monté jusqu'au divin et qu'il aura les yeux fixés sur la ressemblance qu'il entretient avec lui »{/teal}.

    __**Les vraies sciences sont en elle**__ (l. 40-43). {teal}« Si la purification nous fait parvenir à la connaissance de ce qu'il y a de meilleur, alors les sciences qui sont en elle apparaissent en pleine lumière, elles qui sont véritablement des sciences »{/teal}. La purification n'apporte pas à l'âme un savoir nouveau : **elle met au jour celui qu'elle possédait**. C'est le principe de la réminiscence, dont le chapitre 12 fera une preuve de l'éternité de l'âme.

    **__Les statues intérieures.__** Dans le mythe du {sky}*Phèdre*{/sky} (247d), l'âme contemple {teal}« la tempérance et la justice »{/teal} en faisant avec les dieux le tour du ciel : hors d'elle-même. **Plotin intériorise la scène** : ce n'est pas {teal}« en se précipitant quelque part à l'extérieur d'elle-même »{/teal} qu'elle les voit, mais {teal}« en elle-même, dans la compréhension qu'elle prend d'elle-même et de ce qu'elle était auparavant »{/teal}, c'est-à-dire de l'âme séparée qu'elle était avant de venir dans un corps, {yellow}« comme s'il s'agissait de statues divines dressées en elle, qu'elle voit recouvertes de vert-de-gris par le temps mais dont elle s'emploie à enlever les impuretés »{/yellow} (l. 42-46). L'image croise deux sources : les figures de dieux que le {sky}*Banquet*{/sky} (216e) cache dans les silènes auxquels Alcibiade compare Socrate, et la statue de Glaucos rongée par la mer. Dans les deux cas, **le divin est au-dedans, recouvert, et non absent**.

    **__L'or animé.__** {teal}« C'est comme si l'or avait une âme et se mettait à se débarrasser de toute la boue qui le recouvre »{/teal} : il ignorait sa valeur, il la découvre, et comprend qu'il n'a besoin d'aucune beauté d'emprunt (l. 46-51). L'image dit trois choses : la laideur était un ajout, la valeur était là depuis toujours, et la purification est une découverte de soi.

    ! La purification ne rend pas l'âme divine : elle découvre qu'elle l'était. Rien ne lui est ajouté, on lui retire ce qui la cachait.

    ! Le vers d'Empédocle ne fait pas du moi empirique un dieu : c'est l'âme purifiée, qui se voit intellect, qui peut le reprendre.
