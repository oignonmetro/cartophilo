- id: traite2-l4
  title: "Ni atomes ni souffle : la vie vient d'ailleurs que des corps (chap. 3)"
  notes: |-
    Le chapitre 3 répond aux deux matérialismes de l'époque : celui des épicuriens, réglé en quelques lignes, puis celui des stoïciens, plus subtil, que Plotin poursuivra jusqu'au chapitre 8³.

    **Contre les atomes** (l. 1-6). Pour Épicure, l'âme est un corps de fines parties, des atomes répandus dans le corps et en « sympathie » avec lui. Mais des atomes rassemblés ne forment qu'une **juxtaposition**, non un tout : rien de ce qui est un et partage ses affections ne peut naître de corps qui n'éprouvent rien et ne s'unifient pas. Or {green}l'âme « partage ses affections avec elle-même »{/green} : quand j'ai mal au pied, c'est moi tout entier qui souffre. Un tas d'atomes, lui, ne souffre pas ensemble.

    **Contre les stoïciens, un dilemme** (l. 6-fin). Admettons qu'ils disent : ce n'est pas la matière du corps qui vit, puisqu'elle est sans qualité, mais ce qui en lui « a rang de forme ».

    - Si cette forme est **la réalité** du vivant, alors cette réalité, c'est l'âme, et elle n'est pas un corps : si elle en était un, il faudrait la diviser à nouveau en matière et forme, à l'infini.
    - Si elle n'est qu'**une affection de la matière**, d'où vient-elle ? {red}« La matière ne se configure pas elle-même, pas plus qu'elle ne se donne une âme à elle-même. »{/red}

    **Il faut donc un donateur de vie hors des corps.** Plotin le dit d'une image : ce qui dispense la vie est comme le **chorège** qui, à Athènes, finançait et fournissait un chœur. Et sans cette **« puissance psychique »**, il n'y aurait même pas de corps.

    **Le souffle est le pire candidat.** Tout corps **« s'écoule »** (Héraclite) et périrait aussitôt si tout était corps. Le souffle (*pneuma*), mélange d'air et de feu dont les stoïciens font l'âme, est {red}« le corps le plus divisible qui soit »{/red} et n'a par lui-même aucune unité : lui confier la cohésion de l'univers, c'est livrer le monde au hasard. Quel ordre, quelle raison, quel intellect dans un souffle qui a lui-même besoin d'être ordonné ? Si l'âme existe, au contraire, les corps deviennent ses **auxiliaires** dans l'ordonnancement du monde.

    ! « Chorège » ne veut pas dire que l'âme possède la vie comme une richesse qu'elle distribuerait et perdrait : elle la donne sans s'appauvrir, parce qu'elle l'a par elle-même (chap. 9).
