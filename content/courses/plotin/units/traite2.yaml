- id: traite2-l11
  title: "La vie par soi (chap. 9)"
  notes: |-
    Le chapitre 9 marque le tournant du traité : après avoir dit ce que l'âme n'est pas, Plotin dit ce qu'elle est, une réalité qui a l'être et la vie par elle-même, et qui ne peut donc les perdre.

    **Ce qui n'est pas corps est ce qui est réellement.** Le corps devient, naît et périt ; « l'autre nature » est celle qui a l'être par elle-même. Sans elle, tout périrait et ne reviendrait jamais à l'être, à commencer par l'univers que l'âme met en ordre.

    **L'âme est principe du mouvement** (*Phèdre*, 245c). Elle se meut d'elle-même et meut le reste : {teal}« c'est elle qui dirige le chœur des autres mouvements »{/teal}. Or ce qui se meut de soi a la vie de soi, et **ce qu'on a par soi, on ne peut le perdre** : on ne perd que ce qu'on a reçu. Une maison peut perdre sa chaleur, qui lui vient du feu ; le feu ne perd pas la chaleur qui est sa nature.

    **L'argument de la régression.** {red}Il est impossible que toutes choses aient reçu la vie du dehors, sans quoi on remonterait à l'infini{/red} : chaque vivant devrait sa vie à un autre, qui la devrait à un autre, et rien ne vivrait jamais. Il faut donc une nature **« primitivement vivante »**, qui soit **« impérissable et immortelle »** (*Phédon*), puisqu'elle est le principe de la vie de tout le reste.

    **Ce qui est par soi est toujours.** Le blanc, couleur, ne peut être tantôt blanc, tantôt non blanc : il est blanc par nature. De même, ce qui tient l'être de lui-même ne peut tantôt être, tantôt ne pas être. Et ce qui est ainsi premier ne peut être une chose morte comme la pierre : il est **vivant**, d'une vie pure.

    **D'où vient alors que l'âme paraisse diminuée ?** De son mélange : ce qui est mêlé à l'inférieur rencontre des obstacles pour aller vers le meilleur, sans pourtant perdre sa nature. C'est ce que le chapitre 10 va montrer.

    ! « Avoir la vie par soi » ne veut pas dire que l'âme ne vient de rien : elle est produite par l'Intellect, mais elle ne devient elle-même qu'en se retournant vers lui, et c'est en ce sens qu'elle est cause de soi.
