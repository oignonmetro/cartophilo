- id: traite2-l10
  title: "L'âme n'est pas une harmonie (chap. 8⁴)"
  notes: |-
    Le chapitre 8⁴ ouvre le second mouvement de la réfutation. Puisque l'âme n'est pas un corps, {teal}« il faut chercher laquelle »{/teal} est sa nature : ne serait-elle pas {pink}quelque chose qui ressort d'un corps{/pink}, comme l'harmonie d'un instrument ? Plotin écarte cette solution par une série d'arguments empruntés au {sky}*Phédon*{/sky} et à {sky}Aristote{/sky}, puis par un argument décisif qui est le sien.

    **La thèse visée.** {yellow}Tout comme les cordes tendues d'un instrument produisent une sorte d'affection qu'on appelle « harmonie »{/yellow}, le corps, mélange de parties dissemblables, produirait {red}« la vie et l'âme comme affection résultant de ce mélange »{/red} (l. 5-9). Ce n'est pas l'{pink}harmonie mathématique des pythagoriciens{/pink}, précise Plotin, mais une harmonie de cordes, c'est-à-dire {coral}un effet du corps{/coral}.

    **__Une harmonie ne peut ni précéder le corps, ni le commander, ni subsister par soi.__** Plotin rassemble d'abord les objections déjà faites avant lui.

    - {green}L'âme est antérieure{/green}, {red}l'harmonie postérieure{/red} (l. 10-11) : une harmonie n'existe qu'une fois les cordes tendues, elle suit leur assemblage ; l'âme, elle, est avant le corps qu'elle organise (*Phédon*, 92b-c). Ce qui vient après un assemblage ne peut pas l'avoir produit.
    - L'âme {teal}« gouverne le corps, lui donne des ordres et le combat de multiples façons »{/teal} (l. 11-12) : on s'interdit de boire malgré la soif. Or, en étant {red}__le simple produit de l'assemblage corporel__{/red}, l'{pink}harmonie{/pink} dépend entièrement de l'état de la matière qui la produit. Un {pink}résultat passif{/pink} ne peut que __subir les variations de sa cause matérielle__ ; il ne peut pas se retourner contre elle pour la maîtriser, la corriger ou s'y opposer.
    - {teal}« L'âme doit être une réalité, tandis que l'harmonie n'est pas une réalité »{/teal} (l. 13-14) : une {pink}harmonie{/pink} n'est qu'un rapport entre des éléments, elle ne subsiste pas par soi. C'est une qualité ou une propriété subie qui n'a {pink}pas d'existence propre indépendamment des éléments ajustés{/pink}. (Plotin n'avait encore jamais qualifié l'âme de réalité (*ousia*) : il le fait ici pour la première fois.)
    - L'{yellow}équilibre proportionné{/yellow} des éléments et des qualités physiques du corps (comme le chaud, le froid, le sec et l'humide) {amber}ne produit pas l'âme{/amber}, mais la **santé** corporelle. Réduire l'âme à la juste proportion du mélange corporel revient à confondre le {coral}principe de vie{/coral} avec un simple {coral}état biologique du corps{/coral} : le bon réglage d'un moteur n'est pas le conducteur (Aristote, *De l'âme*, I, 4).
    - Chaque __organe__ et chaque tissu du __corps__ résultent d'__un mélange physique__ et de __proportions particulières__ qui lui sont propres. {coral}**Si l'âme était la résultante d'une proportion matérielle, il y aurait autant d'âmes distinctes dans un seul individu qu'il y a de mélanges locaux dans ses différentes parties corporelles (toute forme d'équilibre corporel).**{/coral}

    __**L'argument décisif : il faut un musicien.**__ {teal}« Enfin, la difficulté la plus importante est qu'il doit nécessairement y avoir, avant cette âme-là, __une autre âme qui soit celle qui produit cette harmonie-là__ »{/teal}, {teal}« comme c'est le cas pour les instruments de musique, où __c'est le musicien qui produit l'harmonie à l'aide des cordes et qui possède en lui le rapport d'après lequel il produira l'harmonie__ »{/teal} (l. 17-21). Car {teal}« ni les cordes dans un cas ni les corps dans l'autre ne peuvent d'eux-mêmes produire l'harmonie »{/teal}. Des morceaux de bois et des cordes jetés dans une boîte ne s'accordent pas seuls en lyre : l'accord suppose quelqu'un qui en a la règle. La thèse se détruit donc elle-même : {coral}**pour qu'il y ait une âme-harmonie, il faudrait une âme d'avant, qui ne serait pas une harmonie**{/coral}.

    **Le fond de l'erreur.** Ces gens {red}« font aussi sortir de l'inanimé l'animé et du désordonné l'ordonné »{/red} (l. 22-24) : au lieu de faire venir l'ordre de l'âme, ils font naître l'âme {red}« d'un ordre en quelque sorte spontané »{/red}. C'est la même faute que chez les stoïciens : faire venir le supérieur de l'inférieur. **L'âme n'est donc pas une harmonie.**

    ! L'harmonie réfutée ici est celle des cordes, un effet du corps. Plotin ne nie pas que l'âme ait en elle des rapports et des raisons : c'est précisément le musicien qui les possède.
