- id: traite2-l4
  title: "Ni atomes ni souffle : la vie vient d'ailleurs que des corps (chap. 3)"
  notes: |-
    Le chapitre 3 répond aux deux matérialismes de l'époque : celui des épicuriens, réglé en quelques lignes, puis celui des stoïciens, plus subtil, que Plotin poursuivra jusqu'au chapitre 8³.

    **Contre les** {red}**atomes**{/red} (l. 1-6). Pour Épicure, l'âme est un corps de fines parties, des atomes répandus dans le corps et en {violet}« sympathie »{/violet} avec lui. Le rassemblement de corpuscules matériels ne constitue qu'une **juxtaposition mécanique** ({violet}*parathesis*{/violet}), mais ne forme en aucun cas __un « tout » véritablement unifié et cohérent__. Or {green}l'âme « partage ses affections avec elle-même »{/green} : quand j'ai mal au pied, c'est moi tout entier qui souffre. Autrement dit, la **vie psychique** suppose une __conscience une et centralisée__ qu'une addition de particules inertes est incapable de produire. Des {red}atomes inanimés, insensibles et dépourvus d'affection{/red} ne peuvent pas, par simple agrégation, {red}engendrer un être capable d'éprouver des sensations{/red}.

    Plotin soulève une difficulté physique et mathématique dans la notion d' {violet}« atome »{/violet} : de composants strictement dépourvus de parties, aucune grandeur ni aucun corps continu ne sauraient véritablement naître.

    **Contre les** {red}**stoïciens**{/red} (l. 6-fin). Plotin propose de prendre au sérieux leur idée, à savoir que __ce n'est pas la matière du corps qui vit__, puisqu'elle est sans qualité, mais {coral}ce qui en lui « a rang de forme »{/coral} et de la soumettre à un **dilemme**.

    - Si cette forme est **la réalité** du vivant, alors cette réalité, {teal}c'est l'âme{/teal}, et elle n'est pas un corps, car si elle en était un, {teal}il faudrait la diviser à nouveau en matière et forme{/teal}, à l'infini.
    - Si elle n'est qu'**une affection de la matière**, __d'où vient-elle__ ? « La matière ne se configure pas elle-même, pas plus qu'elle ne se donne une âme à elle-même. »

    **Il faut donc un donateur de vie hors des corps.** Plotin emploie une image : ce qui dispense la vie est comme le {violet}**chorège**{/violet} qui, à Athènes, finançait et fournissait un chœur. Et sans cette **« puissance psychique »**, il n'y aurait même pas de corps.

    **Le** {violet}**souffle**{/violet} **est le pire candidat.** Car tout corps **« s'écoule »** ({sky}Héraclite{/sky}) et périrait aussitôt s'il n'y avait pas de principe immatériel pour l'unifier et en prendre soin. Le {red}souffle (*pneuma*){/red}, mélange d'air et de feu dont les stoïciens font l'âme, est {red}« le corps le plus divisible qui soit »{/red} et {red}n'a par lui-même aucune unité{/red}. Car __un corps ne peut ni se maintenir lui-même en unité, ni maintenir l'unité d'un autre corps__. C'est au contraire **l'âme incorporelle qui rassemble le corps et empêche sa dissolution**. Si l'âme était un souffle corporel, ce souffle aurait lui-même besoin d'un principe supérieur incorporel pour ne pas se disperser.

    De plus, objecte Plotin, **la matière étant intrinsèquement dépourvue d'intelligence**, aucun souffle physique, quelle que soit sa subtilité, ne peut produire de concepts, de jugements ou d'actes d'intellection.

    Tout {pink}corps{/pink} est fondamentalement {pink}passif{/pink} ou mû de l'extérieur. Définir l'âme comme un corps revient donc pour Plotin à lui ôter sa capacité d'être un **principe premier et autonome de mouvement et d'organisation**. Pour {coral}ordonner et animer la matière{/coral}, l'âme doit lui être antérieure par nature et de nature incorporelle.

    ! « Chorège » ne veut pas dire que l'âme possède la vie comme une richesse qu'elle distribuerait et perdrait : elle la donne sans s'appauvrir, parce qu'elle l'a par elle-même (chap. 9).
