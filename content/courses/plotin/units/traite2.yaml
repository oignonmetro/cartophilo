- id: traite2-plan-forme
  title: "Repérage : l'âme n'est forme d'aucun corps (chap. 8⁴-8⁵)"
  notes: |-
    Les chapitres 8⁴ et 8⁵ écartent une solution plus fine que le matérialisme : l'âme ne serait pas un corps, mais {pink}**quelque chose du corps**{/pink}, sa bonne proportion ou sa forme. Plotin la réfute sous ses deux versions, {pink}l'harmonie des pythagoriciens{/pink} (chap. 8⁴), puis {pink}l'entéléchie d'Aristote{/pink} (chap. 8⁵), et conclut que {green}l'âme est une réalité avant même d'appartenir à un corps{/green}.

    | Moment | Lieu | Ce qui s'y joue |
    | l'harmonie postérieure | chap. 8⁴ | l'âme n'est pas une harmonie, car elle est antérieure au corps et le gouverne, alors que l'harmonie suit les cordes et ne commande rien |
    | le musicien | chap. 8⁴ | une harmonie suppose un musicien qui a en lui le rapport : il faudrait donc une autre âme avant l'âme-harmonie |
    | l'âme divisée | chap. 8⁵ | si l'âme était la forme inséparable du corps, couper le corps reviendrait à couper l'âme |
    | sommeil et conflit | chap. 8⁵ | une forme collée à sa matière ne se retire pas dans le sommeil et ne lutte pas contre ses désirs |
    | l'intellect séparé | chap. 8⁵ | la pensée, la mémoire, le désir de l'incorporel et même l'âme végétative montrent une âme séparable |
    | la réalité avant le corps | chap. 8⁵ | l'âme est une réalité avant d'appartenir au corps, alors que le corporel devient et périt |
