- id: traite2-l11
  title: "La vie par soi (chap. 9)"
  notes: |-
    Le chapitre 9 marque le **tournant** du traité : après avoir dit ce que l'âme n'est pas, Plotin dit ce qu'elle est, {green}une réalité qui a l'être et la vie par elle-même, et qui ne peut donc les perdre{/green}.

    **__Il faut une nature qui ne naît ni ne périt.__** {teal}« L'autre nature, celle qui a l'être par elle-même, c'est tout ce qui est réellement, et qui ne naît ni ne périt »{/teal} (l. 1-2). Sinon, tout périrait sans retour, à commencer par l'univers que l'âme met en ordre : si ce qui sauvegarde toutes choses pouvait être détruit, plus rien ne les ferait revenir à l'être (l. 2-5).

    **__L'âme a la vie par elle-même, donc ne peut la perdre.__** Plotin reprend le {sky}*Phèdre*{/sky} (245c) : l'âme est {teal}« principe du mouvement »{/teal}, elle {teal}« se meut d'elle-même et donne la vie au corps animé, mais [...] a la vie par elle-même et ne peut jamais la perdre parce qu'elle l'a par elle-même »{/teal} (l. 5-8). Le principe sous l'argument : {coral}on ne perd que ce qu'on a reçu{/coral}. Une pièce éclairée par le soleil redevient sombre quand on ferme les volets ; le soleil, lui, ne peut pas perdre une lumière qu'il ne tient de personne.

    **__Il faut un premier vivant, sinon on remonte à l'infini.__** {teal}« Il est impossible en effet que toutes choses aient reçu la vie du dehors, sans quoi on poursuivrait à l'infini »{/teal} (l. 8-10). Si chaque vivant tenait sa vie d'un autre, qui la tiendrait d'un autre encore, la chaîne n'aurait pas de premier anneau, et rien ne vivrait. Il faut donc {teal}« une nature qui soit primitivement vivante, et qui soit de toute nécessité "impérissable et immortelle" »{/teal}, formule du {sky}*Phédon*{/sky}, {teal}« puisqu'elle est aussi le principe de la vie de tous les autres êtres vivants »{/teal} (l. 10-13).

    **__Ce qui a l'être par soi est toujours : l'exemple du blanc__** (l. 17-22). L'exemple est difficile ; il se lit en trois temps.

    - Le blanc, {teal}« qui en lui-même est une couleur, ne peut pas être tantôt blanc tantôt non blanc »{/teal} : ce qu'une chose est par elle-même, elle ne peut pas cesser de l'être.
    - {teal}« Or si le blanc était un être en plus d'être blanc, il serait toujours. Mais il possède seulement le blanc »{/teal} : le blanc n'a par lui-même que la blancheur, pas l'existence ; c'est pourquoi il peut cesser d'exister, sans jamais cesser d'être blanc tant qu'il existe.
    - {coral}« Or ce qui tient l'être de lui-même et primitivement sera toujours un être »{/coral} : ce qui a l'**être** par lui-même, comme le blanc a la blancheur, ne peut pas plus cesser d'être que le blanc ne peut devenir noir.

    Platon donnait dans le *Phédon* un exemple voisin : le trois ne peut devenir pair, parce que l'impair lui appartient par lui-même.

    **__Ce premier être est vivant.__** Ce qui est {teal}« l'être primitivement et toujours ne peut être quelque chose de mort, comme la pierre ou le bois, mais il doit être vivant »{/teal}, d'une vie pure (l. 22-24) : une pierre dure des siècles, mais elle ne produit rien et ne sait rien ; ce qui fait être et ordonne le reste ne peut être moins que ce qu'il cause.

    **__D'où vient alors que l'âme paraisse diminuée ?__** De son mélange : {teal}« tout ce qui est mélangé à quelque chose d'inférieur rencontre des obstacles pour aller vers ce qu'il y a de meilleur »{/teal}, sans pourtant perdre sa nature, qu'il recouvre en remontant vers ce qui lui est propre (l. 25-28). C'est ce que le chapitre 10 va montrer.

    ! « Avoir la vie par soi » ne veut pas dire que l'âme ne vient de rien : elle est produite par l'Intellect, mais elle ne devient elle-même qu'en se retournant vers lui, et c'est en ce sens qu'elle possède par elle-même l'existence.

    ! L'exemple du blanc ne compare pas l'âme à une couleur : il fait comprendre la différence entre avoir une propriété par soi et l'avoir reçue.
