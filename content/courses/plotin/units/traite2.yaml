- id: traite2-l13
  title: "La vie n'est pas reçue : l'âme ne peut la perdre (chap. 11)"
  notes: |-
    Le chapitre 11 tire la conséquence des chapitres 9 et 10 : {teal}« D'une telle réalité, quel homme de bon sens dirait, dans une discussion, qu'elle n'est pas immortelle ? »{/teal} (l. 1-2). Il précise **en quel sens l'âme a la vie**, et montre que, {coral}de quelque façon qu'on pense la vie, on arrive à quelque chose d'immortel{/coral}.

    __**L'âme n'a pas la vie**__ {yellow}__**comme le feu sa chaleur**__{/yellow}__**.**__ Plotin prend l'exemple du feu. Sa chaleur ne lui vient pas de l'extérieur ; et pourtant le feu peut disparaître, parce qu'il dépend du {yellow}bois, son matériau combustible{/yellow} : {teal}« c'est par celui-ci que le feu disparaîtra »{/teal} (l. 4-7), quand le combustible manque. {teal}« Mais l'âme ne possède pas la vie de cette façon, comme si elle était une matière sous-jacente ; __c'est la vie qui est installée en elle qui fait qu'elle est l'âme__ »{/teal} (l. 7-9). Il faut donc distinguer {amber}deux manières de perdre une propriété{/amber} : la perdre elle-même, ou perdre le support qui la porte. {yellow}Le feu ne perd pas sa chaleur, il perd son bois.{/yellow} L'âme, elle, n'a pas de support : elle n'est pas une chose à laquelle la vie viendrait s'ajouter, **la vie est ce qui la fait âme**. Rien ne peut donc s'épuiser sous elle et l'emporter.

    **__Trois façons de penser la vie, une seule conclusion__** (l. 9-17).

    - Hypothèse 1 : {green}la vie est une réalité{/green}, qui possède la vie par elle-même. C'est exactement ce que nous cherchons, l'âme, {teal}« et on admettra alors que cette chose est immortelle »{/teal}.
    - Hypothèse 2 : {coral}la vie est un composé{/coral}. Alors on la décomposera {teal}« jusqu'à ce que l'on parvienne à une chose immortelle qui se meut d'elle-même »{/teal}, comme l'âme du *Phèdre* : dans un mélange, il faut bien un élément qui anime les autres.
    - Hypothèse 3 : {red}« la vie est une affection venue de l'extérieur et acquise par la matière »{/red}. Alors ce d'où elle vient est immortel, {teal}« puisqu'elle ne peut recevoir le contraire de ce qu'elle apporte »{/teal} : c'est l'argument du *Phédon*, où le feu, qui apporte la chaleur, ne reçoit pas le froid ; ce qui apporte la vie ne reçoit pas la mort.

    {coral}Dans les trois cas, il y a au principe de la vie quelque chose d'immortel{/coral}, et {teal}« il n'y a qu'une nature qui vive en acte »{/teal} (l. 17) : seule l'âme vit par elle-même, tout le reste reçoit d'elle la vie. Le **« Certes, mais »** qui introduit la phrase montre que les deux dernières hypothèses n'étaient accordées que pour l'argument : un composé ou une matière ne vivent pas en acte par eux-mêmes, ils ne font que recevoir la vie.

    ! Au début du chapitre, le feu n'est pas l'image de l'âme, mais son contraire : le feu a sa chaleur par lui-même et périt pourtant, parce qu'il dépend d'une matière ; l'âme, elle, ne dépend d'aucune. À l'hypothèse 3, en revanche, le feu du *Phédon*, qui apporte la chaleur, est l'analogue de ce qui apporte la vie.
