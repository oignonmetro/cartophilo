- id: traite2-l9c
  title: "L'âme ne naît pas du froid (chap. 8³)"
  notes: |-
    Le chapitre 8³ achève la réfutation des stoïciens sur la __manière dont l'âme naîtrait__ (**le** {violet}**refroidissement**{/violet}). La thèse matérialiste y aboutit encore à une absurdité, et la conclusion du chapitre referme tout le premier mouvement du traité : {coral}« l'âme n'est ni comme un souffle ni comme un corps »{/coral}.

    __**L'âme ne naît pas du froid**__ (l. 1-5). Les stoïciens disent qu'un même souffle, d'abord {violet}« nature »{/violet} dans l'embryon (comme dans une plante), devient {violet}« âme »{/violet} à la naissance, lorsqu'il est exposé au froid de l'air et s'y affine. Plotin répond par un fait : {teal}« plusieurs vivants naissent dans la chaleur et ils possèdent une âme qui n'a pas été refroidie »{/teal} (l. 3-5) ; il pense sans doute aux astres, vivants nés dans le feu. Si le froid était la cause de l'âme, ce qui naît dans la chaleur n'aurait pas d'âme ; or les astres en ont une. Le froid n'est donc pas ce qui fait l'âme. Et la thèse a un défaut plus grave : elle fait naître l'âme {red}« sous l'effet de circonstances extérieures »{/red} (l. 6), comme un accident de température.

    **__Ils mettent le monde à l'envers__** (l. 5-14). Chez eux, un même souffle, selon qu'il est plus ou moins tendu, est « tenue » (*hexis*) dans les pierres, « nature » dans les plantes, « âme » dans les animaux, et l'intellect vient en dernier, puisqu'il vient de l'âme. {red}« Les voilà donc qui fabriquent d'abord l'inférieur »{/red} : le meilleur naîtrait du pire. Plotin rétablit l'ordre : si l'intellect est premier, il faut {green}« fabriquer l'âme tout de suite après, puis ensuite la nature »{/green}, et toujours l'inférieur à la suite (l. 9-11).

    **__Pourquoi cet ordre est nécessaire : l'acte précède la puissance__** (l. 13-22). L'argument vient d'Aristote (*Métaphysique*, Θ, 8) :

    - {teal}« Si ce qui est en puissance venait à l'existence avant que ce qui est en acte, c'est-à-dire l'intellect, n'existe, alors ce qui est en puissance ne pourrait pas passer à l'acte »{/teal}, car {teal}« qu'est-ce qui l'amènera à l'acte s'il n'y a rien d'autre que lui qui lui soit antérieur ? »{/teal} ;
    - s'il y passait de lui-même, ce ne serait encore qu'en {teal}« fixant les yeux sur quelque chose qui est non pas en puissance, mais en acte »{/teal}, et ce modèle, objet de son désir, lui serait supérieur ;
    - {coral}« Par conséquent, le meilleur, qui possède une nature différente du corps et qui est toujours en acte, est antérieur. Par conséquent, l'âme et l'intellect sont antérieurs à la nature. Par conséquent, l'âme n'est ni comme un souffle ni comme un corps. »{/coral}

    Plotin prend lui-même l'image du regard ; on peut penser à l'élève qui ne devient médecin que parce que la médecine existe déjà en acte chez ses maîtres.

    ! Ce n'est pas l'ordre du développement d'un individu (l'enfant pense après avoir grandi) qui est en jeu, mais l'ordre de dépendance : ce qui actualise vient avant ce qui est actualisé. L'Un n'est d'ailleurs pas mentionné ici : la hiérarchie s'arrête à l'intellect, puis à l'âme, à la nature et aux corps.
