- id: traite2-l6
  title: "La croissance et le tout dans la partie (chap. 5)"
  notes: |-
    Le chapitre 5 montre qu'une âme-corps ne pourrait ni mouvoir de façons diverses, ni faire croître, ni rester la même, et que l'âme a une propriété qu'aucun corps n'a : sa partie est identique au tout.

    **Les mouvements** (l. 1-15). Un corps n'a qu'un mouvement, selon sa nature (la pierre tombe, le feu monte). Le vivant en a mille. On répond qu'ils viennent tantôt de **choix**, tantôt de **raisons** : très bien, mais ni le choix ni les raisons n'appartiennent au corps. Le corps n'a de raison que celle qu'on lui a donnée.

    **La croissance.** Si l'âme qui fait croître le corps était elle-même un corps, elle devrait croître avec lui pour rester à sa mesure (le stoïcien Antipater le soutenait : l'âme augmente et diminue avec le corps). Il faudrait donc lui ajouter de la matière. Or ce qu'on ajoute est **soit une âme, soit un corps inanimé** : si c'est une âme, d'où vient-elle et comment partagera-t-elle les souvenirs et les opinions de la première ? Si c'est un corps inanimé, comment s'animera-t-il ? Et si l'âme perd et gagne sans cesse des parties comme le corps, **rien ne restera le même** : comment aurions-nous des souvenirs, comment reconnaîtrions-nous ce qui nous est familier ?

    **Le tout dans la partie** (l. 15-fin). Une quantité ne reste pas ce qu'elle est quand on lui retire quelque chose : deux mètres moins un ne font plus deux mètres. L'âme, elle, est **tout entière** en chaque vivant qu'elle produit. Plotin en donne un fait : {yellow}d'une seule semence naissent parfois des jumeaux, ou chez d'autres vivants une portée entière{/yellow}, et **chacun est un tout**, une âme complète, non un morceau d'âme. La semence s'est répandue en plusieurs lieux sans que l'âme se soit divisée en fractions.

    **D'où la conclusion.** {teal}« Lorsque dans une chose la partie est identique au tout, la réalité de cette chose excède la quantité et doit nécessairement être elle-même dépourvue de quantité »{/teal}. {coral}« L'âme et les raisons sont donc dépourvues de quantité. »{/coral} L'âme est une qualité, non une quantité : comme une qualité, elle reste la même quand le corps diminue.

    ! « Tout entière en chaque partie » ne veut pas dire que l'âme se multiplie en copies : elle reste une, présente partout sans être répartie.
