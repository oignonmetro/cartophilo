- id: traite2-l15
  title: "Les autres âmes, et la preuve par l'opinion (chap. 14-15)"
  notes: |-
    Les chapitres 14 et 15 étendent la conclusion à toutes les âmes, puis ajoutent, pour ceux qui ne se contentent pas d'une démonstration, une preuve tirée des croyances communes.

    **Toutes les âmes sont immortelles** (chap. 14). Celles des animaux d'abord : ce sont des âmes humaines qui ont commis des fautes et sont venues jusque dans des corps de bêtes (Plotin admet la **transmigration**, comme le *Timée*). Celles des plantes aussi : elles viennent du même principe, ont leur vie propre, sont incorporelles et indivisibles.

    **Mais l'âme humaine n'est-elle pas composée de trois parties**, comme le dit la *République*, et donc dissoluble ? Plotin répond : {green}les âmes pures, une fois affranchies, abandonnent ce qui leur fut « accolé » à la naissance{/green} ; les autres le gardent longtemps. Et même cet élément inférieur ne périt pas, tant que dure ce dont il vient. Car {teal}« rien de ce qui vient de ce qui est ne périt »{/teal}.

    **La preuve par l'opinion** (chap. 15). Plotin a dit ce qu'il fallait « à ceux qui avaient besoin d'une démonstration ». Pour les autres, il rappelle des faits : les oracles ordonnent d'apaiser la colère des âmes qu'on a lésées ; tous les hommes rendent des honneurs aux morts comme à des êtres qui sentent ; bien des âmes continuent, après la mort, de rendre service aux vivants. Ce chapitre est une annexe : **il ne prouve rien par lui-même**, il montre que la croyance commune s'accorde avec la démonstration.

    ! « Accolé » ne qualifie pas le corps, mais les parties inférieures de l'âme : c'est elles que l'âme pure laisse derrière elle.
