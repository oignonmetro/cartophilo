- id: traite2-plan-forme
  title: "Repérage : l'âme n'est forme d'aucun corps (chap. 8⁴-8⁵)"
  notes: |-
    Les chapitres 8⁴ et 8⁵ écartent une solution plus fine que le matérialisme : l'âme ne serait pas un corps, mais {pink}**quelque chose du corps**{/pink}, sa bonne proportion ou sa forme. Plotin la réfute sous ses deux versions, {pink}l'harmonie des pythagoriciens{/pink} (chap. 8⁴), puis {pink}l'entéléchie d'Aristote{/pink} (chap. 8⁵), et conclut que {green}l'âme est une réalité avant même d'appartenir à un corps{/green}.

    | Moment | Lieu | Ce qui s'y joue |
    | l'harmonie postérieure | chap. 8⁴ | l'âme est antérieure et gouverne ; l'harmonie suit les cordes |
    | le musicien | chap. 8⁴ | une harmonie suppose un musicien, donc une autre âme |
    | l'âme divisée | chap. 8⁵ | couper le corps, ce serait couper l'âme |
    | sommeil et conflit | chap. 8⁵ | une forme ne se retire pas et ne lutte pas contre sa matière |
    | l'intellect séparé | chap. 8⁵ | Aristote lui-même sépare une partie de l'âme |
    | la réalité avant le corps | chap. 8⁵ | l'âme est avant d'appartenir au corps ; le corporel devient |
