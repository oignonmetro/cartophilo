- id: traite2-l5
  title: "Divine, immortelle, intelligible : une descente partielle"
  notes: |-
    **La réfutation s'achève sur le constat d'une altérité tranchée : l'âme est d'une « autre nature » que corporelle.** Les chapitres 9 à 12 répètent qu'elle est une réalité **divine**, **incorporelle** et **intelligible**. Seule l'âme a une existence (une `ὑπόστασις`) ; le corps en est dépourvu.

    - L'incorporation n'est pas un « mélange » de deux natures homogènes : c'est une **production du corps par l'âme**, et la vie est l'effet de l'existence, du mouvement et du soin que le producteur donne à son produit.
    - Plotin lit la fin du livre X de la *République* (608c sq.) : l'incorporation est pour l'âme une **mutilation**, sans que sa véritable nature soit modifiée.
    - Le paradoxe n'est qu'apparent : l'âme, troublée par son activité auprès des corps, ne quitte pas sa nature et son lieu propre, l'intelligible. Elle appartient à l'intelligible (chap. 10) et ne quitte pas son principe (chap. 13) : sa **« descente dans les corps »** n'est que **partielle**.

    **Pourquoi l'âme descend-elle ?** Le chapitre 13 l'impute rapidement à un **désir** de l'âme : produire un ordre conforme à ce qu'elle voit dans l'intelligible. Plotin avoue que cela ne résout pas tout, mais la solution restera : l'âme produit les corps sans quitter l'Intellect, son géniteur, et cette production est pour elle une **nécessité**.

    ! Ce qui « descend » n'est pas l'âme entière, mais la part d'elle-même qui « s'avance » dans les corps ; l'âme subsiste essentiellement hors d'eux.
