- id: traite2-l3
  title: "L'âme corporelle des stoïciens"
  notes: |-
    **La réfutation des chapitres 3 à 8³ s'en prend à la doctrine stoïcienne selon laquelle l'âme est un « souffle (`πνεῦμα`) corporel »**, divisé en parties répandues dans tout le vivant. Les objections de Plotin sont pour la plupart d'**origine aristotélicienne** : il s'appuie sur le livre I du traité *De l'âme* d'Aristote et sur le traité homonyme d'**Alexandre d'Aphrodise**. Le traité 2 est ainsi devenu un document doxographique de première importance sur le stoïcisme.

    **Dire, comme les stoïciens, que l'âme est un souffle « d'une certaine manière »** ne sauve rien : on ne peut plus rendre compte ni du mouvement ni de l'organisation des corps. L'existence même d'un corps suppose un principe incorporel, une âme indivisible qui agit sur lui sans subir ses changements.

    Les raisons sont surtout **« psychologiques »** :

    - **la mémoire** : sans âme séparée, rien de ce que perçoit le corps ne serait conservé (les sens n'ont pas de mémoire propre) ;
    - **la sensation** : les perceptions ne seraient pas associées en la sensation d'un même objet ;
    - **la pensée** : il est impossible de l'imputer à un corps ;
    - **la qualité** psychique se distingue de la **quantité** corporelle (chap. 8¹).

    ! La plupart des armes de Plotin contre les stoïciens sont empruntées à Aristote, qu'il réfutera pourtant au chapitre 8⁵.
  points:
