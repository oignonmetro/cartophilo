- id: traite2-l2
  title: "La question : sommes-nous immortels ? (chap. 1)"
  notes: |-
    Le chapitre 1 ouvre le traité en déplaçant la question : savoir si nous sommes immortels, c'est d'abord savoir **ce que nous sommes**. Si nous sommes notre corps, nous périssons ; si nous sommes notre âme, tout dépend de ce qu'est l'âme.

    **Trois réponses sont possibles** : a) chacun de nous est immortel ; ou b) entièrement détruit ; ou c) en partie seulement, au sens où {red}certaines parties se dispersant{/red} tandis que {green}celles qui sont « ce que nous sommes nous-mêmes » subsistent{/green}. Plotin veut trancher **« conformément à la nature »**, c'est-à-dire par l'examen de ce que sont les choses, et non par la foi ou la tradition (qui ne viendront qu'en annexe, chap. 15).

    **Premier constat : le corps ne peut pas durer.** Il est composé, et ce qui est composé peut se défaire ; la sensation elle-même montre qu'il se divise, se disperse, que ses éléments retournent chacun à leur lieu, surtout quand l'âme, qui les tenait rassemblés, n'est plus là : c'est le cadavre qui se décompose. Même un corps simple n'est pas vraiment un, puisqu'il se divise encore en **forme et matière**, et qu'ayant une grandeur il est divisible à l'infini. Donc, {red}si le corps est une partie de nous, nous ne sommes pas entièrement immortels{/red}.

    **Second constat : le corps n'est pas ce que nous sommes.** Qu'on pense le rapport de l'âme et du corps à la manière d'Aristote (comme la {violet}forme{/violet} et la {violet}matière{/violet}) ou à la manière de l'{sky}*Alcibiade*{/sky} de Platon (comme l'{violet}usager{/violet} et l'{violet}instrument{/violet}), le résultat est le même : ce qui commande, ce qui donne au tout son identité, c'est l'âme. {teal}« Dans les deux cas de figure, l'âme est le soi »{/teal}. On n'a donc pas à choisir entre les deux modèles : il suffit qu'ils s'accordent sur ce point.

    **Il reste à savoir ce qu'est l'âme**, et c'est tout l'objet du traité. Si elle est un corps, elle se défait comme lui ; si elle est « d'une autre nature », il faudra montrer laquelle. D'où le plan : réfuter d'abord ceux qui font de l'âme un corps (chap. 2-8³), puis dire ce qu'elle est (chap. 9-12).

    ! Plotin ne méprise pas le corps : il en fait l'instrument de l'âme, qu'elle produit et dont elle prend soin. Ce qu'il refuse, c'est d'y voir ce que nous sommes.
