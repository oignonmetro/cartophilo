- id: ame6-l4
  title: "Des appuis platoniciens : la plante céleste et Glaucos"
  notes: |-
    **La non-descente n'a rien de paradoxal pour un platonicien : Plotin pouvait l'appuyer sur des textes solides de Platon, d'abord** {coral}**la plante céleste du *Timée* et la statue de Glaucos de la *République***{/coral}. C'est même ce qui rend son « audace » énigmatique ([[ame7|unité suivante]]).

    **La plante céleste** (*{sky}Timée{/sky}*, 90a-b) :

    {teal}« {/teal}En ce qui concerne l'espèce d'âme qui en nous domine, il faut se faire l'idée que voici. En fait, {teal}un dieu a donné à chacun de nous, __comme démon__, cette espèce-là d'âme{/teal} dont nous disons, ce qui est parfaitement exact, qu'elle habite dans {teal}la partie supérieure de notre corps{/teal}, et qu'elle nous élève au-dessus de la terre vers ce qui, dans le ciel, lui est apparenté, car {teal}nous sommes __une plante non point terrestre, mais céleste__{/teal}. C'est à cette région en effet, à partir de laquelle poussa la première naissance de l'âme, que {teal}le divin a accroché __notre tête, comme notre racine__{/teal}, redressant tout notre corps{teal} »{/teal}.

    {coral}Enracinée dans le ciel, auquel elle reste suspendue, l'âme garde quelque chose d'elle-même là-haut et ne descend pas tout entière.{/coral} {yellow}Que serait une plante sans ses racines, et sans ce en quoi elles s'enfoncent ?{/yellow} La métaphore de la plante, comme celle de la consubstantialité, est rebelle à l'idée de discontinuité. Quelques lignes plus loin, Platon demande que celui qui contemple {teal}« {/teal}se rende {teal}__semblable à ce qui est contemplé__{/teal} en conformité avec {teal}__sa nature originelle__ »{/teal} (90d4-5).

    **La statue de Glaucos** (*{sky}République{/sky}*, X, 611b-e). {yellow}Le dieu marin Glaucos, recouvert de coquillages et d'algues, n'est plus reconnaissable{/yellow} : sa splendeur n'est pas détruite, elle est cachée. Ainsi de l'âme dans le corps. Plotin s'en sert dès le [[traite2|traité 2]] : {teal}« {/teal}tout ce qui est mélangé à quelque chose d'inférieur rencontre des obstacles pour aller vers ce qu'il y a de meilleur, et pourtant {teal}__il ne peut certainement pas perdre la nature qui est la sienne__{/teal}, et pour {teal}regagner son état ancien{/teal}, lorsqu'il remonte vers ce qui lui est propre{teal} »{/teal} (9, 26-29). Et encore au [[traite53|traité 53]] : {teal}« {/teal}Nous avons vu l'âme comme ceux qui voient Glaucos, le dieu marin… {teal}__Il faut arracher ce qui s'est ajouté à elle__{/teal}, si l'on veut voir {teal}sa vraie nature{/teal}, et considérer son amour de la sagesse, ce à quoi elle se rattache et {teal}par quelle parenté elle est ce qu'elle est »{/teal} (12, 13-17).

    **Une exégèse endogène.** Pour {sky}Szlezák{/sky}, la thèse est **le fruit d'une exégèse platonicienne parfaitement endogène**, issue d'abord de la statue de Glaucos, figure de l'âme immergée dans le sensible qui ne perd pas sa nature profonde. Plotin n'avait pas besoin de forcer ces textes (voir aussi *Phédon*, 84b ; *Timée*, 41a-d) ; il pouvait même tenir sa lecture face au *{sky}Phèdre{/sky}* (248a et suiv.), où les âmes partielles descendent dans la génération.

    ! La plante céleste n'est pas une plante renversée par jeu : c'est une thèse sur l'origine, l'âme pousse depuis le ciel, et elle y reste attachée comme toute plante à sa racine.
