# Cours « L'âme et sa descente », voir l'en-tête de ame1.yaml.
# ame6 : l'âme non descendue (Narbonne, p. 691-698 et 700-701 ; Lacroix,
# p. 28-29 et 104). Citations de Plotin dans la traduction de Narbonne, sauf
# le traité 6 (GF, comme dans traite6 et g-ame-non-descendue) ; Timée, 90a-b,
# dans la traduction que cite Narbonne.

id: ame6
title: "L'âme non descendue"
subtitle: "Quelque chose de l'âme reste toujours là-haut : la thèse, ce qu'elle permet, ses appuis platoniciens, ses éclipses"
group: "L'âme et sa descente"
icon: column
color: teal
lessons:
- id: ame6-l1
  title: "La thèse : la tête restée au ciel"
  notes: |-
    **Thèse cardinale du plotinisme ({sky}Harder{/sky}), la non-descente partielle de l'âme garantit à l'âme humaine incorporée** {coral}**un lien direct et ininterrompu avec les réalités transcendantes**{/coral} **: notre âme n'est jamais descendue tout entière, quelque chose d'elle reste toujours dans l'intelligible.**

    **La formule du traité 6.** {teal}« {/teal}Et s'il faut oser dire contre l'opinion des autres plus clairement ce que l'on pense, notre âme {teal}__n'a pas plongé tout entière__{/teal} ici-bas, mais quelque chose d'elle {teal}__reste toujours dans l'intelligible__ »{/teal} ([[traite6|traité 6]], 8, 1-3). Et un peu plus loin, pour toutes les âmes : {teal}« Toute âme{/teal} possède une partie inférieure orientée vers le corps et {teal}une partie supérieure orientée vers l'Intellect »{/teal} (8, 11-13).

    **L'image du traité 27 : la tête au ciel.** Les âmes humaines {teal}« {/teal}en viennent à être ici-bas en s'empressant certes de là-haut, mais {teal}__sans aucunement se retrancher de leur principe__{/teal} et de l'Intellect ; car {teal}elles ne sont pas descendues avec l'Intellect{/teal}, mais {teal}elles avancent jusqu'à la terre{/teal}, tandis que {teal}__leur tête est restée fixée fermement en haut du ciel__ »{/teal} ([[traite27|traité 27]], 12, 1-5). {yellow}Un arbre peut étendre ses branches jusqu'au sol sans quitter ses racines{/yellow} : l'âme s'étend jusqu'au corps sans se couper de ce qui la nourrit.

    **Le traité 33 : il n'est pas permis que tout tombe.** Contre les gnostiques, Plotin y décrit trois niveaux dans notre âme : {teal}« {/teal}du sein de notre âme, il y a {teal}__ce qui reste toujours dirigé vers les réalités intelligibles__{/teal}, ce qui se tient {teal}en relation avec ces choses-ci{/teal}, et ce qui se tient {teal}au milieu{/teal} de ces choses. Car {teal}nature aux multiples puissances{/teal}, tantôt l'âme est emportée tout entière vers ce qu'il y a de meilleur en elle et les êtres, tantôt {teal}ce qu'il y a de pire en elle, entraîné vers le bas, entraîne avec lui sa puissance médiane{/teal}. Car {teal}__il n'est pas juste que le tout d'elle soit entraîné vers le bas__ »{/teal} ([[traite33|traité 33]], 2, 4-10).

    | Niveau de notre âme | Il est tourné… |
    | le plus haut | toujours vers l'intelligible |
    | le médian | vers l'un ou l'autre, selon ce qui l'emporte |
    | le plus bas | vers les choses d'ici |

    {coral}La puissance médiane décide de ce que nous sommes{/coral} : entraînée vers le bas par le pire, ou emportée vers le meilleur. Mais **le sommet, lui, ne bouge pas**.

    **Ce que « amphibie » veut dire.** L'âme amphibie ne signifie en aucun cas qu'une de ses parties se retrouve **séparée** de l'intelligible : quand l'âme anime un corps, elle continue d'être reliée au divin, et c'est ce qui lui permet de s'élever, puisqu'elle **conserve son identité divine en elle**. {sky}Lacroix{/sky} y voit la raison du **recentrement en soi-même** que Plotin recommande ([[traite1|traité 1]], 9, 7 ; [[traite9|traité 9]], 7, 28-34) : par cette intériorité, l'individu, le composé âme-corps, peut retrouver l'Intellect et ultimement l'Un.

    **Une thèse présente dans toute l'œuvre**, plus ou moins directement : traités 2, 5, 6, 10, 11, 15, 21, 22, 27, 30, 33, 53 ({sky}Narbonne{/sky} en dresse la liste). Au [[traite5|traité 5]] déjà, certains hommes s'élèvent un peu des choses d'ici-bas {teal}« {/teal}parce que {teal}__la meilleure partie de leur âme__ les conduit{/teal} vers ce qui est plus beau à partir de ce qui est agréable{teal} »{/teal} (1, 10-12).

    ! La partie non descendue n'est pas un « autre » en nous, une âme de rechange : c'est notre âme même, en tant qu'elle n'a jamais cessé de penser.
