- id: ame6-l3
  title: "Parenté ou consubstantialité"
  notes: |-
    **Dire l'âme « parente » du divin, comme Platon, ne suffit pas à la non-descente : il faut la dire** {violet}**consubstantielle**{/violet} **({blue}*homoousios*{/blue}) au divin. Le seul texte où Plotin emploie ce mot à propos de l'âme, au** [[traite2|traité 2]]**, est la clef de la thèse.**

    **Le texte.** Après avoir posé que l'âme, différente du corps, est {teal}« {/teal}congénère {teal}avec la nature divine et éternelle »{/teal} (10, 1-2), Plotin poursuit :

    {teal}« {/teal}Si donc l'âme est quelque chose de ce genre, {teal}__chaque fois qu'elle remonte en elle-même__{/teal}, comment n'appartiendrait-elle pas à cette nature, que nous disons être celle de tout ce qui est divin et éternel ? Car {teal}la prudence et la vertu véritables sont choses divines{/teal} et {teal}ne naîtraient pas en une réalité vile et mortelle{/teal}, mais nécessairement ce qui est tel doit être divin, puisqu'il a part aux réalités divines {teal}__du fait de sa parenté et qu'il leur est consubstantiel__ »{/teal} (10, 13-19).

    L'argument : {amber}nous trouvons en nous la vertu et la prudence véritables{/amber} ; {amber}or elles sont divines, et le divin ne naît pas dans le mortel{/amber} ; {coral}donc ce qui les porte en nous est divin.{/coral}

    **Deux mots, deux rapports.**

    | | Parenté (sungeneia) | Consubstantialité (homoousia) |
    | **Origine** | le platonisme le plus classique | inédite chez Platon |
    | **Lien** | un héritage commun | une substance partagée |
    | **Continuité** | rupture : une nouvelle existence | manence dans la substance d'origine |
    | **Non-descente** | incompatible | compatible |

    - La {violet}parenté{/violet} ({blue}*sungeneia*{/blue}) {red}se déploie sur fond de rupture et de discontinuité{/red} : elle renvoie à une connexion **extrinsèque**, et marque une nouvelle existence, une **nouvelle hypostasie**, vis-à-vis de l'apparenté. {yellow}Un fils ressemble à son père, mais vit sa propre vie, ailleurs{/yellow}.
    - La {violet}consubstantialité{/violet} {green}suppose la permanence ininterrompue du lien ontologique{/green} : un fond ou une substance **que l'on partage encore** avec le terme d'origine. {yellow}Une branche ne ressemble pas seulement à l'arbre : la même sève y circule{/yellow}.

    {coral}La non-descente requiert la{/coral} {violet}**manence**{/violet} {coral}dans la substance d'origine : elle s'accorde avec la consubstantialité, non avec la parenté.{/coral}

    **Le réquisit avant la thèse.** Au [[traite2|traité 2]], Plotin ne parle pas encore de non-descente, mais introduit déjà ce qu'elle exige : l'âme qui s'occupe d'un corps, argumente-t-il, **garde quelque chose d'extérieur au corps** (13, 13). Le [[traite6|traité 6]] prolongera : quelque chose d'elle reste toujours dans l'intelligible.

    **Un mot rarissime.** Le terme {blue}*homoousios*{/blue} n'apparaît que deux fois chez Plotin ; l'autre occurrence, au [[traite28|traité 28]] (28, 56), concerne seulement la similitude des affects liés à l'âme végétative. Et Plotin n'emploie que l'adjectif, jamais le nom {blue}*homoousia*{/blue}.

    ! « Consubstantiel » n'a pas encore ici le sens que lui donnera le concile de Nicée (le Père et le Fils) : chez Plotin, il dit que l'âme partage la substance même du divin dont elle provient.
