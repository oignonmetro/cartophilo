- id: ame6-l2
  title: "Pourquoi nous l'ignorons, et ce que la thèse permet"
  notes: |-
    **Si une part de notre âme pense toujours, pourquoi n'en savons-nous rien ? Parce que** {coral}**une chose est d'intelliger, une autre d'être conscient que l'on intellige**{/coral}. Cette distinction des niveaux de conscience est la contrepartie de la non-descente ; et la thèse elle-même sert l'éthique, la connaissance et le salut.

    **L'âme ne sait pas tout ce qui se passe en elle.** L'homme n'a pas conscience de tout ce qui se déroule au sein de son âme, ni plus haut, vers l'Intellect, ni plus bas, vers le corps : de tout ce qu'il intellige et de tout ce qu'il désire.

    - {amber}Intelliger n'est pas savoir qu'on intellige{/amber} ([[traite27|traité 27]], 30, 13-15 ; [[traite53|traité 53]], 9, 15) ; il peut même exister, dans l'âme, **une intellection avant toute sensation et conscience** ([[traite46|traité 46]], 10, 4-6).
    - {amber}Pour prendre conscience de ce qui est plus haut en elle{/amber}, l'âme doit **tourner sa perception vers l'intérieur** ([[traite6|traité 6]], 8, 1-13 ; [[traite10|traité 10]], 12, 12-20). La saisie consciente se dit {blue}*antilêpsis*{/blue}.

    {yellow}Un moulin qu'on n'entend plus parce qu'il tourne toujours{/yellow} : ce n'est pas lui qui s'est arrêté, c'est notre attention qui l'a quitté. Au [[traite6|traité 6]], ce que pense la partie supérieure ne parvient jusqu'à nous que lorsqu'il arrive jusqu'à notre perception ; si la partie sensible est troublée, nous ne le percevons pas.

    **Ce que la thèse permet.**

    - **La remontée.** Puisque l'âme n'a jamais perdu sa structure intellective et divine, elle peut la reconquérir **par elle-même**, à force d'exercices philosophiques. {red}Une âme descendue tout entière dépendrait d'un secours extérieur pour remonter{/red}, et c'est ce que diront {sky}Jamblique{/sky} et les néoplatoniciens après lui ; {green}les avantages de l'approche de Plotin demeurent considérables{/green} ({sky}Narbonne{/sky}).
    - **Le bonheur**, sur le plan éthique : par son enracinement intelligible permanent, la partie non descendue **garantit la félicité** de l'âme ({sky}Linguiti{/sky}). {yellow}Le sage peut souffrir dans son corps sans que son bonheur soit atteint{/yellow}, puisque ce qui fait son bonheur n'est jamais descendu.
    - **L'indépendance de l'âme**, sur le plan ontologique : elle ne doit rien aux conditions sensibles d'existence, ce qui coupe court à une connaissance qui monterait des sensations vers les intelligibles, de type {sky}aristotélicien{/sky} ({sky}Chiaradonna{/sky}). {coral}Nous ne tirons pas les intelligibles des sensations : nous les avons déjà.{/coral}

    **Un salut déjà fait ?** {sky}Bréhier{/sky} a ce mot : pour Plotin, {amber}« notre salut n'est pas à faire, il est éternellement fait, parce qu'il fait partie de l'ordre des choses »{/amber}. {sky}Saffrey{/sky} le rapproche d'une réponse que rapporte Porphyre : invité par Amélius à visiter des sanctuaires, Plotin aurait répondu : {teal}« {/teal}{teal}__C'est à eux de venir à moi__, non à moi d'aller à eux »{/teal} (*Vie de Plotin*, 10). {coral}Si l'âme demeure toujours dans la compagnie des dieux, elle peut attendre leur visite.{/coral} Ce salut « éternellement fait » est pourtant, on le verra, bien plus gnostique que platonicien ([[ame7|unité suivante]]).

    ! Ignorer sa partie supérieure n'est pas la perdre : la non-descente ne dispense pas de l'effort, elle le rend possible ; l'exercice philosophique consiste à devenir conscient de ce qu'on est déjà.
