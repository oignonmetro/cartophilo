- id: ame6-l5
  title: "Une doctrine qui s'efface ? Le traité 49"
  notes: |-
    **Après le traité 33, les références à la non-descente se raréfient, et le** [[traite49|traité 49]] **semble même la démentir :** {red}**« nous ne sommes pas l'Intellect »**{/red}. Les commentateurs se partagent : changement d'orientation, ou tension constitutive de la pensée de Plotin ?

    **Le langage plus sobre de la ressemblance.** Le postulat de l'âme-toujours-altière n'entraîne pas partout l'identification au divin. Au [[traite30|traité 30]], se demandant comment l'âme peut connaître ce qui est au-delà de l'Intellect, Plotin répond : {teal}« {/teal}nous dirons que cela vient de {teal}__ce qui en nous lui est semblable__{/teal} ; car {teal}nous avons aussi en nous quelque chose d'elle »{/teal} (9, 22-23). Et le [[traite53|traité 53]] revient à la **parenté** de Glaucos.

    **Le démenti du traité 49.** Le {violet}noûs{/violet} de l'âme y est décrit comme une {violet}**image**{/violet} ({blue}*eikôn*{/blue}) de l'Intellect véritable, et Plotin déclare tout net {teal}« {/teal}{teal}__que nous ne sommes pas l'Intellect__ »{/teal} ({blue}*ou gar nous hêmeis*{/blue}), mais que nous y aspirons seulement, {teal}« {/teal}autant qu'{teal}une partie de l'âme peut en venir __à la ressemblance avec l'Intellect__ »{/teal} (8, 55-56). Pour {sky}Szlezák{/sky}, il n'y est pas question d'une partie toujours pensante restée en haut : le contact de l'âme avec l'Intellect y est **limité, un événement qui intervient de temps en temps** (« quand », « jusqu'à ce que »), alors qu'une mention de la partie non descendue y aurait été non seulement possible, mais nécessaire. Son absence n'est pas un accident.

    **Le retour du traité 53.** Le [[traite53|traité 53]] rassure : {teal}« {/teal}{teal}__chacun possède l'Intellect tout entier__{/teal} dans {teal}la première partie de son âme »{/teal} (8, 6).

    **Le débat.**

    | Commentateur | Lecture |
    | Narbonne | un recul : la thèse avait surtout pour but de contrer la gnose |
    | Beierwaltes, Ham | une tension constitutive, non un changement |
    | Lacroix | une doctrine stable, précisée au fil des traités |

    - {sky}Narbonne{/sky} : {red}comme si cet enseignement avait surtout eu pour objectif de contrer la gnose{/red}, et que Plotin, une fois le but atteint, avait voulu revenir à une version plus standard des rapports de l'âme aux réalités supérieures. {yellow}On ne brandit une arme que tant que dure le combat.{/yellow}
    - {sky}Beierwaltes{/sky} (suivi par {sky}Ham{/sky}) : {green}l'Intellect est à la fois « non nôtre » et « nôtre »{/green}. Non nôtre, au sens absolu et séparé, parce qu'il est pour nous un fondement transcendant et une mesure ; nôtre, parce que, malgré sa transcendance, **il est toujours déjà agissant comme notre possibilité de penser**.

    ! « Nous ne sommes pas l'Intellect » ne nie pas que l'Intellect soit en nous : le traité 49 refuse l'identité, non la présence. Toute la question est de savoir si cette présence est permanente (traité 6) ou intermittente (traité 49).
