- id: traite15-l5
  title: "La génération de la matière : émanation intégrale ?"
  notes: |-
    **Le chapitre 1 éclaire un difficile problème d'interprétation : la génération de la matière.** Le plotinisme est-il une philosophie de **« l'émanation intégrale »**, où tout, même la matière, procède de l'Un ?

    | Thèse | Ce qu'on y gagne | Ce qu'on y perd |
    | la matière procède de l'Un | l'Un est principe unique de tout | la matière, le mal, procède du Bien |
    | la procession s'arrête avant la matière | le mal ne vient pas du Bien | la matière devient un principe : un **dualisme** proche des gnostiques, que Plotin dénonce (traité 33 (II, 9)) |

    **Trois textes appuient l'émanation intégrale** :

    - le traité 11 (V, 2), 2, 30-31 : l'âme des végétaux engendre « ce en quoi elle se trouve » ; mais cela peut désigner les végétaux eux-mêmes : texte **équivoque** ;
    - le traité 13 (III, 9), 3, 8-16, et le traité 15, 1, 5-16 : l'âme végétative engendre quelque chose d'**« entièrement indéterminé »**, d'**« obscur »**, une **« image »**, un **« non-être »**. Difficile de ne pas y reconnaître la matière.

    **Il est moins difficile pour Plotin de faire procéder le non-être de l'Un que de faire du mal un principe**, d'autant que le *Sophiste* (240c) montrait les « entrelacements » de l'être et du non-être.

    **Mais la matière n'est jamais nommée** dans ces textes : si Plotin reste évasif et ne thématise pas la question, c'est sans doute qu'il demeure des difficultés irréductibles dans cette thèse, qui bouleverse l'opinion de ses prédécesseurs.

    ! Ces textes ne nomment jamais la matière : l'émanation intégrale est une conclusion d'interprète, non une thèse déclarée de Plotin.
  points:
  - id: traite15-l5-p1
    sentence: "La question de savoir si tout, y compris la matière, procède de l'Un est celle de l'« ___ intégrale »."
    answer: "émanation"
    alt: ["emanation"]
  - id: traite15-l5-p2
    sentence: "Si la matière procède de l'Un, on se condamne à dire que le ___, qui est la matière, procède du Bien."
    answer: "mal"
    alt: []
  - id: traite15-l5-p3
    sentence: "Si la matière ne procède pas de l'Un, on adopte un ___ proche de celui des gnostiques."
    answer: "dualisme"
    alt: []
  - id: traite15-l5-p4
