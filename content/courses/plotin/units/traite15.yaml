- id: traite15-l6
  title: "Repérage : le plan du traité 15"
  notes: |-
    **Le traité 15 va de l'âme en général (chap. 1) aux réincarnations (chap. 2), au démon (chap. 3), à l'âme du monde (chap. 4), au choix des vies (chap. 5) et au destin des âmes (chap. 6).**

    | Moment | Lieu | Ce qui s'y joue |
    | l'âme et ses puissances | chap. 1 | la nature engendre une indétermination totale |
    | les réincarnations | chap. 2 | on devient ce qu'on a développé |
    | le démon qu'on est et celui qu'on a | chap. 3 | au-dessus de ce qui agit ; nous le choisissons |
    | l'âme du monde et son corps | chap. 4 | elle n'est pas descendue |
    | le choix des vies | chap. 5 | le mythe d'Er ; la décision revient à l'âme |
    | le destin des âmes | chap. 6 | le sage, l'Hadès, le retour dans les corps |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! La définition du démon (3, 3-5) ne vient qu'après les réincarnations : le démon s'y comprend par le mode de vie.
