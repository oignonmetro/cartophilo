- id: traite15-l2
  title: "On devient ce que l'on a développé : les réincarnations"
  notes: |-
    **Dans les autres vivants, une seule partie de l'âme est active ; dans l'homme, toutes agissent ensemble** (2, 1-11) : nous sommes aussi des êtres sensitifs, et sous bien des rapports des plantes, avec un corps qui croît et engendre. Mais c'est par la partie la meilleure que l'ensemble est « homme ».

    **Le principe des réincarnations** (2, 11-12) : **« quand l'âme quitte le corps, elle devient celle de ses parties qu'elle a développée le plus »**. D'où l'exhortation à **« fuir vers le haut »**, au lieu de se laisser conduire par les images sensibles ou par le désir d'engendrer et la bonne chère.

    | Vie menée | Réincarnation |
    | ceux qui ont préservé « l'homme » | des hommes |
    | ceux qui n'ont vécu que par la sensation | des animaux ; sauvages si l'irascibilité s'y joint |
    | le désir et le plaisir, sans sensation | des plantes |
    | les amis des Muses, s'ils sont purs | des animaux chanteurs |
    | les rois déraisonnables | des aigles |
    | ceux qui étudient le ciel sans réflexion | des oiseaux qui gagnent les hauteurs |
    | la vertu civique, en moindre mesure | un animal civique, une abeille |

    **Qui devient un démon ? « Celui qui l'est déjà ici. »** Qui devient un dieu ? Celui qui l'est déjà ici (3, 1-3). La partie qui guide l'homme après la mort est celle qui était active durant sa vie.

    ! La réincarnation n'est pas une sanction extérieure : elle prolonge ce que l'âme est déjà devenue par sa manière de vivre.
