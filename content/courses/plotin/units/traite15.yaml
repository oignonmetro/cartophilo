- id: traite15-l4
  title: "Le choix des vies, l'âme du monde, le sage"
  notes: |-
    **L'âme du monde et son corps** (chap. 4) : l'âme du monde s'occupe du corps du monde **sans y descendre et sans péril** ; son corps est **« en sécurité »**, et elle n'a pas la conscience. Les âmes humaines ne peuvent s'occuper de leur corps de façon aussi dégagée : plus fragile, il les sollicite et risque de les accaparer.

    **Le choix des vies** (chap. 5) : Plotin interprète le mythe d'**Er** (*République*, X). **C'est à l'âme que revient la décision, non au corps.** Contre les gnostiques peut-être, l'opération qui donne vie aux corps n'entraîne pas par elle-même la chute : elle y expose seulement, et **tout dépend de l'âme**. Le démon ne la redresse pas complètement.

    **Le destin des âmes** (chap. 6) : le **sage** a pour démon **un dieu** (6, 4), car en lui c'est l'intellect qui est actif. Par la définition du chapitre 3, son démon est donc ce qui est au-dessus de l'intellect : **l'Un**. Les âmes qui vont dans des bêtes féroces ont un démon « mauvais ou stupide » ; d'autres vont « là-haut ».

    **La séance de l'Iseion** : selon la *Vie de Plotin* (10), un prêtre égyptien évoqua le démon de Plotin dans l'**Iseion**, le temple d'Isis à Rome ; c'était un dieu, non un démon ; d'où, dit Porphyre, le traité 15. **Le récit paraît une fable** :

    - Porphyre, pour des raisons chronologiques, n'a pu y assister ;
    - Plotin ne parle jamais d'une manifestation du démon ni de rites ;
    - le démon est une partie de l'âme, qui n'est pas sensible ;
    - le démon du sage étant l'Un, c'est l'Un que le prêtre aurait fait apparaître, ce qui est impossible : il ne se donne que dans l'intériorité, **seul à seul**.

    ! Que le démon du sage soit un dieu semble confirmer Porphyre ; c'est en fait ce qui ruine son récit, puisque ce dieu est l'Un.
