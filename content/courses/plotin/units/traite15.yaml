- id: traite15-l3
  title: "Le démon : ce qui se tient au-dessus de ce qui agit"
  notes: |-
    **La définition du démon** (3, 3-8) : ce n'est pas la partie qui agit en nous, mais **ce qui se tient au-dessus d'elle, sans agir**, en accordant son consentement.

    | Ce qui est actif en nous | Notre démon |
    | la partie sensitive | la partie rationnelle |
    | la partie rationnelle | ce qui se tient au-dessus d'elle |

    **Une démonologie « déflationniste »** : dans la religion grecque, depuis **Hésiode** au moins, le démon est une divinité d'un rang intermédiaire entre les hommes et les dieux olympiens, protectrice des hommes. Plotin résorbe les démons dans des réalités déjà posées : **une partie de l'âme a le statut de démon pour les parties inférieures.** Le démon n'est pas un être existant hors de l'âme.

    - **Proclus** lui reprochera de faire des démons, supérieurs à l'âme, des parties de l'âme (*Sur le Premier Alcibiade*, 76).
    - Si Plotin n'a pas besoin d'un intermédiaire entre l'âme et le divin, c'est que **l'âme humaine est à elle-même cet intermédiaire**, « amphibie » (6 (IV, 8), 4) entre l'Intellect et le sensible.

    **C'est nous qui choisissons notre démon** : « C'est donc à bon droit que l'on dit : "Nous le choisirons." Selon la vie que nous choisissons, en effet, nous choisissons ce qui se tient au-dessus de nous » (3, 8-9). L'âme peut ainsi choir, ou s'élever jusqu'au plus haut, et se donner un démon plus élevé : sa responsabilité lui ouvre la possibilité d'un **progrès**. L'homme méchant, imitant ce qui agissait en lui, se transforme en bête féroce.

    ! Le démon n'est pas la partie qui nous dirige activement : c'est celle, juste au-dessus, qui reste inactive et consent.
