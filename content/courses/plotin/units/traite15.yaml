id: traite15
title: "Traité 15 (III, 4) : Sur le démon qui nous a reçus en partage"
subtitle: "L'âme, son propre démon"
icon: compass
color: sky
lessons:
- id: traite15-l1
  title: "Un traité de psychologie, suite du traité 11"
  notes: |-
    **Le traité 15 poursuit l'étude de l'âme** des traités 2 (IV, 7), 4 (IV, 2), 6 (IV, 8) et 11 (V, 2), en s'attachant à l'âme humaine et à son démon. Il va du général au particulier :

    | Lieu | Objet |
    | chap. 1 | l'âme en général, celle des plantes comme celle des hommes, ses puissances |
    | à partir de 2, 6 | la seule âme humaine, et ses réincarnations |
    | à partir de 3, 3 | « le démon qui nous a reçus en partage » |

    **Le thème des démons est traité dans le cadre d'une étude de la métempsycose**, c'est-à-dire de la « psychologie », étude de l'âme.

    **Le traité 15 est la suite du traité 11** : « comme on l'a dit » (1, 2) renvoie au traité 11 (V, 2), 1, 18, et la fin du traité 11 (l'âme des plantes engendre « ce en quoi elle se trouve », à examiner « en prenant un autre point de départ ») annonçait le chapitre 1.

    **Pourquoi parler des démons ?** Parce que, chez Platon, la question des réincarnations est associée au démon qui nous a reçus en partage : *République*, X (le mythe d'**Er**, 614b-621b), *Phédon* (107d, 113d). Plotin, qui conçoit son travail comme une **exégèse** des dialogues, doit se réapproprier ce thème en l'adaptant à sa pensée.

    **Le chapitre 1** : l'âme, à la différence des réalités supérieures, **se meut quand elle engendre**. La nature, présente dans l'homme et dominante dans les plantes, engendre quelque chose de différent d'elle et **sans vie** : **« une indétermination totale »** (1, 11-12), quand l'indétermination des réalités supérieures n'est que relative à leur achèvement. Elle devient un corps en recevant une figure.

    ! Le démon n'est pas le sujet premier du traité : Plotin y vient parce que Platon lie les réincarnations au démon.
  points:
