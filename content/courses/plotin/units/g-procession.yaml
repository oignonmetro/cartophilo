# Entrée du glossaire de Plotin (skill glossaire), nouvelle, 2026-10-21.
# Reprend la leçon « Comment l'Un produit sans changer » de l'ancienne fiche
# Un et trois cartes de Multiplicité intelligible, avec leurs identifiants.
# Citations vérifiées sur la GF (V, 4, 2 ; V, 1, 6 ; V, 2, 1 ; VI, 8, 18).

id: g-procession
title: Procession (`proodos`)
icon: book
color: coral
lessons:
- id: g-procession-l1
  title: Procession
  notes: |-
    Chez Plotin, la {violet}**procession**{/violet} (*proodos*) est [def] ; et ce qui procède ne devient lui-même qu'en se retournant vers sa source.

    __**Il produit parce qu'il est parfait, non parce qu'il manque.**__ C'est la difficulté de départ : pourquoi ce qui ne manque de rien produirait-il quoi que ce soit ? Plotin renverse la question : « c'est justement parce que rien n'était en lui que toutes choses sont venues de lui » ; « étant parfait dans la mesure où il ne cherche rien, il n'a rien et il n'a besoin de rien, __il était comme surabondant__, et sa surabondance a produit une autre chose » ([[traite11|traité 11]], chap. 1). L'Un est la {violet}« puissance de toutes choses »{/violet} (*dunamis pantôn*), non une capacité qui attendrait d'être réalisée, comme chez {sky}Aristote{/sky}, mais **une puissance pleinement active, qui déborde**.

    __**Il produit sans changer : les deux actes.**__ « En chaque chose, il y a __un acte qui appartient à la réalité__ et un acte qui provient de la réalité » ([[traite7|traité 7]], chap. 2). Le premier est la chose même ; le second en découle nécessairement, mais il est autre qu'elle. {yellow}Le feu est chaud en lui-même, et il chauffe ce qui l'entoure sans rien perdre de sa chaleur.{/yellow} De même, ce qui vient de l'Un vient « __sans qu'il se soit incliné ni qu'il le veuille__ ni qu'il ne soit mû d'aucune manière » : c'est « un rayonnement qui émane de lui, alors même qu'il reste immobile, comme c'est le cas du soleil qu'une lumière resplendissante environne » ([[traite10|traité 10]], chap. 6). Et « le centre n'est ni les rayons ni le cercle, mais il est __le père du cercle et des rayons__ » ([[traite39|traité 39]], chap. 18).

    | Image | Ce qu'elle fait voir |
    | le feu | produire sans rien perdre |
    | le soleil | rayonner en restant immobile |
    | le centre | engendrer sans se diviser |

    __**Ce qui procède se constitue en se retournant.**__ Ce qui sort de l'Un n'est d'abord qu'une puissance indéterminée ; elle ne devient quelque chose qu'en regardant sa source : « l'engendré __se tourna vers lui et il en fut rempli__, et, en fixant son regard sur lui, il devint l'Intellect » ([[traite11|traité 11]], chap. 1). La procession ne s'achève donc que par la [[g-epistrophe|conversion]] : **descendre et se retourner sont les deux temps d'un même acte**, et c'est le second qui donne à l'{violet}[[g-intellect|Intellect]]{/violet} sa forme.

    __**Chaque niveau produit à son tour.**__ L'Intellect, « semblable à lui, il produit de la même manière que lui » : il engendre l'[[g-ame|Âme]] en restant en lui-même. L'Âme, elle, « ne produit pas en restant en elle-même, mais, une fois qu'elle est mise en mouvement, __elle engendre une image__ », jusqu'à la nature des plantes. Et pourtant « rien n'est séparé ni coupé de ce qui le précède » : la procession est une continuité, non une suite de ruptures.

    __**Ni écoulement, ni choix, ni événement.**__ Les images de la source et du rayonnement ne doivent pas faire croire à {red}un écoulement de matière{/red} : l'Un ne perd rien, et ce qui vient de lui est une trace, non une part de lui. Elles ne doivent pas non plus faire croire à un choix : l'Un ne veut ni ne calcule. Enfin **la procession n'a pas lieu dans le temps** : l'Intellect dépend de l'Un de toute éternité, comme le cercle de son centre.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 11, chap. 1 | la surabondance, l'engendré qui se retourne |
    | traité 7, chap. 2 | les deux actes, l'exemple du feu |
    | traité 10, chap. 6 | un rayonnement, l'Un immobile |
    | traité 39, chap. 18 | le centre, père du cercle |

    **Voir aussi** : [[g-un|Un]] · [[g-epistrophe|Conversion]] · [[g-intellect|Intellect]] · [[g-ame|Âme]] · [[g-energeia|Acte]] · [[g-dunamis|Puissance]]
