  points:
  - id: g-un-l1-12
    sentence: L'Un, parfait et totalement autarcique, ne manque de rien et n'a besoin ni de penser, ni de vouloir, ni d'agir ; c'est par la seule ___ de sa puissance que la réalité découle de lui.
    answer: surabondance
    alt: []
  - id: g-un-l3-q1
    sentence: "Plotin désigne l'Un comme la « puissance de toutes choses », en grec, translittéré, ___ (traité 7, chap. 2, l. 38)."
    answer: dunamis pantôn
    alt: ["dunamis panton"]
  - id: g-un-l3-q2
    sentence: "La puissance de l'Un n'est pas, comme chez Aristote, une capacité qui attend d'être réalisée : c'est une puissance pleinement ___, qui surabonde."
    answer: active
    alt: []
  - id: g-un-l3-q3
    sentence: "« En chaque chose, il y a un acte qui appartient à la réalité et un acte qui ___ » (traité 7, chap. 2, l. 27-28)."
    answer: provient de la réalité
    alt: []
  - id: g-un-l3-q4
    sentence: "Pour montrer qu'une chose peut produire hors d'elle sans changer, Plotin prend l'exemple du ___, qui chauffe ce qui l'entoure sans rien perdre de sa chaleur propre."
    answer: feu
    alt: []
  - id: g-un-l3-q5
    sentence: "Dans la doctrine des deux actes, l'Intellect est l'acte ___ de l'Un : il en découle nécessairement sans que l'Un sorte de lui-même."
    answer: second
    alt: []
  - id: g-un-l1-13
    sentence: Le mouvement par lequel l'Un produit toute la réalité sans changer ni se diviser se nomme, chez Plotin, la ___.
    answer: procession
    alt: ["émanation"]
  - id: g-un-l3-q6
    sentence: "« Le centre n'est ni les rayons ni le cercle, mais il est le ___ du cercle et des rayons » (traité 39, chap. 18, l. 22-23)."
    answer: père
    alt: ["pere"]
  - id: g-un-l3-q7
    sentence: "« Le centre n'est ni ___, mais il est le père du cercle et des rayons » (traité 39, chap. 18, l. 22-23)."
    answer: les rayons ni le cercle
    alt: []
  - id: g-un-l3-q8
    sentence: "L'image du centre, « père du cercle et des rayons », par laquelle Plotin figure l'Un qui engendre l'Intellect sans se diviser, se lit au chapitre 18 du traité ___."
    answer: 39 (VI, 8)
    alt: ["39", "VI, 8"]
  - id: g-un-l3-q9
    sentence: "Dans l'image du cercle, le centre engendre les rayons sans se ___ : il reste un point, et le cercle entier dépend de lui sans qu'il dépende du cercle."
    answer: diviser
    alt: []
  - id: g-un-l3-q10
    sentence: "La procession n'est pas un événement dans le temps : l'Intellect dépend de l'Un de toute ___, comme le cercle de son centre."
    answer: éternité
    alt: ["eternite"]
  - id: g-multiplicite-intelligible-l3-1
    sentence: "Selon la théorie plotinienne des deux ___, l'Un demeure immobile en lui-même tout en laissant procéder une puissance indéterminée."
    answer: activités
    alt: ["activites", "actes"]
  - id: g-multiplicite-intelligible-l3-2
    sentence: "Ce qui procède de l'Un, avant de se tourner vers lui et d'être déterminé par ce regard, est une puissance ___."
    answer: indéterminée
    alt: ["indeterminee", "informe"]
  - id: g-multiplicite-intelligible-l3-3
    sentence: "En se retournant vers l'Un pour le contempler, mouvement nommé ___ (*epistrophê*), la puissance issue de l'Un ne peut l'embrasser dans sa simplicité."
    answer: conversion
    alt: []
  - id: g-procession-l1-q1
    sentence: "L'Un produit parce qu'il est parfait : « étant parfait dans la mesure où il ne cherche rien, il n'a rien et il n'a besoin de rien, il était comme ___ » (traité 11, chap. 1)."
    answer: surabondant
    alt: []
  - id: g-procession-l1-q2
    sentence: "Ce qui vient de l'Un vient « sans qu'il se soit incliné ni qu'il le ___ ni qu'il ne soit mû d'aucune manière » (traité 10, chap. 6)."
    answer: veuille
    alt: []
  - id: g-procession-l1-q3
    sentence: "Ce qui vient de l'Un est « un rayonnement qui émane de lui, alors même qu'il reste immobile, comme c'est le cas du ___ qu'une lumière resplendissante environne » (traité 10, chap. 6)."
    answer: soleil
    alt: []
  - id: g-procession-l1-q4
    sentence: "La procession s'achève par la conversion : « l'engendré se tourna vers lui et il en fut ___, et, en fixant son regard sur lui, il devint l'Intellect » (traité 11, chap. 1)."
    answer: rempli
    alt: []
  - id: g-procession-l1-q5
    sentence: "La procession est une continuité : « rien n'est séparé ni ___ de ce qui le précède » (traité 11, chap. 1)."
    answer: coupé
    alt: ["coupe"]
  - id: g-procession-l1-q6
    sentence: "À la différence de l'Intellect, qui produit en restant en lui-même, l'Âme « ne produit pas en restant en elle-même, mais, une fois qu'elle est mise en mouvement, elle engendre une ___ » (traité 11, chap. 1)."
    answer: image
    alt: []
