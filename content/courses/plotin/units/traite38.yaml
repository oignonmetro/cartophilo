- id: traite38-l3
  title: "Le vivant total"
  notes: |-
    **Le cheval de là-bas** (chap. 8) : le dieu n'a pas pensé le cheval pour le produire, car la pensée du cheval précédait. Les choses d'ici ont suivi **par nécessité** celles de là-bas : qui arrêterait une puissance capable de demeurer en elle-même et de s'avancer au-delà ? Pourquoi des bêtes en dieu ? Parce que ce qui vient après l'Un doit être multiple : l'Intellect est un **« vivant total »**, et pas seulement l'homme.

    **Les irrationnels** (chap. 9-10) : il n'y a rien de rationnel là-bas, où l'homme est au-delà du raisonnement. Vies et intellections diffèrent par leur clarté ; **même l'intellection du cheval est Intellect**. En procédant, l'intellect s'arrête plus ou moins bas, et trouve en lui le remède à ce qui manque : les ongles, les serres, les dents ou les cornes. Chaque vivant est parfait à sa manière, et l'ensemble est le plus parfait.

    **Plantes, terre, éléments** (chap. 11-12) : la plante d'ici est une raison qui vit ; la croissance des pierres et des montagnes révèle une raison animée dans la terre ; Platon met une âme en chaque élément. Là-bas, rien n'est pauvre : tout est **comme bouillonnant**, comme une qualité unique qui contiendrait toutes les saveurs, les couleurs et les harmonies.

    **L'Intellect varié** (chap. 13-14) : sans altérité, il ne serait même pas une activité. Il vagabonde dans la « plaine de la vérité » sans en sortir ; s'il s'arrêtait, il ne penserait plus, et ne serait plus. Il est **« un-plusieurs »**, comme un visage n'est pas une masse de chair unique ; son unité véritable est une **amitié** sans distinction.

    | Genres du *Sophiste* | Ce qu'ils font voir dans l'Intellect |
    | l'identité et le repos | son rapport immuable à lui-même |
    | la différence et le mouvement | sa vie, qui n'est pas celle d'un cadavre |

    ! Que les formes des bêtes soient là-bas n'abaisse pas l'intelligible : l'irrationnel n'appartient qu'au vivant d'ici-bas.
