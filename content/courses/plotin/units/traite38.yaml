- id: traite38-l7
  title: "Le Bien ne pense pas"
  notes: |-
    **Ce qui instruit et ce qui conduit** (chap. 36) : la connaissance du Bien équivaut à un **toucher** ; c'est « l'objet d'étude le plus élevé » (*République*). Nous instruisent les analogies, les **négations**, la connaissance de ce qui vient de lui, des remontées par échelons ; nous y conduisent les purifications et les vertus. Puis on voit « soudain », et la lumière elle-même est l'objet de la vision.

    **Contre Aristote** (chap. 37) : ceux qui font du premier une pensée de lui-même croient le rendre vénérable par la pensée, alors que c'est lui qui rend la pensée vénérable. S'il est réalité et pensée, il est deux ; s'il est pensée, il ne pense pas, **comme le mouvement ne se meut pas**. Il n'a aucune fonction, et n'en est donc pas privé.

    **Ni « est », ni « je »** (chap. 38-39) : on ne dit pas qu'il « est », ni même « le » Bien ; penser « je suis le Bien », c'est déjà être deux. Il n'a de lui-même qu'une **intuition immédiate**, qui n'est autre que d'être lui-même. Platon dit l'être « planté, reste là vénérable, dans son immobilité » : c'est ce qui ne pense pas qui est vraiment vénérable.

    **Pourquoi il ne pense pas** (chap. 40-41) : la pensée a besoin d'un objet qui la précède, et le Bien n'a rien avant lui. La pensée est donnée comme un **œil** aux natures qui seraient aveugles ; mais la lumière ne cherche pas la lumière. Le « Connais-toi toi-même » s'adresse aux êtres multiples. Du Bien il n'y a « ni discours, ni perception, ni science ».

    **Autour du roi** (chap. 42) : la *Lettre II* dit que « toutes les choses sont autour du roi qui règne sur tout ».

    | Rang | Réalité |
    | premier | le Bien, le roi |
    | deuxième | l'Intellect et les choses belles |
    | troisième | l'âme |
    | suspendu à l'âme | le monde sensible |

    ! Dire que le Bien ne pense pas ne lui ôte aucune perfection : on n'est privé que de ce qu'on a par nature, et il n'a aucune fonction.
