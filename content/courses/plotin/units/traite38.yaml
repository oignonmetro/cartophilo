id: traite38
title: "Traité 38 (VI, 7) : Comment la multiplicité des idées s'est établie et sur le Bien"
subtitle: "De l'Intellect au Bien sans forme"
icon: compass
color: sky
lessons:
- id: traite38-l1
  title: "Le dieu ne raisonne pas"
  notes: |-
    **Un traité en trois parties** : trente-huitième dans l'ordre chronologique, il reprend la procession depuis l'Un (traités 7 et 11) et la remontée vers lui (traités 9 et 10), déjà mêlées au traité 32. Trois parties presque de même longueur : le sensible et l'Intellect (chap. 1-14) ; le Bien du point de vue de ses produits (chap. 15-30) ; le Bien en lui-même (chap. 31-42).

    **La question** (1, 1-21) : selon le *Timée*, le dieu a fixé sur le visage « les yeux porteurs de lumière » pour que les vivants se sauvegardent. Mais ce n'est pas parce que d'autres vivants, sans sensations, auraient péri : Plotin écarte une sorte de **sélection naturelle**. Et un dilemme : ou le dieu a donné ensemble organes et facultés, et les âmes n'avaient pas de sensation avant ; ou elles l'avaient déjà, et entrer dans le devenir, donc dans le mal, leur était **connaturel**.

    **Pas de raisonnement là-bas** (1, 21-2, 55) : un raisonnement part de principes ; ce ne peut être la sensation, qui n'existait pas encore, mais l'intellect, dont la conclusion est science et ne porte sur rien de sensible. **La providence ne résulte donc pas d'un raisonnement** : on parle de raisonnement parce que tout est disposé comme si un homme savant l'avait prévu. Raisonner, c'est choisir « ceci plutôt que cela » ; là où il n'y a qu'une issue, on ne raisonne pas. Le futur est déjà présent là-bas, où tout est « tout ensemble ».

    **Le « quoi » et le « pourquoi »** (2, 1-3, 22) : ici-bas, nous voyons un homme comme une statue, et son « pourquoi » à part ; là-bas, **la chose s'identifie à son « pourquoi »**, comme ici dans la question « qu'est-ce qu'une éclipse ? ». La forme a sa cause en elle-même. Pourquoi les sourcils ? Pour qu'il y ait tout : protéger les yeux n'est qu'une partie d'un tout complet. Platon fait « devenir » le monde, d'où la délibération ; mais en disant qu'il « devient toujours », il supprime le raisonnement.

    ! Le récit du *Timée* n'est pas faux mais métaphorique : il raconte dans le temps ce qui relève de l'éternité.
