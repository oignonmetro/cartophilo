- id: traite38-l4
  title: "Un Bien devenu varié"
  notes: |-
    **L'Intellect, image du Bien** (chap. 15) : à côté de cette vie, les vies d'ici sont « petites, obscures, sans valeur, impures ». L'Intellect est bon parce qu'il contemple : ses objets ont **la forme du Bien** (`ἀγαθοειδής`). Il a reçu du Bien la puissance d'engendrer : le Bien lui a offert **ce qu'il n'avait pas**. Ne pouvant garder une la puissance reçue, il l'a divisée : il est **« un Bien devenu varié »**, comme une sphère vivante, un être qui n'est que visages. Mais il faut devenir cet Intellect, non le voir du dehors.

    **La genèse de l'Intellect** (chap. 16) : il ne regardait pas encore le Bien en intellect ; il vivait près de lui, mouvement **rassasié**, puis il est devenu toutes choses en prenant conscience de lui-même. Comme le **soleil** de la *République*, le Bien est cause de la réalité et du fait qu'elle est vue.

    **Ce qui donne n'a pas** (chap. 17) : « il n'est pas nécessaire que ce qui donne possède ce qu'il donne » ; ce qui donne est supérieur à ce qui est donné. La vie, d'abord indéterminée, est **délimitée** en regardant celui qui n'a pas de limite : l'Intellect est la vie déterminée. Le Bien est sans forme, et c'est pourquoi il produit les formes. L'Intellect est une **trace** du Bien, et une lumière pour l'âme.

    **En quoi tout a la forme du Bien** (chap. 18) : comme ce qui vient du feu est trace du feu, la vie, l'Intellect et l'idée ont la forme du Bien, chacun à sa façon, plus ou moins ; « bon » ne se dit pas d'eux par homonymie.

    La causalité platonicienne des Formes suppose l'homogénéité de la cause et de l'effet : la Forme donne ce qu'elle a. Plotin doit s'en écarter pour garder l'**hétérogénéité** absolue du principe : le Bien ne s'identifie à rien de ce qui vient de lui.

    ! Le Bien n'est cause qu'en un sens faible, de notre point de vue : être « cause » n'est pas pour lui un attribut.
