- id: traite38-l2
  title: "L'homme intelligible et la sensation"
  notes: |-
    **La difficulté** (3, 22-31) : si la faculté de sentir est éternellement dans la forme de l'homme, l'Intellect ne s'incline-t-il pas vers les choses d'ici-bas ? Et n'est-il pas absurde qu'elle ne s'exerce qu'ici, quand l'âme déchoit ?

    **Qu'est-ce que l'homme ?** (chap. 4-5) : ni le composé, ni une définition qui ne dit pas « ce qu'est » la chose, ni l'âme rationnelle, sinon elle resterait homme en passant dans un autre vivant. L'homme est **une raison différente de l'âme**, une activité de l'âme, comme les raisons dans les semences. L'âme met dans le corps une figure tirée d'elle-même, comme un peintre fera une image encore inférieure. Au-dessus, l'homme d'une âme plus divine, aux sensations plus claires.

    **Trois hommes** (chap. 6) : l'homme qui est dans l'Intellect illumine le deuxième, qui illumine le troisième ; chacun de nous est l'homme selon lequel il agit. La faculté de sentir porte là-bas sur des « sensibles » incorporels : l'homme d'ici s'accorde à l'harmonie de là-bas.

    **L'âme et les bêtes** (chap. 6-7) : pure, l'âme veut être homme, car c'est le plus beau ; corrompue, elle façonne une bête, non contre sa nature, mais à un rang inférieur, comme un artisan fait ce qu'on lui commande ; elle se donne une figure comme **le danseur** selon son rôle.

    **Conclusion** (7, 17-31) : les réalités de là-bas ne regardent pas vers ici ; ce sont celles d'ici qui leur sont suspendues et les imitent. **Les sensations d'ici-bas sont des pensées obscures, les pensées de là-bas des sensations claires.**

    ! La sensation de là-bas n'est pas une affection du corps : c'est une perception claire d'incorporels, dont la nôtre n'est qu'une image.
