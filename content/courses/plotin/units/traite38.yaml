- id: traite38-l5
  title: "Le Bien, objet de désir"
  notes: |-
    **Ne pas abandonner le Bien au désir** (chap. 19-20) : il deviendrait un relatif, et chacun désire autre chose. On revient aux couples ordre-désordre, santé-maladie, forme-absence de forme : le premier terme est dans l'espèce du Bien, et l'excellence, l'Intellect, la vie et l'âme sont **« la part du Bien »** (*Philèbe*). Mais l'Intellect n'est pas le terme : tous ne le cherchent pas, tous cherchent le Bien ; on cherche l'Intellect par le raisonnement, le Bien au-delà de la raison.

    **La lumière du Bien** (chap. 21-23) : l'Intellect et la vie ont la forme du Bien ; mais l'âme ne s'en éprend que lorsque le Bien leur donne sa **couleur**, leur donne les Grâces. Elle est alors prise d'une **fureur bachique** et devient amour (*Phèdre*) ; sans cela, elle « reste étendue, indifférente ». La beauté est plutôt **ce qui resplendit sur la proportion** que la proportion : un homme vivant, même laid, est plus beau qu'une belle statue. Le Bien produit l'Intellect, la vie, les âmes, et maintenant les conserve.

    **Difficultés** (chap. 24-28) : un homme acariâtre objecte qu'on met tout « sens dessus dessous ». Réponse : le Bien n'est pas bien parce qu'il est désiré, il est désiré parce qu'il est le Bien. Pour chaque être, le bien est **ce qui le précède** :

    | Pour | Le bien est |
    | la matière | la forme |
    | le corps | l'âme |
    | l'âme | la vertu, puis l'Intellect |
    | l'Intellect | le Bien, le Premier |

    Le plaisir ne suffit pas (chap. 26) : nul ne se contente de la joie que donne un enfant absent. La matière n'a pas de désir : la forme vient sur elle comme un beau rêve (chap. 28).

    **Plaisir et intelligence** (chap. 29-30) : le plaisir ne convient pas au Premier, car c'est l'acquisition de ce dont on a besoin. Platon, dans le *Philèbe*, a mêlé le plaisir à la fin ; c'est une joie de l'intelligence, pure et sans mélange.

    ! Le désir ne fait pas le Bien : il y a désir parce qu'il y a le Bien, et le plaisir n'est qu'une suite de sa possession.
