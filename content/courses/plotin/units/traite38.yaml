- id: traite38-l6
  title: "La beauté sans forme et l'union"
  notes: |-
    **La remontée** (chap. 31) : l'Intellect s'est élevé et reste près du Bien ; l'âme qui l'a vu est « saisie de stupeur » et, comme les amants qui veulent voir l'aimé en personne, se transforme pour lui ressembler. Elle méprise les beautés d'ici, qui se vautrent dans « la boue » des corps.

    **La beauté sans forme** (chap. 32-33) : le principe n'est ni une forme ni l'ensemble des formes : il est **le « sans forme »** dont vient toute forme. Il n'est aucun être, et il est tous les êtres. Sans grandeur ni figure, il suscite un **amour illimité** ; il est une beauté au-delà de la beauté, la fleur qui rend belle toute chose. **La forme n'est qu'une trace du sans-forme.** L'amant n'aime vraiment que lorsqu'il forme en lui une impression non sensible.

    **L'union** (chap. 34-35) : l'âme se dépouille de toute forme, pour recevoir le Bien seule lui seul ; il apparaît « soudain », et ils ne sont plus deux. Elle n'échangerait rien contre lui, pas même le ciel entier ; elle dit plus tard, en silence : « C'est lui ». Comme le visiteur d'une maison richement ornée qui voit enfin le **maître de maison**, elle confond sa vision avec son objet. L'Intellect a deux puissances : il pense, et il aime, **« ivre de nectar »** ; cette ivresse vaut mieux que la sobriété.

    C'est l'expérience d'union déjà décrite au traité 9 (VI, 9), 7-11.

    ! L'union n'est pas une intellection : l'âme s'est faite intellect pour contempler, puis elle abandonne la pensée, qui est mouvement, pour rejoindre le Bien immobile.
