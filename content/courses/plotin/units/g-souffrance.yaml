lessons:
- id: g-souffrance-l1
  title: Souffrance
  notes: |-
    Chez Plotin, la {violet}**souffrance**{/violet} est [def]. Elle n'est pas {pink}une blessure de l'âme{/pink} : le corps vivant souffre, l'âme le sait, et le sage n'en est pas moins heureux.

    __**La souffrance est au corps : elle vient de la matière, qui ne garde pas la mesure, et le composé seul en pâtit.**__ Où est la souffrance quand on a mal ? Dans la chair, répond Plotin : « c'est le corps qui a éprouvé la douleur ; par « qui a éprouvé la douleur », je veux dire « qui a subi cette affection ». Par exemple, __au cours d'une opération chirurgicale__, lorsque le corps est incisé, l'incision se produit dans sa masse, mais le mal qui est ressenti dans cette masse s'explique par le fait qu'il ne s'agit pas seulement d'une masse, mais bien d'une masse qui est vivante. C'est là aussi que se produit l'inflammation, mais __c'est l'âme qui la sent__ » ([[traite28|traité 28]], chap. 19). Une pierre qu'on coupe ne souffre pas : il faut un corps vivant, et c'est lui qui pâtit, car « c'est au contraire le corps qui, si la vie lui est donnée, va recevoir la sensation et les affections qui en résultent » ([[traite53|traité 53]], chap. 4 ; voir [[g-vivant|vivant]]). D'où vient que le corps souffre ? De ce qu'il est fait de matière : « la maladie, tout d'abord, est le défaut et l'excès de corps faits de matière qui sont __incapables de préserver l'ordre et la mesure__ » ([[traite51|traité 51]], chap. 5 ; voir [[g-hule|matière]]). La souffrance est donc le signe d'une forme que la matière ne tient plus. Plotin en donne la raison la plus générale : quand deux choses, comme le corps et ce qu'il reçoit de l'âme, doivent faire un seul vivant, « puisqu'elles font appel à une unité qui leur vient de l'extérieur, c'est dans le fait __de ne pouvoir atteindre cette unité__ que réside vraisemblablement l'origine de la douleur qu'elles ressentent » ([[traite28|traité 28]], chap. 18).

    __**Le sage souffre mais n'est pas malheureux, parce que ce qui souffre en lui n'est pas lui.**__ Le sage n'est pas insensible ; mais il ne se confond pas avec ce qui souffre. Il est la vie de l'intellect, à laquelle il a fini par coïncider, et le reste l'entoure : « nous dirons tout simplement qu'__il porte les autres choses comme des vêtements__ ; on ne saurait même les considérer comme des parties de lui, parce qu'elles l'entourent sans qu'il le veuille » ([[traite46|traité 46]], chap. 4 ; voir [[g-hemeis|nous]]). Un vêtement qu'on déchire n'est pas une blessure. Ainsi des deuils : « même si la perte de parents et de proches cause du chagrin, ce n'est pas à lui qu'elle en cause, mais à ce qui, en lui, est dépourvu d'intellect » (*ibid*. ; voir [[g-joie-tristesse|joie et tristesse]]). Quant à la santé et à l'absence de douleur, « il est raisonnable de dire qu'elles sont nécessaires, __mais non pas qu'elles sont bonnes__ » (chap. 6) : elles ne font pas partie du bonheur, leur absence ne l'ôte donc pas. D'où l'exemple extrême : l'objet de la contemplation « est toujours à portée de main du sage, il l'accompagne toujours, même si le sage se trouve dans ce que l'on appelle __le taureau de Phalaris__ » (chap. 13), ce taureau d'airain où le tyran faisait rôtir ses victimes. C'est que « la partie qui souffre est une chose, ce qui lui est uni en est une autre » (*ibid*.), et que « rien ne vient troubler l'intériorité du sage, __ni souffrances ni chagrins__ » (chap. 8). Il n'est pas même ébranlé par l'attente des malheurs : « il est heureux ; de sorte qu'il l'est même quand ces événements se produisent. Car il est convaincu que la nature de l'univers est telle qu'elle comporte aussi de semblables événements, et __qu'il faut s'y soumettre__ » (chap. 7 ; voir [[g-bonheur|bonheur]]).

    __**Le sage supporte autant qu'il peut ; quand la souffrance l'emporte, il garde encore la liberté de partir.**__ Plotin ne prête pas au sage une force sans limite : « pour ce qui est des souffrances que le sage subit, lorsqu'elles sont intenses, __il les supportera aussi longtemps qu'il le peut__ ; mais lorsqu'elles sont excessives, elles l'emporteront » ([[traite46|traité 46]], chap. 8). Si elle dure sans l'emporter, « il décidera de ce qu'il faut faire. Car __la libre disposition de soi__ ne disparaît pas dans ces circonstances » (*ibid*.). Il peut même partir : prisonnier de guerre, « « devant toi » s'ouvre « la voie » pour partir, s'il n'est plus possible d'être heureux » (chap. 7). Cela contredit-il l'interdiction du suicide ? Non, car ce que Plotin interdit, c'est de partir sous le coup de la passion ; il réserve le cas de nécessité : prévenir le temps fixé par le destin « n'est pas une bonne chose, __à moins que__, comme nous l'avons dit, __cela ne soit nécessaire__ » ([[traite16|traité 16]], chap. 1 ; voir [[g-suicide|suicide]]). Le sage qui part ne fuit pas la douleur ; il juge qu'il ne peut plus vivre comme il doit. Et quand la souffrance l'emporte, la pensée n'est pas détruite : « lorsque ce en quoi ces reflets apparaissent est complètement brisé parce que l'harmonie du corps est troublée, __c'est sans image que la raison discursive et l'intellect intelligent__ » ([[traite46|traité 46]], chap. 10 ; voir [[g-organe|organe]]).

    | Ce qui arrive | Ce que fait le sage |
    | une souffrance intense | il la supporte aussi longtemps qu'il le peut |
    | une souffrance qui dure sans l'emporter | il décide de ce qu'il faut faire |
    | une souffrance excessive | elle l'emporte |
    | plus de vie heureuse possible | la voie s'ouvre pour partir |

    __**La souffrance a sa place dans l'univers : elle sert l'ensemble et instruit l'âme.**__ Pourquoi la providence laisse-t-elle souffrir ? D'abord parce qu'on ne peut avoir un corps sans être exposé au mal : « pour qui a un corps, __c'est une nécessité que d'être malade__. Et ces maux ne sont pas totalement dépourvus d'utilité pour l'arrangement total de l'ensemble » ([[traite47|traité 47]], chap. 5). Ils ne pèsent pas de même sur tous : « la pauvreté et les maladies __ne sont rien pour les gens de bien__, tandis qu'elles sont profitables aux méchants » (*ibid*.), à qui elles servent de leçon. Le mal même a son usage : il « nous tient en éveil ; oui, __il tient en éveil l'intellect__ et la conscience » de ceux qui s'en gardent (*ibid*.). Enfin l'épreuve instruit l'âme qui ne sait pas encore : « l'expérience du mal offre __une connaissance plus manifeste du bien__ à ceux dont la puissance est trop faible pour connaître le mal par une science qui précède l'expérience » ([[traite6|traité 6]], chap. 7). L'âme qui a souffert ici peut « remonter à la surface après avoir fait l'expérience de ce qu'elle a vu et éprouvé ici » (*ibid*.), et savoir mieux ce qu'elle a quitté.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 6, chap. 7 | l'expérience du mal fait mieux connaître le bien |
    | traité 16, chap. 1 | partir, non par passion, sauf nécessité |
    | traité 28, chap. 19 | le corps incisé pâtit, l'âme sent |
    | traité 46, chap. 4 | le sage porte le reste comme des vêtements |
    | traité 46, chap. 8 | il supporte tant qu'il peut ; la libre disposition de soi |
    | traité 46, chap. 13 | heureux dans le taureau de Phalaris |
    | traité 47, chap. 5 | avoir un corps, c'est devoir être malade |
    | traité 51, chap. 5 | la maladie, matière qui ne garde pas la mesure |

