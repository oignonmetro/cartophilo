- id: traite47-l4
  title: "Le drame de l'univers"
  notes: |-
    **Les acteurs** (chap. 17) : le monde, moins un que sa raison, a plus de contrariété ; d'où des bons et des méchants, comme un danseur incarne des personnages opposés. Les méchants le sont bien, mais leur méchanceté ne vient pas d'eux seuls. Dans un drame, l'auteur distribue les rôles en tenant compte de ce que sont déjà les acteurs, qui répondent de leur jeu. Dans **ce drame qu'est la réalité**, l'âme est l'acteur : elle reçoit sa destinée de la raison, non au hasard, et mérite châtiments et récompenses. Le mauvais acteur est relégué aux mauvais drames ; qui rend un son discordant ira dans le Tartare. Comme la flûte de Pan, l'univers fait une seule harmonie de notes inégales ; une cité bien réglée a besoin d'un exécuteur public.

    **Les âmes inégales** (chap. 18) : toutes ne sont pas égales dès l'origine. Pas d'acteurs qui diraient un autre texte que celui de l'auteur : les conséquences des mauvaises actions sont conformes à la raison. D'un adultère peuvent naître des hommes de qualité ; des déportés fondent de meilleures cités. Retirer à la raison le mal, ce serait lui retirer le bien. Reste la question, reprise au traité 48 : dans quel but la raison fera-t-elle le mal ?

    ! L'image du théâtre ne fait pas des âmes des marionnettes : l'auteur distribue les rôles, mais le jeu, bon ou mauvais, appartient à l'acteur.
