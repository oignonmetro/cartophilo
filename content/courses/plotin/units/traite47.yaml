id: traite47
title: "Traité 47 (III, 2) : Sur la providence I"
subtitle: "Un univers conforme à l'Intellect"
icon: compass
color: sky
lessons:
- id: traite47-l1
  title: "La providence, existence conforme à l'Intellect"
  notes: |-
    **Un traité coupé en deux** : Porphyre a divisé maladroitement un seul traité *Sur la providence* en deux traités de longueur inégale, la coupure séparant une question de sa réponse. Plotin y expose pour la première fois sa doctrine complète.

    | Adversaire | Thèse |
    | les épicuriens | il n'y a pas de providence : les dieux n'interviennent pas |
    | les péripatéticiens | la providence ne s'étend pas sous la sphère de la lune |
    | les gnostiques | elle ne vaut que pour les élus, et le monde est à blâmer |

    Ses alliés : Platon, au livre X des *Lois*, pour qui tout se fait en vue de l'ensemble ; puis les stoïciens.

    **Conforme à l'Intellect** (chap. 1) : il est déraisonnable d'attribuer l'univers au hasard. Laissons la providence des cas particuliers, un raisonnement avant l'action : le monde est éternel, et **pour l'univers, la providence consiste à exister conformément à l'Intellect**, son archétype et son modèle. L'Intellect, où chaque partie est le tout, ne se meut pas : il réalise de grandes choses **en ne faisant rien**.

    **L'image divisée** (chap. 2) : notre univers est multiple ; il y règne l'amitié, mais aussi **la haine**, car une partie manque de l'autre. Il naît non d'un calcul, mais de la nécessité qu'il y ait une nature seconde : l'Intellect n'est pas un artisan qui aurait appris son art. Une **raison** s'écoule de lui, comme d'une semence. Une seule harmonie règne pourtant, et l'intellect domine la nécessité.

    **Le discours du monde** (chap. 3) : on ne juge pas un homme sur un cheveu, ni l'humanité sur Thersite. Le monde le dit lui-même : « Un dieu m'a produit » ; il contient tous les vivants et se suffit. Il ne faut pas demander au doigt de voir.

    ! La providence n'est pas le calcul d'un dieu qui prévoit : c'est l'ordre que l'univers tient naturellement de l'Intellect, sans délibération.
