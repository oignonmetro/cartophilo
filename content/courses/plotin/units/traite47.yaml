- id: traite47-l3
  title: "La raison et ses contraires"
  notes: |-
    **Les raisons produisent tout** (chap. 11-12) : ce n'est pas un enchaînement de nécessités naturelles, c'est **la raison** qui produit, même ce qu'on appelle maux, car elle ne veut pas que tout soit bon. L'artiste ne met pas des yeux partout ; nous blâmons en profanes le peintre de n'avoir pas mis de belles couleurs partout ; une cité n'a pas des citoyens égaux, une pièce n'a pas que des héros. Les âmes aussi sont des parties de la raison, qui leur assigne le lieu qu'elles méritent.

    **Le cycle des vies** (chap. 13) : la raison tient compte des vies antérieures. Le mauvais maître devient esclave ; celui qui a tué sa mère deviendra femme et périra de la main de son fils. D'où le nom d'**Adrastée** : la disposition de l'univers est justice véritable. L'ordre s'étend aux plus petites choses, aux feuilles et aux fleurs.

    **Aussi parfait que possible** (chap. 14) : l'ordre est conforme à l'Intellect sans venir d'un calcul, si bien que le calcul le plus parfait ne trouverait pas mieux. D'ici, le ciel apparaît comme une grande et belle statue.

    **La guerre des vivants** (chap. 15) : les animaux se dévorent, mais renaissent, comme l'acteur tué sur scène revient sous un autre costume. Les combats sont comme des danses pyrrhiques, les pillages des spectacles de théâtre. C'est l'ombre de l'âme, **l'homme extérieur**, qui gémit ; si Socrate jouait, c'est le Socrate extérieur.

    **La raison et ses contraires** (16-17, 11) : la raison n'est ni intellect pur ni âme pure, mais une **illumination** de l'Intellect et de l'Âme, une vie artiste, comme le danseur. Moins une que ses principes, elle produit des contraires, comme l'intrigue d'un drame, ou mieux comme **une harmonie de sons opposés**. La plus grande différence, c'est la contrariété.

    ! Plotin oscille entre deux conceptions du mal : une illusion de la partie qui ne voit pas le tout, et une faute réelle, justement châtiée.
