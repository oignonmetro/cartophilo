- id: traite47-l2
  title: "Les maux et la justice"
  notes: |-
    **Les maux ont une fonction** (chap. 4-5) : un feu s'éteint, un autre s'allume ; les vivants se détruisent parce qu'ils ne sont pas éternels. La vie d'ici, en mouvement, est comme la **respiration** de la vie qui reste au repos. Les injustices viennent du désir du Bien, et le châtiment suit : rien n'échappe à **la loi de l'univers**. Ce n'est pas l'ordre qui vient du désordre, mais le désordre de l'ordre. La pauvreté et la maladie ne sont rien pour les bons, et profitent aux méchants ; le vice nous tient en éveil. **Le mal est un défaut de bien**, et « les maux ne disparaîtront pas ».

    **Les injustices** (chap. 6-7) : les bons pauvres, les méchants au pouvoir ? Rien n'est mal pour les bons ni bon pour les méchants. On ne cherche pas dans le mélange le bien de ce qui est sans mélange. La « responsabilité appartient à celui qui choisit » : on ne demande pas de comptes à la providence.

    **L'homme au milieu** (chap. 8) : la terre n'est qu'un point ; l'homme occupe **un rang intermédiaire** entre les dieux et les bêtes. Les garçons qui ne se sont pas exercés se font voler par les autres : devenus des agneaux pour les loups. La loi veut que les courageux survivent à la guerre, **non ceux qui prient** ; on récolte en cultivant, non en priant. Le dieu ne combat pas à la place de ceux qui refusent le combat.

    **Ni tout ni rien** (chap. 9-10) : si la providence était tout, elle ne serait providence de rien. Aucun animal n'existe en vain. L'homme est méchant contre son gré, mais c'est lui qui agit : **les hommes aussi sont des principes**.

    ! Que la faute soit involontaire n'efface pas la responsabilité : c'est bien l'homme qui agit, et c'est pourquoi il peut fauter.
