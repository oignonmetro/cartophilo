- id: traite47-l5
  title: "Repérage : le plan du traité 47"
  notes: |-
    **Le traité 47 définit la providence (chap. 1-5), puis répond à quatre objections et pose la cinquième (chap. 6-18).**

    | Moment | Lieu | Ce qui s'y joue |
    | l'univers ne vient pas du hasard | 1, 1-15 | les deux adversaires |
    | conforme à l'Intellect | 1, 15-45 | de grandes choses en ne faisant rien |
    | une image divisée | chap. 2 | l'amitié et la haine |
    | le discours du monde | chap. 3 | Thersite ; le doigt et l'œil |
    | les maux ont une fonction | chap. 4-5 | un défaut de bien |
    | les injustices | chap. 6 | les bons pauvres |
    | ni l'univers ni la providence à blâmer | chap. 7 | celui qui choisit |
    | l'homme au rang intermédiaire | chap. 8 | ceux qui prient |
    | la providence ne fait pas tout | chap. 9 | aucun animal en vain |
    | la responsabilité | chap. 10 | les hommes, des principes |
    | les raisons produisent tout | chap. 11 | le peintre |
    | les âmes à leur place | chap. 12 | des parties de la raison |
    | le cycle des vies | chap. 13 | Adrastée |
    | aussi parfait que possible | chap. 14 | la statue du ciel |
    | la guerre des vivants | chap. 15 | les danses pyrrhiques |
    | la raison et ses contraires | chap. 16 | l'harmonie des sons opposés |
    | le monde multiple | 17, 1-11 | plus de contrariété |
    | les acteurs et leurs rôles | 17, 12-89 | la flûte de Pan |
    | les âmes inégales | 18, 1-26 | l'adultère, les déportés |
    | la raison fera-t-elle le mal ? | 18, 26-29 | une question pour le traité 48 |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

