  - id: g-intellect-l2-q1
    sentence: "Le traité de Plotin intitulé *Que les intelligibles ne sont pas hors de l'Intellect, et sur le Bien* est le traité ___."
    answer: 32 (V, 5)
    alt: ["32", "V, 5"]
  - id: g-intellect-l2-q2
    sentence: "« Si l'on va jusqu'à accorder que les intelligibles sont ___ et que l'Intellect les contemple en tant que tels, alors nécessairement l'Intellect ne saisira pas la vérité des intelligibles » (traité 32, chap. 1, l. 50-53)."
    answer: extérieurs
    alt: ["exterieurs"]
  - id: g-intellect-l2-q3
    sentence: "« Si l'on va jusqu'à accorder que les intelligibles sont extérieurs et que l'Intellect les contemple en tant que tels, alors nécessairement l'Intellect ne saisira pas ___ » (traité 32, chap. 1, l. 50-53)."
    answer: la vérité des intelligibles
    alt: ["la verite des intelligibles"]
  - id: g-intellect-l2-q4
    sentence: "Si les Formes étaient extérieures à l'Intellect, il les contemplerait « sans les posséder » et « n'en saisira que des ___ » (traité 32, chap. 1, l. 54-56)."
    answer: images
    alt: []
  - id: g-intellect-l2-q5
    sentence: "Le pivot de l'argument du traité 32 est le suivant : un intellect qui n'aurait que des images des Formes ne posséderait que le ___, et ne serait plus un intellect du tout."
    answer: faux
    alt: []
  - id: g-intellect-l2-q6
    sentence: "Pour que la vérité existe quelque part, il faut qu'en un lieu au moins le connaissant et le connu ne fassent ___ : c'est l'Intellect."
    answer: qu'un
    alt: ["qu'une seule chose"]
  - id: g-intellect-l2-q7
    sentence: "Plotin refuse de dire que les intelligibles sont, dans l'Intellect, des ___ des êtres, comme celles d'un sceau dans la cire (traité 32, chap. 2, l. 1-2)."
    answer: empreintes
    alt: []
  - id: g-intellect-l2-q8
    sentence: "« L'Intellect dans sa totalité est toutes les Formes, et chaque ___ est un intellect, comme la science dans sa totalité est tous les théorèmes » (traité 5, chap. 8, l. 3-5)."
    answer: Forme
    alt: ["forme"]
  - id: g-intellect-l2-q9
    sentence: "« L'Intellect dans sa totalité est ___, et chaque Forme est un intellect, comme la science dans sa totalité est tous les théorèmes » (traité 5, chap. 8, l. 3-5)."
    answer: toutes les Formes
    alt: ["toutes les formes"]
  - id: g-intellect-l2-q10
    sentence: "« L'Intellect dans sa totalité est toutes les Formes, et chaque Forme est un intellect, comme la ___ dans sa totalité est tous les théorèmes » (traité 5, chap. 8, l. 3-5)."
    answer: science
    alt: []
  - id: g-intellect-l2-q11
    sentence: "Pour dire que, dans l'Intellect, la pensée coïncide avec ce qu'elle pense, Plotin reprend une parole de Parménide : « être et ___, c'est la même chose » (traité 30, chap. 8, l. 8)."
    answer: penser
