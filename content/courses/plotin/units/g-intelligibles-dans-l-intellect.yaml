- id: g-intelligibles-dans-l-intellect-l1
  title: Intelligibles dans l'Intellect
  notes: |-
    Chez Plotin, les {violet}**intelligibles**{/violet} dans l'[[g-intellect|Intellect]] sont [def] : ils ne lui sont {pink}pas extérieurs{/pink}. Le [[traite32|traité 32]] en fait son titre : *Que les intelligibles ne sont pas hors de l'Intellect*.

    __**L'argument : sinon, l'Intellect n'aurait jamais la vérité.**__ Supposons les Formes extérieures. L'Intellect ne les saisirait alors que comme la sensation saisit les corps, par une image reçue : « si l'on va jusqu'à accorder que les intelligibles sont extérieurs et que l'Intellect les contemple en tant que tels, alors nécessairement __l'Intellect ne saisira pas la vérité__ des intelligibles » (chap. 1). Il les contemplerait « sans les posséder » et « n'en saisira que des images » ; il ne posséderait que le faux. **Pour que la vérité existe quelque part, il faut qu'en un lieu au moins le connaissant et le connu ne fassent qu'un.**

    __**D'où le refus de l'empreinte.**__ Les intelligibles ne sont pas dans l'Intellect comme des empreintes des êtres (chap. 2), {yellow}comme un sceau dans la cire{/yellow} : l'empreinte suppose un objet extérieur qui frappe un support passif, et l'Intellect ne reçoit rien du dehors.

    __**L'Intellect est donc les Formes elles-mêmes.**__ « L'Intellect dans sa totalité est __toutes les Formes__, et chaque Forme est un intellect, comme la science dans sa totalité est tous les théorèmes » ([[traite5|traité 5]], chap. 8). Plotin reprend la parole de {sky}Parménide{/sky} : « __être et penser, c'est la même chose__ » ([[traite30|traité 30]], chap. 8). Dans l'Intellect, la pensée ne vise pas l'être : elle coïncide avec lui. Il rompt ainsi avec une lecture courante de Platon, où les Formes seraient des modèles que le {sky}Démiurge du *Timée*{/sky} contemple hors de lui : une Forme qui ne serait pas pensée ne serait pas une réalité vivante, mais une chose morte.

    ! Que l'Intellect soit identique aux Formes ne veut pas dire qu'il les produit à sa guise : ce qui est est antérieur à l'Intellect, au sens où l'Intellect pense ce qui est, et non l'inverse ([[traite5|traité 5]], chap. 8).

    **Voir aussi** : [[g-intellect|Intellect]] · [[g-noesis|Pensée]] · [[g-eidos|Forme]] · [[traite32|Traité 32]]
