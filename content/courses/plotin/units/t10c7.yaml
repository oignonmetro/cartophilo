# Unité de texte (voir content/textes.md) : Plotin, traité 10 (V, 1), Des
# trois hypostases qui ont rang de principes, chapitre 7, traduction GF (éd.
# L. Brisson et J.-F. Pradeau). Découpage seul : rappels et cartes à écrire.

id: "t10c7"
title: "La naissance de l'Intellect (10 [V, 1], 7)"
subtitle: "Traité 10, Des trois hypostases qui ont rang de principes, chapitre 7"
icon: "page"
color: "coral"
depth: "normale"
lessons:
- id: "t10c7-p1"
  title: "Garder beaucoup de l'Un"
  notes: ""
  passage:
    label: "l. 1-4"
    part: "L'Intellect, reflet de l'Un"
    text: |-
      Nous disons que l'Intellect est un reflet de l'Un. En fait, il faut s'exprimer plus clairement. Tout d'abord, il faut dire que ce qui a été engendré doit être en quelque manière l'Un, qu'il doit garder beaucoup de choses de lui et lui ressembler comme la lumière ressemble au soleil.
  points: []
- id: "t10c7-p2"
  title: "La question : l'Un n'est pas intellect"
  notes: ""
  passage:
    label: "l. 4-8"
    part: "Comment l'Un engendre-t-il l'Intellect ?"
    text: |-
      – Mais lui, il n'est pas intellect. Comment donc engendre-t-il l'Intellect ?
  points: []
- id: "t10c7-p2b"
  title: "Se tourner vers l'Un et voir"
  notes: ""
  passage:
    label: "l. 4-8"
    part: "Comment l'Un engendre-t-il l'Intellect ?"
    text: |-
      – Parce que, en se tournant vers l'Un, l'Intellect s'est mis à voir : et cette vision, c'est l'Intellect. Car ce qui appréhende quelque chose, c'est soit la sensation soit l'Intellect.
  points: []
- id: "t10c7-p3"
  title: "L'objection du cercle"
  notes: ""
  passage:
    label: "l. 8-17"
    part: "La puissance de toutes choses"
    text: |-
      – Mais le cercle a la capacité d'être divisé, tandis que lui ne le peut pas.

      – Dans l'Intellect aussi, il y a une certaine unité, mais l'Un est puissance de toutes choses.
  points: []
- id: "t10c7-p3b"
  title: "L'intellection se sépare de la puissance"
  notes: ""
  passage:
    label: "l. 8-17"
    part: "La puissance de toutes choses"
    text: |-
      L'intellection voit les choses dont l'Un est la puissance, en se séparant en quelque sorte de cette puissance ; autrement, elle ne serait pas Intellect. Car l'Intellect a aussi par lui-même en quelque sorte conscience de la puissance que l'Un possède de produire une réalité.
  points: []
- id: "t10c7-p3c"
  title: "Définir son être au moyen de l'Un"
  notes: ""
  passage:
    label: "l. 8-17"
    part: "La puissance de toutes choses"
    text: |-
      Certes, c'est par lui-même que l'Intellect définit son être pour lui-même au moyen de la puissance qui vient de l'Un et en raison du fait que la réalité existante est, pour ainsi dire, une partie unique de ce qui appartient à l'Un et vient de lui ; il tire sa force de lui, il est rendu parfait quant à sa réalité par lui, et il vient de lui.
  points: []
- id: "t10c7-p4"
  title: "Le divisé vient de l'indivisé"
  notes: ""
  passage:
    label: "l. 17-27"
    part: "L'Un sans forme et les réalités délimitées"
    text: |-
      Il voit que la vie, la pensée et toutes choses lui viennent de là-bas, à lui qui est pour ainsi dire quelque chose de divisé qui vient de l'indivisé, même si l'Un n'est rien de tout cela, car toutes choses viennent de lui, parce que lui n'est contenu en aucune forme. En effet, il n'est qu'« Un » ; et s'il était toutes choses, il ferait partie des choses qui sont.
  points: []
- id: "t10c7-p4b"
  title: "Des réalités délimitées"
  notes: ""
  passage:
    label: "l. 17-27"
    part: "L'Un sans forme et les réalités délimitées"
    text: |-
      Pour cette raison, il n'est aucune des choses qui sont dans l'Intellect, même si toutes choses viennent de lui. Voilà pourquoi ces choses sont des réalités : en effet, elles sont délimitées d'entrée de jeu, et chacune d'elles possède une sorte de forme.
  points: []
- id: "t10c7-p4c"
  title: "La limite et le repos"
  notes: ""
  passage:
    label: "l. 17-27"
    part: "L'Un sans forme et les réalités délimitées"
    text: |-
      Ce qui est ne doit pas flotter, pour ainsi dire, dans l'indétermination, mais se voir fixé par une limite et trouver le repos ; le repos est, pour les intelligibles, la définition et la forme, grâce auxquelles ils acquièrent aussi leur existence.
  points: []
- id: "t10c7-p5"
  title: "Reprendre en soi ce qu'on engendre"
  notes: ""
  passage:
    label: "l. 27-35"
    part: "L'Intellect rassasié : Kronos"
    text: |-
      « De cette lignée » provient l'Intellect dont nous avons parlé, une lignée digne de l'Intellect le plus pur, qui ne pouvait pas provenir d'autre chose que du premier principe, et qui, une fois né, a engendré toutes les choses qui vont avec lui, toute la beauté des formes, tous les dieux intelligibles ; il est plein des choses qu'il a engendrées, comme s'il les avait avalées pour les avoir de nouveau en lui-même et ne pas permettre qu'elles tombent dans la matière ou qu'elles soient nourries par Rhéa, comme l'expriment de façon voilée les mystères et les mythes qui parlent des dieux, en disant que Kronos, le dieu le plus sage, vient avant Zeus, et qu'il reprend en lui-même ce qu'il engendre, de sorte qu'il est rempli, qu'il est un Intellect qui connaît la satiété.
  points: []
- id: "t10c7-p6"
  title: "La naissance de Zeus"
  notes: ""
  passage:
    label: "l. 36-42"
    part: "L'Intellect engendre l'Âme"
    text: |-
      On raconte ensuite que, une fois rassasié, il engendre Zeus : et c'est en effet dans la mesure où il est parfait que l'Intellect engendre l'Âme. Car puisqu'il est parfait, il devait engendrer, parce qu'une puissance aussi grande ne pouvait rester sans descendance.
  points: []
- id: "t10c7-p6b"
  title: "Une image inférieure"
  notes: ""
  passage:
    label: "l. 36-42"
    part: "L'Intellect engendre l'Âme"
    text: |-
      Mais dans ce cas non plus, il n'était pas possible que l'être engendré soit supérieur à celui qui l'engendre ; parce qu'il est une image de lui, il lui est inférieur, et pour la même raison il est illimité, même s'il est limité par ce qui l'a engendré et qu'il est comme conformé par lui.
  points: []
- id: "t10c7-p7"
  title: "La trace de l'Intellect"
  notes: ""
  passage:
    label: "l. 42-49"
    part: "L'Âme, raison et réflexion discursive"
    text: |-
      Le produit de l'Intellect est donc une raison et une réalité existante : c'est la réflexion discursive. C'est ce qui se meut autour de l'Intellect, la lumière qui émane de l'Intellect et la trace qu'il laisse de lui.
  points: []
- id: "t10c7-p7b"
  title: "Où s'arrêtent les choses divines"
  notes: ""
  passage:
    label: "l. 42-49"
    part: "L'Âme, raison et réflexion discursive"
    text: |-
      D'un côté, il est attaché à lui, il est rempli de lui, il en jouit, il en participe et il pense ; d'un autre, il est en contact avec ce qui vient après lui, ou plutôt avec cela même qui produit les choses qui sont nécessairement inférieures à l'Âme. Nous en reparlerons plus tard. Les choses divines s'arrêtent bien à l'Âme.
  points: []
