  - id: g-energeia-l1-q1
    sentence: "L'activité d'une réalité déjà parfaite, et non l'achèvement d'une puissance, se dit en grec translittéré ___."
    answer: energeia
    alt: ["enérgeia", "énergeia"]
  - id: g-energeia-l1-q2
    sentence: "La figure de la statue est un acte, mais « cet acte n'est pas un acte pur et simple, mais il est l'acte de cette ___ » (traité 25, chap. 2)."
    answer: chose
    alt: []
  - id: g-energeia-l1-q3
    sentence: "« Pour la puissance, l'\"acte\", c'est ce qu'elle peut accomplir par ___ » (traité 25, chap. 2)."
    answer: elle-même
    alt: ["elle même"]
  - id: g-energeia-l1-q4
    sentence: "Pour illustrer l'acte d'une disposition, Plotin donne l'exemple du ___ et du fait d'être courageux (traité 25, chap. 2)."
    answer: courage
    alt: []
  - id: g-energeia-l1-q5
    sentence: "L'Intellect « ne passe pas de la \"puissance\" qui le rend capable de penser à l'\"acte\" de ___ » (traité 25, chap. 3)."
    answer: penser
    alt: []
  - id: g-energeia-l1-q6
    sentence: "« Toutes les réalités premières sont donc ___, car elles possèdent ce qu'elles doivent posséder » (traité 25, chap. 3)."
    answer: acte
    alt: []
  - id: g-energeia-l1-q7
    sentence: "Les intelligibles « sont \"en acte\" et sont des actes, et toutes sont des ___ » (traité 25, chap. 3)."
    answer: vies
    alt: []
  - id: g-energeia-l1-q8
    sentence: "Le feu a deux chaleurs, « puisque le feu exerce l'acte qui est naturellement inhérent à sa réalité tout en restant du ___ » (traité 7, chap. 2)."
    answer: feu
    alt: []
  - id: g-energeia-l1-q9
    sentence: "« Il ne faut pas craindre en effet de poser que l'acte premier est sans ___ » (traité 39, chap. 20)."
    answer: réalité
    alt: ["realite"]
  - id: g-energeia-l1-q10
    sentence: "La matière ne passe jamais à l'acte : elle est « une image en acte. Elle est donc un ___ \"en acte\" » (traité 25, chap. 5)."
    answer: mensonge
    alt: []
