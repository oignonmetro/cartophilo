    sentence: "La vie de l'Intellect, à laquelle rien ne manque et que toutes les autres vies ne font qu'imiter, Plotin la nomme, en grec translittéré, ___ zôê, la « vie parfaite »."
    answer: teleia
    alt: ["teleios", "téleia"]
  - id: g-vie-veritable-l1-q2
    sentence: "L'être intelligible n'a besoin de rien pour être ; donc « il est nécessaire que cet être soit en vie et vive d'une vie ___ » (traité 25 [II, 5], chap. 3)."
    answer: parfaite
    alt: []
  - id: g-vie-veritable-l1-q3
    sentence: "L'être intelligible doit vivre d'une vie parfaite, car, « s'il lui manquait quelque chose, il ne serait pas plus être que ___ » (traité 25 [II, 5], chap. 3)."
    answer: non-être
    alt: ["non être", "non-etre"]
  - id: g-vie-veritable-l1-q4
    sentence: "Que l'être véritable ne puisse être privé de vie ni de pensée, Plotin le reprend d'un dialogue de Platon, le ___."
    answer: Sophiste
