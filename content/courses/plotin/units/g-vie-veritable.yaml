# Entrée du glossaire de Plotin (skill glossaire) : sous-entrée de g-vie,
# citations vérifiées sur la GF (II, 5, 3 ; I, 4, 3-4 ; VI, 9, 9 ; VI, 7, 29).

id: g-vie-veritable
title: Vie véritable (`teleia zôê`)
subtitle: La vie parfaite de l'Intellect, à laquelle rien ne manque, et dont la nôtre n'est qu'une trace
icon: book
color: coral
lessons:
- id: g-vie-veritable-l1
  title: Vie véritable
  notes: |-
    **Parmi les sens de la [[g-vie|vie]], qui se dit à des degrés différents, la vie véritable, ou vie parfaite (*teleia zôê*), est celle de l'{violet}[[g-intellect|Intellect]]{/violet} : la seule à laquelle rien ne manque, dont toutes les autres sont des images.** C'est elle que vise le sage, et c'est en elle que Plotin place le bonheur.

    __**Pourquoi l'être véritable doit vivre d'une vie parfaite.**__ Contre l'idée d'un intelligible abstrait, simple ensemble de concepts, Plotin reprend le {sky}*Sophiste*{/sky}, où l'être véritable ne peut être privé de vie ni de pensée. L'être intelligible n'a besoin de rien pour être ; donc {teal}« il est nécessaire que cet être soit en vie et vive d'une vie parfaite »{/teal} (traité 25 [II, 5], chap. 3) : {teal}« s'il lui manquait quelque chose, il ne serait pas plus être que non-être »{/teal}.

    __**Le bonheur est cette vie même, non un bien qui s'y ajoute.**__ Puisque la vie se dit en plusieurs sens, la vie bonne aussi : {teal}« si la vie bonne appartient à celui qui possède la vie dans sa plénitude – j'entends par là l'être auquel rien de la vie ne manque –, alors le bonheur ne saurait appartenir qu'à celui qui vit dans la plénitude »{/teal} (traité 46 [I, 4], chap. 3). Or {teal}« la vie parfaite, celle qui est véritable et réelle, réside dans cette nature intellective »{/teal}. {coral}**Rien ne peut donc s'ajouter du dehors** à cette vie pour la rendre heureuse.{/coral}

    __**L'homme peut l'être.**__ L'homme possède cette vie quand il a, outre la sensation, le raisonnement et l'intellect véritable ; mais l'homme heureux ne l'a pas comme une partie de lui : {teal}« étant donné qu'il est déjà en acte cette espèce de vie et qu'il en est venu à coïncider avec elle, est cette vie »{/teal} (I, 4, 4). {yellow}Le reste, il le porte « comme des vêtements ».{/yellow}

    __**Notre vie d'ici n'en est qu'une trace.**__ {teal}« Car notre vie actuelle, qui est une vie sans dieu, n'est qu'une trace qui imite la vie véritable, tandis que la vie de là-bas, c'est l'activité de l'Intellect »{/teal} (traité 9 [VI, 9], chap. 9). Et c'est l'{violet}[[g-un|Un]]{/violet} qui « procure la vie véritable » : l'âme qui s'en approche « reçoit alors une autre vie ».

    ! La vie véritable n'est pas une autre vie, après la mort : c'est la vie de l'Intellect, que l'homme heureux est dès maintenant. Mépriser la vie, c'est mépriser celle d'ici : {teal}« si quelqu'un ne supporte pas la vie qui est mélangée de mort, c'est cette vie qu'il ne supporte pas, non pas la vie véritable »{/teal} (traité 38 [VI, 7], chap. 29).
