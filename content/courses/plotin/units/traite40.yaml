- id: traite40-l2
  title: "L'âme et le corps du monde"
  notes: |-
    **Le corps du monde** (chap. 3) : il s'écoule **en lui-même**, non au-dehors ; il n'augmente ni ne diminue, il ne vieillit pas. Nous subsistons longtemps alors que nos parties s'en vont ; a fortiori ce dont rien ne part. Le feu, arrivé en haut, ne peut monter plus haut, et descendre n'est pas sa nature : l'âme l'entraîne, dans un beau lieu. Si rien ne s'écoule des astres, ils n'ont besoin d'aucune **nourriture**.

    **L'âme du monde** (chap. 4) : la flamme est une sorte d'ébullition (Aristote) ; le feu céleste, lui, est constant et modéré. L'âme qui vient juste après les réalités les plus éminentes est mue par une puissance merveilleuse : elle est **plus forte que tout lien**, et ce qu'elle retient un temps, elle peut le retenir toujours. Le monde n'a pas commencé, ce qui fonde aussi sa durée à venir. Elle gouverne **sans fatigue et sans dommage**.

    **Le démiurge et les dieux subalternes** (chap. 5) : selon le *Timée*, le démiurge a engendré les vivants célestes, et ses dieux les vivants d'ici. Pour Plotin, l'âme céleste et nos âmes viennent juste après le démiurge ; de l'âme céleste s'écoule une **image**, l'âme végétative, qui fait les vivants terrestres sans pouvoir les retenir. Le ciel s'arrête à la lune. L'autre âme, celle par laquelle nous sommes ce que nous sommes, est cause de notre bien-être, non de notre être.

    | Âme | Ce qu'elle produit | Ce qu'elle en fait |
    | l'âme du monde | le ciel et les astres | elle les retient toujours |
    | son image, l'âme végétative | les vivants d'ici-bas | elle les laisse s'écouler et périr |

    ! Ce n'est pas un décret du dieu qui garde le ciel : c'est la puissance d'une âme proche de l'intelligible, ce que Platon nommait maladroitement la « volonté issue de dieu ».
