- id: traite40-l3
  title: "Le corps du ciel"
  notes: |-
    **Contre Timée** (chap. 6) : Timée fait le corps du monde de feu, pour qu'il soit visible, et de terre, pour qu'il soit solide ; l'air et l'eau les relient, comme deux moyens termes entre des nombres solides. Mais ce raisonnement est **mathématique**, non physique : on mélange la terre à l'eau sans intermédiaire. Chaque élément existe par lui-même : la **lumière** suffit à rendre visible, et la neige brille sans feu ; l'or est dense sans terre, par coagulation. Il existe même des démons ignés. Élever la terre au ciel serait contre-nature : elle ternirait l'éclat du feu céleste.

    **Un Platon réinterprété** (chap. 7) : Platon ne parlait de la terre que pour la solidité des corps sublunaires. Par la **communauté** qui règne dans le monde, chaque élément participe des propriétés des autres sans mélange : le feu céleste a la solidité sans la terre. Le soleil est fait d'une **lumière** chaude avec douceur, non d'une flamme ; la flamme terrestre s'éteint sous la lune.

    **Rien ne s'écoule du ciel** (chap. 8) : cette lumière, pure dans le lieu le plus pur, n'a ni tendance ni contrainte à descendre, et le feu d'ici ne peut l'atteindre, tant le feu céleste est rapide. Le ciel n'a besoin d'aucune nourriture ; les corps d'ici s'écoulent parce qu'une nature faible les dirige.

    Rarement Plotin attaque Platon aussi directement. Il revient à la distinction des stoïciens anciens entre le feu artiste des astres, qui ne brûle pas, et le feu d'ici, qui détruit.

    ! Plotin refuse l'éther d'Aristote, mais son feu céleste, lumière qui ne brûle pas et ne se mêle à rien, en joue presque le rôle.
