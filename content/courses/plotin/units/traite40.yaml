- id: traite40-l4
  title: "Repérage : le plan du traité 40"
  notes: |-
    **Le traité 40 pose les difficultés (chap. 1-2), montre que l'âme et le corps font l'immortalité du ciel (chap. 3-5), puis examine la matière du ciel (chap. 6-8).**

    | Moment | Lieu | Ce qui s'y joue |
    | la volonté de dieu n'explique rien | chap. 1 | l'unité par l'espèce |
    | l'écoulement des corps | chap. 2 | un nouveau soleil |
    | le corps du monde | chap. 3 | il ne vieillit pas |
    | la puissance de l'âme du monde | chap. 4 | plus forte que tout lien |
    | le démiurge et les dieux subalternes | chap. 5 | une image de l'âme céleste |
    | un ciel tout de feu | chap. 6 | la neige brille sans feu |
    | Platon réinterprété | chap. 7 | une lumière chaude avec douceur |
    | rien ne s'écoule du ciel | chap. 8 | pas de nourriture |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! Le chapitre 6 attaque le *Timée*, le chapitre 7 le réinterprète : Plotin ne veut pas avoir donné tort à Platon.
  points:
  - id: traite40-l4-p1
    sentence: "Dans le traité 40 de Plotin, la puissance de l'âme du monde, plus forte que tout lien, se trouve au ___."
    answer: "chap. 4"
    alt: ["4", "chapitre 4"]
  - id: traite40-l4-p2
    sentence: "Dans le traité 40 de Plotin, la critique du *Timée* sur la composition des astres se trouve au ___."
    answer: "chap. 6"
    alt: ["6", "chapitre 6"]
  - id: traite40-l4-p3
    sentence: "Dans le traité 40 de Plotin, la nouvelle interprétation de Platon par la communauté des éléments se trouve au ___."
    answer: "chap. 7"
    alt: ["7", "chapitre 7"]
