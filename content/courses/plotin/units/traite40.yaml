lessons:
- id: traite40-l1
  title: "Permanence par l'espèce, permanence par le nombre"
  notes: |-
    **Un thème d'école** : platoniciens et péripatéticiens tiennent le monde et les astres pour immortels ; les stoïciens font naître et périr le monde par cycles, dans une **conflagration** universelle.

    | Auteur | Le monde est immortel parce que | Les astres le sont parce que |
    | Aristote | un inengendré ne peut être corruptible | ils sont faits d'éther, le cinquième élément |
    | Platon | il contient tout | le démiurge le veut |

    Plotin rejette l'éther ; et que le monde contienne tout ne garantit rien pour ses parties.

    **Le problème** (chap. 1) : rapporter la permanence à la volonté de dieu, c'est dire vrai sans rien expliquer. Le monde pourrait ne durer que **par l'espèce**, comme les hommes et les chevaux : il y en aura toujours, mais pas les mêmes. Les astres ne seraient alors que de plus longue durée.

    **L'écoulement** (chap. 2) : le ciel aura-t-il une permanence **par le nombre**, s'il a un corps qui s'écoule ? Platon le demande lui-même, et rejoint Héraclite : « un nouveau soleil naît sans cesse ». L'éther d'Aristote supprimerait la difficulté ; qui le rejette doit expliquer la permanence par l'âme, par le corps, ou par les deux.

    ! La question n'est pas de savoir si le monde dure toujours, mais s'il dure en restant le même individu, et pas seulement la même espèce.
  points:
