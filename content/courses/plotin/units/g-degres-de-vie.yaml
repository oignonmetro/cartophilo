  - id: g-degres-de-vie-l1-q1
    sentence: "Selon le traité 46 (chap. 3), « vivre » se dit autrement d'une plante et d'un être privé de raison, « la différence entre eux tenant à la ___ et à l'obscurité »."
    answer: clarté
    alt: ["clarte"]
  - id: g-degres-de-vie-l1-q2
    sentence: "Les espèces d'un même genre sont égales entre elles, le chien n'est pas moins animal que le cheval ; les vies, au contraire, sont plus ou moins vies : elles se distinguent par des ___, non par des différences de genre."
    answer: degrés
    alt: ["degres"]
  - id: g-degres-de-vie-l1-q3
    sentence: "Les vies inférieures, imparfaites et impures, « ne sont pas plus des vies que le ___ » (traité 46, chap. 3)."
    answer: contraire
    alt: []
  - id: g-degres-de-vie-l1-q4
    sentence: "« Et toute vie est une intellection, mais l'une est plus obscure que l'autre, exactement comme l'est la ___ » (traité 30, chap. 8)."
    answer: vie
    alt: []
  - id: g-degres-de-vie-l1-q5
    sentence: "« La première vie est donc la première ___, la deuxième vie la deuxième intellection, et la dernière vie la dernière intellection » (traité 30, chap. 8)."
    answer: intellection
    alt: []
  - id: g-degres-de-vie-l1-q6
    sentence: "« La première vie est donc la première intellection, la deuxième vie la deuxième intellection, et la ___ vie la dernière intellection » (traité 30, chap. 8)."
    answer: dernière
    alt: ["derniere"]
  - id: g-degres-de-vie-l1-q7
    sentence: "Dans l'échelle des vies, la première vie, où vivre et penser coïncident, est celle de l'___ ; l'Un, lui, est au-dessus de la vie."
    answer: Intellect
    alt: []
  - id: g-degres-de-vie-l1-q8
    sentence: "Dans l'échelle des vies, la deuxième vie, après celle de l'Intellect, est celle de l'___."
    answer: Âme
    alt: ["âme", "ame"]
  - id: g-degres-de-vie-l1-q9
    sentence: "Dans l'âme du monde, Plotin distingue une intellection végétative, une intellection ___ et une intellection psychique (traité 30, chap. 8)."
    answer: sensitive
    alt: []
  - id: g-degres-de-vie-l1-r10
    sentence: "Les vies végétative et sensitive sont des intellections « parce qu'elles sont des ___ » (traité 30, chap. 8) : vivre, c'est se former selon un contenu intelligible venu de l'Intellect."
    answer: raisons
    alt: []
  - id: g-degres-de-vie-l1-q13
    sentence: "Les hommes « disent plutôt que certaines sont des intellections et que d'autres ne le sont ___, car ils ne recherchent pas en quoi consiste la vie en général » (traité 30, chap. 8)."
    answer: aucunement
    alt: []
  - id: g-degres-de-vie-l1-q14
    sentence: "Plotin refuse de partager les vivants entre ceux qui pensent et ceux qui ne pensent pas : toute vie pense, et les degrés de vie se distinguent par la ___ de cette pensée."
    answer: clarté
    alt: ["clarte"]
  - id: g-degres-de-vie-l1-q15
    sentence: "La nature « produit en elle-même l'objet de sa contemplation, c'est-à-dire sa ___ » (traité 30, chap. 7)."
    answer: raison
    alt: []
  - id: g-degres-de-vie-l1-q16
    sentence: "Dans l'Intellect, « sujet et objet forment d'emblée une ___ » (traité 30, chap. 8) : c'est pourquoi sa pensée est la plus claire."
    answer: unité
    alt: ["unite"]
  - id: g-degres-de-vie-l1-q11
    sentence: "La compréhension qu'on prêterait à la nature, qui fait croître les plantes, n'est pas celle des autres êtres, « mais plutôt de celle d'un homme profondément ___ par rapport à un homme éveillé » (traité 30, chap. 4)."
    answer: endormi
    alt: []
  - id: g-degres-de-vie-l1-q12
    sentence: "La division en vies végétative, sensitive et psychique ne recouvre pas celle en première, deuxième et dernière vie : la première division porte sur les ___ de l'âme du monde, la seconde sur les rangs de la réalité."
    answer: facultés
    alt: ["facultes"]
