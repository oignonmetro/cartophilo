# Entrée du glossaire de Plotin (skill glossaire) : distinction, pôles de
# g-vie ; citations vérifiées sur la GF (I, 4, 3 ; III, 8, 4 et 8), rangs des
# vies d'après une note de la GF (volume des traités 22-26), qui renvoie à
# 30 (III, 8), 8, 16-20.

id: g-degres-de-vie
title: Degrés de vie
subtitle: Première, deuxième, dernière vie, qui ne diffèrent pas en genre mais en clarté, comme des degrés d'intellection
icon: book
color: coral
lessons:
- id: g-degres-de-vie-l1
  title: Degrés de vie
  notes: |-
    La [[g-vie|vie]] se dit en plusieurs sens, mais ces sens ne sont pas des {pink}espèces côte à côte{/pink} : ce sont des {violet}**degrés**{/violet}, {green}ordonnés du plus clair au plus obscur{/green}, et chacun est l'{green}image{/green} du précédent. Le critère qui les sépare est la **clarté**, et ce qui est plus ou moins clair en eux, c'est la pensée.

    __**Le critère : la clarté, non le genre.**__ « Vivre » se dit autrement d'une plante et d'un être privé de raison, « la différence entre eux __tenant à la clarté et à l'obscurité__ » ([[traite46|traité 46]], chap. 3). {red}Un genre se divise en espèces égales entre elles{/red} (le chien n'est pas moins animal que le cheval) ; {green}les vies, elles, sont plus ou moins vies{/green}, comme une image est plus ou moins fidèle. C'est pourquoi les vies inférieures, dit Plotin, « ne sont __pas plus des vies que le contraire__ » (chap. 3).

    __**Ce qui est plus ou moins clair : l'intellection.**__ « Et __toute vie est une intellection__, mais l'une est plus obscure que l'autre, exactement comme l'est la vie » ([[traite30|traité 30]], chap. 8). Chaque degré de vie est donc un degré de {violet}[[g-noesis|pensée]]{/violet} : « __La première vie est donc la première intellection__, la deuxième vie la deuxième intellection, et la dernière vie la dernière intellection ».

    | Vie | Ce qui vit | Son intellection |
    | première | l'Intellect | la plus claire : vivre et penser y coïncident |
    | deuxième | l'Âme | la pensée qui raisonne, tournée vers l'Intellect |
    | dernière | les vivants sensibles | la plus obscure : une raison qui agit dans la matière |

    __**La vie de l'âme du monde se divise encore.**__ Dans l'âme du monde, Plotin distingue une intellection **végétative**, une intellection **sensitive** et une intellection **psychique** (rationnelle). Ce sont des intellections « __parce qu'elles sont des raisons__ » ([[traite30|traité 30]], chap. 8) : chaque vie est une {violet}[[g-logos|raison]]{/violet} ({violet}*logos*{/violet}), une forme active, et toute forme est pensée.

    __**Penser sans le savoir.**__ Si l'on prête à la {violet}[[g-phusis|nature]]{/violet}, qui fait croître les plantes, une compréhension, ce n'est pas celle des autres êtres, « mais plutôt de celle d'un homme __profondément endormi__ par rapport à un homme éveillé » ([[traite30|traité 30]], chap. 4). {yellow}Le dormeur ne cesse pas de vivre, mais il ne sait pas ce qu'il fait{/yellow} : telle est la pensée de la plante, la plus obscure.

    ! Le degré le plus haut n'est pas l'Un : l'Un est au-dessus de la vie, comme sa cause. La première vie est celle de l'Intellect, la [[g-vie-parfaite|vie parfaite]].
    ! La division en vies végétative, sensitive et psychique ne recouvre pas celle en première, deuxième et dernière vie : la première division est celle des facultés de l'âme du monde, la seconde celle des rangs de la réalité.

    **Voir aussi** : [[g-vie|Vie]] · [[g-vie-parfaite|Vie parfaite]] · [[g-noesis|Pensée]] · [[g-logos|Raison]] · [[g-phusis|Nature]]
