id: g-degres-de-vie
title: Degrés de vie
icon: book
color: coral
lessons:
- id: g-degres-de-vie-l1
  title: Degrés de vie
  notes: |-
    Les {violet}**degrés de vie**{/violet} sont [def] : la [[g-vie|vie]] ne se dit pas en {pink}espèces côte à côte{/pink}. Le critère qui les sépare est la **clarté**, et ce qui est plus ou moins clair en eux, c'est la **pensée**.

    __**Le critère : la clarté, non le genre.**__ « Vivre » se dit autrement d'une plante et d'un être privé de raison, « la différence entre eux __tenant à la clarté et à l'obscurité__ » ([[traite46|traité 46]], chap. 3). {red}Un genre se divise en espèces égales entre elles{/red} (le chien n'est pas moins animal que le cheval) ; {green}les vies, elles, sont plus ou moins vies{/green}, comme une image est plus ou moins fidèle. C'est pourquoi les __vies inférieures__, dit Plotin, « ne sont __pas plus des vies que le contraire__ » (chap. 3).

    __**Pourquoi la clarté, et non la présence ou l'absence de pensée.**__ On serait tenté de partager les vivants en deux : ceux qui pensent, ceux qui ne pensent pas. C'est exactement le partage que Plotin refuse : les hommes « disent plutôt que certaines sont des intellections et que d'autres ne le sont __aucunement__, car {red}ils ne recherchent pas en quoi consiste la vie en général{/red} » ([[traite30|traité 30]], chap. 8). Or si l'on cherche ce qu'est vivre, on trouve partout la même chose : une raison qui forme le vivant du dedans, et qui est déjà une pensée (étape suivante). Il n'y a donc pas de vie sans pensée, mais une pensée plus ou moins claire : « __toute vie est une intellection__, mais l'une est plus obscure que l'autre, exactement comme l'est la vie ».

    __**Toute vie est une**__ {violet}__**raison**__{/violet}__**, et une raison est déjà pensée.**__ Pourquoi la vie d'une plante serait-elle une pensée ? Ces vies sont des intellections, répond Plotin, « __parce qu'elles sont des raisons__ » (chap. 8). Vivre, pour une plante, c'est se former selon une {violet}[[g-logos|raison]]{/violet} : un contenu intelligible, la forme de son espèce, venu de l'Intellect par l'Âme, qui ordonne la matière du dedans. La nature « produit en elle-même l'objet de sa contemplation, c'est-à-dire __sa raison__ » (chap. 7). {coral}Porter en soi une raison qui agit, c'est porter en soi quelque chose de pensé{/coral}, même si l'on ne le sait pas. C'est la thèse du traité 30 : tout ce qui vit [[g-theoria|contemple]].

    __**La clarté : l'unité de ce qui pense et de ce qui est pensé.**__ Ce qui change d'un degré à l'autre n'est donc pas la présence de la raison, mais la façon dont le vivant la possède. En montant, « les contemplations deviennent toujours plus appropriées à ceux qui contemplent » et « s'unifient à eux » ; dans l'Intellect, « __sujet et objet forment d'emblée une unité__ » (chap. 8). **Une pensée est claire quand le pensant est ce qu'il pense, obscure quand il porte une raison sans se retrouver en elle.** L'âme qui raisonne possède la sienne en la cherchant, morceau par morceau ; l'Intellect l'est. D'où : « __La première vie est donc la première intellection__, la deuxième vie la deuxième intellection, et la dernière vie la dernière intellection ».

    __**Penser sans le savoir.**__ Si l'on prête à la {violet}[[g-phusis|nature]]{/violet}, qui fait croître les plantes, une compréhension, ce n'est pas celle des autres êtres, « mais plutôt de celle d'un homme __profondément endormi__ par rapport à un homme éveillé » ([[traite30|traité 30]], chap. 4). {yellow}Le dormeur ne cesse pas de vivre, mais il ne sait pas ce qu'il fait{/yellow} : telle est la pensée de la plante, la plus obscure.

    | Vie | Ce qui vit | Son intellection |
    | première | l'Intellect | la plus claire : vivre et penser y coïncident |
    | deuxième | l'Âme | la pensée qui raisonne, tournée vers l'Intellect |
    | dernière | les vivants sensibles | la plus obscure : une raison qui agit dans la matière |

    __**La vie de l'âme du monde se divise encore.**__ Dans l'[[g-ame|âme du monde]], Plotin distingue une intellection **végétative**, une intellection **sensitive** et une intellection **psychique** (rationnelle) (chap. 8) : trois façons, de plus en plus claires, de porter une raison.

    ! Le degré le plus haut de vie n'est pas l'Un : l'Un est au-dessus de la vie, comme sa cause. La première vie est celle de l'Intellect, la [[g-vie-parfaite|vie parfaite]].
    ! La division en vies végétative, sensitive et psychique ne recouvre pas celle en première, deuxième et dernière vie : la première division est celle des facultés de l'âme du monde, la seconde celle des rangs de la réalité.

    **Voir aussi** : [[g-vie|Vie]] · [[g-vie-parfaite|Vie parfaite]] · [[g-noesis|Pensée]] · [[g-logos|Raison]] · [[g-phusis|Nature]]
