  - id: g-daimon-l1-q1
    sentence: "La partie de notre âme qui se tient au-dessus de celle qui agit, et que nous choisissons en choisissant notre vie, se dit en grec translittéré ___."
    answer: daimôn
    alt: ["daimon", "daímôn"]
  - id: g-daimon-l1-q2
    sentence: "« Qui donc devient un démon ? – Celui qui l'est déjà ___ » (traité 15, chap. 3)."
    answer: ici
    alt: []
  - id: g-daimon-l1-q3
    sentence: "« Ce démon, en effet, se tient au-dessus, sans ___, tandis que c'est ce qui est après qui agit » (traité 15, chap. 3)."
    answer: agir
    alt: []
  - id: g-daimon-l1-q4
    sentence: "« Si ce qui est actif est ce en vertu de quoi nous sommes des êtres sensitifs, alors le démon est la partie ___ » (traité 15, chap. 3)."
    answer: rationnelle
    alt: []
  - id: g-daimon-l1-q5
    sentence: "« Selon la vie que nous choisissons, en effet, nous choisissons ce qui se tient ___ de nous » (traité 15, chap. 3)."
    answer: au-dessus
    alt: ["au dessus"]
  - id: g-daimon-l1-q6
    sentence: "Celui qui suit son démon « s'élève de ce démon à un démon ___, et ainsi de suite, jusqu'à ce qu'il parvienne en haut » (traité 15, chap. 3)."
    answer: supérieur
    alt: ["superieur"]
  - id: g-daimon-l1-q7
    sentence: "« Nous sommes chacun un monde ___ » (traité 15, chap. 3)."
    answer: intelligible
    alt: []
  - id: g-daimon-l1-q8
    sentence: "« Quand l'âme quitte le corps, elle devient celle de ses parties qu'elle a ___ le plus » (traité 15, chap. 2)."
    answer: développée
    alt: ["developpee"]
  - id: g-daimon-l1-q9
    sentence: "« Ceux, par contre, qui n'ont vécu que par la sensation deviennent des ___ » (traité 15, chap. 2)."
    answer: animaux
    alt: []
  - id: g-daimon-l1-q10
    sentence: "Le choix du démon, dans le mythe, désigne « d'une façon globale et générale, le choix ___ et la disposition de l'âme » (traité 15, chap. 5)."
    answer: préalable
    alt: ["prealable"]
  - id: g-daimon-l1-q11
    sentence: "Le sage agit par sa meilleure partie : « il est donc lui-même un démon, ou bien il agit en accord avec un démon, et un ___ est son démon » (traité 15, chap. 6)."
    answer: dieu
    alt: []
  - id: g-daimon-l1-q12
    sentence: "Notre démon ne nous laisse ni trop descendre ni nous élever au-dessus de lui : « on ne peut devenir autre chose que ce qu'on est ___ » (traité 15, chap. 5)."
    answer: déjà
    alt: ["deja"]
  - id: g-daimon-l1-q13
    sentence: "Le traité de Plotin *Sur le démon qui nous a reçus en partage* est le traité ___."
    answer: 15 (III, 4)
    alt: ["15", "III, 4"]
