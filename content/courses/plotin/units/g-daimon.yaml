# était vide). Citations vérifiées sur la GF (III, 4, 2-3 et 5-6). Le démon
# Éros, fils de Poros et Pénia, est dans les entrées Amour et Poros et Pénia.

id: g-daimon
title: Démon (`daimôn`)
icon: book
color: teal
lessons:
- id: g-daimon-l1
  title: Démon
  notes: |-
    Chez Plotin, le {violet}**démon**{/violet} (*daimôn*) qui nous a reçus en partage est [def]. Ce n'est pas {pink}un esprit gardien, extérieur à nous, qui nous conduirait{/pink}.

    __**Un mot de Platon, relu.**__ Platon raconte que chaque âme reçoit en partage un démon qui la guide, et qu'elle le choisit avant de naître. Plotin demande ce que ce peut être. Le démon n'est pas ce qui agit en nous : « ce démon, en effet, se tient au-dessus, __sans agir__, tandis que c'est ce qui est après qui agit » ([[traite15|traité 15]], chap. 3). Et il ne vient pas d'ailleurs : « Qui donc devient un démon ? – __Celui qui l'est déjà ici__. »

    __**Notre démon dépend de la vie que nous menons.**__ Pourquoi au-dessus de ce qui agit ? Parce que l'âme « est plusieurs choses, toutes choses, aussi bien celles d'en haut que celles d'en bas » : à chaque vie, une de ses parties est active, et celle qui est juste au-dessus la guide. « Si ce qui est actif est ce en vertu de quoi nous sommes des êtres sensitifs, alors __le démon est la partie rationnelle__ ; si par contre notre vie se règle sur le principe rationnel, le démon est ce qui se tient au-dessus de lui, inactif, accordant son consentement à la partie qui agit » (chap. 3). D'où le mot de Platon, « Nous le choisirons » : {coral}« selon la vie que nous choisissons, en effet, __nous choisissons ce qui se tient au-dessus de nous__ »{/coral}.

    | Ce qui agit en nous | Notre démon |
    | la sensation | la partie rationnelle |
    | la raison | ce qui se tient au-dessus d'elle |
    | l'intellect, chez le sage | un dieu |

    __**On devient ce qu'on a développé.**__ Celui qui suit son démon « vit de la vie de ce démon », puis « il s'élève de ce démon __à un démon supérieur__, et ainsi de suite, jusqu'à ce qu'il parvienne en haut » ; car « nous sommes chacun __un monde intelligible__ » (chap. 3). À l'inverse, « quand l'âme quitte le corps, elle devient __celle de ses parties qu'elle a développée le plus__ » (chap. 2) : {yellow}ceux « qui n'ont vécu que par la sensation deviennent des animaux », ceux dont la sensation dormait deviennent des plantes{/yellow}. Ce n'est pas une punition venue du dehors : chacun reçoit la forme de vie qu'il a fait dominer en lui.

    __**Le choix, et ce qui reste en notre pouvoir.**__ Si l'âme choisit là-bas son démon, de quoi reste-t-elle maîtresse ? Plotin répond que le choix du mythe désigne, « à mots couverts, [...] __le choix préalable__ et la disposition de l'âme » (chap. 5 ; voir [[g-proairesis|choix préalable]]). Le démon est donc nôtre, « en tant que "nôtre" renvoie à l'âme », et il borne notre course : il ne nous laisse « ni trop descendre vers le mal [...], ni nous élever au-dessus de lui, ni l'égaler ». Le sage, lui, agit par sa meilleure partie : « il est donc lui-même un démon, ou bien il agit en accord avec un démon, et __un dieu est son démon__ » (chap. 6).

    ! Ce démon n'est pas le démon Éros : celui-ci est un intermédiaire né du désir de l'âme (voir [[g-amour|amour]]) ; celui-là est un niveau de notre propre âme, au-dessus de celui qui agit.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 15, chap. 2 | l'âme devient la partie qu'elle a développée |
    | traité 15, chap. 3 | le démon, au-dessus de ce qui agit ; nous le choisissons |
    | traité 15, chap. 5 | le choix désigne la disposition de l'âme |
    | traité 15, chap. 6 | le sage a un dieu pour démon |

    **Voir aussi** : [[g-ame|Âme]] · [[g-hemeis|Nous]] · [[g-proairesis|Choix préalable]] · [[g-amour|Amour]] · [[traite15|Traité 15]]
