# Unité de texte (voir content/textes.md) : Plotin, traité 9 (VI, 9), Sur le
# Bien ou l'Un, chapitre 1, traduction GF (éd. L. Brisson et J.-F. Pradeau).
# Découpage seul : rappels et cartes à écrire.

id: "t9c1"
title: "Rien n'est sans être un (9 [VI, 9], 1)"
subtitle: "Traité 9, Sur le Bien ou l'Un, chapitre 1"
icon: "page"
color: "coral"
depth: "normale"
lessons:
- id: "t9c1-p1"
  title: "Être, c'est être un"
  notes: ""
  passage:
    label: "l. 1-9"
    part: "Rien n'est sans être un"
    text: |-
      C'est en vertu de l'unité que tous les êtres sont des êtres, aussi bien ceux qui sont des êtres au sens premier du terme que ceux qui sont dits être de quelque manière parmi les êtres. Et en effet, qu'est-ce qui pourrait être, sans être un ?
  points: []
- id: "t9c1-p1b"
  title: "L'armée, le chœur, la maison, le navire"
  notes: ""
  passage:
    label: "l. 1-9"
    part: "Rien n'est sans être un"
    text: |-
      Car, dépourvues de l'unité, qui se dit d'elles, les choses que voici ne sont pas : assurément, il n'y a pas d'armée, si elle n'est pas une, pas de chœur ou de troupeau, s'ils ne sont pas uns. Mais pas non plus de maison ou de navire, s'ils n'ont pas l'unité, parce que la maison est une et le navire un, et s'ils perdaient l'unité, la maison ne serait plus une maison ni le navire un navire.
  points: []
- id: "t9c1-p1c"
  title: "Les grandeurs continues"
  notes: ""
  passage:
    label: "l. 1-9"
    part: "Rien n'est sans être un"
    text: |-
      Il n'y aurait donc pas de grandeurs continues, si l'unité n'était présente en elles ; car c'est un fait que, si elles sont divisées, elles changent d'être dans la mesure où elles perdent l'unité.
  points: []
- id: "t9c1-p2"
  title: "Les corps des plantes et des animaux"
  notes: ""
  passage:
    label: "l. 9-16"
    part: "Les corps, la santé, la beauté, la vertu"
    text: |-
      Et il en va de même encore pour les corps des plantes et des animaux ; étant donné que chacun d'entre eux est un, s'ils fuient l'unité en se fragmentant dans une multiplicité, ils perdent la réalité qui était la leur et qu'ils possédaient, et ne sont plus ce qu'ils étaient ; ils deviennent d'autres choses, et ces choses aussi ne sont que pour autant qu'elles sont unes.
  points: []
- id: "t9c1-p2b"
  title: "La santé, la beauté et la vertu"
  notes: ""
  passage:
    label: "l. 9-16"
    part: "Les corps, la santé, la beauté, la vertu"
    text: |-
      Et la santé se produit quand le corps est coordonné dans l'unité ; la beauté quand l'unité en tient unies les parties ; et la vertu pour l'âme, quand, s'orientant vers l'unité et un accord unique, elle se trouve unifiée.
  points: []
- id: "t9c1-p3"
  title: "La question : est-ce l'âme qui est l'unité ?"
  notes: ""
  passage:
    label: "l. 17-26"
    part: "L'âme est-elle l'unité ?"
    text: |-
      – Mais alors, puisque c'est l'Âme qui conduit toutes choses à l'unité, en les produisant, en les façonnant, en leur donnant la figure et l'ordre, faut-il dire, une fois parvenu à l'Âme, que c'est elle qui dispense l'unité et que c'est elle qui est l'unité ?
  points: []
- id: "t9c1-p3b"
  title: "Elle donne ce qu'elle n'est pas"
  notes: ""
  passage:
    label: "l. 17-26"
    part: "L'âme est-elle l'unité ?"
    text: |-
      – Ne faut-il pas plutôt admettre que, tout comme elle dispense aux corps bien d'autres choses qui sont différentes d'elle, par exemple la figure et la forme, sans être elle-même ce qu'elle donne, de la même manière, s'il est vrai qu'elle donne aussi l'unité, elle la donne comme quelque chose de différent d'elle, et que c'est en tournant son regard vers l'unité qu'elle rend chaque chose une, tout comme elle produit l'homme en contemplant l'Homme et en saisissant, avec l'Homme, l'unité qui est en lui.
  points: []
- id: "t9c1-p4"
  title: "Les degrés d'être et d'unité"
  notes: ""
  passage:
    label: "l. 26-34"
    part: "Plus d'être, plus d'unité"
    text: |-
      En effet, parmi les choses dont on dit qu'elles sont unes, chacune est une dans la mesure où elle possède ce qu'elle est, de sorte que les choses qui « sont » moins ont moins d'unité, tandis que les choses qui « sont » plus ont plus d'unité.
  points: []
- id: "t9c1-p4b"
  title: "L'unité, accident de l'âme"
  notes: ""
  passage:
    label: "l. 26-34"
    part: "Plus d'être, plus d'unité"
    text: |-
      Et l'Âme aussi, qui est différente de l'unité, a plus d'unité dans la mesure où elle est plus véritablement ; mais elle n'est certainement pas l'unité elle-même. Car l'âme est une, et l'unité en est donc en quelque sorte un accident ; mais l'âme et l'unité sont deux choses distinctes, tout comme le sont le corps et l'unité.
  points: []
- id: "t9c1-p4c"
  title: "Plus ou moins loin de l'unité"
  notes: ""
  passage:
    label: "l. 26-34"
    part: "Plus d'être, plus d'unité"
    text: |-
      Et ce qui est divisé en parties, comme un chœur, est ce qu'il y a de plus éloigné de l'unité, tandis que ce qui est continu en est plus proche ; l'âme en est encore plus proche, parce qu'elle en participe elle aussi.
  points: []
- id: "t9c1-p5"
  title: "Participer à l'unité sans l'être"
  notes: ""
  passage:
    label: "l. 34-44"
    part: "L'âme reçoit l'unité d'un autre"
    text: |-
      Mais si quelqu'un voulait montrer que l'Âme et l'unité sont la même chose, et cela parce que, si elle n'était pas une, l'Âme ne pourrait même pas être, il faudrait dire d'abord que les autres choses aussi sont, chacune, parce qu'elles sont unes, mais que l'unité reste différente d'elles : en effet, le corps et l'unité ne sont pas la même chose, mais le corps participe à l'unité.
  points: []
- id: "t9c1-p5b"
  title: "Une âme multiple"
  notes: ""
  passage:
    label: "l. 34-44"
    part: "L'âme reçoit l'unité d'un autre"
    text: |-
      Il faudrait dire ensuite que l'âme est multiple, même celle qui est une, bien qu'elle ne soit pas composée de parties. Il y a en effet beaucoup de facultés en elle qui sont tenues ensemble par l'unité comme par un lien : raisonner, désirer, percevoir.
  points: []
- id: "t9c1-p5c"
  title: "Introduire l'unité et la recevoir"
  notes: ""
  passage:
    label: "l. 34-44"
    part: "L'âme reçoit l'unité d'un autre"
    text: |-
      Certes l'âme, parce qu'elle est elle-même une, introduit l'unité dans les autres choses aussi, mais elle reçoit elle-même l'unité d'un autre.
  points: []
