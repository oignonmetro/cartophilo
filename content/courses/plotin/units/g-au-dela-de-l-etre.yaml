lessons:
- id: g-au-dela-de-l-etre-l1
  title: Au-delà de la réalité
  notes: |-
    Chez Plotin, l'{violet}**au-delà de la réalité**{/violet} (*epekeina tês ousias*) est [def].

    __**Dire ce qu'une chose est, c'est déjà la diviser.**__ Toute phrase de la forme « X est P » distingue un sujet et ce qu'on en dit. Si l'Un était l'être, la pensée, la beauté, il serait {red}un sujet doté de propriétés{/red}, donc composé, donc plus premier. C'est pourquoi le [[traite7|traité 7]] dit qu'il n'y a de lui « __ni discours ni science__ », formule du {sky}*Parménide*{/sky}, et qu'il est « au-delà de la réalité » (chap. 1), formule de la {sky}*République*{/sky}. **L'ineffabilité n'est pas un aveu d'ignorance : c'est la conséquence de sa simplicité.**

    __**Une formule qui n'affirme rien.**__ La difficulté est qu'on semble pourtant dire quelque chose de lui. Plotin répond que l'expression « au-delà de l'être » « ne désigne pas quelque chose de particulier, puisqu'elle n'affirme rien, et elle ne sert pas de nom pour l'Un : elle implique seulement que l'Un est __un "non-ceci"__ » ([[traite32|traité 32]], chap. 6). On ne dit pas ce qu'il est : on écarte tout ce qu'il n'est pas. Même le nom d'« Un » ne lui attribue aucune propriété : il nie en lui toute multiplicité, et Plotin le désigne volontiers par des pronoms, « lui », « celui-là », qui le montrent sans le définir.

    __**Il donne ce qu'il n'a pas.**__ On croirait qu'une cause doit contenir ce qu'elle donne. Plotin répond : « il n'est pas nécessaire que ce qui donne possède ce qu'il donne : il faut plutôt considérer dans de tels cas __ce qui donne comme supérieur__, et ce qui est donné comme inférieur à ce qui donne » ([[traite38|traité 38]], chap. 17). **L'Un donne la vie, la forme et la pensée sans être vie, forme ni pensée** : s'il était l'une d'elles, il ne pourrait les donner toutes.

    ! « Au-delà de la réalité » ne veut pas dire « néant » : l'Un n'est pas moins que l'être, il est ce sans quoi rien ne serait. Et s'il ne se pense pas, ce n'est pas l'inconscience d'une chose inerte : il est au-dessus de la pensée, non au-dessous.

    **Voir aussi** : [[g-un|Un]] · [[g-procession|Procession]] · [[g-intellect|Intellect]] · [[g-henosis|Hénose]]
  points:
  - id: g-un-l2-q1
    sentence: "Dire ce qu'une chose est, c'est y distinguer un sujet et ce qu'on en dit ; c'est pourquoi il n'y a de l'Un, selon une formule du *Parménide* (142a) reprise par le traité 7, « ni ___ ni science »."
    answer: discours
    alt: []
  - id: g-un-l1-9
    sentence: "L'expression grecque, translittérée, qu'emploie Plotin pour dire que l'Un est « au-delà de l'être » est ___."
    answer: epekeina tês ousias
    alt: []
  - id: g-un-l2-q2
    sentence: "Parce qu'être quelque chose supposerait déjà la composition d'un sujet et de ses propriétés, l'Un est dit par le traité 7 « au-delà de la ___ » (chap. 1, l. 9-10), formule de la *République* (VI, 509b)."
    answer: réalité
    alt: ["realite"]
  - id: g-un-l2-q3
    sentence: "La formule « au-delà de la réalité » (*epekeina tês ousias*), que Plotin applique à l'Un, vient de la ___ de Platon (VI, 509b)."
    answer: République
    alt: ["Republique"]
  - id: g-un-l2-q4
    sentence: "« Il n'est pas nécessaire que ce qui donne ___ : il faut plutôt considérer dans de tels cas ce qui donne comme supérieur, et ce qui est donné comme inférieur à ce qui donne » (traité 38, chap. 17, l. 3-5)."
    answer: possède ce qu'il donne
    alt: ["possede ce qu'il donne"]
  - id: g-un-l2-q5
    sentence: "« Il n'est pas nécessaire que ce qui donne possède ce qu'il donne : il faut plutôt considérer dans de tels cas ce qui donne comme ___, et ce qui est donné comme inférieur à ce qui donne » (traité 38, chap. 17, l. 3-5)."
    answer: supérieur
    alt: ["superieur"]
  - id: g-un-l2-q6
    sentence: "L'Un donne la vie, la forme et la pensée sans être lui-même vie, forme ni pensée, car s'il était l'une d'elles, il ne pourrait les donner ___."
    answer: toutes
    alt: []
  - id: g-un-l2-q7
    sentence: "Le nom d'« Un » ne dit pas une propriété du principe : il nie en lui toute ___."
    answer: multiplicité
    alt: ["multiplicite"]
  - id: g-un-l2-q8
    sentence: "Dire l'Un « au-delà de la réalité », ce n'est pas en faire un néant : il n'est pas le premier des étants, mais la ___ pour qu'il y ait des étants."
    answer: condition
    alt: []
  - id: g-au-dela-de-l-etre-l1-q1
    sentence: "L'expression « au-delà de l'être » n'affirme rien et ne nomme pas l'Un : « elle implique seulement que l'Un est un \"non-___\" » (traité 32, chap. 6)."
    answer: ceci
    alt: []
