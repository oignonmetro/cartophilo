# Entrée du glossaire de Plotin (skill glossaire), écrite le 2026-10-21 (elle
# était vide). Citations vérifiées sur la GF (I, 2, 3 ; V, 1, 3 ; III, 8, 2 ;
# III, 2, 15).

id: g-logos
title: Raison (`logos`)
icon: book
color: coral
lessons:
- id: g-logos-l1
  title: Raison
  notes: |-
    Chez Plotin, la {violet}**raison**{/violet} (*logos*) est [def]. Elle n'est pas d'abord {pink}le raisonnement{/pink}.

    __**Chaque degré est le déploiement du précédent.**__ Le mot grec dit aussi la parole, et Plotin s'en sert : « de même que __le discours qui est dans la voix n'est qu'une imitation__ de celui qui est dans l'âme, de même aussi celui qui est dans l'âme n'est que l'imitation de celui qui est dans une autre réalité ». Et « de même donc que le discours articulé est fragmenté par rapport à celui qui est dans l'âme, de même aussi celui qui est dans l'âme, puisqu'il en est l'interprète, __est fragmenté par rapport à ce qui est avant lui__ » ([[traite19|traité 19]], chap. 3). **Une raison est donc ce qu'une réalité devient quand elle se déploie dans une autre**, comme une pensée devient phrase.

    __**L'Âme est la raison de l'Intellect.**__ C'est le premier sens métaphysique du mot : « l'âme est __la raison de l'Intellect__, elle est toute l'activité, la vie qu'il projette pour donner une existence au reste » ([[traite10|traité 10]], chap. 3). Les Formes, qui sont ensemble dans l'{violet}[[g-intellect|Intellect]]{/violet}, deviennent dans l'[[g-ame|Âme]] des raisons : les mêmes, mais déployées et actives.

    __**Des raisons qui produisent : vivantes, puis mortes.**__ La [[g-phusis|nature]] elle-même est une raison, qui produit sans calcul. Mais la chaîne s'épuise : « la raison qui correspond à la figure visible est la dernière ; __elle est morte__ et elle n'est plus capable d'en produire une autre, alors que la raison qui est la sœur de celle qui produit la figure __possède la vie__ » ([[traite30|traité 30]], chap. 2). {yellow}La forme d'une plante peut encore en engendrer une autre par la graine ; la couleur d'un pétale n'engendre plus rien.{/yellow} Les raisons qui produisent les vivants sont les [[g-logos-spermatikos|raisons séminales]].

    __**La raison de l'univers.**__ Dans les traités sur la providence, tout l'univers est l'œuvre d'une seule raison : « __la raison est principe__, la raison est toutes les choses qui sont engendrées conformément à la raison » ([[traite47|traité 47]], chap. 15). La difficulté est d'expliquer alors la « guerre implacable » entre les vivants. Plotin répond que cette raison n'est pas simple : elle embrasse les contraires, comme un drame contient des rôles opposés, et c'est leur accord d'ensemble qui fait la beauté du tout.

    ! Une raison n'est pas une Forme intelligible : c'est la même Forme, mais au niveau de l'âme, déployée et active dans le sensible. Et elle n'est pas le *pneuma* stoïcien : elle est incorporelle.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 19, chap. 3 | chaque discours imite et déploie le précédent |
    | traité 10, chap. 3 | l'Âme, raison de l'Intellect |
    | traité 30, chap. 2 | la dernière raison est morte |
    | traité 47, chap. 15 | la raison de l'univers est principe |

    **Voir aussi** : [[g-logos-spermatikos|Raison séminale]] · [[g-ame|Âme]] · [[g-phusis|Nature]] · [[g-eidos|Forme]] · [[g-dianoia|Réflexion]]
