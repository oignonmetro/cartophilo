  points:
  - id: g-logos-l1-q1
    sentence: "Le principe formateur par lequel une réalité supérieure s'exprime dans une inférieure, et non d'abord le raisonnement, se dit en grec translittéré ___."
    answer: logos
    alt: ["lógos"]
  - id: g-logos-l1-q2
    sentence: "« De même que le discours qui est dans la voix n'est qu'une ___ de celui qui est dans l'âme, de même aussi celui qui est dans l'âme n'est que l'imitation de celui qui est dans une autre réalité » (traité 19, chap. 3)."
    answer: imitation
    alt: []
  - id: g-logos-l1-q3
    sentence: "Le discours qui est dans l'âme, « puisqu'il en est l'interprète, est ___ par rapport à ce qui est avant lui » (traité 19, chap. 3)."
    answer: fragmenté
    alt: ["fragmente"]
  - id: g-logos-l1-q4
    sentence: "« L'âme est la ___ de l'Intellect, elle est toute l'activité, la vie qu'il projette pour donner une existence au reste » (traité 10, chap. 3)."
    answer: raison
    alt: []
  - id: g-logos-l1-q5
    sentence: "Les Formes, qui sont ensemble dans l'Intellect, deviennent dans l'Âme des ___ : les mêmes, mais déployées et actives."
    answer: raisons
    alt: ["logoi"]
  - id: g-logos-l1-q6
    sentence: "« La raison qui correspond à la figure visible est la dernière ; elle est ___ et elle n'est plus capable d'en produire une autre » (traité 30, chap. 2)."
    answer: morte
    alt: []
  - id: g-logos-l1-q7
    sentence: "La raison « qui est la sœur de celle qui produit la figure possède la ___ et produit dans l'être engendré la même puissance que celle qu'elle possède » (traité 30, chap. 2)."
    answer: vie
    alt: []
  - id: g-logos-l1-q8
    sentence: "Dans le premier traité sur la providence, tout l'univers est l'œuvre d'une seule raison : « la raison est ___, la raison est toutes les choses qui sont engendrées conformément à la raison » (traité 47, chap. 15)."
    answer: principe
    alt: []
  - id: g-logos-l1-q9
    sentence: "La raison de l'univers n'est pas simple : elle embrasse les contraires, comme un ___ contient des rôles opposés dont l'accord fait la beauté du tout."
    answer: drame
    alt: ["théâtre", "pièce"]
  - id: g-logos-l1-q10
    sentence: "Une raison n'est pas une Forme intelligible : c'est la même Forme, mais au niveau de l'___, déployée et active dans le sensible."
    answer: âme
    alt: ["ame", "Âme"]
