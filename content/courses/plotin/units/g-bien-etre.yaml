# Entrée du glossaire de Plotin (skill glossaire), écrite le 2026-10-24 à la
# demande de l'utilisateur (elle était une entrée à écrire, à laquelle
# Bonheur renvoie), refondue le 2026-10-25 après sa relecture : chaque étape
# démontre la thèse de son intitulé (arguments demandés à NotebookLM,
# recoupés). Citations vérifiées sur la GF (I, 4, 1-4, 6 et 14 ; III, 4, 4 ;
# IV, 4, 18-19 ; V, 8, 11). Le terme grec, eupatheia, est celui de la GF
# (traité 46, note 4, qui le dit difficile à traduire, parce qu'il vaut
# pour les plantes comme pour les hommes). Que la santé passe inaperçue a
# ses cartes dans Santé.

id: g-bien-etre
title: Bien-être (`eupatheia`)
icon: book
color: teal
lessons:
- id: g-bien-etre-l1
  title: Bien-être
  notes: |-
    Chez Plotin, le {violet}**bien-être**{/violet} (*eupatheia*) est [def]. Ce n'est {pink}ni le bonheur ni le plaisir{/pink}, et c'est pourquoi la question *comment se sentir bien ?* n'est pas, pour lui, celle du bonheur.

    __**Le bien-être appartient à tous les vivants, plantes comprises.**__ Tout vivant a une fonction que lui fixe sa nature : se nourrir, croître, porter des fruits, chanter. Le bien-être est l'état de celui qui l'exerce sans obstacle ; donc tout vivant peut l'avoir. Les {yellow}oiseaux chanteurs{/yellow} « éprouvent du bien-être dans d'autres circonstances, mais particulièrement quand ils exercent leur fonction naturelle __en chantant__ », et même {yellow}les plantes{/yellow} : « il est possible même pour les plantes d'éprouver du bien-être ou non, comme de donner des fruits ou de ne pas en donner » ([[traite46|traité 46]], chap. 1).

    __**Le bonheur n'est pas le bien-être, parce qu'il n'appartient qu'à la vie parfaite.**__ Si le bonheur était le bien-être, il faudrait l'accorder aux plantes : « on l'attribuerait également aux plantes qui sont elles aussi des vivants et qui ont une vie déployée vers une fin » (*ibid*.). Plotin ne s'en tient pas à l'indignation ; il en donne la raison.
    - Le bonheur est dans la vie : « Posons que le bonheur se trouve dans la vie » (chap. 3).
    - Mais vivre ne se dit pas de la même façon de tous : « la vie se dit en plusieurs sens », et entre la plante et la bête, « la différence entre eux __tenant à la clarté et à l'obscurité__ » (*ibid*.) ; les vies d'en bas sont des images de la vie première (voir [[g-degres-de-vie|degrés de vie]]).
    - Donc la vie bonne a les mêmes degrés : « si une chose est l'image d'une autre, il est évident que __la vie bonne de la première est à son tour l'image__ de celle de la seconde » (*ibid*.).
    - Et le bonheur, au sens propre, est la vie bonne de la vie qui ne manque de rien : « le bonheur ne saurait appartenir qu'à celui qui __vit dans la plénitude__ » (*ibid*. ; voir [[g-vie-parfaite|vie parfaite]]).
    {coral}Le bien-être de la plante est bien le bien de sa vie, mais cette vie n'est qu'une image obscure de la vie : son bien-être n'est qu'une image du bonheur.{/coral} **Ce qui sépare le bonheur du bien-être n'est pas un degré de plaisir, mais un degré de vie.**

    __**Sentir son bien-être ne suffit pas, parce que savoir que c'est un bien est l'œuvre de la raison.**__ Ceux qui refusent le bonheur aux plantes disent : elles ne sentent pas. Ils font donc de la sensation la condition du bonheur, et Plotin montre que ce critère s'effondre, quel que soit le rôle qu'on lui donne.
    - Si le bien est dans l'affection : elle est bonne avant qu'on la sente, il « faut que cette dernière elle-même soit bonne, avant que l'on y soit attentif » ([[traite46|traité 46]], chap. 2) ; la plante qui l'a sans la sentir a donc déjà la vie bonne, et la sensation n'ajoute rien.
    - Si le bien est dans la sensation : sentir n'est ni bon ni mauvais, et « comment, alors que __la sensation et son objet sont indifférents__, peuvent-ils dire que ce qui vient des deux est bon ? » (*ibid*.).
    - Si le bien est de reconnaître qu'un bien est présent : sentir dit que c'est agréable, non que c'est un bien ; « si on reconnaît que c'est le bien, __ce n'est pas là dès lors l'œuvre de la sensation__, mais d'une autre faculté plus haute que celle de la sensation » (*ibid*.).
    D'où la conclusion : « la cause de la {coral}vie bonne{/coral} ne sera donc pas le plaisir, mais __la capacité à__ {coral}__juger que le plaisir est un bien__{/coral} » (*ibid*.). Or « la faculté qui juge est plus élevée que celle qui est relative à l'affection, car __c'est une raison ou un intellect__ » (*ibid*.), et une raison ne peut sans se contredire mettre au-dessus d'elle ce qui n'en est pas une. {green}Le bien relève de la raison qui juge, non de ce qu'on éprouve{/green} : on retrouve, par un autre chemin, la conclusion de l'étape précédente (voir [[g-agathon|bien]] et [[g-bonheur|bonheur]]).

    __**Le meilleur état ne se sent pas, parce qu'on ne sent que ce qui diffère de nous.**__ Le bien-être, même senti, ne peut donc pas être le bonheur ; mais il y a plus : à son meilleur, il n'est même pas senti. Pourquoi ? Parce que la sensation saisit ce qui nous arrive du dehors. La maladie « est quelque chose de différent de nous et qui ne nous est pas propre, mais qui, __de ce fait, est particulièrement sensible__ » ; la santé, au contraire, « s'installe auprès de nous, comme quelque chose qui nous est propre et qui fait un avec nous » ; or « aussi bien ce qui est à nous que nous-mêmes __échappons à la sensation__ » ([[traite31|traité 31]], chap. 11). Le plaisir lui-même suppose un manque : il est « la connaissance que prend un être vivant du fait que l'image d'une âme __revient une fois de plus__ s'adapter à un corps » ([[traite28|traité 28]], chap. 19) ; là où rien ne s'est retiré, rien ne revient. C'est pourquoi l'âme du monde, qui ne manque de rien, connaît ce que connaissent « ceux qui sont dans un état conforme à la nature : __le calme, pas même le plaisir__ » ([[traite15|traité 15]], chap. 4).

    __**Le bien-être est l'affaire du vivant, parce que nous ne sommes pas le vivant.**__ Le bien-être est une affection, et les affections ne sont pas de l'âme : « les affections de ce genre __n'appartiennent absolument pas à l'âme__, mais à un organisme, c'est-à-dire à quelque chose qui constitue un ensemble, un composé » ([[traite28|traité 28]], chap. 18). Or « l'homme, et surtout le sage, __n'est pas un composé__ » ; il est l'âme qui pense (voir [[g-hemeis|nous]]). Le bonheur, lui, « est l'activité de l'âme, mais pas de l'âme tout entière – elle n'est certes pas en effet l'activité de l'âme végétative » ([[traite46|traité 46]], chap. 14). Bien-être et bonheur n'ont donc pas le même sujet : l'un est au [[g-vivant|vivant]], l'autre à nous. C'est pourquoi la perte de ses proches cause au sage du chagrin, mais « __ce n'est pas à lui qu'elle en cause__, mais à ce qui, en lui, est dépourvu d'intellect » (chap. 4).

    __**Le bien-être n'ajoute rien au bonheur, parce que la santé est nécessaire, non bonne.**__ Un bien est ce qui attire quand on l'a. Or la santé et l'absence de douleur, « quand on les possède, __n'ont rien d'attrayant et n'ajoutent rien au bonheur__, mais [...] l'on recherche lorsqu'elles sont absentes », de sorte qu'« il est raisonnable de dire qu'elles sont nécessaires, mais non pas qu'elles sont bonnes » ([[traite46|traité 46]], chap. 6). On ne les veut que pour ne plus souffrir : « ce n'est sans doute pas les éviter que l'on veut, mais bien plutôt __ne pas avoir à les éviter__ » (*ibid*.). Et ce qui n'ajoute rien ne peut rien ôter : « si une chose n'ajoute rien à ce qui reste identique, comment son contraire pourrait-il le détruire ? » (chap. 14). Le sage veut pourtant la santé, mais pour son corps et non pour lui : il recherche ces choses « parce qu'elles sont nécessaires, non pas à lui-même mais __à ce qui lui appartient__ » (chap. 4), et, vieux, ne veut être troublé de rien, « pour éviter de devoir prêter attention à son corps » (chap. 14).

    | Notion | Ce qu'elle est | Qui peut l'avoir |
    | le plaisir | une affection, sentie quand ce qui manquait revient | tout ce qui sent |
    | le bien-être | l'exercice sans obstacle de sa fonction | tout vivant, plantes comprises |
    | le bonheur | la vie parfaite, celle de l'intellect | l'homme qui la vit en acte |

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 15, chap. 4 | l'état conforme à la nature, le calme sans plaisir |
    | traité 28, chap. 18 | les affections sont du composé, non de l'âme |
    | traité 31, chap. 11 | ce qui est à nous échappe à la sensation |
    | traité 46, chap. 1 | le bien-être appartient à tous les vivants |
    | traité 46, chap. 2 | juger que c'est un bien relève de la raison |
    | traité 46, chap. 3 | le bonheur, vie bonne de la vie parfaite |
    | traité 46, chap. 6 | la santé est nécessaire, non bonne |
    | traité 46, chap. 14 | le sage n'est pas un composé |

    **Voir aussi** : [[g-bonheur|Bonheur]] · [[g-agathon|Bien]] · [[g-sante|Santé]] · [[g-vivant|Vivant]] · [[g-souffrance|Souffrance]] · [[g-joie-tristesse|Joie / Tristesse]]
