  - id: g-bien-etre-l1-q1
    sentence: "L'état d'un vivant qui exerce sans obstacle sa fonction naturelle, plantes comprises, se dit en grec translittéré ___."
    answer: eupatheia
    alt: ["eupátheia"]
  - id: g-bien-etre-l1-q2
    sentence: "Les oiseaux chanteurs « éprouvent du bien-être dans d'autres circonstances, mais particulièrement quand ils exercent leur fonction naturelle en ___ » (traité 46, chap. 1)."
    answer: chantant
    alt: []
  - id: g-bien-etre-l1-q3
    sentence: "« Il est possible même pour les plantes d'éprouver du bien-être ou non, comme de donner des ___ ou de ne pas en donner » (traité 46, chap. 1)."
    answer: fruits
    alt: []
  - id: g-bien-etre-l1-q4
    sentence: "« On admet difficilement que le bonheur puisse être abaissé au niveau des autres ___ » (traité 46, chap. 1)."
    answer: vivants
    alt: []
  - id: g-bien-etre-l1-q5
    sentence: "Ajouter la sensation, c'est attribuer le bien « non plus à l'affection présente, mais à la ___ » de cette affection (traité 46, chap. 2)."
    answer: connaissance
    alt: []
  - id: g-bien-etre-l1-q6
    sentence: "« Si on reconnaît que c'est le bien, ce n'est pas là dès lors l'œuvre de la ___, mais d'une autre faculté plus haute » (traité 46, chap. 2)."
    answer: sensation
    alt: []
  - id: g-bien-etre-l1-q7
    sentence: "« La cause de la vie bonne ne sera donc pas le plaisir, mais la capacité à ___ que le plaisir est un bien » (traité 46, chap. 2)."
    answer: juger
    alt: []
  - id: g-bien-etre-l1-q8
    sentence: "« La faculté qui juge est plus élevée que celle qui est relative à l'affection [...] ; le plaisir, pour sa part, est une ___ » (traité 46, chap. 2)."
    answer: affection
    alt: []
  - id: g-bien-etre-l1-q9
    sentence: "À l'âme du monde « il lui arrive la même chose qu'à ceux qui sont dans un état conforme à la nature : le ___, pas même le plaisir » (traité 15, chap. 4)."
    answer: calme
    alt: []
  - id: g-bien-etre-l1-q10
    sentence: "Le chagrin du sage, « ce n'est pas à lui qu'elle en cause, mais à ce qui, en lui, est dépourvu d'___ » (traité 46, chap. 4)."
    answer: intellect
    alt: []
