# Entrée du glossaire de Plotin (skill glossaire), écrite le 2026-10-24 à la
# demande de l'utilisateur (elle était une entrée à écrire, à laquelle
# Bonheur renvoie). Citations vérifiées sur la GF (I, 4, 1-2, 4 et 6 ; III,
# 4, 4). Le terme grec, eupatheia, est celui de la GF (traité 46, note 4,
# qui le dit difficile à traduire, parce qu'il vaut pour les plantes comme
# pour les hommes). Que la santé passe inaperçue a ses cartes dans Santé.

id: g-bien-etre
title: Bien-être (`eupatheia`)
icon: book
color: teal
lessons:
- id: g-bien-etre-l1
  title: Bien-être
  notes: |-
    Chez Plotin, le {violet}**bien-être**{/violet} (*eupatheia*) est [def]. Ce n'est {pink}ni le bonheur ni le plaisir{/pink}, et c'est pourquoi la question *comment se sentir bien ?* n'est pas, pour lui, celle du bonheur.

    __**Le bien-être est à la portée de tous les vivants.**__ Plotin part d'une objection : si la vie bonne consiste « soit dans le bien-être, soit dans l'accomplissement de la fonction propre », alors « dans les deux cas, __elle appartiendra également aux autres vivants__ ». Les {yellow}oiseaux chanteurs{/yellow} « éprouvent du bien-être [...] particulièrement quand ils exercent leur fonction naturelle __en chantant__ », et même {yellow}les plantes{/yellow} : « il est possible même pour les plantes d'éprouver du bien-être ou non, comme de donner des fruits ou de ne pas en donner » ([[traite46|traité 46]], chap. 1). {coral}Le bien-être est donc l'__état de tout vivant qui fonctionne bien__{/coral} ; et si le bonheur n'était que cela, les plantes seraient heureuses. Or « on admet difficilement que le bonheur puisse être abaissé __au niveau des autres vivants__ ».

    __**Sentir qu'on est bien ne suffit pas.**__ On pourrait réserver le bonheur à ceux qui sentent leur bien-être. Plotin montre que ce critère s'effondre. Car si l'affection est bonne, elle l'est avant qu'on la sente ; ajouter la sensation, c'est donc placer le bien « non plus à l'affection présente, mais __à la connaissance__ » de cette affection. Et **pour savoir que ce qu'on sent est un bien, il faut plus que sentir** : « si on reconnaît que c'est le bien, __ce n'est pas là dès lors l'œuvre de la sensation__, mais d'une autre faculté plus haute ». D'où la conclusion : « la cause de la {coral}vie bonne{/coral} ne sera donc pas le plaisir, mais __la capacité à__ {coral}__juger que le plaisir est un bien__{/coral} » ([[traite46|traité 46]], chap. 2). {green}Le bien relève de la raison qui juge, non de ce qu'on éprouve{/green} : c'est pourquoi le [[g-bonheur|bonheur]] est la vie de l'intellect.

    __**Le meilleur état ne se sent pas : le calme.**__ Plus le bien-être est complet, moins il se remarque. De l'âme du monde, qui n'a ni manque ni trouble, Plotin dit : « il lui arrive la même chose qu'à ceux qui sont dans un état conforme à la nature : __le calme, pas même le plaisir__ » ([[traite15|traité 15]], chap. 4). Pourquoi pas le plaisir ? Parce que le plaisir est une affection : on le sent quand quelque chose change, quand un manque se comble ; l'état qui ne manque de rien ne produit rien à sentir. De même, « on ne se soucie pas de la santé quand on la possède » ([[traite46|traité 46]], chap. 6 ; voir [[g-sante|santé]]).

    __**Le bien-être est l'affaire du vivant, non de nous.**__ Le sage n'est pas insensible : la perte de ses proches peut causer du chagrin, mais « ce n'est pas à lui qu'elle en cause, mais __à ce qui, en lui, est dépourvu d'intellect__ » ([[traite46|traité 46]], chap. 4). Le bien-être et le mal-être appartiennent au [[g-vivant|vivant]], le composé ; nous, nous sommes ailleurs (voir [[g-hemeis|nous]]). **Se sentir bien est un bien pour le corps, non le bien de l'homme.**

    | Notion | Ce qu'elle est | Qui peut l'avoir |
    | le plaisir | une affection, sentie quand un manque se comble | tout ce qui sent |
    | le bien-être | l'exercice sans obstacle de sa fonction | tout vivant, plantes comprises |
    | le bonheur | la vie parfaite, celle de l'intellect | l'homme qui la vit en acte |

    ! Le bien-être n'est pas méprisé : il est l'état naturel du vivant, et le sage veille à son corps. Mais il n'ajoute rien au bonheur, et son absence ne l'ôte pas.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 15, chap. 4 | l'état conforme à la nature, le calme sans plaisir |
    | traité 46, chap. 1 | le bien-être appartient à tous les vivants |
    | traité 46, chap. 2 | juger que c'est un bien relève de la raison |
    | traité 46, chap. 4 | le chagrin touche ce qui en nous est sans intellect |
    | traité 46, chap. 6 | la santé possédée ne retient pas l'attention |

    **Voir aussi** : [[g-bonheur|Bonheur]] · [[g-sante|Santé]] · [[g-vivant|Vivant]] · [[g-souffrance|Souffrance]] · [[g-joie-tristesse|Joie / Tristesse]]
