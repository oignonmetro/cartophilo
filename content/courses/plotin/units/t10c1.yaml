- id: t10c1-p3
  title: "L'admiration du sensible et l'ignorance du dieu"
  passage:
    label: "l. 11-22"
    text: "Ne voyant plus ni leurs parents ni elles-mêmes, elles ne s'estiment pas, car elles méconnaissent leur origine en estimant les autres choses. Elles sont émerveillées par toutes choses plutôt que par elles-mêmes, elles sont devant toutes choses frappées de stupéfaction et d'admiration, et s'y attachent. Elles se détachent alors autant qu'elles le peuvent des choses dont elles se sont détournées parce qu'elles ne les estimaient pas, aussi l'estime des choses d'ici-bas et le manque d'estime d'elles-mêmes sont la cause de leur ignorance totale du dieu. Car poursuivre et admirer une autre chose, c'est en même temps pour ce qui l'admire et qui la poursuit admettre qu'il lui est inférieur ; mais ce qui se considère inférieur aux choses qui naissent et qui périssent, et qui se tient pour la moins estimable et la plus mortelle de toutes les choses qu'il estime, ne pourra jamais « se mettre dans l'esprit » la nature et la puissance du dieu."
  points:
