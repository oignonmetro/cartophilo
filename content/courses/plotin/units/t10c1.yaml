- id: "t10c1-p5"
  title: "Ce qui cherche, c'est l'âme"
  notes: |-
    **Le chapitre se referme sur le fondement de toute la recherche :** {coral}**c'est l'âme qui cherche, et elle peut trouver ce qu'elle cherche parce qu'elle lui est apparentée.**{/coral}

    **Pourquoi « Ce qui cherche, c'est l'âme » ?** La recherche ({violet}`zêtein`{/violet}, verbe qui revient avec insistance) a un sujet, l'âme, et un objet, ce qu'elle doit connaître. Elle doit {amber}d'abord se connaître elle-même{/amber} : c'est la première étape, développée au traité 49 (V, 3).

    **Pourquoi « si elle a un œil capable de voir » ?** Avant de chercher, l'âme doit savoir {amber}si elle en est capable{/amber}. L'{violet}œil de l'âme{/violet} est une image platonicienne (*Alcibiade*, 133b-c ; *Sophiste*, 254a ; *République*, VII, 533d) : la faculté de voir l'intelligible.

    **Pourquoi « si ce qu'elle cherche lui est étranger, à quoi bon chercher ? »** Un objet {red}étranger{/red} ne pourrait être ni reconnu ni atteint. Au contraire, s'il lui est {green}apparenté{/green} (`suggenê`), elle peut le trouver. C'est le principe ancien que {violet}le semblable connaît le semblable{/violet}, qu'on trouve déjà chez {sky}Empédocle{/sky}, {sky}Philolaos{/sky} et {sky}Démocrite{/sky}, et que Platon reprend (*République*, VI, 490b).

    **Ce que la fin autorise.** Puisque l'âme est apparentée à l'intelligible, {coral}l'oubli n'est pas une perte définitive{/coral} : la remontée que le traité va développer est possible en droit.

    ! La parenté de l'âme avec le dieu n'est pas {red}une conclusion{/red} du chapitre, mais {green}une condition{/green} de la recherche, que les chapitres suivants établiront.
  passage:
    label: "l. 31-35"
    text: "Ce qui cherche, en effet, c'est l'âme, et ce qui est cherché, c'est ce que l'âme doit connaître, afin d'abord de se connaître elle-même, puis de savoir si elle a la capacité d'entreprendre une telle recherche, si elle a un œil capable de voir et s'il lui convient de chercher. Car si ce qu'elle cherche lui est étranger, à quoi bon chercher ? En revanche, si cet objet lui est apparenté, il convient qu'elle le cherche et elle est capable de le trouver."
  points:
