# Unité de texte (voir content/textes.md) : Plotin, traité 10 (V, 1),
# chapitre 1, traduction F. Fronterotta. Mouvements repérés par leurs lignes.
# Refondue le 2026-11-26 (niveau normale) : rappels écrits d'après les
# cartes-explication (notes de Fronterotta), une leçon d'introduction, les
# mouvements longs coupés en deux, un prolongement ; les cartes-citation
# gardent leur identifiant, recentrées sur leur segment.

id: "t10c1"
title: "L'oubli des âmes (10 [V, 1], 1)"
subtitle: "Traité 10, Des trois hypostases qui ont rang de principes, chapitre 1"
group: "Traité 10 (V, 1) : Sur les trois hypostases qui ont rang de principes"
icon: "page"
color: "coral"
depth: "normale"
intro: |-
  Premier chapitre du traité 10 (V, 1), *Des trois hypostases qui ont rang de
  principes*, dans la traduction de F. Fronterotta (édition de L. Brisson et
  J.-F. Pradeau). Il s'ouvre sur une question qui prolonge la fin du traité 9
  (VI, 9) : **pourquoi les âmes ont-elles oublié leur père ?** Plotin en cherche
  l'origine (l'audace, l'éloignement), en décrit l'effet (l'admiration pour les
  choses d'ici-bas), puis annonce le remède : **deux discours**, dont le second,
  qui fait se remémorer à l'âme son origine et sa dignité, ouvre la recherche
  des chapitres suivants.
lessons:
- id: "t10c1-i1"
  title: "Le chapitre, sa place et son plan"
  notes: |-
    **Le texte ouvre le traité 10 (V, 1), {sky}*Des trois hypostases qui ont rang de principes*{/sky}, cité dans la traduction de {sky}F. Fronterotta{/sky}.** Le traité expose l'Âme, l'Intellect et l'Un ; mais il commence par l'âme humaine, et par une question : {amber}pourquoi les âmes ont-elles oublié le dieu qui est leur père ?{/amber}

    **Pourquoi commencer par l'oubli ?** Le traité 9 (VI, 9), *Sur le Bien ou l'Un*, vient de décrire la source merveilleuse dont tout procède. Une question s'ensuit : si l'âme vient d'un tel principe, {red}pourquoi s'en est-elle éloignée{/red}, et pourquoi s'attache-t-elle au sensible ? Le chapitre 1 répond par la {violet}cause{/violet} de l'éloignement, puis annonce le {violet}remède{/violet} : un discours qui rappelle à l'âme ce qu'elle est. Les chapitres suivants le prononcent, en remontant de l'âme jusqu'à l'Intellect et à l'Un.

    **Sa thèse :** {coral}l'âme ne s'est pas éloignée de son principe par contrainte, mais par l'audace de vouloir s'appartenir{/coral} ; en admirant les choses d'ici-bas, elle s'est jugée inférieure à elles, et cette mésestime de soi la rend incapable de concevoir le dieu. {green}Le remède est de lui faire se souvenir de son origine et de sa dignité.{/green}

    **Le plan.**

    | Mouvement | Lieu | Ce qui s'y joue |
    | poser la question de l'oubli | l. 1-3 | Les âmes, parties issues du dieu, l'ignorent et s'ignorent elles-mêmes, ce qui demande une cause. |
    | nommer l'origine du mal | l. 3-11 | L'audace, la génération, l'altérité et la volonté de s'appartenir font courir l'âme loin de sa source, comme un enfant élevé loin de ses parents. |
    | décrire l'effet de l'éloignement | l. 11-22 | Admirant le sensible, l'âme s'avoue inférieure à lui, se juge la plus mortelle des choses, et ne peut plus concevoir le dieu. |
    | annoncer le remède | l. 22-31 | Deux discours : l'un montre que ce que l'âme estime ne vaut rien, l'autre lui rappelle son origine et sa dignité, et vient en premier. |
    | fonder la recherche | l. 31-35 | C'est l'âme qui cherche ; elle peut trouver ce qu'elle cherche parce qu'elle lui est apparentée. |

    ! Le texte ne décrit pas {red}une faute à punir{/red}, mais {green}un oubli à guérir{/green} : le remède est un savoir, non une expiation.
  passage:
    label: "Introduction"
