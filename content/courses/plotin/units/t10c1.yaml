- id: t10c1-p4
  title: "Les deux discours"
  passage:
    label: "l. 22-31"
    text: "Voilà pourquoi il faut adresser deux discours à ceux qui se trouvent dans cette situation, si quelqu'un doit les faire se retourner dans la direction contraire, vers les choses qui sont premières, et les reconduire à ce qui est le plus haut, un et premier.\n\n– Quels sont donc ces deux discours ?\n\n– Le premier est celui qui montre combien ce que l'âme tient alors pour estimable ne l'est pas (ce que nous développerons davantage ailleurs) ; le second est celui qui instruit l'âme et qui lui fait se remémorer son origine et sa dignité (ce discours précède le premier et, une fois clarifié, il éclairera également le précédent). C'est donc de cela qu'il faut maintenant parler, car le second discours est le plus proche de l'objet de notre recherche et il servira au premier."
