- id: "t10c1-p3b"
  title: "Admirer, c'est s'avouer inférieur"
  notes: |-
    **Plotin justifie la conclusion par un principe :** {coral}**admirer et poursuivre une chose, c'est s'avouer inférieur à elle**{/coral} **; l'âme qui se juge inférieure à ce qui naît et périt ne pourra jamais concevoir le dieu.**

    **Pourquoi « Car » ?** La phrase donne la {amber}raison{/amber} de ce qui précède. Selon une thèse proprement plotinienne, {violet}toute réalité admire et poursuit ce qu'elle juge supérieur à elle{/violet} : l'admiration est donc toujours l'aveu de sa propre {red}infériorité{/red}. {yellow}On n'admire pas ce qu'on se sait capable de surpasser.{/yellow}

    **Pourquoi « la moins estimable et la plus mortelle » ?** En admirant les choses qui naissent et périssent, l'âme se met {red}au-dessous du périssable{/red} : elle se tient pour {teal}« la plus mortelle »{/teal} (`thnêtotaton`, superlatif forgé par Plotin, qu'il n'emploie qu'ici). C'est le comble du renversement : l'âme, immortelle, se croit plus mortelle que les choses mortelles.

    **Pourquoi ne pourra-t-elle « se mettre dans l'esprit » le dieu ?** L'expression vient d'{sky}Homère{/sky} (*Iliade*, XV, 566). Une âme qui se croit la plus basse des choses {coral}ne peut concevoir ce qui est le plus haut{/coral} : elle n'a plus en elle de quoi le mesurer. Le « dieu » est ici encore {violet}l'Intellect{/violet}, sa nature et sa puissance.

    ! Le principe ne condamne pas {red}l'admiration{/red} : admirer ce qui est réellement supérieur, l'intelligible, est {green}le chemin de la remontée{/green}.
  passage:
    label: "l. 11-22"
    text: "Car poursuivre et admirer une autre chose, c'est en même temps pour ce qui l'admire et qui la poursuit admettre qu'il lui est inférieur ; mais ce qui se considère inférieur aux choses qui naissent et qui périssent, et qui se tient pour la moins estimable et la plus mortelle de toutes les choses qu'il estime, ne pourra jamais « se mettre dans l'esprit » la nature et la puissance du dieu."
