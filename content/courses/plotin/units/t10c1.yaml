- id: "t10c1-p4"
  title: "Il faut deux discours"
  notes: |-
    **De ce diagnostic suit le remède :** {coral}**il faut adresser deux discours à l'âme pour la faire se retourner vers les choses premières**{/coral} **et la reconduire à l'Un.**

    **Pourquoi « Voilà pourquoi » ?** Le remède se règle sur la cause. Puisque le mal vient d'{red}une erreur d'estime{/red}, il se guérit par {green}un discours{/green}, qui corrige cette estime : c'est une thérapie par la connaissance.

    **Pourquoi « se retourner dans la direction contraire » ?** L'expression répond exactement à la course des l. 3-11 : les âmes couraient {red}« dans la direction contraire »{/red} de leur source ; il faut les faire {amber}se retourner{/amber} dans l'autre sens. C'est une {violet}conversion{/violet} (`epistrophê`), un retournement vers le principe.

    **Pourquoi « ce qui est le plus haut, un et premier » ?** Le terme de la remontée est {violet}l'Un{/violet}, le premier principe, au-delà de l'Intellect. Le traité suivra cet ordre, de l'âme à l'Intellect, puis à l'Un.

    ! Le discours ne s'adresse pas à {red}quelqu'un d'autre{/red} que l'âme égarée : c'est {green}l'âme elle-même{/green} qu'il faut convaincre.
  passage:
    label: "l. 22-31"
    text: "Voilà pourquoi il faut adresser deux discours à ceux qui se trouvent dans cette situation, si quelqu'un doit les faire se retourner dans la direction contraire, vers les choses qui sont premières, et les reconduire à ce qui est le plus haut, un et premier."
  points:
