    fragment: "1/3"
    sentence: "« Ne voyant plus ni leurs parents ni elles-mêmes, elles ne ___ pas, car elles méconnaissent leur origine en estimant les autres choses. Elles sont émerveillées par toutes choses plutôt que par elles-mêmes, elles sont devant toutes choses frappées de stupéfaction et d'admiration, et s'y attachent. »"
