- id: "t10c1-p2b"
  title: "Courir au plus loin, comme des enfants arrachés"
  notes: |-
    **L'âme qui croit jouir de son indépendance** {coral}**se sert de son propre mouvement pour courir à l'opposé de sa source**{/coral}**, jusqu'à ignorer qu'elle en vient, comme des enfants élevés loin de leurs parents.**

    **Pourquoi « elles croient jouir de leur indépendance » ?** L'indépendance (`autexousios`, synonyme de *hekousios*, le volontaire, que le traité 39, VI, 8, examine) est {red}une illusion{/red} : l'âme croit s'appartenir, alors qu'elle ne fait que s'éloigner de ce qui la fait être. Le médioplatonicien {sky}Albinus{/sky} parlait déjà du « choix erroné de l'indépendance ».

    **Pourquoi « le mouvement considérable qui leur est propre » ?** C'est l'{violet}automotricité{/violet} de l'âme, sa capacité de se mouvoir par soi. Dans le {sky}*Phèdre*{/sky} (245c), elle prouvait son {green}immortalité{/green}. Plotin {coral}retourne contre l'âme la preuve de sa dignité{/coral} : la même capacité, mal orientée, l'emporte loin de son principe.

    **Pourquoi « courir dans la direction contraire » ?** Le mouvement de l'âme n'est pas un égarement au hasard, mais un {amber}détournement{/amber} : elle tourne le dos à sa source et va {teal}« au plus loin de là-bas »{/teal}. Plus elle va loin, plus elle oublie, {red}jusqu'à ignorer qu'elle en provient{/red}.

    **Pourquoi l'image des enfants ?** {yellow}Arrachés à leurs parents dès la naissance et élevés loin d'eux, ils ne savent plus ni qui sont leurs parents ni qui ils sont{/yellow}. L'image, déjà dans le traité 9 (VI, 9, 7), dit l'enchaînement des deux ignorances de la question initiale. Elle ne comporte, note {sky}F. Brunner{/sky}, {red}aucune nuance de désobéissance ni de révolte{/red} : les âmes ne se retournent pas contre leur origine, elles s'en détournent.

    ! Ne pas lire l'image comme {red}la chute chrétienne{/red} : il n'y a ni désobéissance ni châtiment, mais {green}un oubli progressif{/green}.
  passage:
    label: "l. 3-11"
    text: "Chaque fois qu'elles croient jouir de leur indépendance, elles se servent du mouvement considérable qui leur est propre, elles se mettent à courir dans la direction contraire et se portent au plus loin de là-bas, en allant jusqu'à ignorer qu'elles en proviennent elles aussi. Elles sont comme des enfants qui, arrachés à leurs parents dès la naissance et longtemps élevés loin d'eux, s'ignorent eux-mêmes comme ils ignorent leurs parents."
