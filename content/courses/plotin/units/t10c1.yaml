    sentence: "« Ce qui cherche, en effet, c'est ___, et ce qui est cherché, c'est ce que l'âme doit connaître, afin d'abord de se connaître elle-même, puis de savoir si elle a la capacité d'entreprendre une telle recherche, si elle a un œil capable de voir et s'il lui convient de chercher. »"
