- id: t10c1-p5
  title: "Ce qui cherche, c'est l'âme"
  passage:
    label: "l. 31-35"
    text: "Ce qui cherche, en effet, c'est l'âme, et ce qui est cherché, c'est ce que l'âme doit connaître, afin d'abord de se connaître elle-même, puis de savoir si elle a la capacité d'entreprendre une telle recherche, si elle a un œil capable de voir et s'il lui convient de chercher. Car si ce qu'elle cherche lui est étranger, à quoi bon chercher ? En revanche, si cet objet lui est apparenté, il convient qu'elle le cherche et elle est capable de le trouver."
