- id: "t10c1-p3"
  title: "L'admiration du sensible et la mésestime de soi"
  notes: |-
    **L'éloignement a un effet :** {coral}**l'âme, ne se voyant plus, admire toutes choses plutôt qu'elle-même**{/coral}**, s'y attache, et cette estime du sensible jointe à la mésestime de soi est la cause de son ignorance du dieu.**

    **Pourquoi « elles ne s'estiment pas » ?** Ne connaissant plus son origine, l'âme {red}ignore sa propre valeur{/red}, qui lui vient de là. Elle reporte alors son estime sur {amber}les autres choses{/amber}, celles qu'elle voit.

    **Pourquoi « émerveillées », « frappées de stupéfaction et d'admiration » ?** Les mots s'accumulent pour dire un {amber}saisissement{/amber} : l'âme est captivée par le sensible comme par un spectacle. {yellow}Un enfant élevé dans une maison étrangère en admire les richesses sans savoir qu'il est l'héritier d'une demeure plus belle.{/yellow}

    **Pourquoi « s'y attachent » ?** Le verbe (`exartaô`) rappelle l'{sky}*Ion*{/sky} de Platon (533d-e), où il dit l'aimantation qui relie le poète inspiré au dieu. Plotin {coral}applique le même dispositif à un objet inversé{/coral} : l'âme s'aimante aux choses les plus basses.

    **Pourquoi « elles se détachent […] des choses dont elles se sont détournées » ?** Le mouvement est double : attachement au sensible, {red}détachement de l'intelligible{/red}. L'un nourrit l'autre. D'où la conclusion : {coral}l'estime des choses d'ici-bas et le manque d'estime de soi sont la cause de l'ignorance totale du dieu{/coral}.

    ! La cause de l'ignorance n'est pas {red}un défaut d'intelligence{/red}, mais {green}une erreur d'estime{/green} : l'âme se trompe sur la valeur des choses et sur la sienne.
  passage:
    label: "l. 11-22"
    text: "Ne voyant plus ni leurs parents ni elles-mêmes, elles ne s'estiment pas, car elles méconnaissent leur origine en estimant les autres choses. Elles sont émerveillées par toutes choses plutôt que par elles-mêmes, elles sont devant toutes choses frappées de stupéfaction et d'admiration, et s'y attachent. Elles se détachent alors autant qu'elles le peuvent des choses dont elles se sont détournées parce qu'elles ne les estimaient pas, aussi l'estime des choses d'ici-bas et le manque d'estime d'elles-mêmes sont la cause de leur ignorance totale du dieu."
