- id: "t10c1-p4b"
  title: "Le second discours vient en premier"
  notes: |-
    **Les deux discours :** {red}**le premier montre que ce que l'âme estime ne vaut rien**{/red} **;** {green}**le second lui rappelle son origine et sa dignité**{/green} **et vient en premier, car il est le plus proche de la recherche.**

    **Pourquoi deux discours ?** Ils répondent aux deux faces de l'erreur : {red}l'estime du sensible{/red}, corrigée par le premier, qui montre l'infériorité des choses d'ici-bas ; {red}la mésestime de soi{/red}, corrigée par le second, qui montre la supériorité de l'âme. Plotin développe le premier ailleurs, selon Fronterotta dans *Des deux matières* (II, 4) et dans le traité III, 4, *Du démon qui nous a reçus en partage*.

    **Pourquoi le second « précède le premier » ?** Parce qu'il porte sur {amber}la nature de l'âme{/amber}, objet même de la recherche du traité. Et, une fois clarifié, {coral}il éclaire le premier{/coral} : on ne voit bien que le sensible ne vaut rien qu'après avoir vu ce que vaut l'âme. {yellow}On mesure la valeur d'une pièce fausse en la comparant à la vraie.{/yellow}

    **Pourquoi « se remémorer » ?** L'âme n'apprend pas du nouveau : elle {amber}se souvient{/amber} de ce qu'elle a oublié, en écho à la réminiscence platonicienne. Le second discours est, pour {sky}F. Brunner{/sky}, « scientifique et {violet}anagogique{/violet} » : il fait connaître et fait remonter. Il rejoint ce que Plotin appelle ailleurs le {violet}« discours qui guide »{/violet} vers la vérité (V, 9, 2).

    ! Le premier discours n'est pas {red}abandonné{/red} : il est {green}subordonné{/green} au second, qui le rend clair.
  passage:
    label: "l. 22-31"
    text: |-
      – Quels sont donc ces deux discours ?

      – Le premier est celui qui montre combien ce que l'âme tient alors pour estimable ne l'est pas (ce que nous développerons davantage ailleurs) ; le second est celui qui instruit l'âme et qui lui fait se remémorer son origine et sa dignité (ce discours précède le premier et, une fois clarifié, il éclairera également le précédent). C'est donc de cela qu'il faut maintenant parler, car le second discours est le plus proche de l'objet de notre recherche et il servira au premier.
  points:
  - id: "t10c1-p4-4"
    sentence: "« Le premier est celui qui montre combien ce que l'âme tient alors pour ___ ne l'est pas (ce que nous développerons davantage ailleurs) ; le second est celui qui instruit l'âme et qui lui fait se remémorer son origine et sa dignité (ce discours précède le premier et, une fois clarifié, il éclairera également le précédent). »"
    answer: "estimable"
