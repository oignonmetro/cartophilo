- id: "t10c1-o1"
  title: "Une descente libre et nécessaire"
  notes: |-
    **Le chapitre ouvre une difficulté que Plotin ne résout qu'ailleurs :** {amber}**la descente de l'âme est-elle une faute libre ou une nécessité de l'ordre du monde ?**{/amber}

    **Les deux lectures.** Ici, l'âme s'éloigne par {red}audace{/red}, et le mot sonne comme un reproche : elle aurait pu ne pas partir. Mais ailleurs, la descente est {green}requise par l'univers{/green} : sans âme qui descende, le sensible ne serait ni animé ni ordonné.

    **La solution du traité 6.** Dans *Sur la descente de l'âme dans les corps* (IV, 8, 5), Plotin montre qu'il n'y a pas de contradiction : {coral}le volontaire est compris dans la nécessité{/coral}. L'âme descend de son plein gré, mais ce gré même entre dans l'ordre nécessaire du tout. C'est la lecture de {sky}D. O'Brien{/sky}, dans « Le volontaire et la nécessité ».

    **Une exhortation à la philosophie.** Que l'ignorance et la mésestime de soi fassent descendre l'âme est, selon Fronterotta, un lieu commun des traités : ensemble, ils forment {amber}une exhortation à la philosophie{/amber}, qui est le second discours du chapitre 1 développé à l'échelle de toute l'œuvre.

    ! La descente n'est pas {red}un malheur sans remède{/red} : parce que l'âme reste apparentée à son principe, {green}la remontée reste possible{/green}.
  passage:
    label: "Prolongement"
  points:
  - id: "t10c1-p2-25"
    sentence: "La tension entre descente libre et descente nécessaire de l'âme, que V, 1, 1 ouvre sans la résoudre, est résolue au traité 6, en ___."
    answer: "IV, 8, 5"
    alt: []
  - id: "t10c1-p2-26"
    sentence: "Au traité 6, Plotin résout la tension entre descente libre et descente nécessaire : « Il n'y a donc pas de contradiction entre ces expressions : l'ensemencement dans le devenir, la descente en vue de l'achèvement de l'univers, le jugement et la caverne, la nécessité et le volontaire, puisque le ___ est justement compris dans la nécessité. »"
    answer: "volontaire"
    alt: []
  - id: "t10c1-p2-31"
    sentence: "La tension entre la descente comme nécessité ontologique et comme acte volontaire, qu'ouvre V, 1, 1, est éclairée par l'article de D. O'Brien, « Le volontaire et la ___ »."
    answer: "nécessité"
