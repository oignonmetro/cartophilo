# Unité de texte (voir content/textes.md) : Plotin, traité 10 (V, 1),
# chapitre 1, traduction F. Fronterotta. Mouvements repérés par leurs lignes.

id: t10c1
title: L'oubli des âmes (V, 1, 1)
subtitle: Traité 10, Des trois hypostases qui ont rang de principes, chapitre 1
icon: page
color: coral
intro: |-
  Premier chapitre du traité 10 (V, 1), *Des trois hypostases qui ont rang de
  principes*, dans la traduction de F. Fronterotta (édition de L. Brisson et
  J.-F. Pradeau). Il s'ouvre sur une question qui prolonge la fin du traité 9
  (VI, 9) : **pourquoi les âmes ont-elles oublié leur père ?** Plotin en cherche
  l'origine (l'audace, l'éloignement), en décrit l'effet (l'admiration pour les
  choses d'ici-bas), puis annonce le remède : **deux discours**, dont le second,
  qui fait se remémorer à l'âme son origine et sa dignité, ouvre la recherche
  des chapitres suivants.
