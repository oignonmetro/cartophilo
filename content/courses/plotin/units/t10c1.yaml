- id: "t10c1-p2"
  title: "L'origine du mal : l'audace"
  notes: |-
    **Plotin nomme l'origine du mal des âmes :** {coral}**l'audace, la génération, l'altérité première et la volonté de s'appartenir à elles-mêmes.**{/coral}

    ? **Audace** (`tolma`) : chez Plotin, le mouvement par lequel une réalité s'écarte de son principe pour être par elle-même. Le mot vient du vocabulaire {sky}néopythagoricien{/sky} et gnostique.

    **Pourquoi quatre termes ?** Ils disent le même mouvement sous quatre aspects. L'{amber}audace{/amber} les nomme tous : c'est l'élan de l'âme hors de sa source. La {amber}génération{/amber} (`genesis`) : l'âme entre dans le devenir. L'{amber}altérité première{/amber} (`prôtê heterotês`) : elle devient autre que ce dont elle vient, première différence d'où procède la multiplicité. La {amber}volonté de s'appartenir{/amber} : elle veut être à elle-même, et non à son principe.

    **Pourquoi « l'origine du mal » ?** L'audace a {amber}deux faces{/amber} : {violet}ontologique{/violet}, l'âme descend dans la hiérarchie des êtres ; {violet}éthique{/violet}, elle se dégrade moralement. Le mal n'est pas d'abord une mauvaise action, mais {coral}cet éloignement même{/coral}.

    **Est-ce une faute ?** Pas simplement. Comme l'a montré {sky}D. O'Brien{/sky}, l'audace est à la fois {amber}un acte libre{/amber}, du point de vue de l'âme, et {amber}un moment nécessaire{/amber} de la procession du réel : seule l'âme qui s'éloigne peut animer et ordonner le sensible. Le chapitre ouvre cette tension sans la résoudre.

    ! L'audace n'est pas {red}une révolte{/red} contre le principe : c'est {green}le désir d'être soi{/green}, qui sépare sans opposer.
  passage:
    label: "l. 3-11"
    text: "– L'origine du mal pour elles, c'est bien l'audace, la génération, l'altérité première et le fait de vouloir s'appartenir à elles-mêmes."
