- id: "t10c1-p1"
  title: "La question de l'oubli du père"
  notes: |-
    **Le traité s'ouvre sur une question :** {amber}**qu'est-ce qui a fait que les âmes ont oublié le dieu qui est leur père, et se sont ignorées elles-mêmes ?**{/amber}

    **Pourquoi « Mais alors » ?** Le chapitre commence comme une {amber}objection{/amber}, dans la forme du dialogue intérieur qu'affectionne Plotin : si l'âme vient d'une source aussi parfaite que celle que décrivait le traité 9, son oubli devient incompréhensible. La question n'est donc pas une curiosité : {coral}elle naît d'une contradiction apparente{/coral}.

    **Qui est « le dieu qui est leur père » ?** Pour Fronterotta, {violet}l'Intellect{/violet}, non l'Un : les âmes sont dites {teal}« des parties qui viennent de là-bas »{/teal}, réalités plurielles issues du monde intelligible, comme les Formes. Plotin figure ailleurs l'Intellect par {yellow}Kronos, entre son père Ouranos, l'Un, et son fils Zeus, l'Âme{/yellow} (traité 31, V, 8, 13). D'autres interprètes y lisent {violet}l'Un{/violet}, auquel Plotin réserve souvent le titre de père, après la *Lettre VI* de Platon. Le mot « père » vient aussi du {sky}*Timée*{/sky}, où le démiurge est « le producteur et le père » de l'univers.

    ? **Hypostase** (`hupostasis`) : une réalité véritable et subsistante. {sky}Porphyre{/sky}, qui a donné leurs titres aux traités, nomme ainsi les trois principes, l'Un, l'Intellect et l'Âme ; Plotin emploie le mot en un sens moins strict.

    **Pourquoi « ignorantes d'elles-mêmes que de lui » ?** Les deux ignorances vont ensemble : {coral}l'âme étant une partie qui vient du dieu, ignorer son origine, c'est ignorer ce qu'elle est{/coral}. Inversement, se connaître elle-même la reconduira vers lui (l. 31-35).

    **Pourquoi « alors même qu'elles […] lui appartiennent entièrement » ?** La concessive fait le paradoxe : {red}l'oubli devrait être impossible{/red} à une partie de ce qu'elle oublie. Il faut donc une cause.

    ! Le texte ne demande pas {red}si{/red} les âmes ont oublié, mais {green}ce qui l'a fait{/green} : l'oubli est un fait, sa cause est la question.
