    sentence: "« Voilà pourquoi il faut adresser ___ à ceux qui se trouvent dans cette situation, si quelqu'un doit les faire se retourner dans la direction contraire, vers les choses qui sont premières, et les reconduire à ce qui est le plus haut, un et premier. »"
