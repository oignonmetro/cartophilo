- id: t10c1-p2
  title: "L'origine du mal : l'audace et l'éloignement"
  passage:
    label: "l. 3-11"
    text: "– L'origine du mal pour elles, c'est bien l'audace, la génération, l'altérité première et le fait de vouloir s'appartenir à elles-mêmes. Chaque fois qu'elles croient jouir de leur indépendance, elles se servent du mouvement considérable qui leur est propre, elles se mettent à courir dans la direction contraire et se portent au plus loin de là-bas, en allant jusqu'à ignorer qu'elles en proviennent elles aussi. Elles sont comme des enfants qui, arrachés à leurs parents dès la naissance et longtemps élevés loin d'eux, s'ignorent eux-mêmes comme ils ignorent leurs parents."
