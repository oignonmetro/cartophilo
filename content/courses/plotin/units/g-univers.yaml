lessons:
- id: g-univers-l1
  title: Univers
  notes: |-
    Chez Plotin, l'{violet}**univers**{/violet} (*to pan*) est [def]. Il n'est pas {pink}une somme de choses juxtaposées{/pink}, mais un seul vivant, où chaque partie agit sur les autres et tient sa place dans un même drame.

    __**L'univers est un seul vivant, dont l'âme unique est dans toutes les parties : d'où la sympathie.**__ Pourquoi les choses d'ici agissent-elles les unes sur les autres, même à distance ? Parce qu'elles ne sont pas séparées comme des pierres en tas : « il faut poser que notre monde est __un vivant unique__ qui enveloppe tous les vivants qui se trouvent à l'intérieur de lui, qu'il a une âme unique qui se trouve dans toutes ses parties » ([[traite28|traité 28]], chap. 32). Dans un vivant, deux parties éloignées ne sont pas étrangères l'une à l'autre : « l'univers est un tout en sympathie avec lui-même ; c'est comme un vivant qui forme une unité, où __ce qui est loin est en fait tout près__, tout comme dans l'unité que forme un individu donné, sont tout près les uns des autres un ongle, une corne, un doigt » (*ibid*.). Plotin explique ainsi même l'efficacité des prières, sans que les astres l'entendent : « le soleil et les autres astres n'en savent rien. Et ce pour quoi on prie se produit, parce qu'une partie de l'univers se trouve en sympathie avec une autre, __comme dans une corde tendue__ » (chap. 41). L'image se précise : « souvent aussi, quand une corde est mise en mouvement, une autre ressent en quelque sorte ce mouvement en vertu d'un accord et en raison du fait que __l'harmonie qui est la sienne ressortit à une seule et même harmonie__ » (*ibid*.). Aucun contact n'est requis ; il suffit que tout soit accordé ensemble. D'où la formule : « tout « conspire », comme on le dit avec raison, non seulement dans chacune des parties de l'univers, mais encore plus et __en premier lieu dans son ensemble__ » ([[traite52|traité 52]], chap. 7).

    __**Chaque partie contribue au tout en agissant et en pâtissant, comme les membres d'un vivant.**__ Si l'univers est un vivant, chaque chose y est un organe : « c'est suivant la nature et la disposition qui est la sienne que chaque chose qui se trouve dans l'univers __contribue à la totalité en agissant et en pâtissant__, tout comme en chaque vivant chacune des parties, suivant sa nature et la constitution qui est la sienne, contribue à l'ensemble » ([[traite28|traité 28]], chap. 45). Pâtir n'est donc pas un défaut, mais une manière de servir : chaque partie « donne ce qui vient d'elle et reçoit des autres tout ce que sa nature est en mesure de recevoir. Oui, il y a pour ainsi dire __une conscience du tout par le tout__ » (*ibid*.). Ce qui arrive à une partie, le tout le ressent comme un vivant ressent ce qui arrive à sa main (voir [[g-sundioikesis|co-gouvernement]]). Nous ne sommes pourtant pas des organes comme les autres. Ce qui n'a d'autre âme que celle du monde est tout entier partie de l'univers ; nous, qui avons aussi notre âme propre, ne le sommes qu'à moitié : « les choses qui ne participent qu'à l'âme du monde sont des parties de l'univers, tandis que toutes celles qui participent aussi à une autre âme se trouvent pour cette raison __n'être pas exclusivement des parties de l'univers__ » ([[traite28|traité 28]], chap. 32). Notre corps subit l'action du tout ; notre âme, qui n'en est pas une partie, ne la subit pas tout entière.

    __**Les parties ne peuvent pas être toutes parfaites : la beauté du tout veut des degrés.**__ Mais pourquoi tant de parties médiocres, et des maux ? Parce qu'un tout fait de parties toutes semblables ne serait pas un tout. La raison qui ordonne l'univers « produit même ce que l'on qualifie de « maux » conformément à la raison, car __elle ne souhaite pas que toute chose soit bonne__. De même qu'un artiste ne produit pas des yeux en chaque partie d'un animal, de même la raison ne fait pas de toutes choses des dieux, mais les unes sont des dieux, les autres des démons (qui se trouvent au second rang), puis viennent les hommes et à sa suite les autres vivants. __La raison n'agit pas ainsi par jalousie__ » ([[traite47|traité 47]], chap. 11). Un animal tout en yeux ne verrait pas mieux : il ne serait plus un animal. Plotin le dit aussi en musicien : chaque vie est une voix, « qui peut être débile, de piètre qualité ou très imparfaite. C'est comme pour __la flûte de Pan__, qui ne rend pas qu'une seule note, mais qui donne aussi des notes plus faibles et presque indistinctes, qui contribuent à l'harmonie qui produit l'instrument dans son ensemble » (chap. 17).

    __**L'univers est un drame dont la raison est l'auteur : chacun y tient son rôle, et les maux y ont leur place.**__ Si l'univers est ordonné, sommes-nous des pions ? Non : nous sommes des acteurs, qui jouent bien ou mal le rôle reçu. « Dans ce drame qu'est la réalité, celui qu'imitent en partie les hommes doués de talent poétique, __c'est l'âme qui est l'acteur__ et qui tient ses rôles de l'auteur véritable. De même que les acteurs d'ici ne reçoivent pas au hasard leurs masques, leurs costumes, leurs tuniques jaunes et leurs haillons, de même l'âme elle-même ne reçoit pas au hasard sa destinée » ([[traite47|traité 47]], chap. 17). Le rôle est donné ; la manière de le jouer est à nous : « lorsqu'elle s'adapte à sa destinée, l'âme s'accorde avec elle-même et __occupe la place que lui assignent le drame et la raison universelle__ » (*ibid*.). L'auteur n'a pas laissé de trous à combler, sans quoi « les acteurs ne seraient plus des acteurs, mais ils tiendraient le rôle de l'auteur » (chap. 18) ; et même le mal s'intègre à l'intrigue, car « dans l'univers, les conséquences des actions mauvaises découlent directement de la raison ou sont y conformes. Par exemple, __d'un adultère peuvent naître des enfants conformes à la nature__ et des hommes de qualité » (*ibid*. ; voir [[g-mort|mort]], où l'acteur change de costume).

    | Image | Ce qu'elle fait comprendre |
    | la corde tendue | la sympathie sans contact entre les parties |
    | les yeux qu'on ne peint pas partout | le tout veut des parties inégales |
    | la flûte de Pan | les notes faibles servent l'harmonie |
    | l'acteur et l'auteur | le rôle est donné, la manière de jouer est à nous |

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 28, chap. 32 | un vivant unique, ce qui est loin est tout près |
    | traité 28, chap. 41 | la sympathie, comme une corde tendue |
    | traité 28, chap. 45 | chaque partie contribue en agissant et en pâtissant |
    | traité 47, chap. 11 | pas des yeux partout : la raison ne veut pas tout bon |
    | traité 47, chap. 17 | la flûte de Pan ; l'âme acteur, la raison auteur |
    | traité 47, chap. 18 | les conséquences du mal conformes à la raison |
    | traité 52, chap. 7 | tout conspire, d'abord dans l'ensemble |

