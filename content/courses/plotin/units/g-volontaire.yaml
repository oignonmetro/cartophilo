lessons:
- id: g-volontaire-l1
  title: Volontaire
  notes: |-
    Chez Plotin, le {violet}**volontaire**{/violet} (*hekousion*) est [def]. Il n'est {pink}pas le pouvoir de choisir entre deux contraires{/pink}, comme chez {sky}Aristote{/sky} et son commentateur {sky}Alexandre d'Aphrodise{/sky} : un acte est volontaire quand il vient de l'âme elle-même, et pleinement quand il vient de sa raison.

    __**Est volontaire ce qui n'est pas fait sous la**__ {violet}__**contrainte**__{/violet} __**et s'accompagne d'un**__ {violet}__**savoir**__{/violet}__**, ce qui le distingue de ce qui dépend de nous.**__ Le [[traite39|traité 39]] pose les deux définitions côte à côte : « ce qui est volontaire, c'est tout ce qui n'est pas exécuté sous la contrainte et __qui s'accompagne d'un savoir__, alors que ce qui dépend de nous, c'est ce que nous accomplissons __en en étant aussi les maîtres__ » (chap. 1). Les deux vont souvent ensemble, mais ils ne se confondent pas, car {coral}on peut être maître d'un acte sans savoir ce qu'on fait{/coral} : {yellow}« si quelqu'un est maître de tuer, il n'agira pas volontairement s'il ignore que la victime est son père »{/yellow} (*ibid*.). Ici, Œdipe *pouvait* frapper ou non : le meurtre dépendait de lui ; mais il ignorait qui il frappait : le parricide n'était pas volontaire. **La maîtrise regarde l'exécution, le volontaire regarde la connaissance** (sur ce qui dépend de nous, voir [[g-liberte|liberté]]).

    __**Le savoir qui rend un acte volontaire est celui de**__ {violet}__**l'ensemble**__{/violet}__**, non des seuls détails : nul n'est donc méchant volontairement.**__ Pour {sky}Aristote{/sky}, seule l'ignorance des circonstances excuse ; celui qui ignore ce qu'il faut faire est méchant, non involontaire. Plotin refuse la différence : « ce n'est pas seulement la connaissance des détails qui doit constituer ce qui est volontaire, mais __aussi celle de l'ensemble__ » ([[traite39|traité 39]], chap. 1). {coral}Car on ne voit pas pourquoi ignorer qui est la victime excuserait, et ignorer qu'il ne faut pas tuer n'excuserait pas{/coral} : « pour quelle raison en effet, quelqu'un agit-il involontairement s'il ignore que c'est à l'encontre d'un proche, et n'agit-il pas involontairement, s'il ignore qu'il ne doit pas accomplir cet acte ? » (*ibid*.). On objecte qu'il aurait dû l'apprendre ; mais « __ne pas savoir qu'il fallait l'apprendre__ n'est pas un acte volontaire » (*ibid*.). Or le méchant, par définition, ignore le bien. **Tout vice est donc involontaire** : c'est la thèse de {sky}Socrate{/sky}, que Plotin reprend.

    __**Au sens strict, seul l'acte réglé sur la**__ {violet}__**raison**__{/violet} __**est volontaire, parce que seul il vient de l'intérieur de l'âme.**__ Un acte n'est volontaire que s'il vient de nous ; reste à savoir ce qui, en nous, vient de nous. {coral}Le désir et la colère sont mus du dehors{/coral}, par les affections du corps et par leur objet : l'âme « modifiée par les choses extérieures » qui suit « un mouvement aveugle » n'agit pas volontairement ([[traite3|traité 3]], chap. 9). Il ne reste donc que la raison : « chaque fois qu'elle se règle, dans l'une de ses tendances, sur la raison pure et détachée des passions qui lui est appropriée, c'est de cette tendance, __et de cette tendance seulement__, qu'il faut dire qu'elle est en notre pouvoir, c'est-à-dire qu'elle est volontaire » (*ibid*.). Seule cette activité « ne vient que de l'intérieur de l'âme lorsqu'elle est pure » (*ibid*.). Les désirs, au contraire, « la conduisent, l'entraînent et ne permettent plus qu'il y ait en nous des actions, mais __n'autorisent que des passions__ » (*ibid*.) : les âmes qu'ils mènent « pâtissent plutôt qu'elles n'agissent » (chap. 10). **L'emporté fait bien ce qu'il fait, mais ce n'est pas lui, c'est sa colère, qui en est le principe** (voir [[g-hemeis|nous]]).

    __**La faute involontaire reste**__ {violet}__**imputable**__{/violet}__**, parce que c'est l'homme qui agit : les hommes aussi sont des principes.**__ D'où une objection : « si les hommes sont méchants contre leur gré et deviennent tels sans le vouloir, on ne peut blâmer ni ceux qui commettent des injustices, ni ceux qui les subissent » ([[traite47|traité 47]], chap. 10). Plotin répond en séparant deux choses que l'objection confond : *involontaire* veut dire « fait sans savoir », non « fait par un autre ». « L'expression « contre son gré » signifie que la faute est involontaire. Mais cela n'annule pas le fait que les hommes sont des êtres __qui agissent par eux-mêmes__ » (*ibid*.). Et {coral}c'est même la condition de la faute{/coral} : « c'est bien parce qu'ils agissent par eux-mêmes qu'ils peuvent eux-mêmes commettre une faute » (*ibid*.). L'ordre du monde ne l'efface pas, car la suite des causes ne s'accomplit qu'« à condition que tous les principes soient eux aussi inclus dans la série. Or, __les hommes aussi sont des principes__ » (*ibid*. ; voir [[g-theodicee|théodicée]]).

    __**Le volontaire est compris dans la**__ {violet}__**nécessité**__{/violet} __**: la descente de l'âme est à la fois volontaire et involontaire.**__ L'âme descend dans un corps : est-ce une faute qu'elle commet, ou une loi qu'elle subit ? Plotin répond qu'il n'y a pas à choisir, « puisque le volontaire est justement compris dans la nécessité » ([[traite6|traité 6]], chap. 5). {coral}La nécessité n'est pas une contrainte{/coral} : elle « ne désigne pas une influence extérieure, mais __un état de fait inévitable__ » ([[traite47|traité 47]], chap. 10). La descente est donc **involontaire**, parce que nul ne veut le pire, et **volontaire**, parce que l'âme y va d'elle-même : « toute chose va vers le pire involontairement, mais puisqu'elle y va cependant __de son propre mouvement__, on dit qu'en subissant l'influence de ce qui lui est inférieur, elle reçoit une condamnation conforme à ce qu'elle a fait » ([[traite6|traité 6]], chap. 5). Et c'est aussi la loi du tout : l'âme vient « __par une libre inclinaison__, et pour exercer sa puissance et mettre en ordre ce qui vient après elle » (*ibid*.).

    | Acte | Volontaire ? | Pourquoi |
    | tuer son père sans le savoir | non | il ignore un détail |
    | faire le mal en ignorant le bien | non | il ignore l'ensemble |
    | céder au désir ou à la colère | non | l'âme est menée du dehors |
    | agir selon la raison | oui | l'acte vient de l'intérieur de l'âme |
    | descendre dans un corps | oui et non | de son propre mouvement, vers le pire |

    ! Que la faute soit involontaire {pink}ne l'excuse pas{/pink} : le châtiment n'est pas une sanction extérieure, c'est la suite de l'acte. La première faute de l'âme a pour châtiment « cela même qu'elle subit en descendant » ([[traite6|traité 6]], chap. 5).

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 3, chap. 9 | seule la tendance réglée sur la raison est volontaire |
    | traité 6, chap. 5 | le volontaire compris dans la nécessité ; la descente |
    | traité 39, chap. 1 | contrainte et savoir ; Œdipe ; la connaissance de l'ensemble |
    | traité 47, chap. 10 | la faute involontaire, mais les hommes sont des principes |

    **Voir aussi** : [[g-liberte|Liberté]] · [[g-theodicee|Théodicée]] · [[g-mal|Mal]] · [[g-hemeis|Nous]] · [[g-proairesis|Choix préalable]] · [[traite39|Traité 39]]
