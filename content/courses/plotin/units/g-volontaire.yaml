    answer: hekousion
    alt: ["ekousion", "hekoúsion"]
  - id: g-volontaire-l1-q2
    sentence: "« Ce qui est volontaire, c'est tout ce qui n'est pas exécuté sous la ___ et qui s'accompagne d'un savoir » (traité 39, chap. 1)."
    answer: contrainte
    alt: []
  - id: g-volontaire-l1-q3
