# Entrée du glossaire de Plotin (skill glossaire), écrite le 2026-10-23 à la
# demande de l'utilisateur. Citations vérifiées sur la GF (VI, 9, 1 ; I, 8,
# 5 ; II, 9, 14 ; V, 8, 11 ; I, 4, 6 et 14 ; III, 2, 5 ; III, 3, 5 ; V, 9,
# 11). Que le sage endormi reste en bonne santé sans le sentir (I, 4, 9) a sa
# carte dans Bonheur. Pas de terme grec : la GF n'en donne pas.

