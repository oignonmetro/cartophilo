- id: g-sante-l1
  title: Santé
  notes: |-
    Chez Plotin, la {violet}**santé**{/violet} est [def]. Elle est un bien pour le corps, mais {pink}elle ne rend pas plus heureux celui qui l'a{/pink}.

    __**La santé est une**__ {violet}__**unité**__{/violet}__**.**__ Plotin la range parmi les effets de l'un : « la santé se produit quand le corps est __coordonné dans l'unité__ ; la beauté quand l'unité en tient unies les parties ; et la vertu pour l'âme, quand, s'orientant vers l'unité et un accord unique, elle se trouve unifiée » ([[traite9|traité 9]], chap. 1). Pourquoi ce rapprochement ? Parce que toute chose n'est ce qu'elle est que par son [[g-unite|unité]] : {coral}la santé est au corps ce que la vertu est à l'âme{/coral}. La maladie, à l'inverse, vient de la [[g-hule|matière]] : elle est « le défaut et l'excès de corps faits de matière __qui sont incapables de préserver l'ordre et la mesure__ » ([[traite51|traité 51]], chap. 5). Elle n'est pourtant pas un simple néant : « dans le cas de la maladie [...], il y a une "raison" qui se modifie, __celle de la santé__ » ([[traite42|traité 42]], chap. 10). Aussi ses causes sont-elles corporelles, non des démons, comme le croient les gnostiques : ce sont « les fatigues, les réplétions, les insuffisances, les putréfactions » ([[traite33|traité 33]], chap. 14).

    __**Pourquoi la santé passe inaperçue.**__ On sent la maladie, à peine la santé. Plotin l'explique : « la maladie en effet inspire plutôt de la terreur, alors que la santé est __une douce compagne__ [...]. Elle s'installe auprès de nous, comme quelque chose qui nous est propre et __qui fait un avec nous__. En revanche, la maladie est quelque chose de différent de nous » ([[traite31|traité 31]], chap. 11). {coral}Ce que nous sentons vivement, c'est __ce qui nous heurte parce qu'il nous est étranger__ ; __ce qui est à nous ne se fait pas remarquer__.{/coral} C'est la même raison qui fait que l'activité de l'intellect, la plus nôtre, nous échappe souvent (voir [[g-bonheur|bonheur]]).

    __**Elle n'ajoute rien au bonheur.**__ La santé et l'absence de douleur sont des choses nécessaires, que l'on recherche quand elles manquent : « certes, __on ne se soucie pas de la santé quand on la possède__ » ; une fois là, elles « n'ont rien d'attrayant et n'ajoutent rien au bonheur » ([[traite46|traité 46]], chap. 6). Pourquoi ? Parce que **ce que nous voulons n'est pas éviter les maux, « mais bien plutôt** __**ne pas avoir à les éviter**__ **»** : la santé lève un obstacle, elle ne donne rien. D'où le {coral}sage{/coral} : « tout en veillant à la santé de son corps, {coral}__il ne cherchera pas à éviter à tout prix les maladies__{/coral} », et « son bonheur ne s'accroîtra pas par les plaisirs, la santé et l'absence de peine » (chap. 14). Le bonheur est la vie de l'intellect ; la santé est celle du composé (voir [[g-vivant|vivant]]).

    __**Maladie et providence.**__ La maladie n'est donc pas un mal pour l'âme : « la pauvreté et les maladies __ne sont rien pour les gens de bien__, tandis qu'elles sont profitables aux méchants. Et pour qui a un corps, c'est une nécessité que d'être malade » ([[traite47|traité 47]], chap. 5). Cela ne dispense pas d'en prendre soin : il en va de la providence comme de « ce que l'on fait en vue de rester en santé __en suivant les prescriptions du médecin__ », et {yellow}dans un corps blessé, « la raison qui administre ce corps suture les bords de la plaie »{/yellow} ([[traite48|traité 48]], chap. 5).

    __**Le médecin et la nature.**__ Pourquoi la santé, quand elle est là, se maintient-elle sans effort ? Parce qu'elle vient du dedans. Le médecin, lui, agit « par le dehors et [...] procède partie par partie, __tâtonne et délibère__, tandis que la nature qui part du principe vital __n'a pas besoin de délibérer__ » ([[traite28|traité 28]], chap. 11). {coral}La médecine répare de l'extérieur ce que la nature fait de l'intérieur{/coral} (voir [[g-phusis|nature]] et [[g-anime-inerte|animé et inerte]]).

    | | Santé | Maladie |
    | Ce qu'elle est | le corps coordonné dans l'unité | un corps qui perd l'ordre et la mesure |
    | D'où elle vient | de la raison qui domine la matière | de la matière qui échappe à l'ordre |
    | Comment on la sent | à peine, elle fait un avec nous | vivement, elle nous est étrangère |
    | Pour le bonheur | n'y ajoute rien | n'y retranche rien |

    ! La *Vie de Plotin* montre un soin de l'âme qui rend la santé au corps : Rogatianus, sénateur « atteint de la goutte au point de se faire porter en litière », reprit des forces par « ce renoncement et __cette indifférence aux nécessités de la vie__ » (Porphyre, *Vie de Plotin*, 7).
    ! Il y a aussi une **santé de là-bas** : dans l'intelligible, « une autre puissance et une autre santé, en vertu desquelles tous les vivants sont __tranquilles et sans besoin__ » ([[traite5|traité 5]], chap. 11). Celle du corps n'en est qu'une image.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 9, chap. 1 | la santé, le corps coordonné dans l'unité |
    | traité 51, chap. 5 | la maladie vient de la matière |
    | traité 31, chap. 11 | la santé fait un avec nous, la maladie nous est étrangère |
    | traité 28, chap. 11 | le médecin délibère, la nature non |
    | traité 46, chap. 6 | la santé n'ajoute rien au bonheur |
    | traité 46, chap. 14 | le sage veille à sa santé sans craindre la maladie |
    | traité 47, chap. 5 | la maladie, rien pour l'homme de bien |

    **Voir aussi** : [[g-unite|Unité]] · [[g-bonheur|Bonheur]] · [[g-vivant|Vivant]] · [[g-mort|Mort]] · [[g-souffrance|Souffrance]]
