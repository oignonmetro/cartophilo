- id: traite49-l3
  title: "L'Un au-delà de la connaissance"
  notes: |-
    **La naissance de l'Intellect** (chap. 11) : l'Intellect veut penser l'Un comme un, mais le saisit toujours **multiple** : il s'élance vers lui comme une vision qui n'a pas encore vu, et devient Intellect en possédant une empreinte devenue multiple. L'Un n'est pas l'une des choses : il est « au-delà de l'Intellect ».

    **L'Un ne connaît pas** (chap. 12) : si l'Un pensait, il serait multiple. Il n'a éprouvé aucun désir ; l'Intellect est venu de lui « alors qu'il demeurait dans le même état », comme la lumière vient du soleil. L'Intellect est ce qui connaît en premier lieu ; l'Un, qui n'a besoin de rien, n'a pas besoin de connaître.

    **L'ineffable** (chap. 13-14) : quoi qu'on dise, on dit « quelque chose » ; le seul propos vrai est qu'il est « au-delà de toutes choses et au-delà de l'Intellect ». La conscience est perception d'une multiplicité ; l'Intellect dit « je suis ce qui est » comme une découverte. De l'Un, nous disons **ce qu'il n'est pas**, à partir de ce qui vient après lui ; nous le possédons sans le connaître, comme les inspirés sentent en eux quelque chose de supérieur.

    **Donner ce qu'il n'a pas** (chap. 15) : ce qui vient de l'Un ne peut lui être identique : c'est un « un-plusieurs ». L'Un est **puissance de toutes choses**, non comme la matière qui reçoit, mais parce qu'il produit.

    **Au-delà de la vie et de l'Intellect** (16, 1-17, 14) : une multiplicité ne vient pas d'une multiplicité. L'autosuffisance de l'Intellect lui vient de ses parties ; l'Un est au-delà de la réalité et de l'autosuffisance.

    **L'incantation** (17, 15-38) : l'âme éprouve les douleurs de l'enfantement, et il faut des **incantations**. La pensée discursive saisit une chose puis une autre ; avec le simple, il n'y a qu'un **contact**. L'âme reçoit « soudain » une lumière, comme on ne voit le soleil que par sa propre lumière. Comment ? « **Retranche toutes choses**. »

    ! L'absence de pensée dans l'Un n'est pas un manque : c'est le signe de son autarcie, car seul ce qui a besoin de soi a besoin de se penser.
