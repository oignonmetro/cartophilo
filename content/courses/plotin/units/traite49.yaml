- id: traite49-l4
  title: "Repérage : le plan du traité 49"
  notes: |-
    **Le traité 49 pose la question de la connaissance de soi (chap. 1), l'examine pour l'âme (chap. 2-4), pour l'Intellect (chap. 5-10), puis pour l'Un, au-delà de la connaissance (chap. 11-17).**

    | Moment | Lieu | Ce qui s'y joue |
    | se connaître, est-ce être multiple ? | 1, 1-12 | une partie par une autre |
    | l'Intellect connaît les intelligibles | 1, 12-28 | absurde de le lui refuser |
    | les facultés de l'âme | 2, 1-20 | division et rassemblement |
    | l'intellect de l'âme et l'Intellect pur | 2, 21-3, 21 | Socrate est bon |
    | ce que nous sommes | 3, 21-4, 4 | un messager, un roi |
    | l'âme devenue Intellect | 4, 4-31 | devenu autre |
    | l'identité de l'Intellect | chap. 5 | intellection et intelligible |
    | se penser et contempler son principe | 6, 1-7, 12 | nécessité et persuasion |
    | la lumière qui se voit | 7, 13-9, 2 | une lumière en voit une autre |
    | retrancher pour remonter | 9, 2-22 | la lumière du soleil |
    | penser suppose le multiple | 9, 22-10, 52 | je je, suis suis |
    | la genèse de l'Intellect | chap. 11 | une vision qui n'a pas vu |
    | l'Un et l'Intellect | 12, 1-44 | dans le même état |
    | au-delà de la connaissance | 12, 44-13, 36 | l'ineffable |
    | la voie négative | 14, 1-19 | les inspirés |
    | donner ce qu'on n'a pas | chap. 15 | puissance de toutes choses |
    | au-delà de la vie et de l'Intellect | 16, 1-17, 14 | au-delà de l'autosuffisance |
    | l'incantation | 17, 15-38 | retranche toutes choses |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! Le traité suit l'ordre ascendant des réalités, de l'âme à l'Un : chaque niveau se connaît en se tournant vers celui qui le précède.
