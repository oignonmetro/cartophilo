- id: traite49-l2
  title: "L'Intellect se connaît lui-même"
  notes: |-
    **L'identité à trois termes** (chap. 5) : l'Intellect ne se voit pas par une partie, sinon il verrait un objet, non le sujet qui contemple. Si l'Intellect et l'intelligible n'étaient pas une même chose, il n'y aurait pas de **vérité**, seulement des empreintes. L'intelligible est activité ; donc **l'Intellect, l'intellection et l'intelligible sont une seule et même chose**, et l'Intellect se pense lui-même.

    **Nécessité et persuasion** (chap. 6) : le raisonnement l'a montré par **nécessité**, qui est dans l'Intellect ; mais l'âme cherche la **persuasion**, comme si elle voulait contempler un archétype dans une image. L'Intellect qui se pense n'est pas un intellect pratique.

    **L'Intellect voit son principe** (chap. 7) : en connaissant la divinité dont il vient, il se connaît, puisqu'il est tous ses dons. Sa tranquillité n'est pas inaction, mais activité libérée des autres choses ; l'âme, même quand elle agit, continue de contempler.

    **La lumière** (chap. 8) : là-bas, la vision et ce qu'elle voit se confondent : **une lumière qui en voit une autre**, et se voit donc elle-même. En resplendissant dans l'âme, cette lumière l'a rendue intellective.

    **Retrancher** (chap. 9) : pour connaître l'Intellect, retranche le corps, l'âme qui le figure, la sensation, les désirs : il reste une image de l'Intellect, comme la lumière autour du soleil. Nous ne sommes présents à nous-mêmes que tournés vers lui.

    **Penser suppose le multiple** (chap. 10) : une vision est vision d'autre chose ; l'intellection est à la fois dans **l'altérité et l'identité**. Ce qui est absolument un, « seul et isolé », reste immobile et ne pense pas : il ne dirait que « suis suis » et « je je ». Penser une chose simple ne serait qu'un toucher.

    ! L'Intellect ne se connaît pas en se divisant : sujet, acte et objet y sont identiques, mais d'une identité qui est celle d'une unité multiple.
