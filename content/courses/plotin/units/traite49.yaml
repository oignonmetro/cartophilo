id: traite49
title: "Traité 49 (V, 3) : Sur les hypostases qui connaissent et sur ce qui est au-delà"
subtitle: "Se connaître soi-même"
icon: compass
color: sky
lessons:
- id: traite49-l1
  title: "L'âme se connaît-elle ?"
  notes: |-
    **Un nouveau point de vue** : les trois principes ont été étudiés selon la procession et la remontée (traités 9 et 10), puis selon la hiérarchie du réel (traité 38) ; le traité 49 les examine du point de vue de **la connaissance de soi**. Il prolonge le « connais-toi toi-même » et l'*Alcibiade* de Platon (129b-133c), mais dans une perspective ontologique.

    **La question** (chap. 1) : ce qui se pense doit-il être varié, une partie voyant les autres ? Mais alors ce n'est pas le tout qui serait connu : il faut une compréhension de soi même pour ce qui est simple. Il serait parfaitement absurde de la refuser à l'Intellect.

    **Les facultés de l'âme** (chap. 2-3) : la sensation porte sur l'extérieur ; la **faculté rationnelle** examine les images des sens et les empreintes venues de l'Intellect, en divisant et en rassemblant. La sensation a vu un homme ; la pensée discursive dit que c'est Socrate, et qu'il est bon, grâce au critère du bien qu'elle tient de l'Intellect. L'Intellect pur est **nôtre et pas nôtre** : nous l'utilisons et ne l'utilisons pas.

    | Niveau | Faculté | Rapport à nous |
    | supérieur | l'Intellect pur | nôtre quand nous l'utilisons, notre roi |
    | intermédiaire | la pensée discursive | ce que nous sommes, la partie dominante |
    | inférieur | la sensation | toujours nôtre, notre messager |

    **Devenir Intellect** (chap. 4) : nous nous connaissons de deux façons, comme pensée discursive, ou en devenant Intellect ; et alors on ne se pense plus en tant qu'homme, mais **devenu complètement autre**. La pensée discursive se sait l'image de l'Intellect, qui a dessiné en elle toutes choses.

    ! L'âme ne se connaît pas en se repliant sur elle-même : elle se connaît en remontant à l'Intellect dont elle est l'image, au point de devenir autre.
