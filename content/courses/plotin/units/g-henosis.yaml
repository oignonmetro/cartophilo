lessons:
- id: g-henosis-l1
  title: L'union à l'Un
  notes: |-
    **L'hénose** (*henôsis*, formé sur *hen*, « un ») **est le terme de toute la remontée de l'âme : le moment où elle ne regarde plus l'Un, mais ne fait plus qu'un avec lui.** On la traduit aussi par **union** ou **unification**. Tout le chemin philosophique, vertus, purification, contemplation, y conduit.

    __**Pourquoi ce ne peut pas être une connaissance.**__ Toute connaissance, même la plus haute, garde une distance entre {pink}celui qui connaît{/pink} et {pink}ce qui est connu{/pink}. Or l'Un est absolument simple : un regard qui resterait deux ne l'atteindrait jamais comme un. C'est pourquoi {teal}« notre saisie de l'Un ne se fait ni au moyen de la science ni au moyen de l'intellection »{/teal}, mais {green}résulte « d'une présence qui est supérieure à la science »{/green} (traité 9 [VI, 9], chap. 4, l. 1-3). Plotin en donne la raison aussitôt : {teal}« la science est un discours, et le discours est multiple »{/teal} (l. 5-6).

    __**Ce qui se passe dans l'union.**__ {teal}« Puisqu'il n'y avait pas deux choses, mais que celui qui voyait ne faisait qu'un avec ce qui était vu »{/teal} (chap. 11, l. 4-6), il n'y avait plus en lui ni passion, ni désir, ni même raison ou intellection. Plotin cherche alors ses mots : ce n'est peut-être pas une contemplation, {teal}« mais une autre manière de voir, une extase, une simplification et une donation de soi, une aspiration au contact, une forme de repos »{/teal} (l. 22-24). On y reconnaît le vocabulaire de l'union : {violet}*ekstasis*{/violet} (extase), {violet}*haplôsis*{/violet} (simplification), {violet}*aphê*{/violet} (contact).

    __**L'image du sanctuaire.**__ L'âme parvenue là est {yellow}comme celui qui est rentré à l'intérieur d'un sanctuaire, après avoir laissé derrière lui les statues élevées dans le temple{/yellow} (chap. 11, l. 17-19) : les statues, figures des Formes intelligibles, sont belles, mais on les laisse pour s'unir {teal}« non pas avec une statue ou avec une image, mais avec le dieu lui-même »{/teal} (l. 21-22). Elles ne seront plus que l'objet d'une contemplation seconde, quand on ressortira.

    __**La formule finale.**__ Les *Ennéades*, dans l'ordre de Porphyre, s'achèvent sur cette union : {teal}« Telle est la vie que mènent les dieux et les hommes divins et bienheureux : être libéré des choses d'ici-bas, vivre sans trouver son plaisir dans les choses d'ici-bas, fuir seul vers lui seul »{/teal} (chap. 11, l. 49-51 ; en grec *phugê monou pros monon*). Le traité 1 (I, 6) disait déjà de celui qui monte vers le dieu qu'il peut le voir {teal}« seul à seul »{/teal} (*monos pros monon*, chap. 7, l. 9).

    __**Une expérience rare.**__ Selon Porphyre, Plotin atteignit ce but {teal}« quatre fois »{/teal} pendant les six années où il fut près de lui (*Vie de Plotin*, 23, 16-18). C'est un terme que l'on approche, non un acquis.

    ! L'hénose n'est pas une connaissance plus haute que les autres : toute connaissance suppose encore un sujet et un objet. Ici le voyant et le vu ne sont plus deux, d'où le vocabulaire du contact et de la présence plutôt que de la vision.
