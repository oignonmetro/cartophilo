id: g-henosis
title: Henōsis
subtitle: L'union à l'Un, et l'unité qui fait être toute chose
icon: infinity
color: violet
lessons:
- id: g-henosis-l1
  title: L'union à l'Un
  notes: |-
    L'**`henōsis`**, formée sur `hen` (« un »), se traduit par **hénose**, **unification** ou **union**. Elle désigne le terme ultime du retour (`epistrophē`) : l'âme, **simplifiée** (`haplōsis`), dépouillée de toute forme intelligible et de toute altérité, coïncide avec le Premier principe, l'**Un**. C'est la notion qui correspond le mieux au fait, pour notre âme, de « devenir l'Un ».

    **L'hénose dépasse toute science.** Dans les chapitres 4 à 11 de __VI, 9__ (traité 9, *Du Bien ou de l'Un*), Plotin précise qu'elle n'est ni une connaissance scientifique (`epistēmē`) ni une intellection ordinaire, mais une présence supérieure à la science, par un **contact** direct (`aphē`) et un abandon complet, où disparaît toute dualité entre le sujet qui contemple et l'objet contemplé. Il la figure en __VI, 9, 11__ par l'image du sanctuaire : le fidèle laisse derrière lui les statues du parvis, figures des Formes intelligibles, pour pénétrer seul dans le saint des saints et s'unir « seul à seul » (`monos pros monon`) à la présence divine.

    C'est sur une formule voisine que se clôt l'ensemble des *Ennéades* : la vie divine et bienheureuse y est la « fuite du seul vers le seul » (`phugē monou pros monon`), le détachement des réalités matérielles pour rejoindre le principe.

    ! L'hénose n'est pas une connaissance plus haute que les autres : toute connaissance, même l'intellection, suppose encore un sujet et un objet. Ici le voyant et le vu ne sont plus deux, d'où le vocabulaire du contact et de la présence plutôt que de la vision.
  points:
  - id: g-henosis-l1-1
    sentence: "Le terme grec, translittéré, formé sur `hen` (« un »), qui désigne le terme ultime du retour de l'âme, où elle coïncide avec le Premier principe dépouillée de toute forme et de toute altérité, est ___."
    answer: henōsis
