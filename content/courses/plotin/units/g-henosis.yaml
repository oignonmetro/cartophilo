- id: g-henosis-l2
  title: Devenir l'Un
  # Point laissé de côté : la localisation du précepte « Retranche tout »
  # (`aphele panta`). La source le situe tantôt en V, 3, 14, tantôt le rattache
  # à l'image de la statue (I, 6, 9 et V, 3, 9) ; à vérifier sur le texte avant
  # d'en faire un point de localisation.
  notes: |-
    Parmi les notions qui décrivent la remontée de l'âme vers l'Un, l'`henōsis` nomme **l'état achevé** de coïncidence, où le voyant et le vu ne forment plus deux réalités mais une seule. Elle se distingue de la méthode qui y conduit et de l'acte qui l'accompagne.

    |  | Ce qu'elle nomme |
    | `aphairesis` | la méthode : le dépouillement |
    | `ekstasis` | l'acte : la sortie de soi |
    | `henōsis` | l'état achevé : l'union sans dualité |

    **Le chemin passe par un dépouillement.** L'âme se défait du corps, des sensations, puis des formes intelligibles elles-mêmes : en __VI, 7, 34__, pour recevoir le principe seul à seul, elle doit se dépouiller de toute forme qu'elle aurait revêtue. Plotin résume la démarche en un précepte : « Retranche tout » (`aphele panta`).

    **Plotin parle bien de « devenir l'Un »** (`genesthai hen`), en __VI, 7, 35__ : après s'être élevée à la contemplation de l'intelligible, l'âme est saisie d'une « ivresse de nectar » qui la pousse à franchir l'ultime étape. Dans le même chapitre, elle est comme un **visiteur** entré dans une maison richement ornée : il contemple d'abord les statues, les Formes, puis ne regarde plus que le maître de maison, l'Un, dès qu'il paraît.

    Deux autres images disent l'union :

    - Les amants : en __VI, 7, 34__, ceux d'ici-bas cherchent à se confondre ; quand l'Un est présent à l'âme, « ils ne sont plus deux, mais les deux n'en font qu'un ».
    - Le chœur et les centres : en __VI, 9, 8__, les chanteurs tournés vers la salle chantent de façon dissonante, tournés vers le **coryphée** ils ne forment qu'une voix ; l'âme est aussi comme un cercle dont le centre vient coïncider avec le centre du Tout.

    ! On ne « devient » pas l'Un comme on deviendrait une chose nouvelle : au-delà de l'être, l'Un est aussi au-delà du devenir, et c'est à son niveau que le mot est **le plus impropre**. L'âme n'ajoute rien à l'Un et n'en devient pas la cause ; elle reste une **image** (`eikōn`) issue de sa surabondance. Ce qui s'abolit, c'est la distance et la conscience de la séparation.
  points:
  - id: g-henosis-l2-1
    sentence: "Dans la remontée de l'âme vers l'Un, l'`henōsis` nomme l'état achevé de coïncidence, alors que l'acte de sortie de soi qui franchit toute pensée se nomme, en grec, translittéré, ___."
    answer: ekstasis
    alt: []
  - id: g-henosis-l2-2
    sentence: "Dans la remontée de l'âme vers l'Un, l'`henōsis` nomme l'état achevé et l'`ekstasis` la sortie de soi, tandis que la méthode de dépouillement qui y conduit se nomme, en grec, translittéré, ___."
    answer: aphairesis
    alt: []
