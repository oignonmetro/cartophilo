# Entrée du glossaire de Plotin (skill glossaire), refondue le 2026-10-21 :
# une leçon. Les cartes qui doublaient Unité (axiome du traité 9, unité
# reçue) et Intellect amoureux (le maître de maison) ont été retirées.
# Citations vérifiées sur la GF (VI, 9, 4, 8 et 11 ; V, 3, 17 ; VI, 7, 34-35).

id: g-henosis
title: Hénose (`henôsis`)
icon: book
color: coral
lessons:
- id: g-henosis-l1
  title: Hénose
  notes: |-
    Chez Plotin, l'{violet}**hénose**{/violet} (*henôsis*, formé sur *hen*, « un ») est [def].

    __**Pourquoi ce ne peut pas être une connaissance.**__ Toute connaissance, même la plus haute, garde une distance entre le connaissant et le connu ; or l'Un est absolument simple, et un regard qui resterait deux ne l'atteindrait jamais comme un. C'est pourquoi « notre saisie de l'Un ne se fait ni au moyen de la science ni au moyen de l'intellection », mais résulte « d'__une présence qui est supérieure à la science__ » ([[traite9|traité 9]], chap. 4). La raison suit : « __la science est un discours__, et le discours est multiple ».

    __**Ce qui se passe dans l'union.**__ « Puisqu'il n'y avait pas deux choses, mais que __celui qui voyait ne faisait qu'un avec ce qui était vu__ » (chap. 11), il n'y avait plus ni passion, ni désir, ni même raison ou intellection. Plotin cherche ses mots : ce n'est peut-être pas une contemplation, « mais une autre manière de voir, __une extase, une simplification et une donation de soi__, une aspiration au contact, une forme de repos ». D'où le vocabulaire de l'union : {violet}*ekstasis*{/violet} (extase), {violet}*haplôsis*{/violet} (simplification), {violet}*aphê*{/violet} (contact). {yellow}L'âme est comme celui qui est entré dans un sanctuaire en laissant derrière lui les statues du temple{/yellow} : elle s'unit « non pas avec une statue ou avec une image, mais __avec le dieu lui-même__ ».

    __**Le chemin : se dépouiller.**__ L'Un est sans forme ; une âme encore occupée d'une forme, si haute soit-elle, ne serait pas libre pour lui. Elle se défait donc du corps, des sensations, puis des formes intelligibles elles-mêmes. Plotin le résume en un précepte qui clôt le [[traite49|traité 49]] : « Retranche tout » (*aphele panta*, chap. 17). C'est par la puissance qui aime, au sommet de l'Intellect, que l'âme franchit ce dernier pas (voir l'[[g-intellect-amoureux|Intellect amoureux]]) : elle peut alors « posséder l'Intellect et __devenir l'Un__ » ([[traite38|traité 38]], chap. 35).

    |  | Ce qu'elle nomme |
    | *aphairesis* | la méthode : le dépouillement |
    | *ekstasis* | l'acte : la sortie de soi |
    | *henôsis* | l'état achevé : l'union sans dualité |

    __**L'Un est toujours présent ; c'est nous qui ne le sommes pas.**__ « Lui, __qui n'a pas d'altérité, est toujours présent__ » ([[traite9|traité 9]], chap. 8) ; c'est notre attention qui se perd. {yellow}L'âme est comme un cercle{/yellow}, et nous pouvons « faire que notre centre rejoigne ce qui est comme le centre de toutes choses ». Et toute chose ne subsiste que dans la mesure où elle est unifiée (voir [[g-unite|unité]]) : **l'union finale est le retour conscient à ce dont toute chose tient déjà sa cohésion**, non un exploit étranger à la vie ordinaire.

    __**Une fin, rarement atteinte.**__ Les *Ennéades*, dans l'ordre de Porphyre, s'achèvent sur cette union : « être libéré des choses d'ici-bas, vivre sans trouver son plaisir dans les choses d'ici-bas, __fuir seul vers lui seul__ » (chap. 11 ; *phugê monou pros monon*). Selon Porphyre, Plotin l'atteignit « quatre fois » pendant les six années où il fut près de lui (*Vie de Plotin*, 23).

    ! On ne « devient » pas l'Un comme on deviendrait une chose nouvelle : l'Un est au-delà du devenir, et c'est à son niveau que le mot est le plus impropre. L'âme n'ajoute rien à l'Un ; ce qui s'abolit, c'est la distance.

    **Voir aussi** : [[g-un|Un]] · [[g-intellect-amoureux|Intellect amoureux]] · [[g-noothenai|Devenir intellect]] · [[g-unite|Unité]] · [[g-au-dela-de-l-etre|Au-delà de la réalité]] · [[traite9|Traité 9]]
