- id: g-henosis-l2
  title: Devenir l'Un
  notes: |-
    **Parmi les mots de la remontée, l'*henôsis* nomme l'état achevé : il faut la distinguer de la méthode qui y conduit et de l'acte qui l'accompagne.** Chaque mot répond à une question différente : comment y va-t-on, que fait l'âme, où arrive-t-elle.

    |  | Ce qu'elle nomme |
    | *aphairesis* | la méthode : le dépouillement |
    | *ekstasis* | l'acte : la sortie de soi |
    | *henôsis* | l'état achevé : l'union sans dualité |

    __**Le chemin passe par un dépouillement, et voici pourquoi.**__ L'Un est sans forme ; une âme encore occupée d'une forme, si haute soit-elle, ne serait pas libre pour lui. Elle doit donc se défaire du corps, des sensations, puis des formes intelligibles elles-mêmes : pour recevoir le principe, elle se dépouille de toute forme qu'elle aurait revêtue (traité 38 [VI, 7], chap. 34). Plotin résume la démarche en un précepte, qui clôt le traité 49 : {teal}« Retranche tout »{/teal} (*aphele panta*, traité 49 [V, 3], chap. 17, l. 38).

    __**Plotin parle bien de « devenir l'Un ».**__ L'âme, dit-il, a vu le Bien grâce à une puissance de l'Intellect qui contemple ce qui est au-delà de lui, et elle a pu {teal}« posséder l'Intellect et devenir l'Un »{/teal} (traité 38 [VI, 7], chap. 35, l. 22-23). Dans le même chapitre, elle est comme {yellow}un visiteur entré dans une maison aux décorations variées et très belles{/yellow} : il admire chaque ornement, mais dès qu'il voit le maître de maison, il ne regarde plus que lui, et {teal}« confondrait sa vision avec l'objet de sa vision »{/teal} (l. 7-15).

    Deux autres images disent l'union :

    - Les amants : quand le Bien apparaît soudain dans l'âme, {teal}« ils ne sont plus deux mais les deux n'en font qu'un »{/teal}, et {yellow}les amants et les aimés d'ici-bas qui veulent se confondre{/yellow} en sont l'image (traité 38 [VI, 7], chap. 34, l. 12-15)
    - Le centre : l'âme est comme un cercle, et nous pouvons {teal}« faire que notre centre rejoigne ce qui est comme le centre de toutes choses »{/teal} (traité 9 [VI, 9], chap. 8, l. 19-21)

    __**Le faisons-nous déjà ?**__ Pas en ce sens complet, mais nous en vivons des **approches**. L'Un n'est jamais absent : {teal}« lui, qui n'a pas d'altérité, est toujours présent »{/teal} (traité 9 [VI, 9], chap. 8, l. 33-34) ; c'est nous qui ne le sommes pas, quand notre attention se perd dans ce qui nous disperse. Et toute chose, nous compris, ne subsiste que dans la mesure où elle est unifiée (voir la leçon suivante) : chaque fois que nous nous **rassemblons**, nous recevons déjà quelque chose de cette unité. Le dernier pas, n'être plus que l'Un, Plotin ne le donne ni pour courant ni pour accessible à volonté.

    ! On ne « devient » pas l'Un comme on deviendrait une chose nouvelle : au-delà de la réalité, l'Un est aussi au-delà du devenir, et c'est à son niveau que le mot est **le plus impropre**. L'âme n'ajoute rien à l'Un et n'en devient pas la cause ; ce qui s'abolit, c'est la distance.

    ! L'« ivresse de nectar » du même chapitre 35 n'est pas celle de l'âme qui franchit l'ultime étape : c'est celle de l'Intellect quand il aime ce qui le dépasse (voir la fiche « Amant »).
