- id: g-henosis-l3
  title: L'unification de tout être
  notes: |-
    **L'*henôsis* ne nomme pas seulement l'union suprême avec l'Un : elle désigne aussi l'acte d'unification qui donne l'être et la cohésion à toute réalité.** C'est ce double sens qui fait comprendre pourquoi l'union finale n'est pas un exploit étranger à la vie ordinaire.

    __**Rien ne subsiste sans recevoir une mesure d'unité.**__ {teal}« C'est en vertu de l'unité que tous les êtres sont des êtres »{/teal} (traité 9 [VI, 9], chap. 1, l. 1). {yellow}Une armée, un chœur, une maison ou un navire{/yellow} n'existent qu'en tant qu'ensembles unifiés : que les soldats se dispersent, que les planches se séparent, et la chose cesse d'être. La même exigence vaut au-dedans : la santé du corps tient à la coordination de ses parties, la vertu de l'âme à son unification (chap. 1, l. 13-16).

    __**Il faut pourtant distinguer l'unité reçue de l'Un lui-même.**__

    |  | En grec | Ce qui l'a |
    | **Unité reçue** | *henomenon* | l'Intellect, l'Âme, les corps |
    | **Un en soi** | *to ontôs hen* | le Premier principe seul |

    Tout ce qui est multiple par nature doit recevoir son unité d'un principe ; l'Un en soi n'a besoin d'aucune unification, puisqu'il est la source de toute unité.

    __**Les deux sens se répondent.**__ {violet}Sur le plan descendant{/violet}, l'*henôsis* est le don d'unité qui fait subsister chaque être ; {amber}sur le plan ascendant{/amber}, elle est l'union par laquelle l'âme coïncide avec la source de ce don. {coral}L'union à l'Un est ainsi le retour conscient à ce dont toute chose tient déjà sa cohésion.{/coral}

    ! Ne pas confondre l'unité reçue, que possède toute chose dans la mesure où elle est quelque chose, et l'Un en soi : ce qui a été rendu un dépend toujours de ce qui le rend un.
