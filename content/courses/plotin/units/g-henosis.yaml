- id: g-henosis-l3
  title: L'unification de tout être
  notes: |-
    L'`henōsis` ne nomme pas seulement l'union suprême avec l'Un : elle désigne aussi **l'acte d'unification** qui donne l'être et la cohésion à toute réalité, intelligible ou sensible. Plotin pose pour axiome que « c'est en vertu de l'unité que tous les êtres sont des êtres » : aucun être complexe ne subsiste sans recevoir une certaine mesure d'unification.

    Plotin l'illustre en __VI, 9, 1__ : une armée, un chœur, une maison ou un navire n'existent qu'en tant qu'ensembles unifiés, et que les soldats se dispersent ou que les matériaux du navire se séparent, l'unification disparaît et l'entité cesse aussitôt d'exister. La même exigence vaut pour la vie intérieure : la santé du corps dépend de l'harmonie de ses parties, et la vertu de l'âme de son unification en une seule cohérence.

    **Il faut pourtant distinguer l'unité reçue de l'Un lui-même :**

    |  | En grec | Ce qui l'a |
    | **Unité reçue** | `henomenon` | l'Intellect, l'Âme, les corps |
    | **Un en soi** | `to ontōs hen` | le Premier principe seul |

    Tout ce qui est multiple par nature doit recevoir l'unité d'un principe extérieur ; l'Un en soi n'a besoin d'aucune unification, puisqu'il est la source indivisible de toute unité.

    ! Les deux sens de l'`henōsis` se répondent : {violet}sur le plan descendant{/violet} de l'ontologie, elle est le don d'unité qui fait subsister chaque être ; {amber}sur le plan ascendant{/amber} de l'âme, elle est l'union ultime par laquelle l'âme coïncide avec la source de toute réalité. L'union à l'Un est ainsi le retour conscient à ce dont toute chose tient déjà sa cohésion.
  points:
  - id: g-henosis-l3-1
    sentence: "Outre l'union suprême de l'âme avec l'Un, l'`henōsis` désigne chez Plotin l'acte d'___ qui donne l'être et la cohésion à toute réalité, intelligible ou sensible."
    answer: unification
    alt: []
  - id: g-henosis-l3-2
    sentence: "Que les matériaux d'un ___ se séparent, et l'unification qui le faisait être disparaît : il cesse aussitôt d'exister, comme une armée dont les soldats se dispersent."
    answer: navire
    alt: []
  - id: g-henosis-l3-3
