  - id: g-atemporel-l1-q1
    sentence: "L'atemporel, que la GF traduit par « intemporel » et qui se dit de ce qui n'a pas d'extension, se dit en grec translittéré ___."
    answer: akhronos
    alt: ["achronos", "akhrônos"]
  - id: g-atemporel-l1-q2
    sentence: "La vie intelligible est « la vie qui est tout entière ensemble, pleine et absolument dépourvue d'___ » (traité 45, chap. 3)."
    answer: extension
    alt: []
  - id: g-atemporel-l1-q3
    sentence: "L'éternité « est toujours dans le ___, parce qu'il n'y a rien d'elle-même qui soit passé ni à venir » (traité 45, chap. 3)."
    answer: présent
    alt: ["present"]
  - id: g-atemporel-l1-q4
    sentence: "Les êtres premiers « n'ont pas même de désir de l'___, car ils sont déjà la totalité » (traité 45, chap. 4)."
    answer: avenir
    alt: []
  - id: g-atemporel-l1-q5
    sentence: "L'intelligible est hors du temps, « puisque le temps a besoin de l'___ pour s'étendre » (traité 23, chap. 11)."
    answer: intervalle
    alt: []
  - id: g-atemporel-l1-q6
    sentence: "L'acte n'a pas besoin de temps : « c'est le fait d'acquérir une certaine ___ qui explique qu'il y a du temps » (traité 42, chap. 16)."
    answer: quantité
    alt: ["quantite"]
  - id: g-atemporel-l1-q7
    sentence: "Dans l'Intellect, « chaque réalité véritable est toujours là. Il n'y a en effet ni ___ de l'une à l'autre ni non plus changement de l'une en l'autre » (traité 28, chap. 1)."
    answer: parcours
    alt: []
  - id: g-atemporel-l1-q8
    sentence: "Parce que toute intellection est intemporelle, il n'y a dans l'intelligible aucun ___, ni des choses d'ici-bas ni de quoi que ce soit (traité 28, chap. 1)."
    answer: souvenir
    alt: ["mémoire", "memoire"]
  - id: g-atemporel-l1-q9
    sentence: "L'éternité est « l'acte d'une vie qui par elle-même demeure tournée vers l'___ et en lui » (traité 45, chap. 6)."
    answer: Un
    alt: ["un"]
  - id: g-atemporel-l1-q10
    sentence: "L'Un n'est pas éternel au même titre que l'Intellect : il est ce qu'il est « avant toute ___ » (traité 39, chap. 20)."
    answer: éternité
    alt: ["eternite"]
  - id: g-atemporel-l1-q11
    sentence: "« Certes les âmes ne sont pas dans le temps, mais leurs ___ le sont de même que leurs actes » (traité 28, chap. 15)."
    answer: affections
    alt: []
  - id: g-atemporel-l1-q12
    sentence: "« Car les âmes sont éternelles et le temps vient ___ elles » (traité 28, chap. 15)."
    answer: après
    alt: ["apres"]
  - id: g-atemporel-l1-q13
    sentence: "En exerçant une activité puis une autre, l'âme a engendré, en même temps que ses activités, la ___ (traité 45, chap. 11)."
    answer: succession
    alt: []
  - id: g-atemporel-l1-q14
    sentence: "« C'est dans les produits que se trouve l'avant, c'est-à-dire le passé, mais en l'âme il n'y a aucun ___ » (traité 28, chap. 16)."
    answer: passé
    alt: ["passe"]
  - id: g-atemporel-l1-q15
    sentence: "Les choses dites engendrées « n'ont donc pas été engendrées à un moment ___, mais elles sont engendrées et le seront toujours » (traité 33, chap. 3)."
