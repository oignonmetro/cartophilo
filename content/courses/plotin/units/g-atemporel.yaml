# Entrée du glossaire de Plotin (skill glossaire) : notion, écrite le
# 2026-11-20 avec la procédure NotebookLM (journal g-atemporel). Citations
# vérifiées sur la GF (traité 10, chap. 6 ; traité 11, chap. 2 ; traité 23,
# chap. 11 ; traité 28, chap. 1, 15-16 ; traité 33, chap. 3 ; traité 36,
# chap. 7 ; traité 39, chap. 20 ; traité 42, chap. 16 ; traité 45, chap. 3-6,
