id: g-atemporel
title: Atemporel (`akhronos`)
icon: book
color: coral
lessons:
- id: g-atemporel-l1
  title: Atemporel
  notes: |-
    Chez Plotin, l'{violet}**atemporel**{/violet} ({blue}*akhronos*{/blue}, « intemporel » dans la GF) est [def]. Il n'est {pink}pas ce qui dure toujours{/pink} : une durée sans fin reste une durée. Sont hors du temps l'Un, l'Intellect, les âmes elles-mêmes et la procession ; seuls y sont le monde sensible, et les actes et les affections des âmes.

    __**Est intemporel ce qui n'a pas d'**__{violet}__**extension**__{/violet} __**: ce qui est tout entier à la fois n'a ni passé ni avenir.**__ Avoir un passé, c'est avoir perdu quelque chose de soi ; avoir un avenir, c'est attendre quelque chose de soi. {coral}Ce qui a tout à la fois n'a rien perdu ni rien à attendre{/coral}, et c'est le cas de la vie intelligible, « la vie qui est tout entière ensemble, pleine et __absolument dépourvue d'extension__ » ([[traite45|traité 45]], chap. 3) : « elle est toujours dans le présent, parce qu'__il n'y a rien d'elle-même qui soit passé ni à venir__ » (*ibid*.). Ces êtres « n'ont pas même de désir de l'avenir, car ils sont déjà la totalité » (chap. 4). Le temps commence donc avec l'extension : l'intelligible « se trouve à l'extérieur de toute temporalité, puisque __le temps a besoin de l'intervalle pour s'étendre__ » ([[traite23|traité 23]], chap. 11). De là vient que l'acte comme tel « n'a pas besoin de temps » : c'est seulement « le fait d'acquérir une certaine quantité qui explique qu'il y a du temps » ([[traite42|traité 42]], chap. 16).

    __**L'**__{violet}__**Intellect**__{/violet} __**est hors du temps parce qu'il pense tout à la fois, et l'**__{violet}__**Un**__{/violet} __**plus encore, puisque l'éternité est la vie de ce qui est auprès de lui.**__ L'Intellect ne va pas d'une pensée à une autre : là-bas, « chaque réalité véritable est toujours là. Il n'y a en effet __ni parcours de l'une à l'autre__ ni non plus changement de l'une en l'autre » ([[traite28|traité 28]], chap. 1). Donc « toute activité d'intellection est intemporelle » (*ibid*.), et {coral}l'Intellect n'a pas de mémoire{/coral}, puisqu'il n'a pas de passé. L'Un n'est pas éternel au même titre. Car l'éternité est une vie, celle de l'être qui se tourne vers l'Un : elle est « l'acte d'une vie qui par elle-même __demeure tournée vers l'Un__ et en lui » ([[traite45|traité 45]], chap. 6). Or l'Un est au-delà de l'être et de la vie ; il est donc avant l'éternité, dont il est la source : il est ce qu'il est « __avant toute éternité__ » ([[traite39|traité 39]], chap. 20 ; voir [[g-eternite|éternité]]).

    __**Les**__ {violet}__**âmes**__{/violet} __**ne sont pas dans le temps : ce sont leurs actes et leurs affections qui y sont, et l'âme engendre le temps sans y être.**__ Le temps vient de l'âme, donc après elle : « certes les âmes ne sont pas dans le temps, mais __leurs affections le sont de même que leurs actes__. Car les âmes sont éternelles et le temps vient après elles » ([[traite28|traité 28]], chap. 15). {pink}Que l'âme se soit « temporalisée elle-même »{/pink} ([[traite45|traité 45]], chap. 11) ne contredit pas cette thèse : c'est « l'une des puissances de l'âme », celle « qui n'acceptait pas que ce tout lui fût présent tout d'un bloc » (*ibid*.), qui vit désormais d'acte en acte. L'âme « exerce une activité, puis une autre », et elle a ainsi « engendré, en même temps que ses activités, __la succession__ » (*ibid*.). Ses produits se suivent, elle ne passe pas : « c'est dans les produits que se trouve l'avant, c'est-à-dire le passé, mais __en l'âme il n'y a aucun passé__ » ([[traite28|traité 28]], chap. 16), car ses raisons y sont « présentes simultanément » (*ibid*. ; voir [[g-temps|temps]], [[g-ame-non-descendue|âme non descendue]]).

    __**La**__ {violet}__**procession**__{/violet} __**est intemporelle : « avant » et « après » y disent un ordre de dépendance, non une succession.**__ Une génération dans le temps supposerait un moment où l'engendré n'était pas, donc un changement dans la cause. {coral}Or la cause ne change pas en produisant{/coral} : elle « leur a donné l'existence en restant en lui-même » ([[traite11|traité 11]], chap. 2). L'engendré est donc toujours : les choses dites engendrées « n'ont donc pas été engendrées à un moment donné, mais __elles sont engendrées et le seront toujours__ » ([[traite33|traité 33]], chap. 3). « Avant » ne peut alors dire qu'une priorité de nature : « quand nous parlons de réalités éternelles, il nous est interdit de parler d'une venue à l'existence dans le temps ; mais quand dans le discours nous attribuons une venue à l'existence à ces réalités, __nous leur assignons une place dans une relation de causalité__ » ([[traite10|traité 10]], chap. 6). L'Intellect existe ainsi avant le monde, « non au sens où l'Intellect lui serait antérieur dans le temps, mais parce que __l'univers dépend de l'Intellect__ » ([[traite47|traité 47]], chap. 1 ; voir [[g-procession|procession]]).

    __**Ce qui dure toujours n'est pas pour autant intemporel : l'**__{violet}__**éternité**__{/violet} __**n'a pas de longueur, et le**__ {violet}__**monde**__{/violet}__**, sans commencement ni fin, reste dans le temps.**__ Durer sans commencement ni fin, c'est avoir une extension infinie ; or une extension infinie reste une extension. Le monde est donc à la fois sans commencement, puisqu'« il n'y eut pas un moment où il n'existait pas » ([[traite47|traité 47]], chap. 1), et dans le temps : l'âme « a fait qu'il se retrouvât __tout entier dans le temps__, en inscrivant dans le temps toutes ses révolutions » ([[traite45|traité 45]], chap. 11). L'éternité, à l'inverse, « n'est pas plus grande, plus petite ou d'une quelconque longueur : elle est une chose déterminée, __sans extension et intemporelle__ » ([[traite36|traité 36]], chap. 7). D'où la consigne : « il ne faut pas unir l'être au non-être, ni le temps à l'éternité, ni la permanence temporelle à l'éternité » (*ibid*.).

    | Ce qui est | Dans le temps ? | Pourquoi |
    | l'Un | non, avant l'éternité | il est au-delà de l'être et de la vie |
    | l'Intellect | non, éternel | il pense tout à la fois |
    | l'âme | non | le temps vient d'elle, donc après elle |
    | les actes et les affections de l'âme | oui | ils se succèdent |
    | la procession | non | « avant » y dit la dépendance |
    | le monde sensible | oui, sans commencement | il dure, il ne possède pas tout à la fois |

    ! Dans la GF, {pink}« perpétuel » ne s'oppose pas à « éternel »{/pink} : la perpétuité est l'état de ce qui a d'emblée toute sa vie, et « l'éternité sera le substrat, pris avec cet état qui se montre en lui » ([[traite45|traité 45]], chap. 5). L'opposition passe entre l'éternité et la durée, même sans fin.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 10, chap. 6 | la génération des éternels, un ordre de causalité |
    | traité 23, chap. 11 | l'intelligible hors du temps, qui a besoin d'intervalle |
    | traité 28, chap. 1 | l'intellection intemporelle, sans mémoire |
    | traité 28, chap. 15 | les âmes hors du temps, leurs actes dans le temps |
    | traité 33, chap. 3 | engendrées, mais pas à un moment donné |
    | traité 36, chap. 7 | l'éternité, sans longueur |
    | traité 45, chap. 3 | une vie tout entière ensemble, sans extension |
    | traité 45, chap. 11 | l'âme temporalisée, le monde tout entier dans le temps |

    **Voir aussi** : [[g-eternite|Éternité]] · [[g-temps|Temps]] · [[g-procession|Procession]] · [[g-necessaire|Nécessaire]] · [[g-intellect|Intellect]] · [[g-un|Un]] · [[g-ame-non-descendue|Âme non descendue]] · [[traite45|Traité 45]]
