lessons:
- id: g-vieillesse-l1
  title: Vieillesse
  notes: |-
    Chez Plotin, la {violet}**vieillesse**{/violet} est [def]. Ce n'est pas {pink}l'âme qui s'use avec les années{/pink} : c'est le corps qui ne retient plus ce qu'il reçoit.

    __**La vieillesse est un état du corps, non de l'âme.**__ L'âme ne peut pas vieillir, parce qu'elle n'a pas reçu la vie d'ailleurs : elle « a la vie par elle-même et __ne peut jamais la perdre__ parce qu'elle l'a par elle-même » ([[traite2|traité 2]], chap. 9). Ce qui change avec l'âge, c'est donc le corps, que l'âme emploie comme un instrument : « s'il s'agit d'un instrument qui nous a été confié pour un certain temps, __il doit par nature n'exister que ce temps durant__ » (chap. 1). Les âges eux-mêmes se succèdent sans que leur principe change : la nature produit « les âges successifs ; la pousse, à des moments déterminés, des ongles, de la barbe et des seins », et pourtant « autant sont variées les choses qui naissent, autant __celui qui les fabrique reste inchangé__ » ([[traite28|traité 28]], chap. 11). C'est pourquoi les désirs changent avec l'âge sans que l'âme change : « autres en effet sont les désirs corporels chez les enfants, chez les adolescents et chez les adultes » (chap. 21), parce qu'ils viennent du corps (voir [[g-desir|désir]]).

    __**Le vivant d'ici-bas vieillit parce que son corps s'écoule au-dehors et que sa matière ne cherche pas à subsister ; le monde, qui n'a pas de dehors, ne vieillit pas.**__ Plotin l'établit par contraste avec le monde. Le monde contient toute la matière : il n'a donc pas de dehors où la perdre, et « il s'écoule en lui-même, car il ne s'écoule pas au-dehors. [...] Par suite, __il ne vieillit absolument pas__ » ([[traite40|traité 40]], chap. 3). Un vivant particulier, au contraire, est une partie plongée dans un milieu : « les parties de notre corps changent continuellement et __partent vers l'extérieur__ » (*ibid*.). La nourriture compense un temps cette perte, mais pas toujours, car l'âme qui façonne les vivants d'ici-bas travaille avec une matière qui ne tient pas à sa forme : elle « utilise des corps de qualité inférieure pour accomplir son œuvre, qu'elle est dans un lieu inférieur et que __les matériaux dont elle se sert dans son travail de composition ne désirent pas subsister__ » (chap. 5). Donc « les vivants d'ici-bas ne peuvent subsister toujours » (*ibid*.) : ils vieillissent, puis meurent (voir [[g-mort|mort]]).

    __**Le corps vieux se défait au moindre coup, parce qu'il a perdu sa cohésion.**__ Plotin se sert de la vieillesse comme d'un exemple connu de tous, pour faire voir ce qu'est un corps sans force d'unité. Il part de ceci qu'« un corps est d'autant plus corps qu'il est plus susceptible d'être affecté » ([[traite26|traité 26]], chap. 6) : l'eau coupée se rejoint, la terre coupée reste en deux. Puis il compare : « de même que __les corps épuisés naturellement par la vieillesse sont blessés et détruits par le moindre coup__, de même ce qui est au plus haut point corps parce que parvenu au plus proche du non-être n'a pas la force de se rassembler en une unité » (*ibid*.). Le corps vieux est donc un corps qui a perdu ce qui le tenait ensemble : il se rapproche de la [[g-hule|matière]], qui n'a ni unité ni forme, et c'est pourquoi un rien le blesse.

    __**Pour le sage, la vieillesse est l'âge où il ne veut plus être troublé par le corps.**__ La vieillesse ne fait pas que diminuer : elle change ce que le sage attend de son corps. Jeune, il ne fuit pas la douleur, il veut l'éprouver : « même s'il n'en fait pas l'expérience quand il est jeune, __il voudra savoir à quoi s'en tenir__ » ([[traite46|traité 46]], chap. 14). L'épreuve faite, il n'a plus rien à en apprendre ; « une fois parvenu à la vieillesse, il ne voudra être troublé ni par ces souffrances, ni par les plaisirs, ni même par quelque affection que ce soit qui appartienne à ce monde, qu'elle soit agréable ou non, __pour éviter de devoir prêter attention à son corps__ » (*ibid*.). Car son [[g-bonheur|bonheur]] n'en dépend pas : « si une chose n'ajoute rien à ce qui reste identique, comment son contraire pourrait-il le détruire ? » (*ibid*.).

    | Âge | Ce que veut le sage | Pourquoi |
    | la jeunesse | éprouver la douleur | savoir à quoi s'en tenir |
    | la vieillesse | ne plus être troublé | ne pas prêter attention au corps |

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 2, chap. 9 | l'âme a la vie par elle-même et ne la perd pas |
    | traité 26, chap. 6 | le corps vieux, détruit au moindre coup |
    | traité 28, chap. 11 | les âges se succèdent, leur principe ne change pas |
    | traité 40, chap. 3 | le monde ne vieillit pas, nos parties partent au-dehors |
    | traité 40, chap. 5 | la matière d'ici-bas ne désire pas subsister |
    | traité 46, chap. 14 | vieux, le sage ne veut plus être troublé par le corps |

    **Voir aussi** : [[g-mort|Mort]] · [[g-corps|Corps]] · [[g-croissance|Croissance]] · [[g-temps|Temps]] · [[g-bonheur|Bonheur]]
