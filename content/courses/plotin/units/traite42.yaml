- id: traite42-l3
  title: "La qualité, le quand et le où"
  notes: |-
    **La qualité n'a pas de caractère commun** (chap. 10) : on cherche ce qu'il y a de commun aux quatre sortes de qualités d'Aristote. Ce n'est pas la puissance : l'absence de puissance n'entrerait pas dans le genre, et la figure n'est pas une puissance. La rationalité de l'homme en tant qu'homme n'est pas une qualité ; seule l'est celle qu'il acquiert par la vertu. La qualité serait « une puissance qui ajoute aux réalités le fait d'être qualifiées ultérieurement » ; les différences, elles, sont des actes, des **raisons**. La laideur et la maladie sont des raisons inachevées. Reste un élément commun : **ce qui s'ajoute à un substrat après sa réalité**. L'humanité ne donne pas à l'homme sa forme, mais sa réalité.

    | Sorte de qualité | Exemple | L'objection |
    | l'état et la disposition | la science, la santé | persister n'est qu'une addition extérieure |
    | la capacité naturelle | le pugiliste | naturelle ou acquise, la qualité est la même |
    | la qualité passive | la chaleur, la blancheur | son origine ne la distingue pas |
    | la figure et la forme | le triangle | la forme de chaque chose n'est pas une qualité |

    **D'autres divisions** (chap. 11-12) : les qualités du corps selon les sens, celles de l'âme selon l'appétit, l'ardeur et la raison, ou selon l'utile et le nuisible. Une technique est une qualité en tant qu'elle dispose l'âme, un relatif en tant qu'elle produit. Une question vaut pour toutes les catégories : y a-t-il deux genres, l'un ici, l'autre là-bas ?

    **Le quand** (chap. 13) : « hier » ou « l'année dernière » sont des parties du temps, « était », « est » et « sera » des espèces du temps ; or le temps relève de la quantité. Dans « Socrate était là l'an passé », Socrate vient de l'extérieur : on multiplie les catégories.

    **Le où** (chap. 14) : le Lycée et l'Académie sont des lieux. Dire qu'une chose est dans une autre, c'est énoncer une relation, celle du réceptacle et de ce qu'il reçoit. Si ce qui est dans un lieu était une catégorie, ce qui est dans un vase en serait une autre.

    ! Le quand et le où ne sont pas récusés pour leur manque d'unité : ils se ramènent au temps, au lieu ou au relatif.
