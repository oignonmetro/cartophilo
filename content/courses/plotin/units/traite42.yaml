- id: traite42-l5
  title: "Contre les quatre genres stoïciens"
  notes: |-
    **Les quatre genres** (chap. 25) : les stoïciens divisent les êtres, c'est-à-dire les corps, en substrats, qualités, manières d'être et manières d'être relatives, et les enveloppent dans un genre unique, **le « quelque chose »** (`ti`). Ce genre est inadapté aux incorporels comme aux corps, ne laisse aucune place aux différences, et doit être un être ou un non-être.

    | Genre stoïcien | Exemple | L'objection |
    | le substrat | « cet homme individuel que je suis » | l'antérieur et le postérieur dans un même genre |
    | le qualifié | « je suis savant » | simple ou composé, la division est absurde |
    | la manière d'être | « je suis assis » | tout est manière d'être de la matière |
    | la manière d'être relative | « je suis le père de mes enfants » | elle survient à des êtres déjà là |

    **La matière au premier rang** (chap. 25-27) : en mettant les substrats en tête, ils placent la matière, leur principe, sur le même plan que ce qui vient après elle ; or parler des principes, ce n'est pas parler des êtres. Mettre la matière, qui n'est qu'en puissance, avant l'acte est absurde : ce qui est en puissance ne se fera pas passer à l'acte. Leur dieu, corps composé, vient en second ; la tridimensionnalité définit le corps mathématique, et la résistance est une qualité. Il faut commencer par ce qui est un et sans masse. Si la matière devient toutes choses en recevant des figures, elle n'est pas plus un substrat que **le danseur** pour les figures qu'il exécute.

    **La cause de l'absurdité** (chap. 28) : les stoïciens mettent au premier rang le non-être, parce qu'**ils prennent pour guide la sensation** ; effrayés de voir les corps changer, ils prennent pour l'être véritable ce qui subsiste dessous, comme on prendrait le lieu, ou l'ombre, pour plus réels que les corps. Et ce qu'ils posent comme être véritable échappe aux sens.

    **Les autres genres** (chap. 29-30) : si les qualités sont simples, elles sont incorporelles ; si elles sont composées, la division revient à diviser la science en études littéraires et en études littéraires avec autre chose. Si l'intellect n'est qu'une manière d'être de la matière, c'est la matière qui parle ; et qui parle ainsi parle en s'ignorant lui-même. Toutes choses sont des manières d'être de la matière ; et la manière d'être relative vient après les êtres qu'elle relie.

    ! L'opposition de Plotin aux stoïciens est globale : leurs genres ne sont pas à corriger, comme ceux d'Aristote, mais à écarter.
