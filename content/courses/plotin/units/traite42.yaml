id: traite42
title: "Traité 42 (VI, 1) : Sur les genres de l'être I"
subtitle: "Contre les catégories d'Aristote et des stoïciens"
icon: compass
color: sky
lessons:
- id: traite42-l1
  title: "Le problème : genres de l'être ou catégories"
  notes: |-
    **Les traités 42, 43 et 44 forment un tout** : avec le traité 45, ce sont les derniers que Plotin compose à Rome, entre 263 et 268. Le traité 42 critique les catégories d'Aristote et des stoïciens ; le traité 43 décrit les cinq grands genres du *Sophiste* ; le traité 44 traite des catégories du monde sensible. On a supposé que la dure critique d'Aristote fut la cause du départ pour la Sicile de Porphyre, qui, mélancolique, songeait au suicide.

    **Logique ou ontologie** : le terme « catégorie » manifeste la face linguistique de la prédication (« affirmer quelque chose de quelque chose ») ; l'expression « genre de l'être », sa face ontologique. Pour Porphyre, les *Catégories* sont un ouvrage purement logique ; pour Plotin, un traité consacré à l'être.

    **Le problème** (chap. 1) : les anciens ont dit l'être un, en nombre limité ou illimité ; puis Platon, Aristote et les stoïciens ont rangé les êtres en genres, dix pour les uns, moins pour les autres. La première question est de savoir si les dix genres se trouvent de la même manière dans les intelligibles et dans les sensibles. Or **il n'y a pas de genre commun là où il y a de l'antérieur et du postérieur** ; et la classification d'Aristote, qui ne parle pas des intelligibles, laisse de côté « les êtres les plus éminents ».

    **La réalité** (chap. 2-3) : rien n'est commun, comme un genre, à la réalité intelligible et à la réalité sensible ; ce serait quelque chose qui ne serait ni un corps ni un incorporel. Même dans le sensible, matière, forme et composé, réalités premières et secondes, ne sont pas sur un pied d'égalité. Leur unité est celle de **la famille des Héraclides**, qui ne tient pas à un caractère commun, mais à un ancêtre unique.

    | Objection | Ce qu'elle vise |
    | la dépendance du sensible | l'antérieur et le postérieur dans un même genre |
    | le nom seul en commun | l'homonymie de l'intelligible et du sensible |

    ! Plotin ne reproche pas à Aristote de faire des catégories des genres de l'être, mais de les poser sans distinguer l'intelligible du sensible.
