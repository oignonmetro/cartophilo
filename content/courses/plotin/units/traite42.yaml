- id: traite42-l4
  title: "Agir et pâtir, avoir et position"
  notes: |-
    **L'acte et le mouvement** (chap. 15-16) : l'agir accompagne la réalité, comme la quantité et la qualité ; mais le genre serait plutôt l'acte, et si l'acte l'accompagne comme le mouvement, **le mouvement aussi est un genre de l'être**. Aristote définit le mouvement comme un acte inachevé ; pour Plotin, il est totalement acte : ce qui est inachevé, c'est ce qu'il tendait à réaliser. La marche est marche dès qu'elle est commencée, même si le stade n'est pas parcouru. **Le mouvement n'a pas besoin de temps** : c'est le fait d'acquérir une certaine quantité qui explique qu'il y ait du temps. Le traité 45 reprendra ce point.

    **Ni relatif ni deux genres** (chap. 17-19) : l'acte et le mouvement sont pensés en eux-mêmes avant toute relation ; sinon tout serait relatif. Il aurait fallu faire de « être mû » un genre, dont l'agir et le pâtir seraient les espèces. Marcher et penser sont des actions sans patient. Écrire n'est pas faire pâtir la tablette ; on croit que l'animal sur lequel on marche pâtit parce qu'on songe à la souffrance ; écouter n'est pas pâtir.

    **Pâtir n'est pas se dégrader** (chap. 20-21) : l'altération est un mouvement selon la qualité. Le cygne que sa raison rend blanc dès la naissance ne pâtit pas ; l'étain embellit le cuivre en devenant pire ; apprendre n'est pas être frappé. Le bronze chauffé est affecté, non la statue : il y a deux manières d'être affecté.

    **Conclusion** (chap. 22) : **c'est le même mouvement qui est agir d'un point de vue et pâtir d'un autre** ; agir et pâtir risquent donc d'être des relatifs. Prévoir et penser ne sont pas agir : on pense à propos de l'objet, sans agir sur lui. Celui qui marche ne laisse des traces que par accident.

    **L'avoir et la position** (chap. 23-24) : pourquoi réserver l'avoir aux armes, aux chaussures et aux vêtements ? Un homme et une statue n'ont pas des armes au même sens. Faut-il un genre pour un petit nombre de cas ? La position, « être couché » ou « être assis », se ramène à une attitude et à un lieu.

    ! Plotin ne nie pas le mouvement : il en fait un genre, et l'agir et le pâtir n'en sont que des aspects.
