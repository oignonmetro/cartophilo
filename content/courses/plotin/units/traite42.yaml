- id: traite42-l2
  title: "La quantité et la relation"
  notes: |-
    **La quantité** (chap. 4-5) : les aristotéliciens y rangent le nombre, puis la grandeur continue, le lieu et le temps ; ils disent le mouvement quantifié parce que le temps l'est, alors que c'est du mouvement que le temps reçoit sa continuité. Une ligne ou une surface sont des **grandeurs**, qui ne deviennent quantités que ramenées à un nombre (deux coudées) : « la quantité ce n'est pas trois bœufs », mais le nombre qui est en eux. Les nombres en soi sont des réalités. **Seul le nombre est quantité** : il n'y a pas là un genre, mais une catégorie. Le discours est mesuré, mais il n'est pas quantité : c'est une action qui signifie. Le temps n'est pas non plus la quantité, et « l'égal et l'inégal sont le propre de la quantité ».

    **La relation existe** (chap. 6-7) : on objecte qu'elle n'est que notre jugement, puisque **la comparaison vient de nous**. Mais le double est double avant que nous le sachions : la relation précède la connaissance que nous en prenons. Double et moitié n'adviennent que l'un par l'autre, simultanément ; et le père mort, l'enfant reste son fils.

    **Sans former un genre** (chap. 8-9) : ce qui est commun aux relatifs n'est pas un corps, mais un incorporel ; s'il diffère selon les cas, le terme est un homonyme. Plotin rapporte toutes les relations à des **raisons** :

    | Relation | Exemple | Ce qui la fait |
    | active | le producteur, la science | la raison associée à l'activité |
    | par participation | le double et la moitié | des formes opposées |
    | dans une même chose | le semblable et le dissemblable | deux qualités à la fois |

    Le laid et le plus laid participent d'une forme qui les domine plus ou moins. Mais les aristotéliciens rangent sous un genre unique un relatif et sa négation, le double et le non-double : comme si l'on mettait le non-animal dans le genre animal.

    ! Que toutes les relations se rapportent à des raisons ne suffit pas à en faire un seul genre.
