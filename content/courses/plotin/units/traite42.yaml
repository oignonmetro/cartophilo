  notes: |-
    **Le traité 42 pose le problème (chap. 1), critique les dix catégories d'Aristote (chap. 2-24), puis les quatre genres stoïciens (chap. 25-30).**

    | Moment | Lieu | Ce qui s'y joue |
    | les anciens et le nombre des genres | 1, 1-14 | Platon, Aristote, les stoïciens |
    | position du problème | 1, 15-30 | l'intelligible et le sensible |
    | la réalité | chap. 2-3 | les Héraclides |
    | la quantité | chap. 4-5 | trois bœufs |
    | la relation | chap. 6-9 | le double et la moitié |
    | la qualité | chap. 10-12 | le pugiliste |
    | le quand | chap. 13 | Socrate l'an passé |
    | le où | chap. 14 | le Lycée et l'Académie |
    | l'agir et le pâtir | chap. 15-22 | la marche, le cygne |
    | l'avoir | chap. 23 | les armes de la statue |
    | la position | chap. 24 | être couché |
    | le « quelque chose » stoïcien | 25, 1-11 | ni corps ni incorporel |
    | le substrat | 25, 12-28, 26 | le danseur |
    | la qualité stoïcienne | chap. 29 | la matière qui parle |
    | la manière d'être | 30, 1-21 | trois coudées et blanc |
    | la manière d'être relative | 30, 21-27 | le un et le deux avant |
    | conclusions | 30, 28-32 | les autres doctrines |

