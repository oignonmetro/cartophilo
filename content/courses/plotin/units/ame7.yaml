- id: ame7-l2
  title: "L'ὁμοούσιος gnostique : le privilège des élus"
  notes: |-
    **Dans la gnose, chaque type d'homme retourne à ce qui lui est consubstantiel, et seuls les** {violet}**pneumatiques**{/violet} **sont consubstantiels au divin : ils sont « sauvés par nature ».** C'est exactement le schéma de l'âme non descendue, réservé à quelques-uns.

    **Trois natures, trois retours.** Selon {sky}Irénée{/sky}, les valentiniens assignent pour lieu propre aux pneumatiques l'intérieur du Plérôme, aux psychiques l'Intermédiaire, aux somatiques l'élément terrestre : « contre cela, assurent-ils, Dieu ne peut rien, mais {amber}chacun des êtres susdits retourne à ce qui lui est consubstantiel{/amber} » (*Contre les hérésies*, II, 14, 6). La consubstantialité garantit **un retour du semblable au semblable**.

    Les *Extraits de Théodote* (de {sky}Clément d'Alexandrie{/sky}) les rapportent aux fils d'Adam :

    | Nature | Fils d'Adam | Rapport à Dieu |
    | irrationnelle (terrestre) | Caïn | à l'image de Dieu |
    | raisonnable et juste (psychique) | Abel | à la ressemblance de Dieu |
    | pneumatique | Seth | Dieu en propre |

    Consubstantiel à Dieu, l'élu pneumatique est {amber}« sauvé par nature »{/amber} (56, 3) ; {yellow}« Sagesse a émis la semence pneumatique qui est en Adam, afin que l'"os", l'âme "raisonnable" et "céleste", ne soit pas vide, mais qu'il soit rempli de moelle pneumatique »{/yellow} (53, 5). La consubstantialité parle le langage de la **fructification** et de l'**émission** : le prolongement substantiel de la source dans ce qui éclôt. {yellow}Le pseudo-Hippolyte : comme l'aimant attire le fer et le fer seul, le Serpent (le Fils) attire hors de ce monde la race parfaite, consubstantielle au Père, envoyée par lui ici-bas.{/yellow}

    **Un mot gnostique.** Les spécialistes s'accordent à reconnaître que les gnostiques furent **les premiers à introduire le terme** dans la littérature sacrée, bien avant les querelles du concile de Nicée. Il y a trois sens ({sky}Beatrice{/sky}) :

    - {amber}l'identité de substance entre le générateur et l'engendré{/amber} : c'est le sens de l'âme non descendue de Plotin ;
    - {amber}l'identité de substance entre des réalités engendrées de la même substance{/amber} : Plotin s'en servira aussi (leçon 5) ;
    - {amber}l'identité de substance entre partenaires d'une même syzygie{/amber}.

    **Les autres natures sont « d'essence dissemblable ».** La *Lettre à Flora* de {sky}Ptolémée{/sky} qualifie la nature de la corruption (le hylique) et celle de l'Intermédiaire (le psychique) d'{violet}in-consubstantielles{/violet} ({blue}*anomoousioi*{/blue}), alors qu'il est dans la nature du bien d'engendrer seulement des êtres semblables et consubstantiels à lui. {coral}On mesure par contraste l'originalité de Plotin : chez lui, aucune âme n'est in-consubstantielle au divin.{/coral}

    ! Le salut gnostique n'est peut-être pas aussi automatique que le disent les hérésiologues et Plotin ({sky}Rudolph{/sky}) : l'élément pneumatique ne peut périr, mais la conduite de celui qui le porte compte. Reste que la gnose réserve la consubstantialité à une race.
