- id: ame7-l4
  title: "Devenir dieu : la mystique gnostique et sa version dégrisée"
  notes: |-
    **Le traité 6 s'ouvre sur un récit à la première personne : Plotin rapporte comment il en vient, par lui-même, à l'identité avec le divin. Pour un gnostique, c'était une autre critique voilée :** {coral}**ce que la gnose n'obtient qu'à travers des révélations et des rites, le philosophe l'offre à la première personne et sous un mode contrôlé**{/coral}.

    **Un récit sans parallèle.** {teal}« Souvent, lorsque je __m'éveille à moi-même__{/teal} en sortant de mon corps […], {teal}__devenu identique au divin__{/teal} […] » ([[traite6|traité 6]], 1, 1-11). Par sa précision et sa sobriété, sa « tranquille exaltation », le texte **n'a pas de parallèle connu dans toute l'Antiquité** ({sky}Harder{/sky}). {yellow}Mettons-nous dans la peau d'un gnostique, habitué aux discours oraculaires révélés à la troisième personne, qui entend soudain ce compte rendu.{/yellow}

    **Le devenir-dieu, thème hermétique et gnostique.**

    - Le *{sky}Poimandrès{/sky}* (hermétique) : l'élu, dénudé de ce que les sphères avaient produit, monte vers le Père ; {amber}« telle est la fin bienheureuse pour ceux qui possèdent la connaissance : devenir Dieu »{/amber} (*Corpus hermeticum*, I, 26).
    - Plotin va jusqu'à dire qu'au moment ultime de l'union, on est {teal}« {/teal}{teal}__devenu Dieu lui-même, ou plutôt est Dieu lui-même__ »{/teal} ([[traite9|traité 9]], 9, 58) : un énoncé **foncièrement gnostique**.
    - L'*{sky}Allogène{/sky}*, texte qui circulait dans l'école de Plotin (Porphyre, *Vie de Plotin*, 16), raconte la révélation d'un homme d'une race supérieure qui, rentrant en lui-même, découvre sa divinité et atteint seul l'Inconnaissable (l'Un de Plotin).
    - Le *Livre sacré du grand Esprit invisible* : après le baptême, l'initié {amber}« je suis devenu lumière »{/amber} ; *L'Ogdoade et l'Ennéade* : Hermès et son disciple, en extase, {amber}« Je suis l'Intellect »{/amber}.

    Dans la gnose comme dans l'hermétisme, **le rapport entre l'individu et le Dieu n'a plus rien d'extrinsèque** : il implique une modification profonde de toute la personne.

    **Un héritier intellectualisé et dégrisé.** {coral}Le mysticisme plotinien est l'héritier intellectualisé et en quelque sorte dégrisé du mysticisme gnostico-hermétique{/coral} : une odyssée de l'âme aussi vibrante, mais **débarrassée du style des révélations oraculaires**. Chez Plotin, le mythe est **illustratif ou corroboratif** : il appuie le raisonnement sans s'y substituer. Ainsi dès le [[traite1|traité 1]] : {yellow}Narcisse, qui voulut saisir une belle image sur l'eau et disparut dans le courant{/yellow} ; {yellow}Ulysse, qui quitta Circé et Calypso malgré les plaisirs des yeux{/yellow}. {teal}« {/teal}{teal}__Fuyons, par conséquent, vers notre chère patrie__ »{/teal} : {teal}« {/teal}Or {teal}notre patrie{/teal}, c'est {teal}__d'où nous sommes venus__{/teal}, et là où se trouve {teal}notre père »{/teal} ([[traite1|traité 1]], 8, 1-21). Plotin n'est presque jamais incantatoire, sauf pour dire la difficulté de parler du principe suprême, comme à la fin du [[traite49|traité 49]] : {teal}« {/teal}{teal}mon âme est encore en douleur d'enfantement »{/teal} (17, 15-20).

    ! Le récit du traité 6 ne décrit pas l'union à l'Un, mais une vie dans l'Intellect ; et il ne raconte pas une révélation reçue d'un autre : c'est une expérience que l'âme fait par elle-même, parce que tout en elle l'y prépare.
