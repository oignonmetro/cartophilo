lessons:
- id: ame7-l1
  title: "L'énigme : d'où vient la non-descente ?"
  notes: |-
    **La non-descente est une thèse « typiquement » plotinienne, mais d'où vient-elle ? Faute de mieux, on l'a mise au compte de la personnalité de Plotin, de son expérience mystique.** {sky}Narbonne{/sky} **y voit la reformulation d'une doctrine précise :** {green}**la consubstantialité gnostique et hermétique de l'élu au divin**{/green}, l'{violet}ὁμοούσιος{/violet} ({blue}*homoousios*{/blue}).

    **L'explication par l'expérience.** Aucune recherche n'a levé le voile sur les antécédents de la thèse. D'où le refuge dans l'expérience personnelle :

    - {sky}Dodds{/sky} : la doctrine n'était pas traditionnelle dans l'école platonicienne ; elle a pu être suggérée **en partie par l'expérience personnelle**, en partie par l'**intellect actif** du *{sky}De anima{/sky}* d'Aristote, qui mène une existence inexpliquée au fond de notre être ;
    - {sky}Rist{/sky} : elle naît de la confiance de Plotin, fondée sur son **expérience mystique**, qu'un retour aux sources de l'âme est possible pour toute âme ;
    - {sky}Armstrong{/sky} : {amber}« I think it must be due to experience »{/amber}.

    {red}Expliquer une thèse par la psychologie de son auteur, c'est avouer qu'on ne lui trouve pas de raisons{/red}. Plus récemment, {sky}Saffrey{/sky} la qualifiait encore d'« étrange ».

    **Le salut éternellement fait.** {sky}Bréhier{/sky} disait que pour Plotin le salut est « éternellement fait » ([[ame6|leçon sur ce que la thèse permet]]). Mais ce concept {coral}relève bien davantage du credo gnostique{/coral}, où le salut des **élus** est assuré par la substance même, dite {violet}**pneumatique**{/violet}, de leur être, qui leur confère après la mort **le retour dans le Plérôme** (l'Intelligible) dont ils proviennent, **quel qu'ait été leur comportement ici-bas**. C'était d'ailleurs un des motifs majeurs de l'indignation de Plotin : {teal}« {/teal}{teal}__il ne faut pas penser qu'on est seul__ à pouvoir devenir meilleur »{/teal} ([[traite33|traité 33]], 9, 27-28).

    **La thèse de Narbonne.** Les gnostiques ne défendent pas la non-descente **en ces termes**, sans quoi on aurait vite trouvé le lien. Mais {coral}l'énoncé plotinien est la reformulation d'un enseignement dont le ressort premier se découvre dans la gnose{/coral} : la consubstantialité de l'âme de l'élu au Plérôme, qu'elle ne perd jamais. Et le mot même trahit l'emprunt : {blue}*homoousios*{/blue}, que Plotin n'emploie qu'une fois à propos de l'âme, au [[traite2|traité 2]] (10, 19).

    ! Narbonne ne dit pas que Plotin serait gnostique : il dit que Plotin reprend une doctrine gnostique pour la retourner contre ceux qui l'avaient formée.
  points:
