- id: ame7-l6
  title: "Les sources gnostiques de la descente"
  notes: |-
    **Ce n'est pas seulement la non-descente : plusieurs traits de la descente au** [[traite6|traité 6]] **ont leur parallèle dans les écrits gnostiques de Nag Hammadi, l'inclinaison, l'autonomie de l'âme, l'âme qui n'est pas séparée du Plérôme.** {sky}Lacroix{/sky} **en conclut, comme Narbonne, que** {coral}**la non-descente partielle est une innovation gnostique, que Plotin a retravaillée**{/coral}.

    **L'inclinaison ({blue}*neusis*{/blue}).** {sky}Poirier{/sky} l'a montré : chez les gnostiques, la {blue}*neusis*{/blue} n'est pas seulement une inclinaison vers le bas, mais surtout un **« assentiment des puissances supérieures aux étapes successives du déploiement du monde inférieur »**. {yellow}Dans le *Livre des secrets de Jean*, Barbélô demande la vie éternelle, et l'Esprit invisible « fit un signe d'assentiment »{/yellow} : le supérieur s'incline au sens où il consent. Plotin n'emploie le mot qu'une fois au [[traite6|traité 6]] (2, 49-53), pour l'âme du monde qu'aucune préoccupation ne fait **s'incliner vers le bas** : {coral}il l'entend manifestement au sens d'un regard vers le bas{/coral}, et peut-être contre le *{sky}Zostrien{/sky}*, où Sagesse est préoccupée par les choses d'ici-bas, quand l'âme de Plotin gouverne sans trouble.

    **L'autonomie : le *Traité tripartite*.** Au chapitre 5 du [[traite6|traité 6]], l'inclinaison de l'âme se fait de façon **autonome** ({blue}*rhopê autexousios*{/blue}). Le *{sky}Traité tripartite{/sky}* parle de même de « l'autonomie de la volonté » des éons. La chute y provient d'une **erreur**, mais elle survient parce que les éons sont autonomes : {red}ce n'est donc pas la faute du principe premier{/red}, {green}mais du Logos, qui a librement décidé de s'élancer vers le Père{/green}. Et pourtant : {amber}« ce n'est pas contre la volonté du Père que ce Logos-là a été engendré, et ce n'est pas non plus contre elle qu'il allait s'élancer »{/amber}. {coral}Une chute libre et pourtant voulue : c'est le volontaire compris dans la nécessité du traité 6, la descente volontaire mais nécessaire « à cause d'une loi éternelle de la nature » (5, 9-10).{/coral} L'enjeu est le même : **expliquer le monde sensible en préservant intacts les termes supérieurs**. Une source commune est possible (le *Traité tripartite* adapterait une théorie moyen-platonicienne de l'école de {sky}Taurus{/sky}), mais les similitudes sont nombreuses et indéniables.

    **L'âme non séparée : l'*Enseignement d'autorité*.** {amber}« Qu'elle soit descendue (ici-bas) ou dans le Plérôme, elle n'est pas séparée d'eux »{/amber} : comme au traité 6, l'âme se trouve à la fois dans le Plérôme (l'Intellect, chez Plotin) et ici-bas.

    **D'où vient la doctrine ?** Deux constats.

    - {amber}L'idée d'une âme double est moyen-platonicienne{/amber} : {sky}Numénius{/sky} attribue à l'homme non pas trois parties d'une seule âme, mais **deux âmes**, l'une raisonnable, l'autre irrationnelle (fr. 44). Le gnostique distingue de même l'âme pneumatique et l'âme psychique.
    - {amber}Mais aucune source pré-gnostique ne parle d'une non-descente partielle{/amber} : rien, ni chez Numénius ni chez Porphyre, ne dit que l'âme demeure là-haut alors même qu'elle est dans le corps. L'idée apparaît pour la première fois dans l'*Enseignement d'autorité*.

    {coral}D'où la conclusion, la plus plausible en l'état des sources : la non-descente partielle est une innovation gnostique, que Plotin a reprise au traité 6 et renouvelée à sa manière.{/coral}

    ! Plotin ne reprend pas les mots des gnostiques : il en prend la structure et la retourne, l'inclinaison devient un regard, l'élection devient la condition de toute âme.
