- id: ame7-l5
  title: "Le traité 6, premier manifeste antignostique"
  notes: |-
    **En affirmant que** {green}**toute âme**{/green} **garde quelque chose de là-haut, le traité 6 étend à tous les hommes le lien ininterrompu avec le divin que la gnose réservait aux élus : c'est** {coral}**l'argument auquel la gnose ne peut pas survivre**{/coral}**, puisqu'elle est avant tout une doctrine de l'élection.**

    **L'élection court-circuitée.** Le traité se conclut sur l'affirmation que {teal}« toute âme{/teal} possède quelque chose […] {teal}de ce qui est là-haut, en direction de l'Intellect »{/teal}, et que {teal}« {/teal}les âmes {teal}qui sont devenues partielles{/teal} […] possèdent, celles-là aussi, {teal}__ce qui est transcendant__ »{/teal}. Deux coups portés à la gnose :

    - {amber}La remontée est une possibilité de l'âme en tant qu'âme{/amber}, tout simplement : {red}nul besoin d'une révélation extérieure, d'un guide{/red} ; la démarche est personnelle.
    - {amber}Le sort d'aucune âme ne peut être séparé de celui des autres{/amber} (l'hylique du psychique, le psychique du pneumatique), s'il est vrai que **toutes les âmes n'en font qu'une**, comme le [[traite8|traité 8]] l'exposera et comme le traité 6 le suggère déjà (chap. 7 et 8). C'est le **second sens** gnostique de la consubstantialité, l'identité de substance de réalités de même origine, {green}élargi à toutes les âmes sans exception{/green}.

    {coral}Si une partie de notre âme à tous reste là-haut, toute la gnose, qui est avant tout une doctrine de l'élection, s'écroule.{/coral} Car si l'on peut dire que {teal}« {/teal}toute âme est {teal}__fille du père__ de là-bas »{/teal} ([[traite33|traité 33]], 16, 9), le message gnostique n'a plus sa place. Et Plotin sait ce que la croyance en l'élection fait aux hommes : {teal}« {/teal}Même l'homme qui était auparavant {teal}humble, mesuré et modeste{/teal}, {teal}__devient arrogant__{/teal} s'il s'entend dire : "{teal}tu es un enfant de dieu{/teal}, tandis que les autres que tu admirais ne le sont pas"{teal} »{/teal} ([[traite33|traité 33]], 9, 55-57).

    **La continuité contre la tragédie.** La procession du traité 6 prend aussi le contre-pied des récits discontinuistes des gnostiques : tout y est **tenu ensemble** pour toujours (6, 25-28), contre les {red}« redoutables péripéties tragiques qui se déroulent, croient les gnostiques, dans les sphères du monde »{/red} ([[traite33|traité 33]], 13, 7-8). La solidarité du sensible et de l'intelligible sape le désaveu gnostique du monde : {teal}« {/teal}Ainsi, {teal}__celui qui méprise le monde ne sait pas ce qu'il fait__{/teal}, ni jusqu'où son impudence le mène » (13, 1-2). Et le traité 6 associe déjà, comme le traité 33 (2, 1-18), **la non-descente de notre âme au maintien dans l'intelligible de l'âme du monde**.

    **Un grand cycle antignostique.**

    | Moment | Traités |
    | le premier manifeste | 6 |
    | la préparation | 27-29, 31-32 |
    | le sommet | 33 |
    | les échos | 34, 38, 47, 48, 51 |

    **Un mot refoulé.** {sky}Tardieu{/sky} s'étonnait que Plotin n'emploie jamais l'image gnostique de l'**étincelle** de l'âme ({blue}*spinthêr*{/blue}), qui eût commodément exprimé la procession de l'âme et son retour ; il l'expliquait par l'abus qu'en faisaient les gnostiques. {coral}Il en va de même de l'{blue}*homoousios*{/blue}{/coral} : il n'apparaît dans son plein sens qu'une fois, très tôt, **« sorte de lapsus calami »**, puis la non-descente prend le relais et l'étend à toutes les âmes, **comme si Plotin tenait à refouler son origine**. De même, Plotin évite le mot gnostique de la chute ({blue}*sphalma*{/blue}) : deux occurrences seulement, l'une pour rapporter les thèses gnostiques ([[traite33|traité 33]], 4, 3), l'autre très tardive (traité 52).

    ! Que la non-descente soit une réponse à la gnose n'empêche pas qu'elle serve d'autres fins (le bonheur, l'indépendance de l'âme) : Narbonne dit seulement que c'est là le cœur de la doctrine.
