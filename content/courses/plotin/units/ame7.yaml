- id: ame7-l3
  title: "« Contre l'opinion des autres » : qui sont les autres ?"
  notes: |-
    **Plotin introduit la non-descente comme une audace :** {teal}« s'il faut __oser__{/teal} dire {teal}__contre l'opinion des autres__{/teal} plus clairement ce que l'on pense{teal} »{/teal} **(**[[traite6|traité 6]]**, 8, 1-2). On croit d'ordinaire qu'il s'oppose aux autres platoniciens ;** {sky}Narbonne{/sky} **montre que** {coral}**ces platoniciens sont introuvables, et que les « autres » sont des gnostiques**{/coral}.

    **La lecture commune : les platoniciens.** La formule {blue}*para doxan tôn allôn*{/blue} (seule occurrence chez Plotin) a été comprise comme visant les autres platoniciens : {sky}Harder{/sky}, {sky}Szlezák{/sky}, {sky}Igal{/sky}, {sky}Baltes{/sky}, le commentaire italien de {sky}D'Ancona{/sky}, pour qui le verbe {blue}*tolmaô*{/blue} (« oser ») suppose que Plotin contredit l'opinion dominante de sa propre école.

    **Quatre objections de Narbonne.**

    - {amber}Quelle base pour supposer une opinion commune des platoniciens{/amber} derrière l'expression ?
    - {amber}Quel platonicien Plotin aurait-il reconnu comme une autorité{/amber}, devant qui s'excuser de sa témérité ?
    - {amber}Où le voit-on ailleurs{/amber}, quand il est original, s'expliquer de la sorte ?
    - {amber}Pourquoi s'excuser{/amber}, si les textes de Platon offrent de toute façon une assise solide ([[ame6|plante céleste, Glaucos]]) ?

    **Un dossier platonicien bien maigre.** {sky}Baltes{/sky} ne peut invoquer qu'un témoignage possiblement préplotinien, de {sky}Numénius{/sky} (fr. 34), transmis par {sky}Macrobe{/sky} : l'âme, descendant à travers les sphères, passe par les signes du Capricorne et du Cancer, les **« portes du soleil »**, et les âmes qui ont glissé de là ont quitté les régions supérieures. Le second témoin, {sky}Jamblique{/sky}, est **postérieur** à Plotin. {red}On a pris la défaveur de la thèse chez les commentateurs tardifs (sauf Théodore d'Asiné) pour une opinion platonicienne antérieure : un {blue}*hysteron proteron*{/blue}, l'après mis avant.{/red} Traduire par « l'opinion générale » ({sky}Bouillet{/sky}, {sky}MacKenna{/sky}) ne mène pas plus loin : aucun document n'atteste une telle vue.

    **Une thèse qui n'était pas nouvelle pour un platonicien.** {sky}Szlezák{/sky} l'a vu : la non-descente apparaît déjà au [[traite2|traité 2]] (10, 13-19 ; 13, 14), où Plotin accordait entre elles des vues platoniciennes **sans signaler aucune singularité**. Il ne pouvait donc pas avoir l'impression d'introduire au traité 6 une nouveauté absolue. {coral}L'audace s'explique par un autre contexte que le contexte platonicien : le plus vraisemblable est qu'il est gnostique.{/coral}

    **Des gnostiques, et des amis.** Plotin n'est pas entouré à Rome de « platoniciens » (c'est lui, le platonicien), mais de **gnostiques platonisants**, qui sont aussi ses **amis** : au [[traite33|traité 33]], il les range parmi ses {blue}*philoi*{/blue} (chap. 10), mot qui, selon {sky}Puech{/sky}, les inclut dans la confrérie quasi religieuse des platoniciens. Et Porphyre rapporte que Plotin leur avait opposé **« maintes réfutations dans ses cours »** (*Vie de Plotin*, 16). {coral}Il fallait de l'audace pour prendre à partie, chez des amis, ce qu'ils tenaient pour leur bien le plus précieux : leur appartenance exclusive au Plérôme.{/coral} {sky}D'Ancona{/sky} avait d'ailleurs envisagé, sans la retenir, une autre piste gnostique : la non-descente serait solidaire du rejet de l'**inclinaison** ({blue}*neusis*{/blue}) de l'Âme du monde.

    ! Il n'y a pas à choisir entre l'audace de contredire des amis platoniciens et celle d'affronter une doctrine étrangère : les étrangers sont ici en même temps des amis platonisants.
