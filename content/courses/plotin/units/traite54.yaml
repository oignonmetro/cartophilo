- id: traite54-l5
  title: "Repérage : le plan du traité 54"
  notes: |-
    **Le traité 54 compte trois chapitres : comment on possède le Bien (chap. 1), pourquoi toute chose le possède (chap. 2), et pourquoi la vie n'est un bien que grâce à la vertu et à la séparation du corps (chap. 3).**

    | Moment | Lieu | Ce qui s'y joue |
    | le bien de chaque chose est son activité parfaite | 1, 1-5 | vie conforme à la nature |
    | le bien pour une chose et le Bien absolu | 1, 5-7 | l'âme la meilleure |
    | deux manières de posséder le Bien | 1, 7-13 | s'assimiler à lui, diriger son activité vers lui |
    | le Bien, ce à quoi tout est suspendu | 1, 13-fin | au-delà de tout, le centre et le soleil |
    | tout ce qui est participe au Bien | 2, 1-6 | comme une image |
    | par l'Intellect, ce qui vit s'assimile au Bien | 2, 6-fin | vie et Intellect |
    | la vie est un bien grâce à la vertu | chap. 3 | séparation d'avec le corps |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! Le plan du traité 54 est le plus court des *Ennéades* : trois chapitres, pour un résumé de toute la doctrine de l'âme et du Bien.
  points:
  - id: traite54-l5-p1
    sentence: "Dans le traité 54 de Plotin, les deux manières de posséder le Bien (s'assimiler à lui, diriger son activité vers lui) se trouvent en ___."
    answer: "1, 7-13"
    alt: ["chap. 1, 7-13"]
  - id: traite54-l5-p2
    sentence: "Dans le traité 54 de Plotin, l'affirmation que tout ce qui est participe au Bien comme une image se trouve en ___."
    answer: "2, 1-6"
    alt: ["chap. 2, 1-6"]
  - id: traite54-l5-p3
    sentence: "Dans le traité 54 de Plotin, la vie comme un bien grâce à la vertu et à la séparation d'avec le corps occupe le ___."
    answer: "chap. 3"
    alt: ["3", "chapitre 3"]
