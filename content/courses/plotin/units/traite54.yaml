- id: traite54-l3
  title: "La vie, la mort et la séparation du corps"
  notes: |-
    **Toute vie est-elle un bien ?** (chap. 3) : non, « dans le mal, la vie est **boiteuse** ». Elle est comme l'œil pour qui ne voit pas bien : il n'exerce pas sa fonction propre (images tirées de Platon).

    **La mort est-elle un mal ?** Si la vie mêlée de mal est un bien, comment la mort n'est-elle pas un mal ? Plotin répond par une série d'arguments :

    | Argument | Idée |
    | un mal pour qui ? | pour celui qui n'est plus, il n'y a pas plus de mal que pour une **pierre** |
    | s'il y a une âme après la mort | il y a d'emblée un bien, d'autant meilleur que l'âme agit sans le corps |
    | elle devient une partie de l'âme totale | quel mal peut-il lui advenir là-bas ? |
    | l'âme qui reste pure | comme les dieux, elle ne peut connaître aucun mal |
    | l'âme qui ne reste pas pure | ce n'est pas la mort qui est un mal pour elle, mais la vie ; même s'il y a des châtiments dans l'**Hadès** |

    **Union ou dissociation ?** Si la vie est l'**union** de l'âme et du corps, et la mort leur **dissociation** (définition du *Phédon*), comment la mort ne serait-elle pas un mal ? Réponse : la vie est un bien non en tant qu'union, mais parce que, grâce à la **vertu**, elle écarte le mal.

    **La conclusion** : la vie dans un corps est **par elle-même un mal**, mais grâce à la vertu l'âme accède au Bien, « parce qu'elle ne vit pas de la vie du composé, mais qu'elle s'en est déjà désormais séparée ». Cette **séparation** est, dit Plotin, la philosophie même.

    ! Plotin ne méprise pas la vie : il dit que ce n'est pas l'union avec le corps qui la rend bonne, mais la vertu qui libère l'âme du composé.
