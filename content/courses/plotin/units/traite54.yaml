- id: traite54-l4
  title: "Un traité conclusif : sa place et son titre"
  notes: |-
    **Une bribe ?** La question liminaire du traité ne paraît pas commander tout son développement, et ses trois chapitres ont l'aspect d'un **reste détaché** d'un autre texte, au moment où Porphyre devait distinguer cinquante-quatre écrits. Les lecteurs des *Ennéades* connaissent ces artifices : le traité sur la participation divisé en deux (22 et 23), le grand essai sur l'âme en trois (27 à 29), les traités 2 et 4.

    **À quel texte le rattacher ?** Deux hypothèses : le traité 38 (VI, 7), 19-25, qui décrit longuement la remontée de l'âme vers le Bien ; ou, plus probablement, le **traité 53** (I, 1), que Porphyre aurait séparé de sa suite.

    | Traité | Ce qu'il dit |
    | 53 | ce que nous sommes : le « nous » entre le composé et l'Intellect |
    | 54 | nous pouvons être, par une conversion du regard, une âme intellective, une vie qui s'assimile au Bien |

    **La séparation, c'est la philosophie** : se séparer du composé est à la fois la condition et l'effet d'une vie intellective et bonne ; elle est accomplie quand l'âme contemple le principe ultime et le saisit en elle-même. La dernière phrase du traité 54 donnerait ainsi sa conclusion à l'enquête du traité 53.

    **Un titre incertain** : Porphyre donne deux titres au traité 54. Dans la liste chronologique (*Vie de Plotin*, 6), il l'appelle *Sur le bonheur*, titre qui ne correspond pas à son objet et qui paraît répéter celui du traité 46 ; dans la liste des *Ennéades*, il l'appelle *Sur le souverain bien et les autres biens*.

    ! Les traités 51 à 54, écrits en 269-270 en Campanie, sont les dernières œuvres de Plotin ; Porphyre, absent, n'en avait pas bonne opinion et les disait d'un auteur sur le déclin.
  points:
