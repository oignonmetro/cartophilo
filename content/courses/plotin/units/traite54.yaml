- id: traite54-l2
  title: "Toute chose possède le Bien, l'âme par l'Intellect"
  notes: |-
    **Comment les choses sont-elles tournées vers le Bien ?** (chap. 2) : les choses dépourvues d'âme sont tournées vers l'**âme**, et l'âme vers le Bien par l'intermédiaire de l'**Intellect**.

    **Toute chose possède quelque chose du Bien** (2, 1-6) : chacune est « une » d'une certaine manière, « est » d'une certaine manière, participe à une forme ; elle participe donc au Bien, mais à une **image** du Bien, car ce à quoi elle participe, ce sont des images de l'être et de l'Un. Pour Plotin, participer au Premier principe est le synonyme même d'exister.

    **L'âme, de plus près** (2, 6-fin) : la vie de l'âme première, qui suit l'Intellect, est plus proche de la vérité ; c'est par l'Intellect que l'âme est **conforme au Bien**. « L'âme peut posséder le Bien si elle tourne ses regards vers lui » : ce « lui » peut désigner le Bien ou l'Intellect, l'âme possédant le Bien médiatement, par l'Intellect.

    | Pour… | le bien est… |
    | ce qui vit | la vie |
    | ce qui a part à l'Intellect | l'Intellect |

    Ce qui possède à la fois la vie et l'Intellect tend **de deux manières** vers le Bien.

    **Une remontée qui ne s'arrête pas à l'Intellect** : devenir vertueux est une ascension de l'âme, de la faculté rationnelle à l'intellection, puis à l'union à l'Intellect, et, selon le traité 38 (VI, 7), jusqu'au Premier principe, « Un » ou « Bien ».

    ! Seules deux réalités véritables, l'Intellect et l'âme, s'assimilent au Bien ; les autres choses ne le possèdent que médiatement, en tournant leur activité vers ce dont elles sont issues.
