id: traite54
title: "Traité 54 (I, 7) : Sur le souverain bien et les autres biens"
subtitle: "Posséder le Bien, se séparer du corps"
icon: compass
color: sky
lessons:
- id: traite54-l1
  title: "Le Bien de chaque chose, le Bien absolu"
  notes: |-
    **Le dernier traité, un petit traité** : selon l'ordre chronologique de Porphyre, Plotin aurait achevé son œuvre avec ce traité en trois chapitres. C'est étonnant : il n'introduit aucun élément de doctrine nouveau ; c'est plutôt la conclusion d'un argument sur la manière dont l'âme peut **posséder le Bien** et se séparer du corps.

    **Le bien de chaque chose** (chap. 1, 1-5) : il n'est rien d'autre que l'**activité** d'une vie conforme à la nature. Plotin reprend la formule stoïcienne de la fin de la vie humaine (vivre « conformément à la nature »), en la corrigeant : pour l'âme, c'est son activité propre, contemplative, la meilleure.

    **Le bien et le Bien** (chap. 1, 5-7) : si l'âme exerce son activité la meilleure vers ce qu'il y a de meilleur, ce n'est pas seulement le bien **pour elle**, mais le **Bien absolu**. Plotin distingue ici, à la façon d'Aristote, les biens relatifs du Bien absolu.

    **Deux manières de posséder le Bien** (chap. 1, 7-13) :

    | Manière | Ce qu'elle fait |
    | s'assimiler au Bien | ressembler à lui, immédiatement (l'Intellect et l'âme) |
    | exercer son activité vers lui | se tourner vers ce dont on est issu, médiatement |

    **Le Bien, source immobile** (chap. 1, 13-fin) : le Bien ne tourne son regard vers rien, ne désire rien, et reste dans la **tranquillité**, « la source et le principe » de toutes les activités. Il n'est pas le Bien du fait de son activité ni de l'intellection : il est au-delà de la réalité, de l'activité, de l'Intellect. Toutes choses lui sont **suspendues**, et lui n'est suspendu à rien ; il est « ce que toutes choses désirent ».

    **Deux images** : un cercle dont tous les **rayons** sont tournés vers le **centre** ; le **soleil**, centre de la lumière qui lui est suspendue et ne peut être coupée de lui.

    ! Le Bien n'agit pas sur les choses : ce sont elles qui dirigent vers lui leur activité. C'est ce qui le distingue d'un moteur ou d'un démiurge.
