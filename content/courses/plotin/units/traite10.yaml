# t-5-1 de l'index.

id: traite10
title: "Traité 10 (V, 1) : Sur les trois hypostases qui ont rang de principes"
subtitle: "L'Un, l'Intellect, l'Âme, et en nous"
icon: compass
color: sky
lessons:
- id: traite10-l1
  title: "Trois hypostases : le projet du traité"
  notes: |-
    **Le traité 10 suit immédiatement le traité 9 (VI, 9), dont il poursuit l'examen** : *Sur le Bien ou l'Un*. Si l'Un est la réalité merveilleuse que décrit le traité 9, et que l'Âme en provient, pourquoi s'est-elle éloignée d'une telle source, et pourquoi demeure-t-elle dans le sensible ?

    **Plotin explique comment toute réalité, en se séparant de son géniteur, « fléchit »** et contribue à une dégradation progressive du réel : chaque réalité est produite par celle qui la précède et produit celle qui la suit. Il clarifie les relations de l'Un, de l'Intellect et de l'Âme, les trois réalités que le titre, choisi par **Porphyre**, appelle **« hypostases »**.

    | Partie | Chapitres | Objet |
    | l'Âme | 1-3 | sa nature, son activité, sa descente pour animer l'univers |
    | l'Intellect | 4-7 | la structure du monde intelligible et sa génération à partir de l'Un |
    | les philosophes antérieurs | 8-9 | des présocratiques à Platon et Aristote |
    | les trois réalités en nous | 10-12 | l'exhortation à fuir les « bruits sensibles » |

    **Dans l'ensemble que forment les traités 9 à 11, le traité 10 est le seul à proposer un exposé à la fois systématique et synthétique** de la doctrine des trois réalités ; d'où sa postérité.

    **Les Pères de l'Église l'ont lu à la lumière de la Trinité** : **Augustin** traduit presque littéralement une partie du chapitre 2 (*Confessions*, IX, 10, 25), **Eusèbe** en cite des extraits dans sa *Préparation évangélique* ; l'Un, l'Intellect et l'Âme y deviennent le Père, le Christ et le Saint-Esprit (Augustin, *La Cité de Dieu*, X, 23).

    ! Cette lecture chrétienne passe outre la causalité nécessaire de l'Un : le traité ne lui reconnaît ni projet, ni acte délibéré, ni souci de ses produits.
