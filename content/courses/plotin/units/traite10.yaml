- id: traite10-l2
  title: "L'audace et l'oubli : la dignité de l'âme"
  notes: |-
    **Le traité s'ouvre sur l'oubli des âmes** : « Mais alors qu'est-ce qui a fait que les âmes ont oublié le dieu qui est leur père […] ? » Ignorant leur principe et s'ignorant elles-mêmes, elles se sont élancées dans la réalité inférieure.

    **La réponse** (1, 3-5) : **« L'origine du mal pour elles, c'est bien l'audace, la génération, l'altérité première et le fait de vouloir s'appartenir à elles-mêmes. »** Cette chute volontaire vient de l'**audace** (`tólma`) de l'âme : dès sa naissance, elle use de son mouvement pour courir dans la direction opposée à son principe, jusqu'à oublier sa lignée.

    **Tombée dans le sensible**, elle admire les choses d'ici-bas et se croit inférieure à elles, se tenant pour « la moins estimable et la plus mortelle » des choses. Il lui faut **deux discours** (1, 22-35) : l'un qui montre le peu de valeur de ce qu'elle admire, l'autre qui lui rappelle son origine.

    **Le raisonnement du chapitre 2** : toute âme individuelle provient d'une **« grande âme »**, l'**âme du monde** du *Timée* (34a-40d). Elle produit et anime tous les vivants, le ciel, la terre, les astres, et leur donne un mouvement et un ordre parfaits, tout en restant en elle-même.

    - Elle remplit le monde **comme les rayons du soleil**, présente partout sans se fragmenter.
    - Elle **entoure** le corps de l'univers de l'extérieur, et lui donne l'image de l'unité.
    - Sans elle, tout corps serait inanimé et mort : **le monde sensible est rendu divin par l'âme.**

    L'âme individuelle est **« du même genre »** que l'âme du monde : **toute âme est plus digne d'honneur que tout ce qui est corporel.** C'est elle qu'il faut admirer, non les choses sensibles.

    ! L'audace n'est pas un accident qui frappe l'âme du dehors : c'est l'usage qu'elle fait de sa propre indépendance.
