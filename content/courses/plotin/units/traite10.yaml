- id: traite10-l7
  title: "L'homme intérieur : les bruits sensibles et les sons de là-bas"
  notes: |-
    **Les chapitres 10-12 reviennent à l'âme, pour lui montrer le chemin du retour : les trois réalités sont aussi « en nous ».** Même descendue dans un corps, l'âme individuelle en garde une image : c'est ce que Platon appelle **« l'homme intérieur »**.

    - **L'Âme** : chaque âme est une partie de l'Âme. Sa **faculté rationnelle** reste toujours dans l'intelligible, même quand le reste de l'âme descend (10, 10-21). Quand elle raisonne sans le corps, « on ne se tromperait pas en la posant dans le monde intelligible comme séparée du corps ». L'exhortation du *Phédon* (67c) à séparer l'âme du corps est une exhortation à la **pensée rationnelle pure**.
    - **L'Intellect** : si l'âme raisonne sur le Juste en soi ou le Beau en soi, c'est que leurs Formes existent avant elle dans l'Intellect, présent en elle (chap. 11).
    - **L'Un** : si l'Intellect est en elle, son principe aussi. L'âme est comme un **cercle** dont les rayons parviennent tous au centre, l'Un : elle est toujours en contact avec lui.

    **Pourquoi, « tout en possédant de si grandes choses », restons-nous inertes ?** (chap. 12) Parce que l'âme a plusieurs facultés : pour que l'âme tout entière soit consciente d'une chose, il faut qu'elle passe par la **sensation**. Il faut donc tourner la perception **vers l'intérieur**.

    **L'image finale** : comme celui qui attend une voix qu'il souhaite entendre fait abstraction des autres sons, **« il faut ici laisser de côté tous les bruits sensibles »** pour garder l'âme prête **« à entendre les sons de là-bas »** (12, 15-21).

    ! L'âme n'a pas à acquérir l'Intellect et l'Un : elle les possède déjà ; il lui manque seulement d'en prendre conscience.
