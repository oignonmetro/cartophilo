- id: traite10-l4
  title: "L'Intellect : penser et être, les genres premiers"
  notes: |-
    **L'Intellect contient toutes les formes intelligibles, archétypes du monde sensible** (chap. 4). Toujours immobile, il n'est ni dans un lieu ni dans le temps ; il n'éprouve aucun besoin et ne change pas : **il est toutes choses ensemble**, quand au niveau de l'Âme tout est dispersé et soumis au temps. Le traité 5 (V, 9), chap. 5-9, en avait proposé la description.

    **La nature de l'intelligible n'est que « pensée » et « être »** :

    - l'Intellect, en pensant les formes, leur donne l'être ;
    - les formes, objets de sa pensée, suscitent en lui la pensée.

    Ils se possèdent réciproquement pour l'éternité : l'Intellect est « ce qui pense », les formes « ce qui est pensé ». Mais cette unité est déjà une **dualité** : elle exige une cause ultérieure, absolument une.

    **Pour rendre compte de la pensée, Plotin pose cinq genres premiers** (4, 33-43), d'après le *Sophiste* (254b-255e) :

    | Genre | Pourquoi il le faut |
    | l'être | ce qui pense et ce qui est pensé sont |
    | l'identité | qu'ils restent identiques à eux-mêmes |
    | la différence | qu'on puisse les distinguer |
    | le repos | qu'ils restent immobiles, sans modification |
    | le mouvement | la pensée est un mouvement « cognitif » |

    S'y ajoutent les catégories **aristotéliciennes** du **nombre** et de la **quantité** (la multiplicité des intelligibles) et de la **qualité** (le propre de chaque chose). Cette analyse « dialectique » sera reprise sans modification de fond dans les traités 34 (VI, 6), 38 (VI, 7) et 43 (VI, 2).

    ! L'Intellect n'est pas un sujet qui contemplerait des objets extérieurs : pensée et être se donnent réciproquement l'existence.
