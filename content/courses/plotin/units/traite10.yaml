- id: traite10-l3
  title: "L'Âme, discours de l'Intellect : nóēsis et diánoia"
  notes: |-
    **L'Âme est une image de l'Intellect qui l'a engendrée** (chap. 3). Plotin reprend la distinction que les stoïciens, après Platon et Aristote, faisaient entre deux discours :

    | Discours | Grec | Correspond à |
    | « intérieur », prononcé dans l'âme | `lógos endiáthetos` | l'Intellect |
    | « prononcé », exprimé | `lógos prophorikós` | l'Âme, son image |

    **L'Âme est la raison (`lógos`) de l'Intellect** : l'activité de l'Intellect, la pensée pure, produit des effets au-dehors de lui par épanchement ; cette activité répandue subsiste comme une réalité indépendante, intellectuelle aussi, mais plus faible : l'Âme.

    | Intellect | Âme |
    | `nóēsis` : pensée intuitive, qui saisit immédiatement son objet | `diánoia` : pensée discursive, par discours et raisonnements |
    | possède en lui ses objets, les Formes | ne les trouve qu'en se tournant vers l'Intellect |

    La distinction vient de Platon, la **« théorie de la ligne »** (*République*, VI). L'Âme est comme une **matière intelligible**, dont l'Intellect est la forme (3, 20-25). Attachée à l'Intellect, elle est en acte et plus divine ; détournée, elle devient la proie des passions.

    **Pourquoi descend-elle ? Par faute ou par nécessité ?** Le traité 6 (IV, 8), chap. 4, avait répondu : les deux aspects sont **complémentaires**.

    - Du point de vue **« subjectif »** de l'âme, le choix est volontaire, et ne peut être imputé à la divinité : Plotin préserve la liberté.
    - Du point de vue **« objectif »** du réel, la descente garantit l'ordre et la vie du monde sensible.

    La descente n'est qu'un **mal relatif** : l'âme en tire l'expérience pour remonter vers un intelligible qu'elle n'a jamais entièrement quitté.

    ! La faute de l'âme est à la fois libre et « destinée » : ce n'est pas une contradiction, mais deux points de vue sur la même descente.
