- id: traite10-l6
  title: "Les prédécesseurs : Platon, seul vrai précurseur"
  notes: |-
    **Les chapitres 8-9 examinent les philosophes anciens** : dans quelle mesure se sont-ils approchés de la « vérité » des trois principes ?

    | Philosophe | Ce qu'il a vu | Ce qui lui manque |
    | Anaxagore, Héraclite, Empédocle | la perfection de l'intelligible, distinct du sensible | distinguer les intelligibles du premier principe |
    | Parménide | l'identité de la pensée et de l'être | distinguer cette unité multiple de l'Un au sens propre |
    | Aristote | un premier moteur, intellect qui se pense soi-même (*Métaphysique*, Λ, 7-8) | ce qui se pense n'est ni un ni premier ; il multiplie les moteurs |
    | Platon et les pythagoriciens | la structure hiérarchique du réel | rien : ils ont saisi la nature suprême de l'Un |

    **Chez Platon, Plotin trouve les trois réalités** :

    - dans les **Lettres II et VI**, tenues par tous les Anciens pour authentiques : le **« roi du tout »**, « père de la cause », l'Un ; la **« cause »**, l'Intellect démiurgique du *Timée* ; l'**âme** qu'il produit ;
    - plus encore dans le *Parménide*, tel que le traité 9 l'a lu : l'Un au sens propre (137c-142a), l'« un-plusieurs » de l'Intellect, l'« un et plusieurs » de l'Âme (155e).

    **Plotin se veut interprète, non inventeur** : ses thèses ne sont que des interprétations des doctrines antérieures, avant tout de Platon (8, 10-14). Puisque les dialogues exposent déjà la vérité, la philosophie consiste à les rendre explicites.

    ! Parménide l'Éléate n'est pas le « Parménide de Platon » : le premier confond l'être et l'Un, le second, le dialogue, distingue les trois hypostases.
  points:
