- id: traite10-l8
  title: "Repérage : le plan du traité 10"
  notes: |-
    **Le traité 10 va de l'Âme (chap. 1-3) à l'Intellect et à l'Un (chap. 4-7), passe par les prédécesseurs (chap. 8-9), puis revient à l'âme individuelle (chap. 10-12).**

    | Moment | Lieu | Ce qui s'y joue |
    | l'oubli de l'âme | chap. 1 | l'audace ; les deux discours |
    | l'âme du monde | chap. 2 | elle anime et entoure l'univers |
    | l'Âme, image de l'Intellect | chap. 3 | discours prononcé et discours intérieur |
    | penser et être | chap. 4 | les genres premiers du *Sophiste* |
    | qui engendre l'Intellect | chap. 5 | l'Un et la dyade indéterminée |
    | comment l'Un engendre | chap. 6 | le sanctuaire ; le soleil et la lumière |
    | l'Intellect, image de l'Un | chap. 7 | Kronos ; les choses divines s'arrêtent à l'Âme |
    | Platon et Parménide | chap. 8 | le *Parménide* et les trois hypostases |
    | les autres prédécesseurs | chap. 9 | Anaxagore, Héraclite, Empédocle, Aristote |
    | les trois réalités en nous | chap. 10 | l'homme intérieur |
    | l'Intellect et l'Un en l'âme | chap. 11 | le cercle et le centre |
    | pourquoi restons-nous inertes | chap. 12 | les bruits sensibles, les sons de là-bas |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! La descente du traité suit celle des hypostases, mais en sens inverse au début : il part de l'âme pour remonter à l'Intellect et à l'Un.
