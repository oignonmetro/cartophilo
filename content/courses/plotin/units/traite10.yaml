- id: traite10-l5
  title: "La génération de l'Intellect : surabondance et retour"
  notes: |-
    **L'Intellect, multiple, ne peut être premier** : toute multiplicité vient d'un principe absolument simple (traités 7 et 9). **L'Un engendre la dyade indéterminée** ; indéterminé, l'Intellect se tourne vers l'Un et le voit ; cette vision, qui est son intellection, le **détermine**, et lui fait en même temps prendre conscience de son altérité (chap. 5).

    **Pourquoi l'Un n'est-il pas resté en lui-même ?** (chap. 6)

    - Il n'a ni **choisi** ni **voulu** produire : rien n'existe hors de lui vers quoi se mouvoir, et il n'éprouve aucun besoin.
    - Il reste immobile, **comme une divinité dans un sanctuaire** (6, 8-17).
    - Ce qu'il produit est dans l'éternité, non dans le temps.
    - Il produit **sans être diminué, comme le soleil produit la lumière** : un « rayonnement » qui devient une réalité autonome, l'Intellect. Le traité 11 (V, 2), 1 parlera de **« surabondance »**.
    - Tout ce qui parvient à **maturité** engendre ; l'Un, toujours parfait, engendre toujours.

    **Le retour (`epistrophḗ`) est le concept-clé** : l'engendré se tourne spontanément vers son principe, et c'est en le regardant et en se distinguant de lui qu'il se détermine. Il lui ressemble, l'aime, en a besoin ; mais **la ressemblance n'est pas réciproque** (7, 1-5). D'où une conception **« asymétrique »** du réel : tout « s'incline » par nécessité, tout « remonte » par désir.

    **Kronos** (7, 23-36) : l'Intellect, « rendu parfait » par la puissance de l'Un, garde en lui les intelligibles comme Kronos, le dieu « éternellement rassasié », avale ses enfants pour ne pas les livrer à **Rhéa**, figure du devenir de la matière. Puis, selon un principe d'Aristote (*De l'âme*, II, 4), l'Intellect parfait engendre à son tour : **l'Âme**, qui tourne autour de lui. **Les « choses divines » s'arrêtent à l'Âme** ; après, ce ne sont que la matière et les corps.

    ! L'Un n'engendre pas parce qu'il le veut : la production découle d'une surabondance dont il n'a même pas conscience.
