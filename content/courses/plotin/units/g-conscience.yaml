# Entrée du glossaire de Plotin (skill glossaire) : notion, écrite le 2026-11-02,
# citations vérifiées sur la GF (I, 4, 10 ; III, 8, 4 ; IV, 3, 30 ; IV, 4, 13 ;
# V, 1, 12 ; V, 3, 10, 12 et 13 ; V, 4, 2 ; VI, 7, 41).

id: g-conscience
title: Conscience (`sunaisthêsis`)
icon: book
color: coral
lessons:
- id: g-conscience-l1
  title: Conscience
  notes: |-
    Chez Plotin, la {violet}**conscience**{/violet} (*sunaisthêsis*, que la GF traduit surtout par « perception de soi ») est [def]. Elle n'est pas {pink}la pensée elle-même, ni la condition de toute vie de l'âme{/pink}.

    __**La conscience n'est pas la pensée : on pense toujours sans toujours en avoir conscience.**__ L'âme vit toujours, et {coral}une vie est une activité qui ne s'arrête pas{/coral} : « chacune des parties de l'âme, puisqu'elle vit toujours, __exerce toujours l'activité qui lui est propre__ ; mais on ne s'en rend compte que quand il y a transmission et perception » ([[traite10|traité 10]], chap. 12). *Donc* l'activité est complète avant qu'on la perçoive, et la perception s'y ajoute ou non. Plotin le dit de la {violet}[[g-noesis|pensée]]{/violet} : « Autre chose est l'intellection, autre chose la perception de l'intellection ; nous faisons toujours usage de notre intellect, mais __nous n'en n'avons pas toujours une perception__ » ([[traite27|traité 27]], chap. 30). Ce qui est vrai de la partie haute de notre âme tient à l'{violet}[[g-ame-non-descendue|âme non descendue]]{/violet}, qui demeure dans l'intelligible sans que nous le sachions.

    __**La conscience naît du reflet de l'activité de l'âme dans la faculté de représentation, comme dans un miroir.**__ L'intellection, par elle-même, {coral}ne comporte aucune image{/coral} : quand le reflet manque, c'est « sans image que la raison discursive et l'intellect intelligent et c'est __sans représentation que l'intellection se produit__ » ([[traite46|traité 46]], chap. 10). Elle n'est donc perçue que si quelque chose la renvoie. Ce quelque chose est la {violet}[[g-phantasia|faculté de représentation]]{/violet} : la perception a lieu « lorsque l'activité de la vie de l'âme est pour ainsi dire __réfléchie, comme dans un miroir__, sur une surface lisse et brillante qui reste immobile » (*ibid*.), et c'est « seulement quand l'âme se trouve dans la faculté qui produit les représentations qu'il peut y en avoir perception pour nous » (traité 27, chap. 30). Ici, l'activité est l'objet qu'on regarde, la faculté de représentation est le miroir, l'image est la perception, et le calme du corps est le poli de la surface. Si l'harmonie du corps est troublée, le miroir est brisé : l'activité continue, mais sans reflet, donc sans conscience.

    __**L'activité la plus haute n'a pas besoin de conscience, que celle-ci risque même d'obscurcir.**__ Le reflet est un second terme, ajouté à l'activité, qu'il double : plus l'activité est pure, moins elle en a besoin. Plotin en donne des exemples : « il en est de nombreuses et de belles, aussi bien des contemplations que des actions, qui ne sont pas accompagnées de conscience », et il n'est pas nécessaire que « celui qui est en train de lire ait conscience qu'il est en train de lire, surtout quand il lit avec attention » (traité 46, chap. 10). *D'où* le paradoxe : « la conscience risque de rendre plus obscures les activités mêmes sur lesquelles elle porte alors que, lorsque ces activités ne sont pas accompagnées de conscience, __elles sont pures, davantage actives et vivent davantage__ » (*ibid*.). *Voilà pourquoi* la vie du sage est plus intense : elle « ne s'est pas répandue dans la sensation, mais reste ramassée en elle-même, dans l'identité » (*ibid*.).

    __**La conscience suppose une multiplicité : elle appartient à l'Intellect et à l'âme, non à l'Un.**__ Penser demande deux termes : « il faut donc que ce qui pense, tant qu'il pense, soit __dans la dualité__ » ([[traite49|traité 49]], chap. 10). *Or* la conscience en est une forme : « comme son nom l'indique, la conscience est __perception d'une multiplicité__ » (chap. 13), c'est-à-dire d'un ensemble qui se ramasse sur lui-même. L'{violet}[[g-intellect|Intellect]]{/violet}, multiple, la possède, et il faut que « l'Intellect accompagne la pensée et qu'il prenne toujours conscience de soi », parce que lui et son objet ne font qu'un (traité 38, chap. 41). L'{violet}[[g-un|Un]]{/violet}, au contraire, est avant toute multiplicité (traité 49, chap. 12) : « S'il était seulement un, il se suffirait à lui-même, et il n'aurait pas besoin de prendre conscience de soi » ; « le Bien n'a donc pas conscience de lui-même, car il n'en a pas besoin » ([[traite38|traité 38]], chap. 41). *Objection* : l'Un serait alors dépourvu, « il n'a donc pas perception de soi, il n'a pas conscience de soi et il ne se connaît pas lui-même ». *Réponse* : en parlant ainsi, dit Plotin, « nous allons dans la direction contraire », car « nous le rendons en effet multiple en le faisant connaissable et connaissance » ; la pensée est « une sorte de conscience de l'ensemble », dont les parties se rassemblent dans l'unité, et ce qui est « totalement simple » n'a pas de parties à rassembler (traité 49, chap. 13). Un seul passage fait exception, que la GF signale : le [[traite7|traité 7]] prête à l'intelligible « une sorte de perception de lui-même » (chap. 2), mais Plotin ne reprend plus ces expressions, que la GF juge dangereuses pour l'identité à soi du Bien.

    __**La nature n'a ni perception ni conscience au sens de la représentation : à la mesure d'un dormeur.**__ La {violet}[[g-phusis|nature]]{/violet} est la dernière raison de l'âme : comme dans une épaisse couche de cire, la marque évidente sur une face n'a laissé qu'une faible trace sur l'autre. *C'est pourquoi* elle « ne connaît pas, mais [...] se contente de produire » et elle est « dépourvue de la faculté de représentation » : « la nature n'a ni perception ni conscience de rien, tandis que la faculté de représentation a conscience de ce qui vient de l'extérieur » ([[traite28|traité 28]], chap. 13). L'univers, lui, reçoit « une conscience de lui-même, analogue à celle que nous prenons de nous-mêmes, mais non la sensation qui porte sur un objet sans cesse différent » (traité 28, chap. 24) : cette conscience est celle d'un ensemble refermé sur lui-même, non celle de la nature. Celle-ci contemple pourtant (voir [[g-theoria|contemplation]]), « dans son repos et, pour ainsi dire, dans la perception d'elle-même », et si l'on veut lui attribuer « une certaine compréhension ou sensation », c'est celle d'un homme « profondément endormi par rapport à un homme éveillé » ([[traite30|traité 30]], chap. 4). Sa contemplation, « silencieuse mais [...] assez obscure », est trop faible pour se refléter (voir [[g-degres-de-vie|degrés de vie]]).

    ! Le mot « conscience » ne rend pas un terme grec unique. La GF traduit *sunaisthêsis* par « perception de soi » (traité 49, chap. 13 : « comme son nom l'indique ») ; elle réserve « attention » à *parakolouthêsis*, l'accompagnement qui s'attache à chaque opération, et « saisie » à *antilêpsis*. Plotin n'en tire aucune « conscience de soi » à la manière moderne : celle-ci ne fait ni l'unité de l'âme ni la pensée.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 7, chap. 2 | l'exception unique : une sorte de perception de lui-même |
    | traité 10, chap. 12 | l'âme exerce toujours ses activités, on ne s'en rend compte que par la perception |
    | traité 27, chap. 30 | la perception de l'intellection n'est pas l'intellection ; la représentation, miroir |
    | traité 28, chap. 13 | la nature n'a ni perception ni conscience |
    | traité 30, chap. 4 | la nature n'a que la perception d'un dormeur |
    | traité 38, chap. 41 | le Bien n'a pas conscience de lui-même |
    | traité 46, chap. 10 | la perception est un reflet ; la conscience peut obscurcir l'activité |
    | traité 49, chap. 13 | la conscience est perception d'une multiplicité |

    **Voir aussi** : [[g-phantasia|Représentation]] · [[g-noesis|Pensée]] · [[g-theoria|Contemplation]] · [[g-phusis|Nature]] · [[g-intellect|Intellect]] · [[g-un|Un]] · [[g-ame-non-descendue|Âme non descendue]] · [[g-degres-de-vie|Degrés de vie]] · [[g-aisthesis|Sensation]]
