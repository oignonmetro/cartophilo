id: g-conscience
title: Conscience
subtitle: Le foyer mobile de l'attention, entre intelligible et sensible
icon: magnify
color: coral
lessons:
- id: g-conscience-l1
  title: La conscience comme foyer mobile
  notes: |-
    Poser la question de ce qui correspond, chez Plotin, à la conscience revient à se demander où se situe, dans l'âme, le foyer de ce que Plotin désigne par le pronom français « nous » (en grec `hēmeis`), que le commentateur Kalligas traduit à son tour par le « je ». Un contresens fréquent consiste à situer ce foyer à un endroit unique et fixe, comme s'il coïncidait avec l'âme prise dans son ensemble, ou pire, avec l'intellection parfaite de l'Intellect.

    - Le foyer de la conscience réside, selon Kalligas, dans une faculté précise, la **`phantasia`** (la faculté représentative), qui reçoit et organise les représentations venues du haut, l'intelligible, comme du bas, le corporel : ni au sommet de l'âme, là où elle contemple sans relâche l'Intellect, ni au niveau le plus bas, celui des affections purement corporelles, mais dans cette instance __intermédiaire__.
    - Ce foyer conscient n'est pas figé dans la phantasia : il peut se réorienter, tantôt vers les entités supérieures du domaine intelligible, tantôt vers les expériences corporelles. C'est ce déplacement d'attention possible qui vaut à Plotin de qualifier l'âme d'« amphibie » : à la manière d'un animal capable de vivre aussi bien sur terre que dans l'eau, l'âme humaine peut vivre tantôt dans l'ordre intelligible, tantôt dans l'ordre sensible, sans jamais cesser d'appartenir aux deux.
    - Toute l'activité psychique de l'âme ne se reflète pas nécessairement dans cette conscience mobile : des appréhensions **inconscientes**, venues du domaine intelligible comme du domaine sensible, influencent l'âme et déterminent son activité sans jamais devenir pleinement perçues.
    - L'âme non descendue continue donc, indépendamment de ce que son foyer conscient perçoit ou non, à contempler l'Intellect et à gouverner le corps depuis sa position supérieure : ce travail continu ne remonte à la conscience que de façon partielle, selon l'orientation de la `phantasia` à un instant donné.

    ! Le fait que l'âme contemple sans cesse l'Intellect à son niveau le plus élevé ne garantit donc pas que la conscience en ait connaissance : l'ascension philosophique qui mène l'âme vers le Bien est un effort réel de réorientation du foyer représentatif, non une simple prise de conscience immédiate d'un donné déjà là.
  points:
  - id: g-conscience-l1-1
    sentence: Plotin désigne le foyer de la conscience par le pronom français « nous », dont le terme
      grec original, translittéré, est ___, et que le commentateur Kalligas traduit à son tour par le
      « je ».
    answer: hēmeis
  - id: g-conscience-l1-2
    sentence: Selon Kalligas, le foyer de la conscience chez Plotin réside dans une faculté précise, qui
      reçoit et organise les représentations venues du haut comme du bas, la ___ (la faculté représentative).
    answer: phantasia
  - id: g-conscience-l1-3
    sentence: Le foyer conscient ne réside, selon Kalligas, ni au sommet de l'âme, là où elle contemple
      sans relâche l'Intellect en demeurant « non descendue », ni au niveau le plus bas, celui des affections
      purement corporelles, mais dans cette instance ___ qui reçoit et organise les représentations.
    answer: intermédiaire
  - id: g-conscience-l1-4
    sentence: C'est la faculté qu'a l'âme de réorienter son foyer conscient tantôt vers le haut, tantôt
      vers le bas, qui vaut à Plotin de la qualifier d'« ___ », à la manière d'un animal capable de vivre
      aussi bien sur terre que dans l'eau.
    answer: amphibie
  - id: g-conscience-l1-5
    sentence: Selon Kalligas, des appréhensions ___, venues du domaine intelligible comme du domaine sensible,
      influencent l'âme et déterminent son activité sans jamais devenir pleinement perçues par le foyer
      conscient.
    answer: inconscientes
  - id: g-conscience-l1-6
    sentence: Que l'âme non descendue contemple sans cesse l'Intellect à son niveau le plus élevé ne garantit
      pas que la ___, elle, en ait connaissance, ce travail continu ne lui remonte que selon l'orientation
      de la phantasia à un instant donné.
    answer: conscience
  - id: g-conscience-l1-7
    sentence: L'ascension philosophique qui mène l'âme, chez Plotin, à se détourner du corporel pour se
      tourner vers le Bien, constitue un effort réel de réorientation du foyer représentatif, non une
      simple prise de conscience ___ d'un donné déjà là.
    answer: immédiate
