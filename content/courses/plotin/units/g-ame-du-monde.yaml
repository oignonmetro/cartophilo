  points:
  - id: g-ame-du-monde-l1-q1
    sentence: "L'âme du monde, que Plotin appelle aussi âme de l'univers, se dit en grec translittéré ___."
    answer: psuchê tou pantos
    alt: ["psuche tou pantos", "hê tou pantos psuchê"]
  - id: g-ame-du-monde-l1-q2
    sentence: "« Cette seule et même chose reste en elle-même sans tomber dans un corps, puisque de cette chose unique viennent toutes les âmes, celle du ___ et les autres » (traité 27, chap. 4)."
    answer: monde
    alt: []
  - id: g-ame-du-monde-l1-q3
    sentence: "L'âme du monde n'est pas la mère de nos âmes : elle est « pour ainsi dire leur ___ » (traité 27, chap. 6)."
    answer: sœur
    alt: ["soeur"]
  - id: g-ame-du-monde-l1-q4
    sentence: "« L'Âme n'est pas dans le monde : c'est le monde qui est ___ » (traité 32, chap. 9)."
    answer: dans l'Âme
    alt: ["dans l'âme", "dans l'ame"]
  - id: g-ame-du-monde-l1-q5
    sentence: "Le monde « a une âme qu'il ne possède pas, mais qui lui est présente ; il est ___ sans dominer, il est possédé sans posséder » (traité 27, chap. 9)."
    answer: dominé
    alt: ["domine"]
  - id: g-ame-du-monde-l1-q6
    sentence: "La vie du monde « peut être comparée à un ___ jeté dans l'eau et qui est incapable de retenir l'eau dans laquelle il est plongé » (traité 27, chap. 9)."
    answer: filet
    alt: []
  - id: g-ame-du-monde-l1-q7
    sentence: "« L'âme est si grande, et cela parce qu'elle est dépourvue de ___, qu'elle renferme le corps dans sa totalité en un même lieu » (traité 27, chap. 9)."
    answer: grandeur
    alt: []
  - id: g-ame-du-monde-l1-q8
    sentence: "Le corps du monde, dont il n'est « rien qui en sorte et rien qui y entre », « n'a besoin que d'une sorte de commandement ___ » (traité 6, chap. 2)."
    answer: bref
    alt: []
  - id: g-ame-du-monde-l1-q9
    sentence: "Si chaque vivant avait, comme l'univers, « un corps parfait, complet et inaccessible aux affections », l'âme lui « donnerait la vie tout en demeurant en sa totalité en ___ » (traité 27, chap. 17)."
    answer: haut
    alt: []
  - id: g-ame-du-monde-l1-q10
    sentence: "Faible, s'écoulant et frappé du dehors, le corps particulier « commence par pousser un ___ » qui appelle l'âme (traité 22, chap. 15)."
    answer: cri
    alt: []
  - id: g-ame-du-monde-l1-q11
    sentence: "L'âme du monde gouverne sans se souvenir, car « ce n'est qu'aux âmes qui changent de place et d'état qu'appartient la ___ » (traité 28, chap. 6)."
    answer: mémoire
    alt: ["memoire"]
  - id: g-ame-du-monde-l1-q12
    sentence: "« Autant sont variées les choses qui naissent, autant celui qui les fabrique reste ___ » (traité 28, chap. 11)."
    answer: inchangé
    alt: ["inchange"]
  - id: g-ame-du-monde-l1-q13
    sentence: "L'âme meut le ciel « ne conduisant pas le feu en ligne droite mais en ___ » (traité 14, chap. 1)."
    answer: cercle
    alt: []
  - id: g-ame-du-monde-l1-q14
    sentence: "« À aucun moment le monde ne s'est trouvé dépourvu d'___, à aucun moment son corps n'a existé en l'absence d'une âme » (traité 27, chap. 9)."
    answer: âme
    alt: ["ame"]
  - id: g-ame-du-monde-l1-q15
    sentence: "Un corps se disperse, « surtout lorsque l'âme, qui les ___, n'est plus présente dans leur masse » (traité 2, chap. 1)."
    answer: rassemble
    alt: []
  - id: g-ame-du-monde-l1-q16
    sentence: "Contre le souffle des stoïciens : « quel ordre pourrait-il y avoir dans un ___ qui a besoin de l'ordre issu de l'âme ? » (traité 2, chap. 3)."
    answer: souffle
    alt: []
