id: g-ame-du-monde
title: Âme du monde (`psuchê tou pantos`)
icon: book
color: coral
lessons:
- id: g-ame-du-monde-l1
  title: Âme du monde
  notes: |-
    Chez Plotin, l'{violet}**âme du monde**{/violet} ({blue}*psuchê tou pantos*{/blue}) est [def]. Elle n'est {pink}ni l'Âme hypostase elle-même, ni une âme dont les nôtres seraient des parties{/pink}.

    __**Ni l'Âme hypostase ni une quatrième hypostase : une âme née de l'âme totale, sœur des nôtres.**__ Si toutes les âmes sont une, comment la même âme peut-elle être à la fois dans un corps et hors d'un corps ? Pour l'Intellect, la question ne se pose pas ; mais pour l'âme, « la thèse qui veut que toutes les âmes soient une seule et même chose __comporte beaucoup de difficultés__ » ([[traite27|traité 27]], chap. 4). Plotin n'en sort qu'en posant {amber}une âme qui ne soit l'âme d'aucun corps{/amber} : « cette seule et même chose reste en elle-même sans tomber dans un corps, puisque de cette chose unique __viennent toutes les âmes, celle du monde et les autres__ » (*ibid*.). Cette âme-là est l'{violet}[[g-ame|Âme]]{/violet} hypostase, ou âme totale. **L'âme du monde n'est donc pas elle, mais l'une des âmes qui en viennent**, au même titre que les nôtres : « de même espèce » (chap. 6), elle est « __pour ainsi dire leur sœur__ » (*ibid*.), {pink}non leur mère{/pink}. Ce n'est pas non plus une quatrième hypostase, car rien de nouveau n'est posé : c'est une âme parmi les âmes. Toutes restent une, {yellow}comme la lumière qui, « même si elle est déjà partagée entre des masses différentes au niveau de la terre, n'est pourtant pas divisée »{/yellow} (chap. 4).

    __**Le monde est dans l'âme, non l'âme dans le monde.**__ On se figure l'âme {pink}logée dans le monde comme dans un récipient{/pink}. Or {amber}l'âme est incorporelle : elle n'a pas de grandeur, donc pas de lieu{/amber}. C'est le corps qui est en elle : « L'Âme n'est pas dans le monde : __c'est le monde qui est dans l'Âme__. Car le corps n'est pas un lieu pour l'Âme » ([[traite32|traité 32]], chap. 9). D'où le rapport inversé que décrit le [[traite27|traité 27]] : le monde « a une âme qu'il ne possède pas, mais qui lui est présente ; __il est dominé sans dominer__, il est possédé sans posséder. Car il se trouve dans une âme qui le soutient » (chap. 9). {yellow}C'est « une vie qui peut être comparée à un filet jeté dans l'eau et qui est incapable de retenir l'eau dans laquelle il est plongé »{/yellow} : la mer, « qui s'étendait là avant lui », est l'âme ; le filet, le corps du monde, baigné de toutes parts par une vie qu'il ne retient pas. Et l'âme l'enveloppe tout entier, car « l'âme est si grande, et cela __parce qu'elle est dépourvue de grandeur__, qu'elle renferme le corps dans sa totalité en un même lieu » (*ibid*.).

    __**Elle gouverne sans descendre ni peiner, parce que son corps est parfait.**__ Nos âmes sont de même espèce, et pourtant elles descendent : {coral}la différence ne vient donc pas de l'âme, mais du corps qu'elle gouverne{/coral}. Celui du monde n'a rien hors de lui : il n'est « rien qui en sorte et rien qui y entre » ([[traite6|traité 6]], chap. 2). Il est donc « parfait », « autosuffisant et autarcique », et « n'a besoin que d'__une sorte de commandement bref__, et l'âme de l'univers est toujours telle qu'elle veut naturellement être, sans éprouver de désir ou être affectée » (*ibid*.). {red}Un corps particulier{/red}, au contraire, est faible, s'écoule et reçoit des coups du dehors ; il « commence par __pousser un cri__ » ([[traite22|traité 22]], chap. 15), et l'âme qui s'en soucie s'y incline : les âmes qui descendent sont « possédées qu'elles sont par leur sollicitude pour la nature ». Mais « si chaque vivant était comme l'univers qui a un corps parfait, complet et inaccessible aux affections, alors l'âme qu'on dit lui être présente __ne se trouverait pas en lui__, et lui donnerait la vie tout en demeurant en sa totalité en haut » ([[traite27|traité 27]], chap. 17). **Descendre n'est pas se déplacer : c'est être pris par le souci d'un corps qui appelle.** C'est pourquoi l'âme du monde « n'a pas quitté l'âme totale », et elle « contemple l'Intellect dans sa totalité, tandis que les autres contemplent surtout __les intellects partiels__ qui sont les leurs » (chap. 6).

    | Âme | Son corps | Descend-elle ? |
    | l'âme totale | aucun | elle ne tombe dans aucun corps |
    | l'âme du monde | le corps du monde, qu'elle garde autour d'elle | non, pas même par sa partie inférieure |
    | nos âmes | un corps particulier, fragile | oui, par souci de ce corps, mais non tout entières |

    __**Elle gouverne en contemplant, sans calcul ni mémoire, et sa dernière puissance est la nature.**__ On croirait qu'un ordre aussi vaste demande {pink}un architecte qui calcule et se souvient{/pink}. Mais calculer, c'est chercher ce qu'on n'a pas, et se souvenir, c'est avoir changé : « ce n'est qu'aux âmes qui changent de place et d'état __qu'appartient la mémoire__ » ([[traite28|traité 28]], chap. 6). Or au principe qui ordonne le monde « il faut absolument soustraire l'avant et l'après, afin de lui donner __une vie unique, immuable et intemporelle__ » (chap. 10). Il ne fait donc « usage ni de calcul ni de mémoire, car ce sont là des choses qui viennent de l'extérieur » (chap. 12). {green}Il produit en restant ce qu'il est{/green} : « autant sont variées les choses qui naissent, autant celui qui les fabrique __reste inchangé__ » (chap. 11). Le ciel même tourne ainsi : l'âme, présente partout, « entraîne toujours le feu vers elle », « ne conduisant pas le feu en ligne droite __mais en cercle__ » ([[traite14|traité 14]], chap. 1). Au plus bas de cette âme, enfin, se tient la {violet}[[g-phusis|nature]]{/violet}, car « la nature est une image de la réflexion et puisque c'est ce qu'il y a de plus bas en l'âme, elle dispose aussi de __la raison la plus basse__ » ([[traite28|traité 28]], chap. 13) : elle « ne connaît pas », elle produit (voir [[g-theoria|contemplation]]).

    __**Sans elle le monde périrait, et il n'a jamais été sans elle.**__ Un corps, par lui-même, ne tient pas ensemble : la sensation témoigne « qu'il se divise et se disperse », « surtout lorsque l'âme, __qui les rassemble__, n'est plus présente dans leur masse » ([[traite2|traité 2]], chap. 1). Sans l'âme, « toutes les autres choses périraient et ne pourraient plus revenir à l'être après qu'aurait été détruit __ce qui sauvegarde toutes choses__ » (chap. 9). Mais cette animation n'a pas commencé : « à aucun moment le monde ne s'est trouvé dépourvu d'âme, à aucun moment son corps __n'a existé en l'absence d'une âme__ » ([[traite27|traité 27]], chap. 9) ; « entrée » et « animation » ne se disent que « dans un but d'enseignement et de clarté » (*ibid*.). C'est ainsi qu'il faut lire le récit du [[traite10|traité 10]] : l'âme doit supposer le ciel immobile, puis « qu'elle imagine l'âme venue en lui de l'extérieur » ; {yellow}comme les rayons du soleil dorent un nuage obscur{/yellow}, « l'âme, pénétrant dans le corps du ciel, __lui a donné la vie, l'immortalité__, et l'a éveillé de son sommeil » (chap. 2). Le récit sépare par la pensée ce qui n'a jamais été séparé (voir [[g-atemporel|atemporel]]) : **l'éveil est permanent**, car le corps ne garde pas la vie qu'il reçoit.

    ! L'âme du monde n'est pas {pink}un souffle répandu dans le monde{/pink}, comme le {blue}*pneuma*{/blue} des stoïciens : « quel ordre pourrait-il y avoir dans un souffle __qui a besoin de l'ordre issu de l'âme__ ? Et quelle raison ou quel intellect ? » ([[traite2|traité 2]], chap. 3).

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 2, chap. 1 | un corps sans âme se disperse |
    | traité 6, chap. 2 | un corps parfait ne demande qu'un commandement bref |
    | traité 27, chap. 4 | toutes les âmes viennent de l'âme totale |
    | traité 27, chap. 9 | le monde dans l'âme, comme un filet dans la mer |
    | traité 28, chap. 10-13 | gouverner sans calcul ni mémoire |
    | traité 32, chap. 9 | c'est le monde qui est dans l'Âme |

    **Voir aussi** : [[g-ame|Âme]] · [[g-phusis|Nature]] · [[g-univers|Univers]] · [[g-monde|Monde]] · [[g-sundioikesis|Co-gouvernement]] · [[g-ame-non-descendue|Âme non descendue]] · [[g-atemporel|Atemporel]]
