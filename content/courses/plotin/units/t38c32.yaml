- id: t38c32-m3
  title: "La beauté au-delà de la beauté"
  notes: |-
    **L'absence de figure du principe, loin d'en faire un objet indifférent, en fait l'objet d'un amour sans limite ; sa beauté n'est pas une beauté qu'il a, mais une beauté qu'il fait naître.**

    | Extrait | Argument | Ce qu'il fait |
    | 1 | 9 | l'objet sans figure saisissable est le plus désirable, l'amour sans limite |
    | 2 | 10 | sa beauté est une beauté au-delà de la beauté |
    | 3 | 11 | il est ce qui engendre la beauté, son principe et sa limite |
    | 4 | 12 | la beauté produite est sans forme en elle-même ; seul ce qui participe a une forme |

    Le moment change de registre, de la quantité au **désir**, et rejoint la question initiale sur la beauté. La progression est solide, mais elle repose sur une hypothèse que le chapitre n'établit pas (que le principe est objet de désir), et aboutit, avec l'argument 12, à une extension du « sans forme » qui menace la distinction de l'argument 3. Il fait de la remontée de l'âme un **dépouillement** : ce qu'elle aime le plus n'a pas de forme, elle devra laisser derrière elle toute forme (chapitres 34 et 35).

    ! L'âme qui aime la beauté des formes aime déjà, sans le savoir, ce qui la produit.

    === 1 Argument 9 : l'objet dont on ne saisit pas la figure est désirable au plus haut point

    **Si l'on ne peut saisir la forme ou la figure d'un objet désirable, il devient désirable au plus haut point, et l'amour qu'il suscite est sans limite, puisque son objet est sans limite.** L'argument est un conditionnel adressé au lecteur (« si tu ne pouvais saisir ») : une **expérience de pensée**, pas une déduction. « Désirable » et « aimable » relèvent de l'*erôs*, l'amour au sens platonicien, élan de l'âme vers ce qui lui manque et qu'elle reconnaît comme supérieur à elle ; le vocabulaire de l'aimable renvoie au *Phèdre* (250e1) et à *La République* (III, 402d6) (note 222), où le beau éveille l'amour. Seconde étape : l'amour se règle sur son objet, un objet sans limite appelle un amour sans limite ; ce principe de **proportion** est énoncé sans être justifié.

    L'argument ne prouve pas que le principe est désiré : cela sera supposé à la ligne 30 (« s'il est objet de désir ») et repose sur les chapitres 19 à 30, où le Bien est la fin vers laquelle tout tend. Il prouve seulement que, si le principe est désiré, son absence de figure ne diminue pas ce désir mais l'augmente. C'est le point le plus contre-intuitif du chapitre, puisqu'on aime d'ordinaire ce qu'on peut se représenter : un visage connu dans ses moindres traits finit par se laisser épuiser, ce dont on ne fait jamais le tour continue d'attirer. Un contour donne au désir un terme ; l'absence de contour le laisse ouvert.

    ! L'argument est une expérience de pensée : il suppose, sans l'établir, que le principe est désiré.

    === 2 Argument 10 : une beauté au-delà de la beauté

    **Il s'ensuit que la beauté du principe est beauté en un autre sens, une beauté au-delà de la beauté.** Le « il s'ensuit » suppose une prémisse implicite : ce qui est aimé est beau, conformément à la tradition platonicienne où l'amour a pour objet le beau. La **beauté** (*kallos*) est, chez Plotin, ce qui dans une chose attire l'âme parce qu'elle y reconnaît une parenté avec son origine, et elle est toujours celle d'une forme ; si l'objet le plus aimé n'a pas de figure, sa beauté est donc d'une autre sorte. D'où le poids de la préposition **au-delà** (*huper*) : est « au-delà » ce qui dépasse un ordre sans en faire partie, comme le soleil est au-delà de ce qu'il éclaire.

    « Au-delà de la beauté » (*huper kallos*, ligne 29) ne veut pas dire laid : le principe se situe au-delà de la beauté, et parler de sa « beauté » oblige à poser une beauté d'une autre nature (*allon tropon*, ligne 29) qui surabonde de lui (note 223). La note renvoie à *La République* VI, 509a7, où Platon prête au Bien une beauté extraordinaire, et aux études de S. Stern-Gillet (« Le principe du Beau chez Plotin : réflexions sur *Enneas* VI, 7, 32 et 33 ») et de L. Sweeney. Le mot « beauté » est maintenu, comme « grandeur » à l'argument 7, mais change de sens : ce n'est pas la beauté qu'on voit dans une chose, c'est celle d'où vient la beauté des choses.

    ! « Au-delà de la beauté » ne veut pas dire « laid ».

    === 3 Argument 11 : ce qui engendre la beauté, son principe et sa limite

    **S'il n'est rien, il ne peut avoir de beauté ; mais s'il est objet de désir, il est ce qui engendre la beauté, de sorte qu'il est le principe et la limite de la beauté.** Une **aporie** suivie de sa résolution. Être beau semble supposer d'être quelque chose, or le principe n'est aucun être (argument 5). La résolution change la direction du rapport : on ne demande plus quelle beauté il a, on montre quelle beauté il fait naître ; il est « la beauté qui produit la beauté », par la **surabondance** de beauté qui émane de lui. Il ne fabrique pas, il déborde, comme une source qui s'écoule sans rien perdre : l'Un produit sans désir, sans action volontaire et sans diminution de lui-même (traités 10 et 11). Le lien entre « objet de désir » et « ce qui engendre la beauté » suppose que le désir de l'âme pour la beauté est, au fond, désir de son origine.

    L'image de la **fleur** (ligne 31) déplace une référence (note 224) : le premier fragment des *Oracles chaldaïques* parle de « la fleur de l'intellect », qui en désigne le sommet. Plotin l'applique à ce qui est au-delà de l'Intellect : la fleur n'est plus le meilleur de l'intelligible, elle est ce qui le fait fleurir.

    « Le principe et la **limite** de la beauté » semble contredire l'argument 6. La limite (*peras*) borne une chose et l'achève, comme la ligne d'arrivée borne une course et en marque l'accomplissement. On peut lever la difficulté en distinguant deux rapports, ce que le texte ne fait pas explicitement : en lui-même, le principe n'a pas de limite ; par rapport aux choses belles, il est ce qui les achève. La limite appartient alors à ce qui vient de lui.

    ! « La limite de la beauté » ne contredit pas l'« illimité » : la limite est du côté de ce qu'il achève, non en lui.

    === 4 Argument 12 : la beauté produite est sans forme en elle-même

    **Le principe rend beau sans donner la forme ; la beauté en soi qu'il fait venir à l'être est sans forme en elle-même et ne devient forme qu'en autre chose : c'est ce qui participe de la beauté qui a une forme, et non la beauté.** Trois étapes. Le principe rend beau « mais pas dans sa forme » : une beauté pure et sans forme (*ouk en morphèi*, ligne 35, note 223) ; il ne rend pas beau en imprimant une forme, comme un sceau sa figure dans la cire. Il fait venir à l'être la beauté en soi sans lui donner la forme : le verbe grec, *amorphein*, est un **hapax** (note 224), un mot dont on ne connaît qu'une seule occurrence dans toute la littérature conservée ; Plotin semble forger un mot pour dire ce qui échappe au vocabulaire disponible. Enfin, une forme ne mérite son nom que « quand elle est en autre chose » (*morphè en allôi*, ligne 37) ; en elle-même, elle est dépourvue de forme. D'où : c'est « ce qui participe de la beauté » (*to metekhon kallous*, ligne 38) qui est doté de forme. **Participer** (*metekhein*), c'est « avoir part » à une réalité supérieure, comme une belle statue a part à la beauté sans être la beauté.

    Le passage est le plus original du chapitre, car « forme » y change de sens : jusqu'ici la forme intelligible, opposée au principe sans forme ; à présent la configuration qu'une chose reçoit. Une couleur n'a de contour que dans l'objet qu'elle colore. D'où la difficulté de la problématique : si la beauté en soi est elle aussi « sans forme », l'absence de forme ne distingue plus le principe de ce qu'il produit. Le texte ne la lève pas ; la réponse la plus probable : la beauté en soi est sans forme comme ce qui donne forme à un autre, le principe comme ce qui ne donne ni ne reçoit aucune forme, puisqu'il « rend beau » sans même procéder par forme.

    ! La forme n'apparaît que du côté de ce qui reçoit : la beauté en soi n'a pas de contour, ce qui participe d'elle en a un.
