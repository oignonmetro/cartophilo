- id: t38c32-m2
  title: "Ni grandeur, ni mesure, ni figure"
  notes: |-
    **Le principe se tient hors de tout l'ordre quantitatif, et non à l'une de ses extrémités : illimité, il n'a aucune grandeur ; sa « grandeur » est puissance ; il n'a ni mesure ni absence de mesure, donc pas de figure.**

    | Extrait | Argument | Ce qu'il fait |
    | 1 | 6 | illimité, il n'a aucune grandeur, puisqu'il la produit |
    | 2 | 7 | sa « grandeur » est puissance, non quantité ; rien ne lui est égal |
    | 3 | 8 | ni mesure ni absence de mesure, donc pas de figure |

    La note 225 rattache ce moment à une terminologie venue du livre VI de *La République* et du *Parménide* : le principe est dépourvu de **grandeur** (*megethos*), de **limite** (*peras*), de **mesure** (*metron*) et de **forme** (*morphè*). La raison commune : puisqu'il produit toutes choses et leur donne toutes leurs propriétés, il ne possède aucune d'entre elles, sous peine d'être l'une d'entre elles. La logique est **cumulative** plutôt que déductive (pas de figure parce que pas de mesure, pas de mesure parce que pas de grandeur), et toutes les négations reposent sur la prémisse d'hétérogénéité, qui n'est pas redémontrée. L'apport propre du moment est un **déplacement de sens** : le mot « grandeur » n'est pas abandonné, il est converti en puissance ; il installe une manière de parler, garder les mots et en changer le sens, plutôt que de se taire.

    ! Se représenter le principe comme une immensité, un ciel sans bord, une lumière infiniment étendue, c'est encore lui prêter une grandeur.

    === 1 Argument 6 : illimité, il n'a aucune grandeur, car il produit la grandeur

    **Le principe doit être dit illimité, et ce qui est illimité n'a pas de grandeur, puisque la grandeur n'appartient qu'aux choses qui viennent après lui et qu'il la produit.** Le passage s'ouvre sur la question d'un interlocuteur : la puissance de tout produire semble appeler la plus grande des grandeurs. La réponse procède par **auto-correction**. La **grandeur** (*megethos*) est l'étendue d'une chose, ce par quoi elle occupe un espace et se compare à d'autres ; la note 220 en fait une dimension propre aux réalités sensibles, qui existent dans l'extension et l'espace. L'**illimité** (*apeiros*, ligne 15), mot du *Parménide* (137d7), désigne ce qui n'a pas de limite. Plotin accepte le mot mais en corrige l'usage attendu : l'illimité n'est pas une grandeur démesurée, il n'a « aucune grandeur ».

    Deux raisons : la grandeur « ne réside que dans les choses qui viennent après lui » (localisation) ; et « s'il doit produire la grandeur, c'est qu'il ne peut avoir de grandeur » (hétérogénéité de la cause et de l'effet, posée au chapitre 17 et non répétée ici). Un point n'est pas une très petite ligne, et l'origine d'un repère n'est pas une longueur ; c'est pourtant à partir d'elle qu'on mesure toutes les longueurs.

    ! L'illimité n'est pas le plus grand des grands : il n'appartient pas à l'ordre des grandeurs.

    === 2 Argument 7 : sa « grandeur » est puissance, non quantité

    **La grandeur qu'on peut encore lui reconnaître ne consiste pas en une quantité, mais en ce que rien n'est plus puissant que lui ni à sa hauteur.** Première étape, entre parenthèses : même « la grandeur de l'être n'est pas une quantité ». « L'être » peut désigner le principe lui-même ou l'être intelligible, l'Intellect ; la note 220 favorise la seconde lecture lorsqu'elle rappelle que les réalités intelligibles qui proviennent en premier lieu du principe ont une grandeur non quantitative. On aurait alors un argument **a fortiori** : si déjà l'Intellect n'est pas grand au sens de la quantité, le principe l'est encore moins. Le texte ne tranche pas.

    Seconde étape : « Sa grandeur consiste dans le fait qu'il n'y a rien qui soit plus puissant que lui. » Le mot « grandeur » est conservé, mais son sens est déplacé de la quantité vers la **puissance** : sa « grandeur illimitée » ne peut consister, en un sens figuré, qu'en la **puissance infinie** qui le situe au-delà de la mesure (note 220). La justification est une **question rhétorique** : à quoi pourrait être égal ce qui n'a « aucun trait identique » avec les choses ? On ne compare deux choses que sous un rapport commun (deux arbres par leur hauteur, deux sons par leur intensité) ; le principe n'a rien de commun avec ce qui vient de lui, il échappe donc à toute comparaison, et par là à toute égalité.

    ! La lecture de « la grandeur de l'être » comme grandeur de l'Intellect est un choix de lecture, que le texte ne tranche pas.

    === 3 Argument 8 : ni mesure ni absence de mesure, donc pas de figure

    **Le fait d'être toujours et d'être toutes choses ne lui confère ni mesure ni absence de mesure ; il n'a donc pas non plus de figure.** « Ni mesure ni absence de mesure » (*ou metron autôi*, ligne 22) écarte les deux branches d'une alternative qu'on croirait exhaustive. La **mesure** (*metron*) est l'étalon par lequel on évalue une grandeur, comme le mètre pour une longueur. Être mesuré, c'est se laisser évaluer par un étalon ; être démesuré, c'est encore dépasser un étalon qu'on applique : dans les deux cas on reste dans l'**ordre de la mesure**, et c'est cet ordre entier que le principe ne rejoint pas.

    « Comment dès lors pourrait-il mesurer les autres choses ? » Le chapitre ne dit pas comment il les mesure ; la note 220 propose d'en faire, précisément parce qu'il est au-delà de la mesure, l'**unité de mesure** de toutes choses. C'est l'interprétation du traducteur.

    Le « donc » qui conclut à l'absence de **figure** (*skhèma* ; *Parménide* 137d8, note 221 ; *mète skhèma mète morphèn*, lignes 24-25) suppose une prémisse implicite : la figure est le contour d'une chose (le triangle d'une voile, le cercle d'une roue), donc une grandeur délimitée et mesurable. Plotin reprend à la lettre la série négative de la première hypothèse du *Parménide*, qu'il lit comme une description du premier principe (la notice renvoie aux traités 9 et 10).

    ! « Comment dès lors pourrait-il mesurer les autres choses ? » reste sans réponse explicite : c'est le point faible du moment.
