- id: t38c32-i2
  title: "La question, la thèse, la difficulté"
  notes: |-
    **La question : quelle doit être la nature du principe d'où viennent les formes intelligibles et leur beauté, pour qu'il puisse en être le principe ?**

    Elle naît de la situation de l'âme qui, parvenue dans le monde intelligible, y contemple une beauté « répandue » sur des formes très variées. Elle s'inscrit dans un débat avec deux héritages. Le premier est **platonicien** : dans le *Banquet* et le *Phèdre*, la beauté éveille l'amour et conduit l'âme vers le haut ; dans *La République* (VI), le Bien est placé au-dessus de ce qu'il fait connaître ; dans la **première hypothèse** du *Parménide* (137c-142a), l'un est dit sans grandeur, sans limite et sans figure. Le second est la **doctrine platonicienne de la causalité** : une cause donnerait ce qu'elle possède elle-même, comme une forme donne aux choses sensibles la qualité qu'elle a. Appliquée au principe premier, elle en ferait une forme parmi les formes : c'est contre elle que le chapitre construit sa réponse.

    **Thèse.** Le principe des formes et de leur beauté est lui-même sans forme, sans grandeur, sans mesure, sans figure et sans beauté formée, non parce qu'il lui manquerait quelque chose, mais parce qu'il produit tout cela et précède tout ce qu'il produit : il n'est aucun être et il est tous les êtres, et sa beauté, « au-delà de la beauté », est celle qui engendre la beauté. Ce qui donne la forme ne peut pas en avoir une, sous peine de n'être qu'une forme de plus ; et c'est cette absence même qui fait de lui l'objet du désir le plus haut.

    **Problématique.** Comment ce qui n'a ni forme ni beauté peut-il être à la fois la source de toute forme et l'objet du désir le plus intense, sans que son absence de forme se confonde avec celle de la matière, qui est un manque, ni avec celle que la fin du chapitre attribue à la forme elle-même ? Trois points l'aggravent :

    | Point | Difficulté |
    | deux « sans forme » | l'absence de forme ne suffit pas à désigner le premier |
    | l'objet sans figure, désirable au plus haut point | renverse sans la démontrer l'intuition qu'on aime ce qu'on se représente |
    | la forme « en elle-même dépourvue de forme » | le critère qui séparait le principe des formes s'étend aux formes |

    ! L'absence de forme du principe n'est pas un manque : c'est la condition pour qu'il donne la forme.
