- id: t38c32-o2
  title: "Conclusion : un principe dépourvu de tout ce qu'il donne"
  notes: |-
    **Le principe des formes et de leur beauté doit être dépourvu de tout ce qu'il donne : forme, grandeur, mesure, figure et beauté formée. Il n'est aucun être, parce qu'il les précède, et il est tous les êtres, parce qu'ils viennent de lui.**

    La problématique reçoit une **réponse partielle**. Le chapitre explique pourquoi ce qui n'a ni forme ni beauté peut être l'objet du désir le plus haut : un objet sans contour laisse l'amour sans limite, et ce que l'âme aime dans la beauté des formes, c'est son origine. Il distingue l'absence de forme du principe de celle de la matière : l'une est antériorité, l'autre manque. Mais la tension des dernières lignes demeure : si la forme est sans forme hors de ce qui y participe, l'absence de forme cesse d'être le propre du principe. On peut la reconstruire (la beauté en soi est sans forme comme ce qui informe un autre, le principe comme ce qui ne procède même pas par forme), mais c'est une reconstruction.

    Plusieurs points restent **sans démonstration** dans le chapitre :

    | Point | Où il est établi |
    | le principe est objet de désir | chapitres 19 à 30 |
    | ce qui produit ne possède pas ce qu'il produit | chapitre 17 |
    | une partie ne peut être principe du tout | non dit |
    | ce qui est aimé est beau | tradition platonicienne |
    | l'amour se proportionne à son objet | non dit |

    L'**originalité** du passage tient à deux gestes. Plotin ne se contente pas de nier : il garde les mots « grandeur » et « beauté » en déplaçant leur sens vers la puissance et la production, ce qui fait de la **négation une manière de désigner**. Et il **renverse l'intuition commune** selon laquelle on aime ce qu'on peut se représenter : l'objet le plus aimable est celui dont on ne saisit pas la figure. C'est ce renversement qui justifie la suite du traité, où l'âme ne rejoint le principe qu'en se défaisant à son tour de toute forme.

    ! La réponse à la problématique est partielle : ce qui distingue l'absence de forme du principe de celle de la beauté en soi reste une reconstruction.
