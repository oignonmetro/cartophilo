- id: t38c32-o1
  title: "La structure de l'argumentation"
  notes: |-
    **Le chapitre suit une même règle à travers trois domaines, la forme (I), la quantité (II), la beauté (III) : il refuse au principe une propriété qu'il produit, puis, pour la grandeur et la beauté, conserve le mot en déplaçant son sens.**

    | Moment | Lignes | Arguments | Ce qu'il installe |
    | I. Le principe des formes est sans forme | 1-14 | 1 à 5 | ce qui produit une propriété ne la possède pas |
    | II. Ni grandeur, ni mesure, ni figure | 14-24 | 6 à 8 | garder les mots en changeant leur sens |
    | III. La beauté au-delà de la beauté | 24-39 | 9 à 12 | l'âme doit se dépouiller de toute forme |

    Dans le **premier moment**, l'argument 1 oriente, l'argument 2 établit par exclusion, l'argument 3 précise par une distinction, l'argument 4 la justifie après coup et porte la charge de la preuve, l'argument 5 condense le tout dans une formule paradoxale. Le **deuxième** est cumulatif et repose tout entier sur la prémisse d'hétérogénéité. Le **troisième** change de registre, de la quantité au désir : 9 renverse l'intuition commune, 10 en tire une conséquence sur la beauté, 11 résout l'aporie ainsi créée, 12 précise comment le principe fait naître la beauté.

    La problématique se loge dans le passage du deuxième au troisième moment : tant qu'on parle de grandeur, l'absence de propriété ne pose pas de problème ; dès qu'on parle de beauté et de désir, il faut expliquer pourquoi ce qui n'a pas de beauté attire plus que tout ce qui en a. La réponse : le désir vise l'**origine** de la beauté plus que la beauté elle-même. La difficulté restante est celle de la dernière phrase, où la forme elle-même se révèle sans forme.

    ! Les arguments les plus fragiles ne sont pas ceux qu'on croit : la grandeur ne pose pas de problème, c'est le passage à la beauté et au désir qui en pose.
