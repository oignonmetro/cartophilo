# Unité de texte (voir content/textes.md) : Plotin, traité 38 (VI, 7),
# chapitre 32, traduction F. Fronterotta (GF, éd. L. Brisson et
# J.-F. Pradeau), d'après la synthèse de l'argumentation fournie par
# l'utilisateur et les notes 218 à 225 de la GF. Le chapitre n'est pas
# découpé en paragraphes : trois moments repérés par leurs lignes, arguments
# 1 à 12 de la synthèse en sections `=== k`. La mise en place, la question
# et la thèse vont en introduction ; l'analyse de la structure et la
# conclusion, qui suivent l'explication dans la synthèse, en prolongement.

id: t38c32
title: "Le principe sans forme (38 [VI, 7], 32)"
subtitle: "Traité 38, Comment la multiplicité des idées s'est établie et sur le Bien, chapitre 32"
icon: page
color: coral
intro: |-
  Le chapitre 32 du traité 38 (VI, 7), dans la traduction de F. Fronterotta (GF). Parvenue dans la beauté des formes intelligibles, l'âme cherche d'où elle vient : le principe des formes est lui-même sans forme, sans grandeur, sans mesure et sans figure, il n'est aucun être et il est tous les êtres, et sa beauté est **une beauté au-delà de la beauté**, celle qui engendre la beauté.
lessons:
- id: t38c32-i1
  title: "Le chapitre dans le traité"
  notes: |-
    **Le chapitre 32 ouvre la partie du traité 38 consacrée au Bien en lui-même : juste après la remontée de l'âme jusqu'au monde intelligible (chapitre 31), il cherche d'où viennent les formes et leur beauté.**

    Le traité 38, trente-huitième dans l'ordre chronologique établi par Porphyre, est classé dans les *Ennéades* comme VI, 7, sous le titre *Comment la multiplicité des idées s'est établie et sur le Bien*. On le lit dans la traduction de F. Fronterotta (GF, édition dirigée par L. Brisson et J.-F. Pradeau). La notice le divise en trois parties de longueur voisine :

    | Chapitres | Objet |
    | 1-14 | le rapport du sensible et de l'intelligible, la nature de l'Intellect |
    | 15-30 | le Bien à partir de ses « produits », comme source et objet de leur désir |
    | 31-42 | le Bien en lui-même, cerné sur le mode de la négation |

    La notice regroupe les chapitres 32 et 33 sous un intitulé : l'âme se dirige vers ce qui est **dépourvu de forme**, car c'est là la source de toute beauté et de tout désir.

    Trois éléments de doctrine suffisent pour lire le texte. La réalité se distribue en **trois niveaux** qui procèdent les uns des autres : l'**Un**, aussi appelé le **Bien**, principe premier ; l'**Intellect**, qui contient la totalité des formes intelligibles (les modèles éternels de toutes choses) ; l'**âme**, qui anime le monde sensible. L'âme peut **remonter** de la beauté sensible à la beauté intelligible, puis au-delà : au début du chapitre, elle est déjà « dans cette beauté », dans le monde des formes. Enfin, Plotin pose l'**hétérogénéité de la cause et de l'effet** : ce qui donne n'a pas à posséder ce qu'il donne, et lui est supérieur (chapitre 17, 3-5). Le chapitre 32 applique ce principe à la forme, à la grandeur, à la mesure, à la figure et à la beauté.

    ! Le chapitre ne nomme jamais l'Un ni le Bien : il ne dit que « le principe » ou « celui qui a produit ».
