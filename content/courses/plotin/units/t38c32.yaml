- id: t38c32-m1
  title: "Le principe des formes est sans forme"
  notes: |-
    **Le principe des formes est sans forme : ni une forme, ni une puissance déterminée, ni leur ensemble ne peut l'être ; il est le « sans forme » dont provient toute forme, il n'est aucun être et il est tous les êtres.**

    | Extrait | Argument | Ce qu'il fait |
    | 1 | 1 | transformer le plaisir de l'âme devant les formes en question causale |
    | 2 | 2 | exclure une forme, une puissance déterminée, leur ensemble |
    | 3 | 3, 4 | distinguer deux « sans forme » ; ce qui n'a pas été produit n'est pas déterminé |
    | 4 | 5 | il n'est aucun être et il est tous les êtres |

    Le moment va d'une question à une position, puis d'une position à une formule. L'ordre d'exposition ne suit pas l'ordre de fondation : la distinction (3) est énoncée avant sa raison (4), qui porte la charge de la preuve. Sa faiblesse tient à deux prémisses non dites : qu'une partie ne peut être principe du tout, et que toute détermination vient d'une production. Il installe pour la suite la règle qui servira deux fois encore : **ce qui produit une propriété ne la possède pas**.

    ! L'absence de forme du principe est celle de ce qui donne, non celle de ce qui reçoit.

    === 1 Argument 1 : la beauté des formes renvoie à une origine qu'il faut chercher

    **L'âme qui se trouve dans la beauté des formes doit se demander d'où viennent ces formes et d'où vient leur beauté.** La question d'ouverture suppose déjà sa réponse partielle : la beauté et la vie intelligibles ont été « produites » par quelqu'un. Ce quelqu'un est le **principe** (*arkhè*), ce dont une chose vient et dont elle dépend, comme un ruisseau de sa source : l'Un ou le Bien, que le chapitre ne nomme jamais autrement que « le principe » ou « celui qui a produit ». Ce choix n'est pas indifférent, car nommer, c'est déjà déterminer.

    La production des formes n'est pas démontrée ici, elle est posée comme point de départ, dans la continuité du chapitre 31. La concession (« Il est beau, certes, de rester dans cette beauté ») fixe la fonction du passage : il ne condamne pas la contemplation des formes, il interdit de **s'y arrêter**. Un visiteur ébloui par une galerie de tableaux peut rester devant eux ; s'il veut comprendre d'où ils viennent, il doit chercher le peintre, qui n'est accroché à aucun mur.

    ! L'argument est une exigence de méthode, pas une preuve.

    === 2 Argument 2 : ni une forme, ni une puissance, ni leur ensemble

    **Le principe des formes ne peut être ni l'une d'entre elles, ni une puissance déterminée, ni la totalité des formes et des puissances : il est au-delà.** Trois exclusions. Une forme particulière serait « une partie de l'ensemble » : la prémisse implicite est qu'une partie ne peut être principe du tout dont elle fait partie, puisqu'elle aurait alors besoin d'être expliquée comme les autres. Une **puissance** (*dunamis*) est une capacité de produire ; elle est **déterminée** lorsqu'elle est bornée à un type d'effet, comme la chaleur du feu, qui réchauffe sans pouvoir rafraîchir : une chose bornée parmi d'autres. L'**ensemble** des formes et des puissances, enfin, est exclu à son tour : c'est l'exclusion la plus décisive, car on croirait que le tout pourrait être principe si aucun élément ne l'est. Elle se comprend par la même prémisse, puisque l'ensemble « vient à l'être » avec ses parties et se trouve « là-haut », au même niveau qu'elles. Ce « là-haut » est l'**Intellect** (*noûs*), qui contient la totalité des formes : chercher le principe au-delà de l'ensemble des formes, c'est le chercher au-delà de l'Intellect.

    La conclusion est modale (« il faut que ce principe soit au-delà ») : elle établit une position sans dire ce que le principe est. Le mot traduit par « forme » est *morphè*, qui signifie d'ordinaire « figure », le contour visible, et non *eidos* ; la note 218 précise que le sens paraît identique et que c'est la **forme intelligible** qui est visée. Ce flottement prépare la suite, où Plotin refusera aussi au principe la « figure » au sens propre.

    ! Le principe n'est pas la somme des formes : le tout est encore au niveau de ses parties.

    === 3 Arguments 3 et 4 : deux « sans forme » ; ce qui n'a pas été produit n'est pas déterminé

    **Le principe est « sans forme », non au sens de ce qui a besoin d'une forme, mais au sens de ce dont provient toute forme intelligible.** La distinction n'est pas démontrée, elle lève l'ambiguïté créée par l'argument 2 : au-delà de toute forme, le principe pourrait sembler informe comme la matière. Le **« sans forme »** (*amorphon*) se dit en deux sens. Le premier est **privatif** : la matière attend une forme, comme un bloc de marbre brut n'est pas encore une statue. Le second est d'**antériorité** : le sculpteur n'a pas la forme de la statue qu'il produit, et ce n'est pas un défaut, puisque c'est lui qui la donne. La note 219 le dit : être dépourvu de beauté et de forme n'est pas pour le principe un manque, mais la condition pour qu'il donne la beauté et la forme.

    **Argument 4.** Son « car » justifie après coup la distinction. « **Venir à l'être** » signifie provenir d'un principe (l'Intellect de l'Un, l'âme de l'Intellect) : une dépendance, non un commencement dans le temps. Une « **chose déterminée** » (*ti*, « quelque chose ») est ce qu'on peut désigner et définir. Être produit, c'est devenir déterminé ; or le principe n'a été produit par personne (ce qui découle de sa position de premier) ; il n'a donc pas été produit comme une chose déterminée. L'argument montre que le principe n'a pas reçu de détermination par production, non que rien d'autre ne pourrait le déterminer : la prémisse implicite est que **toute détermination vient d'une production**.

    Le texte grec est incertain (note 219). Fronterotta traduit une **conjecture** (une correction moderne d'un texte transmis jugé fautif), celle de Henry et Schwyzer, *[ti] tis an poièseien* ; Theiler corrige plutôt le *tis* des manuscrits en *ti* (« comment pourrait-il avoir été produit comme une chose déterminée ? » ; voir Hadot, p. 166, note 280). L'enjeu est le mot *ti*, et le sens reste le même.

    ! L'ordre d'exposition n'est pas l'ordre de fondation : la distinction des deux « sans forme » est énoncée avant sa raison.

    === 4 Argument 5 : il n'est aucun être et il est tous les êtres

    **Le principe n'est aucun être, parce que les êtres viennent après lui, et il est tous les êtres, parce qu'ils viennent tous de lui.** La formule n'est pas une contradiction : ses deux membres ne portent pas sur le même rapport, et chacun a sa raison. L'**être**, chez Plotin, désigne ce qui est pleinement, les réalités intelligibles déterminées, non le simple fait d'exister : n'être aucun être, ce n'est pas ne pas exister, c'est ne compter pas parmi ces réalités. Le premier membre dit l'**antériorité** (ce qui vient après n'est pas ce qui précède), le second la **provenance** : il contient tous les êtres comme une source contient tous les ruisseaux qui en sortent, sans être aucun d'eux. Il est tout comme origine et rien comme résultat.

    La note 219 rattache la formule au chapitre 17 (3-6) et à l'**hétérogénéité de la cause et de l'effet** : une cause identique à son effet ne s'en distinguerait pas, et ne pourrait pas en être la cause. « Il est tous les êtres » n'est pas démontré au-delà de la provenance ; c'est une façon de parler que la théologie négative de la troisième partie du traité tiendra pour approximative.

    ! « Il n'est aucun être » ne veut pas dire qu'il n'existe pas.
  passage:
    label: "l. 1-14"
    text: "Où se trouve donc celui qui a produit une si grande beauté et une vie si puissante, lui qui a engendré l'être ? Tu vois la beauté répandue sur toutes ces formes qui sont si variées. Il est beau, certes, de rester dans cette beauté, mais lorsque l'on est dans cette beauté, il faut regarder d'où viennent ces formes et d'où vient leur beauté. Aucune d'entre elles ne peut être leur principe, car ce serait une forme particulière et une partie de l'ensemble qu'elles constituent. Il ne peut être ni une forme comme celles dont on vient de parler, ni une puissance déterminée, ni l'ensemble des formes et des puissances qui sont venues à l'être et qui se trouvent là-haut, mais il faut que ce principe soit au-delà de toutes les puissances et de toutes les formes. Le principe est donc le « sans forme », non le « sans forme » qui a besoin d'une forme, mais celui dont provient toute forme intelligible. Car celui qui est venu à l'être, s'il est bien venu à l'être, est devenu quelque chose de déterminé et qui possède une forme propre ; ce qui n'a pas été produit par personne, comment aurait-il été produit comme une chose déterminée ? Il n'est donc aucun être et il est tous les êtres : il n'est aucun être parce que les êtres viennent après lui, mais il est tous les êtres parce que tous viennent de lui."
