id: id2
title: 'Le corps sensible : matière et forme'
subtitle: Le modèle hylémorphique de Plotin
icon: palette
color: amber
group: La métaphysique du sensible
lessons:
- id: id2-l1
  title: Le modèle hylémorphique et la matière
  notes: |-
    Plotin reprend, en le transformant, le {violet}**modèle hylémorphique**{/violet} {sky}aristotélicien{/sky} : {green}tout corps sensible est composé de deux constituants toujours unis, l'un matériel, l'autre formel{/green}, sans que l'un puisse exister indépendamment de l'autre.

    - {blue}***hulê***{/blue} : la matière, substrat permanent de tous les changements qui affectent la réalité sensible.
    - À la différence de la matière {sky}aristotélicienne{/sky}, celle de Plotin {red}ne reçoit jamais véritablement de **forme**{/red} : {coral}elle reste le substrat inerte dans lequel les formes sensibles deviennent seulement manifestes{/coral} {sky}(III, 6 [26], 17){/sky}.
    - Simplement prédisposée à conférer {violet}**de l'étendue**{/violet} à ce qu'elle reçoit, elle permet aux composantes formelles d'apparaître sur elle comme si elles constituaient un corps particulier.

    ! Dépourvue de toute caractéristique qualitative ou quantitative propre, la matière est un {violet}**non-être**{/violet} : Plotin la compare à {yellow}un **miroir impassible**, sur lequel une multiplicité de formes apparaît sans jamais véritablement le façonner ni s'en approprier une seule{/yellow}.
  points:
  - id: id2-l1-1
    sentence: "Le modèle sur lequel repose l'analyse aristotélicienne des corps sensibles, __selon lequel chaque corps est composé de deux constituants toujours unis__, **l'un matériel** et **l'autre formel**, sans que l'un puisse exister indépendamment de l'autre, se nomme le modèle ___."
    answer: hylémorphique
  - id: id2-l1-2
    sentence: "__Chez Plotin, le constituant matériel de tout corps__, conçu comme le **substrat permanent de tous les changements** qui affectent la réalité sensible, porte le nom de ___."
    answer: matière
  - id: id2-l1-3
    sentence: "Terme original, translittéré, __désignant chez Plotin le **substrat matériel** permanent des corps sensibles__ : ___."
    answer: hulê
  - id: id2-l1-4
    sentence: "À la différence de la matière **aristotélicienne**, __celle de Plotin ne reçoit jamais véritablement de__ ___ : elle constitue seulement le substrat inerte dans lequel les formes sensibles deviennent manifestes (III, 6 [26], 17)"
    answer: forme
  - id: id2-l1-5
    sentence: "__**La matière**, selon Plotin, est simplement prédisposée à conférer__ ___ à tout ce qu'elle reçoit, permettant ainsi à ces composantes formelles, dont la coexistence produit l'impression d'un corps particulier étendu dans l'espace, d'apparaître sur elle."
    answer: de l'étendue
  - id: id2-l1-6
    sentence: "__En raison de l'absence totale, en elle-même, de toute caractéristique qualitative ou quantitative__, Plotin caractérise **la matière** comme ___."
    answer: non-être
  - id: id2-l1-7
    sentence: "Parce qu'elle demeure **totalement inaffectée** par les formes qui s'y manifestent sans jamais la façonner véritablement, __Plotin compare la matière à__ ___ sur lequel apparaît une multiplicité de formes sans jamais véritablement le façonner ; la matière est incapable de s'approprier réellement l'une quelconque de ces formes et de la faire sienne."
    answer: un miroir impassible
- id: id2-l2
  title: Le principe formateur (`logos`)
  notes: |-
    Le second constituant des corps sensibles, celui qui leur confère leur identité propre, {red}n'est pas chez Plotin une simple forme{/red} comme chez {sky}Aristote{/sky}, mais un {blue}***logos***{/blue}, un « {violet}principe formateur{/violet} ».

    - Ce {blue}***logos***{/blue} est {green}une combinaison de caractéristiques formelles dont la coexistence confère à chaque corps individuel son identité{/green}, ce qu'on pourrait décrire, en termes aristotéliciens, comme son {violet}**essence**{/violet}.
    - Plotin conserve la distinction aristotélicienne entre la {violet}**substance**{/violet} ainsi déterminée et les autres catégories, prédiquées d'elle « en un sujet » (qualités, quantité...).

    ! Mais Plotin s'écarte d'{sky}Aristote{/sky} sur un point : {pink}les qualités sensibles perçues par nos sens ne sont pas des entités réelles{/pink} dotées d'une identité {violet}**autosubsistante**{/violet}, {amber}seulement de simples images ou ressemblances des véritables êtres intelligibles{/amber}.
  points:
  - id: id2-l2-1
    sentence: "__Le second constituant des corps sensibles, celui qui leur confère leur **identité propre**__, n'est pas chez Plotin une simple forme comme chez Aristote, mais ce que Plotin appelle un ___."
    answer: principe formateur
  - id: id2-l2-2
    sentence: "Terme original, translittéré, __désignant ce « **principe formateur** » qui confère à chaque corps son identité__ : ___."
    answer: logos
  - id: id2-l2-3
    sentence: "Ce principe formateur (`logos`) est chaque fois une combinaison de caractéristiques formelles dont la coexistence confère à chaque corps individuel son identité et __pourrait, en ce sens, être décrit, en termes aristotéliciens, comme son__ « ___ », c'est-à-dire comme **ce qu'une chose est avant tout**, ce qui correspond également à **sa définition**. Ainsi, par exemple, un feu particulier possédera, entre autres, les caractéristiques qualitatives d'être chaud, sec et de se mouvoir vers le haut, qui le distinguent des autres éléments."
    answer: essence
  - id: id2-l2-4
    sentence: "En même temps, chaque corps individuel, dont l'identité a été ainsi déterminée par le principe formateur correspondant, est capable de recevoir des caractéristiques qualitatives, quantitatives ou autres supplémentaires (non essentielles). Ainsi, __la distinction fondamentale introduite par Aristote entre la__ ___ et **les autres catégories** prédiquées d'elle « en un sujet », est-elle conservée par Plotin."
    answer: substance
  - id: id2-l2-5
    sentence: "Mais il est un autre point sur lequel Plotin se distingue d'Aristote dans son analyse des corps. Pour Plotin, les caractéristiques qualitatives (et éventuellement autres) qui confèrent à un corps donné les propriétés que nous reconnaissons et percevons, par nos sens, comme lui étant inhérentes, __ne constituent pas des entités réelles dotées d'une identité__ ___, mais de **simples images ou ressemblances** des véritables êtres intelligibles."
    answer: autosubsistante
