# Entrée du glossaire de Plotin (skill glossaire) : notion, voisine de
# g-vie-parfaite, citations vérifiées sur la GF (I, 4, 3-4 ; I, 5, 1 et 7).
# Les cartes en g-vie-veritable-l1-* viennent de l'ancienne entrée « Vie
# véritable » et gardent leur identifiant, donc leur progression.

id: g-bonheur
title: Bonheur (`eudaimonia`)
subtitle: La vie parfaite elle-même, que l'homme peut être, et que la durée n'accroît pas
icon: book
color: coral
lessons:
- id: g-bonheur-l1
  title: Bonheur
  notes: |-
    Chez Plotin, le {violet}**bonheur**{/violet} n'est pas un {pink}état agréable qui s'ajouterait à la vie{/pink} : c'est la {green}vie parfaite elle-même{/green}, celle de l'{violet}[[g-intellect|Intellect]]{/violet}, que l'homme peut posséder, et même être.

    __**Si le bonheur est dans la vie, il est dans la vie parfaite.**__ « Posons que __le bonheur se trouve dans la vie__ », dit Plotin. Mais pas dans la vie commune à tous les vivants : « si nous supposions que "vivre" s'applique de la même façon à tous les êtres vivants, alors nous admettrions que __tous les vivants connaissent le bonheur__ » ([[traite46|traité 46]], chap. 3). Or la [[g-vie|vie]] se dit en plusieurs sens, ordonnés ; la vie bonne aussi, donc : « si la vie bonne appartient à celui qui possède la vie dans sa plénitude – j'entends par là l'être auquel __rien de la vie ne manque__ –, alors le bonheur ne saurait appartenir qu'à celui qui vit dans la plénitude ». Cette plénitude, c'est la [[g-vie-parfaite|vie parfaite]].

    __**Le bien ne lui vient pas du dehors.**__ « Ainsi en effet le bien __ne lui vient pas de l'extérieur__ » : « qu'est-ce qui en effet pourrait __s'ajouter à la vie parfaite__ pour qu'elle soit excellente ? » ([[traite46|traité 46]], chap. 3). {coral}**Le bonheur n'est pas un bien qu'on acquiert en plus de la vie** : il est cette vie quand rien ne lui manque.{/coral}

    __**L'homme heureux est cette vie.**__ « Si donc l'homme est capable de posséder la vie parfaite, alors __celui qui la possède est heureux__ » ([[traite46|traité 46]], chap. 4). Il la possède quand il a, outre la sensation, le raisonnement et l'intellect véritable ; mais l'homme heureux ne l'a pas comme une partie de lui : « étant donné qu'il est déjà en acte cette espèce de vie et qu'il en est venu à __coïncider avec elle, est cette vie__ ». {yellow}Le reste, il le porte « comme des vêtements ».{/yellow}

    __**La durée ne l'accroît pas.**__ Le bonheur ne se mesure pas au temps, car « le bonheur se doit d'__exister tout entier__, alors que le temps qui va au-delà du présent ne peut plus exister » ([[traite36|traité 36]], chap. 7). Puisqu'il est la vie de ce qui est, « il ne faut donc pas mesurer cette vie à l'aune du temps, __mais à celle de l'éternité__ ».

    ! Le bonheur n'est pas un sentiment : il réside « non dans le fait de dire que l'on est heureux, mais dans le fait d'__être en une certaine disposition__ » ([[traite36|traité 36]], chap. 1).

    **Voir aussi** : [[g-vie-parfaite|Vie parfaite]] · [[g-vie|Vie]] · [[g-intellect|Intellect]]
