    alt: ["vetements"]
  - id: g-bonheur-l1-q5
    sentence: "Le bonheur ne s'accroît pas avec la durée, car « le bonheur se doit d'exister tout ___, alors que le temps qui va au-delà du présent ne peut plus exister » (traité 36, chap. 7)."
