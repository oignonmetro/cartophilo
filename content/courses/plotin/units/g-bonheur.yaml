# Entrée du glossaire de Plotin (skill glossaire) : notion, voisine de
# g-vie-parfaite, citations vérifiées sur la GF (I, 4, 3-4 ; I, 5, 1 et 7).
# Les cartes en g-vie-veritable-l1-* viennent de l'ancienne entrée « Vie
# véritable » et gardent leur identifiant, donc leur progression.

id: g-bonheur
title: Bonheur (`eudaimonia`)
icon: book
color: coral
lessons:
- id: g-bonheur-l1
  title: Bonheur
  notes: |-
    Chez Plotin, le {violet}**bonheur**{/violet} (*eudaimonia*) est [def]. Il n'est pas un {pink}état agréable qui s'ajouterait à la vie{/pink}.

    __**Si le bonheur est dans la vie, il est dans la**__ {violet}__**vie parfaite**__{/violet}__**.**__ « Posons que __le bonheur se trouve dans la vie__ », dit Plotin. Mais pas dans la vie commune à tous les vivants : « si nous supposions {red}que "vivre" s'applique de la même façon à tous les êtres vivants{/red}, alors nous admettrions que {red}__tous les vivants connaissent le bonheur__{/red} » ([[traite46|traité 46]], chap. 3). Or la [[g-vie|vie]] se dit en plusieurs sens, ordonnés ; la vie bonne aussi, donc : « si la {violet}vie bonne{/violet} appartient à {green}celui qui possède la vie dans sa plénitude{/green} – j'entends par là l'être auquel __rien de la vie ne manque__ –, alors {green}__le bonheur ne saurait appartenir qu'à celui qui vit dans la plénitude__{/green} ». Cette plénitude, c'est la [[g-vie-parfaite|vie parfaite]].

    __**Le bonheur n'est pas**__ {red}__**un bien ajouté à la vie**__{/red}__**.**__ Les {red}stoïciens{/red} placent le bonheur dans la {red}« vie rationnelle »{/red} : une vie, commune à tous les vivants, comme substrat, à laquelle s'ajouterait une qualité, la raison (ce sont deux de leurs genres de l'être). Plotin montre que c'est se contredire : ceux qui disent cela, « parce qu'ils ne le placent pas dans la vie qui est commune à tous les êtres, __ils ne le posent plus dans la vie__ » ([[traite46|traité 46]], chap. 3) ; {red}le bonheur serait alors dans la qualité ajoutée, non dans la vie{/red}. Si l'on tient qu'il est {green}dans la vie{/green}, il faut qu'il soit {green}une sorte de vie{/green}, la plus haute de l'échelle, et non une vie plus un supplément. Or {green}cette vie, à laquelle rien ne manque, est déjà l'excellence{/green} : « qu'est-ce qui en effet pourrait __s'ajouter à la vie parfaite__ pour qu'elle soit excellente ? » Le seul candidat serait le Bien, mais le Bien comme cause, au-delà de cette vie : « ce qu'à présent {green}nous cherchons{/green} n'est pas __le bien entendu comme cause__, c'est {green}le bien qui se trouve dans cette vie{/green} ». {yellow}Comme la santé n'est pas une chose qu'on ajoute au corps, mais le corps lui-même en bon état{/yellow}, le bonheur est la vie parfaite elle-même.

    __**L'homme heureux** *est*** cette vie.**__ « Si donc l'homme est capable de posséder la vie parfaite, alors __celui qui la possède est heureux__ » ([[traite46|traité 46]], chap. 4). Il la possède quand il a, outre la sensation, le raisonnement et l'intellect véritable. Mais pourquoi dire qu'il *est* cette vie, et non qu'il l'a ? Parce que **l'intellect n'est pas un bien qu'on pourrait avoir ou ne pas avoir en restant le même** : « s'il ne la possède __ni en puissance ni en acte, il n'est même pas un homme__ ». Celui qui ne l'a qu'en puissance l'a « comme une partie de lui » ; {pink}__l'homme heureux ne l'a pas comme une partie de lui__{/pink} : « étant donné qu'{green}il est déjà en acte cette espèce de vie{/green} et qu'il en est venu à __coïncider avec elle, est cette vie__ ». Car ce que nous sommes, c'est notre part la plus haute : « nous sommes non pas notre faculté végétative, mais __l'activité de ce qui intellige__ » (chap. 9). {yellow}Le reste, le corps et les biens extérieurs, il le porte « comme des vêtements »{/yellow}, qui ne sont pas des parties de lui « parce qu'elles l'entourent __sans qu'il le veuille__ » (chap. 4). La preuve : celui qui est dans cet état « ne cherche rien d'autre ».

    __**Le bonheur est une disposition, non un sentiment.**__ Le bonheur réside « non dans le fait de dire que l'on est heureux, mais dans le fait d'__être en une certaine disposition__ » ([[traite36|traité 36]], chap. 1). Pourquoi pas un sentiment ? Parce qu'{pink}un sentiment suppose qu'on s'aperçoive de son état{/pink}, et que {green}l'activité de l'intellect précède cette aperception{/green}. Le **sage endormi ou malade reste sage, donc heureux** : « même s'il ne sent pas qu'il est en bonne santé, __il n'en est pas moins en bonne santé__ » ([[traite46|traité 46]], chap. 9). La conscience n'est qu'un reflet de cette activité, qui se produit quand elle est « réfléchie, __comme dans un miroir__ » : si le miroir est brouillé, l'activité n'en est pas moins là (chap. 10). La conscience, ajoute Plotin, « risque de rendre __plus obscures__ les activités mêmes sur lesquelles elle porte ».

    __**Le bonheur ne réside pas dans la durée.**__ On croit qu'un bonheur long vaut plus qu'un bonheur bref, comme on additionne les années. Mais on n'additionne que ce qu'on peut compter, même disparu, comme on compte les morts ; et {coral}un bonheur passé n'existe plus{/coral} : « il est en revanche absurde de dire qu'un bonheur qui n'existe plus __subsiste encore__, et qu'il est plus grand que le bonheur présent ». Une disposition n'existe que dans le présent ; le bonheur « se doit d'__exister tout entier__ », à chaque instant ([[traite36|traité 36]], chap. 7). Et puisqu'il est la vie de ce qui est, celle de l'Intellect, « il ne faut donc pas mesurer cette vie à l'aune du temps, __mais à celle de l'éternité__ » (voir [[g-eternite|éternité]]).

    ! Le bonheur de Plotin ne répond pas aux questions qu'on rattache aujourd'hui à ce mot : comment se sentir bien ([[g-bien-etre|bien-être]]), quel [[g-sens-de-la-vie|sens donner à la vie]], comment ne plus [[g-souffrance|souffrir]] ou ne plus être triste ([[g-joie-tristesse|joie et tristesse]]). Il n'est pas un état vécu, mais une [[g-disposition|disposition]], celle d'une [[g-activite|activité]] : celle de l'intellect en nous.
    ! Le bien de l'homme heureux n'est pas le Bien : il est « pour lui-même le bien qu'il possède », mais le Bien qui en est la cause reste au-delà (traité 46, chap. 4 ; voir [[g-agathon|Bien]]).

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 46, chap. 3 | le bonheur est dans la vie parfaite, rien ne s'y ajoute |
    | traité 46, chap. 4 | l'homme heureux est cette vie |
    | traité 46, chap. 9-10 | heureux même sans s'en apercevoir |
    | traité 36, chap. 1 | une disposition, non le fait de se dire heureux |
    | traité 36, chap. 7 | le bonheur se mesure à l'éternité, non au temps |

    **Voir aussi** : [[g-vie-parfaite|Vie parfaite]] · [[g-disposition|Disposition]] · [[g-bien-etre|Bien-être]] · [[g-souffrance|Souffrance]] · [[g-mort|Mort]] · [[traite46|Traité 46]]
