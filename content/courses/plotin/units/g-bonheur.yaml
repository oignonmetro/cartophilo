    sentence: "« Si la vie bonne appartient à celui qui possède la vie dans sa ___ – j'entends par là l'être auquel rien de la vie ne manque –, alors le bonheur ne saurait appartenir qu'à celui qui vit dans la plénitude » (traité 46, chap. 3)."
    answer: plénitude
    alt: ["plenitude"]
  - id: g-vie-veritable-l1-q6
    sentence: "« Si la vie bonne appartient à celui qui possède la vie dans sa plénitude – j'entends par là l'être auquel rien de la vie ne ___ –, alors le bonheur ne saurait appartenir qu'à celui qui vit dans la plénitude » (traité 46, chap. 3)."
    answer: manque
    alt: []
