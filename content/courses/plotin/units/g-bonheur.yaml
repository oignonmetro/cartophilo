  - id: g-bonheur-l1-q1
    sentence: "Le bonheur, que Plotin identifie à la vie parfaite elle-même, se dit en grec translittéré ___."
    answer: eudaimonia
    alt: ["eudaimonía", "eudaimonie"]
  - id: g-bonheur-l1-q2
    sentence: "Contre ceux qui placent le bonheur dans la vie commune à tous : « si nous supposions que \"vivre\" s'applique de la même façon à tous les êtres vivants, alors nous admettrions que tous les vivants connaissent le ___ » (traité 46, chap. 3)."
    answer: bonheur
    alt: []
  - id: g-vie-veritable-l1-q5
    sentence: "« Si la vie bonne appartient à celui qui possède la vie dans sa ___ – j'entends par là l'être auquel rien de la vie ne manque –, alors le bonheur ne saurait appartenir qu'à celui qui vit dans la plénitude » (traité 46, chap. 3)."
    answer: plénitude
    alt: ["plenitude"]
  - id: g-vie-veritable-l1-q6
    sentence: "« Si la vie bonne appartient à celui qui possède la vie dans sa plénitude – j'entends par là l'être auquel rien de la vie ne ___ –, alors le bonheur ne saurait appartenir qu'à celui qui vit dans la plénitude » (traité 46, chap. 3)."
    answer: manque
    alt: []
  - id: g-bonheur-l1-q3
    sentence: "Le bonheur ne vient pas s'ajouter à la vie parfaite : « qu'est-ce qui en effet pourrait s'ajouter à la vie parfaite pour qu'elle soit ___ ? » (traité 46, chap. 3)."
    answer: excellente
    alt: []
  - id: g-vie-veritable-l1-q8
    sentence: "Puisque le bonheur est la vie parfaite elle-même, rien ne peut s'y ajouter du ___ pour la rendre heureuse (traité 46, chap. 3)."
    answer: dehors
    alt: ["extérieur", "exterieur"]
  - id: g-bonheur-l1-q4
    sentence: "Le bonheur n'est pas réservé aux dieux : « si donc l'homme est capable de posséder la vie parfaite, alors celui qui la possède est ___ » (traité 46, chap. 4)."
    answer: heureux
    alt: []
  - id: g-vie-veritable-l1-q9
    sentence: "L'homme heureux n'a pas la vie parfaite comme une partie de lui : « étant donné qu'il est déjà en acte cette espèce de vie et qu'il en est venu à ___ avec elle, est cette vie » (traité 46, chap. 4)."
    answer: coïncider
    alt: ["coincider"]
