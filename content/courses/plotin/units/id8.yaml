id: id8
title: L'Un
subtitle: Le principe absolu et la dynamique du système
icon: column
color: yellow
group: La métaphysique de l'intelligible
lessons:
- id: id8-l1
  title: L'Un comme principe absolu et sa transcendance
  notes: |-
    En vertu de la priorité du simple sur le multiple, toute cause doit être plus simple que son effet : le premier Principe doit donc être absolument non composé, **l'Un absolu**.

    ! En raison de cette unité absolue, le premier Principe demeure inaccessible à nos facultés intellectives ordinaires : tout discours à son sujet doit recourir à des métaphores et autres formes d'expression **catachrestique**.

    - Sa puissance illimitée rend impossible qu'il ne s'exprime pas sous la forme d'un « écoulement » constant : c'est le principe de **plénitude**.
    - Cet effluve cherche pourtant sans cesse à revenir vers son origine : c'est la théorie des **deux activités**. L'Altérité qui en procède, d'abord multiplicité informe, se voit progressivement dotée, à mesure de son retour, d'éléments d'unité qui font écho à **l'unité originelle de l'Un**.
    - L'absolue autosuffisance de l'Un a pour conséquence qu'il ne recherche rien **en dehors de lui-même** : c'est au contraire lui qui constitue, pour toute autre chose, l'objet de sa **recherche** (aspiration), ce qui revient à l'identifier au Bien absolu.

    Deux textes platoniciens fondent cette description : la Première Hypothèse du *Parménide*, et **le livre VI** de la *République*, où est introduite la Forme du Bien comme ce qui se situe « au-delà de l'être ».
  points:
  - id: id8-l1-1
    sentence: En vertu du principe de la priorité logique du simple sur le multiple, toute cause doit
      être plus simple que son effet, ce qui a pour conséquence que le premier Principe doit être absolument
      non composé, c'est-à-dire ___.
    answer: l'Un absolu
  - id: id8-l1-2
    sentence: 'En raison de son unité absolue, le premier Principe demeure inaccessible à nos facultés
      intellectives ou ratiocinatives ordinaires : tout discours à son sujet doit nécessairement recourir
      à des métaphores, des similitudes et d''autres formes d''expression ___.'
    answer: catachrestique
  - id: id8-l1-3
    sentence: 'À la question de savoir pourquoi quoi que ce soit doit émaner du premier Principe, Plotin
      répond que sa puissance illimitée rend impossible qu''il ne s''exprime pas sous la forme d''un «
      écoulement » constant issu de son activité incessante : ceci illustre le principe selon lequel toute
      possibilité réelle, aussi longtemps qu''elle demeure réelle, ne peut rester perpétuellement inaccomplie,
      faute de quoi elle ne serait pas une possibilité réelle dès l''origine, le principe de ___.'
    answer: plénitude
  - id: id8-l1-4
    sentence: 'Cet effluve issu du premier Principe cherche pourtant sans cesse à revenir vers son origine
      : ceci illustre le principe selon lequel toute activité interne parfaite s''accompagne nécessairement
      d''une activité secondaire, dépendante de la première mais dirigée vers l''extérieur et distincte
      d''elle, la théorie des ___.'
    answer: deux activités
  - id: id8-l1-5
    sentence: L'Altérité originelle issue du premier Principe, d'abord multiplicité totalement informe
      et inarticulée, se voit progressivement dotée, à mesure de son retour vers lui, d'éléments d'unité
      qui constituent des échos de ___.
    answer: l'unité originelle de l'Un
  - id: id8-l1-6
    sentence: L'absolue autosuffisance de l'Un, qui découle directement de son unité parfaite, a pour
      conséquence qu'il ne manque de rien et donc qu'il ne recherche rien ___.
    answer: en dehors de lui-même
  - id: id8-l1-7
    sentence: À l'inverse de l'Un, qui ne recherche rien en dehors de lui-même, l'Un constitue au contraire,
      pour toute chose autre que lui-même, l'objet de sa ___, ce qui revient à l'identifier au Bien absolu.
    answer: recherche
    alt:
    - aspiration
  - id: id8-l1-8
    sentence: Le dialogue platonicien dont la Première Hypothèse fournit, selon Plotin, une description
      de l'Un absolu, principe logique de toute chose, est ___.
    answer: le Parménide
  - id: id8-l1-9
    sentence: Le livre de la République de Platon où est introduite la Forme du Bien, identifiée par Plotin
      à l'Un absolu, comme ce qui se situe « au-delà de l'être », est ___.
    answer: le livre VI
- id: id8-l2
  title: La liberté et la volonté de l'Un
  notes: |-
    Le système plotinien est moniste et, en outre, **productif** : tout procède d'un unique principe premier, absolument unitaire, ne dépendant de rien d'extérieur à lui-même, ce que Plotin exprime par la formule **`dunamis pantōn`** (la puissance productrice de toutes choses).

    - La nécessité de ce qui procède de l'Un implique, paradoxalement, sa totale **liberté** : son activité n'est limitée par rien d'extérieur, mais déterminée seulement par sa propre nature de Bien premier. Plotin va jusqu'à identifier le premier Principe à sa propre **volonté** (`boulēsis`) entièrement libre.
    - En tant que cause absolument première, l'Un doit être antérieur à toute chose, non pas temporellement, mais **ontologiquement**, et toute chose doit être « autre » que lui, c'est-à-dire différer de lui, pour pouvoir **résulter** de lui.

    ! On aboutit ainsi à une conception négative du premier Principe : puisque tout prédicat renvoie à des êtres, aucun prédicat ne peut lui être attribué avec exactitude, dans la mesure où il **transcende** toute chose. Des pratiques **cathartiques** permettent malgré tout aux humains de développer les capacités requises pour une « union » ou un « contact » expérientiel avec lui.
  points:
  - id: id8-l2-1
    sentence: Le système ontologique de Plotin peut être qualifié de moniste et, en outre, de « ___ »,
      puisque tout procède d'un unique principe premier absolument unitaire ne dépendant de rien d'extérieur
      à lui-même.
    answer: productif
  - id: id8-l2-2
    sentence: L'expression par laquelle Plotin désigne l'Un premier comme constituant, en et par lui-même,
      la puissance productrice de toutes choses, est ___.
    answer: dunamis pantōn
  - id: id8-l2-3
    sentence: De la nécessité de ce qui procède du premier Principe découle également sa totale ___, son
      activité n'étant limitée par rien d'extérieur mais déterminée seulement par sa propre nature de
      Bien premier.
    answer: liberté
  - id: id8-l2-4
    sentence: Plotin va jusqu'à identifier le premier Principe à sa propre ___ entièrement libre.
    answer: volonté
    explanation: En grec, boulēsis.
  - id: id8-l2-5
    sentence: En tant que cause absolument première de toute chose, l'Un doit lui être antérieur, non
      pas temporellement, mais ___.
    answer: ontologiquement
  - id: id8-l2-6
    sentence: Il s'ensuit que toute chose doit être « autre » que l'Un, c'est-à-dire différer de lui,
      pour pouvoir ___ de lui.
    answer: résulter
  - id: id8-l2-7
    sentence: 'On aboutit ainsi à une conception négative du premier Principe : puisque tout prédicat
      renvoie à des êtres, c''est-à-dire à des choses qui « sont » quelque chose d''une manière ou d''une
      autre, aucun prédicat ne peut être attribué avec exactitude à l''Un, dans la mesure où il ___ toute
      chose.'
    answer: transcende
  - id: id8-l2-8
    sentence: Bien que l'appréhension intellective directe du premier Principe soit impossible, des pratiques
      permettant aux humains de développer les capacités requises pour une « union » ou un « contact »
      expérientiel complet avec lui sont qualifiées par Plotin de pratiques ___.
    answer: cathartiques
- id: id8-l3
  title: 'La dynamique du système : procession et conversion'
  notes: |-
    Selon Kalligas, toute présentation exclusivement hiérarchique des hypostases plotiniennes risque d'occulter le caractère **dynamique** de l'ensemble du système.

    - Chaque niveau ontologique est traversé par une double tendance : la **procession** (`proodos`), tendance de déclin vers l'hypostase inférieure, et la **conversion** (`epistrophē`), tendance d'ascension et de retour vers l'hypostase supérieure, par laquelle chaque hypostase se constitue elle-même.
    - Trois moments forment ainsi le schéma dialectique qui traverse tout le système et lui confère sa cohérence : la demeurance, la procession et **la conversion** (le retour).

    L'hypostase de l'âme illustre ce schéma : dérivée de l'activité secondaire de l'Intellect, elle se constitue elle-même par sa tendance à remonter vers lui au moyen de **la contemplation**. Sa sollicitude pour ce qui se trouve en dessous d'elle produit, en retour, une image d'elle-même entrant en contact avec la corporéité, jusqu'à produire **la matière** elle-même.

    ! Ce double mouvement s'exprime, à tous les degrés du système, comme un **`erōs`** (amour) qui se porte vers le Bien : si l'âme est mue par la Beauté, l'Intellect lui-même tend à s'élever vers le Bien en se transcendant, entrant dans un état d'**ivresse** inspirée.
  points:
  - id: id8-l3-1
    sentence: Le risque encouru par toute présentation exclusivement hiérarchique des hypostases plotiniennes,
      selon Kalligas, est d'occulter le caractère ___ de l'ensemble du système.
    answer: dynamique
  - id: id8-l3-2
    sentence: 'Chaque niveau ontologique du système plotinien est traversé par une double tendance : une
      tendance de déclin vers l''hypostase inférieure, appelée la ___.'
    answer: procession
    explanation: En grec, proodos.
  - id: id8-l3-3
    sentence: À l'inverse de la procession, la tendance d'ascension et de retour vers l'hypostase supérieure,
      par laquelle une hypostase se constitue elle-même, se nomme la ___.
    answer: conversion
    explanation: En grec, epistrophē.
  - id: id8-l3-4
    sentence: Les trois moments qui forment le schéma dialectique traversant tout le système plotinien
      et lui conférant sa cohérence sont la demeurance, la procession et ___.
    answer: la conversion
    alt:
    - le retour
  - id: id8-l3-5
    sentence: L'hypostase de l'âme dérive de l'activité secondaire de l'Intellect, mais se constitue elle-même
      comme le genre d'entité qu'elle est par sa tendance à remonter vers l'Intellect au moyen de ___,
      qui lui confère son unité discursive caractéristique.
    answer: la contemplation
  - id: id8-l3-6
    sentence: L'âme manifeste sa sollicitude pour ce qui se trouve en dessous d'elle sous la forme de
      sa propre activité secondaire, laquelle produit une image de l'âme entrant en contact avec la corporéité
      et finissant par produire ___ elle-même.
    answer: la matière
  - id: id8-l3-7
    sentence: Le dévouement incessant de l'âme, comme celui de tous les autres degrés ontologiques du
      système plotinien, s'exprime à travers son ___, qui se porte directement vers le Bien.
    answer: amour (erōs)
  - id: id8-l3-8
    sentence: Si l'âme est mue dans sa quête du Bien par la Beauté, l'Intellect lui-même tend à s'élever
      vers le Bien en se transcendant lui-même, entrant alors dans un état d'___ inspirée.
    answer: ivresse
