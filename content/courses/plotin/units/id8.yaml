id: id8
title: L'Un
subtitle: Le principe absolu et la dynamique du système
icon: column
color: yellow
group: La métaphysique de l'intelligible
lessons:
- id: id8-l1
  title: L'Un comme principe absolu et sa transcendance
  notes: |-
    {coral}En vertu de la priorité du simple sur le multiple, toute cause doit être plus simple que son effet{/coral} : {green}le premier Principe doit donc être absolument non composé{/green}, {violet}**l'Un absolu**{/violet}.

    ! En raison de cette unité absolue, {red}le premier Principe demeure inaccessible à nos facultés intellectives ordinaires{/red} : tout discours à son sujet doit recourir à des métaphores et autres formes d'expression {violet}**catachrestique**{/violet}.

    - Sa puissance illimitée rend impossible qu'il ne s'exprime pas sous la forme d'un {yellow}« écoulement »{/yellow} constant : c'est le principe de {violet}**plénitude**{/violet}.
    - Cet effluve cherche pourtant sans cesse à revenir vers son origine : c'est la théorie des {violet}**deux activités**{/violet}. L'Altérité qui en procède, d'abord multiplicité informe, se voit progressivement dotée, à mesure de son retour, d'éléments d'unité qui font écho à {amber}**l'unité originelle de l'Un**{/amber}.
    - L'absolue autosuffisance de l'Un a pour conséquence qu'il ne recherche rien **en dehors de lui-même** : c'est au contraire lui qui constitue, pour toute autre chose, l'objet de sa {violet}**recherche**{/violet} (aspiration), ce qui revient à l'identifier au Bien absolu.

    Deux textes platoniciens fondent cette description : la Première Hypothèse du {sky}*Parménide*{/sky}, et {sky}**le livre VI**{/sky} de {sky}*La République*{/sky}, où est introduite la Forme du Bien comme ce qui se situe {teal}« au-delà de l'être »{/teal}.
  points:
  - id: id8-l1-1
    sentence: "En vertu du principe de la priorité logique du simple sur le multiple, __toute cause doit être plus simple que son effet__, ce qui a pour conséquence que le premier Principe doit être **absolument non composé**, c'est-à-dire ___."
    answer: l'Un absolu
  - id: id8-l1-2
    sentence: "En raison de son unité absolue, __le premier Principe demeure inaccessible à nos facultés intellectives ou ratiocinatives ordinaires__ : tout discours à son sujet doit nécessairement recourir à des **métaphores, des similitudes** et d'autres formes d'expression ___."
    answer: catachrestique
  - id: id8-l1-3
    sentence: "À la question de savoir __pourquoi quoi que ce soit doit émaner du premier Principe__, Plotin répond que sa **puissance illimitée** rend impossible qu'il ne s'exprime pas sous la forme d'un **« écoulement »** constant issu de son activité incessante : ceci illustre le principe selon lequel toute possibilité réelle, aussi longtemps qu'elle demeure réelle, ne peut rester perpétuellement inaccomplie, faute de quoi elle ne serait pas une possibilité réelle dès l'origine, le principe de ___."
    answer: plénitude
  - id: id8-l1-4
    sentence: "__Cet effluve issu du premier Principe cherche pourtant sans cesse à revenir vers son origine__ : ceci illustre le principe selon lequel toute activité interne parfaite s'accompagne nécessairement d'une **activité secondaire**, dépendante de la première mais dirigée vers l'extérieur et distincte d'elle, la théorie des ___."
    answer: deux activités
  - id: id8-l1-5
    sentence: "L'**Altérité originelle** issue du premier Principe, d'abord multiplicité totalement informe et inarticulée, __se voit progressivement dotée, à mesure de son retour vers lui, d'éléments d'unité__ qui constituent des échos de ___."
    answer: l'unité originelle de l'Un
  - id: id8-l1-6
    sentence: "L'**absolue autosuffisance** de l'Un, qui découle directement de son unité parfaite, a pour conséquence qu'__il ne manque de rien et donc qu'il ne recherche rien__ ___."
    answer: en dehors de lui-même
  - id: id8-l1-7
    sentence: "À l'inverse de l'Un, qui ne recherche rien en dehors de lui-même, l'Un constitue au contraire, __pour toute chose autre que lui-même__, l'objet de sa ___, ce qui revient à l'identifier au **Bien absolu**."
    answer: recherche
    alt:
    - aspiration
  - id: id8-l1-8
    sentence: "__Le dialogue platonicien dont la Première Hypothèse fournit, selon Plotin, une description__ de **l'Un absolu**, principe logique de toute chose, est ___."
    answer: le Parménide
  - id: id8-l1-9
    sentence: "__Le livre de la République de Platon où est introduite la Forme du Bien__, identifiée par Plotin à l'Un absolu, comme ce qui se situe **« au-delà de l'être »**, est ___."
    answer: le livre VI
- id: id8-l2
  title: La liberté et la volonté de l'Un
  notes: |-
    Le système plotinien est moniste et, en outre, {violet}**productif**{/violet} : {green}tout procède d'un unique principe premier, absolument unitaire, ne dépendant de rien d'extérieur à lui-même{/green}, ce que Plotin exprime par la formule {blue}***dunamis pantôn***{/blue} (la puissance productrice de toutes choses).

    - La nécessité de ce qui procède de l'Un implique, paradoxalement, sa totale {violet}**liberté**{/violet} : {coral}son activité n'est limitée par rien d'extérieur, mais déterminée seulement par sa propre nature de Bien premier{/coral}. Plotin va jusqu'à identifier le premier Principe à sa propre {violet}**volonté**{/violet} ({blue}*boulêsis*{/blue}) entièrement libre.
    - En tant que cause absolument première, l'Un doit être antérieur à toute chose, non pas temporellement, mais {amber}**ontologiquement**{/amber}, et toute chose doit être « autre » que lui, c'est-à-dire différer de lui, pour pouvoir **résulter** de lui.

    ! On aboutit ainsi à une conception négative du premier Principe : puisque tout prédicat renvoie à des êtres, {red}aucun prédicat ne peut lui être attribué avec exactitude{/red}, dans la mesure où il **transcende** toute chose. Des pratiques {violet}**cathartiques**{/violet} permettent malgré tout aux humains de développer les capacités requises pour une « union » ou un « contact » expérientiel avec lui.
  points:
  - id: id8-l2-1
    sentence: "Le système ontologique de Plotin peut être qualifié de **moniste** et, en outre, de « ___ », puisque __tout procède d'un unique principe premier absolument unitaire__ ne dépendant de rien d'extérieur à lui-même."
    answer: productif
  - id: id8-l2-2
    sentence: "L'expression par laquelle Plotin désigne **l'Un premier** __comme constituant, en et par lui-même, la puissance productrice de toutes choses__, est ___."
    answer: dunamis pantôn
  - id: id8-l2-3
    sentence: "De la nécessité de ce qui procède du premier Principe découle également sa totale ___, __son activité n'étant limitée par rien d'extérieur__ mais déterminée seulement par **sa propre nature de Bien premier**."
    answer: liberté
  - id: id8-l2-4
    sentence: __Plotin va jusqu'à identifier le premier Principe à sa propre__ ___ **entièrement libre**.
    answer: volonté
    explanation: En grec, `boulêsis`.
  - id: id8-l2-5
    sentence: "En tant que cause absolument première de toute chose, __l'Un doit lui être antérieur__, **non pas temporellement**, mais ___."
    answer: ontologiquement
  - id: id8-l2-6
    sentence: "Il s'ensuit que __toute chose doit être « autre » que l'Un__, c'est-à-dire **différer de lui**, pour pouvoir ___ de lui."
    answer: résulter
  - id: id8-l2-7
    sentence: "On aboutit ainsi à une **conception négative** du premier Principe : puisque tout prédicat renvoie à des êtres, c'est-à-dire à des choses qui « sont » quelque chose d'une manière ou d'une autre, __aucun prédicat ne peut être attribué avec exactitude à l'Un__, dans la mesure où il ___ toute chose."
    answer: transcende
  - id: id8-l2-8
    sentence: "Bien que l'**appréhension intellective directe du premier Principe** soit impossible, __des pratiques permettant aux humains de développer les capacités requises pour une « union » ou un « contact »__ expérientiel complet avec lui sont qualifiées par Plotin de pratiques ___."
    answer: cathartiques
- id: id8-l3
  title: 'La dynamique du système : procession et conversion'
  notes: |-
    Selon {sky}Kalligas{/sky}, toute présentation exclusivement hiérarchique des hypostases plotiniennes {red}risque d'occulter{/red} le caractère {violet}**dynamique**{/violet} de l'ensemble du système.

    - {green}Chaque niveau ontologique est traversé par une double tendance{/green} : la {violet}**procession**{/violet} ({blue}*proodos*{/blue}), tendance de déclin vers l'hypostase inférieure, et la {violet}**conversion**{/violet} ({blue}*epistrophê*{/blue}), tendance d'ascension et de retour vers l'hypostase supérieure, {coral}par laquelle chaque hypostase se constitue elle-même{/coral}.
    - Trois moments forment ainsi le schéma dialectique qui traverse tout le système et lui confère sa cohérence : la demeurance, la procession et {violet}**la conversion**{/violet} (le retour).

    L'hypostase de l'âme illustre ce schéma : dérivée de l'activité secondaire de l'Intellect, elle se constitue elle-même par sa tendance à remonter vers lui au moyen de {violet}**la contemplation**{/violet}. Sa sollicitude pour ce qui se trouve en dessous d'elle produit, en retour, une image d'elle-même entrant en contact avec la corporéité, jusqu'à produire {violet}**la matière**{/violet} elle-même.

    ! Ce double mouvement s'exprime, à tous les degrés du système, comme un {blue}***erôs***{/blue} (amour) qui se porte vers le Bien : si l'âme est mue par la Beauté, l'Intellect lui-même tend à s'élever vers le Bien en se transcendant, entrant dans un état d'{violet}**ivresse**{/violet} inspirée.
  points:
  - id: id8-l3-1
    sentence: "__Le risque encouru par toute présentation exclusivement hiérarchique des hypostases__ plotiniennes, selon Kalligas, est **d'occulter** le caractère ___ de l'ensemble du système."
    answer: dynamique
  - id: id8-l3-2
    sentence: "__Chaque niveau ontologique du système plotinien est traversé par une double tendance__ : une tendance de **déclin vers l'hypostase inférieure**, appelée la ___."
    answer: procession
    explanation: En grec, `proodos`.
  - id: id8-l3-3
    sentence: "À l'inverse de la procession, __la tendance d'ascension et de retour vers l'hypostase supérieure__, par laquelle une hypostase **se constitue elle-même**, se nomme la ___."
    answer: conversion
    explanation: En grec, `epistrophê`.
  - id: id8-l3-4
    sentence: "__Les trois moments qui forment le schéma dialectique traversant tout le système__ plotinien et lui conférant sa cohérence sont **la demeurance**, **la procession** et ___."
    answer: la conversion
    alt:
    - le retour
  - id: id8-l3-5
    sentence: "L'hypostase de l'âme dérive de l'activité secondaire de l'Intellect, __mais se constitue elle-même comme le genre d'entité qu'elle est__ par sa **tendance à remonter vers l'Intellect** au moyen de ___, qui lui confère son unité discursive caractéristique."
    answer: la contemplation
  - id: id8-l3-6
    sentence: "__L'âme manifeste sa sollicitude pour ce qui se trouve en dessous d'elle__ sous la forme de sa propre **activité secondaire**, laquelle produit une image de l'âme entrant en contact avec la corporéité et finissant par produire ___ elle-même."
    answer: la matière
  - id: id8-l3-7
    sentence: "__Le dévouement incessant de l'âme__, comme celui de tous les autres degrés ontologiques du système plotinien, s'exprime à travers son ___, qui se porte **directement vers le Bien**."
    answer: amour (erôs)
  - id: id8-l3-8
    sentence: "__Si l'âme est mue dans sa quête du Bien par la Beauté__, l'Intellect lui-même tend à s'élever vers le Bien **en se transcendant lui-même**, entrant alors dans un état d'___ inspirée."
    answer: ivresse
