id: id3
title: L'âme et le monde sensible
subtitle: L'âme, la Nature, la sympathie cosmique
icon: wave
color: teal
group: La métaphysique du sensible
lessons:
- id: id3-l1
  title: L'âme, la Nature et la formation des corps
  notes: |-
    Pour qu'un principe formateur (logos) se manifeste sur la matière et y produise l'apparition des formes sensibles, un facteur causal actif supplémentaire est nécessaire : **l'âme**, seule entité capable d'accéder à la fois au sensible et à l'intelligible.

    - **`theōria`** (« contemplation ») : l'activité par laquelle l'âme se tourne vers les Formes intelligibles, en appréhende les représentations, puis les transmet au monde sensible en le façonnant à leur image.
    - Pour les corps dépourvus d'âme individuelle propre, c'est **la Nature**, principe causal issu de l'Âme cosmique, qui se charge de les façonner, de façon involontaire et **inconsciente** de ses propres actions, bien qu'elle organise l'univers en un tout cohérent.
    - Exemple : la « terre », d'abord informe (froide et sèche), peut ainsi devenir une quantité déterminée de **`psimuthion`** (céruse), matériau doté des propriétés supplémentaires de blancheur et de toxicité (II, 6, 1).

    La division d'un corps se poursuit **à l'infini**, sans qu'émerge jamais un composant véritablement indivisible ; les propriétés des corps se diffusent, ou non, selon des relations d'**affinité et de non affinité**.

    ! L'ensemble des lois qui régulent ces changements (les mêmes causes produisant toujours les mêmes effets, sauf intervention extérieure) porte le nom de **Destin** ou **`heimarmenē`** : une **nécessité hypothétique**, jamais absolue.
  points:
  - id: id3-l1-1
    sentence: 'Pour qu''un principe formateur parvienne à se manifester sur la matière et à y produire
      l''apparition des formes sensibles, la médiation d''un facteur causal actif supplémentaire est nécessaire
      : ___, seule entité capable d''accéder à la fois au sensible et à l''intelligible.'
    answer: l'âme
  - id: id3-l1-2
    sentence: L'activité par laquelle l'âme se tourne vers les Formes intelligibles, en appréhende les
      représentations, puis les transmet au monde sensible en façonnant celui-ci à leur image, se nomme
      la ___.
    answer: contemplation
  - id: id3-l1-3
    sentence: 'Terme original, translittéré, désignant cette activité de « contemplation » par laquelle
      l''âme transmet au sensible les représentations des Formes intelligibles : ___.'
    answer: theōria
  - id: id3-l1-4
    sentence: Ayant développé et traité le contenu de ces représentations selon ses propres capacités
      cognitives, l'___ transmet, pour ainsi dire, l'information venue du domaine intelligible au monde
      sensible, en façonnant celui-ci à l'image de celui-là, d'une manière qui correspond à son mode propre
      de contemplation.
    answer: Âme
  - id: id3-l1-5
    sentence: 'Dans le cas des corps dépourvus d''âme individuelle propre, c''est un principe causal issu
      de l''Âme cosmique, gouvernant par sa Providence l''ensemble de l''univers sensible, qui se charge
      de les façonner : ___.'
    answer: la Nature
  - id: id3-l1-6
    sentence: Bien qu'elle organise l'univers sensible en un tout cohérent et harmonieux, la Nature agit
      de façon involontaire et presque automatique, en ce sens qu'elle demeure ___ de ses propres actions.
    answer: inconsciente
  - id: id3-l1-7
    sentence: 'La mise en forme apparente de la matière s''effectue progressivement, en phases successives.
      Ces phases rendent le substrat réceptif à une strate supplémentaire de caractéristiques, qui spécifient
      les propriétés apparaissant sur tel ou tel corps particulier. : la « terre », d''abord informe et
      composée des seules propriétés du froid et du sec, peut ainsi devenir une quantité déterminée de
      ___, matériau doté des propriétés supplémentaires de blancheur et de toxicité (II, 6, 1).'
    answer: psimuthion
    explanation: Céruse, autrement dit « blanc de plomb ».
  - id: id3-l1-8
    sentence: Chez Plotin, dans la mesure où la division d'un corps quelconque conduit à la formation
      de deux ou plusieurs corps plus petits, elle peut se poursuivre ___, sans qu'émerge jamais un composant
      corporel véritablement indivisible.
    answer: à l'infini
  - id: id3-l1-9
    sentence: Les lois qui régissent la manière dont les propriétés des corps se diffusent, ou non, dans
      leur environnement, en reliant les corps entre eux, sont des relations d'affinité et de ___.
    answer: non affinité
  - id: id3-l1-10
    sentence: L'ensemble des lois immuables qui régulent les changements du monde sensible, garantissant
      que les mêmes causes produisent toujours les mêmes effets sauf intervention d'un facteur extérieur,
      est parfois désigné par Plotin comme la Nature ou ___.
    answer: le Destin
  - id: id3-l1-11
    sentence: Le Destin est un réseau de règles déterministes qui opèrent presque automatiquement et sans
      intention, répondant à une sorte de « ___ », selon laquelle les mêmes causes produisent inexorablement
      les mêmes effets, pourvu qu'aucun autre facteur exogène n'entre en jeu. L'ensemble de ces lois règle
      avec ordre tous les changements qui se produisent dans l'univers sensible et prédétermine le comportement
      des corps qui s'y trouvent d'une manière cohérente et prévisible, tant qu'aucun facteur causal supplémentaire
      ne vient s'y immiscer.
    answer: nécessité hypothétique
  - id: id3-l1-12
    sentence: 'Terme original, translittéré, désignant ce Destin qui régit le monde sensible chez Plotin
      : ___.'
    answer: heimarmenē
  - id: id3-l1-13
    sentence: Le type de nécessité auquel obéit le réseau des lois de la Nature, où les mêmes causes produisent
      inexorablement les mêmes effets à condition qu'aucun facteur extérieur n'intervienne, est qualifié
      par Plotin de nécessité ___.
    answer: hypothétique
- id: id3-l2
  title: L'âme individuelle, non descendue, et les affections du vivant
  notes: |-
    La vie des organismes est régie non seulement par les lois de la **Nature** universelle, mais aussi par les **âmes individuelles**, qui coopèrent avec l'**Âme cosmique** pour façonner conjointement l'univers.

    - Les âmes individuelles ne descendent en réalité jamais dans les corps qu'elles animent : elles se contentent d'y projeter **une image d'elles-mêmes**, qui leur confère une semblance de fonctions vitales : elles restent **« non descendues »**, intactes de toute corporéité, supervisant le corps « d'en haut ».
    - Le véritable sujet des affections dites psychiques n'est donc pas l'âme elle-même, mais le **`zōion`** (« vivant »), l'organisme composé, que l'âme appréhende de façon seulement cognitive.

    ! Ce n'est que si la sollicitude de l'âme pour un corps particulier devient **excessive** qu'elle peut s'**enchevêtrer** émotionnellement avec lui et prendre part, à travers le vivant, à ce qui lui arrive (plaisir, détresse, douleur).

    L'activité de l'âme individuelle assure l'interaction de toutes les **parties** de l'organisme : tout ce qui arrive à l'une se répercute sur les autres, si bien que le tout paraît traversé par une « sympathie » interne.
  points:
  - id: id3-l2-1
    sentence: La vie des organismes est régie et régulée non seulement par les lois inexorables et fondamentales
      de la ___ universelle, mais aussi par les âmes individuelles, qui coopèrent avec l'Âme cosmique
      pour façonner conjointement l'univers.
    answer: Nature
  - id: id3-l2-2
    sentence: Outre les lois inexorables et fondamentales de la Nature universelle, la vie des organismes
      est aussi régie par les âmes individuelles, qui coopèrent avec l'___ pour façonner conjointement
      l'univers.
    answer: Âme cosmique
    explanation: Une coopération que permet la parenté reliant les âmes entre elles, capables de communiquer
      et d'interagir sans l'intervention de leurs corps respectifs.
  - id: id3-l2-3
    sentence: 'Les âmes individuelles qui animent les organismes vivants ne descendent en réalité jamais
      dans les corps qu''elles animent : elles se contentent d''y projeter ___, qui leur confère une semblance
      de fonctions vitales.'
    answer: une image d'elles-mêmes
  - id: id3-l2-4
    sentence: La vie dont jouit un organisme, ainsi que toutes les parties qui le composent, n'est pas
      réelle, mais une simple irradiation de la vie véritable, laquelle constitue l'activité première
      de l'âme. Les âmes demeurent « ___ » et intactes de toute corporéité, supervisant les diverses fonctions
      et affections du corps organique, pour ainsi dire, « d'en haut », sans jamais s'impliquer directement
      dans ce que le corps subit du fait de son interaction avec les autres corps du monde.
    answer: non descendues
  - id: id3-l2-5
    sentence: Ce n'est que si l'engagement de l'âme envers un corps particulier, et le soin qu'elle lui
      porte, devient excessif, qu'il peut arriver qu'elle s'___ émotionnellement avec ce corps et finisse
      par prendre part à ce qui lui arrive, sous forme de plaisir ou de détresse et de douleur, ainsi
      que des autres affections associées à la vie corporelle.
    answer: enchevêtre
  - id: id3-l2-6
    sentence: Le véritable sujet des affections dites psychiques est, au contraire, le "___", que l'âme
      appréhende de façon cognitive, sans rien souffrir elle-même.
    answer: vivant
  - id: id3-l2-7
    sentence: 'Terme original, translittéré, désignant cet organisme animé que Plotin appelle le « vivant
      » : ___.'
    answer: zōion
  - id: id3-l2-8
    sentence: Restant « non descendues » et gouvernant le corps qu'elles animent depuis un point de vue
      supérieur, les âmes individuelles ne s'impliquent directement dans les affections du corps que si
      leur sollicitude à son égard devient ___.
    answer: excessive
  - id: id3-l2-9
    sentence: C'est le vivant composé, et non l'âme elle-même qui demeure impassible, qui constitue le
      véritable sujet des ___.
    answer: affections psychiques
  - id: id3-l2-10
    sentence: L'activité de l'âme individuelle anime l'organisme dans son ensemble de manière à assurer
      l'interaction de ses ___. Tout ce qui arrive à l'une d'elles se répercute sur toutes les autres,
      si bien que le tout se comporte et réagit comme une unité organisée qui, de ce fait, paraît traversée
      par une « sympathie » interne et douée d'une sorte d'« intuition » précursive.
    answer: parties
- id: id3-l3
  title: Sympathie cosmique et Providence
  notes: |-
    Le même principe d'interconnexion qui traverse chaque organisme individuel vaut, à l'échelle cosmique, pour l'univers entier : même sans contact physique direct, les différentes parties du monde entretiennent un réseau d'interactions dites **sympathiques**.

    - Ces interactions cosmiques sont aussi qualifiées d'**érotiques**, en écho à la présence de l'Amour cosmique comme force cohésive de l'univers.
    - L'ensemble du monde sensible forme ainsi un univers unitaire, maintenu par une nécessité interne et une **harmonie**, mû en cercle par l'Âme qui le régit, laquelle imite le mouvement autopensant de l'Intellect divin.

    Cette organisation harmonieuse est, pour Plotin, l'expression d'une **Providence** cosmique, par laquelle les principes supérieurs déterminent le déroulement des phénomènes sensibles.
  points:
  - id: id3-l3-1
    sentence: Parce que tout ce qui affecte une de ses parties affecte l'ensemble, l'organisme animé par
      l'âme individuelle se comporte comme une unité organisée traversée par une forme de ___ interne.
    answer: sympathie
  - id: id3-l3-2
    sentence: Sur le plan cosmique, ce même principe d'interconnexion produit, entre les différentes parties
      de l'univers, même en l'absence de contact physique direct, un réseau d'interactions qualifiées
      de ___.
    answer: sympathiques
    explanation: Plotin qualifie aussi ces interactions cosmiques de « magiques ».
  - id: id3-l3-3
    sentence: En raison de l'attraction mutuelle qu'elles exercent, Plotin qualifie ces interactions cosmiques
      d'___, en tant qu'elles font écho à la présence de l'Amour cosmique comme force cohésive de l'univers.
    answer: érotiques
  - id: id3-l3-4
    sentence: L'ensemble du monde sensible se constitue en un univers unitaire, que maintient uni une
      nécessité interne et une ___, tandis qu'il se meut en cercle, gouverné par l'Âme qui le régit, laquelle
      imite à son tour sans cesse le mouvement autopensant de l'Intellect divin
    answer: harmonie
  - id: id3-l3-5
    sentence: L'organisation et l'agencement harmonieux du monde sensible tout entier sont, pour Plotin,
      l'expression d'une ___ cosmique, par laquelle les principes supérieurs déterminent le déroulement
      des phénomènes sensibles.
    answer: Providence
