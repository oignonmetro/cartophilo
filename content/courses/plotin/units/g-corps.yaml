  points:
  - id: g-corps-l1-q1
    sentence: "Le corps, qui ne vit pas par lui-même et ne reçoit de l'âme qu'une trace, se dit en grec translittéré ___."
    answer: sôma
    alt: ["soma", "sōma"]
  - id: g-vegetatif-l1-q14
    sentence: "Un corps qui s'allie à l'âme sans pouvoir la posséder « doit se contenter d'une ___ de la réalité supérieure » (traité 28, chap. 18)."
    answer: trace
    alt: []
  - id: g-corps-l1-q2
    sentence: "La nature est l'âme « qui se trouve dans le voisinage du corps, celle que nous appelons \"nature\" et qui donne au corps une ___ d'elle-même » (traité 28, chap. 20)."
    answer: trace
    alt: []
  - id: g-vegetatif-l1-q15
    sentence: "« Le corps d'un animal et celui d'une plante possède comme une ___ de l'âme » (traité 28, chap. 18)."
    answer: ombre
    alt: []
  - id: g-vegetatif-l1-q26
    sentence: "« C'est par une sorte de ___ que le corps recueille une trace de l'âme, qui n'est pas venue comme une partie de l'âme vient au corps » (traité 22, chap. 15)."
    answer: voisinage
    alt: []
  - id: g-vegetatif-l1-q16
    sentence: "La puissance de la terre donne au végétal « ce par quoi il est différent d'une branche coupée et qui n'est plus un végétal, mais seulement un morceau de ___ » (traité 28, chap. 27)."
    answer: bois
    alt: []
  - id: g-corps-l1-q3
    sentence: "Le corps vivant « ressemble à l'air, non pas lorsqu'il est illuminé, mais lorsqu'il est ___ » (traité 28, chap. 18)."
    answer: échauffé
    alt: []
  - id: g-corps-l1-q4
    sentence: "La preuve que le cadavre garde un temps la trace de l'âme : « les ___ qui continuent de pousser sur les cadavres » (traité 28, chap. 29)."
    answer: cheveux
    alt: []
