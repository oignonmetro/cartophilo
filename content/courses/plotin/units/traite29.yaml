    answer: "chap. 5"
    alt: ["5", "chapitre 5"]
  - id: traite29-l4-p4
    sentence: "Dans le traité 29 de Plotin, la question de la lumière sans air se trouve au ___."
    answer: "chap. 6"
    alt: ["6", "chapitre 6"]
  - id: traite29-l4-p5
    sentence: "Dans le traité 29 de Plotin, l'hypothèse d'un corps hors du ciel est examinée au ___."
    answer: "chap. 8"
    alt: ["8", "chapitre 8"]
