- id: traite29-l2
  title: "La lumière n'est pas un bâton ; l'ouïe"
  notes: |-
    **La lumière de l'œil et celle qui s'étend jusqu'à l'objet** (chap. 4) : même si la lumière sert d'intermédiaire, elle n'est pas un corps et n'a pas à être affectée. Si l'œil a besoin d'une lumière qui n'est pas la sienne, c'est **pour voir de loin**, non pour voir.

    - Si la lumière était animée, la vision ressemblerait **à un toucher** : la puissance visuelle se transporterait jusqu'à son objet.
    - Mais si l'âme restait en elle-même et se servait de la lumière **comme d'un bâton** pour atteindre son objet, la couleur devrait résister, et la connaissance viendrait après coup, par la mémoire et le raisonnement : ce n'est pas le cas.
    - La lumière du soleil nous atteint **en même temps** que l'air ; nous voyons sans que l'air ait été affecté.

    **L'ouïe** (chap. 5) : l'air paraît le principal responsable du son, transmettant le choc jusqu'à l'oreille. Mais les sons diffèrent selon les corps qui se heurtent : **le bronze qui heurte du bronze** ne rend pas le même son que s'il heurte autre chose, alors qu'il n'y a qu'un seul air. Et il y a des bruits sans air intermédiaire : **les grincements d'une articulation** qu'on plie. Le son vient du choc des corps, et devient son en parvenant à la sensation ; ici encore, l'affection suppose **une communauté** entre les sensations, comme dans un vivant.

    ! Le toucher à distance par un bâton n'est pas un modèle de la vue : il transmet après coup, alors que la vue saisit son objet d'un coup.
