id: traite29
title: "Traité 29 (IV, 5) : Sur les difficultés relatives à l'âme III, ou Sur la vue"
subtitle: "La vision sans intermédiaire, la lumière"
icon: compass
color: sky
lessons:
- id: traite29-l1
  title: "Voir sans intermédiaire affecté"
  notes: |-
    **Thèse des chapitres 1 à 3 : la vision ne suppose pas qu'un intermédiaire, l'air ou le « diaphane », soit affecté.** La question avait été différée au traité 28 (IV, 4), 23.

    **Pourquoi la vue seulement ?** La sensation se fait par des organes corporels, semblables aux objets sensibles et en continuité avec eux ; pour le toucher, il y a contact ; pour la vue, il faut se demander s'il faut **un corps intermédiaire entre l'œil et la couleur**.

    - **Les corps denses**, faits de terre, empêchent de voir ; les corps subtils ne sont, au mieux, que des auxiliaires.
    - **La torpille** : le roseau et le fil de la ligne ne subissent pas la même affection que la main du pêcheur, qui pourtant ressent l'engourdissement. La discussion va vers **la sympathie** : ce qui est semblable est affecté par le semblable, et un intermédiaire dissemblable n'est pas affecté de même.

    **Les doctrines de la vision** (chap. 2) :

    | Doctrine | École | Besoin d'un intermédiaire ? |
    | des rayons visuels issus de l'œil | les platoniciens | non : la lumière va en ligne droite |
    | la tension de l'air | les stoïciens | oui, absolument |
    | les simulacres qui se déplacent dans le vide | les épicuriens | non : le vide leur suffit |
    | la sympathie | Plotin | un intermédiaire ne fait qu'affaiblir la sympathie |

    **Les preuves** (chap. 2-3) :

    - un objet **posé sur l'œil** ne se voit pas ;
    - **la nuit**, on voit le feu des phares et des sémaphores, sans que l'obscurité de l'air transmette leur forme ;
    - **c'est tout l'objet qui est vu**, de face ou de biais, de près ou de loin, par tous ceux que l'air enveloppe : chaque partie de l'air le contient tout entier. Une telle affection ne vient pas d'un corps, mais des nécessités d'un vivant unique en sympathie avec lui-même.

    ! Plotin ne nie pas l'intermédiaire : il nie qu'il doive être affecté pour que l'on voie. L'air n'est présent que par accident.
