- id: traite29-l3
  title: "La lumière, activité incorporelle"
  notes: |-
    **Peut-il y avoir de la lumière sans air ?** (chap. 6) Oui. **La lumière n'est pas primitivement une affection de l'air** : elle appartient à tout corps igné et brillant, et même à des pierres à la surface lumineuse.

    | Si la lumière était... | Conséquence |
    | une qualité | il lui faudrait un substrat |
    | une affection de l'air | l'air cesserait d'être obscur ; or il reste ce qu'il est |
    | une activité issue d'un corps | elle se propage sans rien qui la porte, même dans le vide |

    **La lumière est une activité comme la vie** : la vie est l'activité de l'âme, dont le corps peut subir l'effet s'il est présent ; mais l'âme existe même sans le corps.

    **La lumière périt-elle ?** (chap. 7) Non : c'est une activité qui ne s'écoule pas ; elle accompagne sa source tant que rien ne l'en empêche, et ne reflue pas vers elle.

    - **Deux activités** dans un corps lumineux : l'une, sa vie surabondante, la source ; l'autre, à l'extérieur, **une image** de la première, qui n'en est pas séparée. Toute chose a ainsi une activité à sa ressemblance.
    - Les vivants **aux yeux brillants**, comme les chats, ou ceux qui ont un feu en eux, comme les lucioles : leurs ailes refermées, la lumière n'est plus dehors, mais elle n'a pas péri.
    - **« Il faut poser que la lumière est quelque chose de totalement incorporel »**, même si elle est l'activité d'un corps ; « elle est partie » est une façon de parler. Il en va de même de l'image dans un **miroir**, et de l'âme, activité d'une âme antérieure.
    - La vie du corps, quand il se corrompt, n'a pas péri : **elle est l'image d'une illumination**, qui n'est plus là.

    **Un corps hors du ciel** (chap. 8) : un œil « sur le dos de notre monde » (*Phèdre*, 247b) le verrait-il ? Non : sans la sympathie d'un vivant unique, il n'y aurait **ni sujets sentants ni objets sensibles**. L'hypothèse se détruit elle-même : elle dit à la fois « âme » et « non âme », « semblables » et « non semblables ».

    ! La lumière ne se perd pas quand elle cesse d'éclairer un lieu : comme l'activité de l'âme, elle reste attachée à sa source.
