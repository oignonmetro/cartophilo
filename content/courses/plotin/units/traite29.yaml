- id: traite29-l4
  title: "Repérage : le plan du traité 29"
  notes: |-
    **Le traité 29 examine l'intermédiaire de la perception, la vue puis l'ouïe (chap. 1-5), puis trois questions diverses (chap. 6-8).**

    | Moment | Lieu | Ce qui s'y joue |
    | introduction | 1, 1-13 | la sensation par des organes |
    | la vue par sympathie | 1, 13-40 | la torpille |
    | les doctrines de la vision | 2, 1-15 | rayons, tension, simulacres |
    | la lumière comme intermédiaire | chap. 3-4 | les phares la nuit ; le bâton |
    | l'ouïe | chap. 5 | le bronze ; les articulations |
    | la lumière sans air | chap. 6 | une activité comme la vie |
    | la lumière ne périt pas | chap. 7 | l'image d'une illumination |
    | un corps hors du ciel | chap. 8 | une hypothèse contradictoire |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! La vue occupe presque tout le traité (1, 13 à 4, 39) : d'où son second titre, Sur la vue.
  points:
  - id: traite29-l4-p1
    sentence: "Dans le traité 29 de Plotin, l'exemple de la torpille se trouve en ___."
    answer: "1, 13-40"
    alt: ["chap. 1, 13-40"]
  - id: traite29-l4-p2
    sentence: "Dans le traité 29 de Plotin, l'examen des doctrines de la vision se trouve en ___."
    answer: "2, 1-15"
    alt: ["chap. 2, 1-15"]
  - id: traite29-l4-p3
