lessons:
- id: g-joie-tristesse-l1
  title: Joie / Tristesse
  notes: |-
    Chez Plotin, la {violet}**joie**{/violet} et la {violet}**tristesse**{/violet} sont [def]. Elles ne sont pas {pink}deux mouvements contraires d'une même âme{/pink} : la tristesse est au corps vivant, la vraie joie est là-bas.

    __**La tristesse et le plaisir sensibles sont des affections du composé, dont l'âme prend connaissance sans pâtir.**__ Plotin part d'une question : « À qui peuvent bien appartenir les plaisirs et les douleurs, les peurs ainsi que les audaces, les désirs, les aversions et les souffrances ? » ([[traite53|traité 53]], chap. 1). Pas à l'âme elle-même, car si l'âme et son être ne font qu'un, « l'âme est une forme qui __ne reçoit pas toutes ces activités qu'elle confère à un autre__ qu'elle » (chap. 2) : elle donne la vie, elle ne la subit pas. Elle se sert du corps comme d'un instrument, et il n'est donc « pas nécessaire qu'elle reçoive les affections qui viennent à travers le corps, __pas plus que les artisans ne ressentent les affections qu'éprouvent leurs instruments__ » (chap. 3). Pas au corps seul non plus, puisqu'un corps sans vie ne sent rien. Elles appartiennent au vivant, que l'âme produit « à partir du corps qualifié et d'une sorte de lumière venue d'elle-même » ; c'est à ce vivant « __qu'appartiennent la faculté de sentir et toutes les affections__ » (chap. 7 ; voir [[g-vivant|vivant]] et [[g-union-ame-corps|union de l'âme et du corps]]). D'où la définition : « la douleur c'est __la connaissance du retrait__ qu'opère le corps en train d'être privé de l'image d'une âme, tandis que le plaisir c'est la connaissance que prend un être vivant du fait que l'image d'une âme revient une fois de plus s'adapter à un corps » ([[traite28|traité 28]], chap. 19). L'altération est dans le corps ; l'âme n'en a que la connaissance. Celui qui rougit ou pâlit n'y prend pas garde, mais « c'est à cause de l'âme que surviennent ces affections, mais qu'elles __se produisent dans un composé différent de l'âme__ » ([[traite26|traité 26]], chap. 3).

    __**Loin du Bien, l'âme ne s'attriste pas : elle s'isole et s'amoindrit.**__ N'y a-t-il pas pourtant une tristesse de l'âme elle-même, celle qui s'est éloignée de son principe ? Plotin ne parle pas de peine, mais de perte : auprès du Bien, « c'est là qu'est notre bien-être. Au contraire, le fait d'être loin de lui implique que __nous sommes seuls et que nous sommes amoindris__ » ([[traite9|traité 9]], chap. 9). L'âme qui se détourne, « devenue une partie, __elle s'isole, s'affaiblit, s'affaire__, porte ses regards vers la partie » ([[traite6|traité 6]], chap. 4). Pourquoi un amoindrissement et non une souffrance ? Parce que la souffrance est une affection du composé, et que l'âme, qui ne pâtit pas, ne peut que perdre de son activité. Et pourquoi ne le sent-elle pas comme une peine ? Parce qu'elle a oublié ce qu'elle a perdu. Elle s'est éloignée en voulant une vie à part : l'origine du mal, pour les âmes, « c'est bien l'audace, la génération, l'altérité première et __le fait de vouloir s'appartenir à elles-mêmes__ » ([[traite10|traité 10]], chap. 1 ; voir [[g-tolma|audace]]). Puis, à force d'admirer ce qu'elle a trouvé ici, elle ne sait plus d'où elle vient : « l'estime des choses d'ici-bas et le manque d'estime d'elles-mêmes sont __la cause de leur ignorance totale du dieu__ » (*ibid*.). On ne regrette pas ce qu'on ignore.

    __**La vraie joie est là-bas, et ce n'est pas un plaisir, parce que son objet ne change pas.**__ « Car là-bas il y a __la vraie joie__, et ce qu'il faut aimer et désirer au plus haut point, qui n'est sujet ni au devenir ni au mouvement » ([[traite38|traité 38]], chap. 30). Pourquoi la joie se distingue-t-elle du plaisir ? Plotin donne un signe à quoi l'on reconnaît le bien : « La preuve que l'on a trouvé le Bien réside dans le fait que l'on devient meilleur, et que l'on n'éprouve plus de regrets, que l'on est dans un état de plénitude quand on est près de lui, et que __l'on ne cherche plus rien__ » (chap. 26). Or le plaisir fait chercher encore : « le plaisir ne se suffit pas, car il n'apprécie pas d'avoir le même objet, car quelle que soit la chose qui donne du plaisir, ce n'est jamais la même. __Ce à quoi on prend plaisir, c'est toujours quelque chose d'autre__ » (*ibid*.). Le plaisir n'est donc pas le bien, et le bien n'est pas l'affection qu'on éprouve en l'atteignant : « reste vide celui qui croit que c'est cela le bien » (*ibid*.). La joie, elle, accompagne la présence d'un bien qui ne change pas, et c'est pourquoi elle dure : « C'est là aussi que l'âme __trouve son repos__ et qu'elle échappe aux maux, car elle est remontée jusqu'au lieu qui est pur de tout mal » ([[traite9|traité 9]], chap. 9). Ce repos n'est pas une torpeur. Devant la beauté véritable, l'âme éprouve « l'effroi, le saisissement plaisant, le désir, l'amour et __la stupeur accompagnée de plaisir__ » ([[traite1|traité 1]], chap. 4 ; voir [[g-beaute|beauté]]).

    | | Le plaisir | La joie |
    | Qui l'éprouve | le vivant, composé du corps et d'une trace de l'âme | l'âme auprès du Bien |
    | Son objet | toujours autre | ni en devenir ni en mouvement |
    | Ce qu'il laisse | le désir d'autre chose | on ne cherche plus rien |

    __**Le sage est toujours serein : le chagrin ne touche en lui que ce qui est privé d'intellect.**__ Le sage a des plaisirs, mais d'une autre sorte : « des plaisirs qui accompagnent la présence des biens, parce qu'ils __ne sont ni en mouvement ni par conséquent en devenir__. Car les biens sont déjà présents, et le sage est déjà présent à lui-même » ([[traite46|traité 46]], chap. 12). Rien ne lui manque, il n'a rien à acquérir : son plaisir ne peut donc pas passer comme passe un plaisir qui comble un manque. « Et ce plaisir qui reste stable, __c'est la sérénité__ : le sage est toujours serein, son état d'esprit est tranquille et sa disposition d'esprit est satisfaite, elle que rien de ce que l'on dit être des maux ne perturbe » (*ibid*.). Mais quand meurent ses proches ? Il souffre, mais ce n'est pas lui qui souffre : « même si la perte de parents et de proches cause du chagrin, __ce n'est pas à lui qu'elle en cause__, mais à ce qui, en lui, est dépourvu d'intellect et dont il ne partagera pas les souffrances » (chap. 4). C'est la distinction du composé et de l'âme, appliquée au sage : « la partie qui souffre est une chose, ce qui lui est uni en est une autre ; et cette dernière, tout le temps où elle est nécessairement unie à ce qui souffre, __ne sera pas privée de la vision du bien universel__ » (chap. 13 ; voir [[g-souffrance|souffrance]]). Ce qui s'attriste en lui, il le traite comme un enfant : « la peine qu'éprouve __l'enfant qui pour ainsi dire se trouve en lui__, affligé par le chagrin, il l'apaisera soit par l'argumentation, soit par la menace, mais ce sera par une menace dépourvue de passion » (chap. 15). C'est vrai de chacun, et pas seulement du sage : devant les malheurs de la vie, « ce n'est pas l'âme qui est en nous mais __son ombre, l'homme extérieur__, qui gémit, qui se plaint et qui incarne tous les rôles que les hommes incarnent dans ce théâtre qu'est la terre entière » ([[traite47|traité 47]], chap. 15 ; voir [[g-mort|mort]]) ; le sage est seulement celui qui le sait. Et même dans la douleur, « l'éclat qui est en lui continuera de briller __comme la lumière d'une lanterne__, lorsque dehors souffle le vent violent d'une forte tempête et de l'orage » ([[traite46|traité 46]], chap. 8) : le vent agite ce qui est dehors, la flamme reste à l'abri. Les astres vont plus loin encore, qui n'ont pas même d'enfant à apaiser : « il ne faut pas accorder qu'elles sont chagrines à un moment ou heureuses à un autre. Au contraire, il faut soutenir qu'elles se trouvent toujours dans un état de béatitude et __qu'elles se réjouissent des biens qu'elles possèdent__ et de ce qu'elles contemplent » ([[traite52|traité 52]], chap. 3).

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 9, chap. 9 | loin du Bien, seuls et amoindris ; auprès de lui, le repos |
    | traité 10, chap. 1 | l'audace, et l'oubli du dieu |
    | traité 28, chap. 19 | douleur et plaisir, connaissance d'un retrait et d'un retour |
    | traité 38, chap. 26 | le plaisir change d'objet ; le bien trouvé, on ne cherche plus rien |
    | traité 38, chap. 30 | là-bas, la vraie joie |
    | traité 46, chap. 12 | la sérénité, plaisir stable du sage |
    | traité 46, chap. 15 | l'enfant en lui, qu'il apaise |
    | traité 53, chap. 7 | les affections appartiennent au vivant |

    **Voir aussi** : [[g-bien-etre|Bien-être]] · [[g-bonheur|Bonheur]] · [[g-souffrance|Souffrance]] · [[g-desir|Désir]] · [[g-vivant|Vivant]] · [[g-union-ame-corps|Union de l'âme et du corps]]
