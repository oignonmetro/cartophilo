- id: traite34-l2
  title: "Le nombre dans l'être, règle du déploiement des êtres"
  notes: |-
    **Comment le nombre est-il dans l'intelligible ?** (chap. 4) Trois hypothèses : il s'ajoute aux Formes ou les accompagne ; il naît avec chaque Forme ; il existe en soi. Quand Platon dit que les hommes ont pensé le nombre en observant **la succession des jours et des nuits** (*Timée*), il veut dire que l'âme réveille en elle la notion du nombre, qui existe dans l'être.

    - **Pas un simple aspect des choses** (chap. 5) : les pythagoriciens appelaient **tétrade la justice**. Mais un accident doit être quelque chose avant d'être un accident : l'un, attribué à l'homme, au mouvement, à l'être, leur est antérieur ; la dizaine suppose **la décade en soi**.
    - **Les Formes ne sont pas produites par la pensée** (chap. 6) : ce n'est pas parce qu'on a pensé la justice qu'elle existe. Dans l'intelligible, la réalité est elle-même pensée ; la justice y est **comme une statue pourvue d'un intellect**.

    **Où se trouve le nombre ?** (chap. 7-9) Les intelligibles sont **tout ensemble** dans l'Intellect. Dans la triade, l'être vient en premier, puis l'intellect, son acte, puis le vivant qui embrasse tout. Le nombre ne peut être ni dans le vivant, ni dans l'intellect : **il est dans l'être**.

    | Réalité | Nombre |
    | l'être | le nombre unifié |
    | les êtres | le nombre déroulé |
    | l'Intellect | le nombre mû en lui-même |
    | le Vivant | le nombre qui embrasse |

    La puissance du nombre a divisé l'être et lui a fait ressentir **les douleurs de l'enfantement**. Le **nombre essentiel** est dans l'être et avant les êtres ; le nombre **« monadique »** en est l'image.

    **Le nombre précède les êtres** (chap. 10) : comme on dit « je veux telle quantité d'or ou tant de maisons », on applique un nombre qu'on a déjà. Si les êtres venaient avant le nombre, ils seraient aussi nombreux **par hasard**, non par dessein.

    ! Placer le nombre avant les êtres ne revient pas à faire des nombres des principes : l'Un reste au-delà, et le nombre est dans l'être qui en vient.
