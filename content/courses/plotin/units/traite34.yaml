- id: traite34-l4
  title: "Nombres nombrants et nombre illimité"
  notes: |-
    **Reprendre depuis le début** (chap. 15) : là-bas, l'être total est à la fois **être, intellect et vivant parfait**. Le vivant parfait doit être le nombre total ; le nombre est donc antérieur à tout vivant. C'est avec le nombre que l'être engendre les êtres : il s'est scindé en autant d'êtres que le nombre en comportait. Le nombre premier et véritable est **« le principe et la source »** de leur existence.

    **Deux sortes de nombres** (chap. 15-16) :

    | Nombre | Nature | Exemple |
    | nombrant, essentiel | dans la réalité, il en assure la cohésion | l'homme en soi, dualité de « vivant » et « rationnel » |
    | nombré, du compte | une quantité, produite par celui qui compte | dix hommes qu'on énumère |

    Une dizaine d'hommes comptés un à un n'a d'existence que dans celui qui compte ; un **chœur** ou une armée ont, en plus, quelque chose d'extérieur à lui. **L'âme est un nombre**, s'il est vrai qu'elle est une réalité.

    **Le nombre illimité** (chap. 17-18) :

    - comme la **ligne illimitée**, il ne désigne pas une chose existante, mais la possibilité de concevoir toujours plus grand ;
    - la ligne intelligible est illimitée en ce sens que l'idée de limite n'est pas incluse dans son concept ; les **figures** existent là-bas avant les corps : la **pyramide** est donnée au feu de là-bas, que le feu d'ici veut imiter ;
    - là-bas, on ne peut concevoir un nombre plus grand : il est **tout ensemble**. Nul être véritable n'est lié par une limite : les intelligibles sont tous **des mesures**, et donc beaux.

    **Parménide a donc raison de dire que l'être est un** : il tient son être de lui-même, et toutes choses, charmées, se suspendent à lui.

    ! Le nombre intelligible n'est pas limité de l'extérieur : il est mesure, et c'est en ce sens, du point de vue de la puissance, qu'on peut le dire illimité.
