- id: traite34-l5
  title: "Repérage : le plan du traité 34"
  notes: |-
    **Le traité 34 part du nombre illimité (chap. 1-3), traite longuement du nombre (chap. 4-16), puis revient au nombre illimité (chap. 17-18).**

    | Moment | Lieu | Ce qui s'y joue |
    | la multiplicité | 1, 1-8 | un éloignement de l'Un |
    | la grandeur | 1, 8-29 | l'univers grand et beau |
    | l'illimitation | chap. 2-3 | le nombre est limité ; le filet |
    | le nombre intelligible | chap. 4 | les jours et les nuits |
    | le nombre comme notion, comme accident | chap. 5 | la tétrade et la justice |
    | le nombre existant en soi | chap. 6 | une statue pourvue d'un intellect |
    | contempler l'intelligible | chap. 7 | tout ensemble |
    | le nombre dans l'être | chap. 8 | avant l'Intellect et le Vivant |
    | le nombre dans l'être et avant lui | chap. 9 | le nombre unifié, déroulé |
    | le nombre, image de l'intelligible | chap. 10 | tant de maisons |
    | la décade, ensemble d'unités ? | chap. 11 | l'objection d'Aristote |
    | pas d'unité en soi ? | chap. 12 | l'armée, la fête |
    | des degrés dans l'un | chap. 13 | la maison et l'armée |
    | l'un n'est pas un relatif | chap. 14 | par la présence de l'un |
    | nombres nombrés, nombres nombrants | chap. 15 | le principe et la source |
    | nombres substantiels, nombres monadiques | chap. 16 | le chœur ; l'âme, un nombre |
    | la ligne et les figures intelligibles | chap. 17 | la pyramide du feu |
    | le nombre et les êtres intelligibles | chap. 18 | l'être est un |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! La question posée au chapitre 2 n'est résolue qu'aux chapitres 17-18 : tout l'examen du nombre est une digression pour y répondre.
