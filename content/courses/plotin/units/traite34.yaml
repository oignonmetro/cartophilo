- id: traite34-l3
  title: "Objections : ni collection, ni affection, ni relation"
  notes: |-
    **Trois objections, trois réponses** (chap. 11-14) :

    | Objection | Tenants | Réponse de Plotin |
    | la dizaine n'est qu'un ensemble d'unités | Aristote, contre les unités platoniciennes | le nombre est l'unité d'une pluralité, non une addition |
    | l'un et les nombres sont des affections ou des notions de l'âme | les stoïciens | l'un n'est pas un « exprimable » vide : on ne pense rien sans lui |
    | l'un et le deux sont des relatifs | | le deux naît aussi bien de la division que de l'addition : ce n'est pas un rapport |

    - **Une nature qui engendre continûment** (chap. 11) produirait les nombres plus petits en s'arrêtant plus tôt, les plus grands en allant plus loin ; chaque être doit correspondre à un nombre déterminé.
    - **L'armée, la fête** (chap. 12-13) : les stoïciens disent que la multitude, comme une **foule** ou **une armée**, n'est rien en dehors des choses rassemblées ; de même « à droite », « en haut ». Plotin répond : la raison discursive ne dit pas « un » à propos de rien ; elle voit l'unité qui résulte de l'ordre. Et l'un a des degrés : il est plus un **dans une maison que dans une armée**, plus encore dans le continu et l'indivisible ; or il n'y a pas de plus et de moins dans ce qui n'est pas.
    - **On ne peut rien penser sans l'un** (chap. 13) : dire « quelque chose », c'est dire « un ». Ce sans quoi on ne peut ni penser ni parler doit préexister à la pensée et au discours.
    - **La cause du nombre** (chap. 14) : une chose est **une par la présence de l'un**, deux par la présence de la dualité, comme elle est blanche par la présence du blanc et belle par la présence du beau.

    ! Dire que l'un est partout présent dans le sensible n'en fait pas une propriété sensible : la raison discursive ne le connaît que comme un intelligible.
