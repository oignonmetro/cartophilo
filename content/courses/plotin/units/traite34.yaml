lessons:
- id: traite34-l1
  title: "Le nombre illimité : la question du traité"
  notes: |-
    **Une longue tradition** de traités *Sur les nombres* : Speusippe, Xénocrate, Théophraste, des pythagoriciens, Numénius, Nicomaque de Gérase, Théon de Smyrne ; et contre eux, Sextus Empiricus. Mais **le traité 34 ne porte pas d'abord sur les nombres** : ses treize chapitres sur le nombre sont une longue digression, pour répondre à une question du *Parménide* (144a) sur le **« nombre illimité »**.

    **Ni arithmologie, ni technique** : à la différence d'**Amélius**, Plotin ne fait aucun usage religieux des nombres ; et il n'était pas, dit Porphyre, préparé à travailler à fond les mathématiques (*Vie de Plotin*, 14). Sa visée est **ontologique et cosmologique** : les êtres sont-ils en nombre illimité ?

    **La multiplicité et la grandeur** (chap. 1) : la multiplicité est un éloignement de l'Un ; une chose s'écoule et s'étend en s'éparpillant. **« Si on s'apercevait qu'on s'étend, ce serait effrayant »** : car on sortirait de soi. Être davantage, ce n'est pas devenir grand, mais **s'appartenir**. Et pourtant l'univers est grand et beau : parce qu'il est **enveloppé par l'un**, et que **la grandeur est une matière pour le beau**.

    **Le nombre est limité** (chap. 2) : les choses sensibles ne sont pas en nombre illimité ; même en comptant le passé et le futur, on les garde dans une limite. **Ce n'est pas celui qui compte qui engendre le nombre** : il est déjà limité et fixé dans l'intelligible.

    **L'illimitation pure** (chap. 3) : la multiplicité des êtres n'est pas un mal, car elle est unifiée et a trouvé son repos. L'illimité, la matière, **fuit la limite**, mais il est rattrapé et enveloppé par elle du dehors ; si l'on veut le saisir **sans jeter sur lui une limite comme un filet**, il s'échappe : on ne le pense qu'en mettant la forme de côté.

    ! Le « nombre illimité » n'est pas une question d'arithmétique : il s'agit de savoir si la réalité contient un ensemble d'êtres sans limite.
