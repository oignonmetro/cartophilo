id: id4
title: Participation et temporalité de l'âme
subtitle: Du sensible à l'intelligible, l'individuation des âmes
icon: infinity
color: green
group: La métaphysique du sensible
lessons:
- id: id4-l1
  title: La participation du sensible à l'intelligible
  notes: |-
    Le terme technique par lequel Plotin désigne {green}la relation des choses sensibles aux réalités intelligibles{/green} est la {blue}***methexis***{/blue} (« participation »).

    - {red}Cette participation ne s'effectue jamais par une extension des êtres intelligibles dans l'espace{/red} : incorporels, ils sont incapables de **s'étendre dans l'espace** : {coral}l'existence même de l'espace dépend au contraire de la présence de **corps perceptibles**{/coral}.
    - Les entités intelligibles sont omniprésentes {coral}parce qu'elles forment ensemble une totalité unitaire et autosuffisante{/coral}, dont les parties sont {amber}**pleinement et mutuellement corrélées**{/amber}.
    - Ce sont les choses sensibles qui, par leur mise en forme graduelle, deviennent susceptibles de recevoir l'activité des êtres intelligibles, en faisant écho à certaines de leurs caractéristiques sous la forme d'{violet}**images ou de traces**{/violet}.

    ! {amber}Les relations causales vont toujours du supérieur vers l'inférieur{/amber} : la participation ne se manifeste que lorsque la **réponse** requise, au niveau inférieur, se produit : {yellow}l'apparition des fonctions vitales dans un corps{/yellow}, par exemple, est postérieure à sa constitution organique par l'Âme cosmique, qui le rend seulement capable de **recevoir** les puissances psychiques.

    Cette manifestation progressive culmine, chez l'être humain, avec l'apparition des {violet}**facultés rationnelles**{/violet} : en tant que {violet}**microcosme**{/violet}, la structure humaine reflète la constitution d'ensemble du macrocosme sensible.
  points:
  - id: id4-l1-1
    sentence: "Le **terme technique** par lequel Plotin désigne __la relation des choses sensibles aux réalités intelligibles__ se nomme la ___."
    answer: participation
  - id: id4-l1-2
    sentence: "Terme original, translittéré, __désignant la « **participation** » des choses sensibles aux réalités intelligibles__ : ___."
    answer: methexis
  - id: id4-l1-3
    sentence: "La participation des choses sensibles aux réalités intelligibles __ne s'effectue jamais par une extension de ces dernières dans l'espace__ occupé par les premières, parce que les êtres intelligibles sont, en tant qu'entités **incorporelles**, dans l'incapacité de ___."
    answer: s'étendre dans l'espace
  - id: id4-l1-4
    sentence: "__L'existence même de l'espace__, dans lequel les êtres intelligibles ne sauraient s'étendre, **dépend en réalité** de la présence de ___."
    answer: corps perceptibles
    alt:
    - corps sensibles
  - id: id4-l1-5
    sentence: "__L'omniprésence des entités intelligibles tient au fait qu'__elles constituent ensemble une **totalité unitaire et autosuffisante**, dont les parties sont ___."
    answer: pleinement et mutuellement corrélées
  - id: id4-l1-6
    sentence: "Ce sont les choses sensibles qui, par leur **mise en forme graduelle**, __deviennent susceptibles de recevoir l'activité des êtres intelligibles__ et de s'y conformer, en faisant écho à certaines de leurs caractéristiques sous la forme d'___."
    answer: images ou de traces
  - id: id4-l1-7
    sentence: "__Si les relations causales vont toujours du niveau supérieur vers le niveau inférieur__, la « participation » à la réalité supérieure s'effectue chaque fois selon la **capacité propre du niveau inférieur** à recevoir quelque chose qui, bien que déjà présent en lui, ne se manifeste que lorsque la ___ requise se produit."
    answer: réponse
    alt:
    - adéquation
  - id: id4-l1-8
    sentence: "__L'apparition des fonctions vitales dans un corps vivant est postérieure à sa constitution organique__ par **l'Âme cosmique**, laquelle le rend seulement capable de ___ les puissances psychiques qui se manifesteront ensuite dans les activités de la vie."
    answer: recevoir
  - id: id4-l1-9
    sentence: "__La présence graduelle et toujours plus complexe des fonctions vitales dans un organisme__ permet la manifestation d'échos progressivement plus élevés et plus complets en provenance du domaine intelligible, culminant avec l'apparition, **chez l'être humain**, de ___."
    answer: facultés rationnelles
  - id: id4-l1-10
    sentence: "En tant que ___, __la structure de **l'être humain** reflète la constitution d'ensemble du macrocosme sensible__."
    answer: microcosme
- id: id4-l2
  title: Le temps et l'individuation des âmes
  notes: |-
    Ce qui distingue les différents niveaux ontologiques du système plotinien les uns des autres est, en dernière analyse, {green}leur degré d'**unité**{/green}.

    - À la différence des corps, divisibles à l'infini, l'âme (composée, selon la psychogonie du {sky}*Timée*{/sky}, d'un élément divisible et d'un élément indivisible) ne se répartit jamais dans le corps : elle demeure présente **tout entière** dans chacune de ses parties, {coral}ce qui lui permet de manifester une vie unitaire{/coral}, un {blue}***bios***{/blue} (mode de vie) cohérent.
    - Le {violet}**temps**{/violet} résulte directement de la succession des {violet}**actes psychiques**{/violet} de l'âme : incapable de saisir d'un coup la structure atemporelle des intelligibles qu'elle contemple, elle est contrainte de les reprendre un à un : {coral}cette approche discursive engendre à la fois le temps et **le mouvement**{/coral}.

    Prises ensemble, les âmes forment une hypostase unitaire, {violet}**« une et multiple »**{/violet} ({blue}*hen kai polla*{/blue}), reliées par des relations de {blue}***sungeneia***{/blue} (parenté) qui leur permettent de communiquer sans que leur individualité en soit compromise.

    - L'individuation de chaque âme, une fois écartée toute référence au corps, dépend de {violet}**la perspective**{/violet} propre selon laquelle elle contemple les intelligibles.
    - Le foyer de sa conscience ({amber}le « je », que Plotin désigne par « nous »{/amber}) se situe dans la faculté {violet}**représentative**{/violet} ({blue}*phantasia*{/blue}) ; parce qu'il peut se réorienter tantôt vers l'intelligible, tantôt vers le corporel, Plotin qualifie l'âme d'{violet}**amphibie**{/violet}.

    ! {red}L'âme incorporelle ne subit jamais directement les affections du corps{/red} : elle a seulement la capacité d'en **prendre conscience**. C'est aussi ce qui explique la réincarnation : les puissances demeurées inactives dans une phase de la carrière de l'âme peuvent **resurgir** dans une phase ultérieure.
  points:
  - id: id4-l2-1
    sentence: "__Ce qui distingue les différents niveaux ontologiques du système plotinien__ les uns des autres, **en dernière analyse**, est leur degré respectif d'___."
    answer: unité
  - id: id4-l2-2
    sentence: "À la différence des corps, divisibles à l'infini, __l'âme, composée selon la psychogonie du Timée d'un élément divisible et d'un élément indivisible__, **ne se répartit jamais** dans le corps qu'elle anime : elle demeure présente ___ dans chacune de ses parties."
    answer: tout entière
  - id: id4-l2-3
    sentence: "__L'œuvre platonicienne dont Plotin reprend, pour l'âme, la distinction__ entre un **élément divisible** et un **élément indivisible**, se nomme le ___."
    answer: Timée
  - id: id4-l2-4
    sentence: "Le fait que l'âme demeure présente **tout entière** dans chacune des parties du corps qu'elle anime __lui permet de manifester, comme activité primaire, une vie unitaire__ coordonnant l'ensemble des facultés du corps vivant en un ___ cohérent."
    answer: mode de vie
    explanation: En grec, `bios`.
  - id: id4-l2-5
    sentence: __**Le temps**, chez Plotin, résulte directement de la succession des__ ___ particuliers de l'âme.
    answer: actes psychiques
  - id: id4-l2-6
    sentence: "L'âme est contrainte, par nature, de reprendre un à un les éléments de la structure atemporelle des réalités intelligibles qu'elle contemple, __faute de pouvoir les saisir tous ensemble dans leur totalité__ : c'est cette **approche discursive et distributive** qui engendre, dans le monde sensible, à la fois **le temps** et ___."
    answer: le mouvement
  - id: id4-l2-7
    sentence: "__Prises ensemble, les âmes forment une **hypostase unitaire**__ souvent décrite, selon une expression grecque, comme « ___ »."
    answer: une et multiple
    explanation: En grec, `hen kai polla`.
  - id: id4-l2-8
    sentence: "Bien que **nombreuses et distinctes** les unes des autres, __les âmes demeurent reliées par des relations de__ ___, qui leur permettent de participer à des expériences communes sans que l'individualité de chacune en soit compromise."
    answer: parenté
    explanation: En grec, `sungeneia`.
  - id: id4-l2-9
    sentence: "__La solution que Plotin apporte au problème de l'individuation des âmes__, une fois écartée toute référence à leur rapport avec le corps qu'elles animent, consiste à faire dépendre l'individualité de chaque âme de ___ propre selon laquelle **elle contemple les êtres intelligibles**."
    answer: la perspective
  - id: id4-l2-10
    sentence: "__Le foyer de la conscience de l'âme__, le « je » que Plotin désigne habituellement par le pronom **« nous »**, se situe communément dans la faculté ___."
    answer: représentative
    explanation: En grec, `phantasia`.
  - id: id4-l2-11
    sentence: "__Parce que l'attention de son foyer de conscience peut se réorienter__ tantôt vers les **entités supérieures** du domaine intelligible, tantôt vers les **expériences corporelles**, Plotin qualifie l'âme d'___."
    answer: amphibie
  - id: id4-l2-12
    sentence: "En tant qu'**entité incorporelle**, __l'âme ne participe jamais directement des affections que subit le corps__ qu'elle anime, mais possède seulement la capacité d'en ___ et d'y ajuster, le cas échéant, ses réactions."
    answer: prendre conscience
  - id: id4-l2-13
    sentence: "Chez Plotin, **la réincarnation d'une âme** n'est que la conséquence de la manière dont celle-ci active ses puissances : __les puissances demeurées inactives dans une phase de sa carrière temporelle__ peuvent ainsi ___ dans une phase ultérieure."
    answer: resurgir
    alt:
    - réapparaître
