id: "t7c2"
title: "Les deux actes (7 [V, 4], 2)"
subtitle: "Traité 7, Comment vient du premier ce qui est après le premier, et sur l'Un, chapitre 2, l. 27-48"
group: "Traité 7 (V, 4) : Comment vient du premier ce qui est après le premier"
icon: "page"
color: "coral"
depth: "normale"
lessons:
- id: "t7c2-p1"
  title: "L'acte de la réalité et l'acte qui en provient"
  notes: ""
  passage:
    label: "l. 27-33"
    part: "Les deux actes"
    text: |-
      – Mais comment naît-il alors que celui-ci demeure inchangé ?

      – En chaque chose, il y a un acte qui appartient à la réalité et un acte qui provient de la réalité ; l'acte qui appartient à la réalité est la chose elle-même, et l'acte qui provient de la réalité doit à tous égards en être la conséquence nécessaire, tout en étant différent de la chose elle-même.
  points: []
- id: "t7c2-p1b"
  title: "L'exemple du feu"
  notes: ""
  passage:
    label: "l. 27-33"
    part: "Les deux actes"
    text: |-
      Ainsi en va-t-il du feu, pour lequel il y a la chaleur qui constitue sa réalité, et une autre chaleur qui naît de la première puisque le feu exerce l'acte qui est naturellement inhérent à sa réalité tout en restant du feu.
  points: []
- id: "t7c2-p2"
  title: "Une grande puissance"
  notes: ""
  passage:
    label: "l. 33-37"
    part: "L'acte qui naît de l'intelligible"
    text: |-
      Il en va bien de même pour l'intelligible ; et même davantage encore, car, lorsqu'il demeure « dans son état habituel », l'acte engendré par la perfection et par l'acte qui sont en lui acquiert l'existence. Dans la mesure où il provient d'une grande puissance, et même de la plus grande de toutes les puissances, il atteint l'être et la réalité.
  points: []
- id: "t7c2-p3"
  title: "Puissance de toutes choses"
  notes: ""
  passage:
    label: "l. 37-43"
    part: "Au-delà de la réalité et de l'Intellect"
    text: |-
      Car le Premier est « au-delà de la réalité » ; il est puissance de toutes choses, et il est d'emblée toutes les choses. Si l'Intellect est toutes choses, l'Un est au-delà de toutes les choses. Il est par conséquent au-delà de la réalité.
  points: []
- id: "t7c2-p3b"
  title: "Antérieur à toutes choses"
  notes: ""
  passage:
    label: "l. 37-43"
    part: "Au-delà de la réalité et de l'Intellect"
    text: |-
      Mais si l'Intellect est toutes choses et si l'Un n'est pas sur un pied d'égalité avec toutes choses, mais antérieur à elles, alors il faut encore, pour cette raison, qu'il soit au-delà de la réalité, c'est-à-dire au-delà de l'Intellect ; de là suit qu'il y a quelque chose au-delà de l'Intellect.
  points: []
- id: "t7c2-p4"
  title: "Ce qui est n'est point un cadavre"
  notes: ""
  passage:
    label: "l. 43-48"
    part: "L'Intellect et ses objets"
    text: |-
      Car ce qui est n'est point un cadavre, ce n'est pas non plus quelque chose privé de vie ou quelque chose qui ne fait pas acte d'intellection : l'Intellect et l'être sont vraiment une seule et même chose.
  points: []
- id: "t7c2-p4b"
  title: "L'Intellect est lui-même ses objets"
  notes: ""
  passage:
    label: "l. 43-48"
    part: "L'Intellect et ses objets"
    text: |-
      À la différence en effet de la sensation qui porte sur des objets sensibles, l'Intellect ne porte pas sur des objets qui existent avant lui ; l'Intellect est lui-même ses objets (si toutefois il est vrai qu'il ne reçoit pas leurs Formes d'ailleurs ; d'où viendraient-elles en effet ?). En réalité, l'Intellect est ici avec ses objets, il est identique à eux, il ne fait qu'un avec eux ; aussi la science des objets immatériels est-elle identique à ses objets.
  points: []
