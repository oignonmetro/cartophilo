- id: traite7-l8
  title: "Repérage : le plan du traité 7"
  notes: |-
    **Le traité 7 tient en deux chapitres, qui suivent l'ordre des questions posées.** Le chapitre 1 dit ce qu'est l'Un et pourquoi il produit : ce qu'il doit être pour être premier (un, simple, parfait), puis pourquoi, parfait, il produit nécessairement. Le chapitre 2 dit ce qu'il produit et comment : ce qu'est l'Intellect (une dualité), comment il naît (image d'un intelligible qui demeure), par quel mécanisme (les deux actes), et ce qui en résulte (l'Un au-delà de l'Intellect, l'Intellect identique à l'être).

    | Moment | Lieu | Ce qui s'y joue |
    | le Premier est un, simple et parfait | 1, 1-23 | s'il y a quelque chose après lui |
    | l'Un parfait produit | 1, 23-41 | il doit nécessairement produire quelque chose |
    | la dualité de l'Intellect | 2, 1-12 | intellection et Formes intelligibles |
    | l'intelligible | 2, 12-22 | il demeure auprès de lui-même |
    | la naissance de l'Intellect | 2, 22-27 | une imitation et une image du Premier |
    | les deux actes | 2, 27-36 | l'exemple du feu |
    | l'Un au-delà de la réalité | 2, 36-43 | donc au-delà de l'Intellect |
    | l'Intellect identique à ses objets | 2, 43-48 | l'être n'est pas un cadavre |

    ! Les deux actes (2, 27-36) viennent après la naissance de l'Intellect : ils expliquent comment elle se fait sans que l'Un change.
  points:
  - id: traite7-l8-q1
    sentence: "Dans le traité 7 de Plotin, l'établissement de ce que doit être le Premier, s'il y a quelque chose après lui (un, simple et parfait), occupe ___."
    answer: "1, 1-23"
    alt: ["chap. 1, 1-23"]
  - id: traite7-l8-q2
