- id: traite7-l5
  title: "L'Un demeure, l'Intellect est son image (2, 12-27)"
  notes: |-
    L'Intellect naît sans que l'Un change : il en est l'image, distincte de lui sans en être séparée, et c'est seulement à travers lui que l'Un peut être dit.

    **Tandis que l'intellection se cherche, l'intelligible premier ne bouge pas.** Il n'a besoin de rien, alors que l'intellection a besoin de lui. L'Intellect naît donc tandis que l'Un demeure **« dans son état habituel »** (2, 21-22). Le mot grec (*ēthei*) cite le *Timée* (42e5-6), où le démiurge, son ouvrage accompli, « demeure dans son propre caractère » : Plotin transpose la formule au Premier pour dire qu'il ne bouge pas et ne délibère pas quand l'Intellect procède de lui. Ce qui naît n'est pas un morceau détaché de l'Un, mais **« une imitation et une image »** de lui.

    **Distinguer n'est pas séparer.** L'Intellect n'est pas l'Un, mais il n'existe pas hors de lui : il est le regard que l'Un porte sur lui-même, avec cette précision que **le sujet de ce regard est l'Intellect, non l'Un.**

    **Il s'ensuit qu'on ne connaît l'Un que relativement à ce qui vient de lui.** Le Premier n'est « intelligible » (*noêton*) que pour l'Intellect qui le pense ; il est de même l'« Un » pour le multiple, le « bien » pour ce qui peut être bon. Ce qu'il est en lui-même reste **ineffable**. Le traité 9 (VI, 9) poursuivra cette réflexion.

    ! « Intelligible » n'est pas un nom de l'Un en lui-même : il le reçoit de l'Intellect qui le pense.
