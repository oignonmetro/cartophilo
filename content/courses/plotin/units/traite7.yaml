- id: traite7-l7
  title: "L'Un au-delà de la réalité, l'Intellect identique à l'être (2, 36-48)"
  notes: |-
    Le traité conclut en situant les deux termes de la procession : l'Un au-delà de la réalité qu'il produit, l'Intellect identique à la réalité qu'il pense.

    **L'Un est au-delà de la réalité, et donc de l'Intellect** (2, 36-43). Ce que l'Un produit, l'Intellect, est la réalité même (`ousía`), où l'être et la pensée sont réunis. L'Un, qui produit la réalité, ne peut en faire partie ; et l'Intellect, qui est deux, ne peut être le plus simple. Le Premier est ainsi au-delà de l'un comme de l'autre, tout en étant « puissance de toutes choses » : il n'est aucune d'elles, parce qu'il les produit toutes. Ce que le chapitre 1 posait d'emblée se retrouve ici établi à partir de ce qui vient de l'Un.

    **L'Intellect, lui, est identique à ses objets** (2, 43-48). **« Car ce qui est n'est point un cadavre »** : l'être n'est pas une chose inerte que l'Intellect regarderait du dehors, il vit et il pense. L'Intellect et l'être sont une seule et même chose. À la différence de la sensation, qui reçoit des objets extérieurs, l'Intellect ne reçoit pas ses objets : il les est.

    **Le traité 7 affirme cette identité sans la démontrer.** Plotin l'établit ailleurs, dans le traité 5 (V, 9), puis dans le traité 32 (V, 5), *Que les intelligibles ne sont pas hors de l'intellect*.

    ! L'Un n'est pas au-delà de la réalité parce qu'il lui manquerait quelque chose : c'est parce qu'il la produit tout entière qu'il n'en fait pas partie.
  points:
  - id: traite7-l7-q1
    sentence: "L'Un produit l'Intellect, qui est la réalité même ; ne pouvant faire partie de ce qu'il produit, l'Un est, pour le traité 7 (2, 36-43), au-delà de la ___."
    answer: "réalité"
    alt: ["realite"]
