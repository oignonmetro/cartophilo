id: traite7
title: "Traité 7 (V, 4) : Comment vient du premier ce qui est après le premier"
subtitle: "L'Un demeure, l'Intellect naît"
icon: compass
color: sky
lessons:
- id: traite7-l1
  title: "La question de la procession : comment vient-on de l'Un ?"
  notes: |-
    **1. La question.** Si toutes choses sont issues du premier principe, l'« Un » ou « Premier », **comment** viennent-elles de lui ? Le traité 7, bref (deux chapitres), ne demande pas *s'il* existe autre chose que l'Un : cela va de soi, il le suppose. Il demande *comment* ce qui existe en provient.

    **2. Pourquoi la poser maintenant.** La difficulté avait déjà été rencontrée deux fois, en 5 (V, 9), 14 et en 6 (IV, 8), 6, mais en remontant des produits de l'Un vers leur principe. La fin du traité 5 (chap. 14, 4-5) réclamait donc un examen qui prendrait **« un autre point de départ »** : partir de ce qui est premier et descendre. C'est ce que fait le traité 7.

    **3. Deux réponses possibles** (1, 1-5) :

    | Ce qui vient de l'Un en vient | Il faut alors |
    | par des intermédiaires | les définir comme autant de réalités ayant une « hypostase » |
    | immédiatement | expliquer comment |

    **4. Le choix de Plotin : la seconde voie.** {green}L'Intellect provient de l'Un immédiatement{/green}, sans intermédiaire. Il reste donc à expliquer *comment*, et c'est tout l'objet du traité. Plotin reviendra souvent sur cette première procession, dès le traité 10 (V, 1), sans jamais corriger la manière dont la question est posée ici.

    **5. Pourquoi c'est difficile.** Plotin veut tenir en même temps une seconde thèse : {red}l'Un « reste en lui-même »{/red}, il ne sort pas de soi pour produire. Or, contre ses prédécesseurs **médioplatoniciens**, il place le premier principe *au-delà* de l'Intellect : il ne peut donc pas se contenter de dire que l'Intellect est le premier principe. Il doit faire naître l'Intellect d'un principe qui ne change ni ne se meut.

    **6. La suite du traité** lève cette tension en deux temps : montrer ce qu'est l'Un qui demeure (leçon suivante), puis comment l'Intellect en naît sans que l'Un se quitte (la doctrine des deux actes).

    ! Le traité ne prouve pas qu'il existe quelque chose après l'Un : il le suppose, et cherche seulement comment cela vient de lui.
