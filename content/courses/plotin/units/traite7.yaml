id: traite7
title: "Traité 7 (V, 4) : Comment vient du premier ce qui est après le premier"
subtitle: "L'Un demeure, l'Intellect naît"
icon: compass
color: sky
lessons:
- id: traite7-l1
  title: "La question de la procession : comment vient-on de l'Un ?"
  notes: |-
    **Le traité 7 pose une question véritablement première : si toutes choses sont issues du premier principe, l'« Un » ou « Premier », comment viennent-elles de lui ?** Il ne demande pas s'il existe autre chose que l'Un (cela va de soi), mais comment ce qui existe en provient.

    **La difficulté avait été rencontrée deux fois**, en 5 (V, 9), 14 et en 6 (IV, 8), 6. La fin du traité 5 (chap. 14, 4-5) réclamait un examen qui prendrait **« un autre point de départ »** : non plus remonter des produits de l'Un à leur principe, mais partir de ce qui est premier. C'est ce que fait le traité 7.

    **L'alternative est posée sous sa forme la plus simple** (1, 1-5) :

    | Ce qui vient de l'Un en vient | Il faut alors |
    | par des intermédiaires | les définir comme autant de réalités ayant une « hypostase » |
    | immédiatement | expliquer comment |

    Plotin défend la seconde voie : **l'Intellect provient immédiatement de l'Un.** Il reviendra souvent sur cette première procession, dès le traité 10 (V, 1), sans jamais corriger la manière dont la question du « comment ? » est posée ici.

    **Ce qui rend la question difficile, c'est la thèse que Plotin veut tenir en même temps : l'Un « reste en lui-même ».** Contre ses prédécesseurs **médioplatoniciens**, il soutient qu'il y a quelque chose au-delà de l'Intellect, et que tout procède de ce principe sans qu'il « sorte » de lui-même.

    ! Le traité ne prouve pas qu'il existe quelque chose après l'Un : il le suppose, et cherche seulement comment cela vient de lui.
