- id: traite7-l6
  title: "Les deux actes : comment l'Un produit sans changer (2, 27-36)"
  notes: |-
    **Il reste à lever la contradiction du chapitre 1 : l'Un produit, et pourtant il demeure.** Plotin pose la question en propres termes (2, 27) : **« Mais comment naît-il alors que celui-ci demeure inchangé ? »** Sa réponse n'est pas démontrée : c'est un principe général, qu'il pose puis rend concevable par un exemple.

    **Le principe : toute chose a deux actes.** « En chaque chose, il y a un acte qui appartient à la réalité et un acte qui provient de la réalité » (2, 27-28). Le premier est la chose même ; le second en est la conséquence nécessaire, mais il est autre qu'elle.

    | Acte | Ce qu'il est | Le feu |
    | de la réalité | la chose elle-même, son activité propre, « essentielle » | la chaleur qui le constitue |
    | issu de la réalité | sa conséquence nécessaire, différente d'elle, qui fait exister autre chose | la chaleur qu'il procure aux autres choses |

    **L'exemple du feu montre qu'il n'y a là rien de contradictoire** : le feu chauffe ce qui l'entoure sans cesser d'être du feu ni rien perdre de sa chaleur propre. Il en va de même de l'Un : {sky}par son acte propre, il demeure ce qu'il est{/sky} ; {coral}l'Intellect est un acte qui vient de lui, comme en dehors de lui{/coral}. Produire, pour l'Un, n'est donc pas sortir de soi, mais laisser se répandre l'acte second qui accompagne nécessairement le premier. Le traité 3 (III, 1), 1, 13 faisait déjà cette remarque.

    **L'outil vient d'Aristote, mais Plotin le transforme.** Il lui emprunte l'identité de la réalité et de l'acte (`enérgeia`). Mais chez Aristote, la puissance est une capacité qui attend d'être actualisée ; quand Plotin dit l'Un « puissance de toutes choses », il entend une puissance qui s'exerce sans réserve et **surabonde** sans cesse.

    **Le schéma vaut pour toute la suite du réel.** L'acte second dépend entièrement de l'acte premier, qui n'a nul besoin de lui ; il lui ressemble, et lui est inférieur. L'acte de l'Intellect est ainsi l'acte second de l'Un ; de même, l'acte de l'âme, la **`dianoia`**, sera l'acte second de l'Intellect.

    ! La puissance de l'Un n'est pas la puissance aristotélicienne, capacité en attente d'être actualisée : c'est une puissance pleinement active, qui surabonde.
  points:
  - id: traite7-l6-q1
    sentence: "La difficulté que la doctrine des deux actes doit lever est formulée par le traité 7 (2, 27) : « Mais comment naît-il alors que celui-ci demeure ___ ? »"
    answer: "inchangé"
    alt: ["inchange"]
  - id: traite7-l6-q2
