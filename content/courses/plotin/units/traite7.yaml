- id: traite7-l4
  title: "Les deux actes : la chaleur du feu"
  notes: |-
    **1. L'obstacle qui reste : comment l'Un peut-il agir au-dehors de lui, en autre chose que lui-même ?** Il produit (leçon précédente) et pourtant il demeure (leçon 2). La difficulté contraint Plotin à affirmer, au risque d'une contradiction, que d'une certaine manière l'Un ne se tient pas en lui-même (chap. 1, 35).

    **2. La réponse : la thèse des deux actes** (2, 27-36). « En chaque chose, il y a un acte qui appartient à la réalité et un acte qui provient de la réalité. »

    | Acte | Ce qu'il est | Le feu |
    | de la réalité | la chose elle-même, son activité propre, « essentielle » | la chaleur qui le constitue |
    | issu de la réalité | sa conséquence nécessaire, différente d'elle, qui fait exister autre chose | la chaleur qu'il procure aux autres choses |

    **3. Appliquée à l'Un, elle lève la contradiction.** {sky}L'Un a un acte propre, qui le maintient semblable à lui-même{/sky} ; {coral}l'Intellect est encore un acte de l'Un, mais en quelque sorte en dehors de lui{/coral}. Le feu ne perd rien à chauffer ce qui l'entoure : de même, l'Un ne perd rien à produire. Le traité 3 (III, 1), 1, 13 faisait déjà la remarque.

    **4. D'où vient l'outil : Plotin emprunte à Aristote l'identité de la réalité et de l'acte (`enérgeia`)**, mais modifie sa distinction de l'acte et de la puissance. Si l'on parle de « puissance » au niveau du Premier, c'est au sens d'une puissance qui s'exerce sans réserve et dont l'activité **surabonde** sans cesse : l'Un est « puissance de toutes choses ».

    **5. La thèse vaut au-delà de l'Un : elle a un sens causal.** L'acte d'une chose, après le premier, se définit toujours par rapport à l'acte premier de ce qui l'a engendrée. L'acte de l'Intellect est la conséquence ressemblante de l'acte de l'Un ; de même, l'acte de l'âme, la **`dianoia`**, sera l'acte second de l'Intellect. Le schéma de la première procession devient celui de toute la hiérarchie.

    ! La puissance de l'Un n'est pas la puissance aristotélicienne, capacité en attente d'être actualisée : c'est une puissance pleinement active, qui surabonde.
