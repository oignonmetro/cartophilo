- id: traite7-l2
  title: "L'Un demeure : simple, parfait, au-delà de la réalité"
  notes: |-
    **Le premier chapitre établit la primauté de l'Un.** À la différence de l'Intellect, qui en procède et qui est composé, **l'Un est simple** ; il est unique, parfait, principe de toutes choses, et il reste immobile en lui-même.

    - Il doit être simple, sans quoi il ne serait pas principe ; premier, il est **« ce qui se suffit le plus à soi-même »**.
    - Il est unique : s'il y en avait un autre du même genre, les deux ne feraient qu'un. Aucun corps n'est simple, et « le principe est inengendré ».
    - Il n'est même pas vraiment « un » : il n'y a de lui **« ni discours ni science »**, il est **« au-delà de la réalité »** (1, 9-10) : Plotin cite le *Parménide* (142a), puis la *République* (VI, 509b), formules devenues classiques pour dire que le premier principe échappe à la connaissance rationnelle.
    - C'est la première fois que l'Un est désigné comme **« le Premier »** (`tò prôton`).
    - Ce qui vient après lui ne peut être simple : c'est un **« un-multiple »** (1, 21-22).

    **Il se maintient (`ménei`) toujours en lui-même** : c'est la seule particularité qu'aucun propos sur l'Un, si métaphorique soit-il, ne peut mettre en cause. « Demeurer », c'est à la fois ne pas changer et ne pas se mouvoir. Plotin applique à l'Un la phrase du *Timée* sur le démiurge qui, son ouvrage accompli, **« demeure dans son propre caractère »** (ou « dans son propre séjour », 42e5-6).

    **Plotin évite de nommer l'Un** : il préfère des pronoms (« il », « celui-là ») qui désignent sans nommer. Ce qu'on en dit est relatif à ce qui vient de lui : **le Premier n'est « intelligible » (`noētón`) que comme objet de l'intellection (`nóēsis`) de l'Intellect.** Ce qu'il est par lui-même reste ineffable. De l'Un on n'a qu'une **connaissance relative** : il est l'« intelligible » pour l'Intellect, l'« Un » pour le multiple, le « bien » pour ce qui peut être bon. Le traité 9 (VI, 9) poursuivra cette réflexion.

    ! « Intelligible » n'est pas un nom de l'Un en lui-même : il le reçoit de l'Intellect qui le pense.
