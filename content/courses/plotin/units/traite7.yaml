- id: traite7-l2
  title: "Pourquoi le Premier est simple, unique et au-delà de la réalité (1, 1-23)"
  notes: |-
    **Avant de dire ce qui vient du Premier, Plotin dit ce qu'il doit être pour être premier.** Tout repose sur une idée : ce qui est premier ne dépend de rien. Plotin en tire, l'une après l'autre, les propriétés de l'Un.

    **Il est simple.** Un composé dépend des éléments qui le composent : ils sont avant lui, et il a besoin d'eux pour être. Si le premier était composé, ses éléments seraient donc plus premiers que lui, et ce ne serait plus lui le principe. Et parce qu'il ne dépend de rien, il ne manque de rien : il est **« ce qui se suffit le plus à soi-même »**. L'Intellect, qui vient de lui, est au contraire composé.

    **Il est unique.** Supposons deux premiers du même genre : rien ne les distinguerait, car toute différence ajouterait à chacun quelque chose de propre et le rendrait composé. Indiscernables, les deux ne feraient qu'un. Pour la même raison, **il n'est pas un corps** : aucun corps n'est simple, tout corps est engendré, et « le principe est inengendré ».

    **Il échappe même au discours.** Dire ce qu'une chose est, c'est lui attribuer quelque chose, donc distinguer en elle un sujet et ce qu'on en dit. Du simple, il n'y a donc **« ni discours ni science »** : il est **« au-delà de la réalité »** (1, 9-10). Plotin cite là le *Parménide* (142a), puis la *République* (VI, 509b). Le nom même d'« Un » ne lui convient qu'imparfaitement : Plotin l'appelle ici, pour la première fois, **« le Premier »** (`tò prôton`), et le désigne volontiers par des pronoms (« il », « celui-là ») qui le montrent sans le nommer.

    **Ce qui vient après lui, en revanche, ne peut être simple**, sans quoi ce serait encore le premier : c'est un **« un-multiple »** (1, 21-22).

    ! Plotin démontre peu ici : il tire les conséquences de la notion de principe. Que le Premier soit simple découle de ce qu'il est premier ; qu'il y ait quelque chose après lui reste supposé.
