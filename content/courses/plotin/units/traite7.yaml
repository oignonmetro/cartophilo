- id: traite7-l2
  title: "L'Un demeure : simple, parfait, au-delà de la réalité"
  notes: |-
    **1. Le point de départ : ce que doit être le premier, s'il y a quelque chose après lui** (1, 1-23). Au lieu de remonter des produits de l'Un, Plotin part du principe lui-même. Il doit être **simple**, sans quoi il ne serait pas principe : à la différence de l'Intellect, qui en procède et qui est composé. Simple et premier, il est **« ce qui se suffit le plus à soi-même »**.

    **2. De la simplicité suivent l'unicité et l'absence de genèse.** S'il y en avait un autre du même genre, les deux ne feraient qu'un. Aucun corps n'est simple, et « le principe est inengendré ».

    **3. Si simple qu'il échappe au discours.** Il n'est même pas vraiment « un » : il n'y a de lui **« ni discours ni science »**, il est **« au-delà de la réalité »** (1, 9-10). Plotin cite le *Parménide* (142a), puis la *République* (VI, 509b), formules devenues classiques pour dire que le premier principe échappe à la connaissance rationnelle. C'est aussi la première fois que l'Un est désigné comme **« le Premier »** (`tò prôton`).

    **4. Par contraste, ce qui vient après lui ne peut être simple** : c'est un **« un-multiple »** (1, 21-22). Le traité a ainsi fixé les deux termes de la procession, le simple et ce qui en vient.

    **5. Une seule propriété résiste à toute réserve : {sky}il se maintient (`ménei`) toujours en lui-même{/sky}.** C'est la thèse qui rendait la procession difficile (leçon précédente) : aucun propos sur l'Un, si métaphorique soit-il, ne peut la mettre en cause. « Demeurer », c'est à la fois ne pas changer et ne pas se mouvoir. Plotin applique à l'Un la phrase du *Timée* sur le démiurge qui, son ouvrage accompli, **« demeure dans son propre caractère »** (ou « dans son propre séjour », 42e5-6) : on peut produire sans se quitter.

    **6. Conséquence pour le langage : on ne parle de l'Un que depuis ce qui vient de lui.** Plotin évite de le nommer et préfère des pronoms (« il », « celui-là ») qui désignent sans nommer. **Le Premier n'est « intelligible » (`noêton`) que comme objet de l'intellection (`noêsis`) de l'Intellect** ; ce qu'il est par lui-même reste ineffable. De l'Un on n'a qu'une **connaissance relative** : il est l'« intelligible » pour l'Intellect, l'« Un » pour le multiple, le « bien » pour ce qui peut être bon. Le traité 9 (VI, 9) poursuivra cette réflexion.

    ! « Intelligible » n'est pas un nom de l'Un en lui-même : il le reçoit de l'Intellect qui le pense.
