- id: traite7-l3
  title: "L'Intellect, intellection de l'Un"
  notes: |-
    **1. Pourquoi l'Un engendre-t-il ? Parce qu'il est parfait** (1, 23-41). Dès qu'une chose atteint sa perfection, elle engendre, elle **« ne supporte plus de demeurer en elle-même »**. Cela vaut pour ce qui choisit, pour ce qui croît, et même pour les choses sans âme : le feu réchauffe, la neige refroidit, les remèdes agissent. Comment le plus parfait demeurerait-il en lui-même **« comme s'il était avare de lui-même »** (1, 35) ?

    **2. Ce qu'il engendre en second doit être la chose la plus vénérable de toutes : l'Intellect.** Plotin le définit comme une pensée intellective de l'Un, une **`noêsis`** : cette activité est la réalité même de l'Intellect, qui existe comme pensée de l'Un.

    **3. Pourquoi cet Intellect est-il multiple, un « un-multiple » ?** Parce qu'il est un regard tourné vers l'Un.

    - L'intellection, vision de l'intelligible qui se retourne vers lui, est **indéfinie** comme la vue, même si l'intelligible la définit. D'où la formule : les formes intelligibles, c'est-à-dire les nombres, viennent **« de la dyade indéfinie et de l'un »** (2, 7-8).
    - Intelligible et intelligeant, l'Intellect est donc d'emblée **deux** : une composition, intelligible toutefois.

    **4. Comment naît-il sans que l'Un change ?** Il naît alors que l'intelligible demeure **« dans son état habituel »** (2, 21) : il n'en est pas une partie détachée, mais **« une imitation et une image »**.

    **5. D'où le statut de l'Intellect : distinguer n'est pas séparer.** L'Intellect et l'Un ne sont pas identiques, mais l'Intellect n'existe pas en dehors de l'Un : il est quelque chose de ce dont il procède, le regard que l'Un porte sur lui-même, avec cette précision que **l'Un n'est pas le sujet de ce regard** : le sujet en est l'Intellect.

    **6. Ce qui est ainsi engendré est l'être même** (2, 43-48, fin du traité) : l'être n'est pas « un cadavre », l'Intellect et l'être sont une seule et même chose, et l'Intellect est identique à ses objets.

    Reste à comprendre *par quel mécanisme* l'Un produit hors de lui en demeurant en lui : c'est la thèse des deux actes (leçon suivante).

    ! L'Intellect n'est pas une réalité extérieure qui regarderait l'Un du dehors : il est ce regard même, issu de l'Un.
