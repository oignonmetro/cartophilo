- id: traite7-l2
  title: "Pourquoi le Premier est simple, unique et au-delà de la réalité (1, 1-23)"
  notes: |-
    **Avant de dire ce qui vient du Premier, Plotin dit ce qu'il doit être pour être premier.** Tout repose sur une idée : __ce qui est premier ne dépend de rien__. __Plotin en tire, l'une après l'autre, les propriétés de l'Un__.

    __**Il est {coral}simple{/coral}.**__ Un {pink}composé dépend des __éléments__ qui le composent{/pink} : ils __sont avant lui__, et il a besoin d'eux pour être. **Si le premier était composé, ses éléments seraient donc plus premiers que lui**, et ce ne serait plus lui le principe : {teal}« ce qui n'est pas premier a besoin de ce qui est avant lui, et ce qui n'est pas simple a besoin des éléments simples qui sont en lui pour exister à partir d'eux »{/teal}.

    Et parce qu'il ne dépend de rien, il ne manque de rien : il est **« ce qui se suffit le plus à soi-même »**. L'Intellect, qui vient de lui, est au contraire composé.

    __**Il est {coral}unique{/coral}.**__ Supposons deux premiers du même genre : rien ne les distinguerait, car toute différence ajouterait à chacun quelque chose de propre et le rendrait composé. Indiscernables, les deux ne feraient qu'un. Pour la même raison, **il n'est pas un corps** : aucun corps n'est simple, tout corps est engendré, et « le principe est inengendré ».

    __**Il {coral}échappe même au discours{/coral}.**__ {amber}Dire ce qu'une chose est{/amber}, c'est lui attribuer quelque chose, donc {amber}distinguer{/amber} en elle {violet}un sujet{/violet} et {violet}ce qu'on en dit{/violet}. Du simple, il n'y a donc **« ni discours ni science »** : il est **« au-delà de la réalité »** (1, 9-10). Plotin cite là le *Parménide* (142a), puis la *République* (VI, 509b). Le nom même d'« Un » ne lui convient qu'imparfaitement : Plotin l'appelle ici, pour la première fois, {violet}**« le Premier »** (*tò prôton*){/violet}, et le désigne volontiers par des {yellow}pronoms{/yellow} (« il », « celui-là ») qui le montrent {yellow}sans le nommer{/yellow}.

    {coral}**Ce qui vient après lui, en revanche, ne peut être simple**, sans quoi ce serait encore le premier{/coral} : c'est un **« un-multiple »** (1, 21-22).

    ! Plotin démontre peu ici : il tire les conséquences de la notion de principe. Que le Premier soit simple découle de ce qu'il est premier ; qu'il y ait quelque chose après lui reste supposé.
