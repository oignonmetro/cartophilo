# Cours d'un traité de Plotin (piste Repérage, voir content/philosophie.md),
# d'après la notice et le plan détaillé de Jean-François Pradeau, dans Plotin, Traités 7-21,
# trad. sous la dir. de L. Brisson et J.-F. Pradeau, GF-Flammarion, 2003.
# Les citations viennent de la notice, du plan ou de la traduction ; les
# repères (chapitre, lignes) sont ceux de cette édition. Lié à l'entrée
# t-5-4 de l'index.
#
# Refonte du 2026-10-13 : une leçon par mouvement du raisonnement, chaque
# rappel explicitant ce que Plotin démontre, ce qu'il pose et ce qu'il
# illustre. Les points ont reçu de nouveaux identifiants (-q au lieu de -p),
# pour ne pas hériter de l'historique de cartes devenues autres.

id: traite7
title: "Traité 7 (V, 4) : Comment vient du premier ce qui est après le premier"
subtitle: "L'Un demeure, l'Intellect naît"
icon: compass
color: sky
lessons:
- id: traite7-l1
  title: "La question du traité : comment ce qui vient après l'Un en vient-il ?"
  notes: |-
    Le traité 7 se demande comment ce qui vient après l'Un, et d'abord l'Intellect, peut venir de lui, alors que l'Un doit à la fois produire et demeurer inchangé.

    **Il part d'une donnée qu'il ne discute pas : il existe autre chose que l'Un.** Sa question est seulement de savoir *comment* ce qui vient après le premier principe en provient, à commencer par le premier de ses produits, l'Intellect. Le traité, qui ne compte que deux chapitres, ne traite que ce point.

    **Cette question avait été laissée en suspens.** Les traités 5 (V, 9), 14 et 6 (IV, 8), 6 l'avaient rencontrée, mais en partant des réalités produites pour remonter vers leur principe. La fin du traité 5 (chap. 14, 4-5) réclamait donc un examen qui prendrait **« un autre point de départ »** : partir du premier lui-même, et descendre. C'est ce que fait le traité 7, qui dit d'abord ce qu'est le premier, puis ce qui vient de lui.

    **Deux réponses sont possibles** (1, 1-5) :

    | Ce qui vient de l'Un en vient | Il faut alors |
    | par des intermédiaires | les définir comme autant de réalités ayant une « hypostase » |
    | immédiatement | expliquer comment |

    Des intermédiaires ne feraient que reculer le problème, puisqu'il faudrait encore dire comment chacun vient du précédent. Plotin retient donc la seconde voie : {green}l'Intellect vient de l'Un immédiatement{/green}. Il lui reste à dire comment, et il ne changera plus cette manière de poser la question, même quand il reviendra sur cette première procession, dès le traité 10 (V, 1).

    **Ce « comment » est difficile parce que deux exigences semblent se contredire.** D'un côté, l'Un est parfait, et ce qui est parfait produit : il ne peut rester stérile. De l'autre, {red}l'Un « reste en lui-même »{/red} : il ne change pas, ne se meut pas, ne perd rien. Comment produire sans sortir de soi ? La difficulté est d'autant plus aiguë que Plotin, contre ses prédécesseurs **médioplatoniciens**, qui faisaient du premier principe un intellect, place le premier *au-delà* de l'Intellect : la pensée elle-même doit donc naître d'un principe qui n'est pas pensée.

    **Le traité répond en deux temps.** Le chapitre 1 établit ce qu'est le Premier et pourquoi il produit nécessairement ; le chapitre 2 décrit comment l'Intellect en naît, et montre, par la doctrine des deux actes, que cette naissance ne change rien à l'Un.

    ! Le traité ne prouve pas qu'il existe quelque chose après l'Un : il le suppose, et cherche seulement comment cela vient de lui.
  points:
  - id: traite7-l1-q1
    sentence: "Le traité 7 de Plotin (V, 4), qui ne traite que de la manière dont l'Intellect vient de l'Un, ne compte que ___ chapitres."
    answer: "deux"
    alt: ["2"]
