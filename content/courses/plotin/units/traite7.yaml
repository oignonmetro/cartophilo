- id: traite7-l4
  title: "L'intellection, une vue qui se tourne vers l'Un (2, 1-12)"
  notes: |-
    L'Intellect naît comme une vue : une intellection d'abord indéfinie jaillit de l'Un, puis se tourne vers lui et reçoit de lui sa forme. C'est pourquoi l'Intellect est d'emblée deux, et ne peut être premier.

    **Pour décrire cette naissance, le chapitre 2 distingue trois termes.**

    - l'**intelligible** (*noêton*) : ici __le Premier lui-même, en tant que l'Intellect le pense__
    - l'**intellection** (*noêsis*) : l'activité qui naît de lui, et qui le cherche
    - l'**Intellect** : cette intellection une fois achevée. Il n'existe pas à part de son activité : il est une *noêsis*, une pensée de l'Un.

    **L'intellection naissante est comme une vue qui ne voit encore rien.** « L'intellection, qui est vision de l'intelligible, qui se retourne vers lui, et qui reçoit en quelque sorte de lui sa perfection, est elle-même indéfinie, tout comme l'est la vue, même si elle est définie par l'intelligible » (2, 4-6). Par elle-même elle est donc **indéfinie**, sans objet ni limite ; __{coral}c'est en se tournant vers l'intelligible pour le voir qu'elle reçoit de lui sa détermination{/coral}__. L'Intellect naît donc d'un double mouvement : un jaillissement d'abord indéterminé, puis __un retour vers l'Un__, la {violet}**conversion**{/violet} (*epistrophê*), qui lui donne sa forme. Plotin ne le démontre pas : il le rend concevable par l'analogie de la vue.

    **C'est le sens qu'il donne à une formule héritée de Platon** : les formes intelligibles, c'est-à-dire les nombres, viennent **« de la dyade indéfinie et de l'un »** (2, 7-8). La {violet}dyade{/violet} (ce qui est deux) est {amber}l'intellection encore indéfinie{/amber}, l'un ce qui la limite.

    **L'Intellect ainsi formé est d'emblée deux.** Il est intelligible, mais il intellige aussi : il est __à la fois ce qui pense et ce qui est pensé__. C'est pourquoi il __n'est pas simple__, et ne peut être le premier principe.

    ! L'Intellect ne regarde pas l'Un après coup : c'est en le regardant qu'il devient Intellect.
    ! Plotin ne démontre pas tant ici que l'Intellect *vient juste après* le Premier, mais plutôt plus simplement *qu'il vient après* (et qu'il n'est pas le Premier).
  points:
