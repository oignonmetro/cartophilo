- id: traite7-l3
  title: "Pourquoi le Premier produit (1, 23-41)"
  notes: |-
    **Que le Premier produise, Plotin l'établit en deux temps : une loi tirée de la nature, puis un raisonnement par l'absurde.**

    **La loi : ce qui est parfait engendre.** Dès qu'une chose atteint sa perfection, elle **« ne supporte plus de demeurer en elle-même »** et produit autre chose. Cela vaut pour les êtres qui choisissent, pour ceux qui croissent, et même pour les choses sans âme, qui produisent sans le vouloir : le feu réchauffe, la neige refroidit, les remèdes agissent (1, 30-32). Plotin ne démontre pas cette loi ; il la constate, et il l'interprète : en produisant, chaque chose **imite** le principe, autant qu'elle le peut.

    **Le raisonnement par l'absurde.** Si même les choses les plus humbles débordent ainsi sur autre chose, le Premier ne peut faire moins. Comment ce qui est le plus parfait demeurerait-il en lui-même **« comme s'il était avare de lui-même »** (1, 35), ou dépourvu de puissance, lui qui est la **« puissance de toutes choses »** ? Un Premier stérile serait un Premier impuissant, ce que sa perfection exclut.

    **Ce qu'il produit est l'Intellect.** Le produit ne peut être égal au Premier, sinon il serait le Premier lui-même. Mais il vient immédiatement après lui : c'est donc la chose la plus vénérable après lui, l'Intellect.

    **La formule de 1, 35 est pourtant risquée.** Prise à la lettre, elle dirait que l'Un ne demeure pas en lui-même. Or c'est l'autre exigence du traité : il se maintient (`ménei`) toujours en lui-même, et de tout ce qu'on dit de l'Un, c'est la seule chose qu'aucune réserve ne vient corriger. « Demeurer », c'est à la fois ne pas changer et ne pas se mouvoir. Le chapitre 2 doit donc expliquer comment l'Intellect naît d'un principe qui demeure.

    ! La production du Premier n'est ni un choix ni un mouvement : elle suit de sa perfection, comme la chaleur suit du feu.
