- id: traite7-l3
  title: "Pourquoi le Premier produit (1, 23-41)"
  notes: |-
    **Que le Premier produise, Plotin l'établit en deux temps : une loi tirée de la nature, puis un raisonnement par l'absurde.**

    **La loi : ce qui est parfait engendre.** Dès qu'une chose atteint sa perfection, elle **« ne supporte plus de demeurer en elle-même »** et produit autre chose. Cela vaut pour les êtres qui choisissent, pour ceux qui croissent, et même pour les choses sans âme, qui produisent sans le vouloir : le feu réchauffe, la neige refroidit, les remèdes agissent (1, 30-32). Plotin ne démontre pas cette loi ; il la constate, et il l'interprète : en produisant, chaque chose **imite** le principe générateur, autant qu'elle le peut.

    **Le plus parfait ne peut pas être avare de génération pour une raison éthique et logique.** __Si même {amber}les choses les plus humbles débordent ainsi sur autre chose{/amber}, le Premier ne peut faire moins.__ Comment ce qui est le plus parfait demeurerait-il en lui-même {pink}**« comme s'il était avare de lui-même »**{/pink} (1, 35), ou dépourvu de puissance, lui qui est la **{amber}« puissance de toutes choses »{/amber}** ? De plus, {coral}__un Premier stérile serait un Premier impuissant, ce que sa perfection exclut__{/coral}.

    **Ce qu'il produit est le Second.** Le produit du Premier ne peut pas lui être égal, car sinon il serait le Premier lui-même. Mais il vient immédiatement après lui : c'est donc **« la chose la plus vénérable et la meilleure » après lui**.

    **La formule de 1, 35 est pourtant risquée.** Prise à la lettre, elle dirait que {red}l'Un ne demeure pas en lui-même{/red}. Or c'est l'autre exigence du traité : {green}il se maintient (*ménei*) toujours en lui-même{/green}, et de tout ce qu'on dit de l'Un, c'est la seule chose qu'aucune réserve ne vient corriger. « Demeurer », c'est à la fois ne pas changer et ne pas se mouvoir. Le chapitre 2 doit donc expliquer comment le Second (l'Intellect) naît d'un principe qui demeure.

    ! La production du Premier n'est ni un choix ni un mouvement : elle suit de sa perfection, comme la chaleur suit du feu.
