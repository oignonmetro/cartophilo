lessons:
- id: g-organe-l1
  title: Organe
  notes: |-
    Chez Plotin, l'{violet}**organe**{/violet} (*organon*) est [def]. Il n'est pas {pink}le siège où l'âme habite{/pink} : l'âme est tout entière partout, l'organe est seulement l'endroit d'où part une de ses activités.

    __**L'organe est une partie du corps que l'âme rend apte à une fonction : la puissance n'y est pas logée, seul le point de départ de l'activité s'y trouve.**__ Si l'âme est tout entière dans chaque partie du corps (voir [[g-ame|âme]]), pourquoi voit-on par les yeux et non par les mains ? Parce que les parties du corps ne la reçoivent pas de la même façon : « quand le corps pourvu d'une âme est illuminé par l'âme, __une partie de ce corps participe de cette âme d'une façon et une autre partie d'une autre façon__ » ([[traite27|traité 27]], chap. 23). La différence est dans le corps, non dans l'âme : « c'est en fonction de l'aptitude de tel organe à réaliser telle fonction – car __l'âme donne à chaque organe la faculté qui convient à son activité__ – que la faculté qui se trouve dans les yeux est appelée la faculté de voir » (*ibid*.). On dit donc mal que la vue est dans l'œil : « il vaut mieux ne pas dire que la puissance trouve là son point d'appui, car __la puissance est partout__, mais dire que le point de départ de l'activité se trouve là où est le point de départ de l'instrument » (*ibid*.). C'est en ce sens que Plotin répartit les facultés dans le corps. Le cerveau n'enferme pas la sensation : comme les nerfs y prennent leur départ, « on a rapporté au cerveau et placé là __le point de départ de la sensation, de l'impulsion__ et en général du vivant dans sa totalité » (*ibid*.) ; et parce que « le point de départ des veines et du sang se trouve dans le foie », « il a été donné à la portion de l'âme qui se rapporte au désir de résider à cet endroit » (*ibid*. ; voir [[g-desir|désir]]). Plotin reconnaît d'ailleurs que l'image classique du pilote ne règle pas tout : poser que « l'âme est dans le corps __comme dans un instrument produit par la nature__ », c'est encore rester « dans l'embarras sur le point de savoir de quelle manière l'âme se trouve dans cet instrument » (chap. 21 ; voir [[g-union-ame-corps|union de l'âme et du corps]]).

    __**Les sens ont besoin d'organes, parce que l'organe fait le lien entre l'objet et l'âme : il ressemble à l'un et à l'autre.**__ L'âme ne peut pas saisir directement un corps. Seule, elle ne connaît que ce qu'elle contient : « quand elle est par elle-même elle ne perçoit en effet que ce qui est en elle, et __elle est seulement intellection__ » ([[traite28|traité 28]], chap. 23). Pour saisir autre chose, il faut ressembler à cette chose ; « mais il ne lui est pas possible de devenir semblable, si elle reste en elle-même. En effet, __comment un point peut-il devenir semblable à une ligne ?__ » (*ibid*.). Un point n'a pas d'étendue et ne s'étire pas en ligne ; l'âme, sans étendue, ne devient pas un corps. Il lui faut un intermédiaire, et c'est l'organe : il « joue le rôle d'__une moyenne proportionnelle__ qui en quelque sorte rattache les extrêmes l'un à l'autre et qui a la capacité de recevoir la forme et de la transmettre à l'âme » (*ibid*.). Pour cela il ne doit être ni l'un ni l'autre : « il ne doit être identique ni à ce qui connaît ni à ce qui est connu, mais il est en mesure de devenir semblable à l'un et à l'autre, à l'objet extérieur parce qu'il est affecté par lui, et à l'âme qui se trouve à l'intérieur parce que __c'est l'affection que subit l'organe qui devient une forme dans l'âme__ » (*ibid*.). D'où la conclusion : « les sensations doivent se faire par le moyen d'organes corporels ; et cela s'accorde avec le fait que l'âme ne perçoit aucun objet sensible quand elle se trouve tout entière à l'extérieur d'un corps » (*ibid*.). Et pourquoi l'âme se donne-t-elle cette peine ? Pour le corps, non pour elle : la sensation « a été prévue pour nous protéger de ce qui a une action sur le corps avant que cette action ne devienne si forte qu'elle nous détruise » ; « si tel est bien le cas, __les sens ont pour fin l'utilité__ » (chap. 24). Le toucher a pour organe tout le corps, la vue une partie : l'organe est « ou bien le corps en sa totalité ou bien celle de ses parties qui doit accomplir une tâche particulière, par exemple le toucher dans le premier cas et la vision dans l'autre » (chap. 23).

    __**L'organe pâtit, l'âme juge : ce n'est pas l'organe qui sent.**__ L'organe est affecté, mais être affecté n'est pas sentir. Plotin distingue : « les affections se produisent en rapport à quelque chose d'autre que l'âme, par exemple par rapport à un corps déterminé, alors que les jugements se produisent en rapport avec l'âme, le jugement n'étant pas une affection, car il faudrait, alors, que se produise en plus un autre jugement et __l'on remonterait chaque fois à l'infini__ » ([[traite26|traité 26]], chap. 1). Si juger était pâtir, il faudrait un second jugement pour connaître cette affection, puis un troisième, sans fin ; il faut donc qu'à un moment l'âme connaisse sans pâtir. « Les sensations __ne sont pas des affections__, disons-nous, mais des activités et des jugements à propos des affects » (*ibid*. ; voir [[g-aisthesis|sensation]]). La sensation n'est pas non plus une empreinte laissée dans l'âme, comme un cachet dans la cire : « si en effet nous saisissions des empreintes de ce que nous voyons, il ne serait pas possible de regarder cela même que nous voyons, mais __seulement des images et des ombres__ des objets vus » ([[traite41|traité 41]], chap. 1). L'âme, au contraire, « se prononce sur des objets qu'elle ne contient pas. Ce qui caractérise en effet sa puissance, __ce n'est pas de subir quelque chose__, mais d'accomplir sa puissance et la tâche qui lui a été assignée » (chap. 2). L'organe est donc à l'âme ce que l'outil est à l'artisan : elle n'a pas à recevoir ses affections, « pas plus que les artisans ne ressentent les affections qu'éprouvent leurs instruments » ([[traite53|traité 53]], chap. 3).

    | | L'organe | L'âme |
    | Ce qu'il fait | il est affecté par l'objet | elle juge de l'affection |
    | Ce qu'il est | une partie du corps, apte à une fonction | tout entière partout |
    | Sans l'autre | il pâtit sans rien sentir | elle ne connaît que ce qui est en elle |

    __**La faculté qui raisonne n'a besoin d'aucun organe.**__ Tout ce qui saisit un corps a besoin d'un organe ; la raison, elle, saisit des formes qui sont déjà en elle, et n'a donc rien à recevoir du dehors : « cette faculté de l'âme qui raisonne __n'a besoin d'aucun organe corporel__ pour raisonner, car elle garde son activité pure afin de pouvoir raisonner de manière pure, et on ne se tromperait pas en la posant dans le monde intelligible qui tient la première place, comme __séparée du corps et non mélangée à lui__ » ([[traite10|traité 10]], chap. 10). Que se passe-t-il alors quand le corps est atteint ? La pensée n'est pas détruite ; seul le miroir où elle se reflète l'est : « lorsque ce en quoi ces reflets apparaissent est complètement brisé parce que __l'harmonie du corps est troublée__, c'est sans image que la raison discursive et l'intellect intelligent et c'est sans représentation que l'intellection se produit alors » ([[traite46|traité 46]], chap. 10). Nous ne nous apercevons plus de notre pensée, mais elle continue (voir [[g-phantasia|représentation]]).

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 10, chap. 10 | la raison n'a besoin d'aucun organe |
    | traité 26, chap. 1 | la sensation, jugement et non affection |
    | traité 27, chap. 23 | l'âme donne à chaque organe sa faculté ; le cerveau, point de départ |
    | traité 28, chap. 23 | l'organe, moyenne proportionnelle entre l'objet et l'âme |
    | traité 41, chap. 1 | une empreinte ne ferait voir que des ombres |
    | traité 46, chap. 10 | corps troublé, l'intellection continue sans image |
    | traité 53, chap. 3 | l'artisan ne sent pas ce que subit son outil |

    **Voir aussi** : [[g-corps|Corps]] · [[g-aisthesis|Sensation]] · [[g-union-ame-corps|Union de l'âme et du corps]] · [[g-ame|Âme]] · [[g-phantasia|Représentation]]
