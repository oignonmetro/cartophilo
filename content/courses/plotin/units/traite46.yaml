- id: traite46-l4
  title: "La vie du sage"
  notes: |-
    **La volonté tournée vers l'intérieur** (chap. 11) : le sage peut souhaiter que tous se portent bien ; s'il n'en va pas ainsi, il reste heureux, car sa volonté ne porte pas sur les biens extérieurs.

    **La sérénité** (chap. 12) : non les plaisirs du corps, mais ceux qui accompagnent la présence des biens, sans mouvement : le sage est toujours **serein**, son état d'esprit est **tranquille**, mot que Plotin réserve d'ordinaire à l'Intellect.

    **Le taureau de Phalaris** (chap. 13) : « l'objet d'étude le plus élevé » est toujours à portée de sa main, même dans le taureau de Phalaris ; mais ce n'est pas la partie qui souffre qui en jouit : elle est une chose, ce qui lui est uni en est une autre.

    **Ni composé ni corps** (chap. 14-15) : l'homme, surtout le sage, n'est pas un composé ; il réduit la part des biens corporels par une sorte de **contrepoids**. Deux sages également sages sont également heureux, quelle que soit leur fortune. La peur involontaire, il l'apaise comme un regard sévère suffit à faire peur à un enfant. Il est ami de lui-même et des autres.

    **La lyre** (chap. 16) : il faut, dit Platon, recevoir le bien de là-haut. Le sage se soucie de son corps comme le **musicien de sa lyre** ; hors d'usage, il en change, ou chante sans instrument.

    ! Le corps n'est pas méprisé comme un mal : c'est un instrument, dont le sage s'est souvent servi, et qu'il quitte sans perdre son chant.
