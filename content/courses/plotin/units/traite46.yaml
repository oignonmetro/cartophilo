- id: traite46-l3
  title: "Le sage face aux maux"
  notes: |-
    **L'objection** (chap. 5) : et les souffrances, les maladies, la perte de conscience ? La pauvreté et le discrédit ne comptent pas, même devant les malheurs de **Priam** : il les supportait, mais ne les voulait pas, et la vie heureuse doit être voulue. On objecte que l'homme est un tout, âme et corps.

    **Le bien véritable et les choses nécessaires** (chap. 6) : la fin doit être **une**. La santé et l'absence de douleur sont **nécessaires**, non bonnes : on ne les remarque que lorsqu'elles manquent. Nous ne voulons pas éviter les maux, mais ne pas avoir à les éviter.

    **Les grands malheurs** (chap. 7) : celui qui tient pour rien le pouvoir royal ne s'afflige pas de la ruine d'une cité ; ce serait faire grand cas de bois et de pierres, et de la mort de mortels. Captif, « la voie » s'ouvre pour partir. La nature de l'univers comporte de tels événements.

    **L'athlète** (chap. 8) : dans la souffrance, son éclat continue de briller **comme une lanterne** dans la tempête. S'affliger des malheurs d'autrui est faiblesse ; le sage repousse les coups du sort comme **un grand athlète** ; ils n'effraient que les enfants.

    **La perte de conscience** (chap. 9-10) : il reste sage dans le sommeil ou la maladie, comme il reste en bonne santé sans le sentir : l'activité de l'intellect ne s'interrompt pas. La perception est comme un **miroir** : s'il est brisé, l'intellect pense sans image. Celui qui lit avec attention n'a pas conscience de lire ; la conscience risque d'obscurcir les activités qu'elle accompagne.

    ! L'autarcie du sage n'est pas celle du sage stoïcien, accordé à la raison du monde : il s'est uni à l'Intellect, au-dessus de cette raison.
