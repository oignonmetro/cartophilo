- id: traite46-l5
  title: "Repérage : le plan du traité 46"
  notes: |-
    **Le traité 46 examine les thèses antérieures (chap. 1-2), définit le bonheur (chap. 3-4), montre que les maux ne l'atteignent pas (chap. 5-10), puis décrit la vie du sage (chap. 11-16).**

    | Moment | Lieu | Ce qui s'y joue |
    | d'autres vivants heureux ? | chap. 1 | les sons harmonieux |
    | ni la sensation ni la raison | chap. 2 | une raison ou un intellect |
    | le bonheur dans la vie | chap. 3 | la vie se dit en plusieurs sens |
    | l'homme et la vie parfaite | chap. 4 | comme des vêtements |
    | les maux et le corps | chap. 5 | Priam |
    | la fin unique | chap. 6 | les choses nécessaires |
    | le bonheur reste intact | 7, 1-14 | chaque jour amputé |
    | les grands malheurs | 7, 14-47 | du bois et des pierres |
    | les maux du sage lui-même | 8, 1-9 | la lanterne |
    | l'attitude du sage | 8, 9-30 | l'athlète |
    | la perte de conscience | chap. 9 | le sommeil |
    | intellection et conscience | chap. 10 | le miroir |
    | la volonté tournée vers l'intérieur | chap. 11 | souhaiter le bien de tous |
    | le plaisir du sage | chap. 12 | la sérénité |
    | la souffrance | chap. 13 | le taureau de Phalaris |
    | le mépris des biens | chap. 14 | le contrepoids |
    | deux sages | chap. 15 | le regard sévère |
    | le sage et l'Intellect | chap. 16 | la lyre |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! La définition du bonheur tient en deux chapitres (3-4) ; tout le reste du traité en tire les conséquences pour le sage.
