- id: traite46-l2
  title: "La vie parfaite"
  notes: |-
    **La vie se dit en plusieurs sens** (chap. 3) : posons que le bonheur est dans la vie. Si « vivre » se disait de la même façon de tous, tous les vivants seraient heureux ; et ceux qui le mettent dans la vie rationnelle ne le mettent plus dans la vie. Mais la vie **se dit en plusieurs sens**, selon l'antérieur et le postérieur, et les vies diffèrent par **la clarté et l'obscurité**. Le bonheur n'appartient qu'à **celui qui vit dans la plénitude**, auquel rien de la vie ne manque : la vie parfaite est celle de la nature intellective, dont les autres ne sont que des images.

    **L'homme heureux** (chap. 4) : sinon, le bonheur serait réservé aux dieux. L'homme a la sensation, le raisonnement et l'intellect véritable. Qui a cette vie en puissance la possède comme une partie de lui ; qui l'a **en acte** est cette vie, et porte le reste **comme des vêtements**. Le Bien au-delà est la cause du bien qui est en lui. Il se suffit à lui-même ; ce qu'il recherche, c'est pour le corps qui lui est joint. Quand ses proches meurent, il sait ce qu'est la mort ; le chagrin ne touche que ce qui en lui est dépourvu d'intellect.

    Passer d'une vie à l'autre, comme le dit le traité 19, c'est abandonner la vie de l'homme de bien pour choisir celle des dieux.

    ! La vie n'est pas un genre dont la vie rationnelle serait une espèce : les vies sont les images d'une vie première, et seule celle-ci est heureuse.
