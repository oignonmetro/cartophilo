id: traite46
title: "Traité 46 (I, 4) : Sur le bonheur"
subtitle: "La vie parfaite et le sage"
icon: compass
color: sky
lessons:
- id: traite46-l1
  title: "Ni la sensation ni la raison"
  notes: |-
    **Un bonheur voulu** : dans l'Antiquité, le bonheur est un état plutôt qu'un sentiment, et semble dépendre de la fortune ; Plotin en fait l'objet d'une volonté. Le traité 36 l'annonçait : si le bonheur est une vie bonne, c'est la vie de ce qui est. Le traité 46 est le premier des cinq traités que Plotin, malade en Campanie, envoya à Porphyre en Sicile, en 269.

    **Les autres vivants aussi ?** (chap. 1) :

    | Thèse | Conséquence |
    | la vie bonne est le bien-être | les animaux qui chantent seraient heureux |
    | la vie bonne est l'accomplissement de la fonction propre | les animaux aussi l'accomplissent |
    | le bonheur est la fin | les plantes même, qui portent leurs fruits |

    La fonction propre vient d'Aristote, le bien-être plutôt des stoïciens ; la fin est dite par Aristote, les épicuriens et les stoïciens. On répugne à abaisser le bonheur jusqu'aux plus insignifiants ; mais l'insignifiance n'est pas un argument.

    **La sensation** (chap. 2) : si le bien est l'affection elle-même, la sensation n'ajoute rien ; si c'est la sensation, tout ce qui sent serait heureux ; si c'est savoir que le plaisir est le bien, c'est le fait d'une faculté plus haute, **une raison ou un intellect**.

    **La raison** : si elle vaut parce qu'elle procure les premiers biens conformes à la nature, comme disent les stoïciens, elle n'est qu'un auxiliaire ; si elle vaut par elle-même, il faut dire ce qui la rend parfaite.

    ! Plotin ne refuse pas le bonheur aux bêtes parce qu'elles en seraient indignes, la dignité n'est pas un critère : c'est qu'il leur manque l'intellect.
