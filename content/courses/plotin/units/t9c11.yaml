# Unité de texte (voir content/textes.md) : Plotin, traité 9 (VI, 9), Sur le
# Bien ou l'Un, chapitre 11, traduction GF (éd. L. Brisson et J.-F. Pradeau).
# Découpage seul : rappels et cartes à écrire.

id: "t9c11"
title: "Fuir seul vers lui seul (9 [VI, 9], 11)"
subtitle: "Traité 9, Sur le Bien ou l'Un, chapitre 11"
group: "Traité 9 (VI, 9) : Sur le Bien ou l'Un"
icon: "page"
color: "coral"
depth: "normale"
lessons:
- id: "t9c11-p1"
  title: "Ne rien révéler aux non-initiés"
  notes: ""
  passage:
    label: "l. 1-4"
    part: "L'interdiction des Mystères"
    text: |-
      C'est ce que veut dire l'interdiction, faite dans les Mystères d'ici-bas, de ne rien révéler aux non-initiés ; c'est parce que le divin ne peut être révélé qu'elle interdit de le montrer à quelqu'un qui n'a pas eu le bonheur de le voir.
  points: []
- id: "t9c11-p2"
  title: "Il n'y avait pas deux choses"
  notes: ""
  passage:
    label: "l. 4-16"
    part: "Ne faire qu'un avec ce qu'on voit"
    text: |-
      Donc, puisqu'il n'y avait pas deux choses, mais que celui qui voyait ne faisait qu'un avec ce qui était vu, comme si ce qui était vu n'était pas vu, mais était uni à celui qui voyait, s'il peut se souvenir de ce qu'il était devenu quand il était uni à lui, il en gardera en lui-même l'image.
  points: []
- id: "t9c11-p2b"
  title: "Ni passion, ni désir, ni intellection"
  notes: ""
  passage:
    label: "l. 4-16"
    part: "Ne faire qu'un avec ce qu'on voit"
    text: |-
      Il était lui-même un, car il n'avait en lui-même aucune différence, ni par rapport à lui-même ni par rapport aux autres choses ; en effet, rien ne s'agitait en lui, il n'y avait ni passion, ni désir d'autre chose lorsqu'il était parvenu là-bas. Mais il n'y avait même plus de raison, ni d'intellection, et il n'était plus du tout lui-même, s'il faut dire cela aussi.
  points: []
- id: "t9c11-p2c"
  title: "Devenu lui-même le repos"
  notes: ""
  passage:
    label: "l. 4-16"
    part: "Ne faire qu'un avec ce qu'on voit"
    text: |-
      Mais comme s'il était ravi, ou plutôt possédé par le dieu, il se trouvait tranquillement dans la solitude et dans un état de calme parfait, sans s'éloigner d'aucune manière de sa propre réalité, sans plus tourner autour de lui-même, mais en restant « en repos », et en étant, pour ainsi dire, devenu lui-même le repos.
  points: []
- id: "t9c11-p3"
  title: "Au-delà du beau et du chœur des vertus"
  notes: ""
  passage:
    label: "l. 16-23"
    part: "Les statues et le sanctuaire"
    text: |-
      Il n'était plus parmi les belles choses, et sa course l'avait déjà conduit au-delà du beau et il avait même déjà dépassé le chœur des vertus, comme celui qui est rentré à l'intérieur d'un sanctuaire, après avoir laissé derrière lui les statues élevées dans le temple, et qui sont cependant les premières qu'il verra lorsqu'il sortira à nouveau après la contemplation et l'union qu'il aura eues à l'intérieur, non pas avec une statue ou avec une image, mais avec le dieu lui-même. Les statues ne feront l'objet que d'une contemplation secondaire.
  points: []
- id: "t9c11-p4"
  title: "Extase, simplification et donation de soi"
  notes: ""
  passage:
    label: "l. 23-33"
    part: "Une autre manière de voir"
    text: |-
      Et peut-être n'était-ce pas une contemplation, mais une autre manière de voir, une extase, une simplification et une donation de soi, une aspiration au contact, une forme de repos, une méditation qui aspire à l'union dans la coïncidence, si l'on veut contempler ce qui se trouve à l'intérieur du sanctuaire. Mais s'il regarde d'une autre manière, il ne trouve plus rien.
  points: []
- id: "t9c11-p4b"
  title: "Des images et leur énigme"
  notes: ""
  passage:
    label: "l. 23-33"
    part: "Une autre manière de voir"
    text: |-
      Il faut le dire, tout cela ce ne sont que des images ; elles suggèrent donc énigmatiquement aux interprètes avisés comment ce dieu peut être vu ; mais un prêtre avisé, qui trouve la solution de l'énigme, peut avoir la contemplation véritable en entrant dans le sanctuaire.
  points: []
- id: "t9c11-p4c"
  title: "Le semblable s'unit au semblable"
  notes: ""
  passage:
    label: "l. 23-33"
    part: "Une autre manière de voir"
    text: |-
      Et même s'il n'y entre pas, parce qu'il estime que ce sanctuaire est une chose invisible, et qu'il est « la source et le principe », il saura qu'on voit le principe par le principe et que le semblable s'unit au semblable.
  points: []
- id: "t9c11-p5"
  title: "Le reste de la contemplation"
  notes: ""
  passage:
    label: "l. 33-43"
    part: "L'âme parvient à elle-même"
    text: |-
      Il ne négligera aucune des choses divines que l'âme peut avoir avant même de contempler, tandis qu'il attend le reste de la contemplation : le reste, pour celui qui est monté au-delà de toutes choses, c'est ce qui se trouve avant toutes choses.
  points: []
- id: "t9c11-p5b"
  title: "En elle-même, donc en lui"
  notes: ""
  passage:
    label: "l. 33-43"
    part: "L'âme parvient à elle-même"
    text: |-
      Car l'âme ne parviendra certainement pas au non-être absolu, mais, si elle descend vers le bas, elle parviendra au mal, et de cette manière au non-être, mais non pas au non-être absolu ; tandis que, en courant dans la direction contraire, elle ne parviendra pas à quelque chose d'autre, mais à elle-même ; et de cette manière, parce qu'elle n'est pas en autre chose, elle ne sera en rien, mais en elle-même ; et le fait d'être en elle seule, et non pas en ce qui est, implique qu'elle est en lui ; car, dans la mesure où l'on est en relation avec lui, on n'est pas une réalité, mais on se trouve « au-delà de la réalité ».
  points: []
- id: "t9c11-p6"
  title: "De l'image au modèle"
  notes: ""
  passage:
    label: "l. 43-51"
    part: "La fin du voyage"
    text: |-
      Si donc on se voyait devenu cela, on se considérerait comme une copie de lui ; et si l'on partait de soi-même pour aller de l'image vers son modèle, on parviendrait à la « fin du voyage ». Si l'on déchoit de la contemplation, éveillant de nouveau la vertu qui est en lui et comprenant que l'on est ainsi embelli par les vertus, on se sentira à nouveau léger, en parvenant par l'intermédiaire de la vertu jusqu'à l'Intellect et au savoir, et par l'intermédiaire du savoir jusqu'à lui.
  points: []
- id: "t9c11-p6b"
  title: "Fuir seul vers lui seul"
  notes: ""
  passage:
    label: "l. 43-51"
    part: "La fin du voyage"
    text: |-
      Telle est la vie que mènent les dieux et les hommes divins et bienheureux : être libéré des choses d'ici-bas, vivre sans trouver son plaisir dans les choses d'ici-bas, fuir seul vers lui seul.
  points: []
