- id: traite48-l2
  title: "Les devins et la racine"
  notes: |-
    **Les devins** (chap. 6) : ils prédisent en observant la rotation de l'univers, parce que tout est tissé ensemble, comme la forme et la matière dans un vivant. Mais distinguer la providence de ce qui lui est conforme, seul un dieu le pourrait. Le devin dit ce qu'il en est, non **pourquoi** ; son art consiste à lire **les lettres de la nature**, par **analogie** : le pire est au pire comme le meilleur au meilleur. Les astres n'engendrent pas les choses d'ici : tout est engendré ensemble, comme les parties d'un vivant. Ce chapitre annonce le traité 52, *Si les astres agissent*.

    **La racine** (chap. 7) : abolir le pire, ce serait abolir la providence ; « d'en haut » dit justement son lien avec le bas. Toutes choses sortent d'un principe immobile comme d'une **racine** :

    | L'arbre | L'univers |
    | la racine | l'Âme |
    | le tronc et les branches | le ciel et les astres, permanents |
    | les feuilles et les fruits | les vivants d'ici, qui naissent et périssent |
    | les pousses entre les branches | les actions que les hommes font d'eux-mêmes |

    Les parties agissent les unes sur les autres comme des frères nés des mêmes parents.

    ! Le devin ne lit pas la providence : il lit des signes, dont il ignore la cause.
