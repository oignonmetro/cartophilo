id: traite48
title: "Traité 48 (III, 3) : Sur la providence II"
subtitle: "Providence, liberté et destin"
icon: compass
color: sky
lessons:
- id: traite48-l1
  title: "Un seul ordre, une seule providence"
  notes: |-
    **Un seul ordre** (chap. 1-2) : réponse à la question laissée par le traité 47. La raison totale contient les bonnes et les mauvaises actions : elle n'engendre pas les mauvaises, **elle les accompagne**. Les raisons sont l'activité d'une âme totale, leurs parties celle des âmes partielles. Comme les chevaux qui se mordent restent d'un seul genre, tout se ramène à l'être, puis à ce qui produit l'être : l'univers est **un animal un et multiple**. Il est administré par la providence d'un **général**, qui commanderait aussi l'armée adverse.

    **Pas de reproche** (chap. 3) : « je suis moi-même maître de choisir » ; mais ton choix fait partie de l'ordre, et ton rôle n'est pas un entracte. On ne blâme pas les plantes de n'être pas des hommes. Les choses naissent inégales parce que la raison, issue de l'Âme et de l'Intellect, s'amoindrit en s'élançant vers la matière.

    **Le principe libre** (chap. 4) : l'homme n'est pas simple : il possède **un principe de liberté**, qui n'échappe pas pour autant à la providence. Outre la raison productrice, il y a une raison qui relie les réalités supérieures aux choses engendrées. Ce principe n'agit pas en tous, à cause du corps ou des désirs ; les **vies antérieures** expliquent ce que l'on est, au point que l'âme d'un homme peut devenir celle d'un bœuf.

    | Providence | Où | Ce qu'elle est |
    | d'en haut | l'Intellect et l'Âme | pure providence |
    | d'en bas | la partie inférieure de l'âme du monde | la nature et le destin |

    **Providence et destin** (chap. 5) : elle est égale non mathématiquement, mais proportionnellement. Il n'y a qu'**une seule providence : destin en bas, pure providence en haut**. Les actes agréables aux dieux en sont les effets ; les autres sont les nôtres, et elle les **redresse**, comme la raison du corps suture une plaie. La beauté d'Hélène n'agissait pas de même sur Pâris et sur Idoménée. Agir contre la providence, c'est comme désobéir au médecin.

    ! L'action de l'homme tempérant n'est pas faite par la providence, puisqu'il la fait lui-même ; mais elle est conforme à la providence, car conforme à la raison.
