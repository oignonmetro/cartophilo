- id: traite48-l3
  title: "Repérage : le plan du traité 48"
  notes: |-
    **Le traité 48 répond à la dernière question du traité 47 (chap. 1-3), traite de l'homme et de la providence (chap. 4-5), puis des devins et de la racine (chap. 6-7).**

    | Moment | Lieu | Ce qui s'y joue |
    | la raison accompagne le mal | 1, 1-6 | les âmes partielles |
    | un seul ordre universel | 1, 7-fin | les chevaux qui se mordent |
    | la providence du général | chap. 2 | l'armée adverse |
    | ni le producteur ni le produit | chap. 3 | pas un entracte |
    | le principe libre | 4, 1-18 | deux raisons |
    | un principe absent chez certains | 4, 18-54 | les vies antérieures |
    | une égalité proportionnelle | 5, 1-14 | un seul chant |
    | providence et destin | 5, 14-20 | une seule providence |
    | les fautes redressées | 5, 20-32 | la plaie suturée |
    | les maux viennent de nous | 5, 33-54 | Hélène |
    | les devins | chap. 6 | les lettres de la nature |
    | abolir le pire | chap. 7 | la racine et l'arbre |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! Le traité 48 commence au milieu d'une discussion : sa première phrase répond à la dernière question du traité 47.
