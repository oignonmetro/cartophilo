- id: traite12-l4
  title: "Privation, non-être, illimité, mal"
  notes: |-
    **Plotin décrit enfin les quatre caractéristiques les plus importantes de la matière sensible** (chap. 13-16) :

    | La matière est | Contre ou avec | Ce que Plotin soutient |
    | la privation | contre Aristote (*Physique*, I, 9) | mêmes définitions, donc une seule chose, et non « uns par le nombre, mais deux par la définition » |
    | un non-être relatif | avec le *Sophiste* (256d-259b) | la partie de l'altérité qui s'oppose aux raisons (`lógoi`) : le non-forme, le non-raison |
    | l'illimité (`ápeiron`) | avec la tradition platonicienne (*Philèbe*, 23c-26e) | l'illimité est matière du sensible et de l'intelligible |
    | le mal | avec le traité 51 (I, 8) | l'absence la plus complète de bien |

    **Le non-être** : Aristote faisait de la privation un non-être absolu, et de la matière un non-être par accident. Plotin, avec Platon, nie le non-être absolu : seul existe un non-être **relatif**, autre que l'être, non contraire.

    **L'illimité : un renversement spectaculaire.** Lequel, de l'illimité sensible ou de l'illimité intelligible, est le modèle de l'autre ? Plotin fait de **l'illimité sensible l'archétype**, et de l'illimité intelligible son image : le véritable illimité ne se trouve que dans ce qui est le moins défini. Partout ailleurs, l'intelligible est le modèle du sensible.

    **Le mal** : la matière est **pauvreté** « en ce qui concerne la raison, […] la vertu, la beauté, la force, la figure, la forme, la qualité » (16, 21-23). Alors que l'Un est au-delà de l'être, la matière est **en deçà de l'être**. Le traité 51 (I, 8), *Quels sont les maux ?*, montrera que le mal ne vient ni de l'âme, ni des dieux, ni de l'intelligible, mais de la matière.

    ! Pour Aristote, matière et privation sont distinctes ; pour Plotin, elles ne font qu'un, ce qui permet d'identifier la matière au mal.
  points:
  - id: traite12-l4-p1
    sentence: "Contre Aristote, le traité 12 soutient que la matière et la ___ sont identiques."
    answer: "privation"
    alt: []
  - id: traite12-l4-p2
