- id: traite12-l5
  title: "Repérage : le plan du traité 12"
  notes: |-
    **Après une introduction (chap. 1), le traité 12 traite de la matière intelligible (chap. 2-5), puis de la matière sensible (chap. 6-16).**

    | Moment | Lieu | Ce qui s'y joue |
    | introduction | chap. 1 | stoïciens, aristotéliciens, platoniciens |
    | objections contre la matière intelligible | chap. 2 | rien d'indéfini là-bas |
    | réponses aux objections | chap. 3 | ne pas mépriser l'indéfini |
    | la matière intelligible existe | chap. 4 | les trois arguments |
    | matière et forme | 5, 1-23 | le cadavre ornementé |
    | la génération intemporelle des Formes | 5, 24-39 | engendrée, mais pas dans le temps |
    | la matière sensible existe | chap. 6 | la transformation des éléments |
    | contre les préplatoniciens | chap. 7 | réfutation des théories antérieures |
    | la nature de la matière sensible | chap. 8 | simple, sans qualité |
    | quantité et grandeur | chap. 9 | contre la grandeur stoïcienne |
    | comment l'Intellect perçoit la matière | chap. 10 | le raisonnement bâtard |
    | une matière sans grandeur | chap. 11 | apories, puis réponses (jusqu'au chap. 12) |
    | matière et qualité | chap. 13 | la matière sans qualité |
    | matière et privation | chap. 14 | contre Aristote |
    | matière et illimité | chap. 15 | l'illimité sensible, archétype |
    | matière, altérité, privation, mal | chap. 16 | la pauvreté |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! Le traité suit l'ordre annoncé dès le titre : la matière intelligible, plus noble, vient avant la matière sensible.
