- id: traite12-l3
  title: "La matière sensible : privée de tout, même de grandeur"
  notes: |-
    **La matière sensible existe** (chap. 6) : seule elle explique la **transformation des éléments** les uns dans les autres. Rien ne se perd dans le non-être ni n'en vient : un sujet demeure, qui reçoit tantôt une forme, tantôt une autre. L'argument vient de la *Physique* d'Aristote (I, 7-9).

    **Sa description puise à Platon et à Aristote** :

    - le **réceptacle** du *Timée* (50b-51a), « porte-empreinte » qui ne doit ressembler à rien de ce qu'il reçoit ;
    - la **matière première** d'Aristote, sous les catégories, dépourvue de substance, de quantité, de qualité (*Métaphysique*, Z, 3).

    **Ses caractéristiques** : une, continue, sans qualité ; pas un corps ; sans couleur, chaleur, froid, légèreté, pesanteur, densité, figure, grandeur, forme, raison ; simple ; elle reçoit tout **sans résistance**, et reçoit tout de la forme, **même la quantité**.

    **Contre les stoïciens**, pour qui la matière est un corps sans qualité mais pourvu de grandeur (chap. 9) : la matière n'a pas de grandeur avant de recevoir la forme de la grandeur. Et la forme de la quantité n'est pas quantifiée, **pas plus que la forme de la blancheur n'est blanche** : seul ce qui participe d'une forme en a la qualité.

    **Ni grandeur ni masse** (`ógkos`, chap. 11-12), la masse étant le premier stade du corps. L'Âme aussi est un réceptacle sans masse. Sans grandeur, la matière s'étend à volonté pour devenir un homme ou un oiseau. Si nous l'imaginons comme une masse, c'est que notre âme, devant son indétermination, perd pied et s'y répand.

    **On ne la saisit que par un raisonnement « bâtard »** : la sensation n'y peut rien. Platon le disait (*Timée*) ; la représentation de la matière est « bâtarde et non légitime ». Comme l'obscurité pour l'œil, l'âme qui retranche toutes les qualités voit comme dans l'obscurité.

    ! La matière n'est pas un corps sans qualités : elle est en deçà de la corporéité, et la grandeur même lui vient de la forme.
