id: traite12
title: "Traité 12 (II, 4) : Sur les deux matières"
subtitle: "Matière intelligible, matière sensible"
icon: compass
color: sky
lessons:
- id: traite12-l1
  title: "Deux matières incorporelles : le classement des doctrines"
  notes: |-
    **Le traité 12, d'une richesse et d'une complexité remarquables, suit un plan rigoureux** : une introduction (chap. 1), la matière intelligible (chap. 2-5), puis la matière sensible (chap. 6-16).

    **Tous disent que la matière est « un substrat et le réceptacle des formes »** (1, 1-2) ; ils se séparent quand il s'agit de dire ce qu'est ce substrat. Plotin classe les doctrines comme Aristote le faisait (*Métaphysique*, A, 7) : la matière est-elle une ou multiple, corporelle ou incorporelle ?

    | École | La matière est |
    | les stoïciens | unique et corporelle |
    | les aristotéliciens | unique et incorporelle |
    | les platoniciens | multiple et incorporelle |

    Les stoïciens ont même **« l'audace d'étendre la matière jusqu'aux dieux »** : leur dieu n'est que de la matière disposée d'une certaine manière (1, 11-12).

    **Plotin adopte la position de Platon : une matière sensible et une matière intelligible, toutes deux incorporelles.** Platon ne donne pourtant aucun argument pour une matière intelligible. Mais, selon Aristote, il aurait fait de la **Dyade indéfinie**, du **Grand et du Petit**, ou de l'illimité, la matière des Idées (*Métaphysique*, A, 6) : il n'en fallait pas plus pour lancer le débat chez les médioplatoniciens. Plotin associe la matière à l'illimité (`ápeiron`, chap. 15) et au couple du Grand et du Petit (11, 32-36) ; d'autres traités identifient la matière intelligible à la Dyade indéfinie (7 (V, 4), 2 ; 10 (V, 1), 5).

    ! La « matière des Idées » n'est pas chez Platon : Plotin la tient du témoignage d'Aristote et des débats médioplatoniciens.
