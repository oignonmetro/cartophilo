- id: traite12-l2
  title: "La matière intelligible : trois arguments"
  notes: |-
    **Objections** (chap. 2) : si la matière est indéfinie et informe, elle n'a pas sa place parmi les êtres de là-bas, qui sont les meilleurs ; les intelligibles sont simples et ne naissent pas ; d'où viendrait-elle ? **Réponse** (chap. 3) : il ne faut pas mépriser l'indéfini s'il s'offre comme substrat aux réalités meilleures ; l'Âme elle-même reçoit sa figure de l'Intellect.

    **Trois arguments pour la matière intelligible** (chap. 4) :

    | Argument | Raisonnement |
    | la multiplicité des Formes | chaque Forme a sa figure propre ; il faut un substrat qui la reçoive, et qui leur soit commun pour que l'intelligible ne se fragmente pas |
    | le modèle et la copie | le monde sensible imite l'intelligible ; s'il y a une matière ici, il y en a une là-bas |
    | l'unimultiplicité de l'Intellect | le « monde » (`kósmos`) intelligible est une Forme unique qui en contient beaucoup ; leurs distinctions viennent d'une matière « coupée » en autant de figures |

    **Les deux matières diffèrent** (chap. 5) :

    | Matière intelligible | Matière sensible |
    | recevant sa forme, devient une vie définie et intellective | même formée, ne vit ni ne pense |
    | une réalité, parmi les êtres véritables | « un cadavre ornementé » (5, 18) |
    | garde toujours la même forme, car là-bas tout est à la fois | reçoit une forme après une autre |

    **Elle est engendrée, mais pas dans le temps**, comme les Formes. C'est **le produit informe qu'engendre chaque réalité intelligible**, avant sa **conversion** : l'Intellect, produit par l'Un, est d'abord indéfini et ne reçoit sa forme qu'en se retournant vers lui ; de même l'Âme envers l'Intellect (voir 11 (V, 2), 1 et 15 (III, 4), 1).

    ! « Engendrée » ne veut pas dire née à un moment : la matière intelligible a une origine, non un commencement.
