lessons:
- id: g-especes-l1
  title: Espèces
  notes: |-
    Chez Plotin, les {violet}**espèces**{/violet} des vivants sont [def]. Elles ne sont pas {pink}des classes que nous formons en comparant les individus{/pink} : elles sont d'abord des vivants intelligibles, et c'est par elles que les vivants d'ici durent.

    __**Il y a des espèces diverses parce que le vivant parfait doit tout contenir : la différence fait la perfection du tout.**__ Pourquoi pas un seul vivant, le meilleur ? Parce qu'un tout fait d'éléments identiques ne serait pas un tout, mais une seule chose répétée : « s'il est vrai qu'il doit résulter d'une multiplicité, il faut aussi qu'il soit un ; mais __il n'est pas possible qu'il résulte d'une multiplicité si tous les éléments qui composent cette multiplicité sont identiques__ » ([[traite38|traité 38]], chap. 10). Les espèces se distinguent donc par ce que chacune a et que les autres n'ont pas : « la différence consiste dans le fait d'avoir ceci plutôt que cela, à la fois pour que de l'ensemble des vivants résulte __le vivant le plus parfait__, l'intellect parfait et la vie la plus parfaite, et pour que chacun d'eux soit parfait en tant que vivant particulier » (*ibid*. ; voir [[g-vivant-total|vivant total]]). Chaque espèce est parfaite à sa manière, et leur ensemble est parfait par leur diversité. C'est même pourquoi les espèces ont là-bas leurs organes propres, cornes comprises. Quel besoin de cornes pour se défendre là où rien ne menace ? « Eh bien, c'est parce qu'il faut que le vivant, en tant que tel, __soit autarcique et parfait__ » (chap. 10). La corne ne répond pas à un danger ; elle achève une forme.

    __**Les espèces sont d'abord là-bas : même le cheval et la plante y sont intellect.**__ L'espèce n'est pas inventée par un dieu qui calculerait ce dont le monde a besoin. Si le dieu avait voulu produire un cheval, c'est que la pensée du cheval était déjà là ; « de sorte qu'il n'est pas possible qu'il ait pensé le cheval pour le produire, mais que __le cheval qui n'est pas engendré précède le cheval qui viendra ensuite__ » ([[traite38|traité 38]], chap. 8). Mais n'est-ce pas abaisser l'Intellect que d'y mettre des bêtes sans raison ? Non, car là-bas tout est pensée : « même ce qu'on dit n'être pas une raison est une raison, et __ce qui n'est pas intellect est Intellect__, car même celui qui pense un cheval est Intellect, et l'intellection du cheval est également Intellect » (chap. 9 ; voir [[g-intellect|Intellect]]). L'irrationnel n'est tel qu'ici, dans la matière. De même la plante : « la première plante est une, tandis que les plantes d'ici-bas sont plusieurs et __viennent par nécessité de la première plante__ » (chap. 11 ; voir [[g-eidos|forme]]).

    __**L'espèce dure quand l'individu passe : il y aura toujours des hommes, mais pas les mêmes.**__ Les vivants d'ici sont faits d'un corps qui s'écoule (voir [[g-vieillesse|vieillesse]]) ; ils ne peuvent donc pas durer en restant les mêmes individus. Ce qui demeure, c'est leur forme : « la transformation des éléments et la corruption des vivants qui peuplent la terre __ne préservent que leur forme__ » ([[traite40|traité 40]], chap. 1). D'où la formule : pour l'homme, le cheval et les autres vivants, « __il existera toujours des hommes et des chevaux, mais ce ne seront pas les mêmes__ » (*ibid*.). Le ciel, lui, dure peut-être en restant le même individu ; les vivants de la terre durent par l'espèce, d'une génération à l'autre (voir [[g-reproduction|reproduction]]).

    __**Il y a une forme de chaque individu, et le retour des périodes limite leur nombre.**__ Une forme de l'homme suffit-elle pour tous les hommes ? Non, car les hommes ne diffèrent pas seulement par la matière : un seul modèle « ne peut suffire à rendre compte d'individus humains qui se différencient les uns des autres non seulement par la matière, mais aussi par __d'innombrables différences formelles__ » ([[traite18|traité 18]], chap. 1). D'où la réponse : « Y a-t-il une idée de chaque individu ? – Oui, c'est le cas » : si chacun de nous peut remonter jusqu'à l'intelligible, __le principe de chacun est aussi là-haut__ (*ibid*.). Faut-il alors une infinité de formes, puisque les individus se succèdent sans fin ? Non, car les mêmes reviennent : « une période tout entière contient toutes les raisons, à la période suivante les mêmes choses reviennent selon les mêmes raisons » ; ainsi « __l'illimitation se verra limitée__, chaque fois que les mêmes choses se reproduisent » (*ibid*.).

    __**L'âme change d'espèce selon la partie d'elle-même qu'elle a développée.**__ Une âme n'est pas attachée à une espèce une fois pour toutes. Elle a en elle tous les degrés de la vie, sensitif, rationnel, végétatif, et c'est la partie qui l'emporte qui donne sa forme au vivant : « la partie qui domine en elle remplit sa fonction propre, alors que les autres parties demeurent inactives » ([[traite15|traité 15]], chap. 2). Il en va de même à la mort : « quand l'âme quitte le corps, __elle devient celle de ses parties qu'elle a développée le plus__ » (*ibid*.). D'où l'échelle des renaissances : « tous ceux, donc, qui ont préservé « l'homme » redeviennent des hommes en une autre existence. Ceux, par contre, qui n'ont vécu que par la sensation __deviennent des animaux__. Mais si aux sensations se joint l'irascibilité, ils deviennent des animaux sauvages » (*ibid*.). C'est pourquoi il faut « fuir vers le haut », pour ne pas descendre au niveau de l'âme sensitive ou végétative (*ibid*. ; voir [[g-tripartition-de-l-ame|tripartition de l'âme]]).

    | Ce qui l'a emporté dans une vie | Ce que l'âme devient |
    | la raison, « l'homme » préservé | un homme |
    | la seule sensation | un animal |
    | la sensation et l'irascibilité | un animal sauvage |

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 15, chap. 2 | l'âme devient la partie qu'elle a développée |
    | traité 18, chap. 1 | une idée de chaque individu ; le retour des périodes |
    | traité 38, chap. 8 | le cheval non engendré précède le cheval engendré |
    | traité 38, chap. 9 | là-bas, ce qui n'est pas intellect est Intellect |
    | traité 38, chap. 10 | des éléments identiques ne font pas un tout |
    | traité 40, chap. 1 | toujours des hommes et des chevaux, pas les mêmes |

    **Voir aussi** : [[g-eidos|Forme]] · [[g-vivant-total|Vivant total]] · [[g-reproduction|Reproduction]] · [[g-logos-spermatikos|Raison séminale]] · [[g-naissance|Naissance]]
