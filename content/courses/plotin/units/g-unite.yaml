- id: g-unite-l3
  title: Ce que cela fait pour nous
  notes: |-
    **Si être, c'est être un, la doctrine de l'unité n'est pas seulement une ontologie : elle dit ce que nous gagnons à nous rassembler, et ce que nous perdons à nous disperser.** Plotin en tire des conséquences pour la pensée, la beauté et le désir.

    __**La dispersion est une perte d'être.**__ Se disperser, c'est être **moins**, et on peut le reconnaître de l'intérieur. Plotin décrit l'âme qui s'éveille « à elle-même » en sortant de son corps et en rentrant à l'intérieur d'elle ([[traite6|traité 6]], chap. 1) : c'est alors qu'elle retrouve sa pleine présence. Pour rejoindre son principe, l'âme doit {green}**devenir une**{/green} : se défaire de la dispersion des représentations extérieures et se tenir seule avec elle-même ([[traite9|traité 9]], chap. 3-4).

    __**Comprendre rassemble.**__ Plotin compare l'âme qui comprend à une {yellow}science et à ses théorèmes{/yellow} : dans l'esprit du savant, tous existent ensemble, et saisir l'un d'eux, c'est saisir la science entière ([[traite30|traité 30]], chap. 6). Les {yellow}géomètres qui tracent des figures sur le sable{/yellow} le font parce que la contemplation intérieure peine à se maintenir : le dessin n'est qu'un appui pour saisir d'un seul coup ce que l'esprit contemple (chap. 4). **Le plaisir de comprendre n'est donc pas un supplément psychologique : c'est le signe d'un retour vers un niveau plus unifié de soi**, et l'âme y est saisie d'une « stupeur accompagnée de plaisir » ([[traite1|traité 1]], chap. 4, l. 16-17).

    __**La beauté est une forme qui domine la matière.**__ Pourquoi un visage ou un accord nous saisit-il ? Plotin récuse d'abord la thèse stoïcienne selon laquelle {red}la beauté serait la symétrie des parties{/red} ([[traite1|traité 1]], chap. 1) : elle laisserait inexplicable la beauté des choses simples (l'or, l'éclair dans la nuit, la lumière du soleil, un son simple), qui n'ont pas de parties à proportionner, et celle des réalités sans corps (les lois, les vertus). {green}La beauté sensible naît de la domination d'une **forme** sur la matière{/green} (chap. 2-3), comme la maison construite est belle parce qu'elle fait passer dans le sensible l'idée de l'architecte. Notre âme reconnaît dans cette forme une trace de sa propre nature intelligible : d'où le sentiment de familiarité devant le beau. **Le laid**, à l'inverse, est ce que la forme et la raison n'ont pas réussi à maîtriser (chap. 2 et 5) : une privation, non une réalité positive.

    __**Le désir s'arrête trop tôt.**__ Tous les êtres désirent le Bien, même si la plupart l'ignorent ([[traite54|traité 54]], chap. 1). Ce que l'on poursuit, on le poursuit parce qu'on y voit une unité et une plénitude, bref {coral}un **reflet du Bien**{/coral}. Or aucun objet particulier n'est pleinement un : aucun ne comble, et le manque se déplace. {coral}Le désir n'est pas mal dirigé en son principe : il s'arrête trop tôt sur un reflet.{/coral}

    ! Plotin ne parle pas en ces termes de « se sentir rassemblé » : ce rapprochement relie sa doctrine de l'unité à ce qu'il dit de la dispersion, de la science et de la beauté, mais l'expression n'est pas de lui.
