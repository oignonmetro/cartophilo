- id: g-unite-l2
  title: Les étages d'unification
  notes: |-
    **Un vivant en offre l'exemple.** Son corps est une multiplicité de parties : ce qui le tient comme corps, c'est l'**âme**. Mais l'âme est elle-même multiple : perceptions, souvenirs, désirs, raisonnements, qui se contredisent parfois. Ce qui les unifie, c'est l'**Intellect**, c'est-à-dire la capacité de saisir d'un seul regard ce que l'âme n'atteint qu'en passant d'une idée à l'autre. Or l'Intellect lui-même est encore multiple, puisqu'il pense plusieurs choses (le cercle, le nombre, le juste) : c'est un « un-multiple » (`hen polla`). Il faut donc un principe qui rende **un** ce qui pense.

    **Ce principe ne peut pas être composé**, sinon il aurait besoin d'un unificateur de plus et la régression ne s'arrêterait jamais : c'est l'**Un**. On trouve ce mouvement en VI, 9, 2 (l'Intellect est multiple, donc il y a avant lui quelque chose de simple), en V, 3, 11-12 (tout composé a besoin de l'unité, le principe premier de rien) et en V, 4, 1 (il faut qu'il y ait quelque chose de simple avant toutes choses).

    | Étage | Ce qu'il unifie | Ce qui reste multiple en lui |
    | Âme | le corps | perceptions, souvenirs, désirs, raisonnements |
    | Intellect | l'âme | les Formes (le cercle, le nombre, le juste) |
    | Un | l'Intellect | rien : il est absolument simple |

    **Les trois « hypostases » (V, 1 [10]) ne sont donc rien d'autre que ces étages d'unification.** Une hypostase est simplement un niveau de réalité qui a sa consistance propre, comme un étage d'immeuble qui tient seul tout en reposant sur le précédent. Plotin décrit le mouvement descendant par la **procession** (`proodos`) et la remontée par la **conversion** (`epistrophê`) : « unification » est ici le mot du cours, pas le sien.

    **Âme et corps : l'âme n'assemble pas le corps.** L'âme n'est pas un maçon qui ajuste des pierres. Selon les traités 2, 6 et 22-23, elle est incorporelle et indivisible, présente tout entière dans chaque partie du corps sans s'y morceler, et elle l'informe de l'intérieur par les **raisons** (`logoi`). Plotin va jusqu'à inverser l'image : ce n'est pas l'âme qui est dans le corps, c'est le corps qui subsiste dans l'âme. Un corps réduit à sa seule matière ne serait qu'une masse (`ogkos`) sans cohésion.

    **Intellect et âme : se tourner vers lui.** L'âme tient son unité de l'Intellect en se **tournant** vers lui (`epistrophê`). Son activité propre est la pensée discursive (`dianoia`), qui parcourt les raisons l'une après l'autre ; le regard « d'un seul coup » caractérise l'Intellect seul. Plotin le compare à une science et à ses théorèmes : tous coexistent dans l'esprit du savant sans se séparer.

    ! Chaque étage unifie celui du dessous, mais reste lui-même multiple d'une autre manière : seul l'Un n'a plus rien de multiple.

    ! `henôsis` (« union »), chez Plotin, désigne l'acte final d'union de l'âme avec l'Un (voir la fiche « Hénose ») : le réserver à ce sens, et dire « unité » ou « unification » pour les étages.
