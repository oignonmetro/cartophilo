- id: g-unite-l2
  title: Les étages d'unification
  notes: |-
    **Si tout ce qui est multiple tient son unité d'un principe, on peut remonter de principe en principe : chaque étage unifie celui du dessous, mais reste multiple d'une autre manière.** C'est ainsi que les trois hypostases sortent d'une même question.

    __**Le corps est unifié par l'âme.**__ Le corps d'un vivant est une multiplicité de parties : ce qui le tient comme corps, c'est l'{violet}**âme**{/violet}. Sans elle, il ne serait qu'une masse (*ogkos*) sans cohésion, un cadavre.

    __**L'âme est unifiée par l'Intellect.**__ Mais l'âme est elle-même multiple : perceptions, souvenirs, désirs, raisonnements, qui se contredisent parfois. Ce qui les unifie, c'est l'{violet}**Intellect**{/violet}, la capacité de saisir d'un seul regard ce que l'âme n'atteint qu'en passant d'une idée à l'autre. L'âme tient son unité de l'Intellect en se **tournant** vers lui (*epistrophê*).

    __**L'Intellect est unifié par l'Un.**__ Or l'Intellect lui-même est encore multiple, puisqu'il pense plusieurs choses (le cercle, le nombre, le juste) : c'est un « un-multiple » (*hen polla*). {red}Il faut donc un principe qui rende un ce qui pense.{/red} Et ce principe ne peut pas être composé, sinon il lui faudrait un unificateur de plus et la régression ne s'arrêterait jamais : {green}c'est l'**Un**{/green}. On trouve ce mouvement en VI, 9 ([[traite9|traité 9]]), 2, en V, 3 ([[traite49|traité 49]]), 11-12 et en V, 4 ([[traite7|traité 7]]), 1 : il faut quelque chose de simple avant toutes choses.

    | Étage | Ce qu'il unifie | Ce qui reste multiple en lui |
    | Âme | le corps | perceptions, souvenirs, désirs, raisonnements |
    | Intellect | l'âme | les Formes (le cercle, le nombre, le juste) |
    | Un | l'Intellect | rien : il est absolument simple |

    __**L'âme n'assemble pas le corps comme un maçon.**__ Elle est incorporelle et indivisible, présente tout entière dans chaque partie du corps sans s'y morceler (traités 2, 6 et 22-23), et elle l'informe de l'intérieur par les {violet}raisons{/violet} (*logoi*). Plotin va jusqu'à inverser l'image : {coral}ce n'est pas l'âme qui est dans le corps, c'est le corps qui subsiste dans l'âme.{/coral}

    ! Les trois hypostases ([[traite10|traité 10]], V, 1) ne sont pas trois choses empilées : ce sont trois manières d'être un, de la moins simple à la plus simple. Plotin décrit le mouvement descendant par la procession (*proodos*) et la remontée par la conversion (*epistrophê*) ; « étages d'unification » résume cette structure, ce n'est pas son vocabulaire.

    ! Le mot *henôsis* (« union ») désigne chez Plotin l'union finale de l'âme avec l'Un : on dira « unité » ou « unification » pour les étages.
