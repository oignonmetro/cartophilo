id: g-unite
title: Unité (`hen`)
subtitle: Être, c'est être un, et ce qui unifie est toujours au-dessus de ce qu'il unifie
icon: infinity
color: violet
lessons:
- id: g-unite-l1
  title: Être, c'est être un
  notes: |-
    **Le problème de départ, très ordinaire (VI, 9 [9], 1).** Qu'est-ce qui fait qu'une chose est **une seule** chose ? Une armée, un chœur, une maison ne sont pas des tas de soldats, de voix ou de briques : si l'unité disparaît, la chose disparaît avec elle. Dispersez les briques, il n'y a plus de maison. **Être quelque chose, c'est donc d'abord être un.** C'est la seule prémisse dont Plotin a besoin, et elle se trouve déjà dans l'expérience.

    **Cette unité ne vient jamais des parties elles-mêmes.** Les briques ne s'assemblent pas toutes seules : il faut une **forme** qui les tienne ensemble. Tout ce qui est multiple dépend donc de ce qui le rend un.

    ! L'unité dont parle ici Plotin n'est pas l'Un lui-même (voir la fiche « Un ») : c'est la propriété que possède toute chose, dans la mesure où elle est quelque chose. L'Un est ce qui la donne à tout le reste sans la recevoir de personne.
  points:
  - id: g-unite-l1-1
    sentence: Pour poser le problème de l'unité, Plotin part d'un exemple très ordinaire, celui d'une armée, d'un chœur ou d'une ___, qui n'existent que tant qu'ils sont unifiés (VI, 9, 1).
    answer: maison
    alt: ["maisons"]
  - id: g-unite-l1-2
    sentence: Si les briques d'une maison sont dispersées, l'unité disparaît et la maison avec elle : pour Plotin, être quelque chose, c'est d'abord être ___ (VI, 9, 1).
    answer: un
    alt: ["une"]
  - id: g-unite-l1-3
    sentence: L'unité d'une chose ne vient jamais de ses parties elles-mêmes : il faut une ___ qui les tienne ensemble, comme les briques d'une maison.
    answer: forme
    alt: []
  - id: g-unite-l1-4
    sentence: Le principe qui commande toute l'inférence de Plotin est le suivant : tout ce qui est ___ dépend de ce qui le rend un.
    answer: multiple
    alt: ["composé"]
  - id: g-unite-l1-5
    sentence: Le traité où Plotin pose le problème de l'unité d'une armée, d'un chœur ou d'une maison, au début de son étude du Bien ou de l'Un, est le traité ___ (VI, 9).
    answer: 9
    alt: ["neuf"]
- id: g-unite-l2
  title: Les étages d'unification
  notes: |-
    **Un vivant en offre l'exemple.** Son corps est une multiplicité de parties : ce qui le tient comme corps, c'est l'**âme**. Mais l'âme est elle-même multiple : perceptions, souvenirs, désirs, raisonnements, qui se contredisent parfois. Ce qui les unifie, c'est l'**Intellect**, c'est-à-dire la capacité de saisir d'un seul regard ce que l'âme n'atteint qu'en passant d'une idée à l'autre. Or l'Intellect lui-même est encore multiple, puisqu'il pense plusieurs choses (le cercle, le nombre, le juste). Il faut donc un principe qui rende **un** ce qui pense.

    **Ce principe ne peut pas être composé**, sinon il aurait besoin d'un unificateur de plus et la régression ne s'arrêterait jamais : c'est l'**Un**.

    | Étage | Ce qu'il unifie | Ce qui reste multiple en lui |
    | Âme | le corps | perceptions, souvenirs, désirs, raisonnements |
    | Intellect | l'âme | les Formes (le cercle, le nombre, le juste) |
    | Un | l'Intellect | rien : il est absolument simple |

    **Les trois « hypostases » (V, 1 [10]) ne sont donc rien d'autre que ces étages d'unification.** Une hypostase est simplement un niveau de réalité qui a sa consistance propre, comme un étage d'immeuble qui tient seul tout en reposant sur le précédent. L'ontologie de Plotin n'est donc pas un décor postulé : c'est le résultat d'une seule inférence répétée trois fois.

    ! Chaque étage unifie celui du dessous, mais reste lui-même multiple d'une autre manière : seul l'Un n'a plus rien de multiple.
  points:
  - id: g-unite-l2-1
    sentence: Dans un vivant, ce qui tient ensemble les parties du corps et les fait former un corps est l'___.
    answer: âme
    alt: ["ame"]
  - id: g-unite-l2-2
    sentence: L'âme est elle-même multiple (perceptions, souvenirs, désirs, raisonnements) ; ce qui l'unifie est la capacité de saisir d'un seul regard ce qu'elle n'atteint qu'en passant d'une idée à l'autre, c'est-à-dire l'___.
    answer: Intellect
    alt: ["intellect"]
  - id: g-unite-l2-3
    sentence: L'Intellect est lui-même encore multiple, parce qu'il ___ plusieurs choses à la fois (le cercle, le nombre, le juste).
    answer: pense
    alt: ["contemple"]
  - id: g-unite-l2-4
    sentence: Le principe qui rend un ce qui pense ne peut pas être composé, sinon il faudrait un unificateur de plus et la ___ ne s'arrêterait jamais.
    answer: régression
    alt: ["regression"]
  - id: g-unite-l2-5
    sentence: Le principe qui unifie l'Intellect et n'a plus rien de multiple est l'___.
    answer: Un
    alt: ["un"]
  - id: g-unite-l2-6
    sentence: Chez Plotin, les trois hypostases (V, 1 [10]) ne sont rien d'autre que les trois étages d'___ : l'âme unifie le corps, l'Intellect unifie l'âme, l'Un unifie l'Intellect.
    answer: unification
    alt: ["unité"]
  - id: g-unite-l2-7
    sentence: Le mot « hypostase » désigne simplement un niveau de réalité qui a sa propre ___, comme un étage d'immeuble qui tient seul tout en reposant sur le précédent.
    answer: consistance
    alt: ["subsistance"]
  - id: g-unite-l2-8
    sentence: L'ontologie de Plotin n'est pas un décor postulé : c'est le résultat d'une seule ___ répétée trois fois, « tout ce qui est multiple dépend de ce qui le rend un ».
    answer: inférence
    alt: ["inference"]
- id: g-unite-l3
  title: Ce que cela fait pour nous
  notes: |-
    **La dispersion est une perte d'être.** Si être, c'est être unifié, alors se disperser, c'est être **moins**, et on peut le reconnaître de l'intérieur. Quand nous sommes distraits, qu'une journée se délite en tâches, notifications et pensées parasites, nous avons bien l'impression d'être moins là. À l'inverse, quand nous suivons une démonstration qui « tient », qu'un texte difficile s'éclaire d'un coup, ou qu'une phrase musicale absorbe toute notre attention, nous nous sentons plus réels, plus rassemblés. Plotin dirait que c'est littéralement le cas : dans ces moments, l'âme se laisse **unifier par l'Intellect**. Le plaisir de comprendre n'est donc pas un bonus psychologique : c'est le signe d'un retour vers un niveau plus unifié de soi.

    **La beauté (I, 6 [1]).** Pourquoi un visage ou un accord nous saisit-il ? Parce qu'une **forme** y domine une multiplicité de parties, et que notre âme reconnaît là quelque chose de sa propre nature : d'où le sentiment de familiarité, voire de retrouvailles, devant le beau. Le **laid**, au contraire, est ce que la forme n'a pas réussi à maîtriser, et on le ressent comme un désordre.

    **Le désir.** Tout ce que l'on poursuit, on le poursuit parce qu'on y voit une unité et une plénitude, bref un **reflet du Bien**. Or aucun objet particulier n'est pleinement un, donc aucun ne comble : on obtient ce qu'on voulait, et le manque se déplace. Le désir n'est pas mal dirigé en son principe : il s'arrête trop tôt sur un reflet.

    ! L'expérience décrite ici (se sentir plus rassemblé en comprenant) est l'illustration que Plotin permet de donner de sa doctrine, non un passage où il la décrirait en ces termes.
  points:
  - id: g-unite-l3-1
    sentence: Si être, c'est être unifié, alors la dispersion est une perte d'___, que l'on peut reconnaître de l'intérieur.
    answer: être
    alt: ["etre"]
  - id: g-unite-l3-2
    sentence: Quand nous suivons une démonstration qui tient, ou qu'un texte difficile s'éclaire d'un coup, l'âme se laisse unifier par l'___ : le plaisir de comprendre en est le signe.
    answer: Intellect
    alt: ["intellect"]
  - id: g-unite-l3-3
    sentence: Pour Plotin, le plaisir de comprendre n'est pas un bonus psychologique : c'est le signe d'un retour vers un niveau plus ___ de soi.
    answer: unifié
    alt: ["unifie"]
  - id: g-unite-l3-4
    sentence: Un visage ou un accord nous saisit parce qu'une ___ y domine une multiplicité de parties, et que notre âme y reconnaît quelque chose de sa propre nature (I, 6 [1]).
    answer: forme
    alt: []
  - id: g-unite-l3-5
    sentence: Le laid est ce que la forme n'a pas réussi à ___, et on le ressent comme un désordre.
    answer: maîtriser
    alt: ["maitriser", "dominer"]
  - id: g-unite-l3-6
    sentence: Tout ce que l'on poursuit, on le poursuit parce qu'on y voit une unité et une plénitude, c'est-à-dire un ___ du Bien.
    answer: reflet
    alt: []
  - id: g-unite-l3-7
    sentence: Aucun objet particulier n'est pleinement un, donc aucun ne comble le désir : on obtient ce qu'on voulait, et le ___ se déplace.
    answer: manque
    alt: []
  - id: g-unite-l3-8
    sentence: Le désir n'est pas mal dirigé en son principe : il s'arrête trop tôt sur un ___ du Bien.
    answer: reflet
    alt: []
