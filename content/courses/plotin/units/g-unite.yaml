  - id: g-unite-l1-q1
    sentence: "« C'est en vertu de l'unité que tous les êtres sont des êtres [...]. Et en effet, qu'est-ce qui pourrait ___, sans être un ? » (traité 9, chap. 1, l. 1-3)."
    answer: être
    alt: ["etre"]
  - id: g-unite-l1-q2
    sentence: "« C'est en vertu de l'unité que tous les êtres sont des êtres, aussi bien ceux qui sont des êtres ___ que ceux qui sont dits être de quelque manière parmi les êtres » (traité 9, chap. 1, l. 1-3)."
    answer: au sens premier du terme
    alt: []
  - id: g-unite-l1-q3
    sentence: "« S'ils perdaient l'unité, la ___ ne serait plus une maison ni le navire un navire » (traité 9, chap. 1, l. 5-7)."
    answer: maison
    alt: []
  - id: g-unite-l1-2
    sentence: "Si les briques d'une maison sont dispersées, l'unité disparaît et la maison avec elle : pour Plotin, être quelque chose, c'est d'abord être ___ (traité 9, chap. 1)."
    answer: un
    alt: ["une"]
  - id: g-unite-l1-q4
    sentence: "Ce que montre chaque exemple de Plotin, c'est que la chose disparaît au moment précis où son ___ se défait : la preuve que l'être tient à l'unité est dans la ruine."
    answer: unité
    alt: ["unite"]
  - id: g-unite-l1-q5
    sentence: "Un vivant qui se fragmente change d'être : plantes et animaux « perdent la ___ qui était la leur » et deviennent d'autres choses (traité 9, chap. 1, l. 10-13)."
    answer: réalité
    alt: ["realite"]
  - id: g-unite-l1-q6
    sentence: "« La ___ se produit quand le corps est coordonné dans l'unité ; la beauté quand l'unité en tient unies les parties ; et la vertu pour l'âme, quand [...] elle se trouve unifiée » (traité 9, chap. 1, l. 13-16)."
    answer: santé
    alt: ["sante"]
  - id: g-unite-l1-q7
    sentence: "« La santé se produit quand le corps est coordonné dans l'unité ; la beauté quand l'unité en tient unies les parties ; et la ___ pour l'âme, quand [...] elle se trouve unifiée » (traité 9, chap. 1, l. 13-16)."
    answer: vertu
    alt: []
  - id: g-unite-l1-3
    sentence: "L'unité d'une chose ne vient jamais de ses parties elles-mêmes : il faut une ___ qui les tienne ensemble, comme les briques d'une maison."
    answer: forme
    alt: []
  - id: g-unite-l1-4
    sentence: "Le principe qui commande tout l'argument de Plotin est le suivant : tout ce qui est ___ dépend de ce qui le rend un."
    answer: multiple
    alt: ["composé"]
  - id: g-unite-l1-5
    sentence: "Le traité où Plotin pose le problème de l'unité d'une armée, d'un chœur ou d'une maison, au début de son étude du Bien ou de l'Un, est le traité ___ (VI, 9)."
    answer: "9"
    alt: ["neuf"]
  - id: g-unite-l1-q8
    sentence: "Ne jamais confondre ce qui a été rendu un, en grec translittéré ___, et l'Un en soi, sous peine d'abolir la transcendance du principe."
    answer: henomenon
    alt: []
  - id: g-unite-l2-1
    sentence: "Dans un vivant, ce qui tient ensemble les parties du corps et les fait former un corps est l'___."
    answer: âme
    alt: ["ame"]
  - id: g-unite-l2-2
    sentence: "L'âme est elle-même multiple (perceptions, souvenirs, désirs, raisonnements) ; ce qui l'unifie est la capacité de saisir d'un seul regard ce qu'elle n'atteint qu'en passant d'une idée à l'autre, c'est-à-dire l'___."
    answer: Intellect
    alt: ["intellect"]
  - id: g-unite-l2-3
    sentence: "L'Intellect est lui-même encore multiple, parce qu'il ___ plusieurs choses à la fois (le cercle, le nombre, le juste)."
    answer: pense
    alt: ["contemple"]
  - id: g-unite-l2-4
    sentence: "Le principe qui rend un ce qui pense ne peut pas être composé, sinon il faudrait un unificateur de plus et la ___ ne s'arrêterait jamais."
    answer: régression
    alt: ["regression"]
  - id: g-unite-l2-5
    sentence: "Le principe qui unifie l'Intellect et n'a plus rien de multiple est l'___."
    answer: Un
    alt: ["un"]
  - id: g-unite-l2-q1
    sentence: "Le raisonnement qui remonte d'étage en étage repose sur un seul pivot : chaque étage unifie celui du dessous, mais reste lui-même ___ d'une autre manière ; seul l'Un ne l'est plus."
    answer: multiple
    alt: []
  - id: g-unite-l2-6
    sentence: "Chez Plotin, les trois hypostases (V, 1 [10]) ne sont rien d'autre que les trois étages d'___ : l'âme unifie le corps, l'Intellect unifie l'âme, l'Un unifie l'Intellect."
    answer: unification
    alt: ["unité"]
  - id: g-unite-l2-q2
    sentence: "Le mot grec *henôsis*, que Plotin emploie pour l'union finale de l'âme avec l'Un, et qu'il ne faut pas employer pour les étages d'unité, se traduit par « ___ »."
    answer: union
    alt: ["unification"]
  - id: g-unite-l3-1
    sentence: "Si être, c'est être unifié, alors la dispersion est une perte d'___, que l'on peut reconnaître de l'intérieur."
    answer: être
    alt: ["etre"]
  - id: g-unite-l3-11
    sentence: "Pour devenir une, l'âme doit se défaire de la dispersion des représentations extérieures et se tenir ___ avec elle-même (traité 9, chap. 3-4)."
    answer: seule
    alt: []
  - id: g-unite-l3-2
    sentence: "Plotin compare l'âme qui comprend à une science et à ses théorèmes, tous présents ensemble ; comprendre, c'est se laisser unifier par l'___ : le plaisir de comprendre en est le signe."
    answer: Intellect
    alt: ["intellect"]
  - id: g-unite-l1-r1
    sentence: "« Il faut entendre \"Un\" en des sens plus nombreux que ceux qui font dire que l'unité et le ___ sont \"uns\" » (traité 9, chap. 6)."
    answer: point
    alt: []
  - id: g-unite-l1-r2
    sentence: "L'Un n'est pas la plus petite des unités : il « est la chose la plus grande de toutes, non pas quant à sa grandeur, mais quant à sa ___ » (traité 9, chap. 6)."
    answer: puissance
    alt: []
