id: g-unite
title: Unité (`hen`)
subtitle: Être, c'est être un, et ce qui unifie est toujours au-dessus de ce qu'il unifie
icon: infinity
color: violet
lessons:
- id: g-unite-l1
  title: Être, c'est être un
  notes: |-
    **Le problème de départ, très ordinaire (VI, 9 [9], 1).** Qu'est-ce qui fait qu'une chose est **une seule** chose ? Une armée (`stratos`), un chœur (`choros`), un navire, une maison, le corps d'une plante ou d'un animal ne sont pas des tas de soldats, de voix, de planches ou de briques : si l'unité disparaît, la chose disparaît avec elle. Dispersez les briques, il n'y a plus de maison. **Être quelque chose, c'est donc d'abord être un.** C'est la seule prémisse dont Plotin a besoin, et elle se trouve déjà dans l'expérience.

    **Une analyse de ce qui fait l'être, non un syllogisme.** Plotin ne démontre pas l'équivalence de l'être et de l'un par une déduction : il passe en revue des exemples sensibles et intelligibles et montre que, dans chaque cas, la ruine de la cohésion formelle entraîne la ruine de la chose elle-même. La santé du corps et la vertu de l'âme ne sont de même que le maintien de l'unité de leurs parties.

    **Cette unité ne vient jamais des parties elles-mêmes.** Les briques ne s'assemblent pas toutes seules : il faut une **forme** qui les tienne ensemble. Tout ce qui est multiple dépend donc de ce qui le rend un.

    **Plusieurs sortes d'unité, ordonnées entre elles.** Ce ne sont ni de simples homonymes ni une notion univoque : elles dépendent toutes d'un premier terme, selon un ordre de priorité (VI, 9, 1-3).

    | Unité | Exemple | D'où elle vient |
    | Agrégat | une armée, une maison | un assemblage extérieur |
    | Unité reçue (`henomenon`) | un vivant, une âme | un principe supérieur |
    | Unité organique | l'Intellect, où toutes les Formes sont ensemble sans division | sa propre nature, mais encore multiple |
    | Un en soi (`auto to hen`) | l'Un | rien : il est simple et ne participe à rien |

    ! L'unité dont parle ici Plotin n'est pas l'Un lui-même (voir la fiche « Un ») : c'est ce que possède toute chose dans la mesure où elle est quelque chose. Il ne faut jamais confondre ce qui a été **rendu** un (`henomenon`) et l'Un en soi, sous peine d'abolir la transcendance du principe.

    ! Plotin n'a pas de nom propre pour la démarche qui va du composé au simple : ce que l'on appelle « antériorité du simple » est le nom que lui donnent ses commentateurs.
