# Entrée du glossaire de Plotin (skill glossaire), refondue le 2026-10-21 :
# une leçon. Ses cartes sur la beauté sont passées à g-beaute, celles sur le
# désir à g-desir, avec leurs identifiants. Citations vérifiées sur la GF
# (VI, 9, 1 et 6).

id: g-unite
title: Unité (`hen`)
icon: book
color: coral
lessons:
- id: g-unite-l1
  title: Unité
  notes: |-
    Chez Plotin, l'{violet}**unité**{/violet} est [def] ; et l'unité de chaque chose {pink}ne vient pas de ses parties{/pink}, mais d'un principe qui la rend une.

    __**Être, c'est être un.**__ Le [[traite9|traité 9]] s'ouvre sur un axiome : « C'est en vertu de l'unité que tous les êtres sont des êtres, aussi bien ceux qui sont des êtres au sens premier du terme que ceux qui sont dits être de quelque manière parmi les êtres. Et en effet, __qu'est-ce qui pourrait être, sans être un__ ? » (chap. 1). « il n'y a pas d'armée, si elle n'est pas une, pas de chœur ou de troupeau, s'ils ne sont pas uns », et « s'ils perdaient l'unité, __la maison ne serait plus une maison__ ni le navire un navire ». **La preuve est dans la ruine** : la chose disparaît au moment précis où son unité se défait. Et cela vaut jusqu'au dedans : « la santé se produit quand le corps est coordonné dans l'unité », la beauté quand l'unité en tient les parties, la vertu quand l'âme est unifiée.

    __**Cette unité vient toujours d'ailleurs.**__ Les briques ne s'assemblent pas toutes seules : il faut une forme qui les tienne ensemble. **Tout ce qui est multiple dépend de ce qui le rend un.** D'où une remontée d'étage en étage : l'âme unifie le corps, l'Intellect unifie l'âme, l'Un unifie l'Intellect ; chaque étage unifie celui du dessous, mais reste multiple d'une autre manière, jusqu'à un [[g-un|Un]] qui ne reçoit plus son unité de rien.

    | Étage | Ce qu'il unifie | Ce qui reste multiple en lui |
    | Âme | le corps | perceptions, souvenirs, désirs, raisonnements |
    | Intellect | l'âme | les Formes (le cercle, le nombre, le juste) |
    | Un | l'Intellect | rien : il est absolument simple |

    __**L'Un n'est pas le un du nombre.**__ La difficulté est de ne pas imaginer l'Un comme la plus petite des unités. « Il faut entendre "Un" en des sens plus nombreux que ceux qui font dire que __l'unité et le point sont "uns"__ » (chap. 6) : le point et l'unité du nombre ne sont indivisibles que parce qu'on a retranché toute grandeur, et ils restent dans autre chose. L'Un, lui, « est la chose la plus grande de toutes, non pas quant à sa grandeur, mais __quant à sa puissance__ ». Son unité n'est pas un minimum, mais une plénitude.

    __**Devenir un.**__ Si être, c'est être un, se disperser, c'est être moins. Pour rejoindre son principe, l'âme doit se défaire de la dispersion des représentations extérieures et se tenir seule avec elle-même ([[traite9|traité 9]], chap. 3-4). **Comprendre rassemble** : dans l'esprit du savant, tous les théorèmes sont ensemble, et saisir l'un, c'est saisir la science entière. C'est aussi pourquoi la [[g-beaute|beauté]] est une forme qui unifie, et pourquoi aucun objet particulier, jamais tout à fait un, ne comble le [[g-desir|désir]].

    ! Il ne faut jamais confondre ce qui a été **rendu** un (*henomenon*) et l'Un en soi : l'unité dont parle cette entrée est celle que possède toute chose dans la mesure où elle est quelque chose ; l'Un est ce qui la donne. Et l'on garde le mot *henôsis* pour l'union finale de l'âme avec l'Un, non pour ces étages.

    **Voir aussi** : [[g-un|Un]] · [[g-multiplicite-sensible|Multiplicité sensible]] · [[g-multiplicite-intelligible|Multiplicité intelligible]] · [[g-henosis|Hénose]] · [[g-beaute|Beauté]]
