- id: g-unite-l3
  title: Ce que cela fait pour nous
  notes: |-
    **La dispersion est une perte d'être.** Si être, c'est être unifié, alors se disperser, c'est être **moins**, et on peut le reconnaître de l'intérieur. Plotin décrit lui-même l'âme qui, tournée vers le dehors et le corps, s'éloigne d'elle-même, puis l'âme qui s'éveille « à elle-même » en sortant de son corps et en rentrant à l'intérieur d'elle (IV, 8 [6], 1) : c'est alors qu'elle retrouve sa pleine présence. Pour rejoindre son principe, l'âme doit **devenir une** : se défaire de la dispersion des représentations extérieures et se tenir seule avec elle-même (VI, 9 [9], 3-4).

    **Comprendre rassemble.** Plotin compare l'âme qui comprend à une **science** et à ses **théorèmes** : dans l'esprit du savant, tous les théorèmes existent ensemble, sans être séparés les uns des autres, et saisir l'un d'eux, c'est saisir la science entière (III, 8 [30], 6). Les géomètres qui tracent des figures sur le sable le font parce que la contemplation intérieure peine à se maintenir : le dessin n'est qu'un appui pour saisir d'un seul coup ce que l'esprit contemple (III, 8, 4). Le plaisir de comprendre n'est donc pas un bonus psychologique : c'est le signe d'un retour vers un niveau plus unifié de soi, et l'âme y est saisie d'une « stupeur accompagnée de plaisir » (V, 8 [31], 10).

    **La beauté (I, 6 [1]).** Pourquoi un visage ou un accord nous saisit-il ? Plotin récuse d'abord la thèse stoïcienne selon laquelle la beauté serait la **symétrie** des parties (I, 6, 1) : elle laisserait inexplicables la beauté des choses simples (l'or, l'éclair dans la nuit, la lumière du soleil, un son simple) et celle des réalités sans corps (les lois, les vertus, l'Intellect). La beauté sensible naît de la domination d'une **forme** sur la matière (I, 6, 2-3), comme la maison construite est belle parce qu'elle fait passer dans le sensible l'idée de l'architecte. Notre âme reconnaît alors dans cette forme une trace de sa propre nature intelligible : d'où le sentiment de familiarité, voire de retrouvailles, devant le beau.

    **Le laid.** C'est ce que la forme et la raison n'ont pas réussi à maîtriser (I, 6, 2 et 5) : une privation, un défaut de configuration, non une réalité positive. On y reconnaît la matière du traité 51 (I, 8), principe du mal en tant que privation (`sterêsis`) et informe.

    **Le désir.** Tous les êtres désirent le Bien, même si la plupart l'ignorent (I, 7, 1). Tout ce que l'on poursuit, on le poursuit parce qu'on y voit une unité et une plénitude, bref un **reflet du Bien**. Or aucun objet particulier n'est pleinement un, donc aucun ne comble : on obtient ce qu'on voulait, et le manque se déplace. Le désir n'est pas mal dirigé en son principe : il s'arrête trop tôt sur un reflet. L'amour d'un beau visage (le *Phèdre* et le *Banquet*) en est l'exemple que Plotin reprend : l'amant cherche en réalité la lumière intelligible dont ce visage n'est qu'une ombre.

    ! Le rapprochement entre « se sentir plus rassemblé » et la doctrine de l'unité est une lecture du cours : les passages cités décrivent la dispersion, la science et ses théorèmes, mais Plotin n'y parle pas d'« unification » en ces termes.
