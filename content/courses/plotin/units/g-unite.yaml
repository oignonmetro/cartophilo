lessons:
- id: g-unite-l1
  title: Être, c'est être un
  notes: |-
    **L'unité est la notion d'où part toute la métaphysique de Plotin : avant de remonter à l'Un, il faut voir que chaque chose, pour être ce qu'elle est, doit être une.** Le problème de départ est d'une simplicité désarmante.

    __**Qu'est-ce qui fait qu'une chose est une seule chose ?**__ Le [[traite9|traité 9]] répond d'abord par un axiome, puis par des exemples : « C'est en vertu de l'unité que tous les êtres sont des êtres, aussi bien ceux qui sont des êtres au sens premier du terme que ceux qui sont dits être de quelque manière parmi les êtres. Et en effet, qu'est-ce qui pourrait être, sans être un ? » (chap. 1, l. 1-3). {yellow}Il n'y a pas d'armée si elle n'est pas une, pas de chœur ni de troupeau{/yellow} ; et « si elles perdaient l'unité, la maison ne serait plus une maison ni le navire un navire » (l. 5-7). Dispersez les briques : il n'y a plus de maison, il y a un tas.

    __**La preuve est dans la ruine.**__ Ce que montre chaque exemple, c'est que {red}la chose disparaît au moment précis où son unité se défait{/red}. Un vivant qui se fragmente « perd la réalité qui était la sienne » et devient d'autres choses (l. 10-13). {coral}**Être quelque chose, c'est donc d'abord être un.**{/coral} Et cela vaut jusqu'au dedans : « la santé se produit quand le corps est coordonné dans l'unité », la beauté quand l'unité en tient les parties, et la vertu de l'âme quand elle se trouve unifiée (l. 13-16).

    __**Cette unité ne vient jamais des parties elles-mêmes.**__ Les briques ne s'assemblent pas toutes seules : il faut une {violet}**forme**{/violet} qui les tienne ensemble. {green}Tout ce qui est multiple dépend donc de ce qui le rend un.{/green} C'est ce principe qui conduira Plotin, d'unité reçue en unité reçue, jusqu'à un Un qui ne reçoit plus la sienne de rien.

    __**Plusieurs sortes d'unité, ordonnées entre elles.**__ Elles ne sont pas de simples homonymes, ni une seule et même unité partout : elles dépendent toutes d'un premier terme, selon un ordre de priorité (chap. 1-3).

    | Unité | Exemple | D'où elle vient |
    | Agrégat | une armée, une maison | un assemblage extérieur |
    | Unité reçue (*henomenon*) | un vivant, une âme | un principe supérieur |
    | Unité organique | l'Intellect, où toutes les Formes sont ensemble sans division | sa propre nature, mais encore multiple |
    | Un en soi (*auto to hen*) | l'Un | rien : il est simple et ne participe à rien |

    ! L'unité dont il est question ici n'est pas l'Un lui-même : c'est ce que possède toute chose dans la mesure où elle est quelque chose. Il ne faut jamais confondre ce qui a été **rendu** un (*henomenon*) et l'Un en soi, sous peine d'abolir la transcendance du principe.
