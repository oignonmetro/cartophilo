# Unité de texte (voir content/textes.md) : Plotin, traité 30 (III, 8), Sur
# la contemplation, chapitre 8, traduction GF (éd. L. Brisson et
# J.-F. Pradeau). Découpage seul : rappels et cartes à écrire.

id: "t30c8"
title: "La contemplation vivante (30 [III, 8], 8)"
subtitle: "Traité 30, Sur la contemplation, chapitre 8"
icon: "page"
color: "coral"
depth: "normale"
lessons:
- id: "t30c8-p8"
  title: "De la nature à l'Intellect"
  notes: ""
  passage:
    label: "l. 1-11"
    part: "Dans l'Intellect, sujet et objet sont un"
    text: |-
      Voilà ce qu'il en est. Puisque la contemplation part de la nature pour remonter à l'âme, puis de celle-ci vers l'Intellect, et puisque les contemplations deviennent toujours plus appropriées à ceux qui contemplent, qu'elles s'unifient à eux, et puisque dans l'âme sage les objets connus tendent à s'identifier au sujet de la connaissance dans la mesure où ils s'efforcent d'atteindre l'Intellect, il s'ensuit clairement que dans l'Intellect sujet et objet forment d'emblée une unité, non par appropriation, comme il en va pour l'âme la meilleure, mais du fait de la réalité et parce que « être et penser, c'est la même chose ».
  points: []
- id: "t30c8-p8b"
  title: "Plus telle chose et telle autre"
  notes: ""
  passage:
    label: "l. 1-11"
    part: "Dans l'Intellect, sujet et objet sont un"
    text: |-
      Car il n'y a plus telle chose et telle autre ; dans le cas contraire, il y aurait encore quelque chose d'autre, qui ne serait plus telle chose et telle autre.
  points: []
- id: "t30c8-p8c"
  title: "Un vivant en soi"
  notes: ""
  passage:
    label: "l. 11-17"
    part: "La contemplation vivante"
    text: |-
      Il faut donc qu'il existe une réalité en laquelle ces deux choses n'en forment réellement qu'une, et cela, c'est la contemplation vivante, et non pas un objet de contemplation comme il y en a en autre chose. Car ce qui se trouve en autre chose est vivant du fait de cette autre chose, et il n'est pas un vivant en soi.
  points: []
- id: "t30c8-p8d"
  title: "La vie en soi et les autres vies"
  notes: ""
  passage:
    label: "l. 11-17"
    part: "La contemplation vivante"
    text: |-
      Ainsi, si un objet de contemplation ou d'intellection doit avoir la vie, ce doit être une vie en soi et non pas une vie végétative, ni une vie sensitive, ni la vie qui appartient au reste de l'âme. Ces autres vies sont certes, d'une certaine manière, des intellections, mais l'une est une intellection végétative, l'autre est une intellection sensitive et la dernière une intellection psychique.
  points: []
- id: "t30c8-p8e"
  title: "Parce qu'elles sont des raisons"
  notes: ""
  passage:
    label: "l. 17-24"
    part: "Toute vie est une intellection"
    text: |-
      – Mais alors, comment sont-elles des intellections ?

      – Elles le sont parce qu'elles sont des raisons.
  points: []
- id: "t30c8-p8f"
  title: "Une vie plus ou moins obscure"
  notes: ""
  passage:
    label: "l. 17-24"
    part: "Toute vie est une intellection"
    text: |-
      Et toute vie est une intellection, mais l'une est plus obscure que l'autre, exactement comme l'est la vie. Mais cette vie présente plus de clarté, elle est la première vie et elle est l'Intellect premier et un.
  points: []
- id: "t30c8-p8g"
  title: "Les degrés de la vie et de l'intellection"
  notes: ""
  passage:
    label: "l. 17-24"
    part: "Toute vie est une intellection"
    text: |-
      La première vie est donc la première intellection, la deuxième vie la deuxième intellection, et la dernière vie la dernière intellection. Aussi, toute vie est-elle de ce genre et toute vie est-elle intellection.
  points: []
- id: "t30c8-p8h"
  title: "Ce que les hommes ne recherchent pas"
  notes: ""
  passage:
    label: "l. 17-24"
    part: "Toute vie est une intellection"
    text: |-
      Si les hommes parlent sans doute bien vite de différents genres de vies, ils ne parlent pas de différents genres d'intellection ; ils disent plutôt que certaines sont des intellections et que d'autres ne le sont aucunement, car ils ne recherchent pas en quoi consiste la vie en général.
  points: []
- id: "t30c8-p8i"
  title: "La contemplation et son objet"
  notes: ""
  passage:
    label: "l. 25-30"
    part: "Un vivant et une vie"
    text: |-
      Mais quoi qu'il en soit, ce qu'il nous faut mettre en évidence, c'est que l'argument nous montre de nouveau que toutes choses sont des produits accessoires de la contemplation. Donc, si c'est la vie intellective qui est la vie la plus véritable, et qu'il s'agit là de la même chose que l'intellection la plus véritable, alors l'intellection la plus véritable vit, et la contemplation comme l'objet contemplé qui lui correspondent sont un vivant et une vie, et les deux ensemble ne font qu'un.
  points: []
- id: "t30c8-p8j"
  title: "Ne pas contempler l'Un en tant qu'un"
  notes: ""
  passage:
    label: "l. 30-38"
    part: "Comment cet un est-il multiple ?"
    text: |-
      – Mais alors si les deux choses n'en font qu'une, comment cet un peut-il être multiple ?

      – Parce que ce qu'il contemple n'est pas un. Oui, car lorsqu'il contemple l'Un, il ne le contemple pas en tant qu'un ; sinon, il ne devient pas Intellect.
  points: []
- id: "t30c8-p8k"
  title: "Le cercle qui se déploie"
  notes: ""
  passage:
    label: "l. 30-38"
    part: "Comment cet un est-il multiple ?"
    text: |-
      Mais ayant commencé en tant qu'un, il n'est pas resté comme il était en commençant : sans s'en rendre compte, il est devenu multiple, comme s'il avait été alourdi, et il s'est lui-même déployé en désirant posséder toutes choses (combien il aurait mieux valu pour lui qu'il ne le souhaitât pas, car il est devenu le second !) ; car comme un cercle qui se déploie lui-même, il est devenu figure, surface, circonférence, centre et rayons, avec un haut et un bas.
  points: []
- id: "t30c8-p8l"
  title: "Le point de départ et le point d'arrivée"
  notes: ""
  passage:
    label: "l. 38-49"
    part: "L'intellect de tous et de toutes choses"
    text: |-
      Le meilleur est le point de départ, le pire le point d'arrivée ; oui, car le point d'arrivée n'est pas comme le point de départ auquel on ajoute le point d'arrivée, pas plus que le point de départ auquel on ajoute le point d'arrivée n'est comme le point de départ seul.
  points: []
- id: "t30c8-p8m"
  title: "Chaque partie possède la totalité"
  notes: ""
  passage:
    label: "l. 38-49"
    part: "L'intellect de tous et de toutes choses"
    text: |-
      Et pour le dire autrement, l'Intellect n'est pas l'intellect d'un seul individu, mais il est l'intellect de tous et, étant l'intellect de tous, il est aussi l'intellect comprenant toutes choses. Puisqu'il est l'intellect de tous et l'intellect comprenant toutes choses, il faut donc que l'Intellect et chaque partie de lui possèdent la totalité et toutes choses, car sinon, il y aurait une partie de lui qui ne serait pas intellect et qui ne serait pas faite d'intellects, mais qui serait un tas rassemblé au hasard et attendant de devenir un intellect fait à partir de toutes choses.
  points: []
- id: "t30c8-p8n"
  title: "Illimité et sans diminution"
  notes: ""
  passage:
    label: "l. 38-49"
    part: "L'intellect de tous et de toutes choses"
    text: |-
      Et c'est pour cette raison qu'il est illimité, et que, si quelque chose provient de lui, cela n'entraîne pas de diminution, ni de ce qui vient de lui car cela aussi est toutes choses, ni de l'Intellect dont cela provient, puisqu'il n'était pas un assemblage de parties.
  points: []
