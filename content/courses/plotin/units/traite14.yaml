- id: traite14-l2
  title: "Les cercles autour de l'Un : centre intelligible, centre local"
  notes: |-
    **La solution repose sur la hiérarchie des trois principes.** Imaginons l'Un comme le **centre** d'une série de cercles concentriques : le premier est l'**Intellect**, le second l'**Âme**. Ils désirent s'unir à l'Un, mais demeurent à sa périphérie sans jamais le rejoindre : d'où leur mouvement circulaire. **C'est le désir de se fondre dans l'Un qui fait tout se mouvoir en cercle.**

    **Deux centres** (2, 5-15) : il ne faut pas concevoir de la même façon le centre de l'âme et celui du corps.

    | | Son centre | Son mouvement |
    | l'âme | là-bas : intelligible, dieu | elle circule autour de dieu, l'enveloppe de son amour |
    | le corps | local | il tourne autour de son centre, par analogie |

    « Si donc il existe un centre de l'âme, l'âme circule autour de dieu, l'enveloppe de son amour et se tient autant que possible autour de lui, car toutes choses sont suspendues à lui. » **Puisqu'elle ne peut aller jusqu'à lui, elle tourne autour de lui.** Le dieu étant partout et nulle part, l'âme qui veut s'unir à lui doit tourner.

    **Toutes les âmes tournent, même les nôtres** (2, 15-27). Pourquoi nos corps ne le font-ils pas ? Parce qu'ils sont faits d'éléments qui vont en **ligne droite**, et que nos **tendances** nous portent dans des directions variées ; là-haut, le feu, léger, suit la cadence. Platon donne d'ailleurs aux astres un mouvement **autour de leur propre centre** : chaque astre se réjouit d'entourer le dieu, par nécessité naturelle.

    **Microcosme et macrocosme** : l'action de l'âme du monde se justifie par ce qui se passe en nous. Dans les joies, dans la représentation d'un bien, l'âme est mue, et **le corps se meut localement** (3, 13-15).

    **Les hommes** sont une partie de l'univers en tant qu'ils en viennent, mais **un tout en eux-mêmes** (2, 3-5).

    ! Le centre de l'âme n'est pas le centre de la Terre : il est intelligible, et le centre local du monde n'en est que l'analogue.
