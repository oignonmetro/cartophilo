- id: traite14-l4
  title: "Repérage : le plan du traité 14"
  notes: |-
    **Le traité 14 donne une solution générale (chap. 1), l'étend aux autres corps et aux âmes (chap. 2), puis la reformule (chap. 3).**

    | Moment | Lieu | Ce qui s'y joue |
    | le ciel imite l'Intellect | 1, 1-2 | la réponse d'emblée |
    | mouvement de l'âme et du corps | 1, 2-19 | un mélange des deux |
    | le mouvement du feu | 1, 19-37 | s'arrêter ou se recourber |
    | l'action de l'âme du monde | 1, 37-51 | sans fatigue, partout, toujours |
    | les autres corps et l'homme | 2, 1-5 | parties de l'univers, ou touts |
    | les deux centres | 2, 5-15 | l'âme tourne autour de dieu |
    | toutes les âmes tournent | 2, 15-27 | nos corps ne suivent pas ; les astres |
    | l'âme sensitive dans les sphères | 3, 1-15 | elle fait tourner la sphère entière |
    | l'âme poursuit le Bien | 3, 15-20 | et meut le corps du ciel |
    | l'Intellect et l'univers | 3, 20-22 | immobiles et en mouvement |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! La réponse est donnée dès la première ligne (« il imite l'Intellect ») ; tout le reste du traité l'explique.
