id: traite14
title: "Traité 14 (II, 2) : Sur le mouvement circulaire"
subtitle: "Pourquoi le ciel tourne"
icon: compass
color: sky
lessons:
- id: traite14-l1
  title: "Le ciel imite l'Intellect : Platon contre Aristote"
  notes: |-
    **« Pourquoi le ciel se meut-il en cercle ? Parce qu'il imite l'Intellect »** (1, 1). Le traité 14 complète le traité 10 (V, 1), chap. 2 : l'âme, introduite dans le corps de l'univers, lui donne vie et un **mouvement sans fin**. **C'est l'âme qui fait tourner le monde et le ciel.**

    **Plotin s'inspire de Platon** :

    - les *Lois*, X (897c-898c) : la translation circulaire du ciel est de même nature que les mouvements de l'**intellect** ; l'intellect ne pouvant appartenir qu'à une âme, le ciel est mû par l'âme la plus excellente ;
    - le *Timée* : l'univers est une sphère dont la Terre est le centre ; son âme est faite de deux cercles, **le Même et l'Autre** (36b-e). Les fixes suivent le cercle du Même, chaque planète une des sept révolutions du cercle de l'Autre.

    **Mais Aristote avait objecté** (*De l'âme*, I, 3) au *Timée* d'avoir doté l'âme d'un mouvement circulaire sans en justifier l'origine. Plotin doit résoudre deux difficultés :

    | Difficulté | Réponse de Plotin |
    | pourquoi l'âme du monde a-t-elle un mouvement circulaire ? | elle tourne autour de l'Un, qu'elle désire sans pouvoir le rejoindre |
    | comment agit-elle sur le corps de l'univers ? | comme notre âme, qui ne se meut pas localement, meut notre corps dans le lieu |

    **Le mouvement de l'âme n'est pas local** : il est **« de nature consciente, intellective et vivante »** (1, 10), dirigé vers lui-même, et doit envelopper toutes choses. **Le mouvement est la vie du corps** : immobile, le ciel ne préserverait pas ce qu'il contient.

    ! Le mouvement circulaire de l'âme n'est pas un déplacement : il ne devient local que par accident, dans le corps qu'elle meut.
