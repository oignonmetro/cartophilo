- id: traite14-l3
  title: "Le feu céleste, entraîné par l'âme"
  notes: |-
    **Le corps du ciel est purement igné.** Or le feu se déplace par nature **en ligne droite** : comment peut-il tourner ? Trois hypothèses (1, 19-51) :

    | Hypothèse | Ce qu'elle dit |
    | le feu s'arrête | il monte jusqu'au ciel, s'y immobilise, puis adopte de lui-même un mouvement circulaire |
    | le feu se recourbe | il avance en ligne droite jusqu'à la limite de l'univers, et se recourbe le long de la sphère des fixes |
    | l'âme le fait tourner | l'âme du monde le meut d'un mouvement circulaire |

    Les deux premières sont rejetées au profit de la troisième : **l'âme du monde fait tourner le ciel autour du centre de l'univers.**

    - **Sans fatigue** : l'âme ne traîne pas le feu ni n'agit contre nature, car **« la nature est en effet ce qui est ordonné par l'âme du monde »** (1, 38-39).
    - **Partout** : l'âme du tout n'est pas divisée ; si elle s'immobilisait quelque part, le feu s'y arrêterait ; mais elle est universelle, et le feu **la poursuit partout**.
    - **Sans fin** : le feu l'atteint toujours ; c'est plutôt l'âme qui l'entraîne vers elle-même, dans le même lieu, en cercle.

    **Une seconde formulation** (chap. 3) : une puissance inférieure de l'âme part de la Terre, entrelacée au monde ; une puissance supérieure, sensitive, se tient dans les **sphères**, l'enveloppe et la fait tourner. Elle poursuit le **Bien**, qui est partout.

    **La conclusion** : l'Intellect **« reste immobile et il se meut, car il tourne sur lui-même. L'univers se meut donc lui aussi en cercle et reste en même temps immobile »** (3, 20-22).

    Le traité 40 (II, 1) reprendra la solution : le feu monte jusqu'au ciel, s'y arrête, puis l'âme du monde le fait tourner.

    ! Le feu ne tourne pas contre sa nature : la nature même est ordonnée par l'âme du monde.
