  points:
  - id: g-agathon-l1-q1
    sentence: "Le nom de l'Un en tant que toutes choses sont suspendues à lui et le désirent se dit en grec translittéré ___."
    answer: agathon
    alt: ["agathón", "to agathon"]
  - id: g-agathon-l1-q2
    sentence: "« Il n'y a pour l'Un aucun bien, ni, par conséquent, aucune volonté de quoi que ce soit ; mais il est ___ du bien » (traité 9, chap. 6)."
    answer: au-dessus
    alt: ["au dessus"]
  - id: g-agathon-l1-q3
    sentence: "« Il faut poser le Bien comme ce à quoi toutes choses sont ___, alors que lui n'est suspendu à rien » (traité 54, chap. 1)."
    answer: suspendues
    alt: []
  - id: g-agathon-l1-q4
    sentence: "Le Bien reste immobile, et toutes choses se retournent vers lui, « comme dans un cercle où tous les ___ sont tournés vers le centre » (traité 54, chap. 1)."
    answer: rayons
    alt: []
  - id: g-agathon-l1-q5
    sentence: "Le Bien n'agit pas en dirigeant son activité vers les choses : « ce sont elles qui dirigent vers lui leur ___ » (traité 54, chap. 1)."
    answer: activité
    alt: ["activite"]
  - id: g-agathon-l1-q6
    sentence: "Chaque chose participe au Bien, mais à « une image du Bien, certes, car ce à quoi elle participe, ce sont des images de l'être et de l'___ » (traité 54, chap. 2)."
    answer: Un
    alt: ["un"]
  - id: g-agathon-l1-q7
    sentence: "« Le Bien n'a pas besoin du ___, alors que le Beau a besoin du Bien » (traité 32, chap. 12)."
    answer: Beau
    alt: ["beau"]
  - id: g-agathon-l1-q8
    sentence: "Chaque Forme « ne devient objet de désir que quand le Bien lui donne sa ___ » (traité 38, chap. 22)."
    answer: couleur
    alt: []
  - id: g-agathon-l1-q9
    sentence: "Sans la lumière du Bien, la beauté de l'Intellect laisse l'âme « étendue, ___ » (traité 38, chap. 22)."
    answer: indifférente
    alt: ["indifferente"]
  - id: g-agathon-l1-q10
    sentence: "« Sa volonté et lui-même ne font qu'___ » : le Bien ne choisit pas entre des possibles, il coïncide avec soi (traité 39, chap. 13)."
    answer: un
    alt: []
  - id: g-agathon-l1-q11
    sentence: "Plotin prévient que les noms de volonté et de liberté du Bien ne sont avancés que « dans le but de ___ » (traité 39, chap. 13)."
    answer: persuader
    alt: []
