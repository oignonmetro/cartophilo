id: id6
title: Les principes fondamentaux du système
subtitle: Quatre principes, puis trois précisions
icon: compass
color: violet
group: La métaphysique de l'intelligible
lessons:
- id: id6-l1
  title: Les quatre principes fondamentaux
  notes: |-
    Quatre principes gouvernent l'ensemble du système plotinien.

    - {violet}**Priorité du simple sur le multiple**{/violet} : ce qui est ontologiquement premier est toujours plus simple que ce qui en dépend causalement. C'est en application de ce principe que se justifie la hiérarchie des trois hypostases (l'Un, l'Intellect, l'Âme), chacune représentant un degré déclinant d'unité, jusqu'à la **matière**, ultime produit de l'activité psychique, caractérisée par la multiplicité extrême de l'« illimité » informe.
    - {violet}**Puissance procréatrice du parfait**{/violet} : tout ce qui est parfait manifeste sa perfection par une activité qui le rend pleinement ce qu'il est : ainsi de l'œil, dont l'activité propre, **la vision**, exprime directement l'essence.
    - {violet}**Théorie des deux activités**{/violet} : toute activité interne parfaite s'accompagne nécessairement d'une seconde activité, dépendante de la première mais dirigée vers l'extérieur : ainsi du feu, dont la chaleur propre (interne) et la chaleur qu'il émet (externe) illustrent la distinction. Cette théorie est la pierre angulaire du processus d'**émanation**.
    - {violet}**Principe de plénitude**{/violet} : toute possibilité réelle ne saurait demeurer perpétuellement inaccomplie, sous peine de n'être pas une possibilité réelle dès l'origine.
  points:
  - id: id6-l1-1
    sentence: Le premier principe fondamental du système plotinien, selon lequel ce qui est ontologiquement
      premier est toujours plus simple que ce qui en dépend causalement, est la priorité logique du ___
      sur le multiple.
    answer: simple
  - id: id6-l1-2
    sentence: 'C''est en application de ce premier principe fondamental (priorité du simple sur le multiple)
      que se justifie, chez Plotin, la hiérarchie des trois hypostases : l''Un, l''Intellect, puis ___,
      chacune représentant un degré déclinant d''unité par rapport à la précédente.'
    answer: l'Âme
  - id: id6-l1-3
    sentence: Dans cette hiérarchie des trois hypostases, l'ultime produit de l'activité psychique, caractérisé
      par la multiplicité extrême de l'« illimité » informe, est ___.
    answer: la matière
  - id: id6-l1-4
    sentence: 'Second principe fondamental du système plotinien, selon lequel tout ce qui est parfait
      manifeste sa perfection au moyen d''une activité par laquelle il devient pleinement ce qu''il est
      : le principe de la ___ du parfait.'
    answer: puissance procréatrice
  - id: id6-l1-5
    sentence: 'Exemple donné par Plotin pour illustrer ce second principe fondamental (la puissance procréatrice
      du parfait) : l''activité à laquelle l''œil doit d''être ce qu''il est, et qui exprime directement
      son essence, est ___.'
    answer: la vision
  - id: id6-l1-6
    sentence: 'Troisième principe fondamental du système plotinien, selon lequel toute activité interne
      parfaite s''accompagne nécessairement d''une seconde activité, dépendante de la première mais dirigée
      vers l''extérieur et affectant d''autres choses : la théorie des ___.'
    answer: deux activités
  - id: id6-l1-7
    sentence: 'Cette théorie des deux activités constitue la pierre angulaire du processus par lequel
      les principes de la réalité, autres que le premier, viennent à être constitués : le processus d''___.'
    answer: émanation
  - id: id6-l1-8
    sentence: 'Exemple par lequel Plotin illustre habituellement la théorie des deux activités : la chaleur
      inhérente en propre à ___ (activité interne, puisque rien ne peut être lui sans être chaud) et la
      chaleur qu''il émet, réchauffant ce qui l''entoure (activité externe, dépendante de la première
      mais distincte d''elle).'
    answer: le feu
  - id: id6-l1-9
    sentence: 'Quatrième principe fondamental du système plotinien, selon lequel toute possibilité réelle
      ne saurait demeurer perpétuellement inaccomplie, faute de quoi elle ne constituerait pas une possibilité
      réelle dès l''origine : le principe de ___.'
    answer: plénitude
- id: id6-l2
  title: Les trois principes supplémentaires
  notes: |-
    Trois principes supplémentaires précisent la théorie des deux activités.

    - **Puissance procréatrice non diminuée** : la production d'une activité secondaire ne diminue en rien l'activité primaire ni la substance dont elle procède, un principe aussi désigné comme celui de la **permanence** (`menein` ou `monē`) de la cause procréatrice.
    - **Prédominance de la cause métaphysique** : tout ce qui est produit est nécessairement moins parfait que ce qui le produit, en raison même de sa dépendance à son égard. D'où cette conséquence : aucun **saut** n'intervient jamais entre les niveaux ontologiques supérieurs et inférieurs, qui se succèdent sans discontinuité.
    - **Les deux phases de la formation de chaque hypostase inférieure** : d'abord l'« avance » (`proodos`), où l'activité secondaire produite demeure informe, simple altérité par rapport à sa source ; puis le « retour » (`epistrophē`), où cette activité s'articule et se perfectionne en revenant vers sa source.
  points:
  - id: id6-l2-1
    sentence: 'Premier principe supplémentaire du système plotinien, selon lequel la production d''une
      activité secondaire ne diminue en rien l''activité primaire ni la substance dont elle procède :
      le principe de la puissance procréatrice ___.'
    answer: non diminuée
    alt:
    - inépuisable
  - id: id6-l2-2
    sentence: Ce premier principe supplémentaire, selon lequel la cause procréatrice demeure immuable
      et inaffectée par l'activité secondaire qui procède d'elle, est parfois désigné comme le principe
      de la ___.
    answer: permanence
    alt:
    - demeurance
  - id: id6-l2-3
    sentence: 'Terme original, translittéré, par lequel Plotin désigne cette « permanence » de la cause
      procréatrice, immuable face à ce qui procède d''elle : ___.'
    answer: menein
    alt:
    - monē
  - id: id6-l2-4
    sentence: 'Second principe supplémentaire du système plotinien, selon lequel tout ce qui est produit
      conformément à la théorie des deux activités est nécessairement moins parfait que ce qui le produit,
      en raison même de sa dépendance à son égard : le principe de la ___ de la cause métaphysique.'
    answer: prédominance
  - id: id6-l2-5
    sentence: 'Conséquence du principe de la prédominance de la cause métaphysique : les niveaux ontologiques
      se succèdent du plus parfait au moins parfait sans qu''aucun ___ n''intervienne jamais entre les
      niveaux supérieurs et inférieurs.'
    answer: saut
  - id: id6-l2-6
    sentence: 'Troisième principe supplémentaire du système plotinien, selon lequel la formation de chaque
      hypostase inférieure se déroule en deux phases distinctes, dont la première, celle de l''« avance
      », voit l''activité secondaire produite demeurer informe et indéterminée, simple altérité par rapport
      à sa source : cette phase se nomme, en grec translittéré, ___.'
    answer: proodos
  - id: id6-l2-7
    sentence: 'La seconde phase de la formation de chaque hypostase inférieure selon ce troisième principe
      supplémentaire, celle du « retour », par laquelle l''activité secondaire, en revenant vers sa source,
      s''articule, se façonne et se perfectionne en acquérant un contenu déterminé : cette phase se nomme,
      en grec translittéré, ___.'
    answer: epistrophē
