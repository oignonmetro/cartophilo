id: id5
title: Anthropologie et éthique plotiniennes
subtitle: Le mal, le gnosticisme, la hiérarchie des vertus
icon: scale
color: coral
group: La métaphysique du sensible
lessons:
- id: id5-l1
  title: Réincarnation, démon gardien et gnosticisme
  notes: |-
    Selon les croyances traditionnelles reprises par Plotin, un « démon gardien » (**`eilēchōs daimōn`**) veille sur l'âme et supervise ses décisions critiques, en réalité un simple représentant des puissances psychiques du niveau situé **immédiatement au-dessus** de celui qui est activé dans l'âme concernée.

    ! Plotin s'oppose fermement au **gnosticisme**, courant contemporain selon lequel le monde sensible serait l'œuvre d'un démiurge insensé ou malveillant, dont les âmes humaines seraient exilées.

    - Face à cette vision dualiste et anticosmique, Plotin soutient que les imperfections du monde doivent être imputées à la **matérialité** inéluctable du sensible, seule cause véritable du mal.
    - La matière, simple privation de toute caractéristique eidétique, n'a aucune puissance causale autonome : elle n'est qu'une **précondition objective** nécessaire à l'apparition du mal, principalement sous la forme du vice, quand l'âme se laisse égarer par les **reflets** du Bien qui apparaissent sur elle.
  points:
  - id: id5-l1-1
    sentence: Selon les croyances traditionnelles de son temps, reprises par Plotin, l'entité qui veille
      sur l'âme et supervise ses décisions critiques, le « démon gardien », n'est en réalité qu'un représentant
      des puissances psychiques supérieures appartenant au niveau situé ___ par rapport à celui qui est
      activé dans l'âme concernée.
    answer: immédiatement au-dessus
  - id: id5-l1-2
    sentence: 'Terme original, translittéré, désignant ce « démon gardien » qui veille sur l''âme selon
      les croyances traditionnelles reprises par Plotin : ___.'
    answer: eilēchōs daimōn
  - id: id5-l1-3
    sentence: Le courant philosophique contemporain de Plotin selon lequel le monde sensible serait l'œuvre
      d'un démiurge insensé, voire malveillant, dont les âmes humaines, créées par un Dieu suprême mais
      « inconnu », seraient exilées, se nomme ___.
    answer: le gnosticisme
  - id: id5-l1-4
    sentence: Face à la vision dualiste et anticosmique des gnostiques, Plotin soutient au contraire que
      les imperfections du monde sensible doivent être imputées à sa ___ inéluctable, seule cause véritable
      du mal.
    answer: matérialité
  - id: id5-l1-5
    sentence: 'En tant que privation complète de toute caractéristique eidétique, la matière ne possède
      aucune puissance causale autonome : elle constitue seulement la ___ nécessaire à l''apparition du
      mal, principalement sous la forme du vice dans l''âme.'
    answer: précondition objective
  - id: id5-l1-6
    sentence: L'âme se laisse égarer vers le vice lorsqu'elle est détournée de sa poursuite innée du bien
      par les ___ du Bien qui apparaissent sur la matière.
    answer: reflets
- id: id5-l2
  title: La hiérarchie des vertus
  notes: |-
    Chez l'être humain, le « véritable homme » se distingue du « vivant » composé (l'organisme animé) : il en est le **constituant** psychique, celui par lequel on entre en contact avec le domaine intelligible.

    Plotin distingue quatre échelons de vertus, du plus bas au plus élevé :
    - **politiques** : elles règlent les impulsions inférieures de l'âme liées au corps.
    - **cathartiques** : elles libèrent l'âme de sa sollicitude pour le corps.
    - **théorétiques** : liées à la contemplation des vérités intelligibles.
    - **paradigmatiques** : les modèles intelligibles eux-mêmes (les Formes de la Justice, de la Tempérance...).

    En se conformant à ces modèles par la contemplation intellective, l'être humain en vient à ressembler à Dieu et acquiert l'**`eudaimonia`**, le « bien-être », état psychique suprême et inébranlable.
  points:
  - id: id5-l2-1
    sentence: Chez l'être humain, le « véritable homme » se distingue du « vivant » composé (l'organisme
      animé) en ce qu'il constitue le ___ psychique par lequel nous entrons en contact avec le domaine
      des réalités intelligibles.
    answer: constituant
  - id: id5-l2-2
    sentence: Dans la hiérarchie des vertus établie par Plotin, l'échelon le plus bas, celui qui règle
      les impulsions inférieures de l'âme liées au corps, est occupé par les vertus ___.
    answer: politiques
  - id: id5-l2-3
    sentence: Immédiatement au-dessus des vertus politiques, les vertus par lesquelles l'âme se libère
      entièrement de sa sollicitude pour le corps sont appelées les vertus ___.
    answer: cathartiques
  - id: id5-l2-4
    sentence: Au troisième échelon de la hiérarchie des vertus plotinienne, liées à la contemplation des
      vérités intelligibles, se trouvent les vertus ___.
    answer: théorétiques
  - id: id5-l2-5
    sentence: Au sommet de la hiérarchie des vertus plotinienne se trouvent les modèles intelligibles
      eux-mêmes, tels les Formes de la Justice ou de la Tempérance, appelés les vertus ___.
    answer: paradigmatiques
  - id: id5-l2-6
    sentence: En se conformant aux modèles intelligibles des vertus par la contemplation intellective,
      l'être humain en vient à ressembler à Dieu et acquiert ainsi le « bien-être », état psychique suprême
      et inébranlable désigné par le terme grec ___.
    answer: eudaimonia
