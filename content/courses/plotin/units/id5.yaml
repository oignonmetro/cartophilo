id: id5
title: Anthropologie et éthique plotiniennes
subtitle: Le mal, le gnosticisme, la hiérarchie des vertus
icon: scale
color: coral
group: La métaphysique du sensible
lessons:
- id: id5-l1
  title: Réincarnation, démon gardien et gnosticisme
  notes: |-
    Selon les croyances traditionnelles reprises par Plotin, un {violet}« démon gardien »{/violet} ({blue}***eilêchôs daimôn***{/blue}) veille sur l'âme et supervise ses décisions critiques, en réalité un simple représentant des puissances psychiques du niveau situé {amber}**immédiatement au-dessus**{/amber} de celui qui est activé dans l'âme concernée.

    ! Plotin s'oppose fermement au {red}**gnosticisme**{/red}, courant contemporain selon lequel {red}le monde sensible serait l'œuvre d'un démiurge insensé ou malveillant, dont les âmes humaines seraient exilées{/red}.

    - Face à cette vision dualiste et anticosmique, Plotin soutient que {green}les imperfections du monde doivent être imputées à la{/green} {violet}**matérialité**{/violet} inéluctable du sensible, seule cause véritable du mal.
    - {coral}La matière, simple privation de toute caractéristique eidétique, n'a aucune puissance causale autonome{/coral} : elle n'est qu'une {violet}**précondition objective**{/violet} nécessaire à l'apparition du mal, principalement sous la forme du vice, quand l'âme se laisse égarer par les {violet}**reflets**{/violet} du Bien qui apparaissent sur elle.
  points:
  - id: id5-l1-1
    sentence: "Selon les croyances traditionnelles de son temps, reprises par Plotin, __l'entité qui veille sur l'âme et supervise ses décisions critiques__, le **« démon gardien »**, n'est en réalité qu'un représentant **des puissances psychiques supérieures** appartenant au niveau situé ___ par rapport à celui qui est activé dans l'âme concernée."
    answer: immédiatement au-dessus
  - id: id5-l1-2
    sentence: "Terme original, translittéré, __désignant ce **« démon gardien »** qui veille sur l'âme__ selon les croyances traditionnelles reprises par Plotin : ___."
    answer: eilêchôs daimôn
  - id: id5-l1-3
    sentence: "Le courant philosophique **contemporain de Plotin** selon lequel __le monde sensible serait l'œuvre d'un démiurge insensé, voire malveillant__, dont les âmes humaines, créées par un Dieu suprême mais « inconnu », seraient exilées, se nomme ___."
    answer: le gnosticisme
  - id: id5-l1-4
    sentence: "Face à la vision dualiste et anticosmique des gnostiques, Plotin soutient au contraire que __les imperfections du monde sensible doivent être imputées à sa__ ___ inéluctable, **seule cause véritable du mal**."
    answer: matérialité
  - id: id5-l1-5
    sentence: "En tant que **privation complète** de toute caractéristique eidétique, la matière ne possède **aucune puissance causale autonome** : __elle constitue seulement la__ ___ nécessaire à l'apparition du mal, principalement sous la forme du vice dans l'âme."
    answer: précondition objective
  - id: id5-l1-6
    sentence: "__L'âme se laisse égarer **vers le vice** lorsqu'elle est détournée de sa poursuite innée du bien par les__ ___ du Bien qui apparaissent sur la matière."
    answer: reflets
- id: id5-l2
  title: La hiérarchie des vertus
  notes: |-
    Chez l'être humain, le {violet}« véritable homme »{/violet} se distingue du « vivant » composé (l'organisme animé) : il en est le {violet}**constituant**{/violet} psychique, celui par lequel on entre en contact avec le domaine intelligible.

    Plotin distingue {amber}quatre échelons de vertus{/amber}, du plus bas au plus élevé :
    - {violet}**politiques**{/violet} : {amber}elles règlent les impulsions inférieures de l'âme liées au corps{/amber}.
    - {violet}**cathartiques**{/violet} : {amber}elles libèrent l'âme de sa sollicitude pour le corps{/amber}.
    - {violet}**théorétiques**{/violet} : {amber}liées à la contemplation des vérités intelligibles{/amber}.
    - {violet}**paradigmatiques**{/violet} : {amber}les modèles intelligibles eux-mêmes{/amber} (les Formes de la Justice, de la Tempérance...).

    En se conformant à ces modèles par la contemplation intellective, {green}l'être humain en vient à ressembler à Dieu{/green} et acquiert l'{blue}***eudaimonia***{/blue}, le « bien-être », état psychique suprême et inébranlable.
  points:
  - id: id5-l2-1
    sentence: "Chez l'être humain, __le **« véritable homme »** se distingue du « vivant » composé__ (l'organisme animé) en ce qu'il constitue le ___ psychique par lequel nous entrons en contact avec le domaine des réalités intelligibles."
    answer: constituant
  - id: id5-l2-2
    sentence: "Dans la **hiérarchie des vertus** établie par Plotin, __l'échelon le plus bas, celui qui règle les impulsions inférieures de l'âme liées au corps__, est occupé par les vertus ___."
    answer: politiques
  - id: id5-l2-3
    sentence: "**Immédiatement au-dessus** des vertus politiques, __les vertus par lesquelles l'âme se libère entièrement de sa sollicitude pour le corps__ sont appelées les vertus ___."
    answer: cathartiques
  - id: id5-l2-4
    sentence: "Au **troisième échelon** de la hiérarchie des vertus plotinienne, __liées à la contemplation des vérités intelligibles__, se trouvent les vertus ___."
    answer: théorétiques
  - id: id5-l2-5
    sentence: "__Au sommet de la hiérarchie des vertus plotinienne__ se trouvent les **modèles intelligibles eux-mêmes**, tels les Formes de la Justice ou de la Tempérance, appelés les vertus ___."
    answer: paradigmatiques
  - id: id5-l2-6
    sentence: "En se conformant aux modèles intelligibles des vertus par la **contemplation intellective**, __l'être humain en vient à ressembler à Dieu__ et acquiert ainsi le **« bien-être »**, état psychique suprême et inébranlable désigné par le terme grec ___."
    answer: eudaimonia
