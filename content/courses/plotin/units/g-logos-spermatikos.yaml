  - id: g-logos-spermatikos-l1-q1
    sentence: "La raison qui, dans la semence, contient ensemble tout le vivant à venir se dit en grec translittéré logos ___."
    answer: spermatikos
    alt: []
  - id: g-logos-spermatikos-l1-q2
    sentence: "Plotin reprend la raison séminale aux ___, mais la rend incorporelle : pour eux, elle était un souffle corporel."
    answer: stoïciens
