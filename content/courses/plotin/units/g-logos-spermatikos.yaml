lessons:
- id: g-logos-spermatikos-l1
  title: Raison séminale
  notes: |-
    Chez Plotin, la {violet}**raison séminale**{/violet} (*logos spermatikos*) est [def] ; elle n'est {pink}pas le souffle corporel des stoïciens{/pink}.

    __**Une notion stoïcienne, rendue incorporelle.**__ Les stoïciens appelaient ainsi le principe actif, corporel, contenu dans la semence. Plotin garde l'idée d'une raison qui contient d'avance tout l'organisme, mais la rend incorporelle : chacune des puissances des semences « est une raison unique, __qui forme un tout avec les parties qu'elle contient__. Elle a ce qui est corporel pour matière (tout ce qui est humide par exemple), mais elle est en elle-même __une Forme__ » ([[traite5|traité 5]], chap. 6). **L'humidité de la graine n'est que le support ; ce qui forme, c'est la raison.**

    __**Tout est ensemble avant d'être séparé.**__ La difficulté est de comprendre comment une raison sans étendue peut contenir l'œil et les mains sans les confondre. Dans la semence, « les raisons y sont en quelque sorte concentrées », distinctes sans occuper encore des lieux séparés ; elles ne s'écartent qu'en se déployant dans un corps (voir [[g-multiplicite-intelligible|multiplicité intelligible]] et [[g-multiplicite-sensible|multiplicité sensible]]). La raison séminale est ainsi l'image, dans la [[g-phusis|nature]], de l'Intellect où toutes choses sont ensemble.

    __**Une raison pour chaque individu.**__ Ce qui distingue Socrate de Platon n'est pas seulement la matière : « Y a-t-il une idée de chaque individu ? – __Oui, c'est le cas__ » ([[traite18|traité 18]], chap. 1). Et « il y a __autant de raisons que d'individus différents__ » (chap. 3). **L'individualité a donc sa raison dans l'intelligible**, et ne se réduit pas à un accident de la matière.

    __**Elle ne règle pas à elle seule le cours du monde.**__ Contre les stoïciens, pour qui ces raisons expliquaient tout le destin, Plotin en borne la portée : « Les événements qui se produisent dans notre monde __ne dépendent donc pas des raisons qui se trouvent dans les semences__, mais de raisons qui comprennent aussi des puissances antérieures à celles dont dépendent les raisons des semences » ([[traite28|traité 28]], chap. 39). La raison séminale forme un vivant ; la rencontre des vivants entre eux relève de la [[g-logos|raison de l'univers]].

    ! La raison séminale n'est pas un programme matériel inscrit dans la graine : c'est une Forme incorporelle, venue de l'Âme, qui se sert de la matière humide sans s'y réduire.

    **Voir aussi** : [[g-logos|Raison]] · [[g-phusis|Nature]] · [[g-multiplicite-sensible|Multiplicité sensible]] · [[g-eidos|Forme]] · [[traite18|Traité 18]]
