  - id: g-logos-spermatikos-l1-q3
    sentence: "Chacune des puissances des semences « est une raison unique, qui forme un ___ avec les parties qu'elle contient » (traité 5, chap. 6)."
    answer: tout
    alt: []
  - id: g-logos-spermatikos-l1-q4
    sentence: "La raison séminale « a ce qui est corporel pour matière (tout ce qui est humide par exemple), mais elle est en elle-même une ___ » (traité 5, chap. 6)."
    answer: Forme
    alt: ["forme"]
  - id: g-logos-spermatikos-l1-q5
    sentence: "« Y a-t-il une idée de chaque ___ ? – Oui, c'est le cas » (traité 18, chap. 1)."
    answer: individu
    alt: []
  - id: g-logos-spermatikos-l1-q6
    sentence: "Ce qui distingue Socrate de Platon a sa raison dans l'intelligible : « il y a autant de raisons que d'___ différents » (traité 18, chap. 3)."
    answer: individus
    alt: []
  - id: g-logos-spermatikos-l1-q7
    sentence: "Le traité de Plotin intitulé *S'il y a des idées même des êtres individuels* est le traité ___."
    answer: 18 (V, 7)
    alt: ["18", "V, 7"]
  - id: g-logos-spermatikos-l1-q8
    sentence: "« Les événements qui se produisent dans notre monde ne dépendent donc pas des raisons qui se trouvent dans les ___ » (traité 28, chap. 39)."
    answer: semences
    alt: []
