id: g-sundioikesis
title: Co-gouvernement (sundioikêsis)
subtitle: Le co-gouvernement du monde avec l'Âme universelle
icon: people
color: sky
lessons:
- id: g-sundioikesis-l1
  title: Le co-gouvernement du monde
  notes: |-
    **L'idée en clair.** Le **co-gouvernement** (`sundioikēsis` ; co-administration de l'univers), c'est le fait que notre âme, par sa partie la plus haute, **prend part, avec l'Âme du monde, à l'ordre de l'univers**. Chez Plotin, l'âme individuelle qui, élevée et réassociée à l'**Âme universelle**, participe avec elle au gouvernement harmonieux du monde sensible, le fait __sans s'y engager physiquement__ ni subir les affections de la matière.

    **Gouverner, ici, ce n'est pas diriger.** L'Âme du monde ne commande pas le monde à la manière d'un chef qui donne des ordres et corrige ses erreurs : elle reçoit de l'Intellect les « raisons » (les principes qui ordonnent les choses) et les laisse agir, **sans calculer ni se fatiguer** (traité 52, chap. 16-17). Gouverner, pour elle, c'est contempler l'intelligible, et c'est de cette contemplation que découle l'ordre du monde. Co-gouverner, c'est donc **participer à cette même contemplation**, non intervenir dans le cours des événements.

    **Plotin tire la notion du *Phèdre* de Platon** (246c), où l'âme parfaite gouverne le monde tout entier. Il commente ce passage en __IV, 8, 2__ (traité 6, *De la descente de l'âme dans les corps*) : les âmes individuelles, tout en demeurant dans l'intelligible, gouvernent le ciel aux côtés de l'Âme totale, et notre âme associée à l'Âme universelle « voyage dans les hauteurs en gouvernant le monde tout entier ». En __IV, 8, 4__, il en donne une image politique : les âmes purifiées sont comme les ministres ou conseillers qui aident le roi de toutes choses à gouverner, « sans descendre elles-mêmes des demeures royales ».

    Le même vocabulaire revient ailleurs :

    - Les démons : en __III, 5, 6__ (traité 50, *De l'amour*), pour dire comment ils secondent l'Âme du monde.
    - `sunepimeloumenē` : un équivalent (« co-soignante »), en __IV, 7, 13__ (traité 2, *De l'immortalité de l'âme*).

    **Pour nous, qu'est-ce que cela change ?**

    - **Nous ne sommes pas de simples pièces du monde.** Soumis au corps, aux circonstances, aux astres, nous pouvons nous sentir gouvernés de partout. Plotin répond que la partie la plus haute de notre âme n'est pas du côté de ce qui est gouverné : elle fait partie de ce qui **ordonne**. C'est pourquoi les astres n'agissent que sur le corps et l'âme inférieure (traité 52), et que l'âme est une cause, donc responsable de ses actes (traité 3).
    - **Bien vivre, c'est tenir son rang de « ministre ».** Les âmes purifiées sont comme les conseillers du roi : elles servent l'ordre du tout sans en descendre (IV, 8, 4). Concrètement, pour Plotin, cela passe par la vertu et la pensée, qui ordonnent notre vie à l'image de l'ordre du monde, non par une action d'éclat sur le monde.

    **Le faisons-nous déjà, sans nous en rendre compte ?** En un sens, oui. D'après les traités 6 et 53, la partie la plus haute de notre âme ne descend jamais dans le corps : elle reste auprès de l'Âme totale (« non descendue »), et c'est à ce niveau que le co-gouvernement a lieu, que nous le sachions ou non. Mais nous n'en avons pas conscience, parce que notre attention est prise par le corps, les désirs, les soucis : « nous ne faisons pas toujours usage de tout ce que nous possédons » (traité 53, chap. 11). En un autre sens, non : nous n'y participons **en acte** que lorsque nous nous identifions à cette partie, par la purification et la contemplation. C'est une possession qu'il s'agit de convertir en usage, non un état déjà vécu.

    ! Le co-gouvernement (`sundioikēsis`) n'est pas une descente de l'âme dans les affaires du monde : l'Âme du monde administre le corps universel **avec aisance**, sans fatigue ni passion, et l'âme individuelle qui gouverne avec elle partage cette condition. C'est au contraire l'âme repliée sur un corps restreint, changeant et mortel, qui s'y disperse et en subit les affections.

    ! Plotin ne dit pas en ces termes que nous co-gouvernons « sans le savoir » dans la vie de tous les jours : c'est la lecture que permettent ensemble ses traités sur la descente de l'âme (6), l'unité des âmes (8) et le « nous » (53).
