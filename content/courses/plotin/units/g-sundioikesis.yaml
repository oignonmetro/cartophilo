    answer: holê psuchê
    alt: []
  - id: g-sundioikesis-l2-2
    sentence: "La thèse selon laquelle toutes les âmes ne forment qu'une seule Âme, qui fonde la possibilité pour notre âme de co-gouverner le monde avec l'Âme universelle, Plotin la démontre en ___."
    answer: IV, 9
    alt: []
  - id: g-sundioikesis-l2-3
    sentence: "Parce qu'elle est incorporelle, sans grandeur ni masse, l'Âme ne se ___ pas en morceaux lorsqu'elle s'associe aux corps ; c'est pourquoi, selon Plotin, toutes les âmes n'en forment qu'une."
    answer: divise
    alt: []
  - id: g-sundioikesis-l2-4
    sentence: "La parenté par laquelle notre âme est de même espèce, de même rang et de même dignité que l'Âme du monde, et qui rend possible son co-gouvernement de l'univers, se nomme en grec, translittéré, ___."
    answer: suggeneia
    alt: ["sungeneia", "syngeneia"]
