- id: g-sundioikesis-l2
  title: Devenir l'Âme
  notes: |-
    **La *sundioikêsis* est la notion qui correspond le mieux, chez Plotin, au fait pour notre âme de « devenir l'Âme » : non pas se changer en une réalité étrangère, mais cesser de se vivre comme une partie isolée pour réintégrer l'activité de l'Âme totale** (*holê psuchê*), qu'elle n'a jamais tout à fait quittée.

    |  | Notion | L'âme… |
    | **Âme** | *sundioikêsis* | co-gouverne le monde |
    | **Intellect** | *noôthênai* | pense toutes les Formes à la fois |
    | **Un** | *henôsis* | s'unit au Premier, sans dualité |

    __**C'est possible parce que toutes les âmes n'en font qu'une.**__ Le [[traite8|traité 8]] le démontre : incorporelle, sans grandeur ni masse, l'Âme ne se divise pas en morceaux en s'associant aux corps, et la multiplicité des âmes ne vient que de la diversité des corps. Notre âme est donc de même espèce que l'Âme du monde, ce que Plotin nomme sa {violet}parenté{/violet} (*suggeneia*). Elle n'en est pas une tranche découpée, mais elle est à l'Âme entière comme {yellow}un théorème à la science entière{/yellow}, qu'il contient virtuellement (chap. 5).

    __**Encore faut-il que l'âme le reconnaisse.**__ Le [[traite10|traité 10]] l'y invite par un exercice. Qu'elle se représente le ciel avant l'âme : « il n'était, auparavant, qu'un cadavre, de la terre et de l'eau » (chap. 2, l. 25-26) ; c'est l'âme qui lui a donné la vie et le mouvement. Or « notre âme aussi est de même espèce que la leur » (l. 43-44). D'où la conclusion : « Si tu admires l'âme qui se trouve en quelque chose d'autre, admire-toi toi-même » (l. 50-51 ; *seauton agasai*). **Ce qu'on admire dans le monde, c'est la vie que l'âme y met : il serait absurde de l'admirer là et de la mépriser en soi.** Cette reconnaissance suppose une purification (*katharsis*), qui retranche passions, désirs corporels et représentations sensibles.

    __**Concrètement, que veut dire « devenir l'Âme » ?**__ Passer de ce que nous **avons** à ce dont nous **faisons usage**. Lorsque nous nous laissons mener par les désirs du corps, nous nous vivons comme une partie isolée ; lorsque nous raisonnons, ordonnons notre vie par la vertu et contemplons, nous nous vivons comme l'Âme : une activité qui organise et comprend, à la mesure du tout. {coral}On ne devient pas autre chose : on cesse de se tenir pour moins que ce qu'on est.{/coral}

    ! De l'Âme à l'Un, le verbe « devenir » est de moins en moins propre. C'est au niveau de l'Âme, hypostase charnière entre l'intelligible et le temps, qu'il garde **le plus de sens** : un passage de la puissance à l'acte dans la conduite de la vie.

    ! Ni l'*henôsis* ni l'*ekstasis* ne nomment le devenir-Âme : l'Âme garde une activité organisatrice et discursive (*logos*, *dianoia*), alors que l'extase suppose un franchissement de la pensée qui n'intervient qu'au-delà de l'Intellect, face à l'Un.
