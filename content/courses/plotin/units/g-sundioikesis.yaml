id: g-sundioikesis
title: Co-gouvernement (`sundioikêsis`)
icon: people
color: sky
lessons:
- id: g-sundioikesis-l1
  title: Co-gouvernement
  notes: |-
    Chez Plotin, le {violet}**co-gouvernement**{/violet} (*sundioikêsis*) est [def] : la première étape de la remontée, où l'âme cesse de se vivre comme une partie isolée.

    __**La notion vient du *Phèdre*.**__ Notre âme, « si elle peut s'associer à cette âme parfaite, parvient elle-même à la perfection et "voyage dans les hauteurs en gouvernant le monde tout entier" » ([[traite6|traité 6]], chap. 2). La condition suit : « quand elle s'écarte afin de ne pas être à l'intérieur des corps et de ne pas appartenir à l'un d'eux, alors elle aussi, comme l'âme de l'univers, __participe avec facilité au gouvernement__ de l'univers ». C'est là que se lit le verbe *sundioikein*, « co-gouverner ».

    __**Gouverner, ici, ce n'est pas diriger.**__ L'Âme du monde ne commande pas comme un chef qui corrige ses erreurs : elle met en ordre le tout « __sans aucune peine__, parce qu'elle ne procède pas en raisonnant, comme nous, mais en usant de l'Intellect » (chap. 8). Co-gouverner, c'est donc **participer à la contemplation d'où découle l'ordre**, non intervenir dans le cours des événements. {yellow}Les âmes sont comme les conseillers d'un roi{/yellow}, qui « aident le roi régnant sur toutes choses à gouverner __sans descendre eux-mêmes des demeures royales__ » (chap. 4).

    __**Pourquoi nous le perdons.**__ Les âmes s'éloignent du tout « pour devenir une partie et __être leurs propres maîtres__ » (chap. 4). Repliée sur un seul corps, heurté de toutes parts, l'âme gouverne alors avec peine ce qu'elle gouvernait sans effort. **Ce n'est pas le corps qui l'a capturée, c'est elle qui a préféré la partie au tout.**

    __**C'est possible parce que toutes les âmes n'en font qu'une.**__ Notre âme est de même espèce que l'Âme du monde, une [[g-ame|âme sœur]], non une tranche découpée ([[traite8|traité 8]]). Le [[traite10|traité 10]] invite à le reconnaître : le ciel, avant l'âme, « n'était, auparavant, qu'un cadavre, de la terre et de l'eau » (chap. 2) ; or notre âme est de même espèce que la sienne. D'où : « Si tu admires l'âme qui se trouve en quelque chose d'autre, __admire-toi toi-même__ » (*seauton agasai*). **Il serait absurde d'admirer la vie que l'âme met dans le monde et de la mépriser en soi.**

    __**Le faisons-nous déjà ?**__ En un sens, oui : la partie la plus haute de notre âme ne descend jamais (voir [[g-ame-non-descendue|âme non descendue]]). En un autre, non : « nous ne faisons pas toujours usage de tout ce que nous possédons » ([[traite53|traité 53]], chap. 11). Devenir l'Âme, c'est passer de ce que nous avons à ce dont nous faisons usage : **on ne devient pas autre chose, on cesse de se tenir pour moins que ce qu'on est**.

    |  | Notion | L'âme… |
    | **Âme** | *sundioikêsis* | co-gouverne le monde |
    | **Intellect** | *noôthênai* | pense toutes les Formes à la fois |
    | **Un** | *henôsis* | s'unit au Premier, sans dualité |

    ! Le co-gouvernement n'est pas une descente dans les affaires du monde : l'âme qui gouverne avec l'Âme du monde partage son aisance, sans fatigue ni passion. C'est l'âme repliée sur un corps qui s'y disperse.

    **Voir aussi** : [[g-ame|Âme]] · [[g-ame-non-descendue|Âme non descendue]] · [[g-noothenai|Devenir intellect]] · [[g-henosis|Hénose]] · [[traite6|Traité 6]]
