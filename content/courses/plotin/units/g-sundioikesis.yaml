- id: g-sundioikesis-l2
  title: Devenir l'Âme
  notes: |-
    La `sundioikēsis` est la notion qui correspond le mieux, chez Plotin, au fait pour notre âme de **« devenir l'Âme »** : non pas se changer en une réalité étrangère, mais cesser de se vivre comme une partie isolée, repliée sur un corps restreint, pour réintégrer l'activité de l'**Âme totale** (`holē psuchē`) qu'elle n'a jamais quittée.

    |  | Notion | L'âme… |
    | **Âme** | `sundioikēsis` | co-gouverne le monde |
    | **Intellect** | `noōthēnai` | pense toutes les Formes à la fois |
    | **Un** | `henōsis` | s'unit au Premier, sans dualité |

    **Cette réintégration est possible parce que toutes les âmes n'en font qu'une.** Plotin le démontre en __IV, 9__ (traité 8, *Toutes les âmes sont-elles une ?*) : incorporelle, sans grandeur ni masse, l'Âme ne se divise pas en morceaux en s'associant aux corps, et la multiplicité des âmes ne vient que de la diversité des corps. Notre âme est donc de même espèce, de même rang et de même dignité que l'Âme du monde, ce que Plotin nomme sa `suggeneia`. Elle n'en est pas une tranche découpée, mais comme un **théorème** par rapport à la science entière, qu'il contient virtuellement (__IV, 9, 5__).

    **Encore faut-il que l'âme en prenne conscience.** En __V, 1, 2__ (traité 10, *Des trois hypostases qui ont rang de principes*), Plotin l'invite à contempler le monde, qui n'était qu'un « cadavre inerte » avant que l'Âme ne l'anime, puis à se reconnaître de même nature que cette grande Âme : « Admire-toi toi-même » (`seauton agasai`). Cette reconnaissance suppose une purification (`katharsis`), qui retranche passions, désirs corporels et représentations sensibles.

    ! De l'Âme à l'Un, le verbe « devenir » est de moins en moins propre. C'est au niveau de l'Âme, hypostase charnière entre l'intelligible et le temps, qu'il garde **le plus de sens** : une restauration, un passage de la puissance à l'acte dans la conduite de la vie.

    ! Ni l'`henōsis` ni l'`ekstasis` ne nomment le devenir-Âme : l'Âme conserve une activité organisatrice et discursive (`logos`, `dianoia`), alors que l'extase suppose un franchissement de la pensée qui n'intervient qu'au-delà de l'Intellect, face à l'Un.
