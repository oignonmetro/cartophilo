    answer: hauteurs
    alt: []
  - id: g-sundioikesis-l1-6
    sentence: "Reprenant le *Phèdre*, Plotin écrit que notre âme, associée à l'Âme universelle, « voyage dans les hauteurs en ___ le monde tout entier »."
    answer: gouvernant
    alt: []
  - id: g-sundioikesis-l1-q2
    sentence: "Quand elle s'écarte afin de ne pas être à l'intérieur des corps, notre âme, comme l'âme de l'univers, « participe avec ___ au gouvernement de l'univers » (traité 6, chap. 2, l. 21-23)."
    answer: facilité
    alt: ["facilite"]
  - id: g-sundioikesis-l1-q3
    sentence: "Le verbe *sundioikein*, « co-gouverner », se lit au chapitre 2 du traité ___, *Sur la descente de l'âme dans les corps*, juste après la citation du *Phèdre*."
    answer: 6 (IV, 8)
    alt: ["6", "IV, 8"]
  - id: g-sundioikesis-l1-q4
    sentence: "L'âme du tout met en ordre le monde « sans aucune peine, parce qu'elle ne procède pas en raisonnant, comme nous, mais en usant de l'___ » (traité 6, chap. 8, l. 13-16)."
    answer: Intellect
    alt: ["intellect"]
  - id: g-sundioikesis-l1-14
    sentence: "L'Âme du monde ne gouverne pas en commandant ni en corrigeant sans cesse son œuvre : elle reçoit de l'Intellect les ___, qui ordonnent le monde sans qu'elle ait à calculer (traité 52, chap. 16-17)."
    answer: raisons
    alt: ["raison", "logoi"]
  - id: g-sundioikesis-l1-15
    sentence: "Co-gouverner le monde avec l'Âme universelle, ce n'est pas intervenir dans le cours des événements : c'est participer à la même ___ de l'intelligible, d'où découle l'ordre du monde."
    answer: contemplation
    alt: []
  - id: g-sundioikesis-l1-q5
    sentence: "Les âmes, « alors qu'elles restent préservées avec l'Âme totale dans l'intelligible, gouvernent aussi avec elle dans le ciel, comme ceux qui aident le ___ régnant sur toutes choses à gouverner » (traité 6, chap. 4, l. 5-8)."
    answer: roi
    alt: []
  - id: g-sundioikesis-l1-q6
