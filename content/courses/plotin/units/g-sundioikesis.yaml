  - id: g-sundioikesis-l1-1
    sentence: "Le terme grec, translittéré, par lequel Plotin désigne l'activité de l'âme individuelle qui, réassociée à l'Âme universelle, participe avec elle au gouvernement du monde sensible sans s'y engager physiquement, est la ___."
    answer: sundioikêsis
    alt: []
  - id: g-sundioikesis-l1-2
    sentence: "La *sundioikêsis*, activité par laquelle l'âme individuelle réassociée à l'Âme universelle participe au gouvernement du monde sans subir les affections de la matière, se traduit en français par « ___ »."
    answer: co-gouvernement
    alt: ["cogouvernement", "co-administration", "coadministration"]
  - id: g-sundioikesis-l1-3
    sentence: "Plotin emprunte le verbe *sundioikein*, qui fonde sa notion de co-gouvernement du monde par l'âme individuelle et l'Âme universelle, au ___ de Platon, où l'âme parfaite gouverne le monde tout entier."
    answer: Phèdre
    alt: []
