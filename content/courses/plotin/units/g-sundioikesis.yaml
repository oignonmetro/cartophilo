    answer: des demeures royales
    alt: []
  - id: g-sundioikesis-l1-q7
    sentence: "Les âmes gouvernent avec l'Âme totale, « alors qu'elles restent ___ avec l'Âme totale dans l'intelligible » (traité 6, chap. 4, l. 5-6)."
    answer: préservées
    alt: ["preservees"]
  - id: g-sundioikesis-l1-q8
    sentence: "Les âmes perdent le co-gouvernement en s'éloignant du tout que forme l'Âme « pour devenir une partie et être leurs propres ___ » (traité 6, chap. 4, l. 10-11)."
