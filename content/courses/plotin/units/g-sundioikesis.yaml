lessons:
- id: g-sundioikesis-l1
  title: Le co-gouvernement du monde
  notes: |-
    **Le co-gouvernement** (*sundioikêsis*) **est le fait que notre âme, par sa partie la plus haute, prend part avec l'Âme du monde à l'ordre de l'univers, sans y descendre.** C'est la première étape de la remontée : avant de devenir intellect, l'âme cesse de se vivre comme une partie isolée et retrouve sa place dans le tout.

    __**La notion vient du *Phèdre*.**__ Plotin cite {sky}Platon (246c){/sky} : notre âme, « si elle peut s'associer à cette âme parfaite, parvient elle-même à la perfection et "voyage dans les hauteurs en gouvernant le monde tout entier" » ([[traite6|traité 6]], chap. 2, l. 19-21). Et il ajoute aussitôt la condition : quand elle s'écarte {pink}afin de ne pas être à l'intérieur des corps et de ne pas appartenir à l'un d'eux{/pink}, {green}alors elle aussi, comme l'âme de l'univers, « participe avec facilité au gouvernement de l'univers »{/green} (l. 21-23). C'est là que se lit le verbe *sundioikein*, « co-gouverner ».

    __**Gouverner, ici, ce n'est pas diriger.**__ L'Âme du monde ne commande pas à la manière d'un chef qui donne des ordres et corrige ses erreurs : elle met en ordre le tout « sans aucune peine, parce qu'elle ne procède pas en raisonnant, comme nous, mais en usant de l'Intellect » (chap. 8, l. 13-16). Elle reçoit de l'Intellect les {violet}raisons{/violet} (*logoi*), les principes qui ordonnent les choses, et les laisse agir **sans calculer ni se fatiguer** ([[traite52|traité 52]], chap. 16-17). {coral}Co-gouverner, c'est donc participer à cette contemplation d'où découle l'ordre, non intervenir dans le cours des événements.{/coral}

    __**L'image des conseillers du roi.**__ Les âmes, « alors qu'elles restent préservées avec l'Âme totale dans l'intelligible, gouvernent aussi avec elle dans le ciel, comme ceux qui aident le roi régnant sur toutes choses à gouverner sans descendre eux-mêmes des demeures royales » (chap. 4, l. 5-9). {yellow}Un conseiller du roi a part au gouvernement de tout le royaume sans aller lui-même dans chaque province{/yellow} : il gouverne depuis le palais.

    __**Pourquoi nous le perdons.**__ Le même chapitre décrit le mouvement inverse : {red}les âmes s'éloignent du tout que forme l'Âme « pour devenir une partie et être leurs propres maîtres »{/red} (l. 10-11). Repliée sur un seul corps, heurté de toutes parts, l'âme gouverne alors avec peine ce qu'elle gouvernait sans effort. **Ce n'est pas le corps qui l'a capturée, c'est elle qui a préféré la partie au tout.**

    Le même vocabulaire revient ailleurs : pour les {violet}démons{/violet}, qui « co-gouvernent » avec l'Âme du monde ([[traite50|traité 50]], chap. 6, l. 33), et sous la forme {violet}*sunepimeloumenê*{/violet}, « co-soignante » de l'univers, pour l'âme individuelle ([[traite2|traité 2]], chap. 13, l. 11).

    __**Le faisons-nous déjà ?**__ En un sens, oui : la partie la plus haute de notre âme ne descend jamais, et c'est à ce niveau que le co-gouvernement a lieu, que nous le sachions ou non. En un autre sens, non : « nous ne faisons pas toujours usage de tout ce que nous possédons » ([[traite53|traité 53]], chap. 11, l. 5-6), et nous n'y participons **en acte** que lorsque nous nous identifions à cette partie, par la purification et la contemplation.

    ! Le co-gouvernement n'est pas une descente de l'âme dans les affaires du monde : l'âme qui gouverne avec l'Âme du monde partage son aisance, sans fatigue ni passion. C'est au contraire l'âme repliée sur un corps qui s'y disperse et en subit les affections.

    ! Plotin ne dit pas en ces termes que nous co-gouvernons « sans le savoir » dans la vie de tous les jours : c'est ce que permettent de dire ensemble ses traités sur la descente de l'âme (6), l'unité des âmes (8) et le « nous » (53).
