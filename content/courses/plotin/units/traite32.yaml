- id: traite32-l4
  title: "Le Bien avant le Beau"
  notes: |-
    **Le Bien est antérieur au Beau** (chap. 12) : Platon ne tranche pas nettement (*République*, VI ; *Hippias majeur* ; *Philèbe*). Plotin identifie **l'Un au Bien** et **l'Intellect au Beau**.

    | Le Bien | Le Beau |
    | un désir connaturel, présent même à ceux qui dorment | un amour qui suppose d'avoir vu le beau, chez ceux qui sont éveillés |
    | ne suscite pas la stupeur | provoque la stupeur, le choc, mêle le plaisir à la douleur |
    | on ne se contente pas d'en avoir l'apparence | il suffit souvent de paraître beau |
    | doux, bienveillant, délicat | entraîne les ignorants loin du Bien |
    | plus ancien, en réalité, non dans le temps | plus jeune, de second rang |

    Les hommes disputent au Beau la première place, **comme l'enfant d'un roi** qui voudrait s'élever au rang de son aîné, né du même père. Le Bien n'a pas besoin de ce qui naît de lui : peu lui aurait importé que rien ne naisse.

    **La transcendance du Bien** (chap. 13) : étant le Bien, et non quelque chose de bon, **il ne possède rien**, pas même le fait d'être bon. Il est **« seul et isolé »** (*Philèbe*). Lui ajouter la réalité, l'intellect ou le beau, c'est le priver d'être le Bien ; comme ceux qui font des éloges sans science **amoindrissent** celui qu'ils célèbrent. Il n'est aucune des choses, mais leur cause : **le producteur est meilleur que le produit**.

    ! Placer le Bien avant le Beau n'est pas déprécier la beauté : elle est la première splendeur de l'Intellect, mais elle tient d'un autre ce qu'elle est.
