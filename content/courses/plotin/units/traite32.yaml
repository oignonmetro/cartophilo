- id: traite32-l5
  title: "Repérage : le plan du traité 32"
  notes: |-
    **Le traité 32 traite d'abord de l'Intellect (chap. 1-3), puis de l'Un et du Bien (chap. 4-13).**

    | Moment | Lieu | Ce qui s'y joue |
    | les intelligibles hors de l'Intellect ? | chap. 1 | il ne posséderait que le faux |
    | l'Intellect possède la vérité | chap. 2 | rien de plus vrai que la vérité |
    | le second dieu et le premier | chap. 3 | le Grand Roi |
    | l'Un et les nombres | chap. 4 | une mesure, non un mesuré |
    | l'être, trace de l'Un | chap. 5 | l'étymologie de « être » |
    | la nature de l'Un | chap. 6 | au-delà de l'être ; Apollon |
    | l'Intellect et l'œil | chap. 7 | la lumière paupières closes |
    | l'omniprésence de l'Un | chap. 8-9 | l'attente ; le contenant |
    | comment percevoir l'Un | chap. 10 | une puissance illimitée |
    | les matérialistes | chap. 11 | les gloutons des fêtes |
    | la primauté du Bien | chap. 12 | le Bien avant le Beau |
    | la transcendance du Bien | chap. 13 | seul et isolé |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! Le chapitre 3 fait la transition : l'Intellect, second dieu, annonce le premier, auquel sont consacrés les dix derniers chapitres.
