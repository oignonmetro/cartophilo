- id: traite32-l2
  title: "Le second dieu ; l'Un au-delà du nombre et de l'être"
  notes: |-
    **L'Intellect est un dieu second** (chap. 3), qui se manifeste à nous avant que l'on voie le premier. Devant le premier dieu doit s'avancer une **« beauté extraordinaire »**, comme dans **les processions** : les rangs inférieurs, puis les plus nobles, puis ceux qui ont les plus grands honneurs ; enfin **le Grand Roi** apparaît soudain. Mais là-bas, le roi ne gouverne pas des choses étrangères : il est le **« père des dieux »**, et Zeus imite l'activité de ce grand-père.

    **L'Un et les nombres** (chap. 4) : l'Un véritable n'est pas un par participation. **Il est une mesure et non pas ce qui est mesuré** : il ne se laisse pas compter avec autre chose.

    | Nombre | Rapport |
    | l'Un | modèle des nombres essentiels |
    | les nombres essentiels, dans l'Intellect | donnent l'être ; modèles des nombres quantifiés |
    | les nombres quantifiés, dans l'âme | donnent la quantité |

    L'unité antérieure à la dualité continue d'exister quand la dualité naît, et n'est aucune de ses deux unités.

    **L'être, trace de l'Un** (chap. 5) : chaque chose a en elle comme une forme du Premier ; **l'être est une trace de l'Un**. Plotin va jusqu'à une étymologie : prononcé en appuyant, *eînai* (« être ») fait entendre *hén* (« un »).

    **Au-delà de l'être** (chap. 6) : ce qui naît de l'Un est la forme de toutes choses ; l'Un est donc sans forme, **« au-delà de l'être »** (*République*, VI). L'expression n'affirme rien : elle dit seulement de l'Un qu'il est un « non-ceci ». Le nom même d'« un » est peut-être **une négation du multiple** : ainsi les pythagoriciens l'appelaient **Apollon** (« non-plusieurs »).

    ! Le nom « un » ne décrit pas l'Un : il sert de point de départ à celui qui cherche, pour qu'il finisse par le renier.
