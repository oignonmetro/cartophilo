- id: traite32-l3
  title: "Voir l'Un : la lumière, l'attente, le contenant"
  notes: |-
    **L'Intellect et l'œil** (chap. 7) : l'œil voit la forme des choses et, avec elle, la lumière qui les fait voir ; mais il voit parfois une lumière qui lui est propre, **quand il referme les paupières** ou qu'on presse sur lui : **« lorsqu'il ne voit pas, l'œil voit »**. De même, l'Intellect qui se replie vers l'intérieur contemple une lumière pure, qui apparaît **soudainement** : « elle était donc à l'intérieur et non à l'intérieur ».

    **Attendre** (chap. 8) : il ne faut pas poursuivre cette lumière, mais rester immobile, **comme l'œil qui attend le lever du soleil**. Le Beau ne vient pas comme quelqu'un qu'on attend : **il est venu comme s'il ne venait pas**, car il était présent avant tout.

    **Le contenant** (chap. 9) : tout ce qui naît d'autre chose est en elle. D'où un emboîtement :

    | Ce qui est contenu | Ce qui le contient |
    | le monde | l'Âme |
    | l'Âme | l'Intellect |
    | l'Intellect | l'Un |
    | l'Un | rien : il n'est nulle part |

    **« L'Âme n'est pas dans le monde : c'est le monde qui est dans l'Âme. »** L'Un, n'étant possédé par rien et possédant tout, est partout tout entier, et le bien de toutes choses.

    **Ne pas le regarder à travers les autres choses** (chap. 10-11) : on n'en verrait qu'une trace. Il faut l'approcher comme une totalité : il est le Bien, l'un, le principe ; illimité non comme une grandeur, mais **comme une puissance**. Ne le cherche pas **« avec tes yeux de mortel »**. Ceux qui ne croient qu'à ce qu'ils touchent ressemblent aux **gloutons des fêtes**, qui se remplissent de nourriture et ne voient pas le dieu, ou aux dormeurs qui préfèrent leurs rêves.

    ! Que l'Un ne soit nulle part ne veut pas dire qu'il soit absent : n'étant contenu par rien, il n'est éloigné de rien.
