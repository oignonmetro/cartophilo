id: traite32
title: "Traité 32 (V, 5) : Sur l'intellect et que les intelligibles ne sont pas hors de l'intellect, et sur le Bien"
subtitle: "Les intelligibles dans l'Intellect ; l'Un-Bien"
icon: compass
color: sky
lessons:
- id: traite32-l1
  title: "Les intelligibles ne sont pas hors de l'Intellect"
  notes: |-
    **Les traités 31 et 32 ne faisaient qu'un** : Porphyre les a séparés et a interverti leur ordre. La fin du traité 31 annonçait qu'il fallait **« revenir en arrière pour emprunter une autre route »** : c'est ce que font les deux premiers chapitres du traité 32.

    **Une question disputée des platoniciens** : les intelligibles sont-ils dans l'intellect du démiurge, ou hors de lui ? Tout repose sur le *Timée* (39e), où l'intellect « voit » les espèces contenues dans le Vivant.

    | Position | Tenants |
    | les Idées sont les pensées du dieu, en lui | Philon d'Alexandrie, Alcinoos, peut-être Atticus |
    | elles sont sous le démiurge | Longin |
    | elles sont au-dessus du démiurge | Porphyre, disciple de Longin |
    | les intelligibles sont l'Intellect même | Plotin |

    Arrivé à Rome, **Porphyre** écrivit une réfutation de la thèse de Plotin ; **Amélius** lui répondit, et Porphyre finit par se ranger à ses arguments (*Vie de Plotin*, 18).

    **L'argument** (chap. 1) : l'Intellect véritable ne se trompe jamais, **« car comment pourrait-il encore être Intellect, s'il était inintelligent ? »** Or, s'il connaissait les intelligibles comme extérieurs à lui :

    - il ne les rencontrerait pas toujours, et sa connaissance serait comme **la sensation**, qui ne saisit qu'**une image** de l'objet ;
    - les intellections seraient des **empreintes** venues du dehors ;
    - surtout, ne possédant que des images, **il ne posséderait que le faux**.

    **La vérité de l'Intellect** (chap. 2) : elle n'est pas en accord avec autre chose, mais avec elle-même : **« ce qu'elle dit, elle l'est, et ce qu'elle est, c'est ce qu'elle dit »**. Nul ne peut la réfuter, car on ne saurait découvrir quelque chose de plus vrai que la vérité.

    ! Mettre les intelligibles hors de l'Intellect ne les protège pas : cela prive l'Intellect de la vérité, et le réduit à une sensation.
