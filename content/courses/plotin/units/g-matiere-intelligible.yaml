- id: g-matiere-intelligible-l1
  title: Matière intelligible
  notes: |-
    Chez Plotin, la {violet}**matière intelligible**{/violet} est [def] ; elle n'a {pink}rien de la masse ni de l'étendue{/pink}.

    __**Si les Formes sont plusieurs, il leur faut un substrat.**__ C'est l'argument du [[traite12|traité 12]] (chap. 2-5), surprenant au premier abord : qu'y a-t-il de matériel dans l'intelligible ? Chaque Forme a sa figure propre ; or ce qui a une figure propre suppose un substrat qui la reçoive, comme une forme suppose ce qu'elle forme. **Il faut donc, là-bas aussi, une matière** : un substrat commun à toutes les Formes, grâce auquel elles se distinguent sans que l'intelligible se fragmente.

    __**Ce qui la produit : l'Altérité.**__ « L'altérité de là-bas existe toujours, elle qui __produit la matière__, car c'est elle qui est le principe de la matière et __le mouvement premier__ » (chap. 5) : le premier écart par rapport à l'Un. Le genre qui distingue les Formes est donc aussi celui qui leur donne leur substrat.

    __**Ce qu'elle est.**__ La puissance indéterminée issue de l'Un, avant sa conversion : elle est la matière de l'Intellect, qui ne reçoit sa forme qu'en se retournant vers l'Un (voir [[g-procession|procession]]). D'autres traités l'identifient à la {violet}**Dyade indéfinie**{/violet}. Elle est engendrée, mais pas dans le temps.

    | Matière intelligible | Matière sensible |
    | une fois formée, vie définie et intellective | même formée, ne vit ni ne pense |
    | garde toujours la même forme | reçoit une forme après une autre |

    ! « Matière » ne veut pas dire ici masse ni étendue : la matière intelligible est incorporelle, et c'est pourquoi elle distingue les Formes sans les séparer.

    **Voir aussi** : [[g-multiplicite-intelligible|Multiplicité intelligible]] · [[g-hule|Matière]] · [[g-intellect|Intellect]] · [[g-procession|Procession]] · [[traite12|Traité 12]]
