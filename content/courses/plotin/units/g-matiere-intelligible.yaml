  - id: g-multiplicite-intelligible-l4-1
    sentence: "Si les Formes sont plusieurs, chacune a sa figure propre, qui suppose un substrat pour la recevoir : Plotin en conclut qu'il existe une matière ___ (traité 12, chap. 4)."
    answer: intelligible
    alt: []
  - id: g-multiplicite-intelligible-l4-2
    sentence: "La matière intelligible est un substrat ___ à toutes les Formes : grâce à elle, elles se distinguent sans que l'intelligible se fragmente."
    answer: commun
    alt: []
  - id: g-multiplicite-intelligible-l4-3
    sentence: "Le traité où Plotin démontre l'existence d'une matière intelligible, à côté de la matière sensible, est le traité ___ (II, 4)."
    answer: "12"
    alt: ["douze"]
  - id: g-multiplicite-intelligible-l4-4
    sentence: "Dans l'Intellect, Forme unique qui en contient beaucoup, les distinctions entre les Formes viennent d'une matière « ___ » en autant de figures (traité 12, 4)."
    answer: coupée
    alt: ["coupee"]
  - id: g-multiplicite-intelligible-l4-5
    sentence: "La puissance indéterminée qui procède de l'Un, avant sa conversion, est la matière de l'Intellect, que Plotin identifie ailleurs (V, 4, 2 ; V, 1, 5) à la ___ indéfinie."
    answer: Dyade
    alt: ["dyade"]
  - id: g-multiplicite-intelligible-l4-6
    sentence: "Une fois formée, la matière intelligible devient une vie définie et ___, alors que la matière sensible, même formée, ne vit ni ne pense (traité 12, 5)."
    answer: intellective
    alt: []
  - id: g-multiplicite-intelligible-l4-q1
    sentence: "« L'altérité de là-bas existe toujours, elle qui produit la ___, car c'est elle qui est le principe de la matière et le mouvement premier » (traité 12, chap. 5, l. 28-30)."
    answer: matière
    alt: ["matiere"]
  - id: g-multiplicite-intelligible-l4-q2
    sentence: "« L'altérité de là-bas existe toujours, elle qui produit la matière, car c'est elle qui est le principe de la matière et le ___ » (traité 12, chap. 5, l. 28-30)."
    answer: mouvement premier
    alt: []
  - id: g-multiplicite-intelligible-l4-q3
