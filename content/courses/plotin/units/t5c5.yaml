# Unité de texte (voir content/textes.md) : Plotin, traité 5 (V, 9), Sur
# l'Intellect, les idées et ce qui est, chapitres 5-6, traduction GF (éd.
# L. Brisson et J.-F. Pradeau). Découpage seul : rappels et cartes à écrire.

id: "t5c5"
title: "L'Intellect et les choses qui sont (5 [V, 9], 5-6)"
subtitle: "Traité 5, Sur l'Intellect, les idées et ce qui est, chapitres 5-6"
icon: "page"
color: "coral"
depth: "normale"
lessons:
- id: "t5c5-p5"
  title: "En puissance ou en acte ?"
  notes: ""
  passage:
    label: "chap. 5, l. 1-11"
    part: "Un intellect toujours en acte"
    text: |-
      Il ne faut pas considérer l'Intellect, si l'on veut employer ce mot dans sa véritable signification, comme un intellect qui serait en puissance ou qui passerait d'un état d'absence d'intelligence à l'intellection, car on devrait alors chercher encore un autre intellect avant lui, mais comme un intellect qui est en acte et qui est donc toujours intellect.
  points: []
- id: "t5c5-p5b"
  title: "Il est lui-même ce qu'il pense"
  notes: ""
  passage:
    label: "chap. 5, l. 1-11"
    part: "Un intellect toujours en acte"
    text: |-
      Mais si la réflexion n'est pas introduite en lui de l'extérieur, s'il pense quelque chose, c'est par lui-même, et s'il possède quelque chose, c'est par lui-même. Et s'il pense par lui-même et à partir de lui-même, il est lui-même ce qu'il pense.
  points: []
- id: "t5c5-p5c"
  title: "Ne pas séparer le pensant et le pensé"
  notes: ""
  passage:
    label: "chap. 5, l. 1-11"
    part: "Un intellect toujours en acte"
    text: |-
      Car, si sa réalité et ce qu'il pense étaient deux choses distinctes, sa réalité serait, en elle-même, inintelligible, et il serait donc encore une fois en puissance, non pas en acte. Il ne faut donc pas séparer ce qui pense et ce qui est pensé l'un de l'autre, même si notre expérience nous conduit habituellement à les concevoir séparés.
  points: []
- id: "t5c5-p5d"
  title: "Quelle est son activité ?"
  notes: ""
  passage:
    label: "chap. 5, l. 11-19"
    part: "Ce que pense l'Intellect"
    text: |-
      – Quelle est donc son activité et que pense-t-il, pour que nous puissions affirmer qu'il est lui-même ce qu'il pense ?

      – Puisqu'il est bien clair que l'Intellect, étant réellement, pense les choses qui sont et les fait exister, il est alors ces choses.
  points: []
- id: "t5c5-p5e"
  title: "Ni ailleurs ni hors de lui"
  notes: ""
  passage:
    label: "chap. 5, l. 11-19"
    part: "Ce que pense l'Intellect"
    text: |-
      Et il les pensera soit ailleurs, soit en lui, comme lui-même. Mais qu'il les pense comme étant ailleurs, c'est impossible : où seraient-elles, en effet ? Alors, il se pense lui-même et les pense en lui-même.
  points: []
- id: "t5c5-p5f"
  title: "Pas dans les choses sensibles"
  notes: ""
  passage:
    label: "chap. 5, l. 11-19"
    part: "Ce que pense l'Intellect"
    text: |-
      Car elles ne sont certainement pas dans les choses sensibles, comme ils le croient, puisque aucune réalité première n'appartient au sensible ; et cela parce que, dans les choses sensibles, la Forme est une image sur la matière de la Forme réelle, et chaque Forme qui se trouve dans une chose y vient d'une autre Forme, à laquelle elle ressemble.
  points: []
- id: "t5c5-p5g"
  title: "Les archétypes du producteur de l'univers"
  notes: ""
  passage:
    label: "chap. 5, l. 19-26"
    part: "Des réalités antérieures au monde"
    text: |-
      En outre, s'il faut qu'il y ait « un producteur de cet univers », il ne pourra, pour le produire, penser ce qui se trouverait dans un univers qui n'existe pas encore. Ces choses devront donc exister avant le monde, non pas comme les empreintes d'autres choses, mais comme les archétypes et les réalités premières, c'est-à-dire la réalité de l'Intellect.
  points: []
- id: "t5c5-p5h"
  title: "Les raisons ne suffisent pas"
  notes: ""
  passage:
    label: "chap. 5, l. 19-26"
    part: "Des réalités antérieures au monde"
    text: |-
      Et s'ils affirment que les raisons suffisent, elles seront forcément éternelles ; mais si elles sont éternelles et qu'elles ne sont pas sujettes aux affections, il faut qu'elles se trouvent dans un intellect qui soit tel qu'il précède la disposition, la nature et l'âme, car ces choses sont en puissance.
  points: []
- id: "t5c5-p5i"
  title: "Le premier législateur"
  notes: ""
  passage:
    label: "chap. 5, l. 26-36"
    part: "L'Intellect est les choses qui sont"
    text: |-
      L'Intellect est donc les choses qui sont réellement, et il ne les pense pas comme si elles étaient ailleurs : elles ne sont ni avant ni après lui. De fait, l'Intellect est pour ainsi dire le premier législateur, ou plutôt, il est la loi même de leur être.
  points: []
- id: "t5c5-p5j"
  title: "Être et penser"
  notes: ""
  passage:
    label: "chap. 5, l. 26-36"
    part: "L'Intellect est les choses qui sont"
    text: |-
      C'est donc à juste titre que l'on peut affirmer les choses suivantes : « être et penser sont la même chose » ; « la science des choses immatérielles est identique à son objet » ; « je me suis cherché moi-même » comme l'une des choses qui sont ; et l'on peut dire la même chose des réminiscences.
  points: []
- id: "t5c5-p5k"
  title: "Immuables, donc réellement"
  notes: ""
  passage:
    label: "chap. 5, l. 26-36"
    part: "L'Intellect est les choses qui sont"
    text: |-
      Car aucune des choses qui sont ne se trouve au-dehors ou en un lieu, mais elles restent toujours en elles-mêmes, n'admettant ni changement ni corruption : voilà pourquoi elles sont les choses qui sont réellement. En effet, si elles étaient sujettes à la génération et à la corruption, elles tireraient leur être d'une chose extérieure, et c'est cette chose et non pas elles-mêmes qui serait l'être.
  points: []
- id: "t5c5-p5l"
  title: "La participation des choses sensibles"
  notes: ""
  passage:
    label: "chap. 5, l. 36-49"
    part: "Les choses qui sont et leurs images"
    text: |-
      C'est du fait de la participation que les choses sensibles sont ce que l'on dit d'elles. Car leur substrat reçoit sa figure d'ailleurs, comme l'airain de la statuaire et le bois de la charpenterie.
  points: []
- id: "t5c5-p5m"
  title: "La technique et son image"
  notes: ""
  passage:
    label: "chap. 5, l. 36-49"
    part: "Les choses qui sont et leurs images"
    text: |-
      La technique leur parvient en effet au moyen d'une image, tout en restant identique à elle-même, en dehors de la matière, et en gardant en elle la vraie statue et le vrai lit. Et il en va de même pour les corps.
  points: []
- id: "t5c5-p5n"
  title: "Ce que montre cet univers"
  notes: ""
  passage:
    label: "chap. 5, l. 36-49"
    part: "Les choses qui sont et leurs images"
    text: |-
      Cet univers, puisqu'il participe à des images, montre que les choses qui sont diffèrent de leurs images ; elles sont immuables tandis que leurs images changent ; elles restent en elles-mêmes ; elles n'ont pas besoin de lieu car elles ne sont pas des grandeurs, et elles ont une existence intellectuelle qui leur suffit.
  points: []
- id: "t5c5-p5o"
  title: "L'Intellect soutient ce qui tomberait"
  notes: ""
  passage:
    label: "chap. 5, l. 36-49"
    part: "Les choses qui sont et leurs images"
    text: |-
      En effet, la nature des corps veut être conservée par quelque chose d'autre, tandis que l'Intellect, soutenant, par sa merveilleuse nature, les choses qui d'elles-mêmes tomberaient, ne se cherche pas à lui-même une place où se fixer.
  points: []
- id: "t5c5-p6"
  title: "Posséder sans contenir"
  notes: ""
  passage:
    label: "chap. 6, l. 1-8"
    part: "Toutes ensemble et pourtant distinctes"
    text: |-
      Disons alors que l'Intellect est les choses qui sont, et qu'il les possède toutes en lui-même ; non pas comme dans un lieu, mais comme se possédant lui-même et ne faisant qu'un avec elles. « Là-bas toutes choses sont ensemble » et pourtant distinctes.
  points: []
- id: "t5c5-p6b"
  title: "Comme les sciences dans l'âme"
  notes: ""
  passage:
    label: "chap. 6, l. 1-8"
    part: "Toutes ensemble et pourtant distinctes"
    text: |-
      En effet, bien que l'âme aussi possède en elle-même plusieurs sciences ensemble, elle ne comporte pourtant aucune confusion. Chacune d'entre elles accomplit la tâche qui lui est propre quand cela est nécessaire, sans entraîner les autres avec elle ; et chaque pensée agit sans se mélanger par ailleurs aux autres pensées qui demeurent à l'intérieur de l'âme.
  points: []
- id: "t5c5-p6c"
  title: "Chacune est une puissance particulière"
  notes: ""
  passage:
    label: "chap. 6, l. 8-11"
    part: "Le genre et le tout"
    text: |-
      De la même manière mais bien davantage encore, l'Intellect est « toutes choses ensemble » et en même temps ne l'est pas, car chacune d'entre elles est une puissance particulière. L'Intellect dans son ensemble les comprend comme un genre comprend les espèces, ou comme un tout comprend ses parties.
  points: []
- id: "t5c5-p6d"
  title: "Des raisons concentrées mais distinctes"
  notes: ""
  passage:
    label: "chap. 6, l. 11-24"
    part: "L'exemple des semences"
    text: |-
      Les puissances des semences donnent une illustration de ce que nous venons de dire : dans la semence entière, en effet, les parties ne sont pas distinctes, et les raisons y sont en quelque sorte concentrées ; mais il y a bien une raison de l'œil et une raison des mains, et l'on sait qu'elles sont distinctes de la réalité sensible engendrée par la semence.
  points: []
- id: "t5c5-p6e"
  title: "Une raison unique, une Forme"
  notes: ""
  passage:
    label: "chap. 6, l. 11-24"
    part: "L'exemple des semences"
    text: |-
      Ainsi en va-t-il des puissances qui se trouvent dans les semences : chacune d'elles est une raison unique, qui forme un tout avec les parties qu'elle contient. Elle a ce qui est corporel pour matière (tout ce qui est humide par exemple), mais elle est en elle-même une Forme, un tout et une raison identique à la Forme qui engendre et qui se trouve dans cette âme qui est l'image d'une autre âme meilleure.
  points: []
- id: "t5c5-p6f"
  title: "La nature informe la matière"
  notes: ""
  passage:
    label: "chap. 6, l. 11-24"
    part: "L'exemple des semences"
    text: |-
      Cette âme qui est dans les semences, que certains appellent « nature », est venue de là-bas, des réalités qui lui sont antérieures, tout comme la lumière vient du feu ; elle transforme la matière et l'informe, non pas en la manœuvrant ni en se servant de ces leviers dont on parle tant, mais en lui faisant part de ses raisons.
  points: []
