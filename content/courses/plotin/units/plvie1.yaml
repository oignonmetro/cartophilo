- id: plvie1-l6
  title: "Des Formes vivantes"
  notes: |-
    **Si la vie est la marque de l'être le plus accompli, les Formes intelligibles doivent-elles vivre ?** Chez {sky}Platon{/sky}, elles sont éternelles et séparées, mais {pink}il n'est pas évident qu'elles soient vivantes{/pink} au sens plein. {sky}Aristote{/sky} les critique précisément parce qu'elles sont {red}inactives{/red}, {red}incapables d'exercer une causalité efficace sans l'intermédiaire d'un Intellect moteur{/red}.

    **Plotin répond en** {violet}vivifiant{/violet} **les Formes, par leur intériorisation dans l'Intellect.** Elles ne sont {red}pas des réalités séparées que l'Intellect contemplerait de l'extérieur{/red}, mais {green}les actes mêmes dans lesquels il se déploie et se pense{/green}.

    **Un double déplacement face à Platon :**
    - ce qui était le propre de l'âme, {amber}être source et principe de mouvement et de vie{/amber} ({sky}*Phèdre*, 245c{/sky}), remonte d'un cran et devient {coral}l'apanage de l'Intellect{/coral} : la vie première est son activité éternelle ;
    - puisque l'Intellect ne forme avec les Formes qu'une seule nature, {coral}les Formes sont elles aussi des réalités vivantes{/coral}.

    **Chaque Forme est une singularité totale.** Les Formes naissent toutes ensemble, dans le mouvement par lequel l'Intellect se constitue, et chacune est un aspect, une puissance particulière de l'Intellect divin. Cette genèse simultanée implique que {amber}chacune, en se déterminant, se détermine aussi par rapport à toutes les autres{/amber}. Chacune exprime donc la raison d'être de toutes les autres et porte en elle, {coral}de manière indivise{/coral}, tout ce qui sera développé dans le sensible.

    **La causalité des Formes change de nature.** Unie aux notions de vie, d'acte et de pensée, la Forme {red}n'a plus besoin d'une cause ouvrière{/red} pour agir : {green}la seule perfection de son existence suffit pour qu'une image en dérive{/green}. Il suffit au monde intelligible d'exister pour produire spontanément et immédiatement une image de lui-même, le {violet}monde sensible{/violet}, lui aussi, quoique sur un mode moins unifié, {amber}un tout vivant et en sympathie avec lui-même{/amber} (III, 2 [47], 2).

    **La critique d'Aristote se retourne ainsi contre lui** : les Formes séparées ne sont inefficaces que si on les pense privées de vie.

    ! La {violet}cause ouvrière{/violet} est l'artisan qui regarde un modèle et fabrique d'après lui : Plotin s'en passe.
