# Cours tiré d'un chapitre de manuel collectif sur la vie : Alexandra
# Michalewski, « Y a-t-il une unité des différents sens de la vie ? Une
# réflexion à partir de Plotin », La vie comme problème pour la pensée, chap. 2,
# p. 47-62 (scan sans texte, fourni par l'utilisateur, lu sur l'image). Voir
# content/philosophie.md, § « Un cours sur un auteur, tiré d'un commentaire » :
# pas de repérage du chapitre, citations reprises telles qu'il les donne
# (Plotin : Bréhier, Les Belles Lettres), avec ses références (*Ennéades*, rang
# porphyrien, puis numéro chronologique du traité entre crochets).
#
# Unités plvie1 à plvie3 : la vie de l'Intellect (introduction et partie 1) ; la
# vie de l'âme (partie 2) ; le retour à l'origine (partie 3 et conclusion).
#
# Coquille écartée : dans la citation de VI, 7 [38], 17, le chapitre écrit « une
# fois qu'elle l'a vue » ; l'objet est l'Un : lu « vu ».
# Références ajoutées, absentes du chapitre : II, 9 [33], 9 pour les modes de
# vie des sages et de la multitude (plvie2) ; VI, 7 [38], 22 pour le vivant plus
# beau que la statue (plvie3). Le chapitre renvoie au discours de Diotime par
# « Banquet, 201d-208c » : le discours se poursuit au-delà de 208c, seul le
# début du repère est repris.

