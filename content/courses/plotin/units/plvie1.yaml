- id: plvie1-l4
  title: "La genèse de l'Intellect en trois moments"
  notes: |-
    **La vie est la caractéristique première de l'Intellect, ce qui se voit à la manière dont il se rapporte à son principe, l'Un.** Cette relation est exposée sous la forme d'un récit de genèse, {amber}purement logique et non temporelle{/amber} : il ne raconte pas ce qui s'est passé un jour, il distingue des moments dans une dépendance éternelle. Sa présentation la plus achevée est au traité VI, 7 [38].

    | Moment | Ce qui se passe | Ce qu'est la vie |
    | émanation | l'Un produit un premier rejeton | une vie indéterminée |
    | conversion | elle se retourne vers l'Un | limite, forme et contenu reçus |
    | constitution | l'Intellect est pleinement formé | le Vivant total |

    **L'émanation : une vie encore sans contour.** L'Un, {coral}en vertu de sa puissance infinie{/coral}, produit au-dehors de lui-même un premier rejeton, une {violet}vie indéterminée{/violet} : une activité {amber}pré-intellectuelle{/amber}, qui n'est encore que {amber}pure orientation vers l'origine{/amber}. Plotin la décrit ainsi (VI, 7 [38], 17, 14-16) : {teal}« {/teal}Au moment où {teal}la vie dirigeait ses regards vers lui{/teal} [l'Un], elle {teal}était encore illimitée{/teal} ; une fois qu'elle l'a vu, {teal}elle a été limitée{/teal}, sans que {teal}l'Un lui-même ait aucune limite »{/teal}.

    **La conversion : en regardant, elle prend forme.** La vie indéterminée se retourne vers l'Un et, {coral}dans ce geste même, reçoit limitation, forme et contenu{/coral} : elle devient {violet}auto-contemplation{/violet}. C'est la constitution de l'Intellect comme {amber}acte de pensée{/amber}. À ce stade, la vie est {coral}ce qui engendre toutes les Formes intelligibles en les structurant en un tout organique parfait{/coral}. La limite ne vient donc pas d'une borne que l'Un possèderait et transmettrait : lui n'en a aucune.

    **L'Intellect achevé : le Vivant total.** Il englobe toutes les Formes, en tant qu'êtres vivants individuels, et forme ce que Plotin, d'après le {sky}*Timée*{/sky}, appelle le {violet}Vivant total{/violet}, complet et ne manquant de rien. Une {yellow}course{/yellow} tout à la fois {teal}« vagabonde »{/teal} et {teal}« immobile »{/teal} parcourt éternellement les Formes (VI, 7 [38], 13) : {amber}vagabonde{/amber}, car la pensée va d'une Forme à l'autre ; {amber}immobile{/amber}, car elle ne sort jamais d'elle-même et ne passe pas dans le temps.

    **Dans l'Intellect achevé, la vie empêche l'être d'être une substance inerte** : elle est {coral}le mouvement interne qui fait que l'être pense et que la pensée existe{/coral}, et qui permet à l'Intellect d'être une totalité unifiée, en parfaite cohérence avec elle-même.

    ! L'antériorité de la vie indéterminée sur l'Intellect n'est pas une antériorité dans le temps.
