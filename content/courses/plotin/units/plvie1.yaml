- id: plvie1-l3
  title: "Partir de la pensée, non du vivant"
  notes: |-
    **Comment dire que la vie est d'abord intellectuelle et non biologique ?** La tradition antique la définit par {amber}ses manifestations les plus immédiatement observables{/amber} : la {yellow}croissance{/yellow}, la {yellow}nutrition{/yellow}, la {yellow}reproduction{/yellow}, la {yellow}sensation{/yellow}. C'est de ces fonctions qu'elle monte ensuite vers les facultés supérieures de l'âme.

    **Plotin renverse la démarche** : {red}il ne s'agit pas de partir du vivant pour comprendre la pensée{/red}, mais {green}de partir de la pensée pour comprendre ce qu'est la vie{/green}. Il faut montrer que {coral}l'activité la plus haute, celle de l'Intellect divin, est aussi la vie la plus accomplie{/coral}, et que les formes inférieures ne sont des vies que {amber}par participation et dérivation{/amber} depuis ce foyer. Ce renversement exige de transformer les concepts hérités, à commencer par celui d'{violet}activité{/violet} ({blue}*energeia*{/blue}) d'Aristote.

    **Chez Platon, un être véritable ne peut être sans vie.** {sky}*Sophiste*, 248e-249a{/sky} : l'être véritable ne peut exister sans posséder {amber}la vie, l'intellect et le mouvement{/amber}. La thèse visait les partisans d'un être immobile, les {sky}« amis des Formes »{/sky}. Plotin la radicalise : {coral}un être sans vie et sans mouvement serait inerte, comparable à un corps{/coral}. Or l'être intelligible vaut mieux qu'un corps. Ce mouvement n'est pourtant {red}pas un déplacement local{/red} : c'est {green}un mouvement de pensée{/green} ({blue}*noèsis*{/blue}), une activité interne qui constitue la vie parfaite de l'Intellect.

    **La vie lie l'un et le multiple.** Elle est aussi un principe de pluralisation interne : toute vie est {amber}une pluralité qui se résorbe dans l'unité{/amber}. Le {sky}*Timée*{/sky} (31a) montrait l'Intellect démiurgique contemplant la totalité des Formes réunies dans le {violet}Vivant total{/violet} ; Plotin {coral}intériorise ce Vivant au sein même de l'Intellect{/coral}. La vie devient le lien entre l'unité de l'Intellect et la multiplicité des Formes.

    **Aristote fournit l'activité, que Plotin met en mouvement.** Selon {sky}*Métaphysique*, Λ, 7{/sky} (1072b26-28), l'activité divine de l'Intellect est celle d'une vie parfaite et éternelle. Plotin recueille l'héritage et en change le sens : cette vie n'est {red}pas le repos immobile d'un Premier Moteur qui se pense lui-même{/red}, mais {green}un mouvement intérieur, à la fois auto-contemplation et auto-production des Formes{/green}. Quand l'Intellect pense, il se pense lui-même, {amber}c'est-à-dire qu'il pense la totalité des Formes{/amber} : lui et les intelligibles ne forment qu'une seule nature, qui dérive éternellement de l'Un.

    ! Le partage des héritages : {sky}Aristote{/sky} donne les instruments pour identifier la vie à l'activité intellectuelle ; {sky}Platon{/sky}, de quoi fixer le statut ontologique de la vie dans le monde intelligible.
