- id: plvie1-l7
  title: "Contre Aristote : un mouvement sans manque, un dieu qui produit"
  notes: |-
    **Plotin ne se contente pas d'unir Platon et Aristote : il soutient qu'Aristote s'est trompé sur la définition du mouvement.** Pour {sky}Aristote{/sky}, le mouvement est un {violet}acte imparfait{/violet}, {amber}une réalité toujours en chemin vers une fin qui lui est extérieure{/amber}. Ainsi {yellow}bâtir{/yellow} n'est achevé que lorsque la maison, qui n'est pas l'acte de bâtir, est là.

    **Or il existe dans l'Intellect un autre mouvement** : {green}un mouvement sans manque et sans extériorité{/green}, qui est l'autre nom de cette activité {coral}sans transition et sans passage{/coral} qu'est la vie. Dire que l'Intellect se meut ne revient donc pas à dire qu'il lui manque quelque chose.

    **Plus profondément, Aristote a négligé la fécondité de la vie** : {coral}pour être pleinement vivant, l'intellect parfait devait aussi engendrer une réalité dérivée{/coral}. Un dieu qui se pense sans rien produire n'aurait pas la plénitude de la vie. Le raisonnement se suit ainsi :
    - l'être et la vie sont deux termes {amber}interchangeables{/amber} ;
    - donc toute Forme est {amber}vivante{/amber}, et le dieu est {amber}producteur{/amber} ;
    - il faut donc non seulement affirmer l'existence des Formes transcendantes, mais leur restituer {amber}le caractère vivant, pensant et productif{/amber} qu'Aristote leur avait retiré.

    **Il en résulte une nouvelle** {violet}cosmologie{/violet}**.** L'Intellect uni aux Formes est le niveau ontologique privilégié du déploiement de la vie ; depuis lui, chaque niveau du réel se déploie graduellement jusqu'au sensible, qui {red}ne porte qu'une trace lointaine de la vie première{/red}.

    **L'âme y tient un rôle fondamental** : elle est {coral}l'instance intermédiaire qui dispense la vie au monde des corps{/coral} et communique au sensible les déterminations issues de l'Intellect.

    ! Le mouvement de l'Intellect n'est pas un changement : il ne va de rien à rien, il est activité présente tout entière.
