lessons:
- id: plvie1-l1
  title: "Que nomme-t-on quand on nomme la vie ?"
  notes: |-
    **La vie de l'être humain, celle de l'animal, la vie de l'au-delà : le même mot désigne-t-il la même chose ?** Trois réponses se présentent. {amber}Une réalité{/amber} {violet}univoque{/violet} {amber}fonde toutes ces vies{/amber}. Ou bien nous avons affaire à {amber}une pluralité de sens irréductibles{/amber} les uns aux autres, et il faut renoncer à l'idée d'une unité. Ou encore {amber}la vie des vivants n'est que la trace d'un fondement{/amber} qui rend possible la vie multiple.

    **Plotin permet de reprendre la question.** Né en 204/205 et mort en 270 ap. J.-C., il passe pour le père du {violet}néoplatonisme{/violet}, une interprétation de {sky}Platon{/sky} selon laquelle {coral}tout le réel dérive d'une unité première, l'Un-Bien{/coral}, situé au-delà de l'être et de l'intellection. Héritier aussi d'{sky}Aristote{/sky} et de la tradition hellénistique, il apporte plusieurs innovations, au premier rang desquelles celle-ci : {green}l'ensemble du réel forme une{/green} {teal}« vaste vie »{/teal} (*Ennéades*, V, 2 [11], 2).

    ? Les trois principes : l'{violet}Un{/violet}, source de tout ; l'{violet}Intellect{/violet}, la pensée qui se pense elle-même et contient toutes les Formes ; l'{violet}Âme{/violet}, qui donne vie et ordre au monde des corps. Les corps viennent après eux.

    **Mais cette vie, pourtant une, se dit en plusieurs sens** selon les niveaux de réalité où on l'envisage : de l'Intellect à l'âme, puis au monde des corps, elle n'a pas {amber}le même degré de clarté, d'intensité et de puissance{/amber}. D'où la difficulté : {amber}__**si la vie se dit en plusieurs sens, comment maintenir son unité sans la réduire à une simple équivocité verbale ?**__{/amber} Il y a équivocité verbale quand un mot couvre des choses que rien ne relie, comme le {yellow}chien{/yellow}, l'animal et la constellation : le nom est commun par accident.

    **La réponse tient dans une** {violet}homonymie hiérarchique{/violet}**.** Les sens de la vie ne sont pas arbitrairement liés : ils sont organisés selon {coral}un rapport de modèle à image, de cause à effet{/coral}. Ils correspondent aux différents niveaux d'être de cette métaphysique {violet}gradualiste{/violet}, qui sont aussi des niveaux de vie et de pensée : {amber}tout ce qui existe est indissociablement vivant et pensant{/amber}.

    **La perspective habituelle s'en trouve inversée** : {green}la vie est d'abord spirituelle{/green}, {red}et non biologique{/red}, parce qu'elle exprime {coral}l'activité la plus haute qui soit, celle de l'Intellect{/coral}.

    ! Homonymie ne veut pas dire ici confusion de mots : c'est un ordre entre des réalités, où ce qui vient après tient son nom de ce qui vient avant.
  points:
