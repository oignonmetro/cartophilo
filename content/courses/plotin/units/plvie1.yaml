- id: plvie1-l2
  title: "Une notion centrale et paradoxale"
  notes: |-
    **La vie est chez Plotin une notion à la fois** {amber}centrale et transversale{/amber} : elle irrigue toute sa métaphysique. Elle y est aussi {amber}paradoxale{/amber} et {amber}difficile à saisir{/amber}.

    **Paradoxale, parce que le principe de la vie la reçoit.** L'{violet}âme{/violet} est définie comme {coral}principe de vie{/coral}, mais elle {coral}reçoit elle-même la vie d'un niveau supérieur{/coral}, l'Intellect, qui dépend à son tour d'un premier principe, l'Un. Un principe semble pourtant n'avoir rien à recevoir : comment ce qui donne la vie peut-il la tenir d'un autre ?

    **Difficile à saisir, parce que la vie n'est pas seulement homonyme, mais aussi** {violet}polysémique{/violet} : Plotin introduit en philosophie un sens nouveau du terme. Dans le traité *Sur l'éternité et le temps* (III, 7 [45]), {coral}l'éternité et le temps constituent respectivement la vie{/coral} ({blue}*zôè*{/blue}) {coral}de l'Intellect et de l'Âme{/coral}, c'est-à-dire {amber}la manière qu'ont ces principes de se manifester et d'exister{/amber}.

    **Ce sens nouveau engage une question sur l'existence que nous voulons mener**, notre {blue}*bios*{/blue}, notre genre de vie. Si le temps est la marque de ce qui nous fait passer d'un état de vie à un autre, {amber}__**quel type de vie faut-il choisir ?**__{/amber}
    - {red}vivre uniquement selon la modalité temporelle{/red} et changeante de notre existence ;
    - ou {green}remonter jusqu'à la vie même de l'Intellect, l'éternité{/green}, mode de vie stable et parfait.

    **L'enjeu est alors de savoir si ces sens se laissent réunir.** En les déclinant, Plotin veut-il faire de la vie {red}un terme strictement polysémique{/red}, ou invite-t-il à les articuler {green}pour dégager une signification unitaire{/green} ? La réponse passe par trois lieux : l'Intellect, foyer véritable de la vie, de l'être et de la pensée ; l'Âme, qui reçoit et transmet une vie dérivée ; enfin la vie comme puissance d'expansion et élan de retour vers l'origine.

    ! {blue}*Zôè*{/blue} désigne ici la vie d'un principe, sa manière d'être ; {blue}*bios*{/blue}, l'état ou le genre de vie.
