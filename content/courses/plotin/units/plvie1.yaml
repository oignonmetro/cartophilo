- id: plvie1-l5
  title: "La tension qui unifie : l'Intellect est la vie"
  notes: |-
    **La vie comme mouvement interne à la totalité de l'être transpose dans l'intelligible une théorie stoïcienne, celle de la** {violet}tension{/violet} ({blue}*tonos*{/blue}). Pour les {sky}stoïciens{/sky}, ainsi chez {sky}Cléanthe{/sky}, le {yellow}feu{/yellow} qui anime toute chose possède un {blue}*tonos*{/blue} qui agit dans les corps comme {amber}principe de cohésion et de mouvement{/amber}. Plotin {coral}dématérialise cette idée{/coral} : la vie devient {green}la tension spirituelle qui unifie l'Intellect et lui permet de penser les Formes{/green}.

    **Il retourne du même coup contre eux leur** {violet}sympathie universelle{/violet}. Les stoïciens affirment que tout ce qui est réel est corporel : ils ne peuvent donc saisir le sens véritable de la vie, car {coral}la séparation spatiale des parties d'un tout physique le rend susceptible de fragmentation{/coral} et {coral}le prive de l'immédiateté de l'unité véritable{/coral}. {yellow}Un corps peut toujours être coupé{/yellow} : une unité faite de parties placées les unes hors des autres reste précaire.

    **La vie est ainsi à la fois ce qui forme l'Intellect et ce qu'il est.** D'une part, elle est la réalité primordiale qui lui permet de se former ; d'autre part, l'Intellect est une réalité vivante, parce qu'il est {amber}une unité qui se multiplie et se déploie par division interne, tout en restant parfaitement identique à elle-même{/amber} dans son activité. On voit par là le rôle central de la triade que {sky}Pierre Hadot{/sky} a nommée {violet}« être-vie-pensée »{/violet}.

    **La vie n'est pas une Forme intelligible parmi d'autres, mais une** {violet}propriété catégoriale{/violet}**.** {red}L'Intellect n'__a__ pas la vie{/red}, comme une propriété à côté d'autres ; {green}il __est__ la vie{/green}, ce qui témoigne de son {amber}autonomie ontologique{/amber} : {teal}« {/teal}Ce qui {teal}vit par soi-même{/teal} et {teal}existe par soi-même{/teal} est {teal}l'être premier{/teal} et {teal}le premier vivant »{/teal} (IV, 7 [2], 9, 14-15).

    **Cette autonomie va avec la totalité** : l'Intellect est l'être le plus {violet}autarcique{/violet}, parce qu'il est une totalité parfaitement unifiée, qui {coral}coïncide immédiatement avec son objet{/coral}. Il n'a rien à chercher hors de lui, puisque ce qu'il pense, c'est lui-même.

    ! La tension est stoïcienne d'origine, mais elle n'a plus rien de corporel chez Plotin.
