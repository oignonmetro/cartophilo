  points:
  - id: g-theoria-l1-q1
    sentence: "La contemplation, vers laquelle tout tend selon Plotin, de la plante jusqu'à l'Intellect, se dit en grec translittéré ___."
    answer: theôria
    alt: ["theoria", "theôría"]
  - id: g-theoria-l1-q2
    sentence: "Le traité 30 s'ouvre sur un jeu : « Si nous commençons par nous amuser [...] en disant que toutes choses aspirent à la ___ » (chap. 1)."
    answer: contemplation
    alt: []
  - id: g-theoria-l1-q3
    sentence: "Le traité de Plotin intitulé *Sur la contemplation*, qui fait de la contemplation la fin de toutes choses, est le traité ___."
    answer: 30 (III, 8)
    alt: ["30", "III, 8"]
  - id: g-theoria-l1-q4
    sentence: "La nature répond à qui l'interroge : « Tu ne devrais pas poser de question mais comprendre toi aussi en ___ » (traité 30, chap. 4)."
    answer: silence
    alt: []
  - id: g-theoria-l1-q5
    sentence: "La nature ne fabrique pas : « c'est alors que je contemple que les contours des corps apparaissent, comme s'ils ___ de moi » (traité 30, chap. 4)."
    answer: tombaient
    alt: []
  - id: g-theoria-l1-q6
    sentence: "La nature produit « tout comme les ___ tracent leurs figures pendant qu'ils contemplent », sans tracer elle-même aucune figure (traité 30, chap. 4)."
    answer: géomètres
    alt: ["geometres"]
  - id: g-theoria-l1-q7
    sentence: "« Les hommes aussi, lorsque leur aptitude à contempler est affaiblie, font de leur action une ___ de contemplation et de raisonnement » (traité 30, chap. 4)."
    answer: ombre
    alt: []
  - id: g-theoria-l1-q8
    sentence: "« La production et l'action sont soit un affaiblissement, soit un ___ de la contemplation » (traité 30, chap. 4)."
    answer: accompagnement
    alt: []
  - id: g-theoria-l1-q9
    sentence: "L'action est un affaiblissement de la contemplation quand on ne peut rien contempler au-delà d'elle, et un accompagnement quand elle sert une vision plus ___."
    answer: haute
    alt: ["élevée", "elevee"]
  - id: g-theoria-l1-q10
    sentence: "« Car si l'on peut contempler le vrai, pourquoi se porter de préférence vers l'___ du vrai ? » (traité 30, chap. 4)."
    answer: image
    alt: []
  - id: g-theoria-l1-q11
    sentence: "Dans l'Intellect, contempler et ce qui est contemplé ne font qu'un : c'est « la contemplation ___, et non pas un objet de contemplation comme il y en a en autre chose » (traité 30, chap. 8)."
    answer: vivante
    alt: []
