id: g-theoria
title: Contemplation (`theôria`)
icon: book
color: coral
lessons:
- id: g-theoria-l1
  title: Contemplation
  notes: |-
    Chez Plotin, la {violet}**contemplation**{/violet} (*theôria*) est [def] ; l'action n'en est qu'une ombre. Elle n'est pas {pink}l'activité réservée du savant ou du sage{/pink}.

    __**Tout aspire à la contemplation.**__ Le [[traite30|traité 30]] s'ouvre sur une thèse qu'il présente d'abord comme un jeu : « Si nous commençons par nous amuser [...] en disant que __toutes choses aspirent à la contemplation__, que celle-ci est la fin vers laquelle toutes tournent leur regard », non seulement les êtres rationnels, mais aussi « la nature qui est dans les plantes et la terre qui les engendre » (chap. 1). Et le jeu lui-même le confirme : celui qui s'amuse contemple, ou du moins y aspire. **La contemplation n'est donc pas une activité parmi d'autres : c'est la fin de toutes.**

    __**La nature produit en contemplant.**__ La difficulté est de comprendre comment la [[g-phusis|nature]], qui ne raisonne ni ne se représente rien, pourrait contempler. Plotin la fait parler : « Tu ne devrais pas poser de question mais __comprendre toi aussi en silence__ » ; « ce qui naît, c'est le résultat de ce que je vois, en silence » (chap. 4). Elle ne fabrique pas : {yellow}« ce n'est pas alors que je trace des figures, mais c'est alors que je contemple que les contours des corps apparaissent, comme s'ils tombaient de moi »{/yellow}. {red}Un artisan calcule et manie des outils{/red} ; {green}la nature n'a qu'à être la raison qu'elle est{/green}, et les formes des corps en découlent. Sa contemplation est seulement plus obscure que celle de l'âme (voir [[g-degres-de-vie|degrés de vie]]).

    __**L'action est une ombre de la contemplation.**__ D'où un renversement de la hiérarchie habituelle : « les hommes aussi, __lorsque leur aptitude à contempler est affaiblie__, font de leur action une ombre de contemplation et de raisonnement » (chap. 4). On agit pour voir au-dehors ce qu'on ne parvient pas à voir en soi. Ainsi « la production et l'action sont soit __un affaiblissement, soit un accompagnement__ de la contemplation » : un affaiblissement quand on ne voit rien au-delà de l'action, un accompagnement quand elle sert une vision plus haute. « Car si l'on peut contempler le vrai, pourquoi se porter de préférence vers __l'image du vrai__ ? »

    __**Au sommet, une contemplation vivante.**__ À mesure qu'on monte, la contemplation se rapproche de ce qu'elle contemple ; dans l'{violet}[[g-intellect|Intellect]]{/violet}, les deux ne font plus qu'un : c'est « __la contemplation vivante__, et non pas un objet de contemplation comme il y en a en autre chose » (chap. 8), où contempler, penser et vivre coïncident (voir [[g-vie|vie]] et [[g-noesis|pensée]]).

    ! Plotin ne prête pas à la plante une conscience : sa contemplation est sans représentation ni raisonnement. Et il ne méprise pas l'action : il la juge à ce qu'elle cherche, et la tient pour un accompagnement quand elle naît d'une contemplation.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 30, chap. 1 | toutes choses aspirent à la contemplation |
    | traité 30, chap. 4 | la nature parle ; l'action, ombre de contemplation |
    | traité 30, chap. 8 | la contemplation vivante de l'Intellect |

    **Voir aussi** : [[g-phusis|Nature]] · [[g-intellect|Intellect]] · [[g-degres-de-vie|Degrés de vie]] · [[g-noesis|Pensée]] · [[traite30|Traité 30]]
