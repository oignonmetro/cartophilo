- id: traite9-l6
  title: "Le cercle, le chœur et la vie véritable"
  notes: |-
    **Les chapitres 7 à 9 reprennent le parcours de l'âme vers l'Un.**

    **Se préparer** (chap. 7) : l'âme doit être **sans forme**, comme une matière pure, pour accueillir la nature première ; ignorer les choses sensibles, puis les Formes et la connaissance intellectuelle, et enfin s'oublier elle-même. Comme **Minos**, « familier de Zeus », elle doit s'unir à l'Un pour l'annoncer aux autres. L'Un étant partout, il faut le chercher en nous-mêmes.

    **Le cercle et le centre** (chap. 8) : l'âme est comme un **cercle** qui tourne autour d'un centre, l'Un, centre de tout ; elle doit faire coïncider son centre avec ce centre. Elle n'est pas séparée de l'Un localement, comme les corps, mais par son **altérité** : **l'Un, sans altérité, est toujours présent ; nous ne lui sommes présents que sans altérité.**

    **Le chœur** (8, 37-45) : nous sommes toujours autour de lui, mais nous ne regardons pas toujours vers lui. Ainsi un chœur fait toujours cercle autour du **coryphée**, mais regarde parfois au-dehors ; tourné vers lui, il chante bien. Regardant vers l'Un, nous trouvons « notre fin et notre repos ».

    **La vie véritable** (chap. 9) : l'Un ne cesse de produire, comme le soleil la lumière, sans être diminué. Au contact de l'Un, l'âme est **fécondée** : elle engendre les vertus et la beauté.

    | Image | Amour pur | Amour perdu |
    | Aphrodite | céleste, tournée vers son principe | « vulgaire », comme si elle se prostituait |
    | la vierge | aime son père d'un bel amour | trompée par des promesses de mariage |

    « Toute âme est Aphrodite » (9, 30) : il faut fuir d'ici-bas et retrouver l'amour pur.

    ! L'âme n'a pas à se rapprocher de l'Un dans l'espace : elle est déjà autour de lui ; elle doit seulement se tourner vers lui en se défaisant de l'altérité.
  points:
  - id: traite9-l6-p1
    sentence: "Pour accueillir la nature première, l'âme doit, selon le traité 9 (chap. 7), être dépourvue de ___, comme une matière pure."
    answer: "forme"
