- id: traite9-l2
  title: "Tout être est un : ni l'Âme ni l'Intellect ne sont l'Un"
  notes: |-
    **« C'est en vertu de l'unité que tous les êtres sont des êtres »** (1, 1). Chaque chose, pour être, doit être une chose :

    - les choses faites d'éléments distincts : une **armée**, un chœur, un **troupeau** ;
    - les choses faites de parties qui forment un ensemble : une **maison**, un **navire** ;
    - les grandeurs continues, les corps des plantes et des animaux, l'âme.

    À perdre l'unité, une chose se **« fragmenterait »** et ne serait plus ce qu'elle est.

    **L'Âme n'est pas l'unité absolue** (1, 17-43), alors même qu'elle donne leur unité aux autres choses, pour deux raisons :

    | Raison | Ce qu'elle montre |
    | elle possède l'unité comme un attribut parmi d'autres | elle unifie « en regardant » autre chose, les Formes de l'Intellect |
    | elle comprend plusieurs « puissances » | elle est multiple |

    Contre la doctrine **stoïcienne** d'un seul principe divin qui anime et unifie tout, l'Âme n'est une qu'**« en vertu d'un autre »**.

    **L'Intellect n'est pas non plus l'Un** (chap. 2). La thèse de leur identité était sans doute défendue par **Origène**, condisciple de Plotin auprès d'**Ammonius** ; Plotin la fait remonter à **Aristote**, qui posait l'équivalence de l'être et de l'un (*Métaphysique*, Γ, 2) et faisait de l'intellect divin le principe du tout (Λ, 7-9). Mais l'Intellect et l'être sont multiples : l'Intellect contient les Formes, l'être comprend « vie et pensée ». Et **penser implique la distinction d'un sujet qui pense et d'un objet pensé**, une pluralité incompatible avec l'unité simple.

    ! L'Âme est ce qui donne le plus d'unité aux choses d'ici-bas ; elle n'en est pas moins une par participation, non l'unité elle-même.
