# t-6-9 de l'index.

id: traite9
title: "Traité 9 (VI, 9) : Sur le Bien ou l'Un"
subtitle: "Au-delà de l'Intellect, l'union avec l'Un"
icon: compass
color: sky
lessons:
- id: traite9-l1
  title: "Le premier traité systématique sur l'Un"
  notes: |-
    **Dans le traité 9, Plotin présente pour la première fois de manière systématique sa théorie du premier principe** : il faut admettre, au-delà du monde intelligible et de l'Intellect, une réalité absolument simple et rigoureusement « une ».

    **C'est l'innovation philosophique fondamentale de Plotin.** La tradition platonicienne précédente plaçait au principe de toutes choses un **Intellect « démiurgique »**, qui pense les Formes intelligibles, modèles éternels du monde sensible. C'est la **multiplicité des intelligibles** qui conduit Plotin à poser un principe antérieur et simple : **l'unité est toujours antérieure à la multiplicité qu'elle produit.**

    **Le titre**, probablement choisi par **Porphyre**, pose l'équivalence de l'Un et du Bien, selon l'usage de désigner le principe par ses attributs. Placé dans l'**ultime traité** de la dernière des *Ennéades*, il devait offrir un résumé systématique de la doctrine, et finir sur une exhortation à remonter jusqu'au principe pour s'y unir.

    **Deux parties inégales**, qui parcourent les mêmes étapes :

    | Partie | Chapitres | Ce qu'elle fait |
    | première | 1-4 | une première description de la « remontée » vers le principe |
    | seconde | 5-11 | la même description, reprise avec beaucoup plus de détails |

    Pierre **Hadot** l'a noté : ce procédé de **« reprise »** est habituel chez Plotin ; il permet de donner une première ébauche de solution, puis une solution plus approfondie.

    **Le traité 7 (V, 4) posait déjà la question** de l'origine de la multiplicité, mais sur le plan d'une explication conceptuelle ; le traité 9 précise la nature et le statut de l'Un. Il laisse sans réponse le pourquoi et le comment de la **procession**, auxquels sont consacrés les traités **10 (V, 1) et 11 (V, 2)**, qui forment avec lui une série presque unitaire.

    ! L'Un n'est pas l'Intellect suprême des médioplatoniciens porté au plus haut : il est au-delà de l'Intellect, parce que l'Intellect est déjà multiple.
