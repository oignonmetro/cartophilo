- id: traite9-l5
  title: "La causalité de l'Un : une unité qui n'est pas celle du point"
  notes: |-
    **La seconde partie (chap. 5-11) reprend l'enquête avec plus de détails.** Au chapitre 5, la structure du réel est réexaminée : ce qui ordonne les corps est l'Âme ; mais l'Âme raisonne au moyen des Formes et des vertus, qu'elle ne produit pas. Il faut donc l'**Intellect**, monde intelligible qui contient toutes les Formes (comme l'a montré le traité 5 (V, 9), chap. 5-9) ; mais il est déjà pluriel. D'où l'Un, source de l'Intellect et des formes.

    **Le nom d'« Un » n'attribue pas l'unité** : il indique l'unité indivisible du principe, qui n'est pas une unité mathématique ou géométrique (5, 38-46). **L'unité de l'Un n'est pas celle du point ni de la monade** (6, 1-7) : celles-ci sont des unités quantitatives, obtenues par division et soustraction ; l'Un est **illimité quant à sa puissance**.

    **L'Un est absolument autarcique** : sans lieu, sans temps, sans désir, sans volonté, sans pensée, car rien en lui n'est autre. Les choses engendrées, elles, ont besoin de lui et le désirent : **il est au-dessus du bien, mais il est le Bien pour les autres choses** (6, 37-42).

    **Est-il encore une cause ?** C'est le problème majeur des chapitres 5-6. « Ce qui est cause n'est pas identique à ce qui est causé » (6, 54-55).

    | Point de vue | L'Un |
    | le nôtre | une cause, puisque nous dérivons de lui |
    | le sien | pas une cause : il n'a aucun attribut |

    C'est le principe de **« non-réversibilité »** : nous sommes causés par l'Un, mais il ne nous cause pas à strictement parler. L'ambiguïté vient de Platon : les **Formes** sont causes du sensible tout en restant séparées de lui. L'Un produit sans désir, sans diminution, par sa **« surabondance »** (traités 10 et 11) ; dépourvu de pensée, il est la cause de la pensée comme sa **cause « finale »**.

    ! L'Un n'est pas « bon » pour lui-même : il est le Bien pour ce qui vient de lui et le désire.
  points:
