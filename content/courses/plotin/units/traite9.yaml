- id: traite9-l7
  title: "L'extase : fuir seul vers lui seul"
  notes: |-
    **La contemplation de l'Un est au-delà de la connaissance intellectuelle** (chap. 10). L'âme rencontre deux obstacles : elle est mêlée au corps, dont elle ne sort pas entièrement durant la vie mortelle ; et sa nature la fait raisonner **« par démonstrations et preuves »**. La vision de l'Un est une **union**, une « identification » : sujet et objet de la contemplation ne se distinguent plus. Comment parler de contemplation quand on se voit devenu la même chose que l'Un ? Seule l'image de **l'amant** en donne une idée.

    **Seul celui qui a contemplé comprend la contemplation** : comme dans les **Mystères**, les non-initiés ne le peuvent qu'à la faveur d'une expérience personnelle. Celui qui a vu en garde une **« image »**, une trace énigmatique que seuls les savants interprètent (chap. 11).

    **Ce n'est plus une contemplation, mais une « extase »** (11, 8-25) :

    - une **« simplification »** et une **« donation »** de soi ;
    - qui tend au contact, à la coïncidence et à l'union ;
    - un état de repos, sans besoin ni désir, comme celui qui entre dans un **sanctuaire** jusqu'à la partie la plus sacrée, où se trouve le dieu.

    **La fin** : l'âme qui descend parvient au mal, non au non-être absolu ; celle qui monte parvient à elle-même, et donc à lui, **« au-delà de la réalité »**. Elle atteint la « fin du voyage ». Si elle déchoit, la vertu la ramène à l'Intellect, et le savoir à lui.

    **« Telle est la vie que mènent les dieux et les hommes divins et bienheureux : être libéré des choses d'ici-bas, vivre sans trouver son plaisir dans les choses d'ici-bas, fuir seul vers lui seul. »** (11, 49-51)

    Plotin reprend cette promesse presque à l'identique dans le traité 49 (V, 3), 17 ; elle clôt le traité 9 et, dans l'édition de Porphyre, toutes les *Ennéades*.

    ! L'extase n'est pas une connaissance supérieure : c'est une sortie de soi où la distinction du connaissant et du connu disparaît.
