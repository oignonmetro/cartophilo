- id: traite9-l8
  title: "Repérage : le plan du traité 9"
  notes: |-
    **Le traité 9 parcourt deux fois la remontée vers l'Un : d'abord en esquisse (chap. 1-4), puis en détail (chap. 5-11).**

    | Moment | Lieu | Ce qui s'y joue |
    | tout être est un | chap. 1 | l'âme donne l'unité mais n'est pas l'unité |
    | l'unité au-delà de l'être | chap. 2 | ni l'être ni l'Intellect, multiples, ne sont l'Un |
    | l'Un, principe de toutes choses | chap. 3 | devenir un ; rien ne se prédique de lui |
    | au-delà de la science | chap. 4 | une présence supérieure à la science |
    | l'Un simple, principe de tout | chap. 5 | de l'Âme à l'Intellect, de l'Intellect à l'Un |
    | l'unité de l'Un | chap. 6 | ni point ni monade ; le Bien pour les autres |
    | se tourner vers soi | chap. 7 | l'âme sans forme ; Minos |
    | le cercle et le centre | chap. 8 | le chœur autour du coryphée |
    | la vie véritable | chap. 9 | Aphrodite céleste et vulgaire |
    | au-delà de la connaissance | chap. 10 | l'union, l'identification |
    | fuir seul vers lui seul | chap. 11 | l'extase ; la vie des dieux |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! Le chapitre 5 recommence au niveau de l'Âme : la seconde partie reprend toute la remontée, elle ne poursuit pas la première.
