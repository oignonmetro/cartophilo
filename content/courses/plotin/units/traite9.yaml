- id: traite9-l3
  title: "L'Un au-delà de tout, et le Parménide"
  notes: |-
    **Le principe véritablement premier est donc au-delà de l'Âme et de l'Intellect, c'est-à-dire au-delà de toute réalité existante et intelligible.** Pur et simple, il n'a ni forme ni figure, et aucun prédicat ne peut être prédiqué de lui (chap. 3-4).

    - **Il est difficile de le connaître et d'en parler** : le discours rationnel repose sur les rapports entre les formes intelligibles, et l'Un est au-delà des formes et de l'être.
    - **Il ne laisse aucune empreinte dans l'âme** : si la connaissance est l'empreinte de l'objet dans l'âme (Aristote, *De l'âme*, III, 4), ce qui est « sans forme » reste inconnaissable.
    - **Il précède toutes choses**, donc ne coïncide avec aucune : **« il n'est même pas »** (3, 38), il n'est ni qualité, ni quantité, ni Intellect, ni Âme, ni en mouvement, ni en repos, ni dans un lieu, ni dans le temps.

    **Cette détermination négative est une interprétation très originale** du *Parménide*, adoptée ensuite par les écoles néoplatoniciennes, et que le traité 10 (V, 1), 8 reprendra en détail :

    | Hypothèse du *Parménide* | Formule | Réalité |
    | première (137c-142a) | l'Un au sens propre | l'Un, qui n'est pas et ne peut être connu |
    | deuxième (144e) | l'« un-plusieurs » | l'Intellect, unité organique |
    | troisième (155e) | l'« un et plusieurs » | l'Âme, qui ne garde qu'une image de l'unité |

    Plotin pense ainsi trouver chez Platon la justification d'un premier principe **inconnaissable, indicible et, finalement, inexistant**, comme le bien de la *République* (VI, 509b), au-delà de la réalité.

    ! « Il n'est même pas » ne veut pas dire que l'Un n'est rien : il est au-delà de l'être, parce qu'il le précède et l'engendre.
  points:
  - id: traite9-l3-p1
    sentence: "Parce qu'il est l'Un pur et simple, le premier principe ne possède, pour le traité 9, ni ___ ni figure."
    answer: "forme"
    alt: []
