- id: traite9-l4
  title: "Théologie négative : un discours qui indique le chemin"
  notes: |-
    **Nous parlons pourtant de l'Un**, ne serait-ce qu'en le nommant « Un » ou en disant qu'il est « sans forme ». On n'use alors que d'un procédé **négatif** : dire ce qu'il n'est pas. Ce procédé, celui de la **« théologie négative »**, est le seul qui convienne à la supériorité de l'Un.

    - Plotin y avait brièvement recours dans le traité 7 (V, 4), 1 ; **c'est dans le traité 9 qu'il en use comme d'une véritable méthode**.
    - Le traité 38 (VI, 7), 36 dira qu'elle seule peut « nous instruire » sur l'Un, sans permettre de le décrire ni de l'atteindre.

    **Tout discours sur l'Un est d'abord un discours sur nous-mêmes** (fin du chap. 3) : nous exprimons nos propres affections lorsque nous percevons les effets de son action. **« Dire que l'Un est une cause, ce n'est pas lui donner un attribut à lui, mais plutôt à nous »** (3, 49-50). Il ne faudrait dire ni « lui » ni « est ».

    **Ce n'est donc pas une description, mais une exhortation** : « l'enseignement ne peut indiquer que la route et le chemin » (4, 15) ; la contemplation revient à celui qui veut contempler. Platon disait qu'on ne peut ni « parler » ni « écrire » de l'Un.

    **La saisie de l'Un ne se fait ni par la science ni par l'intellection**, mais par **« une présence qui est supérieure à la science »** (4, 3). La science est un discours, et le discours est multiple : l'âme qui sait tombe dans le nombre. Il faut donc :

    1. abandonner la connaissance sensible et s'élever à l'Intellect, purifiée ;
    2. **« devenir un »**, de plusieurs que nous étions (3, 21-22), et devenir Intellect ;
    3. **s'élancer au-delà de la science**, et même du beau, qui vient de l'Un comme la lumière du jour vient du soleil.

    L'âme trouve alors, au lieu d'un objet, sa réalité la plus intime, comme **l'amant qui, en regardant l'objet de son amour, trouve son repos en lui**.

    ! La théologie négative n'est pas une voie de connaissance qui atteindrait l'Un : elle prépare seulement à une présence qui n'est plus connaissance.
