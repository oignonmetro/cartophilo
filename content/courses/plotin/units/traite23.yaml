- id: traite23-l4
  title: "La matière auprès des formes, l'Éros à la porte"
  notes: |-
    **La participation de la matière aux formes confirme la thèse** (chap. 8). Il faut refuser l'idée que les formes occupent **un lieu séparé**, d'où l'illumination viendrait de loin sur la matière : que signifieraient ici le « loin » et le « séparé » ?

    - On parle d'**illumination** parce que les choses dans la matière sont des images dont les idées sont les modèles ; mais l'image de la lumière sensible fait croire à une séparation.
    - Il faut aussi refuser que la forme soit vue dans la matière **comme si elle se reflétait dans de l'eau** (8, 15-17). La matière se tient, par la totalité d'elle-même, auprès de la Forme, et **en saisit ce qu'elle peut** ; rien n'est entre elles.
    - **L'idée du feu** ne se trouve pas dans la matière : elle donne la figure du feu à toute la matière enflammée, sans rien donner d'elle-même. Une seule cause produit la sphère entière (chap. 9) : **une seule vie, une seule âme**, unique et illimitée.

    **L'Éros du Banquet** (chap. 10) : l'un véritable reste en lui-même ; ce sont les autres choses qui se suspendent à lui, par leur désir. Voilà l'amour **« qui veille à la porte »** (*Banquet*, 203c-d) : **l'amoureux d'ici-bas possède la beauté non en la recevant, mais en restant auprès d'elle.**

    **La réflexion est commune** : « la réflexion est quelque chose de commun », disait Héraclite ; nous ne la recevons pas par parties. Les **assemblées** en donnent l'image : chacun y a une faible part, mais rassemblés, ils la font apparaître. Nos intellects nous paraissent séparés, comme si, **touchant une même chose avec plusieurs doigts**, on croyait toucher des choses différentes.

    **Une puissance illimitée** (chap. 11) : l'intelligible n'est pas comme une pierre ; il est hors du temps, et l'éternité domine le temps, comme un point autour duquel court une ligne.

    ! L'illumination et le reflet dans l'eau sont des images trompeuses si elles font croire que l'intelligible est loin : il n'est ni éloigné des corps, ni à eux.
