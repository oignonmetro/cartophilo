- id: traite23-l3
  title: "Nous devenons les intelligibles"
  notes: |-
    **Thèse du chapitre 7 : nous ne recevons pas les intelligibles, nous sommes en eux.** Nous remontons vers l'être et nous élevons vers l'Un ; nous intelligeons les intelligibles **sans passer par des images ou des empreintes** : nous devenons les intelligibles. Et puisque les autres aussi les deviennent, **« nous sommes donc à la fois toutes choses et une seule »** (7, 8).

    **Pourquoi l'ignorons-nous ?** Nous ne regardons pas ce dont nous dépendons : nous avons **plusieurs visages tournés vers l'extérieur, attachés à une tête tournée vers l'intérieur**. Il faut se retourner, de son propre chef, ou comme Achille dans l'*Iliade* (I, 194-200), qui eut **les cheveux tirés par Athéna** : on verra alors dieu, soi-même et l'univers. Faute de trouver un point où dire « jusque-là c'est moi », on ira soi-même vers l'univers entier.

    **L'exhortation finale** (chap. 12) : quand tu rejettes ta « grandeur déterminée », **tu deviens tout ; en vérité, tu l'étais déjà**. Ce qui s'est ajouté au tout vient **du non-être** : on devient tout quand on rejette le non-être. **« Ce n'est pas le tout qui vient à toi afin de t'être présent, mais c'est toi qui t'éloignes du tout »** (12, 25-27), en te tournant vers son contraire.

    Ainsi les autres dieux n'apparaissent souvent qu'à une seule personne : ceux qui, « présentant mille formes, parcourent les villes » (Homère, *Odyssée*, XVII, 486). Mais tout se tourne vers le dieu qui est partout par lui-même.

    ! Se tourner vers l'intelligible n'est pas l'atteindre au loin : il est déjà présent, et c'est nous qui nous détournons de lui.
