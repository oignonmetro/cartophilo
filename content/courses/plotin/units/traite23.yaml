- id: traite23-l2
  title: "L'unité véritable reste en elle-même"
  notes: |-
    **L'être qui est réellement ne sort pas de lui-même** (chap. 3) : s'il était en autre chose, il ne serait ni en lui-même ni **impassible**. D'où la définition de la participation : **« reste donc à dire qu'il ne se trouve en aucune chose, mais que ce sont les autres choses qui en participent »**, toutes celles qui le peuvent et dans la mesure où elles le peuvent (3, 13-15). Ou bien l'on nie qu'une telle nature existe, ou bien il faut accepter qu'elle reste entière partout.

    **L'argument de dieu** (chap. 4) : tous ceux qui ont une notion des dieux les estiment présents partout. Divisé, dieu ne serait plus partout, ni un ; il deviendrait un corps. **Croire en dieu va de pair avec croire que la même chose est partout entière à la fois** (4, 11-12). Et cette nature est **illimitée** parce qu'elle ne fait jamais défaut.

    **Les rayons et le centre** (chap. 4-5) : ce qui vient après l'Un gravite autour de lui, comme les rayons d'une sphère rattachés à un seul centre ; là où sont les troisièmes, les deuxièmes et les premières sont présentes. Mais **mise en garde** : c'est « à des fins de clarté » que le discours emploie l'image de plusieurs rayons venant d'un seul centre. Il ne faut pas imaginer les lignes séparées : dans l'intelligible, sans dimensions, **les centres convergent en un seul**.

    **Le multiple est dans l'un** (chap. 6) : les intelligibles sont uns tout en étant multiples. L'homme intelligible, descendu dans tel homme, devient cet homme en restant l'homme intelligible : la multiplicité **se presse autour** de l'intelligible.

    ! L'image du cercle et de ses rayons est trompeuse si l'on se représente des rayons qui quittent le centre : ils n'en sont jamais séparés.
