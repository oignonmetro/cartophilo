- id: traite23-l5
  title: "Repérage : le plan du traité 23"
  notes: |-
    **Le traité 23 donne les trois dernières explications (chap. 1-7, 8-10, puis 11-12) et finit sur une exhortation.**

    | Moment | Lieu | Ce qui s'y joue |
    | le dieu partout | chap. 1 | une notion commune |
    | les principes propres de l'intelligible | chap. 2 | ne pas raisonner à partir des corps |
    | l'unité véritable reste en elle-même | chap. 3 | les autres choses en participent |
    | croire en dieu | chap. 4 | la même chose partout entière |
    | le cercle et ses rayons | chap. 5 | une mise en garde |
    | un et multiple | chap. 6 | la multiplicité se presse autour de lui |
    | nous devenons les intelligibles | chap. 7 | Athéna tire Achille par les cheveux |
    | la matière et les formes | chap. 8 | ni séparation locale, ni reflet dans l'eau |
    | une seule vie, l'Éros à la porte | chap. 9-10 | l'un reste en lui-même |
    | la puissance illimitée | chap. 11 | l'éternité et le temps |
    | rejeter le non-être | chap. 12 | c'est nous qui nous éloignons du tout |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! Le traité 23 finit comme une exhortation : se dépouiller du non-être qui s'ajoute à nous.
