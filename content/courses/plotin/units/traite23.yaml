id: traite23
title: "Traité 23 (VI, 5) : Sur la raison pour laquelle l'être, un et identique, est partout tout entier II"
subtitle: "Nous sommes les intelligibles"
icon: compass
color: sky
lessons:
- id: traite23-l1
  title: "Le dieu partout : une notion commune"
  notes: |-
    **Le traité 23 part d'une « notion commune » : tous les hommes, par une inclination naturelle, disent que le dieu est en chacun de nous, un et identique** (1, 1-4). Tant qu'on ne leur demande pas comment, ils s'en tiennent là : **« c'est bien là le principe le plus solide de tous »** (1, 8), expression qui rappelle Aristote (*Métaphysique*, Γ, 3).

    Ce principe vient avant celui qui dit que toutes choses désirent le bien : **toutes choses s'élancent vers l'Un**, et le bien, pour une nature une, c'est de s'appartenir, **c'est d'être une** (1, 19-20). Il ne faut donc pas chercher le bien à l'extérieur, dans le non-être : le bien est dans l'être, et **« nous ne sommes donc pas séparés de l'être, mais nous sommes en lui »** (1, 25-26).

    **Pourquoi la raison en doute-t-elle ?** (chap. 2) Parce qu'elle n'est pas une, mais divisée ; elle choisit ses principes **parmi les corps**, et divise donc la réalité.

    | L'unité d'ici-bas | L'unité de là-bas |
    | transportée, transformée, divisée en chaque lieu | un être identique, qui ne naît ni ne périt |
    | à nommer « devenir » | qui n'a ni emplacement, ni lieu, ni siège |
    | raisonnements vraisemblables | principes propres à l'intelligible |

    Sur l'intelligible, il faut raisonner **à partir de l'intelligible lui-même**, en partant de la question « qu'est-ce que c'est ? ».

    ! La notion commune ne suffit pas : c'est la raison qui l'ébranle, faute de raisonner sur l'intelligible avec les principes qui lui sont propres.
