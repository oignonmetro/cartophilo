  - id: g-suicide-l1-q1
    sentence: "Le suicide, la « sortie » de la vie qui donne son titre au traité 16, se dit en grec translittéré ___."
    answer: exagôgê
    alt: ["exagoge", "exagôgè"]
  - id: g-suicide-l1-q2
    sentence: "« Tu n'expulseras pas ton âme du corps, pour éviter qu'elle ne sorte du corps ; car ainsi, elle partira en amenant quelque ___ » (traité 16, chap. 1)."
    answer: chose
    alt: []
  - id: g-suicide-l1-q3
    sentence: "Dans la mort naturelle, « l'âme attend que le corps se ___ entièrement d'elle » (traité 16, chap. 1)."
    answer: sépare
    alt: ["separe"]
  - id: g-suicide-l1-q4
    sentence: "Le corps se sépare de l'âme quand il ne peut plus la lier, « car l'___ au moyen de laquelle il tenait l'âme n'existe plus » (traité 16, chap. 1)."
    answer: harmonie
    alt: []
  - id: g-suicide-l1-q5
    sentence: "Celui qui se tue « ne le fait pas sans passion, mais il agit sous l'effet de l'angoisse, douleur ou ___ » (traité 16, chap. 1)."
    answer: colère
    alt: ["colere"]
  - id: g-suicide-l1-q6
    sentence: "« Si le temps accordé à chacun est fixé par le ___, le prévenir n'est pas une bonne chose » (traité 16, chap. 1)."
    answer: destin
    alt: []
  - id: g-suicide-l1-q7
    sentence: "« Il ne faut pas se suicider tant que la possibilité de ___ existe » (traité 16, chap. 1)."
    answer: progresser
    alt: []
  - id: g-suicide-l1-q8
    sentence: "« Il faut, tant que nous avons un corps, rester dans les ___ que nous a préparées une âme qui est bonne » (traité 33, chap. 18)."
    answer: maisons
    alt: []
  - id: g-suicide-l1-q9
    sentence: "Le sage qui devient fou « rangerait le suicide parmi les choses ___ qu'il convient d'accepter dans certaines circonstances » (traité 16, chap. 1)."
    answer: nécessaires
    alt: ["necessaires"]
  - id: g-suicide-l1-q10
    sentence: "Au captif, « \"devant toi\" s'ouvre \"la voie\" pour partir, s'il n'est plus possible d'être ___ » (traité 46, chap. 7)."
    answer: heureux
    alt: []
  - id: g-suicide-l1-q11
    sentence: "Le traité de Plotin que Porphyre intitule *Sur le suicide raisonnable* est le traité ___."
    answer: 16 (I, 9)
    alt: ["16", "I, 9"]
  - id: g-suicide-l1-q12
    sentence: "Plotin dit à Porphyre que son désir de se tuer « résultait non d'une disposition de l'intellect, mais d'une maladie due à la ___ » (Porphyre, Vie de Plotin, 11)."
    answer: mélancolie
    alt: ["melancolie"]
