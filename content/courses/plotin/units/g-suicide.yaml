lessons:
- id: g-suicide-l1
  title: Suicide
  notes: |-
    Chez Plotin, le {violet}**suicide**{/violet} (*exagôgê*, la « sortie » de la vie) est [def]. Ce n'est pas {pink}la conséquence logique d'une mort qui serait un bien{/pink}.

    __**Si la mort est un bien, pourquoi ne pas partir ?**__ La difficulté est réelle. Plotin dit que la [[g-mort|mort]] est « plutôt un bien », et les stoïciens admettaient que le sage se donne la mort « en un geste de raison » : c'est le {violet}**« suicide raisonnable »**{/violet} qui donne son titre au [[traite16|traité 16]]. Plotin ne répond pas en revenant sur la valeur de la mort, mais {coral}en regardant la manière dont l'âme sort{/coral}.

    __**Sortir par la**__ {violet}__**violence**__{/violet}__**, c'est emporter la passion.**__ « Tu n'expulseras pas ton âme du corps, pour éviter qu'elle ne sorte du corps ; car ainsi, elle partira __en amenant quelque chose__ » ([[traite16|traité 16]], chap. 1). Dans la mort naturelle, « l'âme attend que __le corps se sépare__ entièrement d'elle » : il la lâche quand « l'harmonie au moyen de laquelle il tenait l'âme n'existe plus ». Celui qui se tue, au contraire, « a eu recours à la violence » et « il ne le fait pas sans passion, mais il agit __sous l'effet de l'angoisse, douleur ou colère__ ». Pourquoi est-ce grave ? Parce que **l'âme sort marquée par cette passion**. {red}Le suicide sépare l'âme du corps au moyen d'une passion du corps{/red}, alors que la [[g-katharsis|purification]] l'en sépare en la délivrant des passions : c'est le contraire de ce qu'il prétend faire.

    __**Un cas : la mélancolie de Porphyre.**__ Porphyre raconte qu'il songea un jour à se tuer, et que Plotin vint le trouver : « il me dit que ce désir résultait __non d'une disposition de l'intellect, mais d'une maladie__ due à la mélancolie, et il me prescrivit de m'en aller » (Porphyre, *Vie de Plotin*, 11). {coral}Le désir de mourir n'était pas un jugement de l'âme, mais une affection du corps{/coral} : c'est exactement ce que l'âme emporterait en partant. Plotin ne réfute pas Porphyre, il le soigne ; Porphyre partit pour la Sicile, et fut « ainsi délivré du désir de [se] supprimer ».

    __**Le temps fixé, et le progrès encore possible.**__ Deux raisons s'ajoutent. « Si le temps accordé à chacun __est fixé par le destin__, le prévenir n'est pas une bonne chose. » Surtout, « __si enfin le rang qui est celui de chaque homme là-bas dépend de l'état dans lequel on est quand on sort de son corps__, il ne faut pas se suicider __tant que la possibilité de progresser existe__ » (chap. 1). Ce qui compte n'est pas de sortir, mais dans quel état on sort ; et tant qu'on vit, on peut s'améliorer (voir [[g-daimon|démon]]). {yellow}« Il faut, tant que nous avons un corps, rester dans les maisons que nous a préparées une âme qui est bonne »{/yellow} ([[traite33|traité 33]], chap. 18).

    __**Les exceptions.**__ Si le sage s'aperçoit qu'il devient fou, « il rangerait le suicide parmi les choses nécessaires qu'il convient d'accepter dans certaines circonstances, __même s'il ne faut pas l'accepter en général__ » ([[traite16|traité 16]], chap. 1). Et s'il est emmené captif, « "devant toi" s'ouvre "la voie" pour partir, __s'il n'est plus possible d'être heureux__ » ([[traite46|traité 46]], chap. 7). Pourquoi ces deux cas ? {green}Ils ont en commun que l'âme ne peut plus vivre sa vie propre{/green} : la folie ôte la possibilité de progresser, la captivité celle d'être [[g-bonheur|heureux]]. Ce qui justifie la sortie est encore l'état de l'âme.

    | Cas | Ce qu'en dit Plotin |
    | fuir une douleur, une angoisse, une colère | non : l'âme partirait chargée de passion |
    | tant qu'on peut encore progresser | non : il faut rester dans la maison |
    | le sage qui devient fou | oui, comme une chose nécessaire |
    | le captif qui ne peut plus être heureux | la voie est ouverte |

    ! Plotin ne refuse pas le suicide au nom de la vie du corps, qui compte peu pour lui : il le refuse au nom de l'âme et de l'état dans lequel elle sortirait.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 16, chap. 1 | l'âme chassée part en emportant quelque chose |
    | traité 33, chap. 18 | rester dans la maison tant qu'on a un corps |
    | traité 46, chap. 7 | la voie est ouverte au captif qui ne peut plus être heureux |
    | *Vie de Plotin*, 11 | le désir de mourir de Porphyre, une maladie |

    **Voir aussi** : [[g-mort|Mort]] · [[g-katharsis|Purification]] · [[g-bonheur|Bonheur]] · [[g-daimon|Démon]] · [[traite16|Traité 16]]
