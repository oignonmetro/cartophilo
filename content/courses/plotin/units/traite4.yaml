- id: traite4-l2
  title: "Une et multiple : les degrés d'unité"
  notes: |-
    Au *Timée*, Plotin ajoute une expression du *Parménide* (155e5), qui caractérise ce qu'on appelle la **troisième hypothèse** du dialogue (155e3-157b4), laquelle correspond, dans son interprétation, à l'Âme : l'âme est **une et multiple** à la fois.

    **Le chapitre 2 le précise par une analyse dichotomique** : l'âme n'est pas plus absolument divisible qu'absolument indivisible. Elle ne perd pas son unité en multipliant son activité dans les corps ; mais elle n'est pas absolument une, comme une réalité qui ne serait qu'un point. Ce privilège, la fin du traité (si la dernière phrase est authentique) le réserve à **« ce qui est le plus élevé »**, le principe dont l'âme est issue : l'**Intellect**.

    **Plotin introduit ainsi un double critère, la divisibilité et la multiplicité**, qui permet à la fois de distinguer et de comparer les niveaux de réalité :

    | Niveau | Unité |
    | le principe dont l'âme est issue | un |
    | l'âme | une et multiple |
    | ses produits | multiplicité |

    Les traités ultérieurs compliqueront cette hiérarchie, en plaçant au sommet un principe plus éminent encore, **l'Un**, mais garderont le double critère : **ce qui distingue toutes les réalités, ce sont leurs degrés d'unité**.

    ! Dans le traité 4, le principe un placé au-dessus de l'âme est l'Intellect ; l'Un, au-delà de lui, n'apparaîtra qu'ensuite.
  points:
  - id: traite4-l2-p1
    sentence: "Au *Timée*, Plotin ajoute dans le traité 4 une expression du ___ de Platon (155e5) pour dire que l'âme est une et multiple."
    answer: "Parménide"
    alt: ["Parmenide"]
  - id: traite4-l2-p2
    sentence: "L'expression du *Parménide* reprise par le traité 4 caractérise la ___ hypothèse du dialogue (155e3-157b4), qui correspond pour Plotin à l'Âme."
    answer: "troisième"
    alt: ["troisieme", "3e"]
  - id: traite4-l2-p3
    sentence: "Pour le traité 4 de Plotin, l'âme est à la fois une et ___ : elle ne perd pas son unité en multipliant son activité dans les corps."
    answer: "multiple"
    alt: []
  - id: traite4-l2-p4
    sentence: "La démonstration, au chapitre 2 du traité 4, que l'âme n'est ni seulement divisible ni seulement indivisible est une analyse ___."
    answer: "dichotomique"
    alt: []
  - id: traite4-l2-p5
    sentence: "Le privilège d'être absolument un et indivisible, la fin du traité 4 le réserve à « ce qui est le plus élevé », c'est-à-dire l'___."
    answer: "Intellect"
    alt: []
  - id: traite4-l2-p6
    sentence: "Le double critère introduit par le traité 4 pour distinguer et comparer les niveaux de réalité associe la divisibilité et la ___."
    answer: "multiplicité"
    alt: ["multiplicite"]
  - id: traite4-l2-p7
    sentence: "Pour Plotin, ce qui distingue entre elles toutes les réalités, ce sont les différents ___ d'unité en quoi chacune consiste."
    answer: "degrés"
    alt: ["degres"]
  - id: traite4-l2-p8
    sentence: "Les traités ultérieurs placeront au sommet de la hiérarchie, au-dessus même de l'Intellect, l'___."
    answer: "Un"
    alt: ["l'Un"]
- id: traite4-l3
  title: "Repérage : le plan du traité 4"
  notes: |-
    **Le traité 4 est court : deux chapitres.** Le premier établit que l'âme est une réalité intermédiaire, le second le démontre par l'absurde, hypothèse après hypothèse.

    | Moment | Lieu | Ce qui s'y joue |
    | rappel du traité 2 | 1, 1-10 | l'âme est une réalité divine et intelligible |
    | le sensible est divisé | 1, 11-17 | les corps se divisent |
    | l'intelligible est indivisible | 1, 17-29 | l'intelligible ne se divise pas |
    | la réalité intermédiaire | 1, 29-41 | l'âme, à la fois indivisible et divisible |
    | indivisible en soi | 1, 41-45 | l'âme en elle-même |
    | divisible dans les corps | 1, 45-76 | l'âme présente aux corps |
    | si l'âme était seulement divisible | 2, 5-35 | l'hypothèse est impossible |
    | si l'âme était seulement indivisible | 2, 35-39 | l'hypothèse adverse est impossible |
    | conclusion | 2, 39-49 | l'âme est à la fois divisible et indivisible |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! Le premier chapitre va du divisé (le sensible) à l'indivisible (l'intelligible), avant de placer l'âme entre les deux.
  points:
  - id: traite4-l3-p1
    sentence: "Le traité 4 de Plotin compte ___ chapitres."
    answer: "deux"
    alt: ["2"]
  - id: traite4-l3-p2
    sentence: "Dans le traité 4 de Plotin, la thèse de l'âme comme réalité intermédiaire, à la fois indivisible et divisible, se trouve en ___."
    answer: "1, 29-41"
    alt: []
  - id: traite4-l3-p3
