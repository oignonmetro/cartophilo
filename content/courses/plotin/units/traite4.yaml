id: traite4
title: "Traité 4 (IV, 2) : Sur la réalité de l'âme I"
subtitle: "L'âme, à la fois divisible et indivisible"
icon: compass
color: sky
lessons:
- id: traite4-l1
  title: "Une réalité intermédiaire : le mélange du Timée"
  notes: |-
    **Le traité 4 poursuit la conclusion du traité 2 en proposant une définition de l'âme** : une réalité indivisible, incorruptible et immortelle.

    L'autorité invoquée est le *Timée* : **l'artisan divin y engendre l'âme du monde à partir d'un mélange « entre la réalité indivisible et qui reste toujours la même et la réalité divisible qui devient dans les corps » (35a1-3)**. Cette formule permet d'expliquer comment l'âme, sans être corporelle ni divisible comme les corps, est pourtant **divisible d'une manière autre que quantitative**, qui lui permet d'être présente dans tous les corps.

    | L'âme est | En tant que |
    | indivisible | elle n'est pas une quantité étendue et corporelle |
    | divisible | elle exerce son activité dans des corps distincts, multiples et séparés |

    **L'âme est donc une réalité intermédiaire** : intelligible, mais capable de se porter jusqu'à ses produits sensibles pour les informer, les ordonner et leur donner vie.

    - C'est ce que précisera le chapitre unique que **Porphyre** a isolé pour en faire le premier traité de la quatrième Ennéade : le traité 21 (IV, 1), *Sur la réalité de l'âme II*.
    - Ce chapitre était sans doute le dernier mot d'un texte qui rassemblait, à sa rédaction, les traités **2, 4 et 21**.

    ! « Divisible » ne veut pas dire étendue : l'âme se divise par son activité dans les corps, non comme une quantité.
  points:
  - id: traite4-l1-p1
    sentence: "Le traité 4 de Plotin, *Sur la réalité de l'âme I*, est la suite du traité ___ (IV, 7), dont il poursuit la conclusion."
    answer: "2"
    alt: []
  - id: traite4-l1-p2
    sentence: "Pour définir l'âme, le traité 4 de Plotin s'appuie sur l'autorité du ___ de Platon, où l'artisan divin engendre l'âme du monde par un mélange."
    answer: "Timée"
    alt: ["Timee"]
  - id: traite4-l1-p3
    sentence: "Dans le *Timée* (35a1-3), l'âme du monde est engendrée d'un mélange « entre la réalité indivisible et qui reste toujours la même et la réalité ___ qui devient dans les corps »."
