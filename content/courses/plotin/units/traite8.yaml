id: traite8
title: "Traité 8 (IV, 9) : Si toutes les âmes n'en sont qu'une"
subtitle: "Une seule âme, plusieurs vivants"
icon: compass
color: sky
lessons:
- id: traite8-l1
  title: "Homogénéité ou unité de l'âme : une thèse audacieuse"
  notes: |-
    **Après les traités 2 (IV, 7), 4 (IV, 2) et 6 (IV, 8), le traité 8 examine de nouveau l'unité de l'âme**, question classique de toutes les « psychologies » anciennes : l'âme, qui exerce des fonctions distinctes, est-elle une multiplicité ou une unité ? Et quelle unité ?

    **Plotin mène deux arguments à la fois :**

    | Argument | Ce qu'il soutient | Statut |
    | l'homogénéité de l'âme | l'âme de l'univers et celles des vivants sont de même nature | thèse platonicienne, lieu commun |
    | l'unité de toutes les âmes | « mon âme, ton âme et toutes les âmes n'en sont qu'une » (1, 6) | thèse novatrice, propre à Plotin |

    **Les rappels sont scolaires** : le traité 2 a réfuté les stoïciens, pour qui l'âme est un corps, et dénoncé les ambiguïtés de la définition aristotélicienne de l'âme comme **« entéléchie »** du corps. L'âme est sans grandeur, indivisible, et ne connaît la multiplicité que parce qu'elle exerce ses facultés dans des corps divisés.

    **La thèse audacieuse vient ensuite.** Pour les dialogues de Platon et leurs interprètes, l'âme est une réalité générique qui embrasse des individus homogènes ; Plotin objecte que la diversité des âmes n'est qu'**apparente ou circonstancielle** : c'est une seule et même âme qui se manifeste de différentes manières.

    **Elle a un précédent : la doctrine stoïcienne** de l'unité et de la cohérence de l'univers. Plotin retient l'hypothèse de la **sympathie universelle**, mais la rapporte à une réalité psychique unique, cause de l'existence et de l'ordre de l'univers et de tous ses vivants. La diversité des facultés de l'âme est la cause de la multiplicité des formes de vie.

    ! L'unité des âmes n'est pas leur ressemblance : des âmes homogènes seraient plusieurs âmes de même nature ; Plotin dit qu'il n'y en a qu'une.
