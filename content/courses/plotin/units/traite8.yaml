- id: traite8-l4
  title: "Justification : le sceau et la science"
  notes: |-
    **Les chapitres 4 et 5 justifient la thèse.** De quelle façon l'âme est-elle une ? Parce que toutes viennent d'une seule âme, ou parce que toutes n'en sont qu'une ? Plotin en appelle au dieu pour qu'il vienne en aide (4, 7), puis pose qu'il doit y avoir **une âme antérieure** d'où viennent les autres.

    **L'unité vient de la provenance** (chap. 4). Si l'âme était un corps, les âmes en seraient des parties ; si elle était **« homéomère »**, elles différeraient par leurs masses. Mais l'âme est **incorporelle** et c'est une réalité : une même âme subsiste dans une pluralité de corps, et avant elle une autre, qui n'est dans aucun corps, et dont elle est **l'image partout répétée**, **« comme si plusieurs morceaux de cire recevaient l'empreinte d'une seule bague »** (4, 19-20).

    **La comparaison de la science** (5, 7-28), que Plotin reprendra souvent, est déterminante :

    | La science | L'âme |
    | forme un tout, et reste un tout dans chacune de ses parties | se donne à toutes choses en restant une |
    | la partie dont on se sert est en acte, les autres sont en puissance | là-bas, toutes les parties sont en acte en même temps |
    | un théorème isolé serait comme les propos d'un enfant | aucune âme n'est coupée des autres |

    Le **géomètre**, dans son analyse, montre qu'une proposition contient toutes les autres, celles qui la précèdent et celles qu'elle engendre. Si nous restons incrédules, c'est par **faiblesse**, parce que le corps obscurcit tout.

    **Reste une ambiguïté** : les âmes individuelles viennent de l'âme du monde, issue elle-même de l'**Âme « hypostase »**, qui demeure dans l'intelligible. Comment procèdent-elles de l'âme du monde sans en être distinctes ? Les traités ultérieurs devront s'y mesurer.

    ! Le sceau et la science ne disent pas la même chose : le premier fonde l'unité sur l'origine commune, la seconde sur la présence du tout dans chaque partie.
