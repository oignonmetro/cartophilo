- id: traite8-l5
  title: "Repérage : le plan du traité 8"
  notes: |-
    **Le traité 8 expose la thèse (chap. 1), répond aux objections (chap. 2-3), puis la justifie (chap. 4-5).**

    | Moment | Lieu | Ce qui s'y joue |
    | la thèse | 1, 1-13 | chaque âme est une et toutes n'en sont qu'une |
    | les objections | 1, 13-fin | quelle âme unique, pourquoi des âmes et des facultés différentes |
    | l'âme se divise dans les corps | chap. 2 | une et indivisible en tant qu'âme |
    | la sympathie universelle | 3, 1-9 | effet de l'unité de l'âme |
    | la diversité des facultés | 3, 10-fin | elle ne contrarie pas l'unité |
    | l'unité de provenance | chap. 4 | l'empreinte d'une seule bague |
    | l'âme comme la science | chap. 5 | être en de multiples choses |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! Le traité suit l'ordre d'une démonstration scolaire : thèse, objections, réponses, justification.
