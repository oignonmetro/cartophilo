- id: traite8-l2
  title: "Première objection : la diversité des vivants"
  notes: |-
    **Le plan du traité suit l'explication : la thèse, les objections, la justification.** Il faut rappeler aux stoïciens que l'âme n'est pas un corps, et expliquer aux platoniciens qu'elle n'est pas une multiplicité.

    **L'objection (1, 15-20)** : s'il n'y a qu'une âme, quand j'ai une sensation, un autre doit la percevoir ; si je suis bon, il doit l'être ; l'univers devrait éprouver mes affections. Mais si l'on refuse la thèse, **l'univers ne sera pas un** et on ne trouvera pas le principe unique des âmes.

    **La réponse est fonctionnelle** (1, 13-19, puis 5, 1-7) : si les vivants diffèrent, c'est que les **corps** que l'âme anime ne sont pas identiques. **La diversité et la multiplicité sont le fait des corps, non de l'âme** : un agent unique exerce ses facultés différemment dans des corps différents.

    - Si mon âme et celle d'un autre sont une, **le composé** n'est pas le même pour nous deux (2, 1-2) : le même est en moi en mouvement, en toi au repos.
    - Dans un seul corps, une main ne sent pas ce qui affecte l'autre ; et chez **les grands animaux marins**, une affection locale n'atteint pas tout le corps (2, 15-18).
    - L'âme n'est pas une sans aucune pluralité (cela revient à **« la nature supérieure »**) : elle est **une et plusieurs**, participant de la nature divisible et de la nature indivisible (2, 25-28, d'après le *Timée*).

    **La sympathie s'explique par l'unité de l'âme** (3, 1-9) : nous partageons nos peines en nous voyant ; les **incantations** et les procédés magiques font partager des affections à distance ; une formule dite à voix basse agit au loin. **Toutes les choses sont une, parce que l'âme est une.**

    ! Que je ne sente pas ce que tu sens ne réfute pas l'unité de l'âme : la sensation dépend du corps, et même dans un seul corps toute affection n'est pas sentie partout.
