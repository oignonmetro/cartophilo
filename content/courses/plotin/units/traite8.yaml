- id: traite8-l3
  title: "Seconde objection : la diversité des facultés"
  notes: |-
    **La véritable difficulté tient à la multiplicité des facultés psychiques.** La diversité des composés vivants ne suffit pas à expliquer que l'âme n'exerce pas les mêmes facultés dans tous les corps.

    - Les **plantes** sont dépourvues de sensation, qui est pourtant une faculté psychique.
    - Tous les animaux n'exercent pas la **raison**, alors qu'elle est la fonction directrice de l'âme.
    - Même chez les hommes, aux corps semblables, les facultés rationnelles ou sensitives ne s'exercent pas à l'identique.

    **La réponse de Plotin retourne l'objection** : cette diversité n'est pas le signe qu'il existe différentes âmes, mais la preuve qu'**une âme unique exerce ses facultés de multiples façons**, produisant autant d'individus vivants. Chaque âme individuelle n'est qu'une des **modalités d'exercice** des facultés d'une âme unique.

    | Puissance | Où elle est |
    | la raison | ce qui est indivisible dans l'âme, non divisé dans les corps |
    | la sensation | ce qui est divisé dans les corps, un et le même pourtant |
    | la puissance qui façonne les corps | une autre puissance encore, la végétative |

    **« Ce n'est pas parce que l'âme a plusieurs puissances qu'elle n'est pas une »** (3, 16-17) : dans la **semence** aussi il y a plusieurs puissances, et elle reste une. L'âme retourne d'ailleurs rapidement à l'unité lorsqu'elle se retire du corps.

    **Le traité n'épuise pas ces questions** : il reviendra aux traités 27-29 (IV, 3-5) d'expliquer comment les âmes individuelles atteignent, tout en n'étant qu'une seule âme, une certaine **autonomie**.

    ! Plotin ne nie pas la diversité des facultés : il en fait la preuve, et non l'objection, de l'unité de l'âme.
