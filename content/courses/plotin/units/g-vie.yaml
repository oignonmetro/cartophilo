  points:
  - id: g-vie-l1-q1
    sentence: "Le terme grec que Plotin emploie pour la vie, qu'il tient pour l'activité même des réalités incorporelles et non pour une propriété des corps, se translittère ___."
    answer: zôê
    alt: ["zoe", "zôè", "zoê"]
  - id: g-vie-l1-q2
    sentence: "Un corps vivant reçoit sa vie ; si tout vivant la recevait d'un autre, on remonterait sans fin. Plotin en conclut qu'il faut une nature qui ait la vie par ___, et c'est l'âme (traité 2, chap. 9)."
    answer: elle-même
    alt: ["elle même", "soi"]
  - id: g-vie-l1-q3
    sentence: "« Il est impossible en effet que toutes choses aient reçu la vie du dehors, sans quoi on poursuivrait à l'___ » (traité 2, chap. 9)."
    answer: infini
    alt: []
  - id: g-vie-l1-q4
    sentence: "« Il est impossible en effet que toutes choses aient reçu la vie du ___, sans quoi on poursuivrait à l'infini » (traité 2, chap. 9)."
    answer: dehors
    alt: []
  - id: g-vie-l1-q5
    sentence: "« Il doit, au contraire, y avoir une nature qui soit ___ vivante » (traité 2, chap. 9) : ce qui ne reçoit pas la vie d'un autre, l'âme, met fin à la régression à l'infini."
    answer: primitivement
    alt: []
  - id: g-vie-l1-q6
    sentence: "L'âme, selon le traité 2 (chap. 9), « a la vie par elle-même et ne peut jamais la ___ parce qu'elle l'a par elle-même » : c'est l'argument de son immortalité."
    answer: perdre
    alt: []
  - id: g-vie-l1-q7
    sentence: "« La vie se dit en plusieurs ___ » (traité 46, chap. 3) : elle n'a pas la même signification pour le premier principe vivant et pour ce qui vient après lui."
    answer: sens
    alt: []
  - id: g-vie-l1-q8
    sentence: "La vie « a une signification différente selon qu'elle s'applique à ce qui est ___, à ce qui est second et ainsi de suite » (traité 46, chap. 3)."
    answer: premier
    alt: []
  - id: g-vie-l1-q9
    sentence: "Le traité où Plotin fait de la vie une notion à plusieurs sens, ordonnés du premier au dernier, pour en conclure que le bonheur appartient à la vie parfaite, est le traité ___, *Sur le bonheur*."
    answer: 46 (I, 4)
    alt: ["46", "I, 4"]
  - id: g-vie-l1-q10
    sentence: "Plotin reprend d'Aristote la formule d'une vie qui « se dit en plusieurs sens », mais il ne range pas les vies comme les espèces d'un genre : il les ordonne comme un antérieur et un ___, chacune étant l'image de celle qui la précède."
    answer: postérieur
    alt: ["posterieur"]
  - id: g-vie-l1-q15
    sentence: "« Ce qui est au-dessus de la vie est la ___ de la vie » (traité 30, chap. 10) : l'Un donne la vie sans être lui-même vivant."
    answer: cause
    alt: []
  - id: g-vie-l1-q16
    sentence: "Pour dire que l'Un donne la vie sans se disperser dans ce qu'il fait vivre, Plotin le compare au principe de vie d'une gigantesque plante, fixé dans sa ___ (traité 30, chap. 10)."
    answer: racine
    alt: []
  - id: g-vie-l1-q19
    sentence: "L'Un donne la vie sans être lui-même vivant : « ce qui est au-dessus de la vie est la cause de la vie ; car l'activité en quoi consiste la vie est toutes choses, et elle n'est pas ___ » (traité 30, chap. 10)."
    answer: première
    alt: ["premiere"]
  - id: g-vie-l1-q20
    sentence: "Parce que l'être véritable ne peut être privé ni de vie ni de pensée (Platon, *Sophiste*), l'Intellect est à la fois être, vie et ___ : c'est la triade qui fait de lui la vie première."
    answer: pensée
    alt: ["pensee", "intellect"]
  - id: g-vie-l1-q21
    sentence: "Dans l'échelle plotinienne de la vie, l'Âme a la vie par elle-même et la donne ; les corps, eux, ne font que la ___."
    answer: recevoir
    alt: []
  - id: g-vie-l1-q22
    sentence: "Contre l'âme-corps des stoïciens : les éléments sont par eux-mêmes inanimés ; si aucun ne vit, leur assemblage ne peut produire la vie, et si chacun vivait, un seul suffirait. Ce qui donne la vie doit donc « exister en dehors et au-delà de toute nature ___ » (traité 2, chap. 3)."
    answer: corporelle
    alt: []
  - id: g-vie-l1-q23
    sentence: "Pour les stoïciens, que Plotin réfute au traité 2, l'âme est un corps : un souffle, en grec translittéré ___."
    answer: pneûma
    alt: ["pneuma"]
  - id: g-vie-l1-q24
    sentence: "Contre l'idée d'un genre commun à tous les vivants : « il n'y a rien de commun entre la vie nutritive, la vie sensitive et la vie ___ » (traité 44, chap. 7)."
    answer: intellective
    alt: []
  - id: g-vie-l1-q26
    sentence: "Dans « le temps est la vie de l'âme que son mouvement fait passer d'un état à un autre » (traité 45, chap. 11), la GF rend par « état » le mot grec ___, le contenu variable d'une vie, et par « vie » le mot zôê."
    answer: bios
    alt: ["bíos"]
