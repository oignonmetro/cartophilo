# Entrée du glossaire de Plotin (skill glossaire) : notion, première entrée
# écrite selon la skill (2026-10-21), citations vérifiées sur la GF (IV, 7,
# 9 ; I, 4, 3 ; III, 8, 10 ; III, 7, 3). Sous-entrée : g-vie-parfaite ;
# distinction : g-degres-de-vie.

id: g-vie
title: Vie (`zôê`)
subtitle: L'activité même des réalités incorporelles, qui se dit à des degrés différents, de l'Intellect jusqu'à la plante
icon: book
color: coral
lessons:
- id: g-vie-l1
  title: Vie
  notes: |-
    Chez Plotin, la {violet}**vie**{/violet} n'est pas d'abord la {pink}propriété des corps qui naissent et meurent{/pink} : c'est l'{green}activité{/green} même des {green}réalités incorporelles{/green}, et elle se dit à des degrés différents, depuis l'Intellect jusqu'à la plante.

    __**La vie descend d'un principe qui n'est pas vivant.**__ {teal}« Ce qui est au-dessus de la vie est la cause de la vie »{/teal} (traité 30, chap. 10). {yellow}Comme une source qui se donne à tous les fleuves sans s'épuiser, ou comme le principe de vie d'une gigantesque plante, fixé dans sa racine{/yellow}, {violet}[[g-un|l'Un]]{/violet} donne la vie sans la posséder. Car {teal}« l'activité en quoi consiste la vie est toutes choses, et elle n'est pas première »{/teal} : vivre, c'est déjà être multiple, et le multiple suppose avant lui ce qui ne l'est pas.

    __**L'Intellect est la vie première, parce qu'être, vivre et penser y sont un.**__ L'être véritable ne peut être privé ni de vie ni de pensée : Plotin le tient du {sky}*Sophiste*{/sky}. L'{violet}[[g-intellect|Intellect]]{/violet} est donc à la fois être, vie et pensée, la triade {violet}**être, vie, pensée**{/violet}, qu'on peut lire comme trois moments d'un même acte : l'être se pose, la vie en sort, la pensée y revient. Sa vie est la [[g-vie-parfaite|vie parfaite]], à laquelle rien ne manque ; elle est aussi l'éternité, {teal}« la vie qui appartient à l'être et qui est dans l'être, la vie qui est tout entière ensemble, pleine et absolument dépourvue d'extension »{/teal} (traité 45, chap. 3, l. 36-38).

    __**Il faut un principe incorporel qui ait la vie par lui-même.**__ Un corps vivant ne tient pas sa vie de sa matière : il la reçoit. Mais si tout vivant la recevait d'un autre, on remonterait sans fin d'un donateur à l'autre. Donc {teal}« il est impossible en effet que toutes choses aient reçu la vie du dehors, sans quoi on poursuivrait à l'infini. Il doit, au contraire, y avoir une nature qui soit primitivement vivante »{/teal} (traité 2, chap. 9) : c'est {violet}l'[[g-ame|âme]]{/violet}, qui {teal}« a la vie par elle-même et ne peut jamais la perdre »{/teal}. **La vie va donc du haut vers le bas** : {green}l'incorporel la possède{/green}, {red}le corps ne fait que la recevoir{/red}.

    | Rang | Rapport à la vie |
    | l'Un | au-dessus de la vie, il en est la cause |
    | l'Intellect | la vie première : être, vivre et penser y sont un |
    | l'Âme | a la vie par elle-même et la donne |
    | les corps | ne font que la recevoir |

    __**Une échelle, non un genre.**__ {teal}« La vie se dit en plusieurs sens »{/teal}, et {teal}« elle a une signification différente selon qu'elle s'applique à ce qui est premier, à ce qui est second et ainsi de suite »{/teal} (traité 46, chap. 3). La formule vient d'Aristote ({violet}*pollakhôs legomenon*{/violet}), mais Plotin ne range pas les vies comme les espèces d'un genre, côte à côte : il les ordonne comme un **antérieur** et un **postérieur**, chacune étant l'**image** de celle qui la précède. Ce qui les ordonne, la clarté plus ou moins grande d'une même pensée, fait l'objet des [[g-degres-de-vie|degrés de vie]].

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 2, chap. 9 | une nature primitivement vivante, l'âme |
    | traité 25, chap. 3 | l'être véritable vit d'une vie parfaite |
    | traité 30, chap. 8 | toute vie est une intellection |
    | traité 30, chap. 10 | la vie a pour cause ce qui la dépasse |
    | traité 45, chap. 3 | l'éternité est la vie de l'être |
    | traité 46, chap. 3 | la vie se dit en plusieurs sens, ordonnés |

    **Voir aussi** : [[g-degres-de-vie|Degrés de vie]] · [[g-vie-parfaite|Vie parfaite]] · [[g-bonheur|Bonheur]] · [[g-ame|Âme]] · [[g-intellect|Intellect]] · [[g-un|Un]]
