# Entrée du glossaire de Plotin (skill glossaire) : notion, première entrée
# écrite selon la skill (2026-10-21), citations vérifiées sur la GF (IV, 7,
# 9 ; I, 4, 3 ; III, 8, 8 et 10 ; III, 7, 3). Sous-entrée : g-vie-veritable ;
# distinction : g-degres-de-vie.

id: g-vie
title: Vie (`zôê`)
subtitle: L'activité même des réalités incorporelles, qui se dit à des degrés différents, de l'Intellect jusqu'à la plante
icon: book
color: coral
lessons:
- id: g-vie-l1
  title: Vie
  notes: |-
    **Chez Plotin, la vie n'est pas d'abord la propriété des corps qui naissent et meurent : c'est l'activité même des réalités incorporelles, et elle se dit à des degrés différents, depuis l'Intellect jusqu'à la plante.** Le sensible ne la possède pas en propre, il la reçoit.

    __**Il faut un principe qui ait la vie par lui-même.**__ Un corps vivant ne tient pas sa vie de sa matière : il la reçoit. Mais si tout vivant la recevait d'un autre, on remonterait sans fin d'un donateur à l'autre. Donc {teal}« il est impossible en effet que toutes choses aient reçu la vie du dehors, sans quoi on poursuivrait à l'infini. Il doit, au contraire, y avoir une nature qui soit primitivement vivante »{/teal} (traité 2 [IV, 7], chap. 9) : c'est {violet}[[g-ame|l'âme]]{/violet}, qui {teal}« a la vie par elle-même et ne peut jamais la perdre »{/teal}. **La vie va donc du haut vers le bas** : {green}l'incorporel la possède{/green}, {red}le corps ne fait que la recevoir{/red}.

    __**La vie se dit en plusieurs sens, mais ordonnés.**__ {teal}« La vie se dit en plusieurs sens »{/teal}, et {teal}« elle a une signification différente selon qu'elle s'applique à ce qui est premier, à ce qui est second et ainsi de suite »{/teal} (traité 46 [I, 4], chap. 3). La formule vient d'Aristote (*pollakhôs legomenon*), mais Plotin ne range pas les vies comme les espèces d'un genre, côte à côte : il les ordonne comme un **antérieur** et un **postérieur**, chacune étant l'**image** de celle qui la précède. Ce qui les sépare n'est pas une différence de nature mais de **clarté et d'obscurité** : ce sont les [[g-degres-de-vie|degrés de vie]].

    __**Toute vie est une intellection.**__ Puisque les vies diffèrent par la clarté, il faut une même chose qui y soit plus ou moins claire : c'est la pensée. {teal}« Et toute vie est une intellection, mais l'une est plus obscure que l'autre »{/teal} (traité 30 [III, 8], chap. 8). Même la plante « pense », non qu'elle ait conscience de rien, mais parce que sa vie est une {violet}[[g-logos|raison]]{/violet} (*logos*), une forme qui agit dans la matière. C'est pourquoi la vie la plus haute est celle de l'{violet}[[g-intellect|Intellect]]{/violet}, où vivre et penser coïncident tout à fait : la [[g-vie-veritable|vie véritable]], ou « vie parfaite », dont les autres ne sont que des images.

    __**L'Un est au-dessus de la vie.**__ L'Intellect n'est pas le principe ultime de la vie : {teal}« ce qui est au-dessus de la vie est la cause de la vie »{/teal} (III, 8, 10). {yellow}Comme une source qui se donne à tous les fleuves sans s'épuiser, ou comme le principe de vie d'une gigantesque plante, fixé dans sa racine{/yellow}, {violet}[[g-un|l'Un]]{/violet} donne la vie sans être lui-même vivant, car vivre, c'est déjà être une activité multiple.

    **L'éternité elle-même est une vie** : {teal}« la vie qui appartient à l'être et qui est dans l'être, la vie qui est tout entière ensemble, pleine et absolument dépourvue d'extension »{/teal} (traité 45 [III, 7], chap. 3, l. 36-38), dont le temps, vie de l'âme, est l'image.

    ! « La vie » n'est pas un genre dont la plante, l'animal et l'homme seraient les espèces : c'est une même activité, plus ou moins claire, qui va de l'Intellect à la plante.
    ! L'Un n'est pas « la vie première » : la vie première est celle de l'Intellect ; l'Un est au-dessus de la vie, comme sa cause.
  points:
  - id: g-vie-l1-q1
    sentence: "Le terme grec que Plotin emploie pour la vie, qu'il tient pour l'activité même des réalités incorporelles et non pour une propriété des corps, se translittère ___."
    answer: zôê
    alt: ["zoe", "zôè", "zoê"]
  - id: g-vie-l1-q2
    sentence: "Un corps vivant reçoit sa vie ; si tout vivant la recevait d'un autre, on remonterait sans fin. Plotin en conclut qu'il faut une nature qui ait la vie par ___, et c'est l'âme (traité 2 [IV, 7], chap. 9)."
    answer: elle-même
    alt: ["elle même", "soi"]
  - id: g-vie-l1-q3
    sentence: "« Il est impossible en effet que toutes choses aient reçu la vie du dehors, sans quoi on poursuivrait à l'___ » (traité 2 [IV, 7], chap. 9)."
    answer: infini
    alt: []
  - id: g-vie-l1-q4
    sentence: "« Il est impossible en effet que toutes choses aient reçu la vie du ___, sans quoi on poursuivrait à l'infini » (traité 2 [IV, 7], chap. 9)."
    answer: dehors
    alt: []
  - id: g-vie-l1-q5
    sentence: "« Il doit, au contraire, y avoir une nature qui soit ___ vivante » (traité 2 [IV, 7], chap. 9) : ce qui ne reçoit pas la vie d'un autre, l'âme, met fin à la régression à l'infini."
    answer: primitivement
    alt: []
  - id: g-vie-l1-q6
    sentence: "L'âme, selon le traité 2 (IV, 7, 9), « a la vie par elle-même et ne peut jamais la ___ parce qu'elle l'a par elle-même » : c'est l'argument de son immortalité."
    answer: perdre
    alt: []
  - id: g-vie-l1-q7
    sentence: "« La vie se dit en plusieurs ___ » (traité 46 [I, 4], chap. 3) : elle n'a pas la même signification pour le premier principe vivant et pour ce qui vient après lui."
    answer: sens
    alt: []
  - id: g-vie-l1-q8
    sentence: "La vie « a une signification différente selon qu'elle s'applique à ce qui est ___, à ce qui est second et ainsi de suite » (traité 46 [I, 4], chap. 3)."
    answer: premier
    alt: []
  - id: g-vie-l1-q9
    sentence: "Le traité où Plotin fait de la vie une notion à plusieurs sens, ordonnés du premier au dernier, pour en conclure que le bonheur appartient à la vie parfaite, est le traité ___, *Sur le bonheur*."
    answer: 46 (I, 4)
    alt: ["46", "I, 4"]
  - id: g-vie-l1-q10
    sentence: "Plotin reprend d'Aristote la formule d'une vie qui « se dit en plusieurs sens », mais il ne range pas les vies comme les espèces d'un genre : il les ordonne comme un antérieur et un ___, chacune étant l'image de celle qui la précède."
    answer: postérieur
    alt: ["posterieur"]
  - id: g-vie-l1-q11
    sentence: "Selon le traité 46 (I, 4, 3), ce qui distingue la vie d'une plante de celle d'un être privé de raison n'est pas une différence de genre, mais de clarté et d'___."
    answer: obscurité
    alt: ["obscurite"]
  - id: g-vie-l1-q12
    sentence: "« Et toute vie est une ___, mais l'une est plus obscure que l'autre » (traité 30 [III, 8], chap. 8)."
    answer: intellection
    alt: []
  - id: g-vie-l1-q13
    sentence: "« Et toute vie est une intellection, mais l'une est plus ___ que l'autre » (traité 30 [III, 8], chap. 8) : les vies diffèrent comme des degrés d'une même pensée."
    answer: obscure
    alt: []
  - id: g-vie-l1-q14
    sentence: "La plante « pense » sans avoir conscience de rien : sa vie est une intellection parce qu'elle est une ___ (*logos*), une forme qui agit dans la matière (III, 8, 8)."
    answer: raison
    alt: []
  - id: g-vie-l1-q15
    sentence: "« Ce qui est au-dessus de la vie est la ___ de la vie » (traité 30 [III, 8], chap. 10) : l'Un donne la vie sans être lui-même vivant."
    answer: cause
    alt: []
  - id: g-vie-l1-q16
    sentence: "Pour dire que l'Un donne la vie sans se disperser dans ce qu'il fait vivre, Plotin le compare au principe de vie d'une gigantesque plante, fixé dans sa ___ (III, 8, 10)."
    answer: racine
    alt: []
  - id: g-vie-l1-q17
    sentence: "L'Un ne peut être vivant, car vivre, c'est déjà être une activité ___ ; c'est pourquoi la vie première est celle de l'Intellect, non celle de l'Un."
    answer: multiple
    alt: []
  - id: g-vie-l1-q18
    sentence: "L'éternité est « la vie qui appartient à l'être et qui est dans l'être, la vie qui est tout entière ensemble, pleine et absolument dépourvue d'___ » (traité 45 [III, 7], chap. 3, l. 36-38)."
    answer: extension
    alt: []
