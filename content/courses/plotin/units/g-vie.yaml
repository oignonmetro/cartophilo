# Entrée du glossaire de Plotin (skill glossaire) : notion, première entrée
# écrite selon la skill (2026-10-21), citations vérifiées sur la GF (IV, 7,
# 9 ; IV, 7, 2-3 ; I, 4, 3 ; III, 8, 10 ; III, 7, 3 et 11 ; VI, 3, 7). Sous-entrée : g-vie-parfaite ;
# distinction : g-degres-de-vie.

id: g-vie
title: Vie (`zôê`)
icon: book
color: coral
lessons:
- id: g-vie-l1
  title: Vie
  notes: |-
    Chez Plotin, la {violet}**vie**{/violet} (*zôê*) est [def]. Elle n'est donc pas d'abord la {pink}propriété des corps qui naissent et meurent{/pink}.

    __**L'Intellect est la vie première, parce qu'être, vivre et penser y sont un.**__ En reprenant le {sky}*Sophiste*{/sky}, Plotin soutient que l'être véritable ne peut être privé ni de vie ni de pensée : L'{violet}[[g-intellect|Intellect]]{/violet} est donc à la fois être, vie et pensée, la triade {violet}**être, vie, pensée**{/violet}, qu'on peut lire comme trois moments d'un même acte : l'être se pose, la vie en sort, la pensée y revient. Sa vie est la [[g-vie-parfaite|vie parfaite]], à laquelle rien ne manque ; elle est aussi l'[[g-eternite|éternité]], une vie tout entière à la fois.

    __**Aucun corps ne vit par lui-même : contre l'âme-corps des stoïciens.**__ Pour les {red}stoïciens{/red}, l'âme est un corps, un {red}souffle{/red} {red}physique{/red} ({violet}*pneûma*{/violet}). Plotin leur oppose un dilemme ([[traite2|traité 2]], chap. 2). Si l'âme est un corps, elle est faite de corps ; or « le feu, l'air, l'eau et la terre __sont en effet inanimés__ ». Donc, « si aucun d'entre eux ne possède la vie, __il est absurde de supposer que leur composition l'a produite__ ; et si chacun la possédait, un seul y suffirait ». Le souffle ne fait pas mieux : c'est « le corps le plus divisible qui soit et qui __n'a par lui-même aucune unité__ » (chap. 3). **Ce qui donne la vie doit donc** « exister en dehors et __au-delà de toute nature corporelle__ ». (Voir le [[traite2|traité 2]].)

    __**Il faut un principe incorporel qui ait la vie par lui-même.**__ Un corps vivant ne tient pas sa vie de sa matière : il la reçoit. Mais si tout vivant la recevait d'un autre vivant, on remonterait sans fin d'un donateur à l'autre. Donc « il est impossible en effet que toutes choses aient reçu la vie du dehors, __sans quoi on poursuivrait à l'infini__. Il doit, au contraire, y avoir une nature qui __soit primitivement vivante__ » ([[traite2|traité 2]], chap. 9) : c'est {violet}l'[[g-ame|âme]]{/violet}, qui « a la vie par elle-même et __ne peut jamais la perdre__ ». **La vie va donc du haut vers le bas** : {green}l'incorporel la possède{/green}, {pink}le corps ne fait que la recevoir sans l'avoir{/pink}. Et la vie de l'âme n'est pas celle de l'Intellect : l'une est éternelle, l'autre se déploie dans le [[g-temps|temps]]. À quoi reconnaît-on, dans un corps, la présence de cette vie reçue ? C'est le critère de l'[[g-anime-inerte|animé et de l'inerte]] : ce qui vit se meut et se forme du dedans, l'inerte ne reçoit forme et mouvement que du dehors.

    | Rang | Rapport à la vie |
    | l'Un | au-dessus de la vie, il en est la cause |
    | l'Intellect | la vie première : être, vivre et penser y sont un |
    | l'Âme | a la vie par elle-même ; sa vie est le temps |
    | les corps | ne font que la recevoir |

    __**Une échelle, non un genre.**__ « La vie __se dit en plusieurs sens__ », et « elle a une signification différente selon qu'elle s'applique __à ce qui est premier, à ce qui est second__ et ainsi de suite » ([[traite46|traité 46]], chap. 3). La formule vient d'Aristote ({violet}*pollakhôs legomenon*{/violet}), mais Plotin ne range pas les vies comme les espèces d'un genre, côte à côte : il les ordonne comme un **antérieur** et un **postérieur**, chacune étant l'**image** de celle qui la précède. Il le dit sans détour : « il n'y a __rien de commun__ entre la vie nutritive, la vie sensitive et la vie intellective » ([[traite44|traité 44]], chap. 7). Ce qui les ordonne, la clarté plus ou moins grande d'une même pensée, fait l'objet des [[g-degres-de-vie|degrés de vie]].

    __**Les mots.**__ Trois termes grecs que la traduction rend tous par « vie » ou « vivant », et qu'un texte n'emploie pas indifféremment.

    | Mot | Ce qu'il désigne | Où le voir |
    | *zôê* | la vie comme mode d'être, en général | traité 30, chap. 8 |
    | *bios* | un mode de vie, le contenu variable d'une vie | traité 46, chap. 4 |
    | *zôion* | l'être vivant : une âme unie à un corps (voir [[g-vivant|Vivant]]) | traité 53, *Qu'est-ce que le vivant ?* |

    ! La traduction ne rend pas toujours *bios* par « vie » : dans la définition du temps, « la vie de l'âme que son mouvement fait passer d'un état à un autre » ([[traite45|traité 45]], chap. 11), « vie » traduit *zôê* et « état » traduit *bios*. La différence porte le sens de la phrase : l'âme a une seule vie (*zôê*), dont le contenu (*bios*) change sans cesse, et c'est ce changement qui fait le [[g-temps|temps]].

    __**La vie descend d'un principe qui n'est pas vivant.**__ « Ce qui est au-dessus de la vie __est la cause de la vie__ » ([[traite30|traité 30]], chap. 10). {yellow}Comme une source qui se donne à tous les fleuves sans s'épuiser, ou comme le principe de vie d'une gigantesque plante, fixé dans sa racine{/yellow}, {violet}[[g-un|l'Un]]{/violet} donne la vie sans la posséder. Car « l'activité en quoi consiste la vie est toutes choses, et __elle n'est pas première__ » : vivre, c'est être une multiplicité ordonnée, et le multiple suppose avant lui ce qui ne l'est pas. De surcroît, si la cause de la vie était elle-même vivante au même titre que son effet, le **principe de la vie** posséderait alors la vie par un autre principe de la vie, ce qui est absurde.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 2, chap. 2 | aucune composition de corps ne produit la vie |
    | traité 2, chap. 9 | une nature primitivement vivante, l'âme |
    | traité 26, chap. 6 | l'être véritable vit d'une vie parfaite |
    | traité 30, chap. 8 | toute vie est une intellection |
    | traité 30, chap. 10 | la vie a pour cause ce qui la dépasse |
    | traité 44, chap. 7 | rien de commun entre les vies : pas de genre |
    | traité 46, chap. 3 | la vie se dit en plusieurs sens, ordonnés |

