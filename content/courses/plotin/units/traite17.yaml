- id: traite17-l3
  title: "Le complément de la réalité, et l'équivocité des termes"
  notes: |-
    **L'alternative de Plotin** : soit faire basculer le complément de la réalité du côté de l'intelligible, en sacrifiant sa dimension sensible (or le blanc de la neige se voit) ; soit lui garder son caractère sensible, au risque de ne plus le distinguer d'une qualité accidentelle (le blanc peint).

    **L'issue : le lien génétique du complément au `λόγος`** (3, 1-2). Le complément n'a pas la pleine intelligibilité de ce qui est là-bas, puisqu'il apparaît ici ; mais il n'est pas accidentel, puisqu'il tire de son lien au `λόγος` une forme de **nécessité**. Il est un **niveau médiateur** :

    | Niveau | Exemple | Nature |
    | qualité | la blancheur d'une table | sensible et accidentelle |
    | complément de la réalité | la blancheur de la neige, la chaleur du feu | sensible, mais distingue les espèces |
    | acte de la réalité là-bas | la Forme du feu | purement intelligible |

    **Les termes deviennent équivoques**, sans négligence : c'est une composante structurelle de la pensée de Plotin, qui intègre au cadre de l'émanation la description aristotélicienne du sensible fait de forme et de matière.

    - **« Acte »** : la blancheur en toi, la chaleur du feu sont dites « acte » ou « forme » (3, 1 ; 3, 15-16), mais seulement **« par homonymie »**, comme images des actes intelligibles.
    - **« Réalité » (`οὐσία`)** : la réalité intelligible (1, 1-15 ; 53-59) ; le `λόγος` de l'âme (2, 14-15) ; la « réalité qualifiée », réalité de nom seulement ; enfin, comme chez Aristote, la matière, support des qualités (2, 11-14).

    **L'inspiration platonicienne a le dernier mot** : la réalité et l'acte sensibles ne sont que des pseudo-réalités, images affaiblies de ce qui **« possède un être plus puissant et plus pur de tout mélange »** (1, 53-54).

    ! La forme du feu sensible n'est ni la Forme intelligible ni le `λόγος` de l'âme : c'en est une image, forme « par homonymie ».
