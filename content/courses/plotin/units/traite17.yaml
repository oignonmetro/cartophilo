- id: traite17-l2
  title: "Un dialogue : la neige, la céruse et le feu"
  notes: |-
    **L'obscurité du traité 17, soulignée par tous ses traducteurs, tient en partie à sa forme** : ce n'est pas une œuvre systématique, mais un **dialogue** entre Plotin et un interlocuteur fortement influencé par l'**école péripatéticienne**. Il avance par objections et mises au point ; des thèses y sont examinées puis abandonnées.

    **Les « compléments de la réalité » (`συμπληρωτικὰ τῆς οὐσίας`)** sont les caractères qui semblent faire partie de la chose sensible : **le blanc de la neige, la chaleur du feu**. Le dialogue passe par quatre configurations :

    | Solution | Ce qu'elle propose | Sa limite |
    | 1. dans la raison (1, 22-23) | les compléments sont « dans la raison », les qualités à la surface | le blanc de la neige est aussi visible que le blanc peint sur le bois |
    | 2. la division d'Aristote (1, 28) | qualités réelles et qualités ajoutées de l'extérieur | brouille la frontière du réel et de l'accidentel |
    | 3. une triade (1, 40-42) | la raison ; son acte là-bas, la différence ; la qualité produite ici | range tout le sensible sous les « qualités » |
    | 4. celle de Plotin | l'acte intelligible, le complément sensible, la qualité | |

    La troisième, d'inspiration platonicienne, cite la **Lettre VII** (343b-c) : elle vient peut-être d'un autre élève, moins aristotélicien.

    **Le paradigme du feu** (1, 33-38), solution de Plotin :

    | Niveau | La chaleur |
    | acte de la Forme intelligible du feu | la chaleur de là-bas |
    | complément de la réalité sensible | l'**« ignéité du feu visible »** (1, 35) |
    | qualité | la chaleur externe, éprouvée par les objets proches |

    **La céruse et le cygne** (1, 20-33) : le blanc de la neige ou de la **céruse** complète leur réalité, alors qu'en toi il est un accident ; et le blanc du **cygne** n'est pas un complément, car il pourrait y avoir des cygnes qui ne soient pas blancs.

    ! Les incohérences apparentes du traité sont souvent des thèses que les deux interlocuteurs examinent avant de les abandonner.
