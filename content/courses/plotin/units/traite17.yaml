- id: traite17-l4
  title: "Repérage : le plan du traité 17"
  notes: |-
    **Le traité 17 discute le statut de la qualité et du complément de la réalité (chap. 1), examine la qualité (chap. 2), puis pose des définitions (chap. 3).**

    | Moment | Lieu | Ce qui s'y joue |
    | l'être et la réalité là-bas | 1, 1-8 | le mouvement, réalité ou complément ? |
    | différences et qualités | 1, 8-29 | ce qui complète la réalité, ce qui lui est extérieur |
    | la céruse et le cygne | 1, 30-33 | le blanc, complément ou non |
    | la chaleur du feu | 1, 33-40 | l'ignéité du feu visible |
    | les raisons et leurs productions | 1, 41-48 | intelligibles ou sensibles |
    | réalité sensible, réalité intelligible | 1, 48-56 | seule celle de là-bas est réellement réalité |
    | qualité seule et complément | 2, 1-5 | la réalité qualifiée |
    | la réalité avant la qualité | 2, 6-15 | matière, puis forme et raison |
    | le composé | 2, 15-20 | son statut |
    | la qualité extérieure à la réalité | 2, 20-34 | définition et exemples |
    | qualités ici et là-bas | 3, 1-10 | la blancheur en toi, un acte |
    | le raisonnement | 3, 10-14 | la « génération » d'une qualité |
    | deux chaleurs | 3, 14-20 | inhérente au feu, ou externe |
    | définitions générales | 3, 20-29 | qualité et forme du sensible |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! Le feu revient deux fois : comme exemple en 1, 33-40, puis pour fixer la distinction des deux chaleurs en 3, 14-20.
