id: traite17
title: "Traité 17 (II, 6) : Sur la réalité ou sur la qualité"
subtitle: "Le complément de la réalité"
icon: compass
color: sky
lessons:
- id: traite17-l1
  title: "Contre la division aristotélicienne des qualités"
  notes: |-
    **Le problème du traité 17 a pour origine la distinction aristotélicienne de deux types de qualités** (*Métaphysique*, Δ, 14) :

    | Qualité selon Aristote | Ce que c'est | Exemples |
    | la qualité au sens propre | la **différence de la réalité** (`ἡ τῆς οὐσίας διαφορά`) : le trait essentiel qui définit l'espèce | l'homme bipède, le cercle sans angle |
    | les qualités secondes | les affections des corps en mouvement, accidentelles ou provisoires | la blancheur de la peau, être musicien |

    **Plotin conteste cette division** : elle confond l'ordre de la **réalité** (`οὐσία`) et celui de la **qualité**. La **différence** (`διαφορά`) a son origine dans le `λόγος` intelligible de la chose : elle ne peut être confondue avec la qualité, qui n'est qu'accidentelle.

    **L'enjeu** : maintenir une distinction forte entre deux dimensions de l'objet sensible :

    - la **réalité**, qui intègre la différence, envisagée dans la perspective de la puissance intelligible qui la produit ;
    - l'**accident**, fruit de l'indétermination de la matière, qui reste extérieur à la réalité (3, 25).

    C'est une **« greffe néoplatonicienne »** sur Aristote : Plotin utilise ses concepts (réalité, acte, différence, qualité) dans un sens résolument platonicien, et en fait **des instruments critiques dirigés contre la doctrine d'où ils viennent**.

    - La forme, contre Aristote, reste **séparée** : c'est le `λόγος` dont dérive l'être sensible (2, 15).
    - La réalité sensible, **« réalité qualifiée »** (`ποιὰ οὐσία`, 2, 5), n'est qu'une **« image »** (1, 12) ou une ombre de l'intelligible ; seule la réalité de là-bas est **« réellement réalité »** (1, 55).
    - La qualité est réduite à l'accident : **« ce qui n'est jamais la forme de quelque chose d'autre »** (3, 28).

    ! Pour Aristote, la différence spécifique est une qualité ; pour Plotin, elle relève de la réalité, et la qualité n'est jamais qu'accident.
