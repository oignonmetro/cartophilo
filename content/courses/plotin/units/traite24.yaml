id: traite24
title: "Traité 24 (V, 6) : Sur le fait que ce qui est au-delà de l'être n'intellige pas"
subtitle: "Le Premier n'intellige pas"
icon: compass
color: sky
lessons:
- id: traite24-l1
  title: "Contre Aristote : penser n'est pas être premier"
  notes: |-
    **L'objet du traité est de dissocier l'excellence du principe de l'activité de pensée.** Ce qui pense, ou même ce qui se pense, ne peut plus prétendre au rang de réalité la plus parfaite.

    **La cible : la théologie d'Aristote.** Dans le livre Λ de la *Métaphysique*, la contemplation de dieu par lui-même est « ce qui est le plus agréable et le meilleur » (7, 1072b24), et l'Intellect, « la plus divine des choses » (9, 1074b16). Plotin destitue cet Intellect, **« l'intellection de l'intellection »** (`νόησις νοήσεως`), au profit de l'Un. Nulle part le médioplatonisme n'avait affirmé avec cette netteté la supériorité du premier principe sur toute pensée : **l'un des gestes inauguraux du néoplatonisme**.

    **Le ressort : seul ce qui est absolument un peut être absolument premier.** Or toute pensée suppose une altérité entre le pensant (`νοῦς`) et le pensé (`νοητόν`).

    **Deux cas** (chap. 1, 1-5) :

    | Ce qui intellige | Rapport à son objet |
    | une chose qui en intellige une autre (l'âme) | elle possède ce qu'elle voit, mais cet objet est autre qu'elle |
    | une chose qui s'intellige elle-même (l'Intellect) | uni à son objet, il se voit lui-même : il intellige en premier |

    **Le dilemme** (1, 7-14) : si ce qui intellige n'est pas un, autre sera ce qui intellige, autre ce qui est intelligé ; s'il est un sans dualité, il n'aura rien à intelliger. **Il faut donc qu'il soit « simple et non simple »** (1, 14).

    **L'image de la double lumière** (1, 15-24) : l'âme est la lumière inférieure, son objet une lumière plus pure ; si la lumière qui voit égale celle qui est vue, on admet qu'elles sont une. Mais c'est le deux qui vient de l'un : **parce qu'il intellige, l'Intellect se fait deux ; parce qu'il s'intellige, un.**

    ! Chez l'Intellect, l'identité et l'altérité s'équilibrent ; chez l'âme, l'altérité l'emporte : elle ne se reconnaît pas dans ce qu'elle pense.
