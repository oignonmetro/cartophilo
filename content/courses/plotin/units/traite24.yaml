- id: traite24-l2
  title: "Le Premier n'intellige pas"
  notes: |-
    **Thèse du chapitre 2 : ce qui est au-delà de ce qui intellige en premier n'intellige plus.** Pour intelliger, il faudrait devenir un intellect et posséder un intelligible : il serait deux, donc plus premier.

    - L'Intellect ne pourrait exister **s'il n'y avait une réalité qui soit purement un intelligible** (2, 8) ; en elle-même, elle n'est au sens propre ni intelligente ni intelligible.
    - **Le Bien n'a pas besoin d'intelliger pour être parfait** : il tire sa perfection de sa propre réalité, avant toute intellection.
    - D'où **trois principes** : **« un principe qui n'intellige pas, un principe qui intellige en un sens premier, et un principe qui intellige en un sens second »** (2, 16-17) : le Bien, l'Intellect, l'âme.
    - S'il s'intelligeait seulement lui-même, le Premier serait déjà **multiple**.

    **L'unité avant le multiple** (chap. 3) : il n'y a pas de multiplicité sans une unité d'où elle dérive. L'unité qui existe avec les autres choses ressemble à l'unité en soi, mais n'est pas elle. Si aucun élément simple n'existait, **le composé n'existerait pas non plus** : il faut une unité avant la multiplicité.

    **Les images du chapitre 4** :

    | Image | Ce qu'elle montre |
    | le nombre deux | l'un qui est avec un autre suppose le nombre un, existant par lui-même |
    | la lumière, le soleil, la lune | le Bien est la lumière, l'Intellect le soleil, l'âme la lune, qui reçoit sa lumière |

    L'Intellect **« prend la forme du Bien »** (`ἀγαθοειδής`, mot de la *République*, VI, 509a) parce qu'il l'intellige : il s'en écarte déjà, car le Bien n'a pas de forme. Plotin inverse l'analogie de Platon : la lumière, incorporelle, figure le Bien, et le soleil, un corps, l'Intellect. L'âme a **un intellect qui vient du dehors**, qui la colore en surface ; le Bien donne à l'Intellect **« la puissance d'être ce qu'il est »** (4, 20).

    ! Le Bien n'est pas un Intellect supérieur qui penserait mieux : il est sans pensée, parce que penser, c'est déjà être deux.
