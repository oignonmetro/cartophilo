- id: traite24-l4
  title: "Repérage : le plan du traité 24"
  notes: |-
    **Le traité 24 va de la pensée de l'âme et de l'Intellect (chap. 1) au Bien qui n'intellige pas (chap. 2-4), puis au désir qui fonde la pensée (chap. 5-6).**

    | Moment | Lieu | Ce qui s'y joue |
    | intelliger autre chose ou soi-même | 1, 1-5 | l'âme et l'Intellect |
    | un et deux | 1, 5-14 | simple et non simple |
    | la double lumière | 1, 15-24 | les deux sont une |
    | le Premier n'intellige pas | chap. 2 | trois principes d'intellection |
    | une unité simple et séparée | chap. 3 | pas de composé sans simple |
    | le nombre et la lumière | chap. 4 | l'Intellect prend la forme du Bien |
    | le désir et l'intellection | chap. 5 | le désir a engendré l'intellection |
    | au-delà de la réalité et de l'intellection | chap. 6 | le Bien ne se connaît pas |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! Le titre dit toute la thèse : ce qui est au-delà de l'être n'intellige pas.
