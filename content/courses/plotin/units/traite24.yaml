- id: traite24-l3
  title: "Le désir du Bien engendre l'intellection"
  notes: |-
    **L'intellection n'est première ni quant à l'être, ni quant à la dignité** (chap. 5) : elle est advenue alors que le Bien existait déjà, et c'est le Bien qui a fait se mouvoir vers lui ce qui est advenu. **« Voici ce qu'est intelliger : un mouvement qui se porte vers le Bien en le désirant. Car le désir a engendré l'intellection »** (5, 8-10). Le désir de voir est déjà une vision.

    **Deux intellections** :

    | Pensée de l'être | Pensée du Bien |
    | l'Intellect se pense lui-même : intellection « au sens propre » (1, 11) | un désir (`ἔφεσις`), un élan vers l'illimitation du principe |
    | saisie des déterminations de l'être | antérieure à la pensée de soi, qu'elle engendre |

    En regardant vers le Bien, l'Intellect **s'intellige lui-même par accident** (5, 16-17) ; c'est l'orientation vers le principe qui est la forme essentielle de pensée.

    **Au-delà de la réalité et de l'intellection** (chap. 6) : l'acte premier n'est pas une intellection, car il n'a rien à intelliger. Dans l'être, **l'intellection, la vie et l'être sont ensemble** : l'homme et l'intellection de l'homme, le cheval et l'intellection du cheval ; tout y est double. Si le Bien est **« au-delà de la réalité »** (*République*, VI, 509b), il est aussi au-delà de l'intellection.

    **Il ne se connaît pas lui-même**, et n'a pas besoin de connaître les autres choses : il leur donne mieux, d'être leur Bien, et **de l'atteindre, dans la mesure où elles le peuvent** (6, 34-36).

    **La difficulté de dire le Bien** : le langage de l'être reflue sur lui ; Plotin l'appelle une **« réalité qui est purement un intelligible »** (2, 8), voire un **substrat**, le mot de la matière. Mais le discours n'est qu'une propédeutique : il s'agit non de dire le Bien, mais de l'atteindre.

    ! Que l'Intellect se pense « par accident » ne contredit pas la pensée de soi « au sens propre » : l'une dérive de l'autre, plus originaire, le désir du Bien.
