# Unité de texte (voir content/textes.md) : Plotin, traité 2 (IV, 7), Sur
# l'immortalité de l'âme, chapitre 1, traduction GF (éd. L. Brisson et
# J.-F. Pradeau). Découpage seul : rappels et cartes à écrire.

id: "t2c1"
title: "Le soi, c'est l'âme (2 [IV, 7], 1)"
subtitle: "Traité 2, Sur l'immortalité de l'âme, chapitre 1"
group: "Traité 2 (IV, 7) : Sur l'immortalité de l'âme"
icon: "page"
color: "coral"
depth: "normale"
lessons:
- id: "t2c1-p1"
  title: "Immortels, détruits, ou immortels en partie ?"
  notes: ""
  passage:
    label: "l. 1-4"
    part: "La question et la méthode"
    text: |-
      Si chacun de nous est immortel ou bien s'il est entièrement détruit, ou bien encore si certaines de ses parties s'en vont à la dispersion et à la destruction tandis que d'autres, qui sont ce que nous sommes nous-mêmes, subsistent toujours, c'est ce que l'on peut découvrir en examinant la chose conformément à la nature.
  points: []
- id: "t2c1-p2"
  title: "L'homme n'est pas quelque chose de simple"
  notes: ""
  passage:
    label: "l. 5-9"
    part: "L'homme, une âme et un corps"
    text: |-
      Assurément, l'homme ne saurait être quelque chose de simple : il y a en lui une âme, et aussi un corps, qu'il soit notre instrument ou bien qu'il soit attaché à nous d'une autre manière. Quoi qu'il en soit, acceptons de faire une telle distinction et observons ce que sont la nature et la réalité de chacun des deux termes.
  points: []
- id: "t2c1-p3"
  title: "Le corps composé se disperse"
  notes: ""
  passage:
    label: "l. 9-20"
    part: "La destruction du corps"
    text: |-
      S'agissant du corps, il est clair qu'en étant lui-même composé il ne saurait raisonnablement avoir la puissance de perdurer ; de surcroît, la sensation témoigne qu'il se divise et se disperse, et qu'il est passible de toutes sortes de destructions alors que chacun de ses éléments constitutifs se meut vers le lieu qui lui est propre, en détruit un autre, se transforme en un autre ou le chasse, surtout lorsque l'âme, qui les rassemble, n'est plus présente dans leur masse.
  points: []
- id: "t2c1-p3b"
  title: "Les éléments eux-mêmes sont divisibles"
  notes: ""
  passage:
    label: "l. 9-20"
    part: "La destruction du corps"
    text: |-
      Et même lorsque chaque élément s'isole et s'unifie, il n'est pas un puisqu'il est susceptible de se diviser en une forme et en une matière, qui sont les constituants nécessaires dont même les corps simples sont issus. Et il faut encore ajouter, puisque ce sont des corps, qu'ils possèdent une grandeur, qu'ils sont divisibles, qu'ils peuvent être réduits en éléments plus petits et être ainsi soumis à la destruction.
  points: []
- id: "t2c1-p4"
  title: "Le corps, partie ou instrument"
  notes: ""
  passage:
    label: "l. 21-23"
    part: "Nous ne sommes pas entièrement immortels"
    text: |-
      De la sorte, si le corps est bien une partie de nous-mêmes, nous ne sommes pas entièrement immortels. Et s'il s'agit d'un instrument qui nous a été confié pour un certain temps, il doit par nature n'exister que ce temps durant.
  points: []
- id: "t2c1-p5"
  title: "L'homme lui-même"
  notes: ""
  passage:
    label: "l. 23-25"
    part: "L'âme est le soi"
    text: |-
      Mais la partie la plus importante de nous, c'est l'homme lui-même, s'il est vrai que cette partie doit avoir à l'égard du corps le statut qui est celui de la forme par rapport à la matière, ou bien encore celui de l'usager par rapport à l'instrument ; dans les deux cas de figure, l'âme est le soi.
  points: []
