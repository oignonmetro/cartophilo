lessons:
- id: g-monde-l1
  title: Monde
  notes: |-
    Chez Plotin, le {violet}**monde**{/violet} (*kosmos*) est [def]. Il n'est {pink}ni l'œuvre d'un artisan qui calcule, ni une prison à mépriser{/pink} : il est ce que l'intelligible produit hors de lui, sans commencement et sans peine.

    __**Le monde est l'image du monde intelligible, et la plus belle possible.**__ Il y a deux mondes, et le premier n'est pas celui que l'on voit : « l'Intellect et l'être correspondent au __monde véritable et premier__, un monde qui ne connaît pas l'extension, qui n'est pas affaibli par la division et qui ne manque de rien » ([[traite47|traité 47]], chap. 1). Le monde sensible en vient comme son image, et une image fidèle : « il faut en effet qu'un autre monde existe qui soit engendré beau, parce qu'il est __une image du beau__, car il n'est pas permis que n'existe pas une belle image du beau et de la réalité » ([[traite31|traité 31]], chap. 12). Ce qu'il tient de son modèle, il le tient en entier : « en tant qu'image, le monde possède en effet la vie et une part de réalité, et en tant qu'il vient de là-bas, __il lui appartient d'être beau__ » (*ibid*. ; voir [[g-eikon|image]]). Les gnostiques ont donc tort de le mépriser, eux qui font grand cas du monde intelligible et ne voient pas que le nôtre « en est l'image. Quelle autre image pourrait-il y avoir de l'intelligible qui soit plus belle ? De fait, __quel autre feu serait une meilleure image du feu de là-bas que le feu d'ici ?__ » ([[traite33|traité 33]], chap. 4). Mépriser l'image, c'est mal connaître le modèle, car « rien n'a été omis de ce qu'une belle image naturelle est susceptible d'avoir » (chap. 8 ; voir [[g-beaute|beauté]]). C'est même par l'image qu'on remonte au modèle. Plotin propose un exercice : se représenter le monde « comme dans __une sphère transparente__ à travers laquelle il serait réellement possible de tout voir. Forme donc en ton âme la représentation lumineuse d'une sphère qui contient toutes choses » ; puis, « tout en conservant cette représentation, formes-en une autre en toi-même __dont tu retrancheras la masse__ » ([[traite31|traité 31]], chap. 9). Ôtez la masse et le lieu, il reste ce dont le monde était l'image.

    __**Le monde n'a ni commencement ni fin, parce qu'une image naturelle dure autant que son modèle.**__ Une peinture peut être faite puis détruite, parce qu'elle dépend du peintre ; mais le monde n'est pas une image de ce genre. Il dépend de son modèle seul, et le modèle est éternel : le monde « possède l'éternité de l'intelligible, sans quoi le monde intelligible tantôt aurait une image de lui-même, tantôt non, alors même que __cette image n'est pas un produit de l'art__. Toute image produite par la nature subsiste aussi longtemps que subsiste son modèle » ([[traite31|traité 31]], chap. 12). C'est l'image du reflet plutôt que celle du tableau : « quand la réalité supérieure dispense sa lumière, le reste des choses ne peut en manquer, et qu'elles __existent depuis qu'il existe__. Or il a toujours été et toujours il sera » (*ibid*.). Demander quand et pourquoi le monde a commencé, c'est donc poser une question mal formée : « cette question est celle de gens qui __attribuent un commencement à ce qui a toujours existé__ » ([[traite33|traité 33]], chap. 8). Plotin en tire la thèse de la providence : « puisque nous affirmons que notre monde est éternel et qu'il n'y eut pas un moment où il n'existait pas », l'Intellect lui est antérieur « non au sens où l'Intellect lui serait antérieur dans le temps, mais parce que __l'univers dépend de l'Intellect__ » ([[traite47|traité 47]], chap. 1 ; voir [[g-eternite|éternité]]). Il ne s'use pas non plus, comme s'usent les vivants, parce qu'il n'a pas de dehors où perdre sa matière : « il s'écoule en lui-même, car __il ne s'écoule pas au-dehors__ » ([[traite40|traité 40]], chap. 3 ; voir [[g-vieillesse|vieillesse]]).

    __**Le monde n'est pas fabriqué par un calcul : il suit de l'activité de l'intelligible, qui doit s'exercer aussi au-dehors.**__ On imagine un démiurge qui délibère : Plotin le refuse, car délibérer suppose qu'on ignore encore et qu'on change. « Notre univers est né __non pas à la suite d'un calcul__ qui établit qu'il devait naître, mais il résulte de la nécessité qu'il y ait une nature de second rang » ([[traite47|traité 47]], chap. 2). Pourquoi cette nécessité ? Parce que l'intelligible, étant parfait, ne peut pas être stérile : « l'intelligible ne peut être le terme ultime, car __son activité doit être double__ : l'une qui s'exerce en lui-même, et l'autre qui s'exerce sur autre chose. Il faut donc qu'il existe quelque chose après lui » ([[traite33|traité 33]], chap. 8 ; voir [[g-procession|procession]]). Cette production ne coûte rien à celui qui produit : « l'Intellect est à ce point bienheureux qu'il __réalise de grandes choses en ne faisant rien__ » ([[traite47|traité 47]], chap. 1) ; il « donne quelque chose de lui-même à la matière, produit toutes choses en demeurant calme et tranquille. Ce don, c'est la raison qui s'écoule de l'Intellect » (chap. 2). Il n'y faut pas d'outils : « il n'y a dans la nature __ni mains, ni pieds__, ni un quelconque instrument » ([[traite30|traité 30]], chap. 2 ; voir [[g-theoria|contemplation]]). L'âme du monde gouverne de même, sans peine : le monde « n'a besoin que d'une sorte de commandement bref, et l'âme de l'univers est toujours telle qu'elle veut naturellement être, __sans éprouver de désir ou être affectée__ » ([[traite6|traité 6]], chap. 2).

    __**Le monde n'est pas intellect, il y participe : ses maux viennent de la matière.**__ Si le monde vient de l'Intellect, pourquoi n'est-il pas parfait comme lui ? Parce qu'un second monde ne peut pas être un second Intellect : « le monde intelligible n'est que raison et __il ne saurait y avoir un autre monde qui ne soit que raison__. Si quelque chose d'autre vient à l'être, il faut qu'il soit inférieur au monde intelligible et qu'il ne soit ni une raison ni non plus une sorte de matière, car la matière est dépourvue d'ordre. Notre monde est donc __un mélange__ » ([[traite47|traité 47]], chap. 2). Il « se borne à participer de l'Intellect et de la raison » (*ibid*.), et ce qui n'est pas raison en lui le tire vers le bas : « la nécessité l'entraîne vers le mal et le conduit loin de la raison, parce qu'elle n'est pas une « raison » ; il n'en reste pas moins que __l'intellect domine la nécessité__ » (*ibid*.). Les maux viennent donc de la matière, sans laquelle le monde ne serait pas : « cet univers provient nécessairement d'éléments contraires. Autrement, __il n'existerait même pas, si la matière n'existait pas__ » ([[traite51|traité 51]], chap. 7 ; voir [[g-hule|matière]]). Ce qui vient du dieu est bon, « alors que les maux sont issus de « l'antique nature » : c'est ainsi que Platon appelle la matière sous-jacente non encore ordonnée par un dieu » (*ibid*.).

    | | Le monde intelligible | Le monde sensible |
    | Ce qu'il est | l'Intellect, pure raison | une image, un mélange |
    | Étendue | sans extension ni division | étendu, divisé |
    | Durée | éternel | sans commencement ni fin, par son modèle |
    | Les maux | aucun | de la matière, dominée par l'intellect |

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 31, chap. 12 | une image naturelle dure autant que son modèle |
    | traité 33, chap. 4 | le feu d'ici, meilleure image du feu de là-bas |
    | traité 33, chap. 8 | l'activité double de l'intelligible ; pas de commencement |
    | traité 47, chap. 1 | le monde véritable ; l'univers dépend de l'Intellect |
    | traité 47, chap. 2 | non par un calcul ; un mélange d'intellect et de nécessité |
    | traité 51, chap. 7 | sans la matière, pas de monde ; l'antique nature |

