  - id: g-steresis-l1-q1
    sentence: "L'absence de forme et de raison, que Plotin identifie à la matière même, se dit en grec translittéré ___."
    answer: sterêsis
    alt: ["steresis", "stérêsis"]
  - id: g-steresis-l1-q2
    sentence: "Plotin pose la question frontalement : « la matière est-elle la ___ ou la privation s'applique-t-elle à la matière ? » (traité 12, chap. 14)."
    answer: privation
    alt: []
  - id: g-steresis-l1-q3
    sentence: "La privation est une sorte de négation, et « la négation n'___ rien, mais elle affirme que ce n'est pas » (traité 12, chap. 14)."
    answer: ajoute
    alt: []
  - id: g-steresis-l1-q4
    sentence: "« Et c'est ainsi que la privation est comme un ___ » (traité 12, chap. 14)."
    answer: non-être
    alt: ["non être", "non-etre"]
  - id: g-steresis-l1-q5
    sentence: "La matière, « même si elle est non-être, elle est ainsi un être et s'identifie à la ___ » (traité 12, chap. 16)."
    answer: privation
    alt: []
  - id: g-steresis-l1-q6
    sentence: "Contre Aristote, la privation ne disparaît pas quand vient la forme, « car le réceptacle d'une ___ n'est pas une disposition, mais une privation » (traité 12, chap. 16)."
    answer: disposition
    alt: []
  - id: g-steresis-l1-q7
    sentence: "La limite qui survient ne détruit pas l'illimité : elle le fait être davantage ce qu'il est, comme le ___ ensemencé ne cesse pas d'être ce qu'il est (traité 12, chap. 16)."
    answer: champ
    alt: []
  - id: g-steresis-l1-q8
    sentence: "La matière « est un mal parce qu'elle a besoin du bien, car elle ne le ___ pas » (traité 12, chap. 16)."
    answer: possède
    alt: ["possede"]
  - id: g-steresis-l1-q9
    sentence: "Chez Aristote, matière et privation sont distinctes par la définition ; chez Plotin, elles sont une seule et ___ chose."
    answer: même
