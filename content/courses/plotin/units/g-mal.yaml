lessons:
- id: g-mal-l1
  title: Mal
  notes: |-
    Chez Plotin, le {violet}**mal**{/violet} (*kakon*) est [def]. Il n'est {pink}ni une force qui agirait contre le Bien, ni d'abord la méchanceté d'une volonté{/pink} : c'est un manque, et le manque le plus radical qui soit.

    __**Le mal ne peut se trouver ni dans les**__ {violet}__**êtres**__{/violet} __**ni au-delà d'eux, parce que**__ {coral}__**tout ce qui est a reçu du Bien ce qui le fait être**__{/coral}__**.**__ Le [[traite51|traité 51]], qui cherche d'où viennent les maux, part de ce qu'est le [[g-agathon|Bien]] : il est ce à quoi tout est suspendu, et « c'est à partir de lui-même qu'il donne l'Intellect, la réalité, l'âme, la vie » (chap. 2). L'{violet}[[g-intellect|Intellect]]{/violet} en est « la première activité du Bien et sa réalité première » (*ibid*.), et l'âme vit en le regardant. **Être, pour Plotin, c'est donc avoir reçu une forme et une activité, c'est-à-dire un bien** : un être tout à fait mauvais serait un être qui n'aurait rien reçu, ce qui se contredit. D'où la conclusion : « le mal ne peut se trouver dans les êtres, et encore moins dans ce qui est au-delà des êtres. Car __ces choses-là sont bonnes__ » (chap. 3). S'il existe, il ne reste qu'une place : parmi les non-êtres, « comme s'il était une sorte de forme du non-être » (*ibid*.). Ce non-être n'est pas le néant, car « le non-être n'est cependant pas ici le non-être total, mais seulement __ce qui est autre que l'être__ » (*ibid*.) : quelque chose qui n'a de l'être que l'apparence, « comme une image de l'être ».

    __**Le mal n'est pas un défaut de bien quelconque, mais le**__ {violet}__**manque total**__{/violet}__**.**__ On objecte qu'un défaut de bien se trouve partout : l'Intellect a moins que l'Un, l'âme moins que l'Intellect. Si tout manque était un mal, toute la réalité, qui procède de l'Un en s'affaiblissant (voir [[g-procession|procession]]), serait mauvaise. Plotin répond : « le mal ne réside pas dans une déficience quelconque, mais dans __la déficience absolue__ » ([[traite51|traité 51]], chap. 5). {coral}Ce qui manque un peu reste bon à son rang{/coral} : « il n'est pas mauvais puisqu'il peut aussi bien __être parfait eu égard à la nature qui lui est propre__ » (*ibid*.). Il faut donc distinguer deux choses : « la déficience par conséquent, c'est __le fait de ne pas être bon__, mais la déficience totale, __c'est le mal__ » (*ibid*.). Le mal commence là, et seulement là, où il ne reste plus aucun bien.

    __**Le mal premier est la**__ {violet}__**matière**__{/violet}__**, et non le corps ni le vice, qui ne sont mauvais que par participation.**__ Il faut un mal *en soi*, pour la même raison qu'il faut un Bien en soi : « de même que, pour le bien, il y a le Bien en soi et le bien qui est un attribut accidentel, de même pour le mal, il y a __le mal en soi__ et le mal qui, dérivé du premier, est alors accident d'autre chose » ([[traite51|traité 51]], chap. 3). Le mal en soi n'est pas ce qui *a* un manque, mais ce qui *est* le manque : l'absence de mesure, l'illimité, l'informe, « totale indigence », et « ces expressions désignent non pas les attributs accidentels du mal, mais d'une certaine façon sa réalité » (*ibid*.). Or une seule chose n'a rien reçu, pas même l'être : la {violet}[[g-hule|matière]]{/violet}, qui « n'a même pas l'être – sinon elle participerait par là au bien » (chap. 5). Elle est donc « __le mal premier__ » et « le mal en soi » (chap. 3). Les autres maux en dérivent, parce que **chacun garde encore quelque chose de bon** :
    - le corps : il a une forme, même si c'est « une forme qui n'est pas la Forme véritable » ; donc « la nature des corps, puisqu'elle participe à la matière, __ne peut pas être le mal premier__ », et les corps « constituent donc le mal second » (chap. 4) ;
    - le vice : il est dans une âme qui reste une âme, vivante et capable de remonter. {yellow}« De la même façon, l'obscurité est première, alors que ce qui est obscurci est second »{/yellow} : « le vice, dès lors, qui est l'ignorance et l'absence de mesure dans l'âme est __un mal second__ et non le mal en soi » (chap. 8).
    Ici, l'obscurité est la matière, ce qui est obscurci est l'âme vicieuse : l'âme n'est pas l'obscurité, elle en est atteinte.

    __**Le mal est**__ {violet}__**nécessaire**__{/violet}__**, parce que la procession doit avoir un terme dernier, qui ne possède plus rien du premier.**__ Si tout vient du Bien, pourquoi y a-t-il du mal ? Parce que le Bien ne reste pas seul : il produit (voir [[g-procession|procession]]), et {coral}chaque produit est moindre que ce dont il vient{/coral}, si bien que la sortie hors du Bien est une descente. Or une descente s'arrête là où il n'y a plus rien à donner : « puisque, en effet, le Bien ne peut exister seul, il doit nécessairement y avoir un terme qui mette un point final à la sortie des choses qui viennent de lui, [...] et __ce après quoi il n'est plus possible que naisse quoi que ce soit, cela, c'est le mal__ » ([[traite51|traité 51]], chap. 7). Pourquoi ce terme n'aurait-il plus *rien* du premier ? {coral}Parce que produire suppose encore une puissance, donc un reste de forme et de bien{/coral} : ce qui en garderait la moindre part pourrait encore produire, et ne serait pas le dernier. « Ce terme dernier, c'est la matière __qui ne possède plus rien du premier__. Voilà en quoi consiste la nécessité du mal » (*ibid*.). **Le mal n'est donc pas voulu par le Bien, ni dressé contre lui** : il est la limite où sa générosité s'épuise. Ce qui reste à expliquer, c'est pourquoi un monde qui contient des maux est pourtant bon (voir [[g-theodicee|théodicée]]).

    __**Le vice de l'âme a pour cause la**__ {violet}__**présence de la matière**__{/violet}__**, et non une faiblesse propre de l'âme.**__ On objecte que l'âme mauvaise est faible : facilement affectée, changeante, cédant aux désirs et aux représentations ([[traite51|traité 51]], chap. 14). Plotin accorde que le vice est une faiblesse, mais demande d'où elle vient. Être faible, pour une âme comme pour un corps, c'est {amber}« l'incapacité à accomplir la fonction qui est la sienne »{/amber} (*ibid*.). Or cette faiblesse n'est pas dans les âmes séparées de la matière, qui « sont en effet toutes pures et, comme on dit, « ailées et parfaites », accomplissant la fonction qui est la leur __sans rencontrer d'obstacle__ » (*ibid*.). Elle est donc dans les âmes tombées, et {coral}elle ne vient pas de ce qu'on leur a ôté quelque chose{/coral}, mais de « la présence en elles d'__un élément étranger__, {yellow}comme, dans le corps, la présence de phlegme ou de bile{/yellow} » (*ibid*.). Cet élément, c'est la matière : placée sous l'âme, elle en reçoit la lumière sans pouvoir la recevoir vraiment, et elle « obscurcit l'illumination » (*ibid*.). La chute de l'âme consiste à « venir de cette façon dans la matière et s'affaiblir, puisque __toutes ses puissances ne sont pas présentes__ pour exercer leur activité » (*ibid*.). D'où la conclusion : « la matière est donc cause de la faiblesse de l'âme et __cause de son vice__ » (*ibid*.). Même si c'est l'âme qui, en produisant, a fait venir la matière, « c'est la matière qui, par sa présence, est cause » (*ibid*.) : {coral}l'âme ne serait pas tombée s'il n'y avait eu rien où tomber{/coral}.

    ! Le mal touche le composé, non l'âme en elle-même : les maux que l'homme commet ou subit « sont le propre du vivant, de ce qui est composé » ([[traite53|traité 53]], chap. 9). L'âme vicieuse n'est donc pas une âme mauvaise par nature : elle peut se purifier (voir [[g-katharsis|purification]]), et c'est la seule fuite possible, qui ne se fait pas en changeant de lieu, mais « en acquérant la vertu et en se séparant du corps » ([[traite51|traité 51]], chap. 7).

    ! Le mal absolu {pink}ne se voit pas{/pink}, puisqu'il n'a aucune forme et que l'on connaît par la forme : « le vice absolu, nous ne le voyons pas. Car __il est sans limites__ » ([[traite51|traité 51]], chap. 9). Le vice partiel se connaît comme {amber}un défaut de vertu{/amber}, {yellow}comme on voit un visage laid au défaut de la forme{/yellow} ; la matière, en faisant abstraction de toute forme, {yellow}« comme un œil qui s'est détourné de la lumière pour voir l'obscurité sans la voir »{/yellow} (*ibid*.).

    ! Le mal premier n'est pas un {red}principe rival du Bien{/red}, comme chez les gnostiques : il n'agit pas, ne veut rien, et n'a pas même l'être. Ce qu'il « fait », il le fait par sa seule présence, comme une ombre assombrit sans rien faire.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 51, chap. 3 | ni dans les êtres ni au-delà ; le mal en soi |
    | traité 51, chap. 4 | le corps, mal second |
    | traité 51, chap. 5 | seule la déficience totale est le mal |
    | traité 51, chap. 7 | la nécessité du mal, terme de la procession |
    | traité 51, chap. 8 | le vice, mal second |
    | traité 51, chap. 14 | la matière, cause de la faiblesse de l'âme |
    | traité 53, chap. 9 | les maux sont le propre du composé |

