# Entrée du glossaire de Plotin (skill glossaire) : notion, écrite le
# 2026-11-17 avec la procédure NotebookLM (journal g-mal). Citations
# vérifiées sur la GF (traité 51, chap. 2-5, 7, 8, 14, 15 ; traité 53,
# chap. 9). La matière comme substrat a son entrée (Matière), la privation
# contre Aristote la sienne (Privation), la place du mal dans l'ordre du
# monde la sienne (Théodicée).

