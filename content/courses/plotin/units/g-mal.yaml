  points:
  - id: g-mal-l1-q1
    sentence: "Le mal, que Plotin définit comme le manque total de bien, se dit en grec translittéré ___."
    answer: kakon
    alt: ["to kakon"]
  - id: g-mal-l1-q2
    sentence: "« Le mal ne peut se trouver dans les êtres, et encore moins dans ce qui est au-delà des êtres. Car ces choses-là sont ___ » (traité 51, chap. 3)."
    answer: bonnes
    alt: []
  - id: g-mal-l1-q3
    sentence: "Le mal ne peut être un être, parce qu'être, c'est avoir reçu du Bien une forme et une activité : « c'est à partir de lui-même qu'il donne l'Intellect, la ___, l'âme, la vie » (traité 51, chap. 2)."
    answer: réalité
    alt: ["realite"]
  - id: g-mal-l1-q4
    sentence: "Exclu des êtres, le mal existe « parmi les non-êtres, comme s'il était une sorte de ___ du non-être » (traité 51, chap. 3)."
    answer: forme
    alt: []
  - id: g-mal-l1-q5
    sentence: "Le non-être où se trouve le mal n'est pas le néant : « le non-être n'est cependant pas ici le non-être total, mais seulement ce qui est ___ que l'être » (traité 51, chap. 3)."
    answer: autre
    alt: []
  - id: g-mal-l1-q6
    sentence: "Contre l'idée que tout défaut de bien serait un mal : « le mal ne réside pas dans une déficience quelconque, mais dans la déficience ___ » (traité 51, chap. 5)."
    answer: absolue
    alt: []
  - id: g-mal-l1-q7
    sentence: "Ce qui n'est qu'un peu déficient « n'est pas mauvais puisqu'il peut aussi bien être ___ eu égard à la nature qui lui est propre » (traité 51, chap. 5)."
    answer: parfait
    alt: []
  - id: g-mal-l1-q8
    sentence: "« La déficience par conséquent, c'est le fait de ne pas être bon, mais la déficience ___, c'est le mal » (traité 51, chap. 5)."
    answer: totale
    alt: []
  - id: g-mal-l1-q9
    sentence: "Si toute déficience était un mal, l'Intellect, qui a moins que l'Un, serait mauvais ; c'est pourquoi Plotin distingue la déficience, qui rend moins bon, de la déficience totale, seule ___."
    answer: mauvaise
    alt: ["mal", "le mal"]
  - id: g-mal-l1-q10
    sentence: "« De même que, pour le bien, il y a le Bien en soi et le bien qui est un attribut accidentel, de même pour le mal, il y a le mal ___ et le mal qui, dérivé du premier, est alors accident d'autre chose » (traité 51, chap. 3)."
    answer: en soi
    alt: []
  - id: g-mal-l1-q11
    sentence: "Le mal premier, celui qui n'a rien reçu du Bien, pas même l'être, est pour Plotin la ___."
    answer: matière
    alt: ["matiere", "hulê", "hule"]
  - id: g-mal-l1-q12
    sentence: "La matière « n'a même pas l'être – sinon elle ___ par là au bien » (traité 51, chap. 5)."
    answer: participerait
    alt: []
  - id: g-mal-l1-q13
    sentence: "« La nature des corps, puisqu'elle participe à la matière, ne peut pas être le mal premier » : les corps, qui ont encore une forme, « constituent donc le mal ___ » (traité 51, chap. 4)."
    answer: second
    alt: []
  - id: g-mal-l1-q14
    sentence: "« De la même façon, l'obscurité est première, alors que ce qui est ___ est second » (traité 51, chap. 8) : la matière est l'obscurité, l'âme vicieuse en est atteinte."
    answer: obscurci
    alt: []
  - id: g-mal-l1-q15
    sentence: "« Le vice, dès lors, qui est l'ignorance et l'absence de ___ dans l'âme est un mal second et non le mal en soi » (traité 51, chap. 8)."
    answer: mesure
    alt: []
  - id: g-mal-l1-q16
    sentence: "« Puisque, en effet, le Bien ne peut exister ___, il doit nécessairement y avoir un terme qui mette un point final à la sortie des choses qui viennent de lui » (traité 51, chap. 7)."
    answer: seul
    alt: []
  - id: g-mal-l1-q17
    sentence: "Le terme de la procession est le mal : « ce après quoi il n'est plus possible que ___ quoi que ce soit, cela, c'est le mal » (traité 51, chap. 7)."
    answer: naisse
    alt: []
  - id: g-mal-l1-q18
    sentence: "« Ce terme dernier, c'est la matière qui ne possède plus rien du premier. Voilà en quoi consiste la ___ du mal » (traité 51, chap. 7)."
    answer: nécessité
    alt: ["necessite"]
  - id: g-mal-l1-q19
    sentence: "Le terme de la procession ne garde rien du premier, car produire suppose encore une ___, donc un reste de forme : ce qui en garderait la moindre part ne serait pas le dernier."
    answer: puissance
    alt: []
  - id: g-mal-l1-q20
    sentence: "La faiblesse de l'âme n'est pas dans les âmes séparées, qui sont « toutes pures et, comme on dit, « ailées et parfaites », accomplissant la fonction qui est la leur sans rencontrer d'___ » (traité 51, chap. 14)."
    answer: obstacle
    alt: []
  - id: g-mal-l1-q21
    sentence: "La faiblesse de l'âme tombée vient de « la présence en elles d'un élément ___, comme, dans le corps, la présence de phlegme ou de bile » (traité 51, chap. 14)."
    answer: étranger
    alt: ["etranger"]
  - id: g-mal-l1-q22
    sentence: "« La matière est donc cause de la faiblesse de l'âme et cause de son ___ » (traité 51, chap. 14)."
    answer: vice
    alt: []
  - id: g-mal-l1-q23
    sentence: "Même si l'âme a fait venir la matière, « c'est la matière qui, par sa ___, est cause » (traité 51, chap. 14)."
    answer: présence
    alt: ["presence"]
  - id: g-mal-l1-q24
    sentence: "Les maux que l'homme commet ou subit « sont le propre du vivant, de ce qui est ___ » (traité 53, chap. 9)."
    answer: composé
    alt: ["compose"]
  - id: g-mal-l1-q25
    sentence: "Le traité de Plotin qui cherche d'où viennent les maux, et fait de la matière le mal premier, est le traité ___."
    answer: 51 (I, 8)
    alt: ["51", "I, 8"]
