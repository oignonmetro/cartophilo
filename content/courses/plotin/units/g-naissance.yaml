id: g-naissance
title: Naissance (`genesis`)
icon: book
color: teal
lessons:
- id: g-naissance-l1
  title: Naissance
  notes: |-
    Chez Plotin, la {violet}**naissance**{/violet} est [def]. Ce n'est pas {pink}le commencement d'une âme{/pink} : l'âme existait avant, et ce qui commence, c'est le vivant qu'elle forme avec un corps.

    __**Ce qui naît, c'est le composé : l'âme ne naît pas, quelque chose d'elle vient s'ajouter au corps.**__ Une âme ne peut pas commencer d'exister, puisqu'elle a la vie par elle-même (voir [[g-vie|vie]]). Ce qui naît est donc autre chose qu'elle : « c'est au cours de la génération que cet ajout a lieu. Ou plutôt, __la génération est tout entière le propre de cette « autre espèce d'âme »__ » ([[traite53|traité 53]], chap. 12), l'âme inférieure qui anime le corps. Et cette âme-là, comment vient-elle ? Sans que l'âme supérieure quitte sa place : la génération « a lieu lorsque l'âme descend, en ce sens que __quelque chose d'autre, issu d'elle, descend alors qu'elle s'incline__ » (*ibid*. ; voir [[g-neusis|inclination]]). Naître, c'est donc pour l'âme projeter une image d'elle-même dans un corps, non s'y transporter. Qui étions-nous alors, avant de naître ? « Avant même que cette génération ne se produise, __nous étions là-bas des hommes différents__, puisque nous étions des hommes, des dieux, des âmes pures et un intellect uni à la réalité tout entière » ([[traite22|traité 22]], chap. 14). La naissance ne nous a pas créés : elle a ajouté un autre homme à celui que nous étions, car « lorsqu'un nouvel homme a eu le désir d'exister, il a rejoint l'homme de là-bas, et lorsqu'il nous a trouvé – car nous n'étions pas à l'extérieur de la totalité –, __il s'est enroulé lui-même autour de nous__ et s'est ajouté à l'homme de là-bas, lequel était alors chacun de nous » (*ibid*. ; voir [[g-hemeis|nous]]). Il faut distinguer cette naissance de la « génération » des réalités éternelles, qui n'a pas de date : « toutes ces choses que l'on dit « engendrées » __n'ont donc pas été engendrées à un moment donné__ » ([[traite33|traité 33]], chap. 3 ; voir [[g-procession|procession]]).

    __**Le corps est préparé avant que l'âme individuelle y vienne, et l'âme de l'enfant n'est pas celle de la mère.**__ Le corps de l'embryon n'attend pas l'âme individuelle pour se former. L'âme du monde, qui est « pour ainsi dire leur sœur », a « préparé à l'avance des demeures » aux autres âmes ([[traite27|traité 27]], chap. 6 ; voir [[g-vegetatif|végétatif]]). Mais l'âme qui viendra habiter cette demeure n'est pas fournie par les parents : « dans le cas de l'embryon qui se trouve dans la mère, __l'âme qui s'introduit de l'extérieur__ dans l'enfant qui naît n'est pas celle de la mère, mais une autre » (chap. 7). À quoi le voit-on ? À ce que nous ne sommes pas seulement les produits du monde : nous en subissons l'influence, mais une autre âme en nous « s'oppose à ces influences ; ce qui montre qu'elle est autre, __c'est avant tout cette résistance__ » (*ibid*.). Une âme qui résiste au monde ne peut pas être une simple pièce du monde.

    __**L'âme descend au moment voulu, vers le corps approprié, comme à l'appel d'un héraut.**__ Qu'est-ce qui décide quelle âme vient dans quel corps, et quand ? Ni le hasard, ni un juge extérieur : une loi inscrite dans la nature même des âmes. « La règle inéluctable et la justice sont inscrites dans la nature qui commande à chaque âme de se diriger en suivant son rang vers le corps particulier qui est l'image engendrée du modèle __correspondant au choix préalable qu'elle a fait__ et à la disposition qui est en elle » ([[traite27|traité 27]], chap. 13). L'âme ne délibère pas ; elle va d'elle-même où sa disposition la porte : « lorsque le moment est venu, elle descend et s'installe automatiquement, pour ainsi dire, là où il faut. Le moment est différent pour chacune, et quand il est arrivé, __l'âme descend comme à l'appel d'un héraut__ et elle entre dans le corps approprié, comme si, à cette occasion, elle était mue et entraînée par des puissances magiques et par des attractions irrésistibles » (*ibid*.). Le héraut ne contraint pas : il appelle celui qui est prêt à répondre.

    __**Naître est à la fois une chute et une manifestation : la descente est volontaire et nécessaire.**__ La génération compte parmi les causes du mal : l'origine du mal pour les âmes, « c'est bien l'audace, __la génération__, l'altérité première et le fait de vouloir s'appartenir à elles-mêmes » ([[traite10|traité 10]], chap. 1 ; voir [[g-tolma|audace]]). Pourtant naître n'est pas un pur malheur, car sans naissance l'âme ne connaîtrait pas ce qu'elle peut : ses puissances « auraient existé en vain puisqu'elles ne seraient jamais parvenues à l'acte ; et __l'âme elle-même aurait ignoré les choses qu'elle possède__, puisqu'elles ne seraient même pas sorties pour se manifester. Car l'acte révèle partout la puissance qui sans lui demeurerait totalement cachée » ([[traite6|traité 6]], chap. 5). Les deux ne se contredisent pas, puisque « le volontaire est justement compris dans la nécessité » (*ibid*. ; voir [[g-sens-de-la-vie|sens de la vie]]). Plotin lui-même avoue que le passage reste obscur : redescendu de la contemplation, « je suis embarrassé pour savoir comment cette descente a lieu, aussi bien à ce moment-là qu'à présent, et __comment mon âme a jamais pu se trouver à l'intérieur de mon corps__ » (chap. 1).

    | Ce qui arrive | Ce qui le fait |
    | le corps de l'embryon se forme | l'âme du monde, qui prépare les demeures |
    | une âme individuelle y vient | sa disposition, qui la porte vers le corps approprié |
    | le vivant naît | quelque chose issu de l'âme descend, l'âme s'incline |

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 6, chap. 5 | sans la descente, l'âme ignorerait ce qu'elle possède |
    | traité 10, chap. 1 | la génération parmi les origines du mal |
    | traité 27, chap. 6 | l'âme du monde prépare à l'avance les demeures |
    | traité 27, chap. 7 | l'âme de l'enfant n'est pas celle de la mère |
    | traité 27, chap. 13 | l'âme descend comme à l'appel d'un héraut |
    | traité 53, chap. 12 | quelque chose issu de l'âme descend quand elle s'incline |

    **Voir aussi** : [[g-reproduction|Reproduction]] · [[g-mort|Mort]] · [[g-union-ame-corps|Union de l'âme et du corps]] · [[g-neusis|Inclination]] · [[g-tolma|Audace]]
