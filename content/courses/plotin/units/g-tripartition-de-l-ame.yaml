lessons:
- id: g-tripartition-de-l-ame-l1
  title: Tripartition de l'âme
  notes: |-
    Chez Plotin, la {violet}**tripartition de l'âme**{/violet} est [def]. Ce n'est pas {pink}trois âmes logées en trois endroits du corps{/pink} : c'est une même âme, dont les deux parties basses ne sont que des traces dans le corps vivant.

    __**Une seule âme, plusieurs puissances.**__ Plotin pose lui-même l'objection : « comment se fait-il, si l'âme est une, qu'il y ait une âme rationnelle, une autre irrationnelle et une autre encore, végétative ? » Sa réponse : ce sont des puissances, non des âmes, et **une chose qui a plusieurs puissances n'en est pas moins une** : « __dans la semence aussi il y a plusieurs puissances, et la semence reste une__ » ([[traite8|traité 8]], chap. 3). La semence est l'âme ; ses puissances, qui feront la racine, la tige, la fleur, sont la raison, la sensation et le [[g-vegetatif|végétatif]] ; et comme la semence ne se partage pas entre ce qu'elle fera, l'âme ne se partage pas entre ce qu'elle fait. On remarque que le trio a changé : ce n'est plus celui de Platon, c'est celui d'Aristote (raison, sensation, nutrition).

    __**Le désir et la colère viennent du corps vivant.**__ Où loger alors les deux parties basses de Platon ? Dans le végétatif, répond Plotin. Le {plum}désir{/plum} d'abord : son origine est « dans la région du foie, parce que c'est là surtout qu'est actif le végétatif » ([[traite28|traité 28]], chap. 28). La {plum}colère{/plum} ensuite, ce qui est moins évident, puisqu'elle suppose qu'on juge une injustice. Plotin en distingue deux sortes : « celle qui est éveillée de façon irrationnelle et qui entraîne la raison au moyen de la représentation, et une autre qui trouve son point de départ dans la raison et son terme dans ce qui est naturellement associé à la bile ». Mais toutes deux s'achèvent dans le corps, et « __ces deux sortes de colère dépendent de la faculté végétative__ » (même chapitre). La preuve : « ceux chez qui le désir des plaisirs corporels est moins impérieux et qui de façon générale méprisent le corps sont moins portés à la colère » (même chapitre). {coral}**Si la colère baisse quand baisse le désir, c'est qu'elles ont la même racine.**{/coral}

    __**La division est-elle encore correcte ?**__ D'où une objection : si le désir est le végétatif lui-même et la colère une trace qu'il laisse dans le sang et la bile, alors « __la division entre ces termes opposés n'est pas correcte, parce l'un des termes est antérieur et l'autre postérieur__ » ; on ne divise pas un genre en une chose et ce qui en découle. Plotin sauve la division en déplaçant ce qu'elle divise : « rien n'empêche que les deux termes soient postérieurs, et que la division porte sur deux termes qui dérivent d'un même terme. Cette division porte en effet sur __des désirs, en tant que ce sont des désirs__, et non sur la réalité dont ils viennent » (*ibid*.). {coral}Le désirant et l'agressif sont deux sortes de désirs, sœurs et non mère et fille{/coral} ; le végétatif, d'où elles viennent, n'est lui-même ni l'une ni l'autre.

    __**Le foie, le cœur, la tête : des points de départ, non des lieux.**__ Platon logeait chaque partie dans un organe. Plotin garde les organes, mais change ce qu'ils signifient : **l'âme est partout dans le corps, et un** __**organe**__ **marque seulement l'endroit d'où part son activité**. Pourquoi l'âme ne serait-elle pas dans l'organe ? Parce qu'elle est incorporelle : n'ayant pas d'étendue, elle ne peut être contenue en un endroit plutôt qu'en un autre, et Plotin le rappelle à propos de la sensation : « il vaut mieux ne pas dire que la puissance trouve là son point d'appui, __car la puissance est partout__, mais dire que __le point de départ de l'activité__ se trouve là où est le point de départ de l'instrument » ([[traite27|traité 27]], chap. 23). Et pourquoi tel organe plutôt que tel autre ? Parce qu'une puissance agit par un instrument, et qu'elle commence d'agir là où l'instrument commence ; Plotin le dit par l'image de l'artisan, dont la puissance doit trouver son appui « au point à partir duquel son instrument va être mis en mouvement » (*ibid*.). Il suffit alors de savoir où commence chaque instrument. La sensation et le mouvement passent par les nerfs, qui partent du cerveau : d'où la tête. Le végétatif nourrit le corps par le sang des veines, qui partent du foie : d'où le désir près du foie (*ibid*.). La colère se fait dans le sang qui bout : d'où le cœur, et dire qu'elle est « dans la région du cœur », « cela revient à dire __non pas que là est l'âme, mais que là est l'origine du sang__ qui joue un rôle dans la colère » ([[traite28|traité 28]], chap. 28).

    | Partie | Organe | Vertu civique | Ce qu'en fait Plotin |
    | raisonnante | la tête | la réflexion | l'âme proprement dite, ce que nous sommes |
    | agressive | le cœur | le courage | une trace de l'âme dans le sang et la bile |
    | désirante | le foie | la maîtrise de soi | une trace du végétatif dans le corps |

    __**Ce que nous sommes : ni le lion ni la bête.**__ Platon figurait l'âme par un homme, un lion et une bête à plusieurs têtes. Plotin reprend l'image pour dire ce qui est nous : le vivant est « un mixte dans ses éléments inférieurs », et « ces éléments inférieurs sont l'élément "léonin" puis la "bête sauvage multiple" » ; mais « __dans la mesure où l'homme véritable coïncide avec l'âme rationnelle__, tant que nous raisonnons c'est "nous" qui raisonnons » ([[traite53|traité 53]], chap. 7 ; voir [[g-hemeis|nous]]). Le {yellow}lion{/yellow} est la {yellow}colère{/yellow}, la {teal}bête multiple{/teal} les {teal}désirs{/teal} : nous les possédons, nous ne sommes pas eux.

    __**Plotin la reprend pour les vertus.**__ La division de Platon (raisonnante, agressive, désirante) sert d'abord à définir les {plum}quatre vertus civiques{/plum}, une par partie : « la {plum}réflexion{/plum}, qui correspond à __la partie raisonnante__ de l'âme, le {plum}courage{/plum}, qui correspond à __la partie agressive__, la {plum}maîtrise de soi{/plum} qui consiste en une certaine convenance et un certain accord de __la partie désirante__ de l'âme avec le __raisonnement__, et la {plum}justice{/plum} qui est l'accomplissement par chacune de ces parties en même temps que les autres de la tâche qui lui est propre » ([[traite19|traité 19]], chap. 1). Mais ce ne sont que les vertus d'en bas. Une justice qui règle des parties suppose des parties ; or « {coral}**la véritable justice en soi est le fait d'un seul être dans son rapport avec lui-même**{/coral}, d'un être dans lequel __il n'y a pas une partie, puis une autre partie__ » (chap. 6). {coral}La tripartition décrit donc l'âme mêlée au corps, non l'âme telle qu'elle est.{/coral}

    ! Tripartite ne veut pas dire {red}composée{/red}, donc dissoluble. À qui objecte que l'âme, « puisqu'elle est tripartite », « sera dissoute parce qu'elle est un composé », Plotin répond que « les âmes pures, lorsqu'elles sont affranchies, __abandonnent ce qui leur fut accolé à leur naissance__ » ([[traite2|traité 2]], chap. 14). Les parties basses ne sont pas des morceaux de l'âme, mais ce qui lui a été joint en entrant dans un corps : l'âme s'en défait sans se défaire (voir [[g-katharsis|purification]]).

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 2, chap. 14 | l'âme tripartite n'est pas dissoluble |
    | traité 8, chap. 3 | une seule âme, plusieurs puissances |
    | traité 19, chap. 1 | une vertu civique par partie de l'âme |
    | traité 19, chap. 6 | la vraie justice est d'un être sans parties |
    | traité 27, chap. 23 | la puissance est partout, son activité part de l'instrument |
    | traité 28, chap. 28 | désir et colère dépendent du végétatif |
    | traité 53, chap. 7 | le lion et la bête multiple ne sont pas nous |

    **Voir aussi** : [[g-vegetatif|Végétatif]] · [[g-hemeis|Nous]] · [[g-desir|Désir]] · [[g-katharsis|Purification]] · [[g-ame|Âme]]
