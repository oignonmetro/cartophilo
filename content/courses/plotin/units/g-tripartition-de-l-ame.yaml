# Entrée du glossaire de Plotin (skill glossaire), écrite le 2026-10-24 à la
# demande de l'utilisateur. Citations vérifiées sur la GF (I, 2, 1 et 6 ;
# IV, 9, 3 ; IV, 3, 23 ; IV, 4, 28 ; IV, 7, 14 ; I, 1, 7). La notice de la
# GF (traités 27-29) note que Plotin préfère à la tripartition une division
# en facultés inspirée d'Aristote, et que sa critique la plus claire est en
# IV, 4, 28. Le végétatif a son entrée (Végétatif), le « nous » la sienne.

id: g-tripartition-de-l-ame
title: Tripartition de l'âme
icon: book
