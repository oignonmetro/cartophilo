- id: g-multiplicite-sensible-l3
  title: La matière ne découpe pas la Forme
  notes: |-
    **Reste un piège, que les deux leçons précédentes pourraient tendre : se représenter la matière comme ce qui trancherait la Forme en morceaux, comme on partage un gâteau.** Plotin l'écarte : **la Forme demeure une, sans parties et impassible « là-bas » ; ce qui est multiple, c'est son image « ici-bas ».**

    __**La Forme ne donne rien d'elle-même.**__ Elle ne forme pas une partie du corps par une partie d'elle-même : elle reste tout entière présente à ce qu'elle informe. {red}Ce qui se divise avec le corps, c'est la masse, la matière{/red}, {green}non la raison qui l'informe{/green} : dans la raison séminale, la main, la tête, la racine, les branches sont toutes ensemble, et ne se dispersent que dans le corps ([[traite26|traité 26]], chap. 18).

    __**Le miroir.**__ Plotin compare la matière à {yellow}un miroir{/yellow} ([[traite26|traité 26]], chap. 7-9 et 13) : ce qui semble apparaître en elle n'est « qu'un jouet, fantôme sur ce qui n'est qu'un fantôme radical, comme ce qui apparaît dans un miroir est situé ailleurs que là où cela se manifeste » (chap. 7, l. 23-26). **Un miroir ne découpe pas ce qui s'y reflète** ; s'il y a plusieurs reflets, c'est que la surface offre des lieux distincts. La matière est même « plus impassible encore que les miroirs » (chap. 9).

    __**Le voile et la lumière.**__ Dans le {sky}*Parménide*{/sky} (131b-c), la Forme viendrait sur les choses comme {yellow}un voile{/yellow} étendu sur plusieurs hommes, chacun n'en recevant qu'une partie. Plotin répond que {red}le voile est un corps{/red}, et l'intelligible incorporel ; il retient plutôt {yellow}la lumière du jour{/yellow}, que proposait Socrate, une et entière partout où elle éclaire. Le [[traite22|traité 22]] pose d'abord que l'intelligible est présent tout entier partout, sans s'étaler sur les corps (chap. 2), puis écarte le voile (à partir du chap. 7).

    | Image | Ce qu'elle montre |
    | le miroir | l'original reste un, ses reflets sont multiples |
    | le voile | une Forme corporelle, objection écartée |
    | la lumière du jour | une et entière partout où elle éclaire |

    {coral}**En somme, la matière disperse l'image, non la Forme**{/coral} : substrat étendu, elle contraint le reflet de la Forme à s'égrener à travers l'espace.

    ! Plotin ne dit pas que la matière fragmente la Forme : la fragmentation est celle du reflet, et la Forme reste « là-bas » ce qu'elle est.
