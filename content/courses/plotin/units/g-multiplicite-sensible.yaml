lessons:
- id: g-multiplicite-sensible-l1
  title: Une multiplicité par degrés
  notes: |-
    **Chez Plotin, la multiplicité n'est pas une catégorie homogène : elle change de nature selon le degré de réalité, et c'est en bas de l'échelle, dans les corps, qu'elle devient pure dispersion.** Pour comprendre ce qu'est la multiplicité sensible, il faut donc la situer.

    __**Deux critères, une hiérarchie.**__ Plotin associe deux questions : une réalité est-elle {violet}divisible{/violet} ? est-elle {violet}multiple{/violet} ? En les croisant, il range tout le réel. Le [[traite4|traité 4]] cite le {sky}*Timée*{/sky} puis conclut : « C'est en ce sens que l'âme est une et multiple. Les corps sont seulement multiples. Mais ce qui est le plus élevé est seulement un » (chap. 2, l. 52-55).

    | Degré | Formule | Traduction |
    | ce qui est le plus élevé | *hen monon* | seulement un |
    | l'Âme | *hen kai polla* | une et multiple |
    | les formes dans les corps | *polla kai hen* | multiples et unes |
    | les corps | *polla monon* | seulement multiples |

    **Le [[traite10|traité 10]] (chap. 8) donne une autre échelle**, celle des trois hypostases, qu'il tire des trois premières hypothèses du {sky}*Parménide*{/sky} : l'Un (*hen*), puis l'Intellect, un-multiple (*hen polla*), puis l'Âme, une et multiple (*hen kai polla*).

    __**Ce qui fait la multiplicité des corps : avoir des parties hors des autres.**__ {sky}Dans le sensible{/sky}, diviser, c'est **séparer** : chaque partie occupe un lieu à part, hors des autres (**extériorité réciproque**), et elle est plus petite que le tout. {yellow}Coupez un bâton en deux : aucun des morceaux n'est le bâton.{/yellow} La raison en est que le corps est une {violet}masse{/violet} (*ogkos*) étendue selon trois dimensions : la quantité est sa marque propre. {violet}Dans l'intelligible{/violet}, au contraire, « toutes choses sont ensemble » (*homou panta*) : chaque partie contient le tout, sans division ni diminution.

    ! Au sommet de l'échelle du [[traite4|traité 4]], « ce qui est le plus élevé » n'est pas l'Un : c'est la réalité indivisible et toujours la même du *Timée* (35a), c'est-à-dire l'intelligible. Ce traité précoce s'en tient à cette tripartition (indivisible, Âme, divisible) ; l'Un, au-delà même de l'intelligible, est celui de V, 1, 8.

    ! Ne pas confondre *hen polla* (un-multiple, l'Intellect : la pluralité est prise dans l'unité) et *hen kai polla* (un **et** multiple, l'Âme : une par essence, multiple en se distribuant dans les corps).

    ! L'Âme aussi est multiple, mais pas à la manière d'un corps : elle est « divisible dans les corps » parce qu'elle agit en des corps distincts, mais elle reste entière en chacune de leurs parties (traités 4 et 22).
