id: g-multiplicite-sensible
title: Multiplicité sensible
subtitle: Les corps sont seulement multiples, et la Forme y apparaît dispersée sans se diviser
group: Multiplicité
icon: infinity
color: sky
lessons:
- id: g-multiplicite-sensible-l1
  title: Une multiplicité par degrés
  notes: |-
    **Chez Plotin, la multiplicité n'est pas une catégorie homogène : elle change de nature selon le degré de réalité.** Le critère est double, la divisibilité et la multiplicité, et il hiérarchise tout le réel (IV, 2 [4], 2 ; V, 1 [10], 8, où Plotin lit les hypothèses du *Parménide*).

    | Degré | Formule | Rapport au multiple |
    | Un | `hen` | sans parties, avant toute multiplicité |
    | Intellect | `hen polla` | un-multiple : les Formes ensemble |
    | Âme | `hen kai polla` | une, mais distribuée dans les corps |
    | Corps | seulement multiples | parties hors les unes des autres |

    **Deux multiplicités, deux manières d'avoir des parties.** {sky}Dans le sensible{/sky}, diviser, c'est **séparer** : chaque partie occupe un lieu à part, hors des autres (extériorité réciproque), et elle est plus petite que le tout. Coupez un bâton en deux : aucun des morceaux n'est le bâton. {violet}Dans l'intelligible{/violet}, au contraire, « toutes choses sont ensemble » (`homou panta`, formule d'Anaxagore) : chaque partie contient le tout, sans division ni diminution (voir la fiche « Multiplicité intelligible »).

    **Ce qui fait la multiplicité sensible : la masse et l'étendue.** Le corps est une masse (`ogkos`) étendue selon trois dimensions : la quantité est sa marque propre. La Forme, elle, n'a ni grandeur, ni masse, ni lieu.

    ! L'Âme aussi est multiple, mais pas à la manière d'un corps. Elle est « divisible dans les corps » parce qu'elle agit en des corps distincts, mais elle reste entière en chacune de leurs parties (traités 4 et 22).
