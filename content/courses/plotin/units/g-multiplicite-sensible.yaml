- id: g-multiplicite-sensible-l3
  title: La matière ne découpe pas la Forme
  notes: |-
    **Le piège : se représenter la matière comme ce qui trancherait la Forme en morceaux**, comme on partage un gâteau. Plotin écarte cette idée : **la Forme demeure une, sans parties et impassible « là-bas »** ; ce qui est multiple, c'est son **image** « ici-bas ».

    - **La Forme ne donne rien d'elle-même.** Elle ne se disperse pas dans la matière et ne forme pas une partie du corps par une partie d'elle-même : elle reste tout entière présente à ce qu'elle informe. Ce qui se divise avec le corps, c'est la matière, non la raison qui l'informe.
    - **Le miroir.** Plotin compare la matière à un **miroir** impassible (III, 6 [26], 7-9 et 13) : ce qui y apparaît n'est qu'un « fantôme sur un fantôme », situé ailleurs que là où il se manifeste. Un miroir ne découpe pas ce qui s'y reflète ; s'il y a plusieurs reflets, c'est que la surface offre des lieux distincts. La matière est même « plus impassible encore que les miroirs » (9, 18-19).
    - **Le voile.** Dans le *Parménide* (131b-c), la Forme viendrait sur les choses comme un **voile** étendu sur plusieurs hommes, chacun n'en recevant qu'une partie. Plotin répond que le voile est un corps, et l'intelligible incorporel ; il retient plutôt l'image de la **lumière du jour**, que proposait Socrate, une et entière partout où elle éclaire (traité 22, VI, 4).

    | Image | Ce qu'elle montre |
    | le miroir | l'original reste un, ses reflets sont multiples |
    | le voile | une Forme corporelle, objection écartée |
    | la lumière du jour | une et entière partout où elle éclaire |

    **En somme, la matière disperse l'image, non la Forme** : substrat étendu, elle contraint le reflet de la Forme à s'égrener en qualités séparées à travers l'espace.

    ! Plotin ne dit pas que la matière fragmente la Forme : la fragmentation est celle du reflet, et la Forme reste « là-bas » ce qu'elle est.
  points:
  - id: g-multiplicite-sensible-l3-1
    sentence: "La Forme ne donne rien d'elle-même à la matière : elle ne forme pas une partie du corps par une ___ d'elle-même, mais reste tout entière présente à ce qu'elle informe."
    answer: partie
    alt: []
  - id: g-multiplicite-sensible-l3-2
