- id: g-multiplicite-sensible-l2
  title: Pourquoi plusieurs hommes, plusieurs chevaux
  notes: |-
    **La Forme de l'homme est une, et pourtant il y a Socrate, Platon et une foule d'autres hommes : pourquoi les choses sensibles ne gardent-elles pas l'unicité de la Forme dont elles procèdent ?** Plotin donne trois raisons, qui se complètent.

    __**Le milieu est étendu.**__ Ce qui reçoit la Forme est une masse étendue : ce qui est un et sans grandeur ne peut y apparaître qu'éparpillé en des lieux distincts. {yellow}La forme intérieure de la maison{/yellow} (*to endon eidos*), une et sans parties dans l'esprit de l'architecte, {red}est divisée par la masse extérieure de la matière{/red} quand elle passe dans les pierres ([[traite1|traité 1]], chap. 3). De même, la grandeur d'un cheval n'appartient qu'au composé : le cheval sensible périt, sa masse s'en va, {green}la Forme du cheval demeure{/green} ([[traite26|traité 26]], chap. 16).

    __**Chaque chose reçoit selon sa capacité.**__ Le principe est posé en une phrase : « ce qui est présent est présent selon l'aptitude de ce qui le reçoit » ([[traite22|traité 22]], chap. 11, l. 3-5). Plotin le rend concret par {yellow}la voix{/yellow} : « Le son se trouve partout dans l'air, non pas comme un son unique est divisé, mais comme un seul son partout tout entier » (chap. 12, l. 9-11). **Chaque oreille entend le son tout entier, et pourtant il n'y a qu'un son** : les corps sont comme ces oreilles, chacun capte le même principe, à sa place. Ainsi l'homme intelligible, descendu dans tel homme, devient cet homme tout en restant l'homme intelligible : la multiplicité « se presse autour » de lui ([[traite23|traité 23]], chap. 6).

    __**Les individus ont leurs raisons propres.**__ Les individus ne diffèrent pas seulement par la matière : le [[traite18|traité 18]] admet autant de {violet}raisons{/violet} (*logoi*) que d'individus présentant des différences formelles ; ce qui distingue Socrate de Platon a sa raison dans l'intelligible. Et la raison séminale contient ensemble ce qui se déploiera dans l'espace : dans la {yellow}semence{/yellow}, « toutes choses sont ensemble », « chaque chose est toutes choses », et « la main et la tête ne sont pas séparées ; mais ici et maintenant, dans le corps, elles sont séparées l'une de l'autre. Car ce sont des images, et non des êtres véritables » ([[traite17|traité 17]], chap. 1, l. 10-12).

    ! Les choses sensibles ne sont pas des morceaux de la Forme, mais ses **images** (*eidôla*) : c'est pourquoi elles peuvent être plusieurs sans que la Forme cesse d'être une.
