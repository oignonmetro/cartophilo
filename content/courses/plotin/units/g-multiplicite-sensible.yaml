- id: g-multiplicite-sensible-l2
  title: Pourquoi plusieurs hommes, plusieurs chevaux
  notes: |-
    **La question.** La Forme de l'homme est une, et pourtant il y a Socrate, Platon et une foule d'autres hommes ; il n'y a qu'un cheval intelligible, et des chevaux par milliers. Pourquoi les choses sensibles ne gardent-elles pas l'unicité de la Forme dont elles procèdent ? **Trois raisons se complètent.**

    - **Le milieu étendu.** Ce qui reçoit la Forme est une masse étendue : ce qui est un et sans grandeur ne peut y apparaître qu'éparpillé en des lieux distincts. La **forme intérieure** de la maison (`to endon eidos`), une et sans parties dans l'esprit de l'architecte, est divisée par la masse extérieure de la matière quand elle passe dans les pierres (I, 6 [1], 3). De même, la grandeur et la masse d'un cheval n'appartiennent qu'au composé : le cheval sensible périt, sa masse s'en va, la Forme du cheval demeure (III, 6 [26]).
    - **L'aptitude de ce qui reçoit.** « Ce qui est présent est présent selon l'aptitude de ce qui le reçoit » (VI, 4 [22], 11). Plotin prend l'exemple de la **voix** : une seule voix, répandue dans l'air, est entendue tout entière par une multitude d'oreilles en des lieux différents (VI, 4, 12). Les corps sont comme ces oreilles : chacun capte le même principe, à sa place et selon sa capacité. Ainsi l'homme intelligible, descendu dans tel homme, devient cet homme tout en restant l'homme intelligible : la multiplicité « se presse autour » de lui (VI, 5 [23], 6).
    - **Les raisons des individus.** Les individus ne diffèrent pas seulement par la matière. Le traité 18 (V, 7, *S'il y a des idées des êtres individuels*) admet autant de **raisons** (`logoi`) distinctes que d'individus présentant des différences formelles : ce qui distingue Socrate de Platon a sa raison dans l'intelligible. La raison séminale (`logos spermatikos`) contient ensemble ce qui, dans le vivant, se déploiera dans l'espace et le temps : dans la **semence**, « toutes choses sont ensemble », et « la main et la tête ne sont pas séparées » ; ici, dans le corps, elles le sont, « car ce sont des images, et non des êtres véritables » (II, 6 [17], 1 ; voir aussi V, 9 [5], 6 et III, 2 [47], 2).

    ! Les choses sensibles ne sont pas des morceaux de la Forme, mais ses **images** (`eidôla`) : c'est pourquoi elles peuvent être plusieurs sans que la Forme cesse d'être une.
  points:
