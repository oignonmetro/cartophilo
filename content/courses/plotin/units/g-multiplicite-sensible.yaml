# Entrée du glossaire de Plotin (skill glossaire), refondue le 2026-10-21 :
# une leçon, cartes reprises avec leurs identifiants. Citations vérifiées sur
# la GF (IV, 2, 2 ; VI, 4, 11-12 ; III, 6, 7, 9 et 18 ; VI, 7, 1).

id: g-multiplicite-sensible
title: Multiplicité sensible
subtitle: Les corps sont seulement multiples, et la Forme y apparaît dispersée sans se diviser
group: Multiplicité
icon: infinity
color: sky
lessons:
- id: g-multiplicite-sensible-l1
  title: Multiplicité sensible
  notes: |-
    Chez Plotin, la {violet}**multiplicité sensible**{/violet} est celle des corps : {pink}des parties hors les unes des autres{/pink}, au plus bas d'une échelle où la multiplicité change de nature, et où {green}la Forme apparaît dispersée sans se diviser{/green}.

    __**Une échelle de la multiplicité.**__ Plotin croise deux questions : une réalité est-elle divisible ? est-elle multiple ? Le [[traite4|traité 4]] cite le {sky}*Timée*{/sky} puis conclut : « C'est en ce sens que l'âme est une et multiple. __Les corps sont seulement multiples__. Mais ce qui est le plus élevé est seulement un » (chap. 2). Le [[traite10|traité 10]] (chap. 8) en donne une autre, celle des trois hypostases : l'Un, l'Intellect un-multiple, l'Âme une et multiple.

    | Degré | Formule | Traduction |
    | ce qui est le plus élevé | *hen monon* | seulement un |
    | l'Âme | *hen kai polla* | une et multiple |
    | les formes dans les corps | *polla kai hen* | multiples et unes |
    | les corps | *polla monon* | seulement multiples |

    __**Diviser, dans le sensible, c'est séparer.**__ Chaque partie d'un corps occupe un lieu à part, hors des autres, et elle est plus petite que le tout. {yellow}Coupez un bâton en deux : aucun des morceaux n'est le bâton.{/yellow} La raison en est que le corps est une masse (*ogkos*) étendue : la quantité est sa marque propre. Dans l'intelligible, au contraire, chaque partie contient le tout (voir [[g-multiplicite-intelligible|multiplicité intelligible]]).

    __**Pourquoi plusieurs hommes, si la Forme de l'homme est une ?**__ C'est la difficulté centrale, et Plotin y répond par trois raisons. **Le milieu est étendu** : la forme de la maison, une dans l'esprit de l'architecte, est divisée par la masse des pierres quand elle y passe ([[traite1|traité 1]], chap. 3). **Chaque chose reçoit selon sa capacité** : « ce qui est présent est présent __selon l'aptitude de ce qui le reçoit__ » ([[traite22|traité 22]], chap. 11), {yellow}comme une voix{/yellow} qui « se trouve partout dans l'air, non pas comme un son unique est divisé, mais __comme un seul son partout tout entier__ » (chap. 12) : chaque oreille entend tout le son. **Les individus ont leurs raisons propres** : le [[traite18|traité 18]] admet autant de raisons (*logoi*) que d'individus qui diffèrent par la forme.

    __**La matière ne découpe pas la Forme.**__ Le piège serait de se représenter la matière tranchant la Forme comme on partage un gâteau. Mais la Forme ne donne rien d'elle-même : ce qui se divise avec le corps, c'est la masse, non la raison qui l'informe ([[traite26|traité 26]], chap. 18). {yellow}La matière est comme un miroir{/yellow} : ce qui y apparaît n'est « qu'un jouet, __fantôme sur ce qui n'est qu'un fantôme radical__, comme ce qui apparaît dans un miroir est situé ailleurs que là où cela se manifeste » (chap. 7). Un miroir ne découpe pas ce qui s'y reflète. Et contre {red}le voile{/red} du {sky}*Parménide*{/sky}, qui couvrirait chacun d'un morceau, Plotin retient {green}la lumière du jour{/green}, une et entière partout où elle éclaire ([[traite22|traité 22]]). **En somme, la matière disperse l'image, non la Forme.**

    | Image | Ce qu'elle montre |
    | le miroir | l'original reste un, ses reflets sont multiples |
    | le voile | une Forme corporelle, objection écartée |
    | la lumière du jour | une et entière partout où elle éclaire |

    ! Au sommet de l'échelle du traité 4, « ce qui est le plus élevé » n'est pas l'Un : c'est la réalité indivisible du *Timée*, l'intelligible. L'Un, au-delà même de l'intelligible, est celui du traité 10.

    **Voir aussi** : [[g-multiplicite-intelligible|Multiplicité intelligible]] · [[g-unite|Unité]] · [[g-hule|Matière]] · [[g-eidos|Forme]] · [[g-ame|Âme]]
  points:
  - id: g-multiplicite-sensible-l1-1
    sentence: "Chez Plotin, la multiplicité n'est pas une catégorie homogène : elle change de nature selon le ___ de réalité, de l'Un jusqu'aux corps (traité 4, chap. 2)."
    answer: degré
    alt: ["degre", "degrés", "niveau"]
  - id: g-multiplicite-sensible-l1-q1
    sentence: "Pour hiérarchiser le réel, Plotin croise deux critères : une réalité est-elle ___, et est-elle multiple ?"
    answer: divisible
    alt: []
  - id: g-multiplicite-sensible-l1-2
    sentence: "Dans l'échelle des trois hypostases (traité 10, chap. 8), l'Intellect, ni simple comme l'Un ni dispersé comme les corps, est un « un-multiple », en grec translittéré ___."
    answer: hen polla
    alt: []
  - id: g-multiplicite-sensible-l1-3
    sentence: "Dans l'échelle plotinienne des degrés d'unité (IV, 2, 2 ; V, 1, 8), l'Âme, une par essence mais distribuée dans les corps, est « une et multiple », en grec translittéré ___."
    answer: hen kai polla
    alt: []
  - id: g-multiplicite-sensible-l1-4
    sentence: "Au bas de l'échelle des degrés d'unité du traité 4 (traité 4, chap. 2), sous l'Âme et les formes dans les corps, les corps sont seulement ___ : leurs parties sont hors les unes des autres."
    answer: multiples
    alt: ["multiple"]
  - id: g-multiplicite-sensible-l1-10
    sentence: "Au bas de l'échelle des degrés d'unité du traité 4 (traité 4, chap. 2, l. 54), les corps sont « seulement multiples », en grec translittéré ___."
    answer: polla monon
    alt: []
  - id: g-multiplicite-sensible-l1-11
    sentence: "Dans l'échelle des degrés d'unité du traité 4 (traité 4, chap. 2), entre l'Âme et les corps, les formes dans les corps sont « multiples et unes », en grec translittéré ___."
    answer: polla kai hen
    alt: []
  - id: g-multiplicite-sensible-l1-13
    sentence: "Au sommet de l'échelle des degrés d'unité du traité 4, qui est l'intelligible indivisible et non encore l'Un : « Les corps sont seulement multiples. Mais ce qui est le plus ___ est seulement un » (traité 4, chap. 2)."
    answer: élevé
    alt: ["eleve"]
  - id: g-multiplicite-sensible-l1-12
    sentence: "L'échelle des trois hypostases (l'Un, l'Intellect un-multiple, l'Âme une et multiple) est tirée, en V, 1, 8, des hypothèses du ___ de Platon."
    answer: Parménide
    alt: ["Parmenide", "parménide"]
  - id: g-multiplicite-sensible-l1-5
    sentence: "Le traité où Plotin hiérarchise les réalités par leur degré d'unité et de divisibilité, l'Âme y étant une et multiple, est le traité ___ (IV, 2)."
    answer: "4"
    alt: ["quatre"]
  - id: g-multiplicite-sensible-l1-6
    sentence: "Dans le sensible, diviser, c'est séparer : chaque partie occupe un lieu à part, et les parties sont entre elles dans un rapport d'___ réciproque."
    answer: extériorité
    alt: ["exteriorite"]
  - id: g-multiplicite-sensible-l1-q2
    sentence: "Coupez un bâton en deux : aucun des morceaux n'est le bâton. C'est que, dans le sensible, chaque partie est plus ___ que le tout."
    answer: petite
    alt: []
  - id: g-multiplicite-sensible-l1-7
    sentence: "À la multiplicité sensible, où les parties sont séparées, Plotin oppose celle de l'intelligible, où, selon la formule d'Anaxagore, « toutes choses sont ___ » (*homou panta*)."
    answer: ensemble
    alt: []
  - id: g-multiplicite-sensible-l1-8
    sentence: "Ce qui fait la multiplicité propre aux corps est leur masse étendue selon trois dimensions, en grec ___."
    answer: ogkos
    alt: ["onkos"]
  - id: g-multiplicite-sensible-l1-9
    sentence: "L'Âme est dite « divisible dans les corps » parce qu'elle agit en des corps distincts, mais elle reste ___ en chacune de leurs parties."
    answer: entière
    alt: ["entiere", "tout entière"]
  - id: g-multiplicite-sensible-l2-1
    sentence: "La forme intérieure de la maison (*to endon eidos*) est une et sans parties dans l'esprit de l'architecte ; quand elle passe dans les pierres, elle est divisée par la ___ extérieure de la matière (traité 1, chap. 3)."
    answer: masse
    alt: ["ogkos"]
  - id: g-multiplicite-sensible-l2-2
    sentence: "L'exemple de la maison, une dans l'esprit de l'architecte et divisée dans les pierres, se trouve dans le traité ___ (I, 6), sur le beau."
    answer: "1"
    alt: ["un", "premier"]
  - id: g-multiplicite-sensible-l2-3
    sentence: "La grandeur et la masse d'un cheval n'appartiennent qu'au ___ : quand le cheval sensible périt, sa grandeur s'en va avec lui, et la Forme du cheval demeure intacte (traité 26, chap. 16)."
    answer: composé
    alt: ["compose"]
  - id: g-multiplicite-sensible-l2-q1
    sentence: "« Ce qui est présent est présent selon l'___ de ce qui le reçoit » (traité 22, chap. 11, l. 3-5)."
    answer: aptitude
    alt: []
  - id: g-multiplicite-sensible-l2-q2
    sentence: "« Ce qui est présent est présent selon l'aptitude de ___ » (traité 22, chap. 11, l. 3-5)."
    answer: ce qui le reçoit
    alt: ["ce qui le recoit"]
  - id: g-multiplicite-sensible-l2-q3
    sentence: "« Le son se trouve partout dans l'air, non pas comme un son unique est ___, mais comme un seul son partout tout entier » (traité 22, chap. 12, l. 9-11)."
    answer: divisé
    alt: ["divise"]
  - id: g-multiplicite-sensible-l2-q4
    sentence: "« Le son se trouve partout dans l'air, non pas comme un son unique est divisé, mais comme un seul son ___ » (traité 22, chap. 12, l. 9-11)."
    answer: partout tout entier
    alt: []
  - id: g-multiplicite-sensible-l2-6
    sentence: "Dans l'exemple plotinien de la voix une, entendue tout entière en des lieux différents, les corps qui reçoivent un même principe intelligible jouent le rôle des ___."
    answer: oreilles
    alt: []
  - id: g-multiplicite-sensible-l2-q5
    sentence: "Les exemples du son entendu tout entier par chaque oreille et du principe selon lequel ce qui est présent l'est selon l'aptitude de ce qui le reçoit se lisent aux chapitres 11-12 du traité ___."
    answer: 22 (VI, 4)
    alt: ["22", "VI, 4"]
  - id: g-multiplicite-sensible-l2-7
    sentence: "L'homme intelligible descendu dans tel homme devient cet homme tout en restant l'homme intelligible : la multiplicité, dit Plotin, se ___ autour de lui (traité 23, chap. 6)."
    answer: presse
    alt: []
  - id: g-multiplicite-sensible-l2-8
    sentence: "Les individus d'une même espèce ne diffèrent pas seulement par la matière : pour Plotin (V, 7), il y a autant de ___ distinctes que d'individus présentant des différences formelles."
    answer: raisons
    alt: ["logoi"]
  - id: g-multiplicite-sensible-l2-9
    sentence: "Le traité où Plotin se demande s'il y a des idées des êtres individuels, et admet une raison propre à Socrate, est le traité ___ (V, 7)."
    answer: "18"
    alt: ["dix-huit"]
  - id: g-multiplicite-sensible-l2-10
    sentence: "Dans la ___, les parties du futur vivant sont présentes ensemble sans être séparées ; elles ne s'écartent les unes des autres qu'en se déployant dans le corps."
    answer: semence
    alt: ["graine", "sperma"]
  - id: g-multiplicite-sensible-l2-12
    sentence: "Dans la semence, dit Plotin, « toutes choses sont ensemble », et « la main et la ___ ne sont pas séparées » ; elles ne le sont qu'ici, dans le corps (traité 17, chap. 1)."
    answer: tête
    alt: ["tete"]
  - id: g-multiplicite-sensible-l2-14
    sentence: "« C'est comme dans la semence où toutes choses sont ensemble, où chaque chose est ___ choses, et où la main et la tête ne sont pas séparées » (traité 17, chap. 1)."
    answer: toutes
    alt: []
  - id: g-multiplicite-sensible-l2-15
    sentence: "Dans le corps, la main et la tête, ensemble dans la semence, « sont séparées l'une de l'autre. Car ce sont des ___, et non des êtres véritables » (traité 17, chap. 1)."
    answer: images
    alt: ["image"]
  - id: g-multiplicite-sensible-l2-13
    sentence: "Le passage où Plotin dit que, dans la semence, la main et la tête ne sont pas séparées, alors qu'elles le sont dans le corps, se trouve au chapitre 1 du traité ___ (II, 6)."
    answer: "17"
    alt: ["dix-sept"]
  - id: g-multiplicite-sensible-l2-11
    sentence: "Les choses sensibles peuvent être plusieurs sans que la Forme cesse d'être une, parce qu'elles n'en sont pas des morceaux, mais des ___ (*eidôla*)."
    answer: images
    alt: ["image", "reflets"]
  - id: g-multiplicite-sensible-l3-1
    sentence: "La Forme ne donne rien d'elle-même à la matière : elle ne forme pas une partie du corps par une ___ d'elle-même, mais reste tout entière présente à ce qu'elle informe."
    answer: partie
    alt: []
  - id: g-multiplicite-sensible-l3-2
    sentence: "Ce qui se divise avec le corps, pour Plotin, c'est la masse et la matière, non la ___ qui l'informe (traité 26, chap. 18)."
    answer: raison
    alt: ["logos", "forme"]
  - id: g-multiplicite-sensible-l3-3
    sentence: "Pour dire que la Forme apparaît dans le sensible sans y être découpée ni altérée, Plotin compare la matière à un ___ impassible (traité 26, chap. 7)."
    answer: miroir
    alt: []
  - id: g-multiplicite-sensible-l3-q1
    sentence: "Ce qui semble apparaître dans la matière n'est « qu'un jouet, fantôme sur ce qui n'est qu'un ___ radical, comme ce qui apparaît dans un miroir est situé ailleurs que là où cela se manifeste » (traité 26, chap. 7, l. 23-26)."
    answer: fantôme
    alt: ["fantome"]
  - id: g-multiplicite-sensible-l3-q2
    sentence: "Ce qui semble apparaître dans la matière n'est « qu'un jouet, fantôme sur ce qui n'est qu'un fantôme radical, comme ce qui apparaît dans un miroir est situé ___ que là où cela se manifeste » (traité 26, chap. 7, l. 23-26)."
    answer: ailleurs
    alt: []
  - id: g-multiplicite-sensible-l3-q3
    sentence: "Un miroir ne découpe pas ce qui s'y reflète : s'il y a plusieurs reflets, c'est que sa surface offre des ___ distincts."
    answer: lieux
    alt: []
  - id: g-multiplicite-sensible-l3-5
    sentence: "Plotin pousse l'image du miroir jusqu'à dire que « la matière est plus impassible encore que les ___ » (traité 26, chap. 9)."
    answer: miroirs
    alt: []
  - id: g-multiplicite-sensible-l3-6
    sentence: "Le traité où Plotin compare la matière à un miroir impassible, dans son étude de l'impassibilité des incorporels, est le traité ___ (III, 6)."
    answer: "26"
    alt: ["vingt-six"]
  - id: g-multiplicite-sensible-l3-7
    sentence: "Contre l'objection du *Parménide* (131b-c), selon laquelle la Forme couvrirait les choses comme un ___ dont chacune n'aurait qu'une partie, Plotin rappelle que l'intelligible est incorporel."
    answer: voile
    alt: []
  - id: g-multiplicite-sensible-l3-8
    sentence: "Plutôt que l'image du voile, Plotin retient celle de la ___ du jour, une et entière partout où elle éclaire."
    answer: lumière
    alt: ["lumiere"]
  - id: g-multiplicite-sensible-l3-q4
    sentence: "En somme, la matière disperse l'___, non la Forme : substrat étendu, elle contraint le reflet de la Forme à s'égrener à travers l'espace."
    answer: image
    alt: []
