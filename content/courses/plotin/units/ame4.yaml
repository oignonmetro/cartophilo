- id: ame4-l3
  title: "Volontaire et nécessaire ; les deux fautes"
  notes: |-
    **La descente est à la fois volontaire et nécessaire, parce que pour l'âme les deux coïncident :** {green}**{teal}« {/teal}{teal}le volontaire{/teal} est justement compris dans {teal}la nécessité »{/teal}**{/green} ([[traite6|traité 6]], 5, 1-4). C'est ainsi que Plotin réconcilie la faute et la mission.

    **« Volontaire » : un mouvement propre.** Il ne s'agit pas d'un choix entre plusieurs possibles : l'âme n'a pas la liberté de ne pas descendre. Le {violet}volontaire{/violet} ({blue}*hekousion*{/blue}) désigne un mouvement qu'aucune force extérieure ne contraint. Plotin parle d'une {violet}**inclinaison autonome**{/violet} ({blue}*rhopê autexousios*{/blue}) : l'âme vient dans le corps {teal}« {/teal}{teal}__par une libre inclinaison__{/teal}, et {teal}pour exercer sa puissance{/teal} et {teal}__mettre en ordre ce qui vient après elle__ »{/teal} (5, 26). Ce qui est **involontaire**, c'est le pire auquel elle aboutit.

    **« Nécessaire » : une loi de sa nature.** La nécessité n'est pas une contrainte extérieure, mais **{teal}« {/teal}{teal}une loi éternelle{/teal}** **{teal}de la nature »{/teal}** (5, 9-11) : la nature même de l'âme, qu'elle tient de son principe. Dire qu'un dieu l'a envoyée n'est donc pas faux, puisque tout doit être rapporté au principe dont il est issu.

    **Comment les deux coïncident.** {coral}Une âme qui ne descendrait jamais cesserait d'être âme, puisque c'est sa fonction de gouverner qui la distingue de l'Intellect.{/coral} En descendant, elle **suit sa nature** (volontaire) et **s'inscrit dans l'ordre de l'univers** (nécessaire). {yellow}Le musicien de talent joue parce qu'il le veut, et pourtant il ne pourrait pas ne jamais jouer sans cesser d'être musicien.{/yellow}

    **Les deux fautes** (5, 16-24). {teal}« {/teal}Cependant, étant donné que {teal}__la faute de l'âme est double__{/teal}, l'une concernant {teal}la cause de la descente{/teal}, l'autre {teal}le mal qu'elle commet quand elle est arrivée ici-bas{/teal}, le châtiment de la première faute est {teal}__cela même qu'elle subit en descendant__{/teal} […]{teal} »{/teal}.

    | Faute | En quoi elle consiste | Son châtiment |
    | la première | la cause de la descente | ce qu'elle subit en descendant |
    | la seconde | le mal commis ici-bas | plonger dans d'autres corps |

    {coral}Le premier châtiment n'est pas ajouté du dehors : c'est la descente même, avec ses peines.{/coral} Plotin retrouve les deux moments du mythe du *{sky}Phèdre{/sky}* : l'alourdissement de l'âme avant sa chute, puis la vie plus ou moins juste qu'elle mène dans le corps.

    **Un problème qui restera.** Ce traité parle d'une **double faute**, parce que l'âme choisit de venir ici-bas ; le [[traite53|traité 53]], à la fin de la vie de Plotin, dira au contraire que **l'inclinaison n'est pas une faute** (voir [[ame5|l'unité suivante]]).

    ! « Volontaire » ne veut pas dire « choisi » : l'âme adhère à sa nature, elle ne délibère pas. Et « nécessaire » ne veut pas dire « forcé » : la nécessité, c'est sa nature même.
  points:
