- id: ame4-l4
  title: "Pourquoi la descente est un bien : la puissance qui doit se donner"
  notes: |-
    **La descente n'est pas seulement une peine qu'on explique : c'est une œuvre. L'âme descend pour exercer sa puissance, et cette puissance vient de l'Un, qui ne la retient pas :** {coral}**une puissance qui s'arrêterait avant le corps serait une avarice**{/coral}. C'est la justification la plus profonde de la descente, et l'arme de Plotin contre les gnostiques.

    **Une puissance qui ne s'exerce pas existe en vain.** Les puissances de l'âme, si elles étaient restées en repos dans l'incorporel, {red}{teal}« {/teal}auraient {teal}existé en vain »{/teal}{/red} ([[traite6|traité 6]], 5, 31). {teal}« {/teal}L'acte {teal}__révèle partout la puissance__{/teal} qui sans lui {teal}demeurerait totalement cachée »{/teal}. Plus encore, l'âme elle-même aurait ignoré ce qu'elle possède : {coral}le corps est ce par quoi l'âme devient visible à elle-même{/coral}. {yellow}Un pianiste qui n'aurait jamais touché un clavier ne saurait même pas qu'il l'est.{/yellow}

    **La puissance sans jalousie.** Le [[traite6|traité 6]] fonde ce point sur ce qui fonde tout le système (chap. 6) : s'il n'y avait que l'Un, tout resterait caché ; de même, il ne faut pas qu'existent seulement des âmes sans que leurs produits deviennent visibles. La puissance venue de l'Un {green}{teal}« {/teal}{teal}ne doit pas s'immobiliser{/teal}, comme bornée par {teal}la jalousie »{/teal}{/green}, mais avancer jusqu'à l'ultime limite possible (le dieu du *{sky}Timée{/sky}* était bon, et le bon est sans jalousie). D'où la conclusion : {teal}« {/teal}tout est {teal}__solidaire pour toujours__ »{/teal}, l'intelligible et le sensible, le sensible imitant l'intelligible autant qu'il le peut (6, 25-28). Le verbe grec dit que tout est **tenu ensemble** ({blue}*sunechetai*{/blue}).

    **Chacun doit donner de lui-même.** Le [[traite33|traité 33]], contre les gnostiques, le redit avec une image : l'âme, toujours illuminée, fournit la lumière aux choses qui la suivent, {yellow}{teal}« {/teal}comme si {teal}un feu{/teal} demeurait quelque part {teal}au centre{/teal}, et que venaient {teal}se réchauffer{/teal} ceux qui le peuvent{teal} »{/teal}{/yellow}. Et l'argument : {teal}« {/teal}nécessairement, {teal}__chacun doit donner de lui-même à un autre__{/teal}, ou {teal}le Bien ne sera pas un bien{/teal}, l'Intellect un intellect, ou l'Âme cela qu'elle est{teal} »{/teal} (3, 1-11). {coral}Donner n'est pas un accident de l'Âme, c'est son essence : une Âme qui ne donnerait rien ne serait plus une âme.{/coral}

    **Contre une Âme qui serait tombée par oubli.** Les gnostiques racontent que l'Âme du monde s'est inclinée et a produit le monde après avoir oublié les réalités d'en haut. Plotin répond : {teal}« {/teal}Si l'âme s'est inclinée, c'est manifestement parce qu'elle a oublié les réalités de là-bas. Mais {teal}__si elle les a oubliées, comment peut-elle produire__ ?{/teal} Car d'où lui vient sa capacité de produire, sinon {teal}des réalités qu'elle a vues là-bas ? »{/teal} ([[traite33|traité 33]], 4, 7-9). {coral}Produire, c'est imiter ce qu'on contemple : une âme qui aurait oublié l'intelligible n'aurait plus rien à reproduire.{/coral}

    **Même la chute instruit.** L'âme peut remonter après avoir éprouvé le mal : {teal}« {/teal}l'expérience du mal offre {teal}__une connaissance plus manifeste du bien__ »{/teal} à ceux qui sont trop faibles pour le connaître par une science préalable ([[traite6|traité 6]], chap. 7). {yellow}On ne mesure la santé qu'après avoir été malade{/yellow} : non que la maladie soit bonne, mais le contraste instruit.

    ! Justifier la descente, ce n'est pas justifier le mal : c'est montrer que la production du monde par l'âme est un don nécessaire, et que la souffrance vient seulement de ce qu'une âme s'y enferme.
  points:
  - id: ame4-l4-p1
    sentence: "__La puissance de l'âme vient de l'Un, qui ne la retient pas__ : une puissance qui s'arrêterait avant le corps serait une ___."
    answer: "avarice"
