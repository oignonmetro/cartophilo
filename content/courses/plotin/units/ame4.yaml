# Cours « L'âme et sa descente », voir l'en-tête de ame1.yaml.
# ame4 : pourquoi l'âme descend. Ce que Lacroix et Narbonne supposent connu
# (la cause de la descente, le volontaire et le nécessaire, les deux fautes,
# la puissance qui doit se manifester) est repris des cours des traités 6,
# 10 et 27 (citations GF) ; s'y ajoutent Narbonne, p. 696-697 (le Phèdre
# contre la République et le Timée), p. 700-701 (traités 33, 3 et 4) et
# Lacroix, p. 100-107 (le traité 27 et la décision des âmes, ῥοπὴ
# αὐτεξούσιος).

id: ame4
title: "Pourquoi l'âme descend"
subtitle: "Une faute ou une mission ? L'audace, l'isolement, une inclinaison volontaire et nécessaire, une puissance qui doit se manifester"
group: "L'âme et sa descente"
icon: scale
color: teal
lessons:
- id: ame4-l1
  title: "Le problème : une faute ou une mission ?"
  notes: |-
    **La descente pose une question que Plotin trouve chez Platon même :** {amber}**l'âme vient-elle dans le corps par sa faute, ou envoyée par le dieu pour achever l'univers ?**{/amber} Toute la doctrine de la descente est une manière de tenir les deux à la fois.

    **L'embarras de Plotin.** Le [[traite6|traité 6]] s'ouvre sur l'âme vue **par le haut** : Plotin, {teal}« {/teal}{teal}redescendu de l'Intellect{/teal} vers {teal}le raisonnement »{/teal}, ne sait pas {teal}« {/teal}{teal}__comment cette descente a lieu__ »{/teal}, ni comment son âme a jamais pu se trouver dans son corps, si elle est vraiment telle qu'elle s'est montrée. {coral}Quand on part de l'âme en elle-même, ce n'est plus la sortie du corps qui étonne, c'est l'entrée.{/coral}

    **Deux séries de textes chez Platon.**

    | Conception | Dialogues | La descente est… |
    | pessimiste | Phédon, République, Phèdre | une faute et une peine |
    | cosmologique | Timée | un achèvement voulu par le dieu |

    - Dans la première série, {red}l'âme est enchaînée, ensevelie dans le corps, dans la caverne ; elle a perdu ses ailes{/red} : elle est responsable de sa chute et la subit comme une peine.
    - Dans le *{sky}Timée{/sky}*, {green}l'âme est donnée par la bonté du démiurge pour que l'univers soit intelligent{/green} : sans elle, il manquerait au monde les genres de vivants qu'il doit contenir.

    {amber}Si la descente est une faute, comment le dieu peut-il l'avoir voulue ? Si elle est voulue par le dieu, comment peut-elle être une faute ?{/amber}

    **Ce que Plotin en tire.** {sky}Narbonne{/sky} montre que la tension entre ces énoncés lui fournit l'occasion d'une de ses conceptions les plus célèbres. On peut soutenir à la fois :

    - {amber}avec le *Phèdre*{/amber} (248a et suiv.), que l'âme est **condamnée à descendre** dans le devenir ;
    - {amber}avec la *République* et le *Timée*{/amber}, que cette descente **n'abolit pas la structure profonde, intellective et divine, de l'âme**, qui se maintient dans la descente.

    L'âme en perd peut-être **conscience** en cours de route, mais elle peut, à force d'exercices philosophiques, la reconquérir par elle-même, puisqu'elle ne l'a jamais définitivement perdue (voir [[ame6|l'âme non descendue]]). Les successeurs de Plotin, {sky}Jamblique{/sky} puis {sky}Proclus{/sky}, tireront au contraire du *Phèdre* l'essentiel de leurs objections : pour eux, l'âme descend tout entière.

    ! Plotin ne reproche pas à Platon d'être incohérent : il lit ses deux séries de textes comme deux points de vue sur une même réalité, la descente vue du côté de l'âme qui la fait et du côté de l'univers qui la reçoit.
  points:
