- id: ame4-l2
  title: "La cause : l'audace et l'isolement"
  notes: |-
    **Ce qui fait descendre l'âme n'est pas le corps, qui ne la tire pas, ni un décret qui l'y envoie : c'est un mouvement de l'âme elle-même,** {red}**l'audace de vouloir s'appartenir**{/red}**, par lequel elle quitte le tout pour s'occuper d'une partie.**

    **L'audace.** Le [[traite10|traité 10]] s'ouvre sur la question : qu'est-ce qui a fait que les âmes ont oublié le dieu qui est leur père ? Réponse : {teal}« {/teal}L'origine du mal pour elles, c'est bien {teal}__l'audace__{/teal}, la génération, l'altérité première et {teal}__le fait de vouloir s'appartenir à elles-mêmes__ »{/teal} (chap. 1). L'{violet}audace{/violet} ({blue}*tolma*{/blue}) n'est pas un accident qui frappe l'âme du dehors : c'est **l'usage qu'elle fait de sa propre indépendance**, en courant dans la direction opposée à son principe, jusqu'à oublier sa lignée.

    **L'isolement.** Le [[traite6|traité 6]] décrit le même mouvement de l'intérieur (chap. 4). Tant que les âmes restent avec l'Âme totale, elles gouvernent avec elle sans descendre, {yellow}comme ceux qui aident le roi à gouverner sans quitter les demeures royales{/yellow}. Puis {teal}« {/teal}les âmes s'éloignent de ce tout que forme l'Âme pour {teal}__devenir une partie__{/teal} et {teal}__être leurs propres maîtres__ »{/teal}, comme fatiguées d'être avec une autre. Le reste suit pas à pas : l'âme cesse de regarder l'intelligible, **s'isole, s'affaiblit, s'affaire**, se juche sur un seul objet, son corps, sans cesse heurté par tout le reste, et le gouverne avec embarras en pénétrant profondément en lui. {coral}La chute n'est pas d'avoir un corps, c'est de rétrécir son attention à une partie.{/coral}

    **Pas un décret divin : une loi inscrite dans l'âme.** Au [[traite27|traité 27]], Plotin se distancie des thèses gnostiques : {green}la descente est le fait des âmes individuelles elles-mêmes{/green}, {red}non d'un décret divin{/red} (13, 17). Elles aperçoivent leur image {yellow}{teal}« {/teal}comme si c'était dans le {teal}miroir de Dionysos »{/teal}{/yellow} et s'élancent (chap. 12) ; chacune va vers le corps qui correspond à sa disposition, sans qu'on l'envoie, et descend, le moment venu, {yellow}comme à l'appel d'un héraut{/yellow} (chap. 13). Elle ne vient {red}ni de son plein gré, au sens d'un choix{/red}, {red}ni envoyée{/red} : c'est {green}comme un bond naturel{/green}.

    {yellow}Le fonctionnaire qui quitte le conseil du roi pour administrer seul un village toujours menacé{/yellow} : il n'a pas été chassé, il a voulu être son propre maître, et c'est son nouveau poste qui l'accable.

    ! L'âme n'est pas punie pour avoir un corps, comme si le corps était mauvais : elle souffre parce qu'elle s'est enfermée dans le souci d'une partie au lieu de gouverner avec le tout.
  points:
