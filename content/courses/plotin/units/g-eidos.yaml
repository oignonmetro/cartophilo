# Entrée du glossaire de Plotin (skill glossaire), écrite le 2026-10-21 (elle
# était vide). Citations vérifiées sur la GF (V, 9, 5, 7, 12 et 14 ; V, 5, 6 ;
# VI, 5, 8). L'identité de l'Intellect et des Formes a ses cartes dans
# l'entrée Intelligibles dans l'Intellect.

id: g-eidos
title: Forme (`eidos`)
subtitle: La réalité intelligible qui fait être chaque chose ce qu'elle est, vivante et pensante dans l'Intellect, dont les formes des corps ne sont que les images
icon: book
color: teal
lessons:
- id: g-eidos-l1
  title: Forme
  notes: |-
    Chez Plotin, la {violet}**Forme**{/violet} (*eidos*, ou idée) n'est {pink}ni une pensée que l'Intellect produirait ni un modèle inerte hors de lui{/pink} : c'est la {green}réalité qui fait être chaque chose ce qu'elle est{/green}, vivante et pensante dans l'[[g-intellect|Intellect]], dont les formes des corps ne sont que les images.

    __**Les Formes sont les choses qui sont réellement.**__ Plotin reprend Platon : ce qui est véritablement, ce n'est pas le corps, c'est la Forme. « L'Intellect est donc __les choses qui sont réellement__, et il ne les pense pas comme si elles étaient ailleurs » ; il est « __la loi même de leur être__ » ([[traite5|traité 5]], chap. 5). Le sensible, lui, n'est ce qu'il est que par emprunt : « c'est du fait de la participation que les choses sensibles sont ce que l'on dit d'elles », comme l'airain reçoit sa figure de la statuaire. Voir [[g-intelligibles-dans-l-intellect|intelligibles dans l'Intellect]].

    __**Ni produites par la pensée, ni extérieures à elle.**__ La difficulté vient d'une formule reçue, selon laquelle les Formes seraient les pensées de l'Intellect. Elle est juste si l'on entend que chaque Forme est un intellect ; fausse si l'on entend que l'Intellect les fabrique en les pensant : « il n'est pas exact d'affirmer que les Formes sont des pensées, si l'on veut dire par là que, quand l'Intellect la pense, telle ou telle Forme naît ou existe ; car __il faut que l'intelligible soit antérieur à cette intellection__ » (chap. 7). **L'antériorité est de nature, non de temps** : la Forme n'attend pas d'être pensée, elle est elle-même pensée en acte. Ce n'est donc pas un idéalisme.

    __**De quoi y a-t-il des Formes ?**__ De tout ce qui a une raison d'être bonne : de l'homme, des vivants, des techniques qui imitent la nature. Pas du mal ni du rebut : « ce que l'Intellect reçoit du Premier, ce sont __les choses les meilleures__ dans leur totalité ; et parmi les Formes il n'y a pas » la saleté ni la boue (chap. 14), qui ne remontent qu'à l'Âme. Le traité 5 dit encore qu'il y a une Forme de l'homme, « __non pas celle de Socrate__ » (chap. 12) ; le [[traite18|traité 18]] corrige : il y a une idée de chaque individu (voir [[g-logos-spermatikos|raison séminale]]).

    __**Les formes des corps sont des images.**__ La forme qu'on voit dans une statue ou un vivant n'est pas la Forme elle-même, mais une raison venue de l'[[g-ame|Âme]] et reflétée dans la matière : « cet univers, puisqu'il __participe à des images__, montre que les choses qui sont diffèrent de leurs images » (chap. 5). Et la Forme ne se partage pas en se donnant : « l'idée, puisqu'elle ne peut se disperser, __n'a rien donné d'elle-même à la matière__ » ([[traite23|traité 23]], chap. 8). Elle est présente tout entière à chaque partie, sans rien perdre (voir [[g-multiplicite-sensible|multiplicité sensible]] et [[g-hule|matière]]).

    __**L'Un est sans forme.**__ Ce qui naît de l'Un est « la forme non pas d'une chose, mais de toutes choses », si bien qu'« __il est nécessaire que l'Un soit dépourvu de forme__ » ([[traite32|traité 32]], chap. 6). Ce n'est pas un manque comme celui de la matière, mais une surabondance : il donne toutes les formes parce qu'il n'en a aucune (voir [[g-au-dela-de-l-etre|au-delà de l'être]] et [[g-beaute|beauté]]).

    | | Forme intelligible | Forme dans un corps |
    | Où | dans l'Intellect | dans la matière |
    | Statut | réalité, intellect vivant | image, raison venue de l'Âme |
    | Rapport aux autres | toutes ensemble | séparées dans l'étendue |
    | Durée | immuable | change et périt |

    ! Deux absences de forme sont à ne pas confondre : la matière est sans forme par pauvreté, elle ne peut rien retenir ; l'Un est sans forme par puissance, il est au-delà de toutes.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 5, chap. 5 | l'Intellect est les choses qui sont réellement |
    | traité 5, chap. 7 | l'intelligible est antérieur à l'intellection |
    | traité 5, chap. 14 | pas de Formes du mal ni du rebut |
    | traité 23, chap. 8 | l'idée ne donne rien d'elle-même à la matière |
    | traité 32, chap. 6 | l'Un est dépourvu de forme |

    **Voir aussi** : [[g-intelligibles-dans-l-intellect|Intelligibles dans l'Intellect]] · [[g-logos|Raison]] · [[g-hule|Matière]] · [[g-methexis|Participation]] · [[traite5|Traité 5]]
