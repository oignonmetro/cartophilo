  points:
  - id: g-eidos-l1-q1
    sentence: "La réalité intelligible qui fait être chaque chose ce qu'elle est, l'idée, se dit en grec translittéré ___."
    answer: eidos
    alt: ["eîdos", "idea"]
  - id: g-eidos-l1-q2
    sentence: "« L'Intellect est donc les choses qui sont ___, et il ne les pense pas comme si elles étaient ailleurs » (traité 5, chap. 5)."
    answer: réellement
    alt: ["reellement"]
  - id: g-eidos-l1-q3
    sentence: "« L'Intellect est pour ainsi dire le premier législateur, ou plutôt, il est la ___ même de leur être » (traité 5, chap. 5)."
    answer: loi
    alt: []
  - id: g-eidos-l1-q4
    sentence: "« C'est du fait de la ___ que les choses sensibles sont ce que l'on dit d'elles » (traité 5, chap. 5)."
    answer: participation
    alt: []
  - id: g-eidos-l1-q5
    sentence: "Les Formes ne naissent pas quand l'Intellect les pense, « car il faut que l'intelligible soit ___ à cette intellection » (traité 5, chap. 7)."
    answer: antérieur
    alt: ["anterieur"]
  - id: g-eidos-l1-q6
    sentence: "« Ce que l'Intellect reçoit du Premier, ce sont les choses les ___ dans leur totalité » : il n'y a pas de Formes de la saleté ni de la boue (traité 5, chap. 14)."
    answer: meilleures
    alt: []
  - id: g-eidos-l1-q7
    sentence: "Dans le traité 5, il y a dans l'Intellect la Forme des termes universels : « non pas celle de ___, mais celle de l'homme » (chap. 12)."
    answer: Socrate
    alt: []
  - id: g-eidos-l1-q8
    sentence: "« Cet univers, puisqu'il participe à des ___, montre que les choses qui sont diffèrent de leurs images » (traité 5, chap. 5)."
    answer: images
    alt: []
  - id: g-eidos-l1-q9
    sentence: "« L'idée, puisqu'elle ne peut se ___, n'a rien donné d'elle-même à la matière » (traité 23, chap. 8)."
    answer: disperser
    alt: []
  - id: g-eidos-l1-q10
    sentence: "Ce qui naît de l'Un est la forme de toutes choses, si bien qu'« il est nécessaire que l'Un soit dépourvu de ___ » (traité 32, chap. 6)."
    answer: forme
    alt: []
  - id: g-eidos-l1-q11
    sentence: "La matière est sans forme par pauvreté ; l'Un est sans forme par ___, au-delà de toutes."
    answer: puissance
    alt: ["surabondance"]
