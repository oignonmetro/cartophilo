id: g-desir
title: Désir (`ephesis`)
subtitle: Le désir du Bien, plus ancien que la pensée et présent en toute chose, que l'amour du beau suppose et ne remplace pas
icon: book
color: coral
lessons:
- id: g-desir-l1
  title: Désir
  notes: |-
    Chez Plotin, le {violet}**désir**{/violet} (*ephesis*) du Bien n'est pas {pink}une passion de l'âme{/pink} : c'est l'{green}élan de toute chose vers le Bien{/green}, plus ancien que la pensée elle-même, et qui la fait naître.

    __**L'Intellect pense parce qu'il désire.**__ Pourquoi y a-t-il de la pensée ? « Voici ce qu'est intelliger : __un mouvement qui se porte vers le Bien__ en le désirant. Car __le désir a engendré l'intellection__ et l'a fait exister avec lui » ([[traite24|traité 24]], chap. 5). La difficulté est d'admettre qu'un désir précède la pensée la plus haute : l'{violet}[[g-intellect|Intellect]]{/violet} n'est pas d'abord un regard neutre posé sur des objets, mais un élan vers le Bien qui, en se portant vers lui, devient pensée. **Le désir est donc plus originaire que la pensée.**

    __**Le désir du Bien et l'amour du beau.**__ Le désir du Bien est connaturel, présent même à ceux qui dorment ; l'amour du beau suppose d'avoir vu le beau, et il provoque la stupeur, le choc, les **douleurs de l'enfantement** ([[traite32|traité 32]], chap. 12). La raison : {coral}le Beau, que Plotin rattache à l'Intellect, vient en second ; le Bien est plus ancien{/coral}. On peut ignorer la [[g-beaute|beauté]] ; on ne peut pas ne pas désirer le Bien.

    | Le désir du Bien | L'amour du beau |
    | connaturel, présent même à ceux qui dorment | suppose d'avoir vu le beau |
    | doux, sans stupeur | stupeur, choc, plaisir mêlé de douleur |

    ! Le désir n'est pas ici un manque à combler par un objet extérieur : désirer le Bien, c'est se tourner vers ce dont on vient, et c'est ce retour qui fait être ce qui désire.

    **Voir aussi** : [[g-amour|Amour]] · [[g-beaute|Beauté]] · [[g-intellect|Intellect]] · [[g-un|Un]]
