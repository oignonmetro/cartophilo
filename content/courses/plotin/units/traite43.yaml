- id: traite43-l5
  title: "Ni la quantité, ni la qualité, ni le bien"
  notes: |-
    **La quantité** (chap. 13) : les genres premiers viennent simultanément avec l'être ; le nombre, lui, est postérieur à ces genres et à lui-même, puisque chaque nombre vient du précédent. La grandeur est plus postérieure et plus composée encore. Peut-être le nombre est-il un mélange de mouvement et de repos, et la grandeur un mouvement.

    **La qualité** (chap. 14-15) : elle vient après la réalité, qui l'a pour accompagnement sans être complétée par elle. Ce qui complète une réalité n'est qualité que par le nom (traité 17) ; l'homme est une réalité qui vient d'en haut, déjà animal avant d'être raisonnable. Le mouvement non plus n'est pas une qualité : acte de ce qui est en acte, il est la réalité même ; et l'être, « un-multiple » dès l'origine, est aussi altérité et identité. Ces quatre genres suffisent à la réalité ; en descendant apparaissent la réalité qualifiée et la réalité quantifiée.

    | Candidat | Rapport à l'être | L'objection |
    | la quantité | postérieure | le nombre vient après les genres et après lui-même |
    | la qualité | accompagnement | elle vient après la réalité |
    | le relatif, le où, le quand | entre deux choses | un genre doit être un |
    | le bien | au-delà, ou dans l'acte | le Premier n'est prédiqué de rien |
    | le beau, la science, les vertus | mouvements ou activités | ils sont postérieurs |

    **Les autres catégories** (chap. 16) : le relatif, « une sorte de rejeton », suppose deux choses ; il n'y a pas de lieu là-bas, et le temps, mesure du mouvement, lui est postérieur ; agir et pâtir sont des mouvements, l'avoir une dualité, l'être situé trois choses.

    **Le bien, le beau, les vertus** (chap. 17-18) : le Bien premier n'est prédiqué de rien et vient avant la réalité. Le bien de l'être, c'est l'acte qui le porte vers le Bien : sa vie, son mouvement, déjà compté parmi les genres. Le beau est l'Un, ou l'éclat postérieur de l'idée, ou un mouvement en nous. La science est un mouvement, vision de l'être ; l'Intellect, composé de tous les êtres, n'est pas un genre ; les vertus sont des activités particulières de l'intellect.

    ! Le mouvement et le repos complètent la réalité sans être des qualités : ils lui sont simultanés.
