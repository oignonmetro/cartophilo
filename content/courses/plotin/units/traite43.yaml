- id: traite43-l2
  title: "La méthode : du corps à l'âme"
  notes: |-
    **Partir du corps** (4, 1-21) : dans une pierre, il y a un substrat, une quantité, une qualité ; ils sont tout ensemble, mais la raison les distingue en trois genres, et avec le mouvement, quatre genres font un seul corps. Pour l'intelligible, il faut retrancher le devenir, la sensation et la grandeur, et chercher comment ce qui est un de cette façon est aussi plusieurs.

    **L'âme, une et multiple** (4, 21-6, 20) : l'âme paraît simple, sans grandeur. Mais les corps, multiples, viennent d'une unité qui n'est pas l'Un en soi, puisque celui-ci ne produirait pas une multiplicité discontinue : ils viennent d'une **unité multiple, l'âme**. « L'âme est la "raison", la somme des "raisons" » ; sa réalité est la puissance des raisons. Être, pour elle, n'est pas comme être pour la pierre : c'est l'être-âme, non au sens où l'homme est blanc, mais comme une réalité particulière. Son être est « sa source et son principe » : **être et vie ne font qu'un**. Elle est une en elle-même et multiple en rapport avec les autres ; c'est sa contemplation qui la fait apparaître multiple, pour penser, car si elle apparaissait une, elle serait déjà ce qu'elle pense.

    | Niveau | Unité | Multiplicité |
    | le corps | un seul corps | substrat, quantité, qualité, mouvement |
    | l'âme | une en elle-même | la somme des raisons |
    | l'être | un-multiple | les genres premiers |

    Alors que l'être est un et multiple, l'âme est multiple et une : c'est la troisième hypothèse du *Parménide*.

    ! L'âme n'est pas une unité composée de plusieurs choses, mais une nature unique qui est plusieurs choses.
