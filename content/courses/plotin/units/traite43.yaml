- id: traite43-l6
  title: "Les genres et leurs espèces : l'Intellect"
  notes: |-
    **Le problème** (chap. 19) : chaque genre engendre-t-il seul ses espèces ? Non : les différences viennent du dehors, des trois autres genres qui s'unissent à l'être. Mais il ne faut pas laisser le genre disparaître dans ses espèces : il est à la fois en chacune et en lui-même, mélangé et pur.

    **L'Intellect total et les intellects particuliers** (chap. 20) : comme la science totale, qui n'est aucune de ses espèces mais la puissance de toutes, l'Intellect total est antérieur aux intellects particuliers, qui le contiennent chacun dans sa particularité.

    | Terme | En acte | En puissance |
    | l'Intellect total | toutes choses ensemble | chaque intellect particulier |
    | un intellect particulier | ce qu'il est | l'Intellect total |
    | une espèce de science | ce qu'elle est | toutes ses parties |

    **La multiplicité dans l'Intellect** (chap. 21) : l'Intellect est un et plusieurs, et sa multiplicité est faite de puissances sans bornes. On y voit la grandeur, la qualité, la figure ; l'altérité sépare quantité et qualité, l'identité fait l'égalité et l'altérité l'inégalité, d'où les cercles, les quadrilatères, les nombres pairs et impairs. L'Intellect est **une « raison » unique, grande, parfaite**, qui possède toutes les raisons : ce que le raisonnement découvre dans la nature y existe sans raisonnement. Contenant les êtres, il est le « Vivant total », le « Vivant-en-soi ».

    **Platon à mots couverts** (chap. 22) : le *Timée* (l'intellect contemple les formes dans le vivant total), le *Parménide* (« la réalité se morcelle en parties illimitées ») et le *Philèbe* (laisser l'espèce ultime se disperser dans l'illimité) disent cette doctrine. Actif en lui-même, l'Intellect produit d'autres intellects ; actif hors de lui, l'âme, partie de partie. L'âme a deux activités, vers le haut et vers le bas ; la plus basse touche la matière, comme un reflet dans un miroir.

    ! Le rapport des hypostases n'est pas celui du genre à l'espèce, mais celui du modèle à l'image.
