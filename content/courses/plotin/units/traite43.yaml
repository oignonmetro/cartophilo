id: traite43
title: "Traité 43 (VI, 2) : Sur les genres de l'être II"
subtitle: "Les cinq grands genres du Sophiste"
icon: compass
color: sky
lessons:
- id: traite43-l1
  title: "L'être, un-multiple"
  notes: |-
    **Le point de vue de Plotin** (chap. 1) : après les dix genres d'Aristote et les quatre genres stoïciens, il faut formuler sa propre opinion, en la ramenant à celle de Platon. Puisque l'être n'est pas un, il faut se demander s'il y a un genre unique, des genres indépendants, des principes, et si principes et genres coïncident. Il faut d'abord distinguer **l'être du devenir**, que les autres prennent pour l'être (*Timée* 27d). Cette distinction ne divise pas un genre en deux espèces : « il serait aussi ridicule de mettre l'être avec le non-être sous un genre unique, que de mettre Socrate et son portrait sous le même genre ».

    **Un-multiple** (chap. 2) : l'être est en même temps **un et multiple**, comme l'être de la deuxième hypothèse du *Parménide*. Il a plusieurs genres, dont aucun n'est subordonné à un autre, et qui sont aussi des principes :

    | Cas | Principe | Genre |
    | les genres de l'être | l'être est fait de leur multiplicité | ils ont sous eux des espèces |
    | les quatre éléments | ils composent le monde sensible | ils n'ont rien sous eux |
    | l'Un | les genres viennent de lui | il n'entre pas dans leur définition |

    Un genre unique, dont les autres seraient les espèces, détruirait sa propre thèse : l'un ne peut devenir plusieurs sans rien hors de lui.

    **L'Un au-delà** (chap. 3) : les genres viennent de l'Un, mais l'Un, au-delà, n'est pas compté parmi eux : si tu engendres la marche, tu n'es pas le genre de la marche. Les êtres forment une seule nature, que divisent les actes de notre intellect, parce que nous ne voyons pas tout à la fois.

    ! Que les genres viennent de l'Un ne fait pas de l'Un leur genre : la cause n'est pas un prédicat de ce qu'elle produit.
