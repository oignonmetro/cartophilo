- id: traite43-l3
  title: "Les cinq genres premiers"
  notes: |-
    **L'être et le mouvement** (7, 1-24) : dans l'âme, on voit la réalité et la vie ; si l'on y introduit l'Intellect et sa vie, le mouvement commun à toute vie est un genre. Réalité et mouvement ne font qu'un, mais la pensée les sépare. Dans le sensible, la séparation est visible : comme le portrait d'un homme manque de vie, l'être sensible n'est qu'**une ombre de l'être**. Le mouvement n'est placé ni sous l'être ni au-dessus, mais avec lui : **le mouvement est l'acte de l'être**, et l'être est en acte, non en puissance.

    **Le repos** (7, 24-45) : là-bas subsiste ce qui est « dans l'identité et de la même manière » ; le repos est donc un genre, différent du mouvement dont il est le contraire, et différent de l'être, sans quoi mouvement et repos, identiques à l'être, deviendraient une seule chose.

    **Le même et l'autre** (chap. 8) : Plotin invite à contempler l'Intellect pur, « le foyer de la réalité », une lumière qui ne s'assoupit pas, une pensée tournée non vers l'avenir mais vers le « déjà ». Penser est son acte et son mouvement ; se penser, sa réalité et son être. La forme en repos est la limite de l'intellect, l'intellect le mouvement de la forme. Qui voit ces trois genres comme trois, chacun un, voit **l'autre** ; qui les ramène à un, voit **le même**.

    | Genre | Dans l'Intellect | Ce qui le fait voir |
    | l'être | ce qui est pensé | le point d'appui le plus sûr |
    | le mouvement | la pensée, la vie | l'acte de l'être |
    | le repos | la forme, limite de l'intellect | l'identité de manière |
    | l'autre | les trois genres distingués | chacun est un |
    | le même | les trois genres réunis | une seule et même chose |

    Ce sont des **genres premiers** : rien ne leur est attribué dans la définition de leur être, et l'être participe d'eux sans qu'ils lui soient antérieurs. L'interprétation, très originale, marquera le néoplatonisme : les genres du *Sophiste* décrivent l'Intellect.

    ! Le mouvement n'est pas une espèce de l'être : il est sur le même plan que lui, et l'être en participe.
