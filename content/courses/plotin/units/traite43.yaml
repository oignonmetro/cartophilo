- id: traite43-l7
  title: "Repérage : le plan du traité 43"
  notes: |-
    **Le traité 43 pose les questions préliminaires (chap. 1-3), fixe la méthode (chap. 4-6), décrit les cinq genres premiers (chap. 7-8), écarte tous les autres (chap. 9-18), puis passe des genres à leurs espèces (chap. 19-22).**

    | Moment | Lieu | Ce qui s'y joue |
    | la position platonicienne | 1, 1-5 | ramener à Platon |
    | six questions | 1, 5-16 | genres et principes |
    | l'être et le devenir | 1, 16-33 | Socrate et son portrait |
    | l'un-multiple | chap. 2-3 | la marche engendrée |
    | partir du corps | 4, 1-21 | la pierre |
    | partir de l'âme | 4, 21-6, 20 | la somme des raisons |
    | le mouvement et l'être | 7, 1-24 | le portrait sans vie |
    | le repos | 7, 24-45 | dans l'identité |
    | l'être, le repos et le mouvement | 8, 1-34 | le foyer de la réalité |
    | le même et l'autre | 8, 25-49 | cinq genres |
    | l'un-être | chap. 9-12 | l'armée et le chœur |
    | la quantité | chap. 13 | le nombre postérieur |
    | la qualité | chap. 14-15 | les compléments de la réalité |
    | les autres catégories | chap. 16 | le rejeton |
    | le bien | chap. 17 | l'acte vers le Bien |
    | le beau | 18, 1-8 | l'éclat sur l'idée |
    | les vertus | 18, 8-17 | activités de l'intellect |
    | genres et espèces | chap. 19 | mélangé et pur |
    | l'Intellect et les intellects particuliers | chap. 20 | la science et ses espèces |
    | la multiplicité dans l'Intellect | chap. 21-22 | Platon à mots couverts |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! Le plan détaillé fait se chevaucher les deux moments du chapitre 8 (lignes 25 à 34).
