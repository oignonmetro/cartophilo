- id: traite43-l4
  title: "L'un n'est pas un genre"
  notes: |-
    **Ni l'Un ni l'un qui est** (chap. 9) : pourquoi l'un ne serait-il pas un genre premier ? L'Un absolument un, auquel on ne peut rien ajouter, n'est prédiqué de rien : il n'est pas un genre. « L'un qui est », attaché à l'être, n'est plus l'Un de premier rang. Sans différences, l'un ne produit pas d'espèces ; le diviser, c'est produire le multiple et le détruire. Et l'un qui est, de toute façon, ne peut être le genre des êtres :

    | L'un qui est | Par rapport aux êtres | Pourquoi ce n'est pas un genre |
    | postérieur | il accompagne tous les êtres | le genre doit être antérieur |
    | simultané | il est avec toutes choses | le genre n'est pas simultané |
    | antérieur | il est le principe de l'être | un principe n'est pas un genre |

    Voisin de l'Un, il « se refuse à constituer un genre, en restant lui-même un et en souhaitant ne pas être divisé ».

    **Arguments nouveaux** (chap. 10) : ici-bas, « un » se dit comme d'une armée ou d'un chœur. De tout être on affirme l'un avec son opposé, le multiple, ce qu'aucun genre ne permet. « L'un n'est pas un nombre », et il en deviendrait un en devenant genre. Le point est dans les lignes sans être leur genre ; le simple est principe du composé, non son genre.

    **L'un et le bien** (chap. 11-12) : « un » n'a pas le même sens dans le chœur, l'armée, le navire, la maison, le continu ; tous imitent le même un, l'Intellect de plus près. Une armée n'a pas moins d'être qu'une maison, mais moins d'unité : **l'unité ressemble au bien**, car chaque chose désire non simplement être, mais être avec le bien. Pour le point, le cercle est le bien. Le genre est tout entier dans chacune de ses espèces, comme un tout présent en plusieurs parties.

    ! L'un est partout dans l'être, mais un caractère commun n'est pas toujours un genre : il lui faudrait des différences propres.
