- id: traite22-l5
  title: "Chacun reçoit selon son aptitude : l'oreille et l'assemblée"
  notes: |-
    **« Ce qui est présent est présent selon l'aptitude de ce qui le reçoit »** (11, 6-7). Si l'intelligible est tout entier partout, pourquoi toutes choses ne le reçoivent-elles pas tout entier ? Parce que chacune n'en reçoit que ce qu'elle peut, comme **le diaphane** et le **milieu trouble** reçoivent différemment la lumière. Le premier, le deuxième et le troisième se distinguent **par le rang, la puissance et les différences, non par les lieux** ; l'intelligible a une variété simple et une multiplicité une.

    **L'oreille** (chap. 12) : un même son, porté par l'air, est entendu tout entier par chaque oreille présente ; plusieurs yeux voient la même forme. De même, **ce qui peut recevoir une âme la recevra**, et d'un même principe. Le corps ne participe pas d'une partie de l'âme, mais d'elle tout entière : **« c'est ce dernier qui est venu vers l'âme »** (12, 40-41). L'âme n'est pas un point (chap. 13) : elle est partout parce qu'elle est indivisible.

    **Qui sommes-nous ?** (chap. 14) La même âme suffit à chaque vivant, car elle est illimitée et contient toutes les âmes et tous les intellects. **Avant la génération, nous étions là-bas des hommes différents**, des parties de l'intelligible jamais séparées. Un nouvel homme a désiré exister et **« s'est enroulé lui-même autour de nous »** : nous sommes devenus ces deux hommes à la fois.

    **L'assemblée** (chap. 15) : le corps, venu au voisinage de l'âme, en recueille une **trace**, comme une chaleur ou une illumination. Faible, il crie et trouble l'ensemble, comme dans une assemblée où les anciens restent assis à réfléchir tandis que **le peuple indiscipliné** réclame de la nourriture. Si le pire domine, c'est un mal pour la cité comme pour l'homme.

    ! Les différences entre vivants ne viennent pas de l'âme, qui est la même : elles viennent de l'aptitude inégale de ce qui la reçoit.
