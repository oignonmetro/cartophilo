- id: traite22-l6
  title: "Descendre, c'est se trouver dans un corps"
  notes: |-
    **Le chapitre 16 accorde la doctrine avec les traditions anciennes sur l'âme** : la descente et la remontée périodiques, les jugements, les entrées dans les corps d'autres vivants (le décret d'Adrastée, *Phèdre*, 248c-249b).

    - Participer de l'intelligible, ce n'est pas pour lui descendre ici-bas, mais **pour la nature d'ici-bas être en lui**. Ce que les anciens disent « être venu », c'est **le corps** ; et cette venue n'est pas locale.
    - **« Descendre » signifie « se trouver dans un corps »** : l'âme donne au corps quelque chose d'elle-même sans lui appartenir ; « s'en aller », c'est que le corps n'a plus de communauté avec elle.
    - **Cette communauté est un mal pour l'âme ; son bien est de s'en affranchir.** Liée à un corps, elle devient une âme particulière : son activité n'est plus tournée vers l'ensemble. Ainsi le **savant** n'exerce son activité que sur une partie de sa science, alors que son bien serait d'en avoir en vue la totalité ; ainsi un **feu** capable de tout brûler serait contraint de brûler peu de chose.
    - **« Descendre dans l'Hadès »**, si l'Hadès est l'invisible, c'est être séparé. Si la philosophie libère complètement l'âme, seule son **image** descend dans la région inférieure ; l'âme vit d'une vie pure dans l'intelligible.

    Le traité s'arrête là : « Poursuivons en reprenant à nouveau notre sujet initial. » La suite est le traité 23 (VI, 5).

    ! Descendre n'est pas un déplacement : l'âme se distingue du tout par son activité, non par le lieu.
