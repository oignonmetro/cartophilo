- id: traite22-l4
  title: "La main, la sphère lumineuse et l'image"
  notes: |-
    **Il ne convient pas de diviser l'intelligible en plusieurs choses, mais de ramener à l'unité les choses multiples** (chap. 7) : ce sont elles, dispersées, qui donnent l'impression que l'intelligible est divisé en elles.

    **Deux images** :

    | Image | Ce qu'elle montre |
    | la main qui tient un morceau de bois de plusieurs coudées | une puissance domine tout un corps sans se diviser en autant de parties que lui |
    | une petite masse lumineuse au centre d'une sphère transparente | si l'on supprime la masse, la lumière est partout, sans source ni lieu |

    Il suffit, par la pensée, de **faire abstraction de la masse** : il ne reste qu'une puissance indivisible, présente en chaque partie.

    **Ce que montre la main** : une main, de petite taille, soulève une poutre bien plus grande qu'elle ; sa puissance s'étend à toute la poutre sans se diviser en autant de morceaux que le bois. La grandeur et la divisibilité appartiennent au corps, non à la force incorporelle qui le soutient.

    **Le principe** (chap. 8) : **si le divisible est une affection du corps en tant que corps, l'indivisible est une affection de l'incorporel en tant qu'incorporel.** Ce qui a une grandeur participe de ce qui n'en a pas sans le diviser ; les choses qui aspirent à l'indivisible participent de lui tout entier, autant qu'elles en sont capables.

    **Les puissances ne sont pas coupées de leur source** (chap. 9-10) : l'image d'une chose, comme une lumière plus faible, ne peut exister séparée d'elle. L'objection du **portrait**, qui subsiste sans son modèle, ne vaut pas : le portrait est l'œuvre du peintre ; les vraies images sont celles des **eaux, des miroirs et des ombres**, qui naissent de leur modèle et n'existent pas sans lui.

    **L'objection du voile** (*Parménide*, 131b-c) : la forme viendrait sur les choses comme un voile sur plusieurs hommes, chacun n'en recevant qu'une partie. Plotin la contourne : le voile est un corps, l'intelligible est incorporel ; d'où l'image de la **lumière du jour**, que proposait Socrate (131b).

    ! La métaphore de la main suppose qu'on retire sa masse : c'est la puissance seule, non le corps de la main, qui est l'image de l'intelligible.
