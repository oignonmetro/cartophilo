- id: traite22-l7
  title: "Repérage : le plan du traité 22"
  notes: |-
    **Le traité 22 donne deux des cinq explications de la présence de l'être partout (chap. 2-6, puis 7-16) ; le traité 23 donne les trois autres.**

    | Moment | Lieu | Ce qui s'y joue |
    | comment l'âme est-elle partout ? | chap. 1 | deux solutions du Timée et apories |
    | le sensible dans l'intelligible | chap. 2 | l'univers véritable et son imitation |
    | la puissance et la présence entière | chap. 3 | chaque vivant reçoit une puissance |
    | plusieurs âmes, une âme | chap. 4 | la multiplicité par l'altérité |
    | le corps s'avance vers l'âme | chap. 5-6 | grande sans masse ; le même juge |
    | la main et la sphère lumineuse | chap. 7 | une puissance sans masse |
    | l'incorporel, sans lieu ni division | chap. 8-10 | l'image ne se coupe pas de son modèle |
    | selon l'aptitude de ce qui reçoit | chap. 11 | le diaphane et le milieu trouble |
    | l'oreille et le son | chap. 12-13 | le corps est venu vers l'âme |
    | qui sommes-nous ? | chap. 14 | l'homme de là-bas et le second homme |
    | l'assemblée | chap. 15 | le peuple et les anciens |
