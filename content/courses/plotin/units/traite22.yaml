id: traite22
title: "Traité 22 (VI, 4) : Sur la raison pour laquelle l'être, un et identique, est partout tout entier I"
subtitle: "Le sensible est dans l'intelligible"
icon: compass
color: sky
lessons:
- id: traite22-l1
  title: "La question : comment l'âme est-elle partout ?"
  notes: |-
    **Les traités 22-23, qui n'en formaient sans doute qu'un seul à l'origine, exposent la théorie plotinienne de la participation du sensible à l'intelligible.** Platon n'en a pas donné de solution détaillée : il se contente de souligner le caractère mystérieux et embarrassant de la participation (*Timée*, 50c et 51a-c). Plotin forge donc lui-même ses arguments.

    **Deux principes platoniciens**, admis dès les premiers traités :

    | Principe | Source |
    | la forme intelligible est présente tout entière à chacune des choses sensibles | *Parménide*, 131a-b |
    | l'âme du monde s'étend à l'univers tout entier | *Timée*, 34b-36e |

    **Les traités 2, 4 et 8 préparent le terrain** : l'âme incorporelle peut être tout entière en plusieurs endroits (traité 2) ; l'intelligible est indivisible et sans lieu (traité 4) ; toutes les âmes n'en font qu'une (traité 8). Mais cette omniprésence, acceptée jusqu'ici sans procès, **mérite une justification**.

    **L'aporie du chapitre 1** : l'âme est-elle partout parce que le corps de l'univers a une grandeur, ou bien est-ce **par elle-même**, le corps découvrant l'âme déjà présente là où il est placé ? Elle ne s'étend pas comme une qualité : le blanc de deux parties est le même **par la forme**, non par le nombre, alors que l'âme du pied et de la main est **la même par le nombre**, comme le montrent les perceptions (1, 22-26).

    D'où la question (1, 29-31) : **comment, en étant incorporelle et sans grandeur, l'âme peut-elle atteindre l'extension la plus grande ?** C'est sans doute le premier traité écrit après l'arrivée de Porphyre auprès de Plotin, vers 263.

    ! L'âme n'est pas divisée comme une qualité qui s'étend sur un corps : on la dit divisée seulement en ce sens qu'elle est partout.
