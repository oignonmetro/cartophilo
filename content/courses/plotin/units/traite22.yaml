- id: traite22-l2
  title: "Le renversement : le sensible est dans l'intelligible"
  notes: |-
    **Thèse du chapitre 2 : ce n'est pas l'intelligible qui se trouve dans le sensible, c'est le sensible qui se trouve dans l'intelligible.** « Il existe à la fois un univers véritable et une imitation de cet univers », le visible (2, 1-2).

    - **L'univers véritable ne se trouve en rien**, car rien n'existe avant lui ; ce qui vient après lui se trouve en lui, et en dépend pour être en repos ou en mouvement.
    - **L'être ne peut être dans le non-être** ; le non-être, s'il existait, serait dans l'être. Dire de l'intelligible qu'il est partout, c'est dire qu'il est **dans l'être**, donc en lui-même : « partout » signifie « dans l'être » et « en lui-même » (2, 25-26).
    - Notre embarras vient de ce que nous posons l'être dans le sensible et le croyons grand : en vérité, **ce qu'on dit grand est petit**, et ce qu'on croit petit est grand.
    - Le monde sensible, ne pouvant ni circonscrire l'intelligible ni entrer en lui, **« désirait courir autour de lui »** (2, 35) : il tourne sur lui-même, jouissant partout de l'intelligible tout entier. Pour ce qui est sans lieu, il n'y a **ni loin ni près**.

    **Le chapitre 3 précise** : l'intelligible est présent tout entier, mais chaque vivant ne reçoit qu'une **puissance** de lui, à la mesure de ce qu'il peut retenir. N'appartenant à aucune des choses qui désirent lui appartenir, il est présent comme **l'objet de leur désir**. On ne peut diviser ni sa vie, ni l'Intellect, ni l'être : la partie ne serait plus ni vie, ni intellect, ni être.

    ! « Partout » ne désigne pas une extension dans l'espace : c'est une manière de dire que toute chose est dans l'être.
