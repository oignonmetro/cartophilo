- id: traite22-l3
  title: "Une âme et des âmes multiples"
  notes: |-
    **Comment peut-il y avoir plusieurs âmes et plusieurs intellects, si l'être est un partout ?** (chap. 4) L'objection semble forte : il y a l'âme du monde et les autres âmes.

    **La réponse : la multiplicité vient de l'altérité, non du lieu.** L'être est multiple, mais « l'être s'approche de l'être » et « il est tout ensemble » (4, 24-25, d'après Parménide) ; de même l'Intellect, et de même les âmes. L'expression « divisible dans les corps » signifie que cette nature est **indivisible** : on se la représente divisée par rapport à chaque partie du corps, mais elle est partout entière.

    - **Les âmes multiples et l'âme unique existaient avant les corps**, chacune en acte : elles « se dissocient sans être dissociées », comme **les multiples sciences dans une âme unique**. C'est ainsi que cette nature est **illimitée** (4, 39-46).
    - **L'âme est grande, mais non comme une masse** (chap. 5) : une masse se réduit à rien si on lui enlève quelque chose, l'intelligible ne fait jamais défaut. Le mesurer à un corps, c'est comme si l'on disait que la médecine est plus petite que le corps du médecin.
    - **Pourquoi l'âme ne s'étend-elle pas aussi à un autre corps ?** (chap. 6) Parce qu'il faut que le corps **s'avance** : c'est celui qui s'est approché et qui l'a reçue qui la possède. Les sensations diffèrent, mais **ce sont les choses jugées qui diffèrent, non ce qui juge** : le même juge, en nous, juge le plaisir du doigt et la douleur de la tête.

    ! La pluralité des âmes n'est pas engendrée par la grandeur des corps : elle existe déjà là-bas, dans l'âme une.
  points:
