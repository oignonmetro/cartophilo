  points:
  - id: g-intellect-l1-14
    sentence: La pensée qui raisonne pas à pas, en enchaînant des propositions les unes après les autres, propre à l'Âme et non à l'Intellect, se nomme, en grec, la ___.
    answer: dianoia
    alt: []
  - id: g-intellect-l3-q1
    sentence: "La *dianoia*, pensée discursive qui procède d'une idée à l'autre dans le temps, est le propre de l'___, jamais de l'Intellect, qui saisit tout d'un seul coup."
    answer: Âme
    alt: ["âme", "ame"]
  - id: g-intellect-l3-q2
    sentence: "La pensée de l'Intellect n'a pas à chercher, parce qu'elle a déjà tout et qu'elle ___ ce qu'elle pense."
    answer: est
    alt: []
  - id: g-intellect-l3-q3
    sentence: "Les sages d'Égypte n'utilisent pas les lettres, qui « développent des propositions et des ___ », mais écrivent « en inscrivant sur les murs de leurs temples une seule image pour chaque chose » (traité 31, chap. 6, l. 3-6)."
    answer: prémisses
    alt: ["premisses"]
  - id: g-intellect-l3-q4
    sentence: "En inscrivant sur les murs de leurs temples une seule image pour chaque chose, les sages d'Égypte « manifestent ainsi le caractère non ___ de l'intelligible » (traité 31, chap. 6, l. 5-7)."
    answer: discursif
    alt: []
  - id: g-intellect-l3-q5
    sentence: "Dans l'écriture des sages d'Égypte, selon Plotin, chaque image est « une science, un savoir, une réalité particulière donnée ___ » (traité 31, chap. 6, l. 7-9)."
    answer: tout d'un coup
    alt: ["d'un seul coup"]
  - id: g-intellect-l3-q6
    sentence: "Pour montrer que la pensée de l'Intellect est intuitive et non discursive, Plotin la compare à l'écriture des sages d'Égypte, au chapitre 6 du traité ___."
    answer: 31 (V, 8)
    alt: ["31", "V, 8"]
  - id: g-intellect-l3-q7
    sentence: "Chaque théorème est une partie de la science, « non pas parce qu'il en est ___ séparé, mais parce qu'il a, dans le tout, une puissance particulière » (traité 5, chap. 8, l. 5-7)."
    answer: localement
    alt: []
  - id: g-intellect-l3-q8
    sentence: "Chaque théorème est une partie de la science, « non pas parce qu'il en est localement séparé, mais parce qu'il a, dans le tout, une ___ » (traité 5, chap. 8, l. 5-7)."
    answer: puissance particulière
    alt: []
  - id: g-intellect-l3-q9
    sentence: "Comme les théorèmes d'une science, chaque Forme est distincte des autres sans être ___ du tout."
    answer: séparée
    alt: ["separee"]
