id: g-noesis
title: Pensée (`noêsis`)
icon: book
color: coral
lessons:
- id: g-noesis-l1
  title: Pensée
  notes: |-
    Chez Plotin, la {violet}**pensée**{/violet} (*noêsis*) au sens propre est [def], à la différence de {pink}la réflexion de l'âme{/pink}, qui va d'une idée à l'autre.

    __**Deux manières de penser.**__ Notre pensée ordinaire est {violet}discursive{/violet} (*dianoia*) : elle va d'une prémisse à une conclusion, d'une idée à la suivante, dans le [[g-temps|temps]]. La pensée de l'Intellect saisit d'un coup ce que la *dianoia* déroule. **Elle n'a pas à chercher, parce qu'elle a déjà tout, et qu'elle est ce qu'elle pense** : les [[g-intelligibles-dans-l-intellect|intelligibles sont en elle]].

    | Pensée | Comment elle procède | À qui elle appartient |
    | discursive | d'une idée à l'autre, dans le temps | l'Âme |
    | intuitive | tout d'un seul coup | l'Intellect |

    __**L'image des hiéroglyphes.**__ Les {sky}sages d'Égypte{/sky}, dit Plotin, n'écrivaient pas avec des lettres, qui « développent des propositions et des prémisses », mais « en dessinant des images et __en inscrivant sur les murs de leurs temples une seule image pour chaque chose__ », ils « manifestent ainsi __le caractère non discursif__ de l'intelligible » ([[traite31|traité 31]], chap. 6). Chaque image y est « une science, un savoir, une réalité particulière __donnée tout d'un coup__ ».

    __**Distincte sans être séparée.**__ Une science ne contient pas ses théorèmes comme un sac des billes : « chaque théorème est une partie de la totalité de la science, non pas parce qu'il en est localement séparé, mais parce qu'il a, dans le tout, __une puissance particulière__ » ([[traite5|traité 5]], chap. 8). Ainsi chaque Forme pensée est distincte des autres sans être séparée du tout.

    __**Une pensée qui reste double.**__ Même pensant tout d'un coup, la pensée garde la dualité de ce qui pense et de ce qui est pensé ; c'est pourquoi le premier principe, absolument simple, ne pense pas ([[traite24|traité 24]], chap. 1-2), et pourquoi la pensée la plus haute se dépasse dans l'amour de l'[[g-intellect-amoureux|Intellect amoureux]].

    ! Plotin ne connaissait sans doute pas le fonctionnement réel des hiéroglyphes, qui notent aussi des sons : son image vaut pour ce qu'elle fait comprendre.

    **Voir aussi** : [[g-intellect|Intellect]] · [[g-dianoia|Réflexion]] · [[g-intelligibles-dans-l-intellect|Intelligibles dans l'Intellect]] · [[g-noothenai|Devenir intellect]]
