lessons:
- id: g-phusis-l1
  title: Nature
  notes: |-
    Chez Plotin, la {violet}**nature**{/violet} (*phusis*) est [def]. Elle n'est {pink}ni une matière ni une force corporelle{/pink}.

    __**Une âme, la dernière.**__ « Ce qu'on appelle "nature" est une âme, __le rejeton d'une âme antérieure__ dont la vie est plus puissante » ([[traite30|traité 30]], chap. 4). Elle n'est pas une quatrième réalité à côté des trois hypostases : c'est l'[[g-ame|Âme]] à son degré le plus bas, là où elle touche la matière. « La nature est __une image de la réflexion__ et puisque c'est ce qu'il y a de plus bas en l'âme, elle dispose aussi de la raison la plus basse » ([[traite28|traité 28]], chap. 13). {yellow}Comme une marque imprimée sur une épaisse couche de cire, nette sur une face, à peine visible sur l'autre{/yellow} : la nature est la trace la plus faible de la pensée de l'âme.

    __**Elle produit sans connaître.**__ La difficulté est là : des œuvres aussi ordonnées que les vivants semblent demander un calcul. Plotin répond que « la nature __ne connaît pas, mais qu'elle se contente de produire__ » (chap. 13) : elle donne ce qu'elle possède sans l'avoir choisi, comme un objet chauffé transmet sa chaleur à ce qui le touche. Elle est même « dépourvue de la faculté de représentation » et n'a « ni perception ni conscience de rien ». **Ce n'est pas un défaut d'intelligence, mais une intelligence sans recul** : la nature est sa raison, elle n'a pas à se la représenter.

    __**Ni mains, ni leviers.**__ Contre l'image de l'artisan, Plotin pose « qu'il n'y a dans la nature ni mains, ni pieds, ni un quelconque instrument », et qu'« il faut aussi retrancher l'usage de __leviers__ » ([[traite30|traité 30]], chap. 2) : quels leviers produiraient la multitude des couleurs et des figures ? La nature « transforme la matière et l'informe, non pas en la manœuvrant ni en se servant de ces leviers dont on parle tant, mais __en lui faisant part de ses raisons__ » ([[traite5|traité 5]], chap. 6). Elle produit en [[g-theoria|contemplant]] : les contours des corps « tombent » d'elle (traité 30, chap. 4).

    __**Après elle, plus de vie.**__ La nature est le dernier degré du vivant : « après elle, __il n'y a plus de vie__ et ce qu'elle produit est dépourvu de vie » ([[traite15|traité 15]], chap. 1). Avec elle s'achève la descente des réalités véritables ; au-delà, il n'y a plus que des imitations, les corps.

    | Degré | Ce qu'il fait | Avec ou sans conscience |
    | la réflexion | raisonne et juge | consciente |
    | la représentation | connaît ses affections | consciente de l'extérieur |
    | la nature | produit les corps | sans perception ni conscience |

    ! La nature n'est pas le *pneuma* stoïcien, un souffle corporel : c'est une puissance psychique incorporelle, dont les raisons viennent de l'intelligible.

    **Voir aussi** : [[g-theoria|Contemplation]] · [[g-ame|Âme]] · [[g-logos-spermatikos|Raison séminale]] · [[g-logos|Raison]] · [[g-degres-de-vie|Degrés de vie]]
