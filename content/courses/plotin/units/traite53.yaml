- id: traite53-l2
  title: "Trois réponses réfutées : l'instrument, l'entrelacement, la forme"
  notes: |-
    **Examen de trois réponses** (chap. 2-4) : Plotin discute trois façons d'attribuer les affections à l'âme et montre que chacune échoue.

    | Réponse | Pourquoi elle échoue |
    | l'âme elle-même (chap. 2) | l'âme est en elle-même impassible et non mélangée |
    | l'âme qui se sert du corps comme d'un instrument (chap. 3, 3-17) | l'artisan ne ressent pas ce qu'éprouvent ses instruments |
    | l'âme entrelacée ou mélangée au corps (chap. 3, 17-4, 18) | l'âme ne subit pas nécessairement les affections du corps |
    | l'âme comme forme dans le corps, qui est la matière (chap. 4, 18-fin) | la forme n'est pas affectée |

    **L'instrument** (chap. 3) : si l'âme se sert du corps comme d'un instrument, elle n'a pas à recevoir ses affections, pas plus que les artisans ne ressentent celles de leurs outils. Mais pour s'en servir, elle doit connaître l'état de son instrument par la sensation ; se servir des yeux, c'est voir. Qui se sert et ce dont on se sert sont toutefois **séparés**. Avant que la philosophie ne la sépare, l'âme était **mélangée**, comme le pilote d'un navire.

    **Le mélange** (chap. 4) : s'il y avait mélange, le corps, la pire des parties, s'améliorerait en recevant la vie, tandis que l'âme, la meilleure, empirerait en recevant la mort et la déraison. C'est donc le **corps**, une fois vivant, qui reçoit la sensation et les affections : il désire, il a peur, il est détruit.

    ! Cette réfutation ne dit pas que nous n'éprouvons rien : elle dit que ce n'est pas l'âme seule qui l'éprouve. Elle prépare la définition du vivant, au chapitre 5.
