- id: traite53-l4
  title: "Qui sommes-nous ? Le « nous »"
  notes: |-
    **La question de l'*Alcibiade*** (chap. 7, 6 à 9) : « se connaître soi-même » suppose de dire ce qu'est ce « soi ». Les platoniciens répondaient : l'âme. Plotin **réfute** cette lecture commune : nous ne sommes pas en propre notre âme, sauf à rappeler que l'âme est une **multiplicité dynamique**, qui compte différentes puissances.

    **Trois termes à ne pas confondre** : l'âme, le vivant, le « nous ». « Nous sommes plusieurs », dit le chapitre 9. Nous ne sommes pas l'homme en soi, « l'homme de là-bas » ; ni exactement notre âme ; ni seulement cet individu vivant, dont nous disposons sans coïncider avec lui.

    **Trois situations du « nous »** :

    | Définition | Verdict |
    | le composé de l'âme et du corps | insatisfaisante |
    | l'âme rationnelle qui se sert du composé et des facultés inférieures | pas absolument inexacte, mais le « nous » est au-delà du vivant et le domine |
    | l'âme qui exerce sa seule faculté intellective, l'âme non descendue | c'est là que le « nous » semble se réaliser |

    **Un intervalle** : l'Intellect est **au-dessus de nous** ; le « nous » est une identité dynamique, entre les facultés de l'âme qui s'exercent dans le composé et la faculté intellective. Plus nous nous **séparons** du composé, plus nous nous rapprochons de la contemplation et de l'Intellect ; moins nous le faisons, plus nous nous confondons avec les facultés inférieures.

    **Pourquoi et comment nous avons l'Intellect** (chap. 8) : nous possédons l'Intellect, les formes intelligibles et le dieu, parce que l'âme est intelligible.

    ! La véritable décision éthique consiste à choisir notre identité : le « nous » n'est pas donné une fois pour toutes, il se déplace selon la vie que nous menons.
