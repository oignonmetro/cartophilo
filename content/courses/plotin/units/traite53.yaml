- id: traite53-l6
  title: "Repérage : le plan du traité 53"
  notes: |-
    **Le traité 53 cherche d'abord le sujet de la sensation (chap. 1-7, 6), puis ce que nous sommes (chap. 7, 6-8), enfin ce dont nous sommes responsables (chap. 9-13).**

    | Moment | Lieu | Ce qui s'y joue |
    | quel est le sujet de la sensation ? | chap. 1 | à qui appartiennent les affections |
    | l'âme elle-même | chap. 2 | impassible, non mélangée |
    | l'âme qui se sert du corps | 3, 3-17 | l'instrument |
    | l'âme entrelacée au corps | 3, 17-4, 18 | le mélange |
    | l'âme, forme dans le corps | 4, 18-fin | la forme n'est pas affectée |
    | qu'est-ce qu'un vivant ? | chap. 5 | définition, affections du composé |
    | sensation et puissances psychiques | chap. 6 | comment l'âme donne des puissances aux corps |
    | le sujet de la sensation est le composé | 7, 1-6 | corps et puissance issue de l'âme |
    | pourquoi « nous » avons sensations et intellections | 7, 6-fin | opinions, raisonnements |
    | nous possédons l'Intellect | 8, 1-8 | les formes intelligibles |
    | nous possédons l'Intellect et le dieu | 8, 8-23 | le dieu |
    | ce dont nous sommes responsables | chap. 10-12 | le composé fautif |
    | l'âme et l'Intellect nous appartiennent | chap. 13 | la remontée |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! Le traité 53 compte treize chapitres, en trois parties : le sujet de la sensation, ce que nous sommes, notre responsabilité.
