- id: traite53-l3
  title: "Le vivant et les puissances psychiques"
  notes: |-
    **Qu'est-ce qu'un vivant ?** (chap. 5) : le vivant résulte, d'une façon ou d'une autre, de la **présence d'une âme dans un corps**. Plotin définit le vivant et examine les difficultés posées par les affections du composé. Le traité 52 (II, 3, 16) avait annoncé cette recherche : que signifient « mélangé », « non mélangé », « séparé » quand l'âme est dans le corps ?

    **L'âme donne aux corps des puissances psychiques** (chap. 6-7, 6) : le vivant ne reçoit qu'une **trace** de l'âme, une part de sa puissance. C'est par cette puissance que le corps sent. « Seule », l'âme n'éprouve rien : les affections (crainte, plaisir, douleur, audace) viennent du corps. Mais parce qu'elle est liée au corps, l'âme en fait usage et en juge.

    **Le sujet de la sensation** (chap. 7, 1-6) : c'est le **composé vivant**, que forment un corps et une puissance issue de l'âme. L'âme ne « sent » pas les affections : elle porte sur elles des jugements, des opinions.

    **Trois étapes** : le traité remonte les fonctions du vivant, des affections corporelles et de la sensation (qui ne relèvent de l'âme que médiatement), aux opinions et jugements, puis aux intellections.

    ! L'âme reste impassible, mais le vivant est passible : Plotin tient les deux, en distinguant ce qui est affecté (le composé) et ce qui juge de l'affection (l'âme).
  points:
