- id: traite53-l5
  title: "Ce que nous sommes et ce dont nous sommes responsables"
  notes: |-
    **Le « nous » se dit en deux sens** (chap. 10) : « nous » possédons le composé et ses vices, mais aussi l'âme et l'Intellect. Plotin multiplie ensuite les instances du « nous ».

    **Tout nous est donné** (chap. 10-13) : le vivant humain peut posséder **l'ensemble de la réalité** : le composé et ses vices (chap. 10) ; la « **bête sauvage** » (chap. 11) ; les vertus et les affections ; l'Intellect. Qu'est-ce qui détermine alors notre identité ? « Nous ne faisons pas toujours usage de tout ce que nous possédons » : nous serons **ce dont nous faisons usage**.

    | Quand… | « nous » sommes… |
    | notre âme n'exerce que les fonctions les plus viles, au plus près des désirs corporels | une bête |
    | nous nous séparons des désirs corporels et pensons | des vivants rationnels et raisonnables |
    | nous contemplons | assimilés au dieu |

    **La faute** (chap. 12) : « c'est le **composé** qui commet des fautes et qui est châtié, mais non pas l'âme ». L'âme reste impassible et infaillible ; le vivant est faillible. Distinguer l'un de l'autre rend possible la responsabilité et la réforme de soi, qui est au principe de la philosophie.

    **L'Intellect nous appartient** (chap. 13) : l'âme et l'Intellect sont « à nous », ce qui ouvre une remontée possible. Cette remontée se poursuit au traité 54 : « l'âme peut posséder le Bien si elle tourne ses regards vers lui » (54, 2).

    ! Pour Plotin, notre identité n'est pas un fait mais une dynamique : nous sommes ce que nous choisissons de faire de ce que nous avons.
