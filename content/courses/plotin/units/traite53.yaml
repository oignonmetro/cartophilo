lessons:
- id: traite53-l1
  title: "À qui appartiennent les affections ? L'âme impassible"
  notes: |-
    **Le premier traité des *Ennéades*, l'avant-dernier écrit** : le traité 53 est l'un des tout derniers de Plotin, rédigé seul et gravement malade (les traités 51 à 54 datent de ses deux dernières années). Porphyre l'a pourtant placé **au début** des *Ennéades*, parce que les questions « éthiques » lui semblaient la meilleure propédeutique : il peut se lire **pour lui-même**, sans grande connaissance de la doctrine.

    **La question de départ** (chap. 1) : à qui appartiennent les plaisirs, les douleurs, les peurs, les audaces, les désirs ? Quatre réponses sont possibles : à l'**âme**, à l'**âme qui se sert d'un corps**, à une **troisième réalité** issue des deux, qui peut être un mélange ou autre chose que ce mélange. Il en va de même des actions et des opinions, des intellections, de ce qui juge.

    **Ce qui est en jeu** : la question n'est pas posée pour elle-même, mais pour ce qu'elle suppose. Si l'âme était affectée, elle serait « passible », donc faillible. Si elle est impassible, comment rendre raison du mal moral ? Et selon que les affections viennent du corps, de l'âme ou du composé, nous n'avons ni la même prise sur elles ni la même **responsabilité**.

    **L'âme seule est impassible** (chap. 2) : si l'âme et l'être de l'âme sont une seule et même chose, elle est une forme simple, qui ne reçoit rien de l'extérieur. Elle est donc immortelle, et ne peut éprouver ni peur, ni audace, ni désir (qui sont satisfaits par le corps), ni douleur, ni plaisir. Ce qui existe réellement **n'est pas mélangé**.

    ! La question initiale n'est qu'un biais d'entrée dans une réflexion éthique : si l'âme est impassible, qui, en nous, commet des fautes et en répond ?
