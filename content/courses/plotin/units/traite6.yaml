- id: traite6-l8
  title: "Descendre pour manifester sa puissance (chap. 5, l. 25-37)"
  notes: |-
    La fin du chapitre 5 renverse la perspective : la descente n'est pas seulement une peine qu'on explique, c'est une œuvre qu'on comprend. L'âme descend pour exercer sa puissance, et sans cela cette puissance n'existerait pour ainsi dire pas.

    __**Le dieu de dernier rang**__ (l. 24-27). {teal}« Ainsi donc, bien qu'elle soit divine et qu'elle vienne des régions situées là-bas, l'âme se retrouve à l'intérieur du corps »{/teal} ; et cependant, puisqu'elle est {coral}« le dieu de dernier rang »{/coral}, c'est {green}« par une libre inclinaison, et pour exercer sa puissance et mettre en ordre ce qui vient après elle »{/green} qu'elle vient ici. Le « cependant » oppose sa situation, dans un corps, au caractère volontaire de sa venue, et ce contraste répond à son rang : **dernière des réalités divines**, après l'Un et l'Intellect, elle est à la frontière du divin et de ce qui ne l'est plus. Toute réalité parfaite produit ce qui la suit ; celle qui vient en dernier parmi les divines a pour tâche d'ordonner ce qui n'est plus divin. Sa venue est donc libre au sens du chapitre : elle accomplit d'elle-même sa fonction.

    __**Aucun dommage, et un gain**__ (l. 27-29). {teal}« Et certes si elle s'enfuit d'ici rapidement, elle ne subit aucun dommage »{/teal}. S'enfuir n'est pas mourir : c'est **se détourner**, revenir à l'intelligible par la conversion. Le corps ne corrompt pas la substance de l'âme ; le mal ne vient que d'une fascination prolongée. Et elle y gagne {teal}« la connaissance du mal et celle de la nature du vice »{/teal} : connaissance qui n'est pas une menace écartée de justesse, mais **un gain positif**, au même titre que l'exercice de sa puissance. On objectera que connaître le mal suppose de devenir mauvais : non, le mal n'a pas de Forme, on le connaît par contraste, comme une absence.

    __**L'argument de la puissance**__ (l. 29-35). Elle a aussi {teal}« rendu visible ses puissances et fait apparaître des œuvres et des activités »{/teal} qui, {red}« si elles étaient restées en repos dans l'incorporel, auraient existé en vain puisqu'elles ne seraient jamais parvenues à l'acte »{/red}. Une puissance, chez Plotin, n'est pas une simple possibilité passive : c'est **une force féconde, dont la raison d'être est d'agir**. Restée sans œuvre, elle n'aurait servi à rien. Plus encore : {teal}« l'acte révèle partout la puissance qui sans lui demeurerait totalement cachée, comme inapparente, et inexistante puisqu'elle n'aurait jamais d'existence réelle »{/teal}. Le réel se mesure à l'acte : une puissance qui ne passerait jamais à l'acte n'aurait ni effet ni manifestation, et ne se distinguerait pas de rien. {yellow}Un pianiste qui n'aurait jamais touché un clavier ne saurait même pas qu'il l'est.{/yellow}

    __**Pourquoi l'Intellect, lui, n'a pas à descendre.**__ On objectera que l'Intellect reste au repos sans être pour autant « inexistant ». C'est que son acte est tout entier intérieur : il pense, et rien ne lui manque. L'âme, dieu de dernier rang, a une nature tournée vers le gouvernement : si elle ne déployait pas ses puissances, la procession s'arrêterait avant le sensible (chap. 6).

    __**L'âme se connaît par ce qu'elle produit**__ (l. 32-33). {coral}« l'âme elle-même aurait ignoré les choses qu'elle possède, puisqu'elles ne seraient même pas sorties pour se manifester »{/coral}. Tant que ses raisons ne se sont pas réalisées dans des œuvres, elle n'en a pas pris conscience : l'œuvre lui sert de **miroir**. Le corps n'est pas seulement l'effet de l'âme : il est ce par quoi elle devient visible à elle-même.

    __**L'intériorité par l'extérieur**__ (l. 35-37). Et nous aussi, {teal}« chaque homme peut admirer l'intériorité des choses grâce à la variété des aspects extérieurs »{/teal}, et la connaître par les œuvres si délicates qu'elle a réalisées. Le sensible n'est pas un piège quand on le prend comme image : on remonte de l'effet à la cause. L'erreur serait de s'y arrêter, comme Narcisse devant son reflet (traité 1).

    __**« Libre inclinaison ».**__ Le grec dit *rhopê autexousios*, *inclinaison qui a pouvoir sur elle-même*. *Hekousion* disait seulement l'absence de contrainte extérieure ; *autexousios* ajoute que l'âme agit **de son plein gré**, maîtresse de son mouvement. Et Plotin évite le mot de la chute de Sagesse chez les gnostiques (*neusis*, l'inclinaison vers le bas) : il parle de descente et d'inclinaison libre, non d'effondrement.

    __**Deux raisonnements sur une prémisse.**__ Tout repose sur « l'acte révèle partout la puissance ». Sans la descente, les puissances de l'âme auraient existé en vain, car **ce qui est plein doit engendrer** ; et l'âme aurait ignoré ce qu'elle possède, or une âme qui s'ignore n'est pas parfaite. Ses œuvres sont ses facultés mêmes : nutrition, croissance, reproduction, sensation, désir, qui ne se montrent qu'avec un corps.

    ! Le corps n'est pas ici un obstacle à la connaissance de l'âme, mais une voie d'accès à elle : il en est la manifestation la plus immédiate.

    ! *S'enfuir d'ici* n'est pas mourir : c'est se détourner du corps par la conversion.
