# d'après la notice et le plan détaillé de Laurent Lavaud, dans Plotin, Traités 1-6,
# trad. sous la dir. de L. Brisson et J.-F. Pradeau, GF-Flammarion, 2002.
# Les citations viennent de la notice ou du plan ; les repères (chapitre,
# lignes) sont ceux de cette édition. Lié à l'entrée t-4-8 de l'index.

id: traite6
title: "Traité 6 (IV, 8) : Sur la descente de l'âme dans les corps"
subtitle: "Volontaire et nécessaire"
icon: compass
color: sky
lessons:
- id: traite6-l1
  title: "« Souvent, lorsque je m'éveille à moi-même »"
  notes: |-
    **Le traité 6 pose la question du rapport de l'âme et du corps** : comment deux éléments de natures hétérogènes, l'un sensible, l'autre intelligible, forment-ils une **« communauté »** (2, 3) ? Il faut d'abord dégager une forme pure de l'identité de l'âme, indépendante du corps : vue de là, l'association au corps paraît étrange, si l'on considère ce qu'est l'âme « en elle-même » (1, 10). Le rapport au corps se définit comme une **« descente »** (`καταβάς`, 1, 8).

    **L'ouverture du traité est l'un des passages les plus célèbres de Plotin :**

    « Souvent, lorsque je m'éveille à moi-même en sortant de mon corps et qu'à l'écart des autres choses je rentre à l'intérieur de moi, je vois une beauté d'une force admirable, et j'ai alors la pleine assurance que c'est là un sort supérieur à tout autre. »

    - Ces lignes ont une force **exhortative** : en dévoilant son expérience du divin, Plotin veut inciter son lecteur à l'éprouver à son tour.
    - Surtout, elles permettent d'aborder le rapport de l'âme au corps **par le haut**, et non depuis la condition courante de l'âme plongée dans le sensible.

    **Le problème essentiel du traité** : la descente de l'âme est-elle une **nécessité cosmologique**, qui achève la production de l'univers, ou le fruit d'une **initiative individuelle**, d'un mouvement volontaire et spontané ?

    ! Le récit de l'expérience n'est pas une confidence décorative : il sert de méthode, en partant de l'identité intelligible de l'âme pour mesurer l'étrangeté de sa descente.
  points:
  - id: traite6-l1-p1
    sentence: "Le traité 6 de Plotin demande comment l'âme et le corps, de natures hétérogènes, en viennent à former une « ___ » (2, 3)."
