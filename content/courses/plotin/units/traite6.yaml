- id: traite6-l7a
  title: "Volontaire et nécessaire (chap. 5, l. 1-16)"
  notes: |-
    Le chapitre 5 est le cœur du traité : il montre que les formules contradictoires du chapitre 1 ne s'excluent pas, parce que, pour l'âme, **le volontaire et le nécessaire coïncident**.

    __**La thèse**__ (l. 1-8). Il n'y a pas de contradiction entre l'ensemencement dans le devenir et la descente pour achever l'univers, entre le jugement et la caverne, {green}entre « la nécessité et le volontaire, puisque le volontaire est justement compris dans la nécessité »{/green} (l. 1-4), ni entre l'exil d'Empédocle et le repos d'Héraclite. D'un côté les images du {sky}*Timée*{/sky} (ensemencement, achèvement, nécessité), de l'autre celles du {sky}*Phèdre*{/sky} et de la {sky}*République*{/sky} (jugement, caverne) : Plotin va montrer qu'elles décrivent la même descente sous deux angles.

    __**Ce que veut dire « nécessaire ».**__ Non pas une contrainte extérieure, une force qui pousserait l'âme contre son gré, mais {teal}« une loi éternelle de la nature »{/teal} (l. 11) : la nature même de l'âme, qu'elle tient de son principe. Une âme est faite pour s'occuper de ce qui vient après elle ; descendre, pour elle, c'est être ce qu'elle est.

    __**Ce que veut dire « volontaire ».**__ Non pas un choix entre plusieurs possibles, où l'âme aurait pu décider de rester : elle n'a pas la liberté de ne pas descendre. Le volontaire (*hekousion*) désigne **un mouvement propre**, qu'aucune force étrangère ne contraint : l'âme descend {teal}« de son propre mouvement »{/teal} (l. 8-9). Est volontaire ce qui procède du principe intérieur de l'agent, même si sa nature le détermine à le faire.

    __**Comment l'un est compris dans l'autre.**__ Puisque la nécessité est la nature de l'âme, et que le volontaire est le mouvement qui vient de cette nature, la descente est nécessaire et volontaire **par une seule et même raison** : l'âme veut ce que sa nature exige. Il n'y a contradiction que si l'on prend la nécessité pour une contrainte et la volonté pour un choix. {yellow}On peut penser au musicien de talent qui joue parce qu'il le veut, et qui pourtant ne pourrait pas ne pas jouer sans cesser d'être ce qu'il est.{/yellow}

    __**Involontaire, et pourtant de son propre mouvement**__ (l. 8-10). {teal}« Car certes toute chose va vers le pire involontairement, mais puisqu'elle y va cependant de son propre mouvement, on dit qu'en subissant l'influence de ce qui lui est inférieur, elle reçoit une condamnation conforme à ce qu'elle a fait »{/teal}. Il faut distinguer **l'élan et son terme**. Le terme, le pire, l'influence du corps et de la matière, nul ne le veut pour lui-même : en ce sens la descente est involontaire. Mais l'élan vient de l'âme : en ce sens elle est volontaire. C'est pourquoi on parle de **condamnation** : on répond des suites d'un acte dont l'impulsion vient de soi, même si ces suites n'étaient pas voulues. Ce n'est pas la sentence d'un juge extérieur, mais la conséquence de ce qu'elle a fait : en s'engageant dans un corps partiel, elle s'expose à en pâtir.

    __**Le dieu qui envoie**__ (l. 10-16). Quand l'âme, par cette loi, subit et produit les réalités inférieures, en s'unissant au corps {teal}« en allant entièrement au-devant du besoin d'un autre »{/teal}, le corps, qui a besoin de toutes sortes de secours (chap. 2), {green}« si l'on dit que c'est un dieu qui l'a envoyée, on ne sera en contradiction ni avec la vérité, ni avec soi-même »{/green}. Car {teal}« chaque chose, y compris les dernières, doit être rapportée au principe dont elle est issue, même si les intermédiaires sont nombreux »{/teal}. L'envoi par le dieu est **la même loi, dite du côté du principe** ; obéir au dieu est, pour l'âme, une manière volontaire de descendre.

    __**Une même descente, qui achève l'univers.**__ Les expressions du chapitre 1 sont reprises en un seul tout, parce qu'elles servent toutes à expliquer **comment l'univers s'achève**. La descente n'est plus seulement l'aventure d'une âme, comme l'éveil du chapitre 1 : elle prend place dans un ordre qui la dépasse.

    __**Le volontaire selon Aristote.**__ L'idée a un appui chez {sky}Aristote{/sky} : le bien d'un être est de réaliser sa fonction propre, que sa nature lui assigne ; encore faut-il l'accomplir de plein gré. Nul ne choisit le mal pour lui-même ; ce qu'on fait selon sa nature et sans contrainte est à la fois nécessaire et volontaire.

    __**Le traité 27 nuancera.**__ Plus tard, Plotin écrira : {teal}« Les âmes ne viennent ni de leur plein gré ni parce qu'elles ont été envoyées ; ou du moins, dans leur cas, le plein gré ne correspond pas à un choix préalable. C'est plutôt quelque chose comme bondir naturellement »{/teal}, ou comme le désir sexuel. {yellow}On ne choisit pas de désirer se marier, et l'on ne se marie pas pour autant contre son gré{/yellow} (exemple de D. O'Brien). Le mot « envoyer » a deux sens : une nécessité inscrite dans la nature de l'âme, celle du traité 6, ou une force extérieure, que le traité 27 refuse. Il n'y a pas forcément contradiction, mais une pensée qui s'affine.

    __**Tout remonte au principe.**__ Que chaque chose doive être rapportée à son principe, même par de nombreux intermédiaires, Aristote le disait déjà du mouvement, qui dérive d'un premier moteur ; le traité 7, qui suit immédiatement, en fera un principe : ce qui vient en second remonte au premier, ce qui vient en troisième au second.

    ! « Volontaire » ne veut pas dire « choisi » : l'âme adhère à sa nature, elle ne délibère pas. Et « nécessaire » ne veut pas dire « forcé » : la nécessité, c'est sa nature même.

    ! La « condamnation » n'est pas la sentence d'un juge extérieur : c'est la suite même de ce que l'âme a fait.
