id: traite6
title: "Traité 6 (IV, 8) : Sur la descente de l'âme dans les corps"
subtitle: "Volontaire et nécessaire"
icon: compass
color: sky
lessons:
- id: traite6-l1
  title: "Repérage : le plan du traité 6"
  notes: |-
    Le traité 6 part d'une **expérience** (l'âme qui se découvre dans l'intelligible) et d'un **embarras** (comment a-t-elle pu se retrouver dans un corps ?). Il y répond en distinguant les manières d'être lié à un corps, puis en montrant que la {coral}descente{/coral} est à la fois {coral}voulue{/coral} et {coral}nécessaire{/coral}.

    **Le chapitre** {teal}**1**{/teal} **pose l'aporie** : après le récit de l'éveil, les énigmes d'{sky}Héraclite{/sky} et d'{sky}Empédocle{/sky}, puis {sky}Platon{/sky}, qui présente la descente tantôt comme {red}une faute et un exil{/red}, tantôt comme {green}une nécessité qui achève l'univers{/green}. **Les chapitres** {teal}**2 et 3**{/teal} **distinguent deux façons de gouverner un corps** : l'âme du monde et celles des astres gouvernent sans pâtir, l'âme individuelle pâtit parce qu'elle s'attache à un corps particulier. **Les chapitres** {teal}**4 et 5**{/teal} **expliquent la chute** : l'âme « amphibie » s'isole du tout, et sa descente est à la fois {coral}volontaire{/coral} et {coral}nécessaire{/coral}. **Le chapitre** {teal}**6**{/teal} **replace la descente dans la procession** : toute puissance parfaite doit se déployer, et le sensible manifeste l'intelligible. **Les chapitres** {teal}**7 et 8**{/teal} **fondent la possibilité du retour** : l'âme occupe un rang moyen, l'expérience du mal fait mieux connaître le bien, et quelque chose d'elle reste toujours là-bas.

    | Mouvement | Lieu | Ce qui s'y joue |
    | poser l'aporie de la descente et confronter les anciens | chap. 1 | Platon présente la descente tantôt comme une faute et un exil, tantôt comme une nécessité qui achève l'univers : il faut concilier les deux |
    | distinguer deux manières de gouverner un corps | chap. 2-3 | l'union au corps n'est pas mauvaise en soi : l'âme du monde gouverne sans peine, l'âme individuelle pâtit parce qu'elle s'attache à un corps particulier |
    | expliquer la chute : l'âme amphibie, volontaire et nécessaire | chap. 4-5 | l'âme s'isole du tout tout en gardant une attache là-bas, et sa descente obéit à une loi éternelle tout en venant de son propre élan |
    | replacer la descente dans la procession | chap. 6 | toute puissance parfaite doit se déployer ; comme l'Un engendre l'Intellect, l'âme engendre le corps, et le sensible manifeste l'intelligible |
    | fonder le retour : l'âme non descendue et la vertu de l'épreuve | chap. 7-8 | l'expérience du mal fait mieux connaître le bien, et la partie supérieure de l'âme demeure toujours dans l'intelligible |

    ! Le traité ne condamne pas le corps : sa conclusion est que le sensible manifeste l'intelligible, et que l'âme n'est jamais tout entière descendue.
