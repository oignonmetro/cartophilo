- id: traite6-l4
  title: "Gouverner sans pâtir : l'âme du monde et les astres (chap. 2)"
  notes: |-
    Le chapitre 2 pose la distinction qui commande tout le traité : ce n'est pas d'avoir un corps qui fait souffrir l'âme, c'est une certaine manière de s'en occuper. L'âme du monde et les âmes des astres en ont un, et ne pâtissent pas.

    **Trois enquêtes en une** (l. 1-10). Comprendre ce que dit Platon de notre âme oblige à se demander ce qu'est l'âme en général, ce qu'est le monde où elle habite, « soit volontairement, soit poussée par la nécessité, soit d'une autre manière », et si le producteur de l'univers a bien œuvré.

    **Si nos âmes n'avaient pas plongé dans les corps** (l. 10-19). Les éléments de chaque corps se disperseraient, chacun vers son lieu, et ces corps, sans cesse heurtés par l'extérieur, auraient besoin d'une providence « multiple et tumultueuse ». Le corps de l'univers, lui, est « parfait, autosuffisant et autarcique » : rien n'en sort ni n'y entre, il n'a besoin que d'**un commandement bref**.

    **Prendre soin n'est pas un mal.** {green}« Ce n'est en aucune façon un mal pour l'âme de fournir au corps la puissance d'être bien organisé et d'exister »{/green}. La providence exercée sur l'inférieur n'empêche pas celui qui l'exerce de **demeurer dans le meilleur**. Ce qui change tout, c'est la manière.

    | Façon de prendre soin | Comment | Effet sur l'âme |
    | générale | elle met en ordre en commandant avec une autorité royale, sans intervenir | elle reste préservée |
    | particulière | elle produit elle-même, par contact avec ce sur quoi elle agit | elle est contaminée |

    **L'âme du monde gouverne de la première façon** (l. 26-38) : sa partie supérieure reste au-dessus du ciel, sa puissance inférieure y est envoyée. Le dieu n'est donc pas responsable d'avoir placé une âme dans un lieu inférieur : rien ne la prive de ce qui lui est conforme. **Il en va de même pour les âmes des astres** (l. 38-53) : elles ne connaissent aucune des deux choses qui rendent le corps pénible (l'obstacle à la pensée, et les plaisirs, désirs et chagrins dont il remplit l'âme), car {coral}elles ne sont pas possédées par le corps : elles le possèdent{/coral}.

    ! Ce n'est pas la perfection du corps de l'univers qui rend son âme heureuse : c'est la sérénité de l'âme qui donne au corps qu'elle produit sa perfection. Le corps reflète l'âme, il ne la détermine pas.
