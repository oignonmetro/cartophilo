- id: traite6-l3
  title: "Des énigmes à Platon : deux conceptions de la descente (chap. 1, l. 11-50)"
  notes: |-
    La seconde partie du chapitre 1 cherche une réponse chez les autorités, et n'en trouve d'abord que des énigmes, puis une contradiction apparente chez Platon lui-même : c'est elle que le traité devra résoudre.

    **La question : comment deux natures hétérogènes, l'une intelligible, l'autre sensible, forment-elles une « communauté » ?**

    **Les énigmes** (l. 11-23). {sky}Héraclite{/sky} parle d'« échanges réciproques » entre les contraires, du « chemin vers le haut et vers le bas », de « ce qui change » qui « reste en repos » ; {sky}Empédocle{/sky} explique que l'âme fautive est « exilée loin du dieu » pour avoir « obéi à la Discorde en furie » ; les pythagoriciens parlent **« par énigmes »**. Ces formules disent quelque chose, mais sans l'expliquer : Héraclite veut sans doute nous obliger à chercher par nous-mêmes, Empédocle a le droit de n'être pas clair puisqu'il parle **en poète**. Plotin les arrache d'ailleurs à leur contexte pour les plier à sa question : chez lui, le « chemin vers le haut et vers le bas » devient le double mouvement de l'âme.

    **Reste Platon**, dont on espère « tirer quelque chose de clair ». Mais {red}« il ne dit pas partout la même chose »{/red}. Il y a chez lui deux séries de textes.

    | Conception | Textes | Ce qu'est la descente |
    | pessimiste | *Phédon*, *République*, *Phèdre* | une faute : l'âme enchaînée, en prison, dans la caverne, qui a perdu ses ailes |
    | cosmologique | *Timée* | un achèvement : l'âme envoyée par la bonté du démiurge pour rendre l'univers intelligent |

    **La tension est réelle.** Selon la première série, l'âme est responsable de sa chute et la subit comme une peine ; selon la seconde, elle est envoyée par le dieu, et l'univers, « dieu bienheureux », serait imparfait sans elle : il fallait qu'il y ait ici-bas autant de genres de vivants que là-bas. Si la descente est une faute, comment le dieu peut-il l'avoir voulue ? Si elle est voulue par le dieu, comment peut-elle être une faute ? Le traité va montrer qu'il n'y a pas contradiction, mais deux points de vue sur une même réalité.

    ! Plotin ne reproche pas à Platon d'être incohérent : il lit ses textes comme deux faces d'une même doctrine, qu'il s'agit de rendre explicite.
