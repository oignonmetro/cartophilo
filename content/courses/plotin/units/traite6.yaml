- id: traite6-l9
  title: "La puissance venue de l'Un ne s'arrête pas (chap. 6)"
  notes: |-
    Le chapitre 6 fonde la descente de l'âme sur ce qui fonde tout le système : la puissance qui vient de l'Un et qui doit aller jusqu'au bout. Produire des corps n'est pas pour l'âme une déchéance, mais la continuation d'un don.

    **Le parallèle** (l. 1-10). S'il ne devait y avoir que l'Un, tout resterait caché, rien n'existerait, l'Un « resterait en lui-même » (non qu'il en sorte : il ne reste pas seul). **De la même manière**, il ne faut pas qu'existent seulement des âmes, sans que leurs produits deviennent visibles. Chaque âme a par nature la capacité de produire ce qui vient après elle et de se développer, {yellow}comme une semence{/yellow}, d'un principe indivisible jusqu'à l'objet sensible.

    **La puissance sans jalousie** (l. 10-16). Ce qui est premier demeure toujours à sa place ; ce qui vient après est engendré par {teal}« une puissance indicible »{/teal} qui {green}« ne doit pas s'immobiliser, comme bornée par la jalousie »{/green}, mais avancer jusqu'à l'ultime limite possible. Plotin reprend le *{sky}Timée{/sky}* : le dieu était bon, et « en ce qui est bon on ne trouve aucune jalousie ». **S'arrêter avant le corps serait refuser de donner** : ce serait, pour la puissance, une avarice. Rien n'empêche donc chaque chose de prendre part au bien **dans la mesure de ce qu'elle peut recevoir**.

    **L'alternative sur la matière** (l. 16-23). Ou bien la matière est éternelle, et elle ne peut pas ne pas participer à ce qui pourvoit au bien ; ou bien elle est engendrée par des causes antérieures, et il n'est pas nécessaire qu'elle en soit séparée, comme si la puissance qui lui donne l'existence s'arrêtait avant elle. **Dans les deux cas, la matière n'échappe pas au bien.** Plotin n'a pas besoin de trancher : les deux branches mènent à la même conclusion (les commentateurs, eux, en discutent beaucoup).

    **La conclusion** (l. 23-28). {coral}« Tout est solidaire pour toujours »{/coral} : le sensible existe par participation et imite l'intelligible autant qu'il le peut, et ce qu'il a de plus beau est la manifestation de la puissance et de la bonté de là-bas.

    ! La matière n'est pas ici le principe du mal : elle participe au bien selon sa capacité. Le traité 51 (I, 8) dira au contraire qu'elle en est « absolument privée » ; le traité 6 n'en est pas encore là.
