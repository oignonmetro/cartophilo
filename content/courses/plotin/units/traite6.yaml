- id: traite6-l5
  title: "Volontaire et nécessaire : le corps, manifestation de l'intelligible"
  notes: |-
    **La difficulté initiale revient : la descente est-elle imputable à l'âme seule, ou à une nécessité cosmologique ?** L'alternative ne coïncide pas avec la distinction des catégories d'âmes : elle se pose au cœur de l'âme individuelle. Le chapitre 5 semble osciller :

    - **responsabilité** : l'âme se porte vers le corps « de son propre mouvement » (5, 8-9), « par une libre inclinaison » (5, 26) ;
    - **nécessité** : les corps sont produits « en vertu d'une loi éternelle de la nature » (5, 11).

    **La clé est au début du chapitre** : « Il n'y a pas de contradiction entre […] la nécessité et le volontaire, puisque justement le volontaire est compris dans la nécessité » (5, 1-4).

    | Terme | Ce qu'il ne veut pas dire | Ce qu'il veut dire |
    | la nécessité | une contrainte extérieure | l'expression de la nature de l'âme, héritée du principe supérieur |
    | le volontaire | une capacité de choix | l'adhésion de l'âme à son identité : une âme qui ne descendrait pas se nierait |

    **Le corps, manifestation de l'intelligible.** Loin du mépris du sensible qu'on prête à Plotin, le corps a deux fonctions :

    - **une expansion positive** : il prolonge la puissance généreuse qui vient de l'Un, « une puissance indicible » qui ne doit pas s'immobiliser « comme bornée par la jalousie » (6, 11-16) ;
    - **une révélation** : sans le corps, ce que l'âme possède existerait « en vain » (5, 31), et « l'âme elle-même aurait ignoré les choses qu'elle possède » (5, 32-33).

    Conclusion du chapitre 6 : « tout est solidaire pour toujours, les réalités intelligibles et les réalités sensibles ».

    ! Ni libre arbitre, ni fatalité : l'âme descend volontairement parce qu'elle suit sa nature, et nécessairement parce qu'elle s'intègre au mouvement d'ensemble de l'univers.
  points:
  - id: traite6-l5-p1
    sentence: "Pour la responsabilité, le chapitre 5 du traité 6 dit que l'âme se porte vers le corps « de son propre mouvement » (5, 8-9) ou « par une libre ___ » (5, 26)."
    answer: "inclinaison"
    alt: []
  - id: traite6-l5-p2
