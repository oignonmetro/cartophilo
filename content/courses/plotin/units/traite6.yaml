- id: traite6-l5
  title: "Une âme et des âmes ; l'âme ajoute à la pensée le gouvernement (chap. 3)"
  notes: |-
    Le chapitre 3 passe de l'âme du monde à l'âme humaine. Il explique d'abord comment il peut y avoir à la fois **une âme et des âmes**, en pensant ce rapport sur le modèle de l'Intellect, puis **ce qui distingue l'âme de l'Intellect** : elle ne fait pas que penser, elle gouverne.

    __**L'âme humaine pâtit, sans contradiction**__ (l. 1-6). Platon dit qu'elle « endure toutes les peines » : folie, désirs, peurs ; le corps est pour elle une chaîne et un tombeau, le monde une caverne. Cette doctrine {green}« n'est pas en désaccord avec le reste, puisque les causes qu'il donne à sa descente ne sont pas les mêmes »{/green}. La valeur d'une descente dépend de sa cause : l'âme du monde est envoyée pour gouverner un tout, l'âme humaine descend pour s'occuper d'une partie. Deux causes, deux sorts : Platon parle de deux objets, il ne change pas d'avis. La cause propre de notre descente ne sera dite qu'au chapitre 4.

    __**Une âme et des âmes, comme un Intellect et des intellects**__ (l. 6-16). L'Intellect est {teal}« un et plusieurs »{/teal} (formule du {sky}*Parménide*{/sky}) : l'Intellect universel contient en puissance tous les intellects particuliers, et chacun d'eux est en acte ce que le tout contient en puissance. « En puissance » ne veut pas dire ici inachevé : c'est la manière dont **un tout contient ses parties**, {yellow}comme une semence contient la raison de l'œil et celle de la main sans qu'elles soient encore séparées{/yellow}. Or **la structure du produit suit celle de sa cause** : si l'Intellect est un et plusieurs, l'âme, qui en procède, l'est aussi. Il faut donc {teal}« qu'il y ait aussi à la fois des âmes et une âme unique, et que de l'âme unique soit issue la multiplicité des âmes, comme du genre unique sont issues les espèces, les unes meilleures, les autres pires »{/teal}, selon qu'elles pensent plus ou moins.

    __**Inclusion, non génération.**__ Le genre ne produit pas les espèces hors de lui, il les **contient**. Plotin évite ainsi de faire des âmes individuelles un produit de l'Âme, comme l'Âme est un produit de l'Intellect : l'Âme et les âmes forment **une seule réalité**, et chaque âme est l'Âme sous un aspect particulier.

    __**Deux images**__ (l. 16-21).

    - {yellow}Une cité qui aurait une âme{/yellow} et contiendrait d'autres êtres animés : son âme est {teal}« plus parfaite et plus puissante »{/teal}, mais rien n'empêche que les autres âmes existent. L'image montre qu'**une âme englobante ne supprime pas les âmes qu'elle contient**.
    - {yellow}Le feu universel{/yellow}, dont sont issus le grand et le petit feu : le petit feu n'est pas un morceau de feu de moindre qualité, il a toute la nature du feu. L'image, reprise du {sky}*Philèbe*{/sky}, montre que **chaque âme a la même nature que l'Âme dont elle vient**. Elle a trois niveaux : la réalité dont vient le feu universel, le feu universel, les feux ; comme l'Intellect, l'Âme universelle, les âmes.

    Les deux images s'arrêtent là où commence l'espace : dans une cité ou dans un foyer, les parties occupent des lieux distincts ; les âmes, incorporelles, ne sont séparées par aucune distance, elles se distinguent par leur activité.

    __**Ce qui distingue l'âme de l'Intellect**__ (l. 21-25). Penser ne lui suffit pas : {red}« Qu'est-ce en effet qui la différencierait de l'Intellect ? »{/red} Deux réalités qui feraient exactement la même chose n'en feraient qu'une. L'âme a donc {teal}« ajouté au fait d'être intelligente quelque chose d'autre »{/teal}, une **fonction** : gouverner ce qui vient après elle. Cet ajout n'est pas un surcroît de perfection : avoir une tâche tournée vers le bas, c'est être moins ramassé que ce qui se suffit à penser.

    __**Penser vers le haut, gouverner vers soi**__ (l. 25-30). {teal}« Lorsque donc elle regarde vers la réalité qui la précède, elle pense, mais si c'est vers elle-même qu'elle se tourne, elle ordonne et gouverne ce qui lui est postérieur »{/teal}. Elle ne gouverne pas en se penchant sur le corps, mais **en se concentrant en elle-même** : en se tournant vers soi, elle actualise les raisons qu'elle contient, et ce sont elles qui ordonnent le sensible. Cette fonction est nécessaire : {coral}« il n'est pas possible que toutes choses demeurent dans l'intelligible, alors qu'une autre réalité peut exister à sa suite, certes inférieure, mais nécessaire »{/coral}. Une puissance qui peut produire et ne produirait pas laisserait le réel incomplet : ce sera l'argument des chapitres 5 et 6.

    __**Une faute pour toutes les âmes.**__ Si la cause de la descente est le repli de l'âme sur soi (chap. 4), toute âme individuelle la commet : il n'y a pas d'âmes immaculées par naissance, comme les « pneumatiques » que se disaient les gnostiques. Mais il n'y a pas non plus d'âmes perdues : toutes ont la même nature, et toutes peuvent remonter.

    __**Le produit ressemble à son principe, en moins.**__ La formule « un et plusieurs » vient du {sky}*Parménide*{/sky} ; le traité 10 (V, 1) y distinguera l'Un au sens propre, l'Intellect « un-plusieurs » et l'Âme « un et plusieurs ». Deux principes commandent ce passage : **le produit ressemble à son principe**, et **il lui est inférieur**. L'âme est donc une et multiple comme l'Intellect, mais autrement : l'Intellect saisit tout d'un coup, l'âme pense dans le temps et par étapes. C'est pour la même raison qu'elle a une double activité : penser comme l'Intellect, mais moins parfaitement, et produire à son tour.

    __**La cité, contre ceux qui jugent le tout par la partie.**__ Le traité 33 reprendra l'image autrement : juger l'âme du tout d'après la nôtre, ce serait blâmer toute une cité bien administrée d'après ses potiers et ses forgerons ; on ne juge pas le supérieur par l'inférieur. Ici, l'image dit l'autre face : le citoyen appartient à la cité tout en en étant une partie, et partage la nature du tout.

    __**Gouverner, une pensée pratique.**__ En se tournant vers elle-même, l'âme pense comment ordonner ce qui la suit : une pensée pratique, proche de la sagesse (*phronêsis*), qui sait ce qu'il faut faire sans avoir à le calculer. L'âme divine n'a pas le raisonnement hésitant de l'âme humaine : elle tient de l'Intellect ce qu'elle sait, et n'a qu'à l'ordonner.

    ! L'âme gouverne le corps non en se tournant vers lui, mais en se tournant vers elle-même : gouverner, pour elle, c'est se concentrer, non se disperser.

    ! *Comme les espèces du genre* ne fait pas des âmes des produits de l'Âme : elles y sont incluses, non engendrées.
