- id: traite6-l6
  title: "Repérage : le plan du traité 6"
  notes: |-
    **Le traité 6 pose la question (chap. 1), compare le gouvernement des corps par les différentes âmes (chap. 2-4), résout la tension du volontaire et du nécessaire (chap. 5-6), puis situe l'âme entre sensible et intelligible (chap. 7-8).**

    | Moment | Lieu | Ce qui s'y joue |
    | l'expérience et la question | chap. 1 | Empédocle, Héraclite, Platon : destinée individuelle ou nécessité ? |
    | le gouvernement bienheureux | chap. 2 | l'âme de l'univers et celles des astres gouvernent sans pâtir |
    | l'âme et l'Intellect | chap. 3 | la cité douée d'une âme ; l'âme ajoute à la pensée le gouvernement des corps |
    | la chute des âmes individuelles | chap. 4 | isolement ; le caractère « amphibie » des âmes |
    | volontaire et nécessaire | chap. 5 | la faute et le châtiment ; l'âme manifeste ce qu'elle est |
    | la puissance de l'Un | chap. 6 | elle s'étend à tout ; le sensible manifeste l'intelligible |
    | le statut intermédiaire | chap. 7 | l'âme téméraire ; l'expérience du mal fait connaître le bien |
    | gouverner sans perdre l'Intellect | chap. 8 | la partie supérieure de l'âme ; l'âme de l'univers gouverne grâce à l'Intellect |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! La réponse à la question du chapitre 1 ne vient qu'au chapitre 5 : les chapitres 2 à 4 préparent la distinction entre les âmes.
