- id: traite6-l3
  title: "La hiérarchie des âmes"
  notes: |-
    **Tout au long du traité 6, l'identité de l'âme est définie par son caractère duel** : résider « ici », dans le sensible, tout en demeurant « là-bas », dans l'intelligible. « Car toute âme possède une partie inférieure orientée vers le corps et une partie supérieure orientée vers l'Intellect » (8, 11-13).

    **On peut distinguer trois niveaux d'âmes :**

    | Niveau | Nom | Rapport au corps |
    | l'Âme totale ou universelle | `ὅλη` ou `πᾶσα ψυχή`, l'« Âme-hypostase » | aucun : seule âme sans structure duelle |
    | l'âme de l'univers | `ψυχὴ τοῦ παντός`, âme du tout | gouverne le corps du monde, impassible |
    | les âmes des vivants individuels | âmes particulières | pâtissent du corps, en sont « contaminées » |

    - L'Âme universelle est l'unité originelle des âmes, encore non dissociée de l'Intellect. Plotin ne maintient pas toujours sa distinction d'avec l'âme de l'univers (chap. 8, 13).
    - **La cheville ouvrière du traité** : l'âme de l'univers (et celle des astres) gouverne son corps sans en pâtir, l'âme individuelle est **« contaminée »** par le sien (2, 26-30). Là est la racine du mal qu'elle subit.

    **Conséquence : ce n'est pas l'orientation vers le corps qui fait le mal**, puisque l'âme de l'univers, double elle aussi, n'en a aucune trace. Plotin réfute ainsi, dès le traité 6, le mépris des **gnostiques** pour le sensible : le monde n'est pas mauvais en soi, il a une bonté et une beauté propres, comme le montraient déjà les traités 1 et 3.

    ! Toutes les âmes ont la même structure duelle, sauf l'Âme universelle : ce qui les distingue, c'est leur situation à l'égard du corps.
  points:
  - id: traite6-l3-p1
    sentence: "« Car toute âme possède une partie inférieure orientée vers le corps et une partie ___ orientée vers l'Intellect » (traité 6, 8, 11-13)."
