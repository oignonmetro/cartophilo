- id: traite6-l2
  title: "L'expérience de l'éveil (chap. 1, l. 1-7)"
  notes: |-
    Le chapitre 1 s'ouvre sur l'un des passages les plus célèbres de Plotin : le récit, à la première personne, d'un éveil de l'âme à elle-même. Ce récit n'est pas un ornement : il **fournit le point de départ du problème**, en montrant d'abord ce qu'est l'âme quand elle n'est pas tournée vers un corps. C'est parce qu'on sait ce qu'elle est en elle-même que sa présence dans un corps fait question.

    **L'expérience.** {teal}« Souvent, lorsque je m'éveille à moi-même en sortant de mon corps, et qu'à l'écart des autres choses je rentre à l'intérieur de moi, je vois une beauté d'une force admirable »{/teal}. Plotin y mène « la meilleure des vies », **« devenu identique au divin »**, au-dessus de tout le reste de l'intelligible. Il ne s'agit pas ici de l'union à l'Un que rapporte Porphyre dans la *Vie de Plotin*, mais d'une participation à la vie de l'**Intellect** : l'âme dépasse son propre niveau pour vivre la vie de la réalité qui la précède.

    __**Un fait d'expérience, non un postulat.**__ Plotin ne part pas d'une thèse sur l'âme, qu'on pourrait contester, mais de ce qu'il a lui-même éprouvé, et **« souvent »** : l'expérience se renouvelle, dans cette vie même, et n'attend pas la mort. Elle établit ce que la suite présuppose, que {coral}l'âme n'est pas de nature corporelle{/coral} : capable de se mettre {teal}« à l'écart des autres choses »{/teal} et de vivre la pensée de l'Intellect, elle a là-bas sa vraie patrie. La beauté qu'elle voit est celle de l'intelligible, comme au traité 1 (I, 6).

    __**Un acte de la pensée, non un ravissement.**__ Les mots de Plotin sont ceux de la réflexion : {teal}« je m'éveille à moi-même »{/teal}, {teal}« je rentre à l'intérieur de moi »{/teal}. Il ne décrit pas une transe où l'on perdrait la raison, mais **un retour lucide de l'âme sur elle-même**, qui la découvre plus grande qu'elle ne se croyait. {pink}Sortir de son corps{/pink} ne veut pas dire le quitter, mais {green}cesser d'être tourné vers lui{/green} : c'est un changement d'attention, non de lieu.

    **Pourquoi commencer par là ?** Parce qu'on aborde ainsi la question **par le haut**. D'ordinaire, on part de l'âme telle qu'on la connaît, mêlée au corps, troublée, et l'on se demande comment elle pourrait s'en délivrer. Plotin fait l'inverse : il part de l'âme telle qu'elle est **« en elle-même »** (l. 10), et {coral}c'est alors sa présence dans un corps qui devient étrange.{/coral} Le problème n'est plus {pink}*comment sortir du corps ?*{/pink}, mais {amber}« comment mon âme a jamais pu se trouver à l'intérieur de mon corps »{/amber} (l. 9-11).

    __**Au niveau de l'Intellect, non de l'Un.**__ Certains ont lu dans ce passage l'union à l'Un que Porphyre rapporte de son maître. La confusion vient d'une traduction : *établi au-dessus de tout l'intelligible* placerait l'âme au-delà de l'Intellect, donc dans l'Un. Mais le texte dit {teal}« au-dessus de tout le reste de l'intelligible »{/teal} : l'âme se tient au premier rang des intelligibles, au niveau de l'Intellect, et c'est bien {teal}« de l'Intellect »{/teal} qu'elle redescend vers le raisonnement (lecture de P. Hadot). S'assimiler à l'Intellect est la première étape de l'union à l'Un, non l'union elle-même.

    __**Un réveil, car la sensation est un sommeil.**__ Le mot est pris au sens fort. Pour Plotin, {pink}vivre selon la sensation, c'est dormir{/pink} : le traité 26 (III, 6) dira que {teal}« le réveil avec le corps n'est que le changement d'un sommeil pour un autre sommeil, comme on passerait d'un lit à un autre »{/teal}, et que le vrai réveil consiste à se lever sans le corps. S'éveiller à soi, c'est sortir du rêve où l'on prend le sensible pour le réel. L'éveil se fait donc sans sensation ni plaisir, comme dans le {sky}*Phédon*{/sky}, où l'âme raisonne le mieux quand rien de sensible ne la trouble ; Aristote, lui, comptait encore la sensation parmi nos plus grandes jouissances.

    __**L'étonnement.**__ La beauté vue est {teal}« d'une force admirable »{/teal}, et le « souvent » dit qu'on ne s'y habitue pas : même répétée, l'expérience étonne. Plotin reprend l'étonnement par lequel, selon le {sky}*Théétète*{/sky}, commence la philosophie, mais le place plus haut : le véritable étonnement naît devant les réalités intelligibles.

    __**Une intériorité, non une évasion.**__ Une lecture récente du traité y voit une réponse aux gnostiques, pour qui l'élu laisse son corps sur terre et monte de sphère en sphère jusqu'à la révélation. Chez Plotin, rien ne monte d'un lieu à un autre : **l'âme rentre en elle-même**, et c'est en elle que se trouve l'intelligible. La perfection consiste moins à s'enrichir qu'à se simplifier.

    ! L'éveil n'est pas une sortie hors du corps au sens physique : c'est un retour à soi, un changement d'attention ; le corps reste là, l'âme cesse d'être tournée vers lui.
