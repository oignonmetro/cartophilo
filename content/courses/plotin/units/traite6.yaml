- id: traite6-l6
  title: "L'isolement, la chute, et les âmes amphibies (chap. 4)"
  notes: |-
    Le chapitre 4 donne enfin la cause propre de la descente des âmes individuelles : non pas le corps, mais un mouvement de l'âme elle-même, qui se sépare du tout pour s'occuper d'une partie.

    **D'abord, les âmes gouvernent sans descendre** (l. 1-10). Elles ont un désir intellectuel tourné vers leur origine, et une puissance tournée vers ici-bas, {yellow}comme la lumière qui, suspendue au soleil, ne refuse pas jalousement d'éclairer ce qui vient après elle{/yellow}. Tant qu'elles restent avec l'Âme totale dans l'intelligible, elles gouvernent avec elle, {yellow}comme ceux qui aident le roi à gouverner sans descendre des demeures royales{/yellow}.

    **Puis vient l'isolement** (l. 10-25). {teal}« Les âmes s'éloignent de ce tout que forme l'Âme pour devenir une partie et être leurs propres maîtres »{/teal}, comme fatiguées d'être avec une autre. Le reste suit pas à pas : l'âme cesse de regarder l'intelligible, s'isole, s'affaiblit, **s'affaire**, se juche sur un seul objet (son corps), sans cesse heurté par tout le reste, et le gouverne **« avec embarras »**, en pénétrant profondément en lui pour le protéger. C'est cela, la « perte des ailes » et les « chaînes du corps » dont parle Platon : {red}l'âme a perdu l'immunité qu'elle avait en gouvernant avec l'Âme totale{/red}.

    **La chute n'est pas un mépris du corps, mais un rétrécissement de l'attention.** L'âme n'est pas punie pour avoir un corps : elle souffre parce qu'elle s'est enfermée dans le souci d'une partie, au lieu de gouverner avec le tout. Comme un fonctionnaire qui quitterait le conseil du roi pour administrer seul un village toujours menacé.

    **Mais elle garde toujours quelque chose de supérieur** (l. 25-35). En se tournant vers l'intellection, par la réminiscence, elle se défait de ses chaînes et remonte. {coral}Les âmes sont « amphibies »{/coral}, comme les animaux qui vivent dans deux éléments : une partie de leur vie ici, une partie là-bas, plus ou moins selon leur nature.

    **La lecture du *Timée*** (l. 35-42). Quand Platon fait « semer » les âmes par le dieu, ou le fait discourir, il parle comme on parle au peuple : le **discours hypothétique** déroule dans un récit ce qui existe toujours de la même manière.

    ! La faute n'est pas d'avoir un corps, mais de s'isoler du tout : c'est le repli sur une partie qui fait souffrir l'âme.
