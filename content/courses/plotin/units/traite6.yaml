- id: traite6-l6b
  title: "Les âmes amphibies, et le discours du Timée (chap. 4, l. 25-42)"
  notes: |-
    La fin du chapitre 4 tempère la chute : l'âme tombée ne l'est jamais tout à fait. **Elle garde toujours quelque chose de supérieur**, qui lui permet de remonter, et vit ainsi sur deux plans ; Plotin le retrouve, à mots couverts, dans le {sky}*Timée*{/sky}.

    __**Une situation meilleure, une chute**__ (l. 25-28). {teal}« Pourtant sa situation antérieure, lorsqu'elle montait, était en tous points meilleure pour elle »{/teal}. Après sa chute, l'âme est capturée, et agit par sa **faculté sensible**, {teal}« parce que ses débuts dans cette nouvelle condition l'empêchaient de se servir de son intelligence pour agir »{/teal} : submergée par les chocs et les besoins d'un corps nouveau, elle réagit avant de penser, {yellow}comme on pare un coup avant d'y réfléchir{/yellow}.

    __**La remontée par la réminiscence**__ (l. 28-31). Platon la dit « ensevelie » et « dans la caverne », mais {green}« en se tournant vers l'intellection elle se défait de ses chaînes et remonte »{/green}, « lorsqu'elle commence, grâce à la réminiscence », à {teal}« contempler les choses qui existent réellement »{/teal} ({sky}*Phèdre*{/sky}). Ses chaînes sont celles de son attention : il lui suffit de la retourner. Remonter n'est pas fuir le corps, c'est **se ressouvenir** de ce qu'elle a toujours contemplé.

    __**Toujours quelque chose de supérieur**__ (l. 30-31). Cette remontée est possible pour une raison : {coral}« elle possède toujours quelque chose qui détient une certaine supériorité »{/coral}. La chute ne touche que son activité, non sa substance : une part d'elle n'a pas suivi. C'est l'annonce de la thèse du chapitre 8.

    __**Les âmes amphibies**__ (l. 31-35). {teal}« Les âmes sont donc pour ainsi dire amphibies, puisqu'il faut qu'elles mènent une partie de leur vie ici et l'autre partie là-bas »{/teal}, {yellow}comme les animaux qui vivent dans deux éléments, la terre et l'eau{/yellow}. La part varie selon les âmes : {green}celles qui sont « plus capables de s'unir à l'Intellect, prennent plus part à la vie de là-bas »{/green}, {red}d'autres, qui « par nature ou par hasard ont des dispositions contraires, sont plus immergées dans la vie d'ici »{/red}. Amphibie ne veut pas dire coupée en deux morceaux, l'un en haut, l'autre en bas : c'est **une même âme qui exerce deux activités** à deux niveaux.

    __**Ce que le *Timée* laisse entrevoir**__ (l. 35-38). Platon divise ce qui vient du second mélange (Plotin dit « du second cratère ») et en fait des **parts** ; puis il ajoute qu'« il est nécessaire qu'elles viennent dans le devenir », {coral}« puisque ce sont justement des parts qui sont de cette qualité »{/coral}. Être une part, c'est être destinée à s'occuper d'une partie : la descente est inscrite dans la nature de l'âme individuelle.

    __**Le discours hypothétique**__ (l. 38-42). Quand Platon fait « semer » les âmes par le dieu, ou le fait discourir, il parle {teal}« comme s'il s'adressait au peuple »{/teal} : {coral}« le discours hypothétique les engendre et les produit en les introduisant au fur et à mesure dans l'exposé, alors qu'elles adviennent et existent toujours de la même manière »{/coral}. Un récit raconte dans l'ordre du temps ce qui est éternel, parce qu'on ne peut tout dire à la fois. Il ne faut donc pas imaginer un dieu qui déciderait un jour d'envoyer les âmes : cela mettrait du changement et du calcul dans l'intelligible.

    __**Un argument par la réminiscence.**__ La réminiscence prouve davantage qu'une possibilité de remonter : si l'âme peut retrouver les vérités de là-haut, c'est qu'elle a gardé quelque chose qui les touche, un intellect. **Une âme tout entière descendue n'aurait plus rien par où se ressouvenir.** La thèse du chapitre 8 est déjà là : l'âme ne peut pas être descendue en totalité.

    __**Un mot neuf.**__ *Amphibios* était un mot courant, pour les bêtes qui vivent sur terre et dans l'eau ; Plotin est le premier à en faire un terme de philosophie, et ne l'emploie qu'ici. Le « pour ainsi dire » le signale comme une image. Et le grec dit que les âmes **deviennent** amphibies (*gignontai*) : avant la descente, elles n'étaient pas séparées de l'Âme totale ; c'est en descendant qu'elles se mettent à vivre deux vies.

    __**L'âme ne va pas dans le corps comme dans un lieu.**__ Certains commentateurs (J.-F. Pradeau) soutiennent que l'âme ne descend pas réellement : ce sont ses raisons, une image d'elle-même, qui viennent former la matière, comme la nature, dit le traité 5, donne forme sans leviers, à la façon de la lumière qui émane du feu. Plotin dit pourtant plusieurs fois que l'âme « plonge » ; les deux se concilient si l'on entend que l'âme se donne au corps par ses puissances, sans y être enfermée.

    __**Plotin dépasse le *Timée*.**__ Platon dit nos âmes faites des restes du premier mélange, moins purs ; mais il ne dit nulle part qu'une partie d'elles reste là-haut, et il hiérarchise les âmes (l'homme, puis la femme, puis la bête). Plotin emprunte ses mots pour une thèse nouvelle : toute âme est sœur de l'âme du monde et garde un lien avec l'Intellect ; les âmes ne diffèrent que par leurs dispositions.

    ! Amphibie ne veut pas dire coupée en deux : c'est la même âme qui vit à deux niveaux.

    ! Le « discours hypothétique » ne trompe pas : il expose dans le temps, pour être compris, ce qui est toujours.
