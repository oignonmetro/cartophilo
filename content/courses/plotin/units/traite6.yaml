- id: traite6-l4a
  title: "Prendre soin d'un corps n'est pas un mal (chap. 2, l. 1-26)"
  notes: |-
    Le chapitre 2 ouvre la réponse : avant de juger la descente, il faut savoir ce que c'est, pour une âme, que d'avoir un corps. Plotin établit d'abord que **gouverner un corps n'est pas un mal en soi** : ce qui fait la peine, c'est d'avoir à défendre une partie.

    __**Trois enquêtes en une**__ (l. 1-9). Pour comprendre ce que Platon dit de notre âme, il faut savoir ce qu'est l'âme en général, puisque la nôtre n'en est qu'un cas ; ce qu'est le monde pour qu'elle y habite {teal}« soit volontairement, soit poussée par la nécessité, soit d'une autre manière »{/teal} ; et si le producteur de l'univers {teal}« a bien œuvré »{/teal}, ou s'il est dans la situation de nos âmes, qui ont dû {teal}« plonger profondément à l'intérieur du monde »{/teal}. La troisième possibilité, « d'une autre manière », annonce la solution : une descente à la fois volontaire et nécessaire (chap. 5).

    __**Pourquoi nos âmes ont dû plonger**__ (l. 9-15). Sans elles, {red}« chaque élément des corps serait dispersé et porté vers son lieu propre »{/red} : la terre vers le bas, le feu vers le haut. Un corps composé n'a par lui-même **aucune unité** ; ses éléments ne demandent qu'à se séparer, et seule une puissance incorporelle les tient ensemble. Plotin parle à l'irréel : il ne décrit pas l'état présent des corps, mais ce qu'il serait sans l'âme. Or un corps particulier vit au milieu d'autres corps : ils seraient {red}« agressés par de nombreux éléments étrangers »{/red}, {red}« toujours dans le besoin »{/red}, et exigeraient donc **une providence « multiple et tumultueuse »**, qui pare aux coups un à un.

    __**Le corps du tout n'a pas de dehors**__ (l. 15-18). Le corps de l'univers, au contraire, est « parfait », « autosuffisant et autarcique » : {green}il n'est « rien qui en sorte et rien qui y entre »{/green}. Ce qui n'a pas de dehors ne peut être ni heurté ni privé : rien à craindre, rien à désirer. Il obéit donc sans résistance, et **n'a besoin que d'« une sorte de commandement bref »**. {yellow}On peut penser à un navire bien construit qui, par mer calme, n'a besoin que d'un coup de barre.{/yellow} Son âme est {teal}« toujours telle qu'elle veut naturellement être, sans éprouver de désir ou être affectée »{/teal}.

    __**La peine vient de la partie, non de l'âme.**__ Le principe sous l'argument est l'opposition du **tout** et de la **partie** : le tout est complet, la partie incomplète et dépendante de ce qui l'entoure. Ce n'est donc pas d'animer un corps qui fait souffrir l'âme, mais d'avoir à défendre une partie. La preuve : notre âme aussi, si elle s'associe à l'âme parfaite, {teal}« voyage dans les hauteurs en gouvernant le monde tout entier »{/teal} (formule du {sky}*Phèdre*{/sky}) ; quand elle s'écarte pour ne pas appartenir à un corps, elle participe, comme l'âme de l'univers, {teal}« avec facilité au gouvernement de l'univers »{/teal} (l. 18-23).

    __**Prendre soin n'est pas un mal**__ (l. 23-26). D'où la thèse : {green}« ce n'est en aucune façon un mal pour l'âme de fournir au corps la puissance d'être bien organisé et d'exister »{/green}, puisque {teal}« toute providence qui s'applique à une réalité inférieure n'empêche pas le principe de cette providence de demeurer dans le meilleur »{/teal}. Le principe est celui du **don sans diminution** : une cause produit sans quitter son rang ni s'appauvrir, comme la lumière éclaire sans que sa source s'éteigne. Le mal n'est donc pas dans le don, mais dans le **renversement d'attention** par lequel l'âme s'oublierait dans son objet : c'est ce que va préciser la distinction des deux soins.

    __**Trois questions qui annoncent le traité.**__ Comment l'âme est-elle disposée par nature à s'associer au corps ; ce qu'est le monde, d'où la question du volontaire et de la nécessité (chap. 4-5) ; le producteur a-t-il bien agi ? La troisième semble rhétorique pour un platonicien, puisque la bonté du démiurge est un principe du {sky}*Timée*{/sky}. Elle vise sans doute ceux qui la contestaient : les gnostiques, contre qui Plotin écrira le traité 33, que Porphyre intitule *Contre ceux qui disent que le démiurge du monde est mauvais et que le monde est mauvais*. Le producteur ne jouera pourtant presque aucun rôle dans le traité : son sujet est l'âme.

    __**Plonger, comme une semence.**__ « Plonger » n'est pas pris en mauvaise part : c'est le mot de la semence qui pénètre la matière pour la former (l'image remonte à Aristote, pour qui le mâle fournit la forme et la femelle la matière). Les âmes plongent pour **dominer** les corps, non pour s'y perdre.

    __**La providence n'est pas indigne du dieu.**__ Que prendre soin de l'inférieur n'empêche pas de demeurer dans le meilleur répond à une idée que Plotin combattra au traité 33 : il ne serait pas digne du dieu de regarder vers le bas. Plotin y objecte : si le dieu exerce sa providence sur vous, pourquoi négligerait-il le monde où vous êtes ? Ici déjà, la providence vaut pour tout l'univers, et non pour quelques élus.

    ! « Chaque élément des corps serait dispersé » est un irréel : Plotin ne dit pas que les corps se défont, mais ce qu'ils seraient sans âme.

    ! La peine ne vient pas de l'acte d'animer un corps, mais de la condition de partie du corps qu'on gouverne.
