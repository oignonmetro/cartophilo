- id: traite6-l3
  title: "Des énigmes à Platon : deux conceptions de la descente (chap. 1, l. 11-50)"
  notes: |-
    La seconde partie du chapitre 1 cherche une réponse chez les autorités, et n'en trouve d'abord que des énigmes, puis une contradiction apparente chez Platon lui-même : c'est elle que le traité devra résoudre.

    **La question : comment deux natures hétérogènes, l'une intelligible, l'autre sensible, forment-elles une « communauté » ?**

    __**Héraclite**__ (l. 11-18). Plotin lui prête quatre formules, qu'il détourne de leur sens pour les plier à sa question :

    - les {teal}« échanges réciproques »{/teal} entre les contraires évoquent le commerce de l'âme et du corps ;
    - le {teal}« chemin vers le haut et vers le bas »{/teal}, le double mouvement de l'âme, qui peut s'élever vers l'intelligible ou se tourner vers le sensible ;
    - {teal}« ce qui change reste en repos »{/teal}, l'âme qui, prise dans le devenir des corps, reste en repos là-bas ;
    - {teal}« la fatigue consiste à s'adonner aux mêmes tâches et à leur être assujetti »{/teal}, la peine de l'âme qui a un corps à gouverner.

    Mais Héraclite {red}« a donné ces images en négligeant de nous les expliquer clairement »{/red}, « sans doute dans le but de nous obliger à chercher par nous-mêmes, comme il a lui-même trouvé en cherchant ».

    __**Empédocle et les pythagoriciens**__ (l. 18-23). {sky}Empédocle{/sky} apporte une autre idée : la descente est **la suite d'une faute**, {teal}« c'est une loi pour les âmes si elles ont commis des fautes de chuter jusqu'ici »{/teal}, et lui-même se dit « exilé loin du dieu » pour avoir « obéi à la Discorde en furie ». Les pythagoriciens en disent autant, mais **« par énigmes »**, dans un langage réservé aux initiés. Empédocle avait le droit de n'être pas clair, puisqu'il parlait **en poète**.

    __**Pourquoi ces autorités ne suffisent pas.**__ Elles disent vrai, mais par images : {coral}une image suggère sans démontrer, et une même image peut se lire en plusieurs sens{/coral}. Ce qu'il faut à Plotin, ce sont des raisons et des concepts qui permettent de trancher. Il ne les méprise pas pour autant : Héraclite nous a « encouragés à faire cette recherche ».

    **Reste Platon**, dont on a l'espoir de « tirer de lui quelque chose de clair ». Mais {red}« il ne dit pas partout la même chose »{/red}. Il y a chez lui deux séries de textes.

    | Conception | Textes | Ce qu'est la descente |
    | pessimiste | *Phédon*, *République*, *Phèdre* | une faute : l'âme enchaînée, en prison, dans la caverne, qui a perdu ses ailes |
    | cosmologique | *Timée* | un achèvement : l'âme envoyée par la bonté du démiurge pour rendre l'univers intelligent |

    __**Pourquoi le *Timée* fait de la descente un bien.**__ L'univers devait être intelligent, et l'intellect ne peut être présent sans une âme : l'âme lui a donc été donnée {teal}« afin que cet univers soit intelligent, puisqu'il fallait qu'il le fût et que ce n'était pas possible sans l'âme »{/teal}. Et il devait contenir {teal}« les mêmes genres d'êtres vivants que dans le monde intelligible, et en nombre égal »{/teal} : sans nos âmes, la copie serait incomplète.

    __**Une contradiction sur trois plans.**__

    - **La valeur du monde sensible** : {red}une prison et une caverne dont il faut sortir{/red}, ou {green}un « dieu bienheureux » dont Platon loue l'ordre{/green} ?
    - **La cause de la descente** : {red}une faute de l'âme, punie par la perte de ses ailes{/red}, ou {green}un envoi par « la bonté du démiurge »{/green} ?
    - **Le statut de la descente** : un acte dont l'âme répond, donc volontaire, ou une nécessité, puisqu'il fallait que l'univers fût parfait ?

    __**Pourquoi la contradiction est grave.**__ Pour le monde d'abord : si la descente n'est qu'une peine, le sensible est un mal, et l'on donne raison à ceux qui le méprisent, les gnostiques que Plotin combattra dans le traité 33 (II, 9). Pour l'âme ensuite : si la descente n'est qu'une nécessité, elle ne répond de rien, et l'on ne voit pas pourquoi elle serait punie. Pour Platon enfin : {coral}si le « divin Platon » se contredit, son autorité tombe{/coral}. Plotin, convaincu de l'unité de sa pensée, va montrer qu'il n'y a pas contradiction, mais **deux points de vue sur une même réalité** : celui de l'univers, pour qui la descente est un bien nécessaire, et celui de l'âme, pour qui elle est une épreuve (chap. 5).

    __**Pourquoi ces citations ?**__ On a parlé d'une doxographie de hasard. Ce n'en est pas une : Plotin cite les anciens Grecs, et seulement eux (ni stoïciens, ni épicuriens, ni Aristote), pour montrer que **la vérité sur l'âme est déjà chez les Anciens**, et non dans des révélations nouvelles. Il les cite hors de leur contexte, au service de sa question. Selon une lecture anti-gnostique du traité, le choix d'Héraclite n'est pas innocent : la formule du chemin vers le haut et vers le bas apparaissait aussi dans un texte gnostique, les *Trois Stèles de Seth*, comme une parole de révélation ; Plotin y lit au contraire une invitation à chercher en soi.

    __**« Par énigmes ».**__ Le verbe (*ainittesthai*, « dire à mots couverts ») est un terme de l'allégorie : une parole obscure qui appelle une interprétation. Plotin le dit aussi de Platon ailleurs (les deux Aphrodite du *Banquet*, traité 9). L'obscurité n'est donc pas une faute : elle désigne un texte à interpréter, et c'est ce que le traité va faire de Platon.

    __**Plotin ne reproche rien à Platon.**__ « Il ne dit pas partout la même chose » n'est pas une critique : Plotin veut **unifier** ses discours pour en tirer sa propre doctrine, qu'il tient pour celle de Platon, contre ceux qui le lisent mal. Le traité 33 le dira : les gnostiques, ayant entendu Platon blâmer le corps comme un obstacle, en ont tiré la haine du monde. C'est pourquoi le {sky}*Timée*{/sky} compte tant ici : il montre que la descente, une peine pour l'âme, est **un bien pour l'univers**. Quant à la « prison » de la formule des Mystères (*phroura*), le mot peut aussi signifier un poste de garde, où l'âme serait la gardienne du corps ; ici, le contexte impose la prison.

    ! Plotin ne reproche pas à Platon d'être incohérent : il lit ses textes comme deux faces d'une même doctrine, qu'il s'agit de rendre explicite.
