- id: traite6-l7
  title: "Les deux fautes et leurs châtiments (chap. 5, l. 16-24)"
  notes: |-
    La suite du chapitre 5 répond à l'autre série d'images, celle de la faute et du jugement : si la descente est volontaire, elle engage la responsabilité de l'âme. Plotin distingue **deux fautes et deux châtiments**.

    __**Les deux fautes**__ (l. 16-24).

    | Faute | En quoi elle consiste | Son châtiment |
    | la première | la cause même de la descente | ce qu'elle subit en descendant |
    | la seconde | le mal qu'elle commet ici-bas | plonger dans d'autres corps, selon le jugement porté sur sa valeur |

    La première faute est l'alourdissement de l'âme avant sa chute, quand elle ne peut plus suivre le cortège du dieu ; son châtiment est **la descente même**, avec ce qu'elle y subit : la peine est immanente à la faute, l'isolement se punit par la condition de partie. La seconde tient à la manière, plus ou moins juste, dont elle vit dans le corps ; son châtiment est de plonger dans d'autres corps, **« moins profondément »** et plus brièvement selon la valeur qu'on lui reconnaît, mais {red}« une forme immodérée de mal entraîne un châtiment plus grand sous la surveillance de démons chargés de punir les fautes »{/red}. Plotin retrouve les deux moments du mythe du {sky}*Phèdre*{/sky} et le jugement du {sky}*Phédon*{/sky} ; le mot de « jugement » montre {teal}« ce qui arrive par la loi divine »{/teal}.

    __**Faute et nécessité ensemble ?**__ On objectera : comment la descente peut-elle être une faute si elle est nécessaire à l'achèvement de l'univers ? Les deux se disent de deux points de vue. **Du point de vue du tout**, la descente est un bien nécessaire ; **du point de vue de l'âme**, qui s'isole et s'alourdit, elle est une faute et sa peine. Il n'y a pas là deux événements, mais un seul, regardé d'en haut et d'en bas.

    __**Le jugement selon le mérite.**__ Plotin combine le mythe de l'attelage du {sky}*Phèdre*{/sky} et le jugement des morts du {sky}*Phédon*{/sky} : la rétribution suit le **mérite**, et le châtiment s'aggrave avec le mal commis. Il ne fige aucune âme : toutes ont de quoi contempler, même si toutes n'y sont pas également disposées ; le traité 5 compare les plus faibles à des oiseaux lourds, qui ont des ailes mais ont trop ramassé à terre pour s'envoler.

    ! Le premier châtiment n'est pas une peine ajoutée à la descente : c'est la descente elle-même, avec ce qu'elle fait subir.
