- id: traite6-l11
  title: "Quelque chose de l'âme reste là-bas (chap. 8)"
  notes: |-
    Le chapitre 8 conclut le traité sur sa thèse la plus audacieuse, que Plotin sait contraire à l'opinion des autres platoniciens : notre âme n'est jamais tout entière descendue.

    **La thèse.** {green}« S'il faut oser dire contre l'opinion des autres plus clairement ce que l'on pense, notre âme n'a pas plongé tout entière ici-bas, mais quelque chose d'elle reste toujours dans l'intelligible »{/green} (l. 1-3). C'est la doctrine de **l'âme non descendue**, que ses successeurs néoplatoniciens rejetteront.

    **L'objection : pourquoi ne le sentons-nous pas ?** Parce que, si la partie de l'âme qui est dans le sensible est dominée et troublée, elle ne nous laisse pas percevoir ce que contemple la partie supérieure. Ce qui est pensé là-haut **ne parvient jusqu'à nous que lorsqu'il arrive jusqu'à notre perception** : nous ne connaissons ce qui se passe dans une partie de l'âme que lorsque cela atteint l'âme tout entière. Il en va de même pour le désir : il est dans la partie désirante, mais nous ne le connaissons que quand nous le saisissons par la perception intérieure ou par la raison. **Penser n'est pas encore savoir qu'on pense.**

    **Toute âme a deux parties** (l. 11-13). {teal}« Toute âme possède une partie inférieure orientée vers le corps et une partie supérieure orientée vers l'Intellect »{/teal}.

    **Deux manières de gouverner** (l. 13-23).

    - **L'âme du tout** met en ordre l'univers par sa partie tournée vers le corps, en demeurant au-dessus de lui sans peine, car elle ne procède pas en raisonnant, mais par l'Intellect, {yellow}comme « la technique qui ne délibère pas »{/yellow} (formule d'Aristote) : l'artisan accompli ne délibère pas, il fait.
    - **Les âmes partielles** possèdent aussi le principe supérieur, mais sont **sans répit occupées par la sensation** et par beaucoup de choses contraires à leur nature, qui les troublent. Leur plaisir est trompeur.

    **Pourtant**, il existe en elles **« une partie de l'âme qui ne partage pas ces plaisirs éphémères, et dont l'existence est semblable à celle de là-bas »**. Le traité finit sur cette assurance : l'âme peut toujours se ressaisir, car elle n'a jamais tout à fait quitté sa patrie.

    ! L'âme non descendue n'est pas une âme qui ne fait rien : elle pense toujours ; c'est nous qui ne le savons pas toujours.
