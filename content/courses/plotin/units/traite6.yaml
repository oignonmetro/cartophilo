- id: traite6-l4
  title: "Deux façons de prendre soin ; l'âme du monde et les astres (chap. 2, l. 26-53)"
  notes: |-
    La seconde moitié du chapitre 2 donne la distinction qui commande tout le traité : **il y a deux manières de prendre soin d'un corps, et l'une seulement fait pâtir**. L'âme du monde et les âmes des astres gouvernent de la bonne manière : elles ont un corps, et ne pâtissent pas.

    __**Deux façons de prendre soin**__ (l. 26-30). L'une, **générale**, met en ordre {teal}« en commandant avec une autorité royale sans intervenir »{/teal} (*apragmôn*, « sans s'affairer ») ; l'autre, **particulière**, consiste à {teal}« produire immédiatement soi-même »{/teal}, et provoque, {red}« par le contact de l'agent avec ce sur quoi il agit, la contamination du premier par le second »{/red}.

    | Façon de prendre soin | Comment | Effet sur l'âme |
    | générale | elle met en ordre en commandant avec une autorité royale, sans intervenir | elle reste préservée |
    | particulière | elle produit elle-même, par contact avec ce sur quoi elle agit | elle est contaminée |

    __**Pourquoi le contact contamine.**__ La contamination n'est pas un mélange de substances : l'âme, incorporelle, ne se salit pas comme une main. C'est une **dépendance de l'attention** : qui produit lui-même, au contact, doit suivre chaque détail de ce qu'il fait, et finit par épouser les besoins, les chocs et les manques de son objet. {yellow}On peut penser au souverain qui gouverne par des lois, et au gardien qui doit veiller lui-même sur chaque porte : le premier reste maître de soi, le second vit au rythme des alertes.{/yellow} Les commentateurs débattent du sens de ce mot : Plotin admettrait-il ici que l'âme descendue n'est plus impassible (Dodds), ou parle-t-il de l'âme entière, sans en distinguer la partie supérieure, qui reste impassible (Blumenthal) ?

    __**Le dieu n'est pas responsable**__ (l. 30-38). L'âme divine gouverne le ciel de la première manière : sa partie supérieure reste {teal}« au-dessus du ciel »{/teal}, sa puissance inférieure est envoyée à l'intérieur (image du {sky}*Phèdre*{/sky}, où les âmes divines vont contempler au-delà du ciel, puis reviennent à l'intérieur). Dès lors {green}« on ne peut plus dire que le dieu est responsable du fait que l'âme de l'univers a été produite dans un lieu inférieur »{/green} : elle n'a été mise **nulle part**. Il n'y avait pas de lieu avant elle, c'est elle qui produit l'univers ; et sa partie supérieure n'a jamais quitté l'intelligible. Elle ne se trouve pas non plus privée de ce qui lui est conforme : elle le possède {teal}« de toute éternité »{/teal}, sans avoir jamais commencé.

    __**Les âmes des astres**__ (l. 38-48). Platon les dit disposées envers leurs corps comme l'âme de l'univers envers le sien, et place leurs corps {teal}« dans les cercles »{/teal} de l'âme. Or la communauté avec le corps est pénible pour deux raisons : elle est {red}un « obstacle » pour l'exercice de l'intellection{/red}, et elle {red}« remplit l'âme » de plaisirs, de « désirs » et de chagrins{/red} (*Phédon*). Ni l'une ni l'autre n'atteint l'âme {green}« qui n'a justement pas plongé à l'intérieur du corps, qui n'appartient à personne, et qui n'est pas possédée par le corps, mais qui le possède elle-même »{/green}.

    __**Posséder ou être possédé**__ (l. 48-53). Tout l'argument tient dans cette inversion. L'âme humaine est possédée par son corps parce qu'elle s'y est enfermée pour le défendre ; l'âme d'un astre possède le sien, elle le tient dans ses cercles sans s'y enfermer. Dès lors :

    - **rien ne lui manque** : le désir naît d'un manque de l'organisme, et un corps auquel rien n'est retiré ne manque de rien ;
    - **elle ne craint rien** : la crainte anticipe une destruction, et elle {teal}« ne s'attend jamais à rien de redoutable venant d'un tel corps »{/teal} ;
    - **rien ne la fait pencher** : aucune occupation ne la détourne {teal}« du meilleur et du plus heureux des spectacles »{/teal}, et elle ordonne l'univers {teal}« avec une puissance toute détachée »{/teal}.

    __**Le roi et l'art royal.**__ Le commandement « avec une autorité royale sans intervenir » rappelle le {sky}*Politique*{/sky} de Platon : le roi possède une science qui commande sans exécuter elle-même, comme un maître d'œuvre qui dirige ses ouvriers. Le mot *apragmôn*, « sans s'affairer », n'apparaît que trois fois chez Plotin : deux fois dans ce chapitre, une fois contre les gnostiques (traité 33). Il s'oppose à l'âme qui « s'affaire » (chap. 4) : l'agitation est le signe de la partie, la tranquillité celui du tout.

    __**« Contamination », ou plénitude ?**__ Le verbe grec (*anapimplanai*) signifie d'abord *remplir, combler la mesure*, puis *infecter*. Certains préfèrent un sens neutre : en animant les corps, l'âme comble leurs manques. Dans tous les cas, ce n'est pas la partie supérieure de l'âme qui pâtit, mais l'âme considérée comme un tout ; l'âme du monde, elle, reste impassible.

    __**Ce qui n'a pas commencé ne subit rien de contraire à sa nature**__ (l. 35-38). L'argument est serré : ce qu'un être possède depuis toujours, sans l'avoir reçu à un moment, lui est naturel ; or ce que l'âme du monde possède {teal}« lui appartient toujours et continûment, sans jamais avoir commencé »{/teal} ; donc rien de ce qu'elle a ne peut lui être contraire. Elle ne peut pas avoir été *mise* dans un état contre nature, puisqu'il n'y a pas eu de moment où elle aurait été autrement.

    __**Les astres heureux.**__ Le {sky}*Timée*{/sky} place les astres dans les cercles de l'âme, mais ne dit pas qu'ils sont heureux ; Plotin le tire d'{sky}Aristote{/sky}, pour qui il faut concevoir les astres comme participant à l'action et à la vie. Ce qui vit d'une vie parfaite et se meut du mouvement le plus parfait, le cercle, est heureux.

    __**L'obstacle n'autorise pas le mépris.**__ Que le corps soit un « obstacle » vient du {sky}*Phédon*{/sky}. Mais Plotin refuse d'en tirer la haine du corps : au traité 33, il reprochera aux gnostiques d'avoir entendu Platon blâmer le corps comme un obstacle et d'en avoir conclu au mépris du monde. L'âme du monde, ici, ne « s'incline » pas vers le bas : elle ordonne sans pencher, et le traité 33 dira que {teal}« ce n'est pas l'inclinaison qui produit, mais plutôt l'absence d'inclinaison »{/teal}.

    ! Ce n'est pas la perfection du corps de l'univers qui rend son âme heureuse : c'est la sérénité de l'âme qui donne au corps qu'elle produit sa perfection. Le corps reflète l'âme, il ne la détermine pas.

    ! L'impassibilité de l'âme du monde n'est pas l'apathie stoïcienne, effort de la volonté contre les passions : elle tient à sa situation, puisqu'elle n'a jamais plongé.
