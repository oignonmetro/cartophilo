- id: traite6-l5
  title: "Une âme et des âmes ; l'âme ajoute à la pensée le gouvernement (chap. 3)"
  notes: |-
    Le chapitre 3 passe de l'âme du monde à l'âme humaine, et explique d'abord comment il peut y avoir à la fois une âme et des âmes : il pense ce rapport sur le modèle de l'Intellect, un et multiple.

    **L'âme humaine pâtit** (l. 1-6). Platon dit qu'elle « endure toutes les peines » : folie, désirs, peurs ; le corps est pour elle une chaîne et un tombeau, le monde une caverne. Mais ce n'est pas en contradiction avec l'âme du monde, car **les causes de sa descente ne sont pas les mêmes** : on verra au chapitre 4 lesquelles.

    **Une âme et des âmes, comme un Intellect et des intellects** (l. 7-16). L'Intellect est « un et plusieurs » : il contient les intellects particuliers, chacun étant en acte ce que le tout contient en puissance. De même, il faut une âme unique, et la multiplicité des âmes qui en est issue, **comme les espèces du genre** : non par génération, mais par **inclusion**.

    **Deux images** (l. 16-21).

    - {yellow}Une cité qui aurait une âme{/yellow} et contiendrait d'autres êtres animés : son âme est plus parfaite et plus puissante, mais rien n'empêche les autres d'exister. L'image montre qu'une âme englobante ne supprime pas les âmes qu'elle contient.
    - {yellow}Le feu universel{/yellow}, dont sont issus le grand et le petit feu : la réalité du feu est une, ses manifestations multiples. L'image, reprise du *Philèbe*, montre que les âmes particulières ont la même nature que l'Âme dont elles viennent.

    **Ce qui distingue l'âme de l'Intellect** (l. 21-30). Penser ne lui suffit pas, sans quoi rien ne la distinguerait de l'Intellect : {teal}« elle a ajouté au fait d'être intelligente quelque chose d'autre »{/teal}. Tournée vers ce qui la précède, **elle pense** ; tournée vers elle-même, **elle gouverne** ce qui vient après elle. Et cette fonction n'est pas un accident : il ne peut se faire que tout reste dans l'intelligible, alors qu'une réalité inférieure, mais nécessaire, peut exister à sa suite.

    ! L'âme gouverne le corps non en se tournant vers lui, mais en se tournant vers elle-même : gouverner, pour elle, c'est se concentrer, non se disperser.
