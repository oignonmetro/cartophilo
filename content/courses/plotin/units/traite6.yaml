- id: traite6-l9
  title: "La puissance venue de l'Un ne s'arrête pas (chap. 6)"
  notes: |-
    Le chapitre 6 fonde la descente de l'âme sur ce qui fonde tout le système : la puissance qui vient de l'Un et qui doit aller jusqu'au bout. **Produire des corps n'est pas pour l'âme une déchéance, mais la continuation d'un don.**

    __**S'il n'y avait que l'Un**__ (l. 1-6). {red}« toutes choses resteraient cachées puisqu'elles n'ont pas de forme en l'Un, aucun être n'existerait, car l'Un resterait en lui-même »{/red}. L'Un est au-delà de toute forme : en lui rien n'est encore distinct. S'il ne produisait rien, sa puissance resterait voilée : il n'y aurait ni les Formes, nées de lui, ni la suite des âmes. « Resterait en lui-même » ne veut pas dire que l'Un sort de lui-même : il ne reste pas **seul**, il engendre sans quitter son repos.

    __**De la même manière pour les âmes**__ (l. 5-10). {teal}« De la même manière, il ne faut pas qu'existent seulement des âmes, sans que les objets qu'elles font naître ne deviennent visibles »{/teal}, « s'il est vrai qu'en chacune existe par nature la capacité de produire ce qui est après elle ». La procession est **une seule loi à tous les niveaux** : l'Un ne reste pas seul, l'Intellect non plus, et l'âme ne peut s'arrêter en chemin sans briser la chaîne et laisser ses puissances sans œuvres.

    __**La semence**__ (l. 7-10). Chaque âme se développe {yellow}« comme une semence, d'un principe indivisible vers un état final, qui est l'objet sensible »{/yellow}. La semence contient, ramassées et indivises, toutes les raisons du vivant ; sa nature est de se déployer jusqu'à son terme. L'image montre que **produire un corps n'est pas une altération violente, mais l'épanouissement naturel d'un principe**, qui ne perd rien en se déployant. Ailleurs (traité 45), la semence servira à dire l'affaiblissement ; ici, elle dit une expansion.

    __**La puissance sans jalousie**__ (l. 10-16). Ce qui vient en premier {teal}« demeure toujours à la place qui lui est propre »{/teal} ; ce qui vient après est engendré par {teal}« une puissance indicible »{/teal} qui {green}« ne doit pas s'immobiliser, comme bornée par la jalousie »{/green}, mais avancer jusqu'à l'ultime limite possible. Plotin reprend le {sky}*Timée*{/sky} : le dieu était bon, et {teal}« en ce qui est bon on ne trouve aucune jalousie »{/teal}. **S'arrêter avant le corps serait refuser l'existence à ce qui peut encore être** : une avarice que la bonté exclut. Il ne s'agit pas d'un sentiment du principe : l'absence de jalousie est la structure même de la procession.

    __**Chacun selon sa capacité**__ (l. 15-17). {teal}« Car il n'y a en vérité rien qui empêche n'importe quelle chose de prendre part à la nature du bien à la mesure de ce qu'elle est capable de recevoir »{/teal}. Le don est le même pour tous ; ce qui diffère, c'est **la capacité de recevoir**. D'où vient alors la laideur ? Non d'un refus de la source, mais de l'affaiblissement de la réception à mesure qu'on s'éloigne d'elle.

    __**L'alternative sur la matière**__ (l. 17-23).

    - {green}Si la matière est éternelle{/green}, elle **est** ; or « il n'est pas possible qu'elle ne participe pas, puisqu'elle est, à ce qui pourvoit au bien de toutes choses selon ce que chacune est capable de recevoir ».
    - {coral}Si elle est engendrée{/coral} par des causes antérieures, il n'est pas nécessaire non plus qu'elle soit séparée du bien, {red}« comme si ce qui, par une sorte de grâce, lui donne l'existence s'arrêtait, par incapacité à aller jusqu'à elle »{/red} : la puissance qui a pu la produire peut aussi l'atteindre.

    **Dans les deux cas, la matière n'échappe pas au bien.** Plotin n'a pas besoin de trancher, puisque les deux branches mènent à la même conclusion ; les commentateurs, eux, en débattent beaucoup (matière éternelle ou engendrée, matière intelligible ou sensible).

    __**Tout est solidaire**__ (l. 23-28). {coral}« tout est solidaire pour toujours »{/coral}, les réalités intelligibles, qui existent par elles-mêmes, et les sensibles, qui reçoivent leur existence par participation et imitent l'intelligible autant qu'elles le peuvent. Le sensible n'est pas un monde étranger, mais **l'image du premier**, et ce qu'il a de plus beau est la manifestation de la puissance et de la bonté de là-bas. Contre ceux qui méprisent le monde, Plotin le défend ; mais il ne lui donne pas d'existence propre : sans le modèle, l'image s'évanouirait.

    __**Faut-il alors fuir le corps ?**__ On objectera que Plotin demande ailleurs de s'enfuir d'ici. Les deux se concilient : il faut **détacher l'âme des passions d'un corps partiel**, mais **admirer le monde dans son ensemble** comme la manifestation du divin.

    __**La structure de l'argument**__ (l. 1-15). Deux prémisses : chaque réalité accomplie a par nature la puissance d'engendrer ; et il ne doit pas exister que l'Un. Une conclusion : de la même manière, il ne doit pas exister que des âmes. Puis deux conséquences : le premier demeure à sa place ; ce qui suit est engendré par une puissance indicible. Les prémisses s'appuient sur l'expérience : tout être naturel bien constitué engendre, et le monde sensible existe.

    __**La même loi, en mythe.**__ Le traité 10 (V, 1) dira la même chose par le mythe de Kronos et de Zeus : l'Intellect, rassasié, engendre l'Âme, {teal}« car puisqu'il est parfait, il devait engendrer, parce qu'une puissance aussi grande ne pouvait rester sans descendance »{/teal}.

    __**La matière, une question laissée ouverte.**__ Le traité 6 ne tranche pas, parce qu'il n'en a pas besoin. Le traité 51 tranchera : la matière est le mal même, privée de tout bien. On a voulu lever la contradiction (C. Arruzza) : « avoir part » ne dirait ici que l'opération de l'âme qui donne à la matière. On objecte que la matière plotinienne, à la différence de celle d'Aristote, n'est jamais vraiment informée : elle reste en deçà de tout ce qui vient sur elle. Il est plus simple d'admettre que la pensée de Plotin a évolué.

    __**Plus que le *Timée*.**__ Le {sky}*Timée*{/sky} disait que le dieu voulut rendre le monde plus semblable à son modèle, dans la mesure du possible. Plotin applique cette limite au sensible, non au producteur : l'Intellect et l'Âme déploient toute leur puissance, c'est le sensible qui imite l'intelligible autant qu'il le peut.

    ! La matière n'est pas ici le principe du mal : elle participe au bien selon sa capacité. Le traité 51 (I, 8) dira au contraire qu'elle en est « absolument privée » ; le traité 6 n'en est pas encore là.
