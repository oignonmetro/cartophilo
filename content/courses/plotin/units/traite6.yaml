- id: traite6-l10
  title: "Le rang moyen et l'expérience du mal (chap. 7)"
  notes: |-
    Le chapitre 7 situe l'âme dans la hiérarchie du réel, et tire de cette position une leçon presque consolante : même la chute peut servir.

    **Un rang moyen** (l. 1-7). La nature de l'âme est **double**, intelligible et sensible. Il vaut mieux pour elle être dans l'intelligible, mais il est nécessaire qu'elle participe aussi au sensible, puisque c'est sa nature : {green}elle ne doit pas « s'irriter contre elle-même » si tout n'est pas le meilleur{/green}, puisqu'elle occupe **un rang moyen** parmi les êtres. Elle est le **dernier des intelligibles**, à la frontière du sensible.

    **Donner et recevoir** (l. 7-11). À cette frontière, elle donne au monde quelque chose d'elle-même (la raison qui organise les corps) ; mais elle reçoit aussi de lui {red}quand elle le met en ordre sans préserver sa sécurité, et se précipite en lui avec une trop grande ardeur{/red}, au lieu de rester avec l'âme entière. C'est la « contamination » du chapitre 2.

    **L'expérience du mal** (l. 11-17). L'âme peut **remonter** après avoir éprouvé ce qu'elle a vu ici, et appris, par comparaison de ces conditions contraires, laquelle est la meilleure. {teal}« L'expérience du mal offre une connaissance plus manifeste du bien »{/teal} à ceux qui sont trop faibles pour connaître le mal par une science préalable. Comme on ne mesure la santé qu'après avoir été malade : non que la maladie soit bonne, mais le contraste instruit.

    **L'âme comme l'Intellect** (l. 17-31). De même que la sortie de l'Intellect va nécessairement jusqu'à l'âme (sans pouvoir remonter jusqu'à l'Un), l'activité de l'âme a, d'un côté, ce qui vient après elle, et de l'autre, le spectacle de ce qui la précède. Mais l'expérience diffère selon les âmes : pour les âmes individuelles, la conversion se fait **peu à peu, dans le temps**, au sein du pire ; **l'âme de l'univers**, elle, contemple ce qui est sous elle sans aucun mal, toujours suspendue à ce qui la précède.

    ! L'expérience du mal n'est pas recommandée : elle est le recours de ceux qui ne peuvent connaître le mal autrement. La connaissance par la science vaut mieux.
