- id: traite6-l10
  title: "Le rang moyen et l'expérience du mal (chap. 7)"
  notes: |-
    Le chapitre 7 situe l'âme dans la hiérarchie du réel, et tire de cette position une leçon presque consolante : **même la chute peut servir**.

    __**Un rang moyen**__ (l. 1-7). {teal}« Même si sa nature est double, intelligible et sensible, il est meilleur pour l'âme d'être dans l'intelligible »{/teal} ; mais il est nécessaire qu'elle participe aussi au sensible, puisque c'est sa nature, et {green}« elle ne doit pas s'irriter contre elle-même, si tout n'est pas ce qu'il y a de mieux »{/green}, puisqu'elle occupe **un rang moyen** parmi les êtres. S'irriter supposerait que sa présence ici soit contre nature ; or c'est sa nature même. Un univers complet exige tous les degrés d'être, et un être intermédiaire accomplit sa perfection en exerçant sa fonction d'intermédiaire, non en regrettant de n'être pas au sommet. L'homme, dira le traité 47 (III, 2), tient le milieu entre les dieux et les bêtes.

    __**Donner et recevoir**__ (l. 6-11). Elle a une partie divine, mais occupe {teal}« le dernier rang des intelligibles »{/teal} : à la frontière du sensible, elle **donne** au monde quelque chose d'elle-même, la raison qui organise les corps ; mais elle en **reçoit** aussi, {red}« dans le cas où elle le met en ordre sans préserver sa propre sécurité et où elle se précipite à l'intérieur de lui avec une trop grande ardeur sans rester tout entière avec l'âme entière »{/red}. Ce n'est pas la matière qui l'attaque, elle est passive : c'est l'âme qui, par excès de zèle, se laisse absorber par ce qu'elle gouverne. C'est la « contamination » du chapitre 2 ; l'âme du monde, elle, donne sans rien recevoir.

    __**L'expérience du mal**__ (l. 11-17). Il lui est possible de **remonter** après avoir éprouvé ce qu'elle a vu ici, et appris, {teal}« par la comparaison de ces conditions qui sont en quelque sorte contraires »{/teal}, laquelle des deux est la meilleure. {teal}« Car l'expérience du mal offre une connaissance plus manifeste du bien à ceux dont la puissance est trop faible pour connaître le mal par une science qui précède l'expérience »{/teal}. Les contraires s'éclairent l'un l'autre : qui a souffert mesure mieux la paix. Mais ce détour n'est nécessaire qu'aux âmes faibles ; une puissance parfaite sait sans avoir à éprouver. {yellow}Comme on ne mesure bien la santé qu'après avoir été malade : non que la maladie soit bonne, mais le contraste instruit.{/yellow} Au chapitre 5, il s'agissait de connaître le mal ; ici, de l'éprouver.

    __**Comme l'Intellect**__ (l. 17-23). Le parallèle éclaire la place de l'âme. Le mouvement de sortie de l'Intellect {teal}« ne peut pas remonter jusqu'à ce qui est au-delà »{/teal}, l'Un ; agissant hors de lui-même et {teal}« incapable de rester en lui-même »{/teal}, il doit {teal}« par une loi nécessaire de la nature »{/teal} aller jusqu'à l'âme, son point final, et lui laisse la réalité qui suit, le monde des corps. « Incapable » ne marque pas une impuissance : une puissance parfaite ne peut rester stérile. C'est d'ailleurs ce mouvement qui s'avance, l'Intellect lui-même demeure. {green}De même l'activité de l'âme a, d'un côté, ce qui vient après elle, de l'autre, le spectacle de ce qui la précède.{/green}

    __**Dans le temps, ou sans peine**__ (l. 23-29). Pour les âmes particulières, cette expérience a lieu {red}« petit à petit et dans le temps »{/red}, et {red}« la conversion vers le meilleur se fait dans ce qui est pire »{/red} : elles doivent s'arracher par un effort aux affections d'un corps. **L'âme de l'univers**, elle, n'a pas eu à faire cet effort : {green}« tout en n'étant affectée par aucun mal, elle peut observer par la contemplation les choses qui sont sous elle »{/green}, toujours suspendue à ce qui la précède. La différence n'est pas d'essence, mais de situation : les unes se sont isolées dans une partie, l'autre gouverne le tout.

    __**Les deux à la fois**__ (l. 29-31). {coral}« Les deux sont possibles à la fois »{/coral} : qu'elle reçoive d'en haut et {coral}« qu'elle subvienne aux besoins de ce monde, puisqu'il n'y a pas moyen que l'âme existe sans être aussi en contact avec ces réalités »{/coral}. Une âme incorporelle n'a pas à se fendre pour être en haut et en bas : donner vers le bas ne vide pas la source, et recevoir d'en haut ne l'empêche pas de donner.

    __**Le philosophe ne renie pas son corps.**__ Il faut participer au sensible, et l'âme humaine a même ce que l'âme divine n'a pas : l'**expérience** d'ici. {yellow}Comme le prisonnier de la caverne qui, sorti au soleil, redescend pour délivrer les autres{/yellow}, le philosophe vit aussi la vie humaine. On est loin du portrait de Porphyre, selon qui Plotin {teal}« semblait avoir honte d'être dans un corps »{/teal}.

    __**Une expérience gardée en mémoire.**__ L'âme remonte après avoir fait l'expérience d'ici : le mot grec (*historia*) dit une enquête, une information recueillie. Elle garde en mémoire ce qu'elle a vécu, et cette mémoire l'aide à connaître : placée au milieu, dira le traité 41, elle perçoit les deux mondes. Par là, même ceux qui ne peuvent connaître le mal par science finissent par découvrir le vrai : **la remontée n'est pas réservée à quelques élus**.

    __**Monter, puis redescendre.**__ L'Intellect lui-même ne remonte pas jusqu'à l'Un ; l'âme ne devient pas l'Intellect et doit redescendre. Plotin est ici proche d'{sky}Aristote{/sky} : la vie contemplative est la meilleure, mais elle dépasse peut-être ce qui est humain, et l'homme vit aussi des vertus de la cité.

    ! L'expérience du mal n'est pas recommandée : elle est le recours de ceux qui ne peuvent connaître le mal autrement. La connaissance par la science vaut mieux.
