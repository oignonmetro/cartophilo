- id: traite6-l2b
  title: "L'embarras : la question du traité (chap. 1, l. 7-11)"
  notes: |-
    Le récit de l'éveil s'achève sur un retour, et ce retour fait naître la question du traité : **si l'âme est telle qu'elle s'est montrée, comment a-t-elle jamais pu se trouver dans un corps ?**

    **L'embarras.** « __Redescendu de l'Intellect vers le **raisonnement**__** »**, Plotin avoue ne pas savoir {teal}« comment cette descente a lieu »{/teal}, ni comment son âme a pu se trouver dans son corps, si elle est vraiment telle qu'elle s'est montrée. La descente (*katabainô*) devient ainsi la question du traité : **comment deux natures hétérogènes, l'une intelligible, l'autre sensible, forment-elles une « communauté » ?**

    __**Un repos qui est une activité.**__ Plotin parle à la fois d'« activité supérieure » et de {teal}« repos dans le divin »{/teal}. Il n'y a pas contradiction : la pensée de l'Intellect est une activité, mais **sans raisonnement**, qui n'a plus à passer d'une idée à l'autre ni à revenir sur ce qu'elle tient ; elle est en repos parce qu'elle ne se meut plus. Redescendre au raisonnement, c'est retomber dans le temps, où l'on ne reçoit plus tout d'un coup, mais par inférences successives.

    __**Pourquoi l'embarras est légitime.**__ Le retour au **raisonnement** (*logismos*), la pensée discursive qui va d'une idée à l'autre, fait sentir le contraste entre deux régimes de la pensée : là-haut {green}l'intuition qui saisit tout d'un coup{/green}, ici {pink}le calcul qui avance pas à pas{/pink}. Or si l'âme est vraiment ce qu'elle s'est montrée, divine et sans besoin de rien, {red}sa présence dans un corps devient un scandale logique : pourquoi un être parfait quitterait-il la plénitude pour s'associer à ce qui est vulnérable et sujet au mal ?{/red} La difficulté ne tient pas à un trouble de l'humeur, mais à une contradiction apparente entre deux faits : ce qu'est l'âme, et où elle se trouve.

    __**L'âme ne s'est pas dégradée.**__ Plotin se demande comment son âme est dans un corps {teal}« si elle est bien en elle-même telle qu'elle a pu se manifester, quoiqu'elle soit dans un corps »{/teal} (l. 10-11) : l'expérience a été faite **dans le corps**. Ce n'est donc pas la substance de l'âme qui a changé en descendant, mais l'orientation de son attention. C'est déjà, en germe, la thèse du chapitre 8 : quelque chose d'elle reste là-bas.

    ! L'embarras n'est pas un doute sur l'expérience : c'est parce qu'elle est certaine que la présence de l'âme dans un corps fait difficulté.
