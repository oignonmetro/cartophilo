- id: traite6-l8
  title: "Descendre pour manifester sa puissance (chap. 5, l. 25-37)"
  notes: |-
    La fin du chapitre 5 renverse la perspective : la descente n'est pas seulement une peine qu'on explique, c'est une œuvre qu'on comprend. L'âme descend pour exercer sa puissance, et sans cela cette puissance n'existerait pour ainsi dire pas.

    **L'âme est « le dieu de dernier rang ».** Divine, venue de là-bas, elle se retrouve dans le corps, et cependant elle y vient {green}« par une libre inclinaison, et pour exercer sa puissance et mettre en ordre ce qui vient après elle »{/green} (l. 26).

    **Elle n'y perd rien si elle s'enfuit vite.** Elle aura même gagné **la connaissance du mal et de la nature du vice** : cette connaissance n'est pas une menace, elle a une valeur positive, comme l'exercice de sa puissance productrice.

    **L'argument de la puissance.** Ses puissances, ses œuvres, ses activités, {red}si elles étaient restées en repos dans l'incorporel, « auraient existé en vain »{/red} (l. 31), puisqu'elles ne seraient jamais passées à l'acte. Une capacité de produire qui ne produit jamais n'est qu'une capacité vide : un pianiste qui n'aurait jamais touché un clavier ne saurait même pas qu'il l'est. D'où la formule : {teal}« l'acte révèle partout la puissance qui sans lui demeurerait totalement cachée »{/teal}.

    **L'âme se connaît par ce qu'elle produit.** Plus encore : {coral}« l'âme elle-même aurait ignoré les choses qu'elle possède, puisqu'elles ne seraient même pas sorties pour se manifester »{/coral} (l. 32-33). Le corps n'est pas seulement l'effet de l'âme : il est ce par quoi l'âme devient visible à elle-même. Et nous aussi, nous pouvons **admirer l'intériorité des choses** grâce à la variété de leurs aspects extérieurs, et la connaître par les œuvres délicates qu'elle a réalisées.

    ! Le corps n'est pas ici un obstacle à la connaissance de l'âme, mais une voie d'accès à elle : il en est la manifestation la plus immédiate.
