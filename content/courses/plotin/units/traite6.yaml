- id: traite6-l11
  title: "Quelque chose de l'âme reste là-bas (chap. 8)"
  notes: |-
    Le chapitre 8 conclut le traité sur sa thèse la plus audacieuse, que Plotin sait contraire à l'opinion des autres platoniciens : **notre âme n'est jamais tout entière descendue**.

    __**La thèse**__ (l. 1-3). {green}« Et s'il faut oser dire contre l'opinion des autres plus clairement ce que l'on pense, notre âme n'a pas plongé tout entière ici-bas, mais quelque chose d'elle reste toujours dans l'intelligible »{/green}. Plotin doit « oser » parce que la thèse heurte l'expérience ordinaire, où l'on se sent tout entier limité par son corps, et l'opinion des autres platoniciens ; ses successeurs, Jamblique et Proclus, la rejetteront. Elle découle pourtant de ce qu'est l'âme : incorporelle, elle ne se déplace ni ne se coupe ; sa liaison au corps est **le déploiement d'une puissance vers le bas**, tandis que son sommet demeure.

    __**Pourquoi ne le sentons-nous pas ?**__ (l. 3-8). {red}« Si la partie qui est dans le sensible domine, ou plutôt si elle est dominée et troublée »{/red}, elle ne nous permet pas de percevoir ce que contemple la partie supérieure. Car ce qui est pensé là-haut {teal}« ne parvient jusqu'à nous que lorsqu'en descendant il arrive jusqu'à notre perception »{/teal}. Il faut distinguer **penser** et **savoir qu'on pense** : la partie supérieure pense toujours, mais « nous », qui vivons au niveau de la raison discursive et de la sensation, ne le saisissons que lorsque cette pensée descend jusqu'à notre perception intérieure. {yellow}Plotin compare ailleurs (traité 46) la partie inférieure à un miroir, qui ne reflète que s'il est en repos{/yellow} : troublée, elle ne laisse rien paraître de ce qui se pense en haut.

    __**Une partie de l'âme, l'âme tout entière**__ (l. 8-11). {teal}« Nous ne connaissons pas en effet tout ce qui a lieu dans une partie quelconque de l'âme avant que cela n'atteigne l'âme tout entière »{/teal}. La preuve par le désir : {yellow}« le désir qui réside dans la partie désirante de l'âme est connu par nous mais seulement lorsque nous le saisissons au moyen de la faculté de perception qui est intérieure, ou par la raison discursive, ou encore par les deux à la fois »{/yellow}. Un désir peut naître sans qu'on s'en aperçoive ; il n'en existe pas moins. De même, une pensée peut avoir lieu en nous sans que nous la sachions : **la conscience n'est pas la condition de la réalité d'une activité**. Ce n'est pas l'inconscient des modernes, fait de pulsions : c'est une pensée lumineuse, que le bruit des sens couvre.

    __**Toute âme a deux parties**__ (l. 11-13). {teal}« Car toute âme possède une partie inférieure orientée vers le corps et une partie supérieure orientée vers l'Intellect »{/teal}. Ce ne sont pas deux morceaux, mais deux orientations d'une même âme.

    __**L'âme du tout gouverne sans peine**__ (l. 13-17). Elle met en ordre le tout par sa partie tournée vers le corps, {green}« en demeurant au-dessus de lui sans aucune peine »{/green}, parce qu'elle {teal}« ne procède pas en raisonnant, comme nous, mais en usant de l'Intellect »{/teal}, {yellow}comme « la technique qui ne délibère pas »{/yellow} ({sky}Aristote{/sky}). La délibération est l'indice d'un doute ou d'un manque : l'apprenti hésite et calcule, l'artisan accompli fait. Ne pas délibérer n'est pas agir en aveugle, c'est agir par une vue si pleine qu'elle n'a pas besoin de calcul.

    __**Les âmes partielles**__ (l. 17-23). Elles possèdent aussi le principe supérieur, {red}« mais elles sont sans répit occupées par la faculté de sentir et par la perception de beaucoup de choses contraires à leurs natures »{/red}, qui les font souffrir et les troublent, {red}« puisque ce qui mobilise leur attention est une partie défectueuse qui a autour d'elle beaucoup de choses étrangères, et qui en désire beaucoup d'autres »{/red}. Une partie a un dehors, qui la menace, et des manques, qui la font désirer : son âme vit aux aguets. Elle éprouve du plaisir, {red}« mais ce plaisir s'avère trompeur »{/red} : il n'est que la fin momentanée d'un manque, et fait croire que le bien est dans le corps.

    __**Le dernier mot.**__ {green}« Néanmoins il existe aussi une partie de l'âme qui ne partage pas ces plaisirs éphémères, et dont l'existence est semblable à celle de là-bas »{/green}. Le traité finit sur cette assurance : l'âme peut toujours se ressaisir, car elle n'a jamais tout à fait quitté sa patrie. L'effort philosophique ne change pas sa substance, déjà sauve ; il **retourne l'attention** vers ce qui n'a jamais cessé de contempler.

    __**Contre l'opinion de qui ?**__ On en débat. Pour A. H. Armstrong et H. J. Blumenthal, Plotin s'écarte de la tradition platonicienne, tout en croyant exprimer la vraie pensée de Platon ; il trouve un appui chez Aristote. B. Fleet note qu'on ne trouve rien de tel chez les médioplatoniciens : c'est une innovation, et « les autres » sont des contemporains. Une lecture anti-gnostique y voit les gnostiques eux-mêmes, chez qui une forme de non-descente apparaît d'abord, et que Plotin reprendrait en la transformant.

    __**« Domine, ou plutôt si elle est dominée ».**__ La correction compte : la partie sensible n'est pas maîtresse, elle subit les pulsions du corps. Mais elle peut ne pas y céder, et c'est par elle que la pensée d'en haut nous devient perceptible : la sensibilité n'est pas seulement un obstacle, c'est **le relais** par lequel nous prenons conscience. L'âme, indivisible, doit tout entière se rendre disponible.

    __**Les mêmes facultés pour tous.**__ L'argument du désir dit aussi l'unité de l'âme : chacun a les mêmes parties, qui forment un tout ; nul besoin d'être un élu pour contempler. E. R. Dodds y voyait une anticipation du désir inconscient de Freud ; Plotin en tire plutôt que la raison doit juger un désir avant de le suivre : on ne sait vraiment ce que l'on désire qu'après y avoir réfléchi. Et la dernière phrase vaut pour toute âme : chacun garde une partie qui ne partage pas les plaisirs éphémères.

    ! L'âme non descendue n'est pas une âme qui ne fait rien : elle pense toujours ; c'est nous qui ne le savons pas toujours.

    ! Plotin « ose » sa thèse, mais elle n'est pas gratuite : elle découle de l'incorporéité de l'âme.
