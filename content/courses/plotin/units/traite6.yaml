- id: traite6-l6
  title: "S'isoler du tout : la chute de l'âme individuelle (chap. 4, l. 1-25)"
  notes: |-
    Le chapitre 4 donne enfin la cause propre de la descente des âmes individuelles, annoncée au chapitre 3 : non pas le corps, mais **un mouvement de l'âme elle-même, qui se sépare du tout pour s'occuper d'une partie**. C'est ce retrait sur soi qui fait naître l'âme individuelle.

    __**D'abord, les âmes gouvernent sans descendre**__ (l. 1-10). Chaque âme a deux orientations : {teal}« un désir intellectuel »{/teal} tourné vers son origine, et {teal}« une puissance orientée vers ce qui se trouve ici-bas »{/teal}. Avoir une puissance tournée vers le bas n'est pas encore déchoir. Plotin le montre par deux images.

    - {yellow}La lumière suspendue au soleil{/yellow} {teal}« ne refuse pourtant pas jalousement d'éclairer ce qui est après elle »{/teal} : elle éclaire sans se détacher de sa source. C'est l'analogie du soleil de la {sky}*République*{/sky}, abaissée d'un degré : non plus le Bien et l'intelligible, mais l'intelligible et l'âme.
    - {yellow}Les aides du roi{/yellow} gouvernent {teal}« sans descendre eux-mêmes des demeures royales »{/teal} : administrer n'exige pas de s'immerger, puisqu'ils sont {teal}« tous ensemble dans le même lieu »{/teal}, l'intelligible.

    Tant qu'elles restent avec l'Âme totale, les âmes gouvernent donc le ciel avec elle **sans pâtir**, comme l'âme du monde au chapitre 2.

    __**Puis vient l'isolement**__ (l. 10-13). {teal}« Mais les âmes s'éloignent de ce tout que forme l'Âme pour devenir une partie et être leurs propres maîtres, et, comme fatiguées d'être avec une autre, elles se retirent chacune en elle-même »{/teal}. **Être son propre maître** : vouloir s'appartenir, avoir une causalité et un domaine à soi. **« Fatiguées d'être avec une autre »** : non une lassitude du corps, qu'elles n'ont pas encore, mais la difficulté de rester fondue dans un tout, le désir d'affirmer sa différence. {red}La partie croit trouver la liberté dans l'isolement ; elle va y trouver la servitude.{/red} C'est ce retrait sur soi, et non le corps, qui **définit la naissance de l'âme individuelle**.

    __**L'engrenage**__ (l. 13-21). Le reste suit pas à pas, chaque étape entraînant la suivante :

    - en s'écartant du tout et en cessant de regarder l'intelligible, l'âme **s'isole** ;
    - coupée de la force qu'elle tirait du tout, elle **s'affaiblit** ;
    - son champ réduit à une partie, elle **s'affaire** et ne regarde plus que cette partie ;
    - elle se tient {teal}« juchée sur un élément unique »{/teal}, son corps, et fuit tout le reste ;
    - or cet objet est {red}« heurté de toutes parts par l'ensemble des autres choses »{/red} : elle le gouverne donc **« avec embarras »**, veille à ce qu'il ne subisse pas d'agressions, et **pénètre profondément en lui**.

    Pénétrer n'est pas se déplacer : c'est engager toute son attention dans les besoins d'un corps qui, sans cesse menacé, la réclame tout entière. L'âme ne peut plus contempler, parce que la précarité de son objet exige une vigilance de chaque instant.

    __**La perte des ailes**__ (l. 21-25). C'est cela que Platon appelle {red}« la perte des ailes »{/red} et {red}« la captivité dans les chaînes du corps »{/red} : l'âme {coral}« a perdu l'immunité propre au gouvernement de la partie supérieure »{/coral}, qu'elle avait auprès de l'Âme totale. Les images de Platon reçoivent ainsi un sens précis : la chute n'est pas un mépris du corps, mais **un rétrécissement de l'attention**. L'âme n'est pas punie d'avoir un corps ; elle souffre de s'être enfermée dans le souci d'une partie. {yellow}On peut penser à un conseiller qui quitterait le conseil du roi pour administrer seul un village toujours menacé.{/yellow}

    __**Un désir, non une révolte.**__ Le « désir intellectuel » (*orexis*) qui tourne les âmes vers leur origine est le mot même du désir amoureux, et Plotin dira au traité 50 que tout désir est au fond désir du bien. La puissance qui se tourne vers le bas vient de la même source : la chute naît d'un **désir bienveillant**, celui de donner, et non d'un retournement vers le mal. L'image du roi reviendra au traité 32 (V, 5), appliquée à l'Un ; ici, elle dit que le système n'a pas de coupure : toutes les âmes se rapportent à l'Âme totale, qui demeure auprès de l'Intellect.

    __**Pourquoi le repli ne pouvait se faire là-haut.**__ Dans l'Intellect, toutes les Formes communiquent à la fois : rien ne peut s'y isoler. Pour devenir « une partie », l'âme doit sortir du simultané : son retrait se fait {teal}« pendant un certain temps »{/teal}, et c'est avec lui que commence le temps (traité 45). Le traité 10 (V, 1) nommera ce mouvement {red}« l'audace »{/red} et {red}« le fait de vouloir s'appartenir à elles-mêmes »{/red}.

    __**Le même mythe, retourné contre les gnostiques.**__ La « perte des ailes » ne revient chez Plotin que dans quelques traités, dont le traité 33 : {teal}« s'ils en viennent à dire que c'est en quelque sorte "après avoir perdu ses ailes" que l'âme a produit, ce n'est pas à l'âme de l'univers que cela arrive »{/teal}. Un texte gnostique, le *Zostrien*, décrit lui aussi l'homme qui se replie sur lui-même, s'isole, devient multiple et descend vers la génération : les deux puisent à la même source platonicienne, mais chez Plotin le monde ne naît pas d'une chute.

    ! La faute n'est pas d'avoir un corps, mais de s'isoler du tout : c'est le repli sur une partie qui fait souffrir l'âme.

    ! « Fatiguées d'être avec une autre » ne décrit pas une lassitude physique : les âmes n'ont pas encore de corps.
