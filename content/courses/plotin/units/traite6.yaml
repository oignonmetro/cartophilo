- id: traite6-l2
  title: "La stratégie exégétique : des énigmes à Platon"
  notes: |-
    **Plotin aborde le problème en s'appuyant sur la tradition** : dès le premier chapitre, il cite **Héraclite**, **Empédocle**, **Pythagore** et **Platon**. Mais il garde une liberté irréductible dans l'usage qu'il en fait.

    - **La tradition est hiérarchisée.** Les présocratiques parlent « par énigmes » (1, 21) et « sur le mode de la poésie » (1, 22-23) ; Platon doit fournir « quelque chose de clair » (1, 26). Tout le premier chapitre ménage l'entrée en scène de Platon.
    - **Les citations sont arrachées à leur contexte** : Plotin intègre les expressions d'Héraclite et d'Empédocle à sa propre pensée. C'est la logique de son raisonnement qui façonne la lecture des auteurs, non l'inverse.

    **Chez Platon même, Plotin distingue deux axes :**

    | Conception | La descente est | Dialogues |
    | pessimiste | une chute, un emprisonnement | *Phédon*, *République*, *Phèdre* |
    | cosmologique | ce qui parachève la production de l'univers | *Timée* |

    **La tension est entre la responsabilité de l'âme**, qui subit les conséquences d'une faute, **et une nécessité cosmologique** qui l'en dégage. Deux voies pour la résoudre : distinguer les âmes individuelles des autres âmes, et redéfinir le rapport du **volontaire** (`ἑκούσιον`) et du **nécessaire** (`ἀναγκαῖον`).

    ! Platon n'est pas une autorité univoque : Plotin met lui-même au jour la tension entre le *Phédon* et le *Timée*.
  points:
  - id: traite6-l2-p1
    sentence: "Dans le traité 6 de Plotin, Héraclite, Empédocle et Pythagore parlent « par ___ » (1, 21) et sur le mode de la poésie."
