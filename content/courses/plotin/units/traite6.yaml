- id: traite6-l7
  title: "Volontaire et nécessaire ; les deux fautes (chap. 5, l. 1-24)"
  notes: |-
    Le chapitre 5 est le cœur du traité : il montre que les formules contradictoires du chapitre 1 ne s'excluent pas, parce que, pour l'âme, le volontaire et le nécessaire coïncident.

    **La thèse.** Il n'y a pas de contradiction entre l'ensemencement dans le devenir et la descente pour achever l'univers, entre le jugement et la caverne, {green}« entre la nécessité et le volontaire, puisque le volontaire est justement compris dans la nécessité »{/green} (l. 1-4).

    **Ce que veut dire « volontaire ».** Il ne s'agit pas d'un choix entre plusieurs possibles : l'âme n'a pas la liberté de ne pas descendre. Le volontaire (*hekousion*) désigne ici **un mouvement propre**, qu'aucune force extérieure ne contraint : l'âme descend {teal}« de son propre mouvement »{/teal} (l. 8-9). Ce qui est **involontaire**, c'est le pire auquel elle aboutit, l'influence de ce qui lui est inférieur : de là qu'on parle de « condamnation ».

    **Ce que veut dire « nécessaire ».** Ce n'est pas une contrainte extérieure, mais **« une loi éternelle de la nature »** (l. 11) : la nature même de l'âme, qu'elle tient de son principe. Dire qu'un dieu l'a envoyée n'est donc pas faux, car tout doit être rapporté au principe dont il est issu.

    **Comment les deux coïncident.** Une âme qui ne descendrait pas cesserait d'être âme, puisque c'est la descente qui la distingue de l'Intellect. En descendant, elle **suit sa nature** (volontaire) et **s'inscrit dans l'ordre de l'univers** (nécessaire). Comme le musicien de talent qui joue « parce qu'il le veut » et pourtant ne pourrait pas ne pas jouer sans cesser d'être ce qu'il est.

    **Les deux fautes** (l. 16-24).

    | Faute | En quoi elle consiste | Son châtiment |
    | la première | la cause même de la descente | ce qu'elle subit en descendant |
    | la seconde | le mal qu'elle commet ici-bas | plonger dans d'autres corps, selon le jugement porté sur sa valeur |

    La première faute est l'alourdissement de l'âme avant sa chute, la seconde la vie plus ou moins juste qu'elle mène dans le corps : Plotin retrouve les deux moments du mythe du *{sky}Phèdre{/sky}*. Un mal sans mesure appelle un châtiment plus grand, sous la surveillance de démons.

    ! « Volontaire » ne veut pas dire « choisi » : l'âme adhère à sa nature, elle ne délibère pas. Et « nécessaire » ne veut pas dire « forcé » : la nécessité, c'est sa nature même.
