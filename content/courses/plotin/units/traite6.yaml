- id: traite6-l4
  title: "Le rôle de la matière : le châtiment, non la faute"
  notes: |-
    **Pourquoi l'âme individuelle est-elle seule « contaminée » par son corps ?** Invoquer le corps défectueux ne suffit pas : la qualité d'un corps n'est que le reflet de l'âme qui l'a produit, elle ne peut en être la cause.

    **C'est la matière qu'il faut mettre en avant**, principe d'**indétermination** à cause duquel le sensible n'est pas entièrement soumis à l'intelligible : elle explique que l'âme reçoive « en retour » quelque chose du corps (chap. 7, 9-10). Les âmes individuelles, isolées et éparpillées dans le sensible, la subissent au premier chef ; l'âme de l'univers, unifiée et proche de l'intelligible, en est préservée.

    **La fonction négative de la matière est pourtant moins marquée ici que dans les traités ultérieurs** (le traité 51, *Sur l'origine des maux*). Au chapitre 6, Plotin précise que rien n'empêche « n'importe quelle chose de prendre part à la nature du bien à la mesure de ce qu'elle est capable de recevoir » (6, 15-16) : la privation du bien vient d'une **limitation interne** des choses.

    **Surtout, la matière ne suffit pas à expliquer le mouvement premier de la descente.** Dans le langage du mythe :

    | Ce que la matière explique | Ce qu'elle n'explique pas |
    | le châtiment de l'âme (`δίκη`, 5, 10) | sa faute (`ἁμαρτία`, 5, 16) |

    ! La matière rend compte des effets de la descente (la contamination), pas de sa cause.
  points:
