- id: traite6-l2
  title: "L'expérience et l'embarras : la question du traité (chap. 1, l. 1-11)"
  notes: |-
    Le chapitre 1 s'ouvre sur l'un des passages les plus célèbres de Plotin : le récit, à la première personne, d'un éveil de l'âme à elle-même. Ce récit n'est pas un ornement : il fournit le point de départ du problème, en montrant d'abord ce qu'est l'âme quand elle n'est pas dans un corps.

    **L'expérience.** {teal}« Souvent, lorsque je m'éveille à moi-même en sortant de mon corps, et qu'à l'écart des autres choses je rentre à l'intérieur de moi, je vois une beauté d'une force admirable »{/teal}. Plotin y mène « la meilleure des vies », **« devenu identique au divin »**, au-dessus de tout le reste de l'intelligible. Il ne s'agit pas ici de l'union à l'Un que rapporte Porphyre dans la *Vie de Plotin*, mais d'une participation à la vie de l'**Intellect** : l'âme dépasse son propre niveau pour vivre la vie de la réalité qui la précède.

    **Pourquoi commencer par là ?** Parce qu'on aborde ainsi la question **par le haut**. D'ordinaire, on part de l'âme telle qu'on la connaît, mêlée au corps, troublée, et l'on se demande comment elle pourrait s'en délivrer. Plotin fait l'inverse : il part de l'âme telle qu'elle est **« en elle-même »** (l. 10), et {coral}c'est alors sa présence dans un corps qui devient étrange.{/coral} Le problème n'est plus {pink}« comment sortir du corps ? »{/pink}, mais {amber}« comment a-t-elle jamais pu y entrer ? »{/amber}.

    **L'embarras.** « __Redescendu de l'Intellect vers le **raisonnement**__** »**, Plotin avoue ne pas savoir {teal}« comment cette descente a lieu »{/teal}, ni comment son âme a pu se trouver dans son corps, si elle est vraiment telle qu'elle s'est montrée. La descente (*katabainô*) devient ainsi la question du traité : **comment deux natures hétérogènes, l'une intelligible, l'autre sensible, forment-elles une « communauté » ?**

    ! L'éveil n'est pas une sortie hors du corps au sens physique : c'est un retour à soi, un changement d'attention ; le corps reste là, l'âme cesse d'être tournée vers lui.
