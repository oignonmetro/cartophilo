# Unité de texte (voir content/textes.md) : Plotin, traité 9 (VI, 9), Sur le
# Bien ou l'Un, chapitre 2, traduction GF (éd. L. Brisson et J.-F. Pradeau).
# Découpage seul : rappels et cartes à écrire.

id: "t9c2"
title: "L'unité, l'être et l'Intellect (9 [VI, 9], 2)"
subtitle: "Traité 9, Sur le Bien ou l'Un, chapitre 2"
icon: "page"
color: "coral"
depth: "normale"
lessons:
- id: "t9c2-p1"
  title: "Découvrir ce qui est, découvrir l'unité ?"
  notes: ""
  passage:
    label: "l. 1-8"
    part: "La réalité est-elle l'unité ?"
    text: |-
      Doit-on dire, alors, que, pour chacune des choses dont l'unité n'est que celle de ses parties, sa réalité n'est pas identique à l'unité, tandis que, dans le cas de ce qui est totalement et de sa réalité, la réalité, ce qui est et l'unité sont identiques, de sorte que, si l'on découvre ce qui est, alors on a aussi découvert l'unité, car la réalité elle-même est identique à l'unité ?
  points: []
- id: "t9c2-p1b"
  title: "L'Intellect serait aussi l'unité"
  notes: ""
  passage:
    label: "l. 1-8"
    part: "La réalité est-elle l'unité ?"
    text: |-
      – Dans ce cas, si la réalité est l'Intellect, l'Intellect est aussi l'unité, puisqu'il est ce qui est primordialement et qu'il est primordialement un. Il donne ainsi l'être aux autres choses dans la mesure même où il leur donne l'unité.
  points: []
- id: "t9c2-p2"
  title: "Identique à l'être, ou comme un nombre"
  notes: ""
  passage:
    label: "l. 8-14"
    part: "L'unité, l'être et le nombre"
    text: |-
      Que pourrait-on dire qu'est l'unité, en effet, si elle n'est pas ces choses ? Ou bien l'unité est identique à l'être – « homme » et « un homme », c'est en effet la même chose –, ou bien l'unité est comme un nombre qui correspond à chaque chose, et comme on dit « deux » de deux choses, de même on dit « un » d'une seule chose.
  points: []
- id: "t9c2-p2b"
  title: "Le nombre fait-il partie des choses qui sont ?"
  notes: ""
  passage:
    label: "l. 8-14"
    part: "L'unité, l'être et le nombre"
    text: |-
      Si donc le nombre fait partie des choses qui sont, il est évident que l'unité aussi en fait partie, et il faut chercher ce qu'elle est. Mais si, en revanche, le fait de compter n'est qu'une activité de l'âme qui parcourt les choses, dans ce cas, l'unité ne fera pas partie des choses réelles.
  points: []
- id: "t9c2-p3"
  title: "Perdre l'unité, n'être absolument pas"
  notes: ""
  passage:
    label: "l. 14-23"
    part: "L'unité et l'être diffèrent"
    text: |-
      – L'argument ne montrait-il pas que, si une chose perdait l'unité, elle ne serait absolument pas ?

      – Il faut donc voir si l'unité et l'être sont identiques dans chaque chose, et si ce qui est totalement est identique à l'unité.
  points: []
- id: "t9c2-p3b"
  title: "L'exemple de l'homme"
  notes: ""
  passage:
    label: "l. 14-23"
    part: "L'unité et l'être diffèrent"
    text: |-
      Mais si l'être dans chaque chose coïncide avec la multiplicité, et que, en revanche, il est impossible que l'unité soit une multiplicité, l'unité et l'être seront différents l'un de l'autre. Par exemple, l'homme est un animal et il est doué de raison, c'est-à-dire qu'il a plusieurs parties qui sont reliées dans l'unité ; mais alors l'homme et l'unité sont des choses différentes, car l'un est divisible, l'autre indivisible.
  points: []
- id: "t9c2-p3c"
  title: "L'unité par participation"
  notes: ""
  passage:
    label: "l. 14-23"
    part: "L'unité et l'être diffèrent"
    text: |-
      Et certes, ce qui est totalement, qui a en lui-même toutes les choses qui sont, sera encore plus multiple et différent de l'unité, ne possédant celle-ci que par participation.
  points: []
- id: "t9c2-p4"
  title: "Vie et intellect"
  notes: ""
  passage:
    label: "l. 24-32"
    part: "La multiplicité de ce qui est"
    text: |-
      Ce qui est possède en effet vie et intellect, car il n'est certainement pas mort ; voilà pourquoi il est multiple. Mais s'il est intellect, dans ce cas aussi il est nécessairement multiple ; et il l'est encore plus, s'il comprend les formes.
  points: []
- id: "t9c2-p4b"
  title: "La forme est un nombre"
  notes: ""
  passage:
    label: "l. 24-32"
    part: "La multiplicité de ce qui est"
    text: |-
      Car la forme n'est pas une, mais elle est plutôt un nombre, aussi bien chaque forme que la réalité des formes dans son ensemble, et c'est en ce sens qu'elle est une, comme le monde est un.
  points: []
- id: "t9c2-p4c"
  title: "L'unité est ce qui est premier"
  notes: ""
  passage:
    label: "l. 24-32"
    part: "La multiplicité de ce qui est"
    text: |-
      En résumé, l'unité est ce qui est premier, tandis que l'Intellect, les formes et ce qui est ne sont pas premiers. Car chaque forme est composée de plusieurs éléments, et elle leur est postérieure ; et ces éléments, dont chacune est composée, lui sont en effet antérieurs.
  points: []
- id: "t9c2-p5"
  title: "Penser ce qui le précède"
  notes: ""
  passage:
    label: "l. 32-43"
    part: "L'Intellect n'est pas le premier"
    text: |-
      Qu'il soit impossible que l'Intellect soit le premier, cela est évident aussi de ce qui suit : l'Intellect consiste nécessairement dans l'acte de penser, et l'Intellect supérieur est celui qui, sans porter son regard sur les choses qui lui sont extérieures, pense ce qui le précède ; en effet, se tournant vers lui-même, il se tourne vers le principe.
  points: []
- id: "t9c2-p5b"
  title: "Double ou postérieur"
  notes: ""
  passage:
    label: "l. 32-43"
    part: "L'Intellect n'est pas le premier"
    text: |-
      Et s'il est ce qui pense et ce qui est pensé, il sera double et non pas simple, et il ne sera pas non plus l'unité ; en revanche, s'il porte son regard sur autre chose, il se tournera dans tous les cas vers ce qui lui est supérieur et antérieur ; enfin, s'il se tourne et vers lui-même et vers ce qui lui est supérieur, dans ce cas aussi il sera postérieur.
  points: []
- id: "t9c2-p5c"
  title: "Quel Intellect faut-il poser ?"
  notes: ""
  passage:
    label: "l. 32-43"
    part: "L'Intellect n'est pas le premier"
    text: |-
      Il faut donc poser un Intellect de ce genre, qui, d'une part, s'approche du Bien et du Premier en portant sur lui son regard, et qui, d'autre part, soit avec soi-même, se pense soi-même et se pense soi-même comme étant toutes choses.
  points: []
- id: "t9c2-p6"
  title: "Ni l'Intellect ni l'être"
  notes: ""
  passage:
    label: "l. 44-47"
    part: "L'unité n'est pas toutes choses"
    text: |-
      Il est donc bien éloigné d'être l'unité, car il est multiforme. L'unité ne sera donc pas toutes choses, car, en ce cas, elle ne serait plus une ; ni elle ne sera l'Intellect, car, dans ce cas aussi, elle serait toutes choses, puisque l'Intellect est toutes choses ; ni elle ne sera l'être non plus, car l'être est toutes choses.
  points: []
