id: id1
title: La vie de Plotin et l'édition des Ennéades
subtitle: Porphyre, la Vita Plotini, l'école de Rome
icon: clock
color: sky
group: Vie et œuvre
lessons:
- id: id1-l1
  title: L'édition des Ennéades par Porphyre
  notes: |-
    **Porphyre**, élève et éditeur de Plotin, a donné aux 54 traités de son maître leur forme la plus connue : les **Ennéades**, du grec *ennea* (« neuf »), six groupes de neuf traités chacun.

    - Le classement suit un ordre thématique, des sujets jugés les plus « accessibles » vers les plus difficiles :
      - Ennéade I : morale et anthropologie.
      - Ennéades II et III : le monde sensible et ses principes.
      - Ennéade IV : l'âme, première des trois hypostases supra-sensibles.
      - Ennéades V et VI : l'Intellect, seconde hypostase.
      - Ennéade VI (fin) : l'Un, hypostase suprême, d'où procède toute la réalité.

    ! Ce découpage thématique a été jugé par la suite **artificiel et arbitraire** par une partie de la critique : Porphyre lui-même propose, à côté de lui, un second principe de classement, l'ordre chronologique de composition, que certains éditeurs modernes préfèrent suivre.
  points:
  - id: id1-l1-1
    sentence: L'ensemble des traités de Plotin porte, en raison de la disposition symétrique en six groupes
      de neuf que leur a donnée Porphyre lors de son édition, le nom des ___.
    answer: Ennéades
  - id: id1-l1-2
    sentence: ___, élève et éditeur de Plotin, a organisé ses traités en six groupes de neuf (les Ennéades)
      selon un critère thématique, jugé par la suite artificiel et arbitraire par une partie de la critique.
    answer: Porphyre
  - id: id1-l1-3
    sentence: Porphyre, élève et éditeur de Plotin, a organisé ses traités en ___ (les Ennéades) selon
      un critère thématique, jugé par la suite artificiel et arbitraire par une partie de la critique.
    answer: six groupes de neuf
  - id: id1-l1-4
    sentence: Dans la structure des Ennéades voulue par Porphyre, le groupe de traités consacré aux questions
      morales et anthropologiques, jugées plus « accessibles », par lequel s'ouvre la lecture de l'œuvre
      de Plotin, est ___.
    answer: l'Ennéade I
  - id: id1-l1-5
    sentence: Les groupes de traités des Ennéades consacrés au monde sensible et aux principes de base
      qui régissent son fonctionnement sont ___.
    answer: les Ennéades II et III
  - id: id1-l1-6
    sentence: L'Ennéade consacrée à la première des trois « hypostases » supra-sensibles du système de
      Plotin, l'âme, est ___.
    answer: l'Ennéade IV
  - id: id1-l1-7
    sentence: Les Ennéades consacrées à l'Intellect, deuxième hypostase supra-sensible du système de Plotin,
      sont ___.
    answer: les Ennéades V et VI
  - id: id1-l1-8
    sentence: L'hypostase suprême traitée en dernier lieu dans l'organisation des Ennéades (également
      couverte par l'Ennéade VI), à partir de laquelle toute la réalité sensible est produite et articulée,
      est ___.
    answer: l'Un
  - id: id1-l1-9
    sentence: Le second principe de classement des traités de Plotin établi par Porphyre, alternatif à
      l'arrangement thématique des Ennéades et repris par certains éditeurs modernes qui renoncent à toute
      classification par thème, est ___.
    answer: l'ordre chronologique de composition
- id: id1-l2
  title: La vie de Plotin selon la Vita Plotini
  notes: |-
    La **Vita Plotini** (VP), texte introductif rédigé par Porphyre pour préfacer son édition des Ennéades, est la principale source biographique sur Plotin.

    - Né en 204, probablement en Égypte.
    - Suit les leçons du maître **Ammonius Saccas** à Alexandrie pendant onze ans, à partir de 28 ans.
    - En 243, rejoint l'expédition perse de l'empereur **Gordien III**, dans l'espoir de devenir « familier avec la sagesse des Perses et des Indiens » ; l'expédition échoue, Gordien III est assassiné par ses propres troupes.
    - S'installe définitivement à Rome en 244, où il enseigne pendant plus de 25 ans, jusqu'à sa mort en 270.
    - Ne commence à rédiger ses traités qu'à 50 ans, dix ans après son arrivée à Rome.

    Porphyre lui-même ne devient l'élève de Plotin, à Rome, que dans les dernières années de sa vie, et n'y reste à ses côtés qu'environ cinq ans.
  points:
  - id: id1-l2-1
    sentence: Le texte introductif rédigé par Porphyre pour préfacer son édition des Ennéades, qui constitue
      la principale source biographique sur Plotin, porte le titre de ___.
    answer: Vita Plotini
    explanation: Traditionnellement abrégée VP, abréviation reprise dans les renvois précis à l'œuvre,
      comme VP 14.4-6.
  - id: id1-l2-2
    sentence: Selon la Vita Plotini, Porphyre fut l'élève de Plotin et vécut à ses côtés pendant ___.
    answer: environ cinq ans
  - id: id1-l2-3
    sentence: D'après la Vita Plotini, Plotin était originaire d'Égypte, ce qui permet d'inférer qu'il
      est né en ___ de notre ère.
    answer: '204'
  - id: id1-l2-4
    sentence: Le maître à la fois influent et insaisissable dont Plotin suivit les leçons à Alexandrie
      pendant onze ans, à partir de l'âge de 28 ans, se nommait ___.
    answer: Ammonius Saccas
  - id: id1-l2-5
    sentence: Plotin demeura auprès d'Ammonius Saccas à Alexandrie pendant ___ ans, avant de quitter la
      ville pour suivre l'expédition de Gordien III.
    answer: onze
  - id: id1-l2-6
    sentence: Plotin commença à rédiger ses traités à l'âge de ___ ans, dans les 16 dernières années environ
      de sa vie.
    answer: '50'
  - id: id1-l2-7
    sentence: Selon Porphyre, Plotin rejoignit en 243 l'expédition perse de l'empereur Gordien III parce
      qu'il aspirait à devenir « ___ ».
    answer: familier avec la sagesse des Perses et des Indiens
  - id: id1-l2-8
    sentence: L'empereur romain dont l'expédition avortée contre la Perse, en 243, conduisit indirectement
      Plotin à s'installer à Rome, se nommait ___.
    answer: Gordien III
  - id: id1-l2-9
    sentence: L'expédition perse à laquelle participait Plotin prit fin lorsque Gordien III fut ___.
    answer: assassiné par ses propres troupes
  - id: id1-l2-10
    sentence: Plotin s'installe définitivement à Rome, après l'échec de l'expédition de Gordien III, en
      ___.
    answer: '244'
  - id: id1-l2-11
    sentence: Plotin enseigna sans interruption à Rome, jusqu'à sa mort, pendant ___.
    answer: plus de 25 ans
  - id: id1-l2-12
    sentence: Plotin meurt à Rome en ___.
    answer: '270'
  - id: id1-l2-13
    sentence: Plotin commença à rédiger ses traités ___ après son arrivée à Rome.
    answer: dix ans
    explanation: Soit en 254.
- id: id1-l3
  title: Le vocabulaire de l'école de Plotin
  notes: |-
    L'école que Plotin tient à Rome a son propre vocabulaire, transmis par Porphyre.

    - **`sunousiai`** (« réunions ») : les séances de l'école, où l'on lisait et discutait des textes avant l'exposé du maître.
    - **`aporiai`** (« difficultés ») : les problèmes ou impasses soulevés à propos des passages lus, que Plotin discutait avec les participants avant de proposer sa propre analyse.
    - **`akroatai`** (« auditeurs ») : les élèves ou compagnons de Plotin, accoutumés à sa manière de s'exprimer.
    - **`hupomnēmata`** (« aide-mémoires ») : la fonction que Plotin assignait à ses traités eux-mêmes, destinés à ceux qui avaient participé aux réunions.

    ! Porphyre, à l'inverse de Plotin, citait méticuleusement ses sources dans ses propres écrits, une habitude qui lui valut le surnom quelque peu péjoratif de **`polumathēs`** (« très savant »).
  points:
  - id: id1-l3-1
    sentence: Porphyre désigne par le terme de "___" les séances de l'école de Plotin à Rome, au cours
      desquelles étaient lus et discutés des textes avant l'exposé du maître.
    answer: réunions
  - id: id1-l3-2
    sentence: Le terme original, translittéré, désignant les "réunions" de l'école de Plotin à Rome, est
      ___.
    answer: sunousiai
  - id: id1-l3-3
    sentence: Plotin assignait à ses traités la fonction d'___, destinés à ceux qui avaient participé
      aux réunions de son école.
    answer: aide-mémoires
  - id: id1-l3-4
    sentence: Le terme original, translittéré, désignant la fonction d'« aide-mémoire » assignée par Plotin
      à ses traités, est ___.
    answer: hupomnēmata
  - id: id1-l3-5
    sentence: Lors des réunions de l'école de Plotin, les problèmes ou impasses soulevés à propos des
      passages lus en début de séance, et que le maître discutait avec les participants avant de proposer
      sa propre analyse, se nomment des ___.
    answer: difficultés
  - id: id1-l3-6
    sentence: Le terme original, translittéré, désignant les « difficultés » discutées lors des réunions
      de l'école de Plotin, est ___.
    answer: aporiai
  - id: id1-l3-7
    sentence: Les élèves ou compagnons de Plotin, accoutumés à sa manière habituelle de s'exprimer et
      familiers des œuvres discutées lors des réunions de son école, sont appelés des ___.
    answer: auditeurs
  - id: id1-l3-8
    sentence: Le terme original, translittéré, désignant les élèves de Plotin, ses « auditeurs », est
      ___.
    answer: akroatai
  - id: id1-l3-9
    sentence: Porphyre, en raison de son habitude, à l'inverse de celle de Plotin, de citer méticuleusement
      dans ses écrits les sources dont il s'inspirait, reçut le surnom quelque peu péjoratif du "___".
    answer: très savant
  - id: id1-l3-10
    sentence: Le terme original, translittéré, désignant le surnom quelque peu péjoratif donné à Porphyre
      pour son habitude de citer méticuleusement ses sources, est ___.
    answer: polumathēs
- id: id1-l4
  title: Les sources de Plotin et son style de rédaction
  notes: |-
    Plotin ne mentionne jamais par leur nom les sources chronologiquement proches de lui, ce qui complique l'identification de la bibliographie secondaire qu'il utilisait, à l'inverse, précisément, de Porphyre.

    Selon le témoignage de Porphyre (VP 14.4-6), ses écrits sont pourtant remplis de doctrines stoïciennes et péripatéticiennes dissimulées ; la *Métaphysique* d'Aristote, en particulier, s'y trouve condensée.

    Porphyre détaille aussi, en VP 8.1-19 (juste avant le récit de la répartition chronologique des traités en Ennéades), la façon dont Plotin composait : un procédé qui explique le caractère associatif, redondant et labyrinthique de son style d'écriture.

    La vie de Plotin appartient à **la crise du troisième siècle**, période trouble qui ébranle les fondements mêmes de l'empire romain.
  points:
  - id: id1-l4-1
    sentence: Selon le témoignage de Porphyre (VP 14.4-6), les écrits de Plotin sont remplis de doctrines
      stoïciennes et péripatéticiennes dissimulées ; et en particulier, ___ y est condensée.
    answer: la Métaphysique d'Aristote
  - id: id1-l4-2
    sentence: À l'inverse de Porphyre, Plotin ne mentionne jamais par leur nom les sources ___ de lui,
      ce qui complique l'identification de la bibliographie secondaire qu'il utilisait.
    answer: chronologiquement proches
  - id: id1-l4-3
    sentence: Le passage dans lequel Porphyre détaille la façon dont Plotin composait ses traités, ce
      qui permet d'expliquer le caractère associatif, redondant et labyrinthique de son style d'écriture,
      se situe en ___, dans la Vita Plotini, juste avant le récit de la répartition chronologique des
      traités en Ennéades.
    answer: 8.1-19
  - id: id1-l4-4
    sentence: La période trouble de l'histoire romaine qui ébranle les fondements mêmes de l'empire et
      à laquelle appartient la vie de Plotin, souvent restituée par le témoignage de Porphyre dans la
      Vita Plotini, se nomme ___.
    answer: la crise du troisième siècle
