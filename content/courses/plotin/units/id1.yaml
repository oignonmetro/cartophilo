id: id1
title: La vie de Plotin et l'édition des Ennéades
subtitle: Porphyre, la Vita Plotini, l'école de Rome
icon: clock
color: sky
lessons:
- id: id1-l1
  title: L'édition des Ennéades par Porphyre
  notes: |-
    {sky}**Porphyre**{/sky}, élève et éditeur de Plotin, a donné aux 54 traités de son maître leur forme la plus connue : les {violet}**Ennéades**{/violet}, du grec {blue}*ennea*{/blue} (« neuf »), {green}six groupes de neuf traités chacun{/green}.

    Le classement suit {amber}un ordre thématique{/amber}, des sujets jugés les plus « accessibles » vers les plus difficiles :
    - {sky}Ennéade I :{/sky} morale et anthropologie.
    - {sky}Ennéades II et III{/sky} : le monde sensible et ses principes.
    - {sky}Ennéade IV{/sky} : l'âme, première des trois {violet}hypostases supra-sensibles{/violet}.
    - {sky}Ennéades V et VI{/sky} : l'Intellect, seconde hypostase.
    - {sky}Ennéade VI (fin){/sky} : l'Un, {violet}hypostase suprême{/violet}, {coral}d'où procède toute la réalité{/coral}.

    ! Ce découpage thématique a été jugé par la suite {red}**artificiel et arbitraire**{/red} par une partie de la critique : Porphyre lui-même propose, à côté de lui, un second principe de classement, {amber}l'ordre chronologique de composition{/amber}, que certains éditeurs modernes préfèrent suivre.
  points:
  - id: id1-l1-1
    sentence: "**L'ensemble des traités de Plotin** porte, __en raison de la disposition symétrique en six groupes de neuf__ que leur a donnée Porphyre lors de son édition, le nom des ___."
    answer: Ennéades
    alt: []
  - id: id1-l1-2
    sentence: ___, élève et éditeur de Plotin, __a organisé ses traités en six groupes de neuf (les Ennéades) selon un critère thématique__, jugé par la suite **artificiel et arbitraire** par une partie de la critique.
    answer: Porphyre
    alt: []
  - id: id1-l1-3
    sentence: Porphyre, **élève et éditeur de Plotin**, __a organisé ses traités en__ ___ (les Ennéades) selon un critère thématique, jugé par la suite artificiel et arbitraire par une partie de la critique.
    answer: six groupes de neuf
    alt: []
  - id: id1-l1-4
    sentence: "Dans la structure des Ennéades voulue par Porphyre, __le groupe de traités consacré aux questions morales et anthropologiques__, **jugées plus « accessibles »**, par lequel s'ouvre la lecture de l'œuvre de Plotin, est ___."
    answer: l'Ennéade I
    alt: []
  - id: id1-l1-5
    sentence: __Les groupes de traités des Ennéades consacrés au monde sensible__ et aux **principes de base** qui régissent son fonctionnement sont ___.
    answer: les Ennéades II et III
    alt: []
  - id: id1-l1-6
    sentence: "__L'Ennéade consacrée à la première des trois « hypostases » supra-sensibles__ du système de Plotin, **l'âme**, est ___."
    answer: l'Ennéade IV
    alt: []
  - id: id1-l1-7
    sentence: __Les Ennéades consacrées à l'Intellect__, **deuxième hypostase** supra-sensible du système de Plotin, sont ___.
    answer: les Ennéades V et VI
    alt: []
  - id: id1-l1-8
    sentence: __L'hypostase suprême traitée en dernier lieu dans l'organisation des Ennéades__ (également couverte par l'Ennéade VI), à partir de laquelle **toute la réalité sensible est produite** et articulée, est ___.
    answer: l'Un
    alt: []
  - id: id1-l1-9
    sentence: __Le second principe de classement des traités de Plotin établi par Porphyre__, **alternatif à l'arrangement thématique** des Ennéades et repris par certains éditeurs modernes qui renoncent à toute classification par thème, est ___.
    answer: l'ordre chronologique de composition
    alt: []
- id: id1-l2
  title: La vie de Plotin selon la Vita Plotini
  notes: |-
    La {sky}**Vita Plotini**{/sky} (VP), texte introductif rédigé par {sky}Porphyre{/sky} pour préfacer son édition des Ennéades, est {green}la principale source biographique sur Plotin{/green}.

    - Né en 204, probablement en Égypte.
    - Suit les leçons du maître {sky}**Ammonius Saccas**{/sky} à Alexandrie pendant onze ans, à partir de 28 ans.
    - En 243, rejoint l'expédition perse de l'empereur {sky}**Gordien III**{/sky}, dans l'espoir de devenir {teal}« {/teal}{teal}familier{/teal} avec {teal}la sagesse{/teal} des Perses et {teal}des Indiens »{/teal} ; {red}l'expédition échoue, Gordien III est assassiné par ses propres troupes{/red}.
    - S'installe définitivement à Rome en 244, où il enseigne pendant plus de 25 ans, jusqu'à sa mort en 270.
    - {amber}Ne commence à rédiger ses traités qu'à 50 ans{/amber}, dix ans après son arrivée à Rome.

    {sky}Porphyre{/sky} lui-même ne devient l'élève de Plotin, à Rome, que dans les dernières années de sa vie, et n'y reste à ses côtés qu'environ cinq ans.
  points:
  - id: id1-l2-1
    sentence: __Le texte introductif rédigé par Porphyre pour préfacer son édition des Ennéades__, qui constitue la **principale source biographique** sur Plotin, porte le titre de ___.
    answer: Vita Plotini
    explanation: Traditionnellement abrégée VP, abréviation reprise dans les renvois précis à l'œuvre, comme VP 14.4-6.
  - id: id1-l2-2
    sentence: Selon la Vita Plotini, __Porphyre fut **l'élève de Plotin** et vécut à ses côtés pendant__ ___.
    answer: environ cinq ans
  - id: id1-l2-3
    sentence: D'après la Vita Plotini, Plotin était **originaire d'Égypte**, __ce qui permet d'inférer qu'il est né en__ ___ de notre ère.
    answer: '204'
  - id: id1-l2-4
    sentence: __Le maître à la fois influent et insaisissable dont Plotin suivit les leçons à Alexandrie__ **pendant onze ans**, à partir de l'âge de 28 ans, se nommait ___.
    answer: Ammonius Saccas
  - id: id1-l2-5
    sentence: __Plotin demeura auprès d'Ammonius Saccas à Alexandrie pendant__ ___ ans, avant de quitter la ville pour suivre l'expédition de **Gordien III**.
    answer: onze
  - id: id1-l2-6
    sentence: __Plotin commença à rédiger ses traités à l'âge de__ ___ ans, dans les **16 dernières années** environ de sa vie.
    answer: '50'
  - id: id1-l2-7
    sentence: "Selon Porphyre, Plotin rejoignit en 243 **l'expédition perse** de l'empereur **Gordien III** __parce qu'il aspirait à devenir__ « ___ »."
    answer: familier avec la sagesse des Perses et des Indiens
  - id: id1-l2-8
    sentence: __L'empereur romain dont l'expédition avortée contre la Perse__, en 243, conduisit indirectement Plotin à **s'installer à Rome**, se nommait ___.
    answer: Gordien III
  - id: id1-l2-9
    sentence: __L'expédition perse à laquelle participait Plotin prit fin lorsque **Gordien III** fut__ ___.
    answer: assassiné par ses propres troupes
  - id: id1-l2-10
    sentence: __Plotin s'installe définitivement à Rome__, après **l'échec de l'expédition** de Gordien III, en ___.
    answer: '244'
  - id: id1-l2-11
    sentence: __Plotin enseigna sans interruption à Rome__, **jusqu'à sa mort**, pendant ___.
    answer: plus de 25 ans
  - id: id1-l2-12
    sentence: __Plotin **meurt** à Rome en__ ___.
    answer: '270'
  - id: id1-l2-13
    sentence: __Plotin commença à rédiger ses traités__ ___ **après son arrivée à Rome**.
    answer: dix ans
    explanation: Soit en 254.
- id: id1-l3
  title: Le vocabulaire de l'école de Plotin
  notes: |-
    L'école que Plotin tient à Rome a son propre vocabulaire, transmis par {sky}Porphyre{/sky}.

    - {blue}***sunousiai***{/blue} (« réunions ») : {amber}les séances de l'école{/amber}, où l'on lisait et discutait des textes avant l'exposé du maître.
    - {blue}***aporiai***{/blue} (« difficultés ») : {amber}les problèmes ou impasses soulevés à propos des passages lus{/amber}, que Plotin discutait avec les participants avant de proposer sa propre analyse.
    - {blue}***akroatai***{/blue} (« auditeurs ») : {amber}les élèves ou compagnons de Plotin{/amber}, accoutumés à sa manière de s'exprimer.
    - {blue}***hupomnêmata***{/blue} (« aide-mémoires ») : {amber}la fonction que Plotin assignait à ses traités eux-mêmes{/amber}, {coral}destinés à ceux qui avaient participé aux réunions{/coral}.

    ! {sky}Porphyre{/sky}, à l'inverse de Plotin, citait méticuleusement ses sources dans ses propres écrits, une habitude qui lui valut le surnom {red}quelque peu péjoratif{/red} de {blue}***polumathês***{/blue} (« très savant »).
  points:
  - id: id1-l3-1
    sentence: Porphyre désigne par le terme de "___" __les séances de l'école de Plotin à Rome__, au cours desquelles étaient **lus et discutés des textes** avant l'exposé du maître.
    answer: réunions
  - id: id1-l3-2
    sentence: Le terme original, translittéré, __désignant les **"réunions"** de l'école de Plotin à Rome__, est ___.
    answer: sunousiai
  - id: id1-l3-3
    sentence: __Plotin assignait à ses traités la fonction__ d'___, destinés à **ceux qui avaient participé aux réunions** de son école.
    answer: aide-mémoires
  - id: id1-l3-4
    sentence: "Le terme original, translittéré, __désignant la fonction d'**« aide-mémoire »** assignée par Plotin à ses traités__, est ___."
    answer: hupomnêmata
  - id: id1-l3-5
    sentence: Lors des réunions de l'école de Plotin, __les problèmes ou impasses soulevés à propos des passages lus en début de séance__, et que le maître discutait avec les participants **avant de proposer sa propre analyse**, se nomment des ___.
    answer: difficultés
  - id: id1-l3-6
    sentence: "Le terme original, translittéré, __désignant les **« difficultés »** discutées lors des réunions de l'école de Plotin__, est ___."
    answer: aporiai
  - id: id1-l3-7
    sentence: __Les élèves ou compagnons de Plotin__, accoutumés à sa manière habituelle de s'exprimer et **familiers des œuvres discutées** lors des réunions de son école, sont appelés des ___.
    answer: auditeurs
  - id: id1-l3-8
    sentence: "Le terme original, translittéré, __désignant les élèves de Plotin__, ses **« auditeurs »**, est ___."
    answer: akroatai
  - id: id1-l3-9
    sentence: Porphyre, en raison de son habitude, à l'inverse de celle de Plotin, de **citer méticuleusement** dans ses écrits les sources dont il s'inspirait, __reçut le surnom quelque peu péjoratif du__ "___".
    answer: très savant
  - id: id1-l3-10
    sentence: Le terme original, translittéré, __désignant le **surnom** quelque peu péjoratif donné à Porphyre__ pour son habitude de citer méticuleusement ses sources, est ___.
    answer: polumathês
- id: id1-l4
  title: Les sources de Plotin et son style de rédaction
  notes: |-
    {red}Plotin ne mentionne jamais par leur nom les sources chronologiquement proches de lui{/red}, ce qui complique l'identification de la bibliographie secondaire qu'il utilisait, à l'inverse, précisément, de {sky}Porphyre{/sky}.

    Selon le témoignage de Porphyre {sky}(VP 14.4-6){/sky}, {green}ses écrits sont pourtant remplis de doctrines stoïciennes et péripatéticiennes dissimulées{/green} ; la {sky}*Métaphysique*{/sky} {sky}d'Aristote{/sky}, en particulier, s'y trouve condensée.

    Porphyre détaille aussi, en {sky}VP 8.1-19{/sky} (juste avant le récit de la répartition chronologique des traités en Ennéades), la façon dont Plotin composait : {coral}un procédé qui explique le caractère associatif, redondant et labyrinthique de son style d'écriture{/coral}.

    La vie de Plotin appartient à {violet}**la crise du troisième siècle**{/violet}, période trouble qui ébranle les fondements mêmes de l'empire romain.
  points:
  - id: id1-l4-1
    sentence: Selon **le témoignage de Porphyre** (VP 14.4-6), __les écrits de Plotin sont remplis de doctrines stoïciennes et péripatéticiennes dissimulées__ ; et en particulier, ___ y est condensée.
    answer: la Métaphysique d'Aristote
  - id: id1-l4-2
    sentence: "**À l'inverse de Porphyre**, __Plotin ne mentionne jamais par leur nom les sources__ ___ de lui, ce qui complique l'identification de la bibliographie secondaire qu'il utilisait."
    answer: chronologiquement proches
  - id: id1-l4-3
    sentence: __Le passage dans lequel Porphyre détaille la façon dont Plotin composait ses traités__, ce qui permet d'expliquer le caractère **associatif, redondant et labyrinthique** de son style d'écriture, se situe en ___, dans la Vita Plotini, juste avant le récit de la répartition chronologique des traités en Ennéades.
    answer: 8.1-19
  - id: id1-l4-4
    sentence: __La période trouble de l'histoire romaine qui ébranle les fondements mêmes de l'empire__ et à laquelle appartient **la vie de Plotin**, souvent restituée par le témoignage de Porphyre dans la Vita Plotini, se nomme ___.
    answer: la crise du troisième siècle
