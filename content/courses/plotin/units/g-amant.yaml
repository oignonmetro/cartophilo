- id: g-amant-l6
  title: L'amant revenu parmi les autres
  notes: |-
    **L'amant purifié ne se retire pas dans une jouissance solitaire : ce qu'il a vu le rend meilleur pour les autres.** On pourrait croire que la remontée, qui fait mépriser les beautés d'ici, détache le sage de tout lien. Plotin dit l'inverse, et pour une raison précise : {coral}ce que le sage aime ne lui manque plus, donc son lien aux autres ne naît plus du besoin.{/coral}

    - **Le sage est ami de lui-même et des autres** ([[traite46|traité 46]], chap. 15). Vivant selon l'Intellect, il n'attend pas de ses amis qu'ils comblent une indigence : son amitié vient de ce qu'il possède, non de ce qui lui manque
    - **L'âme qui s'est unie à l'Un l'annonce aux autres** ([[traite9|traité 9]], chap. 7). Comme {yellow}**Minos**, « familier de Zeus »{/yellow}, qui rapportait de ses entretiens avec le dieu les lois qu'il donnait aux hommes, l'âme qui a été unie au principe redescend pour en indiquer la voie

    ! L'amant n'aime pas les autres à la place du Bien : c'est parce qu'il aime le Bien qu'il peut aimer les autres sans en avoir besoin.
  points:
