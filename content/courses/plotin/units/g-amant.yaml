- id: g-amant-l5
  title: L'union, et l'Intellect amoureux
  notes: |-
    **Au terme de la remontée, l'amant ne contemple plus un objet : il s'unit à lui.** Et Plotin va jusqu'à dire que l'Intellect lui-même, au sommet, devient amant.

    __**Se dépouiller de toute forme.**__ L'âme se défait de toute forme pour recevoir le Bien, seule ; il apparaît « soudain », et ils ne sont plus deux ([[traite38|traité 38]], chap. 34). **Pourquoi se dépouiller ? Parce que le Bien est sans forme** : une âme encore occupée d'une forme ne serait pas libre pour lui.

    __**Le maître de maison.**__ {yellow}Celui qui entre dans une maison richement ornée admire d'abord les ornements ; dès qu'il voit le maître de maison, il les oublie{/yellow}, et confond sa vision avec ce qu'il voit (chap. 35, l. 7-16).

    __**L'Intellect a deux puissances.**__ « La première puissance est la contemplation de l'Intellect qui pense, tandis que la seconde c'est l'Intellect qui aime, quand l'Intellect devient insensé, et qu'il est "ivre de nectar" ; c'est alors que l'Intellect devient amant » (chap. 35, l. 23-26). Et « pour lui, être ivre d'une telle ivresse c'est mieux que de rester décent en étant sobre » (l. 26-27). **Pourquoi l'ivresse vaut-elle mieux ?** {pink}La pensée garde la dualité de ce qui pense et de ce qui est pensé{/pink}, et ne peut donc atteindre le Bien, qui est un ; {green}l'amour, lui, s'unit{/green}.

    __**La vierge qui aime son père.**__ L'âme aime le Bien d'un amour inné : « Toute âme est Aphrodite » ([[traite9|traité 9]], chap. 9, l. 31). Égarée ici-bas en de fausses amours, comme une jeune fille trompée par des promesses de mariage, elle doit revenir à l'amour pur, celui d'une {yellow}vierge pour son père{/yellow}.

    ! Le sommet de l'amant n'est pas la pensée la plus haute : l'Intellect amoureux dépasse l'Intellect qui pense.
