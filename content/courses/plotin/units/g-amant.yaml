- id: g-amant-l4
  title: La lumière sur la forme
  notes: |-
    **Ce qui éveille l'amant n'est pas la forme seule, mais la lumière que le Bien répand sur elle.** Pourquoi un visage vivant, même laid, est-il plus beau qu'une belle statue ? Si la beauté était la proportion, la statue l'emporterait. Plotin en conclut que la beauté est plutôt **ce qui resplendit sur la proportion** que la proportion elle-même (VI, 7 [38], 22).

    **L'âme ne s'éprend que de la couleur du Bien.** L'Intellect et la vie ont la forme du Bien ; mais tant que le Bien ne leur donne pas sa **couleur**, l'âme « reste étendue, indifférente ». Quand elle en reçoit l'effluve, elle est prise d'une **fureur bachique** et devient amour (22, 8-9).

    **Ce que l'amant aime au fond est sans forme.** Le principe n'est ni une forme ni l'ensemble des formes : il est le **« sans forme »**, et c'est pourquoi il suscite un **amour illimité**, car une forme a une mesure, et un amour qui s'y arrêterait serait mesuré (VI, 7, 32-33). L'amant n'aime vraiment que lorsqu'il forme en lui une impression non sensible.

    **L'amant reste à la porte.** Plotin reprend l'Éros du *Banquet* « qui veille à la porte » : l'amoureux d'ici-bas possède la beauté non en la recevant, mais en restant auprès d'elle (VI, 5 [23], 10).

    ! Le Beau n'est pas le terme : la forme belle n'est qu'une trace du sans-forme, et c'est le Bien, par-delà le Beau, que l'amant cherche sans le savoir.
