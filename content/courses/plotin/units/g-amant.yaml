id: g-amant
title: Amant (`erôtikos`)
subtitle: L'âme que la beauté frappe, et qu'il faut conduire des corps jusqu'au Bien
icon: book
color: coral
lessons:
- id: g-amant-l1
  title: Un des trois naturels qui remontent
  notes: |-
    **L'amant n'est pas d'abord un homme amoureux : c'est un naturel, une disposition de l'âme à être frappée par la beauté.** Plotin reprend le *Phèdre* (248d) : l'âme qui a vu le plus de réalités naît « dans la semence d'un homme qui deviendra un philosophe, un musicien ou un amant » (I, 3 [20], 1, 6-8). Chez Platon, c'est un seul et même homme ; Plotin en fait trois degrés d'une même remontée, du plus sensible au plus intellectuel.

    | Figure | Ce qui le frappe | Ce qu'il doit apprendre |
    | le musicien | les sons et les rythmes | aller à l'harmonie intelligible |
    | l'amant | les beaux corps | aller de tous les corps aux incorporels |
    | le philosophe | il a « des ailes » par nature | les mathématiques, puis la dialectique |

    **Pourquoi l'amant est frappé.** Il se **souvient** de la Beauté intelligible, mais confusément : il la cherche dans ce que voient ses yeux. Tous voient les beaux corps, mais tous n'en reçoivent pas également l'**aiguillon** ; ceux qui le reçoivent le plus, ce sont les amants (I, 6 [1], 4).

    **Pourquoi il faut le conduire.** Le philosophe monte par nature ; le musicien et l'amant doivent être **conduits** vers le haut (I, 3, 1, 9-10), car leur élan s'arrête à l'objet qui l'a éveillé. Le musicien peut d'ailleurs devenir amant (2, 1).

    ! Ne pas confondre l'amant et l'amour : Éros est « l'œil de ce qui désire », ce par quoi l'amant voit ; l'amant est celui qui voit (voir la fiche « Amour »). Et le désir du Bien est en toute âme, même celle qui n'est pas un naturel d'amant.
