    answer: amant
    alt: []
  - id: g-amant-l1-q1
    sentence: "Celui qui peut s'élever entre, à sa première naissance, « dans la semence d'un homme qui deviendra un ___, un musicien ou un amant » (traité 20, chap. 1, l. 6-9)."
    answer: philosophe
    alt: []
  - id: g-amant-l1-2
    sentence: "Chez Platon, philosophe, musicien et amant sont un seul homme ; Plotin en fait trois ___ d'une même remontée."
    answer: degrés
    alt: ["degres", "étapes"]
  - id: g-amant-l1-3
    sentence: "Le traité où Plotin distingue le musicien, l'amant et le philosophe est le traité ___ (I, 3), *Sur la dialectique*."
    answer: "20"
    alt: ["vingt"]
  - id: g-amant-l1-4
    sentence: "L'amant est frappé par les beaux corps parce qu'il se ___ confusément de la Beauté intelligible."
    answer: souvient
    alt: []
  - id: g-amant-l1-q2
    sentence: "Les corps, « tous peuvent [les] voir, mais sans que tous en reçoivent également l'___ ; ceux qui sont le plus disposés ainsi, ce sont ceux que l'on appelle des amants » (traité 1, chap. 4, l. 20-22)."
    answer: aiguillon
    alt: []
  - id: g-amant-l1-q3
    sentence: "Tous voient les mêmes beaux corps : ce qui fait l'amant, ce n'est pas de les voir, c'est d'en recevoir le plus l'aiguillon, de sorte que ceux qui sont le plus disposés ainsi sont ceux que l'on appelle des ___ (traité 1, chap. 4, l. 20-22)."
    answer: amants
    alt: []
  - id: g-amant-l1-q4
    sentence: "« Pour le philosophe bien sûr, c'est par nature, alors que le musicien et l'amant doivent être ___ vers le haut » (traité 20, chap. 1, l. 9-10)."
