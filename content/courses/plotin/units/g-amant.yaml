- id: g-amant-l5
  title: L'union, et l'Intellect amoureux
  notes: |-
    **Au terme de la remontée, l'amant ne contemple plus un objet : il s'unit à lui.** L'âme se **dépouille de toute forme** pour recevoir le Bien, seule, lui seul ; il apparaît « soudain », et ils ne sont plus deux (VI, 7 [38], 34). Pourquoi se dépouiller ? Parce que le Bien est sans forme : une âme encore occupée d'une forme ne serait pas libre pour lui.

    **Le maître de maison.** Celui qui entre dans une maison richement ornée admire d'abord les ornements ; dès qu'il voit le maître de maison, il les oublie, et confond sa vision avec ce qu'il voit (VI, 7, 35).

    **L'Intellect lui-même devient amant.** L'Intellect a deux puissances (VI, 7, 35, 20-26) : par l'une, **l'Intellect qui pense**, il contemple ce qui est en lui et « reste décent en étant sobre » ; par l'autre, **l'Intellect amant** (`noun erônta`), il aime ce qui le dépasse et devient insensé, **« ivre de nectar »**. Cette ivresse vaut mieux que la sobriété. Pourquoi ? La pensée garde la dualité de ce qui pense et de ce qui est pensé, et ne peut donc atteindre le Bien, qui est un ; l'amour, lui, s'unit.

    **La vierge qui aime son père.** L'âme aime le Bien d'un amour inné : « toute âme est Aphrodite ». Égarée ici-bas en de fausses amours, comme une jeune fille trompée par des promesses de mariage, elle doit revenir à l'amour pur, celui d'une vierge pour son père (VI, 9 [9], 9).

    ! Le sommet de l'amant n'est pas la pensée la plus haute : l'Intellect amoureux dépasse l'Intellect qui pense.
