- id: g-amant-l2
  title: Des corps aux vertus
  notes: |-
    **L'amant risque de s'arrêter au corps qui l'a frappé ; l'éduquer, c'est lui apprendre que ce qu'il aime n'est pas ce corps.** Plotin suit l'échelle du {sky}*Banquet*{/sky} ([[traite20|traité 20]], chap. 2) : ne pas aimer un seul corps, mais tous ; puis les belles occupations et les belles lois ; puis les techniques, les sciences, les vertus ; enfin l'Intellect et l'Être.

    __**Pourquoi l'échelle monte.**__ À chaque étape, la beauté aimée se révèle autre que son support. {pink}Si plusieurs corps sont beaux{/pink}, la beauté n'est la propriété d'aucun ; {green}elle est donc incorporelle{/green}, et l'âme peut l'aimer là où il n'y a plus de corps du tout. **L'amant ne renonce pas à ce qu'il aimait : il découvre ce qu'il aimait déjà.**

    __**Les amants authentiques.**__ À ceux qu'émeuvent les réalités non sensibles, Plotin demande de quels « transports bachiques » ils sont saisis. Ce qui les émeut, « ni les contours, ni la couleur, ni une certaine grandeur, mais l'âme qui est "sans couleur" », sa justice et sa tempérance ([[traite1|traité 1]], chap. 5, l. 8-11).

    __**Ce que l'amant doit devenir.**__ « Celui qui voit, en effet, doit s'être rendu apparenté et semblable à ce qui est vu, pour parvenir à la contemplation. Assurément, jamais l'œil ne verrait le soleil sans être devenu de la même nature que le soleil, et l'âme ne pourrait voir le beau, sans être devenue belle » ([[traite1|traité 1]], chap. 9, l. 29-32). C'est le {violet}principe de parenté{/violet} : on ne connaît que ce à quoi on s'est rendu semblable. D'où l'exigence de tailler et polir sa propre {yellow}**statue intérieure**{/yellow} jusqu'à ce que brille l'éclat de la vertu. {coral}Éduquer l'amant, c'est donc le purifier, non lui offrir des objets plus beaux.{/coral}

    ! L'amant n'abandonne pas la beauté des corps parce qu'elle serait fausse, mais parce qu'elle était déjà l'image d'une beauté qui ne tient à aucun corps.
