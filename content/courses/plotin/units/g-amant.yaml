- id: g-amant-l4
  title: La lumière sur la forme
  notes: |-
    **Ce qui éveille l'amant n'est pas la forme seule, mais la lumière que le Bien répand sur elle.** Plotin le montre par une expérience que chacun peut faire.

    __**Le visage vivant et la statue.**__ Pourquoi un visage vivant, même laid, attire-t-il plus qu'une belle statue ? {red}Si la beauté était la proportion, la statue l'emporterait{/red}. Plotin en conclut qu'« il faut dire que la beauté est plutôt ce qui resplendit sur la proportion que la proportion elle-même, et que c'est cela qui est aimable » ([[traite38|traité 38]], chap. 22, l. 24-26). **Ce qui manque à la statue, c'est la vie : la grâce qui court sur la beauté.**

    __**L'âme ne s'éprend que de la couleur du Bien.**__ L'Intellect et la vie ont la forme du Bien ; mais tant que le Bien ne leur donne pas sa **couleur**, l'âme reste indifférente. Quand elle la reçoit, « l'âme donc en recevant en elle un effluve venu d'en haut est émue, elle est saisie d'un transport bachique, elle est remplie des fureurs du désir, et c'est ainsi que naît l'amour » (chap. 22, l. 7-10).

    __**Ce que l'amant aime au fond est sans forme.**__ Le principe n'est ni une forme ni l'ensemble des formes : il est le {violet}**« sans forme »**{/violet}, et c'est pourquoi il suscite un **amour illimité** : une forme a une mesure, et un amour qui s'y arrêterait serait mesuré ([[traite38|traité 38]], chap. 32-33).

    __**L'amant reste à la porte.**__ Plotin reprend l'Éros du *Banquet* « qui veille à la porte » : l'amoureux d'ici-bas possède la beauté non en la recevant, mais en restant auprès d'elle ([[traite23|traité 23]], chap. 10).

    ! Le Beau n'est pas le terme : la forme belle n'est qu'une trace du sans-forme, et c'est le Bien, par-delà le Beau, que l'amant cherche sans le savoir.
