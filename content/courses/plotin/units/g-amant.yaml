lessons:
- id: g-amant-l1
  title: Amant
  notes: |-
    Chez Plotin, l'{violet}**amant**{/violet} (*erôtikos*) est [def]. Ce n'est pas {pink}un homme amoureux{/pink}.

    __**Trois naturels, d'après le *Phèdre*.**__ Le [[traite20|traité 20]], *Sur la dialectique*, demande quel homme peut s'élever. Il répond avec Platon : c'est celui qui, à sa naissance, entre « dans la semence d'un homme qui deviendra __un philosophe, un musicien ou un amant__ » (chap. 1). Chez Platon, c'est un seul homme ; **Plotin en fait trois degrés d'une même remontée**, du plus sensible au plus intellectuel.

    | Figure | Ce qui le frappe | Ce qu'il doit apprendre |
    | le musicien | les sons et les rythmes | aller à l'harmonie intelligible |
    | l'amant | les beaux corps | aller de tous les corps aux incorporels |
    | le philosophe | il a « des ailes » par nature | les mathématiques, puis la dialectique |

    __**Pourquoi l'amant est frappé, et pourquoi il faut le conduire.**__ Il se **souvient** confusément de la Beauté intelligible, et la cherche dans ce que voient ses yeux : tous voient les beaux corps, « mais sans que tous __en reçoivent également l'aiguillon__ ; ceux qui sont le plus disposés ainsi, ce sont ceux que l'on appelle des amants » ([[traite1|traité 1]], chap. 4). Mais son élan risque de s'arrêter au corps qui l'a éveillé : « Pour le philosophe bien sûr, c'est par nature, alors que le musicien et l'amant __doivent être conduits__ vers le haut » ([[traite20|traité 20]], chap. 1).

    __**L'échelle : des corps aux incorporels.**__ Plotin suit le {sky}*Banquet*{/sky} : ne pas aimer un seul corps, mais tous ; puis les belles occupations et les belles lois ; puis les sciences et les vertus. **Pourquoi l'échelle monte ?** Si plusieurs corps sont beaux, la [[g-beaute|beauté]] n'est la propriété d'aucun : elle est donc incorporelle, et l'âme peut l'aimer là où il n'y a plus de corps. L'amant ne renonce pas à ce qu'il aimait : **il découvre ce qu'il aimait déjà**. Ce qui émeut les amants authentiques, ce n'est « ni les contours, ni la couleur, ni une certaine grandeur, mais __l'âme qui est "sans couleur"__ » ([[traite1|traité 1]], chap. 5). Et l'amoureux d'ici-bas, comme l'Éros du *Banquet* « qui veille à la porte », possède la beauté en restant auprès d'elle ([[traite23|traité 23]], chap. 10).

    __**Amours droites et amour dévié.**__ Plotin ne condamne pas l'amour des corps : il le classe selon ce qu'il cherche ([[traite50|traité 50]], chap. 1). Vouloir « enfanter dans le beau » est un désir d'immortalité, droit mais né d'une indigence ; l'amour pur l'emporte, parce qu'il se suffit de la beauté et n'aime celle d'ici qu'en tant qu'image. L'amour contre nature n'a pas de principe mauvais : **c'est le désir du bien lui-même qui peut faire chuter**, quand on prend l'image pour la chose.

    | Amour | Ce qu'il cherche | Jugement de Plotin |
    | pur | la beauté seule, sans union des corps | le meilleur |
    | mixte, selon la nature | engendrer dans le beau | tempérant, sans faute |
    | mixte, contre la nature | une union qui dévie de la nature | une chute, par ignorance du beau |

    __**L'amant revenu parmi les autres.**__ Le sage ne se retire pas dans une jouissance solitaire : il est **ami de lui-même et des autres** ([[traite46|traité 46]], chap. 15), parce que ce qu'il aime ne lui manque plus et que son lien aux autres ne naît plus du besoin. Comme {yellow}Minos, « familier de Zeus »{/yellow}, l'âme qui s'est unie au principe redescend pour l'annoncer ([[traite9|traité 9]], chap. 7).

    ! L'amant n'est pas l'amour : Éros est « l'œil de ce qui désire », ce par quoi l'amant voit ; l'amant est celui qui voit. Au sommet, c'est l'[[g-intellect-amoureux|Intellect amoureux]] qui achève sa remontée.

    **Voir aussi** : [[g-amour|Amour]] · [[g-beaute|Beauté]] · [[g-intellect-amoureux|Intellect amoureux]] · [[traite20|Traité 20]]
