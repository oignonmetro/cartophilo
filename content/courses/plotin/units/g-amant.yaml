- id: g-amant-l2
  title: Des corps aux vertus
  notes: |-
    **L'amant risque de s'arrêter au corps qui l'a frappé ; l'éduquer, c'est lui apprendre que ce qu'il aime n'est pas ce corps.** Plotin suit l'échelle du *Banquet* (I, 3 [20], 2) : ne pas aimer un seul corps, mais tous ; puis les belles occupations et les belles lois ; puis les techniques, les sciences, les vertus ; enfin l'Intellect et l'Être.

    **Pourquoi l'échelle monte : à chaque étape, la beauté aimée se révèle autre que son support.** Si plusieurs corps sont beaux, la beauté n'est la propriété d'aucun ; elle est donc incorporelle, et l'âme peut l'aimer là où il n'y a plus de corps du tout.

    **Les amants authentiques** (I, 6 [1], 5). À ceux qu'émeuvent les réalités non sensibles, Plotin demande de quels « transports bachiques » ils sont saisis. Ce qui les émeut, ce n'est ni les contours, ni la couleur, ni la grandeur, mais l'âme, « sans couleur », sa justice et sa tempérance.

    **Ce que l'amant doit devenir.** « Assurément, jamais l'œil ne verrait le soleil sans être devenu de la même nature que le soleil, et l'âme ne pourrait voir le beau, sans être devenue belle » (I, 6, 9, 30-32). C'est pourquoi Plotin demande à chacun de tailler et polir sa propre **statue intérieure** jusqu'à ce que brille l'éclat de la vertu. Éduquer l'amant, c'est donc le purifier, non lui offrir des objets plus beaux.

    ! L'amant n'abandonne pas la beauté des corps parce qu'elle serait fausse, mais parce qu'elle était déjà l'image d'une beauté qui ne tient à aucun corps.
