- id: g-amant-l3
  title: Amours droites et amour dévié
  notes: |-
    **Plotin ne condamne pas l'amour des corps : il le classe selon ce qu'il cherche** ([[traite50|traité 50]], chap. 1). Un amour vaut ce que vaut sa reconnaissance de la beauté véritable dans l'image.

    | Amour | Ce qu'il cherche | Jugement de Plotin |
    | pur | la beauté seule, sans union des corps | le meilleur |
    | mixte, selon la nature | engendrer dans le beau | tempérant, sans faute |
    | mixte, contre la nature | une union qui dévie de la nature | une chute, par ignorance du beau |

    __**Pourquoi l'amour qui veut engendrer n'est pas une faute, mais reste inférieur.**__ Vouloir « enfanter dans le beau », c'est vouloir l'**immortalité** dans la condition mortelle : {green}un désir droit{/green}. Mais il vient d'une **indigence**, car on ne veut produire du beau que parce qu'on ne s'en suffit pas. L'amour pur l'emporte parce qu'il se suffit de la beauté : qui a la réminiscence de la beauté intelligible n'aime plus celle d'ici qu'en tant qu'**image**, comme un jeu de la beauté d'en haut.

    __**Pourquoi l'amour contre nature est une chute.**__ Il ne vient pas d'un principe mauvais : {red}c'est le désir du bien lui-même qui peut conduire à chuter vers le mal{/red}, quand on prend l'image pour la chose, par ignorance du beau.

    ! Ce que cherche l'amant n'est pas le plaisir : même l'amour des corps vise, sans le savoir, la beauté dont le corps n'est que l'image.
