lessons:
- id: g-amant-l1
  title: Un des trois naturels qui remontent
  notes: |-
    **L'amant n'est pas d'abord un homme amoureux : c'est un naturel, une disposition de l'âme à être frappée par la beauté.** Plotin en fait l'un des trois chemins par lesquels une âme peut remonter vers l'intelligible.

    __**Trois naturels, d'après le *Phèdre*.**__ Le [[traite20|traité 20]], *Sur la dialectique*, demande quel homme peut s'élever, et répond par {sky}Platon (*Phèdre*, 248d){/sky} : c'est « celui qui, ayant vu antérieurement toutes les réalités ou la plupart d'entre elles, entre, à sa première naissance, dans la semence d'un homme qui deviendra un philosophe, un musicien ou un amant » (chap. 1, l. 6-9). Chez Platon, c'est un seul et même homme ; {green}Plotin en fait trois degrés d'une même remontée{/green}, du plus sensible au plus intellectuel.

    | Figure | Ce qui le frappe | Ce qu'il doit apprendre |
    | le musicien | les sons et les rythmes | aller à l'harmonie intelligible |
    | l'amant | les beaux corps | aller de tous les corps aux incorporels |
    | le philosophe | il a « des ailes » par nature | les mathématiques, puis la dialectique |

    __**Pourquoi l'amant est frappé.**__ Il se **souvient** de la Beauté intelligible, mais confusément : il la cherche dans ce que voient ses yeux. Plotin le dit des corps « que tous peuvent voir, mais sans que tous en reçoivent également l'aiguillon ; ceux qui sont le plus disposés ainsi, ce sont ceux que l'on appelle des amants » ([[traite1|traité 1]], chap. 4, l. 20-22). **Tous voient les mêmes corps : ce qui fait l'amant, c'est d'en être piqué.**

    __**Pourquoi il faut le conduire.**__ « Pour le philosophe bien sûr, c'est par nature, alors que le musicien et l'amant doivent être conduits vers le haut » ([[traite20|traité 20]], chap. 1, l. 9-10). La raison : {red}leur élan s'arrête à l'objet qui l'a éveillé{/red}, le son ou le corps, tandis que le philosophe, détaché par nature, va de lui-même à l'intelligible. Le musicien peut d'ailleurs devenir amant (chap. 2).

    ! Ne pas confondre l'amant et l'amour : Éros est « l'œil de ce qui désire », ce par quoi l'amant voit ; l'amant est celui qui voit (voir la fiche « Amour »). Et le désir du Bien est en toute âme, même celle qui n'est pas un naturel d'amant.
