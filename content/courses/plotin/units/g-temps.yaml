  - id: g-temps-l1-q1
    sentence: "Le temps, que Plotin définit comme la vie de l'âme et non comme le mouvement des astres, se dit en grec translittéré ___."
    answer: khronos
    alt: ["chronos", "khrónos"]
  - id: g-temps-l1-q2
    sentence: "Contre ceux qui identifient le temps au mouvement : « le mouvement peut cesser ou être interrompu, sans que le temps ne ___ » (traité 45, chap. 8)."
    answer: cesse
    alt: []
  - id: g-temps-l1-q3
    sentence: "Contre la définition stoïcienne du temps comme ___ du mouvement, Plotin objecte qu'il n'est pas le même pour tous les mouvements, puisqu'il varie avec la vitesse (traité 45, chap. 8)."
    answer: intervalle
    alt: []
  - id: g-temps-l1-q4
    sentence: "Contre la définition d'Aristote, qui fait du temps le ___ ou la mesure du mouvement, Plotin objecte qu'être mesuré est une propriété du temps, non ce qu'il est (traité 45, chap. 9)."
    answer: nombre
    alt: []
  - id: g-temps-l1-q5
    sentence: "« Une nature ___, parce qu'elle avait choisi de se gouverner elle-même et de s'appartenir à elle-même, en prenant le parti de rechercher plus que le présent, se mit elle-même en mouvement » (traité 45, chap. 11, l. 15-17)."
    answer: affairée
    alt: ["affairee"]
  - id: g-temps-l1-q6
    sentence: "« Une nature affairée, parce qu'elle avait choisi de se gouverner elle-même et de s'___ à elle-même, en prenant le parti de rechercher plus que le présent, se mit elle-même en mouvement » (traité 45, chap. 11, l. 15-17)."
    answer: appartenir
    alt: []
  - id: g-temps-l1-q7
    sentence: "« Une nature affairée, parce qu'elle avait choisi de se gouverner elle-même et de s'appartenir à elle-même, en prenant le parti de rechercher plus que le ___, se mit elle-même en mouvement » (traité 45, chap. 11, l. 15-17)."
    answer: présent
    alt: ["present"]
  - id: g-temps-l1-q8
    sentence: "En produisant le monde sensible, « l'âme, d'abord, s'est ___ elle-même » (traité 45, chap. 11, l. 30) : le temps naît en elle avant d'être dans le monde."
    answer: temporalisée
    alt: ["temporalisee"]
  - id: g-temps-l1-q9
    sentence: "Pour dire que l'âme « s'est temporalisée », Plotin emploie le verbe grec ___, qu'on ne trouve qu'une fois dans les traités (traité 45, chap. 11)."
    answer: khronoun
    alt: ["khronoûn", "chronoun"]
  - id: g-vie-l1-q25
    sentence: "En face de l'éternité, vie de l'Intellect « tout entière ensemble » : « le temps est la vie de l'___ que son mouvement fait passer d'un état à un autre » (traité 45, chap. 11, l. 43-45)."
    answer: âme
    alt: ["ame"]
  - id: g-temps-l1-q10
