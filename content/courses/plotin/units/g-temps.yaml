# Entrée du glossaire de Plotin (skill glossaire) : notion, citations
# vérifiées sur la GF (III, 7, 8-12 ; I, 5, 7). La carte g-vie-l1-q25 vient
# de l'entrée Vie et garde son identifiant, donc sa progression.

id: g-temps
title: Temps (`khronos`)
icon: book
color: coral
lessons:
- id: g-temps-l1
  title: Temps
  notes: |-
    Chez Plotin, le {violet}**temps**{/violet} (*khronos*) est [def]. Il n'est {pink}ni le mouvement des astres ni la mesure de ce mouvement{/pink} : le ciel ne le produit pas, il le rend visible.

    __**Le temps n'est ni le**__ {violet}__**mouvement**__{/violet} __**ni quelque chose du mouvement.**__ Plotin écarte d'abord les définitions anciennes ([[traite45|traité 45]], chap. 7-10). Le temps n'est pas le mouvement, car {coral}les mouvements sont eux-mêmes *dans* le temps{/coral}, et « le mouvement peut cesser ou être interrompu, __sans que le temps ne cesse__ » (chap. 8). Il n'est pas l'intervalle du mouvement, comme le veulent les stoïciens, car « cet intervalle __n'est pas identique pour tous les mouvements__ » (chap. 8) : il varie avec la vitesse. Il n'est pas non plus le nombre ou la mesure du mouvement, comme le veut {sky}Aristote{/sky} : **être mesuré est une propriété du temps, non ce qu'il est** (chap. 9).

    __**Le temps naît quand l'âme se détourne de l'éternité.**__ Avant, le temps reposait dans l'éternité. Puis « une nature affairée, parce qu'elle avait choisi de se gouverner elle-même et de __s'appartenir à elle-même__, en prenant le parti de __rechercher plus que le présent__, se mit elle-même en mouvement, et le temps, lui aussi, se mit en mouvement » (chap. 11, l. 15-17). **Le temps vient donc d'un désir** : celui d'{coral}une âme qui ne se contente plus de tout avoir à la fois{/coral}. Ainsi « l'âme, d'abord, __s'est temporalisée elle-même__ » (l. 30 ; le verbe *khronoun*, seul emploi dans les traités), puis a inscrit dans le temps le monde qu'elle produit. {yellow}Comme une raison qui sort d'une semence au repos, elle se déploie vers la multiplicité et s'affaiblit en s'étendant.{/yellow}

    __**Le temps est la**__ {violet}__**vie de l'âme**__{/violet}__**, image de l'éternité.**__ Pourquoi une *vie* ? Parce que __**le temps est l'image de l'éternité, et que l'éternité est une vie**__ : « si l'éternité est une vie en repos, qui demeure dans l'identité, [...] et si le temps doit être pour sa part une image de l'éternité [...], alors, au lieu d'être la vie de là-bas, il faut dire que le temps est __une autre vie, comme homonyme__ de celle-là » (chap. 11). {coral}L'image d'une vie ne peut être qu'une vie{/coral}, mais une vie qui, au lieu d'être tout entière à la fois, s'étend : « puisque l'âme exerce une activité, puis une autre, puis une autre encore qui succède à la précédente, elle a engendré, en même temps que ses activités, __la succession__ ». D'où la définition : « le temps est __la vie de l'âme__ que son mouvement fait passer d'un état à un autre » (l. 43-45).

    ! Dans cette phrase, « vie » traduit *zôê* et « état » traduit *bios* : {green}l'âme garde une seule vie, mais le contenu de cette vie change d'un moment à l'autre{/green}, et c'est ce changement de contenu qui est le temps.

    __**La vie de l'âme, et non un cadre où l'âme vivrait.**__ On se figure le temps comme {pink}un cadre déjà là{/pink}, dans lequel l'âme entrerait. Plotin l'exclut : « ce n'est pas {pink}hors de l'âme{/pink} qu'il faut saisir le temps » ; « il n'est pas __un accompagnement de l'âme__ ni ne lui est postérieur », mais « ce qui {green}est en elle{/green} et qui lui {green}appartient{/green}, ainsi qu'il en va pour l'éternité » (chap. 11). **Le temps n'est pas ce dans quoi l'âme vit, c'est la** __**manière**__ **dont elle vit** quand elle ne possède plus tout à la fois. La preuve tient dans une expérience de pensée : {yellow}que cette puissance de l'âme cesse d'agir et retourne à l'éternité, il n'y aura plus d'avant ni d'après{/yellow} ; « si donc le retrait de l'âme qui s'unifie entraîne __la suppression du temps__, il est clair que le commencement de son mouvement vers les choses d'ici, ainsi que cette vie, engendrent le temps » (chap. 12).

    __**L'avantage de la définition du temps comme vie.**__ Elle explique ce que les définitions écartées laissaient sans réponse. {coral}Le temps ne cesse pas quand un mouvement cesse{/coral}, parce qu'il est l'activité ininterrompue de l'âme : si la sphère céleste s'immobilisait tandis que l'âme resterait active, « __nous pourrions mesurer la durée de son repos__ » (chap. 12). Et il est un pour tous les mouvements, quelle que soit leur vitesse, parce que tout l'univers se meut dans une même âme.

    | Trait | L'éternité | Le temps |
    | sujet | l'Intellect | une puissance de l'âme |
    | changement | toujours la même | des actes toujours autres |
    | étendue | sans extension | continue, étendue |
    | totalité | tout entière à la fois | par parties, jamais achevée |

    __**Le ciel manifeste le temps, il ne le produit pas.**__ Le monde est dans l'âme, car « notre univers, en effet, n'a __pas d'autre lieu que l'âme__ » (chap. 11) : il se meut donc dans le temps de l'âme. Si l'âme cessait d'agir et revenait à l'éternité, il n'y aurait plus de temps (chap. 12). La **révolution du ciel** sert seulement à le mesurer : « Une mesure, dis-je, du temps, car __le temps lui-même n'est pas mesure__ », et le temps « n'est point engendré par cette révolution, __mais manifesté par elle__ » (chap. 12). **Plotin renverse Aristote** : {red}ce n'est pas le temps qui mesure le mouvement{/red}, {green}c'est le mouvement du ciel qui mesure le temps{/green}, en le rendant visible.

    ! Le temps n'est pas une {pink}forme de la conscience humaine{/pink} : c'est **la vie de l'âme du monde**, dans laquelle l'univers se meut, et il est aussi dans les âmes individuelles (chap. 13).

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 36, chap. 7 | le bonheur ne se mesure pas au temps |
    | traité 45, chap. 8 | le temps n'est pas le mouvement |
    | traité 45, chap. 9 | contre le nombre du mouvement d'Aristote |
    | traité 45, chap. 11 | la naissance du temps, vie de l'âme |
    | traité 45, chap. 12 | le ciel mesure le temps sans le produire |

    **Voir aussi** : [[g-eternite|Éternité]] · [[g-vie|Vie]] · [[g-ame|Âme]] · [[g-bonheur|Bonheur]] · [[traite45|Traité 45]]
