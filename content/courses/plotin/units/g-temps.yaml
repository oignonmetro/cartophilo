lessons:
- id: g-temps-l1
  title: Temps
  notes: |-
    Chez Plotin, le {violet}**temps**{/violet} (*khronos*) est [def]. Il n'est {pink}ni le mouvement des astres ni la mesure de ce mouvement{/pink} : le ciel ne le produit pas, il le rend visible.

    __**Le temps n'est ni le mouvement ni quelque chose du mouvement.**__ Plotin écarte d'abord les définitions anciennes ([[traite45|traité 45]], chap. 7-10). Le temps n'est pas le mouvement, car les mouvements sont eux-mêmes dans le temps, et « le mouvement peut cesser ou être interrompu, __sans que le temps ne cesse__ » (chap. 8). Il n'est pas l'intervalle du mouvement, comme le veulent les stoïciens, car « cet intervalle __n'est pas identique pour tous les mouvements__ » : il varie avec la vitesse. Il n'est pas non plus le nombre ou la mesure du mouvement, comme le veut {sky}Aristote{/sky} : **être mesuré est une propriété du temps, non ce qu'il est** (chap. 9).

    __**Le temps naît quand l'âme se détourne de l'éternité.**__ Avant, le temps reposait dans l'éternité. Puis « une nature affairée, parce qu'elle avait choisi de se gouverner elle-même et de __s'appartenir à elle-même__, en prenant le parti de __rechercher plus que le présent__, se mit elle-même en mouvement, et le temps, lui aussi, se mit en mouvement » (chap. 11, l. 15-17). **Le temps vient donc d'un désir** : celui d'une âme qui ne se contente plus de tout avoir à la fois. Ainsi « l'âme, d'abord, __s'est temporalisée elle-même__ » (l. 30 ; le verbe *khronoun*, seul emploi dans les traités), puis a inscrit dans le temps le monde qu'elle produit. {yellow}Comme une raison qui sort d'une semence au repos, elle se déploie vers la multiplicité et s'affaiblit en s'étendant.{/yellow}

    __**Le temps est la vie de l'âme, image de l'éternité.**__ L'âme passe d'un acte à un autre, et cette succession est le temps : « le temps est __la vie de l'âme__ que son mouvement fait passer d'un état à un autre » (l. 43-45). C'est encore une [[g-vie|vie]], mais pas celle de l'Intellect : « il faut dire que le temps est __une autre vie, comme homonyme__ de celle-là ». Il imite l'éternité en cherchant, par parties et sans fin, la totalité qu'elle possède d'un coup.

    | Trait | L'éternité | Le temps |
    | sujet | l'Intellect | une puissance de l'âme |
    | changement | toujours la même | des actes toujours autres |
    | étendue | sans extension | continue, étendue |
    | totalité | tout entière à la fois | par parties, jamais achevée |

    __**Le ciel manifeste le temps, il ne le produit pas.**__ Le monde est dans l'âme, car « notre univers, en effet, n'a __pas d'autre lieu que l'âme__ » (chap. 11) : il se meut donc dans le temps de l'âme. Si l'âme cessait d'agir et revenait à l'éternité, il n'y aurait plus de temps (chap. 12). La révolution du ciel sert seulement à le mesurer : « Une mesure, dis-je, du temps, car __le temps lui-même n'est pas mesure__ », et le temps « n'est point engendré par cette révolution, __mais manifesté par elle__ » (chap. 12). **Plotin renverse Aristote** : {red}ce n'est pas le temps qui mesure le mouvement{/red}, {green}c'est le mouvement du ciel qui mesure le temps{/green}, en le rendant visible.

    ! Le temps n'est pas une forme de la conscience humaine : c'est la vie de l'âme du monde, dans laquelle l'univers se meut, et il est aussi dans les âmes individuelles (chap. 13).

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 45, chap. 8 | le temps n'est pas le mouvement |
    | traité 45, chap. 9 | contre le nombre du mouvement d'Aristote |
    | traité 45, chap. 11 | la naissance du temps, vie de l'âme |
    | traité 45, chap. 12 | le ciel mesure le temps sans le produire |
    | traité 36, chap. 7 | le bonheur ne se mesure pas au temps |

    **Voir aussi** : [[g-eternite|Éternité]] · [[g-vie|Vie]] · [[g-ame|Âme]] · [[g-bonheur|Bonheur]] · [[traite45|Traité 45]]
