  - id: g-tupos-l1-q1
    sentence: "La trace qu'une forme laisse dans ce qui la reçoit, mot venu du sceau qui marque la cire, se dit en grec translittéré ___."
    answer: tupos
    alt: ["typos", "túpos"]
  - id: g-tupos-l1-q2
    sentence: "« Nous ne disons pas que l'empreinte du sensible arrive dans l'âme et lui appose sa ___ » (traité 41, chap. 1)."
    answer: marque
    alt: []
  - id: g-tupos-l1-q3
    sentence: "Plotin n'explique pas non plus « le souvenir par la ___ interne de l'empreinte » (traité 41, chap. 1)."
    answer: persistance
    alt: []
  - id: g-tupos-l1-q4
    sentence: "« Si les empreintes persistaient, on n'aurait nul besoin de ___ pour se souvenir » (traité 41, chap. 3)."
    answer: chercher
    alt: []
  - id: g-tupos-l1-q5
    sentence: "Si les empreintes persistaient, « l'on n'oublierait pas d'abord pour se ___ ensuite » (traité 41, chap. 3)."
    answer: remémorer
    alt: ["rememorer"]
  - id: g-tupos-l1-q6
    sentence: "Ceux qui voient beaucoup se souviennent moins ; or, « si les empreintes demeuraient présentes, leur ___ ne rendrait pas les souvenirs moins nombreux » (traité 41, chap. 3)."
    answer: quantité
    alt: ["quantite"]
  - id: g-tupos-l1-q7
    sentence: "L'exercice montre qu'« il y a stimulation de la ___ de l'âme grâce à laquelle nous nous souvenons » (traité 41, chap. 3)."
    answer: puissance
    alt: []
  - id: g-tupos-l1-q8
    sentence: "Pour le son, « il y a dans l'air une empreinte, une sorte d'___ » (traité 41, chap. 2)."
    answer: ébranlement
    alt: ["ebranlement"]
  - id: g-tupos-l1-q9
    sentence: "Les choses qui viennent de l'Intellect, la pensée discursive « en conserve aussi des sortes d'___ » (traité 49, chap. 2)."
    answer: empreintes
    alt: []
  - id: g-tupos-l1-q10
    sentence: "Les objets de la contemplation, « au lieu d'être agissants ils étaient déposés en elle sans être ___ » (traité 19, chap. 4)."
    answer: éclairés
    alt: ["eclaires"]
  - id: g-tupos-l1-q11
    sentence: "« Il faut par conséquent ___ l'empreinte aux réalités véritables dont elles sont précisément les empreintes » (traité 19, chap. 4)."
    answer: adapter
