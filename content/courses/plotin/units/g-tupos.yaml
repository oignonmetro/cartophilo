# était vide). Citations vérifiées sur la GF (IV, 6, 1-3 ; V, 3, 2 ; I, 2, 4).
# Les arguments tirés de la vision ont leurs cartes dans l'entrée Sensation ;
# « une contemplation et une empreinte de ce qui a été vu » (I, 2, 4), dans
# Conversion.

id: g-tupos
title: Empreinte (`tupos`)
icon: book
