lessons:
- id: g-tupos-l1
  title: Empreinte
  notes: |-
    Chez Plotin, l'{violet}**empreinte**{/violet} (*tupos*) est [def]. Le mot vient du sceau qui marque la cire, et c'est précisément ce modèle que Plotin {pink}refuse pour l'âme{/pink}, tout en gardant le mot.

    __**Le modèle du sceau, et pourquoi Plotin le refuse.**__ Pour les stoïciens, sentir, c'est recevoir dans l'âme l'empreinte de l'objet, et se souvenir, c'est la garder. Plotin rejette les deux thèses ensemble : « nous ne disons pas que l'empreinte du sensible arrive dans l'âme et __lui appose sa marque__, pas plus que nous n'expliquons le souvenir par __la persistance interne de l'empreinte__ » ([[traite41|traité 41]], chap. 1). Pourquoi ? {coral}Parce que l'âme n'est pas une matière qui subit, mais une puissance qui agit{/coral} : une empreinte suppose une cire. Les arguments tirés de la vue sont dans l'entrée [[g-aisthesis|sensation]].

    __**Une mémoire sans empreintes.**__ Si se souvenir était garder des marques, l'oubli serait inexplicable : « si les empreintes persistaient, __on n'aurait nul besoin de chercher pour se souvenir__, et l'on n'oublierait pas d'abord pour se remémorer ensuite » (chap. 3). De même, ceux qui voient beaucoup de choses se souviennent moins bien, alors que, « si les empreintes demeuraient présentes, __leur quantité ne rendrait pas les souvenirs moins nombreux__ ». Et l'exercice fortifie la mémoire {yellow}comme l'entraînement fortifie les bras et les jambes{/yellow}. **La mémoire n'est donc pas un stock de marques, mais une puissance qu'on renforce** : il y a « stimulation de la puissance de l'âme grâce à laquelle nous nous souvenons ».

    __**Pourquoi Plotin parle pourtant d'empreintes.**__ Il en reste deux emplois, qui ne contredisent pas ce refus. Dans les corps, d'abord : un son est une empreinte dans l'air, « une sorte d'__ébranlement__ » que l'âme lit (chap. 2). Dans la pensée discursive, ensuite : la sensation lui donne une empreinte, et des choses de l'Intellect « elle en conserve aussi __des sortes d'empreintes__ » ([[traite49|traité 49]], chap. 2). {green}Ce ne sont plus des marques causées dans une matière passive, mais des formes qu'une puissance active tient et travaille{/green} ; le « sortes de » dit l'écart avec le sceau (voir [[g-dianoia|réflexion]]).

    __**Les empreintes des intelligibles, à raviver.**__ L'âme a toujours eu en elle de quoi connaître l'intelligible ; mais « ce qu'elle possédait ce n'étaient pas les objets contemplés, __mais leurs empreintes__ », et ces objets, « au lieu d'être agissants ils étaient déposés en elle __sans être éclairés__ » ([[traite19|traité 19]], chap. 4). Pourquoi faut-il plus que les avoir ? Parce qu'une empreinte ne vaut que rapportée à ce qu'elle reproduit : « il faut par conséquent adapter l'empreinte aux réalités véritables dont elles sont précisément les empreintes ». C'est en se tournant vers l'Intellect qu'elle les ravive (voir [[g-epistrophe|conversion]]).

    | Où | Ce qu'est l'empreinte | Plotin l'admet-il ? |
    | dans l'air que le son ébranle | une marque dans une matière | oui, dans les corps |
    | dans l'âme qui sent ou se souvient | une marque gravée qui persisterait | non |
    | dans la pensée discursive | une forme tenue par une puissance active | oui, comme « sortes d'empreintes » |
    | dans l'âme, venue de l'Intellect | la trace des intelligibles, à éclairer | oui |

    ! Refuser l'empreinte n'est pas refuser que le corps soit affecté : l'organe subit, le vivant pâtit. Ce que Plotin nie, c'est que l'âme soit marquée par ce qu'elle connaît.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 41, chap. 1 | ni sensation ni souvenir par empreinte |
    | traité 41, chap. 3 | la mémoire, une puissance qu'on renforce |
    | traité 49, chap. 2 | des sortes d'empreintes dans la pensée discursive |
    | traité 19, chap. 4 | les empreintes des intelligibles, à éclairer |

    **Voir aussi** : [[g-aisthesis|Sensation]] · [[g-phantasia|Représentation]] · [[g-dianoia|Réflexion]] · [[g-epistrophe|Conversion]] · [[traite41|Traité 41]]
