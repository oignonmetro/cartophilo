    answer: Sophiste
    alt: ["sophiste"]
  - id: g-multiplicite-intelligible-l3-7
    sentence: "Parmi les cinq grands genres que contient l'Intellect, celui qui distingue les Formes entre elles, et la pensée de son objet, est l'___."
    answer: Altérité
