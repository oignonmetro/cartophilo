- id: g-multiplicite-intelligible-l2
  title: Un vivant total
  notes: |-
    **Dans l'Intellect, ce qui pense et ce qui est pensé ne font qu'un.** L'Intellect qui pense (`noûs`) est identique aux Formes qu'il pense (`noêton`) : elles ne sont pas hors de lui, et chaque Forme est elle-même un intellect en acte. « L'Intellect dans sa totalité est toutes les Formes, et chaque Forme est un intellect » (V, 9 [5], 8).

    **L'Intellect n'est donc pas un réceptacle passif de concepts, mais un vivant.** Plotin le nomme, d'après le *Timée* (31b), le **vivant total** (`zôon panteles`) : une vie qui se pense, non un catalogue d'idées inertes.

    **L'image de la sphère vivante** (VI, 7 [38], 15) : Plotin compare l'Intellect à une **sphère** lumineuse et variée, ou à un être fait tout entier de **visages** vivants et resplendissants, qui rayonnent tous ensemble sans s'opposer. Chaque visage est distinct, aucun n'est hors des autres.

    ! L'identité du penser et de l'être n'abolit pas la multiplicité, elle l'exige : se penser suppose une distinction entre ce qui pense et ce qui est pensé. Ce qui est absolument un ne se pense pas.
  points:
  - id: g-multiplicite-intelligible-l2-1
    sentence: "Dans l'Intellect, il n'y a pas de séparation entre ce qui pense et ce qui est pensé : l'Intellect est ___ aux Formes qu'il contemple."
    answer: identique
    alt: []
  - id: g-multiplicite-intelligible-l2-2
    sentence: "« L'Intellect dans sa totalité est toutes les Formes, et chaque Forme est un ___ » (V, 9, 8)."
    answer: intellect
    alt: ["Intellect"]
  - id: g-multiplicite-intelligible-l2-3
    sentence: "L'Intellect n'est pas un réceptacle passif de concepts : Plotin le nomme, d'après le *Timée* (31b), le ___ total."
    answer: vivant
    alt: []
  - id: g-multiplicite-intelligible-l2-4
    sentence: "Le « vivant total » par lequel Plotin désigne l'Intellect se dit en grec, translittéré, ___."
    answer: zôon panteles
    alt: ["zoon panteles", "zôon pantelês"]
  - id: g-multiplicite-intelligible-l2-5
    sentence: "L'expression « vivant total », que Plotin applique à l'Intellect, vient du ___ de Platon (31b)."
    answer: Timée
    alt: ["Timee", "timée"]
  - id: g-multiplicite-intelligible-l2-6
    sentence: "Pour figurer la plénitude vivante de l'Intellect, Plotin le compare à une sphère faite tout entière de ___ vivants et resplendissants (VI, 7, 15)."
    answer: visages
