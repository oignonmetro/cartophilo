- id: g-multiplicite-intelligible-l3
  title: D'où vient la multiplicité intelligible
  notes: |-
    **Tout part de l'Un, qui reste immobile.** Selon la théorie des **deux activités**, l'Un demeure en lui-même tout en laissant procéder une **puissance indéterminée** (la dyade indéterminée du traité 10, V, 1, 5).

    **La conversion fragmente.** Cette puissance se retourne vers sa source pour la contempler (`epistrophê`). Mais elle ne peut embrasser l'Un dans sa simplicité en un seul regard : voulant tout posséder, elle **brise** la puissance une qu'elle reçoit en une pluralité de Formes déterminées (VI, 7 [38], 15-16 ; III, 8 [30], 8 ; V, 3 [49], 10-11). C'est là que naissent ensemble la dualité de ce qui pense et de ce qui est pensé, et la multiplicité des Formes. L'Intellect est ainsi un « Bien devenu varié » (VI, 7) : le Bien lui donne la multiplicité sans la posséder lui-même.

    **Altérité et Identité.** L'Intellect contient les cinq **grands genres** du *Sophiste* : être, mouvement, repos, identité, altérité (traités 42-44, VI, 1-3). {violet}L'**Altérité** (`heterotês`){/violet} distingue les Formes entre elles, et la pensée de son objet ; {teal}l'**Identité**{/teal} garantit la cohésion du tout. C'est encore l'altérité, non le lieu, qui fait la multiplicité des âmes (VI, 4 [22], 4).

    | Ce qui joue | Ce qu'il apporte |
    | la puissance indéterminée | ce qui procède de l'Un |
    | la conversion | la détermination par le regard |
    | l'Altérité | la distinction des Formes |
    | l'Identité | la cohésion du tout |

    ! La différence décisive avec le sensible : dans l'intelligible, ce qui distingue est l'**altérité** ; dans le sensible, ce qui sépare est le **lieu**, avec la masse.
  points:
  - id: g-multiplicite-intelligible-l3-1
    sentence: "Selon la théorie plotinienne des deux ___, l'Un demeure immobile en lui-même tout en laissant procéder une puissance indéterminée."
    answer: activités
    alt: ["activites"]
  - id: g-multiplicite-intelligible-l3-2
    sentence: "Ce qui procède de l'Un, avant de se tourner vers lui et d'être déterminé par ce regard, est une puissance ___."
    answer: indéterminée
    alt: ["indeterminee", "informe"]
  - id: g-multiplicite-intelligible-l3-3
    sentence: "En se retournant vers l'Un pour le contempler, mouvement nommé ___ (`epistrophê`), la puissance issue de l'Un ne peut l'embrasser dans sa simplicité."
    answer: conversion
    alt: []
  - id: g-multiplicite-intelligible-l3-4
    sentence: "Incapable de saisir l'Un d'un seul regard, l'Intellect ___ la puissance une qu'il en reçoit en une pluralité de Formes déterminées (VI, 7, 15)."
    answer: fragmente
    alt: ["brise"]
  - id: g-multiplicite-intelligible-l3-5
    sentence: "Le Bien donne la multiplicité à l'Intellect sans la posséder lui-même : l'Intellect est, selon une formule de VI, 7, un « Bien devenu ___ »."
    answer: varié
    alt: ["varie"]
  - id: g-multiplicite-intelligible-l3-6
