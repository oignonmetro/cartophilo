lessons:
- id: g-multiplicite-intelligible-l1
  title: Toutes choses ensemble, et distinctes
  notes: |-
    **La multiplicité intelligible est celle de l'Intellect : une pluralité réelle, puisqu'il y a beaucoup de Formes, mais qui n'a rien de la dispersion des corps.** Comprendre comment c'est possible, c'est comprendre pourquoi l'Intellect n'est ni l'Un ni un monde de choses séparées.

    __**Un « un-multiple ».**__ L'Intellect n'a pas la simplicité de l'Un, mais sa multiplicité n'est pas celle des corps : c'est une composition où chaque Forme n'est pas un morceau séparé, mais **contient et exprime le tout**. Plotin le nomme {violet}*hen polla*{/violet}, un-multiple.

    __**Ensemble et pourtant distinctes.**__ Plotin reprend la formule d'{sky}Anaxagore{/sky} : « Là-bas toutes choses sont ensemble », et il ajoute aussitôt : « et pourtant distinctes » ([[traite5|traité 5]], chap. 6, l. 3-4). **Ni juxtaposées dans un espace, ni mêlées en un mélange confus** : l'Intellect « est "toutes choses ensemble" et en même temps ne l'est pas, car chacune d'entre elles est une puissance particulière » (l. 7-9). Notre âme en donne déjà une idée : elle possède plusieurs sciences ensemble sans les confondre, et chacune agit quand il le faut sans entraîner les autres (l. 4-7).

    | Multiplicité | Les parties | Le tout |
    | sensible | hors les unes des autres | plus grand que chaque partie |
    | intelligible | chacune contient le tout | ni divisé ni diminué |

    __**Deux images.**__

    - {yellow}La science et ses théorèmes{/yellow} ([[traite8|traité 8]], chap. 5 ; [[traite5|traité 5]], chap. 8) : une science contient tous ses théorèmes à la fois, sans qu'ils se confondent. Penser un théorème, ce n'est pas détacher un morceau de la science, qui reste là tout entière, et le théorème la contient virtuellement. Inversement, un théorème détaché de la science entière ne serait que les propos d'un enfant ([[traite8|traité 8]], chap. 5)
    - {yellow}La semence{/yellow} (chap. 6, l. 11-14) : dans la semence entière, les parties ne sont pas distinctes et les raisons y sont « en quelque sorte concentrées », mais il y a déjà « une raison de l'œil et une raison des mains », distinctes sans occuper encore des lieux séparés ; elles ne s'écartent qu'en se déployant dans un corps

    ! « Ensemble » ne veut pas dire « confondu » : sans distinction entre les Formes, il n'y aurait plus de multiplicité du tout, et l'Intellect se confondrait avec l'Un.
