id: g-multiplicite-intelligible
title: Multiplicité intelligible
icon: infinity
color: amber
lessons:
- id: g-multiplicite-intelligible-l1
  title: Multiplicité intelligible
  notes: |-
    Chez Plotin, la {violet}**multiplicité intelligible**{/violet} est [def], qui {pink}n'a rien de la dispersion des corps{/pink}.

    __**Un « un-multiple ».**__ L'Intellect n'a pas la simplicité de l'Un, mais sa multiplicité n'est pas celle des corps : chaque Forme n'est pas un morceau séparé, elle **contient et exprime le tout**. Plotin le nomme {violet}*hen polla*{/violet}, un-multiple.

    __**Ensemble et pourtant distinctes.**__ La difficulté est de penser une pluralité qui ne soit ni une juxtaposition dans l'espace ni un mélange confus. Plotin reprend {sky}Anaxagore{/sky} : « Là-bas __toutes choses sont ensemble__ », et ajoute aussitôt : « et pourtant distinctes » ([[traite5|traité 5]], chap. 6). L'Intellect « est "toutes choses ensemble" et en même temps ne l'est pas, car __chacune d'entre elles est une puissance particulière__ ». Notre âme en donne déjà une idée : elle possède plusieurs sciences ensemble sans les confondre, et chacune agit quand il le faut.

    | Multiplicité | Les parties | Le tout |
    | sensible | hors les unes des autres | plus grand que chaque partie |
    | intelligible | chacune contient le tout | ni divisé ni diminué |

    __**Deux images.**__ {yellow}La science et ses théorèmes{/yellow} : penser un théorème, ce n'est pas détacher un morceau de la science, qui reste là tout entière. {yellow}La semence{/yellow} : en elle les raisons sont « en quelque sorte concentrées », mais il y a déjà « une raison de l'œil et une raison des mains », distinctes sans occuper des lieux séparés (chap. 6).

    __**L'Altérité distingue, l'Identité rassemble.**__ La puissance issue de l'Un, ne pouvant le saisir comme un, le démultiplie en Formes (voir [[g-procession|procession]]) : l'Intellect est « un Bien devenu varié ». Il contient les cinq **grands genres** du {sky}*Sophiste*{/sky} : être, mouvement, repos, identité, altérité. L'**Altérité** distingue les Formes entre elles, et la pensée de son objet ; l'**Identité** garantit la cohésion du tout. **Dans l'intelligible, ce qui distingue est l'altérité ; dans le sensible, ce qui sépare est le lieu**, avec la masse : c'est toute la différence avec la [[g-multiplicite-sensible|multiplicité sensible]]. L'Altérité produit même un substrat commun aux Formes, la [[g-matiere-intelligible|matière intelligible]], et cette multiplicité est vivante : l'Intellect est le [[g-vivant-total|vivant total]].

    ! « Ensemble » ne veut pas dire « confondu » : sans distinction entre les Formes, il n'y aurait plus de multiplicité du tout, et l'Intellect se confondrait avec l'Un.

    **Voir aussi** : [[g-multiplicite-sensible|Multiplicité sensible]] · [[g-intellect|Intellect]] · [[g-vivant-total|Vivant total]] · [[g-matiere-intelligible|Matière intelligible]] · [[g-unite|Unité]]
  tables:
