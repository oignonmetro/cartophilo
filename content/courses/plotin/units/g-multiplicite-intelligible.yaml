- id: g-multiplicite-intelligible-l4
  title: La matière intelligible
  notes: |-
    **Un troisième élément de la multiplicité intelligible : la matière intelligible** (traité 12, II, 4, chap. 2-5). Si les Formes sont plusieurs, chacune a sa **figure propre** ; or ce qui a une figure propre suppose un **substrat** qui la reçoive. Il faut donc, là-bas aussi, une matière : un substrat **commun** à toutes les Formes, grâce auquel elles se distinguent sans que l'intelligible se fragmente en morceaux sans lien (chap. 4).

    - **Ce qui distingue les Formes.** Le « monde » intelligible (`kosmos`) est une Forme unique qui en contient beaucoup : leurs distinctions viennent d'une matière « coupée » en autant de figures. C'est l'argument que le traité tire de l'**unimultiplicité** de l'Intellect.
    - **Ce qu'elle est.** Le produit informe qu'engendre chaque réalité intelligible, avant sa **conversion**. La puissance indéterminée issue de l'Un est ainsi la matière de l'Intellect, qui ne reçoit sa forme qu'en se retournant vers l'Un ; d'autres traités l'identifient à la **Dyade indéfinie** (V, 4 [7], 2 ; V, 1 [10], 5). Elle est engendrée, mais pas dans le temps.

    | Matière intelligible | Matière sensible |
    | une fois formée, vie définie et intellective | même formée, ne vit ni ne pense |
    | garde toujours la même forme | reçoit une forme après une autre |

    ! « Matière » ne veut pas dire ici masse ni étendue : la matière intelligible est incorporelle, et c'est pourquoi elle distingue les Formes sans les séparer.
  points:
  - id: g-multiplicite-intelligible-l4-1
    sentence: "Si les Formes sont plusieurs, chacune a sa figure propre, qui suppose un substrat pour la recevoir : Plotin en conclut qu'il existe une matière ___ (traité 12, chap. 4)."
    answer: intelligible
    alt: []
  - id: g-multiplicite-intelligible-l4-2
    sentence: "La matière intelligible est un substrat ___ à toutes les Formes : grâce à elle, elles se distinguent sans que l'intelligible se fragmente."
    answer: commun
    alt: []
  - id: g-multiplicite-intelligible-l4-3
    sentence: "Le traité où Plotin démontre l'existence d'une matière intelligible, à côté de la matière sensible, est le traité ___ (II, 4)."
    answer: "12"
    alt: ["douze"]
  - id: g-multiplicite-intelligible-l4-4
    sentence: "Dans l'Intellect, Forme unique qui en contient beaucoup, les distinctions entre les Formes viennent d'une matière « ___ » en autant de figures (traité 12, 4)."
    answer: coupée
    alt: ["coupee"]
  - id: g-multiplicite-intelligible-l4-5
