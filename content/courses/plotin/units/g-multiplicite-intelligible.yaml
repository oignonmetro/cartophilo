- id: g-multiplicite-intelligible-l4
  title: La matière intelligible
  notes: |-
    **Un troisième élément de la multiplicité intelligible, plus surprenant : il y a, là-bas aussi, une matière** ([[traite12|traité 12]], chap. 2-5). L'argument part de la pluralité même des Formes.

    __**Si les Formes sont plusieurs, il leur faut un substrat.**__ Chaque Forme a sa {violet}figure propre{/violet} ; or ce qui a une figure propre suppose un **substrat** qui la reçoive, comme une forme suppose ce qu'elle forme. {green}Il faut donc, là-bas aussi, une matière{/green} : un substrat **commun** à toutes les Formes, grâce auquel elles se distinguent sans que l'intelligible se fragmente en morceaux sans lien (chap. 4). Le « monde » intelligible est une Forme unique qui en contient beaucoup : leurs distinctions viennent d'une matière « coupée » en autant de figures.

    __**Ce qui la produit : l'Altérité.**__ « L'altérité de là-bas existe toujours, elle qui produit la matière, car c'est elle qui est le principe de la matière et le mouvement premier » (chap. 5, l. 28-30), c'est-à-dire le premier écart par rapport à l'Un. {coral}Le genre qui distingue les Formes est donc aussi celui qui leur donne leur substrat.{/coral}

    __**Ce qu'elle est.**__ La puissance indéterminée issue de l'Un, avant sa **conversion** : elle est la matière de l'Intellect, qui ne reçoit sa forme qu'en se retournant vers l'Un. D'autres traités l'identifient à la {violet}**Dyade indéfinie**{/violet} ([[traite7|traité 7]], chap. 2 ; [[traite10|traité 10]], chap. 5). Elle est engendrée, mais pas dans le temps.

    | Matière intelligible | Matière sensible |
    | une fois formée, vie définie et intellective | même formée, ne vit ni ne pense |
    | garde toujours la même forme | reçoit une forme après une autre |

    ! « Matière » ne veut pas dire ici masse ni étendue : la matière intelligible est incorporelle, et c'est pourquoi elle distingue les Formes sans les séparer.
  points:
