- id: g-multiplicite-intelligible-l2
  title: Un vivant total
  notes: |-
    **Si les Formes sont dans l'Intellect, elles ne sont pas des objets inertes qu'il regarderait : elles sont vivantes et pensantes comme lui.** C'est ce qui fait de la multiplicité intelligible une multiplicité vivante.

    __**Ce qui pense et ce qui est pensé ne font qu'un.**__ L'Intellect qui pense est identique aux Formes qu'il pense : elles ne sont pas hors de lui, et chaque Forme est elle-même un intellect en acte. « L'Intellect dans sa totalité est toutes les Formes, et chaque Forme est un intellect » ([[traite5|traité 5]], chap. 8, l. 3-4).

    __**Donc l'Intellect est un vivant.**__ {red}Pas un réceptacle passif de concepts{/red}, ni un catalogue d'idées : Plotin le nomme, d'après le {sky}*Timée*{/sky} (31b), le {violet}**vivant total**{/violet} (*zôon panteles*), une vie qui se pense.

    __**L'image de la sphère aux visages.**__ L'Intellect est « un Bien devenu varié » : on peut le comparer {yellow}« à une sphère qui vit une vie variée »{/yellow}, ou se le représenter « comme un être qui n'est que visages, où resplendissent des visages vivants » ([[traite38|traité 38]], chap. 15, l. 23-28). **Un visage n'est pas une chose parmi d'autres : c'est la vie d'un être qui se montre tout entière en lui.** Chaque visage est distinct, aucun n'est hors des autres.

    ! L'identité du penser et de l'être n'abolit pas la multiplicité, elle l'exige : se penser suppose une distinction entre ce qui pense et ce qui est pensé. Ce qui est absolument un ne se pense pas.
  points:
  - id: g-multiplicite-intelligible-l2-1
    sentence: "Dans l'Intellect, il n'y a pas de séparation entre ce qui pense et ce qui est pensé : l'Intellect est ___ aux Formes qu'il contemple."
    answer: identique
    alt: []
  - id: g-multiplicite-intelligible-l2-2
