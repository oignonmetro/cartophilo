  points:
  - id: g-multiplicite-intelligible-l1-1
    sentence: "La multiplicité de l'Intellect est une composition intelligible où chaque Forme n'est pas un morceau séparé, mais contient et exprime le ___."
    answer: tout
    alt: ["Tout"]
  - id: g-multiplicite-intelligible-l1-2
    sentence: "Pour dire comment les Formes coexistent dans l'Intellect, Plotin reprend à ___ la formule « toutes choses ensemble » (*homou panta*)."
    answer: Anaxagore
    alt: ["anaxagore"]
  - id: g-multiplicite-intelligible-l1-q1
    sentence: "« Là-bas toutes choses sont ___ » et pourtant distinctes (traité 5, chap. 6, l. 3-4)."
    answer: ensemble
    alt: []
  - id: g-multiplicite-intelligible-l1-3
    sentence: "Dans l'intelligible, les Formes sont, précise Plotin, ensemble et pourtant ___ (traité 5, chap. 6) : ni juxtaposées dans l'espace, ni mêlées."
    answer: distinctes
    alt: []
  - id: g-multiplicite-intelligible-l1-q2
    sentence: "L'Intellect « est \"toutes choses ensemble\" et en même temps ne l'est pas, car chacune d'entre elles est une ___ » (traité 5, chap. 6, l. 7-9)."
    answer: puissance particulière
    alt: ["puissance particuliere"]
  - id: g-multiplicite-intelligible-l1-q3
    sentence: "Notre âme donne déjà une idée de la multiplicité intelligible : elle possède plusieurs ___ ensemble sans les confondre, et chacune agit quand il le faut sans entraîner les autres (traité 5, chap. 6, l. 4-7)."
    answer: sciences
    alt: []
  - id: g-multiplicite-intelligible-l1-5
    sentence: "Pour illustrer la coexistence non spatiale des Formes dans l'Intellect, Plotin le compare à une ___ qui contient tous ses théorèmes à la fois."
    answer: science
    alt: ["epistêmê", "episteme"]
  - id: g-multiplicite-intelligible-l1-6
    sentence: "Penser un théorème, ce n'est pas détacher un morceau de la science : celle-ci reste tout entière, et le théorème la contient ___."
    answer: virtuellement
    alt: ["en puissance"]
  - id: g-multiplicite-intelligible-l1-q4
    sentence: "Dans la semence entière, rien n'est encore séparé, et les raisons y sont « en quelque sorte concentrées », mais il y a déjà « une raison de l'___ et une raison des mains » (traité 5, chap. 6, l. 11-14)."
    answer: œil
    alt: ["oeil"]
  - id: g-multiplicite-intelligible-l1-7
    sentence: "Le traité où Plotin décrit l'Intellect comme « toutes choses ensemble », ensemble et pourtant distinctes, avec l'image des semences, est le traité ___ (V, 9)."
    answer: "5"
    alt: ["cinq"]
  - id: g-multiplicite-intelligible-l1-8
    sentence: "« Ensemble » ne veut pas dire confondu : sans distinction entre les Formes, l'Intellect se confondrait avec l'___."
    answer: Un
    alt: ["un"]
  - id: g-multiplicite-intelligible-l3-4
    sentence: "Incapable de saisir l'Un d'un seul regard, l'Intellect ___ la puissance une qu'il en reçoit en une pluralité de Formes déterminées (traité 38, chap. 15)."
    answer: fragmente
    alt: ["brise"]
  - id: g-multiplicite-intelligible-l3-5
    sentence: "Le Bien donne la multiplicité à l'Intellect sans la posséder lui-même : l'Intellect est, selon une formule de VI, 7, un « Bien devenu ___ »."
    answer: varié
    alt: ["varie"]
  - id: g-multiplicite-intelligible-l3-6
    sentence: "Les cinq grands genres que Plotin place dans l'Intellect (être, mouvement, repos, identité, altérité) viennent du ___ de Platon."
    answer: Sophiste
    alt: ["sophiste"]
  - id: g-multiplicite-intelligible-l3-7
    sentence: "Parmi les cinq grands genres que contient l'Intellect, celui qui distingue les Formes entre elles, et la pensée de son objet, est l'___."
    answer: Altérité
    alt: ["altérité", "alterite", "heterotês"]
  - id: g-multiplicite-intelligible-l3-8
    sentence: "Parmi les cinq grands genres que contient l'Intellect, celui qui garantit la cohésion du tout, face à l'Altérité qui distingue, est l'___."
    answer: Identité
    alt: ["identité", "identite"]
  - id: g-multiplicite-intelligible-l3-9
    sentence: "Dans l'intelligible, et jusque pour les âmes, la multiplicité vient de l'altérité, non du ___ (traité 22, chap. 4)."
    answer: lieu
    alt: []
