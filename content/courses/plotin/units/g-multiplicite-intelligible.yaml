id: g-multiplicite-intelligible
title: Multiplicité intelligible
subtitle: L'Intellect, un-multiple où toutes choses sont ensemble et pourtant distinctes
group: Multiplicité
icon: infinity
color: amber
lessons:
- id: g-multiplicite-intelligible-l1
  title: Toutes choses ensemble, et distinctes
  notes: |-
    **L'Intellect est un « un-multiple » (`hen polla`).** Il n'a pas la simplicité de l'Un, mais sa multiplicité n'est pas celle des corps : c'est une composition intelligible où chaque partie, chaque Forme, n'est pas un morceau séparé, mais **contient et exprime le tout**.

    **« Toutes choses ensemble » (`homou panta`).** Plotin reprend la formule d'Anaxagore pour dire comment les Formes coexistent. Mais il précise (V, 9 [5], 6) qu'elles sont **ensemble et pourtant distinctes** : ni juxtaposées dans un espace, ni mêlées en un mélange confus, chacune garde sa **puissance propre**.

    | Multiplicité | Les parties | Le tout |
    | sensible | hors les unes des autres | plus grand que chaque partie |
    | intelligible | chacune contient le tout | ni divisé ni diminué |

    **Deux images de Plotin.**
    - **La science et ses théorèmes** (IV, 9 [8], 5 ; V, 9, 6 ; VI, 2 [43], 20) : une science contient tous ses théorèmes à la fois, sans qu'ils se confondent. Penser un théorème, ce n'est pas détacher un morceau de la science, qui reste là tout entière, et le théorème la contient virtuellement.
    - **La semence** (V, 9, 6) : toutes les puissances du futur vivant y sont ensemble, ramassées « comme en un centre unique », chacune distincte (il y a déjà une raison propre de l'œil et des mains), sans occuper encore des lieux séparés ; elles ne s'écartent qu'en se déployant dans un corps.

    ! « Ensemble » ne veut pas dire « confondu » : sans distinction entre les Formes, il n'y aurait plus de multiplicité du tout, et l'Intellect se confondrait avec l'Un.
  points:
  - id: g-multiplicite-intelligible-l1-1
    sentence: "La multiplicité de l'Intellect est une composition intelligible où chaque Forme n'est pas un morceau séparé, mais contient et exprime le ___."
    answer: tout
    alt: ["Tout"]
  - id: g-multiplicite-intelligible-l1-2
    sentence: "Pour dire comment les Formes coexistent dans l'Intellect, Plotin reprend à ___ la formule « toutes choses ensemble » (`homou panta`)."
    answer: Anaxagore
    alt: ["anaxagore"]
  - id: g-multiplicite-intelligible-l1-3
    sentence: "Dans l'intelligible, les Formes sont, précise Plotin, ensemble et pourtant ___ (V, 9, 6) : ni juxtaposées dans l'espace, ni mêlées."
    answer: distinctes
