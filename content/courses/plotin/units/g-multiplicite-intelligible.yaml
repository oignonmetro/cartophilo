- id: g-multiplicite-intelligible-l3
  title: D'où vient la multiplicité intelligible
  notes: |-
    **Si l'Un est absolument simple, d'où vient que ce qui naît de lui soit multiple ?** La réponse tient dans le regard que ce qui naît porte sur son origine.

    __**Tout part de l'Un, qui reste immobile.**__ Selon la théorie des {violet}deux actes{/violet}, l'Un demeure en lui-même tout en laissant procéder une **puissance indéterminée** (la dyade indéterminée du [[traite10|traité 10]], chap. 5).

    __**La conversion fragmente.**__ Cette puissance se retourne vers sa source pour la contempler (*epistrophê*). Mais elle ne peut embrasser l'Un dans sa simplicité en un seul regard : {red}voulant tout posséder, elle brise la puissance une qu'elle reçoit en une pluralité de Formes déterminées{/red} ([[traite38|traité 38]], chap. 15-16 ; [[traite30|traité 30]], chap. 8 ; [[traite49|traité 49]], chap. 10-11). C'est là que naissent ensemble la dualité de ce qui pense et de ce qui est pensé, et la multiplicité des Formes. {coral}L'Intellect est ainsi « un Bien devenu varié » ([[traite38|traité 38]], chap. 15) : le Bien lui donne la multiplicité sans la posséder lui-même.{/coral}

    __**L'Altérité distingue, l'Identité rassemble.**__ L'Intellect contient les cinq **grands genres** du {sky}*Sophiste*{/sky} : être, mouvement, repos, identité, altérité (traités 42-44, VI, 1-3). {violet}L'**Altérité** (*heterotês*){/violet} distingue les Formes entre elles, et la pensée de son objet ; {teal}l'**Identité**{/teal} garantit la cohésion du tout. C'est encore l'altérité, non le lieu, qui fait la multiplicité des âmes ([[traite22|traité 22]], chap. 4).

    | Ce qui joue | Ce qu'il apporte |
    | la puissance indéterminée | ce qui procède de l'Un |
    | la conversion | la détermination par le regard |
    | l'Altérité | la distinction des Formes |
    | l'Identité | la cohésion du tout |

    ! La différence décisive avec le sensible : dans l'intelligible, ce qui distingue est l'**altérité** ; dans le sensible, ce qui sépare est le **lieu**, avec la masse.
  points:
