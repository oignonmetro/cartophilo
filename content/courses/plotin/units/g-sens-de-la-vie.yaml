lessons:
- id: g-sens-de-la-vie-l1
  title: Sens de la vie
  notes: |-
    Chez Plotin, le {violet}**sens de la vie**{/violet} est [def]. Il ne se trouve pas {pink}dans ce que l'on fait ici-bas{/pink}, mais dans ce que l'on voit : la vie a une fin, qui est là-bas, et une raison d'être ici.

    __**La fin de toute vie est la contemplation, et l'action n'en est qu'une ombre.**__ Plotin le pose pour tous les êtres : « toutes choses aspirent à la contemplation, que celle-ci est __la fin vers laquelle toutes tournent leur regard__ » ([[traite30|traité 30]], chap. 1 ; voir [[g-theoria|contemplation]]). Même celui qui agit ? Oui, car « toute action comporte un effort vers la contemplation » (*ibid*.). Celui qui agit veut un résultat, et ce résultat, il le veut pour l'avoir sous les yeux : « l'action est donc en vue de la contemplation et de l'objet de la contemplation, de sorte que __la contemplation est la fin que poursuivent également ceux qui agissent__ » (chap. 6) ; ils agissent « dans le but de le connaître et de le voir présent dans leur âme » (*ibid*.). Mais alors pourquoi agir, au lieu de voir directement ? Par faiblesse : « les hommes aussi, lorsque leur aptitude à contempler est affaiblie, font de leur action __une ombre de contemplation__ et de raisonnement. Parce que leur aptitude à contempler n'est pas suffisante, du fait de la faiblesse de leur âme, et parce qu'ils sont incapables de saisir suffisamment l'objet de leur vision et que pour cette raison ils n'en sont pas remplis mais aspirent à le voir, ils sont portés à l'action __afin de voir ce qu'ils ne pouvaient voir avec leur intellect__ » (chap. 4). L'action n'est donc pas vaine, mais elle est un détour : elle cherche au-dehors ce que l'âme n'a pas su voir en elle.

    __**La vie dans un corps n'a pas de valeur par elle-même : elle vaut par ce que l'âme y fait.**__ L'objection est naturelle : « si la vie est un bien, comment la mort pourrait-elle ne pas être un mal ? » ([[traite54|traité 54]], chap. 3). Plotin répond en séparant la vie de ce qui la rend bonne : la vie est bonne, mais « elle est un bien __non pas pour autant qu'elle est une union__, mais parce que, grâce à la vertu, elle écarte le mal » (*ibid*.). Ce qui a de la valeur n'est donc pas le fait d'être un vivant, uni à un corps ; c'est ce que l'âme accomplit pendant ce temps. D'où la formule la plus dure : « il faut dire que __cette vie dans un corps est par elle-même un mal__ ; mais que, grâce à la vertu, l'âme accède au Bien, parce qu'elle ne vit pas de la vie du composé » (*ibid*. ; voir [[g-mort|mort]]). La vie qui vaut, c'est la vie à laquelle rien ne manque : « si la vie bonne appartient à celui qui possède la vie dans sa plénitude – j'entends par là __l'être auquel rien de la vie ne manque__ –, alors le bonheur ne saurait appartenir qu'à celui qui vit dans la plénitude » ([[traite46|traité 46]], chap. 3), et « celui qui la possède en acte, nous disons précisément qu'il est heureux » (chap. 4 ; voir [[g-vie-parfaite|vie parfaite]] et [[g-bonheur|bonheur]]). Une vie plus longue vaut-elle davantage ? Non, puisque ce qui la rend bonne n'est pas une quantité : le bonheur « réside non dans le fait de dire que l'on est heureux, mais dans le fait d'être en une certaine disposition. Or, __c'est dans le présent qu'une disposition existe__ » ([[traite36|traité 36]], chap. 1), et « il ne faut donc pas mesurer cette vie à l'aune du temps, __mais à celle de l'éternité__ » (chap. 7).

    __**Le sens de la vie est un retour : notre patrie est là-bas, et l'âme l'a oubliée en voulant être à elle-même.**__ Si la fin est là-bas, c'est que nous en venons : « Fuyons vers notre chère patrie. » ; « __Notre patrie, c'est le lieu d'où nous sommes venus__, et notre père est là-bas » ([[traite1|traité 1]], chap. 8). Pourquoi l'avons-nous quittée ? Parce que les âmes ont voulu une vie à elles : l'origine du mal, pour elles, « c'est bien l'audace, la génération, l'altérité première et __le fait de vouloir s'appartenir à elles-mêmes__ » ([[traite10|traité 10]], chap. 1 ; voir [[g-tolma|audace]]). Le retour se fait comme Ulysse : « Prenons le large, comme le fit Ulysse, nous dit Homère – et il me semble alors parler par énigmes –, en quittant la magicienne Circé et Calypso parce qu'il __ne se plaisait pas à demeurer chez elles__, malgré tous les agréments dont sa vue jouissait et la fréquentation d'une abondante beauté sensible » ([[traite1|traité 1]], chap. 8). Ulysse ne quitte pas des lieux laids : il quitte des beautés qui le retiennent loin de chez lui, comme la beauté sensible retient l'âme. Mais ce voyage ne se fait pas en changeant de lieu : « __Ce n'est pas à pied qu'il te faut cheminer__, parce que les pieds transportent toujours d'une région de la terre à une autre. Ne va pas non plus préparer un attelage ou un quelconque navire, mais laisse tout cela et une fois que tu auras fermé les yeux, échange cette manière de voir pour une autre et réveille cette vision que tout le monde possède, mais dont peu font usage » (*ibid*. ; voir [[g-epistrophe|conversion]]). Le terme du voyage, c'est la vie des dieux : « être libéré des choses d'ici-bas, vivre sans trouver son plaisir dans les choses d'ici-bas, __fuir seul vers lui seul__ » ([[traite9|traité 9]], chap. 11).

    __**Pourtant la venue de l'âme ici-bas a un sens : elle achève l'univers.**__ Si la fin est là-bas, la vie d'ici serait-elle une erreur ? Non, car l'univers sensible devait être complet : l'âme du monde a été envoyée en lui par le dieu, « ainsi que les âmes de chacun de nous __afin que cet univers fût parfait__, puisqu'il fallait qu'il existât dans le monde sensible « les mêmes genres d'êtres vivants que dans le monde intelligible, et en nombre égal » » ([[traite6|traité 6]], chap. 1). Pourquoi fallait-il ? Parce que chaque âme a le pouvoir de produire, et qu'un pouvoir qui ne s'exerce jamais resterait caché : « il ne faut pas qu'existent seulement des âmes, sans que les objets qu'elles font naître ne deviennent visibles, s'il est vrai qu'en chacune existe par nature __la capacité de produire ce qui est après elle__ » (chap. 6). La descente est donc nécessaire ; elle est aussi une faute, et Plotin tient les deux ensemble, car « __le volontaire est justement compris dans la nécessité__ » (chap. 5) : « toute chose va vers le pire involontairement, mais puisqu'elle y va cependant de son propre mouvement, on dit qu'en subissant l'influence de ce qui lui est inférieur, elle reçoit une condamnation conforme à ce qu'elle a fait » (*ibid*.). L'homme a ainsi sa place dans le tout : il « est un beau produit, aussi beau qu'il peut l'être, et, bien que tissé dans la trame de l'univers, __il a un destin supérieur__ à celui des autres êtres vivants qui peuplent la terre » ([[traite47|traité 47]], chap. 9). C'est pourquoi on ne doit pas mépriser le monde, comme les gnostiques : ils ignorent « qu'il ne faut pas injurier celles qui sont inférieures aux premières, mais __accepter toutes choses avec mansuétude__ » ([[traite33|traité 33]], chap. 13).

    __**Fuir d'ici, c'est devenir semblable au dieu sans quitter la terre.**__ Le mot d'ordre est de Platon : il faut fuir d'ici. Mais « la fuite, dit-il, ne consiste pas à quitter la terre, mais à vivre sur terre en étant « juste et pieux » avec « réflexion », ce qui veut dire __qu'il faut fuir le vice__ » ([[traite51|traité 51]], chap. 6) ; « on ne fuit pas en changeant de lieu, à ce qu'il dit, mais __en acquérant la vertu__ et en se séparant du corps » (chap. 7). Ce n'est pas non plus le suicide, qui fait sortir l'âme chargée de la passion qui l'a poussée (voir [[g-suicide|suicide]]). Fuir, c'est se rendre semblable : « – En quoi consiste donc cette fuite ? – __À se rendre, dit-il, semblable au dieu__. Et cela advient « si nous devenons justes et pieux avec réflexion », et de façon générale si nous sommes dans la vertu » ([[traite19|traité 19]], chap. 1 ; voir [[g-homoiosis|assimilation]]). Semblable au dieu, et non à l'homme de bien, car ce serait se modeler sur une copie : « c'est à eux, et non aux hommes de bien, qu'il faut devenir semblables. L'assimilation à ces hommes-là, c'est comme celle qui existe __entre une image et une autre image__, toutes deux du même objet ; mais l'autre assimilation est celle qui se porte vers un être différent comme vers un modèle » (chap. 7). Celui qui n'a eu que la vertu de l'action garde un pied en bas : l'Héraclès « qui se trouve dans l'Hadès peut encore parler de sa bravoure, mais il estime que __c'est là peu de chose__ quand il a changé de demeure pour s'établir dans un lieu plus saint » ([[traite27|traité 27]], chap. 32).

    | Ce qu'on croit | Ce que dit Plotin |
    | l'action est la fin de la vie | l'action est une ombre de contemplation |
    | vivre est un bien par soi | la vie vaut par la vertu, non comme union |
    | la descente de l'âme est une erreur | elle achève l'univers, volontaire et nécessaire |
    | fuir, c'est quitter la terre | fuir, c'est fuir le vice |
    | le modèle est l'homme de bien | le modèle est le dieu |

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 1, chap. 8 | notre patrie est là-bas ; Ulysse ; pas à pied |
    | traité 6, chap. 1 | les âmes envoyées pour que l'univers soit parfait |
    | traité 6, chap. 5 | le volontaire compris dans la nécessité |
    | traité 19, chap. 7 | ressembler au dieu, non à l'homme de bien |
    | traité 30, chap. 4 | l'action, une ombre de contemplation |
    | traité 30, chap. 6 | celui qui agit veut voir |
    | traité 51, chap. 6 | fuir, ce n'est pas quitter la terre |
    | traité 54, chap. 3 | la vie bonne non comme union, mais par la vertu |

