- id: traite11-l4
  title: "Contre la dispersion : une longue vie continue"
  notes: |-
    **Une objection, au nom par exemple de la doctrine stoïcienne** d'un principe divin unique : la procession de Plotin multiplie les principes et les niveaux de réalité, dans une hiérarchie qui semble conduire chacun à se dissiper, par dégradation, jusqu'à la matière, au sensible et au mal.

    **La réponse : un unique processus gouverne la production de toutes choses, inchangé à chaque niveau** (traités 7 et 10, chap. 5-7) :

    1. toute réalité parvenue à sa perfection engendre par nécessité ;
    2. l'engendré, d'abord indéterminé, a besoin de son principe et se tourne vers lui ;
    3. ce retour, cette **« conversion » (`epistrophḗ`)**, le détermine : il devient une image de son principe.

    | Ce qu'on craint | Ce qu'il en est |
    | une multiplicité de principes | chacun est l'image de celui qui le précède et le modèle de celui qu'il engendre |
    | une dispersion des principes | chacun est la trace de celui qui l'a produit et imprime sa marque à celui qu'il produit |

    **Rien ne se perd, tout se conserve.** La métaphore finale le dit : **« C'est donc comme une longue vie qui s'étend dans sa longueur : chaque partie est différente de celle qui la suit, mais l'ensemble est continu »** (2, 26-28).

    **Les traités 10 et 11 forment un ensemble**, sur la succession des réalités de l'Un à l'Âme, et ne font qu'allusion aux degrés inférieurs, les corps et la matière. Le traité 6 (IV, 8), chap. 8, en parlait déjà ; l'engendrement de la matière, des corps et du mal sera examiné à partir du traité **12 (II, 4)**, puis en 15 (III, 4), 1-2, et 28 (IV, 4), 22.

    ! La hiérarchie n'est pas une suite de coupures : chaque niveau est différent du suivant, mais le tout est continu, comme les âges d'une même vie.
