- id: traite11-l2
  title: "L'Âme engendre une image d'elle-même"
  notes: |-
    **Avec l'Âme, la génération change de nature.** L'Intellect et l'Un engendrent en restant en eux-mêmes ; **l'Âme, elle, ne produit pas en restant en elle-même** : une fois mise en mouvement, elle engendre une image (1, 18-22).

    - **En regardant là-bas**, d'où elle vient, elle est remplie.
    - **En avançant dans la direction opposée**, par un choix libre dont le traité 10 (V, 1), chap. 1, a rendu raison, elle engendre une image d'elle-même : **la sensation et la nature qui est dans les plantes**.

    Elle n'engendre donc pas une autre réalité, mais **ses propres facultés inférieures** : seule l'Âme rationnelle est produite par l'Intellect ; c'est l'Âme elle-même qui, descendant, engendre ses facultés sensible et végétative.

    **L'Âme est présente dans les corps selon la faculté qui domine** (2, 4-10) :

    | Vivant | Ce qui y a conduit l'Âme |
    | la plante | la partie la plus **« audacieuse »** et la plus imprudente, la végétative |
    | l'être irrationnel | la faculté sensible, qui domine |
    | l'homme | la partie rationnelle, ou l'Intellect dont elle dérive |

    **« Rien n'est séparé ni coupé de ce qui le précède »** (1, 21-22) : c'est pourquoi l'Âme de là-haut semble parvenir jusqu'aux plantes. Elle n'y est pas tout entière, mais ce qui est dans les plantes lui appartient.

    ! L'Âme ne se coupe pas d'elle-même en descendant : la nature des plantes est une image d'elle, qui lui reste attachée.
