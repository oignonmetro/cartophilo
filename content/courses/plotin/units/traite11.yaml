id: traite11
title: "Traité 11 (V, 2) : Sur la génération et le rang des choses qui sont après le premier"
subtitle: "Une procession sans rupture"
icon: compass
color: sky
lessons:
- id: traite11-l1
  title: "La première génération : surabondance et retour"
  notes: |-
    **Le traité 11 prolonge le traité 10 (V, 1)** : après l'examen des trois réalités et de leur génération, il en tire les conséquences, pour souligner que la **« tripartition »** du réel n'implique **aucune rupture ontologique**.

    **Il s'ouvre sur une formule : « L'Un est toutes choses et il n'est aucune d'elles »** (1, 1). Principe de toutes choses, il n'est aucune d'elles. Mais comment le multiple vient-il de ce qui n'a en soi ni altérité ni dualité ? **C'est justement parce que rien n'était en lui que toutes choses sont venues de lui** : il n'est pas ce qui est, mais ce qui engendre ce qui est.

    **La « première génération »** (1, 3-13) :

    1. L'Un est parfait : il ne cherche rien, n'a rien, n'a besoin de rien ; il est **« comme surabondant »**, et sa surabondance produit autre chose.
    2. L'engendré, encore indéterminé, **se tourne vers lui** et en est rempli, comme le petit enfant a besoin de son père jusqu'à l'âge de l'autonomie.
    3. En fixant son regard sur lui, il devient l'Intellect :

    | Ce qui le constitue | D'où cela vient |
    | l'être | sa position de repos orientée vers l'Un |
    | l'Intellect, la pensée | la vision de l'Un |

    **L'Intellect, image de l'Un, produit de la même manière** : il épanche une puissance multiple, et cet acte engendre l'**Âme**, alors qu'il reste en lui-même (1, 13-18).

    ! Ni l'Un ni l'Intellect ne produisent par un acte volontaire : la génération vient de leur surabondance, et ils restent en eux-mêmes.
