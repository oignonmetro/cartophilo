- id: traite11-l5
  title: "Repérage : le plan du traité 11"
  notes: |-
    **Le traité 11 décrit d'abord la procession, de l'Un à l'Âme (chap. 1), puis ses modalités, de l'Âme jusqu'aux plantes (chap. 2).**

    | Moment | Lieu | Ce qui s'y joue |
    | l'Un est toutes choses et aucune | 1, 1-3 | principe de tout, il n'est rien de tout |
    | la première génération | 1, 3-13 | surabondance ; l'Intellect et l'être |
    | l'Intellect produit l'Âme | 1, 13-21 | l'Âme produit une image d'elle-même |
    | aucune coupure | 1, 21-28 | l'Âme parvient jusqu'aux plantes |
    | l'engendré inférieur, en contact | 2, 1-4 | une procession du premier au dernier |
    | plante, animal, homme | 2, 4-10 | la faculté qui domine |
    | aucun déplacement local | 2, 10-24 | couper une plante |
    | une longue vie continue | 2, 24-31 | chaque partie garde l'image de la précédente |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! L'exemple de la plante coupée (2, 10-24) précède la métaphore de la longue vie : il en est la preuve.
