- id: traite11-l3
  title: "Couper une plante : l'âme n'est en aucun lieu"
  notes: |-
    **Le chapitre 2 pose une procession « du premier au dernier »** : chaque chose reste dans sa position naturelle, l'engendré occupe une position inférieure, mais **il devient identique à ce dont il dérive, tant qu'il est en contact avec lui** (2, 1-4).

    **L'exemple de la plante** (2, 10-24) :

    - Si l'on coupe les rejetons ou les branches, où va l'âme qui s'y trouvait ? **Là d'où elle est venue**, car elle ne s'en est pas localement éloignée.
    - Si l'on coupe ou brûle la racine ? **En l'Âme**, parce qu'elle n'a pas changé de lieu. Ou bien elle remonte dans la faculté qui la précède, ou bien elle passe dans une autre plante.
    - Et cette faculté-là ? En celle qui la précède, jusqu'à l'Intellect, mais **non localement**.

    **« N'étant donc en aucun lieu, mais en ce qui n'est en aucun lieu, elle est ainsi partout »** (2, 20-21). Les « déplacements » de l'âme n'en sont pas : ses facultés sont toujours déjà dans tous les corps. Si elle s'arrête à mi-chemin dans sa remontée, elle a une **vie intermédiaire**.

    **Toutes ces choses coïncident avec l'Un et ne coïncident pas avec lui** : elles coïncident parce qu'elles dérivent de lui, elles ne coïncident pas parce qu'il leur a donné l'existence en restant en lui-même.

    Le traité s'arrête sur une question renvoyée à plus tard : l'âme des plantes engendre-t-elle ? Elle engendre ce en quoi elle se trouve ; mais il faut l'examiner **« en prenant un autre point de départ »**.

    ! Que la plante meure ne fait rien perdre à l'âme : elle n'a jamais été dans la plante comme dans un lieu.
