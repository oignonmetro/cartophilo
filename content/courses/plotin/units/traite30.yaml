- id: traite30-l4
  title: "L'Intellect contemple l'Un"
  notes: |-
    **Dans l'Intellect, sujet et objet de la contemplation forment d'emblée une unité** (chap. 8) : non par appropriation, comme dans l'âme la meilleure, mais par leur réalité même, car **« être et penser, c'est la même chose »** (Parménide). L'Intellect est **une contemplation vivante**, la première vie.

    - **Toute vie est une intellection**, plus ou moins obscure : intellection végétative, sensitive, psychique ; la première vie est l'Intellect premier et un.
    - **Comment l'un devient multiple** : contemplant l'Un, l'Intellect ne le contemple pas en tant qu'un ; il est devenu multiple, **« comme s'il avait été alourdi »**, en désirant posséder toutes choses, comme **un cercle qui se déploie lui-même**.

    **Ce qui est au-delà de l'Intellect** (chap. 9) : l'Intellect est nombre, et deux (intellect et intelligible) ; il faut donc avant lui ce qui est un. Nous le saisissons par **ce qui en nous lui est semblable**, comme chacun reçoit tout entier un son qui emplit un lieu. L'Intellect doit pour cela **revenir en arrière** : il a deux visages.

    **Qu'est-ce que l'Un ?** (chap. 10) **« La puissance de toutes choses »**, sans laquelle rien n'existerait. Deux images :

    | Image | Ce qu'elle montre |
    | une source qui se donne à tous les fleuves sans s'épuiser | le principe reste en lui-même |
    | la vie d'une plante gigantesque, fixée dans sa racine | le principe n'est pas multiplicité, mais principe de la multiplicité |

    On ne peut rien lui attribuer, ni l'existence, ni la réalité, ni la vie : **si tu le saisis en ayant retranché l'être**, tu t'en trouveras émerveillé.

    **Le Bien n'a besoin de rien** (chap. 11) : en disant « le Bien », n'y ajoute rien, **pas même l'intellection**. L'Intellect, qui le désire toujours, prend la forme du Bien : il en porte **une trace**. Comme celui qui voit les astres pense à celui qui les a produits, celui qui contemple le monde intelligible doit chercher qui a engendré **ce beau garçon** qu'est l'Intellect.

    ! L'Un ne contemple pas : il est ce que toutes choses contemplent, la fin de toute la remontée.
