- id: traite30-l3
  title: "L'âme : agir, c'est contempler par un détour"
  notes: |-
    **L'âme tout entière contemple** (chap. 5-6). Remplie de son savoir, elle produit un autre objet de contemplation, comme une technique accomplie produit chez l'enfant une technique en miniature.

    - **La partie supérieure de l'âme demeure là-haut**, illuminée ; une autre partie s'avance, sans abandonner la première. **Toute activité de l'âme est contemplation**, l'une plus faible que l'autre : l'action qui semble résulter de la contemplation est la contemplation la plus faible.
    - **Le cocher** transmet aux chevaux quelque chose de ce qu'il voit ; n'en recevant qu'une part, ils ont de l'appétit pour ce qu'ils ont vu, et agissent en vue de ce qu'ils désirent.

    **L'action est en vue de la contemplation** (chap. 6) : ce que ceux qui agissent ne peuvent atteindre directement, **ils l'atteignent par un détour**. Ils agissent pour connaître le bien et le posséder **dans leur âme**, comme **une raison silencieuse**. Plus la contemplation est ferme, plus elle est tranquille, et plus ce qui connaît va vers l'unité avec ce qu'il connaît. **Le sage** a déjà achevé son raisonnement quand il le manifeste à un autre : en lui-même, il est vision.

    **Le cœur du traité** (chap. 7) : **toutes les réalités véritables proviennent de la contemplation et sont une contemplation** ; tout ce qu'elles engendrent est objet de contemplation. Produire, c'est faire advenir une forme : engendrer est **« une douleur d'enfantement »**. Les défauts viennent de ce que ceux qui contemplent s'écartent de leur objet : ainsi **le mauvais technicien** produit des formes laides. Et **les amants** regardent une forme et s'efforcent de l'atteindre.

    | Degré | Contemplation |
    | la nature | silencieuse et obscure, elle produit des corps |
    | l'action humaine | affaiblie, elle cherche à voir par un détour |
    | l'âme du sage | tranquille, elle est vision |

    ! L'action n'est pas condamnée : elle est déjà une contemplation, mais la plus faible, qui cherche dehors ce qu'elle n'a pas su voir dedans.
  points:
