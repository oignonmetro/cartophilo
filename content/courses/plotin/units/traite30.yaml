- id: traite30-l2
  title: "La nature contemple et parle"
  notes: |-
    **La nature est la faculté la plus descendue de l'âme du monde, sa faculté végétative.** Comment pourrait-elle contempler, elle qu'on dit dépourvue de représentation et de raison ?

    - **Ni mains, ni leviers** (chap. 2) : la nature n'a ni mains ni pieds ni instrument ; quelle poussée produirait tant de couleurs et de figures ? Même les **modeleurs de cire**, à qui on la compare, doivent prendre leurs couleurs ailleurs.
    - **Une raison immobile** : en tout producteur, quelque chose demeure immuable ; ce qui est en mouvement, c'est la matière. **La nature est une forme et une raison**, non un composé de matière et de forme. La raison qui correspond à la figure visible est **la dernière**, morte : elle ne produit plus rien.
    - **Produire, pour elle, c'est être ce qu'elle est** (chap. 3) : elle produit parce qu'elle est contemplation, résultat de contemplation et raison.

    **La prosopopée de la nature** (chap. 4, 1-14) :

    > « Tu ne devrais pas poser de question mais comprendre toi aussi en silence, tout comme moi je garde le silence. »

    Ce qui naît, dit-elle, **« c'est le résultat de ce que je vois »** : elle contemple, et les contours des corps apparaissent **comme s'ils tombaient d'elle**, à la manière dont les géomètres tracent leurs figures en contemplant.

    **Une contemplation affaiblie** (chap. 4, 14-fin) : sa compréhension est celle d'**un homme profondément endormi** par rapport à un homme éveillé ; aussi ses produits sont-ils faibles. De même, **les hommes trop faibles pour contempler agissent**, pour voir ce qu'ils ne peuvent voir par l'intellect ; ainsi **les enfants attardés** se tournent vers les techniques.

    ! La prosopopée ne fait pas du traité 30 un traité sur la nature : elle n'est qu'une étape de la démonstration que tout contemple.
