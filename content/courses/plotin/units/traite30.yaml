- id: traite30-l5
  title: "Repérage : le plan du traité 30"
  notes: |-
    **Le traité 30 remonte de la nature à l'âme, puis à l'Intellect, qui contemple l'Un.**

    | Moment | Lieu | Ce qui s'y joue |
    | la thèse : tout aspire à la contemplation | 1, 1-18 | si nous commençons par nous amuser |
    | la nature reste immuable | 1, 18-2, 19 | ni mains ni leviers |
    | la nature, forme et raison, produit | 2, 19-fin | la raison dernière est morte |
    | elle produit parce qu'elle contemple | chap. 3 | produire, c'est être ce qu'elle est |
    | la prosopopée de la nature | 4, 1-14 | comprendre en silence |
    | une contemplation affaiblie | 4, 14-fin | l'homme endormi ; les enfants attardés |
    | l'âme tout entière contemple | chap. 5-6 | le cocher ; le détour de l'action |
    | toutes les réalités véritables contemplent | chap. 7 | une douleur d'enfantement |
    | l'Intellect, première contemplation vivante | chap. 8 | être et penser, la même chose |
    | comment l'Intellect contemple | 9, 1-39 | le premier, au-delà de l'Intellect |
    | l'Un, principe de toutes choses | 9, 39-fin | plus simple que ce qu'il engendre |
    | l'Un, puissance de toutes choses | chap. 10 | la source et les fleuves |
    | l'Intellect désire et atteint le Bien | chap. 11 | le beau garçon |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! Le chapitre 7 est le cœur du traité : toutes les réalités véritables proviennent de la contemplation et sont une contemplation.
