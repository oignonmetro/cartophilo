lessons:
- id: traite30-l1
  title: "Tout contemple : une introduction à Plotin"
  notes: |-
    **Le traité 30 considère toutes les réalités sous l'aspect de la contemplation (`theōría`), qui est à la fois leur activité commune et leur fin.** Sa thèse est on ne peut plus simple : **toute existence contemple ce dont elle est issue, et, en contemplant, se parfait et engendre à son tour.**

    **Un traité de synthèse** : Émile Bréhier y voyait **« la production la plus caractéristique et peut-être la plus achevée »** de Plotin. Rédigé après les vingt-neuf premiers traités, il en résume les thèses principales : c'est une sorte d'**introduction à sa propre philosophie**. Il forme avec les traités 31, 32 et 33 un ensemble contemporain, que certains ont cru un seul « grand traité » démembré par Porphyre, hypothèse que l'édition juge peu probable.

    **La contemplation explique les deux mouvements de la réalité** :

    | Mouvement | Ce qu'en dit la contemplation |
    | la procession | une réalité qui contemple produit, du fait même de sa contemplation |
    | le retour | chaque réalité trouve sa fin dans la contemplation de ce qui l'a engendrée |

    **Une provocation** : chez Platon et Aristote, la contemplation est l'activité humaine la plus haute, celle qui rapproche l'homme du dieu, distinguée de l'action et de la production (*Éthique à Nicomaque*, X). Plotin l'étend à tout ce qui existe, et **identifie l'action et la production à des formes affaiblies de contemplation**.

    **Le début du traité** (1, 1-18) est un jeu : « si nous commençons par nous amuser », en disant que toutes choses aspirent à la contemplation, la terre et les plantes comprises. Mais celui qui s'amuse contemple aussi ; et **toute action comporte un effort vers la contemplation**.

    ! La contemplation n'est pas ici l'opposé de l'action et de la production : elle en est la source et la fin.
