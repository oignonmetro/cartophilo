  points:
  - id: g-beaute-l1-q1
    sentence: "La beauté, que Plotin ne réduit pas à la proportion des parties, se dit en grec translittéré ___."
    answer: kallos
    alt: ["kállos"]
  - id: g-beaute-l1-q2
    sentence: "Contre la beauté-proportion : « le même visage apparaît beau et puis, après, ne l'est plus alors que ses ___ sont restées les mêmes » (traité 1, chap. 1)."
    answer: proportions
    alt: []
  - id: g-beaute-l1-q4
    sentence: "« La Forme s'approche, réunit des parties multiples pour qu'elles ne soient plus qu'un ___ » (traité 1, chap. 2)."
    answer: tout
    alt: []
  - id: g-beaute-l1-q6
    sentence: "« Les arts ne se bornent pas à imiter ce qu'on voit, mais qu'ils sont à la poursuite des ___ dont est faite la nature » (traité 31, chap. 1)."
    answer: raisons
    alt: []
  - id: g-beaute-l1-q7
    sentence: "Pour montrer que l'art remonte aux raisons, Plotin prend l'exemple du sculpteur ___, qui a saisi son Zeus « tel qu'il serait s'il consentait à paraître à nos regards » (traité 31, chap. 1)."
    answer: Phidias
    alt: []
  - id: g-amant-l4-q1
    sentence: "Un visage vivant attire plus qu'une belle ___ : la beauté n'est donc pas la proportion (traité 38, chap. 22)."
    answer: statue
    alt: []
  - id: g-amant-l4-q2
    sentence: "« Il faut dire que la beauté est plutôt ce qui ___ sur la proportion que la proportion elle-même, et que c'est cela qui est aimable » (traité 38, chap. 22, l. 24-26)."
    answer: resplendit
    alt: []
  - id: g-amant-l4-q3
    sentence: "« Il faut dire que la beauté est plutôt ce qui resplendit sur la proportion que la proportion elle-même, et que c'est cela qui est ___ » (traité 38, chap. 22, l. 24-26)."
    answer: aimable
    alt: []
  - id: g-amant-l4-q4
    sentence: "« L'âme donc en recevant en elle un effluve venu d'en haut est émue, elle est saisie d'un transport ___, elle est remplie des fureurs du désir, et c'est ainsi que naît l'amour » (traité 38, chap. 22, l. 7-10)."
    answer: bachique
    alt: []
  - id: g-amant-l4-q5
    sentence: "« L'âme donc en recevant en elle un ___ venu d'en haut est émue, elle est saisie d'un transport bachique » (traité 38, chap. 22, l. 7-10)."
    answer: effluve
    alt: []
  - id: g-amant-l4-4
    sentence: "Le principe n'est ni une forme ni l'ensemble des formes : il est le « ___ », et c'est pourquoi il suscite un amour illimité (traité 38, chap. 32-33)."
    answer: sans forme
    alt: ["sans-forme"]
  - id: g-amant-l4-q6
    sentence: "Une forme a une mesure, et un amour qui s'y arrêterait serait mesuré : c'est pourquoi le sans-forme suscite un amour ___ (traité 38, chap. 32-33)."
    answer: illimité
    alt: ["illimite"]
  - id: g-beaute-l1-q8
    sentence: "Le Bien, sans forme, n'est pas beau comme une forme : « sa beauté est beauté dans un autre sens, c'est une beauté au-delà de la ___ » (traité 38, chap. 32)."
    answer: beauté
    alt: ["beaute"]
  - id: g-amant-l2-q2
    sentence: "« Celui qui voit, en effet, doit s'être rendu apparenté et ___ à ce qui est vu, pour parvenir à la contemplation » (traité 1, chap. 9, l. 29-30)."
    answer: semblable
    alt: []
  - id: g-amant-l2-7
    sentence: "« Jamais l'œil ne verrait le soleil sans être devenu de la même nature que le soleil, et l'âme ne pourrait voir le beau, sans être devenue ___ » (traité 1, chap. 9)."
    answer: belle
    alt: []
  - id: g-amant-l2-q3
    sentence: "« Assurément, jamais l'œil ne verrait le soleil sans être devenu ___ que le soleil » (traité 1, chap. 9, l. 30-31)."
    answer: de la même nature
    alt: ["de la meme nature"]
  - id: g-amant-l2-q4
    sentence: "Le principe dont dépend l'éducation de l'amant est celui de la ___ : on ne connaît que ce à quoi on s'est rendu semblable."
    answer: parenté
    alt: ["parente"]
  - id: g-amant-l2-9
    sentence: "Puisque l'âme ne voit le beau qu'en devenant belle, Plotin demande à chacun de tailler et polir sa propre ___ intérieure (traité 1, chap. 9)."
    answer: statue
    alt: []
  - id: g-unite-l3-4
    sentence: "Plotin récuse la thèse stoïcienne selon laquelle la beauté serait la ___ des parties, car elle ne rendrait pas compte de la beauté des choses simples (traité 1, chap. 1)."
    answer: symétrie
    alt: ["symetrie", "symmetria"]
  - id: g-unite-l3-q1
    sentence: "Si la beauté était la symétrie des parties, les choses ___ (l'or, l'éclair dans la nuit, la lumière du soleil, un son simple) ne pourraient être belles, puisqu'elles n'ont pas de parties à proportionner (traité 1, chap. 1)."
    answer: simples
    alt: []
  - id: g-unite-l3-5
    sentence: "La beauté sensible naît de la domination d'une ___ sur la matière (traité 1, chap. 2-3), comme la maison est belle parce qu'elle fait passer dans le sensible l'idée de l'architecte."
    answer: forme
    alt: ["Forme", "eidos"]
  - id: g-unite-l3-6
    sentence: "Un visage ou un accord nous saisit parce que notre âme y reconnaît une trace de sa propre ___ intelligible."
    answer: nature
    alt: []
  - id: g-unite-l3-7
    sentence: "Le laid est ce que la forme et la raison n'ont pas réussi à ___ (I, 6, 2 et 5) : un défaut de configuration, non une réalité positive."
    answer: maîtriser
    alt: ["maitriser", "dominer"]
