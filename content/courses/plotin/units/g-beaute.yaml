id: g-beaute
title: Beauté (`kallos`)
icon: book
color: coral
lessons:
- id: g-beaute-l1
  title: Beauté
  notes: |-
    Chez Plotin, la {violet}**beauté**{/violet} (*kallos*) est [def]. Elle n'est pas {pink}la proportion des parties{/pink}.

    __**La beauté n'est pas la proportion.**__ Presque tout le monde la définit par la proportion des parties et l'agrément des couleurs. Plotin objecte au [[traite1|traité 1]] (chap. 1) que, dans ce cas, rien de simple ne serait beau : or « comment l'or est-il beau ? Et comment se fait-il que, la nuit, __l'éclair et les astres__ apparaissent beaux ? ». Surtout, « le même visage apparaît beau et puis, après, ne l'est plus alors que __ses proportions sont restées les mêmes__ » : il faut donc que « la beauté soit autre chose que la proportion ». **Si la beauté changeait avec la proportion, elle ne pourrait varier quand la proportion ne varie pas.**

    __**Elle est la forme qui unifie.**__ Ce qui rend beau un corps, c'est une [[g-eidos|forme]] : « La Forme s'approche, __réunit des parties multiples__ pour qu'elles ne soient plus qu'un tout » (chap. 2). Inversement, « est laid aussi ce qui n'a pas été dominé par la figure et la raison, __la matière n'ayant pas accepté de se laisser complètement configurer__ par la Forme ». **La laideur n'est donc pas une forme de plus, mais un défaut de forme.** Et si l'âme est émue par le beau, c'est qu'elle y reconnaît « quelque chose qui est __apparenté à la nature qu'elle a__ » : elle s'y retrouve.

    __**L'art ne copie pas : il remonte aux raisons.**__ Contre le mépris platonicien des arts, Plotin soutient que « les arts ne se bornent pas à imiter ce qu'on voit, mais qu'ils sont __à la poursuite des raisons__ dont est faite la nature » ([[traite31|traité 31]], chap. 1). Ainsi « ce n'est pas pour avoir contemplé quelque chose de sensible que Phidias a sculpté son Zeus, mais parce qu'il l'a saisi __tel qu'il serait s'il consentait à paraître__ à nos regards ».

    __**La lumière sur la forme : ce qui rend aimable.**__ Pourquoi un visage vivant, même laid, attire-t-il plus qu'une belle statue ? Si la beauté était la proportion, la statue l'emporterait. Il faut donc dire que « la beauté est plutôt __ce qui resplendit sur la proportion__ que la proportion elle-même, et que c'est cela qui est aimable » ([[traite38|traité 38]], chap. 22). Ce qui manque à la statue, c'est la vie, la grâce que le Bien répand sur la forme ; quand l'âme la reçoit, « en recevant en elle un effluve venu d'en haut est émue, elle est saisie d'un transport bachique ». Le Bien lui-même n'est pas une forme belle : il est le {violet}« sans forme »{/violet}, et « sa beauté est beauté dans un autre sens, c'est __une beauté au-delà de la beauté__ » (chap. 32). D'où un amour sans mesure : une forme a une mesure, le sans-forme n'en a pas.

    __**On ne voit le beau qu'en devenant beau.**__ « Celui qui voit, en effet, doit s'être rendu __apparenté et semblable à ce qui est vu__, pour parvenir à la contemplation. Assurément, jamais l'œil ne verrait le soleil sans être devenu de la même nature que le soleil, et l'âme ne pourrait voir le beau, sans être devenue belle » ([[traite1|traité 1]], chap. 9). D'où la consigne : « __Ne cesse de sculpter ta propre statue__ jusqu'à ce que brille en toi la splendeur divine de la vertu ».

    ! La beauté n'est pas affaire de goût : l'âme la reconnaît parce qu'elle lui est apparentée, et la laideur la repousse « comme d'une chose qui ne lui correspond pas ».

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 1, chap. 1 | la beauté n'est pas la proportion |
    | traité 1, chap. 2 | la forme qui unifie, la laideur comme défaut |
    | traité 1, chap. 9 | voir le beau en devenant beau |
    | traité 31, chap. 1 | l'art remonte aux raisons : Phidias |
    | traité 38, chap. 22 | ce qui resplendit sur la proportion |
    | traité 38, chap. 32 | une beauté au-delà de la beauté |

    **Voir aussi** : [[g-amant|Amant]] · [[g-amour|Amour]] · [[g-desir|Désir]] · [[g-intellect|Intellect]] · [[g-un|Un]] · [[traite1|Traité 1]]
