  points:
  - id: g-aisthesis-l1-q1
    sentence: "L'activité par laquelle l'âme juge des corps à distance, et non une empreinte qu'ils laisseraient en elle, se dit en grec translittéré ___."
    answer: aisthêsis
    alt: ["aisthesis", "aísthêsis"]
  - id: g-aisthesis-l1-q2
    sentence: "« Nous disons que les sensations ne sont ni des empreintes ni des ___ gravées dans l'âme » (traité 41, chap. 1)."
    answer: marques
    alt: []
  - id: g-aisthesis-l1-q3
    sentence: "Aucune empreinte n'arrive dans l'âme, « pas plus qu'elle ne saisit de marque semblable à celle d'un cachet dans la ___ » (traité 41, chap. 1)."
    answer: cire
    alt: []
  - id: g-aisthesis-l1-q4
    sentence: "« Si en effet nous saisissions des empreintes de ce que nous voyons, il ne serait pas possible de regarder cela même que nous voyons, mais seulement des images et des ___ des objets vus » (traité 41, chap. 1)."
    answer: ombres
    alt: []
  - id: g-aisthesis-l1-q5
    sentence: "« Il faut en effet, en outre, que ce qui voit et ce qui est vu soient ___ choses » (traité 41, chap. 1)."
    answer: deux
    alt: []
  - id: g-aisthesis-l1-q6
    sentence: "« Ce qui caractérise en effet sa puissance, ce n'est pas de ___ quelque chose, mais d'accomplir sa puissance et la tâche qui lui a été assignée » (traité 41, chap. 2)."
    answer: subir
    alt: []
  - id: g-aisthesis-l1-q7
    sentence: "« Ce qui lui a été donné, c'est de dominer et non pas d'être ___ » (traité 41, chap. 2)."
    answer: dominé
    alt: ["domine"]
  - id: g-aisthesis-l1-q8
    sentence: "Pour l'ouïe, « la puissance, c'est-à-dire la réalité de l'âme, ___, pour ainsi dire, les empreintes tracées dans l'air » (traité 41, chap. 2)."
    answer: lit
    alt: []
  - id: g-aisthesis-l1-q9
    sentence: "Dans le goût et l'odorat, les sensations « sont des connaissances de ces affections, et ils sont autre chose que les ___ elles-mêmes » (traité 41, chap. 2)."
    answer: affections
    alt: []
  - id: g-aisthesis-l1-q10
    sentence: "L'âme perçoit ce qu'elle ne contient pas, car « en un certain sens elle est ___ des sensibles » (traité 41, chap. 3)."
    answer: grosse
    alt: []
  - id: g-aisthesis-l1-q11
    sentence: "Les impressions sont déjà intelligibles, « de telle sorte que la sensation de ce qui est extérieur est l'___ de cette perception » (traité 53, chap. 7)."
    answer: image
    alt: []
  - id: g-aisthesis-l1-q12
    sentence: "Le traité de Plotin *Sur la sensation et la mémoire*, qui refuse que les sensations soient des empreintes, est le traité ___."
    answer: 41 (IV, 6)
    alt: ["41", "IV, 6"]
