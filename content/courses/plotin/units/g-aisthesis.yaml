# était vide). Citations vérifiées sur la GF (IV, 6, 1-3 ; I, 1, 6-7). Que
# ce soit le vivant qui sente a ses cartes dans l'entrée Vivant.

id: g-aisthesis
title: Sensation (`aisthêsis`)
icon: book
color: teal
lessons:
- id: g-aisthesis-l1
  title: Sensation
  notes: |-
    Chez Plotin, la {violet}**sensation**{/violet} (*aisthêsis*) est [def]. Elle n'est pas {pink}une marque que l'objet imprimerait dans l'âme, comme un cachet dans la cire{/pink}.

    __**Contre la sensation-**__{violet}__**empreinte**__{/violet}__**.**__ Pour les stoïciens, sentir, c'est recevoir dans l'âme l'empreinte de l'objet. Plotin pose au contraire « que les sensations __ne sont ni des empreintes ni des marques__ gravées dans l'âme » ([[traite41|traité 41]], chap. 1), et il en donne les raisons, tirées de la vue. {coral}Nous voyons à distance{/coral} : « l'âme regarde à l'extérieur », ce qui serait inutile si la forme de l'objet était déjà en elle ; et comment dirait-elle la grandeur du ciel, quand « il est impossible qu'une empreinte aussi grande se trouve à l'intérieur de l'âme » ? Surtout, « si en effet nous saisissions des empreintes de ce que nous voyons, il ne serait pas possible de regarder cela même que nous voyons, mais __seulement des images et des ombres__ des objets vus ». {yellow}Comme un objet posé contre la pupille ne se voit pas{/yellow}, il faut « que ce qui voit et ce qui est vu __soient deux choses__ ».

    __**Une activité, non une affection.**__ « Ce qui caractérise en effet sa puissance, __ce n'est pas de subir quelque chose__, mais d'accomplir sa puissance et la tâche qui lui a été assignée » (chap. 2). Pourquoi ? Si la vue et l'ouïe recevaient toutes deux des empreintes, l'âme ne pourrait pas distinguer ce qu'elle voit de ce qu'elle entend ; elle les distingue parce que ce sont des activités, chacune tournée vers son objet. {yellow}Un son, c'est comme des lettres tracées dans l'air{/yellow} : l'âme « __lit__, pour ainsi dire, les empreintes tracées dans l'air ». Et quand le corps est affecté, dans le goût ou l'odorat, les sensations sont « des connaissances de ces affections, et ils sont __autre chose que les affections__ elles-mêmes ». **L'âme est faite pour juger, non pour pâtir** : « ce qui lui a été donné, c'est de dominer et non pas d'être dominé ».

    __**Qui sent ?**__ L'âme reste impassible ; ce qui sent, c'est le [[g-vivant|vivant]] qu'elle forme avec le corps : « Qu'est-ce qui sent ? – __C'est le composé__ » ([[traite53|traité 53]], chap. 6). Et si nous disons que « nous » sentons, c'est que ce vivant nous reste attaché (voir [[g-hemeis|nous]]).

    __**Une image de la pensée.**__ Comment l'âme peut-elle percevoir ce qu'elle ne contient pas ? Parce qu'elle est « la raison de toutes choses » et qu'« en un certain sens __elle est grosse des sensibles__ » ([[traite41|traité 41]], chap. 3) : elle porte en elle les raisons de ce qu'elle rencontre, et les reconnaît au-dehors. Ce que l'âme perçoit d'abord, ce sont « les impressions que la sensation a laissées dans le vivant », qui sont « déjà intelligibles, de telle sorte que __la sensation de ce qui est extérieur est l'image__ de cette perception » ([[traite53|traité 53]], chap. 7). La sensation est ainsi le degré le plus obscur de la connaissance, non son contraire (voir [[g-degres-de-vie|degrés de vie]]).

    | | La sensation-empreinte | La sensation selon Plotin |
    | Où se fait la vision | dans l'âme, sur la marque | à distance, là où est l'objet |
    | Ce que l'âme saisit | une image de la chose | la chose elle-même |
    | Ce que fait l'âme | elle subit | elle juge, elle lit |

    ! Plotin parle pourtant d'« empreinte » que la sensation donne à la pensée discursive ([[traite49|traité 49]], chap. 3). Ce n'est pas une marque que le corps graverait dans l'âme : c'est une forme que l'âme a déjà élaborée à partir de ce que le vivant a subi (voir [[g-tupos|empreinte]]).

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 41, chap. 1 | les sensations ne sont pas des empreintes |
    | traité 41, chap. 2 | sentir est une activité, non une affection |
    | traité 41, chap. 3 | l'âme est grosse des sensibles |
    | traité 53, chap. 6-7 | c'est le composé qui sent |

    **Voir aussi** : [[g-tupos|Empreinte]] · [[g-vivant|Vivant]] · [[g-dianoia|Réflexion]] · [[g-phantasia|Représentation]] · [[traite41|Traité 41]]
