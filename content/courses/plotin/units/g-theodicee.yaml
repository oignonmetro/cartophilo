# Entrée du glossaire de Plotin (skill glossaire) : notion, écrite le
# 2026-11-17 avec la procédure NotebookLM (journal g-theodicee). Citations
# vérifiées sur la GF (traité 47, chap. 2, 3, 5, 7, 10, 11, 13, 15, 17 ;
# traité 51, chap. 15). Le mot « théodicée » n'est pas de Plotin (Leibniz,
# 1710) : il nomme ici sa défense de la providence (pronoia) devant les
# maux. La nature du mal et la matière, mal premier, sont dans l'entrée Mal.

id: g-theodicee
title: Théodicée
icon: book
