lessons:
- id: g-theodicee-l1
  title: Théodicée
  notes: |-
    Chez Plotin, la {violet}**théodicée**{/violet}, ou explication du mal, est [def]. Le mot n'est pas de lui ({sky}Leibniz{/sky} le forge en 1710) : Plotin parle de la {violet}*providence*{/violet} (*pronoia*), qu'il défend dans les [[traite47|traités 47]] et [[traite48|48]] contre ceux qui la nient ({sky}épicuriens{/sky}) et ceux qui accusent le monde ({sky}gnostiques{/sky}). Elle n'est pas {pink}la prévision d'un dieu qui calculerait chaque événement{/pink} : « pour l'univers, __la providence tient dans le fait qu'il existe conformément à l'Intellect__ » ([[traite47|traité 47]], chap. 1).

    __**L'univers n'est pas à blâmer d'être imparfait, parce qu'il est**__ {violet}__**l'image divisée**__{/violet} __**de l'Intellect.**__ La question est de savoir pourquoi ce qui vient d'un principe parfait contient des maux. La réponse tient dans ce qu'est une image : elle est moindre que son modèle, et ce qui la rend moindre ici, c'est la **division**. Dans l'[[g-intellect|Intellect]], chaque partie est le tout ; notre univers, au contraire, « n'est pas véritablement un : il est évidemment multiple, __divisé en une multiplicité__ où une partie est séparée d'une autre » ([[traite47|traité 47]], chap. 2). Or {coral}une partie séparée ne se suffit pas{/coral} : « comme elle a besoin d'une autre pour assurer sa sauvegarde, __elle entre en guerre__ avec celle qui lui permet d'assurer sa sauvegarde » (*ibid*.). **La guerre et la destruction ne sont donc pas des accidents de l'univers, mais la suite de ce qu'il est : un monde de corps, étendu, fait de parties qui se manquent.** Et ce monde devait exister, car l'Intellect, puissance totale, produit sans le chercher : l'univers « résulte de __la nécessité qu'il y ait une nature de second rang__ » (*ibid*.). Exiger de lui la perfection de l'Intellect, c'est demander à une image d'être son modèle : « il ne faut pas chercher __les réalités de premier rang dans celles qui sont de second rang__ » (chap. 7).

    __**On ne juge pas le**__ {violet}__**tout**__{/violet} __**sur une de ses parties.**__ Si les maux sont ceux des parties, la question devient : le tout est-il beau ? Plotin répond oui, parce que **ce qui a été produit, ce n'est pas chaque partie pour elle-même, c'est le monde, et le monde est un tout** : « ce qui est engendré, __c'est le monde tout entier__ » ([[traite47|traité 47]], chap. 3). On doit donc juger chaque partie comme on juge l'œuvre, par l'ensemble : « celui qui fait grief à l'ensemble à cause de ses parties __lance une accusation absurde__, car il faut examiner les parties en les rapportant à l'ensemble lui-même » (*ibid*.). {yellow}C'est comme si, d'un être vivant, on ne considérait qu'un cheveu ou un doigt de pied, ou si, pour juger l'espèce humaine, on mettait Thersite en avant{/yellow} (*ibid*.). Ici, le cheveu et Thersite sont les maux que l'on isole, l'homme entier est l'univers : la partie n'est ni belle ni laide seule, elle l'est par sa place. Et pris comme un tout, l'univers ne manque de rien ; Plotin le fait parler : « Un dieu m'a produit et je suis né de lui, je me compose de tous les vivants, __je ne manque de rien__ » (*ibid*.).

    __**La raison produit même les maux, parce qu'elle veut un tout complet, non que chaque chose soit bonne.**__ On objecte que si la {violet}[[g-logos|raison]]{/violet} du monde produit tout, elle produit aussi le mal. Plotin l'accorde : elle « produit même ce que l'on qualifie de « maux » conformément à la raison, car __elle ne souhaite pas que toute chose soit bonne__ » ([[traite47|traité 47]], chap. 11). Pourquoi ne le souhaite-t-elle pas ? {coral}Parce qu'un tout fait de parties toutes égales serait moins complet qu'un tout fait de rangs différents{/coral} : l'univers est l'image de l'intelligible, et il doit en reproduire toute la diversité. La raison « ne fait pas de toutes choses des dieux », et elle n'agit pas ainsi par jalousie, « mais selon une raison qui contient __toute la diversité de l'intelligible__ » (*ibid*.). Trois analogies le disent :
    - {yellow}le peintre{/yellow} : « nous adressons des reproches au peintre parce qu'il n'a pas mis de belles couleurs partout, bien qu'en fait __il ait disposé à chaque endroit les couleurs appropriées__ » (*ibid*.) ;
    - {yellow}la pièce de théâtre{/yellow} : « la pièce ne serait pas belle, si l'on supprimait les personnages inférieurs, car c'est grâce à ces derniers que __la pièce est complète__ » (*ibid*.) ;
    - {yellow}la flûte de Pan{/yellow}, qui donne aussi des notes faibles, « qui contribuent à l'harmonie » de l'instrument (chap. 17).
    Dans chacune, l'œuvre est le monde, l'artiste la raison, et la couleur sombre, le rustre ou la note faible un rang inférieur, qui n'est pas une faute de l'artiste mais la condition pour que l'œuvre soit entière.

    __**Les maux que l'on subit ne sont pas des maux pour l'âme, parce que c'est**__ {violet}__**l'homme extérieur**__{/violet} __**qui les subit.**__ Reste la souffrance : les bons pauvres et malades, les vivants qui s'entre-dévorent, les guerres. Plotin répond d'abord que « la pauvreté et les maladies __ne sont rien pour les gens de bien__, tandis qu'elles sont profitables aux méchants » ([[traite47|traité 47]], chap. 5), parce que le bien de l'homme est la vertu, que ces maux n'atteignent pas (voir [[g-bonheur|bonheur]]). Les vivants qui s'entre-dévorent ne font que hâter ce qui devait arriver : « il est nécessaire que les animaux se dévorent entre eux, car il s'agit d'un échange mutuel entre des animaux __qui ne peuvent éternellement rester ce qu'ils sont__ » (chap. 15). Et la mort ne détruit rien de ce qui vit vraiment, puisque l'âme est immortelle : {yellow}« c'est comme si l'acteur qui a été assassiné sur scène revenait, après avoir changé de costume »{/yellow} (chap. 15). Ici, l'acteur est l'âme, le costume le corps : mourir, c'est changer de corps, non cesser d'être. Il faut donc regarder les pillages et les meurtres « comme __des spectacles de théâtre__ » (*ibid*.), car « ce n'est pas l'âme qui est en nous mais son ombre, __l'homme extérieur__, qui gémit » (*ibid*.) : ce qui souffre est le composé, non ce que nous sommes (voir [[g-hemeis|nous]]).

    __**Les maux que l'on commet viennent des**__ {violet}__**âmes**__{/violet}__**, et la providence ne les excuse pas, mais les fait servir et les punit.**__ Le vice, lui, n'est pas un rôle de théâtre : c'est une faute. Plotin refuse d'en charger la providence : on ne peut lui demander des comptes « puisque nous admettons que la « responsabilité appartient à celui qui choisit » » ([[traite47|traité 47]], chap. 7, citant {sky}Platon{/sky}). Même si l'on dit avec Socrate que nul n'est méchant volontairement, la faute reste la leur : « c'est bien parce qu'ils agissent par eux-mêmes qu'ils peuvent eux-mêmes commettre une faute » ([[traite47|traité 47]], chap. 10). Et l'ordre du monde n'ôte pas cette responsabilité, car {coral}il inclut les hommes comme causes{/coral} : « la série des effets qui en découlent finit par s'accomplir, à condition que tous les principes soient eux aussi inclus dans la série. Or, __les hommes aussi sont des principes__ » (*ibid*.). {yellow}L'auteur d'un drame distribue les rôles, mais les acteurs « sont chacun par eux-mêmes et d'eux-mêmes responsables de leur jeu, bon ou mauvais »{/yellow} (chap. 17). Ce que la providence fait du mal commis, c'est deux choses :
    - elle **s'en sert** : « le plus grand des pouvoirs est celui de __savoir faire servir au bien même les maux__ » (chap. 5) ; le vice puni fait exemple, et « il nous tient en éveil » (*ibid*.) ;
    - elle le **punit**, d'une vie à l'autre : « un homme qui a tué sa mère deviendra femme, et il périra de la main de son fils » (chap. 13). D'où le nom d'{violet}« Adrastée »{/violet}, celle à qui l'on n'échappe pas : la disposition de l'univers est « justice véritable et sagesse merveilleuse » (*ibid*.).

    ! Plotin ne dit pas que les maux {pink}ont été voulus pour ces services{/pink} : « ce n'est pas pour ces raisons que les maux sont apparus, mais [...] puisqu'ils sont venus à l'être, la raison universelle __s'en sert__ pour répondre à un besoin » ([[traite47|traité 47]], chap. 5). Le mal vient de la limite de la procession (voir [[g-mal|mal]]) ; la providence n'en est pas l'auteur, elle en est l'usage. Le [[traite51|traité 51]] le dit en une image : le mal « est enchaîné par de beaux liens, __comme des captifs couverts de chaînes en or__ » (chap. 15).

    ! Ce n'est pas {pink}le meilleur des mondes possibles{/pink} de Leibniz, choisi par un dieu entre d'autres : l'univers « ne résulte pas d'un calcul » ([[traite47|traité 47]], chap. 3), il découle de l'Intellect sans délibération, et il n'y en a pas d'autre possible.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 47, chap. 2 | l'univers divisé, ses parties en guerre |
    | traité 47, chap. 3 | juger les parties par l'ensemble ; Thersite |
    | traité 47, chap. 5 | faire servir au bien même les maux |
    | traité 47, chap. 10 | les hommes aussi sont des principes |
    | traité 47, chap. 11 | le peintre, la pièce : un tout complet |
    | traité 47, chap. 13 | Adrastée, la justice d'une vie à l'autre |
    | traité 47, chap. 15 | l'acteur qui change de costume ; l'homme extérieur |
    | traité 51, chap. 15 | le mal enchaîné par de beaux liens |

