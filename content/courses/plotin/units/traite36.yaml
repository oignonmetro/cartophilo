- id: traite36-l3
  title: "Le temps et l'éternité"
  notes: |-
    **Sixième difficulté** (7, 1-7) : pourquoi additionnons-nous les temps passés au temps présent ? Le bonheur se diviserait alors comme le temps ; mesuré au présent, il serait indivisible.

    **Réponse** (7, 8-20) : on peut **compter** ce qui n'existe plus, comme le nombre des morts ; mais il est absurde de dire qu'un bonheur qui n'existe plus subsiste encore, et qu'il est plus grand que le bonheur présent. **Le bonheur doit exister tout entier**, et le temps passé n'existe plus. La durée disperse l'unité, qui n'existe que dans le présent : c'est pourquoi le temps est dit « image de l'éternité » (*Timée*), une image qui, par sa dispersion, abolit la permanence de l'éternité.

    **Le bonheur, vie de l'éternité** (7, 20-30) : si le bonheur est une vie bonne, c'est la vie de **ce qui est** (l'être véritable, le monde intelligible, par opposition au monde sensible qui « devient » sans cesse sans jamais être pleinement), car elle est la meilleure. Elle ne se mesure pas au temps, mais à **l'éternité**, qui n'est pas un temps infini mais la possession de toute la vie à la fois ; elle n'est ni plus grande, ni plus petite, ni d'aucune longueur : déterminée, sans extension, intemporelle. Il ne faut unir ni l'être au non-être, ni le temps à l'éternité ; il faut saisir cette vie dans son ensemble, car elle est « tout ensemble ».

    ! L'indivisibilité du bonheur n'est pas celle d'un instant du temps : Plotin demande de saisir non l'indivisibilité du temps, mais la vie de l'éternité.
  points:
  - id: traite36-l3-p1
    sentence: "On peut compter ce qui n'existe plus, par exemple le nombre des ___ (traité 36, 7, 8-10)."
    answer: "morts"
    alt: []
  - id: traite36-l3-p2
