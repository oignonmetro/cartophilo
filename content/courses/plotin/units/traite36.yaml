- id: traite36-l4
  title: "Le souvenir et les actions"
  notes: |-
    **Le souvenir** (chap. 8) : de quoi se souviendrait-on ? D'une réflexion passée : on parlerait alors d'un accroissement de réflexion, hors sujet. D'un plaisir : comme si l'homme heureux avait besoin d'une suite d'**explosions de joie** et ne se contentait pas de sa joie présente. Ce serait se souvenir du **repas** de la veille, ou, plus ridicule encore, d'un repas dégusté voilà dix ans. Plotin vise la doctrine **épicurienne** selon laquelle le souvenir des plaisirs passés accroît le bonheur.

    **Le souvenir de belles choses** (chap. 9) : c'est le propre de l'homme à qui elles font actuellement **défaut**.

    **Les actions** (chap. 10) : beaucoup de temps permet beaucoup d'actions vertueuses. Réponse :

    - on peut être heureux **sans agir**, et ce bonheur est supérieur à celui de l'homme d'action ;
    - les actions ne produisent pas d'elles-mêmes le bien : ce sont **les dispositions** qui rendent belles les actions ;
    - la **patrie** pourrait être sauvée par un homme mauvais, et le sage se réjouirait qu'un autre l'ait sauvée.

    Placer le bonheur dans les actions, c'est le placer hors de la vertu et de l'âme ; l'activité de l'âme réside dans **la réflexion**, accomplie en elle-même.

    ! Plotin ne condamne pas l'action : le sage récolte le bien même en agissant, mais par ce qu'il possède, non parce qu'il agit.
  points:
  - id: traite36-l4-p1
    sentence: "Se souvenir d'un plaisir, ce serait comme si l'homme heureux avait besoin d'une suite d'___ de joie (traité 36, 8, 6-7)."
