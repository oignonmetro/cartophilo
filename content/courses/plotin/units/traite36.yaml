id: traite36
title: "Traité 36 (I, 5) : Si le bonheur s'accroît avec le temps"
subtitle: "Un bonheur tout entier présent"
icon: compass
color: sky
lessons:
- id: traite36-l1
  title: "La question : le temps fait-il croître le bonheur ?"
  notes: |-
    **Une suite de traités** : dans la première Ennéade, Porphyre a placé à la suite les traités 19, *Sur les vertus*, 20, *Sur la dialectique*, 46, *Sur le bonheur*, et 36. Le traité 46 met le bonheur dans **la vie parfaite de l'Intellect** ; le traité 36 garde cette conception et l'applique à une question ancienne.

    **Un vieux débat** :

    | Position | Tenants |
    | on n'est heureux que si le bonheur dure jusqu'à la mort | Aristote, *Éthique à Nicomaque* I |
    | le temps qui passe ne fait pas croître un bien | les stoïciens, Chrysippe |
    | le temps illimité et le temps limité contiennent un plaisir égal | Épicure, *Maximes capitales* 19 |

    Plotin **admet la conclusion des stoïciens et des épicuriens**, avec trois arguments : le bonheur n'est qu'au présent ; il est la vie de l'Intellect, éternelle ; il ne dépend pas des actions.

    **La thèse d'entrée** (chap. 1) : se souvenir d'un bonheur n'apporte rien de plus ; le bonheur ne consiste pas à **dire** qu'on est heureux, mais à **être en une certaine disposition**, et une disposition n'existe qu'au présent, comme l'activité de la vie.

    **Première difficulté** (chap. 2) : nous désirons toujours vivre et agir ; la satisfaction continue de ce désir n'accroît-elle pas le bonheur ? Trois réponses :

    - le bonheur du lendemain serait toujours plus grand, et ne serait plus mesuré par **la vertu** ;
    - même les **dieux** ne seraient jamais parfaitement heureux ;
    - le désir vise toujours quelque chose de présent : il souhaite que **l'état actuel se prolonge**.

    ! Plotin rejoint la conclusion stoïcienne et épicurienne, non ses raisons : c'est l'éternité de la vie intelligible qui met chez lui le bonheur hors du temps.
