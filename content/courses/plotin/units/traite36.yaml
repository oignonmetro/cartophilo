- id: traite36-l5
  title: "Repérage : le plan du traité 36"
  notes: |-
    **Le traité 36 pose sa thèse (chap. 1), puis répond à neuf difficultés, une par chapitre (chap. 2-10).**

    | Moment | Lieu | Ce qui s'y joue |
    | la question | chap. 1 | une disposition présente |
    | vivre et agir longtemps | chap. 2 | le désir vise le présent |
    | voir plus longtemps | chap. 3 | une seule fois suffit |
    | jouir plus longtemps | chap. 4 | le plaisir passé n'existe plus |
    | heureux par moments | chap. 5 | l'état actuel |
    | le malheur prolongé | chap. 6 | la maladie qui s'aggrave |
    | additionner les temps | chap. 7 | l'image de l'éternité |
    | le souvenir | chap. 8 | le repas de la veille |
    | le souvenir des belles choses | chap. 9 | celui qui en manque |
    | les actions | chap. 10 | la patrie sauvée |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! Le chapitre 7, sur le temps et l'éternité, est le seul où Plotin fonde sa réponse sur sa propre doctrine : le bonheur est la vie intelligible.
  points:
  - id: traite36-l5-p1
    sentence: "Dans le traité 36 de Plotin, la thèse que le malheur ne croît que si le mal s'aggrave se trouve au ___."
    answer: "chap. 6"
    alt: ["6", "chapitre 6"]
  - id: traite36-l5-p2
    sentence: "Dans le traité 36 de Plotin, le temps comme image de l'éternité apparaît au ___."
    answer: "chap. 7"
    alt: ["7", "chapitre 7"]
  - id: traite36-l5-p3
