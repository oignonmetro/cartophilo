- id: traite36-l2
  title: "Durée, plaisir et malheur"
  notes: |-
    **Voir plus longtemps** (chap. 3) : on dit qu'il « eut plus longtemps sous les yeux le même objet ». Si le temps lui avait permis de le discerner avec plus de précision, il aurait apporté quelque chose ; sinon, celui qui le voit **une seule fois** obtient un résultat équivalent.

    **Jouir plus longtemps** (chap. 4) : on aurait tort de l'ajouter au bonheur. Si le plaisir est « l'activité non entravée », il est identique au bonheur ; et même le plaisir durable ne tient qu'au présent : **ce qui, du plaisir, appartient au passé n'existe plus**.

    **Heureux au début, à la fin, toujours** (chap. 5) : on compare en fait des personnes malheureuses, au moment où elles le sont, à une personne heureuse ; c'est par leur **état actuel** que les heureux ont l'avantage.

    **Le malheur qui dure** (chap. 6) : si les douleurs prolongées accroissent le malheur, pourquoi les biens n'accroîtraient-ils pas le bonheur ? Une maladie chronique est un état qui **s'aggrave** ; le malheur croît par l'ajout d'un mal plus grand, non par la persistance du même mal, sinon on ajouterait ce qui n'existe plus à ce qui existe. Le bonheur, lui, a **une borne et une limite**, et reste le même. Il ne croît qu'au sens où l'on progresse vers **une vertu plus grande** : ce qui mérite l'éloge, ce n'est pas le nombre des années de bonheur, mais le bonheur atteint.

    ! L'asymétrie n'est qu'apparente : malheur et bonheur ne croissent ni l'un ni l'autre par la durée, mais seulement quand le mal s'aggrave ou que la vertu grandit.
  points:
