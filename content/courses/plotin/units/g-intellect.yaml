# Entrée du glossaire de Plotin (skill glossaire), refondue, 2026-10-21.
# Tirée de l'ancienne fiche Intellect (trois leçons) ; les cartes reprises
# gardent leur identifiant. Citations vérifiées sur la GF.

id: g-intellect
title: Intellect (`noûs`)
subtitle: "La seconde hypostase, née de l'Un qu'elle ne peut saisir comme un : un-multiple, identique aux Formes, pensée qui se pense"
icon: book
color: coral
lessons:
- id: g-intellect-l1
  title: Intellect
  notes: |-
    Chez Plotin, l'{violet}**Intellect**{/violet} (*noûs*) est la {green}seconde hypostase{/green} : né de l'[[g-un|Un]], il est la première réalité qui ne soit plus absolument simple, une pensée qui est elle-même toutes les Formes.

    __**Il naît d'un regard qui ne peut saisir l'Un comme un.**__ De l'Un procède d'abord une puissance encore indéterminée, qui se retourne vers sa source pour la contempler : c'est la {violet}[[g-epistrophe|conversion]]{/violet}, et c'est ce regard qui la détermine (voir la [[g-procession|procession]]). Mais « lorsqu'il contemple l'Un, __il ne le contemple pas en tant qu'un__ ; sinon, il ne devient pas Intellect » ([[traite30|traité 30]], chap. 8). Penser, c'est distinguer : un regard qui pense ne peut recevoir la simplicité de l'Un qu'en la démultipliant. D'où : « ayant commencé en tant qu'un, il n'est pas resté comme il était en commençant : sans s'en rendre compte, __il est devenu multiple__, comme s'il avait été alourdi ».

    __**Un-multiple : ni simple, ni dispersé.**__ Il n'a pas la simplicité de l'Un, ni la dispersion des corps : il est {violet}**un-multiple**{/violet} (*hen polla*), une seule réalité qui est en même temps la totalité des Formes. C'est la [[g-multiplicite-intelligible|multiplicité intelligible]].

    __**Il est les Formes qu'il pense.**__ L'Intellect ne regarde pas des Formes placées hors de lui : il les est, sinon il n'en aurait que des images et ne posséderait jamais la vérité. C'est la thèse que [[g-intelligibles-dans-l-intellect|les intelligibles sont dans l'Intellect]]. Et parce qu'il les est, il ne les parcourt pas une à une : sa [[g-noesis|pensée]] les saisit toutes ensemble, dans l'[[g-eternite|éternité]].

    __**Pourquoi il n'est pas le premier principe.**__ L'Intellect se pense lui-même, comme le dieu d'{sky}Aristote{/sky}. Mais penser, même soi-même, c'est encore être deux : ce qui pense se voit lui-même, et « __il devient donc deux, bien qu'étant un__ » ([[traite24|traité 24]], chap. 1). Il faut donc « qu'il soit simple et non simple ». Or ce qui est double suppose avant lui ce qui est simple : **le premier principe ne peut pas penser**, et « ce qui est au-delà de ce qui intellige en premier __n'intelligera plus__ » (chap. 2). Plotin place ainsi le dieu d'Aristote au second rang.

    __**Son sommet aime.**__ Au-delà de sa puissance de penser, l'Intellect a une puissance d'aimer, par laquelle il s'unit au Bien : c'est l'[[g-intellect-amoureux|Intellect amoureux]].

    ! L'Intellect ne « tombe » pas de l'Un par une faute : sa multiplicité est la seule façon dont la plénitude de l'Un peut être pensée. Plotin regrette pourtant qu'il soit ainsi « devenu le second » : être multiple, c'est déjà être moins.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 30, chap. 8 | il ne contemple pas l'Un en tant qu'un |
    | traité 32, chap. 1 | les intelligibles ne sont pas hors de lui |
    | traité 5, chap. 8 | il est toutes les Formes |
    | traité 24, chap. 1-2 | penser, c'est être deux ; le premier ne pense pas |
    | traité 38, chap. 35 | l'Intellect qui aime |

    **Voir aussi** : [[g-un|Un]] · [[g-ame|Âme]] · [[g-intelligibles-dans-l-intellect|Intelligibles dans l'Intellect]] · [[g-noesis|Pensée]] · [[g-intellect-amoureux|Intellect amoureux]] · [[g-procession|Procession]] · [[g-multiplicite-intelligible|Multiplicité intelligible]]
