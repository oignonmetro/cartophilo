  points:
  - id: g-intellect-l1-1
    sentence: L'Intellect, ___ hypostase du système de Plotin, immédiatement après l'Un et au-dessus de l'Âme, résulte de la surabondance de l'Un.
    answer: seconde
    alt: []
  - id: g-intellect-l1-q1
    sentence: "Ce qui procède d'abord de l'Un est une puissance encore ___, que son regard vers l'Un vient ensuite déterminer et constituer en Intellect."
    answer: indéterminée
    alt: ["indeterminee"]
  - id: g-intellect-l1-5
    sentence: En se retournant vers sa source pour la contempler, l'émanation issue de l'Un ne peut l'embrasser dans sa simplicité absolue ; ce mouvement de retour, Plotin le nomme la ___.
    answer: conversion
    alt: []
  - id: g-intellect-l1-q2
    sentence: "Le mouvement par lequel la puissance issue de l'Un se retourne vers sa source pour la contempler, et qui la constitue en Intellect, se nomme en grec, translittéré, ___."
    answer: epistrophê
    alt: ["epistrophe"]
  - id: g-intellect-l1-q3
    sentence: "« Lorsqu'il contemple l'Un, il ne le contemple pas en tant qu'___ ; sinon, il ne devient pas Intellect » (traité 30, chap. 8, l. 31-32)."
    answer: un
    alt: []
  - id: g-intellect-l1-q4
    sentence: "« Ayant commencé en tant qu'un, il n'est pas resté comme il était en commençant : sans s'en rendre compte, il est devenu ___, comme s'il avait été alourdi » (traité 30, chap. 8, l. 32-34)."
    answer: multiple
    alt: []
  - id: g-intellect-l1-q5
    sentence: "« Sans s'en rendre compte, il est devenu multiple, comme s'il avait été ___, et il s'est lui-même déployé en désirant posséder toutes choses » (traité 30, chap. 8, l. 33-35)."
    answer: alourdi
    alt: []
  - id: g-intellect-l1-q6
    sentence: "« Sans s'en rendre compte, il est devenu multiple, comme s'il avait été alourdi, et il s'est lui-même déployé en désirant ___ » (traité 30, chap. 8, l. 33-35)."
    answer: posséder toutes choses
    alt: ["posseder toutes choses"]
  - id: g-intellect-l1-q7
    sentence: "Penser, c'est distinguer ; c'est pourquoi un regard qui pense ne peut recevoir la simplicité de l'Un qu'en la ___, ce qui donne la multiplicité des Formes."
    answer: démultipliant
    alt: ["demultipliant", "multipliant", "fragmentant"]
  - id: g-intellect-l1-q8
    sentence: "Le passage où Plotin décrit l'Intellect qui, contemplant l'Un sans pouvoir le saisir comme un, « est devenu multiple » sans s'en rendre compte, se lit au chapitre 8 du traité ___."
    answer: 30 (III, 8)
    alt: ["30", "III, 8"]
  - id: g-intellect-l1-2
    sentence: Plotin définit l'Intellect comme une « unité-multiple », qu'il désigne en grec, translittéré, par ___.
    answer: hen polla
    alt: []
  - id: g-intellect-l1-q9
    sentence: "L'Intellect n'est, chez Plotin, ni simple comme l'Un ni dispersé comme les corps, mais ce qu'il nomme un « ___ » (*hen polla*)."
    answer: un-multiple
    alt: ["un multiple", "unité-multiple"]
  - id: g-intellect-l1-r1
    sentence: "Qui se pense lui-même reste deux : ce qui pense, uni à son objet, se voit lui-même, et « il devient donc ___, bien qu'étant un » (traité 24, chap. 1)."
    answer: deux
    alt: []
  - id: g-intellect-l1-r2
    sentence: "Puisque toute pensée est double, le premier principe ne pense pas : « ce qui est au-delà de ce qui intellige en premier n'___ plus » (traité 24, chap. 2)."
    answer: intelligera
    alt: []
  - id: g-intellect-l1-r3
    sentence: "En faisant de l'Intellect qui se pense lui-même la seconde hypostase, et non le premier principe, Plotin place au second rang le dieu d'___."
    answer: Aristote
    alt: []
