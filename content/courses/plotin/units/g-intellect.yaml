- id: g-intellect-l3
  title: Une pensée qui voit d'un seul coup
  notes: |-
    **Si l'Intellect est les Formes, il ne les pense pas l'une après l'autre : il les voit toutes ensemble.** C'est ce qui distingue sa pensée de la nôtre, qui raisonne.

    __**Deux manières de penser.**__ Notre pensée ordinaire est {violet}**discursive**{/violet} (*dianoia*) : elle va d'une prémisse à une conclusion, d'une idée à la suivante, dans le temps. {green}La pensée de l'Intellect est intuitive{/green} : elle saisit d'un coup ce que la *dianoia* déroule. **Elle n'a pas à chercher, parce qu'elle a déjà tout, et qu'elle est ce qu'elle pense.**

    | Pensée | Comment elle procède | À qui elle appartient |
    | discursive | d'une idée à l'autre, dans le temps | l'Âme |
    | intuitive | tout d'un seul coup | l'Intellect |

    __**L'image des hiéroglyphes.**__ Les {sky}sages d'Égypte{/sky}, dit Plotin, n'écrivaient pas avec des lettres, qui « développent des propositions et des prémisses », mais {yellow}en inscrivant sur les murs de leurs temples une seule image pour chaque chose{/yellow} : ils « manifestent ainsi le caractère non discursif de l'intelligible » ([[traite31|traité 31]], chap. 6, l. 1-7). **Chaque image y est « une science, un savoir, une réalité particulière donnée tout d'un coup »** (l. 7-9). L'image vaut par son contraste : une phrase se lit mot après mot, un signe se voit d'un regard.

    __**L'image de la science et de ses théorèmes.**__ Une science ne contient pas ses théorèmes comme un sac contient des billes : chacun est distinct, et pourtant « chaque théorème est une partie de la totalité de la science, non pas parce qu'il en est localement séparé, mais parce qu'il a, dans le tout, une puissance particulière » ([[traite5|traité 5]], chap. 8, l. 5-7). **Ainsi chaque Forme est distincte des autres sans être séparée du tout.**

    ! Plotin ne connaissait sans doute pas le fonctionnement réel de l'écriture hiéroglyphique, qui note aussi des sons : son image vaut pour ce qu'elle fait comprendre, non comme renseignement sur l'Égypte.

    ! Il ne faut pas confondre la saisie d'un seul coup de l'Intellect avec la *dianoia*, qui suppose une succession : celle-ci est le propre de l'Âme.
