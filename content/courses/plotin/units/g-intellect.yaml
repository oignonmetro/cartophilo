id: g-intellect
title: Intellect (`noûs`)
subtitle: La seconde hypostase, « un-multiple » où penser et être se confondent
icon: bulb
color: amber
lessons:
- id: g-intellect-l1
  title: D'où vient l'Intellect, et pourquoi il est multiple
  notes: |-
    **L'Intellect** (*noûs*) **est la seconde hypostase : il naît de l'Un, et il est la première chose qui ne soit plus absolument simple.** Comprendre comment il naît, c'est comprendre pourquoi il est à la fois un et multiple.

    __**De l'Un procède d'abord une puissance encore indéterminée.**__ L'Un, qui surabonde, laisse venir de lui quelque chose qui n'est pas encore rien de précis : une vie, une puissance sans forme. **Cette puissance se retourne vers sa source pour la contempler** : c'est la {violet}**conversion**{/violet} (*epistrophê*). Et c'est ce regard qui la détermine et en fait l'Intellect.

    __**Mais elle ne peut saisir l'Un comme un.**__ C'est le cœur de l'explication : « lorsqu'il contemple l'Un, il ne le contemple pas en tant qu'un ; sinon, il ne devient pas Intellect » ([[traite30|traité 30]], chap. 8, l. 31-32). Penser, c'est distinguer ; un regard qui pense ne peut donc recevoir la simplicité de l'Un qu'en la {red}démultipliant{/red}. D'où la formule : « ayant commencé en tant qu'un, il n'est pas resté comme il était en commençant : sans s'en rendre compte, il est devenu multiple, comme s'il avait été alourdi, et il s'est lui-même déployé en désirant posséder toutes choses » (l. 32-35). {coral}La multiplicité des Formes est ce que devient l'Un dans un regard qui le pense.{/coral}

    __**L'Intellect est donc un « un-multiple ».**__ Il n'a pas la simplicité de l'Un, mais il n'a pas non plus la dispersion des corps : il est {violet}**un-multiple**{/violet} (*hen polla*), une seule réalité qui est en même temps la totalité des Formes. Il se tient ainsi entre l'Un, au-delà de la réalité, et l'Âme, qui pense en passant d'une chose à l'autre.

    ! L'Intellect ne « tombe » pas de l'Un par accident ou par faute : sa multiplicité est la seule façon dont la plénitude de l'Un peut être pensée. Plotin regrette pourtant, dans la même phrase, que l'Intellect soit ainsi « devenu le second » (l. 35-36) : être multiple, c'est déjà être moins.
