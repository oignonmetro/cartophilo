- id: g-intellect-l2
  title: Les intelligibles ne sont pas hors de l'Intellect
  notes: |-
    **La thèse la plus originale de Plotin sur l'Intellect : il ne contemple pas les Formes comme des objets placés devant lui, il les est.** C'est le titre même du [[traite32|traité 32]] : *Que les intelligibles ne sont pas hors de l'Intellect*.

    __**L'argument : sinon, l'Intellect n'aurait jamais la vérité.**__ Supposons les Formes {red}extérieures{/red} à l'Intellect. Il ne les saisirait alors que comme la sensation saisit les corps, par une image reçue. Or « si l'on va jusqu'à accorder que les intelligibles sont extérieurs et que l'Intellect les contemple en tant que tels, alors nécessairement l'Intellect ne saisira pas la vérité des intelligibles » : il les contemplera « sans les posséder » et « n'en saisira que des images » ([[traite32|traité 32]], chap. 1, l. 50-56). **Un intellect qui n'aurait que des images ne posséderait que le faux, et ne serait plus un intellect du tout.** Pour que la vérité existe quelque part, il faut donc qu'en un lieu au moins, ce qui connaît et ce qui est connu ne fassent qu'un.

    __**D'où le refus de l'empreinte.**__ Il ne faut pas {red}soutenir que dans l'Intellect les intelligibles sont des {yellow}empreintes{/yellow} des êtres{/red} (chap. 2, l. 1-2), {yellow}comme un sceau dans la cire{/yellow}. L'empreinte suppose un objet extérieur qui frappe un support passif ; l'Intellect, lui, ne reçoit rien du dehors.

    __**L'Intellect est donc les Formes elles-mêmes.**__ « L'Intellect dans sa totalité est toutes les Formes, et chaque Forme est un intellect, comme la science dans sa totalité est tous les théorèmes » ([[traite5|traité 5]], chap. 8, l. 3-5). Plotin reprend la parole de {sky}Parménide{/sky} : « être et penser, c'est la même chose » ([[traite30|traité 30]], chap. 8, l. 8). {green}Dans l'Intellect, la pensée ne vise pas l'être, elle coïncide avec lui.{/green}

    **Il rompt ainsi avec une lecture courante de Platon**, où les Formes seraient des modèles que le {sky}Démiurge du *Timée*{/sky} contemple hors de lui : pour Plotin, une Forme qui ne serait pas pensée ne serait pas une réalité vivante, mais une chose morte, un simple énoncé.

    ! Que l'Intellect soit identique aux Formes ne veut pas dire qu'il les produit à sa guise : Plotin précise que ce qui est est antérieur à l'Intellect, au sens où l'Intellect pense ce qui est, et non l'inverse ([[traite5|traité 5]], chap. 8). L'un et l'autre forment « une seule nature ».
