id: g-intellect
title: Intellect
subtitle: La seconde hypostase, où penser et être se confondent
icon: bulb
color: amber
lessons:
- id: g-intellect-l1
  title: L'Intellect, identité du pensant et du pensé
  notes: |-
    L'**Intellect** est la seconde hypostase du système de Plotin : elle résulte du débordement de l'Un, la première hypostase et source de toute réalité. Mais l'Intellect ne pense pas des Formes qui lui seraient extérieures : il __est__ ces Formes, sujet pensant et objet pensé s'y confondant entièrement.

    - On se tromperait à se représenter l'Intellect divin sur le modèle d'un esprit humain qui pense un objet distinct de lui, comme lorsqu'on pense à un triangle sans être soi-même ce triangle : chez Plotin, c'est exactement l'inverse qui vaut.
      de même qu'on ne saurait séparer la vue de ce qu'elle voit lorsqu'elle appréhende d'un seul regard un visage entier avant même d'en distinguer les traits, l'Intellect saisit d'un seul coup, dans un acte unique et transparent à lui-même, la totalité organisée des vérités intelligibles qui le constituent.
    - Cette saisie est instantanée et totale, à ne pas confondre avec la **`dianoia`**, la pensée discursive qui raisonne pas à pas en enchaînant des propositions les unes après les autres : cette dernière est le propre de l'Âme, non de l'Intellect.
    - L'Intellect procède de l'Un par le même mouvement qui vaut à chaque hypostase inférieure de procéder de la précédente : une **procession** qui laisse la source intacte, puis une **contemplation**, par laquelle la réalité produite se tourne vers ce dont elle procède pour y puiser sa détermination et sa perfection propres.
      un peu à la manière dont un reflet ne prend sa netteté que du visage qu'il reflète.

    ! Ne pas confondre la pensée totale et instantanée de l'Intellect avec la pensée discursive : celle-ci suppose une succession que l'Intellect, où tout est éternellement et simultanément présent, ignore.
  points:
  - id: g-intellect-l1-1
    sentence: L'Intellect ne pense pas des Formes qui lui seraient extérieures, il est au contraire ces
      Formes chez Plotin, de sorte que le sujet qui pense et l'objet pensé s'y ___ entièrement.
    answer: confondent
  - id: g-intellect-l1-2
    sentence: L'Intellect, ___ hypostase du système de Plotin, résulte du débordement de l'Un, la première
      hypostase et source de toute réalité.
    answer: seconde
  - id: g-intellect-l1-3
    sentence: Comme le regard saisit d'un seul coup un visage entier avant même d'en distinguer les traits,
      l'Intellect appréhende dans un acte unique et parfaitement transparent à lui-même la totalité organisée
      des vérités ___ qui le constituent.
    answer: intelligibles
  - id: g-intellect-l1-4
    sentence: La pensée qui raisonne pas à pas, en enchaînant des propositions les unes après les autres,
      propre à l'Âme et non à l'Intellect, se nomme, en grec, la ___.
    answer: dianoia
  - id: g-intellect-l1-5
    sentence: La `dianoia`, pensée discursive qui procède pas à pas, est le propre de l'___, jamais de
      l'Intellect, dont l'activité est au contraire instantanée et totale.
    answer: Âme
  - id: g-intellect-l1-6
    sentence: Le mouvement par lequel une hypostase produite se tourne vers ce dont elle procède, pour
      y puiser sa détermination et sa perfection propres, se nomme la ___, par opposition à la procession
      qui l'a fait naître.
    answer: contemplation
  - id: g-intellect-l1-7
    sentence: Ce retour de l'hypostase inférieure vers sa source, Plotin le compare à la manière dont un
      reflet ne prend sa netteté que du ___ qu'il reflète.
    answer: visage
