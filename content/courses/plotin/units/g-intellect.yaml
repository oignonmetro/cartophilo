id: g-intellect
title: Intellect
subtitle: La seconde hypostase, « unité-multiple » où penser et être se confondent
icon: bulb
color: amber
lessons:
- id: g-intellect-l1
  title: L'Intellect
  notes: |-
    L'**Intellect** (`Noûs`) est la seconde hypostase du système de Plotin, immédiatement après l'Un et au-dessus de l'Âme. Il n'est ni un individu simple, ce qui le confondrait avec l'Un, ni une juxtaposition de choses séparées : Plotin le définit comme une **« unité-multiple »** (`hen polla`), à la fois une seule entité et une pluralité d'entités qui se pensent elles-mêmes.

    - Entre la simplicité absolue de l'Un, __au-delà de l'être__, et la dispersion du monde sensible où l'Âme raisonne pas à pas (`dianoia`), il faut un degré intermédiaire qui possède la plus haute unité possible tout en admettant une première pluralité. L'Un engendre par surabondance une puissance indéterminée ; en se retournant vers sa source pour la contempler, la **conversion** (`epistrophē`), cette émanation ne peut embrasser l'Un dans sa simplicité absolue : elle le fragmente en une multiplicité de déterminations intelligibles. Ce regard contemplatif porté sur l'Un constitue et détermine l'Intellect.
    - L'Intellect n'est pas un réceptacle vide contenant des Formes indépendantes, ni un esprit observant des objets hors de lui : il est lui-même la totalité des Formes intelligibles en acte, à tel point que Plotin peut dire : « L'Intellect dans sa totalité est toutes les Formes, et chaque Forme est un intellect ». Il rompt ainsi avec **Platon**, chez qui les Formes sont des modèles transcendants que le Démiurge contemple hors de sa propre pensée : pour Plotin au contraire, les intelligibles ne sont __pas hors de l'Intellect__, une Forme qui ne serait pas pensée n'existerait tout simplement pas. Il reprend la formule de Parménide : « Penser et être sont une même chose ».
    - Si les Formes étaient extérieures à l'Intellect, il n'en recevrait que des reflets, comme un juge qui ne posséderait pas l'original et ne pourrait vérifier si l'image perçue lui est conforme. Plotin rejette ainsi l'image du __sceau dans la cire__ : l'Intellect ne subit aucune affection passive venue du dehors, il possède et vit immédiatement ses objets.
    - Plotin compare l'Intellect à une science qui contiendrait la totalité de ses théorèmes : chaque théorème est un acte distinct de cette science, tout en la possédant virtuellement sans en être séparé.
      une autre image, celle des hiéroglyphes égyptiens, montre que la pensée de l'Intellect est intuitive et non discursive : elle exprime une réalité d'un seul coup, sans succession ni mots séparés, comme un idéogramme.

    ! Il ne faut pas confondre cette saisie instantanée et totale avec la pensée discursive (**`dianoia`**), qui raisonne pas à pas en enchaînant des propositions les unes après les autres et suppose une succession que l'Intellect, où tout est éternellement et simultanément présent, ignore. Cette dernière est le propre de l'Âme, non de l'Intellect.
  points:
  - id: g-intellect-l1-1
    sentence: L'Intellect, ___ hypostase du système de Plotin, immédiatement après l'Un et au-dessus de l'Âme, résulte de la surabondance de l'Un.
    answer: seconde
    alt: []
  - id: g-intellect-l1-2
    sentence: Plotin définit l'Intellect comme une « unité-multiple », qu'il désigne en grec, translittéré, par ___.
    answer: hen polla
    alt: []
  - id: g-intellect-l1-3
    sentence: L'Intellect n'est, chez Plotin, ni un individu simple qui le confondrait avec l'Un, ni une juxtaposition de choses séparées, mais ce qu'il nomme une « ___ ».
    answer: unité-multiple
    alt: []
  - id: g-intellect-l1-4
    sentence: Le mouvement par lequel l'émanation issue de l'Un se retourne vers sa source pour la contempler, et qui constitue ainsi l'Intellect, se nomme en grec, translittéré, ___.
    answer: epistrophē
    alt: []
  - id: g-intellect-l1-5
    sentence: En se retournant vers sa source pour la contempler, l'émanation issue de l'Un ne peut l'embrasser dans sa simplicité absolue ; ce mouvement de retour, Plotin le nomme la ___.
    answer: conversion
    alt: []
  - id: g-intellect-l1-6
    sentence: Plotin résume l'identité de l'Intellect et des Formes dans une formule célèbre, « L'Intellect dans sa totalité est toutes les Formes, et chaque ___ est un intellect ».
    answer: Forme
    alt: []
  - id: g-intellect-l1-7
    sentence: À la différence de ___, chez qui les Formes sont des modèles transcendants que le Démiurge contemple hors de sa propre pensée, Plotin soutient que les intelligibles ne sont pas hors de l'Intellect.
    answer: Platon
    alt: []
  - id: g-intellect-l1-8
    sentence: Pour Plotin, une Forme qui ne serait pas pensée n'existerait tout simplement pas ; contrairement à la lecture platonicienne traditionnelle, les intelligibles ne sont jamais ___ de l'Intellect.
    answer: hors
    alt: []
  - id: g-intellect-l1-9
    sentence: Pour affirmer l'identité de la pensée et de l'être chez l'Intellect, Plotin reprend une formule de Parménide, « Penser et ___ sont une même chose ».
    answer: être
    alt: []
  - id: g-intellect-l1-10
    sentence: Contre l'idée que l'Intellect recevrait les Formes comme une empreinte dans la cire, Plotin soutient qu'il ne subit aucune affection passive venue du dehors ; il possède et vit ___ ses objets.
    answer: immédiatement
    alt: []
  - id: g-intellect-l1-11
    sentence: Si les Formes étaient extérieures à l'Intellect, celui-ci n'en recevrait que des reflets, comme un juge qui ne posséderait pas l'___ et ne pourrait vérifier si l'image perçue lui est conforme.
    answer: original
    alt: []
  - id: g-intellect-l1-12
    sentence: Plotin compare l'Intellect à une science qui contiendrait la totalité de ses théorèmes ; chaque théorème est un acte distinct de cette science, tout en la possédant ___ sans en être séparé.
    answer: virtuellement
    alt: []
  - id: g-intellect-l1-13
    sentence: Pour montrer que la pensée de l'Intellect est intuitive et non discursive, sans succession ni mots séparés, Plotin la compare aux ___ égyptiens, qui expriment une réalité d'un seul coup.
    answer: hiéroglyphes
    alt: []
  - id: g-intellect-l1-14
    sentence: La pensée qui raisonne pas à pas, en enchaînant des propositions les unes après les autres, propre à l'Âme et non à l'Intellect, se nomme, en grec, la ___.
    answer: dianoia
    alt: []
  - id: g-intellect-l1-15
    sentence: La `dianoia`, pensée discursive qui procède pas à pas, est le propre de l'___, jamais de l'Intellect, dont l'activité est au contraire instantanée et totale.
    answer: Âme
    alt: []
