id: traite50
title: "Traité 50 (III, 5) : Sur l'amour"
subtitle: "Éros, dieu, démon et passion"
icon: compass
color: sky
lessons:
- id: traite50-l1
  title: "L'amour, passion de l'âme"
  notes: |-
    **Dieu, démon ou passion ?** (1, 1-10) : Platon donne de quoi soutenir les trois. Dans le *Phèdre*, l'amour est un dieu qui possède l'âme, et une passion ; dans le *Banquet*, tantôt un dieu lié à Aphrodite (Pausanias), tantôt un démon, fils de Poros et de Pénia (Diotime). Il faut retourner au « divin Platon ».

    **Le principe de l'amour** (1, 10-38) : la passion survient dans des âmes désireuses de s'unir à un bel objet. Sa cause est **une parenté** de l'âme avec la beauté, le sens irraisonné d'une affinité. La nature produit en regardant vers le beau, qui se range avec le déterminé dans la colonne du bien. Les uns veulent « enfanter dans le beau » ; ceux qui ont la réminiscence de la beauté intelligible n'aiment plus celle d'ici qu'en tant qu'image.

    **Trois formes d'amour** (1, 38-65) :

    | Amour | Ce qu'il cherche | Jugement de Plotin |
    | pur | la beauté seule, sans union des corps | le meilleur, le plus autosuffisant |
    | mixte, selon la nature | engendrer dans le beau, perpétuer l'espèce | tempérant, sans faute |
    | mixte, contre la nature | une union qui dévie de la nature | une chute, dans l'ignorance du beau |

    Le désir d'engendrer est un désir d'immortalité dans la condition mortelle ; mais il vient d'une **indigence**. Le désir du bien peut conduire à chuter vers le mal.

    ! Plotin ne condamne pas l'amour des corps : la beauté d'ici est comme un jeu de la beauté d'en haut ; seule la déviation contre nature est une faute.
