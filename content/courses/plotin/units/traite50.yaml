- id: traite50-l3
  title: "Éros démon : Poros et Pénia"
  notes: |-
    **Pas le monde sensible** (chap. 5) : certains ont vu dans l'Éros du *Banquet* le monde ; mais le monde est un dieu bienheureux, et Éros toujours indigent ; il faudrait qu'Éros soit Aphrodite, ou le monde un composé de démons. Et comment dire du monde qu'il est « sans chaussures, sans maison » ?

    **Les démons** (chap. 6) : les dieux sont impassibles, les démons ont des passions ; éternels, ils sont des **intermédiaires** entre les dieux et nous. Les astres jusqu'à la lune sont des dieux visibles. Les démons sont la trace des âmes venues dans le monde ; ne sont des Éros que ceux qu'engendre l'âme qui désire le bien et le beau. Ils ont part à une **matière intelligible**, qui leur permet de revêtir des corps d'air ou de feu.

    **Poros et Pénia** (chap. 7) : « Poros est ivre de nectar, car il n'y a pas encore de vin » : Éros est né avant le sensible. Pénia est l'indétermination, Poros le **principe rationnel** ; Éros, raison mêlée d'indétermination, est un désir frénétique qui **ne peut être comblé** : il a la maladresse de l'indigence et l'ingéniosité de la raison. Les amours naturelles relèvent de la réalité véritable ; les amours contre nature ne sont que des affects, sans réalité. Et comme on voit sur un triangle particulier une propriété du triangle, l'amour porte sur l'absolu.

    **Le jardin de Zeus** (chap. 8-9) : Zeus est l'Intellect, en qui il y a « une âme royale et un intellect royal » (*Philèbe*) ; Aphrodite est l'âme unie à lui, nommée d'après la grâce. Son **jardin** est la splendeur des raisons venues de l'Intellect dans l'âme ; le nectar, ce que se procure le divin. Les mythes **morcellent** en moments ce qui est ensemble ; à qui a compris de les réassocier. Pénia est la matière ; Éros est un démon, lié à la matière, venu de l'âme qui désire le bien autant qu'elle en est privée.

    | Figure du mythe | Ce qu'elle représente |
    | Zeus | l'Intellect |
    | Aphrodite | l'âme |
    | Poros | les raisons dans l'âme |
    | le nectar | la raison qui descend de l'Intellect |
    | le jardin de Zeus | la splendeur des raisons |
    | Pénia | l'indétermination, la matière |

    ! L'allégorie n'est pas une grille de clés fixes : Poros et le nectar disent tous deux les raisons ; le mythe sert d'exposition à la philosophie.
