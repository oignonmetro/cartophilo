- id: traite50-l2
  title: "Éros dieu, fils d'Aphrodite"
  notes: |-
    **Deux généalogies** (2, 1-10) : Platon fait d'Éros « le fils d'Aphrodite », qui veille sur les beaux enfants ; mais dans le *Banquet*, il est conçu le jour de la naissance d'Aphrodite, de l'union de Poros et de Pénia. Plotin ne les oppose pas : il donne un sens à chacune, par **l'allégorie**.

    **Deux Aphrodites** (2, 10-46) :

    | Aphrodite | Origine | Ce qu'elle est |
    | la céleste, Ourania | née de Kronos, « sans mère » | l'âme divine, sans part à la matière |
    | la fille de Zeus et de Dioné | veille sur les unions d'ici-bas | l'âme du monde |

    Kronos est l'Intellect. L'âme céleste, éperdue d'amour pour lui, a engendré Éros : il est **l'œil** de ce qui désire, l'intermédiaire entre l'amant et l'aimé.

    **Éros, vision** (chap. 3) : Éros est une réalité, issue de l'âme tournée vers l'Intellect, comme l'âme vient de l'Intellect tourné vers l'Un. Son nom vient de `hórasis`, **la vision** : un œil rempli de ce qu'il contemple. L'âme du monde engendre un second Éros, attaché aux unions, qui pourtant ramène vers le haut les âmes aptes à se souvenir.

    **Un Éros pour chaque âme** (chap. 4) : chaque âme a son Éros, **le démon** qui accompagne chacun ; les Éros particuliers sont dans l'Éros universel comme les âmes dans l'âme universelle. Éros est l'acte de l'âme qui s'efforce vers le bien : **dieu** pour l'âme pure, **démon** pour l'âme mélangée.

    ! Les deux généalogies de Platon ne se contredisent pas : Éros fils d'Aphrodite et Éros fils de Poros et de Pénia disent deux aspects d'une même réalité.
