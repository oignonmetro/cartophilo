- id: traite50-l4
  title: "Repérage : le plan du traité 50"
  notes: |-
    **Le traité 50 traite de l'amour comme passion (chap. 1), comme dieu, fils d'Aphrodite (chap. 2-4), puis comme démon, fils de Poros et de Pénia (chap. 5-9).**

    | Moment | Lieu | Ce qui s'y joue |
    | la question | 1, 1-10 | dieu, démon ou passion |
    | le principe de l'amour | 1, 10-26 | une parenté avec le beau |
    | plaidoyer pour l'amour sensible | 1, 26-38 | enfanter dans le beau |
    | trois formes d'amour | 1, 38-65 | pur, mixte, dévoyé |
    | les deux généalogies | 2, 1-10 | Aphrodite ; Poros et Pénia |
    | deux Aphrodites | 2, 10-32 | la céleste, née de Kronos |
    | Éros, œil de l'âme | 2, 32-46 | l'œil de ce qui désire |
    | Éros, vision | 3, 1-27 | hórasis |
    | l'Éros du monde | 3, 27-38 | les unions d'ici-bas |
    | l'Éros de chaque âme | chap. 4 | le démon de chacun |
    | pas le monde sensible | chap. 5 | sans chaussures, sans maison |
    | les démons | chap. 6 | une matière intelligible |
    | Poros et Pénia | chap. 7 | ivre de nectar |
    | Zeus et Aphrodite | chap. 8 | une âme royale |
    | le jardin et l'usage des mythes | chap. 9 | morceler, puis réassocier |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! Le premier chapitre est le seul sur l'amour comme passion ; tout le reste du traité porte sur Éros comme réalité, dieu ou démon.
