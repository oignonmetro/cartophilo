- id: traite3-l2
  title: "Ni le hasard des épicuriens, ni la nécessité des stoïciens"
  notes: |-
    **Plotin commence par réfuter deux positions contradictoires** : ou bien rien ne correspond à un « destin », et tout est contingent et hasardeux ; ou bien le destin, assimilé à la providence, gouverne jusqu'au moindre événement, et tout est nécessaire.

    **La première position est celle des épicuriens.** Leurs dieux bienheureux ignorent les affaires humaines (Lucrèce, II, 167-183) ; l'ordre du monde (les « pactes de la nature ») n'est établi qu'après coup, par les rencontres hasardeuses des atomes. À la racine des choses, ni l'Un ni le Bien d'Aristote, mais le **Tourbillon** (la `Dínē` de Démocrite). Plotin souligne, avec les stoïciens et Cicéron, la disproportion entre ces causes et la beauté du monde : autant croire que des lettres jetées au sol composeraient les *Annales* d'Ennius.

    **La seconde est celle des stoïciens.** Plotin n'en reprend pas l'arme principale, la **prédestination universelle** (« Tout ce qui arrive, arrive justement », Marc Aurèle). Il retourne contre elle l'objection épicurienne des **maux** : Zeus étant immanent au monde, le mal se réduit à une erreur de jugement. Plotin, lui, n'édulcore ni la cruauté des hommes (le tyran, chap. 8) ni la violence de la nature : vices, maladies et mort s'expliquent par la **matière** (traités 12, 26, 51).

    | École | Son erreur |
    | épicuriens | nier la providence |
    | stoïciens | placer la providence dans le sensible |

    **Seul un monde intelligible autonome et parfait concilie la réalité des maux et la perfection divine** : la doctrine de la procession est à l'arrière-plan du destin plotinien.

    ! Plotin prend aux stoïciens leurs critiques du hasard, et aux épicuriens leurs objections à la providence : il combat chaque école avec les armes de l'autre.
