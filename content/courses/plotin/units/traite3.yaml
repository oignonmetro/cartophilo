- id: traite3-l5
  title: "Repérage : le plan du traité 3"
  notes: |-
    **Le traité 3 pose le principe de causalité (chap. 1), recense cinq opinions sur les causes lointaines (chap. 2), les réfute (chap. 3-7), puis expose la conception plotinienne du destin (chap. 8-10).**

    | Moment | Lieu | Ce qui s'y joue |
    | tout ce qui devient a une cause | chap. 1 | causes prochaines et causes lointaines |
    | les cinq opinions | chap. 2 | atomes, éléments, destin, astres, enchaînement des causes |
    | les causes corporelles | chap. 3 | contre les épicuriens et les « physiologues » |
    | le déterminisme absolu | chap. 4 | il abolit le destin comme notre autonomie |
    | les astrologues | chap. 5-6 | leur opinion abolit aussi notre autonomie |
    | l'enchaînement stoïcien | chap. 7 | il abolit notre autonomie et multiplie les intermédiaires |
    | l'âme, cause lointaine | chap. 8 | séparée, libre ; dans un corps, libre selon sa bonté |
    | l'action volontaire | chap. 9 | réglée sur la raison pure, l'âme agit volontairement |
    | conclusion | chap. 10 | deux espèces de causes : l'âme et les causes extérieures |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! Les cinq opinions sont posées ensemble au chapitre 2, puis réfutées une à une aux chapitres 3 à 7, dans le même ordre.
  points:
  - id: traite3-l5-p1
    sentence: "Dans le traité 3 de Plotin, la distinction des causes prochaines et des causes lointaines est posée au ___."
    answer: "chap. 1"
    alt: ["1", "chapitre 1"]
  - id: traite3-l5-p2
    sentence: "Dans le traité 3 de Plotin, les cinq opinions sur les causes lointaines (atomes, éléments, destin, astres, enchaînement des causes) sont exposées au ___."
    answer: "chap. 2"
    alt: ["2", "chapitre 2"]
  - id: traite3-l5-p3
    sentence: "Dans le traité 3, les « physiologues » font des ___ les causes lointaines, comme les épicuriens en font les atomes."
