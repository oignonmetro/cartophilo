- id: traite3-l4
  title: "Plotin et les astres"
  notes: |-
    **L'astrologie comptait à l'époque de Plotin, et Plotin lui accordait du crédit.** Porphyre rapporte (*Vie de Plotin*, 2, 36-37) qu'il refusait de révéler le mois et le jour de sa naissance, peut-être pour ne pas aider ses ennemis à attirer sur lui l'influence maléfique des astres.

    **L'anecdote d'Olympius** (*Vie de Plotin*, 10, 1-13) le confirme. **Olympius d'Alexandrie**, ancien élève d'**Ammonius**, jaloux de Plotin, voulut précipiter sur lui par la magie l'influence des astres (`astrobolē̂sai`) ; mais l'entreprise se retourna contre lui. Plotin ressentit l'agression : son corps était alors contracté « comme la bourse que l'on resserre ».

    **Les astres sont des divinités éternelles, qui pensent et accomplissent une action en partie démiurgique**, mais Plotin limite leur action : ils ne font que donner des **« signes »** de l'avenir, que certains hommes savent déchiffrer. Le traité 52 (II, 3), *Sur l'influence des astres*, y reviendra.

    **Il y a une tension dans la position plotinienne** :

    | Tantôt | Proche de |
    | la contingence du sublunaire | Alexandre d'Aphrodise et les péripatéticiens |
    | la liaison universelle | le fatalisme stoïcien (traités *Sur la providence*) |

    ! Les astres signifient l'avenir, ils ne le causent pas : l'opinion des astrologues, qui en fait des causes, abolit notre autonomie (chap. 5-6).
  points:
  - id: traite3-l4-p1
    sentence: "Selon Porphyre, Plotin refusait de révéler le mois et le jour de sa ___, peut-être par crainte qu'on attire sur lui les puissances maléfiques des astres."
    answer: "naissance"
