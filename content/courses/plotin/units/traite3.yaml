- id: traite3-l3
  title: "Providence n'est pas destin : causes lointaines et causes prochaines"
  notes: |-
    **Plotin tient deux thèses à la fois.** Contre le nécessitarisme stoïcien, il accepte le **hasard** dans le sensible : tout n'est pas prévisible, même pour une intelligence infinie. Contre le matérialisme épicurien, il pense qu'une **providence** divine gouverne le monde. Comme plus tard chez **Leibniz**, le réel sensible est le meilleur possible, avec d'inévitables maux (les traités 47 et 48, III, 2-3, célébreront l'âme qui coordonne le ciel et la terre).

    **Mais providence n'est pas destin.** La providence, qui correspond à peu près à l'activité de l'**âme du monde**, fixe le cadre rationnel du devenir sans agir dans chaque action. D'où la distinction des **causes lointaines** et des **causes prochaines** (chap. 1-2) : le voleur et l'assassin sont responsables de leurs actes, sans que l'ensemble des causes cosmiques puisse justifier l'inacceptable ; même les circonstances « atténuantes » n'effacent pas le poids de la décision.

    **Le destin, selon Plotin, est l'ultime trace de la providence** : non une liaison nécessitante comme le cycle des saisons, mais une liaison telle que nos actes peuvent dans une certaine mesure être prévus. Plotin ne condamne donc ni la **divination** ni l'**astrologie**.

    - La cause lointaine est l'**âme**, celle de l'univers et celle de l'individu (chap. 8).
    - Séparée du corps, l'âme est libre ; dans un corps, sa liberté varie avec sa **bonté** (chap. 8).
    - Sous l'emprise de l'extérieur, elle n'agit pas volontairement ; réglée sur la raison pure, si (chap. 9).
    - Conclusion : **deux espèces de causes**, l'âme et les causes extérieures (chap. 10).

    ! Accepter le hasard ne revient pas à nier la providence : la providence trace le cadre, le hasard et la décision jouent à l'intérieur.
  points:
  - id: traite3-l3-p1
    sentence: "Contre le nécessitarisme stoïcien, Plotin accepte l'existence du ___ dans le monde sensible : tout n'est pas prévisible."
    answer: "hasard"
    alt: []
