id: traite3
title: "Traité 3 (III, 1) : Sur le destin"
subtitle: "Causes lointaines, causes prochaines, liberté"
icon: compass
color: sky
lessons:
- id: traite3-l1
  title: "Une tradition : les traités Du destin"
  notes: |-
    **Après le traité 1 (refuser les prestiges du sensible) et le traité 2 (la nécessité pour l'âme de descendre dans le sensible), le traité 3 médite sur le destin**, et donc sur la responsabilité humaine. L'exigence de « fuite » du traité 1 (chap. 8) signifie-t-elle un mépris du corporel, une inquiétude face à un univers sans raison ?

    **Plotin s'inscrit dans une tradition vivace de la philosophie hellénistique.** Trois traités *Du destin* antérieurs nous sont parvenus en entier :

    | Auteur | Date |
    | Cicéron | 44 av. J.-C. |
    | le pseudo-Plutarque | première moitié du IIe siècle apr. J.-C. |
    | Alexandre d'Aphrodise | entre 198 et 209 apr. J.-C. |

    - Le traité de **Cicéron** résume les critiques de **Carnéade** contre le *Du destin* du stoïcien **Chrysippe**. Chrysippe soutenait que tout arrive par des causes antécédentes ; Carnéade refusait à la fois ce déterminisme et la thèse épicurienne d'une volonté agissant sans cause.
    - Le **pseudo-Plutarque** pose que le possible et le contingent l'emportent sur le nécessaire : place pour la délibération et le choix, caractérisés par la tendance (`hormḗ`), la délibération et le choix (`proaíresis`).
    - Le traité d'**Alexandre d'Aphrodise**, que Plotin connaissait, résume tous les arguments pour le libre arbitre des écoles opposées au stoïcisme.

    Ces traités, avec les écrits sur la providence (Épictète), formaient la clef de voûte des systèmes providentialistes : physique de l'enchaînement des mouvements, théologie de la puissance des dieux, éthique de la responsabilité.

    ! Le traité 3 n'est pas isolé : une bonne part de ses arguments vient de cette tradition, en particulier d'Alexandre d'Aphrodise.
