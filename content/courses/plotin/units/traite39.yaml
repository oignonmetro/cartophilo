- id: traite39-l4
  title: "Le Bien, volonté de lui-même"
  notes: |-
    **L'âme nullement persuadée** (chap. 12) : l'interlocuteur proteste. Plotin repart de nous : par notre âme, nous sommes une réalité mêlée de différence, et la réalité en soi est maîtresse de nous ; mais nous sommes, d'une certaine façon, ce qui est notre maître. Ce qui a rendu libre la réalité, le « libérateur », ne peut être asservi.

    **Pour persuader** (13, 1-5) : désormais, Plotin avance des arguments **pour persuader**, en relâchant la rigueur ; chaque terme s'entend précédé d'un « pour ainsi dire » (13, 49-50).

    **Volonté et réalité** (chap. 13) : ses actes sont comme sa volonté, et comme sa réalité : il **existe comme il l'a voulu**. Chaque être désire le Bien plus que lui-même, et se veut lui-même dès qu'il le possède ; a fortiori, le Bien **s'est choisi lui-même** et ne voudrait pas devenir autre chose. **Il s'est lui-même produit.**

    **Cause de soi** (chap. 14) : l'homme particulier naît par hasard, non l'essence de l'homme ; a fortiori ce qui l'engendre. Chaque être a en lui sa cause, comme le visage explique la longueur des pieds ; le Bien est **cause de lui-même**.

    **Amour de soi** (chap. 15) : il est objet d'amour et amour, **amour de soi**. En nous aussi, une lumière qui a la forme du Bien nous rend plus que libres. La racine de la raison est comme le principe d'un arbre immense.

    **Partout et nulle part** (chap. 16) : il se porte vers l'intérieur de lui-même ; il est le résultat de son propre acte ; sa **veille** et sa **superintellection** s'exercent sans cesse, au-delà de la réalité et de l'Intellect.

    Ce vocabulaire de l'acte, de la vie, de l'intellection vient du livre Λ de la *Métaphysique* : Plotin parle la langue d'un interlocuteur péripatéticien. La cause de soi aura une longue postérité : Proclus la refuse à l'Un, mais Marius Victorinus la fait passer dans la théologie chrétienne.

    ! Ces énoncés positifs ne font pas du Bien un Intellect : ils servent à persuader, et chacun s'entend « pour ainsi dire ».
