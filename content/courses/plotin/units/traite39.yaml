- id: traite39-l5
  title: "Images du Bien : tout entier volonté"
  notes: |-
    **Au-delà de la providence** (chap. 17) : l'univers est tel qu'il serait si un producteur l'avait voulu par calcul ; mais ses raisons sont toujours dans l'être, en repos intellectif : la réalité intelligible est **au-delà de la providence et du choix**. Le principe est la **raison une**, le nombre un.

    **Le cercle et la lumière** (chap. 18) : cherche à l'intérieur. Le Bien est comme le **centre** d'un cercle : les rayons et la circonférence en tiennent leur puissance, et n'en sont que des traces ; le Bien est **un Intellect dans l'unité**. Il est comme une source de lumière, dont l'Intellect est le **reflet**, et la cause de la cause. Platon parle de « ce qui doit être » et de « moment favorable ».

    **Au-delà de la réalité** (chap. 19) : qui le voit ne peut plus dire « comme il est advenu par accident ». Il est « au-delà de la réalité » : il l'a produite et laissée hors de lui.

    **L'autoproduction** (chap. 20) : naît-il avant de naître ? Non : il faut lui donner le rang non de produit mais de **producteur** ; son acte premier est **sans réalité**. « Se produire soi-même » dit la coïncidence de l'acte et de soi ; « se commander » veut dire qu'il n'y avait rien avant lui.

    **Tout entier volonté** (chap. 21) : pouvoir les contraires est le fait de celui qui ne peut rester dans le meilleur ; sa puissance est inébranlable. Il était **tout entier volonté**. « Se contenir » veut dire que tout est contenu en lui. Conclusion : **retranche toutes les autres choses** ; il est seul, vraiment libre, car il n'est pas même asservi à lui-même.

    ! Le Bien n'a pas le pouvoir des contraires : ne pas pouvoir faire le mal n'est pas une impuissance, mais la plus grande puissance.
