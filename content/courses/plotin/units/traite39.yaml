- id: traite39-l3
  title: "Le discours téméraire et la voie négative"
  notes: |-
    **Degrés de liberté** (7, 1-6) : l'âme est libre quand, grâce à l'Intellect, elle se hâte vers le Bien ; l'Intellect est libre de son propre fait ; le Bien est ce grâce à quoi les autres choses dépendent d'elles-mêmes.

    **Le discours téméraire** (7, 11-46) : armé d'arguments venus d'ailleurs, il soutient que le Bien, n'étant pas maître de ce qu'il est, n'est pas libre ; c'est sans doute encore Alexandre. Réponse : ce discours détruit la notion même de ce qui dépend de nous ; il ne voit de liberté que dans un acte contraire à sa nature. Le Bien est **seul**, non parce qu'il est empêché d'être autrement, mais parce qu'il se complaît en lui-même. En lui, existence et acte ne font qu'un.

    **La voie négative** (chap. 8) : nous ne pouvons rien dire qui lui convienne en propre. Il faut tout écarter de lui : ce qui dépend de soi, la libre détermination ; **retranchons jusqu'au « est »**, et même « selon le développement de sa nature ». Est-il donc devenu ainsi par accident ? Non : il n'est pas venu.

    **Ni hasard ni nécessité** (chap. 9-10) : le principe de tout ne peut être par hasard sans être une réalité déficiente. Il est seul, sans nécessité ; il est ce qu'il devait être, et les autres choses attendent de voir comment leur **roi** se manifeste. On ne peut même pas dire qu'il est « ainsi ». Le hasard n'engendre ni l'Intellect, ni la raison, ni l'ordre. S'il ne va pas vers le pire, ce n'est pas impuissance, mais **surabondance de puissance** : il est pour les autres la nécessité et la loi.

    | Thèse rejetée | Pourquoi |
    | le Bien existe par hasard | le hasard n'engendre ni l'Intellect, ni la raison, ni l'ordre |
    | le Bien existe par nécessité | la nécessité n'est que dans ce qui le suit ; il est la nécessité des autres |

    **Hors des catégories** (chap. 11) : il faut s'éloigner en silence. Aucune question de la recherche ne lui convient : ce qu'est la chose, comment elle est, ce qui la fait être, si elle est. Nos difficultés viennent de ce que nous le mettons dans un **lieu** ; il n'a ni quantité, ni qualité, ni relation.

    ! L'hypothèse du hasard n'est pas le discours téméraire : c'est une objection à Plotin, qui refuse au Bien l'existence nécessaire selon sa nature.
