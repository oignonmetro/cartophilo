id: traite39
title: "Traité 39 (VI, 8) : Sur le volontaire et sur la volonté de l'Un"
subtitle: "La liberté du Bien"
icon: compass
color: sky
lessons:
- id: traite39-l1
  title: "Ce qui dépend de nous"
  notes: |-
    **Un traité sur la métaphore** : `metaphérein` veut dire « transporter ». Peut-on transférer aux premiers principes, l'Intellect et le Bien, le vocabulaire de l'action humaine : « ce qui dépend de nous », la libre disposition de soi, la volonté ? Plotin doit à la fois oser parler du principe et se défier du langage.

    **Contre Alexandre d'Aphrodise** : dans son *Traité du destin*, l'interprète d'Aristote refuse que leur nature dépende des dieux ; la liberté est pour lui le choix entre des **contraires**, qui suppose la contingence. Plotin s'ouvre sur la question : « est-il possible de chercher, même à propos des dieux, si quelque chose dépend d'eux ? ».

    **D'abord nous-mêmes** (1, 13-30) : quand le hasard, la nécessité et les passions nous dominent, nous nous demandons si nous ne sommes pas rien. Ce qui dépend de nous, c'est ce que nous accomplissons sans être asservis au hasard, à la nécessité et aux passions, ce que nous voulons sans obstacle.

    **Le volontaire et ce qui dépend de nous** (1, 30-44) :

    | Notion | Définition |
    | le volontaire | ce qui n'est pas exécuté sous la contrainte et s'accompagne d'un savoir |
    | ce qui dépend de nous | ce que nous accomplissons en en étant aussi les maîtres |

    Œdipe, maître de tuer, n'agit pas volontairement s'il ignore que la victime est son père. Plotin renverse Alexandre : c'est le volontaire qui suppose le savoir. Et, contre Aristote, le volontaire demande la connaissance **de l'ensemble**, non seulement des détails : Plotin défend le mot socratique, nul n'est méchant volontairement.

    **Où situer ce qui dépend de nous ?** (chap. 2-3) : ni dans la colère ni dans le désir physique, sinon les enfants, les animaux et les fous seraient libres ; ni dans un désir mené par son objet, car ce qui est en manque n'est pas maître de ce vers quoi il est mené ; ni dans l'opinion droite, si l'on ignore pourquoi elle est droite ; ni dans la représentation éveillée par les humeurs du corps. **La libre disposition de soi remonte à l'acte de l'Intellect** : elle appartient aux dieux qui vivent selon l'intellect.

    ! Pour Plotin, être libre n'est pas pouvoir choisir entre des contraires : c'est n'être asservi à rien d'extérieur.
