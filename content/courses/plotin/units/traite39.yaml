- id: traite39-l2
  title: "La liberté de l'Intellect et de la vertu"
  notes: |-
    **L'objection** (4, 1-11) : le désir est mené par son objet ; et l'Intellect, qui ne peut pas ne pas faire ce qu'il est, est-il libre s'il est asservi à sa propre nature ? C'est l'objection d'Alexandre.

    **Réponse** (4, 11-40) : on n'est asservi que si l'on est contraint de suivre autre chose. Ce qui va vers le bien y va volontairement ; on blâme l'esclavage non parce que l'esclave ne peut aller vers le mal, mais parce qu'il ne peut aller **vers son bien propre**. Parler d'asservissement à sa nature, c'est faire une dualité ; là-bas, **être et agir sont une même chose**. L'Intellect qui existe selon le Bien n'en est que plus libre.

    **La vertu et l'action** (chap. 5) : nous ne sommes pas maîtres du hasard, ni de la réussite. Le courage suppose la guerre ; la vertu, si on lui laissait le choix, préférerait le repos, comme Hippocrate préfère que personne n'ait besoin de son art. La vertu comme disposition, qui « n'a pas de maître » (*République*), est **comme un autre intellect**.

    **La volonté du Bien** (chap. 6) : la vertu ne se laisse pas entraîner par les circonstances ; elle sacrifierait un individu en vue de sa propre beauté. Ce qui est **immatériel** est libre. La volonté de l'Intellect, c'est son intellection : ce qu'on appelle volonté imite ce qui est conforme à l'Intellect. **Nous situons ce qui dépend de nous dans la volonté du Bien.**

    Trois traits font cette liberté : l'intériorité, l'indépendance à l'égard du dehors, que Plotin doit aux stoïciens, en particulier à Épictète ; l'identité de la volonté et de l'intellection ; l'orientation vers le Bien.

    ! L'Intellect n'est pas asservi à sa nature : en lui, la nature et l'acte ne font qu'un, et son acte est tourné vers le Bien.
