    **Le traité 39 définit la liberté dans l'âme et dans l'Intellect (chap. 1-6), introduit le discours téméraire (chap. 7), suit la voie négative vers le Bien (chap. 8-11), repart de notre expérience (chap. 12), puis tient sur sa liberté un discours positif (chap. 13-21).**

    | Moment | Lieu | Ce qui s'y joue |
    | l'objet de la recherche | 1, 1-13 | même à propos des dieux |
    | ce qui dépend de nous, chez l'homme | 1, 13-30 | le hasard, la nécessité, les passions |
    | le volontaire et ce qui dépend de nous | 1, 30-44 | Œdipe |
    | quelle faculté de l'âme ? | chap. 2 | ni la colère ni le désir |
    | de l'opinion à l'Intellect | chap. 3 | la représentation |
    | l'objection d'Alexandre | chap. 4 | asservi à sa nature ? |
    | la vertu et la liberté | chap. 5 | Hippocrate |
    | la liberté de l'Intellect | chap. 6 | la volonté du Bien |
    | le discours téméraire | chap. 7 | ce qui est seul |
    | la voie négative | chap. 8 | retrancher jusqu'au « est » |
    | ni accident ni nécessité | chap. 9 | le roi |
    | le hasard et la cause | chap. 10 | la surabondance de puissance |
    | hors des catégories | chap. 11 | s'éloigner en silence |
    | la liberté en nous | chap. 12 | nullement persuadée |
    | le discours positif | chap. 13 | pour ainsi dire |
    | cause de soi | chap. 14 | l'essence de l'homme |
    | amour de soi | chap. 15 | la racine et l'arbre |
    | partout et nulle part | chap. 16 | la superintellection |
    | au-delà de la providence | chap. 17 | la raison une |
    | images du Bien | chap. 18 | le centre et le cercle |
    | au-delà de la réalité | chap. 19 | la parole des Anciens |
    | l'autoproduction | chap. 20 | producteur, non produit |
    | tout entier volonté | chap. 21 | retrancher toutes choses |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! Le basculement a lieu au début du chapitre 13 : la rigueur négative cède à un discours fait pour persuader.
