- id: traite5-l5
  title: "De quoi y a-t-il des Formes ?"
  notes: |-
    **Le chapitre 9 pose la question qui court jusqu'à la fin : « Quelles sont donc les choses qui se trouvent dans l'unité de l'Intellect ? »** C'est le problème de la structure et de l'extension du monde intelligible, déjà débattu dans l'Ancienne Académie.

    **Le chapitre 10** nie l'existence de Formes des choses contraires à la nature, et rappelle que le monde intelligible, sans temps ni espace, n'est que « réalité, réalité intelligible et vie », selon le *Sophiste*.

    | Formes de quoi | Réponse |
    | des techniques (chap. 11) | non, elles mêlent l'intelligible au sensible ; seulement en l'homme qui contemple ; la géométrie, oui |
    | des individus (chap. 12) | une Forme de l'homme, pas de Socrate ; la question de l'individu reste ouverte |
    | de ce qui n'est pas visible (chap. 13) | si le sensible comprend l'âme, tout ce qui est dans le sensible est aussi Forme dans l'intelligible |
    | de la boue, des composés accidentels (chap. 14) | non : ils naissent au hasard, de la matière |

    **La fin du traité, au texte sans doute corrompu, esquisse une hiérarchie de l'âme** : la Forme de l'âme, dans l'Intellect ; l'Âme hypostase, qui vient de cette Forme ; les âmes individuelles, mêlées aux corps.

    **La question majeure est seulement posée (chap. 14, 1-5)** : si l'Intellect est déjà multiple, comment remonter à l'unité absolue de l'Un ? Et si l'Un est simple, d'où vient la multiplicité ? Plotin remet sa réponse au traité 7 (V, 4) : « Cela, il faut le dire en prenant un autre point de départ. »

    ! Le traité 5 est « scolaire » : il n'expose pas explicitement la hiérarchie des hypostases ni la procession depuis l'Un, à peine évoquées.
  points:
  - id: traite5-l5-p1
    sentence: "Le monde intelligible, sans temps ni espace, n'est selon le traité 5 (chap. 10) que « réalité, réalité intelligible et ___ », d'après le *Sophiste*."
