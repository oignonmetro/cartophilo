- id: traite5-l3
  title: "L'Intellect : toujours en acte, il se pense lui-même"
  notes: |-
    **Chapitre 3 : toutes choses sont composées d'une matière et d'une forme, et la forme leur vient de l'âme.** Mais l'âme aussi a une forme, qui lui vient de l'**Intellect**, lequel est cette forme. Comme Aristote distinguait intellect agent et intellect passif (*De l'âme*, III, 5), Plotin distingue en l'Intellect une fonction **active** (il donne la forme à l'âme) et une fonction **passive** (il est cette forme). À l'échelle de l'univers, l'Intellect fournit à l'Âme ses **`λόγοι`**, ses « raisons » : les `λόγοι` sont les Formes à un niveau inférieur, celui de l'Âme.

    **Chapitre 4 : l'Intellect est supérieur à l'âme**, argument aristotélicien, parce qu'il est **toujours en acte**, et que l'acte est antérieur à la puissance. Il porte l'âme à l'acte, il est impassible quand elle est sujette aux affections, il est hors du monde quand elle est dans le monde. Contre les stoïciens, pour qui l'Intellect est l'âme « qui parvient à sa perfection ».

    **Chapitre 5 : que pense l'Intellect ?** Toujours en acte, il ne peut recevoir la pensée de l'extérieur : il **se pense lui-même** (Aristote, *Métaphysique*, Λ, 9). Or se penser soi-même, c'est penser les Formes, qui sont en lui, « identiques à lui-même ». Dans le sensible, il n'y a que leurs images, des formes « sur la matière » (`ἐπὶ ὕλῃ`), sujettes à la génération et à la corruption.

    **Chapitre 6 : l'Intellect est « toutes les choses ensemble »**, une unité organique où chaque Forme reste une **puissance particulière**, comme les sciences dans l'âme, ou les puissances dans une **semence**.

    ! Se penser soi-même n'est pas un repli vide : c'est penser tout l'intelligible, puisque les Formes sont l'Intellect.
  points:
