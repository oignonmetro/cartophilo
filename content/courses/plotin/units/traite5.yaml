id: traite5
title: "Traité 5 (V, 9) : Sur l'Intellect, les idées et ce qui est"
subtitle: "L'Intellect et les Formes"
icon: compass
color: sky
lessons:
- id: traite5-l1
  title: "Trois genres d'hommes : où se trouve le savoir"
  notes: |-
    **L'argument du traité 5 se divise en trois parties inégales** : les chapitres 1-2 définissent la véritable philosophie ; les chapitres 3-6 analysent l'Intellect, son activité (la pensée) et ses objets (les Formes) ; les chapitres 7-14 montrent comment les Formes sont les modèles du sensible tout en restant dans l'intelligible.

    **Plotin hiérarchise les trois grandes écoles de son temps selon leur conception du savoir :**

    | Genre d'hommes | École | Où ils placent le savoir |
    | le plus bas | épicuriens | la sensation ; le savoir coïncide avec la recherche du plaisir |
    | au-dessus | stoïciens | la vie pratique, la priorité des valeurs éthiques |
    | le plus haut | platoniciens | la contemplation de ce qui est au-delà d'ici-bas |

    - Les stoïciens « s'élèvent quelque peu des choses d'ici-bas », mais, faute de monde intelligible, ils n'ont « pas d'autre lieu où se poser ».
    - Les platoniciens montent, par l'amour du beau, des beautés sensibles à celle de l'âme, puis à la beauté intelligible : c'est le modèle d'ascension du *Banquet* (210b3-c6).

    **La thèse majeure est déjà là : il existe un monde intelligible séparé du sensible**, qui contient toutes les réalités véritables. Elle exclut les doctrines épicurienne et stoïcienne, toutes deux « somatiques » (toute réalité est un corps, `σῶμα`).

    ! Les stoïciens ne sont pas mis au même rang que les épicuriens : leur éthique les élève « quelque peu », mais pas jusqu'à l'intelligible.
