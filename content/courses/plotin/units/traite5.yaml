- id: traite5-l6
  title: "Repérage : le plan du traité 5"
  notes: |-
    **Le traité 5 va de la vraie philosophie (chap. 1-2) à l'Intellect (chap. 3-6), puis aux Formes (chap. 7-10) et à la liste des Formes (chap. 11-14).**

    | Moment | Lieu | Ce qui s'y joue |
    | trois genres d'hommes | chap. 1 | sensation, vie pratique, contemplation |
    | monter au-delà | chap. 2 | du beau sensible à l'Intellect, beau par lui-même |
    | la nature de l'Intellect | chap. 3 | matière et forme ; l'Intellect donne les raisons à l'Âme |
    | l'Intellect supérieur à l'Âme | chap. 4 | il est en acte |
    | que pense l'Intellect | chap. 5 | il se pense lui-même, il est ce qu'il pense |
    | toutes choses ensemble | chap. 6 | l'image des semences |
    | les sciences | chap. 7 | l'intelligible est antérieur à l'intellection |
    | l'Intellect et les Formes | chap. 8 | une seule nature |
    | l'unité de l'Intellect | chap. 9 | il contient les archétypes du tout |
    | le monde intelligible | chap. 10 | réalité, réalité intelligible et vie ; le mal |
    | les techniques | chap. 11 | pas de Formes, sauf en l'homme ; la géométrie |
    | les individus | chap. 12 | une Forme de l'homme, pas de Socrate |
    | ce qui n'est pas visible | chap. 13 | l'âme en soi, l'intellect en soi |
    | les choses sans valeur | chap. 14 | ni boue ni composés accidentels ; la hiérarchie de l'âme |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! La question « que pense l'Intellect ? » (chap. 5) vient après sa supériorité sur l'Âme (chap. 4) : on sait d'abord qu'il est en acte, puis ce qu'est son acte.
