- id: traite5-l2
  title: "Les sources : Platon, Aristote, le médioplatonisme"
  notes: |-
    **Le traité 5 porte sur le statut des intelligibles dans leur rapport au sensible : Plotin y part de Platon**, mais emprunte aussi à Aristote et au médioplatonisme.

    **Platon.** Les **Formes** (`εἴδη`) ou **Idées** (`ἰδέαι`) sont éternelles, immobiles, identiques à elles-mêmes ; chaque espèce de choses sensibles, chaque relation, chaque qualité correspond à une seule Forme. Les choses sensibles y **« participent »** (`μέθεξις`), mais les Formes existent **« séparément »** (`χωρίς`), ce qui garantit leur supériorité. Elles sont connues par la pensée, non par la sensation : d'où le nom d'« intelligibles ». Elles fondent l'être des choses, la connaissance, et les noms.

    **Aristote.** Dans la *Métaphysique* (Z, H), la forme s'identifie à la substance (`οὐσία`). Pour les substances sensibles, elle n'est séparée de la matière que par abstraction : elle est toujours une **« forme dans la matière »** (`ἔνυλον εἶδος`).

    **Le médioplatonisme** (renaissance du platonisme aux Ier et IIe siècles) lit le *Timée* en identifiant le démiurge à un **Intellect divin** dont les Formes sont les **pensées**. En pensant les Formes, cet Intellect produit le monde sensible à leur image : c'est une solution au problème de la participation.

    ! Plotin reprend le vocabulaire médioplatonicien (les Formes, pensées de l'Intellect) mais pas sa thèse : pour lui, l'Intellect ne produit pas les Formes en les pensant.
  points:
