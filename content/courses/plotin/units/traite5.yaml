- id: traite5-l4
  title: "Les Formes : antérieures à l'Intellect, ou contemporaines"
  notes: |-
    **À partir des chapitres 7-8, Plotin définit encore les Formes comme les pensées de l'Intellect, mais pas au sens médioplatonicien** où l'Intellect les produirait en les pensant.

    **Les Formes sont « antérieures à l'Intellect »**, non pas chronologiquement (il n'y a pas de temps dans l'intelligible), mais parce que, sinon, ce serait **« par accident et par hasard »** que l'Intellect les pense. S'il ne les avait pas déjà toutes à sa disposition, que penserait-il ?

    Autrement dit, les Formes sont antérieures comme un **fondement** (ce qui fait la vérité de la pensée de l'Intellect), non comme des choses apparues avant lui : il ne les rencontre pas du dehors, il ne fait qu'un avec elles de toute éternité. Comme les principes d'une science sont logiquement antérieurs à ses théorèmes, alors que pour le savant accompli elle forme un tout simultané.

    **Cette antériorité est en réalité une contemporanéité** : une autre façon de dire l'identité de l'Intellect et des Formes, déjà établie aux chapitres 5-6. **L'intellection, les Formes et l'Intellect sont donc une même chose** (chap. 8, 17-22).

    **D'où vient alors le problème ?** De la condition humaine : c'est notre intellect qui pense par **distinction** et selon le **temps**, en posant un avant et un après, et qui sépare ce que l'Intellect tient dans son unité. Il serait fallacieux d'appliquer à l'intelligible les catégories du sensible, où tout est éparpillé et soumis au devenir.

    - Les sciences véritables ont pour objet les intelligibles et sont ce qu'elles pensent (chap. 7).
    - L'Intellect, étant toutes choses, ne cherche pas à les acquérir (chap. 7).
    - L'Intellect dans sa totalité est toutes les Formes, chaque Forme en est une partie (chap. 8).

    ! « Antérieures » ne veut pas dire « avant dans le temps » : Plotin veut seulement exclure que l'Intellect pense les Formes par hasard.
  points:
