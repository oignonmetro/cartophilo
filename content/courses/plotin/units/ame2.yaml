- id: ame2-l2
  title: "Comment l'âme du monde gouverne : sans peine, en contemplant"
  notes: |-
    **L'âme du monde fait ce que nous faisons, gouverner un corps, mais sans descendre ni pâtir : elle ordonne l'univers** {coral}**en contemplant ce qui la précède**{/coral}**, non en raisonnant.** C'est le modèle de ce que serait une âme qui gouverne sans tomber, et la mesure de notre chute.

    **Toute âme a deux orientations.** {teal}« Toute âme{/teal} possède une partie inférieure orientée {teal}__vers le corps__{/teal} et une partie supérieure orientée {teal}__vers l'Intellect__ »{/teal} ([[traite6|traité 6]], 8, 11-13). L'âme du tout met en ordre l'univers par sa partie tournée vers le corps, {teal}« {/teal}en demeurant au-dessus de lui {teal}__sans aucune peine__{/teal}, parce qu'elle {teal}ne procède pas en raisonnant{/teal}, comme nous, mais {teal}__en usant de l'Intellect__ »{/teal}, {yellow}comme {teal}« {/teal}la technique {teal}ne délibère pas »{/teal}{/yellow} (formule d'{sky}Aristote{/sky}, *Physique*, II, 8, 199b28). {yellow}Le maître artisan ne se demande pas quel geste faire : son art agit en lui{/yellow} ; de même, l'âme du monde n'a pas à calculer l'ordre du monde, elle l'a.

    **Non affairée, parce qu'elle ne s'occupe pas de son corps.** Le [[traite33|traité 33]] reprend la même idée contre les gnostiques : l'âme du monde demeure {teal}« {/teal}elle-même {teal}__non affairée__{/teal} parce qu'elle {teal}ne gouverne pas par la réflexion{/teal} ni ne rectifie quelque chose, mais qui, {teal}__par la contemplation de ce qui la précède__{/teal}, met en ordre {teal}avec une puissance merveilleuse »{/teal} (2, 1-18). D'où une loi remarquable : {teal}« {/teal}autant elle se consacre à {teal}la contemplation{/teal}, autant elle devient {teal}__plus belle et plus puissante__ »{/teal}. {coral}Ce n'est pas en s'occupant du monde qu'elle le gouverne mieux, c'est en regardant plus haut{/coral}.

    **Un regard qui ne se penche pas.** Au [[traite6|traité 6]], aucune préoccupation {teal}« {/teal}qui lui ferait faire {teal}__une inclinaison vers le bas__ »{/teal} ne la détourne de sa contemplation : elle {teal}« {/teal}demeure toujours {teal}__auprès des intelligibles__{/teal}, ordonnant par sa {teal}puissance non-affairée{/teal} cet univers{teal} »{/teal} (2, 49-53). L'{violet}inclinaison{/violet} ({blue}*neusis*{/blue}) est ici le mot de la chute : l'âme du monde ne s'incline pas.

    **Deux images du traité 27.**

    - {yellow}Le filet jeté dans l'eau{/yellow} : le monde est dans l'âme qui le soutient, s'étend aussi loin qu'elle, mais ne peut la retenir. **Ce n'est pas l'âme qui est dans le corps du monde, c'est le corps qui est en elle.**
    - {yellow}L'arbre gigantesque{/yellow} : la partie inférieure de l'âme du monde l'organise sans effort ni bruit, quand la partie inférieure de notre âme ressemble à {yellow}des vers nés dans une partie pourrie de l'arbre{/yellow}, et le reste de notre âme à {yellow}un agriculteur préoccupé par ces vers{/yellow}.

    ! L'âme du monde n'est pas impassible parce que son corps serait parfait : c'est l'inverse, son corps est parfait parce qu'elle le gouverne sans pâtir.
  points:
  - id: ame2-l2-p1
    sentence: "__L'âme du monde gouverne un corps sans descendre ni pâtir__ : elle ordonne l'univers en ___ ce qui la précède, non en raisonnant."
    answer: "contemplant"
