- id: ame2-l3
  title: "Nos âmes et l'âme du monde : sœurs, non parties"
  notes: |-
    **Nos âmes ont la même nature que l'âme du monde, et la même structure (une partie tournée vers l'Intellect, une partie vers le corps) : elles en diffèrent par la position qu'elles occupent, puisque** {coral}**l'âme du monde produit en restant auprès d'elle-même, tandis que les nôtres s'avancent vers ce qu'elles produisent**{/coral}.

    **Pourquoi l'âme du monde, et non les nôtres, a-t-elle produit le monde ?** ([[traite27|traité 27]], chap. 6). Elles sont pourtant de même espèce. Mais {green}l'âme du monde n'a pas quitté l'âme totale{/green} : elle est restée là-bas et garde son corps autour d'elle ; les autres âmes ont reçu une part d'un corps qui existait déjà, {yellow}comme si l'âme du monde, {teal}« {/teal}pour ainsi dire {teal}leur sœur »{/teal}, leur avait préparé des demeures{/yellow}. Elle contemple l'Intellect tout entier, les autres surtout leurs intellects partiels.

    | | L'âme du monde | Nos âmes |
    | **Ce qu'elle contemple** | l'Intellect tout entier | surtout un intellect partiel |
    | **Comment elle produit** | en restant auprès d'elle-même | en s'avançant vers ses produits |
    | **Son corps** | gardé autour d'elle | une part d'un corps déjà là |
    | **Comment elle gouverne** | sans peine, par l'Intellect | en raisonnant, troublée par les sensations |

    **Nos âmes ont aussi le principe supérieur.** Les âmes partielles possèdent elles aussi ce qui est tourné vers l'Intellect, mais elles sont **sans répit occupées par la sensation** et par beaucoup de choses contraires à leur nature, qui les troublent ([[traite6|traité 6]], chap. 8). La différence n'est donc pas de nature, mais d'**attention** : l'âme du monde regarde en haut, nous regardons notre corps.

    **Ce qui distingue les âmes entre elles** ([[traite27|traité 27]], chap. 8) : leurs corps, mais surtout leurs caractères, leur raison discursive et leurs vies antérieures. Toutes sont toutes choses, mais {teal}« {/teal}une âme {teal}__est et devient__{/teal} ce que précisément {teal}__elle contemple__ »{/teal} (8, 15-16).

    **Une ressemblance : engendrer.** L'âme du monde a produit le cosmos ; l'âme humaine parvenue à maturité **se reproduit**. On peut y voir une même finalité : {amber}repeupler le monde sensible de la perfection de l'Intellect{/amber}. Et le désir qui accompagne la reproduction a son rôle : par la contemplation d'une autre âme associée à un corps, il permet de **se remémorer l'Un**, objet du désir absolu. Toutes les âmes se ressemblent ainsi par l'importance qu'y prend le **désir**.

    ! « Sœur » dit exactement le rapport : même origine, même nature, rangs différents. L'âme du monde n'engendre pas nos âmes ; elle leur prépare seulement un monde où vivre.
