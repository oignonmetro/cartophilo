- id: ame2-l1
  title: "Trois âmes, une seule réalité"
  notes: |-
    **L'Âme hypostase, l'âme du monde et nos âmes ne sont pas trois sortes d'âmes, mais une même réalité, nommée selon la fonction qu'elle remplit : ce qui les distingue n'est pas leur nature, c'est** {coral}**le corps qu'elles gouvernent et la manière de le gouverner**{/coral}.

    **Trois noms.**

    | Nom | Ce qu'elle est | Rapport au corps |
    | l'Âme divine (hypostase) | la troisième réalité, auprès de l'Intellect | n'est l'âme d'aucun corps |
    | l'âme du monde (âme du tout) | l'âme qui produit et ordonne l'univers | gouverne le tout sans descendre |
    | l'âme individuelle (partielle) | l'âme d'un vivant, la nôtre | descend dans un corps particulier |

    Le nom d'**Âme hypostase** vient de la tradition néoplatonicienne, qui l'a tiré du [[traite10|traité 10]] (7, 40-45) : chez Plotin, elle est {violet}l'Âme divine{/violet}, celle qui demeure là-haut.

    **Pourquoi ce n'est qu'une manière de parler.** L'âme est indivisible : elle ne se coupe pas en une âme d'en haut et des âmes d'en bas. {coral}Tout ce qui participe à la vie se retrouve relié à l'Âme divine{/coral}, puisque toute âme est sœur de celle qui est là-bas. Les trois noms désignent donc **une même âme selon qu'elle remplit telle ou telle fonction** : penser l'Intellect, ordonner l'univers, faire vivre un corps.

    **Âme divine et âme du monde : deux âmes, ou deux aspects ?** Le [[traite27|traité 27]] semble les séparer : l'âme dont toutes dépendent {red}n'est l'âme de rien en particulier, pas même l'âme du monde{/red}, qui n'est qu'une des âmes, **la sœur des nôtres**. Mais au chapitre 8 du [[traite6|traité 6]], Plotin passe sans prévenir de {blue}*hê holê*{/blue}, l'**âme totale**, à {blue}*hê tou holou*{/blue}, l'**âme du tout** (synonymes de {blue}*pasa psuchê*{/blue} et de {blue}*psuchê tou pantos*{/blue}). {sky}Dufour{/sky} et {sky}Lavaud{/sky} en concluent que Plotin {green}ne dissocie pas les deux dimensions{/green}, car le gouvernement de l'univers ne va pas {amber}sans la préservation du contact avec l'Intellect{/amber} : l'âme du monde n'est autre que l'Âme divine en tant qu'elle ordonne le monde **sans le quitter des yeux**. La division entre les deux reste donc **logique**.

    ! Nos âmes ne sont pas des parties de l'âme du monde : elles ne viennent pas d'elle, elles viennent, comme elle, de l'Âme une. L'âme du monde est une sœur, non une mère.
  points:
  - id: ame2-l1-p1
    sentence: "__L'Âme hypostase, l'âme du monde et nos âmes ne sont pas trois sortes d'âmes__ : ce qui les distingue n'est pas leur nature, c'est le ___ qu'elles gouvernent et la manière de le gouverner."
    answer: "corps"
