lessons:
- id: g-union-ame-corps-l1
  title: Union de l'âme et du corps
  notes: |-
    Chez Plotin, l'{violet}**union de l'âme et du corps**{/violet} est [def]. Elle n'est {pink}ni un mélange ni un emboîtement{/pink} : l'âme ne descend pas dans le corps, c'est le corps qui est dans l'âme.

    __**L'âme n'est pas dans le corps comme dans un lieu, ni mêlée à lui, ni sa forme inséparable : c'est le corps qui est dans l'âme.**__ Plotin passe en revue les façons dont l'âme pourrait être unie au corps : « soit un mélange, soit un entrelacement, ou bien encore que l'âme était une forme non séparée, ou une forme en contact, comme le pilote du navire » ([[traite53|traité 53]], chap. 3). Il les écarte une à une. Pas dans un lieu, d'abord, parce que le lieu ne contient qu'un corps, et le contient partie par partie : « Car le lieu est un contenant, et c'est un corps qu'il contient ; et là où se trouve chacune de ses parties, c'est là que se trouve le corps, en sorte qu'il ne peut se trouver tout entier en un point quelconque. Mais __l'âme n'est pas un corps__, et elle n'est pas plus contenue qu'elle ne contient » ([[traite27|traité 27]], chap. 20). Or l'âme est tout entière dans chaque partie du corps (voir [[g-ame|âme]]) : elle n'est donc pas logée en lui. Pas comme une qualité dans son substrat non plus, car « ce qui est dans un substrat est une affection de ce en quoi il est, la couleur et la configuration par exemple, et __l'âme est quelque chose de séparable__ » (*ibid*.). Pas même comme la forme d'Aristote, « car la forme est inséparable de la matière » : c'est au contraire « l'âme qui produit la forme dans la matière » (*ibid*.). Si l'âme est une forme, c'est donc « comme une forme séparée, puisqu'elle est une réalité, et ainsi elle sera encore davantage __du côté de ce qui se sert d'autre chose__ » ([[traite53|traité 53]], chap. 4) : le corps est son instrument. D'où le renversement que Plotin reprend à Platon : il faut mettre « non pas l'âme dans le corps, mais __le corps dans l'âme__ » ([[traite27|traité 27]], chap. 22). Être dans l'âme, pour un corps, c'est dépendre d'elle.

    __**Le lien est une présence sans mélange : le corps reçoit de l'âme une image selon son aptitude, et l'âme n'en pâtit pas.**__ Un mélange de l'âme et du corps est peut-être impossible, « comme si quelqu'un parlait d'une __ligne mélangée à du blanc__, d'une nature mélangée à une autre » ([[traite53|traité 53]], chap. 4) : une ligne n'a pas de couleur, elle ne peut pas se mêler au blanc, et de même l'incorporel ne se mêle pas au corps, parce qu'ils ne sont pas du même genre. Reste l'entrelacement, qui ne fait pas partager les affections : « il est possible que ce qui est entrelacé soit impassible, et il est possible que l'âme aille et vienne dans le corps __sans avoir à pâtir de ses affections__, tout comme le fait la lumière » (*ibid*.). L'image dit comment. La lumière est présente dans l'air sans s'y mêler : « même si le feu pénètre l'air de toute part, il n'y est en rien mélangé et __il reste lui-même immobile, alors que l'air s'écoule__ » ([[traite27|traité 27]], chap. 22). L'air est éclairé tant qu'il est dans la lumière, mais la lumière ne devient pas de l'air ; c'est pourquoi « l'on a raison de dire là aussi que __l'air est dans la lumière__, plutôt que la lumière dans l'air » (*ibid*.). De même le corps reçoit de l'âme une trace, autant qu'il est apte à la recevoir (voir [[g-corps|corps]]), et l'âme, qui la donne, ne change pas : quand le corps est affecté, « c'est l'âme tout entière qui dans le corps perçoit cette affection, __sans pour autant être affectée__ » ([[traite28|traité 28]], chap. 19). La difficulté du contact entre l'incorporel et le corps tombe donc d'elle-même : l'âme n'a pas à heurter le corps, parce qu'elle n'agit pas sur lui comme un corps sur un corps ; il lui suffit d'être présente, comme la lumière.

    __**Le corps a besoin de l'âme pour être, et l'âme particulière s'occupe de lui de près : d'où l'union, et d'où le trouble.**__ Pourquoi l'âme est-elle unie à un corps ? D'abord parce que le corps ne tiendrait pas sans elle : « il n'y aurait pas même de corps s'il n'existait pas une puissance psychique. __Le corps s'écoule__ et sa nature réside dans le mouvement ; et il périrait aussitôt si toutes choses étaient des corps » ([[traite2|traité 2]], chap. 3). Ensuite parce que l'âme, en procédant, va naturellement vers le corps : « s'il n'y avait pas de corps, __l'âme ne procéderait pas__, puisqu'il n'y a pas d'autre lieu que le corps où il soit naturel qu'elle se trouve » ([[traite27|traité 27]], chap. 9). Mais l'union n'est pas la même pour toutes les âmes, car « il y a en effet __deux façons de prendre soin__ de toute chose : la première, générale, qui consiste à mettre en ordre en commandant avec une autorité royale sans intervenir, et la seconde, particulière, qui consiste à produire immédiatement soi-même et qui provoque, par le contact de l'agent avec ce sur quoi il agit, la contamination du premier par le second » ([[traite6|traité 6]], chap. 2). L'âme du monde gouverne de la première façon ; la nôtre, qui a un corps fragile à soigner de près, de la seconde. C'est de là que vient la peine de l'union, qui tient à deux choses : le corps est « un « obstacle » pour l'exercice de l'intellection », et il « « remplit l'âme » de plaisirs, de « désirs » et de chagrins ; aucune de ces deux choses ne peut advenir à l'âme qui n'a justement pas plongé à l'intérieur du corps, qui n'appartient à personne, et __qui n'est pas possédée par le corps, mais qui le possède__ elle-même » (*ibid*.). Le trouble ne vient donc pas de l'union comme telle, mais de ce que l'âme particulière se laisse posséder par le corps qu'elle soigne. Pourquoi s'y laisse-t-elle prendre ? Parce qu'elle a voulu une vie à part : l'origine du mal pour les âmes, « c'est bien l'audace, la génération, l'altérité première et __le fait de vouloir s'appartenir à elles-mêmes__ » ([[traite10|traité 10]], chap. 1 ; voir [[g-tolma|audace]]). Et même alors, l'union n'est pas totale : « notre âme __n'a pas plongé tout entière ici-bas__, mais quelque chose d'elle reste toujours dans l'intelligible » ([[traite6|traité 6]], chap. 8 ; voir [[g-ame-non-descendue|âme non descendue]]).

    __**Ce qui tient l'âme, c'est l'harmonie du corps, et cette harmonie est l'œuvre de l'âme.**__ Le corps retient l'âme par une harmonie : il la lâche « quand rien de l'âme n'est plus lié à lui, parce que le corps ne peut plus la lier, car __l'harmonie au moyen de laquelle il tenait l'âme__ n'existe plus » ([[traite16|traité 16]], chap. 1). Cette harmonie n'est pas l'âme : c'est l'accord du mélange dont le corps est fait, car « notre corps est lui aussi __un mélange de parties dissemblables__ » ([[traite2|traité 2]], chap. 8). Est-elle matérielle ? Ni corps ni âme, c'est un rapport entre des corps, et Plotin refuse pour cette raison qu'elle soit l'âme : « l'âme doit être une réalité, tandis que __l'harmonie n'est pas une réalité__ » (*ibid*.). Surtout, une harmonie ne se fait pas toute seule : il faut « avant cette âme-là, une autre âme qui soit celle qui produit cette harmonie-là, comme c'est le cas pour les instruments de musique, où __c'est le musicien qui produit l'harmonie__ à l'aide des cordes et qui possède en lui le rapport d'après lequel il produira l'harmonie. En effet, ni les cordes dans un cas ni les corps dans l'autre ne peuvent d'eux-mêmes produire l'harmonie entre eux-mêmes » (*ibid*.). Si l'on rapproche les deux traités, ce que Plotin ne fait pas lui-même, on voit pourquoi il emploie le mot dans le traité 16 : l'âme accorde le corps comme le musicien sa lyre, et c'est par cet accord que le corps peut la retenir, comme une lyre accordée peut seule rendre le chant du musicien.

    __**La séparation vient du corps, non de l'âme : le corps qui perd son harmonie ne peut plus recevoir l'image, et l'image cesse d'exister.**__ Ce n'est pas l'âme qui part, puisqu'elle n'a jamais été dans le corps comme dans un lieu : « l'âme __attend que le corps se sépare__ entièrement d'elle, et elle n'a plus alors besoin de se déplacer, puisqu'elle est toute à l'extérieur » ([[traite16|traité 16]], chap. 1). C'est le corps qui se défait. Il s'use, car « les parties de notre corps changent continuellement et __partent vers l'extérieur__ » ([[traite40|traité 40]], chap. 3 ; voir [[g-vieillesse|vieillesse]]), et vient un moment où son mélange n'a plus l'harmonie qui tenait l'âme. L'image que le corps avait reçue ne s'en va pas ailleurs : elle cesse d'être. L'âme « abandonne certes son image s'il n'y a rien qui soit auprès d'elle à même de la recevoir ; elle ne l'abandonne pas au sens où l'image serait détachée d'elle, mais au sens où __l'image cesse d'exister__ » ([[traite53|traité 53]], chap. 12). C'est encore l'image de la lumière : « quand l'air quitte l'endroit où se trouve la lumière, __il s'en va sans rien en retenir__ » ([[traite27|traité 27]], chap. 22), et la lumière n'a rien perdu. Il y a pourtant une autre façon pour l'image de cesser, qui vient de l'âme : « c'est lorsque l'âme tout entière tourne ses regards vers là-bas que l'image n'existe plus » ([[traite53|traité 53]], chap. 12 ; voir [[g-katharsis|purification]]). Le suicide, qui force la séparation au lieu de l'attendre, a son entrée (voir [[g-suicide|suicide]]), comme la mort (voir [[g-mort|mort]]).

    | Comment l'âme serait dans le corps | Ce qu'en dit Plotin |
    | dans un lieu | le lieu contient un corps, l'âme n'est pas un corps |
    | dans un substrat | elle serait une affection du corps, or elle est séparable |
    | mêlée à lui | deux natures ne se mêlent pas, comme une ligne et le blanc |
    | sa forme inséparable | l'âme produit la forme, elle n'en est pas une |
    | son harmonie | l'harmonie n'est pas une réalité, et il faut un musicien |
    | présente comme la lumière dans l'air | retenu : le corps est dans l'âme |

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 2, chap. 8 | l'âme n'est pas une harmonie ; le musicien accorde les cordes |
    | traité 6, chap. 2 | deux façons de prendre soin ; posséder le corps ou être possédée |
    | traité 16, chap. 1 | le corps sans harmonie ne peut plus lier l'âme |
    | traité 27, chap. 20 | l'âme n'est contenue en aucun lieu |
    | traité 27, chap. 22 | la lumière dans l'air ; le corps dans l'âme |
    | traité 53, chap. 4 | une ligne mêlée au blanc ; l'âme entrelacée sans pâtir |
    | traité 53, chap. 12 | l'image cesse d'exister quand rien ne la reçoit |

