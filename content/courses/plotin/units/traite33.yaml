title: "Traité 33 (II, 9) : Contre les gnostiques"
subtitle: "Défense du monde et du platonisme"
icon: compass
color: sky
lessons:
- id: traite33-l1
  title: "Contre les gnostiques : qui sont-ils ?"
  notes: |-
    **Le traité 33 est un document unique : un plaidoyer pour la culture grecque, écrit par un philosophe païen contre des hérétiques chrétiens.** Ce n'est pas un catalogue des sectes, comme chez les Pères de l'Église (Irénée, Hippolyte, Épiphane), mais un appel aux disciples de Plotin, pour les arracher à l'influence de gnostiques qui fréquentaient son école.

    **Ce qu'en dit Porphyre** (*Vie de Plotin*, 16) : des disciples d'**Adelphius et d'Aquilinus**, qui se réclamaient d'« apocalypses » (de **Zoroastre**, de **Zostrien**, d'Allogène, de Messos) et prétendaient que Platon n'avait pas atteint la profondeur de l'intelligible. Plotin confia à **Amélius** l'examen du *Zostrien*, à **Porphyre** celui du *Zoroastre*.

    **Les textes de Nag Hammadi**, découverts en 1945 (cinquante-trois textes coptes, pour la plupart gnostiques), ont éclairé la question : ces gnostiques sont, selon M. Tardieu, **« des continuateurs locaux de l'enseignement de Valentin »**, lecteurs de traités **séthiens** marqués par le médioplatonisme (*Zostrien*, *Allogène*) : un Un ineffable, une émanation, une contemplation qui remonte vers l'Un. D'où leur intérêt pour l'école de Plotin.

    **Six thèses gnostiques condamnées** :

    | Thèse gnostique | Réponse de Plotin |
    | ils sont étrangers au monde, étincelles divines jetées ici-bas | nous sommes des parties de l'univers |
    | le sensible est coupé de l'intelligible | le monde mène à l'intelligible |
    | les astres sont des archontes malveillants | les astres sont des dieux bons |
    | ils forment des sectes d'élus | d'autres hommes atteignent l'intelligible |
    | ils font fi des vertus | sans vertu, pas de vision de dieu |
    | ils invoquent le *Phédon* pour fuir le monde | ils lisent mal Platon |

    À cela s'ajoute une **métaphysique prolifique** : le Plérôme du gnostique Ptolémée compte **trente éons** ; le monde naîtrait de la chute de l'un d'eux, **Sagesse** (`sophía`).

    ! Plotin ne réfute pas chaque doctrine gnostique : il s'en prend à leurs principes et à leur attitude, en rappelant d'abord ce qu'est l'intelligible.
