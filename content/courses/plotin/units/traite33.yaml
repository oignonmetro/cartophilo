- id: traite33-l3
  title: "Le monde n'est pas né d'une chute"
  notes: |-
    **Contre la production du monde par une chute** (chap. 4) : si l'âme a chuté, quand ? Si c'est de toute éternité, elle reste déchue ; sinon, pourquoi pas avant ? **« Ce n'est pas l'inclinaison qui produit, mais plutôt l'absence d'inclinaison »** : une âme qui aurait oublié les intelligibles ne pourrait produire. Ni pour obtenir des honneurs, comme un sculpteur ; ni pour détruire ensuite le monde, par repentir.

    **Le monde, la plus belle image** : quel autre feu serait une meilleure image du feu de là-bas que le feu d'ici ? Le juger mauvais, c'est faire trop grand cas de lui, comme s'il devait être l'intelligible même.

    - **Les astres** (chap. 5) : ces hommes, qui ont un corps et des passions, se croient supérieurs au soleil et le privent d'âme immortelle. Ils se promettent une **« terre nouvelle »**.
    - **Un nouveau vocabulaire** (chap. 6) : « séjours », « empreintes », « repentirs » ; ce que les Grecs disaient simplement des **remontées hors de la caverne**. Ce qu'ils ont de bon vient de Platon ; le reste, ils l'ont inventé **hors de la vérité**. Ils lisent mal le *Timée* (39e) et multiplient les intellects.
    - **L'âme du monde n'est pas la nôtre** (chap. 7) : juger d'elle par notre âme, c'est blâmer toute une cité bien administrée sur **ses potiers ou ses forgerons**. Une **tortue** prise dans un chœur est piétinée si elle ne suit pas son mouvement.
    - **Les astres sont des dieux** (chap. 8), et l'univers, suspendu aux intelligibles.

    **L'arrogance des élus** (chap. 9) : le sage ne cherche pas l'égalité des richesses ; le monde est **un gymnase** où il y a vainqueurs et vaincus. Il faut chanter un hymne aux dieux, puis au Grand Roi, sans se croire seul meilleur. Celui à qui l'on dit « tu es un enfant de dieu » ressemble à un homme qui, parmi des gens qui ne savent pas compter, croirait **mesurer mille coudées**.

    ! Plotin aussi enseigne que l'âme doit fuir le corps ; ce qu'il refuse, c'est la haine du monde et l'idée qu'il naîtrait d'une faute.
