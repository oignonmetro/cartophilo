- id: traite33-l6
  title: "Repérage : le plan du traité 33"
  notes: |-
    **Le traité 33 pose d'abord des considérations préliminaires (chap. 1-3), puis trois séries de critiques (chap. 4-9, 10-14, 15-18).**

    | Moment | Lieu | Ce qui s'y joue |
    | trois réalités intelligibles | chap. 1 | ni plus ni moins |
    | notre âme et l'âme du monde | chap. 2 | gouverner sans réflexion |
    | la succession éternelle | chap. 3 | le feu sur la place |
    | contre la production par une chute | chap. 4 | l'absence d'inclinaison |
    | le mépris des astres | chap. 5 | une terre nouvelle |
    | l'arrogance envers Platon | chap. 6 | un nouveau vocabulaire |
    | l'âme du monde n'est pas la nôtre | chap. 7 | la tortue dans le chœur |
    | l'excellence de l'univers | chap. 8 | les astres sont des dieux |
    | l'arrogance des élus | chap. 9 | les mille coudées |
    | le mythe de Sagesse | chap. 10 | membres de Sagesse |
    | contre le démiurge gnostique | chap. 11-12 | le feu en premier |
    | les astres, le mal | chap. 13 | doux comme le miel |
    | la magie | chap. 14 | les démons et les maladies |
    | ils négligent la vertu | chap. 15 | regarde vers dieu |
    | providence et beauté du monde | chap. 16 | aimant le père, il aime les enfants |
    | la beauté | chap. 17 | la sphère intelligible |
    | la fuite du corps, le sage | chap. 18 | la maison et le constructeur |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! Les trois premiers chapitres ne parlent pas des gnostiques : ils rappellent les principes qui permettront de les réfuter.
