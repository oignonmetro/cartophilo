- id: traite33-l2
  title: "Trois réalités, pas davantage"
  notes: |-
    **Il n'existe que trois réalités intelligibles** (chap. 1) : **« il faut placer le Bien en tête, puis à sa suite l'Intellect »**, puis l'Âme ; ni plus, ni moins.

    - **Rien au-dessus du Bien**, le plus simple, qui n'est en rien et ne vient de rien.
    - **Pas deux Intellects**, l'un en repos et l'autre en mouvement : l'Intellect reste dans un acte immobile ; le mouvement autour de lui est déjà l'œuvre de l'Âme.
    - **Pas un Intellect qui intellige, et un autre qui intellige qu'il intellige** : c'est un seul et même acte ; sinon, pourquoi ne pas aller à l'infini ?
    - **Pas d'intermédiaire entre l'Intellect et l'Âme** : l'âme n'aurait plus qu'une image de raison.

    **L'âme et l'âme du monde** (chap. 2) : notre âme, une en ses puissances multiples, a une partie tournée vers là-haut, une vers ici-bas, une entre les deux. L'âme du monde **gouverne sans réflexion** : elle ne rectifie rien, elle impose l'ordre par la contemplation ; plus elle contemple, plus elle est belle et puissante.

    **La succession éternelle** (chap. 3) : l'âme donne la lumière qu'elle reçoit, **comme un feu au milieu d'une place**, auquel se réchauffent ceux qui le peuvent. Chaque réalité doit donner à une autre ce qu'elle a. Rien de ce qu'on dit « engendré » ne l'a été à un moment donné : **tout est toujours engendré** ; même la matière n'est pas séparée des intelligibles.

    ! Réduire les principes à trois n'est pas appauvrir l'intelligible : c'est refuser de le faire ressembler à la multiplicité sensible.
