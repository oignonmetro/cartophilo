- id: traite33-l5
  title: "Vertu, providence et beauté du monde"
  notes: |-
    **Les gnostiques négligent la vertu** (chap. 15) : il y a deux écoles sur la fin à atteindre, le plaisir du corps et la vertu. **Épicure** a éliminé la providence et prescrit le plaisir ; les gnostiques, pire encore, méprisent le maître de la providence et toutes les lois d'ici-bas. Ils n'ont **aucun traité sur la vertu** : ni ce qu'elle est, ni comment l'acquérir. Or **dire « regarde vers dieu » ne sert à rien si l'on n'enseigne pas comment regarder** : c'est la vertu qui montre dieu ; sans elle, « dieu » n'est qu'un nom.

    **Déprécier le monde ne rend pas bon** (chap. 16) : **aimant le père, on aime les enfants** ; or toute âme est fille du père de là-bas. La providence s'étend à tout, plus aux ensembles qu'aux parties. Comment un musicien, un géomètre, un amant ne seraient-ils pas émus par les beautés d'ici, qui viennent de là-bas ?

    **La beauté** (chap. 17) : il faudrait retrancher par la pensée la nature corporelle, pour voir ce qui reste : une sphère intelligible. Les choses d'ici sont belles du fait des réalités de là-bas ; ils devraient plutôt mépriser la beauté des jeunes garçons et des femmes, pour éviter la débauche.

    **La maison** (chap. 18) :

    | Le gnostique | Le platonicien |
    | critique la maison et son constructeur, mais y reste | loue le constructeur et attend de pouvoir quitter la maison |
    | se croit plus savant parce qu'il voit que les murs sont de pierre et de bois | supporte les nécessités de sa condition |

    Il faut, tant que nous avons un corps, rester dans les maisons préparées par une âme **sœur de la nôtre**. Nos « frères » ne sont pas les hommes vils, mais les astres et ceux qui habitent leur corps comme l'âme du monde habite le sien, **sans recevoir de coups** : la vertu nous en approche.

    ! Le reproche fait aux gnostiques n'est pas de vouloir fuir le corps : c'est de haïr un monde dont ils ne savent pas voir la beauté.
