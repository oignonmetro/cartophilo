- id: traite33-l4
  title: "Le mythe de Sagesse, les démons et la magie"
  notes: |-
    **Pourquoi ne pas tout réfuter ?** (chap. 10) Par une sorte de honte envers des amis tombés dans cette doctrine avant de connaître Plotin ; c'est à ses disciples qu'il s'adresse.

    **Le point le plus absurde : le mythe de Sagesse** (chap. 10-12). L'âme et une certaine **Sagesse** se seraient inclinées vers le bas ; les âmes seraient descendues comme des **« membres de Sagesse »** ; Sagesse aurait seulement illuminé les ténèbres, d'où une image dans la matière, puis une image de cette image : le **démiurge**, éloigné de sa **Mère**, qui aurait produit le feu en premier.

    - Si l'âme a illuminé sans descendre, elle ne s'est pas inclinée.
    - Comment le démiurge produirait-il **par le souvenir** de choses qu'il n'a jamais vues ?
    - Pourquoi produire **le feu en premier** ? La nature produit d'un coup l'esquisse d'un vivant entier, non le feu puis les autres éléments.
    - Si l'âme illumine par nature, elle le fera toujours ; sinon, le mal existerait dans les réalités premières.

    **Les astres ne sont pas redoutables** (chap. 13) : loin des tragédies que les gnostiques imaginent dans les sphères, celles-ci **« rendent toutes choses douces comme le miel »**. Les astres dispensent la beauté et l'ordre ; ce qui semble venir d'eux, ce sont des **signes**.

    **La magie** (chap. 14) : en composant des incantations pour les réalités supérieures, ils les rabaissent, comme si les incorporels obéissaient à des sons. Ils prétendent chasser **les démons** qui causeraient les maladies ; mais un purgatif, une saignée ou **le jeûne** guérissent : le démon avait-il faim ?

    Leur philosophie, conclut Plotin, repose sur des principes **à l'exact opposé** de la nôtre, qui joint la simplicité des mœurs à la réflexion pure.

    ! Plotin ne nie pas toute action des astres : il en fait des signes, non des puissances hostiles qu'il faudrait déjouer.
