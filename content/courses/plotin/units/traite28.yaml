- id: traite28-l5
  title: "La terre vivante, la sensation et la colère"
  notes: |-
    **La terre a-t-elle une âme ?** (chap. 22) Oui : tant d'êtres vivants en surgissent qu'elle est elle-même un vivant ; et comme les astres, elle est un corps pourvu d'une âme, donc **une divinité**. Platon la dit « la première et la plus ancienne des divinités » à l'intérieur du ciel (*Timée*).

    **Qu'est-ce que sentir ?** (chap. 23) L'âme seule ne perçoit que l'intelligible. Entre l'objet et l'âme, il faut **un troisième terme**, l'organe, affecté en même temps que l'objet et capable de transmettre la forme : **une moyenne proportionnelle**, comme **la règle** qui met en contact la ligne droite de l'âme et celle du bois. La sensation est donc le fait d'une âme dans un corps.

    - **La sensation a pour fin l'utilité** (chap. 24) : elle protège le corps. Le monde, lui, n'a qu'une conscience de lui-même ; son âme, toujours tournée vers l'intelligible, ne s'incline pas vers le sensible (chap. 25).
    - **La terre sent** (chap. 26-27) : le toucher, l'ouïe des prières, l'odorat des sucs, même la vue. Elle donne aux plantes ce qui les distingue d'**une branche coupée** ; les pierres croissent tant qu'elles lui restent attachées. Son âme, les hommes l'appellent **Hestia et Déméter**.

    **La colère** (chap. 28) : elle naît du corps vivant, du sang et de la bile ; les **« bilieux »** s'emportent plus vite, et l'on est plus prompt à la colère malade ou à jeun.

    | Deux sortes de colère | Point de départ |
    | éveillée de façon irrationnelle | le corps, qui entraîne la raison par la représentation |
    | contre une injustice repérée | la raison, qui s'allie la puissance agressive |

    Preuve : **ceux qui méprisent le corps sont moins portés à la colère**. Les plantes, sans sang ni bile, n'en ont pas.

    **À la mort** (chap. 29), l'âme descendue part aussitôt, comme la lumière ; l'âme végétative s'attarde un peu, comme la chaleur : **les cheveux et les ongles poussent encore sur les cadavres**.

    ! La colère et le désir ne relèvent pas d'une partie irascible de l'âme, comme chez Platon : ils naissent de la faculté végétative, dans le corps vivant.
