id: traite28
title: "Traité 28 (IV, 4) : Sur les difficultés relatives à l'âme II"
subtitle: "Mémoire, passions, sympathie et magie"
icon: compass
color: sky
lessons:
- id: traite28-l1
  title: "La mémoire de l'âme dans l'intelligible"
  notes: |-
    **Thèse des chapitres 1 à 5 : dans l'intelligible, l'âme ne se souvient de rien.** Elle contemple les réalités qui l'entourent ; or l'intellection est intemporelle, et la proposition « J'ai fait acte d'intellection » ne vient qu'après coup.

    - **Une intuition multiple, mais non successive** (chap. 1) : comme on voit d'un seul coup les yeux, le nez et les autres parties d'un visage. L'antérieur et le postérieur n'y sont qu'un ordre, comme dans une plante, des racines au sommet.
    - **Pas même de soi** (chap. 2) : là-bas, on ne se rappelle pas qu'on est Socrate. Même ici-bas, quand on contemple, **on ne fait pas retour sur soi-même, mais on se possède soi-même**. Tournée vers l'Intellect, l'âme s'unit à lui sans être détruite : **les deux ne font qu'un en restant deux**.

    **Quand la mémoire naît-elle ?** (chap. 3-5) Quand l'âme sort de l'intelligible, parce qu'elle ne peut supporter l'unité et qu'elle prend plaisir à elle-même.

    | Souvenir | Effet sur l'âme |
    | des choses de là-bas | la retient encore de tomber |
    | des choses d'ici-bas | la pousse vers ici |
    | de ce qu'il y a dans le ciel | la retient là |

    **« L'âme est et devient ce dont elle se souvient »** (3, 6-7). Là-bas, ses souvenirs n'étaient qu'**en puissance**, comme une puissance qui plus tard passera à l'acte. Et les dispositions qu'on possède **sans y porter attention** agissent plus fortement que celles qu'on connaît : on risque d'**être** ce qu'on possède.

    La mémoire commence **dans le ciel**, où les âmes se reconnaissent encore à leurs caractères.

    ! La mémoire, même des meilleures choses, n'est pas la meilleure chose : elle suppose qu'on a cessé de contempler.
