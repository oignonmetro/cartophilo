- id: traite28-l8
  title: "Repérage : le plan du traité 28"
  notes: |-
    **Le traité 28 achève la section sur la mémoire (chap. 1-17), traite des passions (chap. 18-29), puis de l'influence des astres et de la magie (chap. 30-45).**

    | Moment | Lieu | Ce qui s'y joue |
    | la mémoire dans l'intelligible | chap. 1-2 | on ne se souvient pas de soi |
    | quand naît la mémoire | chap. 3-5 | on devient ce dont on se souvient |
    | les astres sans mémoire | chap. 6-8 | ils ne cessent de voir le dieu |
    | Zeus, démiurge et âme du monde | chap. 9-12 | la nature, non le médecin |
    | la nature, image de la réflexion | chap. 13-14 | la cire épaisse |
    | le temps et la succession | chap. 15-16 | les cercles autour du Bien |
    | nos âmes divisées | chap. 17 | l'assemblée bruyante |
    | le corps échauffé | chap. 18 | une ombre de l'âme |
    | le plaisir et la douleur | chap. 19 | c'est le doigt qui a mal |
    | le désir | chap. 20-21 | la nature comme une mère |
    | la terre vivante | chap. 22-27 | Hestia et Déméter |
    | la colère | chap. 28 | le sang et la bile |
    | la sortie de l'âme | chap. 29 | la chaleur et la lumière |
    | l'influence des astres | chap. 30-31 | ni corps, ni choix |
    | un vivant unique en sympathie | chap. 32-38 | la danse |
    | les présages | chap. 39 | la vertu n'a pas de maître |
    | la magie | chap. 40-42 | l'Amour et la Haine ; la corde tendue |
    | le sage et les démons | chap. 43 | l'âme rationnelle impassible |
    | la contemplation seule libre | chap. 44 | la magie de la vie pratique |
    | conclusions | chap. 45 | une justice silencieuse |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! Le traité 28 ne commence pas une question nouvelle : il continue la recherche sur la mémoire ouverte au chapitre 25 du traité 27.
