- id: traite28-l6
  title: "L'influence des astres : la sympathie d'un vivant unique"
  notes: |-
    **Les astres exaucent les prières, même injustes : faut-il leur prêter de la mémoire et des intentions ?** (chap. 30) Défendre les dieux du ciel contre ces accusations est la tâche de la philosophie.

    **Deux explications écartées** (chap. 31) :

    - **les causes corporelles** : le chaud et le froid n'expliquent ni l'envie, ni la ruse, ni la chance, ni la découverte de trésors ;
    - **le choix des astres** : il serait absurde que des dieux fassent de certains hommes des voleurs ou des pilleurs de temples.

    **La thèse** (chap. 32) : **notre monde est un vivant unique**, doté d'une âme unique, **en sympathie avec lui-même** : ce qui est loin y est tout près, comme l'ongle et le doigt dans un même corps. En tant qu'il est multiple, ses parties se nuisent et se nourrissent les unes des autres ; en tant qu'il est un, chacune est sauvegardée.

    - **La danse** (chap. 33) : chaque configuration du ciel correspond à une disposition d'ici-bas, comme les membres d'un danseur prennent la position que demande la danse, sans l'avoir choisie. Certains astres produisent, d'autres seulement **envoient des signes**.
    - **Des serviteurs sensés** (chap. 34) : nous ne livrons à cette influence que la partie de nous qui appartient au corps du monde, et nous la subissons de façon modérée.
    - **Les configurations ont une puissance** (chap. 34-35), comme les figures qui terrifient ou attirent ; le soleil agit en gardant les yeux fixés en haut, sans choix préalable.
    - **Une vie cachée** (chap. 36-37) : l'univers n'est pas une maison sans âme, mais un être « éveillé » en toutes ses parties ; l'extraordinaire nous étonne, l'ordinaire ne le ferait pas moins si nous le découvrions.

    **Les présages** (chap. 39) : tout est tissé ensemble, d'où les présages, non pour annoncer, mais parce qu'une chose s'y lit dans une autre. **« La vertu n'a pas de maître »**, mais ses œuvres sont prises dans la trame commune, comme les actes des citoyens dans les lois d'une cité.

    ! Les astres ne choisissent pas le mal qu'ils semblent causer : il vient de la nécessité naturelle, du mélange de leurs dons et de ce que nous y ajoutons.
  points:
