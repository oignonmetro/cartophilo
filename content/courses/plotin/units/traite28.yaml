- id: traite28-l3
  title: "La nature, le temps et nos âmes divisées"
  notes: |-
    **La nature est « une image de la réflexion »** (chap. 13) : la réflexion vient en premier, la nature en dernier. C'est comme **une épaisse couche de cire** où la marque imprimée sur une face ne laisse qu'une faible trace sur l'autre. **La nature ne connaît pas, elle se contente de produire** ; elle n'a pas même de représentation.

    | Degré | Ce qu'il fait |
    | l'intellection | naît d'elle-même, activité qui tire d'elle-même son activité |
    | la représentation | a conscience de ce qui vient de l'extérieur |
    | la nature | n'a ni perception ni conscience : elle produit, et elle est affectée |

    La nature est **le degré le plus bas de l'intelligible** : après elle, il n'y a plus que des imitations.

    **Le temps et l'âme** (chap. 15-16) : le temps dérive de l'activité de l'âme, mais **les âmes ne sont pas dans le temps** ; leurs affections et leurs actes le sont. Dans l'âme, toutes les raisons sont présentes ensemble ; l'avant et l'après sont dans ses produits. D'où l'image : le Bien est **le centre**, l'Intellect **un cercle immobile**, l'Âme **un cercle mobile**, que meut le désir ; la sphère du monde, mue par ce désir, se meut en cercle.

    **Pourquoi nos âmes délibèrent-elles ?** (chap. 17) Parce que plusieurs principes nous meuvent : le désir, l'agressivité, les besoins du corps. Le meilleur en nous est couvert, comme dans **une assemblée bruyante** où le meilleur conseiller reste assis, sa voix couverte par le tapage.

    - l'homme qui ne vaut rien : une foule sous une mauvaise constitution ;
    - l'homme ordinaire : une démocratie modérée ;
    - l'homme le meilleur : une vie aristocratique ;
    - l'homme vertueux : un principe unique, comme si la cité d'en haut ordonnait celle d'en bas.

    ! L'âme du monde ne délibère pas parce qu'elle est une ; nos âmes délibèrent parce qu'elles sont tiraillées entre plusieurs principes.
  points:
