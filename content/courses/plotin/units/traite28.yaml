- id: traite28-l2
  title: "Les astres et l'âme du monde n'ont pas de mémoire"
  notes: |-
    **Seules les âmes qui changent de place et d'état ont de la mémoire** (chap. 6) : car on ne se souvient que de choses passées. Les astres, l'âme du monde, Zeus même n'ont ni à chercher ni à calculer.

    - **Les astres** (chap. 7-8) ne se souviennent pas d'avoir vu le dieu : **ils ne cessent de le voir**. Distinguer « hier » dans leur révolution, ce serait diviser l'impulsion unique qui meut le pied. Comme le marcheur ne note pas chaque masse d'air qu'il fend, ils n'ont pas à garder en mémoire les lieux traversés. Leur mouvement est un **mouvement vital** ; ils sont comme **une danse** qui se poursuit toujours et qui est donc toujours parfaite.
    - **Zeus** (chap. 9-10) : le nom désigne tantôt **le démiurge**, tantôt **l'âme du monde**. Le démiurge sait que son œuvre est unique et douée d'une vie unique pour l'éternité. L'âme du monde ne regarde pas tantôt là-bas, tantôt ailleurs : **unique est l'âme, unique est l'œuvre**.

    **La nature, non le médecin** (chap. 11) : le médecin procède de l'extérieur, partie par partie, et délibère ; la nature part du principe vital et n'a pas besoin de délibérer. Les natures particulières poussent sur la nature unique **comme les feuilles sur les branches**.

    **Calculer, c'est chercher la réflexion** (chap. 12) : celui qui calcule ressemble à celui qui joue de la cithare pour en maîtriser le jeu ; quand il a trouvé, il s'arrête. Le principe directeur de l'univers sait, comme un artisan qui produit avec assurance ; en lui, **« la volonté c'est la réflexion »**. Ceux pour qui organiser l'univers serait un travail pénible se trompent.

    ! L'absence de mémoire chez les astres n'est pas un manque : elle tient à ce qu'ils ne cessent jamais de contempler.
