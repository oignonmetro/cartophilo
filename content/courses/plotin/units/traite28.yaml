- id: traite28-l4
  title: "Plaisir, douleur et désir naissent dans le corps vivant"
  notes: |-
    **Le corps vivant est comme l'air échauffé, non comme l'air illuminé** (chap. 18) : il possède comme **une ombre de l'âme**, et c'est à lui de ressentir la douleur et le plaisir. Ces affections n'appartiennent pas à l'âme, mais **au composé**.

    **Les définitions** (chap. 19) :

    | Affection | Définition |
    | la douleur | la connaissance du retrait d'un corps privé de l'image d'une âme |
    | le plaisir | la connaissance qu'un vivant prend de l'image d'une âme qui revient s'adapter à son corps |

    - L'affection est dans le corps ; **la connaissance en appartient à l'âme sensitive**, qui n'est pas affectée. Si l'âme était affectée, elle ne pourrait dire où est la douleur : elle serait douloureuse partout.
    - **« C'est le doigt qui a mal »**, et l'homme a mal parce que c'est son doigt, comme on dit qu'il a le regard bleu parce qu'il a les yeux bleus.
    - **La sensation n'est pas douleur, mais connaissance de la douleur** : elle doit être impassible pour transmettre fidèlement, comme un messager qui ne se laisse pas submerger par l'émotion.

    **Le désir** (chap. 20-21) naît du corps vivant, qui cherche tour à tour l'amer et le doux, le froid et le chaud. La nature, informée, s'y associe : **« la nature est comme une mère »** qui devine les souhaits de celui qui souffre ; puis l'âme décide de satisfaire ce désir ou de lui résister. Preuve : les désirs changent avec **les âges** et la santé, et ne s'achèvent pas tous en désir complet.

    ! Dire que l'âme ne souffre pas n'est pas nier la douleur : c'est le corps vivant qui souffre, et l'âme qui le sait.
