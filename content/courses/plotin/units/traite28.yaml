- id: traite28-l7
  title: "La magie, les prières et le sage"
  notes: |-
    **La magie s'explique par la sympathie** (chap. 40) : par l'accord naturel entre les choses semblables et l'opposition entre les dissemblables. **La magie véritable, c'est l'Amour et son opposé la Haine**, qui s'exercent dans le monde ; le premier magicien est l'amour lui-même. Les magiciens ne font qu'utiliser ces attractions ; un magicien hors de l'univers ne pourrait rien.

    - **Les prières** (chap. 41-42) : **le soleil et les autres astres n'en savent rien**. Ce qu'on demande se produit parce qu'une partie de l'univers est en sympathie avec une autre, **comme dans une corde tendue**, ou comme une lyre qui vibre avec une autre. Les astres n'ont donc besoin ni de mémoire ni de choix. Et si le méchant obtient ce qu'il demande, **les méchants puisent bien de l'eau aux fleuves** ; la justice le poursuit ensuite.
    - **Le principe directeur du monde est totalement impassible** : les affections touchent ses parties, non le tout.

    **Le sage et la magie** (chap. 43) : en son âme rationnelle, il ne peut être affecté ; mais par ce qui en lui vient du monde, il peut subir maladies et mort. Les philtres ne le rendront pas amoureux, car l'amour suppose le consentement de l'âme rationnelle. **Les démons**, eux, peuvent être charmés.

    **Seule la contemplation échappe à la magie** (chap. 44) : celui qui est tourné vers lui-même reste un. La vie pratique, elle, est sous l'influence de la magie de la nature : élever des enfants, chercher le mariage, briguer les magistratures. On y échappe seulement si l'on tient que **le seul bien est celui qu'on connaît sans tromperie**.

    **La justice de l'univers** (chap. 45) : chaque partie agit et pâtit selon sa nature ; les méchants et les bons se déplacent **comme sous l'effet de ficelles**, et toutes choses **« vont silencieusement leur chemin suivant une justice »**. L'homme de bien sait où il va.

    ! Le sage n'échappe pas à la magie par un contre-charme : il lui échappe en ne se laissant pas séduire par l'apparence du bien.
