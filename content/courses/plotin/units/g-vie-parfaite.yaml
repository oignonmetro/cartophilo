# Entrée du glossaire de Plotin (skill glossaire) : sous-entrée de g-vie,
# citations vérifiées sur la GF (III, 6, 6 ; I, 4, 3 ; VI, 9, 9 ; VI, 7, 29).
# Ancienne entrée « Vie véritable » (g-vie-veritable), renommée et recentrée
# le 2026-10-21 : ses cartes sur le bonheur sont passées à g-bonheur, avec
# leurs identifiants.

id: g-vie-parfaite
title: Vie parfaite (`teleia zôê`)
subtitle: La vie de l'Intellect, à laquelle rien ne manque, dont toutes les autres sont des images et la nôtre une trace
icon: book
color: coral
lessons:
- id: g-vie-parfaite-l1
  title: Vie parfaite
  notes: |-
    Parmi les sens de la [[g-vie|vie]], qui se dit à des degrés différents, la {violet}**vie parfaite**{/violet} ({violet}*teleia zôê*{/violet}), que Plotin dit aussi **véritable**, est celle de l'{violet}[[g-intellect|Intellect]]{/violet} : la seule à laquelle {green}rien ne manque{/green}, dont toutes les autres ne sont que des {pink}images{/pink}.

    __**L'être véritable doit vivre d'une vie parfaite.**__ Contre l'idée d'un intelligible abstrait, simple ensemble de concepts, Plotin reprend le {sky}*Sophiste*{/sky}, où l'être véritable ne peut être privé de vie ni de pensée. L'être intelligible n'a besoin de rien pour être ; donc {teal}« il est nécessaire que cet être soit en vie et vive d'une vie parfaite »{/teal} (traité 26, chap. 6) : {teal}« s'il lui manquait quelque chose, il ne serait pas plus être que non-être »{/teal}.

    __**Les autres vies n'en sont que des images.**__ {teal}« La vie parfaite, celle qui est véritable et réelle, réside dans cette nature intellective »{/teal}, et {teal}« les autres vies sont imparfaites, qu'elles ne sont que des images de la vie »{/teal} (traité 46, chap. 3). {coral}Une image n'est pas une vie moindre qui existerait à côté de la vraie : elle n'a de vie que celle qu'elle reflète.{/coral} C'est pourquoi le [[g-bonheur|bonheur]], s'il est dans la vie, ne peut être que dans celle-ci.

    __**Notre vie d'ici n'en est qu'une trace.**__ {teal}« Car notre vie actuelle, qui est une vie sans dieu, n'est qu'une trace qui imite la vie véritable, tandis que la vie de là-bas, c'est l'activité de l'Intellect »{/teal} (traité 9, chap. 9). Et c'est l'{violet}[[g-un|Un]]{/violet} qui « procure la vie véritable » : l'âme qui s'en approche « reçoit alors une autre vie ».

    ! La vie parfaite n'est pas une autre vie, après la mort : c'est la vie de l'Intellect, que l'homme heureux est dès maintenant. Mépriser la vie, c'est mépriser celle d'ici : {teal}« si quelqu'un ne supporte pas la vie qui est mélangée de mort, c'est cette vie qu'il ne supporte pas, non pas la vie véritable »{/teal} (traité 38, chap. 29).

    **Voir aussi** : [[g-vie|Vie]] · [[g-degres-de-vie|Degrés de vie]] · [[g-bonheur|Bonheur]] · [[g-intellect|Intellect]] · [[g-un|Un]]
