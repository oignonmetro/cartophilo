# Entrée du glossaire de Plotin (skill glossaire) : sous-entrée de g-vie,
# citations vérifiées sur la GF (III, 6, 6 ; I, 4, 3 ; VI, 9, 9 ; VI, 7, 29).
# Ancienne entrée « Vie véritable » (g-vie-veritable), renommée et recentrée
# le 2026-10-21 : ses cartes sur le bonheur sont passées à g-bonheur, avec
# leurs identifiants.

id: g-vie-parfaite
title: Vie parfaite (`teleia zôê`)
icon: book
color: coral
lessons:
- id: g-vie-parfaite-l1
  title: Vie parfaite
  notes: |-
    Parmi les sens de la [[g-vie|vie]], qui se dit à des degrés différents, la {violet}**vie parfaite**{/violet} ({violet}*teleia zôê*{/violet}), que Plotin dit aussi **véritable**, est [def].

    __**L'être véritable doit vivre d'une vie parfaite.**__ Contre l'idée d'un {pink}intelligible abstrait{/pink}, simple ensemble de concepts, Plotin reprend le {sky}*Sophiste*{/sky}, où {yellow}l'être véritable ne peut être privé de vie ni de pensée{/yellow}. L'être intelligible n'a besoin de rien pour être ; donc « il est nécessaire que cet être soit en vie et __vive d'une vie parfaite__ » ([[traite26|traité 26]], chap. 6) : « s'il lui manquait quelque chose, __il ne serait pas plus être que non-être__ ».

    __**Les autres vies n'en sont que des images.**__ « La **vie parfaite**, celle qui est véritable et réelle, __réside dans cette nature intellective__ », et « les autres vies sont imparfaites, qu'elles ne sont __que des images de la vie__ » ([[traite46|traité 46]], chap. 3). {coral}Une image n'est pas une vie moindre qui existerait à côté de la vraie : elle n'a de vie que celle qu'elle reflète.{/coral} C'est pourquoi le [[g-bonheur|bonheur]], s'il est dans la vie, ne peut être que dans celle-ci.

    __**Notre vie d'ici n'en est qu'une trace.**__ « Car {yellow}notre vie actuelle{/yellow}, qui est une vie sans dieu, __n'est qu'une trace qui__ {yellow}__imite la vie véritable__{/yellow}, tandis que la {violet}vie de là-bas{/violet}, c'est l'activité de l'Intellect » ([[traite9|traité 9]], chap. 9). Et c'est l'{violet}[[g-un|Un]]{/violet} qui « procure la vie véritable » : l'âme qui s'en approche « reçoit alors une autre vie ». La trace, c'est donc la vie que nous menons d'ordinaire, tournés vers le corps et ses affaires ; {coral}dire qu'elle n'est qu'une trace ne dit pas que la vie véritable nous soit fermée{/coral}, mais que nous n'en vivons pas d'habitude.

    __**Pouvons-nous la vivre ici-bas ?**__ Si la vie parfaite est celle de l'Intellect, on pourrait croire qu'elle nous reste étrangère tant que nous avons un corps. Plotin refuse cette conséquence : il faudrait alors « __réserver le bonheur aux dieux__, s'il est vrai que l'on ne peut trouver une telle vie que chez eux » ; or « nous affirmons que l'on trouve également ce bonheur chez les hommes » ([[traite46|traité 46]], chap. 4). Cette affirmation repose sur une thèse que Plotin avance contre ses contemporains : {green}l'Intellect n'est pas hors de nous{/green}, car « notre âme __n'a pas plongé tout entière__ ici-bas, mais quelque chose d'elle __reste toujours dans l'intelligible__ » ([[traite6|traité 6]], chap. 8 ; voir [[g-ame-non-descendue|âme non descendue]]). Si l'âme était descendue tout entière, la vie parfaite ne serait pour nous qu'un souvenir ; puisqu'une part d'elle n'a jamais quitté l'Intellect, cette vie est déjà la nôtre, sans que nous le sachions. Tout homme a donc {coral}**la vie parfaite en puissance**{/coral} ; il la vit en acte quand il coïncide avec cette part de lui-même, et c'est cela, être heureux (voir [[g-bonheur|bonheur]]).

    ! La vie parfaite n'est pas une autre vie, après la mort : c'est la vie de l'Intellect, que l'homme heureux est dès maintenant. Mépriser la vie, c'est mépriser celle d'ici : « si quelqu'un ne supporte pas la vie qui est mélangée de mort, __c'est cette vie qu'il ne supporte pas, non pas la vie véritable__ » ([[traite38|traité 38]], chap. 29).

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 6, chap. 8 | une part de notre âme reste dans l'intelligible |
    | traité 9, chap. 9 | notre vie d'ici n'en est qu'une trace |
    | traité 26, chap. 6 | l'être véritable vit d'une vie parfaite |
    | traité 38, chap. 29 | qui méprise la vie méprise celle d'ici, non la vie véritable |
    | traité 46, chap. 3 | elle réside dans l'Intellect, les autres vies en sont des images |
    | traité 46, chap. 4 | l'homme peut la posséder, et alors il est heureux |

    **Voir aussi** : [[g-vie|Vie]] · [[g-degres-de-vie|Degrés de vie]] · [[g-bonheur|Bonheur]] · [[g-intellect|Intellect]] · [[g-un|Un]]
