  - id: g-vie-l1-q27
    sentence: "Le vivant, c'est-à-dire l'association d'une âme et d'un corps, qu'on appelle aussi le « composé », se dit en grec translittéré ___."
    answer: zôion
    alt: ["zoion", "zôon", "zoon"]
  - id: g-vivant-l1-q1
    sentence: "Le vivant, que l'âme produit à partir d'un corps, Plotin l'appelle aussi « le composé », en grec translittéré ___."
    answer: sunamphoteron
    alt: ["synamphoteron", "sunamphóteron"]
  - id: g-vivant-l1-q2
    sentence: "« À qui peuvent bien appartenir les plaisirs et les douleurs, les peurs ainsi que les audaces, les désirs, les aversions et les souffrances ? » : ainsi s'ouvre le traité ___, *Qu'est-ce que le vivant ?*"
    answer: 53 (I, 1)
    alt: ["53", "I, 1"]
  - id: g-vivant-l1-q3
    sentence: "Les affections ne peuvent appartenir à l'âme en elle-même, car « ce qui est immortel et incorruptible doit être ___ » (traité 53, chap. 2)."
    answer: impassible
    alt: []
  - id: g-vivant-l1-q4
    sentence: "« Il faut définir le vivant soit comme étant ce corps particulier, soit comme la ___ du corps et de l'âme, soit comme une troisième chose différente » (traité 53, chap. 5)."
    answer: communauté
    alt: ["communaute"]
  - id: g-vivant-l1-q5
    sentence: "L'âme ne produit pas le vivant « parce que l'âme se ___ elle-même au composé », mais en l'éclairant (traité 53, chap. 7)."
    answer: donne
    alt: []
  - id: g-vivant-l1-q6
    sentence: "« C'est elle qui, à partir du corps ___ et d'une sorte de lumière venue d'elle-même, produit le vivant comme une chose distincte » (traité 53, chap. 7)."
    answer: qualifié
    alt: ["qualifie"]
  - id: g-vivant-l1-q7
    sentence: "« C'est elle qui, à partir du corps qualifié et d'une sorte de ___ venue d'elle-même, produit le vivant comme une chose distincte » (traité 53, chap. 7)."
    answer: lumière
    alt: ["lumiere"]
  - id: g-vivant-l1-q8
    sentence: "« C'est elle qui, à partir du corps qualifié et d'une sorte de lumière venue d'elle-même, produit le vivant comme une chose ___ » (traité 53, chap. 7)."
    answer: distincte
    alt: []
  - id: g-vivant-l1-q9
    sentence: "Au vivant, cette chose distincte que l'âme produit, appartiennent « la faculté de ___ et toutes les affections » (traité 53, chap. 7)."
    answer: sentir
    alt: []
  - id: g-vivant-l1-q10
    sentence: "Le désir sexuel est une affection commune, car « le sang et la ___ doivent bouillir et le corps doit être dans un certain état pour que le désir soit mis en mouvement » (traité 53, chap. 5)."
    answer: bile
    alt: []
  - id: g-vivant-l1-q11
    sentence: "« Le désir du ___ n'est pas une affection commune » (traité 53, chap. 5) : il est propre à l'âme."
    answer: bien
    alt: []
  - id: g-vivant-l1-q12
    sentence: "Le vivant est à nous, mais nous ne sommes pas lui : « \"nous\" se tient au-delà et ___ le vivant » (traité 53, chap. 7)."
    answer: domine
    alt: []
  - id: g-vivant-l1-q13
