# Entrée du glossaire de Plotin (skill glossaire) : notion, citations
# vérifiées sur la GF (I, 1, 1-2, 5, 7 et 10). La carte g-vie-l1-q27 vient
# de l'entrée Vie et garde son identifiant, donc sa progression.

id: g-vivant
title: Vivant, animal (`zôion`)
icon: book
color: coral
lessons:
- id: g-vivant-l1
  title: Vivant
  notes: |-
    Chez Plotin, le {violet}**vivant**{/violet} ou « animal » (*zôion*) est [def]. Il n'est {pink}ni l'âme ni le corps{/pink}, et nous ne sommes pas lui.

    __**La question : à qui appartiennent les affections ?**__ Le [[traite53|traité 53]] s'ouvre sur elle : « __À qui peuvent bien appartenir__ les plaisirs et les douleurs, les peurs ainsi que les audaces, les désirs, les aversions et les souffrances ? » (chap. 1). Ce ne peut être à l'[[g-ame|âme]] en elle-même, car « ce qui est immortel et incorruptible __doit être impassible__ » (chap. 2). Il faut donc un autre sujet.

    __**Le vivant est un corps qualifié, éclairé par l'âme.**__ Plotin envisage trois réponses : « il faut définir le vivant soit comme étant ce corps particulier, soit comme la communauté du corps et de l'âme, soit comme __une troisième chose différente__ » (chap. 5). Il retient la troisième : l'âme ne descend pas dans le corps, « non pas parce que l'âme __se donne elle-même au composé__ », « mais parce que c'est elle qui, à partir du corps qualifié et __d'une sorte de lumière venue d'elle-même__, produit le vivant __comme une chose distincte__ » (chap. 7). {yellow}Comme une lumière qui éclaire sans se perdre dans ce qu'elle éclaire{/yellow}, l'âme fait vivre le corps sans en pâtir. **À cette chose distincte appartiennent** « la faculté de sentir et __toutes les affections__ ».

    __**Certaines**__ {violet}__**affections**__{/violet} __**sont**__ {violet}__**communes**__{/violet}__**, d'autres propres à l'âme.**__ Le désir sexuel suppose le corps : « le sang et la bile doivent bouillir et __le corps doit être dans un certain état__ pour que le désir soit mis en mouvement » (chap. 5). Mais « le désir du bien __n'est pas une affection commune__ » : il est propre à l'âme.

    __**Nous ne sommes pas le vivant.**__ Le vivant est à nous, mais le [[g-hemeis|« nous »]] est au-dessus : « "nous" se tient au-delà et __domine le vivant__ » (chap. 7). D'où les deux sens de « nous » : « La bête sauvage est __un corps qui a reçu la vie__ ; mais l'homme véritable est autre » (chap. 10). {yellow}La « bête sauvage multiple » vient de Platon : c'est la part du composé qui pâtit et désire.{/yellow}

    ! Le vivant composé n'est pas le vivant intelligible, le « vivant en soi » du *Timée*, que l'Intellect est ([[traite30|traité 30]], chap. 8) : l'un est un corps animé par une âme, l'autre la [[g-vie-parfaite|vie parfaite]] elle-même.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 53, chap. 1 | à qui appartiennent les affections |
    | traité 53, chap. 5 | trois définitions possibles du vivant |
    | traité 53, chap. 7 | l'âme produit le vivant en l'éclairant |
    | traité 53, chap. 10 | nous en deux sens : la bête et l'homme |

    **Voir aussi** : [[g-vie|Vie]] · [[g-ame|Âme]] · [[g-hemeis|Soi, soi-même]] · [[g-aisthesis|Sensation]] · [[traite53|Traité 53]]
