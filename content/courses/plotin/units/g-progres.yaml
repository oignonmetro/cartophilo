# Entrée du glossaire de Plotin (skill glossaire), écrite le 2026-10-24 à la
# demande de l'utilisateur. Citations vérifiées sur la GF (I, 9 ; I, 5, 6 ;
# VI, 5, 12 ; I, 6, 9 ; V, 3, 17). Le terme grec, prokopê (« amélioration »),
# est donné par la note de la GF au traité 16, qui le dit d'usage stoïcien.
# « Tant que la possibilité de progresser existe » (I, 9) a sa carte dans
# Suicide ; « nous ne faisons pas usage de tout ce que nous possédons »
# (I, 1, 11), dans Nous.

id: g-progres
title: Progrès (`prokopê`)
icon: book
color: teal
lessons:
- id: g-progres-l1
  title: Progrès
  notes: |-
    Chez Plotin, le {violet}**progrès**{/violet} (*prokopê*, l'« amélioration ») est [def]. Ce n'est pas {pink}une accumulation de savoirs, de vertus ou d'années{/pink}.

    __**La vie est le temps du progrès.**__ Le mot est stoïcien, et Plotin le reprend à propos du suicide : « il ne faut pas se suicider __tant que la possibilité de progresser existe__ » ([[traite16|traité 16]], chap. 1). Pourquoi le progrès compte-t-il tant ? Parce que « le rang qui est celui de chaque homme là-bas dépend de l'état dans lequel on est quand on sort de son corps » : ce qu'on devient ici décide de ce qu'on sera ensuite (voir [[g-suicide|suicide]] et [[g-daimon|démon]]).

    __**Progresser, ce n'est pas durer.**__ Le progrès ne se mesure pas en années. Si l'on peut dire que le bonheur s'accroît, c'est « au sens où l'on est plus heureux __quand on progresse vers une vertu plus grande__ », et ce qui mérite l'éloge, « ce n'est pas le fait que l'on peut compter un grand nombre d'années de bonheur, mais le fait que l'on a atteint un bonheur plus grand au moment où il est atteint » ([[traite36|traité 36]], chap. 6). {coral}Progresser, c'est changer de degré, et ce changement se juge au présent{/coral}, comme le [[g-bonheur|bonheur]] lui-même.

    __**L'âme s'accroît en**__ {violet}__**retranchant**__{/violet}__**.**__ C'est le paradoxe central. On croit progresser en ajoutant ; Plotin soutient l'inverse : « lorsque tu rejettes cette \"grandeur déterminée\", tu deviens tout ; __en vérité, tu étais tout même auparavant__. Mais parce que quelque chose d'autre s'avance vers toi après le \"tout\", __tu t'amoindris par cette addition__, car ce qui s'ajoute ne vient pas de l'être [...] mais du non-être ». D'où : « __tu t'accrois donc toi-même quand tu rejettes les autres choses__ » ([[traite23|traité 23]], chap. 12). Pourquoi ? Parce que ce que nous sommes est déjà entier dans l'intelligible (voir [[g-ame-non-descendue|âme non descendue]]) ; ce qui s'y est ajouté, le souci d'être tel corps, telle grandeur, telle partie, ne vient pas de ce qui est, et nous rétrécit. **Progresser, c'est donc devenir ce qu'on était déjà, en ôtant ce qui le cachait.**

    __**Sculpter sa propre statue.**__ L'image du [[traite1|traité 1]] dit la même chose : {yellow}« fais comme le fabriquant qui doit rendre une statue belle : il enlève ceci, efface cela, polit et nettoie »{/yellow}, et « __ne cesse de sculpter ta propre statue__ jusqu'à ce que brille en toi la splendeur divine de la vertu » (chap. 9). Le sculpteur n'ajoute rien à la pierre : il retire ce qui empêche la forme d'apparaître. Et au terme, ce qu'on est devenu n'a plus de mesure : une lumière « absolument sans mesure, comme peut l'être __ce qui est plus grand que toute mesure__ ». La formule la plus brève est celle du [[traite49|traité 49]] : « __Retranche toutes choses__ » (chap. 17).

    __**Par degrés, puis d'un coup.**__ Le chemin a ses étapes : « il faut donc commencer par __habituer l'âme elle-même__ à voir les \"belles occupations\", puis les beaux travaux » ([[traite1|traité 1]], chap. 9), et des vertus civiques on passe aux vertus qui purifient (voir [[g-katharsis|purification]]). Mais le terme n'est pas une étape de plus : l'union à l'Un survient « soudain » (voir [[g-henosis|hénose]]). Et ce qui progresse n'est pas la part de l'âme qui reste là-haut, toujours pure : c'est « nous », qui faisons usage d'une part de plus en plus grande de ce que nous possédons (voir [[g-hemeis|nous]]).

    | | Le corps qui croît | L'âme qui progresse |
    | Comment | en recevant de la matière | en retranchant ce qui s'est ajouté |
    | Ce qu'il devient | plus grand, jusqu'à sa mesure | ce qu'elle était déjà |
    | Sa limite | la mesure que fixe sa raison | plus grande que toute mesure |

    ! Progresser n'est pas apprendre du dehors ce qu'on ignorait : c'est éclairer et exercer ce qu'on possédait déjà, les empreintes de l'intelligible déposées en l'âme (voir [[g-tupos|empreinte]] et [[g-epistrophe|conversion]]).

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 1, chap. 9 | sculpter sa propre statue |
    | traité 16, chap. 1 | ne pas partir tant qu'on peut progresser |
    | traité 23, chap. 12 | on s'accroît en rejetant le reste |
    | traité 36, chap. 6 | progresser vers une vertu plus grande, non durer |
    | traité 49, chap. 17 | retranche toutes choses |

    **Voir aussi** : [[g-katharsis|Purification]] · [[g-hemeis|Nous]] · [[g-croissance|Croissance]] · [[g-bonheur|Bonheur]] · [[g-henosis|Hénose]]
