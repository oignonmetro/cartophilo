  - id: g-progres-l1-q1
    sentence: "Le progrès de l'âme, mot d'usage stoïcien que Plotin reprend à propos du suicide, se dit en grec translittéré ___."
    answer: prokopê
    alt: ["prokope", "prokopè"]
  - id: g-progres-l1-q2
    sentence: "« Le rang qui est celui de chaque homme là-bas dépend de l'___ dans lequel on est quand on sort de son corps » (traité 16, chap. 1)."
    answer: état
    alt: ["etat"]
  - id: g-progres-l1-q3
    sentence: "Le bonheur s'accroît seulement « au sens où l'on est plus heureux quand on progresse vers une ___ plus grande » (traité 36, chap. 6)."
    answer: vertu
    alt: []
  - id: g-progres-l1-q4
    sentence: "Ce qui mérite l'éloge, « ce n'est pas le fait que l'on peut compter un grand nombre d'___ de bonheur » (traité 36, chap. 6)."
    answer: années
    alt: ["annees"]
  - id: g-progres-l1-q5
    sentence: "« Lorsque tu rejettes cette \"grandeur déterminée\", tu deviens tout ; en vérité, tu étais tout même ___ » (traité 23, chap. 12)."
    answer: auparavant
    alt: []
  - id: g-progres-l1-q6
    sentence: "« Tu t'amoindris par cette ___, car ce qui s'ajoute ne vient pas de l'être » (traité 23, chap. 12)."
    answer: addition
    alt: []
  - id: g-progres-l1-q7
    sentence: "« Tu t'accrois donc toi-même quand tu ___ les autres choses » (traité 23, chap. 12)."
    answer: rejettes
    alt: []
  - id: g-progres-l1-q8
    sentence: "« Ne cesse de sculpter ta propre ___ jusqu'à ce que brille en toi la splendeur divine de la vertu » (traité 1, chap. 9)."
    answer: statue
    alt: []
  - id: g-progres-l1-q9
    sentence: "« Fais comme le fabriquant qui doit rendre une statue belle : il enlève ceci, efface cela, polit et ___ » (traité 1, chap. 9)."
    answer: nettoie
    alt: []
  - id: g-progres-l1-q10
    sentence: "« ___ toutes choses » : la formule la plus brève du progrès de l'âme (traité 49, chap. 17)."
