# Entrée du glossaire de Plotin (skill glossaire), écrite le 2026-10-24 à la
# demande de l'utilisateur, réécrite le 2026-10-25 après sa relecture, puis
# le 2026-10-26 avec la procédure complète (journal NotebookLM, plan validé
# par l'utilisateur, relecture étape par étape) ; sujets (ce
# qu'est le végétatif, d'où il vient, pourquoi il fait le vivant, pourquoi
# il règne seul dans la plante, pourquoi elle est audacieuse, comment naît
# le désir), avec NotebookLM. Citations vérifiées sur la GF (IV, 9, 3 ; V,
# 2, 2 ; III, 4, 1-2 ; IV, 3, 27 ; IV, 4, 18-21, 27-28). Le terme grec,
# phutikon, est celui des notes de la GF. La croissance a son entrée
# (Croissance), l'air échauffé et le cadavre la leur (Animé / Inerte),
# l'irascible la sienne (Tripartition de l'âme).

id: g-vegetatif
title: Végétatif (`phutikon`)
icon: book
color: teal
lessons:
- id: g-vegetatif-l1
  title: Végétatif
  notes: |-
    Chez Plotin, le {violet}**végétatif**{/violet} (*phutikon*) est [def]. Ce n'est pas {pink}une âme à part, propre aux plantes{/pink} : c'est la dernière puissance de l'âme, présente en tout vivant, que Plotin appelle aussi la *nature*.

    __**Le végétatif est une**__ {coral}__**puissance**__{/coral} __**de l'âme, non une âme à part.**__ L'âme est une, mais elle a plusieurs puissances, et cela ne la divise pas : « ce n'est pas parce que l'âme a plusieurs puissances qu'elle n'est pas une. Car __dans la semence aussi il y a plusieurs puissances, et la semence reste une__ » ([[traite8|traité 8]], chap. 3 ; voir [[g-tripartition-de-l-ame|tripartition de l'âme]]). Plotin les distingue par leur {yellow}rapport au corps{/yellow} : la {pink}raison{/pink} n'y est {pink}pas divisée{/pink} ; la sensation l'est, puisqu'elle est en chaque organe ; et « ce qui en elle est en mesure de {yellow}__façonner et de fabriquer des corps__{/yellow} est encore une puissance » (*ibid*.). C'est le {yellow}végétatif{/yellow} : il nourrit le corps, le fait croître et en engendre d'autres (voir [[g-croissance|croissance]] et [[g-reproduction|reproduction]]), sans calcul ni outils. Et comme un géomètre voit ses figures naître pendant qu'il contemple, **la nature produit** __en contemplant les raisons qu'elle porte__, et Plotin la fait parler ainsi : « c'est alors que je contemple que __les contours des corps apparaissent__ » ([[traite30|traité 30]], chap. 4 ; voir [[g-theoria|contemplation]]).

    Cependant, elle agit sans sentir, et on le voit au fait que nous ne sentons pas ses effets. Si **la puissance végétative** (qui nourrit, façonne et fait croître) **s'étend à la masse corporelle tout entière**, la faculté sensitive, qui exige un organe spécifiquement disposé à transmettre l'affection à l'âme, ne s'exerce pas dans toutes ses parties : « la puissance végétative se trouve aussi dans des parties __qui n'ont pas la sensation__ » ([[traite8|traité 8]], chap. 3).

    __**Le végétatif est la**__ {coral}__**dernière**__{/coral} __**puissance de l'âme.**__ Parce qu'après elle, l'âme ne produit plus rien de vivant (et donc aucune **puissance**) : la nature « engendre quelque chose de complètement différent d'elle. Car __après elle, il n'y a plus de vie__ et ce qu'elle produit est dépourvu de vie » ([[traite15|traité 15]], chap. 1). Autrement dit, il ne peut pas y avoir une « quatrième puissance » de l'âme après le végétatif, car __une puissance qui produirait de la non-vie ou de l'inertie cesserait par définition d'être une âme__. Car en effet, ce qu'elle produit, c'est le corps, qui ne vit pas par lui-même et qui ne peut pas produire par lui-même la vie. {coral}**Le végétatif est donc la frontière de l'âme : la puissance par laquelle elle produit ce qui ne vit pas.**{/coral}

    __**Le**__ {amber}__**végétatif**__{/amber} __**qui est en nous vient de**__ {amber}__**l'âme du monde**__{/amber}__**, parce que**__ {coral}__**notre corps est une partie du monde**__{/coral}__**.**__ Plotin pose la question : « pourquoi donc la puissance nutritive ne procède-t-elle pas de notre âme ? » ([[traite8|traité 8]], chap. 3). Sa réponse tient en trois points.
    - Ce qui est nourri : « la partie de l'univers qui est nourrie est aussi celle qui subit la sensation » (*ibid*.). __Notre corps est un morceau du corps du monde__ : c'est lui que nous sentons, et il est fait des éléments du monde.
    - Ce qui le façonne : __ce n'est pas notre âme__. « Nous, parce que nous avons été façonnés par l'âme que nous ont donnée les dieux célestes et le ciel lui-même, c'est aussi par cette âme que nous sommes associés à nos corps » ; notre âme propre, elle, « celle par laquelle nous sommes ce que nous sommes, __est la cause de notre bien-être, non pas de notre être__ » ([[traite40|traité 40]], chap. 5).
    - Ce qui nous est propre : « la sensation qui porte des jugements en s'aidant de l'intellect __appartient à chacun__ » ([[traite8|traité 8]], chap. 3).
    L'âme du monde a préparé ce corps avant que la nôtre y vienne, « comme si l'âme qui en a le contrôle et qui est __pour ainsi dire leur sœur__ leur avait préparé à l'avance des demeures » ([[traite27|traité 27]], chap. 6). La *sœur* est l'âme du monde, que Plotin dit « de même espèce » que la nôtre (*ibid*.), non sa mère, puisque toutes deux viennent de la même Âme ; les *demeures* sont les corps, déjà façonnés quand notre âme y entre ; et c'est pourquoi notre âme peut se consacrer à ce qui lui est propre, juger et penser. {coral}*Venir de l'univers* ne veut pas dire qu'un morceau de l'âme du monde s'est détaché pour entrer en nous{/coral} : toutes les âmes sont une, puisque « si l'âme de l'univers et mon âme viennent d'une âme qui est une, il faut encore que toutes les âmes n'en soient qu'une » ([[traite8|traité 8]], chap. 1). La même puissance peut donc être à la fois de l'univers et à nous, et Plotin le dit en un mot : « la puissance nutritive, si elle vient de l'univers, __tient aussi quelque chose de cette âme-là__ » (chap. 3). Il distingue ainsi en nous l'âme « par laquelle nous sommes ce que nous sommes » et l'autre, « __celle qui nous vient de l'univers__ » ([[traite27|traité 27]], chap. 27). **Le végétatif est en nous, mais il n'est pas nous** (voir [[g-hemeis|nous]]).

    __**Le végétal n'a que le végétatif.**__ Si toutes ces puissances sont celles d'une même âme, pourquoi la plante n'a-t-elle que la dernière ? Parce que **c'est le corps qui limite ce qu'il reçoit**, non l'âme ce qu'elle donne : « puisqu'il existe en lui une aptitude, il a reçu ce qui convenait à cette aptitude. [...] Ce qui est né tel ou tel ne reçoit cependant pas l'âme tout entière, bien que l'âme tout entière soit présente, mais non pas à lui. Par exemple, même les autres animaux et les plantes __ne possèdent de l'âme que ce qu'ils peuvent en recevoir__ » ([[traite22|traité 22]], chap. 15). Plotin le fait voir par une image : « lorsqu'un son manifeste un sens, certains vivants __saisissent le sens en plus du bruit__ qui accompagne le son » (*ibid*.), tandis que d'autres n'entendent que le bruit. Ici, __le son est l'âme tout entière__, le sens ses puissances hautes, et __chaque vivant en reçoit ce que son corps lui permet__. Or une puissance ne s'exerce que par l'organe qui lui convient, car « l'âme donne à chaque organe la faculté qui convient à son activité » ([[traite27|traité 27]], chap. 23) ; {coral}la plante, sans organe des sens, n'est apte qu'à se nourrir, croître et engendrer{/coral}. Donc, en elle, « __c'est elle qui domine__, dans la mesure où elle seule y est advenue » ([[traite15|traité 15]], chap. 1), et les autres parties de l'âme, présentes, ne font rien : « la partie qui domine en elle remplit sa fonction propre, alors que {coral}__les autres parties demeurent inactives__{/coral}, car elles lui sont extérieures » (chap. 2). Présentes et pourtant extérieures : ce n'est pas une contradiction, car l'âme n'est pas dans le corps comme un liquide dans un vase ; {coral}une puissance qui ne trouve pas dans ce corps l'organe de son activité reste hors de lui{/coral}, sans cesser d'appartenir à l'âme, {teal}comme le sens d'une parole reste présent pour l'animal qui n'en saisit que le bruit{/teal}. En nous, {amber}la même puissance est là, mais à une autre place{/amber} : « même dans l'âme qui est en nous on trouve la nature, mais __notre âme la domine__, car cette nature est une partie » (chap. 1). Et le corps qu'une âme reçoit répond à la partie qu'elle a cultivée : quand l'âme quitte un corps, « elle devient celle de ses parties qu'elle a développée le plus » (chap. 2), si bien que ceux qui ont vécu par le seul végétatif « s'appliquaient en fait __à se transformer en arbres__ » (*ibid*. ; voir [[g-daimon|démon]]).

    | Vivant | Ce qui domine en lui | Le végétatif y est |
    | la plante | le végétatif | seul, et il règne |
    | l'animal | la sensation | une partie qui nourrit le corps sentant |
    | l'homme | la raison, s'il la développe | une partie que notre âme domine |

    __**La plante est la partie la plus**__ {coral}__**audacieuse**__{/coral} __**de l'âme, parce qu'elle s'est avancée le plus loin de son principe sans s'en séparer.**__ L'âme, en procédant, ne se coupe de rien : « rien n'est séparé ni coupé de ce qui le précède, et voilà pourquoi il semble aussi que même l'Âme de là-haut parvient jusqu'aux plantes [...] elle n'est certainement pas tout entière dans les plantes, mais elle s'y trouve parce qu'__elle s'est avancée à un tel point__ dans la région inférieure » ([[traite11|traité 11]], chap. 1). Le végétatif est le dernier degré de cette avancée, celui après lequel il n'y a plus de vie. Dans la plante, où il est seul, c'est donc comme si l'âme avait envoyé « __la partie la plus audacieuse et la plus imprudente__ qui s'est avancée jusqu'à un tel point » (chap. 2). {coral}Audacieuse, parce que l'{/coral}{violet}audace{/violet} {coral}est, chez Plotin, le mouvement par lequel une âme s'écarte de son principe pour être à part{/coral} : « l'origine du mal pour elles, c'est bien l'audace, la génération, l'altérité première et __le fait de vouloir s'appartenir à elles-mêmes__ », par quoi elles « se portent au plus loin de là-bas » ([[traite10|traité 10]], chap. 1 ; voir [[g-tolma|audace]]) ; aucune partie de l'âme ne s'est portée plus loin. {coral}Imprudente, parce qu'elle s'est avancée jusqu'à __toucher ce qui ne vit pas__.{/coral} Mais cet éloignement est de rang, non de lieu, et la branche coupée le montre : si l'âme était localisée dans la matière, le fait de couper une branche devrait soit trancher l'âme en deux, soit faire s'échapper ou s'écouler une partie de l'âme hors du morceau coupé. L'âme n'a donc pas besoin de faire un déplacement local pour « fuir » ou « remonter » quand le corps qu'elle anime est coupé en deux : __n'étant jamais descendue spatialement dans le corps__, elle demeure en elle-même, dans sa puissance supérieure (son principe). Ce n'est pas l'âme qui bouge ou se retire, {amber}__**c'est le morceau de bois coupé qui a perdu l'aptitude physique à recevoir la présence de la forme psychique**__{/amber}.

    __**Le désir naît du végétatif.**__ Nous avons naturellement tendance à penser que c'est la partie sensitive qui désire, parce que nous prenons conscience du désir sous la forme d'une sensation (comme la faim, la soif ou l'attrait physique). Or, Plotin distingue rigoureusement la **source du besoin** (l'émergence de l'inclination dans l'organisme) et la **connaissance de ce besoin** (la perception du désir par la sensation).

    - En assurant la vie biologique, la **faculté végétative** est la seule faculté directement concernée par la préservation de l'organisme et par ses besoins physiologiques. Comme le corps subit continuellement des déperditions, c'est la faculté végétative qui génère l'inclination visant à restaurer l'état naturel du vivant. « De toute évidence, ce qui engendre, nourrit et fait croître, doit aussi avoir le désir de ces activités. » (traité 27, chap. 23).
    - La **faculté sensitive** a une fonction purement cognitive et représentative : elle est un acte de jugement (krísis) porté par l'âme incorporelle sur les modifications du corps, sans être elle-même affectée ni éprouver le moindre manque. Car si la faculté sensitive désirait elle-même, la partie sensitive de l'âme subirait une affection ou une passion, ce qui détruirait l'impassibilité et l'incorporéité essentielles de l'âme.

    La faculté sensitive agit donc comme un témoin ou un messager : elle perçoit la modification physique issue du besoin végétatif et en forme une représentation. C'est cette représentation qui permet ensuite à la partie supérieure de l'âme d'intervenir pour satisfaire ou réprimer l'inclination. En attribuant le désir à la puissance végétative et non à la puissance sensitive, Plotin explique ainsi la racine biologique des appétits tout en préservant l'impassibilité et la noblesse cognitive de la sensibilité et de la pensée.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | Traité 8, ch. 1 et 3 | Notre corps étant une partie de l'univers, __sa puissance nutritive vient de l'âme du monde__ ; mais les âmes sont une, et elle tient aussi de la nôtre. |
    | Traité 11, ch. 1 et 2 | L'âme s'avance jusqu'aux plantes sans se séparer de son principe ; la partie qui y parvient est la plus audacieuse, et couper la branche ne la déplace pas. |
    | Traité 15, ch. 1 et 2 | Après la nature il n'y a plus de vie ; dans la plante elle règne seule, les autres parties de l'âme y restant inactives. |
    | Traité 22, ch. 15 | Un corps ne reçoit de l'âme, présente tout entière, que ce qu'il est apte à recevoir : il en recueille une trace, comme une chaleur. |
    | Traité 28, ch. 18 et 20 | Le corps vivant n'a qu'une trace ou ombre de l'âme ; le désir naît en lui, et la nature s'y associe comme une mère. |
    | Traité 40, ch. 5 | C'est l'âme venue du ciel qui nous façonne et nous lie au corps ; la nôtre est cause de notre bien-être, non de notre être. |

    **Voir aussi** : [[g-phusis|Nature]] · [[g-croissance|Croissance]] · [[g-reproduction|Reproduction]] · [[g-tripartition-de-l-ame|Tripartition de l'âme]] · [[g-anime-inerte|Animé / Inerte]] · [[g-desir|Désir]]
