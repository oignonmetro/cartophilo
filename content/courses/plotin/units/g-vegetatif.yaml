# Entrée du glossaire de Plotin (skill glossaire), écrite le 2026-10-24 à la
# demande de l'utilisateur. Citations vérifiées sur la GF (IV, 9, 3 ; V, 2,
# 2 ; III, 4, 1-2 ; IV, 3, 23 ; IV, 4, 18 et 28). Le terme grec, phutikon,
# est celui des notes de la GF (traités 8, 22-26 et 27-29). La croissance a
# son entrée (Croissance), le corps vivant comme air échauffé la sienne
# (Animé / Inerte) ; « nous sommes non pas notre faculté végétative »
# (I, 4, 9) a sa carte dans Bonheur.

id: g-vegetatif
title: Végétatif (`phutikon`)
icon: book
color: teal
lessons:
- id: g-vegetatif-l1
  title: Végétatif
  notes: |-
    Chez Plotin, le {violet}**végétatif**{/violet} (*phutikon*) est [def]. Ce n'est pas {pink}une âme à part, propre aux plantes{/pink} : c'est une puissance de l'âme, présente en tout vivant, que nous tenons de l'univers.

    __**Une même puissance, qui domine ou qui sert.**__ La puissance végétative nourrit, fait croître et engendre (voir [[g-croissance|croissance]] et [[g-reproduction|reproduction]]). Elle est en nous comme dans les plantes, mais à une autre place : « même dans l'âme qui est en nous on trouve la nature, mais __notre âme la domine__, car cette nature est une partie. Mais quand c'est dans des plantes que la nature advient, __c'est elle qui domine__, dans la mesure où elle seule y est advenue » ([[traite15|traité 15]], chap. 1). {coral}Ce qui fait la plante, ce n'est donc pas une âme d'une autre sorte, c'est que le végétatif y règne seul.{/coral}

    __**Nous la tenons de l'univers, non de notre âme.**__ D'où vient le végétatif qui est en nous ? Plotin pose la question : « pourquoi donc la puissance nutritive ne procède-t-elle pas de notre âme ? » Et il répond : « parce que la partie de l'univers qui est nourrie est aussi celle qui subit la sensation, tandis que la sensation qui porte des jugements en s'aidant de l'intellect __appartient à chacun__, et pour elle il n'était pas besoin de façonner ce qui est façonné par l'univers » ([[traite8|traité 8]], chap. 3). Autrement dit : notre corps est un morceau du corps du monde, et c'est l'âme du monde, par sa [[g-phusis|nature]], qui le nourrit et le façonne ; ce qui nous est propre commence avec le jugement. **Le végétatif est en nous, mais il n'est pas nous** (voir [[g-hemeis|nous]]).

    __**Une âme sans perception, présente partout.**__ Le végétatif agit là où rien ne sent : « la puissance végétative se trouve __aussi dans des parties qui n'ont pas la sensation__ » (chap. 3). Il « n'est absente d'aucune partie du corps, puisqu'elle __le nourrit par le moyen du sang__ qui se trouve dans les veines », dont le point de départ est le foie ([[traite27|traité 27]], chap. 23). C'est bien encore une âme, mais au plus bas : le corps qu'elle anime possède « comme une ombre de l'âme » ([[traite28|traité 28]], chap. 18 ; voir [[g-anime-inerte|animé et inerte]]).

    __**La racine du désir.**__ Le végétatif est aussi ce qui, en nous, désire : « il faut considérer que l'origine du désir se situe dans la région du foie, parce que c'est là surtout qu'est actif le végétatif, qui __communique sa trace psychique au foie et au corps__ » ([[traite28|traité 28]], chap. 28). Pourquoi ? Parce que ce qui nourrit doit vouloir nourrir : la faim, la soif, le désir d'engendrer sont l'œuvre du végétatif perçue par le vivant. La colère en dépend aussi, par le sang et la bile, mais suppose la sensation ; c'est pourquoi les plantes, qui ont le végétatif, n'ont pas d'irascible : « __ils ne sont dotés ni de sang ni de bile__ » (même chapitre ; voir [[g-tripartition-de-l-ame|tripartition de l'âme]]).

    __**La plante, la part la plus audacieuse de l'âme.**__ Dans une plante, c'est « comme si l'une de ses parties s'y trouvait, __la partie la plus audacieuse et la plus imprudente__ qui s'est avancée jusqu'à un tel point » ([[traite11|traité 11]], chap. 2). Audacieuse, parce qu'elle s'est avancée le plus loin de sa source (voir [[g-tolma|audace]]). Et pourtant elle ne s'en est pas détachée : quand on coupe une branche, l'âme qui s'y trouvait va « __là d'où elle est venue__, car elle ne s'en est pas localement éloignée ». **Couper la plante ne coupe pas l'âme**, qui n'était pas dans un lieu.

    | Vivant | Ce qui domine en lui | Le végétatif y est |
    | la plante | le végétatif | seul, et il règne |
    | l'animal | la sensation | une partie qui nourrit le corps sentant |
    | l'homme | la raison, s'il la développe | une partie que notre âme domine |

    ! Le végétatif n'est pas la nature : la [[g-phusis|nature]] est l'âme du monde à son dernier degré, qui produit tous les corps ; le végétatif est cette puissance en tant qu'elle est présente dans un vivant, sa plante ou son corps. Et vivre par lui seul, c'est devenir plante : ceux chez qui il dominait « __s'appliquaient en fait à se transformer en arbres__ » ([[traite15|traité 15]], chap. 2 ; voir [[g-daimon|démon]]).

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 8, chap. 3 | la puissance nutritive vient de l'univers |
    | traité 11, chap. 2 | la plante, part la plus audacieuse de l'âme |
    | traité 15, chap. 1 | le végétatif domine dans la plante, sert en nous |
    | traité 27, chap. 23 | il nourrit tout le corps par le sang |
    | traité 28, chap. 28 | il est l'origine du désir |

    **Voir aussi** : [[g-phusis|Nature]] · [[g-croissance|Croissance]] · [[g-reproduction|Reproduction]] · [[g-tripartition-de-l-ame|Tripartition de l'âme]] · [[g-anime-inerte|Animé / Inerte]]
