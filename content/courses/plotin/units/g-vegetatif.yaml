# Entrée du glossaire de Plotin (skill glossaire), écrite le 2026-10-24 à la
# demande de l'utilisateur, réécrite le 2026-10-25 après sa relecture, puis
# le 2026-10-26 avec la procédure complète (journal NotebookLM, plan validé
# par l'utilisateur, relecture étape par étape) ; sujets (ce
# qu'est le végétatif, d'où il vient, pourquoi il fait le vivant, pourquoi
# il règne seul dans la plante, pourquoi elle est audacieuse, comment naît
# le désir), avec NotebookLM. Citations vérifiées sur la GF (IV, 9, 3 ; V,
# 2, 2 ; III, 4, 1-2 ; IV, 3, 27 ; IV, 4, 18-21, 27-28). Le terme grec,
# phutikon, est celui des notes de la GF. La croissance a son entrée
# (Croissance), l'air échauffé et le cadavre la leur (Animé / Inerte),
# l'irascible la sienne (Tripartition de l'âme).

id: g-vegetatif
title: Végétatif (`phutikon`)
icon: book
color: teal
lessons:
- id: g-vegetatif-l1
  title: Végétatif
  notes: |-
    Chez Plotin, le {violet}**végétatif**{/violet} (*phutikon*) est [def]. Ce n'est pas {pink}une âme à part, propre aux plantes{/pink} : c'est la dernière puissance de l'âme, présente en tout vivant, que Plotin appelle aussi la *nature*.

    __**Le végétatif est la dernière puissance de l'âme, non une âme à part.**__ L'âme est une, mais elle a plusieurs puissances, et cela ne la divise pas : « ce n'est pas parce que l'âme a plusieurs puissances qu'elle n'est pas une. Car __dans la semence aussi il y a plusieurs puissances, et la semence reste une__ » ([[traite8|traité 8]], chap. 3 ; voir [[g-tripartition-de-l-ame|tripartition de l'âme]]). Plotin les distingue par leur rapport au corps : la raison n'y est pas divisée ; la sensation l'est, puisqu'elle est en chaque organe ; et « ce qui en elle est en mesure de __façonner et de fabriquer des corps__ est encore une puissance » (*ibid*.). C'est le végétatif : il nourrit le corps, le fait croître et en engendre d'autres (voir [[g-croissance|croissance]] et [[g-reproduction|reproduction]]), sans calcul ni outils : comme un géomètre voit ses figures naître pendant qu'il contemple, la nature produit en contemplant les raisons qu'elle porte, et Plotin la fait parler ainsi : « c'est alors que je contemple que __les contours des corps apparaissent__ » ([[traite30|traité 30]], chap. 4 ; voir [[g-theoria|contemplation]]). Il agit sans sentir : « la puissance végétative se trouve aussi dans des parties __qui n'ont pas la sensation__ » ([[traite8|traité 8]], chap. 3). Pourquoi la dernière ? Parce qu'après elle l'âme ne produit plus rien de vivant : la nature « engendre quelque chose de complètement différent d'elle. Car __après elle, il n'y a plus de vie__ et ce qu'elle produit est dépourvu de vie » ([[traite15|traité 15]], chap. 1). Ce qu'elle produit, c'est le corps, qui ne vit pas par lui-même. Et cette dernière puissance reste une activité de l'âme, non une chose à part : même « celle qui est dans la matière, par exemple l'âme végétative, __est aussi un acte et elle reste ce qu'elle est__ » ([[traite25|traité 25]], chap. 3). {coral}**Le végétatif est donc la frontière de l'âme : la puissance par laquelle elle touche ce qui ne vit pas.**{/coral}

    __**Le végétatif qui est en nous vient de l'âme du monde, parce que notre corps est une partie du monde.**__ Plotin pose la question : « pourquoi donc la puissance nutritive ne procède-t-elle pas de notre âme ? » ([[traite8|traité 8]], chap. 3). Sa réponse tient en trois prémisses.
    - Ce qui est nourri : « la partie de l'univers qui est nourrie est aussi celle qui subit la sensation » (*ibid*.). __Notre corps est un morceau du corps du monde__ : c'est lui que nous sentons, et il est fait des éléments du monde.
    - Ce qui le façonne : ce n'est pas notre âme. « Nous, parce que nous avons été façonnés par l'âme que nous ont donnée les dieux célestes et le ciel lui-même, c'est aussi par cette âme que nous sommes associés à nos corps » ; notre âme propre, elle, « celle par laquelle nous sommes ce que nous sommes, __est la cause de notre bien-être, non pas de notre être__ » ([[traite40|traité 40]], chap. 5).
    - Ce qui nous est propre : « la sensation qui porte des jugements en s'aidant de l'intellect __appartient à chacun__ » ([[traite8|traité 8]], chap. 3).
    Donc notre âme n'a pas à refaire ce qui est déjà fait : « pour elle __il n'était pas besoin de façonner ce qui est façonné par l'univers__ » (*ibid*.). L'âme du monde a préparé ce corps avant que la nôtre y vienne, « comme si l'âme qui en a le contrôle et qui est __pour ainsi dire leur sœur__ leur avait préparé à l'avance des demeures » ([[traite27|traité 27]], chap. 6). L'image se lit terme à terme : la *sœur* est l'âme du monde, que Plotin dit « de même espèce » que la nôtre (*ibid*.), non sa mère, puisque toutes deux viennent de la même Âme ; les *demeures* sont les corps, déjà façonnés quand notre âme y entre ; et c'est pourquoi notre âme peut se consacrer à ce qui lui est propre, juger et penser. {coral}*Venir de l'univers* ne veut pas dire qu'un morceau de l'âme du monde s'est détaché pour entrer en nous{/coral} : toutes les âmes sont une, puisque « si l'âme de l'univers et mon âme viennent d'une âme qui est une, il faut encore que toutes les âmes n'en soient qu'une » ([[traite8|traité 8]], chap. 1). La même puissance peut donc être à la fois de l'univers et à nous, et Plotin le dit en un mot : « la puissance nutritive, si elle vient de l'univers, __tient aussi quelque chose de cette âme-là__ » (chap. 3). Il distingue ainsi en nous l'âme « par laquelle nous sommes ce que nous sommes » et l'autre, « __celle qui nous vient de l'univers__ » ([[traite27|traité 27]], chap. 27). **Le végétatif est en nous, mais il n'est pas nous** (voir [[g-hemeis|nous]]).

    __**Le corps vivant n'a pas l'âme mais sa trace, et c'est ce qui le sépare de l'inerte.**__ Comment une puissance incorporelle est-elle présente à un corps ? Par une règle générale : quand une réalité s'allie à une réalité d'un autre genre, et que « la réalité inférieure reçoit quelque chose de la réalité supérieure sans être en mesure de la posséder, la réalité inférieure __doit se contenter d'une trace__ de la réalité supérieure » ([[traite28|traité 28]], chap. 18). Le corps ne peut pas posséder l'âme, qui n'est dans aucun lieu ; il en reçoit donc une trace, et c'est le végétatif qui la lui donne : il est l'âme « qui se trouve dans le voisinage du corps, celle que nous appelons "nature" et __qui donne au corps une trace d'elle-même__ » (chap. 20). Plotin appelle aussi cette trace « comme __une ombre de l'âme__ » (chap. 18). Une ombre reproduit la figure de ce qui la projette sans en être une partie : de même, le corps vivant a quelque chose de la vie de l'âme, qui est désormais à lui, sans avoir l'âme elle-même. Plotin dit ailleurs comment elle s'imprime : « c'est __par une sorte de voisinage__ que le corps recueille une trace de l'âme, qui n'est pas venue comme une partie de l'âme vient au corps, mais est comme une chaleur ou une illumination » ([[traite22|traité 22]], chap. 15). C'est donc cette trace qui sépare le vivant de l'inerte, et l'inerte est ce qui ne l'a pas ou ne l'a plus. La puissance qui vient de la terre donne au végétal « ce par quoi il est __différent d'une branche coupée__ et qui n'est plus un végétal, mais seulement un morceau de bois », et les pierres « croissent tant qu'elles restent attachées à la terre », puis gardent la taille qu'elles avaient quand on les a extraites ([[traite28|traité 28]], chap. 27). Et cette trace est une chaleur plutôt qu'une lumière : le corps vivant « ressemble à l'air, non pas lorsqu'il est illuminé, mais __lorsqu'il est échauffé__ » (chap. 18). La lumière quitte l'air dès que sa source s'éloigne ; la chaleur, elle, s'imprime dans l'air et y reste un temps. C'est pourquoi le cadavre garde un temps la trace qui s'en va : « les cheveux qui continuent de pousser sur les cadavres » en sont la preuve (chap. 29 ; voir [[g-anime-inerte|animé et inerte]], où l'image de l'air échauffé dit la même chose).

    __**Seul le végétatif agit dans la plante, parce qu'un corps ne reçoit de l'âme que ce qu'il peut en recevoir.**__ Si toutes ces puissances sont celles d'une même âme, pourquoi la plante n'a-t-elle que la dernière ? Parce que c'est le corps qui limite ce qu'il reçoit, non l'âme ce qu'elle donne : « puisqu'il existe en lui une aptitude, il a reçu ce qui convenait à cette aptitude. [...] Ce qui est né tel ou tel ne reçoit cependant pas l'âme tout entière, bien que l'âme tout entière soit présente, mais non pas à lui. Par exemple, même les autres animaux et les plantes __ne possèdent de l'âme que ce qu'ils peuvent en recevoir__ » ([[traite22|traité 22]], chap. 15). Plotin le fait voir par une image : « lorsqu'un son manifeste un sens, certains vivants __saisissent le sens en plus du bruit__ qui accompagne le son » (*ibid*.), tandis que d'autres n'entendent que le bruit. Ici, le son est l'âme tout entière, le sens ses puissances hautes, et chaque vivant en reçoit ce que son corps lui permet. Or une puissance ne s'exerce que par l'organe qui lui convient, car « l'âme donne à chaque organe la faculté qui convient à son activité » ([[traite27|traité 27]], chap. 23) ; la plante, sans organe des sens, n'est apte qu'à se nourrir, croître et engendrer. Donc, en elle, « __c'est elle qui domine__, dans la mesure où elle seule y est advenue » ([[traite15|traité 15]], chap. 1), et les autres parties de l'âme, présentes, ne font rien : « la partie qui domine en elle remplit sa fonction propre, alors que __les autres parties demeurent inactives__, car elles lui sont extérieures » (chap. 2). Présentes et pourtant extérieures : ce n'est pas une contradiction, car l'âme n'est pas dans le corps comme un liquide dans un vase ; une puissance qui ne trouve pas dans ce corps l'organe de son activité reste hors de lui, sans cesser d'appartenir à l'âme, comme le sens d'une parole reste présent pour l'animal qui n'en saisit que le bruit. En nous, la même puissance est là, mais à une autre place : « même dans l'âme qui est en nous on trouve la nature, mais __notre âme la domine__, car cette nature est une partie » (chap. 1). Et le corps qu'une âme reçoit répond à la partie qu'elle a cultivée : quand l'âme quitte un corps, « elle devient celle de ses parties qu'elle a développée le plus » (chap. 2), si bien que ceux qui ont vécu par le seul végétatif « s'appliquaient en fait __à se transformer en arbres__ » (*ibid*. ; voir [[g-daimon|démon]]).

    | Vivant | Ce qui domine en lui | Le végétatif y est |
    | la plante | le végétatif | seul, et il règne |
    | l'animal | la sensation | une partie qui nourrit le corps sentant |
    | l'homme | la raison, s'il la développe | une partie que notre âme domine |

    __**La plante est la partie la plus audacieuse de l'âme, parce qu'elle s'est avancée le plus loin de son principe sans s'en séparer.**__ L'âme, en procédant, ne se coupe de rien : « rien n'est séparé ni coupé de ce qui le précède, et voilà pourquoi il semble aussi que même l'Âme de là-haut parvient jusqu'aux plantes. [...] elle n'est certainement pas tout entière dans les plantes, mais elle s'y trouve parce qu'__elle s'est avancée à un tel point__ dans la région inférieure » ([[traite11|traité 11]], chap. 1). Le végétatif est le dernier degré de cette avancée, celui après lequel il n'y a plus de vie. Dans la plante, où il est seul, c'est donc comme si l'âme avait envoyé « __la partie la plus audacieuse et la plus imprudente__ qui s'est avancée jusqu'à un tel point » (chap. 2). {coral}Audacieuse, parce que l'audace est, chez Plotin, le mouvement par lequel une âme s'écarte de son principe pour être à part{/coral} : « l'origine du mal pour elles, c'est bien l'audace, la génération, l'altérité première et __le fait de vouloir s'appartenir à elles-mêmes__ », par quoi elles « se portent au plus loin de là-bas » ([[traite10|traité 10]], chap. 1 ; voir [[g-tolma|audace]]) ; aucune partie de l'âme ne s'est portée plus loin. {coral}Imprudente, parce qu'elle s'est avancée jusqu'à toucher ce qui ne vit pas.{/coral} Mais cet éloignement est de rang, non de lieu, et la branche coupée le montre : l'âme qui s'y trouvait va « __là d'où elle est venue__, car elle ne s'en est pas localement éloignée : elle est donc dans son principe » ([[traite11|traité 11]], chap. 2). Couper sépare des morceaux de bois, qui sont dans des lieux ; cela ne peut rien séparer de l'âme, qui n'est dans aucun lieu. **Ce que perd la branche, c'est la trace que l'âme laissait en elle, cette chaleur qui en faisait un vivant et non un morceau de bois ; la puissance, elle, n'a jamais quitté son principe.**

    __**Le désir naît dans le corps vivant, et la nature s'y associe comme une mère.**__ Le végétatif est aussi ce qui, en nous, __désire__. Mais pourquoi la faim, la soif, la recherche du chaud ou du froid relèveraient-elles de lui ? Plotin procède par élimination.
    - Pas l'âme seule : elle ne manque de rien, et il ne faut pas « chercher à rapporter la recherche des saveurs amères ou douces à l'âme elle-même » ([[traite28|traité 28]], chap. 20).
    - Pas le corps seul : un corps sans âme ne sent pas son état ; « il n'aurait souci de rien de cela, __s'il était seul__ » (*ibid*.).
    - Le corps vivant : il a la trace de l'âme, il change sans cesse d'état, et chaque manque y est senti comme une douleur, car la douleur est « la connaissance du retrait qu'opère le corps en train d'être privé de __l'image d'une âme__ » (chap. 19). C'est là que naît le désir, qui « est d'abord le fait du corps » (chap. 20).
    Pourquoi le désir naîtrait-il dans le corps et non dans la nature elle-même ? Parce que « la nature existe avant que ne vienne à l'être le corps vivant, et c'est elle qui fabrique le corps vivant en le façonnant » : c'est donc le corps vivant, et non elle, qui est affecté et qui souffre (chap. 20). Le végétatif intervient ensuite, parce que c'est lui qui a fait ce corps et qui le maintient : « la nature est __comme une mère__ ; c'est comme si devinant les souhaits de celui qui souffre, elle s'employait à le remettre sur pied » (*ibid*.). L'image se lit terme à terme : la mère est la nature, l'enfant qui souffre est le corps vivant en manque ; deviner ses souhaits, c'est s'orienter sans calcul vers ce qui le guérit ; le remettre sur pied, c'est le rendre à son état naturel. Et comme une mère soigne la fièvre de son enfant sans avoir la fièvre, la nature prend en charge la souffrance du corps sans souffrir elle-même. Il y a donc deux désirs, celui du corps vivant et celui de la nature qui s'y associe ; puis la sensation en fait une représentation, et l'âme supérieure décide de le satisfaire ou de lui résister. La preuve que le désir part du corps vivant : il change avec lui ; « autres en effet sont les désirs corporels chez les enfants, chez les adolescents et chez les adultes, tout comme ils sont autres chez ceux qui sont en bonne santé et chez les malades » (chap. 21). C'est aussi pourquoi « l'origine du désir se situe __dans la région du foie__, parce que c'est là surtout qu'est actif le végétatif » (chap. 28) : la partie végétative de l'âme « n'est **absente d'aucune partie du corps**, puisqu'elle __le nourrit par le moyen du sang__ qui se trouve dans les veines », et c'est du foie que partent les veines ([[traite27|traité 27]], chap. 23 ; voir [[g-desir|désir]] et [[g-tripartition-de-l-ame|tripartition de l'âme]]).

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | Traité 8, ch. 1 et 3 | Notre corps étant une partie de l'univers, sa puissance nutritive vient de l'âme du monde ; mais les âmes sont une, et elle tient aussi de la nôtre. |
    | Traité 11, ch. 1 et 2 | L'âme s'avance jusqu'aux plantes sans se séparer de son principe ; la partie qui y parvient est la plus audacieuse, et couper la branche ne la déplace pas. |
    | Traité 15, ch. 1 et 2 | Après la nature il n'y a plus de vie ; dans la plante elle règne seule, les autres parties de l'âme y restant inactives. |
    | Traité 22, ch. 15 | Un corps ne reçoit de l'âme, présente tout entière, que ce qu'il est apte à recevoir : il en recueille une trace, comme une chaleur. |
    | Traité 28, ch. 18 et 20 | Le corps vivant n'a qu'une trace ou ombre de l'âme ; le désir naît en lui, et la nature s'y associe comme une mère. |
    | Traité 40, ch. 5 | C'est l'âme venue du ciel qui nous façonne et nous lie au corps ; la nôtre est cause de notre bien-être, non de notre être. |

    **Voir aussi** : [[g-phusis|Nature]] · [[g-croissance|Croissance]] · [[g-reproduction|Reproduction]] · [[g-tripartition-de-l-ame|Tripartition de l'âme]] · [[g-anime-inerte|Animé / Inerte]] · [[g-desir|Désir]]
