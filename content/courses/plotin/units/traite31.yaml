- id: traite31-l3
  title: "Le monde, image du beau, sans démiurge qui délibère"
  notes: |-
    **Contre le démiurge** du *Timée* (chap. 7) : le producteur du monde n'a pas conçu la Terre, puis l'eau, puis les vivants, avant de les réaliser comme un artisan avec ses mains. D'où lui viendrait l'idée de choses jamais vues ? **Toutes choses existent ailleurs**, et une image de l'intelligible apparaît **instantanément**.

    - **« Tout ce qui se trouve ici vient de là-bas »**, mais là-bas tout est plus beau, et sans mélange.
    - **Tout est forme** : la matière même est une forme, la dernière ; aussi la production se fait-elle en silence et sans fatigue.
    - **L'homme** produit une forme différente de lui ; il faut **cesser d'être un homme** pour « cheminer dans les hauteurs » et administrer le monde (*Phèdre*).
    - **La conclusion devance le syllogisme** : là-bas, ce n'est pas parce qu'il fallait que les choses soient ainsi qu'on les a prévues ainsi ; elles sont belles **avant toute conséquence logique et toute conception**.

    **Le démiurge se réjouit** (chap. 8) : quand le *Timée* le montre charmé par son œuvre, c'est la beauté du **modèle** qu'il admire. Les amants ne savent pas que la beauté d'ici dépend de la beauté intelligible. Et **ceux qui méprisent ce monde ont tort**.

    **L'expérience de pensée** (chap. 9) : se représenter le monde comme **une sphère transparente** où l'on voit tout à la fois ; puis en retrancher la masse, le lieu, la matière, et prier le dieu de venir avec son monde. Là-bas, **l'être et le beau sont une seule et même réalité** : l'être est désiré parce qu'il est beau, le beau aimé parce qu'il est l'être.

    ! Rejeter le démiurge qui délibère n'est pas rejeter la production du monde : elle a lieu, mais d'un coup, en silence et sans calcul.
