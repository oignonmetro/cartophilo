- id: traite31-l4
  title: "Devenir le beau ; le mythe de Kronos"
  notes: |-
    **La procession vers le beau** (chap. 10) : comme dans le *Phèdre*, **Zeus** s'avance le premier vers la contemplation du beau, suivi des dieux, des démons et des âmes. Le beau éblouit ; certains le supportent. L'un voit la source du juste, l'autre la tempérance ; en dernier, la **beauté totale**.

    - Comme des hommes montés sur des hauteurs où **la terre prend une couleur dorée** s'en trouvent remplis, ceux qui sont là-bas deviennent beaux : **« la beauté n'est pas autre chose que ce qui s'épanouit »**.
    - Ceux qui sont **ivres de ce nectar** ne sont plus des spectateurs : ce qui est vu est en eux.

    **L'union** (chap. 11) : possédé par le dieu, on voit d'abord une image de soi magnifiée par la beauté ; puis, la quittant, on devient un avec le dieu présent en silence. **C'est en devenant le beau qu'on est dans le beau.** On croit alors ignorer, parce que la sensation n'a rien vu : comme **la santé**, douce compagne, se fait moins sentir que **la maladie**, ce qui nous est le plus propre échappe à la sensation.

    **Le mythe de Kronos** (chap. 12-13), d'après Hésiode :

    | Figure | Réalité |
    | Ouranos, le père | l'Un, supérieur à la beauté |
    | Kronos, qui garde ses enfants auprès de lui | l'Intellect, qui garde en lui les intelligibles |
    | Zeus, le seul fils qui se montre au-dehors | l'Âme, qui produit le monde |
    | Aphrodite | l'âme du monde, belle par une trace de beauté |

    - Il faut qu'existe une belle image du beau : le monde, **éternel** comme son modèle. Ceux qui le détruisent ou le font naître d'un projet ont tort.
    - **« Nous sommes beaux, lorsque nous nous connaissons nous-mêmes, et laids quand nous nous ignorons. »**

    Le traité finit sur une question : **« faut-il revenir en arrière pour emprunter une autre route ? »** Le traité 32 la prendra.

    ! Voir le beau comme un objet extérieur, c'est rester hors de lui : l'union suppose de devenir ce qu'on contemple.
