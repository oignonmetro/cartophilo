- id: traite31-l2
  title: "La vie bienheureuse de l'Intellect et le savoir véritable"
  notes: |-
    **Comment se faire une idée de l'Intellect ?** (chap. 3) Toute image vient d'en bas : on partira de notre intellect purifié, comme d'**un fragment d'or** qu'on purifie pour montrer ce qu'est l'or. Les dieux sont beaux par leur intellect, non par leur corps.

    **La description lyrique** (chap. 4) : là-bas, **« la vie est facile »** (Homère) ; la vérité est leur mère et leur nourrice.

    - **Tout est transparent** : rien d'obscur ni de résistant, car **la lumière est visible à la lumière**.
    - **Tout est partout, tout est tout, chaque chose est tout** ; le soleil est tous les astres. Chaque partie vient de l'ensemble et est à la fois partie et ensemble : une vue comme celle de **Lyncée**, qui voyait sous la terre, le discernerait.
    - **Ni fatigue ni satiété** : en voyant, on voit toujours davantage.

    **Le savoir véritable** (chap. 4-5) : un savoir qui ne s'acquiert pas par raisonnements, toujours là tout entier. **« Le savoir véritable, c'est la réalité, et la réalité véritable, c'est le savoir. »** Contre les stoïciens, ce savoir n'est pas la raison immanente à la nature. Les Formes ne sont pas des axiomes : ce sont **des images qui ne sont pas peintes, mais qui existent vraiment**, de belles statues qui se voient elles-mêmes.

    **Les sages d'Égypte** (chap. 6) n'écrivaient pas avec des lettres, qui développent des propositions, mais **dessinaient une seule image pour chaque chose** sur les murs de leurs temples : ils manifestaient ainsi le caractère non discursif de l'intelligible, un savoir donné tout d'un coup.

    | Ici | Là-bas |
    | des sciences faites de théorèmes déduits et de propositions | un savoir donné d'un seul coup, qui est la réalité même |
    | la lettre et le discours | l'image unique, le hiéroglyphe |

    ! L'intelligible n'est pas un système de propositions : chaque Forme est un savoir entier, saisi d'un coup.
