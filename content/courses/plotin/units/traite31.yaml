- id: traite31-l5
  title: "Repérage : le plan du traité 31"
  notes: |-
    **Le traité 31 monte de la beauté des arts et de la nature à la vie de l'Intellect, puis à l'union avec le beau, et finit sur le mythe de Kronos.**

    | Moment | Lieu | Ce qui s'y joue |
    | la beauté des arts | chap. 1 | deux blocs de pierre ; le Zeus de Phidias |
    | la beauté des réalités naturelles | chap. 2 | Hélène ; vois ta propre beauté |
    | remonter jusqu'à l'Intellect | chap. 3 | le fragment d'or |
    | la vie bienheureuse de l'Intellect | chap. 4 | Lyncée ; ni fatigue ni satiété |
    | le savoir véritable | chap. 5 | des images qui ne sont pas peintes |
    | les sages d'Égypte | chap. 6 | une image pour chaque chose |
    | production et totalité | chap. 7 | contre le démiurge qui délibère |
    | l'intelligible, beauté parfaite | chap. 8 | le démiurge se réjouit |
    | la sphère transparente | chap. 9 | retrancher la masse |
    | la contemplation du beau | chap. 10 | la terre dorée |
    | l'extase dans l'intelligible | chap. 11 | la santé et la maladie |
    | Kronos et ses enfants | chap. 12 | Zeus sort de l'Intellect |
    | Ouranos, Kronos, Zeus, Aphrodite | chap. 13 | une autre route ? |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! Seul le premier chapitre est vraiment argumentatif : le reste est un grand chant de la gloire de l'Intellect.
