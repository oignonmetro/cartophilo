id: traite31
title: "Traité 31 (V, 8) : Sur la beauté intelligible"
subtitle: "Un hymne au monde intelligible"
icon: compass
color: sky
lessons:
- id: traite31-l1
  title: "La beauté vient de la forme : Phidias"
  notes: |-
    **Le traité 31 est moins un traité d'esthétique qu'un éloge du monde intelligible**, comme y invite sa première ligne. La doctrine du beau a été posée au traité 1 (I, 6) : le beau vient de l'unité de la Forme. Ici, Plotin en vient à son objet : **si tout est forme dans l'intelligible, tout y est beau**. Celui qui a compris la beauté de l'Intellect **« sera capable aussi de se former une notion du père de l'intellect »** : le traité 32 (V, 5) en traitera.

    **Un hymne impossible** : le *Phèdre* (247c) disait qu'aucun poète n'a chanté d'hymne digne du lieu supracéleste. Le traité 31 tente cet hymne, par tous les moyens : introspection, Homère, expérience de pensée, mythe d'Hésiode. **Trois thèses** en sont le cœur : l'identité de l'Intellect et des intelligibles ; le refus du modèle du démiurge ; la coprésence des Formes, « tout ensemble » (Anaxagore).

    **Deux blocs de pierre** (chap. 1) : l'un brut, l'autre devenu la statue d'une Grâce ou d'une Muse. Le second est beau non parce que c'est une pierre, mais **par la forme que l'art y a fait entrer**, qui était d'abord dans la pensée de l'artiste, et plus belle là qu'en la pierre.

    - **Plus une chose s'étend dans la matière, plus elle s'affaiblit.**
    - **Les arts ne se bornent pas à imiter ce qu'on voit** : ils remontent aux raisons dont est faite la nature. **Phidias** n'a pas sculpté son Zeus d'après un modèle sensible, mais tel que Zeus serait **s'il consentait à paraître à nos regards**.

    **La beauté des choses naturelles** (chap. 2) : ce n'est ni le sang, ni la couleur, ni la masse. D'où vient la beauté d'**Hélène**, ou celle d'Aphrodite ? D'une forme venue du producteur. La forme seule passe par les yeux. Et il y a une beauté plus grande encore : la sagesse en quelqu'un, même si son visage est laid. **« Si toi-même tu t'es découvert beau, il faut que tu t'en souviennes. »**

    ! Plotin ne méprise pas les arts : ils imitent les raisons de la nature, et peuvent même suppléer aux défauts des choses.
