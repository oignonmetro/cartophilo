- id: traite25-l3
  title: "La matière, non-être en acte"
  notes: |-
    **Comment la matière première se rapporte-t-elle à l'acte et à la puissance ?** (chap. 4-5)

    - On la dit **tous les êtres en puissance** : elle ne peut donc être en acte l'un d'eux. N'étant aucun des êtres qui naissent en elle, **elle est un non-être** ; dépourvue de forme, elle n'est pas comptée parmi les intelligibles : **non-être en ces deux sens**.
    - **Elle est la matière des êtres parce qu'elle est en puissance** : son être se réduit à l'annonce de ce qui est à venir. Si elle était quelque chose en acte, elle ne serait pas matière au sens plein, mais **à la manière de l'airain**.
    - Ce n'est pas le non-être du *Sophiste*, l'autre de l'être, comme le mouvement : elle est **comme rejetée, totalement séparée**, incapable de se transformer. **Ce qu'elle était dès le début, non-être, elle le restera toujours** ; elle ne pouvait pas même recevoir une couleur.
    - Établie à la limite inférieure des êtres, elle n'est **qu'une image obscure**, incapable d'être formée : **« un mensonge en acte »**, ce qui revient à **« être un mensonge véritable »**, à être réellement un non-être (5, 22-24).
    - **Si l'on introduisait l'acte en elle, on la détruirait** : son être réside dans le fait d'être en puissance. Pour la garder indestructible, il faut la garder comme matière, seulement en puissance.

    **Contre Aristote** :

    | Aristote | Plotin |
    | la matière tend vers la forme et devient en acte (*Métaphysique*, Θ, 8) | ce qui est en puissance ne passe pas lui-même à l'acte |
    | il dit la matière tantôt en puissance, tantôt « puissance » | l'être en puissance n'est pas une puissance |
    | matière et forme intimement unies | un écart infranchissable entre la matière et la forme |

    ! L'airain est quelque chose en acte et autre chose en puissance ; la matière première n'est rien en acte et tout en puissance.
  points:
  - id: traite25-l3-p1
    sentence: "La matière est tous les êtres en puissance : elle ne peut donc être en ___ l'un d'eux (traité 25, 4, 4-6)."
    answer: "acte"
    alt: []
