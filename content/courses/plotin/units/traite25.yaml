- id: traite25-l2
  title: "Dans l'intelligible, tout est acte"
  notes: |-
    **Le chapitre 3 dit pourquoi ces préliminaires : en quel sens parler d'« en acte » dans les intelligibles ?**

    S'il n'y a pas de matière là-bas, si aucune réalité n'y est sur le point d'être ce qu'elle n'est pas déjà, **il n'y a rien en puissance** parmi les réalités éternelles, qui échappent au temps.

    **Et si l'on admet une matière intelligible** (traité 12 (II, 4)) ? **Ce qui joue le rôle de matière là-bas est aussi une forme**, comme l'âme, qui est une forme, est une matière pour autre chose. La forme ne lui survient pas après coup : on pense deux choses, qui dans la réalité **n'en font qu'une**, comme le **cinquième corps** d'Aristote, qu'il dit immatériel.

    **L'âme est-elle en puissance un vivant, une musicienne ?** Non : elle n'est pas ces choses en puissance, **elle est puissance de ces choses** (3, 22-23).

    **Comment l'intelligible est-il en acte ?** Non comme la statue, composé qui a reçu sa forme, mais **parce que chaque intelligible est une forme** et qu'il est parfaitement ce qu'il est. L'Intellect ne passe pas de la puissance de penser à l'acte de penser. **Toutes les réalités premières sont donc acte** : elles tiennent d'elles-mêmes, et pour toujours, ce qu'elles doivent posséder.

    | Dans le sensible | Dans l'intelligible |
    | l'être en acte (le composé) distinct de l'acte (sa forme) | l'être en acte et l'acte ne font qu'un |
    | la forme périt avec le composé | des actes éternels, les plus beaux qui soient |

    Cette nature est **« sans sommeil »**, une vie excellente : le lieu de là-bas est **un lieu de vie**, principe et source de l'âme véritable et de l'intellect.

    ! La matière intelligible n'est pas en puissance : elle est déjà une forme, et ne s'en distingue que par la raison.
