id: traite25
title: "Traité 25 (II, 5) : Sur le sens de « en puissance » et « en acte »"
subtitle: "La matière, non-être en acte"
icon: compass
color: sky
lessons:
- id: traite25-l1
  title: "En puissance, en acte : quatre notions"
  notes: |-
    **Le traité 25 examine les notions d'acte et de puissance afin d'en préciser l'application dans le monde sensible et dans le monde intelligible.** Elles viennent d'Aristote, pour qui l'une des acceptions de l'être est l'être en puissance et en entéléchie (*Métaphysique*, Δ, 7) ; les références à la *Métaphysique* y sont nombreuses. Mais Plotin **ne fait pas œuvre de doxographe** : il se réapproprie la doctrine.

    **L'être en puissance** (chap. 1) : on n'est jamais en puissance de rien. **« L'airain est une statue en puissance »** : déjà quelque chose, il peut devenir autre chose après ce qu'il était. Deux cas :

    | L'être en puissance... | Exemple |
    | subsiste dans ce qu'il produit | l'airain reste airain dans la statue |
    | se corrompt en donnant naissance à autre chose | l'eau est de l'airain en puissance, l'air du feu en puissance |

    Seul le premier cas est examiné : c'est ainsi que se comporte la **matière première**, qui subsiste toujours dans la génération des corps.

    **Quatre notions bien distinguées** :

    | Notion | Définition | Exemple |
    | l'être en puissance | un substrat passif, qui a besoin d'autre chose pour passer à l'acte | l'airain |
    | l'être en acte | le composé | la statue |
    | l'acte | la forme du composé | la figure de la statue |
    | la puissance | une puissance active, qui passe à l'acte d'elle-même | le courage |

    Il vaut mieux dire « en puissance » par rapport à « en acte », et « puissance » par rapport à « acte » (1, 27-29). **L'être en puissance n'est pas une puissance.**

    **Ce qui est en puissance ne devient pas en acte** (chap. 2) : c'est le composé, non la matière, qui est en acte. Socrate, ignorant qui devient grammairien, ne l'était en puissance que par accident : son âme avait l'aptitude.

    ! L'airain n'est pas la puissance de la statue : il en est le substrat passif, qui ne fait rien de lui-même ; c'est l'artisan qui fait la statue.
