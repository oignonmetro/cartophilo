- id: traite25-l4
  title: "Repérage : le plan du traité 25"
  notes: |-
    **Le traité 25 définit les notions sur le composé sensible (chap. 1-2), les applique aux intelligibles (chap. 3), puis à la matière (chap. 4-5).**

    | Moment | Lieu | Ce qui s'y joue |
    | l'être en puissance | chap. 1 | l'airain, statue en puissance |
    | l'être en acte, c'est le composé | chap. 2 | Socrate qui devient grammairien |
    | les intelligibles | chap. 3 | tout est en acte et acte |
    | la matière, non-être | chap. 4 | elle n'est aucun des êtres |
    | la matière seulement en puissance | chap. 5 | un mensonge véritable, indestructible |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! Le traité finit sur la matière : c'est elle que visaient les définitions du début.
  points:
  - id: traite25-l4-p1
    sentence: "Dans le traité 25 de Plotin, l'exemple de l'airain, statue en puissance, apparaît au ___."
    answer: "chap. 1"
    alt: ["1", "chapitre 1"]
  - id: traite25-l4-p2
    sentence: "Dans le traité 25 de Plotin, Socrate qui devient grammairien apparaît au ___."
    answer: "chap. 2"
    alt: ["2", "chapitre 2"]
  - id: traite25-l4-p3
    sentence: "Dans le traité 25 de Plotin, les intelligibles, tout entiers en acte, sont examinés au ___."
    answer: "chap. 3"
    alt: ["3", "chapitre 3"]
  - id: traite25-l4-p4
    sentence: "Dans le traité 25 de Plotin, la matière comme « mensonge véritable » apparaît au ___."
    answer: "chap. 5"
    alt: ["5", "chapitre 5"]
