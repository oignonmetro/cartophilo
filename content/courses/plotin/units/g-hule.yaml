  - id: g-hule-l1-q1
    sentence: "Le substrat sans qualité ni grandeur où la procession s'épuise, la matière, se dit en grec translittéré ___."
    answer: hulê
    alt: ["hule", "hylè", "hyle"]
  - id: g-hule-l1-q2
    sentence: "« Quelle est donc cette matière que l'on dit une, continue et sans ___ ? » (traité 12, chap. 8)."
    answer: qualité
    alt: ["qualite"]
  - id: g-hule-l1-q3
    sentence: "La matière n'a pas même de grandeur : « c'est une chose que d'être une grandeur et c'en est une autre d'être rendu ___ » (traité 12, chap. 8)."
    answer: grand
    alt: []
  - id: g-hule-l1-q4
    sentence: "L'argile n'est matière que pour le potier, déjà qualifiée ; la matière première, elle, est matière pour ___ choses, et donc vide de toutes (traité 12, chap. 8)."
    answer: toutes
    alt: []
  - id: g-hule-l1-q5
    sentence: "« N'étant ni âme, ni intellect, ni vie, ni forme, ni raison, ni limite », la matière est non-être « au sens du non-être ___ » (traité 26, chap. 7)."
    answer: véritable
    alt: ["veritable"]
  - id: g-hule-l1-q6
    sentence: "La matière est « image et apparence de la masse, ___ d'existence » (traité 26, chap. 7)."
    answer: désir
    alt: ["desir"]
  - id: g-hule-l1-q7
    sentence: "« C'est pourquoi elle ___ dans tout ce qu'elle annonce » : la matière paraît grande ou petite sans l'être (traité 26, chap. 7)."
    answer: ment
    alt: []
  - id: g-hule-l1-q8
    sentence: "« La matière en effet est pauvreté non en ce qui concerne la richesse ou la force, mais pauvreté en ce qui concerne la ___ » (traité 12, chap. 16)."
    answer: raison
    alt: []
  - id: g-hule-l1-q9
    sentence: "« Ce qui ne possède rien [...] en tant qu'il est pauvreté, ce doit nécessairement être un ___ » : la matière (traité 12, chap. 16)."
    answer: mal
    alt: []
  - id: g-hule-l1-q10
    sentence: "Selon le traité 51, la matière est le premier des maux ; le ___ n'en est qu'un second, dérivé."
    answer: corps
    alt: []
  - id: g-hule-l1-q11
    sentence: "Les formes paraissent sur la matière sans l'altérer, comme les reflets dans un miroir : la matière est ___."
    answer: impassible
    alt: []
