- id: ame3-l2
  title: "Le problème : l'âme du monde raisonne-t-elle ?"
  notes: |-
    **Si l'Intellect ne raisonne pas et que notre âme raisonne, qu'en est-il de l'âme du monde ? Deux textes de Plotin semblent se contredire : le** [[traite6|traité 6]] **lui refuse le raisonnement, le** [[traite45|traité 45]] **lui attribue des actes successifs de pensée discursive.** La réponse dira exactement où passe la frontière entre l'âme qui reste là-haut et celle qui descend.

    **Deux questions.** Plotin attribue la {violet}dianoia{/violet} à l'âme du monde ([[traite45|traité 45]], 11, 33-41), mais dit ailleurs qu'elle ne possède pas le {violet}raisonnement{/violet} ([[traite28|traité 28]], chap. 16 ; [[traite31|traité 31]], chap. 7 ; [[traite38|traité 38]], 1, 20 et suiv.).

    - {amber}Y a-t-il une différence entre le {blue}*logismos*{/blue} et la {blue}*dianoia*{/blue} ?{/amber} Oui, répond {sky}Lacroix{/sky}, contre {sky}Blumenthal{/sky}, {sky}Brisson{/sky} et d'autres, qui en font des synonymes : {green}la {blue}*dianoia*{/blue} est la faculté de l'âme, le {blue}*logismos*{/blue} l'une de ses opérations{/green}.
    - {amber}L'âme du monde a-t-elle une forme de discursivité ?{/amber} Si l'âme est indivisible et se trouve dans la totalité du temps, comment pourrait-elle penser *x* puis *y* séparément, et non *xy* en un seul ensemble ? {red}Elle n'aurait pas à additionner x et y pour embrasser le monde{/red} : elle devrait être constamment en contemplation.

    **Premier texte : l'âme du tout ne raisonne pas.** Au [[traite6|traité 6]] (8, 11-16), l'âme du tout met en ordre l'univers sans peine, {red}parce qu'elle ne procède pas en raisonnant, comme nous{/red}, mais {green}en usant de l'Intellect{/green}.

    **Second texte : l'âme engendre la succession.** Au [[traite45|traité 45]] :

    {teal}« {/teal}De fait, puisque ce monde se meut dans l'âme, notre univers, en effet, {teal}__n'a pas d'autre lieu que l'âme__{/teal}, c'est également dans le temps qui appartient à cette âme qu'il doit se mouvoir lui aussi. En effet, puisque l'âme exerce {teal}une activité, puis une autre, puis une autre encore{/teal} qui succède à la précédente, elle a engendré, en même temps que ses activités, {teal}__la succession__{/teal}. Et à mesure qu'{teal}__un acte de pensée__ succède à un autre{/teal}, apparaît en même temps ce qui n'existait pas auparavant, parce que cette pensée n'était pas encore actualisée et que {teal}la vie de l'âme à un moment donné n'est pas non plus semblable à celle d'avant »{/teal} (11, 33-41).

    L'Âme, en produisant le monde sensible à l'image du monde intelligible, s'est asservie au temps ; c'est avec cet asservissement qu'elle engendre ses activités et la succession, qui donnent lieu à des **actes de pensée ({blue}*dianoia*{/blue}) consécutifs**. Plotin y parle autant de l'âme individuelle que de l'âme totale.

    **La contradiction.** {red}Au [[traite6|traité 6]], l'Âme ne procède pas par raisonnement quand elle produit le monde ; au [[traite45|traité 45]], elle effectue des actes de {blue}*dianoia*{/blue} qui s'apparentent à des raisonnements.{/red} {sky}Dufour{/sky} suppose que Plotin a **modifié sa doctrine** entre-temps : le traité *Sur le temps* est tardif, quand le traité *Sur la descente* a été écrit au tout début du séjour à Rome (Porphyre, *Vie de Plotin*, 24). {sky}Lacroix{/sky} propose plutôt une autre voie, venue d'{sky}Emilsson{/sky} : attribuer à l'âme du monde la {blue}*dianoia*{/blue}, **mais pas le *logismos*** (leçon suivante).

    ! Dire que l'univers {teal}« {/teal}n'a {teal}pas d'autre lieu{/teal} {teal}que l'âme »{/teal}, ce n'est pas dire que l'âme soit un récipient : le monde est en elle comme ce qu'elle déploie, et le temps, sa succession, est la forme même de ce déploiement.
