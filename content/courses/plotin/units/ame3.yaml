- id: ame3-l4
  title: "Une dianoia qui contemple : l'âme du monde et notre âme"
  notes: |-
    **La solution tient en une phrase d'Emilsson :** {green}**« tout raisonnement est discursif, mais toute pensée discursive n'est pas un raisonnement »**{/green}. L'âme du monde pense dans le temps, d'une {blue}*dianoia*{/blue} qui contemple ; notre âme peut s'élever jusqu'à cette pensée, mais doit en redescendre vers le raisonnement.

    **Le {blue}*logismos*{/blue} infère toujours ; la {blue}*dianoia*{/blue} peut contempler.** {red}Le {blue}*logismos*{/blue}, qui fonctionne toujours par inférence, ne peut pas s'adonner à la contemplation{/red} ; {green}la {blue}*dianoia*{/blue}, elle, peut saisir son objet d'un seul coup, tout en s'inscrivant dans le temps{/green}. Plotin lui prête la contemplation ([[traite53|traité 53]], 9, 22 ; [[traite9|traité 9]], 7, 3), et aucun passage des *Ennéades* n'en dit autant du {blue}*logismos*{/blue}.

    **Le temps naît de la pensée de l'âme du monde.** {sky}Emilsson{/sky} le montre sur le [[traite45|traité 45]] : l'origine de la succession, de l'« avant » et de l'« après », est la pensée successive ({blue}*dianoia*{/blue}) que l'âme du monde a des contenus de l'Intellect. L'activité intemporelle de l'Intellect s'y dégrade en {amber}un acte après un autre{/amber}, son être-ensemble en {amber}continuité{/amber}, image imparfaite du premier : {red}au lieu d'un tout rassemblé d'un coup{/red} ({blue}*athroon holon*{/blue}), {green}un tout qui viendra et sera toujours en train de venir, partie par partie{/green}. {yellow}Comme on lit page à page un livre qu'on connaît par cœur{/yellow} : la succession ne vient pas d'une ignorance, mais de la manière de parcourir ce qu'on possède déjà.

    **Notre chute : du dianoétique au logistique.** Le récit du [[traite6|traité 6]] (1, 1-11) décrit une retombée de l'intellect humain **vers le *logismos*** (l. 8), c'est-à-dire vers le monde sensible et la succession du temps. Donc :

    | Niveau | Comment il pense | Dans le temps ? |
    | l'Intellect | d'un coup, sans inférence | non |
    | l'âme du monde | une dianoia qui contemple | oui, sans raisonner |
    | notre âme élevée | une dianoia qui contemple | oui, pour un temps |
    | notre âme redescendue | le raisonnement (logismos) | oui, par inférences |

    **La ressemblance et la différence.** {coral}L'activité de l'âme du monde, qui est dianoétique, ressemble à l'expérience d'ascension que fait l'âme humaine après s'être élevée au-dessus du raisonnement.{/coral} La différence fondamentale : {green}la portion supérieure de l'âme demeure constamment en contemplation{/green}, {red}alors que l'être humain, qui subit les besoins du corps, doit redescendre dans le sensible pour prendre soin des choses d'ici-bas{/red}.

    **D'où une faculté méconnue.** La {blue}*dianoia*{/blue} est ce que l'homme **partage avec l'âme demeurée là-haut** ; quant au {violet}noûs{/violet}, l'autre faculté propre à l'âme humaine selon {sky}Blumenthal{/sky}, nous le partageons avec l'Âme divine et l'âme du monde, et il nous tient continûment liés à l'Intellect, malgré les embûches du corps.

    ! Redescendre vers le raisonnement n'est pas déchoir dans l'erreur : c'est se mettre à chercher pas à pas ce qu'on voyait d'un coup, parce que le corps impose des décisions à prendre.
