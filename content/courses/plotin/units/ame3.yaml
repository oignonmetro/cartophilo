- id: ame3-l3
  title: "L'hypothèse d'Emilsson : pensées discursives et non discursives"
  notes: |-
    **Emilsson distingue la pensée qui saisit son objet d'un seul coup de celle qui procède par inférence, et en tire que l'âme du monde a la {blue}*dianoia*{/blue} sans le {blue}*logismos*{/blue} ; Lacroix accepte la distinction, mais montre que** {red}**les textes qu'il invoque ne parlent pas de l'âme du monde**{/red}.

    **Six traits de la pensée non discursive.** {sky}Emilsson{/sky} les relève dans l'œuvre de Plotin :

    | Trait | La pensée non discursive… |
    | 1 | n'est jamais sujette à l'inférence |
    | 2 | pense son contenu d'un seul coup |
    | 3 | le pense dans un seul et même acte |
    | 4 | ne renvoie jamais à des images |
    | 5 | est véridique et certaine |
    | 6 | possède son objet sans le chercher |

    Cette possession immédiate, claire et évidente s'apparente à la {violet}contemplation{/violet} ({blue}*theôria*{/blue}) ; elle s'oppose aux actes de pensée **indirects**, le {blue}*logismos*{/blue}, le {blue}*sullogismos*{/blue} et la {blue}*bouleusis*{/blue} (délibération).

    **Ce qui rend une pensée médiate.** {red}Non pas sa temporalité{/red}, comme on pourrait le croire, {green}mais l'inférence{/green}. Voilà le point décisif : {coral}la {blue}*dianoia*{/blue} s'inscrit dans le temps, mais n'utilise pas toujours l'inférence{/coral}. Une pensée peut donc être successive sans être un raisonnement. Plotin distingue d'ailleurs la {blue}*dianoia*{/blue} de l'âme du monde de celle de l'homme ([[traite28|traité 28]], chap. 17).

    **Les preuves d'Emilsson ne portent pas.**

    - Le [[traite38|traité 38]] (VI, 7) a pour sujet l'Intellect, non l'âme : les « principes » qu'il examine n'incluent pas l'âme du monde.
    - Le [[traite31|traité 31]] (V, 8, 7) parle aussi de principes, mais du **Démiurge**, c'est-à-dire de l'Intellect. Plotin y dit que là-haut les choses ne sont pas planifiées : {teal}« {/teal}là-haut, cependant, les choses n'ont pas été planifiées ainsi parce qu'il fallait qu'elles fussent ainsi, mais parce que de cette façon {teal}__elles sont ce qu'elles sont__{/teal}, et pour cette raison ces choses sont belles ; comme si {teal}__la conclusion qui montre la cause se trouvait avant le syllogisme__{/teal}, au lieu de découler des prémisses ; en effet, [ces choses de là-haut] ne proviennent pas d'une conséquence logique ni d'un concept, mais sont antérieures à toute conséquence logique et à tout concept ; car {teal}c'est après que viennent toutes ces choses, aussi bien la raison que la démonstration et la preuve »{/teal} (7, 38-46). {yellow}Nous démontrons que la Terre est ronde après coup ; là-haut, la Terre ronde est d'abord, et la démonstration la suit{/yellow}. Mais « après » désigne le moment où l'on rencontre la succession : il s'agit de l'Intellect, qui précède le temps, non de l'âme, **avec laquelle le temps coïncide**.
    - Le [[traite28|traité 28]] (16, 1-6) dit bien que l'âme produit dans le temps sans s'incliner vers le passé : {teal}« {/teal}C'est {teal}__dans les produits__{/teal} que se trouve l'avant, c'est-à-dire le passé, mais {teal}__en l'âme il n'y a aucun passé__{/teal} ; en fait, toutes {teal}les raisons (*logoi*) y sont présentes simultanément »{/teal}. Mais il y est question des {violet}logoi{/violet}, principes rationnels, **force productrice** qui fait pénétrer les Formes dans la matière : {red}on n'en peut rien déduire sur le {blue}*logismos*{/blue}{/red}.

    **Ce qui reste.** L'Âme divine possède les logoi, elle **est** le Logos ([[traite10|traité 10]], 3, 12-13), mais {coral}n'opère pas par {blue}*logismos*{/blue}, puisque, comme dans l'Intellect, tout y est présent simultanément{/coral}.

    ! Un texte qui prouve que l'Intellect ne raisonne pas ne prouve rien sur l'âme du monde : toute la difficulté est de ne pas confondre les deux niveaux.
