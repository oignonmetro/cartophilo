lessons:
- id: ame3-l1
  title: "L'Intellect ne raisonne pas"
  notes: |-
    **Pour savoir comment pense chaque âme, il faut partir de ce qui ne raisonne jamais :** {green}**l'Intellect pense sans calcul ni raisonnement**{/green} **({blue}*logismos*{/blue}), d'une pensée non discursive et immédiate, et c'est lui, non un dieu qui calcule, qui produit le monde.** Le raisonnement n'apparaît qu'avec l'âme, et précisément avec la sensation.

    **L'Intellect est le vrai Démiurge.** Plotin identifie au Démiurge du *{sky}Timée{/sky}* l'Intellect ([[traite5|traité 5]], 3, 24-37 ; [[traite10|traité 10]], 8, 5-7), et non l'âme. Or l'Intellect est une **pensée non discursive** et **immédiate**, qui contemple sans cesse l'Un. La pensée discursive ({blue}*dianoia*{/blue}) {red}n'est pas l'œuvre de l'Intellect{/red}, {green}mais de l'âme{/green} ([[traite13|traité 13]], 1, 35-37).

    **L'argument du traité 38** (chap. 1) :

    {teal}« Et tel serait __le raisonnement du Dieu__{/teal}, et d'une manière générale il y aurait raisonnement du Dieu. Mais {teal}quels sont __les principes des raisonnements__ ?{/teal} De fait, si les raisonnements proviennent d'autres raisonnements, il faut bien parvenir à un ou des principes qui précèdent le raisonnement. Quels sont donc ces principes ? Ce sont {teal}ou bien __la sensation__ ou bien __l'Intellect__{/teal}. Mais {teal}la sensation __n'existait pas encore__{/teal} ; c'est donc l'Intellect. Mais {teal}si les prémisses sont l'Intellect, la conclusion est __la science__{/teal}, et elles ne portent donc sur rien de sensible. Car ce dont le principe vient de l'intelligible et dont la fin arrive à l'intelligible, comment serait-il possible qu'une telle disposition en arrive à une pensée discursive du sensible ? Il faut donc en conclure que {teal}__la providence__ qui se rapporte à l'animal et, d'une manière générale, à notre univers, __n'a pas résulté d'un raisonnement__ »{/teal}.

    {amber}Le raisonnement suppose des prémisses{/amber}, et toute chaîne de raisonnements remonte à des principes qui ne sont pas eux-mêmes raisonnés. Ces principes ne peuvent être que :

    - {red}la sensation{/red} : impossible, puisqu'avant le monde il n'y a rien à sentir ;
    - {green}l'Intellect{/green} : mais alors ce qu'on en tire est la science, qui porte sur l'intelligible, et non un calcul sur le sensible.

    {coral}Donc l'univers ne résulte pas d'un raisonnement.{/coral} (« L'animal » désigne ici, selon {sky}Hadot{/sky}, l'âme incarnée dans un corps.)

    **Une des rares distances prises avec Platon.** Le *{sky}Timée{/sky}* fait naître l'univers d'un calcul du dieu : {teal}« {/teal}Tel fut, dans l'ensemble, {teal}__le calcul du Dieu__{/teal} qui est toujours, à l'égard du Dieu qui devait naître un jour. En vertu de ce calcul, il en fit {teal}__un corps poli__{/teal}, partout homogène, égal de toutes parts{teal} »{/teal} (34a-b). Plotin s'en écarte, notamment parce que les gnostiques soutiennent que le démiurge et les archontes **planifient** ce qu'ils vont produire : {yellow}un dieu qui hésite et calcule est un artisan qui pourrait se tromper{/yellow}, et c'est par là que les gnostiques expliquent un monde mal fait.

    **Où naît le raisonnement.** Pour Plotin, le raisonnement s'effectue à partir de la sensation, {amber}au moment où l'âme entre dans le monde sensible, où elle doit prendre des décisions, choisir telle opinion, telle action{/amber} (Hadot). Le [[traite6|traité 6]] le dit dès sa première page : Plotin y est **{teal}« {/teal}{teal}redescendu de l'Intellect{/teal} vers {teal}le raisonnement »{/teal}** (1, 8). {coral}Raisonner, c'est déjà être descendu.{/coral}

    ! Dire que l'Intellect ne raisonne pas, ce n'est pas lui retirer la rationalité : c'est dire qu'il possède d'un coup ce que le raisonnement cherche pas à pas.
