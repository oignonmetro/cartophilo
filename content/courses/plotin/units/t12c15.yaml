# Unité de texte (voir content/textes.md) : Plotin, traité 12 (II, 4), Sur les
# deux matières, chapitres 15-16, traduction GF (éd. L. Brisson et
# J.-F. Pradeau). Découpage seul : rappels et cartes à écrire.

id: "t12c15"
title: "La matière, l'illimité et le mal (12 [II, 4], 15-16)"
subtitle: "Traité 12, Sur les deux matières, chapitres 15-16"
group: "Traité 12 (II, 4) : Sur les deux matières"
icon: "page"
color: "coral"
depth: "normale"
lessons:
- id: "t12c15-p15"
  title: "La question de l'accident"
  notes: ""
  passage:
    label: "chap. 15, l. 1-12"
    part: "La matière doit être l'illimité"
    text: |-
      – Il faut donc chercher encore si c'est par accident que l'illimité et l'indéterminé existent en une autre nature, en quel sens ils sont par accident, et si la privation s'unit par accident <à la matière>.
  points: []
- id: "t12c15-p15b"
  title: "Ce qui est ordonné et ce qui ordonne"
  notes: ""
  passage:
    label: "chap. 15, l. 1-12"
    part: "La matière doit être l'illimité"
    text: |-
      Si donc toutes ces choses qui sont des nombres et des rapports se trouvent en dehors de l'illimité – elles sont en effet des déterminations et des ordonnancements, c'est-à-dire que c'est en fonction d'elles que les autres choses sont ordonnées, et que ce n'est ni ce qui est ordonné ni l'ordre qui les ordonnent, mais ce qui est ordonné est autre que ce qui ordonne, et c'est la limite, la détermination et le rapport qui imposent l'ordre –, il est nécessaire que ce qui est ordonné et devient déterminé soit l'illimité.
  points: []
- id: "t12c15-p15c"
  title: "La matière est mise en ordre"
  notes: ""
  passage:
    label: "chap. 15, l. 1-12"
    part: "La matière doit être l'illimité"
    text: |-
      Or, la matière est mise en ordre, comme le sont toutes les choses qui, sans être la matière, participent à la matière ou sont définies comme matière. Il est donc nécessaire que la matière soit l'illimité, mais non pas à la manière d'un illimité par accident, c'est-à-dire au sens où l'illimité est un attribut accidentel de la matière.
  points: []
- id: "t12c15-p15d"
  title: "Un accident doit être une raison"
  notes: ""
  passage:
    label: "chap. 15, l. 12-20"
    part: "L'illimité n'est pas un accident"
    text: |-
      Tout d'abord, en effet, ce qui est un attribut accidentel de quelque chose doit être une raison. Or, l'illimité n'est pas une raison.
  points: []
- id: "t12c15-p15e"
  title: "De quel être serait-il l'accident ?"
  notes: ""
  passage:
    label: "chap. 15, l. 12-20"
    part: "L'illimité n'est pas un accident"
    text: |-
      Ensuite, de quel être l'illimité sera-t-il un attribut accidentel ? Il s'unira à la limite et à ce qui a été limité. Mais la matière n'est pas quelque chose qui a été limité et ce n'est pas non plus une limite.
  points: []
- id: "t12c15-p15f"
  title: "La matière est elle-même l'illimité"
  notes: ""
  passage:
    label: "chap. 15, l. 12-20"
    part: "L'illimité n'est pas un accident"
    text: |-
      En outre, lorsqu'il est attribué à ce qui a été limité, l'illimité perd la nature qui est la sienne. L'illimité n'est donc pas un accident pour la matière. Par conséquent, la matière est elle-même l'illimité.
  points: []
- id: "t12c15-p15g"
  title: "L'illimité dans les intelligibles"
  notes: ""
  passage:
    label: "chap. 15, l. 12-20"
    part: "L'illimité n'est pas un accident"
    text: |-
      De là suit que, dans les intelligibles aussi, la matière paraît être l'illimité et quelque chose d'engendré à partir de l'illimitation, de la puissance ou de l'éternité de l'Un, car l'illimitation n'est pas dans l'Un, mais est produite par lui.
  points: []
- id: "t12c15-p15h"
  title: "Un archétype et une image"
  notes: ""
  passage:
    label: "chap. 15, l. 21-28"
    part: "Les deux illimités"
    text: |-
      – Comment l'illimité peut-il donc exister là-bas et ici ?

      – C'est qu'il y a deux illimités.

      – Et en quoi diffèrent-ils ?

      – Comme un archétype et une image.
  points: []
- id: "t12c15-p15i"
  title: "L'image est plus illimitée"
  notes: ""
  passage:
    label: "chap. 15, l. 21-28"
    part: "Les deux illimités"
    text: |-
      – L'illimité d'ici est donc moins illimité ?

      – Il l'est davantage, car plus une image fuit l'être et le vrai, et plus elle est illimitée. En effet, l'illimitation est plus importante dans ce qui est moins défini, car le moins dans le bien est un plus dans le mal.
  points: []
- id: "t12c15-p15j"
  title: "Véritablement illimité"
  notes: ""
  passage:
    label: "chap. 15, l. 21-28"
    part: "Les deux illimités"
    text: |-
      Ainsi donc, ce qui est là-bas, parce qu'il est davantage être, est illimité seulement en tant qu'image, alors que ce qui est ici, parce qu'il est moins être, dans la mesure où il fuit l'être et le vrai, tiré qu'il est vers la nature de l'image, est véritablement illimité.
  points: []
- id: "t12c15-p15k"
  title: "Sont-ils la même chose ?"
  notes: ""
  passage:
    label: "chap. 15, l. 29-37"
    part: "L'illimité et l'essence de l'illimité"
    text: |-
      – L'illimité et l'essence de l'illimité sont donc la même chose ?

      – Là où il y a raison et matière, l'illimité et l'essence de l'illimité diffèrent, alors que là où il y a seulement une matière, il faut dire que l'illimité et l'essence de l'illimité sont une seule et même chose, ou mieux que l'essence de l'illimité n'existe tout simplement pas ici, car elle sera une raison qui ne peut exister dans l'illimité, pour faire qu'il soit illimité.
  points: []
- id: "t12c15-p15l"
  title: "La résistance à la raison"
  notes: ""
  passage:
    label: "chap. 15, l. 29-37"
    part: "L'illimité et l'essence de l'illimité"
    text: |-
      Certes, il faut dire que la matière est en elle-même quelque chose d'illimité par la résistance qu'elle oppose à la raison. Et en effet, tout comme la raison est une raison, sans être rien d'autre, de même il faut aussi dire que la matière qui s'oppose à la raison par son illimitation est illimitée même sans être quelque chose d'autre.
  points: []
- id: "t12c15-p16"
  title: "La matière est-elle la différence ?"
  notes: ""
  passage:
    label: "chap. 16, l. 1-5"
    part: "La matière et la différence"
    text: |-
      – La matière est-elle donc également identique à la différence ?

      – Non, mais elle est identique à la partie de la différence qui s'oppose aux réalités qui existent au sens propre, c'est-à-dire aux raisons.
  points: []
- id: "t12c15-p16b"
  title: "Un non-être qui est un être"
  notes: ""
  passage:
    label: "chap. 16, l. 1-5"
    part: "La matière et la différence"
    text: |-
      C'est pourquoi, même si elle est non-être, elle est ainsi un être et s'identifie à la privation, s'il est vrai que la privation est l'antithèse des êtres qui sont dans une raison.
  points: []
- id: "t12c15-p16c"
  title: "La privation sera-t-elle détruite ?"
  notes: ""
  passage:
    label: "chap. 16, l. 5-16"
    part: "La limite ne détruit pas l'illimité"
    text: |-
      – Par suite, la privation sera détruite lorsque viendra s'adjoindre ce dont elle est la privation ?

      – Pas du tout, car le réceptacle d'une disposition n'est pas une disposition, mais une privation, et le réceptacle d'une limite, ce n'est ni ce qui est limité ni une limite, mais c'est l'illimité en tant qu'illimité.
  points: []
- id: "t12c15-p16d"
  title: "La limite préserve l'illimité"
  notes: ""
  passage:
    label: "chap. 16, l. 5-16"
    part: "La limite ne détruit pas l'illimité"
    text: |-
      – Comment donc, lorsqu'elle vient s'y adjoindre, la limite ne détruit-elle pas l'illimité lui-même, et cela, même si l'illimité n'est pas accidentel ?

      – S'il est illimité par la quantité, la limite le fait périr. Mais dans le cas présent, il n'en va pas ainsi ; tout au contraire la limite préserve l'illimité dans l'être, car la limite amène à l'acte et à la perfection ce qu'il est par nature.
  points: []
- id: "t12c15-p16e"
  title: "Le champ et la femelle ensemencés"
  notes: ""
  passage:
    label: "chap. 16, l. 5-16"
    part: "La limite ne détruit pas l'illimité"
    text: |-
      C'est comme le champ qui n'est pas ensemencé, lorsqu'il est ensemencé ; de même, lorsqu'elle est ensemencée par le mâle, la femelle ne périt pas, mais elle se féminise davantage ; c'est-à-dire qu'elle devient davantage ce qu'elle est.
  points: []
- id: "t12c15-p16f"
  title: "Elle a besoin du bien"
  notes: ""
  passage:
    label: "chap. 16, l. 16-24"
    part: "La matière est un mal"
    text: |-
      – Est-ce donc que la matière est aussi un mal, puisqu'elle participe au bien ?

      – Elle est un mal parce qu'elle a besoin du bien, car elle ne le possède pas.
  points: []
- id: "t12c15-p16g"
  title: "Moyen terme ou pauvreté"
  notes: ""
  passage:
    label: "chap. 16, l. 16-24"
    part: "La matière est un mal"
    text: |-
      Et en effet, ce qui a besoin de quelque chose, même s'il possède autre chose, peut sans doute devenir un moyen terme entre le bien et le mal, s'il se trouve en quelque manière à égale distance des deux. Mais ce qui ne possède rien en tant qu'il est dans la pauvreté ou plutôt en tant qu'il est pauvreté, ce doit nécessairement être un mal.
  points: []
- id: "t12c15-p16h"
  title: "Pauvreté en raison et en forme"
  notes: ""
  passage:
    label: "chap. 16, l. 16-24"
    part: "La matière est un mal"
    text: |-
      La matière en effet est pauvreté non en ce qui concerne la richesse ou la force, mais pauvreté en ce qui concerne la raison, pauvreté en ce qui concerne la vertu, la beauté, la force, la figure, la forme, la qualité.
  points: []
- id: "t12c15-p16i"
  title: "Difforme, laide et mauvaise"
  notes: ""
  passage:
    label: "chap. 16, l. 16-24"
    part: "La matière est un mal"
    text: |-
      Comment donc ne serait-elle pas difforme ? Et comment ne serait-elle pas en tout point laide ? Et comment ne serait-elle pas en tout point mauvaise ?
  points: []
- id: "t12c15-p16j"
  title: "Différente de l'être"
  notes: ""
  passage:
    label: "chap. 16, l. 24-27"
    part: "La matière de là-bas et la matière d'ici"
    text: |-
      Mais cette matière de là-bas est un être, car ce qui est avant elle se trouve au-delà de l'être. Or, ici, l'être vient avant la matière. Elle n'est donc pas un être, mais elle est différente de l'être, restant à côté de la beauté de l'être.
  points: []
