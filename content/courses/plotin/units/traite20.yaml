- id: traite20-l3
  title: "Dialectique et logique : la partie la plus précieuse"
  notes: |-
    **La dialectique véritable** (chap. 4) est la disposition qui dit de chaque chose **ce qu'elle est**, en quoi elle diffère des autres, combien il y a d'êtres et de non-êtres ; elle porte sur le bien et son contraire, sur l'éternel, par une science et non une opinion.

    - Elle arrête ses errances dans le sensible et s'établit dans l'intelligible, se nourrissant dans **« la plaine de vérité »** (*Phèdre*).
    - Elle use de la **méthode de division** de Platon pour distinguer les formes et arriver aux genres premiers ; elle combine ce qui en provient ; puis, par l'**analyse**, revient au principe ; alors elle **reste au repos** et contemple.

    **Elle abandonne à une autre technique la logique des propositions et des syllogismes** (4, 18-19), comme on apprend à lire et à écrire. C'est ce qu'**Aristote** et les **stoïciens** ont élaboré sous le nom de « logique » : une méthode qui a le langage pour objet. Nécessaire, Plotin la pratique lui-même (traité 44 (VI, 3)), mais elle n'est qu'un **préalable**, applicable aux choses sensibles.

    **Son origine et sa valeur** (chap. 5) : ses principes viennent de l'**Intellect**. Platon dit qu'elle est **« ce qu'il y a de plus pur dans l'intellect et dans la réflexion »**. **Elle n'est pas un simple instrument pour le philosophe** : sa matière, ce sont les êtres. Elle ne sait rien de la proposition (« ce ne sont que des lettres »), mais connaît la proposition en connaissant le vrai.

    **Les parties de la philosophie** (chap. 6) : **la dialectique en est la partie la plus précieuse.** La philosophie de la nature (physique) et celle des mœurs (éthique) dérivent d'elle. Ce chapitre, difficile, a parfois été attribué à Porphyre ; il vise moins à rabaisser la physique et l'éthique qu'à séparer encore la dialectique de la logique.

    **Le traité 20 vérifie, pour la connaissance, la leçon du traité 19** : comme l'éthique des aristotéliciens et des stoïciens, leur logique peut servir d'exercice préalable, mais doit être dépassée.

    ! La dialectique plotinienne n'est pas la logique : celle-ci analyse des propositions ; celle-là porte sur les êtres eux-mêmes et s'achève en contemplation.
