- id: traite20-l2
  title: "Le musicien, l'amant et le philosophe"
  notes: |-
    **Plotin part du** *Phèdre* (248d) : l'âme qui a vu le plus de réalités entre, à sa première naissance, **« dans la semence d'un homme qui deviendra un philosophe, un musicien ou un amant »** (1, 6-8). Dans le mythe de l'attelage ailé (246d-249d), les âmes, en cycles de dix mille ans, suivent les dieux jusqu'à la contemplation des intelligibles ; la meilleure des âmes terrestres anime un philosophe, un musicien ou un amant.

    **Chez Platon, c'est un seul et même homme ; Plotin en fait trois degrés distincts de l'ascension** (chap. 1-3) :

    | Figure | Point de départ | Ce qu'il faut lui apprendre |
    | le musicien (chap. 1) | ému et transporté par le beau des sons et des rythmes, mais incapable de s'émouvoir de lui-même | mettre de côté la matière, aller à l'harmonie intelligible et au Beau |
    | l'amant (chap. 2) | se souvient de la Beauté, mais frappé par les belles choses que voient ses yeux | ne pas aimer un seul corps, mais tous ; puis les belles occupations et les belles lois ; puis les techniques, les sciences, les vertus ; enfin l'Intellect et l'Être |
    | le philosophe (chap. 3) | disposé par nature, il a « des ailes » | un enseignement mathématique, puis un entraînement dialectique |

    - **Le musicien** peut se transformer en amant (2, 1).
    - **L'amant** suit l'ascension du *Banquet* : de la beauté d'un corps à celle de tous les corps, puis aux incorporels.
    - **Le philosophe** n'a pas besoin de se séparer comme les deux autres ; il ne faut lui montrer le chemin que lorsqu'il est dans l'embarras. Les **mathématiques** l'accoutument à l'incorporel ; il les reçoit bien, en « ami du savoir ».

    Le musicien et l'amant doivent être **conduits** vers le haut ; le philosophe y va **par nature** (1, 9-10).

    ! Le musicien, l'amant et le philosophe ne sont pas trois tempéraments égaux : ce sont trois degrés d'une même remontée, du plus sensible au plus intellectuel.
