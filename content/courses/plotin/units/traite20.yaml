- id: traite20-l4
  title: "Repérage : le plan du traité 20"
  notes: |-
    **Le traité 20 décrit la remontée par trois figures (chap. 1-3), définit la dialectique (chap. 4-5), puis la situe parmi les parties de la philosophie (chap. 6).**

    | Moment | Lieu | Ce qui s'y joue |
    | la méthode de remontée | chap. 1 | le but, le Bien ; deux étapes ; le musicien |
    | l'amant | chap. 2 | de la beauté d'un corps à celle de tous |
    | le philosophe | chap. 3 | des ailes ; les mathématiques |
    | définition de la dialectique | chap. 4 | division, rassemblement ; la logique laissée à une autre science |
    | origine et valeur | chap. 5 | pas un simple instrument |
    | les parties de la philosophie | chap. 6 | la plus précieuse ; physique et éthique |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! Le musicien est traité dans le chapitre 1, à la suite de la question d'ouverture : seuls l'amant et le philosophe ont un chapitre propre.
