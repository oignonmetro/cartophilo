id: traite20
title: "Traité 20 (I, 3) : Sur la dialectique"
subtitle: "Le musicien, l'amant, le philosophe"
icon: compass
color: sky
lessons:
- id: traite20-l1
  title: "La dialectique, méthode de remontée"
  notes: |-
    **Le traité 20 est la suite du traité 19 (I, 2)**, *Sur les vertus* : Porphyre dit qu'ils furent rédigés l'un après l'autre et les a publiés ensemble dans la première Ennéade. Le traité 19 s'achevait sur la nécessité de s'élever au-delà des vertus civiques ; le traité 20 décrit **le moyen de cette ascension**.

    **La question d'ouverture** : « Quelle technique, quelle méthode, quelle pratique nous fait monter où il faut aller ? » (1, 1-2). Le but, accordé et démontré : **le Bien**, le premier principe.

    **La dialectique est une méthode de purification éthique**, la discipline que l'âme doit s'imposer pour accéder au bien. Ce n'est pas ce qu'on attend en lisant Platon :

    | Chez Platon | Chez Plotin |
    | la science qui, par l'entretien dialogué, connaît « ce qui est » (*République*, VII) | la méthode de la remontée de l'âme |
    | outils : la division, les paradigmes (*Politique*) | le même usage, ordonné à la purification |
    | vocation ni immédiatement ni exclusivement éthique | vocation éthique |

    **Plotin ne dénature pas Platon** : il soumet la dialectique à son interprétation d'ensemble. L'âme ne peut atteindre sa perfection qu'en retrouvant son principe, l'Intellect ; il lui faut donc d'abord **connaître l'intelligible**, par sa faculté propre, la **pensée discursive**, dont l'usage le plus éminent est la dialectique.

    **Elle mène à la remontée, non à l'union** : l'accès au principe de l'intelligible, l'Un, exige une perception **intuitive**, supérieure à la rationalité discursive. Il y a **deux étapes** : la première part d'en bas ; la seconde est celle de ceux qui, déjà dans l'intelligible, s'avancent jusqu'à « la fin du voyage » (1, 11-20).

    ! La dialectique ne conduit pas jusqu'à l'Un : elle conduit à l'intelligible, au-delà duquel il faut une autre forme de perception.
