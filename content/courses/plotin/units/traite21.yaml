- id: traite21-l2
  title: "Repérage : le mouvement du traité 21"
  notes: |-
    **Le traité 21 tient en un seul chapitre d'une vingtaine de lignes, sans plan détaillé dans l'édition GF : les repères ci-dessous suivent les lignes de la traduction.**

    | Moment | Lieu | Ce qui s'y joue |
    | les âmes là-bas et ici | l. 1-4 | sans corps, ou divisées dans les corps |
    | l'Intellect indivisible, l'âme divisible | l. 5-11 | « divisible dans les corps » |
    | en quel sens elle reste indivisible | l. 12-17 | comme un rayon dérive du centre |
    | divisée de façon indivisible | l. 17-22 | tout entière au corps tout entier |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! Le traité finit sur le paradoxe le plus fort : même la part divisée de l'âme reste indivisible.
  points:
  - id: traite21-l2-p1
    sentence: "Le traité 21 de Plotin compte un seul ___, sans plan détaillé."
    answer: "chapitre"
    alt: []
  - id: traite21-l2-p2
    sentence: "Dans le traité 21 de Plotin, l'expression « divisible dans les corps » est expliquée aux lignes ___."
    answer: "5-11"
    alt: ["l. 5-11"]
  - id: traite21-l2-p3
    sentence: "Dans le traité 21 de Plotin, la comparaison de l'âme avec un rayon issu du centre se trouve aux lignes ___."
    answer: "12-17"
    alt: ["l. 12-17"]
  - id: traite21-l2-p4
    sentence: "Le traité 21 de Plotin s'achève (l. 17-22) sur l'âme qui se divise de façon ___."
    answer: "indivisible"
