id: traite21
title: "Traité 21 (IV, 1) : Comment l'on dit que l'âme est intermédiaire"
subtitle: "Divisible de façon indivisible"
icon: compass
color: sky
lessons:
- id: traite21-l1
  title: "L'âme ne se donne que tout entière"
  notes: |-
    **L'argument de cet unique chapitre est la démonstration de l'indivisibilité de l'âme.** Dans les traités 2 (IV, 7), 4 (IV, 2), 6 (IV, 8) et 8 (IV, 9), Plotin avait tiré profit de la phrase du *Timée* (35a) : l'âme est faite d'un mélange d'indivisible et de divisible **« dans les corps »** (`perì tà sṓmata meristḗ`).

    **L'âme ne se divise que relativement, non réellement** : elle exerce sur le mode de la division les puissances qui la mettent en rapport avec les corps, sans être elle-même divisée. **C'est la nature corporelle** qui la contraint à agir sur différentes parties et en différents lieux.

    **Les deux mondes** (l. 1-11) :

    | Là-bas | Ici |
    | l'intellect est « tout entier ensemble », sans séparation ni division | les âmes sont venues dans des corps |
    | les âmes sans corps, dans l'indivision, sans extension locale | elles ont été divisées dans les corps |

    La division de l'âme consiste à **s'éloigner et à venir dans les corps** : d'où l'expression « divisible dans les corps ».

    **En quel sens reste-t-elle indivisible ?** (l. 12-17) Elle ne s'est pas éloignée tout entière : quelque chose d'elle, de nature indivisible, ne s'en est pas allé. Elle reste attachée là-haut, même si elle s'est écoulée jusqu'ici, **« comme un rayon dérive du centre »**.

    **L'ultime précision** (l. 17-22) : même ici-bas, l'âme n'est pas seulement divisible ; **« cette part d'elle-même qui est divisée se divise de façon indivisible »** (`amerístōs merízetai`) : elle se donne **tout entière au corps tout entier**, et n'est divisée qu'en tant qu'elle est dans toutes les parties du corps. L'oxymore sera justifié par le traité 27 (IV, 3), 19.

    **La place du traité** : sans doute une bribe d'un texte plus long, ce chapitre a changé de numéro selon les éditions. Porphyre, hésitant, en fit le **deuxième** traité de la quatrième Ennéade ; **Ficin** l'édita au **début**, numérotation adoptée ici.

    ! Ce n'est pas l'âme qui se divise, mais la réception de ses effets par les corps : l'âme, elle, ne se donne jamais que tout entière.
