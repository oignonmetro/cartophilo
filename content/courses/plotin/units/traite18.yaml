- id: traite18-l4
  title: "Repérage : le plan du traité 18"
  notes: |-
    **Le traité 18 pose la thèse (chap. 1), l'éprouve sur la naissance des enfants (chap. 2), puis sur les jumeaux (chap. 3).**

    | Moment | Lieu | Ce qui s'y joue |
    | un Socrate en soi | 1, 1-5 | l'âme individuelle là-bas |
    | éviter l'illimité des modèles | 1, 6-16 | les périodes déterminées, la métensomatose |
    | les raisons séminales | 1, 17-27 | ne pas redouter l'illimitation |
    | le rôle des géniteurs | 2, 1-13 | l'inégale domination |
    | le rôle négatif de la matière | 2, 14-23 | le contre-nature, la laideur |
    | les jumeaux | chap. 3 | autant de raisons que d'individus différents |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! Le chapitre 3 reprend le premier : les jumeaux mettent à l'épreuve la thèse d'une raison par individu.
  points:
  - id: traite18-l4-p1
    sentence: "Dans le traité 18 de Plotin, la thèse d'un « Socrate en soi » se trouve en ___."
    answer: "1, 1-5"
    alt: ["chap. 1, 1-5"]
  - id: traite18-l4-p2
    sentence: "Dans le traité 18 de Plotin, la solution du retour des périodes déterminées se trouve en ___."
    answer: "1, 6-16"
    alt: ["chap. 1, 6-16"]
  - id: traite18-l4-p3
    sentence: "Dans le traité 18 de Plotin, la formule « il ne faut pas redouter l'illimitation dans l'intelligible » se trouve en ___."
    answer: "1, 17-27"
    alt: ["chap. 1, 17-27"]
  - id: traite18-l4-p4
    sentence: "Dans le traité 18 de Plotin, le rôle négatif de la matière (le contre-nature, la laideur) est traité en ___."
    answer: "2, 14-23"
    alt: ["chap. 2, 14-23"]
  - id: traite18-l4-p5
    sentence: "Dans le traité 18 de Plotin, le cas des jumeaux occupe le ___."
    answer: "chap. 3"
