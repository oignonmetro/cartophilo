- id: traite18-l3
  title: "Naissances et jumeaux : les raisons séminales"
  notes: |-
    **Les chapitres 2 et 3 confrontent la thèse à la naissance des individus.**

    **La gestation** (2, 1-13) : si les raisons du mâle et de la femelle se mêlent, y a-t-il encore une raison par individu ? Rien n'empêche que chacun produise d'après des raisons différentes, car il les possède toutes. Des rejetons différents des mêmes parents s'expliquent par **l'inégale domination** des géniteurs : chacun donne entièrement ce qu'il a, mais l'une des parts domine la matière.

    - Plotin ne reprend pas la doctrine de Platon et d'Aristote (*Génération des animaux*, I, 20) selon laquelle **le mâle fournit la forme, la femelle la matière** : il paraît accepter un **rôle actif de la femme** dans la formation du fœtus.

    **La matière** (2, 14-23) : si elle produisait les différences, tous les rejetons sauf un seraient **« contre-nature »**. Or ce qui diffère peut être beau : **seule la laideur peut être attribuée à l'influence de la matière.**

    **Les circonstances de la naissance** collaborent à l'activité des raisons sans être déterminantes, ce qu'annoncera le traité 52 (II, 3) : la position des planètes n'est pas la cause principale de notre identité.

    **Les jumeaux** (chap. 3) : **« il y a autant de raisons que d'individus différents »** (3, 5), qui diffèrent par autre chose qu'une déficience de la forme. Pour des individus indiscernables, comme pour les produits du **technicien**, la différence doit être associée à la forme, même si nous ne savons pas la saisir. Plotin évite ainsi la polémique stoïcienne sur les **indiscernables**.

    **Le `lógos spermatikós`**, raison séminale immanente au vivant, explique la permanence de ses traits ; ces raisons sont le moyen d'action de la **Providence**.

    ! La matière n'individualise pas : elle ne rend compte que de la déformation et de la laideur ; la différence vraie vient de la raison.
  points:
  - id: traite18-l3-p1
    sentence: "Des rejetons différents viennent des mêmes géniteurs à cause de l'inégale ___ des deux géniteurs (traité 18, 2, 8)."
    answer: "domination"
    alt: []
