- id: traite18-l2
  title: "L'illimité dans l'intelligible et le retour des périodes"
  notes: |-
    **Une difficulté** (1, 6-16) : si l'âme de chacun contient les raisons de tous les individus par lesquels elle passe, et si le monde contient les raisons de tous les vivants pris individuellement, **il y aura un nombre illimité de raisons**.

    **La solution : le retour des « périodes déterminées »**, et la métensomatose. Le monde sensible se développe dans un temps cosmique dont la plus grande unité est la **période**, ou **Grande Année** (Platon, *République*, VIII, 546b) : au bout, tout recommence à l'identique, les mêmes âmes se réincarnent. **« L'illimitation se verra limitée, chaque fois que les mêmes choses se reproduisent »** (1, 13).

    **Un seul Homme modèle ne suffit pas** (1, 17-24) : les hommes ne diffèrent pas seulement par la matière, mais par d'innombrables différences formelles. Ils ne sont pas à leur forme ce que les portraits de Socrate sont à leur original : chaque individu diffère selon sa **raison**.

    **« Il ne faut pas redouter l'illimitation dans l'intelligible »** (1, 25-26) : elle est tout entière dans l'indivisible.

    - L'**illimité** (`apeiría`) dit qu'il n'y a pas de limite (`péras`) à la puissance de l'Intellect, première réalité issue de l'Un.
    - L'intelligible n'est pas l'un opposé au multiple du sensible : c'est une **« unité-multiple »**, aussi variée que le sensible, mais sans temps, espace ni être en puissance.
    - **L'absence de limite n'est pas une absence de détermination** : il y a un nombre précis d'individus en soi, comme de Formes.

    ! L'illimitation de l'intelligible n'est pas une infinité numérique ouverte : le nombre des individus est fixé, et le cycle des périodes le reproduit.
  points:
  - id: traite18-l2-p1
    sentence: "Pour éviter un nombre illimité de raisons, le traité 18 (1, 12-13) fait retour à l'ensemble des choses selon des ___ déterminées."
    answer: "périodes"
    alt: ["periodes"]
  - id: traite18-l2-p2
