id: traite18
title: "Traité 18 (V, 7) : S'il y a des idées même des êtres individuels"
subtitle: "Un Socrate en soi"
icon: compass
color: sky
lessons:
- id: traite18-l1
  title: "Un Socrate en soi : l'Idée de l'individu"
  notes: |-
    **« Y a-t-il une idée de chaque individu ? » Oui** (1, 1). Si chacun de nous peut remonter jusqu'à l'intelligible, son principe est aussi là-haut. Sous des allures de considérations obsolètes sur la gestation des jumeaux, le traité 18 est **l'un des textes les plus originaux de Plotin.**

    **La participation est pensée de deux façons** :

    | Participation | Exemple |
    | du sensible à une forme universelle | l'homme en soi (traité 5 (V, 9), 14 ; traité 38 (VI, 7), 4) |
    | d'un être particulier à un individu en soi | le **« Socrate en soi »** (1, 4) |

    Platon n'avait pas explicitement soutenu cette seconde thèse.

    **Thersite**, le méchant, et **Socrate**, le juste, participent tous deux à l'homme en soi ; mais ils ont part aussi à deux formes distinctes, leur **moi véritable**. Leurs différences de caractère ne tiennent pas qu'à la matière ou aux circonstances : ce sont des **« différences formelles »** (1, 21).

    **Deux conséquences** :

    - **épistémologique** : la rationalité du sensible s'étend aux individus, au-delà des archétypes universels ;
    - **eschatologique** : à la mort, l'âme n'est pas débarrassée de ce qu'elle fut ; elle garde sa **personnalité** et son **unicité**, ce qui donne toute sa force à l'immortalité de l'âme (traité 2 (IV, 7)). Le traité 27 (IV, 3) méditera sur l'âme d'**Héraclès** dans l'intelligible.

    Cette destinée personnelle de l'âme, la théologie chrétienne l'approfondira, sans la métempsycose. **Plotin a refusé d'identifier individualité et irrationalité** : chaque âme humaine a un statut positif, intelligible.

    ! L'Idée de Socrate n'est pas l'Idée d'homme particularisée par la matière : c'est une forme propre, qui fait de Socrate ce qu'il est.
  points:
