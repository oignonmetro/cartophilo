id: g-ame
title: Âme
subtitle: La troisième hypostase, d'où naît le temps
icon: wave
color: sky
lessons:
- id: g-ame-l1
  title: L'Âme
  notes: |
    L'**Âme** est la troisième hypostase du système de Plotin : elle procède de l'Intellect selon le même schéma de procession puis de conversion par lequel l'Intellect procède de l'Un. Mais à la différence de l'Intellect, dont toutes les parties sont éternellement et simultanément présentes les unes aux autres, l'Âme est contrainte de parcourir les vérités intelligibles une à une, successivement : c'est de cette succession même que naît le __temps__.

    ! Il ne faut pas se représenter l'Âme du système plotinien comme une collection d'âmes individuelles juxtaposées, chacune isolée dans son corps, sur le modèle de billes rangées côte à côte. Plotin la décrit au contraire comme « une et multiple » : une hypostase unique dont __les âmes particulières demeurent, malgré leur multiplicité apparente, unies par une parenté profonde__.

    ! Un autre contresens consiste à croire que l'âme individuelle **descend** véritablement dans le corps qu'elle anime, s'y enfermant comme dans une prison dont elle devrait ensuite s'évader. Plotin soutient au contraire que l'âme ne descend jamais réellement, elle demeure **« non descendue »**, gouvernant le corps depuis une position supérieure. Ce qu'on prend pour sa présence dans le corps n'est que le reflet qu'elle y projette, un peu comme un visage penché sur l'eau y projette son image sans jamais quitter la rive.

    ! La dépendance de l'Âme à l'égard de l'Intellect, comme celle de l'Intellect à l'égard de l'Un, n'est pas un événement survenu à un moment donné, elle est une dépendance strictement **logique et ontologique**, aussi permanente et intemporelle que celle d'un théorème à l'égard des axiomes dont il découle, lesquels ne le précèdent nullement dans le temps tout en fondant pourtant sa vérité.
  points:
  - id: g-ame-l1-1
    sentence: L'Âme, à la différence de l'Intellect dont toutes les parties sont éternellement et simultanément présentes les unes aux autres, est contrainte de parcourir les vérités intelligibles une à une, et c'est de cette succession que naît le ___.
    answer: temps
    alt: []
  - id: g-ame-l1-2
    sentence: Plotin décrit l'Âme, contre l'image d'une collection d'âmes individuelles juxtaposées comme des billes côte à côte, comme « ___ », une hypostase unique dont les âmes particulières restent, malgré leur multiplicité apparente, unies par une parenté profonde.
    answer: une et multiple
    alt: []
  - id: g-ame-l1-3
    sentence: Contre l'idée que l'âme individuelle descendrait véritablement dans le corps qu'elle anime comme dans une prison, Plotin soutient qu'elle demeure « ___ », gouvernant le corps depuis une position supérieure.
    answer: non descendue
    alt: []
  - id: g-ame-l1-4
    sentence: Ce qu'on prend pour la présence de l'âme dans le corps n'est, selon Plotin, que le ___ qu'elle y projette, un peu comme un visage penché sur l'eau y projette son image sans jamais quitter la rive.
    answer: reflet
    alt: []
  - id: g-ame-l1-5
    sentence: La dépendance de l'Âme à l'égard de l'Intellect n'est pas un événement survenu à un moment donné, mais une dépendance strictement logique et ontologique, aussi intemporelle que celle d'un ___ à l'égard des axiomes dont il découle.
    answer: théorème
    alt: []
  - id: g-ame-l1-6
    sentence: Comprendre la succession des trois hypostases comme un récit cosmogonique déroulé à un moment donné serait un contresens, la hiérarchie plotinienne ne décrit pas un empilement de niveaux séparés dans le temps, mais un unique mouvement de dépendance et de ___.
    answer: retour
    alt: []
  - id: g-ame-l1-7
    sentence: L'Âme, ___ hypostase du système de Plotin, procède de l'Intellect selon le même schéma de procession puis de conversion qui vaut pour l'Intellect à l'égard de l'Un.
    answer: troisième
    alt: []
