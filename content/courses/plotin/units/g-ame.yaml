# Entrée du glossaire de Plotin (skill glossaire), refondue le 2026-10-21 :
# une leçon ; la leçon sur l'âme non descendue est devenue l'entrée
# g-ame-non-descendue, celle sur le temps se retrouve dans g-temps (dont la
