- id: g-ame-l3
  title: L'Âme et la naissance du temps
  notes: |-
    **Ce qui distingue le plus nettement l'Âme de l'Intellect, c'est le temps : l'Intellect vit dans l'éternité, où tout est présent ensemble ; l'Âme, elle, fait naître le temps.** Le traité 45 (III, 7), *Sur l'éternité et le temps*, en fait le récit.

    __**Une puissance de l'âme qui ne voulait pas tout à la fois.**__ Dans l'Intellect, la vie est {green}« tout entière ensemble »{/green}. Mais {teal}« une nature affairée, parce qu'elle avait choisi de se gouverner elle-même et de s'appartenir à elle-même, en prenant le parti de rechercher plus que le présent, se mit elle-même en mouvement »{/teal} (traité 45 [III, 7], chap. 11, l. 15-17). C'était {teal}« l'une des puissances de l'âme qui n'était pas tranquille, qui voulait sans cesse échanger contre autre chose ce qu'elle voyait là-bas, et qui n'acceptait pas que ce tout lui fût présent tout d'un bloc »{/teal} (l. 20-23).

    __**D'où le temps.**__ Une pensée qui ne peut tout tenir à la fois doit passer d'une chose à l'autre : {pink}une activité, puis une autre, puis une autre encore{/pink}. Cette succession, c'est le temps. Ainsi {teal}« l'âme, d'abord, s'est temporalisée elle-même, en produisant le temps au lieu de l'éternité »{/teal} (l. 30-31). Plotin propose donc de dire que {coral}**le temps est « la vie de l'âme que son mouvement fait passer d'un état à un autre »**{/coral} (l. 43-45).

    __**Et le monde est dans ce temps parce qu'il est dans l'âme.**__ {teal}« Notre univers, en effet, n'a pas d'autre lieu que l'âme »{/teal} (l. 33-34) : c'est donc dans le temps de l'âme qu'il se meut. Le temps n'est pas d'abord {red}la mesure du mouvement des astres{/red}, comme le voulait Aristote ; il est la vie même de l'âme qui produit et anime le monde.

    | | Intellect | Âme |
    | **Vie** | tout entière ensemble | une activité après l'autre |
    | **Durée** | l'éternité | le temps |

    ! Le « récit » de la naissance du temps n'est pas une histoire : il n'y a pas eu d'abord l'éternité, puis un jour le temps. Plotin raconte comme une suite ce qui est une dépendance, et il avertit lui-même que nous devons « engendrer le temps par la pensée ».

    ! Que l'âme passe d'une chose à l'autre n'est pas d'abord un défaut moral : c'est sa manière d'être, la pensée discursive, qui fait d'elle le principe vivant d'un monde qui change.
