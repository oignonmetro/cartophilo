- id: g-ame-l2
  title: L'âme non descendue
  notes: |-
    **Plotin applique à notre âme la même logique : elle aussi est présente au corps sans s'y enfermer.** Il le dit lui-même en sachant qu'il heurte ses contemporains.

    __**La thèse.**__ {teal}« Et s'il faut oser dire contre l'opinion des autres plus clairement ce que l'on pense, notre âme n'a pas plongé tout entière ici-bas, mais quelque chose d'elle reste toujours dans l'intelligible »{/teal} (traité 6 [IV, 8], chap. 8, l. 1-3). C'est ce que les commentateurs appellent {violet}**l'âme non descendue**{/violet} : la partie de nous qui ne cesse jamais de contempler.

    __**Pourquoi Plotin en a besoin.**__ Si l'âme était descendue tout entière, rien en nous ne serait plus en contact avec l'intelligible, et {red}la remontée deviendrait impossible{/red} : on ne peut retrouver que ce qu'on n'a jamais tout à fait perdu. {green}Notre partie la plus haute reste donc là-haut{/green}, et c'est pourquoi la philosophie est un retour possible et non une évasion désespérée.

    __**Pourquoi nous ne le sentons pas.**__ L'objection vient d'elle-même : si une part de nous contemple sans cesse, pourquoi n'en savons-nous rien ? Plotin répond que nous ne connaissons ce qui se passe dans une partie de l'âme que lorsque cela parvient jusqu'à notre perception. Or {pink}si la partie qui est dans le sensible est dominée et troublée{/pink}, {teal}« elle ne nous permet pas de percevoir les choses que contemple la partie supérieure de notre âme »{/teal} (chap. 8, l. 4-6). **Ce n'est pas la contemplation qui s'interrompt, c'est notre attention qui est ailleurs.**

    __**L'Âme du monde, elle, gouverne sans peine.**__ Elle met en ordre le tout {teal}« en demeurant au-dessus de lui sans aucune peine, parce qu'elle ne procède pas en raisonnant, comme nous, mais en usant de l'Intellect »{/teal} (chap. 8, l. 13-16). Nous, au contraire, avons à raisonner parce que notre corps est restreint et exposé à tout.

    ! Ne pas se représenter le corps comme une prison où l'âme serait tombée tout entière : chez Plotin, l'âme ne descend jamais complètement, et son sommet reste dans l'intelligible.

    ! Plotin présente cette thèse comme personnelle (« contre l'opinion des autres ») : ses successeurs néoplatoniciens, à commencer par Jamblique et Proclus, la rejetteront.
