# IV, 9, 5 ; IV, 8, 8).

id: g-ame
title: Âme (`psuchê`)
icon: book
color: coral
lessons:
- id: g-ame-l1
  title: Âme
  notes: |-
    Chez Plotin, l'{violet}**Âme**{/violet} (*psuchê*) est [def].

    __**Une image de l'Intellect, qui en déploie l'activité.**__ Après l'{violet}[[g-intellect|Intellect]]{/violet} et de lui vient l'Âme, qui « n'est qu'__une image de l'Intellect__. Tout comme le discours prononcé est une image de la raison qui se trouve dans l'âme, de même, l'âme est __la raison de l'Intellect__ » ([[traite10|traité 10]], chap. 3). {yellow}Le feu a une chaleur qui demeure avec lui et une chaleur qu'il donne{/yellow} : de même, il y a dans l'Intellect « une activité qui ne s'écoule pas, mais __qui reste en lui__, et une autre qui __acquiert une existence indépendante__ » ; **c'est cette seconde activité qui est l'Âme**. Elle n'est donc pas une chose nouvelle, mais l'Intellect tourné vers le dehors.

    __**Une et multiple : présente tout entière en chaque corps.**__ Plotin reprend le {sky}*Timée*{/sky} (35a), qui fait de l'âme un intermédiaire entre l'indivisible et ce qui se divise dans les corps, et conclut : « C'est en ce sens que l'âme est __une et multiple__. Les corps sont seulement multiples. Mais ce qui est le plus élevé est seulement un » ([[traite4|traité 4]], chap. 2). La difficulté est de ne pas se la représenter comme une étendue qu'on découpe : **ce n'est pas une partie de l'âme qui fait vivre une partie du corps**, « mais c'est grâce à __l'âme tout entière__ que toutes choses vivent » ([[traite10|traité 10]], chap. 2). {yellow}Une science est tout entière dans chacun de ses théorèmes{/yellow} : « la science reste __un tout même si ses parties en dérivent__ » ([[traite8|traité 8]], chap. 5). Celui qui démontre un théorème mobilise toute la science, sans en retrancher rien ; l'âme est ainsi présente à la main comme à l'œil.

    __**Une seule Âme, des âmes sœurs.**__ L'Âme hypostase, l'Âme du monde et nos âmes ne sont pas trois sortes d'âmes : « C'est donc __la même chose qui est en plusieurs__ » (chap. 5), et le [[traite8|traité 8]] demande justement *Si toutes les âmes sont une*. Ce qui les distingue n'est pas leur nature, mais le corps qu'elles gouvernent et la manière de le faire. {green}L'Âme du monde{/green} met en ordre l'univers « en demeurant au-dessus de lui __sans aucune peine__, parce qu'elle ne procède pas en raisonnant, comme nous, mais en usant de l'Intellect » ([[traite6|traité 6]], chap. 8) ; {pink}nos âmes{/pink}, liées à un corps fragile, sont « sans répit occupées par la faculté de sentir ».

    | Âme | Ce qu'elle gouverne | Comment |
    | l'Âme du monde | le corps de l'univers | sans peine, en usant de l'Intellect |
    | nos âmes | un corps particulier | en raisonnant, troublées par les sensations |

    __**Ce qui la sépare de l'Intellect.**__ L'Âme pense, mais pas comme l'Intellect : elle est « une âme intellective, et __son intellect réside dans ses raisonnements__ » ([[traite10|traité 10]], chap. 3). Là où l'Intellect voit tout à la fois, elle va d'une chose à l'autre ; d'où le [[g-temps|temps]], sa vie propre, quand l'Intellect vit dans l'[[g-eternite|éternité]].

    | | Intellect | Âme |
    | **Unité** | un-multiple (*hen polla*) | un et multiple (*hen kai polla*) |
    | **Pensée** | tout à la fois | d'une chose à l'autre |
    | **Durée** | l'éternité | le temps |

    __**Elle ne descend jamais tout entière.**__ Ce qui vaut pour l'Âme vaut pour la nôtre : son sommet reste dans l'intelligible. C'est la thèse de l'[[g-ame-non-descendue|âme non descendue]].

    ! La suite de l'Un, de l'Intellect et de l'Âme n'est pas un récit qui se déroulerait dans le temps : c'est un ordre de dépendance, éternel.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 4, chap. 2 | l'âme est une et multiple |
    | traité 6, chap. 8 | l'Âme du monde gouverne sans peine |
    | traité 8, chap. 5 | une même âme en plusieurs, comme la science |
    | traité 10, chap. 3 | l'âme, image et raison de l'Intellect |

    **Voir aussi** : [[g-intellect|Intellect]] · [[g-ame-non-descendue|Âme non descendue]] · [[g-temps|Temps]] · [[g-vivant|Vivant]] · [[g-vie|Vie]] · [[g-un|Un]]
