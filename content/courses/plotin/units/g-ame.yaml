lessons:
- id: g-ame-l1
  title: Pourquoi l'Âme est une et multiple
  notes: |-
    **L'Âme** (*psuchê*) **est la troisième hypostase : elle vient de l'Intellect comme l'Intellect vient de l'Un, et c'est elle qui anime et ordonne le monde sensible.** Toute la difficulté est qu'elle doit être présente à une multitude de corps sans s'y morceler.

    __**Une réalité intermédiaire.**__ Plotin reprend le {sky}*Timée*{/sky} (35a) : {teal}« Entre la réalité indivisible et qui reste toujours la même et la réalité divisible qui devient dans les corps, il forma par un mélange des deux premières une troisième sorte de réalité »{/teal}. Et il en tire l'échelle : {teal}« C'est en ce sens que l'âme est une et multiple. Les corps sont seulement multiples. Mais ce qui est le plus élevé est seulement un »{/teal} (traité 4 [IV, 2], chap. 2, l. 49-55).

    | Degré | Ce qu'il est |
    | ce qui est le plus élevé | seulement un |
    | l'âme | une et multiple |
    | les corps | seulement multiples |

    __**Pourquoi « une et multiple ».**__ {pink}Multiple{/pink}, parce qu'elle agit en une foule de corps, et dans chaque partie de chacun. {green}Une{/green}, parce qu'elle ne se divise pas pour autant : **ce n'est pas une partie de l'âme qui fait vivre une partie du corps**, {teal}« mais c'est grâce à l'âme tout entière que toutes choses vivent, et l'âme est entièrement présente en toutes choses »{/teal} (traité 10 [V, 1], chap. 2, l. 36-38). Un corps qu'on coupe en deux donne deux moitiés ; l'âme présente au doigt et à l'œil n'est pas une moitié d'âme ici et une moitié là.

    __**D'où l'unité de toutes les âmes.**__ Si l'âme ne se découpe pas en se donnant aux corps, la multiplicité des âmes ne vient pas d'un morceau de l'Âme attribué à chacun : {coral}les âmes particulières restent, en ce qu'elles ont de plus haut, une seule Âme{/coral}, ce que démontre le traité 8 (IV, 9), *Si toutes les âmes sont une*.

    ! Ne pas se représenter l'Âme comme une collection d'âmes individuelles juxtaposées, chacune isolée dans son corps : Plotin la dit « une et multiple », une seule réalité qui se donne à plusieurs sans se partager.

    ! Ne pas confondre *hen kai polla* (un **et** multiple, l'Âme) et *hen polla* (un-multiple, l'Intellect) : l'Âme est une par nature et multiple en se distribuant dans les corps ; l'Intellect est une pluralité prise tout entière dans l'unité.
