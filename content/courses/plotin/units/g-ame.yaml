  - id: g-ame-l1-7
    sentence: L'Âme, ___ hypostase du système de Plotin, procède de l'Intellect selon le même schéma de procession puis de conversion qui vaut pour l'Intellect à l'égard de l'Un.
    answer: troisième
    alt: []
  - id: g-ame-l1-q1
    sentence: "Plotin reprend au ___ (35a) la définition de l'âme comme intermédiaire entre l'indivisible et ce qui se divise dans les corps (traité 4, chap. 2, l. 49-52)."
    answer: Timée
    alt: ["Timee"]
  - id: g-ame-l1-q2
    sentence: "« C'est en ce sens que l'âme est ___. Les corps sont seulement multiples. Mais ce qui est le plus élevé est seulement un » (traité 4, chap. 2, l. 53-55)."
    answer: une et multiple
    alt: []
  - id: g-ame-l1-q3
    sentence: "« C'est en ce sens que l'âme est une et multiple. Les corps sont ___. Mais ce qui est le plus élevé est seulement un » (traité 4, chap. 2, l. 53-55)."
    answer: seulement multiples
    alt: []
  - id: g-ame-l1-q4
    sentence: "« C'est en ce sens que l'âme est une et multiple. Les corps sont seulement multiples. Mais ce qui est le plus élevé est ___ » (traité 4, chap. 2, l. 53-55)."
    answer: seulement un
    alt: []
  - id: g-ame-l1-q5
    sentence: "L'échelle selon laquelle l'âme est « une et multiple », entre les corps seulement multiples et ce qui est seulement un, se lit au chapitre 2 du traité ___."
    answer: 4 (IV, 2)
    alt: ["4", "IV, 2"]
  - id: g-ame-l1-q6
    sentence: "Ce n'est pas une partie de l'âme qui fait vivre une partie du corps, « mais c'est grâce à l'âme ___ que toutes choses vivent, et l'âme est entièrement présente en toutes choses » (traité 10, chap. 2, l. 36-38)."
    answer: tout entière
    alt: ["toute entiere", "tout entiere"]
  - id: g-ame-l1-q7
    sentence: "L'âme est dite multiple parce qu'elle agit en une foule de corps, et une parce qu'elle ne se ___ pas pour autant."
    answer: divise
    alt: ["morcelle"]
  - id: g-ame-l1-q8
    sentence: "Si l'âme ne se découpe pas en se donnant aux corps, les âmes particulières restent, en ce qu'elles ont de plus haut, une seule Âme : c'est la thèse du traité ___, *Si toutes les âmes sont une*."
    answer: 8 (IV, 9)
    alt: ["8", "IV, 9"]
  - id: g-ame-l1-q9
    sentence: "L'Âme est un **et** multiple, en grec translittéré *hen kai polla* ; l'Intellect, lui, est un-multiple, en grec translittéré ___."
    answer: hen polla
    alt: []
  - id: g-ame-l2-q8
    sentence: "L'âme du tout met en ordre le monde « sans aucune peine, parce qu'elle ne procède pas en ___, comme nous, mais en usant de l'Intellect » (traité 6, chap. 8, l. 13-16)."
    answer: raisonnant
    alt: []
  - id: g-ame-l1-1
    sentence: L'Âme, à la différence de l'Intellect dont toutes les parties sont éternellement et simultanément présentes les unes aux autres, est contrainte de parcourir les vérités intelligibles une à une, et c'est de cette succession que naît le ___.
    answer: temps
    alt: []
  - id: g-ame-l1-6
    sentence: Comprendre la succession des trois hypostases comme un récit cosmogonique déroulé à un moment donné serait un contresens, la hiérarchie plotinienne ne décrit pas un empilement de niveaux séparés dans le temps, mais un unique mouvement de dépendance et de ___.
    answer: retour
    alt: []
  - id: g-ame-l1-r1
    sentence: "L'Âme « n'est qu'une image de l'Intellect. Tout comme le discours prononcé est une image de la raison qui se trouve dans l'âme, de même, l'âme est la ___ de l'Intellect » (traité 10, chap. 3)."
    answer: raison
    alt: []
  - id: g-ame-l1-r2
    sentence: "Comme le feu a une chaleur qui demeure avec lui et une qu'il donne, l'Intellect a « une activité qui ne s'écoule pas, mais qui reste en lui, et une autre qui acquiert une existence ___ » : l'Âme (traité 10, chap. 3)."
    answer: indépendante
    alt: ["independante"]
  - id: g-ame-l1-r3
    sentence: "Pour faire comprendre qu'une âme est tout entière en chaque partie du corps, Plotin la compare à la science : « la science reste un ___ même si ses parties en dérivent » (traité 8, chap. 5)."
    answer: tout
    alt: []
  - id: g-ame-l1-r4
    sentence: "Les âmes ne sont pas des morceaux d'une Âme découpée : « C'est donc la même chose qui est en ___ » (traité 8, chap. 5)."
    answer: plusieurs
    alt: []
  - id: g-ame-l1-r5
    sentence: "L'Âme pense, mais pas comme l'Intellect : elle est « une âme intellective, et son intellect réside dans ses ___ » (traité 10, chap. 3)."
    answer: raisonnements
    alt: []
