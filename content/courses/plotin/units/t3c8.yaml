# Unité de texte (voir content/textes.md) : Plotin, traité 3 (III, 1), Sur le
# destin, chapitres 8-10, traduction GF (éd. L. Brisson et J.-F. Pradeau).
# Découpage seul : rappels et cartes à écrire.

id: "t3c8"
title: "L'âme face au destin (3 [III, 1], 8-10)"
subtitle: "Traité 3, Sur le destin, chapitres 8-10"
icon: "page"
color: "coral"
depth: "normale"
lessons:
- id: "t3c8-p8"
  title: "Quelle autre cause reste-t-il ?"
  notes: ""
  passage:
    label: "chap. 8, l. 1-8"
    part: "L'âme, un autre principe"
    text: |-
      Quelle autre cause reste-t-il donc, en dehors de celles-là, qui fera que rien ne sera sans cause, et qui préservera la connexion et l'ordre des événements, tout en nous permettant d'être quelque chose, sans supprimer pour autant la prédiction et la divination ? C'est l'âme, assurément, qu'il nous faut en outre introduire dans les réalités comme un autre principe – et non pas seulement l'âme du monde mais aussi, avec elle, l'âme de chaque individu –, étant donné qu'elle n'est pas un principe négligeable.
  points: []
- id: "t3c8-p8b"
  title: "Une cause à l'origine de sa propre activité"
  notes: ""
  passage:
    label: "chap. 8, l. 1-8"
    part: "L'âme, un autre principe"
    text: |-
      C'est à elle qu'il incombe d'entrelacer toutes choses, puisqu'elle ne vient pas, comme les autres choses, de semences, mais qu'elle est une cause qui est elle-même à l'origine de sa propre activité.
  points: []
- id: "t3c8-p8c"
  title: "Maîtresse d'elle-même sans le corps"
  notes: ""
  passage:
    label: "chap. 8, l. 8-15"
    part: "L'âme hors du corps et dans le corps"
    text: |-
      Sans le corps, donc, elle est vraiment maîtresse d'elle-même, libre et soustraite à la causalité cosmique ; en revanche, une fois placée dans un corps, elle n'a plus cette maîtrise totale, puisqu'elle est rangée au côté d'autres choses.
  points: []
- id: "t3c8-p8d"
  title: "La fortune autour de l'âme"
  notes: ""
  passage:
    label: "chap. 8, l. 8-15"
    part: "L'âme hors du corps et dans le corps"
    text: |-
      Or c'est la fortune qui dirige le plus souvent tout ce qui l'entoure, les choses au milieu desquelles l'âme est tombée en arrivant : la plupart du temps ces choses la dirigent, de sorte qu'elle agit sous leur influence, mais parfois elle les maîtrise et les dirige dans le sens qu'elle veut. Meilleure, elle maîtrise plus souvent, pire, moins souvent.
  points: []
- id: "t3c8-p8e"
  title: "Céder aux circonstances ou les transformer"
  notes: ""
  passage:
    label: "chap. 8, l. 15-21"
    part: "L'âme mauvaise et l'âme bonne"
    text: |-
      En effet, l'âme qui concède quelque chose à la complexion du corps est contrainte de désirer ou de se mettre en colère, de s'humilier dans la pauvreté ou de s'enfler d'orgueil dans la richesse, ou enfin de se montrer tyrannique quand elle exerce le pouvoir. Mais l'âme qui est bonne par nature ne cède pas, fût-elle placée dans les mêmes circonstances, et elle les transforme plutôt qu'elle n'en est transformée, de sorte qu'elle change certaines choses et consent à d'autres sans tomber dans le vice.
  points: []
- id: "t3c8-p9"
  title: "Le mélange de décision et de hasard"
  notes: ""
  passage:
    label: "chap. 9, l. 1-4"
    part: "Ce qui arrive nécessairement"
    text: |-
      Tous les événements qui résultent d'un mélange de décision et de hasard sont nécessaires ; en effet que pourrait-on y ajouter d'autre ? Et si l'on considère toutes les causes, tous les événements en résultent avec une absolue nécessité. Et si la révolution du ciel intervient pour quelque chose, il faut compter cela aussi au nombre des causes extérieures.
  points: []
- id: "t3c8-p9b"
  title: "Les actions qui ne sont pas volontaires"
  notes: ""
  passage:
    label: "chap. 9, l. 4-12"
    part: "Ce qui est volontaire"
    text: |-
      Ainsi, dans les cas où l'âme, modifiée par les choses extérieures, agit et suit une tendance qui est pour ainsi dire un mouvement aveugle, il ne faut pas dire que son action et sa disposition soient volontaires. Pas davantage lorsqu'elle est plus mauvaise de son propre fait, dans la mesure où elle suit les tendances qui ne sont pas absolument droites et qui ne devraient pas diriger.
  points: []
- id: "t3c8-p9c"
  title: "Se régler sur la raison pure"
  notes: ""
  passage:
    label: "chap. 9, l. 4-12"
    part: "Ce qui est volontaire"
    text: |-
      Mais chaque fois qu'elle se règle, dans l'une de ses tendances, sur la raison pure et détachée des passions qui lui est appropriée, c'est de cette tendance, et de cette tendance seulement, qu'il faut dire qu'elle est en notre pouvoir, c'est-à-dire qu'elle est volontaire.
  points: []
- id: "t3c8-p9d"
  title: "Des actions ou des passions"
  notes: ""
  passage:
    label: "chap. 9, l. 12-17"
    part: "L'activité qui nous appartient en propre"
    text: |-
      Et c'est en cela que consiste l'activité qui nous appartient en propre, laquelle ne vient que de l'intérieur de l'âme lorsqu'elle est pure, d'un principe premier qui domine et exerce sa maîtrise, et non de l'âme lorsqu'elle est atteinte d'égarement du fait de son ignorance ou qu'elle est vaincue par la violence des désirs ; ces désirs qui, lorsqu'ils surviennent, la conduisent, l'entraînent et ne permettent plus qu'il y ait en nous des actions, mais n'autorisent que des passions.
  points: []
- id: "t3c8-p10"
  title: "L'âme et les causes environnantes"
  notes: ""
  passage:
    label: "chap. 10, l. 1-4"
    part: "Deux sortes de causes"
    text: |-
      Le but de cette argumentation est assurément de montrer que tout est signifié et que tout vient à l'être par des causes, et qu'il y a deux sortes de causes : certaines choses viennent à l'être du fait de l'âme, et certaines en vertu d'autres causes, environnantes.
  points: []
- id: "t3c8-p10b"
  title: "Agir selon la droite raison ou suivre le destin"
  notes: ""
  passage:
    label: "chap. 10, l. 4-9"
    part: "Agir ou pâtir"
    text: |-
      Et les âmes, quand elles font ce qu'elles font selon la droite raison, le font par elles-mêmes, toutes les fois qu'elles le font ; dans les autres cas, les actions qui sont les leurs sont empêchées et elles pâtissent plutôt qu'elles n'agissent. Aussi sont-ce d'autres causes qui font que les âmes sont dépourvues de réflexion, et il est sans doute légitime de dire qu'elles agissent alors en suivant le destin, du moins aux yeux de ceux qui tiennent le destin pour une cause extérieure.
  points: []
- id: "t3c8-p10c"
  title: "Les sages et les autres"
  notes: ""
  passage:
    label: "chap. 10, l. 10-15"
    part: "Les actes les meilleurs sont de notre fait"
    text: |-
      Mais les actes les meilleurs sont de notre fait, car c'est bien là notre nature, quand nous sommes laissés seuls avec nous-mêmes. S'il s'agit de sages, on dira qu'ils agissent vraiment, et qu'il est bien en leur pouvoir d'agir vertueusement ; pour les autres, ils n'agissent ainsi que pour autant qu'ils reprennent leur souffle et que la possibilité leur en est laissée, non qu'ils tiennent d'ailleurs leur activité de réflexion quand ils réfléchissent, mais seulement parce qu'ils ne rencontrent alors aucun obstacle.
  points: []
