- id: traite37-l4
  title: "Repérage : le plan du traité 37"
  notes: |-
    **Le traité 37 expose le débat sur le mélange total (chap. 1), donne la solution de Plotin (chap. 2), puis définit la corporéité (chap. 3).**

    | Moment | Lieu | Ce qui s'y joue |
    | la question | 1, 1-8 | un tout homogène |
    | les objections péripatéticiennes | 1, 8-22 | division, accroissement, petit et grand |
    | l'examen des objections | 1, 22-56 | la sueur ; l'eau devenue air |
    | le mélange total existe | 2, 1-26 | le papyrus |
    | ce qui empêche le mélange | 2, 26-43 | la densité |
    | corporéité, composé ou forme | 3, 1-4 | l'alternative |
    | une forme et une raison | 3, 4-11 | une raison qui produit |
    | matière et raison | 3, 11-14 | inséparable de la matière |
    | la raison dans l'Intellect | 3, 14-15 | séparée de la matière |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! La corporéité n'est pas le sujet du traité : Plotin y vient au chapitre 3 parce qu'il l'a mentionnée à propos de la densité.
  points:
  - id: traite37-l4-p1
    sentence: "Dans le traité 37 de Plotin, l'exemple de l'eau qui traverse le papyrus se trouve en ___."
    answer: "2, 1-26"
    alt: ["chap. 2, 1-26"]
  - id: traite37-l4-p2
    sentence: "Dans le traité 37 de Plotin, la densité comme obstacle au mélange se trouve en ___."
    answer: "2, 26-43"
    alt: ["chap. 2, 26-43"]
  - id: traite37-l4-p3
    sentence: "Dans le traité 37 de Plotin, la thèse que la corporéité est une forme et une raison se trouve en ___."
    answer: "3, 4-11"
    alt: ["chap. 3, 4-11"]
