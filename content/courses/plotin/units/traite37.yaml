- id: traite37-l2
  title: "La solution : ce qui empêche le mélange"
  notes: |-
    **Une question laissée de côté** (2, 1-4) : que se passe-t-il quand une masse d'eau devient de l'air, et d'où vient l'accroissement ?

    **Le mélange total existe** (2, 4-26) : quand l'eau s'écoule le long d'un **brin de laine**, ou qu'un **papyrus** distille l'eau qu'il contient, comment nier que le liquide le traverse tout entier ? La matière de l'eau n'est ni hors du papyrus, ni dans certains de ses interstices : il est **humide partout**. Objection : ce n'est pas l'eau, mais sa qualité. Mais où est l'eau, et pourquoi la masse du papyrus augmente-t-elle ? Une masse s'est ajoutée sans être absorbée : la matière de l'une et l'autre masse subsiste. Une qualité unie à une autre perd sa pureté et s'affaiblit ; une grandeur unie à une grandeur ne disparaît pas.

    **Ni la matière ni la qualité ne refusent le mélange** (2, 26-43) : les qualités traversent les corps sans les diviser, dit-on, parce qu'elles sont **incorporelles** ; mais la matière l'est aussi. Ce qui empêche de traverser les solides, ce sont des qualités d'une certaine nature, ou leur pluralité, qui produit le corps qu'on dit **« dense »**. Les qualités se mélangent donc non en tant que qualités, mais en tant que qualités d'un certain genre ; la matière résiste non en tant que matière, mais jointe à une telle qualité.

    | Doctrine | Le mélange total | Ce qui se mélange |
    | stoïcienne | partout, même d'un petit corps dans un grand | des corps |
    | péripatéticienne | jamais | les qualités seules |
    | plotinienne | dans certains cas, l'eau dans le papyrus | matière et qualités, sauf qualité contraire |

    ! La densité n'empêche pas le mélange parce qu'elle serait corporelle : c'est une qualité, et elle résiste en tant que qualité d'un certain genre.
