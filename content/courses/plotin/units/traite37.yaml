- id: traite37-l3
  title: "Qu'est-ce que la corporéité ?"
  notes: |-
    **La question** (3, 1-4) : la corporéité, que les stoïciens rangent parmi les qualités, est-elle le composé de tous les constituants d'un corps, ou une **forme**, une raison qui, venue dans la matière, produit un corps ?

    **Une forme et une raison** (3, 4-11) : si le corps se compose de toutes les qualités et d'une matière, la corporéité est une forme ; et si c'est une raison qui produit le corps en s'ajoutant, elle contient, en les englobant, toutes les qualités. « Raison » s'entend ici de la raison qui produit une chose, non de la **définition** qui manifeste ce qu'elle est.

    **Le corps** (3, 11-14) : il se constitue d'une matière et d'une raison **immanente** à cette matière ; la raison, forme pure et sans matière, en est pourtant inséparable.

    **La raison séparée** (3, 14-15) : elle est d'un autre type, elle se trouve **dans l'Intellect**, parce qu'elle est elle aussi un intellect.

    **Une doctrine constante** : au traité 12 (II, 4, 12), la matière, sans qualité propre, n'est pas un corps, et la corporéité est une forme qui vient en elle. En produisant les choses sensibles, l'âme envoie dans la matière des raisons qui contiennent la corporéité.

    ! La corporéité n'est ni la matière ni un corps : c'est une détermination formelle qui, jointe à la matière, fait le corps.
  points:
  - id: traite37-l3-p1
    sentence: "Pour le traité 37 (3, 4-11), la corporéité est une ___, c'est-à-dire une raison qui, venue dans la matière, produit un corps."
    answer: "forme"
    alt: []
