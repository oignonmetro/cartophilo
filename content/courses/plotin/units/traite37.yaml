id: traite37
title: "Traité 37 (II, 7) : Sur le mélange total"
subtitle: "Ni corps, ni simple juxtaposition"
icon: compass
color: sky
lessons:
- id: traite37-l1
  title: "Le mélange total : le débat"
  notes: |-
    **Une doctrine stoïcienne** : deux corps peuvent, en gardant leur nature propre, s'unir de sorte que l'un s'étende à la totalité de l'autre sans accroissement. Une **goutte de vin** s'étend à toute une mesure d'eau, l'encens embaume l'air d'une pièce entière ; une goutte d'eau, disent-ils, peut s'étendre à toute la mer. Le mélange total sert d'assise à la philosophie **corporéaliste** des stoïciens : il explique comment les qualités sont dans la matière, l'âme dans tout le corps, dieu dans l'univers.

    **Déjà au traité 2** (IV, 7, 8²) : Plotin réfutait le mélange total pour montrer que l'âme n'est pas un corps. L'interpénétration complète impliquerait l'égalité des masses du grand et du petit corps, et une division à l'infini en acte. Ces deux objections reviennent ici.

    **La question** (1, 1-8) : un liquide mélangé à un autre le traverse-t-il totalement ? On laisse de côté la **juxtaposition**, qui combine au lieu de mélanger : le mélange doit produire **un tout homogène**.

    **Trois objections péripatéticiennes** (1, 8-22), choisies parmi celles d'**Alexandre d'Aphrodise** (*Sur le mélange*) ; pour les péripatéticiens, seules les qualités se mélangent, et les matières se juxtaposent :

    | Objection | Contenu |
    | la division | des corps qui se pénètrent totalement se divisent et périssent |
    | l'accroissement | le mixte occupe souvent plus d'espace qu'un seul des corps |
    | le petit et le grand | un petit corps ne peut pénétrer tout un grand corps |

    **L'examen** (1, 22-56) : les partisans du mélange total invoquent la **sueur**, qui traverse le corps sans le trouer, et les objets de texture fine qu'un liquide imprègne. Mais si ce sont des corps, comment se traversent-ils sans se découper ? Contre l'accroissement, ils diront qu'une grandeur nouvelle naît du mélange comme une qualité nouvelle ; l'adversaire réplique : ou c'est une juxtaposition, ou une ligne coïncide avec une autre, sans aucune augmentation. Quant au petit corps, ils poussent à l'excès l'extension de la plus petite masse, comme si de l'eau devenait de l'air.

    ! Le chapitre 1 expose le débat sans trancher : la solution de Plotin, qui n'est ni stoïcienne ni péripatéticienne, vient au chapitre 2.
