    sentence: "Dans le traité 51 de Plotin, l'exégèse du *Théétète* (176a) commence au ___."
    answer: "chap. 6"
    alt: ["6", "chapitre 6"]
  - id: traite51-l5-p2
    sentence: "Dans le traité 51 de Plotin, la connaissance du mal (penser l'informe) occupe le ___."
    answer: "chap. 9"
    alt: ["9", "chapitre 9"]
  - id: traite51-l5-p3
    sentence: "Dans le traité 51 de Plotin, la faiblesse de l'âme et la matière engendrée par une affection de l'âme se trouvent au ___."
