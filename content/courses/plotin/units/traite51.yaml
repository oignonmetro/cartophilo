- id: traite51-l5
  title: "Repérage : le plan du traité 51"
  notes: |-
    **Le traité 51 pose la question du mal et définit le Bien (chap. 1-2), identifie le mal à la matière (chap. 3-5), puis expose son exégèse du *Théétète* (chap. 6-7) et répond aux objections (chap. 8-15).**

    | Moment | Lieu | Ce qui s'y joue |
    | questions sur le mal | chap. 1 | nature, connaissance, contrariété du bien et du mal |
    | la nature du bien | chap. 2 | le Bien, l'Intellect, l'âme |
    | le mal et le non-être | chap. 3 | l'absence de mesure ; le mal en soi et la matière |
    | maux des corps, vices de l'âme | chap. 4 | l'âme mauvaise est mêlée à la matière |
    | ramener les maux à la matière | chap. 5 | le vice, la maladie, la pauvreté |
    | exégèse du *Théétète* | chap. 6 | objections ; deux principes contraires |
    | suite de l'exégèse | chap. 7 | la matière, dernier terme de l'émanation |
    | l'âme et le corps | chap. 8 | le mal premier et les maux seconds |
    | la connaissance du mal | chap. 9 | penser l'informe |
    | mal et absence de qualité | chap. 10 | la matière est sans qualité |
    | mal et privation | chap. 11-12 | privation totale, privation partielle |
    | le mal obstacle | chap. 13 | contempler ou participer |
    | la faiblesse de l'âme | chap. 14 | la matière engendrée par une affection de l'âme |
    | l'âme pure | chap. 15 | le bien et le mal mêlés |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! Le traité 51 compte quinze chapitres : les objections et les réponses occupent toute sa seconde partie, à partir du chapitre 8.
  points:
