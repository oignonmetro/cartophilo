- id: traite51-l3
  title: "Exégèse du Théétète : le mal est nécessaire"
  notes: |-
    **Un texte de Platon commenté** (chap. 6-7) : dans le *Théétète* (176a), Socrate dit qu'« il est impossible que le mal disparaisse : il y aura toujours, nécessairement, un **contraire** du bien ». Plotin en tire un mal en soi, séparé.

    **Une contrariété singulière** : pour les autres contraires, l'existence de l'un n'implique que la **possibilité** de l'autre (la santé n'impose pas la maladie, dit Aristote). Pour le Bien et le mal, Plotin soutient qu'il y a **nécessité**. Il reprend à Aristote la définition de la contrariété comme **distance maximale** (*Catégories*, 6a), mais supprime l'idée d'un genre commun : le Bien et le mal n'ont rien en commun, ils sont parfaitement séparés.

    **Cinq objections** (6, 17-32) :

    | Objection | Idée |
    | le vice est le contraire de la vertu | non du Bien : le mal absolu n'est pas le vice |
    | le Bien, sans qualité, ne peut avoir de contraire | la contrariété suppose des déterminations opposées |
    | l'existence d'un contraire n'entraîne pas celle de l'autre | possibilité, non nécessité |
    | l'ousía n'a pas de contraire | Aristote, *Catégories*, 5 |
    | ni ce qui est au-delà de l'ousía | le Bien, au-delà de l'être |

    **Réponse** (6, 32-59) : il y a **deux principes contraires, l'un des biens, l'autre des maux**.

    **Pourquoi le mal est nécessaire** (chap. 7) : si le Bien est absolument premier, ce dont tout le réel découle, il faut un terme **dernier**, où sa puissance s'éteint : la matière. La nécessité du mal vient de la logique de l'**émanation**.

    ! Ces formules ressemblent à un dualisme, mais la matière est engendrée par l'âme (14, 51-53) : elle n'est principe que par homonymie avec le Bien, seul vrai principe.
