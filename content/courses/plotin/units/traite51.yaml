id: traite51
title: "Traité 51 (I, 8) : Que sont les maux et d'où viennent-ils ?"
subtitle: "Le mal en soi, la matière"
icon: compass
color: sky
lessons:
- id: traite51-l1
  title: "Une question, une méthode : connaître le mal par le Bien"
  notes: |-
    **Une seule question en deux** : le titre de Porphyre demande ce qu'est le mal et d'où il vient. Pour Plotin, c'est un seul problème : en disant ce qu'est le mal, on aura aussi dit d'où il vient, car le « mal en soi » est la cause première de toutes les formes de mal. Il faut donc donner au mal une existence absolue, séparée de tout être : les maux qu'on éprouve (souffrances du corps, vices de l'âme) ne sont que des maux dérivés, des effets.

    **La question socratique** (chap. 1) : avant de chercher l'origine des maux, il faut demander « **qu'est-ce que le mal ?** ». Mais on connaît chaque chose par **ressemblance** avec elle, et le mal n'apparaît qu'en l'absence totale de bien : par quelle faculté le connaître ? On le saisira par son **contraire** : les contraires relèvent d'une même science, et il faut donc d'abord connaître le Bien.

    **La nature du Bien** (chap. 2) : Plotin décrit d'abord le Bien, puis l'**Intellect**, puis l'**âme**. Le mal sera construit comme un négatif de ces traits : le contraire du Bien.

    **Le mal et le non-être** (chap. 3) : le mal est un non-être, mais d'un genre à part. Plotin le distingue de trois autres modes de non-être :

    | Non-être | Ce que c'est |
    | absolu | le néant |
    | des Formes entre elles | l'altérité : chaque Forme est autre que les autres |
    | du sensible | l'effet de la différence entre le sensible et l'intelligible |

    Le mal est « plus encore non-être » : il est **privation de toute mesure** et de toute forme, une « indigence totale ». Plotin l'identifie à la **matière** (3, 35-40), « forme du non-être », expression reprise du *Sophiste*.

    ! Le mal n'est pas un néant : il a une quasi-réalité, séparée, qui exerce une causalité propre. C'est la difficulté du traité : penser l'essence de ce qui n'est qu'à peine.
