- id: traite51-l2
  title: "Les maux seconds : le corps et l'âme"
  notes: |-
    **Maux premier et maux seconds** : le mal en soi est le mal premier ; les maux du corps (maladie, laideur, pauvreté) et les vices de l'âme sont des **maux seconds**, qui en dérivent.

    **L'âme mauvaise** (chap. 4) : l'âme parfaite reste préservée de la matière ; l'âme mauvaise, elle, **est mêlée à la matière**. Descendue, elle ne cesse de regarder vers la matière et se trouve « **contaminée** » par elle (4, 22).

    **Première objection** (chap. 5) : le mal premier serait plutôt le **vice** qui réside dans l'âme. Plotin répond que le mal est une **déficience totale** ; il y répond aussi pour la maladie ou la pauvreté, qui tiennent à un excès ou à un défaut dus à l'influence de la matière. Certains hommes savent fuir les maux ; les dieux sensibles restent préservés.

    **Le mal dans l'âme vient-il du corps ?** (chap. 8) : l'interlocuteur objecte que le vice vient de la **forme** du corps : être à jeun ou repu, les humeurs, déterminent l'état de l'âme. Plotin répond :

    | Objection | Réponse |
    | la forme du corps explique le mal de l'âme | les formes dans un corps ne sont pas les Formes en soi |
    | l'état du corps détermine celui de l'âme | c'est la matière qui affaiblit la forme et l'empêche d'assurer l'ordre et la santé |

    Le chapitre se clôt sur la distinction du **mal premier** et des maux secondaires : la matière est le premier, la forme dans un corps n'est qu'une cause dérivée de désordre.

    ! La forme, aux yeux d'un platonicien, ne peut apporter que le bien. Ce qui dérange l'ordre du corps, c'est la forme **affaiblie** par la matière, non la forme elle-même.
