- id: traite51-l4
  title: "Objections et réponses : connaître le mal, la matière engendrée"
  notes: |-
    **La connaissance du mal** (chap. 9) : comment penser l'informe ? D'abord par abstraction : on retire les formes et on saisit « ce qui reste ». Mais Plotin va plus loin : il faut « **recevoir en soi l'absence de forme** » (9, 16-17). L'intellect, tourné vers l'être, n'y suffit pas : seul un « **autre intellect** » (9, 18), audacieux, peut saisir directement le mal.

    **Quatre objections sur la matière et le mal** (chap. 10-14) :

    | Chapitre | Objection | Réponse de Plotin |
    | 10 | si la matière est sans qualité, comment est-elle mauvaise ? | le mal n'est pas une qualité, mais l'absence de qualité |
    | 11 | la privation n'existe pas en soi, toujours « en autre chose » | la privation dans l'âme n'est pas le mal premier |
    | 13 | le vice est un obstacle à l'activité de l'âme | l'obstacle n'est pas le mal premier |
    | 14 | le vice est une faiblesse de l'âme | c'est la matière qui est cause de cette faiblesse |

    **Contempler sans participer** (13, 14-26) : contempler le mal en soi n'est pas y participer. Participer au mal, c'est « échanger sa nature contre une autre ».

    **Une présence, non une absence** (chap. 14) : le mal est une **présence** de la matière dans l'âme, qui la transforme, comme le phlegme ou la bile rendent un corps malade. Mais la matière elle-même est **engendrée par l'âme** à la suite d'une « **affection** » antérieure (14, 50-54) : c'est ce qui empêche Plotin de faire de la matière un principe aussi originaire que le Bien.

    **Conclusion** (chap. 15) : le bien et le mal sont **mélangés** dans le sensible : on ne peut supprimer l'un sans l'autre. L'âme pure, préservée de tout contact avec la matière, ne subit pas le mal ; dans le sensible, le mal-matière reste caché et **dominé par le Bien** (les « chaînes en or »).

    ! Proclus (*De malorum subsistentia*) refusera à la fois le dualisme et ce mal-matière : pour lui, le mal est un « parasite » de l'être, jamais un principe.
