- id: traite1-l7
  title: "La vertu est une purification ; l'être, le beau et le bien (chap. 6)"
  notes: |-
    Le chapitre 6 opère le basculement fondamental du traité 1 : il fait passer la recherche sur la beauté d'une simple interrogation esthétique à une exigence **éthique** et **métaphysique** de **purification**. Plotin y démontre que la {violet}beauté de l'âme{/violet} n'est pas une {pink}qualité ajoutée{/pink}, mais l'{amber}état naturel{/amber} qu'elle recouvre lorsqu'elle se sépare du corps et de la matière.

    Si la {red}laideur{/red} est un {red}mélange{/red}, la {green}vertu{/green} est une {green}purification{/green} : l'âme purifiée redevient forme et raison, et c'est par l'Intellect qu'elle est belle. En ce sens, la vertu véritable n'est pas un ensemble de règles comportementales ou d'ajustements sociaux, mais une **purification de l'âme** qui l'isole du corporel.

    Plotin s'appuie sur un « antique discours » issu du *{sky}Phédon{/sky}* de Platon (69c) pour réinterpréter les {violet}**quatre vertus cardinales**{/violet} sous un angle strictement cathartique. Il soutient ainsi que cet **« antique discours »** dit que {teal}« la tempérance, le courage, la vertu dans son ensemble et la réflexion même sont une purification »{/teal} (l. 1-6). Celui qui n'est pas purifié séjournera dans un « bourbier », car l'impur aime les bourbiers, comme « les porcs ».

    **Chaque vertu se définit alors comme un détachement** (l. 7-13) :

    | Vertu | Ce qu'elle est |
    | tempérance | fuir les plaisirs du corps, qui ne sont pas purs |
    | courage | ne pas craindre la mort, séparation de l'âme et du corps |
    | grandeur d'âme | mépriser les choses d'ici-bas |
    | réflexion | détourner la pensée d'en bas, la mener vers le haut |

    **La purification rend l'âme à elle-même.** {green}« Une fois __purifiée__, l'âme devient donc une __forme__ et une __raison__, elle est tout __incorporelle__, __intellective__ »{/green} (l. 13-18) et appartient au divin. Ramenée vers l'Intellect, elle reçoit une **beauté propre et non pas étrangère**, puisque c'est alors seulement qu'elle est **purement et simplement âme** (l. 13-18). D'où la formule platonicienne : « devenir bonne et belle rend l'âme **semblable au dieu** » (l. 19-22).

    **Plotin en tire une thèse plus générale.** {coral}« L'être c'est la beauté, et ce qui diffère de l'être, c'est la laideur, et c'est cela même qui est le premier mal »{/coral} (l. 19-22). Pour le dieu, être bon et être beau sont une même chose. Il faut donc __poser en premier la beauté qui est la même chose que le bien__ ; il en découle que **l'Intellect est le beau**, et que c'est par lui que l'âme est belle (l. 23-27). L'âme, à son tour, rend belles les actions et les corps qu'elle domine (l. 27-32).

    **Une question reste ouverte** (l. 23-27) : quels sont exactement les rapports du beau, du bien et de l'Intellect ? Les chapitres 7 et 9 y reviennent.

    ! Le chapitre 6 identifie encore le **bien** et le **beau** « pour le dieu » ; c'est seulement à la fin du traité (chap. 9, l. 34-43) que le bien est placé au-delà du beau.
