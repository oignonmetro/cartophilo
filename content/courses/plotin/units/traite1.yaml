- id: traite1-l6
  title: "La laideur de l'âme : un mélange (chap. 5, l. 22-58)"
  notes: |-
    Pour savoir ce qui rend l'âme belle, Plotin passe par son contraire : la laideur de l'âme est un mélange, un élément étranger ajouté ; sa beauté est donc d'être seule, purifiée.

    **La méthode : chercher par le contraire.** Ne pouvant dire directement ce qui rend l'âme aimable, Plotin propose d'examiner {red}les laideurs qui s'installent en elle{/red} et la raison de leur apparition (l. 22-54).

    **Le portrait de l'âme laide** (l. 22-54), d'après le *Gorgias* : intempérante et injuste, pleine de désirs et de trouble, de peur par lâcheté et de jalousie par petitesse, ne pensant qu'à des choses mortelles et basses, vivant de la vie du corps.

    **Le diagnostic : la laideur s'ajoute.** Elle s'ajoute à l'âme __« au même titre qu'une beauté d'emprunt »__, la corrompt, la rend impure et la « pétrit » de maux (l. 22-54). Tiraillée vers ce qui frappe les sens, mêlée de corporel, l'âme {red}admet une forme autre que la sienne{/red} : ce mélange l'a changée.

    **Deux images rendent la thèse concevable.**

    - **L'homme tombé dans la boue** (l. 22-54) : on ne voit plus sa beauté, mais la boue ; sa laideur vient d'un élément étranger, et son travail sera de se nettoyer pour retrouver son état antérieur.
    - **L'or mêlé de terre** (l. 22-54) : enlevez la terre, il reste l'or, beau, « ramené à sa seule identité ».

    {coral}La laideur d'une âme s'explique par son mélange et son inclination vers le corps et vers la matière{/coral} (l. 22-54). **La conclusion suit** (l. 54-58) : l'âme isolée des désirs du corps et purifiée rejette toute la laideur qui lui vient de l'autre nature. Sa beauté est ce qui reste quand on retire l'étranger.

    ! La laideur n'est pas une nature de l'âme : c'est un ajout. L'âme n'a donc pas à devenir autre, mais à redevenir elle-même.
  points:
