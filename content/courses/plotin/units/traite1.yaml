- id: traite1-l4
  title: "Comment l'âme reconnaît les beautés sensibles (chap. 3)"
  notes: |-
    La beauté sensible est une forme intérieure divisée dans la matière : l'âme la reconnaît en la rapportant à son propre intérieur, qui est sans partie.

    **L'âme juge du beau comme une règle permet de juger de ce qui est droit** (l. 1-5) : la puissance de l'âme disposée à accueillir la beauté la reconnaît, et le reste de l'âme s'y associe en s'ajustant à la chose belle et à la forme qui l'accompagne.

    Lorsqu'un individu perçoit un objet dans le monde physique, son âme ne « projette » pas la forme sur une matière informe. La forme est **déjà maîtresse de la matière dans l'objet extérieur** sous l'action du *logos*. L'âme humaine ne fait que __découvrir, saisir et reconnaître la forme inscrite dans le corps sensible__, en constatant qu'**elle s'accorde avec la Forme indivisible qu'elle porte déjà en elle-même**.

    **Reste à comprendre comment le corporel s'accorde à ce qui est supérieur au corps.** Plotin pose la question sur un exemple : comment l'architecte fait-il correspondre la maison extérieure et la forme de la maison qui est en lui (l. 6-16) ? Réponse : {teal}« la maison qui se trouve à l'extérieur, abstraction faite des pierres, est en fait la forme intérieure, divisée selon la masse extérieure de la matière, et manifestant un être sans partie dans une pluralité de parties »{/teal} (l. 6-16).

    **Il y a donc deux intérieurs.** __La forme intérieure__ (la cause), celle que l'architecte a en lui, se divise dans la matière. Quand la sensation voit dans un corps cette forme qui domine la matière sans figure, __elle rassemble la multiplicité dispersée et la rapporte « à l'intérieur de notre âme qui est toujours sans partie »__ (l. 14). L'accord du beau est l'accord de ces deux intérieurs. De même, un homme de bien voit une trace de vertu chez un jeune homme dont la physionomie s'accorde à sa vie intérieure.

    **Les beautés simples s'expliquent de même** (l. 17-31). La beauté d'une couleur vient de la domination d'une figure sur la matière et de la présence d'une **lumière incorporelle** qui est raison et forme. Le **feu** est le plus beau des corps parce qu'il {coral}joue le rôle d'une forme par rapport aux autres éléments{/coral} : en haut, le plus léger, proche de l'incorporel, il les réchauffe sans se refroidir et leur donne leur couleur. Dans les sons, ce sont les harmonies imperceptibles qui produisent les harmonies perceptibles.

    **Conclusion : les beautés sensibles « ne sont que des images et des ombres »** (l. 34). Elles mettent la matière en ordre, et nous troublent par leur apparition.

    ! « Intérieur » n'a pas ici de sens spatial : la forme intérieure de la maison est sa **cause**, et l'intérieur de l'âme est sans partie, non un lieu.
