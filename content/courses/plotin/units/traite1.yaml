- id: traite1-l10
  title: "Devenir beau pour voir le beau ; le bien au-delà du beau (9)"
  notes: |-
    On ne voit le beau qu'en devenant beau : l'âme se sculpte, devient lumière, puis voit les Idées, qui sont le beau ; le bien est au-delà, source du beau.

    **La vision intérieure doit s'éduquer** (9, 1-7), comme l'œil sorti de la caverne : d'abord voir les belles occupations, puis les beaux travaux des hommes de bien, puis l'âme de ceux qui les accomplissent.

    **Pour voir la beauté d'une âme bonne : « Retourne en toi-même et vois »** (9, 7). Et si tu ne te vois pas encore beau, fais comme le sculpteur : enlève, efface, polis, nettoie. {teal}« Ne cesse de sculpter ta propre statue »{/teal} (9, 13), jusqu'à voir briller la splendeur de la vertu. Le travail est le même que pour l'or : retrancher l'étranger.

    **L'âme purifiée devient une** (9, 15-25) : il n'y a plus d'obstacle à **devenir un**, plus rien d'étranger mêlé à soi ; tu deviens __une unique et authentique lumière__, sans mesure. **« Étant devenu une vision »**, tu n'as plus besoin qu'on te montre le chemin.

    **Le principe qui commande toute l'ascension est enfin posé** (9, 25-34) : __celui qui voit doit s'être rendu apparenté et semblable à ce qui est vu__. {green}« Jamais l'œil ne verrait le soleil sans être devenu de la même nature que le soleil, et l'âme ne pourrait voir le beau, sans être devenue belle »{/green} (9, 25-34). C'est ce qui justifie la purification : elle n'est pas une morale ajoutée à l'esthétique, mais la condition de la vision.

    **La conclusion distingue enfin le beau et le bien** (9, 34-43). En s'élevant, l'âme arrive à l'Intellect, où les Formes sont belles : {coral}le beau, ce sont les Idées{/coral}, « rejetons de l'Intellect », par qui toutes choses sont belles. **« Ce qui est au-delà du beau, nous disons que c'est le bien qui place au-devant de lui le beau »** (9, 34-43). Plotin donne deux formulations :

    | Formulation | Le bien et le beau |
    | générale | le bien est la première beauté |
    | distinguant les intelligibles | le beau est le lieu des Idées ; le bien est au-delà, « la source et le principe » du beau |

    ! La conclusion hésite : Plotin dit le bien « première beauté », puis au-delà du beau, avant de conclure que du moins « le beau est là-bas ». Ce n'est qu'à la toute fin du traité qu'il distingue nettement le bien de l'être et du beau. On a même douté que ces dernières phrases soient de Plotin (R. Harder y voit un ajout de Porphyre).
