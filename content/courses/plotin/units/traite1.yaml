- id: traite1-l2
  title: "La Forme : l'homme en soi, la beauté de Socrate"
  notes: |-
    **La véritable origine de la beauté, Plotin la nomme, avec Platon, la Forme (`eîdos`).** Les choses sensibles ne se maintiennent dans le devenir que « par participation » à une Forme intelligible, qui est leur essence effective.

    - **« L'homme en soi »** : la Forme de l'homme n'est « en » aucune autre chose, ni dans un corps, ni dans une matière. Le « en » de « en soi » n'est pas local mais **relationnel**, comme dans « en définitive » : l'homme du point de vue de l'humanité, par essence et non par accident.
    - Un homme beau n'est donc pas un corps athlétique, mais une personne qui manifeste au mieux, par sa vertu et son intelligence, l'essence de l'homme : **Socrate** est beau en ce sens.
    - L'art du IIIe siècle va dans le même sens : les portraits du **Fayoum** agrandissent la pupille, l'art romain se géométrise ; l'expressivité d'une idée prime sur la reproduction des apparences.

    **Un corps, une musique, un visage sont-ils beaux dans le même sens ?** C'est le problème de l'**homonymie**, que Plotin ne traite pas ici pour lui-même (il y reviendra dans les traités 42 à 44, VI, 1-3). Il pose une communauté entre ces sens : chaque fois, la beauté s'explique par le dynamisme expressif d'une réalité non sensible. **La beauté véritable est celle de l'intelligible.**

    ! « En soi » ne veut pas dire « à l'intérieur de soi » au sens spatial : la préposition marque une relation (l'essence), pas un lieu.
  points:
