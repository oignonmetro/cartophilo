- id: traite1-l8
  title: "La vision du bien (chap. 7)"
  notes: |-
    Le chapitre 7 constitue le sommet métaphysique et mystique du traité : il fait passer l'âme de la contemplation des beautés particulières à __la rencontre ultime__ avec le **Bien** (*to agathon*), principe suprême vers lequel tend tout désir

    **L'âme doit se retourner vers le bien** (l. 1-9), « lui que toute âme désire » : __« si donc quelqu'un l'a vu, il sait »__ ce que Plotin veut dire : il a vu, donc il sait (*eîden*, *oîden*). Le savoir est d'abord un voir.

    **La remontée est décrite comme une initiation.** Tout comme les fidèles qui pénètrent dans le lieu le plus saint (le sanctuaire) doivent se purifier et ôter leurs vêtements de voyage pour s'avancer nus vers la divinité, **l'âme doit se dépouiller** des {red}vêtements corporels{/red} dont elle s'est revêtue au cours de sa {red}descente{/red} afin d'{green}aborder le Principe dans une nudité absolue{/green}.

    La **véritable union** avec la cause première s'accomplit dans la **solitude** d'une âme rendue à sa **simplicité originelle**. Une fois dégagée de tout élément étranger, l'âme contemple en elle-même le Principe simple, pur et sans tache, « la cause de la vie, de
    l'intellect et de l'être ». Plotin formule ici l'une de ses intuitions les plus célèbres : l'expérience de la divinité est une rencontre **« du seul au Seul »** (*monos pros monon*), où __l'âme solitaire rejoint la solitude du Principe__ (l. 18-20).

    **La rencontre transforme le désir** (l. 9-21) : celui qui ne l'a pas vu désire ce qu'il tient pour le bien ; celui qui l'a vu se réjouit au sein du beau, aime d'un amour véritable et méprise les beautés qu'il aimait auparavant.

    **Ce bien est la beauté première** (l. 21-30) : « le beau lui-même, pur par lui-même » (*Banquet*, 211e), ni sur terre ni au ciel. Il est le **{violet}« chorège »{/violet}** de toutes les beautés : __il donne en restant auprès de lui-même sans rien recevoir__ (l. 25-30).

    Plotin qualifie cet effort d'élévation d'**ultime combat** (*agōn*) imposé à l'âme pour accomplir sa destinée (l. 30-33). L'homme qui manque cette vision est le plus misérable des êtres, quand bien même il posséderait la royauté, les honneurs politiques ou les richesses de la terre, car **la félicité authentique réside exclusivement dans l'union avec le Bien** (l. 34-39).

    ! Le vocabulaire religieux (temples, initiation, « seul à seul ») ne met pas la philosophie au service d'un culte : il sert à dire une expérience qui est le cœur même de la philosophie.
