- id: traite1-l1
  title: "La question : qu'est-ce qui rend belles les choses belles ? (chap. 1, l. 1-20)"
  notes: |-
    Le traité 1 demande ce qui rend belles les choses belles, et s'il y a un beau pour toutes ou s'il y a une beauté antérieure à toutes les beautés particulières.

    **Ce n'est pas un traité d'esthétique au sens moderne**, mais une introduction à la philosophie platonicienne et à l'attitude de l'âme qu'elle exige. Il part pourtant de la question de savoir ce qui fait qu'une chose est belle.

    **Il commence par dresser la liste de ce qu'on dit beau**, en montant : ce qui se {pink}voit{/pink}, puis ce qui s'{pink}entend{/pink}, puis tout ce qui relève des {pink}Muses{/pink} ; et, pour ceux qui abandonnent la {pink}sensation{/pink}, __les occupations, les actions, les dispositions acquises, les sciences, les vertus__. C'est l'{sky}ascension du discours de Diotime{/sky} dans le *Banquet*, reprise dans son esprit plus que dans sa lettre. **« S'il y a ou non une beauté antérieure à tout cela, notre exposé le montrera »** (l. 1-11).

    **De cette liste naît la question du traité** (l. 1-20) : qu'est-ce qui rend beaux les corps et les sons, et comment ce qui dépend de l'âme peut-il être beau ? Surtout, __est-ce par un seul et même beau que toutes ces choses sont belles__, ou y a-t-il une beauté dans les corps et une autre ailleurs ?

    **Une première distinction oriente la réponse.** {teal}« Il y a, en effet, d'une part des choses belles qui ne le sont pas du fait de leur substrat, mais par participation, par exemple les corps et, d'autre part, des beautés qui sont belles par elles-mêmes, comme la nature de la vertu »{/teal} (l. 12-20). La preuve que les corps ne sont pas beaux par eux-mêmes : {coral}les mêmes corps paraissent tantôt beaux, tantôt non{/coral}, parce qu'être un corps est autre chose qu'être beau.

    **D'où la méthode.** Il faut d'abord trouver ce qui, présent dans les corps, les rend beaux ; puis s'en servir comme d'un **{violet}« échelon »{/violet}** (l. 20) pour comprendre le reste. La beauté sensible est un point d'appui pour monter, non un leurre à fuir.

    ! Plotin suppose sans la discuter la doctrine platonicienne de la participation : le chapitre 1 ne la démontre pas, il en fait l'outil de la recherche.
