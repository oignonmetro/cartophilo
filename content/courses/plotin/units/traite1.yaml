- id: traite1-l5
  title: "Les beautés que l'âme voit sans organe (chap. 4 ; chap. 5, l. 1-22)"
  notes: |-
    Le __chapitre 4__ du traité 1 marque l'__élévation de l'âme__ depuis la beauté sensible vers la **beauté incorporelle et intelligible**. Plotin y explique que les beautés supérieures (la beauté des occupations, des sciences et des vertus) __ne relèvent pas des sens corporels__ et exigent que l'âme se détache de la sensation physique pour accéder aux réalités véritables.

    Pour illustrer l'__{coral}impossibilité de juger d'une beauté que l'on n'a pas contemplée soi-même{/coral}__, Plotin utilise l'**exemple de l'aveugle-né** : de même qu'{yellow}une personne aveugle de naissance ne peut pas parler de la beauté des couleurs physiques puisqu'elle ne les a jamais vues{/yellow}, de même __celui qui n'a pas fait l'expérience de la vertu intérieure ne saurait comprendre la splendeur des réalités intelligibles__ (chap. 4, l. 4-12). Il souligne la majesté de la vertu en reprenant un vers d'Euripide : « ni l'étoile du soir, ni l'étoile du matin ne sont aussi belles » que le visage de la justice et de la tempérance (chap. 4, l. 11-12).

    Cette impossibilité repose sur le principe néoplatonicien de la **parenté** (*homoiosis*) : l'esprit ne peut connaître ou juger véritablement qu'une réalité avec laquelle il possède **une affinité d'essence** et à laquelle il s'est rendu semblable.

    La rencontre effective avec cette beauté incorporelle déclenche dans l'âme un ébranlement émotif bien plus puissant que celui suscité par les objets sensibles. Plotin énumère la suite des **affects propres à l'âme** lors de cette vision : la **stupeur** (*ekplēxis*), l'**effroi** (*thambos*), le saisissement plaisant, le **désir** (*pothos*) et l'**amour** (*erōs*) (chap. 4, l. 12-17).

    Pour expliquer pourquoi toutes les âmes ne réagissent pas avec la même ferveur, Plotin emploie l'**exemple de l'aiguillon des amants** : bien que le monde physique soit visible par tous, seuls ceux que l'on nomme les « amants » reçoivent l'aiguillon vif de la beauté corporelle ; de même, si toute âme possède une affinité latente avec le divin, seules les âmes passionnément éprises des beautés invisibles éprouvent ce trouble sacré et ce désir d'union (chap. 4, l. 17-22).


    **Il faut donc interroger les amoureux des réalités non sensibles** (chap. 5, l. 1-22) : que ressentez-vous devant la beauté de l'âme, de quels **« transports bachiques »** êtes-vous saisis ? Ce qui les émeut, __ce n'est ni les contours, ni la couleur, ni une grandeur__, mais l'âme, qui est **« sans couleur »**, et sa tempérance « rayonnante » des vertus. Mais ce qui rend l'âme digne d'être aimée reste à trouver.
