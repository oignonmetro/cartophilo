id: traite1
title: "Traité 1 (I, 6) : Sur le beau"
subtitle: "Le beau, l'âme et la purification"
icon: compass
color: sky
lessons:
- id: traite1-l1
  title: "La question : qu'est-ce qui rend belles les choses belles ? (1, 1-20)"
  notes: |-
    Le traité 1 demande ce qui rend belles les choses belles, et s'il y a un seul beau pour toutes, ou une beauté antérieure à toutes les beautés particulières.

    **Ce n'est pas un traité d'esthétique au sens moderne**, mais une introduction à la philosophie platonicienne et à l'attitude de l'âme qu'elle exige. Il part pourtant d'une définition : qu'est-ce qui fait qu'une chose est belle ?

    **Il commence par dresser la liste de ce qu'on dit beau**, en montant : ce qui se voit, puis ce qui s'entend, puis tout ce qui relève des Muses ; et, pour ceux qui abandonnent la sensation, __les occupations, les actions, les dispositions acquises, les sciences, les vertus__. C'est l'ascension du discours de Diotime dans le *Banquet*, reprise dans son esprit plus que dans sa lettre. **« S'il y a ou non une beauté antérieure à tout cela, notre exposé le montrera »** (1, 1-11).

    **De cette liste naît la question du traité** (1, 1-20) : qu'est-ce qui rend beaux les corps et les sons, et comment ce qui dépend de l'âme peut-il être beau ? Surtout, __est-ce par un seul et même beau que toutes ces choses sont belles__, ou y a-t-il une beauté dans les corps et une autre ailleurs ?

    **Une première distinction oriente la réponse.** {teal}« Il y a, en effet, d'une part des choses belles qui ne le sont pas du fait de leur substrat, mais par participation, par exemple les corps et, d'autre part, des beautés qui sont belles par elles-mêmes, comme la nature de la vertu »{/teal} (1, 12-20). La preuve que les corps ne sont pas beaux par eux-mêmes : {coral}les mêmes corps paraissent tantôt beaux, tantôt non{/coral}, parce qu'être un corps est autre chose qu'être beau.

    **D'où la méthode.** Il faut d'abord trouver ce qui, présent dans les corps, les rend beaux ; puis s'en servir comme d'un **{violet}« échelon »{/violet}** (1, 20) pour comprendre le reste. La beauté sensible est un point d'appui pour monter, non un leurre à fuir.

    ! Plotin suppose sans la discuter la doctrine platonicienne de la participation : le chapitre 1 ne la démontre pas, il en fait l'outil de la recherche.
