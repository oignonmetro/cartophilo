- id: traite1-l3
  title: "La Forme et l'ajustement de l'âme (2)"
  notes: |-
    Ce qui rend beaux les corps, c'est la Forme : elle unifie leurs parties multiples, et l'âme la reconnaît parce qu'elle lui est apparentée.

    **Le chapitre 2 part de l'expérience de l'âme.** Devant le beau, elle le reconnaît, l'accueille et **« s'y ajuste »** (2, 4) ; devant le laid, elle le « rejette », le repousse comme une chose qui lui est étrangère (2, 5-6). Pourquoi ? Parce que l'âme, tournée vers la meilleure des réalités, voit dans le beau quelque chose qui est **{violet}apparenté{/violet}** à sa propre nature, ou une trace de cela : alors __elle se réjouit, revient à elle-même et se ressouvient d'elle-même__ (2, 7-11). C'est le vocabulaire platonicien de la **réminiscence**.

    **Une objection surgit** (2, 11-22) : si les choses d'ici sont belles par ressemblance avec celles de là-bas, comment peut-on dire beaux à la fois les unes et les autres ? C'est le problème de l'**homonymie**, que Plotin ne traite pas pour lui-même ici.

    **La réponse est posée, non démontrée** : {green}« C'est, disons-nous, en participant à une Forme que ceux d'ici-bas sont beaux »{/green} (2, 11-22). Elle se précise par son contraire, la laideur, qui est de deux sortes (2, 11-22) :

    | Laideur | Ce qui manque |
    | absolue | ce qui est sans figure, privé de raison et de forme |
    | relative | ce que la forme n'a pas dominé, la matière résistant à la configuration |

    **La Forme, elle, unifie** (2, 11-22) : elle s'approche, réunit des parties multiples et __les amène à une unité parfaite__. Une fois l'unité faite, le beau se donne aux parties comme au tout : toute une maison est belle en chacune de ses parties grâce à la technique, une pierre grâce à une certaine nature. {coral}Un corps beau est beau « par une communauté avec une raison venue des dieux »{/coral} (2, 27-28).

    ! La réminiscence n'est pas une mémoire sensible (retrouver où l'on a vu un objet) : c'est une remémoration qui ramène l'âme à l'intelligible lui-même, et à elle-même.
  points:
