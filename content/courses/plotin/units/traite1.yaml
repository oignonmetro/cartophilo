- id: traite1-l5
  title: "Les beautés que l'âme voit sans organe (4 ; 5, 1-22)"
  notes: |-
    Les beautés plus hautes, celles des occupations, des sciences et des vertus, ne se voient qu'avec l'âme seule, et on ne peut en parler qu'à qui les a vues.

    **Il faut quitter la sensation** (4, 1-4) : ces beautés, l'âme les voit « sans organe » corporel, en abandonnant la sensation qui reste au niveau de l'ici-bas.

    **L'argument est une analogie avec l'aveugle-né** (4, 4-12). On ne peut parler des couleurs ni à ceux qui ne les ont pas vues, ni à ceux qui ne les ont jamais perçues comme belles. __De même, on ne peut parler de la beauté des occupations et des sciences qu'à ceux qui l'ont comprise__, ni du rayonnement de la vertu qu'à ceux qui se sont représenté la beauté du visage de la justice : **« ni l'étoile du soir, ni l'étoile du matin ne sont aussi belles »**. La beauté des sciences n'est accessible qu'au savant.

    **Ces beautés touchent plus fort** (4, 12-22) : qui les voit est frappé de stupeur et troublé bien davantage, parce qu'il est mis en contact avec des {violet}réalités véritables{/violet}. Le beau véritable suscite toujours les mêmes affects : __« l'effroi, le saisissement plaisant, le désir, l'amour et la stupeur accompagnée de plaisir »__ (4, 12-17). Tous les éprouvent, mais surtout les plus amoureux, comme pour les corps, dont tous ne reçoivent pas également l'**aiguillon**.

    **Il faut donc interroger les amoureux des réalités non sensibles** (5, 1-22) : que ressentez-vous devant la beauté de l'âme, de quels **« transports bachiques »** êtes-vous saisis ? Ce qui les émeut, __ce n'est ni les contours, ni la couleur, ni une grandeur__, mais l'âme, qui est **« sans couleur »**, et sa tempérance « rayonnante » des vertus. Pourquoi la dire belle ? Parce que cela existe vraiment : ce sont des réalités véritables. Mais ce qui rend l'âme digne d'être aimée reste à trouver.

    ! L'argument ne prouve pas que ces beautés existent pour qui ne les a pas vues : il en appelle à l'expérience, comme on ne prouve pas les couleurs à un aveugle-né.
  points:
