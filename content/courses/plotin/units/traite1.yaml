- id: traite1-l7
  title: "La vertu est une purification ; l'être, le beau et le bien (6)"
  notes: |-
    Si la laideur est un mélange, la vertu est une purification : l'âme purifiée redevient forme et raison, et c'est par l'Intellect qu'elle est belle.

    **Plotin s'appuie sur une autorité** : un **« antique discours »**, celui du *Phédon* (69c) qui se réclame des mystères orphiques, dit que {teal}« la tempérance, le courage, la vertu dans son ensemble et la réflexion même sont une purification »{/teal} (6, 1-6). Celui qui n'est pas purifié séjournera dans un « bourbier », car l'impur aime les bourbiers, comme les porcs.

    **Chaque vertu se définit alors comme un détachement** (6, 7-13) :

    | Vertu | Ce qu'elle est |
    | tempérance | fuir les plaisirs du corps, qui ne sont pas purs |
    | courage | ne pas craindre la mort, séparation de l'âme et du corps |
    | grandeur d'âme | mépriser les choses d'ici-bas |
    | réflexion | détourner la pensée d'en bas, la mener vers le haut |

    **La purification rend l'âme à elle-même.** {coral}« Une fois purifiée, l'âme devient donc une forme et une raison, elle est tout incorporelle, intellective »{/coral} (6, 13-18) et appartient au divin. Ramenée vers l'Intellect, elle reçoit une beauté __propre et non pas étrangère__, puisque c'est alors seulement __qu'elle est purement et simplement âme__ (6, 13-18). D'où la formule platonicienne : devenir bonne et belle rend l'âme **semblable au dieu** (6, 19-22).

    **Plotin en tire une thèse plus générale.** {green}« L'être c'est la beauté, et ce qui diffère de l'être, c'est la laideur, et c'est cela même qui est le premier mal »{/green} (6, 19-22). Pour le dieu, être bon et être beau sont une même chose. Il faut donc __poser en premier la beauté qui est la même chose que le bien__ ; il en découle que **l'Intellect est le beau**, et que c'est par lui que l'âme est belle (6, 23-27). L'âme, à son tour, rend belles les actions et les corps qu'elle domine (6, 27-32).

    **Une question reste ouverte** (6, 23-27) : quels sont exactement les rapports du beau, du bien et de l'Intellect ? Les chapitres 7 et 9 y reviennent.

    ! Le chapitre 6 identifie encore le bien et le beau « pour le dieu » ; c'est seulement à la fin du traité (9, 34-43) que le bien est placé au-delà du beau.
