# d'après la notice, le plan détaillé, la traduction et les notes de Jérôme
# Laurent, dans Plotin, Traités 1-6, trad. sous la dir. de L. Brisson et
# J.-F. Pradeau, GF-Flammarion, 2002. Les citations viennent de cette
# traduction ; les repères (chapitre, lignes) sont ceux de cette édition,
# d'après son plan détaillé. Lié à l'entrée t-1-6 de l'index.
