# Cours d'un traité de Plotin (piste Repérage, voir content/philosophie.md),
# d'après la notice et le plan détaillé de Jérôme Laurent, dans Plotin, Traités 1-6,
# trad. sous la dir. de L. Brisson et J.-F. Pradeau, GF-Flammarion, 2002.
# Les citations viennent de la notice ou du plan ; les repères (chapitre,
# lignes) sont ceux de cette édition. Lié à l'entrée t-1-6 de l'index.

id: traite1
title: "Traité 1 (I, 6) : Sur le beau"
subtitle: "Le beau, l'âme et la purification"
icon: compass
color: sky
lessons:
- id: traite1-l1
  title: "Pas un traité d'esthétique : la beauté n'est pas la proportion"
  notes: |-
    **Le traité 1, malgré son titre, est une introduction générale à la philosophie platonicienne et à l'attitude de l'âme qu'elle exige, pas un traité d'esthétique au sens moderne.** Il commence pourtant par une définition : qu'est-ce qui rend une chose belle ?

    **La cible du premier chapitre est la définition du beau par la proportion des parties**, celle des stoïciens, dominante dans l'élite romaine du temps de Plotin. Chrysippe compare la beauté à la santé (SVF III, 471a) ; la nature, « amie du beau », se plaît à la variété ; l'emblème de cette esthétique est la roue du paon décrite par Élien. L'accent y est mis sur la **multiplicité**.

    **Pour Plotin, cette définition prend l'effet pour la cause** : si l'équilibre nous plaît, c'est par l'**unité** qu'il manifeste. La symétrie ne suffit pas à rendre compte du jugement « ceci est beau ».

    - Contre-exemples : des beautés **non composées**, sans parties, comme la lumière du soleil, l'or, l'éclair, les astres ; et des réalités bien proportionnées qui sont laides (chap. 1, 31-49).
    - Dans la nature, la symétrie rigoureuse n'est pas la règle : la dissymétrie des arbres et des montagnes atteste la vie. L'**éclair** dans la nuit d'orage est le symbole le plus net de la beauté plotinienne : lumière, force, soudaineté.

    ! Plotin ne dit pas que les réalités symétriques sont laides : il appréciait sans doute la beauté des Pyramides, mais l'expliquait par l'unité de leur apparaître, non par leur proportion.
  points:
  - id: traite1-l1-p1
    sentence: "Malgré son titre, le traité 1 de Plotin, *Sur le beau*, n'est pas un traité d'esthétique au sens contemporain : c'est une introduction générale à la philosophie ___ et à l'attitude de l'âme qu'elle implique."
    answer: "platonicienne"
