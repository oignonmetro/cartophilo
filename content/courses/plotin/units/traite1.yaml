- id: traite1-l5
  title: "Narcisse et Ulysse : la fuite vers l'Un"
  notes: |-
    **Les derniers chapitres font de la recherche du beau une fuite vers « là-bas ».** Il faut fuir des images corporelles vers leurs modèles intelligibles (chap. 8).

    | Figure | Rapport aux images |
    | Narcisse | se perd dans son propre reflet sensible : l'âme aussi peut se perdre |
    | Ulysse | refuse les charmes de Circé et de Calypso pour rentrer dans sa patrie |

    **Notre patrie, c'est le monde intelligible** (chap. 8, 21) : la fuite consiste à transformer la vision extérieure en vision intérieure.

    **Le philosophe se détourne ultimement des beautés corporelles, puis de celle des âmes et des conduites, pour remonter au fondement de la beauté intelligible : l'Un**, premier principe qui rend raison de tout le réel. Le cœur de notre intériorité n'est donc pas une subjectivité, fût-elle transcendantale, mais l'unité ineffable de l'Un, qui n'est jamais absent de rien.

    - Chapitre 7 : la vision bienheureuse, rencontre « seule à seule » de l'âme et de la cause universelle, rencontre du « beau lui-même » (*Banquet*, 211e).
    - Chapitre 9 : l'âme devient de part en part lumière ; elle se sculpte comme une statue (le sculpteur retranche le marbre superflu, l'âme ce qui est matériel) ; identité du voyant et du vu. Conclusion : les Idées sont les réalités véritablement belles, et **le bien est au-delà du beau**.

    ! Le traité ne s'arrête pas à la beauté intelligible : il la dépasse vers le bien, l'Un, qui est au-delà du beau.
  points:
