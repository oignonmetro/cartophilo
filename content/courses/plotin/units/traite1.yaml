- id: traite1-l2
  title: "Contre la proportion (1, 21-50)"
  notes: |-
    Le chapitre 1 réfute la définition du beau par la proportion des parties : elle conduit à des absurdités, et des contre-exemples la démentent.

    **La thèse visée est celle de presque tout le monde** : {red}« la proportion des parties les unes par rapport aux autres et par rapport à l'ensemble, ajoutée à l'agrément des couleurs, produit ce qui est beau pour la vue »{/red} (1, 21-25). Ce sont d'abord les **stoïciens**, dominants dans l'élite romaine du temps de Plotin (Chrysippe compare la beauté à la santé) ; mais c'est en fait la quasi-totalité de la pensée antique, dont l'emblème est le *Canon* de Polyclète.

    **Premier argument : la thèse a des conséquences absurdes** (1, 25-30). Si être beau, c'est être bien proportionné, __rien de simple ne sera beau__, seulement le composé. Le tout sera beau sans qu'aucune partie le soit. Or __une totalité belle n'est pas faite de parties laides__ : si le tout est beau, les parties le sont aussi.

    **Deuxième argument : des contre-exemples** (1, 31-49).

    - **Des beautés simples**, sans parties : les belles couleurs, la lumière du soleil, l'or, l'éclair et les astres la nuit, un son isolé.
    - **Une même proportion tantôt belle, tantôt non** : le même visage paraît beau, puis ne l'est plus, ses proportions restant les mêmes. {coral}La beauté est donc autre chose que la proportion{/coral}, et une belle proportion est belle grâce à autre chose.
    - **Des accords qui sont laids** : appliquée aux occupations et aux sciences, la proportion devient simple cohérence, et les méchants aussi sont cohérents. « La tempérance est une puérilité » et « la justice est une noble naïveté » s'accordent parfaitement (1, 31-49).

    **Troisième argument : la beauté la plus vraie échappe à la proportion.** {teal}« La beauté de l'âme est la vertu dans son ensemble ; elle est une beauté plus vraie »{/teal} (1, 49-50), et elle n'a de proportion ni en grandeur ni en nombre. Quant à l'Intellect, **« qui demeure isolé »**, quelle proportion aurait-il ?

    ! Plotin ne dit pas que les réalités proportionnées sont laides : il en appréciait sans doute la beauté (les Pyramides), mais l'expliquait par l'unité qu'elles manifestent, non par leur proportion. La proportion est un effet, pas la cause.
  points:
