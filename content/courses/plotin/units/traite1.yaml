- id: traite1-l9
  title: "La fuite : Narcisse, Ulysse et la vision intérieure (8)"
  notes: |-
    Pour voir cette beauté, il faut fuir les images vers ce dont elles sont images : non par un voyage, mais en changeant de manière de voir.

    **La question est posée** (8, 1-3) : comment voir cette **« beauté immense »** qui reste à l'intérieur des temples, sans se montrer aux profanes ?

    **Le principe : fuir les images** (8, 3-8). Il faut abandonner la vue extérieure et ne pas courir vers les beaux corps, mais, {teal}« sachant qu'elles ne sont que des images, des traces et des ombres, il faut fuir vers ce dont elles sont images »{/teal}.

    **Deux figures opposent deux rapports aux images.**

    | Figure | Rapport aux images |
    | l'homme qui saisit son reflet | prend l'image pour l'être et disparaît au fond de l'eau |
    | Ulysse | quitte Circé et Calypso malgré les beautés sensibles, pour rentrer dans sa patrie |

    {red}Celui qui saisit son beau reflet sur l'eau{/red} (8, 8-16) est Narcisse, que Plotin ne nomme pas. Ainsi, celui qui ne se détourne pas des beaux corps tombe, non par le corps mais par l'âme, dans l'obscurité, et séjourne aveugle dans l'Hadès parmi les ombres. {green}Ulysse{/green}, au contraire, prend le large (8, 17-20). D'où le conseil d'Homère : **« Fuyons vers notre chère patrie »**. Et cette patrie, **« c'est le lieu d'où nous sommes venus, et notre père est là-bas »** (8, 21) : le monde intelligible.

    **Mais la fuite n'est pas un voyage** (8, 22-27) : ni à pied, ni en navire. Il faut __fermer les yeux, échanger cette manière de voir pour une autre et réveiller cette vision que tout le monde possède, mais dont peu font usage__.

    ! « Fuir » n'est pas un lâche abandon : c'est, selon le *Théétète* (176b), une course vers l'essentiel, qui se fait sur place, en changeant de regard.
