- id: traite1-l4
  title: "La beauté vient de l'intérieur : l'architecte, la Nature, l'œil de l'âme"
  notes: |-
    **La principale leçon du traité 1 est un éloge de l'intériorité.** La puissance de la Forme qui unifie le multiple n'est pas une force violente des corps, mais le pouvoir d'organisation d'un contenu rationnel.

    **L'architecte** a une idée de ce qu'il construit : ce projet est **« l'intérieur indivisible »** dont parle le chapitre 3 (ligne 14). Dans une maison, ce ne sont pas les briques qui sont belles, mais la structure qui les ordonne ; Platon le disait déjà dans le *Gorgias* (503d-504a). L'extériorité correspond à la **cause matérielle** d'Aristote, le substrat indéterminé (`hupokeímenon`) qui offre son étendue à l'intelligible.

    **Ce qui vaut pour l'architecte vaut pour la Nature.** Le traité 30 (III, 8) dira : « Il faut […] que la Nature soit une Forme (eîdos) et non un composé de matière et de forme ». Le principe d'un ordre a plus de réalité que cet ordre : la maison détruite, le savoir de l'architecte permet d'en bâtir une autre ; la rose fanée, la Nature fera refleurir le rosier.

    **La joie esthétique se fonde donc sur la forme intelligible, que nous voyons par « l'œil de l'âme »** (Platon, *République*, VII, 533d). Le traité 31 (V, 8) le dira : nous ne voyons pas la beauté tant qu'elle est extérieure.

    | L'intérieur | Ce que c'est |
    | dans l'objet beau | le principe formel, intérieur causal et non spatial |
    | dans l'homme | l'intériorité de celui qui est ému par la beauté |

    ! Cela ne rend pas les beaux corps méprisables (le traité 33 critiquera « ceux qui disent que le monde est mauvais ») : le philosophe ne doit seulement pas être dupe des apparences, l'extérieur s'explique par l'intérieur.
