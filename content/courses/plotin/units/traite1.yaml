- id: traite1-l8
  title: "La vision du bien (7)"
  notes: |-
    Au-delà de l'âme belle, il faut remonter vers le bien que toute âme désire : celui qui le voit « seul à seul » méprise toutes les autres beautés.

    **L'âme doit se retourner vers le bien** (7, 1-9), « lui que toute âme désire » ; le chapitre ne le démontre pas, il le décrit à partir de l'expérience : __« si donc quelqu'un l'a vu, il sait »__ ce que Plotin veut dire : il a vu, donc il sait (`eîden`, `oîden`). Le savoir est d'abord un voir.

    **La remontée est décrite comme une initiation.** Comme ceux qui entrent dans le lieu le plus saint des temples se purifient et ôtent leurs vêtements, l'âme __se dépouille de ce qu'elle a revêtu en descendant__, le corps. Pure de tout ce qui est étranger au dieu, elle le voit **{violet}« seul à seul »{/violet}**, « intact, simple et pur », lui « dont toutes choses dépendent » (formule d'Aristote sur le Premier Moteur), {coral}cause de la vie, de l'intellect et de l'être{/coral} (7, 9-21).

    **La rencontre transforme le désir** (7, 9-21) : celui qui ne l'a pas vu désire ce qu'il tient pour le bien ; celui qui l'a vu se réjouit au sein du beau, aime d'un amour véritable et méprise les beautés qu'il aimait auparavant.

    **Ce bien est la beauté première** (7, 21-30) : « le beau lui-même, pur par lui-même » (*Banquet*, 211e), ni sur terre ni au ciel. Il est le **{violet}« chorège »{/violet}** de toutes les beautés : __il donne en restant auprès de lui-même sans rien recevoir__ (7, 25-30). C'est pour lui que l'âme livre **« l'ultime combat »** (7, 30-31, d'après le *Phèdre*), qui mène à la « vision bienheureuse ».

    **D'où un renversement des valeurs** (7, 34-39) : est malheureux non celui qui manque de beaux corps ou de pouvoir, mais celui-là seul qui ne rencontre pas ce beau. Pour l'atteindre, il faut congédier la royauté et tout pouvoir sur la terre, la mer et le ciel.

    ! Le vocabulaire religieux (temples, initiation, « seul à seul ») ne met pas la philosophie au service d'un culte : il sert à dire une expérience qui est le cœur même de la philosophie.
