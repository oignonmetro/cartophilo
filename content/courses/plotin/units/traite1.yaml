- id: traite1-l6
  title: "Repérage : le plan du traité 1"
  notes: |-
    **Le traité 1 monte des beautés sensibles (chap. 1-3) à l'émotion qu'elles suscitent (chap. 4-5), puis à la purification (chap. 6) et à la vision du beau et du bien (chap. 7-9).**

    | Moment | Lieu | Ce qui s'y joue |
    | quelles choses sont belles | chap. 1 | critique de la définition stoïcienne par la proportion |
    | la Forme et l'âme | chap. 2 | l'âme accueille la beauté de la Forme, refuse la laideur de l'informe |
    | les beautés sensibles | chap. 3 | accord entre la Forme intérieure et l'extérieur ; couleur, lumière, feu |
    | les affects du beau | chap. 4 | stupeur, trouble, effroi ; l'aiguillon de l'amour |
    | la laideur de l'âme | chap. 5 | la vertu embellit l'âme ; la laideur vient du mélange au corps |
    | la purification | chap. 6 | la vertu est purification ; l'âme n'est plus que « Forme et raison » |
    | la vision bienheureuse | chap. 7 | union de l'âme au beau et au bien ; l'ultime combat |
    | la fuite vers là-bas | chap. 8 | Ulysse et Narcisse ; notre patrie est l'intelligible |
    | l'âme devient lumière | chap. 9 | le sculpteur ; le bien est au-delà du beau |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! La purification (chap. 6) précède la vision (chap. 7) : l'âme doit se défaire du corps avant de voir le beau lui-même.
