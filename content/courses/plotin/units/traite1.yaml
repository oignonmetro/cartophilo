- id: traite1-l3
  title: "Ajustement, réminiscence, purification : de l'esthétique à l'éthique"
  notes: |-
    **Le traité 1 lie aussitôt la beauté et l'âme.** Comme le plaisir de l'eau fraîche répond à un besoin réel du buveur, la joie esthétique répond à ce qu'est notre vie intérieure : Plotin parle d'un **« ajustement »** (chap. 2, ligne 4) entre l'âme et la beauté.

    **Ce qui se joue est décrit dans le vocabulaire platonicien de la réminiscence** (*Ménon*, *Phédon*, *Phèdre*) : l'âme, en disant « ceci est beau », se souvient de l'intelligible qu'elle contemplait avant de naître. Cette contemplation, selon Plotin, se poursuit pendant notre vie, mais nos affaires, le raisonnement et le langage, qui nous dispersent dans la multiplicité et le temps, nous empêchent d'y prêter attention.

    **L'intuition de la Forme est en même temps une intuition de soi** (chap. 2, 5, 6 et 8) : c'est pourquoi le thème de la beauté s'entrelace à celui de la purification. **L'esthétique proprement dite est dépassée par l'éthique.** Autrement dit, la beauté sensible n'est qu'un tremplin : elle rappelle à l'âme sa patrie, mais l'âme qui s'arrête à la forme matérielle s'égare (c'est le danger de Narcisse) ; la beauté ne dit sa vérité que lorsque l'âme se détourne du sensible pour se purifier.

    - Voir les beautés non sensibles demande une activité déliée de la sensation : la beauté des sciences n'est accessible qu'au savant.
    - La **purification** se comprend comme pour une eau pure, à laquelle rien n'est mélangé.
    - La vertu, que détaillera le traité 19 (I, 2) *Sur les vertus*, est une **conversion** vers l'Intellect (`hē pròs noûn strophḗ`). Plotin ne prône pas l'inaction (la *Vie de Plotin*, chap. 9, le montre tuteur et intendant) : il enracine l'action droite dans la contemplation de la justice en soi.
    - L'éthique est une tension de l'âme vers une condition autre que celle d'être unie à un corps : Plotin la nomme un **« combat »** (chap. 7, 31).

    ! La réminiscence n'est pas une mémoire sensible (retrouver où l'on a vu un objet) : c'est une remémoration qui conduit à l'intelligible lui-même.
  points:
  - id: traite1-l3-p1
    sentence: "Plotin parle, au chapitre 2 (ligne 4) du traité 1, d'un « ___ » entre la vie psychique et la nature de la beauté, comme le plaisir de l'eau fraîche répond à la soif."
