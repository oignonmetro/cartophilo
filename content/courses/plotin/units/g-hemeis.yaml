  - id: g-hemeis-l1-q1
    sentence: "Le « nous », ce que nous sommes vraiment, l'âme qui raisonne et non le vivant, se dit en grec translittéré ___."
    answer: hêmeis
    alt: ["hemeis", "hêmeîs"]
  - id: g-hemeis-l1-q2
    sentence: "« Comment se fait-il que ce soit \"nous\" qui sentons ? – C'est parce que nous ne sommes pas encore ___ de ce vivant qualifié » (traité 53, chap. 7)."
    answer: libérés
    alt: ["liberes"]
  - id: g-hemeis-l1-q3
    sentence: "Des formes proviennent « aussi bien les pensées que les opinions et les intellections. Et c'est là avant tout que se tient notre \"___\" » (traité 53, chap. 7)."
    answer: nous
    alt: []
  - id: g-hemeis-l1-q4
    sentence: "« Dans la mesure où l'homme véritable coïncide avec l'âme ___, tant que nous raisonnons c'est \"nous\" qui raisonnons » (traité 53, chap. 7)."
    answer: rationnelle
    alt: []
  - id: g-hemeis-l1-q5
    sentence: "« \"Nous\" se dit en deux ___, selon que l'on prend en compte la bête sauvage ou bien ce qui est déjà au-dessus d'elle » (traité 53, chap. 10)."
    answer: sens
    alt: []
  - id: g-hemeis-l1-q6
    sentence: "Tant que nous ne sommes pas séparés du corps, le composé nous appartient : « voilà pourquoi nous disons que nous ___ de ce dont notre corps pâtit » (traité 53, chap. 10)."
    answer: pâtissons
    alt: ["patissons"]
  - id: g-hemeis-l1-q7
    sentence: "Nous possédons l'Intellect « comme quelque chose qui est ___ de nous » (traité 53, chap. 8)."
    answer: au-dessus
    alt: ["au dessus"]
  - id: g-hemeis-l1-q8
    sentence: "L'Intellect est « à la fois commun à tous et propre à chacun », « parce que chacun le possède tout entier dans son âme ___ » (traité 53, chap. 8)."
    answer: première
    alt: ["premiere"]
  - id: g-hemeis-l1-q9
    sentence: "Posséder n'est pas exercer : « nous ne faisons pas toujours ___ de tout ce que nous possédons » (traité 53, chap. 11)."
