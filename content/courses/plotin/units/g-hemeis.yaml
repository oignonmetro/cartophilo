    answer: âme
    alt: ["ame"]
  - id: g-hemeis-l1-q12
    sentence: "Le traité de Plotin intitulé *Qu'est-ce que le vivant et qu'est-ce que l'homme ?*, qui répond à la question « qui est \"nous\" ? », est le traité ___."
    answer: 53 (I, 1)
    alt: ["53", "I, 1"]
