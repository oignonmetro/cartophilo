# d'après la notice et le plan détaillé de Jean-Marie Flamand, dans Plotin, Traités 7-21,
# trad. sous la dir. de L. Brisson et J.-F. Pradeau, GF-Flammarion, 2003.
# Les citations viennent de la notice, du plan ou de la traduction ; les
# repères (chapitre, lignes) sont ceux de cette édition. Lié à l'entrée
# t-1-2 de l'index.

id: traite19
title: "Traité 19 (I, 2) : Sur les vertus"
subtitle: "Devenir semblable au dieu"
icon: compass
color: sky
lessons:
- id: traite19-l1
  title: "Fuir d'ici : le mot du Théétète"
  notes: |-
    **Le traité 19 est bien un traité d'éthique, mais d'une éthique déconcertante : la seule activité éthique qu'admette Plotin est la poursuite continuelle, par l'âme, de l'union avec le divin.** Elle n'est pas tournée vers le rapport à autrui, et n'a rien de descriptif : elle est indissociable de la **dialectique** et de la structure métaphysique du monde.

    **L'âme est « amphibie »** : tournée vers l'Intellect, d'où elle vient, et vers le sensible, dont elle prend soin. **La vertu est l'activité de l'âme qui se détache du corporel pour se tourner vers l'Intellect**, jusqu'à s'identifier à lui. Tout le traité affirme le caractère intellectuel de l'âme.

    **Le point de départ est un passage de Platon, utilisé comme tremplin** : **« Puisque les maux existent ici-bas "et circulent nécessairement en ce lieu", et puisque l'âme veut fuir les maux, il faut fuir d'ici »** (1, 1-3). En quoi consiste cette fuite ? **À se rendre semblable au dieu** (`θεῷ ὁμοιωθῆναι`, *Théétète*, 176b), « si nous devenons justes et pieux avec réflexion ».

    - Depuis six siècles, la tradition platonicienne faisait de ce passage la définition du souverain bien et de la fin (`τέλος`) éthique : chez **Alcinoos**, Eudore, Théon de Smyrne, Gaius, **Apulée**, toute l'éthique se ramène à « devenir semblable au divin ».
    - Plotin repense cet idéal : que signifie devenir semblable au divin ? L'imiter, reproduire en nous des qualités qui seraient en lui ? Le divin possède-t-il des vertus ?

    **Pourquoi un traité entier sur les vertus ?** La doctrine est partout chez Plotin (le beau, l'amour, la dialectique, le bonheur) et ne varie pas. Mais l'âme a en elle, sans médiateur, la possibilité de faire retour au divin : elle a donc **le devoir d'être vertueuse**. Contre les gnostiques, qui n'ont ni doctrine ni pratique de la vertu, le traité 33 (II, 9), 15, dira : **« Sans la vertu, le divin n'est qu'un mot. »**

    ! « Devenir semblable au dieu » n'est pas imiter un modèle vertueux : le divin, on va le voir, n'a pas de vertus.
