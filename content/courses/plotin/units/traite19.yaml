- id: traite19-l4
  title: "Uniquement un dieu : la vie des dieux"
  notes: |-
    **L'homme purifié devient divin** (chap. 6). Les impulsions involontaires qui subsistent ne sont pas des fautes, mais l'occasion d'une rectification : **« nous ne mettons pas notre zèle à être sans faute, mais à être dieu »** (6, 2-3). Avec ces impulsions, l'homme est « dieu et démon », car double ; sans elles, **« il est uniquement un dieu »**, l'un de ceux qui suivent le premier dieu.

    **La vertu est contemplation** de ce que possède l'intellect (6, 12-19). Il faut distinguer la vertu dans l'âme et l'**analogue de la vertu** dans l'Intellect : la justice en soi n'est pas une vertu, mais son modèle.

    **L'implication mutuelle des vertus** (chap. 7) : les quatre vertus s'impliquent dans l'âme, comme leurs modèles dans l'Intellect ; **les vertus supérieures impliquent les inférieures**. Le sage connaît les vertus civiques et agit parfois selon elles ; mais se maîtriser, pour lui, c'est se séparer du corporel, non s'imposer une mesure.

    **La conclusion** (7, 21-30) : il ne faut pas se contenter de **la vie de l'homme de bien**, que tient en estime la vertu civique, mais **« choisir une vie différente, celle des dieux. Car c'est à eux, et non aux hommes de bien, qu'il faut devenir semblables »**.

    **Une synthèse originale** de deux idéaux :

    | Idéal | Origine | Les passions |
    | métriopathie | Aristote | limitées |
    | impassibilité (`ἀπάθεια`) | stoïciens | supprimées |

    Pour Émile **Bréhier**, c'est une **« inversion du sens de la morale traditionnelle »** : non plus une domination du haut sur le bas, mais une résorption de l'inférieur dans le supérieur.

    **La postérité : les « degrés de vertus »**, notion étrangère à Plotin, qui parle seulement de « vertus dites civiques » et de « vertu plus haute ». **Porphyre** (*Sentences*, 32) en distingue quatre (civiles, purificatives, contemplatives, paradigmatiques) ; **Macrobe** les transmet au Moyen Âge latin ; **Olympiodore** en compte jusqu'à sept. La *Vie de Plotin* elle-même suit les quatre degrés de Porphyre.

    ! Plotin ne parle pas de « degrés de vertus » : cette échelle est une systématisation scolaire de ses successeurs, à commencer par Porphyre.
