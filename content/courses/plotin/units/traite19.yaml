- id: traite19-l3
  title: "La vertu comme purification"
  notes: |-
    **L'idée fondamentale que Plotin reprend de Platon : la vertu est une `κάθαρσις`, une purification de l'âme** (chap. 3-4). Platon place la ressemblance au dieu dans des vertus plus hautes que les vertus civiques.

    | Aspect | Grec | Ce qu'il consiste à faire |
    | négatif | `ἀφαίρεσις` | se détacher des réalités corporelles, des opinions et affects liés au corps |
    | positif | `ἐπιστρέφειν`, `ἐπιστροφή` | se retourner vers son principe, l'Intellect |

    - **Le détachement** n'apporte à l'âme aucun bien nouveau : il la débarrasse de ce qui l'encombre et la détourne de ce qu'elle est. Ce qui reste après la purification, c'est l'âme elle-même.
    - **Le retour** produit une **illumination** : l'âme contient des **empreintes** des intelligibles, restées « privées de lumière » tant qu'elle était tournée vers le corps ; elles s'éclairent quand elle se tourne vers l'Intellect (4, 25-29).

    **Les quatre vertus, dans l'âme qui se purifie** (3, 15-19) : la réflexion est de penser sans le corps, la maîtrise de soi de ne pas partager ses affections, le courage de ne pas craindre de s'en séparer, la justice que la raison et l'intellect commandent.

    **La vertu appartient en propre à l'âme**, non à l'Intellect, et moins encore à l'Un (3, 31) : penser n'est pas la même chose pour l'âme et pour l'Intellect, comme le langage articulé n'est que l'image du langage intérieur.

    **À ce stade, les vertus ne mesurent plus les passions : elles les suppriment.** C'est l'idéal stoïcien d'**impassibilité** (`ἀπάθεια`) : l'âme impassible ne retient que les sensations nécessaires ; la colère, la crainte, le désir s'effacent (chap. 5). Mais l'impassibilité n'est pas une fin : c'est la **contemplation** de l'intelligible qui donne son sens à l'éthique.

    ! La purification ne rend pas l'âme meilleure en lui ajoutant quelque chose : elle la rend à ce qu'elle était, en lui ôtant le corporel.
