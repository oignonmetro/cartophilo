- id: traite19-l2
  title: "Le paradoxe et la double assimilation"
  notes: |-
    **À quel dieu devenons-nous semblables ?** À l'âme du monde, qui semble posséder les vertus ? Mais il est contestable que toutes lui appartiennent : rien n'est redoutable pour elle, rien d'agréable ne lui manque ; ni le **courage** ni la **maîtrise de soi** n'ont de sens pour elle, comme l'avait souligné Aristote. Et le divin ne possède pas les **vertus civiques** (1, 16-21) :

    | Vertu civique | Partie de l'âme |
    | la réflexion | la partie raisonnante |
    | le courage | la partie agressive |
    | la maîtrise de soi | l'accord de la partie désirante avec le raisonnement |
    | la justice | chaque partie accomplit sa tâche propre |

    **D'où le paradoxe** (1, 46-53) : **nos vertus nous rendent semblables à une réalité divine qui n'a pas elle-même de vertus.** Cela n'a rien de surprenant : les vertus servent à maîtriser les passions d'une âme liée à un corps ; le divin, pur de toute matière, n'a ni peur, ni désir, ni conflit intérieur à régler, et possède le vrai directement, sans effort.

    - **La chaleur** (1, 31-40) : un objet chauffé par le feu n'implique pas que le feu soit lui-même chauffé.
    - **La maison** (1, 41-45) : la maison sensible participe de l'arrangement et de l'ordre ; dans la raison de la maison, là-bas, il n'y a ni arrangement, ni ordre, ni symétrie. Elle est pourtant semblable à la maison intelligible.

    **La solution : la théorie de la double assimilation** (chap. 2) :

    | Assimilation | Entre | Ce qu'elle donne |
    | réciproque | deux images d'un même modèle | ressembler aux « hommes de bien » |
    | non réciproque | une image et son modèle | ressembler au divin |

    **Autrement dit** : deux images d'un même modèle se ressemblent entre elles (nous et les hommes de bien) ; une image ressemble à son modèle sans que le modèle lui ressemble (nous et le divin).

    **Ce qui la rend possible** : entre les niveaux de l'être, il n'y a pas de rupture ; chaque degré conserve une **trace** (`ἴχνος`) du principe qui l'a engendré. La théorie, fondée sur la **participation** platonicienne, enracine l'éthique dans la métaphysique. Participer à la forme, c'est devenir semblable à un principe **sans forme** (2, 19-26).

    **Les vertus civiques** imposent **mesure et limite** aux désirs et aux passions (2, 11-18) : sans elles, aucune vie commune. C'est l'idéal de **« métriopathie »**, repris d'Aristote : un premier pas dans l'assimilation au divin.

    ! La ressemblance entre l'image et le modèle n'est pas réciproque : nous ressemblons au divin, le divin ne nous ressemble pas.
