- id: traite19-l5
  title: "Repérage : le plan du traité 19"
  notes: |-
    **Le traité 19 pose le paradoxe (chap. 1), le résout par la double assimilation (chap. 2), puis décrit la purification (chap. 3-5) et la vie de l'âme purifiée (chap. 6-7).**

    | Moment | Lieu | Ce qui s'y joue |
    | devenir semblable au dieu | chap. 1 | le *Théétète* ; les vertus civiques ; le paradoxe |
    | la double assimilation | chap. 2 | image et image, image et modèle |
    | les vertus comme purifications | chap. 3 | les quatre vertus dans l'âme qui se purifie |
    | l'effet de la purification | chap. 4 | retour, contemplation, illumination |
    | se séparer du corps | chap. 5 | colère, crainte, désir |
    | les vertus de l'âme purifiée | chap. 6 | uniquement un dieu |
    | l'implication mutuelle des vertus | chap. 7 | la vie des dieux |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! Le traité finit sur la double assimilation du chapitre 2 : ressembler aux hommes de bien, c'est image à image ; aux dieux, image à modèle.
  points:
  - id: traite19-l5-p1
    sentence: "Dans le traité 19 de Plotin, le rappel du *Théétète* et le paradoxe de la vertu qui rend semblable à ce qui n'a pas de vertu occupent le ___."
