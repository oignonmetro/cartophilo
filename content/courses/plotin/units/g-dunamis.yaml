# La doctrine des deux actes a ses cartes dans Procession et dans Acte.

id: g-dunamis
title: Puissance (`dunamis`)
icon: book
color: teal
lessons:
- id: g-dunamis-l1
  title: Puissance
  notes: |-
    Chez Plotin, la {violet}**puissance**{/violet} (*dunamis*) est [def]. Elle n'est pas d'abord {pink}la possibilité d'une chose qui attend d'être réalisée{/pink}.

    __**Être « en puissance » et être une puissance.**__ La difficulté tient au mot, qui a deux sens chez {sky}Aristote{/sky} déjà, et que Plotin sépare nettement. L'airain est « en puissance » une statue : il peut devenir autre chose que ce qu'il est. Mais il n'est pas pour autant la puissance de la statue, car « __la puissance considérée comme puissance de produire ne saurait être dite en puissance__ ». D'où la règle : « il vaut mieux [...] utiliser la formule "en puissance" par rapport à "en acte", et le terme "puissance" par rapport à "acte" » ([[traite25|traité 25]], chap. 1). **L'être en puissance subit et reçoit ; la puissance agit et produit.**

    __**L'âme est une puissance, non un être en puissance.**__ On pourrait croire que l'âme, qui devient musicienne ou savante, est « en puissance » dans l'intelligible. Plotin répond : « l'âme n'est pas ces choses "en puissance", mais __elle est "puissance" de ces choses__ » (chap. 3). Elle ne reçoit pas sa forme d'ailleurs, elle la porte en elle et l'exerce, comme le courage s'exerce dans l'acte courageux (voir [[g-energeia|acte]]).

    __**L'Un, puissance de toutes choses.**__ Au sommet, Plotin appelle l'Un « __puissance de toutes choses__ » ([[traite7|traité 7]], chap. 2). Ce n'est pas un manque, comme si l'Un attendait de devenir ce qu'il produit : c'est la plus grande de toutes les puissances, assez pleine pour faire naître l'Intellect sans rien perdre (voir [[g-procession|procession]]). **Elle produit tout parce qu'elle n'est aucune des choses qu'elle produit.**

    __**La matière, en puissance toutes choses.**__ À l'autre extrémité, la [[g-hule|matière]] est « en puissance » tous les êtres : « elle est "en puissance" __non pas quelque chose en particulier, mais toutes__ » ([[traite25|traité 25]], chap. 5). Mais elle ne passe jamais à l'acte, et son « en puissance » est pure impuissance : elle n'est qu'« une chose sans force et une image obscure, incapable d'être formée ». La symétrie n'est donc qu'apparente : l'Un peut tout donner, la matière ne peut rien retenir.

    | | Être en puissance | Puissance |
    | Rapport | à ce qui sera en acte | à l'acte qu'elle exerce |
    | Exemple | l'airain, statue en puissance | le courage, l'âme |
    | Ce qu'il fait | reçoit une forme d'ailleurs | produit par lui-même |
    | Au plus haut degré | la matière | l'Un |

    ! « Puissance de toutes choses » et « en puissance toutes choses » se ressemblent mot pour mot, et disent l'inverse : la première formule dit la surabondance de l'Un, la seconde la pauvreté de la matière.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 7, chap. 2 | l'Un, puissance de toutes choses |
    | traité 25, chap. 1 | « en puissance » et « puissance » à distinguer |
    | traité 25, chap. 3 | l'âme est puissance, non en puissance |
    | traité 25, chap. 5 | la matière, en puissance toutes choses |

    **Voir aussi** : [[g-energeia|Acte]] · [[g-procession|Procession]] · [[g-un|Un]] · [[g-hule|Matière]] · [[traite25|Traité 25]]
