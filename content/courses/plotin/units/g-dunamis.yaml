  - id: g-dunamis-l1-q1
    sentence: "Le pouvoir actif de produire, que Plotin distingue du simple être en puissance, se dit en grec translittéré ___."
    answer: dunamis
    alt: ["dynamis", "dúnamis"]
  - id: g-dunamis-l1-q2
    sentence: "L'airain est en puissance une statue, mais il n'en est pas la puissance : « la puissance considérée comme puissance de ___ ne saurait être dite en puissance » (traité 25, chap. 1)."
    answer: produire
    alt: []
  - id: g-dunamis-l1-q3
    sentence: "Il vaut mieux « utiliser la formule \"en puissance\" par rapport à \"en acte\", et le terme \"puissance\" par rapport à \"___\" » (traité 25, chap. 1)."
    answer: acte
    alt: []
  - id: g-dunamis-l1-q4
    sentence: "« Ce qui est \"en puissance\" joue donc le rôle d'une sorte de ___ pour les affections, les figures et les formes qu'il va recevoir » (traité 25, chap. 1)."
    answer: substrat
    alt: []
  - id: g-dunamis-l1-q5
    sentence: "« L'âme n'est pas ces choses \"en puissance\", mais elle est \"___\" de ces choses » (traité 25, chap. 3)."
    answer: puissance
    alt: []
  - id: g-dunamis-l1-q6
    sentence: "Plotin appelle l'Un « puissance de ___ choses » (traité 7, chap. 2)."
    answer: toutes
    alt: []
  - id: g-dunamis-l1-q7
    sentence: "La matière est « en puissance » « non pas quelque chose en ___, mais toutes » (traité 25, chap. 5)."
    answer: particulier
    alt: []
  - id: g-dunamis-l1-q8
    sentence: "La matière n'est qu'« une chose sans force et une image ___, incapable d'être formée » (traité 25, chap. 5)."
    answer: obscure
    alt: []
  - id: g-dunamis-l1-q9
    sentence: "« Puissance de toutes choses » dit la surabondance de l'Un ; « en puissance toutes choses » dit la ___ de la matière."
    answer: pauvreté
    alt: ["pauvrete"]
