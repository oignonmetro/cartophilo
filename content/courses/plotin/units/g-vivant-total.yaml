    sentence: "On peut comparer l'Intellect « à une sphère qui vit une vie variée », ou se le représenter « comme un être qui n'est que ___, où resplendissent des visages vivants » (traité 38, chap. 15, l. 23-28)."
    answer: visages
    alt: []
  - id: g-multiplicite-intelligible-l2-q2
    sentence: "On peut comparer l'Intellect « à une ___ qui vit une vie variée », ou se le représenter comme un être qui n'est que visages (traité 38, chap. 15, l. 23-28)."
