id: g-vivant-total
title: Vivant total (`zôon panteles`)
icon: book
color: coral
lessons:
- id: g-vivant-total-l1
  title: Vivant total
  notes: |-
    Chez Plotin, le {violet}**vivant total**{/violet} (*zôon panteles*), repris du {sky}*Timée*{/sky}, est [def] : ses Formes ne sont {pink}pas des objets inertes{/pink}.

    __**Pourquoi l'Intellect est un vivant.**__ L'Intellect qui pense est identique aux Formes qu'il pense : « L'Intellect dans sa totalité est toutes les Formes, et __chaque Forme est un intellect__ » ([[traite5|traité 5]], chap. 8). Si chaque Forme pense, elle vit ; et la totalité des Formes est donc un vivant, non un catalogue d'idées ni un réceptacle de concepts. C'est la [[g-vie-parfaite|vie parfaite]].

    __**Un seul vivant qui est tous les vivants.**__ La difficulté est de comprendre comment un vivant unique peut être tous les autres. Plotin le dit au [[traite34|traité 34]] : « Il s'agit bien sûr du vivant total qui est fait de tous les vivants, ou plutôt __qui embrasse en lui-même tous les vivants__ et qui, tout en restant un vivant unique, __n'est rien de moins que tous les vivants__ » (chap. 7). {yellow}Notre monde en est l'image{/yellow} : lui aussi, vivant unique, embrasse tout le visible. L'homme d'ici est une partie du monde ; l'Homme intelligible est une partie, mais qui contient le tout, du vivant total.

    __**L'image de la sphère aux visages.**__ L'Intellect est « un Bien devenu varié » : on peut le comparer « à une sphère qui vit __une vie variée__ », ou se le représenter « comme un être qui n'est que visages, où resplendissent des visages vivants » ([[traite38|traité 38]], chap. 15). **Un visage n'est pas une chose parmi d'autres : c'est la vie d'un être qui se montre tout entière en lui.** Chaque visage est distinct, aucun n'est hors des autres.

    ! Le vivant total n'est pas le [[g-vivant|vivant]] composé d'une âme et d'un corps : c'est le modèle intelligible dont le monde et chaque vivant sensible sont les images.

    **Voir aussi** : [[g-intellect|Intellect]] · [[g-multiplicite-intelligible|Multiplicité intelligible]] · [[g-vie|Vie]] · [[g-vivant|Vivant]] · [[traite34|Traité 34]]
