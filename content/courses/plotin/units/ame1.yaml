# Cours « L'âme et sa descente » (piste Idées de Plotin), unités ame1 à ame7,
# selon le § « Un cours sur un auteur, tiré d'un commentaire » de
# content/philosophie.md. Sources fournies par l'utilisateur (2026-11-23) :
#  - F. Lacroix, mémoire sur le traité 6 (IV, 8), chap. 3 « L'âme chez Plotin »
#    (p. 27-38) et chap. 5 « La descente de l'âme chez Plotin » (p. 100-111) ;
#  - J.-M. Narbonne, « L'énigme de la non-descente partielle de l'âme chez
#    Plotin : la piste gnostique/hermétique de l'ὁμοούσιος », Laval théologique
#    et philosophique, 64, 3, 2008, p. 691-708.
# Ce que ces textes supposent connu (la cause de la descente, le volontaire et
# le nécessaire, les deux fautes, les âmes sœurs du traité 27) vient des cours
# des traités 6, 10 et 27 déjà écrits d'après la GF ; leurs citations y sont
# reprises dans la traduction GF, pour ne pas faire apprendre deux traductions
# du même passage. Les autres citations de Plotin sont celles des deux
# commentaires, dans leur traduction.
#
# ame1 : ce qu'est l'âme (Lacroix, chap. 3, introduction et 3.1 ; 3.2.2 pour
# les logoi).

id: ame1
title: "Ce qu'est l'âme"
