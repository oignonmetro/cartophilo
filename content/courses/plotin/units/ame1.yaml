- id: ame1-l2
  title: "Une âme sans parties : des puissances, non des morceaux"
  notes: |-
    **On parle des « parties » de l'âme (nutritive, sensitive, discursive, intellective), mais l'âme n'a pas de parties : ce sont des** {violet}**puissances**{/violet} **(`dunamis`) d'une réalité indivisible, et leurs distinctions sont** {coral}**purement logiques**{/coral}. C'est la condition de tout ce qui suit : si l'âme pouvait se couper, une part pourrait tomber et l'autre rester ; puisqu'elle ne se coupe pas, il faudra comprendre autrement qu'elle soit à la fois ici et là-bas.

    **Le vocabulaire de Plotin.** Pour désigner les différents modes de l'âme, Plotin emploie à dessein le terme {blue}*dunamis*{/blue}, « puissance », et rappelle que l'âme n'est pas divisible ([[traite4|traité 4]], 1, 62-63 ; [[traite9|traité 9]], 1, 39-40).

    **Pourtant, l'âme serait « divisible dans les corps ».** Le [[traite4|traité 4]] le dit (1, 74), ce qui semble contredire la thèse. {sky}Karfík{/sky} lève la difficulté : {coral}ce n'est pas l'âme qui est divisible, c'est le corps{/coral}, qui, étant divisible, doit être animé **dans chacune de ses parties**. {yellow}La main, l'œil et le pied vivent tous{/yellow}, mais ils ne reçoivent pas chacun un morceau d'âme : l'âme tout entière est présente à chacun, en y exerçant la fonction que l'organe permet (voir, toucher, marcher). D'où ses fonctions multiples, par lesquelles elle **rend manifestes toutes ses puissances** ([[traite6|traité 6]], 5, 29-30 ; [[traite8|traité 8]], 3, 10 et suiv.).

    {yellow}Une science est tout entière en chacun de ses théorèmes{/yellow} : le [[traite27|traité 27]] retient ce seul sens du mot « partie » pour l'âme, d'où sa formule : {teal}« {/teal}chaque âme est {teal}__toute âme__ »{/teal} (chap. 2).

    **La substance de l'âme ne dépend pas du corps.** Contre la lecture de {sky}Blumenthal{/sky}, qui prête à Plotin une âme-fonction de type {sky}aristotélicien{/sky}, {sky}Caluori{/sky} rappelle que {coral}c'est le corps qui dépend de l'âme{/coral} : l'âme n'est pas dans le corps comme chez {sky}Alexandre d'Aphrodise{/sky}. {red}Une âme qui ne serait que la fonction d'un corps naîtrait et périrait avec lui{/red} ; {green}l'âme de Plotin existe avant le corps et le fait vivre{/green}.

    **Deux conséquences pour la descente.**

    - Quand le [[traite6|traité 6]] dit qu'une **partie** ({blue}*meros*{/blue}) de notre âme est restée là-haut (4, 30-35 ; 8, 17 et suiv.), il parle **métaphoriquement** : une même âme indivisible exerce des puissances tournées vers le haut et vers le bas.
    - De même, la séparation de l'âme en trois, l'Âme divine, l'âme du monde et l'âme dans les corps, n'est qu'**une manière de s'exprimer** au sujet d'une même réalité, selon la fonction qu'elle remplit (idée avancée déjà par {sky}Rich{/sky}).

    ! « Partie » de l'âme ne désigne jamais un morceau : c'est une puissance, ou un rapport de l'âme tout entière à ce sur quoi elle agit.
  points:
