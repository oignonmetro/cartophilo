lessons:
- id: ame1-l1
  title: "L'âme, image et raison de l'Intellect"
  notes: |-
    **Pour comprendre la descente de l'âme, il faut d'abord savoir ce qui descend : une réalité intelligible, la troisième après l'Un et l'Intellect, qui est la** {violet}**raison**{/violet} **(`logos`) de l'Intellect, c'est-à-dire l'Intellect déployé et rendu actif au-dehors.** Tout ce qu'on dira de ses rapports au corps découle de ce point : l'âme ne vient pas du corps, c'est le corps qui vient d'elle.

    **L'âme vient de l'Intellect comme sa seconde activité.** Plotin le dit au [[traite10|traité 10]] : l'âme {teal}« {/teal}n'est qu'{teal}__une image de l'Intellect__ »{/teal}. Et il précise par une comparaison : {teal}« Tout comme le discours prononcé{/teal} est une image de {teal}la raison{/teal} qui se trouve dans l'âme, de même, l'âme est {teal}__la raison de l'Intellect__ »{/teal} (chap. 3). {yellow}Celui qui parle déploie en mots successifs une pensée qui, en lui, tient tout entière à la fois{/yellow} : l'âme est à l'Intellect ce que la phrase est à la pensée. Elle ne lui ajoute aucun contenu, elle le **déroule**.

    **Elle est un {violet}logos{/violet}, et une multitude de {violet}logoi{/violet}.** {sky}Narbonne{/sky} résume ainsi ce point du système : « L'Âme est un logos universel et une pluralité de logoi ou principes rationnels ». Le mot vient des {sky}stoïciens{/sky}, mais Plotin le **platonise** ({sky}Brisson{/sky}) : chez les stoïciens, le logos qui façonne la matière est lui-même un corps ; chez Plotin, un contenu rationnel suppose {amber}une Forme dont il dépend, qu'il manifeste et qu'il rend présente{/amber}. Les logoi ont ainsi deux faces :

    - {amber}l'expression des Formes dans le discours rationnel{/amber} : ce par quoi nous pouvons dire et définir ;
    - {amber}des principes actifs{/amber} qui font apparaître dans le monde sensible **les images des Formes** : {yellow}le logos de l'olivier, présent dans la graine, fait pousser un olivier et non un chêne{/yellow}.

    ! Un logos n'est pas un raisonnement. Le logos est un principe rationnel, présent tout entier et d'un coup ; le raisonnement ({blue}*logismos*{/blue}) va d'une prémisse à une conclusion. L'âme possède les logoi sans avoir à raisonner pour les avoir.

    **L'âme est aussi pauvreté.** Dans le mythe de la naissance d'Éros du *{sky}Banquet{/sky}*, que lit le [[traite50|traité 50]], {sky}Hadot{/sky} voit dans {violet}Poros{/violet} (Expédient) l'âme du monde en tant qu'elle est {amber}le déploiement des Formes{/amber}, qui deviennent en elle des logoi, et dans {violet}Pénia{/violet} (Pauvreté) l'âme du monde en tant qu'elle est {amber}le réceptacle, la matière des logoi{/amber}, l'indigence de l'âme qui, par elle-même, est privée du beau et du bien, mais qui les désire. {coral}L'âme reçoit tout ce qu'elle a de l'Intellect : c'est pourquoi elle désire, et c'est pourquoi elle peut se tourner vers lui ou s'en détourner.{/coral}

    **Une réalité intermédiaire.** Image de l'Intellect par le haut, principe des corps par le bas, l'âme est la seule réalité qui touche à la fois l'intelligible et le sensible. Toute la question de sa « descente » vient de là : comment une réalité de là-haut peut-elle être ici sans cesser d'être ce qu'elle est ?
