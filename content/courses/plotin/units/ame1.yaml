- id: ame1-l3
  title: "Éternelle et temporelle : l'âme et le temps"
  notes: |-
    **L'âme est à la fois éternelle, par ce qui la rattache à l'Intellect, et temporelle, puisqu'elle s'est « asservie au temps » : c'est la même tension que celle de la non-descente, et elle se résout de la même façon,** {coral}**en voyant dans le temps la vie même de l'âme**{/coral}.

    **L'âme divine est hors du temps.** {teal}« Toute âme{/teal} est {teal}__sœur__{/teal} de celle qui est là-bas{teal} »{/teal} ([[traite27|traité 27]], 6, 13 ; [[traite33|traité 33]], 18, 16) : tout ce qui vit est donc relié à l'{violet}Âme divine{/violet}. Or celle-ci demeure auprès de l'Intellect, partage sa vie éternelle ([[traite45|traité 45]], chap. 11) et ne s'inscrit pas dans le temps : {teal}« là-bas{/teal}, {teal}__tout est ensemble__ »{/teal} ([[traite32|traité 32]], 10, 6-8). Rien n'y a de parties, rien n'y est divisé.

    **Mais l'âme s'est asservie au temps.** Le traité *Sur l'éternité et le temps* dit que l'âme {teal}« {/teal}s'est elle-même {teal}__asservie au temps__ »{/teal} ([[traite45|traité 45]], 11, 31), {teal}« {/teal}en produisant {teal}__le temps au lieu de l'éternité__ »{/teal}. Cela implique une **dissémination** dans le monde sensible et dans le temps. Mais {green}l'âme se disperse en restant accrochée à sa ramification divine{/green} : d'où son statut d'{violet}**âme amphibie**{/violet} ([[traite6|traité 6]], chap. 4). **La non-descente partielle de l'âme est donc liée chez Plotin à la conception du temps**, et à la nécessité de penser l'éternel.

    **Pourquoi il faut une part non descendue pour parler de l'éternité.** Comme le rappelle {sky}Hoffmann{/sky}, la condition de possibilité du discours sur l'éternité réside dans la participation de l'intellect humain à l'Intellect divin, où demeure une part « non descendue » de l'âme. {yellow}Un être entièrement plongé dans le temps n'aurait aucune idée de l'éternité, comme un poisson qui n'aurait jamais quitté l'eau n'aurait pas l'idée de l'air{/yellow}. Parler de l'éternité, c'est donc déjà s'interroger sur notre propre vie, se demander {amber}comment devenir éternel{/amber}, jusqu'à devenir **soi-même intellect**.

    **La difficulté.** {amber}__**Comment une même chose peut-elle être à la fois éternelle et temporelle ?**__{/amber}

    - {amber}si l'âme est éternelle{/amber}, elle doit n'être qu'une seule et même réalité indivisible ;
    - {amber}si elle est temporelle{/amber}, elle s'inscrit dans le devenir : elle vit à un moment *x*, puis à un moment *y*, et semble se répartir entre eux.

    **La solution de Plotin** : {green}le temps est la vie de l'âme{/green}, et cette vie est éternelle ([[traite45|traité 45]], 11, 50-51 ; 12, 10). L'âme n'a donc pas de parties, puisque sa vie embrasse tous les moments **en même temps** : ce sont ses produits qui se succèdent, non elle qui se morcelle.

    ! Que l'âme soit « dans le temps » ne veut pas dire qu'elle soit comme un corps qui dure : le temps n'est pas un cadre où elle entrerait, c'est sa propre vie qui se déploie.
