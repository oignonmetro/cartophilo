  - id: g-eternite-l1-q1
    sentence: "L'éternité, que Plotin définit comme la vie de l'être intelligible et non comme une durée sans fin, se dit en grec translittéré ___."
    answer: aiôn
    alt: ["aion"]
  - id: g-eternite-l1-q2
    sentence: "L'éternité est « une vie qui demeure dans l'___ parce que le tout lui est toujours présent » (traité 45, chap. 3, l. 16-17)."
    answer: identité
    alt: ["identite"]
  - id: g-eternite-l1-q3
    sentence: "L'éternité est « une vie qui demeure dans l'identité parce que le ___ lui est toujours présent » (traité 45, chap. 3, l. 16-17)."
    answer: tout
    alt: []
  - id: g-vie-l1-q18
    sentence: "L'éternité est « la vie qui appartient à l'être et qui est dans l'être, la vie qui est tout entière ensemble, pleine et absolument dépourvue d'___ » (traité 45, chap. 3, l. 36-38)."
    answer: extension
    alt: []
  - id: g-eternite-l1-q5
    sentence: "L'éternité est « la vie qui appartient à l'être et qui est dans l'être, la vie qui est tout entière ___, pleine et absolument dépourvue d'extension » (traité 45, chap. 3, l. 36-38)."
    answer: ensemble
    alt: []
  - id: g-eternite-l1-q6
    sentence: "Ce qui est complet n'a pas d'avenir : « dire que quelque chose \"sera\", en effet, c'est dire que le tout ___ de cette chose et qu'il n'était donc pas tout » (traité 45, chap. 4)."
    answer: manquait
    alt: []
  - id: g-eternite-l1-q7
    sentence: "À la différence de l'univers, qui se hâte vers l'avenir, les êtres premiers « n'ont pas même de ___ de l'avenir » (traité 45, chap. 4)."
    answer: désir
    alt: ["desir"]
  - id: g-eternite-l1-q8
    sentence: "« Être véritablement, en effet, c'est ne jamais ne pas être et ne jamais être ___ » (traité 45, chap. 6)."
    answer: autrement
    alt: []
  - id: g-eternite-l1-q9
    sentence: "Dit de l'être, « toujours » ne doit pas faire concevoir l'être « comme quelque chose qui s'___ toujours plus » (traité 45, chap. 6) : il signifie seulement « ce qui est véritablement »."
    answer: étend
    alt: ["etend"]
  - id: g-eternite-l1-q10
    sentence: "Ce qui ne change jamais est perpétuel, en grec translittéré ___ ; mais la perpétuité n'est qu'un état de l'être, tandis que l'éternité est l'être même qui le possède (traité 45, chap. 5)."
    answer: aidios
    alt: ["aídios"]
  - id: g-eternite-l1-q11
    sentence: "« La perpétuité sera cet état du substrat, qui vient du substrat lui-même et qui est en lui, et l'éternité sera le ___, pris avec cet état qui se montre en lui » (traité 45, chap. 5)."
    answer: substrat
    alt: []
  - id: g-eternite-l1-q12
    sentence: "L'éternité est « une vie d'emblée ___ », « parce qu'elle est totale et ne perd rien d'elle-même » (traité 45, chap. 5)."
    answer: illimitée
    alt: ["illimitee"]
  - id: g-eternite-l1-q13
    sentence: "Celui qui contemplerait l'éternité sans s'en détourner deviendrait « semblable à elle et éternel, contemplant l'éternel et l'éternité par ce qu'il y a en lui d'___ » (traité 45, chap. 5)."
    answer: éternel
