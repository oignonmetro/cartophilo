# vérifiées sur la GF (III, 7, 3-6) ; notes 163 et 165 de la GF pour la
# perpétuité. La carte g-vie-l1-q18 vient de l'entrée Vie et garde son
# identifiant, donc sa progression.

id: g-eternite
title: Éternité (`aiôn`)
icon: book
color: coral
lessons:
- id: g-eternite-l1
  title: Éternité
  notes: |-
    Chez Plotin, l'{violet}**éternité**{/violet} (*aiôn*) est [def]. Elle n'est pas {pink}une durée sans fin{/pink}.

    __**L'éternité est une vie, non un temps infini.**__ Le [[traite45|traité 45]] la cherche dans l'intelligible, et la trouve dans sa [[g-vie|vie]] : « une vie qui __demeure dans l'identité__ parce que __le tout lui est toujours présent__ » (chap. 3, l. 16-17), ou encore « la vie qui appartient à l'être et qui est dans l'être, la vie qui est __tout entière ensemble__, pleine et __absolument dépourvue d'extension__ » (chap. 3, l. 36-38). **L'éternité n'est donc pas un attribut ajouté à l'être** : c'est l'être même de l'{violet}[[g-intellect|Intellect]]{/violet}, saisi dans sa manière de vivre.

    __**Ce qui est complet n'a pas d'avenir.**__ Le véritable tout ne manque de rien ; or « dire que quelque chose "sera", en effet, c'est dire que __le tout manquait de cette chose__ et qu'il n'était donc pas tout » (chap. 4). {red}Les choses engendrées acquièrent leur être peu à peu{/red}, et l'univers lui-même « se hâte vers l'avenir » ; {green}les êtres premiers{/green}, au contraire, « __n'ont pas même de désir de l'avenir__ ». C'est la raison profonde de l'éternité : **qui possède tout n'a rien à attendre**.

    __**Le « toujours » égare.**__ Dire de l'être qu'il est « toujours », c'est parler pour se faire comprendre ; pris au pied de la lettre, le mot risque d'égarer l'âme « en lui faisant concevoir l'être comme __quelque chose qui s'étend toujours plus__ » (chap. 6). « Toujours » veut dire seulement « ce qui est véritablement » : car « être véritablement, en effet, c'est __ne jamais ne pas être et ne jamais être autrement__ ».

    __**Perpétuité et éternité.**__ Ce qui ne change jamais est {violet}*perpétuel*{/violet} (*aidios*). Mais Plotin distingue : « la perpétuité sera __cet état du substrat__, qui vient du substrat lui-même et qui est en lui, et l'éternité sera __le substrat__, pris avec cet état qui se montre en lui » (chap. 5). **La perpétuité est une propriété ; l'éternité est la réalité qui la possède**, l'être véritable lui-même. D'où sa définition : « une __vie d'emblée illimitée__ », « parce qu'elle est totale et ne perd rien d'elle-même ».

    __**Le temps en est l'image, et nous pouvons y avoir part.**__ Le [[g-temps|temps]] naît quand l'âme quitte cette vie tout entière à la fois pour la parcourir par parties. Inversement, celui qui contemplerait l'éternité sans jamais s'en détourner deviendrait « semblable à elle et éternel, contemplant l'éternel et l'éternité __par ce qu'il y a en lui d'éternel__ » (chap. 5).

    ! L'éternité n'est pas l'immortalité : une chose qui durerait sans fin serait perpétuelle dans le temps, non éternelle. L'éternité exclut la durée elle-même, le passé comme l'avenir.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 45, chap. 3 | l'éternité est la vie de l'être |
    | traité 45, chap. 4 | le tout ne manque de rien, donc rien ne sera |
    | traité 45, chap. 5 | perpétuité et éternité, vie d'emblée illimitée |
    | traité 45, chap. 6 | « toujours » veut dire « véritablement » |

    **Voir aussi** : [[g-temps|Temps]] · [[g-vie|Vie]] · [[g-intellect|Intellect]] · [[g-vie-parfaite|Vie parfaite]] · [[traite45|Traité 45]]
