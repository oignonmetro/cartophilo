# Entrée du glossaire de Plotin (skill glossaire) : notion, écrite le
# 2026-11-18 avec la procédure NotebookLM (journal g-liberte). Citations
# vérifiées sur la GF (traité 3, chap. 8 ; traité 39, chap. 1-7, 9-10, 13,
# 15-16, 21). Le volontaire (savoir et contrainte) a son entrée (Volontaire),
# la nécessité la sienne (Nécessaire).

id: g-liberte
title: Liberté (`eleutheria`)
icon: book
color: coral
lessons:
- id: g-liberte-l1
  title: Liberté
  notes: |-
    Chez Plotin, la {violet}**liberté**{/violet} (*eleutheria*), avec la {violet}libre disposition de soi{/violet} (*autexousion*) et {violet}ce qui dépend de nous{/violet} (*to eph' hêmin*), est [def]. Elle n'est {pink}pas le pouvoir de choisir entre les contraires{/pink} : elle croît à mesure qu'on s'approche du Bien, de l'âme à l'Intellect, et de l'Intellect à l'Un, qui est plus que libre.

    __**Être libre, c'est ne pas être**__ {violet}__**asservi**__{/violet}__**, c'est-à-dire pouvoir aller sans obstacle à son**__ {violet}__**bien propre**__{/violet}__**, non pouvoir les contraires.**__ Le [[traite39|traité 39]] part de la notion commune : ce qui dépend de nous, c'est « ce que nous pouvons accomplir __sans être asservis__ aux coups du hasard et de la nécessité ainsi qu'aux violences des passions, et ce que nous voulons __sans que rien ne fasse obstacle__ à nos volontés » (chap. 1). Reste à savoir ce qu'est la servitude. Or {coral}l'esclave n'est pas malheureux de ne pouvoir faire le mal{/coral} : « l'on condamne l'asservissement : non pas parce que l'esclave ne possède pas la faculté d'aller vers le mal, mais parce qu'__il n'a pas la faculté d'aller vers son bien propre__ et qu'il est conduit vers le bien d'un autre » (chap. 4). Puisque tout être veut son bien, ce qui le mène ailleurs vient d'un autre que lui ; être libre, c'est donc aller à son bien sans obstacle. Le pouvoir des contraires, loin d'en être la marque, trahit une faiblesse : « pouvoir produire les contraires en effet, c'est le fait d'un être qui __se trouve dans l'incapacité de rester dans ce qui est le meilleur__ » (chap. 21).

    __**Ce qui dépend de nous ne vient ni du**__ {violet}__**désir**__{/violet} __**ni de la**__ {violet}__**colère**__{/violet}__**, mais de l'**__{violet}__**intellect**__{/violet} __**: l'âme n'est libre qu'en se réglant sur lui.**__ Être maître, c'est ne pas être mené. Or le désir naît d'un manque, et {coral}ce qui manque est mené par ce qui le comblera{/coral} : « ce qui est nécessairement en manque et qui désire être comblé __n'est pas maître de ce vers quoi il est totalement mené__ » ([[traite39|traité 39]], chap. 2). Si l'on plaçait la liberté dans la colère et le désir, comme {sky}Aristote{/sky}, on devrait l'accorder « aux enfants et aux animaux », et même « aux fous » et à ceux « qui sont sous l'emprise de drogues » (*ibid*.). L'opinion droite ne suffit pas davantage, car on peut agir comme il faut « par hasard ou par une représentation quelconque » (chap. 3), et la représentation naît des humeurs du corps. Reste l'intellect : « nous attribuerons la libre disposition de soi à l'individu qui, __du fait des actes de l'intellect, est libre des affections de son corps__ » (*ibid*.). D'où le mot du [[traite3|traité 3]] : sans le corps, l'âme « est vraiment maîtresse d'elle-même, libre et soustraite à la causalité cosmique » (chap. 8). **L'âme devient libre, elle ne l'est pas d'emblée** : « L'âme devient donc libre lorsque, __grâce l'Intellect, elle se hâte vers le Bien sans rencontrer d'obstacle__ » ([[traite39|traité 39]], chap. 7 ; sur l'acte réglé sur la raison, voir [[g-volontaire|volontaire]]).

    __**La liberté de la**__ {violet}__**vertu**__{/violet} __**est dans la**__ {violet}__**volonté**__{/violet} __**qui précède l'action, non dans l'action, parce que l'action dépend des circonstances.**__ Le courage s'exerce à la guerre ; mais « si la guerre n'avait pas eu lieu, nous n'aurions pu l'accomplir » ([[traite39|traité 39]], chap. 5). {coral}L'action vertueuse répond donc à une situation qu'elle n'a pas choisie{/coral} : « la vertu se voit toujours soumise à la nécessité d'accomplir telle ou telle chose en fonction des circonstances » (*ibid*.), et elle ne la voudrait pas, car « elle préférera le repos à l'action » (*ibid*.). Ainsi « tout ce qui relève de l'action, quand bien même la raison domine, __reste mélangé__ et ne peut pas dépendre purement de nous » (chap. 2). La liberté est donc dans ce qui précède l'action : « en situant la libre disposition de soi et ce qui dépend de la vertu purement dans ce qui est antérieur à l'action, __nous les situerons hors de l'action__ » (chap. 5). Elle n'en exclut pas l'action, qui est libre par ce dont elle dérive : « tout ce qui dérive de cette volonté et qui se trouve accompli grâce à elle dépend de nous, aussi bien ce qui est extérieur que ce qui est en elle-même » (chap. 6). C'est pourquoi la vertu, par son acte intérieur, est « __un certain intellect__ » (*ibid*.).

    __**L'**__{violet}__**Intellect**__{/violet} __**est libre par lui-même, parce qu'il n'est pas asservi à sa**__ {violet}__**nature**__{/violet} __**: entre lui et elle, il n'y a pas deux termes.**__ L'objection vient d'elle-même : l'Intellect ne peut être autre qu'il n'est ; « comment la liberté peut-elle exister, si même les réalités situées là-bas __se trouvent asservies à leur propre nature__ ? » ([[traite39|traité 39]], chap. 4). Plotin répond que {coral}la servitude suppose deux termes{/coral} : « parler d'asservissement à sa propre nature revient à __produire une dualité__ entre ce qui est asservi et ce à quoi il est asservi » (*ibid*.). Or l'Intellect est un acte sans puissance en reste, en qui « être et agir sont une même chose » : « une nature simple, à savoir un acte unique qui ne se partage pas entre ce qui est en puissance et ce qui est en acte, __comment ne serait-elle pas libre__ ? » (*ibid*.). Il dépend bien d'un principe, le Bien ; mais ce principe « n'est pas extérieur à lui », et dépendre de ce qui est son bien, c'est la liberté même : « si l'Intellect existe selon le Bien, __c'est à plus forte raison qu'il dépend de lui-même__ et qu'il est libre » (*ibid*. ; voir [[g-intellect|Intellect]]).

    __**L'**__{violet}__**Un**__{/violet} __**est plus que libre : il n'est tel ni par**__ {violet}__**nécessité**__{/violet} __**ni par**__ {violet}__**hasard**__{/violet}__**, parce qu'il est son propre acte et la nécessité des autres.**__ L'adversaire du [[traite39|traité 39]] soutient que le premier, n'ayant pas choisi d'être, est ce qu'il est par accident ou par nécessité. {coral}Mais le hasard suppose plusieurs causes qui se rencontrent{/coral} : il « consiste dans les choses qui n'existent ni comme causes antécédentes ni comme conséquences de ces causes, mais qui surviennent par une rencontre fortuite », et il « n'est maître d'engendrer ni l'Intellect, ni la raison ni l'ordre » (chap. 10). {coral}Et la nécessité suppose un antérieur qui contraint{/coral} : or rien ne précède le premier, et « c'est en effet dans les choses qui suivent le principe que la nécessité existe » (chap. 9). Il n'est donc pas contraint par la nécessité : il est lui-même « __pour les autres choses la nécessité et la loi__ » (chap. 10). Ce qu'il est, il l'est par son acte : « l'être qu'il est est donc son acte tourné vers lui-même. Car cet acte et lui-même ne font qu'un. __Il s'est donc fait exister lui-même__ » (chap. 16), en sorte que « sa volonté et sa réalité seront identiques » (chap. 13). S'il ne peut être autre, c'est par perfection : « ce n'est pas par incapacité à être autrement qu'il est tel qu'il est, mais parce que __être ainsi, c'est ce qu'il y a de plus parfait__ » (chap. 10). L'âme qui s'unit à lui ne peut que le dire : « nous sommes alors __plus que libres__ et plus que librement disposés » (chap. 15 ; voir [[g-un|Un]], [[g-necessaire|nécessaire]]).

    | Qui | Libre ? | Pourquoi |
    | l'enfant, l'animal, le fou | non | il est mené par le désir et la colère |
    | l'âme qui suit l'opinion droite | pas encore | elle peut avoir raison par hasard |
    | l'âme réglée sur l'Intellect | oui, en devenant | elle va au Bien sans obstacle |
    | l'Intellect | oui, par lui-même | son être et son acte ne font qu'un |
    | l'Un | plus que libre | il est son propre acte, et la loi des autres |

    ! La volonté de l'Un {pink}n'est pas une volonté au sens psychologique{/pink} : Plotin prévient qu'il parle de lui « en permettant une forme de relâchement de la pensée » ([[traite39|traité 39]], chap. 13), et il attribue ses actes « à ce qui est __comme sa volonté__ » (*ibid*.). Les mots de liberté, de volonté, de production de soi ne lui conviennent qu'au prix de ce « comme » : ils écartent la nécessité et le hasard plus qu'ils ne décrivent l'Un.

    ! La liberté de l'âme {pink}n'est pas une évasion hors de tout ordre{/pink} : l'âme libre est celle qui se règle sur l'Intellect, et l'Intellect, celui qui est tourné vers le Bien. Être libre, chez Plotin, c'est être soi-même, et l'on n'est soi-même qu'en allant à son bien.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 3, chap. 8 | sans le corps, l'âme est maîtresse d'elle-même |
    | traité 39, chap. 2-3 | ni le désir ni l'opinion droite : l'acte de l'intellect |
    | traité 39, chap. 4 | la servitude, ne pas aller à son bien ; l'Intellect libre |
    | traité 39, chap. 5-6 | la vertu, libre avant l'action ; un certain intellect |
    | traité 39, chap. 9-10 | l'Un, ni par hasard ni par nécessité ; la loi des autres |
    | traité 39, chap. 21 | pouvoir les contraires est une impuissance |

