id: traite41
title: "Traité 41 (IV, 6) : Sur la sensation et la mémoire"
subtitle: "Ni empreinte ni cachet"
icon: compass
color: sky
lessons:
- id: traite41-l1
  title: "La sensation, acte et non empreinte"
  notes: |-
    **Un appendice et une polémique** : le traité 41 prolonge les traités 27-29, *Sur les difficultés relatives à l'âme*. Il répond au premier chapitre du *De la mémoire et de la réminiscence* d'Aristote, pour qui la mémoire conserve une **empreinte** (`τύπος`) de la sensation, dans le corps et dans l'âme ; il vise aussi ceux qui font de l'âme un corps, les stoïciens surtout.

    **L'argument principal** (1, 1-11) : deux propositions solidaires. La sensation n'est pas une empreinte dans l'âme ; donc la mémoire ne consiste pas à conserver des empreintes. On ne peut accorder l'une sans l'autre.

    **La vision** (1, 11-40) : la sensation la plus claire est la vue. Nous voyons à distance, là où se trouve l'objet, en droite ligne : l'âme **regarde à l'extérieur**. Si elle avait en elle la forme de l'objet, comme la marque d'un cachet dans la cire, elle n'aurait pas besoin de regarder dehors ; elle ne pourrait dire la distance, ni la grandeur du ciel ; elle ne verrait que des images et des ombres. Un objet posé contre la pupille ne se voit pas : **ce qui voit et ce qui est vu doivent être deux**.

    **L'âme active** (chap. 2) : la puissance de l'âme n'est pas de subir, mais d'accomplir sa tâche ; il lui a été donné de **dominer et non d'être dominée**. Pour l'ouïe, il y a dans l'air un ébranlement façonné comme des lettres, et l'âme les **lit**. Pour le goût et l'odorat, la sensation est un jugement sur l'affection, distinct d'elle. La connaissance des intelligibles est plus impassible encore : ils jaillissent de l'intérieur.

    La sensation a un double statut : affection du composé de l'âme et du corps, et premier acte de pensée. Elle reçoit la forme de l'objet, sa raison, sans sa matière.

    ! Plotin ne nie pas toute empreinte : il y a bien un ébranlement dans l'air ; mais l'âme le lit, elle n'en est pas marquée.
