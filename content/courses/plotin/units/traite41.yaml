- id: traite41-l3
  title: "Repérage : le plan du traité 41"
  notes: |-
    **Le traité 41 traite de la sensation (chap. 1-2), puis de la mémoire (chap. 3).**

    | Moment | Lieu | Ce qui s'y joue |
    | la mémoire dépend de la sensation | 1, 1-11 | deux propositions solidaires |
    | la vision | 1, 11-40 | le cachet dans la cire |
    | la perception, un acte | 2, 1-9 | dominer, non être dominé |
    | les autres sens | 2, 10-19 | des lettres dans l'air |
    | sensibles et intelligibles | 2, 19-24 | jaillir de l'intérieur |
    | l'âme entre deux mondes | 3, 1-19 | grosse des sensibles |
    | le souvenir naît de la sensation | 3, 19-25 | les enfants |
    | contre les empreintes | 3, 25-59 | l'entraînement |
    | une aptitude de l'âme | 3, 60-78 | le pugiliste et le coureur |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! La sensation vient d'abord parce que tout en dépend : réfuter l'empreinte sensible, c'est déjà réfuter l'empreinte mnésique.
