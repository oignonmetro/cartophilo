- id: traite41-l2
  title: "La mémoire, une puissance"
  notes: |-
    **L'âme entre deux mondes** (3, 1-19) : l'âme est la raison de toutes choses, **la dernière des réalités intelligibles et la première de l'univers sensible**. Par l'un elle reçoit une vie nouvelle, par l'autre elle descend comme envoûtée. Elle connaît les intelligibles parce qu'elle les est obscurément ; elle produit les sensibles à ses propres yeux, comme **grosse** des sensibles.

    **Le souvenir naît de l'attention** (3, 19-25) : l'âme demeure dans la même disposition à l'égard d'un objet, d'autant plus que son attention fut intense. Les enfants se souviennent mieux : ils voient peu de choses et ne détournent pas leur attention.

    **Contre les empreintes** (3, 25-59) : si elles demeuraient, leur nombre ne réduirait pas les souvenirs ; on n'aurait pas à chercher pour se souvenir, ni à oublier avant de retrouver. **L'exercice renforce l'âme**, comme l'entraînement des bras et des jambes ; on se souvient parfois d'un coup, longtemps après. Si la mémoire était empreinte, ce qui subit le plus se souviendrait le mieux : c'est le contraire. Les gens âgés ont la sensation et la mémoire affaiblies : toutes deux sont une certaine **vigueur**.

    **Une aptitude** (3, 60-78) : il faut asseoir cette puissance et en faire une aptitude. Bonne mémoire et esprit vif vont rarement ensemble, comme le pugiliste et le coureur. L'âme, sans grandeur, est une puissance ; les hommes se la figurent comme des **lettres tracées sur des tablettes**, qu'ils la croient corps ou incorporelle.

    La mémoire relève de la représentation (`φαντασία`), entre la sensation et la réflexion. Elle n'a rien d'un dressage, comme les exercices du sophiste Hippias : c'est un acte de l'âme.

    ! Les défaillances de la mémoire ne sont pas des affections de l'âme : elles touchent le composé, et la faculté reste active.
