id: g-homoiosis
title: Assimilation (`homoiôsis`)
icon: book
color: teal
lessons:
- id: g-homoiosis-l1
  title: Assimilation
  notes: |-
    Chez Plotin, l'{violet}**assimilation**{/violet} (*homoiôsis*) au divin est [def]. Ce n'est pas {pink}le fait d'acquérir les vertus que le dieu posséderait{/pink}.

    __**Un mot de Platon, une difficulté.**__ Il faut fuir les maux d'ici-bas, et cette fuite consiste, dit Platon dans le *Théétète*, à se rendre semblable au dieu par la vertu. Mais le divin n'a ni à se maîtriser ni à être courageux : rien ne lui est redoutable ni désirable. Comment devenir semblable par la vertu à ce qui n'en a pas ? Plotin répond par l'image de la chaleur : un objet chauffé par le feu n'exige pas que le feu soit lui-même échauffé ([[traite19|traité 19]], chap. 1). **La vertu est en nous ce que son principe n'a pas besoin d'être.**

    __**Deux sortes de ressemblance.**__ « L'assimilation s'entend __de deux façons__ » (chap. 2) : entre deux termes devenus semblables à un même modèle, il y a la même forme ; mais quand l'un ressemble à l'autre, premier, la ressemblance n'est pas réciproque et exige « non pas la même forme mais plutôt __une forme différente__ dans les deux termes ». C'est la nôtre : nous ressemblons au divin, le divin ne nous ressemble pas.

    __**Les vertus civiques, une première ressemblance.**__ Elles imposent mesure aux désirs et aux passions ; elles sont « comme des mesures dans la matière qu'est l'âme » et « possèdent __la trace__ de l'excellence de là-bas » (chap. 2). Mais l'assimilation véritable passe par les vertus purificatrices (voir [[g-katharsis|purification]]) : « nous ne mettons pas notre zèle à être sans faute, mais __à être dieu__ » (chap. 6).

    __**Image d'une image, ou image du modèle.**__ Se régler sur l'homme de bien ne suffit pas : « l'assimilation à ces hommes-là, c'est comme celle qui existe __entre une image et une autre image__, toutes deux du même objet ; mais l'autre assimilation est celle qui se porte vers un être différent comme vers un modèle » (chap. 7).

    | Ressemblance | Ce qu'elle suppose |
    | entre deux images | la même forme, un même modèle |
    | de l'image au modèle | une forme différente, sans réciprocité |

    ! L'assimilation n'est pas l'identité : même purifiée, l'âme ressemble au divin sans qu'il lui ressemble, et la vertu reste le propre de l'âme.

    **Voir aussi** : [[g-katharsis|Purification]] · [[g-epistrophe|Conversion]] · [[g-eikon|Image]] · [[traite19|Traité 19]]
