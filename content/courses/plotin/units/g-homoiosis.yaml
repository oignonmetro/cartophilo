  points:
  - id: g-homoiosis-l1-q1
    sentence: "Le fait de devenir semblable au divin, que Plotin reprend au *Théétète*, se dit en grec translittéré ___."
    answer: homoiôsis
    alt: ["homoiosis", "homoíôsis"]
  - id: g-homoiosis-l1-q2
    sentence: "Le dialogue de Platon où la fuite d'ici-bas consiste à se rendre semblable au dieu est le ___."
    answer: Théétète
    alt: ["Theetete", "Théetète"]
  - id: g-homoiosis-l1-q3
    sentence: "Un objet chauffé par la présence du feu n'exige pas que le ___ soit lui-même échauffé : ainsi la vertu n'exige pas que le divin soit vertueux (traité 19, chap. 1)."
    answer: feu
    alt: []
  - id: g-homoiosis-l1-q4
    sentence: "« L'assimilation s'entend de deux ___ » (traité 19, chap. 2)."
    answer: façons
    alt: ["facons"]
  - id: g-homoiosis-l1-q5
    sentence: "Quand l'un des termes ressemble à l'autre, qui est premier, l'assimilation exige « non pas la même forme mais plutôt une forme ___ dans les deux termes » (traité 19, chap. 2)."
    answer: différente
    alt: ["differente"]
  - id: g-homoiosis-l1-q6
    sentence: "Les vertus civiques sont « comme des mesures dans la matière qu'est l'âme » et possèdent « la ___ de l'excellence de là-bas » (traité 19, chap. 2)."
    answer: trace
    alt: []
  - id: g-homoiosis-l1-q7
    sentence: "« Nous ne mettons pas notre zèle à être sans faute, mais à être ___ » (traité 19, chap. 6)."
    answer: dieu
    alt: []
  - id: g-homoiosis-l1-q8
    sentence: "« L'assimilation à ces hommes-là, c'est comme celle qui existe entre une image et une autre ___, toutes deux du même objet » (traité 19, chap. 7)."
    answer: image
    alt: []
