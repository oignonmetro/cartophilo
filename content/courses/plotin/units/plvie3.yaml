lessons:
- id: plvie3-l1
  title: "La vie comme conversion vers l'origine"
  notes: |-
    **Ce qui fait l'unité des sens de la vie** (biologique, éthique, vie de l'âme et de l'Intellect, éternité et temps) {coral}**est la centralité du mouvement**{/coral}**.** La vie est chez Plotin {amber}essentiellement dynamique{/amber}, et ce dynamisme est indissociablement celui de l'être lui-même.

    **Bergson l'avait vu dans ses cours sur Plotin** : le monde plotinien {red}n'est pas un monde de substances inertes reliées par des relations externes{/red}, mais {green}un univers traversé par le dynamisme des âmes{/green} et par l'élan des réalités engendrées qui se tournent vers leur origine.

    **Le dynamisme va dans les deux sens.** Il n'est pas seulement lié au déploiement de la multiplicité depuis l'unité, la {violet}procession{/violet} ; il exprime aussi, et fondamentalement, le retour, la {violet}conversion{/violet} ({blue}*epistrophè*{/blue}) de toute réalité engendrée vers son origine. C'est une des structures essentielles de cette philosophie : {amber}tout ce qui procède de l'Un tend à revenir vers lui{/amber}, par un mouvement qui est lui-même {coral}une forme de vie supérieure{/coral}.

    **La vie pense donc à la fois la descente et la remontée :**
    - dans la {violet}procession{/violet}, elle est {amber}la première détermination que l'Un confère à ce qu'il engendre{/amber} ;
    - dans la {violet}conversion{/violet}, elle est {amber}la force qui, en se retournant vers le principe, se détermine, se limite et se perfectionne{/amber}.

    **L'Intellect est la vie pleinement convertie**, devenue pensée de soi en se tournant vers l'Un. Cet acte de conversion est {teal}« {/teal}le premier {teal}des actes{/teal} et {teal}le plus beau »{/teal} (V, 3 [49], 5, 36).

    ! Revenir vers l'origine n'est pas s'y perdre ni annuler la procession : c'est par ce retour qu'une réalité devient elle-même.
