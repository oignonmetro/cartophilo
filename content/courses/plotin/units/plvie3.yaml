- id: plvie3-l2
  title: "La beauté n'est pas la proportion"
  notes: |-
    **Appeler la conversion de l'Intellect le plus beau des actes n'est pas une image rhétorique** : c'est toucher au rapport de la vie et du beau, l'un des points les plus importants du système. La vie de l'Intellect est belle, et {coral}c'est ce qui la rend désirable pour nous{/coral} ; chacune des réalités qui la constituent l'est aussi. {amber}Les Formes sont belles parce qu'elles sont des actes{/amber}, des réalités vivantes et contemplatives auxquelles rien ne manque.

    **Comme la vie dont il est l'expression, le beau a des degrés.** Son lieu propre est l'Intellect, mais une image du beau intelligible se donne à voir dans la beauté des corps. La contempler est une voie d'accès privilégiée : {coral}elle incite l'âme à désirer retrouver son origine véritable{/coral}, dans le sillage du discours de {sky}Diotime{/sky} ({sky}*Banquet*{/sky}, à partir de 201d). Encore faut-il définir correctement la beauté.

    **Le premier traité, *Sur le Beau* (I, 6 [1]), critique la définition** {sky}stoïcienne{/sky} **du beau comme** {violet}proportion{/violet} ({blue}*symmetria*{/blue}) des parties entre elles et par rapport au tout. C'est la définition commune, héritée du {sky}*Canon* de Polyclète{/sky} : être beau, c'est être bien proportionné.
    - {amber}Elle vaut pour les corps inertes{/amber}.
    - {red}Elle ne rend pas compte de toutes les choses belles{/red} : si la beauté ne consistait que dans la proportion des parties, {red}rien de simple ne pourrait être beau{/red}. Or le {yellow}soleil{/yellow} est beau, {yellow}une couleur pure{/yellow} est belle, {yellow}un son isolé{/yellow} peut être beau.

    **La raison de cette insuffisance** : la définition reste {red}prisonnière du modèle corporaliste{/red}, qui pense la beauté comme le résultat d'un arrangement harmonieux de parties déjà données. Pour Plotin, {green}la beauté véritable n'est pas l'effet d'une organisation externe, mais l'expression d'une unité intérieure{/green} : {coral}la trace d'une Forme vivante imprimée dans la matière{/coral}. Une réalité est belle quand la forme, donc l'unité et la vie qu'elle porte, {amber}dominent entièrement la matière{/amber}.

    **La vie l'emporte sur la proportion.** {yellow}Un homme vivant, même aux proportions irrégulières, est plus beau que la plus parfaite des statues{/yellow} (VI, 7 [38], 22) : toute vie, même imparfaite dans le sensible, est plus belle qu'un tracé inerte, si régulier soit-il, car {coral}la beauté vient d'un principe d'unité qui transcende la proportion des parties{/coral}.

    ! Plotin ne dit pas que la proportion enlaidit ou ne compte pour rien : elle ne suffit pas à faire la beauté.
