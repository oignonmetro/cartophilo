- id: plvie3-l4
  title: "Une unité de dérivation"
  notes: |-
    **Il existe bien une unité des sens de la vie chez Plotin, mais** {red}ce n'est ni celle d'un genre commun, ni celle d'une définition partagée{/red} : c'est {green}une unité de dérivation hiérarchique, une unité dans la différence{/green}, que désigne le terme d'{violet}homonymie{/violet}.

    **La vie exprime à chaque niveau l'identité de l'être et de l'activité**, selon une triple équivalence, tirée d'une lecture croisée du {sky}*Sophiste*{/sky} et du livre {sky}Λ{/sky} de la *Métaphysique*, qui structure tout le système : {amber}être, c'est être vivant{/amber} ; {amber}être actif, c'est penser{/amber} ; {amber}penser, c'est vivre{/amber}.

    | Niveau | Sa vie |
    | l'Intellect | auto-contemplation parfaite |
    | l'âme | image déployée de cette contemplation |
    | les corps | image encore plus distante, de l'âme |

    **À chaque niveau, la vie est ce qui** {violet}unifie{/violet} **un être** : ce qui fait que ses parties ne sont pas simplement juxtaposées, mais forment {coral}un tout organique{/coral}. Un {yellow}tas de pierres{/yellow} est un {red}agrégat{/red} ; un vivant est {green}un tout{/green}.

    **D'où un paradoxe : le concept de vie renvoie à la fois à la totalité et au mouvement.** La vie fait qu'un être est un tout et non un agrégat ; mais elle est aussi le mouvement par lequel cet être se constitue, se déploie et tend à revenir vers sa source. Les deux sont inséparables : {amber}c'est parce qu'un être est vivant qu'il est un tout, et c'est parce qu'il est un tout qu'il est vivant{/amber}. La vie est ainsi {coral}le nom du rapport entre l'un et le multiple, l'identité et la différence, l'être et l'activité{/coral}.

    **Le philosophe refait le chemin en sens inverse** : en contemplant la beauté sensible puis en remontant vers sa source intelligible, il parcourt à rebours la procession, et {amber}sa vie et sa pensée deviennent de plus en plus intenses{/amber} à mesure qu'il approche de l'origine.

    **Un vitalisme ontologique.** La philosophie de Plotin est non seulement un {violet}vitalisme{/violet}, comme l'avait remarqué {sky}Bergson{/sky}, mais {green}un vitalisme ontologique{/green} : {red}la vie n'est pas une propriété parmi d'autres des êtres naturels{/red}, mais {coral}la structure même de la réalité en tant qu'elle est, pense et tend vers son principe{/coral}. {yellow}Biologie, éthique, métaphysique, esthétique{/yellow} ne sont donc pas des domaines séparés que la notion de vie traverserait de l'extérieur : ce sont les expressions d'un seul dynamisme, dont {amber}l'Intellect est le foyer{/amber} et {amber}l'Un la source infinie{/amber}.
  points:
