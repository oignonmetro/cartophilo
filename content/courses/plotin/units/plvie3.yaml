- id: plvie3-l3
  title: "Les degrés du beau, trace de la vie"
  notes: |-
    **La beauté connaît des degrés qui correspondent aux degrés de la vie.**

    | Beauté | Ce qui la rend belle |
    | des corps | participer à la beauté de l'âme |
    | de l'âme | participer à la beauté de l'Intellect |
    | de l'Intellect | exprimer directement la puissance de l'Un |

    **La fin du traité *Sur le Beau* en décrit l'ascension** : de la beauté des {yellow}corps{/yellow} à celle des {yellow}actions vertueuses{/yellow}, de là à la beauté des {yellow}sciences et des arts{/yellow}, puis à la beauté de l'{violet}Intellect{/violet}, et enfin à la contemplation de l'{violet}Un{/violet} lui-même, {amber}principe ultime de toute vie{/amber}.

    **Le beau n'est donc pas un critère esthétique parmi d'autres.** {coral}Plus un être est vivant, plus il est beau, et plus il invite à chercher la source de sa vie.{/coral} Le beau est {violet}une propriété ontologique fondamentale{/violet} : {amber}la marque visible de la participation à la vie et, ultimement, à l'Un{/amber}.

    **La priorité passe de la proportion à l'unification.** Pour penser le beau, Plotin donne la priorité à {green}la dynamique de l'unification{/green} sur {red}l'équilibre de la proportion et de la symétrie{/red}. La causalité de la forme qui structure la matière, et qui s'exprime dans la beauté, est l'expression ultime de la causalité de l'Un.

    **L'Un est** {teal}« puissance de toutes choses »{/teal} (V, 4 [7], 2, 38 ; V, 1 [10], 7, 9-10 ; V, 3 [49], 15, 32-33) parce qu'il est {coral}la source de toute vie{/coral} ; et {coral}la vie est belle parce qu'elle porte en elle la trace de l'Un{/coral} et nous incite à le rejoindre. D'où deux formules liées : {amber}le beau est la trace de la vie, et la vie est la marque de l'Un{/amber}.
