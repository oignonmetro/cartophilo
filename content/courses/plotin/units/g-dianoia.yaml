  points:
  - id: g-dianoia-l1-q1
    sentence: "La pensée qui raisonne sur les empreintes venues de la sensation et de l'Intellect, que la GF rend par « réflexion » ou « pensée discursive », se dit en grec translittéré ___."
    answer: dianoia
    alt: ["diánoia"]
  - id: g-dianoia-l1-q2
    sentence: "La faculté rationnelle « soumet à examen les images qui se trouvent en elle et qui proviennent de la sensation, en mettant en œuvre division et ___ » (traité 49, chap. 2)."
    answer: rassemblement
    alt: []
  - id: g-dianoia-l1-q3
    sentence: "Ajuster les empreintes nouvelles à celles qui étaient en elle depuis longtemps, « c'est ce que nous pourrions qualifier de \"___\" en l'âme » (traité 49, chap. 2)."
    answer: réminiscences
    alt: ["reminiscences", "réminiscence"]
  - id: g-dianoia-l1-q4
    sentence: "« La sensation a vu un homme, et elle en a donné l'___ à la pensée discursive » (traité 49, chap. 3)."
    answer: empreinte
    alt: []
  - id: g-dianoia-l1-q5
    sentence: "Si la pensée discursive dit que Socrate est bon, « elle le tire déjà d'elle-même parce qu'elle a en elle-même un ___ du bien » (traité 49, chap. 3)."
    answer: critère
    alt: ["critere"]
  - id: g-dianoia-l1-q6
    sentence: "« Cette faculté discursive de l'âme, se tourne-t-elle elle aussi vers elle-même ? – Il faut répondre que ___ » (traité 49, chap. 2)."
    answer: non
    alt: []
  - id: g-dianoia-l1-q7
    sentence: "La pensée discursive sait « qu'il y a quelque chose qui lui est supérieur, qui ne cherche pas mais qui ___ déjà absolument » (traité 49, chap. 4)."
    answer: possède
    alt: ["possede"]
  - id: g-dianoia-l1-q8
    sentence: "La pensée discursive est une image de l'Intellect, « parce qu'elle a toutes choses comme ___ en elle-même » (traité 49, chap. 4)."
    answer: dessinées
    alt: ["dessinees"]
  - id: g-dianoia-l1-q9
    sentence: "« C'est nous-mêmes qui raisonnons et qui pensons les pensées mêmes qui sont dans la pensée discursive : cela, en effet, c'est ___ » (traité 49, chap. 3)."
    answer: nous
    alt: []
  - id: g-dianoia-l1-q10
    sentence: "De l'Intellect, Plotin dit : « il faut donc en conclure qu'il est nôtre et qu'il n'est pas ___ » : nôtre quand nous l'utilisons (traité 49, chap. 3)."
    answer: nôtre
    alt: ["notre"]
  - id: g-dianoia-l1-q11
    sentence: "Utiliser l'Intellect, ce n'est pas parler comme lui : « cela veut dire que nous sommes en ___ avec lui » (traité 49, chap. 3)."
    answer: accord
    alt: []
