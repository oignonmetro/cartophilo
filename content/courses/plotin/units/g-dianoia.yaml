# Entrée du glossaire de Plotin (skill glossaire), écrite le 2026-10-23 (elle
# était vide). Citations vérifiées sur la GF (V, 3, 2-4). La pensée de
# l'Intellect, qui ne raisonne pas, a son entrée (Pensée, noêsis) ; ce qu'est
# « nous » d'après le traité 53, la sienne (Nous).

id: g-dianoia
title: Réflexion (`dianoia`)
icon: book
color: teal
lessons:
- id: g-dianoia-l1
  title: Réflexion
  notes: |-
    Chez Plotin, la {violet}**réflexion**{/violet} ou « pensée discursive » (*dianoia*) est [def]. Elle n'est {pink}ni la sensation, qui ne fait que recevoir, ni l'Intellect, qui possède sans chercher{/pink} : elle est entre les deux, et c'est là que nous sommes.

    __**Une pensée qui travaille sur des**__ {violet}__**empreintes**__{/violet}__**.**__ La faculté rationnelle de l'âme « soumet à examen les images qui se trouvent en elle et qui proviennent de la sensation, en mettant en œuvre __division et rassemblement__ » ; et des choses qui viennent de l'Intellect, « elle en conserve aussi des sortes d'empreintes » ([[traite49|traité 49]], chap. 2). Pourquoi doit-elle aller pas à pas ? {coral}Parce qu'elle n'a pas les réalités elles-mêmes, mais leurs traces{/coral}, venues de deux côtés, qu'il lui faut ajuster les unes aux autres : elle accroît sa compréhension « en reconnaissant les empreintes nouvelles et récemment arrivées et __en les ajustant à celles qui étaient en elle depuis longtemps__ ». L'[[g-intellect|Intellect]], lui, est ce qu'il pense et n'a rien à assembler (voir [[g-noesis|pensée]]).

    __**Juger : la sensation donne, la réflexion dit.**__ « La sensation a vu un homme, et elle en a donné l'empreinte à la pensée discursive. » Celle-ci, d'abord, « ne dit toujours rien » ; puis elle se demande qui est cet homme et, par la mémoire, reconnaît Socrate. Mais « si elle dit que Socrate est bon », ce n'est plus la sensation qui le lui apprend : « elle le tire déjà d'elle-même parce qu'elle a en elle-même __un critère du bien__ » (chap. 3). Pourquoi ? {coral}Parce que les yeux voient un homme, jamais un bien{/coral} : la règle du jugement vient d'en haut, de « la forme du Bien » que l'Intellect a laissée en elle. **Juger, c'est appliquer au sensible une mesure venue de l'intelligible.**

    __**Elle ne se pense pas elle-même.**__ La faculté discursive se tourne-t-elle vers elle-même ? « __Il faut répondre que non__ » (chap. 2) : elle est faite pour examiner les choses extérieures, tandis qu'il revient à l'Intellect « d'examiner ce qui lui est propre et ce qui est en lui » (chap. 3). Elle sait pourtant son rang : elle sait « qu'il y a quelque chose qui lui est supérieur, qui ne cherche pas mais __qui possède déjà absolument__ », et qu'elle est une image de l'Intellect, « parce qu'elle a toutes choses comme dessinées en elle-même » (chap. 4).

    __**La réflexion, c'est nous.**__ Nous percevons par la sensation, mais ce n'est pas nous qui percevons ; en revanche, « c'est nous-mêmes qui raisonnons et qui pensons les pensées mêmes qui sont dans la pensée discursive : __cela, en effet, c'est nous__ » (chap. 3). Nous sommes ainsi l'intermédiaire entre la sensation, en bas, et l'Intellect, en haut. Et l'Intellect, « il faut donc en conclure qu'il est nôtre et qu'il n'est pas nôtre » : il est nôtre quand nous l'utilisons, c'est-à-dire, non quand nous parlons comme lui, mais quand « nous sommes __en accord avec lui__ » (voir [[g-hemeis|nous]]).

    | Faculté | Ce qu'elle fait | Comment elle tient son objet |
    | la sensation | reçoit les choses extérieures | du dehors, comme empreintes |
    | la réflexion | examine, divise, rassemble, juge | par empreintes, pas à pas |
    | l'Intellect | se pense lui-même | il le possède sans chercher |

    ! La « réflexion » qui traduit *dianoia* n'est pas un retour sur soi : la *dianoia*, précisément, ne se tourne pas vers elle-même. C'est l'Intellect qui se connaît ; elle, elle raisonne sur ce qu'elle reçoit.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 28, chap. 13 | la nature, son image la plus basse |
    | traité 49, chap. 2 | elle examine les empreintes, sans se tourner vers elle-même |
    | traité 49, chap. 3 | elle juge par un critère du bien ; elle, c'est nous |
    | traité 49, chap. 4 | elle se sait image de l'Intellect |

    **Voir aussi** : [[g-noesis|Pensée]] · [[g-hemeis|Nous]] · [[g-intellect|Intellect]] · [[g-aisthesis|Sensation]] · [[traite49|Traité 49]]
