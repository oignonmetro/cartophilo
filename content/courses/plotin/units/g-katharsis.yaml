  - id: g-katharsis-l1-q1
    sentence: "La séparation de l'âme d'avec ce qui lui est étranger, que Plotin identifie aux vertus elles-mêmes, se dit en grec translittéré ___."
    answer: katharsis
    alt: ["catharsis"]
  - id: g-katharsis-l1-q2
    sentence: "« L'âme est mauvaise tant qu'elle est ___ au corps, qu'elle subit les mêmes affections que lui et qu'elle forme ses opinions en tout d'après lui » (traité 19, chap. 3)."
    answer: entrelacée
    alt: ["entrelacee"]
  - id: g-katharsis-l1-q3
    sentence: "L'âme impure est « à l'image de l'or mélangé à du terreux » : « si on enlève la terre, il reste l'___ qui est beau » (traité 1, chap. 5)."
    answer: or
    alt: []
  - id: g-katharsis-l1-q4
    sentence: "« La tempérance, le courage, la vertu dans son ensemble et la réflexion même sont une ___ » (traité 1, chap. 6)."
    answer: purification
    alt: []
  - id: g-katharsis-l1-q5
    sentence: "Le dialogue de Platon d'où Plotin tire que les vertus sont des purifications est le ___."
    answer: Phédon
    alt: ["Phedon"]
  - id: g-katharsis-l1-q6
    sentence: "Vertu purificatrice : l'âme qui forme ses opinions par elle-même et non d'après le corps, « ce qui est précisément ___ et réfléchir » (traité 19, chap. 3)."
    answer: penser
    alt: []
  - id: g-katharsis-l1-q7
    sentence: "Vertu purificatrice : « si elle ne craint pas d'être ___ du corps – c'est être courageux » (traité 19, chap. 3)."
    answer: séparée
    alt: ["separee"]
  - id: g-katharsis-l1-q8
    sentence: "Les vertus civiques « imposent limite et ___ aux désirs et aux passions » (traité 19, chap. 2)."
    answer: mesure
    alt: []
  - id: g-katharsis-l1-q9
    sentence: "Pour le sage, « se maîtriser, par exemple, consistera non pas à s'imposer une mesure, mais fondamentalement à se ___ autant que possible du corporel » (traité 19, chap. 7)."
    answer: séparer
    alt: ["separer"]
  - id: g-katharsis-l1-q10
    sentence: "« Le bien sera ce qui reste après la purification, et ne sera pas la ___ elle-même » (traité 19, chap. 4)."
    answer: purification
    alt: []
  - id: g-katharsis-l1-q11
    sentence: "La purification ne suffit pas, car l'âme « est par nature tournée en deux ___ » (traité 19, chap. 4)."
    answer: directions
    alt: []
  - id: g-katharsis-l1-q12
    sentence: "L'âme purifiée garde les plaisirs nécessaires, « en les considérant seulement comme des sensations, des soins et des termes mis aux ___ » (traité 19, chap. 5)."
    answer: peines
    alt: []
  - id: g-katharsis-l1-q13
    sentence: "Une colère involontaire, l'âme purifiée se dit qu'elle « relève d'un autre ___ » (traité 19, chap. 5)."
