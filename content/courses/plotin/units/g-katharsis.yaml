# Entrée du glossaire de Plotin (skill glossaire), écrite le 2026-10-23 (elle
# était vide). Citations vérifiées sur la GF (I, 6, 5-6 ; I, 2, 3-7).
# L'union au Bien qui suit la purification (I, 2, 4) a ses cartes dans
# Conversion ; « être dieu » (I, 2, 6), dans Assimilation.

id: g-katharsis
title: Purification (`katharsis`)
icon: book
color: teal
lessons:
- id: g-katharsis-l1
  title: Purification
  notes: |-
    Chez Plotin, la {violet}**purification**{/violet} (*katharsis*) est [def]. Elle n'est {pink}ni une haine du corps ni la vertu tout entière{/pink} : elle retire ce qui est étranger à l'âme, et prépare le retournement vers l'Intellect.

    __**Pourquoi l'âme a besoin d'être purifiée.**__ L'âme n'est pas mauvaise par nature : elle l'est « tant qu'elle est __entrelacée au corps__, qu'elle subit les mêmes affections que lui et qu'elle forme ses opinions en tout d'après lui » ([[traite19|traité 19]], chap. 3). Le mal tient donc au **mélange** : {coral}l'âme, qui n'est pas un corps, vit alors une vie qui n'est pas la sienne{/coral}, et juge des choses par un autre qu'elle. D'où l'image du [[traite1|traité 1]] : l'âme impure est comme « un homme tombé dans la boue et la fange qui ne peut plus laisser voir la beauté qui est la sienne » ; {yellow}on ne la rend pas belle en lui ajoutant quelque chose, mais en ôtant ce qui la couvre{/yellow} : « si on enlève la terre, __il reste l'or__ qui est beau » (chap. 5).

    __**Les**__ {violet}__**vertus**__{/violet} __**sont des purifications.**__ Plotin reprend le *Phédon* : « la tempérance, le courage, la vertu dans son ensemble et la réflexion même __sont une purification__ » ([[traite1|traité 1]], chap. 6). Chaque vertu y change de sens. Puisque le mal de l'âme est de suivre le corps, sa vertu est d'**agir seule** : former ses opinions par elle-même, « ce qui est précisément __penser et réfléchir__ » ; « si elle cesse de partager ses passions », c'est se maîtriser ; « si elle ne craint pas __d'être séparée du corps__ », c'est être courageux ; et si la raison et l'intellect la dirigent, c'est la justice ([[traite19|traité 19]], chap. 3). **La vertu n'est plus l'ordre qu'on met dans ses passions, mais le retour de l'âme à elle-même.**

    | Vertu | Vertu civique | Vertu purificatrice |
    | réflexion | la partie raisonnante qui commande | l'âme qui pense seule, sans le corps |
    | maîtrise de soi | l'accord des désirs avec la raison | ne plus partager les passions du corps |
    | courage | la partie agressive qui ne craint pas | ne pas craindre d'être séparée du corps |
    | justice | chaque partie à sa tâche | la raison et l'intellect qui dirigent |

    __**Mesurer les passions, ou s'en séparer.**__ Pourquoi deux sortes de vertus ? Les vertus civiques « imposent limite et mesure aux désirs et aux passions » (chap. 2) : elles laissent l'âme mêlée au corps, mais y mettent de l'ordre. La vertu purificatrice va plus loin : pour le sage, « se maîtriser, par exemple, consistera __non pas à s'imposer une mesure__, mais fondamentalement à se séparer autant que possible du corporel » (chap. 7). C'est pourquoi seules les secondes rendent [[g-homoiosis|semblable au divin]] : le divin n'a pas de passions à mesurer.

    __**La purification n'est pas encore le bien.**__ La vertu est-elle dans le fait de se purifier, ou dans l'état de pureté qui en résulte ? La vertu « qui réside dans __le processus de purification__ » est moins achevée ; mais même l'état de pureté n'est que « la suppression de tout élément étranger », et « le bien sera ce qui reste après la purification, et __ne sera pas la purification elle-même__ » (chap. 4). Pourquoi ne suffit-elle pas ? Parce que l'âme purifiée n'est pas encore tournée vers le Bien : « elle est par nature __tournée en deux directions__ », vers le haut et vers le bas. Purifiée, il lui reste à se tourner vers ce qui lui est apparenté : c'est la [[g-epistrophe|conversion]].

    __**Jusqu'où va-t-elle ?**__ Il ne s'agit pas de mutiler le vivant. L'âme purifiée garde les plaisirs nécessaires, mais « en les considérant seulement comme des sensations, des soins et __des termes mis aux peines__ » ; une colère involontaire, elle se dit qu'elle « relève d'un autre être », le vivant, non d'elle (chap. 5). {yellow}La partie irrationnelle se règle sur elle comme celui qui vit « au voisinage d'un homme sage » et n'ose plus rien faire de ce qui lui déplaît{/yellow}. Le but n'est pas l'absence de faute, mais de vivre de la vie la plus haute (chap. 6).

    ! Se purifier n'est pas haïr le corps ni le fuir : c'est cesser de prendre ses affections pour les siennes. Le corps reste, soigné ; l'âme ne s'y confond plus.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 1, chap. 5 | ôter la terre, il reste l'or |
    | traité 1, chap. 6 | les vertus sont des purifications |
    | traité 19, chap. 3 | l'âme est mauvaise par mélange, bonne en agissant seule |
    | traité 19, chap. 4 | le bien est ce qui reste après la purification |
    | traité 19, chap. 7 | se séparer du corporel, non se mesurer |

    **Voir aussi** : [[g-homoiosis|Assimilation]] · [[g-epistrophe|Conversion]] · [[g-beaute|Beauté]] · [[g-vivant|Vivant]] · [[traite19|Traité 19]]
