# Unité de texte (voir content/textes.md) : Plotin, traité 6 (IV, 8), Sur la
# descente de l'âme dans les corps, chapitre 5, traduction GF (éd.
# L. Brisson et J.-F. Pradeau). Découpage seul : rappels et cartes à écrire.

id: "t6c5"
title: "La libre inclinaison de l'âme (6 [IV, 8], 5)"
subtitle: "Traité 6, Sur la descente de l'âme dans les corps, chapitre 5"
icon: "page"
color: "coral"
depth: "normale"
lessons:
- id: "t6c5-p1"
  title: "Descente, jugement, nécessité et volontaire"
  notes: ""
  passage:
    label: "l. 1-10"
    part: "Des expressions qui ne se contredisent pas"
    text: |-
      Il n'y a donc pas de contradiction entre ces expressions : l'ensemencement dans le devenir, la descente en vue de l'achèvement de l'univers, le jugement et la caverne, la nécessité et le volontaire, – puisque le volontaire est justement compris dans la nécessité – et le fait d'être dans le corps comme en quelque chose de mauvais ; ne sont pas non plus contradictoires l'exil loin du dieu, l'errance et la faute qui entraîne le jugement dont parle Empédocle, le repos dans l'exil évoqué par Heraclite, ni en général le caractère volontaire et, par ailleurs, le caractère involontaire de la descente.
  points: []
- id: "t6c5-p1b"
  title: "Vers le pire de son propre mouvement"
  notes: ""
  passage:
    label: "l. 1-10"
    part: "Des expressions qui ne se contredisent pas"
    text: |-
      Car certes toute chose va vers le pire involontairement, mais puisqu'elle y va cependant de son propre mouvement, on dit qu'en subissant l'influence de ce qui lui est inférieur, elle reçoit une condamnation conforme à ce qu'elle a fait.
  points: []
- id: "t6c5-p2"
  title: "Une loi éternelle de la nature"
  notes: ""
  passage:
    label: "l. 10-16"
    part: "Envoyée par un dieu"
    text: |-
      Mais, quand il est nécessaire en vertu d'une loi éternelle de la nature qu'elle subisse et produise ces réalités inférieures, elle qui s'unit au corps en descendant de ce qui est au-dessus de l'homme et en allant entièrement au-devant du besoin d'un autre, si l'on dit que c'est un dieu qui l'a envoyée, on ne sera en contradiction ni avec la vérité, ni avec soi-même. Car chaque chose, y compris les dernières, doit être rapportée au principe dont elle est issue, même si les intermédiaires sont nombreux.
  points: []
- id: "t6c5-p3"
  title: "Descendre, puis mal agir"
  notes: ""
  passage:
    label: "l. 16-24"
    part: "La double faute et son châtiment"
    text: |-
      Cependant, étant donné que la faute de l'âme est double, l'une concernant la cause de la descente, l'autre le mal qu'elle commet quand elle est arrivée ici-bas, le châtiment de la première faute est cela même qu'elle subit en descendant, celui de la seconde est de plonger moins profondément dans d'autres corps, et plus brièvement, en raison du jugement porté sur sa valeur – le mot de « jugement » montre en fait ce qui arrive par la loi divine –, mais une forme immodérée de mal entraîne un châtiment plus grand sous la surveillance de démons chargés de punir les fautes.
  points: []
- id: "t6c5-p4"
  title: "Le dieu de dernier rang"
  notes: ""
  passage:
    label: "l. 24-27"
    part: "Une libre inclinaison"
    text: |-
      Ainsi donc, bien qu'elle soit divine et qu'elle vienne des régions situées là-bas, l'âme se retrouve à l'intérieur du corps et cependant, puisqu'elle est le dieu de dernier rang, c'est par une libre inclinaison, et pour exercer sa puissance et mettre en ordre ce qui vient après elle qu'elle vient ici.
  points: []
- id: "t6c5-p5"
  title: "S'enfuir sans dommage, avoir connu le mal"
  notes: ""
  passage:
    label: "l. 27-37"
    part: "La puissance révélée par l'acte"
    text: |-
      Et certes si elle s'enfuit d'ici rapidement, elle ne subit aucun dommage, tout en ayant acquis la connaissance du mal et celle de la nature du vice et en ayant rendu visible ses puissances et fait apparaître des œuvres et des activités, qui, si elles étaient restées en repos dans l'incorporel, auraient existé en vain puisqu'elles ne seraient jamais parvenues à l'acte ; et l'âme elle-même aurait ignoré les choses qu'elle possède, puisqu'elles ne seraient même pas sorties pour se manifester.
  points: []
- id: "t6c5-p5b"
  title: "L'intériorité manifestée au dehors"
  notes: ""
  passage:
    label: "l. 27-37"
    part: "La puissance révélée par l'acte"
    text: |-
      Car l'acte révèle partout la puissance qui sans lui demeurerait totalement cachée, comme inapparente, et inexistante puisqu'elle n'aurait jamais d'existence réelle. Par conséquent chaque homme peut admirer l'intériorité des choses grâce à la variété des aspects extérieurs, et tirer la connaissance de cette intériorité de ce qu'elle a réalisé ces œuvres si délicates.
  points: []
