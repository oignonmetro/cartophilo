- id: traite16-l2
  title: "Quatre arguments contre le suicide"
  notes: |-
    **Plotin réfute sans exception tout motif de suicide, par quatre arguments successifs** :

    | Argument | Lieu | Ce qu'il dit |
    | la séparation naturelle | 1, 1-7 | l'âme doit attendre que le corps se sépare d'elle, quand l'**harmonie** qui les liait n'existe plus ; sinon elle part en emportant quelque chose |
    | la passion | 1, 7-14 | se tuer, c'est faire violence au corps, sous l'effet de **l'angoisse, douleur ou colère** |
    | le destin | 1, 15-17 | « le temps accordé à chacun est fixé par le destin » : le prévenir n'est pas une bonne chose |
    | le progrès | 1, 17-19 | le rang de chacun là-bas dépend de l'état dans lequel on sort de son corps |

    - **La mort naturelle est une séparation** (*Phédon*, 62a-e ; 67c-d) : l'âme attend que le corps se sépare entièrement d'elle ; elle n'a plus alors besoin de se déplacer, **puisqu'elle est toute à l'extérieur**.
    - **L'harmonie**, rapport numérique qui lie le corps à l'âme, est une idée d'origine néopythagoricienne.
    - Le **poison** ne présente rien de vraiment avantageux pour l'âme (1, 14-15).
    - **« Il ne faut pas se suicider tant que la possibilité de progresser existe »** (1, 18-19).

    **La folie** : il est peu probable qu'elle arrive au sage ; si elle lui arrivait, il rangerait le suicide **parmi les choses nécessaires**, à accepter dans certaines circonstances, non en général.

    **La réserve** : Plotin répète deux fois **« à moins que […] cela ne soit nécessaire »**, sans dire quand. Le traité 46 (I, 4), *Sur le bonheur* (chap. 7-8), évoque les prisonniers de guerre et les douleurs intolérables, sans donner de critère. Plutôt qu'une exception, une **marge de doute** sur une question aussi grave.

    ! L'âme qui se tue n'est pas libérée : elle part marquée par la passion qui lui a fait commettre ce geste.
