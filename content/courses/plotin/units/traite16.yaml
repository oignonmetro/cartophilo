id: traite16
title: "Traité 16 (I, 9) : Sur le suicide raisonnable"
subtitle: "Attendre que le corps se sépare"
icon: compass
color: sky
lessons:
- id: traite16-l1
  title: "Un suicide « raisonnable » ? Platon contre les stoïciens"
  notes: |-
    **Dans ce minuscule traité, Plotin s'interroge sur la légitimité du suicide** : peut-on lui reconnaître, dans certains cas, d'être **« raisonnable » (`eúlogos`)** ?

    **C'est une exhortation destinée à prévenir le suicide**, sur le ton d'une prédication morale et populaire en vogue à l'époque, surtout chez les stoïciens, pour démontrer une thèse unique : **refuser toute légitimité au suicide.**

    | Position | Thèse |
    | Platon, *Phédon* (61c-62c) | la mort volontaire est toujours « déraisonnable » (`álogon`) : seule la divinité décide de la durée de la vie |
    | les stoïciens | le suicide peut être « raisonnable » dans des cas extrêmes, notamment la **folie** : le sage y préserve la rigueur de sa conduite |

    Diogène Laërce (VII, 130) rapporte que, pour les stoïciens, le sage s'ôtera la vie pour sa patrie, pour ses amis, ou sous une douleur trop aiguë.

    **Le titre** : les manuscrits portent *Sur le suicide* ; **Porphyre**, dans la *Vie de Plotin*, le cite sous la forme *Sur le suicide raisonnable*, titre retenu par la traduction.

    **La première phrase est une citation** : « Tu n'expulseras pas ton âme du corps, pour éviter qu'elle ne sorte du corps ; car ainsi, elle partira en amenant quelque chose ». Psellus l'attribue aux *Oracles chaldaïques* : ce serait le seul recours identifiable à ces Oracles dans toute l'œuvre de Plotin.

    ! Plotin ne discute pas le suicide en moraliste du malheur : sa question est celle de l'état de l'âme au moment où elle quitte le corps.
