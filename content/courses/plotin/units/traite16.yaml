- id: traite16-l3
  title: "Repérage : le plan du traité 16"
  notes: |-
    **Le traité 16 tient en un seul chapitre de dix-neuf lignes, qui enchaîne les arguments.**

    | Moment | Lieu | Ce qui s'y joue |
    | la dissolution naturelle | 1, 1-7 | pour que l'âme soit vraiment libre |
    | les passions ; la folie du sage | 1, 7-14 | sauf nécessité |
    | le poison | 1, 14-15 | dangereux pour l'âme |
    | le destin | 1, 15-17 | ne pas prévenir le temps de la mort |
    | progresser | 1, 17-19 | l'état de l'âme à la séparation |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! Le traité finit sur l'argument le plus positif : employer le temps donné à progresser.
  points:
