- id: g-poros-et-penia-l1
  title: Poros et Pénia
  notes: |-
    Chez Plotin, {violet}**Poros et Pénia**{/violet} sont [def] : l'[[g-amour|amour]] démonique, né des deux, sait chercher mais ne peut jamais être comblé.

    __**L'allégorie.**__ Plotin lit le mythe de Diotime au [[traite50|traité 50]] (chap. 5-9). {yellow}**Poros**, l'Expédient{/yellow}, est le **principe rationnel**, les raisons qui descendent de l'Intellect dans l'âme ; {yellow}**Pénia**, la Pauvreté{/yellow}, est **l'indétermination**, la matière (chap. 7 et 9).

    __**D'où la nature double d'Éros.**__ Raison mêlée d'indétermination, il a {green}l'ingéniosité de la raison{/green} et {red}la maladresse de l'indigence{/red} : il sait chercher, mais ce qu'il reçoit ne le remplit pas, **parce que l'indéterminé en lui ne retient rien**. C'est un désir frénétique qui ne peut être comblé (chap. 7). La difficulté est de comprendre que ce manque n'est pas un accident : il tient à sa constitution même, et c'est lui qui le rend toujours tendu vers ce qu'il n'a pas.

    __**Le mythe raconte dans le temps ce qui est éternel.**__ « Poros est ivre de nectar, car __il n'y a pas encore de vin__ » (chap. 7) : le détail montre qu'Éros est né avant le sensible. **Les mythes morcellent en moments successifs ce qui est ensemble** (chap. 9) ; à qui les comprend de les réassocier. Lire le mythe, c'est donc retrouver une structure, non une histoire.

    __**L'amour vrai et l'amour faux.**__ Les amours conformes à la nature relèvent de la réalité véritable ; {red}les amours contre nature ne sont que des affects, sans réalité{/red} (chap. 7).

    ! Pénia n'est pas le mal moral : c'est l'indétermination qui fait d'Éros un démon toujours en manque.

    **Voir aussi** : [[g-amour|Amour]] · [[g-amant|Amant]] · [[traite50|Traité 50]]
