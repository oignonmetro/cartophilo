- id: traite27-l5
  title: "La descente des âmes humaines"
  notes: |-
    **Les âmes humaines descendent, mais sans se séparer de leur principe** (chap. 12) : elles aperçoivent leur image **« comme si c'était dans le miroir de Dionysos »** et s'élancent ; mais **leur tête est restée solidement fixée en haut dans le ciel**. Zeus, compatissant, leur accorde des périodes de repos sans corps. Leurs descentes s'accordent avec la révolution du monde, **comme un chœur** qui chante d'une seule voix.

    **Une loi inscrite en elles** (chap. 13) : chaque âme va vers le corps qui correspond à sa disposition, sans qu'on l'envoie : quand le moment est venu, elle descend **comme à l'appel d'un héraut**. Elle ne vient ni de son plein gré, au sens d'un choix, ni envoyée : c'est comme un bond naturel.

    **Le mythe de Pandore** (chap. 14) : Prométhée façonne la femme, et tous les dieux lui font un don ; ainsi le monde est embelli par les âmes. Qu'Épiméthée refuse le don signifie **qu'il vaut mieux choisir la vie dans l'intelligible**.

    **Les niveaux de descente** (chap. 15-17) :

    - les âmes passent d'abord **par le ciel**, où elles prennent un corps ; certaines restent soumises à la fatalité, d'autres gardent la maîtrise d'elles-mêmes ;
    - **les maux des gens de bien** (chap. 16) ne sont pas voulus par l'ordre du monde, ils le suivent : si une maison s'écroule, l'homme qui est dessous périt, bon ou mauvais. L'injustice reste une injustice pour qui la commet ;
    - **les cercles de lumière** (chap. 17) : un centre lumineux, des cercles, puis une sphère obscure qu'il faut éclairer. Les âmes trop occupées de leur corps sont comme **des pilotes** qui, dans la tempête, se négligent eux-mêmes pour leur bateau.

    **Le raisonnement** (chap. 18) : **« avoir besoin du raisonnement, c'est la marque d'un amoindrissement de l'intellect »**. Là-bas, les âmes n'ont pas besoin de paroles : **chacun est comme un œil**.

    ! La descente n'est pas une chute totale : par sa tête, l'âme humaine reste toujours attachée à l'Intellect.
