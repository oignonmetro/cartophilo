- id: traite27-l8
  title: "Repérage : le plan du traité 27"
  notes: |-
    **Le traité 27 couvre les trois premières sections de l'ensemble : l'unité des âmes (chap. 1-8), l'âme et le corps (chap. 9-24), le début de la mémoire (chap. 25-32).**

    | Moment | Lieu | Ce qui s'y joue |
    | trois raisons d'étudier l'âme | 1, 1-16 | se connaître soi-même |
    | les cinq arguments des stoïciens | 1, 16-37 | nos âmes, parties de l'âme du monde ? |
    | le sens de « partie » | chap. 2 | le théorème et la science |
    | l'âme dans le doigt | chap. 3 | une seule et même âme partout |
    | une âme qui reste en elle-même | chap. 4-5 | l'arbre, les vers, l'agriculteur |
    | pourquoi l'âme du monde produit | chap. 6 | elle est restée là-bas |
    | Philèbe, Timée, Phèdre | chap. 7 | l'âme qui a perdu ses ailes |
    | les différences entre les âmes | chap. 8 | on devient ce qu'on contemple |
    | l'âme du monde et son corps | chap. 9-11 | le filet dans la mer ; les temples |
    | la descente des âmes humaines | chap. 12-17 | la tête fixée en haut ; le héraut |
    | le raisonnement | chap. 18 | un amoindrissement de l'intellect |
    | indivisible et divisible | chap. 19 | une lecture du Timée |
    | ni lieu, ni vase, ni pilote | chap. 20-21 | où est l'âme ? |
    | la lumière dans l'air | chap. 22 | le corps est dans l'âme |
    | les facultés et les organes | chap. 23 | cerveau, foie, cœur |
    | la sortie du corps | chap. 24 | en dieu |
    | la mémoire, hors de l'Intellect et du composé | chap. 25-26 | le Léthé |
    | deux âmes, deux mémoires | chap. 27-28 | l'image d'Héraclès |
    | la représentation | chap. 29-31 | le concept comme dans un miroir |
    | l'âme bonne est oublieuse | chap. 32 | fuir le multiple |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! La mémoire n'est pas achevée au chapitre 32 : le traité 28 (IV, 4) continue la même recherche.
