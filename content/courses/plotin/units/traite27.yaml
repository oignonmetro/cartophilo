- id: traite27-l3
  title: "L'âme du monde et ses sœurs"
  notes: |-
    **Pourquoi l'âme du monde a-t-elle produit le monde, et non nos âmes, qui sont de même espèce ?** (chap. 6)

    - L'âme du monde **n'a pas quitté l'âme totale** : elle est restée là-bas et garde son corps autour d'elle ; les autres âmes ont reçu une part d'un corps qui existait déjà, comme si l'âme du monde, **« pour ainsi dire leur sœur »**, leur avait préparé des demeures.
    - Elle contemple l'Intellect tout entier, les autres surtout leurs intellects partiels. **Elle produit en restant auprès d'elle-même**, et ses produits s'approchent d'elle ; les autres âmes s'avancent vers ce qu'elles produisent, et descendent.

    **Les passages de Platon** (chap. 7) : le *Philèbe* veut seulement montrer que le monde a une âme ; le *Timée* fait les autres âmes du même mélange, mais avec des ingrédients de second et de troisième rang ; le *Phèdre* distingue de l'âme du monde **« l'âme qui a perdu ses ailes »**. Et si nous sommes affectés par la révolution du ciel, une autre âme en nous **résiste** à ces influences ; l'âme de l'embryon vient de l'extérieur, non de la mère.

    **Les différences entre les âmes** (chap. 8) : par leurs corps, mais surtout par leurs caractères, leur raison discursive et leurs vies antérieures. Toutes sont toutes choses, mais **« une âme est et devient ce que précisément elle contemple »** (8, 15-16).

    - **La sympathie** entre les âmes vient de ce qu'elles viennent toutes de la même Âme.
    - Le nombre des âmes est **fixe** ; l'âme est illimitée par sa **puissance**, non parce qu'elle serait divisible à l'infini. Dans une plante coupée, elle est à la fois dans la plante et dans la partie coupée.

    ! L'âme du monde n'est pas la mère de nos âmes : c'est une sœur, issue de la même Âme, qui a seulement produit la première.
