- id: traite27-l7
  title: "La mémoire appartient à la représentation"
  notes: |-
    **Qu'est-ce qui se souvient ?** (chap. 25) La mémoire suppose une acquisition et le temps.

    | Qui ? | Mémoire ? |
    | l'Intellect, l'être | non : il est dans l'éternité, rien ne lui vient de l'extérieur |
    | le composé, le vivant | non : sentir est une « œuvre commune », mais se souvenir relève de l'âme (chap. 26) |
    | la faculté désirante | non : elle garde une disposition, non un souvenir (chap. 28) |
    | la faculté de représentation | oui (chap. 29) |

    **Se souvenir, c'est autre chose qu'intelliger** (25, 24). Les « réminiscences » des anciens nomment une autre mémoire, hors du temps : l'âme amène à l'acte ce qu'elle possède.

    - **Les impressions ne sont pas des empreintes** dans la cire (chap. 26) : le processus s'apparente à une intellection. C'est le corps, qui s'écoule, qui cause l'oubli : d'où **le fleuve du Léthé**.
    - **Deux âmes, deux mémoires** (chap. 27) : l'âme divine, par laquelle nous sommes ce que nous sommes, et celle qui nous vient de l'univers. **L'image d'Héraclès** dans l'Hadès se souvient de tous ses actes ; le véritable Héraclès, Homère ne dit pas ce qu'il dit.
    - **Le chien et le loup** (chap. 28) : la vue voit l'injuste, la faculté agressive s'insurge, comme le chien d'un berger excité par l'odeur d'un loup qu'il n'a pas vu.
    - **La mémoire appartient à la faculté qui produit des représentations** (chap. 29) : ce qui a été vu y reste présent. Les notions s'y gardent par le discours qui les déploie et fait apparaître le concept **comme dans un miroir** (chap. 30).
    - **Les deux représentations** (chap. 31) s'accordent : l'une accompagne l'autre **à la façon d'une ombre**.

    **L'âme bonne est oublieuse** (chap. 32) : l'homme de qualité se souvient sans être affecté ; plus l'âme monte, plus elle oublie, car elle fuit le multiple vers l'un. Héraclès, dans l'intelligible, juge peu de chose sa bravoure.

    ! L'oubli n'est pas une faiblesse de l'âme bonne : se soustraire aux souvenirs d'ici-bas fait partie de sa remontée.
