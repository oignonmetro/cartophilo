id: traite27
title: "Traité 27 (IV, 3) : Sur les difficultés relatives à l'âme I"
subtitle: "L'âme une et multiple, le corps, la mémoire"
icon: compass
color: sky
lessons:
- id: traite27-l1
  title: "Un traité « Sur l'âme » : l'ensemble des traités 27 à 29"
  notes: |-
    **Les traités 27, 28 et 29 forment un seul ensemble, « un et multiple », comme l'âme elle-même** : *Sur les difficultés relatives à l'âme*. Porphyre l'a coupé en trois traités, sous un même titre ; ses coupures et ses résumés ajoutés au texte (comme en 5, 15-20) sont bien visibles.

    **Au cœur de l'œuvre** :

    - au juste milieu des cinquante-quatre traités ;
    - rédigés entre 263 et 268, peut-être en 264, quand Porphyre était à Rome auprès de Plotin. Porphyre rapporte qu'il l'interrogea trois jours de suite sur l'union de l'âme et du corps (*Vie de Plotin*, 13) ;
    - l'exposé le plus complet de la « psychologie » plotinienne, et **le plus long des essais philosophiques anciens consacrés à l'âme** qui nous soient parvenus.

    **Six sections**, qui passent d'un traité à l'autre :

    | Section | Où |
    | l'âme est-elle une ou multiple ? | traité 27, chap. 1-8 |
    | l'entrée de l'âme dans le corps, et leurs rapports | traité 27, chap. 9-24 |
    | la mémoire | traité 27, chap. 25, à traité 28, chap. 17 |
    | l'influence des astres | traité 28, chap. 30-45 |
    | l'intermédiaire de la perception | traité 29, chap. 1-5 |
    | questions diverses | traité 29, chap. 6-8 |

    Toutes ces difficultés reviennent à une seule question : **comment l'âme, pourtant « impassible », est-elle affectée par ce qui l'entoure ?**

    **Trois raisons d'étudier l'âme** (chap. 1, 1-16) : connaître les choses dont l'âme est le principe et celles dont elle provient ; obéir au dieu qui nous invite à nous connaître nous-mêmes ; connaître le sujet même de la recherche.

    **L'arrière-plan polémique** : une discussion critique des prédécesseurs, surtout d'**Alexandre d'Aphrodise**, l'aristotélicien, et des **stoïciens**, pour qui le `λόγος` qui façonne la matière reste corporel.

    ! Ces trois traités ne suivent pas un argument unique : ce sont des cours, qui passent d'une difficulté à une autre parfois sans transition.
