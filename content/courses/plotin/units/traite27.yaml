- id: traite27-l4
  title: "L'âme du monde produit son corps sans descendre"
  notes: |-
    **L'entrée de l'âme dans le corps** (chap. 9) se fait de deux manières : passer d'un corps d'air ou de feu à un corps de terre, ou venir pour la première fois, depuis l'incorporel, dans un corps.

    **Pour l'âme du monde, « entrée » et « animation » sont des mots employés « dans un but d'enseignement et de clarté »** : jamais le monde n'a été sans âme, ni la matière sans ordre.

    - L'âme procède en s'engendrant un lieu, un corps : comme une forte lumière qui se change en obscurité aux confins ; l'âme a informé cette obscurité.
    - **Le monde a une âme qu'il ne possède pas** : il est dans l'âme qui le soutient, comme **un filet jeté dans l'eau**, qui s'étend aussi loin que la mer, mais ne peut la retenir.

    **La nature, non la technique** (chap. 10) : l'âme produit sans délibération, comme les raisons des semences façonnent les vivants. **« La technique vient après la nature et elle l'imite »**, en produisant des jouets sans force. La puissance de l'âme est **double** : l'une reste en elle, l'autre sort vers autre chose. La nature (`φύσις`), ultime puissance de l'âme du monde, produit jusqu'à la matière, « dernières lueurs » du feu.

    **Les temples et les statues** (chap. 11) : les sages anciens ont compris qu'il est aisé d'attirer l'âme dans ce qui l'imite, **« à la manière d'un miroir capable d'attraper une forme »**. L'Intellect est le soleil de là-bas ; l'Âme, suspendue à lui, joue le rôle d'**un interprète** entre lui et le soleil sensible. Les corps célestes sont des dieux, qui ne regardent que vers l'Intellect.

    ! L'âme du monde ne descend pas dans son corps : c'est le corps qui est en elle, et elle le gouverne en restant là-haut.
