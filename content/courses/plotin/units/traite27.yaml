- id: traite27-l6
  title: "Où est l'âme ? Comme la lumière dans l'air"
  notes: |-
    **L'indivisible et le divisible** (chap. 19) : Platon dit l'âme indivisible sans qualification, mais elle **« devient divisible dans les corps »** : la faculté sensitive, partout tout entière, n'est pas purement et simplement divisée. Le raisonnement et l'intellect ne se donnent pas au corps, qui est pour eux un obstacle.

    **L'âme n'est pas dans le corps comme...** (chap. 20-21)

    | Comme... | Pourquoi non |
    | dans un lieu | le lieu contient un corps ; l'âme n'est ni contenue ni contenante |
    | dans un vase | ce que le vase recevrait serait autant de perdu pour l'âme |
    | dans un substrat | ce qui est dans un substrat en est une affection ; l'âme est séparable |
    | une partie dans un tout | l'âme n'est pas une partie du corps |
    | la forme dans la matière | la forme est inséparable de la matière ; c'est l'âme qui la produit |
    | le pilote dans le navire | il dit bien que l'âme est séparable, mais pas comment elle est présente |

    Nous disons l'âme dans le corps parce que **le corps est visible et l'âme ne l'est pas**.

    **La réponse** (chap. 22) : l'âme est présente au corps **comme le feu, ou la lumière, dans l'air** : présente sans être présente, sans s'y mélanger. **L'air est dans la lumière, plutôt que la lumière dans l'air** ; Platon a donc raison de mettre **non pas l'âme dans le corps, mais le corps dans l'âme**.

    **Les facultés et les organes** (chap. 23) : l'âme donne à chaque organe la faculté qui convient à son activité. Le point de départ de la sensation et de l'impulsion est dans **le cerveau**, d'où partent les nerfs ; le désir réside près du **foie**, source du sang ; l'agressivité dans **le cœur**.

    **La sortie du corps** (chap. 24) : l'âme insensée emporte quelque chose qui l'attire ; la justice la conduit sans qu'elle le sache vers le lieu de son châtiment. Les âmes pures sont **là où sont la réalité, l'être et le divin** : ne les cherche pas avec les yeux, comme des corps.

    ! Ce n'est pas l'âme qui est dans le corps, c'est le corps qui est dans l'âme : l'âme n'est en aucun lieu.
