- id: traite27-l2
  title: "Nos âmes ne sont pas des parties de l'âme du monde"
  notes: |-
    **Thèse des chapitres 1 à 5 : nos âmes ne sont pas des parties de l'âme du monde.** Plotin réfute les **cinq arguments** de ceux, stoïciens surtout, qui le soutiennent (1, 16-37) : nos âmes sont de même espèce que l'âme du monde ; notre corps est une partie du corps du monde, donc notre âme de son âme (Platon, *Philèbe*) ; nous suivons la révolution du monde ; nous participons de son âme comme nos membres de notre âme ; et « tout ce qui est âme a charge de tout ce qui est dépourvu d'âme » (*Phèdre*).

    **Qu'est-ce qu'une « partie » ?** (chap. 2)

    | Sens de « partie » | Pourquoi il ne convient pas à l'âme |
    | la masse d'un corps | la blancheur d'une goutte de lait est « la blancheur d'une portion et non une portion de la blancheur » |
    | une unité d'un nombre, une portion de figure | l'âme serait une quantité, plus grande ou plus petite |
    | un théorème dans une science | la science reste entière en chacun : c'est le seul sens recevable |

    D'où la thèse : **« chaque âme est toute âme »** (2, 4). Et l'âme dont toutes dépendent n'est l'âme de rien en particulier : **pas même l'âme du monde**, qui n'est qu'une des âmes particulières.

    **La solution** (chap. 4) : une seule et même âme **reste en elle-même** sans tomber dans un corps ; d'elle viennent toutes les âmes, celle du monde et les nôtres, qui se projettent ici ou là comme **la lumière**, partagée sans être divisée.

    - La partie inférieure de l'âme du monde est comme l'âme d'un **arbre gigantesque**, qui l'organise sans effort ni bruit ; la partie inférieure de notre âme, comme **des vers** nés dans une partie pourrie de l'arbre ; le reste de notre âme, comme **un agriculteur** préoccupé par ces vers.
    - **Socrate ne périt pas** (chap. 5) : « aucune des réalités véritables ne périt ». Les âmes restent distinctes, comme les intellects là-bas.

    ! Dire que toutes les âmes n'en font qu'une ne revient pas à en faire des parties de l'âme du monde : l'âme du monde est elle-même l'une d'elles.
