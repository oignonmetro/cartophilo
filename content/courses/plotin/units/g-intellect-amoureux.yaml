  - id: g-amant-l5-q1
    sentence: "« La première puissance est la contemplation de l'Intellect qui pense, tandis que la seconde c'est l'Intellect qui ___, quand l'Intellect devient insensé, et qu'il est \"ivre de nectar\" » (traité 38, chap. 35, l. 23-26)."
    answer: aime
    alt: []
  - id: g-amant-l5-q2
    sentence: "« La seconde c'est l'Intellect qui aime, quand l'Intellect devient ___, et qu'il est \"ivre de nectar\" ; c'est alors que l'Intellect devient amant » (traité 38, chap. 35, l. 23-26)."
    answer: insensé
    alt: ["insense"]
  - id: g-amant-l5-5
    sentence: "Quand il aime, l'Intellect devient insensé et « ivre de ___ » (traité 38, chap. 35)."
    answer: nectar
    alt: []
  - id: g-amant-l5-9
    sentence: "Des deux puissances de l'Intellect (traité 38, chap. 35), la première est l'Intellect qui pense ; la seconde, qui aime ce qui le dépasse, est l'Intellect ___ (*noun erônta*)."
    answer: amant
    alt: ["amoureux"]
  - id: g-amant-l5-q3
    sentence: "« Pour lui, être ivre d'une telle ivresse c'est mieux que de rester décent en étant ___ » (traité 38, chap. 35, l. 26-27)."
    answer: sobre
    alt: []
  - id: g-amant-l5-q4
    sentence: "L'ivresse de l'Intellect amant vaut mieux que la sobriété parce que la pensée garde la ___ de ce qui pense et de ce qui est pensé, alors que l'amour s'unit au Bien, qui est un."
    answer: dualité
    alt: ["dualite"]
