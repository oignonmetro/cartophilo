# Entrée du glossaire de Plotin (skill glossaire), sous-entrée de g-intellect, 2026-10-21.
# Tirée des anciennes fiches Amour et Amant (une leçon par entrée) ; les
# cartes reprises gardent leur identifiant. Citations vérifiées sur la GF.

id: g-intellect-amoureux
title: Intellect amoureux
subtitle: La seconde puissance de l'Intellect, ivre de nectar, par laquelle il s'unit au Bien au-delà de la pensée
icon: book
color: coral
lessons:
- id: g-intellect-amoureux-l1
  title: Intellect amoureux
  notes: |-
    Chez Plotin, l'{violet}**Intellect amoureux**{/violet} est la seconde puissance de l'[[g-intellect|Intellect]] : non plus {pink}la pensée qui contemple ce qui est en lui{/pink}, mais l'{green}amour par lequel il s'unit au Bien{/green}, au-delà de la pensée.

    __**Deux puissances de l'Intellect.**__ « La première puissance est la contemplation de l'Intellect qui pense, tandis que la seconde c'est __l'Intellect qui aime__, quand l'Intellect devient insensé, et qu'il est "ivre de nectar" ; c'est alors que l'Intellect devient amant » ([[traite38|traité 38]], chap. 35). Et « pour lui, être ivre d'une telle ivresse c'est __mieux que de rester décent en étant sobre__ ».

    __**Pourquoi l'ivresse vaut mieux que la sobriété.**__ C'est la difficulté du passage : comment un Intellect « insensé » pourrait-il être supérieur à l'Intellect qui pense ? Parce que {pink}la pensée garde toujours la dualité de ce qui pense et de ce qui est pensé{/pink} : elle ne peut donc atteindre le Bien, qui est un. {green}L'amour, lui, ne vise pas un objet : il s'unit{/green}. L'« insensé » ne désigne donc pas une perte de raison, mais le dépassement de la pensée par ce qui la fonde.

    __**Se dépouiller de toute forme.**__ Pour recevoir le Bien, qui est sans forme, l'âme se défait de toute forme ; il apparaît « soudain », et ils ne sont plus deux (chap. 34). {yellow}Celui qui entre dans une maison richement ornée admire d'abord les ornements ; dès qu'il voit le maître de maison, il les oublie{/yellow} (chap. 35).

    __**Toute âme est Aphrodite.**__ L'âme aime le Bien d'un amour inné : « __Toute âme est Aphrodite__ » ([[traite9|traité 9]], chap. 9). Égarée ici-bas en de fausses amours, comme une jeune fille trompée par des promesses de mariage, elle doit revenir à l'amour pur, celui d'une {yellow}vierge pour son père{/yellow}.

    ! Le sommet n'est pas la pensée la plus haute : l'Intellect amoureux dépasse l'Intellect qui pense, et c'est par lui que se fait l'[[g-henosis|hénose]].

    **Voir aussi** : [[g-intellect|Intellect]] · [[g-henosis|Hénose]] · [[g-amant|Amant]] · [[g-amour|Amour]] · [[traite38|Traité 38]]
