  notes: ""
  passage:
    label: "l. 7-32"
    part: "La statue intérieure et l'œil qui voit le beau"
    text: |-
      Et si cet œil arrive jusqu'à cette contemplation alors qu'il est chassieux à cause des vices, impur ou faible, n'étant pas du tout capable, à cause de sa lâcheté, de voir les splendeurs, il ne verra rien, pas même si un autre lui montre ce qui est là et qui peut être vu. Celui qui voit, en effet, doit s'être rendu apparenté et semblable à ce qui est vu, pour parvenir à la contemplation. Assurément, jamais l'œil ne verrait le soleil sans être devenu de la même nature que le soleil, et l'âme ne pourrait voir le beau, sans être devenue belle.
