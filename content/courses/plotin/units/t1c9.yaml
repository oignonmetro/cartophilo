- id: "t1c9-p1c"
  title: "Devenir une vision"
  notes: ""
  passage:
    label: "l. 7-32"
    part: "La statue intérieure et l'œil qui voit le beau"
    text: |-
      Si tu deviens cela, tu pourras te voir. Étant devenu une vision, aie confiance en toi, car, même ici-bas, tu es dès à présent parvenu à monter et tu n'as plus besoin qu'on te montre le chemin ; le regard tendu, vois ! C'est lui, en effet, ce regard, le seul œil qui puisse voir la grandeur du beau.
