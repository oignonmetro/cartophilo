id: "t1c9"
title: "La statue intérieure (1 [I, 6], 9)"
subtitle: "Traité 1, Sur le beau, chapitre 9, l. 7-43"
icon: "page"
color: "coral"
depth: "allegee"
lessons:
- id: "t1c9-p1"
  title: "Sculpter sa propre statue"
  notes: ""
  passage:
    label: "l. 7-32"
    part: "La statue intérieure et l'œil qui voit le beau"
    text: |-
      Retourne en toi-même et vois. Et si tu ne vois pas encore ta propre beauté, fais comme le fabriquant qui doit rendre une statue belle : il enlève ceci, efface cela, polit et nettoie jusqu'à ce qu'une belle apparence se dégage de la statue ; de même pour toi, enlève le superflu, redresse ce qui est tordu et, purifiant tout ce qui est ténébreux, travaille à être resplendissant. Ne cesse de sculpter ta propre statue jusqu'à ce que brille en toi la splendeur divine de la vertu et que tu voies la tempérance qui siège sur son « auguste trône ».
  points: []
- id: "t1c9-p1b"
  title: "Devenir une unique et authentique lumière"
  notes: ""
  passage:
    label: "l. 7-32"
    part: "La statue intérieure et l'œil qui voit le beau"
    text: |-
      Si tu es devenu cela et que tu te vois dans une telle disposition, alors tu es devenu pur et il n'y a plus aucun obstacle qui s'opposerait à devenir ainsi un ; tu n'as plus dans ton rapport à toi-même un autre élément qui se mélange à toi, mais tu seras devenu alors entièrement une unique et authentique lumière ; elle n'est pas mesurée par une grandeur ou un contour qui en limiterait l'éclat en l'amoindrissant ou, au contraire, par son illimitation, en pourrait augmenter l'ampleur : elle est absolument sans mesure, comme peut l'être ce qui est plus grand que toute mesure et supérieur à toute quantité.
  points: []
- id: "t1c9-p1c"
  title: "Devenir une vision"
  notes: ""
  passage:
    label: "l. 7-32"
    part: "La statue intérieure et l'œil qui voit le beau"
    text: |-
      Si tu deviens cela, tu pourras te voir. Étant devenu une vision, aie confiance en toi, car, même ici-bas, tu es dès à présent parvenu à monter et tu n'as plus besoin qu'on te montre le chemin ; le regard tendu, vois ! C'est lui, en effet, ce regard, le seul œil qui puisse voir la grandeur du beau.
  points: []
- id: "t1c9-p1d"
  title: "Se rendre semblable à ce qu'on voit"
  notes: ""
  passage:
    label: "l. 7-32"
    part: "La statue intérieure et l'œil qui voit le beau"
    text: |-
      Et si cet œil arrive jusqu'à cette contemplation alors qu'il est chassieux à cause des vices, impur ou faible, n'étant pas du tout capable, à cause de sa lâcheté, de voir les splendeurs, il ne verra rien, pas même si un autre lui montre ce qui est là et qui peut être vu. Celui qui voit, en effet, doit s'être rendu apparenté et semblable à ce qui est vu, pour parvenir à la contemplation. Assurément, jamais l'œil ne verrait le soleil sans être devenu de la même nature que le soleil, et l'âme ne pourrait voir le beau, sans être devenue belle.
  points: []
- id: "t1c9-p2"
  title: "L'Intellect, lieu des Formes belles"
  notes: ""
  passage:
    label: "l. 32-43"
    part: "L'ascension : le beau intelligible et le bien"
    text: |-
      Qu'il soit d'abord totalement divin et totalement beau, celui qui doit contempler le dieu et la beauté. En s'élevant, en effet, il arrivera d'abord à l'Intellect où toutes les Formes seront belles et il dira alors que c'est cela le beau : les Idées. Toutes les choses sont belles grâce à elles, elles qui sont les rejetons de l'Intellect.
  points: []
- id: "t1c9-p2b"
  title: "Le bien, première beauté"
  notes: ""
  passage:
    label: "l. 32-43"
    part: "L'ascension : le beau intelligible et le bien"
    text: |-
      Ce qui est au-delà du beau, nous disons que c'est le bien qui place au-devant de lui le beau. Dès lors, si l'on se tient à une formule générale, le bien est la première beauté.
  points: []
- id: "t1c9-p2c"
  title: "Distinguer le bien et le beau"
  notes: ""
  passage:
    label: "l. 32-43"
    part: "L'ascension : le beau intelligible et le bien"
    text: |-
      Mais, si l'on distingue les intelligibles, on dira que le beau intelligible est le lieu des Idées et que le bien est au-delà et qu'il est « la source et le principe » du beau. Sinon, on placera au même niveau le bien et le beau ; ce qui est sûr, c'est que le beau est là-bas.
  points: []
