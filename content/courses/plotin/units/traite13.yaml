- id: traite13-l5
  title: "Repérage : le plan du traité 13"
  notes: |-
    **Les neuf chapitres du traité 13 sont autant de mises au point indépendantes : seul le premier est divisé dans le plan détaillé.**

    | Moment | Lieu | Ce qui s'y joue |
    | séparer les Formes de l'Intellect ? | 1, 1-10 | la phrase du *Timée* |
    | le vivant est l'Intellect | 1, 10-15 | envisagé comme intelligible |
    | repos et mouvement | 1, 15-20 | l'intelligible est l'Intellect en repos |
    | l'âme et la science | chap. 2 | s'unifier en s'identifiant à son intellect |
    | l'Âme totale et les âmes | chap. 3 | descendre, rester, ou l'entre-deux |
    | partout et nulle part | chap. 4 | l'Un et le multiple |
    | l'âme comme la vue | chap. 5 | indéterminée avant de voir l'Intellect |
    | la pensée de soi | chap. 6 | une pensée supérieure |
    | au-delà du mouvement et du repos | chap. 7 | le Premier |
    | l'acte et la puissance | chap. 8 | ce qui est toujours en acte |
    | le Premier ne pense pas | chap. 9 | ni conscience de soi, ni vie |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! Le traité commence par l'Intellect et finit par l'Un : la seule progression visible du collage.
