- id: traite13-l3
  title: "L'âme indéterminée, l'Un partout et nulle part"
  notes: |-
    **Les chapitres 3 et 5 font une mise au point sur l'indétermination (`ἀόριστος`).** Le traité 10 (V, 1), 5 et 7, disait l'Intellect indéterminé avant de se retourner vers l'Un ; le traité 12 (II, 4), 3, disait de même l'Âme indéterminée avant de recevoir de l'Intellect sa détermination. Mais le traité 12 faisait aussi de l'indétermination le propre de la **matière**. Il faut donc **distinguer deux indéterminations** : l'une relative au principe dont chaque réalité reçoit son existence, l'autre à ce qu'elle engendre.

    **Chapitre 3** : **l'âme du tout n'est née nulle part** ; c'est le corps qui s'est approché d'elle. Platon ne dit jamais que l'âme est dans le corps, mais que **le corps est en elle**. Les âmes partielles, elles, descendent et remontent :

    | Vers où se porte l'âme partielle | Ce qu'elle rencontre |
    | vers ce qui lui est antérieur | ce qui est : elle est illuminée |
    | vers ce qui vient après elle, vers elle-même | le non-être : elle produit une image d'elle-même, indéterminée et obscure |

    Dans l'entre-deux, elle est « dans son propre séjour ».

    **Chapitre 5** : **l'Âme est comme la vue**, et ce qu'elle voit est l'Intellect. Avant de voir, elle est indéterminée mais disposée à penser : **relativement à l'Intellect, l'Âme est matière.**

    **Chapitre 4** : comment le multiple vient-il de l'Un ? **« C'est que l'Un est partout »** : il remplit tout et produit tout. Mais il est aussi **nulle part** : sinon il serait toutes choses.

    | L'Un est | Il en résulte |
    | partout | toutes choses viennent grâce à lui |
    | nulle part | elles sont différentes de lui |

    ! L'indétermination de l'âme avant l'Intellect n'est pas celle de la matière sensible : c'est une disposition à recevoir sa forme de ce qui la précède.
  points:
