# t-3-9 de l'index.

id: traite13
title: "Traité 13 (III, 9) : Considérations diverses"
subtitle: "Neuf mises au point"
icon: compass
color: sky
lessons:
- id: traite13-l1
  title: "Un collage : pourquoi ces neuf paragraphes ?"
  notes: |-
    **Le traité 13, comme son titre donné par Porphyre le suggère, est un collage** : une collecte de paragraphes, morceaux choisis, pièces rapportées ou fragments d'autres traités. Plusieurs chapitres (2, 4 et 9) commencent par une **marque de coordination** : ils faisaient partie de développements plus vastes.

    **Pourquoi à la fin de la troisième Ennéade ?** Celle-ci est consacrée au monde et à la providence naturelle, et plusieurs paragraphes portent sur le monde et le rôle de l'âme. Mais d'autres en sont loin :

    | Chapitres | Objet |
    | 1-2 | l'Intellect |
    | 3, 5 | l'âme et son indétermination |
    | 4, 9 | l'Un |
    | 8 | l'acte et la puissance, notions scolaires |

    **Ces considérations ont une parenté forte avec les douze premiers traités**, surtout ceux qui portent sur l'Intellect, son produit (l'âme) et son principe (l'Un). La plupart reviennent sur des difficultés déjà rencontrées pour les préciser ou les résumer, comme des réponses à des lecteurs ou auditeurs qui demandaient des **éclaircissements** : leur caractère **thétique** témoigne d'une fonction didactique.

    **Le seul thème récurrent est sans doute l'acte intellectif.** Mais cette communauté thématique est fragile : l'hypothèse plus prosaïque est que **Porphyre** a réuni ces bribes pour composer le **neuvième traité** que son « calcul » éditorial lui imposait d'ajouter à la troisième Ennéade.

    ! Le titre ne vient pas de Plotin : c'est Porphyre qui a assemblé et intitulé ces notes.
