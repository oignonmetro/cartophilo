- id: traite13-l2
  title: "Le vivant intelligible et l'Intellect : Timée 39e"
  notes: |-
    **Le chapitre 1, le plus long, commente une phrase** du *Timée* (39e7-9) : le démiurge fabrique le monde en prenant pour modèle le vivant intelligible, selon les espèces que « l'intellect discerne » dans ce vivant. Platon dit : **« L'Intellect voit les idées qui sont dans le vivant. »**

    **La question** (1, 1-10) : les Formes existent-elles avant l'Intellect, qui les penserait alors comme extérieures à lui ? Il ne posséderait que des images, non des réalités.

    **La réponse** (1, 10-20) :

    - l'Intellect et le vivant diffèrent sans être **séparés** : leur division est le fait de la pensée ; c'est un seul être, intelligible d'un côté, intellect de l'autre ;
    - le vivant, l'intelligible, est **l'Intellect en repos**, dans l'unité et la tranquillité ; l'Intellect qui le voit est un acte qui en vient : deux « genres » du *Sophiste*, le **repos** et le **mouvement**.

    **Le troisième principe, « ce qui réfléchit »**, réalise, produit et **divise** les réalités du vivant pour faire les quatre genres de vivants. En un sens, c'est l'Intellect ; mais en tant qu'il demeure en lui-même, c'est **l'âme** qui opère la division en âmes multiples : la division est l'œuvre de la **pensée discursive**, de l'âme, non de l'Intellect.

    **Le chapitre 2** prolonge : comme une **science** se divise en théorèmes sans s'éparpiller, chaque théorème contenant toute la science en puissance, chacun doit faire en sorte que les principes soient aussi des fins : en possession du meilleur de nous, **nous touchons l'intelligible**.

    ! L'Intellect ne regarde pas des Formes qui existeraient hors de lui : l'intelligible est lui-même, envisagé en repos.
