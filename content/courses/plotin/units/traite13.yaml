- id: traite13-l4
  title: "Le Premier ne pense pas"
  notes: |-
    **Les chapitres 6 à 9 distinguent l'acte de l'Intellect de ce qui n'est pas lui : son principe, l'Un.**

    **Chapitre 6** : en nous pensant nous-mêmes, nous apercevons une nature qui pense. Avant cette pensée, il en est une autre, **« en quelque sorte tranquille »**, une pensée de la réalité et de la vie. Nous sommes chacun réellement un intelligible, mais **notre pensée ne produit qu'une image de nous-mêmes**.

    **Chapitre 7** : le Premier est **puissance de mouvement et de repos**, donc au-delà d'eux ; l'Intellect, au second rang, est en repos et se meut autour du premier. Ce qui pense est **double**, même quand il se pense, et **déficient** : il trouve son bien dans ce qu'il pense.

    **Chapitre 8** : sur l'acte et la puissance. Être en acte, c'est être toujours identique à soi ; le feu est achevé, mais les corps, composés de matière, ne durent pas ; ce qui n'est pas composé et qui est en acte existe toujours.

    **Chapitre 9** : **« le Premier, qui est au-delà de ce qui est, ne pense pas »**.

    | Ce qu'on refuse à l'Un | Pourquoi |
    | la pensée | penser, c'est regarder vers le Premier ; l'intellection est seconde ; seule est vénérable l'intellection du Bien |
    | le désir, le mouvement | il est ce qu'il y a de plus élevé : les autres tournent autour de lui |
    | la conscience de soi | le Bien est antérieur à la conscience du Bien |
    | la vie | il ne vit qu'au sens où il **donne** la vie |

    Ce qui a conscience de soi vient en second : s'il se connaît, c'est qu'il s'ignorait et se parachève en pensant. **Ajouter l'intellection à l'Un le diminuerait.**

    ! Refuser la pensée à l'Un n'est pas le rabaisser : la pensée supposerait un manque, que l'Un n'a pas.
