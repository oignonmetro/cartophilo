  - id: g-epistrophe-l1-q1
    sentence: "Le mouvement par lequel ce qui procède se retourne vers son principe, et qui le constitue, se dit en grec translittéré ___."
    answer: epistrophê
    alt: ["epistrophe", "epistrophè"]
  - id: g-epistrophe-l1-q2
    sentence: "« Parce que, en se tournant vers l'Un, l'Intellect s'est mis à voir : et cette ___, c'est l'Intellect » (traité 10, chap. 7)."
    answer: vision
    alt: []
  - id: g-epistrophe-l1-q3
    sentence: "La procession ne donne qu'une puissance indéterminée : c'est la conversion qui lui donne sa ___, en la faisant regarder sa source."
    answer: forme
    alt: ["détermination", "determination"]
  - id: g-epistrophe-l1-q4
    sentence: "Le traité 10 s'ouvre sur une question : « qu'est-ce qui a fait que les âmes ont oublié le dieu qui est leur ___ » ?"
    answer: père
    alt: ["pere"]
  - id: g-epistrophe-l1-q5
    sentence: "L'origine du mal pour les âmes, « c'est bien l'audace, la génération, l'altérité première et le fait de vouloir s'___ à elles-mêmes » (traité 10, chap. 1)."
    answer: appartenir
    alt: []
  - id: g-epistrophe-l1-q6
    sentence: "Les âmes détournées de leur principe sont comme des ___ arrachés à leurs parents dès la naissance, qui s'ignorent eux-mêmes comme ils ignorent leurs parents (traité 10, chap. 1)."
    answer: enfants
    alt: []
  - id: g-epistrophe-l1-q7
    sentence: "L'âme purifiée doit s'unir au Bien, et « elle ne s'y unira qu'une fois qu'elle se sera ___ » (traité 19, chap. 4)."
    answer: retournée
    alt: ["retournee"]
  - id: g-epistrophe-l1-q8
    sentence: "Ce qui advient à l'âme du fait qu'elle se retourne, c'est « une contemplation et une ___ de ce qui a été vu, placée en elle et agissante » (traité 19, chap. 4)."
    answer: empreinte
    alt: []
  - id: g-epistrophe-l1-q9
    sentence: "La conversion n'est pas un déplacement : l'intelligible n'est nulle part dans l'___, et se convertir, c'est réorienter son regard vers ce qu'on possède déjà."
    answer: espace
    alt: []
  - id: g-epistrophe-l1-q10
    sentence: "Conversion de l'Intellect et conversion morale de l'âme ne sont pas deux conversions de nature différente : c'est la même ___, que l'âme accomplit consciemment."
    answer: loi
    alt: []
