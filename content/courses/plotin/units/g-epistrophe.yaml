id: g-epistrophe
title: Conversion (`epistrophê`)
icon: book
color: coral
lessons:
- id: g-epistrophe-l1
  title: Conversion
  notes: |-
    Chez Plotin, la {violet}**conversion**{/violet} (*epistrophê*) est [def] ; c'est aussi, pour notre âme, {pink}le chemin du retour{/pink}.

    __**Ce qui procède n'est rien avant de se retourner.**__ La [[g-procession|procession]] ne donne d'abord qu'une puissance indéterminée ; elle ne devient quelque chose qu'en regardant sa source. « Parce que, __en se tournant vers l'Un__, l'Intellect s'est mis à voir : et __cette vision, c'est l'Intellect__ » ([[traite10|traité 10]], chap. 7). Et l'engendré « se tourna vers lui et il en fut rempli, et, en fixant son regard sur lui, il devint l'Intellect » ([[traite11|traité 11]], chap. 1). **La conversion n'est donc pas un retour après coup, mais l'acte même par lequel chaque réalité reçoit sa forme** : descendre et se retourner sont les deux temps d'un même mouvement.

    | | Procession | Conversion |
    | Direction | hors du principe | vers le principe |
    | Ce qu'elle donne | une puissance indéterminée | la forme, la détermination |
    | Image | le rayonnement | le regard |

    __**Pourquoi notre âme doit se convertir : elle s'est détournée.**__ Le [[traite10|traité 10]] s'ouvre sur la question : « qu'est-ce qui a fait que __les âmes ont oublié le dieu qui est leur père__ » ? Réponse : « l'audace, la génération, l'altérité première et __le fait de vouloir s'appartenir à elles-mêmes__ » (chap. 1). {yellow}Elles sont comme des enfants arrachés à leurs parents dès la naissance, qui s'ignorent eux-mêmes comme ils ignorent leurs parents.{/yellow} Admirant les choses d'ici plus qu'elles-mêmes, elles s'y attachent. La conversion commence donc par **une estime de soi retrouvée** : connaître ce qu'est l'âme, c'est déjà se retourner vers ce dont elle vient.

    __**La conversion morale suit la même loi.**__ Ce n'est pas une seconde conversion, d'une autre nature : c'est la loi de toute réalité, que l'âme accomplit consciemment. Purifiée, l'âme doit s'unir au Bien, et « elle ne s'y unira __qu'une fois qu'elle se sera retournée__ » ([[traite19|traité 19]], chap. 4). Et la vertu n'est pas autre chose que l'effet de ce retournement : « C'est plutôt ce qui lui advient du fait qu'elle se retourne », c'est-à-dire « __une contemplation et une empreinte de ce qui a été vu__, placée en elle et agissante ». Ce qui convertit l'âme, enfin, c'est l'[[g-amour|amour]] : il reconduit vers sa source ce qui en est issu.

    ! La conversion n'est pas un déplacement : l'intelligible n'est nulle part dans l'espace, et l'âme n'a pas à aller ailleurs. Se convertir, c'est réorienter son regard vers ce qu'elle possède déjà, puisque sa partie la plus haute n'est jamais descendue (voir [[g-ame-non-descendue|âme non descendue]]).

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 10, chap. 1 | pourquoi les âmes ont oublié leur père |
    | traité 10, chap. 7 | cette vision, c'est l'Intellect |
    | traité 11, chap. 1 | l'engendré se tourne et se remplit |
    | traité 19, chap. 4 | la vertu, effet du retournement |

    **Voir aussi** : [[g-procession|Procession]] · [[g-intellect|Intellect]] · [[g-ame|Âme]] · [[g-amour|Amour]] · [[g-henosis|Hénose]]
