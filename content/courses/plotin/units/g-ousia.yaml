# Entrée du glossaire de Plotin (skill glossaire), écrite le 2026-10-21 (elle
# était vide, sous le titre « Substance »). La GF traduit ousia par
# « réalité ». Citations vérifiées sur la GF (VI, 1, 2 ; VI, 2, 8 ; VI, 3, 8).

id: g-ousia
title: Réalité (`ousia`)
subtitle: "Ce qui est véritablement : au sens premier l'intelligible, qui est être, vie et pensée, et seulement par homonymie le corps, assemblage de qualités et de matière"
icon: book
color: teal
lessons:
- id: g-ousia-l1
  title: Réalité
  notes: |-
    Chez Plotin, la {violet}**réalité**{/violet} (*ousia*) n'est pas {pink}l'individu sensible, la *substance première* d'Aristote{/pink} : c'est {green}ce qui est véritablement, l'intelligible{/green}, être, vie et pensée ; le corps ne la reçoit que par homonymie, comme un assemblage de qualités sur la matière.

    __**Pourquoi « réalité » et non « substance ».**__ La GF rend *ousia* par « réalité » : « substance » ferait penser au substrat, au sujet individuel des *Catégories* d'{sky}Aristote{/sky}, alors que pour Plotin ce qui est le plus réellement n'est pas sous les qualités, mais au-dessus du sensible. Le mot dit l'être au sens fort : ce qui ne tient son être de rien d'autre.

    __**Pas de genre commun au sensible et à l'intelligible.**__ Contre les catégories d'Aristote, Plotin refuse que la réalité soit un genre qui couvrirait les deux : « qu'entre la réalité intelligible et la réalité sensible il y ait en commun une chose unique, ce genre qu'est la réalité, __cela est impossible__ ». Sinon, il faudrait une chose antérieure aux deux, « ni un corps ni un incorporel » ([[traite42|traité 42]], chap. 2). La difficulté est qu'on emploie pourtant le même mot : c'est qu'**entre l'original et son image, il n'y a pas de genre commun**, seulement une dépendance.

    __**La réalité sensible, un assemblage.**__ Si l'on retire d'un corps sa grandeur, sa figure, sa couleur, que reste-t-il ? La [[g-hule|matière]]. D'où la question : « la réalité sensible se réduit-elle à __un conglomérat de qualités et de matière__ ? » Plotin l'accepte, à condition de la prendre comme un tout, et il ne faut pas être choqué qu'on la compose à partir de ce qui n'est pas réalité véritable, car « l'univers sensible lui-même en effet __n'est pas une réalité véritable, mais une image de la réalité véritable__ » ([[traite44|traité 44]], chap. 8). Voir [[g-poiotes|qualité]].

    __**La réalité intelligible : être, mouvement, repos, même, autre.**__ Dans l'[[g-intellect|Intellect]], la réalité n'est pas un support inerte : « c'est donc dans le fait de penser que consistent son acte et son mouvement, de même que c'est dans le fait de __se penser lui-même que consistent sa réalité et son être__ ». L'être y fonde le repos, la pensée y est mouvement, et il faut y ajouter le même et l'autre, si bien que « __le total des genres est cinq__ » ([[traite43|traité 43]], chap. 8), comme dans le *Sophiste* de Platon.

    | | Réalité intelligible | Réalité sensible |
    | Ce qu'elle est | être, vie et pensée | assemblage de qualités et de matière |
    | Son statut | réalité véritable | image de la réalité |
    | Ce qu'elle doit à l'autre | ne tient son être de rien | tient son nom de la première |
    | Ses genres | cinq genres premiers | les catégories du sensible |

    ! L'Un n'est pas une réalité : il est « au-delà de la réalité » (voir [[g-au-dela-de-l-etre|au-delà de l'être]]). La réalité commence avec l'Intellect, et le sensible n'en a que l'image.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 42, chap. 2 | pas de genre commun aux deux réalités |
    | traité 43, chap. 8 | les cinq genres de l'être |
    | traité 44, chap. 8 | la réalité sensible, conglomérat et image |

    **Voir aussi** : [[g-intellect|Intellect]] · [[g-hule|Matière]] · [[g-poiotes|Qualité]] · [[g-au-dela-de-l-etre|Au-delà de l'être]] · [[traite43|Traité 43]]
