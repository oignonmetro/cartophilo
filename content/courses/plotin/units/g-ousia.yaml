  points:
  - id: g-ousia-l1-q1
    sentence: "Ce qui est véritablement, que la GF traduit par « réalité » plutôt que par « substance », se dit en grec translittéré ___."
    answer: ousia
    alt: ["ousía"]
  - id: g-ousia-l1-q2
    sentence: "« Qu'entre la réalité intelligible et la réalité sensible il y ait en commun une chose unique, ce genre qu'est la réalité, cela est ___ » (traité 42, chap. 2)."
    answer: impossible
    alt: []
  - id: g-ousia-l1-q3
    sentence: "Un genre commun aux deux réalités devrait être « ni un corps ni un ___ » : c'est absurde (traité 42, chap. 2)."
    answer: incorporel
    alt: []
  - id: g-ousia-l1-q4
    sentence: "La réalité sensible « se réduit-elle à un ___ de qualités et de matière ? » (traité 44, chap. 8)."
    answer: conglomérat
    alt: ["conglomerat"]
  - id: g-ousia-l1-q5
    sentence: "« L'univers sensible lui-même en effet n'est pas une réalité véritable, mais une ___ de la réalité véritable » (traité 44, chap. 8)."
    answer: image
    alt: []
  - id: g-ousia-l1-q6
    sentence: "Dans l'Intellect, « c'est donc dans le fait de penser que consistent son acte et son ___ » (traité 43, chap. 8)."
    answer: mouvement
    alt: []
  - id: g-ousia-l1-q7
    sentence: "« C'est dans le fait de se penser lui-même que consistent sa ___ et son être » : l'Intellect (traité 43, chap. 8)."
    answer: réalité
    alt: ["realite"]
  - id: g-ousia-l1-q8
    sentence: "À l'être, au mouvement et au repos, il faut ajouter le même et l'autre, de sorte que « le total des genres est ___ » (traité 43, chap. 8)."
    answer: cinq
    alt: ["5"]
  - id: g-ousia-l1-q9
    sentence: "Les cinq genres premiers de l'être que Plotin reprend sont ceux du dialogue de Platon intitulé le ___."
    answer: Sophiste
    alt: []
  - id: g-ousia-l1-q10
    sentence: "Pour Aristote, la *substance première* est l'individu sensible ; pour Plotin, la réalité véritable est l'___."
    answer: intelligible
    alt: ["Intellect"]
