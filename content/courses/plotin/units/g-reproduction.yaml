# Entrée du glossaire de Plotin (skill glossaire), écrite le 2026-10-24 à la
# demande de l'utilisateur. Citations vérifiées sur la GF (V, 1, 6 ; V, 4, 1 ;
# III, 8, 7 ; IV, 4, 11 ; IV, 7, 5 ; V, 9, 10 ; IV, 3, 7 ; III, 5, 1). Le
# désir d'engendrer comme désir d'immortalité (III, 5, 1) a ses cartes dans
# Amant ; ce que contient la semence (V, 9, 6), dans Raison séminale. Pas de
# terme grec : la GF ne donne que génesis, « génération » au sens large.

id: g-reproduction
title: Reproduction
icon: book
color: teal
lessons:
- id: g-reproduction-l1
  title: Reproduction
  notes: |-
    Chez Plotin, la {violet}**reproduction**{/violet} est [def]. Ce n'est pas {pink}la transmission d'une âme des parents à l'enfant{/pink}.

    __**Les vivants engendrent parce que ce qui est accompli produit.**__ Pourquoi un vivant en fait-il naître un autre ? Ce n'est pas d'abord un besoin, c'est la loi de tout ce qui est : « oui, toutes les choses, une fois qu'elles sont __parvenues à la perfection, engendrent__ » ([[traite10|traité 10]], chap. 6). Le [[traite7|traité 7]] l'étend à ce qui n'a pas le choix, « toutes les choses qui croissent sans en avoir le choix », et en donne la raison : par là, « toutes choses __imitent le principe__, autant qu'elles le peuvent, en tendant vers l'éternité et la bonté » (chap. 1). {coral}Ce qui est plein donne de sa plénitude, comme l'Un donne l'Intellect{/coral} (voir [[g-procession|procession]]). C'est pourquoi la reproduction vient à son heure, avec la maturité : la puberté et « la procréation d'autres êtres vivants » viennent, comme la barbe, quand leur raison se déploie ([[traite28|traité 28]], chap. 11).

    __**Engendrer, c'est**__ {violet}__**contempler**__{/violet}__**.**__ Ce qui pousse le vivant à engendrer n'est pas son corps : « lorsque les êtres vivants engendrent, __ce sont les raisons qui sont en eux qui les meuvent__, et c'est là une activité de contemplation, \"une douleur d'enfantement\" » ([[traite30|traité 30]], chap. 7). Que veut dire Plotin ? {green}Une forme qui est en nous tend à se voir hors de nous{/green} : engendrer, c'est produire une copie visible de la forme qu'on porte. D'où le mot de Platon, « douleur d'enfantement », que Plotin applique à toute production de formes (voir [[g-theoria|contemplation]]).

    __**Ce qui passe dans la semence : une raison, non une âme.**__ Les parents transmettent une [[g-logos-spermatikos|raison séminale]], et c'est elle qui fait la ressemblance : « c'est __la même \"raison\" en sa totalité__ qui se retrouve dans celui qui engendre et dans le vivant engendré » ([[traite28|traité 28]], chap. 11). Cette raison n'est pas une quantité qu'on partage : quand une seule semence donne plusieurs petits, « __chacun de ces petits est bien un tout__ » ([[traite2|traité 2]], chap. 5). Et si un enfant naît boiteux, la faute n'est pas à la raison, car « il n'y a pas de claudication dans les semences » : elle vient « de ce qu'__une raison ne parvient pas à dominer__ » la matière ([[traite5|traité 5]], chap. 10).

    __**L'âme de l'enfant ne vient pas des parents.**__ Les parents donnent un corps formé par leur raison ; l'âme, elle, ne se découpe pas. « Dans le cas de l'embryon qui se trouve dans la mère, l'âme qui s'introduit de l'extérieur dans l'enfant qui naît __n'est pas celle de la mère__, mais une autre » ([[traite27|traité 27]], chap. 7). Pourquoi ? Parce qu'une âme est indivisible : elle ne peut pas donner une part d'elle-même, comme un corps donne une part de sa matière.

    | Ce qui fait l'enfant | D'où il vient |
    | la matière de son corps | des parents |
    | la raison, la forme de l'espèce | des parents, la même tout entière |
    | les défauts de naissance | de la matière que la raison ne domine pas |
    | son âme | de l'extérieur, non de la mère |

    ! Plotin ne condamne pas la reproduction : chez l'homme, l'amour qui « féconde et engendre dans le beau » selon la nature n'est pas une faute, mais il est inférieur à l'amour du beau seul, car ce qui veut engendrer « ne se suffit pas à soi-même » ([[traite50|traité 50]], chap. 1 ; voir [[g-amant|amant]]).

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 2, chap. 5 | d'une seule semence, chaque petit est un tout |
    | traité 5, chap. 10 | pas de claudication dans les semences |
    | traité 7, chap. 1 | même ce qui croît sans choix produit et imite le principe |
    | traité 10, chap. 6 | ce qui est parvenu à la perfection engendre |
    | traité 27, chap. 7 | l'âme de l'enfant n'est pas celle de la mère |
    | traité 28, chap. 11 | la même raison dans le parent et dans l'enfant |
    | traité 30, chap. 7 | engendrer est une activité de contemplation |
    | traité 50, chap. 1 | engendrer dans le beau, sans faute mais sans se suffire |

    **Voir aussi** : [[g-croissance|Croissance]] · [[g-logos-spermatikos|Raison séminale]] · [[g-amant|Amant]] · [[g-theoria|Contemplation]] · [[g-procession|Procession]]
