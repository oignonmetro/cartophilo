  points:
  - id: g-reproduction-l1-q1
    sentence: "« Oui, toutes les choses, une fois qu'elles sont parvenues à la ___, engendrent » (traité 10, chap. 6)."
    answer: perfection
    alt: []
  - id: g-reproduction-l1-q2
    sentence: "Les choses qui produisent, même sans choix, montrent que « toutes choses imitent le ___, autant qu'elles le peuvent, en tendant vers l'éternité et la bonté » (traité 7, chap. 1)."
    answer: principe
    alt: []
  - id: g-reproduction-l1-q3
    sentence: "« Lorsque les êtres vivants engendrent, ce sont les ___ qui sont en eux qui les meuvent » (traité 30, chap. 7)."
    answer: raisons
    alt: []
  - id: g-reproduction-l1-q4
    sentence: "Engendrer est « une activité de contemplation, \"une douleur d'___\" » (traité 30, chap. 7)."
    answer: enfantement
    alt: []
  - id: g-reproduction-l1-q5
    sentence: "« C'est la même \"raison\" en sa totalité qui se retrouve dans celui qui ___ et dans le vivant engendré » (traité 28, chap. 11)."
    answer: engendre
    alt: []
  - id: g-reproduction-l1-q6
    sentence: "Quand une seule semence donne plusieurs petits, « chacun de ces petits est bien un ___ » (traité 2, chap. 5)."
    answer: tout
    alt: []
  - id: g-reproduction-l1-q7
    sentence: "« Il n'y a pas de ___ dans les semences. La claudication de naissance vient de ce qu'une raison ne parvient pas à dominer » (traité 5, chap. 10)."
    answer: claudication
    alt: []
  - id: g-reproduction-l1-q8
    sentence: "« Dans le cas de l'embryon qui se trouve dans la mère, l'âme qui s'introduit de l'extérieur dans l'enfant qui naît n'est pas celle de la ___, mais une autre » (traité 27, chap. 7)."
    answer: mère
    alt: ["mere"]
  - id: g-reproduction-l1-q9
    sentence: "Les parents transmettent à l'enfant une raison, non une âme, parce qu'une âme est ___ : elle ne peut pas donner une part d'elle-même."
    answer: indivisible
    alt: []
