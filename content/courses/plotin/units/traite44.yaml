- id: traite44-l6
  title: "Le mouvement et le repos"
  notes: |-
    **Un genre irréductible** (chap. 21) : contre Aristote, Plotin fait du mouvement un genre du sensible. Il n'est ni la réalité, ni une qualité, ni l'agir ou le pâtir, qui se ramènent plutôt à lui ; ni un relatif, car il est quelque chose avant d'être mouvement de quelque chose. Le changement ne lui est pas antérieur ; la génération, acquisition d'une forme, est une espèce de mouvement, et l'altération aussi.

    **Une forme éveillée** (chap. 22-23) : le mouvement est le passage de la puissance à ce dont elle est la puissance : devenir statue, marcher, danser. **C'est une forme « éveillée »** : une forme non pas acquise et au repos, comme celle de la statue achevée, mais en train d'agir ; elle est la vie des corps, qui porte le même nom que les mouvements de l'âme et de l'intelligence ; la preuve qu'il est un genre, c'est qu'on ne peut le définir. Comme la chaleur du soleil fait croître et dessécher, il reste le même, et ses différences viennent des substrats. Ce qui est commun à tout mouvement, c'est de rendre autre : le temps court avec lui « comme s'il le chevauchait ». Le mouvement **secoue et éveille** les choses pour qu'elles ne s'endorment pas : leur affairement est une image de la vie. La marche n'est pas les pieds, mais l'acte d'une puissance en eux ; le mouvement va de l'agent au mû comme un souffle. Dans le sensible, il est l'image de l'Autre de là-bas.

    **Ses espèces** (chap. 24-26) : le mouvement local est un, ses différences sont extérieures. L'association et la dissociation ne remplacent pas l'altération : sinon il faudrait le vide, et apprendre serait une association. On divise les mouvements selon la nature, la technique, la volonté.

    **Le repos** (chap. 27) : il vaut mieux réserver « repos » aux choses de là-bas et ne chercher ici-bas que l'immobilité.

    | Terme | Là-bas | Ici-bas |
    | le mouvement | genre premier, acte de l'être | genre du sensible, forme éveillée |
    | le repos | il existe avec le mouvement | l'immobilité, négation du mouvement |
    | l'autre | genre premier | modèle du mouvement sensible |

    **Conclusion** (chap. 28) : agir et pâtir sont des mouvements ; le relatif est la disposition d'une chose envers une autre. Ces brèves remarques sont probablement de Porphyre, qui aurait achevé l'exposé.

    ! Le relatif, cinquième genre du sensible, n'a pas d'étude propre : Plotin a dû interrompre ses cours avant.
