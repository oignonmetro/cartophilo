- id: traite44-l2
  title: "Ce qu'est la réalité sensible"
  notes: |-
    **Le caractère commun** (chap. 4) : qu'y a-t-il d'identique dans la matière, la forme et le composé ? Ce n'est pas d'être une assise pour le reste : la forme ne serait plus réalité. C'est plutôt de ne pas être dit d'autre chose : le blanc, le double, le père, la connaissance, le lieu, le temps se disent d'autre chose ; le feu, le bois, l'homme, Socrate, non. **« La réalité en définitive, c'est ce qui est à soi-même son être. »** La forme n'est pas dans la matière, elle en est l'achèvement ; la réalité est ce dont vient tout le reste, le substrat des affections et la source des actions.

    | Critère | Exemple | Ce qu'il vaut |
    | être une assise | la matière pour la forme | il exclut la forme de la réalité |
    | ne pas être dit d'autre chose | le feu, Socrate | il convient aux trois termes |
    | ne pas être dans un substrat | l'humanité en Socrate | il vaut aussi de la différence |

    **Commun, non propre** (chap. 5) : ces traits ne valent là-bas que par analogie. La forme n'est pas dans la matière comme dans un substrat, ni l'humanité dans Socrate. Dire que Socrate est un homme, ce n'est pas dire qu'un morceau de bois est blanc : c'est comme dire que Socrate est Socrate. Mais ces caractères sont communs à la matière, à la forme et au composé ; ils n'indiquent pas le propre de la réalité véritable.

    **L'être pris absolument** (chap. 6) : à qui demande ce qu'est la réalité, il faut répondre que cet « être » ne se voit pas avec les yeux. Le feu est une réalité en raison de son être ; le blanc est de l'être par participation, en un sens second. « Ce blanc est Socrate » et « Socrate est blanc » ne disent pas la même chose. **L'être sensible tient son être de l'être véritable**, et sa blancheur du blanc véritable.

    ! La réalité n'est pas définie par ce qu'on en voit, matière, forme ou composé, mais par l'être dont elle participe.
