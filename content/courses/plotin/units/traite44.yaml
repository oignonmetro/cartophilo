- id: traite44-l5
  title: "La qualité"
  notes: |-
    **Une raison dans les corps** (15, 24-16, 7) : mêlée à la matière et à la quantité, la qualité complète la réalité sensible, qui n'est pas seulement « quelque chose », mais « quelque chose de qualifié ». La raison du feu indique un « quelque chose », la forme qu'elle met en œuvre une qualité. Le Socrate sensible, fait de couleurs et de formes qui sont les images de sa raison, ne mérite pas plus le nom de Socrate que son portrait. La qualité dit « tel » ou « quel » ; le beau d'ici-bas n'a que le nom en commun avec celui de là-bas.

    **Les difficultés** (16, 7-47) : il y a des vertus ici-bas et des vertus là-bas. Les techniques sont des raisons dont la matière est l'âme ; celles qui se servent du corps, comme le jeu de la cithare, se rangent ici-bas, de même que les vertus pratiques et politiques. Les raisons, **puissances productrices** tournées vers les corps, sont placées parmi les qualités d'ici-bas, sans qu'aucune réalité incorporelle soit mise dans le sensible.

    **Diviser la qualité** (chap. 17-18) : on peut la diviser selon les sens, mais il est absurde de diviser un genre par lui-même : il n'y a pas de qualités de qualités, ni de différences de différences. Le vert tendre et le jaune pâle diffèrent, mais ni la sensation ni l'intellect ne disent pourquoi : l'intellect procède par intuitions simples, « ceci est ceci ». Cinq ne diffère pas de trois par deux, il le dépasse de deux.

    **Cas limites** (chap. 19-20) :

    | Cas | Qualité | Pourquoi |
    | aveugle, édenté | oui | privation d'une qualité |
    | nu, habillé | non | une manière d'être, une relation |
    | être en train de rougir | non | une affection, un mouvement |
    | rouge | oui | être tel ou tel |

    Les contraires ne se définissent pas par le plus grand écart, puisque la santé et la maladie n'ont pas d'intermédiaire : sont contraires les qualités qui n'ont rien d'identique dans leur forme. Le « plus » est dans ce qui participe ; là-bas, rien ne l'admet.

    ! Les qualités sensibles sont incorporelles, des raisons ; Plotin les range pourtant ici-bas, parce qu'elles inclinent vers les corps.
