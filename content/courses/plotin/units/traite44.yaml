- id: traite44-l3
  title: "Une ombre de réalité et ses espèces"
  notes: |-
    **La matière n'est pas première** (chap. 7) : elle vient après toutes les choses de là-bas et possède l'être sous une forme obscure : c'est « une ombre de "raison", une "raison" qui a chuté ». Ce qui a moins d'être ne peut en donner à ce qui en a plus. Si la forme a plus d'être que la matière, la réalité n'est plus un genre commun aux trois termes, pas plus qu'il n'y a de commun entre la vie nutritive, sensitive et intellective. L'argile devient céramique pour avoir subi davantage le feu : deux choses venues d'une même source peuvent en participer plus ou moins.

    **Une ombre** (chap. 8) : il faut abandonner la division en forme et matière et saisir la réalité sensible par la sensation : ce qui est commun à la pierre, à l'eau, aux plantes, aux animaux. Elle n'est qu'**un conglomérat de qualités et de matière** ; mais « l'univers sensible lui-même en effet n'est pas une réalité véritable, mais une image de la réalité véritable ». Ce qui est sous-jacent est stérile : une ombre, sur laquelle n'apparaît qu'un dessin.

    **Les espèces** (chap. 9-10) :

    | Corps | Exemples | Comment les diviser |
    | matériels | le feu, la terre, l'eau, l'air | lourds ou légers, au centre ou à la périphérie |
    | organiques | les plantes, les animaux | l'aspect extérieur, l'élément où ils vivent |
    | mélangés | les ignés, les terreux | l'élément qui domine |

    La distinction de la réalité première (ce feu-ci) et seconde (le feu) oppose le particulier à l'universel, non deux réalités : c'est parce que la compétence littéraire existe qu'elle peut être en toi, et Socrate est homme par participation à l'Homme. On peut aussi diviser selon les qualités ; c'est la perception sensible qui garantit l'être de ces réalités.

    ! Plotin ne nie pas la réalité sensible : il en fait l'image d'une réalité qui, elle, ne tient son être de rien d'autre.
