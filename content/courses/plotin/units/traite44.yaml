id: traite44
title: "Traité 44 (VI, 3) : Sur les genres de l'être III"
subtitle: "Les genres du monde sensible"
icon: compass
color: sky
lessons:
- id: traite44-l1
  title: "Les genres du sensible : problème et méthode"
  notes: |-
    **Le problème** (chap. 1) : après la réalité véritable, il faut chercher si le sensible a les mêmes genres que l'intelligible, davantage, ou d'autres. Il faut entendre « les mêmes genres » **en un sens analogique et par homonymie** : du point de vue de l'intelligible, le sensible n'a de commun avec lui que le nom ; du point de vue du sensible, il en dépend, d'où l'analogie. On divisera le monde comme on divise le son, chose illimitée, en lettres. Les genres seront plus nombreux, car l'univers n'est qu'une image de l'intelligible. On laisse l'âme hors de la recherche, comme on ne compterait pas les étrangers résidents en classant les citoyens.

    **Une analogie abandonnée** (chap. 2) : la nature qui est dans les corps, prise dans le flux, n'est que « devenir ». On pourrait faire correspondre terme à terme les genres d'ici à ceux de là-bas ; Plotin y renonce :

    | Là-bas | Ici-bas, par analogie | L'objection |
    | l'être | la matière | la matière n'est pas comme l'être |
    | le mouvement | la forme | ici-bas le mouvement est un accident |
    | le repos | la matière qui ne sort pas d'elle-même | la matière est tirée en tous sens |
    | le même et l'autre | l'altérité et la dissemblance | ici, on est autre par participation |

    **Une classification** (chap. 3) : il y a la matière, la forme, le composé, et ce qui s'y rapporte : des attributs (être cause, être élément), qui vont au relatif ; des accidents, dans les choses (la quantité, la qualité) ou qui ont les choses en eux (le lieu, le temps) ; des actions et affections, les mouvements ; des accompagnements, le lieu et le temps. Si matière, forme et composé n'en font qu'un, il y a **cinq genres : la réalité, le relatif, la quantité, la qualité, le mouvement**.

    ! Le sensible n'a pas cinq genres parce qu'il copierait les cinq genres du *Sophiste* : Plotin refuse justement cette correspondance.
