- id: traite44-l4
  title: "La quantité"
  notes: |-
    **Ce qui est quantité** (chap. 11-12) : seuls le nombre et la grandeur. Plotin redistribue les catégories d'Aristote :

    | Terme | Pour Aristote | Pour Plotin |
    | le temps | une quantité | un relatif, mesure du mouvement |
    | le lieu | une quantité | un relatif, contenant du corps |
    | le grand et le petit | des relatifs | des quantités |
    | le discours | une quantité | un mouvement |

    Le grand est grand par une grandeur ; ce sont le « plus grand » et le « plus petit » qui sont relatifs, comme le double. On dit une montagne petite ou un grain de millet grand en voulant dire « plus petit » ou « plus grand » que ceux du même genre. De même le beau existe en lui-même et seul le « plus beau » est relatif : selon Platon, « le plus beau des singes » est laid comparé à une autre espèce. Il y a donc de la contrariété dans la quantité : « beaucoup » est une expansion du nombre, « peu » une contraction. Il n'y en a pas dans le lieu, car il n'y a pas de « bas » dans l'univers. Le son, la syllabe, le mot sont des mouvements.

    **Nombre et figure** (chap. 13-14) : le continu a une limite commune, le discontinu non ; le nombre est pair ou impair ; ligne, surface et volume sont des grandeurs d'espèces différentes, que les géomètres divisent. La ligne droite est une grandeur qualifiée, le triangle trois lignes disposées d'une certaine façon. Mais si les figures étaient des qualités, **la géométrie ne porterait plus sur les grandeurs**, ce qui est absurde : les différences des grandeurs restent des grandeurs.

    **Le propre de la quantité** (15, 1-23) : on parle de triangles semblables, mais « semblable » a alors un autre sens ; il reste que l'égal et l'inégal sont le propre de la quantité.

    ! Le grand n'est pas relatif : il faut qu'il y ait du grand pour qu'il y ait du plus grand.
