- id: traite44-l7
  title: "Repérage : le plan du traité 44"
  notes: |-
    **Le traité 44 pose le problème (chap. 1-3), puis examine les genres du sensible : la réalité (chap. 4-10), la quantité (chap. 11-15), la qualité (chap. 15-20), le mouvement (chap. 21-27) ; la conclusion (chap. 28) est sans doute de Porphyre.**

    | Moment | Lieu | Ce qui s'y joue |
    | problème général | chap. 1 | les étrangers résidents |
    | questions de méthode | chap. 2 | une analogie abandonnée |
    | classification | chap. 3 | cinq genres du sensible |
    | la réalité n'est pas ce qui sert d'assise | 4, 1-7 | la matière, siège de la forme |
    | ne pas être prédiqué d'autre chose | 4, 7-26 | à soi-même son être |
    | l'objection du substrat | 4, 26-36 | la source des actions |
    | caractères communs, non propres | chap. 5 | l'humanité en Socrate |
    | l'être pris absolument | chap. 6 | ce que les yeux ne voient pas |
    | abandonner forme et matière | chap. 7 | la raison qui a chuté |
    | une ombre de réalité | chap. 8 | le dessin sur l'ombre |
    | critères pour diviser la réalité | 9, 1-18 | corps matériels et organiques |
    | réalité première et seconde | 9, 18-42 | la compétence littéraire |
    | nouveaux critères | chap. 10 | la perception garantit l'être |
    | lieu, temps, grand et petit | chap. 11 | le grain de millet |
    | le discours | chap. 12 | un mouvement |
    | le nombre | chap. 13 | pair et impair |
    | la figure | chap. 14 | la géométrie |
    | l'égal et l'inégal | 15, 1-23 | le propre de la quantité |
    | la qualité, une raison | 15, 24-16, 7 | le portrait de Socrate |
    | les difficultés de la raison | 16, 7-47 | le citharède |
    | diviser la qualité | chap. 17-18 | le vert et le jaune |
    | nouveaux problèmes | chap. 19 | rougir |
    | qualités sans contraire | chap. 20 | santé et maladie |
    | introduction au mouvement | 21, 1-4 | trois questions |
    | un genre irréductible | 21, 5-21 | ni relatif ni quantité |
    | le changement n'est pas antérieur | 21, 21-47 | la génération |
    | ce qu'est le mouvement | chap. 22-23 | une forme éveillée |
