- id: traite45-l2
  title: "L'éternité, vie de l'être"
  notes: |-
    **La puissance une de l'intelligible** (chap. 3) : l'éternité n'est pas une idée qui rassemble une multiplicité, mais une nature une à la puissance multiple ; selon l'angle, on l'appelle réalité, mouvement (sa vie), repos, même et autre. Rassemble tout cela : c'est l'éternité, **« une vie qui demeure dans l'identité parce que le tout lui est toujours présent »** ; tout y est ensemble, comme dans un **point**. Elle n'est pas le substrat, mais ce qui **rayonne** du substrat. Ni « était » ni « sera » : seulement « est ». D'où une seconde définition : la vie de l'être, **tout entière ensemble, pleine et absolument dépourvue d'extension**.

    **Complet, donc atemporel** (chap. 4) : l'éternité n'est pas un accident de l'intelligible. Le vrai tout **ne manque de rien** : dire qu'il « sera » quelque chose, c'est dire qu'il en manquait. Les choses engendrées acquièrent au contraire leur être jusqu'à leur dernier moment ; l'univers se hâte vers l'avenir et se meut en cercle, par désir de la réalité. « Éternité », `aiôn`, vient de « ce qui est toujours », `aei ôn`.

    **Un dieu, une vie illimitée** (chap. 5) : qui la contemple sans fatigue devient semblable à elle. L'éternité est **un dieu** qui se manifeste tel qu'il est : « une vie d'emblée illimitée », qui ne perd rien d'elle-même.

    **Les formules de Platon** (chap. 6) : « l'éternité demeurant dans l'Un » veut dire qu'elle est l'acte d'une vie tournée vers l'Un. On dit « toujours » pour plus de clarté, comme on dit « philosophe véritable » : il faut l'entendre comme « ce qui est véritablement ». Le monde n'a pas commencé dans le temps.

    ! « Toujours » ne veut pas dire une durée sans fin : l'éternité n'est pas un temps illimité, mais l'absence de toute extension.
