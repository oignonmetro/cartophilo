- id: traite45-l4
  title: "Le temps, vie de l'âme"
  notes: |-
    **Le récit du temps** (11, 1-27) : on ne peut invoquer les **Muses**, qui n'existaient pas encore ; c'est le temps lui-même qui le dirait. Il se reposait dans l'être avec l'éternité. Mais une nature **affairée**, voulant s'appartenir et chercher plus que le présent, se mit en mouvement. Une puissance de l'âme n'acceptait pas que le tout lui fût présent tout d'un bloc : comme une raison qui sort d'une **semence**, elle procède vers une étendue qui l'affaiblit.

    **L'âme se temporalise** (11, 27-62) : en produisant le monde à l'image de l'intelligible, l'âme s'est temporalisée elle-même ; le monde, qui n'a d'autre lieu que l'âme, se meut dans son temps. Ses actes se succèdent : d'où l'avant et l'après. **Le temps est la vie de l'âme que son mouvement fait passer d'un état à un autre.** Il imite l'éternité en voulant acquérir sans cesse de nouvelles déterminations.

    | Éternité | Temps |
    | la vie de l'Intellect | la vie de l'âme |
    | l'identité, ce qui demeure | des actes toujours différents |
    | l'unité sans étendue | l'unité de continuité |
    | d'emblée illimitée et totale | une totalisation toujours à venir |

    **Le ciel manifeste le temps** (chap. 12-13) : si l'âme remontait vers l'intelligible, le temps cesserait, et la sphère du monde n'existerait pas. Le temps est né avec le ciel parce que la même vie produit l'un et l'autre. Le démiurge a fait **le jour et la nuit** pour que les hommes, qui ne savaient pas encore compter, saisissent la dualité ; la révolution du ciel **manifeste** et mesure le temps, elle ne l'engendre pas. Comme le mouvement des jambes remonte au mouvement de l'âme, tout temps remonte à l'âme du monde ; et il est en chaque âme, car toutes sont une.

    ! Plotin cite le temps « image mobile de l'éternité », mais tait la fin de la formule, « progressant suivant le nombre » : pour lui, l'image tient à la vie de l'âme, non aux cycles des astres.
