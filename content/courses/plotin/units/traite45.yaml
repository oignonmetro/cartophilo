- id: traite45-l3
  title: "Les définitions manquées du temps"
  notes: |-
    **L'homme entre temps et éternité** (chap. 7) : nous ne pourrions parler de l'éternité sans y avoir part ; mais nous sommes dans le temps. Il faut **descendre** de l'éternité au temps, sans aller jusqu'au fond. D'abord, l'examen des anciens, en trois groupes : le temps serait le mouvement, ce qui est mû, ou quelque chose du mouvement.

    | Définition | Objection de Plotin |
    | le mouvement | le mouvement peut cesser sans que le temps cesse |
    | ce qui est mû, la sphère | elle ne passe pour le temps que parce qu'elle se meut |
    | l'intervalle du mouvement | c'est le mouvement, ou le lieu, ou un simple accident du temps |
    | la mesure du mouvement | elle dit ce que le temps mesure, non ce qu'il est |
    | l'accompagnement du mouvement | cet accompagnement est lui-même dans le temps |

    **Les stoïciens** (chap. 8) : pour Zénon, l'intervalle de n'importe quel mouvement, et il y aurait alors plusieurs temps ; pour Chrysippe, l'intervalle du mouvement du monde. Mais ce qu'on mesure ainsi, c'est le mouvement ou l'espace parcouru.

    **Aristote** (chap. 9) : la définition la plus approfondie, le temps est le nombre ou la mesure du mouvement selon l'antérieur et le postérieur (*Physique* IV). Mais une mesure a sa nature avant de mesurer, comme on pense le nombre dix sans les chevaux ; c'est plutôt le mouvement qui mesure le temps ; et le temps existerait même si rien ne bougeait, et si nulle âme ne le mesurait.

    **Épicure** (chap. 10) : l'accompagnement du mouvement a lieu dans le temps, et la définition tourne en rond. Passer les autres en revue serait faire œuvre d'historien.

    ! Toutes ces définitions ont le même défaut : elles saisissent le temps à partir du mouvement des corps, qui n'en est qu'un accident.
