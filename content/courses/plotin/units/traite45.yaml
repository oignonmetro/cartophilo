lessons:
- id: traite45-l1
  title: "La méthode : l'éternité n'est ni l'intelligible ni le repos"
  notes: |-
    **Un traité platonicien** : sans doute écrit en 268, il examine l'éternité (chap. 2-6), puis le temps (chap. 7-13), selon l'ordre de la réalité, car le temps est dérivé et affaibli. À l'horizon, la définition du *Timée* : le temps, **image de l'éternité**.

    **La méthode** (chap. 1) : nous croyons avoir de l'éternité et du temps une impression claire ; à l'examen, nous sommes dans l'embarras et nous nous contentons de répéter les anciens. Il faut aller de la notion spontanée à la définition, et commencer par le modèle, l'éternité ; on pourrait aussi remonter du temps à l'éternité par **réminiscence**.

    **Deux hypothèses rejetées** (chap. 2) :

    | Hypothèse | Pourquoi la rejeter |
    | l'éternité est le monde intelligible | les intelligibles sont éternels par l'éternité, qui les enveloppe autrement qu'un tout ses parties |
    | l'éternité est le Repos intelligible | le repos n'inclut ni l'unité ni l'absence d'étendue, et le mouvement intelligible serait hors de l'éternité |

    Comme certains disaient le temps identique au ciel, on voudrait l'éternité identique à l'intelligible ; mais qu'ils soient tous deux vénérables ne prouve pas qu'ils soient identiques.

    ! L'éternité n'est pas l'un des genres de l'être : elle participe au repos, mais n'est pas le Repos en soi.
