- id: traite45-l5
  title: "Repérage : le plan du traité 45"
  notes: |-
    **Le traité 45 dit ce qu'est l'éternité (chap. 1-6), écarte les définitions du temps des anciens (chap. 7-10), puis expose l'origine et la nature du temps (chap. 11-13).**

    | Moment | Lieu | Ce qui s'y joue |
    | la méthode | chap. 1 | de la notion à la définition |
    | ni l'intelligible ni le repos | chap. 2 | le Repos en soi |
    | une vie qui demeure dans l'identité | chap. 3 | comme dans un point |
    | l'être complet, donc atemporel | chap. 4 | aiôn, aei ôn |
    | l'éternité, un dieu | chap. 5 | une vie d'emblée illimitée |
    | les formules du *Timée* | chap. 6 | demeurer dans l'Un |
    | descendre vers le temps | chap. 7 | trois groupes de définitions |
    | le mouvement et ce qui est mû | 8, 1-22 | le mouvement peut cesser |
    | l'intervalle du mouvement | 8, 23-69 | Zénon, Chrysippe |
    | la mesure du mouvement | chap. 9 | dix, sans les chevaux |
    | l'accompagnement du mouvement | 10, 1-8 | Épicure |
    | la fin de l'examen | 10, 9-17 | œuvre d'historien |
    | la descente de l'âme | chap. 11 | une nature affairée |
    | pas de temps sans âme descendue | 12, 1-22 | si l'âme remontait |
    | le ciel manifeste le temps | 12, 22-13, 9 | le jour et la nuit |
    | encore Aristote | 13, 9-18 | mesurant ou mesuré |
    | né avec le ciel | 13, 18-30 | une image mobile |
    | l'âme avant les corps | 13, 30-69 | le mouvement des jambes |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! Le chapitre 11 est le centre du traité : tout ce qui précède sur le temps est négatif, tout ce qui suit en découle.
