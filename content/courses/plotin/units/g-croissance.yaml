  points:
  - id: g-croissance-l1-q1
    sentence: "L'accroissement d'un corps vivant selon une mesure qui ne vient pas de lui se dit en grec translittéré ___."
    answer: auxêsis
    alt: ["auxesis", "aúxêsis"]
  - id: g-croissance-l1-q2
    sentence: "Le corps « n'a pas lui-même reçu en partage la capacité de croître, sinon dans la mesure où, dans la masse matérielle, il l'accueille en étant au ___ de ce qui effectue la croissance en lui » (traité 2, chap. 5)."
    answer: service
    alt: []
  - id: g-croissance-l1-q3
    sentence: "Contre les stoïciens : si l'âme était un corps qui fait croître, « elle devrait nécessairement aussi croître elle-même, de toute évidence par l'ajout d'un ___ semblable » (traité 2, chap. 5)."
    answer: corps
    alt: []
  - id: g-croissance-l1-q4
    sentence: "Ce qui s'ajouterait à une âme-corps qui grandit « est soit une âme, soit un corps ___ » : les deux branches sont absurdes (traité 2, chap. 5)."
    answer: inanimé
    alt: ["inanime"]
  - id: g-croissance-l1-q5
    sentence: "La puissance végétative, « quand elle fait pousser les plantes ne ___ pas elle-même » (traité 26, chap. 4)."
    answer: pousse
    alt: []
  - id: g-croissance-l1-q6
    sentence: "Si l'âme était seulement petite, « la même chose ne pourrait plus accompagner le corps qui s'___ » (traité 22, chap. 13)."
    answer: accroît
    alt: ["accroit"]
  - id: g-croissance-l1-q7
    sentence: "Le corps qui grandit ne reçoit pas plus d'âme : il reçoit plus de ___, ordonnée par la même âme."
    answer: matière
    alt: ["matiere"]
  - id: g-croissance-l1-q8
    sentence: "La pousse à des moments déterminés « des ongles, de la barbe et des seins » montre que « les \"raisons\" intervenues antérieurement ne sont pas ___ alors que d'autres interviennent à leur suite » (traité 28, chap. 11)."
    answer: détruites
    alt: ["detruites"]
  - id: g-croissance-l1-q9
    sentence: "La puissance végétative assure ensemble la nutrition, la croissance et la ___ (traité 26, chap. 4)."
    answer: reproduction
    alt: []
  - id: g-croissance-l1-q10
    sentence: "« Ce qui engendre, nourrit et fait croître, doit aussi avoir le ___ de ces activités » (traité 28, chap. 28)."
    answer: désir
    alt: ["desir"]
  - id: g-croissance-l1-q11
    sentence: "« Sous beaucoup de rapports, les hommes peuvent être considérés comme des plantes : ils ont en effet un corps qui croît et qui ___ » (traité 15, chap. 2)."
    answer: engendre
    alt: []
