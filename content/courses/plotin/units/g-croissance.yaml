# Entrée du glossaire de Plotin (skill glossaire), écrite le 2026-10-24 à la
# demande de l'utilisateur. Citations vérifiées sur la GF (IV, 7, 5 ; III, 4,
# 2 ; VI, 4, 13 ; III, 6, 4 ; IV, 4, 11 et 28). Les pierres qui croissent
# (IV, 4, 27 ; VI, 7, 11) ont leurs cartes dans Animé / Inerte. Le terme grec,
# auxêsis, est celui de l'index des notions de la GF (traités 42-44).

id: g-croissance
title: Croissance (`auxêsis`)
icon: book
color: teal
lessons:
- id: g-croissance-l1
  title: Croissance
  notes: |-
    Chez Plotin, la {violet}**croissance**{/violet} (*auxêsis*) est [def]. Ce n'est pas {pink}un corps qui s'ajoute des parties{/pink}, et l'âme ne grandit pas avec lui.

    __**Le corps ne croît pas de lui-même.**__ Où est la difficulté ? Un vivant ne grossit pas au hasard : il croît « dans le temps qui convient et jusqu'à une certaine mesure ». Or un corps n'a ni ce temps ni cette mesure : « il convient que le corps croisse, mais il n'a pas lui-même reçu en partage la capacité de croître, sinon dans la mesure où, dans la masse matérielle, il l'accueille __en étant au service de ce qui effectue la croissance en lui__ » ([[traite2|traité 2]], chap. 5). Plotin en tire un argument contre l'âme-corps des {red}stoïciens{/red} : si l'âme était un corps et faisait croître le corps, « elle devrait nécessairement aussi croître elle-même, de toute évidence __par l'ajout d'un corps semblable__ ». Et ce qui s'ajouterait serait « soit une âme, soit un corps inanimé » : une âme venue d'où ? un corps inanimé qui deviendrait animé comment ? {coral}Ce qui fait croître ne peut donc pas être un corps.{/coral}

    __**Ce qui fait croître ne croît pas.**__ La {coral}cause de la croissance{/coral} est une **puissance de l'âme**, la {violet}puissance végétative{/violet}. Or elle ne grandit pas avec ce qu'elle fait grandir : « la puissance végétative, en effet, quand elle fait pousser les plantes __ne pousse pas elle-même__, ni, quand elle produit un accroissement, ne s'accroît elle-même » ([[traite26|traité 26]], chap. 4). Pourquoi ? Parce qu'elle n'est pas une chose étendue, mais une {coral}**forme**{/coral} : elle n'a pas de taille, elle __fixe la taille__ que le corps atteindra. {teal}Le plan d'une maison ne s'agrandit pas pendant qu'on la bâtit : ce qui s'agrandit, ce sont les murs, élevés selon le plan.{/teal} Ici, le plan est la forme, les murs sont la matière : quand un vivant grandit, ce n'est pas l'âme qui s'étend, c'est la matière qui s'ajoute, et elle s'ajoute selon la forme.

    __**La même âme accompagne toute la croissance.**__ Il en résulte que l'âme n'est pas logée dans le corps par morceaux, une parcelle d'âme pour chaque parcelle de corps : il faudrait alors lui ajouter des parcelles à mesure que le corps grandit. Elle est présente tout entière en chaque partie, et c'est pourquoi la même âme peut suivre le corps du plus petit au plus grand : si elle était seulement une petite chose, « __la même chose ne pourrait plus accompagner le corps qui s'accroît__ » ([[traite22|traité 22]], chap. 13). **Le corps qui grandit ne reçoit donc pas plus d'âme : il reçoit plus de matière, que la même âme ordonne.**

    __**Croître, c'est déployer une**__ {violet}__**raison**__{/violet} __**dans le temps.**__ D'où vient alors que chaque chose pousse à son heure ? De la [[g-logos|raison]] du vivant, qui se déploie par étapes : « les âges successifs ; la pousse, à des moments déterminés, des ongles, de la barbe et des seins ; la puberté et la procréation d'autres êtres vivants. __Les raisons intervenues antérieurement ne sont pas détruites__ alors que d'autres interviennent à leur suite » ([[traite28|traité 28]], chap. 11). {green}Le temps et la mesure qui manquaient au corps sont ceux de cette raison{/green}, venue de la semence (voir [[g-logos-spermatikos|raison séminale]] et [[g-reproduction|reproduction]]).

    __**Une puissance de l'âme, la plus basse.**__ La puissance végétative assure ensemble « la nutrition, __la croissance et la reproduction__ » ([[traite26|traité 26]], chap. 4). Elle n'est pas sans **désir** : « ce qui engendre, nourrit et fait croître, __doit aussi avoir le désir de ces activités__ » ([[traite28|traité 28]], chap. 28). Chez l'homme, elle est la part par laquelle {amber}nous ressemblons aux plantes{/amber} : « ils ont en effet __un corps qui croît et qui engendre__ » ([[traite15|traité 15]], chap. 2). D'où le danger : l'âme qui ne vit que par elle « devient celle de ses parties qu'elle a développée le plus », une plante (voir [[g-daimon|démon]]). Elle est présente jusque dans les pierres, qui croissent tant qu'elles tiennent à la terre (voir [[g-anime-inerte|animé et inerte]]).

    | | Ce qui croît | Ce qui fait croître |
    | Ce que c'est | le corps, une masse | la puissance végétative, une raison |
    | Comment | en recevant de la matière | sans croître elle-même |
    | Sa mesure | il ne l'a pas en lui | elle la porte et la déploie dans le temps |

    ! Pour l'âme, croître va dans l'autre sens : elle ne s'accroît pas en ajoutant, mais en retranchant ce qui s'est ajouté à elle (voir [[g-progres|progrès]]).

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 2, chap. 5 | le corps ne croît pas de lui-même |
    | traité 15, chap. 2 | par ce qui croît et engendre, l'homme est plante |
    | traité 22, chap. 13 | l'âme, indivisible, accompagne le corps qui grandit |
    | traité 26, chap. 4 | la puissance végétative ne croît pas elle-même |
    | traité 28, chap. 11 | la croissance déploie les raisons dans le temps |
    | traité 28, chap. 28 | ce qui fait croître désire faire croître |

    **Voir aussi** : [[g-reproduction|Reproduction]] · [[g-phusis|Nature]] · [[g-logos-spermatikos|Raison séminale]] · [[g-anime-inerte|Animé / Inerte]] · [[g-progres|Progrès]]
