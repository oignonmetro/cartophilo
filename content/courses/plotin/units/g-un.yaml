# Entrée du glossaire de Plotin (skill glossaire), refondue le 2026-10-21 :
# une leçon ; « Au-delà de la réalité » est devenue une sous-entrée, et
# « Comment l'Un produit » est passée dans g-procession. Les cartes sur
# l'axiome du traité 9 (g-un-l1-q1, q3) sont laissées à g-unite, qui les
# double. Citations vérifiées sur la GF (V, 4, 1 ; VI, 9, 1 ; II, 9, 1 ;
