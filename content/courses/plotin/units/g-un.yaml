id: g-un
title: Un (`hen`)
subtitle: Le principe absolument simple, au-delà de la réalité
icon: infinity
color: violet
lessons:
- id: g-un-l1
  title: Pourquoi il faut un premier principe absolument simple
  notes: |-
    **L'Un est le sommet du système de Plotin, et tout le reste en dépend : avant de dire ce qu'il est, il faut comprendre pourquoi Plotin ne peut pas s'en passer.** Son existence n'est pas un article de foi : elle est la conclusion d'un argument qui part de l'expérience la plus ordinaire.

    __**Être, c'est être un.**__ Le [[traite9|traité 9]] s'ouvre sur un axiome : « C'est en vertu de l'unité que tous les êtres sont des êtres » (chap. 1, l. 1). Plotin le rend évident par des exemples : {yellow}il n'y a pas d'armée, si elle n'est pas une, pas de chœur ni de troupeau, pas de maison ni de navire{/yellow} ; dispersez les soldats ou démontez les planches, et la chose n'est plus. **Ce qui fait qu'une chose est cette chose, c'est l'unité qui en tient les parties.**

    __**Or ce qui est multiple ne se donne pas son unité.**__ Les planches ne s'assemblent pas seules en navire : leur unité leur vient d'autre chose qu'elles. Donc __tout ce qui est composé dépend d'un principe qui l'unifie__, et ce principe, s'il était lui-même composé, demanderait à son tour un unificateur. Pour que la série ne soit pas sans fin, il faut un terme qui ne soit plus composé du tout : {green}**un principe absolument simple**{/green}. Le [[traite7|traité 7]] en donne la raison en une phrase : « ce qui n'est pas premier a besoin de ce qui est avant lui, et ce qui n'est pas simple a besoin des éléments simples qui sont en lui pour exister à partir d'eux » (chap. 1, l. 10-15).

    __**Ce premier ne peut pas être l'Intellect.**__ C'est le point où Plotin se sépare d'{sky}Aristote{/sky}, et des platoniciens de son temps, qui plaçaient au sommet une pensée qui se pense elle-même. {red}Toute pensée est au moins double{/red} : il y a ce qui pense et ce qui est pensé, même quand l'un et l'autre coïncident. L'Intellect est donc un {violet}**« un-multiple »**{/violet} ([[traite7|traité 7]], chap. 1, l. 21-22) ; il contient en outre la multitude des Formes. {coral}Puisqu'il est multiple, il dépend de ce qui le rend un : le premier est donc *avant* la pensée.{/coral}

    **Ce premier, Plotin l'appelle l'Un** (*hen*), et aussi **le Bien** (*agathon*) : l'Un, parce qu'il est ce qui fait être un ; le Bien, parce que tout ce qui est se tourne vers lui comme vers ce dont il dépend. Avec l'{violet}Intellect{/violet} et l'{violet}Âme{/violet}, il forme les trois {violet}**hypostases**{/violet}, les trois niveaux de réalité qui ont rang de principes ([[traite10|traité 10]], V, 1).

    ! L'argument ne dit pas que l'Un est la plus grande des choses : il dit que, sans un principe qui ne soit pas composé, aucune chose composée ne tiendrait ensemble.

    ! Ne pas confondre le refus de faire de l'Intellect le premier avec un mépris de la pensée : l'Intellect reste, après l'Un, ce qu'il y a de plus haut ; il n'est simplement pas simple.
  points:
  - id: g-un-l1-q1
    sentence: "« C'est en vertu de l'___ que tous les êtres sont des êtres » : c'est sur cet axiome que s'ouvre le traité 9 (VI, 9), consacré au Bien ou à l'Un (chap. 1, l. 1)."
    answer: unité
    alt: ["unite"]
