    sentence: L'Un, parfait et totalement autarcique, ne manque de rien et n'a besoin ni de penser, ni de vouloir, ni d'agir ; c'est par la seule ___ de sa puissance que la réalité découle de lui.
    answer: surabondance
    alt: []
