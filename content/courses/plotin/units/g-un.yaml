- id: g-un-l3
  title: Comment l'Un produit sans changer
  notes: |-
    **Reste la difficulté la plus aiguë : si l'Un est parfait et ne manque de rien, pourquoi produit-il quelque chose, et comment le fait-il sans changer ?** Un principe qui changerait en produisant ne serait plus simple ; un principe qui ne produirait rien laisserait le reste inexpliqué.

    __**Il produit parce qu'il est parfait, non parce qu'il manque.**__ Ce qui est parfait ne reste pas stérile : sa plénitude déborde. L'Un est la {violet}« puissance de toutes choses »{/violet} (*dunamis pantôn*, [[traite7|traité 7]], chap. 2, l. 38), non au sens d'une capacité qui attendrait d'être réalisée, comme chez Aristote, mais au sens d'une **puissance pleinement active, qui surabonde**. Il ne veut rien, ne calcule rien : la réalité découle de lui comme une conséquence de ce qu'il est.

    __**Toute chose a deux actes.**__ « En chaque chose, il y a un acte qui appartient à la réalité et un acte qui provient de la réalité » ([[traite7|traité 7]], chap. 2, l. 27-28). Le premier est la chose même ; le second en découle nécessairement, mais il est autre qu'elle. {yellow}Le feu{/yellow} le montre : il est chaud en lui-même, et il chauffe ce qui l'entoure **sans rien perdre** de sa chaleur propre. {coral}L'Intellect est l'acte second de l'Un : il vient de lui sans que l'Un sorte de lui-même.{/coral}

    __**L'image du centre dit la même chose autrement.**__ {yellow}Un cercle tient sa forme de son centre{/yellow} : les rayons convergent vers lui, et c'est par eux qu'il se manifeste. Mais « le centre n'est ni les rayons ni le cercle, mais il est le père du cercle et des rayons » ([[traite39|traité 39]], chap. 18, l. 22-23). **Le centre engendre sans se diviser, il reste un point, et le cercle entier dépend de lui sans qu'il dépende du cercle.** Ainsi de l'Un et de l'Intellect, qui, « répandu, déployé et suspendu à lui », en reçoit d'être Intellect.

    | Image | Ce qu'elle fait voir |
    | le feu | produire sans rien perdre |
    | le centre | engendrer sans se diviser |

    ! Les images ne doivent pas faire croire à un écoulement de matière ou à une perte : l'Un ne s'appauvrit pas en produisant, et ce qui vient de lui est une trace, non une part de lui.

    ! La procession n'est pas un événement dans le temps : l'Intellect ne commence pas d'exister un jour, il dépend de l'Un de toute éternité, comme le cercle de son centre.
  points:
