id: g-un
title: Un
subtitle: Le principe absolument simple, au-delà de l'être
icon: infinity
color: violet
lessons:
- id: g-un-l1
  title: L'Un
  notes: |-
    Chez Plotin, l'**Un** (aussi appelé le **Bien**) est la première des trois **hypostases** de son système, un niveau de réalité complet et autosuffisant qui ne se réduit à aucun autre. Son existence n'est pas un postulat dogmatique mais répond à une nécessité logique : tout composé dépend d'un principe antérieur non composé, une unité pure et originelle, faute de quoi la pure multiplicité, incapable de se fonder elle-même, ne serait jamais rien.

    - Un être n'existe qu'à la mesure où il est __un__ : une armée n'existe que tant qu'elle reste une armée, un navire ou le corps d'un vivant perdent leur nature et se défont dès qu'ils perdent leur unité intégrative. C'est dans __VI, 9__, le traité que Plotin consacre au Bien ou à l'Un, qu'il énonce l'axiome : « C'est en vertu de l'unité que tous les êtres sont des êtres ».
    - L'Intellect non plus ne peut occuper ce premier rang, contre Aristote qui y plaçait une Pensée se pensant elle-même (`noēsis noēseōs`) : toute intellection distingue un sujet qui pense et un objet pensé, ce que Plotin appelle un **« un-multiple »**, et ce qui est deux ou multiple ne peut être absolument premier. L'Intellect contient de plus la totalité des Formes intelligibles, une pluralité qui suppose à son tour un principe antérieur, plus simple encore, dont elle tienne son unité.
    - Une cause doit être supérieure à son effet et ne rien posséder, sous une forme déterminée, de ce qu'elle engendre : si l'Un était l'être, la forme ou la pensée, il serait une chose particulière et limitée. Il doit donc être __au-delà de l'être__ (`epekeina tēs ousias`), sans qu'aucun manque ne l'y pousse : parfait et autarcique, c'est par la seule **surabondance** de sa puissance (`dunamis pantōn`) que la réalité découle de lui, sans qu'il subisse le moindre changement.
    - Plotin illustre cette production sans changement, la **procession**, par l'image du feu : l'**acte premier**, l'essence interne du feu qui demeure en lui-même, se distingue de l'**acte second**, la chaleur qu'il rayonne hors de lui sans en être diminué.
      une autre image compare l'Un au centre immobile d'un cercle, dont l'Intellect et l'Âme seraient des cercles concentriques : le centre n'a besoin ni des rayons ni de la circonférence, mais le cercle entier dépend de lui pour s'ordonner.

    ! Dire que l'Un « est » quelque chose reviendrait à le déterminer, donc à le limiter : toute détermination introduit une dualité entre le sujet et ses propriétés. C'est pourquoi Plotin le dit « au-delà de l'être », non le premier des étants mais la condition sans laquelle rien ne pourrait être quoi que ce soit.
  points:
  - id: g-un-l1-1
    sentence: On appelle ___, chez Plotin, un niveau de réalité complet et autosuffisant, qui ne se réduit à aucun autre et possède sa propre activité propre ; l'Un, l'Intellect et l'Âme en sont les trois, dans son système.
    answer: hypostase
    alt: []
  - id: g-un-l1-2
    sentence: Le postulat de l'existence de l'Un, chez Plotin, ne relève pas d'une profession de foi dogmatique ; ce principe premier, aussi appelé ___, est la pierre d'angle logique et métaphysique de tout son système.
    answer: le Bien
    alt: []
  - id: g-un-l1-3
    sentence: Selon l'axiome que Plotin énonce au tout début du traité qu'il consacre au Bien ou à l'Un, c'est en vertu de l'___ que tous les êtres sont des êtres.
    answer: unité
    alt: []
  - id: g-un-l1-4
    sentence: L'axiome selon lequel c'est en vertu de l'unité que tous les êtres sont des êtres, Plotin l'énonce au tout début de ___, le traité qu'il consacre au Bien ou à l'Un.
    answer: VI, 9
    alt: []
  - id: g-un-l1-5
    sentence: Pour Plotin, un être n'existe qu'à la mesure où il est un ; une armée n'existe que tant qu'elle reste une armée, un navire ou le corps d'un vivant perdent leur nature et se défont dès qu'ils perdent leur ___.
    answer: unité intégrative
    alt: []
  - id: g-un-l1-6
    sentence: Contre Aristote, qui plaçait au premier rang une Pensée se pensant elle-même, Plotin objecte que toute intellection distingue un sujet qui pense et un objet pensé, une dualité qu'il nomme un ___.
    answer: un-multiple
    alt: []
  - id: g-un-l1-7
    sentence: L'Intellect contient la totalité des Formes intelligibles ; cette pluralité suppose donc, selon Plotin, un principe antérieur et plus ___ encore, dont l'Intellect tienne son unité.
    answer: simple
    alt: []
  - id: g-un-l1-8
    sentence: Selon la théorie plotinienne de la causalité, une cause doit être supérieure à son effet et ne rien posséder, sous une forme déterminée, de ce qu'elle ___.
    answer: engendre
    alt: []
  - id: g-un-l1-9
    sentence: L'expression grecque, translittérée, qu'emploie Plotin pour dire que l'Un est « au-delà de l'être » est ___.
    answer: epekeina tēs ousias
    alt: []
  - id: g-un-l1-10
    sentence: Parce qu'être quelque chose de particulier supposerait déjà une composition entre cette chose et ce qui la distingue du reste, l'Un n'est pas le premier des étants mais ce que Plotin qualifie d'« ___ ».
    answer: au-delà de l'être
    alt: []
  - id: g-un-l1-11
    sentence: C'est par la seule surabondance de sa puissance illimitée, que Plotin nomme en grec ___, que la réalité découle de l'Un sans qu'il subisse le moindre changement.
    answer: dunamis pantōn
    alt: []
  - id: g-un-l1-12
    sentence: L'Un, parfait et totalement autarcique, ne manque de rien et n'a besoin ni de penser, ni de vouloir, ni d'agir ; c'est par la seule ___ de sa puissance que la réalité découle de lui.
    answer: surabondance
    alt: []
  - id: g-un-l1-13
    sentence: Le mouvement par lequel l'Un produit toute la réalité sans changer ni se diviser se nomme, chez Plotin, la ___.
    answer: procession
    alt: ["émanation"]
  - id: g-un-l1-14
    sentence: Dans l'image du feu, Plotin distingue l'acte premier, l'essence interne du feu qui demeure en lui-même, de l'___, la chaleur qu'il rayonne hors de lui sans en être diminué.
    answer: acte second
    alt: []
  - id: g-un-l1-15
    sentence: Dans l'image du cercle, l'Un est comparé au centre immobile, tandis que l'Intellect et l'Âme sont comme des cercles concentriques qui tournent autour de lui ; le cercle entier dépend du centre, mais celui-ci n'a besoin ni des rayons ni de la ___.
    answer: circonférence
    alt: []
