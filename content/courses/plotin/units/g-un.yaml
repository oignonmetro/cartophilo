id: g-un
title: Un
subtitle: Le principe absolument simple, au-delà de l'être
icon: infinity
color: violet
lessons:
- id: g-un-l1
  title: L'Un, principe au-delà de l'être
  notes: |-
    Chez Plotin, l'**Un** est le principe d'où procède toute la réalité, sans que rien ne le précède ni ne le compose : il est la première des trois **hypostases** de son système, avec l'Intellect et l'Âme qui en procèdent à leur tour.

    - Une **hypostase** est un niveau de réalité complet et autosuffisant, qui ne se réduit à aucun autre et possède sa propre activité propre. Les trois hypostases ne sont donc pas trois attributs d'une même chose, ni trois aspects d'un seul être qu'on regarderait sous des angles différents, mais bien trois réalités distinctes, liées par un rapport de dépendance.
    - L'Un n'est pas __le premier des êtres__, le plus élevé d'une série de choses qui sont : être quelque chose de particulier, ce serait déjà être composé de cette chose et de ce qui la distingue du reste, donc ne plus être absolument un. C'est pourquoi Plotin le dit « au-delà de l'être » : non un étant parmi d'autres, fût-il souverain, mais la condition sans laquelle rien ne pourrait être quoi que ce soit.
    - L'Un ne produit pas l'Intellect à la façon dont un artisan produit un objet, par un acte délibéré et réfléchi : ce serait lui prêter une activité de raisonnement et de choix qui suppose déjà une __distance__ entre lui-même et ce qu'il produit, alors que rien ne saurait s'interposer en lui entre son essence et son activité.
    - Ce mouvement, par lequel une réalité inférieure procède d'une réalité supérieure sans que celle-ci s'en trouve amoindrie, se nomme **procession** ou **émanation** : Plotin l'illustre par l'image du feu, dont la chaleur diffusée autour de lui ne retranche rien à la chaleur propre du foyer.
    - Chez l'Un, cette activité procréatrice est un __débordement__ nécessaire de sa propre plénitude, comme une source déborde simplement parce qu'elle est pleine, sans qu'il y ait à proprement parler de décision d'en déborder.

    ! Prendre l'Un pour le sommet d'une échelle d'étants, ou pour un créateur qui choisit de produire, sont deux contresens équivalents : les deux lui prêtent une détermination ou une délibération qui supposeraient déjà en lui la composition qu'il exclut.
  points:
  - id: g-un-l1-1
    sentence: On appelle ___, chez Plotin, un niveau de réalité complet et autosuffisant, qui ne se réduit
      à aucun autre et possède sa propre activité propre ; l'Un, l'Intellect et l'Âme en sont les trois,
      dans son système.
    answer: hypostase
  - id: g-un-l1-2
    sentence: Parce qu'être quelque chose de particulier supposerait déjà une composition entre cette
      chose et ce qui la distingue du reste, l'Un n'est pas le premier des étants mais ce que Plotin qualifie
      d'« ___ ».
    answer: au-delà de l'être
  - id: g-un-l1-3
    sentence: Prêter à l'Un un acte délibéré et réfléchi comparable à celui d'un artisan ou d'un démiurge
      est un contresens, car cela supposerait une ___ entre l'Un et ce qu'il produit, alors que rien ne
      s'interpose en lui entre son essence et son activité.
    answer: distance
  - id: g-un-l1-4
    sentence: Le mouvement par lequel une réalité inférieure procède d'une réalité supérieure sans que
      celle-ci s'en trouve amoindrie ni changée s'appelle, chez Plotin, la ___.
    answer: procession
    alt: ["émanation"]
  - id: g-un-l1-5
    sentence: Plotin illustre la procession par l'image du feu, dont la chaleur diffusée autour de lui
      ne retranche rien à la chaleur propre du ___.
    answer: foyer
  - id: g-un-l1-6
    sentence: Chez l'Un, ce que Plotin appelle son activité procréatrice s'apparente à un ___ nécessaire
      de sa propre plénitude, comparable à la manière dont une source déborde simplement parce qu'elle
      est pleine, sans qu'il y ait à proprement parler de décision d'en déborder.
    answer: débordement
  - id: g-un-l1-7
    sentence: L'Un, l'Intellect et l'Âme ne sont pas trois attributs d'une même chose ni trois aspects
      d'un seul être qu'on regarderait sous des angles différents, mais bien trois réalités ___, liées
      entre elles par un rapport de dépendance.
    answer: distinctes
