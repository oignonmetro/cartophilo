- id: g-un-l2
  title: Au-delà de la réalité, pourquoi on ne peut rien dire de l'Un
  notes: |-
    **Une fois établi qu'il faut un principe simple, Plotin en tire une conséquence vertigineuse : de ce principe, on ne peut rien dire.** Ce n'est pas une confession d'ignorance, c'est la suite logique de sa simplicité.

    __**Dire ce qu'une chose est, c'est déjà la diviser.**__ Toute phrase de la forme « X est P » distingue {violet}un sujet{/violet} et {violet}ce qu'on en dit{/violet}. Si l'Un était l'être, la pensée, la beauté, il serait {red}un sujet doté de propriétés{/red}, donc composé, donc plus premier. C'est pourquoi le [[traite7|traité 7]] dit qu'il n'y a de lui « ni discours ni science », formule du {sky}*Parménide* (142a){/sky}, et qu'il est « au-delà de la réalité » (chap. 1, l. 9-10), formule de la {sky}*République* (VI, 509b){/sky}, en grec *epekeina tês ousias*.

    __**Pour la même raison, il ne possède rien de ce qu'il produit.**__ On croirait qu'une cause doit contenir ce qu'elle donne. Plotin répond : « il n'est pas nécessaire que ce qui donne possède ce qu'il donne : il faut plutôt considérer dans de tels cas ce qui donne comme supérieur, et ce qui est donné comme inférieur à ce qui donne » ([[traite38|traité 38]], chap. 17, l. 3-5). **L'Un donne la vie, la forme et la pensée sans être vie, forme ni pensée** : s'il était l'une d'elles, il ne pourrait les donner toutes.

    __**Même le nom d'« Un » est approximatif.**__ Il ne dit pas une propriété de l'Un, il nie en lui toute multiplicité. Plotin l'appelle aussi {violet}« le Premier »{/violet}, et le désigne volontiers par des {yellow}pronoms{/yellow} (« lui », « celui-là ») qui le montrent sans le définir.

    ! « Au-delà de la réalité » ne veut pas dire « néant » : l'Un n'est pas moins que l'être, il est ce sans quoi rien ne serait. Il n'est pas le premier des étants, mais la condition pour qu'il y ait des étants.

    ! L'Un ne se pense pas lui-même : se penser supposerait une dualité entre le penseur et le pensé. Il n'est pas pour autant dans l'inconscience d'une chose inerte : il est au-dessus de la pensée, non au-dessous.
  points:
  - id: g-un-l2-q1
    sentence: "Dire ce qu'une chose est, c'est y distinguer un sujet et ce qu'on en dit ; c'est pourquoi il n'y a de l'Un, selon une formule du *Parménide* (142a) reprise par le traité 7, « ni ___ ni science »."
    answer: discours
    alt: []
