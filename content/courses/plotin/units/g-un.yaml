id: g-un
title: Un (`hen`)
subtitle: Le premier principe, absolument simple, qui fait que chaque chose est une et dont tout vient, sans être aucune d'elles
icon: book
color: coral
lessons:
- id: g-un-l1
  title: Un
  notes: |-
    Chez Plotin, l'{violet}**Un**{/violet} est le {green}premier principe, absolument simple{/green} : ce qui fait que chaque chose est une, et d'où toutes viennent, {pink}sans qu'il soit lui-même aucune d'elles{/pink}.

    __**Il faut un principe absolument simple.**__ Être, c'est être un : une armée, une maison, un navire ne sont qu'en tant qu'ils sont unis (voir [[g-unite|unité]]). Or ce qui est multiple ne se donne pas son unité : les planches ne s'assemblent pas seules en navire. Tout composé dépend donc d'un principe qui l'unifie ; et si ce principe était composé, il en faudrait un autre, et ainsi sans fin. Il faut un terme qui ne soit plus composé du tout, car « ce qui n'est pas premier a besoin de ce qui est avant lui, et __ce qui n'est pas simple a besoin des éléments simples__ qui sont en lui pour exister à partir d'eux » ([[traite7|traité 7]], chap. 1). **L'existence de l'Un n'est pas un article de foi : c'est la conclusion d'un argument.**

    __**Ce premier ne peut pas être l'Intellect.**__ Toute pensée est au moins double, le pensant et le pensé : l'{violet}[[g-intellect|Intellect]]{/violet} est un « un-multiple », et dépend de ce qui le rend un. Le premier est donc avant la pensée, non au-dessous d'elle : il est [[g-au-dela-de-l-etre|au-delà de la réalité]], et donne ce qu'il n'a pas.

    __**L'Un et le Bien sont une seule nature.**__ Plotin l'appelle aussi le {violet}[[g-agathon|Bien]]{/violet}. Les deux noms ne lui attribuent rien : « chaque fois que nous parlons de "l'Un" et que nous parlons du "Bien", il faut penser à cette nature et il faut la déclarer "une". Ce faisant, __nous ne lui attribuons rien__, mais nous la rendons manifeste à nous-mêmes » ([[traite33|traité 33]], chap. 1). Il est l'Un parce qu'il fait être un ; il est le Bien parce que tout se tourne vers lui. Mais il ne l'est pas pour lui-même : « Ce n'est donc pas pour lui-même qu'il est le Bien, mais __pour les autres choses__ ; car celles-ci ont besoin du Bien, alors que lui, il n'a pas besoin de lui-même » ([[traite38|traité 38]], chap. 41).

    __**Il produit sans changer, et il est cause de lui-même.**__ Parfait, il ne manque de rien ; c'est pourquoi tout vient de lui par surabondance, sans qu'il change ni s'appauvrisse : c'est la [[g-procession|procession]]. Et il ne dépend de rien : il est « __cause de lui-même__, qui est lui-même de lui-même et par lui-même » ([[traite39|traité 39]], chap. 14). Cela ne veut pas dire qu'il se précède ou se fabrique : seulement qu'**aucune cause extérieure ne le fait être ce qu'il est**, ni le hasard, ni la nécessité.

    ! L'argument ne dit pas que l'Un est la plus grande des choses : il dit que, sans un principe qui ne soit pas composé, aucune chose composée ne tiendrait ensemble.

    __**Passages clefs.**__

    | Passage | Ce qu'il établit |
    | traité 7, chap. 1 | ce qui n'est pas simple dépend du simple |
    | traité 33, chap. 1 | l'Un et le Bien, une seule nature |
    | traité 38, chap. 41 | le Bien pour les autres, non pour lui |
    | traité 39, chap. 14 | il est cause de lui-même |

    **Voir aussi** : [[g-au-dela-de-l-etre|Au-delà de la réalité]] · [[g-procession|Procession]] · [[g-unite|Unité]] · [[g-intellect|Intellect]] · [[g-agathon|Bien]] · [[g-henosis|Hénose]]
