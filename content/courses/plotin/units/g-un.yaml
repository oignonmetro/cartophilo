  points:
  - id: g-un-l1-q2
    sentence: "L'axiome « C'est en vertu de l'unité que tous les êtres sont des êtres » ouvre le traité ___, *Sur le Bien ou l'Un*."
    answer: 9 (VI, 9)
    alt: ["9", "VI, 9"]
  - id: g-un-l1-q4
    sentence: "Le premier ressort de l'argument est que ce qui est multiple ne se donne pas son unité : les planches ne s'assemblent pas seules en navire. Par conséquent, tout ce qui est composé dépend d'un principe qui l'___."
    answer: unifie
    alt: []
  - id: g-un-l1-q5
    sentence: "Si le principe qui unifie le composé était lui-même composé, il lui faudrait un autre unificateur, et ainsi sans fin ; pour arrêter la série, il faut un principe absolument ___."
    answer: simple
    alt: []
  - id: g-un-l1-q6
    sentence: "« Ce qui n'est pas premier a besoin de ce qui est avant lui, et ce qui n'est pas simple a besoin des ___ qui sont en lui pour exister à partir d'eux » (traité 7, chap. 1, l. 10-15)."
    answer: éléments simples
    alt: ["elements simples"]
  - id: g-un-l1-q7
    sentence: "« Ce qui n'est pas premier a besoin de ___, et ce qui n'est pas simple a besoin des éléments simples qui sont en lui pour exister à partir d'eux » (traité 7, chap. 1, l. 10-15)."
    answer: ce qui est avant lui
    alt: []
  - id: g-un-l1-q8
    sentence: "Contre Aristote, qui plaçait au sommet une pensée se pensant elle-même, Plotin objecte que toute pensée est au moins ___ : il y a le pensant et le pensé."
    answer: double
    alt: ["deux"]
  - id: g-un-l1-q9
    sentence: "Parce qu'en lui le pensant et le pensé font deux, et qu'il contient la multitude des Formes, l'Intellect est pour Plotin un « ___ », qui ne peut être le premier principe (traité 7, chap. 1, l. 21-22)."
    answer: un-multiple
    alt: ["un multiple"]
  - id: g-un-l1-q10
    sentence: "Puisque l'Intellect est multiple, il dépend de ce qui le rend un : le premier principe est donc, pour Plotin, ___ la pensée."
    answer: avant
    alt: ["au-dessus de", "au-delà de"]
  - id: g-un-l1-2
    sentence: Le postulat de l'existence de l'Un, chez Plotin, ne relève pas d'une profession de foi dogmatique ; ce principe premier, aussi appelé ___, est la pierre d'angle logique et métaphysique de tout son système.
    answer: le Bien
    alt: []
  - id: g-un-l1-q11
    sentence: "On appelle ___, chez Plotin, chacun des trois niveaux de réalité qui ont rang de principes : l'Un, l'Intellect et l'Âme (traité 10)."
    answer: hypostase
    alt: ["hypostases"]
  - id: g-un-l1-r1
    sentence: "Les noms d'Un et de Bien ne qualifient pas le principe : « Ce faisant, nous ne lui attribuons rien, mais nous la rendons ___ à nous-mêmes » (traité 33, chap. 1)."
    answer: manifeste
    alt: []
  - id: g-un-l1-r2
    sentence: "« Ce n'est donc pas pour lui-même qu'il est le Bien, mais pour les ___ ; car celles-ci ont besoin du Bien, alors que lui, il n'a pas besoin de lui-même » (traité 38, chap. 41)."
    answer: autres choses
    alt: []
  - id: g-un-l1-r3
    sentence: "Aucune cause extérieure ne fait l'Un : il est « cause de ___, qui est lui-même de lui-même et par lui-même » (traité 39, chap. 14)."
    answer: lui-même
    alt: ["lui meme"]
