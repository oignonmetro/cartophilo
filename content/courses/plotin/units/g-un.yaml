id: g-un
title: Un
subtitle: Le principe absolument simple, au-delà de l'être
icon: infinity
color: violet
lessons:
- id: g-un-l1
  title: L'Un
  notes: |-
    Chez Plotin, l'**Un** est le principe d'où procède toute la réalité, sans que rien ne le précède ni ne le compose : il est la première des trois **hypostases** de son système, avec l'Intellect et l'Âme qui en procèdent à leur tour.

    - Une **hypostase** est un __niveau de réalité complet et autosuffisant__, qui ne se réduit à aucun autre et possède sa propre activité propre. Les {yellow}trois hypostases{/yellow} ne sont donc pas {red}trois attributs d'une même chose{/red}, ni {red}trois aspects d'un seul être qu'on regarderait sous des angles différents{/red}, mais bien {green}trois réalités distinctes{/green}, liées par un rapport de dépendance.
    ! L'Un n'est pas {red}le premier des êtres{/red}, car dès qu'une chose « est », elle est déterminée : elle possède des contours, des qualités et des attributs (par exemple être juste, être grand, être un esprit). Toute __détermination __implique une __limite __et une __distinction interne entre le sujet et ses propriétés__. Si l'on disait que l'Un « est un être », on introduirait en lui une dualité : d'un côté l'Un, de l'autre son attribut d'« être ». C'est pourquoi Plotin le dit **« au-delà de l'être »** : non un étant parmi d'autres, fût-il souverain, mais la condition sans laquelle rien ne pourrait être quoi que ce soit.
  points:
  - id: g-un-l1-1
    sentence: On appelle ___, chez Plotin, un niveau de réalité complet et autosuffisant, qui ne se réduit à aucun autre et possède sa propre activité propre ; l'Un, l'Intellect et l'Âme en sont les trois, dans son système.
    answer: hypostase
    alt: []
  - id: g-un-l1-2
    sentence: Parce qu'être quelque chose de particulier supposerait déjà une composition entre cette chose et ce qui la distingue du reste, l'Un n'est pas le premier des étants mais ce que Plotin qualifie d'« ___ ».
    answer: au-delà de l'être
    alt: []
  - id: g-un-l1-3
    sentence: Prêter à l'Un un acte délibéré et réfléchi comparable à celui d'un artisan ou d'un démiurge est un contresens, car cela supposerait une ___ entre l'Un et ce qu'il produit, alors que rien ne s'interpose en lui entre son essence et son activité.
    answer: distance
    alt: []
  - id: g-un-l1-4
    sentence: Le mouvement par lequel une réalité inférieure procède d'une réalité supérieure sans que celle-ci s'en trouve amoindrie ni changée s'appelle, chez Plotin, la ___.
    answer: procession
    alt: ["émanation"]
  - id: g-un-l1-5
    sentence: Plotin illustre la procession par l'image du feu, dont la chaleur diffusée autour de lui ne retranche rien à la chaleur propre du ___.
    answer: foyer
    alt: []
  - id: g-un-l1-6
    sentence: Chez l'Un, ce que Plotin appelle son activité procréatrice s'apparente à un ___ nécessaire de sa propre plénitude, comparable à la manière dont une source déborde simplement parce qu'elle est pleine, sans qu'il y ait à proprement parler de décision d'en déborder.
    answer: débordement
    alt: []
  - id: g-un-l1-7
    sentence: L'Un, l'Intellect et l'Âme ne sont pas trois attributs d'une même chose ni trois aspects d'un seul être qu'on regarderait sous des angles différents, mais bien trois réalités ___, liées entre elles par un rapport de dépendance.
    answer: distinctes
    alt: []
