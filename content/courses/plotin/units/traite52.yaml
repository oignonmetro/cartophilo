- id: traite52-l5
  title: "« L'âme gouverne l'univers selon une raison » (chap. 16-18)"
  notes: |-
    **Une formule à expliquer** (chap. 13, 3-4) : l'âme gouverne l'univers **selon une raison** (*lógos*). En quel sens ? Plotin rejette trois interprétations (16, 6-36).

    | Interprétation | Pourquoi elle est rejetée |
    | l'âme produit chaque chose, sans être responsable des conséquences | l'âme serait la cause de tout sans en répondre |
    | l'âme produit chaque chose, et elle est responsable des conséquences | l'âme serait la cause de tous les maux |
    | l'âme se préoccupe sans cesse de corriger son œuvre | elle serait accaparée par un travail sans fin |

    **La solution** (16, 36 à chap. 18) : l'âme **envoie les raisons** et cesse ensuite d'agir ; ce sont les raisons qui mettent la matière en mouvement et la forcent à tendre vers le meilleur. L'âme **produit sans réflexion**, grâce aux raisons qu'elle reçoit de l'Intellect.

    **D'où vient l'univers** : il ne résulte pas d'un choix réfléchi du démiurge, mais de la **nécessité** d'un monde sensible à la suite du monde intelligible. La puissance intelligible se déverse sur une réalité inférieure, jusqu'à la matière, qui n'a plus la puissance de produire. Le **démiurge véritable est l'Intellect**, qui contient les Formes : il les envoie dans la partie supérieure de l'âme du monde, qui les reçoit à l'état de « raisons ». Celles-ci s'écoulent dans la partie inférieure, qui correspond à la **nature** et à la puissance végétative : elle est le dernier producteur.

    **Les maux** (chap. 18, 1-8) : ils sont nécessaires et utiles, car ils viennent de réalités antérieures.

    ! L'âme du monde ne délibère pas : elle reçoit les raisons de l'Intellect et les laisse agir par sa partie inférieure.
  points:
  - id: traite52-l5-p1
    sentence: "Au chapitre 16, Plotin explique en quel sens l'âme gouverne l'univers selon une ___ (traité 52, 16, 4-5)."
    answer: "raison"
    alt: ["lógos", "logos"]
  - id: traite52-l5-p2
