- id: traite52-l2
  title: "Réfuter les principes astrologiques (chap. 3-6)"
  notes: |-
    **Les astres ne sont pas influencés par les lieux** (chap. 3-4) : les astrologues disent que les planètes sont influencées par les signes du **zodiaque** et par les configurations qui les relient. Plotin répond que les sept planètes se trouvent **sous** le zodiaque, non en lui, et que chacune circule sur sa propre orbite, qui les sépare les unes des autres.

    **Bonnes ou mauvaises ?** (chap. 3-5) : selon les astrologues, une planète devient bonne ou mauvaise selon qu'elle se lève, se couche, est au milieu du ciel, accompagne le soleil ou la lune. Plotin répond que ces déterminations n'existent que pour les hommes : leur cause est l'**horizon**, qui limite notre champ de vision. Les planètes sont toujours dans le ciel et ne subissent aucune altération en montant ou en descendant.

    **Les phases de la lune** (chap. 5) : elles n'ont aucun effet sur la lune elle-même, qui a toujours un hémisphère éclairé et un autre obscur. Pour une planète placée plus haut, la lune est pleine quand elle est nouvelle pour nous. Alors, quelle pleine lune est bénéfique, celle qu'on voit de la terre ou celle que voit cette planète ?

    **Un seul principe** (chap. 6) : il est absurde que les astres obéissent à des configurations et se préoccupent de produire des milliers de vivants. L'univers obéit à **un seul et unique principe**.

    | Idée astrologique | Réponse de Plotin |
    | les planètes sont dans le zodiaque | elles sont sous le zodiaque, sur des orbites différentes |
    | elles sont bonnes ou mauvaises selon leur lever, leur coucher | ces états tiennent à l'horizon, donc à notre regard |
    | les phases de la lune ont des effets | la lune a toujours un hémisphère éclairé |

    ! Plotin ne refuse pas les astres : il retire à l'astrologie l'idée que le ciel serait un théâtre d'humeurs. Les astres sont des dieux impassibles, toujours égaux à eux-mêmes.
  points:
