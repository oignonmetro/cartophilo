- id: traite52-l3
  title: "La divination par les astres : l'univers est un seul vivant"
  notes: |-
    **Une divination possible** (chap. 7-8) : les astres sont comme des **lettres** qui s'inscrivent sans cesse dans le ciel ; ils annoncent l'avenir à qui sait les déchiffrer. Plotin suit le *Timée* (40c-d) : les danses des corps célestes, leurs conjonctions, leurs oppositions, leurs rétrogradations sont des signes des choses à venir.

    **Pourquoi la prédiction est possible** (chap. 7) : parce que l'univers est un **vivant unique**, régi par un seul ordre, qui unit toutes choses sans rien laisser au hasard. C'est la **sympathie** universelle, ici nommée « **conspiration** » : toutes les parties sont reliées.

    **L'âme, responsable de l'ordre** (chap. 8) : cette cohésion est due à l'âme, qui produit l'univers par sa puissance merveilleuse. Les astres ne sont pas des parties insignifiantes : ils annoncent tout, parce qu'ils s'inscrivent dans cet ordre.

    **Signes ou causes ?** Le traité 28 disait que les astres sont tantôt causes et signes, tantôt seulement signes. Ici, Plotin retient surtout la lecture comme **signes** : l'univers est un tout, où une partie annonce l'autre sans toujours la produire.

    ! Pour Plotin, lire l'avenir dans les astres suppose un univers ordonné, non des astres tout-puissants : les lettres du ciel se lisent parce qu'un même ordre relie le tout.
  points:
  - id: traite52-l3-p1
