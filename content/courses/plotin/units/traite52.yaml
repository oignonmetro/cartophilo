id: traite52
title: "Traité 52 (II, 3) : Si les astres agissent"
subtitle: "Les astres annoncent, ils ne produisent pas tout"
icon: compass
color: sky
lessons:
- id: traite52-l1
  title: "L'astrologie et sa critique : le point de départ"
  notes: |-
    **L'astrologie vient de Chaldée** : elle entre en Grèce au IIIᵉ siècle av. J.-C. par le prêtre **Bérose**, et ne devient une discipline grecque, mêlée de mathématiques et de géométrie, qu'au temps d'**Hipparque**. Les philosophes l'ont mal accueillie : Panétius la rejetait, **Cicéron** la réfute longuement (*De la divination*, II), Sextus écrit *Contre les astrologues*. Les stoïciens eux-mêmes la défendent mollement ; seul Diogène de Babylone la soutient en partie. Elle est en revanche très présente chez les gnostiques.

    **Une position de compromis** : au temps de Plotin, tous les milieux consultent les horoscopes. Plotin ne nie pas l'astrologie en bloc, et ne lui donne pas trop de prise : elle est **possible**, mais dans un autre cadre théorique que celui des astrologues. Il critique ses fondements pour arriver à une doctrine rationnelle de l'action des astres.

    **Des traités qui préparent celui-ci** : le traité 3 (III, 1, *Sur le destin*) refuse le déterminisme astral ; le traité 28 (IV, 4) explique l'action des astres par la **sympathie** de l'univers, mais reste trop complaisant avec l'astrologie. Le traité 52 achève de la réfuter.

    **La thèse, d'entrée** (chap. 1, 1-6) : **les astres annoncent tout, mais ils ne produisent pas tout**, contrairement à ce que croit la majorité des hommes.

    **La doctrine astrologique** (chap. 1, 6-28) : les planètes produiraient pauvreté, richesse, santé, maladie, mais aussi laideur, beauté, vices et vertus. Elles seraient bien ou mal disposées selon leur lieu, leurs « centres », leur déclin, et se « voient » ou non dans telle « configuration ».

    **Une alternative** (chap. 2) : les astres sont inanimés ou animés.

    | Si les astres sont… | Alors… |
    | inanimés | ils ne produisent que des variations corporelles : chaud, froid |
    | animés | ils ne peuvent vouloir nous faire du mal, eux qui sont divins et impassibles |

    ! La question n'est pas de croire ou non aux astres, mais de savoir ce qu'ils peuvent causer : des effets sur les corps, jamais les vices ni les vertus.
