- id: traite52-l4
  title: "L'influence des astres est limitée (chap. 9-15)"
  notes: |-
    **Deux âmes en l'homme** (chap. 9) : s'il s'abandonne à son **âme inférieure**, l'homme devient esclave du destin et des signes des astres ; s'il s'abandonne au divin, rien ne peut être maître de lui. Plotin s'appuie sur la *République* (le fuseau et les Moires, X, 616c-621a) et sur le *Timée* (41a-d) : l'âme supérieure vient du **démiurge**, l'âme inférieure des **dieux subalternes**, les astres.

    **Les astres n'agissent que sur le corps** (chap. 10-12) : ils ne produisent que des affections corporelles, et ils ne sont pas seuls en jeu : l'âme humaine a des caractères propres et s'expose aux coups du sort. Une fois descendue ici-bas, l'influence astrale se corrompt en se mélangeant à la **matière** ; les influences se mêlent entre elles sans altérer la nature première de ceux qui les reçoivent.

    **Un principe général** (chap. 13) : **rien ne peut modifier la raison qui dirige l'univers** ; une chose ne peut qu'en améliorer une autre, ou la rendre pire, sans changer sa nature. Un cheval naît d'un cheval, un homme d'un homme : les astres ne produisent pas ces natures, ils ne peuvent que les améliorer ou les corrompre.

    **Un facteur parmi d'autres** (chap. 14) : les astres ne sont qu'un des nombreux facteurs qui jouent sur la pauvreté, la richesse, la gloire et les magistratures.

    **Le choix de l'âme** (chap. 15) : l'âme supérieure choisit sa vie **avant** de venir dans l'univers, y compris les circonstances (lieu de naissance, corps, parents). Elle y vient avec une nature et des tendances propres que les astres ne peuvent changer au fond.

    | Part de l'âme | Origine | Rapport aux astres |
    | supérieure | le démiurge | leur échappe |
    | inférieure | les dieux subalternes, les astres | lie l'homme à la nécessité du monde |

    ! Les astres sont donc réels, mais pas souverains : ils agissent sur ce qui, en nous, est du monde.
  points:
  - id: traite52-l4-p1
