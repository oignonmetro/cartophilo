- id: traite52-l6
  title: "Repérage : le plan du traité 52"
  notes: |-
    **Le traité 52 pose sa thèse et la doctrine astrologique (chap. 1), réfute l'astrologie (chap. 2-6), admet une divination par les astres (chap. 7-8), limite leur influence (chap. 9-15), puis explique la formule « l'âme gouverne l'univers selon une raison » (chap. 16-18).**

    | Moment | Lieu | Ce qui s'y joue |
    | les astres annoncent tout, ne produisent pas tout | 1, 1-6 | la thèse |
    | la doctrine astrologique | 1, 6-28 | planètes, lieux, configurations |
    | astres inanimés ou animés | chap. 2 | corps ou mal volontaire |
    | lieux et configurations | chap. 3-4 | zodiaque, orbites, horizon |
    | chaud, froid, phases lunaires | chap. 5 | pas d'effets |
    | un seul principe | chap. 6 | l'univers obéit à un seul ordre |
    | la divination possible | chap. 7 | l'univers est un vivant unique |
    | l'âme, responsable de l'ordre | chap. 8 | les astres annoncent tout |
    | âme inférieure, âme supérieure | chap. 9 | l'homme esclave ou libre |
    | le principe général | chap. 13 | la raison ne peut être modifiée |
    | le choix de l'âme | chap. 15 | avant de venir dans l'univers |
    | trois interprétations rejetées | 16, 6-36 | l'âme et la raison |
    | la solution | 16, 36-54 | les raisons envoyées, l'âme cesse d'agir |
    | l'âme produit sans réflexion | chap. 17 | grâce aux raisons de l'Intellect |
    | les maux | chap. 18 | nécessaires et utiles |

    Les repères suivent le plan détaillé qui accompagne la traduction. Le tableau se joue en repérage : remettre les moments dans l'ordre du traité, puis replacer leurs repères, puis en écrire un.

    ! Le traité 52 compte dix-huit chapitres, en cinq parties : la thèse, la réfutation, la divination, la limite de l'influence, l'explication de la raison.
