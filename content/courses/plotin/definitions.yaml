# Définitions du glossaire de Plotin (voir src/content/definitions.ts) : une
# par entrée, sous l'identifiant de son unité. Chacune est un attribut, sans
# majuscule ni point final, qui complète « la notion est … » : elle s'affiche
# au survol d'un renvoi, se cite dans un rappel par [def] (ou [def:g-…]), sert
# de sous-titre à l'entrée et nourrit le grand exercice de révision du glossaire.
# La notion et le terme grec se lisent dans le titre de l'entrée.

g-agathon: 'le {green}nom de l''Un en tant que toutes choses sont suspendues à lui et le désirent{/green}, lui qui n''a besoin de rien'
g-amant: 'un {green}naturel{/green}, une disposition de l''âme à être frappée par la beauté, l''un des trois chemins par lesquels une âme peut remonter'
g-ame: 'la {green}troisième hypostase{/green} : l''image de l''Intellect, une et multiple, qui fait vivre et ordonne le monde sensible {pink}sans s''y morceler{/pink}'
g-ame-non-descendue: 'la partie la plus haute de notre [[g-ame|âme]], qui {green}reste toujours dans l''intelligible{/green} alors même que l''âme anime un corps'
g-amour: 'l''{green}acte d''une âme tendue vers le bien{/green}, qui a le rang de l''âme qui l''engendre, dieu, démon ou passion'
g-au-dela-de-l-etre: 'le statut de l''[[g-un|Un]], qui n''est {pink}aucune des choses qui sont{/pink}, pas même la plus haute, et dont {green}on ne peut rien dire, sinon qu''il donne ce qu''il n''a pas{/green}'
g-beaute: 'la {green}forme qui unifie une matière{/green}, et, plus haut, la lumière que le Bien répand sur la forme et qui la rend aimable'
g-bonheur: 'la {green}vie parfaite elle-même{/green}, celle de l''{violet}[[g-intellect|Intellect]]{/violet}, que l''homme peut posséder, et même être'
g-degres-de-vie: 'les sens du mot « vie », {green}ordonnés du plus clair au plus obscur{/green}, chacun étant l''image du précédent'
g-desir: 'l''{green}élan de toute chose vers le Bien{/green}, plus ancien que la pensée elle-même, et qui la fait naître'
g-dunamis: 'un {green}pouvoir actif de produire{/green}, dont l''Un, « puissance de toutes choses », est le sommet, à l''opposé de la matière, qui est « en puissance » toutes choses'
g-eidos: 'la {green}réalité qui fait être chaque chose ce qu''elle est{/green}, vivante et pensante dans l''[[g-intellect|Intellect]], dont les formes des corps ne sont que les images'
g-energeia: 'l''{green}activité d''une réalité déjà parfaite{/green}, tout entière en acte dans l''intelligible, et double en chaque chose, acte qu''elle est et acte qui en sort'
g-epistrophe: 'le mouvement par lequel ce qui procède {green}se retourne vers son principe{/green}, et qui le constitue'
g-eternite: 'la {green}vie de l''être intelligible{/green}, tout entière à la fois, à laquelle rien ne manque et rien n''advient'
g-henosis: 'le {green}terme de toute la remontée{/green}, où l''âme ne regarde plus l''[[g-un|Un]] mais ne fait plus qu''un avec lui, {pink}au-delà de toute connaissance{/pink}'
g-homoiosis: 'le fait de {green}devenir semblable à ce qui n''a pas de vertus{/green}, comme l''image ressemble à son modèle sans lui être pareille'
g-hule: 'le {green}substrat sans qualité ni grandeur{/green}, impassible, où la procession s''épuise : un non-être véritable, et le mal premier'
g-intellect: 'la {green}seconde hypostase{/green}, née de l''[[g-un|Un]] : la première réalité qui ne soit plus absolument simple, une pensée qui est elle-même toutes les Formes'
g-intellect-amoureux: 'la seconde puissance de l''[[g-intellect|Intellect]] : l''{green}amour par lequel il s''unit au Bien{/green}, au-delà de la pensée'
g-intelligibles-dans-l-intellect: 'les Formes en tant que l''Intellect {green}les est{/green}, au lieu de les contempler comme des objets placés devant lui'
g-logos: 'le {green}principe formateur{/green} par lequel une réalité supérieure s''exprime dans une réalité inférieure, la Forme devenue active, depuis l''Âme jusqu''à la figure des corps'
g-logos-spermatikos: 'la [[g-logos|raison]] qui, dans la semence, {green}contient ensemble tout le vivant à venir{/green} et le forme en se déployant dans la matière'
g-matiere-intelligible: 'le {green}substrat commun aux Formes{/green} de l''Intellect, produit par l''Altérité, qui les distingue sans les séparer'
g-multiplicite-intelligible: 'la multiplicité de l''[[g-intellect|Intellect]] : {green}une pluralité réelle de Formes{/green}, toutes ensemble et pourtant distinctes'
g-multiplicite-sensible: 'la multiplicité des corps, {pink}des parties hors les unes des autres{/pink}, où {green}la Forme apparaît dispersée sans se diviser{/green}'
g-noesis: 'la pensée de l''[[g-intellect|Intellect]] : {green}une saisie de tout d''un seul coup{/green}, qui n''a rien à chercher parce qu''elle est ce qu''elle pense'
g-noothenai: 'le moment où l''âme {green}pense comme l''Intellect, tout d''un coup{/green}, et devient ce qu''elle pense, entre la vie de l''âme et l''[[g-henosis|hénose]]'
g-ousia: '{green}ce qui est véritablement, l''intelligible{/green}, être, vie et pensée, dont le corps n''a le nom que par homonymie'
g-phusis: 'la {green}puissance la plus basse de l''âme du monde{/green}, une raison qui produit les corps sans les connaître, par le seul fait de contempler'
g-poros-et-penia: 'les parents d''Éros dans le {sky}*Banquet*{/sky}, figures de la {green}raison{/green} et de l''{pink}indétermination{/pink}'
g-procession: 'le mouvement par lequel toute réalité vient de l''[[g-un|Un]], qui la produit {green}par surabondance, sans changer ni s''appauvrir{/green}'
g-steresis: 'l''absence de forme et de raison, que Plotin, contre {sky}Aristote{/sky}, {green}identifie à la matière même{/green}'
g-sundioikesis: 'le fait que notre âme, par sa partie la plus haute, {green}prend part avec l''Âme du monde à l''ordre de l''univers{/green}, {pink}sans y descendre{/pink}'
g-temps: 'la {green}vie de l''âme{/green} qui, détournée de l''[[g-eternite|éternité]], passe d''un acte à un autre'
g-theoria: '{green}ce vers quoi tout tend et d''où tout procède{/green}, de la plante jusqu''à l''Intellect, si bien que produire, c''est contempler'
g-un: 'le {green}premier principe, absolument simple{/green}, qui fait que chaque chose est une, et d''où toutes viennent {pink}sans qu''il soit lui-même aucune d''elles{/pink}'
g-unite: 'ce qui fait qu''une chose est cette chose, car {green}être, c''est être un{/green}'
g-vie: 'l''{green}activité{/green} même des {green}réalités incorporelles{/green}, qui se dit à des degrés différents, depuis l''Intellect jusqu''à la plante'
g-vie-parfaite: 'la vie de l''{violet}[[g-intellect|Intellect]]{/violet}, la seule à laquelle {green}rien ne manque{/green}, dont toutes les autres ne sont que des {pink}images{/pink}'
g-vivant: 'le {green}composé{/green} que l''âme produit en éclairant un corps, auquel appartiennent les affections'
g-vivant-total: 'l''[[g-intellect|Intellect]] lui-même, {green}un vivant qui embrasse tous les vivants{/green}, dont les Formes sont des vies qui pensent'
