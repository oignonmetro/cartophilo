- id: m6-l6
  title: "Mettre l'oracle à l'épreuve"
  notes: |-
    **Socrate vérifie l'interprétation de l'oracle par une enquête : il examine ceux qui passent pour savants et, chaque fois qu'ils ne le sont pas, il « prête main-forte au dieu ».** Il va de-ci de-là, parmi les Athéniens et les étrangers, cherchant quelqu'un de réellement **savant**. Chaque échec confirme, cas après cas, la thèse de l'oracle.

    De cette enquête naît la posture que la littérature secondaire appelle **l'ignorance socratique** : reconnaître son inadéquation en sagesse, tout en jugeant que nul n'est plus sage que celui qui en a conscience. C'est la seule forme de savoir que Socrate revendique.

    ! L'enquête n'est pas une provocation contre les savants : Socrate la présente comme un service rendu au dieu.
  passage:
    label: "23b"
    text: "Or, en allant de-ci de-là, je poursuis ma recherche et, pour comprendre ce qu'a voulu dire le dieu, je cherche à découvrir si, parmi les gens d'Athènes et parmi les étrangers, il ne s'en trouve pas un qui soit savant. Et, chaque fois qu'il me paraît que ce n'est pas le cas, je prête main-forte au dieu en montrant que cet homme n'est pas savant."
  points:
  - id: m6-l6-p2
    sentence: "« Or, en allant de-ci de-là, je poursuis ma recherche et, pour comprendre ce qu'a voulu dire le dieu, je cherche à découvrir si, parmi les gens d'Athènes et parmi les étrangers, il ne s'en trouve pas un qui soit ___. Et, chaque fois qu'il me paraît que ce n'est pas le cas, je prête main-forte au dieu en montrant que cet homme n'est pas savant. »"
