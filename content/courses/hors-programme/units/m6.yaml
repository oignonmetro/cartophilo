lessons:
  - id: m6-l1
    title: "Le danger n'est pas la mesure de l'action juste"
    notes: |
      Dans l'**Apologie**, Platon met en scène le discours de défense de Socrate
      lors de son procès (399 av. J.-C.). Un principe le traverse d'un bout à
      l'autre : celui qui vaut quelque chose ne calcule jamais son action d'après
      le risque qu'elle lui fait courir, mais seulement d'après une question,
      la seule qui compte : **est-elle juste ou injuste ?**

      Socrate illustre ce principe par l'exemple d'Achille, tiré de l'Iliade.
      Thétis avait averti son fils que le venger de la mort de son ami Patrocle
      en tuant Hector lui coûterait la vie, « tout de suite après Hector ».
      Achille passe outre : il fait « si peu de cas du danger, comparé au
      déshonneur ». Socrate revendique la même hiérarchie : le déshonneur d'une
      action injuste pèse plus lourd que n'importe quel péril.
    points:
      - id: m6-l1-p1
        sentence: "Dans l'Apologie (28b-c), l'homme qui vaut quelque chose ne calcule pas si son action met sa vie en danger ; il ne regarde qu'une seule chose : si ce qu'il fait est «___»"
        answer: "juste ou injuste"
        alt: ["juste"]
      - id: m6-l1-p2
        sentence: "Apologie, 28b-c : «À ton avis en tout cas, ce seraient, en effet, de pauvres types tous ces demi-dieux qui ont trouvé la mort devant Troie, et tout particulièrement le fils de Thétis [Achille], qui ___, comparé au déshonneur. Sa mère, qui était une déesse, lui avait tenu, en le voyant tout impatient d'aller tuer Hector, les propos qui, sauf erreur de ma part, sont à peu près les suivants : \"Mon enfant, dit le poète, si tu dois venger le meurtre de ton ami Patrocle et tuer Hector, toi aussi tu mourras, car 'tout de suite après Hector la mort est préparée pour toi'.»"
        answer: "faisait si peu de cas du danger"
        alt: []
      - id: m6-l1-p3
        sentence: "Apologie, 28b-c : «À ton avis en tout cas, ce seraient, en effet, de pauvres types tous ces demi-dieux qui ont trouvé la mort devant Troie, et tout particulièrement le fils de Thétis [Achille], qui faisait si peu de cas du danger, comparé au déshonneur. Sa mère, qui était une déesse, lui avait tenu, en le voyant tout impatient d'aller tuer Hector, les propos qui, sauf erreur de ma part, sont à peu près les suivants : \"Mon enfant, dit le poète, si tu dois venger le meurtre de ton ami ___ et tuer Hector, toi aussi tu mourras, car 'tout de suite après Hector la mort est préparée pour toi'.»"
        answer: "Patrocle"
        alt: []
