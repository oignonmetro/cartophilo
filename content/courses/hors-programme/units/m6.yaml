- id: m6-l5
  title: "Le sens de l'oracle"
  notes: |-
    {green}**Un dieu ne peut mentir : si l'oracle déclare que nul n'est plus savant que Socrate, il faut qu'il veuille dire autre chose, à savoir que le vrai savant, c'est le dieu, et que le savoir humain ne vaut presque rien.**{/green} Socrate tient sa mission d'**Apollon**, par l'intermédiaire de l'oracle de Delphes {sky}(23a-c){/sky}.

    Le passage part du prix de l'enquête : des {red}**inimitiés**{/red} nombreuses et graves, des {red}**calomnies**{/red}, et une réputation, celle de {teal}« savant »{/teal}. {coral}Car ceux qui assistent aux discussions croient Socrate savant dans les matières où il éprouve les autres{/coral}. Le raisonnement devient alors interprétatif : le dieu, par l'oracle, dirait {teal}« le vrai savant, ce soit le dieu, et [...] le savoir que possède l'homme présente peu de valeur, et peut-être même aucune »{/teal}. Le nom de Socrate ne serait qu'un exemple : est {teal}« le plus savant »{/teal} celui qui, comme lui, {teal}« {/teal}a reconnu que réellement il ne vaut rien pour ce qui est du {teal}savoir ».{/teal}

    {green}La sagesse véritable n'appartient donc qu'**au dieu**{/green} ; l'homme, au mieux, peut reconnaître son ignorance. Le nom de {teal}« savant »{/teal} que lui valent ses examens est ainsi {red}un malentendu{/red} : c'est lui qui nourrit l'accusation.

    ! Socrate ne se dit pas savant d'un savoir supérieur : sa seule supériorité est de savoir qu'il ne sait rien qui vaille.
  passage:
    label: "22e-23b"
    text: "C'est précisément cette enquête, Athéniens, qui m'a valu des inimitiés si nombreuses, qui présentaient une virulence et une gravité d'une telle importance qu'elles ont suscité maintes calomnies et m'ont valu de me voir attribuer ce nom, celui de « savant ». Chaque fois, c'est la même chose : ceux qui assistent à la discussion s'imaginent en effet que je suis moi-même savant dans les matières où je mets mon interlocuteur à l'épreuve. Mais, citoyens, il y a bien des chances pour que le vrai savant ce soit le dieu et que, par cet oracle, il ait voulu dire la chose suivante : le savoir que possède l'homme présente peu de valeur, et peut-être même aucune. Et, s'il a parlé de ce Socrate qui est ici devant vous, c'est probablement que, me prenant pour exemple, il a utilisé mon nom, comme pour dire : « Parmi vous, humains, celui-là est le plus savant qui, comme l'a fait Socrate, a reconnu que réellement il ne vaut rien pour ce qui est du savoir. »"
  points:
