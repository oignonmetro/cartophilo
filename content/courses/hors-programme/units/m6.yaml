id: m6
title: "L'Apologie de Socrate"
subtitle: "Platon, Apologie de Socrate, 21a, 23a-b, 28b-c"
icon: page
color: yellow
group: "Socrate : la morale"
intro: |-
  Le discours de défense de Socrate à son procès (399 av. J.-C.), le seul texte de Platon qui ne soit pas un dialogue. Trois passages : l'oracle rendu à Chéréphon (21a), son interprétation et sa mise à l'épreuve (23a-b), l'exemple d'Achille (28b-c).
lessons:
- id: m6-l3
  title: "Un discours continu, et les deux chefs d'accusation"
  notes: |-
    Contrairement à tous les autres dialogues de Platon, bâtis sur des
    questions-réponses, l'Apologie prend la forme d'**un discours continu** :
    c'est un plaidoyer, pas un dialogue.

    L'accusation officielle portée contre Socrate tient en deux chefs :
    **corrompre la jeunesse** et **introduire de nouveaux dieux**. Platon
    suggère que ce préjugé préexistait déjà au procès : la comédie
    d'Aristophane *Les Nuées* montrait Socrate remplacer les dieux
    traditionnels par des explications naturalistes et enseigner à faire
    triompher l'argument le plus faible, préparant ainsi, des années à
    l'avance, les deux chefs d'accusation.
  passage:
    label: "Introduction"
  points:
  - id: m6-l3-p1
    sentence: "Unique parmi les dialogues de Platon, l'Apologie n'est pas un dialogue de questions-réponses mais ___"
    answer: "un discours continu"
    alt: []
  - id: m6-l3-p2
    sentence: "Selon l'accusation officielle portée contre Socrate lors de son procès, il aurait corrompu la jeunesse et introduit ___"
    answer: "de nouveaux dieux"
    alt: []
  - id: m6-l3-p3
    sentence: "En montrant Socrate remplacer les dieux par des explications naturalistes et enseigner à faire triompher l'argument le plus faible, la comédie d'Aristophane intitulée ___ a préparé les deux chefs d'accusation de son procès"
    answer: "les Nuées"
    alt: []
- id: m6-l4
  title: "Ce que Socrate nie avoir enseigné"
  notes: |-
    Face à ces accusations, Socrate commence par nier avoir jamais rien
    enseigné : il désavoue tout intérêt pour la **science de la nature**
    (l'objet des philosophes présocratiques) et pour l'**enseignement de la
    rhétorique** (le métier des sophistes, rémunéré).

    Mais s'il n'a rien enseigné, d'où vient la suspicion qui pèse sur lui ?
    Socrate répond qu'elle vient d'une vie qui parut étrange à ses
    concitoyens, menée en accomplissement de **sa mission**, dont l'origine
    va être précisée.
  passage:
    label: "Introduction"
  points:
  - id: m6-l4-p1
    sentence: "Face aux accusations portées contre lui, Socrate nie avoir jamais rien enseigné et désavoue tout intérêt pour deux domaines : la science de ___ et l'enseignement de la rhétorique"
    answer: "la nature"
