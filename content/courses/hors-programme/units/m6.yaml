    sentence: "« C'est précisément cette enquête, Athéniens, qui m'a valu des inimitiés si nombreuses, qui présentaient une virulence et une gravité d'une telle importance qu'elles ont suscité maintes calomnies et __m'ont valu de me voir attribuer **ce nom**,__ ___. »"
    answer: "celui de « savant »"
