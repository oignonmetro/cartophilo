- id: m6-l7
  title: "Le taon et l'élenchos"
  notes: |-
    Socrate décrit sa mission d'aiguillon moral par {yellow}une image animale : il se compare à **un taon** (30e-31a), dont la piqûre importune mais réveille{/yellow}.

    Sa méthode de questionnement porte un nom, {violet}l'**élenchos**{/violet} [`elenchein`] : le verbe grec dont il dérive signifie {teal}« faire honte »{/teal}, ce qui suggère une première finalité de la méthode : {green}pousser ses concitoyens vers la vertu en leur faisant honte de leur ignorance prétendue{/green}.
  passage:
    label: "Prolongement"
  points:
  - id: m6-l7-p1
    sentence: "Socrate décrit sa **mission d'aiguillon moral** auprès de ses concitoyens par une image animale : __il se compare à__ ___ (30e-31a)"
    answer: "un taon"
    alt: []
  - id: m6-l7-p2
    sentence: "**L'élenchos** a peut-être été développé par Socrate pour faire honte à ses concitoyens et les pousser vers la vertu : __le mot dérive en effet du verbe grec__ ___, qui signifie « faire honte »."
    answer: "elenchein"
    alt: []
- id: m6-l9
  title: "Une défense sincère ou stratégique ?"
  notes: |-
    Sur la vie après la mort, Socrate se présente dans l'Apologie comme
    {violet}**agnostique**{/violet}, alors que d'autres dialogues (comme le
    {sky}*Phédon*{/sky}) le montrent engagé en faveur de l'immortalité de l'âme, une
    tension qui a nourri un débat sur la nature même de ce discours.

    Un commentateur, {sky}**Leibowitz**{/sky}, soutient que la défense de
    Socrate ne serait en réalité pas sincère mais {violet}**ironique**{/violet} : Socrate ne
    chercherait pas vraiment l'acquittement, contrairement à l'objectif
    habituel d'une plaidoirie judiciaire. Ce que semble viser son discours est
    tout autre : {green}faire apparaître **la vérité de sa vie**{/green}, quitte à indisposer
    le jury.

    ! {red}Cette lecture ironique se heurte à un fait stylistique{/red} : alors même que
    Socrate ouvre son discours par le désaveu habituel de tout art oratoire,
    {coral}il parle avec assez de maîtrise pour que son propre discours illustre un{/coral}
    {coral}manuel de **rhétorique** (technique){/coral} : signe, peut-être, qu'il maîtrise
    mieux cet art qu'il ne veut bien le dire.
  passage:
    label: "Prolongement"
  points:
  - id: m6-l9-p1
    sentence: "**Sur la vie après la mort**, __Socrate se présente dans l'Apologie comme__ ___, alors que d'autres dialogues le montrent engagé en faveur de l'immortalité de l'âme"
    answer: "agnostique"
    alt: []
  - id: m6-l9-p2
    sentence: "Selon **Leibowitz**, la défense que Socrate présente à son procès __ne serait pas sincère mais__ ___ : Socrate ne chercherait pas vraiment l'acquittement"
    answer: "ironique"
    alt: []
  - id: m6-l9-p3
    sentence: "**L'objectif habituel d'une plaidoirie judiciaire** est l'acquittement ; __ce que semble viser Socrate est tout autre, à savoir faire apparaître__ ___, quitte à indisposer le jury"
    answer: "la vérité de sa vie"
    alt: []
  - id: m6-l9-p4
    sentence: "Alors même qu'il commence l'Apologie par le **désaveu habituel de tout art oratoire**, __Socrate parle avec assez de maîtrise pour que son discours illustre un manuel de__ ___"
    answer: "(technique) rhétorique"
    alt: []
