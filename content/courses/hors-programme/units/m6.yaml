- id: m6-l5
  title: "Le sens de l'oracle"
  notes: |-
    **Un dieu ne peut mentir : si l'oracle déclare que nul n'est plus savant que Socrate, il faut qu'il veuille dire autre chose, à savoir que le vrai savant, c'est le dieu, et que le savoir humain ne vaut presque rien.** Socrate tient sa mission d'**Apollon**, par l'intermédiaire de l'oracle de Delphes (23a-c).

    Le raisonnement est interprétatif. Ceux qui assistent aux discussions croient Socrate savant dans les matières où il éprouve les autres ; mais le dieu, par l'oracle, dirait {sky}« le vrai savant, ce soit le dieu, et [...] le savoir que possède l'homme présente peu de valeur, et peut-être même aucune »{/sky}. Le nom de Socrate ne serait qu'un exemple : est « le plus savant » celui qui, comme lui, « a reconnu que réellement il ne vaut rien pour ce qui est du savoir ».

    La sagesse véritable n'appartient donc qu'**au dieu** ; l'homme, au mieux, peut reconnaître son ignorance.

    ! Socrate ne se dit pas savant d'un savoir supérieur : sa seule supériorité est de savoir qu'il ne sait rien qui vaille.
  passage:
    label: "23a-b"
    text: "Chaque fois, c'est la même chose : ceux qui assistent à la discussion s'imaginent en effet que je suis moi-même savant dans les matières où je mets mon interlocuteur à l'épreuve. Mais, citoyens, il y a bien des chances pour que le vrai savant ce soit le dieu et que, par cet oracle, il ait voulu dire la chose suivante : le savoir que possède l'homme présente peu de valeur, et peut-être même aucune. Et, s'il a parlé de ce Socrate qui est ici devant vous, c'est probablement que, me prenant pour exemple, il a utilisé mon nom, comme pour dire : « Parmi vous, humains, celui-là est le plus savant qui, comme l'a fait Socrate, a reconnu que réellement il ne vaut rien pour ce qui est du savoir. »"
  points:
