  - id: m6-l2
    title: "Le soin de l'âme et de la vérité plutôt que la richesse"
    notes: |
      Socrate reproche aux Athéniens de courir après la **richesse**, la
      **réputation** et l'**honneur**, sans se soucier ni de la **sagesse**, ni
      de la **vérité**, ni du soin de rendre leur **âme** meilleure : la
      hiérarchie qui organise tout son discours (l'âme avant les biens
      extérieurs) trouve ici sa formulation la plus directe.

      Il en tire une conséquence radicale sur le sort de l'homme bon : rien de
      mauvais ne peut lui arriver, **ni dans la vie, ni dans la mort**, puisque
      seule l'injustice, un mal de l'âme, mérite ce nom, et qu'un homme bon ne la
      commet pas.
    points:
      - id: m6-l2-p1
        sentence: "Dans l'Apologie, Socrate reproche aux Athéniens de courir après la richesse, la réputation et l'honneur sans se soucier de ___, de la vérité, ni du soin de rendre leur âme meilleure"
        answer: "la sagesse"
        alt: []
      - id: m6-l2-p2
        sentence: "Dans l'Apologie, Socrate reproche aux Athéniens de courir après la richesse, la réputation et l'honneur sans se soucier de la sagesse, de ___, ni du soin de rendre leur âme meilleure"
        answer: "la vérité"
        alt: []
      - id: m6-l2-p3
        sentence: "Dans l'Apologie, Socrate reproche aux Athéniens de courir après la richesse, la réputation et l'honneur sans se soucier de la sagesse, de la vérité, ni du soin de rendre leur ___ meilleure"
        answer: "âme"
        alt: []
      - id: m6-l2-p4
        sentence: "Dans l'Apologie, Socrate soutient que rien de mauvais ne peut arriver à ___, ni dans la vie, ni dans la mort"
        answer: "un homme bon"
        alt: []

  - id: m6-l3
    title: "Un discours continu, et les deux chefs d'accusation"
    notes: |
      Contrairement à tous les autres dialogues de Platon, bâtis sur des
      questions-réponses, l'Apologie prend la forme d'**un discours continu** :
      c'est un plaidoyer, pas un dialogue.

      L'accusation officielle portée contre Socrate tient en deux chefs :
      **corrompre la jeunesse** et **introduire de nouveaux dieux**. Platon
      suggère que ce préjugé préexistait déjà au procès : la comédie
      d'Aristophane *Les Nuées* montrait Socrate remplacer les dieux
      traditionnels par des explications naturalistes et enseigner à faire
      triompher l'argument le plus faible, préparant ainsi, des années à
      l'avance, les deux chefs d'accusation.
    points:
      - id: m6-l3-p1
        sentence: "Unique parmi les dialogues de Platon, l'Apologie n'est pas un dialogue de questions-réponses mais ___"
        answer: "un discours continu"
        alt: []
      - id: m6-l3-p2
        sentence: "Selon l'accusation officielle portée contre Socrate lors de son procès, il aurait corrompu la jeunesse et introduit ___"
        answer: "de nouveaux dieux"
        alt: []
      - id: m6-l3-p3
        sentence: "En montrant Socrate remplacer les dieux par des explications naturalistes et enseigner à faire triompher l'argument le plus faible, la comédie d'Aristophane intitulée ___ a préparé les deux chefs d'accusation de son procès"
        answer: "les Nuées"
        alt: []

  - id: m6-l4
    title: "Ce que Socrate nie avoir enseigné"
    notes: |
      Face à ces accusations, Socrate commence par nier avoir jamais rien
      enseigné : il désavoue tout intérêt pour la **science de la nature**
      (l'objet des philosophes présocratiques) et pour l'**enseignement de la
      rhétorique** (le métier des sophistes, rémunéré).

      Mais s'il n'a rien enseigné, d'où vient la suspicion qui pèse sur lui ?
      Socrate répond qu'elle vient d'une vie qui parut étrange à ses
      concitoyens, menée en accomplissement de **sa mission**, dont l'origine
      va être précisée.
    points:
      - id: m6-l4-p1
        sentence: "Face aux accusations portées contre lui, Socrate nie avoir jamais rien enseigné et désavoue tout intérêt pour deux domaines : la science de ___ et l'enseignement de la rhétorique"
        answer: "la nature"
        alt: []
      - id: m6-l4-p2
        sentence: "Face aux accusations portées contre lui, Socrate nie avoir jamais rien enseigné et désavoue tout intérêt pour deux domaines : la science de la nature et l'enseignement de ___"
        answer: "la rhétorique"
        alt: []
      - id: m6-l4-p3
        sentence: "Si Socrate n'a rien enseigné, d'où vient alors la suspicion qui pèse sur lui ? Selon l'Apologie, elle vient de ce qu'il a mené une vie qui parut étrange à ses concitoyens, en accomplissement de ___"
        answer: "sa mission"
        alt: []

  - id: m6-l5
    title: "La mission delphique : le sens du premier oracle"
    notes: |
      Socrate affirme tenir sa mission d'un dieu : **Apollon**, par
      l'intermédiaire de l'oracle de Delphes (23a-c).

      Le passage central (23a-b) tient en deux temps, cités presque mot pour
      mot dans cette leçon. Premier temps, un **raisonnement interprétatif** :
      puisqu'un dieu ne peut mentir, l'oracle qui a déclaré que nul n'était plus
      savant que Socrate doit signifier autre chose que ce qu'il semble dire : {sky}« le vrai savant, ce soit le dieu, et [...] le savoir que possède
      l'homme présente peu de valeur, et peut-être même aucune »{/sky}. Le nom
      de Socrate ne serait alors qu'un exemple, pour dire à travers lui :
      « celui-là est le plus savant qui, comme l'a fait Socrate, a reconnu
      que réellement il ne vaut rien pour ce qui est du savoir. »

      ! Cette citation est testée ici sous plusieurs angles (chaque point
      reprend l'intégralité du passage, seul le trou se déplaçant), afin d'en
      retenir chaque clause avec précision : c'est la méthode que ce cours
      applique systématiquement aux citations jugées importantes.
    points:
      - id: m6-l5-p1
        sentence: "Dans l'Apologie, Socrate affirme tenir d'un dieu la mission qui est à l'origine de son procès : il s'agit d'___ (23a-c)"
        answer: "Apollon"
        alt: []
