- id: "m6-l5"
  title: "Le prix de l'enquête : le nom de « savant »"
  notes: |-
    **L'enquête par laquelle Socrate a voulu comprendre l'oracle lui a valu** {red}**des inimitiés, des calomnies**{/red} **et un nom,** {teal}**« savant »**{/teal}**, qui repose sur un malentendu.**

    **Pourquoi « cette enquête » ?** Socrate vient de raconter comment il a interrogé les hommes politiques, les poètes et les artisans, pour trouver quelqu'un de plus savant que lui et comprendre l'oracle. Chaque fois, il a montré à son interlocuteur qu'il ne savait pas ce qu'il croyait savoir. {red}D'où des inimitiés nombreuses et graves{/red} : personne n'aime être convaincu d'ignorance en public.

    **Pourquoi le nom de « savant » ?** Ceux qui assistent aux discussions raisonnent simplement : {coral}qui réfute un savoir doit le posséder{/coral}. {yellow}Celui qui montre qu'un médecin se trompe passe pour meilleur médecin que lui.{/yellow} Ils croient donc Socrate savant dans les matières où il éprouve les autres.

    **Pourquoi est-ce un malentendu ?** Socrate {amber}éprouve{/amber} le savoir des autres sans prétendre en avoir un : réfuter n'est pas savoir. Mais le nom de {teal}« savant »{/teal} le range parmi les sophistes et les physiciens, et c'est lui qui {red}nourrit l'accusation{/red}.

    ! Socrate ne se plaint pas d'être {red}haï{/red} : il explique pourquoi on le {green}croit savant{/green}, et pourquoi on a tort.
  passage:
    label: "22e-23b"
    text: "C'est précisément cette enquête, Athéniens, qui m'a valu des inimitiés si nombreuses, qui présentaient une virulence et une gravité d'une telle importance qu'elles ont suscité maintes calomnies et m'ont valu de me voir attribuer ce nom, celui de « savant ». Chaque fois, c'est la même chose : ceux qui assistent à la discussion s'imaginent en effet que je suis moi-même savant dans les matières où je mets mon interlocuteur à l'épreuve."
  points:
  - id: "m6-l5-p10"
    sentence: "« C'est précisément cette **enquête**, Athéniens, qui m'a valu ___, qui présentaient une virulence et une gravité d'une telle importance qu'elles ont suscité maintes calomnies et m'ont valu de me voir attribuer ce nom, celui de « savant ». »"
    answer: "des inimitiés si nombreuses"
    alt: []
  - id: "m6-l5-p11"
    sentence: "« C'est précisément cette enquête, Athéniens, qui m'a valu des inimitiés si nombreuses, qui présentaient une **virulence et une gravité** d'une telle importance __qu'elles ont suscité__ ___ et m'ont valu de me voir attribuer ce nom, celui de « savant ». »"
    answer: "maintes calomnies"
    alt: []
