    answer: "elenchein"
    alt: []
- id: m6-l9
  title: "Une défense sincère ou stratégique ?"
  notes: |-
    Sur la vie après la mort, Socrate se présente dans l'Apologie comme
    {amber}**agnostique**{/amber}, alors que d'autres dialogues (comme le
    *Phédon*) le montrent engagé en faveur de l'immortalité de l'âme, une
    tension qui a nourri un débat sur la nature même de ce discours.

    Un commentateur, {sky}**Leibowitz**{/sky}, soutient que la défense de
    Socrate ne serait en réalité pas sincère mais **ironique** : Socrate ne
    chercherait pas vraiment l'acquittement, contrairement à l'objectif
    habituel d'une plaidoirie judiciaire. Ce que semble viser son discours est
    tout autre : faire apparaître **la vérité de sa vie**, quitte à indisposer
    le jury.

    ! Cette lecture ironique se heurte à un fait stylistique : alors même que
    Socrate ouvre son discours par le désaveu habituel de tout art oratoire,
    il parle avec assez de maîtrise pour que son propre discours illustre un
    manuel de **rhétorique** (technique) : signe, peut-être, qu'il maîtrise
    mieux cet art qu'il ne veut bien le dire.
  passage:
    label: "Prolongement"
  points:
  - id: m6-l9-p1
    sentence: "Sur la vie après la mort, Socrate se présente dans l'Apologie comme ___, alors que d'autres dialogues le montrent engagé en faveur de l'immortalité de l'âme"
    answer: "agnostique"
    alt: []
  - id: m6-l9-p2
    sentence: "Selon Leibowitz, la défense que Socrate présente à son procès ne serait pas sincère mais ___ : Socrate ne chercherait pas vraiment l'acquittement"
    answer: "ironique"
    alt: []
  - id: m6-l9-p3
    sentence: "L'objectif habituel d'une plaidoirie judiciaire est l'acquittement ; ce que semble viser Socrate est tout autre, à savoir faire apparaître ___, quitte à indisposer le jury"
    answer: "la vérité de sa vie"
    alt: []
  - id: m6-l9-p4
    sentence: "Alors même qu'il commence l'Apologie par le désaveu habituel de tout art oratoire, Socrate parle avec assez de maîtrise pour que son discours illustre un manuel de ___"
    answer: "(technique) rhétorique"
