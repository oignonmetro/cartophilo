- id: m6-p21a
  title: "L'oracle rendu à Chéréphon"
  notes: |-
    **Tout part d'une question posée à Delphes : existe-t-il quelqu'un de plus savant que Socrate ? La Pythie répond que non.** C'est **Chéréphon**, ami d'enfance de Socrate, connu pour l'impétuosité qu'il mettait en tout, qui osa consulter l'oracle. Socrate prévient les cris du jury : la réponse a de quoi choquer.

    C'est cet oracle que toute la suite interprète (23a-b) puis met à l'épreuve (23b) : il est l'origine de la **mission** de Socrate, qui explique la vie étrange que lui reprochent ses concitoyens, et donc le procès.

    ! L'oracle ne dit pas que Socrate est savant : il dit que personne n'est plus savant que lui. Toute l'interprétation joue sur cet écart.
  passage:
    label: "21a"
    text: "Vous savez bien aussi quelle sorte d'individu était Chéréphon, quelle impétuosité il mettait dans tout ce qu'il entreprenait. En particulier, un jour qu'il s'était rendu à Delphes, il osa consulter l'oracle pour lui demander - et n'allez pas, je le répète, m'interrompre par vos cris, citoyens - si, en fait, il pouvait exister quelqu'un de plus savant que moi. Or la Pythie répondit qu'il n'y avait personne de plus savant."
  points:
