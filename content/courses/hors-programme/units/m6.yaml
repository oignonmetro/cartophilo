- id: m6-l2
  title: "Le soin de l'âme et de la vérité plutôt que la richesse"
  notes: |-
    Socrate reproche aux Athéniens de courir après la {red}**richesse**{/red}, la
    {red}**réputation**{/red} et l'{red}**honneur**{/red}, sans se soucier ni de la {green}**sagesse**{/green}, ni
    de la {green}**vérité**{/green}, ni du soin de rendre leur {green}**âme**{/green} meilleure : {amber}la{/amber}
    {amber}hiérarchie qui organise tout son discours (l'âme avant les biens{/amber}
    {amber}extérieurs){/amber} trouve ici sa formulation la plus directe.

    Il en tire une conséquence radicale sur le sort de l'homme bon : rien de
    mauvais ne peut lui arriver, {green}**ni dans la vie, ni dans la mort**{/green}, {coral}puisque{/coral}
    {coral}seule l'injustice, un mal de l'âme, mérite ce nom, et qu'un homme bon ne la{/coral}
    {coral}commet pas{/coral}.
  passage:
    label: "Prolongement"
