  - id: m6-l6
    title: "La mission delphique : mettre le dieu à l'épreuve"
    notes: |
      Second temps du même passage (23a-b, qui se poursuit) : Socrate raconte
      comment il a vérifié cette interprétation par une **enquête empirique**.
      Il va de-ci de-là, cherchant si quelqu'un, parmi les Athéniens ou les
      étrangers, est réellement **savant**. Chaque fois que ce n'est pas le cas,
      il « prête main-forte au dieu en montrant que cet homme n'est pas
      savant », c'est-à-dire qu'il confirme, cas après cas, la thèse de
      l'oracle.
