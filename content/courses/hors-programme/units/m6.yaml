- id: "m6-l2"
  title: "Le soin de l'âme, le taon et l'élenchos"
  notes: |-
    **La hiérarchie qui organise tout le discours, l'âme avant les biens extérieurs, se formule directement dans la suite de l'*Apologie*.**

    Socrate reproche aux Athéniens de courir après la {red}**richesse**{/red}, la {red}**réputation**{/red} et l'{red}**honneur**{/red}, sans se soucier ni de la {green}**sagesse**{/green}, ni de la {green}**vérité**{/green}, ni du soin de rendre leur {green}**âme**{/green} meilleure : {amber}la hiérarchie qui organise tout son discours (l'âme avant les biens extérieurs){/amber} trouve ici sa formulation la plus directe.

    Il en tire une conséquence radicale sur le sort de l'homme bon : rien de mauvais ne peut lui arriver, {green}**ni dans la vie, ni dans la mort**{/green}, {coral}puisque seule l'injustice, un mal de l'âme, mérite ce nom, et qu'un homme bon ne la commet pas{/coral}.

    **Le taon.** Socrate décrit sa mission d'aiguillon moral par {yellow}une image animale : il se compare à **un taon** (30e-31a), dont la piqûre importune mais réveille{/yellow}. La cité est comme un grand cheval paresseux, que le taon empêche de s'endormir.

    **L'élenchos.** Sa méthode de questionnement porte un nom, {violet}l'**élenchos**{/violet} [`elenchein`] : le verbe grec dont il dérive signifie {teal}« faire honte »{/teal}, ce qui suggère une première finalité de la méthode : {green}pousser ses concitoyens vers la vertu en leur faisant honte de leur ignorance prétendue{/green}.

    ! Le soin de l'âme n'est pas {red}un mépris du corps{/red} : c'est {green}un ordre de priorité{/green}, les biens extérieurs n'ayant de valeur que par l'âme qui en use.
