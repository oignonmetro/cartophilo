- id: m6-l1
  title: "Le danger n'est pas la mesure de l'action juste"
  notes: |-
    Dans l'**Apologie**, Platon met en scène le discours de défense de Socrate
    lors de son procès (399 av. J.-C.). Un principe le traverse d'un bout à
    l'autre : {green}celui qui vaut quelque chose ne calcule jamais son action d'après{/green}
    {green}le risque qu'elle lui fait courir, mais seulement d'après une question{/green},
    la seule qui compte : {amber}**est-elle juste ou injuste ?**{/amber}

    Socrate illustre ce principe par {yellow}l'exemple d'Achille, tiré de l'Iliade{/yellow}.
    Thétis avait averti son fils que le venger de la mort de son ami Patrocle
    en tuant Hector lui coûterait la vie, {teal}« tout de suite après Hector »{/teal}.
    {coral}Achille passe outre{/coral} : il fait {teal}« {/teal}si peu de cas du danger, comparé au
    {teal}déshonneur ».{/teal} Socrate revendique la même hiérarchie : {green}le déshonneur d'une{/green}
    {green}action injuste pèse plus lourd que n'importe quel péril{/green}.

    ! Achille n'est pas cité pour sa bravoure guerrière : Socrate retient la hiérarchie qu'il incarne, le déshonneur pesant plus que le danger.
  passage:
    label: "28b-c"
    text: "À ton avis en tout cas, ce seraient, en effet, de pauvres types tous ces demi-dieux qui ont trouvé la mort devant Troie, et tout particulièrement le fils de Thétis [Achille], qui faisait si peu de cas du danger, comparé au déshonneur. Sa mère, qui était une déesse, lui avait tenu, en le voyant tout impatient d'aller tuer Hector, les propos qui, sauf erreur de ma part, sont à peu près les suivants : \"Mon enfant, dit le poète, si tu dois venger le meurtre de ton ami Patrocle et tuer Hector, toi aussi tu mourras, car 'tout de suite après Hector la mort est préparée pour toi'."
  points:
  - id: m6-l1-p2
    sentence: "« À ton avis en tout cas, ce seraient, en effet, de pauvres types tous ces demi-dieux qui ont trouvé la mort devant Troie, et tout particulièrement __le fils de Thétis [Achille], qui__ ___, **comparé au déshonneur**. Sa mère, qui était une déesse, lui avait tenu, en le voyant tout impatient d'aller tuer Hector, les propos qui, sauf erreur de ma part, sont à peu près les suivants : \"Mon enfant, dit le poète, si tu dois venger le meurtre de ton ami Patrocle et tuer Hector, toi aussi tu mourras, car 'tout de suite après Hector la mort est préparée pour toi'. »"
    answer: "faisait si peu de cas du danger"
    alt: []
