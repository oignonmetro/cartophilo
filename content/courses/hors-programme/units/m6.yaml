id: "m6"
title: "L'Apologie de Socrate"
subtitle: "Platon, Apologie de Socrate, 21a, 22e-23c, 28b-c"
icon: "page"
color: "yellow"
group: "Socrate : la morale"
depth: "normale"
intro: |-
  Le discours de défense de Socrate à son procès (399 av. J.-C.), le seul texte de Platon qui ne soit pas un dialogue. Trois passages : l'oracle rendu à Chéréphon (21a), son interprétation et sa mise à l'épreuve (23a-b), l'exemple d'Achille (28b-c).
lessons:
- id: "m6-l3"
  title: "Le procès, l'accusation et le plan"
  notes: |-
    **L'*Apologie de Socrate* est le discours de défense que Platon prête à Socrate lors de son procès, en 399 av. J.-C.** Contrairement à tous les autres dialogues de Platon, bâtis sur des questions-réponses, elle prend la forme d'{green}**un discours continu**{/green} : c'est un plaidoyer, pas un dialogue.

    **L'accusation.** L'accusation officielle tient en deux chefs : {red}**corrompre la jeunesse**{/red} et {red}**introduire de nouveaux dieux**{/red}. Platon suggère que ce préjugé préexistait au procès : la comédie d'{sky}Aristophane{/sky}, {sky}*Les Nuées*{/sky}, montrait Socrate remplacer les dieux traditionnels par des explications naturalistes et enseigner à faire triompher l'argument le plus faible, {coral}préparant ainsi, des années à l'avance, les deux chefs d'accusation{/coral}.

    **La défense.** Socrate commence par nier avoir jamais rien enseigné : il désavoue tout intérêt pour la {violet}**science de la nature**{/violet} (l'objet des {sky}philosophes présocratiques{/sky}) et pour l'{violet}**enseignement de la rhétorique**{/violet} (le métier, rémunéré, des {sky}sophistes{/sky}). Mais s'il n'a rien enseigné, d'où vient la suspicion qui pèse sur lui ? {coral}Socrate répond qu'elle vient d'une vie qui parut étrange à ses concitoyens{/coral}, menée en accomplissement de {violet}**sa mission**{/violet}, dont les textes qui suivent disent l'origine.

    **Les passages étudiés.**

    | Mouvement | Lieu | Ce qui s'y joue |
    | raconter l'oracle rendu à Chéréphon | 21a | La Pythie déclare que personne n'est plus savant que Socrate : c'est l'origine de sa mission. |
    | dire le prix de l'enquête, puis interpréter l'oracle | 22e-23b | L'enquête lui vaut haines et réputation de savant ; l'oracle signifie que seul le dieu est savant et que le plus savant des hommes est celui qui sait que son savoir ne vaut rien. |
    | mettre l'oracle à l'épreuve | 23b-c | Socrate examine ceux qui passent pour savants et, en montrant qu'ils ne le sont pas, sert le dieu, au prix de sa fortune. |
    | refuser de mesurer l'action au danger | 28b-c | Comme Achille, l'homme de valeur ne regarde que si son action est juste, non si elle le met en danger. |

    ! La défense de Socrate n'est pas {red}une réfutation point par point{/red} des chefs d'accusation : elle raconte {green}une vie{/green}, et en donne la raison.
