- id: "m6-p21a"
  title: "L'oracle rendu à Chéréphon"
  notes: |-
    {amber}**Tout part d'une question posée à Delphes : existe-t-il quelqu'un de plus savant que Socrate ? La Pythie répond que non.**{/amber}

    **Pourquoi Chéréphon, et son « impétuosité » ?** C'est {sky}**Chéréphon**{/sky}, ami d'enfance de Socrate, connu pour l'impétuosité qu'il mettait en tout, qui osa consulter l'oracle. Le trait de caractère {amber}explique l'audace de la question{/amber} : il fallait de l'emportement pour demander au dieu si quelqu'un surpassait son ami.

    **Pourquoi « n'allez pas […] m'interrompre par vos cris » ?** Socrate prévient le tumulte du jury : la réponse a {red}de quoi choquer{/red}, puisqu'elle semble le placer au-dessus de tous. Il sait qu'elle sera prise pour de l'orgueil.

    **Pourquoi l'oracle compte-t-il ?** C'est cet oracle que toute la suite interprète {sky}(22e-23b){/sky} puis met à l'épreuve {sky}(23b-c){/sky} : il est l'origine de la {violet}**mission**{/violet} de Socrate, qui explique la vie étrange que lui reprochent ses concitoyens, et donc le procès. {coral}Socrate répond à l'accusation d'impiété en se réclamant d'Apollon.{/coral}

    ! L'oracle ne dit pas que Socrate est savant : il dit que {green}personne n'est plus savant que lui{/green}. Toute l'interprétation joue sur cet écart.
  passage:
    label: "21a"
    text: "Vous savez bien aussi quelle sorte d'individu était Chéréphon, quelle impétuosité il mettait dans tout ce qu'il entreprenait. En particulier, un jour qu'il s'était rendu à Delphes, il osa consulter l'oracle pour lui demander - et n'allez pas, je le répète, m'interrompre par vos cris, citoyens - si, en fait, il pouvait exister quelqu'un de plus savant que moi. Or la Pythie répondit qu'il n'y avait personne de plus savant."
  points:
  - id: "m6-l7-p3"
    sentence: "« Vous savez bien aussi __quelle sorte d'individu était__ ___, quelle **impétuosité** il mettait dans tout ce qu'il entreprenait. En particulier, un jour qu'il s'était rendu à Delphes, il osa consulter l'oracle pour lui demander - et n'allez pas, je le répète, m'interrompre par vos cris, citoyens - si, en fait, il pouvait exister quelqu'un de plus savant que moi. Or la Pythie répondit qu'il n'y avait personne de plus savant. »"
    answer: "Chéréphon"
