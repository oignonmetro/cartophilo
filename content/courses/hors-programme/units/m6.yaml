id: m6
title: "L'Apologie de Socrate"
subtitle: "Platon, Apologie de Socrate, 21a, 22e-23c, 28b-c"
icon: page
color: yellow
group: "Socrate : la morale"
intro: |-
  Le discours de défense de Socrate à son procès (399 av. J.-C.), le seul texte de Platon qui ne soit pas un dialogue. Trois passages : l'oracle rendu à Chéréphon (21a), son interprétation et sa mise à l'épreuve (23a-b), l'exemple d'Achille (28b-c).
lessons:
- id: m6-l3
  title: "Un discours continu, et les deux chefs d'accusation"
  notes: |-
    Contrairement à tous les autres dialogues de Platon, bâtis sur des
    questions-réponses, l'Apologie prend la forme d'{green}**un discours continu**{/green} :
    c'est un plaidoyer, pas un dialogue.

    L'accusation officielle portée contre Socrate tient en deux chefs :
    {red}**corrompre la jeunesse**{/red} et {red}**introduire de nouveaux dieux**{/red}. Platon
    suggère que ce préjugé préexistait déjà au procès : la comédie
    d'{sky}Aristophane{/sky} {sky}*Les Nuées*{/sky} montrait Socrate remplacer les dieux
    traditionnels par des explications naturalistes et enseigner à faire
    triompher l'argument le plus faible, {coral}préparant ainsi, des années à{/coral}
    {coral}l'avance, les deux chefs d'accusation{/coral}.
  passage:
    label: "Introduction"
  points:
  - id: m6-l3-p1
    sentence: "**Unique parmi les dialogues de Platon**, l'Apologie __n'est pas un dialogue de questions-réponses mais__ ___"
    answer: "un discours continu"
    alt: []
  - id: m6-l3-p2
    sentence: "Selon l'**accusation officielle** portée contre Socrate lors de son procès, __il aurait corrompu la jeunesse et introduit__ ___"
    answer: "de nouveaux dieux"
    alt: []
  - id: m6-l3-p3
    sentence: "En montrant Socrate **remplacer les dieux par des explications naturalistes** et enseigner à faire triompher l'argument le plus faible, __la comédie d'Aristophane intitulée__ ___ a préparé les deux chefs d'accusation de son procès"
    answer: "les Nuées"
    alt: []
- id: m6-l4
  title: "Ce que Socrate nie avoir enseigné"
  notes: |-
    Face à ces accusations, Socrate commence par nier avoir jamais rien
    enseigné : il désavoue tout intérêt pour la {violet}**science de la nature**{/violet}
    (l'objet des {sky}philosophes présocratiques{/sky}) et pour l'{violet}**enseignement de la{/violet}
    {violet}rhétorique**{/violet} (le métier des {sky}sophistes{/sky}, rémunéré).

    Mais s'il n'a rien enseigné, d'où vient la suspicion qui pèse sur lui ?
    {coral}Socrate répond qu'elle vient d'une vie qui parut étrange à ses{/coral}
    {coral}concitoyens{/coral}, menée en accomplissement de {violet}**sa mission**{/violet}, dont l'origine
    va être précisée.
  passage:
    label: "Introduction"
  points:
  - id: m6-l4-p1
    sentence: "Face aux accusations portées contre lui, Socrate nie avoir jamais rien enseigné et désavoue tout intérêt pour **deux domaines** : __la science de__ ___ et l'enseignement de la rhétorique"
    answer: "la nature"
    alt: []
  - id: m6-l4-p2
    sentence: "Face aux accusations portées contre lui, Socrate nie avoir jamais rien enseigné et désavoue tout intérêt pour **deux domaines** : la science de la nature et __l'enseignement de__ ___"
    answer: "la rhétorique"
    alt: []
  - id: m6-l4-p3
    sentence: "Si Socrate n'a rien enseigné, d'où vient alors la suspicion qui pèse sur lui ? Selon l'Apologie, elle vient de ce qu'il a mené **une vie qui parut étrange à ses concitoyens**, __en accomplissement de__ ___"
    answer: "sa mission"
    alt: []
- id: m6-p21a
  title: "L'oracle rendu à Chéréphon"
  notes: |-
    {amber}**Tout part d'une question posée à Delphes : existe-t-il quelqu'un de plus savant que Socrate ? La Pythie répond que non.**{/amber} C'est {sky}**Chéréphon**{/sky}, ami d'enfance de Socrate, connu pour l'impétuosité qu'il mettait en tout, qui osa consulter l'oracle. Socrate prévient les cris du jury : la réponse a de quoi choquer.

    C'est cet oracle que toute la suite interprète {sky}(23a-b){/sky} puis met à l'épreuve {sky}(23b){/sky} : il est l'origine de la {violet}**mission**{/violet} de Socrate, qui explique la vie étrange que lui reprochent ses concitoyens, et donc le procès.

    ! L'oracle ne dit pas que Socrate est savant : il dit que {green}personne n'est plus savant que lui{/green}. Toute l'interprétation joue sur cet écart.
  passage:
    label: "21a"
    text: "Vous savez bien aussi quelle sorte d'individu était Chéréphon, quelle impétuosité il mettait dans tout ce qu'il entreprenait. En particulier, un jour qu'il s'était rendu à Delphes, il osa consulter l'oracle pour lui demander - et n'allez pas, je le répète, m'interrompre par vos cris, citoyens - si, en fait, il pouvait exister quelqu'un de plus savant que moi. Or la Pythie répondit qu'il n'y avait personne de plus savant."
  points:
  - id: m6-l7-p3
    sentence: "« Vous savez bien aussi __quelle sorte d'individu était__ ___, quelle **impétuosité** il mettait dans tout ce qu'il entreprenait. En particulier, un jour qu'il s'était rendu à Delphes, il osa consulter l'oracle pour lui demander - et n'allez pas, je le répète, m'interrompre par vos cris, citoyens - si, en fait, il pouvait exister quelqu'un de plus savant que moi. Or la Pythie répondit qu'il n'y avait personne de plus savant. »"
    answer: "Chéréphon"
    alt: []
  - id: m6-p21a-1
    sentence: "« Vous savez bien aussi quelle sorte d'individu était Chéréphon, quelle impétuosité il mettait dans tout ce qu'il entreprenait. En particulier, un jour qu'il s'était rendu à Delphes, il osa consulter l'oracle pour lui demander - et n'allez pas, je le répète, m'interrompre par vos cris, citoyens - __si, en fait,__ ___. Or la Pythie répondit qu'il n'y avait **personne de plus savant**. »"
    answer: "il pouvait exister quelqu'un de plus savant que moi"
