- id: m6-l6
  title: "Mettre l'oracle à l'épreuve"
  notes: |-
    {green}**Socrate vérifie l'interprétation de l'oracle par une enquête : il examine ceux qui passent pour savants et, chaque fois qu'ils ne le sont pas, il « prête main-forte au dieu ».**{/green} Il va de-ci de-là, parmi les Athéniens et les étrangers, cherchant quelqu'un de réellement **savant**. Chaque échec confirme, cas après cas, la thèse de l'oracle.

    {amber}Cette enquête a un coût{/amber} : l'{violet}**absence de loisir**{/violet} ne lui laisse le temps de s'occuper sérieusement ni des affaires de la cité, ni des siennes. Il vit dans une {violet}**extrême pauvreté**{/violet}, parce qu'il est {teal}« au service du dieu »{/teal}.

    De cette enquête naît la posture que {sky}la littérature secondaire{/sky} appelle {violet}**l'ignorance socratique**{/violet} : reconnaître son inadéquation en sagesse, tout en jugeant que nul n'est plus sage que celui qui en a conscience. C'est {green}la seule forme de savoir que Socrate revendique{/green}.

    ! L'enquête n'est pas une provocation contre les savants : Socrate la présente comme un service rendu au dieu.
  passage:
    label: "23b-c"
    text: "Or, en allant de-ci de-là, je poursuis ma recherche et, pour comprendre ce qu'a voulu dire le dieu, je cherche à découvrir si, parmi les gens d'Athènes et parmi les étrangers, il ne s'en trouve pas un qui soit savant. Et, chaque fois qu'il me paraît que ce n'est pas le cas, je prête main-forte au dieu en montrant que cet homme n'est pas savant. Et l'absence de loisir qui en résulte explique qu'il ne me reste pas de temps pour m'occuper sérieusement des affaires de la cité et des miennes ; aussi est-ce dans une extrême pauvreté que je vis, parce que je suis au service du dieu."
  points:
  - id: m6-l6-p2
    fragment: "1/2"
    sentence: "« Or, en allant de-ci de-là, je poursuis ma recherche et, pour comprendre ce qu'a voulu dire le dieu, **je cherche à découvrir** si, parmi les gens d'Athènes et parmi les étrangers, __il ne s'en trouve pas un qui soit__ ___. Et, chaque fois qu'il me paraît que ce n'est pas le cas, je prête main-forte au dieu en montrant que cet homme n'est pas savant. »"
    answer: "savant"
