- id: "m6-l5b"
  title: "Le sens de l'oracle"
  notes: |-
    {green}**Un dieu ne peut mentir : si l'oracle déclare que nul n'est plus savant que Socrate, il faut qu'il veuille dire autre chose, à savoir que le vrai savant, c'est le dieu, et que le savoir humain ne vaut presque rien.**{/green} Socrate tient sa mission d'**Apollon**, par l'intermédiaire de l'oracle de Delphes {sky}(23a-c){/sky}.

    **Pourquoi « il y a bien des chances » ?** Socrate {amber}interprète{/amber}, il ne prétend pas savoir ce que pense le dieu. La prudence de la formule est elle-même socratique : même du sens de l'oracle, il ne se dit pas certain.

    **Pourquoi « le vrai savant ce soit le dieu » ?** Le raisonnement devient interprétatif : le dieu, par l'oracle, dirait {teal}« le vrai savant, ce soit le dieu, et [...] le savoir que possède l'homme présente peu de valeur, et peut-être même aucune »{/teal}. {coral}La sagesse véritable n'appartient qu'au dieu{/coral} ; comparée à elle, toute science humaine est presque rien.

    **Pourquoi le nom de Socrate ?** Il ne serait qu'{yellow}un exemple{/yellow} : le dieu s'est servi de son nom comme pour dire qu'est {teal}« le plus savant »{/teal} celui qui, comme lui, {teal}« {/teal}a reconnu que réellement il ne vaut rien pour ce qui est du {teal}savoir ».{/teal} La supériorité de Socrate n'est pas un savoir de plus, mais {amber}la conscience de ne pas savoir{/amber}.

    {green}La sagesse véritable n'appartient donc qu'**au dieu**{/green} ; l'homme, au mieux, peut reconnaître son ignorance. Le nom de {teal}« savant »{/teal} que lui valent ses examens est ainsi {red}un malentendu{/red} : c'est lui qui nourrit l'accusation.

    ! Socrate ne se dit pas savant d'un savoir supérieur : sa seule supériorité est de savoir qu'il ne sait rien qui vaille.
  passage:
    label: "22e-23b"
    text: "Mais, citoyens, il y a bien des chances pour que le vrai savant ce soit le dieu et que, par cet oracle, il ait voulu dire la chose suivante : le savoir que possède l'homme présente peu de valeur, et peut-être même aucune. Et, s'il a parlé de ce Socrate qui est ici devant vous, c'est probablement que, me prenant pour exemple, il a utilisé mon nom, comme pour dire : « Parmi vous, humains, celui-là est le plus savant qui, comme l'a fait Socrate, a reconnu que réellement il ne vaut rien pour ce qui est du savoir. »"
  points:
  - id: "m6-l5-p2"
    sentence: "« Mais, citoyens, __il y a bien des chances pour que le **vrai savant**__ ___ et que, par cet oracle, il ait voulu dire la chose suivante : le savoir que possède l'homme présente peu de valeur, et peut-être même aucune. Et, s'il a parlé de ce Socrate qui est ici devant vous, c'est probablement que, me prenant pour exemple, il a utilisé mon nom, comme pour dire : \"Parmi vous, humains, celui-là est le plus savant qui, comme l'a fait Socrate, a reconnu que réellement il ne vaut rien pour ce qui est du savoir.\" »"
    answer: "ce soit le dieu"
