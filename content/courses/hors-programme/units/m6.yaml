    sentence: "« Vous savez bien aussi quelle sorte d'individu était Chéréphon, quelle impétuosité il mettait dans tout ce qu'il entreprenait. En particulier, un jour qu'il s'était rendu à Delphes, il osa consulter l'oracle pour lui demander - et n'allez pas, je le répète, m'interrompre par vos cris, citoyens - __si, en fait,__ ___. Or la Pythie répondit qu'il n'y avait **personne de plus savant**. »"
