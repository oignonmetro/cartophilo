- id: m6-l7
  title: "Le taon et l'élenchos"
  notes: |-
    Socrate décrit sa mission d'aiguillon moral par une image animale : il se compare à **un taon** (30e-31a), dont la piqûre importune mais réveille.

    Sa méthode de questionnement porte un nom, l'**élenchos** [`elenchein`] : le verbe grec dont il dérive signifie « faire honte », ce qui suggère une première finalité de la méthode : pousser ses concitoyens vers la vertu en leur faisant honte de leur ignorance prétendue.
  passage:
    label: "Prolongement"
  points:
  - id: m6-l7-p1
    sentence: "Socrate décrit sa mission d'aiguillon moral auprès de ses concitoyens par une image animale : il se compare à ___ (30e-31a)"
    answer: "un taon"
    alt: []
