  - id: m6-l7
    title: "L'élenchos, le taon, Chéréphon, et l'ignorance socratique"
    notes: |
      Socrate décrit sa mission d'aiguillon moral par une image animale : il se
      compare à **un taon** (30e-31a), dont la piqûre importune mais réveille.

      Sa méthode de questionnement porte un nom, l'**élenchos** [`elenchein`] :
      le verbe grec dont il dérive signifie « faire honte », ce qui suggère une
      première finalité de la méthode : pousser ses concitoyens vers la vertu
      en leur faisant honte de leur ignorance prétendue.

      C'est **Chéréphon**, ami d'enfance de Socrate à l'impétuosité connue, qui
      est à l'origine de tout : c'est lui qui, un jour, se rend à Delphes et ose
      demander à l'oracle s'il existe quelqu'un de plus savant que Socrate. La
      Pythie répond qu'il n'y avait **personne de plus savant**. C'est cet
      oracle que tout le raisonnement des leçons précédentes vient interpréter.

      De cette enquête, Socrate tire une conclusion générale : la sagesse
      véritable n'appartient qu'**au dieu** (23a-c) ; l'homme, au mieux, ne peut
      que reconnaître son ignorance. La littérature secondaire a donné un nom à
      la posture qui en résulte : **l'ignorance socratique**, qui consiste à
      reconnaître son inadéquation en sagesse tout en jugeant que nul n'est plus
      sage que celui qui en a conscience : la seule forme de savoir que Socrate
      revendique pour lui-même.
    points:
      - id: m6-l7-p1
        sentence: "Socrate décrit sa mission d'aiguillon moral auprès de ses concitoyens par une image animale : il se compare à ___ (30e-31a)"
        answer: "un taon"
        alt: []
      - id: m6-l7-p2
        sentence: "L'élenchos a peut-être été développé par Socrate pour faire honte à ses concitoyens et les pousser vers la vertu : le mot dérive en effet du verbe grec ___, qui signifie « faire honte »."
        answer: "elenchein"
        alt: []
      - id: m6-l7-p3
        sentence: "Apologie, 21a : « Vous savez bien aussi quelle sorte d'individu était ___, quelle impétuosité il mettait dans tout ce qu'il entreprenait. En particulier, un jour qu'il s'était rendu à Delphes, il osa consulter l'oracle pour lui demander - et n'allez pas, je le répète, m'interrompre par vos cris, citoyens - si, en fait, il pouvait exister quelqu'un de plus savant que moi. Or la Pythie répondit qu'il n'y avait personne de plus savant. » (trad. Brisson)"
