- id: platon-idees-i4
  title: "Le Phédon : les Idées, êtres par soi"
  notes: |-
    Le {sky}*Phédon*{/sky} raconte les dernières heures de Socrate. **Il veut convaincre qu'il faut** {green}**prendre soin de son âme**{/green}**, et que la meilleure façon d'en prendre soin est de** {green}**vivre en philosophe**{/green}**.** Il enchaîne pour cela des preuves de l'{violet}immortalité de l'âme{/violet} ; trois d'entre elles sont décisives pour la métaphysique et la théorie de la connaissance :

    | Argument | Lieu |
    | la réminiscence, avec son prélude | 65a-67a et 72e-78b |
    | l'affinité | 78b-84b |
    | le dernier argument, avec son prélude | 95a-102a et 102a-107a |

    **Platon ne décrit nulle part en détail la nature des Idées, ni celle des choses particulières, ni leur rapport : la** {violet}**« théorie des Idées »**{/violet} **est** {amber}**une reconstruction des interprètes**{/amber}**.** Ils cherchent un petit nombre de principes qui expliquent tout ce que Platon dit des Idées, {red}au risque de lui prêter des notions qui ne sont pas les siennes{/red}. Par exemple, définir la {violet}« chose particulière »{/violet} ({yellow}Socrate, ce chien, cet arbre{/yellow}) comme {amber}ce dont on dit des propriétés et qui ne se dit lui-même de rien{/amber} est une définition posée par les interprètes : {red}Platon ne la donne nulle part{/red}.

    **Le point de départ : l'âme cherche à être** {violet}**séparée**{/violet} ({blue}*chôris*{/blue}) **du corps**, qui {red}la gêne et la distrait{/red}, pour être {teal}« {/teal}elle-même {teal}par elle-même »{/teal}, c'est-à-dire sans lui ({sky}64c5-8{/sky}) : {red}les sens n'apportent aucune vérité{/red} ({sky}65a-d{/sky}).

    **Vient alors le premier passage dont on s'accorde à dire qu'il introduit les Idées (**{sky}**65d-66a**{/sky}**).** {yellow}La justice en soi, le beau, le bon{/yellow}, {coral}personne ne les a jamais vus de ses yeux, ni saisis par aucun sens corporel{/coral}. Socrate précise de quoi il parle : {teal}« {/teal}Je veux parler de ce qui, pour chaque chose (par exemple {yellow}la grandeur, la santé, la force{/yellow}, bref toutes choses sans exception) {teal}constitue son essence : ce que chacune se trouve être. »{/teal} Pour les saisir, {green}il faut penser sans le corps{/green} ; celui qui cherche à connaître y parviendra ainsi : {teal}« {/teal}Se servant au contraire {teal}de la réflexion en elle-même et sans mélange{/teal}, c'est ainsi qu'il entreprendrait de faire la chasse à {teal}ce que chacun des êtres est en lui-même et sans mélange. »{/teal}

    **Les Idées sont donc des êtres** {violet}**« par soi »**{/violet} ({blue}*auto kath' hauto*{/blue}) : {amber}**ce qu'elles sont ne dépend de rien d'autre qu'elles**{/amber}**.** {coral}La justice en soi est juste par elle-même{/coral}, {red}et non grâce à autre chose{/red}.
  points:
  - id: platon-idees-i4-p1
    sentence: "Le *Phédon* veut convaincre que __la meilleure façon de prendre soin de son âme est de vivre en__ ___ ; il enchaîne pour cela des preuves de l'**immortalité de l'âme**."
    answer: "philosophe"
