  - id: platon-idees-i13
    title: "Être et Participer ; les copies de forme"
    notes: |-
      **La séparation rigide des Idées et des choses, les « deux mondes », s'incarne dans deux façons d'être : l'{violet}Être{/violet} et la {teal}Participation{/teal}.** Les traits des choses (mutabilité, étendue) ne sont pas équivalents à la Participation, ni ne l'expliquent, ni ne sont expliqués par elle. Mais la déficience des choses tient à leur façon d'être : toute chose sensible acquiert toutes ses propriétés par participation. **Sans essence, elle ne peut qu'échouer à Être.**

      **Ce n'est ni une lecture approximationniste, ni une lecture des Idées comme particuliers exemplaires** : la même propriété, la Beauté, se rapporte au Beau en soi par l'Être et à Hélène par la Participation. Ce n'est pas la beauté d'Hélène qui est déficiente, c'est **sa façon de l'avoir**. Et puisque la beauté ne caractérise pas le Beau, le Beau en soi ne saurait être un objet beau exemplaire.

      **Une difficulté.** Du *Phédon* on tire :
      - 1. Chaque Idée F Est son essence Y.
      - 2. Pour toute chose P et toute propriété Y, si Y se dit de P, P a Y.
      - 3. Si P a Y, P a quelque chose qui Est Y.
      Si ce que P a, c'est l'Idée elle-même, et si l'Idée est identique à son essence (lecture de l'identité), l'essence se dit aussi de la chose : les choses auraient des essences, par participation.

      **Les copies de forme offrent une issue** : la grandeur en Socrate, le chaud dans le feu (*Phédon*, 102b s.). Leur statut est discuté : beaucoup n'y voient que l'Idée en tant qu'immanente aux choses, ou en tant qu'elle fonctionne dans la participation. Mais si Platon veut éviter d'attribuer les Idées, donc les essences, aux choses, il a toute raison de les admettre : elles diffèrent de leur Idée en ce qu'elles sont des propriétés singulières, des **propriétés-unités**, quand l'Idée est générale et abstraite.
