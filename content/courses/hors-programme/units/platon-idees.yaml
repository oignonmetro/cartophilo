lessons:
  - id: platon-idees-i1
    title: "Les héritages : Parménide, Héraclite, Socrate"
    notes: |-
      **Trois prédécesseurs ont façonné la métaphysique et l'épistémologie de Platon : {teal}Parménide{/teal}, {coral}Héraclite{/coral} et Socrate.** Des deux premiers ne restent que des fragments, dont certains conservés par les dialogues ; Socrate n'a rien écrit, et le portrait qu'en fait Platon est notre principale source.

      | Prédécesseur | Thèse | Ce que Platon en retient |
      | Parménide | seul l'être est ; le changement est une apparence | les Idées |
      | Héraclite | tout change ; le flux | les objets matériels |
      | Socrate | la question « qu'est-ce que X ? » en éthique | l'universel |

      **Parménide** : il n'y a et ne peut y avoir qu'une seule chose, l'être, et l'on ne peut ni penser ni dire ce qui n'est pas. Or changer, c'est devenir ce qu'on n'était pas (de non bronzé, devenir bronzé) : rien ne change, la réalité est immobile. Ses fragments ne permettent pas de trancher entre un monisme numérique strict (une seule chose) et l'idée qu'il n'y a qu'une sorte de choses, les étants.

      **Héraclite**, « l'apôtre du changement » : la seule constante est le schème du changement lui-même ; croire à des entités immuables est une illusion.

      **Socrate**, l'influence décisive selon la plupart des spécialistes, s'occupe presque exclusivement d'éthique, d'après Platon, Xénophon et Aristophane. Soucieux du soin de l'âme pour vivre heureux (*Apologie*, 29d-30b), il se sert de thèses métaphysiques sans chercher à en faire une théorie (Vlastos).

      ! Socrate __utilise__ des notions métaphysiques au service de l'éthique ; mais savoir s'il théorise ou s'il se contente d'en user est difficile, puisque nous n'avons guère que les dialogues de Platon pour en juger.
    points:
