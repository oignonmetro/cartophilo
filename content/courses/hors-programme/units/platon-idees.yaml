- id: platon-idees-i9
  title: "L'étendue des Idées : les propriétés incomplètes"
  notes: |-
    {amber}**Y a-t-il une Idée pour chaque propriété ?**{/amber} Les dialogues de la maturité {red}démontrent rarement qu'une Idée existe{/red}, et n'en traitent qu'un petit nombre : {yellow}les vertus étudiées par Socrate, la Beauté, l'Égalité, le Chaud et le Froid, la Grandeur{/yellow}. Selon les commentateurs {sky}Fine{/sky} et {sky}Irwin{/sky}, les textes décisifs portent tous sur des {violet}**propriétés incomplètes**{/violet} : l'argument de la réminiscence, les passages de {sky}*La République*{/sky} sur les objets de la science ({sky}V, 477 s.{/sky}) et sur les perceptions qui appellent la pensée ({sky}VII, 523 s.{/sky}), l'ascension vers le Beau du {sky}*Banquet*{/sky}, le dernier argument du {sky}*Phédon*{/sky}.

    **Une propriété incomplète donne** {amber}**un énoncé qu'on ne comprend pas seul**{/amber} : il faut préciser {amber}par rapport à quoi{/amber}. {yellow}« Shaquille O'Neal est grand » : grand pour un homme, mais non comparé à un arbre.{/yellow}

    **Le problème qu'elles posent : la** {violet}**coprésence des contraires**{/violet}**.** {amber}Toute chose sensible qui est F est aussi, en un sens, non-F{/amber} : {yellow}la vache Elsie est grande comparée à son veau, mais non grande comparée au taureau Elmer{/yellow}. Platon cherche quelque chose qui soit grand {green}**sans réserve**{/green} ; {red}aucune chose sensible ne l'est{/red} ; {coral}il pose donc la Grandeur en soi{/coral}.

    **D'autres propriétés** {pink}**ne souffrent pas la coprésence**{/pink} : {yellow}Elsie est une vache, et n'est en aucun sens non-vache ; si elle est brune de partout, elle n'est en aucun sens non brune{/yellow}. En termes modernes, être une vache est une {violet}propriété essentielle{/violet} d'Elsie, être brune une {violet}propriété accidentelle{/violet}. Les Idées ne vaudraient alors que pour certaines propriétés accidentelles : {coral}celles que rien de sensible ne possède sans réserve{/coral}. Pour ces commentateurs, Platon admet bien d'autres propriétés, mais {green}ne pose d'Idées que pour les propriétés incomplètes{/green}.

    **Tout tient à la notion d'être** {violet}**« complètement » F**{/violet}**.** {yellow}Elsie est complètement une vache{/yellow} ; {red}aucune chose sensible n'est complètement grande{/red} ; {green}seule la Grandeur l'est{/green}. Elle est {coral}le porteur complet d'une propriété incomplète{/coral}.

    ! Cette lecture dit {green}pour quelles propriétés il y a des Idées{/green} ; {red}elle ne dit pas en quel sens la Grandeur est grande{/red} (voir les trois lectures de l'auto-prédication).
