        sentence: "« Mais, comme Socrate s'occupait de questions éthiques et non de la nature dans son ensemble, que pourtant, dans ce domaine, il cherchait l'universel et qu'il a, le premier, arrêté sa réflexion sur les définitions, Platon l'approuva et, à cause de la nature de cette recherche, pensa qu'elle a lieu d'être pour des objets autres que les sensibles et non pour les sensibles : ___ de l'un quelconque des sensibles est, en effet, impossible, du moins s'ils sont en perpétuel changement. » (Aristote, *Métaphysique*, A, 6, 987b1-7)"
