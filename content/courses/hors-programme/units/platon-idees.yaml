  - id: platon-idees-i10
    title: "Image et copie : les traits des choses sensibles"
    notes: |-
      **Des métaphores gouvernent le rapport des choses aux Idées : image et original, copie et modèle, exemple et paradigme.** Le monde physique est une copie des Idées ; toute copie dépend de son original ; et puisque les Idées ne sont pas des universaux immanents, la dépendance est **à sens unique**. Le *Phédon* ajoute une autre métaphore : les choses **s'efforcent** d'être telles que les Idées, et leur restent pour cela imparfaites.

      **L'argument de l'affinité (78b-84b) oppose les deux sortes d'êtres par des traits qui vont par paires :**

      | Idées | Choses particulières |
      | immatérielles, sans lieu, hors du temps | matérielles, étendues dans l'espace et le temps |
      | immuables, peut-être même sans changement de Cambridge | changeantes, peut-être en flux héraclitéen total |
      | simples, uniformes (`monoeides`, `hen`) | composées (`suntheton`), multiformes |
      | objets de la science, saisies par l'intellect | objets des sens et de l'opinion |
      | ne peuvent être conçues non-F | paraissent, et sont peut-être, F et non-F |

      **Un changement de Cambridge est un changement purement relationnel** : être pensée par une âme à tel moment, puis non. Les Idées n'en subissent peut-être même pas. Les choses, elles, changent peut-être en tout point et à tout instant.

      ! Les choses dépendent des Idées, non l'inverse : c'est ce qui les rend __déficientes__.
