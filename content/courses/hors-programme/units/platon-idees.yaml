  - id: platon-idees-i3
    title: "De l'universel socratique à l'Idée séparée"
    notes: |-
      **Aristote rapporte que Platon a séparé l'universel que Socrate cherchait sans le séparer.** Les partisans des Idées ont d'abord été convaincus par Héraclite (*Métaphysique*, M, 4, 1078b12-17) : « La doctrine des formes est venue à ceux qui la soutiennent parce qu'ils ont été convaincus, au sujet de la vérité, par les arguments héraclitéens selon lesquels tous les sensibles s'écoulent sans cesse, d'où il s'ensuit que, s'il y a science et pensée de quelque chose, il faut qu'existent, en dehors des natures sensibles, d'autres natures qui demeurent, car il n'y a pas de science de ce qui s'écoule. » Socrate, lui, cherchait le premier des définitions universelles en éthique (1078b30-32) : « Mais Socrate ne rendait séparables ni les universels ni les définitions ; eux, au contraire, les ont séparés et ont appelé Idées ceux des êtres qui sont tels. » Platon unit ainsi la recherche socratique de l'universel à la thèse héraclitéenne du flux des sensibles.

      **Un universel est ce qui se prédique de plusieurs choses** : une boule de bowling, un ballon de basket et un cercle tracé au tableau sont tous ronds. Chaque propriété partagée est un « un sur plusieurs » : la blancheur sur les choses blanches, la rondeur sur les choses rondes.

      **La méthode de Socrate est l'`elenchos`**, un interrogatoire réfutatif : il fait dire à ses interlocuteurs ce qu'ils croient de la justice ou de la piété, et montre que leurs croyances ne s'accordent pas. Au cœur, la question « qu'est-ce que X ? ». Les réponses échouent, trop {teal}étroites{/teal} (elles laissent des cas de côté) ou trop {coral}larges{/coral} (elles incluent aussi des cas de justice ou d'impiété).

      **On en tire ce qu'est une propriété socratique, la Piété** : présente partout où il y a un cas de piété, elle « fait » que ce cas est tel, et elle le peut parce qu'elle est elle-même pieuse : la Piété **s'auto-prédique**. Il n'y a encore qu'un seul rapport de prédication : Socrate est pieux de la même façon que la Piété. On connaît la propriété quand on peut en rendre raison (`logos`), c'est-à-dire en donner la définition, qui en dit l'essence (`ousia`). Sans doute la Piété n'est-elle que pieuse, quand Socrate ou une prière ont bien d'autres propriétés.

      **La propriété socratique est un universel immanent : elle est dans les sensibles**, si bien que la définition de la Piété se dit aussi de Socrate. « Séparer l'universel », c'est rejeter cette thèse ; et si Aristote a raison, ce qui gêne Platon dans les sensibles, c'est qu'ils changent.
