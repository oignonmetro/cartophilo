  - id: platon-idees-i2
    title: "La chronologie des dialogues et la question socratique"
    notes: |-
      **Platon fait presque toujours parler Socrate : lit-on alors les doctrines de Socrate, celles de Platon, ou ni les unes ni les autres ? C'est la « question socratique ».** Elle dépend de l'ordre dans lequel les dialogues ont été écrits. On les répartit d'ordinaire en trois périodes :

      | Période | Dialogues |
      | de jeunesse, « socratique » | *Apologie*, *Criton*, *Euthyphron*, *Charmide*, *Ion*, *Lysis*, *Lachès*, *Hippias mineur*, *Ménexène*, *Euthydème*, *Protagoras* ; vers la fin, *Hippias majeur*, *Gorgias*, peut-être *Ménon* |
      | intermédiaire, de la maturité | *Cratyle*, *Banquet*, *Phédon*, *République*, peut-être *Phèdre* |
      | tardive, après la *République* | *Parménide*, *Théétète*, *Sophiste*, *Politique*, *Timée*, *Philèbe*, *Lois*, *Critias* |

      **Les dialogues socratiques**, où Socrate mène toujours la discussion, sont des enquêtes éthiques (qu'est-ce que le courage ? la justice ?) ; on pense qu'ils exposent les doctrines de Socrate lui-même. **Ceux de la maturité exposeraient celles de Platon**, bien que Socrate y parle encore. On y trouve pour la première fois trois thèses :
      - l'immortalité de l'âme, sur laquelle Socrate ne se prononce pas dans l'*Apologie* ;
      - les Idées, réalités hors de l'espace et du temps, qui sont les objets de la science et, d'une certaine façon, les causes de ce qui arrive dans le monde physique ;
      - la **réminiscence** : avant d'être enfermée dans un corps, l'âme immortelle a vu les Idées, et elle s'en ressouvient ensuite au prix d'un long effort.

      **Platon a-t-il changé d'avis d'une période à l'autre ?** Deux camps de commentateurs s'opposent : les {teal}unitaristes{/teal}, comme Shorey, pour qui il garde ses thèses centrales ; les {coral}évolutionnistes{/coral}, comme Owen, pour qui il en change. La position la plus plausible, sans doute dominante aujourd'hui, est intermédiaire : sur certaines thèses, Platon approfondit, découvre des difficultés, voire se dédit ; sur d'autres, il maintient ses intuitions fondamentales.

      ! Les dialogues de la maturité ne donnent que les __premières__ pensées métaphysiques de Platon : les dialogues tardifs semblent en modifier des doctrines clefs.
