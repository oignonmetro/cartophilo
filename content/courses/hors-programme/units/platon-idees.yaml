  - id: platon-idees-i13
    title: "Être et Participer ; les copies de forme"
    notes: |-
      **La séparation rigide des Idées et des choses (on parle des « deux mondes ») tient à deux façons d'être : l'{violet}Être{/violet}, propre aux Idées, et la {teal}Participation{/teal}, propre aux choses.** Les traits des choses vus plus haut (changement, étendue) ne se confondent pas avec la Participation : ils ne l'expliquent pas, et elle ne les explique pas. Mais la déficience des choses tient bien à leur façon d'être : une chose sensible n'a aucune de ses propriétés par elle-même, elle les acquiert toutes en participant des Idées. **N'ayant pas d'essence, elle n'Est jamais rien au sens fort où une Idée Est son essence.**

      **Cette conception de la déficience n'est pas celle des approximationnistes**, pour qui l'Idée serait un exemplaire parfait de la propriété. La même propriété, la Beauté, se rapporte au Beau en soi par l'Être, et à Hélène par la Participation. Ce n'est donc pas la beauté d'Hélène qui est déficiente, c'est **sa façon de l'avoir**. Et puisque la beauté n'est pas une qualité du Beau en soi, celui-ci n'est pas un objet beau exemplaire.

      **Une difficulté.** Du *Phédon* on tire trois thèses (« P a Y » veut dire : la chose P possède la propriété Y) :
      - 1. Chaque Idée F Est son essence Y.
      - 2. Pour toute chose P et toute propriété Y, si Y se dit de P, P a Y.
      - 3. Si P a Y, P a quelque chose qui Est Y.
      Que possède au juste Hélène quand elle est belle ? Si c'est l'Idée du Beau elle-même, et si l'Idée est identique à son essence (lecture de l'identité), Hélène possède l'essence du Beau : les choses auraient des essences, ce que la théorie voulait exclure.

      **L'issue : les copies de forme.** Le *Phédon* parle aussi de « la grandeur en nous », distincte de la Grandeur en soi (102b s.) : la grandeur en Socrate, le chaud dans le feu. Le commentateur Silverman les appelle des « copies de forme ». Leur statut est discuté : beaucoup de commentateurs n'y voient que l'Idée elle-même, en tant qu'elle est présente dans les choses. Mais si Platon veut éviter d'attribuer les Idées, et donc les essences, aux choses, il a toute raison de les admettre comme des réalités distinctes : une copie de forme est une propriété singulière, une **propriété-unité** (cette grandeur-ci, celle de Socrate), alors que l'Idée est générale et abstraite.
