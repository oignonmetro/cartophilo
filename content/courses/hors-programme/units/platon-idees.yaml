- id: platon-idees-i14
  title: "Copies de forme : retrait, individuation, indiscernabilité"
  notes: |-
    {amber}**Les copies de forme dépendent-elles des choses ?**{/amber} Pour préparer sa dernière preuve de l'immortalité de l'âme, Platon soutient que si une chose possède une propriété essentielle, comme {yellow}la neige le froid{/yellow}, à l'approche du contraire ({yellow}la chaleur{/yellow}), {yellow}le-froid-dans-la-neige{/yellow} doit {amber}**se retirer ou périr**{/amber} ; {coral}l'âme, qui ne peut périr, se retire{/coral}. {amber}Si les copies périssent{/amber}, {pink}elles dépendent des choses{/pink}, et l'on peut n'y voir qu'une façon imagée de dire qu'une chose participe un temps d'une Idée. {amber}Si elles se retirent{/amber}, {green}elles sont indépendantes des choses, comme les âmes{/green}.

    **Le** {red}**cercle de l'individuation**{/red}**.** Qu'est-ce qui fait que {yellow}la grandeur de Socrate est cette grandeur-ci, distincte de celle de Simmias{/yellow} ? Apparemment, {amber}le fait d'appartenir à Socrate{/amber} : elle tiendrait son individualité de la chose. Or, inversement, {amber}nous n'identifions Socrate que par ses propriétés{/amber}, c'est-à-dire par ses copies de forme. {red}Chacun des deux serait identifié par l'autre : on tourne en rond.{/red} **L'issue :** {green}**les copies de forme sont des individus par elles-mêmes**{/green}, sans le devoir à la chose (on dit que leur individualité est {violet}« primitive »{/violet}), comme {yellow}les âmes, qui existent avant les corps et leur survivent{/yellow}. {coral}Une copie de forme Est ce qu'elle est, et ne peut donc cesser de l'être.{/coral}

    **Le** {red}**risque d'indiscernabilité**{/red}**.** Si une chose n'était rien par elle-même, sans matière ni copies, elle ne serait qu'un assemblage (un {violet}« faisceau »{/violet}) des Idées dont elle participe ; {red}deux choses participant des mêmes Idées seraient alors une seule et même chose{/red}. Avec les copies, ce sont {coral}deux assemblages de copies distinctes, donc deux choses{/coral}. Mais elles restent indiscernables par leurs qualités : {yellow}la beauté d'Hélène ne diffère de celle d'Andromaque{/yellow} que {blue}*solo numero*{/blue}, par le nombre seul. Pour distinguer vraiment Hélène d'Andromaque, {green}il faut encore leur matière{/green} ; et c'est pour rendre compte de la matière que Platon écrira le {sky}*Timée*{/sky}.

    **Bilan.** Une chose est faite de {amber}matière{/amber} et de {amber}copies de forme{/amber} (parfois aussi d'une âme) ; {coral}n'ayant pas d'essence, elle peut tout perdre et disparaître{/coral}, alors qu'une Idée ne le peut pas. {green}Hélène est belle parce qu'elle possède quelque chose qui Est beau, une copie de la Beauté.{/green} Trois éléments y concourent :
    - la {violet}Participation{/violet}, rapport primitif comme l'Être, qui fait {amber}qu'Hélène a la propriété{/amber} ;
    - la {violet}matière{/violet}, qui donne à sa beauté {amber}un caractère concret et déterminé{/amber} ;
    - la {violet}copie{/violet}, qui fait que {amber}ce caractère est celui de la beauté et non d'autre chose{/amber}.

    **Platon garde ainsi la thèse socratique selon laquelle** {green}**les Idées sont des causes « logiques »**{/green} : {coral}elles rendent raison de ce qu'est une chose{/coral}. Enfin, comme nous n'identifions une chose que par ses propriétés, {coral}ce sont les copies, et à travers elles les Idées, qui nous donnent accès aux choses{/coral}.
