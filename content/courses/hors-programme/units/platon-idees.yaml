        answer: "complètement"
        alt: []
      - id: platon-idees-i8-p4
        sentence: "Pour la lecture prédicationniste, le rapport qui relie une essence à l'Idée dont elle est l'essence est l'___, qu'on écrit avec une majuscule : « la Justice Est juste »."
        answer: "Être"
        alt: ["être"]
      - id: platon-idees-i8-p5
        sentence: "Le commentateur Nehamas résume la définition réelle d'une Idée F par la formule « ce que c'est qu'___ F »."
        answer: "être"
        alt: []
      - id: platon-idees-i8-p6
        sentence: "Premier des deux principes qui règlent le rapport de l'Idée à son essence : chaque essence est l'essence d'une ___ Idée."
        answer: "seule"
        alt: ["unique"]
