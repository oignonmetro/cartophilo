- id: platon-idees-i13
  title: "Être et Participer ; les copies de forme"
  notes: |-
    **La séparation rigide des Idées et des choses (on parle des** {violet}**« deux mondes »**{/violet}**) tient à deux façons d'être : l'{amber}Être{/amber}, propre aux Idées, et la {amber}Participation{/amber}, propre aux choses.** Les traits des choses vus plus haut (changement, étendue) {red}ne se confondent pas avec la Participation{/red} : ils ne l'expliquent pas, et elle ne les explique pas. Mais {green}la déficience des choses tient bien à leur façon d'être{/green} : une chose sensible {coral}n'a aucune de ses propriétés par elle-même{/coral}, elle {coral}les acquiert toutes en participant des Idées{/coral}. **N'ayant pas d'essence, elle** {green}**n'Est jamais rien au sens fort où une Idée Est son essence**{/green}**.**

    **Cette conception de la déficience** {red}**n'est pas celle des approximationnistes**{/red}, pour qui {pink}l'Idée serait un exemplaire parfait de la propriété{/pink}. {amber}La même propriété, la Beauté, se rapporte au Beau en soi par l'Être, et à Hélène par la Participation.{/amber} Ce n'est donc pas {red}la beauté d'Hélène{/red} qui est déficiente, c'est {green}**sa façon de l'avoir**{/green}. Et puisque {coral}la beauté n'est pas une qualité du Beau en soi{/coral}, celui-ci {red}n'est pas un objet beau exemplaire{/red}.

    **Une** {red}**difficulté**{/red}**.** Du {sky}*Phédon*{/sky} on tire trois thèses (« P a Y » veut dire : la chose P possède la propriété Y) :
    - 1. {amber}Chaque Idée F Est son essence Y.{/amber}
    - 2. {amber}Pour toute chose P et toute propriété Y, si Y se dit de P, P a Y.{/amber}
    - 3. {amber}Si P a Y, P a quelque chose qui Est Y.{/amber}
    Que possède au juste Hélène quand elle est belle ? Si c'est l'Idée du Beau elle-même, et si l'Idée est identique à son essence (lecture de l'identité), Hélène possède l'essence du Beau : {red}les choses auraient des essences, ce que la théorie voulait exclure{/red}.

    **L'issue : les** {violet}**copies de forme**{/violet}**.** Le {sky}*Phédon*{/sky} parle aussi de {teal}« {/teal}la {teal}grandeur en nous »{/teal}, distincte de la Grandeur en soi ({sky}102b s.{/sky}) : {yellow}la grandeur en Socrate, le chaud dans le feu{/yellow}. Le commentateur {sky}Silverman{/sky} les appelle des « copies de forme ». Leur statut est discuté : beaucoup de commentateurs {pink}n'y voient que l'Idée elle-même, en tant qu'elle est présente dans les choses{/pink}. Mais si Platon veut {amber}éviter d'attribuer les Idées, et donc les essences, aux choses{/amber}, {coral}il a toute raison de les admettre comme des réalités distinctes{/coral} : une copie de forme est une {green}propriété singulière, une **propriété-unité**{/green} ({yellow}cette grandeur-ci, celle de Socrate{/yellow}), alors que {pink}l'Idée est générale et abstraite{/pink}.
