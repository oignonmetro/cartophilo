- id: platon-idees-i1c
  title: "Parenthèse (3) : Platon et Aristote contre Parménide"
  notes: |-
    **Pour rendre le devenir pensable, il faut distinguer {amber}« ne pas être quelque chose »{/amber} de {red}« ne pas être du tout »{/red} : Parménide ne le fait pas, {sky}Platon{/sky} puis {sky}Aristote{/sky} le feront.** Toute la force de l'argument contre la naissance tient à cette confusion. Or la feuille qui n'est pas jaune n'est pas rien : elle est verte. {coral}Ne pas être jaune suppose un être, la feuille, qui n'est pas jaune{/coral} : penser ce non-être-là, ce n'est pas penser le néant.

    **Platon : le non-être comme altérité.** Dans le *Sophiste*, l'Étranger d'Élée commet le {violet}« parricide »{/violet} (241d) : il s'en prend à la thèse du « père » Parménide pour établir que le non-être, en un sens, est. Dire qu'une chose « n'est pas », ce n'est pas dire qu'elle est le contraire de l'être, mais qu'elle est {amber}autre{/amber} (257b) : le {yellow}« non-grand »{/yellow} n'est pas le néant, c'est ce qui est autre que grand, le petit aussi bien que l'égal. {green}Ce non-être comme altérité existe bel et bien{/green} (258d-e) : chaque chose « n'est pas » toutes celles dont elle diffère.

    **Aristote : la privation et la puissance.** Dans la *Physique* (I, 8), Aristote explique que les premiers philosophes, faute de cette distinction, en sont venus à nier toute naissance. Rien ne vient du non-être absolu, mais d'un {amber}sujet{/amber} qui n'est pas encore ce qu'il devient : ce manque se nomme la {violet}privation{/violet}. Tout devenir a donc trois termes : __le sujet qui demeure__, __la privation de départ__, __la forme d'arrivée__. Et ce sujet est déjà, en {violet}puissance{/violet}, ce qu'il devient en acte. Ainsi la statue ne naît ni du néant, ni d'une statue déjà faite, mais de l'{yellow}airain{/yellow}, qui est, et qui n'est pas encore statue : {green}le non-être de départ n'est que relatif, porté par un être qui, lui, ne naît pas{/green}. Le dilemme de Parménide tombe.

    ! Ni Platon ni Aristote ne rendent pensable le néant absolu : sur ce point ils donnent raison à Parménide, et ne lui contestent que d'avoir pris tout « n'être pas » pour un néant.
