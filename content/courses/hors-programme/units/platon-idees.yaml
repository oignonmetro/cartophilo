    answer: "prédicationniste"
    alt: ["prédicationnelle"]
- id: platon-idees-i7
  title: "La simplicité des Idées"
  notes: |-
    **Les Idées sont dites** {violet}**unes**{/violet} ({blue}*hen*{/blue}) **ou** {violet}**d'une seule forme**{/violet} ({blue}*monoeides*{/blue})**, surtout dans l'argument de l'affinité : on en tire qu'**{amber}**une Idée n'aurait pas d'autre propriété qu'elle-même**{/amber} ({sky}*Phédon*, 78b-84b{/sky}). {yellow}La Justice est juste, et n'est rien d'autre que juste.{/yellow} La théorie de la connaissance appuie cette lecture : {coral}une Idée simple ne peut paraître autre que ce qu'elle est{/coral} (voir, dans l'unité sur la connaissance, la leçon sur l'Égal en soi).

    **Mais deux séries de textes** {red}**empêchent une simplicité stricte**{/red}**.**
    - Le {amber}Bien{/amber} : {sky}*La République*{/sky} rapporte toutes les Idées au Bien ; Platon semble donc tenu de dire que {coral}chaque Idée est bonne, ce qui lui donne une seconde propriété{/coral}.
    - La {amber}définition{/amber} : chercher ce qu'est la Justice, c'est chercher une formule qu'on ne trouvera qu'au terme d'une longue étude, comme {yellow}le savant cherche ce qu'est l'or{/yellow}. Dire « la Justice est juste », c'est comme signer un {yellow}**billet à ordre**, une promesse de payer plus tard{/yellow} : on s'engage à fournir un jour la définition complète. Or {coral}cette définition, une fois trouvée, comprendra plusieurs éléments{/coral}.

    | Définition complexe | Source |
    | la chaleur est l'énergie cinétique moléculaire moyenne | exemple moderne |
    | la justice est le fait de faire ce qui est sien | *République*, 441d |
    | le nom est un instrument qui instruit et sépare la nature | *Cratyle*, 388b |
    | l'homme est un animal bipède raisonnable | exemple que Platon ne donne jamais |

    **Le progrès philosophique doit apprendre** {pink}**non que la Justice est juste**{/pink}**, mais** {green}**ce qu'est la Justice**{/green} : {coral}à un certain niveau, les Idées ne peuvent donc être strictement simples{/coral}.

    **D'où une question** {red}**sans réponse chez Platon**{/red}**.** La théorie ne dispose que de {amber}deux manières d'avoir une propriété : participer et Être{/amber}. Quand une Idée est bonne, ou quand la Justice est « faire ce qui est sien », {amber}__participe__-t-elle de ces propriétés, comme une chose sensible, ou les __est__-elle ?{/amber}
  points:
  - id: platon-idees-i7-p1
    sentence: "Dans l'argument de l'affinité, les Idées sont dites unes (`hen`) ou **d'une seule forme**, ce qui suggère que __la seule chose qui se dise d'une Idée est__ ___ : la Justice n'est rien d'autre que juste."
