  - id: platon-idees-i14
    title: "Copies de forme : retrait, individuation, indiscernabilité"
    notes: |-
      **Les copies de forme dépendent-elles des choses ?** Pour préparer sa preuve finale de l'immortalité de l'âme, Platon soutient que si une chose possède une propriété essentielle, comme la neige le froid, à l'approche du contraire, la chaleur, le-froid-dans-la-neige doit **se retirer ou périr** ; l'âme, qui ne peut périr, se retire. Si les copies périssent, elles dépendent des choses, et l'on peut n'y voir qu'une métaphore de la participation temporaire. Si elles se retirent, elles en sont indépendantes, comme les âmes.

      **Le cercle de l'individuation.** Même retirées, les copies semblent tenir leur individualité de leur hôte : « appartenir à Socrate » est relationnel. Or les choses ont toutes leurs propriétés par participation : elles s'identifient par leurs copies. Si celles-ci s'individuent par les choses, on tourne en rond. **Issue : leur individualité est primitive**, comme celle des âmes, qui préexistent aux corps et leur survivent. Une copie de forme Est ce qu'elle est, et ne peut donc cesser de l'être.

      **L'indiscernabilité.** Sans matière ni copies, une chose ne serait qu'un **faisceau d'Idées**, et deux choses faites des mêmes Idées seraient identiques. Avec les copies, ce sont des faisceaux de copies, distinctes : la copie de Beauté d'Hélène ne diffère de celle d'Andromaque que **solo numero**, par le nombre seul. Il faut encore la matière pour distinguer Hélène d'Andromaque ; c'est pour en rendre compte que Platon écrira le *Timée*.

      **Bilan.** Une chose est faite de matière et de copies de forme (parfois aussi d'une âme) ; sans essence, elle peut tout perdre et disparaître ; l'Idée, non. Hélène est belle parce qu'elle a quelque chose qui Est beau : la Participation, primitive comme l'Être, et la matière, qui rend sa beauté déterminée, la caractérisent ; la copie fait que ce caractère est celui de la Beauté. **Platon garde ainsi la thèse socratique des Idées comme causes logiques**, et les copies nous donnent accès aux choses, que nous n'identifions que par leurs propriétés.
