  - id: platon-idees-i8
    title: "La séparation des Idées"
    notes: |-
      **Le meilleur fil conducteur : chaque Idée est ce qu'elle est par elle-même, c'est un être par soi (`auto kath' hauto`).** Demander « qu'est-ce que F ? », c'est chercher ce qu'est F indépendamment de ses exemplaires matériels, et en un sens de toute autre chose, autre Idée ou âme. Ce qu'une Idée est par elle-même, elle l'est en vertu de son essence (`ousia`) : la *République* le dit par la formule de « ce qui est complètement » et « complètement connaissable » (477a), et les énoncés d'auto-prédication le disent aussi.

      **Pour la lecture prédicationniste, le rapport entre une Idée et son essence est l'Être** (Code), qu'on écrit avec une majuscule : la Justice Est juste. Le prédicat donne la définition réelle de l'Idée, « ce que c'est qu'être F » (Nehamas). Deux principes règlent ce rapport :
      - I. Chaque essence est l'essence d'une seule Idée.
      - II. Chaque Idée a, ou est, une seule essence.
      Le principe II donne son sens ontologique à `monoeides` : « d'une seule essence ».

      **L'auto-prédication devient un principe constitutif de la théorie des Idées** : toute Idée doit Être son essence. Une Idée Est quelque chose, qu'une chose particulière en participe ou non, et même si aucune ne le peut : elle est séparée de tout exemplaire. Et comme son essence se dit d'elle indépendamment de notre connaissance et des autres Idées, elle ne dépend de rien.

      | Séparation | Critère |
      | {teal}définitionnelle{/teal} | l'essence se dit de l'Idée, et non de ce dont elle est séparée |
      | {coral}existentielle{/coral} | l'Idée existe à part de tout le reste |

      **Être une essence étant, aux yeux de Platon, la façon suprême d'être, les Idées sont sans doute séparées aux deux sens.**
