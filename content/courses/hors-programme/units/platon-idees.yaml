  - id: platon-idees-i5
    title: "Le Phédon : l'hypothèse des Idées, être et participer"
    notes: |-
      Les arguments suivants du *Phédon* **précisent les traits des Idées.**
      - La réminiscence : elles sont **parfaites**, et les choses particulières s'efforcent de leur ressembler sans y parvenir.
      - L'affinité : elles sont **simples**, incomposées, d'une seule forme (`monoeides`), quand les choses sont composées, divisibles et multiformes.
      - Le dernier argument : Platon pose enfin l'**hypothèse des Idées** pour expliquer la génération et la destruction, c'est-à-dire le changement en général.

      Cébès accepte l'hypothèse ; Socrate en tire une conséquence nouvelle (100c3-7) : « Car pour moi, il me semble que si, en dehors du beau en soi, il existe une chose belle, la seule raison pour laquelle cette chose est belle est qu'elle participe à ce beau en soi, et j'en dis autant de tout le reste. Est-ce que tu m'accordes cette sorte de cause ? »

      **Deux rapports de prédication apparaissent ici.** Il semble y avoir deux sortes de sujets, les Idées et les choses matérielles, et une Idée pour chaque propriété en jeu dans les changements des choses : Hélène devient belle, il y a donc le Beau en soi.

      | Rapport | Sujet | Exemple |
      | {teal}Participation{/teal} | une chose matérielle | Hélène est belle parce qu'elle participe du Beau |
      | {violet}Être{/violet} | une Idée | le Beau en soi, qui n'est pas « autre que le Beau », est beau |

      **Les Idées héritent ainsi des propriétés socratiques leur auto-prédication** : le Beau est beau, la Justice juste, l'Égalité égale. Participer du Beau rend Hélène belle __parce que__ le Beau en soi est beau.

      ! Comprendre l'Être, la façon dont le Beau est beau, c'est-à-dire ce que c'est pour une Idée de s'auto-prédiquer, est le cœur de la théorie des Idées et de la métaphysique de la maturité.
