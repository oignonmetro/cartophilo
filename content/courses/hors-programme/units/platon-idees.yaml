  - id: platon-idees-i2
    title: "La chronologie des dialogues et la question socratique"
    notes: |-
      **Platon fait presque toujours parler Socrate : lit-on alors les doctrines de Socrate, celles de Platon, ou ni les unes ni les autres ? C'est la « question socratique », liée à la chronologie des dialogues.** On répartit d'ordinaire ceux-ci en trois périodes :

      | Période | Dialogues |
      | de jeunesse, « socratique » | *Apologie*, *Criton*, *Euthyphron*, *Charmide*, *Ion*, *Lysis*, *Lachès*, *Hippias mineur*, *Ménexène*, *Euthydème*, *Protagoras* ; vers la fin, *Hippias majeur*, *Gorgias*, peut-être *Ménon* |
      | intermédiaire, de la maturité | *Cratyle*, *Banquet*, *Phédon*, *République*, peut-être *Phèdre* |
      | tardive, après la *République* | *Parménide*, *Théétète*, *Sophiste*, *Politique*, *Timée*, *Philèbe*, *Lois*, *Critias* |

      **Les dialogues socratiques**, où Socrate est toujours l'interlocuteur principal, sont des enquêtes éthiques (qu'est-ce que le courage, la justice ?) censées exposer ses propres doctrines. **Ceux de la maturité exposeraient celles de Platon**, bien que Socrate y parle encore. On y trouve pour la première fois l'immortalité de l'âme (dans l'*Apologie*, Socrate ne se prononce pas), des entités appelées Idées, hors de l'espace et du temps, objets de la science et en quelque façon causes de ce qui arrive dans le monde physique, et la **réminiscence** : l'âme immortelle a vu les Idées avant d'être incarcérée dans un corps, et s'en ressouvient au prix d'un long effort.

      **Platon a-t-il changé d'avis ?** Les {teal}unitaristes{/teal} (Shorey) tiennent qu'il garde ses thèses centrales d'une période à l'autre ; les {coral}évolutionnistes{/coral} (Owen), qu'il en change. La position la plus plausible, sans doute dominante aujourd'hui, est intermédiaire : sur certaines thèses Platon approfondit, découvre des difficultés, voire se dédit ; sur d'autres, il maintient ses intuitions fondamentales.

      ! Les dialogues de la maturité ne donnent que les __premières__ pensées métaphysiques de Platon : les dialogues tardifs semblent en modifier des doctrines clefs.
