  - id: platon-idees-i12
    title: "La matière et le déterminé"
    notes: |-
      Dès le début du *Phédon*, **les choses sont présentées comme matérielles, et la matière semble à la racine de leurs autres défauts.** Ce qui est étendu est un corps ; un corps est composé ; un composé est multiforme (80b4), et il peut se défaire ou se former, c'est-à-dire naître et périr. Au sens large que leur donne *Phédon* 100 s., naître et périr incluent le simple fait de gagner ou de perdre une propriété. Or, pour être à la fois F et non-F, il faut avoir plusieurs propriétés : en rendant les choses composées, la matière est l'une des racines de la coprésence des contraires.

      **La perception aussi passe par la matière** : elle exige un contact matériel entre le corps perçu et l'organe du sens, auquel peut s'ajouter un jugement. Or une chose n'est F et non-F que sous certaines réserves : à tel moment et non à tel autre, comparée à ceci et non à cela, pour tel observateur et non pour tel autre. Toutes ces réserves supposent un corps situé dans l'espace et le temps : sans matière, aucune chose ne paraîtrait à la fois F et non-F.

      **Surtout, la matière oblige une propriété à se manifester de façon déterminée** : un bâton n'a pas « de la longueur », il a telle longueur, cinq pouces, et tel poids, six onces. Le *Ménon* (74 s.) distingue le **déterminable** (la couleur, le rouge) et le **déterminé** (le cramoisi, l'écarlate). Le Triangle en soi est une figure à trois côtés dont les lignes n'ont pas de largeur et dont les angles n'ont pas de mesure déterminée ; tout triangle particulier a des lignes d'une certaine largeur et des angles de tant de degrés.

      | | Idée | Propriété dans la chose |
      | nature | générale, abstraite | singulière, concrète |
      | mode | non déterminée | déterminée |
      | possession | nécessaire | contingente |

      **Tout ce qui est matériel a ses propriétés de façon contingente, mais l'inverse n'est pas vrai** : les âmes, qui ne sont pas matérielles, sont elles aussi contingentement ce qu'elles sont (une âme peut être avide d'argent, ou ne pas l'être). La matière est donc une condition suffisante de la contingence, non une condition nécessaire.
