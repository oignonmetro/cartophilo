lessons:
  - id: platon-idees-i1
    title: "Les héritages : Parménide, Héraclite, Socrate"
    notes: |-
      **Trois prédécesseurs ont façonné la métaphysique et la théorie de la connaissance de Platon : {teal}Parménide{/teal}, {coral}Héraclite{/coral} et Socrate.** Des deux premiers ne restent que des fragments, dont certains sont cités dans les dialogues de Platon ; Socrate n'a rien écrit, et le portrait qu'en fait Platon est notre principale source.

      | Prédécesseur | Thèse | Ce qu'elle inspire à Platon |
      | Parménide | seul l'être est ; le changement n'est qu'une apparence | les Idées, immuables |
      | Héraclite | tout change sans cesse : c'est le flux | sa conception des objets matériels |
      | Socrate | la question « qu'est-ce que X ? » en éthique | la recherche de l'universel |

      **Parménide** : il n'y a et ne peut y avoir qu'une seule chose, l'être, et l'on ne peut ni penser ni dire ce qui n'est pas. Or changer, c'est devenir ce qu'on n'était pas (de non bronzé, devenir bronzé) : rien ne change donc, la réalité est immobile. Ses fragments ne permettent pas de trancher : veut-il dire qu'il n'existe qu'une seule chose (monisme numérique strict), ou seulement qu'il n'existe qu'une sorte de choses, les étants, c'est-à-dire les choses qui sont ?

      **Héraclite**, « l'apôtre du changement » : la seule chose constante est la loi même du changement ; croire qu'il existe des réalités immuables est une illusion.

      **Socrate** est, selon la plupart des spécialistes, l'influence décisive. D'après Platon, l'historien Xénophon et le poète comique Aristophane, il s'occupe presque exclusivement d'éthique : soucieux du soin de l'âme pour vivre heureux (*Apologie*, 29d-30b), il se sert de thèses métaphysiques sans chercher à en faire une théorie, comme le souligne le commentateur Gregory Vlastos.

      ! Socrate __utilise__ des notions métaphysiques au service de l'éthique ; mais savoir s'il en fait la théorie est difficile, puisque nous n'avons guère que les dialogues de Platon pour en juger.
