# Leçon ajoutée le 2026-11-23 : citations de Parménide traduites depuis le grec
# de Diels-Kranz (texte vérifié sur remacle.org), vers numérotés selon DK.
- id: platon-idees-i1b
  title: "Parenthèse (1) : l'impossibilité du devenir chez Parménide"
  notes: |-
    **Pourquoi, chez Parménide, rien ne peut-il ni naître ni périr ? Parce que {coral}naître (passer de ne pas être à être) et périr (passer d'être à ne plus être) supposent qu'à un moment la chose ne soit pas, et que ce qui n'est pas ne peut être ni pensé ni dit{/coral}.** Le refus du devenir n'est donc pas un goût de l'immobilité, mais une conséquence logique, que le fragment B 8 (numérotation Diels-Kranz) déduit pas à pas. C'est cet argument que Platon devra défaire pour penser un monde sensible qui change.

    ? **Ce qui est** ({blue}*to eon*{/blue}, l'étant) : ce dont on dit qu'il est.

    ? **Ce qui n'est pas** ({blue}*to mê eon*{/blue}) n'est pas un être d'une autre sorte : c'est le non-être pris absolument, le {amber}rien{/amber}.

    **Le point de départ : le non-être est impensable.** La déesse du poème ne laisse à la pensée que deux chemins (B 2) : ou bien {green}« il est », et il ne peut pas ne pas être{/green} ; ou bien {red}« il n'est pas », et il faut qu'il ne soit pas{/red}. Le second est une impasse : {teal}« {/teal}tu ne saurais ni {teal}connaître ce qui n'est pas{/teal} (car ce n'est pas faisable) ni {teal}l'énoncer »{/teal} (B 2, v. 7-8). Autrement dit : {teal}« {/teal}il faut que {teal}ce qu'on dit et pense soit »{/teal} (B 6, v. 1). Car __penser, c'est toujours penser quelque chose__ : qu'on essaie de se figurer le néant, on voit du noir, un espace vide, c'est-à-dire {yellow}encore quelque chose{/yellow}. Le non-être n'est donc pas une thèse fausse qu'on réfute : {coral}c'est une pensée qui n'arrive pas à se former, faute d'objet{/coral}.

    **Entre être et ne pas être, pas de milieu.** {teal}« {/teal}Ainsi il faut ou bien {teal}être tout à fait, ou bien pas du tout »{/teal} (B 8, v. 11) ; tout se décide en ces mots : {teal}« il est ou il n'est pas »{/teal} (v. 16). Or ce qui devient n'est plus rien, et n'est pas encore ce qu'il sera : il serait un {amber}milieu{/amber} entre être et ne pas être, et c'est ce milieu que l'alternative interdit.

    **La naissance suppose ce non-être.** Naître, c'est __n'avoir pas été, puis être__. D'où la question : {teal}« quelle naissance{/teal} lui chercheras-tu ? Par où, {teal}d'où aurait-il crû ? »{/teal} (v. 6-7). Des deux origines possibles, aucune ne convient :
    - __s'il vient de ce qui n'est pas__, il faut penser ce non-être, ce qui est exclu, {teal}« car il n'est ni dicible{/teal} ni {teal}pensable qu'il ne soit pas »{/teal} (v. 8-9) ; surtout, {coral}avant sa naissance il n'y a rien, donc rien qui puisse se mettre à devenir{/coral} : pour devenir, il faut déjà être quelque chose ;
    - __s'il vient de ce qui est__, {coral}il était déjà{/coral} : il ne naît pas, il continue d'être.

    **Et, parti du rien, il ne saurait quand commencer.** {teal}« Quel besoin{/teal} l'aurait poussé à {teal}naître plus tard plutôt qu'avant{/teal}, en partant {teal}du rien ? »{/teal} (v. 9-10). Le rien est le même à tous les moments : il n'offre aucune raison de commencer à l'un plutôt qu'à l'autre, et rien ne commencerait donc jamais. C'est, avant la lettre, le {violet}principe de raison suffisante{/violet}.

    **Avoir un passé ou un avenir, c'est déjà ne pas être.** {teal}« S'il est né, il n'est pas{/teal}, ni non plus {teal}s'il doit être un jour »{/teal} (v. 20) : dire qu'une chose est née, c'est dire qu'il fut un temps où elle n'était pas ; dire qu'elle sera, c'est dire qu'elle n'est pas encore. {coral}Le passé (ce qui n'est plus) et le futur (ce qui n'est pas encore) sont deux manières de ne pas être{/coral}. L'étant, lui, {teal}« n'était pas{/teal}, ni {teal}ne sera{/teal}, puisqu'il {teal}est maintenant, tout entier ensemble »{/teal} (v. 5). Conclusion : {teal}« ainsi la genèse est éteinte{/teal}, et {teal}inouïe la destruction »{/teal} (v. 21).

    | Contre la genèse | Vers de B 8 | Le non-être qu'elle suppose |
    | d'où naîtrait-il ? | 6-9 | le non-être d'où il sortirait |
    | pourquoi plus tard plutôt qu'avant ? | 9-10 | un rien sans raison de commencer |
    | s'il est né, il n'est pas | 19-20 | un temps où il n'était pas, ou pas encore |

    **Reste à voir que la mort, et même le simple changement, tombent sous le même argument.**
  points:
