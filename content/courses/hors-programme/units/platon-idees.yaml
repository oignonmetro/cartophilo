  - id: platon-idees-i14
    title: "Copies de forme : retrait, individuation, indiscernabilité"
    notes: |-
      **Les copies de forme dépendent-elles des choses ?** Pour préparer sa dernière preuve de l'immortalité de l'âme, Platon soutient que si une chose possède une propriété essentielle, comme la neige le froid, à l'approche du contraire (la chaleur), le-froid-dans-la-neige doit **se retirer ou périr** ; l'âme, qui ne peut périr, se retire. Si les copies périssent, elles dépendent des choses, et l'on peut n'y voir qu'une façon imagée de dire qu'une chose participe un temps d'une Idée. Si elles se retirent, elles sont indépendantes des choses, comme les âmes.

      **Le cercle de l'individuation.** Qu'est-ce qui fait que la grandeur de Socrate est cette grandeur-ci, distincte de celle de Simmias ? Apparemment, le fait d'appartenir à Socrate : elle tiendrait son individualité de la chose. Or, inversement, nous n'identifions Socrate que par ses propriétés, c'est-à-dire par ses copies de forme. Chacun des deux serait identifié par l'autre : on tourne en rond. **L'issue : les copies de forme sont des individus par elles-mêmes**, sans le devoir à la chose (on dit que leur individualité est « primitive »), comme les âmes, qui existent avant les corps et leur survivent. Une copie de forme Est ce qu'elle est, et ne peut donc cesser de l'être.

      **Le risque d'indiscernabilité.** Si une chose n'était rien par elle-même, sans matière ni copies, elle ne serait qu'un assemblage (un « faisceau ») des Idées dont elle participe ; deux choses participant des mêmes Idées seraient alors une seule et même chose. Avec les copies, ce sont deux assemblages de copies distinctes, donc deux choses. Mais elles restent indiscernables par leurs qualités : la beauté d'Hélène ne diffère de celle d'Andromaque que **solo numero**, par le nombre seul. Pour distinguer vraiment Hélène d'Andromaque, il faut encore leur matière ; et c'est pour rendre compte de la matière que Platon écrira le *Timée*.

      **Bilan.** Une chose est faite de matière et de copies de forme (parfois aussi d'une âme) ; n'ayant pas d'essence, elle peut tout perdre et disparaître, alors qu'une Idée ne le peut pas. Hélène est belle parce qu'elle possède quelque chose qui Est beau, une copie de la Beauté. Trois éléments y concourent :
      - la Participation, rapport primitif comme l'Être, qui fait qu'Hélène a la propriété ;
      - la matière, qui donne à sa beauté un caractère concret et déterminé ;
      - la copie, qui fait que ce caractère est celui de la beauté et non d'autre chose.

      **Platon garde ainsi la thèse socratique selon laquelle les Idées sont des causes « logiques »** : elles rendent raison de ce qu'est une chose. Enfin, comme nous n'identifions une chose que par ses propriétés, ce sont les copies, et à travers elles les Idées, qui nous donnent accès aux choses.
    points:
      - id: platon-idees-i14-p1
        sentence: "À l'approche de la chaleur, le-froid-dans-la-neige doit, selon la métaphore militaire du dernier argument du *Phédon*, se retirer ou ___."
        answer: "périr"
        alt: []
      - id: platon-idees-i14-p2
        sentence: "L'âme, ne pouvant périr, doit se ___ à l'approche de la mort : c'est la preuve finale de son immortalité dans le *Phédon*."
        answer: "retirer"
        alt: []
      - id: platon-idees-i14-p3
        sentence: "Si les copies de forme périssent à l'approche de leur contraire, elles ___ des choses auxquelles elles appartiennent, et l'on peut n'y voir qu'une métaphore de la participation."
        answer: "dépendent"
        alt: []
      - id: platon-idees-i14-p4
        sentence: "Si les copies de forme se retirent à l'approche de leur contraire, elles sont indépendantes des choses, comme les ___."
        answer: "âmes"
        alt: []
      - id: platon-idees-i14-p5
        sentence: "Si les choses s'identifient par leurs copies de forme, et ces copies par les choses auxquelles elles appartiennent, on tombe dans un ___ de l'individuation."
        answer: "cercle"
        alt: []
