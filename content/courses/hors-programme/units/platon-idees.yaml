  - id: platon-idees-i4
    title: "Le Phédon : les Idées, êtres par soi"
    notes: |-
      Le *Phédon*, éloge funèbre de Socrate, **veut convaincre qu'il faut prendre soin de son âme, et que la meilleure façon d'en prendre soin est de vivre en philosophe.** Il enchaîne pour cela des preuves de l'immortalité de l'âme, dont trois sont décisives pour la métaphysique et l'épistémologie :

      | Argument | Lieu |
      | la réminiscence, avec son prélude | 65a-67a et 72e-78b |
      | l'affinité | 78b-84b |
      | le dernier argument, avec son prélude | 95a-102a et 102a-107a |

      **Platon n'y décrit jamais en détail la nature des Idées, ni celle des choses particulières, ni leur rapport : la « théorie des Idées » est une reconstruction rationnelle**, qui cherche les principes d'où suit ce qu'il en dit, au risque de lui prêter des notions qui ne sont pas les siennes. Ainsi du particulier, qu'on définirait comme ce dont des propriétés se prédiquent et qui ne se prédique de rien : définition stipulée, absente de Platon.

      **Le point de départ : l'âme cherche à être séparée (`chôris`) du corps**, qui la gêne et la distrait, pour être elle-même par elle-même (64c5-8) : les sens n'apportent aucune vérité (65a-d). Puis vient le premier passage dont on s'accorde à dire qu'il introduit les Idées (65d4-66a3) : la justice en soi, le beau, le bon ne se voient pas par les yeux, ni par aucun sens corporel. « Je veux parler de ce qui, pour chaque chose (par exemple la grandeur, la santé, la force, bref toutes choses sans exception) constitue son essence : ce que chacune se trouve être. » On les saisit au mieux ainsi : « Se servant au contraire de la réflexion en elle-même et sans mélange, c'est ainsi qu'il entreprendrait de faire la chasse à ce que chacun des êtres est en lui-même et sans mélange. »

      **Les Idées sont donc des êtres par soi (`auto kath' hauto`) : elles sont ce qu'elles sont en vertu d'elles-mêmes.**
