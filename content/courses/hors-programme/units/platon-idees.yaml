- id: platon-idees-i10
  title: "Image et copie : les traits des choses sensibles"
  notes: |-
    **Platon décrit le rapport des choses aux Idées par des** {yellow}**métaphores : image et original, copie et modèle, exemple et paradigme**{/yellow}**.** Le monde physique est {amber}une copie des Idées{/amber}, et {coral}une copie dépend de son original{/coral}. Mais {red}les Idées ne sont pas dans les choses{/red}, et ne dépendent donc pas d'elles : {green}la dépendance ne va que dans un sens{/green}. Le {sky}*Phédon*{/sky} ajoute une autre métaphore : les choses {yellow}**s'efforcent**{/yellow} d'être telles que les Idées, sans y parvenir, et {coral}leur restent donc inférieures{/coral}.

    **L'argument de l'affinité (**{sky}**78b-84b**{/sky}**) oppose les deux sortes d'êtres par des traits qui vont par paires :**

    | Idées | Choses particulières |
    | immatérielles, sans lieu, hors du temps | matérielles, étendues dans l'espace et le temps |
    | immuables, peut-être même sans changement de Cambridge | changeantes, peut-être en flux héraclitéen total |
    | simples, uniformes (`monoeides`, `hen`) | composées (`suntheton`), multiformes |
    | objets de la science, saisies par l'intellect | objets des sens et de l'opinion |
    | l'Idée de F ne peut être conçue comme non-F | paraissent, et sont peut-être, F et non-F |

    **Un** {violet}**changement de Cambridge**{/violet} **est** {amber}**un changement purement relationnel**{/amber}, {amber}qui n'affecte pas la chose elle-même{/amber} : par exemple, {yellow}être pensée par une âme à tel moment, puis ne plus l'être{/yellow}. {green}Les Idées n'en subissent peut-être même pas.{/green} {pink}Les choses, elles, changent peut-être en tout point et à tout instant.{/pink}

    ! {green}Les choses dépendent des Idées{/green}, {red}et non l'inverse{/red} : c'est pourquoi on les dit {violet}__déficientes__{/violet}, c'est-à-dire {coral}inférieures aux Idées{/coral}.
