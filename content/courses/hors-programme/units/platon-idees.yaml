  - id: platon-idees-i6
    title: "L'auto-prédication : trois lectures"
    notes: |-
      **Que veut dire « le Juste est juste » ?** Le sujet, « le Juste », et le prédicat, « juste », semblent désigner la même chose, l'Idée de Justice. Toute la question porte sur la **copule**, le verbe « est » qui relie le sujet au prédicat : comment l'Idée se rapporte-t-elle à elle-même ? Trois lectures s'opposent chez les commentateurs.

      | Lecture | Sens du « est » dans « le Beau est beau » | Commentateurs |
      | {teal}caractérisation{/teal} | le Beau est une chose belle, comme Hélène | Vlastos ; variante approximationniste : Malcolm |
      | {violet}identité{/violet} | l'Idée est identique à son essence | Cherniss, Allen |
      | {coral}prédicationniste{/coral} | un rapport spécial, l'Être, entre l'Idée et son essence | Nehamas, Code, Silverman |

      **La caractérisation (Vlastos)** : le Beau possède la beauté comme qualité, à la façon dont une chose belle la possède. La Justice est juste comme Socrate est juste, le Cercle en soi est rond comme un ballon : le Beau figure dans l'inventaire des choses belles, aux côtés d'Hélène.
      - **Variante approximationniste (Malcolm)** : l'Idée est l'exemplaire parfait de la propriété, et la chose qui en participe un exemplaire imparfait, comme un cercle tracé n'est jamais parfaitement circulaire. Objection : si chaque chose belle n'a qu'une beauté imparfaite, chacune à sa manière, ou bien elles n'ont rien en commun, et l'on n'a plus de raison de poser une Idée unique au-dessus d'elles ; ou bien elles partagent une même beauté imparfaite, et il faudrait poser une Idée de la Beauté imparfaite. Les deux issues sont absurdes.
      - **Autre variante** : le Beau est beau et rien d'autre (il est « d'une seule forme », 78b), alors qu'Hélène est aussi une femme, et infidèle.

      **L'identité (Cherniss, Allen)** : « le Beau est beau » signifie que l'Idée du Beau est identique à son essence, à ce que c'est qu'être beau. Le Beau n'est donc pas une chose belle parmi d'autres.

      **La lecture prédicationniste, défendue par les commentateurs Nehamas, Code et Silverman,** admet que l'Idée et son essence ne font finalement qu'un, mais ne lit pas « le Beau est beau » comme une identité. L'énoncé exprime un rapport spécial entre l'Idée (le sujet) et son essence (le prédicat) : l'Être. Ce rapport est **primitif**, c'est-à-dire qu'aucun rapport plus fondamental ne l'explique. À la différence de la Participation, qui fait qu'une chose possède une propriété comme une qualité (Hélène devient belle), l'Être ne fait jamais du Beau une chose belle.

      ! Le « est » de « le Beau est beau » n'est pas forcément celui de « Hélène est belle » : c'est tout l'enjeu du débat.
    points:
      - id: platon-idees-i6-p1
        sentence: "Dans « le Juste est juste », sujet et prédicat semblent renvoyer à la même Idée : le débat sur l'auto-prédication porte donc sur la ___, c'est-à-dire sur la façon dont l'Idée se rapporte à elle-même."
        answer: "copule"
        alt: []
      - id: platon-idees-i6-p2
        sentence: "Pour le commentateur ___, la Justice est juste de la même façon que Socrate est juste : le Beau figure dans l'inventaire des choses belles, aux côtés d'Hélène."
        answer: "Vlastos"
        alt: []
      - id: platon-idees-i6-p3
        sentence: "La lecture de Vlastos, pour qui le Beau est beau comme Hélène est belle, comprend la copule de l'auto-prédication comme une ___."
        answer: "caractérisation"
        alt: []
      - id: platon-idees-i6-p4
        sentence: "Pour la lecture ___, défendue par le commentateur Malcolm, l'Idée est l'exemplaire parfait de la propriété, et la chose qui en participe un exemplaire imparfait, comme un cercle tracé n'est pas parfaitement circulaire."
        answer: "approximationniste"
        alt: []
      - id: platon-idees-i6-p5
        sentence: "Le commentateur Malcolm admet avec Vlastos la lecture caractérisante du « est », mais nie que la propriété de l'Idée et celle de la chose particulière soient exactement les ___."
        answer: "mêmes"
        alt: []
      - id: platon-idees-i6-p6
        sentence: "Objection à la lecture approximationniste : si les choses belles n'ont que des beautés imparfaites, ou bien elles n'ont rien en commun, ou bien il faut poser une Idée de la Beauté ___."
        answer: "imparfaite"
        alt: []
      - id: platon-idees-i6-p7
        sentence: "Une variante de la caractérisation s'appuie sur ce que le *Phédon* dit des Idées, d'une seule forme (78b) : le Beau est ___ beau, alors qu'Hélène est aussi femme et infidèle."
        answer: "seulement"
        alt: ["uniquement", "simplement"]
      - id: platon-idees-i6-p8
        sentence: "Pour la lecture de Cherniss et Allen, le « est » de « le Beau en soi est beau » est un « est » d'___ entre l'Idée et son essence."
        answer: "identité"
        alt: []
