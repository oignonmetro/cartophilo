  - id: platon-idees-i3
    title: "De l'universel socratique à l'Idée séparée"
    notes: |-
      **Selon Aristote, Platon a séparé des choses l'universel que Socrate cherchait sans le séparer.** Aristote explique la naissance de la doctrine des Idées par deux héritages.

      **Héraclite** (*Métaphysique*, M, 4, 1078b12-17) : « La doctrine des formes est venue à ceux qui la soutiennent parce qu'ils ont été convaincus, au sujet de la vérité, par les arguments héraclitéens selon lesquels tous les sensibles s'écoulent sans cesse, d'où il s'ensuit que, s'il y a science et pensée de quelque chose, il faut qu'existent, en dehors des natures sensibles, d'autres natures qui demeurent, car il n'y a pas de science de ce qui s'écoule. » Autrement dit : si tout ce qui est sensible change, et s'il n'y a de science que de ce qui demeure, il faut d'autres réalités, stables.

      **Socrate**, qui cherchait le premier des définitions universelles en éthique (1078b30-32) : « Mais Socrate ne rendait séparables ni les universels ni les définitions ; eux, au contraire, les ont séparés et ont appelé Idées ceux des êtres qui sont tels. » « Eux », ce sont Platon et ses disciples ; « ceux des êtres qui sont tels », ce sont les universaux. Platon unit ainsi la recherche socratique de l'universel à la thèse héraclitéenne du flux des choses sensibles.

      **Un universel est ce qui peut être dit (« prédiqué ») de plusieurs choses** : une boule de bowling, un ballon et un cercle tracé au tableau sont tous ronds, et la rondeur est ce qu'ils ont en commun. Chaque propriété partagée est un « un sur plusieurs », une unité qui vaut pour une multiplicité : la blancheur pour toutes les choses blanches.

      **La méthode de Socrate est l'`elenchos`**, un interrogatoire réfutatif : il fait dire à ses interlocuteurs ce qu'ils croient de la justice ou de la piété, et montre que leurs croyances ne s'accordent pas entre elles. Au cœur de l'examen, la question « qu'est-ce que X ? ». Les réponses échouent parce qu'elles sont trop {teal}étroites{/teal} (elles laissent de côté certains actes pieux) ou trop {coral}larges{/coral} (elles englobent aussi des actes justes mais non pieux, voire impies).

      **De ces échecs, on déduit ce que Socrate cherche : une propriété, la Piété, présente dans tous les actes pieux, et qui est cause qu'ils soient pieux.** Elle le peut parce qu'elle est elle-même pieuse : la Piété s'**auto-prédique**, c'est-à-dire possède la propriété qu'elle est. Dans ces dialogues, il n'y a encore qu'une seule manière d'avoir une propriété : Socrate est pieux exactement comme la Piété est pieuse. On connaît la Piété quand on peut en rendre raison (`logos`), c'est-à-dire en donner la définition, qui dit son essence (`ousia`). Elle n'a sans doute pas d'autre propriété que d'être pieuse, alors que Socrate, ou une prière, ont bien d'autres propriétés.

      **La propriété socratique est un universel immanent, c'est-à-dire présent dans les choses sensibles elles-mêmes** : la piété est en Socrate, si bien que la définition de la Piété vaut aussi pour lui. « Séparer l'universel », c'est refuser cette thèse et poser la Piété hors des choses pieuses ; et si Aristote a raison, Platon le fait parce que les choses sensibles changent.
