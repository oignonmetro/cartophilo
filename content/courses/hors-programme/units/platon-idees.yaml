  - id: platon-idees-i4
    title: "Le Phédon : les Idées, êtres par soi"
    notes: |-
      Le *Phédon* raconte les dernières heures de Socrate. **Il veut convaincre qu'il faut prendre soin de son âme, et que la meilleure façon d'en prendre soin est de vivre en philosophe.** Il enchaîne pour cela des preuves de l'immortalité de l'âme ; trois d'entre elles sont décisives pour la métaphysique et la théorie de la connaissance :

      | Argument | Lieu |
      | la réminiscence, avec son prélude | 65a-67a et 72e-78b |
      | l'affinité | 78b-84b |
      | le dernier argument, avec son prélude | 95a-102a et 102a-107a |

      **Platon ne décrit nulle part en détail la nature des Idées, ni celle des choses particulières, ni leur rapport : la « théorie des Idées » est une reconstruction des interprètes.** Ils cherchent un petit nombre de principes qui expliquent tout ce que Platon dit des Idées, au risque de lui prêter des notions qui ne sont pas les siennes. Par exemple, définir la « chose particulière » (Socrate, ce chien, cet arbre) comme ce dont on dit des propriétés et qui ne se dit lui-même de rien est une définition posée par les interprètes : Platon ne la donne nulle part.

      **Le point de départ : l'âme cherche à être séparée (`chôris`) du corps**, qui la gêne et la distrait, pour être « elle-même par elle-même », c'est-à-dire sans lui (64c5-8) : les sens n'apportent aucune vérité (65a-d).

      **Vient alors le premier passage dont on s'accorde à dire qu'il introduit les Idées (65d-66a).** La justice en soi, le beau, le bon, personne ne les a jamais vus de ses yeux, ni saisis par aucun sens corporel. Socrate précise de quoi il parle : « Je veux parler de ce qui, pour chaque chose (par exemple la grandeur, la santé, la force, bref toutes choses sans exception) constitue son essence : ce que chacune se trouve être. » Pour les saisir, il faut penser sans le corps ; celui qui cherche à connaître y parviendra ainsi : « Se servant au contraire de la réflexion en elle-même et sans mélange, c'est ainsi qu'il entreprendrait de faire la chasse à ce que chacun des êtres est en lui-même et sans mélange. »

      **Les Idées sont donc des êtres « par soi » (`auto kath' hauto`) : ce qu'elles sont ne dépend de rien d'autre qu'elles.** La justice en soi est juste par elle-même, et non grâce à autre chose.
