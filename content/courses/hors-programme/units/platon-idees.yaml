- id: platon-idees-i8
  title: "La séparation des Idées"
  notes: |-
    **En quel sens les Idées sont-elles** {violet}**« séparées »**{/violet} **? Le meilleur fil conducteur est la formule** {violet}**« par soi »**{/violet} ({blue}*auto kath' hauto*{/blue}) : {amber}**chaque Idée est ce qu'elle est par elle-même**{/amber}**.** Demander « qu'est-ce que F ? », c'est chercher {amber}ce qu'est F indépendamment de ses exemplaires matériels{/amber}, et même, en un sens, {amber}de toute autre chose, autre Idée ou âme{/amber}. Ce qu'une Idée est par elle-même, c'est son {violet}essence{/violet} ({blue}*ousia*{/blue}) : {sky}*La République*{/sky} dit d'elle qu'elle est {teal}« {/teal}ce qui est {teal}complètement »{/teal} ({sky}477a{/sky}), et {coral}les énoncés d'auto-prédication (« le Juste est juste ») expriment ce même lien entre l'Idée et son essence{/coral}.

    **Pour la lecture prédicationniste, ce lien est l'**{violet}**Être**{/violet}**.** Le commentateur {sky}Code{/sky} l'écrit avec une majuscule pour le distinguer du « est » ordinaire : {yellow}« la Justice Est juste »{/yellow}. Le prédicat (« juste ») {amber}tient lieu de la définition complète de l'Idée{/amber}, ce que le commentateur {sky}Nehamas{/sky} appelle {violet}« ce que c'est qu'être F »{/violet}. Deux principes règlent ce rapport :
    - I. {amber}Chaque essence est l'essence d'une seule Idée.{/amber}
    - II. {amber}Chaque Idée a, ou est, une seule essence.{/amber}
    Le principe II explique en quel sens une Idée est {blue}*monoeides*{/blue}, « d'une seule forme » : {coral}elle n'a qu'une essence{/coral}.

    **L'auto-prédication** {red}**n'est donc pas un trait accessoire**{/red} : {green}**elle fait partie de la définition même d'une Idée**{/green}, puisque {coral}toute Idée doit Être son essence{/coral}. Une Idée Est ce qu'elle est, qu'une chose en participe ou non, et même si aucune chose ne pouvait en participer : {green}elle est séparée de tous ses exemplaires{/green}. Et puisqu'elle Est son essence sans que cela dépende de ce que nous en savons ni des autres Idées, {green}elle ne dépend de rien{/green}.

    | Séparation | Critère |
    | {amber}définitionnelle{/amber} | la définition vaut pour l'Idée, et non pour les choses dont elle est séparée : la définition du Beau ne se dit pas d'Hélène |
    | {amber}existentielle{/amber} | l'Idée existe à part de tout le reste |

    **Être une essence étant, aux yeux de Platon, la façon d'être la plus haute,** {green}**les Idées sont sans doute séparées dans les deux sens**{/green}**.**
