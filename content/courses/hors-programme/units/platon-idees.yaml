        sentence: "La grandeur en Socrate, le chaud dans le feu, distincts de la Grandeur en soi et du Chaud en soi, sont ce qu'on appelle des ___ (*Phédon*, 102b s.)."
        answer: "copies de forme"
        alt: ["copies de formes", "copies de Forme", "copies d'Idée"]
