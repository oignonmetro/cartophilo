- id: platon-idees-i3
  title: "De l'universel socratique à l'Idée séparée"
  notes: |-
    **Selon** {sky}**Aristote**{/sky}**, Platon a** {green}**séparé des choses l'universel**{/green} **que Socrate cherchait** {pink}**sans le séparer**{/pink}**.** Aristote explique la naissance de la doctrine des Idées par deux héritages.

    {sky}**Héraclite**{/sky} ({sky}*Métaphysique*, M, 4, 1078b12-17{/sky}) : {teal}« {/teal}La doctrine des formes est venue à ceux qui la soutiennent parce qu'ils ont été convaincus, au sujet de la vérité, par les arguments héraclitéens selon lesquels {teal}tous les sensibles s'écoulent sans cesse{/teal}, d'où il s'ensuit que, s'il y a science et pensée de quelque chose, il faut qu'existent, {teal}en dehors des natures sensibles, d'autres natures qui demeurent{/teal}, car {teal}il n'y a pas de science de ce qui s'écoule. »{/teal} Autrement dit : {amber}si tout ce qui est sensible change{/amber}, et {amber}s'il n'y a de science que de ce qui demeure{/amber}, {coral}il faut d'autres réalités, stables{/coral}.

    {sky}**Socrate**{/sky}, qui cherchait le premier des {violet}définitions universelles{/violet} en éthique ({sky}1078b30-32{/sky}) : {teal}« {/teal}Mais Socrate {teal}ne rendait séparables ni les universels ni les définitions{/teal} ; eux, au contraire, {teal}les ont séparés{/teal} et ont appelé {teal}Idées{/teal} ceux des êtres qui sont {teal}tels. »{/teal} « Eux », ce sont {sky}Platon et ses disciples{/sky} ; « ceux des êtres qui sont tels », ce sont les {violet}universaux{/violet}. Platon unit ainsi {amber}la recherche socratique de l'universel{/amber} à {amber}la thèse héraclitéenne du flux des choses sensibles{/amber}.

    **Un** {violet}**universel**{/violet} **est** {amber}**ce qui peut être dit (« prédiqué ») de plusieurs choses**{/amber} : {yellow}une boule de bowling, un ballon et un cercle tracé au tableau{/yellow} sont tous ronds, et {yellow}la rondeur{/yellow} est ce qu'ils ont en commun. Chaque propriété partagée est un {violet}« un sur plusieurs »{/violet}, {amber}une unité qui vaut pour une multiplicité{/amber} : {yellow}la blancheur pour toutes les choses blanches{/yellow}.

    **La méthode de Socrate est l'**{blue}*elenchos*{/blue}, un {violet}interrogatoire réfutatif{/violet} : il fait dire à ses interlocuteurs ce qu'ils croient de la justice ou de la piété, et {coral}montre que leurs croyances ne s'accordent pas entre elles{/coral}. Au cœur de l'examen, la question {amber}« qu'est-ce que X ? »{/amber}. Les réponses échouent parce qu'elles sont trop {red}étroites{/red} (elles laissent de côté certains actes pieux) ou trop {pink}larges{/pink} (elles englobent aussi des actes justes mais non pieux, voire impies).

    **De ces échecs, on déduit ce que Socrate cherche : une propriété, la Piété,** {amber}**présente dans tous les actes pieux**{/amber}**, et** {amber}**qui est cause qu'ils soient pieux**{/amber}**.** Elle le peut {coral}parce qu'elle est elle-même pieuse{/coral} : la Piété s'{violet}**auto-prédique**{/violet}, c'est-à-dire {amber}possède la propriété qu'elle est{/amber}. Dans ces dialogues, il n'y a encore {green}qu'une seule manière d'avoir une propriété{/green} : {yellow}Socrate est pieux exactement comme la Piété est pieuse{/yellow}. On connaît la Piété quand on peut en {violet}rendre raison{/violet} ({blue}*logos*{/blue}), c'est-à-dire en donner la définition, qui dit son {violet}essence{/violet} ({blue}*ousia*{/blue}). Elle n'a sans doute {coral}pas d'autre propriété que d'être pieuse{/coral}, alors que Socrate, ou une prière, ont bien d'autres propriétés.

    **La propriété socratique est un** {violet}**universel immanent**{/violet}**, c'est-à-dire** {amber}**présent dans les choses sensibles elles-mêmes**{/amber} : la piété est en Socrate, si bien que {coral}la définition de la Piété vaut aussi pour lui{/coral}. « Séparer l'universel », c'est {red}refuser cette thèse{/red} et {green}poser la Piété hors des choses pieuses{/green} ; et si Aristote a raison, Platon le fait {coral}parce que les choses sensibles changent{/coral}.
  points:
  - id: platon-idees-i3-p1
    sentence: "« __Mais Socrate__ ___ ; eux, au contraire, **les ont séparés** et ont appelé Idées ceux des êtres qui sont tels. » (Aristote, *Métaphysique*, M, 4, 1078b30-32)"
    answer: "ne rendait séparables ni les universels ni les définitions"
