  - id: platon-idees-i7
    title: "La simplicité des Idées"
    notes: |-
      **Les Idées sont dites unes (`hen`) ou d'une seule forme (`monoeides`), surtout dans l'argument de l'affinité : la seule chose qui se dise d'une Idée serait elle-même** (*Phédon*, 78b-84b). La Justice est juste, et n'est rien d'autre que juste. Des raisons épistémologiques appuient cette lecture (voir la réminiscence).

      **Mais deux séries de textes empêchent une simplicité stricte.**
      - Le Bien : la *République* rapporte toutes les Idées au Bien ; Platon semble tenu de dire que chaque Idée est bonne.
      - La définition : chercher ce qu'est la Justice, c'est chercher une formule trouvée au terme d'une longue étude, comme le savant cherche ce qu'est l'or. Les énoncés d'auto-prédication sont des **billets à ordre** : dire « la Justice est juste », c'est s'engager à découvrir sa nature. Or la définition complète sera complexe.

      | Définition | Où |
      | la chaleur est l'énergie cinétique moléculaire moyenne | exemple moderne |
      | la justice est le fait de faire ce qui est sien | *République*, 441d |
      | le nom est un instrument qui instruit et sépare la nature | *Cratyle*, 388b |
      | l'homme est un animal bipède raisonnable | jamais dit par Platon |

      **Le progrès philosophique doit apprendre non que la Justice est juste, mais ce qu'est la Justice** : à un certain niveau, les Idées ne peuvent être strictement simples. Or, avec deux rapports de prédication seulement, on ne sait plus si les Idées __participent__ des propriétés qui leur sont liées ou si elles __sont__ ces propriétés.
