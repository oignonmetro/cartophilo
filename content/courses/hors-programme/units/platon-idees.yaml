    answer: "socratiques"
    alt: []
  - id: platon-idees-i2-p3
    sentence: "Les **dialogues de la maturité**, où Platon expose pour la première fois l'immortalité de l'âme, les Idées et la réminiscence, __sont le *Cratyle*, le *Banquet*, le *Phédon*,__ ___, et peut-être le *Phèdre*."
    answer: "la République"
    alt: ["République"]
  - id: platon-idees-i2-p4
    sentence: "__Le *Ménon* et le__ ___ appartiennent à la **fin de la période socratique** et confinent déjà à la période de la maturité."
    answer: "Gorgias"
    alt: []
