  - id: platon-idees-i11
    title: "D'où vient la déficience des choses ?"
    notes: |-
      **Pourquoi les choses sont-elles déficientes ? Pour Aristote, le changement et l'essence sont au cœur de la réponse** : « Mais, comme Socrate s'occupait de questions éthiques et non de la nature dans son ensemble, que pourtant, dans ce domaine, il cherchait l'universel et qu'il a, le premier, arrêté sa réflexion sur les définitions, Platon l'approuva et, à cause de la nature de cette recherche, pensa qu'elle a lieu d'être pour des objets autres que les sensibles et non pour les sensibles : la définition commune de l'un quelconque des sensibles est, en effet, impossible, du moins s'ils sont en perpétuel changement. » (*Métaphysique*, A, 6, 987b1-7). Autrement dit : savoir, c'est définir ; on ne peut définir ce qui change sans cesse ; la définition porte donc sur d'autres objets que les choses sensibles.

      **Trois explications de la déficience des choses :**

      | Explication | Argument | Limite |
      | le {coral}changement{/coral} (Aristote) | la science porte sur l'essence ; l'essence exclut le changement ; les choses, qui changent, n'ont pas d'essence | trop rapide : certaines choses ont peut-être des propriétés essentielles, qui ne changent pas |
      | la {teal}complexité{/teal} (*Phédon* 74 s., 78 s. ; *République* 476e-479, 523a s.) | une chose a plusieurs propriétés ; si elle est F et G, elle est F et non-F, puisque le G n'est pas F : l'esprit n'arrive pas à isoler F | une Idée qui aurait plusieurs propriétés serait inconnaissable elle aussi |
      | la {violet}contingence{/violet} (commentateurs Vlastos, Code) | les choses ont leurs propriétés de façon contingente ; une Idée a les siennes nécessairement, comme par une « colle logique » | elle refuse toute essence aux choses, donc toute science d'elles |

      **Les deux dernières explications ne mènent pas au même endroit.** Si la déficience vient de la complexité, et non de la contingence, certaines choses peuvent avoir une essence : on pourrait alors savoir que « Socrate est un homme ».

      **Le commentateur Silverman doute, contre la commentatrice Gail Fine, que la coprésence des contraires ou la seule complexité suffisent à expliquer la déficience** : il suit Aristote, pour qui le changement est décisif, parce qu'il interdit la définition et donc la science. Les choses sont alors déficientes de deux façons : pour la connaissance, puisqu'il n'y a pas de science d'elles si la science porte sur l'essence ; et dans leur être même, puisque avoir une essence vaut mieux que n'en pas avoir.
