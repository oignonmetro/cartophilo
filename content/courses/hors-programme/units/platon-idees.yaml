  - id: platon-idees-i8
    title: "La séparation des Idées"
    notes: |-
      **En quel sens les Idées sont-elles « séparées » ? Le meilleur fil conducteur est la formule « par soi » (`auto kath' hauto`) : chaque Idée est ce qu'elle est par elle-même.** Demander « qu'est-ce que F ? », c'est chercher ce qu'est F indépendamment de ses exemplaires matériels, et même, en un sens, de toute autre chose, autre Idée ou âme. Ce qu'une Idée est par elle-même, c'est son essence (`ousia`) : la *République* dit d'elle qu'elle est « ce qui est complètement » (477a), et les énoncés d'auto-prédication (« le Juste est juste ») expriment ce même lien entre l'Idée et son essence.

      **Pour la lecture prédicationniste, ce lien est l'Être.** Le commentateur Code l'écrit avec une majuscule pour le distinguer du « est » ordinaire : « la Justice Est juste ». Le prédicat (« juste ») tient lieu de la définition complète de l'Idée, ce que le commentateur Nehamas appelle « ce que c'est qu'être F ». Deux principes règlent ce rapport :
      - I. Chaque essence est l'essence d'une seule Idée.
      - II. Chaque Idée a, ou est, une seule essence.
      Le principe II explique en quel sens une Idée est `monoeides`, « d'une seule forme » : elle n'a qu'une essence.

      **L'auto-prédication n'est donc pas un trait accessoire : elle fait partie de la définition même d'une Idée**, puisque toute Idée doit Être son essence. Une Idée Est ce qu'elle est, qu'une chose en participe ou non, et même si aucune chose ne pouvait en participer : elle est séparée de tous ses exemplaires. Et puisqu'elle Est son essence sans que cela dépende de ce que nous en savons ni des autres Idées, elle ne dépend de rien.

      | Séparation | Critère |
      | {teal}définitionnelle{/teal} | la définition vaut pour l'Idée, et non pour les choses dont elle est séparée : la définition du Beau ne se dit pas d'Hélène |
      | {coral}existentielle{/coral} | l'Idée existe à part de tout le reste |

      **Être une essence étant, aux yeux de Platon, la façon d'être la plus haute, les Idées sont sans doute séparées dans les deux sens.**
    points:
      - id: platon-idees-i8-p1
        sentence: "Le meilleur guide pour comprendre la séparation des Idées est que chacune est ce qu'elle est ___, ce qu'exprime la formule `auto kath' hauto`."
        answer: "par elle-même"
        alt: ["par soi", "en soi"]
      - id: platon-idees-i8-p2
        sentence: "Demander « qu'est-ce que F ? », c'est chercher ce qu'est F indépendamment de ses exemplaires ___, et en un sens de toute autre chose, autre Idée ou âme."
