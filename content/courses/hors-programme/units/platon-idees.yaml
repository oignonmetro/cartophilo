        sentence: "La même propriété, la Beauté, se rapporte au Beau en soi par l'Être et à Hélène par la Participation : ce n'est pas la beauté d'Hélène qui est déficiente, mais sa ___ de l'avoir."
        answer: "façon"
        alt: ["manière"]
      - id: platon-idees-i13-p5
        sentence: "La beauté ne caractérisant pas le Beau en soi, celui-ci ne saurait être un objet beau ___, contrairement à ce que voudrait une lecture approximationniste."
        answer: "exemplaire"
        alt: ["paradigmatique"]
