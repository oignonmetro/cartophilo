  - id: platon-idees-i5
    title: "Le Phédon : l'hypothèse des Idées, être et participer"
    notes: |-
      Les arguments suivants du *Phédon* **précisent les traits des Idées.**
      - La réminiscence : elles sont **parfaites**, et les choses particulières s'efforcent de leur ressembler sans y parvenir.
      - L'affinité : elles sont **simples**, sans parties, d'une seule forme (`monoeides`), alors que les choses sont composées, divisibles et multiformes.
      - Le dernier argument : Platon y pose l'**hypothèse des Idées** pour expliquer la génération et la destruction, c'est-à-dire le changement en général.

      Cébès ayant accepté l'hypothèse, Socrate en tire une conséquence nouvelle (100c3-7) : « Car pour moi, il me semble que si, en dehors du beau en soi, il existe une chose belle, la seule raison pour laquelle cette chose est belle est qu'elle participe à ce beau en soi, et j'en dis autant de tout le reste. Est-ce que tu m'accordes cette sorte de cause ? »

      **Ce passage distingue deux façons, pour un sujet, d'avoir une propriété** (deux rapports de « prédication »). Il y a en effet deux sortes de sujets, les Idées et les choses matérielles ; et il semble y avoir une Idée pour chaque propriété qu'une chose peut gagner ou perdre : Hélène devient belle, il y a donc un Beau en soi.

      | Rapport | Sujet | Exemple |
      | {teal}Participation{/teal} | une chose matérielle | Hélène est belle parce qu'elle participe du Beau |
      | {violet}Être{/violet} | une Idée | le Beau en soi est beau, sans participer de rien |

      Le Beau en soi ne participe pas du Beau, puisqu'il n'est pas autre chose que lui : il est beau, tout simplement. C'est ce second rapport, celui d'une Idée à la propriété qu'elle est, qu'on appelle ici l'**Être**.

      **Les Idées héritent ainsi des propriétés socratiques leur auto-prédication** : le Beau est beau, la Justice juste, l'Égalité égale. Et c'est __parce que__ le Beau en soi est beau que participer du Beau rend Hélène belle.

      ! Toute la difficulté est de comprendre en quel sens le Beau est beau : pas comme Hélène, puisqu'il ne participe de rien ; mais comment, alors ? La réponse à cette question commande toute la théorie des Idées.
