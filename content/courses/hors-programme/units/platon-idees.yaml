  - id: platon-idees-i6
    title: "L'auto-prédication : trois lectures"
    notes: |-
      **Que veut dire « le Juste est juste » ?** Le sujet, « le Juste », et le prédicat, « juste », semblent renvoyer à la même chose, l'Idée de Justice. Toute la question porte sur la **copule** : comment l'Idée se rapporte-t-elle à elle-même ?

      | Lecture | Le « est » de « le Beau est beau » | Tenants |
      | {teal}caractérisation{/teal} | le Beau est une chose belle, comme Hélène | Vlastos ; variante approximationniste : Malcolm |
      | {violet}identité{/violet} | l'Idée est identique à son essence | Cherniss, Allen |
      | {coral}prédicationniste{/coral} | un rapport primitif, l'Être, entre l'Idée et son essence | Nehamas, Code, Silverman |

      **La caractérisation** (Vlastos) : la Justice est juste comme Socrate est juste, le Cercle en soi est rond comme un ballon ; le Beau figure dans l'inventaire des choses belles, aux côtés d'Hélène. **Variante approximationniste** (Malcolm) : l'Idée est l'exemplaire parfait de la propriété, la chose qui en participe un exemplaire imparfait, comme un cercle tracé n'est pas parfaitement circulaire. Mais alors la beauté d'Hélène n'est pas celle du Beau : ou bien les choses belles n'ont rien en commun, et il n'y a plus d'« un sur plusieurs » à poser ; ou bien il faut une Idée de la Beauté imparfaite. Aucune issue n'est heureuse. **Autre variante** : le Beau est beau et seulement beau, d'une seule forme (78b), quand Hélène est aussi femme, et infidèle.

      **L'identité** (Cherniss, Allen) : le « est » est d'identité ; l'Idée est son essence, et le Beau ne figure pas parmi les choses belles.

      **La lecture prédicationniste** refuse aussi la caractérisation et admet au bout du compte l'identité de l'Idée et de son essence, mais ne lit pas l'énoncé comme une identité : il affirme un **rapport ontologique primitif**, l'Être, qui n'est expliqué par aucun rapport plus fondamental. La Participation caractérise (Hélène, en participant du Beau, devient belle) ; l'Être ne caractérise jamais.

      ! Le « est » de l'auto-prédication n'est pas forcément celui de « Hélène est belle » : c'est tout l'enjeu du débat.
