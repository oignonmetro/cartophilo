  - id: platon-idees-i12
    title: "La matière et le déterminé"
    notes: |-
      Dès le début du *Phédon*, **les choses sont marquées comme matérielles, et la matière semble à la racine de leurs autres traits.** Ce qui est étendu est corps ; le corps est composé ; le composé est multiforme (80b4), et sujet à la dissolution et à la composition, c'est-à-dire à la génération et à la destruction, qui incluent, au sens large (100 s.), l'échange des propriétés. La coprésence supposant la complexité, la matérialité est l'une des racines de ce que chaque chose sensible soit F et non-F.

      **La perception aussi passe par la matière** : elle exige un commerce matériel entre le corps perçu et l'organe du sens, auquel peut s'ajouter un jugement. Les réserves qui font qu'une chose est F et non-F sont temporelles, comparatives, ou relatives à divers percevants : sans matière, aucune chose ne paraîtrait avoir des propriétés coprésentes.

      **Surtout, la matière impose que la propriété se manifeste de façon déterminée** : un bâton a telle longueur, cinq pouces, tel poids, six onces. Le *Ménon* (74 s.) distingue le **déterminable** (le rouge, la couleur) et le **déterminé** (le cramoisi, l'écarlate). Le Triangle en soi est une figure à trois côtés dont les lignes n'ont pas de largeur et les angles pas de degré déterminé ; tout triangle particulier a des lignes larges et des angles de tant de degrés.

      | | Idée | Propriété dans la chose |
      | nature | générale, abstraite | singulière, concrète |
      | mode | non déterminée | déterminée |
      | possession | nécessaire | contingente |

      **La matière est condition suffisante, non nécessaire, de la contingence** : les âmes aussi sont contingentement ce qu'elles sont, par exemple avides d'argent.
