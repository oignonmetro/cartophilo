lessons:
- id: platon-idees-i1
  title: "Les héritages : Parménide, Héraclite, Socrate"
  notes: |-
    **Trois prédécesseurs ont façonné la métaphysique et la théorie de la connaissance de Platon : {sky}Parménide{/sky}, {sky}Héraclite{/sky} et {sky}Socrate{/sky}.** Des deux premiers ne restent que des fragments, dont certains sont cités dans les dialogues de Platon ; Socrate n'a rien écrit, et le portrait qu'en fait Platon est notre principale source.

    | Prédécesseur | Thèse | Ce qu'elle inspire à Platon |
    | Parménide | seul l'être est ; le changement n'est qu'une apparence | les Idées, immuables |
    | Héraclite | tout change sans cesse : c'est le flux | sa conception des objets matériels |
    | Socrate | la question « qu'est-ce que X ? » en éthique | la recherche de l'universel |

    {sky}**Parménide**{/sky} : {amber}__il n'y a et ne peut y avoir qu'une seule chose, l'être__{/amber}, et l'{pink}on ne peut ni penser ni dire ce qui n'est pas{/pink}. Or changer, c'est devenir ce qu'on n'était pas, passer du non-être à l'être ({yellow}de non bronzé, devenir bronzé{/yellow}) : {amber}rien ne change donc, la réalité est immobile{/amber}. Ses fragments ne permettent pas de trancher : veut-il dire qu'il n'existe qu'une seule chose ({violet}monisme numérique strict{/violet}), ou seulement qu'il n'existe qu'une sorte de choses, les étants, c'est-à-dire les choses qui sont ?

    {sky}**Héraclite**{/sky}, « l'apôtre du changement » : {green}la seule chose constante est la loi même du changement{/green} ; {red}croire qu'il existe des réalités immuables est une illusion{/red}.

    {sky}**Socrate**{/sky} est, selon la plupart des spécialistes, {green}l'influence décisive{/green}. D'après Platon, l'historien {sky}Xénophon{/sky} et le poète comique {sky}Aristophane{/sky}, il s'occupe {amber}presque exclusivement d'éthique{/amber} : soucieux du {violet}soin de l'âme{/violet} pour vivre heureux ({sky}*Apologie*, 29d-30b{/sky}), il se sert de thèses métaphysiques {coral}sans chercher à en faire une théorie{/coral}, comme le souligne le commentateur {sky}Gregory Vlastos{/sky}.

    ! Socrate {green}__utilise__ des notions métaphysiques au service de l'éthique{/green} ; mais {red}savoir s'il en fait la théorie est difficile{/red}, puisque nous n'avons guère que les dialogues de Platon pour en juger.
