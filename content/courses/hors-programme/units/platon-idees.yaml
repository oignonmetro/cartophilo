- id: platon-idees-i1d
  title: "Parenthèse (2) : Ni périr ni changer, l'étant de Parménide"
  notes: |-
    **L'argument contre la naissance vaut aussi contre la mort et contre tout changement : {coral}périr, c'est finir dans le non-être ; changer, c'est cesser d'être ce qu'on était ; dans les deux cas, il faut penser un « n'être pas »{/coral}.** Platon gardera cette immobilité pour ses Idées.

    **Périr est impossible pour la même raison que naître.** Périr, ce serait passer d'être à ne plus être : il faudrait penser que l'étant {red}sera rien{/red}, le non-être devenant point d'arrivée au lieu de point de départ. Et rien ne pourrait le détruire : {teal}« rien n'est ni ne sera d'autre que l'étant »{/teal} (B 8, v. 36-37), donc aucune cause ne peut venir du dehors. Comment pourrait-on passer de l'être au non-être avec de l'être ?

    **Le changement ordinaire n'y échappe pas.** La feuille qui jaunit ne sort pas du néant, dira-t-on : elle était déjà feuille. Mais jaunir, c'est {yellow}devenir ce qui n'était pas jaune{/yellow} ; se déplacer, {yellow}être là où l'on n'était pas{/yellow}. Or, pour Parménide, « ne pas être jaune », c'est encore « ne pas être » : il faut être tout à fait ou pas du tout, et {coral}un non-être partiel reste du non-être{/coral}. D'où les autres « signes » ({blue}*sêmata*{/blue}, B 8, v. 2) de l'étant : **homogène**, car s'il y avait plus d'être ici que là, il y aurait là un peu de non-être (v. 22-25) ; **immobile**, {coral}puisque genèse et destruction ont été chassées{/coral} (v. 26-28). {teal}« Naître et périr{/teal}, être et ne pas être, {teal}changer de lieu{/teal} et {teal}d'éclatante couleur »{/teal} ne sont que des {teal}noms{/teal} que les mortels ont posés, {teal}persuadés qu'ils sont vrais{/teal} (v. 38-41) : ces mortels {teal}« à deux têtes »{/teal}, pour qui être et ne pas être sont tantôt la même chose, tantôt non (B 6, v. 5-9). {green}Le devenir est une illusion de langage{/green} : nous disons « n'est plus », « n'est pas encore », comme si le non-être pouvait se dire.

    ! Parménide ne refuse pas seulement la naissance __à partir de rien__ : la feuille qui jaunit ou le corps qui se déplace tombent sous le même argument.

    **Reste une question : tout « ne pas être » est-il un néant ?** C'est sur ce point que Platon et Aristote attaqueront l'argument.
