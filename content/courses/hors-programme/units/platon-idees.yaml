- id: platon-idees-i2
  title: "La chronologie des dialogues et la question socratique"
  notes: |-
    **Platon fait presque toujours parler Socrate : lit-on alors les doctrines de Socrate, celles de Platon, ou ni les unes ni les autres ? C'est la** {violet}**« question socratique »**{/violet}**.** Elle dépend de {coral}l'ordre dans lequel les dialogues ont été écrits{/coral}. On les répartit d'ordinaire en trois périodes :

    | Période | Dialogues |
    | de jeunesse, « socratique » | *Apologie*, *Criton*, *Euthyphron*, *Charmide*, *Ion*, *Lysis*, *Lachès*, *Hippias mineur*, *Ménexène*, *Euthydème*, *Protagoras* ; vers la fin, *Hippias majeur*, *Gorgias*, peut-être *Ménon* |
    | intermédiaire, de la maturité | *Cratyle*, *Banquet*, *Phédon*, *République*, peut-être *Phèdre* |
    | tardive, après *La République* | *Parménide*, *Théétète*, *Sophiste*, *Politique*, *Timée*, *Philèbe*, *Lois*, *Critias* |

    {sky}**Les dialogues socratiques**{/sky}, où Socrate mène toujours la discussion, sont des {amber}enquêtes éthiques{/amber} ({yellow}qu'est-ce que le courage ? la justice ?{/yellow}) ; on pense qu'ils exposent {amber}les doctrines de Socrate lui-même{/amber}. {sky}**Ceux de la maturité**{/sky} **exposeraient** {amber}**celles de Platon**{/amber}, bien que Socrate y parle encore. On y trouve pour la première fois trois thèses :
    - l'{violet}immortalité de l'âme{/violet}, sur laquelle Socrate ne se prononce pas dans l'{sky}*Apologie*{/sky} ;
    - les {violet}Idées{/violet}, {amber}réalités hors de l'espace et du temps{/amber}, qui sont {amber}les objets de la science{/amber} et, d'une certaine façon, {amber}les causes de ce qui arrive dans le monde physique{/amber} ;
    - la {violet}**réminiscence**{/violet} : avant d'être enfermée dans un corps, {coral}l'âme immortelle a vu les Idées{/coral}, et {coral}elle s'en ressouvient ensuite au prix d'un long effort{/coral}.

    {amber}**Platon a-t-il changé d'avis d'une période à l'autre ?**{/amber} Deux camps de commentateurs s'opposent : les {violet}unitaristes{/violet}, comme {sky}Shorey{/sky}, pour qui {amber}il garde ses thèses centrales{/amber} ; les {violet}évolutionnistes{/violet}, comme {sky}Owen{/sky}, pour qui {amber}il en change{/amber}. La position la plus plausible, sans doute dominante aujourd'hui, est {green}intermédiaire{/green} : sur certaines thèses, Platon {coral}approfondit, découvre des difficultés, voire se dédit{/coral} ; sur d'autres, {coral}il maintient ses intuitions fondamentales{/coral}.

    ! Les dialogues de la maturité ne donnent que les {amber}__premières__ pensées métaphysiques de Platon{/amber} : {coral}les dialogues tardifs semblent en modifier des doctrines clefs{/coral}.
  points:
  - id: platon-idees-i2-p1
    sentence: "Platon faisant parler Socrate dans la plupart de ses dialogues, le lecteur doit se demander s'il lit les **doctrines de Socrate, de Platon, ou d'aucun des deux** : __c'est la question__ ___, liée à la chronologie des dialogues."
    answer: "socratique"
    alt: []
  - id: platon-idees-i2-p2
