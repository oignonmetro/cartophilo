  - id: platon-idees-i10
    title: "Image et copie : les traits des choses sensibles"
    notes: |-
      **Platon décrit le rapport des choses aux Idées par des métaphores : image et original, copie et modèle, exemple et paradigme.** Le monde physique est une copie des Idées, et une copie dépend de son original. Mais les Idées ne sont pas dans les choses, et ne dépendent donc pas d'elles : la dépendance ne va que dans un sens. Le *Phédon* ajoute une autre métaphore : les choses **s'efforcent** d'être telles que les Idées, sans y parvenir, et leur restent donc inférieures.

      **L'argument de l'affinité (78b-84b) oppose les deux sortes d'êtres par des traits qui vont par paires :**

      | Idées | Choses particulières |
      | immatérielles, sans lieu, hors du temps | matérielles, étendues dans l'espace et le temps |
      | immuables, peut-être même sans changement de Cambridge | changeantes, peut-être en flux héraclitéen total |
      | simples, uniformes (`monoeides`, `hen`) | composées (`suntheton`), multiformes |
      | objets de la science, saisies par l'intellect | objets des sens et de l'opinion |
      | l'Idée de F ne peut être conçue comme non-F | paraissent, et sont peut-être, F et non-F |

      **Un changement de Cambridge est un changement purement relationnel**, qui n'affecte pas la chose elle-même : par exemple, être pensée par une âme à tel moment, puis ne plus l'être. Les Idées n'en subissent peut-être même pas. Les choses, elles, changent peut-être en tout point et à tout instant.

      ! Les choses dépendent des Idées, et non l'inverse : c'est pourquoi on les dit __déficientes__, c'est-à-dire inférieures aux Idées.
