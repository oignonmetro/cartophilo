- id: platon-idees-i11
  title: "D'où vient la déficience des choses ?"
  notes: |-
    {amber}**Pourquoi les choses sont-elles déficientes ?**{/amber} **Pour** {sky}**Aristote**{/sky}**, le changement et l'essence sont au cœur de la réponse** : {teal}« {/teal}Mais, comme Socrate s'occupait de questions éthiques et non de la nature dans son ensemble, que pourtant, dans ce domaine, {teal}il cherchait l'universel{/teal} et qu'il a, le premier, {teal}arrêté sa réflexion sur les définitions{/teal}, Platon l'approuva et, à cause de la nature de cette recherche, pensa qu'elle a lieu d'être {teal}pour des objets autres que les sensibles{/teal} et non pour les sensibles : {teal}la définition commune de l'un quelconque des sensibles est, en effet, impossible{/teal}, du moins {teal}s'ils sont en perpétuel changement. »{/teal} ({sky}*Métaphysique*, A, 6, 987b1-7{/sky}). Autrement dit : {amber}savoir, c'est définir{/amber} ; {amber}on ne peut définir ce qui change sans cesse{/amber} ; {coral}la définition porte donc sur d'autres objets que les choses sensibles{/coral}.

    **Trois explications de la déficience des choses :**

    | Explication | Argument | Limite |
    | le {amber}changement{/amber} (Aristote) | la science porte sur l'essence ; l'essence exclut le changement ; les choses, qui changent, n'ont pas d'essence | trop rapide : certaines choses ont peut-être des propriétés essentielles, qui ne changent pas |
    | la {amber}complexité{/amber} (*Phédon* 74 s., 78 s. ; *République* 476e-479, 523a s.) | une chose a plusieurs propriétés ; si elle est F et G, elle est F et non-F, puisque le G n'est pas F : l'esprit n'arrive pas à isoler F | une Idée qui aurait plusieurs propriétés serait inconnaissable elle aussi |
    | la {amber}contingence{/amber} (commentateurs Vlastos, Code) | les choses ont leurs propriétés de façon contingente ; une Idée a les siennes nécessairement, comme par une « colle logique » | elle refuse toute essence aux choses, donc toute science d'elles |

    **Les deux dernières explications** {red}**ne mènent pas au même endroit**{/red}**.** Si la déficience vient de la {amber}complexité{/amber}, et non de la {amber}contingence{/amber}, {coral}certaines choses peuvent avoir une essence{/coral} : on pourrait alors savoir que {yellow}« Socrate est un homme »{/yellow}.

    **Le commentateur** {sky}**Silverman**{/sky} **doute, contre la commentatrice** {sky}**Gail Fine**{/sky}**, que** {red}**la coprésence des contraires ou la seule complexité suffisent à expliquer la déficience**{/red} : il suit Aristote, pour qui {green}le changement est décisif{/green}, {coral}parce qu'il interdit la définition et donc la science{/coral}. Les choses sont alors déficientes de deux façons : {amber}pour la connaissance{/amber}, puisqu'il n'y a pas de science d'elles si la science porte sur l'essence ; et {amber}dans leur être même{/amber}, puisque {coral}avoir une essence vaut mieux que n'en pas avoir{/coral}.
