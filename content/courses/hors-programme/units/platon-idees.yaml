- id: platon-idees-i12
  title: "La matière et le déterminé"
  notes: |-
    Dès le début du {sky}*Phédon*{/sky}, **les choses sont présentées comme** {violet}**matérielles**{/violet}**, et** {green}**la matière semble à la racine de leurs autres défauts**{/green}**.** {amber}Ce qui est étendu est un corps{/amber} ; {amber}un corps est composé{/amber} ; {amber}un composé est multiforme{/amber} ({sky}80b4{/sky}), et {coral}il peut se défaire ou se former, c'est-à-dire naître et périr{/coral}. Au sens large que leur donne {sky}*Phédon* 100 s.{/sky}, naître et périr incluent {amber}le simple fait de gagner ou de perdre une propriété{/amber}. Or, pour être à la fois F et non-F, il faut avoir plusieurs propriétés : {coral}en rendant les choses composées, la matière est l'une des racines de la coprésence des contraires{/coral}.

    **La** {violet}**perception**{/violet} **aussi passe par la matière** : elle exige {amber}un contact matériel entre le corps perçu et l'organe du sens{/amber}, auquel peut s'ajouter un jugement. Or une chose n'est F et non-F que sous certaines réserves : {yellow}à tel moment et non à tel autre, comparée à ceci et non à cela, pour tel observateur et non pour tel autre{/yellow}. {coral}Toutes ces réserves supposent un corps situé dans l'espace et le temps{/coral} : {green}sans matière, aucune chose ne paraîtrait à la fois F et non-F{/green}.

    **Surtout, la matière oblige une propriété à se manifester** {green}**de façon déterminée**{/green} : {yellow}un bâton n'a pas « de la longueur », il a telle longueur, cinq pouces, et tel poids, six onces{/yellow}. Le {sky}*Ménon*{/sky} ({sky}74 s.{/sky}) distingue le {violet}**déterminable**{/violet} ({yellow}la couleur, le rouge{/yellow}) et le {violet}**déterminé**{/violet} ({yellow}le cramoisi, l'écarlate{/yellow}). Le {yellow}Triangle en soi{/yellow} est une figure à trois côtés {amber}dont les lignes n'ont pas de largeur et dont les angles n'ont pas de mesure déterminée{/amber} ; tout triangle particulier a {amber}des lignes d'une certaine largeur et des angles de tant de degrés{/amber}.

    | | Idée | Propriété dans la chose |
    | nature | générale, abstraite | singulière, concrète |
    | mode | non déterminée | déterminée |
    | possession | nécessaire | contingente |

    **Tout ce qui est matériel a ses propriétés de façon contingente,** {red}**mais l'inverse n'est pas vrai**{/red} : {yellow}les âmes{/yellow}, qui ne sont pas matérielles, sont elles aussi contingentement ce qu'elles sont ({yellow}une âme peut être avide d'argent, ou ne pas l'être{/yellow}). La matière est donc {green}une condition suffisante de la contingence{/green}, {red}non une condition nécessaire{/red}.
