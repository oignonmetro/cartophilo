  - id: platon-idees-i7
    title: "La simplicité des Idées"
    notes: |-
      **Les Idées sont dites unes (`hen`) ou d'une seule forme (`monoeides`), surtout dans l'argument de l'affinité : on en tire qu'une Idée n'aurait pas d'autre propriété qu'elle-même** (*Phédon*, 78b-84b). La Justice est juste, et n'est rien d'autre que juste. La théorie de la connaissance appuie cette lecture : une Idée simple ne peut paraître autre que ce qu'elle est (voir, dans l'unité sur la connaissance, la leçon sur l'Égal en soi).

      **Mais deux séries de textes empêchent une simplicité stricte.**
      - Le Bien : la *République* rapporte toutes les Idées au Bien ; Platon semble donc tenu de dire que chaque Idée est bonne, ce qui lui donne une seconde propriété.
      - La définition : chercher ce qu'est la Justice, c'est chercher une formule qu'on ne trouvera qu'au terme d'une longue étude, comme le savant cherche ce qu'est l'or. Dire « la Justice est juste », c'est comme signer un **billet à ordre**, une promesse de payer plus tard : on s'engage à fournir un jour la définition complète. Or cette définition, une fois trouvée, comprendra plusieurs éléments.

      | Définition complexe | Source |
      | la chaleur est l'énergie cinétique moléculaire moyenne | exemple moderne |
      | la justice est le fait de faire ce qui est sien | *République*, 441d |
      | le nom est un instrument qui instruit et sépare la nature | *Cratyle*, 388b |
      | l'homme est un animal bipède raisonnable | exemple que Platon ne donne jamais |

      **Le progrès philosophique doit apprendre non que la Justice est juste, mais ce qu'est la Justice** : à un certain niveau, les Idées ne peuvent donc être strictement simples.

      **D'où une question sans réponse chez Platon.** La théorie ne dispose que de deux manières d'avoir une propriété : participer et Être. Quand une Idée est bonne, ou quand la Justice est « faire ce qui est sien », __participe__-t-elle de ces propriétés, comme une chose sensible, ou les __est__-elle ?
    points:
