  - id: platon-idees-i9
    title: "L'étendue des Idées : les propriétés incomplètes"
    notes: |-
      **Y a-t-il une Idée pour chaque propriété ?** Les dialogues de la maturité argumentent rarement l'existence d'une Idée, et n'en traitent qu'un petit nombre : les vertus étudiées par Socrate, la Beauté, l'Égalité, le Chaud et le Froid, la Grandeur. L'argument de la réminiscence, ceux de la *République* sur les objets de la science (V, 477 s.) et sur les perceptions qui appellent la pensée (VII, 523 s.), l'ascension vers le Beau du *Banquet* et le dernier argument du *Phédon* visent tous des **propriétés incomplètes** (Fine, Irwin).

      **Une propriété incomplète donne, comme prédicat, un énoncé qu'on ne comprend pas seul** : il faut le compléter, d'ordinaire par un complément. « Shaquille O'Neal est grand » : grand pour un homme, non comparé à un arbre.

      **Le problème qu'elles posent : la {coral}coprésence des contraires{/coral}.** Toute chose sensible qui est F est aussi, en un sens, non-F : la vache Elsie est grande comparée à son veau, non grande comparée au taureau Elmer. Platon cherche un porteur **sans réserve** de la grandeur ; aucune chose sensible n'en est un ; il pose donc la Grandeur en soi.

      **Être brune ou être une vache ne souffrent pas la coprésence** : Elsie est une vache, et non pas non-vache. En termes modernes, être une vache est une propriété essentielle d'Elsie, être brune une propriété accidentelle : les Idées ne vaudraient que pour un sous-ensemble des propriétés accidentelles, celles qui n'ont aucun porteur sans réserve. Pour certains lecteurs, Platon croit donc à bien des propriétés, mais ne s'engage théoriquement que sur des Idées de propriétés incomplètes.

      **La notion clef est d'être complètement** : Elsie est complètement une vache, la Grandeur complètement grande, porteur complet d'une propriété incomplète.

      ! Cette lecture restreint l'étendue des Idées sans trancher la nature de l'auto-prédication.
