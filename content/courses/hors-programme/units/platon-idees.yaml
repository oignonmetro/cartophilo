    sentence: "« La doctrine des formes est venue à ceux qui la soutiennent parce qu'ils ont été convaincus, __au sujet de la vérité, par__ ___ selon lesquels **tous les sensibles s'écoulent sans cesse**, d'où il s'ensuit que, s'il y a science et pensée de quelque chose, il faut qu'existent, en dehors des natures sensibles, d'autres natures qui demeurent, car il n'y a pas de science de ce qui s'écoule. » (Aristote, *Métaphysique*, M, 4, 1078b12-17)"
