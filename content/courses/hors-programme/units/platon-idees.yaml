        sentence: "Être une essence étant, aux yeux de Platon, la façon suprême d'être, les Idées sont sans doute séparées au sens définitionnel et aussi au sens ___ : elles existent à part de tout le reste."
        answer: "existentiel"
        alt: []
  - id: platon-idees-i9
    title: "L'étendue des Idées : les propriétés incomplètes"
    notes: |-
      **Y a-t-il une Idée pour chaque propriété ?** Les dialogues de la maturité démontrent rarement qu'une Idée existe, et n'en traitent qu'un petit nombre : les vertus étudiées par Socrate, la Beauté, l'Égalité, le Chaud et le Froid, la Grandeur. Selon les commentateurs Fine et Irwin, les textes décisifs portent tous sur des **propriétés incomplètes** : l'argument de la réminiscence, les passages de la *République* sur les objets de la science (V, 477 s.) et sur les perceptions qui appellent la pensée (VII, 523 s.), l'ascension vers le Beau du *Banquet*, le dernier argument du *Phédon*.

      **Une propriété incomplète donne un énoncé qu'on ne comprend pas seul** : il faut préciser par rapport à quoi. « Shaquille O'Neal est grand » : grand pour un homme, mais non comparé à un arbre.

      **Le problème qu'elles posent : la {coral}coprésence des contraires{/coral}.** Toute chose sensible qui est F est aussi, en un sens, non-F : la vache Elsie est grande comparée à son veau, mais non grande comparée au taureau Elmer. Platon cherche quelque chose qui soit grand **sans réserve** ; aucune chose sensible ne l'est ; il pose donc la Grandeur en soi.

      **D'autres propriétés ne souffrent pas la coprésence** : Elsie est une vache, et n'est en aucun sens non-vache ; si elle est brune de partout, elle n'est en aucun sens non brune. En termes modernes, être une vache est une propriété essentielle d'Elsie, être brune une propriété accidentelle. Les Idées ne vaudraient alors que pour certaines propriétés accidentelles : celles que rien de sensible ne possède sans réserve. Pour ces commentateurs, Platon admet bien d'autres propriétés, mais ne pose d'Idées que pour les propriétés incomplètes.

      **Tout tient à la notion d'être « complètement » F.** Elsie est complètement une vache ; aucune chose sensible n'est complètement grande ; seule la Grandeur l'est. Elle est le porteur complet d'une propriété incomplète.

      ! Cette lecture dit pour quelles propriétés il y a des Idées ; elle ne dit pas en quel sens la Grandeur est grande (voir les trois lectures de l'auto-prédication).
    points:
      - id: platon-idees-i9-p1
        sentence: "Les arguments des dialogues de la maturité (réminiscence, *République* V et VII, *Banquet*, dernier argument du *Phédon*) visent tous des propriétés dites ___, selon les commentateurs Fine et Irwin."
        answer: "incomplètes"
        alt: []
      - id: platon-idees-i9-p2
        sentence: "Une propriété incomplète donne, comme prédicat, un énoncé qu'on ne comprend pas seul : « Shaquille O'Neal est grand » doit être complété par « pour un ___ »."
        answer: "homme"
        alt: ["humain"]
      - id: platon-idees-i9-p3
        sentence: "Le phénomène par lequel toute chose sensible qui est F est aussi, en un sens, non-F s'appelle la ___ des contraires."
        answer: "coprésence"
        alt: ["co-présence"]
