- id: platon-idees-i6
  title: "L'auto-prédication : trois lectures"
  notes: |-
    {amber}**Que veut dire « le Juste est juste » ?**{/amber} Le sujet, « le Juste », et le prédicat, « juste », semblent désigner {amber}la même chose, l'Idée de Justice{/amber}. Toute la question porte sur la {violet}**copule**{/violet}, le verbe « est » qui relie le sujet au prédicat : {amber}comment l'Idée se rapporte-t-elle à elle-même ?{/amber} Trois lectures s'opposent chez les commentateurs.

    | Lecture | Sens du « est » dans « le Beau est beau » | Commentateurs |
    | {amber}caractérisation{/amber} | le Beau est une chose belle, comme Hélène | Vlastos ; variante approximationniste : Malcolm |
    | {amber}identité{/amber} | l'Idée est identique à son essence | Cherniss, Allen |
    | {amber}prédicationniste{/amber} | un rapport spécial, l'Être, entre l'Idée et son essence | Nehamas, Code, Silverman |

    {violet}**La caractérisation**{/violet} **(**{sky}**Vlastos**{/sky}**)** : {amber}le Beau possède la beauté comme qualité, à la façon dont une chose belle la possède{/amber}. {yellow}La Justice est juste comme Socrate est juste, le Cercle en soi est rond comme un ballon{/yellow} : le Beau figure dans l'inventaire des choses belles, aux côtés d'Hélène.
    - {violet}**Variante approximationniste**{/violet} **(**{sky}**Malcolm**{/sky}**)** : {amber}l'Idée est l'exemplaire parfait de la propriété{/amber}, et la chose qui en participe {amber}un exemplaire imparfait{/amber}, comme {yellow}un cercle tracé n'est jamais parfaitement circulaire{/yellow}. {red}Objection{/red} : si chaque chose belle n'a qu'une beauté imparfaite, chacune à sa manière, ou bien {red}elles n'ont rien en commun{/red}, et l'on n'a plus de raison de poser une Idée unique au-dessus d'elles ; ou bien elles partagent une même beauté imparfaite, et {red}il faudrait poser une Idée de la Beauté imparfaite{/red}. {coral}Les deux issues sont absurdes.{/coral}
    - **Autre variante** : le Beau est {amber}beau et rien d'autre{/amber} (il est « d'une seule forme », {sky}78b{/sky}), alors qu'{yellow}Hélène est aussi une femme, et infidèle{/yellow}.

    {violet}**L'identité**{/violet} **(**{sky}**Cherniss, Allen**{/sky}**)** : « le Beau est beau » signifie que {amber}l'Idée du Beau est identique à son essence, à ce que c'est qu'être beau{/amber}. {coral}Le Beau n'est donc pas une chose belle parmi d'autres.{/coral}

    {violet}**La lecture prédicationniste**{/violet}**, défendue par les commentateurs** {sky}**Nehamas, Code et Silverman**{/sky}**,** admet que l'Idée et son essence ne font finalement qu'un, mais {red}ne lit pas « le Beau est beau » comme une identité{/red}. L'énoncé exprime {green}un rapport spécial entre l'Idée (le sujet) et son essence (le prédicat) : l'Être{/green}. Ce rapport est {violet}**primitif**{/violet}, c'est-à-dire qu'{amber}aucun rapport plus fondamental ne l'explique{/amber}. À la différence de la {pink}Participation{/pink}, qui fait qu'une chose possède une propriété comme une qualité ({yellow}Hélène devient belle{/yellow}), {coral}l'Être ne fait jamais du Beau une chose belle{/coral}.

    ! Le « est » de « le Beau est beau » {red}n'est pas forcément celui de « Hélène est belle »{/red} : c'est tout l'enjeu du débat.
  points:
  - id: platon-idees-i6-p1
    sentence: "Dans « le Juste est juste », sujet et prédicat semblent renvoyer à la même Idée : __le débat sur l'auto-prédication porte donc sur la__ ___, c'est-à-dire sur **la façon dont l'Idée se rapporte à elle-même**."
    answer: "copule"
    alt: []
  - id: platon-idees-i6-p2
