  - id: platon-idees-i11
    title: "D'où vient la déficience des choses ?"
    notes: |-
      **Aristote indique que le changement et l'essence sont au cœur de la déficience des choses** : « Mais, comme Socrate s'occupait de questions éthiques et non de la nature dans son ensemble, que pourtant, dans ce domaine, il cherchait l'universel et qu'il a, le premier, arrêté sa réflexion sur les définitions, Platon l'approuva et, à cause de la nature de cette recherche, pensa qu'elle a lieu d'être pour des objets autres que les sensibles et non pour les sensibles : la définition commune de l'un quelconque des sensibles est, en effet, impossible, du moins s'ils sont en perpétuel changement. » (*Métaphysique*, A, 6, 987b1-7). La recherche du savoir mène d'abord aux définitions ; Platon pensa qu'on ne pouvait les trouver dans les sensibles, toujours changeants.

      **Trois explications de la déficience des choses :**

      | Explication | Argument | Difficulté |
      | le {coral}changement{/coral} (Aristote) | la science porte sur l'essence ; l'essence exclut le changement ; les choses n'ont pas d'essence | trop rapide : certaines choses ont peut-être des propriétés essentielles |
      | la {teal}complexité{/teal} (*Phédon* 74 s., 78 s. ; *République* 476e-479, 523a s.) | une chose qui est F et G est F et non-F, puisque le G n'est pas F : l'esprit n'arrive pas à isoler F | une Idée qui aurait plusieurs propriétés serait inconnaissable elle aussi |
      | la {violet}contingence{/violet} (Vlastos, Code) | les propriétés des choses leur sont contingentes, celles des Idées y tiennent par une « colle logique » | aucune essence pour les choses |

      **Si l'on insiste sur la complexité, on peut accorder des essences à certaines choses**, et donc une science de « Socrate est un homme ». **Silverman doute, contre Fine, que la coprésence ou la seule complexité suffisent** : selon Aristote, le changement est décisif, parce qu'il interdit la définition et donc la science. Les choses sont alors déficientes épistémologiquement (pas de science d'elles, si la science porte sur l'essence) et métaphysiquement (avoir une essence vaut mieux que n'en pas avoir).
