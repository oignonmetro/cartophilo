- id: platon-idees-i5
  title: "Le Phédon : l'hypothèse des Idées, être et participer"
  notes: |-
    Les arguments suivants du {sky}*Phédon*{/sky} **précisent les traits des Idées.**
    - La {sky}réminiscence{/sky} : elles sont {green}**parfaites**{/green}, et {pink}les choses particulières s'efforcent de leur ressembler sans y parvenir{/pink}.
    - L'{sky}affinité{/sky} : elles sont {green}**simples**{/green}, sans parties, {violet}d'une seule forme{/violet} ({blue}*monoeides*{/blue}), alors que {pink}les choses sont composées, divisibles et multiformes{/pink}.
    - Le {sky}dernier argument{/sky} : Platon y pose l'{violet}**hypothèse des Idées**{/violet} pour {coral}expliquer la génération et la destruction, c'est-à-dire le changement en général{/coral}.

    Cébès ayant accepté l'hypothèse, Socrate en tire une conséquence nouvelle ({sky}100c3-7{/sky}) : {teal}« {/teal}Car pour moi, il me semble que si, en dehors du beau en soi, il existe une chose belle, {teal}la seule raison pour laquelle cette chose est belle est qu'elle participe à ce beau en soi{/teal}, et j'en dis autant de tout le reste. Est-ce que tu m'accordes {teal}cette sorte de cause ? »{/teal}

    **Ce passage distingue** {green}**deux façons, pour un sujet, d'avoir une propriété**{/green} (deux rapports de {violet}« prédication »{/violet}). Il y a en effet {amber}deux sortes de sujets, les Idées et les choses matérielles{/amber} ; et il semble y avoir {coral}une Idée pour chaque propriété qu'une chose peut gagner ou perdre{/coral} : {yellow}Hélène devient belle, il y a donc un Beau en soi{/yellow}.

    | Rapport | Sujet | Exemple |
    | {amber}Participation{/amber} | une chose matérielle | Hélène est belle parce qu'elle participe du Beau |
    | {amber}Être{/amber} | une Idée | le Beau en soi est beau, sans participer de rien |

    Le Beau en soi {red}ne participe pas du Beau{/red}, {coral}puisqu'il n'est pas autre chose que lui{/coral} : {green}il est beau, tout simplement{/green}. C'est ce second rapport, celui d'une Idée à la propriété qu'elle est, qu'on appelle ici l'{violet}**Être**{/violet}.

    **Les Idées héritent ainsi des propriétés socratiques leur** {violet}**auto-prédication**{/violet} : {yellow}le Beau est beau, la Justice juste, l'Égalité égale{/yellow}. Et c'est __parce que__ le Beau en soi est beau que {coral}participer du Beau rend Hélène belle{/coral}.

    ! Toute la difficulté est de comprendre {amber}en quel sens le Beau est beau{/amber} : {red}pas comme Hélène{/red}, puisqu'il ne participe de rien ; mais comment, alors ? {coral}La réponse à cette question commande toute la théorie des Idées.{/coral}
