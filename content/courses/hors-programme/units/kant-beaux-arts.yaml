  - id: kba-l4
    title: "Génie et goût (§§48-50)"
    notes: |
      Le **goût** est l'aptitude à juger de façon désintéressée des objets beaux, naturels ou artistiques ; il guide aussi la création, en mettant en forme la matière brute produite par le génie. Le **génie** est l'aptitude à produire de belles œuvres ; il contient trois choses : une forme de **vision** (Rimbaud, la lettre dite « du voyant » ; Bergson, l'artiste comme distrait), la **créativité**, aptitude à trouver une expression sensible pour des idées, et une **maîtrise technique**.

      Au §50, Kant tranche : pour les beaux-arts, dont la fin est le beau, le **goût** l'emporte sur le génie, la beauté comptant plus que la richesse spirituelle de l'œuvre. Le goût est la **discipline** (le dressage) du génie : en cas de conflit, c'est du côté du génie qu'il faut sacrifier. Si l'on plaçait le sens de l'œuvre avant sa beauté, le génie l'emporterait, mais ce sens ne serait plus communicable aussi universellement.

      ! Le génie ne suffit pas à faire une belle œuvre : il faut le goût pour lui donner forme.
    points:
      - id: kba-l4-p1
        sentence: "Le goût permet aussi de guider la création : il met en forme la matière brute produite par le ___."
        answer: "génie"
        alt: []
      - id: kba-l4-p2
