  - id: kba-l2
    title: "Génie et travail : Alain, Bergson, Nietzsche"
    notes: |
      Trois auteurs prolongent le {sky}§47{/sky}.

      {sky}**Alain**{/sky} ({sky}*Système des beaux-arts*, I, 7{/sky}) : {teal}« {/teal}Toutes les fois que {teal}l'idée précède et règle l'exécution{/teal}, c'est {teal}industrie. »{/teal} L'{pink}artisan{/pink} n'est artiste que {teal}« {/teal}par {teal}éclairs »{/teal}, quand {coral}l'œuvre redresse l'idée{/coral}. Le {yellow}peintre de portrait{/yellow}, lui, {red}ne peut avoir le projet de toutes ses couleurs{/red} : {teal}« {/teal}l'idée {teal}lui vient à mesure qu'il fait »{/teal}, et il est {coral}spectateur de son œuvre en train de naître{/coral}. {teal}« {/teal}Ainsi {teal}la règle du beau n'apparaît que dans l'œuvre{/teal}, et {teal}y reste prise. »{/teal}

      {sky}**Bergson**{/sky} ({sky}*L'évolution créatrice*, IV{/sky}) : pour {yellow}l'enfant qui assemble un jeu de patience{/yellow}, {pink}l'image est déjà donnée{/pink}, et l'opération n'exige aucun temps déterminé ; pour l'artiste, {teal}« {/teal}la {teal}durée de son travail fait partie intégrante de son travail »{/teal}. Nous connaissons le modèle et la manière du peintre, mais la solution concrète apporte {teal}« {/teal}cet {teal}imprévisible rien{/teal} qui est {teal}le tout de l'œuvre d'art »{/teal}.

      {sky}**Nietzsche**{/sky} ({sky}*Humain, trop humain*, I{/sky}) critique le {red}**culte du génie**{/red} : nous le plaçons très loin de nous, comme un miracle, {coral}par vanité, pour qu'il ne nous blesse pas{/coral} ; nommer quelqu'un {teal}« {/teal}divin{teal} »{/teal}, c'est dire qu'{coral}ici nous n'avons pas à rivaliser{/coral} (§162). La croyance à l'inspiration est {red}une illusion que l'artiste entretient{/red} : les {yellow}carnets de **Beethoven**{/yellow} montrent qu'il a composé peu à peu ses plus belles mélodies, à partir d'ébauches multiples (§155). {teal}« {/teal}Tous les {teal}grands hommes sont de grands travailleurs. »{/teal}

      ! Pour Nietzsche, le génie {red}ne diffère pas en nature{/red} de l'inventeur ou du savant : {coral}l'impression de miracle tient à ce qu'on ne voit pas l'œuvre se faire{/coral}.
