  - id: ea3-l3b
    title: "Art mécanique, arts d'agrément et beaux-arts (§44)"
    notes: |
      Au {sky}**§44**{/sky}, Kant introduit deux oppositions. D'abord, dans l'art, l'{pink}**art mécanique**{/pink} et l'{green}**art esthétique**{/green} : {teal}« {/teal}Si l'art qui correspond à la connaissance d'un objet possible {teal}se borne à accomplir les actions nécessaires{/teal} afin de le réaliser, il s'agit d'un {teal}art mécanique »{/teal} ; l'art esthétique, lui, {teal}« {/teal}a pour {teal}fin immédiate le sentiment de plaisir »{/teal}.

      Ensuite, dans l'art esthétique, deux espèces :

      | | Arts d'agrément | Beaux-arts |
      | Plaisir | sensuel : la jouissance | spirituel : la réflexion |
      | Définition | « ceux dont la jouissance est le seul but » | « un mode de représentation qui présente en lui-même un caractère finalisé et qui, bien que sans fin, contribue pourtant à la culture des facultés de l'esprit en vue de la communication sociale » |

      Les {pink}arts d'agrément{/pink} ({yellow}l'art de dresser la table, la musique de table{/yellow}) {coral}facilitent la conversation sans lui donner de contenu{/coral}. Le plaisir des {green}beaux-arts{/green} {red}n'est pas issu de la connaissance de l'objet{/red} : {coral}il accompagne l'activité libre des facultés de connaissance, sans aboutir à un quelconque savoir{/coral}. Les beaux-arts ont pour fin le {green}pur plaisir esthétique{/green}, {amber}sans désir{/amber} (exit {yellow}la morale, la politique ou la religion{/yellow}) et {amber}sans connaissance{/amber} (exit {yellow}la science{/yellow}). D'où : {teal}« {/teal}Il n'y a {teal}pas de science du beau »{/teal}, car {coral}un jugement sur la beauté qui appartiendrait à la science ne serait plus un jugement de goût{/coral}.

      Les arts d'agrément visent le plaisir qui accompagne les représentations en tant que simples {pink}**sensations**{/pink} ; les beaux-arts, le plaisir qui les accompagne en tant que {green}**modes de connaissance**{/green} : {coral}un plaisir de la réflexion, qui donne à penser, et non de la jouissance{/coral}. D'où l'emboîtement : {amber}l'art contient les arts libéraux, qui contiennent les arts esthétiques, qui contiennent les beaux-arts{/amber}.

      ! Le travail artistique {red}ne doit pas trop se voir{/red} : l'œuvre plairait alors non comme art du beau, mais comme {pink}art mécanique{/pink}.
