  - id: kba-l5
    title: "L'âme et les attributs esthétiques (§49)"
    notes: |
      Le {pink}goût sans génie{/pink} produit des œuvres élégantes et bien ordonnées, mais {teal}« {/teal}sans {teal}**âme** »{/teal}. L'{violet}âme{/violet}, au sens esthétique, est {amber}le principe qui anime l'esprit, qui met ses facultés en mouvement{/amber} : {coral}elle dépend de la présence d'Idées esthétiques dans l'œuvre{/coral}. {green}Le talent de trouver pour les Idées l'expression sensible qui les rend universellement communicables est proprement l'âme.{/green}

      Les Idées esthétiques sont faites d'{green}**attributs esthétiques**{/green}, et {pink}non logiques{/pink}. {yellow}L'infinité est un attribut logique de Dieu{/yellow} ; {yellow}l'aigle de Jupiter, avec la foudre dans ses serres{/yellow}, est un attribut esthétique du puissant roi des cieux, comme {yellow}le paon de la magnifique reine des cieux{/yellow}. {coral}Créer, c'est chercher des images pour ce qu'on veut exprimer{/coral} :

      | Exemple de Kant | Ce qui exprime | Ce qui est exprimé |
      | le poème de Frédéric le Grand | le soleil couchant qui répand ses derniers rayons | l'esprit cosmopolite, la paix devant la mort |
      | le vers de Withof | le calme qui jaillit de la vertu | le lever du soleil |
      | l'inscription du temple d'Isis | le voile | la transcendance impénétrable de la nature |

      La fin du §49 récapitule : le génie est {amber}un talent pour l'art et non pour la science{/amber} ; il suppose une {teal}« {/teal}heureuse {teal}relation »{/teal} entre {amber}l'imagination et l'entendement{/amber} ; il {amber}donne naissance à des Idées esthétiques{/amber} ; il {amber}n'obéit à aucune règle connue{/amber}.
