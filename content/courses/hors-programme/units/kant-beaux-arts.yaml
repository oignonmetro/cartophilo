  - id: kba-l5
    title: "L'âme et les attributs esthétiques (§49)"
    notes: |
      Le goût sans génie produit des œuvres élégantes et bien ordonnées, mais « sans **âme** ». L'âme, au sens esthétique, est le principe qui anime l'esprit, qui met ses facultés en mouvement : elle dépend de la présence d'Idées esthétiques dans l'œuvre. Le talent de trouver pour les Idées l'expression sensible qui les rend universellement communicables est proprement l'âme.

      Les Idées esthétiques sont faites d'**attributs esthétiques**, et non logiques. L'infinité est un attribut logique de Dieu ; l'aigle de Jupiter, avec la foudre dans ses serres, est un attribut esthétique du puissant roi des cieux, comme le paon de la magnifique reine des cieux. Créer, c'est chercher des images pour ce qu'on veut exprimer :

      | Exemple de Kant | Ce qui exprime | Ce qui est exprimé |
      | le poème de Frédéric le Grand | le soleil couchant qui répand ses derniers rayons | l'esprit cosmopolite, la paix devant la mort |
      | le vers de Withof | le calme qui jaillit de la vertu | le lever du soleil |
      | l'inscription du temple d'Isis | le voile | la transcendance impénétrable de la nature |

      La fin du §49 récapitule : le génie est un talent pour l'art et non pour la science ; il suppose une « heureuse relation » entre l'imagination et l'entendement ; il donne naissance à des Idées esthétiques ; il n'obéit à aucune règle connue.
