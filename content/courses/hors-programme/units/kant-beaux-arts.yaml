  - id: ea3-l4c
    title: "Division et hiérarchie des beaux-arts (§§51-54)"
    notes: |
      Le langage a trois éléments, {amber}le mot, le geste et le ton{/amber} ({amber}articulation, gesticulation, modulation{/amber}) ; d'où trois sortes de beaux-arts ({sky}§51{/sky}) :

      | Beaux-arts | Espèces |
      | arts de la parole | l'éloquence, la poésie |
      | arts figuratifs | la plastique (sculpture, architecture), la peinture (dont l'art des jardins) |
      | art du beau jeu des sensations | la musique, l'art des couleurs |

      L'{violet}éloquence{/violet} {amber}annonce un discours sérieux et le traite comme un jeu de l'imagination{/amber} ; la {violet}poésie{/violet} {amber}annonce un jeu de l'imagination et donne beaucoup à penser{/amber}. Quel que soit l'art, {green}il n'apporte de satisfaction durable que s'il est associé à des **Idées morales**{/green} (§52) : {red}une simple distraction ne satisfait pas durablement l'esprit{/red}.

      La hiérarchie ({sky}§53{/sky}) place la {green}**poésie**{/green} en tête, {coral}art le plus complet, riche en idées et source d'agrément par ses sonorités{/coral}. Si l'on privilégie {amber}l'émotion{/amber}, la {violet}**musique**{/violet} vient ensuite ; si l'on privilégie {amber}la richesse des idées{/amber} (et l'urbanité : {yellow}la musique gêne le voisinage{/yellow}), les {violet}**arts figuratifs**{/violet} passent devant, et parmi eux la peinture.

      Enfin ({sky}§54{/sky}), Kant concède à {sky}Épicure{/sky} que {coral}tout plaisir, même esthétique ou moral, est aussi une sensation animale qui intensifie la vie{/coral} : tout plaisir a quelque chose d'agréable en ce qu'il participe à notre {violet}**bien-être**{/violet}. Deux arts portent la vie à son maximum d'intensité : la {amber}musique, jeu avec les sons{/amber}, et le {amber}**rire**, jeu avec les pensées{/amber}.

      Certains arts en associent plusieurs : {yellow}le théâtre, le chant, l'opéra, la danse{/yellow} ; {yellow}l'opéra wagnérien{/yellow} se voudra {violet}œuvre d'art totale{/violet}. Le beau peut aussi s'unir au sublime : {yellow}la tragédie en vers, le poème didactique, l'oratorio{/yellow}. {red}Paradoxe{/red} : {coral}ce sont les beautés de la nature qui s'accordent le plus avec l'intention première de l'art{/coral}, car, pour qui sait les contempler, {coral}elles ne déçoivent jamais{/coral}. À la musique et au rire, qui intensifient la vie, s'ajoutent enfin les {amber}**jeux de hasard**{/amber} : trois formes de jeu, {amber}avec les sons, avec les pensées, et le hasard{/amber}.
