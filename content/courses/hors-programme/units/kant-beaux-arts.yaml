  - id: ea3-l3d
    title: "La règle du génie (§46)"
    notes: |
      Le **§46** s'intitule : « Les beaux-arts sont les arts du génie ». Définition : « Le génie est la disposition innée de l'esprit (ingenium) par laquelle la nature donne ses règles à l'art. » *Ingenium* désigne, chez l'homme, l'élément inné de productivité, de créativité, de capacité à dépasser et transformer le donné. Le **talent** est un « pouvoir de produire inné chez l'artiste », qui « appartient lui-même à la nature ».

      Le raisonnement tient en trois temps :
      1. « sans une règle qui le précède, un produit ne peut jamais être désigné comme un produit de l'art » ;
      2. mais « le concept des beaux-arts ne permet pas que le jugement sur la beauté de son produit soit dérivé d'une quelconque règle » ;
      3. donc « les beaux-arts ne peuvent pas se forger eux-mêmes la règle d'après laquelle ils doivent donner naissance à leur produit » : il faut que « la nature donne à l'art sa règle dans le sujet », « à travers l'accord qui intervient entre les pouvoirs dont dispose celui-ci ».

      La nature qui s'incarne dans le génie est **régulatrice** : en fournissant des règles, elle n'est plus une nature naturelle, qui obéit à des lois, mais une nature artistique (Sherringham).

      Trois conséquences : l'**originalité**, puisque le génie ne rend apte à rien de ce qui peut s'apprendre d'après une règle ; l'**exemplarité**, puisque ses œuvres doivent « servir à d'autres de mesure ou de règle d'appréciation » ; l'incommunicabilité du procédé, puisque le génie « est donc incapable de décrire lui-même ou d'indiquer scientifiquement comment il donne naissance à son produit ». Le résultat est communicable, pas le moyen.

      Le génie est d'abord le talent de produire ce pour quoi aucune règle déterminée ne se peut indiquer : un don naturel, puisqu'il ne peut s'apprendre selon des règles définies. L'artiste n'est pas maître de son talent : il est l'intermédiaire d'une force qui le transcende, ce que dit la notion d'**inspiration** (le souffle vient de plus haut, et il est reçu). Son originalité n'est pas arbitraire, un « n'importe quoi » : elle est exemplaire, ses œuvres servant non à imiter, mais à trouver le chemin secret de la beauté. Et il ne peut pas décider d'être ou de ne pas être inspiré.

      ! Ce qui est produit par génie n'est pas le fruit d'une imitation : l'imitation présuppose le concept de ce qu'on imite.
