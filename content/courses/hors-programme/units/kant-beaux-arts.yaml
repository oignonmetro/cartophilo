  - id: kba-l3
    title: "Beauté naturelle, beauté artistique (§48)"
    notes: |
      Une {violet}**beauté naturelle**{/violet} est {amber}une belle chose{/amber} : elle {amber}n'est pas une représentation, n'exprime rien{/amber}, et s'apprécie {amber}sans relation à un concept ni à une perfection{/amber}. C'est une {green}beauté pure{/green}, mais {red}« pauvre » du point de vue expressif{/red}. Une {violet}**beauté artistique**{/violet} est {amber}la belle représentation d'une chose{/amber}, d'où deux conséquences.

      D'abord, {coral}une œuvre peut être la belle représentation d'une chose laide{/coral} : {yellow}la mort, la maladie, la guerre{/yellow} ({yellow}les squelettes du Bernin, les souliers de Van Gogh{/yellow}). {sky}Pascal{/sky} s'en étonnait : {teal}« {/teal}quelle {teal}vanité{/teal} que la peinture, qui attire l'admiration par {teal}la ressemblance des choses dont on n'admire point les originaux ! »{/teal} Seule échappe la laideur qui suscite le {red}**dégoût**{/red} : celle devant laquelle {coral}aucune distance n'est possible{/coral}, dont {coral}la représentation vaut presque présence réelle{/coral} (à la limite, {yellow}*Une charogne* de Baudelaire, le Christ de Grünewald{/yellow}).

      Ensuite, la beauté artistique est {teal}« {/teal}la {teal}forme de la présentation d'un concept{/teal} grâce à laquelle celui-ci est {teal}communiqué universellement »{/teal} : {green}la présentation sensible d'une idée{/green}, ce que {sky}Hegel{/sky} appellera la {violet}manifestation sensible de l'idée{/violet}.

      | | Beauté naturelle | Beauté artistique |
      | Ce qu'elle est | une belle chose | la belle représentation d'une chose |
      | Pureté | pure | impure, inégale |
      | Expressivité | pauvre | riche |

      ! Représenter le laid {red}n'est pas faire une œuvre laide{/red} : {green}l'art peut rendre belle la représentation de ce qui déplaît{/green}, {red}sauf de ce qui dégoûte{/red}.
