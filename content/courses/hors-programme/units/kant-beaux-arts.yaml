lessons:
  - id: ea3-l3a
    title: "Art, nature, science et métier (§43)"
    notes: |
      Sur l'art en général, les {sky}paragraphes 43 à 49{/sky} sont décisifs ; suivent, aux {sky}paragraphes 50 à 54{/sky}, les espèces d'art et la comparaison des beaux-arts. Au {sky}**§43**{/sky}, l'art est distingué successivement de la {amber}**nature**{/amber}, de la {amber}**science**{/amber} et du {amber}**métier**{/amber}.

      *Art et nature.* {teal}« {/teal}L'{teal}art{/teal} est distingué de la nature, comme {teal}le faire{/teal} ({blue}*facere*{/blue}) l'est de {teal}l'agir{/teal} ou de l'effectuer en général ({blue}*agere*{/blue}) et le produit ou la conséquence de l'art se distingue en tant qu'{teal}œuvre{/teal} ({blue}*opus*{/blue}) du produit de la nature en tant qu'{teal}effet{/teal} ({blue}*effectus*{/blue}){teal}. »{/teal} L'art est {teal}« {/teal}une {teal}production par liberté{/teal}, c'est-à-dire par un libre arbitre qui {teal}met la raison au fondement de ses actions »{/teal} ; les {teal}« {/teal}{yellow}gâteaux de cire{/yellow} régulièrement {teal}construits »{/teal} par les {yellow}abeilles{/yellow} ne reposent sur {teal}« {/teal}aucune {teal}réflexion proprement rationnelle »{/teal} : c'est l'{red}instinct{/red}. Dans l'œuvre, {teal}« {/teal}la cause productrice de l'objet {teal}a pensé à une fin{/teal}, à laquelle l'objet {teal}doit sa forme »{/teal}.

      *Art et science.* {teal}« {/teal}Seul ce que l'on {teal}ne possède pas l'habileté de faire{/teal}, même si on le connaît de la manière la plus parfaite, {teal}relève de l'art »{/teal} : {green}le savoir-faire{/green} {red}n'est pas le savoir{/red}.

      *Art et métier.* Kant les distingue par le {amber}jeu{/amber} et le {amber}travail{/amber} :

      | Art libéral | Art mercenaire, ou métier |
      | « une activité en elle-même agréable » : un jeu | « une activité en elle-même désagréable (pénible) et qui n'est attirante que par son effet (par exemple, à travers son salaire) » : un travail |

      Même les arts libéraux supposent pourtant {teal}« {/teal}une {teal}certaine contrainte »{/teal}, un {violet}mécanisme{/violet} : en poésie, {yellow}la langue, la métrique, la prosodie{/yellow}. Dans l'art, commente {sky}Marc Sherringham{/sky}, {coral}le libre jeu prend la forme de la contrainte du travail{/coral}, et {coral}la contrainte laborieuse emprunte la forme du libre jeu{/coral}.

      Plus précisément, l'art est {amber}un pouvoir ou savoir pratique, un savoir-faire, une technique{/amber} ({yellow}l'arpentage, le funambulisme{/yellow}) ; la science est {amber}un savoir théorique{/amber} ({yellow}la géométrie{/yellow}). Le {yellow}poète{/yellow} et le {yellow}sculpteur{/yellow} exercent un art libéral ; le {yellow}forgeron{/yellow} et le {yellow}boulanger{/yellow}, un métier. L'art se caractérise ainsi par une {green}triple dimension : volontaire (intentionnelle), pratique et libérale{/green}.

      ! Le jeu {red}n'exclut pas le travail{/red} : {green}l'art est un jeu laborieux autant qu'un travail ludique{/green}.
