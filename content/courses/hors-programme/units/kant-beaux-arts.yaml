      Le {violet}**goût**{/violet} est {amber}l'aptitude à juger de façon désintéressée des objets beaux, naturels ou artistiques{/amber} ; il guide aussi la création, en {coral}mettant en forme la matière brute produite par le génie{/coral}. Le {violet}**génie**{/violet} est {amber}l'aptitude à produire de belles œuvres{/amber} ; il contient trois choses : une forme de {amber}**vision**{/amber} ({sky}Rimbaud{/sky}, la lettre dite « du voyant » ; {sky}Bergson{/sky}, l'artiste comme distrait), la {amber}**créativité**{/amber}, aptitude à trouver une expression sensible pour des idées, et une {amber}**maîtrise technique**{/amber}.

      Au {sky}§50{/sky}, Kant tranche : pour les beaux-arts, dont la fin est le beau, le {green}**goût** l'emporte sur le génie{/green}, {coral}la beauté comptant plus que la richesse spirituelle de l'œuvre{/coral}. Le goût est la {violet}**discipline**{/violet} (le dressage) du génie : {coral}en cas de conflit, c'est du côté du génie qu'il faut sacrifier{/coral}. Si l'on plaçait le sens de l'œuvre avant sa beauté, {pink}le génie l'emporterait{/pink}, mais {red}ce sens ne serait plus communicable aussi universellement{/red}.

