  - id: kba-l1
    title: "L'inspiration : le génie et l'Ion"
    notes: |
      L'*Ion* de Platon montre à la fois la grandeur et les limites de l'inspiration, que la notion kantienne de génie retrouve :

      | | L'inspiration | La compétence technique |
      | Portée | exceptionnelle, mais limitée à une voix singulière (Ion n'est compétent que pour Homère) | limitée à un domaine, mais complète dans ce domaine |
      | Rapport à soi | une aliénation | la maîtrise de soi |

      D'où un « partage des voix » : seule leur multiplicité donne à l'art sa variété et sa richesse. L'inspiration est aussi **transitive** : comme la force d'un aimant, elle passe de la Muse au poète, puis au rhapsode, puis au spectateur, inspiré mais non inspirant. La création inspirée est en un sens une **interprétation** : le créateur donne forme à une parole qui le transcende, d'où la valeur universelle des œuvres. Enfin, l'inspiration, parce qu'elle est une aliénation, demande à être canalisée pour ne pas tourner à l'expression confuse : c'est le « paradoxe du comédien » de Diderot. L'inspiration ne va pas sans travail.

      ! L'art inspiré n'est pas l'expression de la personne de l'artiste : il exprime un sens qui le dépasse.
    points:
