  - id: ea3-l3e
    title: "Génie, école et imitation (§§47-50)"
    notes: |
      En raison de son {amber}innéisme{/amber}, le don du génie {red}n'est pas **perfectible**{/red}. Ce qui sépare le « puissant cerveau » (le génie scientifique, comme {yellow}Newton{/yellow}) de l'apprenti savant est une différence de {amber}**degré**{/amber} ; ce qui sépare le génie de son imitateur, une différence de {amber}**nature**{/amber}.

      Le génie {green}n'exclut pourtant pas l'école{/green}. Sans la conception d'une fin, l'œuvre {teal}« {/teal}serait un {teal}simple produit du hasard »{/teal} ; et {teal}« {/teal}il n'y a cependant pas un seul des beaux-arts où {teal}quelque chose de mécanique{/teal} [...] ne constitue {teal}la dimension essentielle de l'art »{/teal} : la forme exige {teal}« {/teal}un {teal}talent façonné par l'école »{/teal} (§47).

      | Face au génie | Ce qu'il en reprend |
      | le **disciple scolaire** | la seule forme externe, la technique et l'usage : il maniérise le style du génie |
      | le **disciple génial** | la technique, pour un autre usage : il trouve son propre langage |

      L'imitation servile, qui reproduit jusqu'aux défauts tolérables chez le génie, est la {red}**singerie**{/red} ; viser l'originalité sans génie, c'est le {red}**maniérisme**{/red}, où {coral}la manière devient une fin en soi{/coral}. Le {pink}génie sans goût{/pink} est {pink}la puissance créatrice sans maîtrise formelle{/pink} ; le {pink}goût sans génie{/pink}, {pink}la forme plaisante sans vision{/pink}. D'où la définition finale du génie : {teal}« {/teal}l'{teal}originalité exemplaire des dons naturels{/teal} d'un sujet {teal}dans le libre usage de ses pouvoirs de connaître »{/teal} (§49).

      Le « vaste cerveau », le {yellow}scientifique ou l'ingénieur{/yellow}, fait des découvertes {amber}rétrospectivement explicables{/amber}, qui peuvent {amber}se transmettre et s'enseigner{/amber} : {teal}« {/teal}Dans le registre scientifique, le plus grand auteur de découvertes {teal}ne se distingue de l'imitateur{/teal} et de l'écolier le plus laborieux {teal}que par le degré »{/teal} (§47). Il participe à {coral}la perfection toujours croissante des connaissances{/coral} ; le génie, lui, {coral}part toujours de zéro{/coral} : {green}il n'y a pas de progrès en art{/green}.

      Les règles que le génie donne à l'art restent {green}**captives de l'œuvre**{/green} : {coral}elles ne sont pas énonçables{/coral}. Les œuvres sont des modèles {pink}non au sens de ce qu'il convient d'imiter{/pink}, mais au sens de {green}« ce dont on hérite »{/green} : {coral}elles éveillent d'autres génies au sentiment de leur propre originalité{/coral}. Et {teal}« {/teal}le génie {teal}ne peut procurer qu'une riche matière{/teal} aux produits des {teal}beaux-arts »{/teal} : {red}vouloir se délier de toute contrainte scolaire{/red} est aussi superficiel que {red}de recourir au génie là où il ne faut que de la rationalité{/red}.
