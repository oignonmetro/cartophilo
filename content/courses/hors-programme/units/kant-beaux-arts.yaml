  - id: kba-l2
    title: "Génie et travail : Alain, Bergson, Nietzsche"
    notes: |
      Trois auteurs prolongent le §47.

      **Alain** (*Système des beaux-arts*, I, 7) : « Toutes les fois que l'idée précède et règle l'exécution, c'est industrie. » L'artisan n'est artiste que « par éclairs », quand l'œuvre redresse l'idée. Le peintre de portrait, lui, ne peut avoir le projet de toutes ses couleurs : « l'idée lui vient à mesure qu'il fait », et il est spectateur de son œuvre en train de naître. « Ainsi la règle du beau n'apparaît que dans l'œuvre, et y reste prise. »

      **Bergson** (*L'évolution créatrice*, IV) : pour l'enfant qui assemble un jeu de patience, l'image est déjà donnée, et l'opération n'exige aucun temps déterminé ; pour l'artiste, « la durée de son travail fait partie intégrante de son travail ». Nous connaissons le modèle et la manière du peintre, mais la solution concrète apporte « cet imprévisible rien qui est le tout de l'œuvre d'art ».

      **Nietzsche** (*Humain, trop humain*, I) critique le **culte du génie** : nous le plaçons très loin de nous, comme un miracle, par vanité, pour qu'il ne nous blesse pas ; nommer quelqu'un « divin », c'est dire qu'ici nous n'avons pas à rivaliser (§162). La croyance à l'inspiration est une illusion que l'artiste entretient : les carnets de **Beethoven** montrent qu'il a composé peu à peu ses plus belles mélodies, à partir d'ébauches multiples (§155). « Tous les grands hommes sont de grands travailleurs. »

      ! Pour Nietzsche, le génie ne diffère pas en nature de l'inventeur ou du savant : l'impression de miracle tient à ce qu'on ne voit pas l'œuvre se faire.
    points:
