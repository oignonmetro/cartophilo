    notes: |
      {sky}**Merleau-Ponty**{/sky} ({sky}*Sens et non-sens*{/sky}) : {teal}« {/teal}Kant dit avec profondeur que {teal}dans la connaissance l'imagination travaille au profit de l'entendement{/teal}, tandis que {teal}dans l'art l'entendement travaille au profit de l'imagination. »{/teal} Un poème qui {red}ne ferait que signifier des idées{/red} pourrait se traduire en prose, et un roman se résumer sans perte ; l'art de la poésie est de créer une {teal}« {/teal}{violet}machine de langage{/violet}{teal} »{/teal} qui {coral}place le lecteur dans un certain état poétique{/coral}. Dans {sky}*La prose du monde*{/sky}, l'œuvre d'art contient {teal}« {/teal}mieux que des idées, {teal}des matrices d'idées »{/teal} : {coral}elle nous apprend à voir comme aucun ouvrage analytique ne le peut{/coral} ({yellow}Stendhal fait sentir, sans le dire, la résolution de Julien Sorel{/yellow}).

      {sky}**Heidegger**{/sky} ({sky}« L'homme habite en poète »{/sky}) : les images poétiques sont des imaginations {teal}« {/teal}en tant qu'{teal}inclusion visible de l'étranger{/teal} dans {teal}l'apparence du familier »{/teal}. {sky}**Deleuze**{/sky} : l'Idée esthétique est {coral}l'équivalent d'un concept pour la perception{/coral}, un {teal}« {/teal}{violet}percept{/violet}{teal} »{/teal}. {sky}**John Donne**{/sky} : dans un de ses poèmes, {yellow}l'or battu jusqu'à la finesse de l'air et le compas{/yellow} font sentir {coral}l'union des amants{/coral}, sans qu'on puisse la réduire à un concept clair.
