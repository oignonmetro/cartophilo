  - id: ea3-l3c
    title: "L'art doit paraître nature (§45)"
    notes: |
      Le {sky}**§45**{/sky} s'intitule : {sky}« Les beaux-arts ne sont de l'art que pour autant qu'ils ont en même temps l'apparence de la nature »{/sky}. Kant y bouleverse la {red}théorie classique de l'imitation{/red}, pour laquelle {red}l'art est la copie d'une nature modèle{/red}.

      D'abord, il part de la {amber}**différence**{/amber} : {teal}« {/teal}En face d'un produit des beaux-arts {teal}on doit prendre conscience{/teal} que c'est là {teal}une production de l'art et non de la nature. »{/teal} Ce n'est pas faiblesse de l'art que de ne pas aboutir à l'identité des indiscernables : {coral}la bonne imitation maintient la différence dans la position de la ressemblance{/coral} ({sky}Sherringham{/sky}).

      Ensuite, la relation s'inverse : l'art est {amber}à la fois copie et modèle{/amber} par rapport à la nature, et la nature {amber}tantôt modèle, tantôt copie{/amber}. {teal}« {/teal}La {teal}nature était belle{/teal} lorsqu'en même temps elle avait {teal}l'apparence de l'art{/teal} ; et {teal}l'art ne peut être dit beau{/teal} que lorsque [...] celui-ci nous apparaît cependant {teal}en tant que nature. »{/teal}

      Enfin, {teal}« {/teal}dans le produit des beaux-arts, {teal}la finalité{/teal}, bien qu'elle soit assurément intentionnelle, {teal}ne doit pourtant pas paraître intentionnelle{/teal} ; je veux dire que chacun des beaux-arts doit {teal}apparaître comme nature{/teal}, bien que l'on ait conscience qu'il s'agisse {teal}d'art »{/teal}. La finalité doit y sembler {green}libre de toute règle arbitraire{/green} : la {green}**ponctualité**{/green} dans l'accord avec les règles, sans l'{red}**impression d'effort**{/red}, cette {teal}« {/teal}trace manifestant que {teal}la règle était présente sous les yeux de l'artiste »{/teal}.

      | | Finalité sans fin | Fin sans finalité |
      | Selon Sherringham | un processus d'organisation de moyens qui aboutit à un résultat sans intention préalable ni représentation d'une fin | un résultat qui suppose un agencement intentionnel de moyens dont on sait qu'il n'a aucune existence objective |

      D'où une {violet}**symétrie inversée**{/violet} : {amber}l'art est une intention qui se donne l'apparence de ne pas être intentionnelle{/amber} ; {amber}la belle nature, une absence d'intention qui donne l'apparence d'être intentionnelle{/amber}.

      C'est en ce sens qu'on dit que l'art imite la nature ({sky}Aristote, *Physique*, II, 8{/sky}) : {red}non qu'il la reproduise ou la représente{/red}, mais parce qu'il {green}**produit comme elle**{/green}, {coral}selon une finalité qui n'est pas rationalisable, et sans effort{/coral}. La belle œuvre est celle dont {coral}l'harmonie n'est pas explicable objectivement{/coral}, et dont {coral}la forme n'est pas scolaire{/coral}.

      ! {teal}« {/teal}Apparaître {teal}comme nature »{/teal} {red}ne veut pas dire tromper{/red} : {green}on doit avoir conscience que c'est de l'art{/green}.
