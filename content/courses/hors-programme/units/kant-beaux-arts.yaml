  - id: ea3-l4c
    title: "Division et hiérarchie des beaux-arts (§§51-54)"
    notes: |
      Le langage a trois éléments, le mot, le geste et le ton (articulation, gesticulation, modulation) ; d'où trois sortes de beaux-arts (§51) :

      | Beaux-arts | Espèces |
      | arts de la parole | l'éloquence, la poésie |
      | arts figuratifs | la plastique (sculpture, architecture), la peinture (dont l'art des jardins) |
      | art du beau jeu des sensations | la musique, l'art des couleurs |

      L'éloquence annonce un discours sérieux et le traite comme un jeu de l'imagination ; la poésie annonce un jeu de l'imagination et donne beaucoup à penser. Quel que soit l'art, il n'apporte de satisfaction durable que s'il est associé à des **Idées morales** (§52) : une simple distraction ne satisfait pas durablement l'esprit.

      La hiérarchie (§53) place la **poésie** en tête, art le plus complet, riche en idées et source d'agrément par ses sonorités. Si l'on privilégie l'émotion, la **musique** vient ensuite ; si l'on privilégie la richesse des idées (et l'urbanité : la musique gêne le voisinage), les **arts figuratifs** passent devant, et parmi eux la peinture.

      Enfin (§54), Kant concède à Épicure que tout plaisir, même esthétique ou moral, est aussi une sensation animale qui intensifie la vie : tout plaisir a quelque chose d'agréable en ce qu'il participe à notre **bien-être**. Deux arts portent la vie à son maximum d'intensité : la musique, jeu avec les sons, et le **rire**, jeu avec les pensées.

      Certains arts en associent plusieurs : le théâtre, le chant, l'opéra, la danse ; l'opéra wagnérien se voudra œuvre d'art totale. Le beau peut aussi s'unir au sublime : la tragédie en vers, le poème didactique, l'oratorio. Paradoxe : ce sont les beautés de la nature qui s'accordent le plus avec l'intention première de l'art, car, pour qui sait les contempler, elles ne déçoivent jamais. À la musique et au rire, qui intensifient la vie, s'ajoutent enfin les **jeux de hasard** : trois formes de jeu, avec les sons, avec les pensées, et le hasard.
