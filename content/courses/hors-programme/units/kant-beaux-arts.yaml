  - id: kba-l1
    title: "L'inspiration : le génie et l'Ion"
    notes: |
      L'{sky}*Ion* de Platon{/sky} montre à la fois {green}la grandeur{/green} et {red}les limites{/red} de l'{violet}inspiration{/violet}, que la notion kantienne de génie retrouve :

      | | L'inspiration | La compétence technique |
      | Portée | exceptionnelle, mais limitée à une voix singulière (Ion n'est compétent que pour Homère) | limitée à un domaine, mais complète dans ce domaine |
      | Rapport à soi | une aliénation | la maîtrise de soi |

      D'où un « {violet}partage des voix{/violet} » : {coral}seule leur multiplicité donne à l'art sa variété et sa richesse{/coral}. L'inspiration est aussi {violet}**transitive**{/violet} : comme {yellow}la force d'un aimant{/yellow}, elle passe {amber}de la Muse au poète, puis au rhapsode, puis au spectateur{/amber}, inspiré mais non inspirant. La création inspirée est en un sens une {violet}**interprétation**{/violet} : {coral}le créateur donne forme à une parole qui le transcende{/coral}, d'où {green}la valeur universelle des œuvres{/green}. Enfin, l'inspiration, parce qu'elle est une {red}aliénation{/red}, demande à être canalisée pour ne pas tourner à l'{red}expression confuse{/red} : c'est le {sky}« paradoxe du comédien »{/sky} de {sky}Diderot{/sky}. {green}L'inspiration ne va pas sans travail.{/green}

      ! L'art inspiré {red}n'est pas l'expression de la personne de l'artiste{/red} : {green}il exprime un sens qui le dépasse{/green}.
