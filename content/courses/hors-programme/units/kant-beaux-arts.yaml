  - id: kba-l6
    title: "Les Idées esthétiques : prolongements"
    notes: |
      **Merleau-Ponty** (*Sens et non-sens*) : « Kant dit avec profondeur que dans la connaissance l'imagination travaille au profit de l'entendement, tandis que dans l'art l'entendement travaille au profit de l'imagination. » Un poème qui ne ferait que signifier des idées pourrait se traduire en prose, et un roman se résumer sans perte ; l'art de la poésie est de créer une « machine de langage » qui place le lecteur dans un certain état poétique. Dans *La prose du monde*, l'œuvre d'art contient « mieux que des idées, des matrices d'idées » : elle nous apprend à voir comme aucun ouvrage analytique ne le peut (Stendhal fait sentir, sans le dire, la résolution de Julien Sorel).

      **Heidegger** (« L'homme habite en poète ») : les images poétiques sont des imaginations « en tant qu'inclusion visible de l'étranger dans l'apparence du familier ». **Deleuze** : l'Idée esthétique est l'équivalent d'un concept pour la perception, un « percept ». **John Donne** : dans un de ses poèmes, l'or battu jusqu'à la finesse de l'air et le compas font sentir l'union des amants, sans qu'on puisse la réduire à un concept clair.
    points:
