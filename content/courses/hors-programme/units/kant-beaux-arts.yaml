  - id: ea3-l4b
    title: "Idées de la raison, Idées de l'imagination"
    notes: |
      Le noyau de la philosophie critique est la distinction de l'{violet}**intuition**{/violet} et du {violet}**concept**{/violet} : {green}la connaissance suppose leur union{/green}. Deux cas y échappent :

      | | Idée de la raison | Idée esthétique, ou de l'imagination |
      | Définition | un concept qui excède infiniment toute intuition : aucune intuition ne peut lui correspondre | une intuition qui dépasse tout concept déterminé : aucun concept ne pourra jamais lui correspondre exactement |
      | Exemples | Dieu, le monde, l'immortalité de l'âme | les représentations de l'art du génie |
      | Ce dont elle relève | l'indicible | l'ineffable |

      En art, l'imagination sert surtout à produire des {violet}Idées esthétiques{/violet} : {coral}elles excitent le travail de l'entendement sans aboutir à une connaissance{/coral}. Au service de l'entendement, l'imagination est {pink}**reproductrice**{/pink} : {amber}elle schématise les formes visibles pour relier sensations et concepts{/amber}. Au service de l'art, elle est {green}**créatrice**{/green} : {amber}elle retravaille librement la matière de l'expérience{/amber}, et {coral}ses représentations élargissent esthétiquement la pensée{/coral}.

      Le génie est {green}le pouvoir d'engendrer des Idées esthétiques{/green} : le pouvoir de {teal}« {/teal}découvrir {teal}des Idées pour un concept donné »{/teal}, puis de {amber}leur trouver l'expression sensible qui les rend universellement communicables{/amber}. L'art du génie est ainsi l'{violet}**expression**{/violet} des Idées esthétiques.

      La définition du §49 : {teal}« {/teal}Par une {teal}Idée esthétique{/teal}, j'entends cette {teal}représentation de l'imagination qui donne beaucoup à penser{/teal}, sans que toutefois {teal}aucune pensée déterminée{/teal}, c'est-à-dire aucun concept, {teal}ne puisse lui être adéquate{/teal}, et que par conséquent {teal}aucun langage n'atteint complètement{/teal} ni ne peut rendre {teal}compréhensible. »{/teal} Elle est le pendant de l'{violet}Idée de la raison{/violet}, {teal}« {/teal}un {teal}concept auquel aucune intuition{/teal} (représentation de l'imagination) {teal}ne peut être adéquate »{/teal}. Les Idées de la raison sont des concepts transcendants, {amber}**indémontrables**{/amber} ; les Idées esthétiques, des représentations {amber}**inexponibles**{/amber}, {coral}qu'on ne peut ramener adéquatement à des concepts{/coral}.

      ! Les beautés naturelles {red}n'expriment rien en elles-mêmes{/red} : elles peuvent seulement être vues comme exprimant quelque chose, {yellow}le lys comme l'innocence, le chant des oiseaux comme la joie de vivre{/yellow}.
    points:
