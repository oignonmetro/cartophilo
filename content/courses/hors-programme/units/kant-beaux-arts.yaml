  - id: kba-l3
    title: "Beauté naturelle, beauté artistique (§48)"
    notes: |
      Une **beauté naturelle** est une belle chose : elle n'est pas une représentation, n'exprime rien, et s'apprécie sans relation à un concept ni à une perfection. C'est une beauté pure, mais « pauvre » du point de vue expressif. Une **beauté artistique** est la belle représentation d'une chose, d'où deux conséquences.

      D'abord, une œuvre peut être la belle représentation d'une chose laide : la mort, la maladie, la guerre (les squelettes du Bernin, les souliers de Van Gogh). Pascal s'en étonnait : « quelle vanité que la peinture, qui attire l'admiration par la ressemblance des choses dont on n'admire point les originaux ! » Seule échappe la laideur qui suscite le **dégoût** : celle devant laquelle aucune distance n'est possible, dont la représentation vaut presque présence réelle (à la limite, *Une charogne* de Baudelaire, le Christ de Grünewald).

      Ensuite, la beauté artistique est « la forme de la présentation d'un concept grâce à laquelle celui-ci est communiqué universellement » : la présentation sensible d'une idée, ce que Hegel appellera la manifestation sensible de l'idée.

      | | Beauté naturelle | Beauté artistique |
      | Ce qu'elle est | une belle chose | la belle représentation d'une chose |
      | Pureté | pure | impure, inégale |
      | Expressivité | pauvre | riche |

      ! Représenter le laid n'est pas faire une œuvre laide : l'art peut rendre belle la représentation de ce qui déplaît, sauf de ce qui dégoûte.
    points:
      - id: kba-l3-p1
        sentence: "Une beauté naturelle est une belle ___ ; une beauté artistique est la belle représentation d'une chose."
        answer: "chose"
        alt: []
        explanation: "§48."
      - id: kba-l3-p2
        sentence: "La beauté naturelle est une beauté pure, mais « ___ » du point de vue expressif."
        answer: "pauvre"
        alt: []
