  - id: ea3-l3d
    title: "La règle du génie (§46)"
    notes: |
      Le {sky}**§46**{/sky} s'intitule : {sky}« Les beaux-arts sont les arts du génie »{/sky}. Définition : {teal}« {/teal}Le {teal}génie{/teal} est la {teal}disposition innée de l'esprit{/teal} ({blue}*ingenium*{/blue}) par laquelle {teal}la nature donne ses règles à l'art. »{/teal} {blue}*Ingenium*{/blue} désigne, chez l'homme, {amber}l'élément inné de productivité, de créativité, de capacité à dépasser et transformer le donné{/amber}. Le {violet}**talent**{/violet} est un {teal}« {/teal}pouvoir de produire {teal}inné chez l'artiste »{/teal}, qui {teal}« {/teal}appartient {teal}lui-même à la nature »{/teal}.

      Le raisonnement tient en trois temps :
      1. {teal}« sans une règle qui le précède{/teal}, un produit ne peut jamais être désigné comme un {teal}produit de l'art »{/teal} ;
      2. mais {teal}« {/teal}le concept des beaux-arts {teal}ne permet pas{/teal} que le jugement sur la beauté de son produit soit {teal}dérivé d'une quelconque règle »{/teal} ;
