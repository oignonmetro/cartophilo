lessons:
  - id: ea3-l3a
    title: "Art, nature, science et métier (§43)"
    notes: |
      Sur l'art en général, les paragraphes 43 à 49 sont décisifs ; suivent, aux paragraphes 50 à 54, les espèces d'art et la comparaison des beaux-arts. Au **§43**, l'art est distingué successivement de la **nature**, de la **science** et du **métier**.

      *Art et nature.* « L'art est distingué de la nature, comme le faire (facere) l'est de l'agir ou de l'effectuer en général (agere) et le produit ou la conséquence de l'art se distingue en tant qu'œuvre (opus) du produit de la nature en tant qu'effet (effectus). » L'art est « une production par liberté, c'est-à-dire par un libre arbitre qui met la raison au fondement de ses actions » ; les « gâteaux de cire régulièrement construits » par les abeilles ne reposent sur « aucune réflexion proprement rationnelle » : c'est l'instinct. Dans l'œuvre, « la cause productrice de l'objet a pensé à une fin, à laquelle l'objet doit sa forme ».

      *Art et science.* « Seul ce que l'on ne possède pas l'habileté de faire, même si on le connaît de la manière la plus parfaite, relève de l'art » : le savoir-faire n'est pas le savoir.

      *Art et métier.* Kant les distingue par le jeu et le travail :

      | Art libéral | Art mercenaire, ou métier |
      | « une activité en elle-même agréable » : un jeu | « une activité en elle-même désagréable (pénible) et qui n'est attirante que par son effet (par exemple, à travers son salaire) » : un travail |

      Même les arts libéraux supposent pourtant « une certaine contrainte », un mécanisme : en poésie, la langue, la métrique, la prosodie. Dans l'art, commente Marc Sherringham, le libre jeu prend la forme de la contrainte du travail, et la contrainte laborieuse emprunte la forme du libre jeu.

      Plus précisément, l'art est un pouvoir ou savoir pratique, un savoir-faire, une technique (l'arpentage, le funambulisme) ; la science est un savoir théorique (la géométrie). Le poète et le sculpteur exercent un art libéral ; le forgeron et le boulanger, un métier. L'art se caractérise ainsi par une triple dimension : volontaire (intentionnelle), pratique et libérale.

      ! Le jeu n'exclut pas le travail : l'art est un jeu laborieux autant qu'un travail ludique.
