- id: platon-phedon-morale-p2
  title: "L'âme errante et la pensée pure"
  notes: |-
    **Selon qu'elle se sert du corps ou s'applique par elle-même, l'âme erre parmi ce qui change ou demeure identique auprès de ce qui ne change pas : cet état est la pensée pure.** Le passage oppose deux usages de l'âme, terme à terme. Par les sens, qui supposent la *médiation du corps*, elle est entraînée vers ce qui ne reste jamais identique et devient elle-même errante, par contact. Par elle-même et avec ses propres forces, elle s'élance vers ce qui est pur, éternel, immortel, identique ; parce qu'elle *s'apparente* à cette réalité, elle s'y attache quand elle est isolée en elle-même, et devient à son tour identique à elle-même, par contact.

    | | L'âme qui se sert du corps | L'âme qui s'applique par elle-même |
    | Vers quoi | ce qui ne reste jamais identique à soi | ce qui est pur, existe toujours, ne meurt point |
    | Son état | errante | elle cesse d'errer, demeure identique à elle-même |
    | Son nom | (l'opinion, selon le commentaire) | la pensée pure |

    Le commentaire en tire les **conditions** de la mission morale, qui n'est pas une possibilité directe. Avant la naissance, elle dépend de l'issue de la lutte entre les âmes pour monter vers la voûte céleste ; pendant la vie, de ce que l'âme laisse ou non le corps intervenir dans ses recherches. Car l'âme, invisible, « ressemble au divin » (80a), et le corps, visible, « au mortel » : le *Phédon* souligne cette opposition absolue en 80a-b. Âme et corps appartiennent à deux espèces d'êtres et ont deux objets d'*orientation* : les Idées pour l'une, le corporel et le visible pour l'autre.

    Pour réaliser son essence, l'âme doit donc être *toute seule*. Cet isolement, cette **pureté**, était réel avant la naissance ; il se perd dans l'union au corps. Il faut alors que l'âme garde le corps à distance chaque fois qu'elle exerce sa fonction de penser, c'est-à-dire, au sens élargi, sa « vertu ». Même unie au corps, elle doit s'appliquer « par elle-même et avec ses propres forces à l'examen » (79d), « envoyant promener le corps et rompant dans la mesure du possible tout commerce et tout contact avec lui » (65c) : les Idées pures ne sont atteintes que par la « pensée pure », car le Pur ne peut être saisi que par le pur (67b).

    L'homme a donc *naturellement* une mission morale, parce qu'il a une âme, « apparentée » au divin, instrument invisible et pur pour le connaître ; le divin, communiqué « partout », reste de l'ordre du pensable. En le saisissant, l'âme peut devenir « elle-même vraiment divine » (*Lois*, X, 897b) : c'est le but le plus haut de sa mission. Mais cette moralité n'est pas certaine : elle exige un effort constant.

    ! L'âme ne devient pas errante parce qu'elle serait mauvaise : elle le devient par contact, en se servant du corps.
  passage:
    label: "79c-d"
    text: "Quand l'âme se sert du corps pour examiner quelque objet, par la vue, ou par l'ouïe, ou par toute autre sensation (car il y a médiation du corps, quand l'examen se fait par l'intermédiaire de la sensation) [...] elle est entraînée par le corps vers ce qui ne reste jamais identique à soi-même, elle est, elle-même, errante [...] du fait de son contact avec des choses de cet ordre. – Bien sûr. – Mais quand l'âme s'applique par elle-même et avec ses propres forces à l'examen, elle s'élance là-bas vers ce qui est pur, qui existe toujours, qui ne meurt point, qui reste identique à soi-même ; et comme elle s'apparente à cette réalité, elle s'attache toujours à elle quand, se trouvant isolée en elle-même, il lui est possible de le faire ; elle cesse d'errer, et dans le voisinage de ces réalités-là elle demeure identique à elle-même, du fait de son contact avec des objets qui ont ce même caractère. Cet état de l'âme, nous l'avons appelé pensée pure, n'est-ce pas ? – Fort bien, Socrate ! Cela est tout à fait vrai, dit Cébès."
