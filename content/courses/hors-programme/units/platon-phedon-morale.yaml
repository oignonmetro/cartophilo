- id: platon-phedon-morale-i4
  title: "Le divin et la parenté de l'âme"
  notes: |-
    **Les Idées sont « le divin », et l'âme leur est apparentée : penser, pour elle, c'est acquérir la connaissance du divin.** Le mouvement de l'âme vers les Idées a une valeur morale pour une autre raison encore : les Idées sont « ce qui est invisible, ce qui est divin, immortel, sage » (81a), « ce qui est pur » (79d), « intelligible, [...] et demeure toujours identique à soi-même » (80a-b). Quand l'âme s'applique par elle-même à l'examen, elle s'élance vers elles (79d).

    Pourquoi l'âme a-t-elle pour fonction naturelle de se mouvoir vers les Idées ? À cause de sa **« parenté »** avec le divin. Elle ne l'a pas seulement pour objet de désir : elle « s'apparente » à lui (79d), lui « ressemble » (80a), parce qu'elle aussi « est chose invisible » (79b). Tout en étant autre que les Idées, elle appartient à l'espèce invisible des êtres.

    Le divin peut ainsi « être rencontré partout ». Les Idées sont le divin lui-même ; par la relation de causalité, il est aussi présent « dans » les choses visibles, qui ont du divin en elles, « ressemblent » aux Idées (74d-e) et portent le même nom que leur Idée-cause, comme les choses « égales » (74d-75). Mais la ressemblance de l'âme n'est pas celle des choses :

    | | Les choses visibles | L'âme |
    | Ce qui les lie aux Idées | la causalité : elles tiennent d'elles leur existence | la parenté : invisible comme elles |
    | Ce qu'elles en reçoivent | le nom de leur Idée | la nature d'être pensante |

    L'âme est ce qu'il y a à proprement parler *de divin* dans l'homme. Elle aspire au divin *par son propre désir* et *par nécessité intérieure*, non par une obligation extérieure, une règle ou un commandement auquel elle aurait à obéir.

    ! L'âme ne désire pas le divin par obéissance : c'est sa nature, non un commandement venu du dehors.
