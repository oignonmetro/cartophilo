- id: platon-phedon-morale-p1
  title: "L'Égal en soi et les choses égales"
  notes: |-
    **Les choses égales ne sont pas l'Égal en soi, et c'est pourtant d'elles que la pensée tire la connaissance de l'Égal.** Socrate distingue l'égalité d'un bout de bois et d'un autre, d'une pierre et d'une autre, de ce qui, comparé à tout cela, *en est distinct* : l'Égal en soi-même. Simmias accorde que c'est quelque chose, et qu'on sait ce qu'il est.

    L'argument tient en une différence de comportement. Les pierres et les bouts de bois, *tout en restant les mêmes*, se montrent tantôt égaux, tantôt inégaux ; l'Égal en soi ne s'est jamais montré inégal. Ils ne sont donc pas la même chose. Et pourtant, la connaissance de l'Égal vient de ces objets perçus comme égaux : la pensée l'a « tiré d'elles ». Le passage pose à la fois la **distinction** de l'Idée et des choses, et le **point de départ sensible** de sa connaissance.

    | | Les choses égales | L'Égal en soi |
    | Ce qu'elles montrent | tantôt l'égalité, tantôt l'inégalité | jamais l'inégalité |
    | Ce qui les saisit | les sens | la pensée, qui le tire d'elles |

    Le commentaire y lit la **relation de causalité** entre choses et Idées. Les Idées sont des « hypothèses » (101d), mais cette hypothèse est une « évidence » (77a) : sans l'espèce invisible, impossible d'expliquer l'existence des choses visibles, c'est-à-dire du monde. Les bouts de bois égaux ne sont égaux que parce qu'ils ont en eux « cet Égal » que la pensée peut « tir[er] d'elles », mais qui n'est pas identique à elles. Tout objet visible n'existe qu'à cause de sa relation à l'Idée homonyme, qui, existant en soi, peut aussi être observée « dans » cet objet. Platon nomme cette relation « présence », « communication », « imitation », « participation », et l'expose des premiers jusqu'aux derniers dialogues :

    | Idée en soi | Choses | Formule |
    | l'Égal | les choses égales | « ce qui, comparé à tout cela, en est distinct » (*Phédon*) |
    | le Pieux | les choses pieuses | « cet `Εἶδος`-là en lui-même qui fait que toutes les choses pieuses sont pieuses » (*Euthyphron*, 6d) |
    | le Beau | les belles choses | « par quoi toutes choses sont belles » (*Hippias majeur*, 288a) |

    Les Idées sont les « causes » (100c, 101c) des choses sensibles. Aucun concept mental ne faisant venir quoi que ce soit à l'existence, elles ne sont pas de simples idées de l'esprit : leur hypothèse offre de la « sécurité » (101d). Sans elles, ni choses sensibles, ni passage des choses aux Idées, ni connaissance, *ni morale* : l'âme n'aurait plus pour mission de se mouvoir vers les Idées.

    Plus loin, le commentaire revient à l'extrait : une âme qui ne se servirait que du corps ne saisirait que « l'égalité d'un bout de bois et d'un autre bout de bois » (74a), des objets qui « se montrent tantôt égaux, tantôt inégaux » (74b), jamais l'Égal en soi, toujours *le même*. Si elle cherchait par les sens à apprendre « la vérité » (66b) de l'Égal, elle serait **désorientée** : elle prendrait les égalités visibles pour objet et « errerait » (79c) d'une opinion à une autre. Cette errance appelle une **conversion** du Sensible à l'Intelligible, but même de l'éducation (*République*, VII, 518d).

    ! La connaissance de l'Égal part des choses égales, mais l'Égal n'est pas l'une d'elles, ni leur somme.
  passage:
    label: "74a-c"
    text: "Nous affirmons sans doute qu'il y a quelque chose d'“égal”. Je ne parle pas de l'égalité d'un bout de bois et d'un autre bout de bois, d'une pierre et d'une autre pierre, ni de rien de cet ordre, mais de ce qui, comparé à tout cela, en est distinct, l'Égal en soi-même. Devons-nous affirmer que c'est quelque chose, ou que ce n'est rien ? – Par Zeus, dit Simmias, nous devons affirmer que c'est quelque chose. [...] – Savons-nous aussi ce qu'il est en lui-même ? – Bien sûr, répondit-il. – Où prenons-nous la connaissance que nous avons de lui ? N'est-ce pas des choses dont nous parlions tout à l'heure, de ces bouts de bois, de ces pierres, et d'autres objets du même genre que nous avons perçus comme égaux ? Notre pensée a tiré d'elles cet “Égal” qui se distingue d'elles : ne t'en paraît-il pas différent ? Examine encore la question de la façon suivante : est-ce que parfois des pierres ou des bouts de bois, tout en restant les mêmes, se montrent tantôt égaux, tantôt inégaux ? – Bien sûr. – Mais encore ? L'Égal en soi s'est-il quelquefois montré à toi inégal, ou l'Égalité s'est-elle montrée inégalité ? – Jamais, Socrate. – Ainsi, donc, reprit-il, ces objets égaux, et l'Égalité, ce n'est pas la même chose ? – À mes yeux, pas le moins du monde, Socrate. – N'est-ce point pourtant, dit-il, de ces objets égaux, différents de l'Égal dont nous parlons, que ta pensée a tiré la connaissance de l'Égal ? – C'est bien vrai, dit-il."
