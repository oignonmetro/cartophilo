- id: platon-phedon-morale-p3
  title: "Se séparer du corps"
  notes: |-
    **Une connaissance épurée exige de se séparer du corps : l'âme en elle-même doit considérer les choses en elles-mêmes.** La phrase noue la conclusion des deux autres extraits : puisque les Idées sont *en elles-mêmes* et que le corps entraîne l'âme vers ce qui change, seule l'âme *en elle-même* peut les connaître. Le parallélisme de la formule (l'âme en elle-même, les choses en elles-mêmes) dit la règle du « pur par le pur ».

    D'où, selon le commentaire, une moralité naturelle mais qui n'est pas un fait : un **résultat**, qui présuppose une *réussite*. L'âme doit se détacher des « liens » du corps (67d) ; ce « détachement » (67d) ou cette « purification » (67c) conduirait à une « connaissance épurée » (66d), la seule *véritable*, celle du « vrai, du divin, de ce qui n'est pas objet de l'opinion » (84a). Tout homme le devrait, mais tous n'y réussissent pas : il y faut une lutte incessante pour garder le corps à distance.

    Ce détachement est le but constant de « ceux qui pratiquent la philosophie au droit sens du terme » (67e) : les « vrai[s] philosophe[s] » (83b), qui philosophent « en toute pureté et justice » (*Sophiste*, 253e), désirent toute leur vie « la pensée pure » (68a), au point de s'exercer à faire mourir leur corps (67e). Ceux qui n'en ont que l'apparence ne visent pas ce but :

    | Figure | Ce qu'elle est | Référence |
    | l'orateur | plus persuasif que le médecin sur la santé, « sans être médecin lui-même » | *Gorgias*, 459a-b |
    | le sophiste | non un sage, mais un « imitateur du sage » | *Sophiste*, 268c |
    | le vrai philosophe | l'homme moral par excellence, qui garde l'âme « détachée » du corps | *Phédon*, 67e |

    Le rôle de la philosophie dans la morale est donc *capital*. Mais désirer le détachement ne veut pas dire que le corps n'ait aucune valeur : pour se « ressouvenir » des Idées, il faut *d'abord* percevoir les choses visibles. « L'origine de cette pensée [...], la possibilité même de l'avoir, ne proviennent que de l'acte de la vue, du toucher, ou de telle autre sensation » (75a). La connaissance sensible *n'est pas identique à* la connaissance véritable : on part des sens pour monter, par la pensée seule, dans l'Intelligible.

    La morale n'est donc pas autonome ni seulement pratique : la pratique vertueuse est la *conséquence* de la connaissance véritable de la Vertu en soi. Dans l'*Euthyphron*, à l'interlocuteur qui identifie le Pieux à un acte pieux isolé, Socrate répond : « je ne t'ai pas invité à me faire connaître une ou deux de ces nombreuses choses qui sont pieuses ; je t'ai demandé quel est précisément `ἐκεῖνο αὐτό τό εἶδος` [cet `Εἶδος`-là en lui-même] qui fait que toutes les choses pieuses sont pieuses » (6d). Le vrai philosophe est l'homme moral par excellence parce qu'il *sait comment* arriver au vrai savoir : il possède « le don dialectique » (*Sophiste*, 253e).

    ! Se séparer du corps n'est pas le mépriser : la connaissance commence par les sens, elle ne s'y arrête pas.
