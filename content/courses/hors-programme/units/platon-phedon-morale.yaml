- id: platon-phedon-morale-o4
  title: "Le dilemme éthique"
  notes: |-
    **Toute vie se joue dans un choix : se tourner vers l'Être et la connaissance, ou rester prisonnier du corps et du non-être ; ce dilemme est d'abord éthique.** Diriger l'âme vers « l'éclat dont resplendit cette région » de l'Être, ou la garder prisonnière du corps et « dans l'obscurité du non-être » : la réponse de chacun est la marque de sa possibilité de devenir *moral*. Le *Gorgias* le dit vers sa fin : « il s'agit de savoir quel genre de vie nous devons adopter » (500c).

    | Choix | Figure | Formule |
    | paraître | le sophiste, l'orateur comme Gorgias | « paraître et sembler sans être » (*Sophiste*, 236e) |
    | être | le philosophe comme Socrate | « être bon plutôt qu'à le paraître » (*Gorgias*, 527b) |

    Gorgias, « sans connaître les choses mêmes, sans savoir ce qui est bien ou mal, beau ou laid juste ou injuste », veut « paraître [...] savant [...], et [...] semble honnête homme sans l'être » (459d-e). Socrate exige le savoir avant tout discours et, dans la vie « publique et privée » (527b), tient que « chacun doit s'appliquer par-dessus tout à être bon plutôt qu'à le paraître ». Être dans l'Être ou dans le non-être, parler et agir avec ou sans savoir : le choix aboutit à un résultat moral ou immoral.

    Nous sommes tous, constamment, devant ce dilemme, même sans le comprendre ; les dialogues nous aident à en prendre conscience pour choisir. Platon a choisi la philosophie et nous invite à le suivre : c'est le chemin de la connaissance véritable, donc de la *vérité*, d'une parole sage et d'*une vie morale*. Comme le philosophe désire le Vrai (66b), non le faux ou le simulacre, l'homme moral a affaire, *par ses actions*, au Vrai : non ce qui semble à chacun, mais ce qui existe avec une essence propre. Connues en elles-mêmes, les Valeurs morales servent alors *aussi* de paradigme à l'action.

    ! Le dilemme n'oppose pas deux morales : il oppose l'être et le paraître, le savoir et l'ignorance.
