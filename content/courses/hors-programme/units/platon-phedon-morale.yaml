- id: platon-phedon-morale-o2
  title: "L'Idée du Bien, principe de tout"
  notes: |-
    **Au terme de la dialectique ascendante se trouve l'Idée du Bien, cause des Idées et, à travers elles, de tout : Platon place une valeur morale au principe de l'être et de la vérité.** Des choses sensibles, la pensée tire l'hypothèse des Idées. Chaque Idée, simple « hypothèse » qui ne peut rendre raison d'elle-même, conduit à une autre, « jusqu'au principe de tout, qui n'admet plus d'hypothèse » (*République*, VI, 511b) : le Bien, principe « anhypothétique », qui peut alors *fonder* les hypothèses en les convertissant en vérités (VI, 510d-511c).

    Comme les choses sensibles ont les Idées pour « cause », les Idées ont *elles aussi* une « cause » qui les fonde (VI, 508e) : le Bien. N'ayant pas besoin de fondement, il ne peut être mis en doute ; il faut tenir « pour assuré » qu'il est « ce qui communique la vérité » aux Idées. À travers elles, il est aussi « la cause universelle de tout » (VII, 517c). Mais cette cause, anhypothétique, n'est pas *anonyme* : c'est le Bien, *l'Idée en soi de la Bonté*, une **valeur morale**, l'Idée-Valeur suprême.

    Toutes les Idées sont donc aussi « bonnes » : le Mauvais et le Laid en soi existent, mais leur nom ne touche pas leur manière d'exister en tant qu'Idées. Fondées sur le Bien, les Idées constituent *toutes* la vérité : chacune est exactement ce qu'elle *doit* être. Ce fondement est une relation de causalité, que Platon appelle aussi « participation » :

    | Ce qui participe | À quoi | Pour quoi |
    | les choses sensibles | les Idées | pour exister |
    | les Idées | le Bien | pour être |

    Tout « participe » donc au Bien : le divin est communiqué « partout », du Bien, l'être le plus divin, aux autres Idées, et des Idées aux choses sensibles.

    ! Le Bien n'est pas une Idée parmi d'autres au même rang : il est la cause de l'être et de la vérité des Idées.
