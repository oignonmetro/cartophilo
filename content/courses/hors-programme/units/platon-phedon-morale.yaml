- id: platon-phedon-morale-i2
  title: "Les Idées, objet du désir de l'âme"
  notes: |-
    **L'âme n'a pas seulement la faculté de penser les Idées : elle veut les penser, et ce désir est sa mission morale.** Les Idées sont son objet propre : objet de désir (66b), d'aspiration continue (65c), ce vers quoi elle « s'élance » (79d), ce vers quoi elle se meut naturellement d'elle-même (*Phèdre*, 245e). L'âme a donc un but d'orientation, une direction. Si elle ne s'oriente pas vers les Idées, elle n'est pas conforme à sa propre nature : elle n'est pas elle-même. Pour être elle-même, elle *doit* penser les Idées ; son désir naturel est aussi son devoir.

    Pourquoi les Idées sont-elles l'objet-but de son automotricité ? D'abord parce qu'elles *existent* : pour Platon, il n'y a pas que les objets des sens. La morale a sa source et son fondement dans l'existence des Idées, ou plus exactement dans l'**hypothèse** de leur existence. *Phédon*, 76d-e : « s'il existe, comme nous le répétons sans cesse, un Beau, un Bon, et tout ce qui appartient au même ordre de réalité, et si nous y rapportons tout ce qui vient des sens [...], alors, nécessairement, dans la mesure où tout cela existe, notre âme aussi [...] existe [...]. Mais si tout cela n'existe pas, nous aurons peut-être raisonné en pure perte ». Ce qui vient des sens s'y rapporte comme les bouts de bois et les pierres égaux se rapportent à l'Égal en soi, dans le texte étudié.

    ! Le devoir de l'âme ne lui vient pas du dehors : c'est son désir naturel même.
