- id: platon-phedon-morale-i3
  title: "Connaissance et action morale"
  notes: |-
    **La mission de l'âme est morale pour deux raisons : elle lui permet d'être elle-même, et la connaissance conduit à l'action morale.** D'une part, l'âme doit accomplir cette mission afin de réaliser sa propre essence. D'autre part, la connaissance que l'âme peut acquérir conduit, en tant que telle, à *l'action morale*.

    Connaître la Vertu, ce n'est pas pouvoir énumérer des choses ou des personnes « vertueuses » : c'est connaître *ce qu'est l'Idée en soi* de la Vertu. Qui la connaît peut choisir d'agir, dans sa propre vie, non de la façon qu'il croirait vertueuse, mais de celle qui serait *vraiment* vertueuse. De même, connaître le Bien, le Pieux, le Juste en soi rend possibles des actes vraiment bons, pieux, justes ; et connaître le Mauvais et le Laid en soi conduit à la décision ferme *de ne pas* agir de manière mauvaise et laide.

    La conduite éthique est donc fondée *sur* l'existence en soi des Idées et *sur* la possibilité de leur connaissance. D'où la thèse fondamentale : nul n'est méchant volontairement, mais seulement par manque de connaissance ou par ignorance (*Protagoras*, 345d-e, 358b-d).

    ! Le méchant n'a pas choisi le mal en le connaissant : il ignore ce qu'est le Bien.
