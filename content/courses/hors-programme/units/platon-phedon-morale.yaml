- id: platon-phedon-morale-i5
  title: "Une morale sans code"
  notes: |-
    **La morale platonicienne n'est pas un code de règles : elle se fonde sur l'ontologie, et d'abord sur le fait que le divin, que l'âme désire connaître, existe.** Aucun code de cette sorte n'existe. La conception de la morale est entièrement liée au système *ontologique* de Platon : les Idées en soi existent, et la Vertu en soi n'est qu'*une* de ces Idées.

    Une fois atteinte la connaissance de la Vertu, ou d'une autre Idée qui est une valeur morale (la Justice, la Tempérance, le Courage), des actes « vertueux », « justes », « tempérants » deviennent possibles. Ces Idées-Valeurs morales deviennent *aussi*, au moment où on les connaît, des **paradigmes**, des normes d'action et de conduite.

    Mais ces normes ne forment pas le contenu d'un code tout prêt, fourni de l'extérieur et à tous. Elles ne se produisent *que pour l'âme de la personne qui s'oriente* vers les Idées-Valeurs et réussit à les *connaître*. Les Valeurs morales *sont* des Idées en soi, d'essence propre, toujours identiques : ni ce que chacun croit, ni ce qu'on pourrait imposer arbitrairement aux autres. *Sans l'acquisition de la connaissance*, rien ne pourrait constituer un paradigme ; sans connaissance préalable des Idées-Valeurs, il ne peut y avoir de pratique morale.

    ! Les normes morales existent, mais elles ne se reçoivent pas comme un règlement : on ne les a qu'en connaissant.
