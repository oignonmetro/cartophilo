id: platon-phedon-morale
title: "L'âme, les Idées et la morale"
subtitle: "Platon, Phédon, 74a-c, 79c-d, 66d"
icon: page
color: yellow
group: "Platon : la morale"
intro: |-
  Trois extraits du *Phédon* : l'Égal en soi, distinct des choses égales (74a-c) ; l'âme errante quand elle se sert du corps, apaisée quand elle pense seule (79c-d) ; la séparation d'avec le corps qu'exige une connaissance épurée (66d).

  Le commentaire d'Eleni Papamichael en tire une thèse : chez Platon, la morale n'est pas un code de règles, elle se fonde sur l'ontologie des Idées et sur la connaissance qu'en prend l'âme, qui les désire parce qu'elle leur est apparentée.
lessons:
- id: platon-phedon-morale-i1
  title: "Deux espèces d'êtres, deux modes de connaître"
  notes: |-
    **L'ontologie platonicienne est dualiste : il y a deux espèces d'êtres, et chacune exige son propre mode de connaissance.** Dès les premiers et jusqu'aux derniers dialogues, les êtres ne sont pas tous du même ordre. Les uns se saisissent par la vue, l'ouïe et les autres sensations corporelles, et apparaissent toujours changeants, selon les conditions de la perception et du temps ; les autres demeurent éternellement identiques et ne se saisissent que par l'âme toute seule, la pensée pure. Le *Phédon* le dit en 79a : « il y a deux espèces d'`ὄντων` [d'êtres], l'une visible, l'autre invisible ».

    | Espèce d'êtres | Caractère | Ce qui la saisit |
    | visible, sensible | toujours changeante | le corps qui sent : les opinions |
    | invisible, intelligible : les Idées | éternellement identique | l'âme qui pense : l'intellection |

    Sur ce dualisme repose la distinction de l'âme et du corps : sans lui, elle n'aurait pas de raison d'être. Le *Timée* (51d) va de la connaissance à l'être : « si l'intellection et l'opinion vraie sont deux genres distincts, ces objets invisibles existent en soi ; ce sont les Idées que nous ne pouvons percevoir par les sens, mais seulement par l'intellect ».

    Les Idées, « Eidè » (`Εἴδη`) ou « Ideai » (`Ἰδέαι`), telles « l'Égal en soi-même » (74b) ou « le Beau en soi-même, le Juste » (75d), sont des êtres autres que les choses sensibles. D'où une gnoséologie : deux modes distincts de connaissance, l'un par le corps, l'autre par l'âme. L'ontologie fonde ainsi la gnoséologie, mais aussi la morale, dont le noyau est la conception de l'âme : le sujet qui pense et raisonne (65c), « la pensée en elle-même » (66a), qui saisit ce que le corps ne peut saisir, les Idées en soi.

    ! L'ontologie ne fonde pas seulement la théorie de la connaissance : chez Platon, elle fonde aussi la morale.
