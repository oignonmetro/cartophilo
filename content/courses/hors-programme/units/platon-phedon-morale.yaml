- id: platon-phedon-morale-o1
  title: "La dialectique"
  notes: |-
    **La dialectique est la science du philosophe : elle découvre les liaisons entre les Idées, et c'est d'elle que dépend la morale, puisque la morale est connaissance.** Elle est « la science » (*Sophiste*, 253d) par laquelle le philosophe cherche à saisir « méthodiquement l'essence de chaque chose » (*République*, VII, 533b). Partant des données des sens, elle découvre, par un processus intellectuel d'abord ascendant puis descendant (101d-e ; *Phèdre*, 265d-e ; *République*, VI, 511b-c), quelles Idées peuvent se lier ou s'associer entre elles et lesquelles ne le peuvent pas (*Sophiste*, 253d-e, 253b).

    Certaines Idées se lient selon le rapport du **genre** à ses **espèces**. On ne doit jamais identifier l'espèce à son genre, ni le genre à l'une de ses espèces, ni le genre à toutes ses espèces ensemble :

    | Idée-genre | Idées-espèces | Référence |
    | la Figure | la Rondeur, et d'autres figures | *Ménon*, 73e |
    | la Vertu, « une » | ses « parties », plusieurs | *Protagoras*, 329c-d |
    | la Vertu, un tout | le Courage, « la sagesse, la justice, et le reste » | *Lachès*, 190c, 198a |

    La Rondeur « est une figure, mais non pas la figure simplement ; et cela, parce qu'il y a d'autres figures que la rondeur » (*Ménon*, 73e). De même, la Vertu n'est identique ni au Courage, ni à la Sagesse, ni à la Justice, et aucune vertu n'est identique à une autre. La démarche est toujours *la même*, que l'Idée soit celle d'un objet quelconque ou une valeur morale : la science dialectique démontre « quels genres sont mutuellement consonants et quels autres ne se peuvent souffrir » (*Sophiste*, 253b). Elle donne le vrai savoir de chaque chose, *sans confusions ni identifications fausses*.

    La morale n'est donc pas quelque chose d'indépendant du processus de la connaissance : la morale *est* connaissance. Avant d'agir, il faut connaître, comme avant de parler. Et si la Sagesse, la Piété, la Vertu sont connaissables, elles *s'enseignent* ; mais l'enseignement n'aboutit que *si* celui qui enseigne est, *lui-même*, un vrai connaisseur.

    ! Définir la vertu, ce n'est pas nommer une vertu particulière : le genre n'est aucune de ses espèces.
