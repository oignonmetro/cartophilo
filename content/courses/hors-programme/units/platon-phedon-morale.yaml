- id: platon-phedon-morale-o3
  title: "Le Bien, la cité et l'Être"
  notes: |-
    **Le Bien donne à l'âme la faculté de connaître ; qui le connaît doit gouverner ; et le Bien, Idée et non Dieu créateur, doit être rapproché de l'Être en tant qu'être.** Si l'âme peut reconnaître le divin « dans » les choses, ce n'est pas seulement parce qu'elle appartient à la même espèce d'être que les Idées : c'est que le Bien, qui communique la vérité aux Idées, communique aussi « à l'esprit la faculté de connaître » (*République*, VI, 508e). Par elle, l'âme connaît les Idées, les Idées-Valeurs morales et, « avec peine » (VII, 517b), l'Idée du Bien.

    Difficile, cette connaissance n'est pas impossible : le dialecticien, par la science la plus haute (VII, 534e), peut l'acquérir, et c'est à lui, le vrai philosophe, qu'il faudrait attribuer le pouvoir de **gouverner l'État**. Selon le système éducatif de *La République*, seul celui qui a « vu » l'Idée du Bien peut agir avec sagesse dans la vie privée comme publique (VII, 517c), en gardant le Bien comme « paradigme » d'action (VII, 540a-b). L'ontologie, en fondant l'éthique, fonde aussi la **politique** : l'homme politique doit être un homme moral, donc un vrai philosophe.

    Le Bien est une « Idée » (« tèn tou agathou idean », `τήν τοῦ ἀγαθοῦ ἰδέαν`, VI, 508e) connaissable, non un être hors des deux espèces. Il n'est pas un Dieu créateur : aucune identification avec le « démiurge » (*Timée*, 28a), simple personnage mythique. Seule Idée « anhypothétique »-« cause », il est l'Être-« cause universelle ». Il faut le rapprocher de *l'Idée-« genre » de l'Être*, à laquelle tous les êtres participent pour être (le Mouvement « est », « du fait qu'il participe à l'être », *Sophiste*, 256a). À l'opposé du sophiste, qui « se réfugie dans l'obscurité du non-être » (254a), le philosophe applique perpétuellement ses raisonnements à l'Être.

    ! Ne pas confondre le Bien avec le démiurge : le Bien n'est pas un Dieu qui crée, mais l'Idée à laquelle tout participe.
