- id: platon-phedon-morale-i6
  title: "Le lieu des Idées, la mission de l'âme"
  notes: |-
    **Les Idées ont un lieu propre, non physique, que l'âme a contemplé avant la naissance ; sa mission morale est de regagner cet état.** Le *Phèdre* décrit cette vie préempirique, qui a lieu dans le ciel : les âmes, figurées par l'image d'un attelage ailé de deux chevaux conduit par un cocher (246a-b), « aspir[ent] toutes à monter » (248a) vers le « dos de la voûte céleste » (247b), pour contempler les Idées, « en dehors du ciel » (247c). Dans ce « si grand effort pour apercevoir où est la plaine de vérité », elles « sombrent dans le remous qui les entraîne, se piétinant et se bousculant entre elles » (248a-b). Le but de la lutte : la contemplation des Idées dans le « lieu supracéleste » (247c).

    Le divin, qui peut être rencontré « partout », a donc aussi un lieu propre : présentes « dans » les choses sensibles, les Idées existent d'abord *en elles-mêmes*. Ce lieu n'est pas physique, puisque les Idées ne sont pas des êtres physiques. Il n'y a qu'**un seul monde** pour Platon : le lieu des Idées n'est pas un autre monde, mais « un autre lieu [...], invisible » (80d), que seules les âmes, invisibles elles aussi, pouvaient contempler (*Phèdre*, 249e, 247d).

    La mission morale vient donc de la nature que l'âme possédait avant sa chute sur la terre et son union avec le corps (*Phèdre*, 248c) : une nature « originelle » (*Timée*, 90d) ou « primitive » (*République*, X, 611d). Désirer les Idées, c'est chercher à regagner l'état préempirique ; le rapport préempirique au divin est la *source permanente* de la mission morale. Elle est *possible* parce que les choses ressemblent aux Idées : ayant contemplé les Idées, l'âme reconnaît devant chaque chose ce à quoi elle « ressemble ». Devant les objets égaux, elle tire la connaissance de l'Égal en soi, elle « se rappelle » de lui (75e-76a).

    ! Le lieu des Idées n'est pas un second monde : c'est un lieu invisible, dans un monde unique.
