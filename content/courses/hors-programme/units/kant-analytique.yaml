                - id: ks26b
                  sentence: "Pour saisir une grandeur dans l'intuition, l'imagination dispose de deux opérations : l'appréhension (apprehensio) et la ___ esthétique (comprehensio aesthetica)."
                  answer: "compréhension"
                - id: ks26c
                  sentence: "« L'appréhension ne fait aucune difficulté, car elle peut se poursuivre à l'___. »"
