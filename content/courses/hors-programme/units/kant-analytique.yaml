  recaps:
    - at: m1
      label: "§1-5"
      title: "Premier moment, selon la qualité : une satisfaction désintéressée"
      notes: |-
        **Le jugement de goût est esthétique, non logique, et la satisfaction qui le détermine est désintéressée : c'est ce qui distingue le beau de l'agréable et du bon.** L'Analytique du beau suit les quatre titres de la table des jugements (qualité, quantité, relation, modalité) ; chaque moment se clôt sur une définition.

        | § | Thèse | Argument |
        | 1 | le jugement de goût est esthétique | la représentation est rapportée, non à l'objet pour le connaître, mais au sentiment de plaisir ou de peine du sujet |
        | 2 | sa satisfaction est désintéressée | l'intérêt tient à l'existence de l'objet ; pour juger une chose belle, seule compte sa représentation (le palais, le sachem iroquois et les rôtisseries) |
        | 3 | l'agréable est lié à un intérêt | il plaît aux sens dans la sensation, et fait désirer l'existence de l'objet |
        | 4 | le bon aussi, un intérêt de la raison | il suppose le concept d'une fin ; les fleurs, les dessins libres, les rinceaux plaisent sans rien signifier |
        | 5 | seul le beau plaît librement | à l'agréable l'inclination, au bon le respect, au beau la faveur |

        Le texte : « Est agréable ce qui plaît aux sens dans la sensation » (§3) ; la satisfaction prise au beau est « la seule satisfaction libre » (§5) ; « Le goût est la faculté de juger d'un objet ou d'un mode de représentation, sans aucun intérêt, par une satisfaction ou une insatisfaction » (§5).

        L'agréable vaut aussi pour les animaux, le bon pour tout être raisonnable, la beauté pour les seuls hommes. Ce qui s'annonce : une satisfaction qui ne tient à rien de privé, on la suppose en tout autre (deuxième moment).

        ! Désintéressé ne veut pas dire sans plaisir : c'est un plaisir indifférent à l'existence de l'objet.
    - at: m2
      label: "§6-9"
      title: "Deuxième moment, selon la quantité : universel sans concept"
      notes: |-
        **Désintéressée, la satisfaction esthétique ne repose sur rien de propre à celui qui juge : il la suppose donc en chacun, et parle du beau comme d'une propriété de l'objet, sans pourtant disposer d'aucun concept.**

        | § | Thèse | Argument |
        | 6 | le beau est objet d'une satisfaction universelle, sans concept | celui qui juge ne trouve au fondement de sa satisfaction aucune condition privée |
        | 7 | l'agréable vaut pour chacun, le beau pour tous | pour l'agréable, « à chacun son goût » (le vin des Canaries) ; le beau, on exige l'accord des autres |
        | 8 | un jugement singulier qui vaut pour tous | « cette rose est belle » ne postule qu'une voix universelle ; « les roses en général sont belles » est un jugement logique |
        | 9 | le jugement précède le plaisir | un plaisir antérieur ne serait qu'agrément privé ; ce qui le fonde, c'est le libre jeu de l'imagination et de l'entendement |

        Le texte : « à chacun son goût » (§7, pour l'agréable) ; « Est beau ce qui plaît universellement sans concept » (§9).

        Le §9 est pour Kant la **clé** de la critique du goût : la Déduction (§38) fondera en droit ce qu'il pose. L'agréable relève du goût des sens, le beau du goût de la réflexion.

        ! L'universalité du beau n'est pas constatée (« tout le monde l'aime ») : elle est exigée.
    - at: m3
      label: "§10-17"
      title: "Troisième moment, selon la relation : la finalité sans fin"
      notes: |-
        **Le beau présente la forme d'une finalité sans la représentation d'aucune fin : ni fin subjective, qui le rendrait intéressé, ni fin objective, qui le soumettrait à un concept.** C'est le moment le plus long ; il écarte tour à tour tout ce qui mêlerait au goût un intérêt ou un concept.

        | § | Thèse |
        | 10-12 | ce qu'est la finalité ; le goût n'a pour fondement que sa forme, et la contemplation du beau se prolonge d'elle-même |
        | 13-15 | ni attrait ni émotion (goût pur), seule la forme (le dessin, la composition), et le beau n'est pas la perfection (contre l'école de Wolff) |
        | 16 | beauté libre (`pulchritudo vaga`) et beauté adhérente (`pulchritudo adhaerens`) |
        | 17 | l'idéal de la beauté : l'expression du moral dans la figure humaine |

        Le texte : « La causalité d'un concept par rapport à son objet est la finalité (forma finalis) » (§10) ; « Le goût est toujours barbare quand il a besoin du mélange des attraits et des émotions pour la satisfaction, et même quand il en fait la mesure de son assentiment » (§13) ; « La beauté est la forme de la finalité d'un objet en tant qu'elle est perçue en celui-ci sans représentation d'une fin » (§17).

        Les exemples à retenir : la fleur que le botaniste juge belle sans penser à sa fin (§16), le tatouage des Néo-Zélandais, l'Idée normale (le Doryphore de Polyclète) distincte de l'idéal (§17), les outils de pierre des anciens tombeaux, finals sans être beaux.

        ! La beauté adhérente n'est pas une fausse beauté : deux juges qui se disputent ont souvent raison chacun, l'un selon la beauté libre, l'autre selon l'adhérente.
    - at: m4
      label: "§18-22"
      title: "Quatrième moment, selon la modalité : une nécessité exemplaire"
      notes: |-
        **Le beau s'accompagne d'une nécessité d'un genre propre, exemplaire : l'adhésion de tous vaut comme l'exemple d'une règle qu'on ne peut énoncer. Sa condition est l'Idée d'un sens commun.**

        | § | Thèse | Argument |
        | 18 | une nécessité exemplaire | ni théorique ni pratique : exemple d'une règle universelle qu'on ne peut énoncer |
        | 19 | un devoir conditionné | chacun doit donner son assentiment, si j'ai bien subsumé sous le principe commun |
        | 20 | condition : l'Idée d'un sens commun | un principe subjectif qui détermine par le sentiment seul, mais universellement, ce qui plaît |
        | 21 | on peut le présupposer | la communicabilité des connaissances suppose celle de l'accord des facultés |
        | 22 | une norme idéale | il ne dit pas que chacun s'accordera avec mon jugement, mais qu'il le doit |

        Le texte : « Est beau ce qui est reconnu sans concept comme objet d'une satisfaction nécessaire » (§22).

        Le sens commun esthétique n'est pas l'entendement commun, qui juge par concepts. Kant laisse ouverte la question de savoir s'il est un principe constitutif, ou un principe régulateur qui nous impose de le produire en nous. Le §40 le reprendra (`sensus communis aestheticus`), et le §29 donnera au sublime un fondement analogue : la disposition au sentiment moral.

        ! Le sens commun n'est pas un fait d'expérience (l'accord effectif des goûts) : c'est une norme.
    - at: rg1
      label: "Remarque générale"
      title: "Bilan de l'Analytique du beau : une légalité sans loi"
      notes: |-
        **La Remarque générale ramasse les quatre moments : le goût juge un libre accord de l'imagination avec l'entendement, une légalité sans loi.**

        | Moment | Définition du beau |
        | qualité (§5) | objet d'une satisfaction sans aucun intérêt |
        | quantité (§9) | ce qui plaît universellement sans concept |
        | relation (§17) | forme de la finalité d'un objet, perçue sans représentation d'une fin |
        | modalité (§22) | ce qui est reconnu sans concept comme objet d'une satisfaction nécessaire |

        L'imagination, libre, s'accorde d'elle-même avec la légalité de l'entendement (*Gesetzmäßigkeit ohne Gesetz*). D'où la critique de la régularité raide, proche de la géométrie, qui cause l'ennui : Marsden, à Sumatra, préférait le désordre de la forêt aux jardins de poivriers ; le chant des oiseaux, qu'aucune règle musicale ne ramène, semble plus libre que le chant humain.

        ! Une légalité sans loi n'est pas une absence de règle : l'accord a la forme d'une loi, sans qu'aucune loi déterminée le commande.
    - at: s1
      label: "§23-24"
      title: "Du beau au sublime"
      notes: |-
        **Beau et sublime plaisent par eux-mêmes et relèvent d'un jugement de réflexion ; mais le beau tient à la forme limitée de l'objet, alors que le sublime se trouve dans l'informe et l'illimité, et n'est à proprement parler que dans l'esprit.**

        | | Le beau | Le sublime |
        | objet | forme, limitation | informe, illimité |
        | présentation | d'un concept indéterminé de l'entendement | d'un concept indéterminé de la raison |
        | sentiment | intensification de la vie | arrêt momentané des forces vitales, puis épanchement plus fort |
        | satisfaction | positive | négative : admiration, respect |
        | finalité | accordée à notre faculté de juger | semble lui faire violence |

        Le §24 divise le sublime en **mathématique** (le mouvement de l'esprit rapporté à la faculté de connaître) et **dynamique** (rapporté à la faculté de désirer). Parce qu'il peut se trouver dans l'informe, son analyse commence par la quantité, non par la qualité.

        ! L'océan démonté n'est pas sublime : il est horrible. Il faut avoir l'esprit déjà rempli d'Idées pour que son spectacle éveille le sentiment du sublime.
    - at: s2
      label: "§25-27"
      title: "Le sublime mathématique : ce qui est absolument grand"
      notes: |-
        **Rien dans la nature n'est absolument grand : c'est la disposition de l'esprit qui pense l'infini qui est sublime. L'imagination échoue à saisir d'un coup le tout que la raison exige, et cet échec révèle la supériorité de notre destination rationnelle.**

        | § | Thèse | Argument |
        | 25 | est sublime ce qui est grand au-delà de toute comparaison | la raison prétend à une totalité absolue que les sens ne donnent jamais |
        | 26 | l'imagination rencontre une limite | l'appréhension peut aller à l'infini ; la compréhension esthétique, qui saisit d'un coup, a un maximum |
        | 27 | un déplaisir qui éveille la conscience de notre destination | l'inadéquation de l'imagination à l'Idée fait naître le respect |

        Le texte : « Est sublime ce en comparaison de quoi tout le reste est petit » et « ce qui, par cela seul qu'on peut le penser, démontre une faculté de l'âme qui dépasse toute mesure des sens » (§25) ; « L'appréhension ne fait aucune difficulté, car elle peut se poursuivre à l'infini » (§26) ; « Le sentiment de l'inadéquation de notre pouvoir à atteindre une Idée, qui pour nous est loi, est le respect » (§27).

        Exemples : les pyramides d'Égypte (Savary), ni trop près ni trop loin ; la stupeur en entrant dans Saint-Pierre de Rome. Le colossal (un concept presque trop grand pour toute présentation) n'est pas le monstrueux (une grandeur qui anéantit sa fin). Par une **subreption**, le respect dû à l'Idée de l'humanité en nous est reporté sur l'objet naturel ; le plaisir n'est possible que par la médiation d'une peine, un ébranlement de répulsion et d'attraction.

        Le sublime reprend ainsi, à l'égard de notre propre destination, le respect que le §5 réservait au bon.

        ! Le sublime n'est pas dans l'objet naturel : le respect qu'on croit lui devoir revient, par subreption, à l'Idée de l'humanité en nous.
    - at: s3
      label: "§28-29"
      title: "Le sublime dynamique : la puissance de la nature"
      notes: |-
        **La nature est dynamiquement sublime quand elle est une puissance (`Macht`) sans domination (`Gewalt`) sur nous : sa force nous fait connaître notre faiblesse physique, mais révèle en nous une résistance d'un autre ordre.**

        | § | Thèse | Argument |
        | 28 | la nature redoutable, sans pouvoir sur notre personne, est sublime | le spectacle effrayant attire, pourvu que nous soyons en sécurité ; celui qui a peur ne juge pas |
        | 29 | juger du sublime demande une culture, mais repose sur une disposition naturelle | sans Idées morales la nature terrible n'inspire que l'effroi ; mais tout homme a la disposition au sentiment moral |

        Les exemples du §28 : rochers surplombants, nuages orageux, volcans, ouragans. La guerre menée avec ordre a quelque chose de sublime, quand une longue paix favorise l'esprit mercantile ; la superstition ne fonde que la crainte devant l'être tout-puissant, la religion le respect de sa grandeur. Au §29, le paysan savoyard de Saussure tenait pour fous les amateurs de glaciers.

        Ce que le sens commun est au beau (§22), la disposition au sentiment moral l'est au sublime : le fondement de sa nécessité. On dit de qui reste insensible au sublime qu'il n'a pas de sentiment, comme on dit de qui reste indifférent au beau qu'il manque de goût.

        ! Le jugement sur le sublime n'est pas un produit de la culture ni une convention : la culture le développe, elle ne le crée pas.
    - at: rg2
      label: "Remarque générale"
      title: "Bilan de l'Analytique du sublime : beau, sublime et moralité"
      notes: |-
        **Beau et sublime ont tous deux une finalité à l'égard du sentiment moral : ils y préparent, chacun à sa manière.**

        Le texte : « Le beau nous prépare à aimer quelque chose, même la nature, sans intérêt ; le sublime, à l'estimer, même contre notre intérêt (sensible). »

        | | prépare à… | rapport à l'intérêt |
        | le beau | aimer | sans intérêt |
        | le sublime | estimer | contre notre intérêt sensible |

        Deux exemples : il n'y a peut-être pas de passage plus sublime dans l'Ancien Testament que l'interdit des images (« Tu ne te feras aucune image taillée ») ; l'enthousiasme est sublime, mais l'apathie d'un esprit qui suit fermement ses principes l'est plus encore, parce qu'elle a de plus l'approbation de la raison pure.

        ! L'interdit des images n'appauvrit pas le sentiment : c'est parce que rien ne se présente que l'Idée se fait sentir.
    - at: d1
      label: "§30-31"
      title: "Pourquoi une déduction, et pour quels jugements"
      notes: |-
        **Seul le jugement sur le beau a besoin d'une déduction : prétendant valoir a priori pour tous, alors qu'il est singulier, il doit montrer de quel droit.**

        | § | Thèse | Argument |
        | 30 | le sublime n'a pas à être légitimé à part ; le beau naturel, si | le sublime n'est que dans l'usage de nos facultés : l'exposer, c'est le légitimer ; le beau tient à la forme de l'objet |
        | 31 | une déduction garantit la légitimité d'une sorte de jugements | elle n'est requise que pour ceux qui prétendent à la nécessité |

        Ce qu'il faut légitimer n'est pas un concept objectif, mais la validité universelle d'un jugement **singulier**.

        ! L'exposition du sublime en est aussi la déduction : c'est pourquoi la Déduction ne traite que du beau.
    - at: d2
      label: "§32-34"
      title: "Les deux particularités du jugement de goût"
      notes: |-
        **Le jugement de goût est difficile à légitimer parce qu'il réunit deux traits opposés : il revendique l'adhésion de chacun comme s'il était objectif, et aucune preuve ne le détermine, comme s'il était seulement subjectif.**

        | § | Thèse | Exemples |
        | 32 | il exige l'adhésion de chacun, en autonomie | le jeune poète qui ne se laisse pas persuader que son poème est mauvais ; les Anciens, qu'on suit sans les copier, en puisant aux mêmes sources |
        | 33 | aucune preuve ne le détermine | Batteux ou Lessing opposés à mon jugement : je me bouche les oreilles ; le mets dont on m'énumère les ingrédients, j'en juge avec mon palais |
        | 34 | pas de principe objectif du goût | la critique du goût est un art sur des exemples, une science seulement comme critique transcendantale |

        Le jugement doit être énoncé a priori, non par imitation. Ces deux particularités redisent, du point de vue de la légitimité, le deuxième et le quatrième moment : universel sans concept, nécessaire sans preuve.

        ! Suivre les Anciens n'est pas les imiter : c'est emprunter leur façon de s'y prendre.
    - at: d3
      label: "§35-38"
      title: "La déduction proprement dite"
      notes: |-
        **Le jugement de goût est un jugement synthétique a priori ; il se légitime parce que le plaisir qu'il exprime tient aux conditions subjectives de toute connaissance, qui sont les mêmes chez tous les hommes.**

        | § | Thèse | Argument |
        | 35 | le principe du goût est celui de la faculté de juger en général | il subsume, non une intuition sous un concept, mais l'imagination dans sa liberté sous l'entendement dans sa légalité |
        | 36 | le problème : comment des jugements de goût sont-ils possibles ? | ils lient a priori un plaisir à une représentation, pour tous, sans concept |
        | 37 | ce qui est affirmé a priori, c'est la validité du plaisir pour tous | le plaisir lui-même est empirique |
        | 38 | la déduction | ces conditions subjectives sont communes, sans quoi les hommes ne pourraient se communiquer leurs connaissances |

        Le texte : « Le jugement de goût doit se fonder uniquement sur le sentiment que l'imagination dans sa liberté et l'entendement dans sa légalité s'animent réciproquement » (§35) ; « Ce n'est pas le plaisir, mais l'universalité de ce plaisir, perçu comme lié dans l'esprit au simple jugement sur un objet, que nous nous représentons a priori dans un jugement de goût » (§37).

        L'imagination y **schématise sans concept**. La déduction est facile, parce qu'elle n'a à justifier la réalité objective d'aucun concept ; elle fonde en droit la « clé » du §9.

        ! Ce qui est a priori n'est pas le plaisir, mais son universalité.
    - at: d4
      label: "§39-40"
      title: "Communicabilité et sens commun"
      notes: |-
        **Toutes les sensations ne se communiquent pas de la même façon : le plaisir pris au beau se communique par le sentiment de l'accord des facultés. Le goût est ainsi une sorte de sens commun.**

        | § | Thèse | Argument |
        | 39 | trois façons de communiquer un plaisir | l'agréable ne se communique pas, le moral par des concepts, le beau par la simple réflexion |
        | 40 | le goût est un `sensus communis aestheticus` | il juge en tenant compte, par la pensée, du mode de représentation de tout autre |

        Les trois maximes de l'entendement commun (§40) :

        | Maxime | Manière de penser |
        | penser par soi-même | sans préjugés |
        | penser en se mettant à la place de tout autre | élargie |
        | toujours penser en accord avec soi-même | conséquente |

        Le goût mérite le nom de sens commun plus que l'entendement sain (`sensus communis logicus`). Le §40 reprend le sens commun du §22.

        ! La pensée élargie ne consiste pas à adopter l'avis des autres, mais à se placer, par la pensée, à leur point de vue.
    - at: d5
      label: "§41-42"
      title: "L'intérêt pour le beau : empirique et intellectuel"
      notes: |-
        **Jugé sans intérêt, le beau peut pourtant susciter un intérêt : un intérêt empirique, qui n'existe qu'en société, et un intérêt intellectuel pour la seule beauté de la nature, signe d'une âme bonne.**

        | § | Intérêt | Fondement |
        | 41 | empirique | le penchant à la sociabilité : le goût devient un moyen de communiquer son sentiment |
        | 42 | intellectuel, immédiat, pour la beauté naturelle | que la nature produise des formes accordées à notre jugement désintéressé intéresse la raison, comme la moralité |

        Les exemples : abandonné sur une île déserte, un homme ne parerait ni sa hutte ni lui-même (§41) ; si l'on découvre que les fleurs sont artificielles, ou que le rossignol est un jeune garçon payé par l'aubergiste qui l'imite avec un roseau, l'intérêt immédiat disparaît (§42).

        ! L'intérêt vient après le jugement, il ne le fonde pas : le jugement de goût reste désintéressé.
    - at: d6
      label: "§43-50"
      title: "L'art, les beaux-arts et le génie"
      notes: |-
        **Les beaux-arts sont les arts du génie : aucune règle ne peut dicter le beau, et pourtant tout art suppose des règles ; c'est la nature, dans le sujet, qui les donne. Le goût, lui, juge et discipline ce que le génie produit.**

        | § | Thèse |
        | 43 | l'art se distingue de la nature (liberté), du savoir (savoir-faire) et du métier (jeu, non travail) |
        | 44 | beaux-arts, arts d'agrément, art mécanique ; pas de belle science |
        | 45 | une œuvre belle doit paraître naturelle |
        | 46 | le génie : la nature donne ses règles à l'art ; originalité exemplaire |
        | 47 | le génie n'est pas le grand savant (Newton contre Homère ou Wieland) |
        | 48 | le goût juge, le génie produit ; seul le dégoût ne se laisse pas représenter |
        | 49 | l'esprit : des Idées esthétiques qui donnent à penser plus qu'aucun concept |
        | 50 | en cas de conflit, le génie cède au goût |

        Le texte : « Seul ce que l'on ne possède pas l'habileté de faire, même si on le connaît de la manière la plus parfaite, relève de l'art » (§43) ; « La nature était belle lorsqu'en même temps elle avait l'apparence de l'art » (§45), et l'art n'est beau que si, conscients que c'est de l'art, nous le voyons pourtant avec l'apparence de la nature.

        Une beauté naturelle est une belle chose, une beauté artistique une belle représentation d'une chose (§48). Aux œuvres élégantes mais sans âme manque l'esprit, principe vivifiant ; l'aigle de Jupiter est un attribut esthétique (§49). Le goût rogne les ailes du génie et le rend civilisé et poli (§50). L'Idée esthétique du §49 sera reprise au §57 comme pendant de l'Idée de la raison.

        ! Le génie ne sait pas lui-même comment il produit : c'est ce qui le distingue du savant, non un moindre mérite.
    - at: d7
      label: "§51-54"
      title: "Division et comparaison des beaux-arts"
      notes: |-
        **Les beaux-arts se divisent selon l'analogie du langage, peuvent s'unir en une même œuvre, et se hiérarchisent : la poésie en tête, la musique en débat. Ils ne satisfont durablement que liés à des Idées morales.**

        | § | Thèse | Argument |
        | 51 | division selon le mot, le geste et le ton | arts de la parole, arts figuratifs, art du beau jeu des sensations |
        | 52 | les beaux-arts peuvent s'unir | mais, sans Idées morales, ils ne servent qu'à la distraction |
        | 53 | la poésie au premier rang | elle élargit l'esprit ; la musique émeut plus qu'elle ne cultive, et manque d'urbanité |
        | 54 | le jeu et le rire font du bien au corps | tout plaisir intensifie la vie |

        Le rire naît de la soudaine réduction à néant d'une attente tendue ; Voltaire disait que le ciel nous a donné, contre les peines de la vie, l'espérance et le sommeil (§54).

        ! Le reproche fait à la musique n'est pas esthétique mais d'urbanité : elle s'impose au voisinage, qui ne l'a pas demandée.
    - at: p55
      label: "§55-57"
      title: "L'antinomie du goût et sa solution"
      notes: |-
        **La dialectique du goût ne porte pas sur le conflit des goûts, mais sur ses principes : le jugement de goût semble devoir reposer, et ne pas reposer, sur des concepts. La solution distingue deux sens du mot « concept ».**

        Deux lieux communs et une proposition intermédiaire : « Chacun a son goût » ; « On ne dispute pas du goût » (on n'en décide pas par des preuves) ; et pourtant « On peut discuter du goût » (chercher l'accord sans pouvoir le prouver).

        | | Thèse | Antithèse |
        | énoncé (§56) | le jugement de goût ne se fonde pas sur des concepts, sinon on pourrait en disputer | il se fonde sur des concepts, sinon on ne pourrait même pas en discuter |
        | solution (§57) | pas sur des concepts déterminés | sur le concept indéterminé du substrat suprasensible des phénomènes |

        L'antinomie n'est qu'une apparence naturelle et inévitable, qui ne trompe plus une fois reconnue. Ce concept ne fait rien connaître et ne peut rien prouver : d'où un jugement valable pour tous, sans preuve possible.

        Remarque I : une Idée esthétique est une représentation **inexponible** de l'imagination, une Idée de la raison un concept **indémontrable** (reprise du §49). Remarque II : chaque faculté supérieure (connaître, sentiment de plaisir et de peine, désirer) a son antinomie, qui oblige à chercher le fondement dans le suprasensible.

        ! Il n'y a de dialectique que pour des jugements qui prétendent à l'universalité a priori : un conflit de goûts n'en est pas une.
    - at: p58
      label: "§58"
      title: "L'idéalisme de la finalité esthétique"
      notes: |-
        **La finalité du beau est idéale, non réelle : la nature n'a pas produit ses formes pour nous plaire ; c'est notre faculté de juger qui les accueille.**

        | Position | Ce qu'elle soutient |
        | empirisme du goût | le beau se réduit à l'agréable |
        | rationalisme du goût | le beau se fonde sur des principes a priori |
        | réalisme de la finalité | la nature a produit la beauté avec l'intention de nous plaire |
        | idéalisme de la finalité (Kant) | la finalité n'est pas une propriété réelle des objets |

        Argument : les formations libres de la nature, comme les cristaux nés de la solidification d'un fluide, montrent que de belles formes peuvent naître mécaniquement.

        Le texte : « C'est nous qui accueillons la nature avec faveur, et non pas elle qui nous fait une faveur. »

        ! Kant est rationaliste quant au principe du goût, idéaliste quant à la finalité : les deux ne s'opposent pas.
    - at: x2
      label: "§59-60"
      title: "Le beau, symbole du bien moral ; la méthodologie du goût"
      notes: |-
        **En définitive, le beau présente indirectement le bien moral : le jugement de goût procède avec le beau comme le jugement moral avec le bien, par une analogie de la réflexion. D'où la vraie préparation du goût, la culture morale.**

        | § | Thèse | Argument |
        | 59 | le beau est le symbole du bien moral | une hypotypose symbolique, indirecte, par analogie |
        | 60 | le goût s'éveille, il ne s'enseigne pas | pas de méthode, seulement une manière ; sa propédeutique est la culture du sentiment moral |

        Rendre sensible un concept s'appelle une **hypotypose** : schématique quand l'intuition est donnée a priori, symbolique quand elle est indirecte (l'État monarchique comme corps animé, le despotisme comme moulin à bras ; les mots fondement, dépendre, découler, substance).

        Les analogies entre le beau et le bien : il plaît immédiatement et sans intérêt ; il accorde la liberté de l'imagination avec la légalité de l'entendement ; son principe vaut pour chacun. D'où les noms moraux donnés aux choses : édifices majestueux, campagnes riantes, couleurs innocentes. Le goût permet le passage de l'attrait sensible à l'intérêt moral, sans saut trop violent.

        Le texte : « Le beau est le symbole du bien moral » (§59). Au §60, la propédeutique semble consister dans les humanités (`humaniora`) ; l'humanité signifie le sentiment universel de sympathie et la faculté de se communiquer intimement et universellement.

        ! Symbole n'est pas schéma : le beau ne rend pas le bien visible, il en offre une présentation indirecte, par analogie.
