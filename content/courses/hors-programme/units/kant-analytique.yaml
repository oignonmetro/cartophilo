          parts:
            - id: p56
              label: "§56"
              summary: "Deux lieux communs, et une troisième proposition, forment l'antinomie"
              reason: "on dit qu'on ne dispute pas du goût, et pourtant qu'on peut en discuter : il faut donc qu'il repose, et ne repose pas, sur des concepts"
              points:
                - id: kx56a
                  sentence: "Premier lieu commun : « Chacun a son ___. »"
                  answer: "goût"
                - id: kx56b
                  sentence: "Second lieu commun : « On ne ___ pas du goût », c'est-à-dire qu'on n'en décide pas par des preuves."
                  answer: "dispute"
                - id: kx56c
                  sentence: "Une proposition intermédiaire, que chacun admet : « On peut ___ du goût », c'est-à-dire chercher l'accord sans pouvoir le prouver."
                  answer: "discuter"
                - id: kx56d
                  sentence: "Thèse : le jugement de goût ne se fonde pas sur des ___ ; sinon on pourrait en disputer, en décider par des preuves."
                  answer: "concepts"
                - id: kx56e
                  sentence: "Antithèse : il se fonde sur des concepts ; sinon on ne pourrait même pas en discuter, ni prétendre à l'___ nécessaire d'autrui."
                  answer: "assentiment"
