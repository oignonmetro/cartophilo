              label: "§57"
              summary: "Le mot « concept » n'a pas le même sens dans la thèse et l'antithèse"
              reason: "le jugement de goût ne repose sur aucun concept déterminé, mais sur le concept indéterminé du suprasensible"
              rel: probleme-solution
              points:
                - id: kx57a
                  sentence: "Dans la thèse, il faut entendre : le jugement de goût ne se fonde pas sur des concepts ___."
                  answer: "déterminés"
                - id: kx57b
                  sentence: "Dans l'antithèse : il se fonde sur un concept indéterminé, celui du substrat ___ des phénomènes."
                  answer: "suprasensible"
                - id: kx57c
                  sentence: "L'antinomie n'est qu'une ___ naturelle et inévitable, qui ne trompe plus une fois reconnue."
                  answer: "apparence"
                  alt: ["illusion"]
                - id: kx57d
                  sentence: "Ce concept ne fait rien connaître et ne peut rien ___ : d'où un jugement valable pour tous, dont on ne peut pourtant donner de preuve."
                  answer: "prouver"
            - id: p57r1
              label: "§57, Rem. I"
              summary: "Idées esthétiques et Idées de la raison se répondent"
