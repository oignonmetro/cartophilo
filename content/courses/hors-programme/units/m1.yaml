id: m1
title: Le bien vouloir et le devoir
subtitle: Bonne volonté, devoir et respect pour la loi morale
icon: scale
color: yellow
group: "Kant : la morale"

lessons:
- id: m1-l1
  title: Les deux tâches de la philosophie morale
  notes: |
    Kant assigne à la philosophie morale {amber}deux tâches distinctes{/amber},
    réparties sur {sky}les trois chapitres{/sky} des *Fondements de la métaphysique
    des mœurs*.

    - {amber}**Dégager**{/amber} le principe suprême de la moralité, en
      analysant des notions morales ordinaires comme la {violet}bonne volonté{/violet} et
      {violet}le devoir{/violet} : c'est l'objet des {sky}deux premiers chapitres{/sky}.
    - {amber}**Établir**{/amber} ce principe comme une exigence propre à
      la volonté rationnelle de chaque agent, en s'appuyant sur l'idée
      d'{violet}autonomie{/violet} : c'est l'objet du {sky}troisième chapitre{/sky}.

    Kant ne s'adresse pas d'abord à {red}un authentique sceptique moral{/red}, qui
    douterait avoir la moindre raison d'agir moralement ; {green}il part d'un accord{/green}
    {green}moral très largement partagé{/green}, quitte à se montrer optimiste sur son
    étendue.

    Trois raisons justifient, selon lui, que la philosophie morale {green}procède{/green}
    {green}tout entière{/green} __{blue}*a priori*{/blue}__, sans recourir à {red}l'observation empirique{/red} des
    conduites humaines.
    - L'analyse des concepts moraux (bonne volonté, obligation, devoir) est
      par nature une opération {blue}*a priori*{/blue}.
    - Établir que la loi morale nous oblige réellement exige un argument
      « {violet}synthétique{/violet} » {blue}*a priori*{/blue}, partant de l'idée de volonté rationnelle
      libre : une simple analyse conceptuelle ne peut y suffire.
    - {red}Une méthode empirique ne peut établir que des exigences valables sous{/red}
      {red}certaines conditions{/red}, alors que l'exigence morale se présente comme
      {coral}une nécessité inconditionnée{/coral}.

    ! Il ne faut pas confondre les deux tâches : dégager le principe
      {sky}(chapitres I-II){/sky} reste un travail d'analyse conceptuelle, quand
      l'établir {sky}(chapitre III){/sky} prétend prouver qu'il oblige réellement une
      volonté rationnelle.
  points:
  - id: m1-l1-p1
    sentence: __Kant nomme **dégagement** du principe suprême de la moralité la tâche qui consiste à l'extraire par l'analyse de nos notions morales ordinaires, et__ ___ la tâche qui consiste à **prouver qu'il oblige réellement toute volonté rationnelle**.
    answer: établissement
    alt: []
  - id: m1-l1-p2
    sentence: "**L'analyse des notions ordinaires de bonne volonté et de devoir**, __première étape de la philosophie morale kantienne, occupe__ ___ des Fondements."
    answer: les deux premiers chapitres
    alt: []
  - id: m1-l1-p3
    sentence: La tentative de **prouver que le principe moral oblige effectivement une volonté rationnelle**, __en s'appuyant sur l'idée d'autonomie, occupe__ ___ des Fondements.
    answer: le troisième chapitre
    alt: []
  - id: m1-l1-p4
    sentence: "**Les jugements moraux** dont part l'analyse kantienne sont, selon Kant, __ceux qu'accepterait sur réflexion rationnelle suffisante__ ___."
    answer: un adulte normal et sain d'esprit
    explanation: Kant ne prend pas pour cible principale un scepticisme moral radical.
    alt: []
  - id: m1-l1-p5
    sentence: "**La première des trois raisons** kantiennes en faveur d'une méthode *a priori* en éthique tient à ce que __l'analyse des ___ eux-mêmes (bonne volonté, obligation, devoir) est par nature une opération a priori__."
    answer: concepts moraux
    alt: []
  - id: m1-l1-p6
    sentence: "**La deuxième des trois raisons** kantiennes en faveur d'une méthode *a priori* en éthique tient à ce qu'établir que la loi morale oblige réellement une volonté rationnelle exige, au-delà d'une simple analyse des concepts, __un argument que Kant qualifie lui-même de__ ___."
    answer: synthétique
    alt: []
  - id: m1-l1-p7
    sentence: "**La troisième des trois raisons** kantiennes en faveur d'une méthode *a priori* en éthique tient à ce qu'**une méthode empirique ne peut établir que des exigences valables sous certaines conditions**, alors que __l'exigence morale se présente comme une nécessité__ ___."
    answer: inconditionnée
    alt: []

- id: m1-l2
  title: Liberté, déterminisme et le Bien suprême
  notes: |
    Kant doit concilier deux thèses qu'il tient pour vraies : {amber}la moralité présuppose que nous sommes libres{/amber}, mais la {plum}*Critique de la raison pure*{/plum} {red}soutient que tout événement a une cause{/red}. Sa solution consiste à distinguer le {violet}**phénomène**{/violet}, le monde tel que nous le connaissons par l'expérience, et le {violet}**nouménal**{/violet}, le monde tel qu'il est en soi, que nous pouvons penser sans pouvoir le connaître.

    - Cette distinction résout l'{violet}antinomie de la liberté{/violet} : la {green}thèse{/green}, selon laquelle {green}la liberté est possible{/green}, concerne le monde nouménal ; l'{pink}antithèse{/pink}, selon laquelle {pink}tout événement a une cause{/pink}, concerne le monde phénoménal.
    - {amber}Deux lectures s'opposent{/amber} chez les commentateurs sur la portée de cette distinction.
      - {amber}La première{/amber}, défendue par {sky}Hudson{/sky}, tient qu'__un même acte se décrit à la fois en termes purement physiques (comme phénomène) et en termes irréductiblement mentaux (comme chose en soi)__, {coral}tous les{/coral} {coral}actes restant causalement déterminés{/coral}.
      - {amber}La seconde{/amber}, défendue entre autres par {sky}Korsgaard{/sky}, traite les deux mondes comme deux métaphores pour __deux perspectives sur un seul et même monde__ : {pink}la perspective scientifique, qui pense tout comme soumis à la causalité naturelle{/pink}, et {green}la perspective pratique, celle de la délibération et de l'action, où{/green} {green}nous nous pensons comme des agents libres{/green}.
      - Sur cette seconde lecture, {coral}agir « sous l'idée » de la liberté{/coral} {amber}__ne requiert pas de croire réellement qu'on est libre en un sens métaphysique profond__{/amber}, seulement d'{yellow}opérer *comme si* on l'était{/yellow}.

    Kant assigne enfin à la philosophie morale une dernière tâche : dire quelque chose du {violet}**Bien suprême**{/violet}, **fin ultime de l'existence humaine**, qu'il définit comme {amber}l'__union__ de la __vertu__ morale{/amber} {amber}complète et d'un __bonheur__ proportionné à cette vertu{/amber}.

    ! La {violet}raison{/violet}, selon Kant, {red}ne peut ni prouver ni réfuter l'existence de{/red} {red}Dieu ni l'immortalité de l'âme{/red} ; il les tient pourtant pour __des « __{violet}__postulats__{/violet}__ » requis par la raison pratique__, puisque {coral}rien dans cette{/coral} {coral}vie ne garantit que la vertu soit récompensée par le bonheur{/coral}.
  points:
  - id: m1-l2-p1
    sentence: __Kant appelle__ ___ **le monde tel que nous le connaissons à travers l'expérience**, par opposition au monde tel qu'il est en soi.
    answer: phénomène
    alt: ["phénoménal"]
  - id: m1-l2-p2
    sentence: Par opposition au monde phénoménal, __Kant nomme monde__ ___ **le monde tel qu'il est en soi**, que nous pouvons penser sans jamais le connaître.
    answer: nouménal
    alt: []
  - id: m1-l2-p3
    sentence: Dans **l'antinomie de la liberté**, la thèse selon laquelle la liberté est possible __concerne le monde__ nouménal, tandis que l'antithèse selon laquelle **tout événement a une cause** concerne le monde ___.
    answer: phénoménal
    alt: []
  - id: m1-l2-p4
    sentence: L'interprétation selon laquelle **un seul et même acte peut se décrire à la fois comme un phénomène purement physique** et comme une chose en soi mentale, tous les actes demeurant causalement déterminés, __est défendue par le commentateur__ ___.
    answer: Hudson
    explanation: Hudson 1994 ; lecture compatibiliste opposée à la lecture par perspectives de Korsgaard, Allison et Hill.
    alt: []
  - id: m1-l2-p5
    sentence: Sur la **lecture par perspectives**, il suffit, pour agir moralement, __d'opérer, selon l'expression de Kant,__ "___ de la liberté", sans avoir à croire qu'on est réellement libre en un sens métaphysique profond.
    answer: sous l'idée
    explanation: "Fondements, III"
    alt: []
  - id: m1-l2-p6
    sentence: "__Kant définit__ **la liberté requise par la volonté morale** comme \"cette causalité de

      pouvoir agir indépendamment de ___ qui la déterminent ; de

      même que la nécessité naturelle est la propriété qu'a la causalité de tous les êtres

      dépourvus de raison d'être déterminée à agir par l'influence de causes

      étrangères\"."
    answer: causes étrangères
    alt: []
    explanation: "Fondements, III"
  - id: m1-l2-p7
    sentence: L'antinomie qui oppose la liberté et le déterminisme causal se résout, selon Kant, en distinguant **deux mondes** ; __cette résolution s'appuie sur les thèses développées dans__ ___, l'ouvrage où il expose sa philosophie théorique.
    answer: la Critique de la raison pure
    alt: []
  - id: m1-l2-p8
    sentence: Kant nomme "**Bien suprême**" __l'union de la vertu morale complète et d'un bonheur qui lui est__ ___.
    answer: proportionné
    alt: []
  - id: m1-l2-p9
    sentence: Parce que la vertu n'assure pas le bonheur en cette vie et que **la raison ne peut ni prouver ni réfuter l'existence de Dieu ni l'immortalité de l'âme**, __Kant tient ces deux idées pour des__ ___ requis par la raison pratique.
    answer: postulats
    alt: []

- id: m1-l3
  title: La bonne volonté, valeur inconditionnée
  notes: |
    L'analyse kantienne des notions morales ordinaires part du constat que la
    seule chose bonne sans restriction est une {violet}**bonne volonté**{/violet} : {green}une{/green}
    {green}volonté foncièrement attachée à agir comme l'exige la loi morale{/green}. Kant en
    tire deux conséquences pour la valeur de la bonne volonté.

    - Aucune circonstance ne justifie de mettre en balance nos convictions
      morales les plus profondes avec un autre bien : {yellow}le courage doit être{/yellow}
      {yellow}mis de côté s'il exige l'injustice, mieux vaut renoncer à un bon mot{/yellow}
      {yellow}s'il exige la cruauté{/yellow}. D'autres qualités estimables, comme le courage
      ou l'intelligence, perdent au contraire de leur valeur, ou doivent
      être sacrifiées, selon les circonstances.
    - Posséder une bonne volonté est {green}la condition à laquelle toute autre{/green}
      {green}chose vaut d'être recherchée{/green} : l'intelligence et même le plaisir ne
      valent d'être poursuivis qu'à condition de ne pas exiger l'abandon de
      nos convictions morales fondamentales.

    Il suit de là que la bonne volonté est bonne __en elle-même__, {red}non en{/red}
    {red}vertu des effets qu'elle produit ou des fins qu'elle sert (bonheur,{/red}
    {red}bien-être){/red}. Une bonne volonté {teal}« {/teal}brillerait comme {teal}un joyau »{/teal} même si elle
    était totalement impuissante à réaliser ses desseins.
  points:
  - id: m1-l3-p1
    sentence: Kant appelle **bonne volonté** __une volonté attachée avant tout à prendre des décisions moralement__ ___.
    answer: dignes
  - id: m1-l3-p2
    sentence: À la différence du courage ou d'un trait d'esprit, **qui doivent parfois être sacrifiés** (le courage s'il exige l'injustice, le mot d'esprit s'il exige la cruauté), __l'engagement à faire primer les considérations morales n'admet, selon Kant,__ ___.
    answer: aucune restriction
  - id: m1-l3-p3
    sentence: Kant tient que la possession d'une bonne volonté est **la condition** à laquelle toute autre chose, comme l'intelligence ou le plaisir, __vaut d'être__ ___.
    answer: poursuivie
  - id: m1-l3-p4
    sentence: Puisqu'une bonne volonté demeure bonne quelles que soient les circonstances, sa bonté ne peut dépendre d'aucune condition particulière ; __elle doit donc être bonne__ ___, **et non en vertu de ses effets**.
    answer: en elle-même
  - id: m1-l3-p5
    sentence: "**Une bonne volonté**, écrit Kant, __brillerait comme un__ ___ même si elle était totalement impuissante à réaliser ses desseins."
    answer: joyau
    explanation: "G 4:394."
  - id: m1-l3-p6
    sentence: L'affirmation qu'une bonne volonté **brillerait comme un joyau** alors même qu'elle serait impuissante à réaliser ses desseins __se trouve__ ___.
    answer: au début des deux premiers chapitres
  - id: m1-l3-p7
    sentence: "L'idée kantienne de bonne volonté est proche non de l'idée courante d'un caractère bienveillant ou « bon enfant », __mais de la notion plus ancienne et déjà un peu__ ___ de **« personne de bonne volonté »**."
    answer: archaïque

- id: m1-l4
  title: Le devoir et la valeur morale de l'action
  notes: |
    Les êtres humains éprouvent la loi morale comme une {violet}**contrainte**{/violet} sur
    leurs désirs, ce qui explique qu'elle se présente à eux sous forme
    d'impératifs et de devoirs. Une {violet}volonté sainte ou divine{/violet}, si elle
    existait, aurait elle aussi une bonne volonté, mais accomplirait
    nécessairement ses devoirs sans être contrainte de le faire : {coral}la notion{/coral}
    {coral}de devoir, propre à une volonté imparfaitement rationnelle comme la{/coral}
    {coral}nôtre, suppose la présence de désirs qui pourraient s'opposer à{/coral}
    {coral}l'exigence morale{/coral}.

    Kant confirme son analyse en comparant la motivation par le devoir à
    d'autres motifs : {amber}l'intérêt personnel, la conservation de soi, la{/amber}
    {amber}sympathie, le désir de bonheur{/amber}. Une action conforme au devoir mais
    accomplie pour l'un de ces motifs, aussi louable soit-elle, n'a
    {red}**aucune valeur morale**{/red}, parce que {coral}sa conformité au devoir n'est due{/coral}
    {coral}qu'à un heureux hasard{/coral} : si les circonstances n'avaient pas fait
    coïncider ce motif avec le devoir, l'agent n'aurait pas agi comme il le
    devait. {green}Seule une action accomplie par respect pour la loi morale{/green}
    {green}elle-même a une valeur morale{/green}.

    ! Cette thèse a suscité une controverse durable : {red}beaucoup objectent{/red}
      {red}qu'on n'estime pas davantage une action accomplie par devoir qu'une{/red}
      {red}action accomplie par affection{/red}, en particulier envers ses proches.
      Les défenseurs de Kant répondent que son point n'est pas que ces
      autres motifs ne méritent aucune estime, mais que, du point de vue de
      qui délibère, {green}seules les considérations de devoir sont décisives{/green}.
  points:
  - id: m1-l4-p1
    sentence: Parce qu'une **volonté sainte ou divine** accomplirait nécessairement ce que la moralité exige sans y être contrainte, __la notion de__ ___ ne s'applique, selon Kant, qu'à une volonté imparfaitement rationnelle comme la nôtre.
    answer: devoir
  - id: m1-l4-p2
    sentence: Une action conforme au devoir mais motivée par le seul bonheur n'a, selon Kant, **aucune valeur morale**, __parce que sa conformité au devoir ne tient qu'à un__ ___ ; rien ne garantit qu'elle eût coïncidé avec ce que le devoir exige si les circonstances avaient été différentes.
    answer: hasard
  - id: m1-l4-p3
    sentence: "Pour qu'une action ait une valeur morale, il ne suffit pas qu'elle soit **conforme au devoir** : __elle doit encore être accomplie par__ ___ pour la loi morale elle-même."
    answer: respect
  - id: m1-l4-p4
    sentence: "Kant confirme son analyse du devoir en l'opposant à **plusieurs autres motifs possibles** d'une action par ailleurs conforme au devoir : __l'intérêt personnel, la conservation de soi, la sympathie et__ ___."
    answer: le bonheur
  - id: m1-l4-p5
    sentence: L'objection la plus fréquente à la thèse kantienne de la valeur morale est qu'**on n'estime pas davantage**, notamment envers ses proches, __une action accomplie par devoir qu'une action accomplie par__ ___.
    answer: sympathie
  - id: m1-l4-p6
    sentence: Les défenseurs de Kant répondent à cette objection que son propos n'est pas de nier tout mérite aux motifs autres que le devoir, mais d'affirmer que, **du point de vue de qui délibère**, __seules les considérations de devoir sont__ ___.
    answer: décisives
  - id: m1-l4-p7
    sentence: "**Une volonté sainte ou divine** posséderait elle aussi une bonne volonté, mais en un sens différent de la nôtre : elle accomplirait nécessairement les exigences morales __sans y être__ ___."
    answer: contrainte

- id: m1-l5
  title: Le respect pour la loi morale
  notes: |
    Agir par devoir ne consiste pas à {red}obéir à une règle sanctionnée de{/red}
    {red}l'extérieur{/red}, comme {yellow}les statuts d'un club ou les lois d'un État qu'on{/yellow}
    {yellow}respecterait par devoir « civique »{/yellow}. Cette image, bien qu'intuitive, ne
    peut épuiser ce que Kant a en vue.

    - {red}Les lois auxquelles on obéirait ainsi peuvent être moralement{/red}
      {red}détestables{/red}, et le respect qu'on leur porterait alors n'aurait aucune
      valeur.
    - Le motif ordinaire d'obéissance aux lois civiques n'est d'ailleurs
      presque jamais un respect inconditionné : on obéit aussi par souci de
      l'ordre social, par crainte de la sanction ou de la perte de
      réputation, et l'on ne respecte une loi qu'autant qu'elle ne heurte
      pas nos propres valeurs.

    Agir par devoir, au sens propre, c'est être mû par la seule idée de la
    {green}__conformité de sa volonté à la loi comme telle__{/green}, indépendamment de
    tout résultat escompté. Ce {violet}**respect pour la loi morale**{/violet} consiste à
    reconnaître celle-ci comme une norme souverainement autorisée qui nous
    lie, et s'accompagne d'{amber}un sentiment apparenté à un mélange de crainte et{/amber}
    {amber}de vénération{/amber}. Tout être humain éprouve ce respect, même lorsqu'il n'est
    pas toujours mû par lui ni ne se conforme toujours à ce qu'il reconnaît
    comme autorisé.

    Kant en tire une conséquence sur le contenu de l'exigence morale :
    puisque les raisons morales gardent leur force quelle que soit la
    circonstance, {coral}seule une loi universelle peut constituer le contenu d'une{/coral}
    {coral}exigence dotée de cette force{/coral}. Cette analyse aboutit à une première
    formulation, encore préliminaire, de l'{violet}impératif catégorique{/violet}.
  points:
  - id: m1-l5-p1
    sentence: Le devoir, dans son sens le plus immédiat et intuitif, se rapproche de l'**obéissance aux statuts d'un club ou aux lois d'une cité**, assortis d'une sanction ; mais Kant ne peut s'en tenir là, car __de telles lois peuvent être moralement__ ___.
    answer: détestables
  - id: m1-l5-p2
    sentence: Le motif ordinaire d'obéissance aux lois civiques n'est presque jamais un **respect inconditionné**, mais tient aussi au souci de l'ordre social et à __la crainte de la sanction ou de la perte de__ ___.
    answer: réputation
  - id: m1-l5-p3
    sentence: "**Agir par devoir**, au sens propre, __c'est être mû non par un résultat escompté mais par la seule idée de la conformité de sa volonté à__ ___."
    answer: la loi comme telle
  - id: m1-l5-p4
    sentence: "**Le respect pour la loi morale** __s'accompagne, selon Kant, d'un sentiment apparenté à un mélange de crainte et__ ___."
    answer: de vénération
  - id: m1-l5-p5
    sentence: Bien qu'ils ne soient pas toujours mus par lui ni ne s'y conforment toujours, __les êtres humains éprouvent, selon Kant,__ ___ pour **la loi morale qu'ils reconnaissent pourtant comme autorisée**.
    answer: un respect inévitable
  - id: m1-l5-p6
    sentence: Parce que **les raisons morales gardent leur force quelle que soit la circonstance**, __Kant en conclut que seule une loi__ ___ peut constituer le contenu d'une exigence dotée de cette force.
    answer: universelle
  - id: m1-l5-p7
    sentence: La **formulation préliminaire de l'impératif catégorique** __énonce que je ne dois jamais agir sinon de telle sorte que je puisse aussi vouloir que ma maxime devienne une__ ___.
    answer: loi universelle
    explanation: "G 4:402."
  - id: m1-l5-p8
    sentence: La **formulation préliminaire de l'impératif catégorique**, __qui clôt l'analyse du devoir et du respect pour la loi menée depuis la notion de bonne volonté, se trouve__ ___.
    answer: à la fin des deux premiers chapitres
