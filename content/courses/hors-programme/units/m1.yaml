id: m1
title: Le bien vouloir et le devoir
subtitle: Bonne volonté, devoir et respect pour la loi morale
icon: scale
color: yellow
group: La morale de Kant

lessons:
  - id: m1-l1
    title: Les deux tâches de la philosophie morale
    notes: |
      Kant assigne à la philosophie morale deux tâches distinctes, réparties sur
      les trois chapitres du *Groundwork* (Fondation de la métaphysique des
      mœurs).

      - **Dégager** (*seek out*) le principe suprême de la moralité, en
        analysant des notions morales ordinaires comme la bonne volonté et le
        devoir : c'est l'objet des deux premiers chapitres.
      - **Établir** (*establish*) ce principe comme une exigence propre à la
        volonté rationnelle de chaque agent, en s'appuyant sur l'idée
        d'autonomie : c'est l'objet du troisième chapitre.

      Kant ne s'adresse pas d'abord à un authentique sceptique moral, qui
      douterait avoir la moindre raison d'agir moralement ; il part d'un accord
      moral très largement partagé, quitte à se montrer optimiste sur son
      étendue.

      Trois raisons justifient, selon lui, que la philosophie morale procède
      tout entière __a priori__, sans recourir à l'observation empirique des
      conduites humaines.
      - L'analyse des concepts moraux (bonne volonté, obligation, devoir) est
        par nature une opération a priori.
      - Établir que la loi morale nous oblige réellement exige un argument
        « synthétique » a priori, partant de l'idée de volonté rationnelle
        libre : une simple analyse conceptuelle ne peut y suffire.
      - Une méthode empirique ne peut établir que des exigences valables sous
        certaines conditions, alors que l'exigence morale se présente comme
        une nécessité inconditionnée.

      ! Il ne faut pas confondre les deux tâches : dégager le principe
        (chapitres I-II) reste un travail d'analyse conceptuelle, quand
        l'établir (chapitre III) prétend prouver qu'il oblige réellement une
        volonté rationnelle.
    points:
      - id: m1-l1-p1
        sentence: Kant nomme dégagement (« seek out ») du principe suprême de la moralité la tâche qui consiste à l'extraire par l'analyse de nos notions morales ordinaires, et ___ (« establish ») la tâche qui consiste à prouver qu'il oblige réellement toute volonté rationnelle.
        answer: établissement
      - id: m1-l1-p2
        sentence: L'analyse des notions ordinaires de bonne volonté et de devoir, première étape de la philosophie morale kantienne, occupe ___ du Groundwork.
        answer: les deux premiers chapitres
      - id: m1-l1-p3
        sentence: La tentative de prouver que le principe moral oblige effectivement une volonté rationnelle, en s'appuyant sur l'idée d'autonomie, occupe ___ du Groundwork.
        answer: le troisième et dernier chapitre
      - id: m1-l1-p4
        sentence: Les jugements moraux dont part l'analyse kantienne sont, selon Kant, ceux qu'accepterait sur réflexion rationnelle suffisante ___.
        answer: un adulte normal et sain d'esprit
        explanation: Kant ne prend pas pour cible principale un scepticisme moral radical.
      - id: m1-l1-p5
        sentence: La première des trois raisons kantiennes en faveur d'une méthode a priori en éthique tient à ce que l'analyse des concepts moraux eux-mêmes — bonne volonté, obligation, devoir — est par nature une opération ___.
        answer: a priori
      - id: m1-l1-p6
        sentence: La deuxième raison tient à ce qu'établir que la loi morale oblige réellement une volonté rationnelle exige, au-delà d'une simple analyse des concepts, un argument que Kant qualifie lui-même de ___.
        answer: synthétique
      - id: m1-l1-p7
        sentence: La troisième raison tient à ce qu'une méthode empirique ne peut établir que des exigences valables sous certaines conditions, alors que l'exigence morale se présente comme une nécessité ___.
        answer: inconditionnée

  - id: m1-l2
    title: Liberté, déterminisme et le Bien suprême
    notes: |
      Kant doit concilier deux thèses qu'il tient pour vraies : la moralité
      présuppose que nous sommes libres, mais la *Critique de la raison pure*
      soutient que tout événement a une cause. Sa solution distingue le
      **phénomène**, le monde tel que nous le connaissons par l'expérience, et
      le **nouménal**, le monde tel qu'il est en soi, que nous pouvons penser
      sans pouvoir le connaître.

      - Cette distinction résout l'antinomie de la liberté : la thèse, selon
        laquelle la liberté est possible, concerne le monde nouménal ;
        l'antithèse, selon laquelle tout événement a une cause, concerne le
        monde phénoménal.
      - Deux lectures s'opposent chez les commentateurs sur la portée de cette
        distinction. La première, défendue par Hudson, tient qu'un même acte
        se décrit à la fois en termes purement physiques (comme phénomène) et
        en termes irréductiblement mentaux (comme chose en soi), tous les
        actes restant causalement déterminés. La seconde, défendue entre
        autres par Korsgaard, traite les deux mondes comme deux métaphores
        pour deux perspectives sur un seul et même monde : la perspective
        scientifique, qui pense tout comme soumis à la causalité naturelle, et
        la perspective pratique, celle de la délibération et de l'action, où
        nous nous pensons comme des agents libres.
      - Sur cette seconde lecture, agir « sous l'idée » de la liberté ne
        requiert pas de croire réellement qu'on est libre en un sens
        métaphysique profond, seulement d'opérer comme si on l'était.

      Kant assigne enfin à la philosophie morale une dernière tâche : dire
      quelque chose du **Bien suprême** (*Highest Good*), fin ultime de
      l'existence humaine, qu'il définit comme l'union de la vertu morale
      complète et d'un bonheur proportionné à cette vertu.

      ! La raison, selon Kant, ne peut ni prouver ni réfuter l'existence de
        Dieu ni l'immortalité de l'âme ; il les tient pourtant pour des
        « postulats » requis par la raison pratique, puisque rien dans cette
        vie ne garantit que la vertu soit récompensée par le bonheur.
    points:
      - id: m1-l2-p1
        sentence: Kant appelle ___ le monde tel que nous le connaissons à travers l'expérience, par opposition au monde tel qu'il est en soi.
        answer: phénomène
      - id: m1-l2-p2
        sentence: Par opposition au monde phénoménal, Kant nomme monde ___ le monde tel qu'il est en soi, que nous pouvons penser sans jamais le connaître.
        answer: nouménal
      - id: m1-l2-p3
        sentence: Dans l'antinomie de la liberté, la thèse selon laquelle la liberté est possible concerne le monde nouménal, tandis que l'antithèse selon laquelle tout événement a une cause concerne le monde ___.
        answer: phénoménal
      - id: m1-l2-p4
        sentence: L'interprétation selon laquelle un seul et même acte peut se décrire à la fois comme un phénomène purement physique et comme une chose en soi mentale, tous les actes demeurant causalement déterminés, est défendue par le commentateur ___.
        answer: Hudson
        explanation: Hudson 1994 ; lecture compatibiliste opposée à la lecture par perspectives de Korsgaard, Allison et Hill.
      - id: m1-l2-p5
        sentence: Sur la lecture par perspectives, il suffit, pour agir moralement, d'opérer, selon l'expression de Kant, ___ de la liberté, sans avoir à croire qu'on est réellement libre en un sens métaphysique profond.
        answer: sous l'idée
        explanation: "G 4:448."
      - id: m1-l2-p6
        sentence: Kant définit la liberté requise par la moralité comme une espèce de causalité qui peut être ___, indépendamment de causes étrangères qui la déterminent.
        answer: active
        explanation: "G 4:446."
      - id: m1-l2-p7
        sentence: L'antinomie qui oppose la liberté et le déterminisme causal se résout, selon Kant, en distinguant deux mondes ; cette résolution s'appuie sur les thèses développées dans ___, l'ouvrage où il expose sa philosophie théorique.
        answer: la Critique de la raison pure
      - id: m1-l2-p8
        sentence: Kant nomme Bien suprême l'union de la vertu morale complète et d'un bonheur qui lui est ___.
        answer: proportionné
      - id: m1-l2-p9
        sentence: Parce que la vertu n'assure pas le bonheur en cette vie et que la raison ne peut ni prouver ni réfuter l'existence de Dieu ni l'immortalité de l'âme, Kant tient ces deux idées pour des ___ requis par la raison pratique.
        answer: postulats

  - id: m1-l3
    title: La bonne volonté, valeur inconditionnée
    notes: |
      L'analyse kantienne des notions morales ordinaires part du constat que la
      seule chose bonne sans restriction est une **bonne volonté** — une
      volonté foncièrement attachée à agir comme l'exige la loi morale. Kant en
      tire deux conséquences pour la valeur de la bonne volonté.

      - Aucune circonstance ne justifie de mettre en balance nos convictions
        morales les plus profondes avec un autre bien : le courage doit être
        mis de côté s'il exige l'injustice, mieux vaut renoncer à un bon mot
        s'il exige la cruauté. D'autres qualités estimables, comme le courage
        ou l'intelligence, perdent au contraire de leur valeur, ou doivent
        être sacrifiées, selon les circonstances.
      - Posséder une bonne volonté est la condition à laquelle toute autre
        chose vaut d'être recherchée : l'intelligence et même le plaisir ne
        valent d'être poursuivis qu'à condition de ne pas exiger l'abandon de
        nos convictions morales fondamentales.

      Il suit de là que la bonne volonté est bonne __en elle-même__, non en
      vertu des effets qu'elle produit ou des fins qu'elle sert (bonheur,
      bien-être). Une bonne volonté « brillerait comme un joyau » même si elle
      était totalement impuissante à réaliser ses desseins.
    points:
      - id: m1-l3-p1
        sentence: Kant appelle bonne volonté une volonté attachée avant tout à prendre des décisions moralement ___.
        answer: dignes
      - id: m1-l3-p2
        sentence: À la différence du courage ou d'un trait d'esprit, qui doivent parfois être sacrifiés — le courage s'il exige l'injustice, le mot d'esprit s'il exige la cruauté —, l'engagement à faire primer les considérations morales n'admet, selon Kant, ___.
        answer: aucune restriction
      - id: m1-l3-p3
        sentence: Kant tient que la possession d'une bonne volonté est la condition à laquelle toute autre chose, comme l'intelligence ou le plaisir, vaut d'être ___.
        answer: poursuivie
      - id: m1-l3-p4
        sentence: Puisqu'une bonne volonté demeure bonne quelles que soient les circonstances, sa bonté ne peut dépendre d'aucune condition particulière ; elle doit donc être bonne ___, et non en vertu de ses effets.
        answer: en elle-même
      - id: m1-l3-p5
        sentence: Une bonne volonté, écrit Kant, brillerait comme un ___ même si elle était totalement impuissante à réaliser ses desseins.
        answer: joyau
        explanation: "G 4:394."
      - id: m1-l3-p6
        sentence: L'affirmation qu'une bonne volonté brillerait comme un joyau alors même qu'elle serait impuissante à réaliser ses desseins se trouve ___.
        answer: au début des deux premiers chapitres
      - id: m1-l3-p7
        sentence: L'idée kantienne de bonne volonté est proche non de l'idée courante d'un caractère bienveillant ou « bon enfant », mais de la notion plus ancienne et déjà un peu ___ de « personne de bonne volonté ».
        answer: archaïque

  - id: m1-l4
    title: Le devoir et la valeur morale de l'action
    notes: |
      Les êtres humains éprouvent la loi morale comme une **contrainte** sur
      leurs désirs, ce qui explique qu'elle se présente à eux sous forme
      d'impératifs et de devoirs. Une volonté sainte ou divine, si elle
      existait, aurait elle aussi une bonne volonté, mais accomplirait
      nécessairement ses devoirs sans être contrainte de le faire : la notion
      de devoir, propre à une volonté imparfaitement rationnelle comme la
      nôtre, suppose la présence de désirs qui pourraient s'opposer à
      l'exigence morale.

      Kant confirme son analyse en comparant la motivation par le devoir à
      d'autres motifs — l'intérêt personnel, la conservation de soi, la
      sympathie, le désir de bonheur. Une action conforme au devoir mais
      accomplie pour l'un de ces motifs, aussi louable soit-elle, n'a
      **aucune valeur morale**, parce que sa conformité au devoir n'est due
      qu'à un heureux hasard : si les circonstances n'avaient pas fait
      coïncider ce motif avec le devoir, l'agent n'aurait pas agi comme il le
      devait. Seule une action accomplie par respect pour la loi morale
      elle-même a une valeur morale.

      ! Cette thèse a suscité une controverse durable : beaucoup objectent
        qu'on n'estime pas davantage une action accomplie par devoir qu'une
        action accomplie par affection, en particulier envers ses proches.
        Les défenseurs de Kant répondent que son point n'est pas que ces
        autres motifs ne méritent aucune estime, mais que, du point de vue de
        qui délibère, seules les considérations de devoir sont décisives.
    points:
      - id: m1-l4-p1
        sentence: Parce qu'une volonté sainte ou divine accomplirait nécessairement ce que la moralité exige sans y être contrainte, la notion de ___ ne s'applique, selon Kant, qu'à une volonté imparfaitement rationnelle comme la nôtre.
        answer: devoir
      - id: m1-l4-p2
        sentence: Une action conforme au devoir mais motivée par le seul bonheur n'a, selon Kant, aucune valeur morale, parce que sa conformité au devoir ne tient qu'à un ___ ; rien ne garantit qu'elle eût coïncidé avec ce que le devoir exige si les circonstances avaient été différentes.
        answer: hasard
      - id: m1-l4-p3
        sentence: "Pour qu'une action ait une valeur morale, il ne suffit pas qu'elle soit conforme au devoir : elle doit encore être accomplie par ___ pour la loi morale elle-même."
        answer: respect
      - id: m1-l4-p4
        sentence: "Kant confirme son analyse du devoir en l'opposant à plusieurs autres motifs possibles d'une action par ailleurs conforme au devoir : l'intérêt personnel, la conservation de soi, la sympathie et ___."
        answer: le bonheur
      - id: m1-l4-p5
        sentence: L'objection la plus fréquente à la thèse kantienne de la valeur morale est qu'on n'estime pas davantage, notamment envers ses proches, une action accomplie par devoir qu'une action accomplie par ___.
        answer: sympathie
      - id: m1-l4-p6
        sentence: Les défenseurs de Kant répondent à cette objection que son propos n'est pas de nier tout mérite aux motifs autres que le devoir, mais d'affirmer que, du point de vue de qui délibère, seules les considérations de devoir sont ___.
        answer: décisives
      - id: m1-l4-p7
        sentence: "Une volonté sainte ou divine posséderait elle aussi une bonne volonté, mais en un sens différent de la nôtre : elle accomplirait nécessairement les exigences morales sans y être ___."
        answer: contrainte

  - id: m1-l5
    title: Le respect pour la loi morale
    notes: |
      Agir par devoir ne consiste pas à obéir à une règle sanctionnée de
      l'extérieur, comme les statuts d'un club ou les lois d'un État qu'on
      respecterait par devoir « civique ». Cette image, bien qu'intuitive, ne
      peut épuiser ce que Kant a en vue.

      - Les lois auxquelles on obéirait ainsi peuvent être moralement
        détestables, et le respect qu'on leur porterait alors n'aurait aucune
        valeur.
      - Le motif ordinaire d'obéissance aux lois civiques n'est d'ailleurs
        presque jamais un respect inconditionné : on obéit aussi par souci de
        l'ordre social, par crainte de la sanction ou de la perte de
        réputation, et l'on ne respecte une loi qu'autant qu'elle ne heurte
        pas nos propres valeurs.

      Agir par devoir, au sens propre, c'est être mû par la seule idée de la
      __conformité de sa volonté à la loi comme telle__, indépendamment de
      tout résultat escompté. Ce **respect pour la loi morale** consiste à
      reconnaître celle-ci comme une norme souverainement autorisée qui nous
      lie, et s'accompagne d'un sentiment apparenté à un mélange de crainte et
      de vénération. Tout être humain éprouve ce respect, même lorsqu'il n'est
      pas toujours mû par lui ni ne se conforme toujours à ce qu'il reconnaît
      comme autorisé.

      Kant en tire une conséquence sur le contenu de l'exigence morale :
      puisque les raisons morales gardent leur force quelle que soit la
      circonstance, seule une loi universelle peut constituer le contenu d'une
      exigence dotée de cette force. Cette analyse aboutit à une première
      formulation, encore préliminaire, de l'impératif catégorique.
    points:
      - id: m1-l5-p1
        sentence: Le devoir, dans son sens le plus immédiat et intuitif, se rapproche de l'obéissance aux statuts d'un club ou aux lois d'une cité, assortis d'une sanction ; mais Kant ne peut s'en tenir là, car de telles lois peuvent être moralement ___.
        answer: détestables
      - id: m1-l5-p2
        sentence: Le motif ordinaire d'obéissance aux lois civiques n'est presque jamais un respect inconditionné, mais tient aussi au souci de l'ordre social et à la crainte de la sanction ou de la perte de ___.
        answer: réputation
      - id: m1-l5-p3
        sentence: Agir par devoir, au sens propre, c'est être mû non par un résultat escompté mais par la seule idée de la conformité de sa volonté à ___.
        answer: la loi comme telle
      - id: m1-l5-p4
        sentence: Le respect pour la loi morale s'accompagne, selon Kant, d'un sentiment apparenté à un mélange de crainte et ___.
        answer: de vénération
      - id: m1-l5-p5
        sentence: Bien qu'ils ne soient pas toujours mus par lui ni ne s'y conforment toujours, les êtres humains éprouvent, selon Kant, ___ pour la loi morale qu'ils reconnaissent pourtant comme autorisée.
        answer: un respect inévitable
      - id: m1-l5-p6
        sentence: Parce que les raisons morales gardent leur force quelle que soit la circonstance, Kant en conclut que seule une loi ___ peut constituer le contenu d'une exigence dotée de cette force.
        answer: universelle
      - id: m1-l5-p7
        sentence: La formulation préliminaire de l'impératif catégorique énonce que je ne dois jamais agir sinon de telle sorte que je puisse aussi vouloir que ma maxime devienne une ___.
        answer: loi universelle
        explanation: "G 4:402."
      - id: m1-l5-p8
        sentence: La formulation préliminaire de l'impératif catégorique, qui clôt l'analyse du devoir et du respect pour la loi menée depuis la notion de bonne volonté, se trouve ___.
        answer: à la fin des deux premiers chapitres
