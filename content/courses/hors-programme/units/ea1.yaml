  - id: ea1-l5
    title: "Troisième moment : la finalité sans fin"
    notes: |
      Le troisième moment (§§10–17) explique que le jugement de beauté
      n'implique la représentation d'aucune {teal}**fin**{/teal} [`Zweck`]
      déterminée que l'objet serait censé satisfaire, à la différence du
      jugement du bien.

      Il implique pourtant la représentation d'une {teal}**finalité**{/teal}
      [`Zweckmässigkeit`]. Comme cette finalité ne s'accompagne d'aucune fin
      assignée, on résume la position de Kant par la formule devenue
      classique : « {teal}**finalité sans fin**{/teal} »
      [`Zweckmässigkeit ohne Zweck`].

      Kant la nomme lui-même finalité *purement formelle*, ou forme de la
      finalité : elle se perçoit à la fois dans l'objet et dans l'activité de
      deux facultés, l'imagination et l'entendement, engagées à son endroit
      (le détail de cette activité, le « libre jeu », fait l'objet de la
      déduction du jugement de goût, voir l'unité suivante).

      La formule du troisième moment : « La *beauté* est la forme de la *finalité* d'un objet en tant qu'elle est perçue en celui-ci sans *représentation d'une fin* » (§17). La **forme de la finalité** est la relation intentionnelle qu'on suppose être la cause de l'existence d'un objet : « La causalité d'un concept par rapport à son objet est la finalité (*forma finalis*) » (§10). L'intention produit l'objet en posant son concept comme le **but à atteindre** par la mise en œuvre des moyens appropriés : c'est très exactement la **cause finale** d'Aristote.

      Est beau ce qui donne l'impression d'avoir été produit selon une intention, sans que le concept de la chose revienne : sinon, juger reviendrait à comparer l'objet à son concept, et Platon aurait raison. D'où : « le jugement de goût est entièrement indépendant du concept de perfection » (§15). Marc Sherringham résume : est purement beau ce qui manifeste une intention pure dont l'origine reste inconnaissable.

      ! Le paragraphe 14 est le principal fondement textuel de ce que les
      commentateurs appellent le **formalisme** esthétique de Kant : l'idée
      que seule la forme (l'agencement spatial ou temporel des éléments)
      compterait pour l'appréciation esthétique.
