id: ea1
title: "Le jugement de goût : les quatre moments du beau"
subtitle: "La faculté de juger, l'unité de la troisième Critique, et l'Analytique du beau"
icon: palette
color: violet
group: "L'esthétique de Kant"
lessons:
  - id: ea1-l1
    title: "La faculté de juger, déterminante et réfléchissante"
    notes: |
      Kant ouvre sa réflexion sur l'esthétique et la téléologie par un examen de
      **la faculté de juger** [`Urteilskraft`], qu'il définit comme la capacité
      de penser le particulier comme contenu sous l'universel.

      Deux rôles s'y distinguent :
      - rôle __déterminant__ (`bestimmend`) : un universel (un concept) est déjà
        donné, il s'agit seulement d'y subsumer un particulier : c'est le rôle
        que la Critique de la raison pure attribuait déjà à la faculté de juger.
      - rôle __réfléchissant__ (`reflektierend`) : seul le particulier est
        donné, il faut lui trouver l'universel qui convient. C'est la tâche la
        plus originale de la troisième Critique.

      Ce n'est que dans la Critique de la faculté de juger que Kant traite le
      jugement comme **une faculté à part entière**, dotée de son principe a
      priori propre.

      À la faculté de juger réfléchissante, Kant attribue plusieurs tâches :
      classer les êtres naturels en genres et en espèces, construire des
      théories scientifiques systématiques, et même former tous nos concepts
      empiriques. Mais surtout, elle produit deux types de jugements
      spécifiques, objets de toute la suite de l'ouvrage : les **jugements
      esthétiques** (beau, sublime) et les **jugements téléologiques**
      (attribution de fins à la nature).

      ! Kant réserve un statut privilégié aux jugements portant sur la beauté
      __naturelle__ (non celle de l'art) : c'est en eux, dit-il, que la faculté
      de juger se révèle comme ayant son principe propre.
    points:
      - id: ea1-l1-p1
        sentence: "Kant ouvre son enquête sur l'esthétique et la téléologie en la présentant comme partie d'une réflexion plus large sur ___, la faculté de penser le particulier comme contenu sous l'universel, dont l'examen occupe toute la troisième Critique."
        answer: "la faculté de juger"
        alt: []
        explanation: "Introduction IV, Ak. 5:179."
      - id: ea1-l1-p2
        sentence: "Kant emploie pour cette faculté le terme allemand ___, qui donne son titre à l'ouvrage entier (Kritik der Urteilskraft)."
        answer: "Urteilskraft"
        alt: []
      - id: ea1-l1-p3
        sentence: "Quand la faculté de juger reçoit un universel déjà donné et se contente d'y subsumer un particulier (comme dans la Critique de la raison pure), elle exerce son rôle ___."
        answer: "déterminant"
        alt: []
      - id: ea1-l1-p4
        sentence: "Ce premier rôle de la faculté de juger, celui qui subsume un particulier sous un universel déjà donné, porte en allemand le nom de ___."
        answer: "bestimmend"
        alt: []
      - id: ea1-l1-p5
        sentence: "Quand au contraire seul le particulier est donné et qu'il revient à la faculté de juger de lui trouver l'universel adéquat (sa tâche la plus distinctive dans la troisième Critique), elle exerce son rôle ___."
        answer: "réfléchissant"
        alt: []
      - id: ea1-l1-p6
        sentence: "Ce second rôle de la faculté de juger, celui qui cherche l'universel pour un particulier donné, porte en allemand le nom de ___."
        answer: "reflektierend"
        alt: []
      - id: ea1-l1-p7
        sentence: "Kant introduit ce partage entre rôle déterminant et rôle réfléchissant de la faculté de juger dans la Critique de la faculté de juger, ___, avant même d'aborder l'esthétique proprement dite."
        answer: "à la section IV de l'introduction"
        alt: ["dans la section IV de l'introduction"]
        explanation: "Introduction IV, Ak. 5:179 ; voir aussi FI V, Ak. 20:211."
      - id: ea1-l1-p8
        sentence: "Bien que la Critique de la raison pure comporte déjà une brève discussion de la faculté de juger, ce n'est que dans ___ que Kant en fait une faculté à part entière, dotée de son propre principe a priori et nécessitant sa propre critique."
        answer: "la Critique de la faculté de juger"
        alt: []
      - id: ea1-l1-p9
        sentence: "Outre les jugements esthétiques et téléologiques, Kant attribue à la faculté de juger réfléchissante la tâche cognitive de classer les êtres naturels en une hiérarchie de genres et d'espèces, et de construire des théories scientifiques explicatives et ___, où des lois plus particulières se rangent sous des lois plus générales."
        answer: "systématiques"
        alt: []
      - id: ea1-l1-p10
        sentence: "Plus fondamentalement encore, Kant fait de la faculté de juger réfléchissante la condition de la formation de tous les concepts ___, et de la possibilité même de considérer la nature comme légale d'un point de vue empirique."
        answer: "empiriques"
        alt: []
      - id: ea1-l1-p11
        sentence: "Kant assigne à la faculté de juger réfléchissante deux tâches spécifiques, distinctes de ses tâches cognitives générales : produire des jugements esthétiques, portant sur le beau et le sublime, et produire des jugements ___, qui attribuent des fins aux choses de la nature."
        answer: "téléologiques"
        alt: []
      - id: ea1-l1-p12
        sentence: "Kant réserve un rôle privilégié à un sous-ensemble particulier des jugements esthétiques : c'est dans les jugements portant sur la beauté ___ (non celle de l'art) que la faculté de juger se révèle selon lui comme une faculté dotée de son principe propre."
        answer: "naturelle"
        alt: []
        explanation: "FI XI, Ak. 20:244."

  - id: ea1-l2
    title: "L'unité de la troisième Critique"
    notes: |
      La Critique de la faculté de juger pose **un problème d'unité** : comment
      relier l'esthétique (première partie) et la téléologie (seconde partie),
      et l'une et l'autre à la « faculté de juger » qui donne son titre à
      l'ouvrage entier ?

      Jusque dans les années 1980, plusieurs commentateurs doutaient qu'il
      existe une véritable unité philosophique entre les deux parties.
      Depuis, plusieurs **stratégies concurrentes** cherchent au contraire
      cette unité :

      - relier l'esthétique aux pages de l'introduction sur la recherche d'un
        système de concepts et de lois **empiriques** ;
      - rapprocher **le beau et l'organisme vivant**, mais les commentateurs
        qui suivent cette voie proposent des analogies très différentes entre
        elles ;
      - passer par la **téléologie morale** : la Critique de la faculté de
        juger comblerait le fossé entre la nature et la liberté, l'être humain
        libre et rationnel constituant une fin de la nature.

      *Pour distinguer {teal}les deux premières stratégies{/teal} :
      {teal}la première{/teal} (par les concepts empiriques) explique pourquoi
      juger qu'un objet est beau ressemble à former un concept scientifique ;
      {teal}la seconde{/teal} (par la biologie) explique pourquoi la beauté
      d'un organisme et son fonctionnement vital partagent une même logique,
      mais selon quelle logique exactement, les commentateurs de cette seconde
      voie ne s'accordent pas.*
    points:
      - id: ea1-l2-p1
        sentence: "Par contraste avec la tendance dominante depuis les années 1980 à chercher une unité philosophique entre l'esthétique et la téléologie kantiennes, ce scepticisme sur l'unité de l'ouvrage trouve une expression explicite et ancienne chez ___."
        answer: "Schopenhauer"
        alt: []
        explanation: "Schopenhauer 1819/1859, cité aux côtés de Marc-Wogau (1938) et Beck (1969), qui partagent le même scepticisme."
      - id: ea1-l2-p2
        sentence: "Une clé pour résoudre le problème de l'unité de l'ouvrage consiste à relier l'esthétique kantienne à ses développements, dans l'introduction, sur la recherche d'un système de concepts et de lois ___."
        answer: "empiriques"
        alt: []
      - id: ea1-l2-p3
        sentence: "Parmi les commentateurs qui rapprochent le beau et l'organisme vivant pour unifier l'ouvrage, ___ soutient que la structure interne de l'organisme, où le tout détermine les parties, est analogue à celle du jugement de beauté, où un sentiment de plaisir plutôt qu'un concept fait office de prédicat."
        answer: "Aquila"
        alt: []
        explanation: "Aquila 1992."
      - id: ea1-l2-p4
        sentence: "Contrairement à Aquila, ___ relie plutôt l'esthétique et la biologie kantiennes par l'idée de finalité conçue comme normativité : la normativité du fonctionnement des organismes serait mise en parallèle avec la prétention normative à l'assentiment universel du jugement de beauté."
        answer: "Ginsborg"
        alt: []
        explanation: "Ginsborg 1997a."
      - id: ea1-l2-p5
        sentence: "___ propose un traitement encore différent, et particulièrement détaillé, de ce rapprochement entre le beau et l'organisme, en insistant plutôt sur l'idée de finalité comprise comme unité dans la diversité."
        answer: "Zuckert"
        alt: []
        explanation: "Zuckert 2007a."
      - id: ea1-l2-p6
        sentence: "Une autre approche de l'unité de l'ouvrage passe par la téléologie morale, et s'appuie sur l'idée que la Critique de la faculté de juger doit combler le fossé entre la nature et la ___."
        answer: "liberté"
        alt: []
        explanation: "Introduction II et III, Ak. 5:175–177."
      - id: ea1-l2-p7
        sentence: "L'approche de l'unité de l'ouvrage par la téléologie morale se prolonge, pour ceux qui la défendent, jusqu'à l'idée que l'être humain, comme agent libre et rationnel, constitue une fin de la nature : une thèse pleinement développée dans la partie du livre consacrée à ___."
        answer: "la téléologie"
        alt: []
      - id: ea1-l2-p8
        sentence: "___ défend explicitement l'unité de l'ouvrage par la voie de la téléologie morale, en s'appuyant sur l'idée que l'expérience esthétique révèle l'aptitude de la nature à l'agir moral humain."
        answer: "Gardner"
        alt: []
        explanation: "Gardner 2016 ; une idée également soulignée par Wicks 2007."

  - id: ea1-l3
    title: "Premier moment : le plaisir désintéressé"
    notes: |
      Le premier moment de l'Analytique du beau (§§1–5) définit le jugement de
      goût par sa base : un sentiment, celui du **plaisir** (Kant mentionne
      aussi le déplaisir, mais sans lui donner de rôle central).

      Ce plaisir a un trait distinctif : il est __désintéressé__, c'est-à-dire
      qu'il ne dépend d'aucun désir pour l'objet et n'en suscite aucun.

      Cette double caractéristique (sentiment + désintéressement) permet à
      Kant de distinguer le **jugement de beauté** de trois autres types de
      jugement :
      - le jugement cognitif (« cet objet est vert ») : fondé sur une
        sensation objective, non sur un sentiment.
      - **le jugement de l'agréable** (aimer un mets, une boisson) : fondé sur
        un sentiment, mais {coral}intéressé{/coral}.
      - **le jugement du bien** (bonté morale, ou bonté relative à une fin non
        morale) : fondé sur un {coral}intérêt{/coral} lui aussi.

      ! Le désintéressement ne signifie pas indifférence : il signifie
      seulement que le plaisir ne dépend pas de vouloir posséder ou consommer
      l'objet.
    points:
      - id: ea1-l3-p1
        sentence: "Les jugements de beauté reposent, selon le premier moment, sur un sentiment plutôt que sur une connaissance : plus précisément sur le sentiment de ___ (Kant mentionne aussi le déplaisir, mais sans lui donner de rôle central dans son compte rendu)."
        answer: "plaisir"
        alt: []
      - id: ea1-l3-p2
        sentence: "Le plaisir propre au jugement de beauté est qualifié par Kant de ___, ce qui signifie qu'il ne dépend d'aucun désir pour l'objet et n'en suscite aucun."
        answer: "désintéressé"
        alt: ["désintéressée"]
      - id: ea1-l3-p3
        sentence: "Ce qui distingue un jugement de beauté, fondé sur un sentiment, d'un jugement cognitif comme « cet objet est vert », c'est que ce dernier est fondé sur une ___ objective, par exemple la sensation de couleur."
        answer: "sensation"
        alt: []
      - id: ea1-l3-p4
        sentence: "Par opposition au jugement de beauté, le jugement qui se borne à déclarer qu'on aime quelque chose ou qu'on le trouve plaisant (par exemple un mets ou une boisson) est nommé par Kant jugement de l'___."
        answer: "agréable"
        alt: []
      - id: ea1-l3-p5
        sentence: "Kant distingue enfin le jugement de beauté du jugement portant sur la bonté d'une chose, qu'il s'agisse de sa bonté morale ou de sa bonté relative à une fin non morale : ce second type de jugement est le jugement du ___."
        answer: "bien"
        alt: []
      - id: ea1-l3-p6
        sentence: "Kant développe l'analyse de ce premier moment du jugement de beauté au tout début de l'Analytique du beau, ___, avant d'aborder l'universalité du jugement de goût au moment suivant."
        answer: "aux paragraphes 1 à 5"
        alt: ["dans les paragraphes 1 à 5", "aux §§1-5"]

  - id: ea1-l4
    title: "Second moment : l'universalité sans concept"
    notes: |
      Le second moment (§§6–9) attribue au jugement de beauté une prétention à
      l'**universalité** (ou validité universelle) : juger qu'un objet est
      beau, c'est prétendre que chacun devrait partager ce plaisir. Kant
      emploie aussi l'expression *communicabilité universelle*, longtemps
      tenue pour équivalente à l'universalité : une équivalence aujourd'hui
      débattue.

      - Cette universalité __ne repose sur aucun concept__ : à la différence
        de « cet objet est vert », dont la prétention à l'assentiment général
        tient à la subsomption sous un concept, celle du beau n'en tient à
        aucun. Kant l'affirme sans détour : « la beauté n'est pas un
        **concept** de l'objet » (§38).
        Plus tard, dans l'Antinomie du goût, il semble nuancer cette thèse en
        évoquant un concept *indéterminé* (§57) : un usage du mot « concept »
        qui s'écarte de son sens ordinaire.
      - Conséquence : un jugement de beauté ne peut jamais être __démontré__,
        aucune règle ne pouvant contraindre quiconque à juger belle une
        chose.

      Cette universalité distingue encore le beau de l'agréable (où l'on ne
      prétend pas que chacun doive ressentir le même plaisir) et des
      jugements cognitifs et du bien (universels eux aussi, mais par le biais
      de concepts).
    points:
      - id: ea1-l4-p1
        sentence: "Le second moment attribue aux jugements de beauté une prétention à valoir pour tout un chacun : juger un objet beau, c'est prétendre que chacun devrait partager ce plaisir. Kant nomme cette prétention l'___ (ou validité universelle) du jugement."
        answer: "universalité"
        alt: ["validité universelle"]
      - id: ea1-l4-p2
        sentence: "Kant emploie aussi, pour ce même trait du jugement de beauté, l'expression ___, prise par de nombreux commentateurs pour équivalente à l'universalité : une équivalence aujourd'hui mise en question par certains d'entre eux."
        answer: "communicabilité universelle"
        alt: []
      - id: ea1-l4-p3
        sentence: "À la différence du jugement cognitif « cet objet est vert », dont la prétention à l'assentiment général repose sur la subsomption sous un concept, celle du jugement de beauté ne repose sur aucun ___."
        answer: "concept"
        alt: []
      - id: ea1-l4-p4
        sentence: "Kant formule avec force cette non-conceptualité de la beauté en écrivant, dans la Déduction du goût, que « la beauté n'est pas un ___ de l'objet »."
        answer: "concept"
        alt: []
        explanation: "§38, Ak. 5:290."
      - id: ea1-l4-p5
        sentence: "Plus tard, dans l'Antinomie du goût, Kant semble revenir sur cette non-conceptualité de la beauté en affirmant que le jugement de goût repose tout de même sur un concept ___ : un usage du mot « concept » qui s'écarte alors de son sens ordinaire."
        answer: "indéterminé"
        alt: []
        explanation: "§57, Ak. 5:341."
      - id: ea1-l4-p6
        sentence: "Parce que son universalité ne repose sur aucun concept, un jugement de beauté ne peut jamais être ___ : aucune règle ne peut contraindre quiconque à juger belle une chose."
        answer: "démontré"
        alt: ["prouvé"]
      - id: ea1-l4-p7
        sentence: "Le second moment distingue aussi le jugement de beauté du jugement de l'agréable : en déclarant simplement qu'on aime quelque chose, on ne prétend pas, contrairement au jugement de beauté, que chacun devrait ressentir le même ___."
        answer: "plaisir"
        alt: []
      - id: ea1-l4-p8
        sentence: "Ce qui distingue enfin le second moment du jugement de beauté des jugements cognitifs non évaluatifs et des jugements du bien, c'est que la validité universelle de ces derniers repose sur des concepts, alors que celle du beau ne repose sur ___."
        answer: "aucun concept"
        alt: []
      - id: ea1-l4-p9
        sentence: "Kant développe le second moment du jugement de beauté dans l'Analytique du beau, ___, immédiatement après avoir établi le désintéressement du plaisir esthétique au premier moment."
        answer: "aux paragraphes 6 à 9"
        alt: ["dans les paragraphes 6 à 9", "aux §§6-9"]

  - id: ea1-l5
    title: "Troisième moment : la finalité sans fin"
    notes: |
      Le troisième moment (§§10–17) explique que le jugement de beauté
      n'implique la représentation d'aucune {teal}**fin**{/teal} [`Zweck`]
      déterminée que l'objet serait censé satisfaire, à la différence du
      jugement du bien.

      Il implique pourtant la représentation d'une {teal}**finalité**{/teal}
      [`Zweckmässigkeit`]. Comme cette finalité ne s'accompagne d'aucune fin
      assignée, on résume la position de Kant par la formule devenue
      classique : « {teal}**finalité sans fin**{/teal} »
      [`Zweckmässigkeit ohne Zweck`].

      Kant la nomme lui-même finalité *purement formelle*, ou forme de la
      finalité : elle se perçoit à la fois dans l'objet et dans l'activité de
      deux facultés, l'imagination et l'entendement, engagées à son endroit
      (le détail de cette activité, le « libre jeu », fait l'objet de la
      déduction du jugement de goût, voir l'unité suivante).

      ! Le paragraphe 14 est le principal fondement textuel de ce que les
      commentateurs appellent le **formalisme** esthétique de Kant : l'idée
      que seule la forme (l'agencement spatial ou temporel des éléments)
      compterait pour l'appréciation esthétique.
    points:
      - id: ea1-l5-p1
        sentence: "À la différence du jugement du bien, le jugement de beauté ne présuppose, selon le troisième moment, aucune ___ (ou but) que l'objet serait censé satisfaire."
        answer: "fin"
        alt: []
      - id: ea1-l5-p2
        sentence: "Ce terme, que Kant emploie en allemand pour désigner cette fin ou ce but qu'un jugement de beauté ne présuppose pas, s'écrit ___."
        answer: "Zweck"
        alt: []
      - id: ea1-l5-p3
        sentence: "Bien qu'il n'implique la représentation d'aucune fin déterminée, le jugement de beauté implique néanmoins, selon le troisième moment, la représentation de ce que Kant appelle la ___."
        answer: "finalité"
        alt: []
      - id: ea1-l5-p4
        sentence: "Ce concept de finalité, que le jugement de beauté représente sans représenter aucune fin déterminée, s'écrit dans le texte allemand de Kant ___."
        answer: "Zweckmässigkeit"
        alt: []
      - id: ea1-l5-p5
        sentence: "Parce que cette représentation de la finalité ne s'accompagne de l'attribution d'aucune fin, les commentateurs résument souvent la position de Kant par la formule devenue classique : « ___ »."
        answer: "finalité sans fin"
        alt: []
      - id: ea1-l5-p6
        sentence: "Cette formule, « finalité sans fin », s'écrit dans le texte allemand de Kant ___."
        answer: "Zweckmässigkeit ohne Zweck"
        alt: []
      - id: ea1-l5-p7
        sentence: "Kant nomme lui-même cette finalité qui ne repose sur aucune fin déterminée la finalité ___, ou la forme de la finalité."
        answer: "purement formelle"
        alt: ["merement formelle"]
      - id: ea1-l5-p8
        sentence: "Cette finalité purement formelle est perçue, selon Kant, aussi bien dans l'objet lui-même que dans l'activité de deux facultés engagées à son endroit : l'imagination et ___."
        answer: "l'entendement"
        alt: []
      - id: ea1-l5-p9
        sentence: "Le troisième moment, et en particulier ___, constitue le principal fondement textuel de ce que les commentateurs appellent le formalisme esthétique de Kant."
        answer: "le paragraphe 14"
        alt: ["le §14"]

  - id: ea1-l6
    title: "Quatrième moment : la nécessité et le sens commun"
    notes: |
      Le quatrième moment (§§18–22) attribue au jugement de beauté une
      référence à l'idée de **nécessité** : je juge non seulement que chacun
      partagera mon plaisir, mais qu'il __devrait__ le partager. Les
      commentateurs qualifient souvent cette nécessité de *normative*, bien
      que Kant lui-même n'emploie pas ce terme.

      Kant la caractérise plus positivement comme __exemplaire__ (§18) : mon
      jugement lui-même sert d'exemple de la façon dont chacun devrait juger.

      Il la fait reposer sur un **sens commun** (`sensus communis`, §20),
      défini comme un **principe subjectif** qui permet de juger par le
      sentiment plutôt que par des concepts.

      - Comme l'universalité du second moment, cette nécessité ne repose pas
        sur des concepts ou des règles __déterminés__, c'est-à-dire du genre
        qui figure dans la connaissance ordinaire.
    points:
      - id: ea1-l6-p1
        sentence: "Le quatrième moment attribue au jugement de beauté une référence à l'idée de ___ : je juge que chacun devrait partager mon plaisir, non simplement qu'il le partagera en fait."
        answer: "nécessité"
        alt: []
      - id: ea1-l6-p2
        sentence: "Les commentateurs qualifient souvent de ___ cette nécessité propre au jugement de beauté, bien que Kant lui-même n'emploie pas ce terme."
        answer: "normative"
        alt: []
      - id: ea1-l6-p3
        sentence: "Kant caractérise plus positivement cette nécessité en la disant ___, au sens où mon jugement lui-même sert d'exemple de la façon dont chacun devrait juger."
        answer: "exemplaire"
        alt: []
        explanation: "§18, Ak. 5:237."
      - id: ea1-l6-p4
        sentence: "Kant fait reposer cette nécessité sur un ___, défini comme un principe subjectif qui permet de juger par le sentiment plutôt que par des concepts."
        answer: "sens commun"
        alt: []
        explanation: "§20, Ak. 5:238."
      - id: ea1-l6-p5
        sentence: "Ce principe subjectif qui fonde la nécessité du jugement de beauté porte, en latin, le nom de ___."
        answer: "sensus communis"
        alt: []
      - id: ea1-l6-p6
        sentence: "Kant introduit cette notion de sens commun dans le quatrième moment de l'Analytique du beau, ___."
        answer: "au paragraphe 20"
        alt: ["au §20"]
      - id: ea1-l6-p7
        sentence: "Comme l'universalité examinée au second moment, la nécessité du jugement de beauté ne repose pas sur des concepts ou des règles ___, c'est-à-dire du genre qui figure dans la connaissance."
        answer: "déterminés"
        alt: []
