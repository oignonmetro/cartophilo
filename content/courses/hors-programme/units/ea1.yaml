  - id: ea1-l2
    title: "L'unité de la troisième Critique"
    notes: |
      La Critique de la faculté de juger pose **un problème d'unité** : comment
      relier l'esthétique (première partie) et la téléologie (seconde partie),
      et l'une et l'autre à la « faculté de juger » qui donne son titre à
      l'ouvrage entier ?

      Jusque dans les années 1980, plusieurs commentateurs doutaient qu'il
      existe une véritable unité philosophique entre les deux parties.
      Depuis, plusieurs **stratégies concurrentes** cherchent au contraire
      cette unité :

      - relier l'esthétique aux pages de l'introduction sur la recherche d'un
        système de concepts et de lois **empiriques** ;
      - rapprocher **le beau et l'organisme vivant**, mais les commentateurs
        qui suivent cette voie proposent des analogies très différentes entre
        elles ;
      - passer par la **téléologie morale** : la Critique de la faculté de
        juger comblerait le fossé entre la nature et la liberté, l'être humain
        libre et rationnel constituant une fin de la nature.

      *Pour distinguer {teal}les deux premières stratégies{/teal} :
      {teal}la première{/teal} (par les concepts empiriques) explique pourquoi
      juger qu'un objet est beau ressemble à former un concept scientifique ;
      {teal}la seconde{/teal} (par la biologie) explique pourquoi la beauté
      d'un organisme et son fonctionnement vital partagent une même logique,
      mais selon quelle logique exactement, les commentateurs de cette seconde
      voie ne s'accordent pas.*
    points:
      - id: ea1-l2-p1
        sentence: "Par contraste avec la tendance dominante depuis les années 1980 à chercher une unité philosophique entre l'esthétique et la téléologie kantiennes, ce scepticisme sur l'unité de l'ouvrage trouve une expression explicite et ancienne chez ___."
        answer: "Schopenhauer"
        alt: []
        explanation: "Schopenhauer 1819/1859, cité aux côtés de Marc-Wogau (1938) et Beck (1969), qui partagent le même scepticisme."
      - id: ea1-l2-p2
        sentence: "Une clé pour résoudre le problème de l'unité de l'ouvrage consiste à relier l'esthétique kantienne à ses développements, dans l'introduction, sur la recherche d'un système de concepts et de lois ___."
        answer: "empiriques"
        alt: []
      - id: ea1-l2-p3
        sentence: "Parmi les commentateurs qui rapprochent le beau et l'organisme vivant pour unifier l'ouvrage, ___ soutient que la structure interne de l'organisme, où le tout détermine les parties, est analogue à celle du jugement de beauté, où un sentiment de plaisir plutôt qu'un concept fait office de prédicat."
        answer: "Aquila"
        alt: []
        explanation: "Aquila 1992."
      - id: ea1-l2-p4
        sentence: "Contrairement à Aquila, ___ relie plutôt l'esthétique et la biologie kantiennes par l'idée de finalité conçue comme normativité : la normativité du fonctionnement des organismes serait mise en parallèle avec la prétention normative à l'assentiment universel du jugement de beauté."
        answer: "Ginsborg"
        alt: []
        explanation: "Ginsborg 1997a."
      - id: ea1-l2-p5
        sentence: "___ propose un traitement encore différent, et particulièrement détaillé, de ce rapprochement entre le beau et l'organisme, en insistant plutôt sur l'idée de finalité comprise comme unité dans la diversité."
        answer: "Zuckert"
        alt: []
        explanation: "Zuckert 2007a."
      - id: ea1-l2-p6
        sentence: "Une autre approche de l'unité de l'ouvrage passe par la téléologie morale, et s'appuie sur l'idée que la Critique de la faculté de juger doit combler le fossé entre la nature et la ___."
        answer: "liberté"
        alt: []
        explanation: "Introduction II et III, Ak. 5:175–177."
      - id: ea1-l2-p7
        sentence: "L'approche de l'unité de l'ouvrage par la téléologie morale se prolonge, pour ceux qui la défendent, jusqu'à l'idée que l'être humain, comme agent libre et rationnel, constitue une fin de la nature : une thèse pleinement développée dans la partie du livre consacrée à ___."
        answer: "la téléologie"
        alt: []
      - id: ea1-l2-p8
        sentence: "___ défend explicitement l'unité de l'ouvrage par la voie de la téléologie morale, en s'appuyant sur l'idée que l'expérience esthétique révèle l'aptitude de la nature à l'agir moral humain."
        answer: "Gardner"
        alt: []
        explanation: "Gardner 2016 ; une idée également soulignée par Wicks 2007."

  - id: ea1-l3
    title: "Premier moment : le plaisir désintéressé"
    notes: |
      Le premier moment de l'Analytique du beau (§§1–5) définit le jugement de
      goût par sa base : un sentiment, celui du **plaisir** (Kant mentionne
      aussi le déplaisir, mais sans lui donner de rôle central).

      Ce plaisir a un trait distinctif : il est __désintéressé__, c'est-à-dire
      qu'il ne dépend d'aucun désir pour l'objet et n'en suscite aucun.

      Cette double caractéristique (sentiment + désintéressement) permet à
      Kant de distinguer le **jugement de beauté** de trois autres types de
      jugement :
      - le jugement cognitif (« cet objet est vert ») : fondé sur une
        sensation objective, non sur un sentiment.
      - **le jugement de l'agréable** (aimer un mets, une boisson) : fondé sur
        un sentiment, mais {coral}intéressé{/coral}.
      - **le jugement du bien** (bonté morale, ou bonté relative à une fin non
        morale) : fondé sur un {coral}intérêt{/coral} lui aussi.

      Ce qui caractérise un jugement esthétique, par opposition à un jugement logique de connaissance, c'est qu'il ne renseigne pas sur la nature de l'objet, mais renvoie à l'**état d'esprit du sujet** : « Ce qui est simplement subjectif dans la représentation d'un objet, c'est-à-dire ce qui constitue sa relation au sujet et non à l'objet, c'est sa nature esthétique. »

      Le premier moment, celui de la **qualité**, se conclut par une définition : « Le goût est la faculté de juger d'un objet ou d'un mode de représentation, *sans aucun intérêt*, par une satisfaction ou une insatisfaction. On appelle *beau* l'objet d'une telle satisfaction » (§5). L'**intérêt**, c'est « la satisfaction que nous lions avec la représentation de l'existence d'un objet » (§2) : il a toujours rapport à la faculté de désirer.

      Juger esthétiquement, c'est donc être indifférent à l'existence de l'objet : le collectionneur, qui désire posséder, n'entretient pas de relation esthétique pure. Seul compte « ce que je découvre en moi en fonction de cette représentation », d'où « l'unique satisfaction libre ». Kant appelle ce libre plaisir une « **faveur** » : la chose me fait la faveur d'être là, et cette faveur, commente Marc Sherringham, me donne la grâce de la laisser être pour elle-même.

      ! Le désintéressement ne signifie pas indifférence : il signifie
      seulement que le plaisir ne dépend pas de vouloir posséder ou consommer
      l'objet.
    points:
      - id: ea1-l3-p1
        sentence: "Les jugements de beauté reposent, selon le premier des quatre moments de leur analyse kantienne, sur un sentiment plutôt que sur une connaissance : plus précisément sur le sentiment de ___ (Kant mentionne aussi le déplaisir, mais sans lui donner de rôle central dans son compte rendu)."
        answer: "plaisir"
        alt: []
      - id: ea1-l3-p2
        sentence: "Le plaisir propre au jugement de beauté est qualifié par Kant de ___, ce qui signifie qu'il ne dépend d'aucun désir pour l'objet et n'en suscite aucun."
        answer: "désintéressé"
        alt: ["désintéressée"]
      - id: ea1-l3-p3
        sentence: "Ce qui distingue un jugement de beauté, fondé sur un sentiment, d'un jugement cognitif comme « cet objet est vert », c'est que ce dernier est fondé sur une ___ objective, par exemple la sensation de couleur."
        answer: "sensation"
        alt: []
      - id: ea1-l3-p4
        sentence: "Par opposition au jugement de beauté, le jugement qui se borne à déclarer qu'on aime quelque chose ou qu'on le trouve plaisant (par exemple un mets ou une boisson) est nommé par Kant jugement de l'___."
