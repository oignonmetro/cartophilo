  - id: ea1-l6
    title: "Quatrième moment : la nécessité et le sens commun"
    notes: |
      Le quatrième moment ({sky}§§18–22{/sky}) attribue au jugement de beauté une référence à l'idée de {green}**nécessité**{/green} : je juge {pink}non seulement que chacun partagera mon plaisir{/pink}, mais {green}qu'il __devrait__ le partager{/green}. Les commentateurs qualifient souvent cette nécessité de {violet}*normative*{/violet}, bien que Kant lui-même n'emploie pas ce terme.

      Kant la caractérise plus positivement comme {violet}__exemplaire__{/violet} (§18) : {coral}mon jugement lui-même sert d'exemple de la façon dont chacun devrait juger{/coral}.

      Il la fait reposer sur un {violet}**sens commun**{/violet} ({blue}*sensus communis*{/blue}, §20), défini comme un {amber}**principe subjectif**{/amber} qui permet de {amber}juger par le sentiment plutôt que par des concepts{/amber}.

      - Comme l'universalité du second moment, cette nécessité {red}ne repose pas sur des concepts ou des règles __déterminés__{/red}, c'est-à-dire du genre qui figure dans la connaissance ordinaire.

      La formule du quatrième moment : {teal}« {/teal}Est {teal}*beau* ce qui est reconnu sans concept{/teal} comme objet d'une {teal}satisfaction nécessaire »{/teal} (§22). Est beau {amber}ce dont on se dit que chacun devrait le trouver beau{/amber} ; cette nécessité suppose {coral}un fondement subjectif universel dans l'esprit du sujet{/coral}. Le jugement de goût n'est donc qu'{violet}exemplaire{/violet} : il ne peut être que {coral}l'exemple d'une règle universelle impossible à énoncer{/coral}.
