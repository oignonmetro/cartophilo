  - id: ea1-l5
    title: "Troisième moment : la finalité sans fin"
    notes: |
      Le troisième moment ({sky}§§10–17{/sky}) explique que le jugement de beauté {red}n'implique la représentation d'aucune{/red} {violet}**fin**{/violet} [{blue}*Zweck*{/blue}] {red}déterminée{/red} que l'objet serait censé satisfaire, à la différence du {pink}jugement du bien{/pink}.

      Il implique pourtant la représentation d'une {green}**finalité**{/green} [{blue}*Zweckmässigkeit*{/blue}]. Comme cette finalité ne s'accompagne d'aucune fin assignée, on résume la position de Kant par la formule devenue classique : « {violet}**finalité sans fin**{/violet} » [{blue}*Zweckmässigkeit ohne Zweck*{/blue}].

      Kant la nomme lui-même finalité {amber}*purement formelle*{/amber}, ou {amber}forme de la finalité{/amber} : elle se perçoit à la fois {coral}dans l'objet{/coral} et {coral}dans l'activité de deux facultés, l'imagination et l'entendement{/coral}, engagées à son endroit (le détail de cette activité, le « {violet}libre jeu{/violet} », fait l'objet de la déduction du jugement de goût, voir l'unité suivante).

      La formule du troisième moment : {teal}« {/teal}La {teal}*beauté* est la forme de la *finalité*{/teal} d'un objet en tant qu'elle est perçue en celui-ci {teal}sans *représentation d'une fin* »{/teal} (§17). La {violet}**forme de la finalité**{/violet} est {amber}la relation intentionnelle qu'on suppose être la cause de l'existence d'un objet{/amber} : {teal}« {/teal}La {teal}causalité d'un concept{/teal} par rapport à son objet {teal}est la finalité{/teal} ({blue}*forma finalis*{/blue}){teal} »{/teal} (§10). L'intention produit l'objet en posant son concept comme le {amber}**but à atteindre**{/amber} par la mise en œuvre des moyens appropriés : c'est très exactement la {violet}**cause finale**{/violet} d'{sky}Aristote{/sky}.

      Est beau ce qui {green}donne l'impression d'avoir été produit selon une intention{/green}, {red}sans que le concept de la chose revienne{/red} : sinon, juger reviendrait à {pink}comparer l'objet à son concept{/pink}, et {sky}Platon{/sky} aurait raison. D'où : {teal}« {/teal}le jugement de goût est {teal}entièrement indépendant du concept de perfection »{/teal} (§15). {sky}Marc Sherringham{/sky} résume : est purement beau {coral}ce qui manifeste une intention pure dont l'origine reste inconnaissable{/coral}.

      ! Le {sky}paragraphe 14{/sky} est le principal fondement textuel de ce que les commentateurs appellent le {violet}**formalisme**{/violet} esthétique de Kant : l'idée que {amber}seule la forme (l'agencement spatial ou temporel des éléments){/amber} compterait pour l'appréciation esthétique.
