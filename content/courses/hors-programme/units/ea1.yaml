  - id: ea1-l6
    title: "Quatrième moment : la nécessité et le sens commun"
    notes: |
      Le quatrième moment (§§18–22) attribue au jugement de beauté une
      référence à l'idée de **nécessité** : je juge non seulement que chacun
      partagera mon plaisir, mais qu'il __devrait__ le partager. Les
      commentateurs qualifient souvent cette nécessité de *normative*, bien
      que Kant lui-même n'emploie pas ce terme.

      Kant la caractérise plus positivement comme __exemplaire__ (§18) : mon
      jugement lui-même sert d'exemple de la façon dont chacun devrait juger.

      Il la fait reposer sur un **sens commun** (`sensus communis`, §20),
      défini comme un **principe subjectif** qui permet de juger par le
      sentiment plutôt que par des concepts.

      - Comme l'universalité du second moment, cette nécessité ne repose pas
        sur des concepts ou des règles __déterminés__, c'est-à-dire du genre
        qui figure dans la connaissance ordinaire.

      La formule du quatrième moment : « Est *beau* ce qui est reconnu sans concept comme objet d'une satisfaction nécessaire » (§22). Est beau ce dont on se dit que chacun devrait le trouver beau ; cette nécessité suppose un fondement subjectif universel dans l'esprit du sujet. Le jugement de goût n'est donc qu'exemplaire : il ne peut être que l'exemple d'une règle universelle impossible à énoncer.
