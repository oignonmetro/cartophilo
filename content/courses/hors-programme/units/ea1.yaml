  - id: ea1-l7
    title: "Le quadruple paradoxe du beau"
    notes: |
      {sky}Marc Sherringham{/sky} résume la définition critique du beau par un {violet}**quadruple paradoxe**{/violet}, un par moment :

      | Moment | Le beau est | Ce qui est nié |
      | qualité | une satisfaction sans intérêt | l'intérêt |
      | quantité | une universalité sans concept | le concept |
      | relation | une finalité sans fin | la fin |
      | modalité | une nécessité sans loi | la loi |

      Les quatre notions niées ({red}l'intérêt, le concept, la fin et la loi{/red}) redonnent très précisément la **définition classique** du beau. Kant n'en fait pas une simple négation : il {red}abandonne le *contenu*{/red} de l'esthétique classique, {red}le désir et la connaissance{/red}, tout en {green}maintenant sa *forme*{/green} : {green}l'universalité, la nécessité, la finalité, le plaisir{/green}.

      Les moments s'articulent deux par deux. {amber}Les moments un et trois{/amber} disent que le jugement esthétique {red}n'est pas une espèce du **désir**{/red} : « le désir joue à désirer, sans rien désirer du tout ». {amber}Les moments deux et quatre{/amber} disent qu'il {red}n'est pas une espèce de **connaissance**{/red} : c'est {coral}un jugement de connaissance vide, et par là même libre{/coral}. D'où un « libre jeu où l'on fait comme si l'on désirait et comme si l'on connaissait, mais où l'on ne désire rien et où l'on ne connaît rien ».

      ! Le paradoxe {red}n'est pas une contradiction{/red} : {green}chaque moment garde la forme d'une notion classique en en retirant le contenu{/green}.
    points:
      - id: ea1-l7-p1
        sentence: "Selon le paradigme critique, le beau est d'abord, __du point de vue de la **qualité**, une satisfaction__ ___."
        answer: "sans intérêt"
        alt: []
      - id: ea1-l7-p2
        sentence: "Du point de vue de la **quantité**, __le beau est une universalité__ ___."
        answer: "sans concept"
        alt: []
      - id: ea1-l7-p3
        sentence: "Du point de vue de la **relation**, __le beau est une finalité__ ___."
        answer: "sans fin"
