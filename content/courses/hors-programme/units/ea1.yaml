id: ea1
title: "Le jugement de goût : les quatre moments du beau"
subtitle: "La faculté de juger, l'unité de la troisième Critique, et l'Analytique du beau"
icon: palette
color: violet
group: "Kant : l'esthétique"
lessons:
  - id: ea1-l1
    title: "La faculté de juger, déterminante et réfléchissante"
    notes: |
      Kant ouvre sa réflexion sur l'{violet}esthétique{/violet} et la {violet}téléologie{/violet} par un examen de **la** {violet}**faculté de juger**{/violet} [{blue}*Urteilskraft*{/blue}], qu'il définit comme {amber}la capacité de penser le particulier comme contenu sous l'universel{/amber}.

      Deux rôles s'y distinguent :
      - rôle {violet}__déterminant__{/violet} ({blue}*bestimmend*{/blue}) : {amber}un universel (un concept) est déjà donné{/amber}, il s'agit seulement d'y subsumer un particulier : c'est le rôle que la {sky}*Critique de la raison pure*{/sky} attribuait déjà à la faculté de juger.
      - rôle {violet}__réfléchissant__{/violet} ({blue}*reflektierend*{/blue}) : {amber}seul le particulier est donné{/amber}, il faut lui trouver l'universel qui convient. C'est la tâche la plus originale de la troisième *Critique*.

      Ce n'est que dans la *Critique de la faculté de juger* que Kant traite le jugement comme {green}**une faculté à part entière**{/green}, {coral}dotée de son principe{/coral} {blue}*a priori*{/blue} {coral}propre{/coral}.

      À la faculté de juger réfléchissante, Kant attribue plusieurs tâches : {amber}classer les êtres naturels en genres et en espèces{/amber}, {amber}construire des théories scientifiques systématiques{/amber}, et même {amber}former tous nos concepts empiriques{/amber}. Mais surtout, elle produit deux types de jugements spécifiques, objets de toute la suite de l'ouvrage : les {violet}**jugements esthétiques**{/violet} (beau, sublime) et les {violet}**jugements téléologiques**{/violet} (attribution de fins à la nature).

      Le substantif de « subsumer » est la {violet}**subsomption**{/violet} : {amber}faire rentrer le particulier sous l'universel{/amber}, ce que fait le jugement de connaissance, déterminant. Le jugement de goût, lui, {red}n'est pas déterminant{/red} mais {green}**réfléchissant**{/green} : {coral}une réflexion du sujet sur le fonctionnement de son propre esprit{/coral}, qui ne se rapporte qu'indirectement à l'objet.

      ! Kant réserve un statut privilégié aux jugements portant sur la beauté {green}__naturelle__{/green} ({pink}non celle de l'art{/pink}) : c'est en eux, dit-il, que {coral}la faculté de juger se révèle comme ayant son principe propre{/coral}.
    points:
      - id: ea1-l1-p1
        sentence: "__Kant ouvre son enquête sur l'esthétique et la téléologie en la présentant comme partie d'une réflexion plus large sur__ ___, la faculté de **penser le particulier comme contenu sous l'universel**, dont l'examen occupe toute la troisième Critique."
        answer: "la faculté de juger"
        alt: []
        explanation: "Introduction IV, Ak. 5:179."
      - id: ea1-l1-p2
        sentence: "__Kant emploie pour **cette faculté** le terme allemand__ ___, qui donne son titre à l'ouvrage entier (Kritik der Urteilskraft)."
        answer: "Urteilskraft"
        alt: []
      - id: ea1-l1-p3
        sentence: "Quand la faculté de juger **reçoit un universel déjà donné** et se contente d'y subsumer un particulier (comme dans la Critique de la raison pure), __elle exerce son rôle__ ___."
        answer: "déterminant"
        alt: []
      - id: ea1-l1-p4
        sentence: "Ce premier rôle de la faculté de juger, **celui qui subsume un particulier sous un universel déjà donné**, __porte en allemand le nom de__ ___."
        answer: "bestimmend"
        alt: []
      - id: ea1-l1-p5
        sentence: "Quand au contraire **seul le particulier est donné** et qu'il revient à la faculté de juger de lui trouver l'universel adéquat (sa tâche la plus distinctive dans la troisième Critique), __elle exerce son rôle__ ___."
        answer: "réfléchissant"
        alt: []
      - id: ea1-l1-p6
        sentence: "Ce second rôle de la faculté de juger, **celui qui cherche l'universel pour un particulier donné**, __porte en allemand le nom de__ ___."
        answer: "reflektierend"
        alt: []
      - id: ea1-l1-p7
        sentence: "__Kant introduit ce partage entre **rôle déterminant** et **rôle réfléchissant**__ de la faculté de juger dans la Critique de la faculté de juger, ___, avant même d'aborder l'esthétique proprement dite."
        answer: "à la section IV de l'introduction"
        alt: ["dans la section IV de l'introduction"]
        explanation: "Introduction IV, Ak. 5:179 ; voir aussi FI V, Ak. 20:211."
      - id: ea1-l1-p8
        sentence: "Bien que la Critique de la raison pure comporte déjà une brève discussion de la faculté de juger, __ce n'est que dans ___ que Kant en fait **une faculté à part entière**__, dotée de son propre principe *a priori* et nécessitant sa propre critique."
        answer: "la Critique de la faculté de juger"
        alt: []
      - id: ea1-l1-p9
        sentence: "Outre les jugements esthétiques et téléologiques, Kant attribue à la **faculté de juger réfléchissante** la tâche cognitive de classer les êtres naturels en une hiérarchie de genres et d'espèces, __et de construire des théories scientifiques explicatives et__ ___, où des lois plus particulières se rangent sous des lois plus générales."
        answer: "systématiques"
        alt: []
      - id: ea1-l1-p10
        sentence: "Plus fondamentalement encore, Kant fait de la **faculté de juger réfléchissante** __la condition de la formation de tous les concepts__ ___, et de la possibilité même de considérer la nature comme légale d'un point de vue empirique."
        answer: "empiriques"
        alt: []
      - id: ea1-l1-p11
        sentence: "Kant assigne à la faculté de juger réfléchissante **deux tâches spécifiques**, distinctes de ses tâches cognitives générales : produire des jugements esthétiques, portant sur le beau et le sublime, __et produire des jugements ___, qui attribuent des fins aux choses de la nature__."
        answer: "téléologiques"
        alt: []
      - id: ea1-l1-p12
        sentence: "Kant réserve un **rôle privilégié** à un sous-ensemble particulier des jugements esthétiques : __c'est dans les jugements portant sur la beauté__ ___ (non celle de l'art) que la faculté de juger se révèle selon lui comme une faculté dotée de son principe propre."
        answer: "naturelle"
        alt: []
        explanation: "FI XI, Ak. 20:244."
      - id: ea1-l1-p13
        sentence: "**Faire rentrer le particulier sous l'universel**, c'est le subsumer : __l'acte correspondant se nomme la__ ___."
        answer: "subsomption"
        alt: ["la subsomption"]
      - id: ea1-l1-p14
        sentence: "À la différence du jugement de connaissance, qui subsume, __le **jugement de goût** n'est pas déterminant mais__ ___ : une réflexion du sujet sur le fonctionnement de son propre esprit, qui ne se rapporte qu'indirectement à l'objet."
        answer: "réfléchissant"
        alt: []

  - id: ea1-l2
    title: "L'unité de la troisième Critique"
    notes: |
      La *Critique de la faculté de juger* pose {red}**un problème d'unité**{/red} : comment relier l'{sky}esthétique (première partie){/sky} et la {sky}téléologie (seconde partie){/sky}, et l'une et l'autre à la « faculté de juger » qui donne son titre à l'ouvrage entier ?

      Jusque dans les années 1980, plusieurs commentateurs {pink}doutaient qu'il existe une véritable unité philosophique{/pink} entre les deux parties. Depuis, plusieurs **stratégies concurrentes** cherchent au contraire cette unité :

      - relier l'esthétique aux pages de l'introduction sur la recherche d'un {amber}système de concepts et de lois **empiriques**{/amber} ;
      - rapprocher {amber}**le beau et l'organisme vivant**{/amber}, mais les commentateurs qui suivent cette voie proposent des analogies très différentes entre elles ;
      - passer par la {amber}**téléologie morale**{/amber} : la *Critique de la faculté de juger* comblerait {coral}le fossé entre la nature et la liberté{/coral}, l'être humain libre et rationnel constituant une fin de la nature.

      *Pour distinguer {amber}les deux premières stratégies{/amber} : {amber}la première{/amber} (par les concepts empiriques) explique pourquoi {coral}juger qu'un objet est beau ressemble à former un concept scientifique{/coral} ; {amber}la seconde{/amber} (par la biologie) explique pourquoi {coral}la beauté d'un organisme et son fonctionnement vital partagent une même logique{/coral}, mais selon quelle logique exactement, {pink}les commentateurs de cette seconde voie ne s'accordent pas{/pink}.*
    points:
      - id: ea1-l2-p1
        sentence: "Par contraste avec la tendance dominante depuis les années 1980 à chercher une unité philosophique entre l'esthétique et la téléologie kantiennes, __ce **scepticisme sur l'unité de l'ouvrage** trouve une expression explicite et ancienne chez__ ___."
        answer: "Schopenhauer"
        alt: []
        explanation: "Schopenhauer 1819/1859, cité aux côtés de Marc-Wogau (1938) et Beck (1969), qui partagent le même scepticisme."
      - id: ea1-l2-p2
        sentence: "Une clé pour résoudre le **problème de l'unité de l'ouvrage** consiste à relier l'esthétique kantienne à ses développements, dans l'introduction, __sur la recherche d'un système de concepts et de lois__ ___."
        answer: "empiriques"
        alt: []
      - id: ea1-l2-p3
        sentence: "__Parmi les commentateurs qui rapprochent le beau et l'organisme vivant pour unifier l'ouvrage,__ ___ soutient que la structure interne de l'organisme, où **le tout détermine les parties**, est analogue à celle du jugement de beauté, où un sentiment de plaisir plutôt qu'un concept fait office de prédicat."
        answer: "Aquila"
        alt: []
        explanation: "Aquila 1992."
      - id: ea1-l2-p4
        sentence: "Contrairement à Aquila, ___ __relie plutôt l'esthétique et la biologie kantiennes par l'idée de **finalité conçue comme normativité**__ : la normativité du fonctionnement des organismes serait mise en parallèle avec la prétention normative à l'assentiment universel du jugement de beauté."
        answer: "Ginsborg"
        alt: []
        explanation: "Ginsborg 1997a."
      - id: ea1-l2-p5
        sentence: "___ __propose un traitement encore différent, et particulièrement détaillé__, de ce rapprochement entre le beau et l'organisme, en insistant plutôt sur l'idée de finalité comprise comme **unité dans la diversité**."
        answer: "Zuckert"
        alt: []
        explanation: "Zuckert 2007a."
      - id: ea1-l2-p6
        sentence: "Une autre approche de l'unité de l'ouvrage passe par la **téléologie morale**, et s'appuie sur l'idée que la Critique de la faculté de juger __doit combler le fossé entre la nature et la__ ___."
        answer: "liberté"
        alt: []
        explanation: "Introduction II et III, Ak. 5:175–177."
      - id: ea1-l2-p7
        sentence: "L'approche de l'unité de l'ouvrage par la téléologie morale se prolonge, pour ceux qui la défendent, jusqu'à l'idée que l'être humain, comme agent libre et rationnel, constitue **une fin de la nature** : __une thèse pleinement développée dans la partie du livre consacrée à__ ___."
        answer: "la téléologie"
        alt: []
      - id: ea1-l2-p8
        sentence: "___ __défend explicitement l'unité de l'ouvrage par la voie de la téléologie morale__, en s'appuyant sur l'idée que l'expérience esthétique révèle **l'aptitude de la nature à l'agir moral humain**."
        answer: "Gardner"
        alt: []
        explanation: "Gardner 2016 ; une idée également soulignée par Wicks 2007."

  - id: ea1-l3
    title: "Premier moment : le plaisir désintéressé"
    notes: |
      Le premier moment de l'{sky}Analytique du beau (§§1–5){/sky} définit le jugement de goût par sa base : un {violet}sentiment{/violet}, celui du {green}**plaisir**{/green} (Kant mentionne aussi le déplaisir, mais sans lui donner de rôle central).

      Ce plaisir a un trait distinctif : il est {green}__désintéressé__{/green}, c'est-à-dire {amber}qu'il ne dépend d'aucun désir pour l'objet et n'en suscite aucun{/amber}.

      Cette double caractéristique (sentiment + désintéressement) permet à Kant de distinguer le {violet}**jugement de beauté**{/violet} de trois autres types de jugement :
      - le {pink}jugement cognitif{/pink} ({yellow}« cet objet est vert »{/yellow}) : fondé sur une {red}sensation objective{/red}, non sur un sentiment.
      - {pink}**le jugement de l'agréable**{/pink} ({yellow}aimer un mets, une boisson{/yellow}) : fondé sur un sentiment, mais {red}intéressé{/red}.
      - {pink}**le jugement du bien**{/pink} (bonté morale, ou bonté relative à une fin non morale) : fondé sur un {red}intérêt{/red} lui aussi.

      Ce qui caractérise un jugement esthétique, par opposition à un {pink}jugement logique de connaissance{/pink}, c'est qu'il {red}ne renseigne pas sur la nature de l'objet{/red}, mais renvoie à l'{green}**état d'esprit du sujet**{/green} : {teal}« {/teal}Ce qui est simplement {teal}subjectif{/teal} dans la représentation d'un objet, c'est-à-dire ce qui constitue {teal}sa relation au sujet et non à l'objet{/teal}, c'est {teal}sa nature esthétique. »{/teal}

      Le premier moment, celui de la {violet}**qualité**{/violet}, se conclut par une définition : {teal}« {/teal}Le {teal}goût{/teal} est la faculté de juger d'un objet ou d'un mode de représentation, {teal}*sans aucun intérêt*{/teal}, par une satisfaction ou une insatisfaction. On appelle {teal}*beau* l'objet d'une telle satisfaction »{/teal} (§5). L'{violet}**intérêt**{/violet}, c'est {teal}« {/teal}la satisfaction que nous lions avec {teal}la représentation de l'existence d'un objet »{/teal} (§2) : il a toujours rapport à la {violet}faculté de désirer{/violet}.

      Juger esthétiquement, c'est donc {green}être indifférent à l'existence de l'objet{/green} : le {yellow}collectionneur{/yellow}, qui {red}désire posséder{/red}, n'entretient pas de relation esthétique pure. Seul compte {teal}« {/teal}ce que je découvre {teal}en moi{/teal} en fonction de {teal}cette représentation »{/teal}, d'où {teal}« {/teal}l'unique {teal}satisfaction libre »{/teal}. Kant appelle ce libre plaisir une {teal}« {/teal}{violet}**faveur**{/violet}{teal} »{/teal} : {coral}la chose me fait la faveur d'être là{/coral}, et cette faveur, commente {sky}Marc Sherringham{/sky}, me donne la grâce de {coral}la laisser être pour elle-même{/coral}.

      ! Le désintéressement {red}ne signifie pas indifférence{/red} : il signifie seulement que {green}le plaisir ne dépend pas de vouloir posséder ou consommer l'objet{/green}.
    points:
      - id: ea1-l3-p1
        sentence: "Les jugements de beauté reposent, selon le premier des quatre moments de leur analyse kantienne, **sur un sentiment plutôt que sur une connaissance** : __plus précisément sur le sentiment de__ ___ (Kant mentionne aussi le déplaisir, mais sans lui donner de rôle central dans son compte rendu)."
        answer: "plaisir"
        alt: []
      - id: ea1-l3-p2
        sentence: "__Le plaisir propre au jugement de beauté est qualifié par Kant de__ ___, ce qui signifie qu'il **ne dépend d'aucun désir pour l'objet** et n'en suscite aucun."
        answer: "désintéressé"
        alt: ["désintéressée"]
      - id: ea1-l3-p3
        sentence: "Ce qui distingue un jugement de beauté, fondé sur un sentiment, d'un **jugement cognitif** comme « cet objet est vert », __c'est que ce dernier est fondé sur une__ ___ objective, par exemple la sensation de couleur."
        answer: "sensation"
        alt: []
      - id: ea1-l3-p4
        sentence: "Par opposition au jugement de beauté, le jugement qui se borne à déclarer qu'**on aime quelque chose ou qu'on le trouve plaisant** (par exemple un mets ou une boisson) __est nommé par Kant jugement de l'__ ___."
        answer: "agréable"
        alt: []
      - id: ea1-l3-p5
        sentence: "Kant distingue enfin le jugement de beauté du jugement portant sur la **bonté d'une chose**, qu'il s'agisse de sa bonté morale ou de sa bonté relative à une fin non morale : __ce second type de jugement est le jugement du__ ___."
        answer: "bien"
        alt: []
      - id: ea1-l3-p6
        sentence: "__Kant développe l'analyse de ce **premier des quatre moments** du jugement de beauté au tout début de l'Analytique du beau__, ___, avant d'aborder l'universalité du jugement de goût au moment suivant."
        answer: "aux paragraphes 1 à 5"
        alt: ["dans les paragraphes 1 à 5", "aux §§1-5"]
      - id: ea1-l3-p7
        sentence: "Un jugement esthétique **ne renseigne pas sur la nature de l'objet** : __il renvoie à l'__ ___ du sujet."
        answer: "état d'esprit"
        alt: []
      - id: ea1-l3-p8
        sentence: "« Ce qui est **simplement subjectif** dans la représentation d'un objet, c'est-à-dire ce qui constitue sa relation au sujet et non à l'objet, __c'est sa__ ___. »"
        answer: "nature esthétique"
        alt: []
      - id: ea1-l3-p9
        sentence: "« __Le **goût** est la faculté de juger d'un objet ou d'un mode de représentation,__ ___, par une satisfaction ou une insatisfaction. On appelle beau l'objet d'une telle satisfaction. »"
        answer: "sans aucun intérêt"
        alt: []
        explanation: "§5 : définition du beau tirée du premier moment, selon la qualité."
      - id: ea1-l3-p10
        sentence: "« Le goût est la faculté de juger d'un objet ou d'un mode de représentation, **sans aucun intérêt**, par une satisfaction ou une insatisfaction. __On appelle beau__ ___. »"
        answer: "l'objet d'une telle satisfaction"
        alt: []
        explanation: "§5."
      - id: ea1-l3-p11
        sentence: "« __On nomme **intérêt** la satisfaction que nous lions avec__ ___. Elle a donc toujours une relation avec la faculté de désirer, que celle-ci soit son principe déterminant, ou soit nécessairement liée à celui-ci. »"
        answer: "la représentation de l'existence d'un objet"
        alt: []
        explanation: "§2."
      - id: ea1-l3-p12
        sentence: "« On nomme **intérêt** la satisfaction que nous lions avec la représentation de l'existence d'un objet. __Elle a donc toujours une relation avec__ ___, que celle-ci soit son principe déterminant, ou soit nécessairement liée à celui-ci. »"
        answer: "la faculté de désirer"
        alt: []
        explanation: "§2."
      - id: ea1-l3-p13
        sentence: "**Juger esthétiquement** exclut de rapporter l'objet à ma faculté de désirer ; __ce qui importe, c'est__ « ___, et non ce par quoi je dépends de l'existence de l'objet »."
        answer: "ce que je découvre en moi en fonction de cette représentation"
        alt: []
        explanation: "§2."
      - id: ea1-l3-p14
        sentence: "Parce qu'elle **n'est liée à aucun désir de l'existence de l'objet**, __la satisfaction esthétique est__ « l'unique satisfaction ___ »."
        answer: "libre"
        alt: []
        explanation: "§5."
      - id: ea1-l3-p15
        sentence: "__Kant appelle ___ le **libre plaisir du beau**__ : la chose me fait, pour ainsi dire, la grâce d'être là."
        answer: "faveur"
        alt: ["la faveur", "une faveur"]
        explanation: "§5."
      - id: ea1-l3-p16
        sentence: "Selon Marc Sherringham, la **faveur de la chose**, __dont je bénéficie__ ___, s'accompagne en moi d'un état d'esprit favorable."
        answer: "gratuitement"
        alt: []
      - id: ea1-l3-p17
        sentence: "Selon Marc Sherringham, la **faveur de la chose** __me donne la grâce de la laisser__ ___."
        answer: "être pour elle-même"
        alt: []
      - id: ea1-l3-p18
        sentence: "Dans le plaisir esthétique, selon Sherringham, __la chose n'existe__ ___ : elle n'est **ni un moyen ni un but pour ma volonté**."
        answer: "pas pour moi"
        alt: []
      - id: ea1-l3-p19
        sentence: "À la **faveur de la chose qui se donne** __répond en moi, selon Sherringham, un__ ___, qui me fait rendre grâce."
        answer: "état de grâce"
        alt: []
      - id: ea1-l3-p20
        sentence: "L'**état de grâce** que suscite la faveur de la chose __me fait rendre grâce et me délivre de tout__ ___ pour la chose."
        answer: "désir"
        alt: []
  - id: ea1-l3b
    title: "L'agréable, l'utile et le bon"
    notes: |
      Le critère de l'{violet}**intérêt**{/violet} sépare la {green}pure satisfaction esthétique{/green} des trois autres espèces de satisfaction : l'{pink}agréable{/pink}, l'{pink}utile{/pink} et le {pink}bon{/pink}.

      {teal}« {/teal}Est {teal}**agréable** ce qui plaît aux sens dans la sensation »{/teal} (§3). La {violet}sensibilité{/violet} est {amber}réceptivité{/amber} : {coral}pas d'agrément sans la présence de l'objet{/coral}. Le plaisir de la sensation dépend donc entièrement de l'{coral}existence présente de l'objet{/coral}, et comme tout plaisir tend à sa propre conservation, il pousse à prolonger ou à renouveler le contact avec lui : {teal}« {/teal}un objet que je déclare agréable [...] suscite par la sensation {teal}un désir pour les objets semblables »{/teal}. L'agréable est lié à une satisfaction sensible {red}**nécessairement intéressée**{/red}, où la {violet}faculté de désirer inférieure{/violet} joue le rôle déterminant.

      L'utile et le bon sont {red}eux aussi intéressés{/red}, mais ils supposent la réflexion sur des {violet}**concepts**{/violet} (§4) :

      | | Ce qui plaît | Ce que nous voulons de son existence |
      | l'utile, « bon à quelque chose » | ce qui ne plaît qu'à titre de moyen | un moyen à utiliser |
      | le bon en soi | ce qui plaît par lui-même | un but à atteindre |

      Dans les deux cas, {teal}« {/teal}il y a toujours {teal}le concept d'un but »{/teal}, donc {coral}un intérêt{/coral}.

      ! Passer par la raison {red}ne rend pas l'utile ou le bon esthétiques{/red} : {coral}ils restent liés à la faculté de désirer{/coral}.
    points:
      - id: ea1-l3b-p1
        sentence: "« __Est **agréable** ce qui plaît__ ___ dans la sensation. »"
        answer: "aux sens"
        alt: []
        explanation: "§3."
      - id: ea1-l3b-p2
        sentence: "Le **plaisir de la sensation** __dépend entièrement de l'__ ___ présente d'un objet ; comme tout plaisir tend à sa propre conservation, il pousse à renouveler le contact avec lui."
        answer: "existence"
        alt: []
      - id: ea1-l3b-p3
        sentence: "« un objet que je déclare **agréable** [...] __suscite par la sensation__ ___ »"
        answer: "un désir pour les objets semblables"
        alt: []
        explanation: "§3."
      - id: ea1-l3b-p4
        sentence: "Ce qui est **agréable** __est lié à un sentiment de satisfaction sensible__ ___ : ce n'est pas une satisfaction esthétique."
        answer: "nécessairement intéressée"
        alt: ["intéressée"]
