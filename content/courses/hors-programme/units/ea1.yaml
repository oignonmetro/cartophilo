  - id: ea1-l7
    title: "Le quadruple paradoxe du beau"
    notes: |
      Marc Sherringham résume la définition critique du beau par un **quadruple paradoxe**, un par moment :

      | Moment | Le beau est | Ce qui est nié |
      | qualité | une satisfaction sans intérêt | l'intérêt |
      | quantité | une universalité sans concept | le concept |
      | relation | une finalité sans fin | la fin |
      | modalité | une nécessité sans loi | la loi |

      Les quatre notions niées (l'intérêt, le concept, la fin et la loi) redonnent très précisément la **définition classique** du beau. Kant n'en fait pas une simple négation : il abandonne le *contenu* de l'esthétique classique, le désir et la connaissance, tout en maintenant sa *forme* : l'universalité, la nécessité, la finalité, le plaisir.

      Les moments s'articulent deux par deux. Les moments un et trois disent que le jugement esthétique n'est pas une espèce du **désir** : « le désir joue à désirer, sans rien désirer du tout ». Les moments deux et quatre disent qu'il n'est pas une espèce de **connaissance** : c'est un jugement de connaissance vide, et par là même libre. D'où un « libre jeu où l'on fait comme si l'on désirait et comme si l'on connaissait, mais où l'on ne désire rien et où l'on ne connaît rien ».

      ! Le paradoxe n'est pas une contradiction : chaque moment garde la forme d'une notion classique en en retirant le contenu.
