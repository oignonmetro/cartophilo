id: ea1
title: "Le jugement de goût : les quatre moments du beau"
subtitle: "La faculté de juger, l'unité de la troisième Critique, et l'Analytique du beau"
icon: palette
color: violet
group: "Kant : l'esthétique"
lessons:
  - id: ea1-l1
    title: "La faculté de juger, déterminante et réfléchissante"
    notes: |
      Kant ouvre sa réflexion sur l'esthétique et la téléologie par un examen de
      **la faculté de juger** [`Urteilskraft`], qu'il définit comme la capacité
      de penser le particulier comme contenu sous l'universel.

      Deux rôles s'y distinguent :
      - rôle __déterminant__ (`bestimmend`) : un universel (un concept) est déjà
        donné, il s'agit seulement d'y subsumer un particulier : c'est le rôle
        que la Critique de la raison pure attribuait déjà à la faculté de juger.
      - rôle __réfléchissant__ (`reflektierend`) : seul le particulier est
        donné, il faut lui trouver l'universel qui convient. C'est la tâche la
        plus originale de la troisième Critique.

      Ce n'est que dans la Critique de la faculté de juger que Kant traite le
      jugement comme **une faculté à part entière**, dotée de son principe a
      priori propre.

      À la faculté de juger réfléchissante, Kant attribue plusieurs tâches :
      classer les êtres naturels en genres et en espèces, construire des
      théories scientifiques systématiques, et même former tous nos concepts
      empiriques. Mais surtout, elle produit deux types de jugements
      spécifiques, objets de toute la suite de l'ouvrage : les **jugements
      esthétiques** (beau, sublime) et les **jugements téléologiques**
      (attribution de fins à la nature).

      Le substantif de « subsumer » est la **subsomption** : faire rentrer le particulier sous l'universel, ce que fait le jugement de connaissance, déterminant. Le jugement de goût, lui, n'est pas déterminant mais **réfléchissant** : une réflexion du sujet sur le fonctionnement de son propre esprit, qui ne se rapporte qu'indirectement à l'objet.

      ! Kant réserve un statut privilégié aux jugements portant sur la beauté
      __naturelle__ (non celle de l'art) : c'est en eux, dit-il, que la faculté
      de juger se révèle comme ayant son principe propre.
    points:
      - id: ea1-l1-p1
        sentence: "Kant ouvre son enquête sur l'esthétique et la téléologie en la présentant comme partie d'une réflexion plus large sur ___, la faculté de penser le particulier comme contenu sous l'universel, dont l'examen occupe toute la troisième Critique."
        answer: "la faculté de juger"
        alt: []
        explanation: "Introduction IV, Ak. 5:179."
      - id: ea1-l1-p2
        sentence: "Kant emploie pour cette faculté le terme allemand ___, qui donne son titre à l'ouvrage entier (Kritik der Urteilskraft)."
        answer: "Urteilskraft"
        alt: []
