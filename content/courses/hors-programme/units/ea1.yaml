  - id: ea1-l3b
    title: "L'agréable, l'utile et le bon"
    notes: |
      Le critère de l'**intérêt** sépare la pure satisfaction esthétique des trois autres espèces de satisfaction : l'agréable, l'utile et le bon.

      « Est **agréable** ce qui plaît aux sens dans la sensation » (§3). La sensibilité est réceptivité : pas d'agrément sans la présence de l'objet. Le plaisir de la sensation dépend donc entièrement de l'existence présente de l'objet, et comme tout plaisir tend à sa propre conservation, il pousse à prolonger ou à renouveler le contact avec lui : « un objet que je déclare agréable [...] suscite par la sensation un désir pour les objets semblables ». L'agréable est lié à une satisfaction sensible **nécessairement intéressée**, où la faculté de désirer inférieure joue le rôle déterminant.

      L'utile et le bon sont eux aussi intéressés, mais ils supposent la réflexion sur des **concepts** (§4) :

      | | Ce qui plaît | Ce que nous voulons de son existence |
      | l'utile, « bon à quelque chose » | ce qui ne plaît qu'à titre de moyen | un moyen à utiliser |
      | le bon en soi | ce qui plaît par lui-même | un but à atteindre |

      Dans les deux cas, « il y a toujours le concept d'un but », donc un intérêt.

      ! Passer par la raison ne rend pas l'utile ou le bon esthétiques : ils restent liés à la faculté de désirer.
    points:
      - id: ea1-l3b-p1
        sentence: "« Est agréable ce qui plaît ___ dans la sensation. »"
        answer: "aux sens"
        alt: []
        explanation: "§3."
      - id: ea1-l3b-p2
        sentence: "Le plaisir de la sensation dépend entièrement de l'___ présente d'un objet ; comme tout plaisir tend à sa propre conservation, il pousse à renouveler le contact avec lui."
        answer: "existence"
        alt: []
      - id: ea1-l3b-p3
        sentence: "« un objet que je déclare agréable [...] suscite par la sensation ___ »"
        answer: "un désir pour les objets semblables"
        alt: []
        explanation: "§3."
      - id: ea1-l3b-p4
        sentence: "Ce qui est agréable est lié à un sentiment de satisfaction sensible ___ : ce n'est pas une satisfaction esthétique."
        answer: "nécessairement intéressée"
        alt: ["intéressée"]
      - id: ea1-l3b-p5
        sentence: "Dans la satisfaction liée à l'agréable, c'est la faculté de désirer ___ qui joue le rôle déterminant."
        answer: "inférieure"
        alt: []
      - id: ea1-l3b-p6
