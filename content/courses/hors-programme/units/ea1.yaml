  - id: ea1-l4
    title: "Second moment : l'universalité sans concept"
    notes: |
      Le second moment ({sky}§§6–9{/sky}) attribue au jugement de beauté une prétention à l'{green}**universalité**{/green} (ou {violet}validité universelle{/violet}) : juger qu'un objet est beau, c'est {amber}prétendre que chacun devrait partager ce plaisir{/amber}. Kant emploie aussi l'expression {violet}*communicabilité universelle*{/violet}, longtemps tenue pour équivalente à l'universalité : une équivalence aujourd'hui débattue.

      - Cette universalité {green}__ne repose sur aucun concept__{/green} : à la différence de {yellow}« cet objet est vert »{/yellow}, dont la prétention à l'assentiment général tient à la {pink}subsomption sous un concept{/pink}, celle du beau n'en tient à aucun. Kant l'affirme sans détour : {teal}« {/teal}la {teal}beauté{/teal} n'est pas un {teal}**concept** de l'objet »{/teal} (§38). Plus tard, dans l'{sky}Antinomie du goût{/sky}, il semble nuancer cette thèse en évoquant un concept {amber}*indéterminé*{/amber} (§57) : un usage du mot « concept » qui s'écarte de son sens ordinaire.
      - Conséquence : un jugement de beauté {coral}ne peut jamais être __démontré__{/coral}, aucune règle ne pouvant contraindre quiconque à juger belle une chose.

      Cette universalité distingue encore le beau de l'{pink}agréable{/pink} (où l'on ne prétend pas que chacun doive ressentir le même plaisir) et des {pink}jugements cognitifs et du bien{/pink} (universels eux aussi, mais {red}par le biais de concepts{/red}).

      Deux formules condensent ce moment : {teal}« {/teal}Est {teal}*beau* ce qui plaît universellement sans concept »{/teal} (§9) et {teal}« {/teal}Le beau est ce qui est représenté {teal}sans concept{/teal} comme objet d'une {teal}satisfaction universelle »{/teal} (§6). Le raisonnement du §6 part du {amber}désintéressement{/amber} : {amber}si ma satisfaction ne repose sur aucune inclination{/amber}, {coral}je ne puis l'attribuer à rien de propre à ma personne{/coral} ; elle doit donc reposer sur {coral}quelque chose que je peux supposer en tout autre{/coral}, de sorte que {green}je peux à bon droit exiger de chacun une semblable satisfaction{/green}.

      La tension de ce moment culmine dans l'{violet}**antinomie du goût**{/violet}, exposée dans la {sky}Dialectique{/sky} : *thèse*, {amber}le jugement de goût ne se fonde pas sur des concepts{/amber}, sinon on pourrait en décider par des preuves ; *antithèse*, {amber}il se fonde sur des concepts{/amber}, sinon on ne pourrait prétendre à l'assentiment d'autrui. La solution : {green}c'est justement parce qu'il ne se fonde pas sur des concepts que le jugement de goût peut prétendre à l'assentiment d'autrui{/green}.
