- id: montaigne-la-force-de-la-tradition-l6
  title: "Hors de la coutume, hors de la raison"
  notes: |-
    **Conséquence de tout ce qui précède : ce qui est hors des limites de la coutume, on le croit hors des limites de la raison, idée le plus souvent déraisonnable.** Paragraphe 31 du chapitre.

    | On tient pour… | ce qui n'est que… |
    | naturel | acquis |
    | nécessaire | contingent |
    | universel | particulier |

    Les limites de la coutume deviennent celles de la pensée : l'habitude pense à notre place. Chaque communauté prétend faire de sa perspective particulière une loi universelle, et reçoit les avis de la vérité comme adressés à tous, jamais à soi-même.

    Le remède est celui que Montaigne s'applique : s'étudier, chercher aussitôt en quoi une pensée juste nous concerne, pour qu'elle devienne un « coup de fouet » à la bêtise de notre jugement. La raison qui dénonce l'ethnocentrisme sort du discours monologique qui essentialise notre propre rationalité, pour en saisir le caractère conditionné et local. Bourdieu en fait une règle du sociologue : la réflexivité, retour de la science sociale sur elle-même (*Science de la science et réflexivité*).

    Échos : dans « Sur les cannibales » (I, 30), chacun appelle barbarie ce qui n'est pas de son usage, et croit trouver chez soi la religion, le gouvernement et l'usage parfaits ; Aristote, qui fonde en nature l'esclavage et la condition de la femme (*Politique*, I), prend une coutume pour un ordre des choses.

    ! Montaigne ne condamne pas la raison : il condamne la coutume qui se fait passer pour elle.
  passage:
    label: "§6"
    text: "Il résulte de tout cela que ce qui est en dehors des limites de la coutume, on croit que c'est en dehors des limites de la raison : dieu sait combien cette idée est déraisonnable, le plus souvent. Si comme nous, qui nous étudions, avons appris à le faire, chacun de ceux qui entendent une pensée juste cherchait aussitôt en quoi elle le concerne lui-même, il comprendrait que cette pensée n'est pas tant un bon mot qu'un bon coup de fouet à la bêtise ordinaire de son jugement. Mais on reçoit les avis de la vérité et ses préceptes comme s'ils étaient adressés à tous, et jamais à soi-même. Au lieu de les appliquer à ses propres comportements, on les enfouit dans sa mémoire, bêtement et inutilement. Mais revenons encore au pouvoir souverain de la coutume."
