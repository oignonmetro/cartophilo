    sentence: "Le même passage de l'« Apologie de Raymond Sebond » (II, 12, § 424) présente l'anthropophagie comme une sépulture, qui consiste à loger le corps de ses pères et leurs reliques en son propre corps et jusque dans leur ___. Comprendre le point de vue contraire, c'est ainsi trouver une ressemblance : la différence ne porte plus que sur le lieu de la sépulture, le sol ou le corps. Lever le masque d'une coutume passe donc autant par le repérage des ressemblances que des différences."
    answer: "moelle"
