- id: montaigne-la-force-de-la-tradition-l8
  title: "Darius : l'usage dérobe le vrai visage des choses"
  notes: |-
    **L'expérience de Darius prouve la thèse par symétrie : Grecs et Indiens, chacun horrifié par la coutume funéraire de l'autre, refusent d'en changer à aucun prix.** Paragraphe 33 du chapitre.

    | Peuple | Sa coutume | Devant celle de l'autre |
    | les Grecs | brûler les corps de leurs pères | refusent pour rien au monde de les manger |
    | les Indiens | manger leurs pères morts, la meilleure sépulture | plus horrifiés encore de les brûler |

    Aucun des deux ne juge de la chose même : « l'usage nous dérobe le vrai visage des choses ». En épigraphe, un distique de Lucrèce (*De rerum natura*, II, v. 1023) : rien de si grand ni de si admirable qui ne cesse peu à peu de nous étonner.

    Prolongement : pour Merleau-Ponty (*Phénoménologie de la perception*), l'usage qu'un homme fait de son corps transcende ce corps comme être simplement biologique ; manger ou brûler les morts sont deux usages culturels d'un même corps. Comme à Valladolid, la coutume de l'autre suscite d'abord l'horreur, qu'on prend pour un jugement sur la nature.

    ! L'horreur est la même des deux côtés : c'est ce qui interdit d'en faire le critère de ce qui est naturel.
  passage:
    label: "§8"
    text: "Darius demanda à des Grecs pour combien ils accepteraient d'adopter la coutume des Indes, et manger leurs pères morts (car c'était l'usage des gens de ce pays : ils estimaient ne pas pouvoir leur trouver de meilleure sépulture qu'en eux-mêmes). Ils lui répondirent qu'ils ne le feraient pour rien au monde. Mais ayant aussi tenté de convaincre les Indiens d'abandonner leur coutume, et d'adopter celle des Grecs, qui était de brûler les corps de leurs pères, il leur fit encore plus horreur. Chacun réagit ainsi, parce que l'usage nous dérobe le vrai visage des choses."
