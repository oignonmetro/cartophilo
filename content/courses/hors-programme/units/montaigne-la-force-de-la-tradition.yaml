- id: montaigne-la-force-de-la-tradition-i2
  title: "Le choc du Nouveau Monde"
  notes: |-
    **La découverte du Nouveau Monde met les Européens face à des coutumes qui contredisent les leurs, au premier rang desquelles l'anthropophagie.**

    L'anthropophagie heurtait les pratiques funéraires de l'époque, fondées sur l'inhumation et sur la foi chrétienne dans la résurrection du corps après la mort. Créée par un Dieu bienveillant et placée dans un univers hiérarchisé, la nature humaine se présentait au sommet de la création : c'est en son nom que les conquistadors ont pu juger les Amérindiens comme des êtres non humains, et pour cela « dignes » d'être exterminés.

    | À Valladolid (1550) | Position |
    | Bartolomé de las Casas | dominicain, dénonce les pratiques des colonisateurs et défend les droits des autochtones |
    | Juan Ginés de Sepúlveda | veut empêcher les comportements « contre-nature » des Indiens, le cannibalisme d'abord, et justifie l'évangélisation forcée |

    La répugnance qu'inspire aujourd'hui la thèse de Sepúlveda renseigne sur le caractère contingent de tout discours sur la nature humaine : c'est ce que Montaigne met au jour.

    ! Montaigne ne fait pas l'éloge de l'anthropophagie : il montre que l'horreur qu'elle inspire ne prouve pas qu'elle soit contre nature.
