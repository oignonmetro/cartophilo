- id: montaigne-la-force-de-la-tradition-l4
  title: "L'emprise de la coutume"
  notes: |-
    **Le principal effet de la coutume est de nous enserrer si bien que nous avons toutes les peines du monde à rentrer en nous-mêmes pour examiner ce qu'elle nous impose.** Paragraphe 29 du chapitre.

    La coutume ne se contente pas de régler nos conduites : elle transforme n'importe quel comportement ou idée en un fait naturel et normal, et nous ôte ainsi le recul qui permettrait de la juger. Il n'existe aucun tribunal ni point de vue absolu d'où l'on sortirait des coutumes pour juger de leur vérité.

    Prolongement : Bourdieu et Passeron (*La Reproduction*) montrent que tout pouvoir qui impose des significations comme légitimes en dissimulant les rapports de force qui le fondent y ajoute une force proprement symbolique ; méconnu comme arbitraire, il est reconnu comme autorité légitime. La tradition, de même, n'apparaît jamais comme un pouvoir.

    ! Se dégager de la coutume n'est pas impossible, mais difficile : Montaigne décrit une résistance, non une fatalité, puisqu'il pratique lui-même cet examen (§6, §9).
