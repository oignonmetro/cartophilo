- id: montaigne-la-force-de-la-tradition-l2
  title: "Les lois de la conscience naissent de la coutume"
  notes: |-
    **Même les lois de la conscience, que nous croyons inscrites en nous par la nature, naissent de la tradition : ce sont les principes de la morale elle-même, et pas seulement les lois positives, qui s'originent dans la coutume.** Paragraphe 27 du chapitre.

    Le vrai et le faux, le bien et le mal, le juste et l'injuste ne sont pas des lois naturelles et universelles : chacun vénère intérieurement les opinions et les mœurs reçues autour de lui. Cette incorporation est infra-consciente et affective : on ne peut s'en détacher sans remords, ni s'y conformer sans les approuver. Le remords, qu'on prendrait pour la voix de la nature, est l'effet de la coutume.

    | Auteur | Ce qu'il éclaire |
    | Marx | l'idée de nature humaine comme représentation idéologique : une norme particulière qui se donne pour universelle, et sert d'alibi à la normalisation |
    | Descola | l'anthropologie, relativiste en un sens très général, fait douter de l'universalité de ce qu'on croyait établi |
    | Bourdieu | le pouvoir symbolique suppose la reconnaissance, c'est-à-dire la méconnaissance de la violence qu'il exerce (*Choses dites*) : la violence symbolique |

    Dans l'« Apologie de Raymond Sebond » (II, 12), Montaigne étend l'argument de la morale à l'opinion en général : chaque peuple voit les choses sous un certain jour ; et la sépulture n'y est ni plus naturelle ni meilleure que l'anthropophagie.

    ! Le remords ne prouve pas qu'une loi soit naturelle : il prouve seulement qu'on l'a incorporée.
  passage:
    label: "§2"
    text: "Les lois de la conscience, dont nous disons qu'elles naissent de la nature, naissent de la tradition : chacun vénère intérieurement les opinions et les mœurs reçues et acceptées autour de lui, et il ne peut s'en détacher sans remords, ni s'y appliquer sans les approuver."
