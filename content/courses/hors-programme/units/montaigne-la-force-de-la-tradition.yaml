  - id: montaigne-la-force-de-la-tradition-l10-p21
    sentence: "Montaigne met en pratique le détachement décrit au paragraphe 37 dans l'« Apologie de Raymond Sebond » (II, 12, § 424) : il part de sa propre horreur devant l'anthropophagie, avant de la retourner en constatant que les peuples qui la pratiquaient y voyaient un témoignage de ___ et de grande affection. Le renversement du point de vue est la méthode concrète du « masque arraché » et produit le jugement « tout bouleversé » que le paragraphe 37 annonce."
    answer: "piété"
