- id: montaigne-la-force-de-la-tradition-l7
  title: "Chacun tient sa coutume politique pour naturelle"
  notes: |-
    **La coutume règne jusque sur la politique : peuples libres et peuples monarchiques jugent chacun tout autre régime monstrueux et contre nature.**

    Plus fort encore : libérés d'un maître à grand-peine, les peuples habitués à obéir s'empressent d'en réinstaller un autre, faute de pouvoir prendre en haine l'autorité elle-même. La coutume attache aussi aux lieux : chacun est content de celui où la nature l'a placé, les sauvages d'Écosse n'ont que faire de la Touraine, ni les Scythes de la Thessalie.

    ! « Contre nature » ne décrit pas le régime jugé : le mot exprime l'habitude de celui qui juge.
  passage:
    label: "§7"
    text: "Les peuples élevés dans la liberté et habitués à se commander eux-mêmes estiment toute autre forme de gouvernement monstrueuse et contre-nature. Ceux qui sont formés dans l'idée de la monarchie pensent de même. Et quelque facilité que le sort leur offre pour un changement, alors même qu'ils se sont libérés avec bien des difficultés de la contrainte importune d'un maître, ils s'empressent aussitôt d'en réinstaller un nouveau, avec les mêmes difficultés. C'est qu'ils ne peuvent pas se résoudre à prendre en haine l'autorité elle-même. C'est par l'entremise de la tradition que chacun est content du lieu où la nature l'a placé : les sauvages d'Écosse n'ont que faire de la Touraine, ni les Scythes de la Thessalie."
