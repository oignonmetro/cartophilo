- id: montaigne-la-force-de-la-tradition-l5
  title: "Pourquoi la coutume passe pour la nature"
  notes: |-
    **Si la coutume passe pour la nature, c'est qu'elle nous précède : absorbée avec le lait, elle donne au monde son premier visage, et les opinions reçues nous semblent de ce fait naturelles et universelles.** Paragraphe 30 du chapitre.

    L'argument est génétique : le monde se présente à nous sous un aspect la première fois que nous le voyons, et nous croyons être faits pour le voir ainsi. Or l'universalité est le signe du naturel : faute d'un exemple qui le contredise, l'homme croit inné ce qui est partagé dans son milieu. La « nature humaine » n'est donc pas une propriété innée mais une nature acquise : le culturel est la nature de l'humain, le biologique seulement celle de l'homme.

    | Auteur | Ce qu'il éclaire |
    | Ruth Benedict | la vie de chaque individu est d'abord une accommodation aux modèles de sa communauté (*Échantillons de civilisations*) : l'anthropologie culturelle |
    | Bourdieu | l'habitus des dominants, « nature socialement constituée », doit masquer sa contingence pour paraître naturel ; croire à un ordre naturel, c'est méconnaître un ordre arbitraire (*Choses dites*) |
    | Montaigne, III, 2 | chacun porte la forme entière de l'humaine condition (du latin `condicio`, ce qui est fixé par convention ou par contrat) ; chacun reste pourtant un être singulier |

    ! L'argument explique l'illusion ; il ne prouve pas qu'il n'y ait rien de naturel en l'homme.
