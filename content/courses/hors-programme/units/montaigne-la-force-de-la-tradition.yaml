- id: montaigne-la-force-de-la-tradition-l3
  title: "La malédiction des Crétois"
  notes: |-
    **Pour maudire quelqu'un, les anciens Crétois priaient les dieux de lui faire contracter une mauvaise habitude : la pire malédiction n'est pas un malheur ponctuel, mais l'asservissement à la puissance de la coutume.**

    L'anecdote, brève, fait transition. Après avoir montré que la coutume façonne les corps (§1) et les consciences (§2), Montaigne en fait sentir la force par l'effroi même qu'elle inspire : une habitude prise ne se quitte plus, ce que le paragraphe suivant analyse.

    ! La malédiction ne vise pas un acte mauvais, mais une disposition durable : c'est sa durée qui fait la force de la coutume.
  passage:
    label: "§3"
    text: "Quand les Crétois, dans les temps anciens, voulaient maudire quelqu'un, ils priaient les dieux de lui faire contracter quelque mauvaise habitude."
  points:
