- id: montaigne-la-force-de-la-tradition-l1
  title: "La coutume, aussi puissante que la nature"
  notes: |-
    **La coutume produit des comportements aussi contraignants que la maladie ou la nature : Montaigne met la coutume et la nature à égalité.**

    L'exemple, emprunté à Aristote, est choisi pour sa bizarrerie : s'arracher les cheveux, se ronger les ongles, manger des charbons ou de la terre, voilà des conduites qu'on imputerait à un désordre du corps, et qui viennent aussi souvent de la tradition. De même des relations entre hommes : « autant par coutume que par nature ».

    Sur l'Exemplaire de Bordeaux, Montaigne a rayé « plus par » pour écrire « autant par » : la correction ne donne pas l'avantage à la coutume, elle la met exactement à égalité avec la nature.

    Prolongement : pour Merleau-Ponty (*Phénoménologie de la perception*), « tout est fabriqué et tout est naturel chez l'homme ». On ne peut superposer une couche de comportements innés et un monde culturel fabriqué : la nature humaine est un mélange homogène, non deux couches.

    ! Montaigne ne dit pas que tout vient de la coutume : il refuse de séparer nettement ce qui revient à la nature et ce qui revient à la coutume.
  passage:
    label: "§1"
    text: "Par tradition, dit Aristote, aussi souvent que par maladie, des femmes s'arrachent les cheveux, rongent leurs ongles, mangent des charbons et de la terre. Et autant par coutume que par nature, les hommes ont des relations avec les hommes."
  points:
