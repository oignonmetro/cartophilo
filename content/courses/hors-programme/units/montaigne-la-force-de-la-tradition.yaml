- id: montaigne-la-force-de-la-tradition-l9
  title: "Montaigne près de se détacher d'un usage"
  notes: |-
    **Montaigne rapporte sa propre expérience : chargé de défendre un usage, il en a cherché l'origine, et lui a trouvé un fondement si peu assuré qu'il a failli s'en détacher lui-même.**

    On justifie d'ordinaire une coutume par la seule force des lois et des exemples ; remonter à sa source, c'est découvrir sa fragilité. D'où, en retour, la force de la coutume : elle tient d'autant mieux qu'on ne l'examine pas.

    ! Montaigne a « failli » se détacher de cet usage, sans le faire : examiner une coutume n'oblige pas à la rejeter.
  passage:
    label: "§9"
    text: "Autrefois, ayant à faire valoir un de nos usages qui faisait autorité bien au-delà de nous, et ne voulant pas, comme on le fait en général, l'établir seulement par la force des lois et des exemples, mais allant rechercher ses origines mêmes, je découvris que son fondement était si peu assuré qu'il s'en fallut de peu que je ne m'en détache moi-même, moi qui avais pour tâche de le renforcer chez les autres."
  points:
  - id: montaigne-la-force-de-la-tradition-l9-p1
    sentence: "« ___, et ne voulant pas, comme on le fait en général, l'établir seulement par la force des lois et des exemples, mais allant rechercher ses origines mêmes, je découvris que son fondement était si peu assuré qu'il s'en fallut de peu que je ne m'en détache moi-même, moi qui avais pour tâche de le renforcer chez les autres. »"
    answer: "Autrefois, ayant à faire valoir un de nos usages qui faisait autorité bien au-delà de nous"
