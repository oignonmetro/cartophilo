  title: "Arracher le masque de la coutume"
  notes: |-
    **Qui se détache du préjugé de la coutume découvre que bien des choses reçues comme indiscutables n'ont de fondement que dans la barbe blanche et les rides de l'usage ; le masque arraché, son jugement est bouleversé, mais ramené à des bases plus solides.** Paragraphe 37 du chapitre.

    Montaigne écarte pourtant une autre erreur, pire encore : ceux qui refusent de se laisser entraîner loin de la source originelle se voient contraints d'adopter des opinions barbares, comme le stoïcien Chrysippe, qui faisait peu de cas des unions incestueuses.

    | Auteur | Ce qu'il éclaire |
    | Lévi-Strauss | l'étude comparative des cultures éduque à une rationalité ouverte, attentive aux différences comme aux ressemblances (*Race et histoire*, 1952) |
    | Bourdieu | le « malheur de la sociologie » : découvrir l'arbitraire là où l'on aime voir la nécessité ou la nature (*Choses dites*) |
    | Montaigne, II, 12 | l'anthropophagie vue par ceux qui la pratiquaient : un témoignage de piété, une sépulture qui loge les pères jusque dans la moelle de leurs enfants |

    ! Le jugement bouleversé n'est pas ruiné : Montaigne dit qu'il est ramené à des bases plus solides.
  passage:
    label: "§10"
    text: "Ceux qui ne veulent pas se laisser entraîner loin de la source originelle se trompent encore plus, et se voient contraints d'adopter des opinions barbares, comme Chrysippe, qui mit un peu partout dans ses écrits le peu de cas qu'il faisait des unions incestueuses, quelles qu'elles soient. Celui qui voudra se détacher du tenace préjugé de la coutume trouvera que bien des choses reçues comme indiscutables n'ont cependant de fondement que dans la barbe blanche et les rides de l'usage qui les accompagne. Une fois ce masque arraché, et les choses amenées à la lumière de la vérité et de la raison, il sentira son jugement tout bouleversé, et pourtant ramené à des bases plus solides."
