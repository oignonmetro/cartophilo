# Unité de texte (voir content/textes.md) : Montaigne, Essais, I, 23, « Sur les
# habitudes et le fait qu'on ne change pas », traduction de Guy de Pernon.
# Cartes écrites par l'utilisatrice ; titres, rappels, présentation, leçons
# d'introduction (cartes de contexte) et fragments ajoutés ensuite.

id: montaigne-la-force-de-la-tradition
title: "Montaigne : la force de la tradition"
subtitle: "Essais, I, 23 · traduction de Guy de Pernon"
icon: page
color: orange
intro: |-
  Un extrait du chapitre I, 23 des *Essais*, « Sur les habitudes et le fait qu'on ne change pas », dans la traduction de Guy de Pernon : la coutume a la force d'une seconde nature, au point de régler nos corps, nos consciences, nos régimes politiques, et jusqu'à ce que nous tenons pour raisonnable.

  Dix paragraphes : la puissance de la coutume (§1-5), ses effets sur le jugement (§6-8), puis la manière de s'en affranchir (§9-10).
lessons:
- id: montaigne-la-force-de-la-tradition-i1
  title: "La coutume et l'idée de nature humaine"
  notes: |-
    **Au chapitre I, 23 des Essais, Montaigne montre que la coutume a la force d'une seconde nature : ce que nous croyons naturel et universel n'est souvent qu'acquis et particulier.**

    La coutume désigne une manière de vivre, d'agir, de penser et de sentir passée dans les mœurs : un habitus à la fois cognitif, émotif et comportemental. Guy de Pernon, dont on cite la traduction, rend le mot tantôt par « habitude », tantôt par « tradition ».

    Ce que Montaigne ébranle, c'est l'idée de nature humaine héritée des savoirs gréco-latins et chrétiens, dans une société religieuse organisée par une structure ecclésiastique et un pouvoir politique qui véhiculent une même vision de l'homme et du monde :

    | Faculté | Ce qu'elle permet |
    | la raison | penser |
    | le libre arbitre | s'autodéterminer |
    | la foi | reconnaître le vrai Dieu et lui adresser prières et suppliques |

    Déjà Platon rangeait le cannibalisme parmi les désirs déréglés de l'âme (`epithumiai paranomoi`, *République*, IX, 571c-d) : l'exemple même de l'ethnocentrisme que Montaigne dénoncera.

    ! La coutume n'est pas seulement un comportement extérieur : elle façonne aussi ce qu'on pense et ce qu'on ressent.
