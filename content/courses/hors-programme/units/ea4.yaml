  - id: ea4-l5
    title: "La portée élargie de l'esthétique kantienne"
    notes: |
      Kant tient lui-même son esthétique pour **centrale** à sa conception
      d'ensemble de la faculté de juger, donc pour importante à la
      compréhension de l'enquête scientifique empirique, en particulier
      biologique. Heidemann s'appuie ainsi sur elle pour défendre une
      lecture **non conceptualiste** de la théorie kantienne de la
      connaissance.

      Au-delà de l'esthétique et des études kantiennes, l'esthétique de Kant
      a nourri des débats dans des domaines très divers :

      - __philosophie du langage__ : Cavell relie l'universalité subjective
        des jugements de beauté à l'appel, fait par la philosophie du
        langage ordinaire, à « ce que nous devrions dire » ; Bell rapproche
        le jugement esthétique kantien des considérations de Wittgenstein
        sur le **suivi de règle**, un rapprochement que Ginsborg développe
        en réponse au **scepticisme sur les règles** que Kripke attribue à
        Wittgenstein.
      - __philosophie politique__ : Arendt applique la théorie kantienne du
        jugement esthétique à ce domaine.
      - __philosophie des mathématiques et des sciences__ : Breitenbach
        soutient que, sur une base kantienne, on peut éprouver du
        **plaisir** aussi bien devant une preuve mathématique que devant une
        théorie scientifique.
      - __théorie littéraire__ : l'esthétique kantienne y est très discutée,
        notamment à propos du **sublime**, dans des lectures d'**inspiration
        psychanalytique** dues à Weiskel et à Hertz ; les travaux de
        Derrida, bien que largement ignorés par les commentateurs de
        tradition analytique, ont exercé une influence certaine parmi les
        théoriciens de la littérature.
    points:
