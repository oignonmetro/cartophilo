  - id: ea4-l3
    title: "Le sublime face au beau, et l'importance du sublime"
    notes: |
      Le {sky}jugement du sublime{/sky} partage avec le {amber}jugement de
      beauté{/amber} sa base dans le sentiment et sa prétention à la
      validité universelle. Il en diffère cependant sur plusieurs points :

      i. l'objet y est représenté comme __contre-finalisé__ plutôt que
         finalisé pour les facultés de l'imagination et du jugement (§23),
         et cette finalité, quand elle existe, porte sur le jugement
         esthétique lui-même plutôt que sur l'objet, et vise la raison (ou
         la « vocation entière de l'esprit ») plutôt que l'imagination ou
         l'entendement (§27).
      ii. la prétention à la validité universelle du sublime repose sur la
         validité universelle du sentiment __moral__, non sur celle des
         conditions de la connaissance.
      iii. on peut à bon droit appeler des objets beaux, mais non, à
         proprement parler, __sublimes__ (§28) : la sublimité, dit Kant, ne
         se trouve dans rien de la nature, mais seulement dans **notre
         esprit** : d'où l'absence de besoin d'une déduction du sublime.
      iv. le {amber}jugement de beauté{/amber} met en relation l'imagination
         et l'entendement ; le {sky}jugement du sublime{/sky} met en
         relation l'imagination et la __raison__ (§29).

      ! Kant lui-même **relativise** beaucoup l'importance du sublime, qu'il
      présente comme « un simple appendice au jugement esthétique de la
      finalité de la nature » ; ses vues sur le sublime sont d'ailleurs
      jugées moins originales historiquement que celles sur le beau,
      montrant l'influence de Burke.

      Un débat oppose enfin les commentateurs sur la **restriction** du
      sublime aux seuls objets naturels : Abaci défend cette restriction
      kantienne à la nature, quand Clewis défend au contraire la
      possibilité d'un **sublime artistique**.
    points:
      - id: ea4-l3-p1
        sentence: "À la différence du jugement de beauté, le jugement du sublime représente l'objet comme ___ plutôt que comme finalisé pour les facultés de l'imagination et du jugement."
        answer: "contre-finalisé"
        alt: ["contrafinalisé"]
        explanation: "§23, Ak. 5:245."
      - id: ea4-l3-p2
        sentence: "La représentation de l'objet comme contre-finalisé, plutôt que finalisé pour les facultés de l'imagination et du jugement, propre au jugement du sublime, se trouve en ___."
        answer: "§23"
        alt: []
      - id: ea4-l3-p3
        sentence: "Dans le jugement du sublime, ce n'est pas l'objet mais le jugement esthétique lui-même qui est représenté comme ___."
        answer: "finalisé"
        alt: []
      - id: ea4-l3-p4
        sentence: "Ce jugement esthétique est représenté comme finalisé non pour l'imagination ou l'entendement, mais pour la ___, ou pour la « vocation entière de l'esprit »."
        answer: "raison"
        alt: []
        explanation: "§27, Ak. 5:259–260."
      - id: ea4-l3-p5
        sentence: "La représentation du jugement esthétique du sublime lui-même comme finalisé, non pour l'imagination ou l'entendement mais pour la raison, ou pour « la vocation entière de l'esprit », se trouve en ___."
        answer: "§27"
        alt: []
      - id: ea4-l3-p6
        sentence: "La prétention à la validité universelle du jugement du sublime repose, non sur la validité universelle des conditions de la connaissance comme dans le jugement de beauté, mais sur la validité universelle du sentiment ___."
        answer: "moral"
        alt: []
        explanation: "§29, Ak. 5:255–256."
      - id: ea4-l3-p7
        sentence: "Si l'on peut à bon droit appeler des objets beaux, on ne peut, à proprement parler, les appeler ___ : la sublimité ne se trouve, dit Kant, dans rien de la nature, mais seulement dans notre esprit."
        answer: "sublimes"
        alt: []
        explanation: "§23, Ak. 5:245 ; §28, Ak. 5:264."
      - id: ea4-l3-p8
        sentence: "L'affirmation selon laquelle on ne peut, à proprement parler, appeler sublimes des objets de la nature, la sublimité résidant, selon Kant, non dans la nature mais dans notre esprit, se trouve en ___."
        answer: "§28"
        alt: []
      - id: ea4-l3-p9
        sentence: "Parce que la sublimité réside dans l'esprit et non dans l'objet, Kant estime qu'il n'y a nul besoin d'une ___ du sublime, à la différence du jugement de beauté."
