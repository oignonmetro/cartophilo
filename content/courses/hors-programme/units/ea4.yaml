id: ea4
title: "Le sublime et la portée de l'esthétique kantienne"
subtitle: "Le sublime mathématique et dynamique, l'esthétique et la moralité, la réception de la théorie kantienne"
icon: bulb
color: violet
group: "L'esthétique de Kant"
lessons:
  - id: ea4-l1
    title: "Le sublime mathématique"
    notes: |
      Kant distingue deux formes du sublime : le sublime **mathématique** et
      le sublime **dynamique**. Dans les deux cas, l'expérience du sublime
      consiste en un sentiment de la supériorité de notre propre pouvoir de
      {teal}raison{/teal}, comme faculté suprasensible, sur la nature (§28).

      Dans le cas du sublime mathématique, ce sentiment prend la forme plus
      précise d'un sentiment de la supériorité de la raison sur
      l'{coral}__imagination__{/coral}, conçue comme la capacité naturelle
      requise pour l'**appréhension sensible**, y compris celle des
      grandeurs. On l'éprouve face à quelque chose d'assez grand pour
      dépasser la capacité de l'imagination à le comprendre : l'{coral}imagination{/coral}
      s'efforce alors de satisfaire une exigence de la {teal}raison{/teal},
      mais échoue.

      Kant l'explique ainsi : « parce qu'il y a dans notre imagination une
      tendance à s'avancer vers l'infini, tandis que dans notre raison réside
      une prétention à la totalité absolue [...], l'inadéquation même de
      notre faculté à estimer la grandeur des choses du monde sensible
      éveille en nous le sentiment d'une faculté suprasensible. » (§25) Le fait
      même que nous soyons capables, par la raison, de penser l'**infini**
      comme un tout indique une faculté de l'esprit qui dépasse toute mesure
      des sens (§26).

      ! Les exemples appropriés du sublime mathématique doivent être des
      choses naturelles dont le concept n'implique l'idée d'**aucune fin**,
      ce qui exclut les animaux (liés à l'idée de fonction biologique), mais
      inclut les montagnes et la mer.
    points:
      - id: ea4-l1-p1
        sentence: "Dans les deux formes du sublime que distingue Kant, le sublime mathématique et le sublime dynamique, l'expérience du sublime consiste en un sentiment de la supériorité de notre propre pouvoir de ___ sur la nature."
        answer: "raison"
        alt: []
        explanation: "§28, Ak. 5:261."
      - id: ea4-l1-p2
        sentence: "Le sentiment de la supériorité de notre propre pouvoir de raison sur la nature, commun aux deux formes du sublime que distingue Kant, se trouve en ___."
        answer: "§28"
        alt: []
      - id: ea4-l1-p3
        sentence: "Dans le cas du sublime mathématique, ce sentiment de la supériorité de la raison sur la nature prend plus précisément la forme d'un sentiment de la supériorité de la raison sur l'___, conçue comme la capacité naturelle requise pour l'appréhension sensible, y compris celle des grandeurs des choses empiriquement données."
        answer: "imagination"
        alt: []
      - id: ea4-l1-p4
        sentence: "Nous éprouvons ce sentiment de sublime mathématique lorsque nous sommes confrontés à quelque chose d'assez grand pour dépasser la capacité de l'imagination à le ___."
        answer: "comprendre"
        alt: []
