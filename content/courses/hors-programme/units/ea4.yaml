  - id: ea4-l4
    title: "Esthétique et moralité"
    notes: |
      Le lien entre jugement esthétique et sentiment moral traverse toute la
      Critique de la faculté de juger esthétique. Une minorité de commentateurs pense
      que la prétention à la validité universelle du beau repose sur un
      **fondement moral** ; la vue la plus répandue est plutôt que les
      jugements de beauté, avec ceux du sublime, __contribuent__ à expliquer
      comment la {sky}moralité{/sky} est possible pour des êtres humains,
      sans en dépendre pour leur propre légitimité.

      Kant présente d'abord, à un niveau très général, dans l'introduction de
      l'ouvrage (§IX), la **faculté de juger** comme comblant le grand fossé
      entre le concept de nature et celui de __liberté__. Le texte
      esthétique développe ensuite plusieurs connexions plus précises :

      - le beau et le sublime préparent à la moralité : « le beau nous
        prépare à aimer quelque chose, même la nature, sans intérêt ; le
        sublime, à l'estimer, même contre notre intérêt sensible » (Remarque
        générale suivant le §29).
      - prendre un **intérêt direct** à la beauté de la nature indique « une
        bonne âme » et une disposition favorable au sentiment moral (§42).
      - la {coral}beauté{/coral} est le **symbole** de la {sky}moralité{/sky} :
        le jugement de beauté « se légifère lui-même », comme la conscience
        morale, plutôt que d'être soumis à une hétéronomie des lois de
        l'expérience (§59).
      - la beauté donne une **forme sensible** aux idées morales ; en
        retour, le développement des idées morales devient la véritable
        **propédeutique** du {coral}goût{/coral} (§60).
    points:
      - id: ea4-l4-p1
        sentence: "Une minorité de commentateurs pense que la prétention à la validité universelle du jugement de beauté repose sur un fondement moral ; la vue la plus répandue est au contraire que les jugements de beauté, avec ceux du sublime, contribuent plutôt à expliquer comment la ___ est possible pour des êtres humains, sans en dépendre pour leur propre légitimité."
        answer: "moralité"
        alt: []
      - id: ea4-l4-p2
        sentence: "Kant présente la faculté de juger, dès l'introduction de l'ouvrage, comme comblant le grand fossé entre le concept de nature et celui de ___."
        answer: "liberté"
        alt: []
