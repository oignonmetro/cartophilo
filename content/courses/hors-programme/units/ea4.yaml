  - id: ea4-l2
    title: "Le sublime dynamique"
    notes: |
      Dans le cas du sublime __dynamique__, le sentiment de la supériorité
      de la raison sur la nature est plus direct : Kant qualifie la nature
      de **dynamiquement sublime** lorsque nous la considérons comme une
      puissance qui n'a aucune domination sur nous. On éprouve ce sentiment
      en faisant l'expérience de la nature comme {sky}redoutable{/sky}, tout
      en se sachant en position de {sky}sécurité{/sky}, donc sans être
      réellement effrayé. Kant donne pour exemples les falaises
      surplombantes, les nuages orageux, les volcans et les ouragans (§28).

      « L'irrésistibilité de [la] puissance [de la nature] nous fait certes
      reconnaître, en tant qu'êtres naturels, notre impuissance physique,
      écrit Kant, mais révèle en même temps une capacité à nous juger
      indépendants de la nature et supérieurs à elle [...], de sorte que
      l'humanité en notre personne reste sans abaissement, même si l'être
      humain doit se soumettre à cette domination. »

      Le sentiment du sublime, mathématique comme dynamique, comporte, outre
      le plaisir pris à cette supériorité, une part de {sky}__déplaisir__{/sky} :
      dans le cas mathématique, il vient de la conscience de l'inadéquation
      de l'imagination ; dans le cas dynamique, de la conscience de notre
      **impuissance physique**. Kant compare ce mouvement de l'esprit à une
      **vibration**, une répulsion et une attraction rapidement alternées
      envers un même objet ; il décrit aussi ce sentiment comme un « plaisir
      qui n'est possible que par le moyen d'un déplaisir », et comme un
      agrément __négatif__ (§27, et la Remarque générale suivant le §29).

      ! Kant va jusqu'à identifier le sentiment du sublime au sentiment de
      **respect**, associé dans sa philosophie pratique à la reconnaissance
      de la **loi morale**.
    points:
      - id: ea4-l2-p1
        sentence: "Kant qualifie la nature de dynamiquement sublime lorsque nous la considérons comme une puissance qui n'a aucune ___ sur nous."
        answer: "domination"
        alt: []
        explanation: "§28, Ak. 5:260."
      - id: ea4-l2-p2
        sentence: "Nous éprouvons le sentiment du sublime dynamique lorsque nous faisons l'expérience de la nature comme redoutable tout en nous sachant en position de ___, et donc sans être réellement effrayés."
        answer: "sécurité"
        alt: []
      - id: ea4-l2-p3
        sentence: "Kant écrit que l'irrésistibilité de la puissance de la nature nous fait certes reconnaître, en tant qu'êtres naturels, notre impuissance physique, mais révèle en même temps une capacité à nous juger indépendants de la nature et supérieurs à elle, de sorte que l'humanité en notre personne reste sans ___, même si l'être humain doit se soumettre à cette domination."
        answer: "abaissement"
        alt: []
        explanation: "§28, Ak. 5:261–262."
      - id: ea4-l2-p4
        sentence: "Kant écrit que l'irrésistibilité de la puissance de la nature nous fait certes reconnaître, en tant qu'êtres naturels, notre ___, mais révèle en même temps une capacité à nous juger indépendants de la nature et supérieurs à elle, de sorte que l'humanité en notre personne reste sans abaissement, même si l'être humain doit se soumettre à cette domination."
        answer: "impuissance physique"
        alt: []
        explanation: "§28, Ak. 5:261–262."
      - id: ea4-l2-p5
        sentence: "Kant écrit que l'irrésistibilité de la puissance de la nature nous fait certes reconnaître, en tant qu'êtres naturels, notre impuissance physique, mais révèle en même temps une capacité à nous juger ___ et supérieurs à elle, de sorte que l'humanité en notre personne reste sans abaissement, même si l'être humain doit se soumettre à cette domination."
