id: e1
title: Le jugement de goût
subtitle: "Kant, Critique de la faculté de juger : l'Analytique du beau"
icon: palette
color: violet

lessons:
  - id: e1-l1
    title: Les quatre moments du beau
    notes: |
      Kant analyse le jugement de goût (« c'est beau ») selon quatre moments,
      empruntés aux catégories de la logique : qualité, quantité, relation,
      modalité. Aucun ne se déduit des autres ; ensemble, ils cernent une
      expérience irréductible au plaisir de l'agréable comme au jugement de
      connaissance.

      - Qualité : le plaisir est __désintéressé__, il ne dépend d'aucun
        désir pour l'existence de l'objet, à la différence du plaisir pris à
        l'agréable (boire, manger) ou au bon.
      - Quantité : le jugement revendique une __universalité subjective__
        (chacun devrait juger comme moi), sans reposer sur un concept, à la
        différence du jugement « ceci est vert ».
      - Relation : l'objet manifeste une finalité sans fin
        (`Zweckmässigkeit ohne Zweck`), une forme qui semble faite pour
        plaire, sans qu'aucune fin déterminée ne lui soit assignable.
      - Modalité : le jugement s'accompagne d'une __nécessité exemplaire__ :
        mon jugement vaut comme exemple de ce que chacun devrait juger,
        fondée sur le sens commun (`sensus communis`), principe subjectif du
        jugement par sentiment plutôt que par concept.

      ! La beauté libre (une fleur, un ornement, une musique sans texte) se
        juge sans aucun concept de ce que l'objet doit être ; la beauté
        adhérente (un édifice, un cheval, un être humain) suppose au
        contraire un concept de la perfection de l'objet : le jugement n'est
        alors plus pur.
    vocab:
      - id: kant-jugement-gout
        term: le jugement de goût
        translation: jugement sur le beau
        alt:
          - jugement de beauté
          - jugement esthétique pur
        pos: expression
        hint: >-
          Jugement par lequel on dit d'un objet qu'il est beau ; Kant
          l'analyse selon quatre « moments » (qualité, quantité, relation,
          modalité) repris des catégories de la logique.

      - id: kant-desinteressement
        term: le désintéressement
        translation: indépendance du plaisir envers tout désir
        alt:
          - absence d'intérêt pour l'existence de l'objet
        pos: nom
        hint: >-
          Premier moment, qualité (§§1-5). Le plaisir esthétique ne dépend
          d'aucun désir pour l'existence de l'objet et n'en suscite aucun,
          à la différence du plaisir pris à l'agréable (boire, manger) ou
          au bien, moral ou utile.

      - id: kant-universalite-subjective
        term: l'universalité subjective
        translation: validité universelle sans concept
        alt:
          - universalité sans concept
          - universalité subjective du jugement de goût
        pos: expression
        hint: >-
          Deuxième moment, quantité (§§6-9). En jugeant qu'un objet est
          beau, on exige que chacun le juge de même ; mais cette prétention
          à l'accord universel ne repose sur aucun concept, à la différence
          du jugement « ceci est vert ».

      - id: kant-finalite-sans-fin
        term: la finalité sans fin
        translation: forme perçue comme finalisée sans fin assignable
        alt:
          - finalité formelle
          - finalité sans fin déterminée
        pos: expression
        hint: >-
          Troisième moment, relation (§§10-17), Zweckmässigkeit ohne Zweck.
          L'objet beau donne l'impression d'une finalité (comme s'il était
          fait pour plaire), sans qu'aucune fin déterminée (concept d'usage
          ou de perfection) ne lui soit assignable.

      - id: kant-necessite-exemplaire
        term: la nécessité exemplaire
        translation: nécessité normative sans concept
        alt:
          - nécessité du jugement de goût
        pos: expression
        hint: >-
          Quatrième moment, modalité (§§18-22). Le jugement de goût
          s'accompagne d'une prétention normative : mon jugement vaut comme
          exemple de ce que chacun devrait juger, sans reposer sur une
          règle ou un concept déterminé.

      - id: kant-sens-commun
        term: le sens commun
        translation: principe subjectif du jugement par sentiment
        alt:
          - sensus communis
        pos: nom
        hint: >-
          Fondement de la nécessité exemplaire (§20) : un principe
          subjectif, commun à tous, qui permet de juger par le sentiment
          plutôt que par des concepts, condition de possibilité de
          l'accord universel visé par le jugement de goût.

      - id: kant-beau-libre
        term: la beauté libre
        translation: beauté jugée sans concept de ce que l'objet doit être
        alt:
          - pulchritudo vaga
          - le beau libre
        pos: expression
        hint: >-
          §16. Beauté d'un objet jugé pour lui-même, sans présupposer un
          concept de ce qu'il doit être. Kant en donne pour exemples des
          dessins à la grecque, des motifs d'ornement, ou la musique sans
          texte.

      - id: kant-beau-adherent
        term: la beauté adhérente
        translation: beauté subordonnée à un concept de l'objet
        alt:
          - pulchritudo adhaerens
          - le beau adhérent
          - beauté dépendante
        pos: expression
        hint: >-
          §16. Beauté d'un objet jugé comme appartenant à tel ou tel genre :
          le jugement présuppose alors un concept de ce que l'objet doit
          être, sa perfection, et cesse d'être pur. Selon Kant, la plupart
          des jugements portant sur l'art représentatif relèvent de la
          beauté adhérente.
