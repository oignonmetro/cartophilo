- id: "rousseau-humanite-f3"
  title: "Le double cercle : parler pour penser, penser pour parler"
  notes: |-
    Rousseau formule ici le problème central de toute l'unité : l'institution du langage se heurte à deux cercles logiques, liés l'un à l'autre. Le premier tient à ce qui a déjà été établi (fragment précédent) : il faut une société pour parler, or il faut parler pour instituer une société. Le second, énoncé dans ce fragment, est plus profond encore : **{teal}« {/teal}si les hommes ont eu besoin de la parole pour apprendre à penser, ils ont eu bien plus besoin encore de savoir penser pour trouver l'art de {teal}la parole »{/teal}**. Autrement dit, {green}il faut penser pour parler, mais il faut tout autant parler pour penser{/green}.

    ? **Cercle** : un raisonnement où ce qu'on veut expliquer est supposé par l'explication. {yellow}Pour ouvrir le coffre, il faut la clé ; la clé est dans le coffre.{/yellow}
  passage:
    label: "Fragment 3"
    source: "Discours sur l'origine et les fondements de l'inégalité"
    text: "Supposons cette première difficulté vaincue : franchissons pour un moment l'espace immense qui dut se trouver entre le pur état de nature et le besoin des langues ; et cherchons, en les supposant nécessaires, comment elles purent commencer à s'établir. Nouvelle difficulté pire encore que la précédente ; car si les hommes ont eu besoin de la parole pour apprendre à penser, ils ont eu bien plus besoin encore de savoir penser pour trouver l'art de la parole."
