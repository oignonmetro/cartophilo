- id: rousseau-humanite-i2
  title: "Dépouiller l'homme civil pour trouver l'homme naturel"
  notes: |-
    D'un point de vue méthodologique, Rousseau procède par **dépouillement** à partir de l'homme civil : c'est de lui, et de lui seul, qu'on peut partir pour remonter vers l'homme naturel, dont la nature se trouve masquée par les artifices de la société. Il expose lui-même cette difficulté dès la préface du Second Discours, par une image désormais célèbre : la défiguration de l'homme social est comparable à celle de la statue de Glaucus, rendue méconnaissable par les flots, au point qu'il devient problématique, sinon impossible, de déterminer ce qu'est véritablement la nature de l'homme.

    Menée rigoureusement, à condition de ne jamais confondre ce qui ressort de la nature et ce qui ressort de la société, cette démarche permet pourtant à Rousseau d'établir un résultat décisif : l'homme naturel est un individu autarcique, se suffisant à lui-même, sans la moindre relation avec ses congénères. Contre Aristote, pour qui l'homme est par nature un animal politique qui ne peut accomplir sa nature qu'au sein de la communauté, et contre l'école du droit naturel (le *jusnaturalisme*), pour qui l'homme est naturellement porté à la sociabilité, Rousseau soutient que rien, dans l'état de nature, ne prédispose l'homme à la société, pas même la famille. C'est cette thèse que les deux textes qui suivent mettent chacun à l'épreuve : le premier en montrant l'aporie de toute explication naturaliste de l'origine du langage, le second en décrivant ce que la société, une fois instituée, change effectivement dans la conduite de l'homme.

    ! Piège : ne pas confondre cette absence de prédisposition sociale avec une malveillance native : Rousseau conteste tout autant la thèse hobbesienne d'un état de nature belliqueux.
