- id: rousseau-humanite-f3
  title: "Le double cercle : parler pour penser, penser pour parler"
  notes: |-
    Rousseau formule ici le problème central de toute l'unité : l'institution du langage se heurte à deux cercles logiques, liés l'un à l'autre. Le premier tient à ce qui a déjà été établi (fragment précédent) : il faut une société pour parler, or il faut parler pour instituer une société. Le second, énoncé dans ce fragment, est plus profond encore : **« si les hommes ont eu besoin de la parole pour apprendre à penser, ils ont eu bien plus besoin encore de savoir penser pour trouver l'art de la parole »**. Autrement dit, il faut penser pour parler, mais il faut tout autant parler pour penser.

    Ce second cercle porte précisément sur le lien entre parole et abstraction. Les mots ne désignent pas seulement des objets singuliers (sans quoi les langues seraient des collections de noms propres) ; ils renvoient à des catégories générales, qui supposent une activité de pensée irréductible aux sensations immédiates. Mais cette généralisation elle-même n'est concevable qu'à l'aide de mots : les idées générales, précise Rousseau ailleurs dans le même texte, ne peuvent s'introduire dans l'esprit qu'à l'aide des mots. Le problème se complique encore pour les êtres purement abstraits (matière, esprit, substance), qu'aucun geste, aucune onomatopée, ne peut indiquer.

    Rousseau conclut par un aveu de modestie qui est aussi une mise en garde : cet « art sublime » de communiquer ses pensées reste si loin de sa perfection qu'aucun homme, si hardi soit-il, ne saurait garantir qu'il y parviendra un jour, quand bien même des siècles entiers y seraient consacrés sans interruption.

    ! Piège : le double cercle n'est pas un simple embarras rhétorique ; c'est une aporie logique, qui interdit toute explication continuiste (naturaliste) du passage entre l'absence de langage et le langage humain.
  passage:
    source: "Discours sur l'origine et les fondements de l'inégalité"
    label: "Fragment 3"
    text: "Supposons cette première difficulté vaincue : franchissons pour un moment l'espace immense qui dut se trouver entre le pur état de nature et le besoin des langues ; et cherchons, en les supposant nécessaires, comment elles purent commencer à s'établir. Nouvelle difficulté pire encore que la précédente ; car si les hommes ont eu besoin de la parole pour apprendre à penser, ils ont eu bien plus besoin encore de savoir penser pour trouver l'art de la parole. Et quand on comprendrait comment les sons de la voix ont été pris pour les interprètes conventionnels de nos idées, il resterait toujours à savoir quels ont pu être les interprètes mêmes de cette convention pour les idées qui, n'ayant point un objet sensible, ne pouvaient s'indiquer ni par le geste, ni par la voix, de sorte qu'à peine peut-on former des conjectures supportables sur la naissance de cet art de communiquer ses pensées, et d'établir un commerce entre les esprits : art sublime qui est déjà si loin de son origine, mais que le philosophe voit encore à une si prodigieuse distance de sa perfection, qu'il n'y a point d'homme assez hardi, pour assurer qu'il y arriverait jamais, quand les révolutions que le temps amène nécessairement seraient suspendues en sa faveur, que les préjugés sortiraient des académies ou se tairaient devant elles, et qu'elles pourraient s'occuper de cet objet épineux, durant des siècles entiers sans interruption."
