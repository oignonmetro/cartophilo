- id: rousseau-humanite-cs2
  title: "Ce que l'homme perd et gagne : les deux libertés"
  notes: |-
    Rousseau dresse ici le bilan précis de ce que l'homme perd et gagne au contrat social. Il perd sa **liberté naturelle**, un droit illimité à tout ce qu'il désire et peut atteindre ; il gagne la **liberté civile**, et la **propriété** de ce qu'il possède, là où il n'avait auparavant que la simple possession.

    Le paragraphe distingue ensuite, terme à terme, les deux couples de notions que la confusion guette : la liberté naturelle n'a pour bornes que les forces de l'individu, quand la liberté civile est limitée par la volonté générale ; la possession n'est que l'effet de la force ou le droit du premier occupant, quand la propriété suppose un titre positif, c'est-à-dire une reconnaissance instituée par le droit. Liberté et propriété sont ainsi les deux concepts sous lesquels Rousseau reprend les grandes divisions du droit civil héritées du droit romain : les choses et les personnes.

    ! Piège : la « liberté civile » dont il est ici question est celle du *sujet* de droit civil, non celle du *citoyen* : il serait absurde d'en conclure que la liberté du citoyen serait, elle aussi, limitée par la volonté générale. La liberté du citoyen, comme celle du souverain dont elle est partie constitutive, n'a d'autre borne que la nature du contrat.
  passage:
    source: "Du contrat social, I, 8"
    label: "§2"
    text: "Réduisons toute cette balance à des termes faciles à comparer. Ce que l'homme perd par le contrat social, c'est sa liberté naturelle et un droit illimité à tout ce qui le tente et qu'il peut atteindre ; ce qu'il gagne, c'est la liberté civile et la propriété de tout ce qu'il possède. Pour ne pas se tromper dans ces compensations, il faut bien distinguer la liberté naturelle qui n'a pour bornes que les forces de l'individu, de la liberté civile qui est limitée par la volonté générale, et la possession qui n'est que l'effet de la force ou le droit du premier occupant, de la propriété qui ne peut être fondée que sur un titre positif."
