- id: rousseau-humanite-f4
  title: "Du cri de la nature au langage articulé"
  notes: |-
    Après avoir montré que le langage humain ne peut naître d'aucun processus naturel continu, Rousseau retrace malgré tout, à titre d'hypothèse, une genèse : le premier langage de l'homme n'est pas encore un langage instauré, mais **le cri de la nature**, une réaction purement instinctive qui implore du secours dans le danger. Ce cri suffit dans les occasions pressantes ; il ne sert guère dans le cours ordinaire de la vie, où les sentiments sont plus modérés.

    Quand les échanges se multiplient, les hommes cherchent des signes plus nombreux : ils combinent d'abord la voix et le **geste**, plus expressif et moins conventionnel. Mais le geste a ses limites (il ne vaut que pour ce qui est visible et présent, il échoue dans l'obscurité) ; aussi finit-on par lui substituer les articulations de la voix comme **signes institués**, c'est-à-dire des signes purement conventionnels, sans rapport naturel avec ce qu'ils désignent.

    Le texte se referme sur la formule qui clôt tout le développement : une telle substitution ne pouvait se faire que d'un commun consentement, un accord qui devait lui-même être motivé ; or **la parole paraît avoir été fort nécessaire, pour établir l'usage de la parole**. Le cercle initial (fragment 3) se referme ainsi exactement là où il s'était ouvert.

    ! Piège : le « cri de la nature » n'est pas un premier stade du langage humain proprement dit, mais son exact opposé : un signal naturel et univoque, quand le langage institué est conventionnel et arbitraire. C'est justement le passage de l'un à l'autre qui reste inexpliqué.
  passage:
    source: "Discours sur l'origine et les fondements de l'inégalité"
    label: "Fragment 4"
    text: "Le premier langage de l'homme, le langage le plus universel, le plus énergique, et le seul dont il eut besoin, avant qu'il fallût persuader des hommes assemblés, est le cri de la nature. Comme ce cri n'était arraché que par une sorte d'instinct dans les occasions pressantes, pour implorer du secours dans les grands dangers, ou du soulagement dans les maux violents, il n'était pas d'un grand usage dans le cours ordinaire de la vie, où règnent des sentiments plus modérés. Quand les idées des hommes commencèrent à s'étendre et à se multiplier, et qu'il s'établit entre eux une communication plus étroite, ils cherchèrent des signes plus nombreux et un langage plus étendu : ils multiplièrent les inflexions de la voix, et y joignirent les gestes, qui, par leur nature, sont plus expressifs, et dont le sens dépend moins d'une détermination antérieure. Ils exprimaient donc les objets visibles et mobiles par des gestes, et ceux qui frappent l'ouïe, par des sons imitatifs. Mais comme le geste n'indique guère que les objets présents, ou faciles à décrire, et les actions visibles ; qu'il n'est pas d'un usage universel, puisque l'obscurité, ou l'interposition d'un corps le rendent inutile, et qu'il exige l'attention plutôt qu'il ne l'excite ; on s'avisa enfin de lui substituer les articulations de la voix, qui, sans avoir le même rapport avec certaines idées, sont plus propres à les représenter toutes, comme signes institués ; substitution qui ne put se faire que d'un commun consentement, et d'une manière assez difficile à pratiquer pour des hommes dont les organes grossiers n'avaient encore aucun exercice, et plus difficile encore à concevoir en elle-même, puisque cet accord unanime dut être motivé, et que la parole paraît avoir été fort nécessaire, pour établir l'usage de la parole."
