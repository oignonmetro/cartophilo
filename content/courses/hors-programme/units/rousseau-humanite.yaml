- id: "rousseau-humanite-cs1b"
  title: "D'un animal stupide et borné, un être intelligent"
  notes: |-
    Rousseau détaille ensuite le bénéfice de ce changement : les facultés de l'homme s'exercent et se développent, ses idées s'étendent, ses sentiments s'ennoblissent, son âme tout entière s'élève, au point qu'il devrait bénir sans cesse l'instant qui, « d'un animal stupide et borné », fit de lui « un être intelligent et un homme ». Mais cette formule si positive porte en elle une réserve capitale, qu'il ne faut pas manquer de relever : {red}**les abus de la condition civile peuvent dégrader l'homme au-dessous même de l'état dont il est sorti**{/red}. Le schéma n'est donc pas binaire (état de nature bon, état civil mauvais, ou l'inverse), mais ternaire : {amber}état de nature, état civil corrompu{/amber} (celui que le {sky}Second Discours{/sky} a décrit et dénoncé), état civil légitime, dont ce chapitre du *Contrat social* entend précisément établir les fondements.

    ! Piège : ce paragraphe ne fait pas l'éloge inconditionnel de la société telle qu'elle existe. Rousseau rappellera ailleurs ({sky}*Lettre à Christophe de Beaumont*{/sky}) que l'homme de l'état de nature est « borné au seul instinct physique, il est nul, il est bête » : c'est la perfectibilité *virtuelle* que révèle le passage à l'état civil, non une garantie de progrès.
  passage:
    label: "§1"
    source: "Du contrat social, I, 8"
    text: "Quoiqu'il se prive dans cet état de plusieurs avantages qu'il tient de la nature, il en regagne de si grands, ses facultés s'exercent et se développent, ses idées s'étendent, ses sentiments s'ennoblissent, son âme tout entière s'élève à tel point, que si les abus de cette nouvelle condition ne le dégradaient souvent au-dessous de celle dont il est sorti, il devrait bénir sans cesse l'instant heureux qui l'en arracha pour jamais, et qui, d'un animal stupide et borné, fit un être intelligent et un homme."
