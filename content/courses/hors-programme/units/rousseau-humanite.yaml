id: rousseau-humanite
title: "Rousseau : l'homme naturel et l'homme social"
subtitle: "Discours sur l'inégalité ; Du contrat social, I, 8"
icon: page
color: orange
intro: |-
  Deux textes de Rousseau, lus l'un à la lumière de l'autre : un extrait du *Discours sur
  l'origine et les fondements de l'inégalité* (le Second Discours), sur l'origine du langage,
  puis le chapitre huit du premier livre du *Contrat social*, sur le passage de l'état de
  nature à l'état civil. Ensemble, ils permettent d'élucider le statut de l'homme naturel dans
  la philosophie de Rousseau, et de comprendre ce que la société lui apporte.
lessons:
- id: rousseau-humanite-i1
  title: "Rousseau, penseur de la nature ou père des sciences sociales ?"
  notes: |-
    Rousseau est reçu comme le penseur par excellence de l'état de nature et de la bonté originelle de l'homme, au point que Voltaire a pu le caricaturer en ardent défenseur d'un retour à la vie naturelle. Mais cette image entre en tension avec un autre héritage : Durkheim voit très tôt en Rousseau celui qui reconnaît à la société un niveau de réalité qui dépasse les individus et agit sur eux, le plaçant ainsi dans la préhistoire de la sociologie ; Lévi-Strauss, de son côté, fait de lui l'un des pères des sciences humaines, notamment à cause des longues notes du *Second Discours*, où Rousseau décrit avec précision la variabilité des modes de vie de l'humanité, intégrant un regard ethnographique à sa démarche philosophique.

    Il y a donc un paradoxe à faire de Rousseau à la fois le chantre de l'état de nature et l'un des précurseurs des sciences de l'homme, qui posent pourtant comme axiome que l'homme est indissociable de la société, déterminé par son appartenance à elle. L'élucider suppose d'abord de préciser le statut de l'homme naturel dans la philosophie de Rousseau, puis de comprendre ce que la société lui apporte : c'est ce que les deux textes de cette unité, l'un tiré du *Discours sur l'origine de l'inégalité* (le Second Discours), l'autre du *Contrat social*, permettent d'établir l'un après l'autre.
