- id: "rousseau-humanite-cs2b"
  title: "Liberté naturelle et liberté civile, possession et propriété"
  notes: |-
    Le paragraphe distingue ensuite, terme à terme, les deux couples de notions que la confusion guette : {coral}la liberté naturelle n'a pour bornes que les forces de l'individu, quand la liberté civile est limitée par la volonté générale{/coral} ; la possession n'est que l'effet de la force ou le droit du premier occupant, quand la propriété suppose un titre positif, c'est-à-dire une reconnaissance instituée par le droit. Liberté et propriété sont ainsi les deux concepts sous lesquels Rousseau reprend les grandes divisions du droit civil héritées du droit romain : les choses et les personnes.

    ! Piège : la « liberté civile » dont il est ici question est celle du *sujet* de droit civil, non celle du *citoyen* : {red}il serait absurde d'en conclure que la liberté du citoyen serait, elle aussi, limitée par la volonté générale{/red}. La liberté du citoyen, comme celle du souverain dont elle est partie constitutive, n'a d'autre borne que la nature du contrat.
  passage:
    label: "§2"
    source: "Du contrat social, I, 8"
    text: "Pour ne pas se tromper dans ces compensations, il faut bien distinguer la liberté naturelle qui n'a pour bornes que les forces de l'individu, de la liberté civile qui est limitée par la volonté générale, et la possession qui n'est que l'effet de la force ou le droit du premier occupant, de la propriété qui ne peut être fondée que sur un titre positif."
  points:
  - id: "rousseau-humanite-cs2-3"
