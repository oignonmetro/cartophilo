# Refondue le 2026-11-26 (niveau normale) : les deux textes gardés ensemble ;
# les fragments longs coupés selon leurs fragments de citation, leurs rappels
# répartis paragraphe par paragraphe sans rien retirer et complétés pour les
# leçons nouvelles ; plan ajouté à la première introduction.

id: "rousseau-humanite"
title: "Rousseau : l'homme naturel et l'homme social"
subtitle: "Discours sur l'inégalité ; Du contrat social, I, 8"
icon: "page"
color: "orange"
depth: "normale"
intro: |-
  Deux textes de Rousseau, lus l'un à la lumière de l'autre : un extrait du *Discours sur
  l'origine et les fondements de l'inégalité* (le Second Discours), sur l'origine du langage,
  puis le chapitre huit du premier livre du *Contrat social*, sur le passage de l'état de
  nature à l'état civil. Ensemble, ils permettent d'élucider le statut de l'homme naturel dans
  la philosophie de Rousseau, et de comprendre ce que la société lui apporte.
lessons:
- id: "rousseau-humanite-i1"
  title: "Rousseau, penseur de la nature ou père des sciences sociales ?"
  notes: |-
    Rousseau est reçu comme le penseur par excellence de l'{violet}état de nature{/violet} et de la bonté originelle de l'homme, au point que {sky}Voltaire{/sky} a pu le caricaturer en ardent défenseur d'un retour à la vie naturelle. Mais cette image entre en tension avec un autre héritage : {sky}Durkheim{/sky} voit très tôt en Rousseau celui qui reconnaît à la société un niveau de réalité qui dépasse les individus et agit sur eux, le plaçant ainsi dans la préhistoire de la sociologie ; {sky}Lévi-Strauss{/sky}, de son côté, fait de lui l'un des pères des sciences humaines, notamment à cause des longues notes du {sky}*Second Discours*{/sky}, où Rousseau décrit avec précision la variabilité des modes de vie de l'humanité, intégrant un regard ethnographique à sa démarche philosophique.

    {red}Il y a donc un paradoxe à faire de Rousseau à la fois le chantre de l'état de nature et l'un des précurseurs des sciences de l'homme{/red}, qui posent pourtant {coral}comme axiome que l'homme est indissociable de la société{/coral}, déterminé par son appartenance à elle. L'élucider suppose d'abord de préciser le statut de l'homme naturel dans la philosophie de Rousseau, puis de comprendre ce que la société lui apporte : c'est ce que les deux textes de cette unité, l'un tiré du {sky}*Discours sur l'origine de l'inégalité*{/sky} (le Second Discours), l'autre du {sky}*Contrat social*{/sky}, permettent d'établir l'un après l'autre.

    **Le plan des deux textes.**

    | Mouvement | Lieu | Ce qui s'y joue |
    | écarter la solution de Condillac | Fragment 1 | Condillac suppose déjà une société entre les inventeurs du langage, ce qu'il faudrait expliquer. |
    | écarter la famille | Fragment 2 | La famille n'est pas naturelle : dans l'état primitif, rien ne fixe les hommes ensemble, et l'enfant inventerait sa propre langue. |
    | poser le double cercle | Fragment 3 | Il faut parler pour penser et penser pour parler : le passage au langage est une aporie. |
    | retracer une genèse hypothétique | Fragment 4 | Du cri de la nature au geste, puis aux signes institués, qui supposent un consentement que seule la parole permettrait. |
    | dire ce que l'état civil apporte | §1 | La justice remplace l'instinct, l'homme devient moral et intelligent, sauf abus de la nouvelle condition. |
    | faire la balance des pertes et des gains | §2 | L'homme perd la liberté naturelle et la possession, gagne la liberté civile et la propriété. |
    | ajouter la liberté morale | §3 | Obéir à la loi qu'on s'est prescrite, c'est être maître de soi. |
