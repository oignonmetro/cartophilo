- id: "rousseau-humanite-f2b"
  title: "L'état primitif : ni maison, ni famille durable"
  notes: |-
    **Rousseau décrit l'état primitif :** {coral}**aucune habitation, des unions fortuites, des enfants qui quittent leur mère dès qu'ils peuvent se nourrir.**{/coral}

    **Pourquoi « ni maison, ni cabanes, ni propriété » ?** Ce sont les conditions d'une {amber}vie commune durable{/amber}, et elles manquent toutes : {yellow}chacun dort où la nuit le surprend{/yellow}. Rien ne retient les hommes ensemble, donc rien ne les oblige à se parler.

    **Pourquoi « selon la rencontre, l'occasion, et le désir » ?** Les unions sont {red}fortuites{/red} : elles naissent d'un hasard et finissent aussitôt. {teal}« Ils se quittaient avec la même facilité »{/teal} : la parole n'est pas un interprète nécessaire de ce qu'ils ont à se dire.

    **Pourquoi la mère et l'enfant ?** Même ce lien, le plus naturel en apparence, est {amber}passager{/amber} : la mère allaite d'abord {red}pour son propre besoin{/red}, puis par habitude ; l'enfant la quitte dès qu'il peut chercher sa pâture, et {coral}faute de se voir, ils ne se reconnaissent bientôt plus{/coral}.

    ! Rousseau ne décrit pas des êtres {red}sans cœur{/red} : l'habitude rend les enfants chers à la mère. Il décrit {green}des liens qui ne durent pas{/green}.
  passage:
    label: "Fragment 2"
    source: "Discours sur l'origine et les fondements de l'inégalité"
    text: "Au lieu que dans cet état primitif, n'ayant ni maison, ni cabanes, ni propriété d'aucune espèce, chacun se logeait au hasard, et souvent pour une seule nuit ; les mâles, et les femelles s'unissaient fortuitement selon la rencontre, l'occasion, et le désir, sans que la parole fût un interprète fort nécessaire des choses qu'ils avaient à se dire : ils se quittaient avec la même facilité. La mère allaitait d'abord ses enfants pour son propre besoin ; puis l'habitude les lui ayant rendus chers, elle les nourrissait ensuite pour le leur ; sitôt qu'ils avaient la force de chercher leur pâture, ils ne tardaient pas à quitter la mère elle-même ; et comme il n'y avait presque point d'autre moyen de se retrouver que de ne se pas perdre de vue, ils en étaient bientôt au point de ne pas même se reconnaître les uns les autres."
