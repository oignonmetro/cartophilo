- id: "rousseau-humanite-f3b"
  title: "Les idées sans objet sensible"
  notes: |-
    Ce second cercle porte précisément sur le lien entre parole et abstraction. Les mots ne désignent pas seulement des objets singuliers (sans quoi les langues seraient des collections de noms propres) ; ils renvoient à des catégories générales, qui supposent une activité de pensée irréductible aux sensations immédiates. Mais cette généralisation elle-même n'est concevable qu'à l'aide de mots : les idées générales, précise Rousseau ailleurs dans le même texte, {coral}ne peuvent s'introduire dans l'esprit qu'à l'aide des mots{/coral}. Le problème se complique encore pour les êtres purement abstraits (matière, esprit, substance), qu'aucun geste, aucune onomatopée, ne peut indiquer.

    Rousseau conclut par un aveu de modestie qui est aussi une mise en garde : cet {teal}« {/teal}art {teal}sublime »{/teal} de communiquer ses pensées reste si loin de sa perfection qu'aucun homme, si hardi soit-il, ne saurait garantir qu'il y parviendra un jour, quand bien même des siècles entiers y seraient consacrés sans interruption.

    ! Piège : le double cercle n'est pas un simple embarras rhétorique ; c'est une {violet}aporie logique{/violet}, qui interdit toute explication continuiste (naturaliste) du passage entre l'absence de langage et le langage humain.
  passage:
    label: "Fragment 3"
    source: "Discours sur l'origine et les fondements de l'inégalité"
    text: "Et quand on comprendrait comment les sons de la voix ont été pris pour les interprètes conventionnels de nos idées, il resterait toujours à savoir quels ont pu être les interprètes mêmes de cette convention pour les idées qui, n'ayant point un objet sensible, ne pouvaient s'indiquer ni par le geste, ni par la voix, de sorte qu'à peine peut-on former des conjectures supportables sur la naissance de cet art de communiquer ses pensées, et d'établir un commerce entre les esprits : art sublime qui est déjà si loin de son origine, mais que le philosophe voit encore à une si prodigieuse distance de sa perfection, qu'il n'y a point d'homme assez hardi, pour assurer qu'il y arriverait jamais, quand les révolutions que le temps amène nécessairement seraient suspendues en sa faveur, que les préjugés sortiraient des académies ou se tairaient devant elles, et qu'elles pourraient s'occuper de cet objet épineux, durant des siècles entiers sans interruption."
