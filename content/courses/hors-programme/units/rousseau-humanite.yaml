- id: rousseau-humanite-cs1
  title: "Le passage de l'état de nature à l'état civil"
  notes: |-
    Avec le *Contrat social*, Rousseau décrit enfin ce que la société apporte réellement à l'homme, une fois légitimement instituée. Le passage à l'état civil produit un changement que Rousseau qualifie lui-même de « très remarquable » : **la justice se substitue à l'instinct**, et les actions de l'homme acquièrent une moralité qu'elles n'avaient pas auparavant. Concrètement, « la voix du devoir » succède à « l'impulsion physique », et « le droit » à « l'appétit » : l'homme, qui ne regardait jusque-là que lui-même, doit désormais consulter sa raison avant d'écouter ses penchants.

    Rousseau détaille ensuite le bénéfice de ce changement : les facultés de l'homme s'exercent et se développent, ses idées s'étendent, ses sentiments s'ennoblissent, son âme tout entière s'élève, au point qu'il devrait bénir sans cesse l'instant qui, « d'un animal stupide et borné », fit de lui « un être intelligent et un homme ». Mais cette formule si positive porte en elle une réserve capitale, qu'il ne faut pas manquer de relever : **les abus de la condition civile peuvent dégrader l'homme au-dessous même de l'état dont il est sorti**. Le schéma n'est donc pas binaire (état de nature bon, état civil mauvais, ou l'inverse), mais ternaire : état de nature, état civil corrompu (celui que le Second Discours a décrit et dénoncé), état civil légitime, dont ce chapitre du *Contrat social* entend précisément établir les fondements.

    ! Piège : ce paragraphe ne fait pas l'éloge inconditionnel de la société telle qu'elle existe. Rousseau rappellera ailleurs (*Lettre à Christophe de Beaumont*) que l'homme de l'état de nature est « borné au seul instinct physique, il est nul, il est bête » : c'est la perfectibilité *virtuelle* que révèle le passage à l'état civil, non une garantie de progrès.
  passage:
    source: "Du contrat social, I, 8"
    label: "§1"
    text: "Ce passage de l'état de nature à l'état civil produit dans l'homme un changement très remarquable, en substituant dans sa conduite la justice à l'instinct, et donnant à ses actions la moralité qui leur manquait auparavant. C'est alors seulement que la voix du devoir succédant à l'impulsion physique et le droit à l'appétit, l'homme, qui jusque-là n'avait regardé que lui-même, se voit forcé d'agir sur d'autres principes, et de consulter sa raison avant d'écouter ses penchants. Quoiqu'il se prive dans cet état de plusieurs avantages qu'il tient de la nature, il en regagne de si grands, ses facultés s'exercent et se développent, ses idées s'étendent, ses sentiments s'ennoblissent, son âme tout entière s'élève à tel point, que si les abus de cette nouvelle condition ne le dégradaient souvent au-dessous de celle dont il est sorti, il devrait bénir sans cesse l'instant heureux qui l'en arracha pour jamais, et qui, d'un animal stupide et borné, fit un être intelligent et un homme."
