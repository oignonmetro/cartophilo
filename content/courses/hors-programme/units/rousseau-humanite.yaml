- id: "rousseau-humanite-cs1"
  title: "La justice substituée à l'instinct"
  notes: |-
    Avec le {sky}*Contrat social*{/sky}, Rousseau décrit enfin ce que la société apporte réellement à l'homme, une fois légitimement instituée. Le passage à l'état civil produit un changement que Rousseau qualifie lui-même de {teal}« très remarquable »{/teal} : {green}**la justice se substitue à l'instinct**{/green}, et les actions de l'homme acquièrent une moralité qu'elles n'avaient pas auparavant. Concrètement, {teal}« {/teal}la voix du devoir » succède à {teal}« {/teal}{teal}l'impulsion physique »{/teal}, et « le droit » à « {teal}l'appétit »{/teal} : l'homme, qui ne regardait jusque-là que lui-même, doit désormais consulter sa raison avant d'écouter ses penchants.
  passage:
    label: "§1"
    source: "Du contrat social, I, 8"
    text: "Ce passage de l'état de nature à l'état civil produit dans l'homme un changement très remarquable, en substituant dans sa conduite la justice à l'instinct, et donnant à ses actions la moralité qui leur manquait auparavant. C'est alors seulement que la voix du devoir succédant à l'impulsion physique et le droit à l'appétit, l'homme, qui jusque-là n'avait regardé que lui-même, se voit forcé d'agir sur d'autres principes, et de consulter sa raison avant d'écouter ses penchants."
  points:
  - id: "rousseau-humanite-cs1-1"
