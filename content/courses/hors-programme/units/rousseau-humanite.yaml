- id: "rousseau-humanite-f2"
  title: "Pourquoi la famille n'explique pas l'invention du langage"
  notes: |-
    Rousseau écarte ensuite l'explication la plus immédiate : les langues seraient nées dans le commerce domestique des pères, des mères et des enfants. Cette hypothèse, dit-il, commet {red}**la faute de ceux qui raisonnent sur l'état de nature en y transportant les idées prises dans la société**{/red} : elle imagine une famille rassemblée dans une même habitation, unie par des liens aussi intimes et permanents que les nôtres, alors que rien, dans l'état primitif, ne fixe durablement les hommes ensemble.

    **Pourquoi « comment elles purent devenir nécessaires » ?** La première difficulté est celle du {amber}besoin{/amber} : des hommes sans relations entre eux n'ont {red}aucune raison d'inventer une langue{/red}, et l'on ne conçoit pas qu'ils l'aient pu si elle n'était pas indispensable.

    ! Rousseau ne reproche pas à l'hypothèse familiale d'être {red}fausse dans nos sociétés{/red}, mais de {green}projeter nos sociétés dans l'état de nature{/green}.
  passage:
    label: "Fragment 2"
    source: "Discours sur l'origine et les fondements de l'inégalité"
    text: "La première qui se présente est d'imaginer comment elles purent devenir nécessaires ; car les hommes n'ayant nulle correspondance entre eux, ni aucun besoin d'en avoir, on ne conçoit ni la nécessité de cette invention, ni sa possibilité, si elle ne fut pas indispensable. Je dirais bien, comme beaucoup d'autres, que les langues sont nées dans le commerce domestique des pères, des mères, et des enfants : mais outre que cela ne résoudrait point les objections, ce serait commettre la faute de ceux qui raisonnant sur l'état de nature, y transportent les idées prises dans la société, voient toujours la famille rassemblée dans une même habitation, et ses membres gardant entre eux une union aussi intime et aussi permanente que parmi nous, où tant d'intérêts communs les réunissent."
  points:
  - id: "rousseau-humanite-f2-1"
    sentence: "« La première qui se présente est d'imaginer comment elles purent devenir nécessaires ; car les hommes n'ayant nulle correspondance entre eux, ni aucun besoin d'en avoir, on ne conçoit ni la nécessité de cette invention, ni sa possibilité, si elle ne fut pas indispensable. Je dirais bien, comme beaucoup d'autres, que les langues sont nées dans le commerce domestique des pères, des mères, et des enfants : mais outre que cela ne résoudrait point les objections, __ce serait commettre__ ___, voient toujours la **famille rassemblée** dans une même habitation, et ses membres gardant entre eux une union aussi intime et aussi permanente que parmi nous, où tant d'intérêts communs les réunissent. »"
    answer: "la faute de ceux qui raisonnant sur l'état de nature, y transportent les idées prises dans la société"
