- id: "rousseau-humanite-cs2"
  title: "La balance : ce que l'homme perd et gagne"
  notes: |-
    Rousseau dresse ici le bilan précis de ce que l'homme perd et gagne au contrat social. Il perd sa {violet}**liberté naturelle**{/violet}, un droit illimité à tout ce qu'il désire et peut atteindre ; il gagne la {violet}**liberté civile**{/violet}, et la {violet}**propriété**{/violet} de ce qu'il possède, là où il n'avait auparavant que la simple possession.
  passage:
    label: "§2"
    source: "Du contrat social, I, 8"
    text: "Réduisons toute cette balance à des termes faciles à comparer. Ce que l'homme perd par le contrat social, c'est sa liberté naturelle et un droit illimité à tout ce qui le tente et qu'il peut atteindre ; ce qu'il gagne, c'est la liberté civile et la propriété de tout ce qu'il possède."
