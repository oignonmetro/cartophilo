- id: "rousseau-humanite-f4"
  title: "Le cri de la nature"
  notes: |-
    Après avoir montré que le langage humain ne peut naître d'aucun processus naturel continu, Rousseau retrace malgré tout, à titre d'hypothèse, une genèse : le premier langage de l'homme n'est pas encore un langage instauré, mais {green}**le cri de la nature**{/green}, une réaction purement instinctive qui implore du secours dans le danger. Ce cri suffit dans les occasions pressantes ; il ne sert guère dans le cours ordinaire de la vie, où les sentiments sont plus modérés.
  passage:
    label: "Fragment 4"
    source: "Discours sur l'origine et les fondements de l'inégalité"
    text: "Le premier langage de l'homme, le langage le plus universel, le plus énergique, et le seul dont il eut besoin, avant qu'il fallût persuader des hommes assemblés, est le cri de la nature. Comme ce cri n'était arraché que par une sorte d'instinct dans les occasions pressantes, pour implorer du secours dans les grands dangers, ou du soulagement dans les maux violents, il n'était pas d'un grand usage dans le cours ordinaire de la vie, où règnent des sentiments plus modérés."
  points:
  - id: "rousseau-humanite-f4-1"
    sentence: "« Le premier langage de l'homme, le langage le plus universel, le **plus énergique**, __et le seul dont il eut besoin, avant qu'il fallût persuader des hommes assemblés, est__ ___. Comme ce cri n'était arraché que par une sorte d'instinct dans les occasions pressantes, pour implorer du secours dans les grands dangers, ou du soulagement dans les maux violents, il n'était pas d'un grand usage dans le cours ordinaire de la vie, où règnent des sentiments plus modérés. »"
    answer: "le cri de la nature"
