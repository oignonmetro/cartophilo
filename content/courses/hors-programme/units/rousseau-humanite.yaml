- id: "rousseau-humanite-f2c"
  title: "L'enfant, inventeur de sa propre langue"
  notes: |-
    Rousseau développe alors, contre {sky}Locke{/sky}, une thèse essentielle : {green}la famille n'est pas un fait de nature, mais une institution qui suppose déjà la société{/green}. Dans l'état primitif, chacun se loge au hasard, les unions sont fortuites, et la mère elle-même n'allaite et ne nourrit son enfant que par intérêt immédiat ; l'enfant, sitôt en état de chercher sa pâture, la quitte, et ils cessent bientôt de se reconnaître. Plus surprenant encore : puisque c'est l'enfant qui a le plus de besoins à faire comprendre, {coral}**c'est lui, et non la mère, qui invente l'essentiel de son propre langage**{/coral} ; ce qui, loin d'unifier une langue commune, la multiplierait autant qu'il y a d'individus. Le paragraphe se referme sur une distinction décisive, qui vaut pour toute la suite du texte : que la mère dicte à l'enfant des mots montre seulement comment on *enseigne* des langues déjà formées ; cela n'apprend rien sur la manière dont elles se *forment*.

    ! Piège : ce paragraphe ne nie pas que des enfants apprennent une langue de leurs parents (un fait patent) ; il nie seulement que ce fait explique l'invention du langage, qui suppose déjà résolu ce qui reste à expliquer.
  passage:
    label: "Fragment 2"
    source: "Discours sur l'origine et les fondements de l'inégalité"
    text: "Remarquez encore que l'enfant ayant tous ses besoins à expliquer, et par conséquent plus de choses à dire à la mère, que la mère à l'enfant, c'est lui qui doit faire les plus grands frais de l'invention, et que la langue qu'il emploie doit être en grande partie son propre ouvrage ; ce qui multiplie autant les langues qu'il y a d'individus pour les parler, à quoi contribue encore la vie errante, et vagabonde qui ne laisse à aucun idiome le temps de prendre de la consistance. Car de dire que la mère dicte à l'enfant les mots dont il devra se servir pour lui demander telle, ou telle chose, cela montre bien comment on enseigne des langues déjà formées, mais cela n'apprend point comment elles se forment."
  points:
  - id: "rousseau-humanite-f2-6"
    sentence: "« Remarquez encore que l'enfant __ayant tous ses **besoins** à expliquer, et par conséquent plus de choses à dire à la mère, que la mère à l'enfant,__ ___, et que la langue qu'il emploie doit être en grande partie son propre ouvrage ; ce qui multiplie autant les langues qu'il y a d'individus pour les parler, à quoi contribue encore la vie errante, et vagabonde qui ne laisse à aucun idiome le temps de prendre de la consistance. »"
