- id: "rousseau-humanite-f4b"
  title: "Du geste aux signes institués"
  notes: |-
    Quand les échanges se multiplient, les hommes cherchent des signes plus nombreux : ils combinent d'abord la voix et le {violet}**geste**{/violet}, plus expressif et moins conventionnel. Mais le geste a ses limites (il ne vaut que pour ce qui est visible et présent, il échoue dans l'obscurité) ; aussi finit-on par lui substituer les articulations de la voix comme {violet}**signes institués**{/violet}, c'est-à-dire des signes purement conventionnels, sans rapport naturel avec ce qu'ils désignent.

    Le texte se referme sur la formule qui clôt tout le développement : une telle substitution ne pouvait se faire que d'un commun consentement, un accord qui devait lui-même être motivé ; or {coral}**la parole paraît avoir été fort nécessaire, pour établir l'usage de la parole**{/coral}. Le cercle initial (fragment 3) se referme ainsi exactement là où il s'était ouvert.

    ! Piège : le « cri de la nature » n'est pas un premier stade du langage humain proprement dit, mais son exact opposé : un signal naturel et univoque, quand le langage institué est conventionnel et arbitraire. C'est justement le passage de l'un à l'autre qui reste inexpliqué.
  passage:
    label: "Fragment 4"
    source: "Discours sur l'origine et les fondements de l'inégalité"
    text: "Quand les idées des hommes commencèrent à s'étendre et à se multiplier, et qu'il s'établit entre eux une communication plus étroite, ils cherchèrent des signes plus nombreux et un langage plus étendu : ils multiplièrent les inflexions de la voix, et y joignirent les gestes, qui, par leur nature, sont plus expressifs, et dont le sens dépend moins d'une détermination antérieure. Ils exprimaient donc les objets visibles et mobiles par des gestes, et ceux qui frappent l'ouïe, par des sons imitatifs. Mais comme le geste n'indique guère que les objets présents, ou faciles à décrire, et les actions visibles ; qu'il n'est pas d'un usage universel, puisque l'obscurité, ou l'interposition d'un corps le rendent inutile, et qu'il exige l'attention plutôt qu'il ne l'excite ; on s'avisa enfin de lui substituer les articulations de la voix, qui, sans avoir le même rapport avec certaines idées, sont plus propres à les représenter toutes, comme signes institués ; substitution qui ne put se faire que d'un commun consentement, et d'une manière assez difficile à pratiquer pour des hommes dont les organes grossiers n'avaient encore aucun exercice, et plus difficile encore à concevoir en elle-même, puisque cet accord unanime dut être motivé, et que la parole paraît avoir été fort nécessaire, pour établir l'usage de la parole."
