- id: rousseau-humanite-f2
  title: "Pourquoi la famille n'explique pas l'invention du langage"
  notes: |-
    Rousseau écarte ensuite l'explication la plus immédiate : les langues seraient nées dans le commerce domestique des pères, des mères et des enfants. Cette hypothèse, dit-il, commet **la faute de ceux qui raisonnent sur l'état de nature en y transportant les idées prises dans la société** : elle imagine une famille rassemblée dans une même habitation, unie par des liens aussi intimes et permanents que les nôtres, alors que rien, dans l'état primitif, ne fixe durablement les hommes ensemble.

    Rousseau développe alors, contre Locke, une thèse essentielle : la famille n'est pas un fait de nature, mais une institution qui suppose déjà la société. Dans l'état primitif, chacun se loge au hasard, les unions sont fortuites, et la mère elle-même n'allaite et ne nourrit son enfant que par intérêt immédiat ; l'enfant, sitôt en état de chercher sa pâture, la quitte, et ils cessent bientôt de se reconnaître. Plus surprenant encore : puisque c'est l'enfant qui a le plus de besoins à faire comprendre, **c'est lui, et non la mère, qui invente l'essentiel de son propre langage** ; ce qui, loin d'unifier une langue commune, la multiplierait autant qu'il y a d'individus. Le paragraphe se referme sur une distinction décisive, qui vaut pour toute la suite du texte : que la mère dicte à l'enfant des mots montre seulement comment on *enseigne* des langues déjà formées ; cela n'apprend rien sur la manière dont elles se *forment*.

    ! Piège : ce paragraphe ne nie pas que des enfants apprennent une langue de leurs parents (un fait patent) ; il nie seulement que ce fait explique l'invention du langage, qui suppose déjà résolu ce qui reste à expliquer.
  passage:
    source: "Discours sur l'origine et les fondements de l'inégalité"
    label: "Fragment 2"
    text: "La première qui se présente est d'imaginer comment elles purent devenir nécessaires ; car les hommes n'ayant nulle correspondance entre eux, ni aucun besoin d'en avoir, on ne conçoit ni la nécessité de cette invention, ni sa possibilité, si elle ne fut pas indispensable. Je dirais bien, comme beaucoup d'autres, que les langues sont nées dans le commerce domestique des pères, des mères, et des enfants : mais outre que cela ne résoudrait point les objections, ce serait commettre la faute de ceux qui raisonnant sur l'état de nature, y transportent les idées prises dans la société, voient toujours la famille rassemblée dans une même habitation, et ses membres gardant entre eux une union aussi intime et aussi permanente que parmi nous, où tant d'intérêts communs les réunissent. Au lieu que dans cet état primitif, n'ayant ni maison, ni cabanes, ni propriété d'aucune espèce, chacun se logeait au hasard, et souvent pour une seule nuit ; les mâles, et les femelles s'unissaient fortuitement selon la rencontre, l'occasion, et le désir, sans que la parole fût un interprète fort nécessaire des choses qu'ils avaient à se dire : ils se quittaient avec la même facilité. La mère allaitait d'abord ses enfants pour son propre besoin ; puis l'habitude les lui ayant rendus chers, elle les nourrissait ensuite pour le leur ; sitôt qu'ils avaient la force de chercher leur pâture, ils ne tardaient pas à quitter la mère elle-même ; et comme il n'y avait presque point d'autre moyen de se retrouver que de ne se pas perdre de vue, ils en étaient bientôt au point de ne pas même se reconnaître les uns les autres. Remarquez encore que l'enfant ayant tous ses besoins à expliquer, et par conséquent plus de choses à dire à la mère, que la mère à l'enfant, c'est lui qui doit faire les plus grands frais de l'invention, et que la langue qu'il emploie doit être en grande partie son propre ouvrage ; ce qui multiplie autant les langues qu'il y a d'individus pour les parler, à quoi contribue encore la vie errante, et vagabonde qui ne laisse à aucun idiome le temps de prendre de la consistance. Car de dire que la mère dicte à l'enfant les mots dont il devra se servir pour lui demander telle, ou telle chose, cela montre bien comment on enseigne des langues déjà formées, mais cela n'apprend point comment elles se forment."
