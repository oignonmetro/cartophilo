- id: rousseau-humanite-f1
  title: "Le problème de l'origine des langues et la critique de Condillac"
  notes: |-
    Rousseau commence par écarter une fausse facilité : il pourrait se contenter de renvoyer aux recherches de Condillac sur l'origine du langage, qu'il dit connaître et approuver. Étienne de Condillac avait en effet consacré, dans son *Essai sur l'origine des connaissances humaines* (1746), quelques pages à cette question, imaginant la fiction de deux enfants isolés dans un désert : les secours qu'ils se portent mutuellement passent par des cris, qui deviennent peu à peu des signes arbitraires, puis, la génération suivante venue, un langage articulé.

    Mais Rousseau refuse cette solution, pour une raison de principe qui commande toute la suite de son propos : Condillac, en imaginant deux enfants capables de coopérer et de se comprendre, **suppose déjà entre eux une forme de société** (précisément ce dont il faudrait expliquer l'apparition). La critique n'est donc pas de détail : c'est la méthode naturaliste elle-même, qui explique l'origine du langage par des capacités qu'elle présuppose sans le dire, que Rousseau met en cause dès l'ouverture de son propos.

    ! Piège : Rousseau ne nie pas la valeur des travaux de Condillac (il dit confirmer « pleinement [son] sentiment ») ; il leur reproche seulement de déplacer, plutôt que de lever, la difficulté qu'ils prétendent traiter.
  passage:
    source: "Discours sur l'origine et les fondements de l'inégalité"
    label: "Fragment 1"
    text: "Qu'il me soit permis de considérer un instant les embarras de l'origine des langues. Je pourrais me contenter de citer ou de répéter ici les recherches que M. l'abbé de Condillac a faites sur cette matière, qui toutes confirment pleinement mon sentiment, et qui, peut-être, m'en ont donné la première idée. Mais la manière dont ce philosophe résout les difficultés qu'il se fait à lui-même sur l'origine des signes institués, montrant qu'il a supposé ce que je mets en question, savoir une sorte de société déjà établie entre les inventeurs du langage, je crois en renvoyant à ses réflexions devoir y joindre les miennes pour exposer les mêmes difficultés dans le jour qui convient à mon sujet."
