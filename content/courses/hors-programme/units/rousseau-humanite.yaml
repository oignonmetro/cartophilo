- id: "rousseau-humanite-cs3"
  title: "La liberté morale, condition de la maîtrise de soi"
  notes: |-
    Rousseau ajoute, pour finir, un troisième acquis à ceux du paragraphe précédent : la {violet}**liberté morale**{/violet}, celle-là seule qui rend l'homme véritablement maître de lui-même. La formule qui la définit est l'une des plus citées du chapitre : {teal}« {/teal}l'impulsion du seul appétit est esclavage, et l'obéissance à la loi qu'on s'est prescrite est {teal}liberté »{/teal}. {green}Être libre, au sens moral, ce n'est donc pas suivre ses penchants sans entrave, mais obéir à une loi que l'on s'est soi-même donnée{/green} : c'est ce que l'{sky}*Émile*{/sky}, en particulier la Profession de foi du vicaire savoyard, étudiera plus longuement.

    Rousseau referme aussitôt la question, par une remarque qui n'est pas seulement une clause de style : le sens philosophique du mot liberté déborde son sujet ici, qui est le contrat social, non une théorie générale de la liberté.

    ! Piège : cette liberté morale n'est ni la liberté naturelle, ni la liberté civile distinguées au paragraphe précédent ; elle porte sur le rapport de l'homme à lui-même, non sur ses rapports aux autres hommes ou à leurs biens.
  passage:
    source: "Du contrat social, I, 8"
    label: "§3"
    text: "On pourrait sur ce qui précède ajouter à l'acquis de l'état civil la liberté morale, qui seule rend l'homme vraiment maître de lui ; car l'impulsion du seul appétit est esclavage, et l'obéissance à la loi qu'on s'est prescrite est liberté. Mais je n'en ai déjà que trop dit sur cet article, et le sens philosophique du mot liberté n'est pas ici de mon sujet."
  points:
  - id: "rousseau-humanite-cs3-1"
    sentence: "« __On pourrait sur ce qui précède ajouter à l'acquis de l'état civil__ ___ ; car **l'impulsion du seul appétit est esclavage**, et l'obéissance à la loi qu'on s'est prescrite est liberté. Mais je n'en ai déjà que trop dit sur cet article, et le sens philosophique du mot liberté n'est pas ici de mon sujet. »"
    answer: "la liberté morale, qui seule rend l'homme vraiment maître de lui"
