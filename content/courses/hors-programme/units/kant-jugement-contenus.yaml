- id: kj4-l2
  title: "Le jugement analytique, un concept plus substantiel qu'on ne le dit"
  notes: |-
    **La distinction kantienne n'est pas celle qu'a ruinée Quine.** On lit souvent Kant à travers la distinction aujourd'hui familière : l'analyticité comme vérité par la seule signification linguistique, la synthéticité comme vérité par les faits empiriques, et l'équivalence entre ce partage et celui du nécessaire et du contingent. Reçue vers 1950, elle a été discréditée par **Quine** (« Les deux dogmes de l'empirisme », 1951). Ce serait une erreur de la confondre avec celle de Kant, ou d'y voir une distinction épistémique entre vérités triviales et jugements informatifs. Pour Hanna, Kant distingue {green}deux sortes de contenu sémantique dans des propositions objectivement valides{/green} ; ni épistémique au premier chef, ni portant sur la forme logique (4:266).

    **Frege à moitié juste.** **Frege** voit bien qu'il s'agit de sémantique, de relations internes entre concepts, mais il réduit l'analyticité à {red}« simplement ressortir de la boîte ce que nous venons d'y mettre »{/red}, ce qui la rend triviale. L'accusation est juste si la tradition de **Leibniz** et de **Wolff** détermine la conception de Kant, comme le soutient **Anderson** (2015).

    **Cinq idées en font, pour Hanna, une notion substantielle.**
    - Tout concept a une microstructure intensionnelle, son « essence logique » (9:61) ;
    - les mondes logiquement possibles ne sont que des ensembles maximaux et cohérents de concepts, non des choses en soi (A571-573/B599-601) ;
    - tout concept bien formé et cohérent a une extension non vide à travers les mondes possibles (A239/B298-299) ;
    - seules les propositions objectivement valides ont une valeur de vérité ;
    - surtout, l'analyticité couvre non seulement l'inclusion du prédicat dans le sujet et l'identité des concepts, mais aussi toutes les vérités logiques de la logique vérifonctionnelle et monadique.

    **La définition.** Un jugement est {violet}analytique{/violet} si et seulement si son contenu est nécessairement vrai par les relations internes entre ses microstructures conceptuelles ou ses extensions, ou par ses connecteurs logiques. Et, Hanna y insiste, {red}Kant ne définit pas l'analyticité par l'inclusion ou l'identité des concepts{/red} : ce sont au mieux des conditions suffisantes. Il pose un {green}critère universel, nécessaire et suffisant{/green} : un jugement est analytiquement vrai si et seulement si {coral}sa négation entraîne une contradiction{/coral}, en un sens large de l'implication, qui inclut l'implication intensionnelle (A151/B190-191). « Tous les corps sont étendus » (exemple de Kant lui-même, A7/B11) est donc analytique, parce que dire qu'un corps n'est pas étendu se contredit.

    ! Qui tient, avec Anderson, que l'analyticité kantienne se définit par l'inclusion, et adopte une vue conceptualiste du jugement, aura une tout autre idée de l'analytique et du synthétique : c'est un vrai désaccord entre Hanna et Anderson.
  points:
  - id: kj4-l2-p1
    sentence: "La distinction de l'analytique et du synthétique discréditée par Quine dans « Les deux dogmes de l'empirisme » (1951) n'est pas celle de Kant, qui oppose deux sortes de contenu ___ dans des propositions objectivement valides."
    answer: "sémantique"
    alt: []
  - id: kj4-l2-p2
    sentence: "Le philosophe qui a discrédité la distinction de l'analytique et du synthétique aujourd'hui familière, dans « Les deux dogmes de l'empirisme » (1951), est ___."
