- id: kj4-l4
  title: "Le synthétique a priori et le dualisme modal"
  notes: |-
    **La question de la *Critique* est aussi, selon Hanna, sa thèse la plus audacieuse.** Kant résume son projet par la question {teal}« comment des jugements synthétiques *a priori* sont-ils possibles ? »{/teal} (B19). Il en affirme l'existence en mathématiques, en physique et en métaphysique (B14-18, A158/B197).

    **Une thèse sur la nécessité.** C'est soutenir le {green}dualisme modal{/green} : il existe deux types irréductibles de vérité nécessaire. Or, presque tout le monde, de Descartes à nos jours, défend le {red}monisme modal{/red} : un seul type de vérité nécessaire, la vérité analytique ou logique. Comme la vérité demande des vérifacteurs, le dualisme implique deux types de faits modaux dans le monde. Puisque les énoncés de la métaphysique traditionnelle sont, du moins par intention, synthétiques *a priori* (B18), la critique de cette métaphysique dans la {sky}Dialectique transcendantale{/sky} prolonge la même enquête.

    **Quatre combinaisons, trois existent.**

    | Sorte de jugement | Statut | Fondement |
    | analytique *a priori* | nécessaire | concepts et logique |
    | analytique *a posteriori* | n'existe pas | aucun |
    | synthétique *a posteriori* | empirique, contingent | intuitions empiriques |
    | synthétique *a priori* | nécessaire, non empirique | intuitions pures |

    Comme tout jugement analytique est nécessaire, et que la nécessité entraîne l'apriorité, {coral}aucun jugement analytique n'est *a posteriori*{/coral}.

    **Trois traits du synthétique *a priori*.**
    - Parce qu'il est {green}*a priori*{/green}, son sens et sa vérité sont sous-déterminés par le sensible, et il est nécessairement vrai.
    - Parce qu'il est {green}synthétique{/green}, sa vérité n'est pas déterminée par les seuls facteurs conceptuels et logiques, et sa négation est logiquement cohérente.
    - Parce que tout jugement synthétique est {green}fondé sur l'intuition{/green}, il repose ici sur les **intuitions pures**, nos représentations formelles *a priori* de l'espace et du temps (B73). C'est le trait décisif.

    ! Sa négation n'est pas contradictoire : cela ne le rend pas contingent. Il y a une nécessité qui ne se réduit pas à la logique, et c'est cela que nie le monisme modal.
  points:
  - id: kj4-l4-p1
    sentence: "Kant résume le projet de la *Critique de la raison pure* par la question : comment des jugements ___ *a priori* sont-ils possibles ? (B19)"
    answer: "synthétiques"
    alt: []
  - id: kj4-l4-p2
    sentence: "Affirmer l'existence de jugements synthétiques *a priori*, c'est défendre le ___ modal : il y a deux types irréductibles de vérité nécessaire."
    answer: "dualisme"
    alt: []
  - id: kj4-l4-p3
    sentence: "Contre le dualisme modal de Kant, presque tous les philosophes depuis Descartes tiennent le ___ modal : un seul type de vérité nécessaire, la vérité analytique ou logique."
    answer: "monisme"
    alt: []
  - id: kj4-l4-p4
    sentence: "Comme les énoncés de la métaphysique traditionnelle sont, par intention, synthétiques *a priori*, sa critique dans la ___ transcendantale prolonge l'enquête sur la possibilité de ces jugements."
    answer: "Dialectique"
    alt: []
  - id: kj4-l4-p5
