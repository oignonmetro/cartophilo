- id: kj4-l5
  title: "Une vérité nécessaire à visage humain"
  notes: |-
    **Le synthétique *a priori* n'a pas la même portée que l'analytique : c'est ce qui permet de le dire nécessaire sans en faire une vérité logique.** Cette reconstruction en mondes possibles est celle de **Hanna**.

    **Le raisonnement.** Nos représentations formelles de l'espace et du temps sont des conditions nécessaires de l'expérience humaine et de la validité objective des jugements, laquelle confère une valeur de vérité aux propositions. Il s'ensuit qu'un jugement synthétique *a priori* est {green}vrai dans tous les mondes humainement expérimentables, et seulement dans ceux-là, sans valeur de vérité ailleurs{/green}. À l'opposé, un jugement analytique est {pink}vrai dans tous les mondes logiquement possibles{/pink}, y compris ceux où l'expérience humaine n'est pas possible, les mondes nouménaux.

    | Jugement | Contenu | Portée modale |
    | analytique | fondé sur les concepts et la logique | tous les mondes logiquement possibles |
    | synthétique *a priori* | fondé sur l'intuition pure | les mondes humainement expérimentables |

    **Pourquoi est-ce encore une nécessité ?** Il existe des mondes logiquement possibles où une proposition comme **« 7+5=12 »** peut être niée sans contradiction : surprenant, mais c'est la conséquence. Pourtant, un jugement synthétique *a priori* est vrai ou sans valeur de vérité dans tout monde logiquement possible : {coral}il n'est faux dans aucun{/coral}. Il satisfait donc la définition générale de la nécessité : une proposition est nécessaire si et seulement si elle est strictement universellement vraie, c'est-à-dire vraie dans toute une classe complète de mondes possibles, sans contre-exemple possible.

    En termes moins lourds, selon la formule de Hanna, un jugement synthétique *a priori* est **une vérité nécessaire à visage humain**.

    ! Sans valeur de vérité n'est pas faux : dans un monde sans espace ni temps, « 7+5=12 » n'est pas réfuté, il cesse simplement d'avoir un sens objectif.
  points:
  - id: kj4-l5-p1
    sentence: "Dans la lecture de Hanna, un jugement synthétique *a priori* est vrai dans tous les mondes ___ expérimentables et seulement dans ceux-là, sans valeur de vérité ailleurs."
