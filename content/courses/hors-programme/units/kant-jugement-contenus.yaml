lessons:
- id: kj4-l1
  title: "A priori et a posteriori : commencer avec, dériver de"
  notes: |-
    **Le contenu d'un jugement varie selon trois axes : son rapport au sensible, aux conditions de vérité, et à la validité objective.** Cette première leçon porte sur le premier.

    **Deux sens de « contenu ».** L'{violet}intension{/violet} (`Inhalt`) est objective et représentative : c'est le contenu sémantique. La {violet}matière sensible{/violet} (`Materie`) est subjective et non représentative : c'est la réponse immédiate de l'esprit aux impressions extérieures (A19-20/B34, A320/B376).

    **Un rationalisme mitigé.** Pour Kant comme pour les empiristes, toute connaissance {green}« commence avec »{/green} (`mit … anfange`) des impressions sensibles. Mais, à l'écart de l'empirisme, toute connaissance {red}ne « dérive » pas{/red} (`entspringt … aus`) de ces impressions : une part unique de sa forme et de son contenu vient des capacités spontanées innées (B1). Hanna lit ce « dériver de » comme une {violet}détermination stricte{/violet}, proche de ce qu'on appelle aujourd'hui la survenance forte : X détermine strictement Y si les traits X d'une chose suffisent à ses traits Y, et si les traits Y ne peuvent changer sans que les traits X changent.

    **Les définitions en découlent.**
    - Un jugement est {violet}*a posteriori*{/violet} si et seulement si sa forme ou son contenu est strictement déterminé par des impressions sensibles ou des faits naturels contingents.
    - Il est {violet}*a priori*{/violet} si et seulement si ni sa forme ni son contenu ne le sont, et si tous deux sont déterminés par nos facultés spontanées innées (B2-3), qu'il contienne ou non une matière sensible.
    - Il est {violet}pur{/violet} s'il est *a priori* et, de plus, ne contient aucune matière sensible (B3). {coral}Certaines connaissances *a priori*, mais non toutes, sont donc pures.{/coral}

    **A priori et nécessaire.** Kant soutient aussi qu'un jugement est *a priori* si et seulement si il est nécessairement vrai (Axv, B3-4, A76/B101). Trois vues le fondent : la contingence d'un jugement tient à la dépendance de son contenu envers le sensible ; la nécessité équivaut à l'{violet}universalité stricte{/violet} (`strenge Allgemeinheit`), l'absence de tout contre-exemple possible (B4) ; la nécessité entraîne la vérité (A75-76/B100-101). Il y a des jugements *a priori* en physique et en métaphysique, et de purs en mathématiques (B4-5, B14-18).

    ! *A priori* ne veut pas dire « sans rapport aux sens » : une connaissance *a priori* peut s'accompagner d'impressions sensibles, à condition qu'elles ne déterminent ni sa forme ni son contenu.
  points:
  - id: kj4-l1-p1
    sentence: "Kant distingue l'intension (`Inhalt`), objective et représentative, de la ___ sensible (`Materie`), subjective et non représentative, réponse immédiate de l'esprit aux impressions."
    answer: "matière"
