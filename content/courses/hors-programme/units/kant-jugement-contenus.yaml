- id: kj4-l3
  title: "Le jugement synthétique : la part de l'intuition"
  notes: |-
    **On ne connaît d'abord le synthétique que par ce qu'il n'est pas.** Le partage est exhaustif : toute proposition est analytique ou synthétique, jamais les deux. D'où une définition {violet}négative{/violet} : une proposition est synthétique si et seulement si sa vérité n'est pas strictement déterminée par ses seules relations conceptuelles, ni par la seule logique vérifonctionnelle ou monadique ; et un jugement est synthétiquement vrai si et seulement si il est vrai et que {coral}sa négation n'entraîne pas de contradiction{/coral}.

    **Mais que fait alors sa vérité ?** Kant répond en reliant la sémantique de la synthéticité à celle des intuitions, comme il relie l'analyticité à celle des concepts. Définition {violet}positive{/violet} : un jugement est synthétique si et seulement si {green}son sens et sa vérité sont strictement déterminés par les intuitions qui le composent{/green}, empiriques ou pures (A8, A154-155/B193-194, A721/B749).

    Cela {red}ne veut pas dire que les jugements synthétiques ne contiennent pas de concepts{/red} (ils en contiennent toujours), ni que ceux-ci sont sans rapport avec leur sens ou leur vérité (ils y ont toujours rapport) : seulement que ce sont les composantes intuitives qui déterminent strictement le sens et la vérité. **Un jugement synthétique est une proposition fondée sur l'intuition.**

    Prenons « ce chat est sur le tapis » (exemple familier) : le concept de chat y joue son rôle, mais aucune analyse de ce concept ne me dit qu'il y est, il faut voir la chose ; et dire qu'il n'y est pas ne contient aucune contradiction.

    ! Le fondement dans l'intuition vaut pour le synthétique *a posteriori* comme pour le synthétique *a priori* : leur différence tient à la sorte d'intuition, empirique ou pure.
  points:
  - id: kj4-l3-p1
    sentence: "Un jugement est synthétiquement vrai si et seulement si il est vrai et que sa négation n'entraîne pas de ___."
    answer: "contradiction"
    alt: []
  - id: kj4-l3-p2
