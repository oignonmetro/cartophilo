- id: kj4-l8
  title: "Déterminant et réfléchissant"
  notes: |-
    **Le second partage des usages théoriques porte sur le sens dans lequel se lit la prédication.** Il croise le précédent, ce qui le rend déroutant, et Kant ne le mentionne expressément, à la période critique, qu'à partir de la {sky}Première Introduction à la *Critique de la faculté de juger*{/sky} (20:211) ; il s'annonce toutefois dans l'{sky}Appendice à la Dialectique transcendantale{/sky}, où Kant distingue usages « apodictique » et « hypothétique » du jugement (A647/B675).

    **Deux sens de la prédication.**
    - {violet}Déterminant{/violet} : subsomption d'un individu (Socrate) sous un concept universel (être philosophe), ou d'un concept plus étroit (être humain) sous un plus large (être mortel). Du déterminable au déterminé : l'universel est donné, le particulier s'y range.
    - {violet}Réfléchissant{/violet} : le sens inverse, du déterminé vers le déterminable. Le jugement va d'un individu ou d'un concept plus étroit vers un concept plus général, comme dans l'induction ou l'abduction ; il est dit réfléchissant parce qu'il invoque aussi la capacité du sujet à se représenter lui-même par la réflexion (`Überlegung`, B2, A260-263/B316-319).

    **Les jugements de goût et les jugements téléologiques sont réfléchissants.**

    **Une présupposition transcendantale, plus qu'une simple aide.** Dans l'Appendice, Kant affirme déjà que certains usages régulateurs, en particulier sur l'unité systématique de la nature, ont un rapport présuppositionnel à la vérité des jugements scientifiques, et ne jouent pas un simple rôle heuristique (A648/B676, A651/B679). La troisième *Critique* en fait une doctrine explicite : les jugements de goût sont gouvernés par un principe transcendantal {coral}« subjectivement nécessaire »{/coral} : nous devons croire que les structures formelles de la nature sont bien ajustées (sans être conçues pour cela) aux structures innées de nos facultés (5:179-186). Les jugements téléologiques sont, en un ou deux endroits, non seulement utiles, mais {coral}heuristiquement nécessaires{/coral} à l'étude mécaniste du vivant (5:376-383, 400) ; en termes actuels, notre biologie, entièrement mécaniste, requiert la posture intentionnelle. Un dernier indice, plus incertain : cette nécessité implique peut-être que nous devons croire (moralement ?) que nos corps sont mus librement par nos volontés (5:397-399).

    ! Les mots de ce partage sont ceux de la troisième *Critique*, mais il croise le précédent : un jugement réfléchissant n'est pas la même chose qu'un jugement régulateur.
