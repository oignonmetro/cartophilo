- id: kj4-l6
  title: "Juger sans viser le vrai : les usages non théoriques"
  notes: |-
    **Un même contenu propositionnel peut servir à plusieurs choses.** Les différences d'**usage** (`Gebrauch`) ne sont pas les trois degrés du tenir-pour-vrai, opinion, croyance, certitude (A820-823/B848-851), qui mesurent l'engagement envers le vrai. Elles portent sur ce qu'on fait du jugement.

    **Théorique, non théorique.**
    - Un jugement est {violet}théorique{/violet} si sa fonction rationnelle d'ensemble est d'être une proposition vraie sur le monde, phénoménal ou nouménal (20:195).
    - Il est {violet}non théorique{/violet} s'il est employé sans viser le vrai.

    | Usage non théorique | Fonction | Exemple |
    | pragmatique ou moral | faire des choix libres | une décision |
    | esthétique | évaluer le beau ou le sublime | cette rose |
    | téléologique | traiter la nature comme finalisée | les plantes vers le soleil |

    **Le contenu compte, sa vérité non.** Ce serait une lourde erreur de croire la proposition indifférente à ces usages : c'est elle qui détermine sur quoi porte le jugement. Mais {green}la fonction d'un jugement non théorique peut être remplie même si son contenu est faux{/green}. Ce qui importe est la façon dont les choses paraissent à celui qui juge.
    - Un choix peut être bon ou droit, même fondé sur de fausses croyances.
    - L'expérience visuelle de cette chose que vous prenez pour {yellow}une belle rose{/yellow} peut être une véritable expérience du beau, même si ce n'est pas une rose ou si elle n'existe pas (5:205).
    - Le jugement téléologique sur {yellow}les plantes héliotropes{/yellow}, qui se tournent vers le soleil parce qu'elles « veulent » de la lumière, peut servir de guide heuristique à une théorie mécaniste (5:397-415).

    Kant anticipe en cela la {violet}posture intentionnelle{/violet} de **Dennett** (1987).

    ! Que la vérité du contenu ne soit pas requise ne veut pas dire que ces jugements soient arbitraires : ils ont d'autres conditions, pratiques, esthétiques ou heuristiques.
  points:
  - id: kj4-l6-p1
    sentence: "Un jugement ___ est employé pour être une proposition vraie sur le monde, alors qu'un autre peut être employé pour choisir, évaluer le beau ou traiter la nature comme finalisée."
    answer: "théorique"
    alt: []
  - id: kj4-l6-p2
    sentence: "Le terme allemand que Kant emploie pour l'usage d'un jugement, à distinguer des degrés du tenir-pour-vrai, est ___."
    answer: "Gebrauch"
    alt: []
  - id: kj4-l6-p3
    sentence: "Les jugements pragmatiques et moraux ont pour fonction de faire des ___ libres, instrumentaux ou non, et non de dire le vrai."
    answer: "choix"
    alt: []
