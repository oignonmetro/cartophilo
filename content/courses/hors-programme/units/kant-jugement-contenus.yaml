- id: kj4-l7
  title: "Constitutif et régulatif"
  notes: |-
    **Il y a aussi plusieurs usages théoriques ; le premier partage dépend de ce qu'on présuppose.**
    - Un jugement théorique est employé de façon {violet}constitutive{/violet} si son sens, sa vérité ou sa légitimité comme principe (`Grundsatz`, `Prinzip`) ne reposent sur aucune hypothèse ou supposition de plus.
    - Il l'est de façon {violet}régulatrice{/violet} s'ils reposent sur une telle hypothèse.

    **Premier cas : les principes de l'entendement pur.** Les principes « mathématiques » sont constitutifs, les principes « dynamiques » sont régulateurs (A178-181/B220-224). {yellow}« 2+2=4 »{/yellow} resterait vrai même si deux paires de pommes, chaque fois qu'on les compte, fusionnaient magiquement en une seule, la Grosse Pomme : sa vérité ne suppose aucune application effective. En revanche « A a causé B » ou « les corps tombent vers la terre à telle vitesse » supposent l'existence de la matière et des événements antérieurs.

    **Deuxième cas : les propositions vides.** Elles contiennent des {violet}idées de la raison pure{/violet}, concepts d'objets nouménaux ou méta-concepts qui totalisent les concepts purs (A320/B377, A326-329/B382-386). Soit :
    - **(W)** « tout ce qui appartient à l'espèce naturelle de l'eau le doit à son essence lockienne » ;
    - **(G)** « un Dieu bienveillant existe ».
    Elles n'ont de valeur de vérité dans aucun des deux usages. Mais elles ont un usage régulateur légitime, en jugeant {green}*comme si* elles étaient vraies{/green}. On traite (W) comme vrai pour rassembler glace, vapeur et eau liquide et chercher les lois qui les expliquent ensemble (A645-647/B673-675) ; on traite (G) comme un postulat de la raison pratique, pour fortifier une résolution morale faible (A633-634/B661-662). Un jugement vide est donc employé de façon régulatrice quand il est adopté **pour faire de l'enquête scientifique ou de la vie morale un tout cohérent et sensé**.

    **Les maximes de la science.** Il en va de même de maximes souvent prises pour des jugements très généraux : la nature ne multiplie pas les êtres sans nécessité ({yellow}le rasoir d'Ockham{/yellow}), la nature ne fait pas de sauts (la loi de continuité, A652-663/B680-691). De près, le monde naturel est désordonné et plein de trous. {violet}L'unité systématique de la nature{/violet} (A650-668/B678-696) comble l'écart entre le désordre du laboratoire et l'élégance des modèles abstraits : elle confère à la recherche la solidarité d'une entreprise rationnelle. Kant est, en ce sens, le découvreur de l'{coral}esthétique de la science{/coral} (Breitenbach).

    ! « Régulateur » ne veut pas dire « subjectif et sans importance » : Kant fait de l'unité systématique une condition de la science.
