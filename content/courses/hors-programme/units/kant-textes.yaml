# Unité-œuvre (voir content/oeuvres.md), pour réviser les 33 textes de Kant
# d'un manuel de philosophie : associer chaque texte à sa référence. Titres et
# références fournis par l'utilisatrice, abrégés au nécessaire dans les
# repères ; les textes qui partagent une référence (Préface de 1787 ;
# Fondements, I et II) ne forment qu'une case : 25 cases. Thèses alignées sur le manuel :
# les thèses suivent les extraits du manuel (J. Russ, C. Leguil, Philosophie.
# Les chemins de la pensée, pp. 232-260).

id: kant-textes
title: "Kant : textes clés"
subtitle: "33 textes, des trois Critiques aux opuscules"
icon: map
color: sky
group: "Kant"
intro: |-
  Les 33 textes de Kant du manuel, à associer à leur référence : où Kant compare-t-il la raison à un juge, la bonne volonté à une pierre précieuse, la preuve ontologique aux zéros d'un livre de caisse ?

  Les textes qui partagent une référence ne forment qu'un emplacement : les cinq textes de la deuxième section des *Fondements*, par exemple. Au clavier, le titre s'abrège ou se réduit à son sigle (« CRP Dialectique Idéal », « FMM II », « CFJ 46 », « Idée 4 ») ; les mots qui nomment la division (Esthétique, Dialectique, Introduction) se tapent aussi, abrégés si l'on veut.
work:
  parts:
    - id: theorique
      label: "La raison théorique"
      parts:
        - id: b-crp-prefaces
          label: "Préfaces et Introduction"
          question: "Que se propose la Critique de la raison pure ?"
          parts:
            - id: k-pref81
              label: "Critique de la raison pure, Préface de 1781"
              title: "Ce qu'est la métaphysique"
              summary: "La raison est accablée de questions qu'elle ne peut ni éviter ni résoudre"
              points:
                - id: kt-pref81-1
                  sentence: "La raison humaine est soumise à cette condition singulière qu'elle ne peut ___ certaines questions, et qu'elle en est accablée."
                  answer: "éviter"
                  alt: ["écarter"]
                - id: kt-pref81-2
                  sentence: "Ces questions lui sont suggérées par sa nature même, mais elle ne saurait les ___, parce qu'elles dépassent sa portée."
                  answer: "résoudre"
                - id: kt-pref81-3
                  sentence: "Les principes dont la raison se sert sortent des limites de toute expérience, et n'ont plus de pierre de ___."
                  answer: "touche"
            - id: k-pref87
              label: "Critique de la raison pure, Préface de 1787"
              title: "La raison doit prendre les devants ; La révolution copernicienne ; La croyance morale"
              summary: "La raison ne connaît que ce qu'elle produit d'après ses plans ; l'objet se règle sur notre connaissance"
              rel: declinaison
              points:
                - id: kt-pref87-1
                  sentence: "Les physiciens comprirent que la raison n'aperçoit que ce qu'elle produit elle-même d'après ses propres ___."
                  answer: "plans"
                  alt: ["desseins"]
                - id: kt-pref87-2
                  sentence: "La raison doit s'adresser à la nature non comme un écolier, mais comme un ___ qui a le droit de contraindre les témoins à répondre à ses questions."
                  answer: "juge"
                - id: kt-pref87-3
                  sentence: "On avait admis jusqu'ici que toutes nos connaissances devaient se ___ sur les objets."
                  answer: "régler"
                - id: kt-pref87-4
                  sentence: "Copernic chercha s'il ne serait pas mieux de supposer que c'est le ___ qui tourne, et que les astres demeurent immobiles."
                  answer: "spectateur"
                - id: kt-pref87-5
                  sentence: "J'ai donc dû supprimer le ___ pour y substituer la croyance."
                  answer: "savoir"
                - id: kt-pref87-6
                  sentence: "Le premier qui démontra le triangle ___ fut frappé d'une grande lumière."
                  answer: "isocèle"
                - id: kt-pref87-7
                  sentence: "Je ne saurais admettre Dieu, la liberté et l'___ selon le besoin qu'en a ma raison dans son usage pratique, sans repousser les prétentions de la raison spéculative."
                  answer: "immortalité"
            - id: k-intro87
              label: "Critique de la raison pure, Introduction de 1787"
              title: "L'expérience"
              summary: "Toute connaissance commence avec l'expérience, sans dériver toute de l'expérience"
              rel: declinaison
              points:
                - id: kt-intro87-1
                  sentence: "Il n'est pas ___ que toutes nos connaissances ne commencent avec l'expérience."
                  answer: "douteux"
                - id: kt-intro87-2
                  sentence: "Si toutes nos connaissances commencent avec l'expérience, il n'en résulte pas qu'elles ___ toutes de l'expérience."
                  answer: "dérivent"
                  alt: ["proviennent", "découlent"]
                - id: kt-intro87-3
                  sentence: "La connaissance expérimentale elle-même pourrait bien être un ___, composé de ce que nous recevons par des impressions et de ce que notre faculté de connaître tire d'elle-même."
                  answer: "assemblage"
        - id: b-crp-doctrine
          label: "Esthétique, Logique, Dialectique"
          question: "Comment connaissons-nous, et où la raison s'égare-t-elle ?"
          rel: declinaison
          parts:
            - id: k-esth
              label: "Critique de la raison pure, Esthétique"
              title: "Le temps"
              summary: "Le temps est une forme a priori de l'intuition, non un concept tiré de l'expérience"
              points:
                - id: kt-esth-1
                  sentence: "Le temps n'est pas un concept empirique : la ___ ou la succession ne tomberaient pas sous notre perception si la représentation du temps ne lui servait a priori de fondement."
                  answer: "simultanéité"
                - id: kt-esth-2
                  sentence: "On peut bien retrancher du temps les ___ par la pensée, mais on ne saurait supprimer le temps lui-même."
                  answer: "phénomènes"
                - id: kt-esth-3
                  sentence: "Les temps différents ne sont que des ___ d'un même temps."
                  answer: "parties"
            - id: k-logique
              label: "Critique de la raison pure, Logique, Introduction"
              title: "Intuition et concepts"
              summary: "Des pensées sans contenu sont vides, des intuitions sans concepts sont aveugles"
              rel: declinaison
              points:
                - id: kt-logique-1
                  sentence: "Sans la ___, nul objet ne nous serait donné ; sans l'entendement, nul ne serait pensé."
                  answer: "sensibilité"
                - id: kt-logique-2
                  sentence: "Des pensées sans matière sont ___ ; des intuitions sans concepts sont aveugles."
                  answer: "vides"
                - id: kt-logique-3
                  sentence: "Ni les concepts sans une intuition qui leur corresponde, ni l'intuition sans les concepts ne peuvent fournir une ___."
                  answer: "connaissance"
            - id: k-dial
              label: "Critique de la raison pure, Dialectique, Introduction"
              title: "Les illusions de la raison"
              summary: "L'illusion transcendantale est naturelle : on peut la découvrir, non la supprimer"
              rel: declinaison
              points:
                - id: kt-dial-1
                  sentence: "La dialectique de la raison pure ne cesse pas de se jouer de la raison, alors même que nous en avons ___ l'illusion."
                  answer: "découvert"
                  alt: ["découverte"]
                - id: kt-dial-2
                  sentence: "L'astronome lui-même ne peut empêcher que la ___ ne lui paraisse plus grande à son lever, bien qu'il ne soit pas trompé par cette apparence."
                  answer: "lune"
                - id: kt-dial-3
                  sentence: "La raison fait passer la nécessité subjective d'une certaine liaison de nos concepts pour une nécessité ___, une détermination des choses en soi."
                  answer: "objective"
            - id: k-ideal
              label: "Critique de la raison pure, Dialectique, Idéal"
              title: "L'existence n'est pas un prédicat"
              summary: "L'existence n'ajoute rien au concept : la preuve ontologique échoue"
              rel: declinaison
              points:
                - id: kt-ideal-1
                  sentence: "Être n'est évidemment pas un prédicat ___, c'est-à-dire un concept de quelque chose qui puisse s'ajouter au concept d'une chose."
                  answer: "réel"
                - id: kt-ideal-2
                  sentence: "Cent thalers réels ne contiennent rien de plus que cent thalers ___."
                  answer: "possibles"
                - id: kt-ideal-3
                  sentence: "Être n'est pas un prédicat : c'est simplement la ___ d'une chose."
                  answer: "position"
                - id: kt-ideal-4
                  sentence: "On ne deviendra pas plus riche en connaissances avec de simples idées qu'un ___ ne le deviendrait en ajoutant quelques zéros à son livre de caisse."
                  answer: "marchand"
        - id: b-methode
          label: "Méthodologie et Prolégomènes"
          question: "Que peut la raison, et comment doit-elle procéder ?"
          rel: declinaison
          parts:
            - id: k-canon
              label: "Critique de la raison pure, Méthodologie, Canon"
              title: "Les trois questions fondamentales de la raison"
              summary: "Que puis-je savoir ? Que dois-je faire ? Que m'est-il permis d'espérer ?"
              points:
                - id: kt-canon-1
                  sentence: "Tout intérêt de ma raison se ramène aux trois questions suivantes : que puis-je ___ ? que dois-je faire ? qu'ai-je à espérer ?"
                  answer: "connaître"
                - id: kt-canon-2
                  sentence: "Cet intérêt de la raison est tant ___ que pratique."
                  answer: "spéculatif"
                - id: kt-canon-3
                  sentence: "À la question que dois-je faire, Kant répond : mon ___, par respect pour la loi morale."
                  answer: "devoir"
            - id: k-disc
              label: "Critique de la raison pure, Méthodologie, Discipline"
              title: "La démonstration"
              summary: "La philosophie connaît par concepts, la mathématique par construction de concepts"
              rel: declinaison
              points:
                - id: kt-disc-1
                  sentence: "Il n'y a que la mathématique qui contienne des démonstrations, parce qu'elle ne dérive pas sa connaissance de concepts, mais de la ___ des concepts."
                  answer: "construction"
                - id: kt-disc-2
                  sentence: "Construire un concept, c'est le rapporter à l'___ qui peut être donnée a priori comme lui correspondant."
                  answer: "intuition"
                - id: kt-disc-3
                  sentence: "Seule une preuve ___, en tant qu'elle est intuitive, peut s'appeler démonstration."
                  answer: "apodictique"
            - id: k-prol
              label: "Prolégomènes, § 45"
              title: "Les idées de la raison"
              summary: "La raison réclame l'achèvement de la chaîne des conditions, jusqu'aux noumènes"
              rel: declinaison
              points:
                - id: kt-prol-1
                  sentence: "La raison, qui ne peut être pleinement satisfaite d'aucun usage empirique des règles de l'entendement, réclame l'___ de la chaîne des conditions."
                  answer: "achèvement"
                - id: kt-prol-2
                  sentence: "Pour achever la série, l'entendement est poussé à chercher, tout à fait en dehors de l'expérience, des ___."
                  answer: "noumènes"
    - id: pratique
      label: "La raison pratique"
      parts:
        - id: b-morale
          label: "Fondements et Critique de la raison pratique"
          question: "Que dois-je faire, et que m'est-il permis d'espérer ?"
          parts:
            - id: k-fmm1
              label: "Fondements de la métaphysique des mœurs, I"
              title: "La bonne volonté ; Une question de morale"
              summary: "Seule une bonne volonté est bonne sans restriction ; la promesse trompeuse ne peut devenir loi universelle"
              points:
                - id: kt-fmm1-1
                  sentence: "De tout ce qu'il est possible de concevoir dans le monde, et même en dehors du monde, il n'y a qu'une seule chose qu'on puisse tenir pour bonne sans ___ : c'est une bonne volonté."
                  answer: "restriction"
                - id: kt-fmm1-2
                  sentence: "La bonne volonté ne tire pas sa bonté de ses effets ou de ses résultats, mais seulement du ___."
                  answer: "vouloir"
                - id: kt-fmm1-3
                  sentence: "Même privée de tous les moyens d'exécuter ses desseins, elle brillerait encore de son propre éclat, comme une ___ précieuse."
                  answer: "pierre"
                - id: kt-fmm1-4
                  sentence: "Pour savoir si une promesse trompeuse est conforme au devoir, je me demande si j'accepterais que ma maxime dût valoir comme une loi ___."
                  answer: "universelle"
                - id: kt-fmm1-5
                  sentence: "Selon une loi universelle qui commanderait de mentir, il n'y aurait plus à proprement parler de ___."
                  answer: "promesse"
                - id: kt-fmm1-6
                  sentence: "Ma maxime, du moment qu'elle serait érigée en loi universelle, se ___ elle-même nécessairement."
                  answer: "détruirait"
                - id: kt-fmm1-7
                  sentence: "Autre chose est d'être sincère par devoir, autre chose de l'être par ___ des conséquences désavantageuses."
                  answer: "crainte"
            - id: k-fmm2
              label: "Fondements de la métaphysique des mœurs, II"
              title: "La raison pratique ; Impératif hypothétique et impératif catégorique ; Première formule du devoir : l'universalité de la loi ; Seconde formule du devoir : respecter la personne ; L'autonomie de la volonté"
              summary: "Les impératifs, les formules de l'impératif catégorique, l'autonomie"
              rel: declinaison
              points:
                - id: kt-fmm2-1
                  sentence: "Il n'y a qu'un être raisonnable qui ait la faculté d'agir d'après la ___ des lois, c'est-à-dire d'après des principes : il a une volonté."
                  answer: "représentation"
                - id: kt-fmm2-2
                  sentence: "L'impératif catégorique ne concerne pas la matière de l'action, mais la ___ et le principe d'où elle résulte."
                  answer: "forme"
                - id: kt-fmm2-3
                  sentence: "L'impératif catégorique ordonne une conduite sans avoir lui-même pour condition une autre ___, à laquelle cette conduite ne serait qu'un moyen."
                  answer: "fin"
                - id: kt-fmm2-4
                  sentence: "Agis uniquement d'après la ___ qui fait que tu peux vouloir en même temps qu'elle devienne une loi universelle."
                  answer: "maxime"
                - id: kt-fmm2-5
                  sentence: "Agis de telle sorte que tu traites l'humanité, aussi bien dans ta personne que dans la personne de tout autre, toujours en même temps comme une fin, et jamais simplement comme un ___."
                  answer: "moyen"
                - id: kt-fmm2-6
                  sentence: "Les êtres dépourvus de raison n'ont qu'une valeur relative, celle de moyens, et voilà pourquoi on les nomme des ___."
                  answer: "choses"
                - id: kt-fmm2-7
                  sentence: "L'autonomie de la volonté est cette propriété qu'a la volonté d'être à elle-même sa loi, indépendamment de la nature des ___ du vouloir."
                  answer: "objets"
                - id: kt-fmm2-8
                  sentence: "Lorsque la volonté cherche sa loi dans la nature de quelqu'un de ses objets, il y a toujours ___."
                  answer: "hétéronomie"
                - id: kt-fmm2-9
                  sentence: "Agis comme si la maxime de ton action devait être érigée par ta volonté en loi universelle de la ___."
                  answer: "nature"
                - id: kt-fmm2-10
                  sentence: "La nature raisonnable existe comme ___ en soi."
                  answer: "fin"
            - id: k-crpr-an
              label: "Critique de la raison pratique, Analytique"
              title: "Devoir ! Nom sublime et grand…"
              summary: "Le devoir réclame la soumission ; sa racine est la personnalité"
              rel: declinaison
              points:
                - id: kt-crpr-an-1
                  sentence: "Devoir ! mot grand et sublime, toi qui n'as rien d'agréable ni de ___, et commandes la soumission."
                  answer: "flatteur"
                - id: kt-crpr-an-2
                  sentence: "La racine du devoir ne peut être que la ___, c'est-à-dire la liberté, l'indépendance par rapport à tout le mécanisme de la nature."
                  answer: "personnalité"
                - id: kt-crpr-an-3
                  sentence: "Devant la loi morale se taisent tous les ___, quoiqu'ils travaillent sourdement contre elle."
                  answer: "penchants"
            - id: k-crpr-dial
              label: "Critique de la raison pratique, Dialectique"
              title: "L'espérance de participer au bonheur"
              summary: "La morale apprend à se rendre digne du bonheur, que la religion permet d'espérer"
              rel: declinaison
              points:
                - id: kt-crpr-dial-1
                  sentence: "Ce n'est qu'en ayant recours à la ___ que nous pouvons espérer de participer au bonheur."
                  answer: "religion"
                - id: kt-crpr-dial-2
                  sentence: "Nous espérons participer au bonheur en proportion des efforts que nous aurons faits pour n'en pas être ___."
                  answer: "indignes"
                - id: kt-crpr-dial-3
                  sentence: "La morale n'est pas une doctrine qui nous apprenne à nous rendre heureux, mais seulement comment nous devons nous rendre ___ du bonheur."
                  answer: "dignes"
    - id: juger-histoire
      label: "Juger, l'histoire et l'homme"
      parts:
        - id: b-cfj
          label: "Critique de la faculté de juger"
          question: "Que juge-t-on en jugeant le beau et le vivant ?"
          parts:
            - id: k-cfj6
              label: "Critique de la faculté de juger, § 6"
              title: "Le beau plaît universellement sans concept"
              summary: "Une satisfaction désintéressée se suppose en chacun"
              points:
                - id: kt-cfj6-1
                  sentence: "Celui qui trouve en quelque chose une satisfaction désintéressée ne peut en trouver la raison dans des conditions ___ : il la suppose en tout autre."
                  answer: "particulières"
                - id: kt-cfj6-2
                  sentence: "Il parlera du beau comme si c'était une ___ de l'objet même."
                  answer: "qualité"
                - id: kt-cfj6-3
                  sentence: "Le jugement de goût, sans fondement dans les objets, a droit à une universalité ___."
                  answer: "subjective"
            - id: k-cfj46
              label: "Critique de la faculté de juger, § 46"
              title: "Le génie"
              summary: "Par le génie, la nature donne ses règles à l'art"
              rel: declinaison
              points:
                - id: kt-cfj46-1
                  sentence: "Le génie est le talent de produire ce dont on ne peut donner de ___ déterminée."
                  answer: "règle"
                - id: kt-cfj46-2
                  sentence: "Les productions du génie doivent être des modèles : elles doivent être ___."
                  answer: "exemplaires"
                - id: kt-cfj46-3
                  sentence: "Le génie ne peut montrer scientifiquement comment il produit : il donne la règle par une inspiration de la ___."
                  answer: "nature"
                - id: kt-cfj46-4
                  sentence: "Le mot génie vient du latin ___, l'esprit particulier donné à un homme à sa naissance."
                  answer: "genius"
            - id: k-cfj56
              label: "Critique de la faculté de juger, § 56"
              title: "Le jugement de goût, entre subjectivité et objectivité"
              summary: "L'antinomie du goût : on ne dispute pas du goût, et pourtant on en discute"
              rel: declinaison
              points:
                - id: kt-cfj56-1
                  sentence: "Second lieu commun : on ne ___ pas du goût, c'est-à-dire qu'on n'en décide pas par des preuves."
                  answer: "dispute"
                - id: kt-cfj56-2
                  sentence: "Thèse : le jugement de goût ne se fonde pas sur des ___ ; sinon on pourrait en disputer."
                  answer: "concepts"
                - id: kt-cfj56-3
                  sentence: "Antithèse : il se fonde sur des concepts ; sinon on ne pourrait même pas en ___."
                  answer: "discuter"
            - id: k-cfj65
              label: "Critique de la faculté de juger, § 65"
              title: "L'être vivant n'est pas une machine"
              summary: "Une machine n'a que la force motrice ; l'être organisé a une vertu formatrice"
              rel: declinaison
              points:
                - id: kt-cfj65-1
                  sentence: "Dans la montre, un rouage n'en ___ pas un autre."
                  answer: "produit"
                - id: kt-cfj65-2
                  sentence: "Une montre ne ___ pas d'elle-même les parties perdues."
                  answer: "remplace"
                - id: kt-cfj65-3
                  sentence: "Un être organisé possède en lui une vertu ___, qu'il communique aux matières qui ne l'ont pas."
                  answer: "formatrice"
                - id: kt-cfj65-4
                  sentence: "Une machine n'a que la force ___."
                  answer: "motrice"
            - id: k-cfj83
              label: "Critique de la faculté de juger, § 83"
              title: "Bonheur et culture"
              summary: "La fin dernière de la nature n'est pas le bonheur de l'homme, mais sa culture"
              rel: declinaison
              points:
                - id: kt-cfj83-1
                  sentence: "La nature de l'homme n'est pas telle qu'elle puisse s'accomplir et se ___ dans la possession et la jouissance."
                  answer: "satisfaire"
                - id: kt-cfj83-2
                  sentence: "La production de l'aptitude d'un être raisonnable à des ___ quelconques en général est la culture."
                  answer: "fins"
                - id: kt-cfj83-3
                  sentence: "Le bonheur n'est pas un concept que l'homme abstrait de ses instincts, mais une simple ___ d'un état."
                  answer: "Idée"
        - id: b-histoire
          label: "Histoire, politique et pédagogie"
          question: "Comment l'humanité progresse-t-elle ?"
          rel: declinaison
          parts:
            - id: k-idee4
              label: "Idée d'une histoire universelle, 4e proposition"
              title: "L'insociable sociabilité"
              summary: "La nature développe nos dispositions par l'antagonisme des hommes en société"
              points:
                - id: kt-idee4-1
                  sentence: "Le moyen dont la nature se sert pour mener à bien le développement de toutes ses dispositions est leur ___ au sein de la société."
                  answer: "antagonisme"
                - id: kt-idee4-2
                  sentence: "C'est cette résistance qui éveille toutes les forces de l'homme, et le porte à surmonter son inclination à la ___."
                  answer: "paresse"
                - id: kt-idee4-3
                  sentence: "L'homme a un penchant à s'associer, mais aussi une grande propension à s'___."
                  answer: "isoler"
            - id: k-idee6
              label: "Idée d'une histoire universelle, 6e proposition"
              title: "L'homme est un animal qui a besoin d'un maître"
              summary: "L'homme a besoin d'un maître, qui doit pourtant être lui-même un homme"
              rel: declinaison
              points:
                - id: kt-idee6-1
                  sentence: "Vivant parmi ses semblables, l'homme a besoin d'un maître, car il abuse à coup sûr de sa ___ à leur égard."
                  answer: "liberté"
                - id: kt-idee6-2
                  sentence: "Ce maître, on ne le trouvera nulle part ailleurs que dans l'___ humaine."
                  answer: "espèce"
            - id: k-idee7
              label: "Idée d'une histoire universelle, 7e proposition"
              title: "Le progrès du genre humain"
              summary: "Cultivés et civilisés, nous ne sommes pas encore moralisés"
              rel: declinaison
              points:
                - id: kt-idee7-1
                  sentence: "Tant que les États consacreront leurs forces à des vues d'expansion chimériques et violentes, ils entraveront le lent effort de formation intérieure de la ___ chez leurs concitoyens."
                  answer: "pensée"
                - id: kt-idee7-2
                  sentence: "Nous sommes cultivés et civilisés au point d'en être accablés, mais il s'en faut encore de beaucoup que nous soyons ___."
                  answer: "moralisés"
                - id: kt-idee7-3
                  sentence: "Tout bien qui n'est pas greffé sur une disposition moralement bonne n'est que pure chimère et faux ___."
                  answer: "clinquant"
            - id: k-lumieres
              label: "Qu'est-ce que les Lumières ?"
              title: "Du libre usage de la raison"
              summary: "Les Lumières : sortir de la minorité dont on est soi-même responsable"
              rel: declinaison
              points:
                - id: kt-lumieres-1
                  sentence: "Les Lumières sont la sortie de l'homme de sa ___, dont il est lui-même responsable."
                  answer: "minorité"
                - id: kt-lumieres-2
                  sentence: "La paresse et la ___ sont les causes qui expliquent qu'un si grand nombre d'hommes restent volontiers mineurs."
                  answer: "lâcheté"
                - id: kt-lumieres-3
                  sentence: "Sapere aude ! Aie le ___ de te servir de ton propre entendement !"
                  answer: "courage"
            - id: k-paix
              label: "Projet de paix perpétuelle, 2e article"
              title: "Une fédération d'États libres"
              summary: "Une fédération de peuples, qui ne forment pas un seul État"
              rel: declinaison
              points:
                - id: kt-paix-1
                  sentence: "Il en est des peuples, en tant qu'États, comme des individus : dans l'état de ___, leur seul voisinage est déjà une lésion réciproque."
                  answer: "nature"
                - id: kt-paix-2
                  sentence: "Plusieurs peuples réunis en un seul État ne formeraient plus qu'un seul ___ : il y aurait contradiction."
                  answer: "peuple"
            - id: k-anthropo
              label: "Anthropologie, I, § 1"
              title: "Le Je et la conscience"
              summary: "Pouvoir dire Je fait de l'homme une personne"
              rel: declinaison
              points:
                - id: kt-anthropo-1
                  sentence: "Une chose élève infiniment l'homme au-dessus de toutes les autres ___ qui vivent sur la terre : être capable d'avoir la notion de lui-même, du Je."
                  answer: "créatures"
                - id: kt-anthropo-2
                  sentence: "Par là, il devient une ___, une seule et même à travers tous les changements auxquels il est sujet."
                  answer: "personne"
                - id: kt-anthropo-3
                  sentence: "Lorsque l'enfant commence à dire Je, une ___ nouvelle semble en quelque sorte l'éclairer."
                  answer: "lumière"
                - id: kt-anthropo-4
                  sentence: "Auparavant, l'enfant se sentait simplement ; maintenant, il se ___."
                  answer: "pense"
            - id: k-pedagogie
              label: "Traité de pédagogie"
              title: "L'homme doit travailler"
              summary: "L'homme est voué au travail : l'oisiveté le tourmenterait"
              rel: declinaison
              points:
                - id: kt-pedagogie-1
                  sentence: "L'homme est le seul ___ qui soit voué au travail."
                  answer: "animal"
                - id: kt-pedagogie-2
                  sentence: "Si Adam et Ève étaient restés dans le paradis, l'___ eût fait leur tourment."
                  answer: "oisiveté"
                - id: kt-pedagogie-3
                  sentence: "Le meilleur ___ pour l'homme est celui qui suit le travail."
                  answer: "repos"
  recaps:
    - at: b-crp-prefaces
      label: "Préfaces et Introduction"
      title: "La Critique de la raison pure : son projet"
      notes: |-
        **Les préfaces posent le problème et la solution : la raison s'égare dans la métaphysique (1781) ; la révolution copernicienne fait tourner l'objet autour de la connaissance, et limite le savoir pour faire place à la croyance (1787).**

        | Texte | Titre du manuel |
        | 2. Critique de la raison pure, Préface de 1781 | Ce qu'est la métaphysique |
        | 3. Critique de la raison pure, Préface de 1787 | La raison doit prendre les devants |
        | 4. Critique de la raison pure, Préface de 1787 | La révolution copernicienne |
        | 20. Critique de la raison pure, Préface de 1787 | La croyance morale |
        | 5. Critique de la raison pure, Introduction de 1787 | L'expérience |

        ! La révolution copernicienne ne dit pas que l'esprit crée les choses : elle dit que les objets, tels que nous les connaissons, se règlent sur les formes de notre connaissance.
    - at: b-crp-doctrine
      label: "Esthétique, Logique, Dialectique"
      title: "La Critique de la raison pure : la doctrine"
      notes: |-
        **Connaître suppose la sensibilité et ses formes (le temps, Esthétique), l'entendement et ses concepts (Logique) ; au-delà, la raison produit des illusions (Dialectique), dont la preuve ontologique.**

        | Texte | Titre du manuel |
        | 6. Critique de la raison pure, Esthétique | Le temps |
        | 7. Critique de la raison pure, Logique, Introduction | Intuition et concepts |
        | 10. Critique de la raison pure, Dialectique, Introduction | Les illusions de la raison |
        | 11. Critique de la raison pure, Dialectique, Idéal | L'existence n'est pas un prédicat |

        ! L'illusion transcendantale ne disparaît pas une fois reconnue : on cesse seulement d'en être dupe.
    - at: b-methode
      label: "Méthodologie et Prolégomènes"
      title: "Ce que peut la raison"
      notes: |-
        **La Méthodologie ramène l'intérêt de la raison à trois questions, et distingue la démonstration mathématique de la connaissance philosophique ; les Prolégomènes situent l'origine des illusions dans les idées de la raison.**

        | Texte | Titre du manuel |
        | 1. Critique de la raison pure, Méthodologie, Canon | Les trois questions fondamentales de la raison |
        | 8. Critique de la raison pure, Méthodologie, Discipline | La démonstration |
        | 9. Prolégomènes, § 45 | Les idées de la raison |

        ! La troisième question (que m'est-il permis d'espérer ?) n'est pas seulement théorique : elle est à la fois pratique et théorique.
    - at: b-morale
      label: "Fondements et Critique de la raison pratique"
      title: "La morale de Kant"
      notes: |-
        **Seule la bonne volonté est bonne sans restriction (Fondements, I) ; la moralité s'énonce dans l'impératif catégorique et ses formules, et repose sur l'autonomie (II) ; le devoir élève l'homme, et permet d'espérer le bonheur dont on se rend digne (Critique de la raison pratique).**

        | Texte | Titre du manuel |
        | 13. Fondements de la métaphysique des mœurs, I | La bonne volonté |
        | 16. Fondements de la métaphysique des mœurs, I | Une question de morale |
        | 12. Fondements de la métaphysique des mœurs, II | La raison pratique |
        | 14. Fondements de la métaphysique des mœurs, II | Impératif hypothétique et impératif catégorique |
        | 15. Fondements de la métaphysique des mœurs, II | Première formule du devoir : l'universalité de la loi |
        | 17. Fondements de la métaphysique des mœurs, II | Seconde formule du devoir : respecter la personne |
        | 18. Fondements de la métaphysique des mœurs, II | L'autonomie de la volonté |
        | 19. Critique de la raison pratique, Analytique | Devoir ! Nom sublime et grand… |
        | 21. Critique de la raison pratique, Dialectique | L'espérance de participer au bonheur |

        Cinq textes du manuel partagent la deuxième section des *Fondements* : ils ne forment ici qu'un emplacement.

        ! L'impératif catégorique n'interdit pas d'utiliser autrui comme moyen : il interdit de le traiter simplement comme un moyen.
    - at: b-cfj
      label: "Critique de la faculté de juger"
      title: "La Critique de la faculté de juger"
      notes: |-
        **Le beau plaît universellement sans concept (§ 6), ce qui produit l'antinomie du goût (§ 56) ; le génie donne la règle à l'art (§ 46) ; l'être vivant n'est pas une machine (§ 65), et la fin dernière de la nature est la culture, non le bonheur (§ 83).**

        | Texte | Titre du manuel |
        | 22. Critique de la faculté de juger, § 6 | Le beau plaît universellement sans concept |
        | 24. Critique de la faculté de juger, § 46 | Le génie |
        | 23. Critique de la faculté de juger, § 56 | Le jugement de goût, entre subjectivité et objectivité |
        | 25. Critique de la faculté de juger, § 65 | L'être vivant n'est pas une machine |
        | 33. Critique de la faculté de juger, § 83 | Bonheur et culture |

        ! Le § 83 ne méprise pas le bonheur : il montre que la nature ne peut en faire la fin de l'homme, qui n'est jamais satisfait.
    - at: b-histoire
      label: "Histoire, politique et pédagogie"
      title: "Histoire, politique et pédagogie"
      notes: |-
        **L'histoire avance par l'insociable sociabilité (4e proposition), mais l'homme a besoin d'un maître qui soit lui-même un homme (6e), et, cultivés et civilisés, nous ne sommes pas encore moralisés (7e) ; les Lumières sont la sortie de la minorité, la paix par une fédération d'États libres ; l'homme est une personne (Anthropologie), voué au travail (Pédagogie).**

        | Texte | Titre du manuel |
        | 26. Idée d'une histoire universelle, 4e proposition | L'insociable sociabilité |
        | 28. Idée d'une histoire universelle, 6e proposition | L'homme est un animal qui a besoin d'un maître |
        | 27. Idée d'une histoire universelle, 7e proposition | Le progrès du genre humain |
        | 29. Qu'est-ce que les Lumières ? | Du libre usage de la raison |
        | 30. Projet de paix perpétuelle, 2e article | Une fédération d'États libres |
        | 31. Anthropologie, I, § 1 | Le Je et la conscience |
        | 32. Traité de pédagogie | L'homme doit travailler |

        ! L'insociable sociabilité n'est pas un défaut à corriger : c'est le moyen dont la nature se sert pour développer nos dispositions.
