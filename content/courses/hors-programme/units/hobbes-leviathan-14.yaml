# Unité de texte (voir content/textes.md) : Hobbes, Léviathan,
# chapitre 14, traduction G. Mairet (Gallimard). Découpage seul :
# rappels et cartes à écrire. Parties d'après les manchettes de l'édition.

id: "hobbes-leviathan-14"
title: "Léviathan, 14 : lois de nature et contrats"
subtitle: "Chapitre 14, Des première et seconde lois naturelles, et des contrats"
icon: "page"
color: "red"
group: "Hobbes : la politique"
depth: "normale"
lessons:
- id: "hobbes-leviathan-14-p1"
  title: "Le droit de nature, une liberté"
  notes: ""
  passage:
    label: "§1"
    part: "Ce qu'est le droit naturel"
    text: |-
      Le DROIT DE NATURE, que les écrivains politiques appellent communément *jus naturale,* est la liberté que chacun a d'user de sa propre puissance, comme il le veut lui-même pour la préservation de sa propre nature, autrement dit de sa propre vie et, par conséquent, de faire, selon son jugement et sa raison propres, tout ce qu'il concevra être le meilleur moyen adapté à cette fin.
  points: []
- id: "hobbes-leviathan-14-p2"
  title: "L'absence d'entraves extérieures"
  notes: ""
  passage:
    label: "§2"
    part: "Ce qu'est la liberté"
    text: |-
      Par LIBERTÉ, conformément à la signification propre du mot, j'entends l'absence d'entraves extérieures, entraves qui, souvent, peuvent détourner une part de la puissance de faire ce que l'on voudrait, sans cependant pouvoir empêcher l'usage de la puissance restante, conformément à ce que dictent notre jugement et notre raison.
  points: []
- id: "hobbes-leviathan-14-p3"
  title: "Un précepte trouvé par la raison"
  notes: ""
  passage:
    label: "§3"
    part: "Ce qu'est la loi de nature"
    text: |-
      Une LOI DE NATURE (*lex naturalis*) est un précepte, ou une règle générale trouvée par la raison selon laquelle chacun a l'interdiction de faire ce qui détruit sa vie, ou qui le prive des moyens de la préserver, et de négliger de faire ce par quoi il pense qu'elle serait le mieux préservée.
  points: []
- id: "hobbes-leviathan-14-p4"
  title: "Liberté et obligation"
  notes: ""
  passage:
    label: "§4"
    part: "Différence entre droit et loi"
    text: |-
      En effet, et bien que ceux qui écrivent sur ce sujet aient l'habitude de confondre *jus* et *lex (droit* et *loi*), il est néanmoins nécessaire de les distinguer, parce que le DROIT consiste en la liberté de faire ou de ne pas faire, alors que la LOI détermine et contraint dans un sens ou dans l'autre, en sorte que la loi et le droit diffèrent autant que l'obligation et la liberté, et se contredisent s'ils sont appliqués à un même objet.
  points: []
- id: "hobbes-leviathan-14-p5"
  title: "Un droit sur toute chose"
  notes: ""
  passage:
    label: "§5"
    part: "Par nature, chacun a le même droit sur toute chose"
    text: |-
      Parce que la condition humaine (comme cela a été établi au chapitre précédent) est un état de guerre de tous contre tous, où chacun est gouverné par sa propre raison, et parce qu'il n'y a rien dont on ne puisse faire usage contre ses ennemis, qui ne soit de quelque secours pour se maintenir en vie, il s'ensuit que, au sein d'un tel état, chacun a un droit sur toute chose, y compris sur le corps des autres.
  points: []
- id: "hobbes-leviathan-14-p5b"
  title: "Aucune sécurité"
  notes: ""
  passage:
    label: "§5"
    part: "Par nature, chacun a le même droit sur toute chose"
    text: |-
      Et donc, aussi longtemps que perdure ce droit naturel de chacun sur toute chose, il ne saurait y avoir de sécurité permettant à quiconque (si fort et avisé qu'il soit) de vivre tout le temps que la nature alloue ordinairement pour la vie.
  points: []
- id: "hobbes-leviathan-14-p5c"
  title: "Chercher la paix, se défendre"
  notes: ""
  passage:
    label: "§5"
    part: "La loi de nature fondamentale : rechercher la paix"
    text: |-
      Par conséquent, c'est un précepte et une règle générale de la raison *que chacun doit s'efforcer à la paix aussi longtemps qu'il a l'espoir de l'atteindre, et, quand il ne peut l'atteindre, qu'il peut chercher et utiliser tous les secours et les avantages de la guerre.* La première partie de cette règle contient la première et fondamentale loi de nature, qui est : *chercher la paix et la maintenir* ; la seconde, le résumé du droit de nature, qui est : *nous défendre nous-mêmes par tous les moyens possibles.*
  points: []
- id: "hobbes-leviathan-14-p6"
  title: "Abandonner ce droit sur toute chose"
  notes: ""
  passage:
    label: "§6"
    part: "La deuxième loi de nature : contracter en vue de la paix"
    text: |-
      À partir de cette loi de nature fondamentale, selon laquelle il est ordonné aux humains de s'efforcer à la paix, on déduit cette seconde loi de nature : *que ce soit la volonté de chacun, si c'est également celle de tous les autres, aussi longtemps qu'il le pensera nécessaire à la paix et à sa propre défense, d'abandonner ce droit sur toute chose, et qu'il soit satisfait de disposer d'autant de liberté à l'égard des autres que les autres en disposent à l'égard de lui-même.*
  points: []
- id: "hobbes-leviathan-14-p6b"
  title: "La réciprocité"
  notes: ""
  passage:
    label: "§6"
    part: "La deuxième loi de nature : contracter en vue de la paix"
    text: |-
      En effet, aussi longtemps que tout un chacun a ce droit de faire tout ce qui lui plaît, tous les hommes sont dans l'état de guerre. Mais si les autres n'abandonnent pas leur droit, comme il le fait lui-même, alors il n'y a aucune raison pour qui que ce soit de renoncer au sien, car ce serait s'exposer à être une proie (et à cela personne n'est tenu) au lieu de se disposer à la paix.
  points: []
- id: "hobbes-leviathan-14-p6c"
  title: "La loi de l'évangile"
  notes: ""
  passage:
    label: "§6"
    part: "La deuxième loi de nature : contracter en vue de la paix"
    text: |-
      Telle est la loi de l'évangile : *tout ce que vous voulez que les hommes fassent pour vous, faites-le vous-mêmes pour eux,* et la loi de tout le genre humain : *quod tibi fieri non vis, alteri ne feceris*.
  points: []
- id: "hobbes-leviathan-14-p7"
  title: "Se défaire d'une liberté"
  notes: ""
  passage:
    label: "§7"
    part: "Ce qu'est l'abandon d'un droit"
    text: |-
      *Abandonner* le *droit* que l'on a sur quelque chose, c'est *se défaire* de la *liberté* que l'on a d'empêcher un autre de profiter du droit qui est le sien sur cette même chose.
  points: []
- id: "hobbes-leviathan-14-p7b"
  title: "S'écarter du chemin d'un autre"
  notes: ""
  passage:
    label: "§7"
    part: "Ce qu'est l'abandon d'un droit"
    text: |-
      En effet, celui qui renonce à son droit, ou le transfère, ne donne pas à quelqu'un un droit que celui-ci n'aurait pas – pour la raison qu'il n'y a rien sur quoi on n'a aucun droit par nature –, il ne fait que s'écarter du chemin de celui qui, ainsi, jouit de ce droit originaire qui est le sien, sans empêchement de sa part, mais non de la part des autres. C'est ainsi que l'effet produit, quand on délaisse son droit, ne consiste qu'à réduire d'autant les entraves à l'exercice, par un autre, du droit originaire qui est le sien.
  points: []
- id: "hobbes-leviathan-14-p8"
  title: "Renoncement et transfert"
  notes: ""
  passage:
    label: "§8"
    part: "Ce qu'est renoncer à un droit, et ce qu'est le transférer"
    text: |-
      Un droit est abandonné, soit par un simple renoncement, soit par son transfert à un autre. Il y a RENONCEMENT *simple* quand on ne s'intéresse pas de savoir qui en tirera un bénéfice. Il y a TRANSFERT quand l'intention est qu'une ou des personnes déterminées en tireront un bénéfice.
  points: []
- id: "hobbes-leviathan-14-p8b"
  title: "Obligé de ne pas empêcher"
  notes: ""
  passage:
    label: "§8"
    part: "Obligation, devoir, injustice"
    text: |-
      Lorsque, de l'une ou l'autre de ces façons, on a abandonné ou donné son droit à un autre, on dit qu'on est OBLIGÉ ou CONTRAINT de ne pas empêcher ceux à qui un tel droit a été donné ou abandonné d'en tirer un bénéfice. On dit qu'il *doit,* et que c'est son DEVOIR de ne pas invalider son acte volontaire, et qu'une entrave de cette sorte est une INJUSTICE et un PRÉJUDICE, étant *sine jure,* le droit ayant été préalablement abandonné ou transféré.
  points: []
- id: "hobbes-leviathan-14-p8c"
  title: "L'injustice comme absurdité"
  notes: ""
  passage:
    label: "§8"
    part: "Obligation, devoir, injustice"
    text: |-
      C'est ainsi que *préjudice* et *injustice,* dans les polémiques du monde, ressemblent assez à ce qu'on appelle, dans les disputes scolastiques, une *absurdité.* En effet, dans ces disputes on appelait absurdité le fait de contredire ce qu'on avait déclaré au début. Pareillement, dans les affaires du monde, on appelle injustice et préjudice le fait de défaire volontairement ce qu'on avait volontairement fait au début.
  points: []
- id: "hobbes-leviathan-14-p8d"
  title: "Les signes du renoncement"
  notes: ""
  passage:
    label: "§8"
    part: "Obligation, devoir, injustice"
    text: |-
      Le moyen par lequel on renonce ou transfère simplement son droit est une déclaration ou une signification à l'aide d'un signe ou de signes volontaires et suffisants par lesquels on renonce ou transfère effectivement, ou par lesquels on a effectivement renoncé ou transféré ce droit à celui qui l'accepte. Ces signes sont ou bien des mots seulement, ou bien des actions seulement ; ou (comme c'est le plus souvent le cas) à la fois des mots et des actions.
  points: []
- id: "hobbes-leviathan-14-p8e"
  title: "Les chaînes qui lient"
  notes: ""
  passage:
    label: "§8"
    part: "Obligation, devoir, injustice"
    text: |-
      Et ceux-ci sont les CHAÎNES qui lient les humains et les obligent, chaînes dont la force n'est pas due à leur nature propre (car il n'y a rien de plus facile à rompre qu'une parole humaine), mais à la peur des conséquences malheureuses de leur rupture.
  points: []
- id: "hobbes-leviathan-14-p9"
  title: "Un acte volontaire, un bien pour soi"
  notes: ""
  passage:
    label: "§9"
    part: "Tous les droits ne sont pas aliénables"
    text: |-
      Chaque fois que l'on transfère son droit ou qu'on y renonce, c'est ou bien en considération d'un transfert réciproque d'un droit pour soi-même, ou bien parce qu'on en espère un autre bien. Car il s'agit d'un acte volontaire, et l'objet des actes volontaires de chacun est un *bien pour soi-même.*
  points: []
- id: "hobbes-leviathan-14-p9b"
  title: "Le droit de résister"
  notes: ""
  passage:
    label: "§9"
    part: "Tous les droits ne sont pas aliénables"
    text: |-
      Il y a donc certains droits dont il ne peut être entendu, par des mots ou par d'autres signes, que quelqu'un les a abandonnés ou transférés. C'est ainsi qu'on ne peut abandonner le droit de résister à ceux qui vous agressent par la violence pour vous ôter la vie, pour la raison que le but de cet abandon n'est pas d'obtenir un bien pour soi-même.
  points: []
- id: "hobbes-leviathan-14-p9c"
  title: "Les blessures, les fers, les geôles"
  notes: ""
  passage:
    label: "§9"
    part: "Tous les droits ne sont pas aliénables"
    text: |-
      Il en est de même des blessures, des fers, des geôles parce qu'il n'y a aucun bénéfice à retirer de pareilles souffrances, alors qu'il peut y en avoir à supporter celles d'un autre, blessé ou enfermé ; et aussi parce qu'on ne peut pas dire, quand plusieurs vous agressent violemment, s'ils ont, ou non, l'intention de vous mettre à mort.
  points: []
- id: "hobbes-leviathan-14-p9d"
  title: "La sécurité, but de tout abandon"
  notes: ""
  passage:
    label: "§9"
    part: "Tous les droits ne sont pas aliénables"
    text: |-
      Enfin, le motif et le but pour lesquels ce renoncement et ce transfert du droit sont introduits par quelqu'un ne sont rien d'autre que la sécurité de sa personne, de sa vie et des moyens de la préserver de telle sorte qu'elle ne lui soit pas insupportable. Si donc quelqu'un, par des mots ou par des signes, semble se spolier lui-même du but auquel ses signes se rapportaient, on ne doit pas comprendre que c'est cela qu'il disait, ou qu'il s'agissait de sa volonté, mais qu'il ignorait comment de tels mots et de tels actes devaient être interprétés.
  points: []
- id: "hobbes-leviathan-14-p10"
  title: "Le transfert mutuel du droit"
  notes: ""
  passage:
    label: "§10"
    part: "Ce qu'est un contrat"
    text: |-
      Le transfert mutuel du droit est ce qu'on nomme CONTRAT.
  points: []
- id: "hobbes-leviathan-14-p11"
  title: "Le droit et la chose"
  notes: ""
  passage:
    label: "§11"
    part: "Ce qu'est un contrat"
    text: |-
      Il y a une différence entre le transfert d'un droit sur une chose et le transfert, ou la livraison, c'est-à-dire le dépôt de la chose elle-même. En effet, la chose peut être délivrée avec la transmission du droit, comme lorsqu'on achète et vend au comptant, ou qu'on échange des marchandises ou des terres ; et la chose peut être délivrée quelque temps après.
  points: []
- id: "hobbes-leviathan-14-p12"
  title: "Pacte et promesse"
  notes: ""
  passage:
    label: "§12"
    part: "Ce qu'est une convention"
    text: |-
      D'ailleurs, l'un des contractants peut délivrer la chose pour laquelle il a contracté et laisser l'autre remplir sa part du contrat à une date ultérieure précise, et lui faire confiance pendant ce temps ; pour l'autre, le contrat, pour la part qui est la sienne, s'appelle PACTE OU CONVENTION. Ou bien les deux parties peuvent contracter maintenant et réaliser le contrat plus tard ; dans ces cas, de celui qui doit s'exécuter plus tard et en qui on a confiance, on dit qu'il *tient sa promesse,* ou sa parole, quand il s'exécute ; et ne pas s'exécuter (si c'est volontaire) c'est *violer sa parole.*
  points: []
- id: "hobbes-leviathan-14-p13"
  title: "Un transfert sans réciprocité"
  notes: ""
  passage:
    label: "§13"
    part: "Don gratuit"
    text: |-
      Quand le transfert du droit n'est pas mutuel, mais qu'une des parties le transfère avec l'espoir de gagner, par là, l'amitié ou le service d'un autre ou des amis de celui-ci ; ou bien avec l'espoir de se faire une réputation de charité, de largesse, ou pour libérer son esprit des douleurs de la compassion ; ou encore avec l'espoir d'une récompense au ciel, il ne s'agit pas là de contrat, mais de DON, de DON GRATUIT, de GRÂCE, mots qui signifient une seule et même chose.
  points: []
- id: "hobbes-leviathan-14-p14"
  title: "Au présent, au passé, au futur"
  notes: ""
  passage:
    label: "§14"
    part: "Signes exprès de contrat"
    text: |-
      Les signes de contrat sont soit *exprès,* soit *par inférence.* Sont exprès les mots énoncés en comprenant ce qu'ils signifient ; et ces mots sont ou bien au *présent* ou au *passé,* comme *je donne, j'accorde, j'ai donné, j'ai accordé, je veux que ceci soit à toi* ; ou au *futur,* comme *je donnerai, j'accorderai,* lesquels mots au futur sont appelés PROMESSE.
  points: []
- id: "hobbes-leviathan-14-p15"
  title: "Les mots, le silence, les actions"
  notes: ""
  passage:
    label: "§15"
    part: "Signes de contrat par inférence"
    text: |-
      Les signes par inférence sont tantôt la conséquence des mots, tantôt la conséquence du silence, tantôt la conséquence des actions, tantôt la conséquence de ce qu'une action n'est pas faite ; et, en général, un signe par inférence est tout ce qui, dans n'importe quel contrat, démontre suffisamment la volonté du contractant.
  points: []
- id: "hobbes-leviathan-14-p16"
  title: "La simple promesse n'oblige pas"
  notes: ""
  passage:
    label: "§16"
    part: "Le don gratuit se fait par des mots au présent ou au passé"
    text: |-
      Les mots seuls qui contiennent une simple promesse, s'ils se rapportent à l'avenir, sont un signe insuffisant de don gratuit et ne créent donc aucune obligation. En effet, s'ils se rapportent à l'avenir, comme *demain, je donnerai,* ils sont le signe que je n'ai pas encore donné, et, par conséquent, que je n'ai pas transféré mon droit, mais que celui-ci reste le mien jusqu'à ce que je le transfère par un autre acte, quel qu'il soit.
  points: []
- id: "hobbes-leviathan-14-p16b"
  title: "Les mots au présent ou au passé"
  notes: ""
  passage:
    label: "§16"
    part: "Le don gratuit se fait par des mots au présent ou au passé"
    text: |-
      Au contraire, si les mots se rapportent au présent, ou au passé, comme j'*ai donné, ou je donne pour que ce soit délivré demain,* alors j'ai renoncé aujourd'hui à mon droit de demain, et cela en vertu des mots, bien qu'il n'y ait pas d'autre attestation de ma volonté.
  points: []
- id: "hobbes-leviathan-14-p16c"
  title: "« Cras dabo »"
  notes: ""
  passage:
    label: "§16"
    part: "Le don gratuit se fait par des mots au présent ou au passé"
    text: |-
      Il y a une grande différence de signification entre ces mots *volo hoc tuum esse cras* et *cras dabo* ; entre *je veux que ceci soit à toi demain,* et *demain, je veux te le donner.* En effet, dans le premier énoncé, les mots *je veux* signifient une volonté présente, mais dans le second, ces mots renvoient à la promesse d'un acte volontaire à venir, et donc, les premiers mots étant au présent transfèrent un droit futur, alors que les derniers, qui sont au futur, ne transfèrent rien.
  points: []
- id: "hobbes-leviathan-14-p16d"
  title: "Le prix d'une course"
  notes: ""
  passage:
    label: "§16"
    part: "Le don gratuit se fait par des mots au présent ou au passé"
    text: |-
      Mais, s'il y a d'autres signes de la volonté, en dehors des mots, pour transférer le droit, alors, même si le don est gratuit, il n'en reste pas moins que le droit peut être transmis par des mots se rapportant au futur ; si quelqu'un offre un prix à celui qui arrive le premier au terme d'une course, le don est gratuit ; et bien que les mots renvoient au futur, néanmoins le droit est transmis, car s'il ne voulait pas que l'on comprenne ses paroles de cette façon, il ne devait pas laisser partir la course.
  points: []
- id: "hobbes-leviathan-14-p17"
  title: "Dans un contrat, le futur transmet"
  notes: ""
  passage:
    label: "§17"
    part: "Les signes du contrat sont les mots portant sur le présent, le passé et le futur"
    text: |-
      Dans les contrats, le droit est transmis, non seulement là où les mots sont au présent, ou au passé, mais aussi là où ils sont au futur, parce que tout contrat est une cession mutuelle ou un échange de droit. Et donc, celui qui promet seulement parce qu'il a déjà reçu le bénéfice pour lequel il promet, doit être compris comme s'il avait l'intention de céder son droit.
  points: []
- id: "hobbes-leviathan-14-p17b"
  title: "La promesse vaut convention"
  notes: ""
  passage:
    label: "§17"
    part: "Les signes du contrat sont les mots portant sur le présent, le passé et le futur"
    text: |-
      Car s'il n'était pas satisfait de la façon dont ses mots ont été compris, l'autre n'aurait pas exécuté le premier sa part du contrat. Aussi, pour cette raison, dans l'achat, la vente, et dans les autres actes contractuels, une promesse est l'équivalent d'une convention ; elle crée donc une obligation.
  points: []
- id: "hobbes-leviathan-14-p18"
  title: "Mériter son dû"
  notes: ""
  passage:
    label: "§18"
    part: "Ce qu'est le mérite"
    text: |-
      Celui qui, le premier, exécute sa part d'un contrat, on dit de lui qu'il MÉRITE ce qu'il reçoit lorsque l'autre exécute sa part, et qu'il a son *dû.*
  points: []
- id: "hobbes-leviathan-14-p18b"
  title: "Mériter un prix"
  notes: ""
  passage:
    label: "§18"
    part: "Ce qu'est le mérite"
    text: |-
      Pareillement, quand un prix est offert à plusieurs, qui doit être remis uniquement au vainqueur, ou quand de l'argent est lancé à plusieurs pour que ceux qui l'attrapent en profitent, bien qu'il s'agisse d'un don gratuit, néanmoins, le gagner et l'attraper ainsi, c'est le *mériter* et l'avoir comme un DÛ. En effet, le droit est transféré, en offrant le prix et en lançant l'argent, bien qu'à personne de façon précise, au terme d'une compétition.
  points: []
- id: "hobbes-leviathan-14-p18c"
  title: "Deux sortes de mérite"
  notes: ""
  passage:
    label: "§18"
    part: "Ce qu'est le mérite"
    text: |-
      Cependant, il y a cette différence entre ces deux sortes de mérite, que dans un contrat, je mérite en vertu de ma propre puissance et du besoin de celui qui contracte avec moi ; mais, dans ce cas du don gratuit, mon mérite vient uniquement de la générosité du donateur. Dans un contrat, je mérite du fait que le contractant se départit de son droit ; dans ce cas du don gratuit, je ne mérite pas parce que le donateur se départit de son droit, mais du fait que, s'étant départi de son droit, celui-ci devient le mien, plutôt que celui d'un autre.
  points: []
- id: "hobbes-leviathan-14-p18d"
  title: "Mériter « ex congruo »"
  notes: ""
  passage:
    label: "§18"
    part: "Ce qu'est le mérite"
    text: |-
      C'est là, je pense, la signification de la distinction des scolastiques entre *meritum congrui* et *meritum condigni.* Car Dieu tout-puissant ayant promis le paradis à ceux (égarés par les désirs charnels) capables de traverser ce monde conformément aux préceptes et limites prescrits par lui, il est dit que ceux qui feront ainsi mériteront le paradis *ex congruo.*
  points: []
- id: "hobbes-leviathan-14-p18e"
  title: "Personne ne mérite « ex condigno »"
  notes: ""
  passage:
    label: "§18"
    part: "Ce qu'est le mérite"
    text: |-
      En revanche, parce que personne ne peut revendiquer un droit au paradis à cause de sa propre rectitude ou en raison d'une autre puissance en lui, mais seulement par la grâce désintéressée de Dieu, il est dit que personne ne mérite le paradis *ex condigno*. Telle est, je pense, la signification de cette distinction ; mais parce que ceux qui en disputent ne sont pas d'accord sur la signification de leurs propres termes techniques, aussi longtemps que cela sert leur cause, je n'affirmerai rien au sujet de leur signification.
  points: []
- id: "hobbes-leviathan-14-p18f"
  title: "Ce que Hobbes affirme seulement"
  notes: ""
  passage:
    label: "§18"
    part: "Ce qu'est le mérite"
    text: |-
      Je dis seulement ceci : quand un don est fait sans en préciser le bénéficiaire, comme prix devant faire l'objet d'une compétition, celui qui le gagne le mérite, et peut le réclamer comme son dû.
  points: []
- id: "hobbes-leviathan-14-p19"
  title: "La suspicion raisonnable"
  notes: ""
  passage:
    label: "§19"
    part: "Quand les conventions de confiance mutuelle sont invalides"
    text: |-
      Si une convention est faite où aucune des parties ne s'exécute dans l'instant, mais où l'une et l'autre se font confiance, dans l'état de nature (qui est un état de guerre de tous contre tous), en cas de suspicion raisonnable, cette convention est nulle. Mais, s'il y a une puissance commune établie au-dessus des deux, dotée d'assez de droit et de force pour contraindre à l'exécution de la convention, alors celle-ci n'est pas nulle.
  points: []
- id: "hobbes-leviathan-14-p19b"
  title: "Les mots trop faibles sans la peur"
  notes: ""
  passage:
    label: "§19"
    part: "Quand les conventions de confiance mutuelle sont invalides"
    text: |-
      En effet, celui qui l'exécute en premier n'est aucunement assuré que l'autre s'exécutera après lui, parce que les liens établis par les mots sont trop faibles pour freiner les ambitions humaines (avarice, colère et autres passions) sans la peur d'un pouvoir coercitif qu'il n'est pas possible de supposer dans l'état de nature, là où tous sont égaux et juges de la légitimité de leurs propres peurs. Celui qui, le premier, exécute la convention se livre donc lui-même à son ennemi, ce qui est contraire au droit (qu'il ne peut jamais abandonner) de défendre sa vie et ses moyens de vivre.
  points: []
- id: "hobbes-leviathan-14-p20"
  title: "Dans l'état civil"
  notes: ""
  passage:
    label: "§20"
    part: "Quand les conventions de confiance mutuelle sont invalides"
    text: |-
      Mais, dans l'état civil, là où il existe une puissance établie pour contraindre ceux qui, autrement, violeraient leur parole, cette peur est sans raison ; c'est pourquoi celui qui, selon la convention, doit s'exécuter en premier, est obligé de le faire.
  points: []
- id: "hobbes-leviathan-14-p21"
  title: "Seul un fait nouveau annule"
  notes: ""
  passage:
    label: "§21"
    part: "Quand les conventions de confiance mutuelle sont invalides"
    text: |-
      La cause de la peur, qui rend une telle convention invalide, doit toujours être quelque chose qui surgit après que la convention a été conclue, comme un quelconque fait nouveau ou un autre signe de la volonté de ne pas l'honorer ; rien d'autre ne peut annuler une convention. En effet, ce qui ne peut empêcher quelqu'un de promettre ne saurait lui permettre de s'exécuter.
  points: []
- id: "hobbes-leviathan-14-p22"
  title: "Transférer les moyens d'en jouir"
  notes: ""
  passage:
    label: "§22"
    part: "Le droit à la fin contient le droit aux moyens"
    text: |-
      Celui qui transfère un droit transfère les moyens d'en jouir, dans la mesure où il le peut. C'est ainsi qu'il est entendu que celui qui vend un terrain transfère l'herbe et tout ce qui y pousse.
  points: []
- id: "hobbes-leviathan-14-p22b"
  title: "Du moulin à la souveraineté"
  notes: ""
  passage:
    label: "§22"
    part: "Le droit à la fin contient le droit aux moyens"
    text: |-
      Tout comme celui qui vend un moulin ne peut détourner la rivière qui l'actionne. Quant à ceux qui donnent à quelqu'un le droit de gouverner en toute souveraineté, il est entendu qu'ils lui donnent le droit de lever l'argent pour entretenir les soldats, et de désigner les magistrats pour l'administration de la justice.
  points: []
- id: "hobbes-leviathan-14-p23"
  title: "Sans acceptation mutuelle"
  notes: ""
  passage:
    label: "§23"
    part: "Pas de convention avec les bêtes"
    text: |-
      On ne fait pas de convention avec les bêtes brutes. Parce que, ne comprenant pas notre langage, elles ne comprennent et n'acceptent aucun transfert de droit ; elles ne peuvent pas non plus transférer un droit à une autre partie – or, il n'y a pas de convention sans acceptation mutuelle.
  points: []
- id: "hobbes-leviathan-14-p24"
  title: "Une acceptation inconnue"
  notes: ""
  passage:
    label: "§24"
    part: "Pas de convention avec Dieu sans révélation spéciale"
    text: |-
      Faire une convention avec Dieu est impossible, sauf par l'intercession de ceux à qui il parle, soit par révélation surnaturelle, soit par ses lieutenants qui gouvernent sous lui et en son nom, car sans cela nous ne savons pas si nos conventions sont, ou non, acceptées.
  points: []
- id: "hobbes-leviathan-14-p24b"
  title: "Les vœux"
  notes: ""
  passage:
    label: "§24"
    part: "Pas de convention avec Dieu sans révélation spéciale"
    text: |-
      Par conséquent, ceux qui font un vœu quelconque en opposition à une loi de nature, le font en pure perte car il est injuste de le réaliser. Et, si c'est une chose commandée par la loi de nature, alors ce n'est pas le vœu, mais la loi qui les engage.
  points: []
- id: "hobbes-leviathan-14-p25"
  title: "L'objet d'une délibération"
  notes: ""
  passage:
    label: "§25"
    part: "Pas de convention qui ne porte sur le possible et sur le futur"
    text: |-
      La matière, ou objet, d'une convention est toujours quelque chose qui vient en délibération (en effet, passer une convention est un acte de la volonté, c'est-à-dire un acte, et le dernier, de la délibération), et est donc toujours compris comme étant quelque chose à venir, et que celui qui passe une convention juge possible d'exécuter.
  points: []
- id: "hobbes-leviathan-14-p26"
  title: "À l'impossible, nul n'est tenu"
  notes: ""
  passage:
    label: "§26"
    part: "Pas de convention qui ne porte sur le possible et sur le futur"
    text: |-
      Par conséquent, promettre ce qu'on sait être impossible, ce n'est pas faire une convention. Mais si une chose s'avère impossible après coup, alors qu'on la pensait possible, la convention est valide et engage (bien que pas sur la chose même) malgré tout sur la valeur et, si cela aussi est impossible, à s'efforcer sans le feindre de tenir l'engagement autant que possible, car à l'impossible, nul n'est tenu.
  points: []
- id: "hobbes-leviathan-14-p27"
  title: "L'exécution et la dispense"
  notes: ""
  passage:
    label: "§27"
    part: "Se libérer d'une convention"
    text: |-
      On se libère d'une convention par deux moyens : en l'exécutant, ou en en étant dispensé. En effet, l'exécution est la fin naturelle de l'obligation ; et la dispense, la reprise de sa liberté, en tant que par elle on recouvre ce droit en quoi l'obligation consistait.
  points: []
- id: "hobbes-leviathan-14-p28"
  title: "La rançon"
  notes: ""
  passage:
    label: "§28"
    part: "Les conventions extorquées par la peur sont valides"
    text: |-
      À l'état de nature, les conventions qu'on a faites sont obligatoires. Par exemple, si je conviens de payer une rançon à un ennemi, ou un service pour sauver ma vie, j'y suis tenu. En effet, il s'agit d'un contrat au terme duquel l'un reçoit sa vie en bénéfice, l'autre reçoit de l'argent ou un service.
  points: []
- id: "hobbes-leviathan-14-p28b"
  title: "Les prisonniers et le prince"
  notes: ""
  passage:
    label: "§28"
    part: "Les conventions extorquées par la peur sont valides"
    text: |-
      Par conséquent, là où il n'existe pas d'autre loi (comme c'est le cas à l'état de nature) qui en interdise l'exécution, la convention est valide. Et donc, les prisonniers de guerre, si l'on croit qu'ils paieront leur rançon, sont obligés de la verser, et si un prince plus faible conclut une paix désavantageuse avec un plus fort, parce qu'il en a peur, il est tenu de la respecter, à moins (comme on l'a dit auparavant) que ne se découvre une nouvelle et juste cause de repartir en guerre.
  points: []
- id: "hobbes-leviathan-14-p28c"
  title: "Même dans les États"
  notes: ""
  passage:
    label: "§28"
    part: "Les conventions extorquées par la peur sont valides"
    text: |-
      Et, même dans les États, si je suis forcé de me racheter moi-même à un ravisseur en lui promettant de l'argent, je suis tenu de payer jusqu'à ce que la loi civile m'en dispense. Car, ce que je fais légitimement sans obligation peut légitimement faire l'objet d'une convention suscitée par la peur : et je ne peux rompre légitimement une convention légitime.
  points: []
- id: "hobbes-leviathan-14-p29"
  title: "On ne transmet pas deux fois"
  notes: ""
  passage:
    label: "§29"
    part: "Une convention antérieure annule une convention ultérieure"
    text: |-
      Une convention antérieure annule une convention ultérieure. En effet, si l'on a transmis son droit à quelqu'un aujourd'hui, on ne peut le transmettre demain à quelqu'un d'autre, et donc non seulement la dernière transaction ne transmet aucun droit, mais elle est nulle.
  points: []
- id: "hobbes-leviathan-14-p30"
  title: "Nul ne renonce à se préserver"
  notes: ""
  passage:
    label: "§30"
    part: "Une convention par laquelle on renoncerait à se défendre est nulle"
    text: |-
      Une convention par laquelle je renoncerais à recourir à la force pour me défendre contre la force est toujours nulle. Car (comme je l'ai montré auparavant) personne ne peut transférer, ou se défaire de son droit de se préserver de la mort, des blessures et de l'emprisonnement (éviter cela est le seul but pour lequel on abandonne un droit), et donc, la promesse de ne pas résister à la force ne transmet aucun droit dans aucune convention, et n'oblige à rien.
  points: []
- id: "hobbes-leviathan-14-p30b"
  title: "Le moindre mal"
  notes: ""
  passage:
    label: "§30"
    part: "Une convention par laquelle on renoncerait à se défendre est nulle"
    text: |-
      Car, si on peut convenir de ceci : *si je ne fais pas ceci ou cela, alors tue-moi* ; néanmoins, on ne peut convenir de ceci : *si je ne fais pas ceci ou cela, je ne te résisterai pas quand tu viendras me tuer.* Par nature, en effet, les humains choisissent le moindre mal, qui est le danger de mort qu'il y a à résister, plutôt que le plus grand, qui est la mort certaine et immédiate qu'il y a à ne pas résister. Et cela est accepté par tout le monde, parce que ceux qui conduisent les criminels à l'exécution ou en prison sont armés, indépendamment du fait que ces criminels ont consenti à la loi qui les condamne.
  points: []
- id: "hobbes-leviathan-14-p31"
  title: "L'accusation de soi"
  notes: ""
  passage:
    label: "§31"
    part: "Nul n'est obligé de s'accuser soi-même"
    text: |-
      Une convention par laquelle on s'accuse soi-même, sans assurance d'être pardonné, est pareillement nulle. En effet, dans l'état de nature, où chacun est juge, il n'y a pas de place pour l'accusation, et dans l'état civil, l'accusation est suivie de peine, c'est-à-dire de la force à laquelle on n'est pas tenu de ne pas résister.
  points: []
- id: "hobbes-leviathan-14-p31b"
  title: "Un père, une épouse, un bienfaiteur"
  notes: ""
  passage:
    label: "§31"
    part: "Nul n'est obligé de s'accuser soi-même"
    text: |-
      Il en est de même de l'accusation de ceux – un père, une épouse, un bienfaiteur – dont la condamnation provoque le malheur de quelqu'un. Car le témoignage d'un tel accusateur, s'il n'est pas fourni volontairement, est présumé corrompu par nature, et ne peut donc pas être reçu ; et, là où le témoignage de quelqu'un n'est pas recevable, il n'est pas tenu de le donner.
  points: []
- id: "hobbes-leviathan-14-p31c"
  title: "La torture"
  notes: ""
  passage:
    label: "§31"
    part: "Nul n'est obligé de s'accuser soi-même"
    text: |-
      De même, les accusations sous la torture ne doivent pas être considérées comme des témoignages ; en effet, la torture ne doit être utilisée que comme instrument de conjecture et d'éclaircissement dans l'investigation ultérieure et la recherche de la vérité. Dans ce cas, ce qui est avoué tend à soulager celui qui est torturé, non à informer celui qui torture, et ne peut donc être reconnu comme un témoignage suffisant : car, qu'on se libère par une accusation vraie ou fausse, on le fait selon le droit de préserver sa propre vie.
  points: []
- id: "hobbes-leviathan-14-p32"
  title: "Deux secours pour la parole"
  notes: ""
  passage:
    label: "§32"
    part: "Le but d'un serment"
    text: |-
      La force des paroles (comme je l'ai déjà dit) étant trop faible pour contraindre les humains à exécuter leurs conventions, il n'existe dans la nature humaine que deux secours imaginables pour les renforcer. Ce sont, ou bien la peur des conséquences du fait de ne pas tenir sa parole ; ou bien l'orgueil, ou la vanité de montrer qu'on n'a pas besoin de ne pas la tenir.
  points: []
- id: "hobbes-leviathan-14-p32b"
  title: "La peur, passion sur laquelle compter"
  notes: ""
  passage:
    label: "§32"
    part: "Le but d'un serment"
    text: |-
      Pour ce qui est du dernier, il s'agit d'une générosité trop peu répandue pour la supposer chez ceux, en particulier, qui recherchent la richesse, l'autorité, ou le plaisir sensuel, et qui constituent la plus grande partie du genre humain. La passion sur laquelle on peut compter est la peur, dont il y a deux objets très généraux, l'un est la puissance des esprits invisibles, l'autre la puissance de ceux qui sont offensés du fait qu'on n'a pas tenu sa parole.
  points: []
- id: "hobbes-leviathan-14-p32c"
  title: "Les deux peurs"
  notes: ""
  passage:
    label: "§32"
    part: "Le but d'un serment"
    text: |-
      Entre ces deux objets, bien que le premier soit d'un plus grand pouvoir, c'est la peur du second qui, d'ordinaire, est la plus grande peur. Dans le premier cas, la peur est, en chacun, sa propre religion, qui existe dans la nature humaine avant toute société civile. Dans le second la peur n'a pas sa place, en tout cas pas assez pour contraindre les humains à tenir leurs promesses, parce que dans l'état de nature, l'inégalité de puissance n'est reconnaissable qu'à la fin de la bataille.
  points: []
- id: "hobbes-leviathan-14-p32d"
  title: "La peur de la puissance invisible"
  notes: ""
  passage:
    label: "§32"
    part: "Le but d'un serment"
    text: |-
      En sorte que, avant le temps de la société civile, ou pendant son interruption par la guerre, il n'y a rien qui puisse renforcer une convention de paix agréée, contre les tentations de l'avarice, de l'ambition, de la lubricité et de tel autre puissant désir, si ce n'est la peur de cette puissance invisible à qui tous vouent un culte sous le nom de Dieu, et qui leur fait peur en les punissant pour leur méchanceté.
  points: []
- id: "hobbes-leviathan-14-p32e"
  title: "La définition du serment"
  notes: ""
  passage:
    label: "§32"
    part: "Le but d'un serment"
    text: |-
      Donc, tout ce qui peut être fait entre deux hommes non sujets de la puissance civile, est de les faire jurer l'un l'autre par le Dieu qu'ils craignent : un tel acte de *jurer* ou SERMENT est une *formule s'ajoutant à une promesse, par laquelle celui qui promet signifie que, à défaut de s'exécuter, il renonce à la miséricorde de son Dieu ou appelle sa vengeance sur lui.*
  points: []
- id: "hobbes-leviathan-14-p32f"
  title: "La formule païenne et la nôtre"
  notes: ""
  passage:
    label: "§32"
    part: "La forme de notre serment"
    text: |-
      Telle était la formule païenne : *que* Jupiter *me tue comme je tue cette bête.* Telle est notre formule : *je ferai telle et telle chose, et que Dieu m'aide,* et cela selon les rituels et le cérémonial que chacun pratique dans sa propre religion, de sorte que la peur de trahir sa foi en soit plus grande.
  points: []
- id: "hobbes-leviathan-14-p33"
  title: "On ne jure que par Dieu"
  notes: ""
  passage:
    label: "§33"
    part: "Serment : que par Dieu"
    text: |-
      On voit par là que tout serment prêté selon toute autre forme ou rite que celui qui jure est prêté en vain, et n'est pas un serment, et qu'on ne jure pas sur quoi que ce soit dont celui qui jure pense qu'il ne s'agit pas de Dieu. En effet, bien qu'ils avaient parfois l'habitude de jurer par leurs rois, par peur et par flatterie, les humains voulaient signifier par là qu'ils leur rendaient un honneur divin ; que jurer par Dieu sans nécessité, c'est profaner son nom ; que jurer par d'autres choses comme on le fait dans la conversation courante, ce n'est pas jurer, mais une habitude impie suscitée par une trop grande véhémence dans la discussion.
  points: []
- id: "hobbes-leviathan-14-p34"
  title: "Licite ou non"
  notes: ""
  passage:
    label: "§34"
    part: "Un serment n'ajoute rien à l'obligation"
    text: |-
      On voit aussi que le serment n'ajoute rien à l'obligation. Car une convention, si elle est licite, engage sous le regard de Dieu, avec un serment aussi bien que sans serment ; si elle n'est pas licite, elle n'engage à rien du tout, même si elle est confirmée par un serment.
  points: []
