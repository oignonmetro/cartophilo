- id: platon-phedon-apologie-l4
  title: "Il ne faut pas se tuer, et pourtant le philosophe accepte de mourir (61c-63e)"
  notes: |-
    La première difficulté de l'apologie est un **paradoxe** : le philosophe doit consentir à mourir, mais il lui est interdit de se tuer. Socrate montre qu'{green}__il n'y a là rien d'absurde__{/green}, puis il doit répondre à une objection plus redoutable : pourquoi un homme sensé accepterait-il de quitter de bons maîtres, les dieux ?

    **Le paradoxe.** Socrate fait dire à Évènos, s'il est sage, de {teal}« se mettre à [s]a poursuite le plus vite possible »{/teal}. Évènos le fera volontiers s'il est philosophe, ajoute-t-il, mais {red}sans aller jusqu'à se tuer{/red}, car c'est interdit. Cébès s'étonne : il est interdit de se tuer, et pourtant le philosophe {teal}« doit chercher à suivre celui qui meurt »{/teal} (61d).

    **Une règle absolue dans un monde où tout dépend du sort.** Socrate précise ce qui déconcerte. Ordinairement, ce qui est bon ou mauvais l'est selon les circonstances : la santé, la richesse, la vie même ne valent que selon l'usage et le moment. Or il paraît que {amber}« cette unique chose, entre toutes, soit absolue »{/amber} (62a) : {teal}« qu'il y a des moments où, et des gens pour qui, il vaut mieux être mort que vivre »{/teal} (62a). Et l'étrangeté redouble : si la mort est un bien pour ces hommes, pourquoi leur serait-il {red}impie de se procurer ce bienfait{/red}, au lieu d'attendre {teal}« un bienfaiteur étranger »{/teal} (62a) ?

    **La formule des Mystères : nous n'appartenons pas à nous-mêmes.** Socrate s'appuie sur une formule sacrée, sans doute orphique ou pythagoricienne : {teal}« Nous, les humains, sommes comme assignés à résidence et nul ne doit s'affranchir lui-même de ces liens ni s'évader »{/teal} (62b). Socrate en retient au moins ceci : {coral}les dieux sont nos gardiens, et nous faisons partie de leurs troupeaux{/coral}. L'argument se fait alors par {yellow}analogie avec un propriétaire{/yellow} : si l'un de tes esclaves se tuait sans que tu lui aies signifié vouloir sa mort, ne serais-tu pas en colère ? La prémisse implicite qui rend l'argument contraignant est que __notre vie n'est pas notre propriété__ : on ne dispose pas de ce qui appartient à un autre. Il ne faut donc pas se donner la mort {teal}« avant qu'un dieu ne nous ait envoyé quelque signe inéluctable, pareil à celui qui maintenant, pour nous, est là »{/teal} (62c) : Socrate lit sa condamnation comme ce signe, l'occasion que lui donne le dieu d'achever d'être ce qu'il est.

    ? ***Phroura*** : le mot de la formule des Mystères pour la condition humaine. Il désigne à la fois un lieu de détention, d'où l'on n'a pas le droit de s'évader (le corps-prison), et un poste de garde, qu'on n'a pas le droit de déserter ; Platon laisse jouer les deux sens.

    **L'objection de Cébès : les sensés devraient se révolter.** Cébès accepte l'interdiction, mais en tire une conséquence qui ruine l'attitude de Socrate. Si les dieux sont nos gardiens et {teal}« les meilleurs maîtres qui soient »{/teal} (62d), nul homme sensé ne peut croire qu'une fois libéré il prendra mieux soin de lui-même ; seul un insensé voudrait fuir un bon maître. D'où le renversement : {red}« c'est aux hommes sensés qu'il convient de se révolter quand ils meurent, et aux insensés de s'en réjouir »{/red} (62e). Simmias ajoute que l'objection vise Socrate lui-même, qui abandonne si facilement ses amis et les dieux.

    **La défense : un espoir, pas encore une preuve.** Socrate accepte de se défendre {teal}« comme devant un tribunal »{/teal} (63b), et de façon {teal}« plus persuasive »{/teal} (63b) que devant ses juges. Il ne se révolte pas parce qu'il croit aller {green}auprès d'autres dieux, sages et bons{/green}, et peut-être auprès d'hommes meilleurs. Il distingue la force de ses deux espoirs : celui de rejoindre des hommes bons, il ne le défendra pas jusqu'au bout ; celui d'aller auprès de {teal}« dieux qui sont des maîtres parfaitement bons »{/teal} (63c), il le défendra {teal}« envers et contre tout »{/teal} (63c). Mourir n'est donc pas quitter la tutelle des dieux, mais passer à une tutelle aussi bonne. Seulement, ce n'est encore qu'un **espoir**, appuyé sur une tradition : il suppose que l'âme subsiste après la mort, ce que Cébès exigera qu'on démontre (70a-b).

    ! Il n'y a pas de contradiction entre désirer la mort et refuser le suicide : la vie appartient aux dieux, et c'est à eux d'envoyer le signe.
    ! *Phroura* a deux sens, prison et poste de garde ; Platon laisse probablement jouer les deux.
    ! L'apologie ne prouve pas l'immortalité : elle fonde une attitude sur un espoir que les arguments devront justifier.
