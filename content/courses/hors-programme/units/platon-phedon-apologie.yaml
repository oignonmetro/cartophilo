- id: platon-phedon-apologie-l7
  title: "La purification : pourquoi le philosophe ne peut pas craindre la mort (67b-68b)"
  notes: |-
    De l'opinion des philosophes, Socrate tire la conclusion de l'apologie : puisque la philosophie est une **purification** et que la purification est une **déliaison**, {green}__il serait le comble de l'illogisme qu'un philosophe ait peur de mourir__{/green}.

    **La purification, c'est la séparation.** Qui arrive là où va Socrate a {teal}« grand espoir »{/teal} d'y acquérir ce qu'il a cherché toute sa vie, à condition que sa réflexion soit {teal}« comme purifiée »{/teal} (67c). Or la {violet}purification{/violet} (*katharsis*), c'est justement {teal}« séparer le plus possible l'âme du corps, l'habituer à se rassembler elle-même en elle-même à partir de tous les points du corps »{/teal} (67c), à vivre {teal}« isolée en elle-même »{/teal} (67d), à se délier du corps {yellow}« comme on se délie de ses chaînes »{/yellow} (67d).

    ? **Purification** (*katharsis*) : mot des rites religieux que Platon reprend pour désigner le travail par lequel la pensée sépare l'âme du corps et se dégage de ce que le corps induit en elle. La pureté n'est plus une affaire de rites, mais de réflexion.

    **Deux noms pour une même opération.** Ce qu'on nomme mort est {teal}« une déliaison et une séparation de l'âme d'avec le corps »{/teal} ; or ceux qui ne cessent de s'employer à délier l'âme sont {teal}« seulement ceux qui philosophent droitement »{/teal} (67d). Philosopher et mourir désignent donc la même séparation : quand le philosophe pense, elle s'appelle philosopher ; quand il considère ce qu'il fait, elle s'appelle mourir. D'où la formule : {coral}« ceux qui philosophent droitement s'exercent à mourir »{/coral} (67e).

    **L'argument : la peur serait le comble de l'illogisme.** Le philosophe est {teal}« complètement brouillé »{/teal} (67e) avec son corps et désire que son âme soit toute à elle-même. S'il avait peur au moment où cela arrive, il se révolterait contre ce qu'il a désiré toute sa vie : ce serait {red}« le comble de l'illogisme »{/red}. Le mot « là-bas » joue ici sur deux sens, l'Hadès et le lieu des réalités invisibles : c'est cette équivoque qui fait de la mort le terme du désir de penser.

    **L'argument *a fortiori* : les amants qui descendent chez Hadès.** {yellow}Bien des hommes, pour une épouse ou un jeune garçon aimés et morts, ont voulu aller dans l'Hadès{/yellow}, dans l'espoir d'y revoir l'objet de leur désir (on pense à Orphée). Si un amour humain suffit à faire affronter la mort, à plus forte raison celui qui est {teal}« réellement amoureux »{/teal} (68a) de la pensée, et qui croit ne pouvoir la rencontrer en toute pureté que là-bas, se réjouira-t-il d'y aller.

    **Le signe de reconnaissance.** D'où un {violet}« signe de reconnaissance »{/violet} (*tekmêrion*), un indice infaillible : {teal}« si tu vois un homme se révolter quand il est sur le point de mourir, c'est qu'il n'était pas ami du savoir, philosophe, mais un quelconque ami du corps »{/teal} (68b-c), et aussi, peut-être, {pink}ami de l'argent, ami des honneurs{/pink}. L'ambitieux est rangé parmi les amis du corps : comme l'avare, il cherche à avoir le dessus sur les autres, non à se dominer lui-même.

    ! La purification platonicienne n'est pas un rite : elle désigne le travail par lequel la pensée se dégage de ce que le corps induit en elle.
    ! *S'exercer à mourir* ne veut pas dire désirer périr : la mort dont il s'agit est la séparation de l'âme d'avec le corps, que la pensée pratique dès cette vie.
