- id: platon-phedon-apologie-l3
  title: "Le prologue : ce que les premiers mots annoncent (57a-61c)"
  notes: |-
    Le prologue ne fait pas que planter le décor : selon son habitude, Platon y emploie dans leur sens courant des mots qui seront ensuite **retravaillés**, et qui annoncent le vrai sujet du dialogue.

    **« Toi-même » : qui est Phédon, qui est Socrate ?** Le premier mot d'Échécrate est {teal}« Toi-même »{/teal} (*autos*) : était-il présent lui-même, ou l'a-t-il appris d'un autre ? Sous la question banale du témoin se cache celle de tout le dialogue : {amber}à quoi identifier ce « soi-même », au corps ou à l'âme ?{/amber} À la fin, Socrate reprochera à Criton de croire qu'on enterrera « Socrate », alors qu'on n'enterrera qu'un corps (115c-e). {sky}Monique Dixsaut{/sky} y voit le passage décisif où l'homme cesse de se penser comme son corps pour se penser comme son âme.

    **Le délai de Délos : une cité qui doit rester pure.** Socrate n'est pas mort le lendemain du verdict, parce que la veille, on avait couronné la poupe du {yellow}navire envoyé à Délos{/yellow} en mémoire de Thésée ; pendant tout ce voyage, {teal}« la cité restera pure »{/teal} (58b), et l'on n'exécute personne. Cette pureté rituelle, qui consiste seulement à s'abstenir un temps de verser le sang, annonce le thème central de l'apologie : la **purification** véritable, celle de l'âme par la pensée.

    **Un sentiment déconcertant : plaisir et douleur mêlés.** Phédon n'éprouvait pas de pitié, tant Socrate paraissait heureux ; mais pas non plus le plaisir habituel de philosopher avec lui : un {teal}« curieux mélange où entrait certes du plaisir, mais aussi de la douleur »{/teal} (59a), la douleur revenant chaque fois qu'il pensait à la mort prochaine. Les assistants passent du rire aux larmes.

    **L'agréable et le pénible : deux contraires qui se suivent.** Délié de ses chaînes, Socrate frotte sa jambe et s'étonne : en l'homme, {teal}« aucun des deux ne consent à coexister avec l'autre »{/teal} (60b), et pourtant qui attrape l'un attrape presque toujours l'autre, {yellow}« comme si, bien qu'étant deux, ils étaient attachés à une unique tête »{/yellow} (60b). Il en fait une fable à la manière d'{sky}Ésope{/sky}. L'observation est minuscule, mais elle contient en germe le **premier argument** (70c-72e) : {coral}des contraires ne coexistent pas, mais ils naissent l'un de l'autre{/coral}.

    **Le rêve : « fais une œuvre d'art ».** Cébès demande pourquoi Socrate, qui n'avait jamais rien composé, s'est mis en prison à écrire un hymne à Apollon et à mettre en vers les fables d'Ésope. Un même rêve lui disait souvent : {teal}« Socrate, disait-il, fais une œuvre d'art, travaille »{/teal} (60e). Il croyait jusque-là que le rêve l'encourageait à continuer ce qu'il faisait, car {green}__« la philosophie était l'œuvre d'art la plus haute » (61a)__{/green} ; par scrupule, il a voulu obéir aussi au sens ordinaire du mot. Mais, n'étant pas doué pour inventer des histoires, il a pris celles d'Ésope : il **transpose** au lieu d'inventer, comme Platon transpose dans le *Phédon* le récit d'un témoin.

    ! Le prologue n'est pas un simple décor : « toi-même », la pureté, les contraires qui se suivent, la musique et Apollon annoncent les thèmes de tout le dialogue.
    ! Socrate ne renie pas la philosophie pour la poésie : il obéit au rêve par scrupule, en tenant toujours la philosophie pour « l'œuvre d'art la plus haute » (61a).
