- id: platon-phedon-apologie-l6
  title: "Le corps, obstacle à la pensée : le raccourci des philosophes (65a-67b)"
  notes: |-
    Le corps ne procure pas seulement des plaisirs : c'est aussi **par lui que nous sentons**, et c'est par là qu'il fait {red}obstacle à la pensée{/red}. Socrate en tire, dans le discours que les philosophes se tiennent entre eux, une conclusion décisive : {green}__le savoir pur n'est possible qu'une fois l'âme séparée du corps__{/green}.

    **Les sens ne donnent rien d'exact.** La vue et l'ouïe, les plus fines des perceptions, ne comportent aucune vérité exacte ; les autres le sont moins encore. Chaque fois que l'âme se sert du corps pour examiner quelque chose, {teal}« il est évident qu'elle est totalement trompée par lui »{/teal} (65b). Ce qu'est réellement une chose ne se manifeste que {coral}« dans l'acte de raisonner, et nulle part ailleurs »{/coral} (65c).

    **L'âme pense le mieux quand elle se rassemble en elle-même.** Elle raisonne le plus parfaitement {teal}« quand ne viennent la perturber ni audition, ni vision, ni douleur, ni plaisir aucun »{/teal} (65c), quand elle {teal}« se concentre le plus possible en elle-même et envoie poliment promener le corps »{/teal} (65c). La séparation d'avec le corps est donc à la fois la conséquence du désir de connaître et la condition de la connaissance.

    **Le juste, le beau, le bon : jamais vus des yeux.** Socrate fait admettre qu'{amber}il existe « quelque chose de juste en soi » (65d), de beau, de bon{/amber}, et que personne ne l'a jamais vu de ses yeux. Il en va de même de ce qu'est {yellow}la grandeur, la santé, la force{/yellow} : leur {violet}essence{/violet}, {teal}« ce que chacune se trouve être »{/teal} (65e). Puisque ces réalités ne tombent pas sous les sens, seule la pensée y accède, et celui qui les atteindra le mieux est celui qui use {teal}« de la pensée en elle-même et sans mélange »{/teal} (66a) pour {teal}« faire la chasse à ce que chacun des êtres est en lui-même et sans mélange »{/teal} (66a). Le principe implicite est celui de la **parenté** : seul ce qui est pur peut saisir ce qui est pur.

    ? **Réalités en soi** : le juste, le beau, le bon, l'égal *en soi*, c'est-à-dire ce que chaque chose est elle-même, son {violet}essence{/violet}, que les sens ne saisissent jamais et que seule la pensée atteint. Platon les nomme aussi **Formes** (*eidos*) : le mot n'apparaît dans le dialogue qu'en 102b.

    **Le corps, obstacle en deux sens.** Les philosophes se tiennent alors un discours, un {teal}« raccourci »{/teal} qui les mène droit au but. Le corps est d'abord un obstacle **extérieur** : il est source de {teal}« mille affairements »{/teal} (66b), parce qu'il faut le nourrir et le soigner ; il nous remplit de désirs, de peurs et de futilités ; {teal}« toutes les guerres ont pour origine l'appropriation des richesses »{/teal} (66c), et {teal}« c'est le corps qui nous force à les acquérir »{/teal} (66d). Il ne nous laisse ainsi jamais de {violet}temps libre{/violet} (*skholê*) pour la philosophie. Il est ensuite un obstacle **intérieur** : même quand on se met à chercher, {teal}« le voilà qui débarque au milieu de nos recherches »{/teal} (66d), il trouble et étourdit, si bien que nous ne discernons pas le vrai.

    **Le dilemme : le savoir après la mort, ou nulle part.** D'où la conclusion : {teal}« si nous devons jamais savoir purement quelque chose, il faut que nous nous séparions de lui et que nous considérions avec l'âme elle-même les choses elles-mêmes »{/teal} (66d-e). Or, s'il est impossible de rien connaître purement avec le corps, alors :
    - {red}ou bien il n'existe aucun moyen d'acquérir le savoir{/red}
    - {green}ou bien on ne l'acquiert qu'après la mort{/green}, quand l'âme sera séparée du corps

    La première branche est exclue par une prémisse que le philosophe ne peut pas lâcher : __son désir de savoir n'est pas vain__. Reste la seconde. Ce n'est pas la recherche qui est remise à après la mort, mais la **possession** pleine du savoir ; de notre vivant, nous nous en approcherons d'autant plus que nous nous serons purifiés du corps, {teal}« jusqu'à ce que le dieu lui-même nous ait déliés »{/teal} (67a). Car {coral}« ne pas être pur et se saisir du pur, il faut craindre que ce ne soit pas là chose permise »{/coral} (67b).

    ! Le corps n'est pas mauvais en lui-même : il l'est en tant qu'il disperse l'attention et interpose sa manière de connaître entre la pensée et le vrai.
    ! Le dilemme ne décourage pas la recherche présente : seule la possession complète du savoir est différée.
    ! Le raccourci n'est pas le suicide : c'est le discours qui empêche la recherche de s'égarer dans le sensible.
