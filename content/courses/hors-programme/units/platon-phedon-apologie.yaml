- id: platon-phedon-apologie-l8
  title: "Vertus en trompe-l'œil et vertu vraie : la pensée, seule monnaie (68b-69e)"
  notes: |-
    L'apologie s'achève sur les **vertus**. Si l'on remonte des actes à leurs motifs, le courage et la modération du grand nombre se révèlent être leur contraire ; {green}__seule la pensée rend les vertus vraies__{/green}, parce qu'elle seule purifie l'âme de ses fausses peurs et de ses faux plaisirs.

    **Le courage du grand nombre est une lâcheté.** Pour presque tous, la mort est l'un des plus grands maux. Quand ils l'affrontent, c'est donc {teal}« par peur de maux encore plus grands »{/teal} (68d) : la honte, l'esclavage, le déshonneur. Le ressort de leur action reste la peur ; ils ne dominent pas la peur de la mort, ils sont dominés par une peur plus forte. Or être gouverné par la peur, c'est la définition même de la lâcheté : ils sont courageux {red}« par peur et par lâcheté »{/red} (68d), ce qui est absurde.

    **Leur modération est un dérèglement.** De même, ceux qui ont une conduite réglée s'abstiennent de certains plaisirs parce qu'ils ont peur d'être privés d'autres plaisirs qui leur font envie. Ils ne dominent certains plaisirs que {red}« parce qu'ils sont dominés par des plaisirs »{/red} : c'est {teal}« d'une certaine manière, un dérèglement qui les rend modérés »{/teal} (69a). La raison est la même : tant que le plaisir reste le critère, on calcule mieux, mais on reste esclave.

    **L'image de la monnaie.** Ce n'est pas, pour acquérir la vertu, {teal}« un mode correct d'échange »{/teal} (69a) que celui {teal}« qui consiste à échanger des plaisirs contre des plaisirs, des peines contre des peines, de la peur contre de la peur »{/teal} (69a), plus contre moins, {yellow}« comme si c'étaient des pièces de monnaie »{/yellow} (69a). Un tel calcul ne fait jamais que troquer le même contre le même. Il n'y a qu'{amber}« une seule monnaie qui vaille et en fonction de laquelle tout cela doit être échangé : la pensée »{/amber} (*phronêsis*). Achetées avec elle, ces choses deviennent {teal}« réellement, du courage, de la modération, de la justice »{/teal} (69b), une vertu {teal}« qu'accompagne de la pensée »{/teal} (69b). Coupée de la pensée, la vertu n'est qu'une {red}« vertu en trompe-l'œil »{/red} (*skiagraphia*, une peinture d'ombres qui donne l'illusion du relief), {red}« vertu réellement servile »{/red} (69b). La métaphore a ses limites : la pensée, à la différence d'une pièce, ne se perd pas quand on « achète » avec elle, et elle vaut par elle-même ; elle dit surtout que **la pensée est la mesure commune** qui seule permet de juger ce qui est vraiment à craindre et vraiment désirable.

    ? **Pensée** (*phronêsis*) : l'activité de l'âme qui, rassemblée en elle-même, saisit ce qui est ; le dialogue la définit comme l'état de l'âme au contact de ce qui reste toujours semblable à soi (79d). Ce n'est pas une vertu parmi d'autres, mais ce qui rend les vertus vraies.

    **La vertu vraie est une purification.** Le vrai {teal}« constitue une purification à l'égard de toutes les choses de cette sorte »{/teal} (69b-c), et la pensée est {teal}« comme un moyen de cette purification »{/teal} (un *katharmos*, mot des Mystères). En déterminant ce qui est vraiment un mal, et ce qui est vraiment agréable ou pénible, la pensée débarrasse l'âme de ses peurs illusoires et de ses faux plaisirs : le courage vrai n'est pas un sentiment dompté par une volonté, il est fait de réflexion.

    **Les Bacchants : la vraie initiation.** Ceux qui ont institué les initiations disaient que le non-initié {teal}« sera couché dans le bourbier »{/teal} (69c), et l'initié {teal}« partagera, une fois arrivé là-bas, la demeure des dieux »{/teal} (69c) ; et encore : {yellow}« des porteurs de thyrse, oui, il y en a beaucoup, mais les Bacchants sont rares »{/yellow} (69c-d). Socrate donne à la formule son sens philosophique : les vrais Bacchants, les vrais initiés, {coral}« ne sont autres que ceux qui, toujours, se sont occupés à philosopher droitement »{/coral} (69d).

    **La fin de l'apologie.** Telle est sa défense : il est raisonnable de quitter ses amis et les maîtres d'ici sans révolte, puisqu'il croit trouver là-bas des maîtres et des compagnons bons. Si elle convainc mieux que devant les juges d'Athènes, {teal}« tant mieux »{/teal}. Mais ce n'est qu'une conviction, que seuls partagent ceux qui sont déjà philosophes : il reste à montrer que l'âme subsiste.

    | Vertu | Ce qu'elle est chez le grand nombre | Ce qu'elle est avec la pensée |
    | courage | affronter un danger par peur d'un plus grand : une lâcheté | savoir ce qui est vraiment à craindre |
    | modération | renoncer à des plaisirs par envie d'autres : un dérèglement | ne pas être dominé par les plaisirs, parce qu'on sait ce qu'ils valent |

    ! Platon ne nie pas que le soldat tienne son poste : il nie que ce comportement soit une vertu quand son motif est la peur.
    ! La pensée n'est pas une vertu parmi d'autres qu'on échangerait : elle est ce qui rend les autres vertus vraies.
    ! Socrate ne rejette pas les Mystères : il en donne le sens philosophique.
