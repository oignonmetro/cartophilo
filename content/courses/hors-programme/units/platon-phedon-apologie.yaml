- id: platon-phedon-apologie-l5
  title: "Philosopher, c'est s'occuper de mourir : la mort et les plaisirs du corps (63e-65a)"
  notes: |-
    Socrate transforme sa défense en thèse : il serait **absurde** que le philosophe craigne la mort, parce que {green}__philosopher, c'est déjà s'occuper de mourir__{/green}. Pour le montrer, il lui faut d'abord dire ce qu'est la mort, puis montrer que la vie du philosophe en est l'exercice.

    **La thèse.** {teal}« tous ceux qui s'appliquent à la philosophie et s'y appliquent droitement ne s'occupent de rien d'autre que de mourir et d'être morts »{/teal} (64a). Si c'est vrai, il serait déconcertant d'avoir eu cette seule chose à cœur toute sa vie, et de se révolter quand elle arrive. Simmias en rit : la foule dirait que les philosophes réclament la mort et la méritent bien. Socrate répond qu'elle ne dirait vrai qu'à moitié, car elle ignore {amber}« en quel sens réclament la mort ceux qui sont vraiment philosophes, en quel sens ils méritent la mort, et laquelle »{/amber} (64b). Il faut donc s'entendre sur ce qu'est la mort.

    **La définition de la mort : une séparation.** {teal}« Se peut-il qu'elle soit autre chose que la séparation de l'âme d'avec le corps ? »{/teal} (64c) Être mort, c'est que le corps, séparé de l'âme, {teal}« en vient à n'être que lui-même en lui-même »{/teal} (64c), et que l'âme, séparée du corps, {teal}« est elle-même en elle-même »{/teal} (64c). La définition est volontairement **minimale** : elle dépouille la mort des images et des terreurs qu'on y attache, et elle ne dit pas encore combien de temps l'âme subsiste ainsi séparée. Elle ne présuppose donc pas l'immortalité, mais seulement que l'âme et le corps sont deux choses distinctes ; c'est la persistance de l'âme séparée que Cébès mettra en doute (70a).

    ? **Mort** : dans le *Phédon*, la séparation de l'âme d'avec le corps, chacun devenant lui-même en lui-même. La définition ne dit rien de ce que devient l'âme ensuite.

    **Le philosophe ne prend pas au sérieux les plaisirs du corps.** Socrate passe en revue {yellow}les plaisirs de la nourriture et de la boisson, les plaisirs charnels, les manteaux et les chaussures distingués{/yellow} : le philosophe ne leur accorde aucune importance, {teal}« pour autant du moins qu'il n'est pas absolument obligé d'en prendre sa part »{/teal} (64e). Ce n'est pas un **ascétisme** : il ne s'impose pas de privations par haine du corps, il n'y prend tout simplement pas plaisir, parce que son désir est tourné vers autre chose, qui en vaut davantage. Sa préoccupation n'est pas de soigner le corps mais {teal}« de s'en éloigner autant qu'il en est capable, et de se tourner vers l'âme »{/teal} (64e).

    **C'est là qu'apparaît la ressemblance avec la mort.** Le philosophe {coral}« délie son âme, autant qu'il le peut, de toute association avec le corps »{/coral} (65a). Or la mort est justement cette déliaison. Aux yeux du grand nombre, d'ailleurs, celui qui ne prend aucun plaisir aux plaisirs du corps mène une vie qui ne vaut pas la peine d'être vécue, et tend {teal}« vers un état passablement proche de la mort »{/teal} (65a) : la foule voit juste, sans comprendre ce qu'elle voit.

    ! La définition de la mort comme séparation ne prouve pas l'immortalité : elle dit ce qu'est l'événement, non ce que devient l'âme ensuite.
    ! Le détachement du philosophe n'est pas un ascétisme : il prend sa part du nécessaire, mais son désir va ailleurs.
    ! « Philosopher, c'est apprendre à mourir » (Cicéron, Montaigne) déforme la thèse : il ne s'agit pas de se préparer à une mort digne, mais de purifier la pensée de ce qui lui vient du corps.
