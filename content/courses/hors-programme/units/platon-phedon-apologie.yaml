- id: platon-phedon-apologie-l2
  title: "Repérage : le prologue et l'apologie (57a-69e)"
  notes: |-
    La première section prépare tout le dialogue. Le **prologue** et l'**introduction du récit** posent, sous des mots ordinaires, les thèmes qui seront ensuite travaillés (le « soi-même », la pureté, les contraires qui se suivent). Puis vient l'**apologie** : Socrate se défend, comme devant un tribunal, d'accepter trop facilement de mourir. Elle n'est pas encore une démonstration : elle montre qu'{green}__il serait absurde qu'un philosophe craigne la mort__{/green}, puisque philosopher, c'est déjà séparer l'âme du corps.

    | Moment | Lieu | Ce qui s'y joue |
    | le prologue | 57a-58d | Phédon, présent lui-même, raconte ; la fête de Délos explique le délai avant l'exécution |
    | l'introduction du récit | 58e-61c | un mélange de plaisir et de douleur ; Socrate délié ; le rêve qui ordonne de composer |
    | l'absurdité remise à sa place | 61c-63e | il ne faut pas se tuer, et pourtant le philosophe accepte de mourir |
    | l'opinion des philosophes | 63e-68b | philosopher, c'est s'exercer à mourir, c'est-à-dire séparer l'âme du corps |
    | vertus illusoires et vertus vraies | 68b-69e | sans la pensée, courage et modération ne sont qu'un calcul de peurs et de plaisirs |
