- id: platon-phedon-apologie-l1
  title: "Repérage : le plan du Phédon (57a-118a)"
  notes: |-
    Le *Phédon* est le **récit** que fait Phédon, à Phlionte, devant Échécrate, de la dernière journée de Socrate, qui boit la ciguë au coucher du soleil. Toute la conversation tourne autour d'une question que Cébès formule après l'apologie : {amber}**l'âme existe-t-elle encore, une fois séparée du corps, et garde-t-elle « une certaine puissance et de la pensée » (70b) ?**{/amber} Le dialogue y répond en {sky}cinq grands temps{/sky} : Socrate justifie d'abord sa sérénité, puis la fonde par trois arguments, les voit ébranlés par deux objections, répond par un dernier argument appuyé sur les Formes, et conclut par un mythe avant de mourir.

    | Section | Lieu | Ce qui s'y joue |
    | le prologue et l'apologie | 57a-69e | le philosophe ne craint pas la mort, car philosopher, c'est déjà séparer l'âme du corps |
    | les trois premiers arguments | 69e-84b | contraires, réminiscence, affinité : l'âme existait avant la naissance et doit subsister après la mort |
    | les objections et la misologie | 84b-95a | l'âme-harmonie de Simmias réfutée ; l'âme qui s'use de Cébès reste à réfuter ; ne pas haïr les raisonnements |
    | l'autobiographie et le dernier argument | 95a-107a | les Formes comme causes ; l'âme apporte la vie et ne peut donc pas recevoir la mort |
    | le mythe et la mort de Socrate | 107a-118a | le sort des âmes dépend de leur purification ; Socrate meurt en philosophe |

    {green}__Le dialogue ne se contente pas de démontrer l'immortalité__{/green} : il montre aussi, en Socrate, ce qu'est une vie qui s'est exercée à mourir, si bien que le récit de sa mort fait partie de l'argument.
