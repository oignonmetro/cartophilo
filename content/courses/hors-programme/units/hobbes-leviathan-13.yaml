- id: "hobbes-leviathan-13-p1b"
  title: "Le plus faible peut tuer le plus fort"
  notes: ""
  passage:
    label: "§1"
    text: "En effet, en ce qui concerne la force du corps, le plus faible a assez de force pour tuer le plus fort, soit par une manœuvre secrète, soit en s'alliant à d'autres qui sont avec lui confrontés au même danger."
    part: "Par nature, les humains sont égaux"
  points: [{id: hobbes-leviathan-13-p1b-p1, sentence: "« En effet, en ce qui concerne la force du corps, ___, soit par une manœuvre secrète, soit en s'alliant à d'autres qui sont avec lui confrontés au même danger. »", answer: "le plus faible a assez de force pour tuer le plus fort", alt: []}]
- id: "hobbes-leviathan-13-p2"
  title: "Une égalité plus grande dans l'esprit"
  notes: ""
  passage:
    label: "§2"
    text: "Je trouve que parmi les humains, l'égalité est plus grande en ce qui concerne les facultés de l'esprit qu'en ce qui concerne la force (je laisse de côté les arts fondés sur les mots, et en particulier cette aptitude à suivre des règles générales et infaillibles, qu'on appelle science ; aptitude dont très peu disposent et pour quelques objets seulement, car il ne s'agit pas d'une faculté innée, qu'on a de naissance, ou qu'on acquiert – comme la prudence – alors qu'on s'occupe d'autre chose)."
    part: "Par nature, les humains sont égaux"
  points: [{id: hobbes-leviathan-13-p2-p1, sentence: "« Je trouve que parmi les humains, l'égalité est plus grande en ce qui concerne les ___ qu'en ce qui concerne la force (je laisse de côté les arts fondés sur les mots, et en particulier cette aptitude à suivre des règles générales et infaillibles, qu'on appelle science ; aptitude dont très peu disposent et pour quelques objets seulement, car il ne s'agit pas d'une faculté innée, qu'on a de naissance, ou qu'on acquiert – comme la prudence – alors qu'on s'occupe d'autre chose). »", answer: "facultés de l'esprit", alt: []}, {id: hobbes-leviathan-13-p2-p2, sentence: "« Je trouve que parmi les humains, l'égalité est plus grande en ce qui concerne les facultés de l'esprit qu'en ce qui concerne la force (je laisse de côté les arts fondés sur les mots, et en particulier cette aptitude à suivre des règles générales et infaillibles, qu'on appelle science ; aptitude dont très peu disposent et pour quelques objets seulement, car il ne s'agit pas d'une ___, qu'on a de naissance, ou qu'on acquiert – comme la prudence – alors qu'on s'occupe d'autre chose). »", answer: "faculté innée", alt: []}]
- id: "hobbes-leviathan-13-p2b"
  title: "La prudence, égale expérience"
  notes: ""
  passage:
    label: "§2"
    part: "Par nature, les humains sont égaux"
    text: |-
      Car la prudence n'est rien que l'égale expérience que tous les hommes ont, en un temps égal, de ces choses dans lesquelles ils s'impliquent également.
  points: []
- id: "hobbes-leviathan-13-p2c"
  title: "La vaine idée de sa propre sagesse"
  notes: ""
  passage:
    label: "§2"
    part: "Par nature, les humains sont égaux"
    text: |-
      Ce qui, peut-être, peut faire qu'on ne puisse croire à une telle égalité, n'est que la vaine idée que chacun se fait de sa propre sagesse, sagesse dont presque tous pensent qu'ils en disposent à un degré supérieur aux gens ordinaires – autrement dit tout le monde à l'exception d'eux-mêmes, et de quelques autres qui sont populaires ou avec qui ils sont d'accord. Car telle est la nature humaine que, quel que soit le nombre de ceux que l'on estime être plus intelligents ou plus éloquents ou plus savants, on aura pourtant du mal à croire qu'il y en a beaucoup de plus sages que soi-même ; en effet, chacun voit sa propre intelligence de près et celle des autres de loin.
  points: []
- id: "hobbes-leviathan-13-p2d"
  title: "Chacun satisfait de sa part"
  notes: ""
  passage:
    label: "§2"
    part: "Par nature, les humains sont égaux"
    text: |-
      Mais cela prouve que, sous ce rapport, les humains sont égaux plutôt qu'inégaux. Car il n'existe pas d'ordinaire de meilleur signe d'égalité dans la distribution de quelque chose que le fait que chacun soit satisfait de sa part.
  points: []
- id: "hobbes-leviathan-13-p3"
  title: "De l'égale espérance à l'inimitié"
  notes: ""
  passage:
    label: "§3"
    part: "L'égalité engendre la défiance"
    text: |-
      Cette égalité des aptitudes engendre l'égalité dans l'espérance que nous avons de parvenir à nos fins. Et donc, si deux humains désirent la même chose, dont ils ne peuvent cependant jouir l'un et l'autre, ils deviennent ennemis et, pour parvenir à leur fin (qui est principalement leur propre conservation et parfois seulement leur jouissance), ils s'efforcent de s'éliminer ou de s'assujettir l'un l'autre.
  points: []
- id: "hobbes-leviathan-13-p3b"
  title: "Dépossédé, puis menacé à son tour"
  notes: ""
  passage:
    label: "§3"
    part: "L'égalité engendre la défiance"
    text: |-
      C'est pour cela que, si un attaquant n'a rien d'autre à craindre que la puissance individuelle d'un autre homme, si l'un plante, sème, bâtit ou possède un lieu qui lui convient, il est probable que d'autres peuvent surgir, ayant uni leurs forces, pour le déposséder et le priver non seulement des fruits de son travail, mais aussi de sa vie et de sa liberté. Et, à son tour, l'attaquant sera confronté au même danger de la part d'un autre.
  points: []
- id: "hobbes-leviathan-13-p4"
  title: "L'anticipation"
  notes: ""
  passage:
    label: "§4"
    part: "La défiance engendre la guerre"
    text: |-
      À cause de cette défiance de l'un envers l'autre, un homme n'a pas d'autre moyen aussi raisonnable que l'anticipation pour se mettre en sécurité, autrement dit se rendre maître, par la force et les ruses, de la personne du plus grand nombre possible de gens, aussi longtemps qu'il ne verra pas d'autre puissance assez grande pour le mettre en danger. Il ne s'agit là de rien de plus que ce que sa propre conservation requiert – ce qui, généralement, est permis.
  points: []
- id: "hobbes-leviathan-13-p4b"
  title: "Conquérir au-delà de sa sécurité"
  notes: ""
  passage:
    label: "§4"
    part: "La défiance engendre la guerre"
    text: |-
      De plus, comme il y en a qui prennent plaisir à contempler leur propre puissance à l'œuvre dans les conquêtes, ils les poursuivent bien au-delà de ce qui est nécessaire à leur sécurité ; si bien que les autres, qui sans cela se seraient contentés de vivre tranquillement dans des limites modestes, augmentent leur puissance par des attaques, sans quoi ils ne seraient pas longtemps capables de survivre en se tenant seulement sur la défensive. Par conséquent, une telle augmentation du pouvoir sur les gens étant nécessaire à la conservation de soi, il faut qu'elle soit permise.
  points: []
- id: "hobbes-leviathan-13-p5"
  title: "Aucun plaisir à vivre ensemble"
  notes: ""
  passage:
    label: "§5"
    part: "La gloire et les trois causes de conflit"
    text: |-
      De même aussi, les humains n'éprouvent aucun plaisir (mais plutôt un grand déplaisir) à demeurer en présence les uns des autres s'il n'y a pas de puissance capable de les tenir tous en respect.
  points: []
- id: "hobbes-leviathan-13-p5b"
  title: "Le prix qu'on s'accorde"
  notes: ""
  passage:
    label: "§5"
    part: "La gloire et les trois causes de conflit"
    text: |-
      Car chacun cherche à s'assurer qu'il est évalué par son voisin au même prix qu'il s'évalue lui-même ; et à tout signe de mépris, chaque fois qu'on le sous-estime, chacun s'efforce naturellement, dans la mesure où il l'ose (ce qui, parmi ceux qu'aucune puissance commune ne tient tranquilles, est suffisant pour qu'ils s'exterminent les uns les autres), d'obtenir par la force que ses contempteurs admettent qu'il a une plus grande valeur, et que les autres l'admettent par l'exemple.
  points: []
- id: "hobbes-leviathan-13-p6"
  title: "Compétition, défiance, gloire"
  notes: ""
  passage:
    label: "§6"
    part: "La gloire et les trois causes de conflit"
    text: |-
      En sorte qu'on trouve dans la nature humaine trois causes principales de conflit : premièrement, la compétition ; deuxièmement, la défiance ; troisièmement, la gloire.
  points: []
- id: "hobbes-leviathan-13-p7"
  title: "Profit, sécurité, réputation"
  notes: ""
  passage:
    label: "§7"
    part: "La gloire et les trois causes de conflit"
    text: |-
      La première pousse les hommes à attaquer pour le profit, la seconde pour la sécurité et la troisième pour la réputation. Dans le premier cas ils utilisent la violence pour se rendre maîtres de la personne d'autres hommes, femmes, enfants, et du bétail ; dans le second, pour les défendre ; dans le troisième, pour des détails, comme un mot, un sourire, une opinion différente et tout autre signe qui les sous-estime, soit directement dans leur personne, soit, par contrecoup, dans leur parenté, leurs amis, leur nation, leur profession ou leur nom.
  points: []
- id: "hobbes-leviathan-13-p8"
  title: "La guerre de chacun contre chacun"
  notes: ""
  passage:
    label: "§8"
    part: "Hors des États civils, il y a toujours la guerre de chacun contre chacun"
    text: |-
      Par cela il est manifeste que pendant ce temps où les humains vivent sans qu'une puissance commune ne leur impose à tous un respect mêlé d'effroi, leur condition est ce qu'on appelle la guerre ; et celle-ci est telle qu'elle est une guerre de chacun contre chacun.
  points: []
- id: "hobbes-leviathan-13-p8b"
  title: "La notion de temps"
  notes: ""
  passage:
    label: "§8"
    part: "Hors des États civils, il y a toujours la guerre de chacun contre chacun"
    text: |-
      En effet, la GUERRE ne consiste pas seulement dans la bataille ou dans l'acte de combattre, mais dans cet espace de temps pendant lequel la volonté d'en découdre par un combat est suffisamment connue ; et donc, la notion de *temps* doit être prise en compte dans la nature de la guerre, comme c'est le cas dans la nature du temps qu'il fait.
  points: []
- id: "hobbes-leviathan-13-p8c"
  title: "Comme le mauvais temps"
  notes: ""
  passage:
    label: "§8"
    part: "Hors des États civils, il y a toujours la guerre de chacun contre chacun"
    text: |-
      Car, de même que la nature du mauvais temps ne consiste pas en une ou deux averses, mais en une tendance au mauvais temps, qui s'étale sur plusieurs jours, de même, en ce qui concerne la nature de la guerre, celle-ci ne consiste pas en une bataille effective, mais en la disposition reconnue au combat, pendant tout le temps qu'il n'y a pas d'assurance du contraire. Tout autre temps est la PAIX.
  points: []
- id: "hobbes-leviathan-13-p9"
  title: "Sans autre sécurité que sa force"
  notes: ""
  passage:
    label: "§9"
    part: "Inconvénients d'une telle guerre"
    text: |-
      Donc, toutes les conséquences du temps de guerre, où chacun est l'ennemi de chacun, sont les mêmes que celles du temps où les humains vivent sans autre sécurité que celle procurée par leur propre force, ou leur propre ingéniosité.
  points: []
- id: "hobbes-leviathan-13-p9b"
  title: "Une vie solitaire, misérable et brève"
  notes: ""
  passage:
    label: "§9"
    part: "Inconvénients d'une telle guerre"
    text: |-
      Dans une telle situation, il n'y a de place pour aucune entreprise parce que le bénéfice est incertain, et, par conséquent, il n'y a pas d'agriculture, pas de navigation, on n'utilise pas les marchandises importées par mer, il n'y a ni vastes bâtiments, ni engins servant à déplacer et déménager ce qui nécessite beaucoup de force ; il n'y a aucune connaissance de la surface terrestre, aucune mesure du temps, ni arts ni lettres, pas de société ; et, ce qui est pire que tout, il règne une peur permanente, un danger de mort violente. La vie humaine est solitaire, misérable, dangereuse, animale et brève.
  points: []
- id: "hobbes-leviathan-13-p10"
  title: "Qu'on s'observe soi-même"
  notes: ""
  passage:
    label: "§10"
    part: "La preuve par l'expérience"
    text: |-
      Il peut paraître étrange à celui qui n'a pas bien pesé ces choses, que la nature dissocie ainsi les humains en les rendant capables de s'attaquer et de s'entre-tuer les uns les autres ; celui-là peut ne pas accepter une telle déduction faite à partir des passions et il désire peut-être que la même chose lui soit confirmée par l'expérience. Qu'il s'observe donc lui-même quand, pour partir en voyage, il s'arme et cherche à être bien accompagné ; quand, allant se coucher, il boucle ses portes ; quand, jusque dans sa propre maison, il verrouille ses coffres, et cela tout en sachant qu'il y a des lois et des agents publics armés pour punir tous les torts qu'on pourrait lui faire.
  points: []
- id: "hobbes-leviathan-13-p10b"
  title: "Accuser le genre humain par ses actes"
  notes: ""
  passage:
    label: "§10"
    part: "La preuve par l'expérience"
    text: |-
      Quelle opinion se fait-il de ses semblables quand il voyage tout armé, de ses concitoyens quand il boucle ses portes, et de ses enfants, de ses domestiques quand il verrouille ses coffres ? N'accuse-t-il pas autant le genre humain par ses actes que je le fais par mes mots ? Pourtant, ni lui ni moi n'accusons ainsi la nature humaine.
  points: []
- id: "hobbes-leviathan-13-p10c"
  title: "Pas de péché sans loi"
  notes: ""
  passage:
    label: "§10"
    part: "La preuve par l'expérience"
    text: |-
      Les désirs et les autres passions humaines ne sont pas en eux-mêmes des péchés. Pas plus que ne le sont les actions engendrées par les passions, pour autant qu'il n'y a pas de loi faisant savoir qu'il est interdit de les accomplir. Tant que les lois n'ont pas été faites, on ne peut les connaître, et aucune loi ne peut être faite tant qu'on ne s'est pas mis d'accord sur la personne qui la fera.
  points: []
- id: "hobbes-leviathan-13-p11"
  title: "Un tel temps a-t-il existé ?"
  notes: ""
  passage:
    label: "§11"
    part: "La preuve par l'expérience"
    text: |-
      Incidemment, on peut penser qu'il n'y eut jamais un temps comme celui-ci, non plus qu'un semblable état de guerre. Et je crois que, de façon générale, il n'en a jamais été ainsi à travers le monde, mais qu'il y a beaucoup d'endroits où l'on vit ainsi.
  points: []
- id: "hobbes-leviathan-13-p11b"
  title: "L'Amérique et la guerre civile"
  notes: ""
  passage:
    label: "§11"
    part: "La preuve par l'expérience"
    text: |-
      En effet, chez les sauvages de nombreux endroits de l'*Amérique,* à l'exception du gouvernement des petites familles dont la concorde dépend de la lubricité naturelle, il n'y a pas de gouvernement du tout, et ils vivent en ce moment même à la manière des animaux, comme je l'ai dit plus haut. Quoi qu'il en soit, on peut se faire une idée de ce qu'est le genre de vie là où n'existe aucune puissance commune à craindre, par le genre de vie dans lequel sombrent, lors d'une guerre civile, ceux qui vivaient précédemment sous un gouvernement pacifique.
  points: []
- id: "hobbes-leviathan-13-p11c"
  title: "Les rois dans l'attitude des gladiateurs"
  notes: ""
  passage:
    label: "§11"
    part: "La preuve par l'expérience"
    text: |-
      Mais s'il n'y eut jamais d'époque où les individus particuliers se trouvaient les uns les autres en état de guerre, il n'en reste pas moins qu'en tout temps les rois et les personnes détentrices de l'autorité souveraine, en raison de leur indépendance, s'envient en permanence et se mettent dans l'état et l'attitude des gladiateurs, pointant leurs armes l'un vers l'autre et s'épiant l'un l'autre, avec leurs forteresses, leurs armées, leurs canons massés aux frontières de leurs royaumes. Mais, puisque par ces moyens ils protègent les entreprises de leurs sujets, cette situation n'engendre pas la misère qui accompagne la liberté des individus particuliers.
  points: []
- id: "hobbes-leviathan-13-p12"
  title: "Sans loi, rien d'injuste"
  notes: ""
  passage:
    label: "§12"
    part: "Dans une telle guerre, rien n'est injuste"
    text: |-
      Ceci aussi est une conséquence de cette guerre de chacun contre chacun : que rien ne peut être injuste. Les notions du bon et du mauvais, du juste et de l'injuste n'ont pas leur place ici. Là où n'existe aucune puissance commune, il n'y a pas de loi ; là où il n'y a pas de loi, rien n'est injuste.
  points: []
- id: "hobbes-leviathan-13-p12b"
  title: "La force et la tromperie"
  notes: ""
  passage:
    label: "§12"
    part: "Dans une telle guerre, rien n'est injuste"
    text: |-
      En temps de guerre, la force et la tromperie sont les deux vertus cardinales. Justice et injustice ne sont aucunement des facultés du corps ou de l'esprit.
  points: []
- id: "hobbes-leviathan-13-p12c"
  title: "Des qualités de l'humain en société"
  notes: ""
  passage:
    label: "§12"
    part: "Dans une telle guerre, rien n'est injuste"
    text: |-
      Si elles l'étaient, ce serait celles d'un humain seul au monde, comme le sont ses sensations et ses passions. Ce sont des qualités relatives à l'humain en société, non à l'humain solitaire.
  points: []
- id: "hobbes-leviathan-13-p12d"
  title: "Ni tien ni mien"
  notes: ""
  passage:
    label: "§12"
    part: "Dans une telle guerre, rien n'est injuste"
    text: |-
      C'est aussi une conséquence de ce même état qu'il n'y a ni propriété, ni pouvoir, ni distinction du *tien* et du *mien*, et que ce qui peut appartenir à chacun, c'est ce qu'il peut obtenir et conserver aussi longtemps qu'il le pourra. Tel est donc le misérable état du genre humain dans lequel il se trouve par nature ; il lui est pourtant possible d'en sortir, pour une part par les passions et, pour une autre part, par sa raison.
  points: []
- id: "hobbes-leviathan-13-p13"
  title: "La peur de la mort et la raison"
  notes: ""
  passage:
    label: "§13"
    part: "Les passions qui poussent les humains à la paix"
    text: |-
      Les passions qui poussent les humains à la paix sont la peur de la mort, le désir des choses nécessaires à une existence confortable, et l'espoir de les obtenir par leur activité. La raison suggère les articles de paix adéquats, sur lesquels ils se mettront d'accord.
  points: []
- id: "hobbes-leviathan-13-p13b"
  title: "Les lois de nature"
  notes: ""
  passage:
    label: "§13"
    part: "Les passions qui poussent les humains à la paix"
    text: |-
      Ces articles sont ceux qu'on appelle encore lois de nature. J'en parlerai plus spécifiquement dans les deux chapitres suivants.
  points: []
