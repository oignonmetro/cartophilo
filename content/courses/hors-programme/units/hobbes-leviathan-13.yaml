- id: "hobbes-leviathan-13-p1"
  title: "L'égalité des facultés du corps et de l'esprit"
  notes: ""
  passage:
    label: "§1"
    text: "La nature a fait les humains si égaux quant aux facultés du corps et de l'esprit que, bien qu'il soit parfois possible d'en trouver un dont il est manifeste qu'il a plus de force dans le corps ou de rapidité d'esprit qu'un autre, il n'en reste pas moins que, tout bien pesé, la différence entre les deux n'est pas à ce point considérable que l'un d'eux puisse s'en prévaloir et obtenir un profit quelconque pour lui-même auquel l'autre ne pourrait prétendre aussi bien que lui."
