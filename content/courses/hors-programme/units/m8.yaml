- id: m8-p2
  title: "Le bonheur de l'intelligence est indépendant"
  passage:
    label: "1178a22-28"
    text: "Le bonheur de l'intelligence en revanche est indépendant. On n'en dira en effet pas plus à son sujet, car un exposé rigoureux outrepasse notre propos, mais on peut penser que même le besoin des services extérieurs est modeste dans le cas de la vertu intellectuelle, ou certainement moindre que dans le cas de la vertu morale. En effet, les biens nécessaires sont requis dans les deux cas et même à titre égal, admettons-le, quoique l'homme politique se tracasse en permanence de son corps et de toutes les choses du même ordre ; mais laissons, car cela ne peut faire qu'une petite différence."
