- id: m8-p1
  title: "Le bonheur de la vertu morale est humain"
  notes: |-
    **Aristote vient d'établir, au chapitre 7, que la vie la plus heureuse est celle de l'intellect ; il en vient ici au bonheur de « la vertu qui reste », la vertu morale.** Il ne lui reconnaît la première place qu'« à titre secondaire » : non que cette vie soit moins heureuse, mais son bonheur, parfait en son genre, est moins *le* bonheur que celui de la vie intellectuelle (Bodéüs).

    La raison : les activités de la vertu morale sont **humaines**. Aristote le montre en trois constats, qui font d'elles des vertus du **composé**, l'âme unie au corps :

    - Relations : les actes justes ou courageux se font « en relation les uns avec les autres », dans les contrats, les services, la vie affective ; les vertus morales sont des vertus sociales.
    - Corps et affections : la vertu du caractère semble parfois « venir du corps » (la tempérance naturelle) et elle est intimement liée aux affections.
    - Sagacité : la sagacité (`phronēsis`) est en conjonction avec la vertu du caractère ; ses principes traduisent les vertus morales, et leur rectitude traduit la sagacité (VI, 13).

    Or les vertus du composé sont humaines ; donc aussi la vie qui les exprime, et le bonheur qui leur correspond.

    ! « Humaines » s'entend en deux sens difficilement dissociables : par opposition au **divin**, ce qui fait de ce bonheur un bonheur secondaire ; par opposition à ce qui n'est pas humain dans l'homme, ce qui en fait un bonheur **parfait** en son genre.
  passage:
    label: "1178a9-22"
    text: "Cependant, à titre secondaire, la vie la plus heureuse est celle qui traduit la vertu qui reste. C'est que les activités correspondant à cette vertu sont humaines. En effet, quand nous exécutons des actes justes ou courageux ou tous les autres actes vertueux, c'est en relation les uns avec les autres et que ce soit lors de contrats, de services et d'actions de toutes sortes ou que ce soit dans la vie affective, nous veillons constamment à ce qui convient à chacun. Or ces actes paraissent être, sans exception, des actes humains. Dans certains cas, d'ailleurs, la vertu du caractère semble venir du corps, et dans beaucoup de cas, elle semble intimement liée aux affections. Du reste, la sagacité elle aussi est en conjonction avec la vertu du caractère, comme celle-ci est en conjonction avec la sagacité, puisque aussi bien les principes de la sagacité traduisent les vertus morales, tandis que la rectitude de celles-ci traduit la sagacité. Et comme elles sont également rattachées aux affections, ces vertus doivent mettre en jeu le composé. Or les vertus du composé sont humaines. Donc, c'est aussi le cas de l'existence qui les exprime, ainsi que du bonheur qui leur correspond."
