# Unité de texte (voir content/textes.md) : Aristote, Éthique à Nicomaque,
# X, 8, 1178a22-b8, traduction J. Tricot, d'après le commentaire d'Ulysse
# Chaintreuil, « La matière des deux vertus aristotéliciennes ». Leçons
# repérées par leurs lignes Bekker, selon le découpage du commentaire.

id: m8
title: "Le bonheur du sage et les biens extérieurs"
subtitle: "Éthique à Nicomaque, X, 8, 1178a22-b8"
icon: page
color: yellow
group: "La morale d'Aristote"
intro: |-
  Texte de l'*Éthique à Nicomaque*, livre X, chapitre 8 (1178a22-b8), dans la
  traduction de J. Tricot. L'essentiel de l'*Éthique* fait du **prudent**
  (`phronimos`) l'homme accompli ; les chapitres 7 à 9 du livre X, qui
  clôturent l'ouvrage, semblent trancher avec ce tableau en identifiant le
  meilleur bonheur à l'activité du **sage** (`sophos`), la contemplation
  (`theôria`). Parmi les huit arguments du chapitre 7 en faveur de la vie
  théorétique, le quatrième tient à sa plus grande **autarcie** : notre texte
  le développe en examinant le rapport des deux vertus, théorique et pratique,
  aux **biens extérieurs**.
lessons:
- id: m8-p1
  title: "Le bonheur de l'intellect est séparé"
  passage:
    label: "1178a22-28"
    text: "Le bonheur de l'intellect est, au contraire, séparé : qu'il nous suffise de cette brève indication à son sujet, car une discussion détaillée dépasse le but que nous nous proposons. Le bonheur de l'intellect semblerait aussi avoir besoin du cortège des biens extérieurs, mais seulement à un faible degré ou à un degré moindre que la vertu éthique. On peut admettre, en effet, que les deux sortes de vertu aient l'une et l'autre besoin et cela à titre égal, des biens nécessaires à la vie (quoique, en fait, l'homme en société se donne plus de tracas pour les nécessités corporelles et autres de même nature) : car il ne saurait y avoir à cet égard qu'une légère différence entre elles."
