# Unité de texte (voir content/textes.md) : Aristote, Éthique à Nicomaque,
# X, 8, 1178a9-b8, traduction R. Bodéüs. Cartes-explication tirées du
# commentaire d'Ulysse Chaintreuil, « La matière des deux vertus
# aristotéliciennes », qui porte sur 1178a22-b8 et cite la traduction de
# J. Tricot. Leçons repérées par leurs lignes Bekker.

id: m8
title: "Le bonheur du sage et les biens extérieurs"
subtitle: "Éthique à Nicomaque, X, 8, 1178a9-b8"
icon: page
color: yellow
group: "La morale d'Aristote"
intro: |-
  Texte de l'*Éthique à Nicomaque*, livre X, chapitre 8 (1178a9-b8), dans la
  traduction de R. Bodéüs. L'essentiel de l'*Éthique* fait du **prudent**
  (`phronimos`) l'homme accompli ; les chapitres 7 à 9 du livre X, qui
  clôturent l'ouvrage, semblent trancher avec ce tableau en identifiant le
  meilleur bonheur à l'activité du **sage** (`sophos`), la contemplation
  (`theôria`). Parmi les huit arguments du chapitre 7 en faveur de la vie
  théorétique, le quatrième tient à sa plus grande **autarcie** : notre texte
  le développe en examinant le rapport des deux vertus, théorique et pratique,
  aux **biens extérieurs**, après avoir dit pourquoi le bonheur de la vertu
  morale n'est qu'humain.
lessons:
- id: m8-i1
  title: "Prudence et sagesse : deux excellences de l'intelligence"
  notes: |-
    L'*Éthique à Nicomaque* **dépeint d'abord la vie heureuse comme une vie essentiellement sociale** : l'homme accompli est celui qui entretient des rapports excellents, c'est-à-dire vertueux, avec ses amis, ses proches, ses concitoyens. Mais la fin de l'ouvrage présente un tableau du bonheur qui tranche avec ce portrait. Pour le comprendre, il faut revenir à la distinction du livre VI entre deux excellences de l'intelligence.

    |  | Vertu pratique | Vertu théorique |
    | **Excellence** | la prudence (`phronēsis`) | la sagesse (`sophia`) |
    | **Figure** | le prudent (`phronimos`) : Périclès | le sage (`sophos`) : Thalès |
    | **Objet** | des situations particulières, en partie contingentes | des vérités éternelles et nécessaires |
    | **Acte** | l'action (`praxis`) | la contemplation (`theôria`) |

    **Le mot `theôria` désigne d'abord un pèlerinage** : se rendre dans une cité étrangère pour assister à un spectacle d'importance (les jeux d'Olympie, l'oracle de Delphes). À partir de Platon, il devient le paradigme de l'activité philosophique : le philosophe accomplit un pèlerinage hors de la caverne pour y contempler les idées.

    **Chez Socrate et Platon, il n'y a pas deux formes d'intelligence.** `Phronēsis` y est synonyme de `sophia` : la vertu est une, elle réside dans la connaissance du Bien, qui est l'unique cause de l'action bonne (dans le *Ménon*, on ne peut vouloir le mal, l'action mauvaise ne vient que de l'ignorance). D'où, dans la *République*, la condition de la cité idéale : que les philosophes soient rois ou que les rois soient philosophes.

    **Aristote refuse cette réduction et affirme l'autonomie de la sphère pratique.** Le prudent a une excellence propre, calculative (`logistikos`), qui tient à la bonne appréhension d'une situation particulière, indépendante de celle du sage : selon la formule de Chaintreuil, il n'est pas besoin d'être Thalès pour être Périclès. L'éthique d'Aristote en devient plus optimiste que celle de Platon : le Bien pratique est accessible, parce que radicalement humain.

    ! Le domaine de l'action n'est pas *absolument* contingent : il y a des régularités dans l'action humaine, comme il y a dans la nature ce qui arrive « le plus souvent » (`hōs epi to polu`). Chaintreuil nuance ici Aubenque, qui insiste sur le lien entre la prudence et la contingence.
