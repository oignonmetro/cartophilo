- id: m8-p3
  title: "Quatre exemples : la vertu morale a besoin de biens extérieurs"
  notes: |-
    **Ce qui semblait une différence de degré devient une différence de nature.** Aristote ne parle plus des conditions préalables de l'activité (survivre), mais de ce **sur quoi** elle s'exerce : le prudent agit *sur* des biens extérieurs, qui sont la matière même de sa vertu ; le sage, non.

    |  | A besoin de | Pour |
    | **Libéralité** | l'argent | exercer ses libéralités |
    | **Justice** | l'argent | acquitter ce qu'on doit |
    | **Courage** | la puissance (`dunamis`) | moyens militaires, armement |
    | **Tempérance** | la liberté d'agir (`exousia`) | pouvoir prendre les plaisirs qui conviennent |

    La parenthèse sur la justice a une portée générale : les souhaits ne se voient pas, et même les injustes prétendent vouloir agir justement. La vertu ne se réduit donc pas au souhait (`boulēsis`) ; c'est ce qu'expliquera le dernier moment du texte, en distinguant la décision et l'acte.

    ! La tempérance n'a pas besoin de l'intempérance : Tricot glose « une possibilité de se livrer à l'intempérance », mais le grec dit seulement `exousia`, la liberté d'agir. Se montrer modéré, c'est aussi prendre plaisir à ce qui convient, et il faut en avoir les moyens (Chaintreuil).
  passage:
    label: "1178a28-33"
    text: "En revanche, si l'on considère leurs activités respectives, la différence sera considérable. L'homme libéral en effet aura besoin d'argent pour exercer la libéralité ainsi que l'homme juste par conséquent, pour acquitter ce qu'il doit. Les souhaits de justice en effet ne sont pas évidents et même les gens qui ne sont pas justes font mine de souhaiter agir justement. De son côté, l'homme courageux aura besoin de puissance si tant est qu'il veuille mener jusqu'au bout une entreprise qui traduise sa vertu, et l'homme tempérant, de la liberté qu'on lui laisse d'agir à son gré."
