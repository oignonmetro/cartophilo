- id: m8-p3
  title: "Justification : choix délibéré et acte, contemplation et vie d'homme"
  passage:
    label: "1178a34-b7"
    text: "On discute aussi le point de savoir quel est l'élément le plus important de la vertu, si c'est le choix délibéré ou la réalisation de l'acte, attendu que la vertu consiste dans ces deux éléments. La perfection de la vertu résidera évidemment dans la réunion de l'un et de l'autre, mais l'exécution de l'acte requiert le secours de multiples facteurs, et plus les actions sont grandes et nobles, plus ces conditions sont nombreuses. Au contraire, l'homme livré à la contemplation n'a besoin d'aucun concours de cette sorte en vue du moins d'exercer son activité : ce sont même là plutôt, pour ainsi dire, des obstacles tout au moins à la contemplation ; mais en tant qu'il est homme et qu'il vit en société il s'engage délibérément dans des actions conformes à la vertu : il aura donc besoin des moyens extérieurs en question pour mener sa vie d'homme."
