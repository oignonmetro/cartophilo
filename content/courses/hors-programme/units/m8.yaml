    text: "Par contre, en ce qui concerne leurs activités propres, la différence sera considérable. L'homme libéral en effet aura besoin d'argent pour répandre ses libéralités, et par suite l'homme juste pour rétribuer les services qu'on lui rend (car les volontés demeurent cachées et même les gens injustes prétendent avoir la volonté d'agir avec justice) ; de son côté, l'homme courageux aura besoin de force, s'il accomplit quelqu'une des actions conformes à sa vertu, et l'homme tempérant a besoin d'une possibilité de se livrer à l'intempérance. Autrement, comment ce dernier, ou l'un des autres dont nous parlons, pourra-t-il manifester sa vertu ?"
