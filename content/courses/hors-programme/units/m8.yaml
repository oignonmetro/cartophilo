- id: m8-i2
  title: "Le problème du bonheur du sage ; l'activité de la vertu et sa matière"
  notes: |-
    **Les chapitres 6 à 9 du livre X décrivent le sage et son activité, la contemplation, et le placent au-dessus du prudent** : le prudent représente une excellence proprement humaine, le sage l'excellence de la part divine de l'homme. Huit arguments en ce sens sont donnés au chapitre 7. On croit voir un retour à la position platonicienne qui subordonne la pratique à la théorie, et le reste de l'ouvrage paraît démenti.

    Cette tension nourrit un vaste débat, dont les termes ont été fixés par Hardie (1965), mais que Natali retrouve dès les commentateurs anciens :

    |  | Ce qu'elle soutient | Son appui |
    | **Lecture « dominante »** | la vie n'est pleinement heureuse que dans la contemplation | le ton assertif de X, 7-9 |
    | **Lecture « inclusive »** | la vie heureuse inclut une pluralité de biens | la cohérence de l'ensemble de l'*Éthique* |
    | **Lecture « aporétique »** | une faille irrésolue, une fracture de la nature humaine | Aubenque |

    L'approche « génétique », qui voyait dans le livre X un texte de jeunesse platonicienne, est difficilement tenable : le livre X est anticipé par les livres I et VI, et l'hypothèse repose sur une pétition de principe. Chaintreuil réduit plutôt l'incohérence : les « deux visages du bonheur » (Charlotte Murgier) ont en commun d'être des **activités** (`energeiai`).

    **C'est le second pivot : pour Aristote, le bien pratique est un `prakton`, une action réalisée, et non une disposition.** La vertu n'est pas seulement la capacité de bien agir, elle est l'action bonne réalisée : elle est de l'ordre de l'`energeia`. Elle dépend donc de conditions extérieures, les **biens extérieurs**, qui sont en quelque sorte sa **matière** : il faut de l'argent pour être libéral (comme pour être avare ou prodigue), des guerres pour se montrer courageux, des amis, des concitoyens. D'où le refus des paradoxes stoïciens : dire heureux « l'homme attaché à la roue » est un non-sens (VII, 14).

    ! Les biens extérieurs ne font pas la valeur de l'action : ils en sont la condition de possibilité, pour l'action vicieuse comme pour l'action vertueuse. Et la disposition (`hexis`) ne suffit pas : le vertueux qui dort n'est pas vertueux en acte ; aux Jeux olympiques, ce ne sont pas les plus beaux et les plus forts qui sont couronnés, mais ceux qui combattent (I, 9).
