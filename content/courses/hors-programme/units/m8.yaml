- id: m8-p4
  title: "Décision et actions ; celui qui médite vit en homme"
  notes: |-
    **La raison de fond : la vertu consiste à la fois dans la décision (`proairesis`) et dans l'action (`praxis`), et sa perfection réunit les deux.** C'est la décision qui fait la vertu (VIII, 15) : sans elle, l'action n'est vertueuse que par accident. Mais sans l'action, la décision se réduit à l'intention. Or l'action requiert des appuis extérieurs, d'autant plus nombreux qu'elle est plus grande et plus belle.

    **Celui qui médite, au contraire, n'a besoin d'aucun appui pour son activité même** ; les choses extérieures y sont même des obstacles, qui ôtent le loisir de contempler. Qu'on pense au mathématicien : connaître des principes et des théorèmes ne demande la possession d'aucun bien extérieur.

    **Nuance finale : en tant qu'homme vivant parmi d'autres, il choisit aussi d'agir**, et il aura besoin d'appuis « pour vivre en homme » ; s'il ne vivait que de contemplation, il serait un dieu. Selon Bodéüs, la vie méditative inclut donc nécessairement les vertus morales, mais la réciproque n'est pas vraie.

    ! La conclusion n'est pas l'indépendance absolue du sage : le caractère séparé de la contemplation fonde une supériorité **de degré** dans l'autarcie.
  passage:
    label: "1178a33-b7"
    text: "Comment en effet, lui ou un autre pourrait-il, sinon, manifester sa vertu, alors qu'on balance sur la question de savoir ce qui, de la décision ou des actions, détermine le mieux la vertu ? On se le demande dans l'idée qu'elle réside dans les deux à la fois ; par conséquent, la perfection complète implique évidemment les deux, mais en fonction des actions, elle demande beaucoup d'appuis extérieurs et d'autant plus que ces actions sont meilleures et plus belles. Celui qui médite, en revanche, ne requiert aucun appui de ce genre, du moins pour son activité. Au contraire, les choses extérieures sont pour ainsi dire des obstacles, du moins à sa méditation. Mais en tant qu'homme et en tant qu'il partage la vie d'un assez grand nombre, il choisit d'exécuter les actes qui traduisent la vertu. Il aura donc besoin de ces sortes d'appuis pour vivre en homme."
