- id: m8-p2
  title: "Le bonheur de l'intelligence est indépendant"
  notes: |-
    **Voici la thèse du texte : le bonheur de l'intelligence est « indépendant » (Tricot : « séparé »), c'est-à-dire plus autarcique que celui de la vertu morale.** Aristote développe ici le quatrième argument du chapitre 7 (l'autarcie, 1177a27-b1) en examinant le rapport des deux vertus aux **biens extérieurs** ; certains lisent d'ailleurs ce passage comme un doublet.

    **Cela ne va pourtant pas de soi.** Les stoïciens pensent la vertu pratique comme parfaitement autarcique : l'archer de Caton (Cicéron, *De finibus*) vise la cible, mais sa fin est de bien viser, et un coup de vent n'y change rien. Et la contemplation elle-même exige des conditions matérielles. Il faut donc ou bien renoncer à fonder la supériorité du sage sur son autarcie, ou bien montrer que la vertu pratique implique **par essence** une plus grande dépendance. Le texte prend la seconde voie.

    |  | Moment du texte |
    | **1178a22-28** | la thèse, et un premier rapport aux biens extérieurs |
    | **1178a28-33** | quatre exemples de vertus morales qui en dépendent |
    | **1178a33-b7** | la justification : décision et action |

    Aristote commence par une **égalité** : les deux vertus ont besoin, et à titre égal, des biens nécessaires à la vie. La différence n'est d'abord qu'une différence de degré, avancée avec prudence (« on peut penser », le verbe `dokein` à l'optatif) : le besoin des services extérieurs est « modeste » pour la vertu intellectuelle, « certainement moindre » que pour la vertu morale. La parenthèse sur l'homme politique, qui « se tracasse » davantage de son corps, s'éclaire par l'argument du loisir (`scholē`) au chapitre 7.

    ! « Indépendant » ne veut pas dire absolument indépendant : le sage, comme le prudent, a besoin de vivre, de se nourrir, de se loger.
  passage:
    label: "1178a22-28"
    text: "Le bonheur de l'intelligence en revanche est indépendant. On n'en dira en effet pas plus à son sujet, car un exposé rigoureux outrepasse notre propos, mais on peut penser que même le besoin des services extérieurs est modeste dans le cas de la vertu intellectuelle, ou certainement moindre que dans le cas de la vertu morale. En effet, les biens nécessaires sont requis dans les deux cas et même à titre égal, admettons-le, quoique l'homme politique se tracasse en permanence de son corps et de toutes les choses du même ordre ; mais laissons, car cela ne peut faire qu'une petite différence."
