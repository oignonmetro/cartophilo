id: "platon-timee-receptacle"
title: "Le réceptacle, troisième genre"
subtitle: "Timée, 48e-51b"
icon: "page"
color: "green"
group: "Platon : la théorie des Formes"
depth: "normale"
lessons:
- id: "platon-timee-receptacle-p1"
  title: "Deux genres ne suffisent plus"
  notes: ""
  passage:
    label: "48e-49a"
    part: "Un troisième genre à découvrir"
    text: |-
      Or, dans ce nouvel exposé, il faut, concernant l'univers, considérer que le point de départ doit être plus différencié que dans l'exposé précédent. En effet, nous avions alors distingué deux genres d'être ; or, il nous faut maintenant en découvrir un autre, un troisième.
  points: []
- id: "platon-timee-receptacle-p1b"
  title: "Le modèle et la copie"
  notes: ""
  passage:
    label: "48e-49a"
    part: "Un troisième genre à découvrir"
    text: |-
      Ces deux genres suffisaient pour notre exposé antérieur : l'un, nous avons supposé que c'était l'espèce du modèle, espèce intelligible et demeurant toujours identique, et le second, nous avons supposé que c'était la copie du modèle, sujette à la génération et visible. Nous n'avions pas alors distingué un troisième genre, parce que nous avions estimé que ces deux-là suffisaient.
  points: []
- id: "platon-timee-receptacle-p1c"
  title: "Le réceptacle et la nourrice"
  notes: ""
  passage:
    label: "48e-49a"
    part: "Un troisième genre à découvrir"
    text: |-
      Mais, maintenant, notre argumentation nous force, semble-t-il, à entreprendre une description qui permette d'élucider une espèce difficile et obscure. Quelle propriété faut-il supposer qu'elle présente naturellement ? La propriété que voici essentiellement : de tout ce qui est soumis à la génération elle est le réceptacle, et, pour employer une image, la nourrice.
  points: []
- id: "platon-timee-receptacle-p2"
  title: "Passer par le feu et les autres éléments"
  notes: ""
  passage:
    label: "49a-b"
    part: "La difficulté préalable des quatre éléments"
    text: |-
      Certes, ce qui vient d'être dit est vrai, mais il faut sur ce troisième genre dire quelque chose de plus précis. Or, cela est difficile, notamment parce que, pour y arriver, il faut, au préalable, affronter des difficultés relatives au feu et aux trois autres éléments.
  points: []
- id: "platon-timee-receptacle-p2b"
  title: "Quel élément mérite son nom ?"
  notes: ""
  passage:
    label: "49a-b"
    part: "La difficulté préalable des quatre éléments"
    text: |-
      En effet, dire, de chacun de ces éléments, quelle propriété il doit présenter pour qu'on déclare que c'est réellement de l'eau plutôt que du feu, quelle qualité il doit présenter pour qu'on le désigne comme n'importe lequel d'entre eux plutôt que les autres pris ensemble et un à un, et cela en tenant un discours qui soit accessible et stable, voilà qui n'est pas facile. Dès lors, comment pourrions-nous dire pareille chose, de quelle manière et avec quel embarras bien justifié ?
  points: []
- id: "platon-timee-receptacle-p3"
  title: "De l'eau à la pierre, à l'air et au feu"
  notes: ""
  passage:
    label: "49b-c"
    part: "Le cycle des éléments"
    text: |-
      Et d'abord, prenons ce que nous venons d'appeler « eau ». Quand cet élément nous semble se condenser, nous le voyons devenir pierres et terre, mais quand inversement il s'évapore et se disperse, ce même élément devient souffle et air ; l'air enflammé devient feu, et en sens inverse, lorsqu'il se concentre et s'éteint, le feu retrouve la forme de l'air ;
  points: []
- id: "platon-timee-receptacle-p3b"
  title: "Le retour à l'eau : un cercle"
  notes: ""
  passage:
    label: "49b-c"
    part: "Le cycle des éléments"
    text: |-
      et pour sa part l'air, quand il se trouve condensé et comprimé, devient nuage et brouillard, et, lorsque ces derniers sont encore plus comprimés, ils donnent de l'eau qui tombe ; puis, de l'eau, il naît de nouveau de la terre et des pierres. C'est ainsi que, observons-nous, ils se donnent naissance les uns aux autres, en cercle.
  points: []
- id: "platon-timee-receptacle-p4"
  title: "Aucun élément n'est « ceci »"
  notes: ""
  passage:
    label: "49d-50a"
    part: "Ne pas dire « ceci », mais « ce qui est tel »"
    text: |-
      Ainsi, puis donc que ceux-ci n'apparaissent jamais chaque fois sous la même forme, duquel d'entre eux pourrait-on de façon définitive soutenir fermement que c'est « ceci », quoi que ce soit, et pas autre chose, sans se couvrir de honte ? On ne peut que leur donner des dénominations beaucoup plus sûres et parler de la façon suivante.
  points: []
- id: "platon-timee-receptacle-p4b"
  title: "La bonne manière de parler"
  notes: ""
  passage:
    label: "49d-50a"
    part: "Ne pas dire « ceci », mais « ce qui est tel »"
    text: |-
      De ce que nous voyons prendre tantôt telle forme tantôt telle autre, du feu par exemple, ne pas dire « ceci est du feu », mais toujours « ce qui chaque fois est tel ou tel, c'est du feu », ni « ceci est de l'eau », mais « ce qui est toujours tel, c'est de l'eau », ni même « ceci », comme si c'était quelque chose de permanent, « est autre chose », pour rien de tout ce que nous pensons présenter comme quelque chose de permanent quand, par moyen de désignation, nous employons le terme « ceci », « cela » ou « cet être ».
  points: []
- id: "platon-timee-receptacle-p4c"
  title: "Le fugitif et « ce qui est tel »"
  notes: ""
  passage:
    label: "49d-50a"
    part: "Ne pas dire « ceci », mais « ce qui est tel »"
    text: |-
      Voilà quelque chose de fugitif et qui n'admet pas l'expression « ceci », « cela », « cet être » ou toute expression les désignant comme des réalités permanentes. Eh bien, il vaut mieux ne pas en parler comme de réalités distinctes, et qualifier ainsi le « ce qui est tel » qui se retrouve toujours semblable dans absolument tous les cas et dans chacun d'eux en particulier ; d'appeler « feu » notamment ce qui reste tel à travers tout, et ainsi de suite avec tout ce qui devient.
  points: []
- id: "platon-timee-receptacle-p4d"
  title: "Ce qui seul se désigne par « ceci »"
  notes: ""
  passage:
    label: "49d-50a"
    part: "Ne pas dire « ceci », mais « ce qui est tel »"
    text: |-
      Mais ce en quoi chacune de ces caractéristiques apparaît toujours, parce que c'est en cela qu'elle apparaît et que c'est de cela qu'elle disparaît, c'est au contraire cela seul qu'on peut désigner par un recours aux termes « ceci » et « cela » ; mais ce qui est de quelque sorte que ce soit, chaud ou blanc ou n'importe lequel de leurs contraires, et tout ce qui vient d'eux, aucune de ces appellations ne doit en revanche lui être assignée.
  points: []
- id: "platon-timee-receptacle-p5"
  title: "Les figures modelées dans l'or"
  notes: ""
  passage:
    label: "50a-b"
    part: "L'image de l'or"
    text: |-
      Mais, pour atteindre à encore plus de clarté sur ce point, efforçons-nous de nous expliquer de nouveau. Supposons en effet que quelqu'un ait modelé toutes les figures possibles avec de l'or et qu'il ne cesse de les remodeler chacune en toutes les autres ; si on lui montre une de ces figures et si on lui demande ce que c'est, le parti de beaucoup le plus sûr au regard de la vérité est de répondre : « c'est de l'or ».
  points: []
- id: "platon-timee-receptacle-p5b"
  title: "Les figures ne sont que « tel ou tel »"
  notes: ""
  passage:
    label: "50a-b"
    part: "L'image de l'or"
    text: |-
      Il ne faut jamais dire du triangle ni d'aucune autre figure qui dans l'or sont venus à l'être, « c'est ceci », comme si ce l'était, puisque, à l'instant même où l'on donne ces dénominations, ces figures sont en train de changer ; mais, comme elles admettent qu'on les dénomme avec quelque sécurité « ce qui est tel ou tel », voilà la solution qu'on choisira de préférence.
  points: []
- id: "platon-timee-receptacle-p6"
  title: "Toujours le même nom"
  notes: ""
  passage:
    label: "50b-c"
    part: "Ce qui reçoit tous les corps"
    text: |-
      C'est bien le même type de discours qu'on doit tenir quand on parle de ce qui reçoit tous les corps. Il faut toujours lui donner le même nom ; car elle ne perd absolument aucune des propriétés qui sont les siennes. Toujours en effet elle reçoit toutes les choses, et jamais en aucune manière sous aucun rapport elle ne prend une forme qui ressemble à rien de ce qui peut entrer en elle.
  points: []
- id: "platon-timee-receptacle-p6b"
  title: "Le porte-empreinte et les imitations"
  notes: ""
  passage:
    label: "50b-c"
    part: "Ce qui reçoit tous les corps"
    text: |-
      Par nature, en effet elle se présente comme le porte-empreinte de toutes choses. Modifiée et découpée en figures par les choses qui entrent en elle, elle apparaît par suite tantôt sous un aspect tantôt sous un autre. Les choses qui entrent en elle et qui en sortent sont des imitations de réalités éternelles, des empreintes qui proviennent de ces réalités éternelles d'une manière qu'il n'est pas facile de décrire et qui suscite l'étonnement, sujet sur lequel nous reviendrons plus tard.
  points: []
- id: "platon-timee-receptacle-p7"
  title: "Trois choses à distinguer"
  notes: ""
  passage:
    label: "50c-51b"
    part: "La mère, le père et l'enfant"
    text: |-
      Pour le moment, donc, il faut se mettre dans la tête qu'il y a trois choses : ce qui devient, ce en quoi cela devient, et ce à la ressemblance de quoi naît ce qui devient. Et tout naturellement il convient de comparer le réceptacle à une mère, le modèle à un père, et la nature qui tient le milieu entre les deux à un enfant,
  points: []
- id: "platon-timee-receptacle-p7b"
  title: "Pour recevoir toutes les empreintes"
  notes: ""
  passage:
    label: "50c-51b"
    part: "Un réceptacle dépourvu de toute forme"
    text: |-
      et de comprendre que, si l'empreinte doit être diverse et présenter à l'œil cette diversité sous tous ses aspects, ce en quoi vient se déposer cette empreinte ne saurait être convenablement disposé que si elle est absolument dépourvue des caractéristiques de toutes les espèces des choses qu'elle est susceptible de recevoir par ailleurs.
  points: []
- id: "platon-timee-receptacle-p7c"
  title: "La ressemblance brouillerait l'empreinte"
  notes: ""
  passage:
    label: "50c-51b"
    part: "Un réceptacle dépourvu de toute forme"
    text: |-
      En effet, si le réceptacle ressemblait à l'une des choses qui y entrent, chaque fois que des choses dotées d'une nature contraire ou radicalement hétérogène à celle-là se présenteraient, le réceptacle en prendrait mal la ressemblance, étant donné qu'il montrerait en même temps l'aspect qui est le sien. Voilà pourquoi il faut que soit dépourvue de toutes caractéristiques ce qui recevra en elle des choses de tout genre.
  points: []
- id: "platon-timee-receptacle-p7d"
  title: "Les onguents et la substance molle"
  notes: ""
  passage:
    label: "50c-51b"
    part: "Un réceptacle dépourvu de toute forme"
    text: |-
      Par exemple, pour fabriquer des onguents parfumés artificiellement, on commence, une fois qu'on a cette matière première, par rendre le plus inodores possible les liquides qui doivent recevoir les parfums. De même, tous ceux qui, en quelque substance molle, s'appliquent à modeler des figures, ne laissent subsister la trace d'absolument aucune figure, et s'arrangent pour aplanir cette substance molle et la rendre le plus lisse possible.
  points: []
- id: "platon-timee-receptacle-p7e"
  title: "Dépourvue de forme par nature"
  notes: ""
  passage:
    label: "50c-51b"
    part: "Un réceptacle dépourvu de toute forme"
    text: |-
      Cela dit, il en va de même aussi pour l'entité qui doit sur toute son étendue recevoir maintes fois et dans de bonnes conditions les représentations de tous les êtres éternels ; il convient qu'elle soit par nature dépourvue de toute forme.
  points: []
- id: "platon-timee-receptacle-p7f"
  title: "La mère n'est aucun des éléments"
  notes: ""
  passage:
    label: "50c-51b"
    part: "Une espèce invisible et sans figure"
    text: |-
      Voilà bien pourquoi nous disons que la mère de ce qui est venu à l'être, de ce qui est visible ou du moins perceptible par un sens, c'est-à-dire le réceptacle, n'est ni terre, ni air, ni feu, ni eau, ni rien de tout ce qui vient de ces éléments et de tout ce dont ils dérivent. Mais, si nous disons qu'il s'agit d'une espèce invisible et dépourvue de figure, qui reçoit tout, qui participe de l'intelligible d'une façon particulièrement déconcertante et qui se laisse très difficilement saisir, nous ne mentirons point.
  points: []
- id: "platon-timee-receptacle-p7g"
  title: "La portion enflammée, la portion liquéfiée"
  notes: ""
  passage:
    label: "50c-51b"
    part: "Une espèce invisible et sans figure"
    text: |-
      Et, dans la mesure où ce qui vient d'être dit permet d'approcher sa nature, voici de quelle manière on pourrait en parler le plus correctement. Ce que, à chaque fois, on observe comme étant du feu, c'est la portion du réceptacle qui est enflammée ; de l'eau, la portion liquéfiée, de la terre et de l'air, toute portion qui a reçu des images de terre et d'air.
  points: []
