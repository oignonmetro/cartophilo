id: "aristote-amitie-importance"
title: "L'amitié : l'importance du sujet"
subtitle: "Éthique à Nicomaque, VIII, 1, 1155a3-31"
icon: "page"
color: "yellow"
group: "Aristote : la morale"
depth: "normale"
lessons:
- id: "aristote-amitie-importance-p1"
  title: "L'amitié, objet de l'examen"
  notes: ""
  passage:
    label: "1155a3-4"
    part: "Introduction du livre"
    text: |-
      Et après cela, on peut poursuivre par une discussion sur l'amitié. Car c'est une vertu particulière ou du moins elle va de pair avec la vertu.
  points: []
- id: "aristote-amitie-importance-p2"
  title: "La chose la plus nécessaire à l'existence"
  notes: ""
  passage:
    label: "1155a4-12"
    part: "Nécessité de l'amitié dans toutes les conditions"
    text: |-
      Mais en plus, c'est la chose la plus nécessaire à l'existence. Sans amis en effet nul ne choisirait de vivre, aurait-il tous les biens qui restent ; car c'est lorsqu'ils sont riches et en possession des formes du pouvoir et de la puissance que les gens éprouvent surtout le besoin d'amis.
  points: []
- id: "aristote-amitie-importance-p2b"
  title: "Dans la prospérité comme dans les revers"
  notes: ""
  passage:
    label: "1155a4-12"
    part: "Nécessité de l'amitié dans toutes les conditions"
    text: |-
      À quoi sert, en effet, une condition aussi privilégiée une fois soustraite la capacité de faire du bien, laquelle s'exerce surtout envers les amis et s'attire alors les plus vifs d'éloges ? Ou bien comment maintenir ces privilèges et les préserver sans amis, puisque plus ils sont importants, plus ils sont fragiles ?

      Dans la pauvreté aussi et les autres revers de fortune, le seul refuge, croit-on, ce sont les amis.
  points: []
- id: "aristote-amitie-importance-p3"
  title: "L'utilité des amis à tous les âges"
  notes: ""
  passage:
    label: "1155a12-16"
    part: "Son utilité à tous les âges"
    text: |-
      Par ailleurs, ils permettent aux jeunes d'éviter la faute ; ils permettent aux vieux de compter sur un service et d'avoir ce qui leur manque pour agir, en raison d'une faiblesse de ressource ; et ils permettent à ceux qui sont à la fleur de l'âge d'exécuter leurs belles actions. « À deux, allant de pair », on est en effet plus capable de penser et d'agir.
  points: []
- id: "aristote-amitie-importance-p4"
  title: "Entre parents et progéniture"
  notes: ""
  passage:
    label: "1155a16-22"
    part: "Son caractère naturel"
    text: |-
      Et l'amitié s'instaure de façon apparemment naturelle chez les parents envers leur progéniture et chez les enfants envers ceux qui les ont engendrés, non seulement parmi les hommes, mais encore parmi les oiseaux et la grosse majorité des animaux.
  points: []
- id: "aristote-amitie-importance-p4b"
  title: "Entre semblables, et surtout entre les hommes"
  notes: ""
  passage:
    label: "1155a16-22"
    part: "Son caractère naturel"
    text: |-
      Elle existe même entre représentants d'une même race, où elle est réciproque, et surtout entre les hommes ; d'où l'éloge que nous faisons de ceux qui aiment leurs congénères. Du reste, on peut encore voir, au gré des voyages, comme tout homme a de l'affinité pour son semblable et lui est cher.
  points: []
- id: "aristote-amitie-importance-p5"
  title: "La cohésion des Cités"
  notes: ""
  passage:
    label: "1155a22-28"
    part: "Son importance politique"
    text: |-
      D'autre part, selon toute apparence, même les Cités doivent leur cohésion à l'amitié et les législateurs s'en préoccupent, semble-t-il, plus sérieusement que de la justice. La concorde est en effet quelque chose qui ressemble à l'amitié, selon toute apparence ; or c'est à elle qu'ils visent par-dessus tout et l'insurrection, qui est son ennemie, est ce qu'ils cherchent le plus à bannir.
  points: []
- id: "aristote-amitie-importance-p5b"
  title: "Amitié et justice"
  notes: ""
  passage:
    label: "1155a22-28"
    part: "Son importance politique"
    text: |-
      De plus, entre amis, pas besoin de justice ; mais des gens justes éprouvent encore un besoin d'amitié et la justice à son plus haut degré de perfection passe pour être inspirée par l'amitié.
  points: []
- id: "aristote-amitie-importance-p6"
  title: "Une chose nécessaire, mais aussi belle"
  notes: ""
  passage:
    label: "1155a28-31"
    part: "Sa beauté"
    text: |-
      Toutefois, ce n'est pas seulement une chose nécessaire. Au contraire, c'est aussi une belle chose. Nous faisons en effet l'éloge de ceux qui aiment s'entourer d'amis. En même temps, avoir beaucoup d'amis passe pour être une belle chose entre toutes et, de plus, les mêmes personnes, croit-on, qui sont hommes de bien sont aussi celles qui méritent le titre d'amis.
  points: []
