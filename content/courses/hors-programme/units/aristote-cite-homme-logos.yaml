- id: aristote-cite-homme-logos-o1
  title: "Ce que les hommes font de la cité"
  notes: |-
    **Que l'homme soit politique par nature ne veut pas dire que cette nature s'accomplisse d'elle-même : le lógos qui rend la cité possible peut aussi la défaire, et c'est aux citoyens de faire advenir le juste.** Le mot « nature » revient six fois dans l'extrait. Mais « la nature ne fait rien en vain » n'implique pas un accomplissement automatique ou mécanique, quels que soient nos choix et nos efforts.

    Le *lógos*, *medium* de la cité, est aussi ce par quoi la *pólis* peut être défaite, dissoute, ou du moins remise en question : les deux possibilités sont données ensemble. « Enraciner les valeurs dans une perception originaire, c'est reconnaître, d'un seul et même mouvement, le caractère universel (universellement humain) de notre aptitude à les saisir puis à les exprimer, en même temps que leur caractère éminemment relatif » (Rogan, 2021) : chaque citoyen les perçoit selon sa position géographique, sa condition sociale, sa disposition éthique. Pour Francis Wolff, le juste et l'injuste, objets d'une expérience individuelle, « n'accèdent à l'existence, dans la vie commune, que par la discussion qui suppose la contradiction et implique une remise en question permanente ».

    À la fin du chapitre 2, Aristote le dit : « l'homme naît pourvu d'armes en vue <d'acquérir> prudence et vertu, dont il peut se servir à des fins absolument inverses » (1253a35). L'homme est responsable de son bonheur et de celui de la cité. Un usage nul ou tronqué du *lógos* mène à la *stasis*, où les citoyens s'opposent, par une perception erronée du juste.

    | | Platon | Aristote |
    | Les valeurs | des Idées, des essences, indépendantes des citoyens | perçues par les citoyens grâce au `lógos` |
    | Ce qui les fait valoir dans la cité | leur connaissance | la discussion, l'effort réitéré pour s'accorder |

    La politique n'est donc pas inféodée à la nature : c'est l'effort réitéré des citoyens pour s'entendre. Qu'on n'y parvienne pas toujours tient à l'absence de nécessité absolue de la région sublunaire, où se loge tout le défi de la politique humaine.

    ! « Par nature » ne veut pas dire « automatiquement » : la cité peut échouer par un mauvais usage du *lógos*.
