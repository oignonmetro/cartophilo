- id: aristote-cite-homme-logos-p3
  title: "Le lógos, propre de l'homme"
  notes: |-
    **Le lógos, faculté de percevoir les valeurs et de les exprimer, fait la spécificité et la supériorité de la nature politique humaine, et explique pourquoi l'homme se réalise dans la cité.** La troisième thèse répond à la question que laissait la deuxième : pourquoi est-ce dans la cité que l'homme s'accomplit ? Plus que le seul langage, le *lógos* désigne à la fois, et de façon indissociable, une **faculté perceptive** (percevoir, outre nos sensations, des valeurs éthiques) et une **faculté expressive** (les communiquer par la parole).

    | Extrait | Ce qu'il établit |
    | 1 | l'homme, politique plutôt que l'abeille, parce que seul il a le langage |
    | 2 | la voix signifie l'agréable et le douloureux ; le langage, l'avantageux et le juste |
    | 3 | le propre de l'homme : percevoir le bien et le juste ; les avoir en commun fait la cité |

    === 1 Plutôt que l'abeille : la nature ne fait rien en vain

    **L'homme est politique plutôt que toute abeille, parce que la nature, qui ne fait rien en vain, ne lui a pas donné le langage pour rien.** Le grec *mallon* signifie aussi bien « plus que » que « plutôt que ». Le commentaire lit « plus que toute abeille » : une différence de degré, qui maintient la continuité homme-animal. Pellegrin traduit « plutôt que » : les abeilles collaborent à une œuvre commune (*Histoire des animaux*, I, 1, 488a3), mais seuls les humains sont politiques au sens plein, parce qu'ils forment des cités.

    | Lecture | Traduction | Ce qu'elle fait de l'écart homme-animal |
    | le commentaire | « plus que » | une différence de degré |
    | Pellegrin | « plutôt que » | les humains seuls forment des cités |

    ! « La nature ne fait rien en vain » n'est pas une formule pieuse : c'est la prémisse qui fait du langage un indice de la fin politique.

    === 2 La voix et le langage

    **Voix et langage sont tous deux des facultés expressives, mais ils n'expriment pas la même chose : la voix, des sensations ; le langage, des valeurs.** Aristote distingue d'abord le *lógos* de la voix, *phōnḕ*, qui signifie le douloureux et l'agréable : tous deux sont tournés vers l'extériorité, vers la manifestation de certains messages.

    | | La voix (`phōnḕ`) | Le langage (`lógos`) |
    | Ce qu'elle signifie | le douloureux et l'agréable : des sensations | l'avantageux et le nuisible, le juste et l'injuste : des valeurs |
    | Qui l'a | tous les animaux | l'homme seul |
    | Ce qu'elle fonde | des communautés rivées à une fin biologique | la famille et la cité |

    La parole (*dialektos*) est « l'articulation de la voix par la langue » (*Histoire des animaux*, IV, 9, 535a31). Francis Wolff y voit une structure prédicative : le langage dit « quelque chose à propos de quelque chose » (*ti kata tinos*), ce qui permet d'affirmer, de nier, de s'opposer sur une même chose.

    ! La voix n'est pas un langage pauvre : elle signale l'agréable et le douloureux, quand le langage manifeste l'avantageux et le juste.

    === 3 Le propre de l'homme : percevoir le juste

    **Le propre de l'homme est de percevoir le bien et le mal, le juste et l'injuste ; avoir ces notions en commun, c'est ce qui fait une famille et une cité.** Deux points comptent. D'abord, seuls les humains perçoivent les valeurs : Aristote l'affirme, selon Pierre Pellegrin, « avec une insistance qui confine au pléonasme », en disant ce trait « propre (*idion*) » et l'homme « le seul (*monon*) » à le posséder (1253a15). Ensuite, il parle de perception (*aisthesis*) : le *lógos* s'y enracine. Pour Franco Volpi, dans le pratico-politique, le *lógos* ne révèle que lié à « une ouverture matérielle sensible ». On ne saurait donc le confondre avec notre rationalité, faculté d'agencer des idées : c'est d'abord une manière de percevoir et d'être-au-monde, antérieure à tout discours extérieur, puis une faculté expressive.

    Le *lógos* est ainsi la condition de possibilité de toute cité et la condition d'accomplissement de l'humain. On retrouve l'éthique : le bonheur est « activité de l'âme conforme à la raison » (*Éthique à Nicomaque*, I). La cité est le lieu où l'on débat, s'accorde ou se désaccorde sur les valeurs éthico-politiques : horizon d'un bonheur spécifiquement humain. Être animal politique est plus qu'être animal social, confusion contre laquelle Hannah Arendt mettait en garde. S'il n'y a pas de coextension homme-politique, il y en a une entre homme et cité, par le *lógos* : la *pólis* est le signifiant empirique qui manifeste le *lógos*, son signifié.

    ! Le *lógos* n'est pas d'abord la raison qui combine des idées : c'est une perception des valeurs, enracinée dans la sensibilité.
  passage:
    label: "1253a7-18"
    text: "Que l'être humain soit un animal politique plutôt que n'importe quelle abeille et que n'importe quel animal grégaire, c'est évident. Car, comme nous le disons, la nature ne fait rien en vain ; or seul parmi les animaux l'être humain a un langage. Certes la voix est le signe du douloureux et de l'agréable, aussi la rencontre-t-on chez les animaux ; leur nature, en effet, est parvenue jusqu'au point d'éprouver la sensation du douloureux et de l'agréable et de se les signifier mutuellement. Mais le langage existe en vue de manifester l'avantageux et le nuisible, et par suite aussi le juste et l'injuste. Il y a en effet une chose propre aux humains par rapport aux animaux : le fait que seuls ils aient la perception du bien, du mal, du juste, de l'injuste et des autres notions de ce genre. Or avoir de telles notions en commun, c'est ce qui fait une famille et une cité."
