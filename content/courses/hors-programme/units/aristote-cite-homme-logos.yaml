- id: "aristote-cite-homme-logos-o4"
  title: "Politique et biologie"
  notes: |-
    **{green}Le recours à la biologie ne ruine pas l'autonomie de la politique{/green} : l'homme est à la fois un vivant et un être éthique, et la politique, science humaine par excellence, prend appui sur la biologie sans s'y réduire.** La tripartition des sciences semble inaugurer un esprit des sciences humaines : appréhender l'homme comme objet et sujet du savoir. Mais la référence constante d'Aristote à la biologie quand il traite de l'humain dans les cités ne va pas de soi : ne risque-t-elle pas de rabattre la politique du côté des sciences de la nature et du vivant, et de lui ôter son autonomie ? N'enfreint-elle pas l'incommunicabilité des sciences, en mêlant une science théorétique (celle du vivant) et une science pratique ? Aristote serait-il le précurseur de la sociobiologie, fondée au XXe siècle par {sky}Edward O. Wilson{/sky} (1978), étude du fondement biologique des comportements sociaux ?

    {sky}Pierre Pellegrin{/sky} répond que « ce schéma explicatif a un pied dans la physique et un autre dans les sciences pratiques » : il n'y a pas « de réelle subversion du grand principe aristotélicien selon lequel des domaines différents relèvent de sciences différentes ». Il n'est pas étonnant, dit Pellegrin, que l'homme relève de la biologie et de l'éthique. Cela tient à sa nature d'être {violet}**duel**{/violet} : vivant à l'instar des autres espèces, *et* être éthique et politique, apte à percevoir les valeurs. {coral}Sa constitution biologique rend possible sa condition éthico-politique{/coral}. D'où le mot d'ordre de {sky}Nicole Loraux{/sky} : « il faut savoir tout prendre en même temps chez Aristote, sans choisir une entrée au détriment de l'autre ».

    | | Ce qui la rend supérieure |
    | la politique | architectonique : elle englobe et commande les sciences pratiques |
    | la contemplation (`theoria`) | sa visée ; et c'est l'éthique, plus que la politique, qui y mène |

    Reste l'articulation de l'éthique et de la politique, qui demanderait une autre analyse. Cette axiologie des sciences suggère que les sciences humaines tendent chez Aristote vers leur propre dépassement : elles ne sont pas le dernier mot des sciences.

    ! S'appuyer sur la biologie n'est pas réduire la politique à la biologie : l'homme vivant rend possible l'homme politique.
