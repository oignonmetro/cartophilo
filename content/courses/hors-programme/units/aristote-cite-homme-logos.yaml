- id: aristote-cite-homme-logos-p3
  title: "Le lógos, propre de l'homme"
  notes: |-
    **Le lógos, faculté de percevoir les valeurs et de les exprimer, fait la spécificité et la supériorité de la nature politique humaine, et explique pourquoi l'homme se réalise dans la cité.** Tout en maintenant la continuité homme-animal (« plus que toute abeille »), la troisième thèse répond à la question que laissait la deuxième. Plus que le seul langage, le *lógos* désigne à la fois, et de façon indissociable, une **faculté perceptive** (percevoir, outre nos sensations, des valeurs éthiques) et une **faculté expressive** (les communiquer par la parole).

    Aristote le caractérise en deux temps. D'abord, il le distingue de la voix, *phōnḕ*, qui exprime douleur ou plaisir : tous deux sont des facultés expressives, tournées vers l'extériorité. Ensuite, ils n'expriment pas la même chose :

    | | La voix (`phōnḕ`) | Le langage (`lógos`) |
    | Ce qu'elle signifie | le douloureux et l'agréable : des sensations | l'avantageux et le dommageable, le juste et l'injuste : des valeurs |
    | Qui l'a | tous les animaux | l'homme seul |
    | Ce qu'elle fonde | des communautés rivées à une fin biologique | la famille et la cité |

    Deux points comptent. D'abord, seuls les humains perçoivent les valeurs : Aristote l'affirme, selon Pierre Pellegrin, « avec une insistance qui confine au pléonasme », en disant ce trait « propre (*idion*) » et l'homme « le seul (*monon*) » à le posséder (1253a15). Ensuite, il parle de perception (*aisthesis*) : le *lógos* s'y enracine. Pour Franco Volpi, dans le pratico-politique, le *lógos* ne révèle que lié à « une ouverture matérielle sensible ». On ne saurait donc le confondre avec notre rationalité, faculté d'agencer des idées : c'est d'abord une manière de percevoir et d'être-au-monde, antérieure à tout discours, puis une faculté expressive par la parole (*dialektos*), « l'articulation de la voix par la langue » (*Histoire des animaux*, IV, 9, 535a31).

    Le *lógos* est ainsi la condition de possibilité de toute cité et la condition d'accomplissement de l'humain. On retrouve l'éthique : le bonheur est « activité de l'âme conforme à la raison » (*Éthique à Nicomaque*, I). La cité est le lieu où l'on débat, s'accorde ou se désaccorde sur les valeurs éthico-politiques : horizon d'un bonheur spécifiquement humain. Être animal politique est plus qu'être animal social, confusion contre laquelle Hannah Arendt mettait en garde. S'il n'y a pas de coextension homme-politique, il y en a une entre homme et cité, par le *lógos* : la *pólis* est le signifiant empirique qui manifeste le *lógos*, son signifié.

    ! Le *lógos* n'est pas d'abord la raison qui combine des idées : c'est une perception des valeurs, enracinée dans la sensibilité.
  passage:
    label: "(3)"
    text: "Que l'homme soit un animal politique plus que toute abeille et que tout animal grégaire, c'est évident. Car, comme nous le disons, la nature ne fait rien en vain ; or, de tous les animaux, l'homme est le seul à avoir le langage (lógon). Tandis que la voix (phōnḕ) est signe du douloureux et de l'agréable, ce pour quoi elle existe aussi chez les autres animaux (leur nature, en effet, est parvenue jusqu'au point d'avoir la perception du douloureux et de l'agréable et de se les signifier mutuellement), le langage existe quant à lui en vue de manifester l'avantageux et le dommageable, et par suite aussi le juste et l'injuste. Car il n'y a qu'une chose qui soit propre aux hommes par différence avec les autres animaux : le fait que seuls ils aient la perception du bien, du mal, du juste, de l'injuste et des autres “notions de ce genre”. Or avoir de telles “notions” en commun c'est ce qui fait une famille et une cité."
