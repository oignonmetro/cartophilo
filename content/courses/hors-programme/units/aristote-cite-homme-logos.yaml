- id: "aristote-cite-homme-logos-o3"
  title: "Une science pratique et architectonique"
  notes: |-
    **{green}La praxis devient chez Aristote un champ d'étude autonome{/green} : la politique tire ses principes de l'action même, se règle sur la prudence et non sur des Idées, et commande, en architecte, les autres sciences pratiques.** La tripartition fait de l'action humaine, indissociable du choix réfléchi (*prohairesis*) et du *lógos*, un domaine à part entière, dont se saisissent les sciences pratiques, l'éthique et la politique, à partir de principes propres. On ne rend raison de l'action qu'à partir d'elle-même, non de vérités théorétiques ou contemplatives : la *praxis* devient un champ d'investigation autonome, d'où l'homme doit tirer seul ses principes et ses maximes d'action.

    La thèse vise {sky}Platon{/sky}, qui adossait la politique à une métaphysique : {red}gouverner *justement*, c'est gouverner selon *l'Idée du juste*{/red}, principe immuable, intelligible et transcendant. D'où les philosophes-rois, seuls à connaître et contempler les Idées par la dialectique ({sky}*République*{/sky}, V, 471c-474c). {coral}Pour Aristote, le juste n'existe pas en soi comme une substance indépendante de la cité{/coral} : il émane des perceptions des citoyens doués de *lógos*. Des vérités immuables, à supposer qu'elles existent, ne seraient d'aucun secours pour agir.

    | | Platon | Aristote |
    | Ce qui règle l'action politique | la connaissance de l'Idée du juste | la prudence (`phronèsis`) |
    | Qui gouverne | le philosophe-roi | le politique prudent |
    | La méthode | la dialectique | l'observation des cités et de leur histoire |

    La prudence n'est ni une science ni un art, mais une « disposition, accompagnée de règle vraie, capable d'agir dans la sphère de ce qui est bon ou mauvais pour un être humain » ({sky}*Éthique à Nicomaque*{/sky}, VI, 5, 1140b1-5), l'une des vertus du politique. D'où la méthode empirique des *Politiques* : Aristote aurait constitué avec ses élèves une collection de cent-cinquante-huit constitutions ({sky}Crubellier et Pellegrin{/sky}, 2002). La politique est la science humaine par excellence, et « architectonique » : elle porte sur le souverain bien, englobe les autres sciences pratiques et constitue leur fin, le bien de la cité l'emportant sur celui de l'individu ({sky}*Éthique à Nicomaque*{/sky}, I, 1, 1094a25-b10).

    ! Pour Aristote, bien gouverner ne suppose pas de contempler le juste en soi, mais d'agir avec prudence dans le contingent.
