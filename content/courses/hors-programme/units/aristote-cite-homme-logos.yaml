- id: aristote-cite-homme-logos-o2
  title: "Deux régions, trois sciences"
  notes: |-
    **La politique porte sur les affaires humaines, dans la région sublunaire du changement, qu'on ne peut expliquer par des principes immuables : elle relève des sciences pratiques.** Est-elle une science humaine à part entière ? D'abord, Aristote circonscrit les « choses » ou « affaires humaines » (*ta pragmata*), qui appartiennent à la région sublunaire.

    | Région | Ce qu'elle contient | Son caractère |
    | sublunaire, « d'ici » | les êtres humains, la nature au sens le plus propre | génération et corruption, part irréductible de contingence, bien que globalement ordonnée |
    | supralunaire, « d'en haut » | des corps fixes et immuables (les étoiles) | permanente et incorruptible : nécessité et harmonie |

    Chaque région a ses principes propres : on ne rend pas raison du changeant par des principes immuables, et réciproquement. Cela tient à l'incommunicabilité des genres et, corrélativement, des sciences (*Métaphysique*, K, 7). Aristote distingue trois types de sciences :

    | Sciences | Objet | Fin |
    | poïétiques | la production (`poïesis`), comme la technique artisanale | extérieure à l'agent |
    | pratiques | l'action (`praxis`) | immanente à celui qui l'accomplit |
    | théorétiques | la contemplation (`theoria`), la connaissance des causes : physique, mathématiques | la connaissance |

    ! Confondre pratique et poïétique, c'est oublier que la fin de l'action est dans l'agent, non dans un produit.
