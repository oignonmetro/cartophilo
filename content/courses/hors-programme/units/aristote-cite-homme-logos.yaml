- id: aristote-cite-homme-logos-p2
  title: "L'homme, animal politique par nature"
  notes: |-
    **« L'homme est par nature un animal politique » : le politique n'est pas le propre de l'homme, mais il fait partie de ce qu'il est ; hors de la cité, il n'est plus pleinement homme.** Aristote envisage l'homme comme un animal, en continuité et non en rupture avec les autres espèces. Être politique « par nature » n'est d'ailleurs pas propre à l'homme : l'*Histoire des animaux* (I, 1, 487b33-488a14) appelle politiques, en un sens qui n'est pas seulement métaphorique (Labarrière, 2004), des animaux qui visent une fin commune, comme les abeilles, à la différence des animaux solitaires ou simplement grégaires, qui vivent en société sans fin commune.

    Pierre Pellegrin en tire que « politique » « n'entre pas dans la définition de l'homme », sans être pour autant accidentel : c'est un « accident par soi », une propriété qui appartient par soi à un sujet sans être une partie de son essence. Le commentaire lui donne raison, mais entend « par nature » (*physei*) en un sens plus essentiel : l'homme ne peut s'accomplir *en tant que tel* que dans la cité, forme politique spécifiquement humaine.

    | Le concept « politique » | Par rapport à l'humain |
    | en extension | plus large : d'autres espèces sont politiques |
    | en compréhension | partie intégrante : supprimer sa nature politique détruirait ce qu'il y a d'humain en nous |

    D'où le corollaire : qui vit hors cité est soit « dépravé », inférieur, soit « supérieur à l'homme ». L'homme est un milieu entre la dépravation morale (des bêtes sauvages) et la perfection divine. La précision « par nature et non du fait de la fortune » fixe les conditions de l'assertion : elle vise l'individu spontanément sauvage ou isolé, sans aucune velléité d'appartenir à une cité, non celui qu'une décision du corps politique a déchu de sa citoyenneté (l'ostracisme), dont l'exclusion résulte de sa condition politique même. L'« exclu naturel », en excès *infra* ou *extra*-humain, a rompu avec sa quiddité : il est, dans la région humaine, l'équivalent du monstre dans la nature (*Physique*, II, 8, 199b1-5). Aristote corrèle ainsi humain *et* politique, non-humain *et* apolitique.

    ! L'ostracisé n'est pas « hors cité par nature » : son exclusion est un acte politique, non une rupture avec son humanité.
