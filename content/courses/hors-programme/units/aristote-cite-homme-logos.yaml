# Unité de texte (voir content/textes.md) : Aristote, Politiques, I, 2,
# 1253a3-18, dans la traduction du commentaire « Cité, homme, lógos » (scan
# agrégation, p. 17-29 : « notre traduction, nous numérotons et soulignons »),
# dont viennent le découpage en trois thèses (1), (2), (3), les rappels et les
# cartes, dans l'ordre de ses sections. Les deux sections qui suivent
# l'analyse des thèses vont en prolongement.

id: aristote-cite-homme-logos
title: "Cité, homme, lógos"
subtitle: "Aristote, Politiques, I, 2, 1253a3-18"
icon: page
color: red
group: "Aristote : la politique"
intro: |-
  Le passage célèbre du livre I des *Politiques* où Aristote noue trois thèses : la cité fait partie des choses naturelles ; l'homme est par nature un animal politique ; seul de tous les animaux, il a le *lógos*.

  Le commentaire en tire une spécificité de l'humain, enracinée dans la cité par le *lógos*, puis interroge ce que les hommes font de cette nature, et le statut de la politique comme science humaine.
lessons:
- id: aristote-cite-homme-logos-i1
  title: "Cité, homme, lógos : trois thèses"
  notes: |-
    Au début des *Politiques*, **Aristote établit un lien essentiel entre le fait d'être doué de lógos et le fait de vivre en cités.** Les cités sont le milieu naturel de toute existence humaine, en même temps que sa finalité. Étudier l'homme, c'est donc l'étudier dans ses rapports avec ses semblables, dans la cité, et faire la genèse de ces communautés spécifiquement humaines. Les cités existent à la fois *pour* permettre à l'homme d'exercer son *lógos* et *parce qu'*il en est doué.

    Le texte tire les conséquences conceptuelles du récit de la genèse des cités qui le précède. Il imbrique trois thèses, restées célèbres tant elles sont fondatrices pour toute la philosophie politique, et qui articulent, dans cet ordre, la cité, l'homme et le langage :

    | Thèse | Porte sur | Ce qu'elle affirme |
    | (1) | la cité (`pólis`) | une réalité naturelle, finalité de la famille et du village |
    | (2) | l'homme | « l'homme est par nature un animal politique » |
    | (3) | le `lógos` | la spécificité et la supériorité de la nature politique humaine |

    Le texte définit ainsi une spécificité de l'humain en l'enracinant dans la cité par le biais du *lógos*. Reste une question, qui ouvre et ferme le commentaire : la politique aristotélicienne est-elle une science humaine à part entière ?

    ! Le *lógos* n'est pas seulement le langage : c'est ce qui fait de l'homme un être de cité.
