- id: aristote-cite-homme-logos-p1
  title: "La cité, réalité naturelle"
  notes: |-
    **La cité est naturelle parce qu'elle est la fin des communautés naturelles qui la précèdent : elle achève leur genèse, atteint l'autarcie et existe en vue de la vie heureuse.** C'est la première thèse, que le fragment suivant conclut : « la cité fait partie des choses naturelles ». Elle n'est pas le fruit d'un contrat, mais le terme et la finalité d'un processus lui-même naturel.

    | Extrait | Ce qu'il établit |
    | 1 | la cité, communauté achevée : l'autarcie, et la vie heureuse plutôt que le seul vivre |
    | 2 | elle est naturelle, parce qu'elle est la fin de communautés naturelles, et que la nature est fin |
    | 3 | la fin est le meilleur : l'autarcie est une fin, et quelque chose d'excellent |

    === 1 La cité, communauté achevée : vivre, puis bien vivre

    **La cité naît quand la communauté de plusieurs villages atteint l'autarcie ; née pour vivre, elle existe pour la vie heureuse.** « Achevée » qualifie la communauté, non la cité : Pellegrin écarte la lecture « cité parfaite », qui n'aurait guère de sens au stade de la genèse. « Vie heureuse » traduit *eu zên*, « bien vivre », à peu près synonyme d'*eudaimonia* : l'épanouissement du citoyen libre et vertueux.

    | Communauté | Ce en vue de quoi elle naît |
    | la famille | perpétuer l'espèce humaine |
    | le village | la subsistance des familles |
    | la cité | non une exigence biologique : le bien-vivre, « les belles actions », le bonheur |

    Selon Pierre Pellegrin, « la cité quitte en quelque sorte la sphère du besoin ». Aristote s'écarte ici de Platon, pour qui la cité avait d'abord vocation à satisfaire nos besoins, d'où la différenciation des fonctions (*République*, II, 369b-e). La cité vise non tant le vivre-ensemble que le bien-vivre : elle est « communauté de la vie heureuse » (*Politiques*, III, 9, 1280b34). Il y va de la réalisation de soi, indissociable de *notre* bonheur, au sens collectif. Dans le prolongement de l'éthique, le texte montre pourquoi la cité est le lieu où l'homme s'accomplit en tant qu'homme.

    ! La cité naît du besoin de vivre, mais elle n'existe qu'en vue de bien vivre : elle ne se réduit pas à la satisfaction des besoins.

    === 2 Naturelle, parce qu'elle est la fin

    **Toute cité est naturelle, puisqu'elle est la fin de communautés naturelles, et que la nature d'une chose est ce qu'elle est au terme de sa genèse.** La nature est fin : la nature d'un humain, d'un cheval, d'une famille, c'est ce que chacun est une fois sa genèse achevée, son entéléchie. La cité étant l'achèvement des familles et des villages, elle est leur nature même.

    Elle n'est donc pas le fruit d'un contrat ou d'une convention, contre ceux qui, comme le sophiste Lycophron, font de l'association politique le résultat d'un contrat, mais une donnée originaire, dans laquelle l'existence humaine s'enracine spontanément.

    | | La cité, par rapport aux familles et aux villages |
    | Chronologiquement | elle apparaît après eux |
    | Ontologiquement | elle est leur finalité ; elle leur est « par nature antérieure » (1253a19) |

    « Plus » que la somme de ses parties, la cité intègre ces communautés : elle n'en est pas la négation, mais l'intégration. La perspective d'Aristote est **téléologique** : « la nature ne fait rien en vain », et tout être naturel tend spontanément vers une fin immanente ; c'est par nature qu'il y a chez tous la tendance vers une telle communauté. Familles et villages existent *en vue de* la cité, parties indispensables et nécessaires mais non suffisantes : le tout précède et excède ses parties, comme une main séparée du corps n'est plus une main que par homonymie, telle une main de pierre (1253a20-22). La cité est « plus grande » en deux sens : numérique (plus de personnes) et surtout qualitatif (supérieure par sa fin, qui est la raison d'être de leur existence).

    ! La cité n'est pas un contrat entre individus qui lui préexisteraient : elle est première par la fin, même si elle vient après dans le temps.

    === 3 La fin est le meilleur

    **Second argument : la fin est le meilleur, et l'autarcie, que la cité atteint, est à la fois une fin et quelque chose d'excellent.** La cité n'est donc pas seulement naturelle : elle est la meilleure des communautés, parce qu'elle seule se suffit à elle-même. L'individu, au contraire, pris séparément, n'est pas autosuffisant : il est vis-à-vis de la cité comme une partie vis-à-vis du tout (1253a26-27).

    ! L'autarcie n'est pas l'isolement : c'est la cité, non l'individu, qui se suffit à elle-même.
