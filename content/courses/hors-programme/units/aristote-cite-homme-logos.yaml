- id: "aristote-cite-homme-logos-p2"
  title: "L'homme, animal politique par nature"
  notes: |-
    **{green}« L'être humain est par nature un animal politique »{/green} : le politique n'est pas le propre de l'homme, mais il fait partie de ce qu'il est ; hors de la cité, il n'est plus pleinement homme.** Le fragment conclut d'abord la première thèse (« à partir de cela » renvoie à la genèse), puis pose la deuxième, avec son corollaire : celui qui est hors cité est soit un être dégradé, soit un être surhumain.

    Aristote envisage l'homme comme un animal ({violet}*zôon politikon*{/violet}), en continuité et non en rupture avec les autres espèces. Être politique « par nature » n'est d'ailleurs pas propre à l'homme : l'{sky}*Histoire des animaux*{/sky} (I, 1, 487b33-488a14) appelle politiques, en un sens qui n'est pas seulement métaphorique ({sky}Labarrière{/sky}, 2004), des animaux qui visent une fin commune, {yellow}comme les abeilles{/yellow}, à la différence des animaux solitaires, ou simplement grégaires, qui vivent ensemble sans fin commune.

    {sky}Pierre Pellegrin{/sky} en tire que « politique » « n'entre pas dans la définition de l'homme », sans être pour autant accidentel : c'est un « accident par soi », une propriété qui appartient par soi à un sujet sans être une partie de son essence. Le commentaire lui donne raison, mais entend « par nature » (*physei*) en un sens plus essentiel : {coral}l'homme ne peut s'accomplir *en tant que tel* que dans la cité{/coral}, forme politique spécifiquement humaine.

    | Le concept « politique » | Par rapport à l'humain |
    | en extension | plus large : d'autres espèces sont politiques |
    | en compréhension | partie intégrante : supprimer sa nature politique détruirait ce qu'il y a d'humain en nous |

    D'où le corollaire : qui vit hors cité est soit dégradé, inférieur, soit surhumain ; un peu plus loin, « soit une bête soit un dieu » (1253a29). L'homme est un milieu entre la dépravation morale (des bêtes sauvages) et la perfection divine. La précision « naturellement et non pas par hasard » fixe les conditions de l'assertion : elle vise l'individu spontanément sauvage ou isolé, sans aucune velléité d'appartenir à une cité, non celui qu'une décision du corps politique a déchu de sa citoyenneté (l'ostracisme), dont l'exclusion résulte de sa condition politique même. L'« exclu naturel », en excès *infra* ou *extra*-humain, a rompu avec sa quiddité : il est, dans la région humaine, l'équivalent du monstre dans la nature ({sky}*Physique*{/sky}, II, 8, 199b1-5). Aristote corrèle ainsi humain *et* politique, non-humain *et* apolitique.

    L'injure vient de l'{sky}*Iliade*{/sky} (IX, 63). Le « pion isolé » rend le grec *azux*, qui veut dire d'ordinaire « qui ne subit pas le joug » : l'homme apolitique ne joue pas le jeu social, et le pion isolé est menacé, d'où sa violence. Un manuscrit lit « oiseaux » au lieu de « pions », lecture que suivent les traductions médiévales : l'homme sans cité serait comme les oiseaux de proie solitaires ({sky}Pellegrin{/sky}, note).

    ! {red}L'ostracisé n'est pas « hors cité naturellement »{/red} : son exclusion est un acte politique, non une rupture avec son humanité.
