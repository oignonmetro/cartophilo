- id: "aristote-cite-homme-logos-o1"
  title: "Ce que les hommes font de la cité"
  notes: |-
    **{green}Que l'homme soit politique par nature ne veut pas dire que cette nature s'accomplisse d'elle-même{/green} : c'est aux citoyens de faire advenir la cité et le juste, et ils peuvent y échouer.** Le mot « nature » revient six fois dans l'extrait. Mais « la nature ne fait rien en vain » n'implique pas un accomplissement automatique ou mécanique, quels que soient nos choix et nos efforts.

    À la fin du chapitre 2, Aristote le dit : « l'être humain naît pourvu d'armes pour la prudence et la vertu, dont il peut se servir à des fins absolument inverses » (1253a34-35). Le meilleur des animaux quand il est accompli, {red}il est le pire de tous quand il a rompu avec loi et justice{/red}. {coral}L'homme est donc responsable de son bonheur et de celui de la cité{/coral}.

    | L'être humain | Ce qu'il devient |
    | accompli, dans la loi et la justice | le meilleur des animaux |
    | ayant rompu avec loi et justice | le pire de tous |

    Le *lógos*, *medium* de la cité, est aussi ce par quoi elle peut être défaite : perçues par chacun selon sa condition, les valeurs divisent les citoyens jusqu'à la *stasis*. C'est l'objet du livre V des {sky}*Politiques*{/sky} (voir l'unité *Les sources des séditions*). Qu'on ne parvienne pas toujours à s'accorder tient à l'absence de nécessité absolue de la région sublunaire, où se loge tout le défi de la politique humaine.

    ! « Par nature » ne veut pas dire « automatiquement » : la cité peut échouer par un mauvais usage du *lógos*.
