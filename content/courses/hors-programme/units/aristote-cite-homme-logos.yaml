- id: aristote-cite-homme-logos-i3
  title: "La genèse des cités"
  notes: |-
    **Le texte conclut un récit : celui de la genèse des cités, de l'union du couple à la famille, de la famille au village, du village à la cité.** Le livre I s'ouvre sur un principe : « toute communauté est constituée en vue d'un certain bien ». La cité, communauté la plus éminente, qui contient toutes les autres, vise donc le bien le plus éminent.

    Pour le montrer, Aristote suit sa méthode ordinaire : diviser le composé jusqu'à ses éléments non composés, et suivre « le développement naturel des réalités ». Il répond ainsi à ceux qui ne distinguent le maître, le chef de famille, le roi et l'homme politique que par le nombre de gens qui leur sont soumis : ces pouvoirs diffèrent spécifiquement, comme les communautés où ils s'exercent.

    | Étape | Ce qui l'unit | Ce en vue de quoi |
    | le couple | la femme et l'homme ; celui qui commande et celui qui est commandé | la procréation ; leur sauvegarde |
    | la famille | ces deux communautés | la vie de tous les jours |
    | le village, « colonie de la famille » | plusieurs familles | des besoins qui ne sont pas ceux de la vie quotidienne |
    | la cité | plusieurs villages | vivre, puis la vie heureuse (fragment 1) |

    L'union du couple n'est pas un choix réfléchi, mais une tendance naturelle, comme chez les animaux et les plantes, à laisser après soi un autre semblable à soi. La famille gère un domaine, l'*oikos*, unité économique dont la fin est de subvenir aux besoins vitaux. Avec la cité, ce stade économique est dépassé pour le stade proprement politique.

    ! La genèse est chronologique, mais elle va vers une fin : c'est ce que le texte va tirer au clair.
