- id: aristote-cite-homme-logos-p1
  title: "La cité, réalité naturelle"
  notes: |-
    **La cité est une réalité naturelle : le terme et la finalité d'un processus lui-même naturel, non le fruit d'un contrat.** « À partir de là » renvoie au récit de la genèse des cités qui précède. Elle n'est pas une convention entre les hommes, mais une donnée originaire, dans laquelle leur existence s'enracine spontanément : toute étude de l'homme l'inscrira dans cet horizon politique naturel.

    | | La cité, par rapport aux familles et aux villages |
    | Chronologiquement | elle apparaît après eux |
    | Ontologiquement | elle est leur finalité |

    « Plus » que la somme de ses parties, la cité intègre ces communautés : elle n'en est pas la négation, mais l'intégration. La perspective d'Aristote est **téléologique** : « la nature ne fait rien en vain », et tout être naturel tend spontanément vers une fin immanente. Familles et villages existent *en vue de* la cité, parties indispensables et nécessaires mais non suffisantes : le tout précède et excède ses parties, comme une main n'existe jamais indépendamment d'un organisme vivant. La cité est « plus grande » en deux sens : numérique (plus de personnes) et surtout qualitatif (supérieure par sa fin).

    | Communauté | Ce en vue de quoi elle naît |
    | la famille | perpétuer l'espèce humaine |
    | le village | la subsistance des familles |
    | la cité | non une exigence biologique : le bien-vivre, « les belles actions », le bonheur |

    Selon Pierre Pellegrin, « la cité quitte en quelque sorte la sphère du besoin ». Aristote s'écarte ici de Platon, pour qui la cité avait d'abord vocation à satisfaire nos besoins, d'où la différenciation des fonctions (*République*, II, 369b-e). La cité est « communauté de la vie heureuse » (*Politiques*, III, 9, 1280b34) : il y va de la réalisation de soi, indissociable de *notre* bonheur, au sens collectif. Dans le prolongement de l'éthique, le texte montre pourquoi la cité est le lieu où l'homme s'accomplit en tant qu'homme.

    ! La cité n'est pas un contrat entre individus qui lui préexisteraient : elle est première par la fin, même si elle vient après dans le temps.
