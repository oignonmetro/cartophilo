- id: aristote-cite-homme-logos-i2
  title: "Communauté plutôt que société"
  notes: |-
    **Mieux vaut parler de communauté ou de cité que de société : la communauté vise une fin commune, la société pas nécessairement.** Le grec n'a pas vraiment d'équivalent de ce que nous entendons par « société », mot d'origine latine (*societas*). Le terme le plus proche est *koinonia*, généralement traduit par « communauté », dont la cité est une espèce ou une partie.

    Toute communauté implique la visée d'une finalité commune dès lors qu'elle est politique ; tel n'est pas nécessairement le cas d'une société, selon la distinction de Tönnies (1887). On peut très bien faire partie d'une société sans viser la même finalité que ses camarades.

    | | Société | Communauté, cité |
    | Point de départ | des individus isolés, des « atomes » | le tout et sa finalité |
    | Fin | aucune fin unique : chacun son intérêt (la « société civile » de Hegel) | une seule fin commune, son étai et son `telos` |
    | Démarche | des parties vers leur association | holistique : du tout vers ses éléments |

    Dans une communauté, les éléments n'ont pas vraiment d'existence autonome ou séparée : on les ressaisit à partir du tout.

    ! Traduire *koinonia* par « société », c'est perdre la fin commune qui définit la cité.
