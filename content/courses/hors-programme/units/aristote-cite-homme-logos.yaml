    text: "Et la communauté achevée formée de plusieurs villages est une cité dès lors qu'elle atteint le terme de l'autarcie pour ainsi dire complète ; bien que se constituant en vue de vivre, elle existe en vue de la vie heureuse. Voilà pourquoi toute cité est naturelle puisque les premières communautés le sont aussi. Car elle est leur fin, et la nature est fin : ce que chaque chose, en effet, est une fois que sa genèse est complètement achevée, c'est cela que nous disons être la nature de cette chose, par exemple la nature d'un humain, d'un cheval, d'une famille. De plus, le ce en vue de quoi, c'est-à-dire la fin, c'est le meilleur, et l'autarcie est à la fois une fin et quelque chose d'excellent."
