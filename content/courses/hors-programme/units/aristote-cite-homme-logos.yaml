# Unité de texte (voir content/textes.md) : Aristote, Politiques, I, 2,
# 1252b27-1253a18, traduction P. Pellegrin (GF), vérifiée sur l'édition.
# Rappels et cartes-explication tirés du commentaire « Cité, homme, lógos »
# (pp. 17-29), dont le découpage en trois thèses ; s'y ajoutent les notes de
# Pellegrin et les cartes de l'utilisatrice sur ce texte. Le texte se cite en
# trois fragments, repérés par leurs lignes Bekker. Les citations dans la
# traduction du commentaire ont disparu au profit de celle de Pellegrin. Les
# cartes sur la stasis et la relativité des valeurs sont passées dans l'unité
# « Les sources des séditions » (aristote-seditions, Politiques, V, 1).

id: aristote-cite-homme-logos
title: "Cité, homme, lógos"
subtitle: "Aristote, Politiques, I, 2, 1252b27-1253a18"
icon: page
color: red
group: "Aristote : la politique"
intro: |-
  Le passage célèbre du livre I des *Politiques* où Aristote achève le récit de la genèse des cités et noue trois thèses : la cité fait partie des choses naturelles ; l'être humain est par nature un animal politique ; seul parmi les animaux, il a le langage, le *lógos*.

  Le texte est cité dans la traduction de Pierre Pellegrin, en trois fragments repérés par leurs lignes. Le commentaire « Cité, homme, lógos » en tire une spécificité de l'humain, enracinée dans la cité par le *lógos*, puis interroge ce que les hommes font de cette nature, et le statut de la politique comme science humaine.
lessons:
- id: aristote-cite-homme-logos-i1
  title: "Cité, homme, lógos : trois thèses"
  notes: |-
    Au début des *Politiques*, **Aristote établit un lien essentiel entre le fait d'être doué de lógos et le fait de vivre en cités.** Les cités sont le milieu naturel de toute existence humaine, en même temps que sa finalité. Étudier l'homme, c'est donc l'étudier dans ses rapports avec ses semblables, dans la cité, et faire la genèse de ces communautés spécifiquement humaines. Les cités existent à la fois *pour* permettre à l'homme d'exercer son *lógos* et *parce qu'*il en est doué.

    Le texte tire les conséquences conceptuelles du récit de la genèse des cités qui le précède, et dont il cite la dernière étape (la cité, formée de plusieurs villages). Il imbrique trois thèses, restées célèbres tant elles sont fondatrices pour toute la philosophie politique, et qui articulent, dans cet ordre, la cité, l'homme et le langage :

    | Thèse | Porte sur | Ce qu'elle affirme | Où |
    | (1) | la cité (`pólis`) | une réalité naturelle, finalité de la famille et du village | fragment 1, conclu en 1253a2 |
    | (2) | l'homme | « l'être humain est par nature un animal politique » | fragment 2 |
    | (3) | le `lógos` | la spécificité et la supériorité de la nature politique humaine | fragment 3 |

    Le texte définit ainsi une spécificité de l'humain en l'enracinant dans la cité par le biais du *lógos*. Reste une question, qui ouvre et ferme le commentaire : la politique aristotélicienne est-elle une science humaine à part entière ?

    ! Le *lógos* n'est pas seulement le langage : c'est ce qui fait de l'homme un être de cité.
