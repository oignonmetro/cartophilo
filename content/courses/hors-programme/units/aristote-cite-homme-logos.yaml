- id: aristote-cite-homme-logos-o4
  title: "Politique et biologie"
  notes: |-
    **Le recours à la biologie ne ruine pas l'autonomie de la politique : l'homme est à la fois un vivant et un être éthique, et la politique, science humaine par excellence, prend appui sur la biologie sans s'y réduire.** La référence constante d'Aristote à la biologie quand il traite de l'humain dans les cités ne va pas de soi. N'enfreint-elle pas l'incommunicabilité des sciences, en mêlant une science théorétique (celle du vivant) et une science pratique ? Aristote serait-il le précurseur de la sociobiologie, fondée au XXe siècle par Edward O. Wilson (1978), étude du fondement biologique des comportements sociaux ?

    Pierre Pellegrin répond que « ce schéma explicatif a un pied dans la physique et un autre dans les sciences pratiques » : il n'y a pas « de réelle subversion du grand principe aristotélicien selon lequel des domaines différents relèvent de sciences différentes ». Cela tient à la nature de l'homme, être **duel** : vivant à l'instar des autres espèces, *et* être éthique et politique, apte à percevoir les valeurs. Sa constitution biologique rend possible sa condition éthico-politique. D'où le mot d'ordre de Nicole Loraux : « il faut savoir tout prendre en même temps chez Aristote, sans choisir une entrée au détriment de l'autre ».

    | | Ce qui la rend supérieure |
    | la politique | architectonique : elle englobe et commande les sciences pratiques |
    | la contemplation (`theoria`) | sa visée ; et c'est l'éthique, plus que la politique, qui y mène |

    Reste l'articulation de l'éthique et de la politique, qui demanderait une autre analyse. Cette axiologie des sciences suggère que les sciences humaines tendent chez Aristote vers leur propre dépassement : elles ne sont pas le dernier mot des sciences.

    ! S'appuyer sur la biologie n'est pas réduire la politique à la biologie : l'homme vivant rend possible l'homme politique.
