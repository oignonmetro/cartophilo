- id: "aristote-cite-homme-logos-i2"
  title: "Communauté plutôt que société"
  notes: |-
    **{green}Mieux vaut parler de communauté ou de cité que de société : la communauté vise une fin commune, la société pas nécessairement{/green}.** Le commentaire modifie ainsi l'ordre et les termes du triptyque qu'on lui proposait (homme, langage, société) : cité, homme, langage. Le grec n'a pas vraiment d'équivalent de ce que nous entendons par « société », mot d'origine latine ({sky}*societas*{/sky}). Le terme le plus proche est {violet}*koinonia*{/violet}, généralement traduit par « communauté », dont la cité est une espèce ou une partie.

    Toute communauté implique la visée d'une finalité commune dès lors qu'elle est politique ; tel n'est pas nécessairement le cas d'une société, selon la distinction de {sky}Tönnies{/sky} (1887). On peut très bien faire partie d'une société sans viser la même finalité que ses camarades.

    | | Société | Communauté, cité |
    | Point de départ | des individus isolés, des « atomes » | le tout et sa finalité |
    | Fin | aucune fin unique : chacun son intérêt (la « société civile » de {sky}Hegel{/sky}) | une seule fin commune, son étai et son `telos` |
    | Démarche | des parties vers leur association | holistique : du tout vers ses éléments |

    {coral}Dans une communauté, les éléments n'ont pas vraiment d'existence autonome ou séparée : on les ressaisit à partir du tout{/coral}.

    ! Traduire *koinonia* par « société », c'est perdre la fin commune qui définit la cité.
