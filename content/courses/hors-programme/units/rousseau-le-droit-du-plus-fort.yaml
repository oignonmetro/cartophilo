lessons:
- id: rousseau-le-droit-du-plus-fort-l1
  title: "Le fossé entre la force et le droit"
  notes: ""
  passage:
    label: "§1"
    text: "Le plus fort n'est jamais assez fort pour être toujours le maître, s'il ne transforme sa force en droit et l'obéissance en devoir. De là le droit du plus fort ; droit pris ironiquement en apparence, et réellement établi en principe. Mais ne nous expliquera-t-on jamais ce mot ? La force est une puissance physique ; je ne vois point quelle moralité peut résulter de ses effets. Céder à la force est un acte de nécessité, non de volonté ; c'est tout au plus un acte de prudence. En quel sens pourra-ce être un devoir ?"
