- id: "rousseau-le-droit-du-plus-fort-o1"
  title: "Force et droit, de Calliclès à Pascal"
  notes: |-
    **Le chapitre entre dans un débat ancien sur le rapport de la force et du droit, et en tire une conséquence politique.**

    **Contre Calliclès.** Dans le {sky}*Gorgias*{/sky} de {sky}Platon{/sky}, {sky}Calliclès{/sky} soutient que, selon la nature, {red}il est juste que le plus fort ait plus que le plus faible{/red}, et que les lois ne sont qu'une invention des faibles pour se protéger. Rousseau lui oppose que la nature ne donne {amber}que des faits{/amber} : de la force naturelle on ne tire aucun droit.

    **Après Pascal.** {sky}Pascal{/sky} constatait que, {teal}« ne pouvant faire que ce qui est juste fût fort, on a fait que ce qui est fort fût juste »{/teal} (*Pensées*, 298 B). Il décrivait l'opération même que Rousseau dénonce au §1, la force {red}déguisée en justice{/red}. Mais là où Pascal invitait à respecter l'ordre établi, faute de mieux, Rousseau cherche {green}un fondement légitime{/green}.

    **La conséquence politique.** Si nul droit ne naît de la force, {red}la monarchie absolue{/red}, issue de la conquête ou appuyée sur l'obéissance passive, ne peut être légitime par ce moyen. Il ne reste qu'un fondement : {green}la convention{/green}, par laquelle chacun s'engage librement. C'est le pacte social (I, 6), où l'on obéit à la loi parce qu'on en est l'auteur.

    ! Rousseau ne fait pas de la force {red}une illusion{/red} : il en fait {green}un fait sans valeur de droit{/green}, ce qui laisse la question de la légitimité entière.
  passage:
    label: "Prolongement"
  points:
  - id: "rousseau-le-droit-du-plus-fort-l4-p5"
    sentence: "**Rousseau tire du rejet du droit du plus fort une conséquence politique** : si nul droit ne peut naître de la seule force, alors la ___, où un seul gouverne sans être responsable devant personne, __ne saurait être légitime par ce moyen__."
    answer: "monarchie absolue"
    alt: []
  - id: "rousseau-le-droit-du-plus-fort-o1-x1"
    sentence: "Dans le *Gorgias*, ___ __soutient qu'il est juste, selon la nature, que le plus fort ait plus que le plus faible.__"
    answer: "Calliclès"
    alt: []
