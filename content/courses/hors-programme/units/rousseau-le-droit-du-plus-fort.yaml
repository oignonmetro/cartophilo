- id: "rousseau-le-droit-du-plus-fort-l3b"
  title: "Le brigand au coin d'un bois"
  notes: |-
    **L'exemple du brigand achève la réfutation :** {coral}**céder à son pistolet est forcé, mais aucune conscience ne s'y sent obligée.**{/coral}

    **Pourquoi un brigand ?** Il incarne {red}l'injustice{/red} : il s'empare par la force du bien d'autrui. Personne ne soutiendra qu'il a un droit sur ma bourse. C'est le {amber}cas limite{/amber} qui rend l'argument évident.

    **Pourquoi « non seulement il faut par force donner la bourse, mais quand je pourrais la soustraire » ?** Rousseau distingue deux situations. {yellow}Le pistolet sur la tempe{/yellow}, je donne : c'est la nécessité. Mais {yellow}si je peux cacher ma bourse sans risque{/yellow}, suis-je obligé de la donner ? {coral}Évidemment non{/coral} : la conscience n'y trouve aucune obligation. On ne lui obéit que par {violet}contrainte{/violet}.

    **Pourquoi « le pistolet qu'il tient est aussi une puissance » ?** La chute est ironique : si toute puissance devait être obéie, {red}le pistolet du brigand aussi{/red}. Le mot « puissance » désigne indifféremment le roi et l'arme ; {coral}il ne suffit donc pas qu'une puissance soit une puissance pour qu'on lui doive obéissance{/coral}. Le recours à Dieu ne justifie pas la soumission à n'importe quelle autorité.

    ! Le brigand n'est pas {red}une exception{/red} : c'est le modèle de {green}tout pouvoir qui ne repose que sur la force{/green}.
  passage:
    label: "§3"
    text: "Qu'un brigand me surprenne au coin d'un bois : non seulement il faut par force donner la bourse, mais quand je pourrais la soustraire suis-je en conscience obligé de la donner ? car enfin le pistolet qu'il tient est aussi une puissance."
