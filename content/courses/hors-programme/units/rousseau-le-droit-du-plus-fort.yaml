- id: "rousseau-le-droit-du-plus-fort-l4"
  title: "On n'est obligé qu'envers les puissances légitimes"
  notes: |-
    **La conclusion a deux faces :** {red}**négative**{/red}**, la force ne fait pas droit ;** {green}**positive**{/green}**, on n'est obligé d'obéir qu'aux puissances légitimes.**

    **Pourquoi « convenons » ?** Rousseau en appelle à l'accord du lecteur : après le §2 et le §3, {amber}la conclusion s'impose d'elle-même{/amber}.

    ? **Légitime** : conforme au droit, et non seulement établi en fait. Une puissance {violet}légitime{/violet} est celle à laquelle on doit obéir même quand elle ne pourrait pas nous contraindre.

    **Pourquoi « doublement illusoire » ?** La transformation de la force en droit devait {red}fonder{/red} le pouvoir et le {red}faire durer{/red}. Elle échoue sur les deux points : elle ne fonde rien, puisque le mot ne signifie rien, et elle ne fait pas durer, puisqu'elle justifie la révolte de quiconque devient plus fort.

    **Pourquoi « ma question primitive revient toujours » ?** La question du chapitre 1, {amber}qu'est-ce qui rend l'ordre social légitime ?{/amber}, reste entière : on sait maintenant que ce n'est pas la force. {coral}Le chapitre déblaie le terrain{/coral} pour la réponse du pacte social.

    ! La conclusion ne dit pas encore {red}quelles{/red} puissances sont légitimes : elle dit seulement {green}qu'il faut en chercher le fondement ailleurs que dans la force{/green}.
  passage:
    label: "§4"
    text: "Convenons donc que force ne fait pas droit, et qu'on n'est obligé d'obéir qu'aux puissances légitimes. Ainsi ma question primitive revient toujours."
  points:
  - id: "rousseau-le-droit-du-plus-fort-l4-p1"
    sentence: "« ___, __et qu'on n'est obligé d'obéir qu'aux puissances légitimes__. Ainsi ma **question primitive** revient toujours. »"
    answer: "Convenons donc que force ne fait pas droit"
