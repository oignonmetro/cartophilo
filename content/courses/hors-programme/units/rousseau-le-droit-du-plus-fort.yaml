- id: "rousseau-le-droit-du-plus-fort-i2"
  title: "La question, la thèse, la problématique"
  notes: |-
    **Le texte se demande si {amber}la force peut fonder un droit{/amber}**, c'est-à-dire une obligation d'obéir.

    **Pourquoi est-ce une question ?** Parce que, de fait, les pouvoirs établis sont presque tous nés de la force : {yellow}conquêtes, usurpations, guerres{/yellow}. Et l'on a toujours trouvé des raisons de dire que cette force donnait un titre : la nature, qui fait commander le plus fort (c'est la thèse que {sky}Calliclès{/sky} prête à la nature dans le *Gorgias* de {sky}Platon{/sky}), ou Dieu, de qui toute puissance viendrait. Si la force fondait le droit, {red}tout pouvoir de fait serait légitime{/red}, et la question du *Contrat social* n'aurait pas lieu d'être.

    **Sa thèse :** {coral}la force ne fait pas droit{/coral}. La force est une puissance physique ; le droit est une affaire morale, qui oblige la volonté. Aucun passage de l'un à l'autre n'est possible : {green}on n'est obligé d'obéir qu'aux puissances légitimes{/green}.

    **Sa problématique :** comment montrer que l'expression « droit du plus fort » est vide, alors qu'elle décrit l'origine de presque tous les pouvoirs et qu'elle est {amber}« réellement établie en principe »{/amber} ? Rousseau ne nie pas le fait ; il montre que {coral}le mot de droit n'y ajoute rien{/coral}, et que, pris au sérieux, il se détruit lui-même.

    ? **Droit et fait** : le {violet}fait{/violet} est ce qui est, le {violet}droit{/violet} ce qui doit être, ce qui est légitime. Que le plus fort commande est un fait ; qu'il doive commander serait un droit. Rousseau refuse de {red}tirer le droit du fait{/red}.

    ! Rousseau ne dit pas que {red}la force n'existe pas{/red} ou qu'il faut lui résister à tout prix : céder peut être {green}prudent{/green}, jamais {red}obligatoire{/red}.
  passage:
    label: "Introduction"
