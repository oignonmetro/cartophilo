    answer: "En quel sens pourra-ce être un devoir"
    alt: []
  - id: rousseau-le-droit-du-plus-fort-l1-p12
    sentence: "La force d'un individu __n'étant jamais assez__ ___ pour assurer une **domination permanente**, puisqu'elle peut s'affaiblir ou rencontrer plus forte qu'elle, le plus fort doit, pour la pérenniser, transformer sa force en droit et l'obéissance en devoir."
    answer: "pérenne"
    alt: []
  - id: rousseau-le-droit-du-plus-fort-l1-p13
    sentence: "Pour pérenniser malgré tout sa domination, le plus fort recourt à un **stratagème** : __il prétend avoir un véritable__ ___ sur le plus faible, et fait ainsi peser sur lui un devoir d'obéissance, fondant en droit une relation qui n'existait que de fait."
    answer: "droit"
    alt: []
  - id: rousseau-le-droit-du-plus-fort-l1-p14
    sentence: "L'expression « droit du plus fort » relève d'une ironie structurale : ce qui est présenté comme **seulement apparent** (« pris ironiquement en apparence ») est en réalité __ce qui se trouve véritablement__ ___ (« réellement établi en principe »), et cet écart entre l'ironie du droit et l'effectivité de son application en révèle l'illégitimité."
    answer: "établi"
    alt: []
  - id: rousseau-le-droit-du-plus-fort-l1-p15
    sentence: "Rousseau objecte que __la force est une puissance seulement__ ___ ; or **aucune cause physique ne saurait engendrer un effet moral**, ce qui interdit de faire dériver le droit, qui relève de la volonté et du devoir, de la seule force."
    answer: "physique"
    alt: []
  - id: rousseau-le-droit-du-plus-fort-l1-p16
    sentence: "Dans « céder à la force est un acte de nécessité, non de volonté ; __c'est tout au plus un acte de__ ___ », la force ne relève donc que de la **contrainte physique** et, tout au plus, de la prudence propre à telle situation, tandis que le devoir oblige la volonté indépendamment des circonstances."
    answer: "prudence"
    alt: []
- id: rousseau-le-droit-du-plus-fort-l2
  title: "La force est une contrainte physique, pas une obligation"
  notes: ""
  passage:
    label: "§2"
    text: "Supposons un moment ce prétendu droit. Je dis qu'il n'en résulte qu'un galimatias inexplicable. Car sitôt que c'est la force qui fait le droit, l'effet change avec la cause ; toute force qui surmonte la première succède à son droit. Sitôt qu'on peut désobéir impunément on le peut légitimement, et puisque le plus fort a toujours raison, il ne s'agit que de faire en sorte qu'on soit le plus fort. Or qu'est-ce qu'un droit qui périt quand la force cesse ? S'il faut obéir par force on n'a pas besoin d'obéir par devoir, et si l'on n'est plus forcé d'obéir on n'y est plus obligé. On voit donc que ce mot de droit n'ajoute rien à la force ; il ne signifie ici rien du tout."
