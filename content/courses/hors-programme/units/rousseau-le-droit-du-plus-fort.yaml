- id: "rousseau-le-droit-du-plus-fort-l1"
  title: "Le fossé entre la force et le droit"
  notes: |-
    **Rousseau commence par expliquer d'où vient l'idée d'un droit du plus fort :** {coral}**la force ne suffit pas à durer, le plus fort doit la convertir en droit.**{/coral}

    **Pourquoi « jamais assez fort pour être toujours le maître » ?** La force d'un homme n'est jamais {amber}pérenne{/amber} : {yellow}il vieillit, il dort, il rencontre plus fort que lui, et ceux qu'il domine peuvent s'unir contre lui{/yellow}. Une domination qui ne repose que sur la force dure ce que dure la force, c'est-à-dire peu.

    **Pourquoi « transformer sa force en droit et l'obéissance en devoir » ?** C'est le {amber}stratagème{/amber} du fort : faire croire qu'il a {violet}le droit{/violet} de commander, pour que le faible se sente {violet}obligé{/violet} d'obéir. Alors le faible obéit même quand le fort ne le contraint plus : {coral}l'obéissance ne dépend plus de la force présente, mais de la conscience du sujet{/coral}. Une relation de fait est déguisée en relation de droit.

    ? **Devoir** : une obligation qui s'adresse à la volonté, et qui vaut même quand personne ne nous contraint. {yellow}Je dois rendre un dépôt même si personne ne sait que je l'ai reçu.{/yellow}

    **Pourquoi « pris ironiquement en apparence, et réellement établi en principe » ?** L'expression {teal}« droit du plus fort »{/teal} sonne comme une moquerie, {yellow}comme on dirait « la loi de la jungle »{/yellow} ; mais elle est {red}réellement enseignée comme principe{/red}, par ceux qui fondent le pouvoir sur la conquête. L'écart entre l'ironie du mot et le sérieux de son usage {coral}révèle déjà son illégitimité{/coral}.

    ! Rousseau ne nie pas que le fort {red}veuille un droit{/red} : il explique ce désir, {green}pour montrer ensuite qu'il ne peut être satisfait{/green}.
  passage:
    label: "§1"
    text: "Le plus fort n'est jamais assez fort pour être toujours le maître, s'il ne transforme sa force en droit et l'obéissance en devoir. De là le droit du plus fort ; droit pris ironiquement en apparence, et réellement établi en principe."
