    label: "§2"
    text: "Sitôt qu'on peut désobéir impunément on le peut légitimement, et puisque le plus fort a toujours raison, il ne s'agit que de faire en sorte qu'on soit le plus fort. Or qu'est-ce qu'un droit qui périt quand la force cesse ? S'il faut obéir par force on n'a pas besoin d'obéir par devoir, et si l'on n'est plus forcé d'obéir on n'y est plus obligé. On voit donc que ce mot de droit n'ajoute rien à la force ; il ne signifie ici rien du tout."
