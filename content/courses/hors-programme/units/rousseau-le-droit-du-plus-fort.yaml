    alt: []
  - id: rousseau-le-droit-du-plus-fort-l1-p12
    sentence: "La force d'un individu n'étant jamais assez ___ pour assurer une domination permanente, puisqu'elle peut s'affaiblir ou rencontrer plus forte qu'elle, le plus fort doit, pour la pérenniser, transformer sa force en droit et l'obéissance en devoir."
    answer: "pérenne"
    alt: []
  - id: rousseau-le-droit-du-plus-fort-l1-p13
    sentence: "Pour pérenniser malgré tout sa domination, le plus fort recourt à un stratagème : il prétend avoir un véritable ___ sur le plus faible, et fait ainsi peser sur lui un devoir d'obéissance, fondant en droit une relation qui n'existait que de fait."
    answer: "droit"
    alt: []
  - id: rousseau-le-droit-du-plus-fort-l1-p14
    sentence: "L'expression « droit du plus fort » relève d'une ironie structurale : ce qui est présenté comme seulement apparent (« pris ironiquement en apparence ») est en réalité ce qui se trouve véritablement ___ (« réellement établi en principe »), et cet écart entre l'ironie du droit et l'effectivité de son application en révèle l'illégitimité."
    answer: "établi"
    alt: []
  - id: rousseau-le-droit-du-plus-fort-l1-p15
    sentence: "Rousseau objecte que la force est une puissance seulement ___ ; or aucune cause physique ne saurait engendrer un effet moral, ce qui interdit de faire dériver le droit, qui relève de la volonté et du devoir, de la seule force."
    answer: "physique"
    alt: []
  - id: rousseau-le-droit-du-plus-fort-l1-p16
    sentence: "Dans « céder à la force est un acte de nécessité, non de volonté ; c'est tout au plus un acte de ___ », la force ne relève donc que de la contrainte physique et, tout au plus, de la prudence propre à telle situation, tandis que le devoir oblige la volonté indépendamment des circonstances."
    answer: "prudence"
