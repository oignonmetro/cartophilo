- id: rousseau-le-droit-du-plus-fort-l3
  title: "L'obéissance à la force n'est qu'une contrainte"
  notes: ""
  passage:
    label: "§3"
    text: "Obéissez aux puissances. Si cela veut dire, cédez à la force, le précepte est bon, mais superflu ; je réponds qu'il ne sera jamais violé. Toute puissance vient de Dieu, je l'avoue ; mais toute maladie en vient aussi. Est-ce à dire qu'il soit défendu d'appeler le médecin ? Qu'un brigand me surprenne au coin d'un bois : non seulement il faut par force donner la bourse, mais quand je pourrais la soustraire suis-je en conscience obligé de la donner ? car enfin le pistolet qu'il tient est aussi une puissance."
  points:
  - id: rousseau-le-droit-du-plus-fort-l3-p1
    sentence: "« ___. Si cela veut dire, cédez à la force, le précepte est bon, mais superflu ; je réponds qu'il ne sera jamais violé. Toute puissance vient de Dieu, je l'avoue ; mais toute maladie en vient aussi. Est-ce à dire qu'il soit défendu d'appeler le médecin ? Qu'un brigand me surprenne au coin d'un bois : non seulement il faut par force donner la bourse, mais quand je pourrais la soustraire suis-je en conscience obligé de la donner ? car enfin le pistolet qu'il tient est aussi une puissance. »"
    answer: "Obéissez aux puissances"
