- id: "rousseau-le-droit-du-plus-fort-l2b"
  title: "Le mot de droit n'ajoute rien à la force"
  notes: |-
    **Les conséquences s'enchaînent jusqu'à la conclusion :** {coral}**le mot de droit n'ajoute rien à la force, il ne signifie ici rien du tout.**{/coral}

    **Pourquoi « sitôt qu'on peut désobéir impunément on le peut légitimement » ?** Si le droit suit la force, celui qui échappe à la force échappe au droit. {red}L'impunité{/red}, ordinairement le contraire de la justice, {red}se confond avec elle{/red}. Le droit du plus fort, loin d'assurer l'obéissance, {coral}motive la désobéissance{/coral} : il n'y a qu'à devenir le plus fort.

    **Pourquoi « qu'est-ce qu'un droit qui périt quand la force cesse ? »** Un droit véritable {amber}survit à la force{/amber} : {yellow}le propriétaire volé garde son droit sur la chose, même quand il ne peut pas la reprendre{/yellow}. Un « droit » qui disparaît avec la force n'est que la force sous un autre nom.

    **Pourquoi « s'il faut obéir par force on n'a pas besoin d'obéir par devoir » ?** Le dilemme est complet. Ou bien la force contraint, et {red}le devoir est superflu{/red} ; ou bien elle ne contraint plus, et {red}le devoir disparaît avec elle{/red}. Dans les deux cas, il ne fait rien. La force vient de l'extérieur et s'annule avec sa cause ; l'obligation véritable viendrait de l'intérieur et engagerait la volonté.

    **Pourquoi « il ne signifie ici rien du tout » ?** C'est la réponse à la question du §1 : on demandait d'expliquer le mot, et {coral}le mot n'a pas de sens{/coral}. Le droit du plus fort n'est qu'une {violet}contrainte{/violet} qui se donne un nom flatteur.

    ! Rousseau ne réfute pas le droit du plus fort par {red}l'indignation{/red}, mais par {green}la logique{/green} : la notion se contredit.
