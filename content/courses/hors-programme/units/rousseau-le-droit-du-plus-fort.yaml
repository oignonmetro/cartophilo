- id: "rousseau-le-droit-du-plus-fort-l3"
  title: "Obéissez aux puissances"
  notes: |-
    **Rousseau réfute la justification religieuse de l'obéissance :** {coral}**que toute puissance vienne de Dieu n'oblige pas à s'y soumettre, pas plus que la maladie n'interdit d'appeler le médecin.**{/coral}

    **D'où vient « Obéissez aux puissances » ?** C'est le précepte que la tradition tire de l'{sky}Épître aux Romains{/sky} (13, 1-2) : tout homme doit être soumis aux autorités, car il n'y a d'autorité que par Dieu, et qui s'oppose à l'autorité se rebelle contre l'ordre voulu par Dieu. On en faisait le fondement de l'{violet}obéissance passive{/violet} des sujets à leur souverain.

    **Pourquoi « bon, mais superflu » ?** Rousseau feint d'accorder le précepte en le lisant comme « cédez à la force ». Mais alors {amber}il ne sera jamais violé{/amber} : on cède toujours à une force à laquelle on ne peut pas résister. {yellow}Ordonner d'obéir à la force, c'est comme ordonner de ne pas respirer sous l'eau.{/yellow} Un précepte qu'on ne peut pas enfreindre {red}ne commande rien{/red}.

    **Pourquoi « toute maladie en vient aussi » ?** Rousseau {amber}accorde la prémisse pour en refuser la conclusion{/amber}. Si tout ce qui vient de Dieu devait être respecté, il faudrait respecter la maladie. Or {yellow}personne ne pense qu'il soit défendu d'appeler le médecin{/yellow}. L'existence même de la médecine montre qu'il y a des puissances qu'on combat légitimement. {coral}Venir de Dieu ne rend donc pas une puissance légitime.{/coral}

    ! Rousseau ne nie pas que {red}toute puissance vienne de Dieu{/red} : il nie qu'il en suive {green}un devoir d'obéir{/green}.
  passage:
    label: "§3"
    text: "Obéissez aux puissances. Si cela veut dire, cédez à la force, le précepte est bon, mais superflu ; je réponds qu'il ne sera jamais violé. Toute puissance vient de Dieu, je l'avoue ; mais toute maladie en vient aussi. Est-ce à dire qu'il soit défendu d'appeler le médecin ?"
