- id: "rousseau-le-droit-du-plus-fort-l2"
  title: "Supposons ce prétendu droit"
  notes: |-
    **Rousseau raisonne par l'absurde : il suppose le droit du plus fort, et montre qu'il n'en résulte qu'un** {red}**« galimatias inexplicable »**{/red}**, car un droit fondé sur la force change avec elle.**

    **Pourquoi « supposons » ?** Après l'objection de principe (§1), Rousseau accorde un moment la thèse adverse pour en {amber}tirer les conséquences{/amber}. Si elles sont absurdes, la thèse l'est.

    ? **Galimatias** : un discours embrouillé, qui n'a pas de sens. Le mot dit que le droit du plus fort n'est pas seulement injuste, mais {amber}incohérent{/amber}.

    **Pourquoi « l'effet change avec la cause » ?** Si c'est la force qui fait le droit, la force est la {violet}cause{/violet} et le droit l'{violet}effet{/violet} ; or la force est {amber}relative{/amber} : on est toujours plus ou moins fort qu'un autre, et « le plus fort » ne l'est que par rapport à ceux qu'on considère à un moment donné. {coral}Le droit change donc de titulaire chaque fois que la force change de mains.{/coral}

    **Pourquoi « toute force qui surmonte la première succède à son droit » ?** Conséquence immédiate : {yellow}l'usurpateur qui renverse le roi hérite de son droit, au moment même où il le renverse{/yellow}. Le droit qui devait protéger le pouvoir établi {red}légitime sa chute{/red}.

    ! Le défaut n'est pas que ce droit soit {red}mal fondé{/red} : c'est qu'il {green}ne fonde rien de stable{/green}, ce qui est le contraire d'un droit.
  passage:
    label: "§2"
    text: "Supposons un moment ce prétendu droit. Je dis qu'il n'en résulte qu'un galimatias inexplicable. Car sitôt que c'est la force qui fait le droit, l'effet change avec la cause ; toute force qui surmonte la première succède à son droit."
  points:
  - id: "rousseau-le-droit-du-plus-fort-l2-p1"
    sentence: "« ___. __Je dis qu'il n'en résulte__ qu'un **galimatias inexplicable**. Car sitôt que c'est la force qui fait le droit, l'effet change avec la cause ; toute force qui surmonte la première succède à son droit. »"
    answer: "Supposons un moment ce prétendu droit"
    alt: []
