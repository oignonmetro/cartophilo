- id: "rousseau-le-droit-du-plus-fort-l1b"
  title: "La force est une puissance physique"
  notes: |-
    **L'objection de Rousseau tient en une distinction :** {coral}**la force est une puissance physique, le devoir est moral, et céder à la force est un acte de nécessité, non de volonté.**{/coral}

    **Pourquoi « ne nous expliquera-t-on jamais ce mot ? »** Rousseau demande qu'on définisse {amber}le mot « droit »{/amber} dans l'expression : s'il a un sens, il doit ajouter quelque chose à la force. Le §2 montrera qu'il n'ajoute rien.

    **Pourquoi « une puissance physique » ?** La force agit sur les {amber}corps{/amber} : elle pousse, enchaîne, frappe. Or {coral}aucune cause physique ne produit un effet moral{/coral}. {yellow}La pierre qui tombe m'écrase, elle ne m'oblige pas.{/yellow} La moralité, elle, concerne la {violet}volonté{/violet} : elle suppose qu'on puisse faire autrement.

    **Pourquoi « un acte de nécessité, non de volonté » ?** Quand je cède à la force, {red}je ne choisis pas{/red} : je fais ce que je ne peux pas ne pas faire. Un tel acte n'est ni bon ni mauvais moralement. {amber}« Tout au plus un acte de prudence »{/amber} : je calcule qu'il vaut mieux céder que mourir. La prudence vaut pour telle situation ; le devoir oblige quelles que soient les circonstances.

    **Pourquoi la question finale ?** {teal}« En quel sens pourra-ce être un devoir ? »{/teal} La réponse attendue est {red}aucun{/red} : on ne peut pas être obligé de faire ce qu'on ne peut pas ne pas faire.

    ! « Prudence » n'est pas un reproche : céder au plus fort peut être {green}raisonnable{/green}, mais ce n'est jamais {red}un devoir{/red}.
  passage:
    label: "§1"
    text: "Mais ne nous expliquera-t-on jamais ce mot ? La force est une puissance physique ; je ne vois point quelle moralité peut résulter de ses effets. Céder à la force est un acte de nécessité, non de volonté ; c'est tout au plus un acte de prudence. En quel sens pourra-ce être un devoir ?"
