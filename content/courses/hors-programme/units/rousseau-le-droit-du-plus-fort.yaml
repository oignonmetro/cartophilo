id: "rousseau-le-droit-du-plus-fort"
title: "Rousseau : « le droit du plus fort » (1762)"
subtitle: "Du contrat social, I, 3"
icon: "page"
color: "red"
group: "Rousseau : Du contrat social"
depth: "normale"
intro: |-
  Le chapitre où Rousseau réfute le « droit du plus fort » : la force est une puissance physique, dont aucune obligation ne peut naître ; un droit fondé sur elle périt avec elle et ne signifie rien. Il ne reste qu'à obéir aux puissances légitimes, dont il faut encore trouver le fondement.
lessons:
- id: "rousseau-le-droit-du-plus-fort-i1"
  title: "Le chapitre, sa place et son plan"
  notes: |-
    **Le texte est le chapitre 3 du livre I du {sky}*Contrat social*{/sky} (1762), intitulé {teal}« Du droit du plus fort »{/teal}.** Il appartient à une série de réfutations : avant de dire ce qui fonde une autorité légitime, Rousseau écarte les fondements qu'on lui donne d'ordinaire.

    **Ce qui précède.** Le livre s'ouvre sur un constat et une question : {teal}« L'homme est né libre, et partout il est dans les fers »{/teal} ; comment ce changement s'est-il fait, Rousseau dit l'ignorer, mais {amber}qu'est-ce qui peut le rendre légitime ?{/amber} (I, 1). C'est la {violet}« question primitive »{/violet} que la dernière phrase du chapitre retrouve. Le chapitre 2 a écarté un premier fondement, {red}la famille{/red} : l'autorité du père ne dure que tant que l'enfant a besoin de lui, et ne peut servir de modèle à celle d'un roi.

    **Ce qui suit.** Le chapitre 4, « De l'esclavage », écarte {red}la convention de servitude{/red} : on ne peut pas renoncer à sa liberté. Après ces trois exclusions, il ne reste qu'un fondement possible, {green}une convention par laquelle chacun s'associe à tous{/green}, le pacte social (I, 6).

    **Le plan.**

    | Mouvement | Lieu | Ce qui s'y joue |
    | expliquer d'où vient l'idée d'un droit du plus fort, puis l'objecter : la force est physique | §1 | Le fort veut durer et convertit sa force en droit ; mais céder à la force est un acte de nécessité, non de volonté, donc jamais un devoir. |
    | supposer ce droit et en tirer l'absurdité | §2 | Un droit fondé sur la force change avec elle, légitime la révolte réussie, périt quand elle cesse : le mot de droit n'ajoute rien à la force. |
    | réfuter la lecture religieuse du précepte « Obéissez aux puissances » | §3 | Si obéir veut dire céder, le précepte est superflu ; que toute puissance vienne de Dieu n'oblige pas plus à obéir au brigand qu'à ne pas soigner la maladie. |
    | conclure et revenir à la question | §4 | La force ne fait pas droit : on ne doit obéir qu'aux puissances légitimes, et il reste à savoir lesquelles. |

    ! Le chapitre ne dit pas encore {red}ce qui fonde{/red} l'autorité : il dit {green}ce qui ne la fonde pas{/green}.
