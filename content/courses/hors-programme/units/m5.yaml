id: m5
title: Vertu, métaéthique et postérité de la morale kantienne
subtitle: Vertu, statut de la loi morale, et actualité de l'éthique kantienne
icon: book
color: yellow
group: La morale de Kant

lessons:
  - id: m5-l1
    title: Vertu et vice ; le contraste avec Aristote
    notes: |
      Kant définit la **vertu** comme « la force morale de la volonté d'un
      être humain à remplir son devoir », et le **vice** comme
      l'**immoralité par principe**. Cette définition contraste sur plusieurs
      points avec la conception {coral}aristotélicienne{/coral} de la vertu.

      - Chez Kant, la vertu __présuppose__ une théorie du **devoir** déjà en
        place : Kant ne part pas d'une conception du bon caractère pour en
        tirer des conclusions sur l'action à mener, mais établit d'abord les
        principes de la conduite morale, puis définit la vertu comme la force
        de s'y tenir malgré la tentation.
      - La vertu, chez Kant, est une force de la __volonté__, non une
        disposition affective qu'on acquerrait par accoutumance ou par
        habituation, comme une seconde nature : elle consiste à surmonter des
        obstacles que Kant tient pour des traits ineffaçables de la nature
        humaine, plus proche, en ce sens, de ce qu'Aristote aurait tenu pour
        un trait moindre, la **continence** ou la **maîtrise de soi**.
      - Kant rejette l'idée {coral}aristotélicienne{/coral} selon laquelle la vertu serait
        un __juste milieu__ entre deux vices, qui ne différeraient d'elle que
        par degré. **La prodigalité** et **l'avarice**, par exemple, ne diffèrent pas
        par un excès ou un défaut de largesse : le prodigue agit sur le
        principe d'acquérir des moyens dans la seule intention d'en jouir,
        l'avare sur celui de les acquérir dans la seule intention de les
        posséder.

      ! Le contraste porte sur le __principe__ qui distingue vertu et vice,
        non sur un simple __degré__ : c'est ce que manque, selon Kant, la
        lecture {coral}aristotélicienne{/coral} de la vertu comme moyenne entre deux
        extrêmes.
    points:
      - id: m5-l1-p1
        sentence: Kant définit la vertu comme la force morale de la volonté d'un être humain à remplir son ___.
        answer: devoir
        explanation: "MM 6:405."
      - id: m5-l1-p2
        sentence: Kant définit le vice comme l'immoralité par ___.
        answer: principe
        explanation: "MM 6:390."
      - id: m5-l1-p3
        sentence: À la différence d'Aristote, Kant ne part pas d'une conception du bon caractère pour en tirer des conclusions sur l'action à mener ; il établit d'abord les principes de la conduite morale, la vertu chez lui présupposant donc déjà une théorie du ___.
        answer: devoir
      - id: m5-l1-p4
        sentence: La vertu, chez Kant, est une force de la volonté, non une disposition affective qu'on acquerrait comme une seconde nature par ___.
        answer: habituation
      - id: m5-l1-p5
        sentence: Parce qu'elle consiste à surmonter des obstacles tenus pour des traits ineffaçables de la nature humaine, la vertu kantienne est plus proche de ce qu'Aristote aurait appelé un trait moindre, la continence ou la ___.
        answer: maîtrise de soi
      - id: m5-l1-p6
        sentence: Kant rejette l'idée aristotélicienne selon laquelle la vertu serait un juste ___ entre deux vices, qui ne différeraient d'elle que par degré.
        answer: milieu
      - id: m5-l1-p7
        sentence: "Selon Kant, la prodigalité et l'avarice ne diffèrent pas par un excès ou un défaut de largesse, mais par le principe qui les anime : le prodigue acquiert des moyens dans la seule intention d'en jouir, l'avare dans la seule intention de les ___."
        answer: posséder

  - id: m5-l2
    title: Vertu, bonne volonté et vertus particulières
    notes: |
      Kant ajoute au contraste avec Aristote deux précisions supplémentaires.

      - Puisque la vertu morale, chez Kant, est un trait fondé sur un
        principe moral, la frontière entre **vertus morales** et **vertus non
        morales** est __nette__ — alors que les théories classiques traitent
        volontiers l'esprit ou l'amabilité aux côtés de la générosité ou de
        la justice, sans hiérarchie de principe.
      - La vertu ne peut être un trait d'êtres __divins__, puisqu'elle
        consiste précisément dans le **pouvoir de surmonter des obstacles** qui,
        chez de tels êtres, ne se présenteraient pas.

      Kant distingue par ailleurs la **vertu**, force générale de la volonté
      à faire son devoir, de la **bonne volonté**, et tient les deux pour
      __compatibles mais distinctes__ : on peut avoir une bonne volonté,
      pleinement attachée au devoir pour lui-même, sans jamais rencontrer
      d'obstacle suffisant pour révéler qu'on manque de la force nécessaire à
      le surmonter — et donc sans posséder à proprement parler la vertu.
      Kant tient cependant qu'une action n'a de valeur morale authentique que
      si elle procède d'une **pureté de motivation** atteinte seulement par une
      __révolution__ permanente et quasi religieuse de l'orientation de la
      volonté ; tant que cette révolution n'a pas eu lieu, les actions
      conformes au devoir restent, quoi qu'on en dise par ailleurs,
      moralement sans valeur.

      Parmi les **vertus particulières** que Kant discute figurent le respect de
      soi, l'honnêteté, la frugalité, le perfectionnement de soi, la
      bienfaisance, la gratitude, la sociabilité et le pardon ; parmi les
      **vices particuliers**, la malice, la cupidité, la paresse, l'envie, la
      servilité, le mépris et l'arrogance.
    points:
      - id: m5-l2-p1
        sentence: Puisque la vertu morale, chez Kant, est fondée sur un principe moral, la frontière entre vertus morales et vertus non morales est ___, alors que les théories classiques traitent volontiers l'esprit ou l'amabilité aux côtés de la générosité ou de la justice.
        answer: nette
      - id: m5-l2-p2
        sentence: La vertu ne peut être, pour Kant, un trait d'êtres divins, puisqu'elle consiste précisément dans le pouvoir de surmonter des obstacles qui, chez de tels êtres, ne se ___ pas.
        answer: présenteraient
      - id: m5-l2-p3
        sentence: On peut avoir, selon Kant, une bonne volonté pleinement attachée au devoir pour lui-même sans jamais rencontrer d'obstacle suffisant pour révéler qu'on manque de la force nécessaire à le surmonter, et donc sans posséder à proprement parler la ___.
        answer: vertu
      - id: m5-l2-p4
        sentence: Une action n'a de valeur morale authentique, selon Kant, que si elle procède d'une pureté de motivation atteinte seulement par une ___ permanente et quasi religieuse de l'orientation de la volonté.
        answer: révolution
      - id: m5-l2-p5
        sentence: Tant que cette révolution de l'orientation de la volonté n'a pas eu lieu, les actions conformes au devoir restent, selon Kant, moralement sans ___.
        answer: valeur
      - id: m5-l2-p6
        sentence: Parmi les vertus particulières que Kant discute figurent le respect de soi, l'honnêteté, la frugalité, la bienfaisance, la gratitude, la sociabilité et le ___.
        answer: pardon

  - id: m5-l3
    title: Droit et vertu, les deux principes subsidiaires de l'impératif catégorique
    notes: |
      Dans ses écrits ultérieurs, en particulier la Métaphysique des mœurs,
      Kant développe une théorie éthique normative complète pour appliquer
      l'impératif catégorique aux personnes humaines ordinaires. Il distingue
      à cette fin deux {sky}**principes subsidiaires**{/sky}.

      - Le {sky}**Principe universel du droit**{/sky}, qui gouverne les questions de
        justice, de droits et d'actes extérieurs susceptibles d'être imposés
        par la contrainte, énonce qu'une action est juste si elle peut
        __coexister__ avec la liberté de chacun selon une loi universelle.
      - Le {sky}**Principe suprême de la doctrine de la vertu**{/sky}, qui gouverne les
        fins, attitudes et traits de caractère moraux, exige d'agir selon
        une maxime de fins qui puisse être une __loi universelle__ pour tous.

      Ces deux principes fondent à leur tour des devoirs plus spécifiques,
      de droit d'une part, d'éthique et de vertu d'autre part. Les **devoirs
      de droit** sont __étroits et parfaits__, parce qu'ils exigent ou interdisent
      un acte précis — ainsi l'interdiction de voler ; les **devoirs d'éthique
      et de vertu** sont __larges et imparfaits__, parce qu'ils laissent une
      latitude dans la façon de s'en acquitter — ainsi le devoir de
      bienfaisance, qui ne précise pas exactement quelle assistance apporter.

      ! Même muni d'un système de devoirs, Kant reconnaît que le
        __jugement__ reste nécessaire pour déterminer comment ces devoirs
        s'appliquent à des circonstances particulières : les lois morales
        « doivent être scrupuleusement observées », mais ne peuvent avoir
        égard à chaque petite circonstance.
    points:
      - id: m5-l3-p1
        sentence: Le Principe universel du droit, qui gouverne les questions de justice, de droits et d'actes extérieurs susceptibles d'être imposés par la contrainte, énonce qu'une action est juste si elle peut coexister avec la liberté de chacun selon une loi ___.
        answer: universelle
        explanation: "MM 6:230."
      - id: m5-l3-p2
        sentence: Le Principe suprême de la doctrine de la vertu, qui gouverne les fins, attitudes et traits de caractère moraux, exige d'agir selon une maxime de fins qui puisse être une loi universelle pour ___.
        answer: tous
        explanation: "MM 6:395."
      - id: m5-l3-p3
        sentence: Les devoirs de droit, comme l'interdiction de voler, sont dits étroits et ___ parce qu'ils exigent ou interdisent un acte précis.
        answer: parfaits
      - id: m5-l3-p4
        sentence: Les devoirs d'éthique et de vertu, comme la bienfaisance, sont dits larges et ___ parce qu'ils laissent une latitude dans la façon de s'en acquitter.
        answer: imparfaits
      - id: m5-l3-p5
        sentence: Même muni d'un système de devoirs, Kant reconnaît que le ___ reste nécessaire pour déterminer comment ces devoirs s'appliquent à des circonstances particulières.
        answer: jugement

  - id: m5-l4
    title: Kant est-il déontologiste ?
    notes: |
      La lecture reçue tient Kant pour un __déontologiste__, en ce sens
      précis qu'il nierait que le juste et l'injuste soient fonction du bon
      ou du mauvais — thèse centrale des théories morales __téléologiques__.
      Le conséquentialisme des actes, pour qui l'action juste est celle qui
      produit le meilleur résultat global, et l'éthique de la vertu, pour qui
      l'action juste est l'action vertueuse, sont deux théories
      {violet}téléologiques{/violet} : dans les deux cas, la **bonté** fonde la **justesse**.

      Deux types de raisons soutiennent la lecture {violet}déontologiste{/violet}.

      - De nombreuses déclarations de Kant sur les fins et les traits de
        caractère semblent rejeter les deux formes de {violet}téléologie{/violet} : il
        affirme ainsi que les fins visées par une action et ses effets ne
        peuvent lui conférer aucune valeur morale __inconditionnée__, laquelle
        ne se trouve que dans le **principe de la volonté** ; il affirme aussi
        que même les vertus traditionnelles comme le courage ou la
        modération ne possèdent qu'une valeur __conditionnelle__.
      - Des arguments plus théoriques, dans le Groundwork comme dans la
        seconde Critique, tiennent à l'insistance de Kant sur l'**autonomie**
        de la volonté rationnelle : si la loi qui détermine le bien et le mal
        se trouvait ailleurs que dans l'aptitude des maximes à valoir comme
        législation universelle, il en résulterait toujours de
        l'**hétéronomie**. Dans la seconde Critique, Kant va jusqu'à
        soutenir que le concept de bien et de mal ne doit pas être déterminé
        __avant__ la loi morale, mais seulement après elle et par son moyen.
    points:
      - id: m5-l4-p1
        sentence: Kant est classé comme déontologiste, dans la lecture reçue, précisément parce qu'il nierait que le juste et l'injuste soient fonction de la bonté ou de la méchanceté — thèse centrale des théories morales dites ___.
        answer: téléologiques
      - id: m5-l4-p2
        sentence: Le conséquentialisme des actes et l'éthique de la vertu sont tous deux des théories téléologiques, parce que dans les deux cas c'est la ___ qui fonde la justesse de l'action.
        answer: bonté
      - id: m5-l4-p3
        sentence: Kant affirme que les fins visées par une action et ses effets ne peuvent lui conférer aucune valeur morale ___, laquelle ne se trouve que dans le principe de la volonté.
        answer: inconditionnée
        explanation: "G 4:400."
      - id: m5-l4-p4
        sentence: Kant affirme également que même les vertus traditionnelles comme le courage ou la modération ne possèdent qu'une valeur ___.
        answer: conditionnelle
      - id: m5-l4-p5
        sentence: "Kant écrit que si la volonté cherche la loi qui doit la déterminer ailleurs que dans l'aptitude de ses maximes à sa propre législation universelle, il en résulte toujours de l'___."
        answer: hétéronomie
        explanation: "G 4:441."
      - id: m5-l4-p6
        sentence: Dans la seconde Critique, Kant soutient que le concept de bien et de mal ne doit pas être déterminé avant la loi morale, mais seulement ___ elle et par son moyen.
        answer: après
        explanation: "CPrR 5:63."

  - id: m5-l5
    title: Les lectures téléologiques concurrentes
    notes: |
      Plusieurs lecteurs de Kant contestent la lecture déontologiste reçue.

      - Le premier à suggérer une lecture téléologique de Kant fut, selon
        certains, __Mill__, qui laisse entendre, dans le premier chapitre de
        son Utilitarisme, que la formule de la loi universelle ne peut
        raisonnablement s'interpréter que comme un **test portant sur les
        conséquences** de l'adoption universelle d'une maxime.
      - __Hare__ soutient que des jugements moraux comme « voler est mal »
        sont en réalité des __prescriptions universelles__, qui interdisent
        toute exception et exigent donc d'accorder un **poids égal** au bien-être
        de chacun — ce qui revient, selon lui, à agir pour produire le
        {green}meilleur résultat global{/green} : l'impératif catégorique serait ainsi,
        selon son mot, « simplement de l'utilitarisme dit autrement ».
      - __Cummiskey__ soutient que si les principes moraux sont justifiés
        parce qu'universalisables, ils doivent être eux-mêmes
        __conséquentialistes__ : le respect de la **valeur de l'humanité**
        exigerait de compter l'intérêt de chacun pour un et un seul, et donc
        d'agir toujours pour produire le {green}meilleur résultat global{/green}.

      ! Aucun de ces trois lecteurs ne prétend restituer fidèlement
        l'intention de Kant lui-même : chacun tire du texte kantien, par un
        chemin différent, une conclusion que Kant présente pourtant comme
        s'opposant frontalement au {green}conséquentialisme des actes{/green}.
    points:
      - id: m5-l5-p1
        sentence: Le premier philosophe à avoir suggéré une lecture téléologique de Kant fut, selon certains commentateurs, ___, qui y voit dans son Utilitarisme un test portant sur les conséquences de l'adoption universelle d'une maxime.
        answer: Mill
      - id: m5-l5-p2
        sentence: Le commentateur ___ soutient que des jugements moraux comme « voler est mal » sont en réalité des prescriptions universelles, qui interdisent toute exception et exigent donc d'accorder un poids égal au bien-être de chacun.
        answer: Hare
      - id: m5-l5-p3
        sentence: "Selon Hare, accorder un poids égal au bien-être de chacun revient à agir pour produire le meilleur résultat global, si bien que l'impératif catégorique serait, selon son mot, « simplement de l'___ dit autrement »."
        answer: utilitarisme
      - id: m5-l5-p4
        sentence: Le commentateur ___ soutient que si les principes moraux sont justifiés parce qu'universalisables, ils doivent être eux-mêmes conséquentialistes.
        answer: Cummiskey
      - id: m5-l5-p5
        sentence: Selon Cummiskey, le respect de la valeur de l'humanité exige de compter l'intérêt de chacun pour un et un seul, et donc d'agir toujours pour produire le meilleur résultat ___.
        answer: global

  - id: m5-l6
    title: Les lectures téléologiques non conséquentialistes
    notes: |
      D'autres lectures téléologiques de Kant, sans être conséquentialistes,
      font toutes dépendre la justesse d'une action d'une __valeur__ qui la
      fonde.

      - __Herman__ invite à « laisser la déontologie derrière soi » : selon
        elle, Kant n'a jamais voulu dire qu'aucune valeur ne fonde les
        principes moraux — ce qui priverait de toute raison de s'y
        conformer —, mais soutient que l'**agentivité rationnelle** constituée
        par les principes de la rationalité fonctionne elle-même comme une
        valeur qui justifie l'action morale.
      - __Guyer__ soutient que c'est l'**autonomie** elle-même qui constitue
        la valeur fondant les exigences morales : la pensée morale consiste à
        reconnaître la valeur inestimable de la volonté autonome d'un agent
        rationnel.
      - __Wood__ soutient que c'est l'**humanité** elle-même qui constitue
        cette **valeur fondatrice** : les choses bonnes doivent leur valeur au
        fait d'être choisies par des agents rationnels, mais ce choix
        lui-même n'aurait aucune valeur si sa source, l'agentivité
        rationnelle, n'en avait aucune.
      - __Langton__ soutient que, pour que la théorie de Kant demeure
        **objectiviste**, la valeur de l'humanité et de la bonne volonté doit
        être __indépendante__ du fait d'être simplement choisie par nous.
      - __Darwall__ soutient que l'**obligation morale** n'est, chez Kant, que
        « l'ombre que projettent, pour des agents rationnels imparfaits, les
        actions bonnes ou fondées en raison » — ce qui exclut que le juste
        puisse fournir une source de raisons indépendante du bon.
    points:
      - id: m5-l6-p1
        sentence: La commentatrice ___ invite à « laisser la déontologie derrière soi », en soutenant que l'agentivité rationnelle constituée par les principes de la rationalité fonctionne elle-même comme une valeur qui justifie l'action morale.
        answer: Herman
      - id: m5-l6-p2
        sentence: Le commentateur ___ soutient que c'est l'autonomie elle-même qui constitue la valeur fondant les exigences morales chez Kant.
        answer: Guyer
      - id: m5-l6-p3
        sentence: Le commentateur ___ soutient que c'est l'humanité elle-même, plutôt que l'autonomie, qui constitue la valeur fondant les exigences morales.
        answer: Wood
      - id: m5-l6-p4
        sentence: La commentatrice ___ soutient que, pour que la théorie de Kant demeure objectiviste, la valeur de l'humanité et de la bonne volonté doit être indépendante du fait d'être simplement choisie par nous.
        answer: Langton
      - id: m5-l6-p5
        sentence: "Le commentateur ___ soutient que l'obligation morale n'est, chez Kant, que l'ombre que projettent, pour des agents rationnels imparfaits, les actions bonnes ou fondées en raison."
        answer: Darwall
      - id: m5-l6-p6
        sentence: À la différence de Herman, Guyer et Wood, qui désignent respectivement l'agentivité rationnelle, l'autonomie et l'humanité comme valeur fondatrice, Langton insiste sur l'exigence que cette valeur soit ___ de nos choix.
        answer: indépendante

  - id: m5-l7
    title: Métaéthique, vérifonctionnalité, réalisme et constructivisme
    notes: |
      La question de savoir si la philosophie morale de Kant est
      __réaliste__, __anti-réaliste__ ou __constructiviste__ divise ses
      interprètes.

      Une première question est de savoir si les jugements moraux sont, pour
      Kant, __vérifonctionnels__ (aptes au vrai et au faux). À première vue
      non, puisque l'impératif catégorique est un impératif, et qu'un
      impératif comme « laisse le pistolet, prends les cannolis » n'est ni
      vrai ni faux. Mais un jugement moral particulier comme « mentir est mal
      » s'analyse plutôt comme « l'impératif catégorique nous commande de ne
      pas mentir » — un __rapport__ sur un impératif, qui, lui, est
      vérifonctionnel. __Hare__ soutient au contraire que les jugements
      moraux kantiens sont des __prescriptions__, non des descriptions,
      l'objectivité morale se ramenant chez Kant, comme chez lui, à
      l'universalité.

      Une seconde question porte sur le {sky}**constructivisme**{/sky} métaéthique,
      thèse selon laquelle les vérités morales sont, ou sont déterminées par,
      l'issue de procédures — réelles ou hypothétiques — de délibération ou
      de choix.
      - De nombreux interprètes, dont __Rawls__ et __Korsgaard__, lisent chez
        Kant un {sky}constructivisme{/sky} fondé sur l'**autonomie** de la volonté : les
        agents liés par des exigences morales sont à la fois **auteurs et
        sujets de la loi morale**, et ne sont soumis à aucune exigence
        extérieure à leur propre volonté.
      - D'autres interprètes, dont __Wood__ et __Ameriks__, défendent au
        contraire une lecture __réaliste__ robuste, selon laquelle la nature
        rationnelle est une **valeur objective**, indépendante de l'exercice de
        notre volonté, et la loi morale se contente d'en spécifier le
        traitement approprié.
      - __Korsgaard__ défend enfin une forme de __quiétisme__ métaéthique, en
        récusant l'idée même qu'il faille ancrer nos conceptions morales dans
        des faits ou des propriétés existant indépendamment d'une **procédure
        de délibération acceptable**.
    points:
      - id: m5-l7-p1
        sentence: "Un impératif comme « laisse le pistolet, prends les cannolis » n'est, à première vue, ni vrai ni faux, ce qui suggère que l'impératif catégorique lui-même n'est pas ___."
        answer: vérifonctionnel
      - id: m5-l7-p2
        sentence: "Un jugement moral particulier comme « mentir est mal » peut cependant s'analyser comme un rapport sur l'impératif catégorique, du type « l'impératif catégorique nous commande de ne pas ___ », rapport qui, lui, est vérifonctionnel."
        answer: mentir
      - id: m5-l7-p3
        sentence: Le commentateur ___ soutient au contraire que les jugements moraux kantiens sont des prescriptions et non des descriptions, l'objectivité morale se ramenant, chez Kant comme chez lui, à l'universalité.
        answer: Hare
      - id: m5-l7-p4
        sentence: Le constructivisme métaéthique est la thèse selon laquelle les vérités morales sont, ou sont déterminées par, l'issue de procédures de délibération ou de ___.
        answer: choix
      - id: m5-l7-p5
        sentence: Les commentateurs Rawls et ___ lisent chez Kant un constructivisme fondé sur l'autonomie de la volonté, les agents liés par des exigences morales étant à la fois auteurs et sujets de la loi morale.
        answer: Korsgaard
      - id: m5-l7-p6
        sentence: Les commentateurs Wood et ___ défendent au contraire une lecture réaliste robuste, selon laquelle la nature rationnelle est une valeur objective, indépendante de l'exercice de notre volonté.
        answer: Ameriks
      - id: m5-l7-p7
        sentence: Le commentateur Korsgaard défend enfin, au-delà du seul constructivisme, une forme de ___ métaéthique, en récusant l'idée même qu'il faille ancrer nos conceptions morales dans des faits ou des propriétés indépendants de toute procédure.
        answer: quiétisme

  - id: m5-l8
    title: L'éthique kantienne de l'intelligence artificielle
    notes: |
      Kant n'a naturellement jamais envisagé l'intelligence artificielle,
      mais sa philosophie morale offre des ressources pour penser les
      questions qu'elle soulève. Une personne morale __compétente__, chez
      Kant, doit se concevoir elle-même comme **libre** au sens d'être capable
      d'engendrer et d'auteur ses propres choix sans être déterminée par rien
      d'extérieur ni d'intérieur à elle-même ; elle doit posséder des
      **pouvoirs de raison** lui permettant de reconnaître l'autorité d'exigences
      rationnelles inconditionnées ; elle doit enfin être __autonome__ :
      légiférer elle-même les normes morales qu'elle s'impose, et se
      gouverner entièrement par sa propre raison, indépendamment de ses
      désirs ou de ses objectifs. D'un point de vue kantien, rien n'indique
      que nous approchions de la création d'une telle personne morale
      artificielle.

      **Cinq thèmes kantiens** peuvent néanmoins guider notre réflexion sur
      l'IA, qui elle-même ne peut, chez Kant, être tenue pour vertueuse,
      vicieuse ou moralement responsable, ces notions ne s'appliquant qu'aux
      agents moraux compétents.

      - La **complicité** : nos responsabilités incluent d'éviter de
        contribuer, par nos données, notre expertise ou nos financements, aux
        projets immoraux d'autrui, comme des systèmes de surveillance ou de
        manipulation.
      - Les **intentions** : nos intentions en concevant ou utilisant l'IA
        comptent moralement, indépendamment de ce que l'IA elle-même est
        capable de vouloir.
      - La signification __expressive ou symbolique__ de nos actions,
        indépendamment de leurs effets : une IA qui déforme certains noms
        propres peut exprimer que certaines personnes méritent moins de
        reconnaissance que d'autres.
      - Les __effets__ de nos actions, et non leurs seules intentions,
        comptent moralement : des systèmes qui suppriment des emplois sans
        offrir de reconversion peuvent éroder les **capacités** et l'**estime de
        soi** des personnes concernées.
      - Le caractère __hiérarchique et inachevé__ du système moral kantien :
        l'impératif catégorique fonde des **principes de niveau intermédiaire**,
        concernant par exemple le mensonge ou la manipulation, qu'il reste à
        préciser et à appliquer à des cas nouveaux comme l'IA.
