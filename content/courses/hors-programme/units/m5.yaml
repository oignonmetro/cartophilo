id: m5
title: Vertu, métaéthique et postérité de la morale kantienne
subtitle: Vertu, statut de la loi morale, et actualité de l'éthique kantienne
icon: book
color: yellow
group: "Kant : la morale"

lessons:
  - id: m5-l1
    title: Vertu et vice ; le contraste avec Aristote
    notes: |
      Kant définit la {violet}**vertu**{/violet} comme {teal}« {/teal}la force morale de la volonté d'un
      être humain à {teal}remplir son devoir »{/teal}, et le {violet}**vice**{/violet} comme
      l'{violet}**immoralité par principe**{/violet}. Cette définition contraste sur plusieurs
      points avec la conception {sky}aristotélicienne{/sky} de la vertu.

      - Chez Kant, la vertu __présuppose__ une théorie du {violet}**devoir**{/violet} déjà en
        place : {green}Kant ne part pas d'une conception du bon caractère pour en{/green}
        {green}tirer des conclusions sur l'action à mener, mais établit d'abord les{/green}
        {green}principes de la conduite morale{/green}, puis définit la vertu comme la force
        de s'y tenir malgré la tentation.
      - La vertu, chez Kant, est une force de la __volonté__, non une
        disposition affective qu'on acquerrait par accoutumance ou par
        habituation, comme une seconde nature : elle consiste à surmonter des
        obstacles que Kant tient pour des traits ineffaçables de la nature
        humaine, plus proche, en ce sens, de ce qu'Aristote aurait tenu pour
        un trait moindre, la {violet}**continence**{/violet} ou la {violet}**maîtrise de soi**{/violet}.
      - Kant rejette l'idée {coral}aristotélicienne{/coral} {red}selon laquelle la vertu serait{/red}
        {red}un __juste milieu__ entre deux vices, qui ne différeraient d'elle que{/red}
        {red}par degré{/red}. {yellow}**La prodigalité** et **l'avarice**{/yellow}, par exemple, ne diffèrent pas
        par un excès ou un défaut de largesse : {coral}le prodigue agit sur le{/coral}
        {coral}principe d'acquérir des moyens dans la seule intention d'en jouir,{/coral}
        {coral}l'avare sur celui de les acquérir dans la seule intention de les{/coral}
        {coral}posséder{/coral}.

      ! Le contraste porte sur le __principe__ qui distingue vertu et vice,
        non sur un simple __degré__ : c'est ce que manque, selon Kant, la
        lecture {coral}aristotélicienne{/coral} de la vertu comme moyenne entre deux
        extrêmes.
    points:
      - id: m5-l1-p1
        sentence: __Kant définit__ la vertu comme **la force morale de la volonté d'un être humain** à remplir son ___.
        answer: devoir
        explanation: "MM 6:405."
      - id: m5-l1-p2
        sentence: __Kant définit le vice comme__ l'**immoralité** par ___.
        answer: principe
        explanation: "MM 6:390."
      - id: m5-l1-p3
        sentence: "**À la différence d'Aristote**, Kant ne part pas d'une conception du bon caractère pour en tirer des conclusions sur l'action à mener ; il établit d'abord les principes de la conduite morale, __la vertu chez lui présupposant donc déjà une théorie du__ ___."
        answer: devoir
      - id: m5-l1-p4
        sentence: La vertu, chez Kant, est une **force de la volonté**, __non une disposition affective qu'on acquerrait comme une seconde nature par__ ___.
        answer: habituation
      - id: m5-l1-p5
        sentence: Parce qu'elle consiste à **surmonter des obstacles tenus pour des traits ineffaçables de la nature humaine**, la vertu kantienne __est plus proche de ce qu'Aristote aurait appelé un trait moindre, la continence ou la__ ___.
        answer: maîtrise de soi
      - id: m5-l1-p6
        sentence: __Kant rejette l'idée aristotélicienne selon laquelle la vertu serait un juste__ ___ entre deux vices, **qui ne différeraient d'elle que par degré**.
        answer: milieu
      - id: m5-l1-p7
        sentence: "Selon Kant, la prodigalité et l'avarice ne diffèrent pas par un excès ou un défaut de largesse, mais par **le principe qui les anime** : le prodigue acquiert des moyens dans la seule intention d'en jouir, __l'avare dans la seule intention de les__ ___."
        answer: posséder

  - id: m5-l2
    title: Vertu, bonne volonté et vertus particulières
    notes: |
      Kant ajoute au contraste avec Aristote deux précisions supplémentaires.

      - {coral}Puisque la vertu morale, chez Kant, est un trait fondé sur un{/coral}
        {coral}principe moral{/coral}, la frontière entre {violet}**vertus morales**{/violet} et {violet}**vertus non{/violet}
        {violet}morales**{/violet} est __nette__, alors que les théories classiques traitent
        volontiers l'esprit ou l'amabilité aux côtés de la générosité ou de
        la justice, sans hiérarchie de principe.
      - La vertu ne peut être un trait d'êtres __divins__, puisqu'elle
        consiste précisément dans le {violet}**pouvoir de surmonter des obstacles**{/violet} qui,
        chez de tels êtres, ne se présenteraient pas.

      Kant distingue par ailleurs la {violet}**vertu**{/violet}, force générale de la volonté
      à faire son devoir, de la {violet}**bonne volonté**{/violet}, et tient les deux pour
      {green}__compatibles mais distinctes__{/green} : on peut avoir une bonne volonté,
      pleinement attachée au devoir pour lui-même, sans jamais rencontrer
      d'obstacle suffisant pour révéler qu'on manque de la force nécessaire à
      le surmonter, et donc sans posséder à proprement parler la vertu.
      Kant tient cependant qu'une action n'a de valeur morale authentique que
      si elle procède d'une {violet}**pureté de motivation**{/violet} atteinte seulement par une
      __révolution__ permanente et quasi religieuse de l'orientation de la
      volonté ; tant que cette révolution n'a pas eu lieu, les actions
      conformes au devoir {red}restent, quoi qu'on en dise par ailleurs,{/red}
      {red}moralement sans valeur{/red}.

      Parmi les {violet}**vertus particulières**{/violet} que Kant discute figurent {amber}le respect de{/amber}
      {amber}soi, l'honnêteté, la frugalité, le perfectionnement de soi, la{/amber}
      {amber}bienfaisance, la gratitude, la sociabilité et le pardon{/amber} ; parmi les
      {violet}**vices particuliers**{/violet}, {amber}la malice, la cupidité, la paresse, l'envie, la{/amber}
      {amber}servilité, le mépris et l'arrogance{/amber}.
    points:
      - id: m5-l2-p1
        sentence: Puisque la vertu morale, chez Kant, est **fondée sur un principe moral**, __la frontière entre vertus morales et vertus non morales est__ ___, alors que les théories classiques traitent volontiers l'esprit ou l'amabilité aux côtés de la générosité ou de la justice.
        answer: nette
      - id: m5-l2-p2
        sentence: "**La vertu ne peut être, pour Kant, un trait d'êtres divins**, puisqu'elle consiste précisément dans le pouvoir de surmonter des obstacles __qui, chez de tels êtres, ne se__ ___ pas."
        answer: présenteraient
      - id: m5-l2-p3
        sentence: On peut avoir, selon Kant, une **bonne volonté** pleinement attachée au devoir pour lui-même sans jamais rencontrer d'obstacle suffisant pour révéler qu'on manque de la force nécessaire à le surmonter, __et donc sans posséder à proprement parler la__ ___.
        answer: vertu
      - id: m5-l2-p4
        sentence: Une action n'a de valeur morale authentique, selon Kant, que si elle procède d'une **pureté de motivation** __atteinte seulement par une__ ___ permanente et quasi religieuse de l'orientation de la volonté.
        answer: révolution
      - id: m5-l2-p5
        sentence: Tant que **cette révolution de l'orientation de la volonté** n'a pas eu lieu, __les actions conformes au devoir restent, selon Kant, moralement sans__ ___.
        answer: valeur
      - id: m5-l2-p6
        sentence: Parmi les **vertus particulières** que Kant discute figurent le respect de soi, l'honnêteté, la frugalité, la bienfaisance, __la gratitude, la sociabilité et le__ ___.
        answer: pardon

  - id: m5-l3
    title: Droit et vertu, les deux principes subsidiaires de l'impératif catégorique
    notes: |
      Dans ses écrits ultérieurs, en particulier la {sky}Métaphysique des mœurs{/sky},
      Kant développe une théorie éthique normative complète pour appliquer
      l'impératif catégorique aux personnes humaines ordinaires. Il distingue
      à cette fin deux {violet}**principes subsidiaires**{/violet}.

      - Le {violet}**Principe universel du droit**{/violet}, qui gouverne les questions de
        justice, de droits et d'actes extérieurs susceptibles d'être imposés
        par la contrainte, énonce qu'{green}une action est juste si elle peut{/green}
        {green}__coexister__ avec la liberté de chacun selon une loi universelle{/green}.
      - Le {violet}**Principe suprême de la doctrine de la vertu**{/violet}, qui gouverne les
        fins, attitudes et traits de caractère moraux, exige d'agir selon
        une maxime de fins qui puisse être une __loi universelle__ pour tous.

      Ces deux principes fondent à leur tour des devoirs plus spécifiques,
      de droit d'une part, d'éthique et de vertu d'autre part. Les {violet}**devoirs{/violet}
      {violet}de droit**{/violet} sont __étroits et parfaits__, {coral}parce qu'ils exigent ou interdisent{/coral}
      {coral}un acte précis{/coral} : {yellow}ainsi l'interdiction de voler{/yellow} ; les {violet}**devoirs d'éthique{/violet}
      {violet}et de vertu**{/violet} sont __larges et imparfaits__, {coral}parce qu'ils laissent une{/coral}
      {coral}latitude dans la façon de s'en acquitter{/coral} : {yellow}ainsi le devoir de{/yellow}
      {yellow}bienfaisance, qui ne précise pas exactement quelle assistance apporter{/yellow}.

      ! Même muni d'un système de devoirs, Kant reconnaît que {amber}le{/amber}
        {amber}__jugement__ reste nécessaire pour déterminer comment ces devoirs{/amber}
        {amber}s'appliquent à des circonstances particulières{/amber} : les lois morales
        {teal}« {/teal}doivent être {teal}scrupuleusement observées »{/teal}, mais ne peuvent avoir
        égard à chaque petite circonstance.
    points:
      - id: m5-l3-p1
        sentence: Le **Principe universel du droit**, qui gouverne les questions de justice, de droits et d'actes extérieurs susceptibles d'être imposés par la contrainte, __énonce qu'une action est juste si elle peut coexister avec la liberté de chacun selon une loi__ ___.
        answer: universelle
        explanation: "MM 6:230."
      - id: m5-l3-p2
        sentence: Le **Principe suprême de la doctrine de la vertu**, qui gouverne les fins, attitudes et traits de caractère moraux, __exige d'agir selon une maxime de fins qui puisse être une loi universelle pour__ ___.
        answer: tous
        explanation: "MM 6:395."
      - id: m5-l3-p3
        sentence: Les **devoirs de droit**, comme l'interdiction de voler, __sont dits étroits et__ ___ parce qu'ils exigent ou interdisent un acte précis.
        answer: parfaits
      - id: m5-l3-p4
        sentence: Les **devoirs d'éthique et de vertu**, comme la bienfaisance, __sont dits larges et__ ___ parce qu'ils laissent une latitude dans la façon de s'en acquitter.
        answer: imparfaits
      - id: m5-l3-p5
        sentence: "**Même muni d'un système de devoirs**, Kant reconnaît que le ___ __reste nécessaire pour déterminer comment ces devoirs s'appliquent à des circonstances particulières__."
        answer: jugement

  - id: m5-l4
    title: Kant est-il déontologiste ?
    notes: |
      La lecture reçue tient Kant pour un __déontologiste__, en ce sens
      précis qu'il nierait que le juste et l'injuste soient fonction du bon
      ou du mauvais : thèse centrale des théories morales __téléologiques__.
      Le conséquentialisme des actes, pour qui l'action juste est celle qui
      produit le meilleur résultat global, et l'éthique de la vertu, pour qui
      l'action juste est l'action vertueuse, sont deux théories
      {violet}téléologiques{/violet} : dans les deux cas, la {violet}**bonté**{/violet} fonde la {violet}**justesse**{/violet}.

      {amber}Deux types de raisons soutiennent la lecture{/amber} {violet}déontologiste{/violet}.

      - De nombreuses déclarations de Kant sur les fins et les traits de
        caractère semblent rejeter les deux formes de {violet}téléologie{/violet} : il
        affirme ainsi que les fins visées par une action et ses effets ne
        peuvent lui conférer aucune valeur morale __inconditionnée__, laquelle
        ne se trouve que dans le {violet}**principe de la volonté**{/violet} ; il affirme aussi
        que même les vertus traditionnelles comme le courage ou la
        modération ne possèdent qu'une valeur __conditionnelle__.
      - Des arguments plus théoriques, dans les {sky}*Fondements*{/sky} comme dans la
        {sky}seconde Critique{/sky}, tiennent à l'insistance de Kant sur l'{violet}**autonomie**{/violet}
        de la volonté rationnelle : {coral}si la loi qui détermine le bien et le mal{/coral}
        {coral}se trouvait ailleurs que dans l'aptitude des maximes à valoir comme{/coral}
        {coral}législation universelle, il en résulterait toujours de{/coral}
        {coral}l'**hétéronomie**{/coral}. Dans la {sky}seconde Critique{/sky}, Kant va jusqu'à
        soutenir que le concept de bien et de mal ne doit pas être déterminé
        __avant__ la loi morale, mais seulement après elle et par son moyen.
    points:
      - id: m5-l4-p1
        sentence: "Kant est classé comme **déontologiste**, dans la lecture reçue, __précisément parce qu'il nierait que le juste et l'injuste soient fonction de la bonté ou de la méchanceté__ : thèse centrale des théories morales dites ___."
        answer: téléologiques
      - id: m5-l4-p2
        sentence: Le **conséquentialisme des actes et l'éthique de la vertu** sont tous deux des théories téléologiques, __parce que dans les deux cas c'est la__ ___ qui fonde la justesse de l'action.
        answer: bonté
      - id: m5-l4-p3
        sentence: Kant affirme que **les fins visées par une action et ses effets** __ne peuvent lui conférer aucune valeur morale__ ___, laquelle ne se trouve que dans le principe de la volonté.
        answer: inconditionnée
        explanation: "G 4:400."
      - id: m5-l4-p4
        sentence: Kant affirme également que **même les vertus traditionnelles comme le courage ou la modération** __ne possèdent qu'une valeur__ ___.
        answer: conditionnelle
      - id: m5-l4-p5
        sentence: "Kant écrit que si la volonté cherche la loi qui doit la déterminer **ailleurs que dans l'aptitude de ses maximes à sa propre législation universelle**, __il en résulte toujours de__ l'___."
        answer: hétéronomie
        explanation: "G 4:441."
      - id: m5-l4-p6
        sentence: Dans la seconde Critique, Kant soutient que le concept de bien et de mal **ne doit pas être déterminé avant la loi morale**, __mais seulement__ ___ elle et par son moyen.
        answer: après
        explanation: "CPrR 5:63."

  - id: m5-l5
    title: Les lectures téléologiques concurrentes
    notes: |
      Plusieurs lecteurs de Kant contestent la lecture déontologiste reçue.

      - Le premier à suggérer une lecture téléologique de Kant fut, selon
        certains, {sky}__Mill__{/sky}, qui laisse entendre, dans le premier chapitre de
        son Utilitarisme, que la formule de la loi universelle ne peut
        raisonnablement s'interpréter que comme un {coral}**test portant sur les{/coral}
        {coral}conséquences** de l'adoption universelle d'une maxime{/coral}.
      - {sky}__Hare__{/sky} soutient que des jugements moraux comme {teal}« {/teal}voler {teal}est mal »{/teal}
        sont en réalité des {violet}__prescriptions universelles__{/violet}, qui interdisent
        toute exception et exigent donc d'accorder un {violet}**poids égal**{/violet} au bien-être
        de chacun, ce qui revient, selon lui, à agir pour produire le
        {coral}meilleur résultat global{/coral} : l'impératif catégorique serait ainsi,
        selon son mot, {teal}« {/teal}simplement de l'utilitarisme {teal}dit autrement »{/teal}.
      - {sky}__Cummiskey__{/sky} soutient que si les principes moraux sont justifiés
        parce qu'universalisables, ils doivent être eux-mêmes
        {violet}__conséquentialistes__{/violet} : le respect de la {violet}**valeur de l'humanité**{/violet}
        exigerait de compter l'intérêt de chacun pour un et un seul, et donc
        d'agir toujours pour produire le {green}meilleur résultat global{/green}.

      ! {red}Aucun de ces trois lecteurs ne prétend restituer fidèlement{/red}
        {red}l'intention de Kant lui-même{/red} : chacun tire du texte kantien, par un
        chemin différent, une conclusion que Kant présente pourtant comme
        s'opposant frontalement au {red}conséquentialisme des actes{/red}.
    points:
      - id: m5-l5-p1
        sentence: __Le premier philosophe à avoir suggéré une lecture téléologique de Kant fut, selon certains commentateurs,__ ___, qui y voit dans son Utilitarisme un **test portant sur les conséquences** de l'adoption universelle d'une maxime.
        answer: Mill
      - id: m5-l5-p2
        sentence: "__Le commentateur__ ___ soutient que des jugements moraux comme « voler est mal » sont en réalité des **prescriptions universelles**, qui interdisent toute exception et exigent donc d'accorder un poids égal au bien-être de chacun."
        answer: Hare
      - id: m5-l5-p3
        sentence: "Selon Hare, accorder un **poids égal au bien-être de chacun** revient à agir pour produire le meilleur résultat global, si bien que __l'impératif catégorique serait, selon son mot, « simplement de__ l'___ dit autrement »."
        answer: utilitarisme
      - id: m5-l5-p4
        sentence: __Le commentateur__ ___ soutient que si les principes moraux sont justifiés parce qu'universalisables, **ils doivent être eux-mêmes conséquentialistes**.
        answer: Cummiskey
      - id: m5-l5-p5
        sentence: Selon Cummiskey, le respect de la valeur de l'humanité exige de **compter l'intérêt de chacun pour un et un seul**, __et donc d'agir toujours pour produire le meilleur résultat__ ___.
        answer: global

  - id: m5-l6
    title: Les lectures téléologiques non conséquentialistes
    notes: |
      D'autres lectures téléologiques de Kant, sans être conséquentialistes,
      {amber}font toutes dépendre la justesse d'une action d'une __valeur__ qui la{/amber}
      {amber}fonde{/amber}.

      - {sky}__Herman__{/sky} invite à {teal}« {/teal}laisser la déontologie {teal}derrière soi »{/teal} : selon
        elle, Kant n'a jamais voulu dire qu'aucune valeur ne fonde les
        principes moraux (ce qui priverait de toute raison de s'y
        conformer), mais soutient que l'{violet}**agentivité rationnelle**{/violet} constituée
        par les principes de la rationalité fonctionne elle-même comme une
        valeur qui justifie l'action morale.
      - {sky}__Guyer__{/sky} soutient que c'est l'{violet}**autonomie**{/violet} elle-même qui constitue
        la valeur fondant les exigences morales : la pensée morale consiste à
        reconnaître la valeur inestimable de la volonté autonome d'un agent
        rationnel.
      - {sky}__Wood__{/sky} soutient que c'est l'{violet}**humanité**{/violet} elle-même qui constitue
        cette {violet}**valeur fondatrice**{/violet} : {coral}les choses bonnes doivent leur valeur au{/coral}
        {coral}fait d'être choisies par des agents rationnels, mais ce choix{/coral}
        {coral}lui-même n'aurait aucune valeur si sa source, l'agentivité{/coral}
        {coral}rationnelle, n'en avait aucune{/coral}.
      - {sky}__Langton__{/sky} soutient que, pour que la théorie de Kant demeure
        {violet}**objectiviste**{/violet}, la valeur de l'humanité et de la bonne volonté doit
        être __indépendante__ du fait d'être simplement choisie par nous.
      - {sky}__Darwall__{/sky} soutient que l'{violet}**obligation morale**{/violet} n'est, chez Kant, que
        {teal}« {/teal}l'ombre que projettent, pour des agents rationnels imparfaits, les
        actions bonnes ou {teal}fondées en raison »{/teal}, ce qui exclut que le juste
        puisse fournir une source de raisons indépendante du bon.
    points:
      - id: m5-l6-p1
        sentence: "__La commentatrice__ ___ invite à « **laisser la déontologie derrière soi** », en soutenant que l'agentivité rationnelle constituée par les principes de la rationalité fonctionne elle-même comme une valeur qui justifie l'action morale."
        answer: Herman
      - id: m5-l6-p2
        sentence: __Le commentateur__ ___ soutient que c'est **l'autonomie elle-même** qui constitue la valeur fondant les exigences morales chez Kant.
        answer: Guyer
      - id: m5-l6-p3
        sentence: __Le commentateur__ ___ soutient que c'est **l'humanité elle-même**, plutôt que l'autonomie, qui constitue la valeur fondant les exigences morales.
        answer: Wood
      - id: m5-l6-p4
        sentence: __La commentatrice__ ___ soutient que, pour que la théorie de Kant demeure **objectiviste**, la valeur de l'humanité et de la bonne volonté doit être indépendante du fait d'être simplement choisie par nous.
        answer: Langton
      - id: m5-l6-p5
        sentence: "__Le commentateur__ ___ soutient que **l'obligation morale** n'est, chez Kant, que l'ombre que projettent, pour des agents rationnels imparfaits, les actions bonnes ou fondées en raison."
        answer: Darwall
      - id: m5-l6-p6
        sentence: À la différence de Herman, Guyer et Wood, qui désignent respectivement l'agentivité rationnelle, l'autonomie et l'humanité comme **valeur fondatrice**, __Langton insiste sur l'exigence que cette valeur soit__ ___ de nos choix.
        answer: indépendante

  - id: m5-l7
    title: Métaéthique, vérifonctionnalité, réalisme et constructivisme
    notes: |
      La question de savoir si la philosophie morale de Kant est
      {violet}__réaliste__{/violet}, {violet}__anti-réaliste__{/violet} ou {violet}__constructiviste__{/violet} divise ses
      interprètes.

      Une première question est de savoir si les jugements moraux sont, pour
      Kant, {violet}__vérifonctionnels__{/violet} (aptes au vrai et au faux). À première vue
      non, puisque l'impératif catégorique est un impératif, et qu'un
      impératif comme {yellow}« laisse le pistolet, prends les cannolis »{/yellow} {coral}n'est ni{/coral}
      {coral}vrai ni faux{/coral}. Mais un jugement moral particulier comme {teal}« {/teal}mentir est mal »
      s'analyse plutôt comme « l'impératif catégorique nous commande de ne
      {teal}pas mentir »{/teal} : un __rapport__ sur un impératif, qui, lui, est
      vérifonctionnel. {sky}__Hare__{/sky} soutient au contraire que les jugements
      moraux kantiens sont des __prescriptions__, non des descriptions,
      l'objectivité morale se ramenant chez Kant, comme chez lui, à
      l'universalité.

      Une seconde question porte sur le {violet}**constructivisme**{/violet} métaéthique,
      thèse selon laquelle les vérités morales sont, ou sont déterminées par,
      l'issue de procédures (réelles ou hypothétiques) de délibération ou
      de choix.
      - De nombreux interprètes, dont {sky}__Rawls__{/sky} et {sky}__Korsgaard__{/sky}, lisent chez
        Kant un {violet}constructivisme{/violet} fondé sur l'{violet}**autonomie**{/violet} de la volonté : les
        agents liés par des exigences morales sont à la fois {violet}**auteurs et{/violet}
        {violet}sujets de la loi morale**{/violet}, et ne sont soumis à aucune exigence
        extérieure à leur propre volonté.
      - D'autres interprètes, dont {sky}__Wood__{/sky} et {sky}__Ameriks__{/sky}, défendent au
        contraire une lecture __réaliste__ robuste, selon laquelle la nature
        rationnelle est une {violet}**valeur objective**{/violet}, indépendante de l'exercice de
        notre volonté, et la loi morale se contente d'en spécifier le
        traitement approprié.
      - {sky}__Korsgaard__{/sky} défend enfin une forme de __quiétisme__ métaéthique, en
        récusant l'idée même qu'il faille ancrer nos conceptions morales dans
        des faits ou des propriétés existant indépendamment d'une {violet}**procédure{/violet}
        {violet}de délibération acceptable**{/violet}.
    points:
      - id: m5-l7-p1
        sentence: "Un impératif comme « laisse le pistolet, prends les cannolis » n'est, à première vue, **ni vrai ni faux**, __ce qui suggère que l'impératif catégorique lui-même n'est pas__ ___."
        answer: vérifonctionnel
      - id: m5-l7-p2
        sentence: "Un jugement moral particulier comme « mentir est mal » peut cependant s'analyser comme un **rapport sur l'impératif catégorique**, __du type « l'impératif catégorique nous commande de ne pas__ ___ », rapport qui, lui, est vérifonctionnel."
        answer: mentir
      - id: m5-l7-p3
        sentence: __Le commentateur__ ___ soutient au contraire que les jugements moraux kantiens sont des **prescriptions et non des descriptions**, l'objectivité morale se ramenant, chez Kant comme chez lui, à l'universalité.
        answer: Hare
      - id: m5-l7-p4
        sentence: Le **constructivisme métaéthique** est la thèse selon laquelle les vérités morales sont, ou sont déterminées par, __l'issue de procédures de délibération ou de__ ___.
        answer: choix
      - id: m5-l7-p5
        sentence: __Les commentateurs Rawls et__ ___ lisent chez Kant un **constructivisme fondé sur l'autonomie de la volonté**, les agents liés par des exigences morales étant à la fois auteurs et sujets de la loi morale.
        answer: Korsgaard
      - id: m5-l7-p6
        sentence: __Les commentateurs Wood et__ ___ défendent au contraire une **lecture réaliste robuste**, selon laquelle la nature rationnelle est une valeur objective, indépendante de l'exercice de notre volonté.
        answer: Ameriks
      - id: m5-l7-p7
        sentence: Le commentateur **Korsgaard** défend enfin, au-delà du seul constructivisme, __une forme de__ ___ métaéthique, en récusant l'idée même qu'il faille ancrer nos conceptions morales dans des faits ou des propriétés indépendants de toute procédure.
        answer: quiétisme

  - id: m5-l8
    title: L'éthique kantienne de l'intelligence artificielle
    notes: |
      Kant n'a naturellement jamais envisagé l'intelligence artificielle,
      mais sa philosophie morale offre des ressources pour penser les
      questions qu'elle soulève. Une personne morale __compétente__, chez
      Kant, doit se concevoir elle-même comme {violet}**libre**{/violet} au sens d'être capable
      d'engendrer et d'auteur ses propres choix sans être déterminée par rien
      d'extérieur ni d'intérieur à elle-même ; elle doit posséder des
      {violet}**pouvoirs de raison**{/violet} lui permettant de reconnaître l'autorité d'exigences
      rationnelles inconditionnées ; elle doit enfin être __autonome__ :
      légiférer elle-même les normes morales qu'elle s'impose, et se
      gouverner entièrement par sa propre raison, indépendamment de ses
      désirs ou de ses objectifs. D'un point de vue kantien, {red}rien n'indique{/red}
      {red}que nous approchions de la création d'une telle personne morale{/red}
      {red}artificielle{/red}.

      {amber}**Cinq thèmes kantiens**{/amber} peuvent néanmoins guider notre réflexion sur
      l'IA, qui elle-même ne peut, chez Kant, être tenue pour vertueuse,
      vicieuse ou moralement responsable, ces notions ne s'appliquant qu'aux
      agents moraux compétents.

      - La {violet}**complicité**{/violet} : nos responsabilités incluent d'éviter de
        contribuer, par nos données, notre expertise ou nos financements, aux
        projets immoraux d'autrui, {yellow}comme des systèmes de surveillance ou de{/yellow}
        {yellow}manipulation{/yellow}.
      - Les {violet}**intentions**{/violet} : nos intentions en concevant ou utilisant l'IA
        comptent moralement, indépendamment de ce que l'IA elle-même est
        capable de vouloir.
      - La signification __expressive ou symbolique__ de nos actions,
        indépendamment de leurs effets : une IA qui déforme certains noms
        propres peut exprimer que certaines personnes méritent moins de
        reconnaissance que d'autres.
      - Les __effets__ de nos actions, et non leurs seules intentions,
        comptent moralement : {yellow}des systèmes qui suppriment des emplois sans{/yellow}
        {yellow}offrir de reconversion{/yellow} peuvent éroder les {violet}**capacités**{/violet} et l'{violet}**estime de{/violet}
        {violet}soi**{/violet} des personnes concernées.
      - Le caractère __hiérarchique et inachevé__ du système moral kantien :
        l'impératif catégorique fonde des {violet}**principes de niveau intermédiaire**{/violet},
        concernant par exemple le mensonge ou la manipulation, qu'il reste à
        préciser et à appliquer à des cas nouveaux comme l'IA.
    points:
      - id: m5-l8-p1
        sentence: Pour être une **personne morale compétente** au sens kantien, un agent doit se concevoir lui-même comme libre, posséder des pouvoirs de raison, __et être__ ___, c'est-à-dire légiférer lui-même les normes morales qu'il s'impose.
        answer: autonome
      - id: m5-l8-p2
        sentence: "**D'un point de vue kantien**, __rien n'indique aujourd'hui que nous approchions de la création d'une personne morale artificielle__ ___."
        answer: compétente
      - id: m5-l8-p3
        sentence: Parce que les notions de vertu, de vice et de responsabilité morale ne s'appliquent, chez Kant, qu'aux **agents moraux compétents**, __une IA ne peut, d'un point de vue kantien, être tenue pour vertueuse, vicieuse ou moralement__ ___.
        answer: responsable
      - id: m5-l8-p4
        sentence: "**Le premier des cinq thèmes** kantiens pour penser l'IA est celui de la ___ : __nos responsabilités incluent d'éviter de contribuer, par nos données ou nos financements, aux projets immoraux d'autrui__."
        answer: complicité
      - id: m5-l8-p5
        sentence: "**Le deuxième des cinq thèmes** kantiens pour penser l'IA est celui des ___ : __nos intentions en concevant ou en utilisant l'IA comptent moralement__, indépendamment de ce que l'IA elle-même est capable de vouloir."
        answer: intentions
      - id: m5-l8-p6
        sentence: __Le troisième des cinq thèmes kantiens pour penser l'IA est celui de la **signification expressive** ou__ ___ de nos actions, indépendamment de leurs effets, comme lorsqu'une IA qui déforme certains noms propres exprime que certaines personnes méritent moins de reconnaissance que d'autres.
        answer: symbolique
      - id: m5-l8-p7
        sentence: "**Le quatrième des cinq thèmes** kantiens pour penser l'IA est celui des ___ de nos actions, __qui comptent moralement au même titre que nos intentions__, comme lorsque des systèmes suppriment des emplois sans offrir de reconversion."
        answer: effets
      - id: m5-l8-p8
        sentence: "**Le cinquième des cinq thèmes** kantiens pour penser l'IA est celui __du caractère hiérarchique et__ ___ du système moral kantien, l'impératif catégorique fondant des principes de niveau intermédiaire qu'il reste à préciser pour des cas nouveaux comme l'IA."
        answer: inachevé
