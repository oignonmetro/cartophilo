  - id: theta2-l1
    title: "Θ6 : être en puissance, et pourquoi l'analogie"
    notes: |-
      **Θ6 (1048a25-1048b35) commence par trois exemples de ce qu'est être « en puissance » (1048a30-35) : Hermès dans le bois, la demi-ligne dans la ligne entière, et celui qui n'étudie pas mais pourrait étudier, qu'on dit savant.** Les deux premiers ont la même structure : une chose est dans une autre et pourrait en être extraite (on sculpte le bois pour obtenir un Hermès, on divise la ligne). Le troisième oppose celui qui peut contempler et celui qui contemple. Ce passage éclaire peu, selon Makin : il ne montre qu'un côté de la distinction, et l'adverbe « en puissance » est presque absent de Θ1-5. L'analogie qui suit répare ces deux défauts.

      **Il ne faut pas chercher une définition de tout : on saisit l'acte par l'induction et l'analogie.** Aristote ne dit pas pourquoi, et les commentateurs divergent :

      | Commentateur | Pourquoi l'acte et la puissance ne se définissent pas |
      | {teal}Thomas d'Aquin{/teal} | ce sont des notions simples, donc indéfinissables |
      | {coral}Ross{/coral} | ce sont des notions de métaphysique, qui traite de l'être en général ; or l'être n'est pas un genre, et définir, c'est donner genre et différence |

      **Makin distingue l'induction et l'analogie.** Quand le même rapport se retrouve dans tous les cas (vingt est à dix ce que cinquante est à vingt-cinq : le double), des exemples faciles éclairent les difficiles : c'est l'induction. L'analogie est requise quand le rapport entre les rapports n'est pas l'identité : c'est le cas ici, où les exemples illustrent deux rapports différents.

      ! L'analogie n'est pas une métaphore : c'est une proportion rigoureuse (A est à B ce que C est à D) entre des genres différents.
    points:
      - id: theta2-l1-p1
        sentence: "Premier exemple de Θ6 (1048a30-35) de ce qu'est être en puissance : ___ dans le bois, qu'on obtient en le sculptant."
        answer: "Hermès"
        alt: []
      - id: theta2-l1-p2
        sentence: "Deuxième exemple de Θ6 de ce qu'est être en puissance : la ___ dans la ligne entière, qu'on obtient en la divisant."
        answer: "demi-ligne"
        alt: []
      - id: theta2-l1-p3
