        answer: "savant"
        alt: []
      - id: theta2-l1-p4
        sentence: "Selon Makin, le premier groupe d'exemples de Θ6 éclaire peu : il ne montre qu'un côté de la distinction, et l'adverbe « en puissance » est presque ___ de Θ1-5."
        answer: "absent"
        alt: []
      - id: theta2-l1-p5
        sentence: "Dans les cas particuliers, ce que nous voulons dire est clair par l'___, et il ne faut pas chercher une définition de tout (Θ6, 1048a35-37)."
        answer: "induction"
        alt: []
