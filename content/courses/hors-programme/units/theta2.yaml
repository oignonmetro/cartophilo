  - id: theta2-l4
    title: "Θ6 : le mouvement et l'acte"
    notes: |-
      **Il y a deux sortes d'actions : les {coral}mouvements{/coral} (`kinêseis`), qui visent une fin extérieure et ne l'ont pas encore atteinte tant qu'ils se déroulent, et les {teal}actes{/teal} (`energeiai`), qui ont leur fin en eux-mêmes (1048b18-35).** L'amaigrissement (`ischnasia`) ou la construction d'une maison ont une limite et visent un état qui n'est pas encore là : le mouvement est inachevé (`atelês`). Voir, penser, vivre bien, être heureux sont achevés dès qu'ils s'exercent ; sinon il faudrait qu'ils s'arrêtent un jour, comme quand on maigrit.

      **Le critère est linguistique : le rapport du présent et du parfait.**

      | | Présent et parfait | Exemples |
      | mouvement | s'excluent : si j'apprends, je n'ai pas encore appris | apprendre, guérir, bâtir, marcher |
      | acte | vont ensemble : « on voit en même temps qu'on a vu » | voir, être sage, penser, vivre bien, être heureux |

      **Makin distingue trois composantes** : une distinction métaphysique (structure achevée ou inachevée), un indice linguistique et des exemples. Il lit le critère comme une équivalence : on voit si et seulement si on a vu (« c'est la même chose qui a vu en même temps qu'elle voit », 1048b33). La marche fait difficulté : on dit à la fois qu'une personne marche et qu'elle a marché. Réponse possible d'Aristote : identifier le mouvement par ses points de départ et d'arrivée ; si l'on marche de la cuisine au portail, on n'a pas encore marché de la cuisine au portail (*Éthique à Nicomaque*, X, 4 ; *Physique*, VI, 1). Ce critère est un trait du grec : la thèse métaphysique n'en dépend pas.

      ! Le mouvement n'est pas l'absence d'acte : c'est un acte inachevé.
