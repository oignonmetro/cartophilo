  - id: theta2-l17
    title: "Θ9 : la priorité de l'acte dans la connaissance"
    notes: |-
      **Les conclusions de 1051a29-33 sont très elliptiques, l'une n'ayant pas de verbe.** Makin la complète par « découvert » : les constructions potentielles sont découvertes comme pertinentes pour une preuve quand on les actualise. « La puissance vient de l'acte » (1051a31) s'entend « au moyen de », non au sens de la génération de Θ8 (1049b24-25). C'est l'acte de pensée qui actualise la construction, non le savoir géométrique inexercé.

      | Lecture | L'acte singulier et la puissance |
      | {teal}Makin{/teal} | l'acte singulier est la construction actuelle, postérieure dans la génération à la figure où elle n'est qu'en puissance, mais antérieure du point de vue de la connaissance : je sais qu'elle est pertinente parce que je vois, sur la figure actualisée, qu'elle rend la raison évidente |
      | {coral}Ross{/coral} | la puissance de la construction présupposerait l'acte de pensée, mais précéderait l'actualité de la construction : l'opposition serait entre deux sortes d'actes |

      Le cas du géomètre est trompeur : contrairement au bâtisseur (fondations, murs, charpente), il n'y a pas de processus temporel ordonné ; le rapport entre construction en puissance et en acte est logique, et parler de découvrir et de faire n'est qu'une manière imagée de dire que la construction actuelle rend la preuve évidente.

      **Portée (Makin).** La mention de l'acte de pensée (`noêsis`, 1051a30) prépare Λ9 (1074b33-35), où l'activité du moteur immobile est de penser. Θ9 apporte aussi une nouvelle instance du rapport puissance et acte, sans changement. Elle répond à une objection : la figure qui rend la preuve claire n'est pas le triangle ; comment établirait-elle une propriété du triangle ? Comme en H6 pour la matière et la forme, ce sont les mêmes, l'un en puissance, l'autre en acte. Makin tient enfin Θ9 pour des matériaux apparentés, rassemblés sans être intégrés à l'argument (ses deux moitiés pourraient être inversées).

      ! La priorité épistémique de l'acte ne suppose aucun processus dans le temps.
