  - id: theta2-l8
    title: "Θ7 : « en bois » et la matière première"
    notes: |-
      **On ne dit pas que le coffret est bois, mais qu'il est « en bois » (`xulinos`), ni que le bois est terre, mais qu'il est « en terre » (`gêinos`) (1049a18-27).** On dit d'une chose F qu'elle est « en G » quand G est immédiatement au-dessous d'elle : chaque terme de la série est la matière immédiate du précédent, et c'est cette matière immédiate qui est en puissance la chose.

      | Chose | Ce qu'on en dit |
      | le coffret | « en bois » |
      | le bois | « en terre » |
      | la terre, si elle est faite d'air | « aérienne » |

      **S'il existe un terme pour lequel aucun G ne convient, il est le plus bas de la série, et la matière, immédiate ou médiate, de tous les autres : on l'appelle {teal}matière première{/teal} (`prôtê hylê`) de cette série.** Makin lit ce passage comme une remarque sur la structure logique de la série, non comme l'affirmation qu'il existe une matière première : il s'ouvre par une condition (« s'il y a un premier ») et ses exemples (terre, air, feu) sont illustratifs.

      **Le suffixe est un trait du grec qui confirme une thèse indépendante.** En Z7 (1033a5-23), Aristote tire de ce même idiome une autre leçon : il compense alors la pauvreté du langage, qui n'a pas de mot pour ce qui n'est pas un coffret et pousse à dire que le coffret vient du bois ; ici, l'idiome reflète la métaphysique de la puissance.

      ! La matière n'est pas un « ceci » (`tode ti`) déterminé : elle ne devient un individu que par la forme.
    points:
      - id: theta2-l8-p1
        sentence: "On ne dit pas que le coffret est bois, mais qu'il est « en bois », en grec ___ (Θ7, 1049a18-27)."
        answer: "xulinos"
        alt: ["xylinos"]
