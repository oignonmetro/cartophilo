  - id: theta2-l6
    title: "Θ7 : quand une chose est-elle en puissance ?"
    notes: |-
      **Une chose n'est pas en puissance n'importe quand : la terre n'est pas un être humain en puissance (1048b37-1049a2).** Θ7 (1048b37-1049b2) ne demande pas comment une capacité est en puissance par rapport à son exercice, mais à quelles conditions une matière est en puissance une substance.

      **Pour les produits de la pensée (1049a5-11)**, une matière est en puissance F quand, si l'agent le veut, elle devient F sans empêchement extérieur, et, du côté de ce qu'on guérit ou des matériaux, sans empêchement interne : rien à ajouter, à ôter ni à changer. Un tas de terre n'est pas une maison en puissance. C'est ce qui, « par une pensée, vient à être en état accompli » à partir d'un être en puissance (1049a5-7) : le terme `entelecheia`, rare dans Θ, paraît ici.

      **Aristote écarte deux réponses plus libérales (Makin).**

      | Conception écartée | A serait en puissance F dès que... | Conséquence absurde |
      | la plus permissive | il est possible d'obtenir un F à partir de A, au sens du critère de Θ3 | un œuf fécondé serait en puissance un fœtus déformé, non viable |
      | un peu plus discriminante | il y a un chemin causal, si long soit-il, de A à un F, en conditions normales | des cellules seraient en puissance de la tourbe, par des graines, de la mousse, sa mort et sa compression |

      Il peut les écarter par décision, puisqu'il veut éclairer la matière immédiate, et parce que plus on admet de précurseurs lointains, moins la notion discrimine, et moins elle servira à la métaphysique.

      ! Tout ce qui peut un jour devenir une chose n'est pas déjà cette chose en puissance : une possibilité éloignée n'est pas une puissance.
