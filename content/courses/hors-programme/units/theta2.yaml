  - id: theta2-l15
    title: "Θ9 : le mal, postérieur à la puissance"
    notes: |-
      **Le mal n'existe pas « en dehors des réalités » (1051a17-18), et il est par nature postérieur à la puissance (1051a18-19).** Il n'y a donc pas de mal, ni de défaut, ni de corruption dans les réalités éternelles (1051a19-21).

      **La lecture de Makin.** Il écarte l'idée qu'Aristote viserait une Forme platonicienne du Mal : il aurait pu en dire autant du bien, et la seconde affirmation ne porte que sur le mal. Les bons résultats d'une puissance réalisent une forme commune, le bien vers lequel elle est dirigée (la santé) ; les mauvais n'ont aucune forme commune, seulement leur variété. Le chapitre n'emploie pas le mot « privation ». La forme visée est ce que la puissance produit en conditions normales, de sorte qu'elle est première par la substance (Θ8) ; les mauvais résultats naissent d'une interférence ou d'un empêchement (l'embryon fécondé qui, contaminé, ne devient pas un être humain), et sont donc postérieurs à la puissance.

      | Lecture | Ce que dit « postérieur à la puissance » |
      | {teal}Makin{/teal} | les mauvais résultats viennent d'une interférence ; mais la lecture échoue pour les puissances rationnelles à deux voies, où ils naissent en conditions normales du désir et du choix (le médecin pervers) |
      | {coral}Ross et Bonitz{/coral} | un glissement entre la postériorité en valeur (1051a15-17) et la postériorité en nature |

      Dans les réalités éternelles, il n'y a pas de puissance sujette à interférence : le mal ne peut y exister.

      ! La matière sublunaire n'est pas mauvaise en soi : elle est en puissance de la forme, qui est un bien.
