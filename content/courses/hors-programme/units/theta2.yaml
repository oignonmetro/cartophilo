  - id: theta2-l11
    title: "Θ8 : la priorité selon le temps"
    notes: |-
      **Selon le temps, l'acte est à la fois postérieur et antérieur (1049b17-1050a3).** Pour un individu numériquement déterminé, la puissance précède : la semence, la matière, la capacité non exercée viennent avant l'acte. Mais pour l'espèce, un être en acte, identique par la forme mais non par le nombre, précède l'être en puissance dont il est issu : il faut un homme en acte pour qu'il y ait la semence, un musicien pour qu'on devienne musicien.

      **L'argument de l'apprentissage (1049b29-1050a3).** Pour devenir bâtisseur ou citharède, il faut bâtir ou jouer de la cithare : le point d'Aristote est la nécessité de l'exercice, non celle d'un maître (Makin). Comment accomplir l'acte d'un art qu'on n'a pas ? Aristote invoque la *Physique* (VI, 6) : ce qui est en train de devenir a déjà en partie devenu, et l'apprenti possède donc déjà, peut-être, une partie de l'art (1050a1-2). Makin juge cette réponse esquissée et moins convaincante que celle de l'*Éthique à Nicomaque* (II, 4), qui nie qu'il faille posséder l'art pour accomplir des actes conformes à l'art.

      **Ce que l'argument établit réellement (Makin).** Il s'appuie sur deux principes : tout ce qui devient devient quelque chose, à partir de quelque chose et par quelque chose ; ce qui est en acte devient à partir de ce qui est en puissance, par ce qui est en acte. Mais la chaîne remonte à l'infini : chaque F en acte est précédé d'un F en puissance, lui-même précédé d'un F en acte. Les relations purement temporelles y sont {coral}symétriques{/coral}, alors qu'une priorité significative est asymétrique. L'acte n'est privilégié que par une autre priorité, {teal}causale{/teal} : ce qui est déjà en acte produit la suite (1049b27 ; 1050b4-6). Cette remarque de 1050b4-6 ne vise sans doute pas le premier moteur de Λ6-7, car elle renvoie à 1049b17-29, qui ne le mentionne pas. Stratégie analogue en *Physique* (VIII, 7) : la translation est le changement premier dans le temps.

      ! Que la graine vienne avant l'arbre ne fait pas de la puissance le principe : un arbre en acte, de même forme, précède la graine.
