  - id: theta2-l12
    title: "Θ8 : la priorité selon la substance"
    notes: |-
      **Dans les êtres périssables, l'acte est antérieur selon la substance parce qu'il est leur {teal}forme{/teal} et leur {teal}fin{/teal} (1050a4-1050b6).** Ce qui est postérieur dans la génération est antérieur selon la forme et la substance : l'homme adulte possède déjà la forme que l'enfant n'a pas. Tout ce qui devient va vers une fin, et l'acte est cette fin : « ce n'est pas pour posséder la vue que les animaux voient, mais ils possèdent la vue pour voir » (1050a8-12). La matière est en puissance parce qu'elle peut aller vers la forme ; en acte, elle est dans la forme (1050a15-16).

      **Quand l'acte ne produit rien d'extérieur (voir, penser, vivre), il réside dans l'agent lui-même** ; quand il produit une œuvre, comme la maison, l'acte est dans ce qui est produit (1050a23-1050b2). Le mot `energeia` vient d'`ergon` (l'œuvre) et tend vers `entelecheia` (1050a21-23).

      **Le sens de cette priorité (Makin).** En Δ11, Aristote définit la priorité selon la substance par l'indépendance d'existence : F est antérieur à G s'il peut y avoir des F sans G, non l'inverse. Le critère s'accorde mal avec les exemples de Θ8 : un enfant peut exister sans jamais devenir adulte, et il n'y a pas d'adulte sans enfance. Makin le précise par la distinction, en Δ11 (1019a12-14), de la possibilité selon la génération et selon la destruction : si la génération suit son cours, elle aboutit à un adulte ; pour qu'il y ait des enfants sans adultes, il faut l'interrompre (infanticide, maladie). D'où l'insistance sur la finalité : seul un rapport orienté vers une fin permet de parler d'issue normale, d'interférence et d'obstacle, ce qui n'a pas de sens pour l'eau qui goutte des arbres.

