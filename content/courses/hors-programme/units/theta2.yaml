  - id: theta2-l16
    title: "Θ9 : découvrir en actualisant"
    notes: |-
      **En géométrie, on découvre ce qui est en puissance dans une figure en l'actualisant (1051a21-33).** Ce qui est en puissance dans un triangle, ce sont les constructions qu'on obtient en joignant des points ou en ajoutant des lignes, et qui rendent la preuve manifeste ; elles passent à l'acte quand on divise la figure. La division s'opère en pensée : le géomètre peut tracer une ligne au tableau, mais aussi dire « soit menée une parallèle », ou y penser dans son cabinet. L'acte de pensée est nécessaire et suffisant ; la figure dessinée n'aide qu'à comprendre ou à communiquer.

      | Exemple | La construction | La preuve (Makin) |
      | les angles d'un triangle valent deux droits (1051a24-26) | la parallèle au côté | chez Euclide (*Éléments*, I, 32), on prolonge la base et l'on mène par le sommet opposé une parallèle à un côté ; une autre preuve, peut-être pythagoricienne, mène la parallèle à la base |
      | l'angle inscrit dans un demi-cercle est droit (1051a26-29) | trois lignes égales : les deux moitiés de la base et la perpendiculaire élevée en son milieu | trois lectures : deux triangles isocèles issus du centre ; Euclide (*Éléments*, III, 31) ; une preuve indirecte (Ross, Heath), que favorise la mention de la perpendiculaire |

      La formule « pour qui connaît la proposition précédente » renvoie sans doute au théorème du premier exemple. Aristote conclut : « on découvre ce qui existe en puissance en l'actualisant », car « l'acte est une intellection » (1051a29-33).

      ! Les objets géométriques ne subissent aucun changement physique : tracer ou diviser une figure est un acte de pensée.
