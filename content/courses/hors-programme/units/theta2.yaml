  - id: theta2-l5
    title: "Θ6 : l'acte inachevé et le statut du passage"
    notes: |-
      **Le mouvement est bien une forme d'actualité, mais celle de l'inachevé : `energeia atelês`** (*Physique*, III, 2). La *Physique* (III, 1) le définit comme l'actualité de ce qui est en puissance en tant qu'il est en puissance. L'acte achevé, lui, ne conserve aucune incomplétude.

      Le *De l'âme* (II, 5, 417a21-417b6) **distingue deux passages de la puissance à l'acte** : l'un détruit la puissance par son contraire (l'eau froide qui devient chaude : une altération, `alloiôsis`) ; l'autre la conserve et l'accomplit (le savant qui se met à penser). Voir appartient au second, mais celui-ci regroupe aussi le bâtisseur formé qui se met à bâtir, qui est un mouvement : la distinction du *De l'âme* ne recouvre donc pas celle de Θ6 (Makin, contre Kosman).

      **Le statut textuel de 1048b18-35 est douteux.** La *Métaphysique* est parvenue par deux traditions manuscrites :

      | Tradition | Manuscrits | Le passage |
      | α | Vindobonensis J (IXe siècle), Parisinus E (Xe siècle) | absent |
      | β | Laurentianus Ab (XIIe siècle) | présent, mais un trait vertical traverse les lignes 28-35 |

      Le pseudo-Alexandre et Thomas d'Aquin ne l'avaient pas. Burnyeat y voit un matériau authentiquement aristotélicien, inséré comme note marginale puis incorporé au texte. La traduction française le maintient, et s'appuie sur lui pour défendre un membre de phrase de Θ8 (1050a12-14) que Jaeger et Ross, à la suite de Diels, condamnaient.

      **Makin juge la distinction peu décisive pour Θ**, dont les chapitres 7 et 8 se comprennent sans elle ; mais elle éclaire la théologie de Λ (6-9), où le premier moteur est un acte dont l'activité est une pensée qui se pense elle-même (`noêsis noêseôs`) : si cette pensée était un mouvement, elle serait inachevée.

      ! Le passage du savant au savoir exercé et l'acte achevé de Θ6 ne se recouvrent pas.
    points:
