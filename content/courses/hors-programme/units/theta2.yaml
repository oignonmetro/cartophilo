  - id: theta2-l14
    title: "Θ9 : l'acte bon et la puissance"
    notes: |-
      **Θ9 (1051a4-33) prolonge la priorité de l'acte vers la valeur et la connaissance.** Une même puissance est puissance des contraires : la même chose peut être saine et malade, en repos et en mouvement, bâtie et démolie (1051a5-11). Mais les contraires ne peuvent être en acte ensemble : on n'est pas en même temps sain et malade. L'un des deux est le bien, alors que la puissance est indifféremment les deux à la fois ou ni l'un ni l'autre : l'acte bon est donc meilleur que la puissance (1051a12-15), et, pour les choses mauvaises, l'acte est pire.

      **Makin souligne deux points.** Cette priorité de valeur est qualifiée : elle dépend du caractère bon ou mauvais de l'acte, et le texte n'énonce pas que l'acte est meilleur que la puissance tout court. Et le principe est très abstrait : il ne reprend pas la distinction rationnel et non rationnel de Θ2, et vise aussi les puissances passives. Ses exemples sont des puissances passives, plus une seule active et rationnelle (bâtir et démolir), ce qui évite tout conflit avec Θ2.

      | | Puissance | Acte |
      | rapport aux contraires | les deux à la fois, ou ni l'un ni l'autre | l'un seulement |
      | valeur | indifférente | meilleure si l'acte est bon, pire s'il est mauvais |

      ! La puissance n'est pas bonne par elle-même : corrélée à deux issues opposées, elle est indifférente ; c'est l'actualisation de la forme visée qui est bonne.
