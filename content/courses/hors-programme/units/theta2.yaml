  - id: theta2-l2
    title: "Θ6 : les couples de l'analogie"
    notes: |-
      **L'analogie aligne des couples où l'acte est à gauche et la puissance à droite (1048a35-b4) :**

      | Acte | Puissance | Rapport |
      | ce qui bâtit | ce qui est capable de bâtir | {teal}mouvement / puissance{/teal} |
      | ce qui est éveillé | ce qui dort | {teal}mouvement / puissance{/teal} |
      | ce qui voit | ce qui a les yeux fermés, mais possède la vue | {teal}mouvement / puissance{/teal} |
      | ce qui est séparé de la matière (`to apokekrimenon`) | la matière | {coral}substance / matière{/coral} |
      | ce qui est achevé (`to apeirgasmenon`) | ce qui est inachevé (`to anergaston`) | {coral}substance / matière{/coral} |

      **« En acte » ne se dit pas pareillement dans tous les cas, sinon par analogie (1048b6-9)** : soit comme le mouvement relativement à la puissance, soit comme la substance relativement à une matière. Makin insiste : il ne faut pas lire « mouvement : capacité = substance : matière » comme l'identité d'un même rapport. On retrouve l'idée en Λ4-5 : forme, privation et matière, ou acte et puissance, ne valent que par analogie pour des genres de choses différents.

      **La puissance n'est donc pas seulement le pouvoir de changer**, mais aussi le mode d'être de la matière par rapport à la substance accomplie. Réduire la puissance et l'acte au seul changement physique, c'est le contresens que Θ6 interdit : Θ1-5 partaient du changement parce que c'était le cas le plus accessible.

      ! L'analogie unit des réalités de genres différents sans les confondre ni les réduire à une unité univoque.
    points:
