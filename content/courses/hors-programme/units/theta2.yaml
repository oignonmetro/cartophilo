  - id: theta2-i1
    title: "Θ6-9 : de la capacité à la substance"
    notes: |-
      **Θ6-9 étendent la puissance et l'acte au-delà du changement : ils deviennent la structure de l'être, le rapport de la {teal}matière{/teal} à la {coral}substance{/coral}.** Selon Makin, c'est un même schéma exemplifié de deux manières très différentes (1048b4-9) : le rapport capacité/changement et le rapport matière/substance ne sont pas le même rapport. C'est pourquoi la seconde application est une extension de la première, et pourquoi Θ6-9 ont besoin de Θ1-5.

      | Chapitre | Ce qu'il fait |
      | Θ6 | fournit l'analogie, et distingue le mouvement de l'acte |
      | Θ7 | demande à quelles conditions quelque chose est en puissance F |
      | Θ8 | démontre la priorité de l'acte (notion, temps, substance) |
      | Θ9 | la renforce du point de vue de la valeur et de la connaissance |

      **Le cas du changement éclaire le rapport de la matière à la substance** : c'est parce qu'une matière est un point de départ adapté pour produire quelque chose, par l'exercice d'une capacité, qu'elle est à ce résultat comme le potentiel à l'actuel. Reste à passer de la matière préexistante à la matière concomitante, qui compose actuellement la chose, pour justifier la correspondance posée en H6 entre matière et forme, puissance et acte (Makin).

      ! Le rapport matière/substance n'est pas un nouveau cas du rapport capacité/changement : c'est le même schéma, exemplifié autrement.
