  - id: theta2-l13
    title: "Θ8 : les êtres éternels"
    notes: |-
      **En un sens plus fondamental, l'acte est antérieur parce que les êtres éternels sont antérieurs par la substance aux êtres périssables, et que « rien d'éternel n'est en puissance » (1050b6-8).** Toute puissance est en même temps puissance des contradictoires : ce qui peut être peut aussi ne pas être. Or ce qui peut ne pas être est corruptible. Rien de ce qui est absolument incorruptible n'est donc en puissance d'être. Ce premier argument (1050b8-11) ne distingue pas les puissances rationnelles et non rationnelles, et parle de contradictoires (être ou ne pas être en acte), non des contraires de Θ2 (Makin). Plus loin (1050b30-34), Aristote justifie autrement le même principe.

      **Le mouvement éternel (1050b22-28).** Le soleil, les astres et le ciel sont toujours en acte : on n'a pas à craindre qu'ils s'arrêtent, car ils n'ont aucune puissance de se mouvoir qui pourrait retomber dans le repos. Le soleil n'est pourtant pas éternellement à tel endroit : il a la puissance d'être ici ou là, une puissance selon le lieu. Son mouvement est sans fatigue, ce qui se comprend sans anthropomorphisme : un mouvement est pénible quand l'être, laissé à lui-même, ne l'accomplirait pas (*Du ciel*, II, 1, 284a14-18). Les éléments, enfin, imitent les êtres incorruptibles.

      **L'argument contre le platonisme (1050b34-1051a2, Makin).** Une Forme platonicienne est censée être l'exemplaire premier de son genre. Si les membres d'un genre ont une capacité, comme la science, la Forme de la science devrait être une capacité ; l'acte étant antérieur, quelque chose lui serait antérieur, et il y aurait « beaucoup plus savant que la science en soi ». Aristote impose cette conséquence aux platoniciens.

