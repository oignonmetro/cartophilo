    title: "Θ7 : deux sortes de prédication"
    notes: |-
      **Aristote distingue la prédication des affections sur une substance et la prédication de la forme sur la matière (1049a27-1049b2).** Dans « l'homme est blanc » ou « l'homme est musicien », le sujet est un individu déterminé (`tode ti`) et le prédicat une affection. Quand la forme est prédiquée de la matière (la forme de coffre du bois), le sujet n'est pas un individu, mais une matière indéfinie (`aoriston`), en puissance de la forme.

      **Pourquoi la terminaison change (Makin).** Les deux prédications modifient une terminaison, mais pas au même endroit :

      | Prédication | Ce qui change | Ce que marque la terminaison |
      | de l'affection | le {coral}prédicat{/coral} : « blanc », non « blancheur » | l'affection, indéfinie, face au sujet particulier |
      | de la forme | le {teal}sujet{/teal} : le coffre est « en bois », non « bois » | la matière, indéfinie, face à la forme particulière |

      **Le dénombrement l'éclaire.** On ne peut pas répondre à « combien de blancheurs y a-t-il dans la pièce ? » (on compte les blancheurs relativement à des individus : combien d'hommes blancs ?), ni à « combien de bois y a-t-il dans le placard ? » (on compte des coffres, ou des coffres en bois). Une quantité de matière n'a donc d'identité que comme matière d'un F particulier, ce que confirme l'idée que la matière immédiate est ce que l'exercice d'une capacité peut transformer en F. Makin ajoute que cette analyse de l'individu en une forme prédiquée de la matière soulève des tensions que H6 espérait réduire en assimilant matière et forme à puissance et acte.

      ! La matière n'est pas un sujet individuel accompli : la forme ne s'y ajoute pas comme un accident à une substance.
