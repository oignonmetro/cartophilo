        sentence: "« Dans les cas particuliers, ce que nous voulons dire est clair par l'induction et il ne faut pas chercher une définition de tout, mais il faut aussi ___ : par exemple ce qui bâtit est à ce qui est capable de bâtir comme ce qui est éveillé à ce qui dort, ce qui voit à ce qui a les yeux fermés, mais possède la vue, ce qui est séparé de la matière à la matière et ce qui est achevé à ce qui est inachevé. » (Θ6, 1048a35-b4)"
