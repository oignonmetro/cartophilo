  - id: theta2-l10
    title: "Θ8 : la priorité selon la notion"
    notes: |-
      **Θ8 (1049b4-1051a2) démontre que l'acte est antérieur à la puissance « par l'énoncé et la substance ; par le temps, il l'est d'une certaine façon, mais non d'une autre » (1049b10-12).** Par puissance, il entend ici non seulement le principe de changement dans autre chose, mais tout principe de changement ou de repos, y compris la nature (1049b5-10).

      | Priorité | Lieu | En un mot |
      | selon la notion (`logos`) | 1049b12-17 | la puissance se définit par l'acte |
      | selon le temps | 1049b17-1050a3 | pour l'espèce, non pour l'individu |
      | selon la substance | 1050a4-1050b6 | l'acte est la forme et la fin |
      | en un sens plus fondamental | 1050b6-1051a2 | rien d'éternel n'est en puissance |

      **Selon la notion, l'acte est premier parce que la définition de la puissance contient l'acte, non l'inverse (1049b12-17).** Ce qui est capable de bâtir (`oikodomikon`) se définit par bâtir, le voyant (`horatikon`) par voir, le visible (`horaton`) par être vu ; on ne définit pas voir par la capacité. Makin multiplie les exemples : on définit le grain comme semence du blé, non le blé mûr comme grain germé. La phrase sur la connaissance (celle de l'acte précède celle de la puissance) est plus difficile : priorité logique ou temporelle ? Makin relève enfin que toutes les capacités ne se définissent pas par leur exercice effectif : toucher son nez avec son pied peut être une réussite isolée, alors que résoudre un problème, par opposition à deviner juste, suppose une capacité mathématique.

      ! La priorité selon la notion n'est pas une priorité dans le temps.
