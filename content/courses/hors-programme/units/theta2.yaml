  - id: theta2-l3
    title: "Θ6 : l'infini et le vide"
    notes: |-
      **L'infini (`apeiron`) et le vide sont en puissance et en acte d'une tout autre façon que ce qui voit ou ce qui marche (1048b9-17).** Pour un objet ordinaire, la puissance peut s'actualiser en un individu séparé. Pour l'infini, par exemple la divisibilité d'une ligne, la puissance ne s'actualise jamais en un tout fini et séparé : son actualité consiste dans le processus de division, qui se poursuit sans fin.

      **Makin tient ce passage pour périphérique à l'argument de Θ6** et adopte une conjecture de Burnyeat : l'infini se dit tel parce que la division se poursuit sans fin. À tout nombre fini de divisions on peut en ajouter une autre, mais il n'arrive jamais qu'une division infinie ait eu lieu (*Physique*, III, 6, 206a18-25).

      | Lecture | Comment l'infini est en puissance |
      | {teal}Burnyeat, suivi par Makin{/teal} | parce que la division se poursuit sans fin |
      | {coral}Ross et Jaeger{/coral} | « par la connaissance », mention que garde la traduction française (« sinon par la connaissance ») |

      Pour le vide, Aristote veut peut-être dire qu'aucun intervalle n'est actuellement vide, mais qu'on peut toujours raréfier davantage un milieu ; la *Physique* (IV, 9, 217b20-21) nie pourtant qu'il y ait du vide en puissance.

      ! L'infini n'est jamais un tout actuel qu'on atteindrait au terme de la division : son acte est la division même qui se poursuit.
    points:
