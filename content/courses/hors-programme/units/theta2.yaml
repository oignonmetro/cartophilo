  - id: theta2-i2
    title: "Le vocabulaire de la puissance et de l'acte"
    notes: |-
      **`Dunamis` se dit au nominatif et au datif adverbial `dunamei` (« en puissance »).** Makin la traduit par « capacité » dans Θ1-5 et par « potentialité » dans Θ6-10. Le datif `dunamei` est rare dans Θ1-5 (trois emplois) et fréquent dans Θ6-9 (vingt-trois) : le déplacement du vocabulaire suit celui de l'enquête. L'adjectif `dunaton` se traduit tantôt par « capable », tantôt par « possible », selon que la modalité suppose ou non une capacité ; Δ12 distingue le `dunaton` « selon une `dunamis` » et celui qui ne l'est pas.

      **`Energeia` est un néologisme d'Aristote, forgé sur la racine `erg-` (œuvre, activité), qui signifie d'abord « activité ».** Il vient de la distinction platonicienne entre posséder un savoir et l'utiliser : le savoir possédé est une puissance, son usage une `energeia`. Aristote forge ensuite `entelecheia` pour une notion plus large, qui inclut l'existence actuelle d'une chose : dans le *De l'âme* (II, 1), l'âme est l'accomplissement du corps, y compris chez le mathématicien endormi, qui possède son savoir sans l'exercer.

      | Terme | Sens premier | Emplois dans Θ |
      | `energeia` | activité (racine `erg-`) | soixante-sept |
      | `entelecheia` | accomplissement, existence actuelle | six |

      L'étymologie d'`entelecheia` est disputée : « avoir en soi sa fin » (`telos`), comme Aristote le dit en Θ8 (1050a21-23), ou « avoir de l'achèvement » (`enteles`). Dans Θ, Aristote revient à `energeia` et en élargit l'emploi, déplacement qu'il faut expliquer en lisant le texte plutôt qu'en tranchant sur la traduction (Makin). D'où la traduction par « acte », plus large qu'« activité ».

      ! « Acte » ne veut pas seulement dire activité : il désigne aussi l'existence actuelle d'une chose.
    points:
      - id: theta2-i2-p1
        sentence: "Le datif adverbial `dunamei`, « en ___ », est rare dans Θ1-5 et fréquent dans Θ6-9."
        answer: "puissance"
        alt: []
      - id: theta2-i2-p2
        sentence: "Le datif `dunamei` (« en puissance ») compte trois emplois dans Θ1-5 et ___ dans Θ6-9 : le vocabulaire suit le déplacement de l'enquête."
        answer: "vingt-trois"
        alt: ["23"]
