  - id: theta2-l7
    title: "Θ7 : une définition stricte, et les êtres naturels"
    notes: |-
      **Makin tire quatre conséquences de la définition de Θ7.**

      | Conséquence | Ce qu'elle implique |
      | des verdicts très stricts | on ne sait pas toujours si un tas est une maison en puissance, et on ne le découvre parfois qu'en bâtissant : le bâtisseur possède la forme de la maison (une compréhension de ce qu'est une maison, Z7), non la capacité de trier les matériaux |
      | une dépendance envers la capacité | être une maison en puissance dépend entièrement de l'aptitude à être transformé en maison par le bâtisseur, sans qu'il faille identifier cette matière autrement |
      | une capacité unique | l'art de bâtir est une seule capacité, malgré ses sous-compétences, parce qu'il y a une seule forme (ce qu'est une maison) ; cela suppose une correspondance terme à terme, peut-être coûteuse, entre les formes du monde (la santé) et les capacités (l'art médical) |
      | pas de verdicts particuliers | Aristote n'a pas à dire si tel patient est en puissance bien portant : Θ pose des questions très générales |

      **Pour les êtres naturels (1049a13-18)**, une chose est en puissance F quand, par son propre principe, elle deviendra F si rien d'extérieur ne l'empêche. La semence n'est pas encore un être humain en puissance : il faut qu'elle soit déposée dans un autre et qu'elle change ; elle l'est quand elle est déjà telle par son propre principe. De même, la terre n'est pas encore une statue en puissance : elle doit d'abord changer pour devenir du bronze.

      ! La semence seule n'est pas déjà le nouvel être : il lui faut un autre milieu et un changement.
