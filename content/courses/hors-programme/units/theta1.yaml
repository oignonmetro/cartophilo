- id: theta1-l15
  title: "Θ5 : comment les puissances passent à l'acte"
  notes: |-
    **{green}Θ5 (1047b31-1048a24) établit les lois du passage de la puissance à l'acte{/green}.** {sky}Makin{/sky} résume l'argument en trois affirmations :

    | | Pour quelles capacités | Ce qui est affirmé |
    | [A] | à une voie | nécessairement, si l'agent et le patient sont en bon état et en bonne relation, l'action s'ensuit |
    | [B] | à deux voies | la même affirmation échoue : l'action produirait en même temps les contraires (1048a8-10) |
    | [C] | à deux voies | nécessairement, si de plus l'agent choisit d'agir, l'action s'ensuit |

    Deux prémisses les soutiennent : le résultat de Θ2 (non rationnel à une voie, rationnel à deux voies) et une thèse sur la manière d'identifier les capacités (1047b35-1048a2). {coral}Ces conclusions sont décisives pour Θ8{/coral} : une paire de capacités active et passive ne donne pas lieu à un changement seulement si quelque chose l'en empêche.

    {amber}**Le chapitre s'ouvre sur une tripartition des puissances selon leur provenance (1047b31-35)**{/amber} : les puissances innées (`sungeneis`), {yellow}comme les sens{/yellow} ; celles qu'on acquiert par l'habitude (`ethei`), {yellow}comme jouer de la flûte{/yellow} ; celles qu'on acquiert par l'apprentissage (`mathêsei`), {yellow}comme les arts{/yellow}. Les deux dernières, on ne les a qu'après les avoir exercées auparavant (`proenergêsantas`, 1047b33-35), ce qui paraît paradoxal : comment exercer un art qu'on n'a pas encore ?

    | Réponse au paradoxe | Ce qu'elle soutient |
    | {sky}*Éthique à Nicomaque*{/sky}, II, 4 | on peut accomplir des actes conformes à l'art sans le posséder, par chance ou sous la conduite d'un maître |
    | Θ8 (1049b29-1050a3) | il est impossible d'avoir l'art de bâtir sans avoir bâti, et l'apprenti possède déjà une partie de l'art à chaque étape |

    Les capacités passives n'exigeraient pas d'exercice préalable ; {sky}Makin{/sky} doute que ce soit universellement vrai (un bronze neuf n'est peut-être pas malléable avant d'avoir été battu).

    ! Faire un acte d'apprenti n'est pas exercer la maîtrise accomplie de l'art.
