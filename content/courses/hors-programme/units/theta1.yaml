  - id: theta1-l10
    title: "Θ3 : les arts et les qualités sensibles"
    notes: |-
      **Aristote réfute les Mégariques par l'absurde, en quatre arguments.** Nier la puissance non exercée détruit le savoir, les qualités sensibles, la perception et le mouvement.

      **Premier argument : les arts (1046b33-1047a4).** Un art comme l'architecture ne s'acquiert que par un apprentissage, et ne se perd que par des causes identifiées : l'oubli, la maladie, le temps. Si les Mégariques avaient raison, le bâtisseur qui pose ses outils perdrait son art sans l'avoir oublié ni avoir rien subi, et, s'il reprenait le travail, il devrait le réapprendre. La perte de l'art requiert une modification du sujet ; pour les Mégariques, la simple cessation d'activité suffirait, et rien ne distinguerait l'architecte au repos du profane.

      **Deuxième argument : les qualités sensibles (1047a4-7).** Si une capacité n'existe que dans son actualisation, il n'y aura rien « ni de froid ni de chaud ni de sucré ni en général de sensible » s'ils ne sont pas sentis : les Mégariques rejoignent alors la doctrine de Protagoras, « l'homme est la mesure de toutes choses ». Nier la puissance passive des objets, c'est leur ôter toute réalité en l'absence d'un observateur.

      | Argument | Ce que la thèse mégarique détruit |
      | les arts | la stabilité du savoir-faire dans le temps |
      | les qualités sensibles | la réalité des qualités hors de la perception |

      ! La possession d'un art est une disposition stable (`hexis`), qui ne se confond pas avec son exercice (`energeia`).
