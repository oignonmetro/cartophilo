  - id: theta1-l17-p1
    sentence: "« __Donc il est nécessaire que__ ___ soit autre : j'entends par là **le désir ou le choix délibéré**. En effet, quel que soit celui des deux contraires qu'on désire après en avoir décidé, on le produira chaque fois que, selon le mode de sa puissance, on a à disposition et à proximité ce qui peut être affecté. » (Θ5, 1048a10-13)"
    answer: "ce qui fait la décision"
