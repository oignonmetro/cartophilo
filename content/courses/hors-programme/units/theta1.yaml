- id: theta1-l2
  title: "Θ1 : la puissance active, sens focal"
  notes: |-
    **{green}Les puissances non homonymes s'ordonnent autour d'une puissance première{/green}, la {violet}puissance active{/violet}, « principe de changement dans autre chose ou <dans la même> en tant qu'autre » (1046a10-11).** Aristote connaît l'homonymie (les définitions diffèrent par accident) et la synonymie (la même définition : « chien » dit d'un colley et d'un dalmatien). Il admet une troisième voie, qu'on appelle depuis {sky}Owen{/sky} « analyse focale » (`pros hen`) : les définitions diffèrent, mais l'une sert de foyer aux autres. {yellow}L'exemple classique est « sain » (Γ2) : un régime est sain parce qu'il conduit à un animal sain, un teint parce qu'il l'indique{/yellow}.

    | Puissance dérivée | Ce qu'elle est | Exemple (Makin) |
    | passive | principe, dans le patient, de subir un changement par l'action d'autre chose | être chauffé |
    | de résistance | état qui permet de ne pas être altéré en mal par un principe de changement | le sel conserve la viande, le marbre résiste à l'érosion |
    | d'agir ou de subir bien (`kalôs`) | la puissance simple, mais bien exercée | un aliment qui se digère bien |

    Le renvoi à la puissance active est explicite pour la résistance (« du fait d'un principe de changement », 1046a13-15) ; il l'est moins pour la puissance passive, et c'est pourquoi Aristote y revient en 1046a19-29.

    **« En tant qu'autre » distingue la puissance de la {violet}nature{/violet}.** {coral}Une nature est un principe de changement dans un être en tant que lui-même{/coral} : l'organisme qui grandit. {yellow}Le médecin qui se guérit exerce son art sur lui-même en tant que malade, non en tant que médecin{/yellow}. {sky}Makin{/sky} précise : la compétence médicale explique de la même façon la guérison de son possesseur et celle d'un autre, c'est une capacité ; la physiologie n'explique que la croissance propre, c'est une nature. {yellow}Un pin gêné pousse de travers{/yellow}, changement non standard qui reste naturel ; et les éléments se meuvent naturellement sans se mouvoir eux-mêmes ({sky}*Physique*{/sky}, VIII, 4).

    ! Ne pas assimiler la puissance (`dunamis`) à la nature (`physis`).
  points:
  - id: theta1-l2-p1
    sentence: "« D'autre part, **toutes les puissances relatives à la même forme** sont sans exception des principes ; __elles sont appelées puissances relativement à__ ___ qui est principe de changement dans autre chose ou <dans la même> en tant qu'autre. » (Θ1, 1046a9-11)"
    answer: "une unique puissance première"
    alt: []
  - id: theta1-l2-p2
