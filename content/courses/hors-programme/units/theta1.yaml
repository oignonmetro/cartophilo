- id: theta1-l5
  title: "Θ2 : puissances rationnelles et non rationnelles"
  notes: |-
    **{green}Θ2 (1046a36-1046b28) divise les puissances actives selon leur sujet{/green} : les puissances {violet}non rationnelles{/violet} (`alogoi`) et les puissances {violet}rationnelles{/violet} (`meta logou`).** Les principes de changement résident dans les êtres inanimés ou dans les êtres animés, et, chez ces derniers, certains « sont dans l'âme, et dans la partie de l'âme qui possède la raison » (1046a36-b1). Tous les arts (`technai`) et les sciences productives sont donc des puissances rationnelles : principes de changement dans autre chose, ils reposent sur une connaissance.

    **{green}Une puissance est rationnelle parce qu'on la possède en tant qu'on a la raison, non parce qu'on est vivant{/green}.** Un être humain a aussi des puissances non rationnelles, {yellow}comme celle de chauffer par sa chaleur corporelle{/yellow} ; {yellow}la capacité de digérer ou de se reproduire est dans l'âme (végétative), sans être rationnelle{/yellow}.

    **{sky}Makin{/sky} précise le sens de `logos`.** Il a deux familles de sens : quelque chose d'exprimé (définition, explication, discours) et quelque chose d'intérieur (la raison, capacité de saisir ou de produire un énoncé). En Θ2, il désigne d'abord la partie rationnelle de l'âme, puis le savoir comme possession d'une explication qui éclaire à la fois la chose positive et sa privation.

    | Une capacité est « dans l'âme » | Exemple |
    | si on la possède en tant qu'on est vivant | se reproduire, capacité perdue à la mort |
    | si on la possède en tant qu'on est rationnel | démontrer des théorèmes |
    | non si on la possède simplement en étant vivant | un arbre vivant et un arbre mort sont également combustibles, un poisson vivant et un poisson mort également comestibles |

    ! Toutes les facultés d'un être humain ne sont pas rationnelles : les fonctions végétatives et la chaleur du corps sont des puissances non rationnelles.
