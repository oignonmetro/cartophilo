  - id: theta1-l18
    title: "Θ5 : les empêchements extérieurs"
    notes: |-
      **Il n'est pas besoin d'ajouter à la définition d'une puissance « qu'il n'y ait aucun empêchement extérieur » (1048a15-21).** On n'a la puissance de produire que selon le mode de cette puissance : ni dans n'importe quelles conditions, ni à n'importe quel moment, mais dans celles où ce qui peut être affecté est présent et dans l'état correspondant, et où les empêchements extérieurs sont écartés « par certains compléments de la définition ». La puissance du bâtisseur est de bâtir, par exemple, « à moins que de grands vents ne soufflent ».

      **Makin insiste : la clause porte sur le {teal}contenu{/teal} de la puissance, non sur les conditions de sa {coral}possession{/coral}.** Il lit de même la phrase « sinon, il n'aura pas la puissance de produire » comme portant sur les conditions où il est possible que l'agent agisse : sans briques, il n'est pas possible que le bâtisseur bâtisse, bien qu'il ait son art. Lue comme portant sur la possession, elle aurait trois défauts :

      | Défaut | Pourquoi |
      | l'art dépendrait des matériaux | l'art du bâtisseur dépendrait de la livraison de briques bien cuites |
      | contre Θ3 | elle contredirait ce que Θ3 dit du gain et de la perte des arts |
      | contre Θ1 | elle brouillerait la distinction entre puissance active, qui tient à l'agent, et passive, qui tient au patient |

      Une capacité de bâtir qui s'évanouirait dès qu'un vent fort souffle serait peu plausible. Θ7, au contraire, mentionne expressément l'absence d'empêchement extérieur (1049a7, 13-14) : Makin n'y voit pas d'incohérence sérieuse, Θ7 restant à un niveau général.

      ! La clause n'est pas un correctif greffé sur la définition (« puissance de produire, sauf obstacle »), et l'artisan ne perd pas son art quand les conditions manquent.
