  - id: theta1-l16
    title: "Θ5 : les puissances non rationnelles"
    notes: |-
      **Pour une puissance non rationnelle, dès que l'agent et le patient sont proches « selon le mode de leur puissance » (1048a5-6), l'action se produit nécessairement.** Une telle puissance est à une voie (Θ2) et ne comporte aucun choix. Si le feu ne brûle pas un bois détrempé, la règle n'échoue pas : le patient n'était pas dans la disposition requise.

      **Un déterminisme faible (Makin).** Plusieurs commentateurs ont lu [A] comme une thèse déterministe ; ses implications sont en réalité très limitées. [A] dit seulement que l'exercice propre de la capacité se produit nécessairement en conditions normales. Il laisse ouverts les autres effets de l'action (un feu qui brûle du bois produit une fumée de forme contingente et chasse des abeilles de leur ruche) et ce que fait la capacité en conditions perturbatrices (une bille qui en heurte une autre peut partir à gauche, à droite ou rebondir).

      **Ce que contient l'antécédent de [A]** : les propriétés de l'agent (un anneau électrique est allumé), celles du patient (le papier est sec) et leur relation (le papier touche l'anneau). Ni l'absence d'obstacle extérieur (pas de vent fort), ni la présence d'une condition extérieure (l'oxygène de l'air) : on y reviendra en 1048a16-21. Les relations requises varient : une teinture doit toucher l'étoffe, un feu fait fondre la cire s'il est assez proche.

      **Un argument pour [A].** Beaucoup de capacités paraissent probabilistes (un atome de radium ne fait que probablement déclencher le compteur). Mais il faut préciser le contenu d'une capacité en tenant compte des obstacles (1047b35-1048a2), et on ne peut tenir un facteur pour un obstacle extérieur que s'il est vrai que la capacité se serait exercée en son absence. Si [A] était fausse, ce ne serait jamais vrai, et l'on ne pourrait plus préciser le contenu des capacités.

      ! [A] n'abolit pas la contingence du monde physique : un monde où elle est vraie peut comporter beaucoup d'indétermination.
