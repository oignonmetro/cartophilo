- id: theta1-l14
  title: "Θ4 : la possibilité et l'implication"
  notes: |-
    **Premier principe de Θ4 (1047b14-26) : {green}si A entraîne nécessairement B, alors, si A est possible, B l'est aussi{/green}** ; par contraposition, si B est impossible, A est impossible. Aristote le démontre par l'absurde : on suppose A → B et A possible ; si B était impossible, comme A est possible, rien d'impossible ne suivrait de A actuel ; or B suivrait de A et serait impossible. Contradiction : on renonce à l'impossibilité de B.

    **Le texte est opaque ({sky}Makin{/sky}).** Le « Pourtant B était <supposé> impossible » de 1047b20 renvoie à une supposition que rien n'annonce plus haut. {sky}Burnyeat{/sky} propose de lire, en 1047b17-18, « admettons maintenant qu'il est impossible » au lieu de « admettons alors que A est possible » : en lettres capitales sans coupure de mots, les deux leçons ne diffèrent que de deux lettres. {sky}Makin{/sky} interprète le passage en ce sens sans modifier le texte qu'il traduit, et ne suit pas Burnyeat dans une seconde conjecture.

    **Second principe (1047b26-30), réciproque du premier selon {sky}Makin{/sky} : si A est, B est aussi nécessairement.** {red}Il paraît peu plausible{/red} : {yellow}s'il est possible que cette pièce soit lancée, il est possible qu'elle montre pile{/yellow}, sans que, lancée, elle montre pile. {sky}Makin{/sky} en propose deux lectures charitables :

    | Lecture | Ce que demande le principe |
    | les moments où A et B sont le cas | toute condition cohérente où A est le cas est une condition où B l'est (les conditions sont comme des « mondes possibles ») |
    | les moments où A et B sont possibles | toute condition où A est possible est une où B l'est, par un lien nécessaire, non fortuit : {yellow}deux amis nés le même jour peuvent tous deux mourir adolescents aux mêmes âges{/yellow} |

    ! Les conditionnels de Θ4, énoncés avec « nécessairement », se lisent fortement, non comme de simples conditionnels matériels.
  points:
  - id: theta1-l14-p1
    sentence: "**Premier principe de Θ4** : si A entraîne nécessairement B, alors, __si A est__ ___, B l'est aussi."
    answer: "possible"
