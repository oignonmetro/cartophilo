  - id: theta1-l8
    title: "Θ2 : agir et bien agir"
    notes: |-
      **La capacité d'accomplir une action {teal}bien{/teal} (`kalôs`) implique la capacité de l'accomplir tout court ; l'inverse n'est pas vrai (1046b24-28).** Qui bâtit excellemment bâtit ; mais on peut bâtir mal sans être privé de la capacité, comme l'apprenti qui joue faux ou le médecin malhabile.

      **Makin relève deux cas.** Pour certaines capacités, agir mal tend vers ne pas agir du tout : à force de mauvais coups aux échecs, on ne joue pas mal, on ne joue plus ; la capacité de bien jouer suit alors de celle de jouer. Pour d'autres, une action défaillante reste l'exercice de la capacité : voir mal, c'est encore voir, et une vue qui distingue quoi que ce soit reste une vue ; la capacité de bien voir ne suit pas de celle de voir. Aristote consigne les deux cas sans proposer de principe général pour répartir les capacités.

      ! Ne pas confondre l'incapacité totale avec la simple maladresse.
