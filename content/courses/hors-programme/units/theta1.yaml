  - id: theta1-l6
    title: "Θ2 : la puissance des contraires"
    notes: |-
      **Toute puissance rationnelle est puissance des contraires : un seul et même art produit deux résultats opposés, comme la médecine, puissance de la santé et de la maladie (1046b4-15).** La raison en est le `logos` : une science ou un art est la possession, dans l'âme, de la formule d'un objet (la définition de la santé), et la même formule éclaire la chose positive et sa privation.

      **Mais la science ne vise pas les deux contraires de la même façon.** Le `logos` concerne l'état positif {teal}par soi{/teal}, et la privation {coral}par accident{/coral} (1046b11-15) : la médecine vise par soi la santé, et ne connaît la maladie que comme sa négation. « La raison montre le contraire par négation et par suppression » (`apophasis`, `apophora`, 1046b13-14) : « la privation première est le contraire » (1046b14-15). Makin y voit une thèse conceptuelle, non un fait empirique (les médecins sont formés à guérir) : la santé est ce qu'elle est, alors que la maladie n'est unifiée que par sa relation à la santé, et il y a bien plus de manières d'être malade que d'être sain. Cette non-indifférence ne contredit pas la « bivalence » de Θ9, qui suggère que seule l'issue bonne est proprement acte (1051a17-18).

      **L'âme possède un principe de mouvement** : à partir du même principe, elle peut mettre en branle l'un ou l'autre contraire, en les rattachant au même `logos` (1046b15-24). C'est pourquoi « les êtres qui ont une puissance rationnelle produisent de manière contraire à ceux qui ont une puissance non rationnelle, car les contraires sont contenus par un principe unique, la raison ».

      ! L'art médical n'est pas indifférent au bien et au mal : orienté par nature vers la guérison, il ne peut nuire que parce qu'il connaît la privation.
