  - id: theta1-l4
    title: "Θ1 : l'impuissance, une privation"
    notes: |-
      **L'impuissance (`adunamia`) n'est pas une simple absence de capacité, mais la {coral}privation{/coral} (`sterêsis`) de la puissance correspondante, chez un sujet naturellement apte à la posséder (1046a29-35).** Les impuissances reproduisent les puissances : à la capacité de chauffer de l'eau, que possède le feu, répond l'incapacité de la chauffer, que possède un bloc de glace.

      Ce passage très condensé résume deux chapitres du livre Δ. **Δ12** (1019b15-21) montre la variété des incapacités : un enfant, un eunuque et un malade sont incapables d'engendrer, pour des raisons différentes (immaturité, mutilation, mauvaise santé). **Δ22** fait varier les conditions de la privation :

      | Sens de la privation | Exemple |
      | le plus faible : la propriété est naturelle à certains êtres | une plante est « privée » de vue |
      | plus strict : on ne compare pas avec n'importe quoi | on ne dit pas nain un homme petit par rapport à une girafe, ni ignorant un enfant qui ne sait pas la géométrie comme un expert |
      | possession très faible | celui qui a très peu de cheveux est chauve |
      | action ou passion difficile | celui qui perçoit les sons sans comprendre les mots est dit sourd |

      L'impuissance a donc autant de formes que la puissance (Makin) : le novice qui ne peut pas guérir du tout, mais aussi l'étudiant qui ne peut pas guérir convenablement ; la matière qui traverse le corps sans être affectée, mais aussi l'aliment qu'on ne digère qu'avec peine.

      ! Ne pas avoir une propriété n'est une privation que si elle est naturelle au sujet considéré, et les conditions de la privation sont plus ou moins strictes.
