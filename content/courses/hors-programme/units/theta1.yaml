  - id: theta1-l9
    title: "Θ3 : la thèse mégarique"
    notes: |-
      **Les Mégariques soutiennent qu'on n'a la puissance d'agir que lorsqu'on agit : celui qui ne bâtit pas n'a pas la capacité de bâtir (1046b29-32).** Ils identifient ainsi la puissance et l'acte, et refusent toute capacité non exercée : l'architecte n'a son art qu'en bâtissant, le voyant sa vue qu'en regardant, l'homme assis n'a pas la puissance de se lever.

      **Aristote ne leur donne aucune raison positive.** Makin reconstruit leur position à partir de deux prémisses, dont elle découle, et d'une intuition qui les motive :

      | | Contenu |
      | {coral}synchronie{/coral} | le moment où l'on possède une capacité est celui que spécifie son exercice : pas de capacité aujourd'hui d'agir demain |
      | {coral}nécessité du présent{/coral} | si l'on n'agit pas à l'instant t, on n'a pas à cet instant la capacité d'agir |
      | l'intuition | une capacité doit pouvoir s'exercer quand on la possède |

      Exemple de Makin : a-t-on la capacité de travailler pendant la pause du lundi midi ? Si l'on y travaille, la synchronie ne l'accorde qu'à ce moment ; sinon, la synchronie la refuse hors de la pause, et la nécessité du présent pendant la pause. On n'a la capacité que lorsqu'on agit.

      **Une position plus plausible concède au sens commun des capacités « diachroniques »**, mais les réduit : un médecin a aujourd'hui, de façon dérivée, la capacité de soigner demain si, demain, il l'a effectivement. On aboutit à la définition du possible attribuée à Diodore Cronos, un peu postérieur à Aristote : est possible ce qui est ou sera. Un médecin qui mourra cette nuit n'a alors aucune capacité de soigner, ni un manteau qui s'usera celle d'être découpé, ce qu'Aristote semble refuser (*De l'interprétation*, 9, 19a13-14).

      ! La puissance n'est ni le néant tant qu'elle ne s'exerce pas, ni une simple possibilité logique : c'est une capacité réelle, qui subsiste au repos.
