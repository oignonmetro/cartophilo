  - id: theta1-l2
    title: "Θ1 : la puissance active, sens focal"
    notes: |-
      **Les puissances non homonymes s'ordonnent autour d'une puissance première, la {teal}puissance active{/teal}, « principe de changement dans autre chose ou <dans la même> en tant qu'autre » (1046a10-11).** Aristote connaît l'homonymie (les définitions diffèrent par accident) et la synonymie (la même définition : « chien » dit d'un colley et d'un dalmatien). Il admet une troisième voie, qu'on appelle depuis Owen « analyse focale » (`pros hen`) : les définitions diffèrent, mais l'une sert de foyer aux autres. L'exemple classique est « sain » (Γ2) : un régime est sain parce qu'il conduit à un animal sain, un teint parce qu'il l'indique.

      | Puissance dérivée | Ce qu'elle est | Exemple (Makin) |
      | passive | principe, dans le patient, de subir un changement par l'action d'autre chose | être chauffé |
      | de résistance | état qui permet de ne pas être altéré en mal par un principe de changement | le sel conserve la viande, le marbre résiste à l'érosion |
      | d'agir ou de subir bien (`kalôs`) | la puissance simple, mais bien exercée | un aliment qui se digère bien |

      Le renvoi à la puissance active est explicite pour la résistance (« du fait d'un principe de changement », 1046a13-15) ; il l'est moins pour la puissance passive, et c'est pourquoi Aristote y revient en 1046a19-29.

      **« En tant qu'autre » distingue la puissance de la {coral}nature{/coral}.** Une nature est un principe de changement dans un être en tant que lui-même : l'organisme qui grandit. Le médecin qui se guérit exerce son art sur lui-même en tant que malade, non en tant que médecin. Makin précise : la compétence médicale explique de la même façon la guérison de son possesseur et celle d'un autre, c'est une capacité ; la physiologie n'explique que la croissance propre, c'est une nature. Un pin gêné pousse de travers, changement non standard qui reste naturel ; et les éléments se meuvent naturellement sans se mouvoir eux-mêmes (*Physique*, VIII, 4).

      ! Ne pas assimiler la puissance (`dunamis`) à la nature (`physis`).
