  - id: theta1-l15
    title: "Θ5 : comment les puissances passent à l'acte"
    notes: |-
      **Θ5 (1047b31-1048a24) établit les lois du passage de la puissance à l'acte.** Makin résume l'argument en trois affirmations :

      | | Pour quelles capacités | Ce qui est affirmé |
      | [A] | à une voie | nécessairement, si l'agent et le patient sont en bon état et en bonne relation, l'action s'ensuit |
      | [B] | à deux voies | la même affirmation échoue : l'action produirait en même temps les contraires (1048a8-10) |
      | [C] | à deux voies | nécessairement, si de plus l'agent choisit d'agir, l'action s'ensuit |

      Deux prémisses les soutiennent : le résultat de Θ2 (non rationnel à une voie, rationnel à deux voies) et une thèse sur la manière d'identifier les capacités (1047b35-1048a2). Ces conclusions sont décisives pour Θ8 : une paire de capacités active et passive ne donne pas lieu à un changement seulement si quelque chose l'en empêche.

      **Le chapitre s'ouvre sur une tripartition des puissances selon leur provenance (1047b31-35)** : les puissances innées (`sungeneis`), comme les sens ; celles qu'on acquiert par l'habitude (`ethei`), comme jouer de la flûte ; celles qu'on acquiert par l'apprentissage (`mathêsei`), comme les arts. Les deux dernières, on ne les a qu'après les avoir exercées auparavant (`proenergêsantas`, 1047b33-35), ce qui paraît paradoxal : comment exercer un art qu'on n'a pas encore ?

      | Réponse au paradoxe | Ce qu'elle soutient |
      | *Éthique à Nicomaque*, II, 4 | on peut accomplir des actes conformes à l'art sans le posséder, par chance ou sous la conduite d'un maître |
