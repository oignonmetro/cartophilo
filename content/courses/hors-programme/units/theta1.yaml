  - id: theta1-l17
    title: "Θ5 : le choix et les puissances rationnelles"
    notes: |-
      **Pour une puissance rationnelle, la rencontre de l'agent et du patient ne suffit pas : il faut « ce qui fait la décision », le {teal}désir{/teal} ou le {teal}choix délibéré{/teal} (`orexis`, `prohairesis`, 1048a10-11).** Si une puissance rationnelle s'exerçait automatiquement au contact du patient, elle produirait en même temps les deux contraires (guérir et rendre malade), ce qui est impossible. Une fois le choix posé, l'action choisie s'accomplit nécessairement, si le patient est à disposition. Le choix remplit deux rôles : il active la puissance, qui sans lui reste au repos, et la dirige vers l'un des contraires.

      **Le désir en cause est décisif** : l'agent fait le contraire « qu'on désire après en avoir décidé ». Un simple souhait ne déclenche rien : on peut souhaiter, mais non décider, ce qui est impossible (*Éthique à Nicomaque*, III, 2, 1111b20-23). Makin remarque qu'on ne peut guère définir ce désir décisif indépendamment de ce qu'on fait si on le peut, et formule donc [C] en termes de choix.

      **On ne peut pas accomplir deux contraires à la fois (1048a21-24)**, même en les désirant : la puissance rationnelle est puissance de l'un ou de l'autre, non des deux en même temps.

      **Selon Makin, une puissance active n'est ni une simple possibilité ni une simple disposition, mais une {coral}tendance{/coral}** à produire des changements effectifs, qui n'échoue que si quelque chose l'en empêche : le feu chauffe chaque fois qu'il le peut, le médecin formé qui choisit de guérir guérira s'il le peut.

      ! Le médecin au repos n'a pas perdu son art : il s'abstient seulement du choix qui en déclencherait l'exercice.
