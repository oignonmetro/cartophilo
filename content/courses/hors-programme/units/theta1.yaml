  title: "Θ3 : la cécité, le mouvement, la conclusion"
  notes: |-
    {amber}**Troisième argument : la cécité (1047a7-10).**{/amber} La cécité est la privation de la vue chez un être naturellement fait pour l'avoir. Si l'on n'avait la vue qu'en voyant, {yellow}celui qui ferme les yeux deviendrait aveugle{/yellow}, et l'on deviendrait aveugle ou sourd plusieurs fois par jour. {coral}Les Mégariques ne distinguent pas la privation de la puissance (être aveugle) du repos d'une puissance intacte (avoir les yeux fermés){/coral}.

    {amber}**Quatrième argument : le mouvement (1047a10-17).**{/amber} Ce qui est privé de puissance est impossible. {yellow}Celui qui est assis n'a pas, selon les Mégariques, la puissance de se lever{/yellow} : il lui est donc impossible de se lever, et il restera toujours assis. Nier la puissance non exercée rend impossibles le changement et le devenir (`genesis`). S'il admet que l'homme assis finira par se lever, le Mégarique doit admettre qu'il en avait la capacité auparavant.

    **La conclusion (1047a17-23)** {green}sépare nettement la puissance et l'acte{/green} : on peut avoir la puissance d'être sans être, et être avec la puissance de ne pas être. Ce que ruinent les arguments mégariques, en identifiant puissance et acte, n'est pas de peu d'importance. {sky}Makin{/sky} souligne la prudence de cette conclusion ({teal}« s'il n'est pas possible de dire cela »{/teal}) : Aristote en tire une conclusion modale de second ordre, et évite les termes de la famille de `dunamis`, que l'adversaire conteste, au profit du rare et incolore `endechesthai`.

    ! Il faut distinguer l'impossibilité contingente due à un obstacle (être attaché à sa chaise) de l'impossibilité qu'impose la thèse mégarique.
