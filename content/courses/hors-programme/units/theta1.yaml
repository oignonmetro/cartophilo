  - id: theta1-l13
    title: "Θ4 : le faux et l'impossible"
    notes: |-
      **Θ4 répond à l'adversaire symétrique des Mégariques.** Ceux-ci admettaient trop peu de possibles (ce qui n'est pas exercé serait impossible) ; l'adversaire de Θ4 en admet trop : il accepte la distinction du possible et de l'actuel, mais réduit toute prétendue impossibilité à un faux perpétuel, à « ce qui n'arrive jamais ».

      **Aristote refuse qu'on dise d'une chose qu'elle est possible mais ne sera jamais, quand on en conclut que rien n'est impossible (1047b3-14).** Sinon « les choses impossibles s'échappent » (Makin ; la traduction française dit « d'ignorer qu'il y a des choses impossibles », 1047b5-6). Son exemple : on ne peut pas dire que la diagonale du carré peut être mesurée par le côté, mais ne le sera jamais. Θ4 se borne à affirmer que c'est impossible (1047b12) ; la démonstration, qui conduit à ce qu'un même nombre soit à la fois pair et impair, est donnée dans les *Premiers Analytiques* (I, 23, 41a26-27). D'où la formule : « il n'y a pas du tout identité du {coral}faux{/coral} et l'{teal}impossible{/teal} » (1047b12-14).

      **Makin distingue trois lectures de 1047b3-14.**

      | Lecture | Ce que fait Aristote |
      | 1 | il nierait qu'un possible puisse ne jamais être actuel (principe de plénitude), mais *De l'interprétation* 9 admet qu'un manteau puisse être découpé sans l'être jamais |
      | 2 | l'adversaire infère de « possible mais jamais actuel » que rien n'est impossible ; Aristote rejette l'inférence par le critère de Θ3 |
      | 3, que Makin juge préférable | l'adversaire est le symétrique de Mégare ; la réponse est alors assez faible, car montrer qu'une impossibilité découle d'une autre ne persuade pas qui nie toute impossibilité |

      ! Aristote admet que certains possibles ne se réalisent jamais ; il refuse que toutes les impossibilités se réduisent à des possibles non réalisés.
