- id: theta1-l6
  title: "Θ2 : la puissance des contraires"
  notes: |-
    **{green}Toute puissance rationnelle est puissance des contraires{/green} : un seul et même art produit deux résultats opposés, {yellow}comme la médecine, puissance de la santé et de la maladie{/yellow} (1046b4-15).** La raison en est le `logos` : une science ou un art est la possession, dans l'âme, de la formule d'un objet (la définition de la santé), et la même formule éclaire la chose positive et sa privation.

    **Mais la science ne vise pas les deux contraires de la même façon.** Le `logos` concerne l'état positif {violet}par soi{/violet}, et la privation {violet}par accident{/violet} (1046b11-15) : la médecine vise par soi la santé, et ne connaît la maladie que comme sa négation. {teal}« {/teal}La raison montre le contraire par négation et {teal}par suppression »{/teal} (`apophasis`, `apophora`, 1046b13-14) : {teal}« {/teal}la privation première {teal}est le contraire »{/teal} (1046b14-15). {sky}Makin{/sky} y voit une thèse conceptuelle, non un fait empirique (les médecins sont formés à guérir) : {coral}la santé est ce qu'elle est, alors que la maladie n'est unifiée que par sa relation à la santé{/coral}, et il y a bien plus de manières d'être malade que d'être sain. Cette non-indifférence ne contredit pas la {teal}« {/teal}bivalence » de Θ9, qui suggère que seule l'issue bonne est proprement acte (1051a17-18).

    **L'âme possède un principe de mouvement** : à partir du même principe, elle peut mettre en branle l'un ou l'autre contraire, en les rattachant au même `logos` (1046b15-24). C'est pourquoi « les êtres qui ont une puissance rationnelle produisent de manière contraire à ceux qui ont une puissance non rationnelle, car les contraires sont contenus par un principe unique, {teal}la raison »{/teal}.

    ! L'art médical n'est pas indifférent au bien et au mal : orienté par nature vers la guérison, il ne peut nuire que parce qu'il connaît la privation.
  points:
  - id: theta1-l6-p1
    sentence: "« __Et toutes les puissances rationnelles sont__ ___ **en étant les mêmes**, alors que les non rationnelles sont chacune puissances d'une seule chose [...] » (Θ2, 1046b4-7)"
    answer: "puissances des contraires"
