- id: theta1-i2
  title: "Partir du changement"
  notes: |-
    **{green}Θ1-5 partent du cas le plus familier de la puissance : la capacité de produire ou de subir un changement{/green} (`kinêsis`).** {sky}Makin{/sky} donne trois raisons de ce choix. Aristote étend ces notions (il invente des termes pour l'acte, emploie ceux de puissance de façon nouvelle), et les cas familiers éclairent les cas nouveaux et opaques. Ce rapport recouvre une grande variété de cas qu'il faut ordonner : capacités actives et passives, à une ou deux voies, rationnelles ou non, innées ou acquises. Enfin, pour servir de cas clair, il doit être un cas sûr : si l'on pouvait douter de la distinction entre celui qui peut bâtir et celui qui bâtit, il n'éclairerait rien de plus difficile, comme la forme et la matière.

    {amber}**Chaque chapitre y a son rôle.**{/amber} Θ1 ouvre l'analyse (la capacité active comme cas central) ; Θ2 prépare Θ5 (rationnel et non rationnel, une voie et deux voies) ; Θ3 défend contre les Mégariques l'existence de capacités non exercées ; Θ4 distingue le possible de l'impossible ; Θ5 établit les conclusions générales sur la relation entre capacité et changement.

    {amber}**Un débat porte sur le rapport de Θ1-5 à Θ6-9.**{/amber}

    | Lecture | Θ1-5 | Θ6-9 |
    | {sky}Frede, suivi par Makin{/sky} | déjà l'être en puissance et en acte, dans le cas le plus accessible : la scie qui ne coupe pas est déjà en puissance | l'extension, par analogie, à des cas sans changement (vivre, être une maison) |
    | {sky}Ross{/sky} | la capacité de produire un changement dans autre chose, simple préparation | la potentialité de passer à un nouvel état |

    {sky}Makin{/sky} préfère Frede, notamment parce que Θ5 aboutit à une théorie de la manière dont les capacités donnent lieu aux changements, et que Θ2-4 préparent ce résultat. Il traduit par un même mot, « changement », `kinêsis` et `metabolê`, dont Aristote ne tire rien ici.

    ! Θ1-5 ne sont pas un préambule de physique : la capacité non exercée est déjà une manière d'être en puissance.
  points:
  - id: theta1-i2-p1
    sentence: "Makin donne trois raisons de commencer Θ par le rapport d'une capacité au changement qu'elle produit ; la **première** : __les cas familiers éclairent les cas__ ___ et opaques auxquels Aristote étend ces notions."
    answer: "nouveaux"
    alt: []
  - id: theta1-i2-p2
    sentence: "Deuxième des trois raisons de Makin de partir du changement : le rapport capacité/changement recouvre une **grande variété de cas** (actifs et passifs, à une ou deux voies, rationnels ou non, innés ou acquis) __qu'il faut__ ___."
    answer: "ordonner"
    alt: []
