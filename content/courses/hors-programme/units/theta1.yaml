  - id: theta1-l7
    title: "Θ2 : les capacités à une voie"
    notes: |-
      **Les puissances non rationnelles sont à une voie (unidirectionnelles) : le chaud ne peut que chauffer, le froid que refroidir.** Qu'un même feu sèche la boue et fasse fondre la cire ne fait pas de lui une puissance à deux voies : la diversité des effets tient aux matières différentes sur lesquelles il agit, et sa puissance active consiste uniquement à chauffer.

      **Makin précise ce que veut dire « à une voie ».** Une capacité non rationnelle peut avoir plusieurs effets à la fois (un four chaud chauffe la pâte, la fait changer de couleur et gonfler), voire des effets contraires (le soleil fait fondre la glace et sécher l'argile). Elle reste à une voie parce qu'il y a toujours un effet propre, ici l'échauffement, qui se produit en conditions normales.

      | Conditions d'exercice | Ce qui se passe | Exemple |
      | normales | rien ne gêne | l'abeille butine la fleur |
      | perturbatrices | la capacité s'exerce de façon non standard | une abeille trop grosse pour une fleur trop petite |
      | empêchantes | aucun exercice | une abeille prise dans une toile |

      Une capacité est à une voie si tout exercice en conditions normales est un exemple de φ, à deux voies si elle peut s'exercer en conditions normales sans que ce soit un exemple de φ. Le médecin qui empoisonne son ennemi exerce son art en conditions normales : son désir et son choix orientent l'exercice, ils ne le perturbent pas (voir Θ5).

      **Θ2 ne traite que des puissances actives.** En Θ8 (1050b30-34), Aristote associe pourtant les puissances non rationnelles à des issues opposées, « par leur présence ou leur absence ». Makin juge la remarque étrange mais compatible avec Θ2 : la même chaleur donne un échauffement quand elle est présente dans un agent, un refroidissement quand un patient cesse d'en être pourvu au contact d'un agent froid.

      ! La diversité des réactions du patient n'est pas une bivalence de l'agent.
    points:
      - id: theta1-l7-p1
        sentence: "Une puissance non rationnelle est à une seule voie, ou ___ : le chaud ne peut que chauffer, le froid que refroidir."
        answer: "unidirectionnelle"
