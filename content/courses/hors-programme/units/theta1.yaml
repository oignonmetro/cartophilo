  - id: theta1-l12
    title: "Θ3 : le critère du possible"
    notes: |-
      **Θ3 propose un critère du possible : « est possible ce qui ne comportera aucune impossibilité, si se présente l'acte de ce dont on dit qu'il a la puissance » (1047a24-26).** Dire qu'il est possible à un homme assis de se lever, ce n'est pas dire qu'il est debout, mais que, si l'on suppose qu'il se lève, rien d'impossible ne s'ensuit.

      **Makin précise la portée de ce test.** Il définit une modalité « standard » : si p est actuel, rien d'impossible ne résulte de p, donc p est possible ; c'est pourquoi on ne l'applique guère qu'à ce qui n'est pas actuel, dont le statut modal n'est pas évident. Ce n'est pas un test de la possession d'une capacité : on peut réussir par chance, ou au cours de son apprentissage, sans la posséder. Une variante des *Premiers Analytiques* (I, 13, 32a18-20) ajoute que ce qui est possible n'est pas nécessaire, ce qui caractérise alors le contingent.

      **La fin du chapitre (1047a30-1047b2) s'intègre mal au reste** et interrompt la transition vers Θ4 (Makin). Elle compte trois moments :

      | Moment | Contenu |
      | 1047a30-32 | l'acte se dit d'abord du mouvement, puis s'étend à d'autres cas, extension que reprendront Θ6-9 |
      | 1047a33-35 | on n'accorde pas aux non-êtres d'être mus, bien qu'on puisse les penser ou les désirer |
      | l'appui | la *Physique* (III, 1) : pour changer sous un rapport F, il faut un sujet persistant, d'abord en puissance F puis en acte F |

      Un non-être ne pouvant jamais être en acte F, il ne peut changer ; certains non-êtres existent pourtant en puissance, sans exister « en état accompli » (`entelecheia`).

      ! Le critère du possible teste la modalité d'un énoncé, non la présence d'une capacité chez un agent.
