lessons:
  - id: theta1-i1
    title: "Le livre Θ dans la Métaphysique"
    notes: |-
      **Le livre Θ (1045b27-1052a11) étudie l'être {teal}en puissance{/teal} (`dunamis`) et {coral}en acte{/coral} (`energeia`, `entelecheia`), puis s'achève sur l'être comme vrai.** La classification des quatre sens de l'être, donnée en Δ7 et reprise en E2, appelle quatre enquêtes :

      | Sens de l'être | Où il est étudié |
      | par accident | E2-3 |
      | selon les catégories, surtout la substance | Z-H |
      | comme vrai et faux | E4 et Θ10 |
      | en puissance et en acte | Θ1-9 |

      **Θ n'est pas un traité indépendant.** Selon une seconde perspective (Makin), il résout des problèmes hérités de Z et H : Z montre que les individus concrets sont des composés de forme et de matière, et H6 explique leur unité en rapportant la forme à l'acte et la matière à la puissance, ce qui oblige à clarifier ces deux notions. Θ prépare aussi Λ, où l'on passe aux substances éternelles, pour lesquelles forme et matière disparaissent : l'argument s'y poursuit en termes d'acte et de puissance. La distinction résout enfin les apories des Éléates sur l'impossibilité du changement (*Physique*, I, 8, 191b27-29).

      **Les chapitres ne sont pas d'Aristote.** Ils viennent de l'édition de Bâle de 1550, qui reprend la traduction latine de Bessarion ; mais ils sont sensés et marquent trois blocs : Θ1-5 (la puissance liée au changement), Θ6-9 (l'extension analogique et la priorité de l'acte), Θ10 (l'être comme vrai).

      ! Θ ne commence pas une nouvelle enquête : il prolonge celle de Z-H sur la substance et prépare la théologie de Λ.
