- id: theta1-l3
  title: "Θ1 : une ou deux puissances ?"
  notes: |-
    **{green}Puissance d'agir et puissance de subir sont, en un sens, une seule puissance, en un autre sens deux{/green} (1046a19-29).** Elles sont une parce qu'une chose n'est dite capable d'agir que par rapport à la capacité complémentaire d'un patient : leur exercice conjoint est un seul changement, {yellow}comme le feu qui chauffe et l'eau qui est chauffée{/yellow}.

    | | Puissance active | Puissance passive |
    | Où elle réside | dans l'{violet}agent{/violet} : la capacité de chauffer dans le feu, l'art de bâtir dans le bâtisseur | dans le {violet}patient{/violet} : « le gras peut brûler, ce qui est fragile de telle façon peut être broyé » |
    | Pourquoi | l'agent possède le principe du changement | le patient possède « un certain principe », et « la matière aussi est un certain principe » (1046a23) |

    « En tant qu'unité organique, aucun être n'est affecté par lui-même, car il est un et non un autre » (1046a28-29) : {coral}agent et patient doivent être distincts, ou le même sujet en tant qu'autre{/coral}.

    **{sky}Makin{/sky} précise.** Une puissance est « dans » l'objet dont les propriétés fixent qu'elle existe : la puissance de brûler est dans ce qui est gras parce que cela est gras. La matière n'est qu'un exemple de ces propriétés, et {red}rien n'autorise à identifier une puissance à une base matérielle{/red} : une propriété formelle peut tenir ce rôle (un ballon peut être poussé à cause de sa forme). {sky}Makin{/sky} relève enfin une tension : Aristote localise symétriquement chaque puissance dans son porteur, alors que l'analyse focale fait dépendre la puissance passive de la puissance active ; il ne suffit pas de dire qu'une puissance dépend à la fois de son porteur et d'autres objets pour la lever.

    ! « En un sens, il y a une puissance unique de produire et d'être affecté » ne veut pas dire que les deux puissances s'identifient complètement.
