- id: theta1-l1
  title: "Θ1 : la puissance au sens le plus propre"
  notes: |-
    **Aristote commence par la puissance au sens le plus propre (`kuriôtata`), {green}la capacité liée au changement, tout en avertissant qu'elle n'est pas la plus utile pour ce qu'on cherche à présent{/green} (1045b36-1046a1).** Le but ultime est le rapport de la matière et de la substance. La réserve se comprend, selon {sky}Makin{/sky}, parce que les êtres vivants comptent parmi les plus importants, et que leur actualité consiste à vivre, ce qui n'est pas un changement orienté vers une fin extérieure, comme bâtir ou apprendre (Θ6). {coral}La capacité de changement n'épuise donc pas les cas d'être en puissance{/coral}.

    {amber}**Deux arguments soutiennent ce point de départ.**{/amber} Le premier va du plus clair au plus obscur : le rapport d'une capacité de changement à son exercice est le cas le plus familier, et ses règles éclaireront par analogie le rapport de la forme et de la matière. Le second écarte d'abord les emplois homonymes de `dunamis`, qui ne reposent que sur une ressemblance verbale accidentelle.

    | Emploi homonyme écarté | Exemple |
    | mathématique | {yellow}la « puissance » d'une ligne (ses carrés){/yellow} |
    | le possible qui découle de ce qui est (1046a7-9) | si A fait quelque chose, A peut le faire, sans supposer de capacité chez A |

    L'homonymie désigne des choses que le même mot recouvre de façon accidentelle : {yellow}en français, « souris » (l'animal, l'accessoire d'ordinateur){/yellow}, car ce qu'est être une souris n'est pas la même chose dans les deux cas. Les commentateurs divergent sur le nombre de cas visés, la géométrie seule ou deux emplois ; {sky}Makin{/sky} en retient deux, comme en Δ12. {green}La puissance cherchée est un principe réel, qui réside dans un sujet{/green}.

    ! La puissance liée au changement n'est qu'un point de départ : la notion s'étend bien au-delà du changement physique.
  points:
  - id: theta1-l1-p1
    sentence: "__Aristote commence le livre Θ par la puissance au sens le plus__ ___ (`kuriôtata`) : **la capacité liée au changement**."
    answer: "propre"
