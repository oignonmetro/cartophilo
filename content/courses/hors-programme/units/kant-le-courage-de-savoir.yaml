- id: kant-le-courage-de-savoir-l8
  title: "Le prince éclairé et la liberté religieuse"
  notes: |-
    **Le prince qui tient pour un devoir de ne rien prescrire aux hommes en matière de religion, et récuse jusqu'au nom hautain de tolérance, est lui-même éclairé : il a le premier délivré le genre humain de la tutelle, du moins du côté du gouvernement.**

    Le mot « devoir » compte : le prince fait un usage éclairé de sa raison et suit la loi morale qu'il s'est prescrite. Récuser le nom de tolérance, c'est refuser la position de celui qui accorderait une permission : la liberté de conscience est due, non concédée.

    ! La tolérance n'est pas l'idéal de Kant : elle suppose encore un maître qui tolère.
  passage:
    label: "§8"
    text: "Un prince qui ne trouve pas indigne de lui de dire qu'il tient pour un devoir de ne rien prescrire aux hommes dans les choses de la religion, mais de leur laisser entière liberté en la matière, qui va jusqu'à récuser le nom hautain de tolérance est lui-même éclairé et mérite d'être glorifié par le monde contemporain et la postérité reconnaissants comme celui qui le premier a délivré le genre humain de l'état de tutelle, du moins pour ce qui est du gouvernement, et à avoir laissé chacun libre de se servir de sa propre raison pour toutes les questions de conscience."
