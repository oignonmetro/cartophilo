  - id: kant-le-courage-de-savoir-l1-p60
    sentence: "La liberté de culte : la position de Kant sur la liberté de culte et de pensée va plus loin que la ___, qu'il considère comme insuffisante. Pour lui la religion est avant tout une affaire individuelle. Au-delà des dogmes et des autorités, elle doit être motivée par une conviction absolument intérieure. C'est seulement sur cette base que peut s'établir un véritable rapport de respect. Cependant, cela n'empêche pas, au contraire, que croyants ou savants s'interrogent publiquement sur la place et l'organisation des différentes confessions ou qu'ils prennent éventuellement position en leur nom."
