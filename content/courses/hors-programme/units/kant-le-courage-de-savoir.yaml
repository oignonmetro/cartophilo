- id: kant-le-courage-de-savoir-l10
  title: "« Raisonnez, mais obéissez » : le paradoxe de la liberté civile"
  notes: |-
    **Seul un prince éclairé, qui assure l'ordre public, peut dire ce qu'un État libre n'oserait pas : raisonnez autant que vous voulez et sur ce que vous voulez, mais obéissez !**

    Le paradoxe : un degré supérieur de liberté civile semble favorable à la liberté de l'esprit, mais lui impose des bornes infranchissables ; un degré moindre lui ménage l'espace où s'épanouir. Kant se méfie de la démocratie (pression de la majorité, conformisme) et mise sur un progrès lent, guidé par une élite éclairée. À la fin de l'opuscule, l'homme, désormais plus qu'une machine, doit être traité conformément à sa dignité, comme une fin en soi.

    ! Le paradoxe n'est pas un éloge du despotisme : il dit que la liberté de penser peut précéder la liberté civile, et la préparer.
  passage:
    label: "§10"
    text: "seul celui qui, lui-même éclairé, [...] [peut] maintenir l'ordre public peut dire ce qu'un État libre ne peut oser dire : raisonnez autant que vous voulez et sur ce que vous voulez ; mais obéissez ! Un degré supérieur de liberté civile semble bénéfique à la liberté de l'esprit du peuple et lui impose cependant des bornes infranchissables ; un moindre degré de liberté civile ménage en revanche l'espace où il s'épanouira autant qu'il est son pouvoir."
