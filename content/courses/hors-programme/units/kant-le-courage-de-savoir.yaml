    | Année | Événement |
    | 1724 | naissance de Kant à Königsberg |
    | 1739 | Hume, *Traité de la nature humaine* |
    | 1740-1786 | règne de Frédéric II |
    | 1747 | premier ouvrage de Kant |
    | 1748 | Hume, *Enquête sur l'entendement humain* |
    | 1751 | premier volume de l'*Encyclopédie* |
    | 1762 | Rousseau, *Émile* et *Du Contrat social* |
    | 1774 | début du règne de Louis XVI |
    | 1781 | *Critique de la raison pure* |
    | 1784 | *Qu'est-ce que les Lumières ?* |
    | 1788 | *Critique de la raison pratique* |
    | 1789 | Révolution française |
    | 1796 | Kant cesse d'enseigner |
    | 1804 | mort de Kant |

    ! Le texte précède la Révolution française : sa méfiance envers la révolution (§4) n'est pas un commentaire de 1789.
