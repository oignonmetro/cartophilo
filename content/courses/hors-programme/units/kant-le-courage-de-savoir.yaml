- id: kant-le-courage-de-savoir-l6
  title: "Nulle époque ne peut lier la suivante"
  notes: |-
    **Une époque ne peut empêcher la suivante d'étendre ses connaissances et de progresser dans les Lumières : ce serait un crime contre la nature humaine, dont la destination originelle est précisément ce progrès.**

    S'entendre sur une constitution religieuse que personne ne pourrait publiquement mettre en doute, même pour la durée d'une vie, est absolument interdit : cela rendrait une époque stérile et nuirait aux descendants, qui seraient en droit de rejeter de telles décisions. Aucune autorité ne peut fixer de règles définitives : le progrès se fait par amélioration progressive plutôt que par révolution.

    ! Ajourner n'est pas renoncer : on peut, pour soi et pour un temps, remettre les Lumières à plus tard ; y renoncer, surtout pour ses descendants, c'est fouler aux pieds les droits sacrés de l'humanité.
  passage:
    label: "§6"
    text: "Une époque ne peut se liguer et jurer de mettre la suivante dans un état où il lui sera nécessairement impossible d'étendre ses connaissances (surtout celles qui lui importent au plus haut point), d'en éliminer les erreurs, et en général de progresser dans les Lumières. Ce serait un crime contre la nature humaine, dont la destination originelle consiste précisément en cette progression ; et les descendants sont donc parfaitement en droit de rejeter ces décisions au motif qu'elles ont été prises de manière illégitime et scélérate. Mais s'entendre sur une constitution religieuse ferme, qui ne puisse publiquement être mise en doute par personne, ne fût-ce que pendant la durée d'une vie humaine, et par là même pour ainsi dire empêcher qu'une époque ne voie l'humanité s'améliorer progressivement, et la rendre stérile, et ce faisant tout à fait préjudiciable aux descendants, est absolument interdit. Un homme peut, certes, pour sa personne, et même alors pour quelque temps seulement, ajourner les Lumières quant à ce qui lui incombe de savoir ; mais y renoncer, que ce soit pour sa personne, mais plus encore pour les descendants, c'est attenter aux droits sacrés de l'humanité et les fouler aux pieds."
