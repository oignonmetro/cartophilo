  - id: kant-le-courage-de-savoir-l4-p26
    sentence: "S'il est toujours difficile pour un individu de s'émanciper et de parvenir à un usage vraiment autonome de son jugement, la chose est plus concevable et plus probable pour un « public » ___. Les Lumières, tout en cultivant l'exigence individuelle de penser par soi-même, sont en fait un progrès essentiellement collectif, une manière de penser qui est appelée à se diffuser. Cela passe notamment par les écrits et par le développement d'une communauté de savants et de lecteurs, qui crée un espace commun de jugement. C'est aussi un espace cosmopolite (de « savants ») qui s'étend au-delà des frontières des États."
    answer: "lettré"
    alt: []
  - id: kant-le-courage-de-savoir-l4-p27
    sentence: "Le rôle des tuteurs : au début, les tuteurs (les autorités intellectuelles, religieuses, ou politiques) imposent au public un ensemble de croyances, de normes et de préjugés qui maintiennent le peuple dans un état de soumission intellectuelle. Le public est encouragé à ne pas penser par lui-même et à accepter passivement les idées diffusées. Ce point se lit au § ___ de *Qu'est-ce que les Lumières ?*."
    answer: "1"
    alt: []
  - id: kant-le-courage-de-savoir-l4-p28
    sentence: "L'habitude et la dépendance du public : en étant constamment maintenu dans cet état de dépendance intellectuelle, le public finit par intérioriser cette manière de fonctionner. Il devient difficile pour les individus de penser par eux-mêmes car ils sont habitués à être guidés, à ne pas remettre en question l'autorité. Cela crée une forme de paresse intellectuelle où la remise en question des croyances établies paraît non seulement difficile, mais aussi dangereuse ou inconfortable. Ce point se lit aux § ___ de *Qu'est-ce que les Lumières ?*."
    answer: "2-3"
    alt: []
  - id: kant-le-courage-de-savoir-l4-p29
    sentence: "La résistance au changement : une fois que ces habitudes de soumission sont bien ancrées, le public tend à rejeter toute tentative d'émancipation intellectuelle. Lorsque certaines voix éclairées, y compris parmi les tuteurs eux-mêmes, commencent à prôner la libération de cette dépendance (l'accès aux Lumières), le public, habitué à la sécurité de ses croyances et de son ignorance, résiste à cette tentative d'émancipation. Le public devient méfiant ou même hostile envers toute idée nouvelle qui menace l'ordre établi. Ce point se lit au § ___ de *Qu'est-ce que les Lumières ?*."
    answer: "4"
    alt: []
  - id: kant-le-courage-de-savoir-l4-p30
    sentence: "Les tuteurs dans l'état ironique de tutelle : ce qui est ironique, selon Kant, c'est que ces tuteurs, qui avaient initialement imposé cet état de dépendance, se retrouvent eux-mêmes piégés par les croyances qu'ils ont diffusées. Le public, ayant intériorisé ces préjugés, en vient à contraindre les tuteurs à continuer de maintenir le même système. Même si certains tuteurs souhaitent désormais sortir de ce cadre, le public, maintenant attaché à ses habitudes intellectuelles, exerce une pression inverse pour maintenir le statu quo. Cela se produit particulièrement quand certains tuteurs (qui sont eux-mêmes incapables de penser de manière éclairée) encouragent le public à rester dans cet état, par peur de perdre leur propre pouvoir ou par incapacité à sortir eux-mêmes de l'obscurité. Ce point se lit au § ___ de *Qu'est-ce que les Lumières ?*."
    answer: "4"
    alt: []
- id: kant-le-courage-de-savoir-l5
  title: "Usage public et usage privé de la raison"
  notes: |-
    **Pour répandre les Lumières, il suffit de la plus inoffensive des libertés : faire un usage public de sa raison. L'usage public doit toujours être libre ; l'usage privé peut être étroitement limité.**

    Partout on entend : ne raisonnez pas ! (l'officier, le conseiller du fisc, le prêtre). Un seul maître dit : raisonnez autant que vous voulez, mais obéissez !

    | Qui | En usage privé, il… | En usage public, comme savant, il… |
    | l'officier | exécute l'ordre | critique les fautes commises à la guerre |
    | le citoyen | paie l'impôt | écrit contre l'injustice des impositions |
    | le prêtre | enseigne le symbole de son Église | propose de le corriger |

    Le prêtre qui prêche parle au nom d'un autre (« notre Église enseigne ceci ») : sa paroisse n'est qu'un rassemblement familial. S'il trouvait dans le symbole quelque chose de contraire à sa religion intérieure, il devrait se démettre.

    ! Le sens est l'inverse de l'usage courant : l'usage « privé » est celui du fonctionnaire, même devant une foule ; l'usage « public », celui de l'écrivain qui s'adresse au monde.
  passage:
    label: "§5"
    text: "Mais pour propager ces Lumières, il n'est rien requis d'autre que la liberté ; et la plus inoffensive parmi tout ce qu'on nomme liberté, à savoir celle de faire un usage public de sa raison sous tous les rapports. Or j'entends de tous côtés cet appel : ne raisonnez pas ! L'officier dit : ne raisonnez pas mais faites les manœuvres ! Le conseiller au département du fisc dit : ne raisonnez pas mais payez ! Le prêtre : ne raisonnez pas mais croyez ! (Un seul maître au monde dit raisonnez autant que vous voulez et sur ce que vous voulez, mais obéissez !) Ici il y a partout limitation de la liberté. Mais quelle limitation fait obstacle aux Lumières ? Quelle autre ne le fait pas mais leur est au contraire favorable ? Je réponds : l'usage public de sa raison doit toujours être libre et il est seul à pouvoir apporter les Lumières parmi les hommes ; mais son usage privé peut souvent être très étroitement limité sans pour autant entraver notablement le progrès des Lumières. Mais je comprends par usage public de sa propre raison celui qu'en fait quelqu'un, en tant que savant, devant l'ensemble du public qui lit. J'appelle usage privé celui qu'il lui est permis de faire de sa raison dans une charge civile qui lui a été confiée ou dans ses fonctions. Or, pour maintes activités qui touchent à l'intérêt de la communauté, un certain mécanisme est nécessaire au moyen duquel quelques membres de la communauté doivent se comporter de manière purement passive afin d'être dirigés, en vertu d'une unanimité artificielle, par le gouvernement vers des fins publiques ou, du moins, d'être empêchés de détruire ces fins. Sans doute n'est-il alors pas permis de raisonner ; on est obligé d'obéir. Ainsi, il serait très pernicieux qu'un officier qui reçoit un ordre de ses supérieurs veuille, lorsqu'il est en exercice, ratiociner à voix haute sur le bien-fondé ou l'utilité de cet ordre ; il est obligé d'obéir. Mais on ne peut équitablement lui défendre de faire, en tant que savant, des remarques sur les fautes commises dans l'exercice de la guerre et de les soumettre au jugement de son public. Le citoyen ne peut se refuser à payer les impôts dont il est redevable ; une critique déplacée de telles charges, quand il doit lui-même les payer, peut même être punie comme scandale (susceptible de provoquer des actes d'insoumission généralisés). Néanmoins celui-là même ne contrevient pas au devoir d'un citoyen s'il exprime publiquement, en tant que savant, ses pensées contre l'incongruité ou l'illégitimité de telles impositions. De même un prêtre est tenu de faire son exposé à des catéchumènes et à sa paroisse selon le symbole de l'Église qu'il sert, car c'est à cette condition qu'il a été engagé. Mais, en tant que savant, il a pleine liberté, et c'est même sa vocation, de communiquer à son public les pensées soigneusement examinées et bien intentionnées qu'il a conçues sur les imperfections de ce symbole ainsi que des propositions en vue d'une meilleure organisation des affaires religieuses et ecclésiastiques. A cet égard il n'y a rien non plus qui puisse être imputé à sa conscience. Car ce qu'il enseigne par suite de ses fonctions, comme mandataire de l'Église, il le présente comme quelque chose qu'il n'a pas le pouvoir d'enseigner comme bon lui semble mais qu'il s'est chargé d'exposer selon des instructions et au nom d'un autre. Il dira : notre Église enseigne ceci ou cela ; voici les arguments dont elle se sert. Il tire alors pour sa paroisse tout le profit pratique de préceptes auxquels il ne souscrirait pas lui-même en toute conviction mais qu'il peut toutefois prétendre exposer parce qu'il n'est pas tout à fait impossible qu'une vérité cachée ne s'y trouve, mais qu'en tout cas ne s'y rencontre rien qui contredise la religion intérieure. Car s'il croyait que quelque chose de tel s'y trouve, il ne pourrait en toute conscience assumer ses fonctions ; il devrait s'en démettre. Donc, l'usage qu'un professeur en exercice fait de sa raison devant sa paroisse est simplement un usage privé, parce que celle-ci n'est jamais qu'un rassemblement familial quelle que soit son importance ; et, à cet égard, il n'est pas libre, en tant que prêtre, et il ne lui est pas non plus permis de l'être, parce qu'il s'acquitte d'une mission venant de l'extérieur. En revanche, en tant que savant qui, par des écrits, s'adresse au public proprement dit, c'est-à-dire au monde, le prêtre jouit par suite, dans l'usage public de sa raison, d'une liberté illimitée de se servir de sa propre raison et de parler en son propre nom."
