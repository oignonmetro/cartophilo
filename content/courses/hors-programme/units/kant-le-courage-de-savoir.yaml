- id: kant-le-courage-de-savoir-i5
  title: "Le public, les tuteurs et l'usage de la raison"
  notes: |-
    **Penser par soi-même n'est pas se replier sur une liberté intérieure : c'est exposer publiquement ses pensées, dans un espace où tous peuvent, au moins en droit, confronter leurs jugements.**

    Le « public » n'est pas le peuple, mais une avant-garde cultivée qui se forme autour de la publication et de la lecture des écrits de tuteurs éclairés. Les tuteurs ont un rôle ambigu : ceux dont il faut se libérer, mais aussi les précurseurs qui invitent leur public à s'éclairer.

    | Usage de la raison | Ce qu'il est |
    | privé | celui d'un rouage : le professeur qui suit le programme, l'officier qui obéit, le prêtre en chaire |
    | public | celui du savant qui s'adresse par écrit à tout le public : il fait du sujet un citoyen |

    Pour les savoirs spécialisés, s'en remettre à un expert n'a rien d'avilissant (le pont) ; mais la religion et le droit concernent tout homme en tant qu'homme. Contre les stoïciens, Kant refuse une liberté purement intérieure.

    ! Le rationalisme de Kant n'est pas un individualisme : on ne pense vraiment par soi-même qu'en confrontant son jugement à celui des autres.
  passage:
    label: "Introduction"
  points:
  - id: kant-le-courage-de-savoir-l1-p48
    sentence: "L'autonomie en société : penser par soi-même, ce n'est pas se replier sur soi, sur une liberté de pensée purement intérieure. C'est tout au contraire exposer ses pensées dans l'___, les soumettre à la critique et au débat. C'est pourquoi, loin de cultiver l'___, Kant donne à son propos une dimension sociale et politique, en se demandant ce que signifie, pour les peuples, « s'éclairer »."
    answer: "espace public ; individualisme"
    alt: []
  - id: kant-le-courage-de-savoir-l1-p49
    sentence: "Le public doit-il se libérer de ses tuteurs ? L'invitation de Kant à se libérer des « tuteurs » ne signifie pas qu'il ne faut pas du tout leur obéir. En fait, c'est d'abord des tuteurs eux-mêmes qu'on peut attendre qu'ils s'éclairent et, tels des ___, invitent d'eux-mêmes le public qui les écoute à se libérer de leur tutelle, à s'éclairer par eux-mêmes. Dès lors, si le mouvement des Lumières doit se diffuser de haut en bas, il importe en effet que le public obéisse à ses tuteurs, du moins pour ne pas leur obéir sur le reste."
    answer: "précurseurs"
    alt: []
  - id: kant-le-courage-de-savoir-l1-p50
    sentence: "Dans *Qu'est-ce que les Lumières ?*, le terme « ___ » désigne non pas le peuple, mais seulement une avant-garde cultivée se constituant autour de la publication, de l'échange et de la lecture des écrits de tuteurs éclairés."
    answer: "public"
    alt: []
  - id: kant-le-courage-de-savoir-l1-p51
    sentence: "Se libérer et obéir : Kant essaie de concilier un impératif radical d'autonomie dans la pensée avec le constat qu'une société ne peut fonctionner qu'en exigeant de ses membres, dans presque toutes les sphères de l'existence, l'obéissance à différentes sortes d'autorités. On comprend alors pourquoi Kant insiste dans *Qu'est-ce que les Lumières ?* sur le rôle ambigu des « ___ » : ils ne sont pas seulement ceux dont il faut se libérer, mais aussi ceux qui doivent jouer le rôle d'avant-garde éclairée et éclairant son public."
    answer: "tuteurs"
    alt: []
  - id: kant-le-courage-de-savoir-l1-p52
    sentence: "La liberté de pensée : à l'encontre des stoïciens qui affirment que les individus disposent d'une liberté de conscience, indépendante des situations sociales et politiques qui peuvent les contraindre, Kant refuse de séparer les deux sphères. Loin d'y voir une réalité purement subjective et intérieure, il insiste sur le fait que l'usage libre de sa propre raison doit s'exprimer ___ et ouvertement, notamment à travers des écrits ou des livres."
    answer: "publiquement"
    alt: []
  - id: kant-le-courage-de-savoir-l1-p53
    sentence: "L'___ de la raison est un concept qui désigne, dans *Qu'est-ce que les Lumières ?*, la forme de pensée ou de discours qui convient à un citoyen lorsqu'il n'est que le rouage d'un mécanisme qui le dépasse : par exemple, un professeur qui suit le programme scolaire, un militaire qui obéit aux ordres, un prêtre qui prononce un sermon dans sa paroisse, etc."
    answer: "usage privé"
    alt: []
  - id: kant-le-courage-de-savoir-l1-p54
    sentence: "Lorsque Kant parle, dans *Qu'est-ce que les Lumières ?*, d'un usage ___ (ou mécanique) de la raison, ou lorsqu'il dit qu'un fonctionnaire est un « rouage » de l'État, cela veut dire que sa rationalité est mise au service de finalités qui le dépassent. L'usage libre et public de la raison lui permet alors d'interroger les principes mêmes et le but du gouvernement : c'est ce qui lui donne une « dignité », fait de lui un citoyen (et non pas un sujet)."
    answer: "privé"
    alt: []
  - id: kant-le-courage-de-savoir-l1-p64
    sentence: "Sur quoi les Lumières doivent-elles se diffuser ? Pour Kant, il est manifeste que la coopération des hommes suppose des techniques ou des savoirs ___ : chacun se trouve donc ignorant en dehors de son propre domaine. Ainsi, la construction d'un pont est assurée par un expert, les autres hommes, dans leur ignorance, lui faisant confiance sans qu'il y ait là pour eux rien d'avilissant ou de dégradant. Toutefois, la religion et le droit concernent tout homme en tant qu'homme ; c'est pourquoi nul ne saurait ici se contenter de s'en remettre à la compétence d'un spécialiste, à moins de rester mineur et, se soumettant à un tuteur, de renoncer à sa dignité humaine."
    answer: "spécialisés"
    alt: []
  - id: kant-le-courage-de-savoir-l1-p65
    sentence: "Un rationalisme individualiste ? Le rationalisme que défend Kant dans *Qu'est-ce que les Lumières ?* ne correspond pas vraiment à un individualisme, et on ne peut véritablement « penser par soi-même » qu'en confrontant ses jugements à ceux d'autrui, et potentiellement à ceux de tout homme. Certes, Kant donne à ___ une place centrale dans la société, en le rendant dans une large mesure libre de croire, de juger et d'agir comme il l'entend. Ainsi place-t-il l'autonomie de la volonté au cœur de sa philosophie morale : agir moralement, c'est obéir à une loi qui ne peut venir que de moi-même, de ma propre raison, plutôt que d'autorités extérieures ou de désirs que je ne contrôle pas."
    answer: "l'individu"
    alt: []
  - id: kant-le-courage-de-savoir-l1-p66
    sentence: "Un rationalisme individualiste ? Certes, Kant donne à l'individu une place centrale dans la société, en le rendant dans une large mesure libre de croire, de juger et d'agir comme il l'entend. Cependant, pour éviter que cet individualisme mène à une forme de relativisme, Kant insiste sur l'importance d'un « usage public » de la raison. Si chacun doit penser par soi-même, critiquer, défendre ses opinions, il doit le faire en lien avec un ___ public où tous peuvent, au moins en droit, confronter leurs jugements."
    answer: "espace"
    alt: []
- id: kant-le-courage-de-savoir-l1
  title: "Sapere aude : sortir de l'état de tutelle"
  notes: |-
    **Les Lumières sont la sortie de l'homme hors de l'état de tutelle dont il est lui-même responsable : l'incapacité de se servir de son entendement sans la conduite d'un autre.**

    On est responsable de cet état quand la cause n'est pas un manque d'entendement, mais un manque de résolution et de courage. D'où la devise : *Sapere aude*, « Aie le courage de te servir de ton propre entendement ! ».

    | Notion | Ce que c'est |
    | l'état de tutelle | ne pas se servir de son entendement sans la conduite d'un autre |
    | sa cause | non un manque d'entendement, mais de résolution et de courage |
    | les Lumières | la sortie de cet état |

    ! La tutelle n'est pas une incapacité naturelle : c'est parce qu'on pourrait penser seul qu'on en est responsable.
  passage:
    label: "§1"
    text: "Les Lumières, c'est la sortie de l'homme hors de l'état de tutelle dont il est lui-même responsable. L'état de tutelle est l'incapacité de se servir de son entendement sans la conduite d'un autre. On est soi-même responsable de cet état de tutelle quand la cause tient non pas à une insuffisance de l'entendement mais à une insuffisance de la résolution et du courage de s'en servir sans la conduite d'un autre. Sapere aude ! Aie le courage de te servir de ton propre entendement ! Voilà la devise des Lumières."
