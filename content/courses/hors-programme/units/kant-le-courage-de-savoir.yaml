    sentence: "« Cependant, nous avons des indices évidents qu'ils ont le champ libre pour travailler dans cette direction et que les obstacles à la généralisation des Lumières, ou à la sortie de cet état de tutelle dont ils sont eux-mêmes responsables, se font de moins en moins nombreux. A cet égard, cette époque est l'époque des Lumières, ou le siècle de ___. »"
