- id: kant-le-courage-de-savoir-l7
  title: "Une époque de Lumières, non une époque éclairée"
  notes: |-
    **Nous ne vivons pas dans une époque éclairée, mais dans une époque de Lumières : le siècle de Frédéric.**

    Les hommes ne savent pas encore se servir de leur entendement avec assurance, surtout en matière de religion ; mais le champ leur est ouvert et les obstacles diminuent. Juger son époque, c'est juger le règne de Frédéric II : despotique, mais favorable aux sciences, aux arts, à une certaine liberté religieuse et à la liberté d'expression. La liberté civile restreinte n'y fait pas obstacle, pourvu que se développe un espace public.

    ! « Époque de Lumières » désigne un processus en cours, non un état atteint.
  passage:
    label: "§7"
    text: "Si on pose à présent la question : vivons-nous maintenant dans une époque éclairée ? la réponse est : non, mais bien à une époque de Lumières. Il s'en faut encore de beaucoup que les hommes dans leur ensemble, en l'état actuel des choses, soient déjà, ou puissent seulement être mis en mesure de se servir dans les choses de la religion de leur entendement avec assurance et justesse sans la conduite d'un autre. Cependant, nous avons des indices évidents qu'ils ont le champ libre pour travailler dans cette direction et que les obstacles à la généralisation des Lumières, ou à la sortie de cet état de tutelle dont ils sont eux-mêmes responsables, se font de moins en moins nombreux. A cet égard, cette époque est l'époque des Lumières, ou le siècle de Frédéric."
  points:
  - id: kant-le-courage-de-savoir-l7-p1
    fragment: "1/2"
    sentence: "« Si on pose à présent la question : vivons-nous maintenant dans ___ ? la réponse est : non, mais bien à ___. Il s'en faut encore de beaucoup que les hommes dans leur ensemble, en l'état actuel des choses, soient déjà, ou puissent seulement être mis en mesure de se servir dans les choses de la religion de leur entendement avec assurance et justesse sans la conduite d'un autre. »"
