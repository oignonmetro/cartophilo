  - id: kant-le-courage-de-savoir-l1-p62
    sentence: "La critique de la tolérance religieuse : pour Kant, il ne peut y avoir au fond qu'une seule ___, liée à l'idée rationnelle de Dieu et à la disposition morale de l'homme en général. Il la distingue des différentes ___, liées à des textes et à une foi révélée, comme le judaïsme, le catholicisme ou le protestantisme. Celui qui raisonne du point de vue de la religion n'a pas à « tolérer » l'existence d'autres cultes, puisque tous les individus, d'un point de vue rationnel, devraient se rejoindre au fond dans une seule « religion » (comprise ici comme ensemble de croyances morales qui relient les individus par leur universalité)."
