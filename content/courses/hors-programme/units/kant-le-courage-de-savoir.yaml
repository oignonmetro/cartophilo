- id: kant-le-courage-de-savoir-l2
  title: "Paresse et lâcheté : le confort de la tutelle"
  notes: |-
    **Paresse et lâcheté expliquent que tant d'hommes, que la nature a pourtant affranchis, restent volontiers toute leur vie sous tutelle, et qu'il soit si facile à d'autres de se poser en tuteurs.**

    La tutelle est confortable : un livre qui a de l'entendement à ma place, un directeur de conscience, un médecin qui juge de mon régime ; je paie, d'autres pensent pour moi. Les tuteurs entretiennent cet état : après avoir abêti leur bétail et l'avoir tenu dans la roulette d'enfant, ils lui montrent le danger de marcher seul. Le danger n'est pas si grand, puisqu'après quelques chutes on apprend à marcher ; mais l'exemple d'une chute dissuade de toute nouvelle tentative.

    ! La tutelle ne tient pas seulement aux tuteurs : elle tient aussi à la paresse et à la lâcheté de ceux qui l'acceptent.
  passage:
    label: "§2"
    text: "Paresse et lâcheté sont les causes qui font qu'un si grand nombre d'hommes, après que la nature les eut affranchis depuis longtemps d'une conduite étrangère, restent cependant volontiers toute leur vie dans un état de tutelle ; et qui font qu'il est si facile à d'autres de se poser comme leurs tuteurs. Il est si commode d'être sous tutelle. Si j'ai un livre qui a de l'entendement à ma place, un directeur de conscience qui a de la conscience à ma place, un médecin qui juge à ma place de mon régime alimentaire, etc., je n'ai alors pas moi-même à fournir d'efforts. Il ne m'est pas nécessaire de penser dès lors que je peux payer ; d'autres assumeront bien à ma place cette fastidieuse besogne. Et si la plus grande partie, et de loin, des hommes (et parmi eux le beau sexe tout entier) tient ce pas qui affranchit de la tutelle pour très dangereux et de surcroît très pénible, c'est que s'y emploient ces tuteurs qui, dans leur extrême bienveillance, se chargent de les surveiller. Après avoir d'abord abêti leur bétail et avoir empêché avec sollicitude ces créatures paisibles d'oser faire un pas sans la roulette d'enfant où ils les avaient emprisonnés, ils leur montrent ensuite le danger qui les menace s'ils essaient de marcher seuls. Or, ce danger n'est sans doute pas si grand, car après quelques chutes ils finiraient bien par apprendre à marcher ; un tel exemple rend pourtant timide et dissuade d'ordinaire de toute autre tentative ultérieure."
  points:
  - id: kant-le-courage-de-savoir-l2-p1
    fragment: "1/4"
    sentence: "« Paresse et lâcheté sont les causes qui font qu'un si grand nombre d'hommes, après que la nature les eut affranchis depuis longtemps d'une conduite étrangère, restent cependant ___ toute leur vie dans un état de tutelle ; et qui font qu'il est si facile à d'autres de se poser comme leurs tuteurs. »"
