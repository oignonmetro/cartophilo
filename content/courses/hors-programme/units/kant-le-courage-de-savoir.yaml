  - id: kant-le-courage-de-savoir-l10-p6
    sentence: "L'arrivée des Lumières au peuple doit précéder la démocratie, et non l'inverse : pour Kant, l'extension des libertés civiles qui caractérise un régime démocratique n'entraîne pas automatiquement une amélioration de la liberté de pensée. Au contraire, une société avec plus de liberté civile pourrait poser des « ___ » à l'indépendance de l'esprit. Cette expression témoigne de la méfiance de Kant envers la démocratie, où la pression de la majorité, le conformisme, ou la persistance des préjugés sont des freins pour la pensée critique et autonome des individus."
    answer: "bornes infranchissables"
