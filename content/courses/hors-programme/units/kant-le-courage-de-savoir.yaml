    sentence: "Le respect des autres religions par pragmatisme politique : le règne de Frédéric II (1740-1786) se caractérise, d'un point de vue religieux, par son ___, le souverain s'étant d'abord préoccupé de ce que les différentes communautés religieuses pouvaient apporter à l'État sur le plan éducatif, politique, social ou même économique."
