  - id: kant-le-courage-de-savoir-l1-p39
    sentence: "La philosophie de la connaissance de Kant : la philosophie kantienne de la connaissance a pour projet de limiter l'influence des préjugés, des autorités, de la révélation, pour mettre en exercice ce pouvoir qu'a la raison humaine d'expliquer les phénomènes qui l'entourent par des lois. Bien sûr, le progrès scientifique n'est jamais le fait d'un seul individu ; c'est une œuvre ___ qui se transmet et s'enrichit de génération en génération, comme le montre le projet de l'___, dirigée par Diderot et d'Alembert, et publiée en plusieurs éditions, chaque fois augmentées, entre 1751 et 1772."
    answer: "collective ; Encyclopédie"
    alt: []
  - id: kant-le-courage-de-savoir-l1-p40
    sentence: "La philosophie de la connaissance de Kant : la philosophie kantienne de la connaissance a pour projet de limiter l'influence des préjugés, des autorités, de la révélation, pour mettre en exercice ce pouvoir qu'a la raison humaine d'expliquer les phénomènes qui l'entourent par des lois. Bien sûr, le progrès scientifique n'est jamais le fait d'un seul individu ; c'est une œuvre collective qui se transmet et s'enrichit de génération en génération, comme le montre le projet de l'Encyclopédie, dirigée par ___ et ___, et publiée en plusieurs éditions, chaque fois augmentées, entre 1751 et 1772."
    answer: "Diderot ; d'Alembert"
    alt: []
  - id: kant-le-courage-de-savoir-l1-p43
    sentence: "Comment savoir ce qui est bien ou mal ? Kant a apporté une réponse rationaliste à ce débat philosophique, en cherchant à donner à la moralité un fondement solide. Kant exclut les ___ moraux (tels que l'empathie ou la sympathie), car il les juge trop obscurs, fluctuants et relatifs, pour s'assurer de savoir absolument ce qui est bien ou mauvais. La foi religieuse, elle, est trop incertaine. Dans les *Fondements de la métaphysique des mœurs* (1785) et dans la *Critique de la raison pratique* (1788), Kant cherche à montrer que la ___ est la véritable source des principes moraux."
    answer: "sentiments ; raison"
    alt: []
  - id: kant-le-courage-de-savoir-l1-p44
    sentence: "Comment savoir ce qui est bien ou mal ? Dans les *Fondements de la métaphysique des mœurs* (1785) et dans la *Critique de la raison pratique* (1788), Kant cherche à montrer que la raison est la véritable source des principes moraux. Puisqu'ils émanent d'une raison impartiale, et non de désirs ou de sentiments personnels, on peut les reconnaître au fait qu'ils sont valables ___, pour tout individu, dans toute situation."
    answer: "universellement"
    alt: []
  - id: kant-le-courage-de-savoir-l1-p45
    sentence: "Comment savoir ce qui est bien ou mal ? Dans les *Fondements de la métaphysique des mœurs* (1785) et dans la *Critique de la raison pratique* (1788), Kant affirme qu'un fondement rationnel pour la moralité (la loi morale, valable universellement) a l'avantage d'avoir une ___ qu'on ne pourrait jamais attendre d'un désir ou d'un sentiment."
    answer: "impartialité"
    alt: []
  - id: kant-le-courage-de-savoir-l1-p46
    sentence: "Comment savoir ce qui est bien ou mal ? Dans la mesure où le devoir émane de la raison elle-même, il est alors reconnu comme légitime et souhaitable par le sujet. Le devoir n'est alors pas l'expression d'une contrainte, mais bien le principe de la ___."
    answer: "liberté"
