- id: kant-le-courage-de-savoir-l9
  title: "La religion, point essentiel des Lumières"
  notes: |-
    **Kant place le point essentiel des Lumières dans les choses de la religion : la tutelle y est la plus préjudiciable et la plus déshonorante, alors que les souverains n'ont pas intérêt à l'exercer sur les arts et les sciences.**

    Le chef d'État qui favorise les Lumières va plus loin : il laisse ses sujets critiquer publiquement jusqu'à sa législation et en proposer une meilleure rédaction. Frédéric II en donne un exemple qu'aucun monarque n'a dépassé.

    ! Critiquer publiquement les lois n'est pas désobéir : c'est l'usage public de la raison, qui laisse intacte l'obéissance.
  passage:
    label: "§9"
    text: "J'ai placé le point essentiel des Lumières, la sortie des hommes hors de l'état de tutelle dont ils sont eux-mêmes responsables, surtout dans les choses de la religion, parce que, au regard des arts et des sciences, nos souverains n'ont pas intérêt à exercer leur tutelle sur leurs sujets ; au reste, cet état de tutelle est, en même temps que le plus préjudiciable, le plus déshonorant de tous. Mais la manière de penser d'un chef d'État qui favorise les Lumières va encore plus loin et discerne que même au regard de sa législation, il est sans danger d'autoriser ses sujets de faire publiquement usage de leur propre raison et à exposer publiquement au monde leurs idées sur une meilleure rédaction de ladite législation, même si elles sont assorties d'une franche critique de celle qui est en vigueur ; nous en avons un exemple éclatant par lequel aucun monarque n'a encore dépassé celui que nous vénérons."
