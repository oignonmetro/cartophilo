    alt: []
  - id: kant-le-courage-de-savoir-l7-p3
    sentence: "L'actualité des Lumières : Kant s'interroge sur le statut de son époque, en se demandant si elle est elle-même « éclairée », c'est-à-dire si les Lumières y sont déjà à l'œuvre, et si donc on a raison de lui donner ce nom. Répondre à cette question implique de porter un jugement sur le pouvoir alors en place en Allemagne, soit sur le règne de Frédéric II. Bien qu'il s'agisse d'un pouvoir despotique, il peut, selon Kant, être considéré comme favorisant les Lumières, dans la mesure où il autorise et encourage le progrès des sciences et des arts, une certaine liberté en matière religieuse et la liberté d'expression. Le fait que cela va de pair avec une liberté ___ assez restreinte (c'est-à-dire la liberté proprement politique des citoyens) n'est pas nécessairement un obstacle, pourvu que se développe un espace public qui permette effectivement, et graduellement, la diffusion des Lumières."
    answer: "civile"
    alt: []
