  - id: kant-le-courage-de-savoir-l10-p7
    sentence: "Les Lumières ne sont pas un processus révolutionnaire : Kant ne pense pas qu'une démocratie véritable soit signe de progrès, car elle donnerait selon lui trop de pouvoir au peuple sans une préparation adéquate à la liberté de penser. Il craint que l'extension des libertés civiles qui est caractéristique des démocraties ne mène pas à l'émancipation intellectuelle, celles-ci pouvant fortement renforcer le ___, les pressions sociales, et l'emprise persistante de certaines tutelles. Kant se positionne donc en faveur d'un processus lent et progressif où une élite éclairée joue un rôle central pour guider la société vers un usage public, voire cosmopolite de la raison ; le peuple n'étant pas capable de mener par lui-même le mouvement des Lumières."
    answer: "conformisme"
    alt: []
  - id: kant-le-courage-de-savoir-l10-p8
    sentence: "Dans le §10, traiter l'être humain, qui est désormais plus qu'une machine, conformément à sa dignité, c'est le considérer comme une personne, c'est-à-dire comme ___ et non comme un moyen, comme un instrument mécanique au service des intentions d'autrui."
    answer: "une fin en soi"
    alt: []
  - id: kant-le-courage-de-savoir-l10-p9
    sentence: "D'après le §10, un État démocratique serait paradoxalement moins favorable à l'exercice public de la raison et à la liberté de pensée qu'un État qui, comme celui de Frédéric II, impose une obéissance politique, tout en laissant une grande latitude à ses sujets pour « ___ »."
    answer: "raisonner"
