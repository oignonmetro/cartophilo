- id: kant-le-courage-de-savoir-l4
  title: "Qu'un public s'éclaire lui-même, lentement"
  notes: |-
    **Qu'un public s'éclaire lui-même est plus probable, presque inévitable, pourvu qu'on lui laisse la liberté ; mais il n'accède aux Lumières que lentement.**

    Quelques esprits indépendants, même parmi les tuteurs, rejettent le joug et répandent autour d'eux l'estime de la vocation de tout homme à penser par soi-même. Mais les préjugés se vengent de leurs auteurs : le public mis sous le joug y retient ses tuteurs, à l'instigation de ceux qui sont eux-mêmes incapables de toute lumière. D'où la critique de la révolution : elle abat un despotisme, jamais elle ne réforme la manière de penser ; de nouveaux préjugés remplacent les anciens.

    Les Lumières sont ainsi un progrès collectif, qui passe par les écrits et par une communauté de savants et de lecteurs, un public lettré qui déborde les frontières des États.

    ! Kant ne condamne pas tout changement : il juge que la révolution change les maîtres sans changer les esprits.
  passage:
    label: "§4"
    text: "Mais qu'un public s'éclaire lui-même est plus probable ; cela est même presque inévitable pourvu qu'on lui accorde la liberté. Car il se trouvera toujours quelques êtres pensant par eux-mêmes, même parmi les tuteurs en exercice du grand nombre, pour rejeter eux-mêmes le joug de l'état de tutelle et pour propager ensuite autour d'eux l'esprit d'une appréciation raisonnable de la propre valeur et de la vocation de tout homme à penser par soi-même. À cet égard, il est singulier que le public, que les tuteurs avaient eux-mêmes mis auparavant sous ce joug, contraigne par la suite ceux-ci à y rester une fois qu'il y est incité par quelques-uns de ses tuteurs, qui sont eux-mêmes incapables de toute lumière ; tant il est pernicieux de cultiver des préjugés, car ils finissent par se venger de ceux-là mêmes qui en furent les auteurs, à moins que ce ne fussent leurs prédécesseurs. C'est pourquoi un public ne peut accéder que lentement aux Lumières. Par une révolution on peut bien obtenir la chute d'un despotisme personnel ou la fin d'une oppression reposant sur la soif d'argent ou de domination, mais jamais une vraie réforme du mode de penser ; mais au contraire de nouveaux préjugés serviront, au même titre que les anciens, à tenir en lisière ce grand nombre dépourvu de pensée."
