- id: kant-le-courage-de-savoir-l3
  title: "Pourquoi l'individu seul s'en sort mal"
  notes: |-
    **Pour l'individu seul, sortir de la tutelle est difficile : elle est devenue pour lui comme une nature, et il a pris goût à ses entraves.**

    On ne l'a jamais laissé s'essayer à penser ; les préceptes et les formules, instruments mécaniques, sont les entraves d'une tutelle permanente. Qui les rejetterait ne sauterait le plus étroit fossé qu'avec maladresse, faute d'habitude. Peu ont réussi, par le travail de leur propre esprit, à marcher d'un pas assuré.

    ! Le constat est pessimiste pour l'individu, non pour l'humanité : le paragraphe suivant place l'espoir dans le public.
  passage:
    label: "§3"
    text: "Il est donc difficile à chaque homme pris individuellement de s'arracher à l'état de tutelle devenu pour ainsi dire une nature. Il y a même pris goût et il est pour le moment vraiment dans l'incapacité de se servir de son propre entendement parce qu'on ne l'a jamais laissé s'y essayer. Les préceptes et les formules, ces instruments mécaniques d'un usage raisonnable ou plutôt d'un mauvais usage de ses dons naturels, sont les entraves d'un état de tutelle permanent. Qui les rejetterait ne sauterait par-dessus le plus étroit fossé qu'avec maladresse parce qu'il n'aurait pas l'habitude de se mouvoir aussi librement. Aussi, peu nombreux sont ceux qui ont réussi à se dépêtrer, par le propre travail de leur esprit, de l'état de tutelle et à marcher malgré tout d'un pas assuré."
