    sentence: "La formation religieuse de Kant : dans le piétisme, les fidèles, même laïcs, sont ainsi encouragés à lire et à commenter eux-mêmes les Écritures, notamment au sein de groupes de prière. Historiquement, ce courant a joué un grand rôle dans la promotion et la diffusion des Lumières ; il est évident qu'il n'est pas étranger à la réflexion de Kant, notamment lorsqu'il réfléchit à l'emprise des « ___ » et à la façon de s'en libérer, y compris dans la sphère religieuse."
    answer: "tuteurs"
    alt: []
  - id: kant-le-courage-de-savoir-l1-p55
    sentence: "Les Lumières face à la religion : la question religieuse est particulièrement problématique dans *Qu'est-ce que les Lumières ?*. Kant dit explicitement que l'émancipation de la raison dans ce domaine est « le point essentiel des Lumières », car c'est dans ce domaine que la mise sous tutelle des consciences est le plus flagrant, et le plus tentant pour l'État. Le contrôle des individus par la religion permet en effet d'exercer, au-delà de la contrainte extérieure, une contrainte intérieure qui peut être particulièrement efficace d'un point de vue politique, et pour maintenir un certain ordre social. C'est par exemple ce que Kant reprochera plus tard à ___ : alors même qu'il affichait une grande ouverture d'esprit en matière de religion, il aurait tenté d'en faire un instrument de pouvoir au service de l'État."
    answer: "Frédéric II"
    alt: []
  - id: kant-le-courage-de-savoir-l1-p56
    sentence: "La raison face à la religion : la question religieuse est particulièrement problématique dans *Qu'est-ce que les Lumières ?*. Kant dit explicitement que l'émancipation de la raison dans ce domaine est « ___ », car c'est dans ce domaine que la mise sous tutelle des consciences est le plus flagrant, et le plus tentant pour l'État. Le contrôle des individus par la religion permet en effet d'exercer, au-delà de la contrainte extérieure, une contrainte intérieure qui peut être particulièrement efficace d'un point de vue politique, et pour maintenir un certain ordre social."
    answer: "le point essentiel des Lumières"
    alt: []
  - id: kant-le-courage-de-savoir-l1-p57
    sentence: "La raison face à la religion : c'est en matière religieuse que Kant juge particulièrement difficile de faire valoir l'exigence de penser par soi-même : la religion nous soumet par définition aux commandements d'une autorité supérieure et toute-puissante, relayée en outre par des textes sacrés et des cultes institués dont il est difficile de contester la légitimité. Face à cette difficulté, la position de Kant est simple et radicale : le véritable étalon de nos devoirs, même en tant que croyants, est avant tout la « ___ » légitimée par notre raison. Si les commandements de cette loi peuvent correspondre ou non à ceux de la religion, c'est toujours à elle qu'il faut se référer en dernier ressort pour guider nos actions."
    answer: "loi morale"
    alt: []
  - id: kant-le-courage-de-savoir-l1-p58
    sentence: "La liberté de culte : politiquement, Kant salue l'attitude de ___ parce qu'il a su, malgré quelques tentatives de se servir de la religion, favoriser selon lui la liberté de pensée, de conscience et d'expression dans ce domaine. Pour Kant, l'État doit non seulement laisser les individus libres de leurs choix en matière de religion mais il doit aussi entretenir par rapport à ces questions un « esprit de liberté »."
    answer: "Frédéric II"
