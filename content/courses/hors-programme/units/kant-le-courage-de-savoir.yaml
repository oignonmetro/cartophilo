- id: kant-le-courage-de-savoir-i3
  title: "Le rationalisme des Lumières"
  notes: |-
    **La devise des Lumières exprime l'exigence d'autonomie du rationalisme des XVIIe et XVIIIe siècles : la raison comprend la nature par des lois, fonde la morale et légitime la loi politique.**

    | Domaine | Ce que la raison y fait |
    | connaissance | soumettre les phénomènes à des lois, contre la pensée magique et superstitieuse |
    | morale | donner une loi morale universelle et impartiale, plutôt que les sentiments ou la foi |
    | politique | faire obéir à la loi qu'on s'est prescrite, comme chez Rousseau |

    Dans la *Critique de la faculté de juger* (1790), les Lumières sont la libération des préjugés et de la superstition par la science. Le savoir est une œuvre collective, comme l'*Encyclopédie* de Diderot et d'Alembert (1751-1772). Le devoir, qui émane de la raison, est reconnu comme légitime par le sujet lui-même : être autonome, c'est se donner sa propre loi (*Fondements de la métaphysique des mœurs*, 1785 ; *Critique de la raison pratique*, 1788).

    ! Le devoir n'est pas une contrainte extérieure : venant de ma raison, il est le principe de ma liberté.
  passage:
    label: "Introduction"
  points:
  - id: kant-le-courage-de-savoir-l1-p30
    sentence: "La raison comme faculté centrale des Lumières : pour Kant, la devise des Lumières consiste en une exigence d'autonomie qui est caractéristique du ___ qui s'est développé au XVIIe et au XVIIIe siècle : l'homme a en lui le pouvoir de comprendre la nature, de soumettre les phénomènes à des lois, de les rapporter à des causes qu'il peut identifier et expliquer. Il ne doit donc pas s'en remettre à des explications magiques ou religieuses."
    answer: "rationalisme"
    alt: []
  - id: kant-le-courage-de-savoir-l1-p31
    sentence: "Le rationalisme moral : le rationalisme des Lumières s'applique aussi au domaine moral. Selon Kant, ce n'est pas par un vague sentiment du bien que nous sommes poussés à agir moralement ; ce n'est pas non plus (ou pas fondamentalement) par des croyances religieuses ; c'est avant tout par la représentation rationnelle d'un devoir qui nous impose d'agir selon des principes universels et non contradictoires, autrement dit selon une véritable « ___ ». C'est de cette façon que l'homme est libre : lorsque sa volonté n'est pas soumise à des autorités ou à des désirs qu'il ne contrôle pas, lorsqu'il suit sa propre ___."
    answer: "loi morale ; raison"
    alt: []
  - id: kant-le-courage-de-savoir-l1-p32
    sentence: "Le rationalisme politique : penser par soi-même, être autonome, a aussi un sens politique : c'est obéir non pas à un maître, mais à la loi que la réflexion rationnelle a dégagée et dont le sujet perçoit la légitimité. Cette obéissance à la loi n'est donc pas subie, étant donné qu'il souhaite qu'elle s'applique. Kant, grand lecteur de Rousseau, reprend la définition de la liberté comme autonomie, définition que ce dernier avait formulée dans *Du Contrat social* : « ___ est liberté » (I, 8)."
    answer: "l'obéissance à la loi qu'on s'est prescrite"
    alt: []
  - id: kant-le-courage-de-savoir-l1-p35
    sentence: "La formation scientifique de Kant : la formation intellectuelle de Kant a été largement marquée par l'étude des sciences, en particulier des mathématiques et de la physique newtonienne qu'il a découvertes à l'université de Königsberg. On peut y voir une source très puissante de son rationalisme. Pour Kant, penser par soi-même, c'est avant tout se libérer d'une pensée magique et ___, et postuler que la nature obéit à des lois cohérentes et explicables rationnellement."
    answer: "superstitieuse"
    alt: []
  - id: kant-le-courage-de-savoir-l1-p36
    sentence: "La formation scientifique de Kant : dans la *Critique de la faculté de juger* (1790), il définit les Lumières comme le fait de se libérer des préjugés et de la superstition par la ___ ; et il précise alors que « le plus grand de tous les préjugés consiste à se représenter la nature comme n'étant pas soumise à des règles que l'entendement [...] lui donne pour fondement », autrement dit de croire qu'on peut comprendre les phénomènes naturels autrement que par des explications rationnelles. Par conséquent, penser par soi-même, c'est avant tout se libérer d'une pensée magique et superstitieuse, et postuler que la nature obéit à des lois cohérentes et explicables ___."
    answer: "science ; rationnellement"
    alt: []
  - id: kant-le-courage-de-savoir-l1-p37
    sentence: "La formation scientifique de Kant : dans la *Critique de la faculté de juger* (1790), il définit ___ comme le fait de se libérer des préjugés et de la superstition par la science ; et il précise alors que « le plus grand de tous les préjugés consiste à se représenter la nature comme n'étant pas soumise à des règles que l'entendement [...] lui donne pour fondement », autrement dit de croire qu'on peut comprendre les phénomènes naturels autrement que par des explications rationnelles."
    answer: "les Lumières"
