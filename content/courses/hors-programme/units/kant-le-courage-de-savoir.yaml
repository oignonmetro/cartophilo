# Unité de texte (voir content/textes.md) : Kant, Réponse à la question :
# Qu'est-ce que les Lumières ? (1784). Cartes écrites par l'utilisatrice ;
# titres, rappels, présentation et leçons d'introduction (cartes de contexte)
# ajoutés ensuite.

id: kant-le-courage-de-savoir
title: "Kant : le courage de savoir"
subtitle: "Réponse à la question : Qu’est-ce que les Lumières ? (1784)"
icon: page
color: blue
intro: |-
  *Réponse à la question : Qu'est-ce que les Lumières ?* (1784) : Kant définit les Lumières comme la sortie de l'homme hors de l'état de tutelle dont il est lui-même responsable, et cherche comment un public peut s'éclairer, par la liberté de faire un usage public de sa raison.

  Dix paragraphes : la tutelle et le courage de s'en affranchir (§1-3), le public et l'usage public de la raison (§4-6), puis l'époque de Frédéric II (§7-10).
lessons:
- id: kant-le-courage-de-savoir-i1
  title: "Penser par soi-même"
  notes: |-
    **Penser par soi-même ne va pas de soi : nos opinions « personnelles » sont pour la plupart des préjugés, des croyances qui viennent de causes extérieures et non de notre propre jugement.**

    Les Lumières exigent de changer notre manière de penser plus que nos pensées : obéir à l'impératif socratique « Connais-toi toi-même », distinguer ce que nous croyons savoir de ce que nous savons réellement. Cela demande du courage, parce que tout pousse à adopter sans réfléchir les jugements d'autrui : des raisons subjectives (la paresse, la lâcheté) et des raisons plus objectives (l'emprise des tuteurs).

    ! Penser par soi-même ne veut pas dire s'abstraire de tous ses acquis : c'est s'affranchir des tutelles, y compris de celles qui nous ont d'abord aidés à penser.
  passage:
    label: "Introduction"
  points:
  - id: kant-le-courage-de-savoir-l1-p13
    sentence: "Pensons-nous par nous-mêmes ? Nous nous imaginons généralement que nos pensées sont nécessairement les nôtres et que nos croyances nous appartiennent en propre. Chacun tient à ce qu'il appelle ses opinions ___. Chacun « se croit », là est le problème. Comprendre cela suppose que nous osions d'abord mettre en question nos propres croyances, notre façon d'être vis-à-vis de nos croyances, notre attitude intérieure à l'égard de nous-mêmes."
    answer: "personnelles"
    alt: []
  - id: kant-le-courage-de-savoir-l1-p14
    sentence: "Comment admettre que la plupart de nos idées, de nos pensées, celles que nous appelons justement ___ ne sont pas vraiment nos pensées ? Qu'elles sont en nous des préjugés au sens fort : des croyances dont nous ne sommes pas maîtres et qui proviennent de causes extérieures et non de notre propre jugement."
    answer: "personnelles"
    alt: []
  - id: kant-le-courage-de-savoir-l1-p15
    sentence: "Penser par soi-même, c'est se faire violence. Parce que se demander si toutes nos pensées sont réellement personnelles, signifie qu'il faudra peut-être se séparer de ce qui nous est le plus cher, d'une véritable part de nous-mêmes. En fait, les Lumières exigent de nous que nous changions notre mode de penser plus que nos pensées. Devenir éclairé, c'est obéir à l'impératif ___ : « Connais-toi toi-même ! ». Nous apprenons ainsi à distinguer en nous-mêmes ce que nous croyons savoir de ce que nous savons réellement et à prendre conscience ainsi que la plupart de nos opinions ne sont qu'un semblant de connaissance. C'est découvrir qu'il va falloir changer, non pas simplement d'avis sur telle ou telle question, mais de façon de réfléchir et de se rapporter à soi-même."
    answer: "socratique"
    alt: []
  - id: kant-le-courage-de-savoir-l1-p42
    sentence: "Penser par soi-même, selon Kant, ne requiert pas de s'abstraire de tous ses acquis, mais d'adopter un rapport au monde par lequel on affirme le pouvoir qu'a la raison humaine de s'approprier le réel : chacun doit éprouver ce pouvoir par lui-même, en s'affranchissant des ___, y compris de celles qui l'ont au départ aidé à développer sa pensée."
    answer: "tutelles"
    alt: []
  - id: kant-le-courage-de-savoir-l1-p67
    sentence: "Dans un premier temps, Kant définit les Lumières, de façon générale, comme le fait, pour l'individu, de s'affranchir des autorités morales, religieuses ou intellectuelles, et de se libérer des préjugés qui orientent son jugement et le dispensent de penser par lui-même. Cela demande du courage parce qu'il y a toutes sortes de raisons d'adopter sans réfléchir des principes ou des jugements venus d'ailleurs : des raisons ___, comme la paresse ou la lâcheté ; et des raisons plus objectives, comme l'emprise de tous ceux qui se posent à plus ou moins juste titre comme des tuteurs pour ceux qui seraient incapables de penser par eux-mêmes."
    answer: "subjectives"
    alt: []
- id: kant-le-courage-de-savoir-i2
  title: "Repères chronologiques"
  notes: |-
