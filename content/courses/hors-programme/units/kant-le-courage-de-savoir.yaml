    sentence: "Comment savoir ce qui est bien ou mal ? Le devoir n'est pas l'expression d'une contrainte, mais le principe de la liberté. L'exigence de penser par soi-même correspond donc également, sur le plan moral, à l'exigence d'être ___, de se donner librement ses propres lois."
    answer: "autonome"
    alt: []
- id: kant-le-courage-de-savoir-i4
  title: "Les Lumières et la religion"
  notes: |-
    **La religion est le domaine où la tutelle est la plus flagrante et la plus tentante pour l'État : Kant y place « le point essentiel des Lumières ».**

    Né dans une famille piétiste, courant protestant qui fait passer la foi individuelle et la moralité avant les dogmes et invite à lire soi-même les Écritures, Kant juge que le véritable étalon de nos devoirs, même croyants, est la loi morale légitimée par la raison. Les cultes, fondés sur une autorité extérieure qu'on ne peut critiquer, peuvent devenir l'instrument d'une emprise à la fois sociale, morale et politique.

    | Notion | Sens |
    | religion | une seule, liée à l'idée rationnelle de Dieu et à la disposition morale de l'homme |
    | confessions | plusieurs, liées à des textes et à une foi révélée |
    | tolérance | insuffisante : on n'a pas à « tolérer » des croyances qui se rejoignent au fond |

    Frédéric II, pragmatique en matière religieuse, est salué pour la liberté qu'il a laissée, même si Kant lui reprochera d'avoir voulu faire de la religion un instrument de pouvoir.

    ! Kant ne réclame pas la tolérance, mais davantage : une liberté de conscience complète, et un « esprit de liberté » entretenu par l'État.
  passage:
    label: "Introduction"
  points:
  - id: kant-le-courage-de-savoir-l1-p33
    sentence: "La formation religieuse de Kant : Kant est né en 1724, à Königsberg, en Prusse orientale. Il a grandi dans une famille ___ : il s'agit d'un courant du protestantisme qui donne une grande importance à la foi individuelle et à la moralité, celles-ci devant passer avant le respect des dogmes religieux ou des cultes institués. Les fidèles sont ainsi encouragés à lire et à commenter eux-mêmes les Écritures, notamment au sein de groupes de prière."
    answer: "piétiste"
    alt: []
