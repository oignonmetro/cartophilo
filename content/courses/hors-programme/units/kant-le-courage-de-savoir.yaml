  - id: kant-le-courage-de-savoir-l5-p55
    sentence: "La liberté de pensée promue par les Lumières n'est possible qu'à la condition que soient garanties certaines libertés civiles, à savoir celles qui autorisent à faire un usage public de sa raison. Chacun doit pouvoir s'exprimer librement en tant que savant ou en tant qu'intellectuel sur les sujets qui touchent tout le monde. Cela n'empêche pas que, dans bien des cas, l'organisation des sociétés impose aux individus l'obéissance et le respect des autorités. Mais si chacun doit souvent obéir, comme soldat, fonctionnaire ou croyant, cela ne doit pas priver de raisonner sur ces sujets, ni surtout de soumettre ces jugements à l'appréciation du public. La liberté qui est essentielle aux Lumières n'est pas seulement intérieure, mais également extérieure : selon l'expression de Kant, c'est « l'usage public de la raison », qu'on appelle aujourd'hui « ___ »."
    answer: "liberté d'expression"
    alt: []
  - id: kant-le-courage-de-savoir-l5-p56
    sentence: "Dans la tradition chrétienne, on appelle « ___ » la personne qui, ayant entendu parler de Jésus-Christ, demande à l'Église de le lui faire connaître et désire devenir chrétien par le baptême."
    answer: "catéchumène"
    alt: []
  - id: kant-le-courage-de-savoir-l5-p57
    sentence: "La responsabilité personnelle et l'authenticité comme condition nécessaire d'un espace public : l'espace public ne se définit pas uniquement par le fait de s'exprimer « publiquement » devant une communauté : un prêtre, qu'il s'adresse à sa paroisse ou au monde tout entier, s'inscrit dans un cadre privé, et même ___, s'il ne parle pas en son propre nom. S'il n'est que le relais d'une autorité indiscutable diffusant un dogme qu'on ne peut pas remettre en cause, alors l'usage de sa raison demeure privé. Pour accéder à un véritable espace public, il faut non seulement qu'on y expose ses propres jugements, mais aussi qu'on s'y présente comme l'auteur de ses jugements, indépendamment de toute autorité."
    answer: "familial"
