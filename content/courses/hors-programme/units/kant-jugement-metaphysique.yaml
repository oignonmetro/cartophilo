- id: kj5-l9
  title: "Le problème du rêve : l'idéalisme problématique et la deuxième Analogie"
  notes: |-
    **Le troisième problème revient à Descartes.** Kant soutient trois thèses : la deuxième Analogie garantit l'objectivité et la nécessité causale des objets de l'expérience ; le critère de la vérité empirique dit qu'un jugement est vrai si sa règle s'applique à nos représentations et s'accorde avec les lois de la nature ; la vérité transcendantale veut que tout jugement d'expérience bien produit soit vrai.

    **L'objection, tirée du « scepticisme du rêve » de la première *Méditation* de Descartes.** Kant nomme cette forme de scepticisme {violet}idéalisme problématique{/violet} (B274). Supposons que toutes les apparences qui satisfont ces trois critères ne soient que {red}des parties causalement bien ordonnées de mon seul sens interne{/red}. L'objet de mon jugement vrai pourrait alors être un rêve très cohérent ou une hallucination. Je peux aussi bien rêver un {yellow}bateau descendant le fleuve{/yellow} qu'en voir un.

    **La Réfutation de l'idéalisme n'y fait rien.** Si elle est probante, elle dit seulement que {teal}« l'expérience interne n'est possible que par l'expérience externe en général »{/teal} (B278-279). Et Kant concède : {teal}« du fait que l'existence d'objets extérieurs est requise pour la possibilité d'une conscience déterminée de nous-mêmes, il ne suit pas que toute représentation intuitive de choses extérieures inclue en même temps leur existence, car elle peut fort bien n'être que le simple effet de l'imagination (dans les rêves comme dans les délires) »{/teal} (B278).

    **La conclusion.** Même si l'expérience interne et l'expérience externe sont liées en général, la vérité et l'objectivité d'un jugement d'expérience *particulier*, selon les critères de Kant lui-même, restent compatibles avec la possibilité que son objet soit un rêve. La note générale sur le système des principes dit bien que nous avons toujours besoin d'{coral}intuitions externes{/coral} (B291). Mais, vu B278, rien ne garantit que des apparences satisfaisant ces critères soient des objets matériels plutôt qu'une imagerie mentale bien ordonnée, de simples {yellow}« fantômes de mon cerveau »{/yellow}. {red}Le critère d'objectivité de la deuxième Analogie est donc finalement insuffisant{/red} pour fonder la vérité empirique, malgré ce que Kant soutient (A202/B247).

    ! Le raisonnement n'attaque pas l'expérience externe en général, mais le passage du général au particulier : qu'il y ait un monde externe n'assure pas que cet objet-ci en soit un.
