- id: kj5-l10
  title: "Conclusion : le jugement sans idéalisme transcendantal fort ?"
  notes: |-
    **La théorie kantienne du jugement n'est pas une curiosité : tel est le verdict de Hanna.** Ces trois problèmes semblent venir principalement de la conjonction de la centralité et de la priorité de la proposition avec l'idéalisme transcendantal. Ils ne ruinent pas la théorie si l'on suppose que :
    - la version la plus forte de l'idéalisme transcendantal est {red}fausse{/red} ;
    - et la troisième thèse est soit {green}détachée{/green} logiquement des deux premières, soit {green}conservée sous une version nettement plus faible{/green}.

    **Ce qui reste.**
    - une théorie kantienne générale de la rationalité humaine, orientée vers le **jugement** ;
    - des descriptions de la nature et des sortes irréductibles de jugement, orientées vers le **sens empirique anthropocentrique et la vérité de la proposition** ;
    - une théorie à la fois {coral}cognitiviste, antipsychologiste et antiplatonicienne{/coral}, qui unit les diverses « faces » du jugement en une seule doctrine.

    **L'argument.** La version non qualifiée de l'idéalité transcendantale, jointe aux deux premières thèses, entraîne des contradictions que les deux premières thèses seules n'entraînent pas : la cause des difficultés est donc à chercher du côté de cette version. Ni les ennuis que le non-conceptualisme cause à la Déduction B, ni la probable fausseté de l'idéalisme fort, ne compromettent l'intérêt philosophique, la pertinence actuelle et la défendabilité des autres parties de la théorie.

    ! C'est la thèse de Hanna, non de Kant, pour qui le jugement et l'idéalisme transcendantal vont ensemble. Elle suppose aussi qu'on accepte sa lecture non conceptualiste, qui reste disputée.
  points:
  - id: kj5-l10-p1
    sentence: "Hanna attribue les problèmes de la théorie kantienne du jugement à la conjonction de la centralité et de la priorité de la proposition avec la version la plus forte de l'___."
    answer: "idéalisme transcendantal"
    alt: []
