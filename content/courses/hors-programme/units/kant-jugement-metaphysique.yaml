- id: kj5-l8
  title: "Le problème descendant : l'affinité et l'unité systématique de la nature"
  notes: |-
    **Le deuxième problème est l'image inversée du premier ; il vient d'en haut, des principes.** Il affecte la doctrine transcendantale du jugement. Même en admettant le schématisme, rien ne garantit qu'un principe transcendantal, règle pour ordonner les apparences, ait été {red}complètement appliqué{/red} à elles.

    **Affinité transcendantale, affinité empirique.** L'interconnexion réglée par des lois causales de toutes les apparences sous des principes transcendantaux est l'{violet}affinité transcendantale{/violet} du divers de l'intuition (A114). L'édition A soutient que, si les catégories sont objectivement valides, l'affinité transcendantale suit ; puis, sous la version forte de l'idéalisme, que l'{violet}affinité empirique{/violet} en suit aussi (A115). L'affinité empirique étant l'application complète du système des lois causales à la nature réelle, elle équivaut à l'{violet}unité systématique de la nature{/violet}. Celle-ci serait donc une conséquence triviale de l'affinité transcendantale.

    **Kant recule en deux temps.**
    - L'{sky}Appendice à la Dialectique transcendantale{/sky} traite le principe d'unité systématique comme relevant d'un usage régulateur, non constitutif, du jugement (non sans force transcendantale).
    - La {sky}Première Introduction à la *Critique de la faculté de juger*{/sky} va plus loin : il est tout à fait possible en soi que la multiplicité des lois empiriques et des formes naturelles soit infinie, et nous présente {teal}« un agrégat brut et chaotique, sans la moindre trace d'un système, même si nous devons présupposer un tel système selon des lois transcendantales »{/teal} (20:209).

    **La conséquence.** L'affinité transcendantale n'entraîne donc pas l'affinité empirique. Si l'unité systématique n'est que subjectivement nécessaire, comme le principe transcendantal des jugements de goût, Kant n'a pas montré que le système des lois causales s'applique complètement : il a seulement montré que nous devons le {red}croire{/red}. Reste la possibilité réelle d'agrégats chaotiques, d'{violet}objets rebelles{/violet}. {red}Le schématisme ne suffit donc pas à combler l'écart entre catégories et apparences, et la doctrine transcendantale du jugement échoue.{/red}

    ! Le problème ascendant part des intuitions (des objets pourraient échapper aux catégories) ; le problème descendant part des principes (ils pourraient ne pas s'appliquer jusqu'au bout). Tous deux aboutissent à la même possibilité d'une anarchie catégoriale.
