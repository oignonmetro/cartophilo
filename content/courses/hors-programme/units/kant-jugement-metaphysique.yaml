- id: kj5-l7
  title: "Le problème ascendant : l'intuition échappe aux catégories"
  notes: |-
    **Trois problèmes sérieux viennent de l'interaction des deux premières thèses avec l'idéalisme transcendantal ; d'où l'idée de Hanna que celui-ci se détache des deux autres.** Le premier vient d'en bas, de la sensibilité.

    **Ce dont la Déduction B a besoin.** L'argument en faveur de la validité objective des catégories ne passe que si tous les objets de l'intuition humaine sont nécessairement aussi des objets de l'expérience, c'est-à-dire correctement représentés par des jugements d'expérience vrais, donc soumis à toutes les catégories, ou du moins à la deuxième Analogie.

    **Ce que le non-conceptualisme en fait.** Si ce non-conceptualisme est vrai, il existe des intuitions empiriques objectivement valides, autonomes et indépendantes des concepts, qui se rapportent directement à des objets. La connaissance de ces objets ne requiert ni concepts ni entendement. Donc :
    - certaines de ces intuitions peuvent désigner des {violet}objets rebelles{/violet}, hors des contraintes de toutes les catégories, et de la deuxième Analogie en particulier ;
    - il n'est pas vrai que les catégories et les principes s'appliquent nécessairement à tous les objets de la perception consciente ;
    - l'{violet}anarchie catégoriale{/violet} d'au moins certains objets sensibles est réellement possible ;
    - {red}la Déduction B n'est donc pas probante{/red} (**Kitcher**, **Hanna**).

    Une image pour fixer le problème, qui n'est pas de Kant : un oiseau voit un objet sans avoir aucun concept de cause. Rien, dans cette vision seule, n'exige que l'objet obéisse à la loi de cause et d'effet.

    ! C'est le dilemme de l'unité précédente : le conceptualiste en conclura plutôt que le non-conceptualisme est faux. Hanna assume le contraire.
  points:
  - id: kj5-l7-p1
    sentence: "L'argument de la Déduction B ne passe que si tous les objets de l'intuition humaine sont nécessairement aussi des objets de l'___, soumis à toutes les catégories."
    answer: "expérience"
