lessons:
- id: kj5-l1
  title: "Un idéalisme fondé sur le jugement"
  notes: |-
    **La métaphysique positive de la *Critique* est, pour Hanna, une élaboration de la théorie du jugement.** Kant écrit : {teal}« ce n'est pas du tout de la métaphysique [traditionnelle] que fait la *Critique*, mais une science entièrement nouvelle, jamais encore tentée, à savoir la critique d'une raison qui juge *a priori* »{/teal} (10:340).

    **L'idéalisme transcendantal réunit deux thèses.**
    - {violet}L'idéalisme cognitif{/violet} : tous les objets propres de la connaissance humaine ne sont que des apparences sensibles dépendantes de l'esprit, des phénomènes, non des choses en soi, des noumènes (A369).
    - {violet}Le transcendantalisme représentationnel{/violet} : toutes les représentations et leurs contenus se conforment nécessairement aux formes de nos capacités cognitives spontanées innées (Bxvi, A11/B25).

    Ces thèses admettent des lectures plus ou moins fortes (**Allais**). La version la plus forte entraîne que les objets de l'expérience humaine sont **identiques en occurrence** aux contenus sensibles objectivement valides : {teal}« le contenu (`Inbegriff`) d'une représentation est lui-même l'objet »{/teal} (11:314). **Longuenesse** l'appelle {teal}« l'internalisation à la représentation de l'objet de la représentation »{/teal}. Et leurs formes phénoménales sont **identiques en type** à celles qu'introduisent nos facultés, en particulier aux formes spatio-temporelles de l'intuition : c'est l'{violet}idéalité transcendantale de l'espace et du temps{/violet} (A28-30/B44-45). En somme, {green}notre connaissance ne se règle pas sur les objets : ce sont eux qui se règlent nécessairement sur nos facultés{/green} (Bxvi, A92/B125-126).

    **Le passage au jugement.** Supposons cette version forte, et ajoutons la thèse de la centralité et la priorité de la proposition. Il s'ensuit que les objets de l'expérience humaine sont identiques aux contenus propositionnels de jugements empiriques objectivement valides, et leurs formes aux formes de ces contenus, introduites dans la nature par les facultés que fusionne l'acte de juger. C'est un {violet}idéalisme fondé sur le jugement{/violet} : les objets empiriques réels ou possibles ne sont que des propositions empiriques vraies ou fausses, et les contours du monde que nous connaissons sont ceux des facultés qui produisent nos jugements.

    ! « Idéalisme » ne veut pas dire que le monde soit une illusion, mais que ce que nous connaissons se plie aux conditions de notre connaissance : la leçon suivante le montre avec le réalisme empirique.
  points:
  - id: kj5-l1-p1
    sentence: "La thèse selon laquelle tous les objets propres de la connaissance humaine ne sont que des apparences sensibles, des phénomènes, non des choses en soi, est l'idéalisme ___."
    answer: "cognitif"
    alt: []
  - id: kj5-l1-p2
