- id: kj5-l6
  title: "La deuxième Analogie de l'expérience"
  notes: |-
    **Exemple d'un principe de l'entendement pur, et le plus décisif pour tout le reste : la cause.** La {sky}deuxième Analogie{/sky} se décrit comme {teal}« le principe de la succession dans le temps suivant la loi de la causalité »{/teal} et dit que {teal}« tous les changements arrivent suivant la loi de la liaison de la cause et de l'effet »{/teal} (A189-211/B232-256).

    **Le cadre, la première Analogie.** Un changement (un événement singulier) est l'attribution momentanée de propriétés phénoménales distinctes à une substance matérielle permanente dans l'espace, porteuse de ces propriétés et analogue métaphysique du sujet logique de la prédication (A182-189/B224-232).

    **L'idée fondamentale.** Des événements singuliers sont des causes si et seulement si ils déterminent suffisamment, ou nécessitent, des événements ultérieurs selon des lois spécifiques de la nature. C'est {green}la réponse au souci de **Hume**{/green} sur l'absence de connexion nécessaire : les relations causales sont imposées aux phénomènes par les sujets connaissants, par des jugements d'expérience. Elles n'existent ni en elles-mêmes, ni dans les données brutes des sens.

    **L'irréversibilité, sans la réciproque.** Toutes les successions causales sont nécessairement irréversibles dans le temps. Mais Kant {red}ne tient pas la réciproque{/red}, que toute succession irréversible soit causale. Il échappe ainsi à l'accusation célèbre de **Strawson**, celle d'{red}« un *non sequitur* d'une grossièreté stupéfiante »{/red}.

    **Un critère d'objectivité.** Seuls les objets de l'expérience sont tels que chacun de leurs attributs réels dans le temps est causalement nécessité par des événements antérieurs. Ce qui les distingue des suites de propriétés ordonnées arbitrairement au gré du sens interne. Le principe de cause et d'effet est donc aussi un {coral}critère de l'objectivité{/coral} des objets de l'expérience. Et, comme tout principe, il est objectivement valide et nécessairement vrai parce qu'il exprime une catégorie (la cause et l'effet) et un schème *a priori* (le caractère successif du temps, A144/B183), qui garantit qu'elle s'applique aux objets.

    ! Qu'il y ait une cause de tout changement ne dit pas quelle est cette cause : la loi particulière reste à trouver dans l'expérience.
  points:
  - id: kj5-l6-p1
    sentence: "La deuxième Analogie de l'expérience dit que tous les changements arrivent suivant la loi de la liaison de la ___ et de l'effet."
    answer: "cause"
    alt: []
  - id: kj5-l6-p2
