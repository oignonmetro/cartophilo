- id: kj5-l2
  title: "Réaliste au niveau empirique, antiréaliste au niveau transcendantal"
  notes: |-
    **La théorie kantienne de la vérité change selon le niveau où l'on se place.** Si l'idéalisme transcendantal est vrai dans sa version la plus forte, à tout jugement empirique vrai correspond nécessairement un fait empirique réel, et réciproquement ; à tout jugement *a priori* vrai correspond une structure objectivement réelle à travers une classe complète de mondes possibles.

    **Deux niveaux.**
    - {green}Au niveau empirique, un réalisme{/green} : c'est le {violet}réalisme empirique{/violet} de Kant (A28/B44, A35/B52, A370-373). Les faits se présentent toujours comme extérieurs à notre connaissance à certains égards irréductibles, et nous ne les contrôlons pas. Je ne décide pas qu'il pleut.
    - {pink}Au niveau transcendantal, un antiréalisme{/pink} complet : {coral}nous imposons la vérité au monde{/coral}. Une fois réunies la version forte de l'idéalisme, la centralité et la priorité de la proposition, tous les jugements bien produits, et eux seuls, sont vrais.

    C'est ce que Kant appelle la {violet}vérité transcendantale{/violet} des jugements (A146/B185). La {violet}fausseté transcendantale{/violet}, elle, résulte toujours d'un accident dans la production d'un jugement : une simple {yellow}« erreur de performance »{/yellow} de nos facultés, non une lacune de notre {yellow}« compétence »{/yellow} cognitive transcendantale. {coral}Tout scepticisme sérieux au niveau transcendantal est donc exclu d'emblée.{/coral}

    ! Ne pas confondre une erreur ordinaire avec la fausseté transcendantale : je peux me tromper empiriquement sur la pluie ; ce que je ne peux pas, c'est que nos facultés en général, si elles sont bien exercées, nous trompent sur la forme du monde. La leçon sur le rêve montrera que cette sûreté est moins solide qu'il n'y paraît.
  points:
  - id: kj5-l2-p1
    sentence: "Comme les faits empiriques se présentent toujours comme extérieurs à notre connaissance et que nous ne les contrôlons pas, la théorie kantienne de la vérité est, au niveau empirique, un ___ empirique."
    answer: "réalisme"
    alt: []
  - id: kj5-l2-p2
    sentence: "Au niveau transcendantal, la théorie kantienne de la vérité est pleinement ___ : transcendantalement parlant, nous imposons la vérité au monde."
    answer: "antiréaliste"
    alt: ["anti-réaliste"]
  - id: kj5-l2-p3
    sentence: "Le fait que, si l'idéalisme transcendantal fort est vrai, tous les jugements bien produits, et eux seuls, soient vrais, est ce que Kant appelle la vérité ___ (A146/B185)."
    answer: "transcendantale"
    alt: []
  - id: kj5-l2-p4
    sentence: "La fausseté transcendantale résulte toujours d'un accident dans la production d'un jugement : c'est une simple erreur de ___ de nos facultés."
    answer: "performance"
    alt: []
  - id: kj5-l2-p5
    sentence: "Une fausseté transcendantale n'est pas une lacune dans notre ___ cognitive transcendantale, et tout scepticisme sérieux à ce niveau est donc exclu d'emblée."
    answer: "compétence"
    alt: []
- id: kj5-l3
  title: "Kant est-il vérificationniste ?"
  notes: |-
    **Si la vérité dépend de nos facultés, le sens du jugement ne se réduit-il pas à un moyen de le vérifier ?** Le {violet}vérificationnisme{/violet} réduit le sens d'un jugement à une règle pour confirmer ou infirmer son assertion devant le tribunal de l'expérience sensible. Plusieurs commentateurs l'attribuent à Kant : **Bird**, **Strawson**, **Stroud**. Les difficultés sont connues : exposition au scepticisme épistémique, engagement dans une théorie de la vérité comme cohérence, et problème des jugements sur le passé lointain ou l'avenir.

    **Il y a bien des traits vérificationnistes** : le critère de la vérité empirique en est un, et une affinité élective lie la vérité transcendantale et le vérificationnisme, tous deux antiréalistes et fondés sur le jugement.

    **Mais Kant n'est pas réductionniste sur le sens.** Il semble tenir que le contenu d'un jugement n'a de sens empirique que s'il {green}contient{/green} une règle de confirmation ; il ne tient pas que ce contenu {red}n'est rien d'autre{/red} que cette règle. Une condition nécessaire n'est pas une réduction. Outre cette règle, le contenu de tout jugement contient :
    - une relation de correspondance {coral}« épaisse »{/coral}, non déflationniste, à des faits relativement extérieurs ;
    - des {coral}formes logiques *a priori*{/coral} venues de l'entendement pur ;
    - une {coral}unité subjective rationnelle *a priori*{/coral} venue de l'aperception.

    {green}Kant est donc au plus un vérificationniste faible{/green}, tempéré par son non-réductionnisme sémantique, son réalisme empirique et son rationalisme mitigé.

    ! Dire qu'un jugement sans règle de vérification est vide de sens empirique, ce n'est pas dire qu'il est dénué de sens : les jugements sur les noumènes restent pensables.
  points:
  - id: kj5-l3-p1
    sentence: "La thèse qui réduit le sens d'un jugement à une règle pour confirmer ou infirmer son assertion devant le tribunal de l'expérience sensible est le ___."
    answer: "vérificationnisme"
    alt: []
  - id: kj5-l3-p2
    sentence: "Parmi les commentateurs qui attribuent à Kant le vérificationnisme, on compte Bird, Stroud et Peter ___."
    answer: "Strawson"
    alt: []
  - id: kj5-l3-p3
    sentence: "Kant semble tenir qu'un jugement n'a de sens empirique que s'il contient une règle de confirmation, mais non que son contenu n'est rien d'autre qu'elle : il n'est donc pas ___ sur le sens."
    answer: "réductionniste"
    alt: []
  - id: kj5-l3-p4
    sentence: "Outre une règle de confirmation, le contenu de tout jugement contient une relation de ___ « épaisse » à des faits relativement extérieurs, des formes logiques *a priori* et une unité rationnelle venue de l'aperception."
    answer: "correspondance"
    alt: []
  - id: kj5-l3-p5
    sentence: "Parce que les traits vérificationnistes de sa théorie sont tempérés par son non-réductionnisme, son réalisme empirique et son rationalisme mitigé, Kant est, pour Hanna, au plus un vérificationniste ___."
    answer: "faible"
    alt: []
- id: kj5-l4
  title: "La Déduction B : pourquoi les catégories s'appliquent aux objets"
  notes: |-
    **Kant veut surtout montrer que les principes de sa métaphysique de la nature ont sens et vérité sous l'idéalisme transcendantal.** Le premier pas est la {sky}Déduction transcendantale des concepts purs de l'entendement{/sky}, édition B (B129-B169). En voici la version condensée de Hanna :

    - les jugements d'expérience portent sur des objets de l'expérience ;
    - dans la version forte de l'idéalisme transcendantal, les formes logiques implicites de ces jugements sont imposées à des perceptions non structurées pour constituer ces objets ;
    - ces formes sont les {violet}catégories{/violet}, concepts purs dérivés de la logique générale pure ;
    - l'espace et le temps, formes de l'intuition, et les catégories relèvent également de l'aperception, quand elle s'unit à l'imagination et à sa {violet}synthèse figurée{/violet} (*synthesis speciosa*) : c'est l'{violet}unité synthétique originaire de l'aperception{/violet}. L'objectivité de tout objet de l'expérience est donc strictement déterminée par les formes de l'intuition et par les catégories ;
    - {coral}donc les catégories s'appliquent nécessairement à tous les objets de l'expérience, et à eux seuls, et elles sont objectivement valides.{/coral}

    **Trois remarques.**
    - La Déduction {green}dépend intimement de la théorie du jugement{/green} : sans la centralité et la priorité de la proposition, l'argument ne serait même pas valide.
    - Elle dépend du rôle de l'aperception : sans l'unité de la proposition due à l'aperception, les formes logiques ne se transporteraient pas dans les objets.
    - {red}La clef de voûte est l'antécédent de la quatrième étape{/red} : l'unité spatio-temporelle de l'intuition et l'unité du contenu propositionnel sont **une seule et même unité**. L'unité intuitive de nos perceptions serait donc nécessairement une unité logico-conceptuelle.

    **D'où les objets rebelles.** Si cette identité est fausse, l'unité de la perception peut différer de celle des jugements, et il pourrait y avoir des objets de l'intuition auxquels les catégories ne s'appliquent pas, ou pas nécessairement. Hanna les appelle des {violet}objets rebelles{/violet}, en {violet}anarchie catégoriale{/violet}. Exemples :
    - un comportement systématiquement contraire aux lois ({yellow}la magie{/yellow}) ;
    - un comportement purement aléatoire ({yellow}le pur hasard{/yellow}) ;
    - un comportement téléologique ({yellow}la vie organique{/yellow}) ;
    - des ordres arbitraires de représentations dans le sens interne ({yellow}la spontanéité de la conscience{/yellow}) ;
    - une détermination incompatibiliste à la source de l'action ({yellow}la liberté{/yellow}).

    ! La Déduction ne dit pas seulement que nous pensons le monde avec des catégories ; elle dit que tout objet de l'expérience y obéit. Le point d'attaque des objets rebelles est le passage de l'objet de l'intuition à l'objet de l'expérience.
  points:
  - id: kj5-l4-p1
    sentence: "La conclusion de la ___ transcendantale (édition B) est que les catégories s'appliquent nécessairement à tous les objets de l'expérience et à eux seuls, et qu'elles sont objectivement valides."
    answer: "Déduction"
    alt: []
  - id: kj5-l4-p2
    sentence: "Pour la Déduction B, l'aperception s'unit à l'imagination et à sa synthèse figurée, en latin *synthesis ___*."
    answer: "speciosa"
    alt: []
  - id: kj5-l4-p3
    sentence: "Dans la Déduction B, l'union de l'aperception avec l'imagination et sa synthèse figurée est ce que Kant nomme l'unité ___ originaire de l'aperception."
    answer: "synthétique"
    alt: []
  - id: kj5-l4-p4
    sentence: "La Déduction B dépend de la théorie du jugement : sans la thèse de la centralité et celle de la priorité de la proposition, l'argument ne serait même pas ___."
    answer: "valide"
    alt: []
  - id: kj5-l4-p5
    sentence: "Selon Hanna, la clef de voûte de la Déduction B est l'affirmation que l'unité spatio-temporelle de l'intuition et l'unité du contenu propositionnel sont une seule et même ___."
    answer: "unité"
    alt: []
  - id: kj5-l4-p6
    sentence: "Si l'unité des perceptions était distincte de celle des jugements, il pourrait exister des objets de l'intuition auxquels les catégories ne s'appliquent pas : Hanna les appelle des objets ___."
    answer: "rebelles"
    alt: []
  - id: kj5-l4-p7
    sentence: "Les objets de l'intuition qui échappent aux catégories, comme ceux que produiraient la magie ou le pur hasard, se trouvent dans ce que Hanna nomme une anarchie ___."
    answer: "catégoriale"
    alt: []
  - id: kj5-l4-p8
    sentence: "Parmi les exemples d'objets rebelles aux catégories, Hanna range un comportement téléologique, celui de la vie ___."
    answer: "organique"
    alt: []
- id: kj5-l5
  title: "Le schématisme et le système des principes"
  notes: |-
    **La Déduction montre que les catégories sont valides ; reste à dire quelles vérités générales elles fondent.** Si elle est probante, on peut formuler des jugements synthétiques *a priori* contenant les catégories, qui héritent de leur validité. Ces jugements sont les {violet}principes de l'entendement pur{/violet} (A148/B187) : ils constituent la métaphysique transcendantale de la nature de Kant. L'{sky}Analytique des principes{/sky}, ou {sky}doctrine transcendantale de la faculté de juger{/sky} (A137/B176), a deux parties : le schématisme (A137-147/B176-187) et le système des principes (A148-235/B187-294).

    | Titre | Catégories | Principes |
    | quantité | unité, pluralité, totalité | axiomes de l'intuition |
    | qualité | réalité, négation, limitation | anticipations de la perception |
    | relation | substance, causalité, communauté | analogies de l'expérience |
    | modalité | possibilité, existence, nécessité | postulats de la pensée empirique |

    **Pourquoi des schèmes ?** Il y a deux écarts à combler : un écart {red}ontologique{/red}, entre universaux abstraits et particuliers concrets ; un écart {red}cognitif{/red}, entre concepts et intuitions. Le premier existe au niveau empirique comme au niveau transcendantal, où il sépare les catégories des objets individuels de l'expérience. Les {violet}schèmes{/violet} peuvent médiatiser, parce qu'ils sont à la fois {green}figurés et formels, et intrinsèquement sensibles{/green}.

    **Une doctrine sémantique.** Les schèmes sont des règles pour interpréter des termes autrement non interprétés, par des structures sensibles spatio-temporelles intermédiaires, des sortes de modèles, pour qu'ils puissent s'appliquer à ce qui en sera la valeur sémantique. Tous les schèmes transcendantaux expriment des propriétés formelles du {violet}temps{/violet} : {teal}« la série du temps, le contenu du temps, l'ordre du temps et l'ensemble du temps »{/teal} (A145/B184-185). Tout jugement valide comporte donc une composante temporelle *a priori*, implicite, qui interprète ses éléments purement logiques et assure qu'ils s'appliquent aux objets de l'expérience.

    **Les principes**, quant à eux, disent comment une catégorie constitue en partie les objets de l'expérience en général, en déterminant une structure phénoménale objectivement réelle à travers tous les mondes possibles de l'expérience humaine.

    ! Sans schème, une catégorie reste une forme logique sans application aux objets individuels : le schème n'est pas un concept de plus, c'est sa traduction dans le temps.
  points:
  - id: kj5-l5-p1
    sentence: "Les jugements synthétiques *a priori* contenant les catégories, qui composent la métaphysique transcendantale de la nature de Kant, sont les ___ de l'entendement pur."
    answer: "principes"
    alt: []
  - id: kj5-l5-p2
    sentence: "Kant appelle Analytique des principes, ou doctrine transcendantale de la ___, l'extension de sa théorie du jugement aux principes de l'entendement pur."
