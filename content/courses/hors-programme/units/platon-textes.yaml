# Unité-œuvre (voir content/oeuvres.md), pour réviser les 21 textes du
# chapitre Platon d'un manuel de philosophie (Antiquité et Moyen Âge,
# pp. 44-65) : associer chaque texte (œuvre, pagination Stephanus) à son idée.
# Titres des textes : ceux du manuel. Paginations fournies par l'utilisatrice,
# établies par lecture de marges ou sources secondaires, avec ces réserves :
# textes 7, 16, 20 lus sur une traduction anglaise (Perseus), bornes à revoir ;
# textes 1, 2, 6, 10, 11, 12, 17, 18 lus par NotebookLM, non revus ; texte 4,
# fin à 440b ou 440c selon l'édition ; texte 15, 359c-360d chez SEP et IEP ;
# texte 16, référence courante 443c-444a ; texte 17, second fragment à 598a
# ou 598b. Thèses alignées sur les extraits du manuel (J. Russ, C. Leguil,
# Philosophie. Les chemins de la pensée).

id: platon-textes
title: "Platon : textes clés"
subtitle: "21 textes, de l’Apologie à la République"
icon: map
color: sky
group: "Platon"
intro: |-
  Les 21 textes de Platon du manuel, à associer à leur idée : où Platon dit-il que penser est un dialogue de l'âme avec elle-même, que la justice est l'ordre intérieur de l'âme, que l'art imite l'apparence ?

  Chaque texte est repéré par son œuvre et sa pagination Stephanus ; au clavier, la page de départ suffit (« 514 », « 514a », « Rép. VII 514a »).
work:
  parts:
    - id: connaitre
      label: "Textes 1-8"
      title: "Philosopher et connaître"
      parts:
        - id: b-1-4
          label: "Textes 1-4"
          parts:
            - id: t1
              label: "Apologie de Socrate, 29c-30c"
              title: "Socrate et la philosophie"
              summary: "Philosopher est une mission : prendre soin de son âme"
              points:
                - id: pt1-1
                  sentence: "Même acquitté à condition de ne plus philosopher, Socrate répondrait : « j'obéirai au ___ plutôt qu'à vous »."
                  answer: "dieu"
                - id: pt1-2
                  sentence: "La seule affaire de Socrate : persuader chacun de ne se préoccuper ni de son corps ni de sa fortune aussi passionnément que de son ___, pour la rendre aussi bonne que possible."
                  answer: "âme"
                - id: pt1-3
                  sentence: "Quand il devrait mille fois s'exposer à la ___, Socrate ne changera jamais de conduite."
                  answer: "mort"
            - id: t2
              label: "Théétète, 189e-190a"
              title: "Un dialogue intérieur"
              summary: "Penser, c'est se parler à soi-même"
              rel: declinaison
              points:
                - id: pt2-1
                  sentence: "Penser, c'est pour l'âme un ___ qu'elle se tient tout au long à elle-même sur les objets qu'elle examine."
                  answer: "discours"
                - id: pt2-2
                  sentence: "Quand l'âme a défini son arrêt et ne doute plus, c'est là ce que nous posons être, chez elle, ___."
                  answer: "opinion"
            - id: t3
              label: "Phédon, 78c-79a"
              title: "Les Essences"
              summary: "Les réalités en soi sont immuables, les choses sensibles changent"
              rel: declinaison
              points:
                - id: pt3-1
                  sentence: "L'Égal en soi, le Beau en soi, chaque chose en soi n'admet jamais aucun ___, quel qu'il soit."
                  answer: "changement"
                - id: pt3-2
                  sentence: "Ce qui est toujours le même ne se saisit que par un raisonnement de l'esprit : ces choses sont ___ et hors de vue."
                  answer: "invisibles"
            - id: t4
              label: "Cratyle, 439e-440c"
              title: "La connaissance requiert un objet stable"
              summary: "Si tout s'écoule, rien ne peut être connu"
              rel: declinaison
              points:
                - id: pt4-1
                  sentence: "Si tout se transforme et que rien ne demeure, comme le veut la doctrine d'___, il ne peut être question de connaissance."
                  answer: "Héraclite"
                - id: pt4-2
                  sentence: "À l'approche de qui voudrait le connaître, l'objet mouvant deviendrait ___ et différent."
                  answer: "autre"
                - id: pt4-3
                  sentence: "Si la connaissance change toujours, il n'existera ni ___ pour connaître, ni objet à connaître."
                  answer: "sujet"
        - id: b-5-8
          label: "Textes 5-8"
          rel: declinaison
          parts:
            - id: t5
              label: "Timée, 48e-50d"
              title: "La Nature et l'Idée"
              summary: "Entre l'Idée et sa copie, un troisième genre : le réceptacle"
              points:
                - id: pt5-1
                  sentence: "Au modèle intelligible et à sa copie visible, il faut ajouter une troisième espèce : le ___ et pour ainsi dire la nourrice de tout ce qui naît."
                  answer: "réceptacle"
                - id: pt5-2
                  sentence: "D'un artiste qui modèle sans cesse des figures diverses, la réponse la plus sûre sur ce qu'il montre serait : c'est de l'___."
                  answer: "or"
                - id: pt5-3
                  sentence: "On peut assimiler le réceptacle à une mère, le modèle à un ___, et la nature intermédiaire à un enfant."
                  answer: "père"
            - id: t6
              label: "Phèdre, 249b-d"
              title: "L'idée et la réminiscence"
              summary: "Comprendre, c'est se ressouvenir de ce que l'âme a contemplé"
              rel: declinaison
              points:
                - id: pt6-1
                  sentence: "Une intelligence d'homme va d'une multiplicité de sensations vers une ___, dont l'assemblage est acte de réflexion."
                  answer: "unité"
                - id: pt6-2
                  sentence: "Il est juste que, seule, la pensée du philosophe soit ___ : par le souvenir, elle s'applique aux objets divins."
                  answer: "ailée"
                - id: pt6-3
                  sentence: "L'acte de réflexion consiste en un ___ des objets que notre âme a vus jadis, quand elle s'associait à la promenade d'un dieu."
                  answer: "ressouvenir"
                  alt: ["souvenir"]
                - id: pt6-4
                  sentence: "La foule remontre au philosophe qu'il a la tête à l'envers, alors qu'il est ___ d'un dieu."
                  answer: "possédé"
            - id: t7
              label: "République VII, 514a-517c"
              title: "Le mythe de la caverne"
              summary: "L'âme doit s'élever des ombres jusqu'au Bien"
              rel: declinaison
              points:
                - id: pt7-1
                  sentence: "Enchaînés depuis l'enfance, les prisonniers ne voient d'eux-mêmes et des objets que les ___ projetées par le feu sur la paroi."
                  answer: "ombres"
                - id: pt7-2
                  sentence: "Au terme de la montée, le prisonnier délivré pourrait regarder le ___ lui-même dans son propre séjour, et le contempler tel qu'il est."
                  answer: "soleil"
                - id: pt7-3
                  sentence: "Si quelqu'un essayait de délier les prisonniers et de les conduire en haut, ils le ___, s'ils pouvaient le tenir en leurs mains."
                  answer: "tueraient"
                - id: pt7-4
                  sentence: "Aux dernières limites du monde intelligible est l'idée du ___, qu'on aperçoit avec peine, cause universelle de tout ce qu'il y a de beau."
                  answer: "Bien"
                - id: pt7-5
                  sentence: "La montée dans le monde supérieur, c'est la montée de l'âme dans le monde ___."
                  answer: "intelligible"
            - id: t8
              label: "République VI, 509d-510b"
              title: "La ligne de la connaissance"
              summary: "Du visible à l'intelligible, quatre degrés de réalité et de savoir"
              rel: declinaison
              points:
                - id: pt8-1
                  sentence: "Prends une ligne coupée en deux segments inégaux, l'un représentant le genre visible, l'autre le genre ___."
                  answer: "intelligible"
                - id: pt8-2
                  sentence: "Dans le monde visible, le premier segment est celui des ___ : les ombres, puis les reflets dans les eaux."
                  answer: "images"
                - id: pt8-3
                  sentence: "Pour atteindre une partie de l'intelligible, l'âme part d'___ et va, non vers un principe, mais vers une conclusion."
                  answer: "hypothèses"
                - id: pt8-4
                  sentence: "L'image est à l'objet qu'elle reproduit comme l'opinion est à la ___."
                  answer: "science"
                - id: pt8-5
                  sentence: "L'autre partie de l'intelligible aboutit à un principe ___, que l'âme atteint à l'aide des seules idées."
                  answer: "anhypothétique"
    - id: amour
      label: "Textes 9-12"
      title: "L'amour"
      parts:
        - id: b-9-12
          label: "Textes 9-12"
          parts:
            - id: t9
              label: "Banquet, 192b-192e"
              title: "La finalité de l'Amour"
              summary: "Aimer, c'est désirer et poursuivre le tout perdu"
              points:
                - id: pt9-1
                  sentence: "Leur âme à tous deux désire autre chose, qu'elle ne peut pas dire, mais qu'elle ___ et laisse deviner."
                  answer: "devine"
                - id: pt9-2
                  sentence: "Héphaïstos offrirait aux amants de les fondre et de les ___ ensemble, pour que de deux ils ne fassent plus qu'un."
                  answer: "souder"
                  alt: ["unir"]
                - id: pt9-3
                  sentence: "Notre ancienne nature était un tout complet : c'est le désir et la poursuite de ce ___ qui s'appelle l'amour."
                  answer: "tout"
                  alt: ["tout complet"]
            - id: t10
              label: "Banquet, 203c-204a"
              title: "L'Amour est manque d'être"
              summary: "L'Amour, fils de Pauvreté et d'Expédient, est philosophe"
              rel: changement-de-question
              points:
                - id: pt10-1
                  sentence: "Fils de Poros, l'Expédient, et de Pénia, la ___, l'Amour tient de sa mère d'être toujours misérable."
                  answer: "Pauvreté"
                - id: pt10-2
                  sentence: "Entre la sagesse et l'ignorance, l'Amour reste sur la limite : il est ___."
                  answer: "philosophe"
                - id: pt10-3
                  sentence: "Nul ne ___ les choses dont il ne se croit point dépourvu : c'est pourquoi les ignorants ne philosophent pas."
                  answer: "désire"
                - id: pt10-4
                  sentence: "Aucun dieu ne philosophe ni ne songe à devenir ___, attendu qu'il l'est déjà."
                  answer: "sage"
            - id: t11
              label: "Banquet, 209e-210d"
              title: "Les degrés de l'Amour"
              summary: "Du beau corps aux belles âmes, puis aux sciences"
              rel: consequence
              points:
                - id: pt11-1
                  sentence: "Il faut commencer par n'aimer qu'un seul beau ___, puis se rendre compte que la beauté de tous est une et identique."
                  answer: "corps"
                - id: pt11-2
                  sentence: "Après quoi, c'est la beauté dans les ___ qu'on estimera plus précieuse que celle qui appartient au corps."
                  answer: "âmes"
                - id: pt11-3
                  sentence: "Tourné vers le vaste ___ du beau, on enfante en foule de beaux, de magnifiques discours."
                  answer: "océan"
                - id: pt11-4
                  sentence: "Après les occupations, le guide mène aux ___, pour qu'on aperçoive la beauté qu'il y a en celles-ci."
                  answer: "connaissances"
                  alt: ["sciences"]
            - id: t12
              label: "Banquet, 210e-211d"
              title: "La Beauté absolue"
              summary: "Le Beau en soi, éternel, dont participent toutes les belles choses"
              rel: consequence
              points:
                - id: pt12-1
                  sentence: "Au Beau en soi appartient une existence éternelle, qui ignore génération et ___, accroissement et décroissement."
                  answer: "destruction"
                - id: pt12-2
                  sentence: "Les autres choses belles ___ toutes au Beau en soi, sans que leur génération ni leur destruction ne le touche."
                  answer: "participent"
                - id: pt12-3
                  sentence: "Le point de la vie où il vaut pour un homme la peine de ___, c'est quand il contemple la beauté en elle-même."
                  answer: "vivre"
                - id: pt12-4
                  sentence: "On s'élève en usant d'___ : d'un seul beau corps à deux, de deux à tous, puis aux belles occupations et aux belles sciences."
                  answer: "échelons"
    - id: justice
      label: "Textes 13-16"
      title: "La justice"
      parts:
        - id: b-13-16
          label: "Textes 13-16"
          parts:
            - id: t13
              label: "Gorgias, 483b-484a"
              title: "La force est la loi suprême"
              summary: "Par nature, le plus fort doit avoir plus que le plus faible"
              points:
                - id: pt13-1
                  sentence: "La loi est faite par les ___ et par le grand nombre, en vue de leur intérêt personnel."
                  answer: "faibles"
                - id: pt13-2
                  sentence: "La ___ elle-même prouve qu'en bonne justice, celui qui vaut plus doit l'emporter sur celui qui vaut moins."
                  answer: "nature"
                - id: pt13-3
                  sentence: "Les meilleurs, on les prend en bas âge, comme des ___, pour les asservir à force d'incantations."
                  answer: "lionceaux"
                  alt: ["lions"]
                - id: pt13-4
                  sentence: "Qu'un homme assez heureusement doué secoue ses chaînes, il se dresserait en ___ devant nous, lui qui était notre esclave."
                  answer: "maître"
            - id: t14
              label: "Gorgias, 493d-494b"
              title: "Mieux vaut une vie en ordre que le désordre des passions"
              summary: "Le tempérant aux tonneaux pleins, l'intempérant aux tonneaux percés"
              rel: declinaison
              points:
                - id: pt14-1
                  sentence: "Le sage ressemble à un homme dont les ___ seraient en bon état et remplis : il n'aurait plus à s'en occuper."
                  answer: "tonneaux"
                - id: pt14-2
                  sentence: "Calliclès répond que l'homme aux tonneaux pleins vit à la façon d'une ___ : sans joie ni peine."
                  answer: "pierre"
                - id: pt14-3
                  sentence: "Pour Calliclès, ce qui fait l'agrément de la vie, c'est de ___ le plus possible."
                  answer: "verser"
            - id: t15
              label: "République II, 359b-360d"
              title: "L'anneau de Gygès"
              summary: "Assuré de l'impunité, nul ne resterait juste"
              rel: declinaison
              points:
                - id: pt15-1
                  sentence: "En tournant le chaton de sa bague en dedans de sa main, le berger devient aussitôt ___."
                  answer: "invisible"
                - id: pt15-2
                  sentence: "Avec l'aide de la reine, Gygès attaque et tue le ___, puis s'empare du trône."
                  answer: "roi"
                - id: pt15-3
                  sentence: "On n'est pas juste par choix, mais par ___."
                  answer: "contrainte"
                - id: pt15-4
                  sentence: "Tous les hommes croient que l'___ leur est beaucoup plus avantageuse individuellement que la justice."
                  answer: "injustice"
            - id: t16
              label: "République IV, 443d-444a"
              title: "La justice, c'est l'ordre et l'harmonie de l'âme"
              summary: "La justice : un accord parfait entre les trois parties de l'âme"
              rel: declinaison
              points:
                - id: pt16-1
                  sentence: "La justice règle l'activité ___ : elle ne permet pas que les trois principes de l'âme empiètent sur leurs attributions."
                  answer: "intérieure"
                - id: pt16-2
                  sentence: "Le juste met entre les trois parties de son âme un accord parfait, comme les termes d'un accord ___ : le plus élevé, le plus bas, le moyen."
                  answer: "musical"
                - id: pt16-3
                  sentence: "Le juste tient pour ___ la science qui dirige l'action qui entretient en lui ce bel ordre."
                  answer: "sagesse"
                - id: pt16-4
                  sentence: "D'une multiplicité, le juste devient ___, tempérance et harmonie."
                  answer: "unité"
    - id: cite
      label: "Textes 17-21"
      title: "L'art et la cité"
      parts:
        - id: b-17-21
          label: "Textes 17-21"
          parts:
            - id: t17
              label: "République X, 597b-598c"
              title: "L'art n'est qu'imitation et illusion"
              summary: "Le peintre imite l'apparence des ouvrages des artisans"
              points:
                - id: pt17-1
                  sentence: "Il y a trois lits : la forme naturelle, dont Dieu est l'auteur, celle du ___, et celle du peintre."
                  answer: "menuisier"
                - id: pt17-2
                  sentence: "Ce que le peintre imite, ce n'est pas l'objet unique qui est dans la nature, mais les ouvrages des ___."
                  answer: "artisans"
                - id: pt17-3
                  sentence: "La peinture est l'imitation, non de la réalité, mais de l'___."
                  answer: "apparence"
                - id: pt17-4
                  sentence: "L'art d'imiter ne touche qu'une petite partie de chaque chose, et cette partie n'est qu'un ___."
                  answer: "fantôme"
            - id: t18
              label: "Ion, 534b-d"
              title: "L'inspiration"
              summary: "Le poète crée par un don divin, non par un art"
              rel: declinaison
              points:
                - id: pt18-1
                  sentence: "Le poète est chose légère, ailée, ___ : il n'est pas en état de créer avant d'être inspiré par un dieu, hors de lui."
                  answer: "sacrée"
                - id: pt18-2
                  sentence: "Ce n'est point en vertu d'un ___ que les poètes disent tant de belles choses, mais par un privilège divin."
                  answer: "art"
                - id: pt18-3
                  sentence: "Chacun ne compose avec succès que dans le genre où la ___ le pousse : dithyrambes, éloges, épopée ou iambes."
                  answer: "Muse"
                - id: pt18-4
                  sentence: "Les poètes n'ont pas leur ___ : c'est la Divinité elle-même qui parle et se fait entendre par leur intermédiaire."
                  answer: "raison"
            - id: t19
              label: "Lettre VII, 325b-326b"
              title: "Le philosophe-roi"
              summary: "Les maux ne cesseront pas avant que les philosophes gouvernent"
              rel: declinaison
              points:
                - id: pt19-1
                  sentence: "Des gens puissants font condamner ___ pour impiété : Platon en juge plus difficile de bien administrer l'État."
                  answer: "Socrate"
                - id: pt19-2
                  sentence: "Tous les États actuels sont mal gouvernés, car leur législation est à peu près ___."
                  answer: "incurable"
                - id: pt19-3
                  sentence: "Les maux ne cesseront pas avant que la race des purs philosophes n'arrive au ___, ou que les chefs des cités ne se mettent à philosopher."
                  answer: "pouvoir"
                - id: pt19-4
                  sentence: "À la lumière seule de la vraie ___, on peut reconnaître où est la justice dans la vie publique et dans la vie privée."
                  answer: "philosophie"
            - id: t20
              label: "République V, 457c-460c"
              title: "La première conception d'un « État totalitaire »"
              summary: "Chez les gardiens, femmes et enfants communs, et unions réglées"
              rel: declinaison
              points:
                - id: pt20-1
                  sentence: "Les femmes des guerriers seront communes à tous ; les enfants aussi seront ___, et le père ne connaîtra pas son fils."
                  answer: "communs"
                - id: pt20-2
                  sentence: "Il faut que les sujets d'___ de l'un et l'autre sexe s'unissent le plus souvent possible, et les sujets inférieurs le plus rarement."
                  answer: "élite"
                - id: pt20-3
                  sentence: "Les enfants des inférieurs, ou nés avec quelque difformité, seront cachés dans un endroit ___ et dérobé aux regards."
                  answer: "secret"
                - id: pt20-4
                  sentence: "Il faut élever les enfants des meilleurs si l'on veut maintenir au ___ toute son excellence."
                  answer: "troupeau"
            - id: t21
              label: "République III, 389b-d"
              title: "Le mensonge, remède politique"
              summary: "Seuls les gouvernants peuvent mentir, pour le bien de la cité"
              rel: declinaison
              points:
                - id: pt21-1
                  sentence: "Utile aux hommes à la manière d'un remède, le mensonge doit être réservé aux ___, et les profanes n'y doivent point toucher."
                  answer: "médecins"
                - id: pt21-2
                  sentence: "S'il appartient à quelqu'un de mentir, c'est aux ___ de la Cité, dans l'intérêt de la Cité, pour tromper les ennemis ou les citoyens."
                  answer: "chefs"
                  alt: ["gouvernants", "magistrats"]
                - id: pt21-3
                  sentence: "Le particulier qui ment aux chefs commet une faute plus grande que le ___ qui ne dit pas la vérité au médecin."
                  answer: "malade"
                - id: pt21-4
                  sentence: "Le chef punira le menteur, comme introduisant une pratique propre à perdre une Cité aussi bien qu'un ___."
                  answer: "vaisseau"
                  alt: ["navire"]
  recaps:
    - at: b-1-4
      label: "Textes 1-4"
      title: "Philosopher, penser, connaître l'être stable"
      notes: |-
        **Philosopher, c'est prendre soin de son âme (Apologie) ; penser, c'est dialoguer avec soi (Théétète) ; et il n'y a de connaissance que de ce qui demeure (Phédon, Cratyle).**

        | Texte | Idée |
        | 1. Apologie, 29c-30c | philosopher est une mission reçue du dieu : prendre soin de son âme plutôt que des richesses |
        | 2. Théétète, 189e-190a | la pensée est un discours intérieur ; l'opinion, l'arrêt où l'âme ne doute plus |
        | 3. Phédon, 78c-79a | les réalités en soi, non composées, invisibles, restent identiques ; les choses sensibles changent |
        | 4. Cratyle, 439e-440c | si tout s'écoule (Héraclite), rien ne peut être connu |

        ! Le Phédon et le Cratyle disent la même chose de deux côtés : le premier montre l'objet stable, le second ce qu'on perd sans lui.
    - at: b-5-8
      label: "Textes 5-8"
      title: "Des images aux Idées"
      notes: |-
        **Entre le monde sensible et les Idées, Platon pense un réceptacle (Timée), une remontée par la réminiscence (Phèdre), et une échelle de la connaissance (la caverne, la ligne).**

        | Texte | Idée |
        | 5. Timée, 48e-50d | un troisième genre, le réceptacle, reçoit toutes les formes sans en avoir aucune : une mère, le modèle étant le père |
        | 6. Phèdre, 249b-d | comprendre, c'est rassembler le multiple en une unité : se ressouvenir des Idées |
        | 7. République VII, 514a-517c | des ombres de la caverne au soleil, image du Bien |
        | 8. République VI, 509d-510b | la ligne : images, objets visibles, pensée par hypothèses, principe anhypothétique |

        La ligne (livre VI) précède la caverne (livre VII) dans la *République* : l'une classe les degrés du savoir, l'autre met en scène l'ascension.

        ! Dans la ligne, les mathématiques ne sont pas le sommet : elles partent d'hypothèses sans remonter au principe.
    - at: b-9-12
      label: "Textes 9-12"
      title: "L'ascension de l'Amour dans le Banquet"
      notes: |-
        **Dans le Banquet, l'Amour passe d'une recherche de la moitié perdue (Aristophane) à un désir du Beau qui monte jusqu'au Beau en soi (Diotime).** Les quatre textes suivent l'ordre du dialogue.

        | Texte | Idée |
        | 9. Banquet, 192b-e | Aristophane : l'amour est le désir et la poursuite du tout que nous étions |
        | 10. Banquet, 203c-204a | Diotime : fils de Pauvreté et d'Expédient, l'Amour est manque, donc philosophe |
        | 11. Banquet, 209e-210d | les degrés : un beau corps, tous les corps, les âmes, puis les sciences |
        | 12. Banquet, 210e-211d | au sommet, le Beau en soi, éternel, dont tout le reste participe |

        ! Le manque n'est pas une faiblesse de l'Amour : c'est ce qui en fait un intermédiaire, et le pousse vers le Beau.
    - at: b-13-16
      label: "Textes 13-16"
      title: "Force, désir et justice"
      notes: |-
        **Contre Calliclès, pour qui la nature donne raison au plus fort et au désir sans frein (Gorgias), et contre Glaucon, pour qui nul n'est juste volontairement (Gygès), Platon définit la justice comme l'ordre intérieur de l'âme.**

        | Texte | Idée |
        | 13. Gorgias, 483b-484a | Calliclès : les lois sont l'œuvre des faibles ; par nature, le plus fort doit avoir plus |
        | 14. Gorgias, 493d-494b | les tonneaux : le tempérant est comblé, l'intempérant doit remplir sans fin des tonneaux percés |
        | 15. République II, 359b-360d | l'anneau de Gygès : assuré de l'impunité, nul ne resterait juste |
        | 16. République IV, 443d-444a | la justice : les trois parties de l'âme en accord parfait, comme dans un accord musical |

        ! Le mythe de Gygès n'est pas la thèse de Platon : Glaucon le raconte pour que Socrate le réfute.
    - at: b-17-21
      label: "Textes 17-21"
      title: "L'art et le poète, le philosophe et la cité"
      notes: |-
        **L'art imite l'apparence (République X) et le poète crée par inspiration, sans savoir (Ion) ; la cité, elle, doit être gouvernée par ceux qui savent, quitte à régler les unions et à mentir pour son bien (Lettre VII, République V et III).**

        | Texte | Idée |
        | 17. République X, 597b-598c | trois lits : le peintre imite l'apparence des ouvrages des artisans, un fantôme |
        | 18. Ion, 534b-d | le poète crée par un don divin, hors de sa raison, non par un art |
        | 19. Lettre VII, 325b-326b | après la mort de Socrate, les maux ne cesseront qu'avec des philosophes au pouvoir |
        | 20. République V, 457c-460c | chez les gardiens, femmes et enfants communs, unions des sujets d'élite, enfants des inférieurs cachés |
        | 21. République III, 389b-d | le mensonge, remède réservé aux gouvernants |

        ! Le « totalitarisme » du texte 20 est une lecture moderne (le titre du manuel) : chez Platon, il ne vise que la classe des gardiens.
