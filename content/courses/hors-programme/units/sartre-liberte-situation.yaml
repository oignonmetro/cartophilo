- id: sartre-liberte-situation-p2
  title: "Le monde résistant, condition de la liberté"
  notes: |-
    **Thèse : loin d'être une objection à la liberté, la résistance des choses en est la condition.** Le paragraphe procède en deux temps. D'abord, l'adversité des choses n'existe que par nos fins : c'est la liberté qui fait apparaître les obstacles (extraits 1 à 3). Ensuite, une liberté sans résistance ne serait plus une liberté : il lui faut un monde qui la sépare de ses fins tout en les lui rendant accessibles (extraits 4 à 6).

    | Extrait | Ce qu'il établit |
    | 1 | Descartes ; l'adversité surgit par la position d'une fin |
    | 2 | le rocher, obstacle ou appui selon le projet, et la technique |
    | 3 | le résidu de l'en-soi, grâce auquel la liberté surgit |
    | 4 | sans résistance, la liberté serait celle du rêve |
    | 5 | la fin, séparée et accessible, et l'ordre des existants |
    | 6 | pas de liberté hors d'un monde résistant |

    === 1 L'adversité surgit par nos fins

    **L'argument du bon sens n'a jamais troublé les partisans de la liberté.** Descartes, le premier, tenait à la fois que la volonté est infinie (*Méditations*, IV) et qu'il faut « tâcher à nous vaincre plutôt que la fortune » (troisième maxime de la morale par provision, *Discours de la méthode*, III) : reconnaître la puissance des choses ne nuit en rien à la liberté du vouloir.

    **Il faut donc trier les faits.** Le coefficient d'adversité, en particulier, n'est pas un argument contre la liberté, car il surgit « par nous », par la « position préalable d'une fin » : une chose n'est obstacle que pour un projet.

    ! Une chose n'est jamais « difficile » en elle-même : elle l'est __pour__ ce que je veux en faire.

    === 3 Le rocher : obstacle ou appui

    **Le même rocher résiste si je veux le déplacer, et m'aide si je veux l'escalader pour voir le paysage.** En lui-même, il est neutre : il attend d'être éclairé par une fin. Sartre ajoute une réserve : on ne peut guère dire ce qu'il est « en lui-même », puisque nous le saisissons toujours à travers un projet.

    **Encore faut-il un « complexe ustensile »**, un ensemble d'outils et de savoir-faire qui renvoient les uns aux autres : sans pics, piolets, sentiers tracés, technique de l'ascension, le rocher ne serait ni facile ni malaisé à gravir. Les choses brutes, les « existants bruts » de Heidegger, peuvent bien limiter notre action ; mais c'est la liberté qui a d'abord constitué le cadre, la technique et les fins par rapport auxquels elles apparaissent comme des limites.

    **Même l'échec le confirme** : si le rocher se révèle « trop difficile à gravir », c'est qu'il avait d'abord été saisi comme gravissable.

    | Projet | Le rocher apparaît comme |
    | le déplacer | une résistance profonde |
    | l'escalader | une aide précieuse |
    | aucun projet, aucune technique | ni facile ni malaisé : la question ne se pose pas |

    === 7 Le résidu de l'en-soi

    **Sartre n'est pas idéaliste : tout ne vient pas de la liberté.** Il reste un « residuum » de l'en-soi, innommable et impensable, qui fait que, dans un monde éclairé par nos projets, tel rocher est réellement plus propice à l'escalade que tel autre. Mais ce résidu n'est pas d'abord une limite : c'est grâce à lui, à l'en-soi brut, que la liberté « surgit comme liberté ». C'est ce que montre la suite.

    ! Le résidu n'est pas une invention de la conscience : il appartient à l'__en-soi__, et la liberté en a besoin.

    === 8 Sans résistance, la liberté serait un rêve

    **Raisonnement par l'absurde.** Le sens commun l'accorde : est libre celui qui peut réaliser ses projets. Mais réaliser suppose que la simple projection d'une fin se distingue « a priori » de sa réalisation. Si concevoir suffisait à réaliser, nous serions dans un monde semblable à celui du rêve : le possible ne s'y distinguerait plus du réel, le monde changerait au gré de ma conscience.

    **On ne pourrait plus distinguer une fiction d'un choix réel** : il serait impossible de pratiquer la « mise entre parenthèses », la suspension du jugement sur l'existence que la phénoménologie de Husserl appelle `épochè`. Dès lors, plus de différence entre le simple souhait, la représentation et le choix ; et avec cette différence, la liberté elle-même disparaît.

    ! Une liberté toute-puissante ne serait pas une liberté __plus grande__ : ce ne serait plus une liberté du tout.

    === 11 La fin, séparée et accessible

    **Nous sommes libres quand ce qui nous annonce ce que nous sommes est une fin, c'est-à-dire un objet qui n'existe pas encore.** Le pour-soi se définit par ce vers quoi il se projette, non par un existant déjà donné.

    **Pour être transcendante, la fin doit être à la fois séparée de nous et accessible.** Or seul un ensemble d'existants réels peut nous en séparer ; et la fin n'est rien d'autre que l'« état à-venir » de ces existants, l'« esquisse d'un ordre » à leur donner. Par la **négation interne** (le pour-soi se rapporte au monde en niant d'être ce qu'il saisit), il éclaire les choses par la fin qu'il pose, et projette cette fin à partir de ce qu'il saisit d'elles.

    **Pas de cercle vicieux** entre la fin qui éclaire le monde et le monde qui suggère la fin : le surgissement du pour-soi se fait « d'un seul coup ». L'ordre des choses est donc indispensable à la liberté : c'est par lui qu'elle est à la fois « séparée et rejointe » de sa fin.

    === 15 Pas de liberté hors d'un monde résistant

    **Conclusion : les résistances que la liberté découvre dans les choses ne la menacent pas, elles lui permettent de surgir comme liberté.** Il ne peut y avoir de pour-soi libre qu'« engagé dans un monde résistant ». Hors de cet engagement, les notions mêmes de liberté, de déterminisme et de nécessité n'ont plus de sens : elles n'ont de sens que pour un être qui agit dans le monde.

    ! Sartre ne dit pas que l'obstacle est une illusion : il dit qu'il est réel, mais qu'il n'est __obstacle__ que pour une liberté.
  passage:
    label: "§2"
    text: "Cet argument n'a jamais profondément troublé les partisans de la liberté humaine : Descartes, le premier, reconnaissait à la fois que la volonté est infinie et qu'il faut « tâcher à nous vaincre plutôt que la fortune ». C'est qu'il convient ici de faire des distinctions ; beaucoup des faits énoncés par les déterministes ne sauraient être pris en considération. Le coefficient d'adversité des choses, en particulier, ne saurait être un argument contre notre liberté, car c'est par nous, c'est-à-dire par la position préalable d'une fin, que surgit ce coefficient d'adversité. Tel rocher, qui manifeste une résistance profonde si je veux le déplacer, sera, au contraire, une aide précieuse si je veux l'escalader pour contempler le paysage. En lui-même (s'il est même possible d'envisager ce qu'il peut être en lui-même), il est neutre, c'est-à-dire qu'il attend d'être éclairé par une fin pour se manifester comme adversaire ou comme auxiliaire. Encore ne peut-il se manifester de l'une ou l'autre manière qu'à l'intérieur d'un complexe ustensile déjà établi. Sans les pics et les piolets, les sentiers déjà tracés, la technique de l'ascension, le rocher ne serait ni facile ni malaisé à gravir ; la question ne se poserait pas, il ne soutiendrait aucun rapport d'aucune sorte avec la technique de l'alpinisme. Ainsi, bien que les choses brutes (ce que Heidegger appelle les « existants bruts ») puissent dès l'origine limiter notre liberté d'action, c'est notre liberté elle-même qui doit préalablement constituer le cadre, la technique et les fins par rapport auxquels elles se manifesteront comme des limites. Si le rocher, même, se révèle comme « trop difficile à gravir » et si nous devons renoncer à l'ascension, notons qu'il ne s'est révélé tel que pour avoir été originellement saisi comme gravissable ; c'est donc notre liberté qui constitue les limites qu'elle rencontrera par la suite. Certes, après ces remarques, il demeure un residuum innommable et impensable qui appartient à l'en-soi considéré et qui fait que, dans un monde éclairé par notre liberté, tel rocher sera plus propice à l'escalade et tel autre non. Mais loin que ce résidu soit originellement une limite de la liberté, c'est grâce à lui (c'est-à-dire à l'en-soi brut, en tant que tel) qu'elle surgit comme liberté. Le sens commun conviendra avec nous, en effet, que l'être dit libre est celui qui peut réaliser ses projets. Mais pour que l'acte puisse comporter une réalisation, il convient que la simple projection d'une fin possible se distingue a priori de la réalisation de cette fin. S'il suffit de concevoir pour réaliser, me voilà plongé dans un monde semblable à celui du rêve, où le possible ne se distingue plus aucunement du réel. Je suis condamné dès lors à voir le monde se modifier au gré des changements de ma conscience, je ne puis pas pratiquer, par rapport à ma conception, la « mise entre parenthèses » et la suspension de jugement qui distingueront une simple fiction d'un choix réel. L'objet apparaissant dès qu'il est simplement conçu ne sera plus ni choisi ni seulement souhaité. La distinction entre le simple souhait, la représentation que je pourrais choisir et le choix étant abolie, la liberté disparaît avec elle. Nous sommes libres lorsque le terme ultime par quoi nous nous faisons annoncer ce que nous sommes est une fin, c'est-à-dire non pas un existant réel, comme celui qui, dans la supposition que nous avons faite, viendrait combler notre souhait, mais un objet qui n'existe pas encore. Mais dès lors cette fin ne saurait être transcendante que si elle est séparée de nous en même temps qu'accessible. Seul un ensemble d'existants réels peut nous séparer de cette fin, de même que cette fin ne peut être conçue que comme état à-venir des existants réels qui m'en séparent. Elle n'est autre que l'esquisse d'un ordre des existants, c'est-à-dire d'une série de dispositions à faire prendre aux existants sur le fondement de leurs relations actuelles. Par la négation-interne, en effet, le pour-soi éclaire les existants dans leurs rapports mutuels par la fin qu'il pose, et projette cette fin à partir des déterminations qu'il saisit en l'existant. Il n'y a pas de cercle, nous l'avons vu, car le surgissement du pour-soi se fait d'un seul coup. Mais, s'il en est ainsi, l'ordre même des existants est indispensable à la liberté elle-même. C'est par eux qu'elle est séparée et rejointe par rapport à la fin qu'elle poursuit et qui lui annonce ce qu'elle est. En sorte que les résistances que la liberté dévoile dans l'existant, loin d'être un danger pour la liberté, ne font que lui permettre de surgir comme liberté. Il ne peut y avoir de pour-soi libre que comme engagé dans un monde résistant. En dehors de cet engagement, les notions de liberté, de déterminisme, de nécessité perdent jusqu'à leur sens."
