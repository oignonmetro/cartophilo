- id: sartre-liberte-situation-i2
  title: "Le problème : la liberté contre le bon sens"
  notes: |-
    **Le bon sens oppose à la liberté un argument de fait : nous sommes impuissants.** Nous ne choisissons ni notre naissance, ni notre classe, ni notre corps ; tout ce que nous faisons se heurte à la résistance des choses. Derrière cet argument, il y a le **déterminisme** : la thèse que tout ce qui arrive, nos actes compris, est l'effet nécessaire de causes antérieures (l'hérédité, le milieu, l'histoire).

    **La réponse de Sartre a trois temps**, qui suivent les trois paragraphes du texte :

    | § | Mouvement | Thèse |
    | 1 | l'argument du bon sens | l'homme semble « être fait » plutôt que « se faire » |
    | 2 | la résistance du monde | l'adversité ne surgit que par nos fins ; un monde résistant est la condition de la liberté |
    | 3 | choisir n'est pas obtenir | être libre, c'est « se déterminer à vouloir », non réussir |

    **Deux concepts de liberté s'affrontent** : le concept populaire, la liberté comme pouvoir d'obtenir ce que l'on veut ; le concept philosophique, la liberté comme autonomie du choix. Tout le texte consiste à montrer que l'argument du bon sens ne vaut que contre le premier.

    **Sartre s'appuie sur une tradition** : Descartes, qui tenait la volonté pour infinie tout en demandant de se vaincre soi-même plutôt que la fortune ; et, avant lui, les stoïciens.

    ! Sartre ne nie pas les faits invoqués par le bon sens : il nie qu'ils __prouvent__ l'absence de liberté.
