# Unité de texte (voir content/textes.md) : Sartre, L'Être et le Néant (1943),
# IVe partie, ch. I, « Liberté et facticité : la situation », début (p. 525-528),
# texte fourni par l'utilisatrice. Sans commentaire fourni : rappels et
# cartes-explication rédigés à partir du texte et de repères attestés
# (Descartes, Bacon, Heidegger, Husserl, Épictète).

id: sartre-liberte-situation
title: "La liberté en situation"
subtitle: "Sartre, L'Être et le Néant, IV, ch. I, p. 525-528"
icon: page
color: green
group: "Sartre : la liberté"
intro: |-
  Le début de la section « Liberté et facticité : la situation » de *L'Être et le Néant* : Sartre répond à l'argument du bon sens contre la liberté, notre impuissance face aux choses et à notre condition.

  Trois temps : l'objection ; la réponse, qui fait de la résistance du monde non une limite mais la condition de la liberté ; la distinction entre la liberté de choisir et celle d'obtenir.
lessons:
- id: sartre-liberte-situation-i1
  title: "L'Être et le Néant : en-soi, pour-soi, situation"
  notes: |-
    **Le texte ouvre la section « Liberté et facticité : la situation » du chapitre I (« Être et faire : la liberté ») de la quatrième partie** de *L'Être et le Néant*. Sartre y publie en 1943 son « essai d'ontologie phénoménologique » : une description de l'être tel qu'il apparaît à la conscience. Il vient d'établir que l'homme est libre ; il affronte ici l'objection la plus commune contre cette liberté.

    **Deux régions de l'être.**

    | | En-soi | Pour-soi |
    | ce que c'est | l'être des choses | l'être de la conscience, l'homme |
    | sa manière d'être | il est ce qu'il est : plein, opaque, sans manque | il est ce qu'il n'est pas et n'est pas ce qu'il est |
    | son rapport au néant | aucun | il introduit le néant dans le monde : il nie, il manque, il projette |
    | exemple du texte | le rocher | celui qui veut le déplacer ou l'escalader |

    **Trois notions pour lire le texte.**
    - La **facticité** : le fait d'être là sans l'avoir choisi : être né ouvrier, Français, avec tel corps, tel passé.
    - Le **projet** et la **fin** : le pour-soi se définit par ce qu'il n'est pas encore, par les fins vers lesquelles il se jette.
    - La **situation** : la facticité telle qu'elle apparaît à la lumière d'un projet libre ; Sartre en fait le produit commun de la facticité et de la liberté.

    **La liberté n'est pas pour Sartre une propriété parmi d'autres : elle est l'être même du pour-soi.** D'où la formule de *L'Être et le Néant* : l'homme est « condamné à être libre » ; il ne peut pas ne pas choisir, même en refusant de choisir.

    ! La facticité n'est pas le contraire de la liberté : le texte va montrer qu'elle n'apparaît comme limite qu'__à travers__ un projet libre.
