- id: sartre-liberte-situation-p1
  title: "L'argument du bon sens : notre impuissance"
  notes: |-
    **Sartre donne d'abord la parole à l'adversaire : l'argument « décisif » du bon sens contre la liberté est notre impuissance.** Loin de pouvoir changer notre situation, nous ne pouvons même pas nous changer nous-mêmes. Le paragraphe accumule les preuves, sans encore les discuter.

    **L'énumération va du plus vaste au plus intime** : on n'échappe ni au sort de sa classe, de sa nation, de sa famille, ni à son impuissance à s'enrichir, ni même à ses moindres appétits et habitudes. Puis viennent les données de naissance (« ouvrier, Français, hérédo-syphilitique ou tuberculeux »), c'est-à-dire la **facticité**. Toute vie est « l'histoire d'un échec » ; le monde oppose à nos entreprises un **coefficient d'adversité** tel qu'il faut des années pour le moindre résultat.

    **Même l'action réussie confirme le déterminisme** : la formule de Bacon, « obéir à la nature pour la commander », signifie qu'on n'agit qu'en se pliant aux lois de la nature, en insérant son action « dans les mailles du déterminisme ».

    **D'où la conclusion du bon sens : l'homme ne « se fait » pas, il « est fait ».**

    | Déterminations | Exemples du texte |
    | naturelles | le climat et la terre, la race, l'hérédité |
    | sociales et historiques | la classe, la nation, la langue, l'histoire de la collectivité |
    | individuelles | l'enfance, les habitudes acquises, les événements de la vie |

    « Se faire » est la thèse que Sartre défend : l'homme n'a pas de nature donnée, il est ce qu'il se fait. Le bon sens la renverse.

    ! Ce paragraphe n'exprime pas la pensée de Sartre : il expose l'objection __pour__ la réfuter, et il n'en contestera pas les faits, seulement la conclusion.
  passage:
