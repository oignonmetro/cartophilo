    text: "L'argument décisif utilisé par le bon sens contre la liberté consiste à nous rappeler notre impuissance. Loin que nous puissions modifier notre situation à notre gré, il semble que nous ne puissions pas nous changer nous-mêmes. Je ne suis « libre » ni d'échapper au sort de ma classe, de ma nation, de ma famille, ni même d'édifier ma puissance ou ma fortune, ni de vaincre mes appétits les plus insignifiants ou mes habitudes. Je nais ouvrier, Français, hérédo-syphilitique ou tuberculeux. L'histoire d'une vie, quelle qu'elle soit, est l'histoire d'un échec. Le coefficient d'adversité des choses est tel qu'il faut des années de patience pour obtenir le plus infime résultat. Encore faut-il « obéir à la nature pour la commander », c'est-à-dire insérer mon action dans les mailles du déterminisme. Bien plus qu'il ne paraît « se faire », l'homme semble « être fait » par le climat et la terre, la race et la classe, la langue, l'histoire de la collectivité dont il fait partie, l'hérédité, les circonstances individuelles de son enfance, les habitudes acquises, les grands et les petits événements de sa vie."
