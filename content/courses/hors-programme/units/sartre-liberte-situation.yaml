- id: sartre-liberte-situation-p3
  title: "Être libre n'est pas obtenir : l'autonomie du choix"
  notes: |-
    **Thèse : « être libre » ne signifie pas « obtenir ce qu'on a voulu », mais « se déterminer à vouloir par soi-même ».** Le succès est indifférent à la liberté. Le paragraphe dissipe le malentendu entre le bon sens et les philosophes, puis précise que le choix, s'il n'est pas l'obtention, n'est pas non plus le simple souhait.

    | Extrait | Ce qu'il établit |
    | 1 | choisir n'est pas obtenir : deux concepts de liberté |
    | 3 | le choix est un faire : l'exemple du captif |
    | 5 | pas de distinction entre l'intention et l'acte |
    | 7 | une distinction vue par Descartes et les stoïciens |

    === 1 Choisir n'est pas obtenir

    **Le désaccord entre le sens commun et les philosophes vient d'un malentendu sur le mot.** Le concept « empirique et populaire » de liberté, produit de circonstances historiques, politiques et morales, en fait la « faculté d'obtenir les fins choisies ». Le concept « technique et philosophique » signifie seulement l'« autonomie du choix » : se déterminer soi-même à vouloir.

    | Concept de liberté | Définition | Atteint par l'argument du bon sens ? |
    | empirique et populaire | la faculté d'obtenir les fins choisies | oui : nous échouons souvent |
    | technique et philosophique | l'autonomie du choix | non : le succès n'importe pas |

    === 3 Le captif

    **Mais le choix n'est pas un simple souhait : étant « identique au faire », il suppose un « commencement de réalisation ».** C'est le lien avec le paragraphe précédent : sans action dans un monde résistant, le choix se confondrait avec le rêve.

    | On ne dira pas que le captif est… | parce que… |
    | libre de sortir de prison | ce serait absurde |
    | libre de souhaiter sa libération | ce serait une lapalissade sans portée |
    | On dira qu'il est toujours libre… | |
    | de chercher à s'évader, ou à se faire libérer | il peut « pro-jeter » son évasion et en éprouver la valeur par un début d'action |

    Le tiret de « pro-jeter » souligne l'étymologie du projet : se jeter en avant, vers une fin.

    ! La liberté du captif n'est ni la sortie (obtenir) ni le souhait (rêver) : c'est la __tentative__, un début d'action.

    === 5 L'intention et l'acte

    **Puisque choisir et faire ne se distinguent pas, l'intention ne se distingue pas non plus de l'acte.** Sartre compare ce rapport à celui de la pensée et du langage : comme notre parole nous apprend notre pensée, nos actes nous apprennent nos intentions. Avant l'acte, nous ne faisons que vivre nos intentions, nous en avons une conscience **non-thétique** (qui ne les pose pas comme objets) ; l'acte permet de les dégager, de les schématiser, d'en faire des objets.

    ! On ne connaît pas d'abord ses intentions pour agir ensuite : c'est l'__acte__ qui nous les apprend.

    === 7 Descartes et les stoïciens

    **La distinction entre liberté du choix et liberté d'obtenir a été vue par Descartes, et avant lui par le stoïcisme**, qui sépare ce qui dépend de nous (nos jugements, nos désirs) de ce qui n'en dépend pas (le corps, les biens, la réputation), selon le début du *Manuel* d'Épictète. Elle met fin aux querelles sur « vouloir » et « pouvoir » : on peut vouloir librement ce qu'on ne peut pas obtenir.
  passage:
    label: "§3"
    text: "Il faut, en outre, préciser contre le sens commun que la formule « être libre » ne signifie pas « obtenir ce qu'on a voulu », mais « se déterminer à vouloir (au sens large de choisir) par soi-même ». Autrement dit, le succès n'importe aucunement à la liberté. La discussion qui oppose le sens commun aux philosophes vient ici d'un malentendu : le concept empirique et populaire de « liberté », produit de circonstances historiques, politiques et morales, équivaut à « la faculté d'obtenir les fins choisies ». Le concept technique et philosophique de liberté, le seul que nous considérions ici, signifie seulement : autonomie du choix. Il faut cependant noter que le choix, étant identique au faire, suppose, pour se distinguer du rêve et du souhait, un commencement de réalisation. Ainsi ne dirons-nous pas qu'un captif est toujours libre de sortir de prison, ce qui serait absurde, ni non plus qu'il est toujours libre de souhaiter l'élargissement, ce qui serait une lapalissade sans portée, mais qu'il est toujours libre de chercher à s'évader (ou à se faire libérer), c'est-à-dire que, quelle que soit sa condition, il peut pro-jeter son évasion et s'apprendre à lui-même la valeur de son projet par un début d'action. Notre description de la liberté, ne distinguant pas entre le choisir et le faire, nous oblige à renoncer du coup à la distinction entre l'intention et l'acte. On ne saurait pas plus séparer l'intention de l'acte que la pensée du langage qui l'exprime et, comme il arrive que notre parole nous apprend notre pensée, ainsi nos actes nous apprennent nos intentions, c'est-à-dire nous permettent de les dégager, de les schématiser, et d'en faire des objets au lieu de nous borner à les vivre, c'est-à-dire à en prendre une conscience non-thétique. Cette distinction essentielle entre la liberté du choix et la liberté d'obtenir a certainement été vue par Descartes, après le stoïcisme. Elle met un terme à toutes les discussions sur « vouloir » et « pouvoir » qui opposent aujourd'hui encore les partisans et les adversaires de la liberté."
