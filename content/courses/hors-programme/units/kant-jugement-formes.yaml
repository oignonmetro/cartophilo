- id: kj3-l4
  title: "Une logique limitée et confuse ?"
  notes: |-
    **Vue d'aujourd'hui, la logique de Kant paraît à la fois trop faible et trop forte.** Le logicien **Hazen** la juge {red}« terriblement étroite d'esprit et mathématiquement triviale »{/red}.

    **Deux limites : elle serait trop faible.**
    - Toutes ses propositions sont sujet-prédicat à une place ou des composés de celles-ci. Elle ignore donc les {violet}prédicats relationnels{/violet} et la {violet}quantification multiple{/violet} : elle est au plus une {violet}logique monadique{/violet} (bien que du second ordre). Les schémas d'arguments de la *Logique* de Jäsche sont tous vérifonctionnels, syllogistiques ou fondés sur l'inclusion analytique.
    - Sa liste des relations propositionnelles omet la {violet}conjonction{/violet} : même sa logique des fonctions de vérité paraît incomplète.

    Elle est donc nettement plus faible que la logique « élémentaire », et ne peut équivaloir à une logique mathématique à la Frege-Russell. Celle-ci serait d'ailleurs pour Kant une logique transcendantale.

    **Quatre confusions : elle serait trop forte.**
    - Il donne aux propositions universelles affirmatives (« tous les F sont G ») une {red}portée existentielle{/red}, à la manière d'Aristote, au lieu d'y voir des conditionnels matériels (« pour tout x, si Fx alors Gx »).
    - Il comprend le conditionnel comme le {red}rapport de principe à conséquence{/red}, confondant ainsi conditionnels stricts et matériels.
    - En distinguant jugement négatif et jugement infini, il sépare sans nécessité la négation de la proposition et celle du prédicat. D'où une ambiguïté : « les F ne sont pas G » peut se lire « aucun F n'est G » (sans engagement d'existence) ou « les F sont non-G » (avec engagement d'existence).
    - Il conçoit la disjonction comme le {red}« ou » exclusif{/red}, là où la lecture correcte serait le « ou » inclusif.

    Résultat : sa logique n'est pas une logique extensionnelle.

    ! Ces reproches supposent un point de vue déterminé sur ce qu'est la logique : c'est ce que la leçon suivante examine.
  points:
  - id: kj3-l4-p1
    sentence: "Kant ignorant les prédicats relationnels et la quantification multiple, sa logique générale pure est au plus une logique ___."
    answer: "monadique"
    alt: []
  - id: kj3-l4-p2
    sentence: "La liste kantienne des relations entre propositions omet la ___, de sorte que sa logique des fonctions de vérité paraît incomplète."
    answer: "conjonction"
    alt: []
  - id: kj3-l4-p3
    sentence: "La logique mathématique à la Frege-Russell, qui inclut la quantification sur les propriétés, serait pour Kant une logique ___, non une logique générale pure."
    answer: "transcendantale"
    alt: []
  - id: kj3-l4-p4
    sentence: "Kant donne aux propositions « tous les F sont G » une portée ___, à la manière d'Aristote, alors qu'on les lit aujourd'hui comme des conditionnels matériels."
    answer: "existentielle"
    alt: []
  - id: kj3-l4-p5
    sentence: "Kant comprend le conditionnel « si P alors Q » comme le rapport de ___ à conséquence, confondant, à ce qu'il semble, conditionnels stricts et conditionnels matériels."
    answer: "principe"
    alt: ["fondement"]
  - id: kj3-l4-p6
    sentence: "Kant conçoit la disjonction comme le « ou » ___, qui implique que si « P ou Q » est vrai, « P et Q » est faux."
    answer: "exclusif"
    alt: []
  - id: kj3-l4-p7
    sentence: "Comme le jugement infini « les F sont non-G » garde un engagement d'existence et non le jugement négatif « aucun F n'est G », la phrase « les F ne sont pas G » devient systématiquement ___ dans la logique kantienne."
    answer: "ambiguë"
    alt: ["ambigue"]
