- id: kj3-l5
  title: "Défense de la logique kantienne contre le logicisme"
  notes: |-
    **Ces reproches ne menacent pas la théorie du jugement, car ils présupposent le logicisme de Frege et Russell.** Le {violet}logicisme{/violet} tient que les mathématiques, ou du moins l'arithmétique, se réduisent à une logique du second ordre. Hanna oppose à ces reproches trois répliques kantiennes.

    **L'absence de logique des relations n'est pas un oubli.** Si la logique générale pure ne traite ni des relations ni de la quantification multiple, c'est que les relations mathématiques sont, pour Kant, représentées dans l'espace et le temps par l'intuition pure, non dans l'entendement : elles relèvent de l'{sky}Esthétique transcendantale{/sky}. Les vérités mathématiques ne sont donc pas des vérités logiques (analytiques, fondées sur des concepts) mais des {green}vérités synthétiques, fondées sur l'intuition{/green}. Il n'y a donc pas, par nature, de « logique mathématique » authentique. Et cette thèse ne se balaie pas, au vu de ce que l'on sait du statut problématique du logicisme : le paradoxe de **Russell**, le théorème de **Church** sur l'indécidabilité, le premier théorème d'incomplétude de **Gödel**, le théorème de **Tarski** sur l'indéfinissabilité de la vérité, le problème de « César » de **Frege**, le souci de **Benacerraf**.

    **La conjonction et l'inclusion sont implicitement là.** Kant connaît la disjonction inclusive : admettant le conditionnel, il remarque que {teal}« la question de savoir si ces deux propositions sont en elles-mêmes vraies reste ici non décidée »{/teal}, puis distingue le rapport de conséquence de la disjonction exclusive (Analytique des concepts, §9). Or, **De Morgan** l'a montré, la conjonction se définit par la négation et la disjonction inclusive ; et, **Sheffer** l'a montré, toutes les fonctions de vérité s'expriment par une seule fonction. Implicitement, {coral}sa logique des fonctions de vérité est donc complète{/coral}.

    **Ne pas être extensionnelle, c'est être intensionnelle.** La logique de Kant est une {violet}logique intensionnelle{/violet}, faite d'engagements d'existence non uniformes, de modalités primitives et de structures conceptuelles fines. Sa liste des formes est donc plus étroite que la logique élémentaire (monadique) et plus large (intensionnelle). Ce double choix se défend pour deux raisons :
    - parmi les logiques classiques des prédicats, seule la logique monadique est décidable et complète (Boolos et Jeffrey) : la logique générale pure peut prétendre être le {yellow}« noyau *a priori* »{/yellow} de la logique classique ;
    - les logiques intensionnelles et non classiques se sont développées avec rigueur depuis le milieu du XXe siècle (**Priest**).

    ! Hanna ne dit pas que Kant avait anticipé ces résultats, mais que la thèse kantienne, jugée d'après eux, n'a rien de naïf.
  points:
