- id: kj3-l1
  title: "La logique générale pure"
  notes: |-
    **La forme logique n'existe, pour Kant, que dans le jugement.** Sa conception, plus que sa logique elle-même, a marqué la logique moderne : de **Boole** et **Humboldt** à **Frege**, au second **Wittgenstein** et à **Chomsky**, on retrouve l'idée que la logique n'existe que dans le contexte des activités et des capacités de jugement des animaux rationnels. Cette leçon dit ce qu'est cette logique, avant d'en donner la table.

    **Trois mots à prendre un par un.** La table des jugements relève de la {violet}logique générale pure{/violet} :
    - {green}pure{/green}, parce qu'elle est *a priori*, nécessaire et sans contenu sensible ;
    - {green}générale{/green}, parce qu'elle fait abstraction de toute différence particulière entre les objets représentés et {teal}« n'a affaire qu'à la simple forme de la pensée »{/teal} (Logique transcendantale, Introduction, I) ;
    - {green}logique{/green}, parce qu'elle fournit des règles catégoriquement normatives, conditions *sine qua non* de la vérité des jugements (la loi de non-contradiction) et de l'inférence valide (la loi de conséquence logique) (Logique transcendantale, Introduction, I).

    **Logique générale, logique transcendantale.** Toutes deux sont pures et *a priori*. Mais la logique transcendantale est {violet}spéciale{/violet} : elle est restreinte du point de vue de l'être et présuppose l'existence de certaines sortes d'objets (Logique transcendantale, Introduction, II). Elle présuppose donc la logique générale, et elle est synthétique *a priori*, non analytique. Certains interprètes (**Rödl**, **Tolley**) soutiennent {pink}l'inverse{/pink}, au motif que la pensée, par nature, se dirige vers des objets. Hanna répond que cela ne suit pas : une logique générale et formelle peut être objectivement valide sans être pour autant engagée envers telle sorte d'objets.

    **Un « devoir » logique.** La logique générale pure lie absolument tout penseur : ses lois sont les {green}lois catégoriquement normatives de la pensée{/green}, pour tout animal rationnel réel et possible. Elle est donc une science formelle et une science morale, mais {red}non une science de la nature{/red} : le devoir ne se réduit pas à l'être. Comme le devoir moral exprimé par l'impératif catégorique, le devoir logique est rarement bien suivi par des êtres finis et imparfaits, qui commettent sophismes et péchés avec une fréquence comparable ; hélas, le devoir n'entraîne pas l'être. Réciproquement, heureusement, l'être n'entraîne pas le devoir : aucun fait de psychologie empirique ne fait une loi logique. D'où l'{coral}antipsychologisme{/coral} de Kant.

    ! Dire que les gens raisonnent souvent mal ne réfute pas une loi logique : elle prescrit comment on doit penser, elle ne décrit pas comment on pense.
  points:
  - id: kj3-l1-p1
