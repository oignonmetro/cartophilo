- id: kj3-l2
  title: "La table des jugements"
  notes: |-
    **La table énumère toutes les formes logiques possibles des propositions** : quatre titres, chacun à trois sous-espèces (Analytique des concepts, §9). Kant l'appelle aussi {teal}« les fonctions de l'unité dans les jugements »{/teal} (Analytique des concepts, chapitre I, 1re section), pour marquer qu'une forme logique n'existe que dans une proposition : le contenu d'un jugement est plus fondamental que sa forme. Les formes logiques correspondent une à une aux catégories, ce qu'établit la {sky}Déduction métaphysique{/sky} (Analytique des concepts, §10 ; Déduction transcendantale, §26).

    | Titre | Jugement | Forme |
    | quantité | universel | tous les F sont G |
    | quantité | particulier | quelques F sont G |
    | quantité | singulier | ce F est G |
    | qualité | affirmatif | les F sont G |
    | qualité | négatif | aucun F n'est G |
    | qualité | infini | les F sont non-G |
    | relation | catégorique | les F sont G, atome |
    | relation | hypothétique | si P alors Q |
    | relation | disjonctif | les F sont ou G ou H |
    | modalité | problématique | possiblement P |
    | modalité | assertorique | effectivement P |
    | modalité | apodictique | nécessairement P |

    **Tout part de la prédication.** Il est défendable que toutes ces formes soient des modifications ou des composés de la proposition simple à une place, sujet-prédicat, « les F sont G ». Chaque titre répond à une question propre.
    - **Quantité** : les trois façons dont se combinent et se séparent les extensions de deux concepts.
    - **Qualité** : les trois façons de poser (`gesetzt`) ou de supprimer (`aufgehoben`) l'existence de ce à quoi renvoient les concepts, en leur attribuant une extension effective non vide ou nulle (Idéal de la raison pure, 4e section).
    - **Relation** : les propositions sont atomiques (la forme catégorique), ou moléculaires quant à leur valeur de vérité (hypothétique, disjonctif). Dans le jugement disjonctif, les parties sont mutuellement exclusives et leur ensemble est exhaustif.
    - **Modalité** : voir la leçon suivante.

    ! Le jugement infini n'est pas le jugement négatif : « aucun homme n'est mortel » nie la proposition ; « les hommes sont non-mortels » place les hommes dans la classe des non-mortels.
  points:
  - id: kj3-l2-p1
    sentence: "La table des jugements compte quatre titres : quantité, qualité, relation et ___, chacun à trois sous-espèces."
    answer: "modalité"
    alt: []
  - id: kj3-l2-p2
    sentence: "Kant appelle aussi la table des jugements « les ___ de l'unité dans les jugements » (Analytique des concepts, chapitre I, 1re section), pour marquer qu'une forme logique n'existe que dans une proposition."
