- id: kj3-l3
  title: "La modalité : ni psychologie, ni épistémologie"
  notes: |-
    **Le titre de la modalité semble donner raison à ceux qui font de la logique kantienne une psychologie : Hanna le conteste.** La modalité d'un jugement {teal}« ne contribue en rien au contenu du jugement [...] mais concerne seulement la valeur de la copule par rapport à la pensée en général »{/teal} (Analytique des concepts, §9).

    **Le soupçon.** Cette doctrine paraît confondre les trois attitudes de l'{red}opinion, de la croyance et de la certitude{/red} (Canon de la raison pure, 3e section) avec les notions de possibilité, d'effectivité et de nécessité, voire psychologiser la modalité. C'est un cas de l'interprétation courante, selon laquelle la logique et la théorie du jugement de Kant seraient au fond épistémologiques ou psychologiques.

    **Quatre raisons de la rejeter.**
    - Kant isole et discute expressément les attitudes propositionnelles dans son épistémologie et son éthique de la croyance : il ne les confond donc pas avec la modalité logique.
    - Il rejette fermement le psychologisme logique.
    - La {violet}« valeur »{/violet} (`Wert`) désigne la valeur de vérité de la proposition entière : d'où le fait que le prédicat modal n'ajoute rien au contenu propre, au-delà de cette valeur.
    - Surtout, la {violet}« pensée en général »{/violet} est pour Kant l'équivalent conceptuel des **mondes logiquement possibles** de Leibniz (*Critique de la raison pure*, Préface de la seconde édition ; Idéal de la raison pure, 2e section).

    **La lecture de Hanna.** Les trois modalités sont les trois façons d'assigner la vérité à une proposition à travers les mondes logiquement possibles :

    | Jugement | Modalité | Vrai dans |
    | problématique | possibilité | certains mondes |
    | assertorique | effectivité | ce monde seul |
    | apodictique | nécessité | tous les mondes |

    Ce monde-ci est fixé par son caractère indexical, par l'intuition sensible humaine : celui où je me trouve.

    ! Cette traduction en mondes possibles est celle de Hanna, non un vocabulaire de Kant : elle sert à montrer que la modalité porte sur la vérité, non sur l'état d'esprit de celui qui juge.
  points:
