                  answer: "immortaliser"
            - id: a9
              label: "Grande Morale, II, 15"
              title: "L'ami est un médiateur dans la connaissance de soi"
              summary: "On se connaît en regardant son ami, comme dans un miroir"
              rel: declinaison
              points:
                - id: at9-1
                  sentence: "Nous ne pouvons nous contempler nous-mêmes par nous-mêmes : nous reprochons aux autres ce que nous faisons ___."
                  answer: "nous-mêmes"
                  alt: ["nous memes"]
                - id: at9-2
                  sentence: "Comme nous voyons notre visage dans un ___, nous nous connaissons en regardant notre ami."
                  answer: "miroir"
                - id: at9-3
                  sentence: "L'ami est un autre ___ : même l'homme qui se suffit en a besoin pour se connaître."
                  answer: "soi-même"
                  alt: ["moi-même", "moi"]
        - id: b-poetique
          label: "Textes 10, 11"
          question: "Pourquoi l'imitation plaît-elle, et qu'est-ce qu'une tragédie ?"
          rel: changement-de-question
          parts:
            - id: a10
              label: "Poétique, 4"
              title: "L'imitation"
              summary: "Imiter est naturel à l'homme, et l'on apprend en regardant les images"
              points:
                - id: at10-1
                  sentence: "Imiter est naturel aux hommes dès l'___ : l'homme est le plus imitateur des animaux."
                  answer: "enfance"
                - id: at10-2
                  sentence: "Nous regardons avec plaisir les images des choses dont la vue nous est pénible, comme les formes des bêtes les plus viles et des ___."
                  answer: "cadavres"
                - id: at10-3
                  sentence: "Ce plaisir vient de ce qu'on ___ en regardant : on reconnaît que c'est bien là tel ou tel."
                  answer: "apprend"
            - id: a11
              label: "Poétique, 6"
              title: "Le spectacle tragique"
              summary: "La tragédie imite une action noble, et purge la pitié et la crainte"
              rel: declinaison
              points:
                - id: at11-1
                  sentence: "La tragédie est l'imitation d'une action ___ et complète, d'une certaine étendue."
                  answer: "noble"
                  alt: ["sérieuse", "grave"]
                - id: at11-2
                  sentence: "Suscitant pitié et ___, la tragédie opère la purgation de ce genre d'émotions."
                  answer: "crainte"
                  alt: ["frayeur", "terreur"]
                - id: at11-3
                  sentence: "La plus importante des six parties de la tragédie est l'agencement des faits, l'___ : c'est l'âme de la tragédie."
                  answer: "intrigue"
                  alt: ["histoire", "fable", "mythos"]
    - id: cite-justice
      label: "Textes 14-18"
      title: "La cité et la justice"
      parts:
        - id: b-cite-justice
          label: "Textes 14-18"
          question: "Qu'est-ce que la cité, et que doit y être la justice ?"
          parts:
            - id: a15
              label: "Éthique à Nicomaque, I, 1"
              title: "Le Souverain Bien relève de la science politique"
              summary: "Toute action vise un bien ; le bien suprême relève de la politique"
              points:
                - id: at15-1
                  sentence: "Tout art et toute recherche, toute action et tout choix visent quelque bien : le bien est ce à quoi toutes choses ___."
                  answer: "tendent"
                  alt: ["aspirent"]
                - id: at15-2
                  sentence: "S'il n'existait pas de fin voulue pour elle-même, le désir irait à l'___, et serait vide et vain."
                  answer: "infini"
                - id: at15-3
                  sentence: "La science du bien suprême est la plus ___ : la politique, qui règle quelles sciences la cité doit cultiver."
                  answer: "architectonique"
                  alt: ["maîtresse", "souveraine"]
            - id: a14
              label: "Politique, I, 2"
              title: "L'homme est un animal politique"
              summary: "La cité existe par nature, et l'homme est fait pour elle"
              rel: declinaison
              points:
                - id: at14-1
                  sentence: "La cité est l'aboutissement de la famille et du village, et elle existe par ___."
                  answer: "nature"
                - id: at14-2
                  sentence: "Celui qui est sans cité par nature est soit une ___, soit un dieu."
                  answer: "bête"
                - id: at14-3
                  sentence: "Seul parmi les animaux, l'homme a le ___, qui manifeste l'utile et le nuisible, le juste et l'injuste ; la voix n'exprime que le plaisir et la peine."
                  answer: "langage"
                  alt: ["logos", "discours", "parole"]
                - id: at14-4
                  sentence: "La cité est antérieure par nature à l'individu, comme le tout à la partie : séparée du corps, une main n'en est plus une que de ___."
                  answer: "nom"
            - id: a16
              label: "Éthique à Nicomaque, VI, 7-8"
              title: "La sagesse politique"
              summary: "La prudence, sagesse de l'action, porte sur le particulier"
              rel: declinaison
              points:
                - id: at16-1
                  sentence: "On dit Anaxagore et Thalès sages, mais non ___, parce qu'ils ignorent ce qui leur est utile."
                  answer: "prudents"
                  alt: ["avisés"]
                - id: at16-2
                  sentence: "La prudence ne porte pas seulement sur l'universel : l'action concerne le ___."
                  answer: "particulier"
                  alt: ["singulier"]
                - id: at16-3
                  sentence: "Les jeunes gens peuvent devenir géomètres, mais non prudents, faute d'___."
                  answer: "expérience"
