              title: "L'âme, forme du corps"
              summary: "L'âme est ce par quoi nous vivons : forme et entéléchie du corps"
              rel: declinaison
              points:
                - id: at4-1
                  sentence: "L'âme est, au sens primordial, ce par quoi nous vivons, percevons et pensons : elle est notion et forme, et non ___ et substrat."
                  answer: "matière"
                - id: at4-2
                  sentence: "La matière est puissance, et la forme ___."
