              label: "Politique, I, 9"
              title: "Monnaie et spéculation"
              summary: "L'acquisition naturelle a une limite ; le commerce de l'argent n'en a pas"
              rel: declinaison
              points:
                - id: at17-1
                  sentence: "Toute chose a deux usages : la chaussure sert à chausser, et aussi à l'___."
                  answer: "échange"
                - id: at17-2
                  sentence: "Le commerce ne connaît pas de ___ à la richesse qu'il recherche, à la différence de l'économie domestique."
                  answer: "limite"
                  alt: ["bornes", "borne"]
                - id: at17-3
                  sentence: "Midas, qui changeait en ___ tout ce qu'il touchait, mourut de faim : la richesse monétaire n'est pas la vraie richesse."
                  answer: "or"
            - id: a18
              label: "Éthique à Nicomaque, V, 7"
              title: "Si la justice distributive est proportionnelle, la justice corrective est égalitaire"
              summary: "Distribuer selon le mérite, corriger sans égard aux personnes"
              rel: declinaison
              points:
                - id: at18-1
                  sentence: "Dans la distribution des biens communs, le juste suit une proportion ___, celle des mérites."
                  answer: "géométrique"
                - id: at18-2
                  sentence: "Dans les transactions, la justice corrective suit une proportion ___ : elle ne regarde pas qui a lésé qui."
                  answer: "arithmétique"
                - id: at18-3
                  sentence: "Aller trouver le juge, c'est aller trouver la justice : le juge est comme une justice ___."
                  answer: "vivante"
                  alt: ["animée"]
  recaps:
    - at: b-logique-nature
      label: "Textes 1, 2, 4, 5"
      title: "Raisonner, et penser l'être naturel"
      notes: |-
        **Aristote fonde le raisonnement (le syllogisme des Topiques) et pense l'être naturel par un principe interne : la nature est principe de mouvement (Physique II), l'âme est forme du vivant (De l'âme II), et le temps mesure ce qui change (Physique IV).**

        | Texte | Idée |
        | 1. Topiques, I, 1 | des prémisses posées, une conclusion suit nécessairement : démonstration (prémisses vraies), dialectique (idées admises) |
        | 2. Physique, II, 1 | l'être naturel a en lui le principe de son mouvement et de son repos, non l'objet de l'art |
        | 4. De l'âme, II, 2 | vivre se dit en plusieurs sens (nutrition, sensation, pensée) ; l'âme est forme, le corps matière |
        | 5. Physique, IV, 12 | être dans le temps, c'est être mesuré par lui ; ce qui est toujours n'est pas dans le temps |

        ! Le syllogisme dialectique n'est pas faux : il part d'idées admises, non de prémisses premières.
    - at: b-metaphysique
      label: "Textes 3, 6, 7, 8"
      title: "La science première, de la sensation au premier moteur"
      notes: |-
        **De l'amour de connaître (Α) à Dieu, acte pur (Λ), la Métaphysique cherche les premières causes : la science de l'être en tant qu'être (Γ), qui pense l'acte et la puissance (Θ).**

        | Texte | Idée |
        | 6. Métaphysique, Α, 1 | tous les hommes désirent connaître ; l'art sait la cause, l'expérience seulement le fait |
        | 7. Métaphysique, Γ, 1 | une science étudie l'être en tant qu'être, là où les autres en découpent une partie |
        | 3. Métaphysique, Θ, 6 | l'acte se saisit par analogie ; il a sa fin en lui, à la différence du mouvement |
        | 8. Métaphysique, Λ, 7 | un premier moteur immobile, acte pur, meut comme ce qui est aimé |

        Les livres de la *Métaphysique* se désignent par des lettres grecques : Α (1), Γ (4), Θ (9), Λ (12). Au clavier, on peut taper la lettre, son nom (« theta ») ou le numéro (« IX »).

        ! Le premier moteur ne pousse rien : il meut comme objet de désir, sans être mû.
    - at: b-bonheur
      label: "Textes 9, 12, 13"
      title: "Le bonheur et l'ami"
      notes: |-
        **Tous nomment bonheur le souverain bien, mais le placent dans le plaisir, l'honneur ou la richesse (EN I) ; Aristote le place au plus haut dans la contemplation (EN X), et montre que même le sage a besoin d'un ami pour se connaître (Grande Morale).**

        | Texte | Idée |
        | 12. Éthique à Nicomaque, I, 2-3 | accord sur le nom (bonheur), désaccord sur la chose : plaisir, honneur, richesse |
        | 13. Éthique à Nicomaque, X, 7 | le bonheur parfait est l'activité de l'intellect : continue, autarcique, presque divine |
        | 9. Grande Morale, II, 15 | on se connaît en regardant l'ami, un autre soi-même, comme un miroir |

        Les chapitres de l'*Éthique à Nicomaque* suivent la division de l'édition GF (traduction Bodéüs).

        ! L'autarcie du sage n'exclut pas l'amitié : il a besoin de l'ami, non pour vivre, mais pour se connaître.
    - at: b-poetique
      label: "Textes 10, 11"
      title: "L'imitation et la tragédie"
      notes: |-
        **L'imitation est naturelle à l'homme et source de plaisir, parce qu'on apprend en reconnaissant (Poétique, 4) ; la tragédie imite une action noble et purge la pitié et la crainte (Poétique, 6).**

        | Texte | Idée |
        | 10. Poétique, 4 | imiter est naturel dès l'enfance ; même l'image des cadavres plaît, parce qu'on apprend |
        | 11. Poétique, 6 | la tragédie, imitation d'une action noble, purge pitié et crainte ; l'intrigue en est l'âme |

        ! Le plaisir de l'imitation ne vient pas de l'objet imité, parfois repoussant, mais de ce qu'on apprend en le reconnaissant.
    - at: b-cite-justice
      label: "Textes 14-18"
      title: "La cité, la prudence et la justice"
      notes: |-
        **Le bien suprême relève de la politique (EN I, 1), parce que l'homme est un animal politique (Politique I, 2) ; la cité demande la prudence (EN VI), une juste mesure de l'acquisition (Politique I, 9) et une justice qui distribue et qui corrige (EN V, 7).**

        | Texte | Idée |
        | 15. Éthique à Nicomaque, I, 1 | toute action vise un bien ; la politique, science architectonique, vise le bien suprême |
        | 14. Politique, I, 2 | la cité existe par nature ; l'homme, doué de langage, est un animal politique |
        | 16. Éthique à Nicomaque, VI, 7-8 | la prudence porte sur le particulier : Thalès est sage, non prudent |
        | 17. Politique, I, 9 | deux usages de chaque chose ; le commerce de l'argent n'a pas de limite (Midas) |
        | 18. Éthique à Nicomaque, V, 7 | distribuer selon le mérite (proportion géométrique), corriger sans égard aux personnes (arithmétique) |

        ! « Animal politique » ne veut pas dire que l'homme vit en groupe comme les abeilles : il vit dans une cité, parce qu'il a le langage du juste et de l'injuste.
