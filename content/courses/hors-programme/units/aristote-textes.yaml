                  sentence: "Le temps est ___ du mouvement, et le mouvement défait ce qui est."
                  answer: "nombre"
                - id: at5-2
                  sentence: "Nous avons l'habitude de dire que le temps ___, que tout vieillit sous l'action du temps."
