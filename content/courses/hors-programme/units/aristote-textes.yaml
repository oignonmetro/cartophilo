# Unité-œuvre (voir content/oeuvres.md), pour réviser les 18 textes
# d'Aristote d'un manuel de philosophie (Les auteurs et les textes, Antiquité
# et Moyen Âge, pp. 68-80) : associer chaque texte (œuvre, livre, chapitre) à
# son idée. Titres des textes : ceux du manuel ; références fournies par
# l'utilisatrice, les chapitres de l'Éthique à Nicomaque suivant la division de
# l'édition GF (traduction Bodéüs). Livres de la Métaphysique en capitales
# grecques (Α, Γ, Θ, Λ). Aucune citation : les thèses reformulent les textes.

id: aristote-textes
title: "Aristote : textes clés"
subtitle: "18 textes, des Topiques à la Politique"
icon: map
color: sky
group: "Aristote"
intro: |-
  Les 18 textes d'Aristote du manuel, à associer à leur idée : où Aristote dit-il que la nature est un principe de mouvement, que l'ami est un miroir, que la tragédie purge la pitié et la crainte ?

  Chaque texte est repéré par son œuvre, son livre et son chapitre. Au clavier, le titre peut s'abréger (« Métaph. », « Pol. ») ou se réduire à son sigle (« EN », « GM ») ; un livre de la *Métaphysique* se tape par sa lettre, son nom ou son numéro (« Θ », « theta », « IX »).
work:
  parts:
    - id: logique-nature-metaphysique
      label: "Textes 1-8"
      title: "Logique, nature et métaphysique"
      parts:
        - id: b-logique-nature
          label: "Textes 1, 2, 4, 5"
          question: "Comment raisonner, et qu'est-ce qu'un être naturel ?"
          parts:
            - id: a1
              label: "Topiques, I, 1"
              title: "Le syllogisme"
              summary: "Des prémisses posées, une conclusion suit nécessairement"
              points:
                - id: at1-1
                  sentence: "Le syllogisme est un discours où, certaines choses étant posées, une chose autre que ces données en résulte ___ par elles."
                  answer: "nécessairement"
                - id: at1-2
                  sentence: "Il y a démonstration quand le syllogisme part de prémisses ___ et premières."
                  answer: "vraies"
                - id: at1-3
                  sentence: "Le syllogisme dialectique part d'idées ___ : celles qui paraissent vraies à tous, à la plupart ou aux sages."
                  answer: "admises"
                  alt: ["reçues", "probables"]
            - id: a2
              label: "Physique, II, 1"
              title: "La nature est un principe de mouvement"
              summary: "Les êtres naturels ont en eux le principe de leur mouvement"
              rel: declinaison
              points:
                - id: at2-1
                  sentence: "Les êtres naturels ont en eux-mêmes un principe de mouvement et de ___."
                  answer: "repos"
                - id: at2-2
                  sentence: "Un lit ou un manteau, en tant que produits de l'___, n'ont en eux aucune tendance innée au changement."
                  answer: "art"
                  alt: ["technique"]
                - id: at2-3
                  sentence: "La nature se dit plutôt de la ___ que de la matière : une chose est ce qu'elle est quand elle est en acte."
                  answer: "forme"
            - id: a4
              label: "De l'âme, II, 2"
              title: "L'âme, forme du corps"
              summary: "Vivre se dit en plusieurs sens ; l'âme est ce par quoi nous vivons"
              rel: declinaison
              points:
                - id: at4-1
                  sentence: "Il suffit, pour qu'on dise qu'une chose vit, qu'elle ait l'intellect, la sensation, le mouvement local ou la ___."
                  answer: "nutrition"
                  alt: ["croissance"]
                - id: at4-2
                  sentence: "Les plantes vivent par la seule faculté ___, qui peut exister séparée des autres."
                  answer: "nutritive"
                - id: at4-3
                  sentence: "C'est d'abord la ___ qui fait l'animal, le toucher pouvant exister sans les autres sens."
                  answer: "sensation"
                - id: at4-4
                  sentence: "L'âme est ce par quoi nous vivons, sentons et pensons premièrement : elle est forme, et le corps ___."
                  answer: "matière"
            - id: a5
              label: "Physique, IV, 12"
              title: "Le temps et l'être éternel"
              summary: "Ce qui est toujours n'est pas dans le temps"
              rel: declinaison
              points:
                - id: at5-1
                  sentence: "Être dans le temps, c'est pour une chose avoir son être ___ par le temps."
                  answer: "mesuré"
                - id: at5-2
                  sentence: "On dit que le temps ___ les choses, et que tout vieillit sous son action."
                  answer: "consume"
                  alt: ["use", "détruit"]
                - id: at5-3
                  sentence: "Les êtres éternels ne sont pas dans le temps : le signe en est que le temps ne les ___ en rien."
                  answer: "affecte"
        - id: b-metaphysique
          label: "Textes 3, 6, 7, 8"
          question: "Que cherche la science première, et jusqu'où remonte-t-elle ?"
          rel: declinaison
          parts:
            - id: a6
              label: "Métaphysique, Α, 1"
              title: "Voir et savoir"
              summary: "Tous les hommes désirent naturellement connaître"
              points:
                - id: at6-1
                  sentence: "Le signe que tous les hommes désirent connaître est le ___ que leur causent les sensations, la vue surtout."
                  answer: "plaisir"
                - id: at6-2
                  sentence: "Nous préférons la vue à presque tout le reste, parce qu'elle nous fait connaître le plus et nous découvre beaucoup de ___."
                  answer: "différences"
                - id: at6-3
                  sentence: "L'homme d'expérience sait que la chose est ; l'homme de l'art en sait le pourquoi, la ___."
                  answer: "cause"
            - id: a7
              label: "Métaphysique, Γ, 1"
              title: "La métaphysique, science de l'Être en tant qu'être"
              summary: "Une science étudie l'être en tant qu'être, non une partie de l'être"
              rel: declinaison
              points:
                - id: at7-1
                  sentence: "Il y a une science qui étudie l'être en tant qu'être, et les attributs qui lui appartiennent ___."
                  answer: "essentiellement"
                  alt: ["par soi"]
                - id: at7-2
                  sentence: "Les autres sciences découpent une ___ de l'être et en étudient les attributs, comme font les mathématiques."
                  answer: "partie"
                - id: at7-3
                  sentence: "Cette science cherche les principes premiers et les ___ les plus hautes."
                  answer: "causes"
            - id: a3
              label: "Métaphysique, Θ, 6"
              title: "Acte et puissance"
              summary: "L'acte se saisit par analogie : il est la chose même, et non sa puissance"
              rel: declinaison
              points:
                - id: at3-1
                  sentence: "On dit que l'Hermès est en puissance dans le ___, parce qu'il pourrait en être tiré."
                  answer: "bois"
                - id: at3-2
                  sentence: "L'acte ne se définit pas, il se saisit par ___ : ce qui bâtit est à ce qui peut bâtir comme l'éveillé à l'endormi."
                  answer: "analogie"
                - id: at3-3
                  sentence: "Dans l'acte, la fin est présente : on voit et en même temps on a vu, alors que dans le ___, comme maigrir ou bâtir, la fin est hors de l'action."
                  answer: "mouvement"
            - id: a8
              label: "Métaphysique, Λ, 7"
              title: "Dieu, premier moteur et acte pur"
              summary: "Un premier moteur immobile meut toutes choses comme objet d'amour"
              rel: declinaison
              points:
                - id: at8-1
                  sentence: "Il existe un premier moteur qui meut sans être ___ : éternel, il est substance et acte."
                  answer: "mû"
                  alt: ["mu"]
                - id: at8-2
                  sentence: "Le premier moteur meut comme l'objet du désir, en tant qu'il est ___."
                  answer: "aimé"
                - id: at8-3
                  sentence: "Dieu est un vivant éternel et parfait : la ___ et la durée continue et éternelle lui appartiennent."
                  answer: "vie"
    - id: bonheur-amitie-art
      label: "Textes 9-13"
      title: "Le bonheur, l'amitié et l'art"
      parts:
        - id: b-bonheur
          label: "Textes 9, 12, 13"
          question: "Qu'est-ce que le bonheur, et que doit-il à l'ami ?"
          parts:
            - id: a12
              label: "Éthique à Nicomaque, I, 2-3"
              title: "Le bonheur et les théories courantes sur sa nature"
              summary: "Tous nomment bonheur le souverain bien, mais le placent ailleurs"
              points:
                - id: at12-1
                  sentence: "Sur le nom du souverain bien, presque tous s'accordent : c'est le bonheur, que l'on confond avec bien vivre et bien ___."
                  answer: "réussir"
                - id: at12-2
                  sentence: "La foule place le bonheur dans le ___, et choisit ainsi une vie digne des bêtes."
                  answer: "plaisir"
                - id: at12-3
                  sentence: "L'honneur est trop superficiel pour être le bien cherché : il dépend de ceux qui l'___ plus que de celui qui le reçoit."
                  answer: "accordent"
                  alt: ["rendent", "décernent"]
                - id: at12-4
                  sentence: "La vie de l'homme d'affaires est une vie contrainte, et la richesse n'est qu'un bien ___."
                  answer: "utile"
            - id: a13
              label: "Éthique à Nicomaque, X, 7"
              title: "Le bonheur consiste dans la contemplation"
              summary: "Le bonheur parfait est l'activité de l'intellect"
              rel: declinaison
              points:
                - id: at13-1
                  sentence: "Le bonheur est l'activité conforme à la vertu la plus haute, celle de la meilleure partie de nous : l'___."
                  answer: "intellect"
                  alt: ["intelligence", "nous"]
                - id: at13-2
                  sentence: "De toutes nos activités, c'est la plus ___ : on peut la poursuivre plus longtemps que toute action."
                  answer: "continue"
                - id: at13-3
                  sentence: "Le sage se suffit à lui-même plus que le juste, qui a besoin de gens envers qui exercer sa ___."
                  answer: "justice"
                - id: at13-4
