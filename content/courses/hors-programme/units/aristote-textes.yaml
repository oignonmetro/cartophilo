# Unité-œuvre (voir content/oeuvres.md), pour réviser les 18 textes
# d'Aristote d'un manuel de philosophie (Les auteurs et les textes, Antiquité
# et Moyen Âge, pp. 68-80) : associer chaque texte (œuvre, livre, chapitre) à
# son idée. Titres des textes : ceux du manuel ; références fournies par
# l'utilisatrice, les chapitres de l'Éthique à Nicomaque suivant la division de
# l'édition GF (traduction Bodéüs). Livres de la Métaphysique en capitales
# grecques (Α, Γ, Θ, Λ). Thèses alignées sur les extraits du manuel (J. Russ,
# C. Leguil, Philosophie. Les chemins de la pensée).

id: aristote-textes
title: "Aristote : textes clés"
subtitle: "18 textes, des Topiques à la Politique"
icon: map
color: sky
group: "Aristote"
intro: |-
  Les 18 textes d'Aristote du manuel, à associer à leur idée : où Aristote dit-il que la nature est un principe de mouvement, que l'ami est un miroir, que la tragédie épure la pitié et la frayeur ?

  Chaque texte est repéré par son œuvre, son livre et son chapitre. Au clavier, le titre peut s'abréger (« Métaph. », « Pol. ») ou se réduire à son sigle (« EN », « GM ») ; un livre de la *Métaphysique* se tape par sa lettre, son nom ou son numéro (« Θ », « theta », « IX »).
work:
  parts:
    - id: logique-nature-metaphysique
      label: "Textes 1-8"
      title: "Logique, nature et métaphysique"
      parts:
        - id: b-logique-nature
          label: "Textes 1, 2, 4, 5"
          parts:
            - id: a1
              label: "Topiques, I, 1"
              title: "Le syllogisme"
              summary: "Des prémisses posées, une conclusion suit nécessairement"
              points:
                - id: at1-1
                  sentence: "Le syllogisme est un discours où, certaines choses étant posées, une autre chose différente d'elles en résulte ___, par les choses mêmes qui sont posées."
                  answer: "nécessairement"
                - id: at1-2
                  sentence: "C'est une démonstration quand le syllogisme part de prémisses ___ et premières."
                  answer: "vraies"
                - id: at1-3
                  sentence: "Est dialectique le syllogisme qui conclut de prémisses ___ : les opinions reçues par tous, par la plupart ou par les sages."
                  answer: "probables"
                  alt: ["admises", "reçues"]
                - id: at1-4
                  sentence: "Est ___ le syllogisme qui part d'opinions qui paraissent probables sans l'être."
                  answer: "éristique"
                - id: at1-5
                  sentence: "Les principes de la science sont certains par eux-mêmes : on ne doit pas en rechercher le ___."
                  answer: "pourquoi"
            - id: a2
              label: "Physique, II, 1"
              title: "La nature est un principe de mouvement"
              summary: "Les êtres naturels ont en eux le principe de leur mouvement"
              rel: declinaison
              points:
                - id: at2-1
                  sentence: "Tout être naturel a en soi-même un principe de mouvement et de ___."
                  answer: "repos"
                - id: at2-2
                  sentence: "Un lit, un manteau, en tant que produits de l'___, n'ont en eux-mêmes aucune tendance naturelle à changer."
                  answer: "art"
                  alt: ["technique"]
                - id: at2-3
                  sentence: "La nature est un principe et une ___ de mouvement et de repos pour l'être où elle réside par essence, et non par accident."
