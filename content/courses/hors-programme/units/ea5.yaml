  - id: ea5-l8
    title: "La pertinence contemporaine de la téléologie kantienne"
    notes: |
      Les écrits de Kant sur la téléologie naturelle tiennent pour acquise
      la biologie de son temps, très différente de celle d'aujourd'hui :
      Kant suit __Blumenbach__ en supposant l'existence d'une matière
      vivante d'un genre distinctif, compréhensible seulement en termes
      téléologiques, alors qu'on ignorait encore tout de la sélection
      naturelle et des lois de l'hérédité.

      Il existe pourtant des raisons de penser que la biologie contemporaine
      reste elle aussi engagée envers une forme de téléologie, du fait du
      recours des biologistes à un langage __fonctionnel__ pour caractériser
      les parties et le comportement des organismes. Kant affronte ainsi un
      problème qui reste celui des philosophes de la biologie actuels :
      comment rendre compte de l'idée que les entités et les processus
      biologiques peuvent avoir des fins ou des fonctions sans présupposer
      l'existence d'un concepteur divin.

      Roth suggère que l'anti-réductionnisme kantien à l'égard des
      organismes — l'idée qu'ils ne peuvent être compris comme composés à
      partir de parties préexistantes — offre un modèle pour la biologie
      moléculaire contemporaine ; Zammito conteste au contraire vigoureusement
      la pertinence de la théorie kantienne pour le débat contemporain sur
      les fonctions biologiques.
    points:
      - id: ea5-l8-p1
        sentence: "Kant suit ___ en supposant l'existence d'une matière vivante d'un genre distinctif, compréhensible seulement en termes téléologiques."
        answer: "Blumenbach"
        alt: []
      - id: ea5-l8-p2
        sentence: "Une des raisons de penser que la biologie contemporaine reste elle aussi engagée envers une forme de téléologie tient au recours des biologistes à un langage ___ pour caractériser les parties et le comportement des organismes."
        answer: "fonctionnel"
        alt: []
      - id: ea5-l8-p3
