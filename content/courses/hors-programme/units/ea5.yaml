  - id: ea5-l6
    title: "La nature comme système de fins"
    notes: |
      Kant illustre, par l'exemple des rivières qui déposent un limon
      fertile utile à la croissance des plantes, une forme de finalité qui
      n'exige, pour comprendre l'origine de la chose elle-même, aucun appel
      à des __fins__ : l'origine des rivières s'explique mécaniquement. Les
      choses naturelles qui, comme les rivières pour les plantes,
      contribuent utilement à l'existence d'une autre chose possèdent ce que
      Kant nomme une finalité extérieure, ou __relative__ — à condition que
      la chose à l'existence de laquelle elles contribuent soit elle-même un
      être vivant, doté d'une finalité intérieure.

      Cette idée d'une finalité relative rend possible celle d'une **nature
      comme système de fins** : Kant affirme que le concept de fin naturelle
      « conduit nécessairement à l'idée de toute la nature comme un système
      selon la règle des fins », tout en formulant ailleurs ce même pas de
      façon plus prudente, comme un pas que nous __pouvons__ faire plutôt
      qu'un pas requis.

      Cette idée conduit à son tour à deux notions distinctes :
      - la **fin dernière** [`letzter Zweck`] de la nature : quelque chose
        à l'intérieur même de la nature en vue de quoi toutes les autres
        choses de la nature existeraient ;
      - la **fin finale** [`Endzweck`] de la nature : quelque chose en
        dehors de la nature en vue de quoi la nature dans son ensemble
        existerait.

      Bien que l'expérience ne permette d'identifier ni l'une ni l'autre,
      Kant soutient sur des bases a priori que la fin finale de la nature ne
      peut être que l'être humain considéré comme sujet __moral__ — ce qui
      revient à le concevoir comme **noumène** plutôt que comme simple
      partie de la nature. Kant nomme **culture** le développement, chez
      l'être humain, de la capacité à se fixer des fins et à se servir de la
      nature pour les réaliser (elle suppose l'acquisition d'aptitudes
      spécifiques, la « culture de l'habileté », et la capacité à choisir
      sans être déterminé par les penchants issus de notre nature animale,
      la « culture de la discipline »). La culture est la fin dernière de
      la nature parce qu'elle prépare l'être humain à ce qu'il doit faire
      pour être, lui, la fin finale de la nature.
    points:
      - id: ea5-l6-p1
        sentence: "Kant illustre par l'exemple des rivières, qui déposent un limon fertile utile à la croissance des plantes, une forme de finalité qui n'exige, pour comprendre l'origine de la chose elle-même, aucun appel à des ___ : l'origine des rivières s'explique mécaniquement."
        answer: "fins"
        alt: []
        explanation: "§63, Ak. 5:367."
      - id: ea5-l6-p2
        sentence: "Les choses naturelles qui, comme les rivières pour les plantes, contribuent utilement à l'existence d'une autre chose possèdent ce que Kant nomme une finalité extérieure, ou ___."
        answer: "relative"
        alt: []
      - id: ea5-l6-p3
        sentence: "Une chose naturelle ne compte comme finalisée en ce sens relatif qu'à la condition que la chose à l'existence de laquelle elle contribue soit elle-même un être vivant, doté d'une finalité ___."
        answer: "intérieure"
        alt: []
        explanation: "§82, Ak. 5:425."
      - id: ea5-l6-p4
        sentence: "Kant affirme que le concept de fin naturelle « conduit nécessairement à l'idée de toute la nature comme un système selon la règle des ___ »."
        answer: "fins"
        alt: []
        explanation: "§67, Ak. 5:379."
      - id: ea5-l6-p5
        sentence: "Kant formule pourtant ailleurs ce même pas, de l'idée de fin naturelle à celle de la nature entière comme système de fins, de façon plus prudente : comme un pas que nous ___ faire, non comme un pas requis."
        answer: "pouvons"
        alt: []
        explanation: "§67, Ak. 5:380."
      - id: ea5-l6-p6
        sentence: "Cette idée d'un ordre téléologique de la nature conduit à celle d'une fin ___ de la nature, quelque chose à l'intérieur même de la nature en vue de quoi toutes les autres choses de la nature existeraient."
        answer: "dernière"
        alt: []
