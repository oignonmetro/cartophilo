id: ea5
title: "La finalité naturelle"
subtitle: "La téléologie kantienne : de la notion de finalité à l'organisme, la nature comme système de fins, et la portée contemporaine"
icon: compass
color: violet
lessons:
  - id: ea5-l1
    title: "La notion de finalité"
    notes: |
      Kant définit, au paragraphe 10 de la Critique du jugement esthétique,
      les notions de **fin** [`Zweck`] et de **finalité** [`Zweckmässigkeit`].
      Une fin est l'objet d'un concept, pour autant que ce concept soit
      considéré comme la cause de cet objet ; la finalité est la causalité
      d'un concept à l'égard de son objet. Kant la caractérise aussi comme la
      « légalité du contingent en tant que tel ».

      Le paradigme d'une fin est l'artefact humain, dont le concept, chez
      l'artisan, est causalement efficace dans sa production. Mais Kant
      étend la notion : une chose est dite finalisée dès lors que sa
      possibilité ne peut être expliquée et conçue par nous qu'en supposant
      à son fondement une causalité conforme à des fins — sans exiger qu'un
      dessein réel l'ait effectivement produite. C'est ainsi que les
      organismes seront traités comme des fins __naturelles__ (voir la leçon
      suivante).

      La finalité se divise, selon un schéma simplifié, en finalité
      __subjective__ et finalité __objective__, chacune se subdivisant à son
      tour en finalité __formelle__ et finalité __matérielle__ :
      - la finalité subjective **formelle** correspond à la finalité
        esthétique des objets beaux et à la finalité « logique » de la
        nature dans son ensemble, en tant qu'elle est compréhensible pour
        l'être humain ;
      - la finalité objective **matérielle** correspond à la finalité des
        organismes comme fins naturelles, et à celle des arrangements de
        choses naturelles en relation de moyen à fin ;
      - Kant admet en outre une finalité subjective matérielle (l'agréable)
        et une finalité objective formelle (la fécondité des figures
        géométriques pour la résolution de problèmes) ;
      - au sein de la finalité objective matérielle, il distingue enfin la
        finalité __intérieure__, propre aux organismes, de la finalité
        simplement extérieure ou relative.

      ! Les commentateurs débattent de l'unité de cette notion : Guyer y
      voit deux sens distincts de « finalité », l'un impliquant un dessein
      (artefacts, organismes), l'autre non (objets esthétiques) ; Ginsborg
      défend au contraire une conception univoque, la finalité comme
      légalité normative.
    points:
      - id: ea5-l1-p1
        sentence: "Kant définit, au paragraphe 10, une fin comme l'objet d'un concept, pour autant que ce concept soit considéré comme la ___ de cet objet."
        answer: "cause"
        alt: []
        explanation: "§10, Ak. 5:220."
      - id: ea5-l1-p2
        sentence: "La finalité, notion complémentaire de la fin, est définie par Kant comme la causalité d'un concept à l'égard de son ___."
        answer: "objet"
        alt: []
      - id: ea5-l1-p3
        sentence: "Kant caractérise aussi la finalité comme la légalité du ___ en tant que tel."
        answer: "contingent"
        alt: []
      - id: ea5-l1-p4
        sentence: "Le paradigme d'une fin, selon la définition initiale de Kant, est l'artefact humain, parce qu'il résulte d'un concept, celui de l'artisan, qui est causalement ___ de sa production."
        answer: "efficace"
        alt: []
      - id: ea5-l1-p5
        sentence: "Kant étend cette définition : une chose est dite finalisée dès lors que sa possibilité ne peut être expliquée et conçue par nous qu'en supposant à son fondement une causalité conforme à des ___."
        answer: "fins"
        alt: []
        explanation: "§10, Ak. 5:220."
      - id: ea5-l1-p6
        sentence: "Kant réserve le nom de fins ___ aux organismes, dont il traite en détail dans l'Analytique du jugement téléologique."
        answer: "naturelles"
        alt: []
      - id: ea5-l1-p7
        sentence: "Kant distingue la finalité subjective de la finalité objective, chacune se subdivisant à son tour en finalité formelle et en finalité ___ (ou réelle)."
        answer: "matérielle"
        alt: []
      - id: ea5-l1-p8
        sentence: "La finalité subjective ___ correspond à la fois à la finalité esthétique des objets beaux et à la finalité « logique » de la nature dans son ensemble, en tant qu'elle est compréhensible pour l'être humain."
        answer: "formelle"
        alt: []
      - id: ea5-l1-p9
        sentence: "La finalité objective ___ correspond à la fois à la finalité des organismes en tant que fins naturelles et à celle des arrangements de choses ou de processus naturels qui se trouvent en relation de moyen à fin les uns avec les autres."
        answer: "matérielle"
        alt: []
      - id: ea5-l1-p10
        sentence: "Kant admet en outre une finalité subjective matérielle, celle de l'objet agréable qui plaît aux sens, et une finalité objective formelle, celle qu'exhibent les figures ___ en raison de leur fécondité pour résoudre des problèmes mathématiques."
        answer: "géométriques"
        alt: []
        explanation: "§62."
      - id: ea5-l1-p11
        sentence: "Au sein de la finalité objective matérielle, Kant distingue encore la finalité ___, propre aux organismes, de la finalité simplement extérieure ou relative, par laquelle une chose naturelle sert de moyen à une autre."
        answer: "intérieure"
        alt: []
      - id: ea5-l1-p12
        sentence: "___ soutient que Kant emploie en réalité deux sens distincts de « finalité » : l'un, appliqué aux artefacts et aux organismes, impliquant l'idée d'un dessein ; l'autre, appliqué aux objets esthétiques, n'impliquant aucun dessein réel ou apparent, mais seulement la satisfaction d'un objectif."
        answer: "Guyer"
        alt: []
        explanation: "Guyer 1979."
      - id: ea5-l1-p13
        sentence: "À l'inverse, ___ défend une conception univoque de la finalité, comprise comme légalité normative, en s'appuyant sur la caractérisation kantienne de la finalité comme légalité du contingent."
        answer: "Ginsborg"
        alt: []
        explanation: "Ginsborg 1997b."

  - id: ea5-l2
    title: "La finalité de la nature pour nos facultés cognitives"
    notes: |
      Kant affirme dans les introductions de la Critique du jugement qu'il
      existe un principe a priori de la faculté de juger réfléchissante
      selon lequel la nature est finalisée pour nos facultés __cognitives__.
      Ce principe est, dans le vocabulaire de la Critique de la raison pure,
      __régulateur__ plutôt que constitutif : nous ne pouvons affirmer que la
      nature est objectivement finalisée pour nos facultés, mais seulement
      que nous devons le supposer pour exercer la faculté de juger
      réfléchissante.

      Cette hypothèse ne relève pas, à proprement parler, de la téléologie,
      puisque les jugements téléologiques ne portent que sur la finalité
      __objective__ ; elle n'en demeure pas moins la condition de notre
      droit à attribuer une telle finalité aux organismes. Kant relie ce
      principe à plusieurs tâches de la faculté de juger réfléchissante :
      classer les êtres naturels en genres et en espèces, construire des
      théories scientifiques explicatives, se représenter la nature comme
      légale d'un point de vue empirique, et former tous les concepts
      empiriques.

      La portée exacte de ce principe est vivement débattue :
      - Buchdahl soutient que le principe de causalité de la première
        Critique ne suffit pas à rendre compte de la soumission de la
        nature à des lois causales particulières, et qu'un principe
        supplémentaire de systématicité est nécessaire.
      - Guyer, suivant McFarland, minimise au contraire sa portée cognitive,
        n'y voyant qu'une source de motivation rationnelle.
      - Friedman propose une approche « descendante » de la systématicité,
        où des lois empiriques peuvent être justifiées a priori — à l'image
        de la justification kantienne de la loi de gravitation de Newton.
      - Floyd et Allison y voient la réponse de Kant au problème de
        l'induction posé par Hume ; Ginsborg va plus loin en l'étendant à
        toute conceptualisation et à tout jugement empiriques ; Abela
        soutient une thèse plus forte encore, en faisant une condition de la
        vérité empirique elle-même.
      - Geiger soutient enfin que c'est dans la Critique du jugement
        téléologique, et non dans les introductions ni dans la première
        Critique, que Kant offre l'argument le plus abouti de ce principe.
    points:
      - id: ea5-l2-p1
        sentence: "Kant affirme dans les introductions de la Critique du jugement qu'il existe un principe a priori de la faculté de juger réfléchissante selon lequel la nature est finalisée pour nos facultés ___."
        answer: "cognitives"
        alt: []
      - id: ea5-l2-p2
        sentence: "Ce principe de la finalité de la nature pour nos facultés cognitives est, dans le vocabulaire de la Critique de la raison pure, ___ plutôt que constitutif : nous ne pouvons affirmer que la nature est objectivement finalisée pour nos facultés, mais seulement que nous devons le supposer pour exercer la faculté de juger réfléchissante."
        answer: "régulateur"
        alt: []
      - id: ea5-l2-p3
        sentence: "Cette hypothèse de la finalité subjective de la nature ne relève pas, à proprement parler, de la téléologie, puisque les jugements téléologiques ne portent que sur la finalité ___ ; elle n'en demeure pas moins la condition de notre droit à attribuer une telle finalité aux organismes."
        answer: "objective"
        alt: []
      - id: ea5-l2-p4
        sentence: "Kant relie ce principe de la finalité de la nature à plusieurs tâches de la faculté de juger réfléchissante : classer les êtres naturels en une hiérarchie de genres et d'espèces, construire des théories scientifiques explicatives, se représenter la nature comme légale d'un point de vue empirique, et former tous les concepts ___."
        answer: "empiriques"
        alt: []
      - id: ea5-l2-p5
        sentence: "___ soutient que le principe de causalité établi dans l'Analytique de la Critique de la raison pure ne suffit pas à rendre compte de la soumission de la nature à des lois causales particulières, et qu'un principe supplémentaire de systématicité est nécessaire pour cela."
        answer: "Buchdahl"
        alt: []
        explanation: "Buchdahl 1969a, 1969b."
      - id: ea5-l2-p6
        sentence: "À l'inverse, ___, suivant McFarland, minimise la portée cognitive de ce principe, n'y voyant qu'une source de motivation rationnelle pour tenter de systématiser la nature, sans plus."
        answer: "Guyer"
        alt: []
        explanation: "Guyer 1990b."
      - id: ea5-l2-p7
        sentence: "___ propose une approche distincte, dite « descendante », de la systématicité de la nature, selon laquelle des lois empiriques comme celles de la chimie peuvent être justifiées a priori — à l'image de la justification kantienne de la loi de gravitation universelle de Newton dans les Premiers principes métaphysiques de la science de la nature."
        answer: "Friedman"
        alt: []
        explanation: "Friedman 1992a, 1992b."
      - id: ea5-l2-p8
        sentence: "Floyd et Allison soutiennent que ce principe constitue la réponse de Kant au problème de l'___ posé par Hume."
        answer: "induction"
        alt: []
        explanation: "Allison 2001, ch. 1."
      - id: ea5-l2-p9
        sentence: "___ va plus loin que Floyd et Allison en tenant ce principe pour une condition, non seulement de l'inférence inductive, mais de toute conceptualisation et de tout jugement empiriques."
        answer: "Ginsborg"
        alt: []
        explanation: "Ginsborg 1990a, ch. 4 ; 1990b."
      - id: ea5-l2-p10
        sentence: "___ défend une thèse plus forte encore, selon laquelle ce principe serait requis comme condition de la vérité empirique elle-même, elle-même requise pour la possibilité de toute représentation dirigée vers un objet."
        answer: "Abela"
        alt: []
        explanation: "Abela 2006."
      - id: ea5-l2-p11
        sentence: "___ soutient que, bien que ce principe soit requis pour toute connaissance empirique, c'est dans la Critique du jugement téléologique, et non dans les introductions de l'ouvrage ni dans la Critique de la raison pure, que Kant en offre l'argument le plus abouti."
        answer: "Geiger"
        alt: []
        explanation: "Geiger 2009."

  - id: ea5-l3
    title: "Les organismes comme fins naturelles"
    notes: |
      Aux paragraphes 64-65 de l'Analytique du jugement téléologique, Kant
      introduit la notion de fin naturelle [`Naturzweck`] : les êtres
      organisés — plantes et animaux — sont, selon lui, les seuls êtres de
      la nature à instancier ce concept, même s'il hésite parfois entre dire
      qu'ils SONT des fins naturelles et dire qu'ils doivent seulement être
      __considérés__ comme telles.

      Ce qui fait qu'un organisme se qualifie comme fin naturelle, c'est
      qu'il est, selon la formule de Kant, à la fois **cause et effet de
      lui-même**. Il l'illustre par l'exemple de l'arbre, sous trois
      aspects :
      - en produisant une descendance qui lui ressemble, l'arbre se produit
        lui-même quant à son __espèce__ ;
      - il se conserve lui-même comme individu en convertissant sa
        nourriture en la substance organique qui le constitue ;
      - surtout, ses parties se maintiennent mutuellement en existence : les
        feuilles, produites par l'arbre entier, sont à leur tour nécessaires
        à la croissance du tronc et des __racines__.

      Le paragraphe 65 pose ensuite deux conditions :
      - la première, valable pour toute fin (donc aussi pour un artefact
        comme une montre) : que les parties d'une chose ne soient possibles
        que par leur relation au __tout__ ;
      - la seconde, propre aux seules fins naturelles : que les parties
        soient réciproquement cause et effet de leur __forme__ — une
        condition que ne remplit pas la montre, dont les parties ne se
        produisent ni ne s'entretiennent mutuellement.

      Kant marque ainsi à la fois une analogie et une différence entre
      organisme et artefact : comme pour un artefact, comprendre un
      organisme suppose de faire appel à des notions téléologiques (le cœur
      est là pour pomper le sang) ; mais à la différence de l'artefact,
      l'organisme n'est produit ni entretenu par une cause extérieure, et
      possède un caractère auto-producteur et auto-entretenu (reproduction,
      auto-nutrition, dépendance réciproque des parties, réparation).
    points:
      - id: ea5-l3-p1
        sentence: "Aux paragraphes 64-65 de l'Analytique du jugement téléologique, Kant introduit la notion de fin naturelle, qu'il nomme en allemand ___."
        answer: "Naturzweck"
        alt: []
      - id: ea5-l3-p2
        sentence: "Kant soutient que les êtres organisés — plantes et animaux — sont les seuls êtres de la nature à instancier le concept de fin naturelle, quand bien même il hésite parfois entre dire qu'ils sont des fins naturelles et dire qu'ils doivent seulement être ___ comme telles."
        answer: "considérés"
        alt: []
        explanation: "§65, Ak. 5:376."
      - id: ea5-l3-p3
        sentence: "Ce qui fait qu'un organisme se qualifie comme fin naturelle, c'est qu'il est, selon la formule de Kant, à la fois cause et ___ de lui-même."
        answer: "effet"
        alt: []
        explanation: "§64, Ak. 5:371."
      - id: ea5-l3-p4
        sentence: "Kant illustre l'idée d'un organisme cause et effet de lui-même par l'exemple de l'arbre : en produisant une descendance qui lui ressemble, l'arbre se produit lui-même quant à son ___."
        answer: "espèce"
        alt: []
      - id: ea5-l3-p5
        sentence: "L'arbre se conserve aussi lui-même comme individu en prélevant une nourriture extérieure qu'il convertit en la substance organique qui le constitue ___."
        answer: "lui-même"
        alt: []
      - id: ea5-l3-p6
        sentence: "Le trait le plus important, selon Kant, tient à ce que les différentes parties de l'arbre se maintiennent mutuellement en existence : les feuilles, produites par l'arbre entier, sont à leur tour nécessaires à la croissance et à l'entretien des autres parties, comme le tronc et les ___."
        answer: "racines"
        alt: []
      - id: ea5-l3-p7
        sentence: "Le paragraphe 65 pose une première condition, valable pour toute fin et pas seulement pour les fins naturelles : que les parties d'une chose ne soient possibles que par leur relation au ___ — une condition que remplit aussi bien un organisme qu'un artefact comme une montre."
        answer: "tout"
        alt: []
        explanation: "§65, Ak. 5:373."
      - id: ea5-l3-p8
        sentence: "La seconde condition, propre aux seules fins naturelles, exige que les parties de la chose soient réciproquement cause et ___ de leur forme — une condition que ne remplit pas la montre, dont les parties ne se produisent ni ne s'entretiennent mutuellement."
        answer: "effet"
        alt: []
      - id: ea5-l3-p9
        sentence: "Comme pour un artefact, nous ne comprenons un organisme qu'en faisant appel à des notions téléologiques : nous comprenons ainsi que le cœur est là afin de pomper le ___ dans tout le corps."
        answer: "sang"
        alt: []
      - id: ea5-l3-p10
        sentence: "Mais à la différence des artefacts, les organismes ne sont pas produits ni entretenus par une cause extérieure : ils possèdent un caractère auto-producteur et auto-entretenu, manifesté par la reproduction, l'auto-nutrition, la dépendance réciproque des parties et la capacité de ___."
        answer: "réparation"
        alt: []

  - id: ea5-l4
    title: "Le débat sur la cohérence de la fin naturelle"
    notes: |
      La cohérence même de la notion de fin naturelle pose une difficulté
      directe : comment peut-on regarder un seul et même objet à la fois
      comme une fin, donc comme produit d'un dessein conscient, et comme
      naturel, donc comme n'étant pas, en apparence, produit d'un tel
      __dessein__ ?

      Plusieurs solutions s'opposent :
      - Ginsborg tente de résoudre le problème en faisant appel à une
        conception de la finalité comme normativité : les organismes
        pourraient être soumis à des normes sans qu'on suppose qu'ils aient
        été conçus pour s'y conformer.
      - Kreines partage l'idée que la notion de fin comporte un contenu
        normatif, mais nie que les organismes soient, chez Kant, réellement
        des fins.
      - Beisbart soutient au contraire que l'appel à la normativité est
        superflu, puisqu'il suffit de concevoir un objet naturel comme
        semblable à un artefact en concevant ses parties comme
        réciproquement produites les unes par les autres et par le tout.
      - Gambarotto va plus loin en niant que la notion kantienne de fin
        naturelle soit cohérente : Kant défendrait une position instable,
        faute d'avoir su libérer la téléologie de l'idée d'intention.
      - Breitenbach propose que l'attribution de finalité aux organismes
        consiste à regarder les processus naturels organiques comme
        analogues à une activité intentionnelle.

      La conception kantienne de l'organisme se dissocie par ailleurs
      curieusement de celle du vivant : Kant réserve la « vie » aux seuls
      êtres dotés de __désirs__, ce qui semble exclure les plantes des êtres
      vivants proprement dits — une difficulté à laquelle Nunez répond en
      suggérant que les plantes ont, en un sens, des désirs, bien qu'elles
      n'en aient pas conscience.

      Enfin, Guyer met en évidence la menace que les organismes semblent
      faire peser sur l'unité de la conception kantienne de la science de la
      nature ; Breitenbach soutient au contraire que cette menace est
      illusoire, puisque les lois qui unifient la nature incluent elles-mêmes
      des principes téléologiques.
    points:
      - id: ea5-l4-p1
        sentence: "La cohérence même de la notion de fin naturelle pose une difficulté directe : comment peut-on regarder un seul et même objet à la fois comme une fin, donc comme produit d'un dessein conscient, et comme naturel, donc comme n'étant pas, en apparence, produit d'un tel ___ ?"
        answer: "dessein"
        alt: []
      - id: ea5-l4-p2
        sentence: "___ tente de résoudre ce problème de la cohérence de la fin naturelle en faisant appel à une conception de la finalité comme normativité : les organismes pourraient être soumis à des normes sans qu'on suppose qu'ils aient été conçus pour s'y conformer."
        answer: "Ginsborg"
        alt: []
        explanation: "Ginsborg 2001."
      - id: ea5-l4-p3
        sentence: "___ partage l'idée que la notion de fin comporte un contenu normatif, mais nie que les organismes soient, chez Kant, réellement des fins."
        answer: "Kreines"
        alt: []
        explanation: "Kreines 2005."
      - id: ea5-l4-p4
        sentence: "___ soutient au contraire que l'appel à la normativité est superflu pour comprendre les organismes comme fins naturelles, puisqu'il suffit de concevoir un objet naturel comme semblable à un artefact en concevant ses parties comme réciproquement produites les unes par les autres et par le tout."
        answer: "Beisbart"
        alt: []
        explanation: "Beisbart 2009."
      - id: ea5-l4-p5
        sentence: "___ résout la difficulté de façon plus radicale en niant que la notion kantienne de fin naturelle soit cohérente : Kant défendrait une position instable, faute d'avoir su libérer la téléologie de l'idée d'intention."
        answer: "Gambarotto"
        alt: []
        explanation: "Gambarotto 2018."
      - id: ea5-l4-p6
        sentence: "___ propose que l'attribution de finalité aux organismes consiste à regarder les processus naturels organiques comme analogues à une activité intentionnelle."
        answer: "Breitenbach"
        alt: []
        explanation: "Breitenbach 2014."
      - id: ea5-l4-p7
        sentence: "La conception kantienne de l'organisme se dissocie curieusement de celle du vivant : Kant réserve la « vie » aux seuls êtres dotés de ___, ce qui semble exclure les plantes des êtres vivants proprement dits."
        answer: "désirs"
        alt: []
      - id: ea5-l4-p8
        sentence: "Nunez répond à la difficulté d'exclure les plantes des êtres vivants en suggérant qu'elles ont, en un sens, des désirs, bien qu'elles n'en aient pas ___."
        answer: "conscience"
        alt: []
        explanation: "Nunez 2021."
      - id: ea5-l4-p9
        sentence: "___ met en évidence la menace que les organismes semblent faire peser sur l'unité de la conception kantienne de la science de la nature."
        answer: "Guyer"
        alt: []
        explanation: "Guyer 2001a."
      - id: ea5-l4-p10
        sentence: "___ soutient au contraire que cette menace est illusoire, puisque les lois qui unifient la nature incluent elles-mêmes des principes téléologiques."
        answer: "Breitenbach"
        alt: []
        explanation: "Breitenbach 2017."

  - id: ea5-l5
    title: "Mécanisme et téléologie"
    notes: |
      Les mêmes considérations qui conduisent Kant, dans l'Analytique, à
      soutenir que les organismes doivent être regardés comme des fins, le
      conduisent, dans la Dialectique, à soutenir que leur production ne
      peut être expliquée mécaniquement. Kant juge ainsi absurde d'espérer
      qu'apparaisse un jour un Newton qui rendrait concevable la production
      d'un simple brin d'__herbe__ selon des lois naturelles qu'aucune
      intention n'aurait ordonnées.

      Ce conflit entre l'exigence d'expliquer mécaniquement tout ce qui
      existe dans la nature et la nécessité de faire appel à la téléologie
      pour comprendre certains objets, comme les organismes, porte le nom
      d'**antinomie du jugement**. Kant la résout, du moins en partie, en
      soutenant que les deux principes en conflit sont simplement
      __régulateurs__ plutôt que constitutifs.

      Au paragraphe 77, Kant distingue l'entendement humain, qu'il qualifie
      de __discursif__, d'un entendement contrastant, qualifié d'intuitif,
      qu'il n'attribue pas explicitement à Dieu mais qui pourrait l'être. Un
      entendement discursif ne peut concevoir comment un organisme pourrait
      naître autrement que par une causalité téléologique ; cela ne signifie
      pas pour autant que cela soit impossible pour un entendement intuitif.

      Reste la question pratique : comment concilier les deux principes dans
      la recherche scientifique ? Kant répond qu'il faut __subordonner__ le
      mécanisme à la téléologie : chercher l'explication mécanique aussi
      loin que possible, tout en reconnaissant la nécessité d'un recours
      ultime aux fins. Il applique cette idée aux controverses biologiques de
      son temps : sur l'origine des organismes particuliers, il défend
      l'**épigenèse** (l'apparition d'un nouvel être vivant est un véritable
      processus, non le simple déploiement d'un être préexistant en
      miniature), tout en refusant qu'un être vivant puisse naître d'une
      matière non vivante — la matière de l'embryon doit déjà être
      téléologiquement organisée. Sur l'origine des espèces, il admet le
      développement d'espèces supérieures à partir d'espèces inférieures,
      mais refuse que ces dernières se développent à partir d'une matière
      inorganisée.

      ! Que veut dire Kant par « mécanisme » ? Contre une lecture qui
      l'identifierait à la seule causalité temporelle de la première
      Critique, McLaughlin et Allison soutiennent qu'il désigne un type de
      causalité plus spécifique, celle par laquelle les parties d'une chose
      déterminent le tout ; Ginsborg propose une troisième lecture, centrée
      sur les pouvoirs intrinsèques de la matière. Contre l'idée répandue que
      les organismes résistent au mécanisme en raison de leur caractère
      auto-entretenu, Ginsborg objecte que ce contraste vise plutôt à montrer
      que les organismes, en tant qu'objets naturels, ne doivent pas être
      expliqués par les intentions d'un concepteur.
