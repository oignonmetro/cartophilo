      - id: ea5-l6-p8
        sentence: "Bien que l'expérience ne permette d'identifier ni la fin dernière ni la fin finale de la nature, Kant soutient sur des bases a priori que la fin finale de la nature ne peut être que l'être humain considéré comme sujet ___."
        answer: "moral"
        alt: []
