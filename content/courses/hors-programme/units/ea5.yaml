  - id: ea5-l7
    title: "Téléologie, moralité et religion"
    notes: |
      Kant s'oppose, dans la Critique du jugement téléologique, à la
      **physicothéologie**, c'est-à-dire à la tentative de prouver
      l'existence de Dieu par la téléologie naturelle. L'appel à la
      téléologie naturelle peut justifier de supposer une cause
      __intelligente__ de la nature, mais non de lui attribuer la sagesse,
      et encore moins d'être infinie en tout point.

      Pour attribuer à cette cause les autres attributs associés à l'idée
      traditionnelle de Dieu — omniscience, toute-puissance, sagesse —, il
      faut faire appel non à la téléologie naturelle mais à la téléologie
      __morale__, en particulier à l'idée de l'être humain comme fin finale
      de la nature. Nous devons alors supposer l'existence d'un être doté
      de ces attributs si nous voulons nous-mêmes adopter la fin qu'exige la
      loi morale, fin que Kant nomme le **souverain bien**.

      Bien qu'elle ne puisse prouver l'existence de Dieu, la téléologie
      naturelle joue un rôle positif : elle nous « pousse à chercher une
      théologie », servant ainsi de propédeutique à la théologie. Guyer
      souligne particulièrement ce rôle positif, tenant la Critique du
      jugement téléologique pour porteuse d'un argument important allant de
      la téléologie naturelle à la moralité ; Kain propose une connexion
      différente, en interprétant les théories biologiques de Kant comme un
      soutien à l'idée que tous les membres de l'espèce humaine, y compris
      les nourrissons et les personnes lourdement handicapées, possèdent un
      statut moral.
    points:
      - id: ea5-l7-p1
        sentence: "Kant s'oppose, dans la Critique du jugement téléologique, à la ___, c'est-à-dire à la tentative de prouver l'existence de Dieu par la téléologie naturelle."
        answer: "physicothéologie"
        alt: []
        explanation: "§85, Ak. 5:441."
      - id: ea5-l7-p2
