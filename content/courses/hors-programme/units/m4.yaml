id: m4
title: Unité des formules et autonomie
subtitle: L'unité des formules de l'impératif catégorique et l'idée d'autonomie
icon: infinity
color: yellow
group: "Kant : la morale"

lessons:
  - id: m4-l1
    title: Les formules sont-elles équivalentes ?
    notes: |
      Kant affirme que les formulations de l'impératif catégorique sont
      __équivalentes__, chacune {teal}« {/teal}unissant en elle {teal}les deux autres »{/teal}, sans
      jamais préciser en quel sens exact il faut entendre cette équivalence.
      {amber}**Trois lectures**{/amber} se dégagent chez ses commentateurs.

      - Les formules seraient équivalentes __en signification__ : on pourrait
        dériver {violet}**analytiquement**{/violet} l'une de l'autre. Certains soutiennent ainsi
        que l'exigence de toujours traiter l'humanité comme fin en soi
        entraîne celle de n'agir que sur des maximes universalisables sans
        contradiction, et réciproquement.
      - À défaut d'être équivalentes en signification, elles pourraient être
        __logiquement interdérivables__ les unes des autres, sans pour
        autant que la formule de la loi universelle se réduise, comme
        certains l'ont suggéré, au seul principe de non-contradiction, {red}ce qui{/red}
        {red}ferait de l'impératif catégorique une **vérité logique**, chose que Kant{/red}
        {red}récuse expressément{/red}.
      - La lecture la plus directe, défendue par {sky}Allison{/sky}, tient qu'appliquer
        chaque formule engendrerait {coral}__tous les mêmes devoirs, et seulement{/coral}
        {coral}ceux-là__{/coral} : respecter l'humanité comme fin en soi ne pourrait jamais
        conduire à agir sur une maxime qui se contredirait en devenant
        universelle, et réciproquement.

      ! Ce que Kant appelle des différences {teal}« {/teal}plus subjectivement
        qu'{teal}objectivement pratiques »{/teal} entre les formules désigne, sur cette
        troisième lecture, des différences de __sens__ compatibles avec une
        absence totale de différence __pratique__ dans les devoirs engendrés.
    points:
      - id: m4-l1-p1
        sentence: "Kant affirme que **les formulations de l'impératif catégorique sont équivalentes**, __chacune « unissant en elle les__ ___ autres »."
        answer: deux
      - id: m4-l1-p2
        sentence: "**La première des trois lectures** de l'équivalence des formules de l'impératif catégorique __tient qu'on pourrait dériver__ ___ l'une de l'autre, comme l'exigence de traiter l'humanité comme fin en soi et celle de n'agir que sur des maximes universalisables sans contradiction."
        answer: analytiquement
      - id: m4-l1-p3
        sentence: "**La deuxième des trois lectures** de l'équivalence des formules de l'impératif catégorique __tient les formules pour logiquement__ ___ les unes des autres, sans pour autant les réduire au seul principe de non-contradiction : ce qui ferait de l'impératif catégorique une simple vérité logique, chose que Kant récuse."
        answer: interdérivables
      - id: m4-l1-p4
        sentence: "**La lecture la plus directe** de l'équivalence des formules, défendue par le commentateur ___, __tient qu'appliquer chacune d'elles engendrerait tous les mêmes devoirs, et seulement ceux-là__."
        answer: Allison
      - id: m4-l1-p5
        sentence: Sur la lecture d'Allison, **respecter l'humanité comme fin en soi** __ne pourrait jamais conduire à agir sur une maxime qui se contredirait en devenant__ ___, et réciproquement.
        answer: universelle
      - id: m4-l1-p6
        sentence: "Ce que Kant appelle des différences « **plus subjectivement qu'objectivement pratiques** » entre les formules désigne, sur la lecture d'Allison, __des différences de sens compatibles avec une absence totale de différence__ ___ dans les devoirs engendrés."
        answer: pratique

  - id: m4-l2
    title: La tentative de dérivation depuis la valeur absolue de l'humanité
    notes: |
      Dans sa discussion de la formule de l'humanité, Kant écrit que seule une
      chose {teal}« {/teal}dont l'existence en soi aurait une {teal}valeur absolue »{/teal} pourrait
      fonder une loi qui oblige catégoriquement, avant d'affirmer, comme un
      __postulat__ qu'il promet de justifier au dernier chapitre des
      {sky}*Fondements*{/sky}, que l'humanité est précisément cette chose {violet}**absolument{/violet}
      {violet}précieuse**{/violet}.

      On peut y lire une tentative de dériver la formule de la loi universelle
      __à partir__ de la formule de l'humanité : {coral}si quelque chose a une valeur{/coral}
      {coral}absolue, alors on ne doit agir que sur des maximes universalisables{/coral} ; or
      l'humanité a une valeur absolue ; donc on ne doit agir que sur des
      maximes universalisables.

      ! Cette dérivation exige cependant d'admettre une prémisse
        {violet}**synthétique**{/violet} substantielle (que l'humanité a bien une valeur
        absolue), {red}ce qui contredit l'insistance de Kant{/red} selon laquelle
        l'argumentation du second chapitre des {sky}*Fondements*{/sky} serait purement
        {violet}**analytique**{/violet} et se bornerait à établir le contenu de la loi morale.
    points:
      - id: m4-l2-p1
        sentence: "Dans sa discussion de la formule de l'humanité, __Kant écrit que seule une chose dont l'existence en soi aurait une valeur__ ___ pourrait fonder une **loi qui oblige catégoriquement**."
        answer: absolue
        explanation: "G 4:428."
      - id: m4-l2-p2
        sentence: Kant affirme que **l'humanité a une valeur absolue** non pas comme une conclusion démontrée, __mais comme un__ ___ qu'il promet de justifier au dernier chapitre des Fondements.
        answer: postulat
        explanation: "G 4:429, note."
      - id: m4-l2-p3
        sentence: La **dérivation qui va de la valeur absolue de l'humanité à la formule de la loi universelle** __exige d'admettre une prémisse__ ___ substantielle, à savoir que l'humanité a bien une valeur absolue.
        answer: synthétique
      - id: m4-l2-p4
        sentence: Admettre que **l'humanité a une valeur absolue**, prémisse synthétique qu'exige la dérivation de la formule de la loi universelle depuis celle de l'humanité, __contredit l'insistance de Kant selon laquelle l'argumentation du second chapitre des Fondements serait purement__ ___ et se bornerait à établir le contenu de la loi morale.
        answer: analytique

  - id: m4-l3
    title: L'autonomie, idée centrale, et l'analogie avec la liberté politique
    notes: |
      L'idée d'{violet}**autonomie**{/violet} est au cœur de la théorie morale de Kant :
      comprendre l'autonomie est, selon lui, la clef pour comprendre et
      justifier l'{violet}**autorité**{/violet} qu'ont sur nous les exigences morales. Comme chez
      {sky}Rousseau{/sky}, dont les vues l'ont influencé, la liberté ne consiste pas à
      n'être lié par __aucune__ loi, mais par des lois qui sont, en un sens,
      {green}de notre propre fabrication{/green}.

      {sky}Reath{/sky} propose de saisir cette idée par analogie avec la liberté
      politique. {yellow}Un État est libre lorsque ses citoyens ne sont liés que par{/yellow}
      {yellow}des lois de leur propre fabrication, votées ou adoptées par des{/yellow}
      {yellow}représentants élus{/yellow} : l'autorité de ces lois est alors {violet}**interne**{/violet} aux
      citoyens, non externe. À l'inverse, {yellow}un État soumis aux lois d'un autre{/yellow}
      {yellow}État, comme lors d'une occupation{/yellow}, {red}__manque d'autonomie__{/red}, et ces lois
      n'ont sur lui aucune autorité légitime.

      De même, une personne est libre lorsqu'elle n'est liée que par sa propre
      volonté et non par celle d'une autre. L'autorité des principes qui la
      lient vient alors de ce qu'elle les a elle-même {violet}**voulus**{/violet}. Selon Kant,
      **la loi morale** est précisément un tel principe : {green}sa légitimité tient à ce{/green}
      {green}qu'elle exprime la volonté rationnelle propre de l'agent qu'elle oblige{/green}.
    points:
      - id: m4-l3-p1
        sentence: Comprendre l'**idée d'autonomie** est, selon Kant, __la clef pour comprendre et justifier l'autorité qu'ont sur nous les exigences__ ___.
        answer: morales
      - id: m4-l3-p2
        sentence: Comme chez Rousseau, dont les vues l'ont influencé, la liberté ne consiste pas, pour Kant, à **n'être lié par aucune loi**, __mais par des lois qui sont, en un sens,__ ___.
        answer: de notre propre fabrication
      - id: m4-l3-p3
        sentence: Reath propose de saisir l'idée d'autonomie par analogie avec la **liberté politique**, __un État étant libre quand ses citoyens ne sont liés que par des lois votées ou adoptées par des représentants__ ___.
        answer: élus
      - id: m4-l3-p4
        sentence: "**Un État soumis aux lois d'un autre État**, comme lors d'une occupation ou d'une colonisation, __manque, dans cette analogie,__ d'___, et ces lois n'ont sur lui aucune autorité légitime."
        answer: autonomie
      - id: m4-l3-p5
        sentence: Une personne est autonome lorsqu'elle **n'est liée que par sa propre volonté** ; __l'autorité des principes qui la lient vient alors de ce qu'elle les a elle-même__ ___.
        answer: voulus
      - id: m4-l3-p6
        sentence: Selon Kant, __**la légitimité de la loi morale** tient à ce qu'elle exprime la volonté rationnelle propre de l'agent qu'elle__ ___.
        answer: oblige

  - id: m4-l4
    title: "La liberté négative et l'agir « sous l'idée » de la liberté"
    notes: |
      L'idée d'une volonté autonome naît, chez Kant, de celle d'une volonté
      libre __en un sens négatif__ : une volonté qui n'opère pas sous
      l'influence de facteurs extérieurs à son propre exercice de la raison.
      Une volonté déterminée par des lois naturelles (biologiques ou
      psychologiques) ne peut, à ce titre, être pensée comme opérant par sa
      capacité de raisonner : {coral}la détermination par des lois naturelles est{/coral}
      {coral}donc __incompatible__ avec la liberté au sens négatif{/coral}.

      Un moment décisif de l'argument kantien est l'idée qu'une volonté
      rationnelle ne peut agir {violet}**que sous l'idée**{/violet} de sa propre liberté {sky}(G{/sky}
      {sky}4:448){/sky}. Cette expression ne signifie pas qu'une volonté rationnelle
      doive {amber}**croire**{/amber} qu'elle est libre : déterministes et libertariens
      agissent, selon Kant, tout autant les uns que les autres sous l'idée de
      la liberté.

      - Kant lui-même soutient, dans la {sky}Critique de la raison pure{/sky}, que nous
        {red}n'avons aucune base rationnelle pour croire nos volontés libres{/red}, ce
        qui exigerait de connaître nos volontés comme {violet}**choses en soi**{/violet}.
      - L'analogie proposée pour comprendre cette idée est celle de l'agir
        « sous l'idée » d'une finalité dans la nature : {yellow}un biologiste qui{/yellow}
        {yellow}cherche la fonction d'un organe n'a besoin, pour cela, ni de croire{/yellow}
        {yellow}que cet organe fut conçu par un créateur, ni d'éprouver un{/yellow}
        {yellow}quelconque **sentiment de finalité**{/yellow}.

      Une volonté qui ne peut s'exercer que sous l'idée de sa liberté est,
      dit Kant, libre {violet}__d'un point de vue pratique__{/violet} ({blue}*im practischer{/blue}
      {blue}Absicht*{/blue}) : cela signifie que la délibération pratique nous autorise à
      nous tenir aux mêmes principes que ceux auxquels serait tenue une
      volonté autonome et véritablement libre.
    points:
      - id: m4-l4-p1
        sentence: Une volonté déterminée par des lois naturelles biologiques ou psychologiques **ne peut être pensée comme opérant par sa capacité de raisonner** ; __la détermination par des lois naturelles est donc__ ___ avec la liberté au sens négatif.
        answer: incompatible
      - id: m4-l4-p2
        sentence: Selon Kant, une **volonté rationnelle** __ne peut agir que sous l'idée de sa propre__ ___.
        answer: liberté
        explanation: "G 4:448."
      - id: m4-l4-p3
        sentence: Agir sous l'idée de sa liberté **ne signifie pas qu'une volonté rationnelle doive croire qu'elle est libre** ; __déterministes et libertariens agissent, selon Kant, tout autant__ ___ sous cette idée.
        answer: les uns que les autres
      - id: m4-l4-p4
        sentence: Kant soutient, dans la Critique de la raison pure, que nous n'avons **aucune base rationnelle pour croire nos volontés libres**, __ce qui exigerait de les connaître comme des__ ___.
        answer: choses en soi
      - id: m4-l4-p5
        sentence: "**L'analogie proposée pour comprendre l'idée d'agir sous l'idée de la liberté** est celle du biologiste qui cherche la fonction d'un organe __sans croire pour autant que celui-ci fut conçu par un__ ___."
        answer: créateur
      - id: m4-l4-p6
        sentence: Une volonté qui **ne peut s'exercer que sous l'idée de sa liberté** __est dite par Kant libre d'un point de vue__ ___, ce qui l'autorise à se tenir aux principes d'une volonté autonome.
        answer: pratique
        explanation: "Im practischer Absicht."
      - id: m4-l4-p7
        sentence: __Kant nomme, en allemand, ce **point de vue pratique** d'où une volonté peut être dite libre bien qu'elle n'en ait aucune preuve théorique__ ___.
        answer: im practischer Absicht
      - id: m4-l4-p8
        sentence: "__Rappelons l'énoncé exact de Kant sur ce point__ : « **Une volonté rationnelle ne peut** ___ que sous l'idée de sa propre liberté. »"
        answer: agir
        explanation: "G 4:448."
      - id: m4-l4-p9
        sentence: "__Rappelons l'énoncé exact de Kant sur ce point__ : « Une volonté rationnelle ne peut agir que ___ **de sa propre liberté**. »"
        answer: sous l'idée
        explanation: "G 4:448."

  - id: m4-l5
    title: De la liberté négative à l'autonomie ; le fait de la raison
    notes: |
      Kant argumente qu'une volonté rationnelle libre {violet}au sens négatif{/violet} doit
      être __autonome__. {coral}Vouloir, en effet, c'est causer une action ; or toute{/coral}
      {coral}causalité, selon un principe humien que Kant reprend à son compte,{/coral}
      {coral}suppose une régularité universelle reliant cause et effet{/coral} : c'est-à-dire
      une {violet}**loi**{/violet}. Cette loi ne peut être une loi naturelle, biologique ou
      psychologique, sans quoi la volonté ne serait plus libre au sens
      négatif : {coral}elle doit donc être une loi dont la volonté rationnelle est{/coral}
      {coral}elle-même l'auteur{/coral} : ce qui est la définition même de l'{violet}**autonomie**{/violet}.

      ! Des commentateurs, dont {sky}Hill{/sky}, ont relevé un {red}**écart**{/red} dans cet
        argument : établir que toute volonté autonome se conforme aux lois
        universellement valables qu'elle se donne ne montre pas encore
        pourquoi ces lois devraient prendre la forme précise de la formule de
        la loi universelle de la nature.

      Dans les {sky}*Fondements*{/sky}, Kant tente ainsi d'établir l'autonomie à partir
      d'un argument sur la {violet}liberté négative{/violet}, argument que lui-même juge
      insuffisant, faute de prouver que nous sommes réellement libres. Dans
      la {sky}seconde Critique{/sky}, il inverse la démarche : il pose comme un
      {violet}**fait de la raison**{/violet} ({blue}*Factum der Vernunft*{/blue}) que notre volonté est liée
      par l'impératif catégorique, et en tire notre autonomie.

      Face à l'échec apparent de l'argument des {sky}*Fondements*{/sky}, certains
      commentateurs, comme {sky}Korsgaard et Wood{/sky}, ont cherché à établir
      l'existence d'une {violet}**fin en soi**{/violet} de façon indépendante, en s'appuyant
      sur l'argument selon lequel l'humanité est une fin en soi ; {sky}Guyer{/sky}, de
      son côté, y voit plutôt un argument en faveur de la liberté elle-même
      comme fin en soi.
    points:
      - id: m4-l5-p1
        sentence: Selon un **principe humien** que Kant reprend à son compte, __toute causalité suppose une régularité universelle reliant cause et effet, c'est-à-dire une__ ___.
        answer: loi
      - id: m4-l5-p2
        sentence: Cette loi qui relie la volonté à son effet **ne peut être une loi naturelle, biologique ou psychologique**, sans quoi la volonté ne serait plus libre au sens négatif ; __elle doit donc être une loi dont la volonté rationnelle est elle-même__ ___.
        answer: l'auteur
      - id: m4-l5-p3
        sentence: __Une volonté qui **se donne elle-même la loi universelle** à laquelle elle se conforme est dite, par Kant,__ ___.
        answer: autonome
      - id: m4-l5-p4
        sentence: Le commentateur Hill **relève un écart dans l'argument de Kant**, entre établir que toute volonté autonome se conforme aux lois universellement valables qu'elle se donne, et __montrer que ces lois prennent la forme précise de la loi universelle de la__ ___.
        answer: nature
      - id: m4-l5-p5
        sentence: "__Dans la seconde Critique, à la différence des Fondements, Kant pose comme un fait de la raison, en allemand__ ___, que **notre volonté est liée par l'impératif catégorique**, et en tire notre autonomie."
        answer: Factum der Vernunft
      - id: m4-l5-p6
        sentence: Le fait que **notre volonté soit liée par l'impératif catégorique** __porte, dans la seconde Critique de Kant, le nom français de fait de la__ ___.
        answer: raison
      - id: m4-l5-p7
        sentence: "**Face à l'échec apparent de l'argument des Fondements** pour établir l'autonomie, les commentateurs Korsgaard et Wood cherchent à établir indépendamment que __l'humanité est une__ ___, tandis que Guyer y voit plutôt un argument en faveur de la liberté elle-même."
        answer: fin en soi
      - id: m4-l5-p8
        sentence: "__Kant conclut ainsi l'argument reliant liberté négative et autonomie__ : « **La volonté obéit donc à** ___, non pas une loi dont la nature serait l'auteur, mais une loi dont nous sommes nous-mêmes l'origine ou l'auteur. »"
        answer: une loi universelle
      - id: m4-l5-p9
        sentence: "__Selon cette même conclusion__ : « La volonté obéit donc à une loi universelle, **non pas une loi dont** ___, mais une loi dont nous sommes nous-mêmes l'origine ou l'auteur. »"
        answer: la nature serait l'auteur
      - id: m4-l5-p10
        sentence: "__Selon cette même conclusion__ : « La volonté obéit donc à une loi universelle, non pas une loi dont la nature serait l'auteur, **mais une loi dont nous sommes nous-mêmes** ___. »"
        answer: l'origine ou l'auteur

  - id: m4-l6
    title: Deux lectures alternatives de l'autonomie
    notes: |
      Si la plupart des lecteurs de Kant tiennent l'autonomie pour une
      propriété des {violet}volontés{/violet} rationnelles, {amber}**deux lectures alternatives**{/amber}
      méritent d'être distinguées.

      - {sky}Thomas E. Hill, Jr.{/sky} soutient que l'autonomie est d'abord, chez Kant,
        une propriété des {violet}principes{/violet}, non des {violet}volontés{/violet}. L'idée centrale
        est que toute théorie morale antérieure à Kant aurait fait dépendre
        les principes moraux fondamentaux des intérêts et désirs de ceux
        qu'ils obligent, des principes que Kant qualifie d'{violet}**hétéronomes**{/violet}.
        {coral}Parce qu'aucun intérêt n'est nécessairement universel, de telles{/coral}
        {coral}théories excluraient par construction la possibilité même d'une{/coral}
        {coral}moralité universellement obligatoire{/coral} ; l'impératif catégorique, lui,
        ne consacrant aucun intérêt préexistant, est un principe {violet}**autonome**{/violet}.
      - Une autre lecture, développée notamment par {sky}Wolff{/sky}, identifie la
        volonté à la raison pratique elle-même : {green}vouloir quelque chose, sur{/green}
        {green}cette lecture, c'est se gouverner selon la raison{/green}, si bien que nous
        agirions soit rationnellement (et donc de façon autonome), soit sous
        l'effet de forces non rationnelles (et donc de façon hétéronome).

      ! Cette seconde lecture se heurte à une conséquence peu plausible :
        {red}elle implique que tout acte irrationnel, donc tout acte immoral, ne{/red}
        {red}serait __pas voulu__ et donc __pas libre__{/red}, ce que la plupart des
        interprètes de Kant refusent, tout en reconnaissant, pour certains
        d'entre eux, une part de vérité dans l'idée que nous agissons
        toujours sous le {teal}« {/teal}{teal}visage du bien »{/teal}.
    points:
      - id: m4-l6-p1
        sentence: Alors que la plupart des lecteurs de Kant tiennent l'autonomie pour une propriété des volontés rationnelles, __le commentateur__ ___ soutient qu'elle est d'abord **une propriété des principes**.
        answer: Hill
      - id: m4-l6-p2
        sentence: "Dans la lecture de Hill, Kant reproche à toute théorie morale antérieure à la sienne de **faire dépendre les principes moraux fondamentaux des intérêts et désirs de ceux qu'ils obligent** : __de tels principes sont dits__ ___."
        answer: hétéronomes
      - id: m4-l6-p3
        sentence: Parce qu'**aucun intérêt n'est nécessairement universel**, des principes hétéronomes excluraient par construction la possibilité même d'une moralité universellement obligatoire ; l'impératif catégorique, qui ne consacre aucun intérêt préexistant, __est au contraire un principe__ ___.
        answer: autonome
      - id: m4-l6-p4
        sentence: __Une autre lecture de l'autonomie, développée notamment par__ ___, **identifie la volonté à la raison pratique elle-même**, de sorte que vouloir consiste à se gouverner selon la raison.
        answer: Wolff
      - id: m4-l6-p5
        sentence: Sur la lecture de Wolff, nous agirions donc **soit rationnellement et de façon autonome**, __soit sous l'effet de forces non rationnelles et de façon__ ___.
        answer: hétéronome
      - id: m4-l6-p6
        sentence: La lecture de Wolff se heurte à une conséquence peu plausible, à savoir que **tout acte irrationnel, donc tout acte immoral**, __ne serait ni voulu ni__ ___.
        answer: libre

  - id: m4-l7
    title: Statut moral, êtres non rationnels et handicap
    notes: |
      Ce que Kant tient pour la source de notre statut moral spécial n'est,
      selon lui, {red}ni une propriété biologique contingente, ni l'espèce à{/red}
      {red}laquelle nous appartenons, ni même la capacité de ressentir la douleur{/red},
      mais la {violet}**nature rationnelle**{/violet}, c'est-à-dire les capacités et
      dispositions morales à légiférer et suivre des principes moraux. Ce
      statut moral fondamental, chez Kant, {green}__ne comporte pas de degrés__{/green} : {yellow}les{/yellow}
      {yellow}nourrissons, les personnes trisomiques ou autistes, ou une personne{/yellow}
      {yellow}endormie ou dans le coma{/yellow}, conservent, selon Kant, un statut moral égal à
      celui de n'importe qui, même si leurs capacités morales demeurent
      sous-développées, non pleinement exercées ou temporairement dormantes.

      ! Une difficulté majeure surgit pour les êtres humains atteints des
        {red}**handicaps cognitifs les plus sévères**{/red}, qui semblent, chez Kant,
        dépourvus même des dispositions les plus élémentaires à reconnaître
        et suivre des normes morales, et donc exclus de la communauté morale
        d'une façon aux conséquences pratiques inacceptables.

      {amber}Trois stratégies s'offrent aux défenseurs de Kant face à cette{/amber}
      {amber}difficulté{/amber}.
      - {amber}__Accepter la conséquence__{/amber} : certains, dont {sky}Wood et Sussman{/sky},
        admettent que ces êtres humains n'ont pas le statut moral fondamental
        que nous partageons, tout en soutenant qu'on peut avoir des devoirs
        __à leur égard__ sans avoir de devoirs __envers eux__, par exemple
        des devoirs de perfectionnement moral de soi, ou de bienveillance
        envers leurs proches.
      - {amber}__Étendre les faits biologiques et psychologiques__{/amber} : {sky}Kain{/sky} soutient
        que, selon les propres théories biologiques et psychologiques de
        Kant, tout être humain, y compris atteint d'un handicap cognitif
        sévère, possède nécessairement les {violet}**traits requis de la personnalité{/violet}
        {violet}morale**{/violet}.
      - {amber}__Compléter la théorie kantienne__{/amber} : {sky}Korsgaard{/sky} soutient que, parce
        que nous valorisons des choses, nous devons nous {violet}**valoriser{/violet}
        {violet}nous-mêmes comme fins**{/violet}, ce qui nous engage à valoriser comme fins tous
        les animaux humains et non humains ; {sky}Sensen{/sky} fait du respect dû à tout
        être humain un trait constitutif de l'{violet}**agentivité rationnelle**{/violet},
        indépendant des propriétés intrinsèques de son objet.
    points:
      - id: m4-l7-p1
        sentence: Ce que Kant tient pour la source de notre statut moral spécial n'est **ni une propriété biologique contingente ni l'espèce à laquelle nous appartenons**, __mais la nature__ ___, c'est-à-dire les capacités et dispositions morales à légiférer et suivre des principes moraux.
        answer: rationnelle
      - id: m4-l7-p2
        sentence: Le statut moral fondamental, chez Kant, **ne comporte pas de degrés** ; c'est pourquoi un nourrisson ou une personne endormie conservent, selon Kant, un statut moral égal à celui de n'importe qui, __même si leurs capacités morales demeurent__ ___.
        answer: sous-développées
      - id: m4-l7-p3
        sentence: Une difficulté majeure pour la théorie kantienne du statut moral concerne les êtres humains atteints des **handicaps cognitifs les plus sévères**, qui semblent, chez Kant, __dépourvus même des dispositions les plus élémentaires à reconnaître et suivre des normes__ ___.
        answer: morales
      - id: m4-l7-p4
        sentence: "Face à la difficulté que posent, pour le statut moral chez Kant, les êtres humains atteints des handicaps cognitifs les plus sévères, la **première des trois stratégies de défense** envisagées, associée aux commentateurs Wood et Sussman, consiste à accepter la conséquence qu'ils n'ont pas le statut moral fondamental que nous partageons, __tout en distinguant des devoirs envers eux et des devoirs__ ___."
        answer: à leur égard
      - id: m4-l7-p5
        sentence: Face à la difficulté que posent, pour le statut moral chez Kant, les êtres humains atteints des handicaps cognitifs les plus sévères, la **deuxième des trois stratégies de défense** envisagées, __défendue par le commentateur__ ___, soutient que, selon les propres théories biologiques et psychologiques de Kant, tout être humain possède nécessairement les traits requis de la personnalité morale.
        answer: Kain
      - id: m4-l7-p6
        sentence: Face à la difficulté que posent, pour le statut moral chez Kant, les êtres humains atteints des handicaps cognitifs les plus sévères, la **troisième des trois stratégies de défense** envisagées, défendue par Korsgaard, part de l'idée que, parce que nous valorisons des choses, nous devons nous valoriser nous-mêmes comme fins, __ce qui nous engage à valoriser comme fins tous les animaux humains et__ ___.
        answer: non humains
      - id: m4-l7-p7
        sentence: Une variante de la stratégie de Korsgaard face à la difficulté que posent, pour le statut moral chez Kant, les êtres humains atteints des handicaps cognitifs les plus sévères (valoriser comme fins tous les animaux humains et non humains), __est défendue par le commentateur__ ___, qui fait du **respect dû à tout être humain** un trait constitutif de l'agentivité rationnelle, indépendant des propriétés intrinsèques de son objet.
        answer: Sensen

  - id: m4-l8
    title: Handicap, bienfaisance et respect
    notes: |
      Kant s'est d'abord attaché à formuler des principes valables pour toute
      circonstance humaine, mais il reconnaissait qu'un système complet de
      devoirs devait aussi s'appliquer à des contextes et à des {violet}**groupes{/violet}
      {violet}particuliers**{/violet}. Des kantiens contemporains, en particulier {sky}Cureton{/sky}, ont
      développé cette application aux personnes en situation de handicap.

      - Le choix de parents prospectifs de ne pas avoir d'enfant susceptible
        d'être en situation de handicap peut exprimer, sans que ce soit son
        intention, une attitude {red}__irrespectueuse__{/red} envers les personnes
        handicapées déjà existantes.
      - {coral}Les personnes handicapées sont souvent ridiculisées, infantilisées,{/coral}
        {coral}et privées d'occasions de continuer à développer leurs capacités{/coral}
        {coral}naturelles{/coral} (par exemple dans des établissements qui privilégient
        leur confort plutôt que leur développement), ou exclues de
        relations d'amitié et de solidarité : autant de {red}**manquements**{/red}, selon
        ces kantiens, à des devoirs que Kant décrit lui-même. Elles
        rencontrent aussi des obstacles au {violet}**respect de soi**{/violet} lorsqu'elles sont
        perçues comme un fardeau, comme simulant leur condition, ou comme des
        curiosités.

      ! La {violet}bienfaisance{/violet} envers une personne handicapée doit être
        {green}tempérée par le respect{/green} qui lui est dû comme personne : {yellow}imposer{/yellow}
        {yellow}une gratitude pesante à une personne aveugle qui préférerait se{/yellow}
        {yellow}repérer seule{/yellow}, {yellow}« aider » une personne sourde en payant un implant{/yellow}
        {yellow}cochléaire qu'elle ne désire pas{/yellow}, {yellow}terminer avec condescendance les{/yellow}
        {yellow}phrases d'une personne qui bégaie{/yellow}, ou confondre un {violet}**devoir strict**{/violet}
        {yellow}(installer une rampe d'accès){/yellow} avec un simple {violet}**devoir facultatif de{/violet}
        {violet}charité**{/violet}, sont autant de façons de manquer, sous couvert de
        {coral}bienfaisance{/coral}, au respect qui est dû.
    points:
      - id: m4-l8-p1
        sentence: Bien que Kant se soit d'abord attaché à formuler des principes valables pour toute circonstance humaine, il reconnaissait qu'un **système complet de devoirs** __devait aussi s'appliquer à des contextes et des groupes__ ___.
        answer: particuliers
      - id: m4-l8-p2
        sentence: Le choix de parents prospectifs de **ne pas avoir d'enfant susceptible d'être en situation de handicap** __peut exprimer, sans que ce soit son intention, une attitude__ ___ envers les personnes handicapées déjà existantes.
        answer: irrespectueuse
      - id: m4-l8-p3
        sentence: Les personnes handicapées sont souvent **privées d'occasions de continuer à développer leurs capacités naturelles**, __par exemple dans des établissements qui privilégient leur confort plutôt que leur__ ___.
        answer: développement
      - id: m4-l8-p4
        sentence: Selon des kantiens contemporains comme Cureton, qui ont étendu la théorie de Kant aux personnes en situation de handicap, celles-ci rencontrent aussi des **obstacles au respect de soi** lorsqu'elles sont __perçues comme un fardeau, comme simulant leur condition, ou comme des__ ___.
        answer: curiosités
      - id: m4-l8-p5
        sentence: "**La bienfaisance envers une personne handicapée** doit être, selon des kantiens contemporains comme Cureton, __tempérée par le__ ___ qui lui est dû comme personne, sous peine de verser dans la condescendance."
        answer: respect
      - id: m4-l8-p6
        sentence: "**Imposer à une personne aveugle qui préférerait se repérer seule une obligation de gratitude** __qu'elle vivrait comme un__ ___ illustre une forme de bienfaisance qui manque de respect envers la personne aidée."
        answer: fardeau
      - id: m4-l8-p7
        sentence: "**Payer à une personne sourde un implant** ___ __qu'elle ne désire pas, en croyant ainsi l'aider, est un autre exemple de bienfaisance qui manque de respect envers son propre choix__."
        answer: cochléaire
      - id: m4-l8-p8
        sentence: "**Terminer par avance les phrases d'une personne qui bégaie**, de façon à exprimer de la pitié plutôt qu'une aide neutre, __est un troisième exemple de bienfaisance empreinte de__ ___."
        answer: condescendance
      - id: m4-l8-p9
        sentence: Confondre l'installation d'une rampe d'accès en fauteuil roulant, **devoir strict** envers les personnes handicapées, __avec un simple devoir facultatif de__ ___, est une dernière façon de manquer de respect sous couvert de bienfaisance.
        answer: charité
