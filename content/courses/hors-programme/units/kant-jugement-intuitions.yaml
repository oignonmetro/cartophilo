- id: kj2-l4
  title: "Deux problèmes : la régression et le dilemme de la Déduction"
  notes: |-
    **Le débat se noue autour de deux difficultés, toutes deux centrées sur le jugement.**

    **La régression de la « schmimagination »** (Schulting). L'imagination doit médiatiser entre l'entendement et la sensibilité pour former des jugements valides. Or si l'imagination, et avec elle la synthèse, la spontanéité et l'unité objective, se scindent en deux sortes (l'une liée à l'entendement, l'autre à la sensibilité), il faut une quatrième faculté, la {yellow}« schmimagination »{/yellow}, pour unir ces deux sortes, puis une autre, à l'infini. {red}C'est une régression vicieuse de l'explication.{/red}

    Pour l'éviter, on peut adopter le conceptualisme fort, qui réduit la sensibilité à l'entendement. Mais cela ruine le dualisme des facultés, donc ce qui fait que Kant dépasse rationalisme et empirisme, et qu'il reste, au XIXe siècle, un vrai concurrent de l'idéalisme absolu de **Hegel**. {coral}On a donc le choix entre une régression vicieuse et le renoncement à l'originalité de Kant.{/coral}

    **Le dilemme *modus ponens* / *modus tollens* de la Déduction** (Grüne). Les mêmes conditionnels se lisent dans les deux sens.
    - {green}Le non-conceptualiste{/green} : si le non-conceptualisme est vrai, il existe des intuitions valides de manière autonome ; si elles existent, il y a une lacune dans la Déduction, car la portée cognitive de la sensibilité excède, ou menace d'excéder, celle de l'entendement et de ses concepts purs ; s'il y a une lacune, la Déduction n'est pas probante. Donc elle n'est pas probante.
    - {pink}Le conceptualiste{/pink} : la Déduction doit être probante ; si elle l'est, il n'y a pas de lacune ; s'il n'y a pas de lacune, il n'existe pas d'intuitions valides de manière autonome ; s'il n'en existe pas, le non-conceptualisme est faux. Donc il est faux.

    {coral}Le *modus ponens* de l'un est le *modus tollens* de l'autre{/coral}, et il ne semble y avoir aucun moyen de principe de trancher.

    ! Ces deux problèmes ne sont pas réglés ici : Hanna y revient en fin de cours, à propos des objets rebelles aux catégories.
  points:
  - id: kj2-l4-p1
    sentence: "Si l'imagination se scinde en deux sortes, l'une liée à l'entendement, l'autre à la sensibilité, il faut une quatrième faculté pour les unir, appelée par plaisanterie la ___, et ainsi de suite à l'infini."
    answer: "schmimagination"
    alt: []
  - id: kj2-l4-p2
    sentence: "Le problème de la schmimagination tient en ceci que l'imagination scindée en deux exige une quatrième faculté pour unir ses deux sortes, puis une autre : c'est une ___ vicieuse de l'explication."
    answer: "régression"
    alt: []
  - id: kj2-l4-p3
    sentence: "Échapper à la régression de la schmimagination par le conceptualisme fort revient à ruiner le dualisme des facultés, donc la prétention de Kant à dépasser le rationalisme et l'empirisme et à concurrencer l'idéalisme absolu de ___."
    answer: "Hegel"
    alt: []
  - id: kj2-l4-p4
    sentence: "Le non-conceptualiste raisonne : s'il existe des intuitions valides de manière autonome, la portée de la sensibilité excède, ou menace d'excéder, celle de l'entendement ; il y a donc une ___ dans la Déduction transcendantale, qui n'est pas probante."
    answer: "lacune"
    alt: []
  - id: kj2-l4-p5
    sentence: "Le conceptualiste retourne l'argument sur la Déduction transcendantale : celle-ci doit être probante ; il n'y a donc pas de lacune ; il n'existe donc pas d'intuitions valides de manière autonome ; le ___ est donc faux."
    answer: "non-conceptualisme"
    alt: ["non conceptualisme"]
  - id: kj2-l4-p6
    sentence: "Dans le dilemme de la Déduction transcendantale, le *modus ponens* du non-conceptualiste est le *modus* ___ du conceptualiste, et il ne semble y avoir aucun moyen de principe de trancher."
    answer: "tollens"
    alt: []
- id: kj2-l5
  title: "Le tenir-pour-vrai : opinion, croyance, savoir"
  notes: |-
    **Une théorie de la connaissance kantienne n'est pas une épistémologie au sens actuel.** Dans sa célèbre lettre à **Marcus Herz** (10:129-130), Kant pose la question directrice de la philosophie critique : {teal}« quel est le fondement du rapport à l'objet de ce qu'on appelle en nous "représentation" (`Vorstellung`) ? »{/teal} Comment des représentations mentales objectivement valides, en particulier *a priori*, sont-elles possibles ? C'est l'objet de la {violet}théorie de la connaissance{/violet} (`Erkenntnistheorie`), à ne pas confondre avec {red}l'épistémologie contemporaine{/red}, théorie de la croyance vraie justifiée (avec le problème de Gettier sur la chance) tournée vers le scepticisme. Pour Hanna, la première *Critique* est donc un {green}traité de sémantique cognitive{/green}, à l'intérieur duquel Kant élabore aussi une épistémologie du jugement.

    **Contraste avec Frege.** Pour **Frege**, des pensées composées de sens (`Sinne`) non spatio-temporels sont « saisies », et juger, c'est passer de la pensée saisie à la valeur de vérité : le sujet n'a donc affaire au vrai que dans les attitudes assertives. Pour Kant, les épisodes de jugement sont des actions (`Handlungen`, A69/B94) qui engendrent des propositions, et {green}toute attitude propositionnelle est un cas de{/green} {violet}tenir-pour-vrai{/violet} (`Fürwahrhalten`, A820/B848), une manière dont le sujet s'engage directement envers la valeur de vérité de son jugement.

    **Trois degrés du tenir-pour-vrai.**

    | Degré | Terme allemand | Suffisance |
    | opinion | `Meinen` | ni subjective ni objective |
    | croyance | `Glauben` | subjective seulement |
    | savoir | `Wissen` | subjective et objective |

    - {violet}L'opinion{/violet} n'atteint ni la {violet}persuasion{/violet} (`Überredung`, suffisance simplement subjective) ni la {violet}conviction{/violet} (`Überzeugung`, suffisance objective) : envisager une proposition, feindre, supposer.
    - {violet}La croyance épistémique{/violet} inclut la persuasion, mais n'atteint pas seule la conviction.
    - {violet}Le savoir{/violet} est la croyance épistémique achevée, parvenue à la conviction, autrement dit à la suffisance objective, qui inclut nécessairement la vérité en excluant toute liaison accidentelle (toute chance) entre croyance et vérité : d'où son autre nom, la {violet}certitude{/violet} (`Gewissheit`).

    ! `Wissen` n'est pas la simple « connaissance » (`Erkenntnis`), représentation consciente d'un objet : c'est un degré d'engagement envers la vérité. Une représentation peut être une connaissance au sens large sans être un savoir.
  points:
  - id: kj2-l5-p1
    sentence: "Dans sa lettre à Marcus ___, Kant pose la question directrice de la philosophie critique : quel est le fondement du rapport de la représentation à l'objet ?"
    answer: "Herz"
