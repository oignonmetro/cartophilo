- id: kj2-l6
  title: "Le savoir a priori et le faillibilisme de Kant"
  notes: |-
    **Kant est optimiste sur le savoir, mais pas au point d'être infaillibiliste.** Contrairement à bien des épistémologues des XXe et XXIe siècles, il tient le savoir pour possible et réalisé dans deux domaines :
    - {green}le savoir *a posteriori*{/green}, certitude empirique sur des vérités contingentes, dans la science de la nature et l'expérience courante ;
    - {green}le savoir *a priori*{/green}, certitude non empirique sur des vérités nécessaires, dans les sciences exactes et la philosophie.

    **Deux formes de savoir *a priori*.**
    - **Non inférentiel**, avec une phénoménologie cognitive intrinsèquement contraignante : c'est l'{violet}intellection{/violet} rationnelle (`Einsicht`), ce que **Descartes** aurait appelé une intuition rationnelle claire et distincte.
    - **Inférentiel**, fondé sur une démonstration ou une preuve (A783-794/B810-822) ; même alors, son statut de savoir repose en dernier sur des prémisses que garantit l'intellection rationnelle (Hanna).

    **Le faillibilisme.** Kant distingue soigneusement deux choses : (i) la phénoménologie contraignante propre à l'intellection, l'impression d'évidence ; (ii) la suffisance objective de la croyance *a priori*, sa liaison non accidentelle à une vérité nécessaire. Le premier peut donc se trouver sans le second. J'ai beau trouver une proposition évidente, il se peut que je me trompe : c'est le cas de bien des mathématiciens avant que leur démonstration ne soit réfutée (exemple familier, qui n'est pas de Kant). {coral}À la différence de Descartes et des rationalistes infaillibilistes, et comme les rationalistes « modérés » récents (**BonJour**), Kant est faillibiliste sur l'intellection rationnelle.{/coral}

    ! Faillibiliste ne veut pas dire sceptique : le savoir reste possible et réalisé, l'évidence seule n'en est simplement pas la garantie.
  points:
  - id: kj2-l6-p1
    sentence: "Contrairement à bien des épistémologues récents, Kant tient pour possible et réalisée la certitude ___ sur des vérités contingentes, dans la science de la nature et dans l'expérience courante."
    answer: "empirique"
    alt: []
