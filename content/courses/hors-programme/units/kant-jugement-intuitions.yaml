- id: kj2-l3
  title: "Conceptualisme contre non-conceptualisme"
  notes: |-
    **Le débat engage toute la *Critique* : la nature de l'idéalisme transcendantal comme la Déduction des catégories.** Hanna reconnaît que les textes tirent dans les deux sens et que la question reste très disputée.

    **Les deux thèses générales.**
    - {pink}Le conceptualisme{/pink} : tout contenu représentatif objectif conscient d'un homme rationnel est strictement déterminé par ses seules capacités conceptuelles ; et les animaux et les hommes non rationnels ne sont pas capables de représentation objective consciente.
    - {green}Le non-conceptualisme{/green} : tout ce contenu n'est pas déterminé par les seules capacités conceptuelles ; une partie est autonome, indépendante du contenu conceptuel et déterminée par les seules capacités non conceptuelles ; et au moins certains animaux et hommes non rationnels sont capables de représentation objective consciente.

    **Quatre positions kantiennes.**

    | Position | Thèse propre | Tenants |
    | conceptualisme fort | l'entendement détermine aussi la sensibilité et ses intuitions | Sellars, McDowell, Abela |
    | conceptualisme faible | la sensibilité fournit une simple condition nécessaire | Wenzel, Ginsborg, Grüne |
    | non-conceptualisme faible | les intuitions donnent seules un contenu objectif | Rohs, Allais, McLear |
    | non-conceptualisme fort | ce contenu sert aussi à justifier les croyances | Laiho, Tolley, Hanna |

    **Ce qui sépare les versions fortes et faibles.**
    - Le conceptualisme faible {coral}préserve minimalement le dualisme des facultés{/coral} et un rôle à demi indépendant pour les intuitions (tout en refusant qu'elles aient un contenu d'une autre nature), et admet que des concepts empiriques opèrent hors de jugements explicites. {red}Le conceptualisme fort réduit explicativement la sensibilité à l'entendement.{/red}
    - Le non-conceptualisme faible ne répond pas directement à l'objection de **Sellars**, le {violet}mythe du donné{/violet} : rien ne compte comme contenu représentatif objectif, ni ne peut justifier une croyance, sans entrer dans le domaine essentiellement conceptuel de l'{violet}espace des raisons{/violet}. Le non-conceptualisme fort y répond : les intuitions valides par elles-mêmes contribuent directement à justifier les croyances épistémiques et pratiques, par les facteurs normatifs et proto-rationnels que la sensibilité introduit dans leur contenu.

    ! L'enjeu n'est pas seulement de vocabulaire : selon la réponse, le divers sensible peut échapper aux catégories, et la Déduction est en péril (leçon suivante).
  points:
  - id: kj2-l3-p1
    sentence: "Pour le ___, tout contenu représentatif objectif conscient d'un homme rationnel est strictement déterminé par ses seules capacités conceptuelles, et les animaux non rationnels ne sont pas capables d'une telle représentation."
    answer: "conceptualisme"
    alt: []
  - id: kj2-l3-p2
    sentence: "Pour le ___, une partie du contenu représentatif objectif est autonome et indépendante du contenu conceptuel, et au moins certains animaux non rationnels sont capables de représentation objective consciente."
    answer: "non-conceptualisme"
    alt: ["non conceptualisme"]
  - id: kj2-l3-p3
    sentence: "Dans le débat sur les intuitions sans concepts, le conceptualisme ___ réduit explicativement la sensibilité à l'entendement, alors que sa version plus modérée préserve minimalement le dualisme des facultés."
    answer: "fort"
    alt: []
  - id: kj2-l3-p4
    sentence: "Le conceptualisme ___ admet que la sensibilité fournit une condition nécessaire de la représentation objective et que des concepts empiriques opèrent hors de jugements explicites, tout en refusant aux intuitions un contenu d'une autre nature."
