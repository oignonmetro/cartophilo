lessons:
- id: kj2-l1
  title: "« Des intuitions sans concepts sont aveugles » : le principe d'union"
  notes: |-
    **La formule la plus citée de la *Critique* semble ruiner ce que Hanna soutient des intuitions** : si les intuitions sans concepts ne sont rien, en quel sens seraient-elles non conceptuelles ? Cette leçon pose le problème.

    {teal}« Des pensées sans contenu (`Inhalt`) sont vides (`leer`), des intuitions sans concepts sont aveugles (`blind`). »{/teal} (A51/B76) Cette formule résume le {violet}principe d'union{/violet} (le *togetherness principle*, dans l'étiquette de Hanna) : la complémentarité cognitive nécessaire et l'interdépendance sémantique des intuitions et des concepts, sur le fond du dualisme de la sensibilité et de l'entendement. Kant précise : {teal}« L'entendement ne peut rien intuitionner, les sens ne peuvent rien penser. Ce n'est que de leur union que peut naître la connaissance. »{/teal} (A50-51/B74-76)

    **La lecture qui en découle.** Bien des lecteurs (**Sellars**, **McDowell**, **Abela**) en concluent que {red}les intuitions n'ont aucune indépendance{/red} : sans concepts, ou bien elles n'existent pas, ou bien elles n'ont aucun sens. Un autre texte semble les appuyer : {teal}« L'entendement connaît tout uniquement par des concepts »{/teal} (A656/B684).

    **Quatre textes résistent à cette lecture.**
    - {teal}« Des objets peuvent assurément nous apparaître sans devoir nécessairement se rapporter à des fonctions de l'entendement. »{/teal} (A89/B122)
    - {teal}« Des phénomènes peuvent certainement être donnés dans l'intuition sans fonctions de l'entendement. »{/teal} (A90/B122)
    - Des phénomènes pourraient être ainsi faits que l'entendement ne les trouve pas conformes à son unité, si bien que le concept de cause serait vide : ils présenteraient malgré cela des objets à notre intuition, {teal}« car l'intuition n'a nullement besoin des fonctions de la pensée »{/teal} (A90-91/B122-123).
    - {teal}« Le divers de l'intuition doit déjà être donné avant la synthèse de l'entendement et indépendamment d'elle. »{/teal} (B145)

    **Deux thèses en sortent, pour Hanna.**
    - {green}L'indépendance des intuitions{/green} : elles suffisent à produire des connaissances objectivement valides, au-delà de tout contenu conceptuel qui peut leur être associé.
    - {green}Leur autonomie{/green} : Kant admet des êtres connaissants sans entendement, sans capacités conceptuelles, les enfants et les bêtes (McLear), capables pourtant d'intuitions empiriques et pures valides. Les intuitions existent donc aussi en l'absence totale de concepts.

    ! D'où un dilemme : Kant soutient-il à la fois le principe d'union et l'indépendance des intuitions ? La leçon suivante donne la réponse de Hanna.
  points:
  - id: kj2-l1-p1
    sentence: "Dans la formule célèbre de Kant qui résume le principe d'union, des pensées sans ___ sont vides, des intuitions sans concepts sont aveugles."
    answer: "contenu"
    alt: []
  - id: kj2-l1-p2
    sentence: "Dans la formule célèbre de Kant qui résume le principe d'union, des pensées sans contenu sont ___, des intuitions sans concepts sont aveugles."
    answer: "vides"
    alt: []
  - id: kj2-l1-p3
    sentence: "Dans la formule célèbre de Kant qui résume le principe d'union, des pensées sans contenu sont vides, des intuitions sans ___ sont aveugles."
    answer: "concepts"
    alt: []
  - id: kj2-l1-p4
    sentence: "Dans la formule célèbre de Kant qui résume le principe d'union, des pensées sans contenu sont vides, des intuitions sans concepts sont ___."
    answer: "aveugles"
    alt: []
  - id: kj2-l1-p5
    sentence: "Kant écrit, à propos de l'entendement et des sens : « L'entendement ne peut rien intuitionner, les sens ne peuvent rien ___. »"
    answer: "penser"
    alt: []
