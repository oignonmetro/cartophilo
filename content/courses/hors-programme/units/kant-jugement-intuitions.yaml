- id: kj2-l2
  title: "Aveugle ne veut pas dire sans objet : la solution de Hanna"
  notes: |-
    **Le dilemme se défait si l'on voit à quoi le principe d'union s'applique.** Selon Hanna, Kant dit dans la formule célèbre qu'intuitions et concepts sont complémentaires et interdépendants {green}pour constituer des jugements objectivement valides{/green}, et rien de plus.

    **Deux sens de « connaissance ».** Le principe d'union correspond à un sens étroit de `Erkenntnis`, souligné dans l'édition B : la connaissance comme jugement objectivement valide (Bxxvi et n.). Le sens large de l'édition A est celui de toute représentation consciente objective (A320/B376-377). Le principe vaut pour le premier, non pour le second : hors du contexte du jugement valide, il peut donc y avoir des concepts « vides » et des intuitions « aveugles ».

    **Vide et aveugle ne sont pas des insultes, mais des statuts.**
    - {violet}Un concept vide{/violet} n'est ni un faux concept, ni un concept sans aucun sens : c'est un concept qui n'est pas objectivement valide, comme les concepts intelligibles d'objets ou de sujets nouménaux.
    - {violet}Une intuition aveugle{/violet} n'est ni une fausse intuition, ni une intuition sans aucun sens : c'est une intuition objectivement valide de manière autonome et indépendante, une connaissance essentiellement non conceptuelle.

    Une image pour fixer la thèse, qui n'est pas de Kant : un nourrisson voit bien cette chose-ci devant lui, mais il ne peut pas dire ce qu'elle est. Il ne manque pas d'objet ; il lui manque de quoi juger. C'est ce que signifie « aveugle » dans cette lecture : sans jugement possible, non sans objet.

    **Pas d'anticipation de Frege.** Quand Kant écrit que {teal}« l'entendement ne peut faire d'autre usage (`Gebrauch`) des concepts que de juger par leur moyen »{/teal} (A68/B93), il {red}n'annonce pas le principe de contexte de Frege{/red} (les mots n'ont de sens que dans une proposition entière) : les concepts nouménaux, intelligibles hors de tout jugement, en sont des contre-exemples évidents.

    ! Cette solution est la lecture de Hanna, partisan du non-conceptualisme : la leçon suivante montre que tous les kantiens ne l'acceptent pas.
  points:
  - id: kj2-l2-p1
    sentence: "Pour Hanna, le principe d'union dit seulement que les intuitions et les concepts sont complémentaires et interdépendants pour constituer des ___ objectivement valides."
    answer: "jugements"
    alt: []
  - id: kj2-l2-p2
    sentence: "Dans l'édition B de la première *Critique*, Kant souligne un sens plus ___ de `Erkenntnis`, celui de jugement objectivement valide, alors que l'édition A entendait par là toute représentation consciente objective."
    answer: "étroit"
    alt: []
  - id: kj2-l2-p3
    sentence: "Pour Hanna, un concept ___ n'est ni un faux concept ni un concept sans aucun sens, mais un concept qui n'est pas objectivement valide, comme les concepts intelligibles d'objets nouménaux."
    answer: "vide"
    alt: []
  - id: kj2-l2-p4
    sentence: "Pour Hanna, une intuition ___ n'est ni une fausse intuition ni une intuition sans aucun sens, mais une intuition objectivement valide de manière autonome et indépendante des concepts."
    answer: "aveugle"
    alt: []
  - id: kj2-l2-p5
    sentence: "Kant écrit que l'entendement ne peut faire d'autre ___ (`Gebrauch`) des concepts que de juger par leur moyen (A68/B93)."
    answer: "usage"
    alt: []
  - id: kj2-l2-p6
    sentence: "Quand Kant dit que l'entendement n'a d'autre usage des concepts que de juger, il n'anticipe pas, selon Hanna, le principe de ___ de Frege, selon lequel les mots n'ont de sens que dans une proposition entière."
    answer: "contexte"
    alt: []
  - id: kj2-l2-p7
