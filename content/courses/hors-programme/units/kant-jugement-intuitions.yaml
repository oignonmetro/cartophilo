# Cours sur la théorie kantienne du jugement (Hanna, SEP), suite : les deux
# suppléments rattachés à la section 1, « The Togetherness Principle, Kant's
# Conceptualism, and Kant's Non-Conceptualism » et « Judging, Believing, and
# Scientific Knowing ». Citations traduites de l'anglais de l'article.
#
# « Togetherness principle » est rendu par « principe d'union », d'après la
# formule de Kant que cite Hanna (« Only from their unification… ») ;
# l'étiquette anglaise est donnée une fois dans le rappel.
#
# Points laissés de côté : les listes de commentateurs du conceptualisme faible
# (Wenzel, Grüne, Griffith, Land, Bauer, Golob, Williams, Pippin, Soboleva…),
# citées sans thèse propre : seuls quelques noms figurent dans le tableau.

id: kant-jugement-intuitions
title: "Des intuitions sans concepts ? Croire et savoir"
subtitle: "« Les intuitions sans concepts sont aveugles », le non-conceptualisme, le tenir-pour-vrai"
icon: bulb
color: blue
