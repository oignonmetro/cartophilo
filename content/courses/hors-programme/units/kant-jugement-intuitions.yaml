- id: kj2-l7
  title: "Croyance doctrinale, pragmatique, morale : faire place au Glauben"
  notes: |-
    **La croyance ne se réduit pas à sa forme épistémique : c'est la clef de la formule la plus célèbre de la préface de la *Critique*.** Les interprètes récents (**Stevenson**, **Chignell**, **Kain**, **Pasternack**) replacent la croyance dans une {violet}éthique de la croyance{/violet} kantienne, avec quatre sous-espèces de `Glauben`.

    | Croyance | Nature |
    | épistémique | orientée vers le savoir |
    | doctrinale | spéculative et théorique |
    | pragmatique | instrumentale |
    | morale | éthique, un croire-en |

    **La croyance doctrinale est instable.** C'est le plus près qu'un sujet puisse approcher du scientifique, à propos d'une proposition nouménale sans valeur de vérité. Mais {teal}« il y a quelque chose d'instable dans la croyance simplement doctrinale »{/teal} (A827/B855) : les difficultés de la spéculation, ces sophismes et contradictions dialectiques rationnellement inévitables, en détournent souvent.

    **La croyance morale ne l'est pas.** {teal}« Il en va tout autrement de la croyance morale [...] car il est absolument nécessaire qu'une chose arrive, à savoir que j'obéisse en tous points à la loi morale. »{/teal} (A828/B856) Le mot anglais *faith* traduit mal `Glauben`, car la foi peut désigner un état non rationnel. La croyance morale est une attitude {red}objectivement insuffisante du point de vue épistémique{/red}, mais qui offre une {green}pleine justification pratique{/green}, relativement au système de principes moraux fondé sur l'impératif catégorique, pour choisir et agir *comme si* l'on pouvait croire ou savoir une proposition sur des objets ou des sujets nouménaux. Ses cas principaux sont les {violet}postulats de la raison pure pratique{/violet} (5:122-134), l'immortalité de l'âme et l'existence de Dieu : ils sont impossibles à croire de manière épistémique et à savoir, et ils prescrivent pourtant certaines façons de vivre.

    **Ce que veut dire Bxxx.** Quand Kant écrit dans la préface de la seconde édition {teal}« j'ai dû nier le `Wissen` pour faire place au `Glauben` »{/teal} (Bxxx), il {red}n'oppose pas la foi irrationnelle à la science{/red}. Il dit qu'il a dû restreindre, par sa critique et son idéalisme transcendantal, le champ de la croyance épistémique et du savoir, pour faire place à une croyance morale pleinement justifiée sur le plan pratique. C'est la doctrine du {violet}primat du pratique{/violet} : la croyance morale l'emporte philosophiquement sur la croyance épistémique (sciences exactes comprises) et sur la croyance doctrinale (toute métaphysique spéculative comprise). Mais le fondement rationnel de cette attitude reste le jugement : {coral}la théorie du jugement fonde ainsi la métaphilosophie de Kant{/coral}.

    ! La croyance morale n'est pas une conviction que Dieu existe : c'est le fait de vivre comme si on le savait, pour une raison pratique.
  points:
  - id: kj2-l7-p1
    sentence: "Le mot anglais *faith* traduit mal le terme allemand ___, car la foi peut désigner un état non rationnel, alors que Kant entend une attitude pleinement justifiée sur le plan pratique."
    answer: "Glauben"
    alt: []
