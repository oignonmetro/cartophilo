- id: "rousseau-nature-liberte-p2"
  title: "Les animaux ont-ils des idées ?"
  notes: |-
    Rousseau accorde aux bêtes la faculté d'avoir des idées, et même de les combiner :
    position empiriste, en rupture avec la tradition qui réservait la pensée à l'homme
    seul. Ce n'est donc « pas tant » l'entendement, mais {green}la seule qualité d'agent libre,{/green}
    {green}qui distingue l'homme de l'animal{/green}.

    Depuis l'Antiquité, on définit traditionnellement l'homme comme un *animal doué de
    raison*. Rousseau s'inscrit ici dans le sillage de l'{violet}empirisme{/violet}, réintroduit par {sky}Locke{/sky}
    puis repris au XVIIIe siècle par {sky}Hume{/sky} et {sky}Condillac{/sky} : toute connaissance viendrait de
    l'expérience, sans idées innées, et cette combinaison des idées pourrait s'effectuer
    mécaniquement, par la seule force de l'habitude. Prenons l'exemple humien du principe
    de causalité : {yellow}voir A puis B, si cette succession se répète sans exception, engendre{/yellow}
    {yellow}l'attente que B suivra A{/yellow}, sans qu'aucune raison n'intervienne : seule l'habitude
    imprime à l'idée de B une force supplémentaire. Si même les bêtes peuvent ainsi
    combiner leurs idées, la frontière entre l'homme et l'animal ne passe plus par la
    pensée, mais retombe sur la liberté déjà isolée au paragraphe précédent.

    ? **Entendement** : la faculté de former et de combiner des idées. Rousseau l'accorde aux bêtes, {amber}du plus au moins{/amber} : elle ne fait donc pas une différence d'espèce, seulement de degré.
  passage:
    label: "Fragment 2"
    text: "Tout animal a des idées puisqu'il a des sens, il combine même ces idées, jusqu'à un certain point, et l'homme ne diffère à cet égard de la bête que du plus au moins. Quelques philosophes ont même avancé qu'il y a plus de différence de tel homme à tel homme que de tel homme à telle bête ; ce n'est donc pas tant l'entendement qui fait parmi les animaux la distinction spécifique que sa qualité d'agent libre."
