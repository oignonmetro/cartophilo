- id: "rousseau-nature-liberte-p1"
  title: "L'instinct animal et la liberté humaine"
  notes: |-
    {green}Rousseau récuse la thèse qui fait de l'entendement la frontière entre l'homme et{/green}
    {green}l'animal, pour la reporter sur la **liberté**{/green} : la bête est un pur automate que « la
    nature fait tout », l'homme {teal}« concourt »{/teal} à ses propres actions {teal}« en qualité d'agent{/teal}
    {teal}libre »{/teal}.

    Rousseau reprend, en apparence, la thèse cartésienne de l'animal-machine : pour
    {sky}Descartes{/sky}, il n'y a rien dans le corps, ni *a fortiori* dans la machine, qui relève de
    la pensée. Mais Rousseau ne dit pas que l'animal est dépourvu de sentiments : à la
    différence de {sky}Malebranche{/sky} (qui aurait, selon une rumeur restée célèbre, expédié un
    coup de pied à sa chienne au motif que ses aboiements n'étaient que le jeu de
    « poulies et de ressorts »), Rousseau n'exclut ni le plaisir ni la douleur animale ;
    il évoque même, ailleurs dans le {sky}*Discours*{/sky}, la pitié qu'éprouve un cheval à fouler un
    corps vivant. {coral}« Machine » désigne seulement que l'animal n'est jamais sujet ou auteur{/coral}
    {coral}de son action{/coral} : il est réglé par l'instinct, dont les réponses sont globales et non
    ajustées, « jusqu'à un certain point », sans marge ni souplesse, comme le montrent {yellow}le{/yellow}
    {yellow}pigeon et le chat{/yellow}.

    La formule centrale, « l'homme concourt aux siennes », suppose d'être deux : la
    volonté libre, et ce que la nature a placé en l'homme pour le guider. {red}Ce n'est donc pas{/red}
    {red}l'autonomie individualiste d'un « Ni Dieu, ni maître »{/red}. Rousseau pensera plus tard ce
    concours sur le modèle du rapport entre l'âme et le corps, ou entre le souverain et le
    gouvernement dans le {sky}*Contrat social*{/sky} : « Toute action libre a deux causes qui
    concourent à la produire, l'une morale, savoir la volonté qui détermine l'acte, l'autre
    physique, savoir la puissance qui l'exécute. » (Livre III, chapitre 1.)

    |              | Bête                                    | Homme                                |
    | Cause        | la nature seule fait tout               | l'homme concourt, en agent libre     |
    | Marge        | aucune, « jusqu'à un certain point »    | peut s'écarter, même à son préjudice |
    | Exemple      | le pigeon devant les meilleures viandes | les hommes dissolus et leurs excès   |

    ! Rousseau ne dit pas que l'animal est insensible : ce qui lui manque n'est pas le
    sentiment, mais la liberté de concourir à ses propres actions.

    ? **Agent libre** : celui qui est cause de ses actes, et non seulement le lieu où la nature agit. L'animal {red}subit{/red} l'instinct ; l'homme {green}choisit{/green}, et peut donc s'écarter de la règle, même à ses dépens.
  passage:
    label: "Fragment 1"
    text: "Je ne vois dans tout animal qu'une machine à qui la nature a donné des sens pour se remonter elle-même jusqu'à un certain point et pour se garantir de tout ce qui peut tendre à la détruire ou à la déranger. J'aperçois précisément les mêmes choses dans la machine humaine, avec cette différence que la nature seule fait tout dans les opérations de la bête, au lieu que l'homme concourt aux siennes, en qualité d'agent libre. L'un choisit ou rejette par instinct, l'autre par un acte de liberté ; ce qui fait que la bête ne peut s'écarter de la règle qui lui est prescrite, même quand il lui serait avantageux de le faire, et que l'homme s'en écarte souvent à son préjudice."
