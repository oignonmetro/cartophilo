- id: "rousseau-nature-liberte-p1b"
  title: "Le pigeon, le chat et les hommes dissolus"
  notes: |-
    **Deux exemples font voir la différence :** {coral}**l'animal meurt plutôt que de s'écarter de son instinct ; l'homme s'en écarte jusqu'à en mourir.**{/coral}

    **Pourquoi le pigeon et le chat ?** {yellow}Le pigeon mourrait de faim près d'un bassin de viandes, le chat sur un tas de fruits ou de grain{/yellow}, alors qu'ils pourraient s'en nourrir {teal}« s'il s'était avisé d'en essayer »{/teal}. L'instinct est {red}rigide{/red} : il ne s'adapte pas à une situation qu'il n'a pas prévue. La bête {amber}ne peut s'écarter de la règle, même quand il lui serait avantageux de le faire{/amber}.

    **Pourquoi les hommes dissolus ?** L'exemple est symétrique et inverse : l'homme {red}s'écarte de la règle à son préjudice{/red}, {yellow}jusqu'aux excès qui causent la fièvre et la mort{/yellow}. La liberté n'est donc pas d'abord un avantage : {coral}c'est la possibilité de se tromper, et de se perdre{/coral}.

    **Pourquoi « l'esprit déprave, et la volonté parle encore, quand la nature se tait » ?** L'esprit {red}corrompt{/red} les désirs naturels, en en inventant d'autres ; et la volonté continue de vouloir quand la nature, satisfaite, ne demande plus rien. {coral}L'homme peut vouloir contre sa nature, ce que l'animal ne peut pas.{/coral}

    ! Les deux exemples ne disent pas que l'homme est {red}meilleur{/red} que la bête : ils montrent qu'il est {green}libre{/green}, pour le meilleur et pour le pire.
  passage:
    label: "Fragment 1"
    text: "C'est ainsi qu'un pigeon mourrait de faim près d'un bassin rempli des meilleures viandes, et un chat sur un tas de fruits, ou de grain, quoique l'un et l'autre pût très bien se nourrir de l'aliment qu'il dédaigne, s'il s'était avisé d'en essayer. C'est ainsi que les hommes dissolus se livrent à des excès, qui leur causent la fièvre et la mort, parce que l'esprit déprave, et que la volonté parle encore, quand la nature se tait."
