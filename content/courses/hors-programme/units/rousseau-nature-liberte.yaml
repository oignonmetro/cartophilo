- id: rousseau-nature-liberte-ouverture
  title: "Vers la Profession de foi du vicaire savoyard"
  notes: |-
    Dans la *Profession de foi du vicaire savoyard* (*Émile*, livre IV), Rousseau reprend
    et transforme l'articulation entre nature et liberté esquissée dans le *Second
    Discours*, en y introduisant deux concepts nouveaux : le sentiment et la conscience.

    Dans notre extrait, la connaissance restait mécanique (de simples associations d'idées)
    et la liberté se réduisait au seul libre arbitre. La *Profession de foi* introduit le
    jugement, opération du sujet qui ne se borne pas à répéter le donné sensible mais
    l'interprète : dire que ce bâton-ci est plus grand que ce bâton-là suppose que je
    compare, non que je perçoive une grandeur toute faite. Elle introduit aussi le
    sentiment, antérieur à l'intelligence (« nous avons eu des sentiments avant des idées »),
    qui donne à l'homme, innés, l'amour de soi, la crainte de la douleur, le désir du
    bien-être. Enfin, elle fait de la conscience la voix par laquelle Dieu, source de la
    bonté et de la justice, se communique au plus intime de l'âme humaine : « Il est donc
    au fond des âmes un principe inné de justice et de vertu, sur lequel, malgré nos
    propres maximes, nous jugeons nos actions et celles d'autrui comme bonne ou mauvaise,
    et c'est à ce principe que je donne le nom de conscience. » Nature et liberté, qui
    s'opposaient dans le *Second Discours*, se rejoignent désormais : agir librement, c'est
    agir selon sa nature la plus profonde.

    ! Ce sentiment inné n'est pas une connaissance théorique (« nous sentons avant de
    connaître », écrit Rousseau) et ne se confond pas avec l'amour-propre, qui naît, lui,
    de la comparaison avec autrui.
