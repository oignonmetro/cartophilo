- id: "rousseau-nature-liberte-ouverture"
  title: "Vers la Profession de foi du vicaire savoyard"
  notes: |-
    Dans la {sky}*Profession de foi du vicaire savoyard*{/sky} ({sky}*Émile*{/sky}, livre IV), Rousseau reprend
    et transforme l'articulation entre nature et liberté esquissée dans le {sky}*Second{/sky}
    {sky}Discours*{/sky}, en y introduisant deux concepts nouveaux : {violet}le sentiment{/violet} et {violet}la conscience{/violet}.

    Dans notre extrait, la connaissance restait mécanique (de simples associations d'idées)
    et la liberté se réduisait au seul libre arbitre. La {sky}*Profession de foi*{/sky} introduit le
    jugement, opération du sujet qui ne se borne pas à répéter le donné sensible mais
    l'interprète : {coral}dire que ce bâton-ci est plus grand que ce bâton-là suppose que je{/coral}
    {coral}compare, non que je perçoive une grandeur toute faite{/coral}. Elle introduit aussi le
    sentiment, antérieur à l'intelligence ({teal}« {/teal}nous avons eu des sentiments avant des idées »),
    qui donne à l'homme, innés, l'amour de soi, la crainte de la douleur, le désir du
    bien-être. Enfin, elle fait de la conscience la voix par laquelle Dieu, source de la
    bonté et de la justice, se communique au plus intime de l'âme humaine : « Il est donc
    au fond des âmes un principe inné de justice et de vertu, sur lequel, malgré nos
    propres maximes, nous jugeons nos actions et celles d'autrui comme bonne ou mauvaise,
    et c'est à ce principe que je donne le nom de {teal}conscience. »{/teal} {green}Nature et liberté, qui{/green}
    {green}s'opposaient dans le *Second Discours*, se rejoignent désormais : agir librement, c'est{/green}
    {green}agir selon sa nature la plus profonde{/green}.

    ! Ce sentiment inné n'est pas une connaissance théorique (« nous sentons avant de
    connaître », écrit Rousseau) et {red}ne se confond pas avec l'amour-propre{/red}, qui naît, lui,
    de la comparaison avec autrui.
  passage:
    label: "Ouverture"
    text: "Conscience, conscience ! instinct divin, immortelle et céleste voix, guide assuré d'un être ignorant et borné, mais intelligent et libre ; juge infaillible du bien et du mal qui rend l'homme semblable à Dieu."
  points:
