- id: "rousseau-nature-liberte-p3b"
  title: "Pourquoi l'homme seul devient imbécile"
  notes: |-
    **La perfectibilité a son revers :** {coral}**l'homme seul peut devenir imbécile, parce qu'il peut perdre ce qu'elle lui a fait acquérir, et retomber plus bas que la bête.**{/coral}

    **Pourquoi une question ?** {teal}« Pourquoi l'homme est-il le seul à devenir imbécile ? »{/teal} Rousseau part d'un fait d'observation, {yellow}la vieillesse ou l'accident qui ôtent à un homme ses facultés{/yellow}, et le rapporte à la perfectibilité : {amber}on ne peut perdre que ce qu'on a acquis{/amber}.

    **Pourquoi « plus bas que la bête même » ?** La bête {red}n'a rien acquis et n'a rien à perdre{/red} : elle garde son instinct jusqu'au bout. L'homme, lui, a remplacé l'instinct par des facultés acquises ; s'il les perd, {coral}il ne retrouve pas l'instinct, il tombe dans un manque que la bête ne connaît pas{/coral}.

    ! {red}La perfectibilité n'est pas un progrès garanti{/red} : le même texte demande pourquoi
    l'homme est le seul à devenir imbécile. Ce qu'elle donne, elle peut aussi le reprendre,
    avec l'âge ou les accidents.
  passage:
    label: "Fragment 3"
    text: "Pourquoi l'homme est-il le seul à devenir imbécile ? N'est-ce point qu'il retourne ainsi dans son état primitif, et que, tandis que la bête qui n'a rien acquis et qui n'a rien non plus à perdre, reste toujours avec son instinct, l'homme reperdant avec la vieillesse ou d'autres accidents tout ce que sa perfectibilité lui avait fait acquérir, retombe ainsi plus bas que la bête même ?"
  points:
