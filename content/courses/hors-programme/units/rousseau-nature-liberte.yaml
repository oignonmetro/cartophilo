  - id: "rousseau-nature-liberte-ouverture-5"
    sentence: "Dans la *Profession de foi*, Rousseau introduit un concept **absent du** *Second Discours* : __le__ ___, opération par laquelle le sujet interprète, et non plus seulement enregistre, le donné sensible."
    answer: "jugement"
    alt: []
  - id: "rousseau-nature-liberte-ouverture-6"
    sentence: "Selon Rousseau dans la *Profession de foi*, notre sensibilité est incontestablement **antérieure à notre intelligence** : __nous avons eu des__ ___ avant des idées."
    answer: "sentiments"
    alt: []
  - id: "rousseau-nature-liberte-ouverture-7"
    sentence: "Rousseau distingue le sentiment qui relève de la seule action d'un corps extérieur sur le nôtre, qu'il appelle *passion*, du sentiment qui porte sur la seule vie psychique et morale, __comme le sentiment de la__ ___."
    answer: "nature"
    alt: []
  - id: "rousseau-nature-liberte-ouverture-8"
    sentence: "L'influence qui donne son ton et son relief à la *Profession de foi* est celle du philosophe cartésien ___, __pour qui le sentiment exprime moins une pensée que l'existence en tant qu'elle s'affecte elle-même__."
    answer: "Malebranche"
    alt: []
  - id: "rousseau-nature-liberte-ouverture-9"
    sentence: "Pour Rousseau, la source des valeurs morales réside dans le sentiment d'expansion qui accompagne la création divine : **nature et liberté**, qui s'opposaient dans le *Second Discours*, __se rejoignent désormais dans la__ ___."
    answer: "conscience"
