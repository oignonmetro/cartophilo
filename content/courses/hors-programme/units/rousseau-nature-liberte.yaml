- id: rousseau-nature-liberte-p4
  title: "Un don à double tranchant"
  notes: |-
    Ce troisième paragraphe retourne la perfectibilité contre elle-même : la même
    faculté qui élève l'homme au-dessus de la bête est aussi la source de tous ses
    malheurs : un don empoisonné.

    Rousseau use ici d'un procédé rhétorique récurrent dans sa prose, le *paryponoïan*,
    trope voisin de l'oxymore mais à l'échelle de tout un énoncé : rapporter à une seule
    et même source des effets contraires. On en trouve un autre bel exemple dans l'incipit
    du *Contrat social* : « L'homme est né libre, et partout il est dans les fers. » Il ne
    s'agit pas de dénoncer le droit comme un pur mensonge (Rousseau récuse ailleurs, I, 3,
    le « droit du plus fort » comme une imposture), mais de suggérer que chaque terme
    peut se muer en son contraire : la dépendance en liberté, la liberté en servitude.

    Le mot *perfectibilité* dit alors trois choses à la fois. Le développement humain
    aurait pu ne jamais se produire sans le « funeste hasard » qui a contraint les hommes
    à sortir de leur torpeur originelle. Elle élève l'homme au-dessus de la bête, en lui
    permettant d'acquérir par lui-même de nouvelles perfections. Mais elle peut tout aussi
    bien le mettre en dessous de la bête, protégée par la nature, en le privant de tout
    secours et en le condamnant à l'errance.

    ! Ne pas lire ce paragraphe comme un simple constat pessimiste : les trois sens de la
    perfectibilité se complètent plutôt qu'ils ne s'excluent, et c'est leur tension qui
    fait tout l'enjeu de la philosophie rousseauiste.
