- id: rousseau-nature-liberte-p3
  title: "La perfectibilité"
  notes: |-
    Face aux incertitudes qui entourent la question de l'entendement, Rousseau introduit
    une qualité qui, elle, ne souffre aucune contestation : la **perfectibilité**, faculté
    de se perfectionner qui développe toutes les autres et distingue radicalement
    l'histoire humaine, mobile et cumulative, du cycle animal, fixe et répétitif.

    Le mot est rarissime, quasiment un hapax en français, que ce soit au XVIIIe siècle ou
    aujourd'hui. Ce n'est pas une simple faculté déjà formée qui attendrait dans l'ombre
    l'occasion de se réveiller, ce qui la maintiendrait dans le strict déterminisme, comme
    le marron déjà virtuellement marronnier : elle n'est rien en elle-même, sinon la
    faculté de se donner de nouvelles facultés, une « faculté au carré » qui ne s'exerce
    que dans l'urgence, quand se rompt l'équilibre entre les besoins et le milieu. D'où la
    seconde différence entre l'homme et l'animal : l'animal a une nature, au sens d'une
    essence permanente ; l'homme a une culture et une histoire, faite de circonstances et
    de « funeste hasard », qui relève de la pure et simple contingence.

    |              | Animal                              | Homme                                |
    | Développement | fixé, en quelques mois             | cumulatif, l'espèce et l'individu    |
    | Origine      | aucune, une simple nécessité        | funeste hasard, contingence          |
    | Statut       | une nature, essence permanente      | une culture, une histoire            |

    ! La perfectibilité n'est pas un progrès garanti : le même texte demande pourquoi
    l'homme est le seul à devenir imbécile. Ce qu'elle donne, elle peut aussi le reprendre,
    avec l'âge ou les accidents.
