- id: "rousseau-nature-liberte-p2b"
  title: "La conscience de la liberté"
  notes: |-
    **La différence est ailleurs :** {coral}**la nature commande à tout animal et la bête obéit ; l'homme éprouve la même impulsion, mais se reconnaît libre d'acquiescer ou de résister.**{/coral}

    **Pourquoi « la même impression » ?** L'homme {amber}n'échappe pas à la nature{/amber} : il ressent les mêmes impulsions que la bête. Sa liberté n'est pas une absence de penchants, mais {green}le pouvoir de leur dire oui ou non{/green}.

    **Pourquoi « dans la conscience de cette liberté » ?** C'est le {violet}sentiment{/violet} d'être libre qui manifeste {teal}« la spiritualité de son âme »{/teal}. La physique explique, d'une certaine manière, le mécanisme des sens et la formation des idées ; mais {coral}elle n'explique rien de la puissance de choisir{/coral}, qui relève d'actes {teal}« purement spirituels »{/teal}. La frontière entre le mécanique et le spirituel passe donc {red}non entre les idées et la matière{/red}, mais {green}entre le mécanisme et le choix{/green}.

    ! {red}Les hésitations de Rousseau{/red} (« pas tant », « surtout ») trahissent une position mal
    tranchée : la coupure entre l'homme et l'animal manque de netteté dans le {sky}*Second{/sky}
    {sky}Discours*{/sky}. Elle ne sera résolue que plus tard, dans la {sky}*Profession de foi du vicaire{/sky}
    {sky}savoyard*{/sky}, par l'introduction du concept de jugement (voir l'ouverture).
  passage:
    label: "Fragment 2"
