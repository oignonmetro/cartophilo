# Unité de texte (voir content/textes.md) : Rousseau, Discours sur l'origine et
# les fondements de l'inégalité parmi les hommes (Pléiade IV, p. 141-142) ;
# commentaire d'Éric Zernik ("Rousseau, nature et liberté").

id: rousseau-nature-liberte
title: "Rousseau : nature et liberté"
subtitle: "Discours sur l'origine et les fondements de l'inégalité, Pléiade IV, p. 141-142"
icon: page
color: orange
intro: |-
  Un extrait du *Discours sur l'origine et les fondements de l'inégalité* (le Second
  Discours) où Rousseau cherche ce qui distingue l'homme de l'animal : non l'entendement,
  qu'il accorde jusqu'à un certain point aux bêtes, mais la liberté, puis la perfectibilité,
  cette faculté ambiguë qui élève l'homme au-dessus de l'animal autant qu'elle risque de
  l'y faire retomber.
lessons:
- id: rousseau-nature-liberte-i1
  title: "Une hypothèse, pas un fait"
  notes: |-
    Le *Second Discours* ne décrit pas un homme réellement observé, mais une hypothèse.
    « Commençons par écarter tous les faits », écrit Rousseau au début de l'ouvrage : nous
    n'avons aucune trace de cet homme « sorti des mains de la nature ». Une hypothèse sur
    l'origine de l'humanité ne se valide ni ne s'exclut par les faits, faute de faits
    disponibles ; elle se juge à sa fécondité et à sa capacité d'expliquer la société telle
    que nous l'observons aujourd'hui.

    Notre extrait ouvre un tournant. Après avoir décrit l'homme physique, Rousseau écrit :
    « Tâchons de le regarder maintenant par le côté métaphysique et moral. » *Métaphysique*
    ne renvoie pas ici à la discipline qui étudie l'être, Dieu ou la substance : le mot
    désigne ce qui, dans l'homme, échappe à l'observation extérieure et doit être reconstitué
    par la pensée. *Moral* est pris dans un sens voisin : il désigne tout ce qui, dans une
    conduite, fait intervenir une volonté libre et échappe donc au mécanisme, non la
    moralité au sens éthique du terme.

    Le texte va se dérouler en trois temps. D'abord isoler le principe interne qui anime
    toute conduite humaine, la liberté. Puis une rupture avec la tradition philosophique :
    ce n'est pas la raison, depuis Platon et Aristote donnée pour propre à l'homme, mais le
    libre arbitre qui le distingue de l'animal. Enfin un concept nouveau, la perfectibilité,
    qui précise comment s'exerce cette liberté et quels risques l'accompagnent.

    ! Ne pas confondre le mot *métaphysique* employé ici avec le sens le plus courant du
    terme : Rousseau ne parle pas de l'être en général, mais de ce qui, dans l'homme,
    relève d'une volonté libre plutôt que d'un mécanisme.
