- id: rousseau-nature-liberte-p1
  title: "L'instinct animal et la liberté humaine"
  notes: |-
    Rousseau récuse la thèse qui fait de l'entendement la frontière entre l'homme et
    l'animal, pour la reporter sur la **liberté** : la bête est un pur automate que « la
    nature fait tout », l'homme « concourt » à ses propres actions « en qualité d'agent
    libre ».

    Rousseau reprend, en apparence, la thèse cartésienne de l'animal-machine : pour
    Descartes, il n'y a rien dans le corps, ni *a fortiori* dans la machine, qui relève de
    la pensée. Mais Rousseau ne dit pas que l'animal est dépourvu de sentiments : à la
    différence de Malebranche (qui aurait, selon une rumeur restée célèbre, expédié un
    coup de pied à sa chienne au motif que ses aboiements n'étaient que le jeu de
    « poulies et de ressorts »), Rousseau n'exclut ni le plaisir ni la douleur animale ;
    il évoque même, ailleurs dans le *Discours*, la pitié qu'éprouve un cheval à fouler un
    corps vivant. « Machine » désigne seulement que l'animal n'est jamais sujet ou auteur
    de son action : il est réglé par l'instinct, dont les réponses sont globales et non
    ajustées, « jusqu'à un certain point », sans marge ni souplesse, comme le montrent le
    pigeon et le chat.

    La formule centrale, « l'homme concourt aux siennes », suppose d'être deux : la
    volonté libre, et ce que la nature a placé en l'homme pour le guider. Ce n'est donc pas
    l'autonomie individualiste d'un « Ni Dieu, ni maître ». Rousseau pensera plus tard ce
    concours sur le modèle du rapport entre l'âme et le corps, ou entre le souverain et le
    gouvernement dans le *Contrat social* : « Toute action libre a deux causes qui
    concourent à la produire, l'une morale, savoir la volonté qui détermine l'acte, l'autre
    physique, savoir la puissance qui l'exécute. » (Livre III, chapitre 1.)

    |              | Bête                                    | Homme                                |
    | Cause        | la nature seule fait tout               | l'homme concourt, en agent libre     |
    | Marge        | aucune, « jusqu'à un certain point »    | peut s'écarter, même à son préjudice |
    | Exemple      | le pigeon devant les meilleures viandes | les hommes dissolus et leurs excès   |

    ! Rousseau ne dit pas que l'animal est insensible : ce qui lui manque n'est pas le
    sentiment, mais la liberté de concourir à ses propres actions.
