- id: "rousseau-nature-liberte-p3"
  title: "La perfectibilité"
  notes: |-
    Face aux incertitudes qui entourent la question de l'entendement, Rousseau introduit
    une qualité qui, elle, ne souffre aucune contestation : {green}la **perfectibilité**, faculté{/green}
    {green}de se perfectionner qui développe toutes les autres{/green} et distingue radicalement
    l'histoire humaine, mobile et cumulative, du cycle animal, fixe et répétitif.

    Le mot est rarissime, quasiment un hapax en français, que ce soit au XVIIIe siècle ou
    aujourd'hui. Ce n'est pas une simple faculté déjà formée qui attendrait dans l'ombre
    l'occasion de se réveiller, ce qui la maintiendrait dans le strict déterminisme, comme
    {yellow}le marron déjà virtuellement marronnier{/yellow} : {coral}elle n'est rien en elle-même, sinon la{/coral}
    {coral}faculté de se donner de nouvelles facultés{/coral}, une « faculté au carré » qui ne s'exerce
    que dans l'urgence, quand se rompt l'équilibre entre les besoins et le milieu. D'où la
    seconde différence entre l'homme et l'animal : l'animal a une nature, au sens d'une
    essence permanente ; l'homme a une culture et une histoire, faite de circonstances et
    de « funeste hasard », qui relève de la pure et simple contingence.

    |              | Animal                              | Homme                                |
    | Développement | fixé, en quelques mois             | cumulatif, l'espèce et l'individu    |
    | Origine      | aucune, une simple nécessité        | funeste hasard, contingence          |
    | Statut       | une nature, essence permanente      | une culture, une histoire            |
  passage:
    label: "Fragment 3"
    text: "Mais quand les difficultés qui environnent toutes ces questions laisseraient quelque lieu de disputer sur cette différence de l'homme et de l'animal, il y a une autre qualité très spécifique qui les distingue, et sur laquelle il ne peut y avoir de contestation, c'est la faculté de se perfectionner, faculté qui à l'aide des circonstances, développe successivement toutes les autres, et réside parmi nous tant dans l'espèce que dans l'individu, au lieu que l'animal est, au bout de quelques mois, ce qu'il sera toute sa vie, et son espèce, au bout de mille ans, ce qu'elle était la première année de ces mille ans."
