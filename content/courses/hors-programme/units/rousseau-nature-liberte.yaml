- id: rousseau-nature-liberte-p2
  title: "Les animaux ont-ils des idées ?"
  notes: |-
    Rousseau accorde aux bêtes la faculté d'avoir des idées, et même de les combiner :
    position empiriste, en rupture avec la tradition qui réservait la pensée à l'homme
    seul. Ce n'est donc « pas tant » l'entendement, mais la seule qualité d'agent libre,
    qui distingue l'homme de l'animal.

    Depuis l'Antiquité, on définit traditionnellement l'homme comme un *animal doué de
    raison*. Rousseau s'inscrit ici dans le sillage de l'empirisme, réintroduit par Locke
    puis repris au XVIIIe siècle par Hume et Condillac : toute connaissance viendrait de
    l'expérience, sans idées innées, et cette combinaison des idées pourrait s'effectuer
    mécaniquement, par la seule force de l'habitude. Prenons l'exemple humien du principe
    de causalité : voir A puis B, si cette succession se répète sans exception, engendre
    l'attente que B suivra A, sans qu'aucune raison n'intervienne : seule l'habitude
    imprime à l'idée de B une force supplémentaire. Si même les bêtes peuvent ainsi
    combiner leurs idées, la frontière entre l'homme et l'animal ne passe plus par la
    pensée, mais retombe sur la liberté déjà isolée au paragraphe précédent.

    ! Les hésitations de Rousseau (« pas tant », « surtout ») trahissent une position mal
    tranchée : la coupure entre l'homme et l'animal manque de netteté dans le *Second
    Discours*. Elle ne sera résolue que plus tard, dans la *Profession de foi du vicaire
    savoyard*, par l'introduction du concept de jugement (voir l'ouverture).
