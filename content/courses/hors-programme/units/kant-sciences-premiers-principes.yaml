- id: ks2-l6
  title: "Phénoménologie : mouvement possible, réel, nécessaire, et l'espace absolu"
  notes: |-
    Le dernier chapitre répond à la catégorie de la **modalité** : à quelles conditions
    peut-on juger légitimement qu'un corps se meut possiblement, réellement ou
    nécessairement ? **Il distribue les modalités entre trois sortes de mouvement, puis
    ramène l'espace absolu, présupposé par tout le livre, au statut d'idée de la raison.**

    **Trois propositions**, qui s'accordent selon Kant avec les résultats des trois chapitres
    précédents :
    - le mouvement {green}rectiligne{/green} est un prédicat simplement {violet}possible{/violet}
      de la matière ;
    - le mouvement {green}circulaire{/green} en est un prédicat {violet}réel{/violet} ;
    - le mouvement {green}égal et opposé{/green} d'une matière par rapport à une autre en est
      un prédicat {violet}nécessaire{/violet}.

    **L'espace absolu, une idée de la raison.** Ces mouvements possibles, réels et nécessaires
    présupposent l'espace absolu. Or celui-ci n'est pas lui-même un objet d'expérience : il
    faut donc le représenter par une **idée de la raison**, au sens technique de Kant, un
    concept auquel aucun objet correspondant ne peut jamais être donné en intuition. Nous ne
    pouvons jamais connaître l'espace absolu, mais il fonctionne comme un **principe
    régulateur** de notre pratique scientifique : il nous force à chercher, pour les objets
    conditionnés de l'expérience, des conditions ultérieures. Cette fonction des idées de la
    raison est développée dans l'Appendice à la Dialectique transcendantale de la première
    *Critique*.

    **Une lecture constitutive (Friedman).** Kant rejette l'espace et le temps absolus de
    Newton ; il doit donc rendre compte du **vrai mouvement** (le changement de vrai lieu au
    cours du temps) que la mécanique classique présuppose. Dans la lecture de Friedman (1992),
    Kant tient les lois du mouvement pour **constitutives** du cadre spatio-temporel de la
    théorie newtonienne, d'où leur caractère *a priori* : les vrais mouvements sont ceux
    qui obéissent aux lois dynamiques. Pour leur donner un sens objectif, il faut les mesurer,
    et Kant les ferait valoir dans un référentiel privilégié : le référentiel du **centre de
    masse** du système du monde, que celui de notre système solaire approche très bien.
    Encore faut-il le localiser. Si l'on sait *a priori* que tous les corps du système
    solaire s'attirent, on peut déduire leurs masses de leurs accélérations mutuelles, donc
    situer le centre de masse : c'est pourquoi la loi de la **gravitation universelle** doit
    compter comme *a priori*. Mais ce référentiel n'est qu'approximativement inertiel : la
    recherche doit viser des approximations de plus en plus fines, et l'espace absolu de Kant
    est justement le concept qui oriente cette recherche. Friedman a depuis corrigé sa thèse
    (2013) : ce sont les **lois de la mécanique de Kant**, non les trois lois de Newton, qui
    définissent le référentiel privilégié.

    ! L'espace absolu de Kant n'est pas celui de Newton : c'est une idée régulatrice, non une
    réalité que l'on pourrait connaître.
  points:
  - id: ks2-l6-p1
    sentence: "Dans la Phénoménologie, Kant établit que le mouvement rectiligne d'une matière est un prédicat simplement ___ de cette matière."
    answer: "possible"
    alt: []
  - id: ks2-l6-p2
