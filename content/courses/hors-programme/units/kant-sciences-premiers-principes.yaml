    answer: "réel"
    alt: ["actuel"]
  - id: ks2-l6-p3
    sentence: "Dans la Phénoménologie, Kant établit que le mouvement égal et opposé d'une matière par rapport à une autre est un prédicat ___ de cette matière."
    answer: "nécessaire"
    alt: []
  - id: ks2-l6-p4
