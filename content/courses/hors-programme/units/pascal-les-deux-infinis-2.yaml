    alt: []
  - id: pascal-les-deux-infinis-2-l6-p31
    sentence: "Le « Dieu caché » d'Isaïe (45, 15), auquel fait écho le « secret impénétrable » du §6, se dit dans la Vulgate « Vere tu es ___ »."
