    sentence: "Dans « Qui suivra ces étonnantes démarches ? », « suivre » est le verbe du géomètre qui suit un raisonnement pas à pas ; or il faudrait suivre une infinité de pas, si bien que la question rhétorique appelle la réponse « ___ ». L'adjectif « étonnantes » fait réapparaître une dernière fois le fil de l'étonnement qui court depuis le §1."
