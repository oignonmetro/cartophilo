    sentence: "Dans « Que fera-t-il donc, sinon d'apercevoir [quelque] apparence du milieu des choses », chaque terme restreint le précédent. « Apercevoir » n'est pas connaître mais saisir confusément ; « quelque » limite à une part ; « ___ » a au XVIIe siècle le double sens d'aspect extérieur et de vraisemblance ; et cette apparence n'est que celle du « milieu », non des extrêmes."
    answer: "apparence"
    alt: []
  - id: pascal-les-deux-infinis-2-l7-p17
    sentence: "Connaître seulement le milieu, c'est comme lire un livre dont on aurait arraché les premières et les dernières pages : on comprend les phrases, mais on ignore d'où part l'histoire et où elle va, donc ce que signifie ce qu'on lit. Pascal note ailleurs, sous le titre « Deux infinis. Milieu » : « quand on lit trop vite ou trop doucement on n'entend ___ »."
    answer: "rien"
    alt: []
  - id: pascal-les-deux-infinis-2-l7-p18
    sentence: "Réduire la connaissance à l'apparence du milieu, ce n'est pas professer le pyrrhonisme absolu, puisque quelque chose est aperçu ; c'est un pyrrhonisme relatif, limité à la philosophie naturelle. La suite du fragment le formule : « Voilà notre état véritable. C'est ce qui nous rend incapables de savoir certainement et d'ignorer ___. »"
    answer: "absolument"
    alt: []
  - id: pascal-les-deux-infinis-2-l7-p19
    sentence: "Dans la formule « dans un désespoir éternel de connaître ni leur principe ni leur fin », le mot « désespoir » s'entend d'abord au sens étymologique d'absence d'___, et décrit une situation sans issue plutôt qu'un affect. « Éternel » signifie qu'aucun progrès du savoir n'en sortira, ce qui oppose frontalement Pascal au projet d'une physique déduite de ses principes."
    answer: "espérance"
    alt: []
  - id: pascal-les-deux-infinis-2-l7-p20
    sentence: "La suite du fragment raille « ces titres si ordinaires, Des principes des choses, Des principes de la philosophie », aussi fastueux que De omni scibili. Le premier est peut-être une allusion à Lucrèce ; le second est celui de l'ouvrage où ___ entreprend de déduire toute la physique des premières causes. Si le principe est invinciblement caché, cette déduction est impossible."
    answer: "Descartes"
    alt: []
  - id: pascal-les-deux-infinis-2-l7-p21
    sentence: "Le §7 éclaire le fragment « Descartes inutile et incertain » (78 B). Selon la note de Brunschvicg, Descartes est ___ parce que sa métaphysique ne touche pas à « l'unique nécessaire », et incertain parce qu'il édifie son système des choses sur des principes a priori."
    answer: "inutile"
