id: "pascal-les-deux-infinis-2"
title: "Pascal : les deux infinis"
subtitle: "Pensées, 72 B, \"Disproportion de l'homme\""
icon: "page"
color: "blue"
depth: "normale"
intro: |-
  Le début du fragment « Disproportion de l'homme » : Pascal fait contempler à l'homme l'infiniment grand puis l'infiniment petit, pour lui faire découvrir qu'il n'est qu'un milieu entre rien et tout, infiniment éloigné de comprendre les extrêmes, dont seul l'auteur de la nature a la science.
lessons:
- id: "pascal-les-deux-infinis-2-i1"
  title: "Le fragment, sa place et son plan"
  notes: |-
    **Le texte est le début du fragment des {sky}*Pensées*{/sky} que Pascal intitule {teal}« Disproportion de l'homme »{/teal}** (72 dans l'édition Brunschvicg, 230 dans l'édition Sellier). Les *Pensées* sont les notes, publiées après sa mort (1670), d'une {violet}apologie{/violet} de la religion chrétienne : un ouvrage destiné à conduire l'incrédule, et d'abord le libertin savant, jusqu'à chercher Dieu.

    **Pourquoi commencer par la nature ?** Parce que l'apologie part de l'homme tel qu'il se croit : capable de connaître le monde par sa raison, comme le promet la science nouvelle. Pascal ne le contredit pas de front. Il l'invite à {amber}regarder lui-même{/amber} la nature dans toute son étendue, et lui fait découvrir {coral}qu'il n'a aucune proportion avec elle{/coral}. D'où le titre : la {violet}disproportion{/violet} est l'absence de commune mesure entre l'homme et ce qui est.

    **Le plan.** {amber}Le regard monte d'abord vers l'infiniment grand{/amber} (§1-§2), {amber}revient sur l'homme{/amber} (§3), {amber}descend vers l'infiniment petit{/amber} (§4), puis {amber}tire la leçon{/amber} : l'effroi (§5), la définition de l'homme comme milieu (§6), l'impossibilité de connaître le principe et la fin des choses (§7).

    | Mouvement | Lieu | Ce qui s'y joue |
    | élever le regard de la terre au soleil, puis aux astres, et pousser l'imagination au-delà | §1-§2 | L'univers visible n'est qu'un trait dans la nature, et l'imagination s'épuise avant elle : la nature est infinie, sans centre ni bord. |
    | ramener l'homme à lui-même pour qu'il s'estime | §3 | Rapporté à ce qui est, l'homme se découvre égaré dans un cachot, et doit apprendre son juste prix. |
    | descendre dans le ciron jusqu'à des mondes emboîtés sans fin | §4 | L'infiniment petit est un abîme égal au grand ; le corps humain, rien dans l'univers, est un tout à l'égard du néant. |
    | changer la curiosité en admiration | §5 | Suspendu entre deux abîmes, l'homme s'effraie de lui-même et doit contempler en silence plutôt que rechercher avec présomption. |
    | définir l'homme comme milieu | §6 | Néant à l'égard de l'infini, tout à l'égard du néant, l'homme est infiniment éloigné de comprendre les extrêmes. |
    | réserver la compréhension à l'auteur de la nature | §7 | L'homme n'aperçoit que l'apparence du milieu ; seul le créateur comprend le principe et la fin des choses. |

    ! Ce n'est pas un texte de {red}physique{/red} : Pascal ne décrit pas l'univers, il fait faire à l'homme {green}une expérience de pensée{/green} sur sa propre mesure.
