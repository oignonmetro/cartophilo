- id: "pascal-les-deux-infinis-2-l4d"
  title: "Notre corps, un colosse à l'égard du néant"
  notes: |-
    **Le §4 conclut par un renversement :** {coral}**notre corps, imperceptible dans l'univers, est un colosse, un monde, un tout, à l'égard du néant**{/coral} **où l'on ne peut arriver.**

    **Pourquoi « qui n'admirera » ?** La question rhétorique appelle l'assentiment de chacun : le renversement est un {amber}fait que tout esprit constate{/amber}, une fois parcourus les deux infinis.

    **Pourquoi le corps change-t-il de taille ?** Il {red}n'a pas changé{/red} : seul a changé {amber}le terme de comparaison{/amber}. {yellow}Le même corps est un point devant les astres, un monde devant le ciron{/yellow}. {coral}La grandeur n'est pas une propriété des choses, mais une relation{/coral}, et l'homme découvre qu'il n'a pas de grandeur propre.

    **Pourquoi « un colosse, un monde, ou plutôt un tout » ?** La gradation monte jusqu'au mot le plus fort, celui que le §6 reprendra : {teal}« un tout à l'égard du néant »{/teal}.

    **Pourquoi « le néant où l'on ne peut arriver » ?** Le néant est ici {amber}une limite quantitative{/amber} jamais atteinte, {yellow}comme le zéro dont on s'approche en divisant sans cesse une feuille en deux{/yellow}. Au §7, « néant » désignera le néant de la création : Pascal fera converger les deux sens.

    ! Être « un tout » à l'égard du néant n'est pas {red}une grandeur{/red} : c'est la même relativité qui faisait de l'homme {green}un rien{/green} à l'égard de l'infini.
