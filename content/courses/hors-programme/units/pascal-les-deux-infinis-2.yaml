- id: "pascal-les-deux-infinis-2-l5"
  title: "De la contemplation au respect des infinis"
  notes: |-
    **Celui qui a parcouru les deux infinis** {coral}**s'effraie de lui-même**{/coral}**, tremble, et sa curiosité se change en admiration :** {green}**il contemplera en silence**{/green} **au lieu de** {red}**rechercher avec présomption**{/red}.

    **Pourquoi « s'effraiera de soi-même » ?** Dans un autre fragment (206 B), ce qui effraie est extérieur : {teal}« le silence éternel de ces espaces infinis »{/teal}. Ici, l'effroi se retourne {amber}vers le moi{/amber} : le corps propre est le lieu où les deux infinis se rencontrent, point dans l'univers et monde à l'égard du ciron. Le §3 demandait d'estimer « soi-même son juste prix » ; le §5 en montre la limite : {coral}un être dont la grandeur dépend du terme de comparaison n'a pas de prix absolu{/coral}.

    **Pourquoi « soutenu dans la masse que la nature lui a donnée » ?** La {violet}masse{/violet} est le corps comme quantité de matière, et elle est {amber}donnée{/amber}, reçue et non produite : l'homme ne s'est pas donné sa taille. « Soutenu » reprend {sky}*De l'esprit géométrique*{/sky}, où toutes les grandeurs « se soutiennent » entre le néant et l'infini : {coral}ce qui était une propriété des grandeurs devient la situation de l'homme{/coral}, suspendu entre deux abîmes.

    **Pourquoi « il tremblera dans la vue de ces merveilles » ?** Le tremblement donne corps au sens fort de l'étonnement (« tonnerre »), et l'alliance de termes montre que {amber}l'admiration et l'effroi se nouent{/amber}.

    ? **Curiosité** : chez Pascal, non une qualité, mais le désir de savoir pour posséder par le savoir, la *libido sciendi*, l'une des trois concupiscences, que la *Première épître de Jean* nomme {teal}« concupiscence des yeux »{/teal}. Le §5 décrit donc {coral}la conversion d'un vice de l'esprit{/coral}.

    **Pourquoi « admiration » et « silence » ?** Pour {sky}Descartes{/sky}, l'admiration est la première des passions et ouvre la recherche ; son excès, l'étonnement, qui fige « comme une statue », est un mal (*Passions de l'âme*, art. 53, 70, 73, 75). Pascal fait {amber}l'inverse{/amber} : la recherche se change en admiration, et l'arrêt devient {coral}la réponse adéquate à un objet sans proportion avec l'esprit{/coral}. On ne contemple pas pour connaître, mais parce qu'on ne peut pas connaître.

    **Pourquoi « je crois » ?** L'apologiste {amber}ne démontre pas, il dispose{/amber} : il prépare le cœur, seule chose qu'une apologie puisse faire.

    ! « Contempler en silence » ne restaure pas {red}la contemplation traditionnelle{/red} : elle ne s'élève pas jusqu'à Dieu et {green}ne comprend rien{/green}.
  passage:
    label: "§5"
    part: "4. L'homme entre deux abîmes"
    text: "Qui se considérera de la sorte s'effraiera de soi-même, et, se considérant soutenu dans la masse que la nature lui a donnée, entre ces deux abîmes de l'infini et du néant, il tremblera dans la vue de ces merveilles ; et je crois que sa curiosité se changeant en admiration, il sera plus disposé à les contempler en silence qu'à les rechercher avec présomption."
