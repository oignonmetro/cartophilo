- id: "pascal-les-deux-infinis-2-l2b"
  title: "Une sphère dont le centre est partout"
  notes: |-
    **La nature est** {coral}**une sphère dont le centre est partout et la circonférence nulle part**{/coral} **: un tout sans bord ni centre, où l'imagination se perd, et cette perte est le plus grand signe sensible de la toute-puissance de Dieu.**

    **Pourquoi cette image ?** C'est une formule ancienne, qu'une tradition médiévale appliquait à Dieu ; Pascal l'applique à {amber}la nature{/amber}. Une sphère infinie n'a pas de bord, et donc tout point y est un centre. {coral}Chacun est nécessairement au centre ; la vanité de l'homme est de croire qu'il est le seul.{/coral} L'image a ainsi une vertu funeste : elle {red}retire tout repère{/red} qui permettrait de s'orienter.

    **Pourquoi « le plus grand caractère sensible de la toute-puissance de Dieu » ?** Que l'imagination se perde est {amber}un signe{/amber}, éprouvé comme un fait, non {red}une preuve métaphysique{/red}. On peut y lire une preuve cosmologique implicite (seule une puissance infinie produit une création sans borne). Mais la figure de Dieu sert surtout à {coral}disqualifier l'homme{/coral} qui cherche à prouver Dieu, plutôt qu'à qualifier Dieu.

    ! « Sensible » ne veut pas dire que Dieu {red}se voit{/red} : c'est {green}l'échec de notre imagination{/green} qui se sent.
  passage:
    label: "§2"
    part: "1. L'infiniment grand"
    text: "C'est une sphère dont le centre est partout, la circonférence nulle part. Enfin, c'est le plus grand caractère sensible de la toute puissance de Dieu, que notre imagination se perde dans cette pensée."
