  - id: pascal-les-deux-infinis-2-l6-p19
    sentence: "Dans « Un néant à l'égard de l'infini, un tout à l'égard du néant, un milieu entre rien et tout », l'être de l'homme n'est défini que par comparaison, comme le marque la locution « ___ ». Ce que le §4 avait établi pour la grandeur du corps vaut désormais pour l'être même de l'homme."
