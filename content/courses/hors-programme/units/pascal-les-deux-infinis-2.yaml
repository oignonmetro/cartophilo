- id: "pascal-les-deux-infinis-2-o1"
  title: "Du milieu au médiateur"
  notes: |-
    **Le fragment est négatif, mais il prépare l'apologie :** {coral}**si la nature ne conduit pas à Dieu par la raison, il faut un autre chemin**{/coral}.

    **Pour la connaissance.** Le fragment ruine l'idée d'une {red}physique déduite de ses principes{/red} : la science reste possible, mais comme connaissance du {amber}milieu{/amber}, toujours partielle et révisable. Il fonde un scepticisme limité, qui laisse place à l'expérience et à la géométrie, mais refuse à la raison les {amber}premiers principes et les fins dernières{/amber}.

    **Pour l'homme.** L'homme n'a {red}pas de mesure propre{/red} : grand ou petit selon le terme de comparaison, il est {violet}disproportionné{/violet} à tout ce qui est. Sa grandeur n'est pas de surmonter cette disproportion, mais de la {amber}connaître{/amber} : c'est le {sky}roseau pensant{/sky}.

    **Pour Dieu.** Le monde cesse d'être {red}un chemin de la raison vers Dieu{/red} : connaître la nature supposerait de connaître son principe et sa fin, c'est-à-dire Dieu. L'apologie annonce donc un autre accès : {green}« nous ne connaissons Dieu que par Jésus-Christ »{/green} (547 B). Au milieu entre rien et tout répond un autre milieu, le {violet}médiateur{/violet}, sans lequel ceux qui s'arrêtent à la nature tombent dans {red}l'athéisme ou le déisme{/red}.

    ! Le fragment ne conclut pas à {red}l'absurdité{/red} du monde : il conclut à {green}l'incompréhensibilité{/green} du monde pour l'homme seul.
  passage:
    label: "Prolongement"
  points:
  - id: "pascal-les-deux-infinis-2-l7-p28"
    sentence: "Chez Pascal, le monde cesse d'être un chemin de la raison vers Dieu : connaître la nature supposerait de connaître son principe et sa fin, c'est-à-dire Dieu. Or l'apologie annonce que « __nous ne connaissons Dieu que par__ ___ » (547 B), qu'elle nomme « l'objet de tout, et le centre où tout tend » (556 B)."
    answer: "Jésus-Christ"
    alt: []
  - id: "pascal-les-deux-infinis-2-l7-p29"
    sentence: "L'homme n'est qu'un milieu entre rien et tout ; mais l'apologie laisse attendre un autre milieu, __qui serait__ ___ et non plus seulement intermédiaire, puisque ceux qui cherchent Dieu hors de Jésus-Christ, et qui s'arrêtent dans la nature, « arrivent à se former un moyen de connaître Dieu et de le servir sans médiateur » (556 B), et tombent ainsi dans l'athéisme ou le déisme."
    answer: "médiateur"
    alt: []
  - id: "pascal-les-deux-infinis-2-l7-p30"
    sentence: "Bilan des §4 à §7 : le petit est un abîme égal au grand, l'effroi se retourne vers le moi, l'homme est un milieu infiniment éloigné des extrêmes, et la compréhension revient au seul créateur. Dans l'infini, l'homme n'est rien qu'on puisse mesurer, et __c'est pour cette raison qu'il ne peut rien__ ___ jusqu'au bout."
    answer: "mesurer"
    alt: []
