    sentence: "Descartes réserve le nom d'infini à Dieu et prescrit « qu'il ne faut point tâcher de comprendre l'infini, mais seulement penser que tout ce en quoi nous ne trouvons aucune borne est ___ » (Principes, I, 26) : le monde reste ainsi, en droit, proportionné à notre entendement. Pascal fait l'inverse, car la double infinité rend la nature aussi incompréhensible pour l'homme que Dieu lui-même, de sorte que seul Dieu la comprend."
