    alt: []
  - id: pascal-les-deux-infinis-2-l7-p26
    sentence: "On serait tenté de voir dans le §7 une preuve de Dieu tirée de l'incompréhensibilité de la nature. Mais le texte ne conclut pas, il ___ : il suppose le créateur et désigne le seul terme auquel la compréhension puisse être attribuée. Sa fonction reste, comme au §2, de disqualifier l'homme plutôt que de qualifier Dieu."
