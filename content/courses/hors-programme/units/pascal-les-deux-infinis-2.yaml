    alt: []
  - id: pascal-les-deux-infinis-2-l5-p16
    sentence: "Dans le fragment 206 B, ce qui effraie est extérieur : « le silence éternel de ces espaces infinis ». Au §5, « qui se considérera de la sorte s'effraiera de ___ » : le corps propre est le lieu où les deux infinis se rencontrent, puisqu'il est à la fois un point dans l'univers et un monde à l'égard de l'infiniment petit, de sorte que c'est le moi lui-même qui devient objet d'effroi."
    answer: "soi-même"
    alt: []
  - id: pascal-les-deux-infinis-2-l5-p17
    sentence: "Le §3 demandait à l'homme d'apprendre à estimer « soi-même son juste prix » ; le §5 montre la limite de cette estimation. Un être dont la grandeur dépend entièrement du terme auquel on le rapporte n'a pas de prix ___, et celui qui cherche sa mesure découvre qu'il n'en a pas."
    answer: "absolu"
    alt: []
  - id: pascal-les-deux-infinis-2-l5-p18
    sentence: "Dans « Se considérant soutenu dans la masse que la nature lui a donnée », la « masse » est le corps envisagé comme quantité de matière, et elle est « ___ », c'est-à-dire reçue et non produite. L'homme ne s'est pas donné sa taille, et le corps qui le soutient est aussi ce qui l'expose aux deux abîmes."
    answer: "donnée"
    alt: []
  - id: pascal-les-deux-infinis-2-l5-p19
    sentence: "Le participe « soutenu » reprend le verbe par lequel De l'esprit géométrique décrit toute grandeur : quelque mouvement, nombre, espace ou temps que ce soit, « ils ___ entre le néant et l'infini, étant toujours infiniment éloignés de ces extrêmes ». Ce qui était une propriété des grandeurs mathématiques devient au §5 la situation de l'homme lui-même, suspendu entre deux « abîmes », c'est-à-dire entre deux réalités sans fond."
    answer: "se soutiennent tous"
    alt: []
  - id: pascal-les-deux-infinis-2-l5-p20
    sentence: "Dans « Il tremblera dans la vue de ces merveilles », le tremblement donne corps au sens fort que l'étonnement avait au XVIIe siècle, dérivé de « ___ », celui d'un choc qui ébranle l'âme et le corps. L'alliance de termes montre en outre que l'admiration (« merveilles ») et l'effroi (« tremblera ») ne s'excluent pas, ils se nouent."
    answer: "tonnerre"
    alt: []
  - id: pascal-les-deux-infinis-2-l5-p21
    sentence: "Dans « sa curiosité se changeant en admiration », la curiosité n'est pas une qualité : c'est le désir de savoir pour posséder par le savoir, que Pascal nomme ___ dans le fragment des trois concupiscences. Le §5 décrit donc la conversion d'un vice de l'esprit, et non un simple changement d'humeur."
    answer: "libido sciendi"
    alt: []
  - id: pascal-les-deux-infinis-2-l5-p22
    sentence: "La libido sciendi, que Pascal reprend de la Première épître de Jean (2, 16), y est nommée la « concupiscence des ___ », aux côtés de la concupiscence de la chair et de l'orgueil de la vie."
    answer: "yeux"
    alt: []
  - id: pascal-les-deux-infinis-2-l5-p23
    sentence: "Pour Descartes, l'admiration est « une subite surprise de l'âme » devant ce qui lui paraît rare et extraordinaire (Passions de l'âme, art. 70), la première de toutes les passions (art. 53). Elle est utile parce qu'elle fait remarquer ce qu'on ignorait et pousse à l'apprendre, si bien que ceux qui n'y ont aucune inclination sont « ordinairement fort ___ » (art. 75) : chez Descartes, l'admiration ouvre la recherche."
    answer: "ignorants"
    alt: []
  - id: pascal-les-deux-infinis-2-l5-p24
    sentence: "Pour Descartes, l'excès d'admiration qu'est l'étonnement fait que « tout le corps demeure immobile comme une ___ » et empêche d'acquérir de l'objet une connaissance plus particulière ; c'est un excès « qui ne peut jamais être que mauvais » (Passions de l'âme, art. 73). L'arrêt de l'esprit devant son objet est donc chez lui une pathologie à corriger."
    answer: "statue"
    alt: []
  - id: pascal-les-deux-infinis-2-l5-p25
    sentence: "Chez Descartes, l'admiration conduit à la recherche, et l'arrêt de l'esprit est une pathologie. Chez Pascal, l'ordre est ___ : la recherche (la curiosité) se change en admiration, et l'arrêt, le silence, devient la réponse adéquate à un objet sans proportion avec l'esprit. Ce que Descartes traitait comme un dysfonctionnement de la passion, Pascal en fait l'attitude qui convient enfin à la disproportion."
    answer: "inverse"
    alt: []
  - id: pascal-les-deux-infinis-2-l5-p26
    sentence: "On serait tenté de croire que « contempler en silence » restaure la contemplation traditionnelle que le §1 subvertissait. Mais cette contemplation ne s'élève pas des créatures vers Dieu, ne comprend rien et renonce au discours : c'est ce qui reste quand la recherche a reconnu qu'elle n'avait aucune proportion avec son objet. Pour Vincent Carraud (Pascal et la philosophie), on y contemple non pour connaître, mais parce qu'on ne peut pas ___."
    answer: "connaître"
    alt: []
  - id: pascal-les-deux-infinis-2-l5-p27
    sentence: "Dans « Plus disposé à les contempler en silence qu'à les rechercher avec ___ », le dernier terme désigne la philosophie naturelle qui suppose une proportion entre l'esprit et la nature, celle que la suite du fragment reproche aux hommes qui « se sont portés témérairement à la recherche de la nature comme s'ils avaient quelque proportion avec elle »."
    answer: "présomption"
    alt: []
  - id: pascal-les-deux-infinis-2-l5-p28
    sentence: "Les modalités du §5 (« je crois », « il sera plus disposé ») montrent que l'apologiste ne démontre pas, il ___. Il prépare le cœur, seule chose qu'une apologie puisse faire si la conviction ne dépend pas d'elle."
    answer: "dispose"
    alt: []
- id: pascal-les-deux-infinis-2-l6
  title: "La misère de l'homme face aux deux infinis"
