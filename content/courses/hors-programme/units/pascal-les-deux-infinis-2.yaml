    alt: []
  - id: pascal-les-deux-infinis-2-l7-p25
    sentence: "Dans « L'auteur de ces merveilles les comprend. Tout autre ne le peut faire », « comprendre » est pris au sens strict d'embrasser entièrement, et seul celui qui a produit les choses le peut, comme l'horloger connaît l'horloge qu'il a assemblée autrement que celui qui en voit tourner les aiguilles. Le mot « ___ » désigne à la fois le créateur et l'écrivain, et ferme le fil lexical des « merveilles » (§4, §5, §7)."
