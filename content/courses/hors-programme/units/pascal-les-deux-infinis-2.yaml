- id: "pascal-les-deux-infinis-2-i2"
  title: "La question, la thèse, la problématique"
  notes: |-
    **Le texte demande {amber}« qu'est-ce que l'homme dans la nature ? »{/amber}** (§6), c'est-à-dire quelle place il y occupe, et ce que cette place lui permet de connaître.

    **Pourquoi est-ce une question ?** Parce que la réponse semble aller de soi. Pour la tradition, l'homme est au centre d'un monde fini et ordonné, qui le conduit vers Dieu. Pour la science nouvelle, et pour {sky}Descartes{/sky}, l'univers est peut-être sans bornes, mais il reste {red}proportionné à l'entendement{/red}, qui peut en déduire la physique de ses principes. Dans les deux cas, l'homme a {red}une mesure{/red} dans la nature.

    **Sa thèse :** l'homme n'a {coral}aucune mesure propre{/coral} ; il n'est {green}qu'un milieu entre rien et tout{/green}, infiniment éloigné de comprendre les extrêmes, et ne peut connaître ni le principe ni la fin des choses, que seul leur auteur comprend.

    **Sa problématique :** comment montrer à l'homme qu'il ne peut pas comprendre l'infini, alors qu'il ne peut le lui faire voir qu'avec les facultés mêmes dont il s'agit de montrer l'impuissance ? Pascal le résout par la méthode du texte : {amber}faire éprouver{/amber} l'échec plutôt que le démontrer. L'imagination est poussée jusqu'à se perdre, et cette perte devient la preuve.

    | Difficulté | Où elle se trouve | Réponse du texte |
    | montrer l'infini avec une imagination finie | « Je lui veux peindre » (§4) | l'imagination n'est pas chargée de représenter l'infini, mais d'éprouver qu'elle ne le peut |
    | humilier l'homme sans nier sa connaissance | « apercevoir [quelque] apparence du milieu » (§7) | l'homme connaît quelque chose, le milieu, jamais les extrêmes |
    | nommer Dieu sans le prouver | « L'auteur de ces merveilles les comprend » (§7) | Dieu est nommé pour disqualifier l'homme, non démontré |

    ! Pascal n'est pas {red}sceptique absolu{/red} : il refuse la connaissance des {green}extrêmes{/green}, non toute connaissance.
