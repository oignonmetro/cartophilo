- id: "pascal-les-deux-infinis-2-l4"
  title: "Le ciron"
  notes: |-
    **Pascal présente** {amber}**« un autre prodige aussi étonnant »**{/amber} **: l'homme descend dans les plus petites choses qu'il connaisse, divise jusqu'à épuiser ses forces, et** {red}**croit avoir atteint l'extrême petitesse de la nature**{/red}.

    **Pourquoi un second prodige ?** L'infiniment grand ne suffit pas, car il reste à l'orgueil savant {amber}un dernier refuge{/amber} : on se croit plus capable d'arriver au centre des choses que d'embrasser leur circonférence. {yellow}On croit tenir le petit parce qu'on le tient dans la main.{/yellow} Montrer le petit aussi étonnant que le grand, {coral}c'est fermer à la connaissance sa dernière prise{/coral}. C'est l'apport propre de Pascal : {sky}Montaigne{/sky}, dont vient le vocabulaire du §1 (*Essais*, I, 25), ne considérait que la grandeur.

    **Pourquoi « dans ce qu'il connaît » ?** Le mouvement du §1 s'inverse : l'homme ne détourne plus sa vue des objets bas, il les scrute. Les « choses les plus délicates » reprennent la {teal}« pointe très délicate »{/teal} du §1 : {coral}l'infini est là où la connaissance se croyait le plus en sécurité{/coral}.

    ? **Ciron** : un acarien, le plus petit animal visible à l'œil nu au XVIIe siècle. Il marque {amber}la limite du sensible{/amber}, comme l'orbe des astres au §1.

    **Pourquoi « des veines dans ces jambes, du sang dans ces veines » ?** Pascal ne décrit pas le ciron, il le {amber}divise{/amber}. Une {violet}anadiplose{/violet} fait de chaque terme le contenant du suivant : {coral}la syntaxe accomplit la division qu'elle décrit{/coral}. Et la matière se dissout, du solide au liquide puis aux vapeurs : plus on descend, moins il y a de prise. L'imagination prête d'ailleurs au ciron des jambes et des veines, traits pris à l'échelle humaine : elle reste {amber}reproductrice{/amber}, comme au §2.

    **Pourquoi « il épuise ses forces en ces conceptions » ?** La phrase répond au §2 : vers le bas comme vers le haut, {coral}une faculté finie s'épuise avant son objet{/coral}. L'échec ne tient pas à une direction de l'espace, mais à la {violet}disproportion{/violet} même entre l'esprit fini et la nature.

    **Pourquoi « il pensera peut-être » ?** C'est l'erreur à dénoncer : {red}prendre la limite de la faculté pour une limite de la chose{/red}, l'erreur de l'{violet}atomisme{/violet}, qui fait de l'atome le terme de la division. {sky}Descartes{/sky} nie aussi les atomes, mais fait de la divisibilité sans fin une idée claire ; pour Pascal, {coral}savoir que la division n'a pas de fin ne permet pas de la suivre jusqu'au bout{/coral}.

    ! Le ciron n'est pas {red}un objet d'histoire naturelle{/red} : il est {green}le seuil où l'imagination commence à défaillir{/green}.
  passage:
    label: "§4"
    part: "3. L'infiniment petit"
    text: "Mais pour lui présenter un autre prodige aussi étonnant, qu'il recherche dans ce qu'il connaît les choses les plus délicates. Qu'un ciron lui offre dans la petitesse de son corps des parties incomparablement plus petites, des jambes avec des jointures, des veines dans ces jambes, du sang dans ces veines, des humeurs dans ce sang, des gouttes dans ces humeurs, des vapeurs dans ces gouttes ; que, divisant encore ces dernières choses, il épuise ses forces en ces conceptions, et que le dernier objet où il peut arriver soit maintenant celui de notre discours ; il pensera peut-être que c'est là l'extrême petitesse de la nature."
