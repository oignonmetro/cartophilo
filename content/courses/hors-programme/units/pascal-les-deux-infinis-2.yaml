  - id: pascal-les-deux-infinis-2-l4-p29
    sentence: "Pourquoi un second prodige, si l'infiniment grand suffisait déjà à humilier la superbe ? Parce qu'il reste à l'orgueil savant un dernier refuge, que la suite du fragment nomme : « on se croit naturellement bien plus capable d'arriver ___ que d'embrasser leur circonférence ». On croit tenir le petit parce qu'on le tient dans la main ; montrer l'infiniment petit « aussi étonnant » que l'infiniment grand, c'est fermer à la connaissance sa dernière prise."
    answer: "au centre des choses"
    alt: []
  - id: pascal-les-deux-infinis-2-l4-p30
    sentence: "Le vocabulaire du §1 (« pleine majesté », « pointe très délicate », « juste prix ») vient d'un passage des Essais de ___ (I, 25, « Sur l'éducation des enfants » dans l'édition de Guy de Pernon) qui invitait à se voir comme un trait dans l'immensité de la nature pour estimer les choses « selon leur juste grandeur ». Cette source ne considérait que la grandeur : l'infiniment petit, qui vient du géomètre, est l'apport propre de Pascal."
    answer: "Montaigne"
    alt: []
  - id: pascal-les-deux-infinis-2-l4-p31
    sentence: "Le §4 inverse le mouvement du regard du §1 : l'homme n'éloigne plus sa vue « des objets bas qui l'environnent », il cherche les choses les plus délicates « dans ___ ». Le mot « délicates » reprend la « pointe très délicate » du §1, qui marquait le seuil de l'infime, et ce seuil devient le point de départ d'une nouvelle descente : l'infini n'est plus au-delà de l'horizon, il est là où la connaissance se croyait le plus en sécurité."
    answer: "ce qu'il connaît"
    alt: []
  - id: pascal-les-deux-infinis-2-l4-p32
    sentence: "Le ciron, plus petit animal visible à l'œil nu au XVIIe siècle, marque la limite du sensible comme l'orbe des astres au §1. Pascal ne le décrit pas, il le divise : dans « des veines dans ces jambes, du sang dans ces veines, des humeurs dans ce sang », une ___ fait de chaque terme le contenant du suivant, de sorte que la syntaxe accomplit la division qu'elle décrit. En même temps la matière se dissout (solide, liquide, vapeurs) : plus on descend, moins il y a de prise."
    answer: "anadiplose"
    alt: []
  - id: pascal-les-deux-infinis-2-l4-p33
    sentence: "Pour Gérard Ferreyrolles (Les reines du monde), l'imagination prête au ciron, dont l'intérieur est impénétrable à l'œil nu, des jambes, des jointures et des veines, c'est-à-dire des traits empruntés à l'échelle humaine : elle ne dépasse le visible qu'en projetant au-delà de sa limite ce qu'elle y a puisé. On retrouve le caractère ___ de l'imagination, qui l'empêchait déjà au §2 d'épuiser l'infini par sommation de déterminations spatiales."
    answer: "reproducteur"
    alt: []
  - id: pascal-les-deux-infinis-2-l4-p34
    sentence: "La phrase « Divisant encore ces dernières choses, il épuise ses forces en ces conceptions » répond au §2 (« elle se lassera plutôt de concevoir, que la nature de fournir ») : vers le bas comme vers le haut, une faculté finie s'épuise avant son objet. Le parallèle montre que l'échec ne tient pas à une direction de l'espace, mais à la ___ même entre l'esprit fini et la nature."
    answer: "disproportion"
    alt: []
  - id: pascal-les-deux-infinis-2-l4-p35
    sentence: "Dans « Il pensera peut-être que c'est là l'extrême petitesse de la nature », l'erreur que Pascal nomme consiste à prendre la limite de la ___ pour une limite de la chose, c'est-à-dire l'erreur de l'atomisme, qui fait de l'atome le terme de la division. Pascal la diagnostiquait déjà dans De l'esprit géométrique chez des esprits « très habiles » qui ne sauraient concevoir un continu divisible à l'infini, « d'où ils concluent qu'il n'y est pas divisible »."
    answer: "faculté"
    alt: []
  - id: pascal-les-deux-infinis-2-l4-p36
    sentence: "Descartes nie lui aussi l'existence d'atomes, toute étendue restant divisible (Principes de la philosophie, II, 20), mais il fait de cette divisibilité sans terme une idée claire que l'entendement manie avec sécurité. Pour Pascal, le même savoir perd celui qui le possède, car savoir que la division n'a pas de fin ne permet pas de la ___ jusqu'au bout : c'est la distinction entre connaître qu'il y a un infini et l'embrasser."
    answer: "suivre"
    alt: []
  - id: pascal-les-deux-infinis-2-l4-p37
    sentence: "Dans « Je lui veux peindre », aux subjonctifs d'injonction succède le « je » de l'apologiste, qui se fait peintre et recourt donc à l'imagination même dont le §2 avait montré l'impuissance. Il n'y a pas là de contradiction : l'imagination n'est pas mobilisée pour représenter adéquatement l'infini, mais pour éprouver de l'intérieur son ___, de sorte que l'imagination vaincue devient l'instrument de sa propre défaite."
    answer: "inadéquation"
    alt: []
  - id: pascal-les-deux-infinis-2-l4-p38
    sentence: "Dans « ce raccourci d'atome », le mot « raccourci » désigne un abrégé, une réduction à l'échelle (comme une maquette qui contient toute une ville sur une table), qui renferme « l'immensité qu'on peut concevoir de la nature ». Au §2, « nous n'enfantons que des atomes » faisait de l'atome la figure de la nullité de nos conceptions ; au §4, il devient l'enceinte de la totalité. Le mot ne désigne donc aucune chose en soi, mais une ___ relative à notre regard."
    answer: "position"
    alt: []
  - id: pascal-les-deux-infinis-2-l4-p39
    sentence: "La formule « En la même proportion que le monde visible » décrit une ___ géométrique, la même figure reproduite à une autre échelle ; Pascal proposait déjà, dans De l'esprit géométrique, de regarder le firmament au travers d'un petit verre pour voir chaque partie du ciel en chaque partie du verre. Conséquence épistémologique : si la nature est semblable à elle-même à toutes les échelles, aucune échelle n'est privilégiée, et l'échelle humaine n'a aucun titre à servir de mesure."
    answer: "similitude"
    alt: []
  - id: pascal-les-deux-infinis-2-l4-p40
    sentence: "Ce que la sphère « dont le centre est partout » disait de l'espace au §2, les mondes emboîtés du §4 le disent de la grandeur : toute grandeur est un ___, aucune n'est un centre. Le §4 prépare ainsi la définition de l'homme que donnera le §6."
    answer: "milieu"
    alt: []
  - id: pascal-les-deux-infinis-2-l4-p41
    sentence: "La formule « Qu'il se perde dans ces merveilles » reprend le verbe du §2 (« que notre imagination se perde dans cette pensée ») : la perte n'est pas un accident du parcours mais son ___, car l'apologie ne cherche pas à faire connaître l'infini, elle cherche à faire éprouver à l'esprit qu'il ne le peut pas."
    answer: "but"
    alt: []
  - id: pascal-les-deux-infinis-2-l4-p42
    sentence: "Les mondes emboîtés à l'infini ne sont pas une hypothèse physique : le texte les fait voir au subjonctif (« qu'il y voie ») et parle de l'immensité « qu'on peut concevoir ». C'est une expérience de pensée tirée de la divisibilité géométrique de l'étendue, qui n'a pas besoin d'être vraie : il suffit que rien dans nos concepts ne permette de l'___, pour que rien dans notre connaissance ne permette de fixer le plus petit, et c'est ce qui ruine la prétention d'atteindre les éléments des choses."
    answer: "exclure"
    alt: []
  - id: pascal-les-deux-infinis-2-l4-p43
    sentence: "Dans « Notre corps, qui tantôt n'était pas perceptible dans l'univers, [...] soit à présent un colosse, un monde, ou plutôt un tout, à l'égard du néant », le corps n'a pas changé, seul le terme de comparaison a changé. Pour Pascal, la grandeur n'est donc pas une propriété des choses mais une ___, et l'homme découvre qu'il n'a pas de grandeur propre."
    answer: "relation"
    alt: []
  - id: pascal-les-deux-infinis-2-l4-p44
    sentence: "Au §4, le « néant où l'on ne peut arriver » est une limite ___ jamais atteinte, comme le zéro dont on s'approche en divisant sans cesse une feuille en deux ; au §7, « néant » désignera le néant ontologique de la création, et Pascal fera converger les deux sens."
    answer: "quantitative"
    alt: []
- id: pascal-les-deux-infinis-2-l5
  title: "De la contemplation au respect des infinis"
  notes: ""
  passage:
    label: "§5"
    text: "Qui se considérera de la sorte s'effraiera de soi-même, et, se considérant soutenu dans la masse que la nature lui a donnée, entre ces deux abîmes de l'infini et du néant, il tremblera dans la vue de ces merveilles ; et je crois que sa curiosité se changeant en admiration, il sera plus disposé à les contempler en silence qu'à les rechercher avec présomption."
