    alt: []
  - id: pascal-les-deux-infinis-2-l6-p20
    sentence: "La formule « Un néant à l'égard de l'infini » s'appuie sur le principe que le fragment du pari (233 B) énonce ainsi : « le fini s'anéantit en présence de l'infini, et devient un pur ___ ». La proposition suivante en est le symétrique : rapporté à rien, n'importe quel être est tout."
