- id: "pascal-les-deux-infinis-2-l3"
  title: "Prendre conscience de sa finitude"
  notes: |-
    **Après l'expansion vers le tout,** {amber}**l'homme revient à soi**{/amber} **et se mesure à ce qui est :** {coral}**il se découvre égaré dans un cachot, et doit apprendre à s'estimer à son juste prix.**{/coral}

    **Pourquoi « étant revenu à soi » ?** Le mouvement est {amber}circulaire{/amber} : on part de soi, on monte jusqu'aux astres, on revient. Mais l'homme ne revient pas le même : il a désormais un terme de comparaison. Il ne compare plus la terre au soleil, mais {coral}son être à la totalité de ce qui est{/coral}.

    **Pourquoi « au prix de ce qui est » ?** Après « monde », « nature » et « univers », {amber}l'être reçoit son vrai nom{/amber}, « ce qui est ». Et le « prix » est un mot de {violet}valeur{/violet} : la condition de l'homme s'oppose à la majesté de la nature {coral}comme la misère à la grandeur{/coral}.

    **Pourquoi « égaré » ?** L'égarement n'est pas d'abord la {red}déréliction religieuse{/red} : il est l'effet direct de la {amber}perte de repère{/amber} que la sphère infinie vient de produire. Le « canton détourné » est un coin à l'écart, sans rien qui le signale.

    **Pourquoi « ce petit cachot […], j'entends l'univers » ?** L'univers, immense au §1, devient une {yellow}cellule{/yellow}, et pas même la prison entière : la nature est plus vaste encore. La contemplation va du {amber}contenant{/amber} au {amber}contenu{/amber} : c'est en mesurant l'univers qu'on apprend à évaluer ce qu'il contient, la terre, les royaumes, les villes, soi-même.

    ? **Grandeurs naturelles et grandeurs d'établissement** : chez Pascal, les premières tiennent à des qualités réelles de l'âme ou du corps (la science, la force) ; les secondes à des conventions (la naissance, les dignités). Estimer {yellow}les royaumes et les villes{/yellow} à leur juste prix, c'est cesser de prendre les secondes pour les premières.

    **Pourquoi la question finale ?** {teal}« Qu'est-ce qu'un homme dans l'infini ? »{/teal} reste sans réponse ici ; le §6 la reprendra. L'homme n'est pas misérable par sa seule {red}finitude{/red}, mais parce que cette finitude est {coral}sans fixité, sans assurance{/coral}.

    ! « Juste prix » ne veut pas dire mépris : il s'agit d'{green}estimer exactement{/green}, non de {red}tout déprécier{/red}.
  passage:
    label: "§3"
    part: "2. Le retour à soi"
    text: "Que l'homme, étant revenu à soi, considère ce qu'il est au prix de ce qui est ; qu'il se regarde comme égaré dans ce canton détourné de la nature ; et que de ce petit cachot où il se trouve logé, j'entends l'univers, il apprenne à estimer la terre, les royaumes, les villes et soi-même son juste prix. Qu'est-ce qu'un homme dans l'infini ?"
