- id: pascal-les-deux-infinis-2-l4
  title: "L'infiniment petit"
  notes: ""
  passage:
    label: "§4"
    text: "Mais pour lui présenter un autre prodige aussi étonnant, qu'il recherche dans ce qu'il connaît les choses les plus délicates. Qu'un ciron lui offre dans la petitesse de son corps des parties incomparablement plus petites, des jambes avec des jointures, des veines dans ces jambes, du sang dans ces veines, des humeurs dans ce sang, des gouttes dans ces humeurs, des vapeurs dans ces gouttes ; que, divisant encore ces dernières choses, il épuise ses forces en ces conceptions, et que le dernier objet où il peut arriver soit maintenant celui de notre discours ; il pensera peut-être que c'est là l'extrême petitesse de la nature. Je veux lui faire voir là-dedans un abîme nouveau. Je lui veux peindre non seulement l'univers visible, mais l'immensité qu'on peut concevoir de la nature, dans l'enceinte de ce raccourci d'atome. Qu'il y voie une infinité d'univers, dont chacun a son firmament, ses planètes, sa terre, en la même proportion que le monde visible ; dans cette terre, des animaux, et enfin des cirons, dans lesquels il retrouvera ce que les premiers ont donné ; et trouvant encore dans les autres la même chose sans fin et sans repos, qu'il se perde dans ces merveilles, aussi étonnantes dans leur petitesse que les autres par leur étendue ; car qui n'admirera que notre corps, qui tantôt n'était pas perceptible dans l'univers, imperceptible lui-même dans le sein du tout, soit à présent un colosse, un monde, ou plutôt un tout, à l'égard du néant où l'on ne peut arriver ?"
