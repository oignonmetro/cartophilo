- id: "pascal-les-deux-infinis-2-l7"
  title: "Monde infini, connaissance limitée"
  notes: |-
    **Il ne reste à l'homme qu'à** {amber}**apercevoir quelque apparence du milieu des choses**{/amber}**, sans espoir d'en connaître le principe ni la fin :** {coral}**seul l'auteur de ces merveilles les comprend.**{/coral}

    **Pourquoi « apercevoir [quelque] apparence du milieu » ?** Chaque terme restreint le précédent : {amber}apercevoir{/amber}, non connaître ; {amber}quelque{/amber}, une part ; {amber}apparence{/amber}, au double sens d'aspect extérieur et de vraisemblance ; {amber}du milieu{/amber}, non des extrêmes. {yellow}C'est lire un livre dont on aurait arraché les premières et les dernières pages : on comprend les phrases, non ce qu'elles signifient.{/yellow}

    ? **Pyrrhonisme** : le scepticisme radical de Pyrrhon, qui suspend tout jugement. Pascal n'en professe qu'{amber}un pyrrhonisme relatif{/amber}, limité à la philosophie naturelle : quelque chose est aperçu ; nous sommes {teal}« incapables de savoir certainement et d'ignorer absolument »{/teal}.

    **Pourquoi « un désespoir éternel » ?** {amber}Désespoir{/amber} s'entend au sens étymologique, absence d'espérance : une situation sans issue plutôt qu'un affect. {amber}Éternel{/amber} : aucun progrès n'en sortira. Pascal s'oppose frontalement au projet d'une physique déduite de ses principes, celui des {sky}*Principes de la philosophie*{/sky} de {sky}Descartes{/sky}, que la suite du fragment raille, et que le fragment 78 B dit {red}« inutile et incertain »{/red}.

    **Pourquoi « sorties du néant et portées jusqu'à l'infini » ?** Le néant n'est plus la limite de la division (§4), mais {amber}le néant de la création{/amber} *ex nihilo* ; Pascal fait converger les deux sens. Les verbes sont au {violet}passif{/violet} : les choses ne vont pas d'elles-mêmes du néant à l'infini, {coral}quelque chose les y porte{/coral}, que la phrase suivante nomme.

    **Pourquoi « Qui suivra ces étonnantes démarches ? »** {amber}Suivre{/amber} est le verbe du géomètre, qui suit un raisonnement pas à pas ; il faudrait ici suivre une infinité de pas. La réponse attendue est {red}« personne »{/red}.

    **Pourquoi « L'auteur de ces merveilles les comprend » ?** {amber}Comprendre{/amber} est pris au sens strict, et seul celui qui a produit les choses le peut, {yellow}comme l'horloger connaît l'horloge qu'il a assemblée autrement que celui qui en voit tourner les aiguilles{/yellow}. « Auteur » dit à la fois le créateur et l'écrivain. Mais le texte {amber}ne prouve pas Dieu, il le nomme{/amber} : il désigne le seul terme auquel la compréhension puisse être attribuée, pour disqualifier l'homme.

    ! Pascal fait l'inverse de {sky}Descartes{/sky}, qui réservait l'infini à Dieu et appelait le monde {red}« indéfini »{/red}, proportionné à notre entendement : pour Pascal, {green}la nature est aussi incompréhensible que Dieu{/green}.
  passage:
    label: "§7"
    part: "5. Le principe et la fin"
    text: "Que fera-t-il donc, sinon d'apercevoir [quelque] apparence du milieu des choses, dans un désespoir éternel de connaître ni leur principe ni leur fin ? Toutes choses sont sorties du néant et portées jusqu'à l'infini. Qui suivra ces étonnantes démarches ? L'auteur de ces merveilles les comprend. Tout autre ne le peut faire."
