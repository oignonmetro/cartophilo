- id: "pascal-les-deux-infinis-2-l6"
  title: "La misère de l'homme face aux deux infinis"
  notes: |-
    **Le §6 répond enfin à la question du §3 :** {coral}**l'homme est un néant à l'égard de l'infini, un tout à l'égard du néant, un milieu entre rien et tout**{/coral}**, et pour cette raison** {red}**infiniment éloigné de comprendre les extrêmes**{/red}.

    **Pourquoi « l'homme dans la nature » ?** La question du §3 est reprise avec deux déplacements : {amber}« un homme » devient « l'homme »{/amber}, on passe d'un individu égaré à la condition humaine ; {amber}« l'infini » devient « la nature »{/amber}, la totalité qui contient les deux infinis.

    **Pourquoi « à l'égard de » ?** L'être de l'homme n'est défini {amber}que par comparaison{/amber}. « Un néant à l'égard de l'infini » applique le principe du fragment du pari (233 B) : {teal}« le fini s'anéantit en présence de l'infini »{/teal}. Le symétrique suit : rapporté à rien, tout être est tout.

    ? **Milieu** : chez Pascal, non un lieu de repos ou une place assignée, mais {amber}le lieu de la plus grande distance{/amber} : tout ce qui est fini est infiniment éloigné du rien comme du tout. Sur une ligne infinie des deux côtés, {yellow}tout point est au milieu, donc aucun ne l'est en particulier{/yellow}. {sky}Descartes{/sky} se disait {teal}« comme un milieu entre Dieu et le néant »{/teal} (*Méditation quatrième*), place fixe ; le milieu pascalien {red}ne peut être fixé{/red}.

    **Pourquoi « infiniment éloigné de comprendre » ?** C'est le passage décisif de {amber}la distance dans l'être à la distance dans le savoir{/amber}. Il repose sur un principe que la suite du fragment explicite : pour comprendre une chose, il faut lui être proportionné, et {coral}il faut une capacité infinie pour aller jusqu'au néant comme jusqu'au tout{/coral}.

    ? **Comprendre** : au sens strict, repris de Descartes, {amber}embrasser entièrement{/amber} une chose, et non seulement la toucher par la pensée : {yellow}on peut toucher une montagne, non l'embrasser{/yellow} (lettre à Mersenne). Savoir qu'une chose est n'est pas la comprendre : {teal}« nous connaissons qu'il y a un infini, et ignorons sa nature »{/teal} (233 B).

    **Pourquoi « la fin des choses et leur principe » ?** La phrase est en {violet}chiasme{/violet} : le principe est repris par le néant d'où l'on vient, la fin par l'infini où l'on va. {coral}Les deux infinis de grandeur deviennent l'origine et la destination des choses : la cosmologie se fait métaphysique.{/coral} Le {violet}principe{/violet} est à la fois l'élément, l'origine et ce par quoi on connaît : ne pas atteindre les derniers éléments, c'est ne pas connaître les principes de la physique ; ne pas embrasser le tout, c'est ignorer les fins. La raison en est l'être même de l'homme, {amber}ni rien ni tout{/amber}, qui fait écran aux deux extrêmes.

    **Pourquoi « invinciblement » et « également » ?** {amber}Invinciblement{/amber} : l'ignorance n'est pas contingente, {yellow}la lunette et le microscope étendent la vue d'un facteur fini{/yellow}, et l'infini reste à la même distance. {amber}Également{/amber} : le néant d'où l'on vient n'est pas plus accessible que l'infini où l'on va, contre la croyance que le §4 combattait.

    **Un vocabulaire déjà théologique.** « Le principe et la fin » est le nom que Dieu se donne dans l'{sky}*Apocalypse*{/sky} (22, 13) ; le « secret impénétrable » fait écho au {violet}Dieu caché{/violet} d'{sky}Isaïe{/sky} (45, 15).

    ! Le §6 ne contredit pas {red}le roseau pensant{/red} (348 B) : l'homme comprend qu'il est englouti, au sens de savoir, {green}non l'abîme qui l'engloutit{/green}. Sa grandeur est de se connaître misérable (397 B).
  passage:
    label: "§6"
    part: "4. L'homme entre deux abîmes"
    text: "Car enfin, qu'est-ce que l'homme dans la nature ? Un néant à l'égard de l'infini, un tout à l'égard du néant, un milieu entre rien et tout. Infiniment éloigné de comprendre les extrêmes, la fin des choses et leur principe sont pour lui invinciblement cachés dans un secret impénétrable, également incapable de voir le néant d'où il est tiré, et l'infini où il est englouti."
