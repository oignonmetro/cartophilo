    sentence: "Dans « sorties du néant et portées jusqu'à l'infini », les verbes sont au ___ : les choses ne vont pas d'elles-mêmes du néant à l'infini, quelque chose les y porte, et l'agent reste implicite jusqu'à la phrase suivante (« l'auteur de ces merveilles »). La suite du fragment dira que ces extrémités « se retrouvent en Dieu, et en Dieu seulement »."
