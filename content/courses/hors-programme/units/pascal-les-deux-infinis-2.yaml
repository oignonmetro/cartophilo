    alt: []
  - id: pascal-les-deux-infinis-2-l6-p32
    sentence: "L'adverbe « invinciblement » signifie que l'ignorance du principe et de la fin n'est pas contingente. Ce n'est pas un manque d'___ que le progrès comblera, car la lunette et le microscope étendent la vue d'un facteur fini, et l'infini reste à la même distance. L'adverbe « également », lui, corrige la croyance que le §4 combattait : le néant d'où l'on vient n'est pas plus accessible que l'infini où l'on va."
    answer: "instruments"
    alt: []
  - id: pascal-les-deux-infinis-2-l6-p33
    sentence: "On serait tenté de croire que le §6 contredit le fragment 348 B : « par l'espace l'univers me comprend et m'engloutit comme un point, par la pensée je le comprends ». Mais « comprendre » y joue sur deux sens : l'univers comprend l'homme au sens spatial (il le contient), et l'homme comprend l'univers au sens d'intelligere, en sachant qu'il en est contenu, non au sens de comprehendere. La pensée comprend le fait d'être ___, elle ne comprend pas l'abîme qui l'engloutit."
    answer: "englouti"
    alt: []
  - id: pascal-les-deux-infinis-2-l6-p34
    sentence: "Le §6 et le roseau pensant s'accordent donc, comme l'énonce le fragment 397 B : « la grandeur de l'homme est grande en ce qu'il se connaît ___ ». La grandeur de la pensée tient à ce qu'elle connaît sa disproportion, non à ce qu'elle la surmonte."
    answer: "misérable"
