    sentence: "Réduire la connaissance à l'apparence du milieu, ce n'est pas professer le pyrrhonisme absolu, puisque quelque chose est aperçu ; c'est un pyrrhonisme relatif, limité à la philosophie naturelle. La suite du fragment le formule : « Voilà notre état véritable. C'est ce qui __nous rend incapables de savoir certainement et d'ignorer__ ___. »"
