    sentence: "Chez Pascal, le monde cesse d'être un chemin de la raison vers Dieu : connaître la nature supposerait de connaître son principe et sa fin, c'est-à-dire Dieu. Or l'apologie annonce que « nous ne connaissons Dieu que par ___ » (547 B), qu'elle nomme « l'objet de tout, et le centre où tout tend » (556 B)."
