  - id: pascal-les-deux-infinis-2-l6-p21
    sentence: "Dans la Méditation ___, consacrée à l'erreur, Descartes écrit : « je suis comme un milieu entre Dieu et le néant ». Le milieu pascalien « entre rien et tout » n'est en revanche ni un lieu de repos ni une place assignée : c'est le lieu de la plus grande distance, puisque tout ce qui est fini est infiniment éloigné du rien comme du tout."
    answer: "quatrième"
    alt: []
  - id: pascal-les-deux-infinis-2-l6-p22
    sentence: "Le milieu pascalien reprend ce que De l'esprit géométrique dit de toute grandeur, « toujours infiniment éloignée de ces extrêmes ». Ce milieu ne peut donc être ni ___ ni situé : sur une ligne infinie des deux côtés, tout point est au milieu, donc aucun ne l'est en particulier, comme dans la sphère du §2 dont le centre est partout."
    answer: "fixé"
    alt: []
  - id: pascal-les-deux-infinis-2-l6-p23
    sentence: "La formule « Infiniment éloigné de comprendre les extrêmes » opère le passage décisif de la distance dans l'être à la distance dans le ___. Ce passage de l'être au savoir repose sur un principe que la suite du fragment explicite : « il ne faut pas moins de capacité pour aller jusqu'au néant que jusqu'au tout. Il la faut infinie pour l'un et l'autre. » Pour comprendre une chose, il faut être proportionné à elle."
    answer: "savoir"
    alt: []
  - id: pascal-les-deux-infinis-2-l6-p24
    sentence: "Au sens strict que Pascal reprend à Descartes, « comprendre », c'est embrasser entièrement une chose. Descartes l'oppose au simple savoir par une image : « nous pouvons bien toucher avec les mains une montagne, mais non pas l'___ » ; car « comprendre, c'est embrasser de la pensée ; mais pour savoir une chose, il suffit de la toucher de la pensée » (lettre à Mersenne)."
    answer: "embrasser"
    alt: []
  - id: pascal-les-deux-infinis-2-l6-p25
    sentence: "Pascal formule dans le fragment du pari la distinction entre savoir qu'une chose est et la comprendre : « nous connaissons qu'il y a un infini, et ___ ». Au §6, l'homme peut donc savoir qu'il y a deux extrêmes, mais il reste « infiniment éloigné » de les comprendre."
    answer: "ignorons sa nature"
    alt: []
  - id: pascal-les-deux-infinis-2-l6-p26
    sentence: "Dans « La fin des choses et leur principe [...] également incapable de voir le néant d'où il est tiré, et l'infini où il est englouti », la phrase est construite en ___, « fin » et « principe » étant repris dans l'ordre inverse par le néant d'où l'on vient (le principe) et l'infini où l'on va (la fin). Les deux infinis de grandeur deviennent ainsi l'origine et la destination des choses : la cosmologie se fait métaphysique."
    answer: "chiasme"
    alt: []
  - id: pascal-les-deux-infinis-2-l6-p27
    sentence: "Le « principe » d'une chose est à la fois ce dont elle est faite (ses éléments), ce d'où elle vient (son origine) et ce à partir de quoi on la connaît. Cette équivoque est le pivot du §6 : si l'on ne peut atteindre les derniers éléments, on ne peut connaître les principes de la ___ ; si l'on ne peut embrasser le tout, on ne peut connaître les fins."
    answer: "physique"
    alt: []
  - id: pascal-les-deux-infinis-2-l6-p28
    sentence: "La suite du fragment donne la raison de la double ignorance : « ce que nous avons d'être nous dérobe la connaissance des premiers principes qui naissent du néant, et le peu que nous avons d'être nous cache la vue de l'___ ». C'est donc l'être même de l'homme, ni rien ni tout, qui fait écran aux deux extrêmes."
    answer: "infini"
    alt: []
  - id: pascal-les-deux-infinis-2-l6-p29
    sentence: "Le vocabulaire du §6 est déjà théologique. « Le principe et la fin » est le nom que Dieu se donne dans l'Apocalypse (22, 13), et le « secret impénétrable » fait écho au Dieu ___ d'Isaïe (45, 15), thème central de l'apologie pascalienne."
    answer: "caché"
    alt: []
  - id: pascal-les-deux-infinis-2-l6-p30
