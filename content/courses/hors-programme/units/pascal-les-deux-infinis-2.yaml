- id: "pascal-les-deux-infinis-2-l1"
  title: "Prendre conscience de l'infiniment grand"
  notes: |-
    **Pascal ouvre le fragment par une injonction à** {violet}**contempler**{/violet} **:** {coral}**l'homme doit lever les yeux de son entourage vers la nature entière, pour mesurer la distance qui l'en sépare.**{/coral}

    ? **Contemplation** : dans la philosophie antique et le christianisme, le regard de l'âme qui s'élève jusqu'à Dieu et s'y repose. Pascal en {red}subvertit{/red} le sens : son objet n'est ni Dieu ni les créatures, mais {amber}l'infinité de la nature{/amber}, et son but n'est pas le repos mais la découverte d'une {violet}disproportion{/violet}.

    **Pourquoi « donc » ?** Le mot suppose ce qui précède dans le projet de l'apologie : l'homme qui se croit capable de connaître doit commencer par regarder ce qu'il prétend connaître. Le premier temps est un mouvement d'{amber}expansion{/amber} du moi vers le tout, avant le retour à soi du §3.

    **Pourquoi « haute et pleine majesté » ?** L'expression a {amber}un double sens{/amber} : l'étendue et l'excellence, l'immensité et la gloire. Elle fait de la nature une souveraine, en face de laquelle les {teal}« objets bas »{/teal} qui environnent l'homme sont bas au sens {yellow}géographique{/yellow} (ils sont à terre) et au sens {red}moral{/red} (ils sont vils). À la différence de {sky}Descartes{/sky}, ce qui est près de nous ne s'oppose pas à la nature comme le trompeur à la vérité, {coral}mais comme la misère à la majesté{/coral}.

    **Pourquoi le soleil, « lampe éternelle » ?** L'image reprend la {sky}*Genèse*{/sky}, où Dieu crée le soleil pour présider au jour, et dit la {amber}gloire, l'éclat et la permanence{/amber} du cosmos. Mais Pascal n'en tire {red}aucune preuve de Dieu{/red} par l'ordre du monde : la première phrase n'est pas la prémisse d'une preuve physico-théologique.

    **Pourquoi le changement d'échelle ?** Le regard procède par {amber}relativité des grandeurs{/amber} : {yellow}la terre n'est qu'un point au prix de l'orbite du soleil, et cette orbite n'est qu'une pointe à l'égard de celle des astres{/yellow}. Chaque grandeur devient petite dès qu'on la rapporte à une plus grande, comme l'atome des épicuriens. Ce mouvement doit produire l'{violet}étonnement{/violet}, au sens fort du XVIIe siècle.

    ? **Étonnement** : au XVIIe siècle, le mot dérive de « tonnerre » et désigne un {amber}choc qui ébranle l'âme{/amber}, non la simple surprise ; il diffère du `thaumazein` grec, l'étonnement qui ouvre la philosophie selon Socrate. La description du ciel relève ainsi moins d'une poétique de la surprise que d'{coral}une rhétorique de l'effroi{/coral}.

    ! Le regard vers le haut ne mène pas {red}à Dieu{/red} : il mène à {green}la disproportion de l'homme{/green}.
  passage:
    label: "§1"
    part: "1. L'infiniment grand"
    text: "Que l'homme contemple donc la nature entière dans sa haute et pleine majesté, qu'il éloigne sa vue des objets bas qui l'environnent. Qu'il regarde cette éclatante lumière, mise comme une lampe éternelle pour éclairer l'univers, que la terre lui paraisse comme un point au prix du vaste tour que cet astre décrit et qu'il s'étonne de ce que ce vaste tour lui-même n'est qu'une pointe très délicate à l'égard de celui que les astres qui roulent dans le firmament embrassent."
