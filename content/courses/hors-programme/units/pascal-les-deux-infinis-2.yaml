- id: "pascal-les-deux-infinis-2-l4c"
  title: "Une infinité d'univers emboîtés"
  notes: |-
    **Dans l'atome, l'homme doit voir** {coral}**une infinité d'univers semblables au nôtre, contenant des cirons qui en contiennent d'autres, sans fin**{/coral}**, et se perdre dans ces merveilles aussi étonnantes que celles du grand.**

    **Pourquoi « en la même proportion que le monde visible » ?** C'est une {violet}similitude{/violet} géométrique : la même figure reproduite à une autre échelle. Pascal proposait déjà, dans {sky}*De l'esprit géométrique*{/sky}, de regarder le firmament à travers un petit verre. Conséquence : si la nature est semblable à elle-même à toutes les échelles, {coral}aucune échelle n'est privilégiée, et l'échelle humaine n'a aucun titre à servir de mesure{/coral}.

    **Pourquoi « sans fin et sans repos » ?** La répétition ne s'arrête jamais : {yellow}des cirons dans une terre, dans un univers, dans un atome d'un ciron{/yellow}. Ce que la sphère « dont le centre est partout » disait de l'espace (§2), les mondes emboîtés le disent de la grandeur : {coral}toute grandeur est un milieu, aucune n'est un centre{/coral}. Le §6 en tirera la définition de l'homme.

    **Pourquoi « qu'il se perde » ?** Le verbe reprend le §2. {amber}La perte n'est pas un accident du parcours, c'est son but{/amber} : l'apologie ne cherche pas à faire connaître l'infini, mais à faire éprouver qu'on ne le peut pas.

    **Est-ce une hypothèse physique ?** Non. Le texte parle au subjonctif (« qu'il y voie ») et de l'immensité « qu'on peut concevoir » : c'est une {violet}expérience de pensée{/violet}, tirée de la divisibilité de l'étendue. Elle n'a pas besoin d'être vraie : {coral}il suffit que rien dans nos concepts ne permette de l'exclure{/coral} pour que rien ne permette de fixer le plus petit.

    ! Pascal n'affirme pas qu'il y a {red}réellement{/red} des mondes dans les atomes : il montre que {green}nous ne pouvons pas l'exclure{/green}.
  passage:
    label: "§4"
    part: "3. L'infiniment petit"
    text: "Qu'il y voie une infinité d'univers, dont chacun a son firmament, ses planètes, sa terre, en la même proportion que le monde visible ; dans cette terre, des animaux, et enfin des cirons, dans lesquels il retrouvera ce que les premiers ont donné ; et trouvant encore dans les autres la même chose sans fin et sans repos, qu'il se perde dans ces merveilles, aussi étonnantes dans leur petitesse que les autres par leur étendue ;"
  points:
