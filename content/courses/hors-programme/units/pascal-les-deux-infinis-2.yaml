- id: "pascal-les-deux-infinis-2-l2"
  title: "Les limites de l'imagination face à l'infiniment grand"
  notes: |-
    **Où la vue s'arrête,** {violet}**l'imagination**{/violet} **prend le relais, mais elle** {coral}**se lasse avant que la nature cesse de fournir**{/coral} **: l'univers visible n'est qu'un trait dans une nature qu'aucune idée n'atteint.**

    ? **Imagination** : la faculté de se représenter des images, à partir de ce que les sens ont fourni. Elle est {amber}reproductrice{/amber} : elle ne peut que recomposer et agrandir ce qu'elle a vu, en ajoutant des espaces à des espaces.

    **Pourquoi « elle se lassera plutôt de concevoir, que la nature de fournir » ?** L'imagination procède par {yellow}sommation : un espace, puis un autre, puis un autre{/yellow}. Elle ne peut donc jamais épuiser une étendue infinie, et c'est elle qui s'arrête, {red}non la nature{/red}. Quels que soient ses efforts, l'homme reste incapable d'{amber}embrasser{/amber} l'infini.

    ? **Monde et nature** : chez Pascal, le {violet}monde{/violet} est l'ensemble des phénomènes visibles ; la {violet}nature{/violet} est la totalité de ce qui est, la Création. D'où {teal}« tout ce monde visible n'est qu'un trait imperceptible dans l'ample sein de la nature »{/teal}.

    **Pourquoi « nous n'enfantons que des atomes » ?** Nos conceptions les plus enflées restent {red}des riens{/red} au prix de la réalité. Pascal prend le contre-pied de {sky}Descartes{/sky} : nous pouvons {amber}savoir qu'il y a un infini{/amber} (*intelligere infinitum*), non {red}le comprendre{/red} (*non comprehendere infinitum*). Cela ruine le projet d'une {red}cosmologie rationnelle{/red} : la philosophie naturelle est incertaine.

    **La démesure.** La disproportion n'est pas seulement celle de notre idée de la nature à la nature réelle ; c'est aussi celle de l'{violet}orgueil savant{/violet}, la *libido sciendi*, qui prétend {red}atteindre ce qui est sans mesure{/red}. La vraie démesure est cette prétention.

    ! Pascal ne dit pas que la nature est {red}inconnaissable en tout{/red} : il dit que l'homme sait qu'elle est infinie {green}sans pouvoir l'embrasser{/green}.
  passage:
    label: "§2"
    part: "1. L'infiniment grand"
    text: "Mais si notre vue s'arrête là, que l'imagination passe outre ; elle se lassera plutôt de concevoir, que la nature de fournir. Tout ce monde visible n'est qu'un trait imperceptible dans l'ample sein de la nature. Nulle idée n'en approche. Nous avons beau enfler nos conceptions au-delà des espaces imaginables, nous n'enfantons que des atomes, au prix de la réalité des choses."
