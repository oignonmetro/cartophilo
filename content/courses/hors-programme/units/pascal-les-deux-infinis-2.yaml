  - id: pascal-les-deux-infinis-2-l7-p22
    sentence: "Dans « Toutes choses sont sorties du néant et portées jusqu'à l'infini », le « néant » n'est plus, comme au §4, la limite quantitative jamais atteinte de la division, mais le néant ___ de la création ex nihilo. Pascal fait converger les deux sens : on ne peut pas plus atteindre le rien par la division que le rien d'avant la création par la remontée des causes."
    answer: "ontologique"
    alt: []
