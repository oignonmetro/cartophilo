- id: "pascal-les-deux-infinis-2-l4b"
  title: "Un abîme nouveau dans un raccourci d'atome"
  notes: |-
    **Là où l'homme croyait toucher le fond, Pascal ouvre** {coral}**« un abîme nouveau »**{/coral} **: il va lui peindre, dans le plus petit atome, l'immensité de la nature entière.**

    ? **Abîme** : un gouffre sans fond. Le mot dit l'infini sous l'aspect de ce qui {amber}engloutit{/amber}, et il reviendra au §5 pour les deux infinis.

    **Pourquoi « Je veux » ?** Aux subjonctifs d'injonction (« qu'il recherche », « qu'il pense ») succède le {amber}« je » de l'apologiste{/amber}, qui se fait peintre. Il recourt donc à l'imagination même dont le §2 a montré l'impuissance. {coral}Il n'y a pas de contradiction{/coral} : l'imagination n'est pas chargée de représenter l'infini, mais d'en éprouver de l'intérieur l'{amber}inadéquation{/amber}. L'imagination vaincue devient l'instrument de sa propre défaite.

    **Pourquoi « non seulement l'univers visible, mais l'immensité qu'on peut concevoir » ?** Le petit va contenir non seulement {yellow}ce qu'on voit au-dessus de soi{/yellow}, mais tout ce que le §2 faisait concevoir au-delà : le petit recueille le grand tout entier.

    **Pourquoi « ce raccourci d'atome » ?** Un {violet}raccourci{/violet} est un abrégé, une réduction à l'échelle, {yellow}comme une maquette qui contient toute une ville sur une table{/yellow}. Au §2, « nous n'enfantons que des atomes » faisait de l'atome la figure de la nullité ; ici il devient {coral}l'enceinte de la totalité{/coral}. Le mot ne désigne donc aucune chose en soi, mais {amber}une position relative à notre regard{/amber}.

    ! L'« atome » n'est pas ici la particule {red}insécable{/red} des épicuriens : c'est {green}le plus petit pour nous{/green}, qui contient encore tout.
  passage:
    label: "§4"
    part: "3. L'infiniment petit"
    text: "Je veux lui faire voir là-dedans un abîme nouveau. Je lui veux peindre non seulement l'univers visible, mais l'immensité qu'on peut concevoir de la nature, dans l'enceinte de ce raccourci d'atome."
