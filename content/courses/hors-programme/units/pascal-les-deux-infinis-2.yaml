  - id: pascal-les-deux-infinis-2-l7-p29
    sentence: "L'homme n'est qu'un milieu entre rien et tout ; mais l'apologie laisse attendre un autre milieu, qui serait ___ et non plus seulement intermédiaire, puisque ceux qui cherchent Dieu hors de Jésus-Christ, et qui s'arrêtent dans la nature, « arrivent à se former un moyen de connaître Dieu et de le servir sans médiateur » (556 B), et tombent ainsi dans l'athéisme ou le déisme."
    answer: "médiateur"
    alt: []
  - id: pascal-les-deux-infinis-2-l7-p30
    sentence: "Bilan des §4 à §7 : le petit est un abîme égal au grand, l'effroi se retourne vers le moi, l'homme est un milieu infiniment éloigné des extrêmes, et la compréhension revient au seul créateur. Dans l'infini, l'homme n'est rien qu'on puisse mesurer, et c'est pour cette raison qu'il ne peut rien ___ jusqu'au bout."
    answer: "mesurer"
