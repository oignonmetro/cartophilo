    answer: "cellule"
    alt: []
  - id: pascal-les-deux-infinis-l3-p30
    sentence: "La contemplation va du contenant vers le contenu : c'est en prenant la mesure de l'univers (le contenant) que l'homme apprend à évaluer lucidement ce qui l'environne (le ___)."
    answer: "contenu"
    alt: []
  - id: pascal-les-deux-infinis-l3-p31
    sentence: "L'apprentissage de l'estimation implique de distinguer les grandeurs naturelles, fondées sur des qualités effectives de l'âme et du corps, des grandeurs d'___, fondées sur des conventions socio-culturelles."
    answer: "établissement"
    alt: []
  - id: pascal-les-deux-infinis-l3-p32
    sentence: "Pour Pascal, l'homme n'est pas misérable en raison de sa seule finitude, mais parce que cette finitude est sans ___, sans assurance."
    answer: "fixité"
