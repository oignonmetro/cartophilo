- id: pascal-les-deux-infinis-l2
  title: "Les limites de l'imagination face à l'infiniment grand"
  notes: ""
  passage:
    label: "§2"
    text: "Mais si notre vue s'arrête là, que l'imagination passe outre ; elle se lassera plutôt de concevoir, que la nature de fournir. Tout ce monde visible n'est qu'un trait imperceptible dans l'ample sein de la nature. Nulle idée n'en approche. Nous avons beau enfler nos conceptions au-delà des espaces imaginables, nous n'enfantons que des atomes, au prix de la réalité des choses. C'est une sphère dont le centre est partout, la circonférence nulle part. Enfin, c'est le plus grand caractère sensible de la toute puissance de Dieu, que notre imagination se perde dans cette pensée."
