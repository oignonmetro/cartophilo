- id: ea2-l7
  title: "La beauté est-elle objective ?"
  notes: |
    Bien que Kant qualifie le jugement de goût de {teal}« {/teal}subjectivement {teal}fondé »{/teal}, certains commentateurs y voient malgré tout une forme d'{amber}__objectivité__{/amber}.

    - {sky}Ameriks{/sky} soutient que les jugements de beauté sont {amber}objectifs{/amber} au même sens où le sont {yellow}les jugements de couleur et des autres qualités secondes{/yellow}.
    - {sky}Ginsborg{/sky} conteste cette lecture et défend la {amber}subjectivité du goût{/amber} : {coral}Kant interdit de juger de la beauté par ouï-dire{/coral}, il faut, dit-il, {teal}« {/teal}soumettre l'objet à ses {teal}propres __yeux__ »{/teal} (§8).
    - {sky}Makkai{/sky} reprend et développe ensuite la défense de l'{amber}objectivité{/amber}, après la réplique d'{sky}Ameriks{/sky} à {sky}Ginsborg{/sky}.

    Cette question est liée à deux autres : celle de savoir s'il peut exister des {violet}**jugements de goût __erronés__**{/violet} (donc faux), et celle de l'« {violet}**autonomie du goût**{/violet} », soit {amber}l'indépendance supposée de nos jugements de goût à l'égard du témoignage et du jugement des experts{/amber}.

    Kant ne se dissimule pas qu'on peut se tromper en jugeant : dans le jugement sur le beau, {teal}« {/teal}on {teal}subsume sous un rapport{/teal} qui ne peut être que {teal}senti »{/teal}, et {teal}« {/teal}il est facile qu'une telle {teal}subsomption soit inexacte »{/teal}. Mais {coral}l'erreur d'application ne met pas en cause la légitimité du principe{/coral} (§38, remarque).
  points:
  - id: ea2-l7-p1
    sentence: "Contre l'insistance de Kant sur le caractère « subjectivement fondé » du jugement de goût, ___ soutient que les jugements de beauté sont malgré tout objectifs, au même sens où le sont les jugements de couleur et des autres qualités secondes."
