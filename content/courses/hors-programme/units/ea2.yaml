- id: ea2-l5
  title: "L'intentionnalité du plaisir"
  notes: |
    Le plaisir pris au beau a-t-il un {violet}**contenu intentionnel**{/violet}, c'est-à-dire {amber}est-il dirigé vers quelque chose{/amber} ? {sky}Guyer{/sky} répond par la négative : le plaisir serait « {red}__opaque__{/red} », et sa relation au libre jeu {red}**purement causale**{/red}. On peut certes reconnaître après coup que son plaisir tient au libre jeu, mais seulement par un raisonnement d'{amber}__élimination__{/amber} portant sur l'histoire causale du plaisir (il n'était {yellow}ni sensoriel ni lié à la satisfaction d'un désir{/yellow}), {pink}non parce que le plaisir en rendrait immédiatement conscient{/pink}.

    Plusieurs commentateurs défendent au contraire {green}**l'intentionnalité du plaisir**{/green}, mais en la dirigeant vers des cibles différentes :
    - {sky}Aquila{/sky} : vers {amber}l'objet, ou sa structure formelle{/amber}.
    - {sky}Allison{/sky} : vers {amber}le libre jeu lui-même{/amber}.
    - {sky}Hughes{/sky} : à la fois vers {amber}l'objet et vers l'activité des facultés{/amber}.
    - {sky}Zuckert{/sky} : élargit le débat en soutenant que {coral}__tout__ plaisir{/coral}, non seulement celui pris au beau, est intentionnel, en ce qu'{coral}il rend conscient du désir de prolonger l'état mental où l'on se trouve{/coral}.
    - {sky}Cvejić{/sky} : rejoint Zuckert, mais soutient que cette intentionnalité est {coral}d'un genre distinctif, propre aux seuls sentiments{/coral}.
    - {sky}A. Cohen{/sky} : soutient elle aussi l'intentionnalité du plaisir, mais {red}nie qu'elle soit intrinsèque{/red} : elle la fait dériver de {coral}l'interprétation réflexive que le sujet donne de ses propres sentiments{/coral}.
  points:
  - id: ea2-l5-p1
    sentence: "___ soutient que le plaisir pris au beau est « opaque », c'est-à-dire dépourvu de contenu intentionnel : la relation entre le libre jeu et le plaisir serait purement causale."
    answer: "Guyer"
    alt: []
    explanation: "Guyer 1979."
  - id: ea2-l5-p2
    sentence: "Sur la lecture de Guyer, on peut certes reconnaître après coup que son plaisir tient au libre jeu des facultés, mais seulement par un raisonnement d'___ portant sur l'histoire causale du plaisir, non parce que le plaisir en rendrait immédiatement conscient."
    answer: "élimination"
    alt: []
  - id: ea2-l5-p3
    sentence: "Contre l'opacité du plaisir défendue par Guyer, ___ soutient que le plaisir est intentionnellement dirigé vers l'objet, ou vers sa structure formelle."
