  - id: ea2-l1b-p13
    sentence: "Selon Sherringham, le goût se présente à la fois comme s'il était objectif et comme s'il était subjectif : une double ___ symétrique."
    answer: "simulation"
    alt: []

- id: ea2-l2
  title: "Le dilemme de la déduction et ses réponses"
  notes: |
    L'argument de la déduction rencontre une objection sévère, formulée comme un {red}__dilemme__{/red} : le libre jeu de l'imagination et de l'entendement est-il {amber}**impliqué dans toute expérience perceptive cognitive**{/amber}, ou non ?

    - S'il l'est, alors {red}tout objet devrait, contre toute évidence, être perçu comme beau{/red} : c'est ce que les commentateurs appellent le problème du {violet}**« tout est beau »**{/violet}.
    - S'il ne l'est pas, {red}l'inférence centrale de la déduction ne tient plus{/red} : du fait que je peux exiger l'assentiment de tous pour l'état de mes facultés {yellow}en percevant un objet comme vert ou carré{/yellow}, il ne s'ensuit pas que je puisse exiger ce même assentiment pour un état où mes facultés sont en libre jeu.

    La plupart des défenseurs de l'argument saisissent la {amber}seconde corne{/amber} : {sky}Ameriks{/sky} défend une lecture des jugements de goût comme {green}**objectifs**{/green} ; {sky}Allison{/sky} soutient que la déduction vise seulement à établir que de telles prétentions {green}**peuvent, en général, être légitimes**{/green}, {pink}non à garantir l'assentiment pour chaque jugement particulier{/pink}, une lecture jugée insuffisante par {sky}Savile{/sky} et {sky}Chignell{/sky}.

    Une minorité saisit au contraire la {amber}première corne{/amber} : {sky}Gracyk{/sky} soutient que {green}**tout objet peut**, sur les principes mêmes de Kant, être légitimement trouvé beau{/green} ; {sky}Ginsborg{/sky} et {sky}Breitenbach{/sky} soulignent que {coral}rien, dans un jugement non objectif, ne pourrait de toute façon exclure un objet d'être ainsi jugé beau{/coral}.

    D'autres ({sky}Meerbote{/sky}) jugent {red}le dilemme fatal à la prétention de Kant{/red}. Certains cherchent alors à la sauver par des considérations extérieures à l'argument officiel : {amber}l'appel à notre nature d'êtres moraux{/amber}, ou {amber}l'appel à la théorie kantienne des idées esthétiques{/amber} : la version de {sky}Chignell{/sky} se distinguant de celle de {sky}Savile{/sky} en ce qu'elle se passe de tout appel moral. Enfin, {sky}Rind{/sky} et {sky}Kalar{/sky} jugent que la version de l'argument donnée au {sky}paragraphe 21{/sky}, qui fait appel au sens commun, {green}échappe mieux au dilemme{/green} que celle du {sky}paragraphe 38{/sky}.
  points:
  - id: ea2-l2-p1
    sentence: "L'objection la plus sérieuse à l'argument de la déduction prend la forme d'un ___ : le libre jeu des facultés est-il impliqué dans toute expérience perceptive cognitive, ou non ?"
    answer: "dilemme"
    alt: []
  - id: ea2-l2-p2
    sentence: "Si le libre jeu est impliqué dans toute expérience cognitive, il s'ensuit, contre toute évidence, que tout objet devrait être perçu comme beau : une conséquence que les commentateurs résument par l'expression « le problème du ___ »."
    answer: "tout est beau"
    alt: []
  - id: ea2-l2-p3
    sentence: "Face au dilemme qui demande si le libre jeu des facultés est impliqué ou non dans toute expérience perceptive cognitive, ___ défend l'argument de la déduction en soutenant que les jugements de goût sont en réalité objectifs, apparentés en cela aux jugements cognitifs : une façon de saisir la seconde corne, celle qui nie cette implication."
    answer: "Ameriks"
    alt: []
    explanation: "Ameriks 1982."
  - id: ea2-l2-p4
    sentence: "Face au dilemme qui demande si le libre jeu des facultés est impliqué ou non dans toute expérience perceptive cognitive, ___ défend une autre réponse à la seconde corne, celle qui nie cette implication, en soutenant que la déduction vise seulement à établir que la prétention à l'assentiment universel peut, en général, être légitime, non à garantir cet assentiment pour chaque jugement particulier."
    answer: "Allison"
    alt: []
    explanation: "Allison 2001, ch. 8."
  - id: ea2-l2-p5
    sentence: "La réponse d'Allison, qui limite la portée de la déduction à une légitimité en général plutôt qu'à chaque jugement particulier, est jugée insuffisante par ___ et Chignell, pour qui la déduction doit garantir un droit à l'assentiment dans chaque cas particulier."
    answer: "Savile"
    alt: []
  - id: ea2-l2-p6
    sentence: "À l'inverse de la plupart des commentateurs, ___ soutient que Kant saisit bien la première corne du dilemme, et que tout objet peut, sur ses propres principes, être légitimement jugé beau."
    answer: "Gracyk"
    alt: []
    explanation: "Gracyk 1986."
  - id: ea2-l2-p7
    sentence: "Puisque, sur la lecture qui saisit ainsi la première corne du dilemme, un jugement de beauté n'est pas ___, aucun trait de l'objet ne peut l'exclure d'être légitimement trouvé beau : un point souligné en particulier par Ginsborg et Breitenbach."
    answer: "objectif"
    alt: []
    explanation: "Ginsborg 2017 ; Breitenbach 2021."
  - id: ea2-l2-p8
    sentence: "___ tient le dilemme, ou des considérations proches, pour fatal à la prétention de Kant selon laquelle le jugement de beauté revendique légitimement une validité universelle."
    answer: "Meerbote"
    alt: []
    explanation: "Meerbote 1982 ; Guyer 1979 offre ailleurs une évaluation plus positive."
  - id: ea2-l2-p9
    sentence: "Face au dilemme de la déduction, certains commentateurs cherchent à sauver la légitimité du jugement de beauté par des considérations extérieures à l'argument officiel : les uns en invoquant notre nature d'êtres moraux, les autres la théorie kantienne des idées ___."
    answer: "esthétiques"
    alt: []
  - id: ea2-l2-p10
    sentence: "Kemal, Savile, Crawford et Elliott défendent une réponse au dilemme de la déduction fondée sur la moralité : elle fait de notre nature d'êtres ___ le fondement ultime de la légitimité du jugement de beauté."
    answer: "moraux"
    alt: []
  - id: ea2-l2-p11
    sentence: "Une autre stratégie de défense face au dilemme de la déduction s'appuie sur la théorie kantienne des idées esthétiques ; à la différence de Savile, qui la combine avec un appel à la moralité, ___ défend cette même stratégie sans aucun appel moral."
    answer: "Chignell"
    alt: []
  - id: ea2-l2-p12
    sentence: "Rind et Kalar jugent que la version de l'argument donnée au paragraphe 21, qui fait appel au sens commun, échappe mieux au dilemme que la déduction officielle du paragraphe ___."
    answer: "38"
    alt: []
    explanation: "Rind 2002 ; Kalar 2006, ch. 5."

- id: ea2-l3
  title: "Plaisir et jugement : un ou deux actes ?"
  notes: |
    Une question centrale porte sur la relation entre {amber}le plaisir pris à un objet beau{/amber} et {amber}le jugement selon lequel il est beau{/amber}. L'idée naturelle serait {pink}qu'on ressent d'abord du plaisir, puis qu'on en tire un jugement{/pink}. Mais au {sky}paragraphe 9{/sky} (que Kant présente lui-même comme la __clé__ de toute la critique du goût), il affirme au contraire que le {teal}**« jugement**{/teal} **esthétique** {teal}**purement subjectif de l'objet »**{/teal} {green}__précède__ le plaisir et en est le fondement{/green}.

    Deux grandes familles de lectures tentent d'expliquer ce renversement :

    - la lecture en {amber}**deux actes**{/amber}, défendue par {sky}Guyer{/sky} : {amber}un premier acte{/amber}, identifié au libre jeu des facultés, produit le plaisir ; {amber}un second acte{/amber}, de réflexion sur ce plaisir, aboutit à la prétention à sa communicabilité universelle.
    - la lecture en {amber}**un seul acte**{/amber}, défendue par {sky}Ginsborg{/sky} : juger qu'un objet est beau serait {coral}**un unique acte, auto-référentiel**{/coral}, qui revendique sa propre validité universelle et se manifeste phénoménologiquement comme un sentiment de plaisir : le plaisir n'est alors « consécutif » au jugement {green}qu'au sens où on l'éprouve en vertu de lui{/green}, {red}non parce qu'il le précéderait{/red}.

    D'autres commentateurs proposent des {violet}**modèles hybrides**{/violet} : {sky}Longuenesse{/sky} reprend l'idée d'un plaisir consistant en la conscience de la communicabilité universelle de l'état d'esprit du sujet, mais y ajoute {coral}un second plaisir, antérieur, suscité par le libre jeu{/coral} : deux plaisirs plutôt qu'un. {sky}Sethi{/sky} va plus loin en {red}niant que ce sentiment antérieur soit lui-même un plaisir{/red}.

    *Pour distinguer {sky}Guyer{/sky} et {sky}Ginsborg{/sky} avec un exemple : sur la lecture en deux actes, on ressent d'abord ({amber}acte 1{/amber}) un plaisir provoqué par le libre jeu, puis ({amber}acte 2{/amber}) on réfléchit sur ce plaisir pour en revendiquer la communicabilité. Sur la lecture en un acte, {coral}il n'y a jamais deux moments distincts{/coral} : ressentir le plaisir et revendiquer sa validité universelle ne sont qu'une seule et même opération.*
  points:
  - id: ea2-l3-p1
    sentence: "Kant affirme, au paragraphe 9, que le « jugement esthétique purement subjectif de l'objet » ___ le plaisir et en est le fondement, plutôt que d'en être précédé, contredisant ainsi l'idée naturelle selon laquelle on ressent d'abord le plaisir puis on juge."
    answer: "précède"
    alt: []
  - id: ea2-l3-p2
    sentence: "Kant présente lui-même cette question (savoir si, dans un jugement de goût, le sentiment de plaisir précède le jugement de l'objet ou si le jugement précède le plaisir) comme la ___ de la critique du goût, méritant toute l'attention."
    answer: "clé"
    alt: []
    explanation: "§9, Ak. 5:216."
  - id: ea2-l3-p2b
    sentence: "L'affirmation de Kant selon laquelle le « jugement esthétique purement subjectif de l'objet » précède le plaisir et en est le fondement, qu'il présente lui-même comme la clé de toute la critique du goût, se trouve en ___."
    answer: "§9"
