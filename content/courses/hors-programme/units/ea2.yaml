- id: ea2-l9
  title: "Qu'est-ce que le sens commun ?"
  notes: |
    Au {sky}paragraphe 20{/sky}, Kant définit le {violet}sens commun{/violet} ({blue}*sensus communis*{/blue}) comme {amber}un principe subjectif qui détermine uniquement par le __sentiment__, non par des concepts{/amber}. Au {sky}paragraphe 21{/sky}, il va plus loin en soutenant qu'{coral}il faut le supposer comme condition de la communicabilité universelle de la __connaissance__ elle-même{/coral}.

    Ce passage pose une {red}difficulté{/red} : si le sens commun du paragraphe 20 juge par le {amber}sentiment{/amber} de plaisir, {red}il semble peu plausible qu'il conditionne aussi la communicabilité des jugements cognitifs{/red}, puisqu'{coral}il ne faut pas éprouver de plaisir pour savoir qu'un jugement cognitif devrait être partagé par tous{/coral}. {sky}Allison{/sky} propose alors de {green}**distinguer deux espèces de sens commun**{/green} : l'un pour la {amber}beauté{/amber}, l'autre pour la {amber}connaissance{/amber}.

    Deux autres questions se posent : le {violet}**statut ontologique**{/violet} du sens commun, que Kant qualifie tour à tour de {amber}sentiment{/amber}, de {amber}principe{/amber} et de {amber}__faculté__{/amber} ; et la question, posée par Kant lui-même au {sky}paragraphe 22{/sky} et restée sans réponse, de savoir s'il est {violet}**régulateur**{/violet} ou {violet}__constitutif__{/violet}.

    {sky}Guyer{/sky} qualifiait le sens commun de {red}**« détour inutile »**{/red} dans l'argument de la déduction : un jugement qui a longtemps conduit à le négliger. L'intérêt pour cette notion a repris depuis : {sky}Matherne{/sky} reprend la distinction d'Allison et fait du sens commun esthétique {coral}quelque chose que nous __acquérons__ (donc régulateur){/coral}, ce qui rendrait compte de l'autonomie du goût ; {sky}Makkai{/sky} **rejette au contraire cette distinction**, soutenant que {coral}le paragraphe 21 pointe vers un parallèle entre connaissance et goût{/coral} ; {sky}Sethi{/sky} la rejette elle aussi, mais pour une autre raison : elle conteste que le sentiment invoqué au paragraphe 20 soit {pink}un sentiment de plaisir{/pink} plutôt que {green}**le sentiment du libre jeu lui-même**{/green}.

    Au §40, Kant rattache le goût à la deuxième maxime du sens commun, {teal}« {/teal}penser {teal}en se mettant à la place de tout autre »{/teal} : le sujet apprend à {teal}« {/teal}réfléchir sur son propre jugement {teal}à partir d'un point de vue universel{/teal} (qu'il ne peut déterminer qu'en se plaçant {teal}au point de vue d'autrui) »{/teal}. D'où le dernier paradoxe relevé par {sky}Marc Sherringham{/sky} : « c'est dans mon plaisir intérieur que s'expérimente la rencontre de l'autre ».
  points:
  - id: ea2-l9-p1
    sentence: "Au paragraphe 20, Kant définit le sens commun comme un principe subjectif qui détermine uniquement par le ___, et non par des concepts."
    answer: "sentiment"
    alt: []
  - id: ea2-l9-p2
    sentence: "Au paragraphe 21, Kant va plus loin en soutenant qu'il faut supposer un sens commun comme condition de la communicabilité universelle de la ___ elle-même, et non plus seulement du jugement de goût."
    answer: "connaissance"
    alt: []
  - id: ea2-l9-p3
