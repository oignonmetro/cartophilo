- id: ea2-l8
  title: "Les jugements négatifs de beauté"
  notes: |
    Kant a très peu à dire sur le jugement selon lequel un objet {red}n'est pas beau{/red}, ou sur le déplaisir associé au jugement qu'un objet est {red}__laid__{/red} : un déplaisir à distinguer de celui, différent, qu'implique le {violet}sublime{/violet}.

    Deux questions se posent :
    - {sky}Shier{/sky} soutient que la théorie kantienne du goût {red}**ne permet pas de jugements de beauté négatifs**{/red} ; {sky}Allison{/sky} conteste cette lecture et tient au contraire pour un critère d'adéquation d'une interprétation {green}qu'elle permette de tels jugements négatifs{/green}.
    - Comment juger qu'un objet {amber}n'est pas beau{/amber}, d'une part (un problème proche, pour les théories expressivistes du discours normatif, du problème dit de {sky}__Frege-Geach__{/sky}), et comment le juger {amber}__laid__{/amber}, d'autre part ?

    Sur la laideur proprement dite, trois positions s'opposent :
    - {sky}Guyer{/sky} soutient que le déplaisir pris au laid {amber}**implique toujours un intérêt**{/amber}, de sorte qu'{coral}il n'existe pas, chez Kant, de jugement pur de laideur{/coral}.
    - {sky}Ginsborg{/sky} admet au contraire des {amber}**jugements désintéressés de laideur**{/amber}, mais leur refuse tout sentiment caractéristique de déplaisir : {coral}un objet serait jugé laid s'il manque de beauté dans un contexte où celle-ci était attendue{/coral}.
    - {sky}A. Cohen{/sky} propose une troisième voie : le jeu des facultés peut, dans le jugement de laideur, tourner au {amber}**« jeu malheureux »**{/amber} [{blue}*foul play*{/blue}], où {coral}l'imagination et l'entendement se contrarient réciproquement au lieu de s'harmoniser{/coral}.

    La position de Guyer est en outre critiquée par {sky}McConnell{/sky}, qui défend la possibilité de {green}**jugements purs de laideur**{/green} en s'appuyant sur la théorie kantienne des {violet}idées esthétiques{/violet}.

    Le {violet}**laid**{/violet} suscite, dans un jugement contemplatif, {red}non l'indifférence{/red} mais {green}le déplaisir, le rejet{/green}. Il n'est donc ni le {pink}**désagréable**{/pink} (un déplaisir sensuel, dans un jugement intéressé), ni le {pink}**fade**{/pink} ou l'insipide, qui laissent indifférent : {coral}la laideur n'est pas une simple absence de beauté{/coral}.
