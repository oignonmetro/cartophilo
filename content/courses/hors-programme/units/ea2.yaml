- id: ea2-l1b
  title: "Les deux particularités du jugement de goût"
  notes: |
    Affirmer que {yellow}« ceci est beau »{/yellow}, c'est poser {teal}« {/teal}la {teal}valeur universelle d'un jugement singulier »{/teal} (§30) : ce n'est {red}ni une proposition universelle{/red}, faute de concept, {pink}ni une proposition particulière{/pink}, puisqu'il prétend valoir pour tous. Dès qu'un jugement prétend à l'universalité et à la nécessité, il faut en présenter la {violet}**déduction**{/violet}, au sens juridique du terme : {teal}« {/teal}la {teal}garantie de la légitimité »{/teal} de son usage.

    Tous les jugements de goût sont {violet}singuliers{/violet}, puisqu'ils proviennent d'une représentation singulière ; mais {teal}« {/teal}ce n'est pas {red}le plaisir{/red}, mais {teal}l'universalité de ce plaisir »{/teal} que nous nous représentons {blue}*a priori*{/blue} comme règle valable pour tous (§37).

    Kant dégage deux particularités du goût ({sky}§§32-33{/sky}), qui forment, selon {sky}Marc Sherringham{/sky}, une {violet}**double simulation symétrique**{/violet} :

    | | Le jugement de goût... | Ce qu'il exclut |
    | 1re particularité (§32) | prétend à l'adhésion de chacun, « comme s'il était objectif » | l'imitation : il doit être porté *a priori*, par soi-même |
    | 2de particularité (§33) | n'est pas déterminable par des preuves, « comme s'il était seulement subjectif » | le grand nombre, et « une preuve *a priori* d'après des règles déterminées » |

    Il est toujours {green}**singulier**{/green} : je trouve belle {yellow}*cette* tulipe{/yellow}, quand le {pink}jugement logique{/pink} dit que {pink}toutes les tulipes sont belles{/pink}.

    ! Suivre un créateur exemplaire {red}n'est pas l'imiter{/red} : {green}c'est puiser aux mêmes sources que lui{/green}.
  points:
  - id: ea2-l1b-p1
    sentence: "Affirmer que « ceci est beau » revient précisément à poser « ___ »."
    answer: "la valeur universelle d'un jugement singulier"
    alt: []
    explanation: "§30."
  - id: ea2-l1b-p2
    sentence: "Dès qu'un jugement prétend à l'universalité et à la nécessité, il devient indispensable d'en présenter la ___, au sens juridique du terme."
    answer: "déduction"
    alt: ["la déduction"]
  - id: ea2-l1b-p3
    sentence: "La déduction, au sens juridique du terme, est « la garantie de la ___ » de l'usage d'un jugement."
    answer: "légitimité"
    alt: []
  - id: ea2-l1b-p4
    sentence: "« ___, perçu comme lié dans l'esprit au simple jugement sur un objet, que nous nous représentons *a priori* dans un jugement de goût comme règle universelle de jugement valable pour tous. »"
    answer: "Ce n'est pas le plaisir, mais l'universalité de ce plaisir"
    alt: ["ce n'est pas le plaisir, mais l'universalité de ce plaisir"]
    explanation: "§37."
  - id: ea2-l1b-p5
    sentence: "« Le jugement de goût détermine son objet (en tant que beauté) du point de vue de la satisfaction, en prétendant à l'adhésion de chacun, ___. »"
    answer: "comme s'il était objectif"
    alt: []
    explanation: "§32 : première particularité du jugement de goût."
  - id: ea2-l1b-p6
    sentence: "« il est exigé de tout véritable jugement de goût que celui qui le porte juge ___ [...] : il doit par conséquent énoncer son jugement non pas par imitation, parce qu'une chose plaît effectivement de manière universelle, mais *a priori*. »"
    answer: "par lui-même"
    alt: []
    explanation: "§32."
  - id: ea2-l1b-p7
    sentence: "« il est exigé de tout véritable jugement de goût que celui qui le porte juge par lui-même [...] : il doit par conséquent énoncer son jugement non pas ___, parce qu'une chose plaît effectivement de manière universelle, mais *a priori*. »"
    answer: "par imitation"
    alt: []
    explanation: "§32."
  - id: ea2-l1b-p8
    sentence: "Suivre, et non imiter, c'est « puiser aux mêmes sources où [un créateur exemplaire] puisait lui-même et emprunter à son prédécesseur uniquement ___ »."
    answer: "la façon de s'y prendre"
    alt: []
    explanation: "§32."
  - id: ea2-l1b-p9
    sentence: "« Le jugement de goût n'est absolument pas déterminable par des raisons démonstratives, exactement ___. »"
    answer: "comme s'il était seulement subjectif"
    alt: []
    explanation: "§33 : seconde particularité du jugement de goût."
  - id: ea2-l1b-p10
    sentence: "L'assentiment esthétique ne peut être contraint ni par le grand nombre, ni par « une preuve ___ d'après des règles déterminées »."
    answer: "a priori"
    alt: []
    explanation: "§33."
  - id: ea2-l1b-p11
    sentence: "« le jugement de goût est prononcé absolument toujours comme un jugement ___ à propos de l'objet »"
    answer: "singulier"
    alt: []
    explanation: "§33."
  - id: ea2-l1b-p12
    sentence: "« Je trouve belle cette tulipe » est un jugement de goût ; « toutes les tulipes sont belles » est un jugement ___."
    answer: "logique"
    alt: []
