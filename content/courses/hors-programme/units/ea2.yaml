- id: ea2-l4
  title: "Le libre jeu de l'imagination et de l'entendement"
  notes: |
    Le {violet}libre jeu{/violet} est **la notion la plus centrale de l'esthétique kantienne**, mais Kant ne l'explique que par des {yellow}métaphores{/yellow} : l'imagination y {coral}conforme son activité aux conditions générales d'application des concepts{/coral}, {red}sans qu'aucun concept déterminé ne s'y applique{/red}, d'où la formule d'une {teal}« __légalité__{/teal} sans {teal}__loi__ »{/teal}.

    Les commentateurs proposent des lectures très différentes de cette activité :

    - par la {amber}**phénoménologie**{/amber} de l'expérience esthétique ({sky}Bell{/sky}, à partir de {yellow}la contemplation d'une peinture abstraite{/yellow}) ;
    - par la théorie kantienne de l'imagination de la {sky}première *Critique*{/sky}, mais de deux façons opposées : {sky}Guyer{/sky} l'identifie aux {amber}deux premières étapes de la « triple synthèse »{/amber} de la {sky}Déduction transcendantale{/sky} ; {sky}Makkreel{/sky} y voit au contraire un {amber}**schématisme de concepts purs**{/amber} sans aucun concept empirique ;
    - par la notion de {amber}**sens commun**{/amber} ({sky}Zinkin{/sky}, qui y voit une {coral}forme intensive de sensibilité{/coral}, par contraste avec l'espace et le temps, formes extensives) ;
    - par la lecture en un seul acte de {sky}Ginsborg{/sky}, pour qui être en libre jeu, c'est simplement {amber}**revendiquer, sans concept, la validité universelle**{/amber} de son état perceptif.

    Un problème plus général traverse ce débat : celui du statut de la « {violet}psychologie transcendantale{/violet} » de Kant : le libre jeu est-il un {amber}**processus psychologique naturel**{/amber}, se déroulant dans le temps et soumis aux lois causales, ou une {amber}condition{/amber} {blue}*a priori*{/blue} {amber}de la connaissance{/amber} ? {sky}Guyer{/sky} défend, dès 1979 et plus explicitement encore en 2008, une {violet}**lecture pleinement naturaliste**{/violet}, allant jusqu'à {red}rejeter la prétention kantienne à un principe{/red} {blue}*a priori*{/blue} : l'esthétique kantienne ne serait alors qu'une {pink}contribution à la psychologie empirique du goût{/pink}.

    {sky}Guyer{/sky} distingue lui-même **trois types de lectures** du libre jeu :
    - {violet}__précognitives__{/violet} : {amber}le jeu des facultés reste en-deçà de la connaissance{/amber} (sa propre position de 1979).
    - {violet}__multicognitives__{/violet} : {amber}le jeu applique plusieurs concepts à la fois{/amber}, d'où un excès cognitif (position d'{sky}Allison{/sky}).
    - {violet}__métacognitives__{/violet} : {amber}le divers est représenté comme ayant une unité excédant ce qu'exige la connaissance{/amber} (la position que Guyer lui-même privilégie en 2006).

    Kant le dit au §35 : {teal}« {/teal}Le jugement de goût doit se fonder {teal}uniquement sur le sentiment{/teal} que {teal}l'imagination dans sa liberté{/teal} et {teal}l'entendement dans sa légalité s'animent réciproquement. »{/teal} Le plaisir y {teal}« {/teal}accompagne la {teal}commune appréhension{/teal} d'un objet par l'imagination, faculté de l'intuition, {teal}concourant avec l'entendement{/teal}, faculté des {teal}concepts »{/teal} ; et {teal}« {/teal}quand l'imagination dans sa liberté {teal}réveille l'entendement »{/teal}, la représentation se communique {teal}« {/teal}{red}non en tant que pensée{/red}, mais en tant que {teal}pur sentiment interne d'un état harmonieux de l'esprit »{/teal}.
  points:
  - id: ea2-l4-p1
    sentence: "Kant qualifie l'activité de l'imagination dans le libre jeu, à la fois réglée et non gouvernée par un concept déterminé, de « légalité ___ »."
    answer: "sans loi"
    alt: []
  - id: ea2-l4-p2
    sentence: "Pour rendre intelligible le libre jeu, ___ en appelle à la phénoménologie de l'expérience esthétique, par exemple celle de la contemplation d'une peinture abstraite, où le sujet perçoit un ordre et une unité non conceptuels entre les éléments."
    answer: "Bell"
    alt: []
    explanation: "Bell 1987."
  - id: ea2-l4-p3
    sentence: "Parmi les commentateurs qui situent le libre jeu dans la théorie kantienne de l'imagination de la Critique de la raison pure, ___ l'identifie aux deux premières étapes de la « triple synthèse » de la première édition de la Déduction transcendantale."
    answer: "Guyer"
    alt: []
