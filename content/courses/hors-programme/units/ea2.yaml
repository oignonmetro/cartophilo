- id: ea2-l6
  title: "Le caractère de la prétention à l'assentiment"
  notes: |
    Kant décrit la prétention du jugement de beauté à l'assentiment en des termes normatifs explicites (§19) : quiconque déclare un objet beau, dit-il, tient que chacun {blue}*sollen*{/blue} ({green}__devrait__{/green}) y donner son approbation et le déclarer beau à son tour.

    Mais quelle est {amber}**la nature exacte de ce « devoir »**{/amber} ?

    - {sky}Guyer{/sky} le comprend {pink}non comme une exigence normative{/pink}, mais comme une {amber}attente rationnelle ou une prédiction idéale{/amber} : juger un objet beau, ce serait affirmer que {coral}dans des circonstances idéales, chacun partagerait son plaisir{/coral}.
    - {sky}Rogerson{/sky}, {sky}Ginsborg{/sky}, {sky}Rind{/sky} et {sky}Kalar{/sky} objectent à cette lecture qu'{red}elle ne rend pas justice au langage normatif de Kant{/red}. {sky}Rogerson{/sky} va plus loin en proposant que ce « devoir » soit de nature {amber}__morale__{/amber} : le jugement de beauté ferait porter sur autrui {coral}une exigence d'apprécier la beauté de l'objet{/coral}.
    - D'autres critiques de Guyer, dont {sky}Allison{/sky}, comprennent ce devoir {amber}comme non moral{/amber} tout en le tenant pour {amber}authentiquement normatif{/amber}. {sky}Ginsborg{/sky} résout alors la difficulté de trouver une normativité {red}qui ne soit ni morale ni prédictive{/red} en l'identifiant à ce qu'elle appelle la {violet}normativité **« primitive »**{/violet} requise pour la conceptualisation empirique.

    Deux lectures vont plus loin encore sur la force de cette exigence : {sky}Moran{/sky} suggère que l'objet beau fait par lui-même une {coral}**demande inconditionnelle**{/coral} sur l'attention du spectateur (il évoque {yellow}le vœu du narrateur proustien aux aubépines{/yellow}) ; {sky}Kalar{/sky} comprend cette exigence comme recouvrant en réalité __deux__ demandes distinctes : {amber}une demande non morale de ressentir du plaisir{/amber}, et {amber}une demande morale supplémentaire de prêter attention à l'objet{/amber}.
  points:
  - id: ea2-l6-p1
    sentence: "___ comprend la prétention à l'assentiment du jugement de beauté non comme une exigence normative, mais comme une attente rationnelle ou une prédiction idéale : juger un objet beau, ce serait affirmer que dans des circonstances idéales, chacun partagerait son plaisir."
    answer: "Guyer"
    alt: []
    explanation: "Guyer 1979."
