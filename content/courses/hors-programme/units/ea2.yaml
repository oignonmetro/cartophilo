- id: ea2-l10
  title: "Validité universelle et communicabilité universelle"
  notes: |
    Kant emploie souvent, l'une pour l'autre, les expressions « {violet}validité universelle{/violet} » et « {violet}**communicabilité universelle**{/violet} » pour caractériser la prétention du jugement de beauté ; {sky}Guyer{/sky} relève d'ailleurs plusieurs passages où Kant semble les employer de façon {pink}**interchangeable**{/pink}.

    Plusieurs commentateurs récents ({sky}Makkai, Vaccarino Bremner et Sethi{/sky}) soutiennent au contraire qu'{green}**il faut distinguer les deux notions**{/green} : la {violet}communicabilité universelle{/violet} {red}ne se limite pas à revendiquer la validité universelle{/red}, elle concerne {coral}la possibilité de littéralement __communiquer__ son sentiment dans l'objet à autrui{/coral} : de faire en sorte qu'un autre puisse effectivement le partager.

    L'universalité du plaisir implique l'hypothèse d'un {violet}sens commun esthétique{/violet}, à partir duquel Kant définit le {violet}goût{/violet} comme {teal}« {/teal}la {teal}faculté de juger{/teal} de ce qui rend {teal}universellement communicable notre sentiment{/teal} lié à une représentation donnée {teal}sans le secours d'aucun concept »{/teal} (§40).
  points:
  - id: ea2-l10-p1
    sentence: "Kant emploie souvent, l'une pour l'autre, les expressions « validité universelle » et « ___ » pour caractériser la prétention du jugement de beauté."
    answer: "communicabilité universelle"
    alt: []
  - id: ea2-l10-p2
    sentence: "___ relève plusieurs passages où Kant semble employer les expressions « validité universelle » et « communicabilité universelle » de façon interchangeable, ce qui a conduit une grande partie du commentaire à les traiter comme équivalentes."
    answer: "Guyer"
