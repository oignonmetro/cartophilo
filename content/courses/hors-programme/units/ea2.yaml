  - id: ea2-l5
    title: "L'intentionnalité du plaisir"
    notes: |
      Le plaisir pris au beau a-t-il un **contenu intentionnel**, c'est-à-dire
      est-il dirigé vers quelque chose ? Guyer répond par la négative : le
      plaisir serait « __opaque__ », et sa relation au libre jeu **purement
      causale**. On peut certes reconnaître après coup que son plaisir tient
      au libre jeu, mais seulement par un raisonnement d'__élimination__
      portant sur l'histoire causale du plaisir (il n'était ni sensoriel ni
      lié à la satisfaction d'un désir), non parce que le plaisir en
      rendrait immédiatement conscient.

      Plusieurs commentateurs défendent au contraire **l'intentionnalité du
      plaisir**, mais en la dirigeant vers des cibles différentes :
      - Aquila : vers l'objet, ou sa structure formelle.
      - Allison : vers le libre jeu lui-même.
      - Hughes : à la fois vers l'objet et vers l'activité des facultés.
      - Zuckert : élargit le débat en soutenant que __tout__ plaisir, non
        seulement celui pris au beau, est intentionnel, en ce qu'il rend
        conscient du désir de prolonger l'état mental où l'on se trouve.
      - Cvejić : rejoint Zuckert, mais soutient que cette intentionnalité est
        d'un genre distinctif, propre aux seuls sentiments.
      - A. Cohen : soutient elle aussi l'intentionnalité du plaisir, mais nie
        qu'elle soit intrinsèque : elle la fait dériver de l'interprétation
        réflexive que le sujet donne de ses propres sentiments.
    points:
      - id: ea2-l5-p1
        sentence: "___ soutient que le plaisir pris au beau est « opaque », c'est-à-dire dépourvu de contenu intentionnel : la relation entre le libre jeu et le plaisir serait purement causale."
        answer: "Guyer"
        alt: []
        explanation: "Guyer 1979."
      - id: ea2-l5-p2
        sentence: "Sur la lecture de Guyer, on peut certes reconnaître après coup que son plaisir tient au libre jeu des facultés, mais seulement par un raisonnement d'___ portant sur l'histoire causale du plaisir, non parce que le plaisir en rendrait immédiatement conscient."
        answer: "élimination"
        alt: []
      - id: ea2-l5-p3
        sentence: "Contre l'opacité du plaisir défendue par Guyer, ___ soutient que le plaisir est intentionnellement dirigé vers l'objet, ou vers sa structure formelle."
        answer: "Aquila"
        alt: []
        explanation: "Aquila 1982."
      - id: ea2-l5-p4
        sentence: "___ tient au contraire que le plaisir rend le sujet conscient du libre jeu des facultés lui-même."
        answer: "Allison"
        alt: []
        explanation: "Allison 2001."
      - id: ea2-l5-p5
        sentence: "___ défend une thèse distincte de celles d'Aquila et d'Allison : le plaisir serait dirigé à la fois vers l'objet perçu comme beau et vers l'activité des facultés dans leur libre jeu."
        answer: "Hughes"
        alt: []
        explanation: "Hughes 2017."
      - id: ea2-l5-p6
        sentence: "___ élargit le débat en soutenant que le plaisir en général, non seulement celui pris au beau, est intentionnel, en ce qu'il rend conscient du désir de prolonger l'état mental où l'on se trouve."
        answer: "Zuckert"
        alt: []
        explanation: "Zuckert 2002."
      - id: ea2-l5-p7
        sentence: "___ rejoint Zuckert sur l'intentionnalité générale du plaisir, mais soutient que cette intentionnalité est d'un genre distinctif, propre aux seuls sentiments, différent de celle des représentations cognitives."
        answer: "Cvejić"
        alt: []
        explanation: "Cvejić 2021."
      - id: ea2-l5-p8
        sentence: "___ soutient elle aussi que le plaisir pris au beau est intentionnel, mais nie que cette intentionnalité soit intrinsèque : elle la fait dériver de l'interprétation réflexive que le sujet donne de ses propres sentiments."
        answer: "A. Cohen"
        alt: []
        explanation: "A. Cohen 2020, à distinguer de Ted Cohen (voir la piste sur l'esthétique et la morale)."

  - id: ea2-l6
    title: "Le caractère de la prétention à l'assentiment"
    notes: |
      Kant décrit la prétention du jugement de beauté à l'assentiment en des
      termes normatifs explicites : quiconque déclare un objet beau, dit-il,
      tient que chacun `sollen` (__devrait__) y donner son approbation et le
      déclarer beau à son tour.

      Mais quelle est **la nature exacte de ce « devoir »** ?

      - Guyer le comprend non comme une exigence normative, mais comme une
        {coral}attente rationnelle ou une prédiction idéale{/coral} : juger
        un objet beau, ce serait affirmer que dans des circonstances idéales,
        chacun partagerait son plaisir.
      - Rogerson, Ginsborg, Rind et Kalar objectent à cette lecture qu'elle
        ne rend pas justice au {coral}langage normatif{/coral} de Kant.
        Rogerson va plus loin en proposant que ce « devoir » soit de nature
        __morale__ : le jugement de beauté ferait porter sur autrui une
        exigence d'apprécier la beauté de l'objet.
      - D'autres critiques de Guyer, dont Allison, comprennent ce devoir
        comme non moral tout en le tenant pour {coral}authentiquement
        normatif{/coral}. Ginsborg résout alors la difficulté de trouver une
        normativité qui ne soit ni morale ni prédictive en l'identifiant à ce
        qu'elle appelle la normativité **« primitive »** requise pour la
        conceptualisation empirique.

      Deux lectures vont plus loin encore sur la force de cette exigence :
      Moran suggère que l'objet beau fait par lui-même une **demande
      inconditionnelle** sur l'attention du spectateur (il évoque le vœu du
      narrateur proustien aux aubépines) ; Kalar comprend cette exigence
      comme recouvrant en réalité __deux__ demandes distinctes : une demande
      non morale de ressentir du plaisir, et une demande morale
      supplémentaire de prêter attention à l'objet.
    points:
      - id: ea2-l6-p1
        sentence: "___ comprend la prétention à l'assentiment du jugement de beauté non comme une exigence normative, mais comme une attente rationnelle ou une prédiction idéale : juger un objet beau, ce serait affirmer que dans des circonstances idéales, chacun partagerait son plaisir."
        answer: "Guyer"
        alt: []
        explanation: "Guyer 1979."
      - id: ea2-l6-p2
        sentence: "Kant décrit l'exigence d'assentiment du jugement de beauté en des termes normatifs explicites : quiconque déclare un objet beau, dit-il, tient que chacun ___ y donner son approbation et le déclarer beau à son tour."
        answer: "devrait"
        alt: []
        explanation: "§19, Ak. 5:237."
      - id: ea2-l6-p3
        sentence: "Ce verbe modal allemand, qui marque le caractère normatif de cette exigence d'assentiment selon Kant, s'écrit ___."
        answer: "sollen"
        alt: []
      - id: ea2-l6-p4
        sentence: "___ propose que le jugement de beauté fasse porter sur autrui une exigence morale d'apprécier la beauté de l'objet, de sorte que le « devoir » en jeu serait de nature rationnelle, et plus précisément morale, plutôt que simplement prédictive."
        answer: "Rogerson"
        alt: []
      - id: ea2-l6-p5
        sentence: "D'autres critiques de Guyer, dont Allison, comprennent au contraire ce « devoir » comme non moral tout en le tenant pour authentiquement ___, par opposition à une simple prédiction."
        answer: "normatif"
        alt: []
      - id: ea2-l6-p6
        sentence: "___ résout la difficulté de trouver une normativité qui ne soit ni morale ni simplement prédictive en l'identifiant à ce qu'elle appelle la normativité « primitive » requise pour la conceptualisation empirique."
        answer: "Ginsborg"
        alt: []
        explanation: "Ginsborg 2006."
      - id: ea2-l6-p7
        sentence: "___ comprend cette exigence comme reflétant un sentiment d'obligation distinct de l'obligation morale mais plus fort que celui présent dans le jugement cognitif ordinaire, allant jusqu'à suggérer que l'objet beau fait par lui-même une demande inconditionnelle sur l'attention du spectateur."
        answer: "Moran"
        alt: []
        explanation: "Moran 2012."
      - id: ea2-l6-p8
        sentence: "___ comprend cette exigence comme recouvrant en réalité deux demandes normatives distinctes : une demande non morale de ressentir du plaisir devant l'objet donné, et une demande morale supplémentaire de lui accorder son attention."
        answer: "Kalar"
        alt: []
        explanation: "Kalar 2006."

  - id: ea2-l7
    title: "La beauté est-elle objective ?"
    notes: |
      Bien que Kant qualifie le jugement de goût de « subjectivement fondé »,
      certains commentateurs y voient malgré tout une forme
      d'__objectivité__.

      - Ameriks soutient que les jugements de beauté sont
        {coral}objectifs{/coral} au même sens où le sont les jugements de
        couleur et des autres qualités secondes.
      - Ginsborg conteste cette lecture et défend la {coral}subjectivité du
        goût{/coral} : Kant interdit de juger de la beauté par ouï-dire, il
        faut, dit-il, « soumettre l'objet à ses propres __yeux__ ».
      - Makkai reprend et développe ensuite la défense de
        l'{coral}objectivité{/coral}, après la réplique d'Ameriks à Ginsborg.

      Cette question est liée à deux autres : celle de savoir s'il peut
      exister des **jugements de goût __erronés__** (donc faux), et celle de
      l'« **autonomie du goût** », soit l'indépendance supposée de nos
      jugements de goût à l'égard du témoignage et du jugement des experts.
    points:
      - id: ea2-l7-p1
        sentence: "Contre l'insistance de Kant sur le caractère « subjectivement fondé » du jugement de goût, ___ soutient que les jugements de beauté sont malgré tout objectifs, au même sens où le sont les jugements de couleur et des autres qualités secondes."
        answer: "Ameriks"
        alt: []
      - id: ea2-l7-p2
        sentence: "___ conteste la lecture objectiviste défendue par Ameriks et défend au contraire la subjectivité du goût, en s'appuyant sur le fait que Kant interdit de juger de la beauté par ouï-dire."
        answer: "Ginsborg"
        alt: []
        explanation: "Ginsborg 1998 ; un point également fait par Hopkins 2001."
      - id: ea2-l7-p3
        sentence: "Pour exclure le jugement de beauté fondé sur le seul témoignage d'autrui, Kant exige que chacun soumette l'objet à ses propres ___."
        answer: "yeux"
        alt: []
        explanation: "§8, Ak. 5:215–216."
      - id: ea2-l7-p4
        sentence: "La défense de l'objectivité du goût est reprise et développée, après la réplique d'Ameriks à Ginsborg, par ___."
        answer: "Makkai"
        alt: []
        explanation: "Makkai 2010."
      - id: ea2-l7-p5
        sentence: "La question de l'objectivité du goût est liée à celle de l'« autonomie du goût », soit l'indépendance supposée de nos jugements de goût à l'égard du témoignage et du jugement des ___."
        answer: "experts"
        alt: []
      - id: ea2-l7-p6
        sentence: "Elle est également liée à la question de savoir s'il peut exister des jugements de goût ___, c'est-à-dire des jugements de goût faux."
        answer: "erronés"
        alt: []

  - id: ea2-l8
    title: "Les jugements négatifs de beauté"
    notes: |
      Kant a très peu à dire sur le jugement selon lequel un objet n'est pas
      beau, ou sur le déplaisir associé au jugement qu'un objet est
      __laid__ : un déplaisir à distinguer de celui, différent, qu'implique
      le sublime.

      Deux questions se posent :
      - Shier soutient que la théorie kantienne du goût **ne permet pas de
        jugements de beauté négatifs** ; Allison conteste cette lecture et
        tient au contraire pour un critère d'adéquation d'une interprétation
        qu'elle permette de tels jugements négatifs.
      - Comment juger qu'un objet n'est pas beau, d'une part (un problème
        proche, pour les théories expressivistes du discours normatif, du
        problème dit de __Frege-Geach__), et comment le juger __laid__,
        d'autre part ?

      Sur la laideur proprement dite, trois positions s'opposent :
      - Guyer soutient que le déplaisir pris au laid **implique toujours un
        intérêt**, de sorte qu'il n'existe pas, chez Kant, de jugement pur de
        laideur.
      - Ginsborg admet au contraire des **jugements désintéressés de
        laideur**, mais leur refuse tout sentiment caractéristique de
        déplaisir : un objet serait jugé laid s'il manque de beauté dans un
        contexte où celle-ci était attendue.
      - A. Cohen propose une troisième voie : le jeu des facultés peut, dans
        le jugement de laideur, tourner au **« jeu malheureux »** [foul
        play], où l'imagination et l'entendement se contrarient
        réciproquement au lieu de s'harmoniser.

      La position de Guyer est en outre critiquée par McConnell, qui défend
      la possibilité de **jugements purs de laideur** en s'appuyant sur la
      théorie kantienne des idées esthétiques.
    points:
      - id: ea2-l8-p1
        sentence: "Kant a très peu à dire sur le jugement selon lequel un objet n'est pas beau, ou sur le déplaisir associé au jugement qu'un objet est ___ : un déplaisir à distinguer de celui, différent, qu'implique le sublime."
        answer: "laid"
        alt: []
      - id: ea2-l8-p2
        sentence: "___ soutient que la théorie kantienne du jugement de goût, telle qu'elle est exposée, ne permet pas de jugements de beauté négatifs."
        answer: "Shier"
        alt: []
        explanation: "Shier 1998."
      - id: ea2-l8-p3
        sentence: "La lecture de Shier, selon laquelle la théorie kantienne du goût ne permettrait aucun jugement de beauté négatif, est contestée par ___, qui tient au contraire pour un critère d'adéquation d'une interprétation de la théorie du goût qu'elle permette de tels jugements."
        answer: "Allison"
        alt: []
        explanation: "Allison 2001."
      - id: ea2-l8-p4
        sentence: "Il convient de distinguer la question de savoir comment juger qu'un objet n'est pas beau (un problème proche, pour les théories expressivistes du discours normatif, du problème dit de ___) de celle de savoir comment le juger laid."
        answer: "Frege-Geach"
        alt: []
      - id: ea2-l8-p5
        sentence: "___ soutient que, chez Kant, le déplaisir pris au laid implique toujours un intérêt, de sorte qu'il n'existe pas, à proprement parler, de jugement pur de laideur."
        answer: "Guyer"
        alt: []
        explanation: "Guyer 2005b, ch. 6."
      - id: ea2-l8-p6
        sentence: "À la différence de Guyer, ___ admet des jugements désintéressés de laideur, mais leur refuse tout sentiment caractéristique de déplaisir : un objet serait jugé laid s'il manque de beauté dans un contexte où celle-ci était attendue."
        answer: "Ginsborg"
        alt: []
        explanation: "Ginsborg 2003."
      - id: ea2-l8-p7
        sentence: "___ propose que le jeu des facultés puisse aussi, dans le jugement de laideur, tourner au « jeu malheureux », où l'imagination et l'entendement, plutôt que de s'harmoniser, se contrarient réciproquement."
        answer: "A. Cohen"
        alt: []
        explanation: "A. Cohen 2013."
      - id: ea2-l8-p8
        sentence: "La position de Guyer sur la laideur est critiquée par ___, qui défend au contraire la possibilité de jugements purs de laideur en s'appuyant sur la théorie kantienne des idées esthétiques."
        answer: "McConnell"
        alt: []
        explanation: "McConnell 2008."

  - id: ea2-l9
    title: "Qu'est-ce que le sens commun ?"
    notes: |
      Au paragraphe 20, Kant définit le sens commun (`sensus communis`)
      comme un principe subjectif qui détermine uniquement par le
      __sentiment__, non par des concepts. Au paragraphe 21, il va plus loin
      en soutenant qu'il faut le supposer comme condition de la
      communicabilité universelle de la __connaissance__ elle-même.

      Ce passage pose une difficulté : si le sens commun du paragraphe 20
      juge par le {coral}sentiment{/coral} de plaisir, il semble peu
      plausible qu'il conditionne aussi la communicabilité des jugements
      cognitifs, puisqu'il ne faut pas éprouver de plaisir pour savoir qu'un
      jugement cognitif devrait être partagé par tous. Allison propose alors
      de **distinguer deux espèces de sens commun** : l'un pour la
      {coral}beauté{/coral}, l'autre pour la {coral}connaissance{/coral}.

      Deux autres questions se posent : le **statut ontologique** du sens
      commun, que Kant qualifie tour à tour de sentiment, de principe et de
      __faculté__ ; et la question, posée par Kant lui-même au paragraphe 22
      et restée sans réponse, de savoir s'il est **régulateur** ou
      __constitutif__.

      Guyer qualifiait le sens commun de **« détour inutile »** dans
      l'argument de la déduction : un jugement qui a longtemps conduit à le
      négliger. L'intérêt pour cette notion a repris depuis : Matherne
      reprend la distinction d'Allison et fait du sens commun esthétique
      quelque chose que nous __acquérons__ (donc régulateur), ce qui
      rendrait compte de l'autonomie du goût ; Makkai **rejette au contraire
      cette distinction**, soutenant que le paragraphe 21 pointe vers un
      parallèle entre connaissance et goût ; Sethi la rejette elle aussi,
      mais pour une autre raison : elle conteste que le sentiment invoqué au
      paragraphe 20 soit un sentiment de plaisir plutôt que **le sentiment du
      libre jeu lui-même**.
    points:
      - id: ea2-l9-p1
        sentence: "Au paragraphe 20, Kant définit le sens commun comme un principe subjectif qui détermine uniquement par le ___, et non par des concepts."
        answer: "sentiment"
        alt: []
      - id: ea2-l9-p2
        sentence: "Au paragraphe 21, Kant va plus loin en soutenant qu'il faut supposer un sens commun comme condition de la communicabilité universelle de la ___ elle-même, et non plus seulement du jugement de goût."
        answer: "connaissance"
        alt: []
      - id: ea2-l9-p3
        sentence: "Ce passage du paragraphe 21 pose une difficulté : si le sens commun du paragraphe 20 est un principe qui juge par le sentiment de plaisir, il semble peu plausible qu'il conditionne aussi la communicabilité universelle des jugements ___, puisqu'il ne faut pas éprouver de plaisir pour savoir qu'un jugement cognitif devrait être partagé par tous."
        answer: "cognitifs"
        alt: []
      - id: ea2-l9-p4
        sentence: "Pour résoudre cette difficulté de savoir comment un même sens commun pourrait conditionner à la fois le goût et la connaissance, ___ propose de distinguer deux espèces de sens commun : l'un requis pour la communicabilité universelle des jugements de beauté, l'autre pour celle de la connaissance."
        answer: "Allison"
        alt: []
        explanation: "Allison 2001."
      - id: ea2-l9-p5
        sentence: "Une deuxième question porte sur le statut ontologique du sens commun, que Kant qualifie tour à tour de sentiment, de principe et de ___."
        answer: "faculté"
        alt: []
      - id: ea2-l9-p6
        sentence: "Une troisième question, posée par Kant lui-même au paragraphe 22 et restée sans réponse de sa part, demande si le sens commun, conçu comme principe ou norme, est régulateur ou ___."
        answer: "constitutif"
        alt: []
      - id: ea2-l9-p7
        sentence: "Guyer qualifie le sens commun de « détour inutile » dans l'argument d'ensemble de la déduction : un jugement qui a longtemps conduit les commentateurs à ___ cette notion."
        answer: "négliger"
        alt: []
        explanation: "Guyer 1979."
      - id: ea2-l9-p8
        sentence: "___ reprend la distinction d'Allison entre sens commun esthétique et sens commun cognitif, mais soutient que le sens commun esthétique est quelque chose que nous acquérons (donc régulateur plutôt que constitutif), ce qui permettrait de rendre compte de l'autonomie du goût."
        answer: "Matherne"
        alt: []
        explanation: "Matherne 2019."
      - id: ea2-l9-p9
        sentence: "À l'inverse, ___ rejette la distinction d'Allison entre deux sens communs, soutenant que le paragraphe 21 pointe plutôt vers un parallèle entre connaissance et goût, tous deux requérant un sentiment de ce qui « appelle à être jugé »."
        answer: "Makkai"
        alt: []
        explanation: "Makkai 2021, ch. 4."
      - id: ea2-l9-p10
        sentence: "___ rejette elle aussi la distinction d'Allison, mais pour une autre raison : cette distinction suppose que le sentiment invoqué au paragraphe 20 soit un sentiment de plaisir, alors qu'il s'agirait plutôt, selon elle, du sentiment du libre jeu des facultés lui-même."
        answer: "Sethi"
