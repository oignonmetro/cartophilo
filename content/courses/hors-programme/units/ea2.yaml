        answer: "libre jeu"
        alt: []

  - id: ea2-l2
    title: "Le dilemme de la déduction et ses réponses"
    notes: |
      L'argument de la déduction rencontre une objection sévère, formulée
      comme un __dilemme__ : le libre jeu de l'imagination et de l'entendement
      est-il **impliqué dans toute expérience perceptive cognitive**, ou non ?

      - S'il l'est, alors tout objet devrait, contre toute évidence, être
        perçu comme beau : c'est ce que les commentateurs appellent le
        problème du **« tout est beau »**.
      - S'il ne l'est pas, l'inférence centrale de la déduction ne tient
        plus : du fait que je peux exiger l'assentiment de tous pour l'état
        de mes facultés en percevant un objet comme vert ou carré, il ne
        s'ensuit pas que je puisse exiger ce même assentiment pour un état où
        mes facultés sont en libre jeu.

      La plupart des défenseurs de l'argument saisissent la
      {sky}seconde corne{/sky} : Ameriks défend une lecture des
      jugements de goût comme **objectifs** ; Allison soutient que la
      déduction vise seulement à établir que de telles prétentions **peuvent,
      en général, être légitimes**, non à garantir l'assentiment pour chaque
      jugement particulier, une lecture jugée insuffisante par Savile et
      Chignell.

      Une minorité saisit au contraire la {sky}première corne{/sky} : Gracyk
      soutient que **tout objet peut**, sur les principes mêmes de Kant, être
      légitimement trouvé beau ; Ginsborg et Breitenbach soulignent que rien,
      dans un jugement non objectif, ne pourrait de toute façon exclure un
      objet d'être ainsi jugé beau.

      D'autres (Meerbote) jugent le dilemme fatal à la prétention de Kant.
      Certains cherchent alors à la sauver par des considérations extérieures
      à l'argument officiel : l'appel à notre nature d'êtres moraux, ou
      l'appel à la théorie kantienne des idées esthétiques : la version de
      Chignell se distinguant de celle de Savile en ce qu'elle se passe de
      tout appel moral. Enfin, Rind et Kalar jugent que la version de
      l'argument donnée au paragraphe 21, qui fait appel au sens commun,
      échappe mieux au dilemme que celle du paragraphe 38.
    points:
      - id: ea2-l2-p1
        sentence: "L'objection la plus sérieuse à l'argument de la déduction prend la forme d'un ___ : le libre jeu des facultés est-il impliqué dans toute expérience perceptive cognitive, ou non ?"
        answer: "dilemme"
        alt: []
      - id: ea2-l2-p2
        sentence: "Si le libre jeu est impliqué dans toute expérience cognitive, il s'ensuit, contre toute évidence, que tout objet devrait être perçu comme beau : une conséquence que les commentateurs résument par l'expression « le problème du ___ »."
        answer: "tout est beau"
        alt: []
      - id: ea2-l2-p3
        sentence: "___ défend l'argument de la déduction en soutenant que les jugements de goût sont en réalité objectifs, apparentés en cela aux jugements cognitifs : une façon de saisir la seconde corne du dilemme."
        answer: "Ameriks"
        alt: []
        explanation: "Ameriks 1982."
      - id: ea2-l2-p4
        sentence: "___ défend une autre réponse à la seconde corne du dilemme, en soutenant que la déduction vise seulement à établir que la prétention à l'assentiment universel peut, en général, être légitime, non à garantir cet assentiment pour chaque jugement particulier."
        answer: "Allison"
        alt: []
        explanation: "Allison 2001, ch. 8."
      - id: ea2-l2-p5
        sentence: "La réponse d'Allison, qui limite la portée de la déduction à une légitimité en général plutôt qu'à chaque jugement particulier, est jugée insuffisante par ___ et Chignell, pour qui la déduction doit garantir un droit à l'assentiment dans chaque cas particulier."
        answer: "Savile"
        alt: []
      - id: ea2-l2-p6
        sentence: "À l'inverse de la plupart des commentateurs, ___ soutient que Kant saisit bien la première corne du dilemme, et que tout objet peut, sur ses propres principes, être légitimement jugé beau."
        answer: "Gracyk"
        alt: []
        explanation: "Gracyk 1986."
      - id: ea2-l2-p7
        sentence: "Puisque, sur la lecture qui saisit ainsi la première corne du dilemme, un jugement de beauté n'est pas ___, aucun trait de l'objet ne peut l'exclure d'être légitimement trouvé beau : un point souligné en particulier par Ginsborg et Breitenbach."
        answer: "objectif"
        alt: []
        explanation: "Ginsborg 2017 ; Breitenbach 2021."
      - id: ea2-l2-p8
        sentence: "___ tient le dilemme, ou des considérations proches, pour fatal à la prétention de Kant selon laquelle le jugement de beauté revendique légitimement une validité universelle."
        answer: "Meerbote"
        alt: []
        explanation: "Meerbote 1982 ; Guyer 1979 offre ailleurs une évaluation plus positive."
      - id: ea2-l2-p9
        sentence: "Face au dilemme de la déduction, certains commentateurs cherchent à sauver la légitimité du jugement de beauté par des considérations extérieures à l'argument officiel : les uns en invoquant notre nature d'êtres moraux, les autres la théorie kantienne des idées ___."
        answer: "esthétiques"
        alt: []
      - id: ea2-l2-p10
        sentence: "Kemal, Savile, Crawford et Elliott défendent une réponse au dilemme de la déduction fondée sur la moralité : elle fait de notre nature d'êtres ___ le fondement ultime de la légitimité du jugement de beauté."
        answer: "moraux"
        alt: []
      - id: ea2-l2-p11
        sentence: "Une autre stratégie de défense face au dilemme de la déduction s'appuie sur la théorie kantienne des idées esthétiques ; à la différence de Savile, qui la combine avec un appel à la moralité, ___ défend cette même stratégie sans aucun appel moral."
        answer: "Chignell"
        alt: []
      - id: ea2-l2-p12
        sentence: "Rind et Kalar jugent que la version de l'argument donnée au paragraphe 21, qui fait appel au sens commun, échappe mieux au dilemme que la déduction officielle du paragraphe ___."
        answer: "38"
        alt: []
        explanation: "Rind 2002 ; Kalar 2006, ch. 5."

  - id: ea2-l3
    title: "Plaisir et jugement : un ou deux actes ?"
    notes: |
      Une question centrale porte sur la relation entre le plaisir pris à un
      objet beau et le jugement selon lequel il est beau. L'idée naturelle
      serait qu'on ressent d'abord du plaisir, puis qu'on en tire un jugement.
      Mais au paragraphe 9 (que Kant présente lui-même comme la __clé__ de
      toute la critique du goût), il affirme au contraire que le
      **« jugement esthétique purement subjectif de l'objet »**
      __précède__ le plaisir et en est le fondement.

      Deux grandes familles de lectures tentent d'expliquer ce renversement :

      - la lecture en {coral}**deux actes**{/coral}, défendue par Guyer : un
        premier acte, identifié au libre jeu des facultés, produit le
        plaisir ; un second acte, de réflexion sur ce plaisir, aboutit à la
        prétention à sa communicabilité universelle.
      - la lecture en {coral}**un seul acte**{/coral}, défendue par Ginsborg :
        juger qu'un objet est beau serait **un unique acte, auto-référentiel**,
        qui revendique sa propre validité universelle et se manifeste
        phénoménologiquement comme un sentiment de plaisir : le plaisir n'est
        alors « consécutif » au jugement qu'au sens où on l'éprouve en vertu
        de lui, non parce qu'il le précéderait.

      D'autres commentateurs proposent des **modèles hybrides** : Longuenesse
      reprend l'idée d'un plaisir consistant en la conscience de la
      communicabilité universelle de l'état d'esprit du sujet, mais y ajoute
      un second plaisir, antérieur, suscité par le libre jeu : deux plaisirs
      plutôt qu'un. Sethi va plus loin en niant que ce sentiment antérieur
      soit lui-même un plaisir.

      *Pour distinguer Guyer et Ginsborg avec un exemple : sur la lecture en
      deux actes, on ressent d'abord (acte 1) un plaisir provoqué par le
      libre jeu, puis (acte 2) on réfléchit sur ce plaisir pour en
      revendiquer la communicabilité. Sur la lecture en un acte, il n'y a
      jamais deux moments distincts : ressentir le plaisir et revendiquer sa
      validité universelle ne sont qu'une seule et même opération.*
    points:
      - id: ea2-l3-p1
        sentence: "Kant affirme, au paragraphe 9, que le « jugement esthétique purement subjectif de l'objet » ___ le plaisir et en est le fondement, plutôt que d'en être précédé, contredisant ainsi l'idée naturelle selon laquelle on ressent d'abord le plaisir puis on juge."
        answer: "précède"
        alt: []
      - id: ea2-l3-p2
        sentence: "Kant présente lui-même cette question (savoir si, dans un jugement de goût, le sentiment de plaisir précède le jugement de l'objet ou si le jugement précède le plaisir) comme la ___ de la critique du goût, méritant toute l'attention."
        answer: "clé"
        alt: []
        explanation: "§9, Ak. 5:216."
      - id: ea2-l3-p3
        sentence: "___ répond au paradoxe apparent du paragraphe 9 en distinguant le simple « jugement » de l'objet, qui précède le plaisir, du jugement de goût proprement dit, qui repose lui sur le plaisir."
        answer: "Crawford"
        alt: []
        explanation: "Crawford 1974."
      - id: ea2-l3-p4
        sentence: "___ développe en détail une lecture en deux actes distincts de la faculté de juger réfléchissante : un premier acte, identifié au libre jeu des facultés, produit le plaisir ; un second acte, de réflexion sur ce plaisir, aboutit à la prétention à sa communicabilité universelle."
        answer: "Guyer"
        alt: []
        explanation: "Guyer 1979."
      - id: ea2-l3-p5
        sentence: "À la lecture en deux actes de Guyer, ___ oppose une lecture en un seul acte : juger qu'un objet est beau serait un unique acte de jugement, auto-référentiel, qui revendique sa propre validité universelle et se manifeste phénoménologiquement comme un sentiment de plaisir."
        answer: "Ginsborg"
        alt: []
        explanation: "Ginsborg 1991."
      - id: ea2-l3-p6
        sentence: "Sur la lecture de Ginsborg, le libre jeu des facultés s'identifie au jugement de l'objet comme beau et au sentiment de plaisir lui-même : le plaisir n'est ___ de ce jugement qu'au sens où on l'éprouve en vertu du jugement, non en ce qu'il le précéderait."
        answer: "consécutif"
        alt: []
      - id: ea2-l3-p7
        sentence: "___ objecte à la lecture en un seul acte de Ginsborg qu'elle rend le jugement de beauté auto-référentiel d'une manière « intrinsèquement implausible », et qu'elle ne rend pas compte des jugements de laideur."
        answer: "Allison"
        alt: []
        explanation: "Allison 2001."
      - id: ea2-l3-p8
        sentence: "___ propose un modèle intermédiaire : le plaisir proprement pris au beau consisterait, comme chez Ginsborg, en la conscience de la communicabilité universelle de l'état d'esprit du sujet, mais elle y ajoute un second plaisir, antérieur et distinct, suscité par le libre jeu des facultés."
        answer: "Longuenesse"
        alt: []
        explanation: "Longuenesse 2003."
      - id: ea2-l3-p9
        sentence: "Comme Longuenesse, ___ distingue deux sentiments successifs dans le jugement de beauté, mais nie que les deux soient des sentiments de plaisir : le premier serait un sentiment sui generis de l'harmonie des facultés, non un plaisir."
        answer: "Sethi"
        alt: []
        explanation: "Sethi 2019."

  - id: ea2-l4
    title: "Le libre jeu de l'imagination et de l'entendement"
    notes: |
      Le libre jeu est **la notion la plus centrale de l'esthétique
      kantienne**, mais Kant ne l'explique que par des métaphores :
      l'imagination y conforme son activité aux conditions générales
      d'application des concepts, sans qu'aucun concept déterminé ne s'y
      applique, d'où la formule d'une « __légalité sans loi__ ».

      Les commentateurs proposent des lectures très différentes de cette
      activité :

      - par la **phénoménologie** de l'expérience esthétique (Bell, à partir
        de la contemplation d'une peinture abstraite) ;
      - par la théorie kantienne de l'imagination de la première Critique,
        mais de deux façons opposées : Guyer l'identifie aux deux premières
        étapes de la « triple synthèse » de la Déduction transcendantale ;
        Makkreel y voit au contraire un **schématisme de concepts purs** sans
        aucun concept empirique ;
      - par la notion de **sens commun** (Zinkin, qui y voit une forme
        intensive de sensibilité, par contraste avec l'espace et le temps,
        formes extensives) ;
      - par la lecture en un seul acte de Ginsborg, pour qui être en libre
        jeu, c'est simplement **revendiquer, sans concept, la validité
        universelle** de son état perceptif.

      Un problème plus général traverse ce débat : celui du statut de la
      « psychologie transcendantale » de Kant : le libre jeu est-il un
      **processus psychologique naturel**, se déroulant dans le temps et
      soumis aux lois causales, ou une condition **a priori** de la
      connaissance ? Guyer défend, dès 1979 et plus explicitement encore en
      2008, une **lecture pleinement naturaliste**, allant jusqu'à rejeter la
      prétention kantienne à un principe a priori : l'esthétique kantienne ne
      serait alors qu'une contribution à la psychologie empirique du goût.

      Guyer distingue lui-même **trois types de lectures** du libre jeu :
      - __précognitives__ : le jeu des facultés reste en-deçà de la
        connaissance (sa propre position de 1979).
      - __multicognitives__ : le jeu applique plusieurs concepts à la fois,
        d'où un excès cognitif (position d'Allison).
      - __métacognitives__ : le divers est représenté comme ayant une unité
        excédant ce qu'exige la connaissance (la position que Guyer
        lui-même privilégie en 2006).
    points:
      - id: ea2-l4-p1
        sentence: "Kant qualifie l'activité de l'imagination dans le libre jeu, à la fois réglée et non gouvernée par un concept déterminé, de « légalité ___ »."
        answer: "sans loi"
        alt: []
      - id: ea2-l4-p2
        sentence: "Pour rendre intelligible le libre jeu, ___ en appelle à la phénoménologie de l'expérience esthétique, par exemple celle de la contemplation d'une peinture abstraite, où le sujet perçoit un ordre et une unité non conceptuels entre les éléments."
        answer: "Bell"
        alt: []
        explanation: "Bell 1987."
      - id: ea2-l4-p3
        sentence: "Parmi les commentateurs qui situent le libre jeu dans la théorie kantienne de l'imagination de la Critique de la raison pure, ___ l'identifie aux deux premières étapes de la « triple synthèse » de la première édition de la Déduction transcendantale."
        answer: "Guyer"
        alt: []
      - id: ea2-l4-p4
        sentence: "___ propose au contraire d'y voir une activité de schématisation de concepts purs, qui se passe cette fois de tout concept empirique."
        answer: "Makkreel"
        alt: []
        explanation: "Makkreel 1990."
      - id: ea2-l4-p5
        sentence: "___ explique le libre jeu par le sens commun invoqué par Kant au paragraphe 20, qu'elle comprend comme une forme intensive de sensibilité, par contraste avec les formes extensives que sont l'espace et le temps."
        answer: "Zinkin"
        alt: []
        explanation: "Zinkin 2006."
      - id: ea2-l4-p6
        sentence: "___ propose une lecture du libre jeu dérivée de sa lecture en un seul acte du jugement de goût : être en libre jeu, pour l'imagination et l'entendement, ce serait simplement se trouver dans un état d'esprit perceptif qui revendique, sans concept, sa propre validité universelle à l'égard de l'objet perçu."
        answer: "Ginsborg"
        alt: []
        explanation: "Ginsborg 1997a."
      - id: ea2-l4-p7
        sentence: "Un problème interprétatif plus général complique la lecture du libre jeu : celui du statut de ce que les commentateurs appellent la « psychologie transcendantale » de Kant : s'agit-il d'un processus psychologique naturel, soumis aux lois causales, ou d'une condition ___ de la connaissance ?"
        answer: "a priori"
        alt: []
      - id: ea2-l4-p8
        sentence: "___ défend, dès 1979 puis explicitement dans son ouvrage de 2008, une lecture pleinement naturaliste du libre jeu, allant jusqu'à rejeter la prétention kantienne à un principe a priori ou transcendantal, pour ne voir dans l'esthétique kantienne qu'une contribution à la psychologie empirique du goût."
        answer: "Guyer"
        alt: []
      - id: ea2-l4-p9
