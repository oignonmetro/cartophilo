id: ea2
title: "La déduction du jugement de goût et ses débats"
subtitle: "Comment un jugement fondé sur le seul sentiment peut prétendre à l'assentiment de tous"
icon: compass
color: violet
group: "L'esthétique de Kant"
lessons:
  - id: ea2-l1
    title: "Le problème de la déduction et l'argument du jeu libre"
    notes: |
      Le jugement de goût combine **deux ensembles de traits apparemment
      opposés** : d'un côté il repose sur un sentiment, ne subsume l'objet sous
      aucun concept et ne peut être démontré : ce qui le rapprocherait du
      jugement de l'agréable ; de l'autre, contrairement à l'agréable, il ne
      dépend d'aucun désir pour l'objet et revendique l'assentiment de tous :
      ce qui le rapprocherait des jugements cognitifs objectifs.

      Kant s'oppose ainsi à la fois à la tradition __empiriste__ (Hume,
      Hutcheson, Burke), pour qui le jugement de goût est **une pure
      expression du sentiment** sans contenu cognitif, et à la tradition
      __rationaliste__ (Baumgarten, Meier), pour qui il consiste en **la
      connaissance d'une propriété objective** de l'objet.

      Kant formule le problème ainsi : comment un jugement peut-il, à partir
      du seul sentiment de plaisir qu'on éprouve pour un objet, indépendamment
      de son concept, juger ce plaisir attaché à la représentation de ce même
      objet chez tout autre sujet, et cela **a priori** : sans attendre
      l'assentiment d'autrui ?

      Sa réponse officielle, la **Déduction du goût**, est présentée dans la
      section « Déduction des jugements esthétiques purs » (§§31–39), avec
      l'argument principal donné au §38 ; elle est préfigurée dans
      l'Analytique du beau, aux §§9 et 22 (ce dernier sous une forme un peu
      différente, faisant appel au sens commun).

      L'argument s'appuie sur la thèse, introduite au §9, selon laquelle le
      plaisir pris au beau dépend du **libre jeu** de l'imagination et de
      l'entendement. Dans la connaissance ordinaire, l'imagination synthétise
      le divers de l'intuition sous la gouverne de règles prescrites par
      l'entendement (des concepts) : le résultat est une expérience
      perceptive déterminée (par exemple, un objet perçu comme vert et
      carré). Mais dans le jugement de goût, imagination et entendement
      s'accordent librement, sans qu'aucun concept déterminé ne gouverne
      l'imagination ; d'où une réponse non conceptuelle : **un sentiment de
      plaisir désintéressé**.

      Kant en tire son argument pour l'universalité : le libre jeu manifeste
      **la condition subjective de la connaissance** en général. Puisque
      chacun est en droit d'exiger l'assentiment de tous pour ses
      connaissances déterminées, il doit aussi être en droit d'exiger cet
      assentiment pour la condition subjective de ces connaissances, donc
      pour le libre jeu lui-même.
    points:
      - id: ea2-l1-p1
        sentence: "Kant nomme ___ l'argument par lequel il tente de justifier la prétention du jugement de goût à l'assentiment universel de tous les sujets."
        answer: "la Déduction du goût"
        alt: []
      - id: ea2-l1-p2
        sentence: "Kant présente cette déduction dans une section intitulée « Déduction des jugements esthétiques purs », ___, l'argument central se trouvant au paragraphe 38."
        answer: "aux paragraphes 31 à 39"
        alt: ["dans les paragraphes 31 à 39", "aux §§31-39"]
      - id: ea2-l1-p3
        sentence: "La Déduction du goût est préfigurée plus tôt dans l'ouvrage, dans l'Analytique du beau, ___, ce dernier paragraphe prenant une forme un peu différente, en faisant appel à la notion de sens commun."
        answer: "aux paragraphes 9 et 22"
        alt: ["aux §§9 et 22"]
      - id: ea2-l1-p4
        sentence: "Kant formule ainsi le problème de la déduction : comment un jugement est-il possible qui, du seul sentiment de plaisir éprouvé pour un objet, indépendamment de son concept, juge ce plaisir attaché à la représentation de ce même objet chez tout autre sujet, et cela a priori, c'est-à-dire sans devoir attendre ___ d'autrui ?"
        answer: "l'assentiment"
        alt: []
        explanation: "§36, Ak. 5:288."
      - id: ea2-l1-p4b
        sentence: "Kant formule ainsi le problème de la déduction : comment un jugement est-il possible qui, du seul ___ éprouvé pour un objet, indépendamment de son concept, juge ce plaisir attaché à la représentation de ce même objet chez tout autre sujet, et cela a priori, c'est-à-dire sans devoir attendre l'assentiment d'autrui ?"
        answer: "sentiment de plaisir"
        alt: []
