id: ea2
title: "La déduction du jugement de goût et ses débats"
subtitle: "Comment un jugement fondé sur le seul sentiment peut prétendre à l'assentiment de tous"
icon: compass
color: violet
group: "Kant : l'esthétique"
lessons:
- id: ea2-l1
  title: "Le problème de la déduction et l'argument du jeu libre"
  notes: |
    Le jugement de goût combine **deux ensembles de traits apparemment opposés** : d'un côté il {amber}repose sur un sentiment, ne subsume l'objet sous aucun concept et ne peut être démontré{/amber} : ce qui le rapprocherait du {pink}jugement de l'agréable{/pink} ; de l'autre, contrairement à l'agréable, il {amber}ne dépend d'aucun désir pour l'objet et revendique l'assentiment de tous{/amber} : ce qui le rapprocherait des {pink}jugements cognitifs objectifs{/pink}.

    Kant s'oppose ainsi à la fois à la tradition {red}__empiriste__{/red} ({sky}Hume, Hutcheson, Burke{/sky}), pour qui le jugement de goût est {red}**une pure expression du sentiment**{/red} sans contenu cognitif, et à la tradition {pink}__rationaliste__{/pink} ({sky}Baumgarten, Meier{/sky}), pour qui il consiste en {pink}**la connaissance d'une propriété objective**{/pink} de l'objet.

    Kant formule le problème ainsi (§36) : comment un jugement peut-il, {amber}à partir du seul sentiment de plaisir qu'on éprouve pour un objet{/amber}, indépendamment de son concept, {amber}juger ce plaisir attaché à la représentation de ce même objet chez tout autre sujet{/amber}, et cela {blue}*a priori*{/blue} : {coral}sans attendre l'assentiment d'autrui{/coral} ?

    Sa réponse officielle, la {violet}**Déduction du goût**{/violet}, est présentée dans la section {sky}« Déduction des jugements esthétiques purs » (§§31–39){/sky}, avec l'argument principal donné au {sky}§38{/sky} ; elle est préfigurée dans l'{sky}Analytique du beau, aux §§9 et 22{/sky} (ce dernier sous une forme un peu différente, faisant appel au {violet}sens commun{/violet}).

    L'argument s'appuie sur la thèse, introduite au §9, selon laquelle {green}le plaisir pris au beau dépend du **libre jeu** de l'imagination et de l'entendement{/green}. Dans la {pink}connaissance ordinaire{/pink}, l'imagination synthétise le divers de l'intuition {pink}sous la gouverne de règles prescrites par l'entendement (des concepts){/pink} : le résultat est une expérience perceptive déterminée (par exemple, {yellow}un objet perçu comme vert et carré{/yellow}). Mais dans le jugement de goût, {green}imagination et entendement s'accordent librement{/green}, {coral}sans qu'aucun concept déterminé ne gouverne l'imagination{/coral} ; d'où une réponse non conceptuelle : {green}**un sentiment de plaisir désintéressé**{/green}.

    Kant en tire son argument pour l'universalité : le libre jeu manifeste {amber}**la condition subjective de la connaissance**{/amber} en général. Puisque {amber}chacun est en droit d'exiger l'assentiment de tous pour ses connaissances déterminées{/amber}, {coral}il doit aussi être en droit d'exiger cet assentiment pour la condition subjective de ces connaissances, donc pour le libre jeu lui-même{/coral}.
  points:
  - id: ea2-l1-p1
    sentence: "Kant nomme ___ l'argument par lequel il tente de justifier la prétention du jugement de goût à l'assentiment universel de tous les sujets."
    answer: "la Déduction du goût"
    alt: []
  - id: ea2-l1-p2
    sentence: "Kant présente la Déduction du goût dans une section intitulée « Déduction des jugements esthétiques purs », aux §___, l'argument central se trouvant au paragraphe 38."
    answer: "31 à 39"
    alt: []
  - id: ea2-l1-p3
    sentence: "La Déduction du goût est préfigurée plus tôt dans l'ouvrage, dans l'Analytique du beau, aux §___, ce dernier prenant une forme un peu différente, en faisant appel à la notion de sens commun."
    answer: "9 et 22"
    alt: []
