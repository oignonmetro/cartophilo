      - id: ea2-l1-p4c
        sentence: "Kant formule ainsi le problème de la déduction : comment un jugement est-il possible qui, du seul sentiment de plaisir éprouvé pour un objet, indépendamment de son ___, juge ce plaisir attaché à la représentation de ce même objet chez tout autre sujet, et cela a priori, c'est-à-dire sans devoir attendre l'assentiment d'autrui ?"
        answer: "concept"
        alt: []
        explanation: "§36, Ak. 5:288."
      - id: ea2-l1-p4d
        sentence: "Kant formule ainsi le problème de la déduction : comment un jugement est-il possible qui, du seul sentiment de plaisir éprouvé pour un objet, indépendamment de son concept, juge ce plaisir attaché à la représentation de ce même objet chez tout autre sujet, et cela ___, c'est-à-dire sans devoir attendre l'assentiment d'autrui ?"
        answer: "a priori"
        alt: []
        explanation: "§36, Ak. 5:288."
      - id: ea2-l1-p5
        sentence: "Kant s'oppose à la tradition empiriste de l'esthétique du dix-huitième siècle, représentée par Hume, Hutcheson et Burke, pour qui le jugement de goût est une pure expression du ___, sans contenu cognitif."
        answer: "sentiment"
        alt: []
      - id: ea2-l1-p6
        sentence: "Il s'oppose également à la tradition rationaliste, représentée par Baumgarten et Meier, pour qui le jugement de goût consiste en la connaissance d'une propriété ___ de l'objet."
