  - id: ea2-l10
    title: "Validité universelle et communicabilité universelle"
    notes: |
      Kant emploie souvent, l'une pour l'autre, les expressions
      « {coral}validité universelle{/coral} » et « {coral}**communicabilité
      universelle**{/coral} » pour caractériser la prétention du jugement de
      beauté ; Guyer relève d'ailleurs plusieurs passages où Kant semble les
      employer de façon **interchangeable**.

      Plusieurs commentateurs récents (Makkai, Vaccarino Bremner et Sethi)
      soutiennent au contraire qu'**il faut distinguer les deux notions** :
      la {coral}communicabilité universelle{/coral} ne se limite pas à
      revendiquer la validité universelle, elle concerne la possibilité de
      littéralement __communiquer__ son sentiment dans l'objet à autrui : de
      faire en sorte qu'un autre puisse effectivement
      le partager.
    points:
      - id: ea2-l10-p1
        sentence: "Kant emploie souvent, l'une pour l'autre, les expressions « validité universelle » et « ___ » pour caractériser la prétention du jugement de beauté."
        answer: "communicabilité universelle"
        alt: []
      - id: ea2-l10-p2
        sentence: "___ relève plusieurs passages où Kant semble employer ces deux expressions de façon interchangeable, ce qui a conduit une grande partie du commentaire à les traiter comme équivalentes."
        answer: "Guyer"
        alt: []
        explanation: "Guyer 1979."
      - id: ea2-l10-p3
        sentence: "Plusieurs commentateurs récents soutiennent au contraire qu'il faut distinguer les deux notions : la communicabilité universelle ne se limite pas à revendiquer la validité universelle, mais concerne la possibilité de littéralement ___ son sentiment dans l'objet à autrui."
        answer: "communiquer"
        alt: []
      - id: ea2-l10-p4
        sentence: "Makkai, Vaccarino Bremner et Sethi comptent parmi les commentateurs qui insistent sur la distinction entre validité universelle et communicabilité universelle, cette dernière impliquant la possibilité de faire effectivement partager son sentiment à ___."
        answer: "autrui"
        alt: []
