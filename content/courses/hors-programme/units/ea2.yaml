        alt: []
      - id: ea2-l1-p7
        sentence: "L'argument de la déduction s'appuie sur la thèse, introduite au paragraphe 9, selon laquelle le plaisir pris au beau dépend du ___ de l'imagination et de l'entendement, aussi appelé leur libre harmonie."
        answer: "libre jeu"
        alt: []
      - id: ea2-l1-p8
        sentence: "Dans la connaissance ordinaire, l'imagination synthétise le divers de l'intuition sous la gouverne de règles prescrites par l'entendement ; dans le jugement de goût au contraire, l'imagination s'accorde librement avec l'entendement sans être ___ par lui."
        answer: "contrainte"
        alt: ["gouvernée"]
