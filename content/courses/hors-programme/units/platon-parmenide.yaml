- id: platon-parmenide-i18
  title: "Repérer les six objections"
  notes: |-
    **Les six objections de Parménide (130a-134e) se suivent dans un ordre qui a sa logique : chaque fois que Socrate tente une issue, Parménide lui oppose une nouvelle objection.** Les deux premières portent sur la question « de quoi y a-t-il des Formes ? » et sur la participation ; puis Socrate propose tour à tour trois issues (le jour, les pensées, les modèles), et chacune est réfutée.

    | Rang | Objection | Pages | Ce qui est visé | Images et exemples pour la reconnaître |
    | 1 | l'étendue des Formes | 130a-e | de quoi y a-t-il une Forme ? | cheveu, boue, crasse ; « tu es encore jeune » |
    | 2 | le dilemme du tout et de la partie | 130e-131e | la participation comme partage (modèle du gâteau) | le jour et le voile ; le Grand, l'Égal, le Petit |
    | 3 | le troisième homme | 132a-b | l'un-au-dessus-de-plusieurs avec l'auto-prédication | embrasser du regard le Grand et les choses grandes ; « ne sera désormais plus une » |
    | 4 | les Formes comme pensées | 132b-c | la thèse noématique proposée par Socrate | la pensée qui a un objet ; tout penserait (panpsychisme) |
    | 5 | la régression de la ressemblance | 132c-133a | le paradigmatisme proposé par Socrate | modèles et copies ; la symétrie de la ressemblance |
    | 6 | la plus grande difficulté | 133a-134e | la séparation : les Formes ne sont pas « dans notre monde » | le Maître et l'Esclave ; la Science en soi ; les dieux |

    **Le fil des répliques :**
    - Parménide demande de quoi il y a des Formes (1), puis comment on y participe : tout entière ou en partie (2).
    - Socrate propose le **jour** ; Parménide le change en **voile** (2).
    - Parménide fait surgir une Forme au-dessus de la Forme (3) ; Socrate propose que les Formes soient des **pensées** ; Parménide réfute (4).
    - Socrate propose que les Formes soient des **modèles** ; Parménide réfute par la symétrie de la ressemblance (5).
    - Parménide conclut sur la difficulté « la plus importante » : les Formes resteraient inconnaissables, et les dieux ignoreraient nos affaires (6).

    **Trois objections produisent une régression à l'infini** (3, 4 et 5) ; ne pas les confondre : le troisième homme repose sur l'auto-prédication, la régression de la ressemblance sur la symétrie, celle des pensées sur le fait que toute pensée a pour objet une Forme.

    ! Le jour n'est pas une objection mais une __parade__ de Socrate, retournée par Parménide à l'intérieur de la deuxième objection.
