    sentence: "Dans le troisième homme, __c'est l'___ qui fait de l'Idée du Grand une chose grande de plus__, qui **rejoint la pluralité des choses grandes**."
    answer: "auto-prédication"
    alt: ["autoprédication"]
  - id: platon-parmenide-i7-p5
    sentence: "Dans le troisième homme, __c'est la ___ qui oblige l'Idée G2__, dont G1 participe, à être **distincte de G1**."
    answer: "non-identité"
    alt: ["non identité"]
  - id: platon-parmenide-i7-p6
    sentence: "Dans le troisième homme, __c'est l'___ qui pose une nouvelle Idée du Grand__ au-dessus de **chaque nouvelle pluralité** de choses grandes."
    answer: "un-au-dessus-de-plusieurs"
    alt: ["un au dessus de plusieurs", "un au-dessus de plusieurs"]
  - id: platon-parmenide-i7-p7
    sentence: "Les trois principes dont la combinaison produit la **régression du troisième homme** sont __l'un-au-dessus-de-plusieurs, l'auto-prédication et la__ ___."
    answer: "non-identité"
    alt: ["non identité"]
  - id: platon-parmenide-i7-p8
    sentence: "Selon le troisième homme, il n'y aurait **pas une Idée du Grand**, __mais une ___ d'Idées du Grand__."
    answer: "infinité"
    alt: []
