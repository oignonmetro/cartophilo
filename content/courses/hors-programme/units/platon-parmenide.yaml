- id: platon-parmenide-i16
  title: "Les déductions 3 à 8"
  notes: |-
    **D3 (157b-159b) : si l'un est, les autres sont F et contraire de F** : ils ont des parties et forment un tout, ils sont un et plusieurs, limités et illimités, semblables et dissemblables. Selon Rickless, D3 ne s'appuie pas sur la pureté des Idées.

    **D4 (159b-160b) : si l'un est, les autres ne sont ni F ni contraire de F** (ni un ni plusieurs, ni semblables ni dissemblables). Mais D4 dépend de D1, donc de la pureté des Idées. D3 et D4 ensemble donnent, de nouveau : **si l'un est, la pureté des Idées est fausse.**

    **D5 (160b-163b) : si l'un n'est pas, il est F et contraire de F.** Même s'il n'est pas, on peut en parler et le connaître (160d) : « de lui il y a science, sinon on ne sait même pas ce qu'on dit, quand on dit "s'il n'est pas un" » ; il diffère des autres, il est semblable à lui-même et dissemblable des autres, il participe de l'être et du non-être, il est en mouvement et en repos. D5 ne repose pas sur la pureté des Idées : **si l'un n'est pas, la pureté des Idées est fausse.** Que l'un soit ou non, elle est donc fausse.

    **D6 (163b-164b) : si l'un n'est pas, il n'est ni F ni contraire de F** : il n'est en aucune façon, on ne peut ni le nommer ni le connaître. **D5 et D6 ensemble** : si l'un n'est pas, il est F et n'est pas F, ce qui est impossible ; donc l'un est (raisonnement par l'absurde).

    **Pourquoi c'est important** : rien dans ces raisonnements ne dépend du choix de l'un ; ils vaudraient pour n'importe quelle Idée. Parménide prouve ainsi qu'il y a des Idées, et se révèle lui-même cet « homme particulièrement doué » dont il parlait, et même celui, « plus merveilleux encore », qui sait découvrir et enseigner.

    **D7 (164b-165e) : si l'un n'est pas, les autres __semblent__ F et contraire de F** : chacun semble un sans l'être, ils semblent pairs ou impairs sans l'être. Ce « semblent » s'écarte du plan annoncé, et reste un mystère. Avec D3, D7 montre que les autres sont, que l'un soit ou non.

    **D8 (165e-166c) : si l'un n'est pas, les autres ne sont ni uns ni plusieurs**, et ne peuvent même pas être conçus comme tels. Comme D7 les montre plusieurs, D7 et D8 ensemble prouvent à nouveau que l'un est.

    | Déductions combinées | Résultat selon Rickless |
    | D1 + D2, ou D3 + D4 | si l'un est, la pureté des Idées est fausse |
    | D5 | si l'un n'est pas, la pureté des Idées est fausse |
    | D5 + D6, ou D7 + D8 | l'un est |

    ! La contradiction n'est pas le dernier mot : combinées deux à deux, les déductions __prouvent__ des thèses (l'un est ; la pureté des Idées est fausse).
