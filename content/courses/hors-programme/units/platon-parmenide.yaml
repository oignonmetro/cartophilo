- id: platon-parmenide-i9
  title: "Les Idées comme pensées (132b-c)"
  notes: |-
    **Après le troisième homme, Socrate tente une issue : et si les Idées n'étaient que des pensées, qui n'existent que dans les âmes ?** « À moins, Parménide, rétorqua Socrate, que chacune de ces Formes ne soit une pensée, et que nulle part ailleurs que dans les âmes il ne convienne qu'elle ne vienne à l'existence. » (132b) C'est la thèse dite **noématique** (du grec `noêma`, la pensée). Elle aura une longue postérité : elle est à la racine de la tradition qui identifie le réel à quelque chose de mental, et des théologiens qui voient les Idées comme des pensées dans l'esprit de Dieu. Certains commentateurs (Brancacci) pensent qu'elle viendrait d'Antisthène.

    **Premier argument de Parménide : on retombe dans une régression.**
    - Toute pensée est pensée __de__ quelque chose (elle a un objet).
    - Ce que pense une pensée, c'est quelque chose d'un, qui vaut pour tous les cas : c'est-à-dire une Idée.
    - Donc, si les Idées sont des pensées, chaque Idée est la pensée d'une Idée ; celle-ci, étant aussi une pensée, est la pensée d'une autre Idée, et ainsi de suite. La régression menace de nouveau l'Unicité, et, avec la pureté des Idées, l'Unité.

    **Second argument : avec le modèle du gâteau, tout penserait.** Une pensée n'ayant pas de parties, participer d'une pensée, ce serait la recevoir tout entière. Si les Idées sont des pensées, toutes les choses seraient faites de pensées, et donc **toutes les choses penseraient** : c'est le **panpsychisme**, que Parménide juge absurde. Dira-t-on qu'une chose peut avoir une pensée en elle sans penser ? Alors il faudrait des pensées qui ne pensent pas, ce qui est absurde aussi. D'où l'alternative (132c) : « ou bien chaque Forme est constituée de pensées et chacune pense, ou bien ce sont des pensées qui ne pensent pas ».

    ! La thèse noématique ne nie pas que les Idées soient objets de pensée : elle soutient qu'elles __ne sont que__ des pensées, sans existence hors des âmes.
