- id: platon-parmenide-i10
  title: "La régression de la ressemblance (132c-133a)"
  notes: |-
    **Socrate change complètement de modèle : les Idées seraient des** {violet}**modèles**{/violet} ({blue}*paradeigmata*{/blue}), **et** {amber}**participer d'une Idée serait lui ressembler**{/amber} ({sky}132d{/sky}) : {teal}« {/teal}Alors que ces Formes sont {teal}comme des modèles{/teal} qui subsistent dans leur nature, les autres choses entretiennent avec elles {teal}un rapport de ressemblance{/teal} et en sont {teal}les copies »{/teal}. On appelle cette conception le {violet}**paradigmatisme**{/violet}. Elle n'est pas nouvelle : {sky}*La République*{/sky} et le {sky}*Timée*{/sky} présentent déjà les Idées comme des modèles dont les choses sont les copies.

    **Parménide pose d'abord que la ressemblance est** {violet}**symétrique**{/violet} **(**{sky}**132d**{/sky}**)** : {amber}si X ressemble à Y, Y ressemble à X{/amber}. {yellow}Si le portrait ressemble à Simmias, Simmias ressemble au portrait.{/yellow}

    **Deux lectures de l'objection s'opposent chez les commentateurs.**

    | Lecture | L'argument | Commentateurs |
    | {amber}un double du troisième homme{/amber} | les mêmes trois principes produisent une infinité d'Idées du F | Owen, Vlastos, Cherniss, Fine |
    | {amber}une régression propre{/amber} | la ressemblance elle-même produit une infinité d'Idées de la Ressemblance | Schofield, Allen, Rickless |

    **La seconde lecture, pas à pas.** {yellow}A et B sont tous deux F{/yellow} : ils se ressemblent. Ils sont donc semblables, et, par l'{amber}un-au-dessus-de-plusieurs{/amber}, ils participent d'une Idée de la Ressemblance, R1. Or, par le {amber}paradigmatisme{/amber}, participer de R1, c'est lui ressembler : A ressemble à R1, donc, par {amber}symétrie{/amber}, R1 ressemble à A. {coral}R1 est donc semblable, et participe à son tour d'une Idée de la Ressemblance, R2{/coral}, distincte d'elle ({amber}non-identité{/amber}) ; par le paradigmatisme et la symétrie, R2 ressemble à R1, donc est semblable, et {red}ainsi de suite{/red}.

    **Ici,** {pink}**ce n'est pas l'auto-prédication qui relance la régression**{/pink}, mais {green}la combinaison du paradigmatisme et de la symétrie{/green}. Parménide en conclut ({sky}132e{/sky}) : {teal}« {/teal}Par suite, {teal}rien ne peut être semblable à cette Forme{/teal} et {teal}cette Forme ne peut être semblable à autre chose. »{/teal} Mais A et B lui ressemblent, puisqu'ils en participent : {red}contradiction{/red}. {amber}**Pourquoi la régression gêne-t-elle ?**{/amber} On retrouve les trois réponses données pour le troisième homme : {amber}elle empêche d'expliquer{/amber}, {amber}elle contredit l'Unicité{/amber}, ou {amber}elle rend chaque Idée plusieurs{/amber}.

    ! {green}La symétrie est le ressort de l'argument{/green} : {coral}un modèle ne peut rester « au-dessus » de sa copie, puisqu'il lui ressemble __autant__ qu'elle lui ressemble{/coral}.
  points:
