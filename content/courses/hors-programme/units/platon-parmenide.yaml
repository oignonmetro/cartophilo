- id: platon-parmenide-i4
  title: "L'étendue des Idées (130a-e)"
  notes: |-
    **Première question de Parménide : y a-t-il une Idée séparée pour chaque propriété ?** Socrate répond en trois temps :

    | Idées de… | Réponse de Socrate |
    | justice, beauté, bien | certainement |
    | homme, feu, eau | il hésite |
    | cheveu, boue, crasse | il en doute franchement |

    Pour ces dernières : « à ce que nous voyons, à cela aussi je reconnais une existence, mais penser qu'il y a une Forme de ces choses, ce serait, je le crains, trop absurde » (130d). Parménide lui répond qu'il est encore jeune (130e) : « C'est que tu es encore jeune, Socrate, aurait repris Parménide, et que la philosophie ne t'a pas encore saisi de cette ferme emprise dont, c'est ma conviction, elle te saisira un jour, le jour où tu n'auras plus de mépris pour aucune de ces choses. »

    **Pourquoi ces doutes ? Trois explications sont proposées par les commentateurs.**
    - **Une erreur de jeunesse** (Allen, Sayre) : Socrate admet à tort ce qu'il ne devrait pas. Ailleurs, Platon parle bien d'une Idée de l'abeille (*Ménon*, 72b-c), de la navette (*Cratyle*, 389d), du lit et de la table (*République*, 596b). Mais on comprend mal que Platon fasse dire à son porte-parole une chose qu'il n'a aucune raison de dire.
    - **Seules certaines propriétés appellent la pensée** (Gill) : dans *La République* (523d), la vue ne nous montre jamais un doigt qui serait aussi le contraire d'un doigt, mais elle montre un doigt grand et petit à la fois, ce qui pousse l'âme à se demander ce qu'est le grand. Or l'eau ou la boue n'ont pas de contraire. Objection : ce passage explique ce qui __fait penser__ aux Idées, non pourquoi elles __existent__.
    - **Une tension entre auto-prédication et séparation** (Rickless, Miller) : que la Justice soit juste ou le Beau beau ne fait pas de ces Idées des choses sensibles. Mais si l'Homme est un homme et la Boue boueuse, comment seraient-ils autre chose que des choses sensibles, comme celles que nous voyons ? Cette lecture s'accorde avec la réponse de Socrate, qui range ces choses parmi « ce que nous voyons ».

    ! Socrate ne doute pas que la boue existe : il doute qu'il y ait une __Idée séparée__ de la boue, distincte des choses boueuses.
