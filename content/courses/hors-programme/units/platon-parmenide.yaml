- id: platon-parmenide-i3
  title: "La boîte à outils : les principes de la théorie"
  notes: |-
    **Pour suivre les objections de Parménide, il faut avoir en tête les principes de la théorie des Idées, tirés des dialogues de la maturité.** Les commentateurs leur donnent des noms commodes ; chaque objection montre que certains d'entre eux, mis ensemble, se contredisent. « F » désigne n'importe quelle propriété (grand, beau, juste) et « le F » l'Idée correspondante (le Grand, le Beau).

    | Principe | Énoncé | Source |
    | {teal}Causalité{/teal} | les choses F (autres que le F) sont F parce qu'elles participent du F | *Phédon*, 100c-101c |
    | {teal}Séparation{/teal} | le F est en lui-même et par lui-même : il est radicalement différent de ce qui en participe, et donc non identique à ces choses | *Phédon*, 100b ; *République*, V, 476b |
    | {coral}Impureté des sensibles{/coral} | les choses sensibles peuvent avoir des propriétés contraires | *Parménide*, 129c |
    | {coral}Pureté des Idées{/coral} | une Idée ne peut avoir de propriétés contraires | *Parménide*, 129b-c |
    | {violet}Un-au-dessus-de-plusieurs{/violet} | pour toute pluralité de choses F, il y a une Idée du F dont elles participent toutes | *République*, X, 596a |
    | {violet}Unicité{/violet} | pour chaque propriété F, il y a exactement une et une seule Idée du F | *République*, X, 597c (argument du « troisième lit ») |
    | {amber}Auto-prédication{/amber} | le F est lui-même F : le Beau est beau, le Grand est grand | *Hippias majeur*, *Phédon* |
    | {amber}Unité{/amber} | chaque Idée est une | *République*, V, 476a ; VII, 524b |
    | Non-identité | aucune Idée n'est identique à ce qui en participe | conséquence de la Séparation |

    **Ne pas confondre Unité et Unicité.** L'Unicité dit qu'il n'y a qu'une seule Idée du Grand. L'Unité dit que chaque Idée est *une*, au sens où elle se compte comme une chose : de même que Socrate est un parmi les sept présents, le Beau est un parce que le Beau et le Laid font deux (*République*, 475e-476a).

    **Deux principes de plus servent dans les objections** : rien de F ne peut causer chez une chose la propriété contraire de F (on ne devient pas grand par du petit, *Phédon*, 101b) : c'est le principe **pas de causalité par les contraires** ; et une chose qui a plusieurs parties est par là même plusieurs.

    ! Auto-prédication et pureté des Idées se combinent : si le Grand est grand, et qu'il ne peut avoir de propriété contraire, alors le Grand ne peut __en aucun sens__ être petit.
