- id: platon-parmenide-i5
  title: "Le dilemme du tout et de la partie (1) : l'Idée entière"
  notes: |-
    **Parménide examine maintenant ce que veut dire « participer ». Il propose ce qu'on peut appeler le modèle du gâteau** : participer d'une Idée, ce serait en recevoir une part, comme ceux qui partagent un gâteau en reçoivent chacun une part. Deux versions :
    - **le gâteau entier** : chaque chose qui participe reçoit l'Idée tout entière ;
    - **la part de gâteau** : chaque chose reçoit seulement une partie de l'Idée.
    Parménide montre que, dans les deux cas, la théorie se contredit : c'est un dilemme.

    **Première branche, l'Idée entière.** Soient trois choses grandes, A, B, C, en trois lieux différents au même moment. Par la Causalité, chacune participe du Grand ; avec le modèle du gâteau entier, le Grand tout entier est en A, tout entier en B, tout entier en C. Une même Idée est donc tout entière en trois lieux séparés : « c'est, par conséquent, en restant une et identique qu'elle se trouverait en sa totalité en plusieurs choses distinctes et que en même temps elle se trouverait ainsi elle-même distincte d'elle-même » (131b).

    **Pourquoi est-ce absurde ?** Pour certains commentateurs, être distinct de soi-même est absurde en soi. Pour d'autres, l'absurdité vient de ce qu'une chose distincte d'elle-même n'est plus une : la même Idée serait trois choses, ce qui contredit l'Unité.

    **La parade de Socrate : le jour.** « c'est à la manière du jour qui, restant un et identique, se trouve en plusieurs endroits en même temps et n'en est pour si peu distinct de lui-même » (131b). Une Idée pourrait de même être en plusieurs choses sans être distincte d'elle-même. **Parménide la retourne : le jour est comme un voile** étendu sur plusieurs personnes ; chacune n'est couverte que par une partie du voile. Comparer l'Idée au jour revient donc au modèle de la part de gâteau, la seconde branche du dilemme.

    **Plusieurs commentateurs jugent cette réduction abusive** : un jour, comme intervalle de temps ou comme lumière, pourrait bien être tout entier en plusieurs lieux. Mais on répond qu'un intervalle de temps n'est pas dans des lieux (Allen, Rickless), et que ce ne sont pas les mêmes rayons qui éclairent des lieux différents.

    ! La parade du jour ne sauve pas l'Idée : selon Parménide, elle __ramène__ à l'autre branche du dilemme.
