- id: platon-parmenide-i17
  title: "Que conclure du Parménide ?"
  notes: |-
    **Le dialogue s'achève sur une phrase déroutante** (166c) : « selon toute apparence, "s'il est un" ou "s'il n'est pas un", lui et les autres choses dans leurs rapports avec eux-mêmes et dans leurs rapports mutuels présentent et ne présentent pas de toutes les façons toutes les caractéristiques, paraissent et ne paraissent pas les présenter ». **Les commentateurs sont profondément divisés sur trois questions** : que valent les critiques de Parménide ? à quoi sert l'exercice de la seconde partie ? et comment la seconde partie répond-elle à la première ?

    | Lecture | Thèse | Difficulté |
    | satire (Tabak) | le dialogue entier serait une parodie | les liens logiques entre ses parties la rendent peu probable |
    | perplexité honnête (Vlastos, Gill, Allen) | Platon expose des difficultés qu'il ne sait pas encore résoudre | Parménide dit qu'un homme particulièrement doué peut défendre les Formes, et le fait |
    | sophismes à diagnostiquer (Meinwald, Peterson) | les critiques sont fautives, et l'exercice apprend à voir pourquoi | toutes les versions du troisième homme ne deviennent pas fautives (Frances) |
    | lecture ésotérique (Miller) | les critiques ne valent que si l'on pense les Idées comme des choses sensibles | sous la surface du texte, tout devient permis |
    | abandon de principes (Rickless) | critiques et déductions sont sérieuses et valides | la plus grande difficulté reste sans réponse |

    **La distinction de Meinwald.** « X est F » peut se dire **relativement à soi** (`pros heauto`) : être F fait partie de la définition de X ; ou **relativement aux autres** (`pros ta alla`) : X présente le trait F. Ainsi, « le Grand est grand » relativement à soi veut dire qu'être grand fait partie de ce qu'est le Grand, non que le Grand serait une grande chose parmi d'autres. Dès lors, l'Idée du Grand ne rejoint pas la pluralité des choses grandes, et la régression du troisième homme serait bloquée.

    **La lecture de Rickless.** Les critiques montrent que la théorie de la maturité est incohérente, avec le modèle du gâteau comme avec le paradigmatisme. Trois principes suffisent à lever toutes ces incohérences, sauf la plus grande difficulté : **la pureté des Idées, l'Unicité, et « pas de causalité par les contraires »**. Les déductions prouvent qu'il y a des Idées, et que ces trois principes sont faux. Platon garde l'essentiel : **l'un-au-dessus-de-plusieurs et la séparation**. La plus grande difficulté reste un chantier ouvert.

    ! Le *Parménide* n'est pas forcément un aveu d'échec de la théorie des Idées : pour plusieurs lectures, il la __corrige__ sans l'abandonner.
