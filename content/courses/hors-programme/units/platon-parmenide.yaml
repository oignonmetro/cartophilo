- id: platon-parmenide-i5
  title: "Le dilemme du tout et de la partie (1) : l'Idée entière"
  notes: |-
    **Parménide examine maintenant ce que veut dire** {violet}**« participer »**{/violet}**. Il propose ce qu'on peut appeler le** {yellow}**modèle du gâteau**{/yellow} : {amber}participer d'une Idée, ce serait en recevoir une part{/amber}, comme ceux qui partagent un gâteau en reçoivent chacun une part. Deux versions :
    - {yellow}**le gâteau entier**{/yellow} : {amber}chaque chose qui participe reçoit l'Idée tout entière{/amber} ;
    - {yellow}**la part de gâteau**{/yellow} : {amber}chaque chose reçoit seulement une partie de l'Idée{/amber}.
    Parménide montre que, dans les deux cas, {red}la théorie se contredit{/red} : c'est un {violet}dilemme{/violet}.

    **Première branche, l'Idée entière.** Soient {yellow}trois choses grandes, A, B, C, en trois lieux différents au même moment{/yellow}. Par la {amber}Causalité{/amber}, chacune participe du Grand ; avec le modèle du gâteau entier, le Grand tout entier est en A, tout entier en B, tout entier en C. {red}Une même Idée est donc tout entière en trois lieux séparés{/red} : {teal}« {/teal}c'est, par conséquent, en restant {teal}une et identique{/teal} qu'elle se trouverait {teal}en sa totalité en plusieurs choses distinctes{/teal} et que en même temps elle se trouverait ainsi {teal}elle-même distincte d'elle-même »{/teal} ({sky}131b{/sky}).

    {amber}**Pourquoi est-ce absurde ?**{/amber} Pour certains commentateurs, {coral}être distinct de soi-même est absurde en soi{/coral}. Pour d'autres, l'absurdité vient de ce qu'{coral}une chose distincte d'elle-même n'est plus une{/coral} : la même Idée serait trois choses, {red}ce qui contredit l'Unité{/red}.

    **La parade de Socrate : le** {yellow}**jour**{/yellow}**.** {teal}« {/teal}c'est à la manière {teal}du jour{/teal} qui, {teal}restant un et identique{/teal}, se trouve {teal}en plusieurs endroits en même temps{/teal} et n'en est pour si peu {teal}distinct de lui-même »{/teal} ({sky}131b{/sky}). {green}Une Idée pourrait de même être en plusieurs choses sans être distincte d'elle-même.{/green} **Parménide la retourne : le jour est comme un** {yellow}**voile**{/yellow} étendu sur plusieurs personnes ; {coral}chacune n'est couverte que par une partie du voile{/coral}. Comparer l'Idée au jour {red}revient donc au modèle de la part de gâteau{/red}, la seconde branche du dilemme.

    **Plusieurs commentateurs jugent cette réduction** {pink}**abusive**{/pink} : {pink}un jour, comme intervalle de temps ou comme lumière, pourrait bien être tout entier en plusieurs lieux{/pink}. Mais on répond qu'{coral}un intervalle de temps n'est pas dans des lieux{/coral} ({sky}Allen, Rickless{/sky}), et que {coral}ce ne sont pas les mêmes rayons qui éclairent des lieux différents{/coral}.

    ! La parade du jour {red}ne sauve pas l'Idée{/red} : selon Parménide, elle {coral}__ramène__ à l'autre branche du dilemme{/coral}.
