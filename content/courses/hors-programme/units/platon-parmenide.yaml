- id: platon-parmenide-i20
  title: "Les six problèmes de la théorie (130a-134e)"
  notes: |-
    **Une fois les principes en main, voici ce que Parménide leur oppose : six problèmes, qui occupent tout le début du dialogue (**{sky}**130a-134e**{/sky}**).** Chacun met la théorie des Idées en difficulté sur un point différent : {amber}ce dont il y a des Idées{/amber}, {amber}la façon dont les choses y participent{/amber}, {amber}ce qu'est une Idée{/amber}, et {amber}comment on peut la connaître{/amber}.

    | Rang | Problème | Passage | En une phrase |
    | 1 | l'étendue des Formes | 130a-e | y a-t-il une Forme pour toute propriété, même pour le cheveu, la boue, la crasse ? |
    | 2 | le dilemme du tout et de la partie | 130e-131e | participer à une Forme, est-ce l'avoir tout entière, ou en avoir une part ? les deux semblent absurdes |
    | 3 | le troisième homme | 132a-b | si la Forme de l'Homme est elle-même un homme (principe d'auto-prédication), alors il faut une autre Forme pour l'unifier avec ses instanciations (principe de l'Un-au-dessus-de-plusieurs), et ainsi de suite |
    | 4 | les Formes comme pensées | 132b-c | si les Formes sont des pensées, les choses qui en participent pensent aussi |
    | 5 | la régression de la ressemblance | 132c-133a | si les choses ressemblent à leur modèle, le modèle leur ressemble aussi, et il faut un modèle plus haut |
    | 6 | la plus grande difficulté | 133a-134e | séparées de nous, les Formes seraient inconnaissables, et les dieux ignoreraient nos affaires |

    **Comment les lire.** Les deux premiers problèmes sont {amber}posés par Parménide à Socrate{/amber} ; les trois suivants {amber}répondent aux issues que Socrate propose{/amber} (les Idées comme pensées, comme modèles) ; le sixième {amber}tire la conséquence de la séparation{/amber}. Trois d'entre eux (3, 4 et 5) produisent une {violet}régression à l'infini{/violet}.

    ! Ces six problèmes seront repris un à un dans les leçons suivantes, puis rassemblés dans « Repérer les six objections ».
