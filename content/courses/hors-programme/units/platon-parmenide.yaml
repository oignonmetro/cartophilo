- id: platon-parmenide-i8
  title: "Le troisième homme (2) : où est le problème ?"
  notes: |-
    **Une régression à l'infini** {pink}**n'est pas absurde en elle-même**{/pink} ({yellow}la suite des nombres est infinie sans contradiction{/yellow}). Il faut donc dire {amber}en quoi celle du troisième homme gêne la théorie{/amber}. Trois réponses sont défendues par les commentateurs.

    | Lecture | Ce qui ne va pas | Commentateurs |
    | {amber}épistémique{/amber} | une Idée doit expliquer et faire connaître les choses F ; une chaîne d'explications sans fin n'explique rien | Vlastos, Fine |
    | {amber}contre l'Unicité{/amber} | il y aurait plusieurs Idées du Grand, voire une infinité, alors qu'il ne doit y en avoir qu'une | nombreux commentateurs |
    | {amber}contre l'Unité{/amber} | chaque Idée deviendrait elle-même infiniment plusieurs | Rickless |

    {violet}**La lecture épistémique**{/violet} {green}rend compte du vocabulaire de la connaissance qui parsème le passage{/green}, mais {red}pas de son point de départ{/red} : {coral}Parménide part de l'Unité de l'Idée, non de son rôle d'explication{/coral}.

    **La dernière phrase du passage est décisive** : {teal}« {/teal}Par suite, {teal}chacune de tes Formes ne sera désormais plus une{/teal}, mais elle {teal}se multipliera sans limites. »{/teal} ({sky}132b{/sky}). Elle ne dit pas seulement {pink}qu'il y aura une infinité d'Idées{/pink} (contre l'Unicité), mais que {green}**chaque** Idée sera plusieurs{/green}. Selon {sky}Rickless{/sky}, {amber}G1 participe d'une infinité d'Idées (G2, G3…){/amber} ; or, avec le modèle du gâteau, {amber}participer d'une Idée, c'est en avoir une part{/amber} ; {coral}G1 a donc une infinité de parties, il est infiniment plusieurs, et par la pureté des Idées il ne peut être un{/coral}.

    {amber}**Quelle leçon ?**{/amber} Pour beaucoup, Platon doit {pink}abandonner l'un des trois principes{/pink} (un-au-dessus-de-plusieurs, auto-prédication, non-identité). Pour {sky}Rickless{/sky}, {green}il lui suffit d'abandonner la **pureté des Idées**{/green} (et peut-être l'Unicité).

    ! Ne pas réduire la conclusion du troisième homme à {red}« il y a trop d'Idées »{/red} : Parménide dit que {green}__chacune__ des Formes « ne sera désormais plus une »{/green}.
