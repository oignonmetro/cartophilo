- id: platon-parmenide-i11
  title: "La plus grande difficulté (1) : nous ne connaîtrions pas les Idées"
  notes: |-
    **Parménide garde pour la fin ce qu'il appelle la plus grande difficulté (133a-134e)**, en deux arguments : si les Idées sont telles que Socrate le dit, (1) les hommes ne peuvent pas les connaître, et (2) les dieux ne peuvent pas connaître les affaires humaines. Les deux conclusions ruineraient la théorie : dans les dialogues de la maturité, connaître les Idées est le but même de la dialectique, et Socrate trouve « trop déconcertant » l'argument qui prive la divinité du savoir (134e).

    **Une notion clef : l'être relatif.** Une chose a un être relatif quand on ne peut dire ce qu'elle est sans mentionner autre chose : un maître n'est maître que d'un esclave, une science n'est science que de quelque chose. Les prémisses :
    - P1. Rien de ce qui est en soi et par soi n'est en nous (133c : « toi et tout autre personne qui posez qu'il y a de chaque chose une réalité en soi admettriez, pour commencer, qu'aucune de ces réalités ne se trouve dans notre monde »).
    - P2. Si une Idée est ce qu'elle est relativement à quelque chose, ce quelque chose est une Idée.
    - P3. Si une chose qui est en nous est ce qu'elle est relativement à quelque chose, ce quelque chose est en nous.
    - P4. La science est ce qu'elle est relativement à ce dont elle est la science.

    **Les exemples de Parménide** (133e) : « La Maîtrise en soi, c'est par rapport à l'Esclavage en soi qu'elle est ce qu'elle est, et de même c'est par rapport à la Maîtrise en soi que l'Esclavage en soi est esclavage. » Un maître humain, lui, est maître d'un esclave humain, non de l'Esclavage en soi.

    **Le raisonnement.** Notre science est en nous ; par P4 et P3, son objet est donc en nous. Or, par la séparation et P1, aucune Idée n'est en nous. Donc notre science n'a jamais une Idée pour objet : **les hommes ne connaissent aucune Idée** (134b-c) : « Il s'ensuit que restent inconnaissables pour nous et le Beau en soi, ce qu'est le Beau, et le Bien et tout ce que nous admettons comme Formes en soi. »

    **Comment comprendre P2 et P3 ? Un débat.** Prises au pied de la lettre, les formules de Parménide disent que les Formes n'ont de rapport qu'aux Formes, et les choses qu'aux choses (134a) : « c'est sur elles-mêmes que les Formes ont de l'efficace et c'est avec elles-mêmes qu'elles entretiennent des rapports ; et pareillement les choses sensibles n'entretiennent de rapports qu'entre elles ». C'est la lecture de nombreux commentateurs (Ryle, Cherniss, Allen, Gill). Mais alors aucune chose ne pourrait plus participer d'une Forme ! D'autres commentateurs (Peterson, Rickless, Fine) lisent donc ces prémisses comme portant seulement sur la __définition__ de ce qui a un être relatif : ce qu'est la Maîtrise se définit par l'Esclavage, non par un esclave.

    ! Si l'on prend P2 et P3 au pied de la lettre, la participation elle-même devient impossible : c'est pourquoi plusieurs lectures les font porter seulement sur ce qui __définit__ une chose relative.
