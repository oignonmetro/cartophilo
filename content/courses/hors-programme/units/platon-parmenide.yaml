- id: platon-parmenide-i13
  title: "Sauver les Idées : le programme de l'exercice (134e-137c)"
  notes: |-
    **On s'attendrait à ce que Parménide conclue qu'il faut** {pink}**abandonner les Idées**{/pink}**. Il fait exactement l'inverse** : {green}il faut les sauver{/green}, car celui qui refuse de poser une Forme pour chaque chose {teal}« {/teal}ne saura de quel côté {teal}tourner sa pensée »{/teal} : {teal}« {/teal}il n'admet point que pour chaque chose il y a {teal}une Forme qui est toujours la même{/teal} ; et, par suite, il {teal}détruira toute possibilité de pratiquer la dialectique »{/teal} ({sky}135b-c{/sky}). {violet}« Dialectique »{/violet} peut s'entendre {amber}au sens technique{/amber} (la méthode par laquelle le philosophe connaît les Idées, {sky}*République*, 534b-c{/sky}) ou {amber}au sens courant{/amber} (la capacité de discuter, de communiquer) : dans les deux cas, {coral}sans Idées, plus de pensée commune{/coral}.

    **Il prévient pourtant que ce sera** {red}**difficile**{/red} : {teal}« {/teal}Et ce serait {teal}un homme particulièrement doué{/teal}, celui à qui on pourrait faire comprendre qu'il y a de chaque chose {teal}un Genre, un être en soi et par soi. »{/teal} ({sky}135a-b{/sky}).

    **Le remède est un** {green}**entraînement**{/green}, que le grand nombre qualifie de {teal}« {/teal}{pink}bavardages{/pink}{teal} »{/teal} ({sky}135d{/sky}). Il imite {amber}la méthode de Zénon{/amber}, mais {amber}l'applique aux Formes{/amber} ({sky}135e{/sky}) : {teal}« {/teal}il faut ne laisser l'enquête s'égarer {teal}ni dans les choses visibles{/teal} ni même dans ce qui les concerne, mais l'appliquer {teal}aux choses qui sont par excellence objets de la raison{/teal} et dont on pourrait estimer que {teal}ce sont des Formes »{/teal}. Selon {sky}Rickless{/sky}, c'est que {coral}les Formes, elles aussi, semblent recevoir des propriétés contraires{/coral}. Sa forme ({sky}136a{/sky}) :
    - poser qu'une Idée {amber}**est**{/amber}, et tirer les conséquences ; puis poser qu'elle {amber}**n'est pas**{/amber}, et tirer les conséquences ;
    - examiner les conséquences {amber}pour l'Idée elle-même{/amber}, et {amber}pour les **autres**{/amber} (tout ce qui n'est pas elle) ;
    - examiner chaque fois les choses {amber}relativement à elles-mêmes{/amber} et {amber}relativement aux autres{/amber}.

    **Parménide fait lui-même l'exercice sur l'Idée de l'**{violet}**un**{/violet}, avec le jeune {sky}Aristote{/sky} pour interlocuteur, mais il dit qu'il faudrait le refaire pour {yellow}la ressemblance, la dissemblance, le mouvement et le repos, la génération et la corruption, l'être et le non-être{/yellow} ({sky}136b{/sky}). Les propriétés examinées sont nombreuses : {yellow}être plusieurs, être un tout, avoir une figure, être en soi ou en autre chose, être en mouvement ou en repos, même ou autre, semblable ou dissemblable, égal ou inégal, plus vieux ou plus jeune, être dans le temps, être nommé, connu, perçu{/yellow}.

    **On compte d'ordinaire huit déductions, plus un appendice aux deux premières** ({sky}155e-157b{/sky}) ; les néoplatoniciens en comptaient neuf. En français, on les appelle souvent les {violet}« hypothèses »{/violet} ; {sky}Luc Brisson{/sky} tient l'appendice pour un corollaire de la deuxième hypothèse, et formule l'hypothèse « s'il est un ».

    ! Le but déclaré de l'exercice {red}n'est pas de détruire les Idées{/red}, mais de {green}les __sauver__{/green} : Parménide maintient qu'il y a, pour chaque chose, une Idée.
  points:
  - id: platon-parmenide-i13-p1
    sentence: "Parménide refuse d'abandonner les Formes : celui qui les rejette « il n'admet point que pour chaque chose il y a **une Forme qui est toujours la même** ; __et, par suite,__ ___ » (*Parménide*, 135b-c)"
    answer: "il détruira toute possibilité de pratiquer la dialectique"
    alt: []
