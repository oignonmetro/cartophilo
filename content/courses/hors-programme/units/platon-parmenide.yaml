lessons:
- id: platon-parmenide-i1
  title: "Le dialogue : cadre, personnages, plan"
  notes: |-
    Le *Parménide* est sans doute **le plus énigmatique des dialogues de Platon. Il met à l'épreuve la théorie des Idées** (la traduction de Luc Brisson dit « Formes ») que Socrate défend dans les dialogues de la maturité (*Phédon*, *République*, *Banquet*) : selon cette théorie, à chaque propriété correspond une Idée unique, éternelle, immuable, indivisible et non sensible, et c'est en participant d'elle que les choses ont cette propriété (une chose belle est belle parce qu'elle participe du Beau).

    **Le cadre est une fiction racontée de troisième main.** Céphale, venu de Clazomènes, rencontre à Athènes Adimante et Glaucon, les frères de Platon ; leur demi-frère Antiphon connaît par cœur une conversation que Pythodore, chez qui elle s'est tenue, lui a rapportée. Ce triple relais signale, selon la plupart des spécialistes, que la conversation est presque certainement inventée.

    **La scène** : Parménide d'Élée, le grand défenseur de l'unité de l'être (environ 65 ans), et son disciple Zénon (environ 40 ans) sont venus à Athènes pour les Grandes Panathénées. Socrate, encore très jeune, vient écouter Zénon lire son livre. Dans la seconde partie, Parménide prend pour interlocuteur un jeune homme nommé Aristote.

    | Moment | Lieu | Contenu |
    | introduction | 126a-128e | l'argument de Zénon |
    | discours de Socrate | 128e-130a | la théorie des Idées |
    | critiques de Parménide | 130a-134e | six objections à la théorie |
    | programme | 134e-137c | comment sauver les Idées : un exercice |
    | déductions | 137c-166c | huit raisonnements sur l'un, plus un appendice |

    **Ce qui fait l'accord des commentateurs** : Socrate y défend la théorie de la maturité, Parménide lui oppose des objections redoutables, puis il propose une « gymnastique » de huit déductions censée aider à protéger les Idées. **Tout le reste est discuté** : la reconstruction des objections, la structure des déductions, leur sujet, leur rapport aux objections, et la leçon finale du dialogue. Les néoplatoniciens (Plotin, puis Proclus) ont vu dans les déductions la clef de la structure hiérarchique de l'univers.

    ! L'Aristote du dialogue n'est __pas__ le philosophe : c'est un homme qui deviendra l'un des Trente Tyrans après la défaite d'Athènes face à Sparte.
