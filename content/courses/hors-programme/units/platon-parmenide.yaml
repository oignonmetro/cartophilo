- id: platon-parmenide-i18
  title: "Repérer les six objections"
  notes: |-
    **Les six objections de Parménide (**{sky}**130a-134e**{/sky}**) se suivent dans un ordre qui a sa logique :** {coral}**chaque fois que Socrate tente une issue, Parménide lui oppose une nouvelle objection**{/coral}**.** Les deux premières portent sur la question {amber}« de quoi y a-t-il des Formes ? »{/amber} et sur {amber}la participation{/amber} ; puis Socrate propose tour à tour trois issues ({yellow}le jour, les pensées, les modèles{/yellow}), et {red}chacune est réfutée{/red}.

    | Rang | Objection | Pages | Ce qui est visé | Images et exemples pour la reconnaître |
    | 1 | l'étendue des Formes | 130a-e | de quoi y a-t-il une Forme ? | cheveu, boue, crasse ; « tu es encore jeune » |
    | 2 | le dilemme du tout et de la partie | 130e-131e | la participation comme partage (modèle du gâteau) | le jour et le voile ; le Grand, l'Égal, le Petit |
    | 3 | le troisième homme | 132a-b | l'un-au-dessus-de-plusieurs avec l'auto-prédication | embrasser du regard le Grand et les choses grandes ; « ne sera désormais plus une » |
    | 4 | les Formes comme pensées | 132b-c | la thèse noématique proposée par Socrate | la pensée qui a un objet ; tout penserait (panpsychisme) |
    | 5 | la régression de la ressemblance | 132c-133a | le paradigmatisme proposé par Socrate | modèles et copies ; la symétrie de la ressemblance |
    | 6 | la plus grande difficulté | 133a-134e | la séparation : les Formes ne sont pas « dans notre monde » | le Maître et l'Esclave ; la Science en soi ; les dieux |

    **Le fil des répliques :**
    - Parménide demande {amber}de quoi il y a des Formes{/amber} (1), puis {amber}comment on y participe : tout entière ou en partie{/amber} (2).
    - Socrate propose le {yellow}**jour**{/yellow} ; Parménide le change en {yellow}**voile**{/yellow} (2).
    - Parménide fait surgir {red}une Forme au-dessus de la Forme{/red} (3) ; Socrate propose que les Formes soient des {amber}**pensées**{/amber} ; Parménide réfute (4).
    - Socrate propose que les Formes soient des {amber}**modèles**{/amber} ; Parménide réfute par {coral}la symétrie de la ressemblance{/coral} (5).
    - Parménide conclut sur la difficulté « la plus importante » : {red}les Formes resteraient inconnaissables, et les dieux ignoreraient nos affaires{/red} (6).

    **Trois objections produisent une** {violet}**régression à l'infini**{/violet} (3, 4 et 5) ; ne pas les confondre : {amber}le troisième homme repose sur l'auto-prédication{/amber}, {amber}la régression de la ressemblance sur la symétrie{/amber}, {amber}celle des pensées sur le fait que toute pensée a pour objet une Forme{/amber}.

    ! Le jour {red}n'est pas une objection{/red} mais {green}une __parade__ de Socrate{/green}, retournée par Parménide à l'intérieur de la deuxième objection.
