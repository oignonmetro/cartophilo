- id: platon-parmenide-i6
  title: "Le dilemme du tout et de la partie (2) : les parts de l'Idée"
  notes: |-
    **Seconde branche : chaque chose reçoit une partie de l'Idée.** Pour éviter que la même partie soit tout entière en plusieurs lieux (on retomberait sur la première absurdité), il faut que la partie du Grand qui est en A soit distincte de celle qui est en B et de celle qui est en C. Le Grand a donc plusieurs parties distinctes : il est divisé, donc plusieurs, et il ne peut être un.

    **Pourquoi « plusieurs » interdit-il d'être « un » ?** On croit souvent que tout ce qui a des parties perd son unité. Mais Socrate vient de dire qu'il est lui-même un et plusieurs, alors qu'il a des parties ! L'explication tient à la **pureté des Idées** : avoir plusieurs parties, c'est être plusieurs ; un et plusieurs sont contraires ; or une Idée ne peut avoir de propriétés contraires ; donc le Grand, s'il est plusieurs, ne peut être un.

    **Parménide ajoute quatre absurdités tirées du même modèle.**

    | Argument | Raisonnement | Principe heurté |
    | 1. le Grand | une chose grande l'est en recevant une partie du Grand, plus petite que le Grand ; elle serait grande par du petit | pas de causalité par les contraires |
    | 2. l'Égal | une chose égale le serait par une partie de l'Égal, plus petite que lui, donc inégale à lui | pas de causalité par les contraires |
    | 3. le Petit | si le Petit a des parties, il est plus grand qu'elles, donc grand ; or il est petit | pureté des Idées (avec l'auto-prédication) |
    | 4. ajouter | recevoir une partie du Petit, c'est se la voir ajouter ; or on ne rend pas une chose petite en lui ajoutant quelque chose | absurdité directe |

    **Bilan du dilemme** : avec l'Idée entière, l'Idée est séparée d'elle-même ; avec les parts, l'Idée n'est plus une, et l'on heurte plusieurs autres principes.

    ! L'objection ne repose pas sur l'idée que le divisé ne peut être un (Socrate est un et plusieurs) : elle repose sur la __pureté__ des Idées.
