- id: platon-parmenide-i12
  title: "La plus grande difficulté (2) : les dieux ne connaîtraient pas nos affaires"
  notes: |-
    **Second argument :** {red}**les dieux ne connaîtraient pas les affaires humaines**{/red}**.**
    - (i) {amber}La science qui est une Idée (la Science en soi) est plus précise que toute science humaine.{/amber}
    - (ii) {amber}Les dieux possèdent toute science plus précise que la science humaine.{/amber}
    - Donc, **P5** : {coral}toute science qui est une Idée est possédée par les dieux{/coral}.
    - Par P2 et P4, une science qui est une Idée a pour objet une Idée ; par P1 et la séparation, aucune Idée n'est en nous. Donc, **P7** : {coral}une science qui est une Idée n'a jamais pour objet quelque chose qui est en nous{/coral}.
    - Conclusion ({sky}134e{/sky}) : {teal}« {/teal}ces entités {teal}ne peuvent{/teal}, pour la même raison, être nos maîtres et {teal}avoir connaissance des affaires humaines{/teal}, même si ce sont {teal}des divinités »{/teal}.

    {red}**L'argument n'est pas valide.**{/red} Un argument est {violet}*valide*{/violet} quand {amber}sa conclusion suit nécessairement de ses prémisses{/amber}. Ici, pour conclure, il faudrait {pink}non pas P5{/pink} (toute science-Idée est possédée par les dieux), mais sa {violet}**réciproque**{/violet}, {green}**P5 bis** : toute science que possèdent les dieux est une science-Idée{/green}. Rien n'empêche, avec P5 seule, que {coral}les dieux possèdent aussi une autre science, qui porterait sur nos affaires{/coral}. C'est l'erreur qui consiste à {red}confondre une proposition et sa réciproque{/red} ({yellow}« tous les chats sont des animaux » n'entraîne pas « tous les animaux sont des chats »{/yellow}).

    **Trois hypothèses** : {amber}Platon n'a pas vu l'erreur{/amber} ; {amber}il voulait que le lecteur la voie{/amber} ; ou {amber}il a formulé P5 par mégarde au lieu de P5 bis{/amber}.

    | | Premier argument | Second argument |
    | conclusion | les hommes ne connaissent pas les Idées | les dieux ne connaissent pas les affaires humaines |
    | prémisse sur l'être relatif | P3 (ce qui est en nous) | P2 (ce qui est Idée) |
    | validité | valide selon Rickless | non valide tel qu'il est écrit |

    ! Le second argument {pink}ne prouve donc pas sa conclusion tel qu'il est formulé{/pink} ; mais le premier, lui, {red}reste une difficulté entière pour la théorie{/red}.
