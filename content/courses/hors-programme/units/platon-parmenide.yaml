    sentence: "Objection à la lecture non standard des déductions : D2 démontre aussi que l'un est même et autre que ___ (147b)."
    answer: "lui-même"
    alt: ["soi-même", "soi"]
  - id: platon-parmenide-i14-p5
    sentence: "Selon une lecture défendue par les néoplatoniciens, Cornford et Miller, chaque déduction du *Parménide* porterait sur un « un » ___."
    answer: "différent"
    alt: []
