    answer: "130e-131e"
    alt: []
  - id: platon-parmenide-i5-p8
    sentence: "Contre ceux qui jugent abusive la **réduction du jour à la voile**, Allen et Rickless répondent qu'__un intervalle de ___ n'est pas dans des lieux__."
    answer: "temps"
    alt: []
  - id: platon-parmenide-i5-p9
    sentence: "Si la Forme est tout entière en chacune des choses qui en participent, « c'est, par conséquent, en restant **une et identique** qu'elle se trouverait en sa totalité en plusieurs choses distinctes et que en même temps __elle se trouverait ainsi elle-même__ ___ » (*Parménide*, 131b)"
    answer: "distincte d'elle-même"
    alt: []
  - id: platon-parmenide-i5-p10
    sentence: "__Socrate répond à Parménide : « c'est__ ___ qui, **restant un et identique**, se trouve en plusieurs endroits en même temps et n'en est pour si peu distinct de lui-même » (*Parménide*, 131b)"
    answer: "à la manière du jour"
    alt: []
- id: platon-parmenide-i6
  title: "Le dilemme du tout et de la partie (2) : les parts de l'Idée"
  notes: |-
    **Seconde branche : chaque chose reçoit une partie de l'Idée.** Pour éviter que la même partie soit tout entière en plusieurs lieux (on retomberait sur la première absurdité), il faut que {amber}la partie du Grand qui est en A soit distincte de celle qui est en B et de celle qui est en C{/amber}. Le Grand a donc plusieurs parties distinctes : {red}il est divisé, donc plusieurs, et il ne peut être un{/red}.

    {amber}**Pourquoi « plusieurs » interdit-il d'être « un » ?**{/amber} On croit souvent que {pink}tout ce qui a des parties perd son unité{/pink}. Mais {yellow}Socrate vient de dire qu'il est lui-même un et plusieurs, alors qu'il a des parties{/yellow} ! L'explication tient à la {green}**pureté des Idées**{/green} : {amber}avoir plusieurs parties, c'est être plusieurs{/amber} ; {amber}un et plusieurs sont contraires{/amber} ; {amber}or une Idée ne peut avoir de propriétés contraires{/amber} ; {coral}donc le Grand, s'il est plusieurs, ne peut être un{/coral}.

    **Parménide ajoute quatre absurdités tirées du même modèle.**

    | Argument | Raisonnement | Principe heurté |
    | 1. le Grand | une chose grande l'est en recevant une partie du Grand, plus petite que le Grand ; elle serait grande par du petit | pas de causalité par les contraires |
    | 2. l'Égal | une chose égale le serait par une partie de l'Égal, plus petite que lui, donc inégale à lui | pas de causalité par les contraires |
    | 3. le Petit | si le Petit a des parties, il est plus grand qu'elles, donc grand ; or il est petit | pureté des Idées (avec l'auto-prédication) |
    | 4. ajouter | recevoir une partie du Petit, c'est se la voir ajouter ; or on ne rend pas une chose petite en lui ajoutant quelque chose | absurdité directe |

    **Bilan du dilemme** : avec {amber}l'Idée entière{/amber}, {red}l'Idée est séparée d'elle-même{/red} ; avec {amber}les parts{/amber}, {red}l'Idée n'est plus une{/red}, et l'on heurte plusieurs autres principes.

    ! L'objection {red}ne repose pas sur l'idée que le divisé ne peut être un{/red} ({yellow}Socrate est un et plusieurs{/yellow}) : {green}elle repose sur la __pureté__ des Idées{/green}.
