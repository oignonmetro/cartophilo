- id: platon-parmenide-i19
  title: "Repérer les huit déductions"
  notes: |-
    **Les huit déductions (137c-166c) se rangent en deux séries de quatre**, selon l'hypothèse : « s'il est un » (D1 à D4), puis « s'il n'est pas un » (D5 à D8). Dans chaque série, les deux premières portent sur l'un lui-même, les deux suivantes sur les autres. Entre D2 et D3, l'appendice sur l'instant.

    | Déduction | Pages | Hypothèse | Sujet | Ce qu'il faut en retenir |
    | D1 | 137c-142a | l'un est | l'un | ni F ni contraire : l'un n'est pas un, il n'est pas ; ni nom ni science |
    | D2 | 142b-155e | l'un est | l'un | F et contraire : l'un qui est est infiniment plusieurs ; la plus longue |
    | appendice | 155e-157b | l'un est | l'un | le changement se fait dans l'instant, hors du temps |
    | D3 | 157b-159b | l'un est | les autres | F et contraire : un et plusieurs, limités et illimités |
    | D4 | 159b-160b | l'un est | les autres | ni F ni contraire |
    | D5 | 160b-163b | l'un n'est pas | l'un | F et contraire : « de lui il y a science » |
    | D6 | 163b-164b | l'un n'est pas | l'un | ni F ni contraire : il n'est en aucune façon |
    | D7 | 164b-165e | l'un n'est pas | les autres | les autres __paraissent__ F et contraire |
    | D8 | 165e-166c | l'un n'est pas | les autres | ni un ni plusieurs ; puis la phrase finale du dialogue |

    **Pour retenir l'alternance** : dans la lecture standard, les conclusions positives (F et contraire de F) et négatives (ni F ni contraire de F) alternent ainsi : négative, positive (D1, D2) ; positive, négative (D3, D4) ; positive, négative (D5, D6) ; positive, négative (D7, D8).

    ! L'appendice n'est pas une neuvième déduction pour la plupart des commentateurs (les néoplatoniciens en comptaient pourtant neuf) : c'est un complément aux deux premières.
