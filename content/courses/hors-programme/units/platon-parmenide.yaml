- id: platon-parmenide-i15
  title: "Les deux premières déductions et l'appendice"
  notes: |-
    {sky}**D1 (137c-142a)**{/sky} **: si l'un est, il n'est** {amber}**ni F ni le contraire de F**{/amber}**.** Les conclusions sont vertigineuses : {yellow}l'un n'est pas plusieurs, n'a pas de parties, n'est pas un tout, n'a ni commencement, ni milieu, ni fin, n'a pas de figure, n'est nulle part, n'est ni en mouvement ni en repos, ni même ni autre, ni semblable ni dissemblable, n'est pas dans le temps{/yellow} ; {red}il ne participe pas de l'être{/red}, et ({sky}141e-142a{/sky}) : {teal}« {/teal}Il apparaît, au contraire, que {teal}l'un n'est pas un et qu'il n'est pas{/teal}, s'il faut ajouter foi à {teal}cette argumentation. »{/teal} {teal}« {/teal}Par voie de conséquence, {teal}il n'y a de lui ni nom ni définition{/teal}. Il n'est de lui {teal}ni science ni sensation ni opinion. »{/teal}

    **Tout part du premier argument (D1A1)** : {amber}par l'Unité ou l'auto-prédication, l'un est un{/amber} ; {amber}un et plusieurs sont contraires{/amber} ; {coral}par la pureté des Idées, l'un n'est donc pas plusieurs{/coral}. Or la plupart des conclusions suivantes s'enchaînent à partir de celle-là. **Selon** {sky}**Rickless**{/sky}**,** {green}**toute D1 repose donc sur la pureté des Idées**{/green}**.** On peut y voir {pink}un argument contre l'Unité{/pink}, ou bien {green}la preuve que, si l'un est, la pureté des Idées est fausse{/green}.

    {sky}**D2 (142b-155e)**{/sky} **: si l'un est, il est** {amber}**F et le contraire de F**{/amber}**.** S'il est, {amber}il participe de l'être, sans être identique à l'être{/amber} ; l'un-qui-est est donc {coral}un tout dont l'un et l'être sont des parties{/coral}, et chacune de ces parties est à son tour une et étant : l'un est {coral}**infiniment plusieurs**{/coral}. Suivent toutes les paires : {yellow}l'un a des parties et est un tout, il est limité et illimité, en mouvement et en repos, même et autre, semblable et dissemblable, plus vieux et plus jeune, dans le temps{/yellow} ; {green}on peut le nommer et le connaître{/green}.

    **Ce que D1 et D2 donnent ensemble** : si la pureté des Idées est vraie et que l'un est, {red}l'un serait à la fois F et non F, ce qui est impossible{/red} ; donc, {green}**si l'un est, la pureté des Idées est fausse**{/green}. D2 heurte aussi le principe {red}« pas de causalité par les contraires »{/red} : l'un, qui est un, est aussi plusieurs.

    {sky}**L'appendice (155e-157b)**{/sky} : si l'un passe d'être F à être contraire de F, {amber}il faut un moment où il change{/amber}. Platon le place dans {violet}**l'instant**{/violet} ({blue}*exaiphnês*{/blue}) ({sky}156d{/sky}) : {teal}« {/teal}Mais {teal}l'instant, qu'on ne peut situer{/teal}, est sis {teal}entre le mouvement et le repos{/teal}, parce qu'il {teal}ne se trouve dans aucun laps de temps. »{/teal} À la différence du {pink}« maintenant »{/pink} ({blue}*nûn*{/blue}), qui {pink}est dans le temps{/pink}, {green}l'instant est hors du temps{/green} : {coral}l'un n'y est ni en mouvement ni en repos, ni un ni plusieurs{/coral}.

    ! D1 {red}ne prouve pas simplement que l'un n'existe pas{/red} : {green}elle montre ce qui suit de l'hypothèse __si l'on garde__ la pureté des Idées{/green}.
  points:
  - id: platon-parmenide-i15-p1
    sentence: "La première déduction (D1) conclut que, si l'un est, il n'est ni F ni contraire de F : **il ne participe pas de l'être**, il n'est pas, __et il n'est même pas__ ___."
    answer: "un"
    alt: []
  - id: platon-parmenide-i15-p2
    sentence: "Selon **D1**, si l'un est, __on ne peut ni le ___ ni le connaître__."
    answer: "nommer"
