- id: platon-parmenide-i17
  title: "Que conclure du Parménide ?"
  notes: |-
    **Le dialogue s'achève sur une phrase déroutante** ({sky}166c{/sky}) : {teal}« {/teal}selon toute apparence, "s'il est un" ou "s'il n'est pas un", lui et les autres choses dans leurs rapports avec eux-mêmes et dans leurs rapports mutuels {teal}présentent et ne présentent pas{/teal} de toutes les façons toutes les caractéristiques, {teal}paraissent et ne paraissent pas les présenter »{/teal}. **Les commentateurs sont profondément divisés sur trois questions** : {amber}que valent les critiques de Parménide ?{/amber} {amber}à quoi sert l'exercice de la seconde partie ?{/amber} et {amber}comment la seconde partie répond-elle à la première ?{/amber}

    | Lecture | Thèse | Difficulté |
    | satire (Tabak) | le dialogue entier serait une parodie | les liens logiques entre ses parties la rendent peu probable |
    | perplexité honnête (Vlastos, Gill, Allen) | Platon expose des difficultés qu'il ne sait pas encore résoudre | Parménide dit qu'un homme particulièrement doué peut défendre les Formes, et le fait |
    | sophismes à diagnostiquer (Meinwald, Peterson) | les critiques sont fautives, et l'exercice apprend à voir pourquoi | toutes les versions du troisième homme ne deviennent pas fautives (Frances) |
    | lecture ésotérique (Miller) | les critiques ne valent que si l'on pense les Idées comme des choses sensibles | sous la surface du texte, tout devient permis |
    | abandon de principes (Rickless) | critiques et déductions sont sérieuses et valides | la plus grande difficulté reste sans réponse |

    **La distinction de** {sky}**Meinwald**{/sky}**.** « X est F » peut se dire {violet}**relativement à soi**{/violet} ({blue}*pros heauto*{/blue}) : {amber}être F fait partie de la définition de X{/amber} ; ou {violet}**relativement aux autres**{/violet} ({blue}*pros ta alla*{/blue}) : {amber}X présente le trait F{/amber}. Ainsi, « le Grand est grand » relativement à soi veut dire {green}qu'être grand fait partie de ce qu'est le Grand{/green}, {red}non que le Grand serait une grande chose parmi d'autres{/red}. Dès lors, l'Idée du Grand ne rejoint pas la pluralité des choses grandes, et {coral}la régression du troisième homme serait bloquée{/coral}.

    **La lecture de** {sky}**Rickless**{/sky}**.** Les critiques montrent que {red}la théorie de la maturité est incohérente{/red}, avec le modèle du gâteau comme avec le paradigmatisme. Trois principes suffisent à lever toutes ces incohérences, sauf la plus grande difficulté : {red}**la pureté des Idées, l'Unicité, et « pas de causalité par les contraires »**{/red}. Les déductions prouvent {green}qu'il y a des Idées{/green}, et {coral}que ces trois principes sont faux{/coral}. Platon garde l'essentiel : {green}**l'un-au-dessus-de-plusieurs et la séparation**{/green}. {red}La plus grande difficulté reste un chantier ouvert.{/red}

    ! Le {sky}*Parménide*{/sky} {red}n'est pas forcément un aveu d'échec de la théorie des Idées{/red} : pour plusieurs lectures, {green}il la __corrige__ sans l'abandonner{/green}.
