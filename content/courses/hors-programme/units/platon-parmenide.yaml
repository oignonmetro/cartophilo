    answer: "à la fois semblables et dissemblables"
    alt: []
  - id: platon-parmenide-i2-p12
    sentence: "Socrate admet que les choses sensibles soient unes et multiples, car ce n'est pas contradictoire. En revanche, « __si ce qu'est l'Un on montre que cela__ ___, et si par ailleurs on montre que **le Plusieurs est en fait un**, voilà où je commencerai à m'étonner » (*Parménide*, 129b-c)."
    answer: "est en soi plusieurs"
    alt: []
- id: platon-parmenide-i3
  title: "La boîte à outils : les principes de la théorie"
  notes: |-
    **Pour suivre les objections de Parménide, il faut avoir en tête les principes de la théorie des Idées, tirés des dialogues de la maturité.** Les commentateurs leur donnent des noms commodes ; {coral}chaque objection montre que certains d'entre eux, mis ensemble, se contredisent{/coral}. « F » désigne n'importe quelle propriété ({yellow}grand, beau, juste{/yellow}) et « le F » l'Idée correspondante ({yellow}le Grand, le Beau{/yellow}).

    | Principe | Énoncé | Source |
    | {amber}Causalité{/amber} | les choses F (autres que le F) sont F parce qu'elles participent du F | *Phédon*, 100c-101c |
    | {amber}Séparation{/amber} | le F est en lui-même et par lui-même : il est radicalement différent de ce qui en participe, et donc non identique à ces choses | *Phédon*, 100b ; *République*, V, 476b |
    | {amber}Impureté des sensibles{/amber} | les choses sensibles peuvent avoir des propriétés contraires | *Parménide*, 129c |
    | {amber}Pureté des Idées{/amber} | une Idée ne peut avoir de propriétés contraires | *Parménide*, 129b-c |
    | {amber}Un-au-dessus-de-plusieurs{/amber} | pour toute pluralité de choses F, il y a une Idée du F dont elles participent toutes | *République*, X, 596a |
    | {amber}Unicité{/amber} | pour chaque propriété F, il y a exactement une et une seule Idée du F | *République*, X, 597c (argument du « troisième lit ») |
    | {amber}Auto-prédication{/amber} | le F est lui-même F : le Beau est beau, le Grand est grand | *Hippias majeur*, *Phédon* |
    | {amber}Unité{/amber} | chaque Idée est une | *République*, V, 476a ; VII, 524b |
    | Non-identité | aucune Idée n'est identique à ce qui en participe | conséquence de la Séparation |

    **Ne pas confondre** {violet}**Unité**{/violet} **et** {violet}**Unicité**{/violet}**.** L'Unicité dit qu'{amber}il n'y a qu'une seule Idée du Grand{/amber}. L'Unité dit que {amber}chaque Idée est *une*, au sens où elle se compte comme une chose{/amber} : de même que {yellow}Socrate est un parmi les sept présents{/yellow}, {yellow}le Beau est un parce que le Beau et le Laid font deux{/yellow} ({sky}*République*, 475e-476a{/sky}).

    **Deux principes de plus servent dans les objections** : {amber}rien de F ne peut causer chez une chose la propriété contraire de F{/amber} ({yellow}on ne devient pas grand par du petit{/yellow}, {sky}*Phédon*, 101b{/sky}) : c'est le principe {violet}**pas de causalité par les contraires**{/violet} ; et {amber}une chose qui a plusieurs parties est par là même plusieurs{/amber}.

    ! {amber}Auto-prédication{/amber} et {amber}pureté des Idées{/amber} se combinent : si le Grand est grand, et qu'il ne peut avoir de propriété contraire, alors {coral}le Grand ne peut __en aucun sens__ être petit{/coral}.
