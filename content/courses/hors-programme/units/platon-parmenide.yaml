- id: platon-parmenide-i7
  title: "Le troisième homme (1) : la régression"
  notes: |-
    **Le nom vient d'**{sky}**Aristote**{/sky}, qui discute un argument de ce genre ({sky}*Métaphysique*, 990b17{/sky}) ; {red}Platon ne l'appelle jamais ainsi{/red}. Le commentateur {sky}Vlastos{/sky} en a lancé l'analyse moderne en 1954 ; la littérature est immense.

    **Point de départ : l'**{violet}**Unité**{/violet} **d'une Idée découle de l'**{violet}**un-au-dessus-de-plusieurs**{/violet}**.** {amber}S'il y a plusieurs choses grandes, il y a une Idée du Grand « au-dessus » d'elles, dont toutes participent{/amber} ; et {coral}ce qui est « un sur plusieurs » est un{/coral}.

    **La régression, pas à pas** ({violet}« régression à l'infini »{/violet} : {amber}une suite d'étapes qui ne s'arrête jamais{/amber}) :
    - {yellow}A, B, C sont grands{/yellow}. Par l'{amber}un-au-dessus-de-plusieurs{/amber}, il y a une Idée du Grand, G1, dont ils participent.
    - Par l'{amber}auto-prédication{/amber}, G1 est grand. On a donc {coral}une nouvelle pluralité de choses grandes : A, B, C et G1{/coral}.
    - Par l'{amber}un-au-dessus-de-plusieurs{/amber}, il y a une Idée, G2, dont A, B, C et G1 participent.
    - Par la {amber}non-identité{/amber}, G2 n'est pas G1, puisque G1 en participe.
    - Par l'{amber}auto-prédication{/amber}, G2 est grand ; d'où une nouvelle pluralité A, B, C, G1, G2, donc une Idée G3, et {red}ainsi de suite, sans fin{/red}.

    | Principe | Rôle dans l'argument |
    | un-au-dessus-de-plusieurs | il y a une Idée au-dessus de toute pluralité de choses grandes |
    | auto-prédication | chaque Idée du Grand est elle-même grande, donc rejoint la pluralité |
    | non-identité | l'Idée au-dessus est distincte de celles qui en participent |

    **Le même raisonnement vaut pour n'importe quelle propriété** : {red}il n'y aurait pas une Idée du Beau, mais une infinité{/red}.

    ! Le troisième homme {pink}ne repose pas sur une seule hypothèse fautive{/pink} : {green}c'est la __combinaison__ de trois principes de la théorie qui produit la régression{/green}.
