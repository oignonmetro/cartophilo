  - id: platon-parmenide-i5-p1
    sentence: "__Selon le modèle dit du__ ___, participer d'une Idée, c'est **en recevoir une part**, comme ceux qui partagent une pâtisserie en reçoivent chacun une part."
    answer: "gâteau"
    alt: []
  - id: platon-parmenide-i5-p2
    sentence: "Si chaque chose qui participe du Grand reçoit le Grand tout entier, une même Idée est **tout entière en plusieurs lieux à la fois** : __elle se trouverait « distincte__ d'___ » (131b)."
    answer: "elle-même"
    alt: []
  - id: platon-parmenide-i5-p3
    sentence: "Pour certains commentateurs, ce qui rend absurde une Idée « distincte d'elle-même » est qu'elle **ne serait plus une**, __ce qui contredit le principe__ d'___."
    answer: "Unité"
    alt: ["unité"]
  - id: platon-parmenide-i5-p4
    sentence: "Pour défendre le modèle de l'Idée entière, __Socrate compare l'Idée au__ ___, qui est à la fois en bien des lieux **sans être séparé de lui-même**."
    answer: "jour"
    alt: []
  - id: platon-parmenide-i5-p5
    sentence: "Parménide répond que __le jour est comme un__ ___ étendu sur plusieurs hommes, dont chacun n'est couvert que par **une partie**."
    answer: "voile"
    alt: []
  - id: platon-parmenide-i5-p6
    sentence: "En comparant le jour à un voile, Parménide __ramène la parade de Socrate au modèle de la ___ de gâteau__, la **seconde branche du dilemme**."
    answer: "part"
    alt: []
