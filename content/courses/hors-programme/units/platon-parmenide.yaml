- id: platon-parmenide-i13
  title: "Sauver les Idées : le programme de l'exercice (134e-137c)"
  notes: |-
    **On s'attendrait à ce que Parménide conclue qu'il faut abandonner les Idées. Il fait exactement l'inverse** : il faut les sauver, car celui qui refuse de poser une Forme pour chaque chose « ne saura de quel côté tourner sa pensée » : « il n'admet point que pour chaque chose il y a une Forme qui est toujours la même ; et, par suite, il détruira toute possibilité de pratiquer la dialectique » (135b-c). « Dialectique » peut s'entendre au sens technique (la méthode par laquelle le philosophe connaît les Idées, *République*, 534b-c) ou au sens courant (la capacité de discuter, de communiquer) : dans les deux cas, sans Idées, plus de pensée commune.

    **Il prévient pourtant que ce sera difficile** : « Et ce serait un homme particulièrement doué, celui à qui on pourrait faire comprendre qu'il y a de chaque chose un Genre, un être en soi et par soi. » (135a-b).

    **Le remède est un entraînement**, que le grand nombre qualifie de « bavardages » (135d). Il imite la méthode de Zénon, mais l'applique aux Formes (135e) : « il faut ne laisser l'enquête s'égarer ni dans les choses visibles ni même dans ce qui les concerne, mais l'appliquer aux choses qui sont par excellence objets de la raison et dont on pourrait estimer que ce sont des Formes ». Selon Rickless, c'est que les Formes, elles aussi, semblent recevoir des propriétés contraires. Sa forme (136a) :
    - poser qu'une Idée **est**, et tirer les conséquences ; puis poser qu'elle **n'est pas**, et tirer les conséquences ;
    - examiner les conséquences pour l'Idée elle-même, et pour les **autres** (tout ce qui n'est pas elle) ;
    - examiner chaque fois les choses relativement à elles-mêmes et relativement aux autres.

    **Parménide fait lui-même l'exercice sur l'Idée de l'un**, avec le jeune Aristote pour interlocuteur, mais il dit qu'il faudrait le refaire pour la ressemblance, la dissemblance, le mouvement et le repos, la génération et la corruption, l'être et le non-être (136b). Les propriétés examinées sont nombreuses : être plusieurs, être un tout, avoir une figure, être en soi ou en autre chose, être en mouvement ou en repos, même ou autre, semblable ou dissemblable, égal ou inégal, plus vieux ou plus jeune, être dans le temps, être nommé, connu, perçu.

    **On compte d'ordinaire huit déductions, plus un appendice aux deux premières** (155e-157b) ; les néoplatoniciens en comptaient neuf. En français, on les appelle souvent les « hypothèses » ; Luc Brisson tient l'appendice pour un corollaire de la deuxième hypothèse, et formule l'hypothèse « s'il est un ».

    ! Le but déclaré de l'exercice n'est pas de détruire les Idées, mais de les __sauver__ : Parménide maintient qu'il y a, pour chaque chose, une Idée.
