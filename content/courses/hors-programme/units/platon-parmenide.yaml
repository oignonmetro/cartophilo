    answer: "un homme particulièrement doué"
    alt: []
  - id: platon-parmenide-i13-p3
    sentence: "Après ses objections, Parménide recommande **non d'abandonner les Idées**, __mais de les ___ par un entraînement__."
    answer: "sauver"
    alt: []
