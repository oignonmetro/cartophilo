- id: platon-parmenide-i7
  title: "Le troisième homme (1) : la régression"
  notes: |-
    **Le nom vient d'Aristote**, qui discute un argument de ce genre (*Métaphysique*, 990b17) ; Platon ne l'appelle jamais ainsi. Le commentateur Vlastos en a lancé l'analyse moderne en 1954 ; la littérature est immense.

    **Point de départ : l'Unité d'une Idée découle de l'un-au-dessus-de-plusieurs.** S'il y a plusieurs choses grandes, il y a une Idée du Grand « au-dessus » d'elles, dont toutes participent ; et ce qui est « un sur plusieurs » est un.

    **La régression, pas à pas** (« régression à l'infini » : une suite d'étapes qui ne s'arrête jamais) :
    - A, B, C sont grands. Par l'un-au-dessus-de-plusieurs, il y a une Idée du Grand, G1, dont ils participent.
    - Par l'auto-prédication, G1 est grand. On a donc une nouvelle pluralité de choses grandes : A, B, C et G1.
    - Par l'un-au-dessus-de-plusieurs, il y a une Idée, G2, dont A, B, C et G1 participent.
    - Par la non-identité, G2 n'est pas G1, puisque G1 en participe.
    - Par l'auto-prédication, G2 est grand ; d'où une nouvelle pluralité A, B, C, G1, G2, donc une Idée G3, et ainsi de suite, sans fin.

    | Principe | Rôle dans l'argument |
    | un-au-dessus-de-plusieurs | il y a une Idée au-dessus de toute pluralité de choses grandes |
    | auto-prédication | chaque Idée du Grand est elle-même grande, donc rejoint la pluralité |
    | non-identité | l'Idée au-dessus est distincte de celles qui en participent |

    **Le même raisonnement vaut pour n'importe quelle propriété** : il n'y aurait pas une Idée du Beau, mais une infinité.

    ! Le troisième homme ne repose pas sur une seule hypothèse fautive : c'est la __combinaison__ de trois principes de la théorie qui produit la régression.
