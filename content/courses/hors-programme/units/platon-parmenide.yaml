    alt: []
  - id: platon-parmenide-i2-p9
    sentence: "Dans le *Parménide* (129c), Socrate se dit __un, parce qu'il est l'un des sept présents, et__ ___, parce qu'il a **une droite et une gauche**, un devant et un derrière."
    answer: "plusieurs"
    alt: ["multiple"]
