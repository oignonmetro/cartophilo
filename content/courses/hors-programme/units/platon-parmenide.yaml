- id: platon-parmenide-i4
  title: "L'étendue des Idées (130a-e)"
  notes: |-
    {amber}**Première question de Parménide : y a-t-il une Idée séparée pour chaque propriété ?**{/amber} Socrate répond en trois temps :

    | Idées de… | Réponse de Socrate |
    | justice, beauté, bien | certainement |
    | homme, feu, eau | il hésite |
    | cheveu, boue, crasse | il en doute franchement |

    Pour ces dernières : {teal}« {/teal}à ce que nous voyons, à cela aussi {teal}je reconnais une existence{/teal}, mais penser qu'il y a {teal}une Forme de ces choses{/teal}, ce serait, je le crains, {teal}trop absurde »{/teal} ({sky}130d{/sky}). Parménide lui répond qu'il est encore jeune ({sky}130e{/sky}) : {teal}« {/teal}C'est que {teal}tu es encore jeune{/teal}, Socrate, aurait repris Parménide, et que {teal}la philosophie ne t'a pas encore saisi{/teal} de cette ferme emprise dont, c'est ma conviction, elle te saisira un jour, le jour où {teal}tu n'auras plus de mépris pour aucune de ces choses. »{/teal}

    **Pourquoi ces doutes ? Trois explications sont proposées par les commentateurs.**
    - {amber}**Une erreur de jeunesse**{/amber} ({sky}Allen, Sayre{/sky}) : Socrate admet à tort ce qu'il ne devrait pas. Ailleurs, Platon parle bien d'{yellow}une Idée de l'abeille{/yellow} ({sky}*Ménon*, 72b-c{/sky}), {yellow}de la navette{/yellow} ({sky}*Cratyle*, 389d{/sky}), {yellow}du lit et de la table{/yellow} ({sky}*République*, 596b{/sky}). Mais {red}on comprend mal que Platon fasse dire à son porte-parole une chose qu'il n'a aucune raison de dire{/red}.
    - {amber}**Seules certaines propriétés appellent la pensée**{/amber} ({sky}Gill{/sky}) : dans {sky}*La République* (523d){/sky}, la vue ne nous montre jamais {yellow}un doigt qui serait aussi le contraire d'un doigt{/yellow}, mais elle montre {yellow}un doigt grand et petit à la fois{/yellow}, ce qui pousse l'âme à se demander ce qu'est le grand. Or {coral}l'eau ou la boue n'ont pas de contraire{/coral}. {red}Objection{/red} : ce passage explique ce qui {amber}__fait penser__ aux Idées{/amber}, non pourquoi {amber}elles __existent__{/amber}.
    - {amber}**Une tension entre auto-prédication et séparation**{/amber} ({sky}Rickless, Miller{/sky}) : que la Justice soit juste ou le Beau beau {green}ne fait pas de ces Idées des choses sensibles{/green}. Mais {red}si l'Homme est un homme et la Boue boueuse, comment seraient-ils autre chose que des choses sensibles{/red}, comme celles que nous voyons ? {coral}Cette lecture s'accorde avec la réponse de Socrate, qui range ces choses parmi « ce que nous voyons ».{/coral}

    ! Socrate {pink}ne doute pas que la boue existe{/pink} : {red}il doute qu'il y ait une __Idée séparée__ de la boue{/red}, distincte des choses boueuses.
