- id: platon-parmenide-i11
  title: "La plus grande difficulté (1) : nous ne connaîtrions pas les Idées"
  notes: |-
    **Parménide garde pour la fin ce qu'il appelle la** {violet}**plus grande difficulté**{/violet} **(**{sky}**133a-134e**{/sky}**)**, en deux arguments : si les Idées sont telles que Socrate le dit, (1) {red}les hommes ne peuvent pas les connaître{/red}, et (2) {red}les dieux ne peuvent pas connaître les affaires humaines{/red}. Les deux conclusions ruineraient la théorie : dans les dialogues de la maturité, {coral}connaître les Idées est le but même de la dialectique{/coral}, et Socrate trouve {teal}« {/teal}trop {teal}déconcertant »{/teal} l'argument qui prive la divinité du savoir ({sky}134e{/sky}).

    **Une notion clef : l'**{violet}**être relatif**{/violet}**.** Une chose a un être relatif quand {amber}on ne peut dire ce qu'elle est sans mentionner autre chose{/amber} : {yellow}un maître n'est maître que d'un esclave, une science n'est science que de quelque chose{/yellow}. Les prémisses :
    - P1. {amber}Rien de ce qui est en soi et par soi n'est en nous{/amber} ({sky}133c{/sky} : {teal}« {/teal}toi et tout autre personne qui posez qu'il y a de chaque chose {teal}une réalité en soi{/teal} admettriez, pour commencer, qu'{teal}aucune de ces réalités ne se trouve dans notre monde »{/teal}).
    - P2. {amber}Si une Idée est ce qu'elle est relativement à quelque chose, ce quelque chose est une Idée.{/amber}
    - P3. {amber}Si une chose qui est en nous est ce qu'elle est relativement à quelque chose, ce quelque chose est en nous.{/amber}
    - P4. {amber}La science est ce qu'elle est relativement à ce dont elle est la science.{/amber}

    **Les exemples de Parménide** ({sky}133e{/sky}) : {teal}« {/teal}La {teal}Maîtrise en soi{/teal}, c'est {teal}par rapport à l'Esclavage en soi{/teal} qu'elle est ce qu'elle est, et de même c'est par rapport à la Maîtrise en soi que {teal}l'Esclavage en soi est esclavage. »{/teal} {yellow}Un maître humain, lui, est maître d'un esclave humain, non de l'Esclavage en soi.{/yellow}

    **Le raisonnement.** {amber}Notre science est en nous{/amber} ; par P4 et P3, {coral}son objet est donc en nous{/coral}. Or, par la séparation et P1, {amber}aucune Idée n'est en nous{/amber}. Donc notre science n'a jamais une Idée pour objet : {red}**les hommes ne connaissent aucune Idée**{/red} ({sky}134b-c{/sky}) : {teal}« {/teal}Il s'ensuit que {teal}restent inconnaissables pour nous{/teal} et le Beau en soi, ce qu'est le Beau, et le Bien et {teal}tout ce que nous admettons comme Formes en soi. »{/teal}

    {amber}**Comment comprendre P2 et P3 ? Un débat.**{/amber} Prises au pied de la lettre, les formules de Parménide disent que {amber}les Formes n'ont de rapport qu'aux Formes, et les choses qu'aux choses{/amber} ({sky}134a{/sky}) : {teal}« {/teal}c'est {teal}sur elles-mêmes que les Formes ont de l'efficace{/teal} et c'est avec elles-mêmes qu'elles entretiennent des rapports ; et pareillement {teal}les choses sensibles n'entretiennent de rapports qu'entre elles »{/teal}. C'est la lecture de nombreux commentateurs ({sky}Ryle, Cherniss, Allen, Gill{/sky}). Mais alors {red}aucune chose ne pourrait plus participer d'une Forme{/red} ! D'autres commentateurs ({sky}Peterson, Rickless, Fine{/sky}) lisent donc ces prémisses comme portant {green}seulement sur la __définition__ de ce qui a un être relatif{/green} : {yellow}ce qu'est la Maîtrise se définit par l'Esclavage, non par un esclave{/yellow}.

    ! Si l'on prend P2 et P3 au pied de la lettre, {red}la participation elle-même devient impossible{/red} : c'est pourquoi plusieurs lectures les font porter {green}seulement sur ce qui __définit__ une chose relative{/green}.
