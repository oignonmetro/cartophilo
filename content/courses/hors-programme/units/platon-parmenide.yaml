    sentence: "Point de départ du troisième homme : « Chaque fois que plusieurs choses te paraissent être grandes, __c'est, je suppose,__ ___, qui t'apparaît être la même, lorsque tu les **embrasses toutes du regard** » (*Parménide*, 132a)"
    answer: "une seule Forme"
