- id: platon-parmenide-i20
  title: "Les six problèmes de la théorie (130a-134e)"
  notes: |-
    **Une fois les principes en main, voici ce que Parménide leur oppose : six problèmes, qui occupent tout le début du dialogue (130a-134e).** Chacun met la théorie des Idées en difficulté sur un point différent : ce dont il y a des Idées, la façon dont les choses y participent, ce qu'est une Idée, et comment on peut la connaître.

    | Rang | Problème | Passage | En une phrase |
    | 1 | l'étendue des Formes | 130a-e | y a-t-il une Forme pour toute propriété, même pour le cheveu, la boue, la crasse ? |
    | 2 | le dilemme du tout et de la partie | 130e-131e | participer à une Forme, est-ce l'avoir tout entière, ou en avoir une part ? Les deux semblent absurdes |
    | 3 | le troisième homme | 132a-b | si l'Homme est un homme, il faut une autre Forme au-dessus d'eux, et ainsi de suite |
    | 4 | les Formes comme pensées | 132b-c | si les Formes sont des pensées, les choses qui en participent pensent aussi |
    | 5 | la régression de la ressemblance | 132c-133a | si les choses ressemblent à leur modèle, le modèle leur ressemble aussi, et il faut un modèle plus haut |
    | 6 | la plus grande difficulté | 133a-134e | séparées de nous, les Formes seraient inconnaissables, et les dieux ignoreraient nos affaires |

    **Comment les lire.** Les deux premiers problèmes sont posés par Parménide à Socrate ; les trois suivants répondent aux issues que Socrate propose (les Idées comme pensées, comme modèles) ; le sixième tire la conséquence de la séparation. Trois d'entre eux (3, 4 et 5) produisent une régression à l'infini.

    ! Ces six problèmes seront repris un à un dans les leçons suivantes, puis rassemblés dans « Repérer les six objections ».
