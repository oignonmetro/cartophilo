- id: platon-parmenide-i14
  title: "Comment lire les huit déductions ?"
  notes: |-
    **Notation** : « G » est l'Idée posée (ici l'un), « F » une propriété, « contraire de F » sa propriété contraire. Deux tableaux du plan sont proposés.

    **La lecture standard** (Miller, Gill, Allen, Rickless) : le troisième principe de division oppose conclusions positives et négatives.

    | Déduction | Hypothèse | Sujet | Conclusion |
    | D1 | l'un est | l'un | ni F ni contraire de F |
    | D2 | l'un est | l'un | F et contraire de F |
    | D3 | l'un est | les autres | F et contraire de F |
    | D4 | l'un est | les autres | ni F ni contraire de F |
    | D5 | l'un n'est pas | l'un | F et contraire de F |
    | D6 | l'un n'est pas | l'un | ni F ni contraire de F |
    | D7 | l'un n'est pas | les autres | (semblent) F et contraire de F |
    | D8 | l'un n'est pas | les autres | ni F ni contraire de F |

    **Le problème de cette lecture** : D1 et D2 ensemble disent que, si l'un est, il est F et n'est pas F, ce qui est contradictoire ; donc l'un n'est pas. Mais D5 et D6 disent de même que, si l'un n'est pas, il est F et n'est pas F ; donc il n'est pas vrai que l'un ne soit pas. L'ensemble aboutirait à une contradiction pure et simple.

    **Les issues proposées par les commentateurs :**
    - **la lecture non standard** (Meinwald, Peterson, Sayre) : le troisième principe oppose « relativement à soi » et « relativement aux autres » (D1 : l'un n'est ni F ni son contraire relativement à soi ; D2 : il est l'un et l'autre relativement aux autres). Plus de contradiction ; mais D2 démontre aussi des choses de l'un relativement à lui-même (il est même et autre que lui-même, 147b) ;
    - **plusieurs sujets** : chaque déduction porterait sur un « un » différent (néoplatoniciens, Cornford, Miller) ; mais Parménide dit clairement que le sujet est le même ;
    - **une lecture aporétique** (Owen, Schofield, Gill, Allen) : les déductions sont faites pour embarrasser le lecteur et le pousser à chercher l'erreur ;
    - **l'antilogie de Gorgias** (Brémond) : tirer des contradictions d'une hypothèse et de sa négation ; mais ce serait une méthode sophistique, et Parménide veut établir qu'il y a des Idées ;
    - **une réfutation de principes** (Rickless) : les déductions prouvent que l'un est, et que la pureté des Idées et l'Unicité sont fausses.

    ! Une contradiction obtenue à partir d'une hypothèse n'est pas forcément un échec : dans un raisonnement par l'absurde, elle sert à __réfuter__ l'une des prémisses.
  points:
  - id: platon-parmenide-i14-p1
    sentence: "Dans la lecture standard du *Parménide*, la première déduction conclut que, si l'un est, il n'est ni F ni ___ de F."
    answer: "contraire"
    alt: []
  - id: platon-parmenide-i14-p2
    sentence: "Dans la lecture standard, D1 et D2 ensemble disent que, si l'un est, il est F et n'est pas F : prises ensemble, les huit déductions aboutiraient à une ___ pure et simple."
    answer: "contradiction"
    alt: []
  - id: platon-parmenide-i14-p3
    sentence: "Pour la lecture non standard des déductions (Meinwald, Peterson, Sayre), le troisième principe de division oppose « relativement à soi » et « relativement aux ___ »."
    answer: "autres"
    alt: []
