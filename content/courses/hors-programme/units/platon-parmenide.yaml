- id: platon-parmenide-i10
  title: "La régression de la ressemblance (132c-133a)"
  notes: |-
    **Socrate change complètement de modèle : les Idées seraient des modèles (`paradeigmata`), et participer d'une Idée serait lui ressembler** (132d) : « Alors que ces Formes sont comme des modèles qui subsistent dans leur nature, les autres choses entretiennent avec elles un rapport de ressemblance et en sont les copies ». On appelle cette conception le **paradigmatisme**. Elle n'est pas nouvelle : *La République* et le *Timée* présentent déjà les Idées comme des modèles dont les choses sont les copies.

    **Parménide pose d'abord que la ressemblance est symétrique (132d)** : si X ressemble à Y, Y ressemble à X. Si le portrait ressemble à Simmias, Simmias ressemble au portrait.

    **Deux lectures de l'objection s'opposent chez les commentateurs.**

    | Lecture | L'argument | Commentateurs |
    | {teal}un double du troisième homme{/teal} | les mêmes trois principes produisent une infinité d'Idées du F | Owen, Vlastos, Cherniss, Fine |
    | {coral}une régression propre{/coral} | la ressemblance elle-même produit une infinité d'Idées de la Ressemblance | Schofield, Allen, Rickless |

    **La seconde lecture, pas à pas.** A et B sont tous deux F : ils se ressemblent. Ils sont donc semblables, et, par l'un-au-dessus-de-plusieurs, ils participent d'une Idée de la Ressemblance, R1. Or, par le paradigmatisme, participer de R1, c'est lui ressembler : A ressemble à R1, donc, par symétrie, R1 ressemble à A. R1 est donc semblable, et participe à son tour d'une Idée de la Ressemblance, R2, distincte d'elle (non-identité) ; par le paradigmatisme et la symétrie, R2 ressemble à R1, donc est semblable, et ainsi de suite.

    **Ici, ce n'est pas l'auto-prédication qui relance la régression**, mais la combinaison du paradigmatisme et de la symétrie. Parménide en conclut (132e) : « Par suite, rien ne peut être semblable à cette Forme et cette Forme ne peut être semblable à autre chose. » Mais A et B lui ressemblent, puisqu'ils en participent : contradiction. **Pourquoi la régression gêne-t-elle ?** On retrouve les trois réponses données pour le troisième homme : elle empêche d'expliquer, elle contredit l'Unicité, ou elle rend chaque Idée plusieurs.

    ! La symétrie est le ressort de l'argument : un modèle ne peut rester « au-dessus » de sa copie, puisqu'il lui ressemble __autant__ qu'elle lui ressemble.
