- id: platon-parmenide-i15
  title: "Les deux premières déductions et l'appendice"
  notes: |-
    **D1 (137c-142a) : si l'un est, il n'est ni F ni le contraire de F.** Les conclusions sont vertigineuses : l'un n'est pas plusieurs, n'a pas de parties, n'est pas un tout, n'a ni commencement, ni milieu, ni fin, n'a pas de figure, n'est nulle part, n'est ni en mouvement ni en repos, ni même ni autre, ni semblable ni dissemblable, n'est pas dans le temps ; il ne participe pas de l'être, et (141e-142a) : « Il apparaît, au contraire, que l'un n'est pas un et qu'il n'est pas, s'il faut ajouter foi à cette argumentation. » « Par voie de conséquence, il n'y a de lui ni nom ni définition. Il n'est de lui ni science ni sensation ni opinion. »

    **Tout part du premier argument (D1A1)** : par l'Unité ou l'auto-prédication, l'un est un ; un et plusieurs sont contraires ; par la pureté des Idées, l'un n'est donc pas plusieurs. Or la plupart des conclusions suivantes s'enchaînent à partir de celle-là. **Selon Rickless, toute D1 repose donc sur la pureté des Idées.** On peut y voir un argument contre l'Unité, ou bien la preuve que, si l'un est, la pureté des Idées est fausse.

    **D2 (142b-155e) : si l'un est, il est F et le contraire de F.** S'il est, il participe de l'être, sans être identique à l'être ; l'un-qui-est est donc un tout dont l'un et l'être sont des parties, et chacune de ces parties est à son tour une et étant : l'un est **infiniment plusieurs**. Suivent toutes les paires : l'un a des parties et est un tout, il est limité et illimité, en mouvement et en repos, même et autre, semblable et dissemblable, plus vieux et plus jeune, dans le temps ; on peut le nommer et le connaître.

    **Ce que D1 et D2 donnent ensemble** : si la pureté des Idées est vraie et que l'un est, l'un serait à la fois F et non F, ce qui est impossible ; donc, **si l'un est, la pureté des Idées est fausse**. D2 heurte aussi le principe « pas de causalité par les contraires » : l'un, qui est un, est aussi plusieurs.

    **L'appendice (155e-157b)** : si l'un passe d'être F à être contraire de F, il faut un moment où il change. Platon le place dans **l'instant** (`exaiphnês`) (156d) : « Mais l'instant, qu'on ne peut situer, est sis entre le mouvement et le repos, parce qu'il ne se trouve dans aucun laps de temps. » À la différence du « maintenant » (`nûn`), qui est dans le temps, l'instant est hors du temps : l'un n'y est ni en mouvement ni en repos, ni un ni plusieurs.

    ! D1 ne prouve pas simplement que l'un n'existe pas : elle montre ce qui suit de l'hypothèse __si l'on garde__ la pureté des Idées.
