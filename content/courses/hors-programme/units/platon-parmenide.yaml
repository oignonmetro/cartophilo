- id: platon-parmenide-i16
  title: "Les déductions 3 à 8"
  notes: |-
    {sky}**D3 (157b-159b)**{/sky} **: si l'un est, les autres sont** {amber}**F et contraire de F**{/amber} : {yellow}ils ont des parties et forment un tout, ils sont un et plusieurs, limités et illimités, semblables et dissemblables{/yellow}. Selon {sky}Rickless{/sky}, {coral}D3 ne s'appuie pas sur la pureté des Idées{/coral}.

    {sky}**D4 (159b-160b)**{/sky} **: si l'un est, les autres ne sont** {amber}**ni F ni contraire de F**{/amber} ({yellow}ni un ni plusieurs, ni semblables ni dissemblables{/yellow}). Mais {coral}D4 dépend de D1, donc de la pureté des Idées{/coral}. D3 et D4 ensemble donnent, de nouveau : {green}**si l'un est, la pureté des Idées est fausse.**{/green}

    {sky}**D5 (160b-163b)**{/sky} **: si l'un n'est pas, il est** {amber}**F et contraire de F**{/amber}**.** Même s'il n'est pas, {coral}on peut en parler et le connaître{/coral} ({sky}160d{/sky}) : {teal}« {/teal}de lui {teal}il y a science{/teal}, sinon {teal}on ne sait même pas ce qu'on dit{/teal}, quand on dit {teal}"s'il n'est pas un" »{/teal} ; {yellow}il diffère des autres, il est semblable à lui-même et dissemblable des autres, il participe de l'être et du non-être, il est en mouvement et en repos{/yellow}. D5 ne repose pas sur la pureté des Idées : {green}**si l'un n'est pas, la pureté des Idées est fausse.**{/green} {coral}Que l'un soit ou non, elle est donc fausse.{/coral}

    {sky}**D6 (163b-164b)**{/sky} **: si l'un n'est pas, il n'est** {amber}**ni F ni contraire de F**{/amber} : {red}il n'est en aucune façon, on ne peut ni le nommer ni le connaître{/red}. **D5 et D6 ensemble** : si l'un n'est pas, il est F et n'est pas F, ce qui est impossible ; {green}donc l'un est{/green} ({violet}raisonnement par l'absurde{/violet}).

    {amber}**Pourquoi c'est important**{/amber} : {coral}rien dans ces raisonnements ne dépend du choix de l'un ; ils vaudraient pour n'importe quelle Idée{/coral}. {green}Parménide prouve ainsi qu'il y a des Idées{/green}, et se révèle lui-même cet {teal}« {/teal}homme {teal}particulièrement doué »{/teal} dont il parlait, et même celui, {teal}« {/teal}plus {teal}merveilleux encore »{/teal}, qui sait découvrir et enseigner.

    {sky}**D7 (164b-165e)**{/sky} **: si l'un n'est pas, les autres** {amber}**__semblent__ F et contraire de F**{/amber} : {yellow}chacun semble un sans l'être, ils semblent pairs ou impairs sans l'être{/yellow}. Ce « semblent » {red}s'écarte du plan annoncé, et reste un mystère{/red}. Avec D3, {green}D7 montre que les autres sont, que l'un soit ou non{/green}.

    {sky}**D8 (165e-166c)**{/sky} **: si l'un n'est pas, les autres** {amber}**ne sont ni uns ni plusieurs**{/amber}, et ne peuvent même pas être conçus comme tels. Comme D7 les montre plusieurs, {green}D7 et D8 ensemble prouvent à nouveau que l'un est{/green}.

    | Déductions combinées | Résultat selon Rickless |
    | D1 + D2, ou D3 + D4 | si l'un est, la pureté des Idées est fausse |
    | D5 | si l'un n'est pas, la pureté des Idées est fausse |
    | D5 + D6, ou D7 + D8 | l'un est |

    ! {pink}La contradiction n'est pas le dernier mot{/pink} : combinées deux à deux, {green}les déductions __prouvent__ des thèses{/green} (l'un est ; la pureté des Idées est fausse).
