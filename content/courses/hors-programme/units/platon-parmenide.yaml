- id: platon-parmenide-i8
  title: "Le troisième homme (2) : où est le problème ?"
  notes: |-
    **Une régression à l'infini n'est pas absurde en elle-même** (la suite des nombres est infinie sans contradiction). Il faut donc dire en quoi celle du troisième homme gêne la théorie. Trois réponses sont défendues par les commentateurs.

    | Lecture | Ce qui ne va pas | Commentateurs |
    | {teal}épistémique{/teal} | une Idée doit expliquer et faire connaître les choses F ; une chaîne d'explications sans fin n'explique rien | Vlastos, Fine |
    | {coral}contre l'Unicité{/coral} | il y aurait plusieurs Idées du Grand, voire une infinité, alors qu'il ne doit y en avoir qu'une | nombreux commentateurs |
    | {violet}contre l'Unité{/violet} | chaque Idée deviendrait elle-même infiniment plusieurs | Rickless |

    **La lecture épistémique** rend compte du vocabulaire de la connaissance qui parsème le passage, mais pas de son point de départ : Parménide part de l'Unité de l'Idée, non de son rôle d'explication.

    **La dernière phrase du passage est décisive** : « Par suite, chacune de tes Formes ne sera désormais plus une, mais elle se multipliera sans limites. » (132b). Elle ne dit pas seulement qu'il y aura une infinité d'Idées (contre l'Unicité), mais que **chaque** Idée sera plusieurs. Selon Rickless, G1 participe d'une infinité d'Idées (G2, G3…) ; or, avec le modèle du gâteau, participer d'une Idée, c'est en avoir une part ; G1 a donc une infinité de parties, il est infiniment plusieurs, et par la pureté des Idées il ne peut être un.

    **Quelle leçon ?** Pour beaucoup, Platon doit abandonner l'un des trois principes (un-au-dessus-de-plusieurs, auto-prédication, non-identité). Pour Rickless, il lui suffit d'abandonner la **pureté des Idées** (et peut-être l'Unicité).

    ! Ne pas réduire la conclusion du troisième homme à « il y a trop d'Idées » : Parménide dit que __chacune__ des Formes « ne sera désormais plus une ».
