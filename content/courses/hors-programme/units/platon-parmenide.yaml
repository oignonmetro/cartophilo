- id: platon-parmenide-i12
  title: "La plus grande difficulté (2) : les dieux ne connaîtraient pas nos affaires"
  notes: |-
    **Second argument : les dieux ne connaîtraient pas les affaires humaines.**
    - (i) La science qui est une Idée (la Science en soi) est plus précise que toute science humaine.
    - (ii) Les dieux possèdent toute science plus précise que la science humaine.
    - Donc, **P5** : toute science qui est une Idée est possédée par les dieux.
    - Par P2 et P4, une science qui est une Idée a pour objet une Idée ; par P1 et la séparation, aucune Idée n'est en nous. Donc, **P7** : une science qui est une Idée n'a jamais pour objet quelque chose qui est en nous.
    - Conclusion (134e) : « ces entités ne peuvent, pour la même raison, être nos maîtres et avoir connaissance des affaires humaines, même si ce sont des divinités ».

    **L'argument n'est pas valide.** Un argument est *valide* quand sa conclusion suit nécessairement de ses prémisses. Ici, pour conclure, il faudrait non pas P5 (toute science-Idée est possédée par les dieux), mais sa **réciproque**, **P5 bis** : toute science que possèdent les dieux est une science-Idée. Rien n'empêche, avec P5 seule, que les dieux possèdent aussi une autre science, qui porterait sur nos affaires. C'est l'erreur qui consiste à confondre une proposition et sa réciproque (« tous les chats sont des animaux » n'entraîne pas « tous les animaux sont des chats »).

    **Trois hypothèses** : Platon n'a pas vu l'erreur ; il voulait que le lecteur la voie ; ou il a formulé P5 par mégarde au lieu de P5 bis.

    | | Premier argument | Second argument |
    | conclusion | les hommes ne connaissent pas les Idées | les dieux ne connaissent pas les affaires humaines |
    | prémisse sur l'être relatif | P3 (ce qui est en nous) | P2 (ce qui est Idée) |
    | validité | valide selon Rickless | non valide tel qu'il est écrit |

    ! Le second argument ne prouve donc pas sa conclusion tel qu'il est formulé ; mais le premier, lui, reste une difficulté entière pour la théorie.
