- id: platon-parmenide-i14
  title: "Comment lire les huit déductions ?"
  notes: |-
    **Notation** : « G » est l'Idée posée (ici l'un), « F » une propriété, « contraire de F » sa propriété contraire. Deux tableaux du plan sont proposés.

    {violet}**La lecture standard**{/violet} ({sky}Miller, Gill, Allen, Rickless{/sky}) : le troisième principe de division oppose {amber}conclusions positives{/amber} et {amber}négatives{/amber}.

    | Déduction | Hypothèse | Sujet | Conclusion |
    | D1 | l'un est | l'un | ni F ni contraire de F |
    | D2 | l'un est | l'un | F et contraire de F |
    | D3 | l'un est | les autres | F et contraire de F |
    | D4 | l'un est | les autres | ni F ni contraire de F |
    | D5 | l'un n'est pas | l'un | F et contraire de F |
    | D6 | l'un n'est pas | l'un | ni F ni contraire de F |
    | D7 | l'un n'est pas | les autres | (semblent) F et contraire de F |
    | D8 | l'un n'est pas | les autres | ni F ni contraire de F |

    {red}**Le problème de cette lecture**{/red} : D1 et D2 ensemble disent que, si l'un est, il est F et n'est pas F, ce qui est contradictoire ; {coral}donc l'un n'est pas{/coral}. Mais D5 et D6 disent de même que, si l'un n'est pas, il est F et n'est pas F ; {coral}donc il n'est pas vrai que l'un ne soit pas{/coral}. {red}L'ensemble aboutirait à une contradiction pure et simple.{/red}

    **Les issues proposées par les commentateurs :**
    - {amber}**la lecture non standard**{/amber} ({sky}Meinwald, Peterson, Sayre{/sky}) : le troisième principe oppose {amber}« relativement à soi »{/amber} et {amber}« relativement aux autres »{/amber} (D1 : l'un n'est ni F ni son contraire relativement à soi ; D2 : il est l'un et l'autre relativement aux autres). {green}Plus de contradiction{/green} ; mais {red}D2 démontre aussi des choses de l'un relativement à lui-même{/red} (il est même et autre que lui-même, {sky}147b{/sky}) ;
    - {amber}**plusieurs sujets**{/amber} : chaque déduction porterait sur un « un » différent ({sky}néoplatoniciens, Cornford, Miller{/sky}) ; mais {red}Parménide dit clairement que le sujet est le même{/red} ;
    - {amber}**une lecture aporétique**{/amber} ({sky}Owen, Schofield, Gill, Allen{/sky}) : les déductions sont faites pour {coral}embarrasser le lecteur et le pousser à chercher l'erreur{/coral} ;
    - {amber}**l'antilogie de Gorgias**{/amber} ({sky}Brémond{/sky}) : tirer des contradictions d'une hypothèse et de sa négation ; mais {red}ce serait une méthode sophistique{/red}, et Parménide veut établir qu'il y a des Idées ;
    - {amber}**une réfutation de principes**{/amber} ({sky}Rickless{/sky}) : les déductions prouvent {green}que l'un est{/green}, et {green}que la pureté des Idées et l'Unicité sont fausses{/green}.

    ! Une contradiction obtenue à partir d'une hypothèse {pink}n'est pas forcément un échec{/pink} : dans un {violet}raisonnement par l'absurde{/violet}, {green}elle sert à __réfuter__ l'une des prémisses{/green}.
  points:
  - id: platon-parmenide-i14-p1
    sentence: "Dans la lecture standard du *Parménide*, la **première déduction** conclut que, si l'un est, __il n'est ni F ni ___ de F__."
    answer: "contraire"
    alt: []
  - id: platon-parmenide-i14-p2
    sentence: "Dans la lecture standard, D1 et D2 ensemble disent que, si l'un est, **il est F et n'est pas F** : prises ensemble, __les huit déductions aboutiraient à une__ ___ pure et simple."
    answer: "contradiction"
    alt: []
  - id: platon-parmenide-i14-p3
    sentence: "Pour la **lecture non standard** des déductions (Meinwald, Peterson, Sayre), le troisième principe de division __oppose « relativement à soi » et « relativement aux__ ___ »."
    answer: "autres"
    alt: []
  - id: platon-parmenide-i14-p4
    sentence: "**Objection à la lecture non standard** des déductions : D2 démontre aussi que __l'un est même et autre que__ ___ (147b)."
    answer: "lui-même"
    alt: ["soi-même", "soi"]
  - id: platon-parmenide-i14-p5
    sentence: "Selon une lecture défendue par les néoplatoniciens, Cornford et Miller, **chaque déduction** du *Parménide* __porterait sur un « un »__ ___."
    answer: "différent"
    alt: []
  - id: platon-parmenide-i14-p6
    sentence: "__Selon la lecture ___ des déductions__ (Owen, Schofield, Gill, Allen), elles sont faites pour **embarrasser le lecteur** et le pousser à chercher l'erreur."
    answer: "aporétique"
