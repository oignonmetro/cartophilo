lessons:
- id: platon-parmenide-i1
  title: "Le dialogue : cadre, personnages, plan"
  notes: |-
    Le {sky}*Parménide*{/sky} est sans doute **le plus énigmatique des dialogues de Platon. Il met à l'épreuve la** {violet}**théorie des Idées**{/violet} (la traduction de {sky}Luc Brisson{/sky} dit « Formes ») que Socrate défend dans les dialogues de la maturité ({sky}*Phédon*, *République*, *Banquet*{/sky}) : selon cette théorie, {amber}à chaque propriété correspond une Idée unique, éternelle, immuable, indivisible et non sensible{/amber}, et {coral}c'est en participant d'elle que les choses ont cette propriété{/coral} ({yellow}une chose belle est belle parce qu'elle participe du Beau{/yellow}).

    **Le cadre est une fiction racontée de troisième main.** {sky}Céphale{/sky}, venu de Clazomènes, rencontre à Athènes {sky}Adimante{/sky} et {sky}Glaucon{/sky}, les frères de Platon ; leur demi-frère {sky}Antiphon{/sky} connaît par cœur une conversation que {sky}Pythodore{/sky}, chez qui elle s'est tenue, lui a rapportée. Ce triple relais signale, selon la plupart des spécialistes, que {coral}la conversation est presque certainement inventée{/coral}.

    **La scène** : {sky}Parménide d'Élée{/sky}, le grand défenseur de l'{violet}unité de l'être{/violet} (environ 65 ans), et son disciple {sky}Zénon{/sky} (environ 40 ans) sont venus à Athènes pour les Grandes Panathénées. {sky}Socrate{/sky}, encore très jeune, vient écouter Zénon lire son livre. Dans la seconde partie, Parménide prend pour interlocuteur un jeune homme nommé {sky}Aristote{/sky}.

    | Moment | Lieu | Contenu |
    | introduction | 126a-128e | l'argument de Zénon |
    | discours de Socrate | 128e-130a | la théorie des Idées |
    | critiques de Parménide | 130a-134e | six objections à la théorie |
    | programme | 134e-137c | comment sauver les Idées : un exercice |
    | déductions | 137c-166c | huit raisonnements sur l'un, plus un appendice |

    {green}**Ce qui fait l'accord des commentateurs**{/green} : Socrate y défend la théorie de la maturité, Parménide lui oppose {red}des objections redoutables{/red}, puis il propose une {violet}« gymnastique »{/violet} de huit déductions censée {green}aider à protéger les Idées{/green}. {red}**Tout le reste est discuté**{/red} : la reconstruction des objections, la structure des déductions, leur sujet, leur rapport aux objections, et la leçon finale du dialogue. Les néoplatoniciens ({sky}Plotin{/sky}, puis {sky}Proclus{/sky}) ont vu dans les déductions {amber}la clef de la structure hiérarchique de l'univers{/amber}.

    ! L'Aristote du dialogue {red}n'est __pas__ le philosophe{/red} : c'est un homme qui deviendra {amber}l'un des Trente Tyrans{/amber} après la défaite d'Athènes face à Sparte.
