- id: platon-parmenide-i9
  title: "Les Idées comme pensées (132b-c)"
  notes: |-
    **Après le troisième homme, Socrate tente une issue : et si** {amber}**les Idées n'étaient que des pensées, qui n'existent que dans les âmes**{/amber} **?** {teal}« {/teal}À moins, Parménide, rétorqua Socrate, que {teal}chacune de ces Formes ne soit une pensée{/teal}, et que {teal}nulle part ailleurs que dans les âmes{/teal} il ne convienne qu'elle ne vienne {teal}à l'existence. »{/teal} ({sky}132b{/sky}) C'est la thèse dite {violet}**noématique**{/violet} (du grec {blue}*noêma*{/blue}, la pensée). Elle aura une longue postérité : elle est à la racine de {amber}la tradition qui identifie le réel à quelque chose de mental{/amber}, et des {amber}théologiens qui voient les Idées comme des pensées dans l'esprit de Dieu{/amber}. Certains commentateurs ({sky}Brancacci{/sky}) pensent qu'elle viendrait d'{sky}Antisthène{/sky}.

    **Premier argument de Parménide :** {red}**on retombe dans une régression**{/red}**.**
    - {amber}Toute pensée est pensée __de__ quelque chose (elle a un objet).{/amber}
    - {amber}Ce que pense une pensée, c'est quelque chose d'un, qui vaut pour tous les cas : c'est-à-dire une Idée.{/amber}
    - Donc, si les Idées sont des pensées, {coral}chaque Idée est la pensée d'une Idée ; celle-ci, étant aussi une pensée, est la pensée d'une autre Idée, et ainsi de suite{/coral}. La régression {red}menace de nouveau l'Unicité, et, avec la pureté des Idées, l'Unité{/red}.

    **Second argument : avec le modèle du gâteau,** {red}**tout penserait**{/red}**.** Une pensée n'ayant pas de parties, {amber}participer d'une pensée, ce serait la recevoir tout entière{/amber}. Si les Idées sont des pensées, toutes les choses seraient faites de pensées, et donc {red}**toutes les choses penseraient**{/red} : c'est le {violet}**panpsychisme**{/violet}, que Parménide juge absurde. Dira-t-on qu'une chose peut avoir une pensée en elle sans penser ? Alors {red}il faudrait des pensées qui ne pensent pas{/red}, ce qui est absurde aussi. D'où l'alternative ({sky}132c{/sky}) : {teal}« {/teal}ou bien chaque Forme est {teal}constituée de pensées et chacune pense{/teal}, ou bien ce sont {teal}des pensées qui ne pensent pas »{/teal}.

    ! La thèse noématique {pink}ne nie pas que les Idées soient objets de pensée{/pink} : elle soutient qu'{amber}elles __ne sont que__ des pensées, sans existence hors des âmes{/amber}.
