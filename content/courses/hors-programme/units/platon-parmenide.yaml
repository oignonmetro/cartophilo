- id: platon-parmenide-i2
  title: "L'argument de Zénon (126a–128e) et la réponse de Socrate (128e–130a)"
  notes: |-
    Zénon défend le **monisme **de son maître Parménide (il n'existe qu'un seul être) en montrant que la thèse adverse, le **pluralisme**, mène à des absurdités pires encore que celles qu'on reproche au monisme (128c-d). En 127e, Socrate résume son argument : « "Si les choses sont plusieurs", il s'ensuit, dis-tu, qu'elles ne peuvent manquer d'être à la fois semblables et dissemblables, ce qui évidemment est impossible. » 
    Autrement dit : 
    - 1. Si les êtres sont plusieurs, ils sont à la fois semblables et dissemblables.
    - 2. Or, rien ne peut être à la fois semblable et dissemblable ;
    - 3. Donc les êtres ne sont pas plusieurs.

    ! Le texte ne donne pas la justification que Zénon avait en vue pour la prémisse 1 : Socrate se borne à résumer (127e), et Zénon décrit son livre comme une série de conséquences tirées de l'hypothèse pluraliste (128d) sans en détailler une seule.

    **1. Pourquoi le pluralisme entraînerait-il que les êtres soient « semblables et dissemblables » ?** 
    Parce que la notion même de pluralité semble exiger deux choses à la fois. D'une part, dire qu'il y a __plusieurs choses__, c'est dire qu'elles sont __distinctes __: si elles ne différaient en rien, on n'aurait pas plusieurs choses mais une seule. Or des choses qui diffèrent sont __dissemblables __au moins en cela. D'autre part, pour compter des choses comme « plusieurs », il faut __qu'elles aient quelque chose en commun__ (__toutes sont des êtres__, toutes appartiennent à la même pluralité), faute de quoi rien ne permettrait de les rassembler dans un même dénombrement. Or des choses qui ont un caractère en commun sont __semblables __au moins en cela. La prémisse 1 se présente ainsi comme une nécessité logique tirée de la notion de pluralité, et non comme un simple constat empirique.

    Mais Socrate fournit une autre justification de la prémisse 1. En __129a__, il demande à Zénon s'il admet qu'il existe une Forme en soi de la Ressemblance, dont la Dissemblance est le contraire, et que les choses multiples participent aux deux. Socrate en tire que **les choses qui participent aux deux Formes sont à la fois semblables et dissemblables**, et que, __même si « toutes choses » participent de ces deux Formes, elles sont « mutuellement semblables et dissemblables »__. L'adverbe « mutuellement » est important ici : il indique que ressemblance et dissemblance se jouent **entre les choses** prises les unes par rapport aux autres. Socrate accepte donc la prémisse 1 et l'explique par la participation, ce qui montre, par conséquent, qu'il n'y a aucune raison de la contester.

    2. Socrate attaque la prémisse suivante en s'appuyant sur la théorie des Idées. Les choses semblables le sont parce qu'elles participent d'une Idée séparée de la **Ressemblance**, les dissemblables parce qu'elles participent d'une Idée de la **Dissemblance**. Or **une même chose sensible peut participer des deux, ce qui ruine l'idée que ces deux caractères s'excluent**. Par exemple, une pierre peut ressembler à une autre et dissembler d'une autre.

    Il faut ici distinguer **contraires **et **contradictoires**, car toute la réponse de Socrate repose sur cette distinction, que Platon n'énonce pas sous ce nom mais qui est à l'œuvre dans son argument. Deux propriétés sont *contradictoires *quand l'une est la simple négation de l'autre (semblable et non semblable) : rien ne peut avoir les deux à la fois. Elles sont *contraires* quand elles s'opposent tout en pouvant coexister dans une même chose, pourvu que ce soit __{violet}à des égards différents{/violet}__ (semblable et dissemblable, grand et petit). au sens où __deux participations distinctes sont précisément deux égards distincts__. Par exemple Socrate est semblable à Platon (tous deux sont philosophes) et dissemblable de Mélétos (l'un est poète, l'autre non), de sorte qu'il est à la fois semblable et dissemblable sans aucune contradiction. Ou pour reprendre l'exemple de Socrate en 129c-d : on peut dire de lui qu'il est un (un seul dans le groupe de sept présents) et plusieurs (il a une droite et une gauche, un devant et un derrière) sans contradiction. D'où le **principe d'impureté des sensibles** : les choses sensibles peuvent avoir, et ont souvent, des propriétés contraires.

    Mais Socrate concède à Zénon une chose : il serait stupéfiant que les Idées elles-mêmes aient des propriétés contraires. C'est le **principe de pureté des Idées** : « si ce qu'est l'Un on montre que cela est en soi plusieurs, et si par ailleurs on montre que le Plusieurs est en fait un, voilà où je commencerai à m'étonner » (129b-c). __Impureté des sensibles__ et __pureté des Idées__ entraînent ensemble qu'**aucune Idée n'est identique à une chose sensible** : ce qui est impur ne peut être ce qui est pur.

    ! Socrate ne réfute pas directement la conclusion de Zénon : il conteste l'une de ses prémisses (rien ne peut être à la fois semblable et dissemblable)
