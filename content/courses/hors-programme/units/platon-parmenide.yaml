    sentence: "Parménide demande d'imiter Zénon, mais en changeant d'objet : « il faut ne laisser l'enquête s'égarer **ni dans les choses visibles** ni même dans ce qui les concerne, __mais l'appliquer aux choses qui sont par excellence__ ___ et dont on pourrait estimer que ce sont des Formes » (*Parménide*, 135e)"
    answer: "objets de la raison"
