- id: platon-parmenide-i21
  title: "Distinguer les deux parties du dialogue (126a-135c, 135d-166c)"
  notes: |-
    Le {sky}*Parménide*{/sky} se coupe en deux parties, et le dialogue devient déroutant dès qu'on passe de l'une à l'autre. Pour ne pas les confondre, on se pose quatre questions : **qui parle, de quoi, comment, pour quoi faire.**

    | Partie | Repère | Interlocuteur de Parménide | Objet | Méthode |
    | Première partie | 126a-135c | Socrate, très jeune (après Zénon) | les Idées (les Formes) | réfutation |
    | Seconde partie | 135d-166c | Aristote, jeune répondant docile | l'Un (*to hen*) | déductions à partir d'hypothèses |

    {amber}**Qui parle (le critère formel).**{/amber} Dans la {sky}première partie{/sky}, c'est {amber}un dialogue au sens ordinaire{/amber} : {sky}Socrate{/sky}, très jeune, discute avec Zénon puis avec Parménide et expose la théorie des Idées pour la soumettre à l'examen. Dans la {sky}seconde{/sky}, {amber}Parménide devient l'interlocuteur principal{/amber} : il propose à {sky}Aristote{/sky} un « exercice » dont il décrit le protocole. {coral}On passe d'une discussion de thèses à une gymnastique logique.{/coral}

    {amber}**De quoi (le critère de l'objet).**{/amber} Première partie : {amber}la théorie des Idées elle-même{/amber}, et la question de savoir si elle résiste aux objections : la {violet}participation{/violet} (l'Idée est-elle présente tout entière ou en partie dans chaque chose ?), le {violet}« troisième homme »{/violet} (une Idée qui unit les choses en exige une seconde pour l'unir à elles, et ainsi de suite), la {violet}connaissance{/violet} (si les Idées sont séparées, comment les connaît-on ?). Seconde partie : {amber}l'Un, considéré en lui-même{/amber}, et ce qui s'ensuit pour lui et pour les autres choses selon que l'on pose qu'il est ou qu'il n'est pas.

    {amber}**Comment (le critère de la méthode).**{/amber} La première partie procède par {violet}réfutation{/violet} : {yellow}Parménide pousse Socrate dans ses retranchements{/yellow}. La seconde procède par {violet}déductions à partir d'hypothèses{/violet} : huit raisonnements (neuf, selon la manière de découper), qui aboutissent souvent à {red}des conclusions contradictoires entre elles{/red}. {coral}La première ébranle une thèse ; la seconde est un entraînement dialectique{/coral} que Parménide juge nécessaire à qui veut discerner le vrai ({sky}135c-d{/sky}).

    {amber}**Pour quoi faire (le critère de la fonction).**{/amber} Les lectures divergent. La plus simple fait de la seconde partie la {green}**réponse méthodologique**{/green} à la première : {coral}Socrate définit les Idées avant de s'être exercé, et c'est cet exercice que la seconde partie fournit{/coral}. Une lecture plus ambitieuse y voit {amber}une reprise indirecte du problème des Idées{/amber} : l'Un y joue le rôle d'une Idée, et {coral}les contradictions qui en résultent diagnostiquent ce qui ne va pas dans la conception socratique de la participation{/coral}.

    {green}**Le repère le plus sûr**{/green} : que fait Parménide ? Dans la première partie, il {amber}**objecte**{/amber} (il joue l'adversaire de la théorie). Dans la seconde, il {amber}**démontre**{/amber} (il déroule des déductions). Le passage de l'un à l'autre est marqué en {sky}135c-136c{/sky}, quand il explique en quoi consistera l'exercice.

    ! Les bornes exactes varient selon les découpages : le plan de la leçon d'introduction place les critiques jusqu'en {sky}134e{/sky} et le programme de l'exercice en {sky}134e-137c{/sky} ; ici, on retient {sky}135c{/sky} comme fin de la première partie et {sky}135d{/sky} comme début de la seconde.
  tables:
