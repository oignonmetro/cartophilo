- id: platon-parmenide-i2
  title: "L'argument de Zénon (126a–128e) et la réponse de Socrate (128e–130a)"
  notes: |-
    {sky}Zénon{/sky} défend le {violet}**monisme**{/violet} de son maître Parménide ({amber}il n'existe qu'un seul être{/amber}) en montrant que la thèse adverse, le {red}**pluralisme**{/red}, {coral}mène à des absurdités pires encore que celles qu'on reproche au monisme{/coral} ({sky}128c-d{/sky}). En {sky}127e{/sky}, Socrate résume son argument : {teal}« {/teal}"Si les choses sont plusieurs", il s'ensuit, dis-tu, qu'elles ne peuvent manquer d'être {teal}à la fois semblables et dissemblables{/teal}, ce qui évidemment {teal}est impossible. »{/teal}
    Autrement dit :
    - 1. {amber}Si les êtres sont plusieurs, ils sont à la fois semblables et dissemblables.{/amber}
    - 2. {amber}Or, rien ne peut être à la fois semblable et dissemblable ;{/amber}
    - 3. {coral}Donc les êtres ne sont pas plusieurs.{/coral}

    ! Le texte {red}ne donne pas la justification que Zénon avait en vue pour la prémisse 1{/red} : Socrate se borne à résumer ({sky}127e{/sky}), et Zénon décrit son livre comme une série de conséquences tirées de l'hypothèse pluraliste ({sky}128d{/sky}) sans en détailler une seule.

    {amber}**1. Pourquoi le pluralisme entraînerait-il que les êtres soient « semblables et dissemblables » ?**{/amber}
    Parce que la notion même de pluralité semble exiger deux choses à la fois. D'une part, dire qu'il y a __plusieurs choses__, c'est dire qu'elles sont __distinctes__ : si elles ne différaient en rien, on n'aurait pas plusieurs choses mais une seule. Or {coral}des choses qui diffèrent sont __dissemblables__ au moins en cela{/coral}. D'autre part, pour compter des choses comme « plusieurs », il faut __qu'elles aient quelque chose en commun__ (__toutes sont des êtres__, toutes appartiennent à la même pluralité), faute de quoi rien ne permettrait de les rassembler dans un même dénombrement. Or {coral}des choses qui ont un caractère en commun sont __semblables__ au moins en cela{/coral}. La prémisse 1 se présente ainsi comme {green}une nécessité logique tirée de la notion de pluralité{/green}, et {pink}non comme un simple constat empirique{/pink}.

    Mais Socrate fournit une autre justification de la prémisse 1. En {sky}__129a__{/sky}, il demande à Zénon s'il admet qu'il existe une {violet}Forme en soi de la Ressemblance{/violet}, dont la {violet}Dissemblance{/violet} est le contraire, et que les choses multiples participent aux deux. Socrate en tire que **les choses qui participent aux deux Formes sont à la fois semblables et dissemblables**, et que, __même si {teal}« {/teal}toutes choses{teal} »{/teal} participent de ces deux Formes, elles sont {teal}« mutuellement{/teal} semblables et {teal}dissemblables »{/teal}__. L'adverbe « mutuellement » est important ici : il indique que {coral}ressemblance et dissemblance se jouent **entre les choses** prises les unes par rapport aux autres{/coral}. Socrate {green}accepte donc la prémisse 1 et l'explique par la participation{/green}, ce qui montre, par conséquent, qu'il n'y a aucune raison de la contester.

    2. Socrate attaque la prémisse suivante en s'appuyant sur la théorie des Idées. Les choses semblables le sont parce qu'elles participent d'une Idée séparée de la {amber}**Ressemblance**{/amber}, les dissemblables parce qu'elles participent d'une Idée de la {amber}**Dissemblance**{/amber}. Or **une même chose sensible peut participer des deux, ce qui** {red}**ruine l'idée que ces deux caractères s'excluent**{/red}. Par exemple, {yellow}une pierre peut ressembler à une autre et dissembler d'une autre{/yellow}.

    Il faut ici distinguer {violet}**contraires**{/violet} et {violet}**contradictoires**{/violet}, car toute la réponse de Socrate repose sur cette distinction, que Platon n'énonce pas sous ce nom mais qui est à l'œuvre dans son argument. Deux propriétés sont *contradictoires* quand {amber}l'une est la simple négation de l'autre{/amber} ({yellow}semblable et non semblable{/yellow}) : rien ne peut avoir les deux à la fois. Elles sont *contraires* quand {amber}elles s'opposent tout en pouvant coexister dans une même chose{/amber}, pourvu que ce soit __{violet}à des égards différents{/violet}__ ({yellow}semblable et dissemblable, grand et petit{/yellow}). au sens où {coral}__deux participations distinctes sont précisément deux égards distincts__{/coral}. Par exemple {yellow}Socrate est semblable à Platon (tous deux sont philosophes) et dissemblable de Mélétos (l'un est poète, l'autre non){/yellow}, de sorte qu'il est à la fois semblable et dissemblable sans aucune contradiction. Ou pour reprendre l'exemple de Socrate en {sky}129c-d{/sky} : on peut dire de lui qu'il est {yellow}un (un seul dans le groupe de sept présents) et plusieurs (il a une droite et une gauche, un devant et un derrière){/yellow} sans contradiction. D'où le {violet}**principe d'impureté des sensibles**{/violet} : {green}les choses sensibles peuvent avoir, et ont souvent, des propriétés contraires{/green}.

    Mais Socrate concède à Zénon une chose : {red}il serait stupéfiant que les Idées elles-mêmes aient des propriétés contraires{/red}. C'est le {violet}**principe de pureté des Idées**{/violet} : {teal}« {/teal}si ce qu'est {teal}l'Un{/teal} on montre que cela est {teal}en soi plusieurs{/teal}, et si par ailleurs on montre que {teal}le Plusieurs est en fait un{/teal}, voilà où je {teal}commencerai à m'étonner »{/teal} ({sky}129b-c{/sky}). __Impureté des sensibles__ et __pureté des Idées__ entraînent ensemble qu'{green}**aucune Idée n'est identique à une chose sensible**{/green} : {coral}ce qui est impur ne peut être ce qui est pur{/coral}.

    ! Socrate {red}ne réfute pas directement la conclusion de Zénon{/red} : {green}il conteste l'une de ses prémisses{/green} (rien ne peut être à la fois semblable et dissemblable)
