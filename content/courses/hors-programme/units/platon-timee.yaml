- id: platon-timee-i2
  title: "Le statut du discours : un mythe vraisemblable"
  notes: |-
    **Timée prévient que son discours ne sera que** {violet}**« vraisemblable »**{/violet} ({blue}*eikôs logos*{/blue}, {blue}*eikôs muthos*{/blue}) : {coral}**parce qu'il porte sur une image, il ne peut avoir la stabilité d'un discours sur le modèle**{/coral}**.** Le jeu de mots est voulu : l'objet du discours est lui-même une {violet}image{/violet} ({blue}*eikôn*{/blue}) du modèle éternel, et {coral}un discours a le caractère de ce dont il parle{/coral} ({sky}29b{/sky}). {sky}Brisson{/sky} traduit : {teal}« {/teal}Ce que {teal}l'être est au devenir{/teal}, {teal}la vérité l'est à la croyance »{/teal}.

    | Objet | Discours qui lui convient | Faculté |
    | le modèle, ce qui demeure | stable, inébranlable, irréfutable | l'intellect (`nous`) |
    | l'image, ce qui devient | vraisemblable, révisable | la croyance (`pistis`) |

    Le mot a deux faces, qu'il faut garder ensemble. Il {pink}abaisse les attentes{/pink} : sur le devenir, pas d'explications {teal}« {/teal}totalement {teal}cohérentes avec elles-mêmes et parfaitement exactes »{/teal}, car {teal}« {/teal}moi qui parle et vous qui êtes mes juges sommes {teal}d'humaine nature »{/teal}. Mais il {green}fixe aussi une exigence{/green} : Timée promet des explications qui {teal}« {/teal}ne sont pas des images {teal}plus infidèles qu'une autre »{/teal} ; et si {teal}« {/teal}on nous propose un {teal}mythe vraisemblable »{/teal}, {teal}« {/teal}il ne sied pas de {teal}chercher plus loin »{/teal}.

    Le discours reste {violet}ouvert à la révision{/violet} : sur {yellow}le choix des triangles{/yellow}, Timée promet que si quelqu'un trouve mieux, {teal}« {/teal}c'est à lui que reviendra {teal}en toute amitié le prix »{/teal} ; et les principes premiers, {coral}seul les connaît le dieu{/coral}, avec {teal}« {/teal}ceux que ce dieu {teal}a en amitié »{/teal}.

    Pour {sky}Zeyl et Sattler{/sky} (auteurs de l'entrée consacrée au Timée dans l'encyclopédie de philosophie de Stanford), l'opposition est entre {amber}la certitude démonstrative, possible sur l'intelligible{/amber}, et {amber}la plausibilité, seule possible sur l'empirique{/amber}. En tant que le monde devient et se perçoit, {pink}le discours ne sera pas plus que vraisemblable{/pink} ; en tant qu'il est beau, ordonné, copié sur un modèle parfait par le meilleur des artisans, {green}il ne sera pas moins que vraisemblable{/green}.

    ! « Vraisemblable » {red}ne veut pas dire « métaphorique »{/red} : la vraisemblance oppose {green}un discours révisable à un discours démonstratif{/green}, {red}pas un récit imagé à un récit littéral{/red}. On ne peut donc pas en tirer que la création n'est qu'une image.
