- id: platon-timee-i9
  title: "Intellect et nécessité : deux sortes de causes"
  notes: |-
    **Timée distingue** {green}**la cause véritable**{/green}**, qui agit avec intelligence en vue du meilleur, et** {pink}**les causes accessoires**{/pink} ({blue}*sunaitiai*{/blue})**,** {amber}**les processus physiques sans lesquels la fin ne serait pas atteinte**{/amber}**.** {sky}Brisson{/sky} traduit {blue}*sunaitiai*{/blue} par « causes accessoires » ({sky}46c{/sky}) ou « causes concomitantes » ({sky}46e{/sky}).

    | | La cause véritable | Les causes accessoires |
    | ce qu'elle est | l'intellect, qui réside dans une âme | les corps : feu, eau, terre, air |
    | comment elle agit | en vue du beau et du bien | elle transmet un mouvement reçu, par nécessité |
    | son effet laissée seule | l'ordre | des effets produits « au hasard et sans ordre » (46e) |

    {red}L'erreur du grand nombre{/red} est de prendre les secondes pour les premières : {teal}« {/teal}le grand nombre croit qu'il s'agit là {teal}non de causes accessoires{/teal}, mais {teal}des causes de toutes choses »{/teal}, parce qu'{yellow}elles réchauffent et refroidissent{/yellow}. Mais {coral}elles ne peuvent faire preuve{/coral} {teal}« {/teal}d'aucune {teal}intention intelligente »{/teal} ({sky}46d{/sky}).

    **La** {sky}**deuxième partie du discours**{/sky} s'ouvre sur ce principe ({sky}47e-48a{/sky}) : {teal}« {/teal}la venue à l'être de notre monde résulta {teal}d'un mélange qui réunissait la nécessité et l'intellect »{/teal}. {green}L'intellect domine la nécessité{/green} {teal}« {/teal}en {teal}la persuadant »{/teal} de réaliser au mieux la plupart des choses. Pour dire comment le monde est né, il faut donc faire intervenir aussi {teal}« {/teal}l'espèce de {teal}la cause errante »{/teal} : {violet}la nécessité{/violet}, {amber}en tant qu'elle ne vise rien{/amber}.

    Les propriétés des structures physiques {amber}sont fixées par leur constitution{/amber}, et {red}le démiurge ne peut pas les changer{/red} : il ne commande pas à la nécessité, il la {violet}**persuade**{/violet}, c'est-à-dire qu'{coral}il tire parti de ces propriétés{/coral}. {red}Là où la persuasion échoue, l'excellence du monde trouve sa limite.{/red}

    ! La nécessité du *Timée* {red}n'est pas la nécessité logique ni un ordre rigoureux{/red} : {green}c'est la causalité aveugle des corps{/green}, que {sky}Brisson{/sky} rapproche du « matériau » livré à lui-même, et c'est pourquoi {coral}elle peut être dite « errante »{/coral}.
