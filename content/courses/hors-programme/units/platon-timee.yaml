- id: platon-timee-i15
  title: "L'homme : l'intellect et la nécessité ensemble"
  notes: |-
    **La** {sky}**troisième partie du discours**{/sky} **montre** {green}**l'intellect et la nécessité coopérant à la fabrication de l'homme**{/green} **: l'intellect** {amber}**fixe la fin de chaque organe**{/amber}**, la nécessité** {amber}**fournit des matériaux dont les propriétés s'y prêtent, ou parfois y résistent**{/amber}**.**

    **Qui fabrique quoi.** {amber}Le démiurge a fait les âmes immortelles{/amber} ; {amber}il confie les corps aux dieux inférieurs qu'il a engendrés{/amber}. {sky}Brisson{/sky} : {teal}« {/teal}il a confié le soin {teal}d'engendrer les vivants mortels{/teal} à {teal}ceux qui étaient nés de lui »{/teal}. L'âme immortelle, logée dans un corps mortel, reçoit alors {violet}des parties mortelles{/violet}, celles que connaissent déjà {sky}*La République*{/sky} et le {sky}*Phèdre*{/sky} :

    | Partie de l'âme | Siège | Organes qui la servent |
    | raisonnable, immortelle | la tête | |
    | ardente (`thumos`) | la poitrine, près de la tête | le cœur, les poumons |
    | désirante | le ventre | le foie |

    **Quand la nécessité** {red}**résiste**{/red}**.** Le plus souvent, {green}les matériaux servent bien les fins de l'intellect{/green}. {red}Pas toujours{/red} : {yellow}l'enveloppe du cerveau devrait être épaisse pour le protéger, mais une enveloppe épaisse émousserait la sensation{/yellow}. {sky}Brisson{/sky} : {teal}« {/teal}ce dont l'être et le développement dépendent de la nécessité {teal}ne peut allier un os compact et une chair épaisse{/teal} avec {teal}une grande acuité sensorielle »{/teal}. Il faut choisir entre les deux exigences, et {yellow}la tête reçoit une couverture légère{/yellow}. {coral}Ces résistances de la nécessité à la « persuasion » de l'intellect bornent l'excellence que le monde peut atteindre.{/coral}

    Viennent ensuite {yellow}la respiration, la digestion, les maladies du corps et de l'âme{/yellow}, et une exhortation à exercer l'un et l'autre ; le discours s'achève sur {yellow}la naissance des femmes et des animaux{/yellow} ({sky}90e-92c{/sky}).

    ! Le mal et l'imperfection {red}ne viennent pas d'une négligence du démiurge{/red}, mais {green}de la nécessité{/green} : {coral}il fait le meilleur *possible* avec des matériaux qui ont leurs propres propriétés{/coral}.
