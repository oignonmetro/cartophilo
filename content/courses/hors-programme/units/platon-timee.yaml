- id: platon-timee-i18
  title: "Deux téléologies : Platon et Aristote"
  notes: |-
    {sky}**Platon**{/sky} **et** {sky}**Aristote**{/sky} **expliquent tous deux la nature par la** {violet}**fin**{/violet} **; mais chez Aristote** {amber}**la fin est immanente à la nature et locale**{/amber}**, chez Platon** {amber}**elle est imposée de l'extérieur par un artisan et vaut pour le monde entier**{/amber}**.**

    | | Platon (*Timée*) | Aristote |
    | qui vise la fin | un artisan divin, extérieur à la nature | la nature elle-même |
    | où est la fin | dans le plan de l'Intellect | dans la forme de l'être naturel |
    | échelle | globale : le monde entier est fait pour le meilleur | locale : tel organe, telle structure, presque jamais le monde comme tout |
    | point de départ | un chaos sans forme propre | un individu qui hérite la forme de son géniteur |

    Pour Aristote, {amber}le développement d'un individu est réglé par la forme reçue de son parent mâle{/amber} : {coral}sa fin est d'actualiser pleinement cette forme{/coral}. Pour Platon, {amber}l'étoffe primitive du monde n'a aucune forme qui la dirige vers une fin{/amber} : {coral}la cause de son ordre doit donc lui être extérieure{/coral}. {red}Une téléologie immanente n'est pas une option pour lui.{/red}

    ! Aristote {red}n'abandonne pas la finalité{/red} : {green}il la place dans la nature au lieu d'un artisan{/green}. Opposer {red}« Platon finaliste » à « Aristote mécaniste »{/red} serait un contresens.
  points:
  - id: platon-timee-i18-p1
    sentence: "__Chez Aristote, la fin est__ ___ à la nature : c'est **la nature elle-même** qui agit en vue d'une fin."
    answer: "immanente"
