- id: platon-timee-i20
  title: "La place du Timée dans l'œuvre"
  notes: |-
    On tient traditionnellement le *Timée* pour **un dialogue tardif ; G. E. L. Owen a soutenu en 1953 qu'il appartenait à la période de la maturité, et le débat qui a suivi a renouvelé l'étude de Platon.**

    | | G. E. L. Owen (1953) | H. F. Cherniss (réponse) |
    | date du *Timée* | dialogue de la maturité, avant le *Théétète* et le *Parménide* | dialogue tardif, après eux |
    | argument | il réaffirme des thèses de *La République* que ces deux dialogues réfutent | les arguments du *Théétète* et du *Parménide* sont mal lus |
    | la stylométrie | ses présupposés et ses résultats sont contestables | elle confirme la tradition |

    Avec le temps, la position traditionnelle a tenu : une lecture plus fine des textes et des études stylométriques assistées par ordinateur l'ont confirmée.

    **Les liens avec les autres dialogues** sont explicites :

    | Dialogue | Lien |
    | *République* | la cité exposée la veille, résumée en 17c-19b |
    | *Critias* | la suite annoncée, restée inachevée |
    | *Phédon* | la demande d'une explication par le meilleur (97b-99d), que le *Timée* satisfait, en y ajoutant les causes matérielles |
    | *Philèbe* | l'illimité (`apeiron`), proche du réceptacle |

    ! La date du *Timée* n'est pas une question d'érudition : si le dialogue est tardif, Platon y maintient les Idées après les objections du *Parménide*.
  points:
  - id: platon-timee-i20-p1
