- id: platon-timee-i10
  title: "Le troisième genre : le réceptacle"
  notes: |-
    **Pour expliquer le devenir,** {red}**deux genres ne suffisent plus**{/red} **: il faut, à côté du modèle intelligible et de sa copie visible, un** {violet}**« troisième genre »**{/violet}**,** {green}**le réceptacle de tout ce qui naît**{/green}**.** {sky}Brisson{/sky} traduit : {teal}« {/teal}il nous faut maintenant en découvrir {teal}un autre, un troisième »{/teal} ; il est, {teal}« {/teal}de tout ce qui est soumis à la génération elle est {teal}le réceptacle{/teal}, et, pour employer une image, {teal}la nourrice »{/teal}.

    **Le problème qu'il résout (**{sky}**49b-50a**{/sky}**).** On voit {yellow}l'eau se condenser en pierre et en terre, s'évaporer en air, l'air s'enflammer en feu{/yellow}, et inversement : {teal}« {/teal}ils se donnent naissance {teal}les uns aux autres, en cercle »{/teal}. Ce qui apparaît maintenant comme du feu {red}ne l'est donc pas en propre{/red} : {coral}il ne le reste pas{/coral}. On ne peut pas dire {red}« ceci est du feu »{/red}, mais seulement {green}« ce qui chaque fois est tel ou tel, c'est du feu »{/green}.

    | Ce dont on parle | Comment en parler | Pourquoi |
    | le feu, l'eau, la terre, l'air | « ce qui est tel » | ils changent sans cesse les uns dans les autres |
    | ce en quoi ils apparaissent et disparaissent | « ceci », « cela » | lui seul demeure |

    La solution : {green}ce qui demeure sous ces apparences, c'est le réceptacle lui-même{/green}, {amber}sans caractère propre{/amber}, que ses parties prennent tour à tour. Le feu observé n'est que {teal}« {/teal}la portion du réceptacle {teal}qui est enflammée »{/teal}.

    ! Le réceptacle {red}n'est ni l'un des quatre éléments ni leur mélange{/red} : {green}il est ce en quoi ils apparaissent{/green}, et {coral}n'a lui-même aucune de leurs propriétés{/coral}.
