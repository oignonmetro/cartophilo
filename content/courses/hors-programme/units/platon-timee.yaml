- id: platon-timee-i2
  title: "Le statut du discours : un mythe vraisemblable"
  notes: |-
    **Timée prévient que son discours ne sera que « vraisemblable » (`eikôs logos`, `eikôs muthos`) : parce qu'il porte sur une image, il ne peut avoir la stabilité d'un discours sur le modèle.** Le jeu de mots est voulu : l'objet du discours est lui-même une image (`eikôn`) du modèle éternel, et un discours a le caractère de ce dont il parle (29b). Brisson traduit : « Ce que l'être est au devenir, la vérité l'est à la croyance ».

    | Objet | Discours qui lui convient | Faculté |
    | le modèle, ce qui demeure | stable, inébranlable, irréfutable | l'intellect (`nous`) |
    | l'image, ce qui devient | vraisemblable, révisable | la croyance (`pistis`) |

    Le mot a deux faces, qu'il faut garder ensemble. Il abaisse les attentes : sur le devenir, pas d'explications « totalement cohérentes avec elles-mêmes et parfaitement exactes », car « moi qui parle et vous qui êtes mes juges sommes d'humaine nature ». Mais il fixe aussi une exigence : Timée promet des explications qui « ne sont pas des images plus infidèles qu'une autre » ; et si « on nous propose un mythe vraisemblable », « il ne sied pas de chercher plus loin ».

    Le discours reste ouvert à la révision : sur le choix des triangles, Timée promet que si quelqu'un trouve mieux, « c'est à lui que reviendra en toute amitié le prix » ; et les principes premiers, seul les connaît le dieu, avec « ceux que ce dieu a en amitié ».

    Pour Zeyl et Sattler (auteurs de l'entrée consacrée au Timée dans l'encyclopédie de philosophie de Stanford), l'opposition est entre la certitude démonstrative, possible sur l'intelligible, et la plausibilité, seule possible sur l'empirique. En tant que le monde devient et se perçoit, le discours ne sera pas plus que vraisemblable ; en tant qu'il est beau, ordonné, copié sur un modèle parfait par le meilleur des artisans, il ne sera pas moins que vraisemblable.

    ! « Vraisemblable » ne veut pas dire « métaphorique » : la vraisemblance oppose un discours révisable à un discours démonstratif, pas un récit imagé à un récit littéral. On ne peut donc pas en tirer que la création n'est qu'une image.
