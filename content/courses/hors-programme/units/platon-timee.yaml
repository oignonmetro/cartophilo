- id: platon-timee-i3
  title: "Être et devenir : le point de départ"
  notes: |-
    Le prélude part de la distinction de *La République* : **d'un côté ce qui est toujours sans jamais devenir, de l'autre ce qui devient toujours sans être jamais, et à chacun son mode de connaissance.** Brisson traduit la question initiale : « qu'est-ce qui est toujours, sans jamais devenir, et qu'est-ce qui devient toujours, sans être jamais ? »

    | | Ce qui est toujours | Ce qui devient toujours |
    | se saisit par | l'intellect (`noêsis`) | l'opinion (`doxa`) |
    | avec | une explication rationnelle (`logos`) | une perception sensible (`aisthêsis`) « rebelle à toute explication rationnelle » |
    | statut | « ce qui toujours reste identique » | « ce qui naît et se corrompt, ce qui n'est réellement jamais » |

    Timée ne nomme pas encore les Idées (les « formes intelligibles » de Brisson) : il faut attendre 51b-e pour qu'elles soient mentionnées, et leur existence y est alors démontrée. Mais le lecteur de *La République* reconnaît la distinction des Idées et des choses sensibles (*République* 518c, 534a).

    **Deux lectures de la question.** « Qu'est-ce qui est toujours ? » peut se lire en extension : quelles choses sont ainsi ? Réponse : les Idées. Ou en compréhension : qu'est-ce qu'être toujours ? Réponse : c'est être intelligible et immuable. Zeyl et Sattler préfèrent la seconde, parce que le texte y répond aussitôt.

    ! « Devenir » n'est pas une étape vers l'être : ce qui devient « devient toujours » et n'est « jamais » ; la frontière entre les deux est infranchissable.
  points:
