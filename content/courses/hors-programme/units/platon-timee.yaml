- id: platon-timee-i17
  title: "La téléologie : du Phédon au démiurge"
  notes: |-
    Le *Timée* donne enfin ce que Socrate cherchait en vain dans le *Phédon* : **une explication du monde par le meilleur, où l'intellect est vraiment cause.** Dans le *Phédon* (97b-99d), Socrate raconte sa déception devant Anaxagore : celui-ci disait que l'Intellect ordonne tout, mais n'expliquait ensuite les choses que par des causes physiques. Faute de trouver l'explication par le meilleur, Socrate se rabattait sur une « seconde navigation » : expliquer par la participation aux Idées (99c).

    **Ce qui a permis la découverte**, selon Zeyl et Sattler : sans doute l'Idée du Bien de *La République*, qu'on peut rapprocher de l'ordre rationnel et mathématique. Les Idées sont bonnes parce qu'elles possèdent cet ordre parfaitement ; le sensible l'est dans la mesure où il y participe. Reste à expliquer comment cet ordre passe dans le monde visible : le *Timée* répond qu'il n'y est pas inhérent, mais **imposé** par l'Intellect.

    **Où placer l'Intellect ?** Le démiurge est une figure de l'Intellect. Mais l'Intellect lui-même est-il du côté de l'être ou du devenir ?

    | Hypothèse | Pourquoi Zeyl et Sattler la rejettent |
    | l'âme du monde (puisque l'intellect ne va pas sans âme, 30b) | l'âme du monde est une œuvre du démiurge, donc du devenir |
    | une Idée (le monde des Idées, l'Idée du Bien, l'Idée de l'Intelligence) | une Idée est un objet connu, non un sujet qui connaît et qui agit |
    | une personnification du savoir-faire | même objection |

    Leur conclusion : l'Intellect est une réalité d'un genre propre, au-delà de l'opposition de l'être et du devenir, qui n'est donc pas exhaustive ; peut-être pas sans rapport avec le Dieu des religions abrahamiques.

    ! Dire que le démiurge « représente » l'Intellect ne règle pas la question de son statut : c'est justement ce statut que les interprètes discutent.
