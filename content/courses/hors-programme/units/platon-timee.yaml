- id: platon-timee-i14
  title: "La physique des triangles"
  notes: |-
    **Les quatre éléments sont faits de corpuscules en forme de polyèdres réguliers, dont les faces se composent de deux sortes de triangles rectangles : ces triangles sont les « simples » de toute la physique.** Tout corps a de la profondeur, la profondeur est bornée par des surfaces, toute surface plane se décompose en triangles (53c). Brisson : « une explication qui combine vraisemblance et nécessité » ; les principes encore antérieurs, « dieu les connaît et parmi les hommes ceux que ce dieu a en amitié ».

    **Les deux triangles.** L'isocèle rectangle, et, parmi les scalènes, « le plus beau » : le demi-triangle équilatéral, dont l'hypoténuse est double du petit côté (côtés dans le rapport 1, √3, 2).

    | Élément | Polyèdre | Faces | Triangle de base |
    | feu | tétraèdre | 4 triangles équilatéraux | demi-équilatéral |
    | air | octaèdre | 8 triangles équilatéraux | demi-équilatéral |
    | eau | icosaèdre | 20 triangles équilatéraux | demi-équilatéral |
    | terre | cube | 6 carrés | isocèle |

    Le cinquième polyèdre régulier, le dodécaèdre, « le dieu s'en est servi pour l'univers, lorsqu'il y peignit des figures animales » : c'est le plus proche de la sphère.

    **Les transformations.** Feu, air et eau ont des faces de même triangle : leurs corpuscules, en se brisant, se recomposent les uns dans les autres (deux tétraèdres de feu font un octaèdre d'air, 4 + 4 = 8 faces). La terre, faite d'isocèles, ne se change en rien d'autre. Timée corrige ainsi ce qu'il disait en 49c : que les quatre naissent tous les uns des autres, « c'était là une apparence trompeuse ».

    **Pourquoi le cube à la terre ?** Parce qu'elle est le plus difficile des corps à mouvoir, et que le carré offre la base la plus stable (55d-e). Le feu reçoit le plus mobile et le plus petit, le tétraèdre.

    **Physique et métaphysique.** L'Idée du Feu n'a ni éclat, ni légèreté, ni chaleur. Mais, sachant ce qu'est le feu, le démiurge sait que ses copies doivent apparaître brillantes, légères et chaudes, et choisit pour elles le corps qui convient le mieux à ces propriétés. Chaque arrangement de triangles produit en celui qui perçoit une affection (`pathos`) : c'est ainsi qu'il sent le chaud ou le froid.

    ! L'exclusion de la terre est un cas où la méthode *a priori* contredit l'observation : on croit voir l'eau devenir pierre, mais la géométrie l'interdit.
