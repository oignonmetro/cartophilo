- id: platon-timee-i18
  title: "Deux téléologies : Platon et Aristote"
  notes: |-
    **Platon et Aristote expliquent tous deux la nature par la fin ; mais chez Aristote la fin est immanente à la nature et locale, chez Platon elle est imposée de l'extérieur par un artisan et vaut pour le monde entier.**

    | | Platon (*Timée*) | Aristote |
    | qui vise la fin | un artisan divin, extérieur à la nature | la nature elle-même |
    | où est la fin | dans le plan de l'Intellect | dans la forme de l'être naturel |
    | échelle | globale : le monde entier est fait pour le meilleur | locale : tel organe, telle structure, presque jamais le monde comme tout |
    | point de départ | un chaos sans forme propre | un individu qui hérite la forme de son géniteur |

    Pour Aristote, le développement d'un individu est réglé par la forme reçue de son parent mâle : sa fin est d'actualiser pleinement cette forme. Pour Platon, l'étoffe primitive du monde n'a aucune forme qui la dirige vers une fin : la cause de son ordre doit donc lui être extérieure. Une téléologie immanente n'est pas une option pour lui.

    ! Aristote n'abandonne pas la finalité : il la place dans la nature au lieu d'un artisan. Opposer « Platon finaliste » à « Aristote mécaniste » serait un contresens.
  points:
  - id: platon-timee-i18-p1
    sentence: "Chez Aristote, la fin est ___ à la nature : c'est la nature elle-même qui agit en vue d'une fin."
    answer: "immanente"
    alt: ["intérieure"]
