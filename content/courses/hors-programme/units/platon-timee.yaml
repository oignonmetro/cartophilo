- id: platon-timee-i4
  title: "Du monde sensible à son artisan : l'argument"
  notes: |-
    **De la distinction être/devenir, Timée tire en quelques lignes la thèse qui encadre tout le dialogue : le monde est l'œuvre d'un artisan parfaitement bon, qui l'a fabriqué sur un modèle éternel.** L'argument se reconstruit ainsi :

    | Étape | Ce qui est posé | Repère |
    | 1 | tout ce qui naît naît par une cause | 28a |
    | 2 | le monde est né : on le voit, on le touche, il a un corps, il est sensible | 28b-c |
    | 3 | il a donc une cause, un fabricant qui a travaillé sur un modèle | 28c |
    | 4 | ce modèle est éternel ou engendré | 28c-29a |
    | 5 | le monde est le plus beau, son fabricant le meilleur : le modèle est éternel | 29a |

    Brisson traduit : « sans l'intervention d'une cause, rien ne peut être engendré » ; le monde est engendré, « car on peut le voir et le toucher et par suite il a un corps ». Mais « trouver le fabricant et le père de l'univers exige un effort ». Enfin, le démiurge a fixé les yeux sur l'éternel, car « ce monde en effet est la plus belle des choses qui ont été engendrées, et son fabricant, la meilleure des causes ».

    **Le point faible**, selon Zeyl et Sattler : qu'il y ait une cause ne prouve pas encore que ce soit un artisan. Ce qui comble l'écart est la beauté du monde (étape 5) : Timée cherche à expliquer non pas un monde quelconque, mais un monde suprêmement beau, et la possibilité qu'une cause non intelligente produise une telle beauté n'est même pas envisagée.

    **La méthode qui en découle.** La question n'est pas « qu'est-ce qui explique au mieux ce que j'observe ? », mais « si le monde est le meilleur possible, quels traits doit-il avoir ? ». D'où des réponses *a priori* (pourquoi il existe, pourquoi il est vivant, unique, sphérique), recoupées par l'observation (le mouvement des astres, le corps humain). Elles concordent le plus souvent ; pas toujours (la terre exclue des transformations, voir la leçon sur la physique).

    ! L'argument ne dit pas que le monde a été copié sur un modèle *parce qu'*il est sensible : c'est sa beauté, jointe à la bonté de l'artisan, qui impose un modèle éternel.
