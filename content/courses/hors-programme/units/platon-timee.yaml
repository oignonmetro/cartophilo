- id: platon-timee-i1
  title: "Le dialogue : cadre, personnages, plan"
  notes: |-
    Le *Timée* raconte **la fabrication du monde : l'univers est l'œuvre d'un dieu artisan, le démiurge, qui, les yeux fixés sur un modèle éternel, impose un ordre mathématique à un chaos préexistant.** Le principe d'explication est la finalité : l'univers et chacune de ses parties sont disposés en vue du meilleur. Cet arrangement n'est pas un hasard, il est voulu par l'Intellect (`nous`), que la figure du démiurge représente sous les traits d'un homme de métier.

    **Le cadre.** Pendant les Panathénées, Socrate retrouve Timée (de Locres, en Italie), Critias et Hermocrate. La veille, il leur a exposé une cité idéale très proche de celle de *La République* (résumée en 17c-19b). Ses hôtes lui rendent la politesse en deux temps : Timée racontera la naissance de l'univers jusqu'à celle de l'homme ; Critias montrera ensuite la cité idéale en action, l'Athènes d'autrefois en guerre contre l'Atlantide (récit commencé dans le *Critias*, resté inachevé).

    | Moment | Repère | Contenu |
    | conversation d'ouverture | 17a-27d | personnages, programme, récit de l'Atlantide |
    | prélude de Timée | 27d-29d | principes, démiurge et modèle, statut du discours |
    | les œuvres de l'Intellect | 29d-47e | le monde vivant, son âme, le temps, l'homme, la vue |
    | les effets de la nécessité | 47e-69a | le réceptacle, les éléments, les sensations |
    | l'Intellect et la nécessité ensemble | 69a-92c | le corps et l'âme de l'homme, les maladies, les animaux |

    Ce plan se joue en fin de leçon comme un exercice de repérage (remettre les moments dans l'ordre, replacer leurs repères) ; les leçons de repérage, à la fin de l'unité, le détaillent partie par partie.

    Après le prélude, le discours de Timée n'est plus interrompu jusqu'à la fin : c'est un monologue, qui ressemble plus à un exposé faisant autorité qu'à une enquête par questions.

    **Sa fortune.** Traduit en latin par Calcidius au IVe siècle, le *Timée* fut le seul texte de Platon accessible dans l'Occident latin jusqu'au XIIe siècle ; Kepler s'y réfère encore. Longtemps jugé philosophiquement mineur au XXe siècle, il connaît depuis quelques décennies un fort regain d'intérêt.

    ! Le *Timée* n'est pas un dialogue de recherche où Socrate interroge : Socrate y écoute, et Timée parle presque seul.
