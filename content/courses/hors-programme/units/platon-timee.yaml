- id: platon-timee-i19
  title: "Une création au sens propre ? Lecture littérale et métaphorique"
  notes: |-
    {amber}**Faut-il prendre à la lettre le récit d'un monde fabriqué à un moment donné, ou y lire l'exposé des principes qui font tenir le monde de tout temps ?**{/amber} **La question divise les interprètes depuis** {sky}**Aristote**{/sky}**.**

    Aristote {red}rejetait la cosmologie du *Timée*{/red} : elle supposait {red}un commencement non seulement de l'univers dans le temps, mais du temps lui-même{/red} ({sky}*Physique* VIII, 251b14-26{/sky}). Pour neutraliser cette critique, les défenseurs du dialogue ont soutenu que {green}le récit de la création n'est pas à prendre à la lettre, mais comme une métaphore{/green}. Cette lecture a dominé chez les platoniciens, de l'{sky}Ancienne Académie{/sky} (les successeurs immédiats de Platon) jusqu'à {sky}Plotin{/sky}.

    | | Lecture littérale | Lecture métaphorique |
    | le récit | un artisan a assemblé le monde à un moment du passé | il expose les principes qui valent à tout moment |
    | la difficulté | un « avant » le monde, alors que le temps naît avec le ciel | expliquer pourquoi Platon raconte une genèse |
    | ses tenants | Aristote (pour la critiquer), plusieurs modernes | les platoniciens anciens, jusqu'à Plotin |

    Trois questions en dépendent : {amber}l'Intellect est-il un agent distinct du modèle et de la copie, ou se réduit-il à autre chose (l'âme du monde, une Idée) ?{/amber} {amber}Comment comprendre l'état « d'avant » l'ordre, s'il n'y a pas de temps hors des mouvements célestes ?{/amber} {amber}Une lecture littérale s'accorde-t-elle avec ce que Platon dit ailleurs ?{/amber}

    ! Le caractère « vraisemblable » du discours {red}ne tranche pas la question en faveur de la métaphore{/red} (voir la leçon sur le statut du discours) : {green}il oppose le révisable au démontré{/green}, {red}non l'imagé au littéral{/red}.
  points:
  - id: platon-timee-i19-p1
    sentence: "Aristote rejetait le *Timée* parce qu'il supposait un **commencement** non seulement de l'univers, __mais du ___ lui-même__."
    answer: "temps"
    alt: []
  - id: platon-timee-i19-p2
    sentence: "La **critique aristotélicienne** du *Timée* __se trouve au livre VIII de la__ ___ (251b14-26)."
    answer: "Physique"
    alt: ["*Physique*"]
  - id: platon-timee-i19-p3
    sentence: "Pour **parer la critique d'Aristote**, les défenseurs du *Timée* __ont lu le récit de la création comme une__ ___."
    answer: "métaphore"
    alt: []
  - id: platon-timee-i19-p4
    sentence: "La **lecture métaphorique** a dominé chez les platoniciens, __de l'Ancienne ___ jusqu'à Plotin__."
    answer: "Académie"
    alt: []
