- id: platon-timee-i7
  title: "L'âme du monde et le temps"
  notes: |-
    **L'**{violet}**âme du monde**{/violet} **est** {amber}**un mélange de Même, d'Autre et d'Être**{/amber}**,** {amber}**découpé selon des proportions musicales**{/amber} **et** {amber}**disposé en deux cercles qui se croisent**{/amber} : **de là** {coral}**sa capacité de connaître, et l'ordre des mouvements célestes**{/coral}**.** {sky}Brisson{/sky} : l'âme a été constituée {teal}« {/teal}à partir d'un mélange de {teal}trois ingrédients{/teal}, qui proviennent {teal}du Même, de l'Autre et de l'Être »{/teal} ({sky}37a{/sky}), chacun dans {amber}une version divisible et une version indivisible{/amber}.

    | Cercle | Ce qu'il saisit | Ce qui en résulte |
    | le cercle de l'Autre | le sensible, ce qui devient | « des opinions et des croyances, fermes et vraies » (37b) |
    | le cercle du Même | ce qui se rapporte à la raison | « l'intellection et la science » (37c) |

    **Le** {violet}**temps**{/violet}**.** Le modèle est un vivant éternel, et {red}l'éternité ne peut être donnée telle quelle à ce qui naît{/red}. Le démiurge fabrique donc {teal}« {/teal}une {teal}image mobile de l'éternité »{/teal}, {teal}« {/teal}progressant {teal}suivant le nombre »{/teal} : le temps. {green}Il naît avec le ciel{/green} : {yellow}les jours, les nuits, les mois, les années{/yellow} n'existaient pas avant lui. Les astres sont des dieux, et {coral}ils servent à marquer le temps{/coral} :

    | Astre | Il marque |
    | les étoiles fixes | le jour et la nuit |
    | la lune | le mois |
    | le soleil | l'année |

    Dire de l'être éternel {red}« il était » ou « il sera »{/red} est donc impropre ({sky}37e{/sky}) : {green}seul « il est » lui convient{/green}.

    ! Le temps {red}n'est pas le cadre où le monde serait né{/red} : {green}il naît *avec* le ciel{/green}. C'est ce qui rend difficile de dire ce qu'il y avait « avant » le monde (voir la leçon sur la lecture littérale ou métaphorique).
