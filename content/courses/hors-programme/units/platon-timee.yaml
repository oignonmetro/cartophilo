  title: "La bonté du démiurge et l'ordre du monde"
  notes: |-
    {amber}**Pourquoi le monde existe-t-il ?**{/amber} **Parce que** {coral}**son artisan était bon, et que ce qui est bon ne jalouse rien**{/coral} : **il a voulu que tout lui ressemble autant que possible.** {sky}Brisson{/sky} traduit : {teal}« {/teal}Il était {teal}bon{/teal}, or, en ce qui est bon, on ne trouve {teal}aucune jalousie{/teal} à l'égard de {teal}qui que ce soit »{/teal}. Contre {pink}la tradition grecque d'un divin jaloux{/pink}, {green}le dieu de Platon est généreux{/green}.

    Le démiurge {red}ne crée pas à partir de rien{/red} : il prend {teal}« {/teal}tout ce qu'il y avait {teal}de visible »{/teal}, qui {teal}« {/teal}se mouvait {teal}sans concert et sans ordre »{/teal}, et {teal}« {/teal}il l'amena {teal}du désordre à l'ordre »{/teal} ({sky}30a{/sky}). Puis {coral}chaque grand trait du monde se déduit du meilleur{/coral} :

    | Trait du monde | Raison donnée | Repère |
    | vivant, doué d'âme | un tout pourvu d'intellect est plus beau ; or l'intellect ne va pas sans âme | 30b |
    | unique | son modèle est unique et complet | 31a-b |
