  notes: |-
    **Avant l'intervention du démiurge, le réceptacle est** {red}**agité de mouvements désordonnés**{/red} **; les éléments n'y sont que des** {violet}**« traces »**{/violet}**, que la secousse trie déjà** {yellow}**comme un crible trie le grain**{/yellow}**.** {sky}Brisson{/sky} décrit la nourrice du devenir {teal}« {/teal}mouillée{teal} »{/teal}, {teal}« {/teal}embrasée{teal} »{/teal}, recevant les formes de la terre et de l'air, {teal}« {/teal}soumise de partout à {teal}un balancement irrégulier »{/teal} ({sky}52e{/sky}) : {coral}secouée par les éléments, elle les secoue à son tour{/coral}.

    Ce mouvement {coral}sépare le lourd du léger{/coral}, {teal}« {/teal}de la même façon que, {teal}secouées et vannées sous l'action de cribles »{/teal} et d'autres instruments qui nettoient le blé, {yellow}les parties denses vont d'un côté et les légères d'un autre{/yellow}. Les éléments occupent ainsi {green}déjà des régions distinctes, avant même que le monde soit ordonné{/green} : cette stratification annonce celle du monde achevé, {red}qui ne sera jamais complète{/red} ({sky}58a-c{/sky}).

