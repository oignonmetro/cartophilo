- id: platon-timee-i11
  title: "Les images du réceptacle : l'or, l'empreinte, la mère"
  notes: |-
    **Le réceptacle est difficile à concevoir ; Timée l'approche par une série d'images, qui disent toutes la même chose : il reçoit tout parce qu'il n'a en propre aucun caractère.**

    | Image | Repère | Ce qu'elle fait voir |
    | l'or qu'on remodèle sans cesse | 50a-b | à la question « qu'est-ce ? », le plus sûr est de répondre « c'est de l'or », non « c'est un triangle » |
    | le porte-empreinte | 50c | une matière qu'on modèle, qui prend la figure de ce qui y entre |
    | la mère | 50d | le réceptacle est la mère, le modèle le père, le sensible l'enfant |
    | l'excipient des parfums | 50e | on rend d'abord inodores les liquides qui recevront les parfums |
    | la cire aplanie | 50e | on efface toute figure avant de modeler |

    Brisson : le réceptacle se présente « comme le porte-empreinte de toutes choses » ; et « il convient de comparer le réceptacle à une mère, le modèle à un père, et la nature qui tient le milieu entre les deux à un enfant ». D'où le schéma complet, résumé en 50c-d : il y a « ce qui devient, ce en quoi cela devient, et ce à la ressemblance de quoi naît ce qui devient ».

    | Terme | Rôle | Image |
    | les Idées, le modèle | ce à la ressemblance de quoi | le père |
    | le réceptacle | ce en quoi | la mère |
    | le sensible, les copies | ce qui devient | l'enfant |

    Zeyl et Sattler insistent : ce ne sont pas trois ingrédients qu'on pourrait séparer, mais les trois termes d'une **analyse** de ce qu'est une chose sensible. Le réceptacle « participe de l'intelligible d'une façon particulièrement déconcertante ».

    ! La mère ne transmet rien de son propre caractère à l'enfant : l'image dit la réception, pas l'hérédité. Si le réceptacle ressemblait à l'une des choses qui y entrent, il les reproduirait mal (50e).
