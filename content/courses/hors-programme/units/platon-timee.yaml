- id: platon-timee-i9
  title: "Intellect et nécessité : deux sortes de causes"
  notes: |-
    **Timée distingue la cause véritable, qui agit avec intelligence en vue du meilleur, et les causes accessoires (`sunaitiai`), les processus physiques sans lesquels la fin ne serait pas atteinte.** Brisson traduit `sunaitiai` par « causes accessoires » (46c) ou « causes concomitantes » (46e).

    | | La cause véritable | Les causes accessoires |
    | ce qu'elle est | l'intellect, qui réside dans une âme | les corps : feu, eau, terre, air |
    | comment elle agit | en vue du beau et du bien | elle transmet un mouvement reçu, par nécessité |
    | son effet laissée seule | l'ordre | des effets produits « au hasard et sans ordre » (46e) |

    L'erreur du grand nombre est de prendre les secondes pour les premières : « le grand nombre croit qu'il s'agit là non de causes accessoires, mais des causes de toutes choses », parce qu'elles réchauffent et refroidissent. Mais elles ne peuvent faire preuve « d'aucune intention intelligente » (46d).

    **La deuxième partie du discours** s'ouvre sur ce principe (47e-48a) : « la venue à l'être de notre monde résulta d'un mélange qui réunissait la nécessité et l'intellect ». L'intellect domine la nécessité « en la persuadant » de réaliser au mieux la plupart des choses. Pour dire comment le monde est né, il faut donc faire intervenir aussi « l'espèce de la cause errante » : la nécessité, en tant qu'elle ne vise rien.

    Les propriétés des structures physiques sont fixées par leur constitution, et le démiurge ne peut pas les changer : il ne commande pas à la nécessité, il la **persuade**, c'est-à-dire qu'il tire parti de ces propriétés. Là où la persuasion échoue, l'excellence du monde trouve sa limite.

    ! La nécessité du *Timée* n'est pas la nécessité logique ni un ordre rigoureux : c'est la causalité aveugle des corps, que Brisson rapproche du « matériau » livré à lui-même, et c'est pourquoi elle peut être dite « errante ».
  points:
  - id: platon-timee-i9-p1
    sentence: "Le *Timée* appelle les processus physiques au service de la fin des causes ___ (`sunaitiai`)."
    answer: "accessoires"
    alt: ["concomitantes", "auxiliaires"]
