- id: platon-timee-i8
  title: "Les âmes, le corps et la vue"
  notes: |-
    **Les âmes humaines sont faites** {amber}**du reste du mélange qui a servi à l'âme du monde, dans une qualité inférieure**{/amber} **; leur incarnation** {red}**jette la confusion dans leurs mouvements**{/red}**, que** {green}**l'éducation doit rétablir**{/green}**.** Une fois dans le corps, l'âme subit {yellow}les secousses de la nutrition et le choc des corps extérieurs{/yellow}, surtout dans la sensation : {red}ses cercles, réguliers à l'origine, sont dérangés, et elle connaît mal{/red} ({sky}43a-44b{/sky}). {green}Seules une nourriture et une éducation appropriées lui rendent ses mouvements d'origine.{/green}

    Le corps est conçu pour servir ce rétablissement, et l'exemple que Timée développe est celui des {yellow}yeux{/yellow}. Il distingue deux explications de la vue :

    | Explication | Ce qu'elle dit | Statut |
    | par le mécanisme | le feu doux de l'œil rencontre la lumière du jour, la vision se forme, les miroirs inversent les images | « causes accessoires » (46c) |
    | par la fin | la vue sert à la philosophie | la vraie raison du don des yeux (47a-c) |

    {sky}Brisson{/sky} traduit : la vue du jour, de la nuit, des mois et des années {teal}« {/teal}a amené {teal}l'invention du nombre »{/teal} ; de là {teal}« {/teal}la {teal}pratique de la philosophie{/teal}, {teal}le bienfait le plus important{/teal} qui ait jamais été offert et qui sera jamais accordé à {teal}la race mortelle »{/teal}. Le dieu nous a donné la vue {teal}« {/teal}afin que, ayant observé dans le ciel {teal}les révolutions de l'intellect{/teal}, {teal}nous les utilisions »{/teal} pour {coral}régler les nôtres, qui sont troublées{/coral} : en imitant les mouvements du dieu, {teal}« {/teal}qui {teal}n'errent absolument pas »{/teal}, nous pourrons stabiliser {teal}« {/teal}les mouvements qui en nous {teal}ne cessent de vagabonder »{/teal}.

