- id: platon-timee-i5
  title: "Le modèle : le Vivant intelligible"
  notes: |-
    **Le modèle du démiurge est le Vivant intelligible : une Idée, ou une constellation d'Idées, qui contient en elle tous les vivants intelligibles comme ses parties.** C'est l'univers idéal (ou mieux : l'univers réel), l'objet de ce que *La République* appelait la « vraie » astronomie, opposée à l'astronomie d'observation (527d-531d).

    Le monde lui ressemble au plus près parce que ce modèle est **complet** : rien de ce qui ressemble à un être incomplet ne saurait être beau (30c). Et il est **unique**, parce que son modèle l'est : s'il y avait deux Vivants enveloppant chacun tous les vivants, il en faudrait un troisième qui les enveloppe tous deux, et c'est à lui que le monde ressemblerait (31a-b). Brisson traduit : le dieu « a façonné un vivant unique, visible, ayant à l'intérieur de lui tous les vivants qui lui sont apparentés par nature ».

    **Comment copier un modèle invisible ?** Le démiurge ne peut pas reproduire le Vivant à l'identique : sa copie doit être visible, tangible, donc à trois dimensions (`stereoeidês`, 32b), ce que le modèle n'est pas. Il ne travaille pas comme un maquettiste qui agrandit une maquette, mais comme un constructeur qui suit un plan ou un cahier des charges. Zeyl et Sattler distinguent :

    | | Paradigmatisme grossier | Paradigmatisme raffiné |
    | le modèle | possède en plus pur les propriétés sensibles de la copie | prescrit les traits de l'objet à construire, sans les posséder |
    | image | une maquette | un plan, des instructions |
    | sort | réfuté par l'argument du « troisième homme » (*Parménide*, 132a) | compatible avec des Idées invisibles et inétendues |

    ! Le Vivant intelligible n'est pas un animal géant fait d'une matière plus pure : invisible et sans étendue, il ne possède aucune des propriétés qui supposent la vue, le toucher ou l'espace.
  points:
  - id: platon-timee-i5-p1
    sentence: "Le modèle que contemple le démiurge est le ___ intelligible, qui contient en lui tous les vivants intelligibles."
    answer: "Vivant"
