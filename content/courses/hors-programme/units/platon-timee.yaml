- id: platon-timee-i16
  title: "L'éthique : redresser les révolutions de l'âme"
  notes: |-
    **Le discours sur le monde culmine dans une** {violet}**éthique**{/violet} **: l'homme doit** {green}**régler les mouvements de son âme, dérangés à la naissance, sur les révolutions de l'univers**{/green}**, et atteindre ainsi la vie la meilleure.** C'est le sommet du discours ({sky}90a-d{/sky}), et le but annoncé dès l'ouverture : {coral}la nature de l'homme, sur le fond de la nature de l'univers, doit fonder le récit de Critias sur la vertu en acte{/coral}.

    Le dieu a donné à chacun, {teal}« {/teal}comme {teal}démon »{/teal}, {amber}l'espèce d'âme qui domine en nous{/amber}, et qui habite le haut du corps : elle nous élève vers ce qui, dans le ciel, lui est apparenté, {teal}« {/teal}car nous sommes {teal}une plante non point terrestre, mais céleste »{/teal}.

    | Celui qui | Il a | Repère |
    | s'abandonne aux appétits et aux ambitions | des pensées devenues mortelles | 90b |
    | cherche la connaissance et les pensées vraies | des pensées immortelles et divines, et il est « supérieurement heureux » | 90b-c |

    Il n'y a qu'une façon de tout soigner : {amber}donner à chaque partie les aliments et les mouvements qui lui conviennent{/amber} ({sky}90c{/sky}). Pour la partie divine, {coral}ce sont les pensées et les révolutions de l'univers{/coral}. Chacun doit, {teal}« {/teal}en {teal}redressant les révolutions{/teal} qui dans notre tête {teal}ont été dérangées lors de notre naissance »{/teal} ({blue}*exorthounta*{/blue}), {green}rendre celui qui contemple semblable à ce qu'il contemple{/green}, et atteindre {teal}« {/teal}le {teal}but de la vie la meilleure{/teal} proposée aux hommes par les dieux pour le présent et {teal}pour l'avenir »{/teal}.

    Le bien de l'âme est d'être {violet}bien ordonnée{/violet} ({blue}*eu kekosmêmenon*{/blue}, {sky}90c{/sky}) : {coral}son ordre est celui du monde{/coral} ({blue}*kosmos*{/blue}). C'est {amber}la vieille conviction socratique que la connaissance du bien sauve{/amber}, {green}étendue au-delà de la morale, jusqu'à l'astronomie{/green}.

    ! Ce n'est pas {red}l'observation des astres pour elle-même{/red} qui rend heureux : c'est {green}l'étude de leurs révolutions en tant qu'elle remet en ordre celles de notre âme{/green}.
