- id: platon-timee-i3
  title: "Être et devenir : le point de départ"
  notes: |-
    Le prélude part de la distinction de {sky}*La République*{/sky} : **d'un côté** {green}**ce qui est toujours sans jamais devenir**{/green}**, de l'autre** {pink}**ce qui devient toujours sans être jamais**{/pink}**, et à chacun son mode de connaissance.** {sky}Brisson{/sky} traduit la question initiale : {teal}« {/teal}qu'est-ce qui {teal}est toujours, sans jamais devenir{/teal}, et qu'est-ce qui {teal}devient toujours, sans être jamais ? »{/teal}

    | | Ce qui est toujours | Ce qui devient toujours |
    | se saisit par | l'intellect (`noêsis`) | l'opinion (`doxa`) |
    | avec | une explication rationnelle (`logos`) | une perception sensible (`aisthêsis`) « rebelle à toute explication rationnelle » |
    | statut | « ce qui toujours reste identique » | « ce qui naît et se corrompt, ce qui n'est réellement jamais » |

    Timée {red}ne nomme pas encore les Idées{/red} (les « formes intelligibles » de {sky}Brisson{/sky}) : il faut attendre {sky}51b-e{/sky} pour qu'elles soient mentionnées, et {coral}leur existence y est alors démontrée{/coral}. Mais le lecteur de {sky}*La République*{/sky} reconnaît {green}la distinction des Idées et des choses sensibles{/green} ({sky}*République* 518c, 534a{/sky}).

    **Deux lectures de la question.** « Qu'est-ce qui est toujours ? » peut se lire {amber}en extension{/amber} : quelles choses sont ainsi ? Réponse : {amber}les Idées{/amber}. Ou {amber}en compréhension{/amber} : qu'est-ce qu'être toujours ? Réponse : {amber}c'est être intelligible et immuable{/amber}. {sky}Zeyl et Sattler{/sky} préfèrent {green}la seconde{/green}, {coral}parce que le texte y répond aussitôt{/coral}.

    ! « Devenir » {red}n'est pas une étape vers l'être{/red} : ce qui devient « devient toujours » et n'est « jamais » ; {green}la frontière entre les deux est infranchissable{/green}.
  points:
  - id: platon-timee-i3-p1
    sentence: "« Qu'est-ce qui **est toujours, sans jamais devenir**, __et qu'est-ce qui devient toujours, sans__ ___ » (*Timée*, 27d-28a)."
    answer: "être jamais"
    alt: []
  - id: platon-timee-i3-p2
    sentence: "Dans le prélude du *Timée*, **ce qui est toujours** se saisit par l'intellect, __avec une ___ rationnelle__ (`logos`)."
    answer: "explication"
    alt: []
  - id: platon-timee-i3-p3
    sentence: "Dans le prélude du *Timée*, __ce qui devient se saisit par__ l'___ (`doxa`), au terme d'une **perception sensible**."
    answer: "opinion"
    alt: []
  - id: platon-timee-i3-p4
    sentence: "Selon Timée, la **perception sensible** qui accompagne l'opinion __est « rebelle à toute explication__ ___ » (28a)."
    answer: "rationnelle"
    alt: []
  - id: platon-timee-i3-p5
    sentence: "La distinction entre ce qui est et ce qui devient, posée en 27d-28a, __est celle de la__ ___ entre **Idées et choses sensibles**."
    answer: "République"
    alt: ["*République*"]
  - id: platon-timee-i3-p6
    sentence: "Les **Idées** ne sont mentionnées dans le *Timée* __qu'en ___, où leur existence est démontrée__."
    answer: "51b-e"
    alt: ["51b", "51b-52a"]
  - id: platon-timee-i3-p7
    sentence: "Lue **en extension**, la question « qu'est-ce qui est toujours ? » demande quelles choses sont ainsi ; __lue en ___, elle demande ce qu'être toujours veut dire__."
    answer: "compréhension"
    alt: ["intension"]
  - id: platon-timee-i3-p8
    sentence: "Lue **en compréhension**, la question initiale reçoit sa réponse : __être toujours, c'est être intelligible et__ ___."
    answer: "immuable"
    alt: ["inchangé"]
  - id: platon-timee-i3-p9
    sentence: "Pour Timée, ce qui devient « **devient toujours** » __et n'est__ ___ : il n'y a pas de passage du devenir à l'être."
    answer: "jamais"
    alt: []
- id: platon-timee-i4
  title: "Du monde sensible à son artisan : l'argument"
  notes: |-
    **De la distinction être/devenir, Timée tire en quelques lignes la thèse qui encadre tout le dialogue :** {green}**le monde est l'œuvre d'un artisan parfaitement bon, qui l'a fabriqué sur un modèle éternel**{/green}**.** L'argument se reconstruit ainsi :

    | Étape | Ce qui est posé | Repère |
    | 1 | tout ce qui naît naît par une cause | 28a |
    | 2 | le monde est né : on le voit, on le touche, il a un corps, il est sensible | 28b-c |
    | 3 | il a donc une cause, un fabricant qui a travaillé sur un modèle | 28c |
    | 4 | ce modèle est éternel ou engendré | 28c-29a |
    | 5 | le monde est le plus beau, son fabricant le meilleur : le modèle est éternel | 29a |

    {sky}Brisson{/sky} traduit : {teal}« {/teal}sans l'intervention {teal}d'une cause{/teal}, {teal}rien ne peut être engendré »{/teal} ; le monde est engendré, {teal}« {/teal}car on peut {teal}le voir et le toucher{/teal} et par suite {teal}il a un corps »{/teal}. Mais {teal}« {/teal}trouver {teal}le fabricant et le père de l'univers{/teal} exige {teal}un effort »{/teal}. Enfin, le démiurge a fixé les yeux sur l'éternel, car {teal}« {/teal}ce monde en effet est {teal}la plus belle des choses qui ont été engendrées{/teal}, et son fabricant, {teal}la meilleure des causes »{/teal}.

    {red}**Le point faible**{/red}, selon {sky}Zeyl et Sattler{/sky} : {red}qu'il y ait une cause ne prouve pas encore que ce soit un artisan{/red}. Ce qui comble l'écart est {green}la beauté du monde{/green} (étape 5) : Timée cherche à expliquer non pas un monde quelconque, mais {amber}un monde suprêmement beau{/amber}, et {coral}la possibilité qu'une cause non intelligente produise une telle beauté n'est même pas envisagée{/coral}.

    **La méthode qui en découle.** La question n'est pas {pink}« qu'est-ce qui explique au mieux ce que j'observe ? »{/pink}, mais {green}« si le monde est le meilleur possible, quels traits doit-il avoir ? »{/green}. D'où des réponses {blue}*a priori*{/blue} ({yellow}pourquoi il existe, pourquoi il est vivant, unique, sphérique{/yellow}), {amber}recoupées par l'observation{/amber} ({yellow}le mouvement des astres, le corps humain{/yellow}). Elles concordent le plus souvent ; {red}pas toujours{/red} ({yellow}la terre exclue des transformations{/yellow}, voir la leçon sur la physique).

    ! L'argument {red}ne dit pas que le monde a été copié sur un modèle *parce qu'*il est sensible{/red} : {green}c'est sa beauté, jointe à la bonté de l'artisan, qui impose un modèle éternel{/green}.
  points:
  - id: platon-timee-i4-p1
    sentence: "« __Sans l'intervention d'une__ ___, **rien ne peut être engendré** » (*Timée*, 28a)."
    answer: "cause"
    alt: []
  - id: platon-timee-i4-p2
    sentence: "Le monde est engendré, « __car on peut le voir et le__ ___ et par suite **il a un corps** » (*Timée*, 28b)."
    answer: "toucher"
    alt: []
  - id: platon-timee-i4-p3
    sentence: "« __Trouver le fabricant et le__ ___ de l'univers **exige un effort** » (*Timée*, 28c)."
    answer: "père"
    alt: []
  - id: platon-timee-i4-p4
    sentence: "Le modèle du monde est éternel, car « ce monde en effet est **la plus belle des choses** qui ont été engendrées, __et son fabricant, la meilleure des__ ___ » (29a)."
    answer: "causes"
    alt: []
  - id: platon-timee-i4-p5
    sentence: "Dans l'argument du prélude, __c'est la ___ du monde__, jointe à la **bonté du démiurge**, qui impose un **modèle éternel**."
    answer: "beauté"
    alt: []
  - id: platon-timee-i4-p6
    sentence: "Selon Zeyl et Sattler, qu'il y ait une cause du monde __ne prouve pas encore que cette cause soit un__ ___ : c'est la **beauté du monde** qui comble l'écart."
    answer: "artisan"
    alt: ["fabricant", "démiurge"]
  - id: platon-timee-i4-p7
    sentence: "Le mot grec `dêmiourgos` (28a) __désigne d'abord__ l'___, l'**homme de métier** qui travaille pour le public."
    answer: "artisan"
    alt: []
  - id: platon-timee-i4-p8
    sentence: "La méthode du *Timée* demande : si le monde est **le meilleur possible**, quels traits doit-il avoir ? __D'où des réponses__ ___."
    answer: "a priori"
    alt: ["*a priori*"]
  - id: platon-timee-i4-p9
    sentence: "__La possibilité qu'une cause dépourvue__ d'___ produise un monde aussi beau **n'est même pas envisagée** par Timée."
    answer: "intelligence"
    alt: ["intellect"]
- id: platon-timee-i5
  title: "Le modèle : le Vivant intelligible"
  notes: |-
    **Le modèle du démiurge est le** {violet}**Vivant intelligible**{/violet} : {amber}**une Idée, ou une constellation d'Idées, qui contient en elle tous les vivants intelligibles comme ses parties**{/amber}**.** C'est {amber}l'univers idéal (ou mieux : l'univers réel){/amber}, l'objet de ce que {sky}*La République*{/sky} appelait la {green}« vraie » astronomie{/green}, opposée à {pink}l'astronomie d'observation{/pink} ({sky}527d-531d{/sky}).

    Le monde lui ressemble au plus près parce que ce modèle est {green}**complet**{/green} : {coral}rien de ce qui ressemble à un être incomplet ne saurait être beau{/coral} ({sky}30c{/sky}). Et il est {green}**unique**{/green}, parce que son modèle l'est : {coral}s'il y avait deux Vivants enveloppant chacun tous les vivants, il en faudrait un troisième qui les enveloppe tous deux, et c'est à lui que le monde ressemblerait{/coral} ({sky}31a-b{/sky}). {sky}Brisson{/sky} traduit : le dieu {teal}« {/teal}a façonné {teal}un vivant unique, visible{/teal}, ayant à l'intérieur de lui {teal}tous les vivants qui lui sont apparentés par nature »{/teal}.

    {amber}**Comment copier un modèle invisible ?**{/amber} Le démiurge {red}ne peut pas reproduire le Vivant à l'identique{/red} : sa copie doit être {amber}visible, tangible, donc à trois dimensions{/amber} ({blue}*stereoeidês*{/blue}, {sky}32b{/sky}), ce que le modèle n'est pas. Il ne travaille pas comme {pink}un maquettiste qui agrandit une maquette{/pink}, mais comme {green}un constructeur qui suit un plan ou un cahier des charges{/green}. {sky}Zeyl et Sattler{/sky} distinguent :

    | | Paradigmatisme grossier | Paradigmatisme raffiné |
    | le modèle | possède en plus pur les propriétés sensibles de la copie | prescrit les traits de l'objet à construire, sans les posséder |
    | image | une maquette | un plan, des instructions |
    | sort | réfuté par l'argument du « troisième homme » (*Parménide*, 132a) | compatible avec des Idées invisibles et inétendues |

