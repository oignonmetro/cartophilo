- id: platon-timee-i10
  title: "Le troisième genre : le réceptacle"
  notes: |-
    **Pour expliquer le devenir, deux genres ne suffisent plus : il faut, à côté du modèle intelligible et de sa copie visible, un « troisième genre », le réceptacle de tout ce qui naît.** Brisson traduit : « il nous faut maintenant en découvrir un autre, un troisième » ; il est, « de tout ce qui est soumis à la génération elle est le réceptacle, et, pour employer une image, la nourrice ».

    **Le problème qu'il résout (49b-50a).** On voit l'eau se condenser en pierre et en terre, s'évaporer en air, l'air s'enflammer en feu, et inversement : « ils se donnent naissance les uns aux autres, en cercle ». Ce qui apparaît maintenant comme du feu ne l'est donc pas en propre : il ne le reste pas. On ne peut pas dire « ceci est du feu », mais seulement « ce qui chaque fois est tel ou tel, c'est du feu ».

    | Ce dont on parle | Comment en parler | Pourquoi |
    | le feu, l'eau, la terre, l'air | « ce qui est tel » | ils changent sans cesse les uns dans les autres |
    | ce en quoi ils apparaissent et disparaissent | « ceci », « cela » | lui seul demeure |

    La solution : ce qui demeure sous ces apparences, c'est le réceptacle lui-même, sans caractère propre, que ses parties prennent tour à tour. Le feu observé n'est que « la portion du réceptacle qui est enflammée ».

    ! Le réceptacle n'est ni l'un des quatre éléments ni leur mélange : il est ce en quoi ils apparaissent, et n'a lui-même aucune de leurs propriétés.
