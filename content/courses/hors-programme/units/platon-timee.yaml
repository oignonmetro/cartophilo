lessons:
- id: platon-timee-i1
  title: "Le dialogue : cadre, personnages, plan"
  notes: |-
    Le {sky}*Timée*{/sky} raconte **la fabrication du monde : l'univers est l'œuvre d'un** {violet}**dieu artisan, le démiurge**{/violet}**, qui, les yeux fixés sur un** {amber}**modèle éternel**{/amber}**, impose** {green}**un ordre mathématique à un chaos préexistant**{/green}**.** Le principe d'explication est la {violet}finalité{/violet} : {coral}l'univers et chacune de ses parties sont disposés en vue du meilleur{/coral}. Cet arrangement {red}n'est pas un hasard{/red}, {green}il est voulu par l'Intellect{/green} ({blue}*nous*{/blue}), que la figure du démiurge représente {yellow}sous les traits d'un homme de métier{/yellow}.

    **Le cadre.** Pendant les Panathénées, {sky}Socrate{/sky} retrouve {sky}Timée{/sky} (de Locres, en Italie), {sky}Critias{/sky} et {sky}Hermocrate{/sky}. La veille, il leur a exposé une cité idéale très proche de celle de {sky}*La République*{/sky} (résumée en {sky}17c-19b{/sky}). Ses hôtes lui rendent la politesse en deux temps : {amber}Timée racontera la naissance de l'univers jusqu'à celle de l'homme{/amber} ; {amber}Critias montrera ensuite la cité idéale en action{/amber}, {yellow}l'Athènes d'autrefois en guerre contre l'Atlantide{/yellow} (récit commencé dans le {sky}*Critias*{/sky}, resté inachevé).

    | Moment | Repère | Contenu |
    | conversation d'ouverture | 17a-27d | personnages, programme, récit de l'Atlantide |
    | prélude de Timée | 27d-29d | principes, démiurge et modèle, statut du discours |
    | les œuvres de l'Intellect | 29d-47e | le monde vivant, son âme, le temps, l'homme, la vue |
    | les effets de la nécessité | 47e-69a | le réceptacle, les éléments, les sensations |
    | l'Intellect et la nécessité ensemble | 69a-92c | le corps et l'âme de l'homme, les maladies, les animaux |

    Après le prélude, le discours de Timée n'est plus interrompu jusqu'à la fin : c'est un {amber}monologue{/amber}, qui ressemble plus à {green}un exposé faisant autorité{/green} qu'à {pink}une enquête par questions{/pink}.

    **Sa fortune.** Traduit en latin par {sky}Calcidius{/sky} au IVe siècle, le *Timée* fut {coral}le seul texte de Platon accessible dans l'Occident latin jusqu'au XIIe siècle{/coral} ; {sky}Kepler{/sky} s'y réfère encore. Longtemps {pink}jugé philosophiquement mineur au XXe siècle{/pink}, il connaît depuis quelques décennies {green}un fort regain d'intérêt{/green}.

    ! Le *Timée* {red}n'est pas un dialogue de recherche où Socrate interroge{/red} : {green}Socrate y écoute, et Timée parle presque seul{/green}.
