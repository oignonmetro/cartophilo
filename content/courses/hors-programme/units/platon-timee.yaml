- id: platon-timee-i19
  title: "Une création au sens propre ? Lecture littérale et métaphorique"
  notes: |-
    **Faut-il prendre à la lettre le récit d'un monde fabriqué à un moment donné, ou y lire l'exposé des principes qui font tenir le monde de tout temps ? La question divise les interprètes depuis Aristote.**

    Aristote rejetait la cosmologie du *Timée* : elle supposait un commencement non seulement de l'univers dans le temps, mais du temps lui-même (*Physique* VIII, 251b14-26). Pour neutraliser cette critique, les défenseurs du dialogue ont soutenu que le récit de la création n'est pas à prendre à la lettre, mais comme une métaphore. Cette lecture a dominé chez les platoniciens, de l'Ancienne Académie (les successeurs immédiats de Platon) jusqu'à Plotin.

    | | Lecture littérale | Lecture métaphorique |
    | le récit | un artisan a assemblé le monde à un moment du passé | il expose les principes qui valent à tout moment |
    | la difficulté | un « avant » le monde, alors que le temps naît avec le ciel | expliquer pourquoi Platon raconte une genèse |
    | ses tenants | Aristote (pour la critiquer), plusieurs modernes | les platoniciens anciens, jusqu'à Plotin |

    Trois questions en dépendent : l'Intellect est-il un agent distinct du modèle et de la copie, ou se réduit-il à autre chose (l'âme du monde, une Idée) ? Comment comprendre l'état « d'avant » l'ordre, s'il n'y a pas de temps hors des mouvements célestes ? Une lecture littérale s'accorde-t-elle avec ce que Platon dit ailleurs ?

    ! Le caractère « vraisemblable » du discours ne tranche pas la question en faveur de la métaphore (voir la leçon sur le statut du discours) : il oppose le révisable au démontré, non l'imagé au littéral.
  points:
  - id: platon-timee-i19-p1
    sentence: "Aristote rejetait le *Timée* parce qu'il supposait un commencement non seulement de l'univers, mais du ___ lui-même."
