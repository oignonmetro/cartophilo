- id: platon-timee-i7
  title: "L'âme du monde et le temps"
  notes: |-
    **L'âme du monde est un mélange de Même, d'Autre et d'Être, découpé selon des proportions musicales et disposé en deux cercles qui se croisent : de là sa capacité de connaître, et l'ordre des mouvements célestes.** Brisson : l'âme a été constituée « à partir d'un mélange de trois ingrédients, qui proviennent du Même, de l'Autre et de l'Être » (37a), chacun dans une version divisible et une version indivisible.

    | Cercle | Ce qu'il saisit | Ce qui en résulte |
    | le cercle de l'Autre | le sensible, ce qui devient | « des opinions et des croyances, fermes et vraies » (37b) |
    | le cercle du Même | ce qui se rapporte à la raison | « l'intellection et la science » (37c) |

    **Le temps.** Le modèle est un vivant éternel, et l'éternité ne peut être donnée telle quelle à ce qui naît. Le démiurge fabrique donc « une image mobile de l'éternité », « progressant suivant le nombre » : le temps. Il naît avec le ciel : les jours, les nuits, les mois, les années n'existaient pas avant lui. Les astres sont des dieux, et ils servent à marquer le temps :

    | Astre | Il marque |
    | les étoiles fixes | le jour et la nuit |
    | la lune | le mois |
    | le soleil | l'année |

    Dire de l'être éternel « il était » ou « il sera » est donc impropre (37e) : seul « il est » lui convient.

    ! Le temps n'est pas le cadre où le monde serait né : il naît *avec* le ciel. C'est ce qui rend difficile de dire ce qu'il y avait « avant » le monde (voir la leçon sur la lecture littérale ou métaphorique).
