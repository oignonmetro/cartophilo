- id: platon-timee-i6
  title: "La bonté du démiurge et l'ordre du monde"
  notes: |-
    **Pourquoi le monde existe-t-il ? Parce que son artisan était bon, et que ce qui est bon ne jalouse rien : il a voulu que tout lui ressemble autant que possible.** Brisson traduit : « Il était bon, or, en ce qui est bon, on ne trouve aucune jalousie à l'égard de qui que ce soit ». Contre la tradition grecque d'un divin jaloux, le dieu de Platon est généreux.

    Le démiurge ne crée pas à partir de rien : il prend « tout ce qu'il y avait de visible », qui « se mouvait sans concert et sans ordre », et « il l'amena du désordre à l'ordre » (30a). Puis chaque grand trait du monde se déduit du meilleur :

    | Trait du monde | Raison donnée | Repère |
    | vivant, doué d'âme | un tout pourvu d'intellect est plus beau ; or l'intellect ne va pas sans âme | 30b |
    | unique | son modèle est unique et complet | 31a-b |
    | feu et terre | visible (feu), tangible (terre) | 31b |
    | air et eau | moyens proportionnels qui lient feu et terre en un tout | 32a-c |
    | sphérique | la figure la plus parfaite, qui contient toutes les autres | 33b |

    D'où la formule de 30b : le dieu « mit l'intellect dans l'âme et l'âme dans le corps », si bien que le monde est « un vivant doué d'une âme pourvue d'un intellect ».

    ! Le démiurge n'est pas un créateur au sens biblique : il ne tire pas le monde du néant, il ordonne un désordre qui lui préexiste ; et il fait le monde le meilleur *possible*, non parfait.
  points:
  - id: platon-timee-i6-p1
    sentence: "« Il était bon, or, en ce qui est bon, on ne trouve aucune ___ à l'égard de qui que ce soit » (*Timée*, 29e)."
    answer: "jalousie"
    alt: []
  - id: platon-timee-i6-p2
    sentence: "Parce qu'il est bon, le démiurge souhaite que toutes choses deviennent le plus possible ___ à lui."
    answer: "semblables"
