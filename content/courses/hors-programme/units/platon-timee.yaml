- id: platon-timee-i8
  title: "Les âmes, le corps et la vue"
  notes: |-
    **Les âmes humaines sont faites du reste du mélange qui a servi à l'âme du monde, dans une qualité inférieure ; leur incarnation jette la confusion dans leurs mouvements, que l'éducation doit rétablir.** Une fois dans le corps, l'âme subit les secousses de la nutrition et le choc des corps extérieurs, surtout dans la sensation : ses cercles, réguliers à l'origine, sont dérangés, et elle connaît mal (43a-44b). Seules une nourriture et une éducation appropriées lui rendent ses mouvements d'origine.

    Le corps est conçu pour servir ce rétablissement, et l'exemple que Timée développe est celui des yeux. Il distingue deux explications de la vue :

    | Explication | Ce qu'elle dit | Statut |
    | par le mécanisme | le feu doux de l'œil rencontre la lumière du jour, la vision se forme, les miroirs inversent les images | « causes accessoires » (46c) |
    | par la fin | la vue sert à la philosophie | la vraie raison du don des yeux (47a-c) |

    Brisson traduit : la vue du jour, de la nuit, des mois et des années « a amené l'invention du nombre » ; de là « la pratique de la philosophie, le bienfait le plus important qui ait jamais été offert et qui sera jamais accordé à la race mortelle ». Le dieu nous a donné la vue « afin que, ayant observé dans le ciel les révolutions de l'intellect, nous les utilisions » pour régler les nôtres, qui sont troublées : en imitant les mouvements du dieu, « qui n'errent absolument pas », nous pourrons stabiliser « les mouvements qui en nous ne cessent de vagabonder ».

    ! Expliquer comment l'œil voit n'est pas expliquer pourquoi nous avons des yeux : pour Timée, le mécanisme n'est qu'une cause accessoire, la fin est la cause véritable.
