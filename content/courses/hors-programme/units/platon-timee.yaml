    sentence: "Timée qualifie son discours de « ___ » (`eikôs muthos`) : sur ce qui devient, on ne peut tenir qu'un discours plausible."
    answer: "mythe vraisemblable"
    alt: ["mythe vraisemblable", "vraisemblable"]
  - id: platon-timee-i2-p2
