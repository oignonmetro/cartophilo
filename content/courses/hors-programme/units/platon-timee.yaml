- id: platon-timee-i12
  title: "La khôra : matériau ou espace ?"
  notes: |-
    **Avant de nommer le troisième genre, Timée** {green}**prouve que les Idées existent**{/green} **; puis il le présente comme** {amber}**ce qui fournit une place à tout ce qui naît**{/amber}**, et l'appelle** {blue}*chôra*{/blue}**.**

    **La preuve des Idées (**{sky}**51b-e**{/sky}**).** {amber}Si l'intellect et l'opinion vraie sont deux choses distinctes{/amber}, {green}les Idées existent en soi{/green} ; sinon, {red}le sensible serait ce qu'il y a de plus certain{/red}. Or {coral}elles diffèrent{/coral} :

    | | L'intellect | L'opinion vraie |
    | origine | l'instruction | la persuasion |
    | explication | toujours accompagné d'une explication vraie | sans explication |
    | fragilité | inébranlable | la persuasion peut la changer |
    | qui y a part | les dieux et très peu d'hommes | tout homme |

    **Les trois genres (**{sky}**52a-b**{/sky}**).** {amber}La forme intelligible{/amber}, inengendrée et indestructible, objet de l'intellection ; {amber}sa copie sensible{/amber}, engendrée, objet de l'opinion jointe à la sensation ; et {amber}un troisième{/amber}, qui {teal}« {/teal}fournit {teal}un emplacement à tout ce qui naît »{/teal} ({blue}*hedra*{/blue}, {sky}52b{/sky}), qu'on ne saisit {teal}« {/teal}qu'au terme d'{teal}un raisonnement bâtard{/teal} qui {teal}ne s'appuie pas sur la sensation »{/teal} : {teal}« {/teal}c'est à peine si {teal}on peut y croire »{/teal}. En y pensant, {teal}« {/teal}nous {teal}rêvons les yeux ouverts »{/teal}. Le résumé de {sky}52d{/sky} : {teal}« {/teal}l'{teal}être{/teal}, le {teal}milieu spatial{/teal} et le {teal}devenir »{/teal}.

    {amber}**Matière ou espace ?**{/amber} Les images {yellow}de l'or ou de la cire{/yellow} suggèrent {pink}une matière qu'on façonne{/pink}. Mais Platon {red}n'emploie aucun mot qui se traduise bien par « matière »{/red} ({blue}*hulê*{/blue} est le mot d'{sky}Aristote{/sky}) ; il dit {blue}*chôra*{/blue}, {green}l'espace, la place{/green}, et parle de « siège » ({blue}*hedra*{/blue}). Les interprètes en font {amber}un substrat matériel{/amber}, {amber}un espace{/amber}, ou {amber}les deux à la fois{/amber}. {sky}Brisson{/sky}, lui, rend {blue}*chôra*{/blue} tantôt par « matériau » ({sky}52a{/sky}), tantôt par « milieu spatial » ({sky}52d{/sky}).

    **Une innovation.** Les dialogues de la maturité {red}ne disaient guère ce qu'il faut à une chose sensible pour pouvoir participer des Idées{/red}. Le *Timée* répond : {green}être étendue, être située, et faite d'une étoffe indéterminée mais déterminable{/green}. On rapproche ce troisième genre de l'{violet}illimité{/violet} ({blue}*apeiron*{/blue}) du {sky}*Philèbe*{/sky}.

    ! Le raisonnement « bâtard » {red}n'est ni une perception{/red} (le réceptacle est invisible) {red}ni une intellection{/red} (il n'est pas une Idée) : {green}c'est une inférence{/green}, et c'est pourquoi {coral}on n'y croit « qu'à peine »{/coral}.
