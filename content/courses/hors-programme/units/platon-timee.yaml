- id: platon-timee-i17
  title: "La téléologie : du Phédon au démiurge"
  notes: |-
    Le {sky}*Timée*{/sky} donne enfin ce que Socrate cherchait en vain dans le {sky}*Phédon*{/sky} : {green}**une explication du monde par le meilleur, où l'intellect est vraiment cause**{/green}**.** Dans le {sky}*Phédon* (97b-99d){/sky}, Socrate raconte sa déception devant {sky}Anaxagore{/sky} : celui-ci disait que {amber}l'Intellect ordonne tout{/amber}, mais {red}n'expliquait ensuite les choses que par des causes physiques{/red}. Faute de trouver l'explication par le meilleur, Socrate se rabattait sur une {violet}« seconde navigation »{/violet} : {amber}expliquer par la participation aux Idées{/amber} ({sky}99c{/sky}).

    **Ce qui a permis la découverte**, selon {sky}Zeyl et Sattler{/sky} : sans doute {amber}l'Idée du Bien de *La République*{/amber}, qu'on peut rapprocher de {amber}l'ordre rationnel et mathématique{/amber}. {coral}Les Idées sont bonnes parce qu'elles possèdent cet ordre parfaitement{/coral} ; {coral}le sensible l'est dans la mesure où il y participe{/coral}. Reste à expliquer comment cet ordre passe dans le monde visible : le *Timée* répond qu'{red}il n'y est pas inhérent{/red}, mais {green}**imposé** par l'Intellect{/green}.

    {amber}**Où placer l'Intellect ?**{/amber} Le démiurge est {violet}une figure de l'Intellect{/violet}. Mais l'Intellect lui-même est-il {amber}du côté de l'être{/amber} ou {amber}du devenir{/amber} ?

    | Hypothèse | Pourquoi Zeyl et Sattler la rejettent |
    | l'âme du monde (puisque l'intellect ne va pas sans âme, 30b) | l'âme du monde est une œuvre du démiurge, donc du devenir |
    | une Idée (le monde des Idées, l'Idée du Bien, l'Idée de l'Intelligence) | une Idée est un objet connu, non un sujet qui connaît et qui agit |
    | une personnification du savoir-faire | même objection |

    Leur conclusion : {green}l'Intellect est une réalité d'un genre propre, au-delà de l'opposition de l'être et du devenir{/green}, {coral}qui n'est donc pas exhaustive{/coral} ; peut-être pas sans rapport avec {sky}le Dieu des religions abrahamiques{/sky}.

    ! Dire que le démiurge « représente » l'Intellect {red}ne règle pas la question de son statut{/red} : {coral}c'est justement ce statut que les interprètes discutent{/coral}.
