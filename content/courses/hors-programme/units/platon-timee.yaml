- id: platon-timee-i12
  title: "La khôra : matériau ou espace ?"
  notes: |-
    **Avant de nommer le troisième genre, Timée prouve que les Idées existent ; puis il le présente comme ce qui fournit une place à tout ce qui naît, et l'appelle `chôra`.**

    **La preuve des Idées (51b-e).** Si l'intellect et l'opinion vraie sont deux choses distinctes, les Idées existent en soi ; sinon, le sensible serait ce qu'il y a de plus certain. Or elles diffèrent :

    | | L'intellect | L'opinion vraie |
    | origine | l'instruction | la persuasion |
    | explication | toujours accompagné d'une explication vraie | sans explication |
    | fragilité | inébranlable | la persuasion peut la changer |
    | qui y a part | les dieux et très peu d'hommes | tout homme |

    **Les trois genres (52a-b).** La forme intelligible, inengendrée et indestructible, objet de l'intellection ; sa copie sensible, engendrée, objet de l'opinion jointe à la sensation ; et un troisième, qui « fournit un emplacement à tout ce qui naît » (`hedra`, 52b), qu'on ne saisit « qu'au terme d'un raisonnement bâtard qui ne s'appuie pas sur la sensation » : « c'est à peine si on peut y croire ». En y pensant, « nous rêvons les yeux ouverts ». Le résumé de 52d : « l'être, le milieu spatial et le devenir ».

    **Matière ou espace ?** Les images de l'or ou de la cire suggèrent une matière qu'on façonne. Mais Platon n'emploie aucun mot qui se traduise bien par « matière » (`hulê` est le mot d'Aristote) ; il dit `chôra`, l'espace, la place, et parle de « siège » (`hedra`). Les interprètes en font un substrat matériel, un espace, ou les deux à la fois. Brisson, lui, rend `chôra` tantôt par « matériau » (52a), tantôt par « milieu spatial » (52d).

    **Une innovation.** Les dialogues de la maturité ne disaient guère ce qu'il faut à une chose sensible pour pouvoir participer des Idées. Le *Timée* répond : être étendue, être située, et faite d'une étoffe indéterminée mais déterminable. On rapproche ce troisième genre de l'illimité (`apeiron`) du *Philèbe*.

    ! Le raisonnement « bâtard » n'est ni une perception (le réceptacle est invisible) ni une intellection (il n'est pas une Idée) : c'est une inférence, et c'est pourquoi on n'y croit « qu'à peine ».
  points:
  - id: platon-timee-i12-p1
    sentence: "Si l'intellect et l'opinion vraie sont deux choses distinctes, alors les ___ existent en soi (51d)."
    answer: "Idées"
    alt: ["idées", "formes", "formes intelligibles"]
