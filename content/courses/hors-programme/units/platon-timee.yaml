  notes: |-
    **Le prélude de Timée va de la prière aux principes, puis applique ces principes au monde sensible et à la connaissance qu'on en a.** C'est un raisonnement serré : chaque moment s'appuie sur le précédent.

    | Moment | Repère | Ce qui s'y fait |
    | la prière | 27c-d | invoquer les dieux avant de parler de l'univers |
    | la séparation ontologique | 27d-28a | ce qui est toujours, ce qui devient toujours |
    | le principe de causalité | 28a | tout ce qui naît naît par une cause |
    | l'application au monde sensible | 28a-29a | le monde est né ; son artisan a regardé un modèle éternel |
    | l'application à la connaissance | 29b-d | un discours sur une image n'est que vraisemblable |

    Les repères suivent le plan détaillé que Luc Brisson donne dans l'introduction de sa traduction (lui-même repris de F. M. Cornford). En fin de leçon, le tableau se joue en repérage : remettre les moments dans l'ordre du texte, puis replacer leurs repères.

    ! L'ordre compte : les principes (27d-28a) viennent avant le monde (28a-29a), et c'est seulement à la fin (29b-d) que Timée en tire le statut de son propre discours.
