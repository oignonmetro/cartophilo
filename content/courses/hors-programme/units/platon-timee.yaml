    {sky}Brisson{/sky} : le réceptacle se présente {teal}« {/teal}comme {teal}le porte-empreinte de toutes choses »{/teal} ; et {teal}« {/teal}il convient de comparer {teal}le réceptacle à une mère{/teal}, {teal}le modèle à un père{/teal}, et la nature qui tient le milieu entre les deux {teal}à un enfant »{/teal}. D'où le schéma complet, résumé en {sky}50c-d{/sky} : il y a {teal}« {/teal}ce qui devient, {teal}ce en quoi cela devient{/teal}, et ce à la ressemblance de quoi {teal}naît ce qui devient »{/teal}.

