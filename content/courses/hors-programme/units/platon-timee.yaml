- id: platon-timee-i13
  title: "Avant l'ordre : traces et crible"
  notes: |-
    **Avant l'intervention du démiurge, le réceptacle est agité de mouvements désordonnés ; les éléments n'y sont que des « traces », que la secousse trie déjà comme un crible trie le grain.** Brisson décrit la nourrice du devenir « mouillée », « embrasée », recevant les formes de la terre et de l'air, « soumise de partout à un balancement irrégulier » (52e) : secouée par les éléments, elle les secoue à son tour.

    Ce mouvement sépare le lourd du léger, « de la même façon que, secouées et vannées sous l'action de cribles » et d'autres instruments qui nettoient le blé, les parties denses vont d'un côté et les légères d'un autre. Les éléments occupent ainsi déjà des régions distinctes, avant même que le monde soit ordonné : cette stratification annonce celle du monde achevé, qui ne sera jamais complète (58a-c).

    | | Avant le démiurge | Après le démiurge |
    | les éléments | des « traces » (`ichnê`, 53b) | des corps construits de triangles |
    | leur mouvement | des forces déséquilibrées (`dunameis`, 52e), au hasard | réglé par la proportion |
    | leur état | « sans proportion ni mesure » | figurés « à l'aide des formes et des nombres » |

    Brisson : les éléments se trouvaient alors « dans l'état dans lequel on peut s'attendre à trouver absolument toute chose quand dieu en est absent » ; puis ils commencèrent à recevoir leur configuration « à l'aide des formes et des nombres ».

    ! Les « traces » ne sont pas encore du feu ou de l'eau : elles n'en ont que quelques propriétés, sans la structure que le démiurge leur donnera. Et parler d'un état « avant » l'ordre fait difficulté, puisque le temps naît avec le ciel.
