- id: platon-timee-i15
  title: "L'homme : l'intellect et la nécessité ensemble"
  notes: |-
    **La troisième partie du discours montre l'intellect et la nécessité coopérant à la fabrication de l'homme : l'intellect fixe la fin de chaque organe, la nécessité fournit des matériaux dont les propriétés s'y prêtent, ou parfois y résistent.**

    **Qui fabrique quoi.** Le démiurge a fait les âmes immortelles ; il confie les corps aux dieux inférieurs qu'il a engendrés. Brisson : « il a confié le soin d'engendrer les vivants mortels à ceux qui étaient nés de lui ». L'âme immortelle, logée dans un corps mortel, reçoit alors des parties mortelles, celles que connaissent déjà *La République* et le *Phèdre* :

    | Partie de l'âme | Siège | Organes qui la servent |
    | raisonnable, immortelle | la tête | |
    | ardente (`thumos`) | la poitrine, près de la tête | le cœur, les poumons |
    | désirante | le ventre | le foie |

    **Quand la nécessité résiste.** Le plus souvent, les matériaux servent bien les fins de l'intellect. Pas toujours : l'enveloppe du cerveau devrait être épaisse pour le protéger, mais une enveloppe épaisse émousserait la sensation. Brisson : « ce dont l'être et le développement dépendent de la nécessité ne peut allier un os compact et une chair épaisse avec une grande acuité sensorielle ». Il faut choisir entre les deux exigences, et la tête reçoit une couverture légère. Ces résistances de la nécessité à la « persuasion » de l'intellect bornent l'excellence que le monde peut atteindre.

    Viennent ensuite la respiration, la digestion, les maladies du corps et de l'âme, et une exhortation à exercer l'un et l'autre ; le discours s'achève sur la naissance des femmes et des animaux (90e-92c).

    ! Le mal et l'imperfection ne viennent pas d'une négligence du démiurge, mais de la nécessité : il fait le meilleur *possible* avec des matériaux qui ont leurs propres propriétés.
