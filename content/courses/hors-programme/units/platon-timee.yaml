- id: platon-timee-i14
  title: "La physique des triangles"
  notes: |-
    **Les quatre éléments sont faits de** {amber}**corpuscules en forme de polyèdres réguliers**{/amber}**, dont les faces se composent de** {amber}**deux sortes de triangles rectangles**{/amber} **: ces triangles sont les** {violet}**« simples »**{/violet} **de toute la physique.** {amber}Tout corps a de la profondeur{/amber}, {amber}la profondeur est bornée par des surfaces{/amber}, {coral}toute surface plane se décompose en triangles{/coral} ({sky}53c{/sky}). {sky}Brisson{/sky} : {teal}« {/teal}une explication qui combine {teal}vraisemblance et nécessité »{/teal} ; les principes encore antérieurs, {teal}« {/teal}dieu les connaît et parmi les hommes {teal}ceux que ce dieu a en amitié »{/teal}.

    **Les deux triangles.** {yellow}L'isocèle rectangle{/yellow}, et, parmi les scalènes, {teal}« {/teal}le {teal}plus beau »{/teal} : {yellow}le demi-triangle équilatéral{/yellow}, dont l'hypoténuse est double du petit côté (côtés dans le rapport 1, √3, 2).

    | Élément | Polyèdre | Faces | Triangle de base |
    | feu | tétraèdre | 4 triangles équilatéraux | demi-équilatéral |
    | air | octaèdre | 8 triangles équilatéraux | demi-équilatéral |
    | eau | icosaèdre | 20 triangles équilatéraux | demi-équilatéral |
    | terre | cube | 6 carrés | isocèle |

    Le cinquième polyèdre régulier, le {yellow}dodécaèdre{/yellow}, {teal}« {/teal}le dieu s'en est servi {teal}pour l'univers{/teal}, lorsqu'il y peignit {teal}des figures animales »{/teal} : {coral}c'est le plus proche de la sphère{/coral}.

    **Les transformations.** {amber}Feu, air et eau ont des faces de même triangle{/amber} : {green}leurs corpuscules, en se brisant, se recomposent les uns dans les autres{/green} ({yellow}deux tétraèdres de feu font un octaèdre d'air, 4 + 4 = 8 faces{/yellow}). {red}La terre, faite d'isocèles, ne se change en rien d'autre.{/red} Timée corrige ainsi ce qu'il disait en {sky}49c{/sky} : que les quatre naissent tous les uns des autres, {teal}« {/teal}c'était là {teal}une apparence trompeuse »{/teal}.

    {amber}**Pourquoi le cube à la terre ?**{/amber} Parce qu'{coral}elle est le plus difficile des corps à mouvoir, et que le carré offre la base la plus stable{/coral} ({sky}55d-e{/sky}). {coral}Le feu reçoit le plus mobile et le plus petit, le tétraèdre.{/coral}

    **Physique et métaphysique.** {red}L'Idée du Feu n'a ni éclat, ni légèreté, ni chaleur.{/red} Mais, sachant ce qu'est le feu, {green}le démiurge sait que ses copies doivent apparaître brillantes, légères et chaudes{/green}, et {coral}choisit pour elles le corps qui convient le mieux à ces propriétés{/coral}. Chaque arrangement de triangles produit en celui qui perçoit une {violet}affection{/violet} ({blue}*pathos*{/blue}) : c'est ainsi qu'{yellow}il sent le chaud ou le froid{/yellow}.

    ! L'exclusion de la terre est un cas où {red}la méthode{/red} {blue}*a priori*{/blue} {red}contredit l'observation{/red} : {pink}on croit voir l'eau devenir pierre{/pink}, mais {green}la géométrie l'interdit{/green}.
  points:
