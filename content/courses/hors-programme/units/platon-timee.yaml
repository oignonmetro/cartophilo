- id: platon-timee-i16
  title: "L'éthique : redresser les révolutions de l'âme"
  notes: |-
    **Le discours sur le monde culmine dans une éthique : l'homme doit régler les mouvements de son âme, dérangés à la naissance, sur les révolutions de l'univers, et atteindre ainsi la vie la meilleure.** C'est le sommet du discours (90a-d), et le but annoncé dès l'ouverture : la nature de l'homme, sur le fond de la nature de l'univers, doit fonder le récit de Critias sur la vertu en acte.

    Le dieu a donné à chacun, « comme démon », l'espèce d'âme qui domine en nous, et qui habite le haut du corps : elle nous élève vers ce qui, dans le ciel, lui est apparenté, « car nous sommes une plante non point terrestre, mais céleste ».

    | Celui qui | Il a | Repère |
    | s'abandonne aux appétits et aux ambitions | des pensées devenues mortelles | 90b |
    | cherche la connaissance et les pensées vraies | des pensées immortelles et divines, et il est « supérieurement heureux » | 90b-c |

    Il n'y a qu'une façon de tout soigner : donner à chaque partie les aliments et les mouvements qui lui conviennent (90c). Pour la partie divine, ce sont les pensées et les révolutions de l'univers. Chacun doit, « en redressant les révolutions qui dans notre tête ont été dérangées lors de notre naissance » (`exorthounta`), rendre celui qui contemple semblable à ce qu'il contemple, et atteindre « le but de la vie la meilleure proposée aux hommes par les dieux pour le présent et pour l'avenir ».

    Le bien de l'âme est d'être bien ordonnée (`eu kekosmêmenon`, 90c) : son ordre est celui du monde (`kosmos`). C'est la vieille conviction socratique que la connaissance du bien sauve, étendue au-delà de la morale, jusqu'à l'astronomie.

    ! Ce n'est pas l'observation des astres pour elle-même qui rend heureux : c'est l'étude de leurs révolutions en tant qu'elle remet en ordre celles de notre âme.
