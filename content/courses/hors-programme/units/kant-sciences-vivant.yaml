    answer: "origine"
    alt: ["production"]
- id: ks4-l3
  title: "Comment dissoudre l'Antinomie du jugement téléologique ?"
  notes: |-
    Dans les deux premières *Critiques*, Kant résout chaque antinomie de la même façon : thèse
    et antithèse supposent toutes deux le **réalisme transcendantal** (elles parlent de
    choses en soi), et l'idéalisme transcendantal fournit le point de vue d'où la
    contradiction se défait. **Il ne fait pas cela pour la téléologie** : les interprètes ont
    donc dû reconstruire une autre solution en son nom. Cinq pistes, puis la solution de
    Kant lui-même.

    - {green}L'entendement intuitif{/green} (Quarfood 2004, Förster 2008), exposé aux §§76-77 de la *Critique de la faculté de juger téléologique*.
      Nos entendements sont {violet}discursifs{/violet} : ils saisissent les objets par des
      concepts, comme des « parties » assemblées dans des jugements qui se déroulent dans le
      temps, donc de manière mécanique. Nous avons besoin du concept de **fin** pour juger les
      organismes précisément parce que nous avons un entendement discursif. Un entendement
      intuitif saisirait les organismes sans concepts de fin ni principes régulateurs pour
      juger téléologiquement : pour lui, thèse et antithèse n'auraient pas à être vraies, et
      aucune antinomie ne naîtrait.
    - {green}Deux points de vue complémentaires{/green} (Breitenbach 2008). L'Antinomie est
      dissoute si l'on note que thèse et antithèse ne sont pas contradictoires, mais
      complémentaires. La thèse mécaniste règle la conduite explicative de la biologie
      empirique ; l'antithèse gouverne le jugement ordinaire, préthéorique, sur la nature
      vivante. Ce sont « deux vues différentes sur la nature », compossibles.
    - {green}Un domaine par principe{/green} (McLaughlin 1990). L'Antinomie ne naît que sous
      une hypothèse particulière : que tout dans la nature est objectivement explicable par
      nous. Si on la rejette, thèse et antithèse peuvent être vraies chacune dans son domaine :
      la première pour les phénomènes que nous pouvons expliquer, la seconde pour ceux que nous
      ne pouvons pas expliquer. Mais il n'offre pas de critère général de l'explicabilité par
      nous, en dehors de l'explicabilité mécanique.
    - {green}Subordonner le mécanisme à la téléologie{/green} (Ginsborg 2008), à partir de la
      remarque de Kant au §78 de la *Critique de la faculté de juger téléologique*. Naturalistes et physiologistes peuvent expliquer
      « mécaniquement » l'origine et le fonctionnement des organismes, par les seules lois
      physico-chimiques, pourvu qu'ils les appliquent non à une matière « brute » mais à une
      matière {violet}organisée{/violet}, déjà dotée d'une « pulsion formatrice », disposition
      générique à croître, à se reproduire et à se maintenir. Or cette matière organisée est
      elle-même inintelligible sans recours aux termes de fin et de dessein : les biologistes
      « subordonnent » le mécanisme à la téléologie, et le conflit disparaît.

    **Et Kant ?** Chaque proposition rencontre des difficultés philosophiques (Watkins 2009),
    et peu s'attachent aux mots de Kant, qui suggèrent fortement une solution qui repose
    indispensablement sur un {red}« fondement suprasensible »{/red} (*Critique de la faculté de juger téléologique*, §78), principe explicatif
    situé dans le monde nouménal. Ce fondement pourrait unir mécanisme et téléologie, puisqu'on
    pourrait déduire des deux thèses antinomiques de lui. Mais les humains ne peuvent avoir
    aucune connaissance « positive déterminée » d'un être suprasensible : **l'Antinomie est
    soluble en principe plutôt que résolue en fait.** Kant ne donne pas, du moins dans sa
    solution officielle, les détails d'une explication effective du conflit au cœur de
    l'explication biologique.

    ! Aucune des cinq pistes n'est celle de Kant : ce sont des reconstructions, chacune avec
    ses difficultés.
  points:
  - id: ks4-l3-p1
    sentence: "Dans les deux premières *Critiques*, Kant montre que thèse et antithèse de chaque antinomie supposent le réalisme transcendantal, et il adopte l'idéalisme ___ comme point de vue d'où la contradiction se défait."
    answer: "transcendantal"
    alt: []
  - id: ks4-l3-p2
    sentence: "Pour Quarfood (2004) et Förster (2008), la clef de la solution de l'Antinomie du jugement téléologique est la notion d'entendement ___, exposée aux §§76-77 de la *Critique de la faculté de juger téléologique*."
    answer: "intuitif"
    alt: []
  - id: ks4-l3-p3
    sentence: "Selon Förster, les entendements comme le nôtre sont ___ : ils saisissent les objets par des concepts, comme des parties assemblées dans des jugements qui se déroulent dans le temps, et donc de manière mécaniste."
    answer: "discursifs"
    alt: ["discursif"]
  - id: ks4-l3-p4
    sentence: "Selon Förster, nous avons besoin du concept de ___ pour juger les organismes précisément parce que nous avons un entendement discursif ; un entendement intuitif s'en passerait, et aucune antinomie n'en naîtrait."
    answer: "fin"
    alt: ["but", "finalité", "fins"]
  - id: ks4-l3-p5
    sentence: "Pour Breitenbach (2008), l'Antinomie est dissoute parce que thèse et antithèse ne sont pas contradictoires mais ___ : l'une règle la conduite explicative de la biologie empirique, l'autre le jugement ordinaire sur la nature vivante."
    answer: "complémentaires"
    alt: []
  - id: ks4-l3-p6
    sentence: "Pour McLaughlin (1990), l'Antinomie ne naît que si l'on suppose que tout dans la nature est objectivement ___ par nous ; on la rejette, et thèse et antithèse deviennent vraies chacune dans son domaine."
    answer: "explicable"
    alt: []
  - id: ks4-l3-p7
    sentence: "Pour Ginsborg (2008), les naturalistes peuvent expliquer l'origine et le fonctionnement des organismes par les seules lois physico-chimiques, pourvu qu'ils les appliquent non à une matière brute mais à une matière ___, déjà dotée d'une disposition générique à croître, à se reproduire et à se maintenir."
    answer: "organisée"
    alt: []
  - id: ks4-l3-p8
    sentence: "Pour Ginsborg, à partir d'une remarque de Kant au §78 de la *Critique de la faculté de juger téléologique*, les biologistes subordonnent le ___ à la téléologie, et le conflit entre eux est ainsi levé."
    answer: "mécanisme"
    alt: []
  - id: ks4-l3-p9
    sentence: "La solution de Kant lui-même, dans ses propres mots, repose indispensablement sur un « fondement ___ » (*Critique de la faculté de juger téléologique*, §78), principe explicatif situé dans le monde nouménal qui pourrait unir mécanisme et téléologie."
    answer: "suprasensible"
    alt: ["supra-sensible"]
  - id: ks4-l3-p10
    sentence: "Comme les humains ne peuvent avoir aucune connaissance positive déterminée d'un fondement suprasensible, l'Antinomie du jugement téléologique est soluble ___ plutôt que résolue en fait."
    answer: "en principe"
    alt: []
- id: ks4-l4
  title: "La chimie : une science rationnelle, mais impropre"
  notes: |-
    La chimie illustre la distinction que Kant trace entre deux statuts. **Elle est une
    science rationnelle, non une science proprement dite, et elle le reste même après
    Lavoisier.**

    **Deux statuts.**
    - {green}science « proprement dite »{/green} : toute discipline fortement mathématisée,
      qui s'appuie sur des lois apodictiques et sur des preuves concluantes. L'exemple type
      est la théorie newtonienne de la gravitation ;
    - {green}science « rationnelle »{/green} : un corps de propositions systématique, c'est-à-dire
      unifié dans l'explication, qui comprend des lois. La chimie en est, pour Kant, l'exemple
      par excellence. Il a vécu un changement considérable de cette discipline : de la
      théorie du {violet}phlogistique{/violet} de Stahl à la rénovation par Lavoisier de ses
      processus fondamentaux et de sa taxinomie des substances.

    **Pourquoi pas une science propre ?** Dans une science proprement dite, les concepts de
    base correspondent à des notions mathématiques, et le garant de cette correspondance est
    la **métaphysique**, par exemple grâce à une image de l'essence de la matière : elle
    fournit les principes de la construction des concepts propres à cette science. Or en
    chimie, aucun garant métaphysique n'est disponible pour corréler concepts de base et
    mathématique : quand ces corrélations apparaissent (Kant n'ignore pas que la chimie de
    son temps a trouvé des faits quantitatifs, comme les proportions des réactifs d'une
    réaction), elles sont connues *a posteriori*. Conclusion : non seulement la chimie n'est pas
    une science proprement dite, mais elle n'est pas près de le devenir (*Premiers principes*, Préface).

    **Pourquoi pourtant « rationnelle » ?** Parce qu'elle doit son ordre systématique à des
    idées de la raison : des concepts artificiels, propres à son domaine, introduits pour
    unifier descriptivement et explicativement de nombreuses régularités locales établies
    empiriquement. Par exemple, tous les métaux solides alors connus « calcinent » (chauffés à
    l'air, ils forment des composés plus lourds), et l'on peut les retirer de ces composés dans
    les bonnes conditions de laboratoire.

    **Après 1790.** Kant semble adopter la nouvelle taxinomie des substances de Lavoisier et
    son {violet}calorique{/violet} (ou éther), sorte de « fluide impondérable » doué de
    propriétés causales relevant de la chaleur, de la combustion et des changements de phase.
    Mais, comme l'a établi la recherche récente (McNulty 2014, 2015, 2016 ; Blomme 2023),
    même alors Kant maintient ses exigences d'une science propre : la chimie reste une science
    rationnelle mais **impropre**.

    ! « Impropre » n'est pas péjoratif : il désigne un autre régime de rigueur, systématique
    mais non mathématisable.
  points:
