# Cours tiré de l'article « Kant's Philosophy of Science » (Stanford
# Encyclopedia of Philosophy, 2003, révision 2023), sections 5 à 8 : la
# biologie, la chimie, la psychologie, puis l'histoire, la géographie
# physique et l'anthropologie. Les citations de Kant sont la traduction
# française de la traduction anglaise de l'article, situées par œuvre et section.
#
# Points laissés de côté : le renvoi de l'article à l'entrée « Kant's
# Aesthetics and Teleology » pour une présentation plus détaillée de la
# biologie ; les références bibliographiques (Allison, Cohen, Kreines,
# Zanetti, etc.) citées sans que la thèse propre de chacun soit
# différenciée ; l'entrée « philosophie de l'esprit » de Kant.

id: kant-sciences-vivant
title: "Le vivant et les sciences impropres"
subtitle: "Biologie, chimie, psychologie, histoire : ce que Kant en fait"
icon: bulb
color: blue
group: "Kant : la philosophie des sciences"
intro: |-
  Les *Premiers principes* fixaient un modèle, la physique. Les sciences qui ne le
  satisfont pas ne sont pas pour autant rejetées : Kant leur cherche un autre statut.
  L'organisme, surtout, le force à une conclusion paradoxale, qu'il faut juger du vivant
  comme s'il avait un but alors qu'on ne peut le démontrer.
lessons:
- id: ks4-l1
  title: "L'organisme, fin naturelle : pourquoi il n'est pas une machine"
  notes: |-
    Kant ne s'intéresse pas qu'aux corps inanimés : il juge que les **organismes** méritent
    une enquête philosophique supplémentaire, pour deux raisons. **Cette leçon pose ce qu'est
    un organisme pour Kant, et en quel sens l'on dit qu'il n'est pas explicable
    mécaniquement.**

    **Premier trait : la contingence.** La symétrie et la régularité de leur structure et de
    leur fonctionnement rendent les organismes « au plus haut degré contingents » (*Critique de la faculté de juger téléologique*, §61) et
    « mécaniquement inexplicables ».

    **Second trait : l'auto-production.** Un organisme vient de son espèce, fait croître ses
    propres parties fonctionnelles (les organes), les répare quand elles sont abîmées, et
    présente en général de l'homéostasie. De là cette formule : l'organisme est
    {teal}« cause et effet de lui-même »{/teal} (*Critique de la faculté de juger téléologique*, §64). En un sens, un vivant est auto-causé,
    d'une causalité que nous ne saisissons que « sous l'idée de fins comme principe » (*Critique de la faculté de juger téléologique*, §68).
    Les organismes sont donc des {violet}fins naturelles{/violet} : des ensembles, naturels,
    de parties ajustées à un but et fonctionnant dans l'unité.

    Ces particularités posent des problèmes que la physique et la chimie ne rencontrent pas.
    Kant les traite dans la seconde moitié de sa troisième grande œuvre, la *Critique de la
    faculté de juger* (1790).

    **En quel sens « mécaniquement » ?** À l'époque des Lumières, le mot a deux sens :
    - {green}large{/green} : l'explication par des lois physico-chimiques de causalité
      efficiente ;
    - {green}étroit{/green} : la théorie des {violet}machines composées{/violet}, assemblages
      de parties mobiles qui déplacent des charges ou transmettent de la quantité de
      mouvement (moteurs, montres).

    McLaughlin (1990) retient le sens étroit. Dans une machine artificielle, les parties
    précèdent le tout dans le temps et le déterminent : la configuration résulte d'une somme
    sur les parties, et les lois de fonctionnement sont celles des parties. Dans un
    organisme, **le tout précède ses parties** (ses organes) et possède des fonctions et des
    comportements orientés vers un but qu'elles n'ont pas.

    Ginsborg (2004) distingue deux sens du « mécanique ».
    - Le {green}premier{/green} : expliquer mécaniquement une chose, c'est montrer que sa
      production résulte, ou résulterait, des « forces non aidées de la matière comme telle »
      (les forces newtoniennes d'attraction et de répulsion) appliquées à une matière brute
      et non organisée, dans des conditions initiales arbitraires. Les organismes y échappent
      parce que leur apparition serait « au plus haut degré contingente » : c'est le sens
      opérant dans l'Antinomie du jugement téléologique.
    - Le {green}second, plus fort{/green} : les symétries, régularités et pouvoirs d'un
      organisme ne s'expliquent pas non plus par les « forces motrices » de ses particules
      inorganiques ; les pouvoirs au niveau de l'organisme ne sont pas des sommes vectorielles
      ou des intégrales de forces physico-chimiques.

    ! « Fin naturelle » ne veut pas dire que la nature agit en vue d'un but : c'est l'idée
    sous laquelle nous saisissons l'auto-production des organismes.
  points:
  - id: ks4-l1-p1
    sentence: "La symétrie et la régularité de leur structure et de leur fonctionnement rendent les organismes, pour Kant, « au plus haut degré ___ » (*Critique de la faculté de juger téléologique*, §61) et mécaniquement inexplicables."
    answer: "contingents"
    alt: ["contingent"]
