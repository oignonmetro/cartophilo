- id: ks4-l6
  title: "Histoire, géographie physique, anthropologie : la coordination par une idée pratique"
  notes: |-
    Même rigoureux sur ce qui est science « proprement dite », Kant reconnaît d'autres
    disciplines comme scientifiques en un autre sens. Ses réflexions sur la science, entendue
    largement (non seulement *Wissenschaft*, mais toute *Lehre* ou *Kunde*), s'étendent à
    l'histoire, à la géographie physique et à l'anthropologie. **Elles sont des savoirs dont
    les connaissances s'ordonnent non par subordination mais par coordination.**

    **Une place prévue dès la Préface.** Dans les *Premiers principes* (Préface), Kant divise
    la doctrine de la nature en **science de la nature** (la physique, par exemple) et en
    **doctrine historique de la nature**, elle-même subdivisée en description de la nature et
    histoire de la nature.

    **Subordination, coordination.**
    - en {green}physique{/green}, les connaissances sont liées par {violet}subordination{/violet} :
      l'une se déduit de l'autre ;
    - en {green}histoire{/green}, elles sont liées par {violet}coordination{/violet} : les
      faits historiques ne se dérivent pas les uns des autres, ils sont seulement mis en
      relation dans l'espace (géographiquement) et dans le temps (chronologiquement).

    L'anthropologie recoupe en partie l'objet de la psychologie empirique.

    **Ce qui rend la coordination possible.** Ce n'est pas une idée théorique, mais une idée
    **pratique**. Pour l'histoire, le principe directeur de la coordination est l'idée de la
    raison (ou de la liberté), comme dans l'« Idée d'une histoire universelle d'un point de vue
    cosmopolitique ». L'anthropologie est cadrée par l'idéal moral cosmopolite du meilleur du
    monde.

    Ainsi l'accent de Kant sur la physique, tout au long de sa carrière, ne l'a pas aveuglé
    sur la valeur des autres sciences, ni empêché de réfléchir de manière créative à la façon
    d'en rendre compte du point de vue de la philosophie critique.

    ! La physique, science propre, ordonne par la déduction ; l'histoire, science en un sens
    plus large, ordonne par un but que la raison pratique se donne.
  points:
