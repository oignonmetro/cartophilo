    answer: "apodictiques"
    alt: ["apodictique"]
  - id: ks4-l4-p2
    sentence: "Kant appelle science « rationnelle » un corps de propositions systématique, c'est-à-dire unifié dans l'explication, qui comprend des ___ ; la chimie en est son exemple par excellence."
    answer: "lois"
    alt: []
  - id: ks4-l4-p3
    sentence: "Kant a vécu en chimie le passage de la théorie du ___ de Georg Stahl à la rénovation de la discipline par Lavoisier."
    answer: "phlogistique"
