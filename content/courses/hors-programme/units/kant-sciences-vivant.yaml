    answer: "sommes"
    alt: ["somme"]
- id: ks4-l2
  title: "L'Antinomie du jugement téléologique"
  notes: |-
    Pour Kant, vouloir expliquer les organismes crée un conflit inévitable au sein de la
    faculté de juger **réfléchissante**, celle qui forme nos concepts empiriques, classe les
    êtres de la nature et unifie nos lois particulières. **Ce conflit est l'Antinomie du
    jugement téléologique** (*Critique de la faculté de juger téléologique*, §§69 à 78). Elle
    oppose deux principes *régulateurs*, à distinguer de deux principes *constitutifs* que
    Kant discute au même endroit.

    - {green}Thèse{/green} : {teal}« toute production des choses matérielles et de leurs
      formes doit être jugée possible suivant des lois simplement mécaniques »{/teal} ;
    - {green}Antithèse{/green} : {teal}« certains produits de la nature matérielle ne peuvent
      être jugés possibles suivant des lois simplement mécaniques (les juger exige une tout
      autre loi de causalité, à savoir celle des causes finales) »{/teal} (*Critique de la faculté de juger téléologique*, §70).

    Trois questions occupent la recherche : en quel sens les organismes sont-ils
    mécaniquement inexplicables (leçon précédente) ? **Quelle est exactement la contradiction ?**
    Comment Kant la résout-il (leçon suivante) ?

    **Quelle contradiction ?** Si thèse et antithèse sont des principes régulateurs, on peut y
    voir des politiques de recherche, que l'on poursuit séparément, à des moments différents,
    sans contradiction. Pourquoi sont-elles alors antinomiques ?
    - {green}Watkins (2009){/green} : les deux principes n'énoncent pas seulement des
      politiques d'explication : ils expriment des engagements à juger de façon **déterminée**
      des phénomènes biologiques ; juger les organismes purement mécaniquement et les juger
      non mécaniquement sont des engagements contradictoires.
    - {green}Teufel (2011){/green} : les deux principes sont des **impératifs hypothétiques**
      que la raison pratique impose à la faculté de juger réfléchissante ; ils exigent des
      conduites cognitives contradictoires (juger que les lois mécaniques suffisent, et juger
      qu'elles ne suffisent pas).

    **Comment Kant justifie-t-il les deux principes ?** Pour chaque antinomie de la *Critique
    de la raison pure*, Kant dérive thèse et antithèse par déduction de prémisses *a priori*.
    Ici il ne procède pas ainsi, ce qui rend pressante la question de leur justification.
    - Pour la thèse, on pense la déduire des trois lois de la mécanique. Mais celles-ci sont
      des principes *constitutifs*, la thèse est *régulatrice*. Meilleure piste : les trois
      lois **contraignent** l'éventail des lois empiriques, biologiques comprises, qu'on peut
      chercher. Elles sont fondamentales (aucune autre loi de la matière ne les explique ni ne
      les fonde, et elles doivent expliquer toutes les autres, directement ou non). Pour que des
      régularités biologiques deviennent de vraies lois, elles doivent s'intégrer au système
      des lois mécaniques déjà connues, et être expliquées en dernière instance par les trois
      lois de la mécanique (*Critique de la faculté de juger téléologique*, §70).
    - Pour l'antithèse, il n'y a pas de preuve officielle, et l'on ne sait même pas ce que la
      preuve devrait établir. La thèse suggère fortement qu'il s'agit de l'**origine** des
      organismes ; l'antithèse concerne la façon de juger leur **possibilité**, c'est-à-dire
      leur structure et leur fonctionnement, non leur production (Ginsborg 2001). Ce sont deux
      aspects différents, qui exigeraient deux preuves.

    ! Les thèse et antithèse ne sont pas des affirmations sur la nature en soi : ce sont des
    maximes pour juger.
  points:
  - id: ks4-l2-p1
    sentence: "Dans la *Critique de la faculté de juger*, l'Antinomie du jugement téléologique occupe les paragraphes 69 à ___."
    answer: "78"
    alt: ["§78", "§ 78"]
  - id: ks4-l2-p2
    sentence: "L'Antinomie du jugement téléologique est un conflit entre deux principes régulateurs au sein de la faculté de juger ___, celle qui forme nos concepts empiriques et unifie nos lois particulières."
    answer: "réfléchissante"
    alt: []
  - id: ks4-l2-p3
    sentence: "Selon la thèse de l'Antinomie du jugement téléologique, toute production des choses matérielles et de leurs formes doit être jugée possible suivant des lois simplement ___."
    answer: "mécaniques"
    alt: []
  - id: ks4-l2-p4
    sentence: "Selon l'antithèse de l'Antinomie du jugement téléologique, certains produits de la nature matérielle ne peuvent être jugés possibles suivant des lois simplement mécaniques : en juger exige une tout autre loi de causalité, celle de la causalité ___."
    answer: "finale"
    alt: ["des causes finales", "des fins"]
  - id: ks4-l2-p5
    sentence: "Pour Watkins (2009), les deux principes de l'Antinomie du jugement téléologique ne sont pas seulement des politiques d'explication : ils expriment des engagements à juger de façon ___ des phénomènes biologiques, ce qui les rend contradictoires."
    answer: "déterminée"
    alt: ["déterminante", "déterminé"]
  - id: ks4-l2-p6
    sentence: "Pour Teufel (2011), les deux principes de l'Antinomie du jugement téléologique sont des impératifs ___ que la raison pratique impose à la faculté de juger réfléchissante."
    answer: "hypothétiques"
    alt: []
  - id: ks4-l2-p7
    sentence: "Les trois lois de la mécanique étant des principes constitutifs et la thèse un principe régulateur, il faut plutôt comprendre que ces lois contraignent les lois biologiques qu'on peut chercher : pour devenir de vraies lois, les régularités biologiques doivent s'intégrer au système des lois ___ déjà connues."
    answer: "mécaniques"
    alt: []
  - id: ks4-l2-p8
