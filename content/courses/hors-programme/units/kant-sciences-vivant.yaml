- id: ks4-l5
  title: "La psychologie : pourquoi même la psychologie empirique est impropre"
  notes: |-
    Les vues de Kant sur la psychologie se lient à sa philosophie de l'esprit en général.
    **Il y distingue la psychologie rationnelle, dont il ruine les prétentions, et la
    psychologie empirique, qui ne peut elle non plus prétendre au rang de science propre.**

    **Un raisonnement par élimination.**
    - la {red}psychologie rationnelle{/red} : dans les Paralogismes de la *Critique de la
      raison pure*, Kant nie qu'elle contienne des arguments justifiant le moindre principe
      substantiel, notamment sur notre immortalité ;
    - il semble alors que seule la {green}psychologie empirique{/green} puisse être une
      science ;
    - mais si toute science propre exige une partie pure, et si la psychologie rationnelle ne
      fournit aucun savoir substantiel, la psychologie empirique ne peut non plus être une
      science proprement dite.

    **Pourquoi ?** Deux lectures.
    - {green}Hatfield (1992){/green} : la mathématisation, marque d'une science propre, n'est
      pas possible. Les phénomènes psychiques sont dans le temps, leur forme ordonnatrice *a
      priori*, et le temps comme forme a trop peu de traits pour porter une forte
      mathématisation : c'est une variété à **une seule dimension**, représentable par une
      ligne, trop étroite pour soutenir les constructions en intuition pure qu'exigerait la
      mathématisation.
    - {green}McNulty (2014){/green} : la psychologie empirique manque de **véritables lois**.
      Kant laisse ouverte la perspective de « lois d'association », c'est-à-dire de connaissances
      de constances de conjonction entre certaines de nos représentations internes, que
      l'introspection peut découvrir. Mais de telles régularités peuvent ressembler à des lois
      sans en être. De véritables lois exigent un garant plus fort : des prédictions réussies
      confirmées par l'expérimentation, ou des observations précises, ce que la psychologie
      empirique ne peut fournir. Elle serait donc **plus impropre encore que la chimie**, qui
      dispose, elle, de véritables lois.

    **Postérité.** Kant a influencé la théorie empirique allemande du début du XIXe siècle,
    mais c'est sa psychologie transcendantale de la *Critique de la raison pure*, non ses vues
    sur la psychologie empirique, qui fut la plus influente. Sa doctrine de l'espace et du
    temps comme formes de la sensibilité reçut une lecture naturaliste en physiologie et en
    psychologie de la perception : puisqu'une forme *a priori* de l'intuition n'a pas à être
    innée, elle peut se déployer au cours de l'expérience sensible. J. G. Steinbuch (1811)
    et C. Th. Tourtual (1827) étudièrent donc empiriquement comment naît la représentation
    de l'espace : comment un sujet voit des choses disposées dans l'espace, perçoit des
    objets en trois dimensions, représente des structures spatiales. Sturm (2001) soutient que
    les remarques critiques de Kant visent principalement les conceptions de la psychologie
    fondées sur l'introspection.

    ! « A priori » ne veut pas dire « inné » : c'est pourquoi la forme a priori de l'espace peut
    avoir une histoire empirique.
