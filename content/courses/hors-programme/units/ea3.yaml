  - id: ea3-l4b
    title: "Idées de la raison, Idées de l'imagination"
    notes: |
      Le noyau de la philosophie critique est la distinction de l'**intuition** et du **concept** : la connaissance suppose leur union. Deux cas y échappent :

      | | Idée de la raison | Idée esthétique, ou de l'imagination |
      | Définition | un concept qui excède infiniment toute intuition : aucune intuition ne peut lui correspondre | une intuition qui dépasse tout concept déterminé : aucun concept ne pourra jamais lui correspondre exactement |
      | Exemples | Dieu, le monde, l'immortalité de l'âme | les représentations de l'art du génie |
      | Ce dont elle relève | l'indicible | l'ineffable |

      En art, l'imagination sert surtout à produire des Idées esthétiques : elles excitent le travail de l'entendement sans aboutir à une connaissance. Au service de l'entendement, l'imagination est **reproductrice** : elle schématise les formes visibles pour relier sensations et concepts. Au service de l'art, elle est **créatrice** : elle retravaille librement la matière de l'expérience, et ses représentations élargissent esthétiquement la pensée.

      Le génie est le pouvoir d'engendrer des Idées esthétiques : le pouvoir de « découvrir des Idées pour un concept donné », puis de leur trouver l'expression sensible qui les rend universellement communicables. L'art du génie est ainsi l'**expression** des Idées esthétiques.

      ! Les beautés naturelles n'expriment rien en elles-mêmes : elles peuvent seulement être vues comme exprimant quelque chose, le lys comme l'innocence, le chant des oiseaux comme la joie de vivre.
