id: ea3
title: "Beauté libre, beauté adhérente, génie et art"
subtitle: "Critiques du jugement de goût, pureté de la beauté, et théorie kantienne de l'art"
icon: palette
color: violet
group: "Kant : l'esthétique"
lessons:
  - id: ea3-l1
    title: "Critiques adressées au jugement de goût"
    notes: |
      Au-delà des critiques déjà adressées à la déduction du jugement de goût, plusieurs objections visent la caractérisation même du jugement de beauté donnée dans l'{sky}Analytique du beau{/sky}, en particulier son {violet}désintéressement{/violet}, et ce que les commentateurs appellent le {violet}**formalisme**{/violet} de Kant : la thèse selon laquelle {amber}seul l'agencement formel abstrait de l'objet compterait pour l'appréciation esthétique{/amber}.

      Ce formalisme a exercé une influence marquée en théorie musicale, par l'intermédiaire du critique {sky}Hanslick{/sky}. Mais il faut noter un contraste interne à l'ouvrage : si l'{sky}Analytique du beau{/sky} penche vers le {amber}formalisme{/amber}, le traitement kantien des {sky}idées esthétiques{/sky} (voir la leçon suivante) se prête mieux à une lecture {amber}*expressiviste*{/amber} de l'art.

      Plusieurs critiques visent le {violet}désintéressement{/violet} :
      - on prend bel et bien {red}un intérêt à la **préservation** des objets beaux{/red} ({sky}Crawford{/sky}).
      - le désintéressement impliquerait une exigence de {red}« **distance psychique** »{/red} envers l'objet, critique rattachée au « **mythe de l'attitude esthétique** » de {sky}Dickie{/sky}, que {sky}Zangwill{/sky} juge mal fondée.

      D'autres critiques visent le {violet}non-conceptualisme{/violet} du plaisir esthétique :
      - il impliquerait, de façon peu défendable, qu'{red}un **esprit vidé de tout contenu conceptuel** serait le mieux placé pour apprécier la beauté{/red} ({sky}Wollheim{/sky}, critique traitée par {sky}Janaway{/sky}).
      - il {red}ne laisserait aucune place à l'**échange de raisons**{/red} en critique d'art (objection à laquelle répond {sky}Crawford{/sky} dès 1970).

      Enfin, {sky}Baz{/sky} reproche à Kant de faire résider la valeur de la beauté {pink}dans sa relation à la **connaissance**{/pink} plutôt que {green}dans le fait que l'objet beau **importe pour lui-même**{/green}.
    points:
      - id: ea3-l1-p1
        sentence: "__Les commentateurs nomment__ ___ la thèse, prêtée à Kant, selon laquelle **seul l'agencement formel abstrait de l'objet** (la façon dont ses éléments s'organisent dans l'espace ou le temps) compterait pour l'appréciation esthétique."
        answer: "formalisme"
        alt: []
      - id: ea3-l1-p2
        sentence: "Le formalisme esthétique de Kant a exercé une influence particulièrement marquée en **théorie musicale**, __par l'intermédiaire du critique__ ___."
        answer: "Hanslick"
        alt: []
      - id: ea3-l1-p3
        sentence: "Si l'Analytique du beau défend une position plutôt formaliste, le traitement kantien des **idées esthétiques** __se prête au contraire mieux à une lecture__ ___ de l'art."
        answer: "expressiviste"
        alt: []
      - id: ea3-l1-p4
        sentence: "Une objection typique à la thèse du **désintéressement du plaisir esthétique**, formulée par exemple par Crawford, souligne le fait, apparemment évident, que __nous prenons bel et bien un intérêt à la__ ___ des objets beaux."
        answer: "préservation"
        alt: []
        explanation: "Crawford 1974: 53."
      - id: ea3-l1-p5
        sentence: "La thèse du désintéressement est également tenue pour responsable d'une exigence de « **distance psychique** » envers l'objet apprécié : __une critique généralement rattachée à la discussion célèbre du « mythe de l'attitude esthétique » due à__ ___."
        answer: "Dickie"
        alt: []
        explanation: "Dickie 1964."
      - id: ea3-l1-p6
        sentence: "___ soutient que cette critique de Kant par le biais de la « distance psychique », rattachée à Dickie, __repose sur un malentendu, et la juge **mal fondée**__."
        answer: "Zangwill"
        alt: []
        explanation: "Zangwill 1992."
      - id: ea3-l1-p7
        sentence: "__Selon une critique due à__ ___, la thèse kantienne du caractère non conceptuel du plaisir esthétique impliquerait, de façon peu défendable, qu'un « **stock cognitif vide** » serait requis pour apprécier la beauté."
        answer: "Wollheim"
        alt: []
        explanation: "Wollheim 1980."
      - id: ea3-l1-p8
        sentence: "Cette **critique de Wollheim** contre le non-conceptualisme kantien __est traitée par__ ___."
        answer: "Janaway"
        alt: []
        explanation: "Janaway 1997."
      - id: ea3-l1-p9
        sentence: "Face à l'objection selon laquelle l'esthétique kantienne ne laisserait aucune place à l'**échange de raisons** ni à la critique d'art, __Crawford propose une réponse dès l'année__ ___, reprise ensuite sur des lignes similaires par Wilson en 2007."
        answer: "1970"
        alt: []
      - id: ea3-l1-p10
        sentence: "___ __reproche à Kant de faire résider la valeur de la beauté dans sa relation à la connaissance__, plutôt que dans le fait que l'objet beau **importe pour lui-même**."
        answer: "Baz"
        alt: []
        explanation: "Baz 2005 ; une réponse est offerte par Hughes 2006."

  - id: ea3-l2
    title: "Beauté libre et beauté adhérente"
    notes: |
      Un jugement de beauté peut perdre sa {violet}**pureté**{/violet} de deux façons :
      - en étant influencé par le {red}**charme**{/red} [{blue}*Reiz*{/blue}] ou l'{red}**émotion**{/red} [{blue}*Rührung*{/blue}] de l'objet (§13) ;
      - en devenant contingent à l'application d'un {red}**concept**{/red} : l'objet n'est alors plus jugé beau absolument, mais beau {amber}*en tant qu'appartenant* à tel ou tel genre{/amber}.

      Ce second cas donne lieu, au {sky}§16{/sky}, à la distinction entre {violet}beauté __libre__{/violet} [{blue}*frei*{/blue}] et {violet}beauté __adhérente__{/violet} ou dépendante [{blue}*anhängend*{/blue}]. Kant ne donne que des exemples d'art non représentatif pour la {green}beauté libre{/green} : {yellow}dessins à la grecque, motifs de bordure ou de papier peint, musique sans texte{/yellow}.

      ! Cette suggestion (que tout art représentatif relèverait de la {pink}beauté adhérente{/pink}, donc impure) inquiète certains commentateurs : {red}elle rendrait la théorie kantienne du beau largement étrangère à l'art{/red}, et laisserait entendre qu'{yellow}un papier peint serait esthétiquement supérieur au plafond de la chapelle Sixtine{/yellow}.

      Deux réponses s'y opposent :
      - {sky}Allison{/sky} soutient qu'un jugement de {pink}beauté adhérente{/pink} {coral}*contient* un jugement de beauté pur comme composante{/coral}, dont la pureté n'est pas compromise par son insertion dans une évaluation plus complexe.
      - {sky}Schaper{/sky} et {sky}Guyer{/sky} contestent directement l'idée que {red}l'art non représentatif serait supérieur à l'art représentatif{/red}.
      - {sky}Tuna{/sky} va plus loin en soutenant que {green}les œuvres issues du génie peuvent être des beautés libres, et non adhérentes{/green}.

      La {pink}**beauté adhérente**{/pink} {teal}« {/teal}suppose {teal}le concept de ce qu'une chose doit être »{/teal} ; la {green}**beauté libre**{/green} {teal}« {/teal}ne présuppose {teal}aucun concept{/teal} de ce que l'objet {teal}doit être »{/teal} (§16). Juger de la beauté adhérente, c'est {amber}comparer la chose avec son concept déterminé préalablement{/amber}, et apprécier l'écart ou l'accord entre l'objet et sa définition : {coral}un jugement de connaissance, qui porte sur le degré de perfection{/coral}. À la suite de {sky}Burke{/sky}, Kant sépare complètement les deux : {green}la perfection n'ajoute rien à la beauté, et l'absence de celle-ci n'enlève rien à la première{/green} ({sky}Sherringham{/sky}).

      Kant donne pour beautés libres {teal}« {/teal}beaucoup d'{teal}oiseaux{/teal} ({yellow}le perroquet, le colibri, l'oiseau de paradis{/yellow}), une foule de {teal}crustacés marins »{/teal}, {yellow}les dessins à la grecque et les rinceaux{/yellow}, et {teal}« {/teal}tout ce que l'on nomme en musique {teal}improvisation{/teal} (sans thème) et même {teal}toute la musique sans texte »{/teal}.

      Inversement, une {amber}beauté naturelle peut être jugée en relation à un concept{/amber} : dire {yellow}« c'est une belle femme »{/yellow} en pensant que la nature représente de belle manière les fins de la constitution féminine, c'est porter un jugement qui {red}n'est plus seulement esthétique{/red}, mais aussi {violet}**téléologique**{/violet}.
    points:
      - id: ea3-l2-p1
        sentence: "Un jugement de beauté peut d'abord perdre sa pureté en étant influencé par le **charme** que suscite l'objet ; __Kant nomme ce charme, en allemand,__ ___."
        answer: "Reiz"
        alt: []
        explanation: "§13."
      - id: ea3-l2-p2
        sentence: "L'**émotion** qui peut, elle aussi, entacher la pureté d'un jugement de beauté __porte, en allemand, le nom de__ ___."
        answer: "Rührung"
        alt: []
      - id: ea3-l2-p3
        sentence: "Un jugement de beauté peut aussi perdre sa pureté en devenant contingent à l'application d'un concept, de sorte que l'objet n'est plus jugé beau absolument mais **beau en tant qu'appartenant à tel ou tel genre** : __Kant appelle beauté ___ ce second type de beauté impure__, par opposition à la beauté libre."
        answer: "adhérente"
        alt: ["dépendante"]
        explanation: "§16."
      - id: ea3-l2-p4
        sentence: "Cette **beauté adhérente, ou dépendante**, __porte en allemand le nom de__ ___."
        answer: "anhängend"
        alt: []
      - id: ea3-l2-p5
        sentence: "Par opposition à la beauté adhérente, la beauté qui n'est **contingente à l'application d'aucun concept** __est nommée beauté ___ par Kant__."
        answer: "libre"
        alt: []
      - id: ea3-l2-p6
        sentence: "Cette **beauté libre** __porte, en allemand, le nom de__ ___."
        answer: "frei"
        alt: []
      - id: ea3-l2-p7
        sentence: "Kant ne donne que des exemples d'art non représentatif pour illustrer la **beauté libre en art** : les dessins à la grecque, les motifs de bordure ou de papier peint, __et surtout la musique ___, c'est-à-dire sans paroles__."
        answer: "sans texte"
        alt: []
        explanation: "§16, Ak. 5:229."
      - id: ea3-l2-p8
        sentence: "La distinction entre **beauté libre et beauté adhérente** __est introduite par Kant en__ ___."
        answer: "§16"
        alt: []
      - id: ea3-l2-p9
        sentence: "___ conteste l'idée que tout jugement portant sur une œuvre représentative relève nécessairement de la beauté adhérente, __en soutenant que les **œuvres issues du génie** peuvent au contraire compter comme des beautés libres__."
        answer: "Tuna"
        alt: []
        explanation: "Tuna 2018."
      - id: ea3-l2-p10
        sentence: "___ répond à l'objection que la distinction rendrait l'esthétique kantienne largement étrangère à l'art __en soutenant qu'un jugement de beauté adhérente contient, **comme composante**, un jugement de beauté pur__, dont la pureté n'est pas compromise par son insertion dans une évaluation plus complexe."
        answer: "Allison"
        alt: []
        explanation: "Allison 2001: 140–141."
      - id: ea3-l2-p11
        sentence: "L'objection selon laquelle la distinction ferait du **papier peint** un art __esthétiquement supérieur au plafond de la chapelle__ ___ est contestée notamment par Schaper et par Guyer."
        answer: "Sixtine"
        alt: []
        explanation: "Guyer 2005b, chs. 4 et 5."
      - id: ea3-l2-p12
        sentence: "La première façon, pour un jugement de beauté, de perdre sa pureté consiste à être influencé par l'**attrait sensible ou affectif** que l'objet suscite chez le sujet, __que Kant nomme le__ ___."
        answer: "charme"
        alt: []
        explanation: "§13 ; en allemand, Reiz."
      - id: ea3-l2-p13
        sentence: "La même impureté __peut aussi résulter d'une__ ___ suscitée par l'objet, que Kant distingue du charme comme **seconde source d'impureté** au paragraphe 13."
        answer: "émotion"
        alt: []
        explanation: "En allemand, Rührung."
      - id: ea3-l2-p14
        sentence: "Le fait que le **charme et l'émotion** suscités par l'objet puissent entacher la pureté d'un jugement de beauté __est indiqué par Kant en__ ___."
        answer: "§13"
        alt: []
      - id: ea3-l2-p15
        sentence: "La **beauté adhérente** « __suppose le concept de ce qu'une chose__ ___ »."
        answer: "doit être"
        alt: []
        explanation: "§16."
      - id: ea3-l2-p16
        sentence: "La **beauté libre** « __ne présuppose ___ de ce que l'objet doit être__ »."
        answer: "aucun concept"
        alt: []
        explanation: "§16."
      - id: ea3-l2-p17
        sentence: "Juger de la **beauté adhérente** consiste à __comparer la chose avec son concept__ ___, et à apprécier l'écart ou l'accord entre l'objet et sa définition."
        answer: "déterminé préalablement"
        alt: []
      - id: ea3-l2-p18
        sentence: "Le jugement qui porte sur le **degré de perfection** d'une chose n'est pas un jugement esthétique : __c'est un jugement de__ ___."
        answer: "connaissance"
        alt: []
      - id: ea3-l2-p19
        sentence: "Selon Sherringham, **la perfection n'ajoute rien à la beauté**, __et l'absence de celle-ci n'___ rien à la première__."
        answer: "enlève"
        alt: []
      - id: ea3-l2-p20
        sentence: "« Beaucoup d'oiseaux (le perroquet, le colibri, l'oiseau de paradis), une foule de crustacés marins __sont en eux-mêmes des beautés, qui__ ___, mais qui **plaisent librement et pour elles-mêmes**. »"
        answer: "ne se rapportent à aucun objet déterminé quant à sa fin par des concepts"
        alt: []
        explanation: "§16."
      - id: ea3-l2-p21
        sentence: "« Ainsi les dessins à la grecque, __des rinceaux pour des encadrements ou des papiers peints, etc.,__ ___ ; ils ne représentent rien, aucun objet sous un concept déterminé et sont de **libres beautés**. »"
        answer: "ne signifient rien en eux-mêmes"
        alt: []
        explanation: "§16."
      - id: ea3-l2-p22
        sentence: "« On peut encore ranger dans ce genre __tout ce que l'on nomme en musique__ ___ et même toute la **musique sans texte**. »"
        answer: "improvisation (sans thème)"
        alt: ["improvisation"]
        explanation: "§16."
      - id: ea3-l2-p23
        sentence: "Juger une beauté naturelle **en relation avec un concept** (« c'est une belle femme », au sens où la nature réaliserait de belle manière les fins de la constitution féminine), c'est porter un jugement non plus seulement esthétique, __mais aussi__ ___."
        answer: "téléologique"
        alt: []

  - id: ea3-l3
    title: "L'art, le génie et la production du beau"
    notes: |
      Kant attache une importance particulière à la beauté de la nature, mais il consacre aussi un traitement propre à l'art destiné à produire des objets beaux, les {violet}**beaux-arts**{/violet} [{blue}*schöne Kunst*{/blue}] ({sky}§§43–54{/sky}). Il les distingue des {pink}« arts » du simple divertissement{/pink} ({yellow}raconter des histoires drôles, décorer une table, la musique de fond{/yellow}), et exige qu'ils paraissent {green}__libres et non étudiés__{/green} (§45), {coral}comme s'ils étaient de la nature, même quand ils résultent d'un travail{/coral}.

      Kant établit aussi un classement de la valeur esthétique respective des beaux-arts (§53), plaçant la {green}**poésie**{/green} au sommet et la {red}**musique**{/red} tout en bas, du moins pour ce qui concerne la « culture de l'esprit ».

      Le plus intéressant, pour Kant, est la question de savoir {amber}comment un objet d'art beau peut être produit{/amber} ({sky}§§46–50{/sky}). Un {red}**paradoxe**{/red} s'y loge : {amber}aucune règle ne peut être spécifiée pour déterminer à l'avance ce qui sera beau{/amber} (voir le second moment), et pourtant {teal}« {/teal}tout art {teal}présuppose des règles »{/teal} (§46). Kant résout ce paradoxe en postulant une capacité qu'il nomme le {violet}**génie**{/violet}, par laquelle {teal}« {/teal}la {teal}nature donne la règle à l'art »{/teal} : l'artiste dispose d'une {green}**capacité naturelle**{/green} à produire des objets beaux {coral}sans suivre consciemment des règles{/coral}, et {coral}sans pouvoir lui-même expliquer comment il y parvient{/coral}.

      ! Le {violet}génie{/violet}, chez Kant, {red}ne se confond pas avec la **brillance intellectuelle**{/red} (§47) : {yellow}Newton{/yellow}, malgré toute sa puissance intellectuelle, n'est pas un génie en ce sens précis, car {coral}il pouvait rendre entièrement claires les procédures par lesquelles il parvenait à ses découvertes{/coral}.
    points:
      - id: ea3-l3-p1
        sentence: "Kant réserve, à côté de la beauté de la nature à laquelle il attache une importance particulière, un traitement propre à **l'art destiné à produire des objets beaux**, __qu'il nomme les__ ___."
        answer: "beaux-arts"
        alt: []
      - id: ea3-l3-p2
        sentence: "Cette expression, « **beaux-arts** » ou « art beau », __s'écrit dans le texte allemand de Kant__ ___."
        answer: "schöne Kunst"
        alt: []
      - id: ea3-l3-p3
        sentence: "Kant exige que l'art beau, pour être apprécié comme tel, __doive nous paraître comme de la__ ___, c'est-à-dire sembler **libre et non étudié**, même s'il résulte d'un travail."
        answer: "nature"
        alt: []
        explanation: "§45."
      - id: ea3-l3-p4
        sentence: "L'exigence que l'art beau nous **paraisse comme de la nature**, libre et non étudié, __est formulée par Kant en__ ___."
        answer: "§45"
        alt: []
      - id: ea3-l3-p5
        sentence: "Dans sa comparaison de la valeur esthétique respective des beaux-arts, __Kant place la ___ au sommet__, et la **musique tout en bas**, du moins pour ce qui concerne la « culture de l'esprit »."
        answer: "poésie"
        alt: []
        explanation: "§53."
      - id: ea3-l3-p6
        sentence: "Le **classement de la valeur esthétique respective des beaux-arts**, plaçant la poésie au sommet et la musique tout en bas, __se trouve en__ ___."
        answer: "§53"
        alt: []
      - id: ea3-l3-p7
        sentence: "Kant relève un paradoxe apparent dans la production de l'art beau : **aucune règle ne peut être spécifiée à l'avance** pour déterminer ce qui sera beau, et pourtant, dit-il, « __tout art présuppose des__ ___ »."
        answer: "règles"
        alt: []
        explanation: "§46, Ak. 5:307."
      - id: ea3-l3-p8
        sentence: "Kant résout ce paradoxe d'un art sans règle spécifiable mais présupposant des règles __en postulant une capacité qu'il nomme le__ ___, par laquelle « **la nature donne la règle à l'art** »."
        answer: "génie"
        alt: []
        explanation: "§46, Ak. 5:307."
      - id: ea3-l3-p9
        sentence: "Le paradoxe d'un art qui présuppose des règles sans qu'aucune règle puisse être spécifiée à l'avance pour déterminer ce qui sera beau, résolu par Kant à l'aide du concept de **génie**, __est exposé en__ ___."
        answer: "§46"
        alt: []
      - id: ea3-l3-p10
        sentence: "Un artiste doté de génie possède une capacité naturelle à produire des objets jugés beaux **sans avoir à suivre consciemment des règles** pour cela : l'artiste lui-même, selon Kant, __ne sait pas, et ne peut donc pas__ ___, comment il est parvenu à les produire."
        answer: "l'expliquer"
        alt: ["expliquer"]
      - id: ea3-l3-p11
        sentence: "Kant précise que le génie ne se confond pas avec la **brillance intellectuelle** : ___, malgré toute sa puissance intellectuelle, __ne qualifie pas comme génie selon Kant__, car il pouvait rendre entièrement claires, à lui-même comme à autrui, les procédures par lesquelles il parvenait à ses découvertes scientifiques."
        answer: "Newton"
        alt: []
        explanation: "§47, Ak. 5:308–309."
      - id: ea3-l3-p12
        sentence: "La précision selon laquelle le génie ne se confond pas avec la brillance intellectuelle, illustrée par le **contre-exemple de Newton**, __se trouve en__ ___."
        answer: "§47"
        alt: []

  - id: ea3-l4
    title: "Les idées esthétiques"
    notes: |
      Kant décrit la beauté comme la {violet}**présentation**{/violet} [{blue}*Darstellung*{/blue}], ou l'expression, des {violet}__idées esthétiques__{/violet} (§49). Il définit une idée esthétique comme {amber}une représentation de l'imagination qui donne à penser beaucoup{/amber}, {amber}sans qu'aucun **concept déterminé** ne puisse lui être adéquat{/amber}.

      Ces idées esthétiques sont le pendant des {violet}idées __rationnelles__{/violet} : ces représentations qui {amber}ne peuvent être exemplifiées ni dans l'expérience, ni par l'imagination{/amber}. Une œuvre d'art exprime ou exhibe une idée {violet}esthétique{/violet} dans la mesure où {coral}elle réussit à donner une **forme sensible** à une idée rationnelle{/coral}.

      *Exemple donné par Kant lui-même : le {yellow}poète{/yellow} ose rendre sensibles des idées rationnelles d'êtres invisibles ({yellow}le royaume des bienheureux, le royaume de l'enfer, l'éternité, la création{/yellow}), mais aussi rendre sensible, au-delà des limites de l'expérience, ce dont l'expérience offre des exemples : {yellow}la mort, l'envie et toute sorte de vices, mais aussi l'amour, la gloire{/yellow}, etc., {coral}avec une plénitude qui dépasse tout exemple qu'offrirait la nature{/coral}.*
    points:
      - id: ea3-l4-p1
        sentence: "__Kant décrit la beauté comme la__ ___ (ou exhibition) des **idées esthétiques**."
        answer: "présentation"
        alt: []
        explanation: "§49, Ak. 5:314."
      - id: ea3-l4-p2
        sentence: "Ce terme, « **présentation** » ou « exhibition » des idées esthétiques, __s'écrit dans le texte allemand de Kant__ ___."
        answer: "Darstellung"
        alt: []
      - id: ea3-l4-p3
        sentence: "Kant définit une idée esthétique comme une représentation de l'imagination qui **donne à penser beaucoup**, __sans qu'aucune pensée déterminée, c'est-à-dire aucun ___, ne puisse lui être adéquate__."
        answer: "concept"
        alt: []
        explanation: "§49, Ak. 5:314."
      - id: ea3-l4-p4
