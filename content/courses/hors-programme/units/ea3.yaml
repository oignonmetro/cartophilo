id: ea3
title: "Beauté libre, beauté adhérente, génie et art"
subtitle: "Critiques du jugement de goût, pureté de la beauté, et théorie kantienne de l'art"
icon: palette
color: violet
group: "L'esthétique de Kant"
lessons:
  - id: ea3-l1
    title: "Critiques adressées au jugement de goût"
    notes: |
      Au-delà des critiques déjà adressées à la déduction du jugement de
      goût, plusieurs objections visent la caractérisation même du jugement
      de beauté donnée dans l'Analytique du beau, en particulier son
      désintéressement, et ce que les commentateurs appellent le
      **formalisme** de Kant : la thèse selon laquelle seul l'agencement
      formel abstrait de l'objet compterait pour l'appréciation esthétique.

      Ce formalisme a exercé une influence marquée en théorie musicale, par
      l'intermédiaire du critique Hanslick. Mais il faut noter un contraste
      interne à l'ouvrage : si l'Analytique du beau penche vers le
      formalisme, le traitement kantien des idées esthétiques (voir la leçon
      suivante) se prête mieux à une lecture *expressiviste* de l'art.

      Plusieurs critiques visent le {teal}désintéressement{/teal} :
      - on prend bel et bien un intérêt à la **préservation** des objets
        beaux (Crawford).
      - le désintéressement impliquerait une exigence de « **distance
        psychique** » envers l'objet, critique rattachée au « **mythe de
        l'attitude esthétique** » de Dickie, que Zangwill juge mal fondée.

      D'autres critiques visent le {teal}non-conceptualisme{/teal} du
      plaisir esthétique :
      - il impliquerait, de façon peu défendable, qu'un **esprit vidé de
        tout contenu conceptuel** serait le mieux placé pour apprécier la
        beauté (Wollheim, critique traitée par Janaway).
      - il ne laisserait aucune place à l'**échange de raisons** en critique
        d'art (objection à laquelle répond Crawford dès 1970).

      Enfin, Baz reproche à Kant de faire résider la valeur de la beauté
      dans sa relation à la **connaissance** plutôt que dans le fait que
      l'objet beau **importe pour lui-même**.
    points:
      - id: ea3-l1-p1
        sentence: "Les commentateurs nomment ___ la thèse, prêtée à Kant, selon laquelle seul l'agencement formel abstrait de l'objet (la façon dont ses éléments s'organisent dans l'espace ou le temps) compterait pour l'appréciation esthétique."
        answer: "formalisme"
        alt: []
      - id: ea3-l1-p2
        sentence: "Le formalisme esthétique de Kant a exercé une influence particulièrement marquée en théorie musicale, par l'intermédiaire du critique ___."
        answer: "Hanslick"
        alt: []
      - id: ea3-l1-p3
        sentence: "Si l'Analytique du beau défend une position plutôt formaliste, le traitement kantien des idées esthétiques se prête au contraire mieux à une lecture ___ de l'art."
        answer: "expressiviste"
        alt: []
      - id: ea3-l1-p4
        sentence: "Une objection typique à la thèse du désintéressement du plaisir esthétique, formulée par exemple par Crawford, souligne le fait, apparemment évident, que nous prenons bel et bien un intérêt à la ___ des objets beaux."
        answer: "préservation"
        alt: []
        explanation: "Crawford 1974: 53."
      - id: ea3-l1-p5
        sentence: "La thèse du désintéressement est également tenue pour responsable d'une exigence de « distance psychique » envers l'objet apprécié : une critique généralement rattachée à la discussion célèbre du « mythe de l'attitude esthétique » due à ___."
        answer: "Dickie"
        alt: []
        explanation: "Dickie 1964."
      - id: ea3-l1-p6
        sentence: "___ soutient que cette critique de Kant par le biais de la « distance psychique », rattachée à Dickie, repose sur un malentendu, et la juge mal fondée."
        answer: "Zangwill"
        alt: []
        explanation: "Zangwill 1992."
      - id: ea3-l1-p7
        sentence: "Selon une critique due à ___, la thèse kantienne du caractère non conceptuel du plaisir esthétique impliquerait, de façon peu défendable, qu'un « stock cognitif vide » serait requis pour apprécier la beauté."
        answer: "Wollheim"
        alt: []
        explanation: "Wollheim 1980."
      - id: ea3-l1-p8
        sentence: "Cette critique de Wollheim contre le non-conceptualisme kantien est traitée par ___."
        answer: "Janaway"
        alt: []
        explanation: "Janaway 1997."
      - id: ea3-l1-p9
        sentence: "Face à l'objection selon laquelle l'esthétique kantienne ne laisserait aucune place à l'échange de raisons ni à la critique d'art, Crawford propose une réponse dès l'année ___, reprise ensuite sur des lignes similaires par Wilson en 2007."
        answer: "1970"
        alt: []
      - id: ea3-l1-p10
        sentence: "___ reproche à Kant de faire résider la valeur de la beauté dans sa relation à la connaissance, plutôt que dans le fait que l'objet beau importe pour lui-même."
        answer: "Baz"
        alt: []
        explanation: "Baz 2005 ; une réponse est offerte par Hughes 2006."

  - id: ea3-l2
    title: "Beauté libre et beauté adhérente"
    notes: |
      Un jugement de beauté peut perdre sa **pureté** de deux façons :
      - en étant influencé par le **charme** [`Reiz`] ou l'**émotion**
        [`Rührung`] de l'objet (§13) ;
      - en devenant contingent à l'application d'un **concept** : l'objet
        n'est alors plus jugé beau absolument, mais beau *en tant
        qu'appartenant* à tel ou tel genre.

      Ce second cas donne lieu, au §16, à la distinction entre beauté
      __libre__ [`frei`] et beauté __adhérente__ ou dépendante [`anhängend`].
      Kant ne donne que des exemples d'art non représentatif pour la
      {sky}beauté libre{/sky} : dessins à la grecque, motifs de bordure ou
      de papier peint, musique sans texte.

      ! Cette suggestion (que tout art représentatif relèverait de la
      {sky}beauté adhérente{/sky}, donc impure) inquiète certains
      commentateurs : elle rendrait la théorie kantienne du beau largement
      étrangère à l'art, et laisserait entendre qu'un papier peint serait
      esthétiquement supérieur au plafond de la chapelle Sixtine.

      Deux réponses s'y opposent :
      - Allison soutient qu'un jugement de {sky}beauté adhérente{/sky}
        *contient* un jugement de beauté pur comme composante, dont la
        pureté n'est pas compromise par son insertion dans une évaluation
        plus complexe.
      - Schaper et Guyer contestent directement l'idée que l'art non
        représentatif serait supérieur à l'art représentatif.
      - Tuna va plus loin en soutenant que les œuvres issues du génie
        peuvent être des beautés libres, et non adhérentes.
    points:
      - id: ea3-l2-p1
        sentence: "Un jugement de beauté peut d'abord perdre sa pureté en étant influencé par le charme que suscite l'objet ; Kant nomme ce charme, en allemand, ___."
        answer: "Reiz"
        alt: []
        explanation: "§13."
      - id: ea3-l2-p2
        sentence: "L'émotion qui peut, elle aussi, entacher la pureté d'un jugement de beauté porte, en allemand, le nom de ___."
        answer: "Rührung"
        alt: []
      - id: ea3-l2-p3
        sentence: "Un jugement de beauté peut aussi perdre sa pureté en devenant contingent à l'application d'un concept, de sorte que l'objet n'est plus jugé beau absolument mais beau en tant qu'appartenant à tel ou tel genre : Kant appelle beauté ___ ce second type de beauté impure, par opposition à la beauté libre."
        answer: "adhérente"
        alt: ["dépendante"]
        explanation: "§16."
      - id: ea3-l2-p4
        sentence: "Cette beauté adhérente, ou dépendante, porte en allemand le nom de ___."
        answer: "anhängend"
        alt: []
      - id: ea3-l2-p5
        sentence: "Par opposition à la beauté adhérente, la beauté qui n'est contingente à l'application d'aucun concept est nommée beauté ___ par Kant."
        answer: "libre"
        alt: []
      - id: ea3-l2-p6
        sentence: "Cette beauté libre porte, en allemand, le nom de ___."
        answer: "frei"
        alt: []
      - id: ea3-l2-p7
        sentence: "Kant ne donne que des exemples d'art non représentatif pour illustrer la beauté libre en art : les dessins à la grecque, les motifs de bordure ou de papier peint, et surtout la musique ___, c'est-à-dire sans paroles."
        answer: "sans texte"
        alt: []
        explanation: "§16, Ak. 5:229."
      - id: ea3-l2-p8
        sentence: "___ conteste l'idée que tout jugement portant sur une œuvre représentative relève nécessairement de la beauté adhérente, en soutenant que les œuvres issues du génie peuvent au contraire compter comme des beautés libres."
        answer: "Tuna"
        alt: []
        explanation: "Tuna 2018."
      - id: ea3-l2-p9
        sentence: "___ répond à l'objection que la distinction rendrait l'esthétique kantienne largement étrangère à l'art en soutenant qu'un jugement de beauté adhérente contient, comme composante, un jugement de beauté pur, dont la pureté n'est pas compromise par son insertion dans une évaluation plus complexe."
        answer: "Allison"
        alt: []
        explanation: "Allison 2001: 140–141."
      - id: ea3-l2-p10
        sentence: "L'objection selon laquelle la distinction ferait du papier peint un art esthétiquement supérieur au plafond de la chapelle ___ est contestée notamment par Schaper et par Guyer."
        answer: "Sixtine"
        alt: []
        explanation: "Guyer 2005b, chs. 4 et 5."
      - id: ea3-l2-p11
        sentence: "La première façon, pour un jugement de beauté, de perdre sa pureté consiste à être influencé par l'attrait sensible ou affectif que l'objet suscite chez le sujet, que Kant nomme le ___."
        answer: "charme"
        alt: []
        explanation: "§13 ; en allemand, Reiz."
      - id: ea3-l2-p12
        sentence: "La même impureté peut aussi résulter d'une ___ suscitée par l'objet, que Kant distingue du charme comme seconde source d'impureté au paragraphe 13."
        answer: "émotion"
        alt: []
        explanation: "En allemand, Rührung."

  - id: ea3-l3
    title: "L'art, le génie et la production du beau"
    notes: |
      Kant attache une importance particulière à la beauté de la nature,
      mais il consacre aussi un traitement propre à l'art destiné à produire
      des objets beaux, les **beaux-arts** [`schöne Kunst`] (§§43–54). Il les
      distingue des « arts » du simple divertissement (raconter des
      histoires drôles, décorer une table, la musique de fond), et exige
      qu'ils paraissent __libres et non étudiés__, comme s'ils étaient de la
      nature, même quand ils résultent d'un travail.

      Kant établit aussi un classement de la valeur esthétique respective
      des beaux-arts, plaçant la **poésie** au sommet et la **musique** tout
      en bas, du moins pour ce qui concerne la « culture de l'esprit ».

      Le plus intéressant, pour Kant, est la question de savoir comment un
      objet d'art beau peut être produit (§§46–50). Un **paradoxe** s'y
      loge : aucune règle ne peut être spécifiée pour déterminer à l'avance
      ce qui sera beau (voir le second moment), et pourtant « tout art
      présuppose des règles ». Kant résout ce paradoxe en postulant une
      capacité qu'il nomme le {teal}**génie**{/teal}, par laquelle « la
      nature donne la règle à l'art » : l'artiste dispose d'une **capacité
      naturelle** à produire des objets beaux sans suivre consciemment des
      règles, et sans pouvoir lui-même expliquer comment il y parvient.

      ! Le {teal}génie{/teal}, chez Kant, ne se confond pas avec la
      **brillance intellectuelle** : Newton, malgré toute sa puissance
      intellectuelle, n'est pas un génie en ce sens précis, car il pouvait
      rendre entièrement claires les procédures par lesquelles il parvenait
      à ses découvertes.
    points:
      - id: ea3-l3-p1
        sentence: "Kant réserve, à côté de la beauté de la nature à laquelle il attache une importance particulière, un traitement propre à l'art destiné à produire des objets beaux, qu'il nomme les ___."
        answer: "beaux-arts"
        alt: []
      - id: ea3-l3-p2
        sentence: "Cette expression, « beaux-arts » ou « art beau », s'écrit dans le texte allemand de Kant ___."
        answer: "schöne Kunst"
        alt: []
      - id: ea3-l3-p3
        sentence: "Kant exige que l'art beau, pour être apprécié comme tel, doive nous paraître comme de la ___, c'est-à-dire sembler libre et non étudié, même s'il résulte d'un travail."
        answer: "nature"
        alt: []
        explanation: "§45."
      - id: ea3-l3-p4
        sentence: "Dans sa comparaison de la valeur esthétique respective des beaux-arts, Kant place la ___ au sommet, et la musique tout en bas, du moins pour ce qui concerne la « culture de l'esprit »."
        answer: "poésie"
        alt: []
        explanation: "§53."
      - id: ea3-l3-p5
        sentence: "Kant relève un paradoxe apparent dans la production de l'art beau : aucune règle ne peut être spécifiée à l'avance pour déterminer ce qui sera beau, et pourtant, dit-il, « tout art présuppose des ___ »."
        answer: "règles"
        alt: []
        explanation: "§46, Ak. 5:307."
      - id: ea3-l3-p6
        sentence: "Kant résout ce paradoxe d'un art sans règle spécifiable mais présupposant des règles en postulant une capacité qu'il nomme le ___, par laquelle « la nature donne la règle à l'art »."
        answer: "génie"
        alt: []
        explanation: "§46, Ak. 5:307."
      - id: ea3-l3-p7
        sentence: "Un artiste doté de génie possède une capacité naturelle à produire des objets jugés beaux sans avoir à suivre consciemment des règles pour cela : l'artiste lui-même, selon Kant, ne sait pas, et ne peut donc pas ___, comment il est parvenu à les produire."
        answer: "l'expliquer"
        alt: ["expliquer"]
      - id: ea3-l3-p8
        sentence: "Kant précise que le génie ne se confond pas avec la brillance intellectuelle : ___, malgré toute sa puissance intellectuelle, ne qualifie pas comme génie selon Kant, car il pouvait rendre entièrement claires, à lui-même comme à autrui, les procédures par lesquelles il parvenait à ses découvertes scientifiques."
        answer: "Newton"
        alt: []
        explanation: "§47, Ak. 5:308–309."

  - id: ea3-l4
    title: "Les idées esthétiques"
    notes: |
      Kant décrit la beauté comme la **présentation** [`Darstellung`], ou
      l'expression, des __idées esthétiques__. Il définit une idée
      esthétique comme une représentation de l'imagination qui donne à
      penser beaucoup, sans qu'aucun **concept déterminé** ne puisse lui
      être adéquat.

      Ces idées esthétiques sont le pendant des idées __rationnelles__ :
      ces représentations qui ne peuvent être exemplifiées ni dans
      l'expérience, ni par l'imagination. Une œuvre d'art exprime ou exhibe
      une idée {teal}esthétique{/teal} dans la mesure où elle réussit à
      donner une **forme sensible** à une idée {teal}rationnelle{/teal}.

      *Exemple donné par Kant lui-même : le poète ose rendre sensibles des
      idées rationnelles d'êtres invisibles (le royaume des bienheureux, le
      royaume de l'enfer, l'éternité, la création), mais aussi rendre
      sensible, au-delà des limites de l'expérience, ce dont l'expérience
      offre des exemples : la mort, l'envie et toute sorte de vices, mais
      aussi l'amour, la gloire, etc., avec une plénitude qui dépasse tout
      exemple qu'offrirait la nature.*
    points:
      - id: ea3-l4-p1
        sentence: "Kant décrit la beauté comme la ___ (ou exhibition) des idées esthétiques."
        answer: "présentation"
        alt: []
        explanation: "§49, Ak. 5:314."
      - id: ea3-l4-p2
        sentence: "Ce terme, « présentation » ou « exhibition » des idées esthétiques, s'écrit dans le texte allemand de Kant ___."
        answer: "Darstellung"
        alt: []
      - id: ea3-l4-p3
        sentence: "Kant définit une idée esthétique comme une représentation de l'imagination qui donne à penser beaucoup, sans qu'aucune pensée déterminée, c'est-à-dire aucun ___, ne puisse lui être adéquate."
        answer: "concept"
        alt: []
        explanation: "§49, Ak. 5:314."
      - id: ea3-l4-p4
        sentence: "Les idées esthétiques sont décrites par Kant comme le pendant des idées ___, ces représentations qui ne peuvent être exemplifiées ni dans l'expérience ni par l'imagination."
        answer: "rationnelles"
        alt: []
      - id: ea3-l4-p5
        sentence: "Une œuvre d'art exprime ou exhibe une idée esthétique dans la mesure où elle réussit à donner une forme sensible à une idée ___."
        answer: "rationnelle"
        alt: []
      - id: ea3-l4-p6
        sentence: "Kant illustre les idées esthétiques par l'exemple du poète, qui ose rendre sensibles des idées rationnelles d'êtres invisibles (le royaume des bienheureux, le royaume de l'enfer, l'éternité, la ___), mais aussi rendre sensible, au-delà des limites de l'expérience, ce dont l'expérience offre des exemples : la mort, l'envie et toute sorte de vices, mais aussi l'amour, la gloire, etc., avec une plénitude qui dépasse tout exemple qu'offrirait la nature."
        answer: "création"
