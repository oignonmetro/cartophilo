  - id: ea3-l3c
    title: "L'art doit paraître nature (§45)"
    notes: |
      Le **§45** s'intitule : « Les beaux-arts ne sont de l'art que pour autant qu'ils ont en même temps l'apparence de la nature ». Kant y bouleverse la théorie classique de l'imitation, pour laquelle l'art est la copie d'une nature modèle.

      D'abord, il part de la **différence** : « En face d'un produit des beaux-arts on doit prendre conscience que c'est là une production de l'art et non de la nature. » Ce n'est pas faiblesse de l'art que de ne pas aboutir à l'identité des indiscernables : la bonne imitation maintient la différence dans la position de la ressemblance (Sherringham).

      Ensuite, la relation s'inverse : l'art est à la fois copie et modèle par rapport à la nature, et la nature tantôt modèle, tantôt copie. « La nature était belle lorsqu'en même temps elle avait l'apparence de l'art ; et l'art ne peut être dit beau que lorsque [...] celui-ci nous apparaît cependant en tant que nature. »

      Enfin, « dans le produit des beaux-arts, la finalité, bien qu'elle soit assurément intentionnelle, ne doit pourtant pas paraître intentionnelle ; je veux dire que chacun des beaux-arts doit apparaître comme nature, bien que l'on ait conscience qu'il s'agisse d'art ». La finalité doit y sembler libre de toute règle arbitraire : la **ponctualité** dans l'accord avec les règles, sans l'**impression d'effort**, cette « trace manifestant que la règle était présente sous les yeux de l'artiste ».

      | | Finalité sans fin | Fin sans finalité |
      | Selon Sherringham | un processus d'organisation de moyens qui aboutit à un résultat sans intention préalable ni représentation d'une fin | un résultat qui suppose un agencement intentionnel de moyens dont on sait qu'il n'a aucune existence objective |

      D'où une **symétrie inversée** : l'art est une intention qui se donne l'apparence de ne pas être intentionnelle ; la belle nature, une absence d'intention qui donne l'apparence d'être intentionnelle.

      ! « Apparaître comme nature » ne veut pas dire tromper : on doit avoir conscience que c'est de l'art.
    points:
