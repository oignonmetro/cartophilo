  - id: ea3-l3
    title: "L'art, le génie et la production du beau"
    notes: |
      Kant attache une importance particulière à la beauté de la nature,
      mais il consacre aussi un traitement propre à l'art destiné à produire
      des objets beaux, les **beaux-arts** [`schöne Kunst`] (§§43–54). Il les
      distingue des « arts » du simple divertissement (raconter des
      histoires drôles, décorer une table, la musique de fond), et exige
      qu'ils paraissent __libres et non étudiés__ (§45), comme s'ils
      étaient de la nature, même quand ils résultent d'un travail.

      Kant établit aussi un classement de la valeur esthétique respective
      des beaux-arts (§53), plaçant la **poésie** au sommet et la
      **musique** tout en bas, du moins pour ce qui concerne la « culture
      de l'esprit ».

      Le plus intéressant, pour Kant, est la question de savoir comment un
      objet d'art beau peut être produit (§§46–50). Un **paradoxe** s'y
      loge : aucune règle ne peut être spécifiée pour déterminer à l'avance
      ce qui sera beau (voir le second moment), et pourtant « tout art
      présuppose des règles » (§46). Kant résout ce paradoxe en postulant
      une capacité qu'il nomme le {teal}**génie**{/teal}, par laquelle « la
      nature donne la règle à l'art » : l'artiste dispose d'une **capacité
      naturelle** à produire des objets beaux sans suivre consciemment des
      règles, et sans pouvoir lui-même expliquer comment il y parvient.

      ! Le {teal}génie{/teal}, chez Kant, ne se confond pas avec la
      **brillance intellectuelle** (§47) : Newton, malgré toute sa
      puissance intellectuelle, n'est pas un génie en ce sens précis, car il
      pouvait rendre entièrement claires les procédures par lesquelles il
      parvenait à ses découvertes.
    points:
      - id: ea3-l3-p1
        sentence: "Kant réserve, à côté de la beauté de la nature à laquelle il attache une importance particulière, un traitement propre à l'art destiné à produire des objets beaux, qu'il nomme les ___."
        answer: "beaux-arts"
        alt: []
      - id: ea3-l3-p2
        sentence: "Cette expression, « beaux-arts » ou « art beau », s'écrit dans le texte allemand de Kant ___."
        answer: "schöne Kunst"
        alt: []
      - id: ea3-l3-p3
