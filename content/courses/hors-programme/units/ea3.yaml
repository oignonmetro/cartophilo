id: ea3
title: "Beauté libre, beauté adhérente, génie et art"
subtitle: "Critiques du jugement de goût, pureté de la beauté, et théorie kantienne de l'art"
icon: palette
color: violet
group: "Kant : l'esthétique"
lessons:
  - id: ea3-l1
    title: "Critiques adressées au jugement de goût"
    notes: |
      Au-delà des critiques déjà adressées à la déduction du jugement de
      goût, plusieurs objections visent la caractérisation même du jugement
      de beauté donnée dans l'Analytique du beau, en particulier son
      désintéressement, et ce que les commentateurs appellent le
      **formalisme** de Kant : la thèse selon laquelle seul l'agencement
      formel abstrait de l'objet compterait pour l'appréciation esthétique.

      Ce formalisme a exercé une influence marquée en théorie musicale, par
      l'intermédiaire du critique Hanslick. Mais il faut noter un contraste
      interne à l'ouvrage : si l'Analytique du beau penche vers le
      formalisme, le traitement kantien des idées esthétiques (voir la leçon
      suivante) se prête mieux à une lecture *expressiviste* de l'art.

      Plusieurs critiques visent le {teal}désintéressement{/teal} :
      - on prend bel et bien un intérêt à la **préservation** des objets
        beaux (Crawford).
      - le désintéressement impliquerait une exigence de « **distance
        psychique** » envers l'objet, critique rattachée au « **mythe de
        l'attitude esthétique** » de Dickie, que Zangwill juge mal fondée.

      D'autres critiques visent le {teal}non-conceptualisme{/teal} du
      plaisir esthétique :
      - il impliquerait, de façon peu défendable, qu'un **esprit vidé de
        tout contenu conceptuel** serait le mieux placé pour apprécier la
        beauté (Wollheim, critique traitée par Janaway).
      - il ne laisserait aucune place à l'**échange de raisons** en critique
        d'art (objection à laquelle répond Crawford dès 1970).

      Enfin, Baz reproche à Kant de faire résider la valeur de la beauté
      dans sa relation à la **connaissance** plutôt que dans le fait que
      l'objet beau **importe pour lui-même**.
    points:
      - id: ea3-l1-p1
        sentence: "Les commentateurs nomment ___ la thèse, prêtée à Kant, selon laquelle seul l'agencement formel abstrait de l'objet (la façon dont ses éléments s'organisent dans l'espace ou le temps) compterait pour l'appréciation esthétique."
        answer: "formalisme"
        alt: []
      - id: ea3-l1-p2
        sentence: "Le formalisme esthétique de Kant a exercé une influence particulièrement marquée en théorie musicale, par l'intermédiaire du critique ___."
        answer: "Hanslick"
        alt: []
      - id: ea3-l1-p3
        sentence: "Si l'Analytique du beau défend une position plutôt formaliste, le traitement kantien des idées esthétiques se prête au contraire mieux à une lecture ___ de l'art."
        answer: "expressiviste"
        alt: []
      - id: ea3-l1-p4
        sentence: "Une objection typique à la thèse du désintéressement du plaisir esthétique, formulée par exemple par Crawford, souligne le fait, apparemment évident, que nous prenons bel et bien un intérêt à la ___ des objets beaux."
        answer: "préservation"
        alt: []
        explanation: "Crawford 1974: 53."
      - id: ea3-l1-p5
        sentence: "La thèse du désintéressement est également tenue pour responsable d'une exigence de « distance psychique » envers l'objet apprécié : une critique généralement rattachée à la discussion célèbre du « mythe de l'attitude esthétique » due à ___."
