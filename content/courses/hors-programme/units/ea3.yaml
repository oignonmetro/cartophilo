  - id: ea3-l5
    title: "Débats sur les idées esthétiques et la portée de l'art"
    notes: |
      Plusieurs débats prolongent la théorie kantienne des idées esthétiques
      et de l'art :

      - __Nature ou art, quelle beauté est première ?__ Guyer soutient la
        primauté de la **beauté naturelle** chez Kant, et la défend comme
        justifiée ; Kemal avance à l'inverse des raisons de tenir, malgré
        les apparences, la **beauté artistique** pour première ; Friedlander
        tient qu'aucune des deux n'a de primauté sur l'autre.
      - __Un compte rendu de la beauté, ou deux ?__ Certains commentateurs
        soutiennent que Kant défend en réalité **deux comptes rendus
        distincts** de la beauté, l'un pour la nature, l'autre pour l'art.
      - __Le classement des beaux-arts et la musique.__ Le rang très bas
        accordé à la musique par Kant a parfois été jugé incohérent ;
        Matherne en propose une **défense explicite**.
      - __La beauté de la nature exprime-t-elle, elle aussi, des idées
        esthétiques ?__ Kant l'affirme en passant (§51), bien que les idées
        esthétiques ne soient discutées que dans les sections consacrées à
        l'art. Reiter et Geiger proposent de comprendre cette extension par
        la notion d'« idée esthétique **normale** », introduite au
        troisième moment (§17).
      - __Quels concepts une idée esthétique peut-elle présenter ?__ Contre
        les lectures qui limitent les idées esthétiques à des concepts
        moraux ou rationnels, Matherne soutient qu'elles peuvent aussi
        présenter des **concepts empiriques et des émotions humaines** ;
        Vaccarino Bremner propose un élargissement différent, selon lequel
        les idées esthétiques ne se contentent pas de présenter des
        concepts, mais nous appellent à les **réviser**.
      - __Portée contemporaine.__ Costello soutient que la théorie kantienne
        de l'esthétique s'applique aussi à l'**art conceptuel**.
    points:
      - id: ea3-l5-p1
        sentence: "___ soutient que Kant est engagé envers la primauté de la beauté naturelle sur la beauté artistique, et défend cet engagement comme justifié."
        answer: "Guyer"
        alt: []
        explanation: "Guyer 1987."
      - id: ea3-l5-p2
        sentence: "À l'inverse, ___ avance des raisons de tenir, malgré les apparences, la beauté artistique pour première chez Kant."
        answer: "Kemal"
        alt: []
        explanation: "Kemal 1986."
      - id: ea3-l5-p3
        sentence: "___ soutient une troisième position dans ce débat : ni la beauté naturelle ni la beauté artistique n'aurait de primauté sur l'autre chez Kant."
        answer: "Friedlander"
        alt: []
        explanation: "Friedlander 2015, ch. 3."
      - id: ea3-l5-p4
        sentence: "Une autre question débattue est de savoir si Kant défend un unique compte rendu de la beauté valant pour la nature et pour l'art, ou s'il en défend en réalité ___, l'un pour la nature et l'autre pour l'art."
        answer: "deux"
        alt: []
        explanation: "Reiter et Geiger 2018 ; Halper 2020, sur des bases différentes."
      - id: ea3-l5-p5
        sentence: "Bien que les vues de Kant sur la musique, classée au bas de son classement des beaux-arts, aient parfois été jugées incohérentes, Matherne en propose une défense ___."
        answer: "explicite"
        alt: []
        explanation: "Matherne 2014."
      - id: ea3-l5-p6
        sentence: "Pour comprendre comment la nature, et non seulement l'art, peut exprimer des idées esthétiques, Reiter et Geiger proposent de s'appuyer sur la notion d'« idée esthétique ___ », introduite par Kant au troisième moment."
        answer: "normale"
        alt: []
        explanation: "§17, Ak. 5:233."
      - id: ea3-l5-p7
        sentence: "___ conteste les lectures qui limitent les idées esthétiques à la présentation de concepts moraux ou rationnels, en soutenant qu'elles peuvent aussi présenter des concepts empiriques et des émotions humaines."
        answer: "Matherne"
        alt: []
        explanation: "Matherne 2013."
      - id: ea3-l5-p8
        sentence: "Plutôt que d'élargir seulement les concepts que les idées esthétiques peuvent présenter, ___ soutient qu'elles ne se contentent pas de présenter ou d'exprimer des concepts, mais nous appellent à les réviser."
        answer: "Vaccarino Bremner"
        alt: []
