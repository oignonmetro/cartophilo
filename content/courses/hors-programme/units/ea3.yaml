  - id: ea3-l4
    title: "Les idées esthétiques"
    notes: |
      Kant décrit la beauté comme la **présentation** [`Darstellung`], ou
      l'expression, des __idées esthétiques__ (§49). Il définit une idée
      esthétique comme une représentation de l'imagination qui donne à
      penser beaucoup, sans qu'aucun **concept déterminé** ne puisse lui
      être adéquat.

      Ces idées esthétiques sont le pendant des idées __rationnelles__ :
      ces représentations qui ne peuvent être exemplifiées ni dans
      l'expérience, ni par l'imagination. Une œuvre d'art exprime ou exhibe
      une idée {teal}esthétique{/teal} dans la mesure où elle réussit à
      donner une **forme sensible** à une idée {teal}rationnelle{/teal}.

      *Exemple donné par Kant lui-même : le poète ose rendre sensibles des
