  - id: ea3-l3e
    title: "Génie, école et imitation (§§47-50)"
    notes: |
      En raison de son innéisme, le don du génie n'est pas **perfectible**. Ce qui sépare le « puissant cerveau » (le génie scientifique, comme Newton) de l'apprenti savant est une différence de **degré** ; ce qui sépare le génie de son imitateur, une différence de **nature**.

      Le génie n'exclut pourtant pas l'école. Sans la conception d'une fin, l'œuvre « serait un simple produit du hasard » ; et « il n'y a cependant pas un seul des beaux-arts où quelque chose de mécanique [...] ne constitue la dimension essentielle de l'art » : la forme exige « un talent façonné par l'école » (§47).

      | Face au génie | Ce qu'il en reprend |
      | le **disciple scolaire** | la seule forme externe, la technique et l'usage : il maniérise le style du génie |
      | le **disciple génial** | la technique, pour un autre usage : il trouve son propre langage |

      L'imitation servile, qui reproduit jusqu'aux défauts tolérables chez le génie, est la **singerie** ; viser l'originalité sans génie, c'est le **maniérisme**, où la manière devient une fin en soi. Le génie sans goût est la puissance créatrice sans maîtrise formelle ; le goût sans génie, la forme plaisante sans vision. D'où la définition finale du génie : « l'originalité exemplaire des dons naturels d'un sujet dans le libre usage de ses pouvoirs de connaître » (§49).
