  - id: ea3-l3b
    title: "Art mécanique, arts d'agrément et beaux-arts (§44)"
    notes: |
      Au **§44**, Kant introduit deux oppositions. D'abord, dans l'art, l'**art mécanique** et l'**art esthétique** : « Si l'art qui correspond à la connaissance d'un objet possible se borne à accomplir les actions nécessaires afin de le réaliser, il s'agit d'un art mécanique » ; l'art esthétique, lui, « a pour fin immédiate le sentiment de plaisir ».

      Ensuite, dans l'art esthétique, deux espèces :

      | | Arts d'agrément | Beaux-arts |
      | Plaisir | sensuel : la jouissance | spirituel : la réflexion |
      | Définition | « ceux dont la jouissance est le seul but » | « un mode de représentation qui présente en lui-même un caractère finalisé et qui, bien que sans fin, contribue pourtant à la culture des facultés de l'esprit en vue de la communication sociale » |

      Les arts d'agrément (l'art de dresser la table, la musique de table) facilitent la conversation sans lui donner de contenu. Le plaisir des beaux-arts n'est pas issu de la connaissance de l'objet : il accompagne l'activité libre des facultés de connaissance, sans aboutir à un quelconque savoir. Les beaux-arts ont pour fin le pur plaisir esthétique, sans désir (exit la morale, la politique ou la religion) et sans connaissance (exit la science). D'où : « Il n'y a pas de science du beau », car un jugement sur la beauté qui appartiendrait à la science ne serait plus un jugement de goût.

      ! Le travail artistique ne doit pas trop se voir : l'œuvre plairait alors non comme art du beau, mais comme art mécanique.
