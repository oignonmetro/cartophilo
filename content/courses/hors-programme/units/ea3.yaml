  - id: ea3-l5
    title: "Débats sur les idées esthétiques et la portée de l'art"
    notes: |
      Plusieurs débats prolongent la théorie kantienne des idées esthétiques et de l'art :

      - {amber}__Nature ou art, quelle beauté est première ?__{/amber} {sky}Guyer{/sky} soutient la primauté de la {green}**beauté naturelle**{/green} chez Kant, et la défend comme justifiée ; {sky}Kemal{/sky} avance à l'inverse des raisons de tenir, malgré les apparences, la {pink}**beauté artistique**{/pink} pour première ; {sky}Friedlander{/sky} tient qu'{coral}aucune des deux n'a de primauté sur l'autre{/coral}.
      - {amber}__Un compte rendu de la beauté, ou deux ?__{/amber} Certains commentateurs soutiennent que Kant défend en réalité {coral}**deux comptes rendus distincts**{/coral} de la beauté, l'un pour la nature, l'autre pour l'art.
      - {amber}__Le classement des beaux-arts et la musique.__{/amber} Le rang très bas accordé à la musique par Kant a parfois été {red}jugé incohérent{/red} ; {sky}Matherne{/sky} en propose une {green}**défense explicite**{/green}.
      - {amber}__La beauté de la nature exprime-t-elle, elle aussi, des idées esthétiques ?__{/amber} Kant l'affirme en passant (§51), bien que les idées esthétiques ne soient discutées que dans les sections consacrées à l'art. {sky}Reiter{/sky} et {sky}Geiger{/sky} proposent de comprendre cette extension par la notion d'« {violet}idée esthétique **normale**{/violet} », introduite au troisième moment (§17).
      - {amber}__Quels concepts une idée esthétique peut-elle présenter ?__{/amber} Contre les lectures qui {pink}limitent les idées esthétiques à des concepts moraux ou rationnels{/pink}, {sky}Matherne{/sky} soutient qu'elles peuvent aussi présenter des {green}**concepts empiriques et des émotions humaines**{/green} ; {sky}Vaccarino Bremner{/sky} propose un élargissement différent, selon lequel les idées esthétiques ne se contentent pas de présenter des concepts, mais {coral}nous appellent à les **réviser**{/coral}.
      - {amber}__Portée contemporaine.__{/amber} {sky}Costello{/sky} soutient que la théorie kantienne de l'esthétique s'applique aussi à l'{yellow}**art conceptuel**{/yellow}.
    points:
      - id: ea3-l5-p1
        sentence: "___ __soutient que Kant est engagé envers la primauté de la **beauté naturelle**__ sur la beauté artistique, et défend cet engagement comme justifié."
        answer: "Guyer"
        alt: []
        explanation: "Guyer 1987."
      - id: ea3-l5-p2
        sentence: "À l'inverse, ___ __avance des raisons de tenir, malgré les apparences, la **beauté artistique** pour première__ chez Kant."
        answer: "Kemal"
        alt: []
        explanation: "Kemal 1986."
      - id: ea3-l5-p3
        sentence: "___ __soutient une troisième position dans ce débat__ : **ni la beauté naturelle ni la beauté artistique** n'aurait de primauté sur l'autre chez Kant."
        answer: "Friedlander"
        alt: []
        explanation: "Friedlander 2015, ch. 3."
      - id: ea3-l5-p4
        sentence: "Une autre question débattue est de savoir si Kant défend un **unique compte rendu de la beauté** valant pour la nature et pour l'art, __ou s'il en défend en réalité__ ___, l'un pour la nature et l'autre pour l'art."
        answer: "deux"
        alt: []
        explanation: "Reiter et Geiger 2018 ; Halper 2020, sur des bases différentes."
      - id: ea3-l5-p5
        sentence: "Bien que les vues de Kant sur la **musique**, classée au bas de son classement des beaux-arts, aient parfois été jugées incohérentes, __Matherne en propose une défense__ ___."
        answer: "explicite"
        alt: []
        explanation: "Matherne 2014."
      - id: ea3-l5-p6
        sentence: "Kant affirme en passant que la **beauté de la nature exprime elle aussi des idées esthétiques**, bien que ce thème ne soit discuté que dans les sections consacrées à l'art ; __cette affirmation se trouve en__ ___."
        answer: "§51"
        alt: []
      - id: ea3-l5-p7
        sentence: "Pour comprendre comment **la nature, et non seulement l'art**, peut exprimer des idées esthétiques, __Reiter et Geiger proposent de s'appuyer sur la notion d'« idée esthétique__ ___ », introduite par Kant au troisième des quatre moments du jugement de beauté."
        answer: "normale"
        alt: []
        explanation: "§17, Ak. 5:233."
      - id: ea3-l5-p8
        sentence: "La notion d'« **idée esthétique normale** », sur laquelle s'appuient Reiter et Geiger, est introduite par Kant __au troisième des quatre moments du jugement de beauté, en__ ___."
        answer: "§17"
        alt: []
      - id: ea3-l5-p9
        sentence: "___ conteste les lectures qui limitent les idées esthétiques à la présentation de concepts moraux ou rationnels, __en soutenant qu'elles peuvent aussi présenter des **concepts empiriques et des émotions humaines**__."
        answer: "Matherne"
        alt: []
        explanation: "Matherne 2013."
      - id: ea3-l5-p10
        sentence: "Plutôt que d'élargir seulement les concepts que les idées esthétiques peuvent présenter, ___ soutient qu'elles ne se contentent pas de présenter ou d'exprimer des concepts, __mais nous appellent à les **réviser**__."
        answer: "Vaccarino Bremner"
        alt: []
        explanation: "Vaccarino Bremner 2021."
      - id: ea3-l5-p11
        sentence: "___ soutient que la théorie kantienne de l'esthétique __s'applique aussi à l'**art conceptuel**__."
        answer: "Costello"
        alt: []
        explanation: "Costello 2013."
