        answer: "nature"
        alt: []
        explanation: "§45."
      - id: ea3-l3-p4
        sentence: "L'exigence que l'art beau nous paraisse comme de la nature, libre et non étudié, est formulée par Kant en ___."
        answer: "§45"
        alt: []
      - id: ea3-l3-p5
