  - id: platon-connaissance-i12
    title: "Ce qui appelle la pensée"
    notes: |-
      **Le livre VII décrit les études qui forment le philosophe-roi (521c s.).** Leur but est la science des Idées, atteinte en dernier lieu par la **dialectique**, que pratiquent tard dans la vie quelques-uns, doués de mémoire et de vivacité d'esprit, après des études essentiellement mathématiques. Cette sélection écarte la plupart des hommes.

      **Premier pas vers la pensée abstraite (523a-525a) : certaines perceptions appellent la pensée.** Sur l'épais et le mince, le dur et le mou, le grand et le petit, et aussi le nombre, les sens rapportent la même chose comme son contraire, du moins dans certaines circonstances ; l'esprit est appelé à trancher ce qui est grand, ce qui est petit, ce qui est un.

      **Une difficulté de psychologie des facultés.** Chaque partie de l'âme semble capable de juger, et les jugements des sens peuvent contredire ceux de la raison (602c-603a ; Burnyeat). Mais si chaque faculté a ses objets propres, aucun conflit n'est possible. La perception, elle, relève non de la partie rationnelle de l'âme, mais de sa partie désirante. Platon reproche aux hommes de croire, en se fiant à la perception, que le réel est le monde sensible, et, pire, qu'on peut savoir ce qui rend beau un temple ou égal un bâton en invoquant des propriétés sensibles.

      **Le texte décisif pour la suite (479d3-5)** : « Il semble donc que nous ayons découvert que les nombreux jugements du grand nombre au sujet du beau et des autres choses oscillent pour ainsi dire entre ce qui n'est pas et ce qui est purement et simplement. » Le mot rendu par « jugements » est `nomima`, que d'autres traduisent par « règles » ou « croyances ».
