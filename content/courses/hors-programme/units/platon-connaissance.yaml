  - id: platon-connaissance-i9
    title: "République V : trois lectures du « est »"
    notes: |-
      **Tout dépend du sens de « est » dans « ce qui est complètement » et « ce qui est et n'est pas », et de ce sur quoi portent la science et l'opinion : des objets ou des propositions.**

      | Lecture | La science porte sur | L'opinion porte sur |
      | {sky}existentielle{/sky} | ce qui existe | ce qui existe et n'existe pas |
      | {coral}prédicative{/coral} | les Idées, ce qui est F | ce qui est F et non-F : les choses matérielles |
      | {teal}véridique{/teal} (Fine) | ce qui est vrai : les propositions vraies | ce qui est vrai ou faux : toutes les propositions |

      **La lecture existentielle** a peu de partisans : on voit mal ce que serait, pour un objet, exister et ne pas exister, et beaucoup pensent, avec Owen, que Platon n'emploie jamais de « est » d'existence.

      **La lecture prédicative soutient la doctrine des deux mondes** : objets de science et objets d'opinion sont distincts ; des choses on n'a qu'opinion, des Idées que science. Deux conséquences : la science ne peut être une croyance vraie justifiée, même attachée par la cause (*Ménon*, 98a) ; et l'on ne pourrait avoir d'opinion fausse sur les Idées, ce qui gêne davantage, puisqu'au livre I les interlocuteurs ont bien des opinions fausses sur la justice (rendre ce qui est dû).

      **La lecture véridique voit un mérite dans le recouvrement** des objets des deux capacités, les propositions vraies : la science peut être une croyance vraie justifiée, et l'on peut avoir opinion et science des Idées comme des choses sensibles.
