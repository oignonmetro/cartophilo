  - id: platon-connaissance-i16
    title: "Hypothèses plus hautes et principe anhypothétique"
    notes: |-
      **Il faut aussi examiner l'hypothèse elle-même** (101d) : « Et si quelqu'un s'attachait à l'hypothèse elle-même, tu l'enverrais poliment promener, tu ne ferais aucune réponse avant d'avoir examiné si toutes les affirmations qui, sur son élan, en ont procédé, sont mutuellement consonantes ou dissonantes. Et chaque fois qu'il y aura exigence à rendre compte de l'hypothèse elle-même, tu le feras en agissant exactement de la même façon : tu poseras une nouvelle hypothèse, en choisissant parmi celles d'en haut celle qui te paraîtra la meilleure, jusqu'à ce que tu atteignes quelque chose de satisfaisant. »

      **Quelles sont ces hypothèses « d'en haut », plus hautes que la théorie des Idées ?** On est tenté de répondre : l'explication par le Bien, que Platon refuse toujours de donner. Mais, selon le commentateur Rowe, il y aurait des étapes intermédiaires : des conceptions rivales de la nature des Idées, des choses et de la participation, entre lesquelles il faut choisir. Par exemple :
      - la conception d'Aristote, pour qui les formes sont dans les choses (« réalisme immanent ») et certaines choses ont des propriétés essentielles ;
      - la question de savoir si les Idées sont strictement simples : le Trois Est ce que c'est qu'être trois, mais il est aussi impair ; est-ce le même rapport ?
      La théorie des Idées du *Phédon* et de *La République* **est alors provisoire** : elle attend d'être justifiée par ces hypothèses plus hautes.

      **Dans la Ligne**, la `dianoia` se sert encore d'hypothèses : les mathématiciens posent leurs points de départ (axiomes, définitions) sans les justifier, comme Socrate pose les Idées dans le *Phédon*. Le `noûs`, lui, a atteint un principe anhypothétique, puis redescend la Ligne en **détruisant les hypothèses**. Détruire une hypothèse ne veut pas dire la rejeter, mais lui ôter son statut de simple hypothèse en la justifiant à partir d'un principe plus haut, comme, dans le *Phédon*, on rend compte d'une hypothèse par une hypothèse d'en haut. La théorie des Idées cesse ainsi d'être hypothétique lorsque le philosophe a établi laquelle des conceptions des Idées est la meilleure (dans les choses ou hors d'elles, simples ou complexes, et quel est leur rapport au Bien).

      | | Sciences (`dianoia`) | Dialectique (`noûs`) |
      | point de départ | des hypothèses posées sans justification | un principe anhypothétique |
      | objet | les axiomes propres de chaque science | la nature des objets des sciences et la structure des sciences |

      ! Bien moins d'hommes passent de la conviction (`pistis`) à la pensée discursive (`dianoia`) que de l'imagination (`eikasia`) à la conviction.
