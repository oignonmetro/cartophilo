  - id: platon-connaissance-i8
    title: "République V : science et opinion"
    notes: |-
      La *République* **est la défense la plus développée des thèses éthiques de Platon à l'époque de sa maturité. Elle cherche ce qu'est la justice pour montrer que la meilleure vie est celle de la vertu et du savoir.** Dans l'âme vertueuse, les trois parties sont en harmonie : la raison, qui connaît l'Idée du Bien et les autres Idées, gouverne avec l'appui et l'accord de l'appétit et du cœur (`thumos`). La cité idéale y répond avec ses trois classes : gouvernants, guerriers, travailleurs. La justice ayant été définie, à la fin du livre IV, comme cette harmonie de l'âme, il reste à montrer ce que sait le philosophe-roi, et pourquoi ce savoir lui donne le droit de gouverner.

      **À la fin du livre V (474b s.), Socrate oppose le philosophe aux {coral}amateurs de spectacles{/coral}.** Le philosophe admet l'existence du Beau en soi, et il a la science ; l'amateur de spectacles ne reconnaît que les multiples belles pièces, les belles peintures, et il n'a que l'opinion. Socrate distingue alors trois capacités de l'âme, chacune avec son objet :

      | Capacité | Objet |
      | science | ce qui est complètement |
      | opinion | ce qui est et n'est pas : l'intermédiaire |
      | ignorance | ce qui n'est aucunement |

      Il fait accorder ces thèses à son interlocuteur (477a) : « Avons-nous alors considéré ce point de façon satisfaisante, même si nous pourrions l'examiner beaucoup plus en détail, à savoir que ce qui est complètement est complètement connaissable, alors que ce qui n'est aucunement est entièrement inconnaissable ? » Puis : « Mais si une certaine chose est ainsi disposée qu'elle est et n'est pas à la fois, ne se trouve-t-elle pas au milieu, entre ce qui est purement et simplement et ce qui, au contraire, n'est aucunement ? »

      **Deux critères distinguent les capacités** : leurs objets (comme la vue et l'ouïe se distinguent par les couleurs et les sons) et ce qu'elles accomplissent : la science ne se trompe jamais, l'opinion peut être vraie ou fausse.
