  - id: platon-connaissance-i2
    title: "Le Ménon : le paradoxe de la recherche"
    notes: |-
      Le *Ménon*, **sans doute dialogue de transition, passe de questions éthiques (qu'est-ce que la vertu ? peut-elle s'enseigner ?) à l'épistémologie qu'appelle la thèse selon laquelle la vertu est science.** La réminiscence y apparaît pour la première fois, en réponse au **paradoxe de la recherche** avancé par Ménon (80d-e) :
      - pour toute chose F, ou bien on connaît F, ou bien on ne le connaît pas ;
      - si l'on connaît F, on ne peut chercher F ;
      - si l'on ne connaît pas F, on ne peut chercher F ;
      - donc on ne peut rien chercher.

      **La réponse de Platon : « connaître » se dit en plusieurs sens, et avoir une opinion sur F suffit parfois pour commencer à le chercher.** L'interrogatoire de l'esclave sur la façon de trouver la diagonale d'un carré donné (81-86b) le montre : l'esclave a des opinions, les unes vraies, les autres fausses ; il suffit de questions pour faire sortir de lui la science qui y est latente. Socrate soutient qu'il l'amène ainsi à **se ressouvenir** de ce qu'il sait déjà.

      ! L'esclave n'apprend rien de Socrate : les questions ne font que __réveiller__ un savoir latent.
    points:
      - id: platon-connaissance-i2-p1
        sentence: "Le *Ménon*, sans doute dialogue de ___, relie les dialogues socratiques à ceux de la maturité."
        answer: "transition"
        alt: []
      - id: platon-connaissance-i2-p2
        sentence: "Les deux derniers tiers du *Ménon* traitent des questions épistémologiques qu'appelle la thèse selon laquelle la vertu est ___."
        answer: "science"
        alt: ["connaissance"]
      - id: platon-connaissance-i2-p3
        sentence: "Le paradoxe de la recherche, selon lequel on ne peut chercher ni ce qu'on connaît ni ce qu'on ne connaît pas, est avancé dans le dialogue du même nom par ___."
        answer: "Ménon"
        alt: []
      - id: platon-connaissance-i2-p4
        sentence: "Le paradoxe de la recherche, que la réminiscence doit résoudre, se trouve dans le *Ménon*, en ___."
        answer: "80d-e"
        alt: ["80d", "80de"]
      - id: platon-connaissance-i2-p5
        sentence: "Platon résout le paradoxe de la recherche en montrant que « connaître » se dit en plusieurs sens, et qu'avoir une ___ sur F suffit parfois pour commencer à chercher F."
        answer: "opinion"
        alt: ["croyance"]
