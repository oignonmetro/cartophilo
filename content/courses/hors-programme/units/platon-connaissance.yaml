  - id: platon-connaissance-i3
    title: "Le Ménon : opinion vraie et science"
    notes: |-
      Plus loin dans le *Ménon* (97 s.), **Socrate distingue avoir une simple opinion sur une chose et la connaître.** Un exemple moderne le fait voir. Jones a regardé une carte et sait qu'il faut prendre l'autoroute 80 vers l'ouest pour aller de New York à Chicago, sans avoir jamais fait le trajet ; Smith l'a fait bien des fois. Tous deux ont la même opinion, et tous deux arriveront à Chicago en agissant d'après elle.

      | | Jones | Smith |
      | opinion | vraie | vraie |
      | justification | aucune | l'expérience du trajet |
      | état | opinion vraie | science |

      **Seul Smith connaît la route.** La vérité de l'opinion n'est pas en cause : Smith a quelque chose de plus, une justification, ici fondée sur l'expérience.

      **D'où peut-être la première définition de la science comme croyance vraie justifiée : la science est une opinion vraie attachée par un raisonnement qui en donne la cause** (`aitias logismos`, 98a). Le *Ménon* prépare ainsi, avec la réminiscence, l'épistémologie de la maturité.

      ! Ce qui fait la science n'est pas une raison quelconque ajoutée à l'opinion vraie, mais le raisonnement qui en donne la __cause__.
    points:
      - id: platon-connaissance-i3-p1
        sentence: "Jones, qui a lu la carte, et Smith, qui a fait la route, ont la même opinion et arriveront tous deux à Chicago : ce qui les distingue n'est pas la ___ de leur opinion, mais une justification."
        answer: "vérité"
        alt: []
      - id: platon-connaissance-i3-p2
        sentence: "Smith, qui a souvent fait la route de New York à Chicago, la connaît ; Jones, qui n'a fait que lire la carte, n'en a qu'une opinion ___."
        answer: "vraie"
        alt: []
      - id: platon-connaissance-i3-p3
        sentence: "Ce que Smith, qui a fait la route, a de plus que Jones, qui n'a qu'une opinion vraie, est une ___, ici fondée sur l'expérience."
        answer: "justification"
        alt: []
      - id: platon-connaissance-i3-p4
        sentence: "Le *Ménon* offre peut-être la première définition de la science comme croyance vraie ___."
        answer: "justifiée"
        alt: []
      - id: platon-connaissance-i3-p5
        sentence: "Selon le *Ménon* (98a), la science est une opinion vraie attachée par un raisonnement qui en donne la ___."
        answer: "cause"
        alt: []
      - id: platon-connaissance-i3-p6
        sentence: "L'expression grecque du *Ménon* (98a) pour le raisonnement causal qui attache l'opinion vraie et en fait une science est ___."
        answer: "aitias logismos"
        alt: ["aitias logismôi", "aitias logismō"]
