  - id: platon-connaissance-i7
    title: "L'Égal en soi et les choses égales"
    notes: |-
      **Simmias accorde aussitôt qu'il y a un Égal, connu de nous, à côté des bouts de bois et des cailloux égaux (74a-b). D'où tenons-nous ce savoir ?** Pas d'eux : ils paraissent tantôt égaux, tantôt inégaux, alors que l'Égal en soi ne paraît jamais inégal. Nous voyons qu'ils sont **en défaut** par rapport à l'Égalité ; Socrate ne dit pas en quoi, sinon qu'ils peuvent paraître inégaux.

      **Pourquoi l'Idée ne peut-elle paraître inégale ?** Platon ne le dit guère (White). Trois réponses :

      | Lecture | Pourquoi l'Égal ne paraît jamais inégal |
      | {teal}simplicité{/teal} | l'Idée, incomposée, n'a pas d'autre propriété : en avoir conscience, c'est la reconnaître égale |
      | {coral}coprésence{/coral} | l'Idée peut être complexe (aussi belle) ; seul le contraire strict, l'inégal, en est exclu |
      | {violet}prédicationniste{/violet} | connaître l'Égalité, c'est connaître son essence, une en dépit de la complexité de sa définition |

      **La réponse par la simplicité laisse deux problèmes** : distinguer avoir conscience de l'Idée et croire à tort l'avoir ; savoir si l'on peut avoir l'Idée à l'esprit sans en avoir conscience, ce que la lecture innéiste doit admettre. Et si les Idées ne sont pas simples, si l'Égalité est aussi belle, on pourrait, en s'attachant à sa beauté, la voir autre qu'égale.

      ! Quelle que soit la lecture, Platon semble seulement avoir montré que l'Idée et les choses ne sont pas __identiques__, non qu'on ne peut tirer des sensibles la science de l'Idée.
