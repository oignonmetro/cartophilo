  - id: platon-connaissance-i4
    title: "La réminiscence dans le Phédon : qui se ressouvient ?"
    notes: |-
      Le *Phédon* **introduit la réminiscence par une remarque de Cébès, à l'appui de la préexistence de l'âme** (72e-73a) : « Bien plus, Socrate, intervint Cébès, cela va aussi dans le sens de la formule (si elle est vraie !) que tu as l'habitude de répéter : que pour nous, l'acquisition d'un savoir se trouve n'être rien d'autre qu'une réminiscence. D'après cette formule, il est nécessaire, je pense, que, dans un temps antérieur, nous ayons appris ce dont nous nous ressouvenons à présent. Ce qui serait impossible si notre âme n'existait pas en quelque façon avant d'être entrée dans cette forme humaine. »

      **Deux mots comptent : « pour nous », et l'identification de l'acquisition d'un savoir (`mathêsis`) à la réminiscence.** Qui sont « nous » : les familiers philosophes de Socrate, ou le genre humain ?

      | | Lecture {teal}large{/teal} (Bedu-Addo) | Lecture {coral}étroite{/coral} (Scott, Bobonich) |
      | qui se ressouvient | tout homme | les seuls philosophes |
      | de quoi | des concepts appliqués dans toute pensée | des seules Idées |
      | statut | doctrine des idées innées, active dès les premières pensées | dernier stade de l'apprendre : des opinions sur le monde à la science des Idées |
      | les concepts ordinaires | supposent une connaissance latente des Idées | sont tirés des choses, des conversations, des perceptions |

      **Les deux lectures s'accordent sur le problème : expliquer la capacité proprement humaine de ranger les perceptions sous des universaux.** Elles divergent sur la solution : pour la lecture large, il y faut une connaissance antérieure des Idées ; pour l'étroite, cette connaissance n'explique que la compréhension philosophique des Idées. Reste à savoir comment se rapportent les concepts ordinaires et les concepts philosophiques innés.
