  - id: platon-connaissance-i4
    title: "La réminiscence dans le Phédon : qui se ressouvient ?"
    notes: |-
      Le *Phédon* **introduit la réminiscence par une remarque de Cébès, à l'appui de la thèse que l'âme existait avant le corps** (72e-73a) : « Bien plus, Socrate, intervint Cébès, cela va aussi dans le sens de la formule (si elle est vraie !) que tu as l'habitude de répéter : que pour nous, l'acquisition d'un savoir se trouve n'être rien d'autre qu'une réminiscence. D'après cette formule, il est nécessaire, je pense, que, dans un temps antérieur, nous ayons appris ce dont nous nous ressouvenons à présent. Ce qui serait impossible si notre âme n'existait pas en quelque façon avant d'être entrée dans cette forme humaine. »

      **Deux points de cette phrase font difficulté.** Qui désigne ce « nous » : les compagnons philosophes de Socrate, ou tous les hommes ? Et que faut-il entendre par l'« acquisition d'un savoir » (`mathêsis`) identifiée à la réminiscence : tout apprentissage, ou seulement le savoir philosophique ? Deux lectures s'opposent chez les commentateurs :

      | | Lecture {teal}large{/teal} (Bedu-Addo) | Lecture {coral}étroite{/coral} (Scott, Bobonich) |
      | qui se ressouvient | tout homme | les seuls philosophes |
      | de quoi | des concepts que toute pensée met en œuvre | des Idées seulement |
      | rôle de la réminiscence | une doctrine des idées innées, à l'œuvre dès nos premières pensées | la dernière étape de l'apprentissage : passer des opinions sur le monde à la science des Idées |
      | d'où viennent nos concepts ordinaires | ils supposent une connaissance latente des Idées | ils sont tirés des choses, des conversations, des perceptions |

      Selon la lecture large, on ne pourrait même pas penser « ces bouts de bois sont égaux » sans un concept d'égalité que l'expérience ne donne pas, et qui suppose une connaissance antérieure de l'Égalité.

      **Les deux lectures s'accordent sur le problème à résoudre : expliquer comment les hommes rangent leurs perceptions sous des universaux** (cette chose-ci sous « égal », celle-là sous « beau »). Elles divergent sur la solution : pour la lecture large, il y faut une connaissance antérieure des Idées ; pour la lecture étroite, cette connaissance n'explique que la compréhension philosophique des Idées. Reste à savoir comment se rapportent les concepts ordinaires et les concepts philosophiques.
    points:
