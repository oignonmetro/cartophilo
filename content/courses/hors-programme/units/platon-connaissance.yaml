  - id: platon-connaissance-i9
    title: "République V : trois lectures du « est »"
    notes: |-
      **Tout dépend de deux questions : quel est le sens de « est » dans « ce qui est complètement » et « ce qui est et n'est pas » ? et sur quoi portent la science et l'opinion : sur des objets (des choses, des Idées), ou sur des propositions (des énoncés vrais ou faux, comme « Hélène est belle ») ?** Trois lectures s'opposent :

      | Lecture | La science porte sur | L'opinion porte sur |
      | {sky}existentielle{/sky} : « est » veut dire « existe » | ce qui existe | ce qui existe et n'existe pas |
      | {coral}prédicative{/coral} : « est » veut dire « est F » | les Idées, ce qui est F | ce qui est F et non-F : les choses matérielles |
      | {teal}véridique{/teal} : « est » veut dire « est vrai » (commentatrice Gail Fine) | les propositions vraies | toutes les propositions, vraies ou fausses |

      **La lecture existentielle a peu de partisans** : on voit mal ce que serait, pour un objet, exister et ne pas exister à la fois ; et beaucoup pensent, avec le commentateur Owen, que Platon n'emploie jamais « être » au sens d'« exister ».

      **La lecture prédicative soutient la doctrine des deux mondes** : les objets de la science et ceux de l'opinion sont distincts ; on n'a des choses qu'une opinion, et des Idées qu'une science. Deux conséquences gênantes :
      - une opinion ne peut jamais devenir science, même justifiée, puisque les deux n'ont pas le même objet : la définition du *Ménon* (l'opinion vraie attachée par la cause, 98a) tombe ;
      - on ne peut avoir d'opinion fausse sur les Idées ; or, au livre I, les interlocuteurs ont bien des opinions fausses sur la justice (par exemple, que c'est rendre ce qui est dû).

      **La lecture véridique** fait des propositions vraies l'objet commun de l'opinion et de la science, et y voit un avantage : une même proposition peut être d'abord crue, puis sue. La science peut alors être une croyance vraie justifiée, et l'on peut avoir opinion et science aussi bien des Idées que des choses sensibles.
    points:
      - id: platon-connaissance-i9-p1
        sentence: "Selon la lecture ___ de *République* V, la science porte sur ce qui existe et l'opinion sur ce qui existe et n'existe pas ; elle a peu de partisans."
        answer: "existentielle"
        alt: []
