  - id: platon-connaissance-i17
    title: "Holisme ou intuition"
    notes: |-
      **Les images des livres centraux ne tranchent pas : les capacités ont-elles des objets différents ?** Une analyse **par les contenus** fait des propositions les objets de l'opinion et de la science : la même proposition peut être crue ou sue, selon les raisons qu'on en a, ce qui ouvre un chemin de l'opinion à la science. Elle n'oblige pas à faire de toute science une croyance vraie justifiée : la science des Idées peut rester fondamentale.

      **Intuition ou description ?** Le Soleil, la Ligne et la Caverne suggèrent une science des Idées intuitive, par accointance ; le refrain selon lequel qui sait peut rendre raison (`logos`) de ce qu'il sait suggère une connaissance par description.

      | | {teal}Holisme{/teal} | {coral}Intuition{/coral} |
      | connaître une Idée | suppose de connaître les éléments de sa définition, voire toutes les Idées | une saisie atomique, par accointance |
      | justification | un cercle vertueux | directe |

      **Le holisme** : pour savoir ce qu'est l'Homme, il faut connaître l'Animal, le Raisonnable, le Bipède, et leurs définitions, et ainsi de suite ; les genres et espèces d'une science sont les nœuds d'un réseau. L'exigence est formidable : poussé par le désir d'irréfutabilité, peut-être hérité de l'elenchos, Platon ferait qu'on ne se ressouvient vraiment d'une Idée que devenu métaphysicien. Le philosophe n'en sait pas plus en mathématiques que le mathématicien : il **assure** autrement son savoir.

      **Mais Platon ne dit jamais qu'il faut savoir toutes les vérités d'une science pour connaître une Idée.** S'il y a plusieurs voies vers la science, son épistémologie peut être à la fois holiste et intuitive. Le dialogue étant fait pour appeler la pensée du lecteur, c'est à chacun de chercher par lui-même ce qu'est la science.
    points:
