  - id: platon-connaissance-i16
    title: "Hypothèses plus hautes et principe anhypothétique"
    notes: |-
      **Il faut aussi examiner l'hypothèse elle-même** (101d) : « Et si quelqu'un s'attachait à l'hypothèse elle-même, tu l'enverrais poliment promener, tu ne ferais aucune réponse avant d'avoir examiné si toutes les affirmations qui, sur son élan, en ont procédé, sont mutuellement consonantes ou dissonantes. Et chaque fois qu'il y aura exigence à rendre compte de l'hypothèse elle-même, tu le feras en agissant exactement de la même façon : tu poseras une nouvelle hypothèse, en choisissant parmi celles d'en haut celle qui te paraîtra la meilleure, jusqu'à ce que tu atteignes quelque chose de satisfaisant. »

      **Quelles hypothèses plus hautes que la théorie des Idées ?** On est tenté de répondre : l'explication téléologique par le Bien, que Platon refuse toujours de donner. Mais il y aurait des étapes intermédiaires (Rowe) : des conceptions rivales de la nature des Idées, des choses et de la participation. Aristote pourrait défendre un réalisme immanent, où certaines choses ont des propriétés essentielles ; ou l'on peut se demander si les Idées sont simples, ou si le Trois, par exemple, Est ce que c'est qu'être trois tout en se rapportant autrement à l'impair. La théorie des Idées du *Phédon* et de la *République* **est alors provisoire.**

      **Dans la Ligne**, la `dianoia` se sert encore d'hypothèses : les mathématiciens posent leurs points de départ (axiomes, définitions), comme Socrate pose les Idées dans le *Phédon*. Le `noûs` a atteint un principe anhypothétique et, redescendant la Ligne, a **détruit les hypothèses**. Détruire les hypothèses, c'est trouver les `logoi` plus hauts : la théorie des Idées n'est plus hypothétique que lorsque le philosophe a établi laquelle des conceptions des Idées est la meilleure (immanentes ou transcendantes, simples ou complexes, rapport au Bien).

      | | Sciences (`dianoia`) | Dialectique (`noûs`) |
      | point de départ | des hypothèses posées | un principe anhypothétique |
      | porte sur | les axiomes propres de chaque science | la nature de leurs propriétés et la structure des sciences |

      ! Peu franchissent le pas de la conviction à la `dianoia`, bien moins que celui de l'imagination à la conviction.
