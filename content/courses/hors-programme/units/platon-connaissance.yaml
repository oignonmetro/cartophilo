  - id: platon-connaissance-i6
    title: "Les conditions de la réminiscence"
    notes: |-
      **Socrate pose d'abord (73c-74a) les conditions de la réminiscence.** Si x fait se ressouvenir de y :
      - 1. il faut qu'auparavant on ait eu un savoir de y ;
      - 2. en percevant x, il faut reconnaître x et penser à y ;
      - 3. y doit être l'objet non pas du même, mais d'un autre savoir que x ;
      - 4. quand le ressouvenir vient du semblable, il faut se demander si x manque ou non de ressemblance à y.

      **Les exemples** : à la vue d'une lyre, l'amant pense au garçon à qui elle appartient, ressouvenir par le **dissemblable** ; le portrait de Simmias rappelle Simmias lui-même, par le **semblable**.

      **La condition 3** : si le portrait et Simmias relevaient du même savoir, le portrait ne me rappellerait rien, car je ne peux me ressouvenir de ce à quoi je pense déjà. Il faut pouvoir saisir le portrait sans penser à Simmias. C'est plus clair avec la lyre, qu'on reconnaît comme instrument, comme bois tendu de cordes, sans penser à celui à qui elle appartient. **La condition 4** : on reconnaît qu'une image est toujours en défaut par rapport à ce dont elle est l'image, sans avoir besoin de penser à son modèle.

      **La difficulté surgit avec les bouts de bois égaux.** Si, selon la condition 4, il faut les comparer à l'Égalité, il faut avoir l'Idée à l'esprit pour penser à eux ; on ne peut donc être en train de former le concept d'égalité, ni de se ressouvenir de l'Idée.
    points:
