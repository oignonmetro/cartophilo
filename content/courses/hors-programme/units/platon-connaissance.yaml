  - id: platon-connaissance-i12
    title: "Ce qui appelle la pensée"
    notes: |-
      **Le livre VII décrit les études qui forment le philosophe-roi (521c s.).** Leur but est la science des Idées, atteinte en dernier lieu par la **dialectique**. Elle n'est pratiquée que tard dans la vie, par quelques-uns, doués de mémoire et de vivacité d'esprit, après des études essentiellement mathématiques : cette sélection écarte la plupart des hommes.

      **Premier pas vers la pensée abstraite (523a-525a) : certaines perceptions « appellent » la pensée.** À propos de l'épais et du mince, du dur et du mou, du grand et du petit, et aussi du nombre, les sens rapportent qu'une même chose est aussi son contraire, du moins dans certaines circonstances (le même doigt paraît grand ou petit selon celui auquel on le compare). L'esprit est alors appelé à trancher : qu'est-ce que le grand, le petit, l'un ?

      **Une difficulté : chaque partie de l'âme a-t-elle ses propres capacités de juger ?** Le livre X (602c-603a), étudié par le commentateur Burnyeat, admet que les sens jugent, et que leurs jugements peuvent contredire ceux de la raison. Mais si chaque capacité a des objets propres, qu'aucune autre ne peut saisir (comme le veut le livre V), deux capacités ne jugent jamais de la même chose, et ne peuvent donc se contredire. La perception, d'ailleurs, relève non de la partie rationnelle de l'âme, mais de sa partie désirante. Ce que Platon reproche aux hommes, c'est de croire, en se fiant à la perception, que le réel est le monde sensible ; pire, de croire qu'on peut savoir ce qui rend beau un temple ou égal un bâton en invoquant des propriétés sensibles.

      **Le texte du livre V qui commande la discussion suivante (479d3-5)** : « Il semble donc que nous ayons découvert que les nombreux jugements du grand nombre au sujet du beau et des autres choses oscillent pour ainsi dire entre ce qui n'est pas et ce qui est purement et simplement. » Le mot rendu par « jugements » est `nomima`, que d'autres traduisent par « règles » ou par « croyances ».
