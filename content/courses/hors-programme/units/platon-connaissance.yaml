  - id: platon-connaissance-i3
    title: "Le Ménon : opinion vraie et science"
    notes: |-
      Plus loin dans le *Ménon* (97 s.), **Socrate distingue avoir une simple opinion sur une chose et la connaître.** Un exemple moderne le fait voir. Jones a regardé une carte et sait qu'il faut prendre l'autoroute 80 vers l'ouest pour aller de New York à Chicago, sans avoir jamais fait le trajet ; Smith l'a fait bien des fois. Tous deux ont la même opinion, et tous deux arriveront à Chicago en la suivant.

      | | Jones | Smith |
      | opinion | vraie | vraie |
      | justification | aucune | l'expérience du trajet |
      | état | opinion vraie | science |

      **Seul Smith connaît la route.** Ce n'est pas que son opinion soit plus vraie : il a quelque chose de plus, une justification, ici tirée de l'expérience.

      **C'est peut-être la première version d'une définition devenue classique, la science comme croyance vraie justifiée.** Chez Platon : la science est une opinion vraie attachée par un raisonnement qui en donne la cause (`aitias logismos`, 98a). Avec la réminiscence, le *Ménon* prépare ainsi la théorie de la connaissance des dialogues de la maturité.

      ! Ce qui fait la science n'est pas une raison quelconque ajoutée à l'opinion vraie, mais le raisonnement qui en donne la __cause__.
    points:
      - id: platon-connaissance-i3-p1
        sentence: "Jones, qui a lu la carte, et Smith, qui a fait la route, ont la même opinion et arriveront tous deux à Chicago : ce qui les distingue n'est pas la ___ de leur opinion, mais une justification."
        answer: "vérité"
        alt: []
      - id: platon-connaissance-i3-p2
