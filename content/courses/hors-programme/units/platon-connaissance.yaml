  - id: platon-connaissance-i14
    title: "Pourquoi la perception ne suffit pas"
    notes: |-
      Selon la réminiscence du *Phédon*, **toute explication empiriste ou abstractionniste des concepts serait viciée** : la déficience du monde sensible en fait une source d'information peu fiable. Chaque diagnostic de cette déficience explique autrement l'échec de la perception :
      - le sensible change (Aristote) ;
      - les Idées, générales et abstraites, s'y manifestent toujours de façon concrète et déterminée ;
      - les choses sont complexes (argument de l'affinité) : la perception doit se concentrer sur un aspect, sans pouvoir expliquer elle-même pourquoi elle le sélectionne ;
      - pour les propriétés incomplètes, toute chose est F et non-F : aucune n'en est porteur sans réserve.

      **Les facultés traitent mal l'information** : tantôt elles déforment les perceptions (*Phédon*, 65 s.), tantôt elles ne transmettent rien à la raison, sinon à l'opinion.

      **Surtout, la perception ne sort jamais de sa perspective.** D'où qu'on la regarde, une pièce ronde paraît à l'œil quelque peu elliptique ; le bâton droit plongé dans l'eau paraît brisé, même si l'homme d'expérience le croit droit (*République*, X, 602c-603a).
