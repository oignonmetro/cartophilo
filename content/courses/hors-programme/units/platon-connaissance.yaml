  - id: platon-connaissance-i8
    title: "République V : science et opinion"
    notes: |-
      La *République*, **la défense la plus développée de l'éthique de la maturité, cherche ce qu'est la justice pour montrer que la meilleure vie est celle de la vertu et du savoir.** Dans l'âme vertueuse, les trois parties sont en harmonie : la raison, qui connaît l'Idée du Bien et les autres Idées, gouverne avec l'appui et l'accord de l'appétit et du cœur. La cité idéale y répond avec ses trois classes : gouvernants, guerriers, travailleurs. La justice étant établie comme harmonie de l'âme à la fin du livre IV, il faut montrer ce que sait le philosophe-roi, qui l'autorise à gouverner.

      **À la fin du livre V (474b s.), Socrate oppose le philosophe aux {coral}amateurs de spectacles{/coral}.** Le philosophe admet le Beau en soi et a la science ; l'amateur de spectacles ne reconnaît que les multiples belles pièces, belles peintures, et n'a que l'opinion.

      | Capacité | Objet |
      | science | ce qui est complètement |
      | opinion | ce qui est et n'est pas : l'intermédiaire |
      | ignorance | ce qui n'est aucunement |

      Socrate le fait accorder en 477a : « Avons-nous alors considéré ce point de façon satisfaisante, même si nous pourrions l'examiner beaucoup plus en détail, à savoir que ce qui est complètement est complètement connaissable, alors que ce qui n'est aucunement est entièrement inconnaissable ? » Puis : « Mais si une certaine chose est ainsi disposée qu'elle est et n'est pas à la fois, ne se trouve-t-elle pas au milieu, entre ce qui est purement et simplement et ce qui, au contraire, n'est aucunement ? »

      **Deux critères distinguent les capacités** : leurs objets (comme la vue et l'ouïe se distinguent par les couleurs et les sons) et ce qu'elles font : la science est toujours vraie, l'opinion vraie ou fausse.
