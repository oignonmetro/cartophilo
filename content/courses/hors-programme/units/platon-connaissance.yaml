lessons:
  - id: platon-connaissance-i1
    title: "Ce qu'est l'épistémologie pour Platon"
    notes: |-
      **Pour Platon, l'épistémologie est l'étude de ce qu'est la science (`epistêmê`), non de la question, familière depuis Descartes, de savoir s'il y en a une.** Platon ne considère jamais le défi sceptique global : il suppose que la science existe, ou du moins qu'elle est possible, et en cherche les **conditions** : du côté de l'âme, ses capacités rationnelles ; du côté des objets, les Idées, qui en sont certainement.

      **Le monde matériel peut-il être su ?** Le *Phédon* et surtout les grandes analogies de la *République* (Soleil, Ligne, Caverne) semblent faire de Platon un {coral}sceptique{/coral} à l'égard du sensible : on n'en a que des opinions. D'autres (Fine) répondent que, si toute science se fonde sur les Idées, qui connaît les Idées peut aussi connaître le monde physique.

      **La réminiscence répond au défaut d'intelligibilité du monde physique** : si les Idées sont les objets de la science et ne sont pas dans le monde, il faut les avoir vues avant tout commerce avec lui.

      **La simplicité des Idées décide aussi de la nature de la science :**

      | Si les Idées sont… | la science est… | Textes |
      | simples | intuitive, une vision non propositionnelle de l'Idée | livres centraux de la *République* |
      | liées entre elles (l'Homme à l'Animal, au Bipède, au Raisonnable) | propositionnelle, par définition ; peut-être une croyance vraie justifiée | *Gorgias* 465a, 501a ; *République* 534b |

      Pour transformer une opinion en science, Platon évoque deux fois une **méthode hypothétique** (*Phédon*, *République*). D'où quatre notions à étudier : la science, l'opinion, la réminiscence et la méthode hypothétique.

      ! Platon ne se demande pas __si__ l'on peut savoir, mais à quelles __conditions__ on sait.
    points:
