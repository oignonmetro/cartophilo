  - id: platon-connaissance-i13
    title: "Le sensible : propriétés ou objets ?"
    notes: |-
      **Pour les commentateurs qui limitent les Idées aux propriétés incomplètes (Fine, Irwin, Gosling), le défaut du sensible ne tient pas aux choses elles-mêmes, mais aux explications** que donnent les amateurs de spectacles pour justifier leur prétention à savoir. Il n'est pas nécessaire qu'un temple donné soit et ne soit pas beau, comme le veut la lecture prédicative. **Ce qui est F et non-F, c'est le type de propriété sensible qu'on invoque** : « être d'une couleur éclatante » expliquerait la beauté du temple de Bassae, mais rend laides d'autres choses ; cette propriété est donc à la fois cause de beauté et de laideur, « belle et non belle ».

      **La lecture véridique comprend `nomima` comme des « croyances »** : la plupart des gens justifient leurs croyances par des propriétés sensibles de ce genre ; leurs raisons sont donc fausses, et ils sont condamnés à l'opinion. Puisque Platon pense que la science existe, il doit y avoir des explications par des propriétés non sensibles, qui ne rendent pas certaines choses belles et d'autres laides.

      **Cette lecture permet au philosophe de connaître le monde visible**, pour deux raisons :
      - certaines propositions sur les choses ne portent pas sur des propriétés incomplètes, comme « Socrate est un homme » : Socrate est homme sans réserve, et, dans cette lecture, il n'y a pas d'Idée de l'Homme ; rien n'empêche donc de le savoir ;
      - le philosophe qui connaît les Idées des propriétés incomplètes n'est plus trompé par les contraires coprésents, et peut connaître le monde matériel (520c).

      **La lecture prédicative, elle, admet des Idées pour toutes sortes de propriétés, et ne promet aucune science du monde physique** : un monde qui, à tous égards, est et n'est pas, n'est tout simplement pas un objet possible de science, quelles que soient les justifications dont on dispose.

      **Tous le peuvent, peu y parviennent.** Tout homme est capable de devenir philosophe et de connaître le Bien (518c) ; mais la plupart s'en tiennent aux opinions nées de la perception et de la conversation, et bien peu deviennent assez dialecticiens pour rendre raison de ce qu'ils savent d'une façon qui « détruise les hypothèses » (voir la leçon sur le principe anhypothétique).
