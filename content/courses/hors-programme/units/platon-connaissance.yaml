  - id: platon-connaissance-i14
    title: "Pourquoi la perception ne suffit pas"
    notes: |-
      **L'argument de la réminiscence suggère qu'aucune explication empiriste ou abstractionniste de nos concepts ne tient** : on ne peut ni les tirer de l'expérience, ni les obtenir en dégageant ce qu'ont en commun les choses perçues, parce que le monde sensible est trop déficient pour être une source fiable. Selon la façon dont on explique cette déficience (voir l'unité sur la métaphysique), l'échec de la perception s'explique autrement :
      - le sensible change sans cesse (Aristote) ;
      - les Idées, générales et abstraites, ne s'y manifestent jamais que de façon concrète et déterminée ;
      - les choses sont complexes (argument de l'affinité) : la perception doit se concentrer sur un de leurs aspects, sans pouvoir expliquer elle-même pourquoi elle choisit celui-là ;
      - pour les propriétés incomplètes, toute chose est F et non-F : aucune n'est F sans réserve.

      **Les capacités de l'âme traitent mal l'information** : tantôt elles déforment les perceptions (*Phédon*, 65 s.) ; tantôt, si chacune reste enfermée dans ses objets propres, elles ne transmettent rien à la raison, ou seulement à l'opinion.

      **Surtout, la perception ne sort jamais de son point de vue.** D'où qu'on la regarde, une pièce ronde paraît à l'œil quelque peu elliptique ; le bâton droit plongé dans l'eau paraît brisé, même si l'homme d'expérience le sait droit (*République*, X, 602c-603a).
