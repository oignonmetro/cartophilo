        answer: "n'être rien d'autre qu'une réminiscence"
        alt: []
      - id: platon-connaissance-i4-p3
        sentence: "« Bien plus, Socrate, intervint Cébès, cela va aussi dans le sens de la formule (si elle est vraie !) que tu as l'habitude de répéter : que pour nous, l'acquisition d'un savoir se trouve n'être rien d'autre qu'une réminiscence. D'après cette formule, il est nécessaire, je pense, que, dans un temps antérieur, nous ayons appris ce dont nous nous ressouvenons à présent. Ce qui serait impossible si notre âme n'existait pas en quelque façon ___. » (*Phédon*, 72e-73a)"
