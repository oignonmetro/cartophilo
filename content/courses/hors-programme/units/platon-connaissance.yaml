  - id: platon-connaissance-i10
    title: "Le Soleil et la Ligne"
    notes: |-
      **Le livre V prépare les trois grandes images des livres VI et VII : le Soleil, la Ligne et la Caverne.**

      **Le Soleil oppose le visible et l'intelligible.** Dans le visible, le soleil engendre, nourrit et gouverne les choses, et donne à l'œil la lumière dont il a besoin pour voir. Dans l'intelligible, le Bien joue ce rôle (508e) : « Eh bien, ce qui confère la vérité aux objets connaissables et accorde à celui qui connaît le pouvoir de connaître, tu peux déclarer que c'est la forme du bien. Comme elle est la cause de la connaissance et de la vérité, tu peux la concevoir comme objet de connaissance. » Le Bien est même responsable de l'être des objets connaissables ; mais Platon ne dit jamais en quel sens, comme le souligne le commentateur Santas.

      **La Ligne divise chacun des deux domaines, visible et intelligible, en deux segments inégaux**, chacun avec ses objets et la capacité qui les saisit :

      | Segment | Objets | Capacité |
      | intelligible, haut | les Idées, dont le Bien | `noûs` : l'intellection, la science |
      | intelligible, bas | les objets des sciences | `dianoia` : la pensée discursive |
      | visible, haut | les objets physiques | `pistis` : la conviction, l'opinion |
      | visible, bas | les images, ombres et reflets | `eikasia` : l'imagination |

      **Le segment supérieur ne fait pas difficulté** : ses objets sont les Idées, et parmi elles le Bien, qui est le premier d'entre elles sans être d'une autre nature (« premier entre égaux ») ; la capacité qui s'y rapporte est le `noûs`. **La `pistis`**, littéralement la foi ou la conviction, est d'ordinaire comprise comme l'opinion.

      ! Le Bien n'est pas seulement cause de la connaissance et de la vérité : il est lui-même __connaissable__.
