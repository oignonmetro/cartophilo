  - id: platon-connaissance-i7
    title: "L'Égal en soi et les choses égales"
    notes: |-
      **Simmias accorde aussitôt qu'il existe un Égal en soi, que nous connaissons, distinct des bouts de bois et des cailloux égaux (74a-b). D'où tenons-nous ce savoir ?** Pas de ces choses : elles paraissent tantôt égales, tantôt inégales, alors que l'Égal en soi ne paraît jamais inégal. Nous voyons qu'elles sont **en défaut** par rapport à l'Égalité ; Socrate ne dit pas en quoi, sinon qu'elles peuvent paraître inégales.

      **Pourquoi l'Idée ne peut-elle paraître inégale ?** Platon ne l'explique guère, comme le note le commentateur White. Trois réponses sont possibles :

      | Si l'on insiste sur… | pourquoi l'Égal ne paraît jamais inégal |
      | {teal}la simplicité des Idées{/teal} | l'Idée n'a pas d'autre propriété que d'être égale : en avoir conscience, c'est la reconnaître égale |
      | {coral}la coprésence des contraires{/coral} | l'Idée peut avoir d'autres propriétés (être belle, par exemple) ; elle exclut seulement son contraire, l'inégal |
      | {violet}le rapport de l'Idée à son essence{/violet} (lecture prédicationniste) | connaître l'Égalité, c'est connaître son essence ; cette essence est une, même si la définition qui l'énonce est complexe : on ne peut saisir l'Égalité sans la saisir comme égale |

      **La réponse par la simplicité laisse deux problèmes** : comment distinguer le fait d'avoir vraiment l'Idée à l'esprit et le fait de croire à tort l'avoir ? et peut-on avoir l'Idée à l'esprit sans en avoir conscience, comme la lecture innéiste doit l'admettre ? Surtout, elle suppose les Idées strictement simples : si l'Égalité était aussi belle, on pourrait, en ne considérant que sa beauté, la saisir autrement que comme égale.

      ! Quelle que soit la lecture, Platon semble seulement avoir montré que l'Idée et les choses ne sont pas __identiques__, non qu'on ne peut tirer des choses sensibles la science de l'Idée.
