  - id: platon-connaissance-i5
    title: "Concepts, référence et innéisme"
    notes: |-
      **Les concepts sont les éléments de la pensée.** Le *Théétète* (189e), postérieur au *Phédon* et à la *République*, fait de la pensée le **dialogue silencieux de l'âme avec elle-même** : au prédicat « égal » de « les bouts de bois sont égaux » répond le concept [égalité]. Le *Phédon* pose que nous connaissons l'Égalité, que nous percevons des choses égales, que nous les comparons à l'Idée, et qu'il faut pour cela l'avoir connue auparavant.

      **Platon fait passer la référence avant le sens.** Là où nous distinguons les concepts par la synonymie, il se soucie de ce à quoi ils renvoient. À la fin du dernier argument du *Phédon*, « égal » s'applique d'abord à l'Idée, indirectement à ses exemplaires : c'est le nom de l'Égalité et l'**éponyme** des choses égales (102b s.). Ce qui individue un concept n'est pas ce qu'ont en tête les locuteurs, mais son rapport à l'Idée.

      **Cela appuie la lecture large, innéiste** : on a le concept dès la naissance, sans le savoir, et on y associe peu à peu des croyances. La lecture étroite doit au contraire expliquer comment on acquiert un concept ; or le *Cratyle* (383-387c, 434e-435d), en rejetant la théorie protagoréenne et héraclitéenne des noms, suggère qu'aucune explication empiriste ou abstractionniste n'est viable.

      **Objection à la lecture étroite : les concepts y deviennent des coquilles vides**, que chacun remplit : dans mon concept de beauté, la peau pâle ; dans le tien, l'éclat des couleurs. Si le concept s'identifie à son contenu, personne n'a le même concept : l'empirisme mène au mieux à des langages privés, et le concept change à chaque croyance ajoutée ou retirée.

      ! Ces objections ne suffisent pas à rejeter la lecture étroite : la lecture large a ses propres difficultés.
    points:
