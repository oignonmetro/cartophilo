        sentence: "« Et si quelqu'un s'attachait à l'hypothèse elle-même, tu l'enverrais poliment promener, tu ne ferais aucune réponse avant d'avoir examiné si toutes les affirmations qui, sur son élan, en ont procédé, sont mutuellement consonantes ou dissonantes. Et chaque fois qu'il y aura exigence à ___, tu le feras en agissant exactement de la même façon : tu poseras une nouvelle hypothèse, en choisissant parmi celles d'en haut celle qui te paraîtra la meilleure, jusqu'à ce que tu atteignes quelque chose de satisfaisant. » (*Phédon*, 101d)"
