  - id: platon-connaissance-i13
    title: "Le sensible : propriétés ou objets ?"
    notes: |-
      **Pour les partisans des Idées des seules propriétés incomplètes (Fine, Irwin, Gosling), le défaut du sensible ne tient pas aux objets mêmes, mais aux explications** que donnent les amateurs de spectacles pour justifier leur prétention à savoir. Il n'est pas nécessaire qu'un temple donné soit et ne soit pas beau, comme le voudrait la lecture prédicative. **Ce qui est F et non-F, c'est le type de propriété sensible invoqué** : la couleur éclatante expliquerait la beauté du temple de Bassae, mais elle fait aussi la laideur d'autres choses.

      **La lecture véridique** traduit `nomima` par « croyances » : la plupart des gens s'appuient sur des types de propriétés sensibles pour justifier leurs croyances, et sont condamnés à l'opinion, car leurs raisons sont fausses. Puisque Platon pense qu'il y a une science, il faut des explications en termes de propriétés non sensibles, qui ne rendent pas certaines choses belles et d'autres laides.

      **Elle permet au philosophe de connaître le visible**, pour deux raisons : il y a des propositions sur des propriétés non sensibles, comme « Socrate est un homme » (Socrate est complètement homme, et il n'y a pas d'Idée de l'Homme) ; et le philosophe qui connaît les Idées des propriétés incomplètes, n'étant plus trompé par les contraires coprésents, peut connaître le monde matériel (520c).

      **La lecture prédicative ne limite pas l'étendue des Idées** : le monde physique, atteint en tout point par son être et son non-être, n'est tout simplement pas objet possible de science, quelles que soient les justifications dont on dispose.

      **Tous peuvent, peu y parviennent.** Tout homme est capable de devenir philosophe et de connaître le Bien (518c) ; mais la plupart s'en tiennent aux opinions nées de la perception et de la conversation, et peu deviennent assez dialecticiens pour « détruire les hypothèses ».
