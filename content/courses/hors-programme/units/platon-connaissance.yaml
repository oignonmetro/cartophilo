  - id: platon-connaissance-i15
    title: "La méthode hypothétique dans le Phédon"
    notes: |-
      **Comment passer de la perception à l'opinion, puis à la science des Idées ?** Platon en dit peu. L'`elenchos`, l'examen réfutatif de Socrate, y contribue sans doute, surtout au premier pas : nous donnons des raisons de nos croyances, et l'examen révèle qu'elles ne s'accordent pas.

      **Platon reprend aussi le projet des présocratiques : trouver une explication unique de tous les phénomènes naturels.** Dans le *Phédon* (95a s.), Socrate leur reproche des causes matérielles qui manquent aux exigences minimales d'une explication :
      - la même cause explique des effets contraires : « de la tête » expliquerait à la fois qu'un tel soit plus grand qu'un autre et que cet autre soit plus petit ;
      - le même effet a des causes contraires : on obtiendrait deux aussi bien par division que par addition.

      Anaxagore, en faisant de l'Intellect la cause de l'ordre du monde, allait dans le bon sens, mais sans suivre ce chemin : **la meilleure explication serait téléologique, par le Bien** (expliquer une chose par ce qui est le meilleur pour elle). Le *Phédon* renonce pourtant à l'étudier, et passe à une **méthode d'hypothèse** : la première hypothèse est que les Idées sont des causes, avec son corollaire, que les choses sont ce qu'elles sont en participant des Idées.

      **Lassé d'examiner les choses (`erga`), Socrate se réfugie du côté des raisonnements (`logoi`)** (99e-100a) : « En chaque cas, je pose un raisonnement que je juge avoir une très grande force, et tout ce qui me paraît consoner avec lui, je le pose comme étant vrai, aussi bien s'agissant de la cause que de toutes les autres réalités sans exception ; sinon, je le pose comme n'étant pas vrai. » Les raisonnements ainsi posés sont des opinions provisoires sur les Idées ; celui que pose Socrate, la théorie des Idées, est le plus fort et le plus sûr. « Consoner » ne veut pas dire être une conséquence logique : on pose une hypothèse générale, puis on vérifie, cas par cas, qu'elle explique bien tous les phénomènes du domaine visé, ici la génération et la destruction (c'est la lecture du commentateur Bedu-Addo).
    points:
