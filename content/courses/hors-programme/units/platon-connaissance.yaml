  - id: platon-connaissance-i11
    title: "La pensée discursive et la Caverne"
    notes: |-
      **Le passage décisif de la Ligne (510b) oppose les deux segments de l'intelligible** : « Dans une partie de cette section, l'âme, traitant comme des images les objets qui, dans la section précédente, étaient les objets imités, se voit contrainte dans sa recherche de procéder à partir d'hypothèses ; elle ne chemine pas vers un principe, mais vers une conclusion. Dans l'autre section toutefois, celle où elle s'achemine vers un principe anhypothétique, l'âme procède à partir de l'hypothèse et sans recourir à ces images, elle accomplit son parcours à l'aide des seules formes prises en elles-mêmes. »

      **La `dianoia` semble le raisonnement propre aux mathématiques et aux sciences, mais ses objets sont très discutés.** Le commentateur Burnyeat distingue deux façons de comprendre « traitant comme des images les objets qui, dans la section précédente, étaient les objets imités » :
      - ou bien ce sont des images « abstraites » des choses matérielles, d'une autre sorte que les ombres et les reflets : le triangle du géomètre, par exemple, n'a pas les dimensions précises d'un triangle tracé ;
      - ou bien ce sont les choses matérielles elles-mêmes, ou les Idées, mais considérées autrement que ne le fait le `noûs`.

      **La Caverne, sans doute l'image la plus célèbre de l'histoire de la philosophie, renforce la Ligne.** Des prisonniers enchaînés, la tête immobile, regardent sur la paroi des ombres projetées par des figures sculptées, que des hommes portent derrière eux, sur un parapet, à la lumière d'un feu. Un prisonnier délivré voit les figures et le feu, puis sort de la caverne : ébloui, il regarde d'abord les ombres et les reflets dans l'eau des arbres, des rochers et des animaux, puis ces choses mêmes, enfin le soleil.

      | Caverne | Ligne |
      | les statues sculptées | les objets physiques, sur lesquels porte l'opinion |
      | les reflets dans l'eau | les images dont se sert la `dianoia` |
      | les animaux | les Idées |

      ! Si l'on suit ces correspondances, les images dont se sert la `dianoia` viennent non des statues, mais des animaux, c'est-à-dire des __Idées__ elles-mêmes.
