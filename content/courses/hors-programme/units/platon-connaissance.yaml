  - id: platon-connaissance-i15
    title: "La méthode hypothétique dans le Phédon"
    notes: |-
      **Comment passer de la perception à l'opinion, puis à la science des Idées ?** Platon en dit peu. L'elenchos y contribue, surtout dans le passage de la perception à l'opinion : nous donnons des raisons de nos croyances, et il en révèle l'incohérence.

      **Platon s'inscrit aussi dans la recherche d'une explication systématique de la nature.** Dans le *Phédon* (95a s.), Socrate reproche aux présocratiques leurs causes matérielles, qui manquent aux exigences minimales :
      - la même cause explique des effets contraires : « de la tête » explique qu'un tel soit plus grand et un autre plus petit ;
      - le même effet a des causes contraires : on obtient deux par division et par addition.

      Anaxagore, en invoquant l'Intellect, allait dans le bon sens, sans suivre ce chemin : **la meilleure explication est téléologique, par le Bien**. Le *Phédon* renonce pourtant à l'étudier et passe à une **méthode d'hypothèse** : la première hypothèse est celle des Idées comme causes, avec son corollaire, que les choses sont ce qu'elles sont en participant des Idées.

      **Lassé d'examiner les choses (`erga`), Socrate se réfugie du côté des raisonnements (`logoi`)** (99e-100a) : « En chaque cas, je pose un raisonnement que je juge avoir une très grande force, et tout ce qui me paraît consoner avec lui, je le pose comme étant vrai, aussi bien s'agissant de la cause que de toutes les autres réalités sans exception ; sinon, je le pose comme n'étant pas vrai. » Ces `logoi` sont des opinions sur les Idées, provisoires ; celui de Socrate est le plus fort et le plus sûr. « Consoner » ne veut pas dire être une conséquence logique : il s'agit de voir si des cas du domaine visé, ici la génération et la destruction, échappent à l'hypothèse (Bedu-Addo).
