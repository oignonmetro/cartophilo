lessons:
  - id: platon-connaissance-i1
    title: "Ce qu'est l'épistémologie pour Platon"
    notes: |-
      **Pour Platon, l'épistémologie est l'étude de ce qu'est la science (`epistêmê`, le savoir au sens fort).** Depuis Descartes, on se demande d'abord si nous savons quoi que ce soit ; Platon ne se pose jamais cette question sceptique. **Il tient pour acquis que la science existe, ou du moins qu'elle est possible, et cherche à quelles conditions.** Ces conditions sont de deux ordres :
      - du côté de celui qui sait : les capacités rationnelles de l'âme ;
      - du côté de ce qui est su : des objets qui se prêtent à la science. Les Idées en sont à coup sûr ; reste à savoir si les choses sensibles en sont aussi.

      **Le monde matériel peut-il être objet de science ?** Le *Phédon*, et surtout les grandes images de *La République* (le Soleil, la Ligne, la Caverne), semblent faire de Platon un {coral}sceptique{/coral} à l'égard du sensible : nous n'en aurions que des opinions. Mais des commentateurs, en particulier Gail Fine, refusent cette lecture : si toute science doit s'appuyer sur les Idées, celui qui connaît les Idées peut aussi, grâce à elles, connaître le monde physique.

      **La réminiscence répond au fait que le monde physique n'est pas pleinement intelligible** : si les Idées, objets de la science, ne se trouvent pas dans le monde, nous n'avons pu les connaître qu'avant d'y entrer, c'est-à-dire avant la naissance.

      **Selon que les Idées sont simples ou complexes, la science change de nature :**

      | Si les Idées sont… | la science est… | Textes |
      | simples | intuitive : une saisie directe de l'Idée, sans passer par des énoncés | livres centraux de *La République* |
      | liées entre elles (l'Homme à l'Animal, au Bipède, au Raisonnable) | propositionnelle : savoir, c'est pouvoir énoncer la définition ; peut-être une croyance vraie justifiée | *Gorgias* 465a, 501a ; *République* 534b |

      Une croyance vraie justifiée est une croyance vraie qu'on peut appuyer sur de bonnes raisons. Comment justifier ainsi une opinion pour en faire une science ? Platon évoque deux fois une **méthode hypothétique** (*Phédon*, *République*). D'où quatre notions à étudier : la science, l'opinion, la réminiscence et la méthode hypothétique.

      ! Platon ne se demande pas __si__ l'on peut savoir, mais à quelles __conditions__ on sait.
    points:
