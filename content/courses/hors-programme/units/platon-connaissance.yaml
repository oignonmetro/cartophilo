  - id: platon-connaissance-i17
    title: "Holisme ou intuition"
    notes: |-
      **Le Soleil, la Ligne et la Caverne ne tranchent pas la question laissée ouverte par le livre V : la science et l'opinion portent-elles sur des objets différents ?** Si l'on fait porter l'une et l'autre sur des contenus, c'est-à-dire sur des propositions (« Hélène est belle »), une même proposition peut être crue ou sue, selon les raisons qu'on en a : un chemin s'ouvre de l'opinion à la science. Cette analyse **par les contenus** n'oblige pas pour autant à faire de toute science une croyance vraie justifiée : la science des Idées peut être d'un autre type, première, et servir à justifier le reste.

      **Intuition ou description ?** Le Soleil, la Ligne et la Caverne suggèrent une science des Idées intuitive, par **accointance** : une saisie directe de l'objet, comme on voit un visage, sans passer par des énoncés. Mais Platon répète que celui qui sait peut rendre raison (`logos`) de ce qu'il sait, ce qui suggère une connaissance par **description** : on connaît l'objet par les énoncés vrais qu'on peut en donner, à commencer par sa définition.

      | | {teal}Holisme{/teal} | {coral}Intuition{/coral} |
      | connaître une Idée | suppose de connaître les éléments de sa définition, voire toutes les Idées | une saisie isolée et directe, par accointance |
      | justification | un cercle vertueux : les connaissances se justifient les unes les autres | immédiate |

      **Le holisme** : pour savoir ce qu'est l'Homme, il faut connaître l'Animal, le Raisonnable, le Bipède, puis leurs définitions, et ainsi de suite ; les genres et les espèces d'une science sont les nœuds d'un réseau. Cette lecture prête à Platon une exigence formidable : soucieux que le savoir soit irréfutable (souci peut-être hérité de l'`elenchos`), il réserverait la vraie réminiscence d'une Idée à qui possède toute la théorie générale des Idées, c'est-à-dire au métaphysicien. Ce qui distingue alors le philosophe du mathématicien n'est pas qu'il sait plus de mathématiques, mais qu'il **assure** autrement son savoir, en le fondant sur cette théorie.

      **Mais Platon ne dit jamais qu'il faut connaître toutes les vérités d'une science pour connaître une Idée.** S'il y a plusieurs voies vers la science, son épistémologie peut être à la fois holiste et intuitive. Le dialogue étant fait pour appeler la pensée du lecteur, c'est à chacun de chercher par lui-même ce qu'est la science.
