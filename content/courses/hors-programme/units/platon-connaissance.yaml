        alt: []
  - id: platon-connaissance-i6
    title: "Les conditions de la réminiscence"
    notes: |-
      **Socrate pose d'abord (73c-74a) les conditions de la réminiscence.** Si une chose x fait se ressouvenir d'une chose y :
      - 1. il faut qu'auparavant on ait eu un savoir de y ;
      - 2. en percevant x, il faut reconnaître x et penser à y ;
      - 3. y doit être l'objet non pas du même, mais d'un autre savoir que x ;
      - 4. quand le ressouvenir vient d'une chose semblable, il faut se demander s'il manque ou non quelque chose à x pour ressembler à y.

      **Les exemples** : à la vue d'une lyre, l'amant pense au garçon à qui elle appartient (ressouvenir à partir du **dissemblable**) ; le portrait de Simmias rappelle Simmias lui-même (à partir du **semblable**).

      **La condition 3** : si le portrait et Simmias relevaient du même savoir, le portrait ne me rappellerait rien, car on ne peut se ressouvenir de ce à quoi l'on pense déjà. Il faut donc pouvoir saisir le portrait sans penser à Simmias. C'est plus clair avec la lyre, qu'on reconnaît comme un instrument, un bois tendu de cordes, sans penser à celui à qui elle appartient. **La condition 4** : on reconnaît qu'une image est toujours en défaut par rapport à ce dont elle est l'image, sans avoir besoin de penser à son modèle.

      **La difficulté surgit avec les bouts de bois égaux.** Selon la condition 4, voir que des bouts de bois sont égaux, c'est les comparer à l'Égalité pour juger s'ils lui ressemblent ou non parfaitement. Mais comparer deux choses, c'est les avoir toutes deux à l'esprit : il faudrait donc avoir déjà l'Idée en tête en regardant les bouts de bois. Dès lors, la perception ne peut plus être l'occasion de se ressouvenir de l'Idée (on l'aurait déjà), ni de former le concept d'égalité.
    points:
      - id: platon-connaissance-i6-p1
