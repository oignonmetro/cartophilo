  - id: platon-connaissance-i5
    title: "Concepts, référence et innéisme"
    notes: |-
      **Un concept est une unité de pensée, comme un mot est une unité du discours.** Le *Théétète* (189e), écrit après le *Phédon* et *La République*, fait de la pensée le **dialogue silencieux de l'âme avec elle-même** : au mot « égal » dans « les bouts de bois sont égaux » répond, dans la pensée, le concept d'égalité. Le *Phédon* pose que nous connaissons l'Égalité, que nous percevons des choses égales, que nous les comparons à l'Idée, et qu'il faut pour cela l'avoir connue auparavant.

      **Platon fait passer la référence avant le sens.** Pour nous, deux mots expriment le même concept s'ils ont le même sens, s'ils sont synonymes. Platon s'intéresse plutôt à la référence, c'est-à-dire à ce que le mot désigne. À la fin du dernier argument du *Phédon* (102b s.), « égal » est d'abord le nom de l'Égalité, et ne s'applique aux choses égales que par dérivation : elles en sont les **éponymes**, elles tiennent leur nom de l'Idée. Ce qui fait qu'un concept est ce concept-ci et non un autre, ce n'est donc pas ce que les locuteurs ont en tête, mais l'Idée à laquelle il renvoie.

      **Cela appuie la lecture large, innéiste** : on a le concept dès la naissance, sans le savoir, et on y associe peu à peu des croyances. La lecture étroite doit au contraire expliquer comment on acquiert les concepts ordinaires à partir de l'expérience. Or, dans le *Cratyle* (383-387c, 434e-435d), Platon rejette la conception des noms qu'il prête à Protagoras et aux héraclitéens, ce qui suggère qu'à ses yeux aucune explication empiriste (le concept viendrait de l'expérience) ou abstractionniste (on l'obtiendrait en dégageant ce qu'ont en commun les choses perçues) n'est viable.

      **Objection à la lecture étroite : les concepts y deviennent des coquilles vides**, que chacun remplit à sa façon : dans mon concept de beauté, la peau pâle ; dans le tien, l'éclat des couleurs. Si un concept n'est rien d'autre que ce que chacun y met, personne n'a le même concept : l'empirisme mène au mieux à des langages privés, et le concept change à chaque croyance ajoutée ou retirée.

      ! Ces objections ne suffisent pas à rejeter la lecture étroite : la lecture large a ses propres difficultés.
    points:
      - id: platon-connaissance-i5-p1
        sentence: "Dans le *Théétète* (189e), la pensée est le ___ silencieux de l'âme avec elle-même."
        answer: "dialogue"
        alt: []
      - id: platon-connaissance-i5-p2
        sentence: "La définition de la pensée comme dialogue silencieux de l'âme avec elle-même se trouve dans le *Théétète*, en ___."
        answer: "189e"
        alt: []
      - id: platon-connaissance-i5-p3
        sentence: "Là où nous distinguons les concepts par la synonymie, Platon fait passer la ___ avant le sens : ce qui individue un concept est son rapport à l'Idée."
        answer: "référence"
        alt: []
      - id: platon-connaissance-i5-p4
        sentence: "À la fin du dernier argument du *Phédon*, « égal » est le nom de l'Égalité et l'___ des choses égales."
        answer: "éponyme"
        alt: []
      - id: platon-connaissance-i5-p5
        sentence: "Pour Platon, ce qui individue un concept n'est pas ce qu'ont en tête les locuteurs, mais son rapport à l'___."
        answer: "Idée"
