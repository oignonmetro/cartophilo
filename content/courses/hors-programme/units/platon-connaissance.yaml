  - id: platon-connaissance-i10
    title: "Le Soleil et la Ligne"
    notes: |-
      **L'argument de la fin du livre V prépare les analogies du Soleil, de la Ligne et de la Caverne (livres VI et VII).**

      **Le Soleil oppose le visible et l'intelligible.** Le soleil engendre, nourrit et gouverne le visible, et donne à l'œil la lumière dont il a besoin pour voir. Dans l'intelligible, le Bien lui répond (508e) : « Eh bien, ce qui confère la vérité aux objets connaissables et accorde à celui qui connaît le pouvoir de connaître, tu peux déclarer que c'est la forme du bien. Comme elle est la cause de la connaissance et de la vérité, tu peux la concevoir comme objet de connaissance. » Le Bien est même responsable de l'être des objets connaissables, sans que Platon dise en quel sens (Santas).

      **La Ligne divise de nouveau chacun des deux domaines en deux segments inégaux :**

      | Segment | Objets | Capacité |
      | intelligible, haut | les Idées, dont le Bien | `noûs` : l'intellection, la science |
      | intelligible, bas | les objets des sciences | `dianoia` : la pensée discursive |
      | visible, haut | les objets physiques | `pistis` : la conviction, l'opinion |
      | visible, bas | les images, ombres et reflets | `eikasia` : l'imagination |

      **Le segment supérieur est clair** : ses objets sont les Idées, et parmi elles le Bien, à tenir pour le premier entre égaux ; la capacité qui s'y rapporte est le `noûs`. **La `pistis`**, littéralement la foi ou la conviction, est en général tenue pour l'opinion.

      ! Le Bien n'est pas seulement cause de la connaissance et de la vérité : il est lui-même __connaissable__.
