- id: p1-l3
  title: "Les fondements de l'obligation politique, et la postérité du dialogue"
  notes: |
    Pour établir l'obligation de Socrate envers elles, les Lois personnifiées
    s'appuient au total sur **deux arguments** : **l'accord** tacite de vivre
    à Athènes, et **les bienfaits** qu'il a reçus d'elles (éducation,
    protection, cadre de toute une vie). Selon elles, l'obligation de Socrate
    envers elles est même plus forte que celle qu'il a envers **ses parents**.

    Cette conclusion, obéir à la cité en toutes choses, semble pourtant
    entrer en tension avec une promesse faite dans l'**Apologie**, où Socrate
    annonçait qu'il continuerait à philosopher même si le tribunal le lui
    interdisait, quitte à lui désobéir. C'est **Grote**, historien du XIXe
    siècle, qui le premier a relevé cette tension entre les deux dialogues.

    Faute de trouver, en matière de bien et de mal, un expert comparable au
    médecin pour le corps, Socrate doit finalement **trancher seul**, la
    prosopopée des Lois ayant servi à instruire sa décision, non à s'y
    substituer.
  points:
  - id: p1-l3-p1
    sentence: "Criton 50a-54d : persuader ou obéir (ἢ πείθειν ἢ ποιεῖν ἃ ἂν κελεύῃ) Le dilemme final (54c-d) et son absence de réponse. Le discours des Lois se referme sur la formulation la plus dure du principe : si Socrate s'évade sans les avoir persuadées qu'elles agissent injustement envers lui, il commettra une action ni sainte ni juste, à la fois envers lui-même, envers ses proches, envers la cité et envers les lois elles-mêmes, et s'exposera à leur colère ainsi qu'à celle de leurs sœurs, les ___. Le dialogue se clôt aussitôt : Criton avoue n'avoir rien à répondre (οὐκ ἔχω, 54d), et Socrate conclut qu'il faut suivre la voie que le dieu leur montre. L'absence de réponse de Criton ne marque donc pas une aporie du dialogue, mais fonctionne comme l'acceptation silencieuse de la conclusion pratique à laquelle tout le raisonnement antérieur devait conduire."
    answer: "lois de l'Hadès"
    alt: []
  - id: p1-l3-p2
    sentence: "Pour établir l'obligation de Socrate envers elles, les Lois personnifiées s'appuient sur deux arguments : ___ tacite de vivre à Athènes, et les bienfaits qu'il a reçus d'elles"
    answer: "l'accord"
    alt: []
  - id: p1-l3-p3
    sentence: "Pour établir l'obligation de Socrate envers elles, les Lois personnifiées s'appuient sur deux arguments : l'accord tacite de vivre à Athènes, et ___ qu'il a reçus d'elles"
    answer: "les bienfaits"
    alt: []
  - id: p1-l3-p4
    sentence: "Selon les Lois personnifiées du Criton, l'obligation de Socrate envers elles est plus forte encore que celle qu'il a envers ___"
    answer: "ses parents"
    alt: []
  - id: p1-l3-p5
