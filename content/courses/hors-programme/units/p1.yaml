- id: p1-l1
  title: "La prosopopée des Lois d'Athènes"
  notes: |
    Le raisonnement qui précède (voir le cours « La morale ») aboutit à une
    **deuxième conclusion** du Criton : on doit respecter ses accords, à
    condition qu'ils soient **justes**.

    Reste à savoir si l'évasion respecterait, précisément, un accord juste
    envers la cité. Pour trancher, Socrate imagine un procédé rhétorique : que
    les **Lois d'Athènes** (grec `οἱ Νόμοι`), personnifiées, viennent
    l'interroger et lui exposer les raisons pour lesquelles il leur doit
    obéissance. Cette **prosopopée** occupe l'ensemble de la section
    **50a-54d** et constitue, dans l'économie du dialogue, l'instance qui doit
    trancher la question laissée en suspens en 48b-c.
  points:
  - id: p1-l1-p1
    sentence: "La deuxième conclusion du Criton est qu'on doit respecter ses accords, à condition qu'ils soient ___"
    answer: "justes"
    alt: []
  - id: p1-l1-p2
    sentence: "Criton 50a-54d : persuader ou obéir (ἢ πείθειν ἢ ποιεῖν ἃ ἂν κελεύῃ) Contexte. Après avoir établi en 48b qu'il faut se soucier non de vivre mais de bien vivre, c'est-à-dire de vivre justement, Socrate propose d'examiner si l'évasion serait un acte juste envers la cité. Pour mener cet examen, il imagine que les ___, personnifiées, viennent l'interroger et lui exposer les raisons pour lesquelles il leur doit obéissance. Cette prosopopée occupe l'ensemble de la section 50a-54d et constitue, dans l'économie du dialogue, l'instance qui doit trancher la question laissée en suspens en 48b-c."
    answer: "Lois d'Athènes (οἱ Νόμοι)"
    alt: []
  - id: p1-l1-p3
    sentence: "Criton 50a-54d : persuader ou obéir (ἢ πείθειν ἢ ποιεῖν ἃ ἂν κελεύῃ) Contexte. Après avoir établi en 48b qu'il faut se soucier non de vivre mais de bien vivre, c'est-à-dire de vivre justement, Socrate propose d'examiner si l'évasion serait un acte juste envers la cité. Pour mener cet examen, il imagine que les Lois d'Athènes (οἱ Νόμοι), personnifiées, viennent l'interroger et lui exposer les raisons pour lesquelles il leur doit obéissance. Cette prosopopée occupe l'ensemble de la section ___ et constitue, dans l'économie du dialogue, l'instance qui doit trancher la question laissée en suspens en 48b-c."
    answer: "50a-54d"
    alt: []

- id: p1-l2
  title: "Persuader ou obéir : le principe, son application, et le dilemme final"
  notes: |
    Les Lois personnifiées énoncent d'abord un principe général (51b-c) : un
    citoyen mécontent d'un ordre ou d'un jugement de la cité dispose d'une
    alternative stricte : soit il la persuade (`πείθειν`) de son erreur par
    les voies légitimes, soit, à défaut de l'avoir persuadée, il doit faire ce
    qu'elle lui ordonne (`ποιεῖν ἃ ἂν κελεύῃ`), quand bien même elle le
    condamnerait à mort ou le priverait de ses biens. Ce principe repose sur
    une analogie développée juste avant (**50e-51a**) entre la cité et les
    parents : de même qu'on ne rend pas coup pour coup à son père si celui-ci
    nous frappe, on ne doit pas non plus, envers la patrie, opposer la
    violence à la violence.

    Les Lois appliquent ensuite ce principe au cas de Socrate (51e-52a,
    52c-53a) : en demeurant à Athènes toute sa vie plutôt que de s'exiler, en
    y étant élevé, en s'y mariant, en y ayant des enfants, et en n'ayant
    jamais quitté la cité sauf en expédition militaire, il a donné son
    **accord tacite** (`ὁμολογία`) à vivre selon ses lois. Elles insistent
    particulièrement sur le fait qu'il n'a jamais **manifesté
    d'insatisfaction** envers elles pendant les soixante-dix ans qu'il y a
    vécu, alors qu'il aurait eu toute liberté de **s'exiler** s'il les jugeait
    mauvaises.

    Le discours des Lois se referme sur la formulation la plus dure du
    principe (54c-d) : si Socrate s'évade sans les avoir persuadées qu'elles
    agissent injustement envers lui, il commettra une action ni sainte ni
    juste, à la fois envers lui-même, envers ses proches, envers la cité et
    envers les lois elles-mêmes, et s'exposera à leur colère ainsi qu'à celle
    de leurs sœurs, les **lois de l'Hadès**. Le dialogue se clôt aussitôt :
    Criton avoue n'avoir rien à répondre (`οὐκ ἔχω`, 54d), et Socrate conclut
    qu'il faut suivre la voie que le dieu leur montre.

    ! Cette absence de réponse de Criton ne marque pas une aporie du
    dialogue : elle fonctionne comme l'acceptation silencieuse de la
    conclusion pratique à laquelle tout le raisonnement antérieur devait
    conduire.
  points:
  - id: p1-l2-p1
    sentence: "Criton 50a-54d : persuader ou obéir (ἢ πείθειν ἢ ποιεῖν ἃ ἂν κελεύῃ) Contexte. Après avoir établi en 48b qu'il faut se soucier non de vivre mais de bien vivre, c'est-à-dire de vivre justement, Socrate propose d'examiner si l'évasion serait un acte juste envers la cité. Pour mener cet examen, il imagine que les Lois d'Athènes (οἱ Νόμοι), personnifiées, viennent l'interroger et lui exposer les raisons pour lesquelles il leur doit obéissance. Cette ___ occupe l'ensemble de la section 50a-54d et constitue, dans l'économie du dialogue, l'instance qui doit trancher la question laissée en suspens en 48b-c."
    answer: "prosopopée"
    alt: []
  - id: p1-l2-p2
    sentence: "Criton 50a-54d : persuader ou obéir (ἢ πείθειν ἢ ποιεῖν ἃ ἂν κελεύῃ Le principe énoncé (51b-c). Les Lois affirment qu'un citoyen mécontent d'un ordre ou d'un jugement de la cité dispose d'une alternative stricte : soit il la persuade (πείθειν) de son erreur par les voies légitimes, soit, à défaut de l'avoir persuadée, il doit faire ce qu'elle lui ordonne (ποιεῖν ἃ ἂν κελεύῃ), quand bien même elle le condamnerait à mort ou le priverait de ses biens. Ce principe repose sur une analogie développée juste avant (___) entre la cité et les parents : de même qu'on ne rend pas coup pour coup à son père si celui-ci nous frappe, on ne doit pas non plus, envers la patrie, opposer la violence à la violence."
    answer: "50e-51a"
    alt: []
  - id: p1-l2-p3
    sentence: "Criton 50a-54d : persuader ou obéir (ἢ πείθειν ἢ ποιεῖν ἃ ἂν κελεύῃ) L'application au cas de Socrate (51e-52a, 52c-53a). Les Lois rappellent ensuite que Socrate, en demeurant à Athènes toute sa vie plutôt que de s'exiler, en y étant élevé, en s'y mariant, en y ayant des enfants, et en n'ayant jamais quitté la cité pour un autre pays sauf en expédition militaire, a donné son accord tacite (ὁμολογία) à vivre selon ses lois. Elles insistent particulièrement sur le fait qu'il n'a jamais ___ envers elles pendant les soixante-dix ans qu'il y a vécu, alors qu'il aurait eu toute liberté de s'exiler s'il les jugeait mauvaises."
    answer: "manifesté d'insatisfaction"
    alt: []
