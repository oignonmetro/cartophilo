  points:
  - id: cs2-1
    sentence: "La souveraineté, n'étant que l'exercice de la volonté générale, **ne peut s'aliéner ni être représentée** : « le pouvoir peut bien se transmettre, __mais non pas la__ ___ »."
    answer: volonté
    explanation: "« Je dis donc que la souveraineté n'étant que l'exercice de la volonté générale ne peut jamais s'aliéner, et que le souverain, qui n'est qu'un être collectif, ne peut être représenté que par lui-même ; le pouvoir peut bien se transmettre, mais non pas la volonté. »"
  - id: cs2-2
    sentence: "La souveraineté est indivisible : **Grotius et Barbeyrac**, qui la découpent en puissance législative et exécutive, en droits de guerre, de justice ou d'impôt, prennent pour des parties de l'autorité souveraine __ce qui n'en est que des__ ___."
    answer: émanations
    explanation: "« Par la même raison que la souveraineté est inaliénable, elle est indivisible. Car la volonté est générale, ou elle ne l'est pas ; elle est celle du corps du peuple, ou seulement d'une partie. » La déclaration de guerre, par exemple, n'est pas une loi mais une application de la loi. Rousseau compare ces théoriciens aux charlatans du Japon, qui dépècent un enfant et le font retomber vivant et rassemblé."
  - id: cs2-3a
    sentence: "« Il s'ensuit de ce qui précède que **la volonté générale est toujours droite** et tend toujours à l'utilité publique : __mais il ne s'ensuit pas que les__ ___ du peuple aient toujours la même rectitude. »"
    answer: délibérations
    explanation: "La suite : « On veut toujours son bien, mais on ne le voit pas toujours. » C'est la thèse même du chapitre ; la formule reviendra au chapitre 6, pour un autre usage."
  - id: cs2-3b
    sentence: "Il faut distinguer de la **volonté générale**, qui ne regarde qu'à l'intérêt commun, __la volonté de__ ___, qui regarde à l'intérêt privé et n'est qu'une somme de volontés particulières."
    answer: tous
  - id: cs2-3c
    sentence: "**Le peuple n'est jamais corrompu, mais il est souvent trompé** : __par les brigues et les associations__ ___, qui font prévaloir un intérêt de groupe sur l'intérêt commun."
    answer: partielles
    explanation: "D'où la conclusion du chapitre : pour que la volonté générale s'énonce bien, il ne doit pas y avoir de société partielle dans l'État."
- id: rousseau-contrat-social-l3
  title: "Repérage : les bornes du souverain et la loi (II, 4-6)"
  notes: |-
    **Absolu, le souverain est pourtant borné, et par sa nature même : la volonté générale doit partir de tous pour s'appliquer à tous. Le chapitre 6 en tire la définition de la loi, charnière du livre.** Les chapitres 4 et 5 marquent la {sky}limite{/sky} des propriétés établies en II, 1-3.

    | Chapitre | Thèse | Argument | Lien |
    | II, 4 | le souverain est absolu, mais borné | tournée vers un objet individuel et déterminé, la volonté générale perd sa rectitude | limite |
    | II, 5 | il peut exiger la vie du citoyen | le traité a pour fin la conservation des contractants ; le malfaiteur, qui a rompu le traité, est frappé comme ennemi | application |
    | II, 6 | la loi : tout le peuple statue sur tout le peuple | la volonté et la matière sont alors également générales ; nul n'est injuste envers lui-même | conséquence |

    Le texte : « le pouvoir Souverain, tout absolu, tout sacré, tout inviolable qu'il est, ne passe ni ne peut passer les bornes des conventions générales » (II, 4) ; « Le traité social a pour fin la conservation des contractants. Qui veut la fin veut aussi les moyens » (II, 5) ; « quand tout le peuple statue sur tout le peuple [...]. Alors la matière sur laquelle on statue est générale comme la volonté qui statue. C'est cet acte que j'appelle une loi » (II, 6).

    **Un lien à distance : II, 6 reprend II, 3.** « On veut toujours son bien, mais on ne le voit pas toujours » revient, pour un autre usage : en II, 3, le peuple qui ne voit pas son bien est trompé par les brigues ; en II, 6, il est aveugle, incapable de concevoir seul un code de lois.

    La charnière : le peuple soumis aux lois doit en être l'auteur, mais une multitude aveugle, qui souvent ne sait ce qu'elle veut, ne peut concevoir d'elle-même un système de législation. « Voilà d'où naît la nécessité d'un Législateur. »

    ! Le droit de vie et de mort n'est pas une exception aux bornes du souverain : il en est une application, puisque le malfaiteur n'est plus membre de l'État.
