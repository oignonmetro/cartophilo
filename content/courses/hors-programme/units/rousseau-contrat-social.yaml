    sentence: "Quant à la richesse, il faut « que nul citoyen ne soit assez opulent pour en pouvoir acheter un autre, __et nul assez pauvre pour être contraint de se__ ___ » (II, 11, § 2)."
    answer: "vendre"
  - id: rousseau-contrat-social-c11-q2
    sentence: "« C'est précisément parce que **la force des choses** tend toujours à détruire l'égalité, __que la force de la__ ___ __doit toujours tendre à la maintenir__. » (II, 11, § 3)"
    answer: "législation"
  - id: rousseau-contrat-social-c11-q3
    sentence: "« Occupez-vous des rivages étendus et commodes ? Couvrez la mer de vaisseaux, cultivez le commerce et la navigation ; __vous aurez une existence brillante et__ ___. » (II, 11, § 4)"
    answer: "courte"
  - id: rousseau-contrat-social-c11-q4
    sentence: "Si le Législateur prend un principe contraire à la nature des choses, l'État sera agité « jusqu'à ce qu'il soit détruit ou changé, __et que l'invincible__ ___ __ait repris son empire__ » (II, 11, § 5)."
    answer: "nature"
- id: rousseau-contrat-social-c12
  title: "Repérage : la division des lois (II, 12)"
  notes: |-
    **Le chapitre 12 classe les lois selon les rapports qu'elles règlent, et fait des mœurs la plus importante de toutes.**

    | Moment | Lieu | Ce qui s'y joue | Lien |
    | les lois politiques | § 1-2 | le rapport du tout au tout, du Souverain à l'État ; un peuple reste maître de changer ses lois | point de départ |
    | les lois civiles | § 3 | les membres entre eux : indépendance de chacun à l'égard des autres, dépendance à l'égard de la Cité | déclinaison |
    | les lois criminelles | § 4 | moins une espèce de lois que la sanction de toutes les autres | déclinaison |
    | les mœurs | § 5 | gravées dans les cœurs des citoyens, elles font la véritable constitution de l'État | déclinaison |
    | retour au sujet | § 6 | seules les lois politiques relèvent de l'ouvrage | conclusion |

    ! Les lois criminelles ne règlent pas un rapport de plus : elles sanctionnent les autres.
