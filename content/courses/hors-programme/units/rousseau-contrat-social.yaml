  points:
  - id: rousseau-contrat-social-c2-q1
    sentence: "« Dans le premier cas cette volonté déclarée est un acte de souveraineté et fait loi : Dans le second, ce n'est qu'une volonté particulière, ou un acte de magistrature ; __c'est un__ ___ __tout au plus__. » (II, 2, § 1)"
    answer: "décret"
  - id: rousseau-contrat-social-c2-q2
    sentence: "« Mais **nos politiques** ne pouvant diviser la souveraineté dans son principe, __la divisent dans son__ ___ » (II, 2, § 2)."
    answer: "objet"
  - id: rousseau-contrat-social-c2-q3
    sentence: "Image de ceux qui divisent la souveraineté : « __Les charlatans du__ ___ dépècent, dit-on, un enfant aux yeux des spectateurs, puis jetant en l'air tous ses membres l'un après l'autre, ils font retomber l'enfant vivant et tout rassemblé » (II, 2, § 2)."
    answer: "Japon"
  - id: rousseau-contrat-social-c2-q4
    sentence: "Déclarer la guerre ou faire la paix ne sont pas des actes de souveraineté, « puisque chacun de ces actes n'est point une loi __mais seulement une__ ___ __de la loi__ » (II, 2, § 3)."
    answer: "application"
  - id: rousseau-contrat-social-c2-q5
    sentence: "Contre Grotius et Barbeyrac : « Or la vérité __ne mène point à la__ ___ et le peuple ne donne ni ambassades, ni chaires, ni pensions. » (II, 2, § 5)"
    answer: "fortune"
- id: rousseau-contrat-social-c3
  title: "Repérage : la volonté générale peut-elle errer ? (II, 3)"
  notes: |-
    **Le chapitre 3 distingue la rectitude de la volonté générale de celle des délibérations du peuple, et cherche à quelles conditions celles-ci l'énoncent.**

    | Moment | Lieu | Ce qui s'y joue | Lien |
    | la volonté générale est toujours droite | § 1 | mais non les délibérations : on ne corrompt jamais le peuple, souvent on le trompe | point de départ |
    | volonté de tous et volonté générale | § 2 | une somme de volontés particulières, ou ce qui reste quand les plus et les moins s'entre-détruisent | distinction |
    | les associations partielles | § 3 | sans communication, la somme des petites différences donne la volonté générale ; une brigue dominante la réduit à un avis particulier | explication |
    | les remèdes | § 4 | pas de société partielle, sinon en multiplier le nombre et en prévenir l'inégalité | conséquence |

    ! La volonté générale n'est pas ce que décide le peuple, quoi qu'il décide : un peuple trompé peut voter contre elle.
