  points:
  - id: cs2-11a
    sentence: "« Si l'on recherche en quoi consiste précisément le **plus grand bien de tous**, qui doit être la fin de tout système de législation, on trouvera qu'il se réduit à ces deux objets principaux, __la liberté et__ l'___. »"
    answer: égalité
    explanation: "« La liberté, parce que toute dépendance particulière est autant de force ôtée au corps de l'État ; l'égalité, parce que la liberté ne peut subsister sans elle. »"
  - id: cs2-11b
    sentence: "Les deux fins de toute législation, **liberté et égalité**, se modifient en chaque pays selon __la situation locale et le__ ___ des habitants : chaque peuple reçoit un système de législation qui lui est propre."
    answer: caractère
  - id: cs2-12a
    sentence: "Des **quatre espèces de lois**, __les lois__ ___, ou fondamentales, règlent le rapport du tout au tout, du Souverain à l'État : ce sont les seules dont traite l'ouvrage, d'où le passage au gouvernement."
    answer: politiques
    explanation: "Les trois autres : les lois civiles (rapports des membres entre eux ou avec le corps entier), les lois criminelles (rapport de la désobéissance à la peine), et les mœurs. Le livre s'achève ainsi : « Entre ces diverses Classes, les lois politiques, qui constituent la forme du Gouvernement, sont la seule relative à mon sujet. »"
  - id: cs2-12b
    sentence: "« À ces trois sortes de lois, il s'en joint une **quatrième**, la plus importante de toutes ; qui ne se grave ni sur le marbre ni sur l'airain, mais dans les cœurs des citoyens [...] Je parle des mœurs, des coutumes, et __surtout de__ l'___. »"
    answer: opinion
- id: rousseau-contrat-social-c11
  title: "Repérage : les systèmes de législation (II, 11)"
  notes: |-
    **Le chapitre 11 dit les deux fins de toute législation, la liberté et l'égalité, puis comment elles se modifient selon chaque peuple.**

    | Moment | Lieu | Ce qui s'y joue | Lien |
    | les deux fins | § 1 | liberté et égalité, car la liberté ne peut subsister sans l'égalité | point de départ |
    | ce qu'est l'égalité | § 2 | non des degrés identiques : nul assez opulent pour acheter un autre, nul assez pauvre pour se vendre | précision |
    | une chimère ? | § 3 | la force des choses détruit l'égalité, la force de la législation doit la maintenir | objection |
    | un système propre à chaque peuple | § 4 | la situation locale et le caractère des habitants : industrie, agriculture, mer | application |
    | la convenance | § 5 | les lois doivent accompagner les rapports naturels, sinon l'invincible nature reprend son empire | conclusion |

    ! L'égalité visée n'est pas une égalité de fait des fortunes : c'est l'absence de toute dépendance d'un citoyen à l'égard d'un autre.
