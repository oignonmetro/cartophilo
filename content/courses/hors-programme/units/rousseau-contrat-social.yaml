          answer: Législateur
  recaps:
    - at: l2-1-3
      label: "chap. 1-3"
      title: "Ce qu'est la souveraineté : inaliénable, indivisible, droite"
      notes: |-
        **Les trois premiers chapitres tirent les propriétés de la souveraineté de sa définition : n'étant que l'exercice de la volonté générale, elle en a tous les caractères.** Ils sont de même plan : trois faces d'une même idée, non trois étapes.

        | Chapitre | La souveraineté est… | parce que… |
        | II, 1 | inaliénable : elle ne peut être ni cédée ni représentée | le pouvoir peut se transmettre, mais non la volonté ; un peuple qui promet d'obéir à un maître cesse d'être un peuple |
        | II, 2 | indivisible | la volonté est générale ou ne l'est pas ; législatif, exécutif, droit de guerre, de justice ou d'impôt n'en sont que des émanations (contre Grotius et Barbeyrac) |
        | II, 3 | toujours droite | la volonté générale ne regarde qu'à l'intérêt commun ; seules les brigues et les associations partielles trompent le peuple |

        Le texte : « le pouvoir peut bien se transmettre, mais non pas la volonté » (II, 1) ; « la volonté générale est toujours droite et tend toujours à l'utilité publique : mais il ne s'ensuit pas que les délibérations du peuple aient toujours la même rectitude » (II, 3).

        La **volonté de tous** n'est qu'une somme de volontés particulières, qui regarde à l'intérêt privé ; la **volonté générale** regarde à l'intérêt commun. Le peuple n'est jamais corrompu, mais il est souvent trompé : on veut toujours son bien, mais on ne le voit pas toujours, formule que le chapitre 6 reprendra pour un autre usage.

        ! La volonté générale n'est ni la volonté de tous ni celle de la majorité : c'est la volonté tournée vers l'intérêt commun.
    - at: l2-4-5
      label: "chap. 4-6"
      title: "Les bornes du souverain, et ce qu'est une loi"
      notes: |-
        **Absolu, le souverain est pourtant borné, et par sa nature même : la volonté générale doit partir de tous pour s'appliquer à tous. Le chapitre 6 en tire la définition de la loi, charnière du livre.**

        | Chapitre | Thèse | Argument |
        | II, 4 | le souverain est absolu, mais borné | tournée vers un objet individuel et déterminé, la volonté générale perd sa rectitude |
        | II, 5 (application) | il peut exiger la vie du citoyen | le traité a pour fin la conservation des contractants ; le malfaiteur, qui a rompu le traité, est frappé comme ennemi |
        | II, 6 (conséquence) | la loi : tout le peuple statue sur tout le peuple | la volonté et la matière sont alors également générales ; nul n'est injuste envers lui-même |

        Le texte : « le pouvoir Souverain, tout absolu, tout sacré, tout inviolable qu'il est, ne passe ni ne peut passer les bornes des conventions générales » (II, 4) ; « Le traité social a pour fin la conservation des contractants. Qui veut la fin veut aussi les moyens » (II, 5) ; « quand tout le peuple statue sur tout le peuple [...]. Alors la matière sur laquelle on statue est générale comme la volonté qui statue. C'est cet acte que j'appelle une loi » (II, 6).

        La charnière : le peuple soumis aux lois doit en être l'auteur, mais une multitude aveugle, qui souvent ne sait ce qu'elle veut, ne peut concevoir d'elle-même un système de législation. « Voilà d'où naît la nécessité d'un Législateur. »

        ! Le droit de vie et de mort n'est pas une exception aux bornes du souverain : il en est une application, puisque le malfaiteur n'est plus membre de l'État.
    - at: l2-7
      label: "chap. 7-10"
      title: "Le Législateur, et le peuple propre à recevoir des lois"
      notes: |-
        **Comment le peuple peut-il se donner de bonnes lois ? Par un Législateur qui les propose sans rien imposer (chap. 7), à un peuple qui soit en état de les recevoir (chap. 8-10).**

        | Chapitre | Thèse | Argument |
        | II, 7 | le Législateur propose, le peuple adopte | seule la volonté générale oblige : celui qui rédige les lois n'a aucun droit législatif |
        | II, 8 | le peuple doit être encore jeune | une fois les coutumes établies et les préjugés enracinés, il est dangereux et vain de les réformer |
        | II, 9 | l'État, ni trop grand ni trop petit | plus le lien social s'étend, plus il se relâche |
        | II, 10 | la terre doit nourrir ses habitants | ce sont les hommes qui font l'État, et le terrain qui nourrit les hommes ; il faut aussi l'abondance et la paix |

        Le texte : « Celui qui ose entreprendre d'instituer un peuple doit se sentir en état de changer, pour ainsi dire, la nature humaine » (II, 7) ; « Plus le lien social s'étend, plus il se relâche, et en général un petit État est proportionnellement plus fort qu'un grand » (II, 9) ; le rapport est « que la terre suffise à l'entretien de ses habitants, et qu'il y ait autant d'habitants que la terre en peut nourrir » (II, 10).

        Ne pouvant employer ni la force ni le raisonnement, le Législateur met ses décisions dans la bouche des immortels. Au chapitre 8, l'image de l'architecte qui sonde le sol avant d'élever un édifice : le sage instituteur examine d'abord si le peuple est propre à supporter les lois.

        ! Le Législateur n'est ni magistrat ni souverain : il n'a aucun droit législatif, et n'impose rien.
    - at: l2-11
      label: "chap. 11-12"
      title: "Les fins de la législation, et les sortes de lois"
      notes: |-
        **Les deux derniers chapitres disent à quoi doit tendre toute législation, la liberté et l'égalité, puis distinguent quatre sortes de lois, dont la plus importante ne s'écrit pas : les mœurs.**

        | Chapitre | Thèse | Argument |
        | II, 11 | les lois doivent viser la liberté et l'égalité | toute dépendance particulière ôte autant de force à l'État, et la liberté ne peut subsister sans l'égalité |
        | II, 12 | quatre sortes de lois, dont la plus importante : les mœurs | chacune règle un rapport différent ; les mœurs font la véritable constitution de l'État |

        Le texte : le plus grand bien de tous « se réduit à ces deux objets principaux, la liberté et l'égalité » (II, 11) ; la quatrième sorte de lois, « la plus importante de toutes ; qui ne se grave ni sur le marbre ni sur l'airain, mais dans les cœurs des citoyens [...] Je parle des mœurs, des coutumes, et surtout de l'opinion » (II, 12).

        Liberté et égalité se modifient selon la situation locale et le caractère des habitants : chaque peuple reçoit un système qui lui est propre. Les lois **politiques**, ou fondamentales, règlent le rapport du tout au tout, du Souverain à l'État ; ce sont les seules dont traite l'ouvrage, d'où le passage au gouvernement (livre III).

        ! Les mœurs ne sont pas un simple complément des lois : Rousseau en fait la plus importante de toutes.
