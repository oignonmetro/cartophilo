  points:
  - id: rousseau-contrat-social-c4-q1
    sentence: "Le pacte social donne au corps politique un pouvoir absolu sur tous ses membres, « et c'est ce même pouvoir, qui, dirigé par la volonté générale porte, comme j'ai dit, __le nom de__ ___ » (II, 4, § 1)."
    answer: "souveraineté"
  - id: rousseau-contrat-social-c4-q2
    sentence: "Chacun n'aliène que la partie de sa puissance, de ses biens et de sa liberté dont l'usage importe à la communauté, « mais il faut convenir aussi __que le Souverain seul est__ ___ __de cette importance__ » (II, 4, § 3)."
    answer: "juge"
  - id: rousseau-contrat-social-c4-q3
    sentence: "« mais **le Souverain** de son côté __ne peut charger les sujets d'aucune chaîne__ ___ __à la communauté__ » (II, 4, § 4)."
    answer: "inutile"
  - id: rousseau-contrat-social-c4-q4
    sentence: "La volonté générale, pour être vraiment telle, « __doit partir de tous pour s'appliquer à__ ___ » (II, 4, § 5)."
    answer: "tous"
  - id: rousseau-contrat-social-c4-q5
    sentence: "« On doit concevoir par là, que **ce qui généralise la volonté** est moins le nombre des voix __que l'__ ___ __qui les unit__ » (II, 4, § 7)."
    answer: "intérêt commun"
  - id: rousseau-contrat-social-c4-q6
    sentence: "Dans la délibération commune, chacun se soumet aux conditions qu'il impose aux autres : « __accord admirable de l'intérêt et de la__ ___ » (II, 4, § 7)."
    answer: "justice"
  - id: rousseau-contrat-social-c4-q7
    sentence: "**L'acte de souveraineté** « n'est pas une convention du supérieur avec l'inférieur, __mais une convention du__ ___ __avec chacun de ses membres__ » (II, 4, § 8)."
    answer: "corps"
  - id: rousseau-contrat-social-c4-q8
    sentence: "Par le contrat, les particuliers ne renoncent à rien : « au lieu d'une aliénation, __ils n'ont fait qu'un__ ___ __avantageux__ » (II, 4, § 10)."
    answer: "échange"
- id: rousseau-contrat-social-c5
  title: "Repérage : le droit de vie et de mort (II, 5)"
  notes: |-
    **Le chapitre 5 répond à une objection : comment des particuliers qui ne peuvent disposer de leur vie donneraient-ils ce droit au souverain ?** Il en tire le droit d'exposer le citoyen, puis la peine de mort et le droit de grâce.

    | Moment | Lieu | Ce qui s'y joue | Lien |
    | la question mal posée | § 1 | tout homme a droit de risquer sa vie pour la conserver | point de départ |
    | la vie, don de l'État | § 2 | qui veut la fin veut les moyens : le citoyen doit mourir si la loi l'exige | réponse |
    | la peine de mort | § 3-4 | on consent à mourir si l'on devient assassin ; le malfaiteur, qui a rompu le traité, meurt en ennemi | application |
    | la condamnation, acte particulier | § 5 | elle n'appartient pas au souverain, qui peut seulement en conférer le droit | objection |
    | la rareté des supplices et des grâces | § 6-7 | la fréquence des supplices est signe de faiblesse ; le droit de grâce n'appartient qu'au souverain | limite |

    ! Le chapitre s'accorde mal avec le reste du livre : il fait du criminel un ennemi, alors que la guerre est une relation d'État à État (I, 4).
  tables:
  - table: moment-lieu-ce-qui-s-y-joue-lien
    exercises:
    - {kind: order, column: Lieu}
    - {kind: bank, column: Lien}
    - {kind: cell, column: Lieu}
  points:
  - id: rousseau-contrat-social-c5-q1
    sentence: "Contre l'objection, « __Tout homme a droit de__ ___ **sa propre vie** pour la conserver. » (II, 5, § 1)"
    answer: "risquer"
  - id: rousseau-contrat-social-c5-q2
    sentence: "Exposé par la loi, le citoyen doit mourir, « puisque ce n'est qu'à cette condition qu'il a vécu en sûreté jusqu'alors, et que sa vie n'est plus seulement un bienfait de la nature, __mais un don__ ___ __de l'État__ » (II, 5, § 2)."
    answer: "conditionnel"
  - id: rousseau-contrat-social-c5-q3
    sentence: "« La peine de mort infligée aux criminels peut être envisagée à peu près sous le même point de vue : __c'est pour n'être pas la victime d'un__ ___ __que l'on consent à mourir si on le devient__. » (II, 5, § 3)"
    answer: "assassin"
  - id: rousseau-contrat-social-c5-q4
    sentence: "La condamnation d'un criminel est un acte particulier, « aussi cette condamnation n'appartient-elle point au Souverain ; __c'est un droit qu'il peut__ ___ __sans pouvoir l'exercer lui-même__ » (II, 5, § 5)."
    answer: "conférer"
  - id: rousseau-contrat-social-c5-q5
    sentence: "« Au reste, **la fréquence des supplices** __est toujours un signe de faiblesse ou de__ ___ __dans le Gouvernement__. » (II, 5, § 6)"
    answer: "paresse"
- id: rousseau-contrat-social-c6
  title: "Repérage : la loi (II, 6)"
  notes: |-
    **Le chapitre 6, pivot du livre, définit la loi : le pacte a donné l'existence au corps politique, la législation doit lui donner le mouvement et la volonté.** Il s'achève sur le problème que les chapitres suivants résolvent.

    | Moment | Lieu | Ce qui s'y joue | Lien |
    | de l'existence au mouvement | § 1 | l'acte primitif ne détermine rien de ce que le corps doit faire pour se conserver | point de départ |
    | pourquoi des lois | § 2 | la justice universelle, sans sanction naturelle, n'est admise qu'à condition d'être réciproque | justification |
    | qu'est-ce qu'une loi ? | § 3-5 | pas de volonté générale sur un objet particulier ; quand tout le peuple statue sur tout le peuple, c'est une loi | définition |
    | l'objet toujours général | § 6 | la loi peut établir des privilèges ou une royauté, jamais nommer quelqu'un | précision |
    | les conséquences | § 7-8 | qui fait les lois, si le Prince est au-dessus d'elles, si la loi peut être injuste ; le décret n'est pas une loi | conséquence |
    | la République | § 9 | tout État régi par des lois, sous quelque forme d'administration que ce soit | conséquence |
    | le problème | § 10 | le peuple, auteur des lois, est une multitude aveugle : la nécessité d'un Législateur | problème |

    ! « République » ne désigne pas une forme de gouvernement : tout gouvernement légitime, même royal, est républicain.
  tables:
  - table: moment-lieu-ce-qui-s-y-joue-lien
    exercises:
    - {kind: order, column: Lieu}
    - {kind: bank, column: Lien}
    - {kind: cell, column: Lieu}
  points:
  - id: rousseau-contrat-social-c6-q1
    sentence: "« Par le pacte social nous avons donné l'existence et la vie au corps politique : __il s'agit maintenant de lui donner le mouvement et la__ ___ __par la législation__. » (II, 6, § 1)"
    answer: "volonté"
  - id: rousseau-contrat-social-c6-q2
    sentence: "« **Toute justice vient de Dieu**, lui seul en est la source ; __mais si nous savions la recevoir de si haut nous n'aurions besoin ni de gouvernement ni de__ ___. » (II, 6, § 2)"
    answer: "lois"
  - id: rousseau-contrat-social-c6-q3
    sentence: "« Sans doute il est **une justice universelle** émanée de la raison seule ; __mais cette justice pour être admise entre nous doit être__ ___. » (II, 6, § 2)"
    answer: "réciproque"
  - id: rousseau-contrat-social-c6-q4
    sentence: "« Quand je dis que **l'objet des lois** est toujours général, __j'entends que la loi considère les sujets en corps et les actions comme__ ___, jamais un homme comme individu ni une action particulière. » (II, 6, § 6)"
    answer: "abstraites"
  - id: rousseau-contrat-social-c6-q5
    sentence: "On ne demande plus « comment on est libre et soumis aux lois, __puisqu'elles ne sont que des__ ___ __de nos volontés__ » (II, 6, § 7)."
    answer: "registres"
  - id: rousseau-contrat-social-c6-q6
    sentence: "« J'appelle donc ___ **tout État régi par des lois**, sous quelque forme d'administration que ce puisse être » (II, 6, § 9)."
    answer: "République"
- id: rousseau-contrat-social-l4
  title: "Repérage : le Législateur et le peuple (II, 7-10)"
  notes: |-
    **Comment le peuple peut-il se donner de bonnes lois ? Par un Législateur qui les propose sans rien imposer (chap. 7), à un peuple qui soit en état de les recevoir (chap. 8-10).** Le bloc répond au problème que pose la fin de II, 6.

    | Chapitre | Thèse | Argument | Lien |
    | II, 7 | le Législateur propose, le peuple adopte | seule la volonté générale oblige : celui qui rédige les lois n'a aucun droit législatif | solution |
    | II, 8 | le peuple doit être encore jeune | une fois les coutumes établies et les préjugés enracinés, il est dangereux et vain de les réformer | application |
    | II, 9 | l'État, ni trop grand ni trop petit | plus le lien social s'étend, plus il se relâche | déclinaison |
    | II, 10 | la terre doit nourrir ses habitants | ce sont les hommes qui font l'État, et le terrain qui nourrit les hommes ; il faut aussi l'abondance et la paix | déclinaison |

    **Un lien à distance : II, 7 résout le problème de II, 6.** Le peuple, auteur légitime des lois, veut le bien sans toujours le voir ; il faut unir l'entendement à la volonté dans le corps social : « Voilà d'où naît la nécessité d'un Législateur. »

    Le texte : « Celui qui ose entreprendre d'instituer un peuple doit se sentir en état de changer, pour ainsi dire, la nature humaine » (II, 7) ; « Plus le lien social s'étend, plus il se relâche, et en général un petit État est proportionnellement plus fort qu'un grand » (II, 9) ; le rapport est « que la terre suffise à l'entretien de ses habitants, et qu'il y ait autant d'habitants que la terre en peut nourrir » (II, 10).

    Ne pouvant employer ni la force ni le raisonnement, le Législateur met ses décisions dans la bouche des immortels. Au chapitre 8, l'image de l'architecte qui sonde le sol avant d'élever un édifice : le sage instituteur examine d'abord si le peuple est propre à supporter les lois.

    ! Le Législateur n'est ni magistrat ni souverain : il n'a aucun droit législatif, et n'impose rien.
  tables:
  - table: chapitre-these-argument-lien
    exercises:
    - {kind: order, column: Chapitre}
    - {kind: bank, column: Lien}
    - {kind: cell, column: Chapitre}
  points:
  - id: cs2-lien-6-7
    sentence: "Le peuple, auteur légitime des lois, veut le bien sans toujours le voir ; il faut **unir l'entendement à la volonté** dans le corps social : « Voilà d'où naît __la nécessité d'un__ ___. »"
    answer: Législateur
  - id: cs2-7a
    sentence: "« Celui qui ose entreprendre d'**instituer un peuple** doit se sentir en état de __changer, pour ainsi dire, la__ ___ humaine », faire de chaque individu, tout parfait et solitaire, la partie d'un plus grand tout."
    answer: nature
  - id: cs2-7b
    sentence: "Le **Législateur** n'est ni magistrat ni souverain : celui qui rédige les lois __n'a aucun droit__ ___, seul le peuple pouvant les faire siennes par ses suffrages."
    answer: législatif
  - id: cs2-7c
    sentence: "Ne pouvant employer ni la force ni le raisonnement pour persuader le peuple, le Législateur recourt à une **autorité d'un autre ordre** : __il met ses décisions dans la bouche des__ ___, pour entraîner par l'autorité divine ceux que la prudence humaine n'ébranlerait pas."
    answer: immortels
    alt: [dieux]
  - id: cs2-8a
    sentence: "« Comme avant d'élever un grand édifice l'architecte observe et sonde le sol, [...] le **sage instituteur** ne commence pas par rédiger de bonnes lois en elles-mêmes, mais il examine auparavant si le peuple auquel il les destine __est propre à les__ ___. »"
    answer: supporter
  - id: cs2-8b
    sentence: "La **première des conditions** qui rendent un peuple propre à recevoir des lois tient à son âge : les peuples, comme les hommes, __ne sont dociles que dans leur__ ___ ; une fois les coutumes établies et les préjugés enracinés, il est trop tard pour les réformer."
    answer: jeunesse
  - id: cs2-9
    sentence: "La **deuxième des conditions** qui rendent un peuple propre à recevoir des lois tient à l'étendue de l'État, ni trop grand pour être bien gouverné, ni trop petit pour se maintenir : « Plus le lien social s'étend, __plus il se__ ___, et en général un petit État est proportionnellement plus fort qu'un grand. »"
    answer: relâche
  - id: cs2-10a
    sentence: "La **troisième des conditions** qui rendent un peuple propre à recevoir des lois tient au rapport entre le territoire et la population : « ce rapport est donc que la terre suffise à l'entretien de ses habitants, et qu'il y ait __autant d'habitants que la terre en peut__ ___ »."
    answer: nourrir
    explanation: "« Ce sont les hommes qui font l'État, et c'est le terrain qui nourrit les hommes ; ce rapport est donc que la terre suffise à l'entretien de ses habitants, et qu'il y ait autant d'habitants que la terre en peut nourrir. »"
  - id: cs2-10b
    sentence: "Aux conditions qui rendent un peuple propre à recevoir des lois (âge, étendue, rapport entre terre et habitants) **s'en ajoute une de moment** : on n'institue un peuple que s'il jouit de __l'abondance et de la__ ___, le temps où l'État s'ordonne étant celui où il résiste le moins."
    answer: paix
    explanation: "C'est au terme de ce chapitre que Rousseau nomme la Corse, seul pays d'Europe encore capable de recevoir une législation."
- id: rousseau-contrat-social-c7
  title: "Repérage : le Législateur (II, 7)"
  notes: |-
    **Le chapitre 7 fait paraître une figure hors du commun, qui rédige les lois sans pouvoir les imposer : le peuple seul les fait siennes.** D'où sa difficulté propre, qu'il résout par une autorité d'un autre ordre.

    | Moment | Lieu | Ce qui s'y joue | Lien |
    | il faudrait des Dieux | § 1-2 | une intelligence supérieure ; le Législateur, mécanicien qui invente la machine | point de départ |
    | changer la nature humaine | § 3 | faire de chaque individu, tout parfait et solitaire, la partie d'un plus grand tout | précision |
    | un emploi hors de la constitution | § 4-7 | ni magistrature ni souveraineté : Lycurgue abdique ; celui qui rédige les lois n'a aucun droit législatif | limite |
    | deux choses incompatibles | § 8 | une entreprise au-dessus de la force humaine, une autorité qui n'est rien | difficulté |
    | l'autorité d'un autre ordre | § 9-11 | ni force ni raisonnement : entraîner sans violence, persuader sans convaincre ; la grande âme du Législateur | solution |
    | politique et religion | § 12 | contre Warburton : à l'origine des nations, l'une sert d'instrument à l'autre | précision |

    ! Le Législateur intervient pour l'institution du peuple, non dans le peuple institué : une fois la république établie, le peuple fait lui-même ses lois.
