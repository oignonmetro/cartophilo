# Refondue le 2026-11-27 depuis l'ancienne unité-œuvre à plan (`work:`) : pour
# l'instant, la structure seule. Un plan général, puis un sous-repérage par
# bloc de chapitres, chacun avec une colonne « Lien » (les relations de
# l'ancien plan) ; les cartes de l'ancien plan y sont rangées, identifiants et
# explications gardés. Rappels de chapitre et cartes manquantes viendront d'un
# notebook NotebookLM que fournira l'utilisateur.
