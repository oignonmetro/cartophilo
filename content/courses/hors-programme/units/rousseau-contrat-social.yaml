lessons:
- id: rousseau-contrat-social-l1
  title: "Repérage : le plan du livre II (II, 1-12)"
  notes: |-
    Le livre II traite **de la législation**, au sens actif : faire des lois. Il se divise autour de son {sky}chapitre 6{/sky}, qui définit la loi : {green}__avant lui, la théorie de la souveraineté__{/green}, c'est-à-dire de la volonté générale qui seule fait loi ; {green}__après lui, la manière dont un peuple peut se donner des lois__{/green}, par un Législateur qui les propose à un peuple en état de les recevoir.

    | Mouvement | Lieu | Ce qui s'y joue | Lien |
    | les propriétés de la souveraineté | II, 1-3 | exercice de la volonté générale, la souveraineté est inaliénable, indivisible et toujours droite | point de départ |
    | les bornes du souverain | II, 4-5 | absolu, le souverain est pourtant borné par la généralité de son objet ; le droit de vie et de mort en est un cas | limite |
    | la loi | II, 6 | tout le peuple statue sur tout le peuple ; mais une multitude aveugle ne peut concevoir seule ses lois | conséquence |
    | le Législateur et le peuple | II, 7-10 | un Législateur sans droit législatif propose les lois à un peuple propre à les supporter | problème-solution |
    | les fins et les sortes de lois | II, 11-12 | liberté et égalité, modifiées selon chaque peuple ; quatre sortes de lois, dont les mœurs | conséquence |

    {coral}__Le chapitre 6 est la charnière du livre__{/coral} : il achève la théorie de la volonté générale et ouvre le problème que les chapitres suivants résolvent, celui de sa formation.
