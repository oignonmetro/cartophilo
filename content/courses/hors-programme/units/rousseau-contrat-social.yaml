  - id: cs2-7a
    sentence: "« Celui qui ose entreprendre d'**instituer un peuple** doit se sentir en état de __changer, pour ainsi dire, la__ ___ humaine », faire de chaque individu, tout parfait et solitaire, la partie d'un plus grand tout."
    answer: nature
  - id: cs2-7b
    sentence: "Le **Législateur** n'est ni magistrat ni souverain : celui qui rédige les lois __n'a aucun droit__ ___, seul le peuple pouvant les faire siennes par ses suffrages."
    answer: législatif
  - id: cs2-7c
    sentence: "Ne pouvant employer ni la force ni le raisonnement pour persuader le peuple, le Législateur recourt à une **autorité d'un autre ordre** : __il met ses décisions dans la bouche des__ ___, pour entraîner par l'autorité divine ceux que la prudence humaine n'ébranlerait pas."
    answer: immortels
    alt: [dieux]
  - id: cs2-8a
    sentence: "« Comme avant d'élever un grand édifice l'architecte observe et sonde le sol, [...] le **sage instituteur** ne commence pas par rédiger de bonnes lois en elles-mêmes, mais il examine auparavant si le peuple auquel il les destine __est propre à les__ ___. »"
    answer: supporter
  - id: cs2-8b
    sentence: "La **première des conditions** qui rendent un peuple propre à recevoir des lois tient à son âge : les peuples, comme les hommes, __ne sont dociles que dans leur__ ___ ; une fois les coutumes établies et les préjugés enracinés, il est trop tard pour les réformer."
    answer: jeunesse
  - id: cs2-9
    sentence: "La **deuxième des conditions** qui rendent un peuple propre à recevoir des lois tient à l'étendue de l'État, ni trop grand pour être bien gouverné, ni trop petit pour se maintenir : « Plus le lien social s'étend, __plus il se__ ___, et en général un petit État est proportionnellement plus fort qu'un grand. »"
    answer: relâche
  - id: cs2-10a
    sentence: "La **troisième des conditions** qui rendent un peuple propre à recevoir des lois tient au rapport entre le territoire et la population : « ce rapport est donc que la terre suffise à l'entretien de ses habitants, et qu'il y ait __autant d'habitants que la terre en peut__ ___ »."
    answer: nourrir
    explanation: "« Ce sont les hommes qui font l'État, et c'est le terrain qui nourrit les hommes ; ce rapport est donc que la terre suffise à l'entretien de ses habitants, et qu'il y ait autant d'habitants que la terre en peut nourrir. »"
  - id: cs2-10b
    sentence: "Aux conditions qui rendent un peuple propre à recevoir des lois (âge, étendue, rapport entre terre et habitants) **s'en ajoute une de moment** : on n'institue un peuple que s'il jouit de __l'abondance et de la__ ___, le temps où l'État s'ordonne étant celui où il résiste le moins."
    answer: paix
    explanation: "C'est au terme de ce chapitre que Rousseau nomme la Corse, seul pays d'Europe encore capable de recevoir une législation."
- id: rousseau-contrat-social-l5
  title: "Repérage : les fins et les sortes de lois (II, 11-12)"
  notes: |-
    **Les deux derniers chapitres disent à quoi doit tendre toute législation, la liberté et l'égalité, puis distinguent quatre sortes de lois, dont la plus importante ne s'écrit pas : les mœurs.** Ils tirent les conséquences de ce qui précède : ce que le Législateur doit viser, et ce qu'il institue.

    | Chapitre | Thèse | Argument | Lien |
    | II, 11 | les lois doivent viser la liberté et l'égalité | toute dépendance particulière ôte autant de force à l'État, et la liberté ne peut subsister sans l'égalité | conséquence |
    | II, 11 | ces deux fins se modifient selon chaque peuple | la situation locale et le caractère des habitants donnent à chacun un système qui lui est propre | application |
    | II, 12 | les lois politiques, civiles et criminelles | chacune règle un rapport différent : du tout au tout, des membres entre eux, de la désobéissance à la peine | conséquence |
    | II, 12 | la quatrième, la plus importante : les mœurs | elles se gravent dans les cœurs des citoyens et font la véritable constitution de l'État | déclinaison |

    Le texte : le plus grand bien de tous « se réduit à ces deux objets principaux, la liberté et l'égalité » (II, 11) ; la quatrième sorte de lois, « la plus importante de toutes ; qui ne se grave ni sur le marbre ni sur l'airain, mais dans les cœurs des citoyens [...] Je parle des mœurs, des coutumes, et surtout de l'opinion » (II, 12).

    Les lois **politiques**, ou fondamentales, règlent le rapport du tout au tout, du Souverain à l'État ; ce sont les seules dont traite l'ouvrage, d'où le passage au gouvernement (livre III).

    ! Les mœurs ne sont pas un simple complément des lois : Rousseau en fait la plus importante de toutes.
