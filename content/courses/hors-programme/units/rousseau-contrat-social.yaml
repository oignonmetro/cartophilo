  - table: moment-lieu-ce-qui-s-y-joue-lien
    exercises:
    - {kind: order, column: Lieu}
    - {kind: bank, column: Lien}
    - {kind: cell, column: Lieu}
  points:
  - id: rousseau-contrat-social-c7-q1
    sentence: "« **Il faudrait des** ___ __pour donner des lois aux hommes__. » (II, 7, § 1)"
    answer: "Dieux"
  - id: rousseau-contrat-social-c7-q2
    sentence: "Le grand Prince et le grand Législateur : « Celui-ci est __le__ ___ __qui invente la machine__, celui-là n'est que l'ouvrier qui la monte et la fait marcher. » (II, 7, § 2)"
    answer: "mécanicien"
  - id: rousseau-contrat-social-c7-q3
    sentence: "L'emploi du **Législateur** : « Cet emploi, qui constitue la république, __n'entre point dans sa__ ___ » (II, 7, § 4)."
    answer: "constitution"
  - id: rousseau-contrat-social-c7-q4
    sentence: "« Ainsi l'on trouve à la fois dans l'ouvrage de la législation deux choses qui semblent incompatibles : une entreprise au-dessus de la force humaine, et pour l'exécuter, __une autorité qui n'est__ ___. » (II, 7, § 8)"
    answer: "rien"
  - id: rousseau-contrat-social-c7-q5
    sentence: "Ne pouvant employer ni la force ni le raisonnement, le Législateur doit recourir « à **une autorité d'un autre ordre**, qui puisse entraîner sans violence __et persuader sans__ ___ » (II, 7, § 9)."
    answer: "convaincre"
  - id: rousseau-contrat-social-c7-q6
    sentence: "« **La grande âme du Législateur** __est le vrai__ ___ __qui doit prouver sa mission__. » (II, 7, § 11)"
    answer: "miracle"
  - id: rousseau-contrat-social-c7-q7
    sentence: "Contre Warburton : la politique et la religion n'ont pas parmi nous un objet commun, « __mais que dans l'origine des nations l'une sert d'__ ___ __à l'autre__ » (II, 7, § 12)."
    answer: "instrument"
- id: rousseau-contrat-social-c8
  title: "Repérage : du peuple (II, 8)"
  notes: |-
    **Le chapitre 8 ouvre l'examen du peuple propre à recevoir des lois par la condition du temps : un peuple n'est docile que jeune.**

    | Moment | Lieu | Ce qui s'y joue | Lien |
    | l'architecte sonde le sol | § 1 | le sage instituteur examine d'abord si le peuple est propre à supporter les lois | point de départ |
    | la jeunesse des peuples | § 2 | dociles dans leur jeunesse, ils deviennent incorrigibles en vieillissant | condition |
    | les révolutions qui font renaître | § 3-4 | Sparte, Rome, la Hollande, la Suisse ; mais une seule fois : on peut acquérir la liberté, on ne la recouvre jamais | exception |
    | la maturité d'un peuple | § 5 | la prévenir manque l'ouvrage : Pierre le Grand a policé les Russes trop tôt | précision |

    ! Jeunesse et maturité ne se contredisent pas : il faut un peuple qui n'ait pas encore de coutumes enracinées, mais qui soit en état de recevoir des lois.
  tables:
  - table: moment-lieu-ce-qui-s-y-joue-lien
    exercises:
    - {kind: order, column: Lieu}
    - {kind: bank, column: Lien}
    - {kind: cell, column: Lieu}
  points:
  - id: rousseau-contrat-social-c8-q1
    sentence: "« c'est pour cela qu'on vit en Crète de bonnes lois et de méchants hommes, __parce que__ ___ n'avait discipliné qu'un peuple chargé de vices » (II, 8, § 1)."
    answer: "Minos"
  - id: rousseau-contrat-social-c8-q2
    sentence: "Il est des époques violentes « où l'État, embrasé par les guerres civiles, __renaît pour ainsi dire de sa__ ___ et reprend la vigueur de la jeunesse » (II, 8, § 3)."
    answer: "cendre"
  - id: rousseau-contrat-social-c8-q3
    sentence: "« Peuples libres, souvenez-vous de cette maxime : **On peut acquérir la liberté** ; __mais on ne la__ ___ __jamais__. » (II, 8, § 4)"
    answer: "recouvre"
  - id: rousseau-contrat-social-c8-q4
    sentence: "« Il est pour les Nations comme pour les hommes __un temps de__ ___ __qu'il faut attendre__ avant de les soumettre à des lois » (II, 8, § 5)."
    answer: "maturité"
  - id: rousseau-contrat-social-c8-q5
    sentence: "« **Les Russes** ne seront jamais vraiment policés, __parce qu'ils l'ont été trop__ ___. » (II, 8, § 5)"
    answer: "tôt"
- id: rousseau-contrat-social-c9
  title: "Repérage : l'étendue de l'État (II, 9)"
  notes: |-
    **Le chapitre 9 traite de la deuxième condition, l'étendue : un État a, comme un corps, des bornes au-delà desquelles il s'affaiblit.**

    | Moment | Lieu | Ce qui s'y joue | Lien |
    | ni trop grand ni trop petit | § 1 | plus le lien social s'étend, plus il se relâche | point de départ |
    | contre les grands États | § 2-3 | administration plus pénible et plus onéreuse ; moins d'affection, lois inadaptées ; un corps écrasé sous son propre poids | justification |
    | une base pour résister | § 4 | la force centrifuge des peuples : il faut tenir contre les voisins | objection |
    | la juste proportion | § 5 | les raisons de s'étendre, extérieures, cèdent aux raisons de se resserrer, internes | conclusion |
    | les États conquérants | § 6 | la nécessité des conquêtes marque le terme de leur grandeur et le moment de leur chute | précision |

    ! La préférence pour les petits États n'est pas un goût personnel : la volonté générale se forme mal entre citoyens inconnus les uns aux autres.
  tables:
  - table: moment-lieu-ce-qui-s-y-joue-lien
    exercises:
    - {kind: order, column: Lieu}
    - {kind: bank, column: Lien}
    - {kind: cell, column: Lieu}
  points:
  - id: rousseau-contrat-social-c9-q1
    sentence: "« Premièrement **l'administration** devient plus pénible dans les grandes distances, __comme un poids devient plus lourd au bout d'un plus grand__ ___. » (II, 9, § 2)"
    answer: "levier"
  - id: rousseau-contrat-social-c9-q2
    sentence: "Dans un grand État, « Les talents sont enfouis, les vertus ignorées, __les vices__ ___, dans cette multitude d'hommes inconnus les uns aux autres » (II, 9, § 3)."
    answer: "impunis"
  - id: rousseau-contrat-social-c9-q3
    sentence: "« car tous les peuples ont __une espèce de force__ ___, par laquelle ils agissent continuellement les uns contre les autres et tendent à s'agrandir aux dépens de leurs voisins » (II, 9, § 4)."
    answer: "centrifuge"
  - id: rousseau-contrat-social-c9-q4
    sentence: "« et l'on doit plus compter sur la vigueur qui naît d'un bon gouvernement, __que sur les ressources que fournit un grand__ ___ » (II, 9, § 5)."
    answer: "territoire"
- id: rousseau-contrat-social-c10
  title: "Repérage : le territoire et le moment (II, 10)"
  notes: |-
    **Le chapitre 10 achève l'examen du peuple : le rapport du territoire à la population, puis le moment de l'institution, et enfin le portrait du peuple propre à la législation.**

    | Moment | Lieu | Ce qui s'y joue | Lien |
    | territoire et population | § 1 | que la terre suffise à ses habitants : le terrain de trop cause les guerres défensives, le manque les offensives | point de départ |
    | pas de rapport fixe | § 2 | sol, climat, tempéraments, fécondité : juger sur ce qu'on prévoit | précision |
    | l'abondance et la paix | § 3-4 | le moment de l'institution distingue l'œuvre du Législateur de celle du Tyran | condition |
    | le peuple propre à la législation | § 5 | la consistance d'un ancien peuple avec la docilité d'un peuple nouveau | récapitulation |
    | la Corse | § 6 | il est encore en Europe un pays capable de législation | application |

    ! Le peuple doit être « déjà lié par quelque union » : le Législateur ne crée pas le lien social de rien, il lui donne des lois.
