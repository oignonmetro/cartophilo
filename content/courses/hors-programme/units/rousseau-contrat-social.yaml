    sentence: "« car si l'opposition des intérêts particuliers a rendu nécessaire l'établissement des sociétés, __c'est l'accord de ces mêmes intérêts qui l'a rendu__ ___ » (II, 1, § 1)."
    answer: "possible"
  - id: rousseau-contrat-social-c1-q2
    sentence: "« car **la volonté particulière** __tend par sa nature aux__ ___, et la volonté générale à l'égalité » (II, 1, § 3)."
    answer: "préférences"
  - id: rousseau-contrat-social-c1-q3
    sentence: "« puisqu'il est absurde __que la volonté se donne des__ ___ __pour l'avenir__ » (II, 1, § 3)."
    answer: "chaînes"
  - id: rousseau-contrat-social-c1-q4
    sentence: "« Si donc **le peuple promet simplement d'obéir**, il se dissout par cet acte, il perd sa qualité de peuple ; __à l'instant qu'il y a un__ ___ __il n'y a plus de Souverain__ » (II, 1, § 3)."
    answer: "maître"
  - id: rousseau-contrat-social-c1-q5
    sentence: "Les ordres des chefs peuvent passer pour des volontés générales tant que le souverain, libre de s'y opposer, ne le fait pas : « __du silence universel on doit présumer le__ ___ du peuple » (II, 1, § 4)."
    answer: "consentement"
- id: rousseau-contrat-social-c2
  title: "Repérage : la souveraineté indivisible (II, 2)"
  notes: |-
    **Le chapitre 2 montre que la souveraineté est indivisible pour la même raison qu'elle est inaliénable : la volonté est générale ou ne l'est pas.** Ceux qui la divisent prennent pour ses parties ce qui n'en est que des émanations.

    | Moment | Lieu | Ce qui s'y joue | Lien |
    | la volonté est générale ou ne l'est pas | § 1 | volonté du corps du peuple, elle fait loi ; d'une partie, ce n'est qu'un décret | point de départ |
    | l'erreur des politiques | § 2 | ils divisent la souveraineté dans son objet : les charlatans du Japon | réfutation |
    | parties ou émanations | § 3-4 | déclarer la guerre n'est pas une loi mais une application de la loi ; ces droits supposent tous des volontés suprêmes | explication |
    | Grotius et Barbeyrac | § 5 | ce défaut d'exactitude obscurcit le droit politique : ils dépouillent les peuples pour faire leur cour aux rois | application |

    ! Le chapitre ne vise pas la séparation des pouvoirs de Montesquieu : législatif et exécutif peuvent être distincts, pourvu que l'exécutif ne soit qu'une émanation de la volonté souveraine.
