    sentence: "« mais ôtez de ces mêmes volontés les plus et les moins qui s'entre-détruisent, __reste pour somme des__ ___ **la volonté générale** » (II, 3, § 2)."
    answer: "différences"
  - id: rousseau-contrat-social-c3-q2
    sentence: "« Si, quand le peuple suffisamment informé délibère, __les Citoyens n'avaient aucune__ ___ __entre eux__, du grand nombre de petites différences résulterait toujours la volonté générale » (II, 3, § 3)."
    answer: "communication"
  - id: rousseau-contrat-social-c3-q3
    sentence: "Quand une association l'emporte sur toutes les autres, « vous n'avez plus pour résultat une somme de petites différences, __mais une différence__ ___ » (II, 3, § 3)."
    answer: "unique"
  - id: rousseau-contrat-social-c3-q4
    sentence: "« Il importe donc pour avoir bien l'énoncé de la volonté générale qu'il n'y ait pas de société partielle dans l'État __et que chaque Citoyen n'opine que d'après__ ___ » (II, 3, § 4)."
    answer: "lui"
  - id: rousseau-contrat-social-c3-q5
    sentence: "Aucune société partielle dans l'État : « Telle fut l'unique et sublime institution __du grand__ ___. » (II, 3, § 4)"
    answer: "Lycurgue"
- id: rousseau-contrat-social-l3
  title: "Repérage : les bornes du souverain et la loi (II, 4-6)"
  notes: |-
    **Absolu, le souverain est pourtant borné, et par sa nature même : la volonté générale doit partir de tous pour s'appliquer à tous. Le chapitre 6 en tire la définition de la loi, charnière du livre.** Les chapitres 4 et 5 marquent la {sky}limite{/sky} des propriétés établies en II, 1-3.

    | Chapitre | Thèse | Argument | Lien |
    | II, 4 | le souverain est absolu, mais borné | tournée vers un objet individuel et déterminé, la volonté générale perd sa rectitude | limite |
    | II, 5 | il peut exiger la vie du citoyen | le traité a pour fin la conservation des contractants ; le malfaiteur, qui a rompu le traité, est frappé comme ennemi | application |
    | II, 6 | la loi : tout le peuple statue sur tout le peuple | la volonté et la matière sont alors également générales ; nul n'est injuste envers lui-même | conséquence |

    Le texte : « le pouvoir Souverain, tout absolu, tout sacré, tout inviolable qu'il est, ne passe ni ne peut passer les bornes des conventions générales » (II, 4) ; « Le traité social a pour fin la conservation des contractants. Qui veut la fin veut aussi les moyens » (II, 5) ; « quand tout le peuple statue sur tout le peuple [...]. Alors la matière sur laquelle on statue est générale comme la volonté qui statue. C'est cet acte que j'appelle une loi » (II, 6).

    **Un lien à distance : II, 6 reprend II, 3.** « On veut toujours son bien, mais on ne le voit pas toujours » revient, pour un autre usage : en II, 3, le peuple qui ne voit pas son bien est trompé par les brigues ; en II, 6, il est aveugle, incapable de concevoir seul un code de lois.

    La charnière : le peuple soumis aux lois doit en être l'auteur, mais une multitude aveugle, qui souvent ne sait ce qu'elle veut, ne peut concevoir d'elle-même un système de législation. « Voilà d'où naît la nécessité d'un Législateur. »

    ! Le droit de vie et de mort n'est pas une exception aux bornes du souverain : il en est une application, puisque le malfaiteur n'est plus membre de l'État.
  tables:
  - table: chapitre-these-argument-lien
    exercises:
    - {kind: order, column: Chapitre}
    - {kind: bank, column: Lien}
    - {kind: cell, column: Chapitre}
  points:
  - id: cs2-4a
    sentence: "Le pouvoir souverain est absolu, mais **borné par la généralité de la volonté** qui le dirige : la volonté générale perd sa rectitude __dès qu'elle tend à un objet__ ___ et déterminé."
    answer: individuel
    alt: [particulier]
    explanation: "Pour être vraiment générale, la volonté doit partir de tous pour s'appliquer à tous. Le souverain ne peut donc charger un sujet plus qu'un autre : l'affaire deviendrait particulière et passerait sa compétence."
  - id: cs2-4b
    sentence: "Rousseau conclut : « On voit par là que le **pouvoir Souverain**, tout absolu, tout sacré, tout inviolable qu'il est, __ne passe ni ne peut passer les bornes des conventions__ ___ »"
    answer: générales
    explanation: "La suite : « et que tout homme peut disposer pleinement de ce qui lui a été laissé de ses biens et de sa liberté par ces conventions. »"
  - id: cs2-5a
    sentence: "Au **droit de vie et de mort**, Rousseau répond que la question est mal posée : « __Le traité social a pour fin la__ ___ des contractants. Qui veut la fin veut aussi les moyens. »"
    answer: conservation
    explanation: "L'objection : des particuliers qui n'ont pas le droit de disposer de leur vie ne peuvent le transmettre au souverain. La réponse : le citoyen qui s'expose pour l'État ne fait que lui rendre sa vie, devenue un « don conditionnel de l'État »."
  - id: cs2-5b
    sentence: "Le **malfaiteur** qui viole les lois rompt le traité social et cesse d'être membre de l'État : __la peine de mort le frappe moins comme citoyen que comme__ ___."
    answer: ennemi
    explanation: "Le droit de grâce n'appartient qu'au souverain, et son usage doit rester rare : dans un État bien gouverné, il y a peu de punitions parce qu'il y a peu de criminels."
  - id: cs2-6a
    sentence: "La loi réunit l'universalité de la volonté et celle de l'objet : « quand **tout le peuple statue sur tout le peuple** [...]. __Alors la__ ___ sur laquelle on statue est générale comme la volonté qui statue. C'est cet acte que j'appelle une loi. »"
    answer: matière
    explanation: "Le pacte social a donné au corps politique l'existence et la vie ; la législation lui donne le mouvement et la volonté."
  - id: cs2-6b
    sentence: "Le peuple soumis aux lois doit en être l'**auteur**, __mais une multitude__ ___, qui souvent ne sait ce qu'elle veut, ne peut concevoir d'elle-même un système de législation."
    answer: aveugle
    explanation: "Au chapitre 3, le peuple qui ne voit pas son bien est trompé par les brigues ; au chapitre 6, il manque de lumières pour rédiger ses lois. Le problème n'est plus politique mais d'entendement."
  - id: cs2-lien-3-6
    sentence: "« On veut toujours son bien, mais on ne le voit pas toujours » : même formule en II, 3 et en **II, 6**, deux usages. En II, 3, __le peuple qui ne voit pas son bien est__ ___ par les brigues ; en II, 6, il est aveugle, incapable de concevoir seul un code de lois."
    answer: trompé
- id: rousseau-contrat-social-c4
  title: "Repérage : les bornes du pouvoir souverain (II, 4)"
  notes: |-
    **Le chapitre 4 montre que le souverain, absolu, est pourtant borné, et par sa nature même : la volonté générale ne peut porter que sur un objet général et n'imposer que ce qui sert la communauté.**

    | Moment | Lieu | Ce qui s'y joue | Lien |
    | un pouvoir absolu | § 1 | comme la nature donne à l'homme un pouvoir absolu sur ses membres, le pacte au corps politique | point de départ |
    | la question des bornes | § 2-3 | distinguer les droits du souverain du droit naturel des hommes ; chacun n'aliène que ce dont l'usage importe à la communauté | problème |
    | l'utilité commune | § 4 | le souverain ne peut charger les sujets d'aucune chaîne inutile à la communauté | limite |
    | la généralité de l'objet | § 5-7 | la volonté générale doit partir de tous pour s'appliquer à tous ; sur un objet particulier, elle n'est plus qu'une partie dans un procès | limite |
    | l'acte de souveraineté | § 8-9 | une convention du corps avec chacun de ses membres, qui ne passe pas les bornes des conventions générales | conclusion |
    | un échange avantageux | § 10 | au lieu d'une aliénation, l'indépendance naturelle échangée contre la liberté ; même la vie exposée pour la patrie | conséquence |

    ! Les bornes ne viennent pas d'un droit extérieur opposé au souverain : elles tiennent à ce qu'est une volonté générale.
  tables:
  - table: moment-lieu-ce-qui-s-y-joue-lien
