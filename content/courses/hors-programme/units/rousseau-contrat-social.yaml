# Cours d'une œuvre (unités-œuvres en leçons, sur le modèle du Phédon, voir
# content/philosophie.md) : Rousseau, *Du contrat social*, livre II. Les livres
# I et III viendront ensuite, une unité chacun.
#
# Refondue le 2026-11-27 depuis l'ancienne unité-œuvre à plan (`work:`) : pour
# l'instant, la structure seule. Un plan général, puis un sous-repérage par
# bloc de chapitres, chacun avec une colonne « Lien » (les relations de
# l'ancien plan) ; les cartes de l'ancien plan y sont rangées, identifiants et
# explications gardés. Sous chaque bloc, un sous-repérage par chapitre,
# paragraphe par paragraphe (2026-11-27), comme au livre I : plans tirés du
# texte GF, de D. L. Williams, *Rousseau's Social Contract: An Introduction*
# (Cambridge, 2014), qui numérote les paragraphes comme la GF (« SC, 2.4.5 »),
# et des notes de B. Bernardi. Rappels de chapitre et cartes manquantes
# viendront du notebook NotebookLM fourni par l'utilisateur.
#
# Source du plan : un schéma de manuel, corrigé d'après les réponses de
# l'utilisateur (fichier « rousseau contrat social livre II.odt », 2026-09-27).
# Deux écarts avec le schéma : le chapitre 6 devient une charnière entre les
# deux blocs (1-5 et 7-12) au lieu de clore le premier, et les thèses des
# chapitres 2 et 4 sont rectifiées (émanations prises pour des parties ;
# généralité de l'objet). L'économie du livre est recoupée avec l'introduction
# et la note 63 de B. Bernardi.
#
# Citations : GF Flammarion (éd. Bruno Bernardi, 2001, revue 2012).

