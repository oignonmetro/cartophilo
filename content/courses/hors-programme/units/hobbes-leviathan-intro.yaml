- id: "hobbes-leviathan-intro-p1b"
  title: "Le cœur, les nerfs, les articulations"
  notes: ""
  passage:
    label: "§1"
    text: "Car, qu'est-ce que le *cœur,* sinon un *ressort,* les *nerfs,* sinon autant de *courroies* et les *articulations* autant de *roues,* toutes choses qui, selon l'intention de l'artisan, impriment le mouvement à tout le corps ? Mais l'*art* va plus loin en imitant l'œuvre raisonnable et la plus excellente de la nature : l'*homme.*"
    part: "L'art imite la nature : l'homme artificiel"
  points: [{id: hobbes-leviathan-intro-p1b-p1, sentence: "« Car, qu'est-ce que le *cœur,* sinon un *ressort,* les *nerfs,* sinon autant de *courroies* et les *articulations* autant de *roues,* toutes choses qui, selon l'intention de l'artisan, impriment ___ à tout le corps ? Mais l'*art* va plus loin en imitant l'œuvre raisonnable et la plus excellente de la nature : l'*homme.* »", answer: "le mouvement", alt: []}, {id: hobbes-leviathan-intro-p1b-p2, sentence: "« Car, qu'est-ce que le *cœur,* sinon un *ressort,* les *nerfs,* sinon autant de *courroies* et les *articulations* autant de *roues,* toutes choses qui, selon l'intention de l'artisan, impriment le mouvement à tout le corps ? Mais l'*art* va plus loin en imitant l'œuvre raisonnable et la plus excellente de la nature : ___ »", answer: "l'*homme.*", alt: []}, {id: hobbes-leviathan-intro-p1b-p3, sentence: "« Car, qu'est-ce que le *cœur,* sinon un *ressort,* les *nerfs,* sinon autant de *courroies* et les *articulations* autant de *roues,* toutes choses qui, selon l'intention de l'artisan, impriment le mouvement à tout le corps ? Mais l'*art* va plus loin en imitant ___ : l'*homme.* »", answer: "l'œuvre raisonnable et la plus excellente de la nature", alt: []}]
- id: "hobbes-leviathan-intro-p1c"
  title: "Le Léviathan, homme artificiel"
  notes: ""
  passage:
    label: "§1"
    text: "C'est l'art, en effet, qui crée ce grand LÉVIATHAN, appelé RÉPUBLIQUE OU ÉTAT (CIVITAS en latin) qui n'est autre chose qu'un homme artificiel, quoique de stature et de force plus grandes que celles de l'homme naturel, pour la défense et la protection duquel il a été conçu."
