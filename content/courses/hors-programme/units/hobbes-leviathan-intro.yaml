- id: "hobbes-leviathan-intro-p1d"
  title: "Les parties du corps politique"
  notes: ""
  passage:
    label: "§1"
    text: "En lui, la *souveraineté* est une *âme* artificielle, car elle donne vie et mouvement au corps tout entier ; les *magistrats* et les autres *officiers* judiciaires et d'exécution sont des *articulations* artificielles ; la *récompense* et le *châtiment* par où la souveraineté, attachant à son service chaque articulation et chaque membre, met ceux-ci en mouvement pour accomplir leur devoir, sont les *nerfs,* tout comme cela se produit dans le corps naturel, l'*opulence* et la *richesse* de tous les membres particuliers, sont la *force* ; la *salus populi (sécurité du peuple*) est son *affaire* ; les *conseillers,* qui suggèrent les choses qu'il lui est utile de savoir, sont la *mémoire ; l'équité* et les *lois* sont une *raison* et une *volonté* artificielles ; la *concorde* est sa *santé,* la *sédition* sa *maladie* et la *guerre civile* sa *mort.*"
    part: "L'art imite la nature : l'homme artificiel"
