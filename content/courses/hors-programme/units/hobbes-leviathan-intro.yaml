- id: "hobbes-leviathan-intro-p3d"
  title: "Les passions, non leurs objets"
  notes: ""
  passage:
    label: "§3"
    text: "Je parle de la similitude des *passions,* qui sont identiques chez tous les humains, *désir, peur, crainte,* etc., non de la similitude des *objets* de ces mêmes passions, qui sont les choses *désirées, craintes, espérées,* etc. ; car la constitution des individus et leur éducation particulière varient tellement par rapport à celles-ci, et il est si aisé de nous les faire ignorer, que les caractères inscrits dans les cœurs, souillés et mélangés comme ils le sont par des doctrines frauduleuses, mensongères, frelatées et erronées, ne sont lisibles que par celui qui sonde les cœurs."
    part: "Lis en toi-même"
  points: [{id: hobbes-leviathan-intro-p3d-p1, sentence: "« Je parle de la similitude des *passions,* qui sont identiques chez tous les humains, *désir, peur, crainte,* etc., non de la similitude des *objets* de ces mêmes passions, qui sont les choses *désirées, craintes, espérées,* etc. ; car la constitution des individus et leur éducation particulière varient tellement par rapport à celles-ci, et il est si aisé de nous les faire ignorer, que les caractères inscrits dans les cœurs, souillés et mélangés comme ils le sont par des doctrines frauduleuses, mensongères, frelatées et erronées, ne sont lisibles que par ___. »", answer: "celui qui sonde les cœurs", alt: []}]
- id: "hobbes-leviathan-intro-p4"
  title: "Déchiffrer le genre humain"
  notes: ""
  passage:
    label: "§4"
    text: "Mais qu'un humain lise aussi parfaitement que possible dans les actions d'un autre, cela ne lui sert seulement que dans le cercle de ses connaissances, qui sont peu nombreuses. Celui qui gouverne une nation entière doit lire en lui-même, non en celui-ci en particulier ou en celui-là. Mais il doit déchiffrer le genre humain ; ce qui est une tâche ardue, plus ardue que celle consistant à apprendre quelque langue ou science que ce soit. Néanmoins, quand j'aurai ordonné le détail précis de mes propres lectures, alors il ne restera à un autre qu'à se donner la peine de trouver la même chose en lui-même – car cette sorte de doctrine ne requiert aucune autre démonstration."
    part: "Déchiffrer le genre humain"
