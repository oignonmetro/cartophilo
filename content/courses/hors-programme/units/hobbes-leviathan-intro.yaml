  notes: ""
  passage:
    label: "§1"
    text: "Enfin, les *pactes* et *conventions* à partir desquels les parties de ce corps politique ont été originairement fabriquées, mises ensemble et réunies, sont pareils au *fiat* ou à ce *faisons l'homme* que Dieu prononça lors de la création."
