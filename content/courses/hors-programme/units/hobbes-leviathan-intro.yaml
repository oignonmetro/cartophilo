- id: "hobbes-leviathan-intro-p1"
  title: "La vie des automates"
  notes: ""
  passage:
    label: "§1"
    text: "La nature, qui est l'art pratiqué par Dieu pour fabriquer le monde et le gouverner, est imitée par l'*art* de l'homme, qui peut, ici comme en beaucoup d'autres domaines, fabriquer un animal artificiel. Puisqu'en effet la vie n'est qu'un mouvement des membres, dont l'origine est dans quelque partie interne, pourquoi ne pourrait-on dire que tous les *automates* (ces machines mues par des ressorts et des roues comme dans une montre) ont une vie artificielle ?"
    part: "L'art imite la nature : l'homme artificiel"
  points: [{id: hobbes-leviathan-intro-p1-p1, sentence: "« La nature, qui est ___ pour fabriquer le monde et le gouverner, est imitée par l'*art* de l'homme, qui peut, ici comme en beaucoup d'autres domaines, fabriquer un animal artificiel. Puisqu'en effet la vie n'est qu'un mouvement des membres, dont l'origine est dans quelque partie interne, pourquoi ne pourrait-on dire que tous les *automates* (ces machines mues par des ressorts et des roues comme dans une montre) ont une vie artificielle ? »", answer: "l'art pratiqué par Dieu", alt: []}, {id: hobbes-leviathan-intro-p1-p2, sentence: "« La nature, qui est l'art pratiqué par Dieu pour fabriquer le monde et le gouverner, est ___, qui peut, ici comme en beaucoup d'autres domaines, fabriquer un animal artificiel. Puisqu'en effet la vie n'est qu'un mouvement des membres, dont l'origine est dans quelque partie interne, pourquoi ne pourrait-on dire que tous les *automates* (ces machines mues par des ressorts et des roues comme dans une montre) ont une vie artificielle ? »", answer: "imitée par l'*art* de l'homme", alt: []}, {id: hobbes-leviathan-intro-p1-p3, sentence: "« La nature, qui est l'art pratiqué par Dieu pour fabriquer le monde et le gouverner, est imitée par l'*art* de l'homme, qui peut, ici comme en beaucoup d'autres domaines, fabriquer un animal artificiel. Puisqu'en effet ___ n'est qu'un mouvement des membres, dont l'origine est dans quelque partie interne, pourquoi ne pourrait-on dire que tous les *automates* (ces machines mues par des ressorts et des roues comme dans une montre) ont une vie artificielle ? »", answer: "la vie", alt: []}, {id: hobbes-leviathan-intro-p1-p4, sentence: "« La nature, qui est l'art pratiqué par Dieu pour fabriquer le monde et le gouverner, est imitée par l'*art* de l'homme, qui peut, ici comme en beaucoup d'autres domaines, fabriquer un animal artificiel. Puisqu'en effet la vie n'est qu'un mouvement des membres, dont l'origine est dans quelque partie interne, pourquoi ne pourrai