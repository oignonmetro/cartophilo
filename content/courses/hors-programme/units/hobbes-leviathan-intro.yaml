- id: "hobbes-leviathan-intro-p3"
  title: "La sagesse lue dans les hommes"
  notes: ""
  passage:
    label: "§3"
    text: "En ce qui concerne le premier point, ces derniers temps on a souvent fait un usage très douteux d'un proverbe disant que la *sagesse* s'acquiert en lisant dans les *hommes,* non dans les *livres*. Il s'ensuit que la plupart des personnes qui disent cela sont incapables de donner une autre preuve de leur propre sagesse, et elles prennent plaisir à montrer ce qu'elles pensent avoir lu dans les hommes en se dénigrant peu charitablement derrière leur dos, les unes les autres. Mais il y a une autre maxime qui, elle, est comprise depuis longtemps, et qui pourrait vraiment apprendre à ces personnes à lire mutuellement en elles, pour autant qu'elles veuillent bien s'en donner la peine."
    part: "Lis en toi-même"
  points: [{id: hobbes-leviathan-intro-p3-p1, sentence: "« En ce qui concerne le premier point, ces derniers temps on a souvent fait un usage très douteux d'un proverbe disant que la *sagesse* s'acquiert en lisant dans les *hommes,* non dans les *livres*. Il s'ensuit que la plupart des personnes qui disent cela sont incapables de donner une autre preuve de leur propre sagesse, et elles prennent plaisir à montrer ce qu'elles pensent avoir lu dans les hommes en se dénigrant peu charitablement derrière leur dos, les unes les autres. Mais il y a une autre maxime qui, elle, est comprise depuis longtemps, et qui pourrait vraiment apprendre à ces personnes à ___, pour autant qu'elles veuillent bien s'en donner la peine. »", answer: "lire mutuellement en elles", alt: []}]
- id: "hobbes-leviathan-intro-p3c"
  title: "La similitude des pensées et des passions"
  notes: ""
  passage:
    label: "§3"
    text: "C'est *nosce teipsum, lis en toi-même,* maxime dont la signification ne permettait pas, comme dans l'emploi qu'on en fait maintenant, d'approuver ou bien la barbarie de ceux qui sont au pouvoir vis-à-vis de ceux qui leur sont inférieurs, ou bien d'encourager les hommes de basse condition à affecter de prendre une attitude arrogante face à ceux qui sont meilleurs qu'eux, mais de nous enseigner que, par la similitude même des pensées et des passions d'un homme avec les pensées et passions d'un autre, quiconque regarde en soi-même et considère ce qu'il fait quand il *pense, réfléchit, raisonne, espère, craint,* etc., et sur quels fondements, celui-là lira et connaîtra, par cela même, les pensées et passions des autres humains, dans les mêmes occasions."
    part: "Lis en toi-même"
