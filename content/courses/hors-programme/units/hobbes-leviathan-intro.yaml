# introduction, traduction G. Mairet (Gallimard). Découpage seul :
# rappels et cartes à écrire.

id: "hobbes-leviathan-intro"
title: "Léviathan, introduction : l'homme artificiel"
subtitle: "Hobbes, Léviathan, introduction"
icon: "page"
color: "red"
group: "Hobbes : la politique"
depth: "normale"
lessons:
- id: "hobbes-leviathan-intro-p1"
  title: "La vie des automates"
  notes: ""
  passage:
    label: "§1"
    part: "L'art imite la nature : l'homme artificiel"
    text: |-
      La nature, qui est l'art pratiqué par Dieu pour fabriquer le monde et le gouverner, est imitée par l'*art* de l'homme, qui peut, ici comme en beaucoup d'autres domaines, fabriquer un animal artificiel. Puisqu'en effet la vie n'est qu'un mouvement des membres, dont l'origine est dans quelque partie interne, pourquoi ne pourrait-on dire que tous les *automates* (ces machines mues par des ressorts et des roues comme dans une montre) ont une vie artificielle ?
  points: []
- id: "hobbes-leviathan-intro-p1b"
  title: "Le cœur, les nerfs, les articulations"
  notes: ""
  passage:
    label: "§1"
    part: "L'art imite la nature : l'homme artificiel"
    text: |-
      Car, qu'est-ce que le *cœur,* sinon un *ressort,* les *nerfs,* sinon autant de *courroies* et les *articulations* autant de *roues,* toutes choses qui, selon l'intention de l'artisan, impriment le mouvement à tout le corps ? Mais l'*art* va plus loin en imitant l'œuvre raisonnable et la plus excellente de la nature : l'*homme.*
  points: []
- id: "hobbes-leviathan-intro-p1c"
  title: "Le Léviathan, homme artificiel"
  notes: ""
  passage:
    label: "§1"
    part: "L'art imite la nature : l'homme artificiel"
    text: |-
      C'est l'art, en effet, qui crée ce grand LÉVIATHAN, appelé RÉPUBLIQUE OU ÉTAT (CIVITAS en latin) qui n'est autre chose qu'un homme artificiel, quoique de stature et de force plus grandes que celles de l'homme naturel, pour la défense et la protection duquel il a été conçu.
  points: []
- id: "hobbes-leviathan-intro-p1d"
  title: "Les parties du corps politique"
  notes: ""
  passage:
    label: "§1"
    part: "L'art imite la nature : l'homme artificiel"
    text: |-
      En lui, la *souveraineté* est une *âme* artificielle, car elle donne vie et mouvement au corps tout entier ; les *magistrats* et les autres *officiers* judiciaires et d'exécution sont des *articulations* artificielles ; la *récompense* et le *châtiment* par où la souveraineté, attachant à son service chaque articulation et chaque membre, met ceux-ci en mouvement pour accomplir leur devoir, sont les *nerfs,* tout comme cela se produit dans le corps naturel, l'*opulence* et la *richesse* de tous les membres particuliers, sont la *force* ; la *salus populi (sécurité du peuple*) est son *affaire* ; les *conseillers,* qui suggèrent les choses qu'il lui est utile de savoir, sont la *mémoire ; l'équité* et les *lois* sont une *raison* et une *volonté* artificielles ; la *concorde* est sa *santé,* la *sédition* sa *maladie* et la *guerre civile* sa *mort.*
  points: []
- id: "hobbes-leviathan-intro-p1e"
  title: "Le fiat de la création"
  notes: ""
  passage:
    label: "§1"
    part: "L'art imite la nature : l'homme artificiel"
    text: |-
      Enfin, les *pactes* et *conventions* à partir desquels les parties de ce corps politique ont été originairement fabriquées, mises ensemble et réunies, sont pareils au *fiat* ou à ce *faisons l'homme* que Dieu prononça lors de la création.
  points: []
- id: "hobbes-leviathan-intro-p2"
  title: "Matière, fabrication, État chrétien, ténèbres"
  notes: ""
  passage:
    label: "§2"
    part: "Le plan de l'ouvrage"
    text: |-
      Pour décrire la nature de cet homme artificiel, je considérerai :

      Premièrement, sa *matière* et son *artisan,* qui sont l'*homme.*

      Deuxièmement, *comment* et selon quelles *conventions* il est fabriqué ; quels sont les *droits* et *juste puissance* ou *pouvoir* [*authority*] d'un *souverain* ; et par quoi il se *conserve* et se *dissout.*

      Troisièmement, ce qu'est un *État chrétien.*

      Enfin, ce qu'est le *royaume des ténèbres.*
  points: []
- id: "hobbes-leviathan-intro-p3"
  title: "La sagesse lue dans les hommes"
  notes: ""
  passage:
    label: "§3"
    part: "Lis en toi-même"
    text: |-
      En ce qui concerne le premier point, ces derniers temps on a souvent fait un usage très douteux d'un proverbe disant que la *sagesse* s'acquiert en lisant dans les *hommes,* non dans les *livres*. Il s'ensuit que la plupart des personnes qui disent cela sont incapables de donner une autre preuve de leur propre sagesse, et elles prennent plaisir à montrer ce qu'elles pensent avoir lu dans les hommes en se dénigrant peu charitablement derrière leur dos, les unes les autres.
  points: []
- id: "hobbes-leviathan-intro-p3b"
  title: "Une autre maxime"
  notes: ""
  passage:
    label: "§3"
    part: "Lis en toi-même"
    text: |-
      Mais il y a une autre maxime qui, elle, est comprise depuis longtemps, et qui pourrait vraiment apprendre à ces personnes à lire mutuellement en elles, pour autant qu'elles veuillent bien s'en donner la peine.
  points: []
- id: "hobbes-leviathan-intro-p3c"
  title: "La similitude des pensées et des passions"
  notes: ""
  passage:
    label: "§3"
    part: "Lis en toi-même"
    text: |-
      C'est *nosce teipsum, lis en toi-même,* maxime dont la signification ne permettait pas, comme dans l'emploi qu'on en fait maintenant, d'approuver ou bien la barbarie de ceux qui sont au pouvoir vis-à-vis de ceux qui leur sont inférieurs, ou bien d'encourager les hommes de basse condition à affecter de prendre une attitude arrogante face à ceux qui sont meilleurs qu'eux, mais de nous enseigner que, par la similitude même des pensées et des passions d'un homme avec les pensées et passions d'un autre, quiconque regarde en soi-même et considère ce qu'il fait quand il *pense, réfléchit, raisonne, espère, craint,* etc., et sur quels fondements, celui-là lira et connaîtra, par cela même, les pensées et passions des autres humains, dans les mêmes occasions.
  points: []
- id: "hobbes-leviathan-intro-p3d"
  title: "Les passions, non leurs objets"
  notes: ""
  passage:
    label: "§3"
    part: "Lis en toi-même"
    text: |-
      Je parle de la similitude des *passions,* qui sont identiques chez tous les humains, *désir, peur, crainte,* etc., non de la similitude des *objets* de ces mêmes passions, qui sont les choses *désirées, craintes, espérées,* etc. ; car la constitution des individus et leur éducation particulière varient tellement par rapport à celles-ci, et il est si aisé de nous les faire ignorer, que les caractères inscrits dans les cœurs, souillés et mélangés comme ils le sont par des doctrines frauduleuses, mensongères, frelatées et erronées, ne sont lisibles que par celui qui sonde les cœurs.
  points: []
- id: "hobbes-leviathan-intro-p3e"
  title: "Déchiffrer sans clé"
  notes: ""
  passage:
    label: "§3"
    part: "Lis en toi-même"
    text: |-
      Et, quand bien même les actions des humains nous font parfois découvrir leur dessein, il reste que le faire sans comparer celles-ci avec les nôtres, en distinguant toutes les circonstances susceptibles de modifier le cas, cela revient à déchiffrer sans clé et, la plupart du temps, à courir à l'échec, par trop de confiance ou par trop de méfiance, dans la mesure où celui qui lit est lui-même bon ou méchant.
  points: []
- id: "hobbes-leviathan-intro-p4"
  title: "Gouverner une nation entière"
  notes: ""
  passage:
    label: "§4"
    part: "Déchiffrer le genre humain"
    text: |-
      Mais qu'un humain lise aussi parfaitement que possible dans les actions d'un autre, cela ne lui sert seulement que dans le cercle de ses connaissances, qui sont peu nombreuses. Celui qui gouverne une nation entière doit lire en lui-même, non en celui-ci en particulier ou en celui-là.
  points: []
- id: "hobbes-leviathan-intro-p4b"
  title: "Une tâche ardue"
  notes: ""
  passage:
    label: "§4"
    part: "Déchiffrer le genre humain"
    text: |-
      Mais il doit déchiffrer le genre humain ; ce qui est une tâche ardue, plus ardue que celle consistant à apprendre quelque langue ou science que ce soit. Néanmoins, quand j'aurai ordonné le détail précis de mes propres lectures, alors il ne restera à un autre qu'à se donner la peine de trouver la même chose en lui-même – car cette sorte de doctrine ne requiert aucune autre démonstration.
  points: []
