# Unité de texte (voir content/textes.md) : Aristote, Politiques, V, 1,
# 1301a25-b4, traduction P. Pellegrin (GF), vérifiée sur l'édition, en trois
# fragments repérés par leurs lignes Bekker. Rappels : commentaire « Cité,
# homme, lógos » (section « Sur ce que les hommes font dans la cité »,
# pp. 24-26), introduction et notes de Pellegrin. Les cartes sur la stasis et
# la relativité des valeurs viennent de l'unité aristote-cite-homme-logos,
# sous leur identifiant.

id: aristote-seditions
title: "Les sources des séditions"
subtitle: "Aristote, Politiques, V, 1, 1301a25-b4"
icon: page
color: red
group: "Aristote : la politique"
intro: |-
  Au début du livre V des *Politiques*, Aristote cherche la cause commune des séditions (*stasis*) : tous s'accordent à dire que le juste est l'égalité proportionnelle, mais se trompent sur ce qu'elle est. Démocrates et oligarques érigent une égalité ou une inégalité partielle en égalité ou inégalité absolue.

  Le texte, cité dans la traduction de Pierre Pellegrin, prolonge *Politiques*, I, 2 : le *lógos* qui permet de percevoir le juste rend la cité possible, mais une perception erronée du juste peut aussi la défaire.
lessons:
- id: aristote-seditions-i1
  title: "Ce qui divise la cité"
  notes: |-
    **Le lógos qui rend la cité possible peut aussi la défaire : perçues par chacun selon sa condition, les valeurs divisent les citoyens jusqu'à la sédition.** Le *lógos*, *medium* de la cité, est aussi ce par quoi la *pólis* peut être défaite, dissoute, ou du moins remise en question : les deux possibilités sont données ensemble (commentaire « Cité, homme, lógos »).

    « Enraciner les valeurs dans une perception originaire, c'est reconnaître, d'un seul et même mouvement, le caractère universel (universellement humain) de notre aptitude à les saisir puis à les exprimer, en même temps que leur caractère éminemment relatif » (Rogan, 2021) : chaque citoyen les perçoit selon sa position géographique, sa condition sociale (riche, pauvre), sa disposition éthique (vice, vertu). Pour Francis Wolff, le juste et l'injuste, objets d'une expérience individuelle, « n'accèdent à l'existence, dans la vie commune, que par la discussion qui suppose la contradiction et implique une remise en question permanente ».

    | | Platon | Aristote |
    | Les valeurs | des Idées, des essences, indépendantes des citoyens | perçues par les citoyens grâce au `lógos` |
    | Ce qui les fait valoir dans la cité | leur connaissance | la discussion, l'effort réitéré pour s'accorder |

    La politique n'est donc pas inféodée à la nature : c'est l'effort réitéré des citoyens pour s'entendre sur le juste. Le livre V des *Politiques*, consacré aux changements et à la sauvegarde des constitutions, cherche d'abord ce qui fait échouer cet effort : la sédition (*stasis*), que le texte rapporte à une même source.

    ! La sédition n'est pas un accident extérieur à la cité : elle naît de la façon même dont les citoyens perçoivent le juste.
