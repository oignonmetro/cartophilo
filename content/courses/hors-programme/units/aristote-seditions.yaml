- id: aristote-seditions-p2
  title: "Quelque chose de juste, mais en défaut : les séditions"
  notes: |-
    **Chaque régime a quelque chose de juste, mais se trouve en défaut absolument parlant ; c'est pourquoi chaque groupe, quand il n'a pas la part qu'il croit juste, provoque des séditions.** Des deux erreurs suivent deux prétentions : les démocrates, au nom de leur égalité, s'estiment en droit de participer également à tout ; les oligarques, au nom de leur inégalité, cherchent à avoir plus.

    Les « deux groupes » sont le parti démocratique et le parti oligarchique. S'ils provoquent des séditions, note Pellegrin, c'est que leurs régimes sont fondés sur une conception erronée du juste : ce que le commentaire « Cité, homme, lógos » appelle une perception erronée du juste, née d'un usage tronqué ou partiel du *lógos*, et qui conduit les citoyens à s'opposer dans la *stasis*.

    | Prétention | Ce qu'elle a de juste | Ce qui la met en défaut |
    | la liberté | les libres sont bien égaux en liberté | elle se pose en critère absolu |
    | la richesse | les riches sont bien supérieurs en richesse | elle se pose en critère absolu |

    Aristote reconnaît ainsi à chaque prétention (richesse, naissance, liberté) une certaine légitimité, mais la disqualifie quand elle se pose en critère absolu (Pellegrin). Une fois au pouvoir, chaque groupe gouverne au profit de son groupe particulier et inscrit dans les lois sa vision partisane de la fin de la cité : les lois des constitutions déviées reflètent une conception unilatérale de ce qui est juste.

    ! Les séditieux ne sont pas des ennemis du juste : chacun se bat au nom de l'idée du juste qui se trouve être la sienne.
  passage:
    label: "1301a33-39"
    text: "Par suite, les premiers, au nom de leur égalité, s'estiment en droit de participer également à tout, alors que les seconds, au nom de leur inégalité, cherchent à avoir plus, car le plus est inégal. Tous ces régimes ont donc quelque chose de juste, mais absolument parlant ils se trouvent en défaut, et, pour cette raison, chacun des deux groupes, quand il ne participe pas à la vie politique selon l'idée qui se trouve être la sienne, provoque des séditions."
