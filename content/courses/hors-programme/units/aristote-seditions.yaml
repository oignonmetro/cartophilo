- id: aristote-seditions-p3
  title: "L'excellence et la naissance"
  notes: |-
    **Paradoxe : ceux qui auraient les plus justes motifs de sédition, les excellents, sont ceux qui en provoquent le moins ; d'autres, les bien nés, réclament des avantages au nom de leur naissance.** Seuls les excellents, ceux qui l'emportent en excellence, peuvent raisonnablement être tenus pour inégaux, c'est-à-dire supérieurs, absolument.

    | Extrait | Ce qu'il établit |
    | 1 | les excellents : les plus justes motifs, le moins de séditions |
    | 2-3 | les bien nés, puis la conclusion : les principes et les sources des séditions |

    === 1 L'excellence, seul titre légitime

    **Seule l'excellence justifie une inégalité absolue ; ceux qui la possèdent sont pourtant ceux qui provoquent le moins de séditions.** Quand il s'agit de partager le pouvoir, l'excellence qui compte n'est ni celle de la naissance ni celle de la fortune, mais l'excellence politique : dans une constitution droite, le pouvoir est attribué à chacun dans la mesure où il y participe (*Politiques*, III, 9, 1281a4-8). Mais tous pensent avoir en partage cette excellence (IV, 4) : c'est, selon Pellegrin, la source principale des maux politiques.

    ! L'égalité proportionnelle n'est pas injuste par elle-même : appliquée au bon critère, l'excellence politique, elle fonde une inégalité légitime.

    === 2 La naissance, et la conclusion

    **Les bien nés se croient dignes d'avantages inégaux, parce qu'on tient pour bien nés ceux qui ont reçu de leurs ancêtres excellence et richesse.** La naissance n'est ainsi qu'une excellence et une richesse héritées. Le texte se clôt sur sa thèse : ces prétentions rivales au juste sont « les principes et les sources des séditions ».

    | Titre invoqué | Régime qu'il fonde (Pellegrin) |
    | la liberté | le régime populaire |
    | la richesse | l'oligarchie |
    | la naissance | la royauté |
    | la vertu | l'aristocratie |

    ! La naissance n'est pas un titre à part : on la définit par l'excellence et la richesse héritées des ancêtres.
  passage:
    label: "1301a39-b4"
    text: "Mais ceux qui auraient les plus justes motifs de provoquer des séditions, et qui pourtant le font le moins, ce sont ceux qui l'emportent en excellence, car c'est ceux-là seuls qu'il est raisonnable de tenir avant tout pour inégaux absolument. Il y en a aussi qui, l'emportant par la naissance, se croient dignes d'avantages inégaux du fait de cette inégalité, car on s'accorde à considérer comme bien nés ceux qui tiennent excellence et richesse de leurs ancêtres. Tels sont, en un mot, les principes et les sources des séditions."
