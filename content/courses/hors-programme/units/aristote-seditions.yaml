- id: aristote-seditions-p1
  title: "L'égalité proportionnelle, et deux erreurs sur elle"
  notes: |-
    **Tous s'accordent sur le principe (le juste est l'égalité proportionnelle), mais se trompent sur son application : démocrates et oligarques font d'une égalité ou d'une inégalité partielle une égalité ou une inégalité absolue.** Le texte part d'un accord pour expliquer un désaccord : de nombreuses constitutions sont nées de cette erreur.

    | Extrait | Ce qu'il établit |
    | 1 | le principe : le juste est l'égalité proportionnelle, sur laquelle on se trompe |
    | 2 | l'erreur démocratique : égaux en liberté, donc égaux absolument |
    | 3 | l'erreur oligarchique : inégaux en richesse, donc inégaux absolument |

    === 1 Le principe : l'égalité proportionnelle

    **Le juste est l'égalité proportionnelle : tout le monde en convient, mais on se trompe sur ce qu'elle est.** L'égalité proportionnelle s'oppose à l'égalité numérique : celle-ci donne une part égale à chacun quel qu'il soit, celle-là répartit biens et pouvoir proportionnellement à la valeur de chacun (Pellegrin, renvoyant à *Politiques*, III, 9, 1280a7 sq., et à l'*Éthique à Nicomaque*, V, 6). C'est, selon Pellegrin, un principe universel, valable pour toutes les constitutions.

    | Égalité | Comment elle répartit |
    | numérique | une part égale à chacun, quel qu'il soit |
    | proportionnelle | proportionnellement à la valeur de chacun |

    ! Démocrates et oligarques ne rejettent pas l'égalité proportionnelle : ils se trompent sur le critère qui la mesure.

    === 2 L'erreur démocratique

    **Égaux en un domaine, la liberté, les démocrates s'estiment égaux absolument.** Même eux sont partisans de l'égalité proportionnelle : ils veulent attribuer le pouvoir en fonction de la liberté. L'erreur est de passer d'une égalité relative (« dans un domaine ») à une égalité absolue.

    === 3 L'erreur oligarchique

    **Inégaux en un domaine, la richesse, les oligarques s'estiment inégaux en tout.** « Inégaux » veut dire ici supérieurs, comme très souvent dans les *Politiques*. L'erreur est symétrique de la précédente : d'une supériorité dans un seul domaine déterminé, ils concluent à une supériorité absolue.

    | Régime | Critère | L'erreur |
    | régime populaire | la liberté | égaux en un domaine, donc égaux absolument |
    | oligarchie | la richesse | inégaux en un domaine, donc inégaux en tout |

    ! L'erreur n'est pas le critère lui-même, liberté ou richesse : c'est de le tenir pour absolu.
