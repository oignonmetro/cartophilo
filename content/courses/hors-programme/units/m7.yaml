id: m7
title: "Le Criton : l'argument moral"
subtitle: "Platon, Criton, 47d-48a, 48b, 49c-d"
icon: page
color: yellow
group: "Socrate : la morale"
intro: |-
  Dans sa prison, Socrate refuse l'évasion que Criton lui propose. Trois passages des principes sur lesquels il fonde ce refus : la vie ne vaut pas d'être vécue avec une âme ruinée (47d-48a) ; ce qui importe n'est pas de vivre, mais de bien vivre (48b) ; il ne faut jamais rendre l'injustice pour l'injustice (49c-d).
lessons:
- id: m7-l1
  title: "Socrate en prison : la situation du dialogue"
  notes: |-
    **Condamné à mort, Socrate attend en prison l'exécution de la sentence ; son ami Criton vient le presser de s'évader, et Socrate refuse, au terme d'un examen qui ne retient qu'une question : s'évader serait-il juste ?**

    L'exécution est différée tant que n'est pas revenu le navire envoyé à Délos : pendant ce voyage sacré, la cité ne met personne à mort. Criton, du même âge et du même dème que Socrate, homme fortuné, a tout préparé : le gardien lui est acquis, des amis sont prêts à payer, des hôtes attendent Socrate en Thessalie. Ses raisons sont celles de l'amitié et de la réputation : il perdrait un ami irremplaçable, et le grand nombre croira que les amis de Socrate n'ont pas voulu payer pour le sauver ; en restant, Socrate abandonnerait ses enfants et ferait le jeu de ses ennemis.

    Socrate ne répond pas par un sentiment, mais par un examen : il n'a jamais obéi qu'au raisonnement qui, à l'examen, lui paraît le meilleur (46b), et la menace de la mort ne le lui fera pas abandonner. Le dialogue avance ainsi :

    | Moment | Repère | Ce qui s'y joue |
    | Prologue | 43a-44b | le navire de Délos, le songe de Socrate |
    | Plaidoyer de Criton | 44b-46a | l'opinion du grand nombre, l'amitié, les enfants |
    | Les principes | 46b-49e | l'opinion de l'expert, le bien-vivre, ne jamais commettre l'injustice |
    | L'application | 49e-50a | s'en aller sans avoir persuadé la cité, est-ce lui faire du tort ? |
    | La prosopopée des Lois | 50a-54d | les Lois d'Athènes prennent la parole |
    | Conclusion | 54d-e | Socrate reste |

    Les trois textes de l'unité appartiennent aux principes : la vie ne vaut pas d'être vécue avec une âme ruinée (47d-48a) ; ce qui importe n'est pas de vivre, mais de bien vivre (48b) ; il ne faut jamais rendre l'injustice pour l'injustice (49c-d). La prosopopée des Lois fait l'objet d'une autre unité, dans la piste « La politique ».

    Le *Criton* prolonge l'*Apologie* : le même principe y gouverne la conduite de Socrate, qui ne considère qu'une chose, savoir si son acte serait juste ou injuste (48c-d). Dans l'*Apologie*, l'examen par questions, l'élenchos, avait une double finalité : aiguillonner moralement les Athéniens, et tester la signification de l'oracle rendu à Delphes.

    ! Socrate ne prétend pas que sa condamnation soit juste : il soutient qu'une injustice subie n'autorise pas à en commettre une.
