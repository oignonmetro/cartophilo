    answer: "avec un corps en loques et en ruines"
    alt: []
  - id: "m7-l4-p11"
    sentence: "« SOCRATE Eh bien, **la vie vaut-elle d'être vécue** avec un corps en loques et en ruines ? CRITON Non, assurément. SOCRATE Mais la vie vaut-elle d'être vécue quand, __ce qui en nous est ruiné, c'est__ ___ ? »"
    answer: "ce que l'injustice abîme et ce à quoi la justice profite"
    alt: []
  - id: "m7-l4-p4"
    sentence: "**La justice** est à l'âme __ce qu'un régime sain est au corps : ce qui lui__ ___."
    answer: "profite"
    alt: ["est profitable", "fait du bien"]
