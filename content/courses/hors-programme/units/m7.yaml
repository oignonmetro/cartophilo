- id: "m7-l4c"
  title: "Une partie de nous-mêmes plus précieuse que le corps"
  notes: |-
    **Si la vie ne vaut pas d'être vécue avec un corps ruiné, elle le vaut moins encore avec une âme ruinée, car** {coral}**cette partie de nous-mêmes que concernent la justice et l'injustice est plus précieuse que le corps.**{/coral}

    **Pourquoi « allons-nous attribuer au corps plus de valeur » ?** La question {amber}compare les valeurs{/amber} : Socrate fait admettre à Criton que le corps ne vaut pas plus, puis qu'il vaut {green}beaucoup moins{/green}.

    **L'argument est *a fortiori*.** {coral}La ruine du corps suffit à rendre la vie invivable ; celle d'une partie plus précieuse la rend plus invivable encore.{/coral}

    **Pourquoi « quelle qu'elle soit » ?** Socrate désigne l'âme par {teal}« {/teal}cette partie de nous-mêmes, quelle {teal}qu'elle soit »{/teal} (en grec `ὅτι ποτ' ἐστίν`) : {red}il ne dit pas ce qu'elle est{/red}, seulement qu'elle a plus de valeur que le corps. C'est sur cette conclusion que s'appuie, juste après, la formule du bien-vivre {sky}(48b){/sky}.

    ! Criton ne concède pas seulement que l'âme vaut {red}autant{/red} que le corps : il accorde qu'elle vaut {green}« beaucoup plus »{/green}, ce qui donne sa force à l'*a fortiori*.
  passage:
    label: "47d-48a"
    text: "Ou bien allons-nous attribuer au corps plus de valeur qu'à cette partie de nous-mêmes, quelle qu'elle soit, que concernent l'injustice et la justice ? CRITON Non certes. SOCRATE N'est-elle pas au contraire plus précieuse ? CRITON Beaucoup plus assurément."
  points:
