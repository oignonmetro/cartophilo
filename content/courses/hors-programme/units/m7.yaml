  - id: m7-l9
    title: "Bien vivre, c'est maintenir l'âme en bon état"
    notes: |
      Le déplacement décisif de la leçon précédente suppose l'accord de la
      **cité** : s'évader sans cet accord serait-il un acte juste envers elle ?

      Socrate a fait admettre que ce qui rend une vie digne d'être vécue, ce
      n'est pas la préservation du corps, mais le **bon état** de cette partie
      de nous-mêmes qu'affectent la justice et l'injustice. Si c'est cette
      partie-là qui détermine si la vie vaut d'être vécue, alors « bien vivre »
      ne peut désigner rien d'autre que vivre avec cette partie en bon état,
      c'est-à-dire vivre justement, puisque c'est précisément la justice qui la
      fait profiter.

      Une analogie corps/âme renforce le point : de même qu'on préfère sans
      hésiter une vie courte mais **saine** à une vie longue mais malade, la
      **qualité** du corps comptant plus que sa seule durée, de même l'état de
      l'âme, que corrompt l'injustice et que préserve la justice, importe
      davantage encore, puisque c'est par elle qu'on délibère et qu'on agit.
      Bien vivre ne peut donc consister qu'à la **maintenir** dans cet état,
      c'est-à-dire à vivre justement.
