- id: "m7-l2"
  title: "Non pas vivre, mais bien vivre"
  notes: |-
    **Ce qui importe n'est pas de vivre, mais de bien vivre ; et {green}bien vivre, vivre honorablement et vivre justement sont une seule et même chose{/green}.**

    Criton vient d'objecter que le grand nombre peut nous faire mourir {sky}(48a){/sky}. Socrate maintient l'argument : ce dont il faut faire le plus de cas, ce n'est pas de vivre, mais de bien vivre. Le grec sépare nettement les deux :

    | Grec | Translittération | Sens |
    | `ζῆν` | zên | vivre, au sens de subsister, rester en vie |
    | `εὖ ζῆν` | eu zên | bien vivre |

    Criton accorde aussitôt que bien vivre, vivre honorablement (`καλῶς`) et vivre justement (`δικαίως`), c'est la même chose (`ταὐτόν`). La formule tire la conséquence de 47d-48a : si ce qui rend une vie digne d'être vécue est le bon état de la partie de nous-mêmes que concernent la justice et l'injustice, bien vivre, c'est vivre avec cette partie en bon état, c'est-à-dire vivre justement. {coral}Ce qui fait la valeur d'une vie n'est donc ni sa durée ni la préservation de l'existence biologique, mais sa qualité{/coral}.

    La conséquence pour l'évasion est immédiate {sky}(48b-d){/sky}. {red}Les raisons de Criton, l'argent, la réputation, l'éducation des enfants, sont celles du grand nombre{/red}, qui fait mourir à la légère et rendrait la vie de même s'il le pouvait. La seule question est de savoir s'il est juste de s'évader sans l'accord de la cité : {red}tout argument fondé sur la préservation de la vie, qui ne se soucierait pas d'abord de la justice, est disqualifié par avance{/red}.

    ! {teal}« Bien vivre »{/teal}, {teal}« honorablement »{/teal} et {teal}« justement »{/teal} ne sont pas trois exigences à cumuler : c'est une seule et même chose.
