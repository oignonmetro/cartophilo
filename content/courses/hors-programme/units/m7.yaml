- id: "m7-l5"
  title: "Le dommage de l'injustice : République et Gorgias"
  notes: |-
    **Que l'injustice ruine l'âme, l'argument de 47d-48a le pose par analogie avec la maladie du corps, {red}sans dire en quoi consiste ce dommage{/red} : d'autres dialogues le décrivent.**

    Le {sky}*Criton*{/sky} ne donne que la structure de l'analogie : une réalité qui peut se détériorer, ce qui la détériore, ce qui la préserve. Il ne dit pas ce que l'injustice fait à l'âme. Deux dialogues en donnent un contenu positif :

    | Dialogue | Ce qu'il établit |
    | *République*, livre I (353d-354a) | l'âme a une fonction propre : délibérer, commander, vivre ; l'injustice, vice de l'âme, l'empêche de l'accomplir, de sorte que l'âme injuste vit mal, quelles que soient les conséquences extérieures |
    | {sky}*Gorgias*{/sky} | commettre l'injustice est le plus grand des maux, pire que la subir ; le tort qu'elle cause (`βλάβη`, blabè) est une atteinte à l'âme, comme la maladie au corps |

    Le *Gorgias* ajoute que ce dommage peut rester imperceptible à celui qui le porte : {yellow}l'injuste qui échappe au châtiment ressemble au malade qui fuit le médecin{/yellow}, et rien ne l'incite à s'en défaire, ce qui rend son mal d'autant plus grave. {coral}Ce qui rend l'injustice redoutable n'est donc pas d'abord le tort fait à autrui, mais le dommage qu'elle inflige à l'âme de son auteur{/coral}. C'est ce qui donne son poids au principe du *Criton* {sky}(49b){/sky} : commettre l'injustice est mauvais pour celui qui la commet.

    ! Le dommage de l'injustice n'est pas une souffrance ressentie : il peut passer inaperçu de celui qui le porte.
