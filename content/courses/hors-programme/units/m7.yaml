  - id: m7-l5
    title: "Le complément chez Platon : République et Gorgias"
    notes: |
      **Micro-fiche : Criton 47e-48a (suite).**

      {amber}**Un trou dans l'argumentation.**{/amber} Le passage ne dit à
      aucun moment en quoi consiste le dommage que **l'injustice** inflige à
      l'âme. L'argument procède par pure analogie structurelle avec le cas du
      corps (un objet susceptible d'être détérioré, un agent de détérioration,
      un agent de préservation), transposée sans qu'aucun contenu positif ne
      soit donné à ce que l'injustice fait subir à l'âme.

      {teal}**Le complément chez Platon.**{/teal} Ce que le Criton laisse en
      suspens trouve un traitement positif ailleurs dans le corpus platonicien :
      1. Le livre I de *La République* établit que l'injustice, en tant que
      vice de l'âme, l'empêche structurellement d'accomplir sa **fonction
      propre** (délibérer, commander, vivre), de sorte qu'une âme injuste vit
      nécessairement mal, quelles qu'en soient les conséquences extérieures.
      2. Celui du **Gorgias** procède par comparaison réglée selon trois
      critères (laideur, tort, douleur) et conclut que l'**injustice** est le
      plus grand des maux : le tort causé (*blabé*) désigne, non une souffrance
      ressentie, mais une atteinte à la structure même de l'âme, comparable à ce
      que la maladie fait subir au corps ; ce dommage peut rester imperceptible
      à celui qui le porte, ce qui le rend d'autant plus grave, puisque rien ne
      l'incite alors à s'en **défaire**. Ainsi, ce n'est pas le tort fait à
      autrui qui rend l'injustice redoutable, mais le dommage qu'elle inflige en
      retour à l'âme de son auteur.
    points:
      - id: m7-l5-p1
        sentence: "Micro-fiche : Criton 47e-48a : la vie vaut-elle d'être vécue avec une âme ruinée ? Un trou dans l'argumentation. Le passage ne dit à aucun moment en quoi consiste le dommage que ___ inflige à l'âme. L'argument procède par pure analogie structurelle avec le cas du corps (un objet susceptible d'être détérioré, un agent de détérioration, un agent de préservation), transposée sans qu'aucun contenu positif ne soit donné à ce que l'injustice fait subir à l'âme."
        answer: "l'injustice"
        alt: []
      - id: m7-l5-p2
        sentence: "Micro-fiche : Criton 47e-48a : la vie vaut-elle d'être vécue avec une âme ruinée ? Le complément chez Platon. Ce que le Criton laisse en suspens trouve un traitement positif ailleurs dans le corpus. 1. Le livre I de La République établit ainsi que l'injustice, en tant que vice de l'âme, l'empêche structurellement d'accomplir sa ___ (délibérer, commander, vivre), de sorte qu'une âme injuste vit nécessairement mal, quelles qu'en soient les conséquences extérieures."
