id: m7
title: "Le Criton : l'argument moral"
subtitle: "Bien vivre, c'est vivre justement"
icon: scale
color: yellow
group: "La morale : Socrate"
lessons:
  - id: m7-l1
    title: "Le critère unique : juste ou injuste"
    notes: |
      Le **Criton** met en scène la visite que Criton, ami fortuné de Socrate,
      rend à ce dernier en prison, pour le presser de s'évader avant l'exécution
      de sa peine de mort. Le dialogue est la réponse de Socrate.

      Le même principe qui gouvernait l'Apologie y reparaît à l'identique :
      la décision de s'évader ou non ne doit être gouvernée que par une seule
      considération, savoir si cet acte serait **juste ou injuste** (48d) : pas
      les conséquences pour la vie de Socrate. Cette continuité entre les deux
      dialogues n'est pas un hasard : l'élenchos lui-même, la méthode de
      questionnement de Socrate, avait une **double finalité** : aiguillonner
      moralement ses concitoyens, et tester la signification de l'oracle rendu à
      Delphes, en examinant tous ceux qui prétendaient à la sagesse.

      Avant même d'énoncer ce critère, Socrate a déjà établi que la vie ne vaut
      pas d'être vécue si l'âme, gâtée par l'injustice, est ruinée : c'est cette
      affirmation, juste avant l'introduction du principe cardinal sur
      l'injustice, qui ouvre la voie au raisonnement qui suit (47e-48a).
    points:
      - id: m7-l1-p1
        sentence: "L'élenchos aurait eu chez Socrate une double finalité : aiguillonner moralement ses concitoyens, et ___ de l'oracle rendu à Delphes, en examinant tous ceux qui prétendaient à la sagesse"
        answer: "tester la signification"
        alt: []
      - id: m7-l1-p2
        sentence: "Dans le Criton (48d), Socrate soutient que sa décision de s'évader ou non ne doit être gouvernée que par une seule considération : savoir si cet acte serait ___"
        answer: "juste ou injuste"
        alt: []
      - id: m7-l1-p3
        sentence: "Que la vie ne vaille pas d'être vécue si l'âme, gâtée par l'injustice, est ruinée : cette affirmation de Socrate se trouve, dans le Criton, ___."
        answer: "juste avant l'introduction du principe cardinal sur l'injustice (47e-48a)"
        alt: []

  - id: m7-l2
    title: "Bien vivre, c'est vivre justement"
    notes: |
      Socrate pose ici la formule centrale du dialogue (48b) : « l'important
      n'est pas de vivre, mais de vivre dans le bien », ou, dans une
      formulation plus précise, **bien vivre**.

      Il ajoute aussitôt trois déterminations posées comme équivalentes : vivre
      bien, c'est vivre noblement (*kalôs*) et vivre **justement**. Le terme
      grec rendu par « justement » est `dikaiôs`, un terme qui reviendra dans
      tout le raisonnement qui suit.
    points:
      - id: m7-l2-p1
        sentence: "Criton (48b) : «l'important n'est pas ___»"
        answer: "de vivre, mais de vivre dans le bien"
        alt: []
      - id: m7-l2-p2
        sentence: "Dans le Criton (48b), Socrate affirme que vivre bien, vivre noblement (kalôs) et vivre ___ sont une seule et même chose"
        answer: "justement"
        alt: []
      - id: m7-l2-p3
        sentence: "Dans le Criton (48b), Socrate affirme que bien vivre et vivre justement sont une même chose ; le terme grec rendu par « justement » est ___"
        answer: "dikaiôs"
        alt: []

  - id: m7-l3
    title: "L'expert du corps, et l'expert du juste et de l'injuste"
    notes: |
      **Micro-fiche : Criton 47e-48a, la vie vaut-elle d'être vécue avec une
      âme ruinée ?**

      {teal}**Contexte.**{/teal} Ce passage s'inscrit dans la réponse que
      Socrate oppose à Criton, venu le presser de s'évader. Socrate a d'abord
      établi, à propos de l'**entraînement du corps** (47b-c), qu'on ne doit
      suivre que l'opinion de **l'expert**, jamais celle du grand nombre : une
      opinion incompétente en la matière abîme le corps, cette réalité qu'un
      régime mauvais détériore et qu'un régime bon fait prospérer.

      Il obtient ensuite de Criton que le même principe vaut pour le juste et
      l'injuste, le beau et le laid, le bien et le mal (**47c-d**) : il existe
      là aussi un expert dont le seul jugement doit être suivi, préparant
      directement l'analogie corps/âme que la suite du raisonnement va exploiter.
