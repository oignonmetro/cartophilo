  - id: m7-l6
    title: "Ne pas répondre à l'injustice par l'injustice"
    notes: |
      Un dialogue serré (49c-d) tire la conséquence pratique de tout ce qui
      précède :

      |SOCRATE|Mais quoi ! Rendre le mal pour le mal, comme le recommande le
      grand nombre, est-ce un acte juste ou un acte injuste ?|
      |CRITON|Ce n'est d'aucune manière un acte juste.|
      |SOCRATE|Car faire du tort à quelqu'un, cela revient à commettre un acte
      injuste, je suppose.|
      |CRITON|Tu dis vrai.|
      |SOCRATE|Par conséquent, il ne faut pas **répondre à l'injustice par
      l'injustice** et **faire de tort à qui que soit**, quel que soit **le
      mal subi**.|

      Ce principe, ne jamais répondre au mal par le mal, est ce qui va
      interdire à Socrate de considérer l'évasion comme une simple question de
      survie : même injustement condamné, il ne peut se permettre de commettre à
      son tour une injustice envers la cité.
