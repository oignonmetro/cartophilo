- id: "m7-l6"
  title: "Ne jamais rendre l'injustice pour l'injustice"
  notes: |-
    **Puisque faire du tort, c'est commettre une injustice, {green}il ne faut jamais rendre le mal pour le mal ni faire de tort à personne, quel que soit le mal subi{/green}.**

    Juste avant, Socrate a rappelé un principe sur lequel Criton et lui s'étaient souvent accordés {sky}(49a-b){/sky} : on ne doit en aucune manière commettre l'injustice volontairement, {coral}car la commettre est toujours mauvais et laid pour celui qui la commet{/coral}. On ne doit donc pas non plus la commettre en retour, quand on la subit, {red}contrairement à ce que pense le grand nombre{/red}. {amber}Le passage en tire le raisonnement en trois répliques{/amber} :

    | Réplique | Ce que Socrate fait admettre |
    | 1 | rendre le mal pour le mal, comme le recommande le grand nombre, n'est d'aucune manière juste |
    | 2 | faire du tort à quelqu'un revient à commettre un acte injuste |
    | 3 | il ne faut donc ni répondre à l'injustice par l'injustice, ni faire de tort à personne, quel que soit le mal subi |

    Le grec a un verbe pour la riposte : `ἀνταδικεῖν` (antadikein), commettre l'injustice en retour. Socrate sait que peu de gens admettent ce principe, et qu'{coral}entre ceux qui l'admettent et les autres il n'y a pas de délibération commune possible{/coral} {sky}(49d){/sky} : chacun ne peut que mépriser les résolutions de l'autre.

    {amber}Le principe décide de l'évasion{/amber}. Si bien vivre, c'est vivre justement {sky}(48b){/sky}, {green}aucune injustice subie n'autorise à en commettre une{/green}. Socrate fait encore admettre qu'on doit faire ce dont on est convenu avec quelqu'un, pourvu que ce soit juste {sky}(49e){/sky} ; reste à savoir si partir sans avoir persuadé la cité, ce serait lui faire du tort {sky}(49e-50a){/sky}. C'est à cette question que répondent les Lois d'Athènes, dans la prosopopée.

    ! {red}Le principe heurte la morale commune du grand nombre, qui recommande de rendre coup pour coup{/red} : Socrate le sait, et le dit.
