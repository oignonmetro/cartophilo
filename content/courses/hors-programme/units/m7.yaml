- id: "m7-l4"
  title: "Ce qu'un mauvais régime abîme : le corps"
  notes: |-
    **Le passage tire la conséquence de l'exemple de l'entraînement :** {coral}**ce qu'un régime malsain détériore, et qu'on abîme en n'écoutant pas ceux qui s'y connaissent, c'est le corps.**{/coral}

    **Pourquoi « Poursuivons donc » ?** Socrate vient d'obtenir que, pour le corps, il faut suivre l'expert et non le grand nombre (47b-c). {amber}Le passage avance en trois temps, un par fragment{/amber} : le corps (ici), puis la partie de nous-mêmes que concerne la justice, puis la comparaison de leurs valeurs.

    | Fragment | Ce que Socrate fait admettre |
    | 1/3 | ce qu'un régime malsain détériore, et qu'on abîme en n'écoutant pas ceux qui s'y connaissent, c'est le corps |
    | 2/3 | la vie ne vaut pas d'être vécue avec un corps ruiné ; la vaut-elle quand est ruiné ce que l'injustice abîme ? |
    | 3/3 | cette partie de nous-mêmes n'a pas moins, mais beaucoup plus de valeur que le corps |

    **Pourquoi « en ne donnant pas notre assentiment à l'opinion de ceux qui s'y connaissent » ?** Le dommage n'arrive pas au hasard : {red}on l'inflige soi-même{/red}, en préférant l'avis du grand nombre à celui de l'expert. {yellow}Celui qui suit les conseils de ses amis contre ceux du médecin ruine sa santé par sa propre faute.{/yellow}

    **Pourquoi « est-ce que la vie vaudra d'être vécue » ?** La question annonce l'enjeu de tout le passage : non pas seulement {red}vivre{/red}, mais {green}une vie qui vaille d'être vécue{/green}. Elle prépare la formule du bien-vivre (48b).

    ! Le corps n'est pas ici {red}méprisé{/red} : il sert de {green}premier terme d'une analogie{/green}, dont l'âme sera le second.
  passage:
    label: "47d-48a"
    text: "SOCRATE Poursuivons donc. Si ce qui s'améliore par un régime sain, et qui se détériore par un régime malsain, cette chose nous l'endommageons en ne donnant pas notre assentiment à l'opinion de ceux qui s'y connaissent, est-ce que la vie vaudra d'être vécue, une fois que cette chose sera corrompue ? Or, cette chose c'est le corps, n'est-ce pas ? CRITON Oui."
  points:
