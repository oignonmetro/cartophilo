- id: m7-l10
  title: "Le vocabulaire grec du juste"
  notes: |-
    **L'argument tient, en grec, à une seule famille de mots, dont la traduction française varie d'une ligne à l'autre.**

    | Grec | Translittération | Traduction et repère |
    | `τὸ ἄδικον`, `τὸ δίκαιον` | to adikon, to dikaion | littéralement l'injuste et le juste, rendus par « ce que l'injustice abîme et ce à quoi la justice profite » (47e) |
    | `ἀδικία`, `δικαιοσύνη` | adikia, dikaiosunè | « l'injustice et la justice » (47e-48a) |
    | `δικαίως` | dikaiôs | « justement » (48b) |
    | `ἀδικεῖν` | adikein | commettre l'injustice (49a-c) |
    | `ἀνταδικεῖν` | antadikein | répondre à l'injustice par l'injustice (49b-d) |
    | `δίκη` | dikè | le jugement rendu (50b) |

    En 47e, la traduction rend par des noms abstraits, l'injustice et la justice, deux adjectifs neutres, l'injuste et le juste. Les noms grecs viennent juste après, quand Socrate parle de la partie de nous-mêmes « que concernent l'injustice et la justice » : `ἀδικία` et `δικαιοσύνη`, la justice comme qualité de l'âme. `δίκη`, enfin, ne désigne pas cette vertu : dans la prosopopée, les Lois reprochent à l'évadé de priver de force les jugements rendus.

    ! « La justice » de 47e-48a et « justement » de 48b ne traduisent pas le même mot : un nom, `δικαιοσύνη`, et un adverbe, `δικαίως`.
