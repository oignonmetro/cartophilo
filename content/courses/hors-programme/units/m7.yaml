  - id: m7-l4
    title: "La partie de nous-mêmes que l'injustice abîme"
    notes: |
      **Micro-fiche : Criton 47e-48a (suite), le raisonnement du passage.**

      Socrate transpose au domaine éthique la question déjà posée à propos du
      corps : la vie vaut-elle d'être vécue avec un corps ruiné par un
      **mauvais régime** ? Criton avait répondu par la négative.

      Socrate applique la même question à « cette partie de nous-mêmes, quelle
      qu'elle soit » (grec `ὅτι ποτ' ἐστίν`) : {coral}« que l'injustice
      **abîme** et que la justice **fait profiter** »{/coral} (**47e**). Or,
      l'attention qu'on donne au soin du corps, il n'y a pas de raison de ne pas
      la donner à l'âme : l'analogie structurelle qui porte tout le
      raisonnement.
