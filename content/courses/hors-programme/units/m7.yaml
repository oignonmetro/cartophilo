- id: m7-l4
  title: "Le corps et l'âme : une vie qui ne vaut pas d'être vécue"
  notes: |-
    **Si la vie ne vaut pas d'être vécue avec un corps ruiné, elle le vaut moins encore avec une âme ruinée, car cette partie de nous-mêmes que concernent la justice et l'injustice est plus précieuse que le corps.**

    Le passage tire la conséquence de l'exemple de l'entraînement. Il avance en trois temps, un par fragment :

    | Fragment | Ce que Socrate fait admettre |
    | 1/3 | ce qu'un régime malsain détériore, et qu'on abîme en n'écoutant pas ceux qui s'y connaissent, c'est le corps |
    | 2/3 | la vie ne vaut pas d'être vécue avec un corps ruiné ; la vaut-elle quand est ruiné ce que l'injustice abîme ? |
    | 3/3 | cette partie de nous-mêmes n'a pas moins, mais beaucoup plus de valeur que le corps |

    L'argument est *a fortiori* : la ruine du corps suffit à rendre la vie invivable ; celle d'une partie plus précieuse la rend plus invivable encore. Il repose sur une analogie : de part et d'autre, une réalité qui peut s'améliorer ou se détériorer, ce qui l'améliore (un régime sain, la justice), ce qui la détériore (un régime malsain, l'injustice), et un expert qu'il faut écouter pour ne pas l'abîmer.

    L'âme n'est pas nommée. Socrate la désigne par ce qui l'affecte, « ce que l'injustice abîme et ce à quoi la justice profite », puis « cette partie de nous-mêmes, quelle qu'elle soit » (en grec `ὅτι ποτ' ἐστίν`) : il ne dit pas ce qu'elle est, seulement qu'elle a plus de valeur que le corps. C'est sur cette conclusion que s'appuie, juste après, la formule du bien-vivre (48b).

    ! Le passage ne dit pas en quoi consiste le dommage que l'injustice inflige à l'âme : il le pose par analogie avec la maladie du corps, sans le décrire (voir le prolongement sur *La République* et le *Gorgias*).
