- id: m7-l3
  title: "L'opinion de l'expert, non celle du grand nombre"
  notes: |-
    **Il ne faut pas faire cas de toutes les opinions, mais seulement de celle de l'homme qui sait : en matière de juste et d'injuste comme en matière de santé, c'est l'expert qu'on doit suivre, non le grand nombre.**

    Criton plaidait au nom de l'opinion du grand nombre. Socrate commence donc par examiner la valeur des opinions (46c-47a) : certaines méritent qu'on en tienne compte, d'autres non, celles des hommes sensés, non celles des insensés. Le grand nombre, du reste, ne peut faire ni le plus grand mal ni le plus grand bien : il ne rend un homme ni sensé ni insensé, et agit au hasard (44d).

    L'exemple de l'entraînement du corps (47b-c) fait voir la règle : celui qui s'exerce ne fait cas que de l'éloge et du blâme d'un seul homme, le médecin ou le maître de gymnastique ; s'il le méprise pour suivre le grand nombre, il en subira du mal, et dans son corps. Socrate obtient de Criton qu'il en va de même (47c-d) pour le juste et l'injuste, le laid et le beau, le bien et le mal : s'il y a là un homme qui s'y connaît, c'est lui qu'il faut craindre et respecter, plutôt que tous les autres ensemble, sous peine de gâter ce qui s'améliore par la justice et se perd par l'injustice.

    | | Le corps | L'âme |
    | Le domaine | la santé, l'entraînement | le juste et l'injuste, le beau et le laid, le bien et le mal |
    | L'expert | le médecin, le maître de gymnastique | l'homme qui s'y connaît, et la vérité elle-même (48a) |
    | Ce qui l'améliore | un régime sain | la justice |
    | Ce qui l'abîme | un régime malsain | l'injustice |

    Criton objecte que le grand nombre peut nous faire mourir (48a). C'est vrai, répond Socrate, mais cela ne touche pas l'argument : ce n'est pas vivre, c'est bien vivre qui importe (48b).

    ! Socrate ne méprise pas le peuple par principe : il distingue les opinions selon la compétence, et le grand nombre n'est pas compétent en matière de juste et d'injuste.
