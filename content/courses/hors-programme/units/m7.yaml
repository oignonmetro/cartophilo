  - id: m7-l8
    title: "L'âme compte plus que le corps ; vivre et bien vivre"
    notes: |
      Sans **Criton**, ami athénien fortuné qui a soudoyé les gardiens et
      préparé les moyens d'une évasion, le dilemme même du dialogue
      n'existerait pas : c'est sa visite qui force Socrate à trancher.

      Socrate construit un argument *a fortiori* : personne ne jugerait la vie
      digne d'être vécue avec un corps gravement déformé ; à plus forte raison
      faut-il refuser une vie où serait déformée **l'âme**, qui compte davantage
      que le corps et que l'injustice déforme. Dans le Criton, l'expert qu'il
      faudrait consulter en matière de bien et de mal serait l'analogue, pour
      l'âme, du **médecin** pour le corps.

      La formule « ne pas vivre, mais bien vivre » (48b) distingue deux verbes
      que le grec permet de séparer nettement : `ζῆν` (`zên`, vivre au sens de
      subsister, de demeurer en vie) et `εὖ ζῆν` (`eu zên`, bien vivre). Socrate
      affirme qu'il ne faut se soucier ni de vivre le plus longtemps possible ni
      de préserver son **existence biologique** comme fin en soi, mais seulement
      de bien vivre.

      Ce bien-vivre reçoit aussitôt deux déterminations supplémentaires, posées
      comme équivalentes : vivre **honorablement** (`καλῶς`) et vivre justement
      (`δικαίως`). Ces trois termes, qu'on serait tenté de considérer comme
      trois exigences distinctes à satisfaire, ne désignent en réalité qu'une
      seule et même chose (`ταὐτόν ἐστιν`) : bien vivre, c'est vivre
      honorablement, c'est vivre justement.

      Cette identification a une conséquence directe sur la question de
      l'évasion : si bien vivre se confond avec vivre justement, la seule
      question pertinente n'est plus celle des conséquences pour la survie
      physique de Socrate, mais celle de savoir si l'action envisagée est juste
      ou injuste. Elle disqualifie par avance tout argument fondé sur la
      **préservation de la vie** (au sens de `ζῆν`) qui ne se soucierait pas
      d'abord de sa **justice**, et prépare directement la question suivante du
      dialogue (48b-c), à savoir si s'évader sans l'accord de la cité serait un
      acte juste envers elle.
