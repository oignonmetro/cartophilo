- id: "m7-l4b"
  title: "La vie avec ce que l'injustice abîme"
  notes: |-
    **La vie ne vaut pas d'être vécue avec un corps ruiné : la vaut-elle quand est ruiné** {coral}**ce que l'injustice abîme et ce à quoi la justice profite**{/coral} **?**

    **Pourquoi « en loques et en ruines » ?** Criton accorde sans peine que {red}la vie ne vaut pas d'être vécue avec un corps ruiné{/red}. C'est le point d'appui : un accord sur le corps, que Socrate va transposer.

    **L'analogie.** {amber}Elle repose sur une structure commune{/amber} : de part et d'autre, une réalité qui peut s'améliorer ou se détériorer, ce qui l'améliore (un régime sain, la justice), ce qui la détériore (un régime malsain, l'injustice), et un expert qu'il faut écouter pour ne pas l'abîmer.

    ? **Âme** : chez Platon, ce qui en nous pense, veut et vit, et que la justice améliore comme la santé le corps. Ici, Socrate {red}ne la nomme pas{/red}.

    **Pourquoi ne pas la nommer ?** Socrate la désigne par ce qui l'affecte, {teal}« {/teal}ce que l'injustice abîme et ce à quoi {teal}la justice profite »{/teal} (47e). Il n'a pas besoin de dire ce qu'elle est : {coral}il suffit, pour l'argument, qu'elle soit ce que la justice et l'injustice concernent{/coral}.

    ! Le passage ne dit pas en quoi consiste le dommage que l'injustice inflige à l'âme : il le pose par analogie avec la maladie du corps, sans le décrire (voir le prolongement sur {sky}*La République*{/sky} et le {sky}*Gorgias*{/sky}).
  passage:
    label: "47d-48a"
    text: "SOCRATE Eh bien, la vie vaut-elle d'être vécue avec un corps en loques et en ruines ? CRITON Non, assurément. SOCRATE Mais la vie vaut-elle d'être vécue quand, ce qui en nous est ruiné, c'est ce que l'injustice abîme et ce à quoi la justice profite ?"
  points:
