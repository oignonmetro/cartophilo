  - id: m7-l10
    title: "Dikè et adikia : le vocabulaire grec du juste"
    notes: |
      Socrate emploie deux termes grecs, `dikè` et `adikia`, pour couvrir
      respectivement le juste et l'injuste en matière de devoirs envers autrui :
      on les rend en français par **le juste** et **l'injuste**.

      Avant même d'examiner si l'évasion respecterait ses accords envers la
      cité, Socrate établit que rien d'autre ne compte que de savoir si leurs
      actions seraient **justes ou injustes**. Et quand Criton invoque l'opinion
      du plus grand nombre, Socrate répond que la seule autorité qu'il
      accepterait serait celle d'un **expert** en la matière, comparable au
      médecin pour le corps, bouclant ainsi la boucle ouverte dès l'entrée en
      matière du dialogue (47b-c).
