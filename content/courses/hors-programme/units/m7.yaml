  title: "Ne jamais rendre l'injustice pour l'injustice"
  notes: |-
    **Puisque faire du tort, c'est commettre une injustice, il ne faut jamais rendre le mal pour le mal ni faire de tort à personne, quel que soit le mal subi.**

    Juste avant, Socrate a rappelé un principe sur lequel Criton et lui s'étaient souvent accordés (49a-b) : on ne doit en aucune manière commettre l'injustice volontairement, car la commettre est toujours mauvais et laid pour celui qui la commet. On ne doit donc pas non plus la commettre en retour, quand on la subit, contrairement à ce que pense le grand nombre. Le passage en tire le raisonnement en trois répliques :

    | Réplique | Ce que Socrate fait admettre |
    | 1 | rendre le mal pour le mal, comme le recommande le grand nombre, n'est d'aucune manière juste |
    | 2 | faire du tort à quelqu'un revient à commettre un acte injuste |
    | 3 | il ne faut donc ni répondre à l'injustice par l'injustice, ni faire de tort à personne, quel que soit le mal subi |

    Le grec a un verbe pour la riposte : `ἀνταδικεῖν` (antadikein), commettre l'injustice en retour. Socrate sait que peu de gens admettent ce principe, et qu'entre ceux qui l'admettent et les autres il n'y a pas de délibération commune possible (49d) : chacun ne peut que mépriser les résolutions de l'autre.

    Le principe décide de l'évasion. Si bien vivre, c'est vivre justement (48b), aucune injustice subie n'autorise à en commettre une. Socrate fait encore admettre qu'on doit faire ce dont on est convenu avec quelqu'un, pourvu que ce soit juste (49e) ; reste à savoir si partir sans avoir persuadé la cité, ce serait lui faire du tort (49e-50a). C'est à cette question que répondent les Lois d'Athènes, dans la prosopopée.

    ! Le principe heurte la morale commune du grand nombre, qui recommande de rendre coup pour coup : Socrate le sait, et le dit.
