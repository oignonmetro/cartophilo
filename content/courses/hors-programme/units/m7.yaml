- id: m7-l2
  title: "Non pas vivre, mais bien vivre"
  notes: |-
    **Ce qui importe n'est pas de vivre, mais de bien vivre ; et bien vivre, vivre honorablement et vivre justement sont une seule et même chose.**

    Criton vient d'objecter que le grand nombre peut nous faire mourir (48a). Socrate maintient l'argument : ce dont il faut faire le plus de cas, ce n'est pas de vivre, mais de bien vivre. Le grec sépare nettement les deux :

    | Grec | Translittération | Sens |
    | `ζῆν` | zên | vivre, au sens de subsister, rester en vie |
    | `εὖ ζῆν` | eu zên | bien vivre |

    Criton accorde aussitôt que bien vivre, vivre honorablement (`καλῶς`) et vivre justement (`δικαίως`), c'est la même chose (`ταὐτόν`). La formule tire la conséquence de 47d-48a : si ce qui rend une vie digne d'être vécue est le bon état de la partie de nous-mêmes que concernent la justice et l'injustice, bien vivre, c'est vivre avec cette partie en bon état, c'est-à-dire vivre justement. Ce qui fait la valeur d'une vie n'est donc ni sa durée ni la préservation de l'existence biologique, mais sa qualité.

    La conséquence pour l'évasion est immédiate (48b-d). Les raisons de Criton, l'argent, la réputation, l'éducation des enfants, sont celles du grand nombre, qui fait mourir à la légère et rendrait la vie de même s'il le pouvait. La seule question est de savoir s'il est juste de s'évader sans l'accord de la cité : tout argument fondé sur la préservation de la vie, qui ne se soucierait pas d'abord de la justice, est disqualifié par avance.

    ! « Bien vivre », « honorablement » et « justement » ne sont pas trois exigences à cumuler : c'est une seule et même chose.
