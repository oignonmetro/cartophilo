- id: platon-phedon-mythe-l7
  title: "La ciguë et le coq à Esculape (116a-118a)"
  notes: |-
    Le récit de la mort de Socrate n'ajoute aucun argument ; il montre {green}__un homme qui meurt comme l'apologie disait que meurt le philosophe__{/green}, sans révolte, et il s'achève sur une énigme.

    **Le serviteur des Onze.** Le serviteur qui vient annoncer l'heure dit à Socrate qu'il est {teal}« le plus noble, le plus doux, le meilleur de tous ceux qui sont jamais venus en cet endroit »{/teal} (116c), et s'en va en pleurant. Socrate loue sa générosité.

    **Ne pas se cramponner à la vie.** Criton le presse d'attendre : le soleil est encore sur les montagnes, d'autres ont bu longtemps après l'ordre, après avoir bien mangé et bien bu. Socrate refuse : il ne gagnerait rien à retarder, {red}« sinon me couvrir de ridicule à mes propres yeux en me cramponnant à la vie et en l'économisant, alors qu'il n'en reste déjà plus »{/red} (117a).

    **La ciguë.** On lui apporte le poison. Il boit {coral}« avec quelle sérénité, sans un tremblement, sans changer de couleur, sans changer de visage »{/coral} (117b), après avoir demandé s'il est permis d'en offrir une libation, et prié pour que ce {teal}« changement de séjour »{/teal} (117c) soit favorable. Il vide la coupe {teal}« tout tranquillement, tout facilement »{/teal} (117c). Les amis éclatent en larmes, Apollodore hurle ; Socrate les reprend : il a renvoyé les femmes pour éviter ces fausses notes, car il faut mourir {teal}« avec des paroles de bon augure »{/teal} (117e).

    **Le froid qui monte.** Il marche, se couche, et le froid monte des pieds vers le cœur. Il se découvre le visage pour ses derniers mots : {amber}« Criton, nous devons un coq à Esculape. Payez cette dette, ne soyez pas négligents. »{/amber} (118a) On sacrifiait un coq à {sky}Esculape{/sky} (Asclépios), fils d'Apollon et dieu de la médecine, en remerciement d'une guérison. De quoi Socrate est-il guéri ? On a pensé à la vie elle-même, comme une maladie ; mais le « nous » invite aussi à penser à la peur de la mort et à la misologie, dont il vient de guérir ses amis.

    **L'éloge final.** {green}« Voilà, Échécrate, ce que fut la fin de notre ami, d'un homme dont nous pouvons dire que, parmi tous ceux qu'il nous a été donné de connaître, il fut le meilleur, le plus sensé aussi et le plus juste »{/green} (118a).

    ! Le coq à Esculape n'a pas de sens assuré : la guérison peut être celle de la vie, de la peur de mourir, ou de la haine des raisonnements.
    ! La sérénité de Socrate ne prouve pas l'immortalité ; elle montre ce qu'est une vie qui s'est exercée à mourir.
