- id: platon-phedon-mythe-l2
  title: "Si l'âme est immortelle, il faut en prendre soin (107a-108c)"
  notes: |-
    L'immortalité n'est pas une consolation : elle **aggrave** l'enjeu de la vie. Si la mort délivrait de tout, les méchants y gagneraient ; puisqu'elle ne délivre de rien, {green}__le seul salut est de rendre son âme la meilleure possible__{/green}.

    **Un risque terrible.** {amber}« si vraiment l'âme est immortelle, elle réclame certainement qu'on prenne soin d'elle non seulement pour ce temps que dure ce que nous appelons vivre, mais pour la totalité du temps »{/amber} (107c), et il y a un {red}« risque terrible »{/red} (107c) à la négliger. Le raisonnement renverse la crainte du début : on craignait que l'âme ne périsse ; il faut craindre qu'elle ne survive telle qu'on l'a faite.

    **Une bonne affaire pour les méchants.** {red}« si la mort nous séparait de tout, quelle bonne affaire ce serait pour les méchants ! »{/red} (107c) Ils seraient délivrés à la fois de leur corps et de leur méchanceté. Mais l'âme étant immortelle, {coral}« il ne peut y avoir pour elle d'autre moyen de fuir tout ce qui est mauvais ni d'autre salut que de devenir la meilleure et la plus sensée possible »{/coral} (107c-d). Car elle n'emporte chez Hadès {teal}« rien d'autre avec elle que sa culture et ses goûts »{/teal} (107d) : elle ne survit pas en emportant la vie en général, mais **sa** vie, telle qu'elle l'a menée.

    **Le voyage des âmes.** On raconte que chacun, une fois mort, est conduit par le {violet}démon{/violet} qui l'avait reçu en partage de son vivant vers un lieu où les morts sont jugés, puis vers l'Hadès, et ramené ici après de longues révolutions du temps. La route n'est pas {red}« simple »{/red}, comme le dit le *Télèphe* d'{sky}Eschyle{/sky} : elle a des bifurcations, sans quoi l'on n'aurait pas besoin de guides. L'âme {green}« bien ordonnée et sensée »{/green} (108a) se laisse guider ; celle qui a désiré le corps résiste et souffre, entraînée de force. L'âme impure et criminelle, tous la fuient : elle erre seule jusqu'à ce que la nécessité l'emporte. L'âme pure a les dieux pour compagnons.

    ? **Démon** (*daimôn*) : la divinité qui, selon le mythe, reçoit chaque homme en partage de son vivant et le conduit après la mort au lieu du jugement.

    ! L'immortalité ne rassure pas : elle rend la vie plus grave, puisque l'âme emporte ce qu'elle a fait d'elle-même.
    ! Le passage au mythe n'abandonne pas l'argument : il en tire la conséquence pour la conduite de la vie.
