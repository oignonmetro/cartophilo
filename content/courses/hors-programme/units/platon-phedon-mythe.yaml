- id: platon-phedon-mythe-l5
  title: "Le beau risque : le mythe comme incantation (114c-115a)"
  notes: |-
    Socrate conclut en disant lui-même le statut de son récit : {green}__ce n'est pas un savoir, c'est un risque qui vaut d'être couru__{/green}, et une incantation à se répéter.

    **Pourquoi il faut participer à la pensée.** C'est pour ces raisons {teal}« qu'il faut tout mettre en œuvre pour, en cette vie, participer à l'excellence et à la pensée : le prix à remporter est beau et l'espérance noble »{/teal} (114c).

    **Ni certitude ni fable.** {red}« prétendre à toute force qu'il en va exactement comme je viens de le dire, cela ne convient pas à un homme qui a quelque intelligence »{/red} (114d). Mais {green}« qu'il en aille ainsi, ou à peu près ainsi, de nos âmes et de leurs séjours »{/green} (114d), si l'âme est immortelle, voilà ce qu'il convient de soutenir : {amber}« c'est un risque qui vaut la peine d'être couru »{/amber} (114d). Le risque n'est pas de mourir, mais de vivre d'une certaine façon, en philosophe, en pariant qu'on ne l'aura pas été pour rien.

    **Une incantation.** Il faut s'en faire {teal}« pour soi-même comme une incantation »{/teal} (114d) : c'est pourquoi Socrate n'en finissait pas avec ce mythe. On retrouve le remède promis à l'enfant qui a peur (77e) : le discours répété qui change la crainte en confiance.

    **L'âme parée de ses propres biens.** A confiance en son âme l'homme qui a congédié les plaisirs du corps et ce qui sert à le parer, et s'est donné aux plaisirs d'apprendre ; l'arrangement qu'il a donné à son âme {green}n'est pas une parure étrangère{/green}, mais son arrangement propre : {teal}« modération, justice, courage, liberté, vérité »{/teal} (114e-115a). Il attend calmement son voyage. Pour Socrate, dit-il, {yellow}« pour parler comme un personnage de tragédie »{/yellow} (115a), c'est maintenant que le destin l'appelle ; il va prendre son bain, {teal}« pour ne pas donner aux femmes la peine de laver un cadavre »{/teal} (115a).

    ! Le mythe ne prétend pas décrire exactement l'au-delà : Socrate en écarte lui-même la lettre et n'en garde que le sens.
    ! Le beau risque n'est pas un pari sur la mort, mais sur la vie : vivre en philosophe vaut la peine même sans certitude.
