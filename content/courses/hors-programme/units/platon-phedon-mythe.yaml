- id: platon-phedon-mythe-l4
  title: "Les fleuves souterrains et le jugement des âmes (111c-114c)"
  notes: |-
    Sous la surface, la Terre est percée de gouffres reliés par des fleuves. Cette hydrographie fantastique sert à loger les âmes : {green}__chacune reçoit le séjour qui correspond à sa manière de vivre__{/green}.

    **Le Tartare et l'oscillation.** Les cavités communiquent par des canaux où coulent des fleuves d'eau chaude et froide, de feu, de boue. Le plus profond des gouffres, qui traverse toute la Terre, est le {violet}Tartare{/violet} : tous les fleuves y convergent et en ressortent. Faute de fond, leurs eaux y {yellow}oscillent comme dans une respiration{/yellow}, et ce va-et-vient remplit tour à tour les courants de chaque côté.

    **Les quatre fleuves.** Le plus grand, le plus extérieur, est l'{violet}Océan{/violet}. En sens inverse coule l'{violet}Achéron{/violet}, qui mène au lac Achérousias, où arrivent la plupart des âmes avant d'être renvoyées vers de nouvelles naissances. Le {violet}Pyriphlégéthon{/violet}, fleuve de feu, et le {violet}Cocyte{/violet}, qui traverse le lac du Styx, s'enroulent en sens contraires.

    **Le jugement.** Les morts sont jugés, et chacun reçoit le lieu qui lui convient :
    - ceux dont la vie est **moyenne** gagnent sur des barques le lac Achérousias, où ils sont purifiés par des châtiments et récompensés de leurs bonnes actions
    - les **incurables**, sacrilèges et meurtriers répétés, sont jetés au Tartare, {red}« d'où jamais ils ne sortent »{/red} (113e)
    - les coupables de fautes graves mais **guérissables**, comme ceux qui ont frappé leur père ou leur mère dans la colère et s'en sont repentis, sont précipités dans le Tartare, puis rejetés par le Cocyte ou le Pyriphlégéthon jusqu'au lac, où ils supplient leurs victimes ; s'ils les fléchissent, ils en sortent, sinon le supplice recommence
    - ceux qui ont vécu une vie **exceptionnellement pieuse** sont délivrés de ces lieux souterrains comme d'une prison, et vivent à la surface de la vraie Terre
    - parmi eux, {green}ceux qui se sont purifiés par la philosophie vivent « absolument sans corps »{/green} (114c), dans des demeures plus belles encore

    **Ce que dit la géographie.** Le châtiment n'est pas une vengeance : c'est l'assignation à chaque âme d'un lieu qui lui ressemble. Ce qui attend l'âme après la mort ne fait que révéler ce qu'elle était déjà, et le sort des fautes graves dépend de ce que les victimes pardonnent.

    ! Les fautes guérissables ne sont pas pardonnées par les juges mais par les victimes : la purification passe par la réparation envers autrui.
    ! Seule la philosophie mène au-delà de la vie à la surface de la Terre, jusqu'à une vie sans corps.
