- id: platon-phedon-mythe-l6
  title: "« Ce Socrate qui dialogue avec vous » : le corps n'est pas Socrate (115a-116a)"
  notes: |-
    Avant de mourir, Socrate répond à deux questions de Criton : quelles dernières volontés, et comment l'ensevelir. Ses réponses ramènent tout le dialogue à son premier mot, « toi-même » : {green}__Socrate n'est pas le cadavre qu'on va ensevelir__{/green}.

    **Prendre soin de soi.** Ses instructions ? {coral}« ce que je n'ai jamais cessé de vous dire »{/coral} (115b) : avoir souci de soi-même. Sans ce souci, aucun engagement solennel, si intense soit-il, ne servirait à rien.

    ***Si vous réussissez à m'attraper.*** Comment l'ensevelir ? {teal}« Comme vous voudrez [...] À condition du moins que vous réussissiez à m'attraper, et que je ne vous échappe pas ! »{/teal} (115c) Il rit doucement : il n'arrive pas à persuader Criton que lui, {amber}« je suis ce Socrate qui dialogue avec vous à cet instant »{/amber} (115c), et non celui que Criton verra bientôt, {red}« ce cadavre »{/red}. Tout ce qu'il a dit de son départ vers les félicités des bienheureux, Criton le prend pour des paroles en l'air, une consolation.

    **Le garant inversé.** Au procès, Criton s'était porté garant que Socrate resterait ; que ses amis se portent maintenant garants auprès de Criton **qu'il ne restera pas**, qu'une fois mort il s'en ira. Ainsi Criton ne s'indignera pas en voyant brûler ou enterrer le corps, et ne dira pas que c'est Socrate qu'on porte en terre.

    **Bien parler.** {coral}« ne pas parler comme il convient constitue non seulement une faute de mesure par rapport à ce qui est ici en question, mais cela fait aussi du mal aux âmes »{/coral} (115e). Il faut dire que ce qu'on ensevelit, c'est **son corps**. La justesse des mots n'est pas un détail : appeler Socrate un cadavre, c'est penser faux sur l'âme, et en souffrir.

    **Le bain et les adieux.** Socrate se baigne ; ses amis, en l'attendant, ont l'impression de perdre un père et de rester orphelins. Il voit ses trois fils et les femmes de sa famille, puis les renvoie. Le soleil est près de se coucher.

    ! Le dernier enseignement de Socrate n'est pas une doctrine nouvelle, mais le souci de soi qu'il n'a cessé de prêcher.
    ! « Ce Socrate qui dialogue avec vous » (115c) répond au « toi-même » du prologue : le soi est l'âme qui pense et parle, non le corps.
