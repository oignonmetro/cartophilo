- id: platon-phedon-mythe-l3
  title: "La vraie Terre : nous vivons dans un creux (108c-111c)"
  notes: |-
    Le mythe commence par une géographie. Elle dit, en image, ce que l'apologie disait en concepts : {green}__nous prenons notre séjour pour le vrai, alors qu'il n'en est que la lie__{/green}.

    **La Terre en équilibre.** Socrate se dit convaincu que la Terre, ronde et au centre du ciel, n'a besoin ni d'air ni d'aucun appui pour ne pas tomber : {coral}l'uniformité du ciel et son propre équilibre suffisent{/coral}, car une chose équilibrée au centre d'un milieu partout semblable n'a aucune raison de pencher d'un côté plutôt que d'un autre. On reconnaît la cause par le meilleur que réclamait l'autobiographie, contre l'air qui soutenait la Terre des physiciens.

    **Des grenouilles autour d'une mare.** La Terre est très grande ; nous n'en habitons, du Phase aux colonnes d'Hercule, qu'une petite parcelle, {yellow}« autour de la mer comme des fourmis ou des grenouilles autour d'un marécage »{/yellow} (109b). Il y a sur toute sa surface des creux où se déversent l'eau, la vapeur et l'air, {red}la lie{/red} de l'éther ; la Terre elle-même est pure, dans la partie pure du ciel.

    **L'habitant du fond de la mer.** Nous habitons ces creux sans le savoir, et nous les croyons le plus haut lieu. Nous sommes comme {yellow}un habitant des profondeurs marines qui, apercevant les astres au travers des flots, prendrait la surface de la mer pour le ciel{/yellow}. Si quelqu'un parvenait au sommet de l'air, ou s'envolait, il verrait, comme les poissons qui lèvent la tête hors de l'eau, {green}« le ciel véritable, la lumière véritable, et la Terre qui véritablement est Terre »{/green} (109e-110a). L'image répète celle de la caverne : nous prenons pour le réel ce qui n'en est que le reflet corrompu, et c'est **par paresse et par faiblesse** que nous n'en sortons pas.

    **La Terre vue d'en haut.** Vue d'en haut, la vraie Terre serait {yellow}bariolée comme ces ballons faits de douze pièces de cuir{/yellow}, de couleurs plus pures que celles des peintres ; nos pierres précieuses n'en sont que de petits fragments. Tout y est pur, ni rongé ni corrompu ; les hommes y vivent sans maladies, et voient les dieux, le soleil, la lune, les astres {teal}« tels qu'ils sont réellement »{/teal} (111c).

    ! La vraie Terre n'est pas un ciel au-delà du monde : c'est la vérité de ce monde-ci, que notre séjour corrompt.
    ! L'image de l'habitant du fond de la mer prolonge celle de la caverne : notre paresse nous tient dans le reflet.
