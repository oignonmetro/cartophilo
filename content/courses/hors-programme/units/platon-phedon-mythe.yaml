- id: platon-phedon-mythe-l1
  title: "Repérage : le mythe et la mort de Socrate (107a-118a)"
  notes: |-
    L'argument achevé, Socrate en tire la conséquence pratique : si l'âme est immortelle, il faut en prendre soin pour tout le temps. Il la dit sous la forme d'un **mythe**, qui décrit la vraie Terre et le sort des âmes selon leur vie, puis il **meurt** comme il l'a annoncé. Le récit de sa mort accomplit ce que l'apologie disait du philosophe.

    | Moment | Lieu | Ce qui s'y joue |
    | le soin de l'âme | 107a-108c | si l'âme est immortelle, elle n'emporte que sa culture : il faut la rendre la meilleure possible |
    | la vraie Terre | 108c-111c | nous vivons dans un creux et prenons l'air pour le ciel ; la vraie Terre est pure et belle |
    | l'intérieur de la Terre | 111c-113c | le Tartare et les quatre fleuves : Océan, Achéron, Pyriphlégéthon, Cocyte |
    | le sort des âmes | 113d-114c | chaque âme reçoit le séjour qui correspond à sa manière de vivre ; les philosophes vivent sans corps |
    | le beau risque | 114c-115a | parier qu'il en va à peu près ainsi vaut la peine, sans certitude |
    | Socrate meurt | 115a-118a | le corps n'est pas Socrate ; il boit la ciguë avec sérénité et doit un coq à Esculape |
