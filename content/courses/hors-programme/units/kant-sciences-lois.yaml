# Cours tiré de l'article « Kant's Philosophy of Science » (Stanford
# Encyclopedia of Philosophy, 2003, révision 2023), sections 3 et 4 : les
# lois et les hypothèses, puis l'Opus postumum. Les citations de Kant sont
# la traduction française de la traduction anglaise de l'article, avec ses
# situées par œuvre et section.
#
# Point laissé de côté : l'article annonce trois critères de recevabilité
# d'une hypothèse (Discipline de la raison pure relativement aux
# hypothèses) mais n'en énonce que deux ; le troisième n'est donc pas
# reproduit ici et ne sera pas complété de mémoire.

id: kant-sciences-lois
title: "Lois, hypothèses et Opus postumum"
subtitle: "Ce qu'est une loi pour Kant, ce qu'est une bonne hypothèse, et la physique de la fin"
icon: bulb
color: blue
group: "Kant : la philosophie des sciences"
intro: |-
  Cette unité prend un peu de recul sur les *Premiers principes* : qu'est-ce qu'une loi
  de la nature pour Kant ? À quelles conditions une hypothèse est-elle légitime ? Et que
  cherche-t-il encore, jusqu'à la fin de sa vie, dans les brouillons de l'*Opus postumum* ?
lessons:
- id: ks3-l1
  title: "Ce qu'est une loi : trois lectures de Kant"
  notes: |-
    La Révolution scientifique a installé un nouveau type de savoir, fondé sur des lois de
    la nature. La philosophie de la nature de Kant donne à cette notion une place centrale :
    il l'analyse, il s'en sert pour distinguer des lois fondamentales, et il l'intègre à son
    image d'une science systématique. **Cette leçon porte sur l'analyse du concept, et sur
    ce qui en fait l'objet de trois lectures concurrentes.**

    **La définition.** Pour le Kant critique, une loi est un {violet}jugement{/violet}, une
    proposition **nécessaire** et **imposée par une faculté de l'esprit** : l'entendement ou
    la raison. Dans la connaissance théorique, les lois **déterminent** l'objet qu'elles
    gouvernent ; les lois de la raison pratique, elles, **lient** leurs sujets en leur
    prescrivant une action ou une maxime. Trois classes de lois :
    - {green}transcendantales{/green} : les principes purs de l'entendement ;
    - {green}métaphysiques{/green} : par exemple ses trois lois de la mécanique ;
    - {green}empiriques{/green} : en particulier celles de la chimie.

    **Qu'est-ce qui rend une loi nécessaire ?** Trois réponses.
    - {green}Watkins (2019){/green} : les lois sont en partie fondées sur la nature de
      connaisseurs comme nous, c'est-à-dire sur les facultés (et leurs structures *a priori*)
      que Kant étudie dans la première *Critique*.
    - {green}La lecture nécessitarienne{/green} (Messina 2017, Massimi 2017, Engelhard 2018) :
      les lois sont fondées sur les **natures des choses** qu'elles concernent, leurs
      propriétés essentielles et leurs pouvoirs. Elle fait de Kant un précurseur de la
      conception de la loi de Fred Dretske.
    - {green}La lecture du « meilleur système »{/green} (Kitcher 1986, Breitenbach 2018) :
      certaines propositions comptent comme lois en vertu de leur place dans un ordre de nos
      connaissances que dirigent les idées de la raison. Elle fait de Kant un précurseur de
      la conception de David Lewis.

    Watkins soutient que, bien lu, Kant combine les forces des deux dernières images : il
    garde la dimension nécessitarienne en soulignant le rôle de nos actes, de nous en tant
    que sujets épistémiques **spontanés**, vis-à-vis de la nature comme objet d'une
    expérience unifiée.

    ! Les trois lectures répondent à une seule question : d'où vient la nécessité d'une loi,
    de nous, des choses, ou de la place de la loi dans un système ?
  points:
  - id: ks3-l1-p1
    sentence: "Pour le Kant critique, une loi est un jugement nécessaire imposé par une faculté de l'esprit : l'___ ou la raison."
    answer: "entendement"
    alt: []
  - id: ks3-l1-p2
    sentence: "Dans la connaissance théorique, les lois ___ l'objet qu'elles gouvernent, alors que les lois de la raison pratique lient leurs sujets en leur prescrivant une action ou une maxime."
    answer: "déterminent"
    alt: []
  - id: ks3-l1-p3
    sentence: "Kant distingue trois classes de lois : les lois transcendantales (les principes purs de l'entendement), les lois ___ (ses trois lois de la mécanique) et les lois empiriques."
    answer: "métaphysiques"
    alt: []
  - id: ks3-l1-p4
    sentence: "Parmi les lois que Kant range dans la classe des lois empiriques, il y a en particulier celles de la ___."
    answer: "chimie"
    alt: []
  - id: ks3-l1-p5
    sentence: "Dans la lecture de Watkins (2019), les lois sont en partie fondées sur la nature de connaisseurs comme nous, c'est-à-dire sur leurs ___ et leurs structures *a priori*, étudiées dans la première *Critique*."
    answer: "facultés"
    alt: []
  - id: ks3-l1-p6
