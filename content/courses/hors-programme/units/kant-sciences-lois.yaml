    answer: "relation"
    alt: []
- id: ks3-l3
  title: "L'Opus postumum : la lacune, l'éther et le système des forces"
  notes: |-
    Après 1786, Kant ne quitte pas la physique : jusqu'à la fin de sa vie productive, il
    accumule notes, esquisses et brouillons, surtout à partir de 1796, que l'on réunira plus
    d'un siècle après sa mort sous le titre d'*Opus postumum*. Le texte est très fragmentaire,
    sa pensée y reste en mouvement jusqu'aux dernières parties, vers 1802 : **la recherche
    cherche à en retrouver l'évolution et la portée plutôt qu'une doctrine stable, qui lui
    manque la plupart du temps.**

    **Pourquoi écrire un nouvel ouvrage ?** Dans des lettres de 1798, Kant parle de manière
    énigmatique d'une {violet}lacune{/violet} dans sa philosophie critique. Les interprètes
    la situent tantôt dans sa théorie de la matière (masse et densité), tantôt entre ses
    approches constitutive et régulatrice des fondements métaphysiques de la science, tantôt
    dans le schématisme des catégories. Howard (2023) y lit une pièce manquante du
    « système de la philosophie » tout entier (*hiatus in systemato*, *Opus postumum*, Convolut IV) : il s'agirait
    de médiatiser, par une doctrine-passerelle, entre les fondements métaphysiques de la
    science de la nature et la **physique comme système**. Cette lecture éclaire deux points
    obscurs : les tentatives répétées de Kant pour formuler une « transition », et celles de
    définir la physique de façon à pouvoir légitimement dire qu'elle est une science
    systématique : {teal}« La physique est la recherche systématique de la nature par les
    forces de la matière données empiriquement, en tant qu'elles sont liées entre elles dans
    un système »{/teal} (*Opus postumum*, Convolut X). Cette définition est très large : elle fait entrer dans
    la physique les « forces » de la chimie, de la science de la chaleur, de la botanique et de
    la physiologie animale.

    **L'éther.** Kant cherche à démontrer *a priori* l'existence d'une entité qu'il nomme
    {violet}éther{/violet} ou {violet}calorique{/violet} : une sorte de substrat universel,
    fluide qui remplit tout l'espace physique, soutient les forces motrices et transporte
    leurs actions d'un lieu à un autre (comme une pression exercée en un point d'un fluide
    incompressible se transmet à d'autres points). Il veut en donner une « déduction », une
    espèce de preuve non empirique de son existence : la « preuve de l'éther »
    (*Ätherbeweis*), que les interprètes tiennent pour un véritable argument déductif à
    reconstruire.

    **Un système élémentaire des forces motrices.** Kant cherche une dérivation méthodique
    des propriétés **spécifiques** de la matière : ni communes à toute matière, ni trop
    particulières ou passagères, mais propres à une large classe de comportements. Il songe
    à la chaleur, au poids, à l'élasticité, à la solidité. Ces propriétés résultent d'une
    force exercée (la gravité induit le poids) ou causent une force de mouvement (le
    rebond élastique repousse le corps qui comprimait la matière élastique) : un système
    élémentaire de propriétés est donc aussi un système de forces. Il cherche une
    **heuristique rationnelle** : un critère d'une taxinomie qui soit *a priori*, c'est-à-dire
    déductible avant la découverte empirique de ces propriétés.

    **Ce que l'éther devait accomplir.** Les interprétations anciennes y voient le fondement
    de la transition entre métaphysique et physique empirique. Howard (2023) soutient
    autrement : la déduction de l'éther et la taxinomie des forces élémentaires fonderaient
    ce qui fait de la physique empirique un savoir **systématique**, à long terme, si on la
    poursuit comme il faut.

    ! Il n'y a pas dans l'*Opus postumum* de doctrine stable à retenir : on y retient une
    question (la transition), une définition de la physique et deux chantiers (l'éther,
    le système des forces).
  points:
  - id: ks3-l3-p1
    sentence: "Les notes, esquisses et brouillons que Kant rédige sur la physique, surtout à partir de 1796, sont rassemblés plus d'un siècle après sa mort sous le titre d'___."
    answer: "Opus postumum"
    alt: ["opus postumum"]
  - id: ks3-l3-p2
    sentence: "Dans des lettres de 1798, Kant parle de manière énigmatique d'une ___ dans sa philosophie critique, que l'*Opus postumum* aurait pour but de combler."
    answer: "lacune"
    alt: ["un vide"]
  - id: ks3-l3-p3
    sentence: "Howard (2023) lit dans l'expression latine « *hiatus in* ___ » (*Opus postumum*, Convolut IV) une pièce manquante du système de la philosophie tout entier, à combler par une doctrine-passerelle."
    answer: "systemato"
    alt: []
  - id: ks3-l3-p4
