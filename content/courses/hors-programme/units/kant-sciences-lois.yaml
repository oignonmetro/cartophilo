- id: ks3-l2
  title: "Lois fondamentales, lois empiriques et hypothèses"
  notes: |-
    Après le concept de loi, trois questions de contenu : quelles sont les lois
    fondamentales de la physique ? Peut-on connaître des lois empiriques ? À quelles
    conditions une hypothèse est-elle acceptable ? **Kant n'y défend pas une science où
    tout serait certain : il fixe des seuils, des limites et des critères.**

    **Trois lois fondamentales.** En philosophie de la physique, Kant privilégie la
    {violet}conservation de la masse{/violet}, la {violet}loi d'inertie{/violet} et
    l'{violet}égalité de l'action et de la réaction{/violet}. Il les juge fondamentales pour
    la mécanique telle qu'il la conçoit : une théorie des échanges de quantité de mouvement,
    ou « communication du mouvement ». Ce sont les lois les plus proches, par
    l'explication et par la preuve, des **Analogies de l'expérience**, principes les plus
    généraux de la connaissance théorique. La deuxième Analogie est notamment une prémisse
    clef de la preuve de la deuxième loi de la mécanique.

    **Les lois empiriques**, qui gouvernent une classe restreinte d'objets ou de propriétés
    donnés *a posteriori*. Pour qu'un savoir soit une science rationnelle, il doit en comporter
    qui soient reliées de façon systématique. Deux questions occupent la recherche récente :
    - ce qui fait d'une proposition une loi empirique : sa place dans un système, pour les
      uns ; une étape de l'enquête guidée par des principes normatifs kantiens, comme les
      Postulats de la pensée empirique, pour les autres ;
    - si l'on peut les **connaître**. {red}Kreines (2017){/red} le nie : malgré la place que
      Kant leur donne, leur connaissance est hors de notre portée. {green}McNulty (2015) et
      Cooper (2023){/green} soutiennent qu'une enquête menée dans de bonnes conditions peut
      découvrir des lois empiriques dans un domaine particulier, par exemple en chimie.

    **Les hypothèses.** La science après 1650 recourt sans cesse à des hypothèses, c'est-à-dire
    à des affirmations dont les preuves ne sont pas concluantes (optique, électricité,
    magnétisme, chaleur, chimie, histoire naturelle). Wolff et Émilie du Châtelet avaient
    développé des doctrines pour en rendre compte. Kant cherche à son tour des **critères
    normatifs** : des seuils que doit atteindre une hypothèse pour qu'on puisse légitimement
    raisonner à partir d'elle. Il les défend dans la « Discipline de la raison pure relativement
    aux hypothèses », partie de la première *Critique*.
    - {green}Premier critère{/green} : l'hypothèse doit porter sur des choses « réellement
      possibles », c'est-à-dire des objets et des propriétés spatio-temporels. Cela exclut
      l'hypothèse, que certains newtoniens avançaient dans les années 1700, selon laquelle
      Dieu serait la cause de la gravitation.
    - {green}Deuxième critère{/green} : l'hypothèse doit porter sur des objets et des
      processus liés causalement (plus largement, par les catégories de la relation) à « ce
      qui est effectivement donné, et par suite certain » (Discipline de la raison pure, 3e section).

    ! Une hypothèse n'est pas une simple supposition : Kant l'encadre, comme il encadre les
    lois, par des conditions de légitimité.
  points:
  - id: ks3-l2-p1
    sentence: "En philosophie de la physique, Kant privilégie trois lois : la conservation de la masse, la loi d'inertie et l'égalité de l'action et de la ___."
    answer: "réaction"
    alt: []
  - id: ks3-l2-p2
    sentence: "Ces trois lois sont fondamentales pour la mécanique comprise comme théorie des échanges de quantité de mouvement, que Kant appelle la « ___ du mouvement »."
    answer: "communication"
    alt: []
  - id: ks3-l2-p3
    sentence: "Les trois lois fondamentales de la mécanique sont celles qui se tiennent le plus près, par l'explication et par la preuve, des ___ de l'expérience, principes les plus généraux de la connaissance théorique."
    answer: "Analogies"
    alt: ["analogies"]
  - id: ks3-l2-p4
    sentence: "Pour qu'un corps de connaissances soit une science rationnelle, Kant exige qu'il comporte des lois empiriques reliées de façon ___."
    answer: "systématique"
    alt: []
  - id: ks3-l2-p5
    sentence: "Malgré la place que Kant accorde aux lois empiriques, Kreines (2017) soutient que leur ___ est hors de notre portée."
    answer: "connaissance"
    alt: []
  - id: ks3-l2-p6
    sentence: "À l'inverse de Kreines, McNulty (2015) et Cooper (2023) soutiennent que, dans de bonnes conditions, la recherche peut conduire à découvrir des lois empiriques dans un domaine particulier, par exemple dans les phénomènes de la ___."
    answer: "chimie"
    alt: []
  - id: ks3-l2-p7
    sentence: "Kant défend ses critères de recevabilité des hypothèses dans la « Discipline de la raison pure relativement aux ___ », partie de la *Critique de la raison pure*."
    answer: "hypothèses"
    alt: []
  - id: ks3-l2-p8
    sentence: "Selon l'un des critères de Kant, une hypothèse doit porter sur des choses « réellement possibles », c'est-à-dire sur des objets et des propriétés ___, ce qui exclut que Dieu soit tenu pour la cause de la gravitation."
    answer: "spatio-temporels"
    alt: ["spatio-temporel", "dans l'espace et le temps"]
  - id: ks3-l2-p9
