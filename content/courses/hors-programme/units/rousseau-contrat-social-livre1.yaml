  points:
  - id: rousseau-contrat-social-livre1-l3-q1
    sentence: "« **La plus ancienne de toutes les sociétés** __et la seule naturelle est celle de la__ ___. » (I, 2, § 1)"
    answer: "famille"
  - id: rousseau-contrat-social-livre1-l3-q2
    sentence: "« S'ils continuent de rester unis ce n'est plus naturellement c'est volontairement, et **la famille elle-même** __ne se maintient que par__ ___. » (I, 2, § 1)"
    answer: "convention"
  - id: rousseau-contrat-social-livre1-l3-q3
    sentence: "« Cette liberté commune est une conséquence de la nature de l'homme. **Sa première loi** __est de veiller à sa propre__ ___ » (I, 2, § 2)."
    answer: "conservation"
  - id: rousseau-contrat-social-livre1-l3-q4
    sentence: "« **Aristote avait raison**, __mais il prenait l'effet pour la__ ___. » (I, 2, § 8)"
    answer: "cause"
  - id: rousseau-contrat-social-livre1-l3-q5
    sentence: "« S'il y a donc des esclaves par nature, c'est parce qu'il y a eu des esclaves contre nature. **La force a fait les premiers esclaves**, __leur__ ___ __les a perpétués__. » (I, 2, § 8)"
    answer: "lâcheté"
  - id: rousseau-contrat-social-livre1-l3-q6
    sentence: "La troisième forme de soumission naturelle qu'examine le chapitre 2 du livre I, l'autorité héritée d'___ par succession, n'est réfutée que par l'**ironie** (I, 2, § 9)."
    answer: "Adam"
- id: rousseau-contrat-social-livre1-l4
  title: "Repérage : le droit du plus fort (I, 3)"
  notes: |-
    **Le chapitre 3 montre que la force ne peut produire aucune obligation : un « droit du plus fort » se détruit lui-même.** Il dégage par contraste ce qui définit le droit, sa durée et l'obéissance par devoir.

    | Moment | Lieu | Ce qui s'y joue |
    | la force ne produit aucune moralité | § 1 | céder à la force est un acte de nécessité, non de volonté |
    | le galimatias | § 2 | par l'absurde : un droit qui périt quand la force cesse n'ajoute rien à la force |
    | « Obéissez aux puissances » | § 3 | la maladie et le brigand : une puissance n'est pas une autorité |
    | la conclusion | § 4 | force ne fait pas droit ; la question primitive revient |

    ! Le chapitre ne combat pas seulement une thèse adverse : il montre ce que doit admettre quiconque accorde à la force le nom de droit.
  tables:
  - table: moment-lieu-ce-qui-s-y-joue
    exercises:
    - {kind: order, column: Lieu}
    - {kind: cell, column: Lieu}
  points:
  - id: rousseau-contrat-social-livre1-l4-q1
    sentence: "« Le plus fort n'est jamais assez fort pour être toujours le maître, **s'il ne transforme sa force** __en__ ___ et l'obéissance en devoir. » (I, 3, § 1)"
    answer: "droit"
  - id: rousseau-contrat-social-livre1-l4-q2
    sentence: "« **Céder à la force** est un acte de nécessité, non de volonté ; __c'est tout au plus un acte de__ ___. » (I, 3, § 1)"
    answer: "prudence"
  - id: rousseau-contrat-social-livre1-l4-q3
    sentence: "« Supposons un moment ce prétendu droit. __Je dis qu'il n'en résulte qu'un__ ___ **inexplicable**. » (I, 3, § 2)"
    answer: "galimatias"
  - id: rousseau-contrat-social-livre1-l4-q4
    sentence: "« **Toute puissance vient de Dieu**, je l'avoue ; __mais toute__ ___ __en vient aussi__. Est-ce à dire qu'il soit défendu d'appeler le médecin ? » (I, 3, § 3)"
    answer: "maladie"
  - id: rousseau-contrat-social-livre1-l4-q5
    sentence: "« Convenons donc que **force ne fait pas droit**, et __qu'on n'est obligé d'obéir qu'aux puissances__ ___. » (I, 3, § 4)"
    answer: "légitimes"
- id: rousseau-contrat-social-livre1-l5
  title: "Repérage : l'esclavage (I, 4)"
  notes: |-
    **Le chapitre 4 écarte la thèse la plus dangereuse : une convention par laquelle des hommes renonceraient librement à leur liberté.** Deux arguments prétendent fonder ainsi la soumission, l'échange de la liberté contre la sécurité (§ 2-6), et celui de la liberté contre la vie (§ 7-12) ; Rousseau en tire qu'une convention suppose et conserve la liberté de ceux qui la passent.

    | Moment | Lieu | Ce qui s'y joue |
    | restent les conventions | § 1 | ni la nature ni la force ne fondent l'autorité : restent les conventions |
    | un peuple peut-il s'aliéner ? | § 2-5 | contre Grotius : un peuple ne se vend ni ne se donne, et nul n'aliène ses enfants |
    | une aliénation impensable | § 6 | renoncer à sa liberté, c'est renoncer à sa qualité d'homme |
    | la liberté contre la vie | § 7 | le vainqueur, qui aurait le droit de tuer, laisserait la vie au vaincu contre sa liberté |
    | la guerre, relation d'État à État | § 8-9 | sans relations réelles, il n'y a pas d'état de guerre entre les hommes |
    | le droit de la guerre | § 10-12 | la guerre ne donne aucun droit qui ne soit nécessaire à sa fin ; le cercle vicieux |
    | la conclusion | § 13-14 | la convention prolonge l'état de guerre ; « esclavage » et « droit » s'excluent |

    ! La liberté n'est pas un bien qu'on possède : elle fait l'homme, et ne peut donc s'aliéner (§ 6).
