    answer: "prescrite"
- id: rousseau-contrat-social-livre1-l10
  title: "Repérage : le domaine réel (I, 9)"
  notes: |-
    **Le chapitre 9 tire du pacte la distinction de la possession et de la propriété : ce n'est pas la propriété qui fonde la société, c'est la société qui fonde la propriété.** Il s'achève, avec le livre, sur l'égalité.

    | Moment | Lieu | Ce qui s'y joue |
    | la possession publique | § 1 | chacun se donne avec ses biens ; la possession publique est plus forte, non plus légitime à l'égard des étrangers |
    | le droit du premier occupant | § 2-4 | il ne devient un vrai droit qu'après la propriété, et sous trois conditions : terrain inhabité, besoin, travail |
    | territoire et souveraineté | § 5 | les rois des Perses, chefs des hommes ; les rois de France, maîtres du pays |
    | la propriété garantie | § 6-7 | la communauté change l'usurpation en un véritable droit ; le droit du particulier reste subordonné à celui de la communauté |
    | l'égalité par convention | § 8 | le pacte substitue une égalité morale et légitime à l'inégalité physique |

    ! L'aliénation des biens à la communauté ne dépouille pas les particuliers : elle leur assure la légitime possession de ce qu'ils ont donné.
