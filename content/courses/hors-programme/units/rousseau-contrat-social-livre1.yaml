lessons:
- id: rousseau-contrat-social-livre1-l1
  title: "Repérage : le plan du livre I (I, 1-9)"
  notes: |-
    Le livre I ne pose qu'**un seul problème**, celui de la {amber}**légitimité de l'ordre civil**{/amber}, et le résout. Il procède en {sky}deux temps{/sky} : {red}__une partie négative__{/red} (chap. 2 à 5) écarte les fausses conceptions du lien social et remonte à la première convention ; {green}__une partie positive__{/green} (chap. 6 à 9) forme le pacte social et en tire les conséquences. Le préambule, écrit après coup, ouvre le chapitre 1.

    | Mouvement | Lieu | Ce qui s'y joue |
    | le problème | chap. 1 | « l'homme est né libre, et partout il est dans les fers » : qu'est-ce qui peut rendre ce changement légitime ? |
    | les fausses conceptions du lien social | chap. 2-4 | ni la nature, ni la force, ni une convention de soumission ne fondent une autorité légitime |
    | la première convention | chap. 5 | tout pacte de soumission suppose l'acte par lequel un peuple est un peuple |
    | le pacte social | chap. 6 | une association où chacun, s'unissant à tous, n'obéit qu'à lui-même : l'aliénation totale à la communauté |
    | les effets du pacte | chap. 7-9 | les obligations du souverain et des sujets, le passage à l'état civil, la propriété |

    {coral}__Ouvert sur la **liberté**, le livre se referme sur l'**égalité**__{/coral} : « L'homme est né libre » (I, 1) ; les hommes « deviennent tous égaux par convention et de droit » (I, 9).

    ! La partie négative n'est pas un préalable sans contenu : chaque réfutation y pose une thèse positive du droit politique.
