    answer: "lien"
    alt: []
  - id: rousseau-contrat-social-livre1-l1-q2
    sentence: "Les chapitres 2 à 4 du livre I du *Contrat social* écartent trois fondements de l'autorité : la nature, __la__ ___, et une convention de soumission."
    answer: "force"
    alt: []
  - id: rousseau-contrat-social-livre1-l1-q3
    sentence: "Le chapitre 6 du livre I du *Contrat social*, « Du pacte social », énonce le « __problème__ ___ » dont le contrat social donne la solution."
    answer: "fondamental"
    alt: []
  - id: rousseau-contrat-social-livre1-l1-q4
    sentence: "Ouvert sur la liberté, le livre I du *Contrat social* se referme sur l'**égalité** : les hommes « __deviennent tous égaux par__ ___ et de droit » (I, 9, § 8)."
    answer: "convention"
    alt: []
- id: rousseau-contrat-social-livre1-l2
  title: "Repérage : le problème (préambule et I, 1)"
  notes: |-
    **Le préambule et le chapitre 1 formulent deux fois le même problème, celui de la légitimité de l'ordre civil.** Le préambule en donne la forme générale et le point de vue, celui du {sky}citoyen{/sky} ; le chapitre 1 lui donne son contenu, la liberté perdue, et la direction de la solution, la convention.

    | Préambule | Lieu | Ce qui s'y joue |
    | l'objet de la recherche | § 1 | une règle d'administration légitime et sûre, qui allie ce que le droit permet et ce que l'intérêt prescrit |
    | ni prince ni législateur | § 2 | c'est pour cela même qu'il écrit sur la politique : qui gouverne agit ou se tait |
    | le point de vue du citoyen | § 3 | membre du souverain, le droit de voter lui impose le devoir de s'instruire |

    | Chapitre 1 | Lieu | Ce qui s'y joue |
    | les données du problème | § 1 | né libre, l'homme est partout dans les fers ; on ne demande pas comment, mais ce qui peut rendre ce changement légitime |
    | l'hypothèse de la force | § 2 | si seule la force comptait, le peuple qui secoue le joug ferait encore mieux |
    | la direction de la solution | § 2 | l'ordre social est un droit sacré, qui ne vient pas de la nature : il est fondé sur des conventions |
    | l'annonce de la suite | § 2 | avant de dire quelles sont ces conventions, établir ce qui vient d'être avancé |

    ! Le problème n'est pas théorique (comment la liberté s'est perdue, question du second *Discours*) mais de droit : ce qui peut rendre l'ordre civil légitime.
