    answer: "conventions"
  - id: rousseau-contrat-social-livre1-l5-q2
    sentence: "Contre Grotius, Rousseau définit le mot équivoque : « **Aliéner** __c'est donner ou__ ___. » (I, 4, § 2)"
    answer: "vendre"
  - id: rousseau-contrat-social-livre1-l5-q3
    sentence: "Contre l'argument de la tranquillité civile assurée par le despote : « __On vit tranquille aussi dans les__ ___ ; en est-ce assez pour s'y trouver bien ? » (I, 4, § 3)"
    answer: "cachots"
  - id: rousseau-contrat-social-livre1-l5-q4
    sentence: "« **Renoncer à sa liberté** __c'est renoncer à sa__ ___ __d'homme__, aux droits de l'humanité, même à ses devoirs. » (I, 4, § 6)"
    answer: "qualité"
  - id: rousseau-contrat-social-livre1-l5-q5
    sentence: "« c'est ôter toute ___ __à ses actions que d'ôter toute__ **liberté à sa volonté** » (I, 4, § 6)."
    answer: "moralité"
  - id: rousseau-contrat-social-livre1-l5-q6
    sentence: "« **La guerre** n'est donc point une relation d'homme à homme, mais une relation d'État à État, dans laquelle les particuliers __ne sont ennemis__ qu'___ » (I, 4, § 10)."
    answer: "accidentellement"
  - id: rousseau-contrat-social-livre1-l5-q7
    sentence: "« En établissant le droit de vie et de mort sur le droit d'esclavage, et le droit d'esclavage sur le droit de vie et de mort, __n'est-il pas clair qu'on tombe dans le__ ___ ? » (I, 4, § 12)"
    answer: "cercle vicieux"
  - id: rousseau-contrat-social-livre1-l5-q8
    sentence: "« Ces mots, **esclavage, et, droit** __sont__ ___ ; ils s'excluent mutuellement. » (I, 4, § 14)"
    answer: "contradictoires"
- id: rousseau-contrat-social-livre1-l6
  title: "Repérage : la première convention (I, 5)"
  notes: |-
    **Le chapitre 5 établit à nouveaux frais ce que les chapitres 2 à 4 ont montré, mais par une voie directe : l'analyse du concept même de société.**

    | Moment | Lieu | Ce qui s'y joue |
    | agrégation et association | § 1 | soumettre une multitude n'est pas régir une société : un maître et des esclaves ne font pas un peuple |
    | l'acte par lequel un peuple est un peuple | § 2 | Grotius suppose le peuple avant son don à un roi : cet acte antérieur est le vrai fondement |
    | la règle de la majorité | § 3 | la loi de la pluralité des suffrages suppose au moins une fois l'unanimité |

    ! L'argument retourne contre Grotius sa propre thèse : pour se donner à un roi, un peuple doit déjà avoir une volonté commune.
  tables:
  - table: moment-lieu-ce-qui-s-y-joue
    exercises:
    - {kind: order, column: Lieu}
    - {kind: cell, column: Lieu}
  points:
  - id: rousseau-contrat-social-livre1-l6-q1
    sentence: "« Il y aura toujours une grande différence **entre soumettre une multitude**, __et__ ___ __une société__. » (I, 5, § 1)"
    answer: "régir"
  - id: rousseau-contrat-social-livre1-l6-q2
    sentence: "Des hommes épars asservis à un seul : « c'est si l'on veut une ___, __mais non pas une__ **association** ; il n'y a là ni bien public ni corps politique » (I, 5, § 1)."
    answer: "agrégation"
  - id: rousseau-contrat-social-livre1-l6-q3
    sentence: "« il serait bon d'examiner **l'acte par lequel un peuple est un peuple**. Car cet acte étant __nécessairement__ ___ __à l'autre__ est le vrai fondement de la société. » (I, 5, § 2)"
    answer: "antérieur"
  - id: rousseau-contrat-social-livre1-l6-q4
    sentence: "« **La loi de la pluralité des suffrages** est elle-même un établissement de convention, __et suppose au moins une fois__ l'___. » (I, 5, § 3)"
    answer: "unanimité"
  - id: rousseau-contrat-social-livre1-l6-q5
    sentence: "Le chapitre 5 du livre I démontre à nouveaux frais ce que les chapitres 2 à 4 ont établi, __mais par une voie__ ___ : l'analyse du concept même de **société**."
    answer: "directe"
- id: rousseau-contrat-social-livre1-l7
  title: "Repérage : le pacte social (I, 6)"
  notes: |-
    **Le chapitre 6 rejoue en raccourci le mouvement du livre entier : les données du problème, sa formulation, sa solution, puis ses conséquences.** Le problème, posé dans toute sa précision, détermine entièrement sa solution.

    | Moment | Lieu | Ce qui s'y joue |
    | une nécessité | § 1 | les obstacles à la conservation l'emportent : le genre humain périrait s'il ne changeait sa manière d'être |
    | une possibilité | § 2 | les hommes ne peuvent engendrer de forces nouvelles, seulement unir celles qui existent |
    | une condition | § 3 | la force et la liberté de chacun sont les premiers instruments de sa conservation |
    | le problème fondamental | § 4 | une association par laquelle chacun, s'unissant à tous, n'obéisse qu'à lui-même |
    | la solution | § 5-8 | les clauses se réduisent à une seule : l'aliénation totale de chaque associé à toute la communauté |
    | la formule du pacte | § 9 | chacun met en commun sa personne sous la suprême direction de la volonté générale |
    | les concepts du droit politique | § 10 | République, État, Souverain, Puissance ; peuple, citoyens, sujets |

    ! L'aliénation totale n'est pas l'aliénation refusée au chapitre 4 : elle se fait à une communauté dont on est membre, et non à un maître.
  tables:
  - table: moment-lieu-ce-qui-s-y-joue
    exercises:
    - {kind: order, column: Lieu}
    - {kind: cell, column: Lieu}
  points:
  - id: rousseau-contrat-social-livre1-l7-q1
    sentence: "« Trouver une forme d'association qui défende et protège de toute la force commune la personne et les biens de chaque associé, et par laquelle **chacun s'unissant à tous** __n'obéisse pourtant qu'à__ ___ et reste aussi libre qu'auparavant ? » (I, 6, § 4)"
    answer: "lui-même"
  - id: rousseau-contrat-social-livre1-l7-q2
    sentence: "« **Les clauses de ce contrat** __sont tellement déterminées par la__ ___ __de l'acte__, que la moindre modification les rendrait vaines et de nul effet » (I, 6, § 5)."
    answer: "nature"
  - id: rousseau-contrat-social-livre1-l7-q3
    sentence: "« Ces clauses bien entendues se réduisent toutes à une seule, savoir **l'aliénation** ___ __de chaque associé avec tous ses droits à toute la communauté__ » (I, 6, § 6)."
    answer: "totale"
  - id: rousseau-contrat-social-livre1-l7-q4
    sentence: "« Enfin **chacun se donnant à tous** __ne se donne à__ ___ » (I, 6, § 8)."
    answer: "personne"
  - id: rousseau-contrat-social-livre1-l7-q5
    sentence: "« Chacun de nous met en commun sa personne et toute sa puissance __sous la suprême direction de la__ ___ ; et nous recevons en corps chaque membre comme partie indivisible du tout. » (I, 6, § 9)"
    answer: "volonté générale"
  - id: rousseau-contrat-social-livre1-l7-q6
    sentence: "Le **corps politique** « est appelé par ses membres État quand il est passif, ___ __quand il est actif__, Puissance en le comparant à ses semblables » (I, 6, § 10)."
    answer: "Souverain"
  - id: rousseau-contrat-social-livre1-l7-q7
    sentence: "Les **associés** « s'appellent en particulier Citoyens comme participants à l'autorité souveraine, et ___ __comme soumis aux lois de l'État__ » (I, 6, § 10)."
    answer: "Sujets"
- id: rousseau-contrat-social-livre1-l8
  title: "Repérage : le souverain (I, 7)"
  notes: |-
    **Le chapitre 7 considère le souverain sous l'angle de l'obligation : à quoi est-il obligé, en quoi oblige-t-il ?** La théorie de la souveraineté elle-même sera développée en II, 1-6.

    | Moment | Lieu | Ce qui s'y joue |
    | un engagement réciproque | § 1 | chacun est engagé comme membre du Souverain envers les particuliers, et comme membre de l'État envers le Souverain |
    | un souverain sans loi fondamentale | § 2 | nulle loi fondamentale obligatoire pour le corps du peuple, pas même le contrat social |
    | la sainteté du contrat | § 3-4 | ni s'aliéner ni se soumettre ; on ne peut offenser un membre sans attaquer le corps |
    | un souverain sans garant | § 5 | il ne peut avoir d'intérêt contraire à celui des particuliers qui le composent |
    | les obligations des sujets | § 6-8 | quiconque refusera d'obéir à la volonté générale y sera contraint : on le forcera d'être libre |

    ! « On le forcera d'être libre » vise le sujet, non le citoyen : le contraindre à obéir aux lois, c'est lui faire respecter la volonté qu'il a eue comme citoyen.
