  points:
  - id: rousseau-contrat-social-livre1-l2-q1
    sentence: "« Je veux chercher si dans l'ordre civil il peut y avoir quelque **règle d'administration** __légitime et__ ___, en prenant les hommes tels qu'ils sont, et les lois telles qu'elles peuvent être » (I, préambule, § 1)."
    answer: "sûre"
  - id: rousseau-contrat-social-livre1-l2-q2
    sentence: "« Je tâcherai d'allier toujours dans cette recherche ce que **le droit permet** __avec ce que l'intérêt__ ___, afin que la justice et l'utilité ne se trouvent point divisées » (I, préambule, § 1)."
    answer: "prescrit"
  - id: rousseau-contrat-social-livre1-l2-q3
    sentence: "« Né citoyen d'un État libre, et **membre du souverain**, quelque faible influence que puisse avoir ma voix dans les affaires publiques, le droit d'y voter __suffit pour m'imposer le__ ___ de m'en instruire » (I, préambule, § 3)."
    answer: "devoir"
  - id: rousseau-contrat-social-livre1-l2-q4
    sentence: "« L'homme est né libre, __et partout il est dans les__ ___. » (I, 1, § 1)"
    answer: "fers"
  - id: rousseau-contrat-social-livre1-l2-q5
    sentence: "« Comment ce changement s'est-il fait ? Je l'ignore. **Qu'est-ce qui peut le rendre** ___ ? Je crois pouvoir résoudre cette question. » (I, 1, § 1)"
    answer: "légitime"
  - id: rousseau-contrat-social-livre1-l2-q6
    sentence: "« Mais **l'ordre social est un droit sacré**, qui sert de base à tous les autres. Cependant ce droit ne vient point de la nature ; __il est donc fondé sur des__ ___. » (I, 1, § 2)"
    answer: "conventions"
- id: rousseau-contrat-social-livre1-l3
  title: "Repérage : les premières sociétés (I, 2)"
  notes: |-
    **Le chapitre 2 éprouve l'hypothèse d'une soumission fondée en nature, sous trois formes, dans un ordre de crédibilité décroissant.** Chaque réfutation y est l'occasion de poser une thèse du droit politique : le lien social est conventionnel, et la conservation de soi est la « première loi » de l'homme.

    | Hypothèse | Lieu | Ce qui s'y joue |
    | la famille, modèle de la société politique | § 1-3 | le lien naturel ne dure qu'autant que le besoin ; s'il continue, c'est par convention |
    | des hommes nés pour l'esclavage | § 4-8 | Grotius, Hobbes, Caligula, Aristote ; mais la force a fait les premiers esclaves, leur lâcheté les a perpétués |
    | l'autorité héritée d'Adam | § 9 | réfutée par la seule ironie : Adam fut souverain du monde comme Robinson de son île |

    ! Rousseau accorde le fait (« Aristote avait raison ») pour mieux en contester la cause : la servitude n'est pas naturelle, elle est produite.
