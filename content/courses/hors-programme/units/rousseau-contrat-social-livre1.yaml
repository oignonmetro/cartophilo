    answer: "libre"
- id: rousseau-contrat-social-livre1-l9
  title: "Repérage : l'état civil (I, 8)"
  notes: |-
    **Le chapitre 8 évalue le changement que produit dans l'homme le passage à l'état civil : élévation ou dégradation.** L'ambivalence tient à ce que l'état civil est double : l'état civil légitime, que le livre fonde, et l'état civil corrompu, où l'homme est « dans les fers ».

    | Moment | Lieu | Ce qui s'y joue |
    | le changement de l'homme | § 1 | la justice substituée à l'instinct ; d'un animal stupide et borné, un être intelligent et un homme |
    | la balance | § 2 | perdus, la liberté naturelle et un droit illimité ; gagnés, la liberté civile et la propriété |
    | la liberté morale | § 3 | l'obéissance à la loi qu'on s'est prescrite est liberté |

    ! La liberté naturelle n'a pour bornes que les forces de l'individu ; la liberté civile est limitée par la volonté générale : ce ne sont pas deux degrés d'une même liberté.
