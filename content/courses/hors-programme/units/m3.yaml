id: m3
title: Les formules de l'humanité, de l'autonomie et du règne des fins
subtitle: Trois nouvelles formulations de l'impératif catégorique
icon: bulb
color: yellow
group: "Kant : la morale"

lessons:
  - id: m3-l1
    title: La formule de l'humanité et son premier malentendu
    notes: |
      La {violet}**formule de l'humanité**{/violet} énonce qu'on ne doit jamais agir de telle
      sorte qu'on traite l'humanité, en soi-même ou en autrui,
      {red}__simplement comme un moyen__{/red}, {green}mais toujours en même{/green}
      {green}temps comme une{/green} {violet}__fin en soi__{/violet}. C'est elle, plus que la
      formule de la loi universelle, qui rapproche l'impératif catégorique de
      l'intuition, en y introduisant l'idée de {violet}**respect**{/violet} pour ce qui est
      essentiel à notre humanité.

      Cette formule invite pourtant à un malentendu qu'il faut lever aussitôt :
      elle __n'interdit pas__ d'utiliser autrui comme un moyen pour ses propres
      fins : {coral}une exigence aussi absolue serait absurde, tant nous en usons{/coral}
      {coral}constamment de façon moralement légitime{/coral}. Ce qu'elle interdit, c'est de
      traiter l'humanité comme {red}un **simple** moyen{/red}.

      - Kant illustre la différence par {yellow}l'exemple du cheval et du chauffeur de{/yellow}
        {yellow}taxi{/yellow} : rien n'interdit d'utiliser l'un comme l'autre comme moyen de
        transport, mais l'humanité du chauffeur doit __en même temps__ être
        traitée comme une {teal}fin en soi{/teal}, à la différence du cheval.
      - On use légitimement des capacités rationnelles d'autrui comme moyen
        {green}seulement si l'on agit d'une manière à laquelle il pourrait{/green}
        {green}**consentir** en exerçant lui-même ces capacités{/green} : {yellow}en payant, par{/yellow}
        {yellow}exemple, le prix convenu pour une course{/yellow}.
    points:
      - id: m3-l1-p1
        sentence: La formule de l'humanité énonce qu'on ne doit jamais agir de telle sorte qu'on traite l'humanité, en soi-même ou en autrui, **simplement comme un moyen**, mais __toujours en même temps comme une__ ___.
        answer: fin en soi
      - id: m3-l1-p2
        sentence: Plus que la formule de la loi universelle, c'est la formule de l'humanité qui **rapproche l'impératif catégorique de l'intuition**, __en y introduisant l'idée de__ ___ pour ce qui est essentiel à notre humanité.
        answer: respect
      - id: m3-l1-p3
        sentence: La formule de l'humanité **n'interdit pas d'utiliser autrui comme un moyen pour ses propres fins** ; __ce qu'elle interdit, c'est de le traiter comme un__ ___ moyen.
        answer: simple
      - id: m3-l1-p4
        sentence: "Kant illustre la différence entre user d'autrui comme moyen et le traiter comme un simple moyen par **l'exemple du cheval et du chauffeur de taxi** : __à la différence du cheval, l'humanité du chauffeur doit en même temps être traitée comme__ ___."
        answer: une fin en soi
      - id: m3-l1-p5
        sentence: On use légitimement des **capacités rationnelles d'autrui comme moyen** __seulement si l'on agit d'une manière à laquelle il pourrait, en exerçant lui-même ces capacités,__ ___.
        answer: consentir
      - id: m3-l1-p6
        sentence: "__Rappelons la formule de l'humanité dans son intégralité__ : « **On ne doit** ___ agir de telle sorte qu'on traite l'humanité, en soi-même ou en autrui, simplement comme un moyen, mais toujours en même temps comme une fin en soi. »"
        answer: jamais
      - id: m3-l1-p7
        sentence: "__Selon la formule de l'humanité__ : « On ne doit jamais agir de telle sorte qu'on traite l'humanité, en soi-même ou en autrui, ___ **comme un moyen**, mais toujours en même temps comme une fin en soi. »"
        answer: simplement
      - id: m3-l1-p8
        sentence: "__Selon la formule de l'humanité__ : « On ne doit jamais agir de telle sorte qu'on traite l'humanité, en soi-même ou en autrui, simplement comme un moyen, mais toujours ___ **comme une fin en soi**. »"
        answer: en même temps

  - id: m3-l2
    title: Les trois sens de la fin et l'humanité comme fin objective
    notes: |
      Pour préciser en quel sens l'humanité doit être traitée comme une fin,
      Kant distingue {violet}**trois sens**{/violet} du mot « fin », deux {violet}positifs{/violet}
      et un {violet}négatif{/violet}.

      - Une fin au premier sens {violet}**positif**{/violet} est ce qu'on se
        propose de **produire** ou de faire advenir dans le monde {yellow}(perdre du{/yellow}
        {yellow}poids, par exemple){/yellow} : {coral}une fois adoptée, elle commande d'agir de façon{/coral}
        {coral}à la réaliser ou à y renoncer{/coral}.
      - Une fin au sens {violet}**négatif**{/violet}, comme la conservation de
        soi selon l'exemple de {sky}Korsgaard{/sky}, ne se produit pas mais __limite__
        ce qu'on peut faire en vue d'autres fins : on ne cherche pas à se
        conserver, on s'abstient plutôt de tout ce qui y ferait obstacle.
      - Une fin au second sens {sky}**positif**{/sky} est quelque chose qu'on
        ne produit pas mais qu'on __réalise ou cultive__ par son action,
        {yellow}comme devenir pianiste{/yellow} : agir en pianiste, ce n'est pas produire
        quelque chose de distinct de soi, mais constituer l'activité même
        d'être pianiste.

      L'humanité est d'abord une fin au sens {violet}__négatif__{/violet} :
      {green}elle limite ce que je peux faire pour poursuivre mes autres fins, tout{/green}
      {green}comme ma propre conservation{/green}. {coral}Parce qu'elle est un objet que __toute__{/coral}
      {coral}volonté rationnelle doit avoir{/coral}, elle est, à la différence de la plupart
      de mes fins, une fin {violet}**objective**{/violet} : ce qui en fait la source de
      devoirs __parfaits__. L'humanité est aussi une fin au second sens
      {sky}**positif**{/sky} : en moi, elle doit être {violet}**cultivée**{/violet} ou
      pleinement actualisée, d'où un devoir de développer ses {violet}**talents**{/violet} ;
      en autrui, je dois contribuer aux fins qu'elle poursuit, d'où certains
      devoirs __imparfaits__.
    points:
      - id: m3-l2-p1
        sentence: "**Une fin au premier sens positif** est ce qu'on se propose de produire ou de faire advenir dans le monde ; __une fois adoptée, elle commande d'agir de façon à la réaliser ou à__ ___."
        answer: y renoncer
      - id: m3-l2-p2
        sentence: "**Une fin au sens négatif**, comme la conservation de soi, __ne se produit pas mais__ ___ ce qu'on peut faire en vue d'autres fins."
        answer: limite
      - id: m3-l2-p3
        sentence: Korsgaard illustre l'idée d'une **fin au sens négatif**, qui limite l'action sans jamais être produite par elle, __par l'exemple de la__ ___.
        answer: conservation de soi
      - id: m3-l2-p4
        sentence: "**Une fin au second sens positif**, comme devenir pianiste, __est quelque chose qu'on ne produit pas mais qu'on__ ___ par son action."
        answer: réalise ou cultive
      - id: m3-l2-p5
        sentence: "**L'humanité est d'abord**, pour Kant, une fin au sens ___, __en ce qu'elle limite ce que je peux faire pour poursuivre mes autres fins__."
        answer: négatif
      - id: m3-l2-p6
        sentence: Parce qu'elle est **un objet que toute volonté rationnelle doit avoir**, l'humanité est, __à la différence de la plupart de mes fins, une fin__ ___, source de devoirs parfaits.
        answer: objective
      - id: m3-l2-p7
        sentence: En tant que fin au second sens positif, **l'humanité en moi doit être cultivée ou pleinement actualisée**, __ce qui fonde le devoir de développer ses__ ___.
        answer: talents

  - id: m3-l3
    title: Le respect dû à l'humanité
    notes: |
      La formule de l'humanité exige, envers les personnes, un {violet}**respect**{/violet}
      qu'il faut se garder de mal comprendre. {sky}Stephen Darwall{/sky} distingue
      {amber}**deux sortes**{/amber} de respect envers les personnes.

      - Le {violet}**respect d'estime**{/violet} consiste à apprécier positivement quelqu'un
        au regard d'un accomplissement ou d'une vertu qu'il possède
        relativement à une norme de réussite : {yellow}je peux respecter quelqu'un{/yellow}
        {yellow}comme rebondeur mais non comme marqueur, comme chercheur mais non{/yellow}
        {yellow}comme enseignant{/yellow}. {coral}Ce respect **varie** de personne à personne et{/coral}
        {coral}admet des degrés{/coral}.
      - Le {violet}**respect de reconnaissance**{/violet} consiste au
        contraire à accorder l'égard requis par un simple fait relatif à la
        personne {yellow}(qu'elle soit étudiante, doyenne, médecin ou mère){/yellow} sans
        qu'aucune mesure de degré n'intervienne.

      Le respect qu'exige la formule de l'humanité est de
      {green}ce second type{/green} : on doit respecter les êtres humains
      {green}__simplement parce qu'ils sont des personnes__{/green}, {red}non parce qu'ils{/red}
      {red}répondraient à telle ou telle norme d'évaluation{/red}. Il s'ensuit, pour
      Kant, que les personnes ne peuvent {green}__jamais perdre leur humanité__{/green} par
      leurs méfaits : même les plus vicieuses méritent un {violet}**respect{/violet}
      {violet}fondamental**{/violet} en tant que personnes.
    points:
      - id: m3-l3-p1
        sentence: __Le respect qui consiste à **apprécier positivement quelqu'un** au regard d'un accomplissement ou d'une vertu qu'il possède relativement à une norme de réussite, et qui admet des degrés, est nommé par Darwall respect__ ___.
        answer: d'estime
      - id: m3-l3-p2
        sentence: Le respect qui consiste à **accorder l'égard requis par un simple fait relatif à la personne**, __sans qu'aucune mesure de degré n'intervienne, est nommé par Darwall respect de__ ___.
        answer: reconnaissance
      - id: m3-l3-p3
        sentence: "Le respect qu'exige la formule de l'humanité est un **respect de reconnaissance** : __on doit respecter les êtres humains simplement parce qu'ils sont des__ ___, non parce qu'ils répondraient à telle ou telle norme d'évaluation."
        answer: personnes
      - id: m3-l3-p4
        sentence: Parce que le respect dû à l'humanité est un respect de reconnaissance et non d'estime, **même les personnes les plus vicieuses méritent, selon Kant, un respect fondamental** ; __elles ne peuvent en effet jamais__ ___ par leurs méfaits.
        answer: perdre leur humanité

  - id: m3-l4
    title: La formule de l'autonomie
    notes: |
      La troisième formulation de l'impératif catégorique définit la volonté
      de tout être rationnel comme une volonté qui {violet}**légifère une loi{/violet}
      {violet}universelle**{/violet}. On peut la mettre sous forme d'impératif : agis de telle
      sorte que, par tes maximes, tu puisses être
      {violet}__législateur__{/violet} de lois universelles.

      Cette formule ressemble à la première, mais en déplace l'accent : on n'y
      considère plus notre statut de simples {violet}**sujets**{/violet} soumis à des lois
      universelles, mais notre statut de {violet}__législateurs__{/violet} de
      ces lois : {coral}statut qui est précisément la source de la{/coral} {violet}**dignité**{/violet} de
      l'humanité évoquée dans la deuxième formule. {red}Une volonté seulement{/red}
      {red}soumise à des lois universelles pourrait encore agir par des motifs{/red}
      {red}contingents et non moraux, comme l'intérêt personnel{/red} ; pour légiférer,
      en revanche, {green}de tels motifs contingents doivent être **écartés**{/green}.

      Comme la formule de l'humanité, cette nouvelle formulation ne change pas
      le contenu de la loi morale, mais la rapproche, selon l'expression de
      Kant, __plus près du sentiment__.
    points:
      - id: m3-l4-p1
        sentence: "**La troisième formulation de l'impératif catégorique** __définit la volonté de tout être rationnel comme une volonté qui légifère une loi__ ___."
        answer: universelle
        explanation: "G 4:432."
      - id: m3-l4-p2
        sentence: "**La formule de l'autonomie déplace l'accent** de la formule de la loi universelle, de notre statut de sujets soumis à des lois universelles __vers notre statut de__ ___ de ces lois."
        answer: législateurs
      - id: m3-l4-p3
        sentence: "**Le statut de législateur de lois universelles** que met en avant la formule de l'autonomie __est, selon Kant, la source même de la__ ___ de l'humanité évoquée par la formule de l'humanité."
        answer: dignité
      - id: m3-l4-p4
        sentence: Une volonté seulement soumise à des lois universelles pourrait encore agir par des **motifs contingents et non moraux** comme l'intérêt personnel ; __pour légiférer véritablement, de tels motifs doivent au contraire être__ ___.
        answer: écartés
      - id: m3-l4-p5
        sentence: Comme la formule de l'humanité avant elle, la formule de l'autonomie **ne change rien au contenu de la loi morale**, mais __la rapproche, selon l'expression de Kant, plus près__ ___.
        answer: du sentiment

  - id: m3-l5
    title: La formule du règne des fins
    notes: |
      Kant relie l'idée d'une volonté qui légifère une loi universelle à
      celle d'une {violet}**union systématique d'êtres rationnels différents sous des{/violet}
      {violet}lois communes**{/violet}, qu'il nomme un {violet}**règne des fins**{/violet}.
      Cette formulation, devenue plus populaire chez les kantiens récents {coral}en{/coral}
      {coral}raison de la dimension **sociale** qu'elle introduit dans la morale{/coral}
      {coral}kantienne{/coral}, exige d'agir selon les maximes d'un membre légiférant des
      lois universelles pour un règne des fins seulement
      {amber}__possible__{/amber}.

      Elle réunit {amber}**trois exigences**{/amber}.
      - {amber}Conformer ses actions aux lois d'une **législature morale idéale**{/amber}.
      - Cette législature pose des lois universelles, qui lient __toutes__
        les volontés rationnelles, y compris la mienne.
      - Ces lois sont celles d'un règne seulement {amber}possible{/amber}, dont
        chaque membre possède également le statut de **législateur**, et
        doit donc être traité toujours comme une __fin en soi__.

      L'idée directrice est qu'{green}on doit agir seulement sur des principes{/green}
      {green}susceptibles de recevoir l'accord d'une **communauté d'agents{/green}
      {green}pleinement rationnels**{/green}, ayant chacun une part égale dans la
      législation de ces principes pour leur communauté.
    points:
      - id: m3-l5-p1
        sentence: __Kant nomme__ ___ des fins l'**union systématique d'êtres rationnels différents sous des lois communes** qu'il rattache à l'idée d'une volonté législatrice universelle.
        answer: règne
        explanation: "G 4:433."
      - id: m3-l5-p2
        sentence: "**La formule du règne des fins** __exige d'agir selon les maximes d'un membre légiférant des lois universelles pour un règne des fins seulement__ ___."
        answer: possible
        explanation: "G 4:439."
      - id: m3-l5-p3
        sentence: __**La première exigence** contenue dans la formule du règne des fins est de conformer ses actions aux lois d'une législature morale__ ___.
        answer: idéale
      - id: m3-l5-p4
        sentence: "**La deuxième des trois exigences** de la formule du règne des fins est que la législature morale idéale à laquelle on doit conformer ses actions __pose des lois universelles, qui lient toutes les volontés rationnelles, y compris__ ___."
        answer: la mienne
      - id: m3-l5-p5
        sentence: "**La troisième des trois exigences** de la formule du règne des fins est que les lois universelles posées par cette législature morale idéale soient celles d'un règne seulement possible, dont chaque membre, possédant également le statut de législateur, __doit être traité toujours comme__ ___."
        answer: une fin en soi
      - id: m3-l5-p6
        sentence: "**La formule du règne des fins** __a gagné en faveur parmi les kantiens récents en raison de la dimension__ ___ qu'elle introduit dans la morale kantienne."
        answer: sociale
