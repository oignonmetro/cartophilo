id: m3
title: Les formules de l'humanité, de l'autonomie et du règne des fins
subtitle: Trois nouvelles formulations de l'impératif catégorique
icon: bulb
color: yellow

lessons:
  - id: m3-l1
    title: La formule de l'humanité et son premier malentendu
    notes: |
      La **formule de l'humanité** énonce qu'on ne doit jamais agir de telle
      sorte qu'on traite l'humanité, en soi-même ou en autrui, __simplement
      comme un moyen__, mais toujours en même temps comme une __fin en soi__.
      C'est elle, plus que la formule de la loi universelle, qui rapproche
      l'impératif catégorique de l'intuition, en y introduisant l'idée de
      respect pour ce qui est essentiel à notre humanité.

      Cette formule invite pourtant à un malentendu qu'il faut lever aussitôt :
      elle __n'interdit pas__ d'utiliser autrui comme un moyen pour ses propres
      fins — une exigence aussi absolue serait absurde, tant nous en usons
      constamment de façon moralement légitime. Ce qu'elle interdit, c'est de
      traiter l'humanité comme un **simple** moyen.

      - Kant illustre la différence par l'exemple du cheval et du chauffeur de
        taxi : rien n'interdit d'utiliser l'un comme l'autre comme moyen de
        transport, mais l'humanité du chauffeur doit __en même temps__ être
        traitée comme une fin en soi, à la différence du cheval.
      - On use légitimement des capacités rationnelles d'autrui comme moyen
        seulement si l'on agit d'une manière à laquelle il pourrait consentir
        en exerçant lui-même ces capacités — en payant, par exemple, le prix
        convenu pour une course.
    points:
      - id: m3-l1-p1
        sentence: La formule de l'humanité énonce qu'on ne doit jamais agir de telle sorte qu'on traite l'humanité, en soi-même ou en autrui, simplement comme un moyen, mais toujours en même temps comme une ___.
        answer: fin en soi
        explanation: "G 4:429."
      - id: m3-l1-p2
        sentence: Plus que la formule de la loi universelle, c'est la formule de l'humanité qui rapproche l'impératif catégorique de l'intuition, en y introduisant l'idée de ___ pour ce qui est essentiel à notre humanité.
        answer: respect
      - id: m3-l1-p3
        sentence: La formule de l'humanité n'interdit pas d'utiliser autrui comme un moyen pour ses propres fins ; ce qu'elle interdit, c'est de le traiter comme un ___ moyen.
        answer: simple
      - id: m3-l1-p4
        sentence: "Kant illustre la différence entre user d'autrui comme moyen et le traiter comme un simple moyen par l'exemple du cheval et du chauffeur de taxi : à la différence du cheval, l'humanité du chauffeur doit en même temps être traitée comme ___."
        answer: une fin en soi
      - id: m3-l1-p5
        sentence: On use légitimement des capacités rationnelles d'autrui comme moyen seulement si l'on agit d'une manière à laquelle il pourrait, en exerçant lui-même ces capacités, ___.
        answer: consentir

  - id: m3-l2
    title: Les trois sens de la fin et l'humanité comme fin objective
    notes: |
      Pour préciser en quel sens l'humanité doit être traitée comme une fin,
      Kant distingue trois sens du mot « fin », deux positifs et un négatif.

      - Une fin au premier sens **positif** est ce qu'on se propose de
        produire ou de faire advenir dans le monde (perdre du poids, par
        exemple) : une fois adoptée, elle commande d'agir de façon à la
        réaliser ou à y renoncer.
      - Une fin au sens **négatif**, comme la conservation de soi selon
        l'exemple de Korsgaard, ne se produit pas mais __limite__ ce qu'on
        peut faire en vue d'autres fins : on ne cherche pas à se conserver,
        on s'abstient plutôt de tout ce qui y ferait obstacle.
      - Une fin au second sens **positif** est quelque chose qu'on ne produit
        pas mais qu'on __réalise ou cultive__ par son action, comme devenir
        pianiste : agir en pianiste, ce n'est pas produire quelque chose de
        distinct de soi, mais constituer l'activité même d'être pianiste.

      L'humanité est d'abord une fin au sens __négatif__ : elle limite ce que
      je peux faire pour poursuivre mes autres fins, tout comme ma propre
      conservation. Parce qu'elle est un objet que __toute__ volonté
      rationnelle doit avoir, elle est, à la différence de la plupart de mes
      fins, une fin __objective__ — ce qui en fait la source de devoirs
      __parfaits__. L'humanité est aussi une fin au second sens positif : en
      moi, elle doit être cultivée ou pleinement actualisée, d'où un devoir de
      développer ses talents ; en autrui, je dois contribuer aux fins qu'elle
      poursuit, d'où certains devoirs __imparfaits__.
    points:
      - id: m3-l2-p1
        sentence: Une fin au premier sens positif est ce qu'on se propose de produire ou de faire advenir dans le monde ; une fois adoptée, elle commande d'agir de façon à la réaliser ou à ___.
        answer: y renoncer
      - id: m3-l2-p2
        sentence: Une fin au sens négatif, comme la conservation de soi, ne se produit pas mais ___ ce qu'on peut faire en vue d'autres fins.
        answer: limite
      - id: m3-l2-p3
        sentence: L'exemple de la conservation de soi comme fin au sens négatif est proposé par la commentatrice ___.
        answer: Korsgaard
      - id: m3-l2-p4
        sentence: Une fin au second sens positif, comme devenir pianiste, est quelque chose qu'on ne produit pas mais qu'on ___ par son action.
        answer: réalise ou cultive
      - id: m3-l2-p5
        sentence: L'humanité est d'abord, pour Kant, une fin au sens ___, en ce qu'elle limite ce que je peux faire pour poursuivre mes autres fins.
        answer: négatif
      - id: m3-l2-p6
        sentence: Parce qu'elle est un objet que toute volonté rationnelle doit avoir, l'humanité est, à la différence de la plupart de mes fins, une fin ___, source de devoirs parfaits.
        answer: objective
      - id: m3-l2-p7
        sentence: En tant que fin au second sens positif, l'humanité en moi doit être cultivée ou pleinement actualisée, ce qui fonde le devoir de développer ses ___.
        answer: talents

  - id: m3-l3
    title: Le respect dû à l'humanité
    notes: |
      La formule de l'humanité exige, envers les personnes, un **respect**
      qu'il faut se garder de mal comprendre. Stephen Darwall distingue deux
      sortes de respect envers les personnes.

      - Le **respect d'estime** (*appraisal respect*) consiste à apprécier
        positivement quelqu'un au regard d'un accomplissement ou d'une vertu
        qu'il possède relativement à une norme de réussite : je peux respecter
        quelqu'un comme rebondeur mais non comme marqueur, comme chercheur
        mais non comme enseignant. Ce respect varie de personne à personne et
        admet des degrés.
      - Le **respect de reconnaissance** (*recognition respect*) consiste au
        contraire à accorder l'égard requis par un simple fait relatif à la
        personne — qu'elle soit étudiante, doyenne, médecin ou mère — sans
        qu'aucune mesure de degré n'intervienne.

      Le respect qu'exige la formule de l'humanité est de ce second type : on
      doit respecter les êtres humains __simplement parce qu'ils sont des
      personnes__, non parce qu'ils répondraient à telle ou telle norme
      d'évaluation. Il s'ensuit, pour Kant, que les personnes ne peuvent
      __jamais perdre leur humanité__ par leurs méfaits : même les plus
      vicieuses méritent un respect fondamental en tant que personnes.
    points:
      - id: m3-l3-p1
        sentence: Le respect qui consiste à apprécier positivement quelqu'un au regard d'un accomplissement ou d'une vertu qu'il possède relativement à une norme de réussite, et qui admet des degrés, est nommé par Darwall respect ___.
        answer: d'estime
      - id: m3-l3-p2
        sentence: Le respect qui consiste à accorder l'égard requis par un simple fait relatif à la personne, sans qu'aucune mesure de degré n'intervienne, est nommé par Darwall respect de ___.
        answer: reconnaissance
      - id: m3-l3-p3
        sentence: La distinction entre respect d'estime et respect de reconnaissance, mobilisée pour préciser le sens du respect exigé par la formule de l'humanité, est due au commentateur ___.
        answer: Darwall
      - id: m3-l3-p4
        sentence: "Le respect qu'exige la formule de l'humanité est un respect de reconnaissance : on doit respecter les êtres humains simplement parce qu'ils sont des ___, non parce qu'ils répondraient à telle ou telle norme d'évaluation."
        answer: personnes
      - id: m3-l3-p5
        sentence: Parce que le respect dû à l'humanité est un respect de reconnaissance et non d'estime, même les personnes les plus vicieuses méritent, selon Kant, un respect fondamental ; elles ne peuvent en effet jamais ___ par leurs méfaits.
        answer: perdre leur humanité

  - id: m3-l4
    title: La formule de l'autonomie
    notes: |
      La troisième formulation de l'impératif catégorique définit la volonté
      de tout être rationnel comme une volonté qui **légifère une loi
      universelle**. On peut la mettre sous forme d'impératif : agis de telle
      sorte que, par tes maximes, tu puisses être __législateur__ de lois
      universelles.

      Cette formule ressemble à la première, mais en déplace l'accent : on n'y
      considère plus notre statut de simples __sujets__ soumis à des lois
      universelles, mais notre statut de __législateurs__ de ces lois — statut
      qui est précisément la source de la dignité de l'humanité évoquée dans
      la deuxième formule. Une volonté seulement soumise à des lois
      universelles pourrait encore agir par des motifs contingents et non
      moraux, comme l'intérêt personnel ; pour légiférer, en revanche, de tels
      motifs contingents doivent être écartés.

      Comme la formule de l'humanité, cette nouvelle formulation ne change pas
      le contenu de la loi morale, mais la rapproche, selon l'expression de
      Kant, __plus près du sentiment__.
    points:
      - id: m3-l4-p1
        sentence: La troisième formulation de l'impératif catégorique définit la volonté de tout être rationnel comme une volonté qui légifère une loi ___.
        answer: universelle
        explanation: "G 4:432."
      - id: m3-l4-p2
        sentence: La formule de l'autonomie déplace l'accent de la première formule, de notre statut de sujets soumis à des lois universelles vers notre statut de ___ de ces lois.
        answer: législateurs
      - id: m3-l4-p3
        sentence: Le statut de législateur de lois universelles que met en avant la formule de l'autonomie est, selon Kant, la source même de la ___ de l'humanité évoquée par la formule de l'humanité.
        answer: dignité
      - id: m3-l4-p4
        sentence: Une volonté seulement soumise à des lois universelles pourrait encore agir par des motifs contingents et non moraux comme l'intérêt personnel ; pour légiférer véritablement, de tels motifs doivent au contraire être ___.
        answer: écartés
      - id: m3-l4-p5
        sentence: Comme la formule de l'humanité avant elle, la formule de l'autonomie ne change rien au contenu de la loi morale, mais la rapproche, selon l'expression de Kant, plus près ___.
        answer: du sentiment

  - id: m3-l5
    title: La formule du règne des fins
    notes: |
      Kant relie l'idée d'une volonté qui légifère une loi universelle à
      celle d'une **union systématique d'êtres rationnels différents sous des
      lois communes**, qu'il nomme un **règne des fins** (*Kingdom of Ends*).
      Cette formulation, devenue plus populaire chez les kantiens récents en
      raison de la dimension sociale qu'elle introduit dans la morale
      kantienne, exige d'agir selon les maximes d'un membre légiférant des
      lois universelles pour un règne des fins seulement __possible__.

      Elle réunit trois exigences.
      - Conformer ses actions aux lois d'une **législature morale idéale**.
      - Cette législature pose des lois universelles, qui lient __toutes__
        les volontés rationnelles, y compris la mienne.
      - Ces lois sont celles d'un règne seulement possible, dont chaque
        membre possède également le statut de législateur, et doit donc être
        traité toujours comme une __fin en soi__.

      L'idée directrice est qu'on doit agir seulement sur des principes
      susceptibles de recevoir l'accord d'une communauté d'agents pleinement
      rationnels, ayant chacun une part égale dans la législation de ces
      principes pour leur communauté.
    points:
      - id: m3-l5-p1
        sentence: Kant nomme ___ des fins l'union systématique d'êtres rationnels différents sous des lois communes qu'il rattache à l'idée d'une volonté législatrice universelle.
        answer: règne
        explanation: "G 4:433."
      - id: m3-l5-p2
        sentence: La formule du règne des fins exige d'agir selon les maximes d'un membre légiférant des lois universelles pour un règne des fins seulement ___.
        answer: possible
        explanation: "G 4:439."
      - id: m3-l5-p3
        sentence: La première exigence contenue dans la formule du règne des fins est de conformer ses actions aux lois d'une législature morale ___.
        answer: idéale
      - id: m3-l5-p4
        sentence: La deuxième exigence est que cette législature idéale pose des lois universelles, qui lient toutes les volontés rationnelles, y compris ___.
        answer: la mienne
      - id: m3-l5-p5
        sentence: La troisième exigence est que ces lois soient celles d'un règne seulement possible, dont chaque membre, possédant également le statut de législateur, doit être traité toujours comme ___.
        answer: une fin en soi
      - id: m3-l5-p6
        sentence: La formule du règne des fins a gagné en faveur parmi les kantiens récents en raison de la dimension ___ qu'elle introduit dans la morale kantienne.
        answer: sociale
