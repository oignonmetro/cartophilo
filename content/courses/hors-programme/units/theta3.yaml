  - id: theta3-l1
    title: "Θ10 : la vérité des composés"
    notes: |-
      **Pour les composés, le vrai et le faux tiennent à la composition et à la division appliquées aux choses : dit vrai celui qui pense divisé ce qui est divisé et composé ce qui est composé (1051a34-1051b3).** La cause de la vérité est dans les choses, non dans la pensée : « tu n'es pas blanc parce que nous pensons vraiment que tu es blanc, mais, nous qui affirmons cela, nous disons vrai parce que tu es blanc » (1051b6-9).

      **La conception « standard » de la vérité (Makin)** : la vérité est la correspondance d'un porteur de vérité avec le monde, la fausseté son défaut de correspondance (Γ7, 1011b25-28 : dire de ce qui est qu'il est, ou de ce qui n'est pas qu'il n'est pas). Les porteurs de vérité sont les affirmations et les négations, non les noms ou les verbes isolés, ni une prière (*De l'interprétation*, 1, 4, 5, 6). Côté monde, Aristote parle de « choses » composées ou divisées : un individu uni à une propriété (Théétète assis), ou des propriétés unies entre elles (le cheval est domestique, non jaune). Aristote donne lui-même pour exemples de composés le bois blanc et la diagonale incommensurable (1051b20-21). Selon E4 (1027b20-24), une affirmation est vraie si les éléments correspondants sont composés, une négation s'ils sont divisés. Vérité et fausseté sont dans la pensée ou le discours (E4 ; Θ10, 1051b3-5), position préférable à celle de Δ29, qui attribue la fausseté aux choses.

      | Les choses (1051b9-17) | La même opinion |
      | tantôt composées, tantôt divisées, comme un homme assis | devient vraie puis fausse |
      | toujours composées, impossibles à diviser | toujours vraie ou toujours fausse |
      | toujours divisées, impossibles à composer | toujours vraie ou toujours fausse |

      ! Le vrai n'est pas une propriété des choses, comme la blancheur : c'est l'accord de la pensée avec la composition ou la division réelles.
