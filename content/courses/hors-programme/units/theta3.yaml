  - id: theta3-l4
    title: "Θ10 : l'erreur sur les immobiles"
    notes: |-
      **Sur ce qui est immobile, on ne peut pas se tromper quant au temps (1052a4-11).** Qui pense que le triangle ne change pas ne croira pas qu'il a tantôt deux droits, tantôt non. L'erreur reste possible, mais d'une autre sorte : on peut croire qu'aucun nombre pair n'est premier, ou que certains le sont et d'autres non. Pour ce qui est numériquement un, même cette erreur disparaît : on pense vrai ou faux, toujours de la même façon.

      **Erreurs selon le temps et selon d'autres rapports (Makin).** Sur un état du monde changeant, on se trompe de plusieurs manières : si Marie a été mariée mais ne l'est plus, dire qu'elle est mariée est une erreur de temps ; si elle est mariée à Paul et qu'on dise à Jean, une erreur de relation. Sur un état immuable, un mauvais géomètre peut dire que les angles d'un triangle valent trois droits, mais son erreur ne porte pas sur le temps. Makin préfère la lecture la plus générale : puisque les faits qui rendent vrai un énoncé géométrique ne changent pas, aucune erreur géométrique ne peut porter sur le temps, quelle que soit la confusion de celui qui la commet. Dire qu'aucun nombre pair n'est premier est une erreur de quantité : certains nombres pairs ne sont pas premiers, mais le nombre 2 l'est.

      | Erreur | Exemple | Possible sur les immobiles ? |
      | de temps | dire Marie mariée alors qu'elle ne l'est plus | non |
      | de relation | la dire mariée à Jean, et non à Paul | oui |
      | de quantité | « aucun nombre pair n'est premier » | oui, sauf pour ce qui est numériquement un |

      ! Aristote ne déclare pas les mathématiciens infaillibles : il exclut seulement l'erreur quant au temps.
    points:
