lessons:
  - id: theta3-i1
    title: "Θ10 : un chapitre à part"
    notes: |-
      **Θ10 (1051a34-1052a11) revient au quatrième sens de l'être distingué en Δ7 et E2 : l'être comme vrai, et le non-être comme faux.** E4 l'avait annoncé. Makin juge ce chapitre « tangentiel » au corps de Θ, consacré dans ses chapitres 1 à 9 à la puissance et à l'acte.

      **Une expression étrange : le vrai et le faux « au sens le plus propre » (1051b1).** En E4 (1027b29-31), l'être comme vérité est au contraire opposé à l'être au sens propre, et c'est son statut secondaire qui explique qu'il n'occupe que deux chapitres (E4 et Θ10), alors que Z et H sont consacrés à l'être selon les catégories et Θ1-9 à la puissance et à l'acte.

      | Lecture | Ce que qualifie « au sens le plus propre » |
      | traduction française et Makin | la suite (« composition ou division appliquées aux choses ») : la manière dont on définit le vrai et le faux, non le rang de ce sens de l'être |
      | Ross | rien : il supprime l'expression |

      | Objets | Accès de la pensée | Le faux |
      | les composés | affirmation et négation | lier ce qui est séparé, séparer ce qui est lié |
      | les incomposés | contact (`thigein`) et énonciation (`phanai`) | pas de faux, seulement l'ignorance |
      | les immobiles | démonstration | pas d'erreur quant au temps |

      ! L'être comme vrai est un sens secondaire de l'être : « au sens le plus propre » ne qualifie pas son rang.
