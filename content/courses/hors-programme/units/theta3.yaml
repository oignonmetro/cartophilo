  - id: theta3-l5
    title: "Le livre Θ : cinq contresens"
    notes: |-
      **Le livre Θ part du changement physique, s'élève par l'analogie au rapport de la matière et de la forme, démontre la priorité de l'acte, et s'achève sur l'être comme vrai.**

      | Contresens | Ce que dit Aristote | Où |
      | réduire la puissance au seul mouvement | le mouvement est le cas le plus accessible, mais la puissance s'étend par analogie à la matière de la substance | Θ1, Θ6 |
      | confondre le mouvement et l'acte | le mouvement est un acte inachevé, qui cesse une fois sa fin atteinte ; l'acte a sa fin en lui-même | Θ6 |
      | ne voir de puissance que dans l'action (mégarisme) | la puissance est une capacité réelle, qui subsiste au repos | Θ3 |
      | croire que la puissance précède absolument l'acte | elle ne le précède que dans le développement de l'individu ; l'acte est antérieur en notion, en substance, et dans l'espèce | Θ8 |
      | prendre « en puissance » pour une possibilité quelconque | une chose n'est en puissance que si elle est la matière immédiate, prête à passer à l'acte sans obstacle | Θ7 |

      | Distinction | Premier terme | Second terme | Où |
      | selon le sujet | puissance active (dans l'agent) | puissance passive (dans le patient) | Θ1 |
      | selon la raison | puissance rationnelle, à deux voies | puissance non rationnelle, à une voie | Θ2, Θ5 |
      | selon la modalité | capacité (`dunamis`) | possible (`dunaton`) | Θ1, Θ3, Θ4 |
      | selon la fin | mouvement, fin extérieure | acte, fin en lui-même | Θ6 |
      | selon la vérité | composés : affirmation et négation | incomposés : contact | Θ10 |

      ! La puissance n'est ni un néant tant qu'elle ne s'exerce pas, ni une simple possibilité logique : c'est une capacité réelle, ordonnée à des conditions précises.
    points:
      - id: theta3-l5-p1
        sentence: "Le contresens qui réduit la puissance au seul mouvement physique est corrigé au chapitre ___, qui l'étend par analogie au rapport de la matière et de la substance."
        answer: "Θ6"
        alt: []
      - id: theta3-l5-p2
        sentence: "Le contresens qui ne voit de puissance que dans l'action, celui des Mégariques, est réfuté au chapitre ___."
        answer: "Θ3"
        alt: []
      - id: theta3-l5-p3
        sentence: "Le contresens qui fait précéder absolument la puissance sur l'acte est corrigé au chapitre ___, par les priorités de l'acte en notion, en temps et en substance."
        answer: "Θ8"
        alt: []
      - id: theta3-l5-p4
        sentence: "Le contresens qui prend « en puissance » pour une possibilité quelconque est corrigé au chapitre ___ : seule la matière immédiate est en puissance."
        answer: "Θ7"
        alt: []
      - id: theta3-l5-p5
        sentence: "Le contresens qui confond le mouvement et l'acte est corrigé en Θ6 : le mouvement est un acte ___, qui cesse une fois sa fin atteinte."
        answer: "inachevé"
        alt: ["incomplet", "imparfait"]
