  - id: theta3-l2
    title: "Θ10 : les incomposés, le contact et l'ignorance"
    notes: |-
      **Pour les incomposés, il n'y a rien à composer ni à diviser : le vrai est un {teal}contact{/teal} (`thigein`) et une {teal}énonciation{/teal} (`phanai`), et le contraire n'est pas le faux, mais l'{coral}ignorance{/coral} (`agnoia`), absence de contact (1051b17-1052a4).** On ne peut pas se tromper (`apatêthênai`) sur le « ce que c'est », sauf par coïncidence. Énonciation et affirmation ne sont pas la même chose. Cette ignorance n'est pas comme la cécité (1052a2-4) : elle n'est pas l'absence de la faculté de penser.

      **Ce que posent les incomposés (Makin).** La conception standard suppose une complexité des deux côtés : des unités de sens combinées en affirmations ou négations, et des éléments du monde composés ou divisés. Les incomposés sont les cas où elle manque. La réponse d'Aristote est frappante : il y a un correspondant de la vérité (le contact), mais aucun de la fausseté (on ignore, on ne se trompe pas). C'est plus nuancé qu'en E4 (1027b27-28), où il n'y a ni vrai ni faux des choses simples, et cela rompt la symétrie attendue du vrai et du faux. La définition est le meilleur candidat de porteur de vérité non propositionnel, sans que *De l'interprétation* (5, 17a11-12) la tienne pour tel : elle n'exprime pas qu'une essence est composée avec autre chose, mais ce qu'elle est.

      **« Sauf par coïncidence » (1051b25-26)** est attaché aux essences, non aux substances non composées : soit Aristote distingue les deux cas, et l'on peut se tromper par coïncidence sur les premières seulement, soit la réserve va de soi pour les secondes (Makin).

      ! L'échec devant l'incomposé n'est pas un jugement faux, mais une absence de saisie.
