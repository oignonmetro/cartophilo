  - id: theta3-l3
    title: "Θ10 : essences et substances non composées"
    notes: |-
      **Côté monde, Θ10 vise deux sortes d'incomposés : les essences (« ce que c'est ») et les substances non composées (1051b27-30).** Ces dernières sont toutes en acte, non en puissance, parce qu'elles ne naissent ni ne périssent ; sinon elles viendraient à être à partir de quelque chose.

      **Makin y voit probablement des formes immatérielles** (Z8 : les formes ne sont ni faites ni produites). Les deux cas coïncident peut-être, ou les essences forment un ensemble plus large (celles qui comportent de la matière, comme l'homme), dont les formes pures ne seraient qu'une partie.

      **Pourquoi mentionner les substances non composées ?**

      | Lecture | Raison |
      | {coral}Thomas d'Aquin{/coral} | rattacher la vérité à l'acte |
      | {teal}Makin{/teal} | préparer la métaphysique de Λ : si le premier moteur est un penseur en acte, sa pensée a pour objets des formes pures, et le rapport de la pensée à ses objets, saisis sans erreur possible, devient capital |

      Makin objecte à Thomas qu'une phrase est aussi fausse en vertu de l'état actuel du monde. Cette discussion interrompt le lien entre 1051b6-17 et 1052a4-11, parce qu'elle introduit la notion d'erreur dont se sert la fin du chapitre.

      ! Les substances non composées n'ont aucune matière : elles ne naissent ni ne périssent, et sont toutes en acte.
