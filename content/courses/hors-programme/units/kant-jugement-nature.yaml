- id: kj1-l5
  title: "Ce que n'est pas un jugement : le problème de l'unité"
  notes: |-
    **Un jugement n'est pas une liste de concepts : c'est toute la nouveauté de la définition kantienne.** Les logiciens d'avant Kant, comme ceux de Port-Royal, définissent le jugement comme la {red}« représentation d'une relation entre deux concepts »{/red} (Déduction transcendantale, §19). Cette définition a deux défauts.
    - Elle implique que tout jugement est de forme sujet-prédicat. Or, Kant le note à la suite des {sky}logiciens stoïciens{/sky}, les jugements disjonctifs et hypothétiques sont des composés de jugements, dont la forme est celle de fonctions de vérité. L'idée inspirera les « lois de la pensée » de **Boole**.
    - Surtout, elle n'explique pas {red}l'unité du jugement{/red}, ce qui le distingue d'une simple liste. Un exemple familier : « Socrate, mortel » n'affirme rien ; « Socrate est mortel » est vrai ou faux. Deux concepts mis en relation ne suffisent pas à dire quelque chose. C'est ce qui reviendra, dans la philosophie analytique naissante, comme le problème de l'unité de la proposition.

    **La solution : le jugement est une fonction de liaison.** Kant le conçoit comme une {green}fonction cognitive d'ordre supérieur qui relie des contenus représentatifs d'ordre inférieur{/green}. Il le caractérise de six manières :
    - un acte de prédication logique, par lequel un concept s'applique à une chose, exprimé par la copule *est* (*La fausse subtilité des quatre figures du syllogisme*, §1) ;
    - la représentation de l'unité de la conscience qui relie plusieurs représentations (*Logique* de Jäsche, §17) ;
    - {teal}« la connaissance médiate d'un objet, par suite la représentation d'une représentation de cet objet »{/teal} (Analytique des concepts, chapitre I, 1re section) ;
    - {teal}« des fonctions de l'unité parmi nos représentations »{/teal} (Analytique des concepts, chapitre I, 1re section) ;
    - {teal}« la manière de ramener des connaissances données à l'unité objective de l'aperception. C'est à quoi vise la copule *est* en eux : distinguer l'unité objective de représentations données de l'unité subjective »{/teal} (Déduction transcendantale, §19) ;
    - l'acte de la faculté {teal}« de subsumer sous des règles, c'est-à-dire de déterminer si quelque chose se range ou non sous une règle donnée (*casus datae legis*) »{/teal} (Analytique des principes, Introduction).

    **Ces formules convergent.** À retenir :
    - le jugement {coral}s'ancre dans des intuitions{/coral}, termes singuliers directement référentiels, qu'on ne peut remplacer par des descriptions sans perte de sens (Hanna contre Thompson) ;
    - le « privilège de la prédication » (**Longuenesse**) sur les autres opérations logiques ;
    - une forme logique intrinsèque, fondée sur des modifications ou des composés de la copule ;
    - le caractère de règle ;
    - un contenu objectif unifié ;
    - et surtout {coral}un fondement d'unité dans la conscience de soi rationnelle{/coral}.

    ! Les jugements kantiens ne sont donc ni de simples objets psychologiques, ni des objets abstraits indépendants de l'esprit, ni, contrairement à ceux de Frege, des prises pour vrai assertives : ce sont des structures d'actes mentaux, partageables, dont le contenu peut être la cible d'attitudes très diverses.
