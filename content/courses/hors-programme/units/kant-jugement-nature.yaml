- id: kj1-l2
  title: "De la capacité à la faculté : spontanéité et innéité"
  notes: |-
    **Le jugement est le produit d'une faculté : encore faut-il dire ce qu'est une faculté.** Un {violet}jugement{/violet} (`Urteil`) est une sorte de {violet}connaissance{/violet} (`Erkenntnis`), que Kant définit génériquement comme toute représentation consciente d'un objet (Dialectique transcendantale, livre I, 1re section) ; il est le produit caractéristique de la {violet}faculté de juger{/violet} (`Urteilskraft`). Celle-ci est le « pouvoir de juger » (`Vermögen zu urteilen`, Analytique des concepts, chapitre I, 1re section), qui est aussi le « pouvoir de penser » (`Vermögen zu denken`, Analytique des concepts, §10).

    **Une capacité devient faculté quand elle est spontanée et innée.** Kant conçoit l'esprit comme actif et vivant : {teal}« l'esprit (`Gemüt`) pour lui-même est tout entier vie (le principe même de la vie) »{/teal} (*Critique de la faculté de juger esthétique*, Remarque générale après le §29). Une capacité cognitive (`Fähigkeit`) est une propension consciente à produire certaines représentations objectives dans certaines conditions. Qu'y ajoutent la spontanéité et l'innéité ?

    **La spontanéité cognitive est une créativité de structure.** Dès qu'elle reçoit des données sensorielles brutes, la faculté les organise, les « synthétise », d'une manière sans précédent par rapport à ces données, et produit des connaissances structurées nouvelles (*Critique de la raison pure*, Introduction, I ; Logique transcendantale, Introduction, I). L'argument est celui de la {violet}pauvreté du stimulus{/violet} : ce qui sort est largement sous-déterminé par ce qui entre, habitudes passées comprises. Un exemple familier, qui n'est pas de Kant : un enfant forme des phrases qu'il n'a jamais entendues. La spontanéité reste cependant toujours déclenchée par une stimulation sensible (*Critique de la raison pure*, Introduction, I).

    ! À ne pas confondre avec la **spontanéité pratique**, cause mentale qui détermine un effet dans le temps sans avoir elle-même de cause suffisante antérieure (Troisième antinomie, thèse). Le point commun est le caractère créateur, sans précédent, des opérations de l'esprit.

    **Une question disputée.** La spontanéité vient-elle seulement de la capacité conceptuelle (Déduction transcendantale, §24 ; **Longuenesse**), ou aussi, indépendamment, de la capacité intuitive que nous partageons avec les animaux non rationnels ( ; **Hanna**, **McLear**) ? Y a-t-il donc une seule synthèse, ou deux ? C'est la racine du débat sur le non-conceptualisme (unité suivante).

    **L'innéité est de procédure, non de contenu.** Une faculté est innée en trois sens : elle est intrinsèque à l'esprit, donc une partie nécessaire de la nature de l'animal rationnel ; elle contient des structures strictement sous-déterminées par toute impression sensible (c'est-à-dire *a priori*, *Critique de la raison pure*, Introduction, I) ; elle synthétise automatiquement les données selon des règles normatives qui reflètent ces structures. L'esprit a donc une {green}disposition active *a priori* à appliquer des règles de synthèse{/green}, et non, comme les idées innées de {red}Descartes et Leibniz{/red}, une réserve infinie de croyances ou de concepts complets. {red}Cette dernière conception surcharge l'esprit{/red}, dont les capacités de stockage sont limitées, comme l'a montré **Locke** ; l'objection ne touche pas l'innéité de procédure, qui ne stocke aucun contenu.
