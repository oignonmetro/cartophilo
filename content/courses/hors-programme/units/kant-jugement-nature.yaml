- id: kj1-l3
  title: "Deux facultés fondamentales : entendement et sensibilité"
  notes: |-
    **Le jugement réunit deux sources que rien ne peut réduire l'une à l'autre.** Les {sky}rationalistes{/sky} ne reconnaissent qu'une faculté fondamentale, la raison ; les {sky}empiristes{/sky}, qu'une seule, la perception sensible. Kant est {green}dualiste des facultés{/green} : l'{violet}entendement{/violet} (`Verstand`) est la faculté des concepts, de la pensée et du discours ; la {violet}sensibilité{/violet} (`Sinnlichkeit`) est celle des intuitions, de la perception sensible et de l'imagerie mentale ({plum}Logique transcendantale, Introduction, I{/plum}). La différence essentielle entre ces facultés, et donc entre concepts et intuitions, est un engagement fondamental de toute sa théorie.

    | Trait | Concept | Intuition |
    | Portée | général | singulier |
    | Rapport à l'objet | médiat, attributif | immédiat, directement référentiel |
    | Faculté | entendement | sensibilité |
    | Dépend-il de l'objet ? | non | oui |
    | Fonction propre | classer les perceptions | donner l'objet aux sens |

    **Le** __**concept**__ est donc une {amber}représentation générale{/amber} (*Logique* de Jäsche, §1) et {amber}discursive{/amber}, qui exprime des formes logiques pures et {coral}tombe sous des lois logiques pures{/coral} (Analytique des concepts, chapitre I, 1re section). C'est aussi __une intension complexe, portant sur une__ {violet}__extension__{/violet} (`Umfang`) qui contient tous les objets réels et possibles tombant sous elle, ainsi que d'autres extensions plus étroites (*Logique* de Jäsche, §§7-8). Il représente les objets individuels de manière médiate (Dialectique transcendantale, livre I, 1re section), sert de règle pour classer et organiser les perceptions (Déduction transcendantale (édition A), 2e section) et est __une représentation « réfléchie »__, qui exprime l'__unité supérieure de la conscience de soi rationnelle__, l'{violet}aperception{/violet} (Déduction transcendantale, §16).

    **L'**__**intuition**__ est une représentation consciente dirigée vers un objet, qui est singulière (Dialectique transcendantale, livre I, 1re section), liée aux sens (Esthétique transcendantale, §1), dépendante de l'objet (Esthétique transcendantale, §8), immédiate (Déduction transcendantale, §13) et, surtout {green}non conceptuelle{/green} (Amphibolie des concepts de la réflexion). Quand je dis « ce livre », je désigne une chose présente ; quand je dis « livre », je décris toute chose possible qui répond à la description.
