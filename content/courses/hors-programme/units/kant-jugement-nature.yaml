- id: kj1-l8
  title: "La vérité : définition nominale et critères"
  notes: |-
    **Kant distingue ce qu'est la vérité et le moyen de la reconnaître.** La vérité est un prédicat de jugements entiers, non de leurs parties, intuitions ou concepts (Dialectique transcendantale, Introduction, I). La validité objective et la cohérence logique (Logique transcendantale, Introduction, III) en sont des conditions nécessaires, mais non suffisantes.

    **La définition nominale.** La vérité est l'{violet}accord{/violet} ou la correspondance (`Übereinstimmung`) d'une connaissance avec son objet (Logique transcendantale, Introduction, III). Une définition nominale dégage l'« essence logique » d'un concept, ses critères, sans atteindre les « déterminations internes » des choses, ce qui serait le rôle d'une définition réelle (*Logique* de Jäsche, §106). L'accord se déplie, dans la lecture de Hanna, en trois conditions :
    - la structure de l'objet est {coral}isomorphe{/coral} à la forme logique de la proposition ;
    - le sujet s'oriente dans le monde en projetant l'objet sous des {coral}« points de vue »{/coral} (`Gesichtspunkte`), ceux que tout homme rationnel associerait à ces concepts (*Qu'est-ce que s'orienter dans la pensée ?*) ;
    - l'objet représenté {coral}existe réellement{/coral}.

    Les jugements vrais sont donc des façons de nous projeter rationnellement sur des {violet}vérifacteurs{/violet} effectifs. Ce n'est {red}pas une conception « déflationniste »{/red}, car la vérité ne se réduit pas à asserter les faits : son concept exprime aussi l'intérêt rationnel fondamental à « ne pas se tromper », une orientation cognitive partageable, et il appartient au concept moral de sincérité.

    **Pas de critère universel.** La définition nominale n'est pas le {violet}critère{/violet} (`Kriterium`) de la vérité, règle pour déterminer si des jugements sont vrais dans des contextes précis (Logique transcendantale, Introduction, III). Selon Kant, {red}il n'y a pas de critère absolument général{/red}, comme la clarté et la distinction des cartésiens : un tel critère devrait faire abstraction de tout contenu, alors que la vérité porte précisément sur le contenu. Mais il y a des critères propres aux trois classes de jugements : analytiques, synthétiques *a posteriori*, synthétiques *a priori*.

    **La vérité empirique est le niveau de base**, car les autres sortes de vérité la présupposent. Son objet est un {violet}objet de l'expérience{/violet} (`Gegenstand der Erfahrung`), réel ou possible : un état de choses empirique, ou une chose matérielle macroscopique pouvant entrer dans des relations causales selon des lois nécessaires (Analogies de l'expérience). Ces objets sont les vérifacteurs des jugements empiriques. D'où le {violet}critère de la vérité empirique{/violet} : le contenu d'un jugement empirique peut se spécifier comme une règle conceptuelle nécessaire des apparences sensibles ; si cette règle s'applique effectivement à la succession temporelle de nos représentations, et si elle s'accorde avec les lois causales de la nature, ce jugement est vrai (Deuxième Analogie ; Troisième antinomie, remarque sur l'antithèse).

    ! La vérité comme correspondance et le critère empirique ne font pas double emploi : la première dit ce qu'est être vrai, le second comment le reconnaître.
