- id: kj1-l6
  title: "La proposition, ce qui est jugé"
  notes: |-
    **Sous la forme logique du jugement, il y a plus fondamental : son contenu.** Tout jugement a une intension ou contenu sémantique (`Inhalt`) : la {violet}proposition{/violet} (`Satz`). Elle n'est pas monolithique, mais un composé unifié de parties ayant chacune un sens. C'est le contenu représentatif objectif, unifié, logiquement bien formé, sémantiquement bien composé et ayant une valeur de vérité, d'un jugement ; plus généralement, {green}c'est « ce qui est jugé »{/green} quand on avance une prétention rationnelle sur le monde (*Logique* de Jäsche, §30).

    **Ni privée, ni abstraite.** Une proposition est toujours produite par des processus psychologiques, mais elle n'est {red}pas privée{/red} : elle est partageable entre sujets et rationnellement communicable, car la même forme et le même contenu peuvent être produits par bien des animaux qui jugent, s'ils ont la même architecture cognitive. C'est pourquoi l'on peut éviter à la fois le psychologisme (elle n'est pas enfermée dans une tête) et le platonisme (elle n'existe pas sans actes qui la produisent). La fonction première de la faculté de juger est de produire ces contenus : les hommes sont, plus précisément, des **animaux propositionnels**.

    **La proposition avant l'inférence.** Tout jugement joue bien un rôle inférentiel (Longuenesse), mais la fonction propositionnelle est plus fondamentale. Aussi les {violet}constantes logiques{/violet} de Kant (tout, quelque, ce, l'affirmation, la négation de la proposition, la négation du prédicat, la copule, si-alors, la disjonction, nécessairement, possiblement, effectivement) sont-elles définies par leur rôle dans le contenu propositionnel, indépendamment des inférences où le jugement peut entrer (Analytique des concepts, chapitre I, 1re et 2e sections).

    **Une lecture rivale.** Les traitements {pink}inférentialistes{/pink} de Kant (**Landy**, **Leech**) tiennent au contraire que les contenus sémantiques et les constantes logiques dépendent essentiellement de leur rôle inférentiel et sont déterminés par lui. La lecture de Hanna, dans laquelle la proposition a la priorité, s'y oppose.

    ! `Inhalt` n'est pas la matière sensible (`Materie`) : le premier est objectif et représentatif, le second subjectif et non représentatif (voir l'unité sur les contenus du jugement).
