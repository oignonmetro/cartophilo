- id: kj1-l7
  title: "Validité objective, réalité objective, jugements vides"
  notes: |-
    **Un jugement peut être faux et avoir pourtant un sens : tout l'enjeu est là.** Kant dissocie donc avoir un sens empirique et être vrai.

    **Validité subjective, validité objective.** L'activité rationnelle de tenir pour vrai implique la validité subjective d'un jugement : son sens et sa vérité apparents pour un individu. La {violet}validité objective{/violet} (`objektive Gültigkeit`) en est le sens empirique. Elle repose sur le rapport empirique (`Beziehung`) de ses constituants, intuitions et concepts, lui-même contraint par la dimension sensible et non conceptuelle de l'expérience : la présence brute d'objets matériels à notre réceptivité (affection externe) et les formes nécessaires de l'intuition, l'espace et le temps (Esthétique transcendantale, §1).

    **Trois définitions.**
    - Une **intuition** est objectivement valide si et seulement si elle se rapporte directement à un objet sensible, réel ou possible (ou à la réponse intérieure du sujet à ce rapport), ou si elle représente une condition nécessaire des intuitions empiriques (les formes de l'intuition).
    - Un **concept** est objectivement valide si et seulement si il s'applique à des objets réels ou possibles de l'intuition empirique (concepts empiriques), ou s'il représente une condition nécessaire des concepts empiriques (concepts purs).
    - Un **jugement** est objectivement valide si et seulement si il est logiquement bien formé (correct selon la grammaire et selon les sortes de choses) et si tous ses constituants sont objectivement valides (Système des principes, 2e section).

    **Validité n'est pas vérité.** La {violet}réalité objective{/violet} (`objektive Realität`) caractérise les représentations valides qui s'appliquent à des objets effectivement existants, non simplement possibles (Analytique des principes, chapitre III, phénomènes et noumènes). {coral}Les jugements vrais sont donc les propositions objectivement réelles.{/coral} La validité objective est une condition nécessaire mais non suffisante de la vérité, puisque les jugements faux sont eux aussi objectivement valides (Logique transcendantale, Introduction, III). Elle équivaut à **avoir une valeur de vérité**, non à être vrai. « Il y a un éléphant dans cette pièce » (exemple familier) est faux, et parfaitement valide.

    **Le vide n'est pas le non-sens.** Tout jugement qui n'est pas objectivement valide est {violet}vide{/violet} (`leer`), sans valeur de vérité. Mais un jugement vide peut rester rationnellement intelligible si ses concepts sont logiquement cohérents, c'est-à-dire « pensables » (*Critique de la raison pure*, Préface de la seconde édition). C'est le cas de jugements portant sur des objets nouménaux (les choses en soi) ou des sujets nouménaux (les personnes) : sans sens empirique, ils restent les cibles légitimes de la croyance « doctrinale », et sont même essentiels à la métaphysique théorique et à la métaphysique pratique de la liberté et de la morale (Antinomie de la raison pure, 9e section, III).

    ! « Vide » ne veut pas dire absurde : « l'âme est libre » n'a pas de valeur de vérité, mais se pense sans contradiction.
