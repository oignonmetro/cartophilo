- id: kj1-l4
  title: "Imagination, raison, aperception : l'animal qui juge"
  notes: |-
    **Autour des deux facultés fondamentales s'en ordonnent trois autres, et leur réunion est ce qu'accomplit le jugement.**

    | Faculté | Terme allemand | Rôle dans le jugement |
    | imagination | `Einbildungskraft` | synthèse par en bas, schèmes |
    | raison | `Vernunft` | principes et inférences, par en haut |
    | aperception | `Ich denke` | unité supérieure, le « je pense » |

    **Par en bas, l'imagination.** Prise génériquement, elle est la source de toute synthèse. Prise comme faculté dédiée, productive ou reproductive, elle produit les formes spatiales et temporelles de l'intuition, l'imagerie nouvelle, la mémoire et les {violet}schèmes{/violet} : des règles qui interprètent les règles conceptuelles générales par des formes spatio-temporelles et des images (Analytique des concepts, §10 ; Déduction transcendantale, §24 ; Schématisme des concepts purs). En principe, elle médiatise donc entre les deux facultés, comme une troisième capacité autonome : Kant serait alors {yellow}« trinitaire »{/yellow}. Mais {red}il dit aussi qu'elle appartient à la sensibilité et qu'elle résulte de l'action de l'entendement sur la sensibilité{/red}. Cette obscurité, disputée par **Heidegger**, **Waxman** et **Longuenesse**, pèse sur toute la théorie du jugement.

    **Par en haut, la raison** (`Vernunft`) : elle produit les inférences logiques, accomplit les choix pragmatiques et moraux (les « jugements pratiques »), impose la cohérence à toute connaissance et surtout met en œuvre, sous forme de principes (`Principien`, `Grundsätze`), des concepts fortement modaux et catégoriquement normatifs, comme la vérité nécessaire et l'obligation inconditionnelle (Dialectique transcendantale, Introduction, II).

    **Au sommet, l'aperception.** L'unité objective de tout jugement est garantie par la conscience de soi rationnelle, qui joue un rôle {yellow}« exécutif »{/yellow} dans l'organisation de l'esprit : elle introduit une seule unité supérieure dans les représentations inférieures. Son produit est le {violet}« je pense »{/violet} (`Ich denke`) : « je pense à X », ou « je pense que P » (Déduction transcendantale, §16). Il est {teal}« le véhicule de tous les concepts et jugements, quels qu'ils soient »{/teal} (Paralogismes de la raison pure), car il est une condition nécessaire de l'unité de tout jugement et met automatiquement en œuvre l'une des formes logiques *a priori*, les {violet}catégories{/violet} (Analytique des concepts, chapitre I).

    **D'où la centralité.** La faculté de juger n'est pas une faculté fondamentale, et pourtant elle est la faculté centrale : juger rassemble, par l'aperception, les sous-actes de l'intuition, de la conceptualisation, de l'imagination et de la raison, pour produire un seul résultat, le jugement. Elle intègre donc toutes les facultés, et par là constitue {coral}un seul animal humain rationnel{/coral}. Pour Kant, **les hommes sont des animaux qui jugent**.

    ! « Non fondamentale » et « centrale » ne se contredisent pas : la faculté de juger n'est pas une source de plus, elle est le lieu où toutes les sources se rejoignent.
