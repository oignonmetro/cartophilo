- id: kj1-l3
  title: "Deux facultés fondamentales : entendement et sensibilité"
  notes: |-
    **Le jugement réunit deux sources que rien ne peut réduire l'une à l'autre.** Les rationalistes ne reconnaissent qu'une faculté fondamentale, la raison ; les empiristes, qu'une seule, la perception sensible. Kant est {green}dualiste des facultés{/green} : l'{violet}entendement{/violet} (`Verstand`) est la faculté des concepts, de la pensée et du discours ; la {violet}sensibilité{/violet} (`Sinnlichkeit`) est celle des intuitions, de la perception sensible et de l'imagerie mentale (Logique transcendantale, Introduction, I). La différence essentielle entre ces facultés, et donc entre concepts et intuitions, est un engagement fondamental de toute sa théorie.

    | Trait | Concept | Intuition |
    | Portée | général, forme de l'universalité | singulier |
    | Rapport à l'objet | médiat, attributif | immédiat, directement référentiel |
    | Faculté | entendement | sensibilité |
    | Dépend-il de l'objet ? | non | oui |
    | Fonction propre | règle pour classer les perceptions | donner l'objet aux sens |

    **Le concept** est donc une représentation générale (*Logique* de Jäsche, §1) et discursive, qui exprime des formes logiques pures et tombe sous des lois logiques pures (Analytique des concepts, chapitre I, 1re section). C'est aussi une intension complexe, portant sur une {violet}extension{/violet} (`Umfang`) qui contient tous les objets réels et possibles tombant sous elle, ainsi que d'autres extensions plus étroites (*Logique* de Jäsche, §§7-8). Il représente les objets individuels de manière médiate (Dialectique transcendantale, livre I, 1re section), sert de règle pour classer et organiser les perceptions (Déduction transcendantale (édition A), 2e section) et est une représentation « réfléchie », qui exprime l'unité supérieure de la conscience de soi rationnelle, l'{violet}aperception{/violet} (Déduction transcendantale, §16).

    **L'intuition** est une représentation consciente dirigée vers un objet, qui est singulière (Dialectique transcendantale, livre I, 1re section), liée aux sens (Esthétique transcendantale, §1), dépendante de l'objet (Esthétique transcendantale, §8), immédiate (Déduction transcendantale, §13) et, surtout dans la lecture de **Hanna**, {green}non conceptuelle{/green} (Amphibolie des concepts de la réflexion). Quand je dis « ce livre », je désigne une chose présente ; quand je dis « livre », je décris toute chose possible qui répond à la description.

    ! Hanna écrit « comprehension » pour `Umfang` : ce mot anglais désigne l'extension du concept (les choses qui tombent sous lui), non ce que le français appelle sa compréhension, c'est-à-dire son contenu.
