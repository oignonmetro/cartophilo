# Cours sur la théorie kantienne du jugement (voir content/philosophie.md),
# tiré de l'article « Kant's Theory of Judgment » de Robert Hanna, Stanford
# Encyclopedia of Philosophy (2004, révision 2017), et de ses cinq suppléments,
# chacun traité à la place que lui donne la table des matières de l'article.
# Ici : introduction et section 1 (« The Nature of Judgment »). Citations de
# Kant traduites de l'anglais de l'article, situées par œuvre et section.
#
# Choix de traduction : Erkenntnis se rend par « connaissance » (au sens large
# de Hanna, toute représentation consciente d'un objet), Umfang par
# « extension » (l'anglais « comprehension » de Hanna serait un faux ami :
# la compréhension d'un concept, en français, c'est son Inhalt).
#
# Points laissés de côté : la bibliographie des inférentialistes au-delà de
# Landy et Leech ; le renvoi à Martin 2006 sur les « faces » du jugement.

id: kant-jugement-nature
title: "Ce qu'est un jugement"
subtitle: "Les facultés, l'unité du jugement, la proposition, la vérité"
icon: bulb
color: blue
group: "Kant : la théorie du jugement"
intro: |-
  Pour Kant, l'homme est d'abord un animal qui juge. Ce cours suit la théorie du jugement dans l'ordre : ce qu'est un jugement (cette unité), le débat sur les intuitions sans concepts et les degrés de la croyance, les formes logiques, les sortes de contenu et d'usage, enfin la métaphysique qu'elle engage et ses difficultés.
lessons:
- id: kj1-l1
  title: "Ni psychologisme ni platonisme : les trois thèses de Kant"
  notes: |-
    **Le jugement réunit quatre questions d'ordinaire séparées** : sémantique, logique, psychologie cognitive, épistémologie (et, pour le jugement pratique, action, psychologie morale, éthique). Cette leçon situe Kant face aux deux camps qui se partagent les théories du jugement, puis donne les trois thèses que tout le cours déploie.

    **Deux camps, qui semblent ne jamais pouvoir se rejoindre.**
    - {red}Le psychologisme{/red} : un jugement n'est qu'une représentation mentale de relations d'idées (la *Logique de Port-Royal*) ou une combinaison mentale ordonnée d'individus, d'universaux et de constantes logiques (le premier Russell).
    - {pink}Le platonisme{/pink} : un jugement n'est qu'une attitude assertive visant des propositions ou des pensées abstraites, indépendantes de l'esprit (Bolzano, Frege).

    **Kant échappe à l'alternative** : sa théorie est à la fois {green}cognitiviste, antipsychologiste et antiplatonicienne{/green}. Un jugement est un acte de l'esprit, comme le veut le premier camp ; mais son contenu se partage et obéit à des lois logiques, comme le veut le second. Plus précisément, les jugements sont des connaissances conscientes complexes qui :
    - se rapportent à des objets, directement (par des intuitions) ou indirectement (par des concepts) ;
    - comprennent des concepts prédiqués de ces objets ou d'autres concepts ;
    - illustrent des concepts logiques purs et entrent dans des inférences selon des lois logiques pures ;
    - impliquent de suivre des règles et de les appliquer aux objets que les intuitions désignent ;
    - expriment des propositions vraies ou fausses ;
    - servent de médiation à la formation des croyances et d'autres actes intentionnels ;
    - sont unifiés et conscients d'eux-mêmes.

    **Trois thèses dirigent le tout**, telles que **Hanna** les nomme.
    - {violet}La thèse de la centralité{/violet} : la capacité innée de juger est la faculté cognitive centrale, car le jugement est, seul parmi nos accomplissements, le produit de toutes les autres facultés opérant ensemble sous une unité supérieure, celle de la conscience de soi rationnelle.
    - {violet}La thèse de la priorité de la proposition{/violet} : le contenu propositionnel a la priorité explicative sur les intuitions et les concepts qui le composent, sur la forme logique, sur le rôle inférentiel, sur les états psychologiques, sur les croyances et sur les actes qu'il guide.
    - {violet}La thèse de l'idéalisme transcendantal{/violet} : les jugements n'ont de sens empirique (validité objective) et de vérité (réalité objective) que si l'idéalisme transcendantal est correct.

    ! Les deux premières thèses sont, pour Hanna, détachables de la troisième : c'est la conclusion de tout le cours, et c'est là que sa lecture va au-delà de ce que Kant dirait lui-même.
  points:
