# Cours sur la théorie kantienne du jugement (voir content/philosophie.md),
# tiré de l'article « Kant's Theory of Judgment » de Robert Hanna, Stanford
# Encyclopedia of Philosophy (2004, révision 2017), et de ses cinq suppléments,
# chacun traité à la place que lui donne la table des matières de l'article.
# Ici : introduction et section 1 (« The Nature of Judgment »). Citations de
# Kant traduites de l'anglais de l'article, situées par œuvre et section.
#
# Choix de traduction : Erkenntnis se rend par « connaissance » (au sens large
# de Hanna, toute représentation consciente d'un objet), Umfang par
# « extension » (l'anglais « comprehension » de Hanna serait un faux ami :
# la compréhension d'un concept, en français, c'est son Inhalt).
#
# Points laissés de côté : la bibliographie des inférentialistes au-delà de
# Landy et Leech ; le renvoi à Martin 2006 sur les « faces » du jugement.

id: kant-jugement-nature
title: "Ce qu'est un jugement"
subtitle: "Les facultés, l'unité du jugement, la proposition, la vérité"
icon: bulb
color: blue
group: "Kant : la théorie du jugement"
intro: |-
  Pour Kant, l'homme est d'abord un animal qui juge. Ce cours suit la théorie du jugement dans l'ordre : ce qu'est un jugement (cette unité), le débat sur les intuitions sans concepts et les degrés de la croyance, les formes logiques, les sortes de contenu et d'usage, enfin la métaphysique qu'elle engage et ses difficultés.
lessons:
- id: kj1-l1
  title: "Ni psychologisme ni platonisme : les trois thèses de Kant"
  notes: |-
    **Le jugement réunit quatre questions d'ordinaire séparées** : sémantique, logique, psychologie cognitive, épistémologie (et, pour le jugement pratique, action, psychologie morale, éthique). Il s'agit ici de situer Kant face aux deux camps qui se partagent les théories du jugement, puis de dégager ses trois grandes thèses sur le jugement.

    **Deux camps, qui semblent ne jamais pouvoir se rejoindre.**
    - {red}Le psychologisme{/red} : un jugement n'est qu'une {amber}représentation mentale{/amber} de {yellow}relations d'idées{/yellow} (la *Logique de Port-Royal*) ou une {yellow}combinaison mentale{/yellow} ordonnée d'individus, d'universaux et de constantes logiques (le premier Russell).
    - {pink}Le platonisme{/pink} : un jugement n'est qu'une {amber}attitude assertive{/amber} visant des propositions ou des pensées abstraites, {coral}indépendantes de l'esprit{/coral} (Bolzano, Frege).

    **Kant échappe à l'alternative** : sa théorie est à la fois {green}cognitiviste, antipsychologiste et antiplatonicienne{/green}. Un jugement est un {amber}acte de l'esprit{/amber}, comme le veut le premier camp ; mais {amber}son contenu se partage et obéit à des lois logiques{/amber}, comme le veut le second. Plus précisément, les jugements sont des connaissances conscientes complexes qui :
    - __se rapportent à des objets__, directement (par des intuitions) ou indirectement (par des concepts) ;
    - comprennent des __concepts prédiqués__ de ces objets ou d'autres concepts ;
    - illustrent des __concepts logiques purs__ et entrent dans des inférences selon des __lois logiques pures__ ;
    - impliquent de __suivre des règles__ et de les appliquer aux objets que les intuitions désignent ;
    - expriment des __propositions vraies ou fausses__ ;
    - servent de médiation à la formation des __croyances__ et d'autres actes intentionnels ;
    - sont __unifiés et conscients__ d'eux-mêmes.

    **Trois thèses dirigent le tout :**
    - {violet}La thèse de la __centralité__{/violet} : la {amber}capacité innée{/amber} de juger est la faculté cognitive centrale, car le jugement est, seul parmi nos accomplissements, le {coral}produit de toutes les autres facultés{/coral} opérant ensemble sous une {coral}unité supérieure{/coral}, celle de la {amber}conscience de soi rationnelle{/amber}.
    - {violet}La thèse de la priorité de la __proposition__{/violet} : le {amber}contenu propositionnel{/amber} a la {amber}priorité explicative{/amber} sur les intuitions et les concepts qui le composent, sur la forme logique, sur le rôle inférentiel, sur les états psychologiques, sur les croyances et sur les actes qu'il guide.
    - {violet}La thèse de l'idéalisme __transcendantal__{/violet} : les jugements n'ont de sens empirique (validité objective) et de vérité (réalité objective) que si l'idéalisme transcendantal est correct.

    ! Les deux premières thèses sont, semble-t-il, détachables de la troisième : c'est la conclusion de tout le cours, et c'est là que sa lecture va au-delà de ce que Kant dirait lui-même.
  points:
  - id: kj1-l1-p1
    sentence: "__Pour le camp__ ___ des théories du jugement, un jugement n'est qu'une représentation mentale de relations d'idées, comme dans la *Logique de Port-Royal*, ou une combinaison mentale d'individus et d'universaux, comme chez le premier Russell."
    answer: "psychologiste"
