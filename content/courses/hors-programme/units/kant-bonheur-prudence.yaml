# Unité de texte (voir content/textes.md) : Kant, Fondements de la
# métaphysique des mœurs, Deuxième section (« Passage de la philosophie
# morale populaire à la Métaphysique des mœurs »), AK IV, 418-419, trad.
# V. Delbos, Delagrave, 1999, p. 131-132. Cartes-explication tirées d'un
# commentaire anonyme du même extrait (scan agrégation).

id: kant-bonheur-prudence
title: "Le bonheur ne peut pas commander"
subtitle: "Fondements de la métaphysique des mœurs, AK IV, 418-419"
icon: page
color: yellow
group: "Kant : la morale"
intro: |-
  Un extrait des *Fondements de la métaphysique des mœurs* où Kant réfute l'eudémonisme,
  la doctrine qui place le bonheur au fondement de la moralité : non pas parce que
  personne ne désirerait être heureux, mais parce qu'aucun être fini ne peut savoir, en
  termes précis et cohérents, ce qui le rendrait véritablement heureux. Kant construit sa
  démonstration comme un syllogisme, en trois moments.
lessons:
- id: kant-bonheur-prudence-i1
  title: "La conscience morale et le problème du bonheur"
  notes: |-
    Kant part d'un fait : la **conscience morale commune** a, dans tous les cas, la pleine
    compétence pour distinguer ce qui est bien de ce qui est mal, sans avoir besoin ni de
    science ni de philosophie. Sa tâche n'est donc pas d'inventer une nouvelle morale, mais
    de rendre la raison attentive à son propre principe, contre les mauvaises
    interprétations qu'on a pu faire de cette conscience commune.

    La plus répandue de ces mauvaises interprétations est l'eudémonisme, qui met le
    bonheur au principe de la moralité. Elle s'appuie sur un fait tout aussi commun : Kant
    lui-même reconnaît que, face aux commandements du devoir, l'homme sent en lui-même
    un puissant contrepoids qui réside dans ses besoins et ses inclinations, dont il résume
    sous le nom de bonheur la perspective d'une complète satisfaction. Le penchant naturel
    qu'a la raison de corrompre les lois strictes du devoir en voulant les adapter à ces
    inclinations, Kant l'appelle la « dialectique naturelle » de la raison.

    Notre extrait est exactement cette réfutation, dans la Deuxième section des
    *Fondements* : Kant n'y démontre pas seulement que le bonheur ne doit pas être placé
    au principe de nos actions, mais qu'il ne peut littéralement pas l'être, tant sa
    recherche entre en contradiction avec elle-même.

    ! Kant ne nie à aucun moment que nous désirions tous être heureux : c'est un fait. Ce
    qu'il conteste, c'est que ce désir puisse fonder ou commander nos actions.
