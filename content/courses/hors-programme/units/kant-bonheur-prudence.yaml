- id: kant-bonheur-prudence-p2
  title: "Richesse, savoir, longévité, santé : les faux moyens du bonheur"
  notes: |-
    C'est l'impossibilité, pour un « être fini », de rencontrer le bonheur dans le monde
    sensible qui constitue la **mineure** du syllogisme. Alors que le premier moment
    procédait presque anthropologiquement (« l'homme »), celui-ci construit un argument
    *a fortiori* : si c'est le cas pour l'être fini le plus perspicace et le plus
    puissant qu'on puisse supposer, alors c'est aussi le cas pour l'être fini le plus
    ordinaire.

    Les quatre exemples, tous formulés avec le même verbe, *vouloir* (`wollen`), ne sont
    pas de simples illustrations : ils sont la seule conséquence possible de l'argument de
    Kant. Puisque personne ne peut donner de définition claire du bonheur, il ne reste que
    le désir et ses incertitudes ; chacun cherche alors de faux synonymes du bonheur, qui,
    par définition, resteront toujours insuffisants.

    | Exemple      | Le risque que Kant y voit                                            |
    | Richesse     | soucis, envie, pièges                                                |
    | Connaissance | des maux d'autant plus terribles à voir venir, ou des besoins accrus |
    | Longue vie   | une longue souffrance                                                |
    | Santé        | des excès qu'une indisposition passagère aurait pourtant évités      |

    La mention de l'omniscience, à la toute fin de la phrase, est décisive : c'est par
    elle que l'impossibilité cesse d'être seulement de fait pour devenir une impossibilité
    *a priori*, de droit. D'où la conclusion, introduite par « donc » : on ne peut agir
    pour être heureux que d'après des conseils empiriques, jamais d'après des principes
    déterminés.

    ! Les exemples ne visent pas seulement à montrer que la richesse, la connaissance ou
    la santé ne garantissent pas le bonheur dans la durée, mais que les fins qu'elles
    induisent sont elles-mêmes incertaines et inadéquates au but que l'on avait en tête.
  passage:
    label: "Deuxième moment"
    text: "Or il est impossible qu'un être fini, si perspicace et en même temps si puissant qu'on le suppose, se fasse un concept déterminé de ce qu'il veut ici véritablement. Veut-il la richesse ? Que de soucis, que d'envie, que de pièges ne peut-il pas par-là attirer sur sa tête ! Veut-il beaucoup de connaissance et de lumières ? Peut-être cela ne fera-t-il que lui donner un regard plus pénétrant pour lui représenter d'une manière d'autant plus terrible les maux qui jusqu'à présent se dérobent à sa vue et qui sont pourtant inévitables, ou bien que charger de plus de besoins encore ses désirs qu'il a déjà bien assez de peine à satisfaire. Veut-il une longue vie ? Qui lui répond que ce ne serait pas une longue souffrance ? Veut-il du moins la santé ? Que de fois l'indisposition du corps a détourné d'excès où aurait fait tomber une santé parfaite, etc. ! Bref, il est incapable de déterminer avec une entière certitude d'après quelque principe ce qui le rendrait véritablement heureux : pour cela, il lui faudrait l'omniscience. On ne peut donc pas agir, pour être heureux, d'après des principes déterminés, mais seulement d'après des conseils empiriques, qui recommandent, par exemple, un régime sévère, l'économie, la politesse, la réserve, etc., toutes choses qui, selon les enseignements de l'expérience, contribuent en thèse générale pour la plus grande part au bien-être."
  points:
