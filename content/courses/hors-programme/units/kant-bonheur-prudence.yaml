    label: "Deuxième moment"
    part: "2. La mineure : tout être fini"
    text: "Or il est impossible qu'un être fini, si perspicace et en même temps si puissant qu'on le suppose, se fasse un concept déterminé de ce qu'il veut ici véritablement."
  points:
