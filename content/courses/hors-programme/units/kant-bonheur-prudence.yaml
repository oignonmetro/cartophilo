- id: kant-bonheur-prudence-p1
  title: "Un concept si indéterminé"
  notes: |-
    **La première phrase pose la thèse du texte :** {violet}**le concept du bonheur**{/violet} **est** {coral}**si indéterminé**{/coral} **que personne ne peut dire ce qu'il veut en voulant être heureux.**

    ? **Bonheur** : chez Kant, la satisfaction de {amber}toutes nos inclinations{/amber}, aussi grande, aussi durable et aussi étendue que possible ({sky}*Critique de la raison pure*, Canon de la raison pure{/sky}). {yellow}Être à la fois riche, estimé, aimé, en bonne santé, et le rester toujours{/yellow}.

    **Pourquoi « concept » ?** Avoir le concept d'une chose, c'est pouvoir dire ce qui tombe sous lui et ce qui n'y tombe pas : {yellow}je sais reconnaître un triangle parmi les figures{/yellow}. Un concept {red}« indéterminé »{/red} est presque une contradiction : il nomme sans délimiter. {coral}Je dis « bonheur », mais je ne sais pas reconnaître, parmi les vies possibles, celle qui me rendrait heureux.{/coral}

    **Pourquoi « malgré le désir qu'a tout homme d'arriver à être heureux » ?** C'est une concession, et elle fait le problème. Kant accorde {green}le fait{/green} : tout homme désire le bonheur. Si personne ne le désirait, son indétermination serait sans conséquence. {amber}Le désir est certain, son objet ne l'est pas{/amber} : on veut quelque chose sans pouvoir dire quoi.

    **Pourquoi « dire en termes précis et cohérents » ?** Deux exigences distinctes. {amber}Précis{/amber} : savoir quel contenu on vise. {amber}Cohérents{/amber} : que ces contenus s'accordent entre eux, {yellow}alors que la richesse trouble la tranquillité, et que le savoir aiguise la crainte{/yellow}. Et « dire » est l'œuvre de la raison, qui procède par concepts : {coral}on sent le bien-être, on ne peut pas en énoncer la règle.{/coral}

    **Pourquoi « il désire et il veut » ?** Désirer relève des {violet}inclinations{/violet}, vouloir de la {violet}volonté{/violet}, qui se fixe une fin et par là ses moyens. On peut désirer vaguement ; on ne peut pas vouloir vaguement, puisque vouloir une fin, c'est vouloir ce qui y mène. {coral}C'est pourquoi l'indétermination de l'objet paralyse la volonté elle-même.{/coral}

    **Ce que la phrase prépare.** Si le concept du bonheur était déterminé, les impératifs de la prudence seraient {amber}analytiques{/amber} comme ceux de l'habileté, et commanderaient. Toute la suite explique pourquoi il ne l'est pas, et ce qui s'ensuit.

    ! Kant ne dit pas que le bonheur {red}n'existe pas{/red} ou qu'on ne le {red}sent{/red} pas : ce qu'on ne peut pas, c'est {green}le dire{/green}, donc en tirer une règle.
