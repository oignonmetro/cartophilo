- id: kant-bonheur-prudence-i3
  title: "La question, la thèse, la problématique"
  notes: |-
    **Le texte se demande si {amber}le bonheur peut donner à la volonté une règle qui commande{/amber}.** Autrement dit : la fin que tous poursuivent peut-elle fonder un impératif, et par là, comme le veut l'eudémonisme, la moralité ?

    **Pourquoi est-ce une question ?** Parce que tout semble l'y destiner. Le bonheur est voulu par tous, et nécessairement : {teal}« Être heureux est{/teal} nécessairement {teal}ce à quoi aspire tout être raisonnable, mais fini »{/teal}, écrit Kant dans la {sky}*Critique de la raison pratique*{/sky}. Et qui veut la fin veut les moyens. Il suffirait donc, semble-t-il, de connaître les moyens du bonheur pour tenir {yellow}une règle valable pour tous, comme la règle du médecin vaut pour quiconque veut guérir{/yellow}. C'est la réponse ordinaire, celle des morales antiques et de l'eudémonisme : {red}la raison calcule les moyens du bonheur, et la vertu est ce calcul bien fait{/red}.

    **Sa thèse :** {coral}le concept du bonheur est si indéterminé que personne ne peut dire ce qu'il veut en le voulant{/coral} ; il n'y a donc pas d'impératif qui commande de faire ce qui rend heureux, seulement des {amber}conseils{/amber}, parce que {green}le bonheur est un idéal, non de la raison, mais de l'imagination{/green}.

    **Sa problématique :** comment une fin {amber}voulue par tous et nécessairement{/amber} peut-elle ne rien commander, alors que vouloir une fin, c'est vouloir ses moyens ? La difficulté est que la thèse doit tenir ensemble deux affirmations : le désir de bonheur est universel, et il ne fournit aucune règle universelle. Si le désir était incertain, il n'y aurait pas de problème ; si son objet était connu, il y aurait un impératif. {coral}Tout repose donc sur l'écart entre la certitude du désir et l'indétermination de son objet.{/coral}

    | Difficulté | Où elle se trouve | Réponse du texte |
    | tous veulent le bonheur, et personne ne sait ce qu'il veut | « malgré le désir qu'a tout homme » | le désir vise une idée, un tout absolu, que des éléments empiriques ne remplissent jamais |
    | on pourrait n'y voir qu'une ignorance qu'un savoir plus grand corrigerait | « si perspicace et en même temps si puissant » | il faudrait l'omniscience, que nul être fini n'a : l'impossibilité est de droit |
    | l'expérience donne pourtant des recettes du bien-être | « conseils empiriques » | elles valent en général, jamais avec certitude : elles conseillent, sans commander |

    ! Le texte ne demande pas s'il faut {red}renoncer au bonheur{/red}, mais si le bonheur peut {green}commander{/green}. Kant le réintroduira plus tard, à une autre place (voir le prolongement).
