- id: kant-bonheur-prudence-i2
  title: "L'impératif, hypothétique et catégorique"
  notes: |-
    Kant définit l'impératif ainsi : « La représentation d'un principe objectif, en tant
    qu'il est contraignant pour une volonté, se nomme un commandement (de la raison), et
    la formule du commandement se nomme un impératif. » (AK IV, 412-413.)

    Pour une volonté purement raisonnable, par exemple divine et omnisciente, la raison
    détermine infailliblement la volonté : un tel être n'a pas besoin d'impératif, il agit
    de lui-même conformément à la raison. Mais pour un être raisonnable et pourtant fini,
    comme l'homme, la volonté reste aussi soumise à des mobiles subjectifs venus de la
    sensibilité, qui ne s'accordent pas toujours avec ce que la raison reconnaît comme
    nécessaire : c'est pourquoi il lui faut un impératif, une contrainte représentée comme
    telle.

    Kant distingue alors plusieurs impératifs hypothétiques (qui commandent un moyen en
    vue d'une fin), tous étrangers à l'impératif catégorique (moral, inconditionné). Les
    règles de l'habileté visent une fin arbitraire, que chacun peut ne pas se donner :
    vouloir devenir sportif de haut niveau ne vaut que pour qui se donne cette fin. Les
    conseils de la prudence, eux, visent le bonheur, fin que tout être raisonnable et fini
    possède nécessairement. Notre extrait porte tout entier sur cette seconde espèce.

    |            | Habileté                 | Prudence           | Catégorique         |
    | Fin        | arbitraire (ex. sportif) | le bonheur          | le devoir lui-même  |
    | Universel ?| non                      | non (notre texte)   | oui                 |

    ! Ne pas confondre l'impératif de la prudence, hypothétique, avec l'impératif
    catégorique, moral : notre texte démontre justement que le premier ne peut jamais
    s'ériger en second.
  passage:
    label: "Introduction"
  points:
  - id: kant-bonheur-prudence-i2-1
    sentence: "Kant définit l'impératif ainsi : la formule d'un commandement de la raison, contraignant pour une volonté, est ce qu'on appelle un ___."
    answer: "impératif"
