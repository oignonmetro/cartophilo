- id: kant-bonheur-prudence-p1
  title: "Le concept indéterminé du bonheur"
  notes: |-
    Ce premier moment énonce la **majeure** du syllogisme construit par Kant : le concept
    de bonheur est si indéterminé que personne ne peut dire, en termes précis et
    cohérents, ce qu'il désire et veut véritablement pour l'atteindre.

    Dès la première phrase, Kant noue la contradiction entre le désir d'être heureux et
    l'impossibilité de savoir en quoi ce désir consiste. La seconde phrase, introduite par
    « La raison en est que », l'explique : tous les éléments du concept de bonheur sont
    empiriques, tirés de l'expérience, alors que l'*idée* de bonheur exige un tout absolu,
    un maximum de bien-être dans le présent et dans tout l'avenir. Or un absolu ne peut,
    par définition, se trouver parmi les phénomènes de l'expérience. D'un côté la
    multiplicité non ordonnée des faits empiriques, de l'autre une totalité absolue : le
    concept glisse vers l'idée, et il devient nécessaire que l'idée de bonheur et sa
    réalisation ne se rencontrent jamais.

    Kant choisit ici le mot *concept*, et non *idée* : le concept est nécessairement
    concept de l'entendement, tandis que l'idée, depuis la *Critique de la raison pure*,
    a pour caractéristique d'être totale, totalisante.

    ! Ce premier moment n'établit encore qu'une impossibilité de fait, non de droit :
    Kant l'élèvera en impossibilité *a priori* dans le deuxième moment, qui suit.
  passage:
    label: "Premier moment"
    text: "Le concept du bonheur est un concept si indéterminé, que, malgré le désir qu'a tout homme d'arriver à être heureux, personne ne peut jamais dire en termes précis et cohérents ce que véritablement il désire et il veut. La raison en est que tous les éléments qui font partie du concept du bonheur sont dans leur ensemble empiriques, c'est-à-dire qu'ils doivent être empruntés à l'expérience, et que cependant pour l'idée du bonheur un tout absolu, un maximum de bien-être (Wohl) dans mon état présent et dans toute ma condition future, est nécessaire."
