- id: kant-bonheur-prudence-p3
  title: "Des conseils, non des commandements"
  notes: |-
    **La conclusion tire le statut des impératifs de la prudence :** {red}**ils ne commandent en rien**{/red}**, ce sont des** {amber}**conseils**{/amber}.

    ? **Impératif de la prudence** : l'impératif hypothétique qui prescrit les moyens du bonheur, fin que tout être fini poursuit ; il a la forme « si tu veux être heureux, fais ceci ».

    **Pourquoi « Il suit de là » ?** La formule ouvre le dernier moment : Kant a établi que personne ne peut déterminer ce qui rend heureux ; il en tire {coral}ce que valent les impératifs qui prétendent y mener{/coral}.

    **Pourquoi « à parler exactement » ?** Dans l'usage, on les appelle impératifs, et Kant lui-même vient de le faire. {amber}En toute rigueur{/amber}, le mot ne leur convient pas, puisqu'un impératif commande et qu'eux ne commandent pas.

    **Que veut dire « commander » ?** Kant le définit dans la phrase même : {teal}« représenter des actions d'une manière objective comme pratiquement nécessaires »{/teal}. Trois exigences : {amber}objective{/amber}, valable pour tout être raisonnable, et non selon mon goût ; {amber}pratique{/amber}, portant sur l'action ; {amber}nécessaire{/amber}, et non seulement utile. {coral}Le conseil de prudence manque la nécessité, puisque ses moyens sont incertains, et l'objectivité, puisque son contenu varie d'un homme à l'autre.{/coral}

    **Pourquoi le latin, *consilia* et *praecepta* ?** Kant fixe la distinction dans les termes reçus de l'école : le {violet}conseil{/violet} (*consilium*) laisse juge celui qui le reçoit ; le {violet}précepte{/violet} (*praeceptum*) oblige. {coral}La prudence est ainsi vidée de sa prétention à commander{/coral}, que lui prêtaient les morales qui y voyaient la vertu par excellence.

    ! Le conseil garde {green}la forme hypothétique{/green} d'un impératif (« si tu veux…, fais… ») : ce qui lui est refusé, c'est {red}la nécessité{/red}, non la forme.
  passage:
    label: "Troisième moment"
    part: "3. La conclusion : un idéal de l'imagination"
    text: "Il suit de là que les impératifs de la prudence, à parler exactement, ne peuvent commander en rien, c'est-à-dire représenter des actions d'une manière objective comme pratiquement nécessaires, qu'il faut les tenir plutôt pour des conseils (consilia) que pour des commandements (praecepta) de la raison ;"
  points:
