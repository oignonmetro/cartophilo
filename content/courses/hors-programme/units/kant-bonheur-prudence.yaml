- id: kant-bonheur-prudence-p2c
  title: "La longue vie et la santé"
  notes: |-
    **Même les biens les plus élémentaires, la vie et la santé,** {red}**ne sont pas des moyens sûrs**{/red} **du bonheur.**

    **Pourquoi « du moins » ?** Les exemples suivent une {amber}gradation descendante{/amber} : de biens dont on pourrait se passer (la richesse, le savoir) aux biens qui semblent la condition de tous les autres (vivre, et vivre en bonne santé). {coral}Si même le minimum n'est pas sûr, rien ne l'est.{/coral}

    **Pourquoi la longue vie ?** {yellow}« Qui lui répond que ce ne serait pas une longue souffrance ? »{/yellow} La question est rhétorique : personne ne peut s'en porter garant. La durée multiplie le bonheur comme le malheur ; elle n'est un bien que selon ce qu'elle contient, qu'on ignore d'avance.

    **Pourquoi la santé ?** C'est l'exemple le plus paradoxal : {yellow}une indisposition a souvent détourné d'excès où une santé parfaite aurait fait tomber{/yellow}. Un mal a produit un bien, un bien aurait produit un mal. {coral}La valeur d'une chose pour le bonheur ne tient donc pas à elle, mais à toute la série de ses suites.{/coral} C'est exactement ce qui conduira à l'omniscience.

    **Pourquoi « etc. » ?** La liste reste ouverte, et elle doit l'être : les éléments du bonheur, empiriques, {red}ne se laissent pas énumérer{/red}.

    | Ce qu'il veut | Ce qui peut s'ensuivre |
    | la richesse | soucis, envie, pièges |
    | la connaissance | des maux inévitables vus plus terriblement, ou des besoins accrus |
    | une longue vie | une longue souffrance |
    | la santé | les excès qu'une indisposition aurait évités |

    ! Kant ne fait pas l'éloge de la maladie : il montre que {red}rien n'est bon pour le bonheur en soi{/red}, et que {green}tout dépend de conséquences qu'on ne connaît pas{/green}.
