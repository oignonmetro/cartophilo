- id: kant-bonheur-prudence-p2d
  title: "Il lui faudrait l'omniscience"
  notes: |-
    **Le résumé des exemples nomme ce qui manquerait :** {coral}**l'omniscience**{/coral}. **C'est le pivot du texte : par elle, l'impossibilité de fait devient une impossibilité de droit.**

    ? **Omniscience** : la science de toutes choses, y compris de toutes les suites futures de chaque acte ; elle n'appartient qu'à l'être infini.

    **Pourquoi « Bref » ?** Le mot ramasse les exemples en une seule thèse : l'être fini {red}est incapable de déterminer ce qui le rendrait heureux{/red}. Les exemples montraient des cas ; « bref » en tire la règle.

    **Pourquoi « avec une entière certitude » et « d'après quelque principe » ?** Ce sont les deux exigences d'un commandement. La {amber}certitude{/amber} : un commandement présente une action comme nécessaire, non comme probable. Le {amber}principe{/amber} : on ne demande pas qu'il tombe par chance sur ce qui le rend heureux, mais qu'il le détermine d'après une règle.

    **Pourquoi l'omniscience ?** Les exemples ont montré que la valeur d'un moyen dépend de la série de ses suites. Pour savoir avec certitude ce qui rendrait heureux, {coral}il faudrait connaître toutes les suites de toutes ses actions, dans tout l'avenir{/coral} : savoir tout. Or {amber}un être fini est par définition non omniscient{/amber}. {coral}L'impossibilité ne tient donc plus à l'état présent de notre savoir, mais à notre condition : elle est de droit.{/coral} C'est pourquoi la mention, placée à la toute fin de la phrase, change la portée de tout ce qui précède.

    **Ce que l'argument reprend.** Kant a déjà opposé l'être purement raisonnable, que la raison détermine infailliblement, à l'être fini, soumis à la sensibilité. Il l'avait même dit au début des {sky}*Fondements*{/sky} ({sky}première section{/sky}) : si la nature n'avait visé que notre bonheur, elle l'aurait mieux confié à {yellow}l'instinct{/yellow} qu'à la raison. {coral}La raison n'est pas faite pour servir d'auxiliaire au désir d'être heureux.{/coral}

    ! « Impossibilité de droit » ne veut pas dire qu'on ne sera {red}jamais heureux{/red} : on ne pourra jamais {green}savoir d'avance, avec certitude{/green}, ce qui rend heureux. Aucun progrès du savoir n'y changera rien.
  passage:
    label: "Deuxième moment"
    part: "2. La mineure : tout être fini"
    text: "Bref, il est incapable de déterminer avec une entière certitude d'après quelque principe ce qui le rendrait véritablement heureux : pour cela, il lui faudrait l'omniscience."
  points:
