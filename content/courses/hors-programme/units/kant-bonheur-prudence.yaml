    sentence: "« Il suit de là que ___, c'est-à-dire représenter des actions d'une manière objective comme pratiquement nécessaires, qu'il faut les tenir plutôt pour des conseils (consilia) que pour des commandements (praecepta) de la raison ; »"
    answer: "les impératifs de la prudence, à parler exactement, ne peuvent commander en rien"
    alt: []
