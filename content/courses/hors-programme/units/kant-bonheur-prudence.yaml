- id: kant-bonheur-prudence-ouverture
  title: "La conscience morale commune"
  notes: |-
    Au tout début des *Fondements*, avant même d'entamer la démonstration de notre
    extrait, Kant était déjà parti de ce même point : la conscience morale commune n'a
    besoin d'aucune science pour juger, infailliblement, du bien et du mal. C'est ce
    passage, tiré de la Première section (AK IV, 404), que Kant résume à la fin de cette
    même section.

    La méthode que Kant y prête à la raison humaine commune est explicitement socratique :
    il ne s'agit pas de lui apprendre quoi que ce soit de nouveau, mais de la rendre
    attentive à un principe qu'elle possède déjà. C'est très exactement la tâche que Kant
    mène à bien dans notre extrait, par la négative : en réfutant l'eudémonisme, il ne fait
    que rendre attentive la raison à son propre principe, contre une confusion qui l'avait
    brouillé.

    Cette confiance dans la conscience morale commune n'empêche pas Kant de reconnaître
    que la recherche du bonheur reste un fait, quoique non apodictique : rien n'empêche
    un être humain d'y renoncer ou de la sacrifier, si les moyens pour l'atteindre en
    viennent à rendre incertaine la fin elle-même. Aussi, si le bonheur ne peut pas être
    le principe de la volonté morale, Kant le réintroduira plus tard, non plus comme
    fondement mais comme visée seconde de cette volonté : un bonheur proportionné à la
    vertu.

    ! Cette confiance dans la conscience morale commune n'a rien d'un relativisme : elle
    suppose au contraire un principe unique et universel, que la philosophie a seulement
    pour tâche d'expliciter, non d'inventer.
  passage:
    label: "Ouverture"
    text: "[La raison humaine commune] a dans tous les cas qui surviennent la pleine compétence qu'il faut pour distinguer ce qui est bien, ce qui est mal, ce qui est conforme ou contraire au devoir, pourvu que, sans lui rien apprendre le moins du monde de nouveau, on la rende attentive, comme le faisait Socrate, à son propre principe, de montrer par suite qu'il n'est besoin ni de science ni de philosophie pour savoir ce qu'on a à faire, pour être honnête et bon, même sage et vertueux."
