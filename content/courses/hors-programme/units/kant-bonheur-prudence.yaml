- id: kant-bonheur-prudence-o1
  title: "Ce que le texte établit pour la morale"
  notes: |-
    **Le texte est négatif, mais il ouvre la voie de toute la morale kantienne :** {coral}**puisque le bonheur ne peut pas commander, le principe de la moralité doit être cherché ailleurs que dans une fin**{/coral}.

    **Une morale formelle.** Si toute fin qu'on se propose est, comme le bonheur, tirée de l'expérience, aucune ne peut fonder une loi nécessaire et universelle. {amber}Il ne reste que la forme de la loi elle-même{/amber} : l'{violet}impératif catégorique{/violet}, qui commande d'agir selon une maxime qu'on puisse vouloir voir devenir une loi universelle {sky}(AK IV, 421){/sky}. Il ne pose {red}aucune condition{/red}, aucun « si tu veux être heureux » : c'est précisément ce que l'analyse du bonheur rendait nécessaire. {coral}La confusion entre un idéal de l'imagination et un idéal de la raison une fois défaite, le véritable impératif moral peut trouver sa formule.{/coral}

    **Un fait, non une nécessité.** Que tous désirent le bonheur est {amber}un fait{/amber}, mais non un fait {violet}apodictique{/violet} (nécessaire) : {yellow}un homme peut renoncer à son bonheur ou le sacrifier{/yellow}, au devoir par exemple, et c'est même là que la moralité se montre. Le désir de bonheur ne règle donc pas la volonté de l'intérieur.

    **Le bonheur à sa place.** Kant ne chasse pas le bonheur de la vie morale : il le déplace. Dans la {sky}*Critique de la raison pratique*{/sky} (Dialectique), le {violet}souverain bien{/violet} réunit la vertu et {green}un bonheur proportionné à la vertu{/green}. Le bonheur n'est plus le principe de la loi, mais ce qu'on peut espérer quand on la suit : la morale n'est pas la doctrine qui enseigne comment se rendre heureux, mais comment se rendre {amber}digne du bonheur{/amber}.

    **Pour l'anthropologie.** Le texte décrit l'homme comme {violet}être fini{/violet}, partagé entre une raison qui exige la totalité et une sensibilité qui ne lui offre que des fragments. {coral}Le malheur de l'homme n'est pas d'abord de manquer de biens, mais de ne pas savoir ce qu'il veut en les voulant.{/coral}

    ! Kant ne prêche pas {red}le renoncement au bonheur{/red} : il refuse qu'il soit {green}le fondement{/green} de la morale, et lui garde une place dans son {green}prolongement{/green}.
  passage:
    label: "Prolongement"
  points:
  - id: kant-bonheur-prudence-ouverture-5
    sentence: "Que le bonheur soit désiré par tous est **un fait**, __mais non un fait ___,__ puisqu'un homme peut y renoncer ou le sacrifier."
    answer: "apodictique"
    alt: []
  - id: kant-bonheur-prudence-ouverture-6
    sentence: "Dans le **souverain bien**, Kant réintroduit le bonheur, __non comme principe de la loi, mais comme bonheur proportionné à la ___.__"
    answer: "vertu"
    alt: []
  - id: kant-bonheur-prudence-o1-x1
