- id: kant-bonheur-prudence-p2
  title: "Même l'être fini le plus perspicace"
  notes: |-
    **La mineure étend l'impossibilité de l'homme à** {violet}**tout être fini**{/violet}, **même le mieux doué qu'on puisse supposer.**

    ? **Être fini** : un être raisonnable dont la raison est liée à une {amber}sensibilité{/amber} : il est affecté par des inclinations, et ne connaît que ce que l'expérience lui donne. Il s'oppose à l'être infini, Dieu, dont la volonté est sainte et qui connaît toutes choses.

    **Pourquoi « Or » ?** Le mot ouvre la {violet}mineure{/violet} du syllogisme. Et il change de sujet : la majeure parlait de {teal}« tout homme »{/teal}, constat presque anthropologique ; la mineure parle d'{teal}« un être fini »{/teal}, c'est-à-dire d'une classe définie par sa condition. {coral}Ce qui valait de l'homme en fait va valoir de tout être fini par définition.{/coral}

    **Pourquoi « si perspicace et en même temps si puissant qu'on le suppose » ?** On pourrait croire que l'échec vient d'un défaut de {amber}perspicacité{/amber} (on prévoit mal les suites de ses choix) ou de {amber}puissance{/amber} (on n'a pas les moyens de ce qu'on choisit). Kant accorde l'une et l'autre au plus haut degré, sans aller jusqu'à l'infini : l'argument est *a fortiori*. Si même cet être-là ne peut pas savoir ce qu'il veut, {coral}aucun être fini ne le peut, et l'impossibilité n'est pas affaire de degré.{/coral} {yellow}Un roi très savant, qui peut tout s'offrir, n'en sait pas davantage ce qui le rendra heureux.{/yellow}

    **Pourquoi « ici véritablement » ?** « Ici » : en matière de bonheur, et non pour une fin particulière, où l'on sait fort bien ce qu'on veut. « Véritablement » : il peut {red}croire{/red} le savoir, prendre la richesse pour le bonheur ; il ne le sait pas {green}en vérité{/green}. Les exemples qui suivent montrent cet écart.

    ! L'impossibilité ne tient pas à la {red}sottise{/red} ou à la {red}faiblesse{/red} de certains hommes : elle vaut {green}dans le meilleur des cas{/green}.
