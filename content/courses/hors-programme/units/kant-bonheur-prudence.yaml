    answer: "digne"
    alt: ["dignes"]
  - id: kant-bonheur-prudence-o1-x2
    sentence: "Puisqu'aucune fin empirique ne peut fonder une loi, **l'impératif moral** __ne pose aucune ___,__ aucun « si tu veux être heureux »."
    answer: "condition"
    alt: []
- id: kant-bonheur-prudence-o2
  title: "Contre la prudence des Anciens"
  notes: |-
    **Le texte s'inscrit dans un débat avec les morales antiques, qui faisaient du bonheur la fin de la vie bonne et de la prudence la vertu qui y conduit :** {sky}**Aristote**{/sky} **est le premier visé.**

    **Le bonheur comme fin dernière.** Pour {sky}Aristote{/sky}, le bonheur (`eudaimonia`) est {green}la fin dernière{/green}, voulue pour elle-même et en vue de laquelle on veut tout le reste ({sky}*Éthique à Nicomaque*, I, 1 et I, 7{/sky}). Kant l'accorde : le bonheur est bien la fin que tous poursuivent. Il conteste qu'on puisse {red}en tirer une règle{/red}.

    **Deux prudences.** Chez Aristote, la {violet}prudence{/violet} (`phronèsis`) est {amber}une vertu{/amber} : la capacité de délibérer correctement sur ce qui est bon pour soi en vue de {yellow}vivre bien en général{/yellow} ({sky}*Éthique à Nicomaque*, VI, 5{/sky}). Elle appartient à la vie morale. Chez Kant, la prudence (*Klugheit*) n'est plus qu'{red}une habileté à choisir les moyens de son bien-être{/red} : elle sort de la morale, et ses règles ne sont que des conseils. {coral}Ce qui était chez Aristote le cœur de la vertu devient chez Kant un savoir-faire étranger au devoir.{/coral}

    **L'imprécision, reconnue des deux côtés.** Aristote admettait déjà qu'en éthique {amber}on ne doit chercher que la précision que comporte le sujet{/amber} ({sky}*Éthique à Nicomaque*, I, 3{/sky}) : des vérités qui valent « le plus souvent ». Kant fait le même constat, mais en tire la conclusion inverse : {coral}ce qui ne vaut que le plus souvent ne peut pas fonder la morale{/coral}, qui exige la nécessité.

    **Le calcul des plaisirs.** {sky}Épicure{/sky} demandait de choisir entre les plaisirs en les mesurant à leurs suites, d'en refuser certains pour les peines qu'ils entraînent ({sky}*Lettre à Ménécée*{/sky}). Les exemples de Kant ruinent ce calcul : {red}les suites d'un plaisir ou d'une peine forment une série qu'on ne peut pas parcourir{/red}, et {yellow}la maladie qui protège des excès{/yellow} montre qu'on ne sait jamais d'avance où est le gain.

    ! Kant ne reproche pas aux Anciens d'avoir {red}aimé le bonheur{/red}, mais d'avoir pris un idéal de l'imagination pour {green}un principe de la raison{/green}.
  passage:
    label: "Prolongement"
  points:
  - id: kant-bonheur-prudence-o2-x1
    sentence: "Pour Aristote, le bonheur, `eudaimonia`, est __la fin ___,__ voulue pour elle-même et en vue de laquelle on veut tout le reste."
    answer: "dernière"
    alt: []
  - id: kant-bonheur-prudence-o2-x2
    sentence: "Chez Aristote, la prudence, `phronèsis`, est __une ___,__ partie de la vie morale ; chez Kant, une habileté étrangère au devoir."
    answer: "vertu"
    alt: []
