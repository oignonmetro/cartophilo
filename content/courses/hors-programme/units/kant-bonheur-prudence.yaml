- id: kant-bonheur-prudence-p3
  title: "Un problème tout à fait insoluble"
  notes: |-
    Kant a démontré la thèse énoncée dans la première phrase de notre extrait. Reste à en
    tirer les conséquences (« il suit de là ») : c'est la **conclusion** du syllogisme, qui
    porte sur le statut même d'un impératif de la prudence.

    Puisque les impératifs de la prudence ne peuvent pas représenter des actions comme
    objectivement et pratiquement nécessaires, il faut les tenir pour de simples conseils
    (*consilia*), non pour des commandements (*praecepta*) de la raison : le problème de
    déterminer sûrement quelle action favorise le bonheur est un problème tout à fait
    insoluble. Dire qu'un problème est insoluble, précise le commentaire, revient ici à
    dire que c'est un faux problème : sa résolution n'attend pas d'être trouvée, puisqu'elle
    serait de toute façon impossible. Ce problème n'est en fait pas un problème *de* la
    raison, pas même une tâche pour elle.

    D'où la conclusion finale : le bonheur n'est pas un idéal de la raison mais de
    l'**imagination**, seule capable de se représenter comme réalisable une action qui
    atteindrait la totalité, en réalité infinie, de ses conséquences. Fondé uniquement sur
    des principes empiriques, il ne peut avoir aucune réalité pratique : voilà pourquoi
    aucun impératif ne peut, au sens strict, commander de faire ce qui rend heureux.

    ! Ne pas lire cette conclusion comme un simple renoncement : Kant ne dit pas qu'il ne
    faut pas rechercher le bonheur, mais seulement qu'aucune loi rationnelle ne peut nous
    dire comment l'atteindre à coup sûr.
