- id: kant-bonheur-prudence-p3c
  title: "Un idéal, non de la raison, mais de l'imagination"
  notes: |-
    **Kant nomme enfin la cause de tout le texte :** {violet}**le bonheur est un idéal**{/violet}**,** {red}**non de la raison**{/red}**,** {green}**mais de l'imagination**{/green}.

    **Pourquoi « donc » ?** Il conclut le problème insoluble : faute de solution, {red}pas d'impératif{/red} qui commande, {teal}« au sens strict du mot »{/teal}, de faire ce qui rend heureux. Le « au sens strict » répond au « à parler exactement » du début de la phrase : il y a des conseils, au sens large ; il n'y a pas d'impératif, au sens strict.

    ? **Idéal** : chez Kant, une idée représentée non seulement *in concreto* mais *in individuo*, comme une chose singulière parfaite ({sky}*Critique de la raison pure*, « De l'idéal en général »{/sky}). Un {violet}idéal de la raison{/violet}, {yellow}le sage des stoïciens{/yellow}, est déterminé par une idée et sert de modèle à l'action ; un {violet}idéal de l'imagination{/violet} est une image composée d'éléments d'expérience, sans règle qui la détermine.

    **Pourquoi « idéal » après « concept » et « idée » ?** Le texte a parlé du {amber}concept{/amber} du bonheur (qu'on ne peut pas déterminer), puis de son {amber}idée{/amber} (un tout absolu), et maintenant de son {amber}idéal{/amber}. Le mot garde ce que le bonheur a de visé, d'une perfection qu'on se représente et vers laquelle on tend ; mais il le retire du champ de la connaissance.

    **Pourquoi « de l'imagination » ?** Parce que c'est elle qui {amber}compose, à partir des plaisirs éprouvés, l'image d'une satisfaction complète{/amber}, et qui se la représente comme accessible par telle action : {yellow}je m'imagine heureux une fois riche{/yellow}. La raison, elle, ne peut que penser le contraire : que cette totalité ne se trouve pas dans l'expérience. {coral}Prendre cet idéal de l'imagination pour un idéal de la raison, c'est l'erreur même de l'eudémonisme{/coral}, et la « dialectique naturelle » qui fait plier le devoir devant le bonheur.

    ! « Idéal de l'imagination » ne veut pas dire que le bonheur est {red}une illusion{/red} ou {red}un mal{/red} : il est réellement visé par tous ; il ne peut pas {green}fonder une loi{/green}.
  passage:
    label: "Troisième moment"
    part: "3. La conclusion : un idéal de l'imagination"
    text: "il n'y a donc pas à cet égard d'impératif qui puisse commander, au sens strict du mot, de faire ce qui rend heureux, parce que le bonheur est un idéal, non de la raison, mais de l'imagination,"
