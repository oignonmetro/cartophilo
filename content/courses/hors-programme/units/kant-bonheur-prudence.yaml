- id: kant-bonheur-prudence-p2b
  title: "La richesse et la connaissance"
  notes: |-
    **Chaque bien qu'on prend pour le bonheur peut** {red}**se retourner contre lui**{/red} **: les deux premiers exemples le montrent de la richesse et du savoir.**

    **Pourquoi ces exemples ?** Ils ne sont pas pris au hasard : ce sont les {amber}lieux communs{/amber} du bonheur, ce que chacun met d'abord sous ce mot. Et tous sont construits sur le même verbe, {teal}« Veut-il »{/teal} (*wollen*). Derrière chaque « veut-il la richesse ? » se cache une condition non écrite : {amber}« s'il veut être heureux »{/amber}. On veut la richesse {coral}comme moyen{/coral}, parce qu'on croit qu'elle rendra heureux ; faute de savoir ce qu'est le bonheur, on en cherche de faux synonymes.

    **Pourquoi la richesse échoue-t-elle ?** Elle apporte avec elle {yellow}des soucis (il faut la garder), l'envie (des autres, qui la convoitent) et des pièges (ceux qu'on tend au riche){/yellow}. Le moyen choisi produit {red}le contraire de sa fin{/red}.

    **Pourquoi la connaissance échoue-t-elle ?** De deux façons. Soit elle donne {yellow}un regard plus pénétrant sur des maux inévitables{/yellow}, qu'on ne voyait pas et qu'on verra venir d'autant plus terriblement ; soit elle {yellow}multiplie les besoins{/yellow} d'un désir déjà difficile à contenter. L'exemple est le plus fort : {coral}même le bien propre de la raison, le savoir, n'est pas un moyen sûr du bonheur.{/coral} Il prépare la fin de la phrase : seul un savoir total, l'omniscience, suffirait.

    **Pourquoi « ne peut-il pas » et « peut-être » ?** Kant n'affirme pas que la richesse rend malheureux, ni que le savoir désespère : il dit que {amber}rien ne garantit le contraire{/amber}. C'est l'incertitude des suites, non une loi inverse, qui ruine le moyen.

    ! Les exemples ne sont pas {red}de simples illustrations{/red} : faute de définition claire du bonheur, il ne reste que des désirs variables et des moyens incertains, et les exemples sont {green}la seule forme que puisse prendre la preuve{/green}.
  passage:
    label: "Deuxième moment"
    part: "2. La mineure : tout être fini"
    text: "Veut-il la richesse ? Que de soucis, que d'envie, que de pièges ne peut-il pas par-là attirer sur sa tête ! Veut-il beaucoup de connaissance et de lumières ? Peut-être cela ne fera-t-il que lui donner un regard plus pénétrant pour lui représenter d'une manière d'autant plus terrible les maux qui jusqu'à présent se dérobent à sa vue et qui sont pourtant inévitables, ou bien que charger de plus de besoins encore ses désirs qu'il a déjà bien assez de peine à satisfaire."
