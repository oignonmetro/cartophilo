    answer: "représenter des actions d'une manière objective comme pratiquement nécessaires"
    alt: []
  - id: kant-bonheur-prudence-p3-3
    sentence: "« Il suit de là que les impératifs de la prudence, à parler exactement, ne peuvent commander en rien, c'est-à-dire représenter des actions d'une manière objective comme pratiquement nécessaires, qu'il faut les tenir plutôt pour ___ que pour ___ de la raison ; »"
    answer: "des conseils (consilia) ; des commandements (praecepta)"
