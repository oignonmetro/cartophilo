- id: kant-bonheur-prudence-ouverture
  title: "La conscience morale commune"
  notes: |-
    **Kant part, dès la première section des** {sky}*Fondements*{/sky}**, de ce que le texte suppose :** {green}la raison humaine commune n'a besoin d'aucune science pour juger du bien et du mal{/green} {sky}(AK IV, 404){/sky}.

    **Pourquoi « comme le faisait Socrate » ?** La méthode que Kant prête à la philosophie est {amber}socratique{/amber} : ne rien apprendre de nouveau à la raison commune, mais la rendre attentive à un principe qu'elle possède déjà. C'est ce que fait notre extrait, par la négative : {coral}en montrant que le bonheur ne peut pas commander, il écarte une confusion qui brouillait ce principe{/coral}, sans rien ajouter à la conscience morale.

    **Pourquoi « ni de science ni de philosophie » ?** Parce que la loi morale ne dépend d'aucun savoir sur le monde, au contraire du bonheur, qui en exigerait un infini. {coral}Savoir ce qu'on doit faire est à la portée de tous ; savoir ce qui rendra heureux ne l'est de personne.{/coral} Le contraste éclaire le texte : l'omniscience qu'il faudrait pour le bonheur, la moralité n'en a nul besoin.

    ! Cette confiance dans la conscience commune n'a rien d'un {red}relativisme{/red} : elle suppose {green}un principe unique et universel{/green}, que la philosophie a seulement à expliciter.
  passage:
    label: "Ouverture"
    source: "Fondements de la métaphysique des mœurs, Première section, AK IV, 404"
    text: "[La raison humaine commune] a dans tous les cas qui surviennent la pleine compétence qu'il faut pour distinguer ce qui est bien, ce qui est mal, ce qui est conforme ou contraire au devoir, pourvu que, sans lui rien apprendre le moins du monde de nouveau, on la rende attentive, comme le faisait Socrate, à son propre principe, de montrer par suite qu'il n'est besoin ni de science ni de philosophie pour savoir ce qu'on a à faire, pour être honnête et bon, même sage et vertueux."
  points:
  - id: kant-bonheur-prudence-ouverture-1
    sentence: "« [La raison humaine commune] a dans tous les cas qui surviennent ___, pourvu que, sans lui rien apprendre le moins du monde de nouveau, on la rende attentive, comme le faisait Socrate, à son propre principe, de montrer par suite qu'il n'est besoin ni de science ni de philosophie pour savoir ce qu'on a à faire, pour être honnête et bon, même sage et vertueux. »"
    answer: "la pleine compétence qu'il faut pour distinguer ce qui est bien, ce qui est mal, ce qui est conforme ou contraire au devoir"
    alt: []
