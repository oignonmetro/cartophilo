# Unité de texte (voir content/textes.md) : Kant, Fondements de la
# métaphysique des mœurs, Deuxième section (« Passage de la philosophie
# morale populaire à la Métaphysique des mœurs »), AK IV, 418-419, trad.
# V. Delbos, Delagrave, 1999, p. 131-132. Commentaire : un commentaire
# anonyme du même extrait (scan agrégation, p. 242-258), qui lit le texte
# comme un syllogisme en trois moments.
# Refondue le 2026-11-26 (niveau normale) : une leçon par phrase ou segment
# (p1, p1b, p2, p2b…), trois leçons d'introduction, deux de prolongement ;
# les cartes-citation gardent leurs identifiants, recentrées sur leur
# segment ; les cartes-explication sont nouvelles (-x…), sauf celles des
# introductions et de l'ouverture, reprises.

id: kant-bonheur-prudence
title: "Le bonheur ne peut pas commander (1785)"
subtitle: "Fondements de la métaphysique des mœurs, II, AK IV, 418-419"
icon: page
color: yellow
group: "Kant : la morale"
depth: normale
intro: |-
  Un extrait des *Fondements de la métaphysique des mœurs* où Kant montre que le bonheur ne peut fournir aucune règle qui commande l'action : non que personne ne le désire, mais parce qu'aucun être fini ne peut savoir, en termes précis et cohérents, ce qui le rendrait véritablement heureux. Les impératifs de la prudence ne sont donc que des conseils, et le bonheur un idéal de l'imagination.
lessons:
- id: kant-bonheur-prudence-i1
  title: "Le texte, sa place et son plan"
  notes: |-
    **Le texte est tiré de la deuxième section des** {sky}*Fondements de la métaphysique des mœurs*{/sky} **(1785), intitulée** {teal}« Passage de la philosophie morale populaire à la Métaphysique des mœurs »{/teal}. Il est cité dans la traduction de Victor Delbos. Kant y cherche la formule du principe suprême de la moralité, l'{violet}impératif catégorique{/violet}. Il ne prétend pas inventer une morale nouvelle : il veut {amber}rendre la raison attentive à son propre principe{/amber}, que la {violet}conscience morale commune{/violet} applique déjà sans savoir le formuler.

    **Pourquoi, dans cette recherche, un texte sur le bonheur ?** Parce que la conscience commune se heurte à une opinion aussi commune qu'elle : nos actions vertueuses devraient être intéressées, au plus haut point, par la poursuite du bonheur. Kant ne nie pas la force de cette pente : l'homme sent en lui, face aux commandements du devoir, {teal}« un puissant contrepoids qui réside dans ses besoins et dans ses inclinations »{/teal} {sky}(AK IV, 405){/sky}, dont il résume la satisfaction complète sous le nom de bonheur. La raison a même un penchant à plier les lois strictes du devoir à ces inclinations : c'est la {violet}« dialectique naturelle »{/violet} de la raison. Sa forme savante est l'{red}eudémonisme{/red} (du grec `eudaimonia`, bonheur), qui place le bonheur au fondement de la moralité. **Le texte le prive de ce fondement :** {coral}le bonheur ne doit pas commander nos actions, et surtout il ne le peut pas{/coral}.

    **Le plan.** {amber}Les deux premières phrases posent la thèse et sa raison{/amber} ; {amber}la phrase ouverte par « Or » l'étend à tout être fini{/amber}, l'illustre de quatre exemples et la fonde sur le défaut d'omniscience ; {amber}la conclusion ouverte par « Il suit de là »{/amber} en tire le statut des impératifs de la prudence. Le texte a la forme d'un {violet}syllogisme{/violet} : une majeure, une mineure, une conclusion.

    | Mouvement | Lieu | Ce qui s'y joue |
    | poser l'indétermination du concept de bonheur, puis en donner la raison | Premier moment | Personne ne peut dire ce qu'il veut en voulant être heureux, parce que les éléments du bonheur sont empiriques alors que son idée exige un tout absolu. |
    | étendre l'impossibilité à tout être fini par quatre exemples, puis la fonder sur le défaut d'omniscience | Deuxième moment | Même l'être fini le plus perspicace et le plus puissant ne peut savoir ce qui le rendrait heureux, car il faudrait tout savoir ; on n'agit donc que d'après des conseils empiriques. |
    | tirer le statut des impératifs de la prudence, puis nommer la cause de l'erreur | Troisième moment | Ces impératifs conseillent sans commander, parce que le bonheur est un idéal de l'imagination fondé sur l'expérience, non un principe de la raison. |

    ! Kant ne nie à aucun moment que nous désirions tous être heureux : c'est un {green}fait{/green}. Il conteste que ce désir puisse {red}fonder ou commander{/red} nos actions.
