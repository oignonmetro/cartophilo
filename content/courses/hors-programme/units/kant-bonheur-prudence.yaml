    sentence: "Chez Kant, un **idéal** est une idée représentée __*in ___*, comme une chose singulière parfaite.__"
    answer: "individuo"
    alt: []
- id: kant-bonheur-prudence-p3d
  title: "Une série de conséquences en réalité infinie"
  notes: |-
    **Le dernier membre explique pourquoi le bonheur relève de l'imagination : fondé sur l'expérience, il exigerait de connaître** {coral}**une série infinie de conséquences**{/coral}.

    **Pourquoi « fondé uniquement sur des principes empiriques » ?** C'est le premier moment repris : les éléments du bonheur sont {amber}empiriques{/amber}. « Uniquement » : rien en lui ne vient de la raison, sinon l'exigence de totalité.

    **Pourquoi « on attendrait vainement » ?** L'expression décrit l'espoir de l'eudémoniste : qu'à force d'expérience on trouve l'action qui rend heureux. {red}Cet espoir est vain par principe{/red}, non faute d'expérience suffisante.

    **Pourquoi « la totalité d'une série de conséquences en réalité infinie » ?** Toute action a des suites, et ces suites en ont d'autres, sans terme assignable. Le bonheur étant {amber}un tout absolu{/amber}, l'action qui y mènerait devrait atteindre {coral}la totalité de cette série{/coral}, et donc la connaître : c'est l'omniscience du deuxième moment. {coral}Une série infinie ne peut pas être totalisée par un être fini.{/coral} L'imagination se la représente pourtant comme achevée : c'est en cela que le bonheur est son idéal.

    **Le texte se referme sur son début.** La dernière proposition redit la première sous une autre forme, et montre qu'elle était démontrée :

    | Premier moment | Troisième moment |
    | des éléments empiriques | des principes empiriques |
    | un tout absolu, un maximum de bien-être | la totalité d'une série de conséquences infinie |
    | personne ne peut dire ce qu'il veut | aucun impératif ne peut commander |

    ! « En réalité infinie » ne veut pas dire {red}très longue{/red} : même avec un temps illimité, un être fini {green}ne parcourrait jamais une série infinie{/green}. L'obstacle n'est pas le temps, c'est la finitude.
  passage:
    label: "Troisième moment"
    part: "3. La conclusion : un idéal de l'imagination"
    text: "fondé uniquement sur des principes empiriques, dont on attendrait vainement qu'ils puissent déterminer une action par laquelle serait atteinte la totalité d'une série de conséquences en réalité infinie."
