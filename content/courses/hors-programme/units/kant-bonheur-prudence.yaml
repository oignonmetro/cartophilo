- id: kant-bonheur-prudence-i2
  title: "Les trois sortes d'impératifs"
  notes: |-
    **Le texte suppose la théorie de l'impératif que Kant vient d'exposer : il porte sur l'une de ses espèces, {violet}l'impératif de la prudence{/violet}.**

    **Pourquoi faut-il des impératifs ?** Kant définit l'impératif ainsi : {teal}« {/teal}La représentation d'un principe objectif, en tant qu'il est {teal}contraignant pour une volonté{/teal}, se nomme un commandement (de la raison), et la formule du commandement se nomme {teal}un impératif. »{/teal} {sky}(AK IV, 412-413.){/sky} Chez un être {yellow}purement raisonnable, une volonté divine par exemple{/yellow}, {green}la raison détermine infailliblement la volonté{/green} : il fait de lui-même ce qui est bon, et n'a besoin d'aucun impératif. Chez un être raisonnable mais fini, comme l'homme, la volonté est soumise aussi à des {red}mobiles venus de la sensibilité{/red}, qui ne s'accordent pas toujours avec la raison : {coral}ce qui est bon se présente alors à lui comme une contrainte{/coral}, un « tu dois ».

    **Les trois espèces.** Un impératif est {violet}hypothétique{/violet} quand il commande un moyen en vue d'une fin (« si tu veux telle chose, fais ceci »), {violet}catégorique{/violet} quand il commande une action pour elle-même, sans condition. Kant distingue deux impératifs hypothétiques selon que la fin est seulement possible ou réelle chez tous.

    | Impératif | Fin visée | Ce qu'il donne |
    | de l'habileté | une fin seulement possible, que chacun peut ne pas se proposer : {yellow}guérir un malade, ou l'empoisonner{/yellow} | des règles ; hypothétique problématique |
    | de la prudence | le bonheur, fin réelle chez tous les êtres raisonnables finis | des conseils ; hypothétique assertorique |
    | de la moralité | aucune fin préalable : l'action est bonne en elle-même | des commandements (lois) ; catégorique, apodictique |

    **Pourquoi ce tableau prépare-t-il le texte ?** Parce que {amber}« qui veut la fin veut aussi les moyens »{/amber} est, dit Kant, une proposition {violet}analytique{/violet} : vouloir la fin, c'est déjà vouloir ce qui y mène. L'impératif de l'habileté commande donc sans difficulté, dès qu'on connaît les moyens. {coral}Celui de la prudence le pourrait aussi, si l'on savait ce qu'est le bonheur{/coral}, puisque sa fin est voulue par tous. Le texte montre justement qu'on ne le sait pas.

    ! La prudence n'est pas la moralité : son impératif reste {red}hypothétique{/red}, même si sa fin est universelle. Le texte établit qu'il ne peut jamais s'ériger en {green}loi{/green}.
