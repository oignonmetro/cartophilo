- id: kant-bonheur-prudence-p1b
  title: "Des éléments empiriques pour un tout absolu"
  notes: |-
    **La deuxième phrase donne la raison de l'indétermination : un écart entre** {coral}**des éléments empiriques**{/coral} **et** {coral}**une idée qui exige un tout absolu**{/coral}.

    ? **Empirique** et {blue}*a priori*{/blue} : est {violet}empirique{/violet} ce qui est tiré de l'expérience, donc particulier et contingent (cela vaut pour ce cas, et aurait pu être autrement) ; est {violet}*a priori*{/violet} ce qui ne dépend pas de l'expérience, et vaut de façon nécessaire et universelle. {yellow}« Ce café me plaît » est empirique ; « 7 + 5 = 12 » est *a priori*.{/yellow}

    **Pourquoi les éléments du bonheur sont-ils tous empiriques ?** Parce que ce qui nous plaît ne se sait qu'en l'éprouvant : {yellow}personne ne sait d'avance s'il aimera la vie de marin ou celle de notaire{/yellow}. Ces éléments varient donc d'un homme à l'autre, et chez le même homme d'un âge à l'autre. {red}Aucun ne se laisse déduire{/red} : ils doivent être {teal}« empruntés à l'expérience »{/teal}.

    ? **Idée** : chez Kant, depuis la {sky}*Critique de la raison pure*{/sky}, un concept de la raison qui pense {amber}une totalité inconditionnée{/amber}, à laquelle aucun objet de l'expérience ne correspond (l'âme, le monde comme tout, Dieu).

    **Pourquoi « un tout absolu, un maximum » ?** Ce qu'on veut sous le nom de bonheur n'est pas tel plaisir, mais {amber}tout le bien-être possible{/amber}, et sans fin : {teal}« dans mon état présent et dans toute ma condition future »{/teal}. Un bonheur qui laisserait une inquiétude, ou qui devrait cesser, ne serait pas le bonheur. Le bonheur est donc pensé comme une idée, une totalité.

    **Pourquoi « et que cependant » ?** Parce que les deux exigences se contredisent. {coral}Des éléments empiriques ne composent jamais un tout absolu{/coral} : l'expérience donne toujours une série finie de cas, et l'on a beau ajouter des plaisirs, on n'obtient jamais un maximum. {coral}L'idée du bonheur et sa réalisation ne peuvent donc pas se rencontrer.{/coral} Le concept est indéterminé parce qu'il tient de deux sources : sa matière vient de l'expérience, sa forme de totalité vient de la raison.

    **Pourquoi « bien-être (Wohl) » ?** Kant précise l'allemand pour fixer ce dont il parle : le bien-être, l'état agréable du sujet, qu'il distingue ailleurs soigneusement {red}du bien{/red} (*das Gute*), objet de la morale ({sky}*Critique de la raison pratique*, Analytique, chap. II{/sky}). Le bonheur est un maximum de {amber}bien-être{/amber}, {red}non de bien{/red}.

    ! L'écart ne vient pas d'un {red}manque de données{/red} : davantage d'expérience ne ferait jamais un tout absolu. C'est un écart {green}de nature{/green}, entre l'expérience et l'idée.
