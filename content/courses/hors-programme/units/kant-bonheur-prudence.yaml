- id: kant-bonheur-prudence-p3b
  title: "Un problème tout à fait insoluble"
  notes: |-
    **Le problème de déterminer quelle action rend heureux est** {red}**tout à fait insoluble**{/red} **: ce n'est pas un problème que la raison pourrait résoudre.**

    **Pourquoi « d'une façon sûre et générale » ?** Ce sont encore les exigences d'un commandement : la {amber}sûreté{/amber} (la certitude, non la probabilité) et la {amber}généralité{/amber} (pour tout être raisonnable, non pour moi seul). Le problème n'est insoluble que posé ainsi : {green}déterminer ce qui, souvent, contribue au bien-être{/green} est possible, c'est le conseil.

    **Pourquoi « tout à fait » ?** L'insolubilité n'est pas une difficulté qu'un esprit plus fin surmonterait : elle découle de l'omniscience qu'il faudrait. {coral}Un problème dont la solution exigerait de tout savoir n'a pas de solution pour un être fini.{/coral}

    **Que veut dire « insoluble » ici ?** Dire qu'un problème est insoluble par principe, c'est dire qu'il est {red}mal posé{/red} : un {amber}faux problème{/amber}, qu'il n'y a pas lieu de chercher à résoudre. {coral}Le problème des moyens du bonheur n'est pas un problème *de* la raison{/coral}, ni même une tâche qu'elle pourrait se donner, comme elle se donne de s'approcher sans fin de ses idées. C'est ce que la dernière phrase va expliquer : le bonheur n'est pas un idéal de la raison.

    ! Insoluble ne veut pas dire qu'on ne peut pas {red}être heureux{/red} : on peut l'être par chance, ou aidé de l'expérience ; on ne peut pas le {green}devenir à coup sûr, par une règle{/green}.
  passage:
    label: "Troisième moment"
    part: "3. La conclusion : un idéal de l'imagination"
    text: "le problème qui consiste à déterminer d'une façon sûre et générale quelle action peut favoriser le bonheur d'un être raisonnable est un problème tout à fait insoluble ;"
