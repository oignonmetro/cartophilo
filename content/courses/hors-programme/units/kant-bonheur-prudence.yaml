- id: kant-bonheur-prudence-p2e
  title: "Des conseils empiriques"
  notes: |-
    **La conséquence, introduite par « donc » :** {red}**pas de principes déterminés**{/red} **pour être heureux,** {amber}**seulement des conseils empiriques**{/amber}.

    ? **Conseil** : une règle qui {amber}recommande{/amber} un moyen comme utile le plus souvent, sans le présenter comme nécessaire. Elle vaut pour qui veut la suivre, et autant que l'expérience l'a confirmée.

    **Pourquoi « principes déterminés » contre « conseils empiriques » ?** Un {violet}principe déterminé{/violet} dirait ce qu'il faut faire, avec nécessité et pour tout être raisonnable. Un {violet}conseil empirique{/violet} dit ce qui, d'expérience, réussit d'ordinaire. Puisque nul ne peut savoir avec certitude ce qui rend heureux, {coral}il ne reste que le second{/coral}.

    **Pourquoi ces exemples, « un régime sévère, l'économie, la politesse, la réserve » ?** Ce sont {yellow}les maximes de la sagesse ordinaire{/yellow}, celles qu'on donne à un jeune homme qui entre dans le monde. Kant ne les méprise pas : elles {green}contribuent au bien-être{/green}. Mais aucune ne vaut absolument : {yellow}un régime sévère, utile au plus grand nombre, peut mener plus vite à la mort un maigre maladif{/yellow}.

    **Pourquoi « en thèse générale pour la plus grande part » ?** L'expression mesure exactement ce que l'expérience peut donner : une {amber}généralité comparative{/amber}, valable dans la plupart des cas, non une {red}universalité stricte{/red}, valable sans exception. {coral}Ce qui vient de l'expérience peut être général, jamais nécessaire.{/coral}

    ! Kant ne dit pas que les conseils sont {red}inutiles{/red} : ils sont utiles {green}en général{/green}. Il dit qu'ils ne peuvent pas commander.
  passage:
    label: "Deuxième moment"
    part: "2. La mineure : tout être fini"
    text: "On ne peut donc pas agir, pour être heureux, d'après des principes déterminés, mais seulement d'après des conseils empiriques, qui recommandent, par exemple, un régime sévère, l'économie, la politesse, la réserve, etc., toutes choses qui, selon les enseignements de l'expérience, contribuent en thèse générale pour la plus grande part au bien-être."
  points:
