# Squelette : six pistes, une par domaine philosophique (voir content/README.md
# « Publier le squelette d'un niveau avant son contenu »).
#
# `kind: grammar` sur chaque piste : c'est la nature de contenu décidée pour
# ce cours (voir CLAUDE.md « Non encore décidé » et content/philosophie.md).
# Le moteur grammar ne produit qu'un rappel de cours puis une phrase à trou,
# sans association ni QCM (à condition de ne jamais renseigner `options` sur
# un point), exactement le format demandé pour un contenu qui teste des
# notions et des raisonnements plutôt que des paires terme/traduction.

id: hors-programme
name: Hors-programme
learning: hors-programme
known: fr
flag: 🧭
tagline: "Sujet libre : tout peut tomber."
status: available
default: true
layout: library
version: 40

tracks:
  - id: morale
    title: La morale
    kind: grammar
    color: yellow
    icon: scale
    units:
      - m1
      - m2
      - m3
      - m4
      - m5
      - kant-bonheur-prudence
      - m6
      - m7
      - platon-phedon-morale
      - m8

  - id: metaphysique
    title: La métaphysique
    kind: grammar
    color: green
    icon: infinity
    # Sépare la morale du reste : elle seule, parmi ces six pistes, est
    # aussi au programme de l'oral.
    dividerBefore: true
    units: []

  - id: esthetique
    title: L'esthétique
    kind: grammar
    color: violet
    icon: palette
    units:
      - ea1
      - ea2
      - ea3
      - kant-beaux-arts
      - ea4

  - id: politique
    title: La politique
    kind: grammar
    color: red
    icon: column
    units:
      - p1
      - aristote-cite-homme-logos
      - rousseau-le-droit-du-plus-fort

  - id: sciences-humaines
    title: Les sciences humaines
    kind: grammar
    color: orange
    icon: people
    units: [rousseau-humanite, rousseau-nature-liberte, montaigne-la-force-de-la-tradition]

  - id: epistemologie
    title: L'épistémologie
    kind: grammar
    color: blue
    icon: magnify
    units: [pascal-les-deux-infinis-2, kant-le-courage-de-savoir]

  - id: reperages
    title: Repérages
    subtitle: Se situer dans les œuvres
    kind: grammar
    color: sky
    icon: compass
    # Les unités-repérage (voir content/oeuvres.md), toutes œuvres confondues,
    # à part des pistes par domaine : on y apprend le plan d'une œuvre, pas une
    # notion. Séparées comme la morale l'est du reste.
    dividerBefore: true
    units:
      - kant-analytique
      - rousseau-contrat-social
      - platon-textes
      - aristote-textes
      - descartes-textes
      - kant-textes
      - rousseau-textes
