<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Logo : deux cartes empilées (l'app est un jeu de fiches) portant un
       phi minuscule (φ), la lettre grecque de la philosophie. Reprend
       fidèlement le design fourni par l'utilisateur (proportions, couleurs
       et rotations converties depuis sa maquette 280px vers ce viewBox
       120px, facteur 3/7) — texte réel plutôt que forme dessinée, la
       police serif système couvrant le grec (voir tools/icons/build.ts,
       qui rasterise ce fichier : à re-tester si la police système change). -->
  <rect width="120" height="120" rx="24" fill="#3B2748"/>
  <rect x="36.86" y="24" width="70.29" height="84.86" rx="11.14" fill="#EFCB7A" transform="rotate(8 72 66.43)"/>
  <rect x="14.57" y="18.86" width="73.71" height="88.29" rx="11.14" fill="#F6EFE1" transform="rotate(-6 51.43 63)"/>
  <!-- Élargi (18 %) et pivoté avec la carte du dessus, même pivot que son
       propre rotate() ci-dessus : le phi suit la carte plutôt que de rester
       droit dessus. -->
  <g transform="rotate(-6 51.43 63)">
    <g transform="translate(51.43 63) scale(1.18 1) translate(-51.43 -63)">
      <text x="51.43" y="54.43" font-family="Georgia, 'Times New Roman', serif" font-size="64.29" fill="#3B2748" text-anchor="middle" dominant-baseline="central">&#966;</text>
    </g>
  </g>
</svg>
